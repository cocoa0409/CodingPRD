              as: CommercialManager
              as_user_id: "comm-1"
              captures: { ls_a: $.data.id }
            - call: "POST /wind-ops/landowner-settlements/${ls_a}/approve"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
            - call: "GET /wind-ops/turbines/${t_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t_v_seen: $.data.version }
            - call: "POST /wind-ops/turbines/${t_id}/scada-sync"
              payload: { operating_hours_delta: 12.0, actual_energy_kwh: 24000.0, potential_energy_kwh: 25000.0 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
          trigger:
            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-11", royalty_basis: "METERED_ONLY", period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 100000, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 0, expected_wind_farm_version: "${farm_v_seen}" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { err_farm: $.data.error_id }
            - call: "POST /wind-ops/turbines/${t_id}/curtailment-orders"
              payload: { reason: "NOISE", start_utc: "2026-08-02T00:00:00Z", end_utc: "2026-08-02T06:00:00Z", power_limit_kw: 1500, deemed_kwh_per_hour: 500, expected_turbine_version: "${t_v_seen}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_turbine: $.data.error_id }
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { farm_v_fresh: $.data.version }
            - call: "GET /wind-ops/turbines/${t_id}"
              payload: {}
              as: ControlRoomOperator
