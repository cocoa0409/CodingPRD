  # ===========================================================================
  # Guide section 2 - State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: lot_starts_in_draft_and_reaches_manifest_in_review_on_submission
        claim_type: Initial State
        grounds:
          - state_machines.Lot.initial_state
          - state_machines.Lot.DRAFT_to_MANIFEST_IN_REVIEW
          - endpoints[POST /liquidation/lots/{id}/manifest-submissions]
          - entities.Lot.fields.lot_status
        distinguishing_aspect: >
          A freshly created lot is DRAFT (never MANIFEST_IN_REVIEW), and the only trigger that
          advances it is the submission endpoint, which moves it to MANIFEST_IN_REVIEW while
          leaving manifest_reviewed_by_user_id and manifest_accuracy_score null.
        test_recipe:
          setup:
            - "One seller, one warehouse, one DRAFT lot carrying a single ACTIVE line (100 x 40000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
          trigger:
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
          assert:
            - "at creation Lot.${lot1}.lot_status == DRAFT"
            - "after the submission Lot.${lot1}.lot_status == MANIFEST_IN_REVIEW"
            - "Lot.${lot1}.manifest_reviewed_by_user_id == null and manifest_accuracy_score == null"
            - "Lot.${lot1}.declared_unit_count == 100 and declared_retail_value_cents == 4000000"

      - name: second_manifest_review_on_approved_lot_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Lot.MANIFEST_IN_REVIEW_to_MANIFEST_APPROVED
          - validations[priority 9 -> ERR_LOT_STATE_INVALID]
          - errors[ERR_LOT_STATE_INVALID]
          - entities.Lot.fields.manifest_reviewed_by_user_id
        distinguishing_aspect: >
          The review trigger is not idempotent: replaying APPROVE on a lot already in
          MANIFEST_APPROVED returns ERR_LOT_STATE_INVALID (409) and does not overwrite
          manifest_reviewed_by_user_id with the second operator's id.
        test_recipe:
          setup:
            - "One seller, one warehouse, one lot approved by MarketplaceOps operator ops-review-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
