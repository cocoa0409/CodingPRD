# =============================================================================
# SCAFFOLD.yaml — Public Library Management (task_0251)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  251. Public Library Management: catalog/holdings, patron card & limits,
  checkout/renewal/holds queue, due date & overdue policy (fine/fine-free),
  inter-library loan, room/computer reservation, lost-item billing, e-book
  lending license pool

domain_name: public-library-management
api_prefix: /library

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  # Peer entities linked by foreign keys under a single /library namespace; no
  # entity is nested inside another's URL path. Collections are flat siblings.
  state_machine_shape: cyclic
  # Loan renewal is a self-loop (ACTIVE->ACTIVE); Hold queue promotion loops;
  # Reservation branches CONFIRMED->{CHECKED_IN,NO_SHOW,CANCELLED}.
  relationship_patterns:
    - one_to_many        # Title 1—* Copy; Patron 1—* Loan; LicensePool 1—* EbookLoan
    - cross_aggregate    # Loan references Copy and Patron across aggregate roots
  role_model: peer_roles
  # Patron owns own loans/holds/reservations/ill/ebook-loans; Librarian runs the
  # circulation desk; BranchManager owns branch policy + resources + waivers.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: fine_free, type: boolean, source: input, default: false, description: "When true the branch assesses zero overdue fines (fine-free policy); overdue loans still block via OVERDUE state but accrue no money" }
      - { name: daily_fine_cents, type: integer, source: input, default: 25, description: "Overdue fine charged per overdue day per loan, in cents; ignored when fine_free=true" }
      - { name: max_fine_cents, type: integer, source: input, default: 1000, description: "Per-loan cap on accrued overdue fine, in cents" }
      - { name: grace_days, type: integer, source: input, default: 1, description: "Number of whole days after due_date that accrue no fine; day index <= grace_days is free, day index > grace_days is charged" }
      - { name: loan_period_days, type: integer, source: input, default: 21, description: "Default loan length in days used to compute due_date at checkout" }
      - { name: block_threshold_cents, type: integer, source: input, default: 1000, description: "When a patron's total_owed_cents reaches this value the patron is BLOCKED from new checkouts/holds/reservations" }
      - { name: reservation_buffer_minutes, type: integer, source: input, default: 15, description: "Cleanup gap required between two ROOM bookings on the same resource" }

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; home branch whose policy governs this patron" }
      - { name: full_name, type: string, source: input, description: "Patron full name" }
      - { name: patron_type, type: enum, source: input, default: ADULT, description: "ADULT | JUVENILE | STAFF; governs checkout_limit and hold_limit defaults", constraints: "one of ADULT, JUVENILE, STAFF" }
      - { name: card_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | EXPIRED; SUSPENDED/EXPIRED block borrowing", constraints: "one of ACTIVE, SUSPENDED, EXPIRED" }
      - { name: borrowing_status, type: enum, source: computed, default: CLEAR, description: "CLEAR | BLOCKED; BLOCKED when total_owed_cents >= branch.block_threshold_cents", constraints: "one of CLEAR, BLOCKED" }
      - { name: checkout_limit, type: integer, source: input, default: 20, description: "Max ACTIVE+OVERDUE physical loans open at once for the patron" }
      - { name: hold_limit, type: integer, source: input, default: 10, description: "Max WAITING+READY holds open at once for the patron" }
      - { name: active_loan_count, type: integer, source: computed, description: "Count of this patron's loans whose status is ACTIVE or OVERDUE" }
      - { name: active_hold_count, type: integer, source: computed, description: "Count of this patron's holds whose status is WAITING or READY" }
      - { name: total_owed_cents, type: integer, source: computed, description: "Sum over this patron's fines with settlement_status=UNPAID of fine.amount_cents" }
      - { name: ready_pickup_count, type: integer, source: computed, description: "Count of this patron's holds whose status is READY (denormalized pickup notification counter)" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; owning branch of the bibliographic record" }
      - { name: isbn, type: string, source: input, description: "ISBN-13 bibliographic key" }
      - { name: title_text, type: string, source: input, description: "Title of the work" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | WITHDRAWN; WITHDRAWN titles accept no new copies/holds", constraints: "one of ACTIVE, WITHDRAWN" }
      - { name: default_replacement_cents, type: integer, source: input, default: 3000, description: "Default list price used for lost-item replacement charge before depreciation" }
      - { name: available_copy_count, type: integer, source: computed, description: "Count of this title's copies whose status is AVAILABLE (denormalized; reconciled on every copy/loan/hold mutation)" }
      - { name: total_copy_count, type: integer, source: computed, description: "Count of this title's copies whose status is not WITHDRAWN" }
      - { name: waiting_hold_count, type: integer, source: computed, description: "Count of this title's holds whose status is WAITING" }

  - name: Copy
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; bibliographic parent" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; shelving branch" }
      - { name: barcode, type: string, source: input, description: "Physical item barcode" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | ON_LOAN | ON_HOLD_SHELF | LOST | WITHDRAWN", constraints: "one of AVAILABLE, ON_LOAN, ON_HOLD_SHELF, LOST, WITHDRAWN" }
      - { name: acquired_on, type: datetime, source: input, description: "Acquisition date; basis for depreciation age in lost-item billing" }
      - { name: condition_factor, type: number, source: input, default: 1.0, description: "Multiplier 0.0–1.0 applied to depreciated value for the DEPRECIATED replacement variant" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: copy_id, type: string, source: input, description: "FK -> Copy.id; the physical item on loan" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the borrower" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OVERDUE | RETURNED | LOST", constraints: "one of ACTIVE, OVERDUE, RETURNED, LOST" }
      - { name: checked_out_at, type: datetime, source: system, description: "Server clock at checkout" }
      - { name: due_date, type: datetime, source: computed, description: "checked_out_at + branch.loan_period_days; advanced by branch.loan_period_days on each renewal" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of renewals applied; capped at MAX_RENEWALS" }
      - { name: returned_at, type: datetime, source: system, description: "Server clock at check-in; null until RETURNED" }
      - { name: accrued_fine_cents, type: integer, source: computed, description: "Final overdue fine assessed at check-in via overdue_fine_final; 0 until RETURNED/LOST" }

  - name: Hold
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the requested work" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the requester" }
      - { name: status, type: enum, source: system, default: WAITING, description: "WAITING | READY | FULFILLED | CANCELLED | EXPIRED", constraints: "one of WAITING, READY, FULFILLED, CANCELLED, EXPIRED" }
      - { name: queue_position, type: integer, source: computed, description: "1-based position among WAITING holds on the title, ordered by Hold.created_at ascending" }
      - { name: ready_copy_id, type: string, source: system, description: "FK -> Copy.id; copy reserved on the hold shelf when status=READY, else null" }
      - { name: ready_at, type: datetime, source: system, description: "Server clock when promoted to READY; null otherwise" }
      - { name: pickup_deadline, type: datetime, source: computed, description: "ready_at + PICKUP_WINDOW_DAYS; hold EXPIRES if not picked up by then" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: resource_id, type: string, source: input, description: "FK -> BookableResource.id; the room or computer station pool reserved" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the reserving patron" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CONFIRMED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", constraints: "one of REQUESTED, CONFIRMED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED" }
      - { name: start_at, type: datetime, source: input, description: "Half-open interval start [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Half-open interval end (exclusive)" }
      - { name: checked_in_at, type: datetime, source: system, description: "Server clock at check-in; null otherwise" }

  - name: BookableResource
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch that owns the resource" }
      - { name: resource_kind, type: enum, source: input, description: "ROOM | COMPUTER; ROOM is exclusive-with-buffer, COMPUTER is aggregate-capacity", constraints: "one of ROOM, COMPUTER" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Study Room A' or 'Public PC Bank'" }
      - { name: capacity, type: integer, source: input, default: 1, description: "ROOM ignores this (treated as exclusive, capacity 1). COMPUTER: number of stations permitted to overlap in any window (aggregate capacity)" }
      - { name: status, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | OUT_OF_SERVICE; OUT_OF_SERVICE blocks new reservations and check-in", constraints: "one of IN_SERVICE, OUT_OF_SERVICE" }

  - name: IllRequest
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; requesting patron" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; borrowing branch handling the request" }
      - { name: isbn, type: string, source: input, description: "ISBN of the requested external work" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | SHIPPED | RECEIVED | RETURNED | DENIED", constraints: "one of REQUESTED, APPROVED, SHIPPED, RECEIVED, RETURNED, DENIED" }
      - { name: lending_fee_cents, type: integer, source: input, default: 500, description: "Fee billed to the patron when the ILL item is RECEIVED" }

  - name: LicensePool
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; bibliographic work this pool lends electronically" }
      - { name: total_licenses, type: integer, source: input, description: "Total e-book licenses owned (max active e-book loans at once)" }
      - { name: loan_term_days, type: integer, source: input, default: 14, description: "Fixed e-book loan length; EbookLoan.expires_at = checkout + loan_term_days" }
      - { name: loaned_licenses, type: integer, source: computed, description: "Count of this pool's ebook_loans whose status is ACTIVE" }
      - { name: available_licenses, type: integer, source: computed, description: "total_licenses - loaned_licenses; never negative" }

  - name: EbookLoan
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> LicensePool.id; license pool consumed" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the e-borrower" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETURNED | EXPIRED", constraints: "one of ACTIVE, RETURNED, EXPIRED" }
      - { name: checked_out_at, type: datetime, source: system, description: "Server clock at e-checkout" }
      - { name: expires_at, type: datetime, source: computed, description: "checked_out_at + pool.loan_term_days; license auto-releases on/after this instant via run_expiry" }

  - name: Fine
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the billed patron" }
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; originating loan for OVERDUE/LOST fines, null for ILL fees" }
      - { name: fine_type, type: enum, source: system, description: "OVERDUE | LOST | ILL_FEE", constraints: "one of OVERDUE, LOST, ILL_FEE" }
      - { name: amount_cents, type: integer, source: computed, description: "Charge amount in cents; for LOST computed via replacement_charge, for OVERDUE via overdue_fine_final, for ILL_FEE the IllRequest.lending_fee_cents" }
      - { name: settlement_status, type: enum, source: system, default: UNPAID, description: "UNPAID | PAID | WAIVED", constraints: "one of UNPAID, PAID, WAIVED" }
      - { name: settled_at, type: datetime, source: system, description: "Server clock when PAID or WAIVED; null while UNPAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    field: status
    initial_state: ACTIVE
    terminal_states: [RETURNED, LOST]
    note: "Renewal is a self-loop on ACTIVE (cyclic shape). RETURNED and LOST are terminal."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /library/loans/{id}/renew"
        actor: Patron
        preconditions:
          - "Loan.status == ACTIVE (not yet OVERDUE)"
          - "Loan.renewal_count < MAX_RENEWALS (2)"
          - "No WAITING or READY Hold exists on the loan's Copy.title_id (cross-entity: Loan renewal blocked by Hold demand)"
          - "acting Patron.id == Loan.patron_id"
        side_effects:
          - "renewal_count += 1"
          - "due_date += branch.loan_period_days"
          - "increments Loan.version by 1"

      - from: ACTIVE
        to: OVERDUE
        trigger: "POST /library/_clock/advance then POST /library/loans/{id}/refresh-overdue (system clock has passed due_date)"
        actor: Librarian
        preconditions:
          - "server clock now > Loan.due_date"
          - "Loan.status == ACTIVE"
        side_effects:
          - "status -> OVERDUE"
          - "increments Loan.version by 1"

      - from: [ACTIVE, OVERDUE]
        to: RETURNED
        trigger: "POST /library/loans/{id}/checkin"
        actor: Librarian
        preconditions:
          - "Loan.status in {ACTIVE, OVERDUE}"
        side_effects:
          - "returned_at = clock now"
          - "accrued_fine_cents = overdue_fine_final(this loan) (0 when branch.fine_free or not overdue past grace)"
          - "if accrued_fine_cents > 0: create Fine(fine_type=OVERDUE, amount_cents=accrued_fine_cents, settlement_status=UNPAID) -> patron.total_owed_cents recomputed -> patron.borrowing_status recomputed (CASCADE: Loan -> Fine -> Patron.total_owed_cents -> Patron.borrowing_status)"
          - "Copy.status: ON_LOAN -> AVAILABLE; then title.available_copy_count recomputed"
          - "HOLD PROMOTION CASCADE: if a WAITING Hold exists on Copy.title_id, the head hold (lowest queue_position) WAITING -> READY (Copy.status AVAILABLE -> ON_HOLD_SHELF; Hold.ready_copy_id set; patron.ready_pickup_count recomputed)"
          - "increments Loan.version by 1"

      - from: [ACTIVE, OVERDUE]
        to: LOST
        trigger: "POST /library/loans/{id}/declare-lost"
        actor: Librarian
        preconditions:
          - "Loan.status in {ACTIVE, OVERDUE}"
        side_effects:
          - "LOST BILLING CASCADE (depth>=4): status -> LOST; Copy.status -> LOST; create Fine(fine_type=LOST, amount_cents=replacement_charge(copy)) ; patron.total_owed_cents recomputed; if patron.total_owed_cents >= branch.block_threshold_cents then patron.borrowing_status -> BLOCKED"
          - "title.available_copy_count and title.total_copy_count recomputed (LOST copy leaves the AVAILABLE pool)"
          - "increments Loan.version by 1"

  - entity: Hold
    field: status
    initial_state: WAITING
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    note: "Queue with promotion loop: WAITING->READY->FULFILLED, plus READY->EXPIRED re-promotes the next WAITING hold (cyclic promotion)."
    transitions:
      - from: WAITING
        to: READY
        trigger: "system (on Loan checkin or Copy becomes AVAILABLE while this is the head WAITING hold)"
        actor: system
        preconditions:
          - "this Hold is the head of the WAITING queue on its title (lowest queue_position among WAITING)"
          - "a Copy of the title is AVAILABLE to reserve"
        side_effects:
          - "ready_copy_id = the reserved Copy.id; Copy.status AVAILABLE -> ON_HOLD_SHELF"
          - "ready_at = clock now; pickup_deadline = ready_at + PICKUP_WINDOW_DAYS"
          - "patron.ready_pickup_count recomputed"
          - "increments Hold.version by 1"

      - from: READY
        to: FULFILLED
        trigger: "POST /library/holds/{id}/checkout (patron picks up the held copy as a Loan)"
        actor: Librarian
        preconditions:
          - "Hold.status == READY"
          - "now <= Hold.pickup_deadline"
          - "acting on behalf of Hold.patron_id"
        side_effects:
          - "creates Loan on ready_copy_id for Hold.patron_id (Copy.status ON_HOLD_SHELF -> ON_LOAN)"
          - "remaining WAITING holds queue_position recomputed"
          - "patron.ready_pickup_count recomputed"
          - "increments Hold.version by 1"

      - from: READY
        to: EXPIRED
        trigger: "POST /library/holds/{id}/expire-ready (now > pickup_deadline)"
        actor: Librarian
        preconditions:
          - "Hold.status == READY"
          - "server clock now > Hold.pickup_deadline"
        side_effects:
          - "PROMOTION LOOP: Copy.status ON_HOLD_SHELF -> AVAILABLE; if another WAITING hold exists it is promoted WAITING -> READY (re-reserving the copy); else Copy stays AVAILABLE and title.available_copy_count recomputed"
          - "patron.ready_pickup_count recomputed"
          - "increments Hold.version by 1"

      - from: [WAITING, READY]
        to: CANCELLED
        trigger: "POST /library/holds/{id}/cancel"
        actor: Patron
        preconditions:
          - "Hold.status in {WAITING, READY}"
          - "acting Patron.id == Hold.patron_id"
        side_effects:
          - "if was READY: Copy.status ON_HOLD_SHELF -> AVAILABLE and promote next WAITING hold if any (same promotion loop)"
          - "remaining WAITING holds queue_position recomputed"
          - "patron.ready_pickup_count recomputed"
          - "increments Hold.version by 1"

  - entity: Reservation
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    note: "Branching shape: CONFIRMED forks to CHECKED_IN, NO_SHOW, or CANCELLED with divergent side-effects."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /library/reservations/{id}/confirm"
        actor: Librarian
        preconditions:
          - "Reservation.status == REQUESTED"
          - "BookableResource.status == IN_SERVICE (cross-entity: Reservation depends on BookableResource)"
        side_effects:
          - "status -> CONFIRMED"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /library/reservations/{id}/checkin"
        actor: Librarian
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "BookableResource.status == IN_SERVICE (cross-entity: check-in blocked if resource OUT_OF_SERVICE)"
          - "server clock now >= Reservation.start_at"
        side_effects:
          - "checked_in_at = clock now; status -> CHECKED_IN"
          - "increments Reservation.version by 1"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /library/reservations/{id}/complete"
        actor: Librarian
        preconditions:
          - "Reservation.status == CHECKED_IN"
        side_effects:
          - "status -> COMPLETED (frees the window for future bookings; COMPLETED no longer counts as an occupying interval)"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /library/reservations/{id}/no-show (server clock now >= Reservation.end_at and never checked in)"
        actor: Librarian
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "server clock now >= Reservation.end_at"
        side_effects:
          - "status -> NO_SHOW (divergent branch: frees the window AND does not record check-in)"
          - "increments Reservation.version by 1"

      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /library/reservations/{id}/cancel"
        actor: Patron
        preconditions:
          - "Reservation.status in {REQUESTED, CONFIRMED}"
          - "acting Patron.id == Reservation.patron_id"
        side_effects:
          - "status -> CANCELLED (frees the window; no check-in recorded)"
          - "increments Reservation.version by 1"

  - entity: EbookLoan
    field: status
    initial_state: ACTIVE
    terminal_states: [RETURNED, EXPIRED]
    note: "Quota token lifecycle; ACTIVE holds a license, RETURNED/EXPIRED release it."
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /library/ebook-loans/{id}/return"
        actor: Patron
        preconditions:
          - "EbookLoan.status == ACTIVE"
          - "acting Patron.id == EbookLoan.patron_id"
        side_effects:
          - "status -> RETURNED; pool.loaned_licenses recomputed; pool.available_licenses recomputed (license token conserved)"
          - "increments EbookLoan.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /library/license-pools/{id}/run-expiry (server clock now >= EbookLoan.expires_at)"
        actor: Librarian
        preconditions:
          - "EbookLoan.status == ACTIVE"
          - "server clock now >= EbookLoan.expires_at"
        side_effects:
          - "status -> EXPIRED; pool.loaned_licenses recomputed; pool.available_licenses recomputed (token released back to pool)"
          - "increments EbookLoan.version by 1"

  - entity: IllRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [RETURNED, DENIED]
    note: "Linear approval pipeline with a reject branch at the REQUESTED stage."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /library/ill-requests/{id}/approve"
        actor: Librarian
        preconditions:
          - "IllRequest.status == REQUESTED"
          - "requesting Patron.borrowing_status == CLEAR (cross-entity: ILL approval depends on Patron)"
        side_effects:
          - "status -> APPROVED"
          - "increments IllRequest.version by 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /library/ill-requests/{id}/deny"
        actor: Librarian
        preconditions:
          - "IllRequest.status == REQUESTED"
        side_effects:
          - "status -> DENIED"
          - "increments IllRequest.version by 1"

      - from: APPROVED
        to: SHIPPED
        trigger: "POST /library/ill-requests/{id}/ship"
        actor: Librarian
        preconditions:
          - "IllRequest.status == APPROVED"
        side_effects:
          - "status -> SHIPPED"
          - "increments IllRequest.version by 1"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /library/ill-requests/{id}/receive"
        actor: Librarian
        preconditions:
          - "IllRequest.status == SHIPPED"
        side_effects:
          - "status -> RECEIVED; create Fine(fine_type=ILL_FEE, amount_cents=lending_fee_cents, loan_id=null); patron.total_owed_cents recomputed -> patron.borrowing_status recomputed"
          - "increments IllRequest.version by 1"

      - from: RECEIVED
        to: RETURNED
        trigger: "POST /library/ill-requests/{id}/return"
        actor: Librarian
        preconditions:
          - "IllRequest.status == RECEIVED"
        side_effects:
          - "status -> RETURNED"
          - "increments IllRequest.version by 1"

  - entity: Fine
    field: settlement_status
    initial_state: UNPAID
    terminal_states: [PAID, WAIVED]
    note: "Settlement of a fine recomputes patron balance and may clear a BLOCK."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /library/fines/{id}/pay"
        actor: Librarian
        preconditions:
          - "Fine.settlement_status == UNPAID"
        side_effects:
          - "settled_at = clock now; patron.total_owed_cents recomputed; if total_owed_cents < branch.block_threshold_cents then patron.borrowing_status -> CLEAR"
          - "increments Fine.version by 1"

      - from: UNPAID
        to: WAIVED
        trigger: "POST /library/fines/{id}/waive"
        actor: BranchManager
        preconditions:
          - "Fine.settlement_status == UNPAID"
        side_effects:
          - "settled_at = clock now; patron.total_owed_cents recomputed; if total_owed_cents < branch.block_threshold_cents then patron.borrowing_status -> CLEAR"
          - "increments Fine.version by 1"

  - entity: Copy
    field: status
    initial_state: AVAILABLE
    terminal_states: [WITHDRAWN]
    note: "Copy status is system-driven: it changes only as a side-effect of Loan, Hold, and Title transitions, never via a direct Copy endpoint. Listed here so its cross-entity transitions are auditable."
    transitions:
      - from: AVAILABLE
        to: ON_LOAN
        trigger: "system (POST /library/loans checkout, or POST /library/holds/{id}/checkout)"
        actor: system
        preconditions:
          - "Copy.status == AVAILABLE"
        side_effects:
          - "title.available_copy_count recomputed"

      - from: ON_LOAN
        to: AVAILABLE
        trigger: "system (Loan ACTIVE/OVERDUE -> RETURNED checkin, when no WAITING hold consumes the copy)"
        actor: system
        preconditions:
          - "Copy.status == ON_LOAN"
        side_effects:
          - "title.available_copy_count recomputed"

      - from: AVAILABLE
        to: ON_HOLD_SHELF
        trigger: "system (Hold WAITING -> READY promotion reserves this copy)"
        actor: system
        preconditions:
          - "Copy.status == AVAILABLE"
        side_effects:
          - "title.available_copy_count recomputed"

      - from: ON_HOLD_SHELF
        to: ON_LOAN
        trigger: "system (POST /library/holds/{id}/checkout fulfils the hold)"
        actor: system
        preconditions:
          - "Copy.status == ON_HOLD_SHELF"
        side_effects: []

      - from: ON_HOLD_SHELF
        to: AVAILABLE
        trigger: "system (Hold READY -> EXPIRED/CANCELLED releases the copy, no further WAITING hold to promote)"
        actor: system
        preconditions:
          - "Copy.status == ON_HOLD_SHELF"
        side_effects:
          - "title.available_copy_count recomputed"

      - from: ON_LOAN
        to: LOST
        trigger: "system (Loan ACTIVE/OVERDUE -> LOST declare-lost)"
        actor: system
        preconditions:
          - "Copy.status == ON_LOAN"
        side_effects:
          - "title.available_copy_count and total_copy_count recomputed"

      - from: AVAILABLE
        to: WITHDRAWN
        trigger: "system (Title ACTIVE -> WITHDRAWN withdraws AVAILABLE copies)"
        actor: system
        preconditions:
          - "Copy.status == AVAILABLE"
        side_effects:
          - "title.total_copy_count recomputed"

  - entity: Title
    field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    note: "Linear withdrawal with a cascade fan to copies and holds."
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /library/titles/{id}/withdraw"
        actor: BranchManager
        preconditions:
          - "Title.status == ACTIVE"
        side_effects:
          - "every AVAILABLE Copy of the title -> WITHDRAWN (ON_LOAN/ON_HOLD_SHELF copies are left until returned)"
          - "every WAITING/READY Hold on the title -> CANCELLED"
          - "increments Title.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-create-stale-resource
    parent_entity: BookableResource
    write_endpoint: "POST /library/reservations"
    occ_field: "expected_resource_version"
    description: |
      Creating a Reservation against a BookableResource whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A COMPUTER resource with capacity N admits multiple non-overlapping
      and even overlapping bookings up to capacity, so a second booking for the
      same window does not violate any state precondition on its own and would
      legitimately succeed — but if a prior writer already created a booking that
      consumed the last station in that window, the current writer's view of the
      resource is stale. OCC on BookableResource.version reduces this to a
      deterministic stale-version check between two strictly sequential requests.
    error_id: ERR_STALE_RESOURCE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: overdue_fine_final
    trigger: "Loan checkin (state_machines.Loan ACTIVE/OVERDUE -> RETURNED side_effect sets accrued_fine_cents)"
    algorithm: chronological
    formula: |
      # Chronological day-by-day accrual capped per loan.
      if branch.fine_free == true: return 0
      overdue_days = max(0, floor_days(returned_at - due_date))   # whole UTC days elapsed past due_date
      chargeable_days = max(0, overdue_days - branch.grace_days)  # day index <= grace_days is free
      raw = chargeable_days * branch.daily_fine_cents
      return min(raw, branch.max_fine_cents)
    input_set: "single Loan being checked in; returned_at = server clock at checkin; due_date is the loan's (renewal-advanced) due_date"
    constants:
      ROUNDING: "integer cents; floor_days truncates partial days toward zero"
    precision: "whole cents"
    variants:
      - name: overdue_fine_estimate
        when: "GET /library/loans/{id}/fine-estimate with a projected_return query date (forward-looking projection BEFORE checkin)"
        difference: |
          Forward-looking: overdue_days = max(0, floor_days(projected_return - due_date)) using the
          CLIENT-SUPPLIED projected_return instead of an actual returned_at; otherwise identical cap/grace
          logic. For identical (due_date, branch) the estimate and the final diverge whenever
          projected_return != actual returned_at, so the same loan yields two different fine numbers.

  - name: replacement_charge
    trigger: "Loan declare-lost (state_machines.Loan ACTIVE/OVERDUE -> LOST side_effect creates Fine.amount_cents)"
    algorithm: weighted_scoring
    formula: |
      # Mode (b) of Rule 2: nested rounding where order is pinned.
      # Component 1: depreciated item value.
      age_years = floor_days(lost_at - copy.acquired_on) / 365      # fractional years
      depreciation = min(MAX_DEPRECIATION_PCT, age_years * ANNUAL_DEPRECIATION_PCT)  # cap at 0.80
      item_value_cents = round_half_up( title.default_replacement_cents
                                        * (1 - depreciation)
                                        * copy.condition_factor )    # ROUND component 1 to whole cents FIRST
      # Component 2: flat processing fee.
      processing_cents = round_half_up( title.default_replacement_cents * PROCESSING_FEE_PCT )  # ROUND component 2 FIRST
      # PINNED ORDER: round each component to whole cents, THEN sum (NOT sum-then-round).
      return item_value_cents + processing_cents
    input_set: "single Copy via its Loan; lost_at = server clock at declare-lost"
    constants:
      ANNUAL_DEPRECIATION_PCT: 0.10
      MAX_DEPRECIATION_PCT: 0.80
      PROCESSING_FEE_PCT: 0.10
      ROUNDING: round_half_up
    precision: "whole cents; round_half_up on each component independently, then sum"
    variants:
      - name: replacement_charge_default
        when: "branch policy override flag use_flat_replacement (passed on declare-lost as flat_replacement=true)"
        difference: |
          Default variant ignores depreciation and condition_factor entirely:
          item_value_cents = title.default_replacement_cents, processing_cents as above, then sum.
          DEPRECIATED (base) and DEFAULT diverge for any copy older than 0 days or condition_factor < 1.0.

  - name: capped_account_balance
    trigger: "GET /library/patrons/{id}/account-summary; recomputed reads on Patron.total_owed_cents"
    algorithm: aggregation
    formula: |
      # Mode (c) of Rule 2: evaluation order pinned to break a circular-looking dependency.
      # raw_total depends on fines; waiver depends on the TIER of raw_total; net depends on waiver.
      # PINNED ORDER: (1) compute raw_total, (2) determine tier from raw_total, (3) apply waiver, (4) clamp.
      raw_total_cents = sum( fine.amount_cents for fine in patron.fines if fine.settlement_status == 'UNPAID' )
      if raw_total_cents >= GOODWILL_TIER_CENTS:        # tier keyed on the PRE-waiver total
          waiver_cents = GOODWILL_WAIVER_CENTS
      else:
          waiver_cents = 0
      net_owed_cents = max(0, raw_total_cents - waiver_cents)
      return { raw_total_cents, waiver_cents, net_owed_cents }
    input_set: "all of the patron's Fine rows with settlement_status=UNPAID"
    constants:
      GOODWILL_TIER_CENTS: 2000
      GOODWILL_WAIVER_CENTS: 200
    precision: "whole cents"
    variants:
      - name: account_summary_excludes_settled
        when: "always — PAID and WAIVED fines are excluded from raw_total"
        difference: "Filters to settlement_status=UNPAID only; a PAID/WAIVED fine drops out of raw_total and can change the tier."

  - name: reservation_overlap_room
    trigger: "POST /library/reservations create / POST /library/reservations/{id}/confirm on a ROOM resource"
    algorithm: interval_merge
    formula: |
      # Rule 8 instance A: ROOM = exclusive interval with mandatory buffer gap.
      # Two ROOM bookings conflict if their half-open windows, each EXPANDED by
      # reservation_buffer_minutes on the end side, intersect.
      conflict = exists other Reservation R on same resource_id with
                 R.status in {REQUESTED, CONFIRMED, CHECKED_IN} and
                 (new.start_at < R.end_at + buffer) and (R.start_at < new.end_at + buffer)
      # Adjacency within buffer minutes is a CONFLICT (rooms need cleanup time).
    input_set: "active (REQUESTED/CONFIRMED/CHECKED_IN) Reservations on the same ROOM resource"
    constants:
      INTERVAL: "half-open [start_at, end_at); buffer = branch.reservation_buffer_minutes applied to the end side"
    precision: "minute granularity"

  - name: reservation_overlap_computer
    trigger: "POST /library/reservations create / POST /library/reservations/{id}/confirm on a COMPUTER resource"
    algorithm: interval_merge
    formula: |
      # Rule 8 instance B: COMPUTER = aggregate-capacity over time, NO buffer.
      # A booking is rejected only if at any instant in [new.start_at, new.end_at)
      # the count of overlapping active reservations would reach capacity.
      overlapping = [ R for R in active Reservations on same resource_id
                      if R.start_at < new.end_at and new.start_at < R.end_at ]   # strict half-open, no buffer
      # Peak concurrency = max over all interval endpoints of overlapping coverage.
      reject if peak_concurrency(overlapping + [new]) > capacity
    input_set: "active (REQUESTED/CONFIRMED/CHECKED_IN) Reservations on the same COMPUTER resource"
    constants:
      INTERVAL: "half-open [start_at, end_at); NO buffer; aggregate capacity = resource.capacity"
    precision: "minute granularity"

  - name: hold_queue_position
    trigger: "Hold create, Hold cancel, Hold checkout, Hold promotion, Hold expire"
    algorithm: aggregation
    formula: |
      # 1-based position among WAITING holds on the title, ordered by Hold.created_at ASC.
      ordered = sort([h for h in title.holds if h.status == 'WAITING'], key=created_at ASC)
      queue_position = index_of(self in ordered) + 1   # READY/terminal holds have queue_position = 0
    input_set: "all WAITING holds on the title"
    precision: "integer; tie-break created_at ASC (never id)"

  - name: pool_license_availability
    trigger: "EbookLoan checkout, return, expiry"
    algorithm: aggregation
    formula: |
      loaned_licenses = count( ebook_loan for pool.ebook_loans if status == 'ACTIVE' )
      available_licenses = max(0, total_licenses - loaned_licenses)
    input_set: "all ACTIVE ebook_loans on the pool"
    precision: "integer"

  - name: patron_balance_and_block
    trigger: "Fine create (overdue/lost/ill), Fine pay, Fine waive"
    algorithm: aggregation
    formula: |
      total_owed_cents = sum( fine.amount_cents for fine in patron.fines if settlement_status == 'UNPAID' )
      borrowing_status = BLOCKED if total_owed_cents >= branch.block_threshold_cents else CLEAR
    input_set: "all of the patron's UNPAID fines; branch resolved via patron.branch_id"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role (Patron, Librarian, BranchManager); X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7; entity_backed Patron acting on a resource must own it (X-User-ID == resource.patron_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right; FK targets resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Required body fields present and well-typed; enum values within declared domain"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (loans, holds, reservations, ill-requests, ebook-loans, fines)"

  - priority: 6
    category: business_referential
    check: "Cross-entity reference state: Copy AVAILABLE for checkout; BookableResource IN_SERVICE for reserve/confirm/checkin; Title ACTIVE for new copies/holds; LicensePool has the title ACTIVE"
    error_id: ERR_RESOURCE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /library/loans, POST /library/reservations, reservation confirm/checkin, POST /library/copies, POST /library/holds"

  - priority: 7
    category: state
    check: "Patron card_status must be ACTIVE (not SUSPENDED/EXPIRED) for checkout, hold, reservation, ebook checkout, ILL request"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /library/loans, POST /library/holds, POST /library/reservations, POST /library/ebook-loans, POST /library/ill-requests"

  - priority: 8
    category: business_safety
    check: "Patron.borrowing_status must be CLEAR (not BLOCKED by fines) to checkout, place a hold, check out an e-book, or reserve a room/computer"
    error_id: ERR_PATRON_BLOCKED
    http_status: 409
    applies_to: "POST /library/loans, POST /library/holds, POST /library/ebook-loans, POST /library/reservations"

  - priority: 9
    category: business_temporal
    check: "Reservation interval does not collide with existing active reservations per the resource's interval semantics (ROOM exclusive+buffer; COMPUTER aggregate-capacity); end_at > start_at"
    error_id: ERR_RESERVATION_CONFLICT
    http_status: 409
    applies_to: "POST /library/reservations"

  - priority: 10
    category: business_constraint
    check: "Patron checkout_limit not exceeded by a new physical loan; hold_limit not exceeded by a new hold; renewal_count < MAX_RENEWALS for renew; no WAITING/READY hold on the title for renew"
    error_id: ERR_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /library/loans, POST /library/holds, POST /library/loans/{id}/renew"

  - priority: 11
    category: business_fiscal
    check: "License pool has available_licenses >= 1 for an e-book checkout (quota/availability check)"
    error_id: ERR_NO_LICENSE_AVAILABLE
    http_status: 409
    applies_to: "POST /library/ebook-loans"

  - priority: 12
    category: business_fiscal
    check: "OCC: expected_resource_version matches BookableResource.version on reservation create"
    error_id: ERR_STALE_RESOURCE_VERSION
    http_status: 412
    applies_to: "POST /library/reservations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Branch ----------------
  - method: POST
    path: "/library/branches"
    description: "Create a branch with its fine/loan policy"
    roles: [BranchManager]
    code: 201
    input: [name, "fine_free?", "daily_fine_cents?", "max_fine_cents?", "grace_days?", "loan_period_days?", "block_threshold_cents?", "reservation_buffer_minutes?"]
    output: Branch
    side_effects: ["Branch created with policy defaults for any omitted field"]

  - method: GET
    path: "/library/branches/{id}"
    description: "Get a branch"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Branch
    side_effects: []

  - method: GET
    path: "/library/branches"
    description: "List branches"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Branch[]
    side_effects: []

  # ---------------- Patron ----------------
  - method: POST
    path: "/library/patrons"
    description: "Register a patron card"
    roles: [Librarian, BranchManager]
    code: 201
    input: [branch_id, full_name, "patron_type?", "checkout_limit?", "hold_limit?"]
    output: Patron
    side_effects: ["card_status=ACTIVE, borrowing_status=CLEAR, all counters 0"]

  - method: GET
    path: "/library/patrons/{id}"
    description: "Get a patron (counters reconciled on read)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Patron
    side_effects: ["Recompute active_loan_count, active_hold_count, total_owed_cents, borrowing_status, ready_pickup_count"]

  - method: GET
    path: "/library/patrons"
    description: "List/filter patrons by branch"
    roles: [Librarian, BranchManager]
    code: 200
    input: ["branch_id?", "limit?", "offset?"]
    output: Patron[]
    side_effects: []

  - method: POST
    path: "/library/patrons/{id}/set-card-status"
    description: "Suspend/reactivate/expire a patron card"
    roles: [Librarian, BranchManager]
    code: 200
    input: [card_status]
    output: Patron
    side_effects: ["card_status updated; increments Patron.version"]

  - method: GET
    path: "/library/patrons/{id}/account-summary"
    description: "Computed read: raw_total_cents, waiver_cents, net_owed_cents (capped_account_balance)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: "{ raw_total_cents: integer, waiver_cents: integer, net_owed_cents: integer, unpaid_fine_count: integer }"
    side_effects: []

  # ---------------- Title ----------------
  - method: POST
    path: "/library/titles"
    description: "Create a bibliographic title"
    roles: [Librarian, BranchManager]
    code: 201
    input: [branch_id, isbn, title_text, "default_replacement_cents?"]
    output: Title
    side_effects: ["status=ACTIVE, copy/hold counters 0"]

  - method: GET
    path: "/library/titles/{id}"
    description: "Get a title (copy/hold counters reconciled)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Title
    side_effects: ["Recompute available_copy_count, total_copy_count, waiting_hold_count"]

  - method: GET
    path: "/library/titles"
    description: "List/filter titles by branch"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["branch_id?", "isbn?", "limit?", "offset?"]
    output: Title[]
    side_effects: []

  - method: POST
    path: "/library/titles/{id}/withdraw"
    description: "Withdraw a title from circulation"
    roles: [BranchManager]
    code: 200
    input: []
    output: Title
    side_effects: ["status=WITHDRAWN; AVAILABLE copies -> WITHDRAWN; WAITING/READY holds -> CANCELLED; increments Title.version"]

  # ---------------- Copy ----------------
  - method: POST
    path: "/library/copies"
    description: "Add a physical holding copy to a title"
    roles: [Librarian, BranchManager]
    code: 201
    input: [title_id, branch_id, barcode, acquired_on, "condition_factor?"]
    output: Copy
    side_effects: ["status=AVAILABLE; title.available_copy_count and total_copy_count recomputed"]

  - method: GET
    path: "/library/copies/{id}"
    description: "Get a copy"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Copy
    side_effects: []

  - method: GET
    path: "/library/copies"
    description: "List/filter copies by title and/or branch (FK reverse-reachability for Copy)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["title_id?", "branch_id?", "limit?", "offset?"]
    output: Copy[]
    side_effects: []

  # ---------------- Loan ----------------
  - method: POST
    path: "/library/loans"
    description: "Check out a copy to a patron (circulation desk)"
    roles: [Librarian]
    code: 201
    input: [copy_id, patron_id]
    output: Loan
    side_effects:
      - "status=ACTIVE; checked_out_at=clock; due_date=checked_out_at + branch.loan_period_days"
      - "Copy.status AVAILABLE -> ON_LOAN; title.available_copy_count recomputed"
      - "patron.active_loan_count recomputed"

  - method: GET
    path: "/library/loans/{id}"
    description: "Get a loan"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/library/loans"
    description: "List/filter loans by copy and/or patron (FK reverse-reachability for Loan)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["copy_id?", "patron_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: GET
    path: "/library/loans/{id}/fine-estimate"
    description: "Computed read: forward-looking overdue_fine_estimate for a projected return date"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["projected_return?"]
    output: "{ estimate_cents: integer, overdue_days: integer, chargeable_days: integer }"
    side_effects: []

  - method: POST
    path: "/library/loans/{id}/renew"
    description: "Renew a loan (self-loop on ACTIVE)"
    roles: [Patron, Librarian]
    code: 200
    input: []
    output: Loan
    side_effects: ["renewal_count += 1; due_date += branch.loan_period_days; increments Loan.version"]

  - method: POST
    path: "/library/loans/{id}/refresh-overdue"
    description: "Recompute overdue flag against current clock (ACTIVE -> OVERDUE when past due)"
    roles: [Librarian]
    code: 200
    input: []
    output: Loan
    side_effects: ["status ACTIVE -> OVERDUE if clock now > due_date; increments Loan.version"]

  - method: POST
    path: "/library/loans/{id}/checkin"
    description: "Return a loaned copy; assess final overdue fine; promote head hold"
    roles: [Librarian]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "status -> RETURNED; returned_at=clock; accrued_fine_cents = overdue_fine_final"
      - "if accrued_fine_cents > 0: create Fine(OVERDUE) -> patron.total_owed_cents -> patron.borrowing_status (cascade)"
      - "Copy ON_LOAN -> AVAILABLE; head WAITING hold (if any) -> READY (copy -> ON_HOLD_SHELF); patron.ready_pickup_count recomputed"
      - "increments Loan.version"

  - method: POST
    path: "/library/loans/{id}/declare-lost"
    description: "Declare a loaned copy lost; bill replacement; cascade to patron block"
    roles: [Librarian]
    code: 200
    input: ["flat_replacement?"]
    output: Loan
    side_effects:
      - "status -> LOST; Copy.status -> LOST"
      - "create Fine(LOST, amount_cents=replacement_charge) -> patron.total_owed_cents -> if >= block_threshold then borrowing_status BLOCKED (cascade depth>=4)"
      - "title.available_copy_count and total_copy_count recomputed; increments Loan.version"

  # ---------------- Hold ----------------
  - method: POST
    path: "/library/holds"
    description: "Place a hold on a title (joins WAITING queue, or promotes to READY if a copy is free)"
    roles: [Patron, Librarian]
    code: 201
    input: [title_id, patron_id]
    output: Hold
    side_effects:
      - "status=WAITING; queue_position assigned by created_at ASC"
      - "patron.active_hold_count recomputed; title.waiting_hold_count recomputed"

  - method: GET
    path: "/library/holds/{id}"
    description: "Get a hold (queue_position reconciled)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Hold
    side_effects: ["Recompute queue_position, pickup_deadline"]

  - method: GET
    path: "/library/holds"
    description: "List/filter holds by title, patron, or reserved copy (FK reverse-reachability for Hold)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["title_id?", "patron_id?", "ready_copy_id?", "status?", "limit?", "offset?"]
    output: Hold[]
    side_effects: []

  - method: POST
    path: "/library/holds/{id}/checkout"
    description: "Fulfil a READY hold by checking out the reserved copy"
    roles: [Librarian]
    code: 200
    input: []
    output: Hold
    side_effects: ["Hold READY -> FULFILLED; create Loan on ready_copy_id; Copy ON_HOLD_SHELF -> ON_LOAN; patron.ready_pickup_count recomputed; increments Hold.version"]

  - method: POST
    path: "/library/holds/{id}/expire-ready"
    description: "Expire an unclaimed READY hold past pickup_deadline; promote next in queue"
    roles: [Librarian]
    code: 200
    input: []
    output: Hold
    side_effects: ["Hold READY -> EXPIRED; Copy ON_HOLD_SHELF -> AVAILABLE; next WAITING hold promoted to READY (loop) or copy freed; increments Hold.version"]

  - method: POST
    path: "/library/holds/{id}/cancel"
    description: "Cancel a WAITING or READY hold"
    roles: [Patron, Librarian]
    code: 200
    input: []
    output: Hold
    side_effects: ["status -> CANCELLED; if was READY release copy and promote next; queue_position recomputed; increments Hold.version"]

  # ---------------- BookableResource ----------------
  - method: POST
    path: "/library/resources"
    description: "Create a bookable room or computer station pool"
    roles: [BranchManager]
    code: 201
    input: [branch_id, resource_kind, label, "capacity?"]
    output: BookableResource
    side_effects: ["status=IN_SERVICE"]

  - method: GET
    path: "/library/resources/{id}"
    description: "Get a bookable resource (read version for OCC)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: BookableResource
    side_effects: []

  - method: GET
    path: "/library/resources"
    description: "List/filter resources by branch (FK reverse-reachability for BookableResource)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["branch_id?", "resource_kind?", "limit?", "offset?"]
    output: BookableResource[]
    side_effects: []

  - method: POST
    path: "/library/resources/{id}/set-service-status"
    description: "Take a resource out of / back into service"
    roles: [BranchManager]
    code: 200
    input: [status]
    output: BookableResource
    side_effects: ["status updated; increments BookableResource.version"]

  # ---------------- Reservation ----------------
  - method: POST
    path: "/library/reservations"
    description: "Request a room/computer reservation (OCC on resource.version; temporal overlap checked)"
    roles: [Patron, Librarian]
    code: 201
    input: [resource_id, patron_id, start_at, end_at, expected_resource_version]
    output: Reservation
    side_effects:
      - "status=REQUESTED; overlap validated per resource_kind interval semantics"
      - "increments BookableResource.version by 1 (OCC advance)"

  - method: GET
    path: "/library/reservations/{id}"
    description: "Get a reservation"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/library/reservations"
    description: "List/filter reservations by resource and/or patron (FK reverse-reachability for Reservation)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["resource_id?", "patron_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/library/reservations/{id}/confirm"
    description: "Confirm a requested reservation"
    roles: [Librarian]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CONFIRMED; increments Reservation.version"]

  - method: POST
    path: "/library/reservations/{id}/checkin"
    description: "Check a patron into a confirmed reservation"
    roles: [Librarian]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CHECKED_IN; checked_in_at=clock; increments Reservation.version"]

  - method: POST
    path: "/library/reservations/{id}/complete"
    description: "Complete a checked-in reservation"
    roles: [Librarian]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> COMPLETED; window freed; increments Reservation.version"]

  - method: POST
    path: "/library/reservations/{id}/no-show"
    description: "Mark a confirmed reservation a no-show after its window ends"
    roles: [Librarian]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> NO_SHOW; window freed; increments Reservation.version"]

  - method: POST
    path: "/library/reservations/{id}/cancel"
    description: "Cancel a requested/confirmed reservation"
    roles: [Patron, Librarian]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CANCELLED; window freed; increments Reservation.version"]

  # ---------------- IllRequest ----------------
  - method: POST
    path: "/library/ill-requests"
    description: "Submit an inter-library loan request"
    roles: [Patron, Librarian]
    code: 201
    input: [patron_id, branch_id, isbn, "lending_fee_cents?"]
    output: IllRequest
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/library/ill-requests/{id}"
    description: "Get an ILL request"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: IllRequest
    side_effects: []

  - method: GET
    path: "/library/ill-requests"
    description: "List/filter ILL requests by patron and/or branch (FK reverse-reachability for IllRequest)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["patron_id?", "branch_id?", "status?", "limit?", "offset?"]
    output: IllRequest[]
    side_effects: []

  - method: POST
    path: "/library/ill-requests/{id}/transition"
    description: "Advance ILL lifecycle: approve|deny|ship|receive|return (action in body)"
    roles: [Librarian]
    code: 200
    input: [action]
    output: IllRequest
    side_effects:
      - "approve: REQUESTED -> APPROVED (requires patron CLEAR); deny: REQUESTED -> DENIED"
      - "ship: APPROVED -> SHIPPED; receive: SHIPPED -> RECEIVED (creates ILL_FEE Fine -> patron balance); return: RECEIVED -> RETURNED"
      - "increments IllRequest.version"

  # ---------------- LicensePool / EbookLoan ----------------
  - method: POST
    path: "/library/license-pools"
    description: "Create an e-book license pool for a title"
    roles: [Librarian, BranchManager]
    code: 201
    input: [title_id, total_licenses, "loan_term_days?"]
    output: LicensePool
    side_effects: ["loaned_licenses=0; available_licenses=total_licenses"]

  - method: GET
    path: "/library/license-pools/{id}"
    description: "Get a license pool (availability reconciled)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: LicensePool
    side_effects: ["Recompute loaned_licenses, available_licenses"]

  - method: GET
    path: "/library/license-pools"
    description: "List/filter license pools by title (FK reverse-reachability for LicensePool)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["title_id?", "limit?", "offset?"]
    output: LicensePool[]
    side_effects: []

  - method: POST
    path: "/library/license-pools/{id}/run-expiry"
    description: "Expire all ACTIVE ebook-loans on the pool whose expires_at has passed; release licenses"
    roles: [Librarian]
    code: 200
    input: []
    output: LicensePool
    side_effects: ["each ACTIVE EbookLoan with clock now >= expires_at -> EXPIRED; loaned_licenses/available_licenses recomputed"]

  - method: POST
    path: "/library/ebook-loans"
    description: "Check out an e-book against a license pool (quota consume)"
    roles: [Patron, Librarian]
    code: 201
    input: [pool_id, patron_id]
    output: EbookLoan
    side_effects:
      - "status=ACTIVE; checked_out_at=clock; expires_at=checked_out_at + pool.loan_term_days"
      - "pool.loaned_licenses recomputed; pool.available_licenses recomputed"

  - method: GET
    path: "/library/ebook-loans/{id}"
    description: "Get an e-book loan"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: EbookLoan
    side_effects: []

  - method: GET
    path: "/library/ebook-loans"
    description: "List/filter e-book loans by pool and/or patron (FK reverse-reachability for EbookLoan)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["pool_id?", "patron_id?", "status?", "limit?", "offset?"]
    output: EbookLoan[]
    side_effects: []

  - method: POST
    path: "/library/ebook-loans/{id}/return"
    description: "Return an e-book early; release the license"
    roles: [Patron, Librarian]
    code: 200
    input: []
    output: EbookLoan
    side_effects: ["status -> RETURNED; pool.loaned_licenses/available_licenses recomputed; increments EbookLoan.version"]

  # ---------------- Fine ----------------
  - method: GET
    path: "/library/fines/{id}"
    description: "Get a fine"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: []
    output: Fine
    side_effects: []

  - method: GET
    path: "/library/fines"
    description: "List/filter fines by patron and/or loan (FK reverse-reachability for Fine)"
    roles: [Patron, Librarian, BranchManager]
    code: 200
    input: ["patron_id?", "loan_id?", "settlement_status?", "limit?", "offset?"]
    output: Fine[]
    side_effects: []

  - method: POST
    path: "/library/fines/{id}/pay"
    description: "Settle a fine as PAID; recompute patron balance and unblock if cleared"
    roles: [Librarian, BranchManager]
    code: 200
    input: []
    output: Fine
    side_effects: ["settlement_status -> PAID; settled_at=clock; patron.total_owed_cents/borrowing_status recomputed; increments Fine.version"]

  - method: POST
    path: "/library/fines/{id}/waive"
    description: "Waive a fine (manager only); recompute patron balance and unblock if cleared"
    roles: [BranchManager]
    code: 200
    input: []
    output: Fine
    side_effects: ["settlement_status -> WAIVED; settled_at=clock; patron.total_owed_cents/borrowing_status recomputed; increments Fine.version"]

  # ---------------- Test-driving clock ----------------
  - method: POST
    path: "/library/_clock/set"
    description: "Test-driving endpoint: set the server's current UTC clock to an absolute instant"
    roles: [Librarian, BranchManager]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["Server clock pinned to to_iso8601 for all subsequent now reads"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or Patron acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum value, or end_at <= start_at" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  - { id: ERR_RESOURCE_NOT_AVAILABLE, http: 409, condition: "Copy not AVAILABLE for checkout, or BookableResource OUT_OF_SERVICE, or Title WITHDRAWN" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Patron card_status is SUSPENDED or EXPIRED" }
  - { id: ERR_PATRON_BLOCKED, http: 409, condition: "Patron.borrowing_status is BLOCKED by unpaid fines at/over block_threshold" }
  - { id: ERR_RESERVATION_CONFLICT, http: 409, condition: "Reservation interval collides with existing active reservations per resource interval semantics" }
  - { id: ERR_LIMIT_EXCEEDED, http: 409, condition: "checkout_limit, hold_limit, or MAX_RENEWALS exceeded; or renew blocked by an outstanding hold on the title" }
  - { id: ERR_NO_LICENSE_AVAILABLE, http: 409, condition: "License pool has available_licenses == 0 at e-book checkout" }
  - { id: ERR_STALE_RESOURCE_VERSION, http: 412, condition: "expected_resource_version does not match BookableResource.version on reservation create" }
  - { id: ERR_TITLE_WITHDRAWN, http: 409, condition: "Operation targets a WITHDRAWN title (new copy or hold)" }
  - { id: ERR_HOLD_NOT_READY, http: 409, condition: "Hold checkout attempted while hold is not READY, or past pickup_deadline" }
  - { id: ERR_PICKUP_EXPIRED, http: 409, condition: "Hold checkout/expire attempted: now > pickup_deadline" }
  - { id: ERR_NOT_YET_DUE, http: 409, condition: "refresh-overdue/no-show invoked before the relevant clock threshold (due_date / end_at) is passed" }
  - { id: ERR_RENEWAL_LIMIT, http: 409, condition: "Loan renewal_count already at MAX_RENEWALS" }
  - { id: ERR_RENEWAL_BLOCKED_BY_HOLD, http: 409, condition: "Renewal refused because a WAITING/READY hold exists on the loan's title" }
  - { id: ERR_VALIDATION_PARAM, http: 400, condition: "Invalid query/pagination parameter (limit out of [1,100], negative offset, unknown enum filter)" }
  - { id: ERR_INVALID_ACTION, http: 400, condition: "Unknown action verb on /ill-requests/{id}/transition" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patron
    description: "A library cardholder acting on their own loans, holds, reservations, ILL requests, and e-book loans."
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /library/loans/{id}/renew (own loan)"
      - "POST /library/holds/{id}/cancel (own hold)"
      - "POST /library/reservations/{id}/cancel (own reservation)"
      - "POST /library/ebook-loans/{id}/return (own e-book loan)"
    shared_operations:
      - "POST /library/holds (place own hold; shared with Librarian)"
      - "POST /library/reservations (book own room/computer; shared with Librarian)"
      - "POST /library/ebook-loans (check out own e-book; shared with Librarian)"
      - "POST /library/ill-requests (submit own ILL; shared with Librarian)"
      - "GET reads on own resources and public catalog (titles, copies, branches, license-pools)"

  - name: Librarian
    description: "Circulation-desk staff: checkout/check-in, hold fulfilment, declare-lost, ILL processing, e-book/reservation lifecycle, fine payment. Operator identity not tied to a persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /library/loans (checkout)"
      - "POST /library/loans/{id}/checkin"
      - "POST /library/loans/{id}/declare-lost"
      - "POST /library/loans/{id}/refresh-overdue"
      - "POST /library/holds/{id}/checkout"
      - "POST /library/holds/{id}/expire-ready"
      - "POST /library/reservations/{id}/confirm|checkin|complete|no-show"
      - "POST /library/ill-requests/{id}/transition"
      - "POST /library/license-pools/{id}/run-expiry"
    shared_operations:
      - "POST /library/patrons, POST /library/titles, POST /library/copies, POST /library/license-pools (shared with BranchManager)"
      - "POST /library/patrons/{id}/set-card-status (shared with BranchManager)"
      - "POST /library/holds, POST /library/reservations, POST /library/ebook-loans, POST /library/ill-requests (on behalf of patron; shared with Patron)"
      - "POST /library/fines/{id}/pay (shared with BranchManager)"
      - "GET reads (shared with Patron, BranchManager)"

  - name: BranchManager
    description: "Branch administrator: branch policy, bookable resources, title withdrawal, fine waivers. Operator identity not tied to a persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /library/branches"
      - "POST /library/resources"
      - "POST /library/resources/{id}/set-service-status"
      - "POST /library/titles/{id}/withdraw"
      - "POST /library/fines/{id}/waive"
    shared_operations:
      - "POST /library/patrons, POST /library/titles, POST /library/copies, POST /library/license-pools (shared with Librarian)"
      - "POST /library/patrons/{id}/set-card-status, POST /library/fines/{id}/pay (shared with Librarian)"
      - "GET reads (shared with Patron, Librarian)"
