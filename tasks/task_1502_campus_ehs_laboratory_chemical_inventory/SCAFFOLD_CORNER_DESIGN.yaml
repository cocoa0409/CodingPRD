scaffold_corner_design:
  - section: entities
    instances:
      - name: lab_create_applies_defaults
        claim_type: creation
        grounds: [entities.Lab, endpoints]
        distinguishing_aspect: "POST /ehs/labs with the four required fields returns 201 with system defaults: status ACTIVE, posture NORMAL, permit_report_required false, version 1."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ehs/labs", payload: { name: "Lab A", department: "Chemistry", building: "Hall A", room: "101" }, as: EHSAdmin, captures: { l: $.data.id } }
          assert:
            - "Lab.${l}.status == ACTIVE"
            - "Lab.${l}.posture == NORMAL"
            - "Lab.${l}.permit_report_required == false"
            - "Lab.${l}.version == 1"
      - name: container_system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.ChemicalContainer]
        distinguishing_aspect: "id is a server-minted UUID, created_at/updated_at stamped, version starts at 1, state defaults to IN_USE regardless of client intent."
        test_recipe:
          setup: ["lab with a PI worker"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab B", department: "Biology", building: "Hall B", room: "201" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "SF-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c: $.data.id } }
          assert:
            - "ChemicalContainer.${c}.id is a UUID without any type prefix"
            - "ChemicalContainer.${c}.state == IN_USE"
            - "ChemicalContainer.${c}.quantity_unit == GAL (default applied)"
            - "ChemicalContainer.${c}.version == 1 and created_at == 2026-08-01T00:00:00Z (logical clock default)"
      - name: container_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.ChemicalContainer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /ehs/containers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (HTTP 404)"
      - name: containers_list_pagination
        claim_type: listing
        grounds: [entities.ChemicalContainer, response_envelope]
        distinguishing_aspect: "limit/offset paginate: 3 containers with limit=2 returns has_more true and total_count 3; the offset=2 page returns the remaining 1 with has_more false."
        test_recipe:
          setup: ["lab with PI and three containers"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab C", department: "Chemistry", building: "Hall A", room: "102" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "PG-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "PG-2", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "PG-3", chemical_name: "Acetone", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "GET /ehs/containers?lab_id=${l}&limit=2&offset=0", as: EHSAdmin }
            - { call: "GET /ehs/containers?lab_id=${l}&limit=2&offset=2", as: EHSAdmin }
          assert:
            - "page 1: response_type == array, total_count == 3, has_more == true, 2 items"
            - "page 2: has_more == false, 1 item"
      - name: container_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ChemicalContainer.fields.hazard_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "hazard_class outside the declared enum is a 400 ERR_INVALID_REQUEST, not a 422 business error."
        test_recipe:
          setup: ["lab with PI"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab D", department: "Chemistry", building: "Hall A", room: "103" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "XX-1", chemical_name: "Uranium", hazard_class: "RADIOACTIVE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (HTTP 400)"]
      - name: container_quantity_must_be_positive_rejected
        claim_type: type_constraints
        grounds: [entities.ChemicalContainer.fields.quantity_value, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "quantity_value == 0 violates the > 0 constraint -> ERR_INVALID_REQUEST (zero-quantity boundary)."
        test_recipe:
          setup: ["lab with PI"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab E", department: "Chemistry", building: "Hall A", room: "104" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "ZE-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (HTTP 400)"]

  - section: state_machines
    instances:
      - name: completed_pickup_submit_returns_pickup_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WastePickupRequest, "errors[ERR_PICKUP_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: a submit against a COMPLETED pickup fails with ERR_PICKUP_STATE and no side effects fire."
        test_recipe:
          setup: ["lab with trained PI; one tagged container; pickup carried through SUBMITTED -> SCHEDULED -> COMPLETED"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab F", department: "Chemistry", building: "Hall A", room: "105" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "TP-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/schedule", payload: { dock_id: "DOCK-1", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T11:00:00Z" }, as: EHSAdmin }
            - { call: "POST /ehs/waste-pickup-requests/${p}/complete", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PICKUP_STATE (HTTP 409)"
            - "WastePickupRequest.${p}.status == COMPLETED (unchanged)"
      - name: picked_up_container_cannot_untag
        claim_type: invalid_transition
        grounds: [state_machines.ChemicalContainer.WASTE_TAGGED_to_IN_USE, "errors[ERR_CONTAINER_STATE]"]
        distinguishing_aspect: "untag-waste from terminal PICKED_UP is an invalid transition -> ERR_CONTAINER_STATE."
        test_recipe:
          setup: ["one container carried through tag -> pickup -> complete (state PICKED_UP)"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab G", department: "Chemistry", building: "Hall A", room: "106" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "PU-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/schedule", payload: { dock_id: "DOCK-1", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T11:00:00Z" }, as: EHSAdmin }
            - { call: "POST /ehs/waste-pickup-requests/${p}/complete", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/containers/${c1}/untag-waste", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CONTAINER_STATE (HTTP 409); ChemicalContainer.${c1}.state == PICKED_UP"]
      - name: training_assignment_expires_on_clock_sweep
        claim_type: auto_transition
        grounds: [state_machines.TrainingAssignment.ASSIGNED_to_EXPIRED, calculations.lab_posture_derivation]
        distinguishing_aspect: "System transition: an ASSIGNED assignment with due_date < logical now flips to EXPIRED on the clock sweep; due_date == now does NOT expire (strict <)."
        test_recipe:
          setup: ["lab with worker; assignment due 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab H", department: "Biology", building: "Hall B", room: "203" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "TOXIC", due_date: "2026-08-10T00:00:00Z" }, as: EHSAdmin, captures: { ta: $.data.id } }
          trigger:
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EHSAdmin }
            - { call: "GET /ehs/workers/${pi}/training-assignments", as: EHSAdmin, captures: { st_eq: "$.data[0].status" } }
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: EHSAdmin }
            - { call: "GET /ehs/workers/${pi}/training-assignments", as: EHSAdmin, captures: { st_after: "$.data[0].status" } }
          assert:
            - "at due_date exactly: status == ASSIGNED (strict inequality)"
            - "after due_date: status == EXPIRED"
            - "Lab.${l}.posture == RESTRICTED (expired_training_count >= 1)"
      - name: closeout_cancels_scheduled_inspection
        claim_type: side_effect_execution
        grounds: [state_machines.Lab.ACTIVE_to_CLOSING, state_machines.LabInspection.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cascade-down side effect: closing out the lab flips its SCHEDULED inspection to CANCELLED without any direct call on the inspection."
        test_recipe:
          setup: ["lab with PI and one SCHEDULED inspection"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab I", department: "Biology", building: "Hall B", room: "204" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /ehs/labs/${l}/closeout", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "GET /ehs/inspections/${insp}", as: EHSAdmin }
          assert:
            - "Lab.${l}.status == CLOSING"
            - "LabInspection.${insp}.status == CANCELLED"
      - name: incident_report_and_close_valid
        claim_type: valid_transition
        grounds: [state_machines.Incident.REPORTED_to_CLOSED]
        distinguishing_aspect: "REPORTED -> CLOSED stores the resolution and reported_by is the reporter's X-User-ID."
        test_recipe:
          setup: ["lab with PI"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab J", department: "Chemistry", building: "Hall A", room: "107" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /ehs/incidents", payload: { lab_id: "${l}", title: "Spill", description: "100ml ethanol spill", severity: "LOW", near_miss: false }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { inc: $.data.id } }
            - { call: "POST /ehs/incidents/${inc}/close", payload: { resolution: "cleaned per SOP" }, as: EHSAdmin }
          assert:
            - "Incident.${inc}.reported_by == ${pi}"
            - "Incident.${inc}.status == CLOSED and resolution == 'cleaned per SOP'"
      - name: registration_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds: [state_machines.Registration.ACTIVE_to_SUSPENDED, state_machines.Registration.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Cyclic registration machine: ACTIVE -> SUSPENDED -> ACTIVE via suspend then the same activate endpoint used for PENDING -> ACTIVE."
        test_recipe:
          setup: ["lab; registration created (PENDING) with correct OCC version"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab K", department: "Pharmacy", building: "Hall D", room: "403" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { lv: $.data.version } }
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "SELECT_AGENT", registration_number: "SA-1", expected_lab_version: "${lv}" }, as: EHSAdmin, captures: { reg: $.data.id } }
          trigger:
            - { call: "POST /ehs/registrations/${reg}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /ehs/registrations/${reg}/suspend", payload: {}, as: EHSAdmin }
            - { call: "POST /ehs/registrations/${reg}/activate", payload: {}, as: EHSAdmin }
            - { call: "GET /ehs/labs/${l}/registrations", as: EHSAdmin, captures: { st: "$.data[0].status" } }
          assert: ["Registration.${reg}.status == ACTIVE after the SUSPENDED intermediate state"]
      - name: pickup_cancel_returns_containers_compensated
        claim_type: side_effect_execution
        grounds: [state_machines.WastePickupRequest.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Compensation side effect: cancelling a SCHEDULED pickup unlinks its containers; they stay WASTE_TAGGED with area membership intact."
        test_recipe:
          setup: ["lab with trained PI; tagged container; pickup SUBMITTED then SCHEDULED"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab L", department: "Chemistry", building: "Hall A", room: "108" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "CX-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/schedule", payload: { dock_id: "DOCK-2", window_start: "2026-08-11T10:00:00Z", window_end: "2026-08-11T11:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/cancel", payload: {}, as: EHSAdmin }
            - { call: "GET /ehs/containers/${c1}", as: EHSAdmin }
          assert:
            - "WastePickupRequest.${p}.status == CANCELLED"
            - "ChemicalContainer.${c1}.state == WASTE_TAGGED and pickup_request_id == null and accumulation_area_id == ${area}"

  - section: calculations
    instances:
      - name: corrective_action_due_date_by_severity
        claim_type: constants_applied
        grounds: [calculations.lab_posture_derivation, entities.CorrectiveAction.fields.due_date]
        distinguishing_aspect: "CA_DUE_DAYS constants applied from completed_at (2026-08-01T00:00:00Z default clock): MAJOR finding -> due 2026-08-15T00:00:00Z (+14d); MINOR -> due 2026-08-31T00:00:00Z (+30d)."
        test_recipe:
          setup: ["lab; inspection completed with one MAJOR and one MINOR finding at default clock"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab M2", department: "Biology", building: "Hall B", room: "205" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MAJOR", description: "open container" }, { severity: "MINOR", description: "label faded" } ] }, as: EHSInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "GET /ehs/inspections/${insp}/corrective-actions", as: EHSAdmin }
          assert:
            - "the MAJOR corrective action has due_date == 2026-08-15T00:00:00Z"
            - "the MINOR corrective action has due_date == 2026-08-31T00:00:00Z"
            - "both corrective actions have status == OPEN and lab_id == ${l}"
      - name: accumulation_overstay_strictly_greater_than_365_days
        claim_type: boundary_edge
        grounds: [calculations.accumulation_age_tracking, entities.AccumulationArea.fields.has_overstay_containers]
        distinguishing_aspect: "Overstay boundary is strictly greater than 365 whole days: at exactly 365 days the area is compliant; at 366 days has_overstay_containers flips true and posture degrades to RESTRICTED."
        test_recipe:
          setup: ["lab with trained PI; one container tagged at the default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab N2", department: "Chemistry", building: "Hall A", room: "109" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2028-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "AG-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "GET /ehs/labs/${l}/accumulation-areas", as: EHSAdmin, captures: { ov_365: "$.data[0].has_overstay_containers" } }
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: EHSAdmin }
            - { call: "GET /ehs/labs/${l}/accumulation-areas", as: EHSAdmin, captures: { ov_366: "$.data[0].has_overstay_containers" } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin }
          assert:
            - "at exactly 365 days: has_overstay_containers == false"
            - "at 366 days: has_overstay_containers == true"
            - "at 366 days: Lab.${l}.posture == RESTRICTED"
      - name: inspection_pass_threshold_inclusive
        claim_type: boundary_edge
        grounds: [calculations.inspection_scoring]
        distinguishing_aspect: "PASS boundary is inclusive: 1 MAJOR + 2 MINOR findings give score_weighted exactly 70 -> outcome PASS (while score_flat is 60)."
        test_recipe:
          setup: ["lab; SCHEDULED inspection"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab O2", department: "Biology", building: "Hall B", room: "207" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MAJOR", description: "f1" }, { severity: "MINOR", description: "f2" }, { severity: "MINOR", description: "f3" } ] }, as: EHSInspector, as_user_id: "insp-1" }
          assert:
            - "LabInspection.${insp}.score_weighted == 70"
            - "LabInspection.${insp}.outcome == PASS (>= is inclusive)"
            - "LabInspection.${insp}.score_flat == 60"
      - name: hazard_screening_input_set_excludes_picked_up
        claim_type: input_set_filtering
        grounds: [calculations.hazard_threshold_screening]
        excluded_because:
          difficulty_instance: pickup_complete_cascade_unflags_permit
          rationale: "PICKED_UP containers dropping out of the regulatory totals is exactly what flips permit_report_required false in that difficulty instance."

  - section: validations
    instances:
      - name: second_pi_worker_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_PI_ALREADY_ASSIGNED]"]
        distinguishing_aspect: "Uniqueness constraint: a lab already having a PI rejects a second role_in_lab=PI worker with ERR_PI_ALREADY_ASSIGNED (409)."
        test_recipe:
          setup: ["lab with one PI worker"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab P2", department: "Chemistry", building: "Hall A", room: "110" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Second", role_in_lab: "PI" }, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PI_ALREADY_ASSIGNED (HTTP 409)"
            - "Lab.${l}.pi_worker_id still == ${pi}"
      - name: duplicate_barcode_same_lab_only
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_BARCODE]"]
        distinguishing_aspect: "Barcode uniqueness is lab-scoped: duplicate within the lab -> ERR_DUPLICATE_BARCODE; the same barcode in a different lab succeeds."
        test_recipe:
          setup: ["labs L1 (PI pi1) and L2 (PI pi2); L1 already has barcode DUP-1"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab Q1", department: "Chemistry", building: "Hall A", room: "111" }, as: EHSAdmin, captures: { l1: $.data.id } }
            - { call: "POST /ehs/labs", payload: { name: "Lab Q2", department: "Chemistry", building: "Hall A", room: "112" }, as: EHSAdmin, captures: { l2: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l1}", full_name: "Dr. One", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi1: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l2}", full_name: "Dr. Two", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi2: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l1}", barcode: "DUP-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi1}" }
          trigger:
            - { call: "POST /ehs/containers", payload: { lab_id: "${l1}", barcode: "DUP-1", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 2.0 }, as: PrincipalInvestigator, as_user_id: "${pi1}", captures: { err: $.data.error_id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l2}", barcode: "DUP-1", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 2.0 }, as: PrincipalInvestigator, as_user_id: "${pi2}", captures: { ok2: $.data.id } }
          assert:
            - "same-lab duplicate: error_id == ERR_DUPLICATE_BARCODE (HTTP 409)"
            - "cross-lab same barcode succeeds: ChemicalContainer.${ok2}.barcode == DUP-1"
      - name: area_capacity_exceeded_on_second_tag
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_AREA_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Aggregate validation: capacity_containers == 1 admits the first tag and rejects the second with ERR_AREA_CAPACITY_EXCEEDED (each tag individually valid)."
        test_recipe:
          setup: ["lab with trained PI; area capacity 1; two IN_USE containers"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab R2", department: "Chemistry", building: "Hall A", room: "113" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "CAP-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "CAP-2", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-TINY", area_type: "SAA", capacity_containers: 1 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AREA_CAPACITY_EXCEEDED (HTTP 409)"
            - "ChemicalContainer.${c2}.state == IN_USE"
      - name: inspection_window_end_before_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "Temporal validity: scheduled_end <= scheduled_start -> ERR_INVALID_WINDOW (400); equal endpoints are invalid (strictly greater required)."
        test_recipe:
          setup: ["lab exists"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab S2", department: "Biology", building: "Hall B", room: "208" }, as: EHSAdmin, captures: { l: $.data.id } }
          trigger:
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_WINDOW (HTTP 400)"]
      - name: add_item_cross_lab_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_CROSS_LAB_REFERENCE]"]
        distinguishing_aspect: "Referential integrity: a container of lab L2 cannot be added to a pickup of lab L1 -> ERR_CROSS_LAB_REFERENCE (422)."
        test_recipe:
          setup: ["L1 pickup DRAFT; L2 container tagged in L2's area by L2's trained PI"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab T1", department: "Chemistry", building: "Hall A", room: "114" }, as: EHSAdmin, captures: { l1: $.data.id } }
            - { call: "POST /ehs/labs", payload: { name: "Lab T2", department: "Chemistry", building: "Hall A", room: "115" }, as: EHSAdmin, captures: { l2: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l1}", full_name: "Dr. One", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi1: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l2}", full_name: "Dr. Two", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi2: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l2}", worker_id: "${pi2}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr2: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr2}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi2}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l2}", barcode: "XR-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi2}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l2}", name: "SAA-2", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area2: $.data.id } }
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area2}" }, as: PrincipalInvestigator, as_user_id: "${pi2}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l1}" }, as: PrincipalInvestigator, as_user_id: "${pi1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p1}/add-item", payload: { container_id: "${c2}" }, as: PrincipalInvestigator, as_user_id: "${pi1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CROSS_LAB_REFERENCE (HTTP 422); pickup still has estimated_quantity_total == 0.0"]
      - name: decommission_blocked_by_remaining_containers
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_DECOMMISSION_BLOCKED]"]
        distinguishing_aspect: "Aggregate decommission gate: a CLOSING lab with any non-PICKED_UP container cannot decommission -> ERR_DECOMMISSION_BLOCKED."
        test_recipe:
          setup: ["lab with PI and one IN_USE container; closeout done"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab U2", department: "Chemistry", building: "Hall A", room: "116" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "DB-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/labs/${l}/closeout", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/labs/${l}/decommission", payload: {}, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DECOMMISSION_BLOCKED (HTTP 409)"
            - "Lab.${l}.status == CLOSING (unchanged)"
      - name: decommission_succeeds_when_clean
        claim_type: satisfaction_pass
        grounds: [state_machines.Lab.CLOSING_to_DECOMMISSIONED, "validations[priority=20]"]
        distinguishing_aspect: "With zero containers, pickups, corrective actions, active registrations, and open incidents, decommission succeeds and posture becomes FROZEN (terminal)."
        test_recipe:
          setup: ["lab with PI; nothing else; closeout done"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab V2", department: "Chemistry", building: "Hall A", room: "117" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/labs/${l}/closeout", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/labs/${l}/decommission", payload: {}, as: EHSAdmin }
          assert:
            - "Lab.${l}.status == DECOMMISSIONED"
            - "Lab.${l}.posture == FROZEN"
      - name: complete_expired_training_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_TRAINING_STATE]"]
        distinguishing_aspect: "Completing an EXPIRED assignment is a state error (ERR_TRAINING_STATE); expiry is terminal, a new assignment is required."
        test_recipe:
          setup: ["lab with worker; assignment due 2026-08-05 expired via clock sweep to 2026-08-06"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab W2", department: "Biology", building: "Hall B", room: "209" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "TOXIC", due_date: "2026-08-05T00:00:00Z" }, as: EHSAdmin, captures: { ta: $.data.id } }
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/training-assignments/${ta}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_TRAINING_STATE (HTTP 409); TrainingAssignment.${ta}.status == EXPIRED"]
      - name: activate_active_registration_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Registration, "errors[ERR_REGISTRATION_STATE]"]
        distinguishing_aspect: "activate is only valid from PENDING or SUSPENDED; activating an already-ACTIVE registration -> ERR_REGISTRATION_STATE."
        test_recipe:
          setup: ["lab; registration created and activated"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab X2", department: "Pharmacy", building: "Hall D", room: "404" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { lv: $.data.version } }
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "CONTROLLED_SUBSTANCE", registration_number: "REG-X", expected_lab_version: "${lv}" }, as: EHSAdmin, captures: { reg: $.data.id } }
            - { call: "POST /ehs/registrations/${reg}/activate", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/registrations/${reg}/activate", payload: {}, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_REGISTRATION_STATE (HTTP 409)"]
      - name: container_create_in_closing_lab_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_LAB_STATE]"]
        distinguishing_aspect: "New container registration requires lab.status == ACTIVE; a CLOSING lab rejects creates with ERR_LAB_STATE while still allowing waste operations."
        test_recipe:
          setup: ["lab with PI; closeout done (status CLOSING)"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab Y2", department: "Chemistry", building: "Hall A", room: "118" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/labs/${l}/closeout", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "CL-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_LAB_STATE (HTTP 409)"]
      - name: sod_same_inspector_cannot_verify
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the inspector who completed the inspection (insp-1) cannot verify its corrective action; a second inspector (insp-2) can."
        test_recipe:
          setup: ["lab with PI; inspection completed by insp-1 with one MINOR finding; CA submitted by PI"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab Z2", department: "Biology", building: "Hall B", room: "211" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MINOR", description: "label faded" } ] }, as: EHSInspector, as_user_id: "insp-1" }
            - { call: "GET /ehs/inspections/${insp}/corrective-actions", as: EHSAdmin, captures: { ca: "$.data[0].id" } }
            - { call: "POST /ehs/corrective-actions/${ca}/submit", payload: { resolution_note: "relabeled" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/corrective-actions/${ca}/verify", payload: { decision: "APPROVE" }, as: EHSInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
            - { call: "POST /ehs/corrective-actions/${ca}/verify", payload: { decision: "APPROVE" }, as: EHSInspector, as_user_id: "insp-2" }
          assert:
            - "verify by insp-1: error_id == ERR_SEGREGATION_OF_DUTIES (HTTP 403)"
            - "verify by insp-2 succeeds: CorrectiveAction.${ca}.status == VERIFIED and verified_by == insp-2"

  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type object/array, and data; list responses add limit/offset/total_count/has_more."
        test_recipe:
          setup: ["one lab exists"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab EV", department: "Chemistry", building: "Hall A", room: "119" }, as: EHSAdmin, captures: { l: $.data.id } }
          trigger:
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin }
            - { call: "GET /ehs/labs", as: EHSAdmin }
          assert:
            - "single GET: meta.api_request_id present, response_type == object, data.id == ${l}"
            - "list GET: response_type == array, data has limit/offset/total_count/has_more pagination fields"
      - name: containers_filterable_by_pickup_request
