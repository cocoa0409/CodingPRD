              as: BrandStandardsDirector
              captures: { unit_at_radius_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Origin Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "INDEPENDENT", building_age_years: 16, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BrandStandardsDirector
          trigger:
            - call: "POST /applications/${app_id}/impact-analysis"
              payload: { analyst_notes: "Single comparable sits exactly on the ring." }
              as: BrandStandardsDirector
            - call: "POST /applications/${app_id}/finalize-impact"
              payload: { analyst_notes: "No claims filed; base score stands." }
              as: BrandStandardsDirector
          assert:
            - "Application.${app_id}.impact_unit_count_preliminary == 1"
            - "Application.${app_id}.preliminary_impact_score == 0.00"
            - "Application.${app_id}.preliminary_impact_score != null"
            - "Application.${app_id}.claim_window_closes_at == 2026-08-26T00:00:00.000Z"
            - "Application.${app_id}.impact_unit_count_final == 1"
            - "Application.${app_id}.base_impact_score == 0.00"
            - "Application.${app_id}.final_impact_score == 0.00"
            - "Application.${app_id}.encroachment_verdict == CLEAR"
            - "Application.${app_id}.impact_study_status == FINAL"
            - "Application.${app_id}.sustained_claim_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approval_gated_by_encroachment_claim_status_until_overruled
        grounds:
          - validations[priority=28]
          - state_machines.EncroachmentClaim.status.FILED_to_OVERRULED
          - state_machines.Application.status.UNDER_REVIEW_to_APPROVED
          - errors.ERR_OPEN_ENCROACHMENT_CLAIMS
        distinguishing_aspect: |
          Entity pair: Application gated by EncroachmentClaim. Whether the application may be
          approved depends on the status of a row of a *different* entity that the application does
          not own: while any claim is FILED the approval is refused with 409, and the identical
          request succeeds the moment a BrandStandardsDirector overrules that claim — with no change
          to the application's own fields in between (the impact study stays FINAL and the verdict
          stays CLEAR, because OVERRULE touches nothing).
        test_recipe:
          setup:
            - "Brand SOLARIS with one OPERATING 150-room unit exactly 5.00 miles away, so the impact study is CLEAR and only the claim can block approval."
            - "The impact study run on 2026-08-05 (claim window closes 2026-08-26) and finalized."
            - "The neighbouring unit's operator files an encroachment claim on 2026-08-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
