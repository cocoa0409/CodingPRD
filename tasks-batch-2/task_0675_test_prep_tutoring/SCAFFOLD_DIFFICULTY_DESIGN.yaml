          - validations[priority=8]
          - errors[ERR_INSTRUCTOR_NOT_CERTIFIED]
          - errors[ERR_INSTRUCTOR_TIME_CONFLICT]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 7, ERR_INSTRUCTOR_NOT_CERTIFIED) vs
          business_temporal (priority 8, ERR_INSTRUCTOR_TIME_CONFLICT): an instructor who is BOTH
          uncertified for the exam AND already booked on an overlapping window must yield the
          referential error (lower priority number wins).
