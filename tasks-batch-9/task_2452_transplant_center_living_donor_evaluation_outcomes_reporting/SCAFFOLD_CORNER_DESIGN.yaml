  - name: booking_completion_keeps_room_minutes_while_cancellation_releases_them
    claim_type: ledger_sync
    grounds:
    - state_machines.ProcedureBooking.ACTIVE_to_COMPLETED
    - state_machines.ProcedureBooking.ACTIVE_to_CANCELLED
    - entities.OperatingRoom.fields.reserved_minutes_total
    - calculations.chain_commitment_conservation
    distinguishing_aspect: 'The two terminal states of ProcedureBooking treat the ancestor ledger OPPOSITELY:
      COMPLETED leaves reserved_minutes_total intact while CANCELLED subtracts exactly once, so the same
      room ends at 240 rather than 0 or 480.'
    test_recipe:
      setup:
      - A COMMITTED 2-segment PAIRED_LOOP has a 240-minute DONOR_RECOVERY booking for seg1 in OR-1 (2026-08-09T06:00:00Z..10:00:00Z)
        and a 180-minute RECIPIENT_IMPLANT booking for seg1 in OR-2.
      - A second 120-minute booking for seg2 sits in OR-1 at 2026-08-09T12:00:00Z..14:00:00Z under a SECOND
        surgeon, so OR-1's reserved_minutes_total is 360.
