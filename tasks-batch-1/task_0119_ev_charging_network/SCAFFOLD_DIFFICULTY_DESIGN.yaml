scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_cost_energy_vs_time_same_session
        grounds:
          - calculations.session_cost
          - entities.ChargingSession.fields.total_cost_cents
          - entities.Tariff.fields.pricing_mode
        distinguishing_aspect: |
          A session of 35 kWh / 50 charging-minutes / 25 idle-minutes priced by an
          ENERGY_BASED tariff totals 1825 cents, but the identical physical session
          priced by a TIME_BASED tariff totals 2850 cents — same inputs, different
          algorithm, different result, on the ChargingSession cost domain.
        test_recipe:
          setup:
            - "One Site (circuit 200 kW) with one CCS Stall (max 60 kW)."
            - "Two tariffs are NOT allowed to overlap; the test runs two separate sites — site E with an ENERGY_BASED CCS tariff and site T with a TIME_BASED CCS tariff — each with its own stall, so the same physical session can be priced both ways."
            - "Clock at 2026-06-01T00:00:00Z; one home driver with a funded wallet."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "Home eMSP", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "d1@x.com", full_name: "D One", home_emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { drv_id: $.data.id }
            - call: "POST /api/drivers/${drv_id}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            # --- ENERGY site E ---
            - call: "POST /api/sites"
              payload: { name: "Site E", circuit_limit_kw: 200, demand_charge_threshold_kw: 200, allocation_policy: "PRIORITY" }
              as: CPOOperator
              captures: { site_e_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_e_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall_e_id: $.data.id, stall_e_v: $.data.version }
            - call: "POST /api/tariffs"
              payload: { site_id: "${site_e_id}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            # session on E: begin charging, charge 50 min, suspend, idle 25 min, stop at 35 kWh
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_e_id}", driver_id: "${drv_id}", is_roaming: false }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { sess_e_id: $.data.id }
            - call: "POST /api/sessions/${sess_e_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${sess_e_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:50:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${sess_e_id}/suspend"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:15:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${sess_e_id}/meter-events"
              payload: { meter_kwh: 35, sampled_at: "2026-06-01T01:15:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
          trigger:
            - call: "POST /api/sessions/${sess_e_id}/stop"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { e_total: $.data.total_cost_cents, e_idle: $.data.idle_fee_cents }
          assert:
            - "ChargingSession.${sess_e_id}.total_cost_cents == 1825"
            - "ChargingSession.${sess_e_id}.idle_fee_cents == 750"
            - "ChargingSession.${sess_e_id}.energy_delivered_kwh == 35"

      - name: load_allocation_proportional_vs_priority_same_pool
        grounds:
          - calculations.site_load_allocation
          - entities.Site.fields.allocation_policy
          - entities.ChargingSession.fields.allocated_power_kw
        distinguishing_aspect: |
          With three CHARGING sessions requesting 60/60/30 kW against a 100 kW cap,
          PROPORTIONAL grants 40/40/20 while PRIORITY grants 60/40/0 — same Site power
          pool, two policies, divergent per-session allocations on the Site domain
          (distinct entity domain from session_cost's ChargingSession cost).
        test_recipe:
          setup:
            - "Site P with allocation_policy PROPORTIONAL, circuit_limit 100 kW, demand avoidance off."
            - "Three CCS stalls each max 60/60/30 kW; an active ENERGY tariff covering CCS."
            - "Three home sessions created in order A,B,C, each begun-charging, so all three are CHARGING simultaneously."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "eMSP P", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "dp@x.com", full_name: "DP", home_emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { drv_id: $.data.id }
            - call: "POST /api/drivers/${drv_id}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "Site P", circuit_limit_kw: 100, demand_charge_threshold_kw: 100, allocation_policy: "PROPORTIONAL", demand_avoidance_armed: false }
              as: CPOOperator
              captures: { site_id: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${site_id}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall_a_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall_b_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 30 }
              as: CPOOperator
              captures: { stall_c_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_a_id}", driver_id: "${drv_id}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /api/sessions/${sa_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${sa_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_b_id}", driver_id: "${drv_id}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { sb_id: $.data.id }
            - call: "POST /api/sessions/${sb_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${sb_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_c_id}", driver_id: "${drv_id}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /api/sessions/${sc_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
          trigger:
            - call: "POST /api/sessions/${sc_id}/begin-charging"
              payload: {}
              as: StationController
              captures: { c_alloc: $.data.allocated_power_kw }
          assert:
            - "ChargingSession.${sa_id}.allocated_power_kw == 40.0 (PROPORTIONAL share of 100 kW over 60/60/30 request)"
            - "ChargingSession.${sb_id}.allocated_power_kw == 40.0"
            - "ChargingSession.${sc_id}.allocated_power_kw == 20.0"
            - "Site.${site_id}.allocated_total_kw == 100.0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_energy_cost_three_inputs_nested_minmax
        grounds:
          - calculations.session_cost
          - entities.Tariff.fields.energy_tier_1_max_kwh
          - entities.Tariff.fields.energy_tier_2_max_kwh
        distinguishing_aspect: |
          Mode (a): the ENERGY_BASED variable cost is a tiered formula with >=3 inputs
          (kWh, two tier boundaries) and nested min/max tier allocation; 35 kWh splits
          20@30c + 15@25c = 975 cents (not 35*30=1050), proving the nested-tier branch.
        test_recipe:
          setup:
            - "Reuse the ENERGY_BASED site/stall/tariff and the 35 kWh / 25 idle session from session_cost_energy_vs_time_same_session."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "eMSP", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "dt@x.com", full_name: "DT", home_emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { drv_id: $.data.id }
            - call: "POST /api/drivers/${drv_id}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "Site E2", circuit_limit_kw: 200, demand_charge_threshold_kw: 200, allocation_policy: "PRIORITY" }
              as: CPOOperator
              captures: { site_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall_id: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${site_id}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall_id}", driver_id: "${drv_id}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /api/sessions/${sess_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${sess_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:50:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${sess_id}/suspend"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:15:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${sess_id}/meter-events"
              payload: { meter_kwh: 35, sampled_at: "2026-06-01T01:15:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
          trigger:
            - call: "POST /api/sessions/${sess_id}/stop"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { total: $.data.total_cost_cents }
          assert:
            - "ChargingSession.${sess_id}.total_cost_cents == 1825 (energy 975 = 20*30 + 15*25; idle 750; session_fee 100)"

      - name: settlement_round_then_sum_order
        grounds:
          - calculations.roaming_settlement_total
          - entities.SettlementBatch.fields.total_amount_cents
          - entities.SettlementLineItem.fields.net_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Three roaming sessions of
          1825/2850/450 cents at 7.5% commission yield per-line nets 1688/2636/416;
          round-then-sum = 4740, whereas sum-then-round would give 4741. The batch
          total MUST equal 4740 (the pinned round-then-sum order).
        test_recipe:
          setup:
            - "One eMSP (commission 0.075); three roaming home-of-this-eMSP sessions rated to total_cost_cents 1825, 2850, 450."
            - "An OPEN settlement batch for that eMSP with all three sessions added as line items."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "Roam eMSP", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "dr@x.com", full_name: "DR", home_emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { drv_id: $.data.id }
            - call: "POST /api/sites"
              payload: { name: "Site R", circuit_limit_kw: 200, demand_charge_threshold_kw: 200, allocation_policy: "PRIORITY" }
              as: CPOOperator
              captures: { site_id: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${site_id}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall1_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall2_id: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${site_id}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stall3_id: $.data.id }
            # Session 1 -> 1825 (35 kWh, 50 charge min, 25 idle)
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall1_id}", driver_id: "${drv_id}", is_roaming: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /api/sessions/${s1_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${s1_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:50:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s1_id}/suspend"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:15:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s1_id}/meter-events"
              payload: { meter_kwh: 35, sampled_at: "2026-06-01T01:15:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
            - call: "POST /api/sessions/${s1_id}/stop"
              payload: {}
              as: StationController
            # Session 2 -> 2850 (TIME would diverge; here we keep ENERGY but engineer 2850:
            #   energy must be 2750 with idle 0 -> 50@30 not possible; instead use 75 kWh:
            #   20*30 + 30*25 + 25*20 = 600+750+500 = 1850 ... ) -- pin via dedicated TIME tariff below is overlap-forbidden.
            #   Simpler: reach 2850 in ENERGY via idle: energy 1850 (75 kWh) + idle 900 (18 idle min) + 100 = 2850.
            #   75 kWh energy: 600+750+500=1850. idle 18 min beyond grace -> need idle_minutes=28 (28-10=18 -> 18*50=900). total 1850+900+100=2850.
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall2_id}", driver_id: "${drv_id}", is_roaming: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /api/sessions/${s2_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T02:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T02:00:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s2_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T02:40:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s2_id}/suspend"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T03:08:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s2_id}/meter-events"
              payload: { meter_kwh: 75, sampled_at: "2026-06-01T03:08:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
            - call: "POST /api/sessions/${s2_id}/stop"
              payload: {}
              as: StationController
            # Session 3 -> 450 (10 kWh energy 300 + idle 50 (1 min beyond grace) + 100)
            - call: "POST /api/sessions"
              payload: { stall_id: "${stall3_id}", driver_id: "${drv_id}", is_roaming: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { s3_id: $.data.id }
            - call: "POST /api/sessions/${s3_id}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T04:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T04:00:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s3_id}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T04:30:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s3_id}/suspend"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T04:41:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${s3_id}/meter-events"
              payload: { meter_kwh: 10, sampled_at: "2026-06-01T04:41:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
            - call: "POST /api/sessions/${s3_id}/stop"
              payload: {}
              as: StationController
            - call: "POST /api/settlement-batches"
              payload: { emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { batch_id: $.data.id }
            - call: "POST /api/settlement-batches/${batch_id}/line-items"
              payload: { session_id: "${s1_id}" }
              as: CPOOperator
            - call: "POST /api/settlement-batches/${batch_id}/line-items"
              payload: { session_id: "${s2_id}" }
              as: CPOOperator
          trigger:
            - call: "POST /api/settlement-batches/${batch_id}/line-items"
              payload: { session_id: "${s3_id}" }
              as: CPOOperator
              captures: { total: $.data.id }
          assert:
            - "SettlementBatch.${batch_id}.total_amount_cents == 4740 (nets 1688 + 2636 + 416, round-then-sum; NOT 4741)"
            - "SettlementBatch.${batch_id}.line_item_count == 3"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_parallel_charging_and_billing_dimensions
        grounds:
          - state_machines.ChargingSession.CHARGING_to_SUSPENDED
          - state_machines.ChargingSession.SUSPENDED_to_CHARGING
          - state_machines.ChargingSession.RATED_to_SETTLED
        distinguishing_aspect: |
          ChargingSession carries two independent dimensions: charging_status cycles
          CHARGING->SUSPENDED->CHARGING (a cycle) while billing_status evolves
          UNBILLED->RATED->SETTLED separately — proving parallel non-linear shape on
          the ChargingSession entity (distinct entity from the Reservation machine).
        test_recipe:
          setup:
            - "A home session begun-charging, then suspended, then resumed (charging_status cycle), then stopped (billing RATED)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "eMSP", commission_pct: 0.075 }
              as: CPOOperator
              captures: { emsp_id: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "dc@x.com", full_name: "DC", home_emsp_id: "${emsp_id}" }
              as: CPOOperator
              captures: { drv_id: $.data.id }
            - call: "POST /api/drivers/${drv_id}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
