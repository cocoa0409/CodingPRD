          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: substantiation_bans_panelist_revokes_enrollment_retracts_review_requests_takedown
          rationale: "The §1.8 transitive_cascade pair already verifies both declared chains end to end — the four-hop substantiation chain and the three-hop cancellation chain (cancel_releases_kit_units_unlocks_wave_and_uncommits_budget) — including hop ordering and the counters each hop touches. A §1.9 instance could only restate them."

      - name: dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: cost_per_sample_provisional_vs_final_on_campaign
          rationale: "The §1.8 dual_variant_calc pair pins both variant families (cost_per_sample provisional vs final, and panelist_fraud_risk_score screening vs audit on a shared address) with the exact delta on switch, which is strictly stronger than a §1.9 breadth probe."

  # ===========================================================================
  # complexity_profile.consistency_model == immediate: every write's own
  # response, and any read issued straight after it, must already show the
  # derived fields and counters that write touched.
  - section: consistency_model
    instances:

      - name: allocation_response_carries_every_derived_field_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
          - endpoints[POST /sample-shipments]
          - calculations.kit_reservation_selector
          - calculations.cost_per_sample
        distinguishing_aspect: "The allocation response itself — not a later read — already carries the snapshotted reserved_line_units, kit_unit_total and committed_cost_cents, and a cost-summary read issued immediately afterwards already shows the budget moved and the provisional cost recomputed. Nothing about this workflow is allowed to lag behind the write that caused it."
        test_recipe:
          setup:
            - "One campaign in SAMPLING_ACTIVE with the canonical three-line kit: HERO-1 1417 x 1 @ 0.80 -> 283, ACC-2 388 x 2 @ 0.85 -> 116, INS-3 554 x 1 @ 0.90 -> 55, so kit_assembly_unit_cost_cents == 454 and kit_unit_total == 4."
            - "Ten units received on every line; one screened non-holdout enrollment; a center with freight_cents_per_kit 300 and a PLANNED wave with capacity 50, so a shipment commits 454 + 300 == 754."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Immediate Alloc", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
              captures: { kl2_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
              captures: { kl3_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl2_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl3_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "im1@example.com", display_name: "IM One", address_hash: "H-IM1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e1_v: $.data.version }
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /fulfillment-centers"
              payload: { name: "North Pick Center", zone_code: "Z-NORTH", daily_pick_capacity_units: 100, freight_cents_per_kit: 300 }
              as: FulfillmentOps
              captures: { fc1_id: $.data.id }
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc1_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 50 }
              as: FulfillmentOps
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e1_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e1_v}" }
              as: FulfillmentOps
              captures: { sh1_id: $.data.id }
            - call: "GET /campaigns/${camp_id}/cost-summary"
              payload: {}
              as: CampaignManager
          assert:
            - "the allocation returns HTTP status == 201"
            - "the allocation response body already carries kit_unit_total == 4 and committed_cost_cents == 754"
            - "the allocation response body already carries reserved_line_units mapping ${kl1_id} -> 1, ${kl2_id} -> 2 and ${kl3_id} -> 1"
            - "the cost-summary read issued immediately afterwards returns HTTP status == 200 with kit_assembly_unit_cost_cents == 454, cost_per_sample_provisional_cents == 754, cost_per_sample_final_cents == 0, budget_total_cents == 1000000, budget_committed_cents == 754, budget_available_cents == 999246, allocated_sample_count == 1, delivered_sample_count == 0 and write_off_cost_cents == 0"
            - "KitLine.${kl1_id}.units_available == 9, KitLine.${kl2_id}.units_available == 8 and KitLine.${kl3_id}.units_available == 9 in the same cycle"
            - "FulfillmentWave.${w1_id}.planned_unit_count == 4"

