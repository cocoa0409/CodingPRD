      - name: return_request_at_window_boundary_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=81]
          - errors[ERR_RETURN_WINDOW_EXPIRED]
          - global_constants.RETURN_REQUEST_WINDOW_MINUTES
        distinguishing_aspect: "The 4320-minute return window is half-open on settled_at, so a lodgement at exactly settled_at + 72 hours is out of time while one a minute earlier is in time; the transfer is otherwise a perfectly ordinary SETTLED row with exception_status NONE."
        test_recipe:
          setup:
            - "Alpha National Bank (021000021) is LIVE with a position account of 1,200,000,000 cents, a CORPORATE policy and CUST-ALPHA-0001 (baseline 20); Beta Trust Bank (021000089) is LIVE."
            - "Settlement cycle 2026-08-03 is OPEN and Alpha's transfer T1 of 50,000,000 cents to Beta settled at exactly 2026-08-03T13:00:00Z."
            - "The clock is then set to 2026-08-06T13:00:00Z, which is settled_at plus exactly 4320 minutes, and no network sweep is run."
