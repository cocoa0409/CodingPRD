              payload: {}
              as: BureauTaxFiler
            - call: "GET /payroll-runs/${run_o1}"
              payload: {}
              as: BureauTaxFiler
              captures: { run_o1_v3: $.data.version }
            - call: "POST /payroll-runs/${run_o1}/deposits"
              payload: { jurisdiction_id: "${j_fed}", amount_cents: 100000, expected_payroll_run_version: "${run_o1_v3}" }
              as: BureauTaxFiler
              captures: { dep_o2: $.data.id }
          assert:
            - "second schedule while D1 is SCHEDULED returns 409 and err_dup == ERR_DUPLICATE_DEPOSIT (window occupied)"
            - "after D1 SUBMITTED -> FAILED, the new schedule succeeds (201) — the FAILED deposit vacated the occupation window"
            - "TaxDeposit.${dep_o2}.status == SCHEDULED"
            - "TaxDeposit.${dep_o1}.status == FAILED (unchanged)"

      - name: wage_statement_active_key_exclusion_vs_correction_channel
        grounds:
          - validations[priority=18]
          - errors.ERR_DUPLICATE_ACTIVE_STATEMENT
          - state_machines.WageStatement.ISSUED_to_CORRECTED
          - entities.WageStatement.fields.statement_kind
        distinguishing_aspect: |
          Different interval semantics than the deposit occupation window:
          aggregate-capacity-per-key with an EXPLICIT bypass channel — the
          (client, tax_year, employee_ref) key admits exactly one active
          statement, a second ORIGINAL collides, yet a CORRECTION carrying
          corrects_statement_id for the same key is admitted BECAUSE it
          atomically retires the incumbent (ISSUED -> CORRECTED) in the same
          transition. Occupation is released by supersession, not by
          terminal state.
        test_recipe:
          setup:
            - "Clock at 2027-01-15T00:00:00Z (2026 closed)."
            - "Client ACTIVE. ORIGINAL statement for E-100 tax_year 2026 ISSUED (wages 5000000)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-940", name: "IRS Form 940", deposit_frequency: "QUARTERLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 50000 }
              as: BureauCompliance
              captures: { j_futa: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Statement Key Co", ein: "16-1616161" }
              as: BureauOnboarder
              captures: { cl_sk: $.data.id }
            - call: "POST /clients/${cl_sk}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_sk}/registrations"
              payload: { jurisdiction_id: "${j_futa}", agency_account_number: "EFTPS-SK", poa_document_ref: "POA-SK" }
              as: BureauOnboarder
              captures: { reg_sk: $.data.id }
            - call: "POST /registrations/${reg_sk}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_sk}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T00:00:00Z" }
              as: BureauCompliance
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_sk}", tax_year: 2026, employee_ref: "E-100", wages_cents: 5000000, withheld_cents: 1000000 }
              as: BureauTaxFiler
              captures: { ws_sk_orig: $.data.id }
            - call: "POST /wage-statements/${ws_sk_orig}/issue"
              payload: {}
              as: BureauTaxFiler
          trigger:
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_sk}", tax_year: 2026, employee_ref: "E-100", wages_cents: 5500000, withheld_cents: 1100000 }
              as: BureauTaxFiler
              captures: { err_dup_ws: $.data.error_id }
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_sk}", tax_year: 2026, employee_ref: "E-100", wages_cents: 6000000, withheld_cents: 1200000, corrects_statement_id: "${ws_sk_orig}" }
              as: BureauTaxFiler
              captures: { ws_sk_corr: $.data.id }
            - call: "POST /wage-statements/${ws_sk_corr}/issue"
              payload: {}
              as: BureauTaxFiler
          assert:
            - "second ORIGINAL for the same key returns 409 and err_dup_ws == ERR_DUPLICATE_ACTIVE_STATEMENT"
            - "the CORRECTION create succeeds (201) and statement_kind == CORRECTION, corrects_statement_id == ${ws_sk_orig}"
            - "after issuing the correction: WageStatement.${ws_sk_orig}.status == CORRECTED and WageStatement.${ws_sk_corr}.status == ISSUED"
            - "exactly one ISSUED statement exists for (client, 2026, E-100) at every point"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: draft_then_reverse_conserves_client_money_and_tax_pipeline
        grounds:
          - calculations.impound_amount
          - state_machines.PayrollRun.IMPOUNDED_to_REVERSED
          - state_machines.TaxDeposit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: money-in-motion and tax-pipeline totals for the
          client. Forward action (initiate impound 1450000 + schedule
          deposits 250000) paired with its compensating action (treasury
          reversal) leaves: impounded-not-settled total == 0, deposit
          pipeline total == 0, and the sum of liability-relevant run taxes
          (statuses SUBMITTED/IMPOUNDED/SETTLED) back at 0 — bit-for-bit the
          pre-forward state, with only audit artifacts (FundingFailureEvent,
          CreditAssessment, REVERSED run) recording that the cycle happened.
        test_recipe:
          setup:
            - "Clock at default. FED-941 SEMIWEEKLY. Client ACTIVE, VERIFIED registration."
            - "Baseline read: no runs, no deposits, no impounds for the client."
            - "Forward: run (gross 1200000, tax 250000) submitted and IMPOUNDED; deposit 250000 SCHEDULED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { j_fed: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Conserve Co", ein: "17-1717171" }
              as: BureauOnboarder
              captures: { cl_cv: $.data.id }
            - call: "POST /clients/${cl_cv}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_cv}/registrations"
              payload: { jurisdiction_id: "${j_fed}", agency_account_number: "EFTPS-CV", poa_document_ref: "POA-CV" }
              as: BureauOnboarder
              captures: { reg_cv: $.data.id }
            - call: "POST /registrations/${reg_cv}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_cv}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /payroll-runs"
              payload: { client_id: "${cl_cv}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-04T00:00:00Z", gross_pay_cents: 1200000, total_tax_cents: 250000 }
              as: ClientPayrollAdmin
              as_user_id: "${cl_cv}"
              captures: { run_cv: $.data.id, impound_amt: $.data.impound_amount_cents }
            - call: "POST /payroll-runs/${run_cv}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${cl_cv}"
            - call: "GET /clients/${cl_cv}"
              payload: {}
              as: BureauCompliance
              captures: { cl_cv_v: $.data.version }
            - call: "POST /payroll-runs/${run_cv}/initiate-impound"
              payload: { expected_client_version: "${cl_cv_v}" }
              as: ClientPayrollAdmin
              as_user_id: "${cl_cv}"
              captures: { imp_cv: $.data.id }
            - call: "GET /payroll-runs/${run_cv}"
              payload: {}
              as: BureauTaxFiler
              captures: { run_cv_v: $.data.version }
            - call: "POST /payroll-runs/${run_cv}/deposits"
              payload: { jurisdiction_id: "${j_fed}", amount_cents: 250000, expected_payroll_run_version: "${run_cv_v}" }
              as: BureauTaxFiler
              captures: { dep_cv: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${run_cv}/reverse"
              payload: {}
              as: BureauTreasury
          assert:
            - "impound_amt == 1450000  (gross + tax pinned at creation)"
            - "after reversal: PayrollRun.${run_cv}.status == REVERSED and Impound.${imp_cv}.status == FAILED"
            - "TaxDeposit.${dep_cv}.status == CANCELLED"
            - "GET /impounds?client_id=${cl_cv}&status=PENDING returns 0 rows — impounded-not-settled money == 0 (the conserved quantity)"
            - "GET /deposits?client_id=${cl_cv}&status=SCHEDULED returns 0 rows and status=SUBMITTED returns 0 rows — tax pipeline == 0"
            - "the liability-relevant run set (statuses SUBMITTED/IMPOUNDED/SETTLED) for the client is empty — a Q3 return filed now would compute expected_liability_cents == 0, exactly the pre-forward baseline"
            - "audit trail grew: GET /clients/${cl_cv}/funding-failures returns 1 unresolved NSF_RETURN row"

      - name: correction_cycle_conserves_active_statement_count_per_key
        grounds:
          - calculations.wage_statement_annual_total
          - state_machines.WageStatement.DRAFT_to_ISSUED
          - state_machines.WageStatement.ISSUED_to_CORRECTED
        distinguishing_aspect: |
          Conserved quantity of a different type: the COUNT of active
          (ISSUED) wage statements per (client, tax_year, employee_ref) key.
          Forward action (issue correction) paired with the incumbent's
          automatic supersession leaves the active count invariant at
          exactly 1 per key across the whole correction cycle — including a
          correction-of-a-correction — while the reported wage total moves
          from 5000000 to 6000000 to 6500000.
        test_recipe:
          setup:
            - "Clock at 2027-01-15T00:00:00Z."
            - "Client ACTIVE. ORIGINAL for E-100 (5000000) ISSUED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-940", name: "IRS Form 940", deposit_frequency: "QUARTERLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 50000 }
              as: BureauCompliance
              captures: { j_futa: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Correction Chain Co", ein: "18-1818181" }
              as: BureauOnboarder
              captures: { cl_cx: $.data.id }
            - call: "POST /clients/${cl_cx}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_cx}/registrations"
              payload: { jurisdiction_id: "${j_futa}", agency_account_number: "EFTPS-CX", poa_document_ref: "POA-CX" }
              as: BureauOnboarder
              captures: { reg_cx: $.data.id }
            - call: "POST /registrations/${reg_cx}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_cx}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T00:00:00Z" }
              as: BureauCompliance
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_cx}", tax_year: 2026, employee_ref: "E-100", wages_cents: 5000000, withheld_cents: 1000000 }
              as: BureauTaxFiler
              captures: { ws_cx_1: $.data.id }
            - call: "POST /wage-statements/${ws_cx_1}/issue"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_cx}", tax_year: 2026, employee_ref: "E-100", wages_cents: 6000000, withheld_cents: 1200000, corrects_statement_id: "${ws_cx_1}" }
              as: BureauTaxFiler
              captures: { ws_cx_2: $.data.id }
            - call: "POST /wage-statements/${ws_cx_2}/issue"
              payload: {}
              as: BureauTaxFiler
          trigger:
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_cx}", tax_year: 2026, employee_ref: "E-100", wages_cents: 6500000, withheld_cents: 1300000, corrects_statement_id: "${ws_cx_2}" }
              as: BureauTaxFiler
              captures: { ws_cx_3: $.data.id }
            - call: "POST /wage-statements/${ws_cx_3}/issue"
              payload: {}
              as: BureauTaxFiler
            - call: "GET /clients/${cl_cx}/wage-statements/summary"
              payload: { tax_year: 2026 }
              as: BureauTaxFiler
              captures: { cx_wages: $.data.total_wages_cents, cx_count: $.data.active_statement_count }
          assert:
            - "WageStatement.${ws_cx_1}.status == CORRECTED and WageStatement.${ws_cx_2}.status == CORRECTED"
            - "WageStatement.${ws_cx_3}.status == ISSUED and corrects_statement_id == ${ws_cx_2}"
            - "cx_count == 1  (the conserved active-count invariant holds after two supersession hops)"
            - "cx_wages == 6500000  (only the surviving statement contributes)"
            - "GET /wage-statements?client_id=${cl_cx}&tax_year=2026&employee_ref=E-100 returns 3 rows (history preserved) yet the active count stayed 1 throughout"
