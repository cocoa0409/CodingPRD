  # ===========================================================================
  # Rule 7 - cross-entity state dependencies over three different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: slot_present_gated_by_panel_session_state
        grounds:
          - state_machines.PresentationSlot.RESERVED_to_PRESENTED
          - state_machines.CommitteePanel.SCHEDULED_to_IN_SESSION
          - validations[priority=25]
          - errors[ERR_COMMITTEE_PANEL_STATE_INVALID]
        distinguishing_aspect: |
          Entity pair PresentationSlot -> CommitteePanel: the slot is RESERVED and the clock is past
          its start_at, yet POST /presentation-slots/{id}/present fails with
          ERR_COMMITTEE_PANEL_STATE_INVALID (409) purely because the parent panel is still SCHEDULED,
          and the identical call succeeds the moment the panel opens its session.
        test_recipe:
          setup:
            - "State MT is OPEN_TERRITORY with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "The submission is FILED and holds a RESERVED 14:00-14:30 slot on panel MT-A, whose sitting is 2026-10-20 14:00-18:00"
            - "The cycle has reached IN_REVIEW and the clock stands at 2026-10-20T14:00:00Z, but nobody has called open-session, so the panel is still SCHEDULED"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "MT", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
