        claim_type: selector_policy
        grounds: [calculations.dispatch_selection, entities.Coverage.fields.rank]
        distinguishing_aspect: "Selector determinism: with both candidates at the 1.0 reliability default the coverage rank breaks the tie (rank 1 first); after a DECLINE the decliner is excluded from retry and the next offer goes to rank 2 with offer_seq 2."
