              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /qualification-items"
              payload: { gmp_proposal_id: "${prop}", item_type: "ALLOWANCE", text: "hard rock excavation allowance", allowance_amount: 90000.00, allocated_units: 1500, unit_of_measure: "CY" }
              as: ConstructionManager
              captures: { qi: $.data.id }
          trigger:
            - call: "POST /qualification-items/${qi}/allowance-reconciliation"
              payload: { action: "RECONCILE", units: 400, actual_unit_cost: 62.5000, overrun_authorized: true }
              as: ConstructionManager
