# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Custom Grazing & Pasture Rental — task 2143
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: capacity_rating_dry_matter_vs_stocking_history
        grounds:
          - calculations.capacity_assessment_rating
          - entities.CapacityAssessment.fields.method
          - entities.Pasture.fields.rated_head_days
          - entities.Pasture.fields.effective_assessment_id
          - concurrency_rules[assessment-create-stale-pasture]
        distinguishing_aspect: |
          This dual variant lives in the AGRONOMY domain — carrying capacity on a Pasture —
          where DRY_MATTER reads acres x forage x utilization and STOCKING_HISTORY reads
          prior_season_head_days x 0.85, so the same pasture row rates at 20769 head-days
          under one method and 4250 under the other.
        test_recipe:
          setup:
            - "One Grazier, one RangeConsultant, one Pasture (1200 acres, prior_season_head_days 5000) still in DRAFT."
            - "A first DRY_MATTER assessment dated 2026-07-15 has made the pasture rate 683.54 AUM / 20769 head-days."
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Dana Reyes", certification_number: "RC-1102", state_code: "MT" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /grazing/pastures"
              payload: { name: "North Bench", acres: 1200, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 5000 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id, p1_v0: $.data.version }
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${p1_v0}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1800, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { a1: $.data.id, a1_aum: $.data.rated_aum, a1_hd: $.data.rated_head_days }
            - call: "GET /grazing/pastures/${p1}"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1_v1: $.data.version }
          trigger:
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${p1_v1}", method: "STOCKING_HISTORY", utilization_pct: 25, assessment_date: "2026-07-20" }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { a2: $.data.id }
            - call: "GET /grazing/pastures/${p1}"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
          assert:
            - "CapacityAssessment.${a1}.rated_aum == 683.54"
            - "CapacityAssessment.${a1}.rated_head_days == 20769"
            - "CapacityAssessment.${a2}.rated_aum == 139.80"
            - "CapacityAssessment.${a2}.rated_head_days == 4250"
            - "Pasture.${p1}.effective_assessment_id == ${a2}"
            - "Pasture.${p1}.rated_aum == 139.80"
            - "Pasture.${p1}.rated_head_days == 4250"
            - "Pasture.${p1}.version == 3"

      - name: settlement_gain_provisional_prorated_vs_final_adjudicated
        grounds:
          - calculations.settlement_gain
          - calculations.settlement_total
          - entities.Settlement.fields.gain_method
          - entities.Settlement.fields.adjusted_in_weight_lbs
          - state_machines.Settlement.DISPUTED_to_ADJUDICATED
        distinguishing_aspect: |
          This dual variant lives in the MONEY/WEIGHT domain — gain accounting on a
          Settlement — where PROVISIONAL_PRORATED values the missing head at the lot's
          average IN weight (adjusted_in 59874, gain 15096) and FINAL_ADJUDICATED values
          them at the average OUT weight (adjusted_in 59460, gain 15510) from identical
          scale tickets.
        test_recipe:
          setup:
            - "Full F1 fixture: pasture North Bench AVAILABLE at 20769 rated head-days; contract K1 ACTIVE on PER_POUND_OF_GAIN at 85 cents/lb, 3.5% pencil shrink, 150 head committed."
            - "Lot L1 received 150 head at 63745 lb gross (61514 lb shrunk), three treatments APPROVED, two death reports CONFIRMED (4 head), one MAJOR water ticket REPAIRED at 180000 cents, weighed out 146 head at 74970 lb on 2026-11-10."
            - "Settlement S1 was issued at logical clock 2026-11-12 for 1283819 cents and the owner has opened a dispute claiming 15400 lb of gain."
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/cattle-owners"
              payload: { legal_name: "Sixteen Mile Cattle Co", state_code: "MT", brand_registration: "MT-4471", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Dana Reyes", certification_number: "RC-1102", state_code: "MT" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Kim Alvarez", certification_number: "RC-2288", state_code: "MT" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /grazing/pastures"
              payload: { name: "North Bench", acres: 1200, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 5000 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id, p1_v0: $.data.version }
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${p1_v0}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1800, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { a1: $.data.id }
            - call: "POST /grazing/pastures/${p1}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/contracts"
              payload: { cattle_owner_id: "${o1}", pasture_id: "${p1}", billing_mode: "PER_POUND_OF_GAIN", rate_cents: 85, shrink_pct: 3.5, out_shrink_pct: 0, head_count_committed: 150, head_value_cents: 140000, start_date: "2026-08-10", end_date: "2026-11-10", min_days: 60, treatment_cost_split_pct: 33, water_responsibility: "SHARED", fence_responsibility: "GRAZIER", infrastructure_owner_cap_cents: 100000, death_loss_terms: "GRAZIER_SHARE_ABOVE_THRESHOLD", death_loss_threshold_pct: 2.0 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { k1: $.data.id }
            - call: "POST /grazing/contracts/${k1}/submit"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/contracts/${k1}/sign"
              payload: { signature_ref: "SIG-K1" }
              as: CattleOwner
              as_user_id: "${o1}"
            - call: "POST /grazing/contracts/${k1}/lots"
              payload: { scheduled_head_count: 150, scheduled_delivery_date: "2026-08-10" }
              as: Grazier
              as_user_id: "${g1}"
              captures: { l1: $.data.id }
            - call: "POST /grazing/lots/${l1}/receive"
              payload: { head_count_received: 150, gross_weight_lbs: 63745, scale_ticket_ref: "T-1001", received_at: "2026-08-10T09:00:00Z" }
              as: Grazier
              as_user_id: "${g1}"
              captures: { l1_in: $.data.shrunk_weight_in_lbs }
            - call: "POST /grazing/lots/${l1}/treatments"
              payload: { protocol_code: "BRD-A", classification: "ROUTINE_PROTOCOL", treatment_date: "2026-08-20", withdrawal_days: 21, head_treated: 12, drug_cost_cents: 1250, labor_cost_cents: 375 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { t1: $.data.id }
            - call: "POST /grazing/lots/${l1}/treatments"
              payload: { protocol_code: "BRD-A", classification: "ROUTINE_PROTOCOL", treatment_date: "2026-09-02", withdrawal_days: 21, head_treated: 9, drug_cost_cents: 900, labor_cost_cents: 350 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { t2: $.data.id }
            - call: "POST /grazing/lots/${l1}/treatments"
              payload: { protocol_code: "PINK-EYE", classification: "THERAPEUTIC", treatment_date: "2026-09-20", withdrawal_days: 14, head_treated: 4, drug_cost_cents: 4500, labor_cost_cents: 1200 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { t3: $.data.id }
            - call: "POST /grazing/treatments/${t1}/review"
              payload: { decision: "APPROVE" }
              as: CattleOwner
              as_user_id: "${o1}"
            - call: "POST /grazing/treatments/${t2}/review"
              payload: { decision: "APPROVE" }
              as: CattleOwner
              as_user_id: "${o1}"
            - call: "POST /grazing/treatments/${t3}/review"
              payload: { decision: "APPROVE" }
              as: CattleOwner
              as_user_id: "${o1}"
            - call: "POST /grazing/lots/${l1}/death-losses"
              payload: { death_date: "2026-08-20", head_lost: 2, cause: "DISEASE", necropsy_performed: false }
              as: Grazier
              as_user_id: "${g1}"
              captures: { d1: $.data.id }
            - call: "POST /grazing/lots/${l1}/death-losses"
              payload: { death_date: "2026-09-05", head_lost: 2, cause: "DISEASE", necropsy_performed: false }
              as: Grazier
              as_user_id: "${g1}"
              captures: { d2: $.data.id }
            - call: "POST /grazing/death-losses/${d1}/review"
              payload: { decision: "CONFIRM" }
              as: RangeConsultant
              as_user_id: "${c1}"
            - call: "POST /grazing/death-losses/${d2}/review"
              payload: { decision: "CONFIRM" }
              as: RangeConsultant
              as_user_id: "${c1}"
            - call: "POST /grazing/infrastructure-tickets"
              payload: { pasture_id: "${p1}", contract_id: "${k1}", asset_type: "WATER", severity: "MAJOR", description: "Well pump seal leaking at the stock tank", reported_at: "2026-09-10T08:00:00Z" }
              as: Grazier
              as_user_id: "${g1}"
              captures: { i1: $.data.id }
            - call: "POST /grazing/infrastructure-tickets/${i1}/assign"
              payload: { repair_party: "GRAZIER" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/infrastructure-tickets/${i1}/complete"
              payload: { repair_cost_cents: 180000, cause: "WEAR", completed_at: "2026-09-14T17:00:00Z" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/lots/${l1}/weight-events"
              payload: { event_type: "OUT", gross_weight_lbs: 74970, head_count: 146, scale_ticket_ref: "T-2001", weighed_at: "2026-11-10T09:00:00Z" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /grazing/contracts/${k1}"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
              captures: { k1_v: $.data.version }
            - call: "POST /grazing/settlements"
              payload: { contract_id: "${k1}", lot_id: "${l1}", expected_contract_version: "${k1_v}" }
              as: Grazier
              as_user_id: "${g1}"
              captures: { s1: $.data.id, s1_gain_pre: $.data.shrunk_gain_lbs, s1_total_pre: $.data.total_due_cents }
            - call: "POST /grazing/settlements/${s1}/issue"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/settlements/${s1}/dispute"
              payload: { disputed_field: "SHRUNK_GAIN_LBS", claimed_shrunk_gain_lbs: 15400, note: "Dead head were deducted at the in-weight average, not the out-weight average" }
              as: CattleOwner
              as_user_id: "${o1}"
          trigger:
            - call: "POST /grazing/settlements/${s1}/adjudicate"
              payload: { resolution: "UPHELD_OWNER", note: "Owner's out-weight proration is the correct read of the contract" }
              as: RangeConsultant
              as_user_id: "${c2}"
          assert:
            - "The captured pre-adjudication values are ${s1_gain_pre} == 15096 and ${s1_total_pre} == 1283819"
            - "Settlement.${s1}.gain_method == FINAL_ADJUDICATED"
            - "Settlement.${s1}.adjusted_in_weight_lbs == 59460"
            - "Settlement.${s1}.shrunk_gain_lbs == 15510"
            - "Settlement.${s1}.average_daily_gain == 1.1547"
            - "Settlement.${s1}.base_charge_cents == 1318350"
            - "Settlement.${s1}.treatment_charge_cents == 7627"
            - "Settlement.${s1}.infrastructure_charge_cents == 90000"
            - "Settlement.${s1}.death_loss_credit_cents == 84000"
            - "Settlement.${s1}.subtotal_cents == 1331977"
            - "Settlement.${s1}.volume_rebate_cents == 13320"
            - "Settlement.${s1}.total_due_cents == 1318657"
            - "Settlement.${s1}.adjudicator_id == ${c2}"
            - "Settlement.${s1}.status == ADJUDICATED"

      - name: death_loss_liability_owner_bears_all_vs_threshold_share
        grounds:
          - calculations.death_loss_liability
          - entities.GrazingContract.fields.death_loss_terms
          - entities.DeathLossReport.fields.grazier_liable_head
          - entities.DeathLossReport.fields.credit_cents
        distinguishing_aspect: |
          This dual variant lives in the LIVESTOCK-LIABILITY domain — head attribution on a
          DeathLossReport — where an identical 3-head DISEASE loss on a 100-head lot yields
          owner_liable_head 3 / credit 0 under OWNER_BEARS_ALL and owner_liable_head 2 /
          grazier_liable_head 1 / credit 78000 under GRAZIER_SHARE_ABOVE_THRESHOLD.
        test_recipe:
          setup:
            - "Two 600-acre pastures each rated 9807 head-days, each carrying one ACTIVE contract for the same owner."
            - "Contract KA uses death_loss_terms OWNER_BEARS_ALL; contract KB uses GRAZIER_SHARE_ABOVE_THRESHOLD at 2.0%; both declare head_value_cents 130000."
            - "Each contract has a lot that received 100 head and carries one REPORTED death of 3 head on 2026-08-25."
