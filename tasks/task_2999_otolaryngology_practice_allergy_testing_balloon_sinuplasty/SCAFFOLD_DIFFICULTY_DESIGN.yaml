# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2999 — Otolaryngology Practice, Allergy Testing & Balloon Sinuplasty
#
# 9 rule_ids x 2 instances = 18 instances. Every instance grounds exclusively in
# elements declared in SCAFFOLD.yaml §1.1–§1.7. Every numeric literal in an
# `assert:` line was produced by executing the corresponding
# `calculations[].formula` with its `constants:` as code.
#
# Logical clock: the server starts at exactly 2026-08-01T00:00:00Z; every chain
# below that needs a different instant sets it explicitly via
# POST /_clock/set_current_utc.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two instances in DIFFERENT ENTITY DOMAINS: the first variant pair lives on
  # SinuplastyCase (payer-policy authorization), the second on DeviceDispense
  # (audiology hearing-aid trial money).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: candidacy_variant_divergence_on_sinuplasty_case
        grounds:
          - calculations.sinuplasty_candidacy_evaluation
          - entities.SinuplastyCase.fields.evaluation_variant
          - entities.SinuplastyCase.fields.contiguous_management_days
          - entities.SinuplastyCase.fields.cumulative_management_days
          - entities.SinuplastyCase.fields.candidacy_status
          - entities.PayerPolicy.fields.requires_prior_auth
          - state_machines.SinuplastyCase.DRAFT_to_DOCUMENTED
          - endpoints[GET /sinuplasty-cases/{caseId}/candidacy-evaluation]
        distinguishing_aspect: |
          The variant pair is selected by PayerPolicy.requires_prior_auth and the two
          variants disagree on the management-days METRIC, not on a rate: POLICY_STRICT
          reads contiguous_management_days (longest merged span = 14) while
          CLINICAL_BROAD reads cumulative_management_days (14 + 14 = 28), so byte-identical
          documentation yields candidacy_status INELIGIBLE under one plan and ELIGIBLE
          under the other; this instance lives on the SinuplastyCase entity domain,
          whereas the sibling instance lives on DeviceDispense.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; no explicit clock call is needed."
            - "PayerPolicy STRICT-2999 with requires_prior_auth true, min_medical_management_days 28, min_documented_criteria 3, requires_ct_within_months 12."
            - "PayerPolicy BROAD-2999 identical except requires_prior_auth false."
            - "One Patient under each plan; one SinuplastyCase in status DOCUMENTED under each patient."
            - "Both cases carry byte-identical documentation: ct_study_date 2026-05-01 (92 days old, inside the 12*30=360 day window), two non-adjacent therapy courses INCS 2026-06-01..2026-06-14 (14 days) and ABX 2026-06-20..2026-07-03 (14 days), and criteria codes [CT_OPACIFICATION, FAILED_INCS, FAILED_ABX]."
            - "The 6-day gap between the two courses means the merge pass produces two spans, so contiguous_management_days is 14 while cumulative_management_days is 28."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Strict Mutual", plan_code: "STRICT-2999", requires_prior_auth: true, min_medical_management_days: 28, requires_ct_within_months: 12, min_documented_criteria: 3, covered_pct_bps: 8000, observation_floor_minutes: 20 }
              as: PracticeAdmin
              captures: { pol_strict_id: $.data.id }
            - call: "POST /payer-policies"
              payload: { payer_name: "Broad Mutual", plan_code: "BROAD-2999", requires_prior_auth: false, min_medical_management_days: 28, requires_ct_within_months: 12, min_documented_criteria: 3, covered_pct_bps: 8000, observation_floor_minutes: 20 }
              as: PracticeAdmin
              captures: { pol_broad_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_strict_id}", mrn: "MRN-10001", full_name: "Strict Plan Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true, prior_systemic_reaction_count: 0 }
              as: PracticeAdmin
              captures: { pat_strict_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_broad_id}", mrn: "MRN-10002", full_name: "Broad Plan Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true, prior_systemic_reaction_count: 0 }
              as: PracticeAdmin
              captures: { pat_broad_id: $.data.id }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_strict_id}", laterality: "BILATERAL", sinuses: ["MAXILLARY", "FRONTAL"] }
              as: Otolaryngologist
              captures: { case_strict_id: $.data.id }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_broad_id}", laterality: "BILATERAL", sinuses: ["MAXILLARY", "FRONTAL"] }
              as: Otolaryngologist
              captures: { case_broad_id: $.data.id }
            - call: "POST /sinuplasty-cases/${case_strict_id}/documentation"
              payload: { ct_study_date: "2026-05-01", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }, { therapy_code: "ABX", start_date: "2026-06-20", end_date: "2026-07-03" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "FAILED_ABX"] }
              as: Otolaryngologist
            - call: "POST /sinuplasty-cases/${case_broad_id}/documentation"
              payload: { ct_study_date: "2026-05-01", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }, { therapy_code: "ABX", start_date: "2026-06-20", end_date: "2026-07-03" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "FAILED_ABX"] }
              as: Otolaryngologist
          trigger:
            - call: "GET /sinuplasty-cases/${case_strict_id}/candidacy-evaluation"
              payload: {}
              as: PayerLiaison
              captures: { strict_metric: $.data.management_days_metric, strict_status: $.data.candidacy_status }
            - call: "GET /sinuplasty-cases/${case_broad_id}/candidacy-evaluation"
              payload: {}
              as: PayerLiaison
              captures: { broad_metric: $.data.management_days_metric, broad_status: $.data.candidacy_status }
          assert:
            - "strict evaluation: evaluation_variant == \"POLICY_STRICT\""
            - "strict evaluation: criteria_met_count == 3"
            - "strict evaluation: contiguous_management_days == 14"
            - "strict evaluation: cumulative_management_days == 28"
            - "strict evaluation: management_days_metric == 14 (the contiguous figure)"
            - "strict evaluation: min_medical_management_days_required == 28 and candidacy_status == \"INELIGIBLE\""
            - "broad evaluation: evaluation_variant == \"CLINICAL_BROAD\""
            - "broad evaluation: criteria_met_count == 3"
            - "broad evaluation: contiguous_management_days == 14"
            - "broad evaluation: cumulative_management_days == 28"
            - "broad evaluation: management_days_metric == 28 (the cumulative figure)"
            - "broad evaluation: candidacy_status == \"ELIGIBLE\""
            - "The two evaluations differ ONLY in management_days_metric and candidacy_status; criteria_met_count is 3 on both sides"
            - "SinuplastyCase.${case_strict_id}.candidacy_status == \"INELIGIBLE\" and SinuplastyCase.${case_broad_id}.candidacy_status == \"ELIGIBLE\" after documentation"
            - "Both cases remain in status DOCUMENTED — GET /sinuplasty-cases/{caseId}/candidacy-evaluation mutates nothing"

      - name: refund_variant_divergence_on_device_dispense
        grounds:
          - calculations.device_trial_refund
          - entities.DeviceDispense.fields.refund_variant
          - entities.DeviceDispense.fields.restock_fee_cents
          - entities.DeviceDispense.fields.refund_cents
          - entities.DeviceDispense.fields.trial_end_at
          - entities.PayerPolicy.fields.restock_fee_bps
          - entities.PayerPolicy.fields.restock_fee_floor_cents
          - state_machines.DeviceDispense.FITTED_to_RETURNED
          - concurrency_rules[dispense-create-stale-study]
        distinguishing_aspect: |
          The variant pair is selected by the half-open clock comparison
          clock < dispense.trial_end_at, not by any policy flag, and the POST_TRIAL branch
          skips the restocking and wear arithmetic entirely rather than scaling it: two
          dispenses created from the same price_cents 289000 and the same 30-day window
          settle at refund_cents 241450 and refund_cents 0 respectively; this instance
          lives on the DeviceDispense entity domain, whereas the sibling instance lives
          on SinuplastyCase.
        test_recipe:
          setup:
            - "PayerPolicy AUD-2999 with device_trial_days 30, restock_fee_bps 1500, restock_fee_floor_cents 12500."
            - "One adult Patient under that plan; a HEARING_AID SupplyLot with quantity_received 5."
            - "Two separate AUDIOMETRY DiagnosticStudy rows for that patient, each with pta_db_hl 55.0 so study_recommendation yields HEARING_AID, each INTERPRETED by a different user than the performer."
            - "Two DeviceDispense rows created at clock 2026-08-01T00:00:00Z with price_cents 289000, so both carry trial_end_at 2026-08-31T00:00:00Z."
            - "Each dispense hangs off its OWN study, so neither supersedes the other."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Audio Mutual", plan_code: "AUD-2999", requires_prior_auth: true, device_trial_days: 30, restock_fee_bps: 1500, restock_fee_floor_cents: 12500, appliance_covered: true, covered_pct_bps: 8000 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10011", full_name: "Trial Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1001", quantity_received: 5, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              captures: { study1_id: $.data.id }
            - call: "POST /diagnostic-studies/${study1_id}/results"
              payload: { pta_db_hl: 55.0, word_recognition_pct: 72.0 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study1_id}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { study1_v: $.data.version }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study1_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA100001", ear: "RIGHT", price_cents: 289000, expected_study_version: "${study1_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp1_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              captures: { study2_id: $.data.id }
            - call: "POST /diagnostic-studies/${study2_id}/results"
              payload: { pta_db_hl: 55.0, word_recognition_pct: 70.0 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study2_id}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { study2_v: $.data.version }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study2_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA100002", ear: "LEFT", price_cents: 289000, expected_study_version: "${study2_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /device-dispenses/${disp1_id}/trial-return"
              payload: { return_reason: "DISSATISFIED" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { d1_variant: $.data.refund_variant, d1_refund: $.data.refund_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /device-dispenses/${disp2_id}/trial-return"
              payload: { return_reason: "DISSATISFIED" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { d2_variant: $.data.refund_variant, d2_refund: $.data.refund_cents }
          assert:
            - "DeviceDispense.${disp1_id}.refund_variant == \"IN_TRIAL\" (clock 2026-08-12T00:00:00Z < trial_end_at 2026-08-31T00:00:00Z)"
            - "DeviceDispense.${disp1_id}.days_used == 12"
            - "DeviceDispense.${disp1_id}.restock_fee_cents == 43350"
            - "DeviceDispense.${disp1_id}.refund_cents == 241450"
            - "DeviceDispense.${disp1_id}.billing_status == \"REFUND_PENDING\""
            - "DeviceDispense.${disp1_id}.fit_status == \"RETURNED\""
            - "DeviceDispense.${disp2_id}.refund_variant == \"POST_TRIAL\" (clock 2026-09-05T00:00:00Z >= trial_end_at 2026-08-31T00:00:00Z)"
            - "DeviceDispense.${disp2_id}.days_used == 36"
            - "DeviceDispense.${disp2_id}.restock_fee_cents == 0"
            - "DeviceDispense.${disp2_id}.refund_cents == 0"
            - "DeviceDispense.${disp2_id}.billing_status == \"RETAINED\""
            - "DeviceDispense.${disp2_id}.fit_status == \"RETURNED\""
            - "The two dispenses carry identical price_cents 289000 and identical trial_end_at 2026-08-31T00:00:00Z, so the 241450 vs 0 delta is attributable only to the variant selection"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Instance 1 is mode (b) (nested rounding where the ORDER matters).
  # Instance 2 is mode (c) (circular-looking dependency where the EVALUATION
  # ORDER must be explicit). Different modes, as §0.5 requires.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allergy_billing_per_unit_rounding_order
        grounds:
          - calculations.allergy_panel_billing
          - entities.AllergyTestOrder.fields.billed_units
          - entities.AllergyTestOrder.fields.practice_charge_cents
          - entities.AllergyTestOrder.fields.patient_responsibility_cents
          - entities.PayerPolicy.fields.covered_pct_bps
          - state_machines.AllergyTestOrder.ADMINISTERED_to_READ
          - endpoints[POST /allergy-test-orders/{orderId}/readings]
        distinguishing_aspect: |
          Mode (b): the scaffold pins round_half_up PER UNIT and only then multiplies by
          billed_units, so ENV_36 + SKIN_PRICK at tier_factor 0.8500 bills
          practice_charge_cents 54324 and patient_responsibility_cents 10872, whereas the
          forbidden sum-then-round order yields 54315 and 10863 — a 9-cent divergence that
          exists only because of the rounding position, not because of any input change.
        test_recipe:
          setup:
            - "PayerPolicy BILL-2999 with covered_pct_bps 8000 and observation_floor_minutes 20."
            - "One adult Patient (dob 1988-06-20, age_months 457) with prior_systemic_reaction_count 0 and epinephrine_on_file true, so risk_score is 5 at administration and the observation window is the 30-minute SKIN_PRICK base."
            - "One AllergyTestOrder ENV_36 / SKIN_PRICK, administered at clock 2026-08-01T09:00:00Z, so antigen_count is 36 and tier_factor is 0.8500 (36 >= 31)."
            - "Clock advanced to 2026-08-01T09:30:00Z so exactly 30 minutes have elapsed and ERR_OBSERVATION_NOT_COMPLETE cannot fire."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Billing Mutual", plan_code: "BILL-2999", requires_prior_auth: true, covered_pct_bps: 8000, observation_floor_minutes: 20 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10031", full_name: "Billing Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true, prior_systemic_reaction_count: 0 }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "ENV_36", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { order_id: $.data.id }
            - call: "POST /allergy-test-orders/${order_id}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { obs_minutes: $.data.observation_required_minutes }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:30:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /allergy-test-orders/${order_id}/readings"
              payload: { positive_antigen_count: 12, max_wheal_mm: 8.0 }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { charge: $.data.practice_charge_cents, patient_owes: $.data.patient_responsibility_cents }
          assert:
            - "AllergyTestOrder.${order_id}.status == \"READ\""
            - "AllergyTestOrder.${order_id}.antigen_count == 36"
            - "AllergyTestOrder.${order_id}.billed_units == 36"
            - "AllergyTestOrder.${order_id}.practice_charge_cents == 54324"
            - "AllergyTestOrder.${order_id}.practice_charge_cents != 54315 (sum-then-round is the wrong order)"
            - "AllergyTestOrder.${order_id}.patient_responsibility_cents == 10872"
            - "AllergyTestOrder.${order_id}.patient_responsibility_cents != 10863 (sum-then-round is the wrong order)"
            - "AllergyTestOrder.${order_id}.observation_required_minutes == 30 (risk_score 5 at administration, policy floor 20)"
            - "Patient.${pat_id}.sensitized_antigen_count == 12 after the reading"
            - "Patient.${pat_id}.risk_score == 17 (5 base + 0 prior + 12 sensitization)"

      - name: dose_dilution_band_from_pre_rollback_step
        grounds:
          - calculations.immunotherapy_next_dose_volume
          - entities.ImmunotherapyDose.fields.escalation_step_at_dose
          - entities.ImmunotherapyDose.fields.gap_days_at_dose
          - entities.ImmunotherapyDose.fields.volume_ml
          - entities.ImmunotherapyVial.fields.dilution_code
          - entities.Patient.fields.immunotherapy_escalation_step
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_CLEARED
          - errors[ERR_DILUTION_MISMATCH]
          - concurrency_rules[vial-create-stale-patient]
        distinguishing_aspect: |
          Mode (c): required_dilution and volume_ml both read "the escalation step", but the
          scaffold pins the evaluation order — the dilution band is read from the PRE-rollback
          step 7 (MAINTENANCE / YELLOW_1_10) while the volume is read from the POST-rollback
          step 4 (0.30 mL); evaluating both on the same step would have demanded BLUE_1_100
          for step 4 and rejected the accepted YELLOW_1_10 vial with ERR_DILUTION_MISMATCH.
        test_recipe:
          setup:
            - "PayerPolicy IMM-2999 with observation_floor_minutes 20."
            - "One adult Patient (epinephrine_on_file true, prior_systemic_reaction_count 0, risk_score 5) under that plan."
            - "One ALLERGEN_CONCENTRATE SupplyLot with quantity_received 20."
            - "A BLUE_1_100 vial with volume_ml_initial 5.00, label-verified by a second nurse, on which six doses at steps 1..6 (0.05 + 0.10 + 0.20 + 0.30 + 0.40 + 0.50 = 1.55 mL) are administered and cleared 30 minutes apart on 2026-08-01, leaving Patient.immunotherapy_escalation_step at 7 and last_dose_administered_at 2026-08-01T11:30:00Z."
            - "A YELLOW_1_10 vial with volume_ml_initial 5.00 is then compounded against a freshly re-read Patient.version, superseding the BLUE vial, and label-verified by the second nurse."
            - "Clock moved to 2026-08-29T11:30:00Z — exactly 28 days after the last dose, so gap_days is 28 and the MAINTENANCE_GAP_DAYS rollback of 3 steps fires exactly once."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Immuno Mutual", plan_code: "IMM-2999", requires_prior_auth: true, observation_floor_minutes: 20, covered_pct_bps: 8000 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10041", full_name: "Immuno Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true, prior_systemic_reaction_count: 0 }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v1: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1002", quantity_received: 20, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "BLUE 1-100 MRN-10041", expires_at: "2027-06-30T00:00:00Z", volume_ml_initial: 5.00, expected_patient_version: "${pat_v1}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { blue_vial_id: $.data.id }
            - call: "POST /immunotherapy-vials/${blue_vial_id}/label-verification"
              payload: { label_text_confirmation: "BLUE 1-100 MRN-10041" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${blue_vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:30:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose1_id}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${blue_vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose2_id}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${blue_vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:30:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose3_id}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${blue_vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose4_id}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
