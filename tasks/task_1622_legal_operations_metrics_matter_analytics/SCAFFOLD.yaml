    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: { counsel_id: string, total_allocated_hours: integer, annual_capacity_hours: integer, utilization_pct: number, over_capacity: boolean }
    side_effects: []

  # --- Matters ---
  - method: POST
    path: "/legal-ops/matters"
    description: "Create a matter in INTAKE status"
    roles: [LegalOpsAnalyst]
    code: 201
    input: [matter_number, title, practice_area_id, matter_type_id, fiscal_period_id, lead_counsel_id, "primary_firm_id?", "budget_cents?"]
    output: Matter
