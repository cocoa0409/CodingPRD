- section: validations
  instances:
  - name: missing_auth_headers_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request without X-User-Role/X-User-ID fails authentication with 401 ERR_UNAUTHENTICATED before any other check.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-1
          min_elevation_ft: 100
          max_elevation_ft: 900
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_UNAUTHENTICATED (HTTP 401)
  - name: unknown_role_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    distinguishing_aspect: An undeclared role string is an authentication failure (401 ERR_UNAUTHENTICATED), not an authorization failure.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /reforestation/seed-zones
        payload:
          zone_code: Z-1
          min_elevation_ft: 100
          max_elevation_ft: 900
        as: SuperUser
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_UNAUTHENTICATED (HTTP 401)
