          - validations[priority=12]
          - errors[ERR_TOO_LATE_FOR_CHECKIN]
          - entities.Appointment.fields.late_minutes
        distinguishing_aspect: |
          Numeric threshold metric: check-in at exactly
          scheduled_start + 30 minutes succeeds (<= boundary inclusive) while
          31 minutes fails with ERR_TOO_LATE_FOR_CHECKIN — exercising the
          exact >= vs > precision of the late-arrival rule via the check-in
          endpoint.
        test_recipe:
          setup:
            - "Two READY appointments A1 (will check in exactly at cutoff) and A2 (will check in one minute past cutoff), both CLEAR gate"
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
