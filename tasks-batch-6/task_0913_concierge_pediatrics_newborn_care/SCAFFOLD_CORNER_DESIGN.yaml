# =============================================================================
# Section 1.9 - Scaffold Corner Design (breadth coverage index)
# concierge-pediatrics-newborn-care
# Sections and claim_types are taken verbatim from
# references/claim-extraction-guide.md. Instances already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because` stub and no
# test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_create_membership_plan_echoes_every_declared_field
        claim_type: Creation
        grounds:
          - entities.MembershipPlan
          - endpoints.POST_/peds/membership-plans
        distinguishing_aspect: "POST /peds/membership-plans with all seven input fields returns 201 and a body carrying every declared field plus the four common fields, with version 1."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-05-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /peds/membership-plans"
              payload: { tier: "PREMIER", monthly_rate_cents: 60000, included_lactation_consults: 6, included_sleep_consults: 4, form_sla_hours: 24, after_hours_surcharge_waived: true, overage_consult_fee_cents: 12000 }
              as: PracticeAdmin
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
          assert:
            - "the response HTTP status == 201"
            - "MembershipPlan.${plan_id}.tier == PREMIER"
            - "MembershipPlan.${plan_id}.monthly_rate_cents == 60000"
            - "MembershipPlan.${plan_id}.included_lactation_consults == 6"
            - "MembershipPlan.${plan_id}.included_sleep_consults == 4"
            - "MembershipPlan.${plan_id}.form_sla_hours == 24"
            - "MembershipPlan.${plan_id}.after_hours_surcharge_waived == true"
            - "MembershipPlan.${plan_id}.overage_consult_fee_cents == 12000"
            - "MembershipPlan.${plan_id}.version == 1 and id is a bare UUID with no type prefix"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type object"

      - name: corner_get_child_returns_computed_age_days_and_slot_weight
        claim_type: Computed Fields
        grounds:
          - entities.Child.fields.age_days
          - entities.Child.fields.current_slot_weight
          - calculations.panel_weighted_occupancy
          - endpoints.GET_/peds/children/{child_id}
        distinguishing_aspect: "Child.age_days and Child.current_slot_weight are recomputed from the logical clock on every read: the same child reads 92 days at weight 2.0 on 2026-06-01 and 396 days at weight 1.5 on 2027-04-01."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One family and one child born 2026-03-01"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/families"
              payload: { household_name: "Adeyemi", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Femi", date_of_birth: "2026-03-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
          trigger:
            - call: "GET /peds/children/${child_id}"
              payload: {}
              as: CareCoordinator
              captures: { age0: "$.data.age_days", w0: "$.data.current_slot_weight" }
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "GET /peds/children/${child_id}"
              payload: {}
              as: CareCoordinator
              captures: { age1: "$.data.age_days", w1: "$.data.current_slot_weight" }
          assert:
            - "at clock 2026-06-01, Child.${child_id}.age_days == 92 and current_slot_weight == 2.0"
            - "at clock 2027-04-01, Child.${child_id}.age_days == 396 and current_slot_weight == 1.5"
            - "Child.${child_id}.family_id == ${fam_id} and date_of_birth == 2026-03-01 in both reads"

      - name: corner_list_children_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/peds/children
          - response_envelope.pagination_fields
          - list_ordering
        distinguishing_aspect: "GET /peds/children with limit 2 and offset 0 returns the two earliest-created rows, total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One family carrying exactly three children created in the order Uno, Dos, Tres"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/families"
              payload: { household_name: "Barros", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Uno", date_of_birth: "2026-01-01" }
              as: PracticeAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Dos", date_of_birth: "2026-02-01" }
              as: PracticeAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Tres", date_of_birth: "2026-03-01" }
              as: PracticeAdmin
              captures: { c3: "$.data.id" }
          trigger:
            - call: "GET /peds/children"
              payload: { family_id: "${fam_id}", limit: 2, offset: 0 }
              as: CareCoordinator
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /peds/children"
              payload: { family_id: "${fam_id}", limit: 2, offset: 2 }
              as: CareCoordinator
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "the first page returns exactly 2 rows with ids ${c1} then ${c2}, in created_at ASC order"
            - "the first page envelope carries total_count 3, limit 2, offset 0 and has_more true"
            - "the second page returns exactly 1 row with id ${c3}"
            - "the second page envelope carries total_count 3, limit 2, offset 2 and has_more false"
            - "response_type == array on both pages"

      - name: corner_get_membership_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=6]
          - errors[ERR_MEMBERSHIP_NOT_FOUND]
          - endpoints.GET_/peds/memberships/{membership_id}
        distinguishing_aspect: "A syntactically valid UUID that matches no Membership row yields ERR_MEMBERSHIP_NOT_FOUND with HTTP 404, not ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "GET /peds/memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PracticeAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_MEMBERSHIP_NOT_FOUND"
            - "the response HTTP status == 404"
            - "response_type == error and data carries both error_id and message"

      - name: corner_create_child_missing_required_date_of_birth_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=9]
          - errors[ERR_VALIDATION]
          - entities.Child.fields.date_of_birth
        distinguishing_aspect: "date_of_birth has source input and no default, so omitting it from POST /peds/children returns ERR_VALIDATION with HTTP 400 and creates no Child row."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z and one family"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/families"
              payload: { household_name: "Costa", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id" }
          trigger:
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Nia" }
              as: PracticeAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_VALIDATION"
            - "the response HTTP status == 400"
            - "GET /peds/children filtered by family_id ${fam_id} returns 0 rows"

      - name: corner_create_insurance_policy_omitting_status_defaults_to_active
        claim_type: Defaults
        grounds:
          - entities.InsurancePolicy.fields.status
          - entities.InsurancePolicy.fields.deductible_met_cents
          - endpoints.POST_/peds/insurance-policies
        distinguishing_aspect: "status is the only optional input on POST /peds/insurance-policies; omitting it yields ACTIVE, and deductible_met_cents is initialised to 0 regardless of input."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z and one family"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/families"
              payload: { household_name: "Dumont", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id" }
          trigger:
            - call: "POST /peds/insurance-policies"
              payload: { family_id: "${fam_id}", carrier_name: "Lakeside", deductible_cents: 30000, coinsurance_rate: 0.25 }
              as: BillingSpecialist
              captures: { pol_id: "$.data.id", pol_status: "$.data.status" }
          assert:
            - "the response HTTP status == 201"
            - "InsurancePolicy.${pol_id}.status == ACTIVE"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 0"
            - "InsurancePolicy.${pol_id}.version == 1"
            - "GET /peds/insurance-policies filtered by family_id ${fam_id} returns exactly 1 row"

      - name: corner_create_family_with_client_supplied_id_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Family
          - endpoints.POST_/peds/families
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted; a client-supplied id in the body is ignored and the returned id is a fresh server UUID that does not equal the supplied value."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /peds/families"
              payload: { household_name: "Erikson", family_monthly_cap_cents: 90000, id: "11111111-1111-4111-8111-111111111111", version: 99 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v: "$.data.version" }
          assert:
            - "the response HTTP status == 201"
            - "Family.${fam_id}.id != 11111111-1111-4111-8111-111111111111"
            - "Family.${fam_id}.version == 1"
            - "Family.${fam_id}.household_name == Erikson and family_monthly_cap_cents == 90000"
            - "Family.${fam_id}.active_membership_count == 0"

      - name: corner_create_plan_with_invalid_enum_tier_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_ENUM]
          - entities.MembershipPlan.fields.tier
        distinguishing_aspect: "tier accepts only ESSENTIAL, PLUS and PREMIER; the value GOLD returns ERR_INVALID_ENUM with HTTP 400, distinct from the ERR_VALIDATION raised by a missing field."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /peds/membership-plans"
              payload: { tier: "GOLD", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_INVALID_ENUM"
            - "the response HTTP status == 400"

      - name: corner_create_child_with_unknown_family_id_returns_family_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=14]
          - errors[ERR_FAMILY_NOT_FOUND]
          - entities.Child.fields.family_id
        distinguishing_aspect: "The body FK rung (priority 14) fires before any business rule: an unknown family_id returns ERR_FAMILY_NOT_FOUND with HTTP 404 even though every other field is well formed."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /peds/children"
              payload: { family_id: "22222222-2222-4222-8222-222222222222", first_name: "Ghost", date_of_birth: "2026-01-01" }
              as: PracticeAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_FAMILY_NOT_FOUND"
            - "the response HTTP status == 404"

      - name: corner_membership_denormalizes_family_id_from_child
        claim_type: Creation
        grounds:
          - entities.Membership.fields.family_id
          - entities.Membership.fields.child_id
          - endpoints.GET_/peds/memberships
        distinguishing_aspect: "The flat topology carries no nested URLs, so Membership.family_id is denormalized from Child.family_id at creation; filtering GET /peds/memberships by family_id therefore finds the row even though family_id was never supplied in the request body."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One PLUS plan, one physician with panel_slot_cap 20.0, one family and one child born 2026-04-01"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Fontaine", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Lior", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
          trigger:
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: CareCoordinator
              captures: { mem_id: "$.data.id", mem_fam: "$.data.family_id" }
            - call: "GET /peds/memberships"
              payload: { family_id: "${fam_id}" }
              as: PracticeAdmin
              captures: { found_id: "$.data[0].id" }
          assert:
            - "Membership.${mem_id}.family_id == ${fam_id}"
            - "GET /peds/memberships filtered by family_id ${fam_id} returns exactly 1 row whose id == ${mem_id}"
            - "GET /peds/memberships filtered by child_id ${child_id} returns the same single row"
            - "GET /peds/memberships filtered by physician_id ${doc_id} returns the same single row"
            - "GET /peds/memberships filtered by plan_id ${plus_plan_id} returns the same single row"
            - "Family.${fam_id}.active_membership_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_cancel_membership_twice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - validations[priority=22]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is the Membership machine's only terminal state; a second cancel returns ERR_INVALID_STATE with HTTP 409 and fires no cascade, so the physician's weighted_occupancy is unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One PLUS plan, one physician with panel_slot_cap 20.0, one family, one child born 2026-04-01"
            - "One membership started 2026-06-01, already cancelled effective 2026-06-01"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Grigoriev", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Ira", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_id: "$.data.id" }
            - call: "GET /peds/families/${fam_id}"
              payload: {}
              as: PracticeAdmin
              captures: { fam_v1: "$.data.version" }
            - call: "POST /peds/memberships/${mem_id}/cancel"
              payload: { effective_date: "2026-06-01", expected_family_version: "${fam_v1}" }
              as: PracticeAdmin
            - call: "GET /peds/families/${fam_id}"
              payload: {}
              as: PracticeAdmin
              captures: { fam_v2: "$.data.version" }
          trigger:
            - call: "POST /peds/memberships/${mem_id}/cancel"
              payload: { effective_date: "2026-06-01", expected_family_version: "${fam_v2}" }
              as: PracticeAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_INVALID_STATE"
            - "the response HTTP status == 409"
            - "Membership.${mem_id}.status == CANCELLED and slot_weight == 0.0"
            - "Physician.${doc_id}.weighted_occupancy == 0.0"
            - "Family.${fam_id}.version == ${fam_v2} - the rejected cancel advanced nothing"

      - name: corner_complete_clinical_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Encounter.SCHEDULED_to_CLINICALLY_COMPLETE
          - validations[priority=22]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The clinical axis only accepts complete-clinical from SCHEDULED; a repeat call on a CLINICALLY_COMPLETE encounter returns ERR_INVALID_STATE 409 and leaves clinical_note at its first value."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T20:00:00Z"
            - "One PLUS plan, one physician with panel_slot_cap 20.0 licensed in CA"
            - "One family, one child, an ACTIVE membership started 2026-06-01 with the June invoice of 40000 cents PAID"
            - "One SICK_VISIT encounter already clinically completed with the note 'First note'"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Haddad", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Sami", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_id: "$.data.id" }
            - call: "GET /peds/invoices"
              payload: { family_id: "${fam_id}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /peds/invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "POST /peds/invoices/${inv_id}/pay"
              payload: { amount_paid_cents: 40000 }
              as: BillingSpecialist
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T20:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/encounters"
              payload: { membership_id: "${mem_id}", encounter_type: "SICK_VISIT", modality: "IN_PERSON", patient_state_code: "CA", started_at: "2026-06-15T10:00:00Z" }
              as: CareCoordinator
              captures: { enc_id: "$.data.id" }
            - call: "POST /peds/encounters/${enc_id}/complete-clinical"
              payload: { clinical_note: "First note" }
              as: Physician
              as_user_id: "${doc_id}"
          trigger:
            - call: "POST /peds/encounters/${enc_id}/complete-clinical"
              payload: { clinical_note: "Second note" }
              as: Physician
              as_user_id: "${doc_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_INVALID_STATE"
            - "the response HTTP status == 409"
            - "Encounter.${enc_id}.clinical_note == First note"
