    - entities.FosterHome.fields.current_kittens
    distinguishing_aspect: 'Conserved quantity: FosterHome.current_kittens. Invariant: for any

      home, current_kittens == count of its ACTIVE placements. Placement

      (+1) paired with graduate or return-to-program (-1) leaves the

      home''s current_kittens exactly as before the pair.

