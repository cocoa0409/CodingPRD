      - name: selector_ranking_level_rank_then_measure_precedence_then_priority
        grounds:
          - calculations.placement_rule_selection
          - entities.PlacementRule.fields.priority_rank
          - entities.Course.fields.level_rank
          - entities.PlacementDetermination.fields.applied_rule_id
          - state_machines.PlacementDetermination.PROVISIONAL_to_SUPERSEDED
        distinguishing_aspect: |
          Mode (a): the winner is a nested selection over THREE interacting
          inputs evaluated in a fixed order — Course.level_rank DESC, then
          MEASURE_PRECEDENCE[measure_type] ASC, then priority_rank ASC. Three
          rules qualify; the TEST_SCORE rule carries the best priority_rank (1)
          and the winning TRANSCRIPT_GPA rule the worst (99), yet the transcript
          rule wins because measure precedence outranks priority_rank. Activating
          a fourth transcript rule that targets a DIFFERENT course of the SAME
          level_rank (priority_rank 50) then flips the winner on the third key
          alone, proving priority_rank is consulted only after the first two keys
          tie. Any implementation that sorts on priority_rank first, or that
          stops after level_rank, gets one of the two answers wrong.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
