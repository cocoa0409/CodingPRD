      - name: calibration_result_on_an_unscheduled_record_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProcedureRecord.SCHEDULED_to_PASSED
          - state_machines.ProcedureRecord.REQUIRED_to_SCHEDULED
          - validations.priority_42
          - errors.ERR_CALIBRATION_STATE
        distinguishing_aspect: >-
          The calibration machine is entered only through a booking: a result filed on a REQUIRED
          record is ERR_CALIBRATION_STATE (409), and once the record is PASSED the same error blocks
          re-scheduling it. Both refusals leave CalibrationBay.scheduled_window_count exactly where it
          was, so a rejected call never consumes bay capacity.
        test_recipe:
          setup:
            - "A STATIC calibration bay with concurrent_capacity 2 and one RepairOrder carrying an ADAS ProcedureRecord at REQUIRED."
          setup_api_calls:
            - call: "POST /customers"
