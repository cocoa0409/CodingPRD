            - { call: "POST /regatta-ops/mark-boats", payload: { regatta_id: "${reg2}", call_sign: "MB-2", crew_capacity: 3 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { mb2: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg1}", member_id: "${m_pro}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg1}", member_id: "${m_pro}", mark_boat_id: "${mb1}", position: "PRO", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg1}", member_id: "${m_pro}", mark_boat_id: "${mb2}", position: "SAFETY_BOAT", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg1}", member_id: "${m_pro}", mark_boat_id: "${mb1}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_ok: $.data.id } }
          assert:
            - "trigger calls 1, 2 and 3 each return HTTP 422 with error_id ERR_MARK_BOAT_ASSIGNMENT_INVALID"
            - "after the three refusals MarkBoat.${mb1}.committed_minutes == 0, MarkBoat.${mb2}.committed_minutes == 0 and ClubMember.${m_pro}.assigned_duty_minutes == 0"
            - "trigger call 4 returns HTTP 201 with DutyAssignment.${d_ok}.status == PROPOSED and duty_minutes == 480"
            - "MarkBoat.${mb1}.committed_minutes == 480 and ClubMember.${m_pro}.assigned_duty_minutes == 480 after trigger call 4, because the ledger counts PROPOSED rows"
            - "MarkBoat.${mb2}.committed_minutes == 0: the cross-regatta reference never took effect"

      - name: nor_amendment_without_target_then_not_later_rejected
        claim_type: cascading
        grounds:
          - validations[priority 24 ERR_AMENDMENT_TARGET_INVALID]
          - validations[priority 47 ERR_AMENDMENT_NOT_LATER]
          - state_machines.RaceDocument.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: |
          The amendment target check at priority 24 runs to completion before the effective-date
          check at priority 47 is even attempted: republishing a NOR with no amends_document_id and
          amending a NOR with the SI's document id both answer 409 ERR_AMENDMENT_TARGET_INVALID,
          and only a request whose target is valid gets as far as 422 ERR_AMENDMENT_NOT_LATER for
          an effective_utc equal to the amended document's.
        test_recipe:
          setup:
            - "A regatta whose NOR revision 1 is PUBLISHED effective 2026-07-10T00:00:00Z."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { nor1: $.data.id } }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { si1: $.data.id } }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v3: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Second notice, no amends", effective_utc: "2026-07-20T00:00:00Z", expected_regatta_version: "${reg_v3}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice amending the sailing instructions", effective_utc: "2026-07-20T00:00:00Z", amends_document_id: "${si1}", expected_regatta_version: "${reg_v3}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice amendment 2, same effective instant", effective_utc: "2026-07-10T00:00:00Z", amends_document_id: "${nor1}", expected_regatta_version: "${reg_v3}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice amendment 2", effective_utc: "2026-07-11T00:00:00Z", amends_document_id: "${nor1}", expected_regatta_version: "${reg_v3}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { nor2: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_AMENDMENT_TARGET_INVALID: amends_document_id is absent while a PUBLISHED NOR exists"
            - "trigger call 2 returns HTTP 409 with error_id ERR_AMENDMENT_TARGET_INVALID: the target is a PUBLISHED document of the other doc_type"
            - "trigger call 3 returns HTTP 422 with error_id ERR_AMENDMENT_NOT_LATER: 2026-07-10T00:00:00Z is equal to, not strictly later than, the amended document's effective_utc"
            - "trigger call 4 returns HTTP 201 with RaceDocument.${nor2}.revision == 2 and status == PUBLISHED"
            - "RaceDocument.${nor1}.status == SUPERSEDED and RaceDocument.${si1}.status == PUBLISHED"
            - "Regatta.${reg}.nor_revision == 2, si_revision == 1, status == SI_PUBLISHED and version == 4: only the successful publish bumped the version"

      - name: division_created_before_notice_of_race_returns_regatta_phase_invalid
        claim_type: violation_error
        grounds:
          - validations[priority 12 ERR_REGATTA_PHASE_INVALID]
          - state_machines.Regatta.DRAFT_to_NOR_PUBLISHED
          - endpoints[POST /regatta-ops/divisions]
        distinguishing_aspect: |
          Division creation is gated on the regatta having reached NOR_PUBLISHED, so the identical
          division payload answers 409 ERR_REGATTA_PHASE_INVALID while the regatta is DRAFT and 201
          the moment the notice of race is published - nothing about the payload changes between
          the two calls.
        test_recipe:
          setup:
            - "A DRAFT regatta with no race documents."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_a: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_REGATTA_PHASE_INVALID and creates no Division row"
            - "trigger call 2 returns HTTP 201 and moves Regatta.${reg}.status to NOR_PUBLISHED with nor_revision 1"
            - "trigger call 3 returns HTTP 201 with Division.${div_a}.status == PROVISIONAL, assigned_entry_count == 0 and accepted_entry_count == 0"
            - "Regatta.${reg}.confirmed_division_count == 0 and version == 2"

      - name: duplicate_sail_number_rejected
        claim_type: violation_error
        grounds:
          - validations[priority 32 ERR_DUPLICATE_RECORD]
          - entities.Boat.fields.sail_number
          - entities.ClubMember.fields.email
        distinguishing_aspect: |
          Boat.sail_number and ClubMember.email are unique GLOBALLY, not per owner or per regatta:
          the same sail number offered under a different boat_name and a different owner is still
          409 ERR_DUPLICATE_RECORD, as is a repeated email, while a fresh sail number for the same
          owner succeeds.
        test_recipe:
          setup:
            - "Two members and one boat with sail_number USA-4410 owned by the first member."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Rhea Voss", email: "rhea.voss@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Different Hull", owner_member_id: "${m_h2}", boat_type: "MULTIHULL", loa_meters: 12.0 }, as: Competitor, as_user_id: "${m_h2}" }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay The Second", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4411", boat_name: "Windward Rose II", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_c: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_DUPLICATE_RECORD even though owner and boat_type differ"
            - "trigger call 2 returns HTTP 409 with error_id ERR_DUPLICATE_RECORD on the email"
            - "trigger call 3 returns HTTP 201 with Boat.${b_c}.version == 1"
            - "GET /regatta-ops/boats returns total_count 2: exactly ${b_a} and ${b_c}"
            - "exactly two ClubMember rows exist"

      - name: certificate_valid_until_not_after_valid_from_rejected
        claim_type: temporal
        grounds:
          - validations[priority 48 ERR_MEASUREMENT_OUT_OF_RANGE]
          - entities.RatingCertificate.fields.valid_from
          - entities.RatingCertificate.fields.valid_until
        distinguishing_aspect: |
          The validity window is checked with a strict inequality, so valid_until exactly equal to
          valid_from is rejected with 422 ERR_MEASUREMENT_OUT_OF_RANGE while a window one second
          long is accepted - and the rejected attempt leaves Boat.version at 1, so the accepted
          attempt reuses expected_boat_version 1.
        test_recipe:
          setup:
            - "A licensed measurer and one MONOHULL boat at version 1, with all measurements inside their declared ranges."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-01-01T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-01-01T00:00:01Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_MEASUREMENT_OUT_OF_RANGE and creates no RatingCertificate row"
            - "Boat.${b_a}.version == 1 after trigger call 1"
            - "trigger call 2 returns HTTP 201 with RatingCertificate.${c_a}.status == DRAFT and rating_value == 171.3"
            - "Boat.${b_a}.version == 2 after trigger call 2"

      - name: two_rules_violated_at_once_answer_by_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority 18 ERR_CREW_SAFETY_COURSE_EXPIRED]
          - validations[priority 28 ERR_DIVISION_BAND_MISMATCH]
        excluded_because:
          difficulty_instance: validation_priority_ordering / accept_with_expired_safety_and_band_mismatch_returns_safety_first
          rationale: "That instance builds an acceptance that violates both rules at once, asserts the lower-priority-number error is the one returned, then repairs only that violation and asserts the second error surfaces, which is exactly the two-rules-violated claim."

      - name: priority_conflict_between_state_and_window_checks
        claim_type: priority_conflict
        grounds:
          - validations[priority 17 ERR_ENTRY_WITHDRAWN]
          - validations[priority 37 ERR_PROTEST_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: validation_priority_ordering / protest_on_withdrawn_entry_past_window_returns_entry_withdrawn
          rationale: "A protest is filed after the time limit has expired AND against a withdrawn entry there, so the priority-14 error must win over the priority-37 one; repairing the party then exposes the window error from the same fixture."

      - name: aggregate_limit_across_individually_valid_windows
        claim_type: aggregate
        grounds:
          - validations[priority 35 ERR_MARK_BOAT_OVERBOOKED]
          - entities.MarkBoat.fields.concurrent_assignment_limit
          - entities.MarkBoat.fields.turnaround_buffer_minutes
        excluded_because:
          difficulty_instance: aggregate_window_constraint / mark_boat_buffer_widened_aggregate_limit_rejects_third_window
          rationale: "Each window there is individually legal and only the buffer-widened intersection count breaches concurrent_assignment_limit, including the touching-window case that collides solely because of the buffer, which is the aggregate-validation claim in full."

  # =========================================================================
  # From Table 5 (Endpoints)
  # =========================================================================
  # No `Bulk action` row is emitted: section 1.5 declares no endpoint that accepts a
  # collection of targets, so there is no partial-success or rollback-or-skip semantics
  # to claim anything about.
  - section: endpoints
    instances:

      - name: crew_manifest_add_and_delete_round_trip_adjusts_count_and_weight
        claim_type: standard_crud
        grounds:
          - endpoints[POST /regatta-ops/entries/{id}/crew]
          - endpoints[DELETE /regatta-ops/entries/{id}/crew/{member_id}]
          - validations[priority 32 ERR_DUPLICATE_RECORD]
        distinguishing_aspect: |
          The delete leg subtracts exactly the removed element's own weight rather than recomputing
          from declared_crew_count: after 84.5 + 79.25 the manifest reads 2 crew and 163.8 kg, and
          removing the 79.25 kg trimmer returns it to 1 crew and 84.5 kg with Entry.version 4 -
          while a repeat add of the same member is 409 and a delete of a member who was never on
          the manifest is 404.
        test_recipe:
          setup:
            - "A regatta with the notice of race published and one SUBMITTED entry with declared_crew_count 3; the helm and two other members exist."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Kit Ferrer", email: "kit.ferrer@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_c1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Nora Pike", email: "nora.pike@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_c2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 3 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_h1}", position: "HELM", weight_kg: 84.5 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_c1}", position: "TRIMMER", weight_kg: 79.25 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_c1}", position: "BOW", weight_kg: 70.0 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "DELETE /regatta-ops/entries/${e_a}/crew/${m_c2}", payload: {}, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "DELETE /regatta-ops/entries/${e_a}/crew/${m_c1}", payload: {}, as: Competitor, as_user_id: "${m_h1}" }
          assert:
            - "after trigger call 2 the entry reads registered_crew_count 2, crew_weight_kg 163.8 and version 3"
            - "trigger call 3 returns HTTP 409 with error_id ERR_DUPLICATE_RECORD: one manifest element per member per entry"
            - "trigger call 4 returns HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND and leaves registered_crew_count at 2"
            - "trigger call 5 returns HTTP 200 with registered_crew_count 1, crew_weight_kg 84.5 and Entry.${e_a}.version == 4"
            - "the surviving crew_manifest element is ${m_h1} with position HELM"
            - "Entry.${e_a}.declared_crew_count is still 3 and registration_status is still SUBMITTED: the manifest is nowhere reconciled against the declaration until acceptance"

      - name: duty_release_from_proposed_zeroes_both_ledgers_then_second_release_rejected
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /regatta-ops/duty-assignments/{id}/release]
          - state_machines.DutyAssignment.PROPOSED_to_RELEASED
          - calculations.duty_minutes_ledger
        distinguishing_aspect: |
          Release is reachable directly from PROPOSED without ever passing through CONFIRMED, and it
          still reverses both ledgers: a 480-minute mark boat duty drops ClubMember.assigned_duty_minutes
          and MarkBoat.committed_minutes back to 0 while duty_minutes stays 480 on the released row,
          and a second release answers 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A DRAFT regatta with one mark boat MB-1 and one PROPOSED MARK_BOAT_DRIVER duty over 2026-08-05T12:00:00Z to 2026-08-05T20:00:00Z."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_dr: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id } }
            - { call: "POST /regatta-ops/mark-boats", payload: { regatta_id: "${reg}", call_sign: "MB-1", crew_capacity: 3 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { mb1: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_dr}", mark_boat_id: "${mb1}", position: "MARK_BOAT_DRIVER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/duty-assignments/${d1}/release", payload: { release_reason_code: "CREW_ILLNESS" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments/${d1}/release", payload: { release_reason_code: "CREW_ILLNESS" }, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "before the trigger, ClubMember.${m_dr}.assigned_duty_minutes == 480 and MarkBoat.${mb1}.committed_minutes == 480"
            - "trigger call 1 returns HTTP 200 with DutyAssignment.${d1}.status == RELEASED, release_reason_code CREW_ILLNESS and duty_minutes still 480"
            - "after trigger call 1, ClubMember.${m_dr}.assigned_duty_minutes == 0 and MarkBoat.${mb1}.committed_minutes == 0, exactly the pre-create values"
            - "trigger call 2 returns HTTP 409 with error_id ERR_INVALID_STATE and does NOT subtract 480 a second time"
            - "ClubMember.${m_dr}.assigned_duty_minutes == 0 and MarkBoat.${mb1}.committed_minutes == 0 after both calls"

      - name: jury_seat_requires_existing_member_and_stays_forming_under_quorum
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /regatta-ops/jury-panels/{id}/seats]
          - state_machines.JuryPanel.FORMING_to_SEATED
          - validations[priority 32 ERR_DUPLICATE_RECORD]
        distinguishing_aspect: |
          A seat links a panel to a roster row, so the panel and the member must both exist: an
          unknown member_id is 404, re-seating the chair who is already seated is 409, and the one
          legitimate seat leaves seated_member_count at 2 against jury_quorum_required 3, so the
          panel stays FORMING.
        test_recipe:
          setup:
            - "A regatta with the default jury_quorum_required 3, one FORMING panel chaired by a REGIONAL judge, and one further CLUB judge on the roster."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Nils Brandt", email: "nils.brandt@yc.test", judge_certification_level: "REGIONAL" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_jc: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Ida Moss", email: "ida.moss@yc.test", judge_certification_level: "CLUB" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_j2: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id } }
            - { call: "POST /regatta-ops/jury-panels", payload: { regatta_id: "${reg}", chair_member_id: "${m_jc}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { pnl: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/jury-panels/${pnl}/seats", payload: { member_id: "00000000-0000-4000-8000-0000000000ab" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/jury-panels/${pnl}/seats", payload: { member_id: "${m_jc}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/jury-panels/${pnl}/seats", payload: { member_id: "${m_j2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "the panel starts at status FORMING with seated_member_count 1 and one seats element for ${m_jc} with seat_role CHAIR"
            - "trigger call 1 returns HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND and leaves seated_member_count at 1"
            - "trigger call 2 returns HTTP 409 with error_id ERR_DUPLICATE_RECORD: the chair already holds a non-recused seat"
            - "trigger call 3 returns HTTP 200 with seated_member_count 2 and a seats element for ${m_j2} with seat_role MEMBER and recused false"
            - "JuryPanel.${pnl}.status == FORMING after trigger call 3, because 2 is under jury_quorum_required 3"
            - "JuryPanel.${pnl}.version == 2: only the successful seat bumped it"

      - name: series_standing_of_accepted_entry_with_no_final_race_reads_zeroed
        claim_type: computed_read
        grounds:
          - endpoints[GET /regatta-ops/entries/{id}/series-standing]
          - calculations.series_standing
        distinguishing_aspect: |
          With no FINAL race in the series the computed read is defined rather than absent: it
          returns gross_points 0, net_points 0, races_counted 0, an empty discarded_race_numbers and
          rank null, and it still carries the entry's division_id - the null rank is what separates
          "no races scored yet" from "ranked last".
        test_recipe:
          setup:
            - "A regatta with the notice of race published, a division 150.0-230.0 MONOHULL and one entry whose crew manifest is complete, inspection PASSED and registration ACCEPTED."
