  - section: validations
    instances:
      - name: unassessed_resident_enrollment_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_29_ERR_NO_ACTIVE_ASSESSMENT
        distinguishing_aspect: "An ADMITTED resident with zero assessments has a null supervision_tier and therefore no supervision weight: enrollment fails with ERR_NO_ACTIVE_ASSESSMENT (409), not with a tier or staffing error, and the session's counters stay untouched."
        test_recipe:
          setup:
            - "one ADMITTED resident with NO assessment at all, so Resident.supervision_tier is null"
            - "one SCHEDULED session with generous capacity and staffing"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Unassessed Ulla", room_number: "501A", admission_date: "2026-07-26" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/programs"
              payload: { name: "Unassessed Program", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Unassessed Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-30T10:00:00Z", ends_at: "2026-08-30T11:00:00Z", assigned_staff_count: 4 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == \"ERR_NO_ACTIVE_ASSESSMENT\""
            - "Resident.${res_id}.supervision_tier == null and Resident.${res_id}.status == ADMITTED"
            - "ActivitySession.${sess_id}.enrolled_count == 0 and ActivitySession.${sess_id}.weighted_supervision_load == 0.0"
      - name: discharged_resident_outing_consent_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_28_ERR_RESIDENT_NOT_ADMITTED
          - entities.Resident.fields.status
        distinguishing_aspect: "Programming eligibility depends on the OTHER entity's state: the identical consent request succeeds while the resident is ADMITTED and fails with ERR_RESIDENT_NOT_ADMITTED once the census row moves to DISCHARGED, with the already-created consent left alone."
        test_recipe:
          setup:
            - "two ADMITTED, assessed residents and one PLANNING outing"
            - "the first consent is created while the resident is ADMITTED (the valid half of the pair)"
            - "the second resident is then moved to DISCHARGED via PATCH /recreation/residents/{resident_id}"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Still Admitted", room_number: "502A", admission_date: "2026-07-26" }
