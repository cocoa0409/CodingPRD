              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /court-testimonies"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", court_state_code: "CA" }
              as: CaseManager
              captures: { t1_id: $.data.id }
            - call: "POST /court-testimonies/${t1_id}/schedule"
              payload: { scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: CaseManager
            - call: "POST /court-testimonies"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", court_state_code: "CA" }
              as: CaseManager
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /court-testimonies/${t2_id}/schedule"
              payload: { scheduled_start: "2026-07-01T13:00:00Z", scheduled_end: "2026-07-01T14:00:00Z" }
              as: CaseManager
              captures: { err: $.data.error_id }
