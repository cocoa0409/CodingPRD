            - call: "POST /expense-pass-throughs"
              payload: { advisor_code: "A-1309", payout_period_id: "${p_id}", category: "TECHNOLOGY", billing_model: "FLAT_MONTHLY" }
              as: BranchManager
              captures: { ep_id: $.data.id }
            - call: "POST /expense-pass-throughs"
              payload: { advisor_code: "A-1309", payout_period_id: "${p_id}", category: "E_AND_O", billing_model: "PCT_OF_GROSS" }
              as: BranchManager
          trigger:
            - call: "POST /payout-periods/${p_id}/state"
              payload: { to_state: "CLOSED", expected_branch_version: "${b_v4}" }
              as: BranchManager
              captures: { b_v5: $.data.version }
            - call: "POST /payout-periods/${p_id}/net-settlement"
              payload: { advisor_code: "A-1309" }
              as: BranchManager
              captures: { net_first: $.data.net_settlement_cents, pass_first: $.data.pass_through_cents, eo_first: $.data.eo_charge_cents }
            - call: "POST /payout-periods/${p_id}/net-settlement"
              payload: { advisor_code: "A-1309" }
              as: BranchManager
              captures: { net_second: $.data.net_settlement_cents, pass_second: $.data.pass_through_cents, eo_second: $.data.eo_charge_cents }
          assert:
            - "every entry starts in tier 1 and the 6500-basis-point institutional offset drives the rate to the floor, so the four entries pay 25000, 750000, 50000 and 20000 and payout_basis == 845000"
            - "pass_through_cents == 3000000 on both calls and eo_charge_cents == 10140 on both calls, so neither pool was clipped and no amount_cents row was rewritten between the two calls"
            - "net_settlement_cents == 0 on both calls because the 845000 basis cannot absorb the 3000000 flat technology charge, and the floor at zero is the observable clamp"
            - "the named conserved quantity max(0, payout_basis - net_settlement_cents) == 845000 is identical after the first call and after the second, so the replay is idempotent with zero drift"
            - "Advisor.${a_id}.annual_payout_cap_hit == false because 845000 is far below the 500000000 cap"
            - "the INSTITUTIONAL offset is what makes this fixture grid-rate sensitive: the same four entries under IC would pay 35000, 1050000, 70000 and 28000 at 7000 bps, so the floor reading of 500 bps is the observable institutional signature"

      - name: retention_sweep_reversal_reconciles_to_zero_drift
        grounds:
          - calculations.retention_credit
          - calculations.retention_credit.constants.RETENTION_CREDIT_CAP_BPS
          - state_machines.Account.RETENTION_CONTESTED_to_PENDING_TRANSFER
          - endpoints.POST_/transitions/{id}/retention/lose
        distinguishing_aspect: "The watermark never over-commits: the first two credits consume the full 1600000 book cap, a third contest is refused with ERR_RETENTION_CREDIT_EXHAUSTED, and the losing leg leaves settled_amount exactly equal to the sum of the credits it posted, so the named quantity posted minus recorded is 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Elevated branch SUP-1 supervised. Advisor A-1310 is DEPARTING with a repaid loan, a 80,000,000 transferred book and three frozen accounts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1310", crd_number: "5234573", full_name: "Piotr Haverford", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 100000000, book_transferred_cents: 80000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id, a_v1: $.data.version }
            - call: "POST /branch-supervisor-enrollments"
              payload: { branch_code: "SUP-1", advisor_code: "A-1310", effective_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { e_id: $.data.id }
            - call: "POST /branch-supervisor-enrollments/${e_id}/state"
              payload: { to_status: "ENROLLED", expected_branch_version: "${b_v}" }
              as: PlatformAdmin
              captures: { b_v2: $.data.version }
            - call: "POST /advisor-links"
              payload: { advisor_code: "A-1310", branch_code: "SUP-1", is_supervisor: true, assignment_type: "PRIMARY" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { l_id: $.data.id }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1310", principal_cents: 500000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 100 }
              as: PlatformAdmin
              captures: { ln_id: $.data.id }
            - call: "POST /advisors/${a_id}/enrollment"
              payload: { expected_advisor_version: "${a_v1}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v2: $.data.version }
            - call: "POST /advisors/${a_id}/affiliation"
              payload: { affiliation_model: "IC", expected_advisor_version: "${a_v2}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v3: $.data.version }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1310", account_number: "A-4001", account_type: "BROKERAGE", balance_cents: 20000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { ac1: $.data.id }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1310", account_number: "A-4002", account_type: "BROKERAGE", balance_cents: 16000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { ac2: $.data.id }
            - call: "POST /accounts"
              payload: { advisor_code: "A-1310", account_number: "A-4003", account_type: "BROKERAGE", balance_cents: 20000000, annual_fee_cents: 0, held_away: false }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { ac3: $.data.id }
            - call: "POST /payout-periods"
              payload: { branch_code: "SUP-1", year: 2026, month: 9, period_index: 1 }
              as: BranchManager
              captures: { p_id: $.data.id }
            - call: "POST /revenue-entries"
              payload: { advisor_code: "A-1310", account_id: "${ac1}", product_type: "EQUITY", gross_commission_cents: 1000000, production_date: "2026-09-03" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { re_id: $.data.id }
            - call: "POST /revenue-entries/${re_id}/release"
              payload: {}
              as: AdvisorOps
              as_user_id: "${a_id}"
            - call: "POST /payout-loans/${ln_id}/amortize"
              payload: { payout_period_id: "${p_id}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
            - call: "POST /payout-loans/${ln_id}/forgive"
              payload: { expected_advisor_version: "${a_v3}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v4: $.data.version }
            - call: "POST /advisors/${a_id}/departure"
              payload: { expected_advisor_version: "${a_v4}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v5: $.data.version }
            - call: "POST /transitions"
              payload: { advisor_code: "A-1310", payout_period_id: "${p_id}", expected_advisor_version: "${a_v5}" }
              as: BranchManager
              captures: { t_id: $.data.id, a_v6: $.data.version }
            - call: "POST /transitions/${t_id}/retention/contest"
              payload: { account_id: "${ac1}", retention_rate_bps: 500 }
              as: BranchManager
              captures: { c1: $.data.credit_amount_cents }
            - call: "POST /transitions/${t_id}/retention/contest"
              payload: { account_id: "${ac2}", retention_rate_bps: 500 }
              as: BranchManager
              captures: { c2: $.data.credit_amount_cents }
          trigger:
            - call: "POST /transitions/${t_id}/retention/contest"
              payload: { account_id: "${ac3}", retention_rate_bps: 500 }
              as: BranchManager
              captures: { err_cap: $.data.error_id }
            - call: "POST /transitions/${t_id}/retention/lose"
              payload: { account_ids_lost: ["${ac1}", "${ac2}"], expected_advisor_version: "${a_v6}" }
              as: BranchManager
              captures: { t_settled: $.data.status, t_amount: $.data.settled_amount_cents }
          assert:
            - "the caps consumed by the two prepared contests are 1000000 and 600000 (the 500 bps of a 20,000,000 balance clipped to 1,000,000 because 200 bps of the 5,000,000-account balance exceeds the remaining cap) and they together equal the 1600000 cap"
            - "the third contest is refused with ERR_RETENTION_CREDIT_EXHAUSTED, so the transaction shows exactly 2 retention rows and the sum of their credits is 1600000"
            - "the third contest returns 409 ERR_RETENTION_CREDIT_EXHAUSTED because the running posted watermark already equals the cap"
            - "the losing call returns status SETTLED and settled_amount_cents == 1600000, exactly the sum of the two posted credits"
            - "the named quantity sum(posted credits) - settled_amount_cents == 0 after the reversal, so the losing leg left no drift and recomputed no credit"
            - "GET /transitions/${t_id}/retention-rows shows rows for ${ac1} and ${ac2} as LOST with their credits unchanged"
            - "account ${ac3} was never contested and sits at FROZEN, so the transition settles with two contested rows and no third row"