scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: case_budget_committed_vs_actuals
        grounds:
          - calculations.case_budget_projection
          - entities.Case.fields.committed_cents
          - entities.Case.fields.actuals_paid_cents
        distinguishing_aspect: |
          Same Case, two valid algorithms: chronological ACTUALS counts only PAID invoices (20000),
          while forward-looking COMMITTED adds APPROVED-unpaid + SUBMITTED-billed + unspent retainer of
          ACTIVE engagements + CONFIRMED schedule estimates (1380000). Entity domain: Case fiscal posture.
        test_recipe:
          setup:
            - "ACTIVE engagement (rate 40000, retainer 300000 funded, expense_cap 40000) on case budget 2000000"
            - "Invoice A (PREP 0.5h = 20000) APPROVED then PAID (draws 20000 retainer; remaining 280000)"
            - "CONFIRMED DEPOSITION schedule estimated_hours 8 (estimate 8*40000*1.25 = 400000)"
            - "Invoice B (PREP 10h, TESTIMONY 4h, TRAVEL_TIME 2h, expense 50000 capped to 40000) = 680000 left SUBMITTED"
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "A Reed", specialty_area: "forensics" }, as: PlatformAdmin, captures: { e1: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-100", court: "SDNY", title: "Acme v Beta", budget_cents: 2000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c1: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c1}", specialty_area: "forensics" }, as: CaseManager, as_user_id: "cm-1", captures: { r1: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r1}/conflict-checks", payload: { expert_id: "${e1}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc1: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc1}/resolve", payload: { outcome: "CLEARED", rationale: "no overlap" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r1}/credential-reviews", payload: { expert_id: "${e1}" }, as: CredentialAnalyst, captures: { cr1: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr1}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r1}", expert_id: "${e1}", hourly_rate_cents: 40000, retainer_cents: 300000, expense_cap_cents: 40000 }, as: CaseManager, as_user_id: "cm-1", captures: { g1: $.data.id } }
            - { call: "POST /litigation/engagements/${g1}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g1}/sign", payload: {}, as: Expert, as_user_id: "${e1}" }
            - { call: "POST /litigation/engagements/${g1}/fund-retainer", payload: { amount_cents: 300000 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g1}/invoices", payload: { period_start: "2026-05-02T00:00:00Z", period_end: "2026-05-08T00:00:00Z", line_items: [{ kind: "PREP", hours: 0.5 }], travel_expense_cents: 0, total_cents: 20000 }, as: Expert, as_user_id: "${e1}", captures: { invA: $.data.id } }
            - { call: "POST /litigation/invoices/${invA}/approve", payload: {}, as: BillingReviewer, as_user_id: "br-1" }
            - { call: "POST /litigation/invoices/${invA}/settle", payload: { outcome: "PAID" }, as: BillingReviewer, as_user_id: "br-1" }
            - { call: "POST /litigation/engagements/${g1}/testimony-schedules", payload: { kind: "DEPOSITION", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T12:00:00Z", estimated_hours: 8 }, as: CaseManager, as_user_id: "cm-1", captures: { s1: $.data.id } }
            - { call: "POST /litigation/testimony-schedules/${s1}/confirm", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g1}/invoices", payload: { period_start: "2026-05-09T00:00:00Z", period_end: "2026-05-15T00:00:00Z", line_items: [{ kind: "PREP", hours: 10 }, { kind: "TESTIMONY", hours: 4 }, { kind: "TRAVEL_TIME", hours: 2 }], travel_expense_cents: 50000, total_cents: 680000 }, as: Expert, as_user_id: "${e1}" }
          trigger:
            - call: "GET /litigation/cases/${c1}"
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "Case.${c1}.actuals_paid_cents == 20000"
            - "Case.${c1}.committed_cents == 1380000"
            - "Case.${c1}.approved_outstanding_cents == 0"
            - "committed (1380000) != actuals (20000) for identical underlying data"

      - name: expert_rating_simple_vs_decayed
        grounds:
          - calculations.expert_composite_rating
          - entities.Expert.fields.rating_simple
          - entities.Expert.fields.rating_decayed
        distinguishing_aspect: |
          Same Expert evaluations, two valid algorithms: SIMPLE mean = 3.0, DECAYED recency-weighted = 2.33
          (weight 0.5^floor(age_days/180)); the probation trigger consumes ONLY the DECAYED variant.
          Entity domain: Expert roster quality — distinct from the Case fiscal domain of the sibling instance.
        test_recipe:
          setup:
            - "Expert with two CLOSED engagements (two cases); evaluation 5.0 recorded at clock 2026-05-01 on engagement 1"
            - "clock advanced 200 days to 2026-11-17T00:00:00Z; evaluation 1.0 recorded on engagement 2"
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "B Hale", specialty_area: "biomech" }, as: PlatformAdmin, captures: { e2: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-201", court: "SDNY", title: "C v D", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c21: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c21}", specialty_area: "biomech" }, as: CaseManager, as_user_id: "cm-1", captures: { r21: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r21}/conflict-checks", payload: { expert_id: "${e2}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc21: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc21}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r21}/credential-reviews", payload: { expert_id: "${e2}" }, as: CredentialAnalyst, captures: { cr21: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr21}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r21}", expert_id: "${e2}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { g21: $.data.id } }
            - { call: "POST /litigation/engagements/${g21}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g21}/sign", payload: {}, as: Expert, as_user_id: "${e2}" }
            - { call: "POST /litigation/engagements/${g21}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g21}/close", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g21}/evaluations", payload: { overall_score: 5.0 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-17T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-202", court: "SDNY", title: "E v F", budget_cents: 1000000, trial_date: "2027-03-01T00:00:00Z", report_deadline: "2027-01-15T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c22: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c22}", specialty_area: "biomech" }, as: CaseManager, as_user_id: "cm-1", captures: { r22: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r22}/conflict-checks", payload: { expert_id: "${e2}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc22: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc22}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r22}/credential-reviews", payload: { expert_id: "${e2}" }, as: CredentialAnalyst, captures: { cr22: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr22}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r22}", expert_id: "${e2}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { g22: $.data.id } }
            - { call: "POST /litigation/engagements/${g22}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g22}/sign", payload: {}, as: Expert, as_user_id: "${e2}" }
            - { call: "POST /litigation/engagements/${g22}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g22}/close", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g22}/evaluations", payload: { overall_score: 1.0 }, as: CaseManager, as_user_id: "cm-1" }
          trigger:
            - call: "GET /litigation/experts/${e2}"
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "Expert.${e2}.evaluation_count == 2"
            - "Expert.${e2}.rating_simple == 3.0"
            - "Expert.${e2}.rating_decayed == 2.33"
            - "Expert.${e2}.roster_status == PROBATION  (decayed 2.33 < 3.0 with 2 evaluations; simple 3.0 would NOT have triggered)"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_allowed_amount_tiered_caps
        grounds:
          - calculations.invoice_total_with_per_line_rounding
          - entities.Engagement.fields.expense_cap_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — per-kind rate multipliers (1.00/1.25/0.50),
          nested min(travel_expense, cap_remaining), line-level tiering. Rate 40000: PREP 10h=400000,
          TESTIMONY 4h=200000, TRAVEL_TIME 2h=40000, expense 50000 capped to 40000 -> 680000.
        test_recipe:
          setup: ["ACTIVE engagement: rate 40000, retainer 0, expense_cap 40000, case budget 2000000"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "C Ibe", specialty_area: "econ" }, as: PlatformAdmin, captures: { e3: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-300", court: "EDVA", title: "G v H", budget_cents: 2000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c3: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c3}", specialty_area: "econ" }, as: CaseManager, as_user_id: "cm-1", captures: { r3: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r3}/conflict-checks", payload: { expert_id: "${e3}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc3: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc3}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r3}/credential-reviews", payload: { expert_id: "${e3}" }, as: CredentialAnalyst, captures: { cr3: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr3}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r3}", expert_id: "${e3}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 40000 }, as: CaseManager, as_user_id: "cm-1", captures: { g3: $.data.id } }
            - { call: "POST /litigation/engagements/${g3}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g3}/sign", payload: {}, as: Expert, as_user_id: "${e3}" }
            - { call: "POST /litigation/engagements/${g3}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
          trigger:
            - call: "POST /litigation/engagements/${g3}/invoices"
              payload: { period_start: "2026-05-04T00:00:00Z", period_end: "2026-05-08T00:00:00Z", line_items: [{ kind: "PREP", hours: 10 }, { kind: "TESTIMONY", hours: 4 }, { kind: "TRAVEL_TIME", hours: 2 }], travel_expense_cents: 50000, total_cents: 680000 }
              as: Expert
              as_user_id: "${e3}"
              captures: { inv3: $.data.id }
          assert:
            - "Invoice.${inv3}.computed_total_cents == 680000"
            - "expense allowance == min(50000, 40000) == 40000 (cap binds inside the nested min)"
            - "service subtotal == 10*40000*1.00 + 4*40000*1.25 + 2*40000*0.50 == 640000"

      - name: invoice_per_line_rounding_pinned
        grounds:
          - calculations.invoice_total_with_per_line_rounding
          - errors[ERR_INVOICE_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — round per line THEN sum. Rate 10001 with TRAVEL_TIME
          multiplier 0.50 gives raw 5000.5 cents per 1h line; two such lines: per-line-then-sum = 10002,
          sum-then-round = 10001. The scaffold pins 10002 and rejects a client total computed the other way.
        test_recipe:
          setup: ["ACTIVE engagement: rate 10001, retainer 0, expense_cap 0, case budget 1000000"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "D Jha", specialty_area: "tox" }, as: PlatformAdmin, captures: { e4: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-400", court: "NDIL", title: "I v J", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c4: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c4}", specialty_area: "tox" }, as: CaseManager, as_user_id: "cm-1", captures: { r4: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r4}/conflict-checks", payload: { expert_id: "${e4}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc4: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc4}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r4}/credential-reviews", payload: { expert_id: "${e4}" }, as: CredentialAnalyst, captures: { cr4: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr4}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r4}", expert_id: "${e4}", hourly_rate_cents: 10001, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { g4: $.data.id } }
            - { call: "POST /litigation/engagements/${g4}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g4}/sign", payload: {}, as: Expert, as_user_id: "${e4}" }
            - { call: "POST /litigation/engagements/${g4}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
          trigger:
            - call: "POST /litigation/engagements/${g4}/invoices"
              payload: { period_start: "2026-05-04T00:00:00Z", period_end: "2026-05-08T00:00:00Z", line_items: [{ kind: "TRAVEL_TIME", hours: 1 }, { kind: "TRAVEL_TIME", hours: 1 }], travel_expense_cents: 0, total_cents: 10002 }
              as: Expert
              as_user_id: "${e4}"
              captures: { inv4: $.data.id }
            - call: "POST /litigation/engagements/${g4}/invoices"
              payload: { period_start: "2026-05-11T00:00:00Z", period_end: "2026-05-15T00:00:00Z", line_items: [{ kind: "TRAVEL_TIME", hours: 1 }, { kind: "TRAVEL_TIME", hours: 1 }], travel_expense_cents: 0, total_cents: 10001 }
              as: Expert
              as_user_id: "${e4}"
              captures: { inv4_err: $.data.error_id }
          assert:
            - "Invoice.${inv4}.computed_total_cents == 10002  (per-line round_half_up: 5001 + 5001)"
            - "second create rejected: inv4_err == ERR_INVOICE_AMOUNT_MISMATCH (10001 is the sum-then-round counterfactual)"

      - name: retainer_drawdown_evaluation_order
        grounds:
          - calculations.retainer_drawdown
          - entities.Engagement.fields.retainer_drawn_cents
          - entities.Invoice.fields.billed_to_client_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — allowed amount is computed from
          the rate card BEFORE the drawdown mutates retainer balances; the draw reads pre-mutation
          retainer_remaining. Second approval draws only the 280000 left after the first draw, not 300000.
        test_recipe:
          setup: ["ACTIVE engagement: rate 40000, retainer 300000 funded, expense_cap 40000, budget 2000000; invoice A (20000) already approved (drawn 20000, remaining 280000)"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "E Kuo", specialty_area: "econ" }, as: PlatformAdmin, captures: { e5: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-500", court: "NDIL", title: "K v L", budget_cents: 2000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c5: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c5}", specialty_area: "econ" }, as: CaseManager, as_user_id: "cm-1", captures: { r5: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r5}/conflict-checks", payload: { expert_id: "${e5}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc5: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc5}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r5}/credential-reviews", payload: { expert_id: "${e5}" }, as: CredentialAnalyst, captures: { cr5: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr5}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r5}", expert_id: "${e5}", hourly_rate_cents: 40000, retainer_cents: 300000, expense_cap_cents: 40000 }, as: CaseManager, as_user_id: "cm-1", captures: { g5: $.data.id } }
            - { call: "POST /litigation/engagements/${g5}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g5}/sign", payload: {}, as: Expert, as_user_id: "${e5}" }
            - { call: "POST /litigation/engagements/${g5}/fund-retainer", payload: { amount_cents: 300000 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g5}/invoices", payload: { period_start: "2026-05-04T00:00:00Z", period_end: "2026-05-08T00:00:00Z", line_items: [{ kind: "PREP", hours: 0.5 }], travel_expense_cents: 0, total_cents: 20000 }, as: Expert, as_user_id: "${e5}", captures: { inv5a: $.data.id } }
            - { call: "POST /litigation/invoices/${inv5a}/approve", payload: {}, as: BillingReviewer, as_user_id: "br-1" }
            - { call: "POST /litigation/engagements/${g5}/invoices", payload: { period_start: "2026-05-11T00:00:00Z", period_end: "2026-05-15T00:00:00Z", line_items: [{ kind: "PREP", hours: 10 }, { kind: "TESTIMONY", hours: 4 }, { kind: "TRAVEL_TIME", hours: 2 }], travel_expense_cents: 50000, total_cents: 680000 }, as: Expert, as_user_id: "${e5}", captures: { inv5b: $.data.id } }
          trigger:
            - call: "POST /litigation/invoices/${inv5b}/approve"
              payload: {}
              as: BillingReviewer
              as_user_id: "br-1"
            - call: "GET /litigation/engagements/${g5}"
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "Invoice.${inv5b}.retainer_draw_cents == 280000  (pre-mutation remaining, NOT 300000)"
            - "Invoice.${inv5b}.billed_to_client_cents == 400000"
            - "Engagement.${g5}.retainer_drawn_cents == 300000"
            - "Engagement.${g5}.retainer_remaining_cents == 0"
            - "invariant: retainer_funded_cents (300000) == drawn (300000) + refunded (0) + remaining (0)"

  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle
        grounds:
          - state_machines.Report.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.Report.REVISION_REQUESTED_to_DRAFT
          - entities.Report.fields.revision_count
        distinguishing_aspect: |
          Report machine is cyclic: DRAFT -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT -> IN_REVIEW -> FINALIZED;
          the loop counter revision_count increments exactly once per REVISION_REQUESTED -> DRAFT hop.
        test_recipe:
          setup: ["ACTIVE engagement (rate 40000, retainer 0); report created (deadline pinned 2026-07-01T17:00:00Z; clock at default 2026-05-01)"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "F Lin", specialty_area: "med" }, as: PlatformAdmin, captures: { e6: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-600", court: "CDCA", title: "M v N", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c6: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c6}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { r6: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r6}/conflict-checks", payload: { expert_id: "${e6}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc6: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc6}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r6}/credential-reviews", payload: { expert_id: "${e6}" }, as: CredentialAnalyst, captures: { cr6: $.data.id } }
