  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_proposal_version_outranks_rejected_proposal_state
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - concurrency_rules[impact-analysis-create-stale-proposal]
          - errors.ERR_STALE_PROPOSAL_VERSION
          - errors.ERR_PROPOSAL_STATE_INVALID
          - state_machines.AmendmentProposal.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Error-category pair concurrency (P10) vs state (P11): the analyst holds
          expected_proposal_version 1 while the proposal has advanced to version 2 AND its
          review_status is REJECTED, which forbids analysis outright; the response is
          ERR_STALE_PROPOSAL_VERSION (412), never ERR_PROPOSAL_STATE_INVALID (409).
        test_recipe:
          setup:
            - "CodeCycle 2027 in INTAKE_OPEN with a SEATED ENERGY committee."
            - "One AmendmentProposal created at version 1, then screened with decision REJECT so review_status == REJECTED and version == 2."
            - "The client still holds the version captured at creation."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_intake_open
            - *c_propA
            - &c_screenA_reject
              call: "POST /amendment-proposals/${prop_id}/screening"
              payload: { decision: "REJECT" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
          trigger:
            - call: "POST /amendment-proposals/${prop_id}/impact-analyses"
              payload: { expected_proposal_version: "${prop_v_create}", analysis_type: "COST_BENEFIT", incremental_cost_by_occupancy: { R3: 42375, R2: 61250, B: 118900, A2: 97150 }, affected_permit_count: 2410, annual_cost_savings_cents: 14500000, measure_life_years: 12 }
              as: TechnicalStaff
              as_user_id: "staff-analyst-1"
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_PROPOSAL_VERSION"
            - "response.data.error_id != ERR_PROPOSAL_STATE_INVALID"
            - "AmendmentProposal.${prop_id}.review_status == REJECTED"
            - "AmendmentProposal.${prop_id}.analysis_status == NOT_STARTED"
            - "GET /amendment-proposals/${prop_id}/impact-analyses returns total_count == 0"

      - name: stringency_floor_outranks_benefit_cost_floor_on_vote
        grounds:
          - validations[priority=14]
          - validations[priority=18]
          - errors.ERR_STRINGENCY_FLOOR_VIOLATION
          - errors.ERR_BENEFIT_COST_BELOW_FLOOR
          - calculations.amendment_benefit_cost_ratio
          - state_machines.AmendmentProposal.COMMENT_CLOSED_to_APPROVED
        distinguishing_aspect: |
          Error-category pair business_safety (P14) vs business_fiscal (P18): a
          LESS_STRINGENT proposal on life-safety section 907.5.2 whose FINAL benefit-cost
          ratio also rounds to 0.99 (below BCR_FLOOR 1.00) returns
          ERR_STRINGENCY_FLOOR_VIOLATION, never ERR_BENEFIT_COST_BELOW_FLOOR.
        test_recipe:
          setup:
            - "CodeCycle 2027 in DELIBERATION with a SEATED FIRE_AND_LIFE_SAFETY committee of 3 voting seats (quorum_required 2)."
            - "One AmendmentProposal (LESS_STRINGENT, code_section 907.5.2) with review_status COMMENT_CLOSED and analysis_status COMPLETE."
            - "Its ACCEPTED COST_BENEFIT analysis certifies statewide_incremental_cost_cents 8120000 with annual_cost_savings_cents 807500 and measure_life_years 12, so preliminary_benefit_cost_ratio == 1.49 and the FINAL ratio computes to 0.99."
            - "A CONVENED Hearing holds that proposal on its agenda; logical clock at 2026-10-05T14:00:00Z."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - &c_cteF
              call: "POST /code-cycles/${cycle_id}/discipline-committees"
              payload: { discipline: "FIRE_AND_LIFE_SAFETY", voting_seat_count: 3 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { ctef_id: $.data.id }
            - &c_mF_chair
              call: "POST /discipline-committees/${ctef_id}/members"
              payload: { full_name: "Ada Kwan", sector: "INDUSTRY", voting_seat: true, is_chair: true }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { f_chair_id: $.data.id }
            - &c_mF_fire
              call: "POST /discipline-committees/${ctef_id}/members"
              payload: { full_name: "Bo Nkemelu", sector: "FIRE_SERVICE", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { f_fire_id: $.data.id }
            - &c_mF_loc
              call: "POST /discipline-committees/${ctef_id}/members"
              payload: { full_name: "Cyd Marsh", sector: "LOCAL_JURISDICTION", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { f_loc_id: $.data.id }
            - *c_intake_open
            - &c_propC
              call: "POST /amendment-proposals"
              payload: { code_cycle_id: "${cycle_id}", code_section: "907.5.2", discipline: "FIRE_AND_LIFE_SAFETY", title: "Relax audible alarm coverage in small assembly", proposed_text: "Permit reduced audible notification coverage in assembly spaces under 300 occupants.", stringency_direction: "LESS_STRINGENT", proposer_sector: "INDUSTRY" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
              captures: { propc_id: $.data.id }
            - *c_intake_closed
            - &c_screenC
              call: "POST /amendment-proposals/${propc_id}/screening"
              payload: { decision: "ACCEPT_FOR_ANALYSIS" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
              captures: { propc_v_screened: $.data.version }
            - &c_cbC
              call: "POST /amendment-proposals/${propc_id}/impact-analyses"
              payload: { expected_proposal_version: "${propc_v_screened}", analysis_type: "COST_BENEFIT", incremental_cost_by_occupancy: { R3: 10000, R2: 12000, B: 15000, A2: 18000 }, affected_permit_count: 700, annual_cost_savings_cents: 807500, measure_life_years: 12 }
              as: TechnicalStaff
              as_user_id: "staff-analyst-3"
              captures: { cbc_id: $.data.id }
            - &c_cbC_accept
              call: "POST /impact-analyses/${cbc_id}/review"
              payload: { decision: "ACCEPT" }
              as: CouncilAdmin
              as_user_id: "admin-reviewer-1"
            - *c_delib
            - &c_windowC_open
              call: "POST /amendment-proposals/${propc_id}/comment-window"
              payload: { action: "OPEN", opens_at: "2026-08-10T00:00:00Z", closes_at: "2026-09-09T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - *c_clock0909
            - &c_windowC_close
              call: "POST /amendment-proposals/${propc_id}/comment-window"
              payload: { action: "CLOSE" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_hearC
              call: "POST /hearings"
              payload: { committee_id: "${ctef_id}", scheduled_start: "2026-10-05T14:00:00Z", scheduled_end: "2026-10-05T17:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { hearc_id: $.data.id }
            - &c_agendaC
              call: "POST /hearings/${hearc_id}/agenda"
              payload: { mode: "AUTO_FILL" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - *c_clock1005
            - &c_conveneC
              call: "POST /hearings/${hearc_id}/convene"
              payload: { present_member_ids: ["${f_chair_id}", "${f_fire_id}", "${f_loc_id}"] }
              as: CouncilChair
