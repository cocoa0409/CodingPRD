# ============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Faith-Based and Nonprofit Institution Lending (task 2760)
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric assert below was computed by executing the §1.3 formula against
# the fixture literals pinned in the same instance's setup_api_calls.
#
# Reference fixture reused by most chains ("Grace Covenant Church"):
#   bylaws cap 500000000c · quorum 0.6667 · 3 community programs
#   giving periods (all in cents):
#     2025Q1 AUDITED  total 60000000 restr 8000000 endow 2000000 opex 39999950 hh 500
#     2025Q2 AUDITED  total 62000000 restr 8000000 endow 2000000 opex 40999950 hh 510
#     2025Q3 AUDITED  total 60000000 restr 8000000 endow 2000000 opex 40999950 hh 515
#     2025Q4 AUDITED  total 65000000 restr 8000000 endow 2000000 opex 41800200 hh 520
#     2026Q1 INTERNAL total 64000000 restr 8000000 endow 2000000 opex 43000000 hh 530
#   => AUDITED_ONLY base 207000000 · net 432001 dollars (sum-then-round: 432000)
#      BLENDED      base 202900000 · net 361000 dollars
#   logical clock left at its 2026-08-01T00:00:00Z default unless a chain moves it
# ============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: giving_base_audited_only_vs_blended_diverge
        grounds:
          - calculations.institution_unrestricted_giving_base
          - calculations.net_available_for_debt_service_dollars
          - entities.GivingPeriod.fields.source
          - entities.LoanApplication.fields.giving_basis
          - endpoints["GET /loan-applications/{loan_application_id}/underwriting-summary"]
        distinguishing_aspect: |
          The variant boundary is the four-period WINDOW MEMBERSHIP plus the 15% internal
          haircut: AUDITED_ONLY selects 2025Q4/Q3/Q2/Q1 and returns base 207000000 with
          net 432001, while BLENDED swaps 2025Q1 out for the INTERNAL 2026Q1 period,
          floors it at 85%, and returns base 202900000 with net 361000 — same five rows,
          two different windows, a 4100000-cent base delta and a 71001-dollar net delta.
        test_recipe:
          setup:
            - "One institution with five giving periods on file: four AUDITED (2025Q1–Q4) and one INTERNAL (2026Q1)."
            - "audited_period_count == 4, so the mandated snapshot basis is AUDITED_ONLY."
            - "One sanctuary asset (appraised 500000000, alternative_use_score 2, appraised 2025-06-01) assigned first lien to the application, lending value 225000000."
            - "The application sits in UNDERWRITING with giving_basis snapshotted as AUDITED_ONLY."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q2", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 62000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 510 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q3", period_start: "2025-07-01T00:00:00Z", period_end: "2025-09-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 515 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q4", period_start: "2025-10-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 65000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 41800200, member_household_count: 520 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2026Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", source: "INTERNAL", total_contributions_cents: 64000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 43000000, member_household_count: 530 }
              as: CreditAnalyst
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Main sanctuary building", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: CreditAnalyst
              captures: { asset: $.data.id }
            - call: "POST /loan-applications"
              payload: { institution_id: "${inst}", governance_authorization_id: "${gov}", purpose: "SANCTUARY_CONSTRUCTION", requested_amount_cents: 225000000, term_months: 240, interest_rate_bps: 625 }
              as: CreditAnalyst
              captures: { app: $.data.id }
            - call: "POST /loan-applications/${app}/submit-underwriting"
              payload: { analyst_note: "Four audited periods on file" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app}", lien_position: 1, lien_effective_from: "2026-08-01T00:00:00Z", lien_effective_to: "2031-08-01T00:00:00Z" }
              as: CreditAnalyst
          trigger:
            - call: "GET /loan-applications/${app}/underwriting-summary"
              payload: { giving_basis: "AUDITED_ONLY" }
              as: CreditAnalyst
              captures: { base_aud: $.data.giving_base_cents, net_aud: $.data.net_available_dollars }
            - call: "GET /loan-applications/${app}/underwriting-summary"
              payload: { giving_basis: "BLENDED" }
              as: CreditAnalyst
              captures: { base_bl: $.data.giving_base_cents, net_bl: $.data.net_available_dollars }
          assert:
            - "First response: data.giving_basis == \"AUDITED_ONLY\", data.giving_base_cents == 207000000, data.net_available_dollars == 432001"
            - "First response: data.window_period_labels == [\"2025Q4\", \"2025Q3\", \"2025Q2\", \"2025Q1\"]"
            - "Second response: data.giving_basis == \"BLENDED\", data.giving_base_cents == 202900000, data.net_available_dollars == 361000"
            - "Second response: data.window_period_labels == [\"2026Q1\", \"2025Q4\", \"2025Q3\", \"2025Q2\"] (the INTERNAL period displaces 2025Q1)"
            - "${base_aud} - ${base_bl} == 4100000 and ${net_aud} - ${net_bl} == 71001"
            - "Both responses report data.collateral_lending_value_cents == 225000000 and data.binding_cap == \"COLLATERAL\""
            - "LoanApplication.${app}.giving_basis == \"AUDITED_ONLY\" and LoanApplication.${app}.giving_base_cents == 207000000 — neither summary call mutates the snapshot"

      - name: pledge_campaign_conservative_vs_optimistic_valuation_diverge
        grounds:
          - calculations.pledge_campaign_projected_value
          - entities.PledgeCampaign.fields.attrition_adjusted_value_cents
          - entities.PledgeCampaign.fields.sponsor_projected_value_cents
          - entities.Pledge.fields.effective_attrition_pct
          - endpoints["GET /pledge-campaigns/{pledge_campaign_id}/valuation"]
        distinguishing_aspect: |
          Divergence is driven by DISCOUNT GRANULARITY, not by window membership: the
          LENDER_CONSERVATIVE variant discounts each active pledge at its own tier rate
          plus the 15-point missed-payment penalty and floors per pledge (109560000),
          while SPONSOR_OPTIMISTIC applies the single 9200 bps sponsor rate to the
          aggregate remaining balance and floors once (117000000) — a 7440000-cent delta
          on identical pledge rows.
        test_recipe:
          setup:
            - "One institution sponsoring the campaign 'Build His House' with goal 120000000, 36-month window and sponsor_collection_rate_bps 9200."
            - "Three ACTIVE pledges: LEAD 60000000 (collected 12000000, 0 missed), MAJOR 40000000 (collected 8000000, 2 missed), GENERAL 25000000 (collected 5000000, 0 missed)."
            - "total_pledged_cents 125000000, collected_to_date_cents 25000000; the campaign is mature (>= 108000000 pledged) and still OPEN (109560000 >= 96000000)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Build His House", goal_cents: 120000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9200 }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp: $.data.id, camp_v0: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "LEAD", pledged_amount_cents: 60000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v0}" }
              as: CreditAnalyst
              captures: { p_lead: $.data.id }
            - call: "GET /pledge-campaigns/${camp}"
              payload: {}
              as: CreditAnalyst
              captures: { camp_v1: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "MAJOR", pledged_amount_cents: 40000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v1}" }
              as: CreditAnalyst
              captures: { p_major: $.data.id }
            - call: "GET /pledge-campaigns/${camp}"
              payload: {}
              as: CreditAnalyst
              captures: { camp_v2: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "GENERAL", pledged_amount_cents: 25000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v2}" }
              as: CreditAnalyst
              captures: { p_gen: $.data.id }
            - call: "POST /pledges/${p_lead}/payments"
              payload: { installment_month: 1, outcome: "PAID", amount_cents: 12000000 }
              as: LoanServicer
            - call: "POST /pledges/${p_major}/payments"
              payload: { installment_month: 1, outcome: "PAID", amount_cents: 8000000 }
              as: LoanServicer
            - call: "POST /pledges/${p_major}/payments"
              payload: { installment_month: 2, outcome: "MISSED", amount_cents: 0 }
              as: LoanServicer
            - call: "POST /pledges/${p_major}/payments"
              payload: { installment_month: 3, outcome: "MISSED", amount_cents: 0 }
              as: LoanServicer
            - call: "POST /pledges/${p_gen}/payments"
              payload: { installment_month: 1, outcome: "PAID", amount_cents: 5000000 }
              as: LoanServicer
          trigger:
            - call: "GET /pledge-campaigns/${camp}/valuation"
              payload: { basis: "LENDER_CONSERVATIVE" }
              as: CreditAnalyst
              captures: { v_cons: $.data.projected_value_cents }
            - call: "GET /pledge-campaigns/${camp}/valuation"
              payload: { basis: "SPONSOR_OPTIMISTIC" }
              as: CreditAnalyst
              captures: { v_spon: $.data.projected_value_cents }
          assert:
            - "First response: data.basis == \"LENDER_CONSERVATIVE\" and data.projected_value_cents == 109560000 (25000000 collected + 45600000 LEAD + 23360000 MAJOR + 15600000 GENERAL)"
            - "Second response: data.basis == \"SPONSOR_OPTIMISTIC\" and data.projected_value_cents == 117000000 (25000000 + floor(100000000 * 0.92))"
            - "${v_spon} - ${v_cons} == 7440000"
            - "PledgeCampaign.${camp}.attrition_adjusted_value_cents == 109560000 and PledgeCampaign.${camp}.sponsor_projected_value_cents == 117000000"
            - "Pledge.${p_major}.effective_attrition_pct == 0.2700 (0.12 tier + 0.15 missed-payment penalty) while Pledge.${p_lead}.effective_attrition_pct == 0.0500"
            - "Both responses report data.underperform_threshold_cents == 96000000, data.maturity_threshold_cents == 108000000 and data.status == \"OPEN\""

  - rule_id: combinatorial_formula
    instances:
      - name: collateral_lending_value_nested_min_of_score_tier_and_type_cap
        grounds:
          - calculations.collateral_special_purpose_lending_value
          - entities.CollateralAsset.fields.lending_value_cents
          - entities.CollateralAsset.fields.appraisal_age_days
          - endpoints["POST /collateral-assets"]
        distinguishing_aspect: |
          Four assets created from the same 500000000/100000000 appraisals isolate each
          factor of the nested formula: asset A (SANCTUARY score 2, 2025-06-01) is bound
          by the SCORE tier 0.50 and then seasoned, asset B (SANCTUARY score 5,
          2026-05-01) is bound by the TYPE cap 0.55 with no seasoning, asset D (SANCTUARY
          score 5, 2025-06-01) shows cap AND seasoning compounding, and asset C
          (FELLOWSHIP_HALL score 4) shows the cap binding a different type. An
          implementation that takes max instead of min, or applies seasoning before the
          advance rate, or rounds instead of flooring, produces a different value on at
          least one of the four.
        test_recipe:
          setup:
            - "One institution; the logical clock stays at its 2026-08-01T00:00:00Z default."
            - "Four collateral assets created in one batch; no assignments, so every asset is valued as a notional first lien (lien_factor 1.00)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Sanctuary A score 2 seasoned appraisal", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: CreditAnalyst
              captures: { asset_a: $.data.id, lv_a: $.data.lending_value_cents }
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Sanctuary B score 5 fresh appraisal", appraised_value_cents: 500000000, appraisal_date: "2026-05-01T00:00:00Z", alternative_use_score: 5 }
              as: CreditAnalyst
              captures: { asset_b: $.data.id, lv_b: $.data.lending_value_cents }
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "FELLOWSHIP_HALL", description_label: "Fellowship hall C score 4 fresh appraisal", appraised_value_cents: 100000000, appraisal_date: "2026-05-01T00:00:00Z", alternative_use_score: 4 }
              as: CreditAnalyst
              captures: { asset_c: $.data.id, lv_c: $.data.lending_value_cents }
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Sanctuary D score 5 seasoned appraisal", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 5 }
              as: CreditAnalyst
              captures: { asset_d: $.data.id, lv_d: $.data.lending_value_cents }
          assert:
            - "Asset A: data.lending_value_cents == 225000000 and data.appraisal_age_days == 426 (min(0.50, 0.55) = 0.50 -> 250000000, lien 1.00, seasoning 0.90)"
            - "Asset B: data.lending_value_cents == 275000000 and data.appraisal_age_days == 92 (min(0.75, 0.55) = 0.55, no seasoning)"
            - "Asset C: data.lending_value_cents == 60000000 and data.appraisal_age_days == 92 (min(0.70, 0.60) = 0.60)"
            - "Asset D: data.lending_value_cents == 247500000 and data.appraisal_age_days == 426 (cap 0.55 -> 275000000, then seasoning 0.90)"
            - "${lv_b} - ${lv_a} == 50000000 and ${lv_b} - ${lv_d} == 27500000 — the score tier and the seasoning factor are separately observable"
            - "All four responses carry data.assigned_loan_application_id == null, data.lien_position == null and data.lien_history == []"

      - name: dscr_numerator_per_period_rounding_before_summation
        grounds:
          - calculations.net_available_for_debt_service_dollars
          - calculations.dscr_covenant_ratio
          - entities.Covenant.fields.last_test_numerator_dollars
          - endpoints["POST /covenants/{covenant_id}/tests"]
        distinguishing_aspect: |
          The four per-period nets are 10000050, 11000050, 9000050 and 13199800 cents.
          Rounding each to dollars first (round_half_up on .50) then summing gives
          100001 + 110001 + 90001 + 131998 = 432001; summing first (43200950 cents) then
          rounding gives 432000. Both orders yield the same 1.2000 ratio, so ONLY
          last_test_numerator_dollars exposes the order — an implementation that sums
          before rounding stores 432000 and fails this instance while still reporting a
          PASS.
        test_recipe:
          setup:
            - "The reference borrower, funded loan with annual_debt_service_cents 36000000 (denominator 360000 dollars)."
            - "One DSCR_UNRESTRICTED_GIVING covenant with threshold_ratio 1.2000, tested as of the 2026-08-01T00:00:00Z clock default."
            - "Loan.giving_basis is AUDITED_ONLY, so the test window is 2025Q4/Q3/Q2/Q1 and three of its four periods end in a half-cent-rounding .50 dollar boundary."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q2", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 62000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 510 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q3", period_start: "2025-07-01T00:00:00Z", period_end: "2025-09-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 515 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q4", period_start: "2025-10-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 65000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 41800200, member_household_count: 520 }
              as: CreditAnalyst
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Main sanctuary building", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: CreditAnalyst
              captures: { asset: $.data.id }
            - call: "POST /loan-applications"
              payload: { institution_id: "${inst}", governance_authorization_id: "${gov}", purpose: "SANCTUARY_CONSTRUCTION", requested_amount_cents: 225000000, term_months: 240, interest_rate_bps: 625 }
              as: CreditAnalyst
              captures: { app: $.data.id }
            - call: "POST /loan-applications/${app}/submit-underwriting"
              payload: { analyst_note: "Four audited periods on file" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app}", lien_position: 1, lien_effective_from: "2026-08-01T00:00:00Z", lien_effective_to: "2031-08-01T00:00:00Z" }
              as: CreditAnalyst
            - call: "POST /loan-applications/${app}/committee-referral"
              payload: { referral_note: "First lien on sanctuary" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /loan-applications/${app}/committee-decision"
              payload: { decision: "APPROVE" }
              as: CreditCommitteeMember
              as_user_id: "committee-1"
            - call: "POST /loans"
              payload: { loan_application_id: "${app}", annual_debt_service_cents: 36000000, interest_reserve_shortfall_cents: 1500000 }
              as: LoanServicer
              captures: { loan: $.data.id }
            - call: "POST /covenants"
              payload: { loan_id: "${loan}", covenant_type: "DSCR_UNRESTRICTED_GIVING", threshold_ratio: 1.2000, test_frequency: "QUARTERLY" }
              as: CreditAnalyst
              captures: { cov: $.data.id }
          trigger:
            - call: "POST /covenants/${cov}/tests"
              payload: { as_of_date: "2026-08-01T00:00:00Z" }
              as: LoanServicer
              captures: { num: $.data.last_test_numerator_dollars }
          assert:
            - "data.last_test_numerator_dollars == 432001 (per-period round_half_up then sum), NOT 432000 (sum then round)"
            - "data.last_test_denominator_dollars == 360000 and data.last_test_ratio == 1.2000"
            - "data.last_test_result == \"PASS\", data.status == \"COMPLIANT\", data.test_count == 1, data.consecutive_fail_count == 0"
            - "data.last_test_as_of == \"2026-08-01T00:00:00Z\""
            - "Loan.${loan}.risk_posture == \"OPEN\" — a passing test leaves the posture dimension untouched"
            - "LoanApplication.${app}.net_available_dollars == 432001 — the snapshot taken at submit-underwriting used the same pinned order"

      - name: draw_net_disbursement_waterfall_with_post_draw_retainage_tier
        grounds:
          - calculations.draw_net_disbursement
          - entities.DrawRequest.fields.completion_pct_at_disbursement
          - entities.DrawRequest.fields.net_disbursed_cents
          - entities.Loan.fields.retainage_held_cents
          - endpoints["POST /draw-requests/{draw_request_id}/disburse"]
        distinguishing_aspect: |
          Two identical 60000000 draws on a 225000000 loan disburse different cash
          because the retainage tier is read from the POST-draw cumulative position the
