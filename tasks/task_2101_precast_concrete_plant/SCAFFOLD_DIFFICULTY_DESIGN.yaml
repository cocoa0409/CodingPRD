            - "${err_id} == ERR_BED_OCCUPIED with HTTP 409"
            - "BedRun.${run2_id}.status == SCHEDULED"
            - "BedRun.${run2_id}.scheduled_start == 2026-08-04T12:00:00.000Z (exactly R1's scheduled_end plus the 6 h buffer, admitted because the extended window is half-open)"
            - "GET /bed-runs?bed_id=${bed_id} returns exactly 2 rows"

      - name: steam_zone_aggregate_boiler_demand_at_half_open_instants
        grounds:
          - calculations.steam_zone_peak_concurrent_demand
          - errors[ERR_STEAM_CAPACITY_EXCEEDED]
          - validations[priority=13]
          - entities.SteamZone.fields.boiler_capacity_bhp
        distinguishing_aspect: |
          Interval semantics 2, on a different resource entity (SteamZone) and with different
          geometry: cycles are NOT pairwise exclusive, they are SUMMED. Two 40 bhp cycles overlap
          happily at 80 bhp; a third 30 bhp cycle inside that overlap is rejected at 110 bhp, while a
          60 bhp cycle starting exactly when the first cycle ends is admitted at exactly 100 bhp
          because the intervals are half-open and the ceiling comparison is strictly greater.
        test_recipe:
          setup:
            - "Steam zone Z1 has boiler_capacity_bhp 100."
            - "Beds B1, B2 and B3 all sit in Z1; runs R1, R2 and R3 are SCHEDULED, one per bed, so bed occupancy never interferes."
            - "Cycle A on R1 draws 40 bhp over [2026-08-03T12:00:00Z, 2026-08-04T00:00:00Z)."
            - "Cycle B on R2 draws 40 bhp over [2026-08-03T18:00:00Z, 2026-08-04T06:00:00Z), so peak demand is 80 bhp."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
