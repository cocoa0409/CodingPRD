  # ==========================================================================
  # Rule 5: priority_pair_validation_conflict — 2 instances with different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: meet_posture_vs_invalid_state_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_MEET_POSTURE_FORBIDS]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair = state (Meet posture gate) vs state (entity-specific
          transition). When Meet.posture == FINALIZED AND Session.state ==
          SCHEDULED, attempting POST /sessions/{id}/close triggers both
          rules; priority 5 (posture) wins over priority 6 (transition).
        test_recipe:
          setup:
            - "Meet M FINALIZED; Session S in SCHEDULED (edge case via direct state)"
            - "Attempt POST /sessions/{S}/close — violates both posture rule and session SCORING precondition"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "PPC1", sanction_year: 2026, sanction_number: "USAG-2026-6001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id, sess_v: $.data.version }
          trigger:
            - call: "POST /api/v1/sessions/${sess_id}/close"
              payload: { expected_session_version: "${sess_v}" }
              as: MeetDirector
          assert:
            - "Response status == 409"
            - "error_id == ERR_INVALID_STATE (session in SCHEDULED, not SCORING) — priority 6 wins over hypothetical lower-priority checks"
            - "No state transition occurs; Session.version unchanged"

      - name: judge_safety_vs_temporal_availability_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_JUDGE_CONFLICT_OF_INTEREST]
          - errors[ERR_JUDGE_UNAVAILABLE]
        distinguishing_aspect: |
          Category pair = business_safety (conflict-of-interest, priority 8)
          vs business_temporal (availability window, priority 12). A judge
          whose gym matches an athlete's AND whose availability window is
          insufficient triggers both; priority 8 (safety) wins.
        test_recipe:
          setup:
            - "Judge J with affiliated_gym='Metro' and availability [14:00, 15:00] (too short for 14:00-18:00 session)"
            - "Session has AthleteEntry whose Gymnast.home_gym='Metro'"
            - "Attempt POST /judge-panels/{id}/assignments then confirm — both safety and temporal rules violated"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "PPC2", sanction_year: 2026, sanction_number: "USAG-2026-6002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A6000001", legal_name: "G", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_id}" }
              as: MeetDirector
            - call: "POST /api/v1/judges"
              payload: { usag_judge_number: "J6000001", legal_name: "Bad J", rating: "BREVET", affiliated_gym: "Metro", availability_start: "2026-05-02T14:00:00Z", availability_end: "2026-05-02T15:00:00Z" }
              as: MeetReferee
              captures: { j_bad: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/judge-panels"
              payload: { meet_id: "${meet_id}", apparatus: "VAULT" }
              as: MeetReferee
              captures: { jp_id: $.data.id }
          trigger:
            - call: "POST /api/v1/judge-panels/${jp_id}/auto-assign"
              payload: {}
              as: MeetReferee
          assert:
            - "auto-assign excludes J from eligible pool due to BOTH conflict-of-interest (priority 8) AND availability (priority 12)"
            - "If pool undersized: error ERR_INSUFFICIENT_JUDGE_POOL returned"
            - "Safety rule (conflict) executes before temporal rule (availability) in selector's eligibility filter order"

  # ==========================================================================
  # Rule 6: boundary_precision_check — 2 instances on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: qualification_threshold_exactly_at_32000
        grounds:
          - calculations.qualification_evaluation
          - entities.AthleteEntry.fields.all_around_total
        distinguishing_aspect: |
          Metric = all_around_total; boundary = 32.000 (inclusive >=). An L4
          gymnast with AA exactly 32.000 qualifies to STATE; AA = 31.999 does
          not. Endpoint reached via POST /sessions/{id}/close triggering
          qualification_evaluation.
        test_recipe:
          setup:
            - "L4 gymnast with four FINAL scores summing to exactly 32.000 (e.g., 8.0 + 8.0 + 8.0 + 8.0)"
            - "Second L4 gymnast with four FINAL scores summing to 31.999 (e.g., 8.0+8.0+8.0+7.999)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Bnd1", sanction_year: 2026, sanction_number: "USAG-2026-7001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", qualifying_score_rule: "ALL_AROUND_ONLY" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L4", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A7000001", legal_name: "G Exact", date_of_birth: "2014-01-01T00:00:00Z", competitive_level: "L4", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_ex: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A7000002", legal_name: "G Below", date_of_birth: "2014-01-01T00:00:00Z", competitive_level: "L4", home_gym: "South" }
              as: MeetDirector
              captures: { g_bl: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_ex}" }
