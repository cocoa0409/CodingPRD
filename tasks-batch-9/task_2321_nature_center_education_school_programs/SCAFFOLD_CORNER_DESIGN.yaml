        grounds:
          - validations.priority_44
          - errors.ERR_TRAINING_ATTEMPTS_EXHAUSTED
          - state_machines.TrainingRecord.ASSESSED_FAIL_to_ENROLLED
          - entities.TrainingRecord.fields.attempt_count
        distinguishing_aspect: |
          The allowance is counted in assessments, not in re-enrolments, so the cycle is walked to
          the exact boundary: the third failure leaves attempt_count at 3 and the fourth
          re-enrolment is refused while the record stays in ASSESSED_FAIL. An off-by-one
          implementation either blocks the third attempt or allows a fourth.
