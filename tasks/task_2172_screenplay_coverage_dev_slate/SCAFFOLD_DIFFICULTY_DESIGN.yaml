        distinguishing_aspect: |
          Cascade of depth 5 originating from the OptionAgreement ACTIVE -> LAPSED transition: the
          lapse decrements property.encumbrance_count (link 1), which is what flips
          project.rights_status to LAPSED_RIGHTS (link 2), which is what kills development_status
          and terminates the engagement (link 3), which is what voids that engagement's milestones
