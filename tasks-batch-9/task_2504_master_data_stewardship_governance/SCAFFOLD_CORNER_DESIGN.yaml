              as_user_id: "${nina_id}"
              captures: { e_owner: $.data.error_id }
            - call: "POST /mdm/change-requests/${cr_id}/review"
              payload: {}
              as: DataOwner
              as_user_id: "${std_id}"
              captures: { e_owner_role: $.data.error_id }
          assert:
            - "${e_steward} == ERR_NOT_DOMAIN_STEWARD with HTTP 403 - Nina has no assignment on the domain"
            - "${e_owner} == ERR_NOT_DOMAIN_OWNER with HTTP 403"
            - "${e_owner_role} == ERR_NOT_DOMAIN_OWNER - Sam is assigned, but as DATA_STEWARD, so the DATA_OWNER entitlement is still missing"
            - "GET /mdm/quality-rules?domain_id=${dom_id} returns total_count == 0 and the change request is still DRAFT"

      - name: custodian_satisfies_the_steward_entitlement_but_an_expired_assignment_does_not
        claim_type: Conditional validation - rule applies only when entity has certain config
        grounds:
          - roles.DataSteward.description
          - validations.priority_6_ERR_NOT_DOMAIN_STEWARD
        distinguishing_aspect: "The DataSteward entitlement accepts steward_role IN {DATA_STEWARD, CUSTODIAN} but only while the assignment interval covers the clock, so a CUSTODIAN passes and the very same CUSTODIAN is refused once the clock leaves the interval."
        test_recipe:
          setup:
            - "Domain CUSTOMER (DRAFT); Nina holds a CUSTODIAN assignment from 2026-08-01T00:00:00Z to 2026-08-10T00:00:00Z. Clock starts at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Nina Nomad", email: "nina@mdm.test", certification_level: "JUNIOR" }
              as: GovernanceAdmin
              captures: { nina_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${nina_id}", steward_role: "CUSTODIAN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
              captures: { assign_id: $.data.id, assign_status: $.data.status }
          trigger:
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${nina_id}", rule_code: "QR1", dimension: "VALIDITY", weight_points: 10, threshold_pct: 80.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${nina_id}"
              captures: { ok_id: $.data.id, ok_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${nina_id}", rule_code: "QR2", dimension: "TIMELINESS", weight_points: 10, threshold_pct: 80.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${nina_id}"
              captures: { e_expired: $.data.error_id }
            - call: "GET /mdm/steward-assignments/${assign_id}"
              as: Auditor
              captures: { after_status: $.data.status }
          assert:
            - "first trigger -> HTTP 201 with ${ok_status} == ACTIVE: a CUSTODIAN carries the DataSteward entitlement"
            - "${e_expired} == ERR_NOT_DOMAIN_STEWARD (403) - the interval is half-open, so the clock landing exactly on effective_to no longer covers it"
            - "setup ${assign_status} == ACTIVE and ${after_status} == ACTIVE - the assignment row was never mutated; only the clock moved"
            - "GET /mdm/quality-rules?domain_id=${dom_id} returns total_count == 1 with id ${ok_id}"

      - name: consumer_rep_acknowledges_only_its_own_subscription
        claim_type: Peer roles - Role A cannot touch role B's resources
        grounds:
