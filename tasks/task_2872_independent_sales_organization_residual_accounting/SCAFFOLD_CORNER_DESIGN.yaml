            - "ResidualAllocation.${al}.applied_pct == 0.50 (nominal, unscaled), basis_cents == 40000, gross_allocation_cents == 10000, vesting_withheld_cents == 10000"
            - "MerchantProfitability.allocated_total_cents == 10000 and iso_retained_cents == 30000 — the withheld half falls to the house, it is not redistributed"
