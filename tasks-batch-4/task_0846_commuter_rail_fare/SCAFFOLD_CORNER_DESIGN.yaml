              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: passenger_cannot_activate_others_ticket_returns_not_owner
        claim_type: rbac_denied
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Passenger B activating Passenger A's ticket is rejected with ERR_NOT_RESOURCE_OWNER (403) — entity_backed ownership check on X-User-ID."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger A owns a PURCHASED ticket; Passenger B also exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "own-a@x.com", full_name: "OwnA", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax_a: $.data.id }
            - call: "POST /passengers"
              payload: { email: "own-b@x.com", full_name: "OwnB", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax_b: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax_a}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax_a}"
              captures: { tkt: $.data.id }
          trigger:
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: rbac_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID header to GET /passengers/{id} is rejected with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A passenger exists; the trigger call omits authentication headers."]
          setup_api_calls:
            - call: "POST /passengers"
              payload: { email: "au@x.com", full_name: "Au", date_of_birth: "1990-01-01" }
