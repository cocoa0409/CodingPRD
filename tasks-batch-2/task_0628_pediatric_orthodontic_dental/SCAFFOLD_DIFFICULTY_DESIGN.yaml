  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: chair_overlap_with_turnover_buffer_closed_interval
        grounds:
          - validations[priority=9]
          - errors[ERR_CHAIR_CONFLICT]
          - entities.Chair.fields.turnover_buffer_minutes
          - entities.Appointment.fields.chair_id
        distinguishing_aspect: |
          Chair interval semantics are CLOSED-WITH-BUFFER: the existing 15:00-15:30 appointment blocks
          the chair through 15:40 (30-min + 10-min turnover), so a new 15:35-16:05 appointment in the
          same chair (different provider) is rejected ERR_CHAIR_CONFLICT even though their booked times
          do not overlap.
        test_recipe:
          setup:
            - "Chair C5 buffer 10; provider P1 has 15:00-15:30 EMERGENCY in C5; second provider P2 free."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Tam", billing_email: "tam@x.com", guardian_user_id: "guardian-tam" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "P1 Tam", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat1_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "P2 Tam", date_of_birth: "2013-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat2_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-15", full_name: "Dr. P1", npi: "1534567890" }
              as: ClinicAdmin
              captures: { prov1_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-16", full_name: "Dr. P2", npi: "1634567890" }
              as: ClinicAdmin
              captures: { prov2_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "C5", turnover_buffer_minutes: 10 }
              as: ClinicAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat1_id}", provider_id: "${prov1_id}", chair_id: "${chair_id}", visit_type: "EMERGENCY", starts_at: "2026-04-01T15:00:00Z", ends_at: "2026-04-01T15:30:00Z" }
              as: FrontDesk
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pat2_id}", provider_id: "${prov2_id}", chair_id: "${chair_id}", visit_type: "EMERGENCY", starts_at: "2026-04-01T15:35:00Z", ends_at: "2026-04-01T16:05:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CHAIR_CONFLICT"
            - "HTTP status == 409"

      - name: provider_half_open_overlap_no_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_PROVIDER_CONFLICT]
          - entities.Appointment.fields.provider_id
        distinguishing_aspect: |
          Provider interval semantics are HALF-OPEN with NO buffer: the same provider booked
          15:00-15:30 in chair C6 and a new 15:15-15:45 in a DIFFERENT chair C7 overlap on the
          provider -> ERR_PROVIDER_CONFLICT; contrast with the chair rule (buffer + different
          resource), confirming different interval arithmetic on a different resource entity.
        test_recipe:
          setup:
            - "Provider P3 booked 15:00-15:30 in chair C6 (EMERGENCY); chair C7 is free."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Ubo", billing_email: "ubo@x.com", guardian_user_id: "guardian-ubo" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "P1 Ubo", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat1_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "P2 Ubo", date_of_birth: "2013-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat2_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-17", full_name: "Dr. P3", npi: "1734567890" }
              as: ClinicAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "C6", turnover_buffer_minutes: 10 }
              as: ClinicAdmin
              captures: { chair6_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "C7", turnover_buffer_minutes: 10 }
              as: ClinicAdmin
              captures: { chair7_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat1_id}", provider_id: "${prov_id}", chair_id: "${chair6_id}", visit_type: "EMERGENCY", starts_at: "2026-04-01T15:00:00Z", ends_at: "2026-04-01T15:30:00Z" }
              as: FrontDesk
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pat2_id}", provider_id: "${prov_id}", chair_id: "${chair7_id}", visit_type: "EMERGENCY", starts_at: "2026-04-01T15:15:00Z", ends_at: "2026-04-01T15:45:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROVIDER_CONFLICT"
            - "HTTP status == 409"

