  # =========================================================================
  # SECTION: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: feasibility_read_defaults_to_the_pattern_basis_and_the_slates_default_episode_count
        claim_type: computed_read
        grounds:
          - "endpoints.GET_/development-projects/{id}/feasibility"
          - "calculations.pilot_series_feasibility"
          - "constants.DEFICIT_TIER1_CENTS"
        distinguishing_aspect: "With no query parameters the read must apply basis PATTERN and the slate's default_episode_count 10, and every one of the eight output fields is pinned: 32437500 per-episode cost, tier 9000 (the 2437500 provisional deficit is above DEFICIT_TIER1_CENTS), 29193750 licence fee, 3243750 deficit, 32437500 total, verdict FEASIBLE."
        test_recipe:
          setup:
            - "project \"Fault Lines\" is SCRIPT_COMPLETE with cumulative_dev_cost_cents 4375000 on a STREAMING slate whose pattern budget is 32000000, licence cap 30000000, max deficit 7000000 and default_episode_count 10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
