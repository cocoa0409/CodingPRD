            - "PlantLot.${l9_id} (link 2 + 3): status == RECALLED, plants_planted == 0, plants_reserved == 0, plants_destroyed == 1000 (600 recalled in-ground + 400 unplanted remainder), plants_available == 0"
            - "HarvestWindow.${w9_id}.booked_volume_kg == 0 (link 3: the 1200 kg booking unwound by the planting recall, not by any direct window call)"
            - "GrowerAgreement.${a5_id}.units_planted == 0 (link 3': the 600 planted units debited)"
            - "agreement stays ACTIVE but is commercially dead: creating a new plant lot for the recalled variety fails 422 ERR_VARIETY_RECALLED"

      - name: grower_exit_depth_cascade
        grounds:
          - state_machines.Grower.ACTIVE_to_EXITED
          - state_machines.GrowerAgreement.ACTIVE_to_TERMINATED
          - state_machines.Planting.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          The grower-exit trigger chains depth 3 on a DIFFERENT trigger than recall-enforce:
          exit TERMINATES agreements (link 1); each termination CANCELS its PLANNED plantings
