              as: FrontDesk
              captures: { enr_status: $.data.status, enr_reason: $.data.cancel_reason }
          assert:
            - "Enrollment.${enr_id}.status == CANCELED"
            - "Enrollment.${enr_id}.status != LATE_CANCEL"
            - "Enrollment.${enr_id}.cancel_reason == ATHLETE_REQUEST"
            - "Enrollment.${enr_id}.station_number == null"
            - "MembershipPackage.${pkg_id}.status == ACTIVE"
            - "MembershipPackage.${pkg_id}.sessions_remaining == 1"
            - "MembershipPackage.${pkg_id}.sessions_reserved == 0"
            - "MembershipPackage.${pkg_id}.sessions_forfeited == 0"
