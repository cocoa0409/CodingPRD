        claim_type: cascade_down
        grounds:
          - state_machines.Project.picture_status.LOCKED_to_LOCK_BROKEN
          - state_machines.StemPackage.CONFORMED_to_STALE
        excluded_because:
          difficulty_instance: transitive_cascade / break_picture_lock_depth_four_stem_deliverable_booking_ledger
          rationale: "The depth-4 parent-to-children cascade and the non-terminal-only filter are asserted hop by hop there."

