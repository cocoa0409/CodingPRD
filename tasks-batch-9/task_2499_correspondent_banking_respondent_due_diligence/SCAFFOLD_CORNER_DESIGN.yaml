      - name: the_approver_may_not_be_the_identity_that_scored_the_respondent
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=39]
          - roles[CommitteeApprover].description
          - endpoints[POST /correspondent-banking/respondents/{respondentId}/approval]
          - errors[ERR_SEGREGATION_OF_DUTIES]
