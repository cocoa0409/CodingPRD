  # =====================================================================
  - section: errors
    instances:
      - name: err_invalid_state_residual
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: state_vs_fiscal_on_draw_approve
          rationale: "ERR_INVALID_STATE asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: err_draw_exceeds_remaining_residual
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRAW_EXCEEDS_REMAINING]"]
        excluded_because:
          difficulty_instance: draw_approval_exactly_remaining_allowance
          rationale: "Asserted as the over-by-one-cent failure path of the named §1.8 boundary instance."
      - name: err_schedule_overlap_residual
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHEDULE_OVERLAP]"]
        excluded_because:
          difficulty_instance: milestone_adjacency_vs_overlap_half_open
          rationale: "Asserted as the one-millisecond-overlap failure path of the named §1.8 boundary instance."
      - name: err_property_construction_capacity_residual
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROPERTY_CONSTRUCTION_CAPACITY]"]
        excluded_because:
          difficulty_instance: property_concurrent_construction_capacity_closed_interval
          rationale: "Asserted as the closed-interval boundary conflict in the named §1.8 temporal-overlap instance."
      - name: err_no_active_engagement_residual
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ACTIVE_ENGAGEMENT]"]
        excluded_because:
          difficulty_instance: draw_submit_requires_active_engagement
          rationale: "Asserted as the failure path of the named §1.8 cross-entity dependency instance."
      - name: err_disbursement_period_in_future_residual
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISBURSEMENT_PERIOD_IN_FUTURE]"]
        excluded_because:
          difficulty_instance: temporal_vs_referential_on_draw_submit
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: engagement_terminate_with_confirmed_milestone_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.ContractorEngagement.ACTIVE_to_TERMINATED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminating an engagement that has a CONFIRMED milestone violates the transition precondition -> ERR_INVALID_STATE; cancelling the milestone first makes terminate succeed and cascade-cancel nothing."
        test_recipe:
          setup: ["Project in CONSTRUCTION; engagement ACTIVE with one NOISY milestone CONFIRMED"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/plan-submissions"
              payload: { drawing_set_ref: "DS" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/plan-submissions/${sub_id}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub_id}/approve"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-pre-construction"
              as: LandlordPM
            - call: "POST /api/contractors"
              payload: { company_name: "BC", license_number: "L", insurance_expiry_date: "2027-01-01T00:00:00Z" }
              as: LandlordPM
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contractors/${ctr_id}/qualify"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/contractor-engagements"
              payload: { contractor_id: "${ctr_id}", scope_note: "GC" }
              as: LandlordPM
              captures: { eng_id: $.data.id }
            - call: "POST /api/contractor-engagements/${eng_id}/acknowledge-rules"
              as: ContractorRep
              as_user_id: "${ctr_id}"
            - call: "POST /api/contractor-engagements/${eng_id}/approve"
              as: LandlordPM
            - call: "POST /api/contractor-engagements/${eng_id}/activate"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/start-construction"
              payload: { construction_start_date: "2026-08-03T00:00:00Z", construction_end_date: "2026-09-04T00:00:00Z" }
              as: LandlordPM
            - call: "POST /api/contractor-engagements/${eng_id}/milestones"
              payload: { milestone_name: "Noisy", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-20T00:00:00Z", work_type: "NOISY" }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { ms1: $.data.id }
            - call: "POST /api/schedule-milestones/${ms1}/confirm"
              as: LandlordPM
          trigger:
            - call: "POST /api/contractor-engagements/${eng_id}/terminate"
              as: LandlordPM
              captures: { err1: $.data.error_id }
            - call: "POST /api/schedule-milestones/${ms1}/cancel"
              as: LandlordPM
            - call: "POST /api/contractor-engagements/${eng_id}/terminate"
              as: LandlordPM
              captures: { st2: $.data.status }
          assert:
            - "First terminate: error_id == ERR_INVALID_STATE (CONFIRMED milestone precondition)"
            - "After milestone cancel: ContractorEngagement.${eng_id}.status == TERMINATED"

