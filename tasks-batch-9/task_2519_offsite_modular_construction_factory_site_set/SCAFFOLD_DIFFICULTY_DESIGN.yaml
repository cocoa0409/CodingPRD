              captures: { e1: "$.data.line_slot_end" }
            - call: "POST /modular/modules/${m2}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T16:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { e2: "$.data.line_slot_end", n2: "$.data.line_slot_minutes" }
            - call: "POST /modular/modules/${m3}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T18:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { over: "$.data.error_id" }
            - call: "POST /modular/modules/${m3}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T23:00:00Z" }
              as: FactoryProductionManager
