      - name: locker_hold_expiry_then_abandonment_dispositions_the_contents
        claim_type: conditional_cascade
        grounds:
          - state_machines.LockerCompartment.OCCUPIED_to_HOLD_EXPIRED
          - state_machines.LockerCompartment.HOLD_EXPIRED_to_AVAILABLE
          - state_machines.RequestItem.INTAKE_PENDING_to_ABANDONED
        distinguishing_aspect: "expire-hold is refused with ERR_INVALID_STATE while the clock is before hold_expires_at (2026-05-04T00:00:00Z), succeeds at that instant, and abandon only becomes legal at hold_expires_at plus LOCKER_ABANDON_GRACE_HOURS, that is 2026-05-11T00:00:00Z, at which point the item goes to custody ABANDONED."
        test_recipe:
          setup:
            - "One SMALL compartment at SITE-A holding a deposited LOCKER request from 2026-05-01T00:00:00Z, so hold_expires_at is 2026-05-04T00:00:00Z."
            - "The item is still INTAKE_PENDING in LOCKER custody; no bench intake ever happened."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
