scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: exposure_gross_vs_net_divergence
        grounds:
          - calculations.dollars_at_risk
          - calculations.success_rate
          - entities.AuditClaimLine.fields.issue_code_id
        distinguishing_aspect: |
          On the SAME AuditCase, the GROSS variant reports the unweighted denied
          total while the NET variant weights each line by the FROZEN
          prior-quarter DOLLAR_WEIGHTED overturn rate for (payer, issue); with a
          909bp snapshot rate a 400000-cent denied line yields gross 400000 but
          net 363640 — two valid algorithms, different results, entity domain =
          AuditCase financial exposure.
        test_recipe:
          setup:
            - "Payer RAC-A (MEDICARE track) with issue MED_NEC; prior-quarter (Q2) history: one case, line H1 denied 10000 decided FAVORABLE, line H2 denied 100000 decided UNFAVORABLE, both decided_at 2026-05-15 -> snapshot DOLLAR_WEIGHTED overturn = 909bp"
            - "Current-quarter target case with one line denied 400000 under issue MED_NEC, clock 2026-08-01 (Q3)"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "RAC-A", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: ["LEVEL_1"], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "POST /audit-cases", payload: { payer_id: "${p_id}", audit_type: "RAC_COMPLEX", received_at: "2026-05-01T00:00:00Z" }, as: HIMCoordinator, captures: { hc_id: $.data.id } }
            - { call: "POST /audit-cases/${hc_id}/claim-lines", payload: { claim_number: "H-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-05T00:00:00Z", billed_amount_cents: 10000 }, as: HIMCoordinator, captures: { hl1_id: $.data.id } }
            - { call: "POST /audit-cases/${hc_id}/claim-lines", payload: { claim_number: "H-2", patient_account_number: "PA-2", service_start_date: "2026-01-02T00:00:00Z", service_end_date: "2026-01-06T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { hl2_id: $.data.id } }
            - { call: "GET /audit-cases/${hc_id}", payload: {}, as: Any, captures: { hc_v: $.data.version } }
            - { call: "POST /audit-cases/${hc_id}/records-submissions", payload: { manifest_ref: "M-H", expected_audit_case_version: "${hc_v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${hc_id}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "POST /audit-cases/${hc_id}/determination", payload: { outcomes: [ { claim_line_id: "${hl1_id}", outcome: "DENIED", denied_amount_cents: 10000, denial_category: "CLINICAL", issue_code_id: "${ic_id}" }, { claim_line_id: "${hl2_id}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "CLINICAL", issue_code_id: "${ic_id}" } ] }, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /claim-lines/${hl1_id}/appeals", payload: {}, as: AppealsSpecialist, captures: { ha1_id: $.data.id } }
            - { call: "POST /appeals/${ha1_id}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ha1_id}/decision", payload: { outcome: "FAVORABLE", upheld_cents: 0 }, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /claim-lines/${hl2_id}/appeals", payload: {}, as: AppealsSpecialist, captures: { ha2_id: $.data.id } }
            - { call: "POST /appeals/${ha2_id}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ha2_id}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 100000 }, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "POST /audit-cases", payload: { payer_id: "${p_id}", audit_type: "RAC_AUTOMATED", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { tc_id: $.data.id } }
            - { call: "POST /audit-cases/${tc_id}/claim-lines", payload: { claim_number: "T-1", patient_account_number: "PA-9", service_start_date: "2026-03-01T00:00:00Z", service_end_date: "2026-03-05T00:00:00Z", billed_amount_cents: 400000 }, as: HIMCoordinator, captures: { tl_id: $.data.id } }
            - { call: "GET /audit-cases/${tc_id}", payload: {}, as: Any, captures: { tc_v: $.data.version } }
            - { call: "POST /audit-cases/${tc_id}/records-submissions", payload: { manifest_ref: "M-T", expected_audit_case_version: "${tc_v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${tc_id}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /audit-cases/${tc_id}/determination", payload: { outcomes: [ { claim_line_id: "${tl_id}", outcome: "DENIED", denied_amount_cents: 400000, denial_category: "CLINICAL", issue_code_id: "${ic_id}" } ] }, as: PayerAgent, as_user_id: "${p_id}" }
          trigger:
            - { call: "GET /audit-cases/${tc_id}/exposure", payload: {}, as: Any, captures: { gross: $.data.gross_dollars_at_risk_cents, net: $.data.net_exposure_cents, snap: $.data.snapshot_quarter_start } }
          assert:
            - "gross == 400000 (unweighted denied total)"
            - "net == 363640 (round_half_up(400000 * (10000 - 909) / 10000); snapshot rate 909bp from prior-quarter 10000-recovered / 110000-appealed)"
            - "snap == \"2026-04-01T00:00:00Z\" (prior completed quarter start)"
            - "gross != net"

      - name: success_rate_simple_vs_dollar_weighted
        grounds:
          - calculations.success_rate
          - entities.Appeal.fields.appealed_denied_cents
        distinguishing_aspect: |
          Over the SAME decided-appeal population for one (payer, issue) group,
          SIMPLE counts appeals (partial = 0.5) while DOLLAR_WEIGHTED weights by
          recovered cents: 5000bp vs 2500bp — two valid algorithms, different
          results, entity domain = Appeal analytics grouped by (Payer, IssueCode).
        test_recipe:
          setup:
            - "One case with three denied lines under issue MED_NEC: 10000 (decided FAVORABLE), 20000 (decided PARTIAL, upheld 5000), 70000 (decided UNFAVORABLE, upheld 70000); all decided at 2026-08-01"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "RAC-A", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic_id: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p_id}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /audit-cases/${c_id}/claim-lines", payload: { claim_number: "A-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 10000 }, as: HIMCoordinator, captures: { l1_id: $.data.id } }
            - { call: "POST /audit-cases/${c_id}/claim-lines", payload: { claim_number: "A-2", patient_account_number: "PA-2", service_start_date: "2026-01-04T00:00:00Z", service_end_date: "2026-01-06T00:00:00Z", billed_amount_cents: 20000 }, as: HIMCoordinator, captures: { l2_id: $.data.id } }
            - { call: "POST /audit-cases/${c_id}/claim-lines", payload: { claim_number: "A-3", patient_account_number: "PA-3", service_start_date: "2026-01-07T00:00:00Z", service_end_date: "2026-01-09T00:00:00Z", billed_amount_cents: 70000 }, as: HIMCoordinator, captures: { l3_id: $.data.id } }
            - { call: "GET /audit-cases/${c_id}", payload: {}, as: Any, captures: { c_v: $.data.version } }
            - { call: "POST /audit-cases/${c_id}/records-submissions", payload: { manifest_ref: "M-1", expected_audit_case_version: "${c_v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c_id}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /audit-cases/${c_id}/determination", payload: { outcomes: [ { claim_line_id: "${l1_id}", outcome: "DENIED", denied_amount_cents: 10000, denial_category: "CLINICAL", issue_code_id: "${ic_id}" }, { claim_line_id: "${l2_id}", outcome: "DENIED", denied_amount_cents: 20000, denial_category: "CLINICAL", issue_code_id: "${ic_id}" }, { claim_line_id: "${l3_id}", outcome: "DENIED", denied_amount_cents: 70000, denial_category: "TECHNICAL", issue_code_id: "${ic_id}" } ] }, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /claim-lines/${l1_id}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap1}/decision", payload: { outcome: "FAVORABLE", upheld_cents: 0 }, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /claim-lines/${l2_id}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap2: $.data.id } }
            - { call: "POST /appeals/${ap2}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap2}/decision", payload: { outcome: "PARTIAL", upheld_cents: 5000 }, as: PayerAgent, as_user_id: "${p_id}" }
            - { call: "POST /claim-lines/${l3_id}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap3: $.data.id } }
            - { call: "POST /appeals/${ap3}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap3}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 70000 }, as: PayerAgent, as_user_id: "${p_id}" }
          trigger:
            - { call: "GET /analytics/success-rates", payload: { payer_id: "${p_id}", issue_code_id: "${ic_id}", from: "2026-08-01T00:00:00Z", to: "2026-09-01T00:00:00Z", variant: "SIMPLE" }, as: Any, captures: { rows_simple: $.data.rows } }
            - { call: "GET /analytics/success-rates", payload: { payer_id: "${p_id}", issue_code_id: "${ic_id}", from: "2026-08-01T00:00:00Z", to: "2026-09-01T00:00:00Z", variant: "DOLLAR_WEIGHTED" }, as: Any, captures: { rows_dw: $.data.rows } }
          assert:
            - "rows_simple has exactly 1 row for (${p_id}, ${ic_id}) with decided_count == 3, favorable_count == 1, partial_count == 1, unfavorable_count == 1"
            - "rows_simple[0].success_rate_bp == 5000 (round_half_up(10000 * 1.5 / 3))"
            - "rows_dw[0].success_rate_bp == 2500 (round_half_up(10000 * 25000 / 100000))"
            - "rows_simple[0].success_rate_bp != rows_dw[0].success_rate_bp"

  # ===================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: interest_accrual_tiered_with_hold_exclusion
        grounds:
          - calculations.recoupment_interest_accrual
          - entities.RecoupmentDemand.fields.accumulated_hold_seconds
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs (outstanding principal, elapsed 30-day periods,
          accumulated hold seconds) with non-linear interaction (tier1 rate for
          periods 1-2, tier2 beyond, min() cap): demand without hold at 90 days
          accrues 40000 (tier blend 2*1% + 1*2%), while an identical demand held
          for 30 of those 90 days accrues only 20000 (hold seconds excluded ->
          60 eligible days -> periods 2, tier1 only).
        test_recipe:
          setup:
            - "Payer P1 (hold_levels []) with case C1, one line denied 1000000, demand D1 principal 1000000 issued 2026-08-01"
            - "Payer P2 (hold_levels [LEVEL_1]) with case C2, one line denied 1000000, demand D2 principal 1000000 issued 2026-08-01; D2 goes ON_HOLD 2026-08-11 (L1 appeal filed) and releases 2026-09-10 (UNFAVORABLE decision)"
            - "Read at clock 2026-10-30 (90 days after issue)"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /payers", payload: { name: "P2", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: ["LEVEL_1"], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p2: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "C1-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-05T00:00:00Z", billed_amount_cents: 1000000 }, as: HIMCoordinator, captures: { c1l: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${c1l}", outcome: "DENIED", denied_amount_cents: 1000000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 1000000, issued_at: "2026-08-01T00:00:00Z" }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p2}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /audit-cases/${c2}/claim-lines", payload: { claim_number: "C2-1", patient_account_number: "PA-2", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-05T00:00:00Z", billed_amount_cents: 1000000 }, as: HIMCoordinator, captures: { c2l: $.data.id } }
            - { call: "GET /audit-cases/${c2}", payload: {}, as: Any, captures: { c2v: $.data.version } }
            - { call: "POST /audit-cases/${c2}/records-submissions", payload: { manifest_ref: "M2", expected_audit_case_version: "${c2v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c2}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p2}" }
            - { call: "POST /audit-cases/${c2}/determination", payload: { outcomes: [ { claim_line_id: "${c2l}", outcome: "DENIED", denied_amount_cents: 1000000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p2}" }
            - { call: "POST /audit-cases/${c2}/recoupment-demands", payload: { principal_cents: 1000000, issued_at: "2026-08-01T00:00:00Z" }, as: PayerAgent, as_user_id: "${p2}", captures: { d2: $.data.id } }
            - { call: "POST /claim-lines/${c2l}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "POST /appeals/${ap2}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "POST /appeals/${ap2}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 1000000 }, as: PayerAgent, as_user_id: "${p2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { d1_interest: $.data.accrued_interest_cents } }
            - { call: "GET /recoupment-demands/${d2}", payload: {}, as: Any, captures: { d2_interest: $.data.accrued_interest_cents, d2_hold: $.data.accumulated_hold_seconds } }
          assert:
            - "d1_interest == 40000 (90 days -> periods 3 -> 1000000 * (100*2 + 200*1) / 10000)"
            - "d2_interest == 20000 (30-day hold excluded -> 60 eligible days -> periods 2 -> 1000000 * 100*2 / 10000)"
            - "d2_hold == 2592000 (30 days in seconds)"

      - name: offset_waterfall_per_demand_rounding
        grounds:
          - calculations.offset_waterfall_allocation
          - calculations.recoupment_interest_accrual
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: each demand's interest is
          rounded half-up to whole cents PER DEMAND before allocation, so two
          demands with raw interest 333.33 contribute 333 + 333 = 666; summing
          raw interest first would give round(666.66) = 667. The scaffold pins
          the per-demand order, and the waterfall order (issued_at ASC,
          created_at ASC) puts the first-created demand first when issued_at ties.
        test_recipe:
          setup:
            - "One case with one line denied 100000; demands D1 and D2 (principal 33333 each, both issued_at 2026-08-01T00:00:00Z, D1 created first); remittance gross 100000; allocation at clock 2026-08-31 (30 days -> 1 period, tier1 100bps -> raw interest 333.33 per demand)"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "C1-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-05T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { c1l: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${c1l}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 33333, issued_at: "2026-08-01T00:00:00Z" }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 33333, issued_at: "2026-08-01T00:00:00Z" }, as: PayerAgent, as_user_id: "${p1}", captures: { d2: $.data.id } }
            - { call: "POST /remittances", payload: { payer_id: "${p1}", gross_amount_cents: 100000 }, as: PayerAgent, as_user_id: "${p1}", captures: { rem: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "POST /remittances/${rem}/allocate", payload: {}, as: PFSAccountant, captures: { o1_demand: "$.data[0].recoupment_demand_id", o1_int: "$.data[0].interest_portion_cents", o1_prin: "$.data[0].principal_portion_cents", o2_demand: "$.data[1].recoupment_demand_id", o2_int: "$.data[1].interest_portion_cents", o2_prin: "$.data[1].principal_portion_cents" } }
            - { call: "GET /remittances/${rem}", payload: {}, as: Any, captures: { rem_avail: $.data.available_cents } }
          assert:
            - "o1_demand == ${d1} (issued_at tie broken by created_at ASC: first-created demand allocated first)"
            - "o1_int == 333 (round_half_up(33333 * 100 / 10000 * 1) per demand, NOT the 667/2 raw-sum alternative)"
            - "o2_int == 333 and o1_int + o2_int == 666"
            - "o1_prin == 33333 and o2_prin == 33333"
            - "rem_avail == 32668 (100000 - 2 * 33666)"

      - name: net_exposure_frozen_snapshot_evaluation_order
        grounds:
          - calculations.dollars_at_risk
          - calculations.success_rate
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: NET
          exposure uses the success-rate snapshot FROZEN at the prior-quarter
          boundary, so a FAVORABLE decision in the CURRENT quarter (which would
          push a live rate to 100% and net to 0) leaves the surviving line's net
          at 200000 (default 5000bp), while GROSS drops to 400000 with the line
          overturned.
        test_recipe:
          setup:
            - "Empty-DB payer+issue (no prior-quarter decided appeals -> snapshot DEFAULT_OVERTURN_BP 5000); case with two lines L1, L2 denied 400000 each under the issue"
            - "Exposure read before and after L1's appeal is decided FAVORABLE in the current quarter (2026-08-01, Q3)"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 400000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-2", patient_account_number: "PA-2", service_start_date: "2026-01-04T00:00:00Z", service_end_date: "2026-01-06T00:00:00Z", billed_amount_cents: 400000 }, as: HIMCoordinator, captures: { l2: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 400000, denial_category: "TECHNICAL", issue_code_id: "${ic}" }, { claim_line_id: "${l2}", outcome: "DENIED", denied_amount_cents: 400000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "GET /audit-cases/${c1}/exposure", payload: {}, as: Any, captures: { gross_pre: $.data.gross_dollars_at_risk_cents, net_pre: $.data.net_exposure_cents } }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap1}/decision", payload: { outcome: "FAVORABLE", upheld_cents: 0 }, as: PayerAgent, as_user_id: "${p1}" }
          trigger:
            - { call: "GET /audit-cases/${c1}/exposure", payload: {}, as: Any, captures: { gross_post: $.data.gross_dollars_at_risk_cents, net_post: $.data.net_exposure_cents, snap_post: $.data.snapshot_quarter_start } }
          assert:
            - "gross_pre == 800000 and net_pre == 400000 (2 lines x round_half_up(400000 * 0.5))"
            - "gross_post == 400000 (L1 OVERTURNED, at_risk 0)"
            - "net_post == 200000 (L2 still weighted at the FROZEN default 5000bp; the current-quarter FAVORABLE decision does NOT enter the snapshot)"
            - "snap_post == \"2026-04-01T00:00:00Z\""

  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: recoupment_demand_hold_release_cycle
        grounds:
          - state_machines.RecoupmentDemand.DEMANDED_to_ON_HOLD
          - state_machines.RecoupmentDemand.ON_HOLD_to_DEMANDED
        distinguishing_aspect: |
          RecoupmentDemand cycles DEMANDED -> ON_HOLD -> DEMANDED -> ON_HOLD as
          successive appeal levels are filed and decided (cyclic, not linear);
          the 10-day first hold is banked as accumulated_hold_seconds == 864000.
        test_recipe:
          setup:
            - "Payer hold_levels [LEVEL_1, LEVEL_2]; case with line denied 500000; demand principal 500000 issued at default clock"
            - "L1 appeal filed 2026-08-01, decided UNFAVORABLE 2026-08-11; L2 appeal created and filed 2026-08-11"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: ["LEVEL_1", "LEVEL_2"], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 500000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 500000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 500000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { st_hold1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "POST /appeals/${ap1}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 500000 }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { st_rel1: $.data.status, hold_secs: $.data.accumulated_hold_seconds } }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap2: $.data.id, ap2_level: $.data.level } }
            - { call: "POST /appeals/${ap2}/file", payload: {}, as: AppealsSpecialist }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { st_hold2: $.data.status } }
          assert:
            - "st_hold1 == \"ON_HOLD\" (L1 filed, level in hold_levels)"
            - "st_rel1 == \"DEMANDED\" (hold released by decision; no APPLIED offsets)"
            - "hold_secs == 864000 (10 days banked)"
            - "ap2_level == \"LEVEL_2\""
            - "st_hold2 == \"ON_HOLD\" (cycle repeats at LEVEL_2)"

      - name: cap_effectiveness_cycle_to_failed
        grounds:
          - state_machines.CorrectiveActionPlan.EFFECTIVENESS_CHECK_to_ACTIVE
          - state_machines.CorrectiveActionPlan.EFFECTIVENESS_CHECK_to_FAILED
        distinguishing_aspect: |
          CorrectiveActionPlan loops EFFECTIVENESS_CHECK -> ACTIVE up to
          CAP_MAX_CYCLES - 1 times, then the third mark-ineffective terminates
          FAILED — a cycle with a count-based exit condition.
        test_recipe:
          setup:
            - "CAP (payer P1, issue AUTH) proposed by user co-1 and activated; three begin-check / mark-ineffective rounds"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { payer_id: "${p1}", issue_code_id: "${ic}", title: "Fix auth capture", root_cause: "Auth not captured at scheduling" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { cap: $.data.id } }
            - { call: "POST /corrective-action-plans/${cap}/activate", payload: {}, as: DepartmentDirector }
          trigger:
            - { call: "POST /corrective-action-plans/${cap}/begin-effectiveness-check", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /corrective-action-plans/${cap}/mark-ineffective", payload: {}, as: InternalAuditor, as_user_id: "ia-1", captures: { r1_status: $.data.status, r1_cycles: $.data.cycle_count } }
            - { call: "POST /corrective-action-plans/${cap}/begin-effectiveness-check", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /corrective-action-plans/${cap}/mark-ineffective", payload: {}, as: InternalAuditor, as_user_id: "ia-1", captures: { r2_status: $.data.status, r2_cycles: $.data.cycle_count } }
            - { call: "POST /corrective-action-plans/${cap}/begin-effectiveness-check", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /corrective-action-plans/${cap}/mark-ineffective", payload: {}, as: InternalAuditor, as_user_id: "ia-1", captures: { r3_status: $.data.status, r3_cycles: $.data.cycle_count } }
          assert:
            - "r1_status == \"ACTIVE\" and r1_cycles == 1"
            - "r2_status == \"ACTIVE\" and r2_cycles == 2"
            - "r3_status == \"FAILED\" and r3_cycles == 3 (cycle_count + 1 >= CAP_MAX_CYCLES)"

      - name: evidence_packet_compound_revert_cycle
        grounds:
          - state_machines.EvidencePacket
          - state_machines.PacketItem
          - calculations.packet_readiness
        distinguishing_aspect: |
          EvidencePacket state is a compound function of its PacketItem children
          and cycles READY -> ASSEMBLING -> READY repeatedly as required items
          are added, attached, detached, and waived — a child-driven revert loop
          on the parent, not a pipeline.
        test_recipe:
          setup:
            - "LEVEL_3 appeal reached (L1 and L2 both decided UNFAVORABLE); packet created and mutated through a full readiness cycle"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 300000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 300000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap1}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 300000 }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap2: $.data.id } }
            - { call: "POST /appeals/${ap2}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap2}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 300000 }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap3: $.data.id, ap3_level: $.data.level } }
            - { call: "POST /appeals/${ap3}/evidence-packet", payload: {}, as: AppealsSpecialist, captures: { pkt: $.data.id, pkt_s0: $.data.status } }
          trigger:
            - { call: "POST /evidence-packets/${pkt}/items", payload: { item_type: "MEDICAL_RECORD", required: true }, as: AppealsSpecialist, captures: { it1: $.data.id } }
            - { call: "GET /evidence-packets/${pkt}", payload: {}, as: Any, captures: { s1: $.data.status } }
            - { call: "POST /evidence-packets/${pkt}/items/${it1}/attach", payload: { document_ref: "doc-1" }, as: AppealsSpecialist }
            - { call: "GET /evidence-packets/${pkt}", payload: {}, as: Any, captures: { s2: $.data.status } }
            - { call: "POST /evidence-packets/${pkt}/items/${it1}/detach", payload: {}, as: AppealsSpecialist }
            - { call: "GET /evidence-packets/${pkt}", payload: {}, as: Any, captures: { s3: $.data.status } }
            - { call: "POST /evidence-packets/${pkt}/items/${it1}/attach", payload: { document_ref: "doc-2" }, as: AppealsSpecialist }
            - { call: "POST /evidence-packets/${pkt}/items", payload: { item_type: "PHYSICIAN_LETTER", required: true }, as: AppealsSpecialist, captures: { it2: $.data.id } }
            - { call: "GET /evidence-packets/${pkt}", payload: {}, as: Any, captures: { s4: $.data.status } }
            - { call: "POST /evidence-packets/${pkt}/items/${it2}/waive", payload: {}, as: DepartmentDirector }
            - { call: "GET /evidence-packets/${pkt}", payload: {}, as: Any, captures: { s5: $.data.status } }
            - { call: "POST /evidence-packets/${pkt}/submit", payload: {}, as: AppealsSpecialist, captures: { s6: $.data.status } }
          assert:
            - "ap3_level == \"LEVEL_3\""
            - "pkt_s0 == \"READY\" (empty required set at creation)"
            - "s1 == \"ASSEMBLING\" (required PENDING item added)"
            - "s2 == \"READY\" (attach satisfies)"
            - "s3 == \"ASSEMBLING\" (detach reverts)"
            - "s4 == \"ASSEMBLING\" (second required item PENDING)"
            - "s5 == \"READY\" (waive satisfies)"
            - "s6 == \"SUBMITTED\""

  # ===================================================================
  # Rule 4 — transitive_cascade (different triggers; depths >= 3 and >= 2)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: favorable_decision_full_reversal_cascade
        grounds:
          - state_machines.Appeal.PENDING_DECISION_to_DECIDED_FAVORABLE
          - state_machines.AuditClaimLine.DENIED_to_OVERTURNED
          - state_machines.RecoupmentDemand.PARTIALLY_RECOUPED_to_REVERSED
          - state_machines.OffsetTransaction.APPLIED_to_REVERSED
        distinguishing_aspect: |
          Depth-5 chain triggered by the appeal DECISION: decision overturns the
          claim line (1); the line's overturn drives case.total_denied_active_cents
          to 0 which reverses the recoupment demand (2); the demand reversal
          reverses its APPLIED offset (3); the offset reversal credits the
          remittance and recomputes its status (4); case totals bubble up (5).
          Each link is caused by the previous link, not by the decision directly.
        test_recipe:
          setup:
            - "Case with one line denied 500000; demand 500000 (issued 2026-08-01, no interest at same-day allocation); remittance gross 200000 fully absorbed by one AUTO_WATERFALL offset -> demand PARTIALLY_RECOUPED (outstanding 300000), remittance FULLY_ALLOCATED (available 0); L1 appeal filed (payer hold_levels [] so no hold)"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 500000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 500000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 500000, issued_at: "2026-08-01T00:00:00Z" }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /remittances", payload: { payer_id: "${p1}", gross_amount_cents: 200000 }, as: PayerAgent, as_user_id: "${p1}", captures: { rem: $.data.id } }
            - { call: "POST /remittances/${rem}/allocate", payload: {}, as: PFSAccountant, captures: { "off": "$.data[0].id" } }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist }
          trigger:
            - { call: "POST /appeals/${ap1}/decision", payload: { outcome: "FAVORABLE", upheld_cents: 0 }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "GET /claim-lines/${l1}", payload: {}, as: Any, captures: { l_status: $.data.status, l_denied: $.data.denied_amount_cents } }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { d_status: $.data.status, d_out: $.data.outstanding_principal_cents } }
            - { call: "GET /remittances/${rem}", payload: {}, as: Any, captures: { r_status: $.data.status, r_avail: $.data.available_cents } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c_over: $.data.total_overturned_cents, c_den: $.data.total_denied_active_cents } }
            - { call: "GET /recoupment-demands/${d1}/offset-transactions", payload: {}, as: Any, captures: { off_status: "$.data[0].status" } }
          assert:
            - "l_status == \"OVERTURNED\" and l_denied == 0 (link 1: decision -> line)"
            - "d_status == \"REVERSED\" and d_out == 500000 (link 2: line overturn -> demand reversal, outstanding restored)"
            - "off_status == \"REVERSED\" (link 3: demand reversal -> offset reversal)"
            - "r_avail == 200000 and r_status == \"RECEIVED\" (link 4: offset reversal -> remittance credited)"
            - "c_over == 500000 and c_den == 0 (link 5: case totals bubble up)"

      - name: missed_deadline_auto_denial_cascade
        grounds:
          - state_machines.AuditCase.RECEIVED_to_MISSED_DEADLINE
          - state_machines.AuditClaimLine.UNDER_AUDIT_to_DENIED
          - state_machines.AuditClaimLine.DENIED_to_UNDER_AUDIT
        distinguishing_aspect: |
          Depth-3 chain triggered by the CLOCK (a different trigger than the
          appeal decision): clock advance past records_due_at moves the case to
          MISSED_DEADLINE (1); the case transition auto-denies every UNDER_AUDIT
          line as TECHNICAL (2); each auto-denial recomputes the case totals (3).
          The late records submission then reverses link 2 (lines revert to
          UNDER_AUDIT) while late_submission stays true.
        test_recipe:
          setup:
            - "Case received 2026-08-01 (records due 2026-08-31) with two lines billed 100000 and 200000; no submission before the deadline"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-2", patient_account_number: "PA-2", service_start_date: "2026-01-04T00:00:00Z", service_end_date: "2026-01-06T00:00:00Z", billed_amount_cents: 200000 }, as: HIMCoordinator, captures: { l2: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c_status: $.data.status, c_den: $.data.total_denied_active_cents, c_v: $.data.version } }
            - { call: "GET /claim-lines/${l1}", payload: {}, as: Any, captures: { l1_status: $.data.status, l1_cat: $.data.denial_category, l1_auto: $.data.auto_denied, l1_issue: $.data.issue_code_id, l1_den: $.data.denied_amount_cents } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M-late", expected_audit_case_version: "${c_v}" }, as: HIMCoordinator, captures: { c_late: $.data.late_submission, c_status2: $.data.status } }
            - { call: "GET /claim-lines/${l1}", payload: {}, as: Any, captures: { l1_status2: $.data.status, l1_den2: $.data.denied_amount_cents, l1_auto2: $.data.auto_denied } }
          assert:
            - "c_status == \"MISSED_DEADLINE\" (clock past records_due_at)"
            - "l1_status == \"DENIED\" and l1_cat == \"TECHNICAL\" and l1_auto == true and l1_issue == null and l1_den == 100000 (auto-denial cascade link 2)"
            - "c_den == 300000 (both lines auto-denied; totals bubble up, link 3)"
            - "c_status2 == \"RECORDS_SUBMITTED\" and c_late == true"
            - "l1_status2 == \"UNDER_AUDIT\" and l1_den2 == 0 and l1_auto2 == false (late submission reverts the auto-denial)"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_withdrawn_appeal_file
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_APPEAL_DEADLINE_PASSED]
        distinguishing_aspect: |
          Pair (state, business_temporal): the appeal is WITHDRAWN (state
          violation) AND the logical clock is past filed_deadline_at (temporal
          violation); the state-tier error ERR_INVALID_STATE_TRANSITION wins
          because priority 6 precedes priority 8.
        test_recipe:
          setup:
            - "Determined case, line denied 100000; L1 appeal created (deadline 2026-08-31) and immediately withdrawn; clock advanced to 2026-09-01 (past the deadline; WITHDRAWN is terminal and untouched by any expiry logic)"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /appeals/${ap1}/withdraw", payload: {}, as: AppealsSpecialist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_STATE_TRANSITION\" (state tier 6 beats temporal tier 8; NOT ERR_APPEAL_DEADLINE_PASSED)"

      - name: safety_beats_temporal_on_cap_verify
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_CAP_WINDOW_NOT_ELAPSED]
        distinguishing_aspect: |
          Pair (business_safety, business_temporal): the verifier's X-User-ID
          equals the proposer's (segregation-of-duties violation) AND the 14-day
          effectiveness window has not elapsed (temporal violation); the safety
          error ERR_SEGREGATION_OF_DUTIES wins because priority 7 precedes 8.
        test_recipe:
          setup:
            - "CAP proposed by co-1, activated, effectiveness check begun at 2026-08-01 (window ends 2026-08-15); verify attempted at 2026-08-01 by user co-1"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { payer_id: "${p1}", issue_code_id: "${ic}", title: "Fix auth capture", root_cause: "Auth not captured at scheduling" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { cap: $.data.id } }
            - { call: "POST /corrective-action-plans/${cap}/activate", payload: {}, as: DepartmentDirector }
            - { call: "POST /corrective-action-plans/${cap}/begin-effectiveness-check", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /corrective-action-plans/${cap}/verify", payload: {}, as: InternalAuditor, as_user_id: "co-1", captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_SEGREGATION_OF_DUTIES\" (safety tier 7 beats temporal tier 8; NOT ERR_CAP_WINDOW_NOT_ELAPSED)"

      - name: referential_beats_fiscal_on_manual_offset
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_CROSS_PAYER_ALLOCATION]
          - errors[ERR_OFFSET_EXCEEDS_OUTSTANDING]
        distinguishing_aspect: |
          Pair (business_referential, business_fiscal): the manual offset pairs
          a remittance from payer B with a demand from payer A (referential
          violation) AND the amount 200000 exceeds the demand's outstanding
          100000 (fiscal violation); the referential error
          ERR_CROSS_PAYER_ALLOCATION wins because priority 10 precedes 11.
        test_recipe:
          setup:
            - "Payer A case with line denied 100000 and demand principal 100000; payer B remittance gross 50000"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "PA", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { pa: $.data.id } }
            - { call: "POST /payers", payload: { name: "PB", payer_type: "COMMERCIAL", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { pb: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${pa}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${pa}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${pa}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 100000 }, as: PayerAgent, as_user_id: "${pa}", captures: { d1: $.data.id } }
            - { call: "POST /remittances", payload: { payer_id: "${pb}", gross_amount_cents: 50000 }, as: PayerAgent, as_user_id: "${pb}", captures: { rem_b: $.data.id } }
          trigger:
            - { call: "POST /recoupment-demands/${d1}/offsets", payload: { remittance_id: "${rem_b}", amount_cents: 200000 }, as: PFSAccountant, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_CROSS_PAYER_ALLOCATION\" (referential tier 10 beats fiscal tier 11; NOT ERR_OFFSET_EXCEEDS_OUTSTANDING)"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: records_deadline_inclusive_equality
        grounds:
          - calculations.records_due_at
          - entities.AuditCase.fields.records_due_at
        distinguishing_aspect: |
          Metric = submission timestamp vs records_due_at, endpoint =
          records-submissions: submission at exactly records_due_at (inclusive
          equality) is ON TIME (late_submission false), while one second later
          the case has already auto-transitioned to MISSED_DEADLINE and the same
          call lands as a LATE submission (late_submission true).
        test_recipe:
          setup:
            - "Case A and case B, both received 2026-08-01 with records_submission_days 30 -> records_due_at 2026-08-31T00:00:00Z"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { ca: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { cb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "GET /audit-cases/${ca}", payload: {}, as: Any, captures: { ca_v: $.data.version } }
          trigger:
            - { call: "POST /audit-cases/${ca}/records-submissions", payload: { manifest_ref: "M-A", expected_audit_case_version: "${ca_v}" }, as: HIMCoordinator, captures: { a_status: $.data.status, a_late: $.data.late_submission, a_due: $.data.records_due_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:01Z" }, as: RevenueCycleAdmin }
            - { call: "GET /audit-cases/${cb}", payload: {}, as: Any, captures: { b_status_pre: $.data.status, cb_v: $.data.version } }
            - { call: "POST /audit-cases/${cb}/records-submissions", payload: { manifest_ref: "M-B", expected_audit_case_version: "${cb_v}" }, as: HIMCoordinator, captures: { b_status: $.data.status, b_late: $.data.late_submission } }
          assert:
            - "a_due == \"2026-08-31T00:00:00Z\" (received_at + 30 days)"
            - "a_status == \"RECORDS_SUBMITTED\" and a_late == false (equality is on time)"
            - "b_status_pre == \"MISSED_DEADLINE\" (one second later the sweep fired)"
            - "b_status == \"RECORDS_SUBMITTED\" and b_late == true (late path, sticky flag)"

      - name: demand_zero_outstanding_full_vs_partial
        grounds:
          - state_machines.RecoupmentDemand.DEMANDED_to_FULLY_RECOUPED
          - entities.RecoupmentDemand.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Metric = outstanding_principal_cents hitting exactly 0, endpoint =
          manual offsets: an offset of 49999 against outstanding 50000 leaves 1
          cent (PARTIALLY_RECOUPED), and a follow-up offset of exactly 1 cent
          reaches 0 (FULLY_RECOUPED) — the == 0 boundary flips the state.
        test_recipe:
          setup:
            - "Determined case with line denied 50000; demand principal 50000 issued at the current clock (0 accrued interest); remittance gross 100000"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 50000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 50000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 50000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /remittances", payload: { payer_id: "${p1}", gross_amount_cents: 100000 }, as: PayerAgent, as_user_id: "${p1}", captures: { rem: $.data.id } }
          trigger:
            - { call: "POST /recoupment-demands/${d1}/offsets", payload: { remittance_id: "${rem}", amount_cents: 49999 }, as: PFSAccountant, captures: { o1: $.data.id, o1_prin: $.data.principal_portion_cents } }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { st1: $.data.status, out1: $.data.outstanding_principal_cents } }
            - { call: "POST /recoupment-demands/${d1}/offsets", payload: { remittance_id: "${rem}", amount_cents: 1 }, as: PFSAccountant }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { st2: $.data.status, out2: $.data.outstanding_principal_cents } }
          assert:
            - "o1_prin == 49999 (0 accrued interest at same-clock allocation -> all principal)"
            - "st1 == \"PARTIALLY_RECOUPED\" and out1 == 1"
            - "st2 == \"FULLY_RECOUPED\" and out2 == 0 (exact-zero boundary)"

      - name: packet_empty_required_set_vacuous_ready
        grounds:
          - calculations.packet_readiness
          - state_machines.EvidencePacket
        distinguishing_aspect: |
          Metric = required-item set cardinality, endpoint = evidence-packet
          create/items: an empty required set satisfies readiness vacuously
          (packet born READY), and adding an OPTIONAL (required=false) PENDING
          item leaves it READY because only required items gate.
        test_recipe:
          setup:
            - "LEVEL_3 appeal reached via two UNFAVORABLE levels (same chain as evidence_packet_compound_revert_cycle)"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 300000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 300000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap1}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 300000 }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap2: $.data.id } }
            - { call: "POST /appeals/${ap2}/file", payload: {}, as: AppealsSpecialist }
            - { call: "POST /appeals/${ap2}/decision", payload: { outcome: "UNFAVORABLE", upheld_cents: 300000 }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap3: $.data.id } }
          trigger:
            - { call: "POST /appeals/${ap3}/evidence-packet", payload: {}, as: AppealsSpecialist, captures: { pkt: $.data.id, s0: $.data.status } }
            - { call: "POST /evidence-packets/${pkt}/items", payload: { item_type: "EXPERT_REVIEW", required: false }, as: AppealsSpecialist, captures: { it1: $.data.id, it1_status: $.data.status } }
            - { call: "GET /evidence-packets/${pkt}", payload: {}, as: Any, captures: { s1: $.data.status } }
          assert:
            - "s0 == \"READY\" (empty required set -> vacuous readiness at creation)"
            - "it1_status == \"PENDING\""
            - "s1 == \"READY\" (optional PENDING item does not gate)"

  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: level3_file_gated_by_packet_readiness
        grounds:
          - state_machines.Appeal.DRAFT_to_PENDING_DECISION
          - state_machines.EvidencePacket
          - errors[ERR_EVIDENCE_PACKET_NOT_READY]
        distinguishing_aspect: |
          Pair Appeal -> EvidencePacket: a LEVEL_3 (ALJ / external review)
          appeal cannot leave DRAFT unless its packet exists and is READY or
          SUBMITTED; filing fails while the packet is ASSEMBLING and succeeds
          after the last required item is attached.
        test_recipe:
          setup:
