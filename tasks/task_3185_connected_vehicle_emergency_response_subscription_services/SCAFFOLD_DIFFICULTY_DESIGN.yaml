  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: severity_threshold_34_9_rejected_35_0_accepted
        grounds:
          - calculations.crash_severity
          - calculations.severity_band
          - errors[ERR_CRASH_THRESHOLD_NOT_MET]
        distinguishing_aspect: |
          Numeric threshold precision: severity_score 34.9 (delta_v 58.166,
          no flags) is rejected outright with no row persisted, while exactly
          35.0 (delta_v 58.333..., i.e. 0.6*58.334 = 35.0004 -> 35.0) crosses
          the >= CRASH_SCORE_THRESHOLD boundary — one-tenth of a point decides
          persistence.
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier, zone TX, account A1, vehicle V1, TRIAL subscription."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - *sub_s1
          trigger:
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 58.16, rollover_detected: false, airbag_deployed: false, location_region_code: "TX" }
              as: SystemIngestion
              captures: { err_3: $.data.error_id }
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 58.334, rollover_detected: false, airbag_deployed: false, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_edge: $.data.id }
          assert:
            - "first call error_id == ERR_CRASH_THRESHOLD_NOT_MET (0.6*58.16 = 34.896 -> 34.9 < 35)"
            - "GET /vehicles/${veh_v1}/crash-events then contains exactly 1 row (the rejected report persisted nothing)"
            - "CrashEvent.${ce_edge}.severity_score == 35.0 and severity_band == MODERATE (0.6*58.334 = 35.0004, >= 35 inclusive)"

      - name: emergency_locate_cap_at_exactly_two_in_thirty_day_window
        grounds:
          - calculations.remote_command_cap
          - entities.RemoteCommand.fields.is_emergency_command
          - errors[ERR_REMOTE_COMMAND_CAP_REACHED]
        distinguishing_aspect: |
          Different metric (an integer count, not a severity score) on a
          different endpoint: an EMERGENCY_RETAINED subscription allows exactly
          2 emergency LOCATE commands in the 30-day window from lapse_date —
          command #2 succeeds, command #3 hits the strict < cap boundary and is
          rejected, proving the inclusive upper edge.
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier, zone TX, account A1, vehicle V1. Subscription driven to ACTIVE, PAYMENT_FAILED -> PAST_DUE, clock advanced past lapse into LAPSED, retain-emergency accepted -> EMERGENCY_RETAINED at 2026-10-21."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_e1: $.data.id, sub_e1_v: $.data.version }
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_e1}/convert"
              payload: { expected_subscription_version: "${sub_e1_v}" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_e1}/billing-events"
              payload: { outcome: "PAYMENT_FAILED" }
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_e1}/retain-emergency"
              payload: {}
              as: Account
              as_user_id: "${acct_a1}"
          trigger:
            - call: "POST /vehicles/${veh_v1}/remote-commands"
              payload: { command_type: "LOCATE" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { rc_e1: $.data.id }
            - call: "POST /remote-commands/${rc_e1}/acknowledge"
              payload: {}
              as: SystemIngestion
            - call: "POST /vehicles/${veh_v1}/remote-commands"
              payload: { command_type: "LOCATE" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { rc_e2: $.data.id }
            - call: "POST /remote-commands/${rc_e2}/acknowledge"
              payload: {}
              as: SystemIngestion
            - call: "POST /vehicles/${veh_v1}/remote-commands"
              payload: { command_type: "LOCATE" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_4: $.data.error_id }
          assert:
            - "RemoteCommand.${rc_e1}.is_emergency_command == true and RemoteCommand.${rc_e2}.is_emergency_command == true"
            - "first two LOCATE commands succeed under EMERGENCY_RETAINED (usage reaches exactly 2)"
            - "third LOCATE rejected with ERR_REMOTE_COMMAND_CAP_REACHED (2 < 2 is false — strict less-than boundary)"
            - "a LOCK command in the same window would instead return ERR_EMERGENCY_ONLY_COMMAND (different gate, same subscription)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: crash_event_gated_by_subscription_lifecycle_status
        grounds:
          - state_machines.CrashEvent.transitions
          - state_machines.Subscription
          - calculations.entitlement_snapshot
          - entities.CrashEvent.fields.subscription_id
        distinguishing_aspect: |
          Entity pair CrashEvent -> Subscription: the same crash report is
          accepted (RECEIVED) while the subscription is ACTIVE but lands
          terminal REJECTED_NO_ENTITLEMENT once the subscription is LAPSED
          without a retention decision — CrashEvent creation depends on another
          aggregate's state.
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier, zone TX, account A1, vehicle V1, subscription S1 converted ACTIVE. Second vehicle V7 on account A7 whose subscription lapses fully (clock pushed past retention window, no retain)."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_f1: $.data.id, sub_f1_v: $.data.version }
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_f1}/convert"
              payload: { expected_subscription_version: "${sub_f1_v}" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /accounts"
              payload: { full_name: "Gus Grant", email: "gus@example.com", phone: "+15125550107", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a7: $.data.id }
            - call: "POST /accounts/${acct_a7}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000007", make: "GMC", model: "Sierra", model_year: 2021, region_code: "TX", hardware_generation: 4 }
              as: Account
              as_user_id: "${acct_a7}"
              captures: { veh_v7: $.data.id }
            - call: "POST /accounts/${acct_a7}/subscriptions"
              payload: { vehicle_id: "${veh_v7}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a7}"
              captures: { sub_f2: $.data.id, sub_f2_v: $.data.version }
            - call: "POST /accounts/${acct_a7}/subscriptions/${sub_f2}/convert"
              payload: { expected_subscription_version: "${sub_f2_v}" }
              as: Account
              as_user_id: "${acct_a7}"
            - call: "POST /accounts/${acct_a7}/subscriptions/${sub_f2}/billing-events"
              payload: { outcome: "PAYMENT_FAILED" }
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 60, rollover_detected: false, airbag_deployed: false, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_ok: $.data.id }
            - call: "POST /vehicles/${veh_v7}/crash-events"
              payload: { delta_v_kph: 60, rollover_detected: false, airbag_deployed: false, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_bad: $.data.id }
          assert:
            - "CrashEvent.${ce_ok}.status == RECEIVED (subscription S1 still ACTIVE at 2026-10-15 within its renewed period)"
            - "CrashEvent.${ce_bad}.status == REJECTED_NO_ENTITLEMENT (subscription S2 passed PAST_DUE -> LAPSED at 2026-09-11 -> CANCELLED at 2026-10-11 with no retention decision)"
            - "CrashEvent.${ce_bad}.subscription_id == \"${sub_f2}\" (the rejecting subscription is still pinned on the event)"

      - name: appointment_confirm_gated_by_dealer_status_and_report_state
        grounds:
          - state_machines.ServiceAppointment.REQUESTED_to_CONFIRMED
          - entities.Dealer.fields.status
          - entities.DiagnosticReport.fields.status
        distinguishing_aspect: |
          Different entity pair — ServiceAppointment -> Dealer (and ->
          DiagnosticReport): confirm on an appointment whose dealer is
          SUSPENDED is rejected even though the appointment itself is
          REQUESTED, and a successful confirm flips the linked DiagnosticReport
          GENERATED -> SERVICE_SCHEDULED, proving both directions of the
          cross-entity dependency.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Zone TX. Dealer D1 ACTIVE capacity 2, dealer D2 SUSPENDED. Account A1, vehicle V1 with diagnostic report R1 (GENERATED). Appointment AP1 on D1 for 2026-09-10; appointment AP2 on D2 for the same date."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - *sub_s1
            - call: "POST /dealers"
              payload: { name: "Capitol Chevrolet", region_code: "TX", service_capacity_per_day: 2 }
              as: PlatformAdmin
