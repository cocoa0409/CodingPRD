            - "ShowSegment.${seg2}.reset_gap_minutes == 0, start_offset_minutes == 30, end_offset_minutes == 50 (an exact touch across the half-open boundary is legal here, unlike venue occupancy)"
            - "ShowSegment.${seg3}.reset_gap_minutes == 0, start_offset_minutes == 50, end_offset_minutes == 80 (the preceding segment is INTERMISSION, so no floor reset)"
            - "ShowSegment.${seg4}.reset_gap_minutes == 8, start_offset_minutes == 88, end_offset_minutes == 128"
            - "at the boundary: ShowSegment.${seg5}.reset_gap_minutes == 8, start_offset_minutes == 136, end_offset_minutes == 150 and TourStop.${stop_atl}.run_order_end_offset_minutes == 150 == show_window_minutes, admitted with HTTP 201"
            - "one minute past the boundary: trigger call 6 returns HTTP 409 with ${err_window} == ERR_SHOW_WINDOW_EXCEEDED (its reset gap alone would start it at 158 and end it at 159)"
            - "after the rejection: TourStop.${stop_atl}.run_order_end_offset_minutes is still 150 and competition_segment_count == 4, and GET /tour-stops/${stop_atl}/show-segments returns exactly 5 rows"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: opening_sales_reads_the_safety_plan_state_of_a_different_aggregate
        grounds:
          - validations[order=15]
          - state_machines.SafetyPlan.SUBMITTED_to_CERTIFIED
          - state_machines.TourStop.SALES_PENDING_to_ON_SALE
          - calculations.stop_readiness_posture
          - errors.ERR_SAFETY_NOT_CERTIFIED
        distinguishing_aspect: |
          Entity pair TourStop x SafetyPlan. The transition being requested belongs to the TourStop
          sales dimension, but its admissibility is decided entirely by the state of a sibling
          aggregate the request never names. Everything the sales dimension itself needs is already in
          place (a COMPETITION segment, a tier, committed marketing, show timing), so the rejection can
          only come from reading across into the SafetyPlan; certifying that plan — with no further
          write to the stop — flips the identical request to success.
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking and its TourStop with show timing, one COMPETITION segment and one tier"
            - "RADIO marketing 500000 COMMITTED so the marketing term of readiness_posture is satisfied"
            - "A SafetyPlan authored and SUBMITTED but deliberately NOT certified, so TourStop.safety_state == SAFETY_REVIEW"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
