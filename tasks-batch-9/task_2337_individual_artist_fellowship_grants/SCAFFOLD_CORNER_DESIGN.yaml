            - *t_seat2
            - *t_seat3
            - *t_charter
            - *t_round
            - *t_revA1
            - *t_srevA1
            - *t_revA2
            - *t_srevA2
            - *t_revA3
            - *t_srevA3
            - *t_revB1
            - *t_srevB1
            - *t_revB2
            - *t_srevB2
            - *t_revB3
            - *t_srevB3
            - *t_closeround
            - *t_boardrev
            - *t_getpan
          trigger:
