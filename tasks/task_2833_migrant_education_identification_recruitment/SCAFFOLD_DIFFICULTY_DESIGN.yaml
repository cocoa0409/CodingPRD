# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Cross-reference of SCAFFOLD.yaml sections 1.1-1.7 against the nine
# Difficulty Rules. Nine rule_id blocks, 21 instances total.
# Every numeric literal in an `assert:` line below was produced by executing
# the corresponding `calculations[].formula` with its declared `constants:`.
# The logical clock starts at 2026-08-01T00:00:00Z on every server start; any
# instance that depends on another instant sets it explicitly.
# ===========================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: coe_window_provisional_move_anchored_vs_final_residency_anchored
        grounds:
          - calculations.coe_eligibility_window
          - state_machines.CertificateOfEligibility.DRAFT_to_SUBMITTED
          - state_machines.CertificateOfEligibility.SUBMITTED_to_APPROVED
          - entities.CertificateOfEligibility.fields.provisional_eligibility_end_on
          - entities.CertificateOfEligibility.fields.eligibility_end_on
          - entities.CertificateOfEligibility.fields.age_out_capped
        distinguishing_aspect: |
          Both variants of coe_eligibility_window run on the same certificate row in the
          CertificateOfEligibility domain: the provisional variant anchors on
          QualifyingMove.move_date 2026-06-15 and writes 2029-06-14 at submit, while the final
          variant anchors on residency_date 2026-07-01 and writes 2029-06-30 at approval, so the
          two persisted window fields differ by exactly 16 days on one and the same row.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea in WA and one ACTIVE Recruiter"
            - "one ENROLLED Student born 2010-03-20 (so the age-out cap falls in 2032 and cannot bind)"
            - "one VERIFIED QualifyingMove with move_date 2026-06-15 and a supporting INITIAL interview"
            - "one DRAFT CertificateOfEligibility on that move with residency_date 2026-07-01 and qc_hold_exempt true"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 9, school_days_interrupted: 10, math_below_grade: true, reading_below_grade: true, credit_deficit: 2 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "PARENT", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Parent confirms apple harvest work in Yakima Valley beginning 2026-06-16.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_id: $.data.id }
          trigger:
            - call: "POST /mep/coes/${coe_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { prov_after_submit: $.data.provisional_eligibility_end_on, end_after_submit: $.data.eligibility_end_on }
            - call: "POST /mep/coes/${coe_id}/approve"
              payload: {}
              as: StateProgramAdmin
              captures: { prov_after_approve: $.data.provisional_eligibility_end_on, end_after_approve: $.data.eligibility_end_on }
          assert:
            - "after submit: CertificateOfEligibility.${coe_id}.status == SUBMITTED"
            - "after submit: CertificateOfEligibility.${coe_id}.provisional_eligibility_end_on == 2029-06-14"
            - "after submit: CertificateOfEligibility.${coe_id}.eligibility_start_on is null"
            - "after submit: CertificateOfEligibility.${coe_id}.eligibility_end_on is null"
            - "after submit: CertificateOfEligibility.${coe_id}.age_out_capped is null"
            - "after approve: CertificateOfEligibility.${coe_id}.status == APPROVED"
            - "after approve: CertificateOfEligibility.${coe_id}.eligibility_start_on == 2026-07-01"
            - "after approve: CertificateOfEligibility.${coe_id}.eligibility_end_on == 2029-06-30"
            - "after approve: CertificateOfEligibility.${coe_id}.age_out_capped == false"
            - "after approve: CertificateOfEligibility.${coe_id}.provisional_eligibility_end_on == 2029-06-14 (the provisional value is NOT overwritten by the final variant)"
            - "CertificateOfEligibility.${coe_id}.eligibility_end_on != CertificateOfEligibility.${coe_id}.provisional_eligibility_end_on"

      - name: pfs_score_diverges_between_interruption_weighted_and_osy_pathway
        grounds:
          - calculations.pfs_priority_score
          - entities.Student.fields.schooling_status
          - entities.Student.fields.pfs_variant
          - entities.Student.fields.pfs_score
          - entities.Student.fields.pfs_flag
          - endpoints[GET /mep/students/{student_id}/pfs-assessment]
        distinguishing_aspect: |
          The two pfs_priority_score variants act on the Student domain - a different entity
          domain from the CertificateOfEligibility instance above - and on one unchanged set of
          academic inputs (10 interrupted days, both placement flags true, credit_deficit 2, one
          verified move, no HS credential): INTERRUPTION_WEIGHTED scores exactly 60 with
          pfs_flag true and floor_applied false, while OSY_PATHWAY scores 55 with pfs_flag false
          and floor_applied true because it discards the placement flags and credit_deficit and
          clamps up to OSY_SCORE_FLOOR.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea and one ACTIVE Recruiter"
            - "one ENROLLED Student with school_days_interrupted 10, math_below_grade true, reading_below_grade true, credit_deficit 2, has_hs_credential false, primary_language_not_english false"
            - "exactly one VERIFIED QualifyingMove with move_date 2026-06-15, inside the inclusive 365-day recency window ending on the clock date"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Skagit Delta", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Ana Delgado", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Luz Ibarra", birth_date: "2009-04-12", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 10, school_days_interrupted: 10, math_below_grade: true, reading_below_grade: true, credit_deficit: 2, has_hs_credential: false, primary_language_not_english: false }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "OR", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 310.00 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
          trigger:
            - call: "GET /mep/students/${stu_id}/pfs-assessment"
              payload: {}
              as: ServiceCoordinator
              captures: { score_enrolled: $.data.pfs_score, variant_enrolled: $.data.pfs_variant }
            - call: "PATCH /mep/students/${stu_id}"
              payload: { schooling_status: "OUT_OF_SCHOOL", grade_level: null }
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "GET /mep/students/${stu_id}/pfs-assessment"
              payload: {}
              as: ServiceCoordinator
              captures: { score_osy: $.data.pfs_score, variant_osy: $.data.pfs_variant }
          assert:
            - "first pfs-assessment: pfs_variant == INTERRUPTION_WEIGHTED"
            - "first pfs-assessment: move_band_points == 18, interruption_points == 8, academic_points == 28, credit_points == 6, credential_points == 0, language_points == 0"
            - "first pfs-assessment: raw_score == 60, pfs_score == 60, pfs_flag == true, floor_applied == false"
            - "second pfs-assessment: pfs_variant == OSY_PATHWAY"
            - "second pfs-assessment: move_band_points == 18, interruption_points == 12, credential_points == 20, language_points == 0, academic_points == 0, credit_points == 0"
            - "second pfs-assessment: raw_score == 50, pfs_score == 55, pfs_flag == false, floor_applied == true"
            - "Student.${stu_id}.pfs_score == 55 and Student.${stu_id}.pfs_flag == false after the PATCH persisted the OSY_PATHWAY result"
            - "the stored academic inputs are unchanged: Student.${stu_id}.math_below_grade == true, reading_below_grade == true, credit_deficit == 2"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: allocation_rounds_per_plan_before_summing_and_lands_residual_on_earliest_plan
        grounds:
          - calculations.service_hours_allocation
          - entities.ServicePlan.fields.allocated_hours
          - entities.ServicePlan.fields.expected_service_hours
          - entities.ServicePlan.fields.priority_tier
          - concurrency_rules[plan-create-stale-student]
        distinguishing_aspect: |
          service_hours_allocation is combinatorial through PINNED MULTI-STEP ROUNDING ORDER:
          each plan's raw share of the 75.00 NON_PFS budget is rounded to 2 decimals with
          round_half_up FIRST (28.13 / 18.75 / 28.13 = 75.01), and only then is the -0.01
          residual applied to the earliest-created plan, producing 28.12 / 18.75 / 28.13.
          Summing before rounding, or spreading the residual over all plans, gives a different
          distribution.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea and one ACTIVE Recruiter"
            - "one OUT_OF_SCHOOL Student with has_hs_credential true, school_days_interrupted 0 and no qualifying moves, so OSY_PATHWAY scores raw 0, clamps to the 55 floor and leaves pfs_flag false (NON_PFS budget 75.00)"
            - "three DRAFT ServicePlans for that student created in this order: SUMMER_PROGRAM (weight 3), CREDIT_ACCRUAL (weight 2), OSY_ALTERNATIVE (weight 3), so W == 8"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Columbia Basin", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Beto Cruz", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Sara Nieto", birth_date: "2007-02-08", current_state_code: "WA", area_id: "${area_id}", schooling_status: "OUT_OF_SCHOOL", school_days_interrupted: 0, math_below_grade: false, reading_below_grade: false, credit_deficit: 0, has_hs_credential: true, primary_language_not_english: false }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v1: $.data.version }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUMMER_PROGRAM", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v1}" }
              as: ServiceCoordinator
              captures: { plan_summer_id: $.data.id }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v2: $.data.version }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "CREDIT_ACCRUAL", delivery_mode: "VIRTUAL", expected_student_version: "${stu_v2}" }
              as: ServiceCoordinator
              captures: { plan_credit_id: $.data.id }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v3: $.data.version }
          trigger:
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "OSY_ALTERNATIVE", delivery_mode: "WORKSITE", expected_student_version: "${stu_v3}" }
              as: ServiceCoordinator
              captures: { plan_osy_id: $.data.id, osy_alloc: $.data.allocated_hours }
          assert:
            - "Student.${stu_id}.pfs_score == 55 and Student.${stu_id}.pfs_flag == false"
            - "ServicePlan.${plan_summer_id}.allocated_hours == 28.12"
            - "ServicePlan.${plan_credit_id}.allocated_hours == 18.75"
            - "ServicePlan.${plan_osy_id}.allocated_hours == 28.13"
            - "ServicePlan.${plan_summer_id}.allocated_hours + ServicePlan.${plan_credit_id}.allocated_hours + ServicePlan.${plan_osy_id}.allocated_hours == 75.00"
            - "ServicePlan.${plan_summer_id}.expected_service_hours == 28.12 and ServicePlan.${plan_osy_id}.expected_service_hours == 28.13"
            - "ServicePlan.${plan_summer_id}.priority_tier == NON_PFS and ServicePlan.${plan_credit_id}.priority_tier == NON_PFS and ServicePlan.${plan_osy_id}.priority_tier == NON_PFS"
            - "all three plans are still ServicePlan.status == DRAFT"
            - "the earliest-created plan absorbed the whole -0.01 residual: ServicePlan.${plan_summer_id}.allocated_hours == 28.12 while the other two keep their unadjusted rounded shares 18.75 and 28.13"

      - name: transfer_cap_tier_keyed_on_pre_cap_total_not_re_derived_from_final_total
        grounds:
          - calculations.transfer_credit_reconciliation
          - state_machines.RecordTransferRequest.RECEIVED_to_RECONCILED
          - entities.RecordTransferRequest.fields.applied_transferred_credits
          - entities.Student.fields.locally_accrued_credits
          - entities.Student.fields.transferred_credits_count
          - entities.Student.fields.total_awarded_credits
        distinguishing_aspect: |
          transfer_credit_reconciliation is combinatorial through a PINNED EVALUATION ORDER over
          a circular dependency: the cap tier is keyed on the PRE-CAP total 6.00 + 14.00 = 20.00
          (tier 2, 0.35), giving capped 7.00 and total 13.00 - whereas re-deriving the tier from
          the post-cap total 13.00 yields capped 4.55 and total 10.55. This is a different
          combinatorial mechanism from the rounding-order instance above, which has no circular
          dependency at all.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "Student A fully certified: VERIFIED move, supporting INITIAL interview, APPROVED certificate, so eligibility_status is ELIGIBLE"
            - "Student A has an ACTIVE CREDIT_ACCRUAL ServicePlan carrying three delivered sessions of 2.00 credits each, so locally_accrued_credits == 6.00"
            - "Student B exists in the same area as the out-of-state predecessor record to match against"
            - "one RecordTransferRequest for Student A in status RECEIVED with reported_prior_credits 14.00, matched to Student B"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Wenatchee Slope", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Nora Vega", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Ivan Solis", birth_date: "2008-05-05", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 11, school_days_interrupted: 0, math_below_grade: false, reading_below_grade: false, credit_deficit: 0 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Ivan Solis (CA record)", birth_date: "2008-05-05", current_state_code: "CA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 11 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_b_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_a_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 905.25 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_a_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "PARENT", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Parent confirms cherry harvest work near Wenatchee.", corroboration_count: 2 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_a_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_id: $.data.id }
            - call: "POST /mep/coes/${coe_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/coes/${coe_id}/approve"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/students/${stu_a_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_a_v: $.data.version }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_a_id}", plan_type: "CREDIT_ACCRUAL", delivery_mode: "VIRTUAL", expected_student_version: "${stu_a_v}" }
              as: ServiceCoordinator
              captures: { plan_credit_id: $.data.id }
            - call: "POST /mep/service-plans/${plan_credit_id}/activate"
              payload: {}
              as: ServiceCoordinator
            - call: "POST /mep/service-deliveries"
              payload: { plan_id: "${plan_credit_id}", delivered_on: "2026-07-10", hours: 2.00, service_category: "CREDIT_ACCRUAL_SESSION", credits_awarded: 2.00 }
              as: ServiceCoordinator
              captures: { del_1_id: $.data.id }
            - call: "POST /mep/service-deliveries"
              payload: { plan_id: "${plan_credit_id}", delivered_on: "2026-07-17", hours: 2.00, service_category: "CREDIT_ACCRUAL_SESSION", credits_awarded: 2.00 }
              as: ServiceCoordinator
              captures: { del_2_id: $.data.id }
            - call: "POST /mep/service-deliveries"
              payload: { plan_id: "${plan_credit_id}", delivered_on: "2026-07-24", hours: 2.00, service_category: "CREDIT_ACCRUAL_SESSION", credits_awarded: 2.00 }
              as: ServiceCoordinator
              captures: { del_3_id: $.data.id }
            - call: "POST /mep/transfer-requests"
              payload: { student_id: "${stu_a_id}", requesting_state_code: "WA", holding_state_code: "CA", exchange_reference: "NX-2833-0001", reported_prior_credits: 14.00 }
              as: ExchangeLiaison
              captures: { req_id: $.data.id }
            - call: "POST /mep/transfer-requests/${req_id}/match"
              payload: { matched_prior_student_id: "${stu_b_id}" }
              as: ExchangeLiaison
            - call: "POST /mep/transfer-requests/${req_id}/receive"
              payload: {}
              as: ExchangeLiaison
          trigger:
            - call: "POST /mep/transfer-requests/${req_id}/reconcile"
              payload: {}
              as: ExchangeLiaison
              captures: { applied: $.data.applied_transferred_credits, req_status: $.data.status }
          assert:
            - "RecordTransferRequest.${req_id}.status == RECONCILED"
            - "RecordTransferRequest.${req_id}.applied_transferred_credits == 7.00"
            - "Student.${stu_a_id}.locally_accrued_credits == 6.00"
            - "Student.${stu_a_id}.transferred_credits_count == 7.00"
            - "Student.${stu_a_id}.total_awarded_credits == 13.00"
            - "RecordTransferRequest.${req_id}.applied_transferred_credits != 4.55 - 4.55 is what a re-derivation of the cap tier from the post-cap total 13.00 would produce and is the wrong answer"
            - "Student.${stu_a_id}.total_service_hours_ledger == 6.00 (three 2.00-hour sessions), unchanged by reconciliation"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: coe_cycles_back_to_draft_after_failed_qc_and_can_be_resubmitted
        grounds:
          - state_machines.CertificateOfEligibility.QC_SELECTED_to_RETURNED_FOR_CORRECTION
          - state_machines.CertificateOfEligibility.RETURNED_FOR_CORRECTION_to_DRAFT
          - state_machines.CertificateOfEligibility.DRAFT_to_SUBMITTED
          - entities.CertificateOfEligibility.fields.correction_round_count
          - calculations.qc_sample_selection
        distinguishing_aspect: |
          CertificateOfEligibility is non-linear by CYCLE: DRAFT -> SUBMITTED -> QC_SELECTED ->
          RETURNED_FOR_CORRECTION -> DRAFT -> SUBMITTED returns the row to a state it already
          occupied while correction_round_count records that the loop ran exactly once, and the
          same certificate re-enters the QC candidate pool afterwards.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, recruiter A (BASIC) as the certificate initiator and recruiter B (QC_CERTIFIED) as the reviewer"
            - "one ENROLLED Student with a VERIFIED move and a supporting INITIAL interview"
            - "one certificate submitted with qc_hold_exempt false, then drawn into the QC sample by a selection run, so it is QC_SELECTED with one OPEN review"
            - "one QC_REINTERVIEW InterviewRecord filed by recruiter B against that certificate"
          setup_api_calls:
            - call: "POST /mep/areas"
