              captures: { tank_v_now: $.data.version }
          trigger:
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/store"
              payload: { expected_tank_version: "${tank_v_now}" }
              as: Embryologist
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TANK_OFFLINE"
            - "CryoSpecimen.${sp_id}.status == PENDING"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: monitoring_room_halfopen_aggregate_capacity_conflict
        grounds:
          - validations[priority=14]
          - entities.MonitoringAppointment.fields.start_utc
          - entities.MonitoringAppointment.fields.end_utc
          - entities.MonitoringAppointment.fields.room_capacity_weight
          - entities.Clinic.fields.room_concurrency_limit
        distinguishing_aspect: |
          Half-open [start,end) AGGREGATE-CAPACITY interval semantics on the clinic monitoring-room
          resource: with room_concurrency_limit 2, two existing weight-1 CONFIRMED appointments overlap a
          third weight-1 appointment at the same instant, pushing aggregate to 3 > 2 -> ERR_MONITORING_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "Clinic room_concurrency_limit 2, clock 2026-06-01. Two CONFIRMED weight-1 appointments overlapping [09:00,10:00)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Room Clinic", room_concurrency_limit: 2 }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Ola D", date_of_birth: "1990-03-17T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/monitoring-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", appointment_type: "BLOODWORK", start_utc: "2026-06-05T09:00:00.000Z", end_utc: "2026-06-05T10:00:00.000Z", room_capacity_weight: 1 }
              as: Nurse
              captures: { a1: $.data.id }
            - call: "POST /clinics/${clinic_id}/monitoring-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", appointment_type: "ULTRASOUND", start_utc: "2026-06-05T09:30:00.000Z", end_utc: "2026-06-05T10:30:00.000Z", room_capacity_weight: 1 }
              as: Nurse
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/monitoring-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", appointment_type: "CONSULT", start_utc: "2026-06-05T09:45:00.000Z", end_utc: "2026-06-05T10:15:00.000Z", room_capacity_weight: 1 }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MONITORING_SLOT_CONFLICT"
            - "response.http_status == 409"

      - name: medication_closed_dayoffset_overlap_conflict
        grounds:
          - validations[priority=14.5]
          - entities.MedicationOrder.fields.start_day_offset
          - entities.MedicationOrder.fields.end_day_offset
          - entities.MedicationOrder.fields.drug_name
        distinguishing_aspect: |
          CLOSED inclusive integer-day, SINGLE-occupancy (no aggregate capacity) interval semantics on
          the MedicationOrder calendar resource — distinct arithmetic from the appointment's half-open
          aggregate-capacity rule. A same-drug order [3,6] overlaps an existing [0,4] (share days 3-4) ->
          ERR_MEDICATION_SCHEDULE_OVERLAP, while an adjacent [5,7] would NOT overlap [0,4].
        test_recipe:
          setup:
            - "A STIM cycle with one SCHEDULED Gonal-F order over closed days [0,4]."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Med Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat E", date_of_birth: "1990-04-18T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Gonal-F", start_day_offset: 0, end_day_offset: 4, daily_dose_units: 300, unit_price_cents: 100 }
              as: Nurse
              captures: { med1: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Gonal-F", start_day_offset: 3, end_day_offset: 6, daily_dose_units: 150, unit_price_cents: 100 }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEDICATION_SCHEDULE_OVERLAP"
            - "response.http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tank_slot_conservation_store_then_thaw
        grounds:
          - state_machines.CryoSpecimen.PENDING_to_STORED
          - state_machines.CryoSpecimen.STORED_to_THAWED
          - entities.CryoTank.fields.reserved_slots
        distinguishing_aspect: |
          Conserved quantity = CryoTank slot count. Forward action store(+1) paired with compensating
          thaw(-1) MUST leave reserved_slots unchanged: reserved_slots == count(STORED specimens for tank).
          Starting from 0, after store then thaw, reserved_slots == 0 again with zero drift.
        test_recipe:
          setup:
            - "A FERTILIZATION cycle with one PENDING specimen and a capacity-3 tank at reserved_slots 0."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Slot Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Qi F", date_of_birth: "1990-05-19T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/tanks"
              payload: { label: "Tank-S", capacity_slots: 3 }
              as: Embryologist
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 5 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 2 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/store"
              payload: { expected_tank_version: "${tank_v0}" }
              as: Embryologist
          trigger:
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/thaw"
              payload: {}
              as: Embryologist
          assert:
            - "CryoSpecimen.${sp_id}.status == THAWED"
            - "CryoTank.${tank_id}.reserved_slots == 0"
            - "CryoTank.${tank_id}.committed_free_slots == 3"

      - name: billing_money_conservation_at_settlement
        grounds:
          - calculations.cycle_cost_settlement
          - entities.TreatmentCycle.fields.gross_charge_cents
          - entities.TreatmentCycle.fields.insurer_paid_cents
          - entities.TreatmentCycle.fields.final_patient_owed_cents
          - state_machines.TreatmentCycle.ESTIMATED_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity = money (a different conserved quantity from tank slots). At settlement the
          identity gross_charge_cents == insurer_paid_cents + final_patient_owed_cents MUST hold exactly:
          for the pinned cycle gross 710000 == insurer 520000 + patient 190000.
        test_recipe:
          setup:
            - "Same package/meds/specimen setup as the dual-variant settle case: gross 710000, insurer 520000, patient 190000."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Money Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/packages"
              payload: { name: "Cons IVF", base_price_cents: 500000, coverage_pct: 0.8, stim_med_covered: true, cryo_storage_covered: false, annual_cryo_storage_cents: 60000, lifetime_coverage_cap_cents: 100000000 }
              as: ClinicAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Ravi G", date_of_birth: "1990-06-20T00:00:00.000Z", insurance_package_id: "${pkg_id}" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL", "TRANSFER"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/tanks"
              payload: { label: "Tank-Y", capacity_slots: 5 }
              as: Embryologist
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Gonal-F", start_day_offset: 0, end_day_offset: 4, daily_dose_units: 300, unit_price_cents: 100 }
              as: Nurse
              captures: { medA_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/medications/${medA_id}/administer"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 10 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 6 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/store"
              payload: { expected_tank_version: "${tank_v0}" }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/accrue-storage-year"
              payload: {}
              as: BillingSpecialist
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/transfer"
              payload: {}
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/outcome-reports"
              payload: { treatment_cycle_id: "${cyc_id}", pregnancy_test_result: "POSITIVE", clinical_pregnancy: true, live_birth: true }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/billing/estimate"
              payload: {}
              as: BillingSpecialist
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/complete"
              payload: {}
              as: Nurse
            - call: "GET /clinics/${clinic_id}/cycles/${cyc_id}"
              payload: {}
              as: BillingSpecialist
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/billing/settle"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: BillingSpecialist
              captures: { gross: $.data.gross_charge_cents, insurer: $.data.insurer_paid_cents, patient: $.data.final_patient_owed_cents }
          assert:
            - "TreatmentCycle.${cyc_id}.gross_charge_cents == 710000"
            - "TreatmentCycle.${cyc_id}.insurer_paid_cents == 520000"
            - "TreatmentCycle.${cyc_id}.final_patient_owed_cents == 190000"
            - "TreatmentCycle.${cyc_id}.gross_charge_cents == TreatmentCycle.${cyc_id}.insurer_paid_cents + TreatmentCycle.${cyc_id}.final_patient_owed_cents"
