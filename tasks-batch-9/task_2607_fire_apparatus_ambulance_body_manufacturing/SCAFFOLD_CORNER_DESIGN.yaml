        excluded_because:
          difficulty_instance: non_linear_state_machine / certification_retest_cycle_leaves_build_dimension_frozen
          rationale: "A third test submission while the unit is already CERTIFIED raises this error there."

  - section: rbac
    instances:

      - name: each_role_is_rejected_from_other_roles_exclusive_operations
        claim_type: Role exclusivity
        grounds:
          - rbac.ProgramAdmin
          - rbac.PurchasingOfficer
          - rbac.BodyEngineer
          - rbac.ThirdPartyTester
          - rbac.CustomerCommitteeRep
          - validations[priority=2]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The role gate is checked before any id resolves, so five cross-role attempts
          — three of them against deliberately fabricated ids — all return 403
          ERR_ROLE_NOT_PERMITTED rather than 404, and the same operations succeed for
          their owners.
        test_recipe:
          setup:
            - "one DRAFT program with a DRAFT specification carrying two clauses and one PENDING ComplianceMatrixEntry"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Matrix program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Matrix spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C2", category: "AERIAL", requirement_text: "105 ft rear mount aerial", mandatory: false, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c2_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "EXCEPTION", exception_text: "Two stage pump offered" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Admin authored spec" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_admin_spec: $.data.error_id }
            - call: "POST /programs"
              payload: { name: "Officer opened program", agency_name: "County Fire Authority", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { e_po_program: $.data.error_id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c2_id}", response: "COMPLY" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { e_po_entry: $.data.error_id }
            - call: "POST /compliance-entries/${entry_id}/dispose"
              payload: { disposition: "ACCEPTED" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { e_eng_dispose: $.data.error_id }
            - call: "POST /unit-orders/00000000-0000-4000-8000-000000000000/start-production"
              as: ThirdPartyTester
              as_user_id: "tester-1"
              captures: { e_tester_start: $.data.error_id }
            - call: "POST /certification-tests"
              payload: { unit_order_id: "00000000-0000-4000-8000-000000000000", test_standard: "NFPA_1901" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { e_eng_test: $.data.error_id }
            - call: "POST /change-orders/00000000-0000-4000-8000-000000000000/approve"
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { e_rep_approve: $.data.error_id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c2_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { entry2_id: $.data.id }
            - call: "POST /compliance-entries/${entry_id}/dispose"
              payload: { disposition: "ACCEPTED" }
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Ladder Works Aerial Devices", component_type: "AERIAL_DEVICE", total_slot_count: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id }
          assert:
            - "${e_admin_spec}, ${e_po_program}, ${e_po_entry} and ${e_eng_dispose} are all ERR_ROLE_NOT_PERMITTED with HTTP 403 — authoring specs, opening programs, writing compliance entries and disposing them are single-role operations"
            - "${e_tester_start}, ${e_eng_test} and ${e_rep_approve} are ERR_ROLE_NOT_PERMITTED with HTTP 403 even though every path id is a fabricated UUID — priority 2 precedes priority 4"
            - "the rightful calls succeed: BodyEngineer's entry is 201 (${entry2_id}), PurchasingOfficer's dispose is 200 with ComplianceMatrixEntry.${entry_id}.disposition == \"ACCEPTED\", and ProgramAdmin's slot line is 201 (${line_id})"
            - "BidSpecification.${spec_id}.clause_count == 2 and status is still \"DRAFT\" — no rejected call mutated anything"
            - "GET /specifications?program_id=${prog_id} returns total_count == 1 and GET /programs returns total_count == 1"

      - name: segregation_of_duties_blocks_self_release_and_self_signed_certification
        claim_type: Segregation of duties
        grounds:
          - validations[priority=33]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.BidSpecification.fields.authored_by_user_id
          - entities.UnitOrder.fields.weight_calc_engineer_user_id
        distinguishing_aspect: |
          Both segregation rules compare recorded user ids, not roles: the authoring
          PurchasingOfficer cannot release their own specification (403) though a peer
          officer can, and a certification result cannot be signed by the engineer
          named as the unit's weight_calc_engineer_user_id though any other engineer
          may sign.
        test_recipe:
          setup:
            - "one specification authored by po-author, UNDER_REVIEW with a COMPLY entry"
