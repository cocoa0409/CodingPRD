              as: EditorialStaff
              captures: { err_ig: $.data.error_id }
          assert:
            - "${err_ig} == ERR_NOT_FOUND"
            - "the returned http status is 404"

      - name: licensees_cannot_read_licence_list_scope
        claim_type: scoped_operation
        grounds:
          - roles.Licensee
          - endpoints.GET /cpt/licensing-agreements/{id}
          - entities.LicensingAgreement.fields.licensee_name
        distinguishing_aspect: |
          A Licensee may read its own licence by id through the shared operation
          while the same role is denied the licensing officer's create
          operation.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method and one ACTIVE provider licence"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-HAWAII", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_sc: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Hawaii Clinic", vendor_worldwide: false, expected_users: 6, sales_unit_count: 5, base_fee_cents: 0, territory_id: "${ter_sc}" }
              as: LicensingOfficer
              captures: { lic_sc: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "GET /cpt/licensing-agreements/${lic_sc}"
              payload: {}
              as: Licensee
              as_user_id: "${lic_sc}"
              captures: { lic_sc_read: $.data.id }
          assert:
            - "LicensingAgreement.${lic_sc}.licensee_name == Hawaii Clinic"
