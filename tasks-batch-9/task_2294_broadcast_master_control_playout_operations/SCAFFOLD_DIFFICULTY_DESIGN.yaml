      - name: encoder_peak_equal_to_total_accepted_one_unit_over_rejected
        grounds:
          - calculations.live_encoder_concurrency_peak
          - validations[priority=39]
          - errors[ERR_ENCODER_CAPACITY_EXCEEDED]
          - entities.Multiplex.fields.live_encoder_units_total
          - entities.Multiplex.fields.live_encoder_units_peak
        distinguishing_aspect: |
          Metric: integer ENCODER UNITS of simultaneous occupancy across the whole
          multiplex, reached through a different endpoint than the commercial
          seconds instance. Two 2-unit windows that touch exactly at 12:10:00Z are
          both accepted because the half-open [join_utc, breakaway_utc) sweep is
          ordered (timestamp ASC, delta ASC) so the release is applied before the
          claim and the peak equals total 2; adding a single third unit inside
          12:12:00Z-12:18:00Z pushes the peak to 3 and is refused — equality is
          legal, total + 1 is not.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A with total_capacity_kbps 20000, pilot_reserved_kbps 500 and live_encoder_units_total 2 (effective_capacity_kbps 19500)."
            - "Two ACTIVE SD_480I channels on MUX-A: 12.1 (rank 1, floor 2000, requested 6000, allocated 6000) and 12.2 (rank 2, floor 3000, requested 6000, allocated 6000); assigned_kbps 12000, available_kbps 7500."
            - "One QC_PASSED asset A (expected 1740 s, score 100) shared by both playlists."
            - "Each channel has an ARMED playlist for 2026-08-01 (schedule_start_utc 12:00:00Z, window 1800 s) whose seq 1 is PROGRAM A 1740 s and whose seq 2 is a NETWORK_JOIN of 60 s at 12:29:00Z, so anchor_sequence_number 2 resolves on both channels."
            - "NetworkFeedWindow W1 on channel 12.1: join 12:00:00Z, breakaway 12:10:00Z, guard 2, live_encoder_units 2 — accepted at peak 2 == total 2."
            - "NetworkFeedWindow W2 on channel 12.2: join 12:10:00Z, breakaway 12:20:00Z, guard 2, live_encoder_units 2 — accepted because at 12:10:00Z the -2 release sorts before the +2 claim."
            - "The logical clock stands at 2026-08-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Mac Control", role_class: "MASTER_CONTROL", override_authority: "CRAWL_AND_CUTIN", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { mco_id: "$.data.id" }
            - call: "POST /operators"
