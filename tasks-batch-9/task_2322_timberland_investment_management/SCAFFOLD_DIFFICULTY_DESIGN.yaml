      - name: harvest_cancellation_gated_by_fund_cash_yield_mandate
        grounds:
          - "validations[priority=60]"
          - entities.Fund.fields.harvest_acceleration_required
          - state_machines.HarvestBlock.RESERVED_to_CANCELLED
          - state_machines.HarvestBlock.COMMITTED_to_COMPLETED
          - calculations.fund_nav_and_cash_yield
        distinguishing_aspect: |
          A HarvestBlock's own state permits cancellation, but the decision is delegated
          to the Fund: while cash_yield_bps 0 sits below the 300 bps mandate the CANCEL is
          refused with ERR_YIELD_SHORTFALL_LOCK, and completing an UNRELATED block on a
          different stand (+15858.07 -> 317 bps) clears the lock so the identical CANCEL
          now succeeds and returns the 200.00 reserved tons to available_tons. Nothing
          about the cancelled block changed between the two attempts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Fund with committed 500000.00, opening cash 400000.00 and target_cash_yield_bps 300, so harvest_acceleration_required starts true."
            - "One property with two stands, PC-01 and PC-02, each cruise-closed at 4647.12 tons from the five canonical plots."
            - "Block 1 on PC-01: 1000.00 tons, MIXED, expected price 58.00, index 1.05, haul 140 miles, COMMITTED."
            - "Block 2 on PC-02: 200.00 tons, RESERVED, never committed."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
