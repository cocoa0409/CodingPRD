          assert:
            - "Snapshot ${snap_id}: milestone_risk == 33.33, panel_risk == 94.50, sentiment_risk == 100.00, schedule_risk == 98.00"
            - "Snapshot ${snap_id}.score == 75.00 (per-term rounding: 11.67 + 23.63 + 25.00 + 14.70)"
            - "Snapshot ${snap_id}.risk_band == CRITICAL (75.00 >= 75, lower bound inclusive)"
            - "The sum-raw-then-round alternative (74.99 -> HIGH) is observably wrong under the pinned rounding order"

      - name: guarantee_repayment_evaluation_order_pinned
        grounds:
          - calculations.income_guarantee_draw
          - entities.IncomeGuarantee.fields.outstanding_balance_cents
          - entities.IncomeGuarantee.fields.total_repaid_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation order. A repayment is
          validated against outstanding = max(0, advanced - repaid - forgiveness) computed BEFORE
          the current repayment is applied: after one attested month (advanced 800000, forgiveness
          100000, outstanding 700000), a repayment of exactly 700000 succeeds; an implementation
          that folds the pending repayment into outstanding first would compute 0 and wrongly
          reject it. A further repayment of 1 cent then fails with ERR_REPAYMENT_EXCEEDS_OUTSTANDING.
        test_recipe:
          setup:
            - "Executed offer pipeline (start 2027-06-01, monthly guarantee 2000000); guarantee ACTIVE at clock 2027-06-05"
            - "Month 1 ATTESTED attained (120/100, collections 1200000): advanced 800000, forgiveness 100000, outstanding 700000"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Eli", specialty: "FAMILY_MEDICINE", email: "eli@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
