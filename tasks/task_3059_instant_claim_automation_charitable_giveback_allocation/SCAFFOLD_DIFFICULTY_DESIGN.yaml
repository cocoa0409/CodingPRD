  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: premium_charge_conserves_charge_equals_fee_plus_ceded_plus_pot
        grounds:
          - calculations.fee_split_on_premium_charge
          - entities.Cohort.fields.claims_pot_cents
        distinguishing_aspect: |
          Conserved quantity — premium charge decomposition: for every premium
          payment, charge == fee + ceded + pot_increment exactly (integer cents,
          no rounding drift); the 9999-cent charge with pct 0.25 and quota 0.75
          decomposes as 2500 + 5624 + 1875 == 9999, and a second payment adds
          the same decomposition on top without drift.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Cause; cohort 2026 OPEN."
            - "State WA: APPROVED PCT filing cap 0.30; ACTIVE FeeConfig pct 0.25. Treaty 0.75 ACTIVE and attached."
            - "Policyholder WA, policy bound premium 9999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "WA", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 50000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing_wa: $.data.id }
            - call: "POST /rate-filings/${filing_wa}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "WA", filing_id: "${filing_wa}", flat_fee_pct: 0.25, flat_fee_cents: 50000 }
              as: UnderwritingAdmin
              captures: { fc_wa: $.data.id }
            - call: "POST /fee-configs/${fc_wa}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /reinsurance-treaties"
              payload: { name: "QS-75", quota_share_pct: 0.75 }
              as: FinanceOps
              captures: { treaty_id: $.data.id }
            - call: "POST /reinsurance-treaties/${treaty_id}/activate"
              payload: {}
              as: FinanceOps
            - call: "POST /cohorts/${cohort_id}/reinsurance"
              payload: { treaty_id: "${treaty_id}" }
              as: FinanceOps
            - call: "POST /policyholders"
              payload: { email: "wa@x.com", full_name: "W A", state_code: "WA" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 50000, premium_cents: 9999 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
          trigger:
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 5000 }
              as: FinanceOps
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 4999 }
              as: FinanceOps
          assert:
            - "Per-payment conservation: payment 1 ledger rows sum 1250 (fee) + 2813 (ceded round_half_up(3750*0.75)) + 937 (pot) == 5000; payment 2 rows sum 1250 (fee round_half_up(4999*0.25)) + 2812 (ceded round_half_up(3749*0.75)) + 937 (pot) == 4999"
            - "Cohort.${cohort_id}.premium_pool_cents == 9999"
            - "Cohort.${cohort_id}.premium_pool_cents == fee_retained_cents + reinsurance_ceded_cents + claims_pot_cents (9999 == 2500 + 5625 + 1874)"
            - "Policy.${pol}.premium_outstanding_cents == 0"

      - name: denial_releases_reserve_conserving_projected_giveback
        grounds:
          - calculations.retained_claims_and_giveback
          - state_machines.Claim.ESCALATED_to_DENIED
        distinguishing_aspect: |
          DIFFERENT conserved quantity — reserve mass: an ESCALATED claim's
          retained reserve is part of retained_claims_reserved_cents; denying it
          (the compensating action of escalation) MUST release exactly the same
          retained amount back into giveback_projected_cents — escalate-then-deny
          leaves retained_claims_reserved_cents and giveback_projected_cents
          identical to their pre-escalation values (15000 out, 15000 back).
