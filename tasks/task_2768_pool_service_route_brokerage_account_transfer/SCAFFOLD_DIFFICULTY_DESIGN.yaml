            - "after the -1516 event Deal.${deal_id}.net_attrition_mrr_cents == 1516"
            - "after the -1516 event Deal.${deal_id}.clawback_status == MONITORING (1516 > 1516 is false)"
            - "after the -1516 event Deal.${deal_id}.attrition_pct == 0.0500"
            - "after the -1516 event EscrowAccount.${escrow_id}.holdback_release_blocked == false and EscrowAccount.${escrow_id}.scheduled_holdback_release_utc == 2026-11-30T00:00:00Z"
            - "after the -1 event Deal.${deal_id}.net_attrition_mrr_cents == 1517"
            - "after the -1 event Deal.${deal_id}.clawback_status == CLAWBACK_TRIGGERED (1517 > 1516)"
            - "after the -1 event Deal.${deal_id}.attrition_pct == 0.0500 - identical to the MONITORING side, so the rounded percentage does not discriminate"
            - "after the -1 event EscrowAccount.${escrow_id}.holdback_release_blocked == true"
            - "ServiceAccount.${a1_id}.current_mrr_cents == 14484 and ServiceAccount.${a1_id}.transfer_status == TRANSFERRED (DOWNGRADED does not lose the stop)"
            - "ServiceAccount.${a2_id}.current_mrr_cents == 14317"
            - "a POST /clawback-settlements for the deal now succeeds with HTTP 201, and the recomputed REPLACEMENT_BASIS adjustment_cents is round_half_up(1 * 11.0) == 11"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: listing_publish_and_valuation_blocked_by_suspended_seller
        grounds:
          - "validations[priority=65]"
          - "errors.ERR_SELLER_SUSPENDED"
          - "entities.Seller.fields.status"
          - "entities.Seller.fields.suspension_reason_code"
          - "endpoints[POST /sellers/{id}/suspend]"
          - "endpoints[POST /route-listings/{id}/publish]"
          - "state_machines.RouteListing.DRAFT_to_LISTED"
        distinguishing_aspect: "The blocking state lives on the Seller, two entities away from the operation's own row: nothing about RouteListing changes when the seller is suspended, yet publish and valuation both stop. The second, identically-shaped listing owned by an ACTIVE seller is the control that isolates the dependency to Seller.status alone."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; AZ state profile seeded."
            - "Seller SUN (Sun Valley Pools LLC) and Seller CACTUS (Cactus Clear Pools Inc) are both ACTIVE."
            - "Listing L-SUN (region SUS-01, seller SUN) and listing L-CACTUS (region SUS-02, seller CACTUS) are both DRAFT, each with one UNVERIFIED account of 20000 claimed recurring MRR and each with a non-superseded LISTED_BASIS RouteValuation, so every publish precondition except Seller.status is already satisfied for both."
            - "Seller SUN is then SUSPENDED with suspension_reason_code LICENSE_LAPSED; Seller CACTUS is untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Cactus Clear Pools Inc", "state_code": "AZ", "license_number": "AZ-PA-2002"}
              as: Broker
              captures: {"seller2_id": "$.data.id"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "SUS-01", "state_code": "AZ", "asking_price_cents": 200000, "listed_mrr_cents": 20000, "listed_account_count": 1, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_sun": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_sun}", "customer_ref": "SUN-STOP-1", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 20000, "avg_monthly_chemical_cents": 0, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_sun": "$.data.id"}
            - call: "GET /route-listings/${l_sun}"
              as: Broker
              captures: {"lv_sun": "$.data.version"}
            - call: "POST /route-listings/${l_sun}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${lv_sun}"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller2_id}", "region_code": "SUS-02", "state_code": "AZ", "asking_price_cents": 200000, "listed_mrr_cents": 20000, "listed_account_count": 1, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_cac": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_cac}", "customer_ref": "CACTUS-STOP-1", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 20000, "avg_monthly_chemical_cents": 0, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_cac": "$.data.id"}
            - call: "GET /route-listings/${l_cac}"
              as: Broker
              captures: {"lv_cac": "$.data.version"}
            - call: "POST /route-listings/${l_cac}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${lv_cac}"}
              as: Broker
            - call: "POST /sellers/${seller_id}/suspend"
              payload: {"suspension_reason_code": "LICENSE_LAPSED"}
              as: PlatformAdmin
          trigger:
            - call: "POST /route-listings/${l_sun}/publish"
              payload: {}
              as: Broker
            - call: "GET /route-listings/${l_sun}"
              as: Broker
              captures: {"lv_sun2": "$.data.version"}
            - call: "POST /route-listings/${l_sun}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${lv_sun2}"}
              as: Broker
            - call: "POST /route-listings/${l_cac}/publish"
              payload: {}
              as: Broker
          assert:
            - "Seller.${seller_id}.status == SUSPENDED and Seller.${seller_id}.suspension_reason_code == LICENSE_LAPSED"
            - "the first trigger call returns HTTP 422 with error_id ERR_SELLER_SUSPENDED"
            - "RouteListing.${l_sun}.status == DRAFT after the refused publish"
            - "RouteListing.${l_sun}.claimed_recurring_mrr_cents == 20000 and RouteListing.${l_sun}.claimed_account_count == 1 (every local precondition still holds)"
            - "the valuation trigger call returns HTTP 422 with error_id ERR_SELLER_SUSPENDED as well, so the dependency is not specific to publish"
            - "Seller.${seller2_id}.status == ACTIVE"
            - "the last trigger call returns HTTP 200 and RouteListing.${l_cac}.status == LISTED, proving the refusal is caused only by the other entity's status"
            - "ServiceAccount.${a_sun}.verification_status == UNVERIFIED (the suspension mutates nothing downstream)"

      - name: license_waiver_depends_on_buyer_state_and_profile_reciprocity
        grounds:
          - "validations[priority=69]"
          - "errors.ERR_RECIPROCITY_NOT_AVAILABLE"
          - "entities.StateLicenseProfile.fields.reciprocity_states"
          - "entities.Buyer.fields.state_code"
          - "entities.Buyer.fields.license_status"
          - "endpoints[POST /license-transfers/{id}/waive]"
          - "state_machines.LicenseTransfer.NOT_STARTED_to_WAIVED"
        distinguishing_aspect: "A THREE-entity dependency, and the deciding fields are on two entities the LicenseTransfer merely points at: Buyer.state_code must be a member of StateLicenseProfile.reciprocity_states. The two LicenseTransfer rows are byte-identical in their own fields (same permit_type, same NV profile, both NOT_STARTED) and still answer differently."
