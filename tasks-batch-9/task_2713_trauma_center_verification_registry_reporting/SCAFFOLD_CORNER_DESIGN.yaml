              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { log1: $.data.id }
          assert:
            - "HTTP status is 201 and ResponseLog.${log1}.compliance_status == UNDOCUMENTED with response_minutes null"
            - "ResponseLog.${log1}.applicable_limit_minutes == 60, taken from specialty_response_limit_minutes"
            - "GET /pi-events?center_id=${c1} returns an empty list, because only SURGEON logs spawn DELAYED_SURGEON events"
