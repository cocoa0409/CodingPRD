# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Boat & Watercraft Dry-Stack Storage Marina — Expert
# 9 rule_ids x >= 2 instances = 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_storage_invoice
        grounds:
          - calculations.compute_invoice_amount
          - calculations.compute_seasonal_factor
          - entities.StorageInvoice.fields.variant
          - state_machines.StorageAgreement.PENDING_COI_to_ACTIVE
        distinguishing_aspect: "On the StorageInvoice/StorageAgreement cost-accounting domain: a PROVISIONAL invoice bills the full seasonal monthly (72450), a FINAL invoice for the same agreement prorates to 35056 over 15 of 31 July days — same agreement, two valid algorithms, delta 37394."
        test_recipe:
          setup:
            - "Marina with a LARGE rack (max_loa_ft 40.00); a vessel loa 39.60 ft (within 0.5 ft band -> oversize) dry_weight 6000 lb; VERIFIED COI; agreement ACTIVE so monthly_base_cents=60375 (52500*1.15)."
            - "Clock at 2026-07-10 for issuing both invoices over a July period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "L-1", size_class: "LARGE", max_loa_ft: 40.00, max_beam_ft: 14.00, max_weight_lbs: 12000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto Owner", email: "otto@x.com" }
              as: BillingClerk
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "BigBoat", loa_ft: 39.60, beam_ft: 13.00, dry_weight_lbs: 6000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vessel_id}", carrier_name: "AcmeMarine", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { policy_id: $.data.id }
            - call: "POST /marina/insurance-policies/${policy_id}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vessel_id}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agr_id: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rack_v: $.data.version }
            - call: "POST /marina/storage-agreements/${agr_id}/activate"
              payload: { expected_rack_version: "${rack_v}" }
              as: DockMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /marina/invoices"
              payload: { owner_id: "${owner_id}", source_kind: "STORAGE_AGREEMENT", source_id: "${agr_id}", variant: "PROVISIONAL", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: BillingClerk
              captures: { prov_inv_id: $.data.id, prov_amt: $.data.amount_cents }
            - call: "POST /marina/invoices"
              payload: { owner_id: "${owner_id}", source_kind: "STORAGE_AGREEMENT", source_id: "${agr_id}", variant: "FINAL", period_start: "2026-07-10T00:00:00Z", period_end: "2026-07-25T00:00:00Z" }
              as: BillingClerk
              captures: { final_inv_id: $.data.id, final_amt: $.data.amount_cents }
          assert:
            - "StorageInvoice.${prov_inv_id}.amount_cents == 72450"
            - "StorageInvoice.${final_inv_id}.amount_cents == 35056"
            - "StorageInvoice.${prov_inv_id}.amount_cents - StorageInvoice.${final_inv_id}.amount_cents == 37394"

      - name: waitlist_priority_read_vs_promotion_basis
        grounds:
          - calculations.compute_waitlist_priority
          - entities.WaitlistEntry.fields.priority_score
          - entities.WaitlistEntry.fields.joined_at
        distinguishing_aspect: "On the WaitlistEntry domain (distinct from the StorageInvoice cost-accounting domain of the first instance): the same entry's priority_score read at clock 2026-04-04 is 3 (3 whole days waited) versus 7 when read at 2026-04-08 — days_waiting is the floored clock-minus-joined_at, so the read-basis clock changes the score for identical entity fields."
        test_recipe:
          setup:
            - "An owner+vessel created at clock 2026-04-01; a WAITING waitlist entry (deposit_paid false) joined at 2026-04-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Wendy Wait", email: "w@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Waiter", loa_ft: 20.00, beam_ft: 8.00, dry_weight_lbs: 3000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/waitlist"
              payload: { vessel_id: "${vessel_id}", requested_size_class: "SMALL", deposit_paid: false }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-04T00:00:00Z" }
              as: DockMaster
            - call: "GET /marina/waitlist/${entry_id}"
              payload: {}
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { score_day3: $.data.priority_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T00:00:00Z" }
              as: DockMaster
            - call: "GET /marina/waitlist/${entry_id}"
              payload: {}
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { score_day7: $.data.priority_score }
          assert:
            - "WaitlistEntry.${entry_id}.priority_score == 3 when read at clock 2026-04-04"
            - "WaitlistEntry.${entry_id}.priority_score == 7 when read at clock 2026-04-08"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: launch_fee_nonlinear_heavy_and_splash
        grounds:
          - calculations.compute_launch_fee
          - state_machines.LaunchRequest.REQUESTED_to_SCHEDULED
          - entities.LaunchRequest.fields.launch_fee_cents
        distinguishing_aspect: "Mode (a): launch_fee = 4500 + 250*ceil(loa) + heavy_surcharge(branch on dry_weight>8000) + splash(branch on with_valet_splash) — >=3 inputs with two conditional branches; for loa 28.2 (ceil 29), 9000 lb, splash true = 4500+7250+3000+6000 = 20750."
        test_recipe:
          setup:
            - "A RACKED vessel (via ACTIVE agreement) loa 28.20 dry_weight 9000; an AVAILABLE forklift max_lift 15000; a launch request with with_valet_splash true at a future window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/forklifts"
              payload: { marina_id: "${marina_id}", label: "FL-1", max_lift_weight_lbs: 15000 }
              as: DockMaster
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Heavy", loa_ft: 28.20, beam_ft: 10.00, dry_weight_lbs: 9000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vessel_id}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { policy_id: $.data.id }
            - call: "POST /marina/insurance-policies/${policy_id}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vessel_id}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agr_id: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rack_v: $.data.version }
            - call: "POST /marina/storage-agreements/${agr_id}/activate"
              payload: { expected_rack_version: "${rack_v}" }
              as: DockMaster
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vessel_id}", requested_window_start: "2026-04-02T10:00:00Z", with_valet_splash: true }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { launch_id: $.data.id }
          trigger:
            - call: "POST /marina/launch-requests/${launch_id}/schedule"
              payload: {}
              as: DockMaster
              captures: { fee: $.data.launch_fee_cents }
          assert:
            - "LaunchRequest.${launch_id}.launch_fee_cents == 20750"
            - "LaunchRequest.${launch_id}.status == SCHEDULED"

      - name: service_total_fuel_round_per_line_then_sum
        grounds:
          - calculations.compute_service_total
          - entities.ServiceOrder.fields.total_cents
        distinguishing_aspect: "Mode (b): the fuel line 15.25 gal * 712 c/gal = 10858.0 is rounded per-line (round_half_up to whole cents) before becoming total_cents; the scaffold pins round-per-line-then-sum, so total_cents == 10858 (not a sum-then-round path)."
        test_recipe:
          setup:
            - "A registered vessel; a FUEL service order for 15.250 gal at 712 cents/gal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Fueler", loa_ft: 22.00, beam_ft: 8.50, dry_weight_lbs: 4000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /marina/service-orders"
              payload: { vessel_id: "${vessel_id}", service_kind: "FUEL", fuel_gallons: 15.250, fuel_price_cents_per_gal: 712 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { so_id: $.data.id, total: $.data.total_cents }
          assert:
            - "ServiceOrder.${so_id}.total_cents == 10858"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: launch_request_cyclic_schedule_unschedule_reschedule
        grounds:
          - state_machines.LaunchRequest.REQUESTED_to_SCHEDULED
          - state_machines.LaunchRequest.SCHEDULED_to_REQUESTED
          - entities.LaunchRequest.fields.status
        distinguishing_aspect: "On LaunchRequest: SCHEDULED -> REQUESTED -> SCHEDULED is a genuine cycle (unschedule reverts to REQUESTED, then schedule re-enters SCHEDULED), releasing then re-booking a forklift slot — not a linear pipeline."
        test_recipe:
          setup:
            - "A RACKED vessel with an ACTIVE agreement; an AVAILABLE forklift; a SCHEDULED launch request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/forklifts"
              payload: { marina_id: "${marina_id}", label: "FL-1", max_lift_weight_lbs: 15000 }
              as: DockMaster
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Cyc", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vessel_id}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { policy_id: $.data.id }
            - call: "POST /marina/insurance-policies/${policy_id}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vessel_id}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agr_id: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rack_v: $.data.version }
            - call: "POST /marina/storage-agreements/${agr_id}/activate"
              payload: { expected_rack_version: "${rack_v}" }
              as: DockMaster
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vessel_id}", requested_window_start: "2026-04-02T10:00:00Z" }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { launch_id: $.data.id }
            - call: "POST /marina/launch-requests/${launch_id}/schedule"
              payload: {}
              as: DockMaster
              captures: { slot_id_1: $.data.forklift_slot_id }
          trigger:
            - call: "POST /marina/launch-requests/${launch_id}/unschedule"
              payload: {}
              as: DockMaster
            - call: "POST /marina/launch-requests/${launch_id}/schedule"
              payload: {}
              as: DockMaster
              captures: { slot_id_2: $.data.forklift_slot_id }
          assert:
            - "LaunchRequest.${launch_id}.status == REQUESTED immediately after unschedule"
            - "LaunchRequest.${launch_id}.status == SCHEDULED again after the second schedule"
            - "ForkliftSlot.${slot_id_1}.status == RELEASED after unschedule"

      - name: vessel_parallel_location_and_billing_dimensions
        grounds:
          - entities.Vessel.fields.location_status
          - entities.Vessel.fields.billing_status
          - state_machines.LaunchRequest.SCHEDULED_to_SPLASHED
          - state_machines.StorageAgreement.ACTIVE_to_WINTERIZED
        distinguishing_aspect: "On Vessel: location_status (RACKED->IN_WATER via splash) and billing_status (ACTIVE_STORAGE->WINTER_HOLD via winterize) are two parallel state dimensions that change independently on the same row — splash moves only location_status, winterize moves only billing_status."
        test_recipe:
          setup:
            - "A RACKED vessel with ACTIVE agreement, billing_status ACTIVE_STORAGE; a SCHEDULED launch whose slot window has opened (clock past window_start)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/forklifts"
              payload: { marina_id: "${marina_id}", label: "FL-1", max_lift_weight_lbs: 15000 }
              as: DockMaster
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Par", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vessel_id}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { policy_id: $.data.id }
            - call: "POST /marina/insurance-policies/${policy_id}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vessel_id}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agr_id: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rack_v: $.data.version }
            - call: "POST /marina/storage-agreements/${agr_id}/activate"
              payload: { expected_rack_version: "${rack_v}" }
              as: DockMaster
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vessel_id}", requested_window_start: "2026-04-02T10:00:00Z" }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { launch_id: $.data.id }
            - call: "POST /marina/launch-requests/${launch_id}/schedule"
              payload: {}
              as: DockMaster
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T10:05:00Z" }
              as: DockMaster
            - call: "POST /marina/launch-requests/${launch_id}/splash"
              payload: {}
              as: DockMaster
          assert:
            - "Vessel.${vessel_id}.location_status == IN_WATER after splash"
            - "Vessel.${vessel_id}.billing_status == ACTIVE_STORAGE unchanged by splash (only location dimension moved)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: activate_cascade_rack_then_vessel_depth3
        grounds:
          - state_machines.StorageAgreement.PENDING_COI_to_ACTIVE
          - entities.Rack.fields.status
          - entities.Vessel.fields.location_status
          - entities.Vessel.fields.billing_status
        distinguishing_aspect: "Depth-3 chain originating at agreement activate: activate -> Rack.status becomes OCCUPIED (hop 1); that rack-occupation causes Vessel.location_status=RACKED (hop 2); the same rack-occupation causes Vessel.billing_status=ACTIVE_STORAGE (hop 3). Each link is caused by the prior link, not directly by the activate call."
        test_recipe:
          setup:
            - "A PENDING_COI agreement binding a VERIFIED-COI vessel (OFF_SITE/UNBILLED) to an AVAILABLE rack."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Casc", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vessel_id}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { policy_id: $.data.id }
            - call: "POST /marina/insurance-policies/${policy_id}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vessel_id}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agr_id: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rack_v: $.data.version }
          trigger:
            - call: "POST /marina/storage-agreements/${agr_id}/activate"
              payload: { expected_rack_version: "${rack_v}" }
              as: DockMaster
          assert:
            - "Rack.${rack_id}.status == OCCUPIED after activate (hop 1)"
            - "Vessel.${vessel_id}.location_status == RACKED after activate (hop 2)"
            - "Vessel.${vessel_id}.billing_status == ACTIVE_STORAGE after activate (hop 3)"

      - name: cancel_scheduled_launch_releases_slot_depth2
        grounds:
          - state_machines.LaunchRequest.SCHEDULED_to_CANCELLED
          - entities.ForkliftSlot.fields.status
          - entities.LaunchRequest.fields.launch_fee_cents
