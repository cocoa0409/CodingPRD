              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site WC", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Twc", skill_level: "MASTER", weekly_capacity_hours: 40 }
