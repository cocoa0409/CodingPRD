          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "LiabilityItem.${item_id}.disposition == ESCROWED and escrowed_amount_cents == 2500000"
            - "Acquisition.${acq_id}.escrow_committed_cents == 2500000 and escrow_available_cents == 7500000"
            - "target_disposition EXCLUDED on the same row succeeds, sets escrowed_amount_cents back to 0 and restores escrow_available_cents to 10000000"

      - name: readiness_task_failed_reopens_to_in_progress_and_clears_reason
        claim_type: Valid Transition
        grounds:
          - state_machines.ReadinessTask.status.IN_PROGRESS_to_FAILED
          - state_machines.ReadinessTask.status.FAILED_to_IN_PROGRESS
          - calculations.acquisition_readiness_posture
        distinguishing_aspect: |
          The ReadinessTask machine is cyclic: FAILED -> IN_PROGRESS reopens the line,
          clears failure_reason back to null and lifts the posture from BLOCKED to
          AT_RISK, so a failed blocking task is recoverable without creating a new row.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with one blocking COMPLIANCE_TRAINING ReadinessTask driven to FAILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_id}", task_code: "COMPLIANCE_TRAINING", is_blocking: true, due_on: "2026-10-25" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_id: "$.data.id" }
            - call: "POST /readiness-tasks/${task_id}/status"
              payload: { target_status: "IN_PROGRESS" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /readiness-tasks/${task_id}/status"
              payload: { target_status: "FAILED", failure_reason: "Two clinicians missed the training window." }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /readiness-tasks/${task_id}/status"
              payload: { target_status: "IN_PROGRESS" }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "before the trigger, ReadinessTask.${task_id}.status == FAILED with failure_reason == Two clinicians missed the training window. and Acquisition.${acq_id}.readiness_posture == BLOCKED"
            - "after the trigger, ReadinessTask.${task_id}.status == IN_PROGRESS and failure_reason is null"
            - "after the trigger, Acquisition.${acq_id}.readiness_posture == AT_RISK"
            - "driving the task on to COMPLETE stores verified_by_user_id == im-1 and lifts the posture to READY"

      - name: compliance_clearance_flagged_blocks_child_writes_then_cleared_restores
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Acquisition.compliance_clearance.PENDING_to_FLAGGED
          - state_machines.Acquisition.compliance_clearance.FLAGGED_to_CLEARED
          - validations[priority=15]
          - errors[ERR_COMPLIANCE_CLEARANCE_BLOCKED]
        distinguishing_aspect: |
          The compliance_clearance dimension gates the whole child write surface: while
          it sits at FLAGGED a POST /physicians is refused with
          ERR_COMPLIANCE_CLEARANCE_BLOCKED (403), and returning the dimension to
          CLEARED makes the identical request succeed — the deal_status dimension
          never moves throughout.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING whose compliance_clearance has been moved PENDING -> FLAGGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/compliance-clearance"
              payload: { target_clearance: "FLAGGED", clearance_note: "Anonymous referral-pattern complaint under review." }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "response error_id == ERR_COMPLIANCE_CLEARANCE_BLOCKED with HTTP 403"
            - "Acquisition.${acq_id}.compliance_clearance == FLAGGED and deal_status == SOURCING"
            - "GET /physicians with acquisition_id ${acq_id} reports total_count == 0"
            - "POST /ehr-migration-batches, POST /staff-transition-offers, POST /billing-conversions and POST /liability-items on ${acq_id} each also return ERR_COMPLIANCE_CLEARANCE_BLOCKED (403)"
            - "after POST /acquisitions/${acq_id}/compliance-clearance with target_clearance CLEARED as co-1, the identical POST /physicians succeeds with HTTP 201"
            - "moving the dimension FLAGGED -> SUSPENDED and back to FLAGGED keeps the same block in force at both stops"

  # ===========================================================================
  # Section 3 — Calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: minor_record_retention_overrides_the_structured_base_years
        claim_type: Correct Result
        grounds:
          - calculations.legacy_retention_years
          - entities.EhrMigrationBatch.fields.retention_years
          - entities.EhrMigrationBatch.fields.legacy_purge_eligible_on
        distinguishing_aspect: |
          A STRUCTURED batch carries a 10-year base, but a batch containing a
          six-year-old's chart must be held to the age of majority plus nothing —
          MINOR_RETENTION_AGE_YEARS minus the youngest age, 15 years — and the rule
          takes the larger of the two, so the purge date lands fifteen years after the
          last encounter rather than ten.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "PEDS-CHARTS-2026-A", source_system: "LEGACY_EMR", chart_type: "STRUCTURED", record_count: 20000, contains_minor_records: true, youngest_patient_age_years: 6, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { batch_id: "$.data.id" }
          assert:
            - "EhrMigrationBatch.${batch_id}.retention_years == 15"
            - "EhrMigrationBatch.${batch_id}.legacy_purge_eligible_on == 2041-07-15"
            - "an otherwise identical batch with contains_minor_records false has retention_years == 10 and legacy_purge_eligible_on == 2036-07-15"
            - "an IMAGING batch with contains_minor_records true and youngest_patient_age_years 6 also has retention_years == 15, because 15 beats the 7-year imaging base"
            - "EhrMigrationBatch.${batch_id}.validated_count == 0, defect_count == 0, unprocessed_count == 20000 and match_rate_bps == 0 at creation"

      - name: imaging_chart_type_selects_the_seven_year_retention_base
        claim_type: Variant Selection
        grounds:
          - calculations.legacy_retention_years
          - calculations.legacy_retention_years.constants.IMAGING_RETENTION_YEARS
        distinguishing_aspect: |
          chart_type is the sole selector between the two retention bases for an
          adult-only batch: IMAGING resolves to 7 years while STRUCTURED and SCANNED
          both resolve to the 10-year default, from the identical last_encounter_on.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "IMAGING-2026-A", source_system: "LEGACY_PACS", chart_type: "IMAGING", record_count: 20000, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { imaging_id: "$.data.id" }
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "SCANNED-2026-A", source_system: "LEGACY_EMR", chart_type: "SCANNED", record_count: 20000, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { scanned_id: "$.data.id" }
          assert:
            - "EhrMigrationBatch.${imaging_id}.retention_years == 7 and legacy_purge_eligible_on == 2033-07-15"
            - "EhrMigrationBatch.${scanned_id}.retention_years == 10 and legacy_purge_eligible_on == 2036-07-15"
            - "both batches carry the same last_encounter_on 2026-07-15, so chart_type alone accounts for the three-year difference"

      - name: occurrence_policy_form_prices_the_tail_at_exactly_zero
        claim_type: Variant Selection
        grounds:
          - calculations.malpractice_tail_premium
          - entities.Acquisition.fields.tail_coverage_required
          - entities.Acquisition.fields.tail_premium_cents
        distinguishing_aspect: |
          malpractice_policy_form selects between two structurally different branches
          of the tail calculation, and the OCCURRENCE branch short-circuits before the
          specialty rate table is consulted at all: tail_coverage_required is false and
          tail_premium_cents is exactly 0 even though tail_coverage_months is 0, which
          would otherwise be below TAIL_MIN_MONTHS and block the transition.
        test_recipe:
          setup:
            - "One Acquisition with malpractice_policy_form OCCURRENCE and tail_coverage_months left at its default 0."
            - "One Physician, an ACCEPTED FMV MARKET_APPROACH opinion and an ACCEPTED REASONABLE commercial reasonableness opinion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 290000000, market_multiple_bps: 50000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { fmv_id: "$.data.id" }
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v2: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v2}", opinion_type: "COMMERCIAL_REASONABLENESS", method: "NARRATIVE", cr_conclusion: "REASONABLE", independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { cr_id: "$.data.id" }
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "BOARD_REVIEW" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "Acquisition.${acq_id}.tail_coverage_required == false and tail_premium_cents == 0"
            - "Acquisition.${acq_id}.purchase_price_cents == 1450000000, taken from the pinned MARKET_APPROACH opinion"
            - "the BOARD_REVIEW transition succeeds even though tail_coverage_months is 0, because the TAIL_MIN_MONTHS precondition only applies when tail_coverage_required is true"
