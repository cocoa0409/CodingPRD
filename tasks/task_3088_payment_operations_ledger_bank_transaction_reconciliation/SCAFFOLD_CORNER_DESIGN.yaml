- section: consistency_model
  instances:
  - name: derived_balances_are_visible_in_the_same_response
    claim_type: immediate
    grounds:
    - response_envelope.success
    - calculations.ledger_balance_projection
    - endpoints.POST_/ledgers/{id}/transactions
    - endpoints.GET_/ledgers/{id}
    distinguishing_aspect: 'The consistency model is immediate: the derived balances recomputed by a posting are
      already readable in a follow-up request with no settling delay, and the posting''s own response carries the
      row that caused them.'
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. One ledger exists with both balances at 0.
      setup_api_calls:
