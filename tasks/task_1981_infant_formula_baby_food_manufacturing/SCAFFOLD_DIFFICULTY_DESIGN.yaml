              as: QA_MANAGER
              captures: { pvcross_id: $.data.id }
            - call: "POST /api/v1/process-validations/${pvcross_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pvcross_id}/complete"
              payload:
                test_results:
                  - test_name: "homogeneity_cv"
                    measured_value: 4.0
                    acceptance_criteria: "<= 5.0"
                    pass: true
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas/${fcross_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "GET /api/v1/formulas/${fcross_id}"
              as: QA_MANAGER
              captures: { fcross_ver: $.data.version }
          trigger:
            - call: "POST /api/v1/production-batches"
              payload:
                formula_id: "${fcross_id}"
