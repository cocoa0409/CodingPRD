  - id: ERR_NO_TAXING_BODIES
    http: 409
    condition: "Certify attempted with zero taxing bodies (empty set)"
  - id: ERR_DISTRICT_NOT_DRAFT
    http: 409
    condition: "Operation requires district in DRAFT (add taxing body, certify)"
  - id: ERR_DISTRICT_NOT_CERTIFIED
    http: 409
    condition: "Operation requires district in CERTIFIED (increment, register, disburse, file/accept report)"
  - id: ERR_DISTRICT_ALREADY_DECERTIFIED
    http: 409
    condition: "Operation on a DECERTIFIED district"
  - id: ERR_TERM_NOT_EXPIRED
    http: 409
    condition: "EXPIRATION decertify with termination_tax_year < expiration_tax_year"
  - id: ERR_EARLY_TERM_NOT_ALLOWED
    http: 409
    condition: "EARLY decertify with termination_tax_year >= expiration_tax_year"
  - id: ERR_SENIOR_OBLIGATION_OUTSTANDING
    http: 409
    condition: "Decertify blocked: a SENIOR (bond) obligation is not SATISFIED/DEFEASED"
  - id: ERR_OBLIGATION_NOT_IN_REVIEW
    http: 409
    condition: "register/return/reject on an obligation not in UNDER_REVIEW"
  - id: ERR_OBLIGATION_INVALID_STATE
    http: 409
    condition: "submit/accrue on an obligation in the wrong state"
  - id: ERR_OBLIGATION_NOT_REGISTERED
    http: 409
    condition: "Disburse targets an obligation not in REGISTERED"
  - id: ERR_BOND_MATURITY_OUT_OF_TERM
    http: 409
