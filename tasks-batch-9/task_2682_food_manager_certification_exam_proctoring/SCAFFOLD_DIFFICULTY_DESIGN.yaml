              captures: { code_c: $.data.id, release_after_reassign: $.data.assignment_release_count }
          assert:
            - "pre-state: available_count == 0, assigned_count == 2, consumed_count == 0, voided_count == 0, status == DEPLETED, and 0 + 2 + 0 + 0 == quantity_purchased 2"
            - "the cancellation returns 200 with session_status == CANCELLED and proctoring_status == CLEARED"
            - "the code is compensated, not destroyed: AccessCode.${code_a}.status == AVAILABLE with candidate_id null, assigned_at null and assignment_release_count == 1"
