              payload: { driver_code: "D-91", domicile_id: "${dom_kc_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2015-04-01" }
              as: TransportManager
              captures: { drv_91_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-92", domicile_id: "${dom_kc_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2018-04-01" }
              as: TransportManager
              captures: { drv_92_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-93", domicile_id: "${dom_kc_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2022-04-01" }
              as: TransportManager
              captures: { drv_93_id: $.data.id }
            - call: "GET /fleet/domiciles/${dom_kc_id}"
              payload: {}
              as: TransportManager
              captures: { pre_count: $.data.assigned_driver_count, pre_index: $.data.balance_index }
            - call: "POST /fleet/route-postings"
              payload: { route_code: "RT-200", domicile_id: "${dom_kc_id}", weekly_miles: 1500, weekly_stops: 10, start_effective_date: "2026-09-01", bid_close_at: "2026-08-10T00:00:00Z" }
              as: TransportManager
              as_user_id: "user-tm-1"
              captures: { posting_200_id: $.data.id, posting_200_v1: $.data.version }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_200_id}", expected_posting_version: "${posting_200_v1}" }
              as: Driver
              as_user_id: "${drv_93_id}"
              captures: { bid_93_id: $.data.id, bid_93_status: $.data.status, bid_93_seniority: $.data.seniority_date_snapshot, bid_93_safety: $.data.safety_score_snapshot }
          trigger:
            - call: "POST /fleet/drivers/${drv_93_id}/termination"
