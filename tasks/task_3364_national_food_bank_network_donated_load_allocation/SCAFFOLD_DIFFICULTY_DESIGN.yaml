              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 40000, lot_code: "LOT-66", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 620 }
