            - "trigger[0] -> 200 with data.status == \"ACCEPTED\" (the response itself already reflects the cascade)"
            - "trigger[1] -> 200 with data.status == \"ACCEPTED\" and data.instrument_loan_requested == false"
            - "trigger[2] -> 200 with meta.total_count == 1, data[0].chair_number == 1, data[0].is_principal == true, data[0].ranking_score == 81.80 and data[0].status == \"ACTIVE\""
            - "trigger[3] -> 200 with data.filled_count == 1 and data.balance_state == \"BALANCED\" (target 1 reached, max 2 not reached)"
            - "trigger[4] -> 200 with data.seated_count == 1, data.offered_count == 0 and data.roster_state == \"FORMING\""
            - "trigger[5] -> 200 with data.seated_ensemble_count == 0 and data.status == \"PLACEMENT\" (the section is not FULL, so no ancestor hop fired)"
            - "trigger[6] -> 200 with data.enrollment_status == \"ENROLLED\" and data.standing_status == \"CLEAR\""
            - "trigger[7] -> 200 with meta.total_count == 1, data[0].assessed_cents == 123223, data[0].balance_cents == 123223 and data[0].billing_status == \"CURRENT\""
            - "no additional call was needed between the write and any read"

