            - "Submission.${sub_id}.declared_face_value_cents == 6000 and count_variance_pct == 0.00"
            - "Submission.${sub_id}.valuation_method == SAMPLED_EXTRAPOLATION (at least one lot took the sampled variant)"

  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: statement_release_gated_on_invoice_funded
        grounds:
          - validations[priority=13]
          - state_machines.SettlementStatement.SCHEDULED_to_PAID
          - errors.ERR_INVOICE_NOT_FUNDED
          - errors.ERR_PAY_DATE_NOT_REACHED
          - errors.ERR_SOD_VIOLATION
        distinguishing_aspect: |
          Whether a SettlementStatement may become PAID depends on the state of a
          DIFFERENT entity — the ManufacturerInvoice that bills it — and nothing
          about the statement itself changes between the refusal and the success.
          The same release-payment call is refused four different ways as the
          surrounding state moves: ERR_INVOICE_NOT_FUNDED while the invoice is
          ISSUED, ERR_INVALID_STATE_TRANSITION once a short funding has pushed the
          statement itself into HELD, ERR_PAY_DATE_NOT_REACHED once the invoice is
          FUNDED but the calendar has not arrived, and ERR_SOD_VIOLATION when the
          issuing officer tries to release his own statement. Only the fifth call,
          with a different officer on the scheduled date, pays.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "retailer STANDARD / NET_30; submission verified 2, one lot of 2 accepted items -> gross 100, fee 14, misredemption_rate 0.00 so holdback 0 and net_payable 114"
            - "statement issued by so-1 and SCHEDULED at clock 2026-08-01, giving scheduled_pay_date 2026-08-31 (a Monday, no weekend roll)"
            - "invoice over that statement: billed_total 116, status ISSUED, funded_amount 0"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
