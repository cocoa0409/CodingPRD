        grounds: [entities.Student.fields.status, entities.Student.fields.eligibility_status, entities.Student.fields.priority_basis]
        distinguishing_aspect: "On intake the server sets status=INTAKE, eligibility_status=UNDETERMINED, priority_basis=PROVISIONAL regardless of input."
        test_recipe:
          setup: ["One district exists."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
