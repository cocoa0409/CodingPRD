            - call: "POST /credit-balances/${cb_oa1_id}/attribute"
              payload: { attribution_method: "PROPORTIONAL" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /credit-balances/${cb_oa2_id}/start-review"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /credit-balances/${cb_oa2_id}/attribute"
              payload: { attribution_method: "PROPORTIONAL" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /credit-balances/${cb_oa3_id}/start-review"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
