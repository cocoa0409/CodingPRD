scenario: "Solar Panel Installation & Financing: sunlight assessment, design/permit/PTO interconnection, PPA/Lease/Loan three models, SREC generation and sale, Net Metering settlement, 25-year warranty, Federal ITC credit"
domain_name: solar-install-financing
api_prefix: /solar

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Project, FinancingPlan, SREC, NetMeterPeriod, WarrantyClaim, ...)
  # linked by foreign keys; no nesting in URL paths beyond reverse-reachability GETs.

  state_machine_shape: branching
  # Project lifecycle forks at financing-model selection (PPA / LEASE / LOAN) with
  # divergent side-effect sets, and the install branch can revert (FAILED_INSPECTION
  # -> REMEDIATION -> RE_INSPECTION). WarrantyClaim and FinancingPlan add their own
  # branching/cyclic machines.

  relationship_patterns:
    - one_to_many        # Project has many SRECs, many NetMeterPeriods, many WarrantyClaims
    - flat_with_references
    - cross_aggregate    # SrecSale references SREC and Project; SettlementStatement references NetMeterPeriods

  role_model: peer_roles
  # Homeowner owns the project request; SolarInstaller designs/installs; Utility runs
  # interconnection + net-metering; SrecBroker buys SRECs; PlatformAdmin operates.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: email
        type: string
        source: input
        description: "Login identifier; unique across Homeowners."
        constraints: "unique, non-empty"
      - name: full_name
        type: string
        source: input
        description: "Homeowner legal name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of the property; selects SREC market + ITC rules."
        constraints: "2-letter uppercase enum: {CA, NJ, MA, TX, AZ}"
      - name: annual_kwh_usage
        type: integer
        source: input
        description: "Homeowner's prior-12-month electricity consumption in kWh; used for design sizing."
        constraints: ">= 0"

  - name: SolarInstaller
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: company_name
        type: string
        source: input
        description: "Installer company name."
      - name: licensed_states
        type: array
        source: input
        description: "Array of 2-letter state codes the installer is licensed in."
        constraints: "each element in {CA, NJ, MA, TX, AZ}; non-empty"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation (incl. cascades)."
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the property owner who requested the project."
      - name: installer_id
        type: string
        source: input
        description: "FK -> SolarInstaller.id; assigned at design time. Null until design submitted."
      - name: status
        type: enum
        source: system
        description: "Project lifecycle state."
        default: REQUESTED
        constraints: "enum: {REQUESTED, ASSESSED, DESIGNED, PERMIT_PENDING, PERMIT_APPROVED, INSTALLED, FAILED_INSPECTION, REMEDIATION, PTO_PENDING, OPERATIONAL, CANCELLED}"
      - name: roof_area_sqft
        type: integer
        source: input
        description: "Usable roof area in square feet; caps system size."
        constraints: ">= 0"
      - name: shading_factor
        type: number
        source: input
        description: "Fraction of irradiance lost to shading, 0.00–1.00; produced by sunlight assessment."
        default: 0.0
        constraints: "0.0 <= x <= 1.0; set by ASSESS transition"
      - name: peak_sun_hours
        type: number
        source: input
        description: "Average daily peak sun hours at the site; set by sunlight assessment."
        default: 0.0
        constraints: ">= 0; set by ASSESS transition"
      - name: system_size_kw
        type: number
        source: computed
        description: "DC system size in kW, computed at DESIGN time from roof area, usage, and sizing rule (calc: size_system). Drives all production estimates."
        default: 0.0
      - name: estimated_annual_production_kwh
        type: number
        source: computed
        description: "Year-1 AC production estimate in kWh (calc: estimate_production)."
        default: 0.0
      - name: gross_system_cost_cents
        type: integer
        source: input
        description: "Turnkey install cost in integer cents, set at DESIGN time."
        default: 0
        constraints: ">= 0"
      - name: itc_credit_cents
        type: integer
        source: computed
        description: "Federal ITC credit in cents (calc: itc_credit). Recomputed when financing model attaches (LOAN claims it; PPA/LEASE assign it to the financier)."
        default: 0
      - name: financing_plan_id
        type: string
        source: system
        description: "FK -> FinancingPlan.id; set when a FinancingPlan is created for this project. Null until then."
      - name: lifetime_srec_count
        type: integer
        source: computed
        description: "Count of SRECs ever minted for this project (calc: derived counter)."
        default: 0

  - name: FinancingPlan
