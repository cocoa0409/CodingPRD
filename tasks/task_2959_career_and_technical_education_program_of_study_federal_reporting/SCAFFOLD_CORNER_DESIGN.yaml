  - section: consistency_model
    instances:

      - name: every_derived_field_is_already_correct_in_the_writes_own_response_body
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /cte/students/{id}/credit-postings]
          - calculations.concentrator_cohort_classification
          - calculations.performance_indicator_actual
          - entities.PerformanceIndicator.fields.preliminary_status_projection
        distinguishing_aspect: |
          The consistency model is immediate, so the credit-posting response must already carry the reclassified
          concentrator_status rather than requiring a re-read, and the indicator's four preliminary fields must already
          reflect the new cohort membership on the very next read with no settling delay. This is asserted by comparing
          the write's own response body against an immediately following GET on the same row: an implementation that
          recomputes derived fields lazily on read returns PARTICIPANT in the write body and CONCENTRATOR in the read,
          and one that recomputes them on a background pass returns the pre-posting denominator of 0.
        test_recipe:
          setup:
            - "One STATE_APPROVED ProgramOfStudy with one ACTIVE SECONDARY course of 4.00 credit hours."
            - "One Student in cohort_year 2026 with cte_credits_earned 0 and concentrator_status PARTICIPANT, enrolled BEFORE the indicator was opened."
            - "One PerformanceIndicator 4S1_CREDENTIAL / 2027 / cohort 2026 in status AGREED with negotiated_level_pct 40.00 and met_threshold_pct 36.00, so denominator_count is 0 at the outset."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "15.0000", title: "Engineering Technologies", cluster: "STEM", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
