            - call: "POST /networks/${n_id}/drug-shortages"
              payload: { drug_product_id: "${d_id}", reported_at: "2026-07-01T00:00:00Z", supply_available_units: 0, allocation_method: "PRO_RATA_BASELINE" }
              as: NetworkAdmin
