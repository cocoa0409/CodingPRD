      - name: auth_ladder_rungs_one_through_four_are_ordered
        claim_type: violation_to_error
        grounds: ['validations[priority=1]', 'validations[priority=2]', 'validations[priority=3]', 'validations[priority=4]', 'errors[ERR_MISSING_AUTH_HEADER]', 'errors[ERR_UNKNOWN_ROLE]', 'errors[ERR_MISSING_USER_ID]', 'errors[ERR_ROLE_NOT_PERMITTED]']
        distinguishing_aspect: "A missing X-User-Role returns 401 ERR_MISSING_AUTH_HEADER, an undeclared role returns 401 ERR_UNKNOWN_ROLE, an entity_backed role without X-User-ID returns 401 ERR_MISSING_USER_ID, and a declared role absent from the endpoint's roles list returns 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup: ["One Client exists so the target endpoint has a valid body to reject on authentication grounds alone."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "No auth", phone: "+1-555-0000" }
              as: MOVE_MANAGER
              captures: { eA: "$.data.error_id" }
            - call: "POST /clients"
              payload: { full_name: "Bad role", phone: "+1-555-0001" }
              as: MOVE_MANAGER
              captures: { eB: "$.data.error_id" }
            - call: "POST /family-holds"
              payload: { inventory_item_id: "${cl}", raised_by_party_id: "${cl}", reason: "no user id" }
              as: FAMILY_MEMBER
              captures: { eC: "$.data.error_id" }
            - call: "POST /clients"
              payload: { full_name: "Wrong role", phone: "+1-555-0002" }
              as: VENDOR
              as_user_id: "${cl}"
              captures: { eD: "$.data.error_id" }
          assert:
            - "the first trigger call is sent with NO X-User-Role header, responds 401 and ${eA} == ERR_MISSING_AUTH_HEADER"
            - "the second trigger call is sent with X-User-Role: HOUSE_SITTER, responds 401 and ${eB} == ERR_UNKNOWN_ROLE"
            - "the third trigger call is sent as FAMILY_MEMBER with NO X-User-ID header, responds 401 and ${eC} == ERR_MISSING_USER_ID"
            - "the fourth trigger call responds 403 and ${eD} == ERR_ROLE_NOT_PERMITTED because VENDOR is not in the roles list of POST /clients"
            - "no Client row is created by any of the four trigger calls"

