            - "DonationRequest.${dr1}.status still == OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: book_fair_half_open_adjacency_allowed_intersection_rejected
        grounds:
          - validations[priority=14]
          - entities.BookFair.fields.start_date
        distinguishing_aspect: |
          Resource: School fair calendar. Interval semantics: HALF-OPEN
          [start, end) — a fair starting exactly when another ends (adjacency,
          gap=0) is ALLOWED, while a one-day interior intersection is rejected
          with ERR_FAIR_OVERLAP.
        test_recipe:
          setup:
            - "School S16 NORMAL; fair BF-A 2026-10-05..2026-10-09 exists"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S16", address: "16 Walnut St", low_income_program: false }
              as: ClubAdmin
              captures: { s16: $.data.id }
            - call: "POST /club/schools/${s16}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/book-fairs"
              payload: { school_id: "${s16}", start_date: "2026-10-05", end_date: "2026-10-09" }
              as: SchoolAdmin
              captures: { bfa: $.data.id }
          trigger:
            - call: "POST /club/book-fairs"
              payload: { school_id: "${s16}", start_date: "2026-10-08", end_date: "2026-10-12" }
              as: SchoolAdmin
              captures: { overlap_err: $.data.error_id }
            - call: "POST /club/book-fairs"
              payload: { school_id: "${s16}", start_date: "2026-10-09", end_date: "2026-10-16" }
              as: SchoolAdmin
              captures: { bfb: $.data.id }
          assert:
            - "Fair 2026-10-08..2026-10-12 rejected with ERR_FAIR_OVERLAP (intersects [10-05, 10-09))"
            - "Fair 2026-10-09..2026-10-16 ACCEPTED (start == prior end; half-open adjacency is not an overlap), BookFair.${bfb}.status == SCHEDULED"
      - name: published_cycle_uniqueness_per_school_band_months_may_repeat
        grounds:
          - validations[priority=12]
          - entities.FlyerCycle.fields.status
        distinguishing_aspect: |
          DIFFERENT resource (flyer slot per (school, grade_band)) and
          DIFFERENT interval semantics: not geometric intersection but
          aggregate-capacity — at most ONE PUBLISHED cycle occupies the slot at
          a time; a second publish is rejected until the first is CLOSED, and
          the slot is month-independent (two different months still collide
          while both would be PUBLISHED).
        test_recipe:
          setup:
            - "School S17 NORMAL; DRAFT cycles C17a (2026-10) and C17b (2026-11) both G3_5, each with 1 offering"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S17", address: "17 Magnolia Ln", low_income_program: false }
              as: ClubAdmin
              captures: { s17: $.data.id }
            - call: "POST /club/schools/${s17}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/titles"
              payload: { isbn: "9780000000120", name: "CY1", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub M", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { cy1: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s17}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c17a: $.data.id }
            - call: "POST /club/flyer-cycles/${c17a}/offerings"
              payload: { title_id: "${cy1}" }
              as: ClubAdmin
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s17}", month: "2026-11", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c17b: $.data.id }
            - call: "POST /club/flyer-cycles/${c17b}/offerings"
              payload: { title_id: "${cy1}" }
              as: ClubAdmin
          trigger:
            - call: "POST /club/flyer-cycles/${c17a}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/flyer-cycles/${c17b}/publish"
              payload: {}
              as: ClubAdmin
              captures: { pub_err: $.data.error_id }
            - call: "POST /club/flyer-cycles/${c17a}/close"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/flyer-cycles/${c17b}/publish"
              payload: {}
              as: ClubAdmin
          assert:
            - "Second publish (different month, same school+band) rejected with ERR_CYCLE_ALREADY_PUBLISHED while C17a is PUBLISHED"
            - "After closing C17a: C17b publishes successfully (slot released) and FlyerCycle.${c17b}.status == PUBLISHED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: submit_then_cancel_conserves_teacher_points
        grounds:
          - calculations.reward_points_base
          - entities.Teacher.fields.points_balance
          - state_machines.ClassOrder.points_status
        distinguishing_aspect: |
          Conserved quantity: Teacher.points_balance (points). Forward action
          submit (+awarded_total_points) paired with compensating cancel
          (-awarded_total_points, pinned original not recomputed) MUST restore
          the exact prior balance even though a promotion expired in between.
        test_recipe:
          setup:
            - "School S18 NORMAL, Teacher T18 G3_5 starting at 0 points"
            - "Title INV1 PAPERBACK 1500; October BONUS_POINTS promo 2x ACTIVE at submit"
            - "PUBLISHED cycle C18, offering OIV1, order CO18 with 2x OIV1 (base 30, bonus 30, awarded 60)"
            - "Clock moved to 2026-11-02 AFTER submit so the promo is EXPIRED before the cancel"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S18", address: "18 Dogwood Ct", low_income_program: false }
              as: ClubAdmin
              captures: { s18: $.data.id }
            - call: "POST /club/schools/${s18}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s18}", full_name: "T Eighteen", email: "t18@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { t18: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000130", name: "INV1", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1500, points_cost: 15, rights_holder: "Pub N", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { inv1: $.data.id }
            - call: "POST /club/promotions"
              payload: { name: "Double Oct 18", kind: "BONUS_POINTS", multiplier_bp: 200, starts_on: "2026-10-01", ends_on: "2026-11-01" }
              as: ClubAdmin
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s18}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c18: $.data.id }
            - call: "POST /club/flyer-cycles/${c18}/offerings"
              payload: { title_id: "${inv1}" }
              as: ClubAdmin
              captures: { oiv1: $.data.id }
            - call: "POST /club/flyer-cycles/${c18}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c18}", teacher_id: "${t18}" }
              as: Teacher
              as_user_id: "${t18}"
              captures: { co18: $.data.id }
            - call: "POST /club/class-orders/${co18}/lines"
              payload: { offering_id: "${oiv1}", student_name: "Stu Q", submitted_by: "TEACHER", qty: 2 }
              as: Teacher
              as_user_id: "${t18}"
            - call: "GET /club/class-orders/${co18}"
              payload: {}
              as: Teacher
              as_user_id: "${t18}"
              captures: { co18_v: $.data.version }
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /club/class-orders/${co18}/submit"
              payload: { expected_class_order_version: "${co18_v}" }
              as: Teacher
              as_user_id: "${t18}"
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-02T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /club/class-orders/${co18}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${t18}"
          assert:
            - "At submit (promo ACTIVE): Teacher.${t18}.points_balance == 60"
            - "Cancel AFTER promo expiry still claws back the PINNED 60 (not a recomputed 30)"
            - "Teacher.${t18}.points_balance == 0 — invariant restored exactly"
            - "ClassOrder.${co18}.points_status == CLAWED_BACK"
      - name: acquire_renew_cycle_conserves_royalty_cap_headroom
        grounds:
          - calculations.title_royalty_accrue
          - entities.Title.fields.royalty_cap_cents
          - state_machines.ClassOrder.status.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          DIFFERENT conserved quantity: royalty headroom (royalty_cap_cents -
          royalty_accrued_cents) on the Title ledger. Submit accrues, cancel
          reverses exactly per-unit; accrual+cancel round-trip leaves headroom
          bit-identical to before the round-trip, and license_status returns
          to its prior value.
        test_recipe:
          setup:
            - "School S19 NORMAL, Teacher T19 G3_5"
            - "Title INV2 PAPERBACK 1000 cap 500 (headroom 500)"
            - "PUBLISHED cycle C19, offering OIV2, order CO19 with 3x OIV2 (accrual 270)"
