              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates/${cand_b}/select"
              payload: { selection_rationale: "Youth ideation shares the same service model" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates/${cand_b}/defer"
              payload: { reason: "No school-based capacity in this cycle" }
              as: CommunityBenefitOfficer
            - call: "GET /assessment-cycles/${cyc}"
              payload: {}
              as: CommunityBenefitOfficer
          assert:
            - "after trigger call 1: GET /assessment-cycles/${cyc} reports completed_interview_count == 1"
            - "after trigger call 2: completed_interview_count is still 1 — cancelling a SCHEDULED interview does not touch the completed counter"
            - "trigger calls 5 and 8: both candidates score composite_score == 76.88 (one completed interview, index 100.00)"
            - "after trigger call 6: selected_priority_count == 1; after trigger call 9: selected_priority_count == 2"
            - "trigger call 10: HTTP 200 with data.status == DEFERRED and defer_reason stored"
            - "trigger call 11: data.completed_interview_count == 1, data.selected_priority_count == 1, data.sufficient_indicator_count == 2 and data.review_flag_count == 0"

      - name: indicator_sufficiency_threshold_arms_at_two_subgroups_and_resets_on_void
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.indicator_disparity_ratio.constants.MIN_SUBGROUPS_FOR_DISPARITY
          - entities.HealthIndicator.fields.data_state
          - validations.ERR_INSUFFICIENT_INDICATOR_COVERAGE
        distinguishing_aspect: "Sufficiency is an instantaneous count threshold with a reset: at subgroup_count 1 the indicator is INSUFFICIENT and the cycle cannot leave DATA_COLLECTION, at 2 it flips SUFFICIENT with disparity_ratio 1.60, voiding one subgroup drops it back to INSUFFICIENT with disparity_ratio null while evidence_count stays 2, and re-adding the subgroup re-arms it."
        test_recipe:
          setup:
            - "AssessmentCycle in DATA_COLLECTION with one HealthIndicator (benchmark 12.0) and no data points"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
          trigger:
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
              captures: { dp_white: $.data.id }
            - call: "POST /indicator-data-points/${dp_white}/void"
              payload: { reason: "Subgroup extract superseded by the county" }
              as: DataSteward
            - call: "GET /health-indicators/${ind}"
              payload: {}
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
          assert:
            - "after trigger call 1: the indicator reads latest_overall_value == 18.6, severity_score == 77.50, subgroup_count == 0, disparity_ratio == null, evidence_count == 1, data_state == INSUFFICIENT"
            - "after trigger call 2: subgroup_count == 1 (threshold minus one), disparity_ratio == null, data_state still INSUFFICIENT, and AssessmentCycle.sufficient_indicator_count == 0"
            - "trigger call 3: HTTP 409 with data.error_id == ERR_INSUFFICIENT_INDICATOR_COVERAGE and the cycle stays DATA_COLLECTION"
            - "after trigger call 4: subgroup_count == 2, disparity_ratio == 1.60, data_state == SUFFICIENT, and AssessmentCycle.sufficient_indicator_count == 1"
            - "trigger call 6: data.subgroup_count == 1, data.disparity_ratio == null, data.evidence_count == 2, data.severity_score == 77.50 (the OVERALL row is untouched), data.data_state == INSUFFICIENT, and AssessmentCycle.sufficient_indicator_count is back to 0"
            - "after trigger call 7: data_state == SUFFICIENT again with evidence_count == 3 and sufficient_indicator_count == 1 — the void did not permanently disarm the threshold"
            - "trigger call 8: HTTP 200 with data.status == INPUT_GATHERING"

      - name: cascading_side_effect_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: mid_cycle_evaluation_publish_cascades_objective_revision_and_strategy_behind
          rationale: "That §1.8 instance walks a publish cascade three levels deep (evaluation -> objective revision -> strategy execution axis -> cycle counters) and asserts each level's field values, which is the layer's end-to-end claim."

      - name: dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: posting_valuation_provisional_vs_final_ratio_diverges
          rationale: "That §1.8 instance pins both variants of posting_valued_amount on identical inputs and asserts the ledger delta the PROVISIONAL -> FINAL switch applies at finalize."

  # ===========================================================================
  # From Consistency Model — complexity_profile.consistency_model: immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_total_is_current_in_the_write_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.report_category_totals
          - calculations.report_indirect_and_grand_total
        distinguishing_aspect: "There is no denormalization lag anywhere in the report ledger: each posting's response already carries its own valued_cents, and the very next read of the report shows the recomputed category total, overhead allocation, grand total and percentage of operating expense — 395061 / 19753 / 414814 / 0.35 after one posting and 555061 / 27753 / 582814 / 0.49 after two."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with an OPEN CommunityBenefitReport and no postings"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v0: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1234567, direct_cost_cents: 0, expected_report_version: "${rep_v0}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
              captures: { rep_v1: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "SUBSIDIZED_SERVICES", charges_cents: 500000, direct_cost_cents: 0, expected_report_version: "${rep_v1}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "the report response in setup already carries the copied inputs: cost_to_charge_ratio == 0.3200, valuation_basis == PROVISIONAL, overhead_rate == 0.05, total_valued_cents == 0, benefit_pct_of_expense == 0.00"
            - "trigger call 1: the create response itself contains valued_cents == 395061 and status == POSTED — the valuation is not deferred to a later read"
            - "trigger call 2: data.financial_assistance_total_cents == 395061, subsidized_services_total_cents == 0, total_valued_cents == 395061, overhead_rate == 0.05, indirect_allocation_cents == 19753, grand_total_cents == 414814, benefit_pct_of_expense == 0.35, and data.version == ${rep_v0} + 1"
            - "trigger call 3: the create response contains valued_cents == 160000"
            - "trigger call 4: data.financial_assistance_total_cents == 395061, subsidized_services_total_cents == 160000, total_valued_cents == 555061, indirect_allocation_cents == 27753, grand_total_cents == 582814, benefit_pct_of_expense == 0.49, and data.version == ${rep_v1} + 1 — a second read returns the same figures, so nothing converges after the fact"

      - name: cascade_results_are_visible_to_the_next_read_with_no_settling_period
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.AssessmentCycle.transitions[BOARD_REVIEW->ADOPTED]
        distinguishing_aspect: "The adoption cascade is synchronous: the board-action response already reports status ADOPTED, and reads issued immediately afterwards show the strategy APPROVED and the objective ACTIVE with no intermediate or stale values."
        test_recipe:
          setup:
            - "AssessmentCycle in BOARD_REVIEW with one SUBMITTED strategy carrying one DRAFT objective"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 5 }, attendee_count: 12 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "PRIORITIZATION" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates"
              payload: { cycle_id: "${cyc}", indicator_id: "${ind}", hospital_capacity_score: 70 }
              as: CommunityBenefitOfficer
              captures: { cand: $.data.id }
            - call: "POST /priority-candidates/${cand}/score"
              payload: { scoring_variant: "EQUAL_WEIGHT" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates/${cand}/select"
              payload: { selection_rationale: "Highest composite need with hospital capacity to act" }
              as: CommunityBenefitOfficer
              captures: { cand_v: $.data.version }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "STRATEGY_DEVELOPMENT" }
              as: CommunityBenefitOfficer
            - call: "POST /implementation-strategies"
              payload: { candidate_id: "${cand}", title: "Integrated behavioural health access", authorized_budget_cents: 5000000, expected_candidate_version: "${cand_v}" }
              as: CommunityBenefitOfficer
              captures: { strat: $.data.id }
            - call: "POST /implementation-strategies/${strat}/objectives"
              payload: { metric_name: "Depression screenings completed", baseline_value: 1200, target_value: 2400, target_date: "2027-06-30" }
              as: CommunityBenefitOfficer
              captures: { obj: $.data.id }
            - call: "POST /implementation-strategies/${strat}/submit"
              payload: {}
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "BOARD_REVIEW" }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /assessment-cycles/${cyc}/board-action"
              payload: { action_type: "ADOPT", quorum_present: true, votes_for: 9, votes_against: 2 }
              as: BoardChair
              as_user_id: "u_board_1"
            - call: "GET /implementation-strategies/${strat}"
              payload: {}
              as: BoardChair
              as_user_id: "u_board_1"
            - call: "GET /strategy-objectives/${obj}"
              payload: {}
              as: BoardChair
              as_user_id: "u_board_1"
            - call: "GET /assessment-cycles/${cyc}"
              payload: {}
              as: PublicViewer
          assert:
            - "trigger call 1: the board-action response itself reports data.status == ADOPTED, votes_for_at_adoption == 9, votes_against_at_adoption == 2, adoption_board_user_id == u_board_1 and posture == OPEN"
            - "trigger call 2: data.approval_state == APPROVED and data.execution_state == ON_TRACK on the first read after the cascade"
            - "trigger call 3: data.status == ACTIVE with baseline_value == 1200 and target_value == 2400 locked"
            - "trigger call 4: data.status == ADOPTED and data.public_availability_met == false — a different role's read sees exactly the same state, with no per-reader convergence"
