        claim_type: error_triggerable
        grounds: [ "errors[ERR_UPGRADE_SOLD_OUT]" ]
        excluded_because:
          difficulty_instance: boundary_precision_check / a1_a15_pool_exhaustion_at_capacity
          rationale: "Asserted as the boundary rejection in the §1.8 pool-exhaustion instance."

      - name: err_family_anchor_ineligible_triggerable
        claim_type: error_triggerable
        grounds: [ "errors[ERR_FAMILY_ANCHOR_INELIGIBLE]" ]
        distinguishing_aspect: "A MIN accommodation whose anchor passenger is an adult (born 1990) fails with ERR_FAMILY_ANCHOR_INELIGIBLE/422 at booking time."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, leg L1, two adult passengers PA1 and PA2 (both born 1990)"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
