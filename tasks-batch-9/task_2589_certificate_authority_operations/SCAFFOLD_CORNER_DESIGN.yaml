              payload: { legal_name: "Rbac Denials Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2050", contact_email: "ops@rbacdenials.example", callback_phone: "+1-202-555-0150", credit_limit_cents: 500000 }
