        distinguishing_aspect: |
          Chain 2, depth 3, triggered by a DIFFERENT transition — POST
          /navigation-tasks/{id}/close with outcome FAMILY_REENGAGED: task COMPLETED -> the
          LOST_TO_FOLLOW_UP episode returns to PENDING_SCHEDULING with closure_reason and
          closed_at cleared -> infant.screening_status returns to REFERRED with
          reengagement_count 1 -> risk rescored to 30 / HIGH because the reopened episode is now
          past its benchmark. attempt_count is deliberately NOT reset by the cascade.
