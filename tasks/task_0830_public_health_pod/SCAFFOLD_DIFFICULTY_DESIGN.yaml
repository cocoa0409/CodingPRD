      - name: allocation_priority_score_reads_stored_risk_tier_not_recomputed
        grounds:
          - calculations.allocation_priority_score
          - entities.POD.risk_tier
          - concurrency_rules[allocation-request-create-stale-pod]
          - concurrency_rules[allocation-request-reserve-stale-lot]
        distinguishing_aspect: |
          Mode (c): priority_score depends on POD.risk_tier, and risk_tier is itself
          a derived POD field. The scaffold pins evaluation order: risk_tier is read
          as its already-stored value at reserve time, never recomputed inline. Two
          reserve calls for identical requested_quantity=200, one before and one
          after an intervening POD.restrict changes risk_tier from STANDARD to
          CRITICAL, yield different priority_score (3.0 vs 5.0).
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL, risk_tier=STANDARD"
            - "Countermeasure doses_required=1, unit_cost_cents=1000, reorder_point_quantity=10; central SNS-cache InventoryLot (pod_id null) on_hand_quantity=10000"
            - "AllocationRequest 1 (requested_quantity=200) created and reserved while risk_tier=STANDARD"
            - "POD then manually restricted (risk_tier becomes CRITICAL)"
            - "AllocationRequest 2 (requested_quantity=200) created and reserved while risk_tier=CRITICAL"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Priority Score Plan", jurisdiction_code: "CTY04", target_population: 30000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Priority POD", site_type: FIXED_POD, address: "9 Priority Ave", staffing_capacity_lanes: 5, lane_throughput_rate_per_hour: 20 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v_after_open: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "SNS Reserve Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 1000, reorder_point_quantity: 10 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-SNS1", on_hand_quantity: 10000, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 200, expected_pod_version: "${pod_v_after_open}" }
              as: LogisticsCoordinator
              captures: { ar1_id: $.data.id }
            - call: "POST /allocation-requests/${ar1_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v1}" }
              as: LogisticsCoordinator
              captures: { ar1_priority: $.data.priority_score }
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v_after_ar1_create: $.data.version }
            - call: "POST /pods/${pod_id}/restrict"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v_after_restrict: $.data.version, risk_tier_after_restrict: $.data.risk_tier }
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { lot_v2: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 200, expected_pod_version: "${pod_v_after_restrict}" }
              as: LogisticsCoordinator
              captures: { ar2_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests/${ar2_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v2}" }
              as: LogisticsCoordinator
              captures: { ar2_priority: $.data.priority_score }
          assert:
            - "ar1_priority == 3.0  (round(0.01*min(200,5000) + RISK_TIER_WEIGHT[STANDARD=1], 2) = round(2.0+1,2) = 3.0, POD.risk_tier read as STANDARD at ar1's reserve time)"
            - "risk_tier_after_restrict == 'CRITICAL'"
            - "ar2_priority == 5.0  (round(0.01*200 + RISK_TIER_WEIGHT[CRITICAL=3], 2) = round(2.0+3,2) = 5.0, POD.risk_tier read fresh as CRITICAL at ar2's reserve time — not the STANDARD value cached from ar1's creation)"
            - "ar1_priority != ar2_priority  (3.0 != 5.0: identical requested_quantity=200, different priority_score solely because risk_tier was read at each call's own execution time)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>=2, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pod_operational_restricted_cycle_twice
        grounds:
          - state_machines.POD.OPERATIONAL_to_RESTRICTED
          - state_machines.POD.RESTRICTED_to_OPERATIONAL
        distinguishing_aspect: |
          POD's operational_status cycles OPERATIONAL -> RESTRICTED -> OPERATIONAL ->
          RESTRICTED (A->B->A->B), not a linear pipeline; each leg is independently
          reachable and reversible via /restrict and /resume.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Cycle Plan", jurisdiction_code: "CTY05", target_population: 10000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Cycle POD", site_type: FIXED_POD, address: "5 Cycle St", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
          trigger:
            - call: "POST /pods/${pod_id}/restrict"
              payload: {}
              as: PublicHealthAdmin
              captures: { status_after_restrict1: $.data.operational_status }
            - call: "POST /pods/${pod_id}/resume"
              payload: {}
              as: PublicHealthAdmin
              captures: { status_after_resume: $.data.operational_status }
            - call: "POST /pods/${pod_id}/restrict"
              payload: {}
              as: PublicHealthAdmin
              captures: { status_after_restrict2: $.data.operational_status }
          assert:
            - "status_after_restrict1 == 'RESTRICTED'"
            - "status_after_resume == 'OPERATIONAL'  (cycle returns to a previously-visited state)"
            - "status_after_restrict2 == 'RESTRICTED'  (cycle repeats a second time, proving RESTRICTED is not treated as terminal)"

      - name: dispensing_event_deferred_rescreen_cycle_then_dispense
        grounds:
          - state_machines.DispensingEvent.SCREENED_to_DEFERRED
          - state_machines.DispensingEvent.DEFERRED_to_SCREENED
        distinguishing_aspect: |
          DispensingEvent cycles SCREENED -> DEFERRED -> SCREENED before finally
          reaching the terminal DISPENSED state — a distinct entity from POD's
          cycle, proving the non-linear shape appears on more than one entity.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL; Countermeasure and POD-scoped InventoryLot in place; DispensingEvent REGISTERED then SCREENED"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Rescreen Plan", jurisdiction_code: "CTY06", target_population: 12000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Rescreen POD", site_type: FIXED_POD, address: "7 Rescreen Blvd", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Rescreen Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 900, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${pod_id}", lot_number: "LOT-D1", on_hand_quantity: 50, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Screener One", email: "screener1@example.org", primary_role: SCREENER, mrc_unit: "UnitD", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Cyclic", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_id}"
              captures: { de_id: $.data.id }
            - call: "POST /dispensing-events/${de_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
          trigger:
            - call: "POST /dispensing-events/${de_id}/defer"
              payload: { deferral_reason: "Registrant needs physician clearance" }
              as: ClinicalLead
              captures: { status_after_defer: $.data.status, reason_after_defer: $.data.deferral_reason }
            - call: "POST /dispensing-events/${de_id}/rescreen"
              payload: {}
              as: ClinicalLead
              captures: { status_after_rescreen: $.data.status, reason_after_rescreen: $.data.deferral_reason }
            - call: "POST /dispensing-events/${de_id}/dispense"
              payload: { dispensed_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
              captures: { status_after_dispense: $.data.status }
          assert:
            - "status_after_defer == 'DEFERRED'"
            - "reason_after_defer == 'Registrant needs physician clearance'"
            - "status_after_rescreen == 'SCREENED'  (cycle returns to a previously-visited state)"
            - "reason_after_rescreen == null  (deferral_reason cleared on rescreen)"
            - "status_after_dispense == 'DISPENSED'  (terminal state reached only after the cycle)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (>=2, different triggers, one depth>=3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispense_cascades_to_pod_restrict_and_auto_allocation_request
        grounds:
          - state_machines.DispensingEvent.SCREENED_to_DISPENSED
          - state_machines.POD.OPERATIONAL_to_RESTRICTED
          - entities.AllocationRequest
        distinguishing_aspect: |
          Depth-3 cascade from a single dispense: (1) InventoryLot.on_hand_quantity
          decrements; (2) that decrement crossing reorder_point_quantity causes
          POD.operational_status to auto-restrict (mutation on POD caused by hop 1,
          not by the original dispense call directly); (3) the POD auto-restriction
          causes a new AllocationRequest to be auto-created (mutation caused by
          hop 2). Trigger differs from the Cascade-B instance below.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL"
            - "Countermeasure doses_required=1, reorder_point_quantity=5; POD-scoped InventoryLot on_hand_quantity=6"
            - "DispensingEvent REGISTERED -> SCREENED, dose_count=2"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: BIOTERRORISM_ANTHRAX, title: "Cascade A Plan", jurisdiction_code: "CTY07", target_population: 15000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Cascade A POD", site_type: FIXED_POD, address: "3 Cascade Ct", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "PEP Doxycycline", countermeasure_type: ANTIBIOTIC_PEP, doses_required: 1, unit_cost_cents: 500, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${pod_id}", lot_number: "LOT-E1", on_hand_quantity: 6, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Dispenser One", email: "dispenser1@example.org", primary_role: VACCINATOR, mrc_unit: "UnitE", credential_type: MD_LICENSE, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Cascade", registrant_risk_group: HIGH_RISK_MEDICAL, dose_count: 2 }
              as: Volunteer
              as_user_id: "${staff_id}"
              captures: { de_id: $.data.id }
            - call: "POST /dispensing-events/${de_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
          trigger:
            - call: "POST /dispensing-events/${de_id}/dispense"
              payload: { dispensed_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
          assert:
            - "InventoryLot.${lot_id}.on_hand_quantity == 4  (hop 1: 6 - dose_count(2) = 4)"
            - "InventoryLot.${lot_id}.available_quantity == 4  (reserved_quantity=0)"
            - "POD.${pod_id}.operational_status == 'RESTRICTED'  (hop 2: available_quantity 4 < reorder_point_quantity 5, POD was OPERATIONAL, auto-restricted)"
            - "exactly one AllocationRequest exists with pod_id == ${pod_id}, countermeasure_id == ${cm_id}, source_type == 'SNS_CACHE', status == 'REQUESTED', requested_quantity == 5  (hop 3: auto-created because hop 2 fired; requested_quantity == Countermeasure.reorder_point_quantity)"
            - "POD.${pod_id}.open_allocation_request_count == 1  (incremented by hop 3's auto-creation)"

      - name: revoke_credential_cascades_to_shift_cancel_and_pod_restrict
        grounds:
          - state_machines.StaffMember.VERIFIED_to_REVOKED
          - state_machines.ShiftAssignment.CONFIRMED_to_CANCELLED
          - state_machines.POD.OPERATIONAL_to_RESTRICTED
        distinguishing_aspect: |
          Depth-2 cascade from revoking a credential: (1) the volunteer's sole
          CONFIRMED ShiftAssignment for that POD/role is auto-cancelled (mutation
          on ShiftAssignment caused by the revoke, not requested separately);
          (2) that cancellation drops confirmed coverage for the role to 0, so
          POD.operational_status auto-restricts (mutation on POD caused by hop 1).
          Different trigger from the dispense-originated cascade above.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL"
            - "One verified StaffMember with the sole CONFIRMED ShiftAssignment (VACCINATOR) at this POD"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Cascade B Plan", jurisdiction_code: "CTY08", target_population: 9000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Cascade B POD", site_type: FIXED_POD, address: "4 Cascade Ct", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Sole Vaccinator", email: "solevax@example.org", primary_role: VACCINATOR, mrc_unit: "UnitF", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /staff-members/${staff_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_id}", assigned_role: VACCINATOR, start_time: "2026-03-05T08:00:00Z", end_time: "2026-03-05T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /shift-assignments/${sa_id}/confirm"
              payload: {}
              as: ClinicalLead
          trigger:
            - call: "POST /staff-members/${staff_id}/revoke-credential"
              payload: {}
              as: PublicHealthAdmin
          assert:
            - "StaffMember.${staff_id}.credential_status == 'REVOKED'"
            - "ShiftAssignment.${sa_id}.status == 'CANCELLED'  (hop 1: auto-cancelled because its staff member's credential was revoked)"
            - "POD.${pod_id}.operational_status == 'RESTRICTED'  (hop 2: the cancellation dropped confirmed VACCINATOR coverage at this POD to 0; POD was OPERATIONAL, auto-restricted)"
            - "POD.${pod_id}.committed_staff_hours == 0  (the CONFIRMED->CANCELLED reversal restores committed_staff_hours to its pre-confirm value)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>=2, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: shift_confirm_wrong_state_beats_credential_expired
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair (state, business_safety): a second confirm on an
          already-CONFIRMED ShiftAssignment whose staff member's credential has
          since expired must fail with ERR_INVALID_STATE (priority 6), not
          ERR_CREDENTIAL_EXPIRED (priority 7) — state is checked first.
        test_recipe:
          setup:
            - "StaffMember credential_expires_at=2026-03-02T09:00:00Z; ShiftAssignment confirmed while clock=2026-03-01T00:00:00Z (before expiry)"
            - "clock then advanced to 2026-03-03T00:00:00Z (after expiry); ShiftAssignment is already CONFIRMED"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Priority Pair A Plan", jurisdiction_code: "CTY09", target_population: 8000 }
              as: PublicHealthAdmin
