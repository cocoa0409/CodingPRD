              as: SalesClerk
          trigger:
            - call: "POST /nurseries/${nid}/promotions"
              payload: { name: "Everything Sale", category_scope: "ALL", discount_pct: 20, starts_at: "2026-04-15T00:00:00Z", ends_at: "2026-04-20T00:00:00Z" }
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROMOTION_WINDOW_CONFLICT (409): ALL scope collides with LIVE_PLANT and windows intersect"
            - "An abutting window [2026-05-01,2026-06-01) for the same scope would instead succeed (half-open, no overlap)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_conserves_lot_unit_count
        grounds:
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - calculations.shrink_valuation
          - entities.InventoryLot.fields.qty_on_hand
          - entities.InventoryLot.fields.reserved_qty
        distinguishing_aspect: |
          CONSERVED QUANTITY = physical lot units. The lot invariant
          received_qty == qty_on_hand + reserved_qty + shrink_qty + sold_qty holds
          before allocate and after the compensating cancel: reserving then releasing
          leaves received_qty unchanged and qty_on_hand back to its pre-allocate value.
        test_recipe:
          setup:
            - "Lot received_qty=6 released (qty_on_hand 6, reserved 0). Order line qty=6 confirmed+allocated (reserved 6, qty_on_hand 0)."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-11", name: "Sand", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 700 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 6, unit_cost_cents: 200 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 6 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: InventoryManager
              captures: { ov2: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: { expected_order_version: "${ov2}" }
              as: SalesClerk
          assert:
            - "After cancel: InventoryLot.${lot}.qty_on_hand == 6, reserved_qty == 0, shrink_qty == 0, sold_qty == 0"
            - "Invariant received_qty(6) == qty_on_hand(6)+reserved_qty(0)+shrink_qty(0)+sold_qty(0) holds — zero drift"

      - name: cancel_conserves_loyalty_points
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.Account.fields.points_balance
          - entities.LoyaltyEvent.fields.points_delta
        distinguishing_aspect: |
          CONSERVED QUANTITY = loyalty points (different conserved quantity from lot
          units). Confirm posts a REDEMPTION(-N); cancelling the confirmed order posts
          a REVERSAL(+N); Account.points_balance returns exactly to its pre-confirm
          value with zero drift.
        test_recipe:
          setup:
            - "Account seeded with points_balance=40 via a prior fulfilled order (net 4000 → 40 points at STANDARD). Order #2 confirmed redeeming 30 points (balance drops to 10)."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6, loyalty_accrual_per_dollar: 1, gold_tier_threshold_points: 100000 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-12", name: "Feeder", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 4000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 10, unit_cost_cents: 1000 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            # ---- Order #1: earn 40 points ----
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { o1: $.data.id, o1v0: $.data.version }
            - call: "POST /orders/${o1}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${o1}/confirm"
              payload: { expected_order_version: "${o1v0}" }
              as: SalesClerk
              captures: { o1v1: $.data.version }
            - call: "POST /orders/${o1}/allocate"
              payload: { expected_order_version: "${o1v1}" }
              as: InventoryManager
              captures: { o1v2: $.data.version }
            - call: "POST /orders/${o1}/pay"
              payload: { expected_order_version: "${o1v2}" }
              as: SalesClerk
              captures: { o1v3: $.data.version }
            - call: "POST /orders/${o1}/fulfill"
              payload: { expected_order_version: "${o1v3}" }
              as: InventoryManager
            # ---- Order #2: redeem 30 at confirm ----
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { o2: $.data.id, o2v0: $.data.version }
            - call: "POST /orders/${o2}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${o2}/confirm"
              payload: { requested_redeem_points: 30, expected_order_version: "${o2v0}" }
              as: SalesClerk
              captures: { o2v1: $.data.version }
          trigger:
            - call: "POST /orders/${o2}/cancel"
              payload: { expected_order_version: "${o2v1}" }
              as: SalesClerk
          assert:
            - "Before order #2 confirm: Account.${aid}.points_balance == 40"
            - "After order #2 confirm (redeem 30): Account.${aid}.points_balance == 10"
            - "After cancel (REVERSAL +30): Account.${aid}.points_balance == 40 — restored with zero drift"
