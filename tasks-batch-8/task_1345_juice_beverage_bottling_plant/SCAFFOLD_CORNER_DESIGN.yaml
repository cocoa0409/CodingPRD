            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-HZ", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 8.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_pressure_mpa: 600.0, setpoint_pressure_hold_seconds: 180 }, as: BlendOperator, captures: { prun_id: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_id}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun_id}/complete", payload: { min_pressure_mpa: 600.0, pressure_hold_shortfall_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-HZ", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-HZ" }, as: WarehouseLead, captures: { clot_id: $.data.id } }
            - { call: "POST /v1/container-lots/${clot_id}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-HA", temperature_class: "AMBIENT", pallet_capacity: 50 }, as: PlantManager, captures: { zone_a: $.data.id } }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-HC", temperature_class: "CHILLED", pallet_capacity: 50 }, as: PlantManager, captures: { zone_c: $.data.id } }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/production-runs/${run_id}/start", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_a}" }, as: ProductionPlanner, captures: { err_amb: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_c}" }, as: ProductionPlanner, captures: { ok_status: $.data.production_status } }
          assert:
            - "err_amb == ERR_ZONE_TEMPERATURE_MISMATCH, HTTP 422 (HPP requires CHILLED; AMBIENT rejected)"
            - "ok_status == COMPLETED (retry into CHILLED succeeds)"

  # ===========================================================================
  # Section: errors (claim-extraction-guide Table 6) — §1.8-covered triggers
  # ===========================================================================
  - section: errors
    instances:
      - name: error_label_not_approved_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LABEL_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / schedule_label_safety_beats_batch_referential"
          rationale: "Asserted as the winning error of that §1.8 dual-failure instance (schedule with formula in LABEL_REVIEW)."
      - name: error_label_version_stale_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LABEL_VERSION_STALE]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / start_label_stale_beats_window_temporal"
          rationale: "Asserted as the winning error of that §1.8 instance (start with label_version_pinned 1 vs current 2)."
      - name: error_process_not_validated_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROCESS_NOT_VALIDATED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / release_requires_validated_process_run"
          rationale: "First trigger call of that §1.8 instance asserts ERR_PROCESS_NOT_VALIDATED on release with a DEVIATED governing run."
      - name: error_batch_not_released_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BATCH_NOT_RELEASED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / schedule_requires_released_batch"
          rationale: "That §1.8 instance asserts ERR_BATCH_NOT_RELEASED when scheduling against a QA_PASSED batch."
      - name: error_minimum_run_not_met_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MINIMUM_RUN_NOT_MET]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / minimum_run_exactly_met_vs_one_below"
          rationale: "That §1.8 instance triggers ERR_MINIMUM_RUN_NOT_MET at planned_units 499 (boundary just below the inclusive 500)."
      - name: error_reblend_limit_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REBLEND_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / reblend_limit_at_exactly_two"
          rationale: "That §1.8 instance asserts ERR_REBLEND_LIMIT_EXCEEDED on the third adjustment attempt."
      - name: error_tank_window_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TANK_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / tank_closed_interval_flat_gap"
          rationale: "That §1.8 instance triggers ERR_TANK_WINDOW_CONFLICT at touching and 1-minute-short tank windows."
      - name: error_line_window_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LINE_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / line_half_open_directional_changeover"
          rationale: "That §1.8 instance triggers ERR_LINE_WINDOW_CONFLICT in both changeover directions (75-min and 15-min buffers)."
      - name: error_zone_capacity_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ZONE_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / zone_capacity_equality_boundary"
          rationale: "That §1.8 instance triggers ERR_ZONE_CAPACITY_EXCEEDED when a second pallet would exceed capacity 1."
      - name: error_customer_not_active_on_confirm_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / confirm_requires_customer_active"
          rationale: "That §1.8 instance asserts ERR_CUSTOMER_NOT_ACTIVE on confirm with a SUSPENDED customer; §1.9 adds the order-placement path in shipment_order_create_date_and_customer_gates."

  # ===========================================================================
  # Section: rbac (claim-extraction-guide Table 7)
  # ===========================================================================
  - section: rbac
    instances:
      - name: role_denial_sweep_on_exclusive_operations
        claim_type: role_denied
        grounds:
          - roles.FinanceClerk
          - roles.ProductDeveloper
          - roles.BlendOperator
          - roles.QAInspector
          - roles.ProductionPlanner
          - roles.WarehouseLead
          - roles.CustomerServiceRep
          - roles.LabelComplianceReviewer
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          Nine cross-role denials in one sweep — every role attempting another
          role's exclusive operation gets 403 ERR_INSUFFICIENT_PERMISSIONS,
          including on real, existing resources (authorization is checked
          before any business rule).
        test_recipe:
          setup:
            - "ACTIVE customer with a DRAFT formula and one PLACED order (real ids for the denial calls)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "RbacCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "RB-1", name: "Rbac Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-15", units_requested: 100 }, as: CustomerServiceRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-RB", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "RB-2", name: "Wrong Role", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: FinanceClerk, captures: { e1: $.data.error_id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: ProductDeveloper, as_user_id: "dev-1", captures: { e2: $.data.error_id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/payments", payload: { amount_cents: 100 }, as: PlantManager, captures: { e3: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: BlendOperator, as_user_id: "op-1", captures: { e4: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.0 }, as: QAInspector, as_user_id: "qa-1", captures: { e5: $.data.error_id } }
            - { call: "POST /v1/shipment-orders/${ord_id}/allocate", payload: { expected_shipment_order_version: "${ord_v}" }, as: ProductionPlanner, captures: { e6: $.data.error_id } }
            - { call: "POST /v1/ops-runs", payload: {}, as: WarehouseLead, captures: { e7: $.data.error_id } }
            - { call: "POST /v1/shipment-orders/${ord_id}/pick", payload: {}, as: CustomerServiceRep, captures: { e8: $.data.error_id } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: LabelComplianceReviewer, as_user_id: "rev-1", captures: { e9: $.data.error_id } }
          assert:
            - "e1 == ERR_INSUFFICIENT_PERMISSIONS (FinanceClerk cannot create formulas)"
            - "e2 == ERR_INSUFFICIENT_PERMISSIONS (ProductDeveloper cannot approve credit)"
            - "e3 == ERR_INSUFFICIENT_PERMISSIONS (PlantManager cannot post payments)"
            - "e4 == ERR_INSUFFICIENT_PERMISSIONS (BlendOperator cannot give QA verdicts)"
            - "e5 == ERR_INSUFFICIENT_PERMISSIONS (QAInspector cannot record blends)"
            - "e6 == ERR_INSUFFICIENT_PERMISSIONS (ProductionPlanner cannot allocate orders)"
            - "e7 == ERR_INSUFFICIENT_PERMISSIONS (WarehouseLead cannot run ops epochs)"
            - "e8 == ERR_INSUFFICIENT_PERMISSIONS (CustomerServiceRep cannot pick)"
            - "e9 == ERR_INSUFFICIENT_PERMISSIONS (LabelComplianceReviewer cannot submit reviews)"
            - "All nine responses are HTTP 403"

      - name: sod_qa_verdict_and_disposition
        claim_type: segregation_of_duties
        grounds:
          - state_machines.Batch.AWAITING_QA_to_QA_PASSED
          - state_machines.ProcessRun.DEVIATED_to_DISPOSITION_RELEASED
          - errors[ERR_SOD_QA_SELF_APPROVAL]
          - entities.Batch.fields.blended_by_user_id
        distinguishing_aspect: |
          QA segregation of duties binds on two endpoints: the operator who
          recorded the blend (X-User-ID op-1, stamped into
          blended_by_user_id) cannot pass the QA verdict nor disposition the
          deviated process run — a different QA user (qa-1) can do both.
        test_recipe:
          setup:
            - "Customer; DRAFT formula; tank; batch blended and recorded by BlendOperator op-1 (AWAITING_QA)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "SodQa", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "SQ-1", name: "Sod QA", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-SQ", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1", captures: { b_blender: $.data.blended_by_user_id } }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "op-1", captures: { err_verdict: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { b_status: $.data.status } }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_id: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_id}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun_id}/complete", payload: { min_temp_c: 86.5, time_below_setpoint_seconds: 30 }, as: BlendOperator, as_user_id: "op-1", captures: { p_status: $.data.status } }
            - { call: "POST /v1/process-runs/${prun_id}/qa-disposition", payload: { disposition: "RELEASE" }, as: QAInspector, as_user_id: "op-1", captures: { err_disp: $.data.error_id } }
            - { call: "POST /v1/process-runs/${prun_id}/qa-disposition", payload: { disposition: "RELEASE" }, as: QAInspector, as_user_id: "qa-1", captures: { p_end: $.data.status, b_end: $.data.status } }
          assert:
            - "b_blender == op-1 (stamped at record-blend)"
            - "err_verdict == ERR_SOD_QA_SELF_APPROVAL, HTTP 403 (verdict by the blending operator)"
            - "b_status == QA_PASSED (different QA user passes)"
            - "p_status == DEVIATED (86.5 >= 86.0 and 30 <= 60 -> MINOR)"
            - "err_disp == ERR_SOD_QA_SELF_APPROVAL, HTTP 403 (disposition by the blending operator)"
            - "p_end == DISPOSITION_RELEASED and the batch becomes PROCESSED (qa-1 disposition succeeds)"

      - name: sod_label_self_review
        claim_type: segregation_of_duties
        grounds:
          - state_machines.LabelClaimReview.PENDING_to_APPROVED
          - errors[ERR_SOD_LABEL_SELF_REVIEW]
          - entities.Formula.fields.submitted_by_user_id
        distinguishing_aspect: |
          Label segregation of duties: the ProductDeveloper user id stamped as
          submitted_by_user_id (dev-1) cannot approve its own submission as a
          LabelComplianceReviewer; a different reviewer (rev-1) approves and
          the formula flips to APPROVED with label_version 1.
        test_recipe:
          setup:
            - "Customer; DRAFT formula submitted for review by dev-1 (review PENDING)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "SodLbl", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "SL-1", name: "Sod Label", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["VITAMIN_C"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, fv: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id, rev_snap: $.data.claims_snapshot } }
          trigger:
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "dev-1", captures: { err_sod: $.data.error_id } }
            - { call: "GET /v1/label-reviews/${rev_id}", payload: {}, as: Any, captures: { rev_mid: $.data.status } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1", captures: { rev_end: $.data.status, rev_reviewer: $.data.reviewer_user_id } }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { f_status: $.data.status, f_lv: $.data.label_version, f_sub: $.data.submitted_by_user_id } }
          assert:
            - "err_sod == ERR_SOD_LABEL_SELF_REVIEW, HTTP 403 (reviewer == submitted_by_user_id)"
            - "rev_mid == PENDING (failed approval changes nothing)"
            - "rev_end == APPROVED and rev_reviewer == rev-1"
            - "f_status == APPROVED and f_lv == 1 and f_sub == dev-1 (submitter marker retained)"
            - "rev_snap == [VITAMIN_C] (claims snapshot frozen at submission)"

      - name: customer_contact_ownership_scope
        claim_type: role_denied
        grounds:
          - roles.CustomerContact
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          CustomerContact is entity_backed:CustomerAccount: placing an order
          where customer_id == X-User-ID succeeds, but the same user placing
          an order for a different customer is 403
          ERR_INSUFFICIENT_PERMISSIONS, while a CustomerServiceRep may place
          for any customer.
        test_recipe:
          setup:
            - "Customers A and B ACTIVE, each with a DRAFT formula (FA for A, FB for B)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "OwnA", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_a: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_a}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/customer-accounts", payload: { name: "OwnB", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_b: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_b}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_a}", formula_code: "OA-1", name: "Own A Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_a: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_b}", formula_code: "OB-1", name: "Own B Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_b: $.data.id } }
          trigger:
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_a}", formula_id: "${form_a}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-15", units_requested: 100 }, as: CustomerContact, as_user_id: "${cust_a}", captures: { ok_ord: $.data.status } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_b}", formula_id: "${form_b}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-15", units_requested: 100 }, as: CustomerContact, as_user_id: "${cust_a}", captures: { err_cross: $.data.error_id } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_b}", formula_id: "${form_b}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-15", units_requested: 100 }, as: CustomerServiceRep, captures: { csr_ord: $.data.status } }
          assert:
            - "ok_ord == PLACED (CustomerContact acting on its own customer account)"
            - "err_cross == ERR_INSUFFICIENT_PERMISSIONS, HTTP 403 (X-User-ID != customer_id)"
            - "csr_ord == PLACED (CustomerServiceRep is not ownership-scoped)"

  # ===========================================================================
  # Section: cross_cutting_layers (claim-extraction-guide, complexity layers)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_submit_label_review_stale
        claim_type: stale_version_rejection
        grounds:
          - concurrency_rules[label-review-submit-stale-formula]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC on Formula.version: after a successful submit bumps the version
          to 2, a second submit carrying expected_formula_version 1 is rejected
          412; carrying the current 2 it succeeds and supersedes the prior
          PENDING review.
        test_recipe:
          setup:
            - "Customer; DRAFT formula (version 1)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "OccLbl", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "OL-1", name: "Occ Label", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, fv: $.data.version } }
          trigger:
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev1: $.data.id } }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { fv2: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { err_stale: $.data.error_id } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv2}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev2: $.data.id, rev2_status: $.data.status } }
            - { call: "GET /v1/label-reviews/${rev1}", payload: {}, as: Any, captures: { rev1_status: $.data.status } }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { fv3: $.data.version } }
          assert:
            - "err_stale == ERR_STALE_VERSION, HTTP 412 (expected ${fv} but formula already at ${fv2})"
            - "rev2_status == PENDING (current-version submit succeeds)"
            - "rev1_status == SUPERSEDED (the second submit retires the first review)"
            - "fv3 == 3 (each submit bumps Formula.version by exactly 1)"

      - name: occ_run_schedule_stale
        claim_type: stale_version_rejection
        grounds:
          - concurrency_rules[run-schedule-stale-run]
          - entities.ProductionRun.fields.label_version_pinned
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC on ProductionRun.version: after a successful schedule bumps the
          run to version 3, re-scheduling with the pre-schedule version 2 is
          412 ERR_STALE_VERSION; with the current version it reaches the state
          machine and fails 409 ERR_RUN_STATE_INVALID — and the successful
          schedule pinned label_version_pinned == 1.
        test_recipe:
          setup:
            - "Full pipeline up to a CONFIRMED run (version 2 after confirm)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "OccRun", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
