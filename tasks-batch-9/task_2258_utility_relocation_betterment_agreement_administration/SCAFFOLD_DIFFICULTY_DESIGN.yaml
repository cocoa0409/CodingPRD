  - rule_id: boundary_precision_check
    instances:
      - name: participation_tier_boundary_at_five_million_net_allowable
        grounds:
          - calculations.agreement_state_share_settlement
          - entities.ReimbursementAgreement.fields.participation_tier_pct
          - entities.ReimbursementAgreement.fields.state_share_cents
          - endpoints.POST_/uro/agreements
        distinguishing_aspect: |
          Metric: participation_tier_pct (and the state_share_cents it scales), measured at
          POST /uro/agreements. TIER_1_CEILING_CENTS is 5000000 and the comparison is
          N <= ceiling, so N exactly 5000000 stays at tier 100 while N of 5000001 - one cent more -
          drops to tier 95 and cuts the state share from 5000000 to 4750001, a 249999-cent cliff
          created by a single cent of net allowable cost.
        test_recipe:
          setup:
            - "A public-agency-free owner whose indirect_cost_rate_pct is 0.00, so net allowable equals the plan estimate exactly and the boundary is reachable to the cent."
            - "Two facilities, each carried to an APPROVED plan with proposed_capacity_ratio 1.00 and replacement_in_kind_cost_cents equal to estimated_cost_cents, so betterment_ratio is 0.000000 and no betterment credit interferes."
            - "Plan A estimated_cost_cents 5000000 (exactly at the tier-1 ceiling); plan B estimated_cost_cents 5000001 (one cent above)."
            - "not_to_exceed_cents is set to the priority-28 floor for each agreement: 5000000 and 5000001."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Minor Relocations", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
