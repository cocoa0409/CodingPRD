            - "period_start 2026-09-01 (exactly previous period_end + 1): created, gross_fee == 41.10 (${inv2_gross}; 99999.73 x 50bps x 30/365)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: break_adjust_reopen_conserves_position_quantity
        grounds:
          - state_machines.ReconciliationBreak.RESOLVED_to_OPEN
          - calculations.break_variance
        distinguishing_aspect: |
          Conserved quantity = Position.quantity: resolve(ADJUST_POSITION)
          moves it 1000 -> 900 and the compensating reopen restores exactly
          1000 via prior_book_quantity — zero drift after the round trip.
        test_recipe:
          setup:
            - "Fund/class/security with position qty 1000; break with counterparty_quantity 900 (variance -100)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant, captures: { pos_id: "$.data.id" } }
            - { call: "POST /reconciliation-breaks", payload: { fund_id: "${fund_id}", position_id: "${pos_id}", break_type: "CUSTODIAN_POSITION", break_date: "2026-08-04", counterparty_quantity: 900 }, as: FundAccountant, captures: { brk_id: "$.data.id", brk_var: "$.data.variance" } }
          trigger:
            - { call: "POST /reconciliation-breaks/${brk_id}/resolve", payload: { resolution_type: "ADJUST_POSITION" }, as: FundController }
            - { call: "GET /positions/${pos_id}", payload: {}, as: FundController, captures: { qty_mid: "$.data.quantity" } }
            - { call: "POST /reconciliation-breaks/${brk_id}/reopen", payload: {}, as: FundController, captures: { brk_status: "$.data.status", brk_res: "$.data.resolution_type" } }
            - { call: "GET /positions/${pos_id}", payload: {}, as: FundController, captures: { qty_end: "$.data.quantity" } }
          assert:
            - "Break variance at creation == -100 (${brk_var})"
            - "After resolve: quantity == 900 (${qty_mid}); break recorded prior_book_quantity 1000"
            - "After reopen: quantity == 1000 (${qty_end}) — invariant restored exactly; break ${brk_status} == OPEN with resolution_type cleared (${brk_res} == null)"
      - name: distribution_declare_cancel_conserves_retained_income
        grounds:
          - state_machines.Distribution.DECLARED_to_CANCELLED
          - calculations.distribution_per_share
          - entities.ShareClass.fields.retained_income
        distinguishing_aspect: |
          Conserved quantity = ShareClass.retained_income (a money balance, a
          different quantity type than share counts): declaration snapshots but
          does not move the balance, and cancelling the DECLARED distribution
          leaves retained_income exactly 51.00 — payment is the only transition
          allowed to move it.
        test_recipe:
          setup:
            - "Base kit, FINAL NavRecord 2026-08-04; INCOME_POSTING 51.00 -> retained_income 51.00"
            - "Distribution declared (snapshots only)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "INCOME_POSTING", activity_date: "2026-08-05", amount: 51.00 }, as: FundAccountant, captures: { retained0: "$.data.retained_income" } }
            - { call: "POST /distributions", payload: { share_class_id: "${class_id}", declaration_date: "2026-08-05", ex_date: "2026-08-06", record_date: "2026-08-07", payable_date: "2026-08-10" }, as: FundAccountant, captures: { dist_id: "$.data.id" } }
            - { call: "GET /share-classes/${class_id}", payload: {}, as: FundController, captures: { retained1: "$.data.retained_income" } }
          trigger:
            - { call: "POST /distributions/${dist_id}/cancel", payload: {}, as: FundController, captures: { dist_status: "$.data.status" } }
            - { call: "GET /share-classes/${class_id}", payload: {}, as: FundController, captures: { retained2: "$.data.retained_income" } }
          assert:
            - "After INCOME_POSTING: retained_income == 51.00 (${retained0})"
            - "After declare (snapshot): retained_income still == 51.00 (${retained1}) — declaration does not move the balance"
            - "After cancel: ${dist_status} == CANCELLED and retained_income == 51.00 (${retained2}) — declare+cancel conserves retained_income exactly"
