      trigger:
      - call: POST /exchanges/${ex_id}/application
        payload:
          expected_purchase_version: ${pur_v3}
          expected_performance_version: ${perf_v}
        as: CustomerService
        captures:
          fee: $.data.fee_cents
          val: $.data.value_returned_cents
