          setup:
            - "Site S zone ZONE_5A labels 20; INVASIVE variety VI and clean variety VG, both approved for ZONE_5A"
            - "Both lots ACTIVE (certified 90.00); 3 good packets and 1 invasive packet packed"
            - "Member M home site S, SUSPENDED via 3 swept-overdue checkouts on good packets"
