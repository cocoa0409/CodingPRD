              as: UnitDirector
              captures: { post_score: $.data.rating_score, post_tier: $.data.rating_tier, post_cnt: $.data.published_complaint_count }
          assert:
            - "pre-switch captures: ${pre_score} == 80 and ${pre_tier} == B and ${pre_cnt} == 2 (LIFETIME: demerits 15+5=20 -> 100-20=80, tier B at >=70)"
            - "post-switch: ${post_score} == 91 and ${post_tier} == A (ROLLING_12M: round_half_up(15*0.25 + 5) = round_half_up(8.75) = 9 -> 100-9=91, tier A at >=90)"
            - "${post_cnt} == 2 (variant switch changes scoring only, not the published set)"
            - "Complaint.${k1}.publication_status == PUBLISHED and Complaint.${k2}.publication_status == PUBLISHED throughout"
