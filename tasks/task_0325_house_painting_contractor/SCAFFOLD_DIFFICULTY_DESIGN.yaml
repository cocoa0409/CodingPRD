              payload: {}
              as: Estimator
              captures: { v: $.data.version, rev_before: $.data.revised_total_cents }
            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v}", reason: "add study", action: "ADD_SURFACE", new_label: "Study", new_surface_kind: "INTERIOR", new_area_sqft: 300, new_coats: 2, new_prep_level: "HEAVY", new_paint_product_id: "${p1}" }
              as: Estimator
              captures: { co: $.data.id }
            - call: "POST /painting/change-orders/${co}/submit"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /painting/change-orders/${co}/reject"
              payload: {}
              as: Customer
            - call: "GET /painting/projects/${proj}"
              payload: {}
              as: ProjectManager
              captures: { rev_after: $.data.revised_total_cents }
          assert:
            - "Project.${proj}.revised_total_cents == 8913 before and after reject (invariant: money conserved, zero drift)"
            - "ChangeOrder.${co}.status == REJECTED"

      - name: crew_assignment_cancel_conserves_scheduled_day_count
        grounds:
          - state_machines.CrewAssignment.SCHEDULED_to_CANCELLED
          - entities.CrewMember.fields.scheduled_day_count
        distinguishing_aspect: |
          A different conserved quantity = count of scheduled days (CrewMember.scheduled_day_count). Forward
          action (create assignment, +3 days) then compensating action (cancel, -3 days) returns the count to
          its starting value (0) with zero drift.
        test_recipe:
          setup:
            - "Crew member M1 with scheduled_day_count 0; one SCHEDULED assignment ca1 over [03-10,03-12] (day_count 3)."
          setup_api_calls:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-10", end_date: "2026-03-12" }
              as: ProjectManager
              captures: { ca1: $.data.id }
            - call: "GET /painting/crew-members/${cm1}"
              payload: {}
              as: ProjectManager
              captures: { after_assign: $.data.scheduled_day_count }
          trigger:
            - call: "POST /painting/crew-assignments/${ca1}/cancel"
              payload: {}
              as: ProjectManager
            - call: "GET /painting/crew-members/${cm1}"
              payload: {}
              as: ProjectManager
              captures: { after_cancel: $.data.scheduled_day_count }
          assert:
            - "CrewMember.${cm1}.scheduled_day_count == 3 after assignment create"
            - "CrewMember.${cm1}.scheduled_day_count == 0 after cancel (count conserved, zero drift)"
            - "CrewAssignment.${ca1}.status == CANCELLED"
