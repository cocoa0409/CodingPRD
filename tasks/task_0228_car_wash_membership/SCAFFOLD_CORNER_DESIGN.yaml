      - name: account_holder_cannot_act_on_other_account_forbidden
        claim_type: Role denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "An entity_backed AccountHolder whose X-User-ID is account A registering a vehicle under account B -> ERR_FORBIDDEN (403); ownership identity check."
        test_recipe:
          setup: ["Two INDIVIDUAL accounts A and B."]
          setup_api_calls:
