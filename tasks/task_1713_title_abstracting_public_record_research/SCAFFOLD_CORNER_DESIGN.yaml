        distinguishing_aspect: "Covered by the rounding-order difficulty instance."
        excluded_because:
          difficulty_instance: rush_premium_rounded_once_on_subtotal
          rationale: "The pinned subtotal-level round_half_up is asserted there with literal 51406."

