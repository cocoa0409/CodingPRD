            - "FruitLot.${lot_a}.disposition_status == REPACKED and FruitLot.${lot_a}.cold_chain_status == COOLED and FruitLot.${lot_a}.available_lbs == 0.00"

  - section: errors
    instances:
      - name: path_existence_errors_are_triggerable_for_every_collection
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BLOCK_NOT_FOUND]
          - errors[ERR_CREW_NOT_FOUND]
          - errors[ERR_PICKER_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_PAYROLL_RUN_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_TUNNEL_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_WATER_TEST_NOT_FOUND]
          - validations[priority=65]
        distinguishing_aspect: |
          Every one of the eleven collections has its OWN 404 id rather than a
          shared generic one, and each is reachable from a single-resource GET
          with a syntactically valid but unknown id. In particular
          ERR_WATER_TEST_NOT_FOUND (priority 65) is reachable even though
          WaterTest is append-only with no action endpoints, and the response body
          still carries the standard envelope with data.error_id and data.message.
        test_recipe:
          setup:
            - "An empty system; only the logical clock is pinned so the run is deterministic."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "GET /berry-ops/blocks/blk-missing"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { e1: $.data.error_id }
            - call: "GET /berry-ops/crews/crew-missing"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { e2: $.data.error_id }
            - call: "GET /berry-ops/pickers/pk-missing"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { e3: $.data.error_id }
            - call: "GET /berry-ops/harvest-windows/win-missing"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { e4: $.data.error_id }
            - call: "GET /berry-ops/pick-sessions/ses-missing"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { e5: $.data.error_id }
            - call: "GET /berry-ops/payroll-runs/run-missing"
              payload: {}
              as: PayrollClerk
              as_user_id: "clerk-1"
              captures: { e6: $.data.error_id }
            - call: "GET /berry-ops/fruit-lots/lot-missing"
              payload: {}
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { e7: $.data.error_id }
            - call: "GET /berry-ops/cooling-tunnels/tun-missing"
              payload: {}
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { e8: $.data.error_id }
            - call: "GET /berry-ops/buyer-commitments/com-missing"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
              captures: { e9: $.data.error_id }
            - call: "GET /berry-ops/lot-allocations/alloc-missing"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
              captures: { e10: $.data.error_id }
            - call: "GET /berry-ops/water-tests/wt-missing"
