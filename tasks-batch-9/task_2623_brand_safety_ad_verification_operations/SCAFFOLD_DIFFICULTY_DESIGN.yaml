          setup:
            - "VIEWABILITY methodology with coverage_rate_floor 0.70 and ivt_rate_ceiling 0.02."
            - "Two batches on the same page and format, windows an hour apart to clear the 60-second buffer; neither has any IVT finding, so ivt_rate is 0.0000 and only coverage decides the branch."
            - "Batch AT: measured 10000, measurable 7000, in_view 7000, avg_in_view_seconds 1.2, avg_in_view_pixel_pct 0.6."
            - "Batch BELOW: measured 10000, measurable 6999, in_view 6999, same timings."
