  - section: cross_cutting_complexity_layers
    instances:
      - name: slot_creation_rejects_a_stale_session_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.slot-create-stale-session
          - endpoints.POST_/sessions/{sessionId}/slots
          - errors.ERR_STALE_SESSION_VERSION
          - validations.p8
        distinguishing_aspect: |
          The §1.2.1 rule for the Session parent, tested on its declared
          write_endpoint and occ_field. Three properties are separated: the version
          the chair read is invalidated by the chair's own earlier successful write
          (not by another actor), the stale attempt is refused at p8 before any of
          the slot-coherence gates at p14 and p19 can speak, and a refused attempt
          leaves Session.version untouched so an immediate re-read plus retry
          succeeds. The stale value is derived from a capture rather than written as
          a literal, so the test cannot accidentally agree with the live row.
