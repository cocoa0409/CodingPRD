scenario: |
  Generate task harder than expert level!

  2561. Keg Pool Tracking & Asset Recovery (MicroStar Logistics): keg issuance to brewers with
  per-fill pricing and float sizing, scanning at fill, distribution, retail and return points,
  dwell-time analysis and float replenishment triggers, lost or damaged keg assessment and brewer
  chargeback, cleaning, inspection and pressure-test cycle records, distributor cooperation
  agreements and return incentives, cross-brand keg misdelivery reconciliation, stainless
  commodity value and theft investigation

domain_name: keg-pool-asset-recovery
api_prefix: "/"

complexity_profile:
  difficulty_level: expert_plus            # above §0.4 Expert: 14 entities, 56 endpoints, 51 ordered validations, 67 errors, 16 calculations, 11 state machines (84 transitions)
  primary_archetype: quota_allocation      # a finite stainless keg float is issued, reserved, circulated, recovered, written off
  secondary_archetype: event_sourcing      # every keg's custody state is a projection of its ordered ScanEvent stream (late arrivals replay it)
  complexity_layers:
    - optimistic_concurrency               # OCC on FloatAgreement.version, Keg.version, ReconciliationClaim.version (§1.2.1)
    - cascading_side_effects               # scan -> accrual -> distributor tier; uphold -> chargeback -> brewer status -> agreement posture
    - dual_variant_calculation             # keg_loss_value (REPLACEMENT_COST vs DEPRECIATED_BOOK); brewer_loss_rate (TRAILING_90D vs LIFETIME)
    - rate_threshold_triggers              # pool posture thresholds, float replenishment threshold, dwell incentive bands, probation balance

  entity_topology: graph
  # Kegs, brewers, distributors, service centers and claims form a many-to-many movement graph:
  # a Keg points at KegPool + Brewer + Distributor + IssuanceOrder + TheftInvestigation, a
  # ReconciliationClaim points at two different Brewers and at a prior claim of its own type.

  state_machine_shape: cyclic
  # Keg.custody_state is a closed loop (IN_FLOAT -> ISSUED_TO_BREWER -> FILLED -> IN_TRADE ->
  # AT_RETAIL -> IN_SERVICE -> IN_FLOAT); ReconciliationClaim loops SUBMITTED <-> COUNTERED;
  # ServiceCycle loops QUARANTINED -> PRESSURE_TESTED; Keg and LossAssessment additionally carry
  # two independent state dimensions each; KegPool.posture and FloatAgreement.float_posture are
  # derived aggregates that gate child operations.

  relationship_patterns:
    - one_to_many          # KegPool -> Keg, IssuanceOrder -> Keg, Keg -> ScanEvent
    - many_to_many         # Brewer <-> KegPool through FloatAgreement
    - self_referential     # ReconciliationClaim.supersedes_claim_id -> ReconciliationClaim.id
    - polymorphic          # ScanEvent.party_type selects which of brewer_id / distributor_id / retail_account_code identifies the scanning party
    - cross_aggregate      # LossAssessment reaches across Keg, Brewer, CommodityIndex and TheftInvestigation aggregates

  role_model: segregation_of_duties
  # Peer ownership (Brewer owns fills, Distributor owns trade scans, ServiceTechnician owns service
  # steps, AssetRecoveryAnalyst owns assessments) PLUS two hard segregation rules keyed on
  # X-User-ID: the analyst who opened a LossAssessment may not resolve it, and the technician who
  # recorded a pressure test may not release the ServiceCycle.

  consistency_model: immediate
  # Every derived counter (pool census, pool posture, agreement float_posture, brewer balance,
  # distributor accrual ledger) is recomputed inside the mutating request. Only CLOCK-dependent
  # derivations (dwell flags, service overdue) are advanced by the replenishment sweep.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Brewer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the brewing company that leases pool kegs.
        constraints: 1..120 chars, non-blank
      - name: brand_code
        type: string
        source: input
        description: Collar brand code stamped on kegs filled by this brewer; the misdelivery detector compares scanned collar codes against it.
        constraints: 2..8 chars, uppercase A-Z0-9, globally unique across Brewer
      - name: status
        type: enum
        source: system
        description: "Commercial standing: ACTIVE brewers may be issued float, PROBATION brewers may still fill but their agreements are posture-suspended, SUSPENDED brewers may not be issued float."
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum outstanding chargeback balance tolerated before new issuance is refused.
        default: 40000
        constraints: ">= 0"
      - name: chargeback_balance_cents
        type: integer
        source: computed
        description: "Derived money ledger: SUM(LossAssessment.net_chargeback_cents WHERE brewer_id = this.id AND chargeback_status IN {ISSUED, SETTLED}). Conserved quantity of compensating-invariant chargeback_ledger_conserved."
        default: 0
      - name: lifetime_fill_count
        type: integer
        source: computed
        description: Count of ScanEvent rows WHERE scan_point = FILL AND brewer_id = this.id (all time, no window).
        default: 0
      - name: upheld_loss_count
        type: integer
        source: computed
        description: Count of LossAssessment rows WHERE brewer_id = this.id AND assessment_status = UPHELD (all time).
        default: 0
      - name: loss_rate_bp_trailing_90d
        type: integer
        source: computed
        description: Basis-point loss rate over the trailing 90-day window, variant TRAILING_90D of calculation brewer_loss_rate_bp. Recomputed on every LossAssessment resolution and on every FILL scan.
        default: 0
      - name: loss_rate_bp_lifetime
        type: integer
        source: computed
        description: Basis-point loss rate over all history, variant LIFETIME of calculation brewer_loss_rate_bp.
        default: 0
      - name: status_reason
        type: string
        source: system
        description: Free-text reason recorded by the last status change (operator input or the cascade rule name that forced it).
        default: null

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Wholesaler that moves filled kegs to retail and returns empties.
        constraints: 1..120 chars, non-blank
      - name: region_code
        type: string
        source: input
        description: Two-letter operating region used to match distributors to pools.
        constraints: exactly 2 chars, uppercase
      - name: cooperation_tier
        type: enum
        source: system
        description: "Cooperation-agreement tier that multiplies return incentives: NONE pays nothing, BRONZE 1.00x, SILVER 1.15x, GOLD 1.30x."
        default: NONE
        constraints: "NONE | BRONZE | SILVER | GOLD"
      - name: return_incentive_rate_cents_per_keg
        type: integer
        source: input
        description: Base per-keg return incentive before dwell band and cooperation multiplier.
        default: 250
        constraints: 0..2000
      - name: status
        type: enum
        source: system
        description: SUSPENDED distributors may not receive DISTRIBUTION scans.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: total_returns_count
        type: integer
        source: computed
        description: Count of ReturnIncentiveAccrual rows WHERE distributor_id = this.id AND accrual_type = RETURN_DWELL AND status IN {ACCRUED, PAID, CLAWED_BACK}.
        default: 0
      - name: on_time_returns_count
        type: integer
        source: computed
        description: Count of the same accrual set additionally filtered to dwell_days <= 45 (DWELL_DISTRIBUTOR_LIMIT_DAYS).
        default: 0
      - name: on_time_return_pct
        type: number
        source: computed
        description: round_half_up(100 * on_time_returns_count / total_returns_count, 2), or 0.00 when total_returns_count = 0. Drives cooperation tier promotion.
        default: 0.00
      - name: incentive_accrual_cents
        type: integer
        source: computed
        description: "Derived incentive ledger: SUM(ReturnIncentiveAccrual.incentive_cents WHERE distributor_id = this.id AND status IN {ACCRUED, PAID}). Conserved quantity of compensating-invariant incentive_ledger_conserved."
        default: 0
      - name: avg_dwell_days
        type: number
        source: computed
        description: round_half_up(mean of ReturnIncentiveAccrual.dwell_days WHERE distributor_id = this.id AND accrual_type = RETURN_DWELL AND status IN {ACCRUED, PAID, CLAWED_BACK}, 2); 0.00 when the set is empty.
        default: 0.00
      - name: cooperation_effective_date
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) on which the current cooperation_tier took effect.
        default: null

  - name: KegPool
    parent: null
    common_fields: true
    fields:
      - name: pool_code
        type: string
        source: input
        description: Operator-facing code for this asset class (size + valve + region).
        constraints: 3..16 chars, globally unique across KegPool
      - name: size_liters
        type: integer
        source: input
        description: Nominal keg volume in litres.
        constraints: "IN {20, 30, 50, 58}"
      - name: stainless_weight_kg
        type: number
        source: input
        description: Empty stainless mass of one keg in this pool; multiplied by the commodity index to value scrap and theft exposure.
        constraints: "> 0, <= 60, at most 2 decimals"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: New-keg replacement cost used as the gross basis of REPLACEMENT_COST loss assessments.
        constraints: "> 0"
      - name: region_code
        type: string
        source: input
        description: Two-letter region this pool serves.
        constraints: exactly 2 chars, uppercase
      - name: restrict_threshold_pct
        type: integer
        source: input
        description: available_pct at or above which posture is OPEN; below it posture is at most RESTRICTED.
        default: 25
        constraints: 0..100
      - name: freeze_threshold_pct
        type: integer
        source: input
        description: available_pct below which posture is FROZEN.
        default: 10
        constraints: "0..100, must be < restrict_threshold_pct"
      - name: restricted_max_kegs_per_order
        type: integer
        source: input
        description: Hard cap on requested_keg_count accepted while posture = RESTRICTED.
        default: 2
        constraints: ">= 1"
      - name: kegs_total
        type: integer
        source: computed
        description: Count of every Keg row WHERE pool_id = this.id, including written-off kegs.
        default: 0
      - name: kegs_available
        type: integer
        source: computed
        description: Count of Keg WHERE pool_id = this.id AND custody_state = IN_FLOAT.
        default: 0
      - name: kegs_circulating
        type: integer
        source: computed
        description: "Count of Keg WHERE pool_id = this.id AND custody_state IN {ISSUED_TO_BREWER, FILLED, IN_TRADE, AT_RETAIL}."
        default: 0
      - name: kegs_servicing
        type: integer
        source: computed
        description: "Count of Keg WHERE pool_id = this.id AND custody_state IN {IN_SERVICE, QUARANTINED}."
        default: 0
      - name: kegs_held
        type: integer
        source: computed
        description: Count of Keg WHERE pool_id = this.id AND custody_state = EVIDENCE_HOLD.
        default: 0
      - name: kegs_written_off
        type: integer
        source: computed
        description: "Count of Keg WHERE pool_id = this.id AND custody_state IN {LOST, STOLEN, SCRAPPED}."
        default: 0
      - name: available_pct
        type: number
        source: computed
        description: round_half_up(100 * kegs_available / kegs_total, 2); 0.00 when kegs_total = 0.
        default: 0.00
      - name: posture
        type: enum
        source: computed
        description: Derived aggregate gate over all child float operations, per calculation pool_posture.
        default: FROZEN
        constraints: "OPEN | RESTRICTED | FROZEN"

  - name: Keg
    parent: KegPool
    common_fields: true
    fields:
      - name: pool_id
        type: string
        source: input
        description: FK -> KegPool.id; the asset class this physical keg belongs to. Immutable after creation.
      - name: asset_tag
        type: string
        source: input
        description: Laser-etched asset tag scanned at every touch point.
        constraints: "3..24 chars, globally unique across every pool (validation priority 38): an asset tag is etched on the shell, so the same tag may not be re-used when a keg is re-homed to another pool"
      - name: custody_state
        type: enum
        source: system
        description: Physical custody dimension, projected from this keg's ordered ScanEvent stream plus allocation, service and write-off transitions.
        default: IN_FLOAT
        constraints: "IN_FLOAT | ISSUED_TO_BREWER | FILLED | IN_TRADE | AT_RETAIL | IN_SERVICE | QUARANTINED | EVIDENCE_HOLD | LOST | STOLEN | SCRAPPED"
      - name: service_state
        type: enum
        source: system
        description: Independent certification dimension that evolves separately from custody_state; gates FILL scans and allocation eligibility.
        default: SERVICE_OK
        constraints: "SERVICE_OK | SERVICE_DUE | SERVICE_OVERDUE | SERVICE_FAILED"
      - name: dwell_flag
        type: enum
        source: system
        description: Clock-derived dwell classification, advanced only by the replenishment sweep per calculation dwell_days.
        default: WITHIN_LIMIT
        constraints: "WITHIN_LIMIT | APPROACHING | OVERDUE"
      - name: fill_count
        type: integer
        source: computed
        description: Count of FILL ScanEvent rows for this keg in the replayed stream, plus the fill_count seeded at import.
        default: 0
      - name: fills_at_last_pressure_test
        type: integer
        source: system
        description: Value of fill_count when the last PASS pressure test was released; the pressure-test interval is measured against it.
        default: 0
      - name: last_pressure_test_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant of the last PASS pressure test. Import-settable via POST /pools/{pool_id}/kegs; when the caller omits it the server records the keg's own created_at (the factory acceptance test), so this field is NEVER null and every certification comparison is well defined. Thereafter maintained by ServiceCycle release."
        default: "the keg's created_at" 
      - name: current_brewer_id
        type: string
        source: system
        description: FK -> Brewer.id; brewer currently holding or last issued this keg. Set at allocation, retained until the keg is released back to float.
        default: null
      - name: current_distributor_id
        type: string
        source: system
        description: FK -> Distributor.id; distributor last recorded taking custody at a DISTRIBUTION scan. Retained after return for recovery and clawback lookups.
        default: null
      - name: filling_brewer_id
        type: string
        source: system
        description: FK -> Brewer.id; brewer recorded on the most recent FILL scan; the chargeable party of first resort for LossAssessment.
        default: null
      - name: issuance_order_id
        type: string
        source: system
        description: FK -> IssuanceOrder.id; order that allocated this keg. Cleared when the keg returns to IN_FLOAT.
        default: null
      - name: theft_investigation_id
        type: string
        source: system
        description: FK -> TheftInvestigation.id; investigation currently holding this keg as evidence. Cleared on investigation close.
        default: null
      - name: filled_brand_code
        type: string
        source: system
        description: Collar brand code recorded at the most recent FILL scan; misdelivery detection compares later scans' brand_code_scanned against this value.
        default: null
      - name: dwell_started_at
        type: datetime
        source: system
        description: Start instant of the current custody spell; reset by every accepted ScanEvent and by allocation.
        default: null
      - name: distributor_custody_started_at
        type: datetime
        source: system
        description: Start instant of the current distributor accountability spell; set at a DISTRIBUTION scan, cleared at the RETURN scan that closes it. Survives RETAIL scans.
        default: null
      - name: cumulative_dwell_days
        type: integer
        source: computed
        description: Sum of whole-day lengths of every closed custody spell in the replayed scan stream, per calculation dwell_days.
        default: 0
      - name: last_scanned_at
        type: datetime
        source: system
        description: Maximum scanned_at over this keg's ScanEvent rows; a new scan with an earlier scanned_at is a late arrival and forces a replay.
        default: null
      - name: scan_count
        type: integer
        source: computed
        description: Count of ScanEvent rows WHERE keg_id = this.id.
        default: 0
      - name: pre_hold_custody_state
        type: enum
        source: system
        description: Custody state captured at the instant an evidence hold began; restored verbatim when the hold is resumed, which is what keeps the pool census conserved across the hold/resume pair.
        default: null
        constraints: same enum as custody_state
      - name: misdelivery_open
        type: boolean
        source: system
        description: True while an unreconciled cross-brand scan exists on this keg; cleared when a ReconciliationClaim reaches AGREED or the keg is refilled.
        default: false
      - name: assessment_open
        type: boolean
        source: system
        description: "True while a LossAssessment for this keg sits in assessment_status IN {PROPOSED, DISPUTED}."
        default: false
      - name: stainless_scrap_value_cents
        type: integer
        source: computed
        description: round_half_up(pool.stainless_weight_kg * latest_commodity_index.usd_cents_per_kg * SCRAP_RECOVERY_PCT), recomputed on read of the keg and pinned into assessments, per calculation stainless_scrap_value.
        default: 0

  - name: ScanEvent
    parent: Keg
    common_fields: false
    fields:
      - name: keg_id
        type: string
        source: input
        description: FK -> Keg.id; the scanned asset (supplied in the path).
      - name: scan_point
        type: enum
        source: input
        description: Touch point at which the tag was read.
        constraints: "FILL | DISTRIBUTION | RETAIL | RETURN"
      - name: party_type
        type: enum
        source: input
        description: Selects which party identifier field is authoritative for this scan (polymorphic party reference).
        constraints: "BREWER | DISTRIBUTOR | RETAIL_ACCOUNT"
      - name: brewer_id
        type: string
        source: input
        description: FK -> Brewer.id; required when party_type = BREWER, forbidden otherwise.
        default: null
      - name: distributor_id
        type: string
        source: input
        description: FK -> Distributor.id; required when party_type = DISTRIBUTOR, forbidden otherwise.
        default: null
      - name: retail_account_code
        type: string
        source: input
        description: Opaque retail account code; required when party_type = RETAIL_ACCOUNT, forbidden otherwise.
        default: null
      - name: scanned_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the tag was physically read; must not exceed the logical clock.
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant at which the scan reached the server; differs from scanned_at for late arrivals.
      - name: brand_code_scanned
        type: string
        source: input
        description: Collar brand code read off the keg at this touch point.
        constraints: 2..8 chars, uppercase A-Z0-9
      - name: misdelivery_detected
        type: boolean
        source: computed
        description: True when scan_point IN {DISTRIBUTION, RETAIL, RETURN} and brand_code_scanned differs from the keg's filled_brand_code.
        default: false
      - name: is_late_arrival
        type: boolean
        source: computed
        description: True when scanned_at is strictly earlier than the keg's last_scanned_at at the moment this scan was accepted.
        default: false
      - name: custody_state_after
        type: enum
        source: computed
        description: Keg.custody_state produced by replaying the stream up to and including this scan.
        constraints: same enum as Keg.custody_state
      - name: dwell_days_closed
        type: integer
        source: computed
        description: Whole-day length of the custody spell this scan closed; 0 for the first scan of a keg.
        default: 0
      - name: fill_charge_net_cents
        type: integer
        source: computed
        description: Net per-fill charge posted to the float agreement by this scan, per calculation fill_charge_net; null for non-FILL scans.
        default: null

  - name: FloatAgreement
    parent: null
    common_fields: true
    fields:
      - name: brewer_id
        type: string
        source: input
        description: FK -> Brewer.id; the lessee.
      - name: pool_id
        type: string
        source: input
        description: FK -> KegPool.id; the asset class leased.
      - name: float_size_kegs
        type: integer
        source: input
        description: Contracted float size; the ceiling on kegs simultaneously held by this brewer under this agreement.
        constraints: 1..500
      - name: per_fill_rate_cents
        type: integer
        source: input
        description: Base price charged per FILL scan before dwell surcharge and volume discount.
        constraints: "> 0"
      - name: replenishment_threshold_pct
        type: integer
        source: input
        description: Percentage of float_size_kegs at or below which the float is TIGHT and replenishment is triggered.
        default: 20
        constraints: 0..100
      - name: min_fills_per_month
        type: integer
        source: input
        description: Contractual minimum monthly fills; recorded for reporting, not enforced by any transition.
        default: 0
        constraints: ">= 0"
      - name: effective_date
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) on which the agreement was activated.
        default: null
      - name: status
        type: enum
        source: system
        description: Contract lifecycle dimension, independent of float_posture.
        default: DRAFT
        constraints: "DRAFT | ACTIVE | TERMINATED"
      - name: float_posture
        type: enum
        source: computed
        description: Derived operational gate over issuance and FILL scans, per calculation float_posture.
        default: HEALTHY
        constraints: "HEALTHY | TIGHT | SUSPENDED"
      - name: kegs_issued_count
        type: integer
        source: computed
        description: Count of Keg WHERE issuance_order_id IN (orders of this agreement whose status IN {ALLOCATED, PARTIALLY_ALLOCATED, DISPATCHED}).
        default: 0
      - name: kegs_at_brewer_count
        type: integer
        source: computed
        description: "Count of Keg WHERE current_brewer_id = this.brewer_id AND pool_id = this.pool_id AND custody_state IN {ISSUED_TO_BREWER, FILLED}."
        default: 0
      - name: pending_replenishment_kegs
        type: integer
        source: computed
        description: max(0, float_size_kegs - kegs_at_brewer_count) when float_posture = TIGHT, else 0.
        default: 0
      - name: billed_fills_count
        type: integer
        source: computed
        description: Count of FILL ScanEvent rows charged to this agreement.
        default: 0
      - name: billed_amount_cents
        type: integer
        source: computed
        description: Running invoice total; SUM of fill_charge_net_cents over the FILL scans charged to this agreement, in charge order.
        default: 0
      - name: terminated_reason
        type: string
        source: system
        description: Reason captured at termination.
        default: null

  - name: IssuanceOrder
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> FloatAgreement.id; the agreement whose float this order draws on.
      - name: brewer_id
        type: string
        source: computed
        description: FK -> Brewer.id; denormalized from the agreement at creation and never re-derived.
      - name: requested_keg_count
        type: integer
        source: input
        description: Number of kegs the brewer asks for.
        constraints: ">= 1"
      - name: allow_partial
        type: boolean
        source: input
        description: When true, an under-supplied allocation succeeds as PARTIALLY_ALLOCATED instead of failing.
        default: false
      - name: status
        type: enum
        source: system
        description: Allocation lifecycle.
        default: REQUESTED
        constraints: "REQUESTED | ALLOCATED | PARTIALLY_ALLOCATED | DISPATCHED | CANCELLED"
      - name: allocated_keg_count
        type: integer
        source: computed
        description: Number of kegs actually reserved by the allocation selector.
        default: 0
      - name: allocation_shortfall
        type: integer
        source: computed
        description: requested_keg_count - allocated_keg_count at allocation time.
        default: 0
      - name: per_fill_price_cents_pinned
        type: integer
        source: computed
        description: FloatAgreement.per_fill_rate_cents copied at allocation time; later agreement edits do not retro-price this order's fills.
        default: null
      - name: allocated_keg_ids
        type: array
        source: computed
        description: Asset ids of the reserved kegs in allocation order (ranking order of the selector); reporting convenience only, never an input to any decision.
        default: []
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant the order was dispatched to the brewer.
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: Reason captured at cancellation.
        default: null

  - name: ServiceCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Cleaning and inspection facility that runs keg service cycles.
        constraints: 1..120 chars
      - name: region_code
        type: string
        source: input
        description: Two-letter region served.
        constraints: exactly 2 chars, uppercase
      - name: concurrent_cycle_capacity
        type: integer
        source: input
        description: Number of service cycles whose occupancy windows may cover the same instant at this centre.
        constraints: 1..50
      - name: intake_buffer_hours
        type: integer
        source: input
        description: "Wash-line intake block: each cycle received here reserves the window [received_at, received_at + intake_buffer_hours], closed at BOTH ends, during which no further cycle may be received at this centre (calculation service_center_intake, validation priority 36). The block is anchored at received_at and is consumed regardless of how or when the cycle is later released."
        default: 4
        constraints: 0..48
      - name: open_cycle_count
        type: integer
        source: computed
        description: "Count of ServiceCycle WHERE service_center_id = this.id AND stage IN {RECEIVED, CLEANED, INSPECTED, PRESSURE_TESTED, QUARANTINED}."
        default: 0

  - name: ServiceCycle
    parent: null
    common_fields: true
    fields:
      - name: keg_id
        type: string
        source: input
        description: FK -> Keg.id; the keg being cleaned, inspected and pressure tested.
      - name: service_center_id
        type: string
        source: input
        description: FK -> ServiceCenter.id; the facility whose occupancy this cycle consumes.
      - name: stage
        type: enum
        source: system
        description: Position in the cleaning/inspection/pressure-test pipeline; QUARANTINED is a defect branch that can loop back to PRESSURE_TESTED after a PASS retest.
        default: RECEIVED
        constraints: "RECEIVED | CLEANED | INSPECTED | PRESSURE_TESTED | RELEASED | QUARANTINED"
      - name: received_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the keg was booked into the centre; opens this cycle's occupancy window.
      - name: cleaned_at
        type: datetime
        source: system
        description: Instant recorded by the CLEAN step.
        default: null
      - name: caustic_cycle_minutes
        type: integer
        source: system
        description: Duration of the caustic wash recorded by the CLEAN step.
        default: null
      - name: inspected_at
        type: datetime
        source: system
        description: Instant recorded by the INSPECT step.
        default: null
      - name: inspection_result
        type: enum
        source: system
        description: Visual and seam inspection outcome; MAJOR_DEFECT quarantines the keg.
        default: null
        constraints: "PASS | MINOR_DEFECT | MAJOR_DEFECT"
      - name: pressure_tested_at
        type: datetime
        source: system
        description: Instant recorded by the PRESSURE_TEST step.
        default: null
      - name: pressure_test_psi
        type: number
        source: system
        description: Test pressure held during the PRESSURE_TEST step.
        default: null
      - name: pressure_test_result
        type: enum
        source: system
        description: Pressure test outcome; FAIL quarantines the keg and sets service_state = SERVICE_FAILED.
        default: null
        constraints: "PASS | FAIL"
      - name: pressure_test_performed_by_user_id
        type: string
        source: system
        description: X-User-ID of the technician who recorded the most recent PRESSURE_TEST step; the release segregation rule compares against it.
        default: null
      - name: released_at
        type: datetime
        source: system
        description: Instant the keg was released back to float; closes the occupancy window (which then blocks for intake_buffer_hours more).
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who released the cycle.
        default: null
      - name: quarantine_reason
        type: string
        source: system
        description: Which step quarantined the keg (INSPECTION_MAJOR_DEFECT or PRESSURE_TEST_FAIL).
        default: null

  - name: LossAssessment
    parent: null
    common_fields: true
    fields:
      - name: keg_id
        type: string
        source: input
        description: FK -> Keg.id; the lost, unreturned, stolen or damaged asset.
      - name: brewer_id
        type: string
        source: computed
        description: "FK -> Brewer.id; chargeable party resolved at creation as keg.filling_brewer_id when set, else keg.current_brewer_id."
      - name: commodity_index_id
        type: string
        source: computed
        description: FK -> CommodityIndex.id; the index row pinned at creation by calculation stainless_scrap_value, so later index postings never re-price this assessment.
      - name: theft_investigation_id
        type: string
        source: system
        description: FK -> TheftInvestigation.id; set when the assessment was raised from an investigation close, else null.
        default: null
      - name: cause
        type: enum
        source: input
        description: "Loss cause; drives scrap eligibility and brewer liability share."
        constraints: "LOST_IN_TRADE | DAMAGED_BEYOND_REPAIR | NOT_RETURNED_DWELL | STOLEN_SUSPECTED"
      - name: assessment_basis
        type: enum
        source: input
        description: Valuation variant the analyst elected; both are contractually valid and produce different numbers for identical inputs.
        constraints: "REPLACEMENT_COST | DEPRECIATED_BOOK"
      - name: gross_value_cents
        type: integer
        source: computed
        description: Basis-dependent gross asset value before scrap credit, per calculation keg_loss_value.
        default: 0
      - name: scrap_credit_cents
        type: integer
        source: computed
        description: Stainless recovery credit; non-zero only when cause = DAMAGED_BEYOND_REPAIR (keg physically in hand), per calculation stainless_scrap_value.
        default: 0
      - name: assessed_value_cents
        type: integer
        source: computed
        description: max(0, gross_value_cents - scrap_credit_cents).
        default: 0
      - name: brewer_liability_pct_bp
        type: integer
        source: computed
        description: "Cause-keyed liability share in basis points: LOST_IN_TRADE 6000, DAMAGED_BEYOND_REPAIR 10000, NOT_RETURNED_DWELL 10000, STOLEN_SUSPECTED 0."
        default: 0
      - name: net_chargeback_cents
        type: integer
        source: computed
        description: round_half_up(assessed_value_cents * brewer_liability_pct_bp / 10000); the amount that enters Brewer.chargeback_balance_cents when the chargeback is issued.
        default: 0
      - name: dwell_days_at_assessment
        type: integer
        source: computed
        description: Keg dwell_days at creation time per calculation dwell_days; evidence for NOT_RETURNED_DWELL causes.
        default: 0
      - name: assessment_status
        type: enum
        source: system
        description: Adjudication dimension, independent of chargeback_status.
        default: PROPOSED
        constraints: "PROPOSED | DISPUTED | UPHELD | WAIVED | SUPERSEDED"
      - name: chargeback_status
        type: enum
        source: system
        description: Money dimension, independent of assessment_status; NONE until an uphold issues it.
        default: NONE
        constraints: "NONE | ISSUED | SETTLED | REVERSED"
      - name: settled_amount_cents
        type: integer
        source: system
        description: Amount recorded by the SETTLE action; must equal net_chargeback_cents.
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who opened the assessment; the segregation rule compares the resolver against it.
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who upheld or waived the assessment.
        default: null
      - name: dispute_reason
        type: string
        source: system
        description: Reason supplied by the brewer when disputing.
        default: null
      - name: resolution_notes
        type: string
        source: system
        description: Notes captured at uphold or waive.
        default: null

  - name: ReconciliationClaim
    parent: null
    common_fields: true
    fields:
      - name: keg_id
        type: string
        source: input
        description: FK -> Keg.id; the cross-branded asset in dispute.
      - name: claimant_distributor_id
        type: string
        source: computed
        description: FK -> Distributor.id; resolved from the acting Distributor's X-User-ID at creation.
      - name: owning_brewer_id
        type: string
        source: computed
        description: FK -> Brewer.id; brewer recorded as keg.filling_brewer_id on the evidence scan.
      - name: misdelivered_to_brewer_id
        type: string
        source: input
        description: "FK -> Brewer.id; supplied by the claimant and required to be the Brewer whose brand_code equals the evidence scan's brand_code_scanned. Naming any other brewer is refused by validation priority 30 as ERR_NO_MISDELIVERY_EVIDENCE."
      - name: supersedes_claim_id
        type: string
        source: input
        description: "FK -> ReconciliationClaim.id; prior claim on the same keg this one replaces; the prior claim's status must be IN {REJECTED, WITHDRAWN}."
        default: null
      - name: evidence_scanned_at
        type: datetime
        source: input
        description: "Supplied by the claimant; must equal the scanned_at of a ScanEvent for this keg WHERE misdelivery_detected = true. The 30-day claim window is measured from it."
      - name: claimed_offset_cents
        type: integer
        source: input
        description: Handling offset the distributor claims for sorting and returning another brand's keg.
        constraints: 1..50000
      - name: counter_offset_cents
        type: integer
        source: system
        description: Most recent counter-offer amount.
        default: null
      - name: agreed_offset_cents
        type: integer
        source: system
        description: Amount fixed when the claim reached AGREED; equals counter_offset_cents when a counter was outstanding, else claimed_offset_cents.
        default: null
      - name: round_count
        type: integer
        source: computed
        description: Number of COUNTER responses recorded; capped at MAX_CLAIM_ROUNDS.
        default: 0
      - name: status
        type: enum
        source: system
        description: Negotiation state; SUBMITTED and COUNTERED alternate as rounds accumulate.
        default: SUBMITTED
        constraints: "SUBMITTED | COUNTERED | AGREED | REJECTED | WITHDRAWN"
      - name: last_responder_role
        type: enum
        source: system
        description: Role that recorded the most recent response; the next COUNTER must come from the other side of the table.
        default: null
        constraints: "Brewer | Distributor"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the claim reached a terminal status.
        default: null

  - name: ReturnIncentiveAccrual
    parent: null
    common_fields: true
    fields:
      - name: distributor_id
        type: string
        source: computed
        description: FK -> Distributor.id; the party earning the incentive.
      - name: keg_id
        type: string
        source: computed
        description: FK -> Keg.id; the returned or reconciled asset.
      - name: claim_id
        type: string
        source: computed
        description: FK -> ReconciliationClaim.id; set only for accrual_type = RECONCILIATION_OFFSET.
        default: null
      - name: accrual_type
        type: enum
        source: computed
        description: RETURN_DWELL rows are minted by RETURN scans; RECONCILIATION_OFFSET rows are minted when a claim reaches AGREED.
        constraints: "RETURN_DWELL | RECONCILIATION_OFFSET"
      - name: dwell_days
        type: integer
        source: computed
        description: Whole days of distributor accountability closed by the RETURN scan; 0 for RECONCILIATION_OFFSET rows.
        default: 0
      - name: tier_pct_bp
        type: integer
        source: computed
        description: "Dwell band factor in basis points selected by calculation return_incentive: 10000 / 6000 / 2500 / 0."
        default: 0
      - name: cooperation_multiplier_bp
        type: integer
        source: computed
        description: "Cooperation tier multiplier in basis points in force at accrual time: NONE 0, BRONZE 10000, SILVER 11500, GOLD 13000."
        default: 0
      - name: incentive_cents
        type: integer
        source: computed
        description: Per-keg incentive rounded to the cent before any summation, per calculation return_incentive.
        default: 0
      - name: triggering_scanned_at
        type: datetime
        source: computed
        description: scanned_at of the RETURN scan that minted this accrual; null for RECONCILIATION_OFFSET rows.
        default: null
      - name: status
        type: enum
        source: system
        description: PAID rows have been remitted; CLAWED_BACK rows were reversed by a theft write-off.
        default: ACCRUED
        constraints: "ACCRUED | PAID | CLAWED_BACK"
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of remittance.
        default: null
      - name: clawback_reason
        type: string
        source: system
        description: Reason recorded when the accrual was clawed back.
        default: null

  - name: TheftInvestigation
    parent: null
    common_fields: true
    fields:
      - name: pool_id
        type: string
        source: input
        description: FK -> KegPool.id; pool whose stainless exposure is under investigation.
      - name: suspect_distributor_id
        type: string
        source: input
        description: FK -> Distributor.id; distributor whose incentive accruals are clawed back if the investigation closes as written off.
        default: null
      - name: commodity_index_id
        type: string
        source: computed
        description: FK -> CommodityIndex.id; index row pinned when the exposure was last recomputed.
      - name: status
        type: enum
        source: system
        description: Investigation state; EVIDENCE_HOLD may be resumed back to OPEN any number of times before a terminal close.
        default: OPEN
        constraints: "OPEN | EVIDENCE_HOLD | CLOSED_RECOVERED | CLOSED_WRITTEN_OFF"
      - name: held_keg_count
        type: integer
        source: computed
        description: Count of Keg WHERE theft_investigation_id = this.id AND custody_state = EVIDENCE_HOLD.
        default: 0
      - name: attached_keg_count
        type: integer
        source: computed
        description: Count of Keg WHERE theft_investigation_id = this.id.
        default: 0
      - name: stainless_value_at_risk_cents
        type: integer
        source: computed
        description: Aggregate scrap exposure of the attached kegs (rounded per keg, then summed), per calculation stainless_scrap_value.
        default: 0
      - name: opened_reason
        type: string
        source: input
        description: Narrative reason for opening the investigation.
        constraints: 1..500 chars
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who opened the investigation.
      - name: hold_started_at
        type: datetime
        source: system
        description: scanned-clock instant the current evidence hold began.
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of terminal close.
        default: null
      - name: outcome_notes
        type: string
        source: system
        description: Notes recorded at close.
        default: null

  - name: CommodityIndex
    parent: null
    common_fields: false
    fields:
      - name: effective_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) from which this stainless price applies.
        constraints: unique across CommodityIndex
      - name: usd_cents_per_kg
        type: integer
        source: input
        description: Stainless scrap price in US cents per kilogram.
        constraints: "> 0"
      - name: source
        type: string
        source: input
        description: Quoting source label for audit.
        constraints: 2..40 chars

state_machines:
  - entity: Keg
    dimension: custody_state
    initial_state: IN_FLOAT
    terminal_states: [LOST, STOLEN, SCRAPPED]
    transitions:
      - from: IN_FLOAT
        to: ISSUED_TO_BREWER
        trigger: "POST /issuance-orders/{order_id}/allocate"
        actor: PoolOperator
        preconditions:
          - "order.status == REQUESTED"
          - "agreement.status == ACTIVE"
          - "agreement.float_posture != SUSPENDED"
          - "brewer.status != SUSPENDED"
          - "brewer.chargeback_balance_cents < brewer.credit_limit_cents"
          - "pool.posture != FROZEN"
          - "pool.posture == RESTRICTED implies order.requested_keg_count <= pool.restricted_max_kegs_per_order"
          - "order.requested_keg_count <= agreement.float_size_kegs - agreement.kegs_at_brewer_count"
          - "payload.expected_agreement_version == agreement.version"
          - "the keg is one of the top-N candidates of selector allocation_selector (see §1.3)"
        side_effects:
          - "keg.current_brewer_id = agreement.brewer_id; keg.issuance_order_id = order.id"
          - "keg.dwell_started_at = logical clock now; keg.dwell_flag = WITHIN_LIMIT; keg.version += 1"
          - "CASCADE L2 (caused by the keg custody change): pool.kegs_available -= N, pool.kegs_circulating += N, pool.available_pct recomputed"
          - "CASCADE L3 (caused by the pool census change): pool.posture recomputed by calculation pool_posture; pool.version += 1"
          - "CASCADE L4 (caused by the pool posture change): every FloatAgreement WHERE pool_id = pool.id AND status = ACTIVE recomputes float_posture by calculation float_posture; each such agreement's version += 1"
          - "agreement.kegs_issued_count, kegs_at_brewer_count, pending_replenishment_kegs recomputed; agreement.version += 1"
          - "order.status -> ALLOCATED (full) or PARTIALLY_ALLOCATED (allow_partial and short); order.allocated_keg_count, allocation_shortfall, allocated_keg_ids, per_fill_price_cents_pinned = agreement.per_fill_rate_cents"
        note: "Allocation is the only producer of ISSUED_TO_BREWER. Order-level OCC on the agreement is concurrency rule order-allocate-stale-agreement."
      - from: IN_FLOAT
        to: IN_SERVICE
        trigger: "POST /service-cycles"
        actor: PoolOperator
        preconditions:
          - "keg.custody_state == IN_FLOAT (a recertification pull straight off the float; the other legal intake is a keg that is ALREADY IN_SERVICE after a RETURN scan, which books a cycle without any custody move)"
          - "keg.theft_investigation_id == null is NOT required: a keg under investigation may still be serviced"
          - "both resource checks of calculation service_center_intake pass (closed intake window, then aggregate occupancy)"
          - "payload.received_at <= logical clock now"
        side_effects:
          - "cycle created with stage = RECEIVED; centre.open_cycle_count += 1"
          - "keg.custody_state = IN_SERVICE; keg.version += 1"
          - "CASCADE L2: pool.kegs_available -= 1, pool.kegs_servicing += 1, pool.available_pct recomputed; pool.version += 1"
          - "CASCADE L3: pool.posture recomputed, then every ACTIVE FloatAgreement on the pool recomputes float_posture"
        note: "This is the only edge into IN_SERVICE that does not come from a RETURN scan or an EVIDENCE_HOLD resume, and the only one that lowers available_pct, so a maintenance pull can push a thin pool into RESTRICTED or FROZEN."
      - from: ISSUED_TO_BREWER
        to: IN_FLOAT
        trigger: "POST /issuance-orders/{order_id}/cancel"
        actor: PoolOperator
        preconditions:
          - "order.status IN {REQUESTED, ALLOCATED, PARTIALLY_ALLOCATED}"
          - "the keg's custody_state is still ISSUED_TO_BREWER (conditional cascade: kegs already FILLED or beyond are left untouched)"
        side_effects:
          - "keg.current_brewer_id = null; keg.issuance_order_id = null; keg.dwell_started_at = null; keg.dwell_flag = WITHIN_LIMIT; keg.version += 1"
          - "pool census counters and available_pct recomputed, then pool.posture recomputed, then each ACTIVE agreement on the pool recomputes float_posture"
          - "agreement.kegs_issued_count, kegs_at_brewer_count, pending_replenishment_kegs recomputed; agreement.version += 1"
          - "order.status -> CANCELLED; order.cancel_reason set; allocated_keg_ids left as historical record"
        note: "Compensating half of invariant pool_census_conserved: every census counter returns to its pre-allocation value."
      - from: ISSUED_TO_BREWER
        to: FILLED
        trigger: "POST /kegs/{keg_id}/scan with scan_point = FILL"
        actor: Brewer
        preconditions:
          - "keg.issuance_order_id resolves to an order with status == DISPATCHED"
          - "party_type == BREWER and payload.brewer_id == keg.current_brewer_id"
          - "acting X-User-ID == payload.brewer_id when X-User-Role = Brewer"
          - "the FloatAgreement WHERE brewer_id = payload.brewer_id AND pool_id = keg.pool_id has status == ACTIVE AND float_posture != SUSPENDED"
          - "keg.service_state == SERVICE_OK"
          - "payload.brand_code_scanned == brewer.brand_code"
          - "payload.scanned_at <= logical clock now"
          - "no existing ScanEvent for this keg has the same (scan_point, scanned_at)"
          - "payload.scanned_at does not fall strictly inside a closed custody interval of a different party (see validation priority 35)"
        side_effects:
          - "ScanEvent appended; keg.fill_count += 1; keg.filled_brand_code = brand_code_scanned; keg.filling_brewer_id = brewer_id"
          - "the open custody spell closes: keg.cumulative_dwell_days += dwell_days_closed; keg.dwell_started_at = scanned_at; keg.misdelivery_open = false"
          - "agreement.billed_fills_count += 1 and agreement.billed_amount_cents += fill_charge_net_cents computed by calculation fill_charge_net; agreement.version += 1"
          - "brewer.lifetime_fill_count += 1; brewer.loss_rate_bp_trailing_90d and loss_rate_bp_lifetime recomputed by calculation brewer_loss_rate_bp"
          - "if keg.fill_count - keg.fills_at_last_pressure_test >= PRESSURE_TEST_INTERVAL_FILLS then keg.service_state = SERVICE_DUE"
      - from: FILLED
        to: IN_TRADE
        trigger: "POST /kegs/{keg_id}/scan with scan_point = DISTRIBUTION"
        actor: Distributor
        preconditions:
          - "party_type == DISTRIBUTOR and payload.distributor_id is present"
          - "distributor.status == ACTIVE"
          - "acting X-User-ID == payload.distributor_id when X-User-Role = Distributor"
          - "payload.scanned_at <= logical clock now"
          - "no duplicate (scan_point, scanned_at) for this keg; no custody interval conflict"
        side_effects:
          - "ScanEvent appended; keg.current_distributor_id = distributor_id; keg.distributor_custody_started_at = scanned_at"
          - "spell closes: keg.cumulative_dwell_days += dwell_days_closed; keg.dwell_started_at = scanned_at"
          - "if payload.brand_code_scanned != keg.filled_brand_code then scan.misdelivery_detected = true and keg.misdelivery_open = true"
      - from: IN_TRADE
        to: AT_RETAIL
        trigger: "POST /kegs/{keg_id}/scan with scan_point = RETAIL"
        actor: Distributor
        preconditions:
          - "party_type == RETAIL_ACCOUNT and payload.retail_account_code is present"
          - "payload.scanned_at <= logical clock now"
          - "no duplicate (scan_point, scanned_at) for this keg; no custody interval conflict"
        side_effects:
          - "ScanEvent appended; spell closes and keg.dwell_started_at = scanned_at"
          - "keg.distributor_custody_started_at is deliberately NOT cleared: the distributor stays accountable through retail"
          - "misdelivery detection as for DISTRIBUTION"
      - from: IN_TRADE
        to: IN_SERVICE
        trigger: "POST /kegs/{keg_id}/scan with scan_point = RETURN"
        actor: Distributor
        preconditions:
          - "party_type == DISTRIBUTOR and payload.distributor_id == keg.current_distributor_id"
          - "distributor.status == ACTIVE"
          - "payload.scanned_at <= logical clock now; no duplicate; no custody interval conflict"
        side_effects:
          - "CASCADE L1: ScanEvent appended; keg.custody_state = IN_SERVICE; spell closes; keg.dwell_started_at = scanned_at; keg.distributor_custody_started_at = null"
          - "CASCADE L2 (caused by the closed distributor accountability spell): a ReturnIncentiveAccrual row is minted with accrual_type = RETURN_DWELL, dwell_days, tier_pct_bp, cooperation_multiplier_bp and incentive_cents from calculation return_incentive"
          - "CASCADE L3 (caused by the new accrual row): distributor.total_returns_count, on_time_returns_count, on_time_return_pct, avg_dwell_days and incentive_accrual_cents recomputed; distributor.version += 1"
          - "CASCADE L4 (caused by the recomputed on_time_return_pct): cooperation tier promotion per calculation cooperation_tier_promotion may advance distributor.cooperation_tier one step, which re-rates every later accrual"
          - "pool.kegs_circulating -= 1, kegs_servicing += 1; pool.posture recomputed; each ACTIVE agreement on the pool recomputes float_posture"
      - from: AT_RETAIL
        to: IN_SERVICE
        trigger: "POST /kegs/{keg_id}/scan with scan_point = RETURN"
        actor: Distributor
        preconditions:
          - "same as IN_TRADE -> IN_SERVICE"
        side_effects:
          - "same four-link cascade as IN_TRADE -> IN_SERVICE; dwell_days is measured from keg.distributor_custody_started_at, so the retail leg counts against the distributor"
      - from: IN_SERVICE
        to: IN_FLOAT
        trigger: "POST /service-cycles/{cycle_id}/release"
        actor: PoolOperator
        preconditions:
          - "cycle.stage == PRESSURE_TESTED and cycle.pressure_test_result == PASS"
          - "acting X-User-ID != cycle.pressure_test_performed_by_user_id (segregation of duties)"
          - "payload.released_at >= cycle.pressure_tested_at and payload.released_at <= logical clock now"
        side_effects:
          - "cycle.stage = RELEASED; cycle.released_at, released_by_user_id set; centre.open_cycle_count recomputed"
          - "keg.service_state = SERVICE_OK; keg.fills_at_last_pressure_test = keg.fill_count; keg.last_pressure_test_at = cycle.pressure_tested_at"
          - "keg.current_brewer_id = null; keg.issuance_order_id = null; keg.dwell_started_at = released_at; keg.dwell_flag = WITHIN_LIMIT; keg.version += 1"
          - "pool census and available_pct recomputed, then pool.posture, then each ACTIVE agreement's float_posture"
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = INSPECT and inspection_result = MAJOR_DEFECT"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == CLEANED"
          - "cycle.keg_id == keg.id and keg.custody_state == IN_SERVICE"
        side_effects:
          - "cycle.stage = QUARANTINED; cycle.quarantine_reason = INSPECTION_MAJOR_DEFECT; cycle.inspection_result, inspected_at set"
          - "keg.custody_state = QUARANTINED; keg.service_state = SERVICE_FAILED; keg.version += 1"
          - "pool.kegs_servicing is unchanged (both IN_SERVICE and QUARANTINED belong to the servicing bucket), so pool.posture does not move"
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = PRESSURE_TEST and pressure_test_result = FAIL"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == INSPECTED"
          - "cycle.inspection_result IN {PASS, MINOR_DEFECT}"
        side_effects:
          - "cycle.stage = QUARANTINED; cycle.quarantine_reason = PRESSURE_TEST_FAIL; cycle.pressure_test_psi, pressure_test_result, pressure_tested_at, pressure_test_performed_by_user_id set"
          - "keg.custody_state = QUARANTINED; keg.service_state = SERVICE_FAILED; keg.version += 1"
      - from: QUARANTINED
        to: IN_SERVICE
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = PRESSURE_TEST and pressure_test_result = PASS"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == QUARANTINED"
          - "cycle.quarantine_reason == PRESSURE_TEST_FAIL (a MAJOR_DEFECT quarantine cannot be retested; the keg must be scrapped)"
        side_effects:
          - "cycle.stage = PRESSURE_TESTED; pressure test fields overwritten with the retest values"
          - "keg.custody_state = IN_SERVICE; keg.service_state stays SERVICE_FAILED until release sets SERVICE_OK; keg.version += 1"
        note: "This is the loop edge that makes ServiceCycle non-linear."
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD (cause = DAMAGED_BEYOND_REPAIR)"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "assessment.assessment_status IN {PROPOSED, DISPUTED} and assessment.cause == DAMAGED_BEYOND_REPAIR"
          - "acting X-User-ID != assessment.created_by_user_id (segregation of duties)"
        side_effects:
          - "keg.custody_state = SCRAPPED; keg.assessment_open = false; keg.version += 1"
          - "pool.kegs_servicing -= 1, kegs_written_off += 1, available_pct recomputed; pool.posture recomputed; each ACTIVE agreement's float_posture recomputed"
          - "the chargeback cascade of assessment_status PROPOSED/DISPUTED -> UPHELD fires (see LossAssessment machine)"
      - from: FILLED
        to: LOST
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD (cause IN {LOST_IN_TRADE, NOT_RETURNED_DWELL})"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "assessment.assessment_status IN {PROPOSED, DISPUTED}"
          - "acting X-User-ID != assessment.created_by_user_id"
        side_effects:
          - "keg.custody_state = LOST; keg.assessment_open = false; keg.version += 1"
          - "pool.kegs_circulating -= 1, kegs_written_off += 1; pool.posture recomputed; each ACTIVE agreement's float_posture recomputed"
      - from: IN_TRADE
        to: LOST
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD (cause IN {LOST_IN_TRADE, NOT_RETURNED_DWELL})"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as FILLED -> LOST"
        side_effects:
          - "same as FILLED -> LOST"
      - from: AT_RETAIL
        to: LOST
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD (cause IN {LOST_IN_TRADE, NOT_RETURNED_DWELL})"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as FILLED -> LOST"
        side_effects:
          - "same as FILLED -> LOST"
      - from: IN_TRADE
        to: EVIDENCE_HOLD
        trigger: "POST /theft-investigations/{investigation_id}/status with action = EVIDENCE_HOLD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == OPEN"
          - "keg.theft_investigation_id == investigation.id"
          - "keg.custody_state NOT IN {LOST, STOLEN, SCRAPPED}"
        side_effects:
          - "keg.pre_hold_custody_state = keg.custody_state; keg.custody_state = EVIDENCE_HOLD; keg.version += 1"
          - "pool.kegs_circulating -= 1, kegs_held += 1, available_pct recomputed; pool.posture recomputed; each ACTIVE agreement's float_posture recomputed"
          - "investigation.status = EVIDENCE_HOLD; held_keg_count, stainless_value_at_risk_cents recomputed; hold_started_at set"
      - from: EVIDENCE_HOLD
        to: IN_TRADE
        trigger: "POST /theft-investigations/{investigation_id}/status with action = RESUME"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
        side_effects:
          - "keg.custody_state = keg.pre_hold_custody_state; keg.pre_hold_custody_state = null; keg.version += 1"
          - "pool census counters restored to their pre-hold values, pool.posture recomputed, each ACTIVE agreement's float_posture recomputed"
          - "investigation.status = OPEN; held_keg_count recomputed to 0; hold_started_at = null"
        note: "Compensating half of invariant pool_census_conserved variant B; the hold/resume pair is repeatable, which is what makes TheftInvestigation cyclic."
      - from: IN_FLOAT
        to: EVIDENCE_HOLD
        trigger: "POST /theft-investigations/{investigation_id}/status with action = EVIDENCE_HOLD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as IN_TRADE -> EVIDENCE_HOLD"
        side_effects:
          - "same as IN_TRADE -> EVIDENCE_HOLD, except the census move is pool.kegs_available -= 1, kegs_held += 1 (so available_pct DROPS and the pool can be pushed into RESTRICTED or FROZEN by a hold)"
        note: "A theft hold may seize a keg out of ANY non-terminal custody bucket, not just IN_TRADE; that is exactly what invariant pool_census_conserved variant B means by held kegs drawn from three different buckets."
      - from: FILLED
        to: EVIDENCE_HOLD
        trigger: "POST /theft-investigations/{investigation_id}/status with action = EVIDENCE_HOLD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as IN_TRADE -> EVIDENCE_HOLD"
        side_effects:
          - "same as IN_TRADE -> EVIDENCE_HOLD (census move is pool.kegs_circulating -= 1, kegs_held += 1)"
      - from: AT_RETAIL
        to: EVIDENCE_HOLD
        trigger: "POST /theft-investigations/{investigation_id}/status with action = EVIDENCE_HOLD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as IN_TRADE -> EVIDENCE_HOLD"
        side_effects:
          - "same as IN_TRADE -> EVIDENCE_HOLD (census move is pool.kegs_circulating -= 1, kegs_held += 1)"
      - from: IN_SERVICE
        to: EVIDENCE_HOLD
        trigger: "POST /theft-investigations/{investigation_id}/status with action = EVIDENCE_HOLD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as IN_TRADE -> EVIDENCE_HOLD"
          - "any open ServiceCycle on the keg is left untouched at its current stage; the hold does not advance or cancel it"
        side_effects:
          - "same as IN_TRADE -> EVIDENCE_HOLD (census move is pool.kegs_servicing -= 1, kegs_held += 1)"
      - from: EVIDENCE_HOLD
        to: IN_FLOAT
        trigger: "POST /theft-investigations/{investigation_id}/status with action = RESUME"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
          - "keg.pre_hold_custody_state == IN_FLOAT"
        side_effects:
          - "same as EVIDENCE_HOLD -> IN_TRADE"
      - from: EVIDENCE_HOLD
        to: FILLED
        trigger: "POST /theft-investigations/{investigation_id}/status with action = RESUME"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
          - "keg.pre_hold_custody_state == FILLED"
        side_effects:
          - "same as EVIDENCE_HOLD -> IN_TRADE"
      - from: EVIDENCE_HOLD
        to: AT_RETAIL
        trigger: "POST /theft-investigations/{investigation_id}/status with action = RESUME"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
          - "keg.pre_hold_custody_state == AT_RETAIL"
        side_effects:
          - "same as EVIDENCE_HOLD -> IN_TRADE"
      - from: EVIDENCE_HOLD
        to: IN_SERVICE
        trigger: "POST /theft-investigations/{investigation_id}/status with action = RESUME"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
          - "keg.pre_hold_custody_state == IN_SERVICE"
        side_effects:
          - "same as EVIDENCE_HOLD -> IN_TRADE"
        note: "RESUME is dispatched purely on pre_hold_custody_state, so this edge and the CLOSE/RECOVERED edge below share a target state but not a trigger."
      - from: EVIDENCE_HOLD
        to: STOLEN
        trigger: "POST /theft-investigations/{investigation_id}/status with action = CLOSE and outcome = WRITTEN_OFF"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status IN {OPEN, EVIDENCE_HOLD}"
        side_effects:
          - "every attached keg that is currently on EVIDENCE_HOLD: custody_state = STOLEN, theft_investigation_id retained for audit, version += 1"
          - "an attached keg that was never placed on hold is only DETACHED (theft_investigation_id = null) and keeps its custody_state, because STOLEN is reachable only from EVIDENCE_HOLD"
          - "pool.kegs_held -= n, kegs_written_off += n; pool.posture recomputed; each ACTIVE agreement's float_posture recomputed"
          - "when investigation.suspect_distributor_id is set, every ReturnIncentiveAccrual of that distributor whose keg_id is attached and whose status IN {ACCRUED, PAID} flips to CLAWED_BACK, then distributor.incentive_accrual_cents is recomputed"
          - "investigation.status = CLOSED_WRITTEN_OFF; closed_at, outcome_notes set"
      - from: EVIDENCE_HOLD
        to: IN_SERVICE
        trigger: "POST /theft-investigations/{investigation_id}/status with action = CLOSE and outcome = RECOVERED"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status IN {OPEN, EVIDENCE_HOLD}"
        side_effects:
          - "every attached keg that is currently on EVIDENCE_HOLD: custody_state = IN_SERVICE (recovered kegs must be re-serviced before re-issue), pre_hold_custody_state = null, theft_investigation_id = null, version += 1"
          - "an attached keg that was never placed on hold is only DETACHED and keeps its custody_state"
          - "pool.kegs_held -= n, kegs_servicing += n; pool.posture recomputed; each ACTIVE agreement's float_posture recomputed"
          - "investigation.status = CLOSED_RECOVERED; closed_at, outcome_notes set; accruals are NOT clawed back"

  - entity: Keg
    dimension: service_state
    initial_state: SERVICE_OK
    terminal_states: []
    transitions:
      - from: SERVICE_OK
        to: SERVICE_DUE
        trigger: "POST /kegs/{keg_id}/scan with scan_point = FILL (automatic, same request)"
        actor: system
        preconditions:
          - "after the fill, keg.fill_count - keg.fills_at_last_pressure_test >= PRESSURE_TEST_INTERVAL_FILLS (25)"
        side_effects:
          - "keg.service_state = SERVICE_DUE; the keg remains allocatable but will fail the next FILL scan's safety check"
      - from: SERVICE_DUE
        to: SERVICE_OVERDUE
        trigger: "POST /pools/{pool_id}/replenishment-sweep"
        actor: PoolOperator
        preconditions:
          - "logical clock now - keg.last_pressure_test_at > PRESSURE_TEST_INTERVAL_DAYS (730) days (last_pressure_test_at is never null: import defaults it to the keg's created_at)"
        side_effects:
          - "keg.service_state = SERVICE_OVERDUE; keg.version += 1; the keg is excluded from allocation candidacy"
        note: "Clock-dependent, therefore advanced only by the sweep."
      - from: SERVICE_OK
        to: SERVICE_FAILED
        trigger: "POST /service-cycles/{cycle_id}/record-step with a FAIL pressure test or MAJOR_DEFECT inspection"
        actor: ServiceTechnician
        preconditions:
          - "cycle.keg_id == keg.id"
        side_effects:
          - "keg.service_state = SERVICE_FAILED alongside custody_state = QUARANTINED"
      - from: SERVICE_DUE
        to: SERVICE_OK
        trigger: "POST /service-cycles/{cycle_id}/release"
        actor: PoolOperator
        preconditions:
          - "cycle.stage == PRESSURE_TESTED and cycle.pressure_test_result == PASS"
        side_effects:
          - "keg.service_state = SERVICE_OK; keg.fills_at_last_pressure_test = keg.fill_count; keg.last_pressure_test_at = cycle.pressure_tested_at"
      - from: SERVICE_OVERDUE
        to: SERVICE_OK
        trigger: "POST /service-cycles/{cycle_id}/release"
        actor: PoolOperator
        preconditions:
          - "cycle.stage == PRESSURE_TESTED and cycle.pressure_test_result == PASS"
        side_effects:
          - "same as SERVICE_DUE -> SERVICE_OK"
      - from: SERVICE_FAILED
        to: SERVICE_OK
        trigger: "POST /service-cycles/{cycle_id}/release"
        actor: PoolOperator
        preconditions:
          - "cycle.stage == PRESSURE_TESTED and cycle.pressure_test_result == PASS (retest after a PRESSURE_TEST_FAIL quarantine)"
        side_effects:
          - "same as SERVICE_DUE -> SERVICE_OK"
        note: "The two dimensions move independently: this transition can fire while custody_state stays IN_SERVICE, and custody_state can loop IN_FLOAT -> ... -> IN_SERVICE many times while service_state stays SERVICE_OK."

  - entity: KegPool
    dimension: posture
    initial_state: FROZEN
    terminal_states: []
    transitions:
      - from: FROZEN
        to: OPEN
        trigger: "system recompute inside any request that changes a Keg.custody_state of this pool, or POST /pools/{pool_id}/kegs, or POST /pools/{pool_id}/replenishment-sweep"
        actor: system
        preconditions:
          - "available_pct >= pool.restrict_threshold_pct after the census recompute"
        side_effects:
          - "pool.posture = OPEN; pool.version += 1; every FloatAgreement WHERE pool_id = pool.id AND status = ACTIVE recomputes float_posture"
      - from: OPEN
        to: RESTRICTED
        trigger: "system recompute inside any request that changes a Keg.custody_state of this pool"
        actor: system
        preconditions:
          - "available_pct >= pool.freeze_threshold_pct AND available_pct < pool.restrict_threshold_pct"
        side_effects:
          - "pool.posture = RESTRICTED; pool.version += 1; allocation requests larger than pool.restricted_max_kegs_per_order are refused with ERR_POOL_RESTRICTED"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system recompute inside any request that changes a Keg.custody_state of this pool"
        actor: system
        preconditions:
          - "available_pct < pool.freeze_threshold_pct"
        side_effects:
          - "pool.posture = FROZEN; pool.version += 1"
          - "CASCADE: every ACTIVE FloatAgreement on this pool recomputes float_posture, which becomes SUSPENDED while the pool is FROZEN, which in turn blocks FILL scans and allocations under those agreements"
      - from: RESTRICTED
        to: OPEN
        trigger: "system recompute inside any request that returns kegs to IN_FLOAT (service release, order cancel, evidence-hold resume)"
        actor: system
        preconditions:
          - "available_pct >= pool.restrict_threshold_pct"
        side_effects:
          - "pool.posture = OPEN; pool.version += 1; ACTIVE agreements recompute float_posture"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system recompute inside any request that returns kegs to IN_FLOAT"
        actor: system
        preconditions:
          - "available_pct >= pool.freeze_threshold_pct AND available_pct < pool.restrict_threshold_pct"
        side_effects:
          - "pool.posture = RESTRICTED; pool.version += 1; ACTIVE agreements recompute float_posture"
    note: "Posture is a pure function of the census (calculation pool_posture); it is never set by an operator. The boundary is inclusive at restrict_threshold_pct and exclusive at freeze_threshold_pct."

  - entity: FloatAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /float-agreements/{agreement_id}/activate"
        actor: PoolOperator
        preconditions:
          - "agreement.status == DRAFT"
          - "brewer.status != SUSPENDED"
          - "no other FloatAgreement with the same (brewer_id, pool_id) has status == ACTIVE"
        side_effects:
          - "agreement.status = ACTIVE; effective_date set; float_posture computed for the first time by calculation float_posture; agreement.version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /float-agreements/{agreement_id}/terminate"
        actor: PoolOperator
        preconditions:
          - "agreement.status == ACTIVE"
          - "agreement.kegs_at_brewer_count == 0 (all float recovered before termination)"
        side_effects:
          - "agreement.status = TERMINATED; terminated_reason set; float_posture frozen at its last value; agreement.version += 1"
          - "every IssuanceOrder of this agreement with status IN {REQUESTED, ALLOCATED, PARTIALLY_ALLOCATED} is left untouched but can no longer be allocated or dispatched"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /float-agreements/{agreement_id}/terminate"
        actor: PoolOperator
        preconditions:
          - "agreement.status == DRAFT"
        side_effects:
          - "agreement.status = TERMINATED; terminated_reason set; agreement.version += 1"

  - entity: FloatAgreement
    dimension: float_posture
    initial_state: HEALTHY
    terminal_states: []
    transitions:
      - from: HEALTHY
        to: TIGHT
        trigger: "system recompute after any change to kegs_at_brewer_count, or POST /pools/{pool_id}/replenishment-sweep"
        actor: system
        preconditions:
          - "pool.posture != FROZEN AND brewer.status == ACTIVE"
          - "kegs_at_brewer_count <= floor(float_size_kegs * replenishment_threshold_pct / 100)"
        side_effects:
          - "agreement.float_posture = TIGHT; pending_replenishment_kegs = max(0, float_size_kegs - kegs_at_brewer_count); agreement.version += 1"
      - from: TIGHT
        to: HEALTHY
        trigger: "system recompute after any change to kegs_at_brewer_count"
        actor: system
        preconditions:
          - "pool.posture != FROZEN AND brewer.status == ACTIVE"
          - "kegs_at_brewer_count > floor(float_size_kegs * replenishment_threshold_pct / 100)"
        side_effects:
          - "agreement.float_posture = HEALTHY; pending_replenishment_kegs = 0; agreement.version += 1"
      - from: HEALTHY
        to: SUSPENDED
        trigger: "system recompute after pool.posture becomes FROZEN or brewer.status becomes PROBATION or SUSPENDED"
        actor: system
        preconditions:
          - "pool.posture == FROZEN OR brewer.status IN {PROBATION, SUSPENDED}"
        side_effects:
          - "agreement.float_posture = SUSPENDED; pending_replenishment_kegs = 0; agreement.version += 1"
          - "FILL scans against kegs of this agreement are refused with ERR_FLOAT_SUSPENDED and allocations with ERR_FLOAT_SUSPENDED"
      - from: TIGHT
        to: SUSPENDED
        trigger: "system recompute after pool.posture becomes FROZEN or brewer.status becomes PROBATION or SUSPENDED"
        actor: system
        preconditions:
          - "pool.posture == FROZEN OR brewer.status IN {PROBATION, SUSPENDED}"
        side_effects:
          - "same as HEALTHY -> SUSPENDED"
      - from: SUSPENDED
        to: TIGHT
        trigger: "system recompute after the suspending condition clears (pool posture leaves FROZEN or brewer returns to ACTIVE)"
        actor: system
        preconditions:
          - "pool.posture != FROZEN AND brewer.status == ACTIVE"
          - "kegs_at_brewer_count <= floor(float_size_kegs * replenishment_threshold_pct / 100)"
        side_effects:
          - "agreement.float_posture = TIGHT; pending_replenishment_kegs recomputed; agreement.version += 1"
      - from: SUSPENDED
        to: HEALTHY
        trigger: "system recompute after the suspending condition clears"
        actor: system
        preconditions:
          - "pool.posture != FROZEN AND brewer.status == ACTIVE"
          - "kegs_at_brewer_count > floor(float_size_kegs * replenishment_threshold_pct / 100)"
        side_effects:
          - "agreement.float_posture = HEALTHY; pending_replenishment_kegs = 0; agreement.version += 1"
    note: "status and float_posture are independent dimensions on the same row: a TERMINATED agreement keeps its last float_posture, and an ACTIVE agreement can cycle HEALTHY -> TIGHT -> SUSPENDED -> TIGHT without touching status."

  - entity: IssuanceOrder
    initial_state: REQUESTED
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /issuance-orders/{order_id}/allocate"
        actor: PoolOperator
        preconditions:
          - "all preconditions of Keg IN_FLOAT -> ISSUED_TO_BREWER"
          - "the candidate set produced by selector allocation_selector has size >= order.requested_keg_count"
        side_effects:
          - "requested_keg_count kegs move IN_FLOAT -> ISSUED_TO_BREWER in ranking order"
          - "order.allocated_keg_count = requested_keg_count; allocation_shortfall = 0; allocated_keg_ids set; per_fill_price_cents_pinned set"
          - "the pool/agreement cascade of the keg transition fires once, after all kegs have moved"
      - from: REQUESTED
        to: PARTIALLY_ALLOCATED
        trigger: "POST /issuance-orders/{order_id}/allocate"
        actor: PoolOperator
        preconditions:
          - "order.allow_partial == true"
          - "0 < size(candidate set) < order.requested_keg_count"
        side_effects:
          - "every candidate keg moves IN_FLOAT -> ISSUED_TO_BREWER; order.allocated_keg_count = size(candidate set); allocation_shortfall = requested_keg_count - allocated_keg_count"
          - "same pool/agreement cascade as the ALLOCATED branch"
        note: "Fork sibling of REQUESTED -> ALLOCATED with a divergent side-effect set (non-zero shortfall, fewer keg moves). With allow_partial == false the same candidate shortage yields ERR_INSUFFICIENT_FLOAT and no state change at all."
      - from: ALLOCATED
        to: DISPATCHED
        trigger: "POST /issuance-orders/{order_id}/dispatch"
        actor: PoolOperator
        preconditions:
          - "order.status IN {ALLOCATED, PARTIALLY_ALLOCATED}"
          - "agreement.status == ACTIVE"
        side_effects:
          - "order.status = DISPATCHED; dispatched_at = payload.dispatched_at (an operator-supplied instant that priority 33 forbids from being in the future, NOT the logical clock); order.version += 1"
          - "every allocated keg's dwell_started_at is re-based to that same payload.dispatched_at, so the brewer's dwell clock starts when the truck left, not when the operator typed it in"
          - "the allocated kegs become fillable (FILL scan requires the order to be DISPATCHED)"
      - from: PARTIALLY_ALLOCATED
        to: DISPATCHED
        trigger: "POST /issuance-orders/{order_id}/dispatch"
        actor: PoolOperator
        preconditions:
          - "same as ALLOCATED -> DISPATCHED"
        side_effects:
          - "same as ALLOCATED -> DISPATCHED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /issuance-orders/{order_id}/cancel"
        actor: PoolOperator
        preconditions:
          - "order.status == REQUESTED"
          - "the acting role is PoolOperator (cancellation is an operator-desk action; a brewer asks the desk to cancel)"
        side_effects:
          - "order.status = CANCELLED; cancel_reason set; no keg moves because nothing was allocated"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /issuance-orders/{order_id}/cancel"
        actor: PoolOperator
        preconditions:
          - "order.status IN {ALLOCATED, PARTIALLY_ALLOCATED}"
        side_effects:
          - "exactly the kegs named in order.allocated_keg_ids revert ISSUED_TO_BREWER -> IN_FLOAT (conditional cascade: a REQUESTED order returns nothing at all, and a PARTIALLY_ALLOCATED order returns its allocated_keg_count kegs, NOT its requested_keg_count); no keg of a cancellable order can be FILLED, because a FILL scan requires the order to be DISPATCHED and DISPATCHED is terminal"
          - "pool census, pool.posture and agreement float_posture recomputed; agreement.version += 1"
      - from: PARTIALLY_ALLOCATED
        to: CANCELLED
        trigger: "POST /issuance-orders/{order_id}/cancel"
        actor: PoolOperator
        preconditions:
          - "same as ALLOCATED -> CANCELLED"
        side_effects:
          - "same as ALLOCATED -> CANCELLED"

  - entity: ServiceCycle
    initial_state: RECEIVED
    terminal_states: [RELEASED]
    transitions:
      - from: RECEIVED
        to: CLEANED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = CLEAN"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == RECEIVED"
          - "payload.occurred_at >= cycle.received_at and <= logical clock now"
        side_effects:
          - "cycle.stage = CLEANED; cleaned_at, caustic_cycle_minutes set; cycle.version += 1"
      - from: CLEANED
        to: INSPECTED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = INSPECT and inspection_result IN {PASS, MINOR_DEFECT}"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == CLEANED"
          - "payload.occurred_at >= cycle.cleaned_at"
        side_effects:
          - "cycle.stage = INSPECTED; inspection_result, inspected_at set; cycle.version += 1"
      - from: CLEANED
        to: QUARANTINED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = INSPECT and inspection_result = MAJOR_DEFECT"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == CLEANED"
        side_effects:
          - "cycle.stage = QUARANTINED; quarantine_reason = INSPECTION_MAJOR_DEFECT; keg custody QUARANTINED and service_state SERVICE_FAILED"
      - from: INSPECTED
        to: PRESSURE_TESTED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = PRESSURE_TEST and pressure_test_result = PASS"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == INSPECTED"
          - "payload.pressure_test_psi >= MIN_PRESSURE_TEST_PSI (30)"
        side_effects:
          - "cycle.stage = PRESSURE_TESTED; pressure test fields and pressure_test_performed_by_user_id = acting X-User-ID set; cycle.version += 1"
      - from: INSPECTED
        to: QUARANTINED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = PRESSURE_TEST and pressure_test_result = FAIL"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == INSPECTED"
        side_effects:
          - "cycle.stage = QUARANTINED; quarantine_reason = PRESSURE_TEST_FAIL; keg custody QUARANTINED and service_state SERVICE_FAILED"
      - from: QUARANTINED
        to: PRESSURE_TESTED
        trigger: "POST /service-cycles/{cycle_id}/record-step with step = PRESSURE_TEST and pressure_test_result = PASS"
        actor: ServiceTechnician
        preconditions:
          - "cycle.stage == QUARANTINED and cycle.quarantine_reason == PRESSURE_TEST_FAIL"
        side_effects:
          - "cycle.stage = PRESSURE_TESTED; retest fields overwrite the failed values; keg custody QUARANTINED -> IN_SERVICE"
      - from: PRESSURE_TESTED
        to: RELEASED
        trigger: "POST /service-cycles/{cycle_id}/release"
        actor: PoolOperator
        preconditions:
          - "cycle.stage == PRESSURE_TESTED and pressure_test_result == PASS"
          - "acting X-User-ID != cycle.pressure_test_performed_by_user_id"
          - "occupancy window closes at released_at; the centre keeps the slot blocked for intake_buffer_hours afterwards"
        side_effects:
          - "cycle.stage = RELEASED; released_at, released_by_user_id set; keg returns to IN_FLOAT with service_state SERVICE_OK; centre.open_cycle_count recomputed"

  - entity: LossAssessment
    dimension: assessment_status
    initial_state: PROPOSED
    terminal_states: [UPHELD, WAIVED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: DISPUTED
        trigger: "POST /loss-assessments/{assessment_id}/dispute"
        actor: Brewer
        preconditions:
          - "assessment.assessment_status == PROPOSED"
          - "acting X-User-ID == assessment.brewer_id"
        side_effects:
          - "assessment.assessment_status = DISPUTED; dispute_reason set; assessment.version += 1"
          - "keg.assessment_open stays true; the keg can no longer be the target of a superseding assessment (ERR_ASSESSMENT_ALREADY_OPEN)"
      - from: PROPOSED
        to: UPHELD
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "assessment.assessment_status IN {PROPOSED, DISPUTED}"
          - "acting X-User-ID != assessment.created_by_user_id"
          - "brewer.status != SUSPENDED"
        side_effects:
          - "CASCADE L1: assessment.assessment_status = UPHELD; resolved_by_user_id, resolution_notes set; when net_chargeback_cents > 0 the chargeback_status flips NONE -> ISSUED in the same request; keg.custody_state moves to SCRAPPED (DAMAGED_BEYOND_REPAIR) or LOST (LOST_IN_TRADE, NOT_RETURNED_DWELL) or is left unchanged (STOLEN_SUSPECTED); keg.assessment_open = false"
          - "CASCADE L1 scope of the custody move: the keg moves ONLY when the §1.2 Keg machine declares that edge from its current bucket, i.e. LOST only from FILLED, IN_TRADE or AT_RETAIL and SCRAPPED only from QUARANTINED. An uphold on a keg in any other bucket (for example a LOST_IN_TRADE uphold on a keg still ISSUED_TO_BREWER, or a DAMAGED_BEYOND_REPAIR uphold on a keg that was never quarantined) still upholds the assessment, still issues the chargeback and still clears assessment_open, but leaves custody_state and every pool census counter untouched. There is no error for this combination."
          - "CASCADE L2 (caused by the chargeback becoming ISSUED): brewer.chargeback_balance_cents recomputed as the sum over ISSUED and SETTLED chargebacks; brewer.upheld_loss_count += 1; brewer.loss_rate_bp_trailing_90d and loss_rate_bp_lifetime recomputed; brewer.version += 1"
          - "CASCADE L3 (caused by the recomputed balance): when brewer.chargeback_balance_cents >= PROBATION_BALANCE_THRESHOLD_CENTS and brewer.status == ACTIVE then brewer.status = PROBATION with status_reason = CHARGEBACK_BALANCE_THRESHOLD"
          - "CASCADE L4 (caused by the brewer entering PROBATION): every FloatAgreement WHERE brewer_id = brewer.id AND status = ACTIVE recomputes float_posture to SUSPENDED, which blocks that brewer's later allocations and FILL scans"
          - "pool census, pool.posture and each ACTIVE agreement's float_posture recomputed for the written-off keg (parallel branch of the same request, executed after L4)"
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as PROPOSED -> UPHELD"
        side_effects:
          - "same four-link cascade as PROPOSED -> UPHELD"
      - from: PROPOSED
        to: WAIVED
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = WAIVED"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "assessment.assessment_status IN {PROPOSED, DISPUTED}"
          - "acting X-User-ID != assessment.created_by_user_id"
        side_effects:
          - "assessment.assessment_status = WAIVED; chargeback_status stays NONE; resolved_by_user_id set; assessment.version += 1"
          - "keg.assessment_open = false; keg.custody_state and every pool census counter are left exactly as they were; brewer.chargeback_balance_cents unchanged"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = WAIVED"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "same as PROPOSED -> WAIVED"
        side_effects:
          - "same as PROPOSED -> WAIVED"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /loss-assessments (a newer assessment is opened on the same keg)"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "the prior assessment on this keg has assessment_status == PROPOSED (a DISPUTED assessment blocks supersession with ERR_ASSESSMENT_ALREADY_OPEN)"
          - "payload.expected_keg_version == keg.version"
        side_effects:
          - "prior assessment.assessment_status = SUPERSEDED; prior assessment.version += 1; the new assessment is created in PROPOSED"
          - "keg.assessment_open stays true; keg.version += 1"

  - entity: LossAssessment
    dimension: chargeback_status
    initial_state: NONE
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: NONE
        to: ISSUED
        trigger: "POST /loss-assessments/{assessment_id}/resolve with resolution = UPHELD (automatic, same request)"
        actor: system
        preconditions:
          - "assessment.net_chargeback_cents > 0 (STOLEN_SUSPECTED assessments have brewer_liability_pct_bp = 0 and therefore stay at NONE forever)"
        side_effects:
          - "assessment.chargeback_status = ISSUED; brewer.chargeback_balance_cents += net_chargeback_cents"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /loss-assessments/{assessment_id}/chargeback-resolution with action = SETTLE"
        actor: PoolOperator
        preconditions:
          - "assessment.chargeback_status == ISSUED"
          - "payload.amount_cents == assessment.net_chargeback_cents"
          - "X-User-Role == PoolOperator; an AssetRecoveryAnalyst calling SETTLE is refused with ERR_SEGREGATION_OF_DUTIES at validation priority 26, before the amount is compared at priority 51"
        side_effects:
          - "assessment.chargeback_status = SETTLED; settled_amount_cents set; assessment.version += 1"
          - "brewer.chargeback_balance_cents unchanged: SETTLED rows stay inside the ledger sum"
      - from: ISSUED
        to: REVERSED
        trigger: "POST /loss-assessments/{assessment_id}/chargeback-resolution with action = REVERSE"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "assessment.chargeback_status == ISSUED"
          - "X-User-Role == AssetRecoveryAnalyst; a PoolOperator calling REVERSE is refused with ERR_SEGREGATION_OF_DUTIES at validation priority 26"
        side_effects:
          - "assessment.chargeback_status = REVERSED; assessment.version += 1"
          - "brewer.chargeback_balance_cents recomputed, dropping this row from the sum, which restores the pre-uphold balance exactly (invariant chargeback_ledger_conserved)"
          - "CASCADE: when the recomputed balance falls below PROBATION_BALANCE_THRESHOLD_CENTS and brewer.status == PROBATION AND brewer.status_reason == CHARGEBACK_BALANCE_THRESHOLD, brewer.status returns to ACTIVE with status_reason = null, which in turn lifts float_posture SUSPENDED on that brewer's ACTIVE agreements. A PROBATION whose status_reason is LOSS_RATE_THRESHOLD, or is any operator-supplied free text set through POST /brewers/{brewer_id}/status, is NOT lifted by a reversal, even though the reversal drops the balance: a reversal only undoes the gate it tripped. The loss counters (upheld_loss_count and both loss_rate_bp variants) are money-independent and are never recomputed by a reversal, so the trailing rate that forced probation still stands."
    note: "The two LossAssessment dimensions are independent: chargeback_status can move ISSUED -> REVERSED while assessment_status stays UPHELD, and assessment_status can reach WAIVED while chargeback_status never leaves NONE."

  - entity: ReconciliationClaim
    initial_state: SUBMITTED
    terminal_states: [AGREED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = COUNTER"
        actor: Brewer
        preconditions:
          - "claim.status == SUBMITTED"
          - "acting X-User-ID == claim.misdelivered_to_brewer_id"
          - "claim.round_count < MAX_CLAIM_ROUNDS (3)"
          - "payload.expected_claim_version == claim.version"
          - "claim.last_responder_role != Brewer (the two sides must alternate)"
        side_effects:
          - "claim.status = COUNTERED; counter_offset_cents = payload.counter_offset_cents; round_count += 1; last_responder_role = Brewer; claim.version += 1"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = COUNTER"
        actor: Distributor
        preconditions:
          - "claim.status == COUNTERED"
          - "acting X-User-ID == claim.claimant_distributor_id"
          - "claim.round_count < MAX_CLAIM_ROUNDS (3)"
          - "payload.expected_claim_version == claim.version"
          - "claim.last_responder_role != Distributor"
        side_effects:
          - "claim.status = SUBMITTED; counter_offset_cents = payload.counter_offset_cents; round_count += 1; last_responder_role = Distributor; claim.version += 1"
        note: "This edge closes the negotiation loop SUBMITTED -> COUNTERED -> SUBMITTED; the fourth COUNTER on the same claim is refused with ERR_CLAIM_ROUND_LIMIT."
      - from: SUBMITTED
        to: AGREED
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = AGREE"
        actor: Brewer
        preconditions:
          - "claim.status == SUBMITTED"
          - "acting X-User-ID == claim.misdelivered_to_brewer_id"
          - "payload.expected_claim_version == claim.version"
          - "keg.custody_state NOT IN {LOST, STOLEN, SCRAPPED}"
        side_effects:
          - "claim.status = AGREED; agreed_offset_cents = counter_offset_cents when a counter is outstanding else claimed_offset_cents; closed_at set; claim.version += 1"
          - "a ReturnIncentiveAccrual row with accrual_type = RECONCILIATION_OFFSET, claim_id = claim.id, incentive_cents = agreed_offset_cents, status = ACCRUED is minted for the claimant distributor"
          - "distributor.incentive_accrual_cents recomputed; total_returns_count and on_time_return_pct are NOT affected (RECONCILIATION_OFFSET rows are excluded from the return statistics)"
          - "keg.misdelivery_open = false; keg.version += 1"
      - from: COUNTERED
        to: AGREED
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = AGREE"
        actor: Distributor
        preconditions:
          - "claim.status == COUNTERED"
          - "acting X-User-ID == claim.claimant_distributor_id"
          - "payload.expected_claim_version == claim.version"
          - "keg.custody_state NOT IN {LOST, STOLEN, SCRAPPED}"
        side_effects:
          - "same as SUBMITTED -> AGREED; agreed_offset_cents = claim.counter_offset_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = REJECT"
        actor: Brewer
        preconditions:
          - "claim.status == SUBMITTED"
          - "acting X-User-ID == claim.misdelivered_to_brewer_id"
          - "payload.expected_claim_version == claim.version"
        side_effects:
          - "claim.status = REJECTED; closed_at set; claim.version += 1; keg.misdelivery_open stays true so a superseding claim can be filed"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = REJECT"
        actor: Brewer
        preconditions:
          - "claim.status == COUNTERED and claim.last_responder_role == Distributor"
          - "acting X-User-ID == claim.misdelivered_to_brewer_id"
        side_effects:
          - "same as SUBMITTED -> REJECTED"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = WITHDRAW"
        actor: Distributor
        preconditions:
          - "claim.status IN {SUBMITTED, COUNTERED}"
          - "acting X-User-ID == claim.claimant_distributor_id"
          - "payload.expected_claim_version == claim.version"
        side_effects:
          - "claim.status = WITHDRAWN; closed_at set; claim.version += 1; keg.misdelivery_open stays true"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /reconciliation-claims/{claim_id}/respond with response = WITHDRAW"
        actor: Distributor
        preconditions:
          - "same as SUBMITTED -> WITHDRAWN"
        side_effects:
          - "same as SUBMITTED -> WITHDRAWN"

  - entity: TheftInvestigation
    initial_state: OPEN
    terminal_states: [CLOSED_RECOVERED, CLOSED_WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: EVIDENCE_HOLD
        trigger: "POST /theft-investigations/{investigation_id}/status with action = EVIDENCE_HOLD"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == OPEN"
          - "every keg named in payload.keg_ids has theft_investigation_id == investigation.id and custody_state NOT IN {LOST, STOLEN, SCRAPPED}"
          - "payload.hold_started_at <= logical clock now"
        side_effects:
          - "each named keg records pre_hold_custody_state and moves to EVIDENCE_HOLD"
          - "investigation.status = EVIDENCE_HOLD; hold_started_at, held_keg_count, stainless_value_at_risk_cents recomputed; investigation.version += 1"
          - "pool census, pool.posture and every ACTIVE agreement's float_posture recomputed"
      - from: EVIDENCE_HOLD
        to: OPEN
        trigger: "POST /theft-investigations/{investigation_id}/status with action = RESUME"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
        side_effects:
          - "each held keg's custody_state is restored from pre_hold_custody_state, which returns every pool census counter to its pre-hold value"
          - "investigation.status = OPEN; held_keg_count = 0; hold_started_at = null; investigation.version += 1"
        note: "OPEN <-> EVIDENCE_HOLD may repeat any number of times, which is the cycle in this machine."
      - from: OPEN
        to: CLOSED_RECOVERED
        trigger: "POST /theft-investigations/{investigation_id}/status with action = CLOSE and outcome = RECOVERED"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status IN {OPEN, EVIDENCE_HOLD}"
        side_effects:
          - "every attached keg that is on EVIDENCE_HOLD moves to IN_SERVICE and detaches (theft_investigation_id = null); an attached keg that was never held only detaches and keeps its custody_state"
          - "investigation.status = CLOSED_RECOVERED; closed_at, outcome_notes set; no accrual clawback"
      - from: EVIDENCE_HOLD
        to: CLOSED_RECOVERED
        trigger: "POST /theft-investigations/{investigation_id}/status with action = CLOSE and outcome = RECOVERED"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
        side_effects:
          - "same as OPEN -> CLOSED_RECOVERED"
      - from: OPEN
        to: CLOSED_WRITTEN_OFF
        trigger: "POST /theft-investigations/{investigation_id}/status with action = CLOSE and outcome = WRITTEN_OFF"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status IN {OPEN, EVIDENCE_HOLD}"
        side_effects:
          - "every attached keg that is on EVIDENCE_HOLD moves to STOLEN (STOLEN is reachable only from EVIDENCE_HOLD); an attached keg that was never held only detaches; pool census, posture and agreement postures recomputed"
          - "when suspect_distributor_id is set, that distributor's ACCRUED and PAID accruals for the attached kegs flip to CLAWED_BACK and incentive_accrual_cents is recomputed (invariant incentive_ledger_conserved)"
          - "investigation.status = CLOSED_WRITTEN_OFF; closed_at, outcome_notes set; investigation.version += 1"
      - from: EVIDENCE_HOLD
        to: CLOSED_WRITTEN_OFF
        trigger: "POST /theft-investigations/{investigation_id}/status with action = CLOSE and outcome = WRITTEN_OFF"
        actor: AssetRecoveryAnalyst
        preconditions:
          - "investigation.status == EVIDENCE_HOLD"
        side_effects:
          - "same as OPEN -> CLOSED_WRITTEN_OFF"

concurrency_rules:
  - rule_id: order-allocate-stale-agreement
    parent_entity: FloatAgreement
    write_endpoint: "POST /issuance-orders/{order_id}/allocate"
    occ_field: "expected_agreement_version"
    description: |
      Allocating an IssuanceOrder against a FloatAgreement whose version has advanced since the
      operator last read it is rejected. Two REQUESTED orders may legitimately both be allocated
      while float remains, so the second allocation is not blocked by any state precondition; the
      stale-version check is what forces the operator to re-read the agreement's kegs_at_brewer_count
      and float_posture before drawing more float.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: assessment-create-stale-keg
    parent_entity: Keg
    write_endpoint: "POST /loss-assessments"
    occ_field: "expected_keg_version"
    description: |
      Opening a LossAssessment against a Keg whose version has advanced since the analyst last read
      it is rejected. A newer assessment legitimately supersedes a PROPOSED one when fresh evidence
      arrives, so the second create is not blocked by a state precondition; the stale-version check
      is what stops an analyst from valuing a keg that has meanwhile been returned, quarantined or
      attached to a theft investigation.
    error_id: ERR_STALE_KEG_VERSION
    http_status: 412
  - rule_id: claim-respond-stale-claim
    parent_entity: ReconciliationClaim
    write_endpoint: "POST /reconciliation-claims/{claim_id}/respond"
    occ_field: "expected_claim_version"
    description: |
      Responding to a ReconciliationClaim whose version has advanced since the responder last read it
      is rejected. Alternating COUNTER responses are legitimate product behaviour, so a responder who
      observes an older round would otherwise post an offer against a superseded number; the
      stale-version check pins each response to the round the responder actually saw.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  # ------------------------------------------------------------------------------
  # VERSION SEMANTICS (applies to every entity that carries the `version` common field)
  # A single request bumps each affected row's version by EXACTLY ONE, no matter how many
  # §1.2 cascade links touch that row inside the request. Example: POST /issuance-orders/
  # {order_id}/allocate is described both as "agreement.version += 1" and as CASCADE L4
  # "every ACTIVE agreement on the pool recomputes float_posture; each such agreement's
  # version += 1" -- for the allocating agreement those are the SAME bump, so its version
  # advances 2 -> 3, never 2 -> 4. Reads never bump a version.
  #
  # A cascade recompute bumps the recomputed row's version only when it actually CHANGES at
  # least one stored field of that row. A no-op recompute is not a write: importing a keg into
  # a pool that already has an ACTIVE agreement re-evaluates that agreement's float_posture,
  # kegs_at_brewer_count and pending_replenishment_kegs, and if all three come out identical the
  # agreement's version stays where it was -- which is what keeps a held expected_agreement_version
  # usable across unrelated fleet imports, and what makes the version literals asserted in §1.8
  # and §1.9 computable by counting real changes rather than counting cascade links.
  # ------------------------------------------------------------------------------

calculations:
  - name: dwell_days
    trigger: "On every accepted ScanEvent (to close the spell being ended), on POST /pools/{pool_id}/replenishment-sweep (to reclassify open spells), and on GET /kegs/{keg_id}/dwell."
    algorithm: chronological
    formula: |
      # Two independent clocks run on the same keg and are never mixed.
      #
      # (1) Brewer/custody spell clock -- keg.dwell_started_at
      #     Reset by allocation, by dispatch, by every accepted ScanEvent, and by
      #     ServiceCycle release. Measures how long the CURRENT holder has held the keg.
      brewer_spell_days(at_instant) =
          0                                              if keg.dwell_started_at IS NULL
          floor(max(0, at_instant - keg.dwell_started_at) / 86400)   otherwise
      #
      # (2) Distributor accountability clock -- keg.distributor_custody_started_at
      #     Set ONLY by a DISTRIBUTION scan, NOT reset by an intervening RETAIL scan,
      #     cleared by the RETURN scan that closes it. Measures the whole trade-side
      #     spell across retail, which is what the return incentive is paid on.
      distributor_spell_days(at_instant) =
          0                                                        if keg.distributor_custody_started_at IS NULL
          floor(max(0, at_instant - keg.distributor_custody_started_at) / 86400)  otherwise
      #
      # Spell closure on an accepted scan:
      scan.dwell_days_closed = brewer_spell_days(scan.scanned_at)
      keg.cumulative_dwell_days = SUM(dwell_days_closed) over this keg's ScanEvent rows
      #
      # A RETURN scan additionally reports the distributor spell it closes:
      accrual.dwell_days = distributor_spell_days(scan.scanned_at)   # RETURN_DWELL accruals only
      #
      # Open-spell reclassification (replenishment sweep only; a scan never sets dwell_flag
      # to APPROACHING or OVERDUE by itself):
      limit_days      = DWELL_BREWER_LIMIT_DAYS      if keg.custody_state IN {ISSUED_TO_BREWER, FILLED}
                        DWELL_DISTRIBUTOR_LIMIT_DAYS if keg.custody_state IN {IN_TRADE, AT_RETAIL}
                        NULL                          otherwise (dwell_flag forced to WITHIN_LIMIT)
      approaching_days = DWELL_BREWER_APPROACHING_DAYS / DWELL_DISTRIBUTOR_APPROACHING_DAYS in the same order
      open_days = brewer_spell_days(now)      if limit_days = DWELL_BREWER_LIMIT_DAYS
                  distributor_spell_days(now) if limit_days = DWELL_DISTRIBUTOR_LIMIT_DAYS
      keg.dwell_flag = OVERDUE      if open_days >  limit_days
                       APPROACHING  if open_days >= approaching_days
                       WITHIN_LIMIT otherwise
    input_set: "Only ScanEvent rows of the keg being evaluated. Kegs in IN_FLOAT, IN_SERVICE, QUARANTINED, EVIDENCE_HOLD, LOST, STOLEN or SCRAPPED have no dwell limit and always read WITHIN_LIMIT."
    constants:
      DWELL_BREWER_LIMIT_DAYS: 30
      DWELL_BREWER_APPROACHING_DAYS: 24
      DWELL_DISTRIBUTOR_LIMIT_DAYS: 45
      DWELL_DISTRIBUTOR_APPROACHING_DAYS: 36
      SECONDS_PER_DAY: 86400
    precision: "Whole days, always floor (a 29-day-23-hour spell is 29 days, never 30). Never round-half-up."
    note: "`open_days > limit_days` is strict: exactly 30 brewer-days is APPROACHING-or-WITHIN, and OVERDUE begins at day 31. The dwell band table used by return_incentive uses a different comparison (`<= 14`), which is deliberate and must not be unified."

  - name: keg_custody_projection
    trigger: "On every POST /kegs/{keg_id}/scan, after the scan-sequence validation passes."
    algorithm: projection
    formula: |
      # The keg's custody_state is the replay of its ScanEvent stream in scanned_at order.
      # A scan whose scanned_at precedes the keg's current last_scanned_at is a LATE ARRIVAL
      # (a handheld that was offline when it read the tag).
      scan.is_late_arrival = (keg.last_scanned_at IS NOT NULL AND scan.scanned_at < keg.last_scanned_at)
      scan.recorded_at     = logical clock now                # server receipt instant, always monotonic
      #
      # Replay rule: the custody projection is driven by ARRIVAL order, not scanned_at order,
      # because the scan-point sequence validation already ran against the projected state.
      scan.custody_state_after = the state the transition table yields from keg.custody_state
      keg.custody_state        = scan.custody_state_after
      #
      # But the high-water mark never rewinds, so a late arrival cannot make a later
      # genuine scan look like a late arrival:
      keg.last_scanned_at = max(keg.last_scanned_at, scan.scanned_at)
      #
      # And the spell clock is clamped, so a late arrival contributes 0 dwell days rather
      # than a negative number:
      scan.dwell_days_closed = floor(max(0, scan.scanned_at - keg.dwell_started_at) / 86400)
      keg.dwell_started_at   = max(scan.scanned_at, keg.dwell_started_at)
      keg.scan_count        += 1
    input_set: "All ScanEvent rows of this keg; a late arrival is appended to the stream and never rewrites an earlier row."
    constants: {}
    precision: "Instants compared at millisecond resolution; dwell contributions floored to whole days and clamped at 0."

  - name: pool_posture
    trigger: "Recomputed at the end of any request that changes any Keg.custody_state in the pool, and on POST /pools/{pool_id}/kegs."
    algorithm: threshold
    formula: |
      kegs_total       = COUNT(Keg WHERE pool_id = pool.id)                       # includes written-off kegs
      kegs_available   = COUNT(... AND custody_state = IN_FLOAT)
      kegs_circulating = COUNT(... AND custody_state IN {ISSUED_TO_BREWER, FILLED, IN_TRADE, AT_RETAIL})
      kegs_servicing   = COUNT(... AND custody_state IN {IN_SERVICE, QUARANTINED})
      kegs_held        = COUNT(... AND custody_state = EVIDENCE_HOLD)
      kegs_written_off = COUNT(... AND custody_state IN {LOST, STOLEN, SCRAPPED})
      available_pct    = 0.00 if kegs_total = 0 else round_half_up(100 * kegs_available / kegs_total, 2)
      posture = OPEN       if kegs_total > 0 AND available_pct >= pool.restrict_threshold_pct
                RESTRICTED if kegs_total > 0 AND available_pct >= pool.freeze_threshold_pct
                FROZEN     otherwise (including kegs_total = 0)
    input_set: "Every Keg row of the pool regardless of custody_state; no keg is ever excluded from kegs_total, which is why writing a keg off lowers available_pct instead of leaving it unchanged."
    constants: {}
    precision: "available_pct carries exactly 2 decimals, round_half_up. Both threshold comparisons are inclusive (>=), so available_pct exactly equal to restrict_threshold_pct is OPEN and exactly equal to freeze_threshold_pct is RESTRICTED."
    note: "Conserved-count invariant: kegs_total == kegs_available + kegs_circulating + kegs_servicing + kegs_held + kegs_written_off, at the end of every request. See invariant pool_census_conserved."

  - name: pool_census_conserved
    trigger: "Asserted at the end of every request that mutates any Keg.custody_state."
    algorithm: aggregation
    formula: |
      # Compensating invariant (conserved quantity type: KEG COUNT).
      # Every custody movement is a transfer between two of the five buckets; no operation
      # may create or destroy a keg. Only POST /pools/{pool_id}/kegs increases kegs_total.
      assert kegs_total == kegs_available + kegs_circulating + kegs_servicing + kegs_held + kegs_written_off
      #
      # The two compensating pairs that must return the vector to its exact prior value:
      #   (a) POST /issuance-orders/{id}/allocate  then  POST /issuance-orders/{id}/cancel
      #       moves N kegs IN_FLOAT -> ISSUED_TO_BREWER -> IN_FLOAT; the five counters end
      #       identical to their pre-allocation values (only Keg.version and updated_at move).
      #   (b) POST /theft-investigations/{id}/status EVIDENCE_HOLD  then  RESUME
      #       moves N kegs X -> EVIDENCE_HOLD -> X via Keg.pre_hold_custody_state; the five
      #       counters end identical to their pre-hold values even when the held kegs came
      #       from three different buckets.
    input_set: "All Keg rows of the pool."
    constants: {}
    precision: "Exact integer equality; no tolerance."

  - name: allocation_selector
    trigger: "POST /issuance-orders/{order_id}/allocate."
    algorithm: waterfall_allocation
    formula: |
      candidates = Keg WHERE pool_id       = agreement.pool_id
                         AND custody_state = IN_FLOAT
                         AND service_state IN {SERVICE_OK, SERVICE_DUE}
                         AND theft_investigation_id IS NULL
                         AND assessment_open = false
      # Deterministic ranking -- Keg.id is NEVER an input to this order.
      rank candidates ASC by (
          fill_count,                                   # 1. spread wear: least-filled keg leaves first
          last_pressure_test_at,                        # 2. oldest certification leaves first (never null)
          created_at                                    # 3. mandatory final tie-break
      )
      want = order.requested_keg_count
      take = min(want, COUNT(candidates))
      if take = 0                            -> ERR_NO_ELIGIBLE_KEGS (409)
      if take < want AND order.allow_partial = false -> ERR_INSUFFICIENT_FLOAT (409)
      allocated = first `take` candidates in rank order
      order.allocated_keg_ids     = ids of `allocated` in rank order
      order.allocated_keg_count   = take
      order.allocation_shortfall  = want - take
      order.status                = ALLOCATED if take = want else PARTIALLY_ALLOCATED
      order.per_fill_price_cents_pinned = agreement.per_fill_rate_cents    # pinned at allocation, not at fill
    input_set: "Only IN_FLOAT, certified, unencumbered kegs of the agreement's pool. SERVICE_DUE kegs ARE candidates (they are still certified, merely due for a test) but will be refused at the FILL scan with ERR_KEG_NOT_FIT_FOR_FILL. SERVICE_OVERDUE kegs are IN_FLOAT and still counted in kegs_available yet are NOT candidates -- so a pool can read posture OPEN and still fail allocation with ERR_NO_ELIGIBLE_KEGS. Kegs attached to a theft investigation or carrying an open assessment are likewise excluded while remaining in kegs_available."
    constants: {}
    precision: "Integer keg counts; no rounding."
    note: "Keg.id never participates in the ranking. Because last_pressure_test_at defaults to the keg's created_at at import, rank keys 2 and 3 agree for freshly imported kegs and the import order decides -- deterministically."

  - name: float_posture
    trigger: "Recomputed on agreement activation, on every allocation/dispatch/return affecting the agreement, on any Brewer.status change, and on any pool_posture change."
    algorithm: constraint_propagation
    formula: |
      agreement.kegs_at_brewer_count = COUNT(Keg WHERE current_brewer_id = agreement.brewer_id
                                                   AND pool_id           = agreement.pool_id
                                                   AND custody_state IN {ISSUED_TO_BREWER, FILLED})
      agreement.kegs_issued_count    = COUNT(Keg WHERE issuance_order_id IN (orders of this agreement WHERE status = DISPATCHED))
      tight_ceiling = floor(agreement.float_size_kegs * agreement.replenishment_threshold_pct / 100)
      # Reported ONLY while the float is actually asking for kegs, i.e. posture TIGHT.
      # HEALTHY and SUSPENDED agreements report 0 (see the §1.2 float_posture side effects),
      # so this field is a replenishment signal and not a running shortfall.
      agreement.pending_replenishment_kegs =
          max(0, agreement.float_size_kegs - agreement.kegs_at_brewer_count)  if float_posture = TIGHT
          0                                                                   otherwise
      #
      # Evaluation order is pinned: the cross-entity gates win over the local ceiling.
      agreement.float_posture =
          SUSPENDED if pool.posture = FROZEN
                    OR brewer.status IN {PROBATION, SUSPENDED}
          TIGHT     if agreement.kegs_at_brewer_count <= tight_ceiling
          HEALTHY   otherwise
    input_set: "Only ACTIVE agreements are recomputed; DRAFT and TERMINATED agreements keep float_posture at their last value and never gate anything."
    constants: {}
    precision: "tight_ceiling uses floor, so float_size_kegs = 10 with replenishment_threshold_pct = 20 gives a ceiling of 2: 2 kegs at the brewer is TIGHT, 3 is HEALTHY."
    note: "The cross-entity gates are why a keg movement in one brewer's order can flip a DIFFERENT brewer's agreement to SUSPENDED: the pool posture is shared."

  - name: stainless_scrap_value
    trigger: "On GET /kegs/{keg_id} (recomputed), and pinned into LossAssessment.scrap_credit_cents at POST /loss-assessments and into TheftInvestigation.stainless_value_at_risk_cents at each status change."
    algorithm: aggregation
    formula: |
      # Index selection -- latest effective index at or before the valuation date.
      index_for(valuation_date) =
          the CommodityIndex row with the maximum effective_date <= valuation_date.
          effective_date is globally unique (validation priority 38), so the selection is
          always unambiguous and there is never a tie to break: a correction is posted as a
          NEW row under a LATER effective_date, never as a second row for the same date.
          If no such row exists -> ERR_NO_COMMODITY_INDEX (422) on POST /loss-assessments;
          on POST /pools/{pool_id}/kegs the keg is still imported and its
          stainless_scrap_value_cents stays 0 until an index row becomes effective.
      valuation_date = date part of the logical clock at the moment of computation
      #
      keg.stainless_scrap_value_cents =
          round_half_up(pool.stainless_weight_kg * index_for(valuation_date).usd_cents_per_kg * SCRAP_RECOVERY_PCT)
      #
      # Aggregate exposure -- ROUND PER KEG, THEN SUM (never sum-then-round).
      investigation.stainless_value_at_risk_cents =
          SUM over Keg WHERE theft_investigation_id = investigation.id
              of round_half_up(keg.pool.stainless_weight_kg * usd_cents_per_kg * SCRAP_RECOVERY_PCT)
      investigation.attached_keg_count = COUNT(that same set)
      investigation.held_keg_count     = COUNT(that set AND custody_state = EVIDENCE_HOLD)
    input_set: "Every keg attached to the investigation regardless of custody_state, including kegs already moved to STOLEN by an earlier write-off; pools may differ per keg, so weights are not uniform."
    constants:
      SCRAP_RECOVERY_PCT: 0.65
    precision: "Cents, round_half_up, applied once per keg before summation. A future-dated CommodityIndex row is never selected."

  - name: keg_loss_value
    trigger: "POST /loss-assessments (values are pinned into the assessment row at creation and never recomputed on resolve)."
    algorithm: threshold
    formula: |
      # --- gross value: the two variants diverge here and only here ---
      # variant REPLACEMENT_COST
      gross_value_cents = pool.replacement_cost_cents
      # variant DEPRECIATED_BOOK
      depreciation_bp   = min(keg.fill_count * DEPRECIATION_PER_FILL_BP, DEPRECIATION_CAP_BP)
      book_value        = round_half_up(pool.replacement_cost_cents * (10000 - depreciation_bp) / 10000)
      book_floor        = round_half_up(pool.replacement_cost_cents * BOOK_VALUE_FLOOR_PCT)
      gross_value_cents = max(book_value, book_floor)
      #
      # --- shared tail, identical for both variants ---
      scrap_credit_cents = keg.stainless_scrap_value_cents  if cause = DAMAGED_BEYOND_REPAIR
                           0                                otherwise
      # (a keg that was never recovered yields no scrap: LOST_IN_TRADE, NOT_RETURNED_DWELL
      #  and STOLEN_SUSPECTED always credit 0 even though the keg has a scrap value)
      assessed_value_cents = max(0, gross_value_cents - scrap_credit_cents)
      brewer_liability_pct_bp = LIABILITY_BP[cause]
      net_chargeback_cents = round_half_up(assessed_value_cents * brewer_liability_pct_bp / 10000)
      commodity_index_id   = index_for(valuation_date).id      # pinned, per stainless_scrap_value
      dwell_days_at_assessment = brewer_spell_days(now) or distributor_spell_days(now),
                                 whichever clock is open on the keg (brewer clock wins if both)
    input_set: "One Keg and its pool. The keg must not already carry a DISPUTED assessment; a PROPOSED one is superseded."
    constants:
      DEPRECIATION_PER_FILL_BP: 45
      DEPRECIATION_CAP_BP: 7000
      BOOK_VALUE_FLOOR_PCT: 0.30
      LIABILITY_BP: "{ LOST_IN_TRADE: 6000, DAMAGED_BEYOND_REPAIR: 10000, NOT_RETURNED_DWELL: 10000, STOLEN_SUSPECTED: 0 }"
    precision: "Cents, round_half_up, applied separately to book_value, book_floor and net_chargeback_cents. Basis points are integers."
    variants:
      - name: REPLACEMENT_COST
        when: "assessment_basis = REPLACEMENT_COST -- the default, and mandatory when keg.fill_count = 0 or the cause is STOLEN_SUSPECTED (a thief takes a keg at market value, not book value)."
        difference: "Gross value is the pool's full new-keg replacement cost; fill_count is ignored entirely."
      - name: DEPRECIATED_BOOK
        when: "assessment_basis = DEPRECIATED_BOOK -- selectable by the analyst when keg.fill_count > 0 and the cause is not STOLEN_SUSPECTED."
        difference: "Gross value is the replacement cost written down 45 bp per lifetime fill, capped at 70% depreciation and floored at 30% of replacement cost. For identical inputs this always yields a gross value strictly lower than REPLACEMENT_COST once fill_count >= 1, so the two variants produce different net_chargeback_cents for the same keg."
    note: "STOLEN_SUSPECTED carries liability 0 bp, so its net_chargeback_cents is always 0 and its chargeback_status stays NONE forever -- the loss is booked against the pool, not the brewer, and recovery runs through TheftInvestigation instead. Basis coercion is silent, never an error: when assessment_basis is omitted, or is supplied as DEPRECIATED_BOOK on a keg with fill_count = 0, or is supplied as DEPRECIATED_BOOK together with cause = STOLEN_SUSPECTED, the stored assessment_basis is REPLACEMENT_COST and the gross value follows that variant (there is no ERR_INVALID_REQUEST for an unusable basis)."

  - name: brewer_loss_rate_bp
    trigger: "Recomputed on every LossAssessment resolution and on every FILL ScanEvent; readable at GET /brewers/{brewer_id}/loss-rate."
    algorithm: weighted_scoring
    formula: |
      # variant TRAILING_90D  (window = [now - 90 days, now], both ends inclusive)
      window_start = now - TRAILING_WINDOW_DAYS * 86400
      window_end   = now
      numerator    = COUNT(LossAssessment WHERE brewer_id = brewer.id
                                            AND assessment_status = UPHELD
                                            AND created_at >= window_start
                                            AND created_at <= window_end)
      denominator  = COUNT(ScanEvent WHERE scan_point = FILL
                                       AND brewer_id  = brewer.id
                                       AND scanned_at >= window_start
                                       AND scanned_at <= window_end)
      # variant LIFETIME
      numerator    = brewer.upheld_loss_count            # all UPHELD assessments, no window
      denominator  = brewer.lifetime_fill_count          # all FILL scans, no window
      #
      # shared tail
      basis_insufficient = (denominator = 0)
      loss_rate_bp = 0 if basis_insufficient else round_half_up(10000 * numerator / denominator)
      #
      # Probation gate -- reads the TRAILING_90D variant ONLY:
      if brewer.loss_rate_bp_trailing_90d >= PROBATION_LOSS_RATE_BP AND brewer.status = ACTIVE
         -> brewer.status = PROBATION, status_reason = LOSS_RATE_THRESHOLD
      # A brewer whose LIFETIME rate is far above the threshold but whose TRAILING_90D rate
      # is below it stays ACTIVE. Reading the wrong variant here is an observable defect.
      #
      # Gate ordering when an uphold would trip BOTH probation gates in one request:
      # cascade L3 of state_machines.LossAssessment.assessment_status runs first, so the
      # balance gate claims the transition and status_reason = CHARGEBACK_BALANCE_THRESHOLD.
      # The loss-rate gate above then finds status != ACTIVE and does not overwrite the
      # reason. status_reason = LOSS_RATE_THRESHOLD therefore appears only when the
      # recomputed chargeback_balance_cents is strictly below
      # PROBATION_BALANCE_THRESHOLD_CENTS while the trailing rate is at or above
      # PROBATION_LOSS_RATE_BP.
    input_set: "TRAILING_90D counts only rows whose timestamp falls inside the window; both a fill and a loss can drop out of the window as the clock advances, so the trailing rate is not monotonic. LIFETIME counts every row ever. WAIVED and SUPERSEDED assessments are excluded from both numerators; DISPUTED ones are too, until they are upheld."
    constants:
      TRAILING_WINDOW_DAYS: 90
      PROBATION_LOSS_RATE_BP: 1500
      PROBATION_BALANCE_THRESHOLD_CENTS: 25000
    precision: "Basis points, integer, round_half_up on the division (1 upheld loss over 3 fills is 3333 bp, not 3334)."
    variants:
      - name: TRAILING_90D
        when: "Stored in brewer.loss_rate_bp_trailing_90d; returned by GET /brewers/{brewer_id}/loss-rate with basis = TRAILING_90D (the default); the ONLY variant that drives the probation gate."
        difference: "Both numerator and denominator are windowed on the logical clock, so the same history yields a different rate as the clock advances."
      - name: LIFETIME
        when: "Stored in brewer.loss_rate_bp_lifetime; returned when the query parameter basis = LIFETIME. Reported to distributors in cooperation reviews; never gates anything."
        difference: "Unwindowed counts, so it is monotonically non-decreasing in losses and never causes a status change."

  - name: return_incentive
    trigger: "POST /kegs/{keg_id}/scan with scan_point = RETURN (mints a RETURN_DWELL accrual), and POST /reconciliation-claims/{claim_id}/respond reaching AGREED (mints a RECONCILIATION_OFFSET accrual)."
    algorithm: tiered_pricing
    formula: |
      # ---- per-keg incentive (RETURN_DWELL) ----
      dwell_days = distributor_spell_days(scan.scanned_at)        # see calculation dwell_days
      tier_pct_bp = 10000 if dwell_days <= 14
                     6000 if 15 <= dwell_days <= 29
                     2500 if 30 <= dwell_days <= 44
                        0 if dwell_days >= 45
      cooperation_multiplier_bp = COOPERATION_MULTIPLIER_BP[distributor.cooperation_tier]   # tier AS OF THIS SCAN
      raw_cents = distributor.return_incentive_rate_cents_per_keg
                  * tier_pct_bp / 10000
                  * cooperation_multiplier_bp / 10000
      accrual.incentive_cents = round_half_up(raw_cents)          # ROUNDED PER KEG
      #
      # ---- ledger roll-up: SUM OF ROUNDED PER-KEG AMOUNTS ----
      # The rounding happens once per accrual row, BEFORE summation. Summing the unrounded
      # raw values and rounding the total is a different number and is wrong.
      distributor.incentive_accrual_cents =
          SUM(accrual.incentive_cents WHERE distributor_id = d.id AND status IN {ACCRUED, PAID})
      #
      # ---- RECONCILIATION_OFFSET accruals ----
      # These bypass the dwell band and the cooperation multiplier entirely:
      accrual.incentive_cents = claim.agreed_offset_cents
      accrual.dwell_days      = 0
      accrual.tier_pct_bp     = null
      accrual.cooperation_multiplier_bp = null
      # and they are EXCLUDED from total_returns_count / on_time_returns_count / avg_dwell_days,
      # so an agreed misdelivery claim pays the distributor without moving its cooperation tier.
    input_set: "RETURN_DWELL accruals require an open distributor accountability spell (keg.distributor_custody_started_at IS NOT NULL); a RETURN scan on a keg that never had a DISTRIBUTION scan mints no accrual at all. Only ACCRUED and PAID rows enter incentive_accrual_cents; CLAWED_BACK rows leave it."
    constants:
      COOPERATION_MULTIPLIER_BP: "{ NONE: 0, BRONZE: 10000, SILVER: 11500, GOLD: 13000 }"
      DWELL_BAND_BP: "{ '<=14': 10000, '15..29': 6000, '30..44': 2500, '>=45': 0 }"
    precision: "Cents, round_half_up, applied ONCE PER ACCRUAL ROW and never to the aggregate. Example: rate 250, SILVER (11500 bp), three returns at dwell 12 / 20 / 35 -> 288 + 173 + 72 = 533, whereas rounding the summed raw value 287.5 + 172.5 + 71.875 = 531.875 would give 532."
    note: "A NONE-tier distributor accrues rows with incentive_cents = 0 rather than no rows at all, so total_returns_count still advances and the distributor can still be promoted -- except that NONE never auto-promotes (see cooperation_tier_promotion), so it must be moved to BRONZE by an explicit cooperation agreement first."

  - name: cooperation_tier_promotion
    trigger: "At the end of every POST /kegs/{keg_id}/scan with scan_point = RETURN that mints a RETURN_DWELL accrual, after the accrual has been valued."
    algorithm: threshold
    formula: |
      # PINNED ORDER -- the accrual is valued at the OLD tier, then the counters move,
      # then at most ONE promotion step is applied. Promoting first and valuing second
      # is an observable defect.
      #
      # step 1: value the accrual using distributor.cooperation_tier as it stands  (return_incentive)
      # step 2: recompute the counters INCLUDING the accrual just minted
      total   = COUNT(RETURN_DWELL accruals of d WHERE status IN {ACCRUED, PAID, CLAWED_BACK})
      on_time = COUNT(that set AND dwell_days <= DWELL_DISTRIBUTOR_LIMIT_DAYS)
      d.total_returns_count  = total
      d.on_time_returns_count = on_time
      d.on_time_return_pct   = 0.00 if total = 0 else round_half_up(100 * on_time / total, 2)
      d.avg_dwell_days       = 0.00 if total = 0 else round_half_up(mean(dwell_days over that set), 2)
      # step 3: at most ONE step up the ladder per accrual; no step may be skipped
      if d.cooperation_tier = BRONZE AND total >= SILVER_MIN_RETURNS AND d.on_time_return_pct >= SILVER_MIN_ON_TIME_PCT
         -> d.cooperation_tier = SILVER, d.cooperation_effective_date = date(now)
      elif d.cooperation_tier = SILVER AND total >= GOLD_MIN_RETURNS AND d.on_time_return_pct >= GOLD_MIN_ON_TIME_PCT
         -> d.cooperation_tier = GOLD, d.cooperation_effective_date = date(now)
      # NONE never auto-promotes: a distributor with no cooperation agreement earns nothing
      # and climbs nothing until POST /distributors/{id}/cooperation-agreement sets BRONZE.
      # There is no automatic demotion: a tier once earned is only lowered by an explicit
      # cooperation-agreement write.
    input_set: "RETURN_DWELL accruals only, in any status including CLAWED_BACK (a clawback removes the money but not the service history). RECONCILIATION_OFFSET accruals are excluded."
    constants:
      SILVER_MIN_RETURNS: 3
      SILVER_MIN_ON_TIME_PCT: 90.00
      GOLD_MIN_RETURNS: 5
      GOLD_MIN_ON_TIME_PCT: 96.00
      DWELL_DISTRIBUTOR_LIMIT_DAYS: 45
    precision: "on_time_return_pct carries exactly 2 decimals, round_half_up; both promotion comparisons are inclusive (>=), so exactly 90.00 promotes BRONZE -> SILVER and exactly 96.00 promotes SILVER -> GOLD."
    note: "Because the promotion lands AFTER the accrual is valued, the return that triggers BRONZE -> SILVER is itself paid at the BRONZE multiplier; the SILVER multiplier first appears on the NEXT return."

  - name: fill_charge_net
    trigger: "POST /kegs/{keg_id}/scan with scan_point = FILL."
    algorithm: tiered_pricing
    formula: |
      # EVERY STEP BELOW IS ORDER-PINNED. Two sub-expressions deliberately read
      # different bases, and swapping either one changes the result.
      #
      # 1. base rate -- taken from the AGREEMENT, not from the order's pinned price
      base = agreement.per_fill_rate_cents
      #
      # 2. raw dwell surcharge on the brewer's open spell
      excess_days   = max(0, brewer_spell_days(scan.scanned_at) - DWELL_BREWER_LIMIT_DAYS)
      raw_surcharge = excess_days * DWELL_SURCHARGE_CENTS_PER_DAY
      #
      # 3. cap the surcharge -- the cap is a percentage of `base` ALONE, never of
      #    (base + raw_surcharge) and never of the post-discount total
      surcharge_cap = round_half_up(base * DWELL_SURCHARGE_CAP_PCT)
      surcharge     = min(raw_surcharge, surcharge_cap)
      #
      # 4. pre-discount charge
      pre_discount = base + surcharge
      #
      # 5. volume tier basis -- the agreement's ALREADY-BILLED total PLUS this fill's
      #    pre-discount amount. The current fill counts toward its own tier.
      tier_basis = agreement.billed_amount_cents + pre_discount
      discount_pct_bp = 300 if tier_basis >= VOLUME_TIER_2_CENTS
                        150 if tier_basis >= VOLUME_TIER_1_CENTS
                          0 otherwise
      #
      # 6. discount applies to pre_discount (base + surcharge), so the surcharge is
      #    discountable -- it is not added back after the discount
      discount = round_half_up(pre_discount * discount_pct_bp / 10000)
      scan.fill_charge_net_cents = pre_discount - discount
      #
      # 7. ledger update, AFTER the charge is computed
      agreement.billed_amount_cents += scan.fill_charge_net_cents
      agreement.billed_fills_count  += 1
      keg.fill_count                += 1
      brewer.lifetime_fill_count    += 1
    input_set: "The single ACTIVE FloatAgreement matching (keg.current_brewer_id, keg.pool_id). billed_amount_cents accumulates only net charges of accepted FILL scans; rejected scans leave it untouched."
    constants:
      DWELL_BREWER_LIMIT_DAYS: 30
      DWELL_SURCHARGE_CENTS_PER_DAY: 30
      DWELL_SURCHARGE_CAP_PCT: 0.20
      VOLUME_TIER_1_CENTS: 4500
      VOLUME_TIER_2_CENTS: 9000
    precision: "Cents, round_half_up, applied independently at step 3 and step 6; no intermediate value is truncated. Both tier comparisons are inclusive (>=), so a tier_basis of exactly 9000 earns 300 bp."
    note: "Worked example with base 2200: fill #1 at 50 brewer-days -> excess 20, raw 600, cap round_half_up(440.0) = 440, surcharge 440, pre_discount 2640, tier_basis 0 + 2640 = 2640 -> 0 bp, net 2640, billed 2640. Fill #2 at 0 brewer-days -> surcharge 0, pre_discount 2200, tier_basis 2640 + 2200 = 4840 -> 150 bp, discount round_half_up(33.0) = 33, net 2167, billed 4807. Capping on (base + raw) instead of base alone would give 2760 for fill #1; excluding the current fill from tier_basis would give 2200 for fill #2."

  - name: chargeback_ledger_conserved
    trigger: "Recomputed on every LossAssessment resolve and chargeback-resolution; asserted at the end of those requests."
    algorithm: aggregation
    formula: |
      # Compensating invariant (conserved quantity type: MONEY, in cents).
      brewer.chargeback_balance_cents =
          SUM(LossAssessment.net_chargeback_cents WHERE brewer_id = brewer.id
                                                    AND chargeback_status IN {ISSUED, SETTLED})
      # SETTLED stays inside the sum -- settling records that the brewer paid, it does not
      # erase the liability from the ledger. REVERSED and NONE are outside the sum.
      #
      # Compensating pair that must return the ledger to its exact prior value:
      #   POST /loss-assessments/{id}/resolve (UPHELD)   -> chargeback ISSUED, balance += net
      #   POST /loss-assessments/{id}/chargeback-resolution (REVERSE) -> row leaves the sum,
      #   balance returns to EXACTLY its pre-uphold value (not "approximately", no drift),
      #   and the PROBATION status forced by crossing PROBATION_BALANCE_THRESHOLD_CENTS is
      #   lifted back to ACTIVE, which in turn lifts float_posture SUSPENDED.
      # WAIVED never enters the sum at all, so waiving is a no-op on the ledger.
    input_set: "All LossAssessment rows of the brewer. SUPERSEDED and DISPUTED rows have chargeback_status NONE and are therefore excluded."
    constants:
      PROBATION_BALANCE_THRESHOLD_CENTS: 25000
    precision: "Exact integer cents; the reversal must reproduce the prior balance bit-for-bit."

  - name: incentive_ledger_conserved
    trigger: "Recomputed on every accrual mint, on POST /return-incentives/{accrual_id}/pay, and on a theft investigation closing WRITTEN_OFF."
    algorithm: aggregation
    formula: |
      # Compensating invariant (conserved quantity type: MONEY, in cents) on the
      # distributor side of the ledger.
      distributor.incentive_accrual_cents =
          SUM(ReturnIncentiveAccrual.incentive_cents WHERE distributor_id = d.id
                                                       AND status IN {ACCRUED, PAID})
      # Compensating pair:
      #   RETURN scan mints an ACCRUED row              -> balance += incentive_cents
      #   theft investigation closes WRITTEN_OFF with
      #   suspect_distributor_id = d and the accrual's
      #   keg attached                                  -> row flips to CLAWED_BACK,
      #                                                    balance returns to its exact
      #                                                    pre-accrual value
      # A PAID row is clawed back the same way: paying does not remove the row from the sum,
      # so the clawback of a PAID accrual moves the balance by exactly the same amount as
      # the clawback of an ACCRUED one.
      # total_returns_count and on_time_return_pct are NOT restored by a clawback -- the
      # service history is not money and is not conserved.
    input_set: "All accruals of the distributor in both accrual_type values."
    constants: {}
    precision: "Exact integer cents."

  - name: custody_interval_integrity
    trigger: "POST /kegs/{keg_id}/scan, evaluated before the scan is appended to the stream."
    algorithm: interval_merge
    formula: |
      # A keg's history is a contiguous chain of custody intervals. Each accepted scan
      # closes the current interval and opens the next one:
      #     interval_i = [ scan_i.scanned_at , scan_{i+1}.scanned_at )    HALF-OPEN, END-EXCLUSIVE
      # The currently open interval is [ keg.dwell_started_at , +inf ).
      #
      # A new scan is placed by its scanned_at:
      #   scanned_at >= keg.dwell_started_at   -> lands in the OPEN interval. Accepted.
      #                                           is_late_arrival = (scanned_at < keg.last_scanned_at).
      #   scanned_at == keg.dwell_started_at   -> ACCEPTED. The interval is half-open, so the
      #                                           instant that is the END of the previous
      #                                           interval belongs to the open one; two
      #                                           adjacent intervals touching at a point do
      #                                           NOT overlap.
      #   scanned_at <  keg.dwell_started_at   -> falls STRICTLY INSIDE an already-closed
      #                                           interval owned by a party that no longer
      #                                           holds the keg -> ERR_CUSTODY_INTERVAL_CONFLICT (409).
      #
      # Exact-duplicate guard, checked before the interval placement:
      #   an existing ScanEvent on this keg with the SAME (scan_point, scanned_at)
      #   -> ERR_DUPLICATE_SCAN (409)
    input_set: "All ScanEvent rows of the keg plus the keg's open-interval start."
    constants: {}
    precision: "Instants compared at millisecond resolution. Interval end is EXCLUSIVE: a scan at exactly the boundary instant is accepted."
    note: "Contrast with service_center_intake, whose windows are CLOSED at both ends and therefore reject the boundary instant. The two interval semantics in this scaffold are deliberately different and must not be unified."

  - name: service_center_intake
    trigger: "POST /service-cycles."
    algorithm: interval_merge
    formula: |
      # Two independent resource checks on the same ServiceCenter, evaluated in this order.
      #
      # (1) INTAKE WINDOW -- a wash-line block, CLOSED at BOTH ENDS:
      #         window(c) = [ c.received_at , c.received_at + INTAKE_BUFFER_HOURS hours ]
      #     A new cycle's received_at may not fall inside ANY existing window of the same
      #     centre, INCLUDING at either endpoint:
      #         exists c in cycles(centre) with
      #             c.received_at <= new.received_at <= c.received_at + buffer
      #         -> ERR_INTAKE_WINDOW_CONFLICT (409)
      #     So a received_at exactly INTAKE_BUFFER_HOURS after an existing intake is
      #     REJECTED; one millisecond later is accepted.
      #     buffer = service_center.intake_buffer_hours (per-centre, default 4).
      #
      # (2) AGGREGATE CONCURRENT CAPACITY -- an occupancy count, not a pairwise check:
      #         open_cycle_count = COUNT(ServiceCycle WHERE service_center_id = centre.id
      #                                    AND stage IN {RECEIVED, CLEANED, INSPECTED,
      #                                                  PRESSURE_TESTED, QUARANTINED})
      #         if open_cycle_count >= centre.concurrent_cycle_capacity
      #         -> ERR_SERVICE_CAPACITY_EXCEEDED (409)
      #     RELEASED cycles leave the count, so releasing one cycle frees exactly one slot.
      #     Each individual cycle is admissible on its own; only the collective breaches
      #     the limit.
    input_set: "All ServiceCycle rows of the centre. Windows are evaluated against every cycle ever received at the centre, including RELEASED ones, because the wash-line block was consumed regardless of outcome."
    constants:
      DEFAULT_INTAKE_BUFFER_HOURS: 4
    precision: "Instants compared at millisecond resolution. Window endpoints are INCLUSIVE, which is the opposite of custody_interval_integrity's exclusive end."

validations:
  # ---------------- 1-3 authentication / authorization ----------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, non-blank, and X-User-Role is one of the five roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the target endpoint's `roles:` list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For the entity_backed roles Brewer and Distributor, X-User-ID must equal the id of an existing Brewer / Distributor row."
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 403
    applies_to: "every endpoint whose roles include Brewer or Distributor"

  # ---------------- 4-5 request shape ----------------
  - priority: 4
    category: existence
    check: "Request body/query shape: required fields present, JSON types correct, enum values inside their declared domain, integers inside their declared range, ISO 8601 datetimes parseable, dates in YYYY-MM-DD form, and no conditionally forbidden field supplied (e.g. brewer_id on a scan whose party_type is DISTRIBUTOR)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"

  # ---------------- 6-7 existence ----------------
  - priority: 6
    category: existence
    check: "Every path id resolves to an existing row, validated LEFT TO RIGHT (for POST /pools/{pool_id}/kegs the pool is checked before the body)."
    error_id: "ERR_BREWER_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_KEG_NOT_FOUND | ERR_SCAN_EVENT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SERVICE_CENTER_NOT_FOUND | ERR_SERVICE_CYCLE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ACCRUAL_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 7
    category: existence
    check: "Every FK supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's `input:` list. List-valued FKs are resolved element by element in the order supplied, and they are resolved WITHIN the scope named earlier in the same body: for POST /theft-investigations each element of keg_ids must be a keg OF pool_id, so a keg that exists but belongs to a different pool is reported as ERR_KEG_NOT_FOUND and the whole request is refused (no partial attach)."
    error_id: "ERR_BREWER_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_KEG_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /float-agreements, POST /issuance-orders, POST /kegs/{keg_id}/scan, POST /service-cycles, POST /loss-assessments, POST /reconciliation-claims, POST /theft-investigations, POST /theft-investigations/{investigation_id}/status"

  # ---------------- 8 ownership (requires the resource to exist) ----------------
  - priority: 8
    category: auth
    check: "Entity-backed ownership of the target resource: a Brewer's X-User-ID must equal the resource's brewer-side FK (assessment.brewer_id on dispute, claim.misdelivered_to_brewer_id on respond, scan.brewer_id on a FILL scan) and a Distributor's X-User-ID must equal the distributor-side FK (claim.claimant_distributor_id on respond, scan.distributor_id on a DISTRIBUTION or RETURN scan, accrual.distributor_id on a payment read)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include Brewer or Distributor and that names an existing resource"

  # ---------------- 9 optimistic concurrency ----------------
  - priority: 9
    category: state
    check: "The supplied expected_<parent>_version equals the parent row's current version (see §1.2.1: expected_agreement_version on allocate, expected_keg_version on assessment create, expected_claim_version on claim respond)."
    error_id: "ERR_STALE_AGREEMENT_VERSION | ERR_STALE_KEG_VERSION | ERR_STALE_CLAIM_VERSION"
    http_status: 412
    applies_to: "POST /issuance-orders/{order_id}/allocate, POST /loss-assessments, POST /reconciliation-claims/{claim_id}/respond"

  # ---------------- 10-19 state preconditions ----------------
  - priority: 10
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2 (order status for allocate/dispatch/cancel, cycle stage for record-step/release, assessment_status for dispute/resolve, chargeback_status for chargeback-resolution, claim status for respond, investigation status for status changes, keg custody_state IN {IN_FLOAT, IN_SERVICE} for POST /service-cycles) and, on a FILL scan, the keg's governing IssuanceOrder is in status DISPATCHED. Keg custody_state legality for the requested scan_point is deliberately NOT judged here: that is priority 18's exclusive job, otherwise ERR_SCAN_SEQUENCE_INVALID would be unreachable."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every POST that drives a state machine"
  - priority: 11
    category: state
    check: "The target resource is not already in a terminal state of the dimension being moved (order CANCELLED/DISPATCHED, claim AGREED/REJECTED/WITHDRAWN, assessment UPHELD/WAIVED/SUPERSEDED, investigation CLOSED_*, keg custody LOST/STOLEN/SCRAPPED, agreement TERMINATED)."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every POST that drives a state machine"
  - priority: 12
    category: state
    check: "The governing FloatAgreement has status = ACTIVE."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /issuance-orders, POST /issuance-orders/{order_id}/allocate, POST /kegs/{keg_id}/scan with scan_point = FILL"
    note: "Priority pair A, higher-priority member: jointly violable with priority 50 ERR_CREDIT_LIMIT_EXCEEDED on POST /issuance-orders, and this state check must win."
  - priority: 13
    category: state
    check: "The pool's posture is not FROZEN."
    error_id: ERR_POOL_FROZEN
    http_status: 409
    applies_to: "POST /issuance-orders, POST /issuance-orders/{order_id}/allocate"
  - priority: 14
    category: state
    check: "While the pool's posture is RESTRICTED, order.requested_keg_count must not exceed pool.restricted_max_kegs_per_order."
    error_id: ERR_POOL_RESTRICTED
    http_status: 409
    applies_to: "POST /issuance-orders, POST /issuance-orders/{order_id}/allocate"
  - priority: 15
    category: state
    check: "The governing FloatAgreement's float_posture is not SUSPENDED."
    error_id: ERR_FLOAT_SUSPENDED
    http_status: 409
    applies_to: "POST /issuance-orders/{order_id}/allocate, POST /kegs/{keg_id}/scan with scan_point = FILL"
  - priority: 16
    category: state
    check: "The brewer's status is not SUSPENDED (PROBATION is permitted and is instead expressed through float_posture)."
    error_id: ERR_BREWER_SUSPENDED
    http_status: 409
    applies_to: "POST /float-agreements/{agreement_id}/activate, POST /issuance-orders, POST /kegs/{keg_id}/scan with scan_point = FILL, POST /loss-assessments/{assessment_id}/resolve"
  - priority: 17
    category: state
    check: "The distributor's status is not SUSPENDED."
    error_id: ERR_DISTRIBUTOR_SUSPENDED
    http_status: 409
    applies_to: "POST /kegs/{keg_id}/scan with scan_point IN {DISTRIBUTION, RETURN}, POST /return-incentives/{accrual_id}/pay"
  - priority: 18
    category: state
    check: "The requested scan_point is legal for the keg's current custody_state per the Keg custody_state machine: FILL only from ISSUED_TO_BREWER, DISTRIBUTION only from FILLED, RETAIL only from IN_TRADE, RETURN only from IN_TRADE or AT_RETAIL."
    error_id: ERR_SCAN_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /kegs/{keg_id}/scan"
  - priority: 19
    category: state
    check: "A claim response alternates sides: claim.last_responder_role must differ from the acting role, so the same side cannot counter twice in a row."
    error_id: ERR_RESPONDER_OUT_OF_TURN
    http_status: 409
    applies_to: "POST /reconciliation-claims/{claim_id}/respond"

  # ---------------- 20-26 business_safety (asset and compliance integrity first) ----------------
  - priority: 20
    category: business_safety
    check: "A keg may only be filled while it is certified: keg.service_state must be SERVICE_OK. SERVICE_DUE and SERVICE_FAILED kegs are refused."
    error_id: ERR_KEG_NOT_FIT_FOR_FILL
    http_status: 422
    applies_to: "POST /kegs/{keg_id}/scan with scan_point = FILL"
    note: "Priority pair B, higher-priority member: jointly violable with priority 27 ERR_BRAND_MISMATCH on the same FILL scan, and this safety check must win."
  - priority: 21
    category: business_safety
    check: "The keg's pressure certification has not lapsed: logical clock now - keg.last_pressure_test_at <= PRESSURE_TEST_INTERVAL_DAYS (730) days."
    error_id: ERR_PRESSURE_TEST_OVERDUE
    http_status: 422
    applies_to: "POST /kegs/{keg_id}/scan with scan_point = FILL"
  - priority: 22
    category: business_safety
    check: "A CLEAN step must record caustic_cycle_minutes >= MIN_CAUSTIC_CYCLE_MINUTES (12)."
    error_id: ERR_CAUSTIC_CYCLE_TOO_SHORT
    http_status: 422
    applies_to: "POST /service-cycles/{cycle_id}/record-step with step = CLEAN"
  - priority: 23
    category: business_safety
    check: "A PRESSURE_TEST step must record pressure_test_psi >= MIN_PRESSURE_TEST_PSI (30); a lower reading is an invalid test, not a failed one."
    error_id: ERR_PRESSURE_TEST_PSI_TOO_LOW
    http_status: 422
    applies_to: "POST /service-cycles/{cycle_id}/record-step with step = PRESSURE_TEST"
  - priority: 24
    category: business_safety
    check: "A quarantined cycle may only be retested when quarantine_reason = PRESSURE_TEST_FAIL; an INSPECTION_MAJOR_DEFECT quarantine can never be released back to float and the keg must be scrapped."
    error_id: ERR_QUARANTINE_RELEASE_BLOCKED
    http_status: 409
    applies_to: "POST /service-cycles/{cycle_id}/record-step with step = PRESSURE_TEST, POST /service-cycles/{cycle_id}/release"
  - priority: 25
    category: business_safety
    check: "Segregation of duties on certification: the X-User-ID releasing a cycle must differ from cycle.pressure_test_performed_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /service-cycles/{cycle_id}/release"
  - priority: 26
    category: business_safety
    check: "Segregation of duties on money, in two clauses. (a) On resolve: the X-User-ID resolving a LossAssessment must differ from assessment.created_by_user_id. (b) On chargeback-resolution: the acting role must match the requested action, SETTLE requiring PoolOperator and REVERSE requiring AssetRecoveryAnalyst, so no single role can both raise and erase a chargeback. Clause (b) cannot live at priority 2 because it reads payload.action, which is only known to be a valid enum member once priority 4 has passed; both clauses are therefore judged here, after the shape checks and after priority 10's chargeback_status check has confirmed the row is ISSUED."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loss-assessments/{assessment_id}/resolve, POST /loss-assessments/{assessment_id}/chargeback-resolution"

  # ---------------- 27-32 business_referential ----------------
  - priority: 27
    category: business_referential
    check: "A FILL scan's brand_code_scanned must equal the filling brewer's brand_code; a brewer may not fill a keg under another brand's collar."
    error_id: ERR_BRAND_MISMATCH
    http_status: 422
    applies_to: "POST /kegs/{keg_id}/scan with scan_point = FILL"
    note: "Priority pair B, lower-priority member."
  - priority: 28
    category: business_referential
    check: "The party identifier matches party_type: BREWER requires brewer_id and forbids distributor_id/retail_account_code; DISTRIBUTOR requires distributor_id; RETAIL_ACCOUNT requires retail_account_code. The party must also be the one the scan point allows (FILL is BREWER, DISTRIBUTION and RETURN are DISTRIBUTOR, RETAIL is RETAIL_ACCOUNT). Supplying a FORBIDDEN identifier is already refused at priority 4 as ERR_INVALID_REQUEST, so the failure modes reachable here are a MISSING required identifier for the declared party_type and a party_type that the scan_point does not allow."
    error_id: ERR_SCAN_PARTY_MISMATCH
    http_status: 422
    applies_to: "POST /kegs/{keg_id}/scan"
  - priority: 29
    category: business_referential
    check: "The brand_code_scanned on a DISTRIBUTION, RETAIL or RETURN scan must resolve to some existing Brewer.brand_code, otherwise misdelivery cannot be attributed to an owner."
    error_id: ERR_BRAND_OWNER_UNKNOWN
    http_status: 422
    applies_to: "POST /kegs/{keg_id}/scan with scan_point IN {DISTRIBUTION, RETAIL, RETURN}"
  - priority: 30
    category: business_referential
    check: "A ReconciliationClaim requires evidence: the keg must carry a ScanEvent with misdelivery_detected = true whose scanned_at equals payload.evidence_scanned_at, and payload.misdelivered_to_brewer_id must be the Brewer whose brand_code equals that scan's brand_code_scanned."
    error_id: ERR_NO_MISDELIVERY_EVIDENCE
    http_status: 422
    applies_to: "POST /reconciliation-claims"
  - priority: 31
    category: business_referential
    check: "When supersedes_claim_id is supplied it must name a claim on the SAME keg whose status is REJECTED or WITHDRAWN."
    error_id: ERR_CLAIM_SUPERSEDE_MISMATCH
    http_status: 422
    applies_to: "POST /reconciliation-claims"
  - priority: 32
    category: business_referential
    check: "A LossAssessment needs a chargeable party: at least one of keg.filling_brewer_id or keg.current_brewer_id must be set unless cause = STOLEN_SUSPECTED (which charges nobody). A CommodityIndex row effective on or before the valuation date must also exist, otherwise the scrap credit cannot be valued."
    error_id: "ERR_NO_CHARGEABLE_PARTY | ERR_NO_COMMODITY_INDEX"
    http_status: 422
    applies_to: "POST /loss-assessments"

  # ---------------- 33-37 business_temporal ----------------
  - priority: 33
    category: business_temporal
    check: "scanned_at must not be in the future relative to the logical clock, and received_at / hold_started_at / dispatched_at / effective_date must likewise not be in the future."
    error_id: ERR_SCAN_TIMESTAMP_FUTURE
    http_status: 422
    applies_to: "POST /kegs/{keg_id}/scan, POST /service-cycles, POST /issuance-orders/{order_id}/dispatch, POST /theft-investigations/{investigation_id}/status, POST /float-agreements/{agreement_id}/activate"
  - priority: 34
    category: business_temporal
    check: "No existing ScanEvent on this keg has the same (scan_point, scanned_at) pair."
    error_id: ERR_DUPLICATE_SCAN
    http_status: 409
    applies_to: "POST /kegs/{keg_id}/scan"
  - priority: 35
    category: business_temporal
    check: "scanned_at must not fall strictly inside an already-closed custody interval, i.e. scanned_at >= keg.dwell_started_at (half-open intervals: the boundary instant itself is accepted). See calculation custody_interval_integrity."
    error_id: ERR_CUSTODY_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /kegs/{keg_id}/scan"
  - priority: 36
    category: business_temporal
    check: "received_at must not fall inside any existing intake window of the same service centre, where the window [received_at, received_at + intake_buffer_hours] is CLOSED at both ends. See calculation service_center_intake."
    error_id: ERR_INTAKE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /service-cycles"
  - priority: 37
    category: business_temporal
    check: "A ReconciliationClaim must be filed within CLAIM_WINDOW_DAYS (30) days of the evidence scan: logical clock now - evidence_scanned_at <= 30 days."
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /reconciliation-claims"

  # ---------------- 38-49 business_constraint ----------------
  - priority: 38
    category: business_constraint
    check: "Uniqueness: Brewer.brand_code, KegPool.pool_code, Keg.asset_tag (globally across all pools) and CommodityIndex.effective_date are each unique."
    error_id: "ERR_DUPLICATE_BRAND_CODE | ERR_DUPLICATE_POOL_CODE | ERR_DUPLICATE_ASSET_TAG | ERR_DUPLICATE_INDEX_DATE"
    http_status: 409
    applies_to: "POST /brewers, POST /pools, POST /pools/{pool_id}/kegs, POST /commodity-index"
  - priority: 39
    category: business_constraint
    check: "At most one ACTIVE FloatAgreement may exist per (brewer_id, pool_id) pair."
    error_id: ERR_AGREEMENT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /float-agreements/{agreement_id}/activate"
  - priority: 40
    category: business_constraint
    check: "A keg may not carry a second open assessment while an existing one is DISPUTED; a PROPOSED one is legitimately superseded instead of rejected."
    error_id: ERR_ASSESSMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /loss-assessments"
  - priority: 41
    category: business_constraint
    check: "A keg may not carry two claims in status SUBMITTED or COUNTERED at once."
    error_id: ERR_CLAIM_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /reconciliation-claims"
  - priority: 42
    category: business_constraint
    check: "A COUNTER response requires claim.round_count < MAX_CLAIM_ROUNDS (3); AGREE, REJECT and WITHDRAW are always permitted."
    error_id: ERR_CLAIM_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /reconciliation-claims/{claim_id}/respond"
  - priority: 43
    category: business_constraint
    check: "requested_keg_count + agreement.kegs_at_brewer_count must not exceed agreement.float_size_kegs."
    error_id: ERR_FLOAT_SIZE_EXCEEDED
    http_status: 422
    applies_to: "POST /issuance-orders"
  - priority: 44
    category: business_constraint
    check: "The service centre's open_cycle_count must be strictly below its concurrent_cycle_capacity."
    error_id: ERR_SERVICE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /service-cycles"
  - priority: 45
    category: business_constraint
    check: "The allocation candidate set must be non-empty (see calculation allocation_selector)."
    error_id: ERR_NO_ELIGIBLE_KEGS
    http_status: 409
    applies_to: "POST /issuance-orders/{order_id}/allocate"
  - priority: 46
    category: business_constraint
    check: "When the candidate set is non-empty but smaller than requested_keg_count, allow_partial must be true."
    error_id: ERR_INSUFFICIENT_FLOAT
    http_status: 409
    applies_to: "POST /issuance-orders/{order_id}/allocate"
  - priority: 47
    category: business_constraint
    check: "A FloatAgreement may only be terminated when kegs_at_brewer_count = 0 and no order of the agreement sits in REQUESTED, ALLOCATED or PARTIALLY_ALLOCATED."
    error_id: ERR_AGREEMENT_FLOAT_OUTSTANDING
    http_status: 409
    applies_to: "POST /float-agreements/{agreement_id}/terminate"
  - priority: 48
    category: business_constraint
    check: "Every keg named in an EVIDENCE_HOLD action must already be attached to that investigation and must not be in a terminal custody state."
    error_id: ERR_KEG_NOT_ATTACHED
    http_status: 409
    applies_to: "POST /theft-investigations/{investigation_id}/status"
  - priority: 49
    category: business_constraint
    check: "An accrual may only be paid from status ACCRUED."
    error_id: ERR_ACCRUAL_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /return-incentives/{accrual_id}/pay"

  # ---------------- 50-51 business_fiscal (money last) ----------------
  - priority: 50
    category: business_fiscal
    check: "Projected exposure must stay within the brewer's credit limit: brewer.chargeback_balance_cents + requested_keg_count * agreement.per_fill_rate_cents <= brewer.credit_limit_cents on order creation, and brewer.chargeback_balance_cents + agreement.billed_amount_cents + fill_charge_net_cents <= brewer.credit_limit_cents on a FILL scan."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /issuance-orders, POST /kegs/{keg_id}/scan with scan_point = FILL"
    note: "Priority pair A, lower-priority member: on POST /issuance-orders against a DRAFT agreement held by an over-limit brewer, priority 12 ERR_AGREEMENT_NOT_ACTIVE (409) wins over this 402."
  - priority: 51
    category: business_fiscal
    check: "A SETTLE action's amount_cents must equal assessment.net_chargeback_cents exactly; partial settlement is not supported."
    error_id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /loss-assessments/{assessment_id}/chargeback-resolution"

endpoints:
  # ---------------- Brewer ----------------
  - method: POST
    path: "/brewers"
    description: "Register a brewer (lessee of pool kegs)."
    roles: [PoolOperator]
    code: 201
    input: [name, brand_code, "credit_limit_cents?"]
    output: Brewer
    side_effects:
      - "brand_code uniqueness enforced (ERR_DUPLICATE_BRAND_CODE)"
      - "status = ACTIVE; chargeback_balance_cents = 0; lifetime_fill_count = 0; upheld_loss_count = 0; both loss_rate_bp fields = 0"
  - method: GET
    path: "/brewers/{brewer_id}"
    description: "Read one brewer including its derived chargeback ledger and both loss-rate variants."
    roles: [PoolOperator, Brewer, Distributor, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: Brewer
    side_effects: []
  - method: GET
    path: "/brewers/{brewer_id}/loss-rate"
    description: "Computed read of calculation brewer_loss_rate_bp for one brewer under the requested variant."
    roles: [PoolOperator, Brewer, AssetRecoveryAnalyst]
    code: 200
    input: ["basis?"]
    output: "{ brewer_id: string, basis: string, loss_rate_bp: integer, upheld_loss_count: integer, fill_count: integer, window_start: string, window_end: string, basis_insufficient: boolean }"
    side_effects:
      - "basis defaults to TRAILING_90D; LIFETIME returns window_start = null and window_end = null"
      - "no persistence; the stored brewer fields are recomputed and returned, never written"
  - method: POST
    path: "/brewers/{brewer_id}/status"
    description: "Operator override of a brewer's standing (ACTIVE, PROBATION or SUSPENDED)."
    roles: [PoolOperator]
    code: 200
    input: [status, "status_reason?"]
    output: Brewer
    side_effects:
      - "brewer.status and status_reason set; brewer.version += 1"
      - "cascades: every ACTIVE FloatAgreement of this brewer recomputes float_posture (PROBATION or SUSPENDED forces SUSPENDED, ACTIVE releases it)"

  # ---------------- Distributor ----------------
  - method: POST
    path: "/distributors"
    description: "Register a wholesaler."
    roles: [PoolOperator]
    code: 201
    input: [name, region_code, "return_incentive_rate_cents_per_keg?"]
    output: Distributor
    side_effects:
      - "cooperation_tier = NONE (so returns accrue 0 until a cooperation agreement is signed); status = ACTIVE; all counters 0"
  - method: GET
    path: "/distributors/{distributor_id}"
    description: "Read one distributor including cooperation tier, return statistics and the derived incentive ledger."
    roles: [PoolOperator, Brewer, Distributor, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: POST
    path: "/distributors/{distributor_id}/cooperation-agreement"
    description: "Sign or revise a distributor cooperation agreement, which sets the incentive tier and base rate."
    roles: [PoolOperator]
    code: 200
    input: [cooperation_tier, effective_date, "return_incentive_rate_cents_per_keg?", "status?"]
    output: Distributor
    side_effects:
      - "cooperation_tier, cooperation_effective_date and optionally return_incentive_rate_cents_per_keg / status set; distributor.version += 1"
      - "this is the ONLY way to enter BRONZE and the only way to move a tier DOWN; automatic promotion handles BRONZE -> SILVER -> GOLD"
      - "already-minted accruals are never re-priced"

  # ---------------- KegPool and Keg ----------------
  - method: POST
    path: "/pools"
    description: "Create a keg pool (one asset class: size, stainless mass, replacement cost, region)."
    roles: [PoolOperator]
    code: 201
    input: [pool_code, size_liters, stainless_weight_kg, replacement_cost_cents, region_code, "restrict_threshold_pct?", "freeze_threshold_pct?", "restricted_max_kegs_per_order?"]
    output: KegPool
    side_effects:
      - "pool_code uniqueness enforced; freeze_threshold_pct must be < restrict_threshold_pct"
      - "all census counters 0; available_pct = 0.00; posture = FROZEN (an empty pool cannot issue float)"
  - method: GET
    path: "/pools/{pool_id}"
    description: "Read one pool with its five census counters, available_pct and derived posture."
    roles: [PoolOperator, Brewer, Distributor, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: KegPool
    side_effects: []
  - method: POST
    path: "/pools/{pool_id}/kegs"
    description: "Import a physical keg into a pool. The optional counters exist so an operator can migrate an existing fleet with real wear and certification history."
    roles: [PoolOperator]
    code: 201
    input: [asset_tag, "initial_custody_state?", "fill_count?", "fills_at_last_pressure_test?", "last_pressure_test_at?"]
    output: Keg
    side_effects:
      - "asset_tag uniqueness enforced globally across all pools (ERR_DUPLICATE_ASSET_TAG)"
      - "custody_state = initial_custody_state or IN_FLOAT; only IN_FLOAT, IN_SERVICE and QUARANTINED may be seeded"
      - "last_pressure_test_at defaults to the new keg's own created_at, so the field is never null"
      - "service_state derived from the imported counters with the same rule the sweep uses: SERVICE_DUE when fill_count - fills_at_last_pressure_test >= PRESSURE_TEST_INTERVAL_FILLS (25), SERVICE_OVERDUE when the certification is older than PRESSURE_TEST_INTERVAL_DAYS (730) days, else SERVICE_OK"
      - "stainless_scrap_value_cents computed from the effective CommodityIndex (calculation stainless_scrap_value); when no CommodityIndex row is effective on or before the current logical date the keg is still imported with stainless_scrap_value_cents = 0 (only POST /loss-assessments refuses, at priority 32)"
      - "pool census, available_pct and posture recomputed (calculation pool_posture); every ACTIVE agreement on the pool recomputes float_posture"
  - method: GET
    path: "/pools/{pool_id}/kegs"
    description: "List the kegs of one pool (sub-resource reverse lookup for Keg.pool_id)."
    roles: [PoolOperator, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: ["custody_state?", "service_state?", "limit?", "offset?"]
    output: Keg[]
    side_effects: []
  - method: GET
    path: "/kegs/{keg_id}"
    description: "Read one keg: both state dimensions, dwell flag, custody FKs and its recomputed stainless scrap value."
    roles: [PoolOperator, Brewer, Distributor, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: Keg
    side_effects:
      - "stainless_scrap_value_cents is recomputed against the currently effective CommodityIndex on every read"
  - method: GET
    path: "/kegs"
    description: "Filtered keg list; the reverse-reachability channel for every custody FK on Keg."
    roles: [PoolOperator, Brewer, Distributor, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: ["pool_id?", "current_brewer_id?", "current_distributor_id?", "filling_brewer_id?", "issuance_order_id?", "theft_investigation_id?", "custody_state?", "service_state?", "dwell_flag?", "limit?", "offset?"]
    output: Keg[]
    side_effects: []
  - method: POST
    path: "/kegs/{keg_id}/scan"
    description: "Record a tag read at a fill, distribution, retail or return point. This is the single write that drives custody, dwell, fill billing, misdelivery detection and return incentives."
    roles: [PoolOperator, Brewer, Distributor]
    code: 201
    input: [scan_point, party_type, scanned_at, brand_code_scanned, "brewer_id?", "distributor_id?", "retail_account_code?"]
    output: ScanEvent
    side_effects:
      - "recorded_at = logical clock now; is_late_arrival and the custody projection per calculation keg_custody_projection; keg.custody_state, last_scanned_at, scan_count, dwell_started_at updated; keg.version += 1"
      - "FILL: keg.fill_count += 1, brewer.lifetime_fill_count += 1, keg.filled_brand_code = brand_code_scanned, keg.filling_brewer_id = brewer_id, fill_charge_net_cents computed per calculation fill_charge_net, agreement.billed_amount_cents and billed_fills_count advanced, keg.service_state may move SERVICE_OK -> SERVICE_DUE, keg.misdelivery_open = false"
      - "DISTRIBUTION: keg.current_distributor_id = distributor_id, keg.distributor_custody_started_at = scanned_at; misdelivery_detected = (brand_code_scanned != keg.filled_brand_code), which sets keg.misdelivery_open = true"
      - "RETAIL: keg.retail custody recorded; distributor_custody_started_at is deliberately NOT reset, so the accountability spell spans retail"
      - "RETURN: dwell_days_closed computed, keg moves to IN_SERVICE, a RETURN_DWELL ReturnIncentiveAccrual is minted per calculation return_incentive, distributor counters recomputed and at most one cooperation tier promotion applied per calculation cooperation_tier_promotion, agreement float_posture recomputed, pool census and posture recomputed"
      - "cumulative_dwell_days recomputed for the keg"
  - method: GET
    path: "/kegs/{keg_id}/dwell"
    description: "Computed read of calculation dwell_days for one keg: both open clocks, the applicable limit and the dwell classification."
    roles: [PoolOperator, Brewer, Distributor, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: "{ keg_id: string, custody_state: string, brewer_spell_days: integer, distributor_spell_days: integer, limit_days: integer, approaching_days: integer, dwell_flag: string, cumulative_dwell_days: integer, dwell_started_at: string, distributor_custody_started_at: string }"
    side_effects:
      - "read-only: dwell_flag is returned as it would be classified now but is NOT persisted (only the replenishment sweep writes it)"
  - method: GET
    path: "/scan-events/{scan_event_id}"
    description: "Read one immutable scan event."
    roles: [PoolOperator, Brewer, Distributor, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: ScanEvent
    side_effects: []
  - method: GET
    path: "/scan-events"
    description: "Filtered scan-event list; reverse-reachability channel for ScanEvent.keg_id, brewer_id and distributor_id, and the evidence search behind reconciliation claims."
    roles: [PoolOperator, Brewer, Distributor, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: ["keg_id?", "brewer_id?", "distributor_id?", "scan_point?", "misdelivery_detected?", "is_late_arrival?", "limit?", "offset?"]
    output: ScanEvent[]
    side_effects: []

  # ---------------- FloatAgreement ----------------
  - method: POST
    path: "/float-agreements"
    description: "Draft a float agreement fixing a brewer's float size and per-fill rate for one pool."
    roles: [PoolOperator]
    code: 201
    input: [brewer_id, pool_id, float_size_kegs, per_fill_rate_cents, "replenishment_threshold_pct?", "min_fills_per_month?"]
    output: FloatAgreement
    side_effects:
      - "status = DRAFT; float_posture = HEALTHY; all counters 0; a DRAFT agreement gates nothing and cannot back an order"
  - method: POST
    path: "/float-agreements/{agreement_id}/activate"
    description: "Activate a drafted float agreement."
    roles: [PoolOperator]
    code: 200
    input: [effective_date]
    output: FloatAgreement
    side_effects:
      - "status = ACTIVE; effective_date set; agreement.version += 1"
      - "float_posture computed per calculation float_posture (a fresh agreement with 0 kegs at the brewer is TIGHT, or SUSPENDED when the pool is FROZEN or the brewer is on PROBATION)"
      - "at most one ACTIVE agreement per (brewer_id, pool_id)"
  - method: POST
    path: "/float-agreements/{agreement_id}/terminate"
    description: "Terminate an active float agreement once all float has come home."
    roles: [PoolOperator]
    code: 200
    input: [terminated_reason]
    output: FloatAgreement
    side_effects:
      - "status = TERMINATED; terminated_reason set; agreement.version += 1"
      - "refused with ERR_AGREEMENT_FLOAT_OUTSTANDING while kegs_at_brewer_count > 0 or any order is REQUESTED / ALLOCATED / PARTIALLY_ALLOCATED"
  - method: GET
    path: "/float-agreements/{agreement_id}"
    description: "Read one float agreement including its float posture and billing ledger."
    roles: [PoolOperator, Brewer, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: FloatAgreement
    side_effects: []
  - method: GET
    path: "/float-agreements"
    description: "Filtered agreement list; reverse-reachability channel for FloatAgreement.brewer_id and pool_id."
    roles: [PoolOperator, Brewer, AssetRecoveryAnalyst]
    code: 200
    input: ["brewer_id?", "pool_id?", "status?", "float_posture?", "limit?", "offset?"]
    output: FloatAgreement[]
    side_effects: []

  # ---------------- IssuanceOrder ----------------
  - method: POST
    path: "/issuance-orders"
    description: "Request kegs against an active float agreement. The order stays REQUESTED until it is allocated."
    roles: [PoolOperator]
    code: 201
    input: [agreement_id, requested_keg_count, "allow_partial?"]
    output: IssuanceOrder
    side_effects:
      - "status = REQUESTED; brewer_id denormalized from the agreement; allocated_keg_count = 0; allocated_keg_ids = []"
      - "no keg is touched and no census counter moves at this point"
  - method: POST
    path: "/issuance-orders/{order_id}/allocate"
    description: "Allocate physical kegs to a requested order using calculation allocation_selector. Guarded by OCC on the parent agreement (§1.2.1 order-allocate-stale-agreement)."
    roles: [PoolOperator]
    code: 200
    input: [expected_agreement_version]
    output: IssuanceOrder
    side_effects:
      - "increments FloatAgreement.version by 1"
      - "candidate set built and ranked per calculation allocation_selector; allocated_keg_ids, allocated_keg_count, allocation_shortfall and per_fill_price_cents_pinned set; status = ALLOCATED or PARTIALLY_ALLOCATED"
      - "each allocated keg moves IN_FLOAT -> ISSUED_TO_BREWER with current_brewer_id and issuance_order_id set, dwell_started_at = logical clock now, keg.version += 1"
      - "pool census, available_pct and posture recomputed; the agreement's kegs_at_brewer_count, pending_replenishment_kegs and float_posture recomputed"
  - method: POST
    path: "/issuance-orders/{order_id}/dispatch"
    description: "Mark an allocated order as shipped to the brewer."
    roles: [PoolOperator]
    code: 200
    input: [dispatched_at]
    output: IssuanceOrder
    side_effects:
      - "status = DISPATCHED; dispatched_at set; order.version += 1"
      - "each allocated keg's dwell_started_at is re-based to dispatched_at, which is the instant the brewer's dwell clock legally starts"
      - "agreement.kegs_issued_count recomputed"
  - method: POST
    path: "/issuance-orders/{order_id}/cancel"
    description: "Cancel a requested, allocated or partially allocated order and return any allocated kegs to float."
    roles: [PoolOperator]
    code: 200
    input: [cancel_reason]
    output: IssuanceOrder
    side_effects:
      - "status = CANCELLED; cancel_reason set; order.version += 1"
      - "every allocated keg reverts ISSUED_TO_BREWER -> IN_FLOAT, clearing current_brewer_id, issuance_order_id and dwell_started_at; keg.version += 1"
      - "pool census and posture recomputed to EXACTLY their pre-allocation values (invariant pool_census_conserved); agreement counters and float_posture recomputed"
  - method: GET
    path: "/issuance-orders/{order_id}"
    description: "Read one issuance order including its allocated keg ids and shortfall."
    roles: [PoolOperator, Brewer, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: IssuanceOrder
    side_effects: []
  - method: GET
    path: "/issuance-orders"
    description: "Filtered order list; reverse-reachability channel for IssuanceOrder.agreement_id and brewer_id."
    roles: [PoolOperator, Brewer, AssetRecoveryAnalyst]
    code: 200
    input: ["agreement_id?", "brewer_id?", "status?", "limit?", "offset?"]
    output: IssuanceOrder[]
    side_effects: []
  - method: POST
    path: "/pools/{pool_id}/replenishment-sweep"
    description: "Advance every open dwell spell in the pool to its current classification and report which agreements have crossed their replenishment threshold. This is the only writer of Keg.dwell_flag."
    roles: [PoolOperator]
    code: 200
    input: []
    output: "{ pool_id: string, swept_keg_count: integer, approaching_keg_count: integer, overdue_keg_count: integer, available_pct: number, posture: string, tight_agreement_ids: string[], suspended_agreement_ids: string[], pending_replenishment_kegs_total: integer }"
    side_effects:
      - "every keg in the pool has dwell_flag reclassified per calculation dwell_days; kegs with no dwell limit are forced to WITHIN_LIMIT"
      - "swept_keg_count counts ONLY the kegs that had an open dwell spell to advance, i.e. custody_state IN {ISSUED_TO_BREWER, FILLED, IN_TRADE, AT_RETAIL}; IN_FLOAT, IN_SERVICE, QUARANTINED, EVIDENCE_HOLD and written-off kegs are forced to WITHIN_LIMIT and are NOT counted"
      - "approaching_keg_count and overdue_keg_count count the swept kegs whose new dwell_flag is APPROACHING / OVERDUE; tight_agreement_ids and suspended_agreement_ids list the pool's ACTIVE agreements by their recomputed float_posture"
      - "pool census, available_pct and posture recomputed; every ACTIVE agreement on the pool recomputes kegs_at_brewer_count, pending_replenishment_kegs and float_posture"
      - "no keg custody_state changes and no money moves: the sweep is the trigger detector, not the remediation"

  # ---------------- Service centre and cycles ----------------
  - method: POST
    path: "/service-centers"
    description: "Create a cleaning / inspection / pressure-test facility with a concurrency capacity and an intake buffer."
    roles: [PoolOperator]
    code: 201
    input: [name, region_code, concurrent_cycle_capacity, "intake_buffer_hours?"]
    output: ServiceCenter
    side_effects:
      - "intake_buffer_hours defaults to 4; open_cycle_count = 0"
  - method: GET
    path: "/service-centers/{center_id}"
    description: "Read one service centre including its live occupancy count."
    roles: [PoolOperator, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: []
  - method: POST
    path: "/service-cycles"
    description: "Book a returned keg into a service centre, opening a cleaning/inspection/pressure-test cycle."
    roles: [PoolOperator, ServiceTechnician]
    code: 201
    input: [keg_id, service_center_id, received_at]
    output: ServiceCycle
    side_effects:
      - "both resource checks of calculation service_center_intake run: the closed intake window first (ERR_INTAKE_WINDOW_CONFLICT), then the aggregate occupancy (ERR_SERVICE_CAPACITY_EXCEEDED)"
      - "stage = RECEIVED; received_at pinned; centre.open_cycle_count += 1"
      - "the keg must be in custody_state IN_FLOAT (a routine recertification pull off the float, the declared IN_FLOAT -> IN_SERVICE edge) or ALREADY in IN_SERVICE (it arrived by a RETURN scan, or resumed out of EVIDENCE_HOLD, and is only now being booked onto a line). Every other custody_state -- ISSUED_TO_BREWER, FILLED, IN_TRADE, AT_RETAIL, QUARANTINED, EVIDENCE_HOLD, LOST, STOLEN, SCRAPPED -- is ERR_INVALID_STATE 409 at validation priority 10, because §1.2 declares no edge into IN_SERVICE from those buckets. This is not a scan, so priority 18 is never involved. A QUARANTINED keg is refused here in particular: its retest belongs to the cycle it is already attached to."
      - "custody and census move ONLY on the IN_FLOAT variant: keg.custody_state = IN_SERVICE, keg.version += 1, pool.kegs_available -= 1, pool.kegs_servicing += 1, available_pct and posture recomputed, every ACTIVE agreement on the pool recomputes float_posture. Booking a keg that is already IN_SERVICE touches neither the keg nor the census (the RETURN scan already moved it from kegs_circulating to kegs_servicing) and does not bump keg.version."
  - method: POST
    path: "/service-cycles/{cycle_id}/record-step"
    description: "Record the next step of a service cycle (CLEAN, INSPECT or PRESSURE_TEST). One endpoint per step keeps the stage machine's ordering explicit."
    roles: [ServiceTechnician]
    code: 200
    input: [step, occurred_at, "caustic_cycle_minutes?", "inspection_result?", "pressure_test_psi?", "pressure_test_result?"]
    output: ServiceCycle
    side_effects:
      - "CLEAN: requires stage RECEIVED and caustic_cycle_minutes >= 12; stage = CLEANED, cleaned_at set"
      - "INSPECT: requires stage CLEANED; inspection_result PASS or MINOR_DEFECT advances to INSPECTED, MAJOR_DEFECT quarantines the cycle and sets keg custody QUARANTINED with service_state SERVICE_FAILED"
      - "PRESSURE_TEST: requires stage INSPECTED, or stage QUARANTINED with quarantine_reason = PRESSURE_TEST_FAIL (the retest loop); PASS advances to PRESSURE_TESTED and records pressure_test_performed_by_user_id = acting X-User-ID; FAIL quarantines with reason PRESSURE_TEST_FAIL and sets keg service_state SERVICE_FAILED"
      - "cycle.version += 1 on every accepted step"
  - method: POST
    path: "/service-cycles/{cycle_id}/release"
    description: "Release a pressure-tested keg back into pool float. Segregated from the technician who performed the test."
    roles: [PoolOperator, ServiceTechnician]
    code: 200
    input: [released_at]
    output: ServiceCycle
    side_effects:
      - "requires stage PRESSURE_TESTED with pressure_test_result = PASS; refused with ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals cycle.pressure_test_performed_by_user_id"
      - "stage = RELEASED; released_at and released_by_user_id set; centre.open_cycle_count -= 1; cycle.version += 1"
      - "keg custody_state -> IN_FLOAT; service_state -> SERVICE_OK; fills_at_last_pressure_test = fill_count; last_pressure_test_at = cycle.pressure_tested_at; current_brewer_id, current_distributor_id, issuance_order_id and distributor_custody_started_at cleared; dwell_started_at = released_at; dwell_flag = WITHIN_LIMIT; keg.version += 1"
      - "pool census, available_pct and posture recomputed; every ACTIVE agreement on the pool recomputes float_posture"
  - method: GET
    path: "/service-cycles/{cycle_id}"
    description: "Read one service cycle with every step timestamp and result."
    roles: [PoolOperator, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: ServiceCycle
    side_effects: []
  - method: GET
    path: "/service-cycles"
    description: "Filtered cycle list; reverse-reachability channel for ServiceCycle.keg_id and service_center_id."
    roles: [PoolOperator, ServiceTechnician, AssetRecoveryAnalyst]
    code: 200
    input: ["keg_id?", "service_center_id?", "stage?", "inspection_result?", "pressure_test_result?", "limit?", "offset?"]
    output: ServiceCycle[]
    side_effects: []

  # ---------------- LossAssessment and chargebacks ----------------
  - method: POST
    path: "/loss-assessments"
    description: "Open a loss, damage or non-return assessment on a keg and pin its valuation. Guarded by OCC on the parent keg (§1.2.1 assessment-create-stale-keg); a PROPOSED assessment on the same keg is legitimately superseded."
    roles: [AssetRecoveryAnalyst]
    code: 201
    input: [keg_id, cause, expected_keg_version, "assessment_basis?", "theft_investigation_id?"]
    output: LossAssessment
    side_effects:
      - "increments Keg.version by 1"
      - "assessment_basis defaults to REPLACEMENT_COST and is forced to REPLACEMENT_COST when keg.fill_count = 0 or cause = STOLEN_SUSPECTED"
      - "gross_value_cents, scrap_credit_cents, assessed_value_cents, brewer_liability_pct_bp and net_chargeback_cents pinned per calculation keg_loss_value; commodity_index_id pinned; dwell_days_at_assessment recorded"
      - "brewer_id resolved to keg.filling_brewer_id or keg.current_brewer_id; created_by_user_id = acting X-User-ID"
      - "assessment_status = PROPOSED; chargeback_status = NONE; keg.assessment_open = true"
      - "any existing PROPOSED assessment on this keg moves to SUPERSEDED (its version += 1); an existing DISPUTED one instead rejects the request with ERR_ASSESSMENT_ALREADY_OPEN"
  - method: POST
    path: "/loss-assessments/{assessment_id}/dispute"
    description: "Brewer disputes a proposed assessment, freezing supersession until an analyst resolves it."
    roles: [Brewer]
    code: 200
    input: [dispute_reason]
    output: LossAssessment
    side_effects:
      - "requires the acting X-User-ID to equal assessment.brewer_id"
      - "assessment_status = DISPUTED; dispute_reason set; assessment.version += 1"
  - method: POST
    path: "/loss-assessments/{assessment_id}/resolve"
    description: "Uphold or waive an assessment. Upholding fires the four-link chargeback cascade; segregated from the analyst who created the assessment."
    roles: [AssetRecoveryAnalyst]
    code: 200
    input: [resolution, "resolution_notes?"]
    output: LossAssessment
    side_effects:
      - "refused with ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals assessment.created_by_user_id"
      - "UPHELD: chargeback_status NONE -> ISSUED when net_chargeback_cents > 0; keg written off to SCRAPPED / LOST per cause; keg.assessment_open = false; brewer.chargeback_balance_cents, upheld_loss_count and both loss_rate_bp variants recomputed; brewer may cross into PROBATION, which suspends float_posture on all its ACTIVE agreements; pool census and posture recomputed"
      - "WAIVED: chargeback_status stays NONE, no money moves, keg custody and every census counter are left untouched; keg.assessment_open = false"
      - "resolved_by_user_id, resolution_notes and assessment.version += 1 in both cases"
  - method: POST
    path: "/loss-assessments/{assessment_id}/chargeback-resolution"
    description: "Settle or reverse an issued chargeback. SETTLE is the operator's action, REVERSE is the analyst's."
    roles: [PoolOperator, AssetRecoveryAnalyst]
    code: 200
    input: [action, "amount_cents?", "resolution_notes?"]
    output: LossAssessment
    side_effects:
      - "role/action split (validation priority 26, ERR_SEGREGATION_OF_DUTIES 403): SETTLE is refused for AssetRecoveryAnalyst and REVERSE is refused for PoolOperator, even though both roles reach this endpoint"
      - "SETTLE (PoolOperator only): requires amount_cents == net_chargeback_cents; chargeback_status = SETTLED, settled_amount_cents set; the row STAYS in the brewer's balance"
      - "REVERSE (AssetRecoveryAnalyst only): chargeback_status = REVERSED; the row leaves the balance, restoring it to its exact pre-uphold value (invariant chargeback_ledger_conserved); a PROBATION forced by the balance threshold is lifted back to ACTIVE, which releases float_posture on the brewer's ACTIVE agreements"
      - "assessment.version += 1; brewer.version += 1"
  - method: GET
    path: "/loss-assessments/{assessment_id}"
    description: "Read one assessment with its pinned valuation and both status dimensions."
    roles: [PoolOperator, Brewer, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: LossAssessment
    side_effects: []
  - method: GET
    path: "/loss-assessments"
    description: "Filtered assessment list; reverse-reachability channel for LossAssessment.keg_id, brewer_id, commodity_index_id and theft_investigation_id."
    roles: [PoolOperator, Brewer, AssetRecoveryAnalyst]
    code: 200
    input: ["keg_id?", "brewer_id?", "commodity_index_id?", "theft_investigation_id?", "assessment_status?", "chargeback_status?", "cause?", "limit?", "offset?"]
    output: LossAssessment[]
    side_effects: []

  # ---------------- Cross-brand reconciliation ----------------
  - method: POST
    path: "/reconciliation-claims"
    description: "A distributor opens a cross-brand misdelivery claim against the brewer whose collar was found on another brand's keg."
    roles: [Distributor]
    code: 201
    input: [keg_id, misdelivered_to_brewer_id, claimed_offset_cents, evidence_scanned_at, "supersedes_claim_id?"]
    output: ReconciliationClaim
    side_effects:
      - "claimant_distributor_id = acting X-User-ID; owning_brewer_id = keg.filling_brewer_id"
      - "requires a ScanEvent on this keg with misdelivery_detected = true whose scanned_at equals evidence_scanned_at, filed within CLAIM_WINDOW_DAYS (30) days"
      - "status = SUBMITTED; round_count = 0; last_responder_role = Distributor; counter_offset_cents and agreed_offset_cents null"
      - "when supersedes_claim_id is supplied the prior claim must be on the same keg and REJECTED or WITHDRAWN"
  - method: POST
    path: "/reconciliation-claims/{claim_id}/respond"
    description: "Advance a claim negotiation: COUNTER, AGREE, REJECT or WITHDRAW. Guarded by OCC on the claim itself (§1.2.1 claim-respond-stale-claim)."
    roles: [Brewer, Distributor]
    code: 200
    input: [response, expected_claim_version, "counter_offset_cents?"]
    output: ReconciliationClaim
    side_effects:
      - "increments ReconciliationClaim.version by 1"
      - "the acting side must be the one whose turn it is (claim.last_responder_role must differ from the acting role) and must own its side of the claim"
      - "COUNTER: status flips SUBMITTED <-> COUNTERED, counter_offset_cents set, round_count += 1; refused with ERR_CLAIM_ROUND_LIMIT once round_count reaches MAX_CLAIM_ROUNDS (3)"
      - "AGREE: status = AGREED, agreed_offset_cents fixed to the outstanding counter (or the original claim when none), closed_at set; a RECONCILIATION_OFFSET ReturnIncentiveAccrual is minted for the claimant and distributor.incentive_accrual_cents recomputed WITHOUT touching total_returns_count, on_time_return_pct or cooperation_tier; keg.misdelivery_open = false and keg.version += 1"
      - "REJECT / WITHDRAW: status set, closed_at set, keg.misdelivery_open stays true so a superseding claim can be filed"
  - method: GET
    path: "/reconciliation-claims/{claim_id}"
    description: "Read one claim with its negotiation round count and offsets."
    roles: [PoolOperator, Brewer, Distributor, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: ReconciliationClaim
    side_effects: []
  - method: GET
    path: "/reconciliation-claims"
    description: "Filtered claim list; reverse-reachability channel for every FK on ReconciliationClaim including the self-referential supersedes_claim_id."
    roles: [PoolOperator, Brewer, Distributor, AssetRecoveryAnalyst]
    code: 200
    input: ["keg_id?", "claimant_distributor_id?", "owning_brewer_id?", "misdelivered_to_brewer_id?", "supersedes_claim_id?", "status?", "limit?", "offset?"]
    output: ReconciliationClaim[]
    side_effects: []

  # ---------------- Return incentives ----------------
  - method: GET
    path: "/return-incentives/{accrual_id}"
    description: "Read one incentive accrual with the dwell band and cooperation multiplier that priced it."
    roles: [PoolOperator, Distributor, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: ReturnIncentiveAccrual
    side_effects: []
  - method: GET
    path: "/return-incentives"
    description: "Filtered accrual list; reverse-reachability channel for ReturnIncentiveAccrual.distributor_id, keg_id and claim_id."
    roles: [PoolOperator, Distributor, AssetRecoveryAnalyst]
    code: 200
    input: ["distributor_id?", "keg_id?", "claim_id?", "accrual_type?", "status?", "limit?", "offset?"]
    output: ReturnIncentiveAccrual[]
    side_effects: []
  - method: POST
    path: "/return-incentives/{accrual_id}/pay"
    description: "Pay out an accrued return incentive."
    roles: [PoolOperator]
    code: 200
    input: [paid_at]
    output: ReturnIncentiveAccrual
    side_effects:
      - "requires status = ACCRUED; status = PAID and paid_at set"
      - "distributor.incentive_accrual_cents is UNCHANGED (PAID rows stay inside the sum), so a later clawback of a PAID row moves the ledger by exactly the same amount as a clawback of an ACCRUED row"

  # ---------------- Theft investigations ----------------
  - method: POST
    path: "/theft-investigations"
    description: "Open a stainless-theft investigation over a set of kegs in one pool."
    roles: [AssetRecoveryAnalyst]
    code: 201
    input: [pool_id, opened_reason, keg_ids, "suspect_distributor_id?"]
    output: TheftInvestigation
    side_effects:
      - "status = OPEN; opened_by_user_id = acting X-User-ID; every named keg must belong to the pool and gets theft_investigation_id set, which removes it from allocation candidacy WITHOUT changing its custody_state"
      - "attached_keg_count, held_keg_count = 0 and stainless_value_at_risk_cents computed per calculation stainless_scrap_value (rounded per keg, then summed); commodity_index_id pinned"
  - method: POST
    path: "/theft-investigations/{investigation_id}/status"
    description: "Drive the investigation: place kegs on evidence hold, resume from hold, or close as recovered or written off."
    roles: [AssetRecoveryAnalyst]
    code: 200
    input: [action, "keg_ids?", "hold_started_at?", "outcome?", "outcome_notes?"]
    output: TheftInvestigation
    side_effects:
      - "EVIDENCE_HOLD: each named keg records pre_hold_custody_state and moves to EVIDENCE_HOLD; status = EVIDENCE_HOLD; hold_started_at, held_keg_count and stainless_value_at_risk_cents recomputed"
      - "RESUME: each held keg's custody_state is restored from pre_hold_custody_state, returning every pool census counter to its pre-hold value (invariant pool_census_conserved); status = OPEN; held_keg_count = 0"
      - "CLOSE with outcome = RECOVERED: attached kegs that are on EVIDENCE_HOLD move to IN_SERVICE and detach, attached kegs that were never held only detach; status = CLOSED_RECOVERED; no accrual is clawed back"
      - "CLOSE with outcome = WRITTEN_OFF: attached kegs that are on EVIDENCE_HOLD move to STOLEN while attached kegs that were never held only detach; status = CLOSED_WRITTEN_OFF; when suspect_distributor_id is set, that distributor's ACCRUED and PAID accruals for the attached kegs flip to CLAWED_BACK and incentive_accrual_cents is restored to its pre-accrual value (invariant incentive_ledger_conserved) while total_returns_count and on_time_return_pct are deliberately NOT restored"
      - "investigation.version += 1; pool census, available_pct, posture and every ACTIVE agreement's float_posture recomputed on every action"
  - method: GET
    path: "/theft-investigations/{investigation_id}"
    description: "Read one investigation with its held/attached counts and stainless exposure."
    roles: [PoolOperator, AssetRecoveryAnalyst]
    code: 200
    input: []
    output: TheftInvestigation
    side_effects: []
  - method: GET
    path: "/theft-investigations"
    description: "Filtered investigation list; reverse-reachability channel for TheftInvestigation.pool_id, suspect_distributor_id and commodity_index_id."
    roles: [PoolOperator, AssetRecoveryAnalyst]
    code: 200
    input: ["pool_id?", "suspect_distributor_id?", "commodity_index_id?", "status?", "limit?", "offset?"]
    output: TheftInvestigation[]
    side_effects: []

  # ---------------- Commodity index ----------------
  - method: POST
    path: "/commodity-index"
    description: "Post a stainless commodity index reading. Index rows are immutable; a correction is posted as a new row with the same effective_date only after the prior one is withdrawn, so effective_date stays unique."
    roles: [PoolOperator]
    code: 201
    input: [effective_date, usd_cents_per_kg, source]
    output: CommodityIndex
    side_effects:
      - "effective_date uniqueness enforced (ERR_DUPLICATE_INDEX_DATE)"
      - "already-pinned LossAssessment and TheftInvestigation valuations are NOT re-priced; only future valuations and keg reads pick the new row up"
  - method: GET
    path: "/commodity-index"
    description: "List posted index readings in effective_date order."
    roles: [PoolOperator, Brewer, Distributor, AssetRecoveryAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: CommodityIndex[]
    side_effects: []

  # ---------------- Test-driving surface (§1.5 priority ladder step 3) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup DEFAULT is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every dwell window, trailing-90-day window, pressure-test interval and claim window is evaluated against this logical clock, so the whole scaffold is run-time independent. Time may be moved forward or backward; moving it does not retroactively rewrite any stored timestamp."
    roles: [PoolOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "the logical clock is repositioned; no entity is mutated and no calculation is re-run until the next business request"

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/blank, or X-User-Role is not one of the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_UNKNOWN_ACTOR
    http: 403
    condition: "X-User-Role is Brewer or Distributor but X-User-ID does not match any Brewer / Distributor row."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed actor targets a resource whose corresponding FK is a different entity id (e.g. a Brewer disputing another brewer's assessment)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID performed the step that must be performed by a different person: releasing a cycle one tested, or resolving an assessment one created."

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, enum value outside its domain, numeric value outside its declared range, unparseable timestamp/date, or a conditionally forbidden field supplied (e.g. distributor_id on a party_type = BREWER scan)."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative."

  # ---- existence ----
  - id: ERR_BREWER_NOT_FOUND
    http: 404
    condition: "brewer_id in the path or body does not resolve."
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "distributor_id / suspect_distributor_id does not resolve."
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "pool_id does not resolve."
  - id: ERR_KEG_NOT_FOUND
    http: 404
    condition: "keg_id in the path, body, or a keg_ids element does not resolve."
  - id: ERR_SCAN_EVENT_NOT_FOUND
    http: 404
    condition: "scan_event_id does not resolve."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id does not resolve."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id does not resolve."
  - id: ERR_SERVICE_CENTER_NOT_FOUND
    http: 404
    condition: "center_id / service_center_id does not resolve."
  - id: ERR_SERVICE_CYCLE_NOT_FOUND
    http: 404
    condition: "cycle_id does not resolve."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id does not resolve."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id / supersedes_claim_id does not resolve."
  - id: ERR_ACCRUAL_NOT_FOUND
    http: 404
    condition: "accrual_id does not resolve."
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "investigation_id / theft_investigation_id does not resolve."

  # ---- optimistic concurrency (§1.2.1) ----
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version on POST /issuance-orders/{order_id}/allocate does not equal the agreement's current version."
  - id: ERR_STALE_KEG_VERSION
    http: 412
    condition: "expected_keg_version on POST /loss-assessments does not equal the keg's current version."
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version on POST /reconciliation-claims/{claim_id}/respond does not equal the claim's current version."

  # ---- state ----
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource's current state in §1.2."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The dimension being moved is already in one of its terminal states."
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The governing FloatAgreement is DRAFT or TERMINATED."
  - id: ERR_POOL_FROZEN
    http: 409
    condition: "The pool's available_pct has fallen below freeze_threshold_pct, so no float may leave it."
  - id: ERR_POOL_RESTRICTED
    http: 409
    condition: "The pool is RESTRICTED and requested_keg_count exceeds restricted_max_kegs_per_order."
  - id: ERR_FLOAT_SUSPENDED
    http: 409
    condition: "The agreement's float_posture is SUSPENDED because the pool is FROZEN or the brewer is on PROBATION / SUSPENDED."
  - id: ERR_BREWER_SUSPENDED
    http: 409
    condition: "The brewer's status is SUSPENDED."
  - id: ERR_DISTRIBUTOR_SUSPENDED
    http: 409
    condition: "The distributor's status is SUSPENDED."
  - id: ERR_SCAN_SEQUENCE_INVALID
    http: 409
    condition: "The requested scan_point is not legal from the keg's current custody_state (e.g. a RETAIL scan on a keg that has not been distributed)."
  - id: ERR_RESPONDER_OUT_OF_TURN
    http: 409
    condition: "The same side of a reconciliation claim tries to respond twice in a row."
  - id: ERR_QUARANTINE_RELEASE_BLOCKED
    http: 409
    condition: "A cycle quarantined for INSPECTION_MAJOR_DEFECT is retested or released; only PRESSURE_TEST_FAIL quarantines may be retested."
  - id: ERR_DUPLICATE_SCAN
    http: 409
    condition: "A ScanEvent with the same (scan_point, scanned_at) already exists on this keg."
  - id: ERR_CUSTODY_INTERVAL_CONFLICT
    http: 409
    condition: "scanned_at falls strictly inside an already-closed custody interval (scanned_at < keg.dwell_started_at); the boundary instant itself is accepted."
  - id: ERR_INTAKE_WINDOW_CONFLICT
    http: 409
    condition: "received_at falls inside an existing closed intake window [received_at, received_at + intake_buffer_hours] of the same service centre, endpoints included."
  - id: ERR_DUPLICATE_BRAND_CODE
    http: 409
    condition: "Brewer.brand_code already exists."
  - id: ERR_DUPLICATE_POOL_CODE
    http: 409
    condition: "KegPool.pool_code already exists."
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 409
    condition: "Keg.asset_tag already exists in any pool."
  - id: ERR_DUPLICATE_INDEX_DATE
    http: 409
    condition: "CommodityIndex.effective_date already exists."
  - id: ERR_AGREEMENT_ALREADY_ACTIVE
    http: 409
    condition: "An ACTIVE FloatAgreement already exists for this (brewer_id, pool_id) pair."
  - id: ERR_ASSESSMENT_ALREADY_OPEN
    http: 409
    condition: "The keg already carries a DISPUTED assessment; a PROPOSED one would be superseded instead."
  - id: ERR_CLAIM_ALREADY_OPEN
    http: 409
    condition: "The keg already carries a claim in SUBMITTED or COUNTERED."
  - id: ERR_CLAIM_ROUND_LIMIT
    http: 409
    condition: "A COUNTER response would exceed MAX_CLAIM_ROUNDS (3)."
  - id: ERR_SERVICE_CAPACITY_EXCEEDED
    http: 409
    condition: "The service centre's open_cycle_count has reached concurrent_cycle_capacity."
  - id: ERR_NO_ELIGIBLE_KEGS
    http: 409
    condition: "The allocation candidate set is empty (no IN_FLOAT, certified, unencumbered keg in the pool)."
  - id: ERR_INSUFFICIENT_FLOAT
    http: 409
    condition: "Fewer candidates than requested and allow_partial is false."
  - id: ERR_AGREEMENT_FLOAT_OUTSTANDING
    http: 409
    condition: "Termination attempted while kegs are still at the brewer or an order is still open."
  - id: ERR_KEG_NOT_ATTACHED
    http: 409
    condition: "A keg named in an evidence-hold action is not attached to that investigation or is in a terminal custody state."
  - id: ERR_ACCRUAL_NOT_PAYABLE
    http: 409
    condition: "Payment attempted on an accrual whose status is not ACCRUED."

  # ---- business_safety / business_referential / business_temporal (422) ----
  - id: ERR_KEG_NOT_FIT_FOR_FILL
    http: 422
    condition: "FILL scan on a keg whose service_state is SERVICE_DUE or SERVICE_FAILED."
  - id: ERR_PRESSURE_TEST_OVERDUE
    http: 422
    condition: "FILL scan on a keg whose last_pressure_test_at is older than PRESSURE_TEST_INTERVAL_DAYS (730) days."
  - id: ERR_CAUSTIC_CYCLE_TOO_SHORT
    http: 422
    condition: "A CLEAN step records caustic_cycle_minutes below MIN_CAUSTIC_CYCLE_MINUTES (12)."
  - id: ERR_PRESSURE_TEST_PSI_TOO_LOW
    http: 422
    condition: "A PRESSURE_TEST step records pressure_test_psi below MIN_PRESSURE_TEST_PSI (30); the test is invalid rather than failed."
  - id: ERR_BRAND_MISMATCH
    http: 422
    condition: "A FILL scan's brand_code_scanned differs from the filling brewer's brand_code."
  - id: ERR_SCAN_PARTY_MISMATCH
    http: 422
    condition: "The supplied party identifier does not match party_type, or the party type is not the one the scan point requires."
  - id: ERR_BRAND_OWNER_UNKNOWN
    http: 422
    condition: "brand_code_scanned on a DISTRIBUTION, RETAIL or RETURN scan matches no Brewer.brand_code, so misdelivery cannot be attributed."
  - id: ERR_NO_MISDELIVERY_EVIDENCE
    http: 422
    condition: "No ScanEvent with misdelivery_detected = true and the given evidence_scanned_at exists on the keg."
  - id: ERR_CLAIM_SUPERSEDE_MISMATCH
    http: 422
    condition: "supersedes_claim_id names a claim on a different keg or one whose status is not REJECTED / WITHDRAWN."
  - id: ERR_NO_CHARGEABLE_PARTY
    http: 422
    condition: "The keg has no filling_brewer_id and no current_brewer_id, and the cause is not STOLEN_SUSPECTED."
  - id: ERR_NO_COMMODITY_INDEX
    http: 422
    condition: "No CommodityIndex row has an effective_date at or before the valuation date."
  - id: ERR_SCAN_TIMESTAMP_FUTURE
    http: 422
    condition: "A supplied instant or date lies in the future relative to the logical clock."
  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 422
    condition: "More than CLAIM_WINDOW_DAYS (30) days have elapsed since evidence_scanned_at."
  - id: ERR_FLOAT_SIZE_EXCEEDED
    http: 422
    condition: "requested_keg_count + kegs_at_brewer_count would exceed the agreement's float_size_kegs."
  - id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http: 422
    condition: "A SETTLE action's amount_cents differs from net_chargeback_cents."

  # ---- business_fiscal ----
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "Projected exposure (chargeback balance plus billed or requested fills) would exceed the brewer's credit_limit_cents."

roles:
  - name: PoolOperator
    description: "MicroStar's pool operations desk: owns the fleet, the pools, the agreements, the issuance pipeline, the logical clock and the settlement side of chargebacks."
    identity: "opaque"
    exclusive_operations:
      - "POST /brewers, POST /brewers/{brewer_id}/status"
      - "POST /distributors, POST /distributors/{distributor_id}/cooperation-agreement"
      - "POST /pools, POST /pools/{pool_id}/kegs, POST /pools/{pool_id}/replenishment-sweep"
      - "POST /float-agreements, POST /float-agreements/{agreement_id}/activate, POST /float-agreements/{agreement_id}/terminate"
      - "POST /issuance-orders, POST /issuance-orders/{order_id}/allocate, POST /issuance-orders/{order_id}/dispatch, POST /issuance-orders/{order_id}/cancel"
      - "POST /service-centers"
      - "POST /return-incentives/{accrual_id}/pay"
      - "POST /commodity-index"
      - "POST /_clock/set_current_utc"
      - "POST /loss-assessments/{assessment_id}/chargeback-resolution with action = SETTLE"
    shared_operations:
      - "POST /kegs/{keg_id}/scan (an operator may record any party's scan on the fleet's behalf)"
      - "POST /service-cycles, POST /service-cycles/{cycle_id}/release"
      - "every GET except the accrual detail reads reserved to the earning distributor"
  - name: Brewer
    description: "Lessee of pool kegs: fills them, disputes loss assessments, and answers cross-brand misdelivery claims."
    identity: "entity_backed:Brewer"
    exclusive_operations:
      - "POST /loss-assessments/{assessment_id}/dispute"
      - "POST /reconciliation-claims/{claim_id}/respond acting as the misdelivered-to brewer"
    shared_operations:
      - "POST /kegs/{keg_id}/scan with scan_point = FILL (shared with PoolOperator)"
      - "GET /brewers/{brewer_id}, GET /brewers/{brewer_id}/loss-rate, GET /float-agreements, GET /issuance-orders, GET /loss-assessments, GET /reconciliation-claims, GET /kegs, GET /kegs/{keg_id}/dwell, GET /scan-events"
    note: "X-User-ID is a Brewer.id. Ownership is checked against assessment.brewer_id, claim.misdelivered_to_brewer_id and the scan's brewer_id."
  - name: Distributor
    description: "Wholesaler that takes filled kegs to retail, returns empties for incentives, and opens cross-brand misdelivery claims."
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /reconciliation-claims"
      - "POST /reconciliation-claims/{claim_id}/respond acting as the claimant distributor"
    shared_operations:
      - "POST /kegs/{keg_id}/scan with scan_point IN {DISTRIBUTION, RETAIL, RETURN} (shared with PoolOperator)"
      - "GET /distributors/{distributor_id}, GET /return-incentives, GET /return-incentives/{accrual_id}, GET /kegs, GET /kegs/{keg_id}/dwell, GET /scan-events, GET /reconciliation-claims"
    note: "X-User-ID is a Distributor.id. Ownership is checked against claim.claimant_distributor_id, accrual.distributor_id and the scan's distributor_id."
  - name: ServiceTechnician
    description: "Wash-line and pressure-test crew. Records cleaning, inspection and pressure-test steps and may release kegs someone else tested."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-cycles/{cycle_id}/record-step"
    shared_operations:
      - "POST /service-cycles, POST /service-cycles/{cycle_id}/release (shared with PoolOperator)"
      - "GET /service-cycles, GET /service-cycles/{cycle_id}, GET /service-centers/{center_id}, GET /kegs, GET /pools/{pool_id}/kegs, GET /scan-events"
    note: "X-User-ID is an operator identifier stored on cycle.pressure_test_performed_by_user_id and cycle.released_by_user_id. Segregation rule 1: the releaser's X-User-ID MUST differ from the tester's."
  - name: AssetRecoveryAnalyst
    description: "Loss, theft and recovery desk. Values lost kegs, resolves assessments, reverses chargebacks and runs theft investigations."
    identity: "opaque"
    exclusive_operations:
      - "POST /loss-assessments"
      - "POST /loss-assessments/{assessment_id}/resolve"
      - "POST /theft-investigations, POST /theft-investigations/{investigation_id}/status"
      - "POST /loss-assessments/{assessment_id}/chargeback-resolution with action = REVERSE"
    shared_operations:
      - "GET /loss-assessments, GET /loss-assessments/{assessment_id}, GET /theft-investigations, GET /theft-investigations/{investigation_id}, GET /kegs, GET /kegs/{keg_id}/dwell, GET /scan-events, GET /brewers/{brewer_id}/loss-rate, GET /return-incentives, GET /service-cycles, GET /pools/{pool_id}/kegs, GET /float-agreements, GET /issuance-orders, GET /reconciliation-claims"
    note: "X-User-ID is an operator identifier stored on assessment.created_by_user_id, assessment.resolved_by_user_id and investigation.opened_by_user_id. Segregation rule 2: the resolver's X-User-ID MUST differ from the creator's. The two money verbs are split across roles as well: only PoolOperator may SETTLE and only AssetRecoveryAnalyst may REVERSE, so no single role can both raise and erase a chargeback."
