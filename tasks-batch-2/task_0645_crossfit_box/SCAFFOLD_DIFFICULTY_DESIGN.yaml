  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coach_double_booked_buffer_inclusive_overlap
        grounds:
          - validations[priority=15]
          - entities.ClassSession.fields.starts_at
          - entities.ClassSession.fields.duration_minutes
          - errors[ERR_COACH_DOUBLE_BOOKED]
        distinguishing_aspect: "On the Coach/ClassSession resource: the busy interval is [starts_at, starts_at + duration + 15min) (turnaround-buffer-inclusive). A second session starting only 10 minutes after the first ends collides via the buffer, so ERR_COACH_DOUBLE_BOOKED — interval geometry includes a trailing buffer."
        test_recipe:
          setup:
            - "Coach leads a SCHEDULED session 2026-06-10T18:00Z (60 min, busy until 19:15 with 15-min buffer)."
            - "A new session for the same coach starts 2026-06-10T19:10Z (inside the buffer)."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach 8a", email: "c8a@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-8a", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 3 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T19:10:00Z", duration_minutes: 60, capacity: 3 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_COACH_DOUBLE_BOOKED"
            - "HTTP status == 409"

      - name: member_session_time_conflict_no_buffer_disjoint
        grounds:
          - validations[priority=14]
          - state_machines.Reservation.RESERVED_to_WAITLISTED
          - errors[ERR_SESSION_TIME_CONFLICT]
        distinguishing_aspect: "On the Member/Reservation resource with different interval semantics (bare [starts_at, starts_at+duration) window, NO buffer): a member's second reservation overlapping their first by 30 minutes is rejected ERR_SESSION_TIME_CONFLICT, while a back-to-back session touching at the exact end time would be allowed — distinct adjacency treatment from the buffered coach rule."
        test_recipe:
          setup:
            - "Member holds a RESERVED reservation on session A 2026-06-10T18:00Z (60 min, ends 19:00)."
            - "A second session B starts 2026-06-10T18:30Z (60 min) overlapping A by 30 minutes."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach 8b", email: "c8b@x.com", certified: true }
              as: BoxManager
              captures: { coach1_id: $.data.id }
            - call: "POST /box/coaches"
              payload: { full_name: "Coach 8b2", email: "c8b2@x.com", certified: true }
              as: BoxManager
              captures: { coach2_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-8b", track_type: "REGULAR", head_coach_id: "${coach1_id}" }
              as: BoxManager
              captures: { track1_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-8b2", track_type: "REGULAR", head_coach_id: "${coach2_id}" }
              as: BoxManager
              captures: { track2_id: $.data.id }
            - call: "POST /box/membership-plans"
              payload: { name: "U-8b", plan_type: "UNLIMITED", monthly_fee_cents: 10000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track1_id}", coach_id: "${coach1_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 3 }
              as: Coach
              as_user_id: "${coach1_id}"
              captures: { sa_id: $.data.id, sa_v: $.data.version }
            - call: "POST /box/sessions"
              payload: { track_id: "${track2_id}", coach_id: "${coach2_id}", starts_at: "2026-06-10T18:30:00Z", duration_minutes: 60, capacity: 3 }
              as: Coach
              as_user_id: "${coach2_id}"
              captures: { sb_id: $.data.id, sb_v: $.data.version }
            - call: "POST /box/members/register"
              payload: { email: "8bm@x.com", full_name: "8BM", home_box_member: true }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${m_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /box/memberships/${ms_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/reservations"
              payload: { session_id: "${sa_id}", member_id: "${m_id}", membership_id: "${ms_id}", reservation_kind: "MEMBERSHIP", expected_session_version: "${sa_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rva_id: $.data.id }
          trigger:
            - call: "POST /box/reservations"
              payload: { session_id: "${sb_id}", member_id: "${m_id}", membership_id: "${ms_id}", reservation_kind: "MEMBERSHIP", expected_session_version: "${sb_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_SESSION_TIME_CONFLICT"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_count_invariant_reserve_then_timely_cancel
        grounds:
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.ClassSession.fields.seats_reserved
          - calculations.refund_on_cancel
        distinguishing_aspect: "Conserved quantity = seat occupancy: ClassSession.seats_reserved == count of RESERVED reservations on the session MUST hold. Reserving (seats_reserved 0->1) then timely-cancelling (1->0) leaves seats_reserved == 0, equal to its pre-action value with zero drift."
        test_recipe:
          setup:
            - "Capacity-2 foundations-free session at 2026-06-10T18:00Z; clock at 2026-06-05 (well before cut-off)."
            - "Member reserves seat (seats_reserved 0->1) then cancels timely (>=12h before)."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach 9a", email: "c9a@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-9a", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/membership-plans"
              payload: { name: "U-9a", plan_type: "UNLIMITED", monthly_fee_cents: 10000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 2 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /box/members/register"
              payload: { email: "9am@x.com", full_name: "9AM", home_box_member: true }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${m_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /box/memberships/${ms_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/reservations"
              payload: { session_id: "${sess_id}", member_id: "${m_id}", membership_id: "${ms_id}", reservation_kind: "MEMBERSHIP", expected_session_version: "${sess_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /box/reservations/${resv_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Reservation.${resv_id}.status == CANCELLED"
            - "ClassSession.${sess_id}.seats_reserved == 0"
            - "ClassSession.${sess_id}.waitlist_count == 0"

      - name: punch_balance_invariant_reserve_then_timely_cancel
        grounds:
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.Membership.fields.punches_remaining
          - entities.Reservation.fields.punch_consumed
          - calculations.refund_on_cancel
        distinguishing_aspect: "A different conserved quantity = punch credits: membership.punches_remaining + (1 if any RESERVED reservation has punch_consumed) MUST equal the granted punch_count (5). Reserving decrements 5->4 (punch_consumed=true); timely cancel restores 4->5, leaving the conserved total at 5 with no drift."
        test_recipe:
          setup:
            - "PUNCH plan granting 5 punches; member with ACTIVE PUNCH membership (punches_remaining=5)."
            - "Foundations-free session at 2026-06-10T18:00Z; clock at 2026-06-05 (timely)."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach 9b", email: "c9b@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-9b", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/membership-plans"
              payload: { name: "Punch5", plan_type: "PUNCH", monthly_fee_cents: 0, punch_count: 5, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
