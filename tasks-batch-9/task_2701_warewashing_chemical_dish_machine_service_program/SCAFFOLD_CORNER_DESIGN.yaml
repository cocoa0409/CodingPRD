          assert:
            - "${err} == ERR_ADJUSTED_DOSE_REQUIRED with HTTP 422 - the verdict was ADJUSTED, so the field was mandatory"
            - "${verdict_1} == ADJUSTED with ${drift_1} == 12.00 and ${applied_1} == false - nothing reaches the dispenser before verification"
            - "${dose_now} == 8.00 - the unverified adjustment is not live"
