      - name: corner_named_expired_credit_rejected_at_charge
        claim_type: conditional_validation
        grounds: ["validations[priority=43]", "errors[ERR_CREDIT_EXPIRED]", entities.Credit.fields.expires_at]
        distinguishing_aspect: "When the caller NAMES credits via credit_ids, an expired credit is a hard error (ERR_CREDIT_EXPIRED, 409) instead of being silently skipped as it would be on the server-selected path."
        test_recipe:
          setup:
            - "One verified account holding a 5000-cent GOODWILL credit issued on 2026-06-01, so it expires on 2027-06-01."
            - "One ALLOCATED cycle priced at 2999; the logical clock is then moved to 2027-06-02T00:00:00Z without running the daily batch, so the credit is still AVAILABLE but past its expiry instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
