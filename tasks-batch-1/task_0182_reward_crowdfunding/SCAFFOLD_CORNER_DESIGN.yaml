        claim_type: Violation → Error
        grounds:
          - errors[ERR_VALIDATION_PAGINATION]
          - response_envelope
        distinguishing_aspect: "GET /campaigns?limit=500 (above max 100) -> ERR_VALIDATION_PAGINATION (422)."
        test_recipe:
          setup:
