    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []

  # ---- vehicles ----
  - method: POST
    path: "/vehicles"
    description: "Create ContractVehicle (PENDING)"
    roles: [ContractsManager]
    code: 201
    input: [agreement_id, vehicle_kind, buyer_tiers, ceiling_cents, taa_required, effective_from, effective_to]
    output: ContractVehicle
    side_effects: []
  - method: GET
    path: "/vehicles"
    description: "List vehicles"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?", "agreement_id?", "status?"]
    output: ContractVehicle[]
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch one vehicle (lazily flips EXPIRED when past effective_to)"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: []
    output: ContractVehicle
    side_effects: ["lazy EXPIRED check"]
  - method: PATCH
    path: "/vehicles/{id}"
    description: "Update ceiling_cents / effective window (OCC-guarded)"
