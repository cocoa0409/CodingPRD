# =============================================================================
# PRD Benchmark Seed Tables — task_3056
# Career Agency Field Force Recruiting & Advisor Validation
# (Northwestern Mutual style: campus + career-changer recruiting pipelines,
#  selection assessments, financial-representative contracts with training
#  allowances and validation production requirements, managing-director and
#  district-office overrides on team production, joint work and split-case
#  credit allocation, product licensing and appointment sequencing across
#  insurance and securities registrations, persistency measurement affecting
#  compensation and renewal commissions, chargeback of advanced commissions
#  on lapsed policies, advisor termination with orphan policyholder
#  reassignment.)
# =============================================================================

scenario: |
  Career Agency Field Force Recruiting & Advisor Validation (Northwestern Mutual): campus and career-changer recruiting pipelines with selection assessments, financial representative contracts with training allowances and validation production requirements, managing director and district office overrides on team production, joint work and split-case credit allocation between representatives, product licensing and appointment sequencing across insurance and securities registrations, persistency measurement affecting compensation and renewal commissions, chargeback of advanced commissions on lapsed policies, advisor termination with orphan policyholder reassignment

domain_name: career-agency-field-force
api_prefix: /agency

complexity_profile:
  primary_archetype: Posture-driven gating
  secondary_archetype: Workflow orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  # self-referential Advisor.sponsoring_advisor_id chain, self-referential
  # RecruitingCandidate.prior_candidate_id re-engagement lineage, self-
  # referential SecuritiesRegistration.prerequisite_registration_id DAG,
  # many-to-many JointWorkCase between two Advisors, plus cross-aggregate
  # references (CommissionCredit -> Advisor; OrphanPolicyAssignment -> Policy)
  state_machine_shape: posture_driven
  # Advisor.validation_posture is a derived aggregate that gates commission
  # payout, renewal accrual, joint-work participation and orphan reception.
  # Parallel dimensions live on the same Advisor row (contract_status x
  # insurance_license_status x securities_registration_status x
  # appointment_status); RecruitingCandidate and ValidationPeriod carry cycles.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: hierarchical_override
  # FinancialRep < DistrictDirector < ManagingDirector, each able to do
  # everything below plus exclusive override/termination powers.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: DistrictOffice
    parent: null
    common_fields: true
    fields:
      - { name: office_code, type: string, source: input, description: "Home-office code for the district office (OSJ unit)" }
      - { name: name, type: string, source: input, description: "Display name of the district office" }
      - { name: region_code, type: string, source: input, description: "Two-letter region grouping used for reporting rollups" }
      - { name: state_code, type: string, source: input, description: "State in which the office is domiciled" }
      - { name: override_rate_pct, type: number, source: input, default: 0.05, description: "District-office override rate applied to the gross commission production of every advisor whose district_office_id is this office" }
      - { name: override_cap_cents, type: integer, source: input, default: 300000, description: "Per-measurement cap, in cents, applied to each advisor's override income whose district_office_id is this office" }
      - { name: override_paid_cents, type: integer, source: computed, default: 0, description: "Sum of override_income_cents across every advisor whose district_office_id is this office; recomputed whenever any member advisor's override income changes" }
      - { name: status, type: enum, source: system, description: "Lifecycle of the office", constraints: "ACTIVE | SUSPENDED | CLOSED" }

  # ---------------------------------------------------------------------------
  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the financial representative or director" }
      - { name: email, type: string, source: input, description: "Agency email; unique per advisor" }
      - { name: district_office_id, type: string, source: input, description: "FK -> DistrictOffice.id; the office this advisor is assigned to" }
      - { name: sponsoring_advisor_id, type: string, source: input, default: null, description: "FK -> Advisor.id; the sponsoring advisor whose downline this advisor joins (null for home-office hires)" }
      - { name: rank, type: enum, source: input, description: "Field rank driving override entitlement", constraints: "REP | DISTRICT_DIRECTOR | MANAGING_DIRECTOR" }
      - { name: contract_status, type: enum, source: system, description: "Contract lifecycle", constraints: "NOT_CONTRACTED | ACTIVE_TRAINING | VALIDATING | AT_RISK | VALIDATED | TERMINATED" }
      - { name: validation_posture, type: enum, source: computed, description: "Derived gating posture recomputed on every child mutation; gates commission payout, renewal accrual, joint-work participation and orphan reception", constraints: "VALIDATING | VALIDATED | AT_RISK | FAILED_POSTURE" }
      - { name: insurance_license_status, type: enum, source: computed, description: "Aggregate insurance licensing dimension derived from the advisor's ProductLicense rows", constraints: "NONE | PENDING | ACTIVE | LAPSED" }
      - { name: licensing_locked, type: boolean, source: system, default: false, description: "Set true by POST /advisors/{id}/licensing/lock-remediation; while true, ACTIVE->AT_RISK demotions are skipped so that cascades may be driven against a VALIDATED advisor without an unrelated licence demotion firing" }
      - { name: securities_registration_status, type: enum, source: computed, description: "Aggregate securities registration dimension derived from the advisor's SecuritiesRegistration rows", constraints: "NONE | PENDING | ACTIVE | SUSPENDED" }
      - { name: appointment_status, type: enum, source: computed, description: "Aggregate carrier appointment dimension derived from the advisor's CarrierAppointment rows", constraints: "NONE | REQUESTED | APPROVED | TERMINATED" }
      - { name: team_production_cents, type: integer, source: computed, default: 0, description: "Sum of gross_commission_cents over the PRIMARY / SPLIT_LEAD / SPLIT_SUPPORT CommissionCredit rows (status != VOIDED) of this advisor and of every advisor whose sponsoring_advisor_id chain reaches this advisor" }
      - { name: override_income_cents, type: integer, source: computed, default: 0, description: "Override income accrued to this advisor, capped per §1.3 override_allocation" }
      - { name: chargeback_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding chargeback balance = sum of assessed chargebacks minus sum of recovered amounts across this advisor's CommissionCredit rows" }
      - { name: renewal_commission_cents, type: integer, source: computed, default: 0, description: "Renewal commission accrued from finalized PersistencyRecord rows" }
      - { name: orphan_pool_access, type: boolean, source: computed, default: false, description: "Whether this advisor may receive reassigned orphan policyholders" }
      - { name: terminated_at, type: datetime, source: system, default: null, description: "Timestamp of contract termination; null while the contract is live" }

  # ---------------------------------------------------------------------------
  - name: RecruitingCandidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Name of the prospective recruit" }
      - { name: source_channel, type: enum, source: input, description: "Origin of the lead", constraints: "CAMPUS | CAREER_CHANGER | REFERRAL | INTERNAL" }
      - { name: campus_name, type: string, source: input, default: null, description: "University name; required when source_channel is CAMPUS" }
      - { name: district_office_id, type: string, source: input, description: "FK -> DistrictOffice.id; the recruiting office that owns the pipeline entry" }
      - { name: prior_candidate_id, type: string, source: input, default: null, description: "FK -> RecruitingCandidate.id; the earlier pipeline entry this one re-engages" }
      - { name: stage, type: enum, source: system, description: "Pipeline stage; see §1.2", constraints: "SOURCED | SCREENED | ASSESSMENT_PENDING | ASSESSED | INTERVIEW_READY | OFFER_EXTENDED | OFFER_ACCEPTED | OFFER_DECLINED | REENGAGED | REJECTED | CONTRACTED" }
      - { name: reengagement_count, type: integer, source: computed, default: 0, description: "Number of times this candidate has been re-engaged back into the pipeline" }
      - { name: entered_stage_at, type: datetime, source: system, description: "Timestamp of the most recent stage entry; refreshed on every stage change" }
      - { name: notes, type: string, source: input, default: null, description: "Free-text recruiting notes" }

  # ---------------------------------------------------------------------------
  - name: SelectionAssessment
    parent: RecruitingCandidate
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> RecruitingCandidate.id; the candidate being assessed" }
      - { name: assessment_version, type: enum, source: input, description: "Instrument version selecting the competency weight table", constraints: "V1 | V2" }
      - { name: scheduled_date, type: datetime, source: input, description: "Date the assessment is administered" }
      - { name: scored_date, type: datetime, source: system, default: null, description: "Date the raw score was posted" }
      - { name: raw_score, type: integer, source: input, default: null, description: "Unweighted raw score, 0..100" }
      - { name: competency_scores, type: object, source: input, default: null, description: "Map of competency key to 0..10 sub-score: MARKET_KNOWLEDGE, RELATIONSHIP, RESILIENCE, ETHICS" }
      - { name: weighted_score, type: number, source: computed, description: "Weighted score per §1.3 selection_assessment_weighted_score" }
      - { name: outcome, type: computed, description: "PASS | CONDITIONAL | FAIL derived from weighted_score against the pinned cut scores", constraints: "PASS | CONDITIONAL | FAIL" }
      - { name: locked_weights, type: object, source: computed, description: "The competency weight table actually applied, frozen at scoring time" }
      - { name: status, type: enum, source: system, description: "Assessment lifecycle", constraints: "SCHEDULED | SCORED | SUPERSEDED | INVALIDATED" }

  # ---------------------------------------------------------------------------
  - name: EmploymentContract
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_id, type: string, source: system, description: "FK -> Advisor.id; the contracted representative" }
      - { name: candidate_id, type: string, source: input, description: "FK -> RecruitingCandidate.id; the pipeline entry that produced the contract" }
      - { name: contract_type, type: enum, source: input, description: "Engagement type", constraints: "FULL_TIME | PART_TIME | INTERN" }
      - { name: start_date, type: datetime, source: input, description: "Contract effective date" }
      - { name: end_date, type: datetime, source: system, default: null, description: "Contract end date once terminated" }
      - { name: training_allowance_total_cents, type: integer, source: input, description: "Total training allowance budget for the contract" }
      - { name: training_allowance_paid_cents, type: integer, source: computed, default: 0, description: "Allowance already drawn, capped at training_allowance_total_cents" }
      - { name: validation_requirement_cents, type: integer, source: input, description: "Production required to validate the contract" }
      - { name: training_allowance_mode, type: enum, source: input, description: "Allowance draw mode selecting the §1.3 variant", constraints: "FLAT_MONTHLY | PRODUCTION_DRAW" }
      - { name: contract_status, type: enum, source: system, description: "Contract lifecycle; mirrors the owning advisor's contract_status", constraints: "DRAFT | ACTIVE_TRAINING | VALIDATING | AT_RISK | VALIDATED | TERMINATED" }

  # ---------------------------------------------------------------------------
  - name: ValidationPeriod
    parent: EmploymentContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> EmploymentContract.id; the contract being validated" }
      - { name: advisor_id, type: string, source: system, description: "FK -> Advisor.id; denormalized advisor for production rollups" }
      - { name: period_number, type: integer, source: input, description: "Sequential validation window number starting at 1" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive start of the measurement window" }
      - { name: end_date, type: datetime, source: input, description: "Exclusive end of the measurement window (half-open [start_date, end_date))" }
      - { name: required_production_cents, type: integer, source: input, description: "Production required to pass this window" }
      - { name: achieved_production_cents, type: integer, source: computed, default: 0, description: "Production credited inside the window per §1.3 validation_production_attainment" }
      - { name: extension_count, type: integer, source: computed, default: 0, description: "Number of extensions already granted; at most MAX_EXTENSIONS" }
      - { name: extended_end_date, type: datetime, source: system, default: null, description: "The widened end_date granted by the most recent extension" }
      - { name: evaluated_at, type: datetime, source: system, default: null, description: "Timestamp of the most recent evaluation" }
      - { name: status, type: enum, source: system, description: "Window lifecycle", constraints: "OPEN | PASSED | FAILED | EXTENDED" }

  # ---------------------------------------------------------------------------
  - name: ProductLicense
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_id, type: string, source: system, description: "FK -> Advisor.id; the licensed representative" }
      - { name: product_line, type: enum, source: input, description: "Insurance product line covered", constraints: "LIFE | ANNUITY | DISABILITY | LONG_TERM_CARE" }
      - { name: license_number, type: string, source: input, description: "State insurance license number" }
      - { name: effective_date, type: datetime, source: input, description: "License effective date" }
      - { name: expires_at, type: datetime, source: input, description: "License expiry instant" }
      - { name: appointment_required, type: boolean, source: input, default: true, description: "Whether a carrier appointment is required before the license may be used to write business" }
      - { name: status, type: enum, source: system, description: "License lifecycle", constraints: "PENDING | ACTIVE | LAPSED | REVOKED" }

  # ---------------------------------------------------------------------------
  - name: SecuritiesRegistration
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_id, type: string, source: system, description: "FK -> Advisor.id; the registered representative" }
      - { name: registration_type, type: enum, source: input, description: "FINRA registration series", constraints: "SERIES_6 | SERIES_7 | SERIES_63 | SERIES_65 | SERIES_66" }
      - { name: crd_number, type: string, source: input, description: "Central Registration Depository number" }
      - { name: effective_date, type: datetime, source: input, description: "Registration effective date" }
      - { name: expires_at, type: datetime, source: input, description: "Registration expiry instant" }
      - { name: prerequisite_registration_id, type: string, source: input, default: null, description: "FK -> SecuritiesRegistration.id; the registration that must reach ACTIVE first (sequencing DAG)" }
      - { name: status, type: enum, source: system, description: "Registration lifecycle", constraints: "PENDING | ACTIVE | SUSPENDED | TERMINATED" }

  # ---------------------------------------------------------------------------
  - name: CarrierAppointment
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_id, type: string, source: system, description: "FK -> Advisor.id; the appointed representative" }
      - { name: requires_license_id, type: string, source: input, description: "FK -> ProductLicense.id; the license that must be ACTIVE for this appointment" }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier granting the appointment" }
      - { name: state_code, type: string, source: input, description: "State in which the appointment is granted" }
      - { name: requested_date, type: datetime, source: input, description: "Date the appointment was requested" }
      - { name: appointment_date, type: datetime, source: system, default: null, description: "Date the carrier approved the appointment" }
      - { name: appointment_status, type: enum, source: system, description: "Appointment lifecycle", constraints: "REQUESTED | APPROVED | REJECTED | TERMINATED" }

  # ---------------------------------------------------------------------------
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policy_number, type: string, source: input, description: "Carrier policy number; unique" }
      - { name: writing_advisor_id, type: string, source: input, description: "FK -> Advisor.id; the advisor of record" }
      - { name: carrier_name, type: string, source: input, description: "Issuing carrier" }
      - { name: product_line, type: enum, source: input, description: "Product line written", constraints: "LIFE | ANNUITY | DISABILITY | LONG_TERM_CARE" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Annualized premium in cents" }
      - { name: issue_date, type: datetime, source: input, description: "Policy issue date" }
      - { name: lapse_date, type: datetime, source: system, default: null, description: "Date the policy lapsed; null while in force" }
      - { name: reinstatement_date, type: datetime, source: system, default: null, description: "Date the policy was reinstated after a lapse" }
      - { name: is_advanced_commission, type: boolean, source: input, default: true, description: "Whether first-year commission was advanced at issue (chargeback eligible)" }
      - { name: months_inforce, type: integer, source: computed, default: 0, description: "Completed months between issue_date and lapse_date (0 while active)" }
      - { name: orphaned, type: boolean, source: computed, default: false, description: "Whether the advisor of record has terminated, leaving the policyholder orphaned" }
      - { name: status, type: enum, source: system, description: "Policy lifecycle", constraints: "ISSUED | ACTIVE | LAPSED | SURRENDERED | TERMINATED" }

  # ---------------------------------------------------------------------------
  - name: JointWorkCase
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy written jointly" }
      - { name: lead_advisor_id, type: string, source: input, description: "FK -> Advisor.id; the advisor leading the case" }
      - { name: support_advisor_id, type: string, source: input, description: "FK -> Advisor.id; the advisor supporting the case" }
      - { name: split_pct_lead, type: number, source: input, description: "Fraction of primary credit allocated to the lead advisor, 0 < split_pct_lead <= 1" }
      - { name: status, type: enum, source: system, description: "Case lifecycle", constraints: "OPEN | SUBMITTED | CLOSED | VOIDED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Timestamp the case credit was posted" }

  # ---------------------------------------------------------------------------
  - name: CommissionCredit
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; the policy that generated the credit" }
      - { name: advisor_id, type: string, source: system, description: "FK -> Advisor.id; the advisor receiving the credit" }
      - { name: credit_type, type: enum, source: system, description: "Credit channel", constraints: "PRIMARY | SPLIT_LEAD | SPLIT_SUPPORT | OVERRIDE_DO | OVERRIDE_MD | TRAINING_ALLOWANCE | RENEWAL" }
      - { name: credit_pct, type: number, source: computed, description: "Fraction of the case gross commission credited to this advisor" }
      - { name: gross_commission_cents, type: integer, source: computed, default: 0, description: "Gross commission before chargeback, per §1.3" }
      - { name: net_commission_cents, type: integer, source: computed, default: 0, description: "Net payable commission after chargeback netting" }
      - { name: advanced_paid_cents, type: integer, source: system, default: 0, description: "Amount advanced to the advisor at issue" }
      - { name: case_gross_commission_cents, type: integer, source: computed, default: 0, description: "The policy's gross first-year commission, identical on every credit row of the policy; the basis for the conservation invariant sum over the policy's non-VOIDED PRIMARY/SPLIT credits == this value" }
      - { name: chargeback_assessed_cents, type: integer, source: computed, default: 0, description: "Chargeback assessed against this credit" }
      - { name: recovered_cents, type: integer, source: system, default: 0, description: "Amount of the assessed chargeback already recovered" }
      - { name: chargeback_reason, type: enum, source: input, default: null, description: "Reason code recorded when a chargeback is assessed", constraints: "LAPSE_WITHIN_12MO | SURRENDER | REPLACEMENT | TERMINATION" }
      - { name: status, type: enum, source: system, description: "Credit lifecycle", constraints: "ACCRUED | PAID | CHARGED_BACK | RECOVERED | VOIDED" }

  # ---------------------------------------------------------------------------
  - name: PersistencyRecord
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_id, type: string, source: system, description: "FK -> Advisor.id; the measured advisor" }
      - { name: measurement_period, type: string, source: input, description: "Period label, e.g. 2026-H1" }
      - { name: measurement_start, type: datetime, source: input, description: "Inclusive start of the measurement window (closed interval)" }
      - { name: measurement_end, type: datetime, source: input, description: "Inclusive end of the measurement window (closed interval)" }
      - { name: policies_issued, type: integer, source: input, description: "Policies issued in the window" }
      - { name: policies_persisted, type: integer, source: input, description: "Policies still in force at window close" }
      - { name: persistency_pct, type: number, source: computed, description: "Persistency measured per §1.3 persistency_rate_and_renewal" }
      - { name: persistency_tier, type: enum, source: computed, description: "Tier driven by persistency_pct breakpoints", constraints: "TIER_1 | TIER_2 | TIER_3 | INELIGIBLE" }
      - { name: renewal_rate_pct, type: number, source: computed, description: "Renewal commission rate selected by the tier" }
      - { name: renewal_commission_cents, type: integer, source: computed, default: 0, description: "Renewal commission accrued at finalization" }
      - { name: status, type: enum, source: system, description: "Record lifecycle", constraints: "PROVISIONAL | FINALIZED | DISPUTED" }

  # ---------------------------------------------------------------------------
  - name: OrphanPolicyAssignment
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; the orphaned policy being reassigned" }
      - { name: from_advisor_id, type: string, source: input, description: "FK -> Advisor.id; the terminated advisor of record" }
      - { name: to_advisor_id, type: string, source: system, default: null, description: "FK -> Advisor.id; the receiving advisor once assigned" }
      - { name: assignment_method, type: enum, source: input, default: ROUND_ROBIN, description: "Selector policy used to pick the receiving advisor", constraints: "ROUND_ROBIN | SENIORITY | MANUAL" }
      - { name: assigned_at, type: datetime, source: system, default: null, description: "Timestamp the assignment completed" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", constraints: "PENDING | ASSIGNED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Populated when status is REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: DistrictOffice
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /district-offices/{id}/suspend"
        actor: ManagingDirector
        preconditions: ["district_office.status == ACTIVE"]
        side_effects:
          - "district_office.status = SUSPENDED"
          - "no advisor state changes; advisors keep their own contract_status"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /district-offices/{id}/reactivate"
        actor: ManagingDirector
        preconditions: ["district_office.status == SUSPENDED"]
        side_effects: ["district_office.status = ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /district-offices/{id}/close"
        actor: ManagingDirector
        preconditions: ["district_office.status == ACTIVE", "no advisor with contract_status in {ACTIVE_TRAINING, VALIDATING, AT_RISK} has district_office_id == this office"]
        side_effects: ["district_office.status = CLOSED"]
        note: "Closing an office with live advisors is refused with ERR_OFFICE_HAS_LIVE_ADVISORS; the office never auto-closes."

  # ---------------------------------------------------------------------------
  - entity: RecruitingCandidate
    initial_state: SOURCED
    terminal_states: [CONTRACTED, REJECTED, OFFER_DECLINED]
    transitions:
      - from: SOURCED
        to: SCREENED
        trigger: "POST /recruiting-candidates/{id}/screen"
        actor: RecruitingOfficer
        preconditions: ["candidate.stage == SOURCED", "if candidate.source_channel == CAMPUS then candidate.campus_name is not null"]
        side_effects:
          - "candidate.stage = SCREENED"
          - "candidate.entered_stage_at = clock"
        note: "CAMPUS candidates without campus_name are refused with ERR_CAMPUS_NAME_REQUIRED before the transition."
      - from: REENGAGED
        to: SCREENED
        trigger: "POST /recruiting-candidates/{id}/screen"
        actor: RecruitingOfficer
        preconditions: ["candidate.stage == REENGAGED"]
        side_effects:
          - "candidate.stage = SCREENED"
          - "candidate.entered_stage_at = clock"
      - from: SCREENED
        to: ASSESSMENT_PENDING
        trigger: "POST /recruiting-candidates/{id}/schedule-assessment"
        actor: RecruitingOfficer
        preconditions: ["candidate.stage == SCREENED"]
        side_effects:
          - "a SelectionAssessment is created with status SCHEDULED, assessment_version from the request and scheduled_date from the request"
          - "candidate.stage = ASSESSMENT_PENDING"
          - "candidate.entered_stage_at = clock"
      - from: ASSESSMENT_PENDING
        to: ASSESSED
        trigger: "POST /selection-assessments/{id}/score"
        actor: RecruitingOfficer
        preconditions: ["selection_assessment.status == SCHEDULED", "candidate.stage == ASSESSMENT_PENDING", "0 <= raw_score <= 100", "competency_scores carries exactly the four keys MARKET_KNOWLEDGE, RELATIONSHIP, RESILIENCE, ETHICS"]
        side_effects:
          - "selection_assessment.weighted_score = §1.3 selection_assessment_weighted_score"
          - "selection_assessment.locked_weights = the weight table for assessment_version at scoring time"
          - "selection_assessment.outcome = §1.3 selection_assessment_weighted_score outcome branch"
          - "selection_assessment.status = SCORED"
          - "selection_assessment.scored_date = clock"
          - "candidate.stage = ASSESSED"
          - "candidate.entered_stage_at = clock"
        note: "Cross-machine: the same request advances both SelectionAssessment (SCHEDULED->SCORED) and RecruitingCandidate (ASSESSMENT_PENDING->ASSESSED)."
      - from: ASSESSED
        to: INTERVIEW_READY
        trigger: "POST /recruiting-candidates/{id}/advance-to-interview"
        actor: RecruitingOfficer
        preconditions: ["candidate.stage == ASSESSED", "the candidate's selection assessment selected by [latest scored_date DESC, then created_at ASC] among assessments with status SCORED has outcome IN {PASS, CONDITIONAL}"]
        side_effects:
          - "candidate.stage = INTERVIEW_READY"
          - "candidate.entered_stage_at = clock"
        note: "Weak outcome FAIL is refused with ERR_ASSESSMENT_NOT_PASSED."
      - from: INTERVIEW_READY
        to: OFFER_EXTENDED
        trigger: "POST /recruiting-candidates/{id}/extend-offer"
        actor: DistrictDirector
        preconditions: ["candidate.stage == INTERVIEW_READY", "the candidate's district office status == ACTIVE"]
        side_effects:
          - "candidate.stage = OFFER_EXTENDED"
          - "candidate.entered_stage_at = clock"
      - from: OFFER_EXTENDED
        to: OFFER_ACCEPTED
        trigger: "POST /recruiting-candidates/{id}/accept-offer"
        actor: RecruitingOfficer
        preconditions: ["candidate.stage == OFFER_EXTENDED"]
        side_effects:
          - "candidate.stage = OFFER_ACCEPTED"
          - "candidate.entered_stage_at = clock"
      - from: OFFER_EXTENDED
        to: OFFER_DECLINED
        trigger: "POST /recruiting-candidates/{id}/decline-offer"
        actor: RecruitingOfficer
        preconditions: ["candidate.stage == OFFER_EXTENDED"]
        side_effects:
          - "candidate.stage = OFFER_DECLINED"
          - "candidate.entered_stage_at = clock"
      - from: OFFER_ACCEPTED
        to: CONTRACTED
        trigger: "POST /employment-contracts"
        actor: ManagingDirector
        preconditions: ["candidate.stage == OFFER_ACCEPTED", "candidate has no EmploymentContract"]
        side_effects:
          - "an EmploymentContract is created for the target advisor with contract_status ACTIVE_TRAINING"
          - "advisor.contract_status = ACTIVE_TRAINING"
          - "advisor.validation_posture = VALIDATING"
          - "advisor.orphan_pool_access = false"
          - "candidate.stage = CONTRACTED"
          - "candidate.entered_stage_at = clock"
          - "cascade: the advisor's ProductLicense / SecuritiesRegistration / CarrierAppointment rows are NOT created here; the contract starts with all three dimensions at NONE"
        note: "Root of cascade #1: this single transition drives the advisor's contract_status, validation_posture, training-allowance ledger and dictated-tier recomputation."
      - from: OFFER_DECLINED
        to: REENGAGED
        trigger: "POST /recruiting-candidates/{id}/reengage"
        actor: RecruitingOfficer
        preconditions: ["candidate.stage IN {OFFER_DECLINED, REJECTED}"]
        side_effects:
          - "candidate.stage = REENGAGED"
          - "candidate.reengagement_count = candidate.reengagement_count + 1"
          - "every SelectionAssessment of this candidate with status IN {SCHEDULED, SCORED} is set to SUPERSEDED"
          - "candidate.entered_stage_at = clock"
        note: "Cycle edge B: a declined or rejected candidate re-enters the pipeline; re-screening re-uses the SOURCED->SCREENED shape via REENGAGED->SCREENED."
      - from: ASSESSMENT_PENDING
        to: REJECTED
        trigger: "POST /recruiting-candidates/{id}/reject"
        actor: DistrictDirector
        preconditions: ["candidate.stage not in terminal_states"]
        side_effects:
          - "candidate.stage = REJECTED"
          - "every SelectionAssessment of this candidate with status IN {SCHEDULED, SCORED} is set to INVALIDATED"
          - "candidate.entered_stage_at = clock"
      - from: OFFER_EXTENDED
        to: REJECTED
        trigger: "POST /recruiting-candidates/{id}/reject"
        actor: DistrictDirector
        preconditions: ["candidate.stage not in terminal_states"]
        side_effects:
          - "candidate.stage = REJECTED"
          - "every SelectionAssessment of this candidate with status IN {SCHEDULED, SCORED} is set to INVALIDATED"
          - "candidate.entered_stage_at = clock"

  # ---------------------------------------------------------------------------
  - entity: SelectionAssessment
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: SCORED
        trigger: "POST /selection-assessments/{id}/score"
        actor: RecruitingOfficer
        preconditions: ["selection_assessment.status == SCHEDULED", "0 <= raw_score <= 100", "competency_scores carries exactly the four keys MARKET_KNOWLEDGE, RELATIONSHIP, RESILIENCE, ETHICS"]
        side_effects:
          - "weighted_score / outcome / locked_weights / scored_date computed per §1.3 selection_assessment_weighted_score"
          - "selection_assessment.status = SCORED"
          - "if the owning candidate.stage == ASSESSMENT_PENDING then candidate.stage = ASSESSED"
      - from: SCORED
        to: SUPERSEDED
        trigger: "POST /selection-assessments/{id}/supersede"
        actor: RecruitingOfficer
        preconditions: ["selection_assessment.status == SCORED", "candidate.stage == ASSESSED"]
        side_effects:
          - "selection_assessment.status = SUPERSEDED"
          - "candidate.stage = ASSESSMENT_PENDING"
          - "candidate.entered_stage_at = clock"
        note: "Fork branch A of the assessment fork-join: a superseded assessment pushes the candidate back to ASSESSMENT_PENDING, where a fresh SCHEDULED assessment must be produced before the candidate can reach INTERVIEW_READY again."
      - from: SCORED
        to: INVALIDATED
        trigger: "POST /recruiting-candidates/{id}/reject (cascade)"
        actor: system
        preconditions: ["the owning candidate just transitioned to REJECTED"]
        side_effects:
          - "selection_assessment.status = INVALIDATED"
        note: "Fork branch B: rejection invalidates rather than supersedes; the join point ASSESSED is never re-entered."
      - from: SCHEDULED
        to: INVALIDATED
        trigger: "POST /selection-assessments/{id}/invalidate"
        actor: RecruitingOfficer
        preconditions: ["selection_assessment.status == SCHEDULED"]
        side_effects:
          - "selection_assessment.status = INVALIDATED"
          - "candidate.stage = SCREENED"
          - "candidate.entered_stage_at = clock"

  # ---------------------------------------------------------------------------
  - entity: EmploymentContract
    initial_state: ACTIVE_TRAINING
    terminal_states: [VALIDATED, TERMINATED]
    transitions:
      - from: ACTIVE_TRAINING
        to: VALIDATING
        trigger: "POST /validation-periods"
        actor: ManagingDirector
        preconditions: ["contract.contract_status in {ACTIVE_TRAINING, VALIDATING}", "the new window's half-open [start_date, end_date) does not overlap any existing OPEN or EXTENDED window of this contract"]
        side_effects:
          - "a ValidationPeriod is created with status OPEN, required_production_cents and period_number from the request"
          - "contract.contract_status = VALIDATING"
          - "advisor.contract_status = VALIDATING"
          - "advisor.validation_posture = VALIDATING"
        note: "A second window may be opened while the contract is already VALIDATING; the state is unchanged. Adjacent half-open windows that merely touch at a boundary instant are allowed — see validations priority 10."
      - from: VALIDATING
        to: VALIDATING
        trigger: "POST /validation-periods"
        actor: ManagingDirector
        preconditions: ["contract.contract_status == VALIDATING", "the new window's half-open [start_date, end_date) does not touch or overlap any existing OPEN or EXTENDED window of this contract"]
        side_effects:
          - "a ValidationPeriod is created with status OPEN"
        note: "Self-loop: the contract stays VALIDATING; only the window set grows."
      - from: VALIDATING
        to: AT_RISK
        trigger: "POST /validation-periods/{id}/evaluate (achieved < required)"
        actor: ManagingDirector
        preconditions: ["validation_period.status == OPEN", "contract.contract_status == VALIDATING", "validation_period.extension_count < MAX_EXTENSIONS"]
        side_effects:
          - "validation_period.status = FAILED"
          - "validation_period.extension_count = validation_period.extension_count + 1"
          - "validation_period.evaluated_at = clock"
          - "contract.contract_status = AT_RISK"
          - "advisor.contract_status = AT_RISK"
          - "advisor.validation_posture = AT_RISK"
        note: "Cycle edge: a missed window demotes the contract (and its advisor) to AT_RISK; POST /advisors/{id}/remediate returns it to ACTIVE_TRAINING before the next window may open."
      - from: AT_RISK
        to: ACTIVE_TRAINING
        trigger: "POST /advisors/{id}/remediate"
        actor: DistrictDirector
        preconditions: ["contract.contract_status == AT_RISK"]
        side_effects:
          - "contract.contract_status = ACTIVE_TRAINING"
          - "advisor.contract_status = ACTIVE_TRAINING"
          - "advisor.validation_posture = VALIDATING"
      - from: VALIDATING
        to: VALIDATED
        trigger: "POST /validation-periods/{id}/evaluate (achieved >= required)"
        actor: ManagingDirector
        preconditions: ["validation_period.status == OPEN", "contract.contract_status == VALIDATING", "validation_period.achieved_production_cents >= validation_period.required_production_cents"]
        side_effects:
          - "validation_period.status = PASSED"
          - "validation_period.evaluated_at = clock"
          - "contract.contract_status = VALIDATED"
          - "advisor.contract_status = VALIDATED"
          - "advisor.validation_posture = VALIDATED"
          - "advisor.orphan_pool_access = true"
          - "advisor.team_production_cents recomputed"
          - "cascade: every CommissionCredit of this advisor with status ACCRUED has gross_commission_cents and net_commission_cents recomputed per §1.3 commission_credit_allocation (posture-gated override branch now applies)"
          - "cascade (depth 2): the sponsoring advisor's and district office's override income are recomputed per §1.3 override_allocation"
      - from: ACTIVE_TRAINING
        to: TERMINATED
        trigger: "POST /advisors/{id}/terminate (cascade)"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status != NOT_CONTRACTED"]
        side_effects:
          - "contract.contract_status = TERMINATED"
          - "contract.end_date = clock"
          - "all ValidationPeriod rows of the contract with status OPEN are set to FAILED"

  # ---------------------------------------------------------------------------
  - entity: ValidationPeriod
    initial_state: OPEN
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "POST /validation-periods/{id}/evaluate (achieved >= required)"
        actor: ManagingDirector
        preconditions: ["validation_period.status == OPEN", "validation_period.achieved_production_cents >= validation_period.required_production_cents"]
        side_effects:
          - "validation_period.status = PASSED"
          - "contract.contract_status = VALIDATED (see EmploymentContract machine)"
      - from: OPEN
        to: FAILED
        trigger: "POST /validation-periods/{id}/evaluate (achieved < required)"
        actor: ManagingDirector
        preconditions: ["validation_period.status == OPEN", "validation_period.extension_count < MAX_EXTENSIONS"]
        side_effects:
          - "validation_period.status = FAILED"
          - "contract.contract_status = AT_RISK (see EmploymentContract machine)"
        note: "extension_count is incremented on the period at the moment it fails; a period may only be extended MAX_EXTENSIONS times across successive windows."
      - from: OPEN
        to: EXTENDED
        trigger: "POST /validation-periods/{id}/extend"
        actor: ManagingDirector
        preconditions: ["validation_period.status == OPEN", "validation_period.extension_count < MAX_EXTENSIONS", "achieved_production_cents < required_production_cents"]
        side_effects:
          - "validation_period.extended_end_date = the requested new end_date"
          - "validation_period.end_date = extended_end_date"
          - "validation_period.extension_count = validation_period.extension_count + 1"
          - "validation_period.status = EXTENDED"
      - from: EXTENDED
        to: OPEN
        trigger: "POST /validation-periods/{id}/evaluate"
        actor: ManagingDirector
        preconditions: ["validation_period.status == EXTENDED"]
        side_effects:
          - "validation_period.status = OPEN only when achieved_production_cents < required_production_cents after the extension; otherwise PASSED"
          - "achieved_production_cents recomputed offline over the widened window"

  # ---------------------------------------------------------------------------
  - entity: Advisor
    initial_state: NOT_CONTRACTED
    terminal_states: [TERMINATED]
    transitions:
      - from: NOT_CONTRACTED
        to: ACTIVE_TRAINING
        trigger: "POST /employment-contracts"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status == NOT_CONTRACTED", "the supplied candidate_id refers to a RecruitingCandidate with stage == OFFER_ACCEPTED"]
        side_effects:
          - "advisor.contract_status = ACTIVE_TRAINING"
          - "advisor.validation_posture = VALIDATING"
          - "EmploymentContract created (see EmploymentContract machine)"
      - from: ACTIVE_TRAINING
        to: VALIDATING
        trigger: "POST /validation-periods"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status == ACTIVE_TRAINING"]
        side_effects:
          - "advisor.contract_status = VALIDATING"
          - "advisor.validation_posture = VALIDATING"
          - "advisor.team_production_cents recomputed (posture-gated)"
      - from: VALIDATING
        to: AT_RISK
        trigger: "POST /validation-periods/{id}/evaluate (achieved < required)"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status == VALIDATING"]
        side_effects:
          - "advisor.contract_status = AT_RISK"
          - "advisor.validation_posture = AT_RISK"
          - "advisor.orphan_pool_access = false"
      - from: ACTIVE_TRAINING
        to: AT_RISK
        trigger: "POST /carrier-appointments/{id}/approve where requires_license.expires_at <= clock"
        actor: system
        preconditions: ["advisor.contract_status == ACTIVE_TRAINING", "the referenced ProductLicense has expires_at <= logical clock", "advisor.licensing_locked == false"]
        side_effects:
          - "advisor.contract_status = AT_RISK"
          - "advisor.validation_posture = AT_RISK"
        note: "Ordering-sensitive: approving an appointment against a license that expired between license activation and approval demotes the advisor, because the license is locked to the appointment at activation time."
      - from: AT_RISK
        to: ACTIVE_TRAINING
        trigger: "POST /advisors/{id}/remediate"
        actor: DistrictDirector
        preconditions: ["advisor.contract_status == AT_RISK", "advisor.insurance_license_status == ACTIVE", "advisor.appointment_status == APPROVED", "the advisor has an EmploymentContract with contract_status == AT_RISK"]
        side_effects:
          - "advisor.contract_status = ACTIVE_TRAINING"
          - "advisor.validation_posture = VALIDATING"
      - from: VALIDATED
        to: AT_RISK
        trigger: "POST /persistency-records/{id}/finalize where persistency_tier == INELIGIBLE"
        actor: system
        preconditions: ["advisor.contract_status == VALIDATED", "the finalized PersistencyRecord has persistency_tier == INELIGIBLE"]
        side_effects:
          - "advisor.contract_status = AT_RISK"
          - "advisor.validation_posture = AT_RISK"
          - "advisor.renewal_commission_cents recomputed (no renewal accrues at INELIGIBLE)"
          - "advisor.orphan_pool_access = false"
          - "cascade: every CommissionCredit of this advisor with status ACCRUED is recomputed per §1.3 commission_credit_allocation (no attribution change) and the advisor's team_production_cents is recomputed"
      - from: ACTIVE_TRAINING
        to: TERMINATED
        trigger: "POST /advisors/{id}/terminate"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status IN {ACTIVE_TRAINING, VALIDATING, AT_RISK, VALIDATED}"]
        side_effects:
          - "advisor.contract_status = TERMINATED"
          - "advisor.validation_posture = FAILED_POSTURE"
          - "advisor.orphan_pool_access = false"
          - "advisor.terminated_at = clock"
          - "all EmploymentContract rows of this advisor with contract_status IN {ACTIVE_TRAINING, VALIDATING} are set to TERMINATED"
          - "all ValidationPeriod rows under those contracts with status IN {OPEN, EXTENDED} are set to FAILED"
          - "cascade: every ProductLicense of this advisor with status != REVOKED is set to REVOKED"
          - "cascade: every SecuritiesRegistration of this advisor with status != TERMINATED is set to TERMINATED"
          - "cascade: every CarrierAppointment of this advisor with status != TERMINATED is set to TERMINATED"
          - "cascade: for every Policy with writing_advisor_id == this advisor and status IN {ISSUED, ACTIVE}, policy.orphaned = true and an OrphanPolicyAssignment is created with status PENDING, assignment_method ROUND_ROBIN and from_advisor_id = this advisor"
          - "cascade: every JointWorkCase of this advisor with status IN {OPEN, SUBMITTED} is set to VOIDED"
          - "cascade: every CommissionCredit of this advisor with status ACCRUED and credit_type RENEWAL is set to VOIDED"
          - "cascade: for every CommissionCredit with credit_type IN {OVERRIDE_DO, OVERRIDE_MD} whose credit depends on a now-orphaned policy, the credit is recomputed and reassessed per §1.3 chargeback_assessment"
          - "advisor.chargeback_balance_cents recomputed"
          - "advisor.team_production_cents recomputed"
      - from: VALIDATING
        to: TERMINATED
        trigger: "POST /advisors/{id}/terminate"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status IN {ACTIVE_TRAINING, VALIDATING, AT_RISK, VALIDATED}"]
        side_effects:
          - "the same cascade set as the ACTIVE_TRAINING->TERMINATED transition"
      - from: VALIDATED
        to: TERMINATED
        trigger: "POST /advisors/{id}/terminate"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status IN {ACTIVE_TRAINING, VALIDATING, AT_RISK, VALIDATED}"]
        side_effects:
          - "the same cascade set as the ACTIVE_TRAINING->TERMINATED transition"
      - from: AT_RISK
        to: TERMINATED
        trigger: "POST /advisors/{id}/terminate"
        actor: ManagingDirector
        preconditions: ["advisor.contract_status IN {ACTIVE_TRAINING, VALIDATING, AT_RISK, VALIDATED}"]
        side_effects:
          - "the same cascade set as the ACTIVE_TRAINING->TERMINATED transition"
      # --- parallel dimension: insurance_license_status ---
      - from: NONE
        to: PENDING
        trigger: "POST /product-licenses"
        actor: LicensingCoordinator
        preconditions: ["advisor.insurance_license_status == NONE or the advisor already holds another license"]
        side_effects:
          - "ProductLicense created with status PENDING"
          - "advisor.insurance_license_status = PENDING"
        note: "Parallel dimension on the Advisor row; evolves independently of contract_status."
      - from: PENDING
        to: ACTIVE
        trigger: "POST /product-licenses/{id}/activate"
        actor: LicensingCoordinator
        preconditions: ["product_license.status == PENDING", "clock < product_license.expires_at"]
        side_effects:
          - "product_license.status = ACTIVE"
          - "advisor.insurance_license_status = ACTIVE"
          - "cascade: every CarrierAppointment of this advisor with appointment_status == REQUESTED and requires_license_id == this license is re-evaluated per §1.3 appointment_sequencing_gate"
      - from: ACTIVE
        to: LAPSED
        trigger: "system: logical clock reaches product_license.expires_at"
        actor: system
        preconditions: ["product_license.status == ACTIVE", "clock >= product_license.expires_at"]
        side_effects:
          - "product_license.status = LAPSED"
          - "advisor.insurance_license_status = LAPSED"
          - "cascade: every Policy of this advisor with status == ISSUED is blocked from ISSUED->ACTIVE with ERR_LICENSE_NOT_ACTIVE"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /product-licenses/{id}/renew"
        actor: LicensingCoordinator
        preconditions: ["product_license.status == LAPSED", "the request supplies a new expires_at strictly after the logical clock"]
        side_effects:
          - "product_license.expires_at = new expires_at"
          - "product_license.status = ACTIVE"
          - "advisor.insurance_license_status = ACTIVE"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /advisors/{id}/terminate (cascade)"
        actor: system
        preconditions: ["the owning advisor just transitioned to TERMINATED"]
        side_effects: ["product_license.status = REVOKED"]
      # --- parallel dimension: securities_registration_status ---
      - from: NONE
        to: PENDING
        trigger: "POST /securities-registrations"
        actor: LicensingCoordinator
        preconditions: ["advisor.securities_registration_status == NONE or the advisor already holds another registration"]
        side_effects:
          - "SecuritiesRegistration created with status PENDING"
          - "advisor.securities_registration_status = PENDING"
      - from: PENDING
        to: ACTIVE
        trigger: "POST /securities-registrations/{id}/activate"
        actor: LicensingCoordinator
        preconditions: ["securities_registration.status == PENDING", "clock < securities_registration.expires_at", "if prerequisite_registration_id is not null then the referenced registration.status == ACTIVE; otherwise advisor.insurance_license_status == ACTIVE"]
        side_effects:
          - "securities_registration.status = ACTIVE"
          - "advisor.securities_registration_status = ACTIVE"
          - "cascade: every dependent SecuritiesRegistration of this advisor whose prerequisite_registration_id == this registration is re-evaluated (its PENDING->ACTIVE gate may now open)"
        note: "Cross-entity + self-referential sequencing: SERIES_66 may be registered directly off an ACTIVE insurance license, while SERIES_63 and SERIES_65 require an already-ACTIVE prerequisite registration."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: logical clock reaches securities_registration.expires_at"
        actor: system
        preconditions: ["securities_registration.status == ACTIVE", "clock >= securities_registration.expires_at"]
        side_effects:
          - "securities_registration.status = SUSPENDED"
          - "advisor.securities_registration_status = SUSPENDED"
          - "cascade: every Policy of this advisor with product_line IN {ANNUITY} and status == ISSUED cannot reach ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /advisors/{id}/terminate (cascade)"
        actor: system
        preconditions: ["the owning advisor just transitioned to TERMINATED"]
        side_effects: ["securities_registration.status = TERMINATED"]
      # --- parallel dimension: appointment_status ---
      - from: NONE
        to: REQUESTED
        trigger: "POST /carrier-appointments"
        actor: LicensingCoordinator
        preconditions: ["the referenced ProductLicense exists and belongs to this advisor"]
        side_effects:
          - "CarrierAppointment created with appointment_status REQUESTED"
          - "advisor.appointment_status = REQUESTED"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /carrier-appointments/{id}/approve"
        actor: LicensingCoordinator
        preconditions: ["carrier_appointment.appointment_status == REQUESTED", "the referenced ProductLicense status == ACTIVE", "clock < that license's expires_at"]
        side_effects:
          - "carrier_appointment.appointment_status = APPROVED"
          - "carrier_appointment.appointment_date = clock"
          - "advisor.appointment_status = APPROVED"
        note: "If the license has expired the request is refused with ERR_LICENSE_NOT_ACTIVE, and the advisor's contract_status is demoted per the Advisor ACTIVE_TRAINING->AT_RISK transition."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /carrier-appointments/{id}/reject"
        actor: LicensingCoordinator
        preconditions: ["carrier_appointment.appointment_status == REQUESTED"]
        side_effects:
          - "carrier_appointment.appointment_status = REJECTED"
          - "advisor.appointment_status = NONE when no other appointment of the advisor is REQUESTED or APPROVED"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /advisors/{id}/terminate (cascade)"
        actor: system
        preconditions: ["the owning advisor just transitioned to TERMINATED"]
        side_effects: ["carrier_appointment.appointment_status = TERMINATED"]

  # ---------------------------------------------------------------------------
  - entity: Policy
    initial_state: ISSUED
    terminal_states: [TERMINATED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /policies/{id}/activate"
        actor: ManagingDirector
        preconditions: ["policy.status == ISSUED", "the writing advisor's insurance_license_status == ACTIVE", "if product_line == ANNUITY then the writing advisor's securities_registration_status == ACTIVE", "the writing advisor's appointment_status == APPROVED", "the writing advisor's contract_status != TERMINATED"]
        side_effects:
          - "policy.status = ACTIVE"
          - "policy.months_inforce = 0"
        note: "Appointment sequencing: for product_line ANNUITY both an ACTIVE insurance license AND an ACTIVE securities registration are required, because variable annuities are dual-registered products."
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/lapse"
        actor: ManagingDirector
        preconditions: ["policy.status == ACTIVE", "policy.lapse_date is null or the policy has been reinstated since"]
        side_effects:
          - "policy.status = LAPSED"
          - "policy.lapse_date = the supplied lapse_date"
          - "policy.months_inforce = completed months between issue_date and lapse_date"
          - "cascade: every CommissionCredit of this policy with status PAID or ACCRUED is assessed per §1.3 chargeback_assessment"
          - "cascade (depth 2): for every OVERRIDE_DO / OVERRIDE_MD credit of this policy that was itself charged back, the dependent override of the sponsoring advisor is recomputed and reassessed"
          - "advisor.chargeback_balance_cents recomputed for every affected advisor"
        note: "A lapse within 12 completed months of issue is the chargeback trigger; issued >= 12 months earlier is charged back only when is_advanced_commission is true and only for the unearned balance."
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /policies/{id}/reinstate"
        actor: ManagingDirector
        preconditions: ["policy.status == LAPSED", "clock - policy.lapse_date < REINSTATEMENT_WINDOW_DAYS"]
        side_effects:
          - "policy.status = ACTIVE"
          - "policy.reinstatement_date = clock"
          - "policy.lapse_date = null"
          - "cascade: every CommissionCredit of this policy with status CHARGED_BACK reverts to PAID with chargeback_assessed_cents = 0 but recovered_cents retained"
          - "advisor.chargeback_balance_cents recomputed: recomputation must subtract only the unrecovered remainder"
        note: "Compensating action for the lapse cascade; the recovered portion of a chargeback is never refunded."
      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /policies/{id}/surrender"
        actor: ManagingDirector
        preconditions: ["policy.status == ACTIVE"]
        side_effects:
          - "policy.status = SURRENDERED"
          - "cascade: §1.3 chargeback_assessment with reason SURRENDER (full gross_commission_cents assessed regardless of months_inforce)"
      - from: LAPSED
        to: SURRENDERED
        trigger: "POST /policies/{id}/surrender"
        actor: ManagingDirector
        preconditions: ["policy.status == LAPSED"]
        side_effects:
          - "policy.status = SURRENDERED"
      - from: SURRENDERED
        to: TERMINATED
        trigger: "POST /policies/{id}/terminate"
        actor: ManagingDirector
        preconditions: ["policy.status == SURRENDERED"]
        side_effects:
          - "policy.status = TERMINATED"
          - "if policy.orphaned == true and an OrphanPolicyAssignment with status PENDING exists for this policy, that assignment is set to REJECTED with rejection_reason POLICY_TERMINATED"

  # ---------------------------------------------------------------------------
  - entity: JointWorkCase
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /joint-work-cases/{id}/submit"
        actor: FinancialRep
        preconditions: ["joint_work_case.status == OPEN", "X-User-ID == joint_work_case.lead_advisor_id", "lead and support advisors' validation_posture IN {VALIDATING, VALIDATED}", "the case's policy.status IN {ISSUED, ACTIVE}", "the policy has no OTHER JointWorkCase in status OPEN or SUBMITTED"]
        side_effects:
          - "joint_work_case.status = SUBMITTED"
          - "joint_work_case.submitted_at = clock"
          - "§1.3 joint_work_credit_split recomputes the SPLIT_LEAD and SPLIT_SUPPORT CommissionCredit rows for the policy"
          - "lead and support advisors' team_production_cents recomputed"
          - "cascade (depth 2): the sponsoring advisors' override_income_cents recomputed per §1.3 override_allocation"
          - "cascade (depth 3): the district office's override income for that measurement recomputed and capped"
        note: "Root of cascade #3: submitting a joint case reallocates credit, which moves team production, which moves sponsor overrides, which moves the district-office override cap."
      - from: OPEN
        to: VOIDED
        trigger: "POST /joint-work-cases/{id}/void"
        actor: FinancialRep
        preconditions: ["joint_work_case.status == OPEN", "X-User-ID == joint_work_case.lead_advisor_id"]
        side_effects:
          - "joint_work_case.status = VOIDED"
          - "the policy's SPLIT_LEAD and SPLIT_SUPPORT credits are set to VOIDED and the PRIMARY credit is restored to credit_pct 1.0"
          - "involved advisors' team_production_cents recomputed"
      - from: SUBMITTED
        to: CLOSED
        trigger: "POST /joint-work-cases/{id}/close"
        actor: ManagingDirector
        preconditions: ["joint_work_case.status == SUBMITTED"]
        side_effects:
          - "joint_work_case.status = CLOSED"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /joint-work-cases/{id}/void"
        actor: ManagingDirector
        preconditions: ["joint_work_case.status == SUBMITTED", "clock - joint_work_case.submitted_at <= JOINT_VOID_WINDOW_DAYS", "no CommissionCredit of the policy has status RECOVERED"]
        side_effects:
          - "joint_work_case.status = VOIDED"
          - "the SPLIT_LEAD and SPLIT_SUPPORT credits are set to VOIDED and the PRIMARY credit is restored to credit_pct 1.0 with gross_commission_cents recomputed"
          - "involved advisors' team_production_cents recomputed"
          - "cascade (depth 2): the sponsoring advisors' override_income_cents recomputed"
        note: "After the void window closes or once any credit has been recovered, SUBMITTED may only go to CLOSED."
      - from: VOIDED
        to: OPEN
        trigger: "POST /joint-work-cases/{id}/reopen"
        actor: FinancialRep
        preconditions: ["joint_work_case.status == VOIDED", "the case's policy.status IN {ISSUED, ACTIVE}"]
        side_effects:
          - "joint_work_case.status = OPEN"
          - "joint_work_case.submitted_at = null"
        note: "Cycle edge: a voided case may be reopened and resubmitted, so credit allocation is not monotone."

  # ---------------------------------------------------------------------------
  - entity: PersistencyRecord
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED]
    transitions:
      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /persistency-records/{id}/dispute"
        actor: FinancialRep
        preconditions: ["persistency_record.status == PROVISIONAL", "X-User-ID == persistency_record.advisor_id"]
        side_effects:
          - "persistency_record.status = DISPUTED"
      - from: DISPUTED
        to: PROVISIONAL
        trigger: "POST /persistency-records/{id}/resolve-dispute"
        actor: ManagingDirector
        preconditions: ["persistency_record.status == DISPUTED"]
        side_effects:
          - "persistency_record.status = PROVISIONAL"
        note: "Cycle edge: a disputed measurement returns to PROVISIONAL and may be re-measured before finalization."
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /persistency-records/{id}/finalize"
        actor: ManagingDirector
        preconditions: ["persistency_record.status == PROVISIONAL", "the advisor's contract_status == VALIDATED", "the advisor's validation_posture == VALIDATED"]
        side_effects:
          - "persistency_record.persistency_pct = §1.3 persistency_rate_and_renewal"
          - "persistency_record.persistency_tier = §1.3 persistency_rate_and_renewal tier branch"
          - "persistency_record.renewal_rate_pct = §1.3 persistency_rate_and_renewal rate branch"
          - "persistency_record.renewal_commission_cents = §1.3 persistency_rate_and_renewal renewal branch"
          - "persistency_record.status = FINALIZED"
          - "advisor.renewal_commission_cents = advisor.renewal_commission_cents + persistency_record.renewal_commission_cents"
          - "a CommissionCredit is created for the advisor with credit_type RENEWAL and gross_commission_cents = renewal_commission_cents"
          - "if persistency_tier == INELIGIBLE: cascade to the Advisor VALIDATED->AT_RISK transition"
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /persistency-records/{id}/finalize"
        actor: ManagingDirector
        preconditions: ["persistency_record.status == DISPUTED", "the advisor's contract_status == VALIDATED"]
        side_effects:
          - "the same computation and accrual set as the PROVISIONAL->FINALIZED transition"
          - "persistency_record.status = FINALIZED"

  # ---------------------------------------------------------------------------
  - entity: CommissionCredit
    initial_state: ACCRUED
    terminal_states: [RECOVERED, VOIDED]
    transitions:
      - from: ACCRUED
        to: PAID
        trigger: "POST /commission-credits/{id}/pay"
        actor: ManagingDirector
        preconditions: ["commission_credit.status == ACCRUED", "the advisor's validation_posture IN {VALIDATING, VALIDATED}"]
        side_effects:
          - "commission_credit.status = PAID"
          - "commission_credit.advanced_paid_cents = net_commission_cents"
        note: "Payout is posture-gated: AT_RISK and FAILED_POSTURE are refused with ERR_VALIDATION_POSTURE_BLOCKS_PAYOUT."
      - from: ACCRUED
        to: VOIDED
        trigger: "POST /commission-credits/{id}/void"
        actor: ManagingDirector
        preconditions: ["commission_credit.status == ACCRUED", "commission_credit.recovered_cents == 0"]
        side_effects:
          - "commission_credit.status = VOIDED"
          - "commission_credit.gross_commission_cents = 0"
          - "advisor.team_production_cents recomputed"
      - from: PAID
        to: CHARGED_BACK
        trigger: "POST /policies/{id}/lapse or POST /policies/{id}/surrender (cascade)"
        actor: system
        preconditions: ["commission_credit.status == PAID", "§1.3 chargeback_assessment yields an assessed amount > 0"]
        side_effects:
          - "commission_credit.chargeback_assessed_cents = §1.3 chargeback_assessment"
          - "commission_credit.chargeback_reason = LAPSE_WITHIN_12MO or SURRENDER"
          - "commission_credit.status = CHARGED_BACK"
          - "advisor.chargeback_balance_cents = advisor.chargeback_balance_cents + (chargeback_assessed_cents - recovered_cents)"
          - "cascade (depth 2): where the charged-back credit is an OVERRIDE_DO or OVERRIDE_MD row, the dependent override row of the sponsoring advisor is recomputed and, if it was PAID, is itself set to CHARGED_BACK"
      - from: ACCRUED
        to: CHARGED_BACK
        trigger: "POST /policies/{id}/lapse (cascade, credit never paid)"
        actor: system
        preconditions: ["commission_credit.status == ACCRUED", "§1.3 chargeback_assessment yields an assessed amount > 0"]
        side_effects:
          - "commission_credit.chargeback_assessed_cents = §1.3 chargeback_assessment"
          - "commission_credit.chargeback_reason = LAPSE_WITHIN_12MO"
          - "commission_credit.status = CHARGED_BACK"
          - "advisor.chargeback_balance_cents recomputed"
      - from: CHARGED_BACK
        to: RECOVERED
        trigger: "POST /commission-credits/{id}/recover"
        actor: ManagingDirector
        preconditions: ["commission_credit.status == CHARGED_BACK", "0 < amount <= chargeback_assessed_cents - recovered_cents"]
        side_effects:
          - "commission_credit.recovered_cents = commission_credit.recovered_cents + amount"
          - "advisor.chargeback_balance_cents = advisor.chargeback_balance_cents - amount"
          - "if recovered_cents == chargeback_assessed_cents then commission_credit.status = RECOVERED"
      - from: CHARGED_BACK
        to: PAID
        trigger: "POST /policies/{id}/reinstate (cascade)"
        actor: system
        preconditions: ["commission_credit.status == CHARGED_BACK", "the policy just transitioned LAPSED->ACTIVE"]
        side_effects:
          - "commission_credit.status = PAID"
          - "commission_credit.chargeback_assessed_cents = 0"
          - "commission_credit.chargeback_reason = null"
          - "commission_credit.recovered_cents unchanged (already-recovered money is never returned)"
          - "advisor.chargeback_balance_cents = advisor.chargeback_balance_cents - (assessed_at_reversal - recovered_cents)"
        note: "Compensating action; the ledger invariant is chargeback_balance_cents == sum(chargeback_assessed_cents - recovered_cents) over CHARGED_BACK credits, so a reversed credit whose recovered_cents > 0 leaves a credit in the advisor's favour."

  # ---------------------------------------------------------------------------
  - entity: OrphanPolicyAssignment
    initial_state: PENDING
    terminal_states: [ASSIGNED, REJECTED]
    transitions:
      - from: PENDING
        to: ASSIGNED
        trigger: "POST /orphan-policy-assignments/{id}/assign"
        actor: ManagingDirector
        preconditions: ["orphan_policy_assignment.status == PENDING", "policy.orphaned == true", "the §1.9 selector resolves a non-empty eligible advisor pool"]
        side_effects:
          - "orphan_policy_assignment.to_advisor_id = the selector's chosen advisor"
          - "policy.writing_advisor_id = to_advisor_id"
          - "policy.orphaned = false"
          - "orphan_policy_assignment.status = ASSIGNED"
          - "orphan_policy_assignment.assigned_at = clock"
          - "the receiving advisor's team_production_cents recomputed"
          - "cascade (depth 2): the receiving advisor's sponsoring advisors' override_income_cents recomputed per §1.3 override_allocation"
        note: "Selector: eligible advisors are those with district_office_id == policy-writing office, contract_status IN {VALIDATING, VALIDATED}, validation_posture IN {VALIDATING, VALIDATED}, appointment_status == APPROVED, and id != from_advisor_id; ranked by team_production_cents ASC, tie-broken by created_at ASC, then id ASC as the final deterministic fallback."
      - from: PENDING
        to: REJECTED
        trigger: "POST /orphan-policy-assignments/{id}/assign when the eligible pool is empty"
        actor: ManagingDirector
        preconditions: ["orphan_policy_assignment.status == PENDING", "the §1.9 selector resolves an empty eligible advisor pool"]
        side_effects:
          - "orphan_policy_assignment.status = REJECTED"
          - "orphan_policy_assignment.rejection_reason = NO_ELIGIBLE_ADVISOR"
          - "policy.orphaned remains true"
        note: "Empty-pool fallback: never silently no-ops, never assigns to the terminated advisor."
      - from: REJECTED
        to: PENDING
        trigger: "POST /orphan-policy-assignments/{id}/reopen"
        actor: ManagingDirector
        preconditions: ["orphan_policy_assignment.status == REJECTED", "policy.orphaned == true"]
        side_effects:
          - "orphan_policy_assignment.status = PENDING"
          - "orphan_policy_assignment.rejection_reason = null"
        note: "Cycle edge: an orphan assignment can be retried once a new advisor becomes eligible."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: contract-create-stale-candidate
    parent_entity: RecruitingCandidate
    write_endpoint: "POST /agency/employment-contracts"
    occ_field: "expected_candidate_version"
    description: |
      Creating an EmploymentContract against a RecruitingCandidate whose
      version has advanced since the client last observed it is rejected.
      The natural product semantics permit a second, legitimately superseding
      contract request (a renegotiated offer on the same candidate), so the
      loser cannot be distinguished by any state field it observes; only the
      parent's version pins it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: validation-period-create-stale-contract
    parent_entity: EmploymentContract
    write_endpoint: "POST /agency/validation-periods"
    occ_field: "expected_contract_version"
    description: |
      Opening a validation window against an EmploymentContract whose version
      has advanced since the client last observed it is rejected. A second
      window is a legitimate product action (a remediation window), so there
      is no state field that distinguishes the stale writer.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: joint-case-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /agency/joint-work-cases"
    occ_field: "expected_policy_version"
    description: |
      Creating a JointWorkCase against a Policy whose version has advanced
      since the client last observed it is rejected. Opening a second joint
      case on the same policy is a legitimate product action, so the stale
      writer is invisible to state preconditions and only the parent version
      can reject it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: selection_assessment_weighted_score
    trigger: "POST /selection-assessments/{id}/score"
    algorithm: weighted_scoring
    formula: |
      # assessment_version selects the competency weight table, evaluated FIRST.
      # V1 weights: MARKET_KNOWLEDGE 0.175, RELATIONSHIP 0.275, RESILIENCE 0.25, ETHICS 0.30
      # V2 weights: MARKET_KNOWLEDGE 0.30,  RELATIONSHIP 0.15,  RESILIENCE 0.20, ETHICS 0.35
      competency_avg     = sum over the four competency keys of (competency_scores[key] * weight[key])
      weighted_component = round_2( competency_avg * 0.70 )
      raw_component      = round_2( competency_scores.ETHICS * 0.305 )
      weighted_score     = round_2( weighted_component + raw_component )
      outcome            = PASS         when weighted_score >= 8.00
                           CONDITIONAL  when 5.50 <= weighted_score < 8.00
                           FAIL         when weighted_score < 5.50
      locked_weights     = the weight table actually applied
      # PINNED EVALUATION ORDER — round-then-sum. Each of the two terms is rounded to
      # 2 dp BEFORE the addition. The rival, equally plausible reading
      #     weighted_score = round_2( competency_avg * 0.70 + competency_scores.ETHICS * 0.305 )
      # (sum-then-round) is WRONG and produces a different cent: competency
      # MARKET_KNOWLEDGE 9 / RELATIONSHIP 9 / RESILIENCE 8 / ETHICS 9 under V1 gives
      # 8.88 pinned, 8.87 unpinned. The scaffold pins the round-then-sum order.
    input_set: "The SelectionAssessment being scored; competency_scores must carry exactly MARKET_KNOWLEDGE, RELATIONSHIP, RESILIENCE, ETHICS, each an integer 0..10. raw_score is stored but never enters weighted_score."
    constants:
      COMPONENT_WEIGHT: 0.70
      RAW_COMPONENT_WEIGHT: 0.305
      PASS_CUT: 8.00
      CONDITIONAL_CUT: 5.50
      W1_MARKET_KNOWLEDGE: 0.175
      W1_RELATIONSHIP: 0.275
      W1_RESILIENCE: 0.25
      W1_ETHICS: 0.30
      W2_MARKET_KNOWLEDGE: 0.30
      W2_RELATIONSHIP: 0.15
      W2_RESILIENCE: 0.20
      W2_ETHICS: 0.35
    precision: "weighted_score 2 decimal places, round_half_up at each of the two intermediate products and again after the sum"
    variants:
      - name: version_v1_table
        when: "assessment_version == V1"
        difference: "MARKET_KNOWLEDGE 0.175 / RELATIONSHIP 0.275 / RESILIENCE 0.25 / ETHICS 0.30. Competency 4/10/10/8 yields weighted_score 8.29 (PASS); competency 9/9/8/9 yields 8.88."
      - name: version_v2_table
        when: "assessment_version == V2"
        difference: "MARKET_KNOWLEDGE 0.30 / RELATIONSHIP 0.15 / RESILIENCE 0.20 / ETHICS 0.35. The SAME competency 4/10/10/8 yields weighted_score 7.69 — CONDITIONAL, a different band from the V1 result for identical input."

  - name: training_allowance_draw
    trigger: "POST /training-allowance-draws; POST /validation-periods/{id}/evaluate"
    algorithm: threshold
    formula: |
      product_requirement_met = ( sum of the advisor's PRIMARY + SPLIT_LEAD + SPLIT_SUPPORT
                                  gross_commission_cents over credits with status IN {ACCRUED, PAID}
                                  >= product_requirement_cents )
      product_requirement_cents = round_2( contract.validation_requirement_cents * PRODUCT_REQUIREMENT_PCT )
      if contract.contract_status == TERMINATED:            draw_per_window = 0
      elif product_requirement_met:                          draw_per_window = 0   # allowance PAUSES, it does not repay
      elif contract.training_allowance_mode == FLAT_MONTHLY: draw_per_window = FLAT_MONTHLY_AMOUNT
      else:                                                  draw_per_window = round_2( contract.validation_requirement_cents * PRODUCTION_DRAW_PCT )
      training_allowance_paid_cents = min( training_allowance_total_cents,
                                           training_allowance_paid_cents + draw_per_window )
      recruiter_override_cents      = round_2( contract.validation_requirement_cents * RECRUITER_OVERRIDE_PCT )
      # PINNED ORDER: product requirement tested BEFORE mode selection, so a contract
      # that has met its requirement draws 0 under either mode.
    input_set: "The EmploymentContract, its advisor's ACCRUED/PAID PRIMARY, SPLIT_LEAD and SPLIT_SUPPORT CommissionCredit rows, and training_allowance_mode."
    constants:
      PRODUCT_REQUIREMENT_PCT: 0.35
      PRODUCTION_DRAW_PCT: 0.25
      FLAT_MONTHLY_AMOUNT: 200000
      RECRUITER_OVERRIDE_PCT: 0.05
    precision: "integer cents, round_half_up"
    variants:
      - name: flat_monthly
        when: "training_allowance_mode == FLAT_MONTHLY"
        difference: "Draws a flat 200000 cents per window regardless of the production size, until the total allowance is exhausted."
      - name: production_draw
        when: "training_allowance_mode == PRODUCTION_DRAW"
        difference: "Draws round_2(validation_requirement_cents * 0.25) = 75000 cents for a 300000-cent requirement — a different allowance paid from identical contract figures."

  - name: validation_production_attainment
    trigger: "POST /validation-periods/{id}/evaluate"
    algorithm: chronological
    formula: |
      window = [validation_period.start_date, validation_period.end_date)   # HALF-OPEN
      E = { c in CommissionCredit :
              c.advisor_id == validation_period.advisor_id
              and c.credit_type IN {PRIMARY, SPLIT_LEAD, SPLIT_SUPPORT, RENEWAL}
              and c.status IN {ACCRUED, PAID, CHARGED_BACK}
              and c.created_at >= validation_period.start_date
              and c.created_at <  validation_period.end_date }
      achieved_production_cents = sum over E of c.gross_commission_cents
      # OVERRIDE_DO and OVERRIDE_MD and TRAINING_ALLOWANCE rows are EXCLUDED from attainment.
      # A credit whose created_at equals start_date IS counted; one whose created_at
      # equals end_date is NOT. Chronological processing order = created_at ASC, then
      # id ASC as the final deterministic fallback.
    input_set: "The ValidationPeriod plus its advisor's CommissionCredit rows; only ACCRUED, PAID and CHARGED_BACK credits inside the half-open window count."
    constants:
      WINDOW_OPEN_AT_START: true
      MAX_EXTENSIONS: 2
    precision: "integer cents, no rounding"
    variants: []

  - name: override_allocation
    trigger: "POST /policies; POST /joint-work-cases/{id}/submit; POST /joint-work-cases/{id}/void; POST /advisors/{id}/terminate; POST /orphan-policy-assignments/{id}/assign; POST /validation-periods/{id}/evaluate"
    algorithm: constraint_propagation
    formula: |
      # override_income_cents is FULLY RECOMPUTED from live credits on every trigger —
      # never incremented. That is what makes the termination/reassignment reversal
      # exact: removing a descendant's credit removes its accrual on the next recompute.
      RANK_RATE(ANS) = 0.03 when ANS.rank == DISTRICT_DIRECTOR
                       0.02 when ANS.rank == MANAGING_DIRECTOR
                       0.00 otherwise (rank REP accrues no override for itself)
      override_income_cents(ANS) =
          0   when ANS.contract_status == TERMINATED
                or ANS.validation_posture in {AT_RISK, FAILED_POSTURE}
          min( SUM over every accruing descendant A
                 (every A != ANS whose sponsoring_advisor_id chain reaches ANS,
                  and whose OWN contract_status == VALIDATED)
               of round_half_up_to_int( credit_gross(A) * RANK_RATE(ANS) ),
               office_of(ANS).override_cap_cents )   otherwise
      # PINNED EVALUATION ORDER: (1) the ancestor's own posture gate, (2) the descendant
      # eligibility filter — a descendant passes NO override up the chain until its own
      # contract_status is VALIDATED — (3) per-credit rank accrual with round-then-sum,
      # (4) the office cap applied ONCE to the summed accrual LAST. Capping each accrual
      # before summing would let a chain of small credits exceed the cap; the scaffold
      # pins sum-then-cap. Because eligibility is a CONTRACT dimension and not a posture
      # one, neither a lapse nor a persistency demotion ever retroactively destroys an
      # already-accrued override; only contract validation, termination, or a credit
      # leaving the live set does. office_of(ANS) is the DistrictOffice whose id equals
      # ANS.district_office_id.
      team_production_cents(A) = sum of gross_commission_cents over credits with
          credit_type IN {PRIMARY, SPLIT_LEAD, SPLIT_SUPPORT} and status != VOIDED
          for A and for every advisor whose sponsoring chain reaches A.
      DistrictOffice.override_paid_cents = sum of override_income_cents over every
          advisor whose district_office_id is this office.
    input_set: "Live (non-VOIDED) PRIMARY / SPLIT_LEAD / SPLIT_SUPPORT / RENEWAL credits, the sponsoring chain, each ancestor's rank and validation_posture, and each ancestor's district office cap."
    constants:
      DISTRICT_OVERRIDE_RATE: 0.03
      MANAGING_DIRECTOR_OVERRIDE_RATE: 0.02
      DEFAULT_OVERRIDE_CAP_CENTS: 300000
    precision: "integer cents, round_half_up per accrual, then a single min against the cap"
    variants: []

  - name: commission_credit_allocation
    trigger: "POST /policies; POST /joint-work-cases/{id}/submit; POST /joint-work-cases/{id}/void"
    algorithm: waterfall_allocation
    formula: |
      case_gross_cents = round_half_up_to_int( policy.annual_premium_cents * FIRST_YEAR_COMMISSION_RATE )   # 0.40
      # case_gross_cents is stored identically on every credit row of the policy as
      # CommissionCredit.case_gross_commission_cents.
      if the policy has no JointWorkCase with status SUBMITTED (or the joint case is VOIDED):
          PRIMARY credit to policy.writing_advisor_id: credit_pct 1.00, gross_commission_cents = case_gross_cents
      else (joint case with split_pct_lead s):
          lead_raw    = case_gross_cents * s
          SPLIT_LEAD    to joint.lead_advisor_id:    gross_commission_cents = round_half_up_to_int(lead_raw)
          SPLIT_SUPPORT to joint.support_advisor_id: gross_commission_cents = case_gross_cents - round_half_up_to_int(lead_raw)
          # the residual (which may be -1 or +1 cent) lands on the SUPPORT advisor
          PRIMARY is set to VOIDED with gross_commission_cents 0 and credit_pct 0.00
      # PINNED ROUNDING ORDER — round-the-lead-then-subtract. The support credit is
      # DEFINED as the remainder, never independently rounded. Rounding both shares
      # independently (sum-then-round) can overshoot case_gross_cents by a cent and
      # breaks the conservation invariant below.
      # CONSERVATION INVARIANT: for each policy,
      #   sum( gross_commission_cents over its non-VOIDED PRIMARY/SPLIT_LEAD/SPLIT_SUPPORT credits )
      #   == case_gross_commission_cents  (exactly, to the cent, on every path)
    input_set: "Live credits only; a Voided joint case restores the PRIMARY row to credit_pct 1.00 with gross_commission_cents = case_gross_cents and re-voids the two SPLIT rows."
    constants:
      FIRST_YEAR_COMMISSION_RATE: 0.40
    precision: "integer cents, round_half_up_to_int on the lead share, remainder to the support share"
    variants: []

  - name: chargeback_assessment
    trigger: "POST /policies/{id}/lapse; POST /policies/{id}/surrender; POST /advisors/{id}/terminate"
    algorithm: threshold
    formula: |
      months_inforce = number of COMPLETED calendar months between policy.issue_date and
                       policy.lapse_date (a partial trailing month does not count)
      if the trigger is SURRENDER:
          assessed = credit.gross_commission_cents
      elif months_inforce <= 11:
          assessed = round_to_int( credit.gross_commission_cents * (1 - months_inforce / 24) )
      elif months_inforce == 12:
          assessed = round_to_int( credit.gross_commission_cents * 0.50 )
      else:   # months_inforce >= 13
          assessed = round_to_int( credit.gross_commission_cents * 0.50 ) when policy.is_advanced_commission else 0
      assessed = min( assessed, credit.gross_commission_cents )
      # THREE DISJOINT COMPLETED-MONTH BANDS: [0,11] fully prorated, {12} exactly half,
      # [13,inf) half only for advanced commissions. Completed months is read as
      # (lapse.year - issue.year)*12 + (lapse.month - issue.month), minus one when
      # lapse.day < issue.day — so a policy lapsed in the same month-and-day one year
      # later reads 12, not 11.
      # COMPENSATING INVERSE (pinned): reinstatement sets chargeback_assessed_cents back
      # to 0 and chargeback_reason back to null for every credit of the policy, but leaves
      # recovered_cents UNCHANGED. Therefore
      #   advisor.chargeback_balance_cents == sum over CHARGED_BACK credits of
      #                                     (chargeback_assessed_cents - recovered_cents)
      # and a reversal of a partly recovered chargeback leaves the advisor in credit by
      # exactly recovered_cents. A reversal that refunds recovered money breaks the invariant.
    input_set: "Every CommissionCredit row of the lapsed policy regardless of prior status; OVERRIDE_DO / OVERRIDE_MD rows are assessed by the same formula, and their own reassessment cascades to the next ancestor."
    constants:
      EARLY_LAPSE_MONTHS: 11
      UNEARNED_DENOMINATOR: 24
      LATE_LAPSE_RESIDUAL_PCT: 0.50
      REINSTATEMENT_WINDOW_DAYS: 90
      CHARGEBACK_BLOCK_CENTS: 500000
    precision: "integer cents, round_half_up"
    variants: []

  - name: persistency_rate_and_renewal
    trigger: "POST /persistency-records/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      persistency_pct = round_2( 100 * policies_persisted / policies_issued )    # 0.00 when policies_issued == 0
      tier selection, evaluated in THIS order against INCLUSIVE lower bounds:
          persistency_pct >= 95.00 -> TIER_1      renewal_rate_pct 0.050
          persistency_pct >= 90.00 -> TIER_2      renewal_rate_pct 0.035
          persistency_pct >= 85.00 -> TIER_3      renewal_rate_pct 0.020
          otherwise                -> INELIGIBLE  renewal_rate_pct 0.000
      renewal_base_cents = sum of policy.annual_premium_cents over the advisor's policies
                           whose status is ACTIVE at the instant of measurement_end
                           within the CLOSED window [measurement_start, measurement_end]
      renewal_commission_cents = round_2( renewal_base_cents * renewal_rate_pct )
      # The window is CLOSED at BOTH ends: [measurement_start, measurement_end]. Two
      # measurements for the same advisor whose closed windows share even one boundary
      # instant are rejected (see validations priority 7).
    input_set: "The PersistencyRecord's own counters plus the advisor's ACTIVE policies; PROVISIONAL and DISPUTED records are not yet finalized and accrue nothing."
    constants:
      TIER_1_MIN: 95.00
      TIER_2_MIN: 90.00
      TIER_3_MIN: 85.00
      TIER_1_RATE: 0.050
      TIER_2_RATE: 0.035
      TIER_3_RATE: 0.020
    precision: "persistency_pct 2 dp round_half_up; renewal_commission_cents integer cents round_half_up"
    variants: []

  - name: appointment_sequencing_gate
    trigger: "POST /product-licenses/{id}/activate; POST /securities-registrations/{id}/activate; POST /carrier-appointments/{id}/approve"
    algorithm: topological
    formula: |
      SecuritiesRegistration R may reach ACTIVE only when:
          ( R.prerequisite_registration_id is not null and that registration.status == ACTIVE )
          or ( R.prerequisite_registration_id is null and clock < R.expires_at )
      CarrierAppointment C may reach APPROVED only when:
          its requires_license.status == ACTIVE and clock < that license's expires_at
      # PINNED EVALUATION ORDER: (1) the licence/registration gate, (2) the advisor's
      # parallel-dimension aggregate recompute, (3) the advisor's contract-status
      # demotion check. Reversing (1) and (3) changes which error surfaces.
    input_set: "The registration/appointment row, its declared prerequisite, and the shared logical clock."
    constants: {}
    precision: "n/a — gate only"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and resolve to a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The acting role must hold the operation in its exclusive_operations or shared_operations"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource ids appearing as path segments must exist, validated left-to-right along the path"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all path-parameterised endpoints

  - priority: 4
    category: existence
    check: "Every id supplied in the request body as a foreign key must exist, validated in the order the endpoint's input list declares them"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by referenced type)"
    http_status: 404
    applies_to: "POST /employment-contracts, POST /validation-periods, POST /product-licenses, POST /securities-registrations, POST /carrier-appointments, POST /joint-work-cases, POST /orphan-policy-assignments"

  - priority: 5
    category: state
    check: "The target resource must be in a state from which the requested transition is declared"
    error_id: "ERR_INVALID_STATE"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_safety
    check: "Licensing, registration and appointment compliance: the writing advisor must hold an ACTIVE insurance license for the product line and, for ANNUITY business, an ACTIVE securities registration that is not SUSPENDED or TERMINATED, and an APPROVED carrier appointment; the license/appointment gate for /carrier-appointments/{id}/approve and /securities-registrations/{id}/activate is evaluated here"
    error_id: "ERR_LICENSE_NOT_ACTIVE / ERR_REGISTRATION_NOT_ACTIVE / ERR_APPOINTMENT_NOT_APPROVED / ERR_PREREQUISITE_REGISTRATION_NOT_ACTIVE / ERR_TERMINATED_ADVISOR"
    http_status: 409
    applies_to: "POST /policies/{id}/activate, POST /carrier-appointments/{id}/approve, POST /securities-registrations/{id}/activate, POST /product-licenses/{id}/activate"

  - priority: 7
    category: business_constraint
    check: "Posture and interval constraints: commission payout requires validation_posture IN {VALIDATING, VALIDATED}; joint-work submission requires BOTH advisors' posture IN {VALIDATING, VALIDATED}; a ProductLicense interval for the same advisor and product_line must not overlap an existing half-open [effective_date, expires_at) interval; a SecuritiesRegistration interval for the same advisor and registration_type must not overlap an existing CLOSED [effective_date, expires_at] interval — a shared boundary instant is an overlap for registrations and is NOT an overlap for licences"
    error_id: "ERR_VALIDATION_POSTURE_BLOCKS_PAYOUT / ERR_JOINT_WORK_POSTURE_INELIGIBLE / ERR_LICENSE_INTERVAL_OVERLAP / ERR_REGISTRATION_INTERVAL_OVERLAP"
    http_status: 409
    applies_to: "POST /commission-credits/{id}/pay, POST /joint-work-cases/{id}/submit, POST /product-licenses, POST /securities-registrations, POST /persistency-records"

  - priority: 8
    category: business_fiscal
    check: "Money caps and balances: training allowance draws may not exceed training_allowance_total_cents; override income is min-capped at the district office override_cap_cents; a new business-writing request is refused while the advisor's chargeback_balance_cents exceeds CHARGEBACK_BLOCK_CENTS"
    error_id: "ERR_ALLOWANCE_CAP_EXCEEDED / ERR_CHARGEBACK_BALANCE_BLOCKS_NEW_BUSINESS"
    http_status: 402
    applies_to: "POST /training-allowance-draws, POST /policies/{id}/activate, POST /joint-work-cases/{id}/submit"

  - priority: 9
    category: business_referential
    check: "Uniqueness of natural keys: policy_number unique across Policy; email unique across Advisor; office_code unique across DistrictOffice; crd_number unique per registration_type; license_number unique per state/product_line"
    error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409
    applies_to: "POST /policies, POST /advisors, POST /district-offices, POST /securities-registrations, POST /product-licenses"

  - priority: 10
    category: business_temporal
    check: "A ValidationPeriod window [start_date, end_date) must lie wholly within its EmploymentContract's live span and must not overlap an existing OPEN or EXTENDED window of the same contract; start_date must be strictly before end_date"
    error_id: "ERR_VALIDATION_WINDOW_INVALID / ERR_VALIDATION_WINDOW_OVERLAP / ERR_PERSISTENCY_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /validation-periods, POST /validation-periods/{id}/extend, POST /persistency-records"
    note: ERR_VALIDATION_WINDOW_OVERLAP compares half-open [start_date, end_date) windows; shared boundary instants touch but do not overlap.


