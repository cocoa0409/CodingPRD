              as: Anonymous
              captures: { s10_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${s10_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bg10_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bg10_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${o10_id}", name: "Tucker", species: "DOG", weight_kg: 10 }
              as: Owner
              as_user_id: "${o10_id}"
              captures: { p10_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${o10_id}", sitter_id: "${s10_id}", pet_id: "${p10_id}", scheduled_at: "2026-06-12T07:30:00Z" }
              as: Owner
              as_user_id: "${o10_id}"
              captures: { mg10_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mg10_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${o10_id}"
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${o10_id}", sitter_id: "${s10_id}", pet_id: "${p10_id}", service_type: "WALK_60MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-06-12T09:00:00Z", end_at: "2026-06-12T10:00:00Z" }
              as: Owner
