scenario: |
  Mobile Imaging Unit Scheduling (MRI/CT/PET): route & site day assignment across contracted facilities, patient scheduling within on-site window, equipment transport, setup & power/pad requirement, technologist staffing & travel, downtime/breakdown & site reschedule, contract per-day vs per-scan billing, radiation safety & accreditation compliance, image transfer to reading radiologist

domain_name: mobile-imaging-unit-scheduling
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# All times are logical-clock UTC. service_date is "YYYY-MM-DD"; time-of-day
# fields are "HH:MM" 24h UTC on the entity's service_date.
# =============================================================================
entities:
  - name: ContractedFacility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: address, type: string, source: input, description: "Street address of the imaging pad site" }
      - { name: supported_modalities, type: array, source: input, description: "List of modality enums the facility hosts: MRI | CT | PET" }
      - { name: pad_amps_available, type: integer, source: input, description: "Shore-power amperage available at the parking pad" }
      - { name: pad_voltage, type: integer, source: input, description: "Pad supply voltage; must equal unit voltage_required" }
      - { name: pad_level_tolerance_deg, type: number, source: input, description: "Max pad slope in degrees the facility certifies" }

  - name: MobileImagingUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique operator code for the coach/trailer" }
      - { name: modality, type: enum, source: input, description: "MRI | CT | PET" }
      - { name: power_required_amps, type: integer, source: input, description: "Amperage the scanner draws; pad must supply >= this" }
      - { name: voltage_required, type: integer, source: input, description: "Voltage the unit requires; must equal pad_voltage" }
      - { name: setup_minutes, type: integer, source: input, description: "Minutes from arrival to first-patient readiness" }
      - { name: teardown_minutes, type: integer, source: input, description: "Minutes from last patient to roadworthy departure" }
      - { name: home_base_name, type: string, source: input, description: "Depot where the unit stages" }
      - { name: status, type: enum, source: system, description: "ACTIVE_SERVICE | MAINTENANCE | OUT_OF_SERVICE (state machine)" }
      - { name: active_breakdown_id, type: string, source: system, description: "FK -> BreakdownEvent.id; unresolved breakdown holding this unit OUT_OF_SERVICE, null when none", default: null }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> ContractedFacility.id; contracted site" }
      - { name: billing_model, type: enum, source: input, description: "PER_DAY | PER_SCAN — selects billing variant" }
      - { name: day_rate_cents, type: integer, source: input, description: "Full on-site day price (PER_DAY)" }
      - { name: scan_rate_cents, type: integer, source: input, description: "Per-scan price within quota (PER_SCAN)" }
      - { name: included_scan_quota, type: integer, source: input, description: "Scans per day billed at scan_rate before overage rate applies" }
      - { name: overage_scan_rate_cents, type: integer, source: input, description: "Per-scan price beyond included_scan_quota" }
      - { name: guaranteed_minimum_cents, type: integer, source: input, description: "PER_SCAN floor when a held day completes zero scans" }
      - { name: no_show_fee_cents, type: integer, source: input, description: "Fee per NO_SHOW appointment (PER_SCAN)" }
      - { name: cancel_notice_hours, type: integer, source: input, description: "Cancel with notice_hours < this is a late cancel" }
      - { name: cancel_late_pct, type: number, source: input, description: "Fraction of day_rate (PER_DAY) or guaranteed_minimum (PER_SCAN) charged on late cancel" }
      - { name: monthly_scan_cap, type: integer, source: input, description: "Max bookable non-cancelled appointments per calendar month under this contract" }
      - { name: interruption_floor_cents, type: integer, source: input, description: "Minimum charge when a PER_DAY site day is interrupted" }

  - name: RoutePlan
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> MobileImagingUnit.id; unit this week plan routes" }
      - { name: week_start_date, type: string, source: input, description: "Monday YYYY-MM-DD; plan covers [week_start, week_start+6] inclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | CLOSED | SUPERSEDED (state machine)" }
      - { name: supersedes_plan_id, type: string, source: system, description: "FK -> RoutePlan.id; prior DRAFT plan superseded by this creation, null when none", default: null }
      - { name: site_day_count, type: integer, source: computed, description: "Count of SiteDayAssignments with route_plan_id == this plan in any status", default: 0 }
      - { name: total_travel_stipend_cents, type: integer, source: computed, description: "Sum of TransportLeg.stipend_cents over this plan's site days (per-leg rounding, then sum)", default: 0 }

  - name: SiteDayAssignment
    parent: null
    common_fields: true
    fields:
      - { name: route_plan_id, type: string, source: input, description: "FK -> RoutePlan.id; week plan containing this day" }
      - { name: unit_id, type: string, source: system, description: "FK -> MobileImagingUnit.id; denormalized from route plan at creation" }
      - { name: facility_id, type: string, source: input, description: "FK -> ContractedFacility.id; host site for the day" }
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id; billing terms; contract.facility_id must equal facility_id" }
      - { name: service_date, type: string, source: input, description: "YYYY-MM-DD within the plan week and not before the current clock date" }
      - { name: arrival_time, type: string, source: input, description: "HH:MM UTC planned arrival" }
      - { name: first_patient_time, type: string, source: input, description: "HH:MM UTC service window open; must be >= arrival_time + unit.setup_minutes" }
      - { name: last_patient_time, type: string, source: input, description: "HH:MM UTC service window close (inclusive); departure_time must be >= last_patient_time + unit.teardown_minutes" }
      - { name: departure_time, type: string, source: input, description: "HH:MM UTC planned departure" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | SETTING_UP | READY | IN_SERVICE | COMPLETED | CANCELLED | INTERRUPTED | RESCHEDULED (state machine)" }
      - { name: cancel_reason, type: string, source: system, description: "FACILITY_CANCEL | ACCREDITATION_EXPIRED | PROVIDER_CANCEL, null unless CANCELLED", default: null }
      - { name: interrupt_reason, type: string, source: system, description: "BREAKDOWN | OPERATOR_INTERRUPT, null unless INTERRUPTED/RESCHEDULED", default: null }
      - { name: delivered_service_minutes, type: integer, source: computed, description: "On interrupt: clamp(clock - first_patient_time, 0, planned window minutes); on complete: full planned window minutes", default: 0 }
      - { name: rescheduled_from_id, type: string, source: system, description: "FK -> SiteDayAssignment.id; interrupted source day this day replaces (self-referential), null when none", default: null }
      - { name: rescheduled_to_id, type: string, source: system, description: "FK -> SiteDayAssignment.id; replacement day created by reschedule, null when none", default: null }

  - name: PatientAppointment
    parent: null
    common_fields: true
    fields:
      - { name: site_day_id, type: string, source: input, description: "FK -> SiteDayAssignment.id; on-site day hosting the scan" }
      - { name: patient_ref, type: string, source: input, description: "Opaque patient identifier from the facility EMR" }
      - { name: exam_type, type: enum, source: input, description: "CT_HEAD | CT_CHEST | MRI_BRAIN | PET_ONCO; modality prefix must match the day's unit modality" }
      - { name: scheduled_start, type: string, source: input, description: "HH:MM UTC scan start on the site day's service_date" }
      - { name: duration_minutes, type: integer, source: input, description: "Scanner occupancy minutes (positive)" }
      - { name: sedation_required, type: boolean, source: input, description: "Adds SEDATION_BUFFER_MINUTES (15) to effective occupied time", default: false }
      - { name: estimated_dose_msv, type: number, source: input, description: "Projected radiation dose; feeds staffing dose gate" }
      - { name: insurance_preauth, type: string, source: input, description: "Preauthorization reference", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CHECKED_IN | SCANNING | COMPLETED | CANCELLED | NO_SHOW (state machine)" }
      - { name: cancel_reason, type: string, source: system, description: "PATIENT_CANCELLED | DAY_CANCELLED | DAY_INTERRUPTED, null unless CANCELLED", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp stamped by complete-scan; null until COMPLETED", default: null }
      - { name: actual_dose_msv, type: number, source: computed, description: "Sum of RadiationDoseRecord.dose_msv for this appointment", default: 0 }

  - name: Technologist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technologist name" }
      - { name: modality_certs, type: array, source: input, description: "Certified modalities: subset of MRI | CT | PET" }
      - { name: home_base_name, type: string, source: input, description: "Home depot for travel estimation" }
      - { name: max_daily_drive_minutes, type: integer, source: input, description: "Maximum one-way drive minutes the technologist accepts per day" }
      - { name: current_day_dose_msv, type: number, source: computed, description: "Sum of dose_msv over RadiationDoseRecords by this technologist whose appointment's site day service_date equals the logical clock date", default: 0 }
      - { name: monthly_dose_msv, type: number, source: computed, description: "Sum of dose_msv over this technologist's records in the logical clock's calendar month", default: 0 }

  - name: StaffingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: site_day_id, type: string, source: input, description: "FK -> SiteDayAssignment.id; day being staffed" }
      - { name: technologist_id, type: string, source: input, description: "FK -> Technologist.id; assigned technologist" }
      - { name: estimated_drive_minutes, type: integer, source: input, description: "One-way home-to-site drive estimate; must be <= technologist.max_daily_drive_minutes" }
      - { name: projected_dose_msv, type: number, source: computed, description: "technologist.current_day_dose_msv (relative to the day service_date) + sum of estimated_dose_msv over the day's appointments in {REQUESTED, CONFIRMED, CHECKED_IN, SCANNING}", default: 0 }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED (state machine)" }
      - { name: release_reason, type: string, source: system, description: "MANUAL | DAY_COMPLETED | DAY_CANCELLED | DAY_INTERRUPTED, null while ASSIGNED", default: null }

  - name: TransportLeg
    parent: null
    common_fields: true
    fields:
      - { name: site_day_id, type: string, source: input, description: "FK -> SiteDayAssignment.id; day this leg transports the unit to" }
      - { name: origin_name, type: string, source: input, description: "Origin depot or prior site" }
      - { name: destination_name, type: string, source: input, description: "Destination site" }
      - { name: distance_miles, type: number, source: input, description: "Road miles, up to 2 decimal places" }
      - { name: drive_minutes, type: integer, source: input, description: "Estimated drive minutes" }
      - { name: overnight, type: boolean, source: input, description: "True when the crew stays overnight before this leg", default: false }
      - { name: stipend_cents, type: integer, source: computed, description: "round_half_up(distance_miles * MILEAGE_RATE_CENTS) + (overnight ? PER_DIEM_CENTS : 0); rounded per leg before summing", default: 0 }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | ARRIVED | FAILED | CANCELLED (state machine)" }

  - name: SetupChecklist
    parent: null
    common_fields: true
    fields:
      - { name: site_day_id, type: string, source: input, description: "FK -> SiteDayAssignment.id; exactly one checklist per site day" }
      - { name: power_verify_passed, type: boolean, source: input, description: "Shore power verification result" }
      - { name: measured_amps, type: integer, source: input, description: "Measured pad amperage at hookup; mark-ready requires >= unit.power_required_amps" }
      - { name: pad_level_passed, type: boolean, source: input, description: "Pad levelness within tolerance" }
      - { name: chiller_passed, type: boolean, source: input, description: "Chiller/cooling loop result" }
      - { name: rf_shield_passed, type: boolean, source: input, description: "RF shield / magnetic containment result" }
      - { name: network_link_passed, type: boolean, source: input, description: "Uplink link verification result" }
      - { name: measured_uplink_mbps, type: integer, source: input, description: "Measured uplink; image transfer budget = floor(measured_uplink_mbps * 7.5) MB" }
      - { name: status, type: enum, source: computed, description: "ALL_PASSED when all five boolean checks are true, else HAS_FAILURES when any false, IN_PROGRESS before any record" }

  - name: BreakdownEvent
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> MobileImagingUnit.id; unit that failed" }
      - { name: site_day_id, type: string, source: input, description: "FK -> SiteDayAssignment.id; day in progress when the failure occurred, null if off-duty", default: null }
      - { name: severity, type: enum, source: input, description: "MINOR (day continues) | MAJOR (day interrupted) | CRITICAL (day interrupted + unit OUT_OF_SERVICE)" }
      - { name: description, type: string, source: input, description: "Failure description" }
      - { name: status, type: enum, source: system, description: "REPORTED | RESOLVED (state machine)" }
      - { name: downtime_hours, type: number, source: input, description: "Repair duration recorded at resolve" }
      - { name: resolution_notes, type: string, source: input, description: "Fix notes recorded at resolve" }

  - name: RadiationDoseRecord
    parent: null
    common_fields: false
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> PatientAppointment.id; scanned appointment (must be COMPLETED)" }
      - { name: technologist_id, type: string, source: input, description: "FK -> Technologist.id; recording technologist (must equal X-User-ID and be staffed on the day)" }
      - { name: dose_msv, type: number, source: input, description: "Delivered dose in mSv" }
      - { name: drl_exceeded, type: boolean, source: computed, description: "True when dose_msv > DRL_MSV[exam_type] (strictly greater)", default: false }

  - name: AccreditationRecord
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> MobileImagingUnit.id; accredited unit" }
      - { name: accrediting_body, type: enum, source: input, description: "ACR | IAC | TJC" }
      - { name: modality, type: enum, source: input, description: "MRI | CT | PET; governing record matches the unit's modality" }
      - { name: issued_on, type: string, source: input, description: "YYYY-MM-DD issue date" }
      - { name: expires_on, type: string, source: input, description: "YYYY-MM-DD expiry; status derives from this vs logical clock" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRING_SOON | EXPIRED | SUSPENDED (state machine; clock-driven derivation)" }
      - { name: suspend_reason, type: string, source: system, description: "Audit finding recorded on suspend, null otherwise", default: null }

  - name: BillingStatement
    parent: null
    common_fields: true
    fields:
      - { name: site_day_id, type: string, source: system, description: "FK -> SiteDayAssignment.id; exactly one statement per site day, auto-created on complete/cancel/interrupt" }
      - { name: contract_id, type: string, source: system, description: "FK -> ServiceContract.id; copied from the site day" }
      - { name: billing_model_snapshot, type: enum, source: system, description: "PER_DAY | PER_SCAN pinned from the contract at statement creation" }
      - { name: completed_scan_count, type: integer, source: computed, description: "Appointments of the day in COMPLETED status", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Appointments of the day in NO_SHOW status", default: 0 }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Provisional variant: counts all COMPLETED appointments as billable" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Final variant at finalize: PER_SCAN counts only COMPLETED appointments whose ImageStudy is DELIVERED or ACKNOWLEDGED; null until FINALIZED", default: null }
      - { name: credit_granted_cents, type: integer, source: computed, description: "PER_DAY interrupted source day: day_rate_cents - provisional net; carried to the replacement day's statement", default: 0 }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Credit carried in from the linked interrupted source day (rescheduled_from chain)", default: 0 }
      - { name: net_due_cents, type: integer, source: computed, description: "final_amount_cents - credit_applied_cents once FINALIZED; equals provisional_amount_cents - credit_applied_cents while PROVISIONAL" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | DISPUTED | INVOICED | PAID (state machine)" }

  - name: ImageStudy
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> PatientAppointment.id; source scan (must be COMPLETED)" }
      - { name: study_uid, type: string, source: input, description: "DICOM StudyInstanceUID" }
      - { name: size_mb, type: integer, source: input, description: "Study payload size; delivery succeeds iff size_mb <= floor(uplink_mbps * 7.5)" }
      - { name: transfer_attempts, type: integer, source: system, description: "Number of transmit calls that left QUEUED", default: 0 }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock time of first DELIVERED transition; null until delivered", default: null }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical-clock time of ACKNOWLEDGED transition; null until acked", default: null }
      - { name: sla_breached, type: boolean, source: computed, description: "At acknowledge: (acknowledged_at - appointment.completed_at) > TRANSFER_SLA_MINUTES (120)", default: false }
      - { name: status, type: enum, source: system, description: "QUEUED | TRANSMITTING | DELIVERED | TRANSFER_FAILED | ACKNOWLEDGED (state machine)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: MobileImagingUnit
    initial_state: ACTIVE_SERVICE
    terminal_states: []
    transitions:
      - from: ACTIVE_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /api/breakdowns with severity=CRITICAL"
        actor: Technologist | OperationsDirector
        preconditions:
          - "Unit is ACTIVE_SERVICE (ERR_UNIT_OUT_OF_SERVICE if already OUT_OF_SERVICE)"
        side_effects:
          - "unit.active_breakdown_id = new BreakdownEvent.id"
          - "If breakdown.site_day_id names a day in SETTING_UP/READY/IN_SERVICE: that day -> INTERRUPTED (see SiteDayAssignment INTERRUPTED side effects, hop 2 of the cascade)"
      - from: ACTIVE_SERVICE
        to: MAINTENANCE
        trigger: "POST /api/units/{id}/maintenance"
        actor: OperationsDirector
        preconditions:
          - "Unit is ACTIVE_SERVICE (ERR_INVALID_STATE)"
          - "No site day for this unit in {EN_ROUTE, SETTING_UP, READY, IN_SERVICE} (ERR_UNIT_HAS_ACTIVE_DAY)"
        side_effects: []
      - from: MAINTENANCE
        to: ACTIVE_SERVICE
        trigger: "POST /api/units/{id}/return-to-service"
        actor: OperationsDirector
        preconditions:
          - "Unit is MAINTENANCE (ERR_INVALID_STATE)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: ACTIVE_SERVICE
        trigger: "POST /api/breakdowns/{id}/resolve on the unit's active_breakdown_id"
        actor: OperationsDirector
        preconditions:
          - "BreakdownEvent is REPORTED (ERR_BREAKDOWN_ALREADY_RESOLVED)"
        side_effects:
          - "unit.active_breakdown_id = null"

  - entity: RoutePlan
    initial_state: DRAFT
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when POST /api/route-plans creates a new plan for the same unit_id + week_start_date while this plan is DRAFT)"
        actor: system
        preconditions:
          - "Existing plan for (unit_id, week_start_date) is DRAFT; if it is PUBLISHED or LOCKED the creation instead fails with ERR_PLAN_WEEK_CONFLICT"
        side_effects:
          - "new plan.supersedes_plan_id = this plan.id"
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/route-plans/{id}/publish"
        actor: OperationsDirector
        preconditions:
          - "Plan is DRAFT (ERR_PLAN_NOT_PUBLISHED)"
          - "site_day_count >= 1 (ERR_EMPTY_ROUTE_PLAN)"
        side_effects: []
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /api/route-plans/{id}/unpublish"
        actor: OperationsDirector
        preconditions:
          - "Plan is PUBLISHED (ERR_PLAN_NOT_PUBLISHED)"
          - "Every site day is in {SCHEDULED, CANCELLED} (ERR_PLAN_HAS_ACTIVE_DAYS)"
        side_effects: []
        note: "Cycle DRAFT -> PUBLISHED -> DRAFT allowed"
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /api/route-plans/{id}/lock"
        actor: OperationsDirector
        preconditions:
          - "Plan is PUBLISHED (ERR_PLAN_NOT_PUBLISHED)"
        side_effects: []
      - from: LOCKED
        to: CLOSED
        trigger: "POST /api/route-plans/{id}/close"
        actor: OperationsDirector
        preconditions:
          - "Plan is LOCKED (ERR_PLAN_NOT_LOCKED)"
          - "Every site day is terminal: COMPLETED | CANCELLED | RESCHEDULED (ERR_PLAN_HAS_ACTIVE_DAYS)"
        side_effects: []

  - entity: SiteDayAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, RESCHEDULED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /api/site-days/{id}/depart"
        actor: OperationsDirector
        preconditions:
          - "Day is SCHEDULED (ERR_INVALID_STATE)"
          - "Governing accreditation for the unit is in {ACTIVE, EXPIRING_SOON} (ERR_ACCREDITATION_NOT_VALID)"
        side_effects:
          - "Each TransportLeg of the day in PLANNED -> DISPATCHED"
      - from: EN_ROUTE
        to: SETTING_UP
        trigger: "POST /api/site-days/{id}/begin-setup"
        actor: OperationsDirector
        preconditions:
          - "Day is EN_ROUTE (ERR_INVALID_STATE)"
          - "Every TransportLeg of the day is ARRIVED (ERR_TRANSPORT_NOT_ARRIVED)"
        side_effects: []
      - from: SETTING_UP
        to: READY
        trigger: "POST /api/site-days/{id}/mark-ready"
        actor: OperationsDirector
        preconditions:
          - "Day is SETTING_UP (ERR_INVALID_STATE)"
          - "The day's SetupChecklist exists and status == ALL_PASSED (ERR_CHECKLIST_INCOMPLETE)"
          - "checklist.measured_amps >= unit.power_required_amps (ERR_PAD_POWER_INSUFFICIENT)"
          - "Governing accreditation status in {ACTIVE, EXPIRING_SOON} (ERR_ACCREDITATION_NOT_VALID)"
        side_effects: []
      - from: READY
        to: IN_SERVICE
        trigger: "POST /api/site-days/{id}/start-service"
        actor: OperationsDirector
        preconditions:
          - "Day is READY (ERR_INVALID_STATE)"
          - "At least one StaffingAssignment for the day in ASSIGNED (ERR_NO_STAFF_ASSIGNED)"
        side_effects: []
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /api/site-days/{id}/complete"
        actor: OperationsDirector
        preconditions:
          - "Day is IN_SERVICE (ERR_INVALID_STATE)"
          - "Every appointment is terminal: COMPLETED | CANCELLED | NO_SHOW (ERR_OPEN_APPOINTMENTS)"
        side_effects:
          - "delivered_service_minutes = planned window minutes (last_patient_time - first_patient_time)"
          - "All StaffingAssignments ASSIGNED -> RELEASED (release_reason DAY_COMPLETED)"
          - "Auto-create BillingStatement (PROVISIONAL) via site_day_billing_amount, provisional variant"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/site-days/{id}/cancel"
        actor: OperationsDirector | FacilityCoordinator
        preconditions:
          - "Day is SCHEDULED or EN_ROUTE (ERR_INVALID_STATE)"
        side_effects:
          - "cancel_reason = FACILITY_CANCEL; appointments in {REQUESTED, CONFIRMED, CHECKED_IN} -> CANCELLED (cancel_reason DAY_CANCELLED)"
          - "StaffingAssignments ASSIGNED -> RELEASED (release_reason DAY_CANCELLED)"
          - "TransportLegs PLANNED -> CANCELLED; DISPATCHED -> FAILED"
          - "Auto-create BillingStatement (PROVISIONAL) with cancellation fee per contract (late when notice_hours < contract.cancel_notice_hours)"
      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /api/site-days/{id}/cancel"
        actor: OperationsDirector | FacilityCoordinator
        preconditions:
          - "Day is SCHEDULED or EN_ROUTE (ERR_INVALID_STATE)"
        side_effects:
          - "Same side-effect set as SCHEDULED -> CANCELLED"
      - from: SETTING_UP
        to: INTERRUPTED
        trigger: "POST /api/site-days/{id}/interrupt, or cascade from POST /api/breakdowns severity MAJOR|CRITICAL naming this day"
        actor: OperationsDirector | system
        preconditions:
          - "Day is SETTING_UP, READY, or IN_SERVICE (ERR_INVALID_STATE)"
        side_effects:
          - "interrupt_reason = BREAKDOWN | OPERATOR_INTERRUPT"
          - "delivered_service_minutes = clamp(clock - first_patient_time, 0, planned window minutes)"
          - "Appointments in {REQUESTED, CONFIRMED, CHECKED_IN, SCANNING} -> CANCELLED (cancel_reason DAY_INTERRUPTED)  [hop: day -> appointments]"
          - "StaffingAssignments ASSIGNED -> RELEASED (release_reason DAY_INTERRUPTED)"
          - "TransportLegs DISPATCHED -> FAILED"
          - "Auto-create BillingStatement (PROVISIONAL) via site_day_billing_amount, provisional variant  [hop: day -> statement]"
      - from: READY
        to: INTERRUPTED
        trigger: "same as SETTING_UP -> INTERRUPTED"
        actor: OperationsDirector | system
        preconditions:
          - "Day is SETTING_UP, READY, or IN_SERVICE (ERR_INVALID_STATE)"
        side_effects: ["Same side-effect set as SETTING_UP -> INTERRUPTED"]
      - from: IN_SERVICE
        to: INTERRUPTED
        trigger: "same as SETTING_UP -> INTERRUPTED"
        actor: OperationsDirector | system
        preconditions:
          - "Day is SETTING_UP, READY, or IN_SERVICE (ERR_INVALID_STATE)"
        side_effects: ["Same side-effect set as SETTING_UP -> INTERRUPTED"]
      - from: INTERRUPTED
        to: RESCHEDULED
        trigger: "POST /api/site-days/{id}/reschedule"
        actor: OperationsDirector
        preconditions:
          - "Day is INTERRUPTED (ERR_RESCHEDULE_SOURCE_INVALID)"
          - "target_route_plan_id exists, is PUBLISHED, and belongs to the same unit (ERR_RESCHEDULE_TARGET_INVALID)"
          - "new_service_date >= clock date, inside target plan week, and passes the unit day-exclusivity rule (ERR_UNIT_DAY_DOUBLE_BOOKED)"
          - "expected_route_plan_version == target plan.version (ERR_STALE_ROUTE_PLAN_VERSION, 412, checked before business rules)"
        side_effects:
          - "Create replacement SiteDayAssignment (SCHEDULED) in target plan with same facility_id/contract_id, rescheduled_from_id = source id"
          - "source.rescheduled_to_id = replacement id"
          - "Replacement day's eventual BillingStatement carries credit_applied_cents = source statement.credit_granted_cents"
          - "target plan.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (automatic when the unit's governing accreditation becomes EXPIRED and this day's service_date > clock date)"
        actor: system
        preconditions:
          - "Accreditation status flipped to EXPIRED via POST /api/_clock/set_current_utc"
        side_effects:
          - "cancel_reason = ACCREDITATION_EXPIRED; appointments in {REQUESTED, CONFIRMED} -> CANCELLED (cancel_reason DAY_CANCELLED)  [hop: accreditation -> day -> appointments]"
          - "No cancellation fee: auto-create BillingStatement (PROVISIONAL) with amount 0"

  - entity: PatientAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/appointments/{id}/confirm"
        actor: OperationsDirector
        preconditions:
          - "Appointment is REQUESTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /api/appointments/{id}/check-in"
        actor: FacilityCoordinator
        preconditions:
          - "Appointment is CONFIRMED (ERR_INVALID_STATE)"
          - "Site day is READY or IN_SERVICE (ERR_SITE_DAY_NOT_IN_SERVICE)"
        side_effects: []
      - from: CHECKED_IN
        to: SCANNING
        trigger: "POST /api/appointments/{id}/begin-scan"
        actor: Technologist
        preconditions:
          - "Appointment is CHECKED_IN (ERR_INVALID_STATE)"
          - "Site day is IN_SERVICE (ERR_SITE_DAY_NOT_IN_SERVICE)"
          - "Acting technologist (X-User-ID) holds an ASSIGNED StaffingAssignment on the site day (ERR_TECHNOLOGIST_NOT_STAFFED)"
        side_effects: []
      - from: SCANNING
        to: COMPLETED
        trigger: "POST /api/appointments/{id}/complete-scan"
        actor: Technologist
        preconditions:
          - "Appointment is SCANNING (ERR_INVALID_STATE)"
          - "Acting technologist holds an ASSIGNED StaffingAssignment on the site day (ERR_TECHNOLOGIST_NOT_STAFFED)"
        side_effects:
          - "completed_at = logical clock"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/appointments/{id}/cancel or day-level cascade"
        actor: FacilityCoordinator | system
        preconditions:
          - "Appointment is REQUESTED or CONFIRMED (ERR_APPOINTMENT_NOT_CANCELLABLE); cascade may also cancel CHECKED_IN/SCANNING"
        side_effects:
          - "cancel_reason = PATIENT_CANCELLED (manual) | DAY_CANCELLED | DAY_INTERRUPTED (cascade)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/appointments/{id}/cancel or day-level cascade"
        actor: FacilityCoordinator | system
        preconditions:
          - "Appointment is REQUESTED or CONFIRMED (ERR_APPOINTMENT_NOT_CANCELLABLE)"
        side_effects: ["cancel_reason set as above"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/appointments/{id}/mark-no-show"
        actor: FacilityCoordinator
        preconditions:
          - "Appointment is CONFIRMED (ERR_INVALID_STATE)"
          - "Site day is IN_SERVICE (ERR_SITE_DAY_NOT_IN_SERVICE)"
        side_effects: []

  - entity: StaffingAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /api/staffing-assignments/{id}/release, or day cascade (complete/cancel/interrupt)"
        actor: OperationsDirector | system
        preconditions:
          - "Assignment is ASSIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "release_reason = MANUAL | DAY_COMPLETED | DAY_CANCELLED | DAY_INTERRUPTED"

  - entity: TransportLeg
    initial_state: PLANNED
    terminal_states: [ARRIVED, FAILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "system (cascade from POST /api/site-days/{id}/depart)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: ARRIVED
        trigger: "POST /api/transport-legs/{id}/arrive"
        actor: Technologist | OperationsDirector
        preconditions:
          - "Leg is DISPATCHED (ERR_INVALID_STATE)"
        side_effects: []
      - from: DISPATCHED
        to: FAILED
        trigger: "system (cascade from day cancel or interrupt)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade from day cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SetupChecklist
    initial_state: IN_PROGRESS
    terminal_states: []
    transitions:
      - from: IN_PROGRESS
        to: ALL_PASSED
        trigger: "system (recompute on POST /api/setup-checklists or POST /api/setup-checklists/{id}/record-item)"
        actor: system
        preconditions: ["All five boolean items true"]
        side_effects: []
      - from: IN_PROGRESS
        to: HAS_FAILURES
        trigger: "system (recompute on create/record-item)"
        actor: system
        preconditions: ["Any boolean item false"]
        side_effects: []
      - from: HAS_FAILURES
        to: ALL_PASSED
        trigger: "system (recompute on record-item overwriting the failing item to passed=true)"
        actor: system
        preconditions: ["All five boolean items true after update"]
        side_effects: []
        note: "Cycle: failed items may be re-recorded until all pass"

  - entity: BreakdownEvent
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /api/breakdowns/{id}/resolve"
        actor: OperationsDirector
        preconditions:
          - "Breakdown is REPORTED (ERR_BREAKDOWN_ALREADY_RESOLVED)"
        side_effects:
          - "If severity == CRITICAL and this is the unit's active_breakdown_id: unit -> ACTIVE_SERVICE, unit.active_breakdown_id = null"

  - entity: AccreditationRecord
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRING_SOON
        trigger: "system (POST /api/_clock/set_current_utc when 0 <= expires_on - clock_date <= 30 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc when expires_on < clock_date)"
        actor: system
        preconditions: []
        side_effects:
          - "If this is the governing record for its unit: cascade — each SCHEDULED SiteDayAssignment for the unit with service_date > clock date -> CANCELLED (cancel_reason ACCREDITATION_EXPIRED); their {REQUESTED, CONFIRMED} appointments -> CANCELLED (DAY_CANCELLED); zero-fee PROVISIONAL statements created"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/accreditations/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Record is ACTIVE or EXPIRING_SOON (ERR_INVALID_STATE)"
        side_effects: []
      - from: EXPIRING_SOON
        to: SUSPENDED
        trigger: "POST /api/accreditations/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Record is ACTIVE or EXPIRING_SOON (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/accreditations/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "Record is SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Landing state re-derived from clock: ACTIVE if expires_on - clock_date > 30, EXPIRING_SOON if 0 <= delta <= 30, EXPIRED if expires_on < clock_date"
        note: "Cycle: ACTIVE/EXPIRING_SOON <-> SUSPENDED via suspend/reinstate"

  - entity: BillingStatement
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /api/billing-statements/{id}/finalize"
        actor: OperationsDirector
        preconditions:
          - "Statement is PROVISIONAL (ERR_STATEMENT_NOT_FINALIZABLE)"
        side_effects:
          - "final_amount_cents recomputed via site_day_billing_amount, final variant (PER_SCAN: only COMPLETED appointments with ImageStudy in {DELIVERED, ACKNOWLEDGED} are billable)"
          - "net_due_cents = final_amount_cents - credit_applied_cents"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /api/billing-statements/{id}/dispute"
        actor: FacilityCoordinator
        preconditions:
          - "Statement is FINALIZED (ERR_INVALID_STATE)"
          - "Acting coordinator's facility_id == statement's site day facility_id (ERR_FACILITY_MISMATCH)"
        side_effects: []
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /api/billing-statements/{id}/resolve-dispute"
        actor: OperationsDirector
        preconditions:
          - "Statement is DISPUTED (ERR_INVALID_STATE)"
        side_effects:
          - "resolution=UPHOLD: amounts unchanged; resolution=ADJUST: final_amount_cents = adjusted_amount_cents input and net_due_cents recomputed"
        note: "Cycle FINALIZED -> DISPUTED -> FINALIZED"
      - from: FINALIZED
        to: INVOICED
        trigger: "POST /api/billing-statements/{id}/invoice"
        actor: OperationsDirector
        preconditions:
          - "Statement is FINALIZED (ERR_INVALID_STATE)"
        side_effects: []
      - from: INVOICED
        to: PAID
        trigger: "POST /api/billing-statements/{id}/mark-paid"
        actor: OperationsDirector
        preconditions:
          - "Statement is INVOICED (ERR_INVALID_STATE)"
          - "paid_amount_cents == net_due_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects: []

  - entity: ImageStudy
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: QUEUED
        to: DELIVERED
        trigger: "POST /api/image-studies/{id}/transmit"
        actor: Technologist
        preconditions:
          - "Study is QUEUED (ERR_STUDY_NOT_TRANSFERRABLE)"
          - "size_mb <= floor(site day's checklist.measured_uplink_mbps * 7.5) — deterministic transfer budget"
        side_effects:
          - "transfer_attempts += 1; delivered_at = logical clock"
        note: "Atomic transmit: passes through TRANSMITTING within the call; lands DELIVERED or TRANSFER_FAILED by the budget rule"
      - from: QUEUED
        to: TRANSFER_FAILED
        trigger: "POST /api/image-studies/{id}/transmit (size_mb over transfer budget)"
        actor: Technologist
        preconditions:
          - "Study is QUEUED (ERR_STUDY_NOT_TRANSFERRABLE)"
        side_effects:
          - "transfer_attempts += 1"
      - from: TRANSFER_FAILED
        to: QUEUED
        trigger: "POST /api/image-studies/{id}/retry"
        actor: Technologist
        preconditions:
          - "Study is TRANSFER_FAILED (ERR_STUDY_NOT_TRANSFERRABLE)"
        side_effects: []
        note: "Retry cycle QUEUED -> TRANSFER_FAILED -> QUEUED"
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /api/image-studies/{id}/acknowledge"
        actor: ReadingRadiologist
        preconditions:
          - "Study is DELIVERED (ERR_INVALID_STATE)"
        side_effects:
          - "acknowledged_at = logical clock; sla_breached = (acknowledged_at - appointment.completed_at) > 120 minutes"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: route-plan-create-stale-unit
    parent_entity: MobileImagingUnit
    write_endpoint: "POST /api/route-plans"
    occ_field: expected_unit_version
    description: |
      Creating a RoutePlan against a MobileImagingUnit whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a plan for the same unit+week (which
      legitimately supersedes the prior DRAFT plan) and the current writer's view
      of the unit is therefore stale.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
  - rule_id: site-day-reschedule-stale-plan
    parent_entity: RoutePlan
    write_endpoint: "POST /api/site-days/{id}/reschedule"
    occ_field: expected_route_plan_version
    description: |
      Rescheduling an interrupted SiteDayAssignment into a target RoutePlan whose
      version has advanced since the client last observed it is rejected, because
      the target plan's day roster may have changed under the client's feet.
    error_id: ERR_STALE_ROUTE_PLAN_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: site_day_billing_amount
    description: "Provisional and final charge for one site day; the variant is selected by the contract's billing_model, and the provisional/final axis selects the billable scan set"
    trigger: "SiteDayAssignment -> COMPLETED / CANCELLED / INTERRUPTED (provisional); POST /api/billing-statements/{id}/finalize (final)"
    algorithm: tiered_pricing
    input_set: "Appointments of the site day; provisional billable set = status COMPLETED; final billable set (PER_SCAN) = COMPLETED whose ImageStudy.status in {DELIVERED, ACKNOWLEDGED} at finalize time; no_show set = status NO_SHOW"
    formula: |
      planned_window_min = last_patient_time - first_patient_time
      PER_DAY variant:
        COMPLETED day:  amount = day_rate_cents
        INTERRUPTED day: frac = delivered_service_minutes / planned_window_min
                         amount = max(interruption_floor_cents, round_half_up(day_rate_cents * frac))
                         credit_granted_cents = day_rate_cents - amount
        CANCELLED day:  late (notice_hours < cancel_notice_hours): amount = round_half_up(day_rate_cents * cancel_late_pct)
                        provider-caused (ACCREDITATION_EXPIRED) or early: amount = 0
      PER_SCAN variant:
        charge = min(billable, included_scan_quota) * scan_rate_cents
               + max(0, billable - included_scan_quota) * overage_scan_rate_cents
               + no_show_count * no_show_fee_cents
        if day reached READY at least once and billable == 0: charge = max(charge, guaranteed_minimum_cents)
        CANCELLED late: charge = round_half_up(guaranteed_minimum_cents * cancel_late_pct); early/provider: 0
      Replacement-day credit: statement.credit_applied_cents = source interrupted statement.credit_granted_cents
      net_due_cents = (final_amount_cents if FINALIZED+ else provisional_amount_cents) - credit_applied_cents
    constants:
      ROUNDING: "round_half_up to whole cents"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Statement auto-created at day close (COMPLETED/CANCELLED/INTERRUPTED)"
        difference: "PER_SCAN billable set counts every COMPLETED appointment regardless of image delivery"
      - name: final
        when: "POST /api/billing-statements/{id}/finalize"
        difference: "PER_SCAN billable set counts only COMPLETED appointments whose ImageStudy is DELIVERED or ACKNOWLEDGED; scans without delivered images drop out"
      - name: per_day_vs_per_scan
        when: "contract.billing_model pinned at statement creation (billing_model_snapshot)"
        difference: "Identical day outcomes price as a flat day rate (with interruption pro-rating) vs a per-scan tiered amount with quota, overage, no-show fees, and a zero-scan floor"

  - name: technologist_dose_projection
    description: "Staffing-time dose gate; prospective vs retrospective dose for the same appointment set"
    trigger: "POST /api/staffing-assignments (projected); POST /api/dose-records (actual recompute)"
    algorithm: aggregation
    input_set: "projected: technologist's RadiationDoseRecords on appointments whose site day service_date == target day service_date, PLUS target day's appointments in {REQUESTED, CONFIRMED, CHECKED_IN, SCANNING} (estimated_dose_msv); actual: only RadiationDoseRecords"
    formula: |
      projected_dose_msv = sum(dose_msv of technologist's dose records dated on the target service_date)
                         + sum(estimated_dose_msv of target day's appointments in {REQUESTED, CONFIRMED, CHECKED_IN, SCANNING})
      Gate at staffing creation: reject when projected_dose_msv > TECH_DAILY_DOSE_LIMIT_MSV
      (strictly greater; projected == limit is allowed)
      actual current_day_dose_msv = sum of dose records whose appointment's site day service_date == logical clock date
    constants:
      TECH_DAILY_DOSE_LIMIT_MSV: 5.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: prospective
        when: "Staffing assignment creation"
        difference: "Uses estimated_dose_msv of not-yet-scanned appointments; blocks the assignment when over the limit"
      - name: retrospective
        when: "After dose records are posted"
        difference: "Uses recorded dose_msv only; drives Technologist.current_day_dose_msv / monthly_dose_msv"

  - name: route_travel_stipend
    description: "Per-leg mileage stipend with pinned per-leg rounding order"
    trigger: "POST /api/transport-legs (per leg); RoutePlan.total_travel_stipend_cents recomputed on every leg create"
    algorithm: aggregation
    input_set: "All TransportLegs of the plan's site days in any status (FAILED/CANCELLED legs keep their stipend — cost was committed at dispatch planning)"
    formula: |
      per leg: stipend_cents = round_half_up(distance_miles * MILEAGE_RATE_CENTS) + (overnight ? PER_DIEM_CENTS : 0)
      plan total: total_travel_stipend_cents = sum of per-leg stipend_cents
      PINNED ORDER: round each leg to whole cents FIRST, then sum.
      (Sum-then-round produces different cents and is non-conformant.)
    constants:
      MILEAGE_RATE_CENTS: 67
      PER_DIEM_CENTS: 15000
    precision: "integer cents, round_half_up per leg"

  - name: contract_period_invoice_total
    description: "Monthly contract rollup with volume discount; evaluation order pinned to break the gross/discount circularity"
    trigger: "GET /api/contracts/{id}/period-invoice?month=YYYY-MM"
    algorithm: tiered_pricing
    input_set: "BillingStatements with contract_id == id, status in {FINALIZED, INVOICED, PAID}, whose site day service_date falls inside the month (inclusive both ends)"
    formula: |
      PINNED EVALUATION ORDER (circularity breaker):
      1. gross_cents = sum(net_due_cents of included statements)
      2. tier_pct selected by GROSS (not net): gross >= TIER2_MIN_CENTS -> 8; elif gross >= TIER1_MIN_CENTS -> 5; else 0
      3. discount_cents = round_half_up(gross_cents * tier_pct / 100)
      4. net_cents = gross_cents - discount_cents
    constants:
      TIER1_MIN_CENTS: 500000
      TIER2_MIN_CENTS: 1000000
      TIER1_PCT: 5
      TIER2_PCT: 8
    precision: "integer cents, round_half_up"

  - name: appointment_window_and_overlap
    description: "Slot feasibility inside the on-site window with turnover buffer overlap semantics"
    trigger: "POST /api/appointments"
    algorithm: interval_merge
    input_set: "Existing appointments of the same site day in {REQUESTED, CONFIRMED, CHECKED_IN, SCANNING} (COMPLETED, CANCELLED, NO_SHOW excluded); effective duration = duration_minutes + (sedation_required ? SEDATION_BUFFER_MINUTES : 0)"
    formula: |
      eff_end(a) = a.scheduled_start + a.duration_minutes + (a.sedation_required ? 15 : 0)
      Window rule (INCLUSIVE close): eff_end(new) <= last_patient_time AND new.scheduled_start >= first_patient_time,
        else ERR_SLOT_OUTSIDE_WINDOW
      Overlap rule (half-open intervals + trailing turnover buffer on each existing appointment):
        conflict(a, b) iff a.start < eff_end(b) + TURNOVER_MINUTES AND b.start < eff_end(a) + TURNOVER_MINUTES
        Any conflict with an in-set appointment -> ERR_SLOT_OVERLAP
    constants:
      TURNOVER_MINUTES: 10
      SEDATION_BUFFER_MINUTES: 15
    precision: "whole minutes"

  - name: unit_day_exclusivity
    description: "Discrete per-day capacity of a MobileImagingUnit: at most one live site day per unit per service_date"
    trigger: "POST /api/site-days; POST /api/site-days/{id}/reschedule"
    algorithm: constraint_propagation
    input_set: "SiteDayAssignments with unit_id == unit and service_date == target date and status NOT IN {CANCELLED, RESCHEDULED}"
    formula: |
      reject with ERR_UNIT_DAY_DOUBLE_BOOKED when input_set is non-empty.
      Interval semantics: discrete whole-day capacity (count-based, not continuous time overlap);
      two days with disjoint HH:MM windows on the same date still conflict.
    precision: "n/a"

  - name: accreditation_status_derivation
    description: "Clock-driven accreditation status; governing-record selection per unit"
    trigger: "POST /api/_clock/set_current_utc; POST /api/accreditations; suspend/reinstate"
    algorithm: threshold
    input_set: "AccreditationRecords of the unit with modality == unit.modality"
    formula: |
      per record: EXPIRED when expires_on < clock_date;
                  EXPIRING_SOON when 0 <= (expires_on - clock_date) <= EXPIRING_WINDOW_DAYS;
                  ACTIVE when (expires_on - clock_date) > EXPIRING_WINDOW_DAYS;
                  SUSPENDED overrides (manual; reinstate re-derives from clock)
      governing record for a unit = record with max expires_on; tie-break: later created_at wins
      Site-day gates (create, depart, mark-ready) require governing record status in {ACTIVE, EXPIRING_SOON}
      EXPIRED governing record cascades: SCHEDULED days with service_date > clock date -> CANCELLED
    constants:
      EXPIRING_WINDOW_DAYS: 30
    precision: "whole days, date arithmetic inclusive"

  - name: image_transfer_budget
    description: "Deterministic transfer success from the day's measured uplink"
    trigger: "POST /api/image-studies/{id}/transmit"
    algorithm: threshold
    input_set: "The ImageStudy and the SetupChecklist of its appointment's site day"
    formula: |
      transferable_mb = floor(measured_uplink_mbps * 7.5)   # 60 seconds of transfer at measured uplink
      size_mb <= transferable_mb  -> DELIVERED (boundary inclusive)
      size_mb >  transferable_mb  -> TRANSFER_FAILED
    precision: "integer MB"

  - name: image_ack_sla
    description: "Reading-turnaround SLA flag computed at acknowledge"
    trigger: "POST /api/image-studies/{id}/acknowledge"
    algorithm: threshold
    input_set: "The ImageStudy and its appointment.completed_at"
    formula: |
      sla_breached = (acknowledged_at - appointment.completed_at) > TRANSFER_SLA_MINUTES  (strictly greater)
    constants:
      TRANSFER_SLA_MINUTES: 120
    precision: "whole minutes"

  - name: monthly_scan_cap_check
    description: "Contract-level monthly booking cap (fiscal gate, checked last)"
    trigger: "POST /api/appointments"
    algorithm: threshold
    input_set: "Appointments on site days whose contract_id == the day's contract and whose service_date month == target appointment month, status in {REQUESTED, CONFIRMED, CHECKED_IN, SCANNING, COMPLETED, NO_SHOW} (CANCELLED excluded)"
    formula: |
      reject with ERR_SCAN_CAP_EXCEEDED when count(input_set) >= contract.monthly_scan_cap
      (creating the cap-th appointment is allowed; the (cap+1)-th is rejected)
    precision: "integer count"

  - name: interruption_credit_carryover
    description: "Compensating credit linking an interrupted PER_DAY source day to its replacement day"
    trigger: "SiteDayAssignment reschedule chain: source INTERRUPTED -> replacement COMPLETED"
    algorithm: waterfall_allocation
    input_set: "Source statement (interrupted day) and replacement statement (rescheduled day, same contract)"
    formula: |
      source.credit_granted_cents = day_rate_cents - source.provisional_amount_cents   (PER_DAY only)
      replacement.credit_applied_cents = source.credit_granted_cents
      INVARIANT (money): source.net_due_cents + replacement.net_due_cents == contract.day_rate_cents
        when the replacement day COMPLETES a full window
      INVARIANT (scan count, PER_SCAN): sum(billable scans over both statements)
        == count of distinct COMPLETED appointments across both days
        (DAY_INTERRUPTED-cancelled appointments are never billable, so a rebooked scan is billed exactly once)
    precision: "integer cents / integer count"

  - name: drl_reference_check
    description: "Diagnostic reference level flag on recorded patient dose"
    trigger: "POST /api/dose-records"
    algorithm: threshold
    input_set: "The new RadiationDoseRecord and its appointment's exam_type"
    formula: |
      drl_exceeded = dose_msv > DRL_MSV[exam_type]   (strictly greater; equality does NOT flag)
      Record is accepted regardless; the flag is advisory for compliance audit.
    constants:
      DRL_MSV: { CT_HEAD: 2.0, CT_CHEST: 7.0, PET_ONCO: 10.0 }
    precision: "1 decimal place comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is declared", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per RBAC", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK ids (route_plan_id, facility_id, contract_id, site_day_id, technologist_id, appointment_id, unit_id, target_route_plan_id) exist", error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: state, check: "OCC: expected_unit_version == unit.version (route-plan create); expected_route_plan_version == target plan.version (reschedule). Checked before state/business rules.", error_id: "ERR_STALE_UNIT_VERSION | ERR_STALE_ROUTE_PLAN_VERSION", http_status: 412, applies_to: "POST /api/route-plans; POST /api/site-days/{id}/reschedule" }
  - { priority: 5, category: state, check: "Target entity state precondition of the transition (e.g., plan DRAFT/PUBLISHED for site-day create, day bookable for appointment create, statement PROVISIONAL for finalize)", error_id: "ERR_INVALID_STATE | ERR_PLAN_NOT_PUBLISHED | ERR_SITE_DAY_NOT_BOOKABLE | ERR_STATEMENT_NOT_FINALIZABLE | ...", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Radiation/staffing safety: projected_dose_msv <= TECH_DAILY_DOSE_LIMIT_MSV at staffing creation (strictly-greater rejection); dose records only for CT/PET exams", error_id: "ERR_DOSE_LIMIT_EXCEEDED | ERR_DOSE_NOT_APPLICABLE", http_status: 422, applies_to: "POST /api/staffing-assignments; POST /api/dose-records" }
  - { priority: 7, category: business_safety, check: "Pad power: facility pad_amps_available >= unit.power_required_amps and pad_voltage == unit.voltage_required at site-day create; checklist measured_amps >= unit.power_required_amps at mark-ready", error_id: ERR_PAD_POWER_INSUFFICIENT, http_status: 422, applies_to: "POST /api/site-days; POST /api/site-days/{id}/mark-ready" }
  - { priority: 8, category: business_referential, check: "Identity/ownership linkage: coordinator's facility == site day facility; dose-record technologist_id == X-User-ID; acting technologist staffed on the day", error_id: "ERR_FACILITY_MISMATCH | ERR_TECHNOLOGIST_IDENTITY_MISMATCH | ERR_TECHNOLOGIST_NOT_STAFFED", http_status: 403, applies_to: "POST /api/appointments; POST /api/billing-statements/{id}/dispute; POST /api/dose-records; scan endpoints" }
  - { priority: 9, category: business_referential, check: "Credential linkage: technologist.modality_certs contains unit modality; exam_type modality prefix matches unit modality; facility.supported_modalities contains unit modality; contract.facility_id == site day facility_id", error_id: "ERR_MODALITY_CERT_MISMATCH | ERR_MODALITY_NOT_SUPPORTED | ERR_CONTRACT_FACILITY_MISMATCH", http_status: 422, applies_to: "POST /api/staffing-assignments; POST /api/appointments; POST /api/site-days" }
  - { priority: 10, category: business_temporal, check: "Temporal placement: service_date >= clock date; service_date inside plan week [week_start, week_start+6]; window well-formed (first_patient >= arrival + setup_minutes, departure >= last_patient + teardown_minutes)", error_id: "ERR_SERVICE_DATE_IN_PAST | ERR_SERVICE_DATE_OUTSIDE_PLAN_WEEK | ERR_WINDOW_TOO_SHORT", http_status: 422, applies_to: "POST /api/site-days; POST /api/site-days/{id}/reschedule" }
  - { priority: 11, category: business_constraint, check: "Resource conflicts: unit day exclusivity; appointment slot inside window; appointment overlap with turnover buffer; technologist single-day staffing (no other ASSIGNED staffing on same service_date); drive minutes <= max_daily_drive_minutes; one checklist per site day", error_id: "ERR_UNIT_DAY_DOUBLE_BOOKED | ERR_SLOT_OUTSIDE_WINDOW | ERR_SLOT_OVERLAP | ERR_STAFFING_DATE_CONFLICT | ERR_DRIVE_TIME_EXCEEDED | ERR_CHECKLIST_EXISTS", http_status: 409, applies_to: "POST /api/site-days; POST /api/site-days/{id}/reschedule; POST /api/appointments; POST /api/staffing-assignments; POST /api/setup-checklists" }
  - { priority: 12, category: business_compliance, check: "Accreditation: governing record status in {ACTIVE, EXPIRING_SOON} at site-day create, depart, mark-ready", error_id: ERR_ACCREDITATION_NOT_VALID, http_status: 422, applies_to: "POST /api/site-days; POST /api/site-days/{id}/depart; POST /api/site-days/{id}/mark-ready" }
  - { priority: 13, category: business_fiscal, check: "Monthly scan cap under the day's contract (count >= cap rejects)", error_id: ERR_SCAN_CAP_EXCEEDED, http_status: 402, applies_to: "POST /api/appointments" }
  - { priority: 14, category: business_fiscal, check: "Payment exactness: paid_amount_cents == net_due_cents", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /api/billing-statements/{id}/mark-paid" }

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Side effects: accreditation status re-derivation + expiry cascade; all server timestamps read this clock."
    roles: [OperationsDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "datetime" }
    side_effects: ["AccreditationRecord status re-derivation", "EXPIRED governing record cascade: future SCHEDULED site days -> CANCELLED"]

  # --- Facilities ---
  - method: POST
    path: "/api/facilities"
    description: "Create a contracted facility"
    roles: [OperationsDirector]
    code: 201
