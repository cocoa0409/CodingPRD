            - "${auth2} == 1000000 and ${avail2} == 1000000, exactly the pre-adjustment figures"
            - "${v1} is ${v0} plus 1 and ${v2} is ${v1} plus 1"
            - "after each trigger budget_authorized_cents == budget_committed_cents + budget_available_cents"
            - "both responses have HTTP status 200 and return the whole Route entity"

