  - section: rbac
    instances:
      - name: write_off_approval_authority_is_a_four_rung_ladder
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.WriteOff
        distinguishing_aspect: |
          Three distinct 403s guard one endpoint and their order is observable: an off-project
          ProjectManager is stopped at ownership (priority 3) before anyone asks whether the row
          needs a Controller (priority 6), the project's own ProjectManager reaches the level check
          and is refused there, and on a PM-level row the same manager is refused for being the
          preparer (priority 5). Only the branch that actually needed a Controller leaves
          overhead_adjustment_required alone when a Controller finally approves the PM-level row.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z; private client; ACTIVE T&M project managed by pm-001"
            - "two approved entries: 24.00 h on 2026-05-11 (billable 4575.00) and 20.00 h on 2026-05-12 (billable 3812.50)"
            - "write-off A of 8387.50 prepared by the accountant acct-001 (routes to CONTROLLER on amount)"
            - "write-off B of 4575.00 prepared by the manager pm-001 (routes to PROJECT_MANAGER)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
