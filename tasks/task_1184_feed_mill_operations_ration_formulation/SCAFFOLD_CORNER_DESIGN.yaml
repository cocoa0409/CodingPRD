        claim_type: rbac_denial
        grounds: ["roles[Operator]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "QualityTech role is absent from POST /api/batches/{id}/weighments -> 403 even for a placeholder batch id (priority 3 before 4)."
