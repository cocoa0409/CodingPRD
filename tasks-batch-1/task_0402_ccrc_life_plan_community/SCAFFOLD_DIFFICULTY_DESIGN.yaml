              payload: { community_id: "${cid}", full_name: "Fred A", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resa: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resa}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { ra: $.data.id }
            - call: "POST /ccrc/residencies/${ra}/assign-unit"
              payload: { unit_id: "${u1}" }
              as: AdmissionsDirector
              captures: { rav: $.data.version }
            - call: "POST /ccrc/residencies/${ra}/activate"
              payload: { expected_residency_version: "${rav}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "F2", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { u2: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Frank B", date_of_birth: "1929-01-01" }
              as: AdmissionsDirector
              captures: { resb: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resb}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rb: $.data.id, rbv: $.data.version }
            - call: "POST /ccrc/communities/${cid}/reserve-reports"
              payload: {}
              as: FinanceOfficer
              captures: { frozen: $.data.is_deficient }
          trigger:
            - call: "POST /ccrc/residencies/${rb}/activate"
