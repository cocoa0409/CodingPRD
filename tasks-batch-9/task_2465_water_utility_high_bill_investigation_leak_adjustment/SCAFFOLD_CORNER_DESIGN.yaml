              payload: { account_id: "${acct_id}", meter_serial: "MTR-K-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
          trigger:
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-2012", customer_name: "Ghost Customer", service_address: "0 Nowhere", rate_schedule_id: "00000000-0000-0000-0000-0000000fffe1" }
              as: CustomerServiceRep
            - call: "POST /meters"
              payload: { account_id: "00000000-0000-0000-0000-0000000fffe2", meter_serial: "MTR-K-2", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 0 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "CORRECTED", reading_value: 104000, corrects_reading_id: "00000000-0000-0000-0000-0000000fffe3" }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "00000000-0000-0000-0000-0000000fffe4", read_date: "2025-06-30", read_type: "CORRECTED", reading_value: 104000, corrects_reading_id: "00000000-0000-0000-0000-0000000fffe3" }
              as: MeterTechnician
          assert:
            - "UNKNOWN rate_schedule_id: HTTP 404 with error_id ERR_RATE_SCHEDULE_NOT_FOUND"
            - "UNKNOWN account_id: HTTP 404 with error_id ERR_SERVICE_ACCOUNT_NOT_FOUND"
            - "UNKNOWN corrects_reading_id with a good meter: HTTP 404 with error_id ERR_METER_READING_NOT_FOUND"
            - "BOTH UNKNOWN: HTTP 404 with error_id ERR_METER_NOT_FOUND — left-to-right over the input list [meter_id, read_date, read_type, reading_value, corrects_reading_id]"
            - "GET /service-accounts returns total_count 1 and GET /meter-readings returns total_count 0 — every refused call created nothing"

  # ===========================================================================
  # Guide section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_state_valid_transition_billing_period_open_close_lock_chain
        claim_type: valid_transition
        grounds:
          - state_machines.BillingPeriod
          - endpoints[POST /billing-periods/{id}/close]
          - endpoints[POST /billing-periods/{id}/lock]
        distinguishing_aspect: |
          Each declared trigger moves the period exactly one step: close takes OPEN to CLOSED and
          lock takes CLOSED to LOCKED, each bumping version by one and leaving every other field
          untouched. An implementation that jumps straight to LOCKED on close, or that leaves
          version at 1, fails.
        test_recipe:
          setup:
            - "One BillingPeriod 2025-06 (SUMMER, 2025-06-01..2025-06-30) exists in status OPEN at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /billing-periods/${p1_id}/close"
              as: SystemAdmin
            - call: "POST /billing-periods/${p1_id}/lock"
              as: SystemAdmin
          assert:
            - "After close: BillingPeriod.${p1_id}.status == CLOSED and version == 2"
            - "After lock: BillingPeriod.${p1_id}.status == LOCKED and version == 3"
            - "period_code, start_date 2025-06-01, end_date 2025-06-30, season SUMMER and rebilling_deadline_date 2026-12-31 are all unchanged"
            - "GET /billing-periods?status=LOCKED returns total_count 1"

      - name: corner_state_precondition_enforcement_period_status_gates_bill_create_and_issue
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Bill
          - validations[ERR_BILLING_PERIOD_CLOSED]
          - validations[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          The two period gates on Bill are deliberately asymmetric and only a cross-entity
          precondition check can get both right: CLOSED blocks bill CREATION (409
          ERR_BILLING_PERIOD_CLOSED) but still permits ISSUE, while LOCKED blocks ISSUE itself
          (409 ERR_INVALID_STATE_TRANSITION, since the transition's precondition demands
          period.status IN {OPEN, CLOSED}). An implementation that treats CLOSED and LOCKED alike
          fails one of the two legs. The refused create also proves priority: the same call
          violates the priority-11 duplicate rule, yet reports the priority-8 code.
        test_recipe:
          setup:
            - "RS-STD-2026, BillingPeriods 2025-06 and 2025-07 (both SUMMER, both OPEN) and ServiceAccount ACC-2101 with master meter MTR-L-1 exist."
            - "Reads 100000 / 104000 / 108000 give 4000 gallons in each period, and one DRAFT bill exists per period."
            - "2025-06 is then closed and locked; 2025-07 is closed but not locked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-2101", customer_name: "Milo Ferraro", service_address: "2 Sycamore Ln", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-L-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-07-31", read_type: "ACTUAL", reading_value: 108000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
