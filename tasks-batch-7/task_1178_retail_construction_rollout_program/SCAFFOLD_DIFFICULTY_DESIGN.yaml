        distinguishing_aspect: |
          Pair (state, business_fiscal): approving a 50000000-cent change order
          on a REMOVED site violates both the state rule (change order was
          auto-REJECTED by the removal cascade; terminal) and the fiscal headroom
          rule; the state-category error ERR_ALREADY_TERMINAL wins at priority 5
          over ERR_BUDGET_HEADROOM_EXCEEDED at priority 11.
