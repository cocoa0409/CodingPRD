              as: ContractsAdministrator
              as_user_id: "ca-1"
              captures: { draw_id: "$.data.id" }
          assert:
            - "ConsumableDraw.${draw_id}.accrual_amount_cents == 2196000"
            - "ConsumableDraw.${draw_id}.settled_amount_cents == 930000"
