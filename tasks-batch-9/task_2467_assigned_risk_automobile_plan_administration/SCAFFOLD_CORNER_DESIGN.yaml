          The plan writes annual terms only, and the rule is an equality, not a maximum: 364 days is as
          invalid as 366. Backdating is refused separately - an effective date before the clock would
          let a carrier rate a risk against a stale surcharge window - and both refusals leave the
          assignment ACCEPTED and re-issuable.
