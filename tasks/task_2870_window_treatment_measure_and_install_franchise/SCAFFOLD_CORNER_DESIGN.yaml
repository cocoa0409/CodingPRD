          assert:
            - "the job froze the channel count at creation: the captured ${channels} == 2 with ${cs0} == PENDING and ${a0} == 0"
            - "each ACCEPTED pair spends exactly one unit of the budget: the captured ${a1} == 1, ${a2} == 2 and ${a3} == 3, and the captured ${cs1} == PAIRED"
            - "every verify returns HTTP 200 with the captured ${cs1v} == ${cs2v} == ${cs3v} == FAILED - paired_channel_count 1 is short of motorized_channel_count 2, and a failed verification is a state, not an error"
            - "the retry overwrote the hub each time: the captured ${hub3} == HOMEKIT"
            - "the FOURTH pair is refused: the captured ${e_limit} == ERR_COMMISSIONING_ATTEMPT_LIMIT (409), because commissioning_attempt_count already equals COMMISSIONING_MAX_ATTEMPTS 3 - not ERR_COMMISSIONING_NOT_APPLICABLE, since commissioning_status FAILED is a legal from-state for pair"
            - "the refusal spent nothing and changed nothing: the captured ${a_final} == 3 and ${cs_final} == FAILED"
            - "the job is now permanently uncompletable: the captured ${e_complete} == ERR_COMMISSIONING_NOT_VERIFIED (409), and the captured ${inst_final} == SCHEDULED"
            - "the two dimensions never coupled: the captured ${inst1} == SCHEDULED and ${inst_final} == SCHEDULED across all eight commissioning calls, and Opening.${o1}.install_outcome and Opening.${o2}.install_outcome are both still null"

  # -------------------------------------------------------------------
  # Guide section 7 - RBAC (per-role bullets + role-model rows)
  # -------------------------------------------------------------------
  - section: rbac
    instances:
      - name: the_four_roles_are_peers_and_the_franchisor_is_not_a_superset
        claim_type: peer_roles
        grounds:
          - roles.Franchisor
          - roles.Franchisee
          - roles.Designer
          - roles.VendorRep
        distinguishing_aspect: "The role model is a partition, not a ladder, and the natural implementation bug is to let the Franchisor do everything. Here the Franchisor - who charters territories and sets the clock - is refused on measuring, on quoting and on reading a designer's calendar-bearing writes, while each peer is refused on the others' territory. Six refusals and four positives from one fixture."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one vendor, one ROUTED lead and one SCHEDULED consultation."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 5, supported_lift_systems: ["CORDED"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "HQ tries to measure", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_hq_measure: $.data.error_id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Owner tries to measure", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { e_owner_measure: $.data.error_id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Designer measures", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Owner's own mill", base_lead_time_days: 8, motorization_extra_days: 2, cutoff_hour_utc: 12, remake_policy: "SHARED_50_50", concurrent_capacity: 3, supported_lift_systems: ["CORDED"] }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { e_owner_vendor: $.data.error_id }
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "HQ-KIT", replacement_value_cents: 50000 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { e_hq_kit: $.data.error_id }
            - call: "GET /blinds/territories/${t1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { e_designer_territory: $.data.error_id }
            - call: "GET /blinds/quotes/11111111-1111-4111-8111-111111111111"
              as: VendorRep
              as_user_id: "${v1}"
              captures: { e_vendor_quote: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { e_owner_clock: $.data.error_id }
          assert:
            - "the captured ${e_hq_measure} == ERR_ROLE_NOT_PERMITTED (403): POST /blinds/openings lists Designer only, and the Franchisor's brand-level authority buys nothing inside the customer's house"
            - "the captured ${e_owner_measure} == ERR_ROLE_NOT_PERMITTED (403) for the same endpoint - the franchisee who owns the territory cannot measure either"
            - "the designer's identical request succeeds as ${o1}, proving the two refusals were about the role and not about the body"
            - "the captured ${e_owner_vendor} == ERR_ROLE_NOT_PERMITTED (403): vendors are brand-level, so a franchisee cannot enroll one"
            - "the captured ${e_hq_kit} == ERR_ROLE_NOT_PERMITTED (403): the sample library belongs to the franchisee, so the direction of refusal reverses on this endpoint"
            - "the captured ${e_designer_territory} == ERR_ROLE_NOT_PERMITTED (403): the territory read - which exposes royalty and credit figures - lists Franchisor and Franchisee only"
            - "the captured ${e_vendor_quote} == ERR_ROLE_NOT_PERMITTED (403), NOT ERR_QUOTE_NOT_FOUND: the role check at priority 2 runs before the existence check at priority 3, so a VendorRep cannot even probe for retail prices"
            - "the captured ${e_owner_clock} == ERR_ROLE_NOT_PERMITTED (403): the logical clock is Franchisor-only"
            - "nothing was written by any refusal: Consultation.${c1}.measured_opening_count == 1, GET /blinds/sample-kits?territory_id=${t1} returns total_count 0, and Vendor rows number exactly one"

      - name: ownership_and_the_ship_receive_split_keep_two_actors_on_every_order
        claim_type: Segregation of duties
        grounds:
          - roles.Designer
          - roles.VendorRep
          - validations.priority_6_ERR_DESIGNER_OWNERSHIP_REQUIRED
        distinguishing_aspect: "Two segregations in one instance. Within a role: two designers of the SAME territory are peers, and D2 is refused on D1's consultation with ERR_DESIGNER_OWNERSHIP_REQUIRED rather than a role error. Across roles: no single actor can walk an order from PLACED to RECEIVED - ship is VendorRep-only and receive is Franchisee-only - and the VendorRep who ships is not allowed to read the retail quote behind it."
