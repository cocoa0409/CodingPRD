# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or ownership rule violated (driver acting on another driver's resource)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed JSON, missing required field, unknown enum member, unparseable datetime, violated field constraint (ranges, starts_at < ends_at, due_at >= ends_at)" }
  - { id: ERR_FLEET_NOT_FOUND, http: 404, condition: "fleet_id (path or body) does not exist" }
  - { id: ERR_TERMINAL_NOT_FOUND, http: 404, condition: "terminal_id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement_id does not exist" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "driver_id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "vehicle_id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "policy_id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event_id does not exist" }
  - { id: ERR_CLIP_NOT_FOUND, http: 404, condition: "clip_id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "session_id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "case_id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim_id does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "hold_id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "snapshot_id does not exist" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "award_id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition exists" }
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "expected_event_version does not match the event's current version (OCC)" }
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version does not match the policy's current version (OCC)" }
  - { id: ERR_EVENT_IN_FUTURE, http: 422, condition: "occurred_at or captured_at is after the logical clock" }
  - { id: ERR_EVENT_TYPE_DISABLED, http: 422, condition: "ACTIVE policy disables detection for this event_type (DISTRACTION or SEAT_BELT)" }
  - { id: ERR_INWARD_FOOTAGE_RESTRICTED, http: 422, condition: "Inward-facing capture/review blocked by policy, union agreement, missing driver consent, or absence of an ACTIVE policy" }
  - { id: ERR_LITIGATION_HOLD_ACTIVE, http: 409, condition: "Purge attempted on a clip covered by an ACTIVE litigation hold (or clip in retention_class LITIGATION_HOLD)" }
  - { id: ERR_ACTIVE_HOLD_EXISTS, http: 409, condition: "An ACTIVE hold already exists for this driver (scope DRIVER) or this event (scope EVENT)" }
  - { id: ERR_EXONERATION_WINDOW_EXPIRED, http: 422, condition: "Claim submitted after confirmed_at + 30 days (boundary inclusive at exactly 30 days)" }
  - { id: ERR_SESSION_WINDOW_OVERLAP, http: 409, condition: "Manual coaching session window [starts_at, ends_at) overlaps another occupying session of the same driver; touching endpoints do not overlap" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Ratifying agreement's closed window shares an instant with another RATIFIED agreement of the terminal; touching endpoints DO overlap" }
  - { id: ERR_DAILY_UPLOAD_CAP_EXCEEDED, http: 422, condition: "used_mb + size_mb > ACTIVE policy.daily_upload_cap_mb for the current UTC day" }
  - { id: ERR_ACTIVE_POLICY_REQUIRED, http: 409, condition: "No ACTIVE CameraPolicy exists for the fleet (upload-complete, retention evaluation)" }
  - { id: ERR_POLICY_IN_USE, http: 409, condition: "Archive attempted on the fleet's ACTIVE policy" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "employee_ref or vin already used within the fleet" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A non-REJECTED ExonerationClaim already exists for the event" }
  - { id: ERR_DRIVER_NOT_ACTIVE, http: 409, condition: "Review CONFIRM requires Driver.status IN {ACTIVE, COACHING_HOLD}" }
  - { id: ERR_FLEET_LOCKED, http: 409, condition: "Fleet posture INCIDENT_LOCKDOWN blocks review CONFIRM, session complete, and snapshot compute" }
  - { id: ERR_EVENT_NOT_CONFIRMED, http: 409, condition: "Coaching session create requires the referenced event in status CONFIRMED" }
  - { id: ERR_CLAIM_REQUIRES_CONFIRMED_COLLISION, http: 409, condition: "Exoneration claim requires a CONFIRMED event of type COLLISION" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Exoneration decision attempted by the same X-User-ID that confirmed the event" }
  - { id: ERR_SNAPSHOT_NOT_FINAL, http: 409, condition: "Award approve requires the pricing snapshot in status FINAL" }
  - { id: ERR_INCENTIVE_BUDGET_EXCEEDED, http: 402, condition: "Paying the award would push APPROVED+PAID totals above fleet.incentive_budget_cents" }
  - { id: ERR_RETENTION_NOT_EXPIRED, http: 409, condition: "Purge attempted before captured_at + retention_days of the clip's class (boundary inclusive allows purge)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Fleet operator administrator; owns configuration (fleets, terminals, vehicles, union agreements, camera policies), the logical clock, and maintenance runs"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/fleets; POST /api/fleets/{id}/posture; POST /api/fleets/{id}/run-maintenance"
      - "POST /api/terminals; POST /api/vehicles; POST /api/vehicles/{id}/decommission"
      - "POST /api/union-agreements; POST /api/union-agreements/{id}/ratify; POST /api/union-agreements/{id}/expire"
      - "POST /api/camera-policies; PATCH /api/camera-policies/{id}; POST /api/camera-policies/{id}/activate; POST /api/camera-policies/{id}/archive"
      - "POST /api/drivers"
    shared_operations: ["All GET endpoints"]
  - name: TelematicsIngest
    description: "Device-side ingest pipeline pushing events and footage"
    identity: opaque
    exclusive_operations:
      - "POST /api/safety-events"
      - "POST /api/footage-clips; POST /api/footage-clips/{id}/upload-begin; POST /api/footage-clips/{id}/upload-complete"
    shared_operations: ["All GET endpoints"]
  - name: SafetyManager
    description: "Safety reviewer; owns the review queue, coaching, escalations, driver status, footage purge, and litigation holds"
    identity: opaque
    exclusive_operations:
      - "POST /api/safety-events/{id}/review"
      - "POST /api/drivers/{id}/status"
      - "POST /api/drivers/{id}/coaching-sessions; POST /api/coaching-sessions/{id}/complete; .../reassign; .../cancel"
      - "POST /api/escalation-cases/{id}/review; .../send-back; .../resolve"
      - "POST /api/litigation-holds; POST /api/litigation-holds/{id}/release"
      - "POST /api/footage-clips/{id}/purge"
    shared_operations: ["All GET endpoints"]
  - name: ClaimsAdjuster
    description: "Insurance-side adjuster; owns exoneration claim review; segregation of duties forbids deciding a claim whose event the same X-User-ID confirmed"
    identity: opaque
    exclusive_operations:
      - "POST /api/exoneration-claims/{id}/begin-review"
      - "POST /api/exoneration-claims/{id}/decide"
    shared_operations: ["All GET endpoints"]
  - name: Driver
    description: "Fleet driver; acknowledges own coaching sessions and files exoneration claims for own events"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /api/coaching-sessions/{id}/acknowledge (own sessions only)"
      - "POST /api/safety-events/{id}/exoneration-claims (own events only)"
    shared_operations: ["All GET endpoints"]
  - name: FleetAdmin
    description: "Fleet executive; owns score snapshot computation and incentive award approval/payment"
    identity: opaque
    exclusive_operations:
      - "POST /api/fleets/{id}/score-snapshots/compute"
      - "POST /api/incentive-awards/{id}/approve; POST /api/incentive-awards/{id}/pay"
    shared_operations: ["All GET endpoints"]
