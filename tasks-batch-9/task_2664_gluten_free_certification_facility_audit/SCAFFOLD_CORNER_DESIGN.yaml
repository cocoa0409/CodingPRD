            - "${sup_status} == \"SUSPENDED\""
            - "Ingredient.${ing_id}.status == \"DRAFT\""
            - "Ingredient.${ing_id}.review_cycle_count == 0"

      - name: formula_review_with_no_linked_lines_is_rejected
        claim_type: violation_to_error
