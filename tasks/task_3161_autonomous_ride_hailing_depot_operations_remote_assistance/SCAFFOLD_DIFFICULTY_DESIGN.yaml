          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE with one IN_SERVICE vehicle, one SAFE curb with an ACTIVE STANDARD curb rule, and one ACTIVE FREEWAY ExclusionZone; RideRequest R1 is CANCELLED (terminal)."
