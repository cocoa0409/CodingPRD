        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.DeliverySession.TENTATIVE_to_SCHEDULED
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: the CONFIRM request violates
          both priority 7 (vol1's training is NOT_STARTED -> ineligible) and priority 9
          (candidate date 2026-09-10 is only 2 days after the sibling SCHEDULED session on
          2026-09-08, below MIN_SESSION_GAP_DAYS=3). The safety error must win:
          ERR_VOLUNTEER_INELIGIBLE (409), not ERR_CADENCE_VIOLATION.
