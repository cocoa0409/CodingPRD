scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 - dual-variant calculations on different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: coverage_self_reported_vs_committee_verified
        grounds:
          - calculations.correlation_coverage
          - entities.Submission.fields.self_reported_coverage_pct
          - entities.Submission.fields.verified_coverage_pct
          - entities.CorrelationEntry.fields.reviewer_verdict
          - endpoints[POST /submissions/{id}/correlations/{entryId}/verdict]
        distinguishing_aspect: |
          On the correlation-documentation domain (Submission x CorrelationEntry) the SAME three
          correlation rows yield self_reported_coverage_pct == 64.00 (verdicts PENDING and ACCEPTED
          both count) but verified_coverage_pct == 50.00 (only ACCEPTED counts), so the two
          variants of correlation_coverage differ by exactly 14.00 percentage points.
        test_recipe:
          setup:
            - "State TX is OPEN_TERRITORY with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "TX MATH framework holds three standards: TX.M.3.1 (grade 3, weight 3), TX.M.4.1 (grade 4, weight 2), TX.M.5.1 (grade 5, weight 5); coverage denominator is 10"
            - "Title spans grades 3..5 and is ACTIVE; cycle 2027 is OPEN with the clock at 2026-09-15"
            - "The submission is FILED with three correlation entries: MASTERY on TX.M.3.1, PRACTICE on TX.M.4.1, MENTION on TX.M.5.1, all still PENDING"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "TX", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_tx_id: $.data.id }
            - call: "POST /state-profiles/${st_tx_id}/standards"
              payload: { subject: "MATH", standard_code: "TX.M.3.1", grade_low: 3, grade_high: 3, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
            - call: "POST /state-profiles/${st_tx_id}/standards"
              payload: { subject: "MATH", standard_code: "TX.M.4.1", grade_low: 4, grade_high: 4, weight: 2 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
            - call: "POST /state-profiles/${st_tx_id}/standards"
              payload: { subject: "MATH", standard_code: "TX.M.5.1", grade_low: 5, grade_high: 5, weight: 5 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_tx_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000000301", subject: "MATH", grade_low: 3, grade_high: 5, copyright_year: 2026, content_tags: ["ALGEBRA_READINESS"], page_count: 400, signature_page_capacity: 480, list_price_cents: 9000 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "TX.M.3.1", depth_level: "MASTERY", page_reference: "pp. 12-30", evidence_citation: "Unit 1 lessons 1-6 build and assess full mastery of the standard." }
              as: PublisherEditor
              captures: { corr3_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "TX.M.4.1", depth_level: "PRACTICE", page_reference: "pp. 90-96", evidence_citation: "Unit 4 provides guided practice sets for the standard." }
              as: PublisherEditor
              captures: { corr4_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "TX.M.5.1", depth_level: "MENTION", page_reference: "p. 210", evidence_citation: "Chapter 9 opener references the standard in a sidebar." }
              as: PublisherEditor
              captures: { corr5_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
          trigger:
            - call: "POST /submissions/${sub_id}/correlations/${corr3_id}/verdict"
              payload: { verdict: "ACCEPT" }
              as: ReviewCommitteeMember
              as_user_id: "cm-1"
            - call: "POST /submissions/${sub_id}/correlations/${corr5_id}/verdict"
              payload: { verdict: "ACCEPT" }
              as: ReviewCommitteeMember
              as_user_id: "cm-1"
          assert:
            - "Submission.${sub_id}.self_reported_coverage_pct == 64.00"
            - "Submission.${sub_id}.verified_coverage_pct == 50.00"
            - "Submission.${sub_id}.self_reported_coverage_pct - Submission.${sub_id}.verified_coverage_pct == 14.00"
            - "CorrelationEntry.${corr4_id}.reviewer_verdict == PENDING"
            - "CorrelationEntry.${corr3_id}.effective_weight == 3.00"

      - name: order_quoted_vs_contracted_total_value
        grounds:
          - calculations.order_total_value
          - calculations.state_net_price
          - entities.DistrictOrder.fields.quoted_tcv_cents
          - entities.DistrictOrder.fields.contracted_tcv_cents
          - state_machines.DistrictOrder.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          On the district-sales domain (DistrictOrder x PricingProposal x Title) the SAME 200 print
          copies and 100 digital seats price at quoted_tcv_cents == 1977000 (title list price, no
          adopted-list rebate) and at contracted_tcv_cents == 1887270 (state-approved
          avg_annual_price_cents 8730 plus the 2% adopted-list rebate), a different entity domain
          from the coverage variant pair.
        test_recipe:
          setup:
            - "State CA is ADOPTION_LIST with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "Title CA-MATH-4 lists at 9000 cents per copy, is ACTIVE, and 5000 print units are on hand"
            - "The submission was FILED, its correlation ACCEPTED, its PricingProposal (base 9000, term 3, escalator 0, projected 100, seat 1500) APPROVED with net_state_price_cents 26190 and avg_annual_price_cents 8730"
            - "The panel tallied RECOMMEND, so the submission is ADOPTED and CA sits in Title.adopted_state_codes"
            - "A district order for 200 print copies and 100 digital seats is QUOTED by rep-1"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", adoption_model: "ADOPTION_LIST", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_ca_id: $.data.id }
            - call: "POST /state-profiles/${st_ca_id}/standards"
              payload: { subject: "MATH", standard_code: "CA.M.4.1", grade_low: 4, grade_high: 4, weight: 2 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_ca_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000000401", subject: "MATH", grade_low: 4, grade_high: 4, copyright_year: 2026, content_tags: ["ALGEBRA_READINESS"], page_count: 400, signature_page_capacity: 480, list_price_cents: 9000 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /titles/${ttl_id}/inventory-adjustments"
              payload: { adjustment_type: "RECEIPT", units: 5000 }
              as: PlatformAdmin
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "CA.M.4.1", depth_level: "MASTERY", page_reference: "pp. 12-30", evidence_citation: "Unit 1 lessons 1-6 build and assess full mastery of the standard." }
              as: PublisherEditor
              captures: { corr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions/${sub_id}/correlations/${corr_id}/verdict"
              payload: { verdict: "ACCEPT" }
              as: ReviewCommitteeMember
              as_user_id: "cm-1"
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: PricingManager
              captures: { sub_v1: $.data.version }
            - call: "POST /pricing-proposals"
              payload: { submission_id: "${sub_id}", base_price_cents: 9000, term_years: 3, annual_escalator_bps: 0, projected_adoption_units: 100, digital_seat_price_cents: 1500, expected_submission_version: "${sub_v1}" }
              as: PricingManager
              captures: { prop_id: $.data.id }
            - call: "POST /pricing-proposals/${prop_id}/decision"
              payload: { verdict: "APPROVE" }
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /committee-panels"
              payload: { cycle_id: "${cyc_id}", panel_label: "CA MATH Panel A", session_start_at: "2026-10-20T14:00:00Z", session_end_at: "2026-10-20T18:00:00Z", buffer_minutes: 10, member_count: 3, quorum_required: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
              captures: { pnl_id: $.data.id, pnl_v0: $.data.version }
            - call: "POST /committee-panels/${pnl_id}/slots"
              payload: { submission_id: "${sub_id}", start_at: "2026-10-20T14:00:00Z", end_at: "2026-10-20T14:30:00Z", expected_panel_version: "${pnl_v0}" }
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /committee-panels/${pnl_id}/open-session"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /presentation-slots/${slot_id}/present"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /presentation-slots/${slot_id}/votes"
              payload: { vote: "RECOMMEND", rationale: "Strong alignment to the state framework." }
              as: ReviewCommitteeMember
              as_user_id: "cm-1"
            - call: "POST /presentation-slots/${slot_id}/votes"
              payload: { vote: "RECOMMEND", rationale: "Evidence citations verified against the pages." }
              as: ReviewCommitteeMember
              as_user_id: "cm-2"
            - call: "POST /presentation-slots/${slot_id}/votes"
              payload: { vote: "RECOMMEND", rationale: "Accessible digital platform demonstrated." }
              as: ReviewCommitteeMember
              as_user_id: "cm-3"
            - call: "POST /presentation-slots/${slot_id}/tally"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ca_id}"
            - call: "POST /district-orders"
              payload: { district_ref: "CA-D-77", state_id: "${st_ca_id}", title_id: "${ttl_id}", pricing_proposal_id: "${prop_id}", print_units: 200, digital_seats: 100 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord_id: $.data.id, quoted_at_create: $.data.quoted_tcv_cents }
          trigger:
            - call: "POST /district-orders/${ord_id}/confirm"
              payload: {}
              as: SalesRep
              as_user_id: "rep-2"
          assert:
            - "PricingProposal.${prop_id}.net_state_price_cents == 26190"
            - "PricingProposal.${prop_id}.avg_annual_price_cents == 8730"
            - "DistrictOrder.${ord_id}.quoted_tcv_cents == 1977000"
            - "DistrictOrder.${ord_id}.contracted_tcv_cents == 1887270"
            - "DistrictOrder.${ord_id}.freight_surcharge_cents == 26190"
            - "DistrictOrder.${ord_id}.quoted_tcv_cents - DistrictOrder.${ord_id}.contracted_tcv_cents == 89730"

  # ===========================================================================
  # Rule 2 - combinatorial formulas in different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: net_state_price_per_year_rounding_pinned
        grounds:
          - calculations.state_net_price
          - entities.PricingProposal.fields.net_state_price_cents
          - entities.PricingProposal.fields.total_discount_pct
          - endpoints[POST /pricing-proposals]
        distinguishing_aspect: |
          Mode (b) nested rounding: with base 12345, escalator 250 bps and a 5-year term at the
          capped 0.20 discount, rounding each contract year to whole cents THEN summing yields
          net_state_price_cents == 51911, while summing the exact per-year decimals and rounding
          once yields 51912 - the scaffold pins per-year-then-sum, so 51912 is a failure.
        test_recipe:
          setup:
            - "State NV is OPEN_TERRITORY with multi_year_max_years 6, price_cap_cents null, min_verified_coverage_pct 50.00, sampling_copies_required 0, rostering_standard ONEROSTER_1_2, accessibility_standard WCAG_2_1_AA and data_privacy_addendum_required true"
            - "Cycle 2027 allows contract_term_years 6 and is OPEN at clock 2026-09-15"
            - "Title NV-SCI-6 is ACTIVE with an ancillary bundle of 4 components, ONEROSTER_1_2 rostering, WCAG_2_2_AA conformance and a signed privacy addendum"
            - "The submission is FILED, so a price proposal may be filed against it"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "NV", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00, multi_year_max_years: 6, rostering_standard: "ONEROSTER_1_2", accessibility_standard: "WCAG_2_1_AA", data_privacy_addendum_required: true }
              as: PlatformAdmin
              captures: { st_nv_id: $.data.id }
            - call: "POST /state-profiles/${st_nv_id}/standards"
              payload: { subject: "SCIENCE", standard_code: "NV.S.6.1", grade_low: 6, grade_high: 6, weight: 4 }
              as: StateAdoptionOfficer
              as_user_id: "${st_nv_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_nv_id}", subject: "SCIENCE", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_nv_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000000601", subject: "SCIENCE", grade_low: 6, grade_high: 6, copyright_year: 2026, content_tags: ["LAB_SAFETY"], page_count: 300, signature_page_capacity: 384, list_price_cents: 12345 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /titles/${ttl_id}/ancillary-bundles"
              payload: { bundle_code: "NV-SCI-6-FULL", component_count: 4, component_list_total_cents: 40000, digital_seat_price_cents: 1500, rostering_standard: "ONEROSTER_1_2", accessibility_conformance: "WCAG_2_2_AA", privacy_addendum_signed: true }
              as: PricingManager
              captures: { bnd_id: $.data.id }
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "NV.S.6.1", depth_level: "MASTERY", page_reference: "pp. 40-70", evidence_citation: "Investigations 2 through 5 assess the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_nv_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
          trigger:
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: PricingManager
              captures: { sub_v1: $.data.version }
            - call: "POST /pricing-proposals"
              payload: { submission_id: "${sub_id}", bundle_id: "${bnd_id}", base_price_cents: 12345, term_years: 5, annual_escalator_bps: 250, projected_adoption_units: 20000, digital_seat_price_cents: 1500, expected_submission_version: "${sub_v1}" }
              as: PricingManager
              captures: { prop_id: $.data.id }
          assert:
            - "PricingProposal.${prop_id}.volume_discount_pct == 0.12"
            - "PricingProposal.${prop_id}.term_discount_pct == 0.06"
            - "PricingProposal.${prop_id}.bundle_discount_pct == 0.09"
            - "PricingProposal.${prop_id}.total_discount_pct == 0.20"
            - "PricingProposal.${prop_id}.net_state_price_cents == 51911"
            - "PricingProposal.${prop_id}.net_state_price_cents != 51912"
            - "PricingProposal.${prop_id}.avg_annual_price_cents == 10382"
            - "Submission.${sub_id}.pricing_status == PRICE_FILED"

      - name: order_freight_waiver_evaluated_on_pre_freight_total
        grounds:
          - calculations.order_total_value
          - entities.DistrictOrder.fields.freight_surcharge_cents
          - entities.DistrictOrder.fields.quoted_tcv_cents
          - endpoints[POST /district-orders]
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: 200 copies at 12400 cents give a pre-freight total of
          2480000, below FREIGHT_WAIVER_THRESHOLD_CENTS 2500000, so freight_surcharge_cents == 37200
          and quoted_tcv_cents == 2517200 - deciding the waiver on the post-freight total (2517200,
          above the threshold) would wrongly yield 0 freight and a total of 2480000.
        test_recipe:
          setup:
            - "State AZ is OPEN_TERRITORY, so no price filing is needed to quote"
            - "Title AZ-ELA-7 is ACTIVE with list_price_cents 12400"
            - "No inventory movement is required because quoting never allocates print units"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "AZ", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0 }
              as: PlatformAdmin
              captures: { st_az_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000000701", subject: "ELA", grade_low: 7, grade_high: 7, copyright_year: 2026, content_tags: ["CLOSE_READING"], page_count: 350, signature_page_capacity: 384, list_price_cents: 12400 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
          trigger:
            - call: "POST /district-orders"
              payload: { district_ref: "AZ-D-12", state_id: "${st_az_id}", title_id: "${ttl_id}", print_units: 200, digital_seats: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord_id: $.data.id }
          assert:
            - "DistrictOrder.${ord_id}.freight_surcharge_cents == 37200"
            - "DistrictOrder.${ord_id}.quoted_tcv_cents == 2517200"
            - "DistrictOrder.${ord_id}.quoted_tcv_cents != 2480000"
            - "DistrictOrder.${ord_id}.status == QUOTED"
            - "DistrictOrder.${ord_id}.allocated_units == 0"

      - name: compliance_score_weighted_penalty_stack_with_floor
        grounds:
          - calculations.compliance_score
          - calculations.comment_response_obligation
          - entities.Submission.fields.compliance_score
          - entities.Submission.fields.adoption_blocked
          - state_machines.AdoptionCycle.OPEN_to_CLOSED_FOR_SUBMISSION
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: three CRITICAL and two MINOR comments that all
          escalate drive compliance_score to 100 - 15*3 - 5*5 == 30 and adoption_blocked true, with
          the prohibited and missing-topic terms contributing 0 - the score is a weighted stack over
          four independent counters passed through max(0, ...), not a tiered rate or a rounding order.
          
        test_recipe:
          setup:
            - "State UT is OPEN_TERRITORY with comment_response_days 10, sampling_copies_required 0, min_verified_coverage_pct 50.00, no required_topics and no prohibited_content_tags"
            - "Cycle 2027 is OPEN, the submission is FILED at clock 2026-09-15 with compliance_score 100"
            - "Five public comments (three CRITICAL, two MINOR) are filed at 2026-09-15, all due 2026-09-25 and all still OPEN"
            - "The clock then stands at 2026-10-01, past every response_due_at and at the submission deadline"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "UT", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, comment_response_days: 10, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_ut_id: $.data.id }
            - call: "POST /state-profiles/${st_ut_id}/standards"
              payload: { subject: "SOCIAL_STUDIES", standard_code: "UT.SS.8.1", grade_low: 8, grade_high: 8, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ut_id}"
            - call: "POST /adoption-cycles"
