          setup:
            - "Project FP-2601 permitted with sheet FP-101 ISSUED and submittal SUB-1 APPROVED"
            - "Two acceptance tests exist for the project: AT-1 SYSTEM_FLOW_TEST and AT-2 STANDPIPE_FLOW_TEST, both NOT_SCHEDULED"
            - "AT-1 is booked for 2026-09-10T09:00:00Z to 2026-09-10T11:00:00Z with the project's own reviewer"
