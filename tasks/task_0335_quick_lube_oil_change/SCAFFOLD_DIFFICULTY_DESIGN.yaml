# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Quick Lube & Oil Change — Expert band
# Nine §0.5 rules, >= 2 instances each (20 instances total).
# Every numeric assert literal was computed against the §1.3 formulas
# (integer cents, round_half_up = floor(x + 0.5), tax_rate = 0.0825,
#  max_discount_pct = 0.50).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: work_order_provisional_vs_final_total
        grounds:
          - calculations.work_order_total
          - state_machines.WorkOrder.IN_SERVICE_to_READY
          - entities.WorkOrder.fields.total_cents
        distinguishing_aspect: |
          Same WorkOrder, two valid totals: the provisional total at DRAFT (package only,
          6814 cents) and the FINAL total at READY after a 4495-cent upsell line is accepted
          during inspection (11193 cents) — divergence proves the dual-variant calc on the
          WorkOrder domain.
        test_recipe:
          setup:
            - "Shop (tax 0.0825), CONVENTIONAL package base 6995, one OPEN bay, one technician."
            - "PERCENT coupon SAVE10 at 10% per-line, min_subtotal 0, usage_limit 5, applied to a DRAFT order."
            - "AIR_FILTER inspection item priced 4495; vehicle registered (retail, no fleet)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic Oil", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /inspection-items"
              payload: { shop_id: "${shop_id}", code: "AIR_FILTER", name: "Air Filter", price_cents: 4495, labor_minutes: 5 }
              as: ShopManager
              captures: { item_id: $.data.id }
            - call: "POST /coupons"
              payload: { shop_id: "${shop_id}", code: "SAVE10", discount_type: "PERCENT", percent_value: 0.10, min_subtotal_cents: 0, usage_limit: 5 }
              as: ShopManager
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINPROV001", plate: "PRV1", make: "Honda", model: "Civic", odometer: 30000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 30000, coupon_code: "SAVE10" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, prov_total: $.data.total_cents }
          trigger:
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v_after_start: $.data.version }
            - call: "POST /work-orders/${wo_id}/begin-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v_after_begin: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { inspection_item_id: "${item_id}", expected_work_order_version: "${wo_v_after_begin}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/finish-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { final_total: $.data.total_cents }
          assert:
            - "provisional WorkOrder.${wo_id}.total_cents == 6814 right after POST /work-orders (package 6995, coupon -700, taxable 6295, tax 519)"
            - "final WorkOrder.${wo_id}.total_cents == 11193 after mark-ready (subtotal 11490, coupon -1150, taxable 10340, tax 853)"
            - "WorkOrder.${wo_id}.subtotal_cents == 11490 after mark-ready"

      - name: fleet_reserved_vs_settled_available_credit
        grounds:
          - calculations.fleet_available_credit
          - entities.FleetAccount.fields.reserved_credit_cents
          - entities.FleetAccount.fields.settled_credit_cents
        distinguishing_aspect: |
          Same FleetAccount, two valid aggregations over its work orders: reserved_credit_cents
          counts AUTHORIZED+PAID (18008 reserved) while settled_credit_cents counts only PAID
          (6814 settled) — divergence proves the dual-variant calc on the FleetAccount domain,
          a different entity than the WorkOrder dual-variant.
        test_recipe:
          setup:
            - "Shop, FleetAccount discount 0.10 credit_limit 100000, two fleet vehicles."
            - "WorkOrder A (package 6995 + AIR_FILTER 4495, fleet 10%) authorized via FLEET_ACCOUNT for total 11194 (AUTHORIZED, not captured)."
            - "WorkOrder B (package 6995 only, fleet 10%) authorized+captured (PAID) via FLEET_ACCOUNT for total 6814."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /inspection-items"
              payload: { shop_id: "${shop_id}", code: "AIR_FILTER", name: "Air Filter", price_cents: 4495, labor_minutes: 5 }
              as: ShopManager
              captures: { item_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { shop_id: "${shop_id}", company_name: "Acme", discount_pct: 0.10, credit_limit_cents: 100000 }
              as: ShopManager
              captures: { fleet_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_a: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 2" }
              as: ShopManager
              captures: { bay_b: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", fleet_account_id: "${fleet_id}", vin: "VINFLA001", plate: "FLA1", make: "Ford", model: "F150", odometer: 20000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { veh_a: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", fleet_account_id: "${fleet_id}", vin: "VINFLA002", plate: "FLA2", make: "Ford", model: "F250", odometer: 25000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { veh_b: $.data.id }
            # --- Work order A: package 6995 + AIR_FILTER 4495 = subtotal 11490, fleet 10% per calc => total 10656 ---
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_a}", bay_id: "${bay_a}", package_id: "${pkg_id}", odometer_in: 20000 }
              as: ServiceAdvisor
              captures: { wo_a: $.data.id }
            - call: "POST /work-orders/${wo_a}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_a_v1: $.data.version }
            - call: "POST /work-orders/${wo_a}/begin-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_a_v2: $.data.version }
            - call: "POST /work-orders/${wo_a}/lines"
              payload: { inspection_item_id: "${item_id}", expected_work_order_version: "${wo_a_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/finish-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/authorize"
              payload: { payment_method: "FLEET_ACCOUNT" }
              as: ServiceAdvisor
            # --- Work order B: package 6995 only, fleet 10% => subtotal 6995, fleet round(699.5)=700, taxable 6295, tax 519, total 6814? recompute below ---
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_b}", bay_id: "${bay_b}", package_id: "${pkg_id}", odometer_in: 25000 }
              as: ServiceAdvisor
              captures: { wo_b: $.data.id }
            - call: "POST /work-orders/${wo_b}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_b}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_b}/begin-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_b_v2: $.data.version }
            - call: "POST /work-orders/${wo_b}/lines"
              payload: { inspection_item_id: "${item_id}", expected_work_order_version: "${wo_b_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_b}/finish-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_b}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_b}/authorize"
              payload: { payment_method: "FLEET_ACCOUNT" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_b}/capture-payment"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { reserved: $.data.reserved_credit_cents, settled: $.data.settled_credit_cents }
          assert:
            - "FleetAccount.${fleet_id}.reserved_credit_cents == 18008 (WO_A 11194 AUTHORIZED + WO_B 6814 PAID)"
            - "FleetAccount.${fleet_id}.settled_credit_cents == 6814 (only WO_B PAID)"
            - "reserved_available (100000 - 18008 = 81992) != settled_available (100000 - 6814 = 93186)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: discount_stacking_max_vs_sum_with_cap
        grounds:
          - calculations.work_order_total
          - entities.Coupon.fields.stackable_with_fleet
          - entities.WorkOrder.fields.total_discount_cents
        distinguishing_aspect: |
          Mode (a): non-linear interaction of >=3 inputs — coupon FLAT 1500, fleet 10% (1149),
          stackable flag, and the 50%-subtotal cap combine as min(max-or-sum, cap). With a
          non-stackable coupon the discount is max(1500,1149)=1500, not the sum 2649.
        test_recipe:
          setup:
            - "Shop tax 0.0825 max_discount_pct 0.50; FleetAccount discount 0.10; fleet vehicle."
            - "Coupon FLAT15 flat 1500, stackable_with_fleet=false; package 6995 + AIR_FILTER 4495 => subtotal 11490."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /inspection-items"
              payload: { shop_id: "${shop_id}", code: "AIR_FILTER", name: "Air Filter", price_cents: 4495, labor_minutes: 5 }
              as: ShopManager
              captures: { item_id: $.data.id }
            - call: "POST /coupons"
              payload: { shop_id: "${shop_id}", code: "FLAT15", discount_type: "FLAT", flat_cents: 1500, min_subtotal_cents: 0, stackable_with_fleet: false, usage_limit: 5 }
              as: ShopManager
            - call: "POST /fleet-accounts"
              payload: { shop_id: "${shop_id}", company_name: "Acme", discount_pct: 0.10, credit_limit_cents: 100000 }
              as: ShopManager
              captures: { fleet_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", fleet_account_id: "${fleet_id}", vin: "VINSTK001", plate: "STK1", make: "Ford", model: "F150", odometer: 20000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 20000, coupon_code: "FLAT15" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/begin-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { inspection_item_id: "${item_id}", expected_work_order_version: "${wo_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/finish-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { discount: $.data.total_discount_cents, total: $.data.total_cents }
          assert:
            - "WorkOrder.${wo_id}.subtotal_cents == 11490"
            - "WorkOrder.${wo_id}.coupon_discount_cents == 1500 and fleet_discount_cents == 1149"
            - "WorkOrder.${wo_id}.total_discount_cents == 1500 (max, NOT sum 2649)"
            - "WorkOrder.${wo_id}.total_cents == 10814 (taxable 9990, tax 824)"

      - name: percent_coupon_per_line_rounding_order
        grounds:
          - calculations.work_order_total
          - entities.WorkOrderLine.fields.price_cents
          - entities.Coupon.fields.discount_type
        distinguishing_aspect: |
          Mode (b): nested-rounding order. Coupon 10% on package 6995 + lines 4495 + 2895
          rounds PER LINE then sums (700+450+290 = 1440) — diverges from round(subtotal*0.10)
          = round(14385*0.10) = 1439. The scaffold pins per-line; the assert is 1440 not 1439.
        test_recipe:
          setup:
            - "Shop tax 0.0825; CONVENTIONAL package base 6995; PERCENT coupon SAVE10 at 10%."
            - "Two upsell items priced 4495 and 2895 added during inspection (subtotal 14385)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /inspection-items"
              payload: { shop_id: "${shop_id}", code: "AIR_FILTER", name: "Air Filter", price_cents: 4495, labor_minutes: 5 }
              as: ShopManager
              captures: { item_a: $.data.id }
            - call: "POST /inspection-items"
              payload: { shop_id: "${shop_id}", code: "CABIN_FILTER", name: "Cabin Filter", price_cents: 2895, labor_minutes: 5 }
              as: ShopManager
              captures: { item_b: $.data.id }
            - call: "POST /coupons"
              payload: { shop_id: "${shop_id}", code: "SAVE10", discount_type: "PERCENT", percent_value: 0.10, min_subtotal_cents: 0, usage_limit: 5 }
              as: ShopManager
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINRND001", plate: "RND1", make: "Toyota", model: "Camry", odometer: 40000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 40000, coupon_code: "SAVE10" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/begin-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { inspection_item_id: "${item_a}", expected_work_order_version: "${wo_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v_mid: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { inspection_item_id: "${item_b}", expected_work_order_version: "${wo_v_mid}" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/finish-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { discount: $.data.coupon_discount_cents }
          assert:
            - "WorkOrder.${wo_id}.subtotal_cents == 14385"
            - "WorkOrder.${wo_id}.coupon_discount_cents == 1440 (per-line 700+450+290, NOT sum-then-round 1439)"
            - "WorkOrder.${wo_id}.total_cents == 14013 (taxable 12945, tax 1068)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_parallel_service_x_payment_dimensions
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_READY
          - state_machines.WorkOrder.UNPAID_to_AUTHORIZED
          - entities.WorkOrder.fields.payment_status
        distinguishing_aspect: |
          WorkOrder carries two independent state axes: service_status (DRAFT->IN_SERVICE->
          INSPECTION->IN_SERVICE->READY) and payment_status (UNPAID->AUTHORIZED). The order can
          be AUTHORIZED while service_status is still INSPECTION, then advance service to READY —
          proving parallel dimensions on the WorkOrder entity.
        test_recipe:
          setup:
            - "DRAFT order on a CONVENTIONAL package, technician claimed, advanced to INSPECTION."
            - "Authorized for CASH while in INSPECTION (payment dimension moves, service dimension does not)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINPAR001", plate: "PAR1", make: "Mazda", model: "3", odometer: 10000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 10000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/begin-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/authorize"
              payload: { payment_method: "CASH" }
              as: ServiceAdvisor
              captures: { pay_status_mid: $.data.payment_status, svc_status_mid: $.data.service_status }
            - call: "POST /work-orders/${wo_id}/finish-inspection"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { svc_final: $.data.service_status, pay_final: $.data.payment_status }
          assert:
            - "after authorize WorkOrder.${wo_id}.payment_status == AUTHORIZED while service_status == INSPECTION"
            - "after mark-ready WorkOrder.${wo_id}.service_status == READY and payment_status == AUTHORIZED (unchanged by the service-dimension move)"

      - name: queue_ticket_cyclic_assign_requeue_reassign
        grounds:
          - state_machines.QueueTicket.WAITING_to_ASSIGNED
          - state_machines.QueueTicket.ASSIGNED_to_WAITING
          - entities.QueueTicket.fields.status
        distinguishing_aspect: |
          QueueTicket cycles ASSIGNED -> WAITING -> ASSIGNED: assigning to a bay, requeuing
          (cancels the DRAFT order, frees the bay), then re-assigning to a bay returns it to
          ASSIGNED — a cyclic shape on the QueueTicket entity, distinct from the WorkOrder
          parallel machine.
        test_recipe:
          setup:
            - "Shop, one OPEN bay, vehicle, package; a WAITING queue ticket."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINCYC001", plate: "CYC1", make: "Kia", model: "Rio", odometer: 5000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /queue-tickets"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", requested_package_id: "${pkg_id}" }
              as: ServiceAdvisor
              captures: { tkt_id: $.data.id }
            - call: "POST /queue-tickets/${tkt_id}/assign"
              payload: { bay_id: "${bay_id}", expected_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
            - call: "POST /queue-tickets/${tkt_id}/requeue"
              payload: {}
              as: ServiceAdvisor
              captures: { status_after_requeue: $.data.status }
            - call: "GET /bays/${bay_id}"
              payload: {}
              as: ServiceAdvisor
              captures: { bay_v1: $.data.version }
          trigger:
            - call: "POST /queue-tickets/${tkt_id}/assign"
              payload: { bay_id: "${bay_id}", expected_bay_version: "${bay_v1}" }
              as: ServiceAdvisor
              captures: { status_after_reassign: $.data.status }
          assert:
            - "after requeue QueueTicket.${tkt_id}.status == WAITING and work_order_id == null"
            - "after re-assign QueueTicket.${tkt_id}.status == ASSIGNED (cycle completed)"
            - "Bay.${bay_id}.status == OCCUPIED after re-assign"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_frees_bay_promotes_next_queue_ticket
        grounds:
          - state_machines.WorkOrder.READY_to_COMPLETED
          - state_machines.Bay.OCCUPIED_to_OPEN
          - state_machines.QueueTicket.WAITING_to_ASSIGNED
        distinguishing_aspect: |
          Depth-3 chain: completing WO_A (READY->COMPLETED) frees its Bay (OCCUPIED->OPEN);
          the bay freeing itself triggers promotion of the lowest-queue_seq WAITING ticket
          (WAITING->ASSIGNED) which creates a new DRAFT WorkOrder and re-occupies that bay.
          Each link is caused by the previous, not by the complete action directly.
        test_recipe:
          setup:
            - "Shop with exactly ONE bay; WO_A occupies it, fully paid and READY."
            - "A second vehicle queued (WAITING) so a promotion target exists when the bay frees."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
