            - call: "POST /floodplain/repetitive-loss-areas/${rla_id}/analyze"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${rla_id}/designate"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
