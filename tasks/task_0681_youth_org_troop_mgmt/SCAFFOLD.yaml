# =============================================================================
# PRD Benchmark Scaffold — Youth Organization & Troop Management
# Difficulty: Expert
# =============================================================================

scenario: |
  Youth Organization & Troop Management (Scouts BSA/Girl Scouts style): member/troop
  registration & dues, rank/badge advancement & requirement tracking, leader
  background-check & training, event/campout & permission/health form, product
  fundraiser (cookies/popcorn) & inventory/booth, recharter & roster, fund accounting,
  council reporting

domain_name: youth-org-troop-mgmt
api_prefix: ""   # flat multi-root topology: councils, troops, members, fundraisers, etc. are all top-level resources

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation        # dues proration vs recharter fee; revenue forward vs chronological
    - cascading_side_effects          # advancement approval / leader expiry / event lockdown chains
    - rate_threshold_triggers         # advancement requirement completion %, fundraiser tier rates
    - optimistic_concurrency          # OCC on Troop.version and Fundraiser.version
    - derived_field_reconciliation    # Troop.recharter_posture, fund ledger balances
  entity_topology: hybrid
  # Council -> Troop -> Member strict tree, plus cross-cutting Fundraiser / Event /
  # Booth associations that span the tree and reference members directly.
  state_machine_shape: compound
  # Advancement is cyclic (revision loop); EventRegistration has parallel permission ×
  # health dimensions; Troop recharter_posture is compound (derived from member/leader state).
  relationship_patterns:
    - one_to_many        # Council->Troop, Troop->Member, Event->EventRegistration
    - cross_aggregate    # FundraiserOrder references Member across the Troop boundary
    - polymorphic        # FundLedgerEntry.source_ref_id points at Payment | FundraiserOrder | DuesInvoice
  role_model: segregation_of_duties
  # The leader who submits an Advancement cannot approve it; the requester of a
  # BackgroundCheck cannot clear it. Council vs Troop scoping is enforced per-role.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Council
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Council name" }
      - { name: charter_fee_cents, type: integer, source: input, description: "Per-troop annual recharter base fee in cents", constraints: ">= 0" }
      - { name: youth_dues_cents, type: integer, source: input, description: "Annual youth membership dues in cents", constraints: ">= 0" }
      - { name: adult_dues_cents, type: integer, source: input, description: "Annual adult membership dues in cents", constraints: ">= 0" }
      - { name: fund_cash_cents, type: integer, source: computed, description: "Council-retained cash balance in cents; sum over FundLedgerEntry.amount_cents where account=COUNCIL_CASH", default: 0 }
      - { name: fund_liability_cents, type: integer, source: computed, description: "Council product liability owed to supplier in cents; sum over FundLedgerEntry.amount_cents where account=PRODUCT_LIABILITY", default: 0 }
      - { name: program_year, type: integer, source: input, description: "Active program year, e.g. 2026", constraints: ">= 2000" }

  - name: Troop
    parent: Council
    common_fields: true
    fields:
      - { name: council_id, type: string, source: system, description: "FK -> Council.id" }
      - { name: unit_number, type: string, source: input, description: "Unit number, unique within council" }
      - { name: program_type, type: enum, source: input, description: "CUB | SCOUTS | VENTURING" }
      - { name: charter_status, type: enum, source: system, description: "PROVISIONAL | CHARTERED | LAPSED | DROPPED — lifecycle status", default: PROVISIONAL }
      - { name: recharter_posture, type: enum, source: computed, description: "READY | BLOCKED | EXPIRED — derived gate: READY iff registered_youth_count >= MIN_YOUTH (5) AND cleared_leader_count >= MIN_LEADERS (2); else BLOCKED; EXPIRED once charter_expires_at < clock_now. Constants pinned: MIN_YOUTH=5, MIN_LEADERS=2." }
      - { name: registered_youth_count, type: integer, source: computed, description: "count of Member with member_type=YOUTH and registration_status=REGISTERED in this troop", default: 0 }
      - { name: cleared_leader_count, type: integer, source: computed, description: "count of Member with member_type=ADULT in this troop holding a LeaderCredential with bgcheck_status=CLEARED and training_status=TRAINED", default: 0 }
      - { name: charter_expires_at, type: datetime, source: system, description: "UTC instant the current charter expires; set on CHARTERED transition to program_year-end" }
      - { name: dues_account_cents, type: integer, source: computed, description: "Troop-held dues funds in cents; sum over FundLedgerEntry.amount_cents where account=TROOP_DUES and troop_id matches", default: 0 }
      - { name: version, type: integer, source: system, description: "OCC version. Increments by 1 on EVERY mutation that touches this troop's persisted or recomputed fields — including child-driven recomputes of registered_youth_count, cleared_leader_count, recharter_posture, or dues_account_cents (member register/suspend/reinstate/drop, leader bgcheck/training resolution, fundraiser order place/cancel/fill affecting TROOP_DUES) — so a stale expected_troop_version reliably fails OCC." }

  - name: Member
    parent: Troop
    common_fields: true
    fields:
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id" }
      - { name: member_type, type: enum, source: input, description: "YOUTH | ADULT" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: birthdate, type: string, source: input, description: "ISO date YYYY-MM-DD; used for youth age eligibility" }
      - { name: rank, type: enum, source: computed, description: "SCOUT | TENDERFOOT | SECOND_CLASS | FIRST_CLASS — current rank; advances when a rank Advancement is APPROVED", default: SCOUT }
      - { name: registration_status, type: enum, source: system, description: "PENDING | REGISTERED | SUSPENDED | DROPPED — dues drive PENDING->REGISTERED", default: PENDING }
      - { name: dues_paid_cents, type: integer, source: computed, description: "Cumulative dues paid by this member in cents; sum over Payment.amount_cents where status=POSTED", default: 0 }

  - name: DuesInvoice
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id; denormalized for troop-scoped fund routing" }
      - { name: amount_cents, type: integer, source: computed, description: "Invoice amount in cents from dues proration calculation at issuance" }
      - { name: issued_on, type: string, source: input, description: "ISO date the invoice covers from; proration anchor" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOID", default: OPEN }

  - name: Payment
    parent: DuesInvoice
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> DuesInvoice.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "POSTED — append-only payment record (payments are never reversed in v1; commission reversals are separate FundLedgerEntry REVERSAL rows, not Payment status changes)", default: POSTED }

  - name: LeaderCredential
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member MUST be member_type=ADULT" }
      - { name: requested_by_user_id, type: string, source: input, description: "X-User-ID of the TroopLeader who opened the credential; segregation-of-duties anchor" }
      - { name: bgcheck_status, type: enum, source: system, description: "NOT_STARTED | PENDING | CLEARED | FLAGGED — background-check dimension", default: NOT_STARTED }
      - { name: training_status, type: enum, source: system, description: "UNTRAINED | TRAINED — youth-protection training dimension", default: UNTRAINED }
      - { name: training_expires_at, type: datetime, source: system, description: "UTC instant training lapses; set TRAINING_VALID_DAYS after the COMPLETE_TRAINING transition" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Advancement
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: kind, type: enum, source: input, description: "RANK | BADGE" }
      - { name: target, type: enum, source: input, description: "For RANK: TENDERFOOT | SECOND_CLASS | FIRST_CLASS. For BADGE: any string in badge_code" }
      - { name: badge_code, type: string, source: input, description: "Merit-badge code when kind=BADGE; null for RANK", default: null }
      - { name: requirements_total, type: integer, source: input, description: "Number of requirements in this advancement", constraints: ">= 1" }
      - { name: requirements_signed, type: integer, source: computed, description: "Count of requirements signed off; advances via SIGN_REQUIREMENT", default: 0 }
      - { name: completion_pct, type: number, source: computed, description: "= round(requirements_signed / requirements_total * 100, 2)", default: 0 }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the leader who SUBMITTED; segregation-of-duties anchor for approval" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | APPROVED — cyclic SUBMITTED<->RETURNED revision loop", default: DRAFT }

  - name: Event
    parent: Troop
    common_fields: true
    fields:
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id" }
      - { name: title, type: string, source: input, description: "Event/campout title" }
      - { name: starts_at, type: datetime, source: input, description: "UTC event start" }
      - { name: ends_at, type: datetime, source: input, description: "UTC event end; MUST be > starts_at" }
      - { name: requires_health_form, type: boolean, source: input, description: "If true, each registration MUST clear the health dimension before CONFIRMED", default: true }
      - { name: capacity, type: integer, source: input, description: "Max CONFIRMED registrations", constraints: ">= 1" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of EventRegistration with status=CONFIRMED", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CANCELLED — LOCKED freezes new confirmations", default: OPEN }

  - name: EventRegistration
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: permission_status, type: enum, source: system, description: "UNSIGNED | SIGNED — parallel dimension: guardian permission form", default: UNSIGNED }
      - { name: health_status, type: enum, source: system, description: "MISSING | ON_FILE — parallel dimension: health form", default: MISSING }
      - { name: status, type: enum, source: system, description: "HOLD | CONFIRMED | CANCELLED — CONFIRMED requires both dimensions satisfied", default: HOLD }

  - name: Fundraiser
    parent: Council
    common_fields: true
    fields:
      - { name: council_id, type: string, source: system, description: "FK -> Council.id" }
      - { name: product, type: enum, source: input, description: "COOKIES | POPCORN" }
      - { name: unit_price_cents, type: integer, source: input, description: "Retail price per unit in cents", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Supplier cost per unit in cents (product liability)", constraints: ">= 0" }
      - { name: total_inventory_units, type: integer, source: input, description: "Total units the council released to the fundraiser", constraints: ">= 0" }
      - { name: allocated_units, type: integer, source: computed, description: "Sum of units across FundraiserOrder in PLACED or FILLED status", default: 0 }
      - { name: available_units, type: integer, source: computed, description: "= total_inventory_units - allocated_units" }
      - { name: status, type: enum, source: system, description: "DRAFT | LIVE | CLOSED — only LIVE accepts orders", default: DRAFT }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FundraiserOrder
    parent: Fundraiser
    common_fields: true
    fields:
      - { name: fundraiser_id, type: string, source: system, description: "FK -> Fundraiser.id" }
      - { name: troop_id, type: string, source: input, description: "FK -> Troop.id; selling troop" }
      - { name: seller_member_id, type: string, source: input, description: "FK -> Member.id; member credited with the sale" }
      - { name: units, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: gross_cents, type: integer, source: computed, description: "= units * Fundraiser.unit_price_cents at placement" }
      - { name: troop_commission_cents, type: integer, source: computed, description: "Tiered commission credited to the troop dues account" }
      - { name: status, type: enum, source: system, description: "PLACED | FILLED | CANCELLED — FILLED on delivery, CANCELLED releases inventory", default: PLACED }

  - name: BoothReservation
    parent: Fundraiser
    common_fields: true
    fields:
      - { name: fundraiser_id, type: string, source: system, description: "FK -> Fundraiser.id" }
      - { name: troop_id, type: string, source: input, description: "FK -> Troop.id; reserving troop" }
      - { name: location_code, type: string, source: input, description: "Booth location identifier; overlap is scoped per location_code" }
      - { name: starts_at, type: datetime, source: input, description: "UTC booth slot start" }
      - { name: ends_at, type: datetime, source: input, description: "UTC booth slot end; MUST be > starts_at" }
      - { name: status, type: enum, source: system, description: "BOOKED | RELEASED — RELEASED frees the slot", default: BOOKED }

  - name: FundLedgerEntry
    parent: Council
    common_fields: false
    fields:
      - { name: council_id, type: string, source: system, description: "FK -> Council.id" }
      - { name: troop_id, type: string, source: input, description: "FK -> Troop.id; null for council-only accounts", default: null }
      - { name: account, type: enum, source: input, description: "COUNCIL_CASH | PRODUCT_LIABILITY | TROOP_DUES" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount in cents; positive credit, negative debit" }
      - { name: source_kind, type: enum, source: input, description: "PAYMENT | FUNDRAISER_ORDER | RECHARTER | REVERSAL — polymorphic source; PAYMENT (dues into TROOP_DUES), FUNDRAISER_ORDER (commission into TROOP_DUES, plus cash/liability on fill), RECHARTER (charter-fee sweep), REVERSAL (commission unwound on order cancel/fundraiser close)" }
      - { name: source_ref_id, type: string, source: input, description: "Id of the originating Payment | FundraiserOrder | Troop; polymorphic, not an FK constraint" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: [DROPPED]
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /payments posts a Payment fully covering the member's OPEN DuesInvoice"
        actor: system
        preconditions:
          - "member has a DuesInvoice in status=OPEN"
          - "cumulative POSTED Payment.amount_cents for the invoice >= DuesInvoice.amount_cents"
        side_effects:
          - "DuesInvoice.status -> PAID"
          - "Member.registration_status -> REGISTERED"
          - "Troop.registered_youth_count recomputed (if member_type=YOUTH)"
          - "Troop.recharter_posture recomputed"
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /members/{id}/suspend"
        actor: TroopLeader
        preconditions: ["member.registration_status == REGISTERED"]
        side_effects:
          - "Member.registration_status -> SUSPENDED"
          - "Troop.registered_youth_count recomputed (if member_type=YOUTH)"
          - "Troop.recharter_posture recomputed"
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /members/{id}/reinstate"
        actor: TroopLeader
        preconditions: ["member.registration_status == SUSPENDED"]
        side_effects:
          - "Member.registration_status -> REGISTERED"
          - "Troop.registered_youth_count recomputed (if member_type=YOUTH)"
          - "Troop.recharter_posture recomputed"
      - from: REGISTERED
        to: DROPPED
        trigger: "POST /members/{id}/drop"
        actor: TroopLeader
        preconditions: ["member.registration_status IN {REGISTERED, SUSPENDED, PENDING}"]
        side_effects:
          - "Member.registration_status -> DROPPED"
          - "all OPEN DuesInvoice for member -> VOID"
          - "Troop.registered_youth_count recomputed (if member_type=YOUTH)"
          - "Troop.cleared_leader_count recomputed (if member_type=ADULT)"
          - "Troop.recharter_posture recomputed"
      - from: SUSPENDED
        to: DROPPED
        trigger: "POST /members/{id}/drop"
        actor: TroopLeader
        preconditions: ["member.registration_status == SUSPENDED"]
        side_effects:
          - "Member.registration_status -> DROPPED"
          - "Troop.recharter_posture recomputed"

  - entity: LeaderCredential
    initial_state: NOT_STARTED
    terminal_states: []
    note: "bgcheck_status is the lifecycle axis; training_status evolves as an independent state dimension on the same row."
    transitions:
      - from: NOT_STARTED
        to: PENDING
        trigger: "POST /leader-credentials/{id}/start-bgcheck"
        actor: CouncilRegistrar
        preconditions: ["bgcheck_status == NOT_STARTED"]
        side_effects: ["bgcheck_status -> PENDING"]
      - from: PENDING
        to: CLEARED
        trigger: "POST /leader-credentials/{id}/resolve-bgcheck with outcome=CLEAR"
        actor: CouncilRegistrar
        preconditions:
          - "bgcheck_status == PENDING"
          - "acting X-User-ID != LeaderCredential.requested_by_user_id (segregation of duties)"
        side_effects:
          - "bgcheck_status -> CLEARED"
          - "Troop.cleared_leader_count recomputed (only counts when training_status==TRAINED)"
          - "Troop.recharter_posture recomputed"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /leader-credentials/{id}/resolve-bgcheck with outcome=FLAG"
        actor: CouncilRegistrar
        preconditions:
          - "bgcheck_status == PENDING"
          - "acting X-User-ID != LeaderCredential.requested_by_user_id (segregation of duties)"
        side_effects:
          - "bgcheck_status -> FLAGGED"
          - "Troop.cleared_leader_count recomputed"
          - "Troop.recharter_posture recomputed"
      - from: UNTRAINED
        to: TRAINED
        trigger: "POST /leader-credentials/{id}/complete-training"
        actor: CouncilRegistrar
        preconditions: ["training_status == UNTRAINED"]
        side_effects:
          - "training_status -> TRAINED"
          - "training_expires_at = clock_now + TRAINING_VALID_DAYS"
          - "Troop.cleared_leader_count recomputed (only counts when bgcheck_status==CLEARED)"
          - "Troop.recharter_posture recomputed"

  - entity: Advancement
    initial_state: DRAFT
    terminal_states: [APPROVED]
    note: "Cyclic: SUBMITTED -> RETURNED -> SUBMITTED revision loop until APPROVED."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /advancements/{id}/submit"
        actor: TroopLeader
        preconditions:
          - "advancement.status == DRAFT"
          - "requirements_signed == requirements_total (completion_pct == 100)"
        side_effects:
          - "status -> SUBMITTED"
          - "submitted_by_user_id = acting X-User-ID"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /advancements/{id}/return"
        actor: CouncilRegistrar
        preconditions:
          - "advancement.status == SUBMITTED"
        side_effects:
          - "status -> RETURNED"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /advancements/{id}/submit"
        actor: TroopLeader
        preconditions:
          - "advancement.status == RETURNED"
          - "requirements_signed == requirements_total"
        side_effects:
          - "status -> SUBMITTED"
          - "submitted_by_user_id = acting X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /advancements/{id}/approve"
        actor: CouncilRegistrar
        preconditions:
          - "advancement.status == SUBMITTED"
          - "acting X-User-ID != advancement.submitted_by_user_id (segregation of duties)"
          - "member.registration_status == REGISTERED"
        side_effects:
          - "status -> APPROVED"
          - "if kind==RANK: Member.rank -> target"

  - entity: Event
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /events/{id}/lock"
        actor: TroopLeader
        preconditions: ["event.status == OPEN"]
        side_effects: ["status -> LOCKED (no further CONFIRMED transitions allowed)"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: TroopLeader
        preconditions: ["event.status IN {OPEN, LOCKED}"]
        side_effects:
          - "status -> CANCELLED"
          - "every EventRegistration in {HOLD, CONFIRMED} for this event -> CANCELLED"
          - "Event.confirmed_count recomputed to 0"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: TroopLeader
        preconditions: ["event.status == LOCKED"]
        side_effects:
          - "status -> CANCELLED"
          - "every EventRegistration in {HOLD, CONFIRMED} -> CANCELLED"
          - "Event.confirmed_count recomputed to 0"

  - entity: EventRegistration
    initial_state: HOLD
    terminal_states: [CANCELLED]
    note: "permission_status and health_status are parallel dimensions; status=CONFIRMED requires both satisfied."
    transitions:
      - from: HOLD
        to: HOLD
        trigger: "POST /event-registrations/{id}/sign-permission"
        actor: TroopLeader
        preconditions: ["permission_status == UNSIGNED", "registration.status == HOLD"]
        side_effects: ["permission_status -> SIGNED"]
      - from: HOLD
        to: HOLD
        trigger: "POST /event-registrations/{id}/file-health"
        actor: TroopLeader
        preconditions: ["health_status == MISSING", "registration.status == HOLD"]
        side_effects: ["health_status -> ON_FILE"]
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /event-registrations/{id}/confirm"
        actor: TroopLeader
        preconditions:
          - "registration.status == HOLD"
          - "permission_status == SIGNED"
          - "Event.requires_health_form == false OR health_status == ON_FILE"
          - "Event.status == OPEN"
          - "Event.confirmed_count < Event.capacity"
          - "Member.registration_status == REGISTERED"
        side_effects:
          - "status -> CONFIRMED"
          - "Event.confirmed_count += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /event-registrations/{id}/cancel"
        actor: TroopLeader
        preconditions: ["registration.status == CONFIRMED"]
        side_effects:
          - "status -> CANCELLED"
          - "Event.confirmed_count -= 1"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /event-registrations/{id}/cancel"
        actor: TroopLeader
        preconditions: ["registration.status == HOLD"]
        side_effects: ["status -> CANCELLED"]

  - entity: Fundraiser
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /fundraisers/{id}/go-live"
        actor: CouncilRegistrar
        preconditions: ["fundraiser.status == DRAFT", "total_inventory_units >= 1"]
        side_effects: ["status -> LIVE"]
      - from: LIVE
        to: CLOSED
        trigger: "POST /fundraisers/{id}/close"
        actor: CouncilRegistrar
        preconditions: ["fundraiser.status == LIVE"]
        side_effects:
          - "status -> CLOSED"
          - "every FundraiserOrder in status=PLACED for this fundraiser -> CANCELLED"
          - "for each auto-cancelled order: allocated_units recomputed, available_units recomputed"
          - "for each auto-cancelled order: reverse troop_commission_cents from TROOP_DUES (FundLedgerEntry source_kind=REVERSAL)"

  - entity: FundraiserOrder
    initial_state: PLACED
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: FILLED
        trigger: "POST /fundraiser-orders/{id}/fill"
        actor: TroopLeader
        preconditions: ["order.status == PLACED", "Fundraiser.status == LIVE"]
        side_effects:
          - "status -> FILLED"
          - "FundLedgerEntry +gross_cents to COUNCIL_CASH (source_kind=FUNDRAISER_ORDER)"
          - "FundLedgerEntry +(units*unit_cost_cents) to PRODUCT_LIABILITY (source_kind=FUNDRAISER_ORDER)"
          - "Troop.dues_account_cents reflects the already-credited troop_commission_cents"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /fundraiser-orders/{id}/cancel"
        actor: TroopLeader
        preconditions: ["order.status == PLACED"]
        side_effects:
          - "status -> CANCELLED"
          - "Fundraiser.allocated_units -= units; Fundraiser.available_units recomputed"
          - "reverse troop_commission_cents from TROOP_DUES (FundLedgerEntry source_kind=REVERSAL)"
          - "Troop.dues_account_cents recomputed"

  - entity: Troop
    initial_state: PROVISIONAL
    terminal_states: [DROPPED]
    note: "recharter_posture is a compound derived field recomputed by member/leader transitions; charter_status is the explicit lifecycle."
    transitions:
      - from: PROVISIONAL
        to: CHARTERED
        trigger: "POST /troops/{id}/recharter"
        actor: CouncilRegistrar
        preconditions:
          - "troop.charter_status IN {PROVISIONAL, LAPSED}"
          - "troop.recharter_posture == READY"
          - "expected_troop_version matches Troop.version (OCC)"
        side_effects:
          - "charter_status -> CHARTERED"
          - "charter_expires_at = end of Council.program_year (Dec 31 23:59:59Z of program_year)"
          - "FundLedgerEntry -charter_fee_cents from TROOP_DUES, +charter_fee_cents to COUNCIL_CASH (source_kind=RECHARTER)"
          - "Troop.dues_account_cents recomputed; Council.fund_cash_cents recomputed"
          - "increments Troop.version by 1"
      - from: CHARTERED
        to: LAPSED
        trigger: "POST /troops/{id}/lapse (or system when charter_expires_at passes and re-evaluated)"
        actor: CouncilRegistrar
        preconditions: ["troop.charter_status == CHARTERED"]
        side_effects:
          - "charter_status -> LAPSED"
          - "increments Troop.version by 1"
      - from: LAPSED
        to: DROPPED
        trigger: "POST /troops/{id}/drop"
        actor: CouncilRegistrar
        preconditions: ["troop.charter_status == LAPSED"]
        side_effects:
          - "charter_status -> DROPPED"
          - "increments Troop.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: recharter-stale-troop
    parent_entity: Troop
    write_endpoint: "POST /troops/{id}/recharter"
    occ_field: "expected_troop_version"
    description: |
      Rechartering a Troop whose version has advanced since the client last
      observed it is rejected. A LeaderCredential clearance, a member drop, or a
      dues payment can recompute the troop's recharter_posture and bump its
      version between the client's read and this write; a recharter request that
      carries a stale expected_troop_version is rejected so the operator
      re-reads the posture before committing the charter.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-place-stale-fundraiser
    parent_entity: Fundraiser
    write_endpoint: "POST /fundraiser-orders"
    occ_field: "expected_fundraiser_version"
    description: |
      Placing a FundraiserOrder against a Fundraiser whose version has advanced
      since the client last observed it is rejected. Each go-live, order
      placement, or order cancellation recomputes allocated_units/available_units
      and bumps the fundraiser version; a place request carrying a stale
      expected_fundraiser_version is rejected so the seller re-reads available
      inventory before committing the allocation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dues_proration
    trigger: "POST /members/{id}/dues-invoices issues a DuesInvoice; computes amount_cents"
    algorithm: threshold
    formula: |
      base = (member_type == YOUTH) ? Council.youth_dues_cents : Council.adult_dues_cents
      # whole-month proration from issued_on to program-year end (Dec 31)
      months_remaining = 12 - (month_of(issued_on) - 1)   # Jan->12, Dec->1; clamp [1,12]
      if months_remaining >= FULL_DUES_MONTHS:             # >= 9 months => full dues, NO discount
          amount = base
      else:
          # round per-line: round the single proration once, half-up
          amount = round_half_up(base * months_remaining / 12)
      return amount   # integer cents
    input_set: "Council dues constants for the member's type; issued_on month."
    constants:
      FULL_DUES_MONTHS: 9
    precision: "integer cents, round_half_up on the single proration product"
    variants:
      - name: youth_rate
        when: "member_type == YOUTH"
        difference: "uses Council.youth_dues_cents as base"
      - name: adult_rate
        when: "member_type == ADULT"
        difference: "uses Council.adult_dues_cents as base"

  - name: fundraiser_troop_commission
    trigger: "POST /fundraiser-orders places an order; computes troop_commission_cents and credits TROOP_DUES"
    algorithm: tiered_pricing
    formula: |
      gross = units * Fundraiser.unit_price_cents
      # MARGINAL tiered commission on UNITS (not on gross): each unit earns its
      # tier rate; tier boundaries are on cumulative units of THIS order only.
      #   units in [1..TIER1_MAX]            -> RATE1 of that unit's price
      #   units in [TIER1_MAX+1..TIER2_MAX]  -> RATE2
      #   units above TIER2_MAX              -> RATE3
      t1 = min(units, TIER1_MAX)
      t2 = min(max(units - TIER1_MAX, 0), TIER2_MAX - TIER1_MAX)
      t3 = max(units - TIER2_MAX, 0)
      raw = (t1*unit_price_cents*RATE1) + (t2*unit_price_cents*RATE2) + (t3*unit_price_cents*RATE3)
      commission = round_half_up(raw)     # round once AFTER summing all tiers (sum-then-round)
      return commission
    input_set: "Order units and Fundraiser.unit_price_cents; marginal tier schedule."
    constants:
      TIER1_MAX: 100
      TIER2_MAX: 500
      RATE1: 0.15
      RATE2: 0.20
      RATE3: 0.25
    precision: "integer cents, sum-then-round_half_up (single rounding after tier sum)"

  - name: recharter_balance_sweep
    trigger: "POST /troops/{id}/recharter; moves charter_fee_cents from TROOP_DUES to COUNCIL_CASH"
    algorithm: aggregation
    formula: |
      # forward-looking variant (PROJECTED): includes PLACED + FILLED order commissions
      #   troop_dues_projected = sum FundLedgerEntry.amount_cents where account=TROOP_DUES and troop_id=T
      # chronological variant (SETTLED): only FILLED-order commissions and posted payments are settled cash
      #   troop_dues_settled = sum amount_cents for TROOP_DUES entries whose source order is FILLED
      # the recharter REQUIRES settled funds, then debits charter_fee_cents:
      if troop_dues_settled < Council.charter_fee_cents: reject ERR_INSUFFICIENT_TROOP_FUNDS
      FundLedgerEntry(account=TROOP_DUES, amount=-charter_fee_cents, source_kind=RECHARTER)
      FundLedgerEntry(account=COUNCIL_CASH, amount=+charter_fee_cents, source_kind=RECHARTER)
      # invariant: charter_fee_cents leaves TROOP_DUES and enters COUNCIL_CASH; net system cash unchanged
    input_set: "TROOP_DUES ledger entries for the troop; settled vs projected variants differ by which order commissions count."
    constants: {}
    precision: "integer cents; conserved-quantity invariant pinned below"
    variants:
      - name: projected
        when: "preview / posture display"
        difference: "counts commissions from PLACED and FILLED orders"
      - name: settled
        when: "recharter eligibility gate"
        difference: "counts commissions only from FILLED orders and POSTED payments"

  - name: council_fund_balances
    trigger: "any FundLedgerEntry append; Council.fund_cash_cents / fund_liability_cents recomputed"
    algorithm: aggregation
    formula: |
      fund_cash_cents      = sum(amount_cents for entries where account=COUNCIL_CASH and council_id=C)
      fund_liability_cents = sum(amount_cents for entries where account=PRODUCT_LIABILITY and council_id=C)
      # Ledger semantics that make these balances well-defined:
      #  - Only a FILLED order credits COUNCIL_CASH (+gross) and PRODUCT_LIABILITY (+units*unit_cost).
      #  - FILLED is terminal: the fundraiser-close path cancels only PLACED orders, never FILLED ones,
      #    so once FILLED those two credits are permanent.
      #  - A PLACED order cancelled before fill never touched COUNCIL_CASH/PRODUCT_LIABILITY at all;
      #    its only ledger footprint is the TROOP_DUES commission, which the cancel REVERSAL unwinds.
    input_set: "All FundLedgerEntry rows for the council, partitioned by account."
    precision: "integer cents; running aggregate, full recompute on read"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (council before troop before member)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "FK fields in body (member_id, troop_id, seller_member_id, invoice_id, event_id, fundraiser_id) reference existing rows; seller_member_id's troop matches order's troop_id"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "POST /fundraiser-orders, POST /event-registrations, POST /payments, POST /booth-reservations"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_troop_version / expected_fundraiser_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /troops/{id}/recharter, POST /fundraiser-orders"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: bgcheck resolver != requested_by_user_id; advancement approver != submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /leader-credentials/{id}/resolve-bgcheck, POST /advancements/{id}/approve"

  - priority: 8
    category: business_safety
    check: "Advancement approve requires member.registration_status == REGISTERED; LeaderCredential bgcheck only on member_type=ADULT"
    error_id: ERR_MEMBER_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /advancements/{id}/approve, POST /leader-credentials"

  - priority: 9
    category: business_constraint
    check: "Advancement submit requires requirements_signed == requirements_total (completion_pct == 100)"
    error_id: ERR_REQUIREMENTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /advancements/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "EventRegistration confirm requires permission SIGNED and (health ON_FILE if Event.requires_health_form)"
    error_id: ERR_FORMS_INCOMPLETE
    http_status: 409
    applies_to: "POST /event-registrations/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "BoothReservation [starts_at, ends_at) MUST NOT overlap another BOOKED reservation at the same location_code; touching endpoints (gap=0) are allowed (half-open intervals)"
    error_id: ERR_BOOTH_CONFLICT
    http_status: 409
    applies_to: "POST /booth-reservations"

  - priority: 12
    category: business_temporal
    check: "EventRegistration time-window collision: a member MUST NOT hold two CONFIRMED registrations whose events' [starts_at, ends_at] CLOSED intervals overlap or touch (gap=0 rejected, buffer-inclusive)"
    error_id: ERR_MEMBER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /event-registrations/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "Event confirm capacity: Event.confirmed_count < Event.capacity"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /event-registrations/{id}/confirm"

  - priority: 14
    category: business_constraint
    check: "FundraiserOrder units <= Fundraiser.available_units (cannot oversell inventory)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /fundraiser-orders"

  - priority: 15
    category: business_fiscal
    check: "Recharter requires settled TROOP_DUES >= Council.charter_fee_cents"
    error_id: ERR_INSUFFICIENT_TROOP_FUNDS
    http_status: 409
    applies_to: "POST /troops/{id}/recharter"

  - priority: 16
    category: business_constraint
    check: "Recharter requires recharter_posture == READY (min youth and min cleared+trained leaders)"
    error_id: ERR_RECHARTER_NOT_READY
    http_status: 409
    applies_to: "POST /troops/{id}/recharter"

  - priority: 17
    category: business_constraint
    check: "Required body fields present and well-typed; enums valid; ends_at > starts_at; units >= 1; amount_cents > 0; troop unit_number unique within council"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/transition endpoints"

  - priority: 18
    category: business_fiscal
    check: "Payment.amount_cents must not cause cumulative POSTED payments to exceed the invoice amount_cents (no overpayment)"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: "POST /payments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Council ----
  - method: POST
    path: "/councils"
    description: "Create a Council"
    roles: [CouncilRegistrar]
    code: 201
    input: [name, charter_fee_cents, youth_dues_cents, adult_dues_cents, program_year]
    output: Council
    side_effects: ["fund_cash_cents=0, fund_liability_cents=0"]

  - method: GET
    path: "/councils/{id}"
    description: "Get a Council with recomputed fund balances"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: Council
    side_effects: ["fund_cash_cents, fund_liability_cents recomputed from FundLedgerEntry on read"]

  - method: GET
    path: "/councils/{id}/ledger"
    description: "List FundLedgerEntry rows for a council (council reporting); filter by account/troop_id"
    roles: [CouncilRegistrar]
    code: 200
    input: ["account?", "troop_id?", "limit?", "offset?"]
    output: FundLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/councils/{id}/report"
    description: "Council reporting summary: troop roster counts, charter postures, fund balances"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: Council
    side_effects: ["all derived counts/balances recomputed"]

  # ---- Troop ----
  - method: POST
    path: "/councils/{id}/troops"
    description: "Create a Troop under a Council"
    roles: [CouncilRegistrar]
    code: 201
    input: [unit_number, program_type]
    output: Troop
    side_effects: ["charter_status=PROVISIONAL, recharter_posture computed (BLOCKED), version=1"]

  - method: GET
    path: "/troops/{id}"
    description: "Get a Troop with recomputed counts and posture"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: Troop
    side_effects: ["registered_youth_count, cleared_leader_count, recharter_posture, dues_account_cents recomputed"]

  - method: GET
    path: "/troops"
    description: "List troops; filter by council_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["council_id?", "limit?", "offset?"]
    output: Troop[]
    side_effects: []

  - method: GET
    path: "/troops/{id}/ledger"
    description: "List FundLedgerEntry rows scoped to a troop (TROOP_DUES account routing)"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["account?", "limit?", "offset?"]
    output: FundLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/troops/{id}/recharter"
    description: "Recharter a troop (PROVISIONAL/LAPSED -> CHARTERED); OCC-guarded; sweeps charter fee"
    roles: [CouncilRegistrar]
    code: 200
    input: [expected_troop_version]
    output: Troop
    side_effects:
      - "charter_status -> CHARTERED; charter_expires_at set"
      - "recharter_balance_sweep: -charter_fee_cents TROOP_DUES, +charter_fee_cents COUNCIL_CASH"
      - "increments Troop.version by 1"

  - method: POST
    path: "/troops/{id}/lapse"
    description: "Lapse a chartered troop (CHARTERED -> LAPSED)"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: Troop
    side_effects: ["charter_status -> LAPSED; increments Troop.version by 1"]

  - method: POST
    path: "/troops/{id}/drop"
    description: "Drop a lapsed troop (LAPSED -> DROPPED)"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: Troop
    side_effects: ["charter_status -> DROPPED; increments Troop.version by 1"]

  # ---- Member ----
  - method: POST
    path: "/troops/{id}/members"
    description: "Register a Member under a Troop (starts PENDING)"
    roles: [CouncilRegistrar, TroopLeader]
    code: 201
    input: [member_type, full_name, birthdate]
    output: Member
    side_effects: ["registration_status=PENDING, rank=SCOUT (YOUTH)"]

  - method: GET
    path: "/members/{id}"
    description: "Get a Member"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: Member
    side_effects: ["dues_paid_cents recomputed"]

  - method: GET
    path: "/members"
    description: "List members; filter by troop_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["troop_id?", "member_type?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{id}/suspend"
    description: "Suspend a registered member"
    roles: [TroopLeader]
    code: 200
    input: []
    output: Member
    side_effects: ["registration_status -> SUSPENDED; Troop counts/posture recomputed"]

  - method: POST
    path: "/members/{id}/reinstate"
    description: "Reinstate a suspended member"
    roles: [TroopLeader]
    code: 200
    input: []
    output: Member
    side_effects: ["registration_status -> REGISTERED; Troop counts/posture recomputed"]

  - method: POST
    path: "/members/{id}/drop"
    description: "Drop a member; voids open invoices; recomputes troop"
    roles: [TroopLeader]
    code: 200
    input: []
    output: Member
    side_effects: ["registration_status -> DROPPED; OPEN invoices -> VOID; Troop counts/posture recomputed"]

  # ---- Dues invoices & payments ----
  - method: POST
    path: "/members/{id}/dues-invoices"
    description: "Issue a prorated DuesInvoice for the member"
    roles: [CouncilRegistrar, TroopLeader]
    code: 201
    input: [issued_on]
    output: DuesInvoice
    side_effects: ["amount_cents computed via dues_proration"]

  - method: GET
    path: "/dues-invoices/{id}"
    description: "Get a DuesInvoice"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: []

  - method: GET
    path: "/dues-invoices"
    description: "List DuesInvoice rows; filter by member_id or troop_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["member_id?", "troop_id?", "status?", "limit?", "offset?"]
    output: DuesInvoice[]
    side_effects: []

  - method: POST
    path: "/payments"
    description: "Post a Payment against an OPEN DuesInvoice; may transition Member PENDING->REGISTERED"
    roles: [CouncilRegistrar, TroopLeader]
    code: 201
    input: [invoice_id, member_id, amount_cents]
    output: Payment
    side_effects:
      - "FundLedgerEntry +amount_cents to TROOP_DUES (source_kind=PAYMENT)"
      - "if cumulative POSTED >= invoice.amount_cents: invoice -> PAID, Member -> REGISTERED, troop recomputed"

  - method: GET
    path: "/payments/{id}"
    description: "Get a Payment"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List Payment rows; filter by invoice_id or member_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["invoice_id?", "member_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Leader credentials ----
  - method: POST
    path: "/members/{id}/leader-credentials"
    description: "Open a LeaderCredential for an ADULT member"
    roles: [TroopLeader]
    code: 201
    input: [requested_by_user_id]
    output: LeaderCredential
    side_effects: ["bgcheck_status=NOT_STARTED, training_status=UNTRAINED, version=1"]

  - method: GET
    path: "/leader-credentials/{id}"
    description: "Get a LeaderCredential"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: LeaderCredential
    side_effects: []

  - method: GET
    path: "/leader-credentials"
    description: "List LeaderCredential rows; filter by member_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: LeaderCredential[]
    side_effects: []

  - method: POST
    path: "/leader-credentials/{id}/start-bgcheck"
    description: "Start the background check (NOT_STARTED -> PENDING)"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: LeaderCredential
    side_effects: ["bgcheck_status -> PENDING"]

  - method: POST
    path: "/leader-credentials/{id}/resolve-bgcheck"
    description: "Resolve background check (PENDING -> CLEARED|FLAGGED); segregation of duties"
    roles: [CouncilRegistrar]
    code: 200
    input: [outcome]
    output: LeaderCredential
    side_effects: ["bgcheck_status -> CLEARED|FLAGGED; Troop counts/posture recomputed"]

  - method: POST
    path: "/leader-credentials/{id}/complete-training"
    description: "Mark youth-protection training complete (UNTRAINED -> TRAINED)"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: LeaderCredential
    side_effects: ["training_status -> TRAINED; training_expires_at set; Troop counts/posture recomputed"]

  # ---- Advancement ----
  - method: POST
    path: "/members/{id}/advancements"
    description: "Create an Advancement (rank or badge) for a member"
    roles: [TroopLeader]
    code: 201
    input: [kind, target, requirements_total, "badge_code?"]
    output: Advancement
    side_effects: ["status=DRAFT, requirements_signed=0, completion_pct=0"]

  - method: GET
    path: "/advancements/{id}"
    description: "Get an Advancement"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: Advancement
    side_effects: []

  - method: GET
    path: "/advancements"
    description: "List advancements; filter by member_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: Advancement[]
    side_effects: []

  - method: POST
    path: "/advancements/{id}/sign-requirement"
    description: "Sign off one requirement; increments requirements_signed and recomputes completion_pct"
    roles: [TroopLeader]
    code: 200
    input: []
    output: Advancement
    side_effects: ["requirements_signed += 1 (capped at requirements_total); completion_pct recomputed"]

  - method: POST
    path: "/advancements/{id}/submit"
    description: "Submit advancement for council review (DRAFT/RETURNED -> SUBMITTED)"
    roles: [TroopLeader]
    code: 200
    input: []
    output: Advancement
    side_effects: ["status -> SUBMITTED; submitted_by_user_id set to acting X-User-ID"]

  - method: POST
    path: "/advancements/{id}/return"
    description: "Return a submitted advancement for revision (SUBMITTED -> RETURNED)"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: Advancement
    side_effects: ["status -> RETURNED"]

  - method: POST
    path: "/advancements/{id}/approve"
    description: "Approve a submitted advancement (SUBMITTED -> APPROVED); segregation of duties"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: Advancement
    side_effects: ["status -> APPROVED; if kind=RANK, Member.rank -> target"]

  # ---- Events & registrations ----
  - method: POST
    path: "/troops/{id}/events"
    description: "Create an Event/campout under a troop"
    roles: [TroopLeader]
    code: 201
    input: [title, starts_at, ends_at, capacity, "requires_health_form?"]
    output: Event
    side_effects: ["status=OPEN, confirmed_count=0"]

  - method: GET
    path: "/events/{id}"
    description: "Get an Event"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: Event
    side_effects: ["confirmed_count recomputed"]

  - method: GET
    path: "/events"
    description: "List events; filter by troop_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["troop_id?", "status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  - method: POST
    path: "/events/{id}/lock"
    description: "Lock an event (OPEN -> LOCKED)"
    roles: [TroopLeader]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> LOCKED"]

  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel an event; cascades cancellation to all its registrations"
    roles: [TroopLeader]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> CANCELLED; all HOLD/CONFIRMED registrations -> CANCELLED; confirmed_count -> 0"]

  - method: POST
    path: "/events/{id}/registrations"
    description: "Create an EventRegistration (starts HOLD)"
    roles: [TroopLeader]
    code: 201
    input: [member_id]
    output: EventRegistration
    side_effects: ["permission_status=UNSIGNED, health_status=MISSING, status=HOLD"]

  - method: GET
    path: "/event-registrations/{id}"
    description: "Get an EventRegistration"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: EventRegistration
    side_effects: []

  - method: GET
    path: "/event-registrations"
    description: "List registrations; filter by event_id or member_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["event_id?", "member_id?", "limit?", "offset?"]
    output: EventRegistration[]
    side_effects: []

  - method: POST
    path: "/event-registrations/{id}/sign-permission"
    description: "Sign the guardian permission form (permission_status -> SIGNED)"
    roles: [TroopLeader]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["permission_status -> SIGNED"]

  - method: POST
    path: "/event-registrations/{id}/file-health"
    description: "File the health form (health_status -> ON_FILE)"
    roles: [TroopLeader]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["health_status -> ON_FILE"]

  - method: POST
    path: "/event-registrations/{id}/confirm"
    description: "Confirm a registration (HOLD -> CONFIRMED); requires forms + capacity + no double-book"
    roles: [TroopLeader]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["status -> CONFIRMED; Event.confirmed_count += 1"]

  - method: POST
    path: "/event-registrations/{id}/cancel"
    description: "Cancel a registration; decrements confirmed_count if it was CONFIRMED"
    roles: [TroopLeader]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["status -> CANCELLED; if was CONFIRMED, Event.confirmed_count -= 1"]

  # ---- Fundraiser, orders, booths ----
  - method: POST
    path: "/councils/{id}/fundraisers"
    description: "Create a Fundraiser under a council"
    roles: [CouncilRegistrar]
    code: 201
    input: [product, unit_price_cents, unit_cost_cents, total_inventory_units]
    output: Fundraiser
    side_effects: ["status=DRAFT, allocated_units=0, available_units=total_inventory_units, version=1"]

  - method: GET
    path: "/fundraisers/{id}"
    description: "Get a Fundraiser with recomputed inventory"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: Fundraiser
    side_effects: ["allocated_units, available_units recomputed"]

  - method: GET
    path: "/fundraisers"
    description: "List fundraisers; filter by council_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["council_id?", "status?", "limit?", "offset?"]
    output: Fundraiser[]
    side_effects: []

  - method: POST
    path: "/fundraisers/{id}/go-live"
    description: "Open a fundraiser for orders (DRAFT -> LIVE)"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: Fundraiser
    side_effects: ["status -> LIVE; increments Fundraiser.version by 1"]

  - method: POST
    path: "/fundraisers/{id}/close"
    description: "Close a fundraiser (LIVE -> CLOSED); cancels PLACED orders and reverses their commissions"
    roles: [CouncilRegistrar]
    code: 200
    input: []
    output: Fundraiser
    side_effects: ["status -> CLOSED; PLACED orders -> CANCELLED; commissions reversed; inventory recomputed; increments Fundraiser.version by 1"]

  - method: POST
    path: "/fundraiser-orders"
    description: "Place a FundraiserOrder against a LIVE fundraiser; OCC-guarded; computes commission"
    roles: [TroopLeader]
    code: 201
    input: [fundraiser_id, troop_id, seller_member_id, units, expected_fundraiser_version]
    output: FundraiserOrder
    side_effects:
      - "gross_cents, troop_commission_cents computed"
      - "Fundraiser.allocated_units += units; available_units recomputed; increments Fundraiser.version by 1"
      - "FundLedgerEntry +troop_commission_cents to TROOP_DUES (source_kind=FUNDRAISER_ORDER)"

  - method: GET
    path: "/fundraiser-orders/{id}"
    description: "Get a FundraiserOrder"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: FundraiserOrder
    side_effects: []

  - method: GET
    path: "/fundraiser-orders"
    description: "List orders; filter by fundraiser_id, troop_id, or seller_member_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["fundraiser_id?", "troop_id?", "seller_member_id?", "limit?", "offset?"]
    output: FundraiserOrder[]
    side_effects: []

  - method: POST
    path: "/fundraiser-orders/{id}/fill"
    description: "Fill an order (PLACED -> FILLED); posts cash and product-liability ledger entries"
    roles: [TroopLeader]
    code: 200
    input: []
    output: FundraiserOrder
    side_effects: ["status -> FILLED; +gross_cents COUNCIL_CASH; +units*unit_cost_cents PRODUCT_LIABILITY"]

  - method: POST
    path: "/fundraiser-orders/{id}/cancel"
    description: "Cancel a placed order (PLACED -> CANCELLED); releases inventory and reverses commission"
    roles: [TroopLeader]
    code: 200
    input: []
    output: FundraiserOrder
    side_effects: ["status -> CANCELLED; allocated_units -= units; commission reversed from TROOP_DUES"]

  - method: POST
    path: "/fundraisers/{id}/booth-reservations"
    description: "Reserve a booth slot at a location for a troop"
    roles: [TroopLeader]
    code: 201
    input: [troop_id, location_code, starts_at, ends_at]
    output: BoothReservation
    side_effects: ["status=BOOKED"]

  - method: GET
    path: "/booth-reservations/{id}"
    description: "Get a BoothReservation"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: []
    output: BoothReservation
    side_effects: []

  - method: GET
    path: "/booth-reservations"
    description: "List booth reservations; filter by fundraiser_id or troop_id"
    roles: [CouncilRegistrar, TroopLeader]
    code: 200
    input: ["fundraiser_id?", "troop_id?", "location_code?", "limit?", "offset?"]
    output: BoothReservation[]
    side_effects: []

  - method: POST
    path: "/booth-reservations/{id}/release"
    description: "Release a booth slot (BOOKED -> RELEASED), freeing the time window"
    roles: [TroopLeader]
    code: 200
    input: []
    output: BoothReservation
    side_effects: ["status -> RELEASED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CouncilRegistrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; deadline/expiry evaluations use this value"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Body FK references a non-existent row, or seller_member_id's troop != order troop_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not equal the parent's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same user attempts both halves of a segregated duty (resolve own bgcheck, approve own submission)" }
  - { id: ERR_MEMBER_NOT_REGISTERED, http: 409, condition: "Advancement approve on a member not REGISTERED, or leader credential on a non-ADULT member" }
  - { id: ERR_REQUIREMENTS_INCOMPLETE, http: 409, condition: "Advancement submit before requirements_signed == requirements_total" }
  - { id: ERR_FORMS_INCOMPLETE, http: 409, condition: "EventRegistration confirm before permission SIGNED and/or required health ON_FILE" }
  - { id: ERR_BOOTH_CONFLICT, http: 409, condition: "Booth slot [starts_at,ends_at) overlaps another BOOKED slot at same location_code" }
  - { id: ERR_MEMBER_DOUBLE_BOOKED, http: 409, condition: "Member already has a CONFIRMED registration whose event interval overlaps or touches this event" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Event.confirmed_count already == Event.capacity" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Order units > Fundraiser.available_units" }
  - { id: ERR_INSUFFICIENT_TROOP_FUNDS, http: 409, condition: "Recharter with settled TROOP_DUES < Council.charter_fee_cents" }
  - { id: ERR_RECHARTER_NOT_READY, http: 409, condition: "Recharter when recharter_posture != READY" }
  - { id: ERR_OVERPAYMENT, http: 409, condition: "Payment would push cumulative POSTED above invoice amount_cents" }
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "Troop unit_number already used within the council" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/malformed body field, bad enum, ends_at <= starts_at, units < 1, amount_cents <= 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CouncilRegistrar
    description: "Council-level operator: owns councils, troops, fundraisers, background-check resolution, advancement review, recharter"
    identity: "opaque"
    exclusive_operations:
      - "POST /councils"
      - "POST /councils/{id}/troops"
      - "POST /councils/{id}/fundraisers"
      - "POST /troops/{id}/recharter"
      - "POST /troops/{id}/lapse"
      - "POST /troops/{id}/drop"
      - "POST /leader-credentials/{id}/start-bgcheck"
      - "POST /leader-credentials/{id}/resolve-bgcheck"
      - "POST /leader-credentials/{id}/complete-training"
      - "POST /advancements/{id}/return"
      - "POST /advancements/{id}/approve"
      - "POST /fundraisers/{id}/go-live"
      - "POST /fundraisers/{id}/close"
      - "GET /councils/{id}/ledger"
      - "GET /councils/{id}/report"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /troops/{id}/members"
      - "POST /members/{id}/dues-invoices"
      - "POST /payments"

  - name: TroopLeader
    description: "Troop-level operator: manages members, advancements (submit/sign), events, fundraiser orders, booths"
    identity: "opaque"
    exclusive_operations:
      - "POST /members/{id}/suspend"
      - "POST /members/{id}/reinstate"
      - "POST /members/{id}/drop"
      - "POST /members/{id}/leader-credentials"
      - "POST /members/{id}/advancements"
      - "POST /advancements/{id}/sign-requirement"
      - "POST /advancements/{id}/submit"
      - "POST /troops/{id}/events"
      - "POST /events/{id}/lock"
      - "POST /events/{id}/cancel"
      - "POST /events/{id}/registrations"
      - "POST /event-registrations/{id}/sign-permission"
      - "POST /event-registrations/{id}/file-health"
      - "POST /event-registrations/{id}/confirm"
      - "POST /event-registrations/{id}/cancel"
      - "POST /fundraiser-orders"
      - "POST /fundraiser-orders/{id}/fill"
      - "POST /fundraiser-orders/{id}/cancel"
      - "POST /fundraisers/{id}/booth-reservations"
      - "POST /booth-reservations/{id}/release"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /troops/{id}/members"
      - "POST /members/{id}/dues-invoices"
      - "POST /payments"
