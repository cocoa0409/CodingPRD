  # ===========================================================================
  - section: covered_by_difficulty_design
    instances:
      - name: corner_covered_score_boundary
        claim_type: boundary_precision
        grounds:
          - calculations.allocation_selector
        excluded_because:
          difficulty_instance: score_boundary_min_score_inclusive_vs_below
          rationale: "Score-threshold inclusivity at min_score is asserted by the named §1.8 boundary_precision instance."

      - name: corner_covered_pool_capacity_boundary
        claim_type: boundary_precision
        grounds:
          - entities.SecuritizationPool.fields.target_principal_cents
        excluded_because:
          difficulty_instance: pool_capacity_exact_fit_vs_one_cent_over
          rationale: "Pool aggregate-capacity exact-fit vs overflow is asserted by the named §1.8 boundary_precision instance."

      - name: corner_covered_manual_review_loop
        claim_type: valid_transition
        grounds:
          - state_machines.Application.DOCS_REQUIRED_to_UNDERWRITTEN
        excluded_because:
          difficulty_instance: verification_manual_review_loop_returns_application_to_underwritten
          rationale: "The DOCS_REQUIRED -> UNDERWRITTEN manual-review join is asserted by the named §1.8 non_linear_state_machine instance."

      - name: corner_covered_offboard_cascade
        claim_type: cascade_down
        grounds:
          - state_machines.Partner.ACTIVE_to_OFFBOARDED
        excluded_because:
          difficulty_instance: offboard_cascades_partner_to_boxes_to_pools
          rationale: "The partner-offboard cascade into boxes and pools is asserted by the named §1.8 transitive_cascade instance."

      - name: corner_covered_payment_waterfall_order
        claim_type: correct_result
        grounds:
          - calculations.payment_waterfall
        excluded_because:
          difficulty_instance: payment_waterfall_bucket_order_and_no_post_split_rounding
          rationale: "Waterfall bucket ordering and no-post-split-rounding is asserted by the named §1.8 combinatorial_formula instance."

      - name: corner_covered_cashflow_stress_variant
        claim_type: variant_divergence
        grounds:
          - calculations.risk_score
        excluded_because:
          difficulty_instance: risk_score_cashflow_stress_multiplier_changes_score
          rationale: "The cash-flow stress variant divergence is asserted by the named §1.8 dual_variant_calc instance."

      - name: corner_covered_manual_haircut_variant
        claim_type: variant_divergence
        grounds:
          - calculations.approved_amount
        excluded_because:
          difficulty_instance: approved_amount_manual_review_haircut_shrinks_principal
          rationale: "The manual-review haircut variant divergence is asserted by the named §1.8 dual_variant_calc instance."

      - name: corner_covered_month_volume_cap_window
        claim_type: temporal_window
        grounds:
          - entities.Partner.fields.originated_this_month_count
        excluded_because:
          difficulty_instance: volume_cap_counts_per_calendar_month_window
          rationale: "The calendar-month volume-cap window reset is asserted by the named §1.8 resource_temporal_overlap instance."

      - name: corner_covered_credit_box_window
        claim_type: temporal_window
        grounds:
          - entities.CreditBox.fields.effective_from
        excluded_because:
          difficulty_instance: credit_box_activation_window_rejects_outside_clock
          rationale: "The credit-box [effective_from, effective_to] window boundary is asserted by the named §1.8 resource_temporal_overlap instance."

      - name: corner_covered_supersede_cycle
        claim_type: cyclic
        grounds:
          - state_machines.CreditBox
        excluded_because:
          difficulty_instance: credit_box_supersede_cycle_replaces_active_box
          rationale: "The ACTIVE -> SUPERSEDED replacement cycle is asserted by the named §1.8 non_linear_state_machine instance."

      - name: corner_covered_chargeoff_pool_invariant
        claim_type: compensation
        grounds:
          - state_machines.Loan.DEFAULTED_to_CHARGED_OFF
        excluded_because:
          difficulty_instance: pool_allocated_principal_conserved_across_chargeoff
          rationale: "Pool allocated-principal conservation across charge-off is asserted by the named §1.8 compensating_invariant instance."

      - name: corner_covered_payoff_balance_invariant
        claim_type: compensation
        grounds:
          - state_machines.Loan.CURRENT_to_PAID_OFF
        excluded_because:
          difficulty_instance: partner_funded_balance_conserved_across_payoff
          rationale: "Partner funded-balance conservation across payoff is asserted by the named §1.8 compensating_invariant instance."
