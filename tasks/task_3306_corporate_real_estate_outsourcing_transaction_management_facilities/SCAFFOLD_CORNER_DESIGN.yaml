scaffold_corner_design:
- section: entities
  instances:
  - name: account_create_sets_initial_lifecycle_and_derived_fields
    claim_type: creation
    grounds:
    - entities.PortfolioAccount.fields.lifecycle_state
    - entities.PortfolioAccount.fields.client_data_rights
    - entities.PortfolioAccount.fields.governance_posture
    - entities.PortfolioAccount.fields.version
    distinguishing_aspect: A freshly created account answers with lifecycle_state DRAFT, governance_posture NORMAL, client_data_rights CLIENT_OWNED_EXCLUSIVE for the ENTERPRISE tier, and version 1.
    test_recipe:
      setup:
      - empty database (no persisted resources); the baseline read confirms zero accounts
      setup_api_calls:
      - call: GET /api/accounts
        as: AccountExecutive
        captures:
          n0: $.pagination.total_count
      trigger:
      - call: POST /api/accounts
        payload:
          account_name: Aster Holdings
          client_name: Aster
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
          ls: $.data.lifecycle_state
          cdr: $.data.client_data_rights
          gp: $.data.governance_posture
          v: $.data.version
          rid: $.meta.api_request_id
      assert:
      - ${ls} == DRAFT
      - ${gp} == NORMAL
      - ${cdr} == CLIENT_OWNED_EXCLUSIVE
      - ${v} == 1
      - ${n0} == 0
  - name: account_create_missing_required_field_returns_400
    claim_type: required_fields
    grounds:
    - validations[priority=19]
    - errors[ERR_INVALID_REQUEST]
    - entities.PortfolioAccount.fields.portfolio_sqft
    distinguishing_aspect: A create omitting the required portfolio_sqft is rejected with ERR_INVALID_REQUEST and persists nothing.
    test_recipe:
      setup:
      - empty database (no persisted resources); the baseline read confirms zero accounts
      setup_api_calls:
      - call: GET /api/accounts
        as: AccountExecutive
        captures:
          n0: $.pagination.total_count
      trigger:
      - call: POST /api/accounts
        payload:
          account_name: NoSqft Ltd
          client_name: NoSqft
          platform_tier: BASIC
        as: AccountExecutive
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_INVALID_REQUEST
      - ${n0} == 0
  - name: account_get_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - validations[priority=4]
    - errors[ERR_RESOURCE_NOT_FOUND]
    distinguishing_aspect: A read of an id that was never persisted returns ERR_RESOURCE_NOT_FOUND rather than an empty object.
    test_recipe:
      setup:
      - empty database (no persisted resources); the baseline read confirms zero accounts
      setup_api_calls:
      - call: GET /api/accounts
        as: AccountExecutive
        captures:
          n0: $.pagination.total_count
      trigger:
      - call: GET /api/accounts/00000000-0000-0000-0000-000000000000
        as: AccountExecutive
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_RESOURCE_NOT_FOUND
      - ${n0} == 0
  - name: lease_list_pagination_reports_total_and_has_more
    claim_type: listing
    grounds:
    - response_envelope.pagination_fields
    - entities.Lease.fields.pipeline_state
    distinguishing_aspect: A lease list with limit 2 over three leases reports total_count 3 and has_more true while returning exactly two rows.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE with three leases L1, L2, L3
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Paginated Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 2 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L2: $.data.id
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 3 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L3: $.data.id
      trigger:
      - call: GET /api/leases?account_id=${acc}&limit=2
        as: TransactionManager
        captures:
          tc: $.pagination.total_count
          hm: $.pagination.has_more
          l0: $.data[0].id
          l1: $.data[1].id
      assert:
      - ${tc} == 3
      - ${hm} == true
      - Lease.${l0}.account_id == ${acc}
  - name: lease_create_initial_state_and_defaults
    claim_type: initial_state
    grounds:
    - state_machines.Lease.initial_state
    - entities.Lease.fields.revision_count
    - entities.Lease.fields.expiration_bucket
    distinguishing_aspect: A newly created lease sits in PIPELINE with revision_count 0 before any pipeline call.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Initial Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: COMPLETE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      trigger:
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 9 Pine St
          market_code: CHI
          leased_sqft: 25000
          base_rent_cents_per_year: 30000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
          ps: $.data.pipeline_state
          rc: $.data.revision_count
      assert:
      - ${ps} == PIPELINE
      - ${rc} == 0
- section: state_machines
  instances:
  - name: lease_revision_loop_budget
    claim_type: cyclic
    grounds:
    - state_machines.Lease.transitions.REJECTED_to_APPROVAL_PENDING
    - entities.Lease.fields.revision_count
    excluded_because:
      difficulty_instance: lease_reject_revise_loop_increments_revision_count
      rationale: The cyclic shape of the Lease machine is asserted by the §1.8 non_linear_state_machine instance.
  - name: lease_submit_for_approval_after_expiry_returns_lease_expired
    claim_type: violation_to_error
    grounds:
    - validations[priority=12]
    - errors[ERR_LEASE_EXPIRED]
    - state_machines.Lease.transitions.PIPELINE_to_APPROVAL_PENDING
    distinguishing_aspect: A lease whose end date already precedes the account clock cannot be submitted for approval.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - account clock 2026-10-01T00:00:00Z
      - Lease L1 ending 2027-01-01 is created and then the clock is pushed to 2027-06-01
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Expiry Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: COMPLETE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-01-01T00:00:00Z'
          lease_end_date: '2027-01-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      trigger:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2027-06-01T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/leases/${L1}/submit-for-approval
        payload: {}
        as: TransactionManager
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_LEASE_EXPIRED
      - Lease.${L1}.pipeline_state == PIPELINE
  - name: close_active_account_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.PortfolioAccount.transitions.ACTIVE_to_OFFBOARDING
    - validations[priority=5]
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Calling close on an ACTIVE account that never entered OFFBOARDING is rejected as an invalid state.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Direct Close Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      trigger:
      - call: POST /api/accounts/${acc}/close
        payload: {}
        as: AccountExecutive
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_INVALID_STATE
      - PortfolioAccount.${acc}.lifecycle_state == ACTIVE
  - name: fourth_revision_round_returns_revision_limit
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Lease.transitions.REJECTED_to_APPROVAL_PENDING
    - validations[priority=22]
    - errors[ERR_REVISION_LIMIT_REACHED]
    distinguishing_aspect: Three completed reject/revise rounds exhaust the revision budget, so a fourth revise call is rejected with ERR_REVISION_LIMIT_REACHED while revision_count stays 3.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - Lease L1 entered one approval round and one rejection
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Revision Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/leases/${L1}/submit-for-approval
        payload: {}
        as: TransactionManager
      - call: POST /api/leases/${L1}/reject
        payload: {}
        as: TransactionManager
      - call: GET /api/accounts/${acc}
        as: AccountExecutive
        captures:
          v1: $.data.version
      - call: POST /api/leases/${L1}/revise
        payload:
          expected_account_version: ${v1}
        as: TransactionManager
      - call: POST /api/leases/${L1}/reject
        payload: {}
        as: TransactionManager
      - call: GET /api/accounts/${acc}
        as: AccountExecutive
        captures:
          v2: $.data.version
      - call: POST /api/leases/${L1}/revise
        payload:
          expected_account_version: ${v2}
        as: TransactionManager
      - call: POST /api/leases/${L1}/reject
        payload: {}
        as: TransactionManager
      - call: GET /api/accounts/${acc}
        as: AccountExecutive
        captures:
          v3: $.data.version
      trigger:
      - call: POST /api/leases/${L1}/revise
        payload:
          expected_account_version: ${v3}
        as: TransactionManager
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_REVISION_LIMIT_REACHED
      - Lease.${L1}.revision_count == 3
  - name: close_before_completion_returns_transition_incomplete
    claim_type: violation_to_error
    grounds:
    - validations[priority=28]
    - errors[ERR_TRANSITION_INCOMPLETE]
    - calculations.account_lifecycle_gate
    distinguishing_aspect: An offboarding account whose completion_pct_bps is 0 cannot close; the closure invariant 10000 is exact.
    test_recipe:
      setup:
      - PortfolioAccount OFFBOARDING with one PENDING transition task
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Incomplete Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/transitions
        payload: {}
        as: AccountExecutive
      - call: POST /api/transition-tasks
        payload:
          account_id: ${acc}
          task_name: Handover
          task_type: DATA_HANDOVER
          sequence_no: 1
          blocking: true
          due_at: '2026-12-31T00:00:00Z'
        as: TransitionManager
        captures:
          TK1: $.data.id
      trigger:
      - call: POST /api/accounts/${acc}/close
        payload: {}
        as: AccountExecutive
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_TRANSITION_INCOMPLETE
      - PortfolioAccount.${acc}.completion_pct_bps == 0
  - name: suspend_requires_non_normal_posture
    claim_type: conditional_action
    grounds:
    - state_machines.FacilitiesVendor.transitions.ACTIVE_to_SUSPENDED
    - calculations.governance_posture_rollup
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: An ACTIVE vendor cannot be suspended while the account posture is NORMAL, and succeeds once one audit failure moves the posture to ON_WATCH, which the governance_posture_rollup aggregation produces.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE with FacilitiesVendor V1 ACTIVE and DisciplineAudit A1 FAILED
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Suspend Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/discipline-audits
        payload:
          account_id: ${acc}
          discipline: FACILITIES
          finding: Vendor onboarding evidence missing
        as: GovernanceManager
        captures:
          A1: $.data.id
      - call: POST /api/discipline-audits/${A1}/start
        payload: {}
        as: GovernanceManager
      - call: POST /api/discipline-audits/${A1}/decide
        payload:
          outcome: FAILED
        as: GovernanceManager
      - call: POST /api/facilities-vendors
        payload:
          account_id: ${acc}
          vendor_name: Ace Janitorial
          service_line: JANITORIAL
          delivery_model: SELF_PERFORM
          sourcing_program: DIVERSITY
          service_rate_cents_per_sqft: 1.25
        as: FacilitiesManager
        captures:
          V1: $.data.id
      - call: POST /api/facilities-vendors/${V1}/activate
        payload: {}
        as: FacilitiesManager
      trigger:
      - call: POST /api/facilities-vendors/${V1}/suspend
        payload: {}
        as: FacilitiesManager
        captures:
          st: $.data.vendor_state
      assert:
      - ${st} == SUSPENDED
  - name: suspend_with_normal_posture_is_rejected
    claim_type: conditional_action
    grounds:
    - state_machines.FacilitiesVendor.transitions.ACTIVE_to_SUSPENDED
    - validations[priority=8]
    distinguishing_aspect: On a NORMAL-posture account an ACTIVE vendor suspension is refused, leaving the vendor ACTIVE.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE with posture NORMAL
      - FacilitiesVendor V1 ACTIVE
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Suspend Denied Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/facilities-vendors
        payload:
          account_id: ${acc}
          vendor_name: Ace Janitorial
          service_line: JANITORIAL
          delivery_model: SELF_PERFORM
          sourcing_program: DIVERSITY
          service_rate_cents_per_sqft: 1.25
        as: FacilitiesManager
        captures:
          V1: $.data.id
      - call: POST /api/facilities-vendors/${V1}/activate
        payload: {}
        as: FacilitiesManager
      trigger:
      - call: POST /api/facilities-vendors/${V1}/suspend
        payload: {}
        as: FacilitiesManager
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_INVALID_STATE
      - FacilitiesVendor.${V1}.vendor_state == ACTIVE
  - name: abort_transition_on_active_account_is_refused
    claim_type: violation_to_error
    grounds:
    - validations[priority=21]
    - errors[ERR_NOT_TRANSITIONING]
    - state_machines.PortfolioAccount.transitions.OFFBOARDING_to_ACTIVE
    distinguishing_aspect: Abort-transition is meaningful only while the account is OFFBOARDING, so an ACTIVE account sees ERR_NOT_TRANSITIONING.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Abort Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      trigger:
      - call: POST /api/accounts/${acc}/abort-transition
        payload: {}
        as: AccountExecutive
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_NOT_TRANSITIONING
      - PortfolioAccount.${acc}.lifecycle_state == ACTIVE
  - name: lease_executed_and_rejected_are_terminal
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Lease.terminal_states
    - state_machines.Lease.transitions.PIPELINE_to_APPROVAL_PENDING
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: A lease that reached REJECTED can no longer be submitted for approval, confirming REJECTED is only re-enterable through revise.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - Lease L1 REJECTED
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Terminal Lease Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/leases/${L1}/submit-for-approval
        payload: {}
        as: TransactionManager
      - call: POST /api/leases/${L1}/reject
        payload: {}
        as: TransactionManager
      trigger:
      - call: POST /api/leases/${L1}/submit-for-approval
        payload: {}
        as: TransactionManager
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_INVALID_STATE
      - Lease.${L1}.pipeline_state == REJECTED
- section: calculations
  instances:
  - name: kpi_escalation_exact_margin_boundary
    claim_type: rate_threshold_trigger
    grounds:
    - calculations.escalation_threshold_check
    - entities.ServiceLevelKpi.fields.escalation_status
    excluded_because:
      difficulty_instance: escalation_exact_margin_does_not_open
      rationale: Asserted as the primary boundary instance of the §1.8 boundary_precision_check rule.
  - name: scorecard_composite_shifts_with_platform_tier_weight
    claim_type: correct_result
    grounds:
    - calculations.weighted_scorecard_composite
    - calculations.weighted_scorecard_composite.variants.weight_shifted_for_tier
    - entities.Scorecard.fields.composite_bps
    distinguishing_aspect: The identical quality/response pair scores 9610.00 on an ENTERPRISE account and 9500.00 on a BASIC account because the quality weight rises from 5000 to 6000.
    test_recipe:
      setup:
      - PortfolioAccount ent-account ENTERPRISE (portfolio_sqft 400000) and bas-account BASIC (portfolio_sqft 200000), both ACTIVE
      - Scorecard SC1 on ent-account quality_bps 9800 response_bps 9300 DRAFT
      - Scorecard SC2 on bas-account quality_bps 9800 response_bps 9300 DRAFT
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Tier One
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          ente: $.data.id
      - call: POST /api/accounts/${ente}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${ente}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts
        payload:
          account_name: Tier Two
          client_name: Tier Two
          portfolio_sqft: 200000
          platform_tier: BASIC
        as: AccountExecutive
        captures:
          bas: $.data.id
      - call: POST /api/accounts/${bas}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/scorecards
        payload:
          account_id: ${ente}
          service_line: JANITORIAL
          quality_bps: 9800
          response_bps: 9300
        as: GovernanceManager
        captures:
          SC1: $.data.id
      - call: POST /api/scorecards
        payload:
          account_id: ${bas}
          service_line: JANITORIAL
          quality_bps: 9800
          response_bps: 9300
        as: GovernanceManager
        captures:
          SC2: $.data.id
      - call: GET /api/accounts/${ente}
        as: AccountExecutive
        captures:
          v1: $.data.version
      trigger:
      - call: POST /api/scorecards/${SC1}/publish
        payload:
          expected_account_version: ${v1}
        as: GovernanceManager
        captures:
          cb: $.data.composite_bps
      assert:
      - ${cb} == 9600
