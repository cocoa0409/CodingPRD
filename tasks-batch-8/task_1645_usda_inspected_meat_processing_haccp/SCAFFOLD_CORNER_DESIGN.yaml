          assert:
            - "create response: HTTP 201, meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.establishment_number == EST-1645-37"
            - "not-found response: HTTP 404, response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

