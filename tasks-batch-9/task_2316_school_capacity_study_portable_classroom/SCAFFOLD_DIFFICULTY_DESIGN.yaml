          endpoints: ["POST /facilities/portable-units/{id}/condition"]
        depth: 4
        chain: "POST /facilities/portable-units/{id}/condition UNSAFE -> PortableUnit condition_status becomes UNSAFE -> because the unit is unsafe its non-terminal PlacementRequest moves SCHEDULED to WITHDRAWN -> because the request was withdrawn its 7,741,440 cent encumbrance is released to the CapitalBudget and its PLANNED InstallationSchedule moves to CANCELLED -> because the schedule was cancelled the PlacementSite clears occupied_by_unit_id and the unit returns to allocation_status IN_STORAGE"
        distinguishing_aspect: >
          A single condition inspection with a different trigger from the permit
          chain unwinds four levels in the opposite direction. The schedule is
          cancelled with cancellation_reason UNIT_UNSAFE without anyone calling the
          cancel endpoint, and the pad is freed without anyone touching the pad.
          The parallel state dimensions are what make the chain observable: after
          the cascade the unit is UNSAFE on the condition dimension and IN_STORAGE
          on the allocation dimension at the same time. An implementation that only
          flips condition_status leaves an encumbered budget, a live schedule and
          an occupied pad pointing at a condemned classroom.
