  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: post_case_response_envelope_contract
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type, and data; list endpoints additionally carry limit/offset/total_count/has_more with defaults limit=10, offset=0."
        test_recipe:
          setup: ["Case created"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3029", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
            - call: "GET /v1/claims?case_id=${case_id}"
              as: Receiver
          assert:
            - "Object response: meta.api_request_id present, meta.api_request_timestamp present, response_type == \"object\", data is the Case"
            - "List response: response_type == \"array\", and pagination fields limit == 10, offset == 0, total_count == 0, has_more == false are present with envelope defaults"

      - name: get_case_computed_read_reflects_mutations
        claim_type: computed_read
        grounds: [entities.Case.fields.cash_on_hand_cents, entities.Case.fields.allowed_claims_total_cents, calculations.estate_cash_position]
        distinguishing_aspect: "The computed read reflects underlying mutations exactly: after liquidating 150000 and allowing one 90000 claim, GET /v1/cases/{id} reports cash_on_hand_cents 150000, marshalled_value_cents 150000, allowed_claims_total_cents 90000."
        test_recipe:
          setup: ["Case ACTIVE; asset created (estimated 150000)"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3030", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 150000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 90000 }
              as: Creditor
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 150000 }
              as: Receiver
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 90000 }
              as: Receiver
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash: $.data.cash_on_hand_cents, mar: $.data.marshalled_value_cents, tot: $.data.allowed_claims_total_cents }
          assert:
            - "${cash} == 150000 and ${mar} == 150000 and ${tot} == 90000"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: expenditure_approval_drains_cash_and_blocks_overdraft
        claim_type: violation_to_error
        grounds: [state_machines.AuthorizationRequest.SUBMITTED_to_APPROVED, "errors[ERR_INSUFFICIENT_ESTATE_FUNDS]", calculations.estate_cash_position]
        distinguishing_aspect: "An EXPENDITURE authorization debits cash at APPROVAL time: approving 70000 against cash 50000 fails with ERR_INSUFFICIENT_ESTATE_FUNDS, while approving 30000 succeeds and drops cash to 20000."
        test_recipe:
          setup: ["Case ACTIVE; cash 50000; two EXPENDITURE authorization requests SUBMITTED (70000 and 30000)"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3031", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 50000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 50000 }
              as: Receiver
            - call: "POST /v1/authorization-requests"
              payload: { case_id: "${case_id}", request_type: EXPENDITURE, description: "Pay overdue supplier", amount_cents: 70000 }
              as: Receiver
              captures: { ar1: $.data.id }
            - call: "POST /v1/authorization-requests"
              payload: { case_id: "${case_id}", request_type: EXPENDITURE, description: "Pay utility deposit", amount_cents: 30000 }
              as: Receiver
              captures: { ar2: $.data.id }
          trigger:
            - call: "POST /v1/authorization-requests/${ar1}/decide"
              payload: { decision: APPROVE }
              as: Court
              captures: { err1: $.data.error_id }
            - call: "POST /v1/authorization-requests/${ar2}/decide"
              payload: { decision: APPROVE }
              as: Court
              captures: { st2: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash: $.data.cash_on_hand_cents }
          assert:
            - "${err1} == ERR_INSUFFICIENT_ESTATE_FUNDS — 70000 > cash 50000"
            - "${st2} == APPROVED and ${cash} == 20000 (50000 - 30000 debited at approval)"

      - name: payment_pay_after_fee_drain_insufficient_funds
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_ESTATE_FUNDS]", state_machines.DistributionPayment.SCHEDULED_to_PAID]
        distinguishing_aspect: "The approved schedule does not reserve cash: an intervening fee payment drains the estate below a payment's scheduled amount, and the payment's pay call then fails with ERR_INSUFFICIENT_ESTATE_FUNDS."
        test_recipe:
          setup:
            - "Case with cash 50000; GENERAL claim ALLOWED 50000; plan reserve 0 APPROVED -> one payment 50000 SCHEDULED; case DISTRIBUTING"
