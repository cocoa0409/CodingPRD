            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1300-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-5", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator }
          trigger:
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "00000000-0000-0000-0000-000000000000", scope_sqft: 10, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_REPAIR_NOTICE_NOT_FOUND (existence, priority 4) and NOT ERR_INVALID_BATCH_STATE (state, priority 5)"

  - rule_id: boundary_precision_check
    instances:
      - name: severity_trip_threshold_boundary
        grounds:
          - calculations.defect_severity_classification
          - entities.Defect.fields.severity_class
        distinguishing_aspect: |
          Metric: inches (continuous threshold) on POST /defects. The classification uses
          inclusive >= at 0.50, so 0.50 is TRIP_HAZARD while 0.49 is MAJOR, and 0.25 is MAJOR
          while 0.24 is MINOR — both boundaries of the band are pinned.
        test_recipe:
          setup:
            - "owner/parcel/segment registered"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Pam Palm", mailing_address: "16 Palm St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1400", owner_id: "${owner_id}", street_address: "16 Palm St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1400-1", length_ft: 100, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
          trigger:
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.5, area_sqft: 2 }, as: Inspector, as_user_id: "insp-1", captures: { sev_a: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.49, area_sqft: 2 }, as: Inspector, as_user_id: "insp-1", captures: { sev_b: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.25, area_sqft: 2 }, as: Inspector, as_user_id: "insp-1", captures: { sev_c: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.24, area_sqft: 2 }, as: Inspector, as_user_id: "insp-1", captures: { sev_d: "$.data.severity_class" } }
          assert:
            - "sev_a == TRIP_HAZARD (0.50 hits the inclusive >= boundary)"
            - "sev_b == MAJOR (0.49 just below)"
            - "sev_c == MAJOR (0.25 hits the lower inclusive boundary)"
            - "sev_d == MINOR (0.24 just below)"

      - name: program_cap_equality_boundary
        grounds:
          - calculations.program_cap_reservation
          - state_machines.CostShareApplication.APPROVED_to_OBLIGATED
          - errors[ERR_PROGRAM_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric: cents (integer fiscal cap) on POST /cost-share-applications/{id}/obligate.
          Equality is allowed (<=), so provisional exactly equal to the appropriation obligates
          cleanly, while a second application exceeding the remaining zero balance by any
          amount fails — different metric and endpoint from the severity boundary.
        test_recipe:
          setup:
            - "cycle appropriation exactly 60000; two owners/parcels with issued notices; app1 qty 100 (provisional 60000) APPROVED; app2 qty 10 (provisional 6000) APPROVED"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 60000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Quinn Quince", mailing_address: "17 Quince St" }, as: ProgramCoordinator, captures: { owner1_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Rosa Rose", mailing_address: "18 Rose St" }, as: ProgramCoordinator, captures: { owner2_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1501", owner_id: "${owner1_id}", street_address: "17 Quince St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel1_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1502", owner_id: "${owner2_id}", street_address: "18 Rose St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel2_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel1_id}", segment_code: "S-1501-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg1_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel2_id}", segment_code: "S-1502-1", length_ft: 4, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg2_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg1_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { def1_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg2_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 10 }, as: Inspector, as_user_id: "insp-1", captures: { def2_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel1_id}", defect_ids: ["${def1_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel2_id}", defect_ids: ["${def2_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice2_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice1_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /repair-notices/${notice2_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice1_id}", parcel_id: "${parcel1_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner1_id}", captures: { app1_id: "$.data.id", prov1: "$.data.provisional_award_cents" } }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice2_id}", parcel_id: "${parcel2_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 10 }, as: PropertyOwner, as_user_id: "${owner2_id}", captures: { app2_id: "$.data.id", prov2: "$.data.provisional_award_cents" } }
            - { call: "POST /cost-share-applications/${app1_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications/${app2_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /cost-share-applications/${app1_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { s1: "$.data.review_status" } }
            - { call: "POST /cost-share-applications/${app2_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed: "$.data.committed_cents", available: "$.data.available_cents" } }
          assert:
            - "prov1 == 60000 and s1 == OBLIGATED (equality with the 60000 appropriation is allowed)"
            - "committed == 60000 and available == 0"
            - "err == ERR_PROGRAM_CAP_EXCEEDED for app2 (6000 over the remaining 0)"

      - name: bid_deadline_inclusive_boundary
        grounds:
          - calculations.compliance_deadline
          - errors[ERR_BID_DEADLINE_PASSED]
          - validations[priority=9]
        distinguishing_aspect: |
          Metric: timestamp (datetime inclusivity) on POST /bids — a third metric and endpoint.
          submitted_at == bid_deadline is accepted (inclusive <=); one second later is rejected.
          The second bid must carry the batch version advanced by the first bid, isolating the
          temporal check as the sole failure.
        test_recipe:
          setup:
            - "delinquent notice; batch (bid_deadline 2026-09-21T00:00:00Z) with one POOLED item, sealed; two registered contractors"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Sam Spruce", mailing_address: "19 Spruce St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1600", owner_id: "${owner_id}", street_address: "19 Spruce St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1600-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-6", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-21T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v1: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor1_id: "$.data.id" } }
            - { call: "POST /contractors", payload: { company_name: "Best Builders", license_number: "L-002", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor2_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v1}" }, as: Contractor, as_user_id: "${contractor1_id}", captures: { bid1_status: "$.data.status" } }
            - { call: "GET /bid-batches/${batch_id}", as: ProgramCoordinator, captures: { batch_v2: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:01Z" }, as: ProgramCoordinator }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 900, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v2}" }, as: Contractor, as_user_id: "${contractor2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "bid1_status == SUBMITTED (submitted_at exactly == bid_deadline is accepted)"
            - "err == ERR_BID_DEADLINE_PASSED one second past the deadline"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: obligate_requires_cycle_open
        grounds:
          - state_machines.CostShareApplication.APPROVED_to_OBLIGATED
          - state_machines.ProgramCycle.OPEN_to_LOCKED
          - errors[ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair CostShareApplication -> ProgramCycle: the application's own state is a
          valid APPROVED, yet the transition is gated by the cycle being OPEN; after
          POST /program-cycles/{id}/lock the same obligate fails with ERR_CYCLE_NOT_OPEN.
        test_recipe:
          setup:
            - "cycle; owner/parcel/defect; notice issued; application qty 100 APPROVED; then the cycle is LOCKED"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Ted Teak", mailing_address: "20 Teak St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1700", owner_id: "${owner_id}", street_address: "20 Teak St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1700-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /program-cycles/${cycle_id}/lock", as: ProgramCoordinator, captures: { cyc_status: "$.data.status" } }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "cyc_status == LOCKED"
            - "err == ERR_CYCLE_NOT_OPEN (application APPROVED but the cycle gates the transition)"

      - name: award_blocked_until_forestry_cleared
        grounds:
          - state_machines.BidBatch.SEALED_FOR_BIDDING_to_AWARDED
          - state_machines.ForestryReview.PENDING_to_DECIDED
          - errors[ERR_FORESTRY_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair BidBatch -> ForestryReview (different pair): award is gated on every
          covered tree-root review being CLEARED; PENDING blocks, the intermediate DECIDED
          state still blocks, and only the explicit clear unblocks the same award call.
        test_recipe:
          setup:
            - "parcel with a TREE_ROOT_UPHEAVAL city-tree defect (review PENDING); notice issued over the AWAITING_FORESTRY defect; swept DELINQUENT; batch with the item sealed; one eligible bid; clock past bid_deadline"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Uma Ulmus", mailing_address: "21 Elm St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1800", owner_id: "${owner_id}", street_address: "21 Elm St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1800-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "TREE_ROOT_UPHEAVAL", measured_offset_inches: 0.75, area_sqft: 30, city_tree_involved: true }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "GET /defects/${defect_id}/forestry-reviews", as: ForestryOfficer, captures: { review_id: "$.data[0].id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-7", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 30, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-23T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator, captures: { err1: "$.data.error_id" } }
            - { call: "POST /forestry-reviews/${review_id}/decision", payload: { decision: "PRUNE_APPROVED" }, as: ForestryOfficer, as_user_id: "for-1" }
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator, captures: { err2: "$.data.error_id" } }
            - { call: "POST /forestry-reviews/${review_id}/clear", as: ForestryOfficer, as_user_id: "for-1" }
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator, captures: { b_status: "$.data.status" } }
          assert:
            - "err1 == ERR_FORESTRY_NOT_CLEARED while the review is PENDING"
            - "err2 == ERR_FORESTRY_NOT_CLEARED while the review is DECIDED (decision alone does not unblock)"
            - "b_status == AWARDED after the review is CLEARED"

      - name: reimburse_requires_notice_compliant
        grounds:
          - state_machines.CostShareApplication.OBLIGATED_to_REIMBURSED
          - state_machines.RepairNotice.ISSUED_to_COMPLIANT
          - errors[ERR_NOTICE_NOT_COMPLIANT]
        distinguishing_aspect: |
          Entity pair CostShareApplication -> RepairNotice (a third distinct pair): an
          OBLIGATED application in a healthy OPEN cycle still cannot reimburse while its source
          notice is ISSUED; only the inspection PASS (notice -> COMPLIANT) unlocks the same call.
        test_recipe:
          setup:
            - "cycle; application qty 100 OBLIGATED; notice still ISSUED (no inspection yet)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Vera Vine", mailing_address: "22 Vine St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1900", owner_id: "${owner_id}", street_address: "22 Vine St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1900-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/reimburse", payload: { final_repair_cost_cents: 100000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "POST /cost-share-applications/${app_id}/reimburse", payload: { final_repair_cost_cents: 100000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { r_status: "$.data.review_status", final_award: "$.data.final_award_cents" } }
          assert:
            - "err == ERR_NOTICE_NOT_COMPLIANT while the notice is ISSUED"
            - "r_status == REIMBURSED and final_award == 50000 after the notice turns COMPLIANT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: contractor_half_open_window_overlap_exclusion
        grounds:
          - calculations.bid_award_selection
          - entities.BidBatch.fields.work_window_start
          - entities.BidBatch.fields.work_window_end
        distinguishing_aspect: |
          Resource: Contractor; interval semantics: half-open [start, end) on work windows.
          A contractor holding AWARDED batch A [2026-10-01, 2026-11-01) is ineligible for
          overlapping batch B [2026-10-15, 2026-11-15) — so the second-lowest bid wins B — but
          remains eligible for batch C [2026-11-01, 2026-12-01) because adjacency (B start ==
          A end) is NOT an overlap under half-open semantics.
        test_recipe:
          setup:
            - "three parcels each with a swept DELINQUENT notice (deadline 2026-09-15, swept 2026-09-16); batch A window [2026-10-01, 2026-11-01) awarded to contractor C1; batch B [2026-10-15, 2026-11-15) with bids from C1 (lowest) and C2; batch C [2026-11-01, 2026-12-01) with a bid from C1"
