  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_change_order_create_rejects_a_stale_agreement_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.change-order-create-stale-agreement
          - validations[priority=21]
          - errors.ERR_STALE_AGREEMENT_VERSION
          - endpoints.POST_/change-orders
        distinguishing_aspect: "The first §1.2.1 rule: because a fresh proposal legitimately SUPERSEDES any still-PROPOSED order on the same target milestone, no state precondition can reject the second create - the expected_agreement_version check is the only thing standing between a client and the silent destruction of a proposal it never saw. The same body must answer 412 with the pre-write version and 201 once the version is re-read, and the agreement's version must increment on every accepted write."
        test_recipe:
          setup:
            - "Agreement Aurora Solo is ACTIVE (advance 3600000) with one ALPHA milestone funded 3600000, contractor_budget_cents 0, currently IN_DEVELOPMENT."
            - "No change order exists yet, so uplift_funded_cents is 0."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
