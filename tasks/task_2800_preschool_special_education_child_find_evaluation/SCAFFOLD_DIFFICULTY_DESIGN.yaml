  - rule_id: transitive_cascade
    instances:

      - name: consent_revocation_cascades_referral_case_assessments_and_chair_capacity
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.Referral.EVALUATION_AUTHORIZED_to_WITHDRAWN
          - state_machines.EvaluationCase.IN_PROGRESS_to_CANCELLED
          - state_machines.DomainAssessment.SCHEDULED_to_INVALIDATED
          - calculations.provider_evaluation_caseload
          - calculations.child_status_precedence
        distinguishing_aspect: |
          One revocation propagates five levels deep in a single request -
          ConsentRecord REVOKED -> Referral WITHDRAWN with evaluation_due_date
          cleared -> EvaluationCase CANCELLED -> both DomainAssessments
          INVALIDATED -> chair active_evaluation_count 1 to 0 and
          evaluation_intake_posture AT_CAPACITY to OPEN - and the chain crosses
          four entity types, not one parent/child pair.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Chair provider created with max_evaluation_caseload 1, so one open case puts them AT_CAPACITY."
            - "One child born 2023-11-01 with a GRANTED evaluation consent, referral in EVALUATION_AUTHORIZED / GRANTED, evaluation_due_date 2026-09-30."
            - "Evaluation case IN_PROGRESS with one COMPLETED COMMUNICATION assessment and one SCHEDULED COGNITIVE assessment."
