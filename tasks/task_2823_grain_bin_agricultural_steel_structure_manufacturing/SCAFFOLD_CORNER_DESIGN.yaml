      - name: coil_gauge_match_outranks_the_line_gauge_capacity_check
        claim_type: priority_ordering
        grounds:
          - validations.p18
          - validations.p25
          - errors.ERR_COIL_GAUGE_MISMATCH
          - errors.ERR_GAUGE_EXCEEDS_LINE_CAPACITY
        distinguishing_aspect: "Both gauge rules read the same BinDesign.sheet_gauge_mm 1.6 but compare it against different rows - the coil lot on one side and the line on the other - and the first request violates both at once. Priority 18 must win, so the answer is ERR_COIL_GAUGE_MISMATCH even though the narrow line is also incapable. Swapping in the matching 1.6 mm lot leaves only the line defect and yields ERR_GAUGE_EXCEEDS_LINE_CAPACITY, and moving to the wide line finally succeeds - three outcomes over one design gauge."
