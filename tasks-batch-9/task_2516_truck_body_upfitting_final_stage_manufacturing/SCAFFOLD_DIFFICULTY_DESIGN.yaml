  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocate_chassis_blocked_while_unit_is_quarantined
        grounds:
          - state_machines.Chassis.status
          - validations.priority_41_ERR_CHASSIS_INVALID_STATE
          - concurrency_rules.allocate-chassis-stale-chassis
          - entities.Chassis.fields.quarantine_reason
        distinguishing_aspect: |
          Whether an UpfitOrder may bind a chassis depends entirely on the OTHER entity's state: the
          same allocate-chassis request fails with ERR_CHASSIS_INVALID_STATE while the unit sits
          QUARANTINED and succeeds unchanged once re-inspection returns it to INSPECTED. The order's
          own state never moves in between, and each attempt must carry the version captured from the
          most recent chassis-mutating response.
        test_recipe:
          setup:
            - "A DRAFT CUSTOMER_SPECIFIC service-body order on F550-DRW-84CA with no chassis bound."
            - "One chassis of the matching model that was inspected and then quarantined for a paint defect, so its status is QUARANTINED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
