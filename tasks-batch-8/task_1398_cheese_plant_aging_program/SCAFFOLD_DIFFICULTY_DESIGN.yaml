            - { call: "POST /plant/make-sheets/${make_id}/steps/6/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/7/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/8/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 1000.0, wheels_produced: 20 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/cheese-batches", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /plant/plants/${plant_id}/aging-rooms", payload: { code: "RM-1", capacity_wheels: 100, temp_c: 10.0, humidity_pct: 85.0 }, as: PlantAdmin, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /plant/aging-units", payload: { cheese_batch_id: "${batch_id}", aging_room_id: "${room_id}", wheel_count: 20, expected_aging_room_version: "${room_v}" }, as: AgingRoomOperator }
