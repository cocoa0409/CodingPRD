        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[recommendation-create-stale-service]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A first recommendation create bumps Service.version 1->2; a second create still carrying expected_service_version 1 returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A service at version 1; one PROPOSED recommendation already created (version now 2)."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 45, expected_service_version: "${s_ver}" }
              as: Analyst
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 50, expected_service_version: "${s_ver}" }
              as: Analyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: recommendation_create_supersedes_prior_proposed
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[recommendation-create-stale-service]", "state_machines.Recommendation.PROPOSED_to_SUPERSEDED"]
        distinguishing_aspect: "Creating a second recommendation with the current (re-read) Service.version succeeds and supersedes the prior PROPOSED recommendation (-> SUPERSEDED)."
        test_recipe:
          setup: ["A service with one PROPOSED recommendation; Service.version re-read after the first create."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 45, expected_service_version: "${s_ver}" }
              as: Analyst
              captures: { r1_id: $.data.id }
            - call: "GET /services/${s_id}"
              as: Analyst
              captures: { s_ver2: $.data.version }
          trigger:
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 50, expected_service_version: "${s_ver2}" }
              as: Analyst
              captures: { r2_status: $.data.status }
          assert:
            - "r2_status == PROPOSED"
            - "Recommendation.${r1_id}.status == SUPERSEDED after the second create"

