  - method: GET
    path: /vks/students/{id}/proctor-assignments
    description: "List proctor assignments of a student"
    roles: [PlatformAdmin, ProctorCoordinator, EnrollmentOfficer]
    code: 200
    input: ['limit?', 'offset?', 'assignment_status?']
    output: ProctorAssignment[]
    side_effects: []
  - method: POST
    path: /vks/proctor-assignments/{id}/mark-completed
    description: "Mark a BOOKED assignment completed (window must be OPEN)"
    roles: [ProctorCoordinator]
    code: 200
    input: []
    output: ProctorAssignment
    side_effects: ["ProctorAssignment BOOKED -> COMPLETED"]
  - method: POST
    path: /vks/proctor-assignments/{id}/cancel
    description: "Cancel a BOOKED assignment"
    roles: [ProctorCoordinator]
    code: 200
    input: []
    output: ProctorAssignment
    side_effects: ["ProctorAssignment BOOKED -> CANCELLED; decrement test_site.seats_booked"]

  # --- ServiceDelivery ---
  - method: POST
    path: /vks/service-deliveries
    description: "Schedule an online special-education service session"
    roles: [SpecialEdCoordinator]
    code: 201
    input: [student_id, service_type, scheduled_at, duration_minutes, provider_id]
    output: ServiceDelivery
    side_effects: []
  - method: GET
    path: /vks/service-deliveries/{id}
    description: "Fetch one service delivery"
    roles: [PlatformAdmin, SpecialEdCoordinator]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: []
  - method: GET
    path: /vks/students/{id}/service-deliveries
    description: "List service deliveries of a student"
    roles: [PlatformAdmin, SpecialEdCoordinator, EnrollmentOfficer]
    code: 200
    input: ['limit?', 'offset?', 'delivery_status?']
    output: ServiceDelivery[]
    side_effects: []
  - method: GET
    path: /vks/teachers/{id}/service-deliveries
    description: "List service deliveries where the given teacher is the provider"
    roles: [PlatformAdmin, SpecialEdCoordinator, AcademicDirector]
    code: 200
    input: ['limit?', 'offset?', 'delivery_status?']
    output: ServiceDelivery[]
    side_effects: []
  - method: POST
    path: /vks/service-deliveries/{id}/mark-delivered
    description: "Mark a SCHEDULED delivery as DELIVERED"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: ["ServiceDelivery SCHEDULED -> DELIVERED"]
  - method: POST
    path: /vks/service-deliveries/{id}/mark-missed
    description: "Mark a SCHEDULED delivery as MISSED (only after scheduled_at + duration has passed)"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: ["ServiceDelivery SCHEDULED -> MISSED"]
  - method: POST
    path: /vks/service-deliveries/{id}/cancel
    description: "Cancel a SCHEDULED delivery"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: ["ServiceDelivery SCHEDULED -> CANCELLED"]
  - method: POST
    path: /vks/service-deliveries/{id}/reschedule
    description: "Reschedule a MISSED delivery to a future time"
    roles: [SpecialEdCoordinator]
    code: 200
    input: [scheduled_at]
    output: ServiceDelivery
    side_effects: ["ServiceDelivery MISSED -> SCHEDULED"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role is authenticated but not in the endpoint's authorized roles"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or body foreign-key id does not resolve to an existing entity"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, or numeric range violation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity is in a state that does not admit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "payload.expected_<parent>_version does not equal current parent.version"
  - id: ERR_DISTRICT_CAP_REACHED
    http: 422
    condition: "district enrollment_cap would be exceeded by verifying or enrolling this student"
  - id: ERR_TEACHER_NOT_CERTIFIED_IN_STATE
    http: 422
    condition: "teacher.certification_state_codes does not include the student's district state_code"
  - id: ERR_PROVIDER_NOT_CERTIFIED_IN_STATE
    http: 422
    condition: "provider.certification_state_codes does not include the student's district state_code"
  - id: ERR_CASELOAD_EXCEEDED
    http: 422
    condition: "teacher.current_caseload + 1 > teacher.caseload_cap"
  - id: ERR_NO_SEAT_AVAILABLE
    http: 422
    condition: "test_site.seats_booked + 1 > test_site.seat_capacity"
  - id: ERR_ASSESSMENT_WINDOW_NOT_OPEN
    http: 422
    condition: "mark-completed attempted while window is not OPEN, or booking attempted against a CLOSED window"
  - id: ERR_SCHEDULE_TIME_IN_PAST
    http: 422
    condition: "reschedule payload.scheduled_at is not strictly in the future relative to the logical clock"
  - id: ERR_DUPLICATE_ACTIVE_STIPEND
    http: 422
    condition: "another stipend for the same student and stipend_type is in REQUESTED, ISSUED, or RETURN_REQUESTED"
  - id: ERR_NOT_SPECIAL_ED_STUDENT
    http: 422
    condition: "service delivery requested for a student whose special_education_flag is false"
  - id: ERR_MARK_MISSED_TOO_EARLY
    http: 422
    condition: "mark-missed attempted before scheduled_at + duration_minutes has elapsed on the logical clock"

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator with full superset of permissions; manages districts, clock, and can read everything"
    identity: opaque
    exclusive_operations:
      - "POST /vks/_clock/set_current_utc"
      - "POST /vks/districts"
    shared_operations:
      - "all GET endpoints"
      - "POST /vks/students"
      - "POST /vks/teachers"
      - "POST /vks/assessment-windows"
      - "POST /vks/test-sites"
      - "POST /vks/attendance"
  - name: EnrollmentOfficer
    description: "Handles student application, residency verification, enrollment, withdrawal, re-enrollment, attendance recording, and excusing absences"
    identity: opaque
    exclusive_operations:
      - "POST /vks/students/{id}/verify-residency"
      - "POST /vks/students/{id}/enroll"
      - "POST /vks/students/{id}/withdraw"
      - "POST /vks/students/{id}/request-reenrollment"
      - "POST /vks/attendance/{id}/excuse"
    shared_operations:
      - "GET endpoints for students, districts, stipends, attendance, enrollment-terms, teacher-assignments, proctor-assignments, service-deliveries, assessment-windows"
      - "POST /vks/students"
      - "POST /vks/attendance"
  - name: FinanceOfficer
    description: "Issues device and internet stipends, processes returns; cannot enroll students or manage teachers"
    identity: opaque
    exclusive_operations:
      - "POST /vks/stipends"
      - "POST /vks/stipends/{id}/issue"
      - "POST /vks/stipends/{id}/mark-returned"
    shared_operations:
      - "GET endpoints for stipends, students, districts, enrollment-terms"
  - name: AcademicDirector
    description: "Registers teachers and manages teacher-to-student assignments; cannot touch stipends or proctoring"
    identity: opaque
    exclusive_operations:
      - "POST /vks/teacher-assignments"
      - "POST /vks/teacher-assignments/{id}/end"
    shared_operations:
      - "GET endpoints for teachers, teacher-assignments, students, districts"
      - "POST /vks/teachers"
  - name: ProctorCoordinator
    description: "Schedules assessment windows, registers test sites, books and marks proctor assignments"
    identity: opaque
    exclusive_operations:
      - "POST /vks/proctor-assignments"
      - "POST /vks/proctor-assignments/{id}/mark-completed"
      - "POST /vks/proctor-assignments/{id}/cancel"
    shared_operations:
      - "GET endpoints for assessment-windows, test-sites, proctor-assignments, students, districts"
      - "POST /vks/assessment-windows"
      - "POST /vks/test-sites"
  - name: SpecialEdCoordinator
    description: "Schedules, delivers, marks-missed, cancels and reschedules special-education service deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /vks/service-deliveries"
      - "POST /vks/service-deliveries/{id}/mark-delivered"
      - "POST /vks/service-deliveries/{id}/mark-missed"
      - "POST /vks/service-deliveries/{id}/cancel"
      - "POST /vks/service-deliveries/{id}/reschedule"
    shared_operations:
      - "GET endpoints for service-deliveries, students, teachers, districts"
