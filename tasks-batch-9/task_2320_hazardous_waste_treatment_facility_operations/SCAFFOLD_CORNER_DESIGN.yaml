      - name: clock_move_activates_profile_expiry_and_repair_overdue_together
        claim_type: scheduled_actions
        grounds:
          - state_machines.waste_profile_lifecycle.transitions
          - entities.EmissionRepairOrder.fields.is_overdue
          - calculations.storage_unit_posture
        distinguishing_aspect: |
          One clock move fires two independent deferred consequences that were never written by any
          request: the profile lapses to EXPIRED at recertification_due_at and the repair order becomes
          overdue at repair_due_at, which in turn drags the unit's posture to SUSPENDED. Both are
          derived on read, so no background job may be assumed.
        test_recipe:
          setup:
            - "Facility with a LEVEL_2 tank unit; a repair order detected 2026-08-01 (repair_due_at 2026-08-16)"
            - "An APPROVED profile with recertification_months 1 (recertification_due_at 2026-09-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
