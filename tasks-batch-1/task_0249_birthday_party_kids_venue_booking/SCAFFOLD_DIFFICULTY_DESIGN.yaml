      # --- Depth>=2: remove EXTRA_TIME add-on -> duration recompute -> event_end shrinks ---
      - name: tc_remove_extratime_duration_window
        grounds:
          - state_machines.AddOn.ACTIVE_to_REMOVED
          - calculations.room_window_occupancy
          - entities.Booking.fields.effective_duration_minutes
          - entities.Booking.fields.event_end_utc
        distinguishing_aspect: |
          Removing an EXTRA_TIME add-on (A) recomputes Booking.effective_duration_minutes (B), which
