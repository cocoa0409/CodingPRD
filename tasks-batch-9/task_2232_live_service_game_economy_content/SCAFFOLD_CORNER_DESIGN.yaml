              captures: { evt_a_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LOOT_BOX", sku: "CRATE_A", price_tier: "T1", list_price_minor: 300, line_items: [{ sku: "CRATE_KEY", base_price_minor: 300, declared_value_minor: 400, granted_currency_code: "HARD_GEM", granted_amount_minor: 300 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
