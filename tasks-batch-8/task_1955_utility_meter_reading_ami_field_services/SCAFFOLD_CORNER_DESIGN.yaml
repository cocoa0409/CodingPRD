      - name: ami_miss_threshold_two_degraded_three_non_communicating
        claim_type: boundary_edge
        grounds: [calculations.endpoint_comms_degradation]
        distinguishing_aspect: "Consecutive-miss counting: misses 1 and 2 leave the meter DEGRADED (not NON_COMMUNICATING); the 3rd miss flips it and stamps non_communicating_since."
        test_recipe:
          setup: ["AMI meter installed at clock 2026-08-01; no reads ever"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /service-accounts", payload: { account_number: "C-0055", service_address: "55 Miss Ave", billing_cycle_code: "C55" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
