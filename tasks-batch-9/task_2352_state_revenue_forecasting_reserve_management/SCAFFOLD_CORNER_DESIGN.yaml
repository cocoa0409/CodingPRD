            - { call: "GET /withdrawal-requests/00000000-0000-0000-0000-000000000008", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { e8: $.data.error_id } }
            - { call: "GET /withdrawal-votes/00000000-0000-0000-0000-000000000009", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { e9: $.data.error_id } }
