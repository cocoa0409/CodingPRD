      - name: non_duplication_cob_nested_min_max_with_binding_secondary_cap
        grounds:
          - calculations.claim_secondary_cob_payment
          - entities.Coverage.fields.benefit_remaining
          - entities.Claim.fields.secondary_paid_amount
          - state_machines.Claim.SUBMITTED_SECONDARY_to_SECONDARY_PAID
        distinguishing_aspect: |
          MODE (a) -- a formula with four inputs (allowed_amount, primary_paid_amount,
          secondary coinsurance_major_rate and secondary benefit_remaining) interacting
          non-linearly through min(max(0, would_have_paid - primary_paid), benefit_remaining):
          the max clamp yields 120.00 and the outer min clamps it down to the secondary's
          remaining 100.00, so neither clamp alone gives the answer.
