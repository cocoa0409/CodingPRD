  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_decide_state_beats_fiscal_on_already_denied_claim
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          A second decide(APPROVE) on an already-DENIED Claim simultaneously violates the state
          check (Claim.status != UNDER_REVIEW, priority 5, category state) AND would-be violate the
          fiscal check (100000 - 5000 = 95000 > Policy.gross_available_coverage_cents=50000,
          priority 12, category business_fiscal). The lower priority number (state, 5) wins:
          ERR_INVALID_STATE is returned, not ERR_COVERAGE_LIMIT_EXCEEDED — a state-vs-business_fiscal
          category pair, distinct from the business_safety-vs-business_referential pair below.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, and an ACTIVE Policy with coverage_limit_cents=50000 exist."
            - "A Claim with total_claimed_amount_cents=100000 is filed and DENIED (terminal)."
