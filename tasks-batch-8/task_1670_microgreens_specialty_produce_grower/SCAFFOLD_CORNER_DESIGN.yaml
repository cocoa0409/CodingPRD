scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, computed, FK, not-found, envelope
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_defaults_credit_balance_zero
        claim_type: defaults
        grounds: [entities.Customer.fields.credit_balance_cents, entities.Customer.fields.is_active]
        distinguishing_aspect: "Customer created without credit fields gets credit_balance_cents=0 and is_active=true."
        test_recipe:
          setup: ["OpsManager available"]
          setup_api_calls:
            - { call: "POST /grow/customers", payload: { business_name: "New Resto", contact_email: "n@n.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "GET /grow/customers/${cid}", payload: {}, as: OpsManager, captures: { bal: "$.data.credit_balance_cents" } }
          assert:
            - "Customer.credit_balance_cents == 0"
            - "Customer.is_active == true"

      - name: variety_creation_initial_stage_trial
        claim_type: initial_state
        grounds: [entities.Variety.fields.stage]
        distinguishing_aspect: "Newly created Variety starts at stage TRIAL."
        test_recipe:
          setup: ["Grower available"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Popcorn Shoots", crop_category: "MICROGREEN", days_to_harvest: 9, expected_yield_grams_per_tray: 12000, listed_price_cents_per_kg: 1500, min_order_grams: 100 }, as: Grower, captures: { vid: "$.data.id" } }
          trigger:
            - { call: "GET /grow/varieties/${vid}", payload: {}, as: Grower, captures: { stage: "$.data.stage" } }
          assert:
            - "Variety.stage == TRIAL"

      - name: order_item_line_extension_computed
        claim_type: computed_field
        grounds: [entities.OrderItem.fields.line_extension_cents, calculations.order_line_extension]
        distinguishing_aspect: "line_extension_cents is server-computed as round_half_up(qty*price); client-supplied value is ignored."
        test_recipe:
          setup: ["LISTED variety 800 c/kg; customer; DRAFT order"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Cress", crop_category: "MICROGREEN", days_to_harvest: 6, expected_yield_grams_per_tray: 13000, listed_price_cents_per_kg: 800, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "R", contact_email: "r@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.255, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { item_id: "$.data.id" } }
          assert:
            - "OrderItem(${item_id}).line_extension_cents == 1004 (1.255*800=1004 rounded per line)"

      - name: get_customer_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
        distinguishing_aspect: "GET with a non-existent customer UUID returns ERR_CUSTOMER_NOT_FOUND 404."
        test_recipe:
          setup: ["no customers"]
          setup_api_calls: []
          trigger:
            - { call: "GET /grow/customers/00000000-0000-0000-0000-000000000000", payload: {}, as: OpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CUSTOMER_NOT_FOUND"
            - "http_status == 404"

      - name: fk_reverse_reachability_standing_order_lines
        claim_type: parent_relationship
        grounds: [entities.OrderItem.fields.standing_order_id]
        distinguishing_aspect: "GET /grow/standing-orders/{id}/lines returns the order's OrderItem[] (sub-resource reverse lookup)."
        test_recipe:
          setup: ["customer + DRAFT order with two lines"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Mache", crop_category: "PETITE_GREEN", days_to_harvest: 15, expected_yield_grams_per_tray: 8000, listed_price_cents_per_kg: 1300, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "FK", contact_email: "fk@fk.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.0, expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "GET /grow/standing-orders/${so_id}/lines", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { first_ext: "$.data[0].line_extension_cents" } }
          assert:
            - "response is OrderItem[] with 2 entries"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, side effects
  # ===========================================================================
  - section: state_machines
    instances:
      - name: harvest_from_sown_returns_batch_not_ready
        claim_type: invalid_transition
        grounds:
          - "state_machines.TrayBatch"
          - "errors[ERR_BATCH_NOT_READY]"
        distinguishing_aspect: "harvest on a batch still SOWN (not READY) must fail with ERR_BATCH_NOT_READY; no state change."
        test_recipe:
          setup: ["APPROVED FSP; LISTED variety; RELEASED lot; sown batch still SOWN"]
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-C1", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Pea", crop_category: "MICROGREEN", days_to_harvest: 9, expected_yield_grams_per_tray: 18000, listed_price_cents_per_kg: 800, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "LC1", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "GET /grow/tray-batches", payload: { crop_plan_id: "${plan_id}" }, as: Grower, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /grow/sanitation-logs", payload: { harvest_batch_id: "${batch_id}", surface_swab_passed: true, wash_water_ppm: 100, logged_by: "op1" }, as: Grower }
          trigger:
            - { call: "POST /grow/tray-batches/${batch_id}/harvest", payload: { harvested_kg: 18.0 }, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_BATCH_NOT_READY"
            - "TrayBatch(${batch_id}).status == SOWN (unchanged)"

      - name: deliver_on_planned_route_returns_route_not_dispatched
        claim_type: invalid_transition
        grounds:
          - "state_machines.DeliveryStop"
          - "errors[ERR_ROUTE_NOT_DISPATCHED]"
        distinguishing_aspect: "deliver on a stop whose route is still PLANNED fails with ERR_ROUTE_NOT_DISPATCHED."
        test_recipe:
          setup: ["LISTED variety; customer; CONFIRMED order; PLANNED route with one stop"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Basil2", crop_category: "SPECIALTY_HERB", days_to_harvest: 21, expected_yield_grams_per_tray: 5000, listed_price_cents_per_kg: 2000, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "R2", contact_email: "r2@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "POST /grow/delivery-routes", payload: { route_code: "R-P1", service_date: "2026-08-14", min_stop_subtotal_cents: 100 }, as: OpsManager, captures: { route_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/stops", payload: { customer_id: "${cust_id}", standing_order_id: "${so_id}" }, as: OpsManager, captures: { stop_id: "$.data.id" } }
          trigger:
            - { call: "POST /grow/delivery-stops/${stop_id}/deliver", payload: {}, as: OpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ROUTE_NOT_DISPATCHED"
            - "DeliveryStop(${stop_id}).outcome == SCHEDULED (unchanged)"

      - name: terminal_state_lockdown_cancelled_order_rejects_lines
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.StandingOrder"
          - "errors[ERR_ORDER_NOT_EDITABLE]"
        distinguishing_aspect: "A CANCELLED (terminal) StandingOrder rejects any further line additions."
        test_recipe:
          setup: ["customer; CANCELLED order; LISTED variety"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Dill", crop_category: "SPECIALTY_HERB", days_to_harvest: 18, expected_yield_grams_per_tray: 4000, listed_price_cents_per_kg: 2200, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "R3", contact_email: "r3@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/cancel", payload: {}, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ORDER_NOT_EDITABLE"

      - name: variety_retire_blocked_when_in_use
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Variety.LISTED_to_RETIRED"
          - "errors[ERR_VARIETY_IN_USE]"
        distinguishing_aspect: "Retiring a LISTED variety with PLANNED order lines fails with ERR_VARIETY_IN_USE."
        test_recipe:
          setup: ["LISTED variety; CONFIRMED order with a PLANNED line for it"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Chive", crop_category: "SPECIALTY_HERB", days_to_harvest: 20, expected_yield_grams_per_tray: 4000, listed_price_cents_per_kg: 2400, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "R4", contact_email: "r4@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /grow/varieties/${var_id}/retire", payload: {}, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VARIETY_IN_USE"
            - "Variety(${var_id}).stage == LISTED (unchanged)"

  # ===========================================================================
  # Section: calculations — correctness, thresholds, precision (not in §1.8)
  # ===========================================================================
  - section: calculations
    instances:
      - name: harvest_allocation_waterfall_ordering
        claim_type: algorithm_edge
        grounds: [calculations.harvest_allocation]
        distinguishing_aspect: "Waterfall fills orders by effective_week_start ASC then created_at ASC; a later order is SHORTED when supply runs out."
        test_recipe:
          setup:
            - "LISTED variety; two customers each with a CONFIRMED order, 3kg each, earlier week first"
            - "Batch harvested with only 4.0kg (short of the 6.0kg total demand)"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-C2", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Watercress", crop_category: "PETITE_GREEN", days_to_harvest: 10, expected_yield_grams_per_tray: 9000, listed_price_cents_per_kg: 1000, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "LC2", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "GET /grow/tray-batches", payload: { crop_plan_id: "${plan_id}" }, as: Grower, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /grow/customers", payload: { business_name: "First", contact_email: "f@f.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust1: "$.data.id" } }
            - { call: "POST /grow/customers", payload: { business_name: "Second", contact_email: "s2@s.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust2: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust1}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust1}", captures: { so1: "$.data.id", so1v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so1}/lines", payload: { variety_id: "${var_id}", qty_kg: 3.0, expected_standing_order_version: "${so1v}" }, as: Chef, as_user_id: "${cust1}", captures: { item1: "$.data.id" } }
            - { call: "GET /grow/standing-orders/${so1}", payload: {}, as: Chef, as_user_id: "${cust1}", captures: { so1v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so1}/confirm", payload: { expected_standing_order_version: "${so1v2}" }, as: Chef, as_user_id: "${cust1}" }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust2}", effective_week_start: "2026-08-10", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust2}", captures: { so2: "$.data.id", so2v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so2}/lines", payload: { variety_id: "${var_id}", qty_kg: 3.0, expected_standing_order_version: "${so2v}" }, as: Chef, as_user_id: "${cust2}", captures: { item2: "$.data.id" } }
            - { call: "GET /grow/standing-orders/${so2}", payload: {}, as: Chef, as_user_id: "${cust2}", captures: { so2v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so2}/confirm", payload: { expected_standing_order_version: "${so2v2}" }, as: Chef, as_user_id: "${cust2}" }
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/sanitation-logs", payload: { harvest_batch_id: "${batch_id}", surface_swab_passed: true, wash_water_ppm: 100, logged_by: "op1" }, as: Grower }
          trigger:
            - { call: "POST /grow/tray-batches/${batch_id}/harvest", payload: { harvested_kg: 4.0 }, as: Grower }
          assert:
            - "OrderItem(${item1}).fulfillment == ALLOCATED (earlier week filled first: 3.0kg of 4.0kg)"
            - "OrderItem(${item2}).fulfillment == SHORTED (only 1.0kg left for a 3.0kg order)"

      - name: sow_to_harvest_expected_date_computation
        claim_type: correct_result
        grounds: [calculations.sow_to_harvest_schedule]
        distinguishing_aspect: "expected_harvest_date = sown_date + days_to_harvest; base_harvest_kg fixed at plan creation."
        test_recipe:
          setup: ["APPROVED FSP; LISTED variety days_to_harvest=10, yield 20000g/tray; RELEASED lot; plan 4 trays"]
          setup_api_calls:
