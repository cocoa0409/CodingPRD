  - rule_id: non_linear_state_machine
    instances:
      - name: ca_cycle_bounded_by_revision_count_then_escalation_locks_the_loop
        grounds:
          - state_machines.Nonconformance.OPEN_to_CA_SUBMITTED
          - state_machines.Nonconformance.CA_SUBMITTED_to_CA_REJECTED
          - state_machines.Nonconformance.CA_REJECTED_to_CA_SUBMITTED
          - state_machines.Nonconformance.CA_SUBMITTED_to_ESCALATED
          - entities.Nonconformance.fields.ca_revision_count
          - calculations.audit_compliance_score
          - validations.priority_14
          - errors.ERR_INVALID_NONCONFORMANCE_STATE
        distinguishing_aspect: |
          The corrective-action loop CA_SUBMITTED -> CA_REJECTED -> CA_SUBMITTED is a real cycle
          whose exit is decided by the counter AFTER it is incremented: the first REJECT increments
          0 -> 1 and cycles because 1 < MAX_CA_REVISIONS (2), the second increments 1 -> 2 and
          diverts to ESCALATED because 2 >= 2, and ESCALATED is not in the plan-submission source
          set, so the third submission is refused. The OCC version is supplied correctly on the
          trigger so the 409 state error cannot be confused with the priority-7 412.
        test_recipe:
          setup:
            - "One applicant with one facility and one SCHEDULED audit; the audit is never closed, so provisional_score is null while final_score is still recomputed by every linked nonconformance event."
            - "One MAJOR / DOCUMENTATION nonconformance raised against that audit at clock 2026-08-03T00:00:00Z by aud-1, so ca_due_on is 2026-09-02T00:00:00Z and the whole cycle runs well before the due date."
            - "Two full submit-and-reject rounds by rev-1 (who is not the raiser, so segregation of duties is satisfied), leaving the record ESCALATED with ca_revision_count 2 and the second plan text still stored."
            - "The clock never advances, so no surveillance sweep and no overdue rule can interfere."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ProgramAdministrator
