            - { call: "POST /v1/venue-bookings/${b_id}/confirm", payload: {}, as: Treasurer }
            - { call: "POST /v1/guest-contracts", payload: { season_id: "${s_id}", musician_name: "Cellist", service_lines: [ { kind: "CONCERT", units: 1, rate_cents: 30000 } ], travel_stipend_cents: 0, concert_id: "${c_id}" }, as: ChoirDirector, captures: { gc: $.data.id } }
