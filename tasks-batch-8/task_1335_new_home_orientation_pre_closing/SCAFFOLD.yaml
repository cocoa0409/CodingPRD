# =============================================================================
# SCAFFOLD — New Home Orientation & Pre-Closing Walkthrough (task 1335)
# §1.0–§1.7 only. Difficulty design -> SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design -> SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  New Home Orientation & Pre-Closing Walkthrough (builder customer care team):
  appointment scheduling before closing & attendee requirements, systems
  demonstration checklist, item identification & classification
  (warrantable/cosmetic), completion before vs after closing decision, escrow
  holdback for incomplete items, homeowner acknowledgment signature,
  re-inspection & sign-off, feedback survey & quality trend

domain_name: new-home-orientation
api_prefix: /api

# Step 0 — Complexity Profile (maximum difficulty, Expert band topped out)
complexity_profile:
  primary_archetype: workflow_orchestration      # orientation pipeline: schedule -> walkthrough -> classify -> decide -> repair -> reinspect -> sign-off
  secondary_archetype: compliance_audit          # escrow holdback + signature gating closing; segregation of duties on verification
  complexity_layers:
    - optimistic_concurrency                     # OCC on Home / OrientationAppointment / EscrowHoldback version fields
    - cascading_side_effects                     # complete -> home flip -> escrow provisioning -> activation; identify -> signature stale -> home revert
    - dual_variant_calculation                   # escrow provisional vs final; trend response-weighted vs home-weighted
    - ops_run_checkpoint                         # survey expire-due sweep; logical clock drives all temporal gates
  entity_topology: flat                          # peer entities joined by FK references; no nested create paths
  state_machine_shape: cyclic                    # deficiency repair/reinspect loop, signature sign/stale/resign loop, escrow DRAFT<->ACTIVE
  relationship_patterns:
    - one_to_many                                # Home -> appointments/items/visits/surveys; Appointment -> attendees
    - cross_aggregate                            # DeficiencyItem references Home AND OrientationAppointment; Attendee references Appointment AND Homebuyer
  role_model: segregation_of_duties              # conducting rep may NOT verify own appointment's attendees; buyer-only sign-off; manager-only fiscal ops
  consistency_model: immediate
  difficulty_rationale: |
    Pushed past baseline Expert: 11 entities / 48 endpoints / 28 error codes /
    6 calculations with 4 declared variants / 8 state machines with 3 cycles.
    Density over volume: escrow rounding order + clamp, provisional-vs-final
    inclusion sets, closed-buffer vs half-open+aggregate overlap semantics,
    compound Home status derived from signature + deficiency + escrow state,
    and two independently-cycling child machines that perturb the parent.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities, flat topology)
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community name" }
      - { name: holdback_cost_multiplier, type: number, source: input, default: 1.5, description: "Escrow holdback = per-item estimated cost x this multiplier" }
      - { name: holdback_min_cents, type: integer, source: input, default: 50000, description: "Minimum holdback when raw amount > 0 (clamp floor)" }
      - { name: holdback_max_cents, type: integer, source: input, default: 1000000, description: "Maximum holdback (clamp ceiling)" }
      - { name: orientation_min_days_before_closing, type: integer, source: input, default: 5, description: "Orientation must be at least this many days before closing (inclusive)" }
      - { name: orientation_max_days_before_closing, type: integer, source: input, default: 30, description: "Orientation must be at most this many days before closing (inclusive)" }
      - { name: appointment_duration_minutes, type: integer, source: input, default: 120, description: "Default orientation appointment duration" }
      - { name: appointment_buffer_minutes, type: integer, source: input, default: 30, description: "Travel buffer added on both sides of an orientation appointment for overlap checks" }
      - { name: survey_window_days, type: integer, source: input, default: 14, description: "Days after orientation completion during which the survey may be submitted" }
      - { name: cosmetic_photo_required, type: boolean, source: input, default: true, description: "Feature flag: when true, COSMETIC classification requires photo_evidence_ref" }

  - name: Homebuyer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Buyer full legal name" }
      - { name: email, type: string, source: input, description: "Buyer email; unique across homebuyers (ERR_DUPLICATE_EMAIL)" }
      - { name: phone, type: string, source: input, description: "Optional contact phone" }

  - name: CustomerCareRep
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Rep full name" }
      - { name: email, type: string, source: input, description: "Rep email; unique (ERR_DUPLICATE_EMAIL)" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive reps cannot take new appointments or visits (ERR_REP_INACTIVE)" }
      - { name: daily_visit_capacity_minutes, type: integer, source: input, default: 240, description: "Aggregate cap on reinspection visit minutes per UTC day" }

  - name: Home
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; policy source for this home" }
      - { name: primary_buyer_id, type: string, source: input, description: "FK -> Homebuyer.id; ownership anchor for buyer-scoped operations" }
      - { name: lot_number, type: string, source: input, description: "Lot identifier within the community" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: sales_price_cents, type: integer, source: input, description: "Contract sales price" }
      - { name: closing_date, type: datetime, source: input, description: "Scheduled closing instant (UTC); drives the orientation scheduling window" }
      - { name: status, type: enum, source: system, description: "UNDER_CONSTRUCTION | PRE_CLOSE_READY | ORIENTATION_SCHEDULED | ORIENTED | ACKNOWLEDGED | READY_TO_CLOSE | CLOSED" }
      - { name: open_before_closing_count, type: integer, source: computed, description: "DeficiencyItems of this home with resolution=COMPLETE_BEFORE_CLOSING and status IN {DECIDED, IN_REPAIR, READY_FOR_REINSPECTION, VERIFIED}" }
      - { name: open_after_closing_count, type: integer, source: computed, description: "DeficiencyItems of this home with resolution=COMPLETE_AFTER_CLOSING and status IN {DECIDED, IN_REPAIR, READY_FOR_REINSPECTION, VERIFIED} (excludes SIGNED_OFF)" }

  - name: OrientationAppointment
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> Home.id" }
      - { name: rep_id, type: string, source: input, description: "FK -> CustomerCareRep.id; the conducting rep (segregation anchor)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Duration; defaults to community.appointment_duration_minutes at creation" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Number of successful reschedules; hard cap 3 (ERR_RESCHEDULE_LIMIT_REACHED)" }
      - { name: cancel_reason, type: enum, source: system, description: "BUYER_NO_SHOW | BUYER_REQUEST | BUILDER_DELAY; null unless cancelled/no-show" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }
      - { name: checklist_items, type: array, source: system, description: "Embedded 6-entry demonstration checklist seeded at start: [{system_key, label, is_required, demonstration_status, demonstrated_at}]; system_key IN {HVAC, PLUMBING, ELECTRICAL, APPLIANCES, EXTERIOR, SAFETY}; all required except APPLIANCES; demonstration_status IN {PENDING, DEMONSTRATED, SKIPPED}" }
      - { name: checklist_total_count, type: integer, source: computed, description: "len(checklist_items) (6 after start, 0 before)" }
      - { name: checklist_demonstrated_count, type: integer, source: computed, description: "checklist items with demonstration_status = DEMONSTRATED" }
      - { name: checklist_pending_count, type: integer, source: computed, description: "checklist items with demonstration_status = PENDING" }
      - { name: checklist_skipped_count, type: integer, source: computed, description: "checklist items with demonstration_status = SKIPPED" }

  - name: Attendee
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> OrientationAppointment.id" }
      - { name: attendee_type, type: enum, source: input, description: "BUYER | CO_BUYER | POA_PROXY" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Homebuyer.id; required when attendee_type IN {BUYER, CO_BUYER}; forbidden when POA_PROXY" }
      - { name: proxy_name, type: string, source: input, description: "Required when attendee_type = POA_PROXY" }
      - { name: poa_document_ref, type: string, source: input, description: "Required when attendee_type = POA_PROXY (power-of-attorney document reference)" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the verifying/rejecting actor; null until decided" }
      - { name: rejection_reason, type: string, source: system, description: "Set on REJECTED; null otherwise" }

  - name: DeficiencyItem
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> Home.id" }
      - { name: appointment_id, type: string, source: input, description: "FK -> OrientationAppointment.id; must belong to the same home and be IN_PROGRESS or COMPLETED" }
      - { name: system_key, type: enum, source: input, description: "HVAC | PLUMBING | ELECTRICAL | APPLIANCES | EXTERIOR | SAFETY | OTHER; optional system linkage" }
      - { name: title, type: string, source: input, description: "Short deficiency title" }
      - { name: description, type: string, source: input, description: "Optional detail" }
      - { name: classification, type: enum, source: system, description: "WARRANTABLE | COSMETIC; null until classified" }
      - { name: estimated_repair_cost_cents, type: integer, source: input, description: "Set at classification; >= 0; feeds escrow holdback" }
      - { name: photo_evidence_ref, type: string, source: input, description: "Set at classification; required when classification=COSMETIC and community.cosmetic_photo_required" }
      - { name: resolution, type: enum, source: system, description: "COMPLETE_BEFORE_CLOSING | COMPLETE_AFTER_CLOSING; null until decided" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | CLASSIFIED | DECIDED | IN_REPAIR | READY_FOR_REINSPECTION | VERIFIED | SIGNED_OFF | WITHDRAWN" }
      - { name: signed_off_at, type: datetime, source: system, description: "Logical-clock timestamp of buyer sign-off; null until SIGNED_OFF" }
      - { name: holdback_released, type: boolean, source: system, default: false, description: "True once this item's holdback contribution has been released" }

  - name: ReinspectionVisit
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> Home.id" }
      - { name: rep_id, type: string, source: input, description: "FK -> CustomerCareRep.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (UTC); must be in the future at creation" }
      - { name: duration_minutes, type: integer, source: input, description: "Duration; default 60" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED" }

  - name: EscrowHoldback
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: system, description: "FK -> Home.id; auto-provisioned when the home's orientation appointment completes" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PARTIALLY_RELEASED | FULLY_RELEASED | VOIDED" }
      - { name: holdback_amount_cents, type: integer, source: computed, description: "PROVISIONAL amount: per-line-rounded contributions over COMPLETE_AFTER_CLOSING items in {DECIDED, IN_REPAIR, READY_FOR_REINSPECTION, VERIFIED, SIGNED_OFF}, summed then clamped" }
      - { name: final_holdback_cents, type: integer, source: system, description: "FINAL amount frozen at close: same formula but EXCLUDING SIGNED_OFF items; null until home CLOSED" }
      - { name: funded_amount_cents, type: integer, source: system, default: 0, description: "Funds actually deposited at closing; must equal final_holdback_cents when final > 0" }
      - { name: released_amount_cents, type: integer, source: system, default: 0, description: "Cumulative released to the builder" }
      - { name: remaining_amount_cents, type: integer, source: computed, description: "funded_amount_cents - released_amount_cents" }

  - name: AcknowledgmentSignature
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: system, description: "FK -> Home.id" }
      - { name: appointment_id, type: string, source: system, description: "FK -> OrientationAppointment.id; the completed orientation this acknowledgment covers" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED | DECLINED | STALE" }
      - { name: signer_buyer_id, type: string, source: system, description: "FK -> Homebuyer.id; null until signed" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of latest signing; null until signed" }
      - { name: open_item_snapshot_count, type: integer, source: system, description: "Count of the home's non-terminal DeficiencyItems at the moment of signing (version-pin snapshot); null until signed" }
      - { name: decline_reason, type: string, source: system, description: "Set when DECLINED; cleared on re-request/sign" }

  - name: FeedbackSurvey
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: system, description: "FK -> Home.id" }
      - { name: appointment_id, type: string, source: system, description: "FK -> OrientationAppointment.id" }
      - { name: status, type: enum, source: system, description: "ISSUED | SUBMITTED | EXPIRED" }
      - { name: overall_rating, type: integer, source: input, description: "1..5; set at submit" }
      - { name: systems_demo_rating, type: integer, source: input, description: "1..5; set at submit" }
      - { name: timeliness_rating, type: integer, source: input, description: "1..5; set at submit" }
      - { name: would_recommend, type: boolean, source: input, description: "Set at submit; false applies a -0.5 composite penalty" }
      - { name: comments, type: string, source: input, description: "Optional free text" }
      - { name: composite_score, type: number, source: computed, description: "survey_composite_score output; null until SUBMITTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission; null until SUBMITTED" }
      - { name: window_closes_at, type: datetime, source: system, description: "appointment.completed_at + community.survey_window_days; submission allowed while now <= window_closes_at" }

# =============================================================================
# §1.2 State Machine Table (9 machines; cycles on DeficiencyItem,
#      AcknowledgmentSignature, EscrowHoldback, Home)
# =============================================================================
state_machines:
  - entity: Home
    initial_state: UNDER_CONSTRUCTION
    terminal_states: [CLOSED]
    transitions:
      - from: UNDER_CONSTRUCTION
        to: PRE_CLOSE_READY
        trigger: "POST /api/homes/{id}/mark-ready"
        actor: CustomerCareManager
        preconditions: []
        side_effects: ["home.version increments"]
      - from: PRE_CLOSE_READY
        to: ORIENTATION_SCHEDULED
        trigger: "system: appointment confirm (POST /api/appointments/{id}/confirm)"
        actor: system
        preconditions: []
        side_effects: []
        note: "also reachable from ORIENTED (re-orientation after a completed appointment)"
      - from: ORIENTED
        to: ORIENTATION_SCHEDULED
        trigger: "system: a subsequent appointment is confirmed"
        actor: system
        preconditions: []
        side_effects: []
      - from: ORIENTATION_SCHEDULED
        to: PRE_CLOSE_READY
        trigger: "system: the confirmed appointment is cancelled or marked no-show"
        actor: system
        preconditions: []
        side_effects: []
      - from: ORIENTATION_SCHEDULED
        to: ORIENTED
        trigger: "system: appointment completes (POST /api/appointments/{id}/complete)"
        actor: system
        preconditions: []
        side_effects:
          - "LINK1 of completion cascade: this flip is caused by the appointment reaching COMPLETED"
          - "LINK2: an EscrowHoldback is auto-provisioned for this home in DRAFT with amount 0 (only if no non-VOIDED escrow exists)"
          - "LINK3: provisioning recompute runs escrow_holdback_amount; if amount > 0 the new escrow flips DRAFT -> ACTIVE in the same request"
      - from: ORIENTED
        to: ACKNOWLEDGED
        trigger: "system: acknowledgment signature responds SIGN (POST /api/acknowledgment-signatures/{id}/respond)"
        actor: system
        preconditions: ["signature.status becomes SIGNED"]
        side_effects: ["readiness recompute: if open_before_closing_count == 0, immediately continue to READY_TO_CLOSE"]
      - from: ACKNOWLEDGED
        to: READY_TO_CLOSE
        trigger: "system: open_before_closing_count recomputes to 0 (deficiency sign-off / withdrawal / resolution change while ACKNOWLEDGED)"
        actor: system
        preconditions: ["signature.status == SIGNED", "open_before_closing_count == 0"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: ORIENTED
        trigger: "system: a new DeficiencyItem is identified, staling the SIGNED signature"
        actor: system
        preconditions: []
        side_effects: []
        note: "cycle: ORIENTED -> ACKNOWLEDGED -> ORIENTED"
      - from: READY_TO_CLOSE
        to: ACKNOWLEDGED
        trigger: "system: open_before_closing_count recomputes to > 0 (resolution change to COMPLETE_BEFORE_CLOSING on an open item)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY_TO_CLOSE
        to: ORIENTED
        trigger: "system: a new DeficiencyItem is identified, staling the SIGNED signature"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY_TO_CLOSE
        to: CLOSED
        trigger: "POST /api/homes/{id}/close"
        actor: CustomerCareManager
        preconditions:
          - "home.status == READY_TO_CLOSE (else ERR_INVALID_STATE)"
          - "if a non-VOIDED EscrowHoldback exists with final_holdback > 0: funded_holdback_cents is required and MUST equal final_holdback_cents (else ERR_HOLDBACK_FUNDING_MISMATCH); otherwise funded_holdback_cents must be omitted (else ERR_VALIDATION)"
        side_effects:
          - "escrow: final_holdback_cents frozen (escrow_holdback_amount FINAL variant), funded_amount_cents recorded, remaining = funded"
          - "escrow with final 0 and status DRAFT -> VOIDED"
          - "home.version increments"

  - entity: OrientationAppointment
    initial_state: REQUESTED
    note: "creation precondition (state check): the referenced home must be PRE_CLOSE_READY (first orientation) or ORIENTED (re-orientation); homes in any other status reject creation with ERR_INVALID_STATE"
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/appointments/{id}/confirm"
        actor: CustomerCareManager
        preconditions: []
        side_effects: ["home (PRE_CLOSE_READY or ORIENTED) -> ORIENTATION_SCHEDULED", "appointment.version increments"]
      - from: REQUESTED
        to: REQUESTED
        trigger: "POST /api/appointments/{id}/reschedule (OCC)"
        actor: CustomerCareRep
        preconditions:
          - "expected_appointment_version == appointment.version (else ERR_STALE_VERSION)"
          - "reschedule_count < 3 (else ERR_RESCHEDULE_LIMIT_REACHED)"
          - "appointment_window_check passes for new scheduled_start (else ERR_OUTSIDE_SCHEDULING_WINDOW / ERR_SCHEDULE_IN_PAST)"
          - "orientation_overlap_check passes (else ERR_REP_SCHEDULE_CONFLICT)"
        side_effects: ["scheduled_start/duration updated", "reschedule_count += 1", "appointment.version increments"]
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /api/appointments/{id}/reschedule (OCC)"
        actor: CustomerCareRep
        preconditions: ["same as REQUESTED->REQUESTED reschedule"]
        side_effects: ["same as REQUESTED->REQUESTED reschedule"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/appointments/{id}/cancel (reason != BUYER_NO_SHOW or omitted)"
        actor: CustomerCareRep | CustomerCareManager
        preconditions: []
        side_effects: ["cancel_reason recorded"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/appointments/{id}/cancel (reason != BUYER_NO_SHOW or omitted)"
        actor: CustomerCareRep | CustomerCareManager
        preconditions: []
        side_effects: ["cancel_reason recorded", "home ORIENTATION_SCHEDULED -> PRE_CLOSE_READY"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/appointments/{id}/cancel with reason = BUYER_NO_SHOW"
        actor: CustomerCareRep | CustomerCareManager
        preconditions: []
        side_effects: ["cancel_reason = BUYER_NO_SHOW", "home ORIENTATION_SCHEDULED -> PRE_CLOSE_READY"]
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /api/appointments/{id}/start"
        actor: CustomerCareRep
        preconditions:
          - "logical clock now within [scheduled_start - 30 minutes, scheduled_start + duration_minutes] inclusive (else ERR_APPOINTMENT_START_WINDOW)"
        side_effects:
          - "checklist_items seeded from the fixed catalog: HVAC(req), PLUMBING(req), ELECTRICAL(req), APPLIANCES(optional), EXTERIOR(req), SAFETY(req); all PENDING"
          - "appointment.version increments"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/appointments/{id}/complete"
        actor: CustomerCareRep
        preconditions:
          - "every checklist item with is_required=true has demonstration_status == DEMONSTRATED and no item is PENDING (else ERR_CHECKLIST_INCOMPLETE)"
          - "at least one attendee with verification_status == VERIFIED where (attendee_type IN {BUYER, CO_BUYER} and buyer_id == home.primary_buyer_id) OR attendee_type == POA_PROXY (else ERR_ATTENDEE_REQUIREMENT_UNMET)"
        side_effects:
          - "completed_at = logical clock now"
          - "cascade-create FeedbackSurvey (ISSUED; window_closes_at = completed_at + community.survey_window_days)"
          - "cascade-create AcknowledgmentSignature (PENDING) only if none exists for this home; otherwise leave existing unchanged"
          - "home ORIENTATION_SCHEDULED -> ORIENTED (which itself provisions the EscrowHoldback DRAFT and runs the activation recompute — see Home machine LINK1..3)"
          - "appointment.version increments"

  - entity: Attendee
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /api/attendees/{id}/decide-verification (decision = VERIFIED)"
        actor: CustomerCareRep | CustomerCareManager
        preconditions:
          - "appointment.status IN {CONFIRMED, IN_PROGRESS} (else ERR_INVALID_STATE)"
          - "segregation: a CustomerCareRep actor's X-User-ID MUST differ from appointment.rep_id (else ERR_SELF_VERIFICATION_FORBIDDEN); CustomerCareManager is exempt"
        side_effects: ["decided_by_user_id recorded", "attendee.version increments"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/attendees/{id}/decide-verification (decision = REJECTED)"
        actor: CustomerCareRep | CustomerCareManager
        preconditions: ["same as VERIFIED decision"]
        side_effects: ["rejection_reason recorded", "attendee.version increments"]

  - entity: DeficiencyItem
    initial_state: IDENTIFIED
    terminal_states: [SIGNED_OFF, WITHDRAWN]
    transitions:
      - from: IDENTIFIED
        to: CLASSIFIED
        trigger: "POST /api/deficiency-items/{id}/classify"
        actor: CustomerCareRep
        preconditions:
          - "classification IN {WARRANTABLE, COSMETIC} (else ERR_VALIDATION)"
          - "if classification == COSMETIC and community.cosmetic_photo_required: photo_evidence_ref required (else ERR_PHOTO_EVIDENCE_REQUIRED)"
        side_effects: ["classification/cost/photo recorded", "item.version increments"]
      - from: CLASSIFIED
        to: DECIDED
        trigger: "POST /api/deficiency-items/{id}/decide"
        actor: CustomerCareManager
        preconditions: []
        side_effects:
          - "resolution recorded"
          - "if a non-VOIDED EscrowHoldback exists for the home: escrow_holdback_amount recomputed; escrow DRAFT -> ACTIVE when amount becomes > 0; ACTIVE -> VOIDED when amount returns to 0"
          - "home open_before/after counts recomputed; READY_TO_CLOSE re-evaluation"
      - from: DECIDED
        to: DECIDED
        trigger: "POST /api/deficiency-items/{id}/decide (resolution change)"
        actor: CustomerCareManager
        preconditions: []
        side_effects:
          - "resolution overwritten"
          - "escrow recompute as above (compensating: AFTER->BEFORE removes exactly the contribution the BEFORE->AFTER added)"
          - "home open_before/after counts recomputed; READY_TO_CLOSE <-> ACKNOWLEDGED re-evaluation"
      - from: DECIDED
        to: IN_REPAIR
        trigger: "POST /api/deficiency-items/{id}/start-repair"
        actor: CustomerCareRep
        preconditions: []
        side_effects: ["home counts recomputed"]
      - from: IN_REPAIR
        to: READY_FOR_REINSPECTION
        trigger: "POST /api/deficiency-items/{id}/complete-repair"
        actor: CustomerCareRep
        preconditions: []
        side_effects: ["home counts recomputed"]
      - from: READY_FOR_REINSPECTION
        to: VERIFIED
        trigger: "system: reinspection visit completes with outcome PASS for this item"
        actor: system
        preconditions: []
        side_effects: ["home counts recomputed; READY_TO_CLOSE re-evaluation"]
      - from: READY_FOR_REINSPECTION
        to: IN_REPAIR
        trigger: "system: reinspection visit completes with outcome FAIL for this item"
        actor: system
        preconditions: []
        side_effects: ["home counts recomputed"]
        note: "repair loop cycle: IN_REPAIR -> READY_FOR_REINSPECTION -> IN_REPAIR (unbounded)"
      - from: VERIFIED
        to: SIGNED_OFF
        trigger: "POST /api/deficiency-items/{id}/sign-off"
        actor: Homebuyer
        preconditions:
          - "actor X-User-ID == home.primary_buyer_id (else ERR_FORBIDDEN)"
        side_effects:
          - "signed_off_at = logical clock now"
          - "home counts recomputed; READY_TO_CLOSE re-evaluation"
          - "item becomes eligible for escrow release"
      - from: IDENTIFIED
        to: WITHDRAWN
        trigger: "POST /api/deficiency-items/{id}/withdraw"
        actor: Homebuyer
        preconditions: ["actor X-User-ID == home.primary_buyer_id (else ERR_FORBIDDEN)"]
        side_effects: []
      - from: CLASSIFIED
        to: WITHDRAWN
        trigger: "POST /api/deficiency-items/{id}/withdraw"
        actor: Homebuyer
        preconditions:
          - "actor X-User-ID == home.primary_buyer_id (else ERR_FORBIDDEN)"
          - "classification == COSMETIC (WARRANTABLE classified items cannot be withdrawn: ERR_WITHDRAW_NOT_ALLOWED)"
        side_effects: []

  - entity: ReinspectionVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/reinspection-visits/{id}/complete"
        actor: CustomerCareRep
        preconditions:
          - "logical clock now >= scheduled_start (else ERR_VISIT_TOO_EARLY)"
          - "every results[] entry references a DeficiencyItem of this home in READY_FOR_REINSPECTION (else ERR_INVALID_STATE)"
        side_effects:
          - "per result: item READY_FOR_REINSPECTION -> VERIFIED (PASS) or -> IN_REPAIR (FAIL)"
          - "home counts recomputed; READY_TO_CLOSE re-evaluation"
          - "visit.version increments"

  - entity: EscrowHoldback
    initial_state: DRAFT
    terminal_states: [FULLY_RELEASED, VOIDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system: holdback recompute yields amount > 0 (at provisioning or after a decide)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: VOIDED
        trigger: "system: holdback recompute yields amount == 0 pre-close (all AFTER_CLOSING decisions reversed)"
        actor: system
        preconditions: ["home.status != CLOSED"]
        side_effects: []
        note: "cycle support: a later AFTER_CLOSING decision provisions a fresh DRAFT escrow"
      - from: DRAFT
        to: VOIDED
        trigger: "system: home closes with final_holdback == 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: PARTIALLY_RELEASED
        trigger: "POST /api/escrow-holdbacks/{id}/release (OCC) when remaining > 0 after release"
        actor: CustomerCareManager
        preconditions:
          - "expected_escrow_version == escrow.version (else ERR_STALE_VERSION)"
          - "home.status == CLOSED (else ERR_INVALID_STATE)"
          - "releasable amount > 0 (else ERR_NO_RELEASABLE_AMOUNT)"
        side_effects:
          - "released_amount_cents += releasable; items processed by signed_off_at ASC (tie-break created_at ASC) marked holdback_released = true"
          - "flush rule: if after this release no AFTER_CLOSING item remains in {DECIDED, IN_REPAIR, READY_FOR_REINSPECTION, VERIFIED}, release the ENTIRE remaining balance instead"
          - "escrow.version increments"
      - from: PARTIALLY_RELEASED
        to: PARTIALLY_RELEASED
        trigger: "POST /api/escrow-holdbacks/{id}/release (OCC) when remaining > 0 after release"
        actor: CustomerCareManager
        preconditions: ["same as ACTIVE->PARTIALLY_RELEASED"]
        side_effects: ["same as ACTIVE->PARTIALLY_RELEASED"]
      - from: ACTIVE
        to: FULLY_RELEASED
        trigger: "POST /api/escrow-holdbacks/{id}/release (OCC) when remaining == 0 after release (including flush)"
        actor: CustomerCareManager
        preconditions: ["same as ACTIVE->PARTIALLY_RELEASED"]
        side_effects: ["same as ACTIVE->PARTIALLY_RELEASED", "terminal: no further releases"]
      - from: PARTIALLY_RELEASED
        to: FULLY_RELEASED
        trigger: "POST /api/escrow-holdbacks/{id}/release (OCC) when remaining == 0 after release (including flush)"
        actor: CustomerCareManager
        preconditions: ["same as ACTIVE->PARTIALLY_RELEASED"]
        side_effects: ["same as ACTIVE->PARTIALLY_RELEASED", "terminal: no further releases"]

  - entity: AcknowledgmentSignature
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /api/acknowledgment-signatures/{id}/respond (decision = SIGN)"
        actor: Homebuyer
        preconditions: ["actor X-User-ID == home.primary_buyer_id (else ERR_FORBIDDEN)"]
        side_effects:
          - "signer_buyer_id, signed_at recorded; decline_reason cleared"
          - "open_item_snapshot_count = count of home's DeficiencyItems in non-terminal states (not SIGNED_OFF, not WITHDRAWN)"
          - "home ORIENTED -> ACKNOWLEDGED (then READY_TO_CLOSE re-evaluation)"
      - from: STALE
        to: SIGNED
        trigger: "POST /api/acknowledgment-signatures/{id}/respond (decision = SIGN)"
        actor: Homebuyer
        preconditions: ["same as PENDING->SIGNED"]
        side_effects: ["same as PENDING->SIGNED (snapshot refreshed)"]
        note: "cycle: PENDING -> SIGNED -> STALE -> SIGNED"
      - from: PENDING
        to: DECLINED
        trigger: "POST /api/acknowledgment-signatures/{id}/respond (decision = DECLINE)"
        actor: Homebuyer
        preconditions: ["actor X-User-ID == home.primary_buyer_id (else ERR_FORBIDDEN)"]
        side_effects: ["decline_reason recorded"]
      - from: DECLINED
        to: PENDING
        trigger: "POST /api/acknowledgment-signatures/{id}/re-request"
        actor: CustomerCareRep
        preconditions: []
        side_effects: ["decline_reason cleared", "signature.version increments"]
      - from: SIGNED
        to: STALE
        trigger: "system: a new DeficiencyItem is identified against the home"
        actor: system
        preconditions: []
        side_effects: ["home ACKNOWLEDGED/READY_TO_CLOSE -> ORIENTED"]

  - entity: FeedbackSurvey
    initial_state: ISSUED
    terminal_states: [SUBMITTED, EXPIRED]
    transitions:
      - from: ISSUED
        to: SUBMITTED
        trigger: "POST /api/feedback-surveys/{id}/submit"
        actor: Homebuyer
        preconditions:
          - "actor X-User-ID == home.primary_buyer_id (else ERR_FORBIDDEN)"
          - "logical clock now <= window_closes_at (else ERR_SURVEY_EXPIRED)"
          - "all ratings within 1..5 (else ERR_VALIDATION)"
        side_effects: ["submitted_at = now", "composite_score computed (survey_composite_score)", "survey.version increments"]
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /api/feedback-surveys/expire-due (ops sweep: every ISSUED survey with now > window_closes_at)"
        actor: CustomerCareManager
        preconditions: []
        side_effects: ["survey.version increments per expired survey"]

# =============================================================================
# §1.2.1 Concurrency Rules (true write-write conflicts only; OCC on parent version, 412)
# =============================================================================
concurrency_rules:
  - rule_id: occ-appointment-reschedule
    parent_entity: OrientationAppointment
    write_endpoint: "POST /api/appointments/{id}/reschedule"
    occ_field: "expected_appointment_version"
    description: |
      Rescheduling an appointment whose version has advanced since the client
      last observed it is rejected: the client is acting on a stale view of the
      appointment (e.g., another writer already rescheduled or confirmed it,
      advancing the version). Stated purely as a stale-version check on sequentially observable state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-escrow-release
    parent_entity: EscrowHoldback
    write_endpoint: "POST /api/escrow-holdbacks/{id}/release"
    occ_field: "expected_escrow_version"
    description: |
      Releasing escrow funds against a version the client has not observed is
      rejected: any decide-driven recompute or prior release advances the
      escrow version, so a stale expected version means the amount basis the
      client saw no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-home-closing-reschedule
    parent_entity: Home
    write_endpoint: "POST /api/homes/{id}/reschedule-closing"
    occ_field: "expected_home_version"
    description: |
      Moving a home's closing date against a stale home version is rejected:
      every cascade (appointment confirm/cancel, deficiency activity, signature
      flips) bumps the home version, so a stale expected version means the
      closing context the client saw no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (6 rules; 4 declared variants across 2 domains)
# =============================================================================
calculations:
  - name: escrow_holdback_amount
    trigger: "deficiency decide (AFTER/BEFORE), decide-reversal, escrow provisioning at appointment completion, home close"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: per-line round FIRST, then sum, then clamp.
      # The alternate order (sum unrounded products, then round once) yields
      # different cents and is NOT the contract.
      items(home, statuses) = DeficiencyItem where home_id == home
        AND resolution == COMPLETE_AFTER_CLOSING AND status IN statuses
      contribution(i) = round_half_up(i.estimated_repair_cost_cents * community.holdback_cost_multiplier)   # integer cents
      raw = sum(contribution(i) for i in items)
      amount = 0 if raw == 0 else min(max(raw, community.holdback_min_cents), community.holdback_max_cents)
    input_set: "DeficiencyItems of the home; see variants for the status inclusion set"
    constants:
      ROUNDING: "round_half_up to integer cents, applied per item"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "pre-close display and gating; stored as escrow.holdback_amount_cents on every recompute"
        difference: "inclusion set = {DECIDED, IN_REPAIR, READY_FOR_REINSPECTION, VERIFIED, SIGNED_OFF} (SIGNED_OFF items INCLUDED)"
      - name: final
        when: "computed at POST /api/homes/{id}/close; frozen into escrow.final_holdback_cents and must equal funded_holdback_cents"
        difference: "inclusion set = {DECIDED, IN_REPAIR, READY_FOR_REINSPECTION, VERIFIED} (SIGNED_OFF items EXCLUDED) — identical data, different amount whenever any after-closing item was signed off pre-close"

  - name: survey_composite_score
    trigger: "POST /api/feedback-surveys/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      base = 0.5 * overall_rating + 0.3 * systems_demo_rating + 0.2 * timeliness_rating
      if would_recommend == false: base = base - 0.5
      if min(overall_rating, systems_demo_rating, timeliness_rating) == 1:
          composite = min(base, 2.0)          # detractor cap — conditional branch
      else:
          composite = base
      composite = clamp(composite, 1.00, 5.00)
      composite = round_half_up(composite, 2)  # 2 decimal places
    input_set: "the submitting survey's three ratings + would_recommend"
    constants:
      W_OVERALL: 0.5
      W_SYSTEMS: 0.3
      W_TIMELINESS: 0.2
      NO_RECOMMEND_PENALTY: 0.5
      DETRACTOR_CAP: 2.0
    precision: "2 decimal places, round_half_up"

  - name: quality_trend_aggregation
    trigger: "GET /api/communities/{id}/quality-trend?period_month=YYYY-MM"
    algorithm: aggregation
    formula: |
      period = [YYYY-MM-01T00:00:00Z, (YYYY-MM+1)-01T00:00:00Z)   # HALF-OPEN
      surveys = FeedbackSurvey where home.community_id == community
        AND status == SUBMITTED AND submitted_at IN period
      submitted_survey_count = count(surveys)
      response_weighted_avg_score =
        round_half_up(sum(s.composite_score) / submitted_survey_count, 2)   # null if count == 0
      per_home_avg(h) = round_half_up(mean of composite_score over surveys of h, 2)
      home_weighted_avg_score =
        round_half_up(mean of per_home_avg over distinct homes having >=1 survey, 2)   # null if count == 0
      avg_warrantable_items_per_home =
        round_half_up(count(DeficiencyItem on homes of this community with
          classification == WARRANTABLE and created_at IN period)
          / count(distinct homes with an orientation appointment COMPLETED with completed_at IN period), 2)
        # null when the denominator == 0
    input_set: "SUBMITTED surveys of the community in the half-open month window; warrantable items created in the month; completions in the month"
    constants: {}
    precision: "2 decimal places, round_half_up; null (not 0) for averages over empty sets"
    variants:
      - name: response_weighted
        when: "field response_weighted_avg_score"
        difference: "every survey weighs equally"
      - name: home_weighted
        when: "field home_weighted_avg_score"
        difference: "each HOME weighs equally (per-home mean first, then mean across homes) — diverges from response_weighted whenever survey counts per home are unequal"

  - name: appointment_window_check
    trigger: "POST /api/appointments, POST /api/appointments/{id}/reschedule"
    algorithm: threshold
    formula: |
      minutes_before_closing = (home.closing_date - scheduled_start) in whole minutes
      require minutes_before_closing >= community.orientation_min_days_before_closing * 1440   # INCLUSIVE lower bound
      require minutes_before_closing <= community.orientation_max_days_before_closing * 1440   # INCLUSIVE upper bound
      require scheduled_start > logical_clock.now                                              # strictly future
    input_set: "the home's closing_date, the community window policy, the logical clock"
    constants:
      MINUTES_PER_DAY: 1440
    precision: "whole minutes; both bounds inclusive (exactly min_days before closing is allowed; one minute less is rejected)"

  - name: orientation_overlap_check
    trigger: "POST /api/appointments, POST /api/appointments/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # Semantics A — CLOSED, buffer-extended, pairwise per rep:
      b = community.appointment_buffer_minutes
      each existing OrientationAppointment of the same rep with status IN {REQUESTED, CONFIRMED, IN_PROGRESS}
        occupies the CLOSED interval [start - b, start + duration + b]
      conflict iff (new_start - b) <= (existing_end + b) AND (existing_start - b) <= (new_end + b)
      # touching intervals count as conflict (closed endpoints)
    input_set: "same-rep orientation appointments in non-terminal states"
    constants: {}
    precision: "minute precision; closed-interval adjacency IS a conflict"

  - name: reinspection_capacity_check
    trigger: "POST /api/reinspection-visits"
    algorithm: interval_merge
    formula: |
      # Semantics B — HALF-OPEN pairwise + DAILY AGGREGATE capacity per rep:
      (1) pairwise: each existing ReinspectionVisit of the same rep with status == SCHEDULED
          occupies the HALF-OPEN interval [start, start + duration)
          conflict iff new_start < existing_end AND existing_start < new_end
          # adjacency is ALLOWED (new_start == existing_end is fine)
      (2) aggregate: sum(duration_minutes of the rep's visits with status IN {SCHEDULED, COMPLETED}
          whose UTC calendar date == new visit's UTC calendar date) + new.duration_minutes
          must be <= rep.daily_visit_capacity_minutes   # INCLUSIVE cap
      visits never conflict with orientation appointments (different crews) — documented non-rule
    input_set: "same-rep visits; the rep's daily capacity"
    constants:
      DEFAULT_VISIT_DURATION_MINUTES: 60
    precision: "minute precision; half-open adjacency allowed; capacity boundary == is allowed, +1 rejected"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed ownership: for Homebuyer-scoped operations (sign-off, withdraw, respond, submit) X-User-ID must equal the home's primary_buyer_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "buyer-scoped endpoints" }
  - { priority: 4, category: business_constraint, check: "request schema: required fields present, types and enum members valid, ratings within 1..5", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "path identifiers resolve (home, appointment, attendee, item, visit, escrow, signature, survey)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: business_referential, check: "body foreign keys resolve and are consistent (appointment.home_id == home_id on item create; buyer_id exists; community/rep exist)", error_id: ERR_REFERENCED_ENTITY_NOT_FOUND, http_status: 422, applies_to: "endpoints with body FKs" }
  - { priority: 7, category: state, check: "target entity is in a valid from-state for the requested transition (incl. escrow not FULLY_RELEASED/VOIDED, appointment not terminal, survey not SUBMITTED/EXPIRED, attendee not decided)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 8, category: business_safety, check: "compliance: segregation of duties (conducting rep cannot verify own appointment's attendees); POA_PROXY attendee requires proxy_name + poa_document_ref and forbids buyer_id; BUYER/CO_BUYER require buyer_id and forbid proxy fields", error_id: "ERR_SELF_VERIFICATION_FORBIDDEN (403) | ERR_POA_DOCUMENT_REQUIRED (422) | ERR_ATTENDEE_IDENTITY_INVALID (422)", http_status: 403, applies_to: "attendee create / decide-verification" }
  - { priority: 9, category: business_temporal, check: "temporal gates: orientation window (min/max days before closing), schedule-in-past, appointment start window, survey submission window, visit completion before scheduled start", error_id: "ERR_OUTSIDE_SCHEDULING_WINDOW | ERR_SCHEDULE_IN_PAST | ERR_APPOINTMENT_START_WINDOW | ERR_SURVEY_EXPIRED | ERR_VISIT_TOO_EARLY", http_status: 422, applies_to: "appointment create/reschedule/start, visit create/complete, survey submit" }
  - { priority: 10, category: business_constraint, check: "structural constraints: one open appointment per home; rep overlap (closed buffered for orientations, half-open for visits); daily visit capacity; reschedule cap; checklist/attendee completion gates; cosmetic photo flag; withdraw restricted to cosmetic-classified or unclassified items; rep must be active; email uniqueness", error_id: "ERR_OPEN_APPOINTMENT_EXISTS | ERR_REP_SCHEDULE_CONFLICT | ERR_VISIT_OVERLAP | ERR_DAILY_CAPACITY_EXCEEDED | ERR_RESCHEDULE_LIMIT_REACHED | ERR_CHECKLIST_INCOMPLETE | ERR_ATTENDEE_REQUIREMENT_UNMET | ERR_PHOTO_EVIDENCE_REQUIRED | ERR_WITHDRAW_NOT_ALLOWED | ERR_REP_INACTIVE | ERR_DUPLICATE_EMAIL", http_status: 409, applies_to: "various" }
  - { priority: 11, category: business_fiscal, check: "fiscal gates: releasable amount > 0 on release; funded_holdback_cents equals final holdback at close", error_id: "ERR_NO_RELEASABLE_AMOUNT (409) | ERR_HOLDBACK_FUNDING_MISMATCH (422)", http_status: 409, applies_to: "escrow release, home close" }

# =============================================================================
# §1.5 API Endpoint Table (48 endpoints)
# =============================================================================
endpoints:
  # --- Community / config / analytics ---
  - { method: POST, path: "/api/communities", description: "Create a community with policy configuration", roles: [CustomerCareManager], code: 201, input: [name, "holdback_cost_multiplier?", "holdback_min_cents?", "holdback_max_cents?", "orientation_min_days_before_closing?", "orientation_max_days_before_closing?", "appointment_duration_minutes?", "appointment_buffer_minutes?", "survey_window_days?", "cosmetic_photo_required?"], output: Community, side_effects: ["defaults applied per §1.1"] }
  - { method: GET, path: "/api/communities/{id}/quality-trend", description: "Computed quality trend for one calendar month (both weighting variants)", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [period_month], output: { period_month: string, submitted_survey_count: integer, homes_surveyed_count: integer, response_weighted_avg_score: "number|null", home_weighted_avg_score: "number|null", avg_warrantable_items_per_home: "number|null" }, side_effects: ["runs quality_trend_aggregation"] }

  # --- Homebuyer / Rep registry ---
  - { method: POST, path: "/api/homebuyers", description: "Register a homebuyer", roles: [CustomerCareManager], code: 201, input: [full_name, email, "phone?"], output: Homebuyer, side_effects: ["email uniqueness enforced (ERR_DUPLICATE_EMAIL)"] }
  - { method: POST, path: "/api/reps", description: "Register a customer care rep", roles: [CustomerCareManager], code: 201, input: [full_name, email, "active?", "daily_visit_capacity_minutes?"], output: CustomerCareRep, side_effects: ["email uniqueness enforced (ERR_DUPLICATE_EMAIL)"] }

  # --- Home ---
  - { method: POST, path: "/api/homes", description: "Create a home (starts UNDER_CONSTRUCTION)", roles: [CustomerCareManager], code: 201, input: [community_id, primary_buyer_id, lot_number, address, sales_price_cents, closing_date], output: Home, side_effects: ["status=UNDER_CONSTRUCTION, counts=0"] }
  - { method: GET, path: "/api/homes/{id}", description: "Get a home", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: Home, side_effects: [] }
  - { method: GET, path: "/api/homes", description: "List/filter homes", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["community_id?", "primary_buyer_id?", "status?", "limit?", "offset?"], output: "Home[]", side_effects: [] }
  - { method: POST, path: "/api/homes/{id}/mark-ready", description: "UNDER_CONSTRUCTION -> PRE_CLOSE_READY", roles: [CustomerCareManager], code: 200, input: [], output: Home, side_effects: ["increments Home.version by 1"] }
  - { method: POST, path: "/api/homes/{id}/reschedule-closing", description: "Move closing_date (OCC on home version)", roles: [CustomerCareManager], code: 200, input: [closing_date, expected_home_version], output: Home, side_effects: ["increments Home.version by 1"] }
  - { method: POST, path: "/api/homes/{id}/close", description: "READY_TO_CLOSE -> CLOSED; freezes final holdback and records funding", roles: [CustomerCareManager], code: 200, input: ["funded_holdback_cents?"], output: Home, side_effects: ["escrow final/funded frozen", "escrow DRAFT with final 0 -> VOIDED", "increments Home.version by 1"] }

  # --- OrientationAppointment ---
  - { method: POST, path: "/api/appointments", description: "Schedule an orientation appointment. Preconditions: home.status IN {PRE_CLOSE_READY, ORIENTED} (else ERR_INVALID_STATE — ORIENTED permits a re-orientation), rep active, no other appointment of this home in {REQUESTED, CONFIRMED, IN_PROGRESS} (ERR_OPEN_APPOINTMENT_EXISTS), window check (ERR_OUTSIDE_SCHEDULING_WINDOW/ERR_SCHEDULE_IN_PAST), buffer-extended overlap check (ERR_REP_SCHEDULE_CONFLICT)", roles: [CustomerCareRep], code: 201, input: [home_id, rep_id, scheduled_start, "duration_minutes?"], output: OrientationAppointment, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/api/appointments/{id}", description: "Get an appointment (includes embedded checklist)", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: OrientationAppointment, side_effects: [] }
  - { method: GET, path: "/api/appointments", description: "List/filter appointments", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["home_id?", "rep_id?", "status?", "limit?", "offset?"], output: "OrientationAppointment[]", side_effects: [] }
  - { method: POST, path: "/api/appointments/{id}/confirm", description: "REQUESTED -> CONFIRMED; home -> ORIENTATION_SCHEDULED", roles: [CustomerCareManager], code: 200, input: [], output: OrientationAppointment, side_effects: ["home flip", "increments OrientationAppointment.version by 1"] }
  - { method: POST, path: "/api/appointments/{id}/reschedule", description: "Move appointment within REQUESTED/CONFIRMED (OCC on appointment version); rechecks window and overlap; reschedule_count cap 3", roles: [CustomerCareRep], code: 200, input: [scheduled_start, "duration_minutes?", expected_appointment_version], output: OrientationAppointment, side_effects: ["reschedule_count += 1", "increments OrientationAppointment.version by 1"] }
  - { method: POST, path: "/api/appointments/{id}/cancel", description: "Cancel; from CONFIRMED with reason=BUYER_NO_SHOW lands in NO_SHOW, else CANCELLED", roles: [CustomerCareRep, CustomerCareManager], code: 200, input: ["reason?"], output: OrientationAppointment, side_effects: ["confirmed cancel/no-show reverts home to PRE_CLOSE_READY", "increments OrientationAppointment.version by 1"] }
  - { method: POST, path: "/api/appointments/{id}/start", description: "CONFIRMED -> IN_PROGRESS; seeds the 6-item demonstration checklist", roles: [CustomerCareRep], code: 200, input: [], output: OrientationAppointment, side_effects: ["checklist seeded", "increments OrientationAppointment.version by 1"] }
  - { method: POST, path: "/api/appointments/{id}/complete", description: "IN_PROGRESS -> COMPLETED; cascades: survey ISSUED, signature PENDING, home ORIENTED, escrow provisioned/activated", roles: [CustomerCareRep], code: 200, input: [], output: OrientationAppointment, side_effects: ["completed_at set", "FeedbackSurvey created", "AcknowledgmentSignature created if none", "home ORIENTED", "escrow DRAFT provisioned then recompute (DRAFT->ACTIVE when amount>0)", "increments OrientationAppointment.version by 1"] }
  - { method: POST, path: "/api/appointments/{id}/checklist-items/{system_key}/mark", description: "Set a checklist entry outcome: DEMONSTRATED | SKIPPED | PENDING (PENDING = compensating reset)", roles: [CustomerCareRep], code: 200, input: [outcome], output: OrientationAppointment, side_effects: ["checklist counts recomputed", "increments OrientationAppointment.version by 1"] }

  # --- Attendee ---
  - { method: POST, path: "/api/attendees", description: "Record an attendee for an appointment (identity rules per attendee_type)", roles: [CustomerCareRep], code: 201, input: [appointment_id, attendee_type, "buyer_id?", "proxy_name?", "poa_document_ref?"], output: Attendee, side_effects: ["verification_status=PENDING"] }
  - { method: GET, path: "/api/attendees/{id}", description: "Get an attendee", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: Attendee, side_effects: [] }
  - { method: GET, path: "/api/attendees", description: "List/filter attendees", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["appointment_id?", "buyer_id?", "verification_status?", "limit?", "offset?"], output: "Attendee[]", side_effects: [] }
  - { method: POST, path: "/api/attendees/{id}/decide-verification", description: "PENDING -> VERIFIED | REJECTED; conducting rep is barred (segregation of duties)", roles: [CustomerCareRep, CustomerCareManager], code: 200, input: [decision, "rejection_reason?"], output: Attendee, side_effects: ["decided_by_user_id recorded", "increments Attendee.version by 1"] }

  # --- DeficiencyItem ---
  - { method: POST, path: "/api/deficiency-items", description: "Identify a deficiency during/after the walkthrough; stales a SIGNED signature and reverts the home", roles: [CustomerCareRep], code: 201, input: [home_id, appointment_id, "system_key?", title, "description?"], output: DeficiencyItem, side_effects: ["status=IDENTIFIED", "if signature SIGNED -> STALE", "if home ACKNOWLEDGED/READY_TO_CLOSE -> ORIENTED"] }
  - { method: GET, path: "/api/deficiency-items/{id}", description: "Get a deficiency item", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: DeficiencyItem, side_effects: [] }
  - { method: GET, path: "/api/deficiency-items", description: "List/filter deficiency items", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["home_id?", "appointment_id?", "status?", "classification?", "limit?", "offset?"], output: "DeficiencyItem[]", side_effects: [] }
  - { method: POST, path: "/api/deficiency-items/{id}/classify", description: "IDENTIFIED -> CLASSIFIED (warrantable/cosmetic; photo rule when flagged)", roles: [CustomerCareRep], code: 200, input: [classification, estimated_repair_cost_cents, "photo_evidence_ref?"], output: DeficiencyItem, side_effects: ["classification recorded", "increments DeficiencyItem.version by 1"] }
  - { method: POST, path: "/api/deficiency-items/{id}/decide", description: "CLASSIFIED -> DECIDED or DECIDED -> DECIDED (resolution change); escrow recompute with compensating symmetry", roles: [CustomerCareManager], code: 200, input: [resolution], output: DeficiencyItem, side_effects: ["escrow recompute; DRAFT<->ACTIVE or ACTIVE->VOIDED as amount crosses 0", "home counts recomputed", "increments DeficiencyItem.version by 1"] }
  - { method: POST, path: "/api/deficiency-items/{id}/start-repair", description: "DECIDED -> IN_REPAIR", roles: [CustomerCareRep], code: 200, input: [], output: DeficiencyItem, side_effects: ["home counts recomputed", "increments DeficiencyItem.version by 1"] }
  - { method: POST, path: "/api/deficiency-items/{id}/complete-repair", description: "IN_REPAIR -> READY_FOR_REINSPECTION", roles: [CustomerCareRep], code: 200, input: [], output: DeficiencyItem, side_effects: ["home counts recomputed", "increments DeficiencyItem.version by 1"] }
  - { method: POST, path: "/api/deficiency-items/{id}/withdraw", description: "IDENTIFIED -> WITHDRAWN, or CLASSIFIED -> WITHDRAWN when cosmetic (buyer only)", roles: [Homebuyer], code: 200, input: [], output: DeficiencyItem, side_effects: ["increments DeficiencyItem.version by 1"] }
  - { method: POST, path: "/api/deficiency-items/{id}/sign-off", description: "VERIFIED -> SIGNED_OFF (buyer only); item becomes escrow-release eligible", roles: [Homebuyer], code: 200, input: [], output: DeficiencyItem, side_effects: ["signed_off_at set", "home counts recomputed; READY_TO_CLOSE re-evaluation", "increments DeficiencyItem.version by 1"] }

  # --- ReinspectionVisit ---
  - { method: POST, path: "/api/reinspection-visits", description: "Schedule a re-inspection visit (half-open overlap + daily aggregate capacity)", roles: [CustomerCareRep], code: 201, input: [home_id, rep_id, scheduled_start, "duration_minutes?"], output: ReinspectionVisit, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/api/reinspection-visits/{id}", description: "Get a visit", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: ReinspectionVisit, side_effects: [] }
  - { method: GET, path: "/api/reinspection-visits", description: "List/filter visits", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["home_id?", "rep_id?", "status?", "limit?", "offset?"], output: "ReinspectionVisit[]", side_effects: [] }
  - { method: POST, path: "/api/reinspection-visits/{id}/complete", description: "SCHEDULED -> COMPLETED; applies per-item PASS/FAIL outcomes", roles: [CustomerCareRep], code: 200, input: [results], output: ReinspectionVisit, side_effects: ["items -> VERIFIED (PASS) or IN_REPAIR (FAIL)", "home counts recomputed", "increments ReinspectionVisit.version by 1"] }

  # --- EscrowHoldback ---
  - { method: GET, path: "/api/escrow-holdbacks/{id}", description: "Get an escrow holdback", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: EscrowHoldback, side_effects: [] }
  - { method: GET, path: "/api/escrow-holdbacks", description: "List/filter escrow holdbacks (0..1 non-VOIDED per home; VOIDED retained for history)", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["home_id?", "status?", "limit?", "offset?"], output: "EscrowHoldback[]", side_effects: [] }
  - { method: POST, path: "/api/escrow-holdbacks/{id}/release", description: "Release funds for SIGNED_OFF items (computed amount, oldest sign-off first; flush when no open after-items remain)", roles: [CustomerCareManager], code: 200, input: [expected_escrow_version], output: EscrowHoldback, side_effects: ["released += releasable; items marked holdback_released", "status -> PARTIALLY_RELEASED or FULLY_RELEASED (remaining == 0)", "increments EscrowHoldback.version by 1"] }

  # --- AcknowledgmentSignature ---
  - { method: GET, path: "/api/acknowledgment-signatures/{id}", description: "Get a signature record", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: AcknowledgmentSignature, side_effects: [] }
  - { method: GET, path: "/api/acknowledgment-signatures", description: "List/filter signature records", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["home_id?", "appointment_id?", "signer_buyer_id?", "status?", "limit?", "offset?"], output: "AcknowledgmentSignature[]", side_effects: [] }
  - { method: POST, path: "/api/acknowledgment-signatures/{id}/respond", description: "Buyer responds SIGN or DECLINE; SIGN pins the open-item snapshot and flips the home", roles: [Homebuyer], code: 200, input: [decision, "signature_payload?", "decline_reason?"], output: AcknowledgmentSignature, side_effects: ["SIGN: snapshot pinned, home ORIENTED -> ACKNOWLEDGED (+READY_TO_CLOSE re-eval)", "DECLINE: reason recorded", "increments AcknowledgmentSignature.version by 1"] }
  - { method: POST, path: "/api/acknowledgment-signatures/{id}/re-request", description: "DECLINED -> PENDING", roles: [CustomerCareRep], code: 200, input: [], output: AcknowledgmentSignature, side_effects: ["decline_reason cleared", "increments AcknowledgmentSignature.version by 1"] }

  # --- FeedbackSurvey ---
  - { method: GET, path: "/api/feedback-surveys/{id}", description: "Get a survey", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: [], output: FeedbackSurvey, side_effects: [] }
  - { method: GET, path: "/api/feedback-surveys", description: "List/filter surveys", roles: [CustomerCareManager, CustomerCareRep, Homebuyer], code: 200, input: ["home_id?", "appointment_id?", "status?", "limit?", "offset?"], output: "FeedbackSurvey[]", side_effects: [] }
  - { method: POST, path: "/api/feedback-surveys/{id}/submit", description: "Submit survey (buyer only, within window); computes composite score", roles: [Homebuyer], code: 200, input: [overall_rating, systems_demo_rating, timeliness_rating, would_recommend, "comments?"], output: FeedbackSurvey, side_effects: ["composite_score computed", "submitted_at set", "increments FeedbackSurvey.version by 1"] }
  - { method: POST, path: "/api/feedback-surveys/expire-due", description: "Ops sweep: ISSUED surveys with now > window_closes_at -> EXPIRED", roles: [CustomerCareManager], code: 200, input: [], output: { expired_count: integer, expired_survey_ids: "array" }, side_effects: ["per expired survey: status EXPIRED, version increments"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. STARTUP DEFAULT (before any call): 2026-08-01T00:00:00Z — the server MUST NOT fall back to wall-clock time; all temporal gates read this clock", roles: [CustomerCareManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog (28 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted, or entity-backed ownership check failed (buyer acting on another buyer's home)" }
  - { id: ERR_VALIDATION, http: 400, condition: "required field missing, bad type/enum member, rating outside 1..5, or funded_holdback_cents supplied when no holdback is due" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path identifier does not resolve" }
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 422, condition: "body foreign key does not resolve, or appointment_id does not belong to home_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "entity not in a valid from-state for the requested transition (covers terminal lockdown, re-decision of attendees, submit on non-ISSUED survey, release on FULLY_RELEASED/VOIDED escrow, close when not READY_TO_CLOSE, visit results referencing items not READY_FOR_REINSPECTION)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SELF_VERIFICATION_FORBIDDEN, http: 403, condition: "conducting rep (X-User-ID == appointment.rep_id) attempts to verify/reject that appointment's attendee" }
  - { id: ERR_POA_DOCUMENT_REQUIRED, http: 422, condition: "POA_PROXY attendee without proxy_name or poa_document_ref" }
  - { id: ERR_ATTENDEE_IDENTITY_INVALID, http: 422, condition: "buyer_id present on POA_PROXY, absent on BUYER/CO_BUYER, or proxy fields present on BUYER/CO_BUYER" }
  - { id: ERR_OUTSIDE_SCHEDULING_WINDOW, http: 422, condition: "orientation start not within [min_days, max_days] before closing (inclusive bounds, whole minutes)" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "scheduled_start is not strictly after the logical clock" }
  - { id: ERR_APPOINTMENT_START_WINDOW, http: 409, condition: "start attempted outside [scheduled_start - 30min, scheduled_start + duration]" }
  - { id: ERR_SURVEY_EXPIRED, http: 409, condition: "submit while ISSUED but logical clock is past window_closes_at" }
  - { id: ERR_VISIT_TOO_EARLY, http: 409, condition: "visit completion attempted before its scheduled_start" }
  - { id: ERR_OPEN_APPOINTMENT_EXISTS, http: 409, condition: "home already has an appointment in REQUESTED/CONFIRMED/IN_PROGRESS" }
  - { id: ERR_REP_SCHEDULE_CONFLICT, http: 409, condition: "orientation appointment collides with the rep's closed, buffer-extended occupied intervals (touching counts)" }
  - { id: ERR_VISIT_OVERLAP, http: 409, condition: "reinspection visit collides with the rep's half-open visit intervals (adjacency allowed)" }
  - { id: ERR_DAILY_CAPACITY_EXCEEDED, http: 409, condition: "visit would push the rep's same-day total above daily_visit_capacity_minutes (== cap allowed, +1 rejected)" }
  - { id: ERR_RESCHEDULE_LIMIT_REACHED, http: 409, condition: "reschedule attempted when reschedule_count >= 3" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 409, condition: "complete attempted with a PENDING checklist item or a required item not DEMONSTRATED" }
  - { id: ERR_ATTENDEE_REQUIREMENT_UNMET, http: 409, condition: "complete attempted without a VERIFIED attendee covering the primary buyer (direct or POA proxy)" }
  - { id: ERR_PHOTO_EVIDENCE_REQUIRED, http: 422, condition: "COSMETIC classification without photo_evidence_ref while community.cosmetic_photo_required is true" }
  - { id: ERR_WITHDRAW_NOT_ALLOWED, http: 409, condition: "withdraw attempted on a WARRANTABLE-classified item (or any item past CLASSIFIED)" }
  - { id: ERR_REP_INACTIVE, http: 409, condition: "appointment/visit creation naming a rep with active == false" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "homebuyer or rep email already registered" }
  - { id: ERR_NO_RELEASABLE_AMOUNT, http: 409, condition: "release attempted on an ACTIVE/PARTIALLY_RELEASED escrow with zero releasable (no unreleased SIGNED_OFF items and no flush)" }
  - { id: ERR_HOLDBACK_FUNDING_MISMATCH, http: 422, condition: "funded_holdback_cents at close does not equal the computed final holdback" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CustomerCareManager
    description: "Builder customer-care manager: owns configuration, registries, confirmation, fiscal decisions, escrow release, closing, ops sweeps, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/communities"
      - "POST /api/homebuyers, POST /api/reps"
      - "POST /api/homes, POST /api/homes/{id}/mark-ready, POST /api/homes/{id}/reschedule-closing, POST /api/homes/{id}/close"
      - "POST /api/appointments/{id}/confirm"
      - "POST /api/deficiency-items/{id}/decide"
      - "POST /api/escrow-holdbacks/{id}/release"
      - "POST /api/feedback-surveys/expire-due"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/appointments/{id}/cancel (shared with CustomerCareRep)"
      - "POST /api/attendees/{id}/decide-verification (shared with non-conducting CustomerCareRep; manager is segregation-exempt)"
  - name: CustomerCareRep
    description: "Customer care representative: schedules and conducts orientations, records attendees, runs the checklist, identifies/classifies deficiencies, manages repairs and re-inspections"
    identity: "entity_backed:CustomerCareRep"
    exclusive_operations:
      - "POST /api/appointments, POST /api/appointments/{id}/reschedule, POST /api/appointments/{id}/start, POST /api/appointments/{id}/complete"
      - "POST /api/appointments/{id}/checklist-items/{system_key}/mark"
      - "POST /api/attendees"
      - "POST /api/deficiency-items, POST /api/deficiency-items/{id}/classify, POST /api/deficiency-items/{id}/start-repair, POST /api/deficiency-items/{id}/complete-repair"
      - "POST /api/reinspection-visits, POST /api/reinspection-visits/{id}/complete"
      - "POST /api/acknowledgment-signatures/{id}/re-request"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/appointments/{id}/cancel"
      - "POST /api/attendees/{id}/decide-verification (only when X-User-ID != appointment.rep_id)"
  - name: Homebuyer
    description: "The primary buyer: withdraws unclassified/cosmetic items, signs off verified repairs, responds to the acknowledgment, submits the feedback survey"
    identity: "entity_backed:Homebuyer"
    exclusive_operations:
      - "POST /api/deficiency-items/{id}/withdraw"
      - "POST /api/deficiency-items/{id}/sign-off"
      - "POST /api/acknowledgment-signatures/{id}/respond"
      - "POST /api/feedback-surveys/{id}/submit"
    shared_operations:
      - "all GET endpoints (reads of own home's records; ownership enforced on writes)"
