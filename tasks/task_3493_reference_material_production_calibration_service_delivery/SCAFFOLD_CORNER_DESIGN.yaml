# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Reference Material Production & Calibration Service Delivery
# Taxonomy sections per claim-extraction-guide; every recipe replays against §1.5.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: program_creation_returns_all_fields
        claim_type: creation
        grounds: [entities.ReferenceMaterialProgram]
        distinguishing_aspect: "POST /metrology/programs with all 10 required fields returns 201 with the stored pricing configuration, a UUID id, version 1, and ISO8601 created_at."
        test_recipe:
          setup: ["empty DB; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C01", name: "Corner Program", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { p_code: $.data.program_code, p_v: $.data.version, p_price: $.data.material_unit_price_cents }
          assert:
            - "p_code == NIST-RM-C01 and p_v == 1 and p_price == 1000"
            - "response carries server-minted id (dashed UUID), created_at, updated_at"

      - name: customer_defaults_good_standing
        claim_type: defaults
        grounds: [entities.Customer.fields.pt_fail_count, entities.Customer.fields.accreditation_standing, entities.Customer.fields.credit_hold, calculations.accreditation_standing]
        distinguishing_aspect: "A newly registered customer starts with pt_fail_count 0, accreditation_standing GOOD_STANDING, credit_hold false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /metrology/customers"
              payload: { name: "Fresh Lab", tier: GENERAL, credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fc: $.data.pt_fail_count, fs: $.data.accreditation_standing, fh: $.data.credit_hold }
          assert:
            - "fc == 0 and fs == GOOD_STANDING and fh == false"

      - name: lot_creation_computed_counters_zero
        claim_type: computed_fields
        grounds: [entities.MaterialLot.fields.units_available, entities.MaterialLot.fields.units_reserved]
        distinguishing_aspect: "A new lot starts SOURCING with qc/reserved/shipped 0, units_available == total_units_produced, and null homogeneity fields."
        test_recipe:
          setup: ["program P exists"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C02", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c2: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c2}", material_code: "SRM-C2", matrix_description: "m", total_units_produced: 15 }
              as: ProgramAdmin
              captures: { l_status: $.data.status, l_avail: $.data.units_available, l_res: $.data.units_reserved, l_qc: $.data.qc_units_consumed, l_ship: $.data.units_shipped, l_fratio: $.data.homogeneity_f_ratio, l_verdict: $.data.homogeneity_verdict }
          assert:
            - "l_status == SOURCING and l_avail == 15 and l_res == 0 and l_qc == 0 and l_ship == 0"
            - "l_fratio == null and l_verdict == null"

      - name: missing_required_total_units_rejected
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field total_units_produced yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["program P exists"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C03", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c3: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c3}", material_code: "SRM-C3", matrix_description: "m" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: invalid_enum_allocation_policy_rejected
        claim_type: type_constraints
        grounds: [entities.MaterialLot.fields.allocation_policy, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "allocation_policy LIFO is not a declared enum member -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["program P exists"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C04", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c4: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c4}", material_code: "SRM-C4", matrix_description: "m", total_units_produced: 5, allocation_policy: "LIFO" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_nonexistent_lot_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown lot id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /metrology/material-lots/11111111-2222-4333-8444-555555555555"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: certificate_expiration_computed_from_validity_days
        claim_type: computed_fields
        grounds: [entities.CertificateOfAnalysis.fields.expiration_date, entities.CertificateOfAnalysis.fields.published_at]
        distinguishing_aspect: "Publishing at the default clock stamps published_at 2026-09-01T00:00:00Z and computes expiration_date exactly 30 days later, 2026-10-01T00:00:00Z."
        test_recipe:
          setup: ["program P; lot L driven to VALUE_ASSIGNMENT with 2 ACCEPTED methods"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C05", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c5: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c5}", material_code: "SRM-C5", matrix_description: "m", total_units_produced: 10 }
              as: ProgramAdmin
              captures: { lot_c5: $.data.id }
            - call: "POST /metrology/material-lots/${lot_c5}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_c5_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c5}", method_code: "M1", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_c5a: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c5}", method_code: "M2", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_c5b: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_c5a}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_c5b}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_c5}", certificate_code: "CERT-C5", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 30, expected_lot_version: "${lot_c5_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_c5: $.data.id }
          trigger:
            - call: "POST /metrology/certificates/${cert_c5}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
              captures: { c5_pub: $.data.published_at, c5_exp: $.data.expiration_date, c5_pubber: $.data.publisher_user_id }
          assert:
            - "c5_pub == 2026-09-01T00:00:00Z (logical clock default, not wall clock)"
            - "c5_exp == 2026-10-01T00:00:00Z"
            - "c5_pubber == co-2"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: lot_initial_state_sourcing
        claim_type: initial_state
        grounds: [state_machines.MaterialLot]
        distinguishing_aspect: "Newly created lot reports status SOURCING before any transition."
        test_recipe:
          setup: ["program P exists"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C06", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c6: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c6}", material_code: "SRM-C6", matrix_description: "m", total_units_produced: 5 }
              as: ProgramAdmin
              captures: { l6_status: $.data.status }
          assert:
            - "l6_status == SOURCING"

      - name: lot_transition_from_wrong_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MaterialLot.CERTIFIED_to_IN_DISTRIBUTION, "errors[ERR_INVALID_LOT_STATE]"]
        distinguishing_aspect: "A SOURCING lot cannot jump to IN_DISTRIBUTION: the transition is not declared from SOURCING -> 409 ERR_INVALID_LOT_STATE."
        test_recipe:
          setup: ["program P; lot L in SOURCING"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C07", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c7: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c7}", material_code: "SRM-C7", matrix_description: "m", total_units_produced: 5 }
              as: ProgramAdmin
              captures: { lot_c7: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots/${lot_c7}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_LOT_STATE"

      - name: lot_depletion_requires_zero_available_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.MaterialLot.IN_DISTRIBUTION_to_DEPLETED]
        distinguishing_aspect: "DEPLETED transition on an IN_DISTRIBUTION lot with units_available > 0 is rejected ERR_INVALID_LOT_STATE — depletion requires exact zero."
        test_recipe:
          setup: ["program P; lot L in IN_DISTRIBUTION, total 10 (qc 4 -> available 6)"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C08", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c8: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c8}", material_code: "SRM-C8", matrix_description: "m", total_units_produced: 10 }
              as: ProgramAdmin
              captures: { lot_c8: $.data.id }
            - call: "POST /metrology/material-lots/${lot_c8}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_c8_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c8}", method_code: "M1", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_c8a: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c8}", method_code: "M2", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_c8b: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_c8a}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_c8b}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_c8}", certificate_code: "CERT-C8", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_c8_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_c8: $.data.id }
            - call: "POST /metrology/certificates/${cert_c8}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_c8}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
          trigger:
            - call: "POST /metrology/material-lots/${lot_c8}/transitions"
              payload: { to: DEPLETED }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_LOT_STATE (units_available 6 > 0)"

      - name: lot_withdraw_blocked_by_allocated_order_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.MaterialLot.ANY_NON_TERMINAL_to_WITHDRAWN, "errors[ERR_OPEN_ORDERS_EXIST]"]
        distinguishing_aspect: "Withdrawal while an ALLOCATED order exists is rejected ERR_OPEN_ORDERS_EXIST; BACKORDERED-only lots withdraw cleanly (see lot_withdraw_cancels_backordered_orders)."
        test_recipe:
          setup: ["program P; customer C; lot L in IN_DISTRIBUTION total 10 (usable 6); order qty 2 ALLOCATED"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C09", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c9: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "C09", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_c9: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c9}", material_code: "SRM-C9", matrix_description: "m", total_units_produced: 10 }
              as: ProgramAdmin
              captures: { lot_c9: $.data.id }
            - call: "POST /metrology/material-lots/${lot_c9}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_c9_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c9}", method_code: "M1", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_c9a: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c9}", method_code: "M2", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_c9b: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_c9a}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_c9b}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_c9}", certificate_code: "CERT-C9", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_c9_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_c9: $.data.id }
            - call: "POST /metrology/certificates/${cert_c9}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_c9}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_c9}", quantity: 2 }
              as: Customer
              as_user_id: "${c_c9}"
          trigger:
            - call: "POST /metrology/material-lots/${lot_c9}/transitions"
              payload: { to: WITHDRAWN }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OPEN_ORDERS_EXIST"

      - name: lot_withdraw_cancels_backordered_orders
        claim_type: side_effect_execution
        grounds: [state_machines.MaterialLot.ANY_NON_TERMINAL_to_WITHDRAWN, state_machines.SalesOrder]
        distinguishing_aspect: "Cascade down: withdrawing a lot with only BACKORDERED orders cancels them and releases their partial reservations (units_reserved back to 0)."
        test_recipe:
          setup: ["program P; customer C; lot L in IN_DISTRIBUTION total 8 (usable 4); order qty 6 -> allocated 4, BACKORDERED"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C10", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c10: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "C10", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_c10: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c10}", material_code: "SRM-C10", matrix_description: "m", total_units_produced: 8 }
              as: ProgramAdmin
              captures: { lot_c10: $.data.id }
            - call: "POST /metrology/material-lots/${lot_c10}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_c10_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c10}", method_code: "M1", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_c10a: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c10}", method_code: "M2", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_c10b: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_c10a}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_c10b}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_c10}", certificate_code: "CERT-C10", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_c10_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_c10: $.data.id }
            - call: "POST /metrology/certificates/${cert_c10}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_c10}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_c10}", quantity: 6 }
              as: Customer
              as_user_id: "${c_c10}"
              captures: { o_c10: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots/${lot_c10}/transitions"
              payload: { to: WITHDRAWN }
              as: InventoryManager
              captures: { l10_status: $.data.status, l10_res: $.data.units_reserved }
            - call: "GET /metrology/sales-orders/${o_c10}"
              as: InventoryManager
              captures: { o10_status: $.data.status, o10_alloc: $.data.allocated_quantity }
          assert:
            - "l10_status == WITHDRAWN and l10_res == 0"
            - "o10_status == CANCELLED and o10_alloc == 0"

      - name: certificate_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CertificateOfAnalysis, "errors[ERR_INVALID_CERTIFICATE_STATE]"]
        distinguishing_aspect: "A WITHDRAWN certificate is terminal: publishing it again returns 409 ERR_INVALID_CERTIFICATE_STATE."
        test_recipe:
          setup: ["program P; lot L in CERTIFIED with certificate CERT-C11 PUBLISHED then WITHDRAWN"]
          setup_api_calls:
            - call: "POST /metrology/programs"
