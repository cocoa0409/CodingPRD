            - { call: "GET /licensure/licenses?application_id=${app}", payload: {}, as: CredentialEvaluator, captures: { lic: "$.data[0].id" } }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P1", category: "CONTENT", hours: 30, earned_on: "2027-01-10T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c1: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c1}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P2", category: "PEDAGOGY", hours: 20, earned_on: "2027-02-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c2: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c2}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-audits", payload: { audit_variant: "STANDARD" }, as: CredentialEvaluator, captures: { au: $.data.id, au_v: $.data.version } }
            - { call: "POST /licensure/ce-audits/${au}/determinations", payload: { expected_ce_audit_version: "${au_v}" }, as: CredentialEvaluator, captures: { tot1: $.data.verified_hours, au_v2: $.data.version } }
          trigger:
