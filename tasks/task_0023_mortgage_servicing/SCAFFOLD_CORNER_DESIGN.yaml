            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /foreclosure-cases/${c23_fc_id}/mediation-sessions"
              payload: { scheduled_for: "2025-11-14T00:00:00Z" }
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOTICE_PERIOD_VIOLATED   # 14-day window is exactly the boundary; 13 days fails"

      - name: validation_payment_zero_amount
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors.ERR_INVALID_AMOUNT
        distinguishing_aspect: "POST /loans/{id}/payments with amount_cents=0 returns ERR_INVALID_AMOUNT."
