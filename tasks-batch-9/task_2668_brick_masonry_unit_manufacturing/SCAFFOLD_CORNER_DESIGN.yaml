              payload: { pallet_count: 20, band_count: 20 }
              as: LogisticsCoordinator
              as_user_id: "logi-001"
              captures: { fin_tons: "$.data.final_billable_tons", fin_total: "$.data.final_freight_cents", variance: "$.data.freight_variance_cents", frs_4: "$.data.freight_status" }
            - call: "POST /orders/${o1}/deliver"
              payload: { unloading_equipment_provided: "TRUCK_MOUNTED_FORKLIFT" }
              as: LogisticsCoordinator
              as_user_id: "logi-001"
              captures: { fs_5: "$.data.fulfillment_status", delivered_at: "$.data.delivered_at" }
            - call: "GET /fired-lots/${l1}"
              payload: {}
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { res_5: "$.data.reserved_units", cons_5: "$.data.consumed_units", avail_5: "$.data.available_units", lot_status_5: "$.data.status" }
          assert:
            - "${alloc_after_add} == 9600 in the add response itself, and the QualityManager's very next read shows ${res_1} == 9600, ${avail_1} == 0, ${cons_1} == 0 and ${lot_status_1} == RESERVED"
            - "${wci} == 52.18 and ${span} == 0.00 are in the compose response, and the ArchitectReviewer's next read of the order shows ${fs_2} == IN_BLENDING"
            - "${b_status_3} == CERTIFIED with ${certified_at} == 2026-08-01T00:00:00Z, the logical clock instant of that very request"
            - "${comp_status_3} == ALLOCATED, ${comp_units_3} == 9600 and ${comp_snapshot_3} == 52.18 - the allocation snapshot is readable by a fourth role with no recompute"
            - "${fin_tons} == 22.23 (20*60 + 20*3.0 + 9600*4.5 = 44460 lb), ${fin_total} == 58541 and ${variance} == 1660 against the ${est_total} of 56881, all three in the package response"
            - "${frs_4} == FINALIZED and ${fs_5} == DELIVERED with ${delivered_at} == 2026-08-01T00:00:00Z"
            - "${res_5} == 0, ${cons_5} == 9600, ${avail_5} == 0 and ${lot_status_5} == CONSUMED - the reservation converted to consumption inside the deliver request, and 9600 = 0 + 9600 + 0 still reconciles"
            - "Five different roles observed five different writes, each on its first read; nothing in this recipe re-reads a row hoping a derived field has caught up"
