              as: InstructionalSpecialist
            - call: "POST /materials/${mat_id}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-10", ends_on: "2026-08-20", teacher_count: 2 }
              as: CurriculumDirector
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-20", ends_on: "2026-08-31", teacher_count: 2 }
              as: CurriculumDirector
              captures: { p2: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-25", ends_on: "2026-09-05", teacher_count: 2 }
              as: CurriculumDirector
              captures: { err_p3: $.data.error_id }
            - call: "POST /pilots/${p2}/transitions"
              payload: { to_state: CANCELLED }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-25", ends_on: "2026-09-05", teacher_count: 2 }
              as: CurriculumDirector
              captures: { p3: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-B", starts_on: "2026-08-25", ends_on: "2026-09-05", teacher_count: 2 }
              as: CurriculumDirector
              captures: { p4: $.data.id }
          assert:
            - "P2 accepted (201): half-open adjacency at 2026-08-20 is not an overlap"
            - "P3 first attempt rejected: error_id == ERR_PILOT_WINDOW_CONFLICT ([2026-08-25, 2026-09-05) overlaps P2's [2026-08-20, 2026-08-31))"
            - "after P2 is CANCELLED the identical P3 request succeeds (cancelled pilots release their window)"
            - "P4 at a different school with the same window succeeds (the resource is school_code + subject_area)"

      - name: public_review_window_gap_rule
        grounds:
          - validations[priority=8]
          - state_machines.AdoptionCycle.SCORING_to_PUBLIC_REVIEW
          - entities.AdoptionCycle.fields.public_review_opens_at
        distinguishing_aspect: |
          Closed-interval-with-mandatory-gap semantics on the subject-area review resource: a new
          public review window must leave a clear 30-day gap after any other same-subject cycle's
          window — opening 15 days after the prior window closed is rejected, and only a gap of
          more than 30 days passes. Adjacency (touching) is FORBIDDEN here, unlike the pilot
          half-open rule.
