            - "${err_ks} != ERR_OUTSIDE_RESTRICTED_HOURS even though the local minute 1380 is outside [600, 1200)"
            - "the control call returns 422 and ${err_ny} == ERR_OUTSIDE_RESTRICTED_HOURS, so the priority-60 rule is live"
            - "Order.${order_ks}.fulfillment_state == CREATED and Order.${order_ks}.compliance_state == DRAFT_UNVERIFIED"
            - "Order.${order_ny}.fulfillment_state == CREATED"

