          - errors.ERR_DATASET_NOT_FOUND
        distinguishing_aspect: "Both ends of the link must exist: the request resolves but the body dataset_id does not, so the link is refused at 404 and the request keeps status ACCEPTED with linked_dataset_id null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
