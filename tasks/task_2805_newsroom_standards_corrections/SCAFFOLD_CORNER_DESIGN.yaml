              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Never published at all" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
          trigger:
            - call: "POST /standards-desk/stories/${st}/unpublish"
              payload: { removal_reason: "Removing something that was never live.", editors_note_text: "This story has been removed." }
