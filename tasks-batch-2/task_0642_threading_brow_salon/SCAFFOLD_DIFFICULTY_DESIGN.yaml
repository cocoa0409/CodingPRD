scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: visit_estimate_vs_final_settlement_diverge
    grounds:
    - calculations.visit_estimate_total
    - calculations.finalize_settlement
    - entities.ServiceVisit.fields.estimate_total_cents
    - entities.ServiceVisit.fields.final_total_cents
    - state_machines.ServiceVisit.IN_SERVICE_to_COMPLETED
    distinguishing_aspect: 'Same visit lines: provisional estimate_total_cents uses list prices (6500),

      final_total_cents applies the SILVER package credit + 10% discount and equals 4350

      — a 2150-cent divergence on the ServiceVisit cost domain.

      '
    test_recipe:
      setup:
      - OPEN salon (loyalty_earn_rate_bps=500); one OPEN chair; one AVAILABLE technician certified for TINT.
      - ServiceMenuItem BROW_THREAD base_price_cents=2000, package_eligible=true; AddOn TINT price_cents=1500; RetailProduct SERUM unit_price 3000 stock 10.
      - Member with an ACTIVE SILVER package (credits_remaining=8); member CALLED off the queue and seated into an IN_SERVICE visit with a TINT add-on line and a SERUM retail line.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T09:00:00Z'
        as: SalonManager
      - call: POST /salon-svc/salons
        payload:
          name: Brow Bar
          license_number: LIC-1
          license_expiry: '2027-01-01T00:00:00Z'
          loyalty_earn_rate_bps: 500
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          sv1: $.data.version
      - call: POST /salon-svc/chairs
        payload:
          salon_id: ${salon_id}
          label: Bar 1
          sanitation_minutes: 5
        as: SalonManager
        captures:
          chair_id: $.data.id
      - call: POST /salon-svc/technicians
        payload:
          salon_id: ${salon_id}
          display_name: Tara
          sanitation_cert_expiry: '2027-01-01T00:00:00Z'
          certified_addon_codes:
          - TINT
        as: SalonManager
        captures:
          tech_id: $.data.id
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Eyebrow Threading
          base_price_cents: 2000
          est_minutes: 15
          package_eligible: true
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/add-ons
        payload:
          salon_id: ${salon_id}
          code: TINT
          name: Brow Tint
          price_cents: 1500
          requires_certification: true
        as: SalonManager
        captures:
          tint_id: $.data.id
      - call: POST /salon-svc/retail-products
        payload:
          salon_id: ${salon_id}
          sku: SERUM
          name: Brow Serum
          unit_price_cents: 3000
          initial_stock_qty: 10
        as: SalonManager
        captures:
          serum_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: Mia
          phone: 555-0001
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      - call: POST /salon-svc/packages
        payload:
          member_id: ${member_id}
          tier: SILVER
        as: FrontDeskAgent
        captures:
          pkg_id: $.data.id
      - call: POST /salon-svc/packages/${pkg_id}/activate
        payload: {}
        as: Member
        as_user_id: ${member_id}
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          ticket_id: $.data.id
      - call: POST /salon-svc/queue-tickets/${ticket_id}/call
        payload: {}
        as: FrontDeskAgent
      - call: POST /salon-svc/service-visits
        payload:
          salon_id: ${salon_id}
          queue_ticket_id: ${ticket_id}
          chair_id: ${chair_id}
          technician_id: ${tech_id}
          membership_package_id: ${pkg_id}
          expected_salon_version: ${sv1}
        as: FrontDeskAgent
        captures:
          visit_id: $.data.id
          est_at_seat: $.data.estimate_total_cents
      - call: POST /salon-svc/service-visits/${visit_id}/line-items
        payload:
          line_type: ADDON
          item_ref_id: ${tint_id}
          quantity: 1
        as: FrontDeskAgent
      - call: POST /salon-svc/service-visits/${visit_id}/line-items
        payload:
          line_type: RETAIL
          item_ref_id: ${serum_id}
          quantity: 1
        as: FrontDeskAgent
      trigger:
      - call: POST /salon-svc/service-visits/${visit_id}/complete
        payload: {}
        as: Technician
        as_user_id: ${tech_id}
        captures:
          final_total: $.data.final_total_cents
          est_after: $.data.estimate_total_cents
      assert:
      - ServiceVisit.${visit_id}.estimate_total_cents == 6500
      - ServiceVisit.${visit_id}.final_total_cents == 4350
      - ServiceVisit.${visit_id}.final_total_cents != ServiceVisit.${visit_id}.estimate_total_cents
      - ServiceVisit.${visit_id}.used_package_credit == true
  - name: no_show_strike_score_distinct_from_cost_domain
    grounds:
    - calculations.no_show_strike_score
    - calculations.finalize_settlement
    - entities.Member.fields.no_show_strikes
    - entities.Member.fields.status
    - state_machines.QueueTicket.CALLED_to_NO_SHOW
    distinguishing_aspect: 'The second dual-variant calculation operates on the Member risk domain (strike count -> status

      escalation), a different entity than the ServiceVisit cost accounting, so the scaffold shows

      dual-variant logic on two distinct subjects.

      '
    test_recipe:
      setup:
      - OPEN salon, ACTIVE member with one prior un-expired no-show strike (status still ACTIVE).
      - Member rejoins, is called, and no-shows a second time.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T09:00:00Z'
        as: SalonManager
      - call: POST /salon-svc/salons
        payload:
          name: Brow Bar
          license_number: LIC-2
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Eyebrow Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: Nia
          phone: 555-0002
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          t1: $.data.id
      - call: POST /salon-svc/queue-tickets/${t1}/call
        payload: {}
        as: FrontDeskAgent
      - call: POST /salon-svc/queue-tickets/${t1}/no-show
        payload: {}
        as: FrontDeskAgent
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          t2: $.data.id
      - call: POST /salon-svc/queue-tickets/${t2}/call
        payload: {}
        as: FrontDeskAgent
      trigger:
      - call: POST /salon-svc/queue-tickets/${t2}/no-show
        payload: {}
        as: FrontDeskAgent
      assert:
      - Member.${member_id}.no_show_strikes == 2
      - Member.${member_id}.status == SUSPENDED
- rule_id: combinatorial_formula
  instances:
  - name: settlement_credit_then_discount_nonlinear_branch
    grounds:
    - calculations.finalize_settlement
    - entities.MembershipPackage.fields.discount_bps
    - entities.MembershipPackage.fields.credits_remaining
    - entities.ServiceMenuItem.fields.package_eligible
    distinguishing_aspect: 'Mode (a) — >=3 inputs (service_part, addon_part, retail_part, discount_bps, credit-eligibility)

      with non-linear interaction: drawing the package credit zeroes the service line BEFORE the discount

      base is computed, so credit and discount do not commute (final 4350 not the no-credit 5975).

      '
    test_recipe:
      setup:
      - Same OPEN-salon bootstrap as visit_estimate_vs_final_settlement_diverge, GOLD vs SILVER compared by reusing the divergence instance's seated visit.
      - Member with ACTIVE SILVER package, seated visit with TINT add-on + SERUM retail lines on a package_eligible service.
