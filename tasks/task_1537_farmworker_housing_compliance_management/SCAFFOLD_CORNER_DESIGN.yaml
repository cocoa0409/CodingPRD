            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
