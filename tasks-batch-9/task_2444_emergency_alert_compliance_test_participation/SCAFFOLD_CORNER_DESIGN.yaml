            - "after the first passing check: status == 'READY', readiness_check_passed == true, last_readiness_check_at == '2026-08-02T06:00:00Z'"
            - "after the re-run from READY: status is STILL 'READY' and last_readiness_check_at == '2026-08-03T06:00:00Z' — the self-transition only refreshes the timestamp"
            - "readiness_check_passed is still true and the device never left the readiness numerator"

