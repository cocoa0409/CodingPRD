      - name: exclusion_approval_restores_the_port_only_when_the_fault_was_still_unresolved
        claim_type: conditional_cascade
        grounds:
          - state_machines.OutageEvent.transitions.EXCLUSION_REVIEW_to_EXCLUDED
          - endpoints[POST /outage-events/{outage_event_id}/exclusion-actions]
          - entities.OutageEvent.fields.pre_exclusion_state
        distinguishing_aspect: "The APPROVE side effect that returns a port to IN_SERVICE fires only when pre_exclusion_state is CLASSIFIED (the fault was never repaired). Here the MAJOR outage is excluded straight from CLASSIFIED, so the port and station recover with no dispatch ever taking place — and the same call must NOT touch a port whose outage had already been RESOLVED, which is why pre_exclusion_state is recorded at REQUEST time rather than inferred at APPROVE time."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
