# =============================================================================
# §1.8 Scaffold Difficulty Design — Film & TV Tax Incentive Application
# Test Targeting Index: 2+ instances per Difficulty Rule (§0.5), every
# instance grounded in SCAFFOLD.yaml §1.1–§1.7 and replayable from empty-DB.
# Standard program config literal (GA FY2027) unless an instance overrides it:
#   window [2026-08-01T00:00:00Z, 2027-07-01T00:00:00Z], annual_cap 100000000,
#   minimum 10000000, rates 0.25/0.30, elevated threshold 200000000,
#   atl_cap 0.40, uplift 0.025, price floor 0.90, verification 365d,
#   appeal 30d, interest 0.0005/day, credit validity 1095d, proposal 14d.
# Default logical clock is 2026-08-01T00:00:00Z (inside the GA window).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_credit_divergence
        grounds:
          - calculations.credit_amount
          - calculations.atl_btl_cap_application
          - state_machines.AuditPackage.DRAFT_SUBMITTED_to_ATTESTED
          - "endpoints[GET /api/applications/{applicationId}/credit-estimate]"
        distinguishing_aspect: |
          Same application, same spend ledger, same instant: the PROVISIONAL
          variant (system-qualified sums, entity domain IncentiveApplication)
          computes 60750000 at rate 0.30 while the FINAL variant (CPA-attested
          sums 38000000/150000000) computes 47000000 at rate 0.25 — the two
          variants diverge in BOTH amount and rate tier for identical ledger
          data.
        test_recipe:
          setup:
            - "GA program OPEN; application APPROVED (estimated 250000000)"
            - "Vendor VERIFIED; entries qualified: ATL 40000000; BTL resident-labor 100000000 (effective 102500000); BTL 60000000"
            - "System sums: atl 40000000, btl 162500000, capped 202500000, provisional 60750000 @ 0.30"
            - "Audit package ATTESTED with attested_atl 38000000, attested_btl 150000000 (FINAL: capped 188000000 < 200000000 tier, 47000000 @ 0.25); NOT yet accepted"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/vendors", payload: { production_id: "${prod_id}", legal_name: "Savannah Grip & Electric", tax_id: "47-2201988", residency_jurisdiction: "GA" }, as: Producer, as_user_id: "${co_id}", captures: { vend_id: $.data.id } }
            - { call: "POST /api/vendors/${vend_id}/review-residency", payload: { decision: "VERIFIED" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-ATL-001", category: "ATL", spend_date: "2026-10-05T00:00:00Z", amount_cents: 40000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_atl: $.data.id } }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-BTL-002", category: "BTL", is_resident_labor: true, spend_date: "2026-10-12T00:00:00Z", amount_cents: 100000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_btl1: $.data.id } }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-BTL-003", category: "BTL", spend_date: "2026-10-19T00:00:00Z", amount_cents: 60000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_btl2: $.data.id } }
            - { call: "POST /api/spend-entries/${e_atl}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries/${e_btl1}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries/${e_btl2}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_id}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_id: $.data.id } }
            - { call: "POST /api/audit-packages/${pkg_id}/submit-draft", payload: { documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/attest", payload: { attested_atl_cents: 38000000, attested_btl_cents: 150000000, documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
          trigger:
            - { call: "GET /api/applications/${app_id}/credit-estimate", payload: { variant: "PROVISIONAL" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1", captures: { prov_credit: $.data.credit_cents, prov_rate: $.data.applied_rate } }
            - { call: "GET /api/applications/${app_id}/credit-estimate", payload: { variant: "FINAL" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1", captures: { fin_credit: $.data.credit_cents, fin_rate: $.data.applied_rate } }
          assert:
            - "provisional estimate: credit_cents == 60750000, applied_rate == 0.30, capped_total_qualified_cents == 202500000, meets_minimum == true"
            - "final estimate: credit_cents == 47000000, applied_rate == 0.25, capped_total_qualified_cents == 188000000, meets_minimum == true"
            - "provisional credit_cents != final credit_cents AND applied_rate differs (0.30 vs 0.25) on identical spend ledger"

      - name: cashflow_optimistic_vs_conservative_schedule
        grounds:
          - calculations.cashflow_projection
          - entities.Production.fields.scheduled_wrap_date
          - "endpoints[GET /api/applications/{applicationId}/cashflow-projection]"
        distinguishing_aspect: |
          Same issued certificate (60750000) and same wrap date 2026-12-15:
          OPTIMISTIC projects net 60750000 at milestones 2026-12-15 /
          2027-03-15 / 2027-06-13, while CONSERVATIVE discounts to the transfer
          floor (net 54675000) and shifts every milestone +30 days
          (2027-01-14 / 2027-04-14 / 2027-07-13) — a dual-variant projection
          in the cash-flow schedule domain, distinct from the credit-amount
          domain of provisional_vs_final_credit_divergence.
        test_recipe:
          setup:
            - "GA program OPEN; application APPROVED; vendor VERIFIED; entries qualified (ATL 40000000; BTL resident 100000000; BTL 60000000)"
            - "Audit ATTESTED with attested == system sums (40000000 / 162500000) and ACCEPTED; certificate issued: 60750000"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/vendors", payload: { production_id: "${prod_id}", legal_name: "Savannah Grip & Electric", tax_id: "47-2201988", residency_jurisdiction: "GA" }, as: Producer, as_user_id: "${co_id}", captures: { vend_id: $.data.id } }
            - { call: "POST /api/vendors/${vend_id}/review-residency", payload: { decision: "VERIFIED" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-ATL-001", category: "ATL", spend_date: "2026-10-05T00:00:00Z", amount_cents: 40000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_atl: $.data.id } }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-BTL-002", category: "BTL", is_resident_labor: true, spend_date: "2026-10-12T00:00:00Z", amount_cents: 100000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_btl1: $.data.id } }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-BTL-003", category: "BTL", spend_date: "2026-10-19T00:00:00Z", amount_cents: 60000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_btl2: $.data.id } }
            - { call: "POST /api/spend-entries/${e_atl}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries/${e_btl1}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries/${e_btl2}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_id}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_id: $.data.id } }
            - { call: "POST /api/audit-packages/${pkg_id}/submit-draft", payload: { documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/attest", payload: { attested_atl_cents: 40000000, attested_btl_cents: 162500000, documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/decision", payload: { outcome: "ACCEPT" }, as: FilmOfficeReviewer, as_user_id: "reviewer-3" }
            - { call: "POST /api/applications/${app_id}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { cert_id: $.data.id } }
          trigger:
            - { call: "GET /api/applications/${app_id}/cashflow-projection", payload: { variant: "OPTIMISTIC" }, as: Producer, as_user_id: "${co_id}", captures: { opt_net: $.data.expected_net_proceeds_cents } }
            - { call: "GET /api/applications/${app_id}/cashflow-projection", payload: { variant: "CONSERVATIVE" }, as: Producer, as_user_id: "${co_id}", captures: { cons_net: $.data.expected_net_proceeds_cents } }
          assert:
            - "OPTIMISTIC: basis_credit_cents == 60750000, expected_net_proceeds_cents == 60750000"
            - "OPTIMISTIC milestones: [{PRODUCTION_WRAP, 2026-12-15, 24300000}, {AUDIT_COMPLETE, 2027-03-15, 18225000}, {CREDIT_ISSUANCE, 2027-06-13, 18225000}]"
            - "CONSERVATIVE: expected_net_proceeds_cents == 54675000 (round_half_up(60750000 * 0.90))"
            - "CONSERVATIVE milestones: [{PRODUCTION_WRAP, 2027-01-14, 21870000}, {AUDIT_COMPLETE, 2027-04-14, 16402500}, {CREDIT_ISSUANCE, 2027-07-13, 16402500}] — every date exactly 30 days later than OPTIMISTIC"
            - "opt_net != cons_net (54675000 < 60750000) on identical inputs"

      - name: clawback_simple_vs_aggravated_penalty
        grounds:
          - calculations.clawback_assessment
          - state_machines.ClawbackCase.NOTICE_SENT_to_SUSTAINED
          - entities.ClawbackCase.fields.penalty_mode
        distinguishing_aspect: |
          Two clawback cases with identical base (2000000), identical notice
          and resolution dates (40 interest days, interest 40000, under the
          50% cap): SIMPLE assesses 2040000 while AGGRAVATED assesses
          round_half_up(2000000 * 1.25) + 40000 = 2540000 — a dual-variant
          assessment in the ClawbackCase domain, distinct from both the
          credit-amount and cash-flow variants above.
        test_recipe:
          setup:
            - "GA program OPEN; two productions of the same company, each with an APPROVED application, clean audit (attested BTL 20000000 -> final credit 5000000 @ 0.25), certificate issued 5000000"
            - "Each certificate redeemed 4000000 -> remaining 1000000"
            - "Case A (SIMPLE) and case B (AGGRAVATED), each shortfall 2000000, notice sent at 2026-08-01 (appeal deadline 2026-08-31), clock then set to 2026-09-10 (40 days after notice) so SUSTAINED from NOTICE_SENT is allowed without appeal"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 100000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_a: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Okefenokee Nights", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 100000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_b: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_a}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 20000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_a: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_b}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 20000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_b: $.data.id } }
            - { call: "POST /api/applications/${app_a}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_b}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_a}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_b}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_a}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/applications/${app_b}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_a}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_a: $.data.id } }
            - { call: "POST /api/audit-packages/${pkg_a}/submit-draft", payload: { documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_a}/attest", payload: { attested_atl_cents: 0, attested_btl_cents: 20000000, documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_a}/decision", payload: { outcome: "ACCEPT" }, as: FilmOfficeReviewer, as_user_id: "reviewer-3" }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_b}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_b: $.data.id } }
            - { call: "POST /api/audit-packages/${pkg_b}/submit-draft", payload: { documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_b}/attest", payload: { attested_atl_cents: 0, attested_btl_cents: 20000000, documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_b}/decision", payload: { outcome: "ACCEPT" }, as: FilmOfficeReviewer, as_user_id: "reviewer-3" }
            - { call: "POST /api/applications/${app_a}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { cert_a: $.data.id } }
            - { call: "POST /api/applications/${app_b}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { cert_b: $.data.id } }
            - { call: "POST /api/certificates/${cert_a}/redeem", payload: { redeem_amount_cents: 4000000 }, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/certificates/${cert_b}/redeem", payload: { redeem_amount_cents: 4000000 }, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/clawback-cases", payload: { application_id: "${app_a}", trigger_reason: "SPEND_SHORTFALL", penalty_mode: "SIMPLE", shortfall_amount_cents: 2000000 }, as: FilmOfficeAdmin, captures: { case_a: $.data.id } }
            - { call: "POST /api/clawback-cases", payload: { application_id: "${app_b}", trigger_reason: "MISREPRESENTATION", penalty_mode: "AGGRAVATED", shortfall_amount_cents: 2000000 }, as: FilmOfficeAdmin, captures: { case_b: $.data.id } }
            - { call: "POST /api/clawback-cases/${case_a}/send-notice", payload: {}, as: FilmOfficeAdmin }
            - { call: "POST /api/clawback-cases/${case_b}/send-notice", payload: {}, as: FilmOfficeAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: FilmOfficeAdmin }
          trigger:
            - { call: "POST /api/clawback-cases/${case_a}/resolve", payload: { outcome: "SUSTAINED" }, as: FilmOfficeAdmin, captures: { tot_a: $.data.assessed_total_cents, int_a: $.data.interest_cents, cash_a: $.data.cash_assessment_cents } }
            - { call: "POST /api/clawback-cases/${case_b}/resolve", payload: { outcome: "SUSTAINED" }, as: FilmOfficeAdmin, captures: { tot_b: $.data.assessed_total_cents, int_b: $.data.interest_cents, cash_b: $.data.cash_assessment_cents } }
          assert:
            - "case A (SIMPLE): interest_cents == 40000, assessed_total_cents == 2040000, recovered_from_certificate_cents == 1000000, cash_assessment_cents == 1040000"
            - "case B (AGGRAVATED): interest_cents == 40000, assessed_total_cents == 2540000, recovered_from_certificate_cents == 1000000, cash_assessment_cents == 1540000"
            - "tot_b - tot_a == 500000 with identical base, identical days, identical interest — only penalty_mode differs"
            - "both certificates CLAWED_BACK; both applications REVOKED"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_credit_rate_threshold_straddle
        grounds:
          - calculations.credit_amount
          - entities.JurisdictionProgram.fields.elevated_tier_threshold_cents
        distinguishing_aspect: |
          Mode (a) — multi-input non-linear formula (category split -> ATL cap
          -> minimum gate -> tier boundary): two applications whose capped
          totals sit at 199999999 (threshold-1) and 200000000 (threshold,
          INCLUSIVE >=) receive applied_rate 0.25 vs 0.30 and credits
          50000000 vs 60000000 — a one-cent input difference flips the tier.
        test_recipe:
          setup:
            - "GA program OPEN; two productions, two APPROVED applications (estimated 250000000 each)"
            - "Vendor VERIFIED on each production; app1: one BTL non-resident entry 199999999 qualified; app2: one BTL non-resident entry 200000000 qualified"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
