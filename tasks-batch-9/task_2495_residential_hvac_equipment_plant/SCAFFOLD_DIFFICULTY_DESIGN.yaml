            - "HTTP 200; DistributorOrder.${ord_id}.fulfillment_status == CANCELLED, cancelled_at == \"2026-08-01T00:00:00Z\", allocation_status == UNALLOCATED, allocated_units == 0"
            - "GET /plant/distributor-orders/${ord_id}/allocation-lines returns 2 records, both status == RELEASED with closed_reason == ORDER_CANCELLED"
            - "ComponentSupply.${cmp_id}.status == ACTIVE (walked back from EXHAUSTED), reserved_units == 0, committed_units == 0, available_units == 100, effective_allocatable_units == 100"
            - "ComponentSupply.${ctl_id}.status == ACTIVE, reserved_units == 0, committed_units == 0, available_units == 100, effective_allocatable_units == 100"
            - "Conservation holds on both rows: 100 == 100 + 0 + 0"
            - "GET /plant/distributor-orders/${ord_id}/allocation-preview?policy=PRIORITY_WATERFALL reports kit_capacity == 100 again - the pool is exactly as it was before the allocation"

      - name: reservation_release_restores_warehouse_pallet_identity
        grounds:
          - state_machines.WarehouseReservation.ACTIVE_to_RELEASED
          - calculations.warehouse_pallet_occupancy
          - entities.Warehouse.fields.pallets_reserved_current
          - entities.WarehouseReservation.fields.release_reason
        distinguishing_aspect: |
          Releasing a reservation while the logical clock sits inside its interval must recompute
          pallets_reserved_current from the surviving ACTIVE reservations rather than subtract a
          remembered delta, restoring the identity pallets_reserved_current == sum of ACTIVE pallet
          units covering the clock date. The proof that no capacity leaked is that a 50-pallet
          reservation - the building's entire capacity - is then accepted on the same window.
        test_recipe:
          setup:
            - "Warehouse WH-1 with pallet_capacity 50."
            - "A RELEASED STANDARD-tier A1 platform with a pre-season lot at DRAFT."
            - "One ACTIVE reservation of 40 pallets from 2026-11-02 to 2026-11-12."
            - "Logical clock advanced to 2026-11-05T00:00:00Z, inside that interval, so pallets_reserved_current is 40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/warehouses"
              payload: { name: "WH-1", pallet_capacity: 50 }
              as: PlantAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 80, scheduled_start_utc: "2026-11-02T06:00:00Z", is_preseason: true }
              as: ProductionPlanner
              captures: { bo_id: $.data.id }
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo_id}", start_date: "2026-11-02", end_date: "2026-11-12", pallet_units: 40 }
              as: ProductionPlanner
              captures: { res1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant/warehouse-reservations/${res1_id}/release"
              payload: { release_reason: "Pre-season plan rebalanced" }
              as: ProductionPlanner
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo_id}", start_date: "2026-11-02", end_date: "2026-11-12", pallet_units: 50 }
              as: ProductionPlanner
              captures: { res2_id: $.data.id }
          assert:
            - "First trigger call: HTTP 200; WarehouseReservation.${res1_id}.status == RELEASED, released_at == \"2026-11-05T00:00:00Z\", release_reason == \"Pre-season plan rebalanced\""
            - "Warehouse.${wh_id}.pallets_reserved_current == 0 immediately after the release, and GET /plant/warehouses/${wh_id}/occupancy?on_date=2026-11-05 returns occupancy_units == 0"
            - "BuildOrder.${bo_id}.status == DRAFT - releasing storage does not touch the lot"
            - "Second trigger call: HTTP 201 for the full 50-pallet capacity on the identical window, proving no capacity leaked"
            - "Warehouse.${wh_id}.pallets_reserved_current == 50 and GET /plant/warehouses/${wh_id}/occupancy?on_date=2026-11-05 returns occupancy_units == 50, exactly the pallet_capacity"
            - "GET /plant/warehouses/${wh_id}/reservations?status=ACTIVE returns exactly 1 record, ${res2_id}"
