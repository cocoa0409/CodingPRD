          - calculations.device_entitlement_evaluation
          - calculations.device_overage_charge_cents
          - entities.Device.fields.is_overage
          - entities.Household.fields.entitled_device_count
        distinguishing_aspect: |
          Metric: an integer count boundary on POST /devices/claim. With
          included_device_count 2, the claim that makes entitled_device_count exactly
          2 is free (is_overage false, 0 cents booked) because the rule is
          `after <= included`; only the 3rd claim converts to overage.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PLUS plan with included_device_count 2 and overage_fee_cents_per_device 399; a subscription with allow_overage true so a cap breach would convert rather than reject."
            - "One SENSOR device already claimed, so entitled_device_count == 1."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 4999, included_device_count: 2, overage_fee_cents_per_device: 399, coverage_mode: "BUSINESS_HOURS", first_response_minutes_p1: 120, first_response_minutes_p2: 240, first_response_minutes_p3: 720, onsite_resolution_hours_p1: 48, onsite_resolution_hours_p2: 72, onsite_resolution_hours_p3: 168, warranty_extension_months: 6, included_install_credits: 1, advance_replacement_eligible: false }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "Edge House", region_code: "NWA", billing_email: "edge@example.com" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Ed G", email: "ed@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plus_plan_id}", allow_overage: true }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "SNS-B1", display_name: "Sensor B1", device_class: "SENSOR", serial_prefix: "SNB", base_warranty_months: 12, requires_install: false, manufacturer_service_only: false, msrp_cents: 4900, current_firmware_version: "1.2.0" }
              as: PlatformAdmin
              captures: { cat_sen_id: $.data.id }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_sen_id}", serial_number: "SNB000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_sen_id}", serial_number: "SNB000002", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Device.${d2_id}.is_overage == false"
            - "Household.${h_id}.entitled_device_count == 2"
            - "Subscription.${sub_id}.overage_device_count == 0"
            - "Subscription.${sub_id}.overage_charges_cents_this_cycle == 0"
            - "Subscription.${sub_id}.next_invoice_adjustment_cents == 0"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ring_launch_depends_on_rma_case_state_of_the_listed_device
        grounds:
          - validations[priority=34]
          - errors[ERR_RMA_IN_FLIGHT]
          - state_machines.RmaCase.lifecycle.OPEN_to_ROUTED
          - state_machines.FirmwareCampaign.lifecycle.DRAFT_to_RING_ACTIVE
          - calculations.rma_routing_target
        distinguishing_aspect: |
          Entity pair (FirmwareCampaign, RmaCase): whether a campaign may launch a ring
          over a device is decided by the state of a DIFFERENT entity — an RmaCase on
          that device sitting in ROUTED — and the whole launch is refused with
          ERR_RMA_IN_FLIGHT even though the campaign and the device are both perfectly
          launchable on their own axes.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PRO plan with advance_replacement_eligible true and included_device_count 1."
            - "A household in NWA with an OWNER and an ACTIVE subscription."
            - "One HUB device (msrp 24900, base warranty 24 months, purchased 2026-04-01, so with the 12-month tier extension it is IN_WARRANTY until 2029-04-01) claimed and activated, hence ACTIVE with firmware CURRENT."
            - "An RmaCase opened on that device, routed to ADVANCE_REPLACEMENT with hold_amount_cents 14940 and status ROUTED."
            - "A DRAFT SECURITY_MANDATORY campaign on the same catalog model."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 1, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "Rma House", region_code: "NWA", billing_email: "rma@example.com" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Rae M", email: "rae@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${pro_plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_hub_id: $.data.id }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_hub_id}", serial_number: "HBX000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d1_id: $.data.id, tok1: $.data.activation_token }
            - call: "POST /smart-home-support/devices/${d1_id}/activate"
              payload: { activation_code: "${tok1}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d1_v: $.data.version }
            - call: "POST /smart-home-support/rma-cases"
              payload: { device_id: "${d1_id}", expected_device_version: "${d1_v}" }
              as: SupportAgent
              as_user_id: "agent-1"
              captures: { rma_id: $.data.id }
            - call: "POST /smart-home-support/firmware-campaigns"
              payload: { catalog_entry_id: "${cat_hub_id}", kind: "SECURITY_MANDATORY", target_firmware_version: "1.1.0", halt_failure_rate_pct: 0.5 }
              as: PlatformAdmin
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /smart-home-support/firmware-campaigns/${camp_id}/launch-ring"
              payload: { ring_index: 1, device_ids: ["${d1_id}"], window_start_at: "2026-05-01T00:00:00Z", window_end_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_RMA_IN_FLIGHT"
            - "RmaCase.${rma_id}.warranty_state == IN_WARRANTY"
            - "RmaCase.${rma_id}.routing_target == ADVANCE_REPLACEMENT"
            - "RmaCase.${rma_id}.hold_amount_cents == 14940 and RmaCase.${rma_id}.hold_state == HELD"
            - "FirmwareCampaign.${camp_id}.status == DRAFT"
            - "GET /smart-home-support/firmware-rollouts?device_id=${d1_id} returns 0 rows"
            - "Device.${d1_id}.firmware_status == CURRENT"

      - name: visit_booking_rejected_when_ticket_dispatch_axis_never_escalated
        grounds:
          - validations[priority=40]
          - errors[ERR_DISPATCH_NOT_REQUIRED]
          - entities.Ticket.fields.dispatch_status
          - state_machines.VisitSlot.capacity.OPEN_to_BOOKED
        distinguishing_aspect: |
          Entity pair (Visit, Ticket): whether a VisitSlot may be occupied is decided by
          a state on the Ticket entity — dispatch_status must already be REQUIRED,
          RESCHEDULING or NO_SHOW — so a perfectly OPEN slot in the right region is
          still refused with ERR_DISPATCH_NOT_REQUIRED for a merely TRIAGED ticket.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PRO plan; a household in NWA with an OWNER and an ACTIVE subscription."
            - "A technician in NWA with one OPEN slot 2026-05-05T09:00:00Z -> 11:00:00Z."
            - "One P3 ticket that has only been first-responded, so workflow_status == TRIAGED and dispatch_status == NOT_REQUIRED."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "Dispatch House", region_code: "NWA", billing_email: "disp@example.com" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Dee P", email: "dee@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${pro_plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/technicians"
              payload: { full_name: "Dan Tech", region_code: "NWA", skills: ["HUB"] }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /smart-home-support/technicians/${tech_id}/visit-slots"
              payload: { start_at: "2026-05-05T09:00:00Z", end_at: "2026-05-05T11:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /smart-home-support/tickets"
              payload: { household_id: "${h_id}", severity: "P3", summary: "Thermostat schedule odd", opened_by_member_id: "${own_id}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { t_id: $.data.id }
            - call: "POST /smart-home-support/tickets/${t_id}/first-response"
              payload: { note: "Triaged." }
              as: SupportAgent
              as_user_id: "agent-1"
          trigger:
            - call: "POST /smart-home-support/visits"
              payload: { ticket_id: "${t_id}", slot_id: "${slot_id}" }
              as: SupportAgent
              as_user_id: "agent-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DISPATCH_NOT_REQUIRED"
            - "response data.error_id != ERR_INVALID_STATE"
            - "VisitSlot.${slot_id}.status == OPEN"
            - "Technician.${tech_id}.open_slot_count == 1 and booked_slot_count == 0"
            - "Ticket.${t_id}.workflow_status == TRIAGED and Ticket.${t_id}.dispatch_status == NOT_REQUIRED"

      - name: accept_transfer_depends_on_target_subscription_entitlement
        grounds:
          - state_machines.Device.lifecycle.TRANSFER_PENDING_to_ACTIVE
          - validations[priority=50]
          - errors[ERR_DEVICE_CAP_EXCEEDED]
          - calculations.device_entitlement_evaluation
          - entities.Device.fields.transfer_target_household_id
