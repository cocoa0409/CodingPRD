scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: indirect_recovery_negotiated_vs_de_minimis_on_financial_report
        grounds:
          - calculations.indirect_cost_recovery
          - entities.IndirectCostRate.fields.rate_type
          - entities.IndirectCostRate.fields.negotiated_rate
          - entities.FinancialReport.fields.indirect_cost_cents
          - state_machines.FinancialReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Subject domain is the FinancialReport cost base (MTDC over direct_cost_lines): the SAME
          line items yield indirect_cost_cents == 5861585 under a NEGOTIATED 0.345 rate but 1699010
          under DE_MINIMIS 0.10 — two valid rate algorithms, different results, on FinancialReport
          cost accounting (distinct from the Award-ledger reimbursement variant).
        test_recipe:
          setup:
            - "An AWARDED application -> ACTIVE Award (total_award_cents=50000000, federal_share_pct=0.80)."
            - "Two identical DRAFT FinancialReports created with the same direct_cost_lines; one award carries a NEGOTIATED 0.345 ACTIVE rate, the other a DE_MINIMIS rate."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A1", applicant_org_name: "Org A", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app1_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app1_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award1_id: $.data.id, award1_v: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${award1_id}", rate_type: "NEGOTIATED", negotiated_rate: 0.345, base_type: "MTDC", expected_award_version: "${award1_v}" }
              as: FinanceOfficer
            - call: "POST /financial-reports"
              payload: { award_id: "${award1_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 11990100 }, { category: "EQUIPMENT", amount_cents: 5000000 }, { category: "TRAVEL", amount_cents: 1000000 }, { category: "SUPPLIES", amount_cents: 1500000 }, { category: "SUBAWARD_PASS_THROUGH", amount_cents: 8000000 } ] }
              as: FinanceOfficer
              captures: { fr1_id: $.data.id }
            - call: "POST /financial-reports/${fr1_id}/certify"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /financial-reports/${fr1_id}/accept"
              payload: {}
              as: AgencyOfficer
              captures: { fr1_indirect: $.data.indirect_cost_cents }
          assert:
            - "FinancialReport.${fr1_id}.approved_direct_cents == 27490100"
            - "FinancialReport.${fr1_id}.indirect_cost_cents == 5861585"
            - "FinancialReport.${fr1_id}.status == ACCEPTED"

      - name: reimbursement_provisional_vs_final_on_award_ledger
        grounds:
          - calculations.reimbursement_reconciliation
          - entities.Award.fields.federal_drawn_cents
          - entities.Award.fields.federal_ceiling_cents
          - entities.FinancialReport.fields.report_basis
          - entities.FinancialReport.fields.reimbursable_cents
          - state_machines.FinancialReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Subject domain is the Award cash ledger: a FINAL report with approved_direct 20000000 (prior
          ACCEPTED report 10000000, disallowed 2000000, ceiling 40000000, federal_drawn 15000000) yields
          reimbursable_cents == 7000000, but the same period inputs under INTERIM (provisional) yield
          16000000 — divergence driven by Award.federal_drawn_cents / federal_ceiling_cents, not by any
          FinancialReport cost-base field (distinct from the indirect-rate variant).
        test_recipe:
          setup:
            - "ACTIVE Award (total_award_cents=50000000, federal_share_pct=0.80, ceiling=40000000)."
            - "One ACCEPTED INTERIM report with approved_direct_cents=10000000; a DISBURSED drawdown leaving federal_drawn_cents=15000000."
            - "A second report carrying period inputs approved_direct=20000000, disallowed_cents=2000000, prepared as FINAL."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A2", applicant_org_name: "Org B", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app2_id: $.data.id }
            - call: "POST /applications/${app2_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app2_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app2_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award2_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award2_id}", category: "PERSONNEL", budgeted_cents: 20000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { rf2_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${award2_id}", amount_cents: 15000000, allocation_plan: [ { restricted_fund_id: "${rf2_id}", amount_cents: 15000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_2"
              captures: { dd2_id: $.data.id }
            - call: "POST /drawdowns/${dd2_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_2"
            - call: "POST /financial-reports"
              payload: { award_id: "${award2_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 10000000 } ] }
              as: FinanceOfficer
              captures: { fr_prior_id: $.data.id }
            - call: "POST /financial-reports/${fr_prior_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_cert_2"
            - call: "POST /financial-reports/${fr_prior_id}/accept"
              payload: {}
              as: AgencyOfficer
            - call: "POST /financial-reports"
              payload: { award_id: "${award2_id}", period_label: "FY2026-FINAL", report_basis: "FINAL", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 20000000 } ], disallowed_cents: 2000000 }
              as: FinanceOfficer
              captures: { fr_final_id: $.data.id }
            - call: "POST /financial-reports/${fr_final_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_cert_2"
          trigger:
            - call: "POST /financial-reports/${fr_final_id}/accept"
              payload: {}
              as: AgencyOfficer
              captures: { final_reimb: $.data.reimbursable_cents }
          assert:
            - "FinancialReport.${fr_final_id}.reimbursable_cents == 7000000"
            - "FinancialReport.${fr_prior_id}.reimbursable_cents == 8000000"
            - "Award.${award2_id}.federal_drawn_cents == 15000000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: indirect_mtdc_base_nonlinear_exclusions_mode_a
        grounds:
          - calculations.indirect_cost_recovery
          - entities.FinancialReport.fields.direct_cost_lines
          - entities.IndirectCostRate.fields.base_type
        distinguishing_aspect: |
          MODE (a): >=3 inputs with non-linear interaction — direct_total minus a full EQUIPMENT
          exclusion minus a per-subaward max(0, line - 2500000) excess clamp, then a single rate
          multiply. MTDC = 27490100 - 5000000 - max(0,8000000-2500000)=16990100; with 0.345 ->
          5861585. The max-clamp on the subaward line and the conditional equipment exclusion make
          this nested/branching, not a flat sum.
        test_recipe:
          setup:
            - "ACTIVE Award with a NEGOTIATED 0.345 MTDC rate and a DRAFT INTERIM report whose lines include EQUIPMENT (5000000) and a SUBAWARD_PASS_THROUGH (8000000) above the 2500000 cap."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A3", applicant_org_name: "Org C", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app3_id: $.data.id }
            - call: "POST /applications/${app3_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app3_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app3_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award3_id: $.data.id, award3_v: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${award3_id}", rate_type: "NEGOTIATED", negotiated_rate: 0.345, base_type: "MTDC", expected_award_version: "${award3_v}" }
              as: FinanceOfficer
            - call: "POST /financial-reports"
              payload: { award_id: "${award3_id}", period_label: "FY2026-Q2", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 11990100 }, { category: "EQUIPMENT", amount_cents: 5000000 }, { category: "TRAVEL", amount_cents: 1000000 }, { category: "SUPPLIES", amount_cents: 1500000 }, { category: "SUBAWARD_PASS_THROUGH", amount_cents: 8000000 } ] }
              as: FinanceOfficer
              captures: { fr3_id: $.data.id }
            - call: "POST /financial-reports/${fr3_id}/certify"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /financial-reports/${fr3_id}/accept"
              payload: {}
              as: AgencyOfficer
          assert:
            - "FinancialReport.${fr3_id}.indirect_cost_cents == 5861585"
            - "FinancialReport.${fr3_id}.approved_direct_cents == 27490100"

      - name: indirect_rounding_order_pinned_sum_then_round_mode_b
        grounds:
          - calculations.indirect_cost_recovery
          - entities.FinancialReport.fields.indirect_cost_cents
          - entities.IndirectCostRate.fields.negotiated_rate
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. With three MTDC-eligible lines 100100/102100/105100
          at rate 0.345, round-per-line-then-sum = 106020 but the pinned sum-then-round = 106019. The scaffold
          pins SUM-THEN-ROUND, so indirect_cost_cents MUST equal 106019, never 106020.
        test_recipe:
          setup:
            - "ACTIVE Award with NEGOTIATED 0.345 MTDC rate; DRAFT INTERIM report with three PERSONNEL/TRAVEL/SUPPLIES lines 100100, 102100, 105100 (all MTDC-eligible, no equipment/subaward)."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A4", applicant_org_name: "Org D", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app4_id: $.data.id }
            - call: "POST /applications/${app4_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app4_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app4_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award4_id: $.data.id, award4_v: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${award4_id}", rate_type: "NEGOTIATED", negotiated_rate: 0.345, base_type: "MTDC", expected_award_version: "${award4_v}" }
              as: FinanceOfficer
            - call: "POST /financial-reports"
              payload: { award_id: "${award4_id}", period_label: "FY2026-Q3", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 100100 }, { category: "TRAVEL", amount_cents: 102100 }, { category: "SUPPLIES", amount_cents: 105100 } ] }
              as: FinanceOfficer
              captures: { fr4_id: $.data.id }
            - call: "POST /financial-reports/${fr4_id}/certify"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /financial-reports/${fr4_id}/accept"
              payload: {}
              as: AgencyOfficer
          assert:
            - "FinancialReport.${fr4_id}.indirect_cost_cents == 106019"
            - "FinancialReport.${fr4_id}.approved_direct_cents == 307300"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_under_review_to_revisions_and_back
        grounds:
          - state_machines.NofoApplication.UNDER_REVIEW_to_REVISIONS_REQUESTED
          - state_machines.NofoApplication.REVISIONS_REQUESTED_to_SUBMITTED
          - state_machines.NofoApplication.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic shape on NofoApplication: UNDER_REVIEW -> REVISIONS_REQUESTED -> SUBMITTED -> UNDER_REVIEW
          returns the entity to a previously-occupied state, then proceeds to AWARDED — a revision loop,
          not a linear pipeline. Distinct entity from the FinancialReport reject cycle.
        test_recipe:
          setup:
            - "A SUBMITTED application that the agency takes UNDER_REVIEW, bounces with request-revisions, the writer resubmits, agency re-reviews, then awards."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A5", applicant_org_name: "Org E", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app5_id: $.data.id }
            - call: "POST /applications/${app5_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app5_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app5_id}/request-revisions"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app5_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app5_id}/begin-review"
              payload: {}
              as: AgencyOfficer
          trigger:
            - call: "POST /applications/${app5_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award5_id: $.data.id }
          assert:
            - "NofoApplication.${app5_id}.status == AWARDED"
            - "Award.${award5_id}.status == ACTIVE"
            - "Award.${award5_id}.federal_ceiling_cents == 24000000"

      - name: financial_report_reject_revise_cycle_back_to_draft
        grounds:
          - state_machines.FinancialReport.SUBMITTED_to_REJECTED
          - state_machines.FinancialReport.REJECTED_to_DRAFT
          - state_machines.FinancialReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic shape on FinancialReport: SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED revisits the DRAFT
          and SUBMITTED states (a revise loop). Different entity from the NofoApplication revision cycle.
        test_recipe:
          setup:
            - "An ACTIVE award with a DRAFT INTERIM report; certify, agency rejects, finance revises to DRAFT, re-certifies."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A6", applicant_org_name: "Org F", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app6_id: $.data.id }
            - call: "POST /applications/${app6_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app6_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app6_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award6_id: $.data.id }
            - call: "POST /financial-reports"
              payload: { award_id: "${award6_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 1000000 } ] }
              as: FinanceOfficer
              captures: { fr6_id: $.data.id }
            - call: "POST /financial-reports/${fr6_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_cert_6"
            - call: "POST /financial-reports/${fr6_id}/reject"
              payload: {}
              as: AgencyOfficer
            - call: "POST /financial-reports/${fr6_id}/revise"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /financial-reports/${fr6_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_cert_6"
          assert:
            - "FinancialReport.${fr6_id}.status == SUBMITTED"
            - "FinancialReport.${fr6_id}.certified_by_user_id == officer_cert_6"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disburse_cascade_allocation_then_fund_balance_then_award_ledger
        grounds:
          - state_machines.Drawdown.REQUESTED_to_DISBURSED
          - calculations.drawdown_waterfall_allocation
          - entities.FundAllocation.fields.amount_cents
          - entities.RestrictedFund.fields.allocated_cents
          - entities.Award.fields.federal_drawn_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by Drawdown DISBURSE: (A) drawdown -> DISBURSED creates FundAllocation
          rows; (B) each created FundAllocation itself drives RestrictedFund.allocated_cents += its amount;
          (C) the resulting per-fund posting rolls up into Award.federal_drawn_cents. Each hop is caused by
          the prior hop's mutation, not directly by the disburse action.
        test_recipe:
          setup:
            - "ACTIVE Award (ceiling 40000000) with three RestrictedFunds priority 1/2/3 budgeted 10000000/2000000/3000000; a REQUESTED drawdown for 11000000 whose allocation_plan matches the waterfall."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A7", applicant_org_name: "Org G", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app7_id: $.data.id }
            - call: "POST /applications/${app7_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app7_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app7_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award7_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award7_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { rf7a_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award7_id}", category: "TRAVEL", budgeted_cents: 2000000, priority_order: 2 }
              as: FinanceOfficer
              captures: { rf7b_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${award7_id}", category: "SUPPLIES", budgeted_cents: 3000000, priority_order: 3 }
              as: FinanceOfficer
              captures: { rf7c_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${award7_id}", amount_cents: 11000000, allocation_plan: [ { restricted_fund_id: "${rf7a_id}", amount_cents: 10000000 }, { restricted_fund_id: "${rf7b_id}", amount_cents: 1000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_7"
              captures: { dd7_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${dd7_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_7"
          assert:
            - "Drawdown.${dd7_id}.status == DISBURSED"
            - "RestrictedFund.${rf7a_id}.allocated_cents == 10000000"
            - "RestrictedFund.${rf7b_id}.allocated_cents == 1000000"
            - "RestrictedFund.${rf7c_id}.allocated_cents == 0"
            - "Award.${award7_id}.federal_drawn_cents == 11000000"

      - name: accept_report_cascade_approved_totals_then_award_expenditures
        grounds:
          - state_machines.FinancialReport.SUBMITTED_to_ACCEPTED
          - calculations.report_approval_totals
          - entities.FinancialReport.fields.approved_direct_cents
          - entities.Award.fields.federal_approved_expenditures_cents
        distinguishing_aspect: |
          Depth-2 cascade triggered by FinancialReport ACCEPT (different trigger from DISBURSE):
          (A) report -> ACCEPTED computes approved_direct_cents; (B) that newly-written approved_direct_cents
          rolls up into Award.federal_approved_expenditures_cents = round_half_up(0.80 * sum over ACCEPTED).
          Hop B is caused by hop A's field write.
        test_recipe:
          setup:
            - "ACTIVE Award (federal_share_pct 0.80); a SUBMITTED INTERIM report with a single PERSONNEL line 10000000."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-A8", applicant_org_name: "Org H", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { app8_id: $.data.id }
            - call: "POST /applications/${app8_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${app8_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${app8_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { award8_id: $.data.id }
            - call: "POST /financial-reports"
              payload: { award_id: "${award8_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 10000000 } ] }
              as: FinanceOfficer
              captures: { fr8_id: $.data.id }
            - call: "POST /financial-reports/${fr8_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_cert_8"
          trigger:
            - call: "POST /financial-reports/${fr8_id}/accept"
              payload: {}
              as: AgencyOfficer
          assert:
            - "FinancialReport.${fr8_id}.approved_direct_cents == 10000000"
            - "Award.${award8_id}.federal_approved_expenditures_cents == 8000000"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_ceiling_on_disburse
        grounds:
          - validations[priority=4]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CEILING_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 4) vs business_fiscal (priority 12): a disburse on an already-DISBURSED
          drawdown that ALSO would exceed the ceiling must return ERR_INVALID_STATE (409), not
          ERR_CEILING_EXCEEDED — the lower-priority state check wins.
        test_recipe:
          setup:
            - "ACTIVE Award (ceiling 8000000) with one RestrictedFund budget 10000000; a drawdown of 8000000 already DISBURSED (so federal_drawn=8000000, a second disburse would exceed ceiling AND the drawdown is no longer REQUESTED)."
          setup_api_calls:
            - call: "POST /applications"
