        claim_type: Temporal validation
        grounds:
          - validations.priority_60_ERR_OUTSIDE_REGISTRATION_WINDOW
        distinguishing_aspect: "The window is half-open: registration_opens_at <= current_utc < registration_closes_at. The clock is parked on 2026-08-10T00:00:00Z, the exact close instant, which is OUTSIDE. Every other precondition is satisfied — the league is still REGISTRATION_OPEN, the team has the required two ACTIVE spots and capacity is free — so an implementation using an inclusive upper bound admits the registration and fails this instance alone."
