            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/interments/${int_id}/open", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/interments/${int_id}/complete", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations", payload: { interment_id: "${int_id}", reason: "removal", disinterment_type: "REMOVAL" }, as: Registrar, captures: { auth_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${auth_id}/execute", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: plot_capacity_full_blocks_schedule
        grounds:
          - validations[priority=10]
          - errors[ERR_PLOT_CAPACITY]
          - entities.Plot.fields.interments_used
        distinguishing_aspect: |
          Capacity count boundary on POST /interments: with interment_capacity=1, the first
          schedule succeeds (interments_used 0<1) and the second is rejected exactly at
          interments_used==1 (>= capacity) with ERR_PLOT_CAPACITY — dates differ so no overlap masks it.
        test_recipe:
          setup:
            - "GRAVE plot with interment_capacity=1 and an ISSUED deed; one interment already SCHEDULED on 2026-06-01."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 1 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
