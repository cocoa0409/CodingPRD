              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "I-15", description: "Interstate HSIP", activity_code: "ROAD_RESURFACING", is_interstate_system: true, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
