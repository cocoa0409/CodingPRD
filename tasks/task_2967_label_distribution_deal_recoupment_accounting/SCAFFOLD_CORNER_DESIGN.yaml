      - name: manufacture_action_writes_cost_and_refuses_a_second_call
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /physical-runs/{id}/manufacture]
          - state_machines[PhysicalRun.status].transitions[PLANNED->MANUFACTURED]
          - endpoints[POST /physical-runs]
        distinguishing_aspect: |
          The action endpoint's declared side effects are all observable in one call:
          manufacturing_cost_cents == units_manufactured * unit_manufacturing_cost_cents (the units
          ACTUALLY produced, which deliberately differ from units_planned), status PLANNED ->
          MANUFACTURED and version + 1. The precondition is then enforced by repeating the same call,
          which must be a 409 on the run's fulfilment dimension while the reserve dimension stays HELD.
          The run also proves the reserve fallback: returns_reserve_pct omitted at creation stays null
          on the row, and the distributor's 0.1200 is what later prices the reserve.
        test_recipe:
          setup:
            - "one Distributor with default_returns_reserve_pct 0.1200, one EXECUTED deal and one RELEASED vinyl release"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Harbourside Physical", legal_entity: "Harbourside Physical Ltd", default_returns_reserve_pct: 0.1200 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
