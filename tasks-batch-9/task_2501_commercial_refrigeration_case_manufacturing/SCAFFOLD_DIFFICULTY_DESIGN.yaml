          - state_machines.EnergyTest.RUNNING_to_COMPLETED_PASS
          - endpoints.POST./energy-tests/{id}/complete
        distinguishing_aspect: |
          The measured metric sits exactly on the inclusive limit: limit_daily_kwh is 17.568
          (0.62 * 26.4 + 1.20) and measured_kwh_24h is 17.568 to the millimetre, so the <=
          comparison must pass rather than fail, and the lab index rounds to 0.665 at three
          decimals with ROUND_HALF_UP.
