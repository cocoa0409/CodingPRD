# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Nine §0.5 rule_id blocks, two instances each (18 total). Every instance grounds
# in elements already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file
# changes no declared behavior, only the auditability of test coverage.
#
# Every numeric literal in an `assert:` line below was produced by executing the
# corresponding §1.3 `formula:` against its `constants:` in Python, not estimated.
# Every `${var}` is bound by a `captures:` block on an earlier line of the same
# instance. The logical clock starts at 2026-08-01T00:00:00Z (see the §1.5
# description of POST /swim-club/_clock/set_current_utc), so every instance that
# depends on a season window moves the clock explicitly as its first call.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seasonal_dues_calendar_day_vs_swim_week_on_membership
        grounds:
          - calculations.seasonal_dues_assessment
          - entities.Season.fields.proration_basis
          - entities.Membership.fields.assessed_dues_cents
          - endpoints[POST /swim-club/memberships]
        distinguishing_aspect: |
          This variant pair operates on the Membership dues domain: the SAME household,
          category and 108-day/16-week season geometry with the SAME join_date yields
          assessed_dues_cents 46222 under CALENDAR_DAY and 48750 under SWIM_WEEK, a
          2528-cent divergence caused solely by the Season's proration_basis. The
          companion instance guest_visit_pass_first_vs_fee_first_on_weekend diverges on a
          different entity domain entirely - the Household guest-pass ledger and GuestVisit
          cash fee - so the scaffold exhibits dual-variant logic on two distinct subjects.
        test_recipe:
          setup:
            - "One FAMILY membership category with seasonal_dues_cents 78000."
            - "Two OPEN seasons with identical geometry (108 inclusive days, 16 ceil-weeks) but different proration_basis: 2027 is CALENDAR_DAY, 2028 is SWIM_WEEK."
            - "One household holding one Membership in each season, both joining 64 inclusive days (10 ceil-weeks) before that season's close_date."
            - "Both memberships are still dues_status UNBILLED, so assessed_dues_cents is the value stamped at creation and nothing has re-derived it."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/seasons"
              payload: { year: 2028, open_date: "2028-05-20", close_date: "2028-09-04", dues_due_date: "2028-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "SWIM_WEEK", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s28_id: $.data.id }
            - call: "POST /swim-club/seasons/${s28_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Alvarez Household", address_line: "14 Poolside Lane", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
          trigger:
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_cal_id: $.data.id, m_cal_dues: $.data.assessed_dues_cents }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s28_id}", join_date: "2028-07-03", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_wk_id: $.data.id, m_wk_dues: $.data.assessed_dues_cents }
          assert:
            - "Membership.${m_cal_id}.assessed_dues_cents == 46222"
            - "Membership.${m_wk_id}.assessed_dues_cents == 48750"
            - "Membership.${m_wk_id}.assessed_dues_cents - Membership.${m_cal_id}.assessed_dues_cents == 2528"
            - "Membership.${m_cal_id}.dues_status == UNBILLED and Membership.${m_wk_id}.dues_status == UNBILLED"
            - "Membership.${m_cal_id}.access_status == PENDING and Membership.${m_wk_id}.access_status == PENDING"
            - "Membership.${m_cal_id}.initiation_fee_cents == 45000 (household.prior_member is false, so Line 2 fires on both)"
            - "Membership.${m_wk_id}.initiation_fee_cents == 45000"

      - name: guest_visit_pass_first_vs_fee_first_on_weekend
        grounds:
          - calculations.guest_visit_settlement
          - entities.Season.fields.guest_settlement_policy
          - entities.GuestVisit.fields.passes_used
          - entities.GuestVisit.fields.fee_charged_cents
          - entities.Household.fields.guest_pass_balance
          - endpoints[POST /swim-club/guest-visits]
        distinguishing_aspect: |
          This variant pair operates on the GuestVisit / Household guest-pass domain, not the
          Membership dues domain: with 6 weekend guests against a 4-pass balance, PASS_FIRST
          burns 4 passes and charges 1600 cents while FEE_FIRST_ON_WEEKEND burns 0 passes and
          charges 4800 cents, so the variant moves BOTH a conserved non-monetary counter
          (surviving guest_pass_balance 0 vs 4) and a cash figure - a structurally different
          divergence from seasonal_dues_calendar_day_vs_swim_week_on_membership, which moves
          only one money field on a different entity.
        test_recipe:
          setup:
            - "One FAMILY category granting guest_pass_allotment 4 per membership."
            - "Two OPEN seasons: 2027 with guest_settlement_policy PASS_FIRST, 2028 with FEE_FIRST_ON_WEEKEND."
            - "Two separate households, each holding exactly one invoiced (access_status ACTIVE) Membership - one in the 2027 season, one in the 2028 season - so each household's guest_pass_balance is exactly 4 and neither shares a ledger with the other."
            - "The logical clock sits at 2028-07-10T09:00:00Z, after both visit instants, so neither visit is recorded in the future."
            - "Neither household owes any guest fee or party charge, so the delinquency tolerance of 0 cents is satisfied at both trigger calls."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-10T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/seasons"
              payload: { year: 2028, open_date: "2028-05-20", close_date: "2028-09-04", dues_due_date: "2028-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "FEE_FIRST_ON_WEEKEND" }
              as: BoardPresident
              captures: { s28_id: $.data.id }
            - call: "POST /swim-club/seasons/${s28_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Pass First Household", address_line: "2 Diving Board Way", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_pf_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_pf_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_pf_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_pf_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Fee First Household", address_line: "3 Diving Board Way", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_ff_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_ff_id}", membership_category_id: "${cat_family_id}", season_id: "${s28_id}", join_date: "2028-07-03", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_ff_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_ff_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "GET /swim-club/households/${h_pf_id}"
              payload: {}
              as: PoolManager
              captures: { h_pf_v: $.data.version }
            - call: "GET /swim-club/households/${h_ff_id}"
              payload: {}
              as: PoolManager
              captures: { h_ff_v: $.data.version }
          trigger:
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_pf_id}", sponsor_name: "Rosa Alvarez", guest_count: 6, visit_start_iso: "2027-07-10T11:00:00Z", expected_household_version: "${h_pf_v}" }
              as: PoolManager
              captures: { v_pf_id: $.data.id }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_ff_id}", sponsor_name: "Dana Okoye", guest_count: 6, visit_start_iso: "2028-07-08T11:00:00Z", expected_household_version: "${h_ff_v}" }
              as: PoolManager
              captures: { v_ff_id: $.data.id }
          assert:
            - "GuestVisit.${v_pf_id}.settlement_variant == PASS_FIRST and GuestVisit.${v_pf_id}.is_weekend == true"
            - "GuestVisit.${v_pf_id}.passes_used == 4"
            - "GuestVisit.${v_pf_id}.fee_charged_cents == 1600"
            - "Household.${h_pf_id}.guest_pass_balance == 0 and Household.${h_pf_id}.guest_passes_consumed == 4"
            - "Household.${h_pf_id}.guest_fee_owed_cents == 1600"
            - "GuestVisit.${v_ff_id}.settlement_variant == FEE_FIRST_ON_WEEKEND and GuestVisit.${v_ff_id}.is_weekend == true"
            - "GuestVisit.${v_ff_id}.passes_used == 0"
            - "GuestVisit.${v_ff_id}.fee_charged_cents == 4800"
            - "Household.${h_ff_id}.guest_pass_balance == 4 and Household.${h_ff_id}.guest_passes_consumed == 0"
            - "Household.${h_ff_id}.guest_fee_owed_cents == 4800"
            - "GuestVisit.${v_ff_id}.fee_charged_cents - GuestVisit.${v_pf_id}.fee_charged_cents == 3200"

  # ===========================================================================
  # Rule 2 - combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_rounding_order_per_swimmer_lines_mode_b
        grounds:
          - calculations.season_dues_invoice_total
          - entities.SwimTeamRegistration.fields.assessed_fee_cents
          - entities.SwimTeamRegistration.fields.squad_seq
          - entities.Membership.fields.late_penalty_cents
          - entities.Membership.fields.invoice_total_cents
          - state_machines.Membership.UNBILLED_to_INVOICED
          - endpoints[POST /swim-club/memberships/{id}/invoice]
        distinguishing_aspect: |
          Mode (b) - nested rounding where the ORDER decides the cents. Rounding each
          swimmer's discounted fee as its own invoice sub-line gives Line 4 == 40782 and a
          final invoice_total_cents of 167674; summing the three exact values
          (14500 + 13593.75 + 12687.50 = 40781.25) and rounding once gives 40781 and a total
          of 167673. The scaffold pins the per-line order, and the 1-cent difference is
          directly observable in balance_due_cents. The companion instance
          party_charge_nine_step_evaluation_order_mode_c is mode (c), not mode (b): nothing
          there turns on rounding order, only on the sequence of a self-referential tier.
        test_recipe:
          setup:
            - "One FAMILY category: seasonal_dues_cents 78000, initiation_fee_cents 45000, bond_cents 120000."
            - "OPEN 2027 season with dues_due_date 2027-04-15, so an invoice cut on 2027-07-06 is late and Line 5 fires."
            - "One first-time household (prior_member false) with a Membership joining 2027-07-05 on bond_payment_plan INSTALLMENTS, giving assessed_dues_cents 46222 and initiation_fee_cents 45000 stamped at creation."
            - "Three SwimTeamRegistrations on that Membership, created in swimmer_birthdate ASC order so squad_seq is 1, 2, 3 and each swimmer's assessed_fee_cents is rounded at its own creation."
            - "All three registrations are still PENDING when the invoice is cut, so volunteer_credits_required is 0 and volunteer_buyout_cents is 0."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Alvarez Household", address_line: "14 Poolside Lane", residency: "IN_DISTRICT", member_count: 5, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_a_id: $.data.id }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_a_id}", season_id: "${s27_id}", swimmer_name: "Mateo Alvarez", swimmer_birthdate: "2013-03-04", squad: "SENIOR" }
              as: SwimTeamCoach
              captures: { r1_id: $.data.id, r1_fee: $.data.assessed_fee_cents }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_a_id}", season_id: "${s27_id}", swimmer_name: "Nina Alvarez", swimmer_birthdate: "2015-06-11", squad: "JUNIOR" }
              as: SwimTeamCoach
              captures: { r2_id: $.data.id, r2_fee: $.data.assessed_fee_cents }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_a_id}", season_id: "${s27_id}", swimmer_name: "Oli Alvarez", swimmer_birthdate: "2017-09-20", squad: "MINI" }
              as: SwimTeamCoach
              captures: { r3_id: $.data.id, r3_fee: $.data.assessed_fee_cents }
          trigger:
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { inv_total: $.data.invoice_total_cents, inv_balance: $.data.balance_due_cents }
          assert:
            - "SwimTeamRegistration.${r1_id}.squad_seq == 1 and SwimTeamRegistration.${r1_id}.assessed_fee_cents == 14500"
            - "SwimTeamRegistration.${r2_id}.squad_seq == 2 and SwimTeamRegistration.${r2_id}.assessed_fee_cents == 13594"
            - "SwimTeamRegistration.${r3_id}.squad_seq == 3 and SwimTeamRegistration.${r3_id}.assessed_fee_cents == 12688"
            - "Membership.${m_a_id}.assessed_dues_cents == 46222"
            - "Membership.${m_a_id}.initiation_fee_cents == 45000"
            - "Membership.${m_a_id}.bond_installment_cents == 30000"
            - "Membership.${m_a_id}.swim_team_fee_cents == 40782"
            - "Membership.${m_a_id}.late_penalty_cents == 5670"
            - "Membership.${m_a_id}.invoice_total_cents == 167674"
            - "Membership.${m_a_id}.invoice_total_cents != 167673 (the rejected sum-then-round order)"
            - "Membership.${m_a_id}.volunteer_buyout_cents == 0"
            - "Membership.${m_a_id}.balance_due_cents == 167674"
            - "Membership.${m_a_id}.dues_status == INVOICED and Membership.${m_a_id}.access_status == ACTIVE"

      - name: party_charge_nine_step_evaluation_order_mode_c
        grounds:
          - calculations.party_reservation_charge
          - entities.PartyReservation.fields.subtotal_cents
          - entities.PartyReservation.fields.member_discount_cents
          - entities.PartyReservation.fields.total_charge_cents
          - endpoints[POST /swim-club/party-reservations]
        distinguishing_aspect: |
          Mode (c) - a circular-LOOKING dependency with a pinned evaluation order: the guard
          surcharge depends on the bather load, the discount tier is keyed off a subtotal that
          already contains that surcharge, and the total depends on the discount. Evaluating
          step 8 against base_fee + guest_overage alone (31200) selects tier 1 and returns
          57780; evaluating it against the step-7 subtotal (64200) selects tier 2 and returns
          54570. No rounding order is involved anywhere, which is exactly what separates this
          from the mode (b) instance invoice_rounding_order_per_swimmer_lines_mode_b.
        test_recipe:
          setup:
            - "One FAMILY category with party_privileges true and bond_cents 120000."
            - "OPEN 2027 season with bather_load_capacity 120, so the 31-bather load is far below the aggregate ceiling."
            - "One household with an invoiced (access_status ACTIVE) Membership and bond_status PAID, so the party-privilege and bond gates both pass."
            - "No other PartyReservation exists, so neither the zone-conflict nor the aggregate-capacity rule fires."
            - "The logical clock sits at 2027-07-06T09:00:00Z, before the requested party window of 2027-07-10T14:00:00Z to 2027-07-10T18:30:00Z."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Alvarez Household", address_line: "14 Poolside Lane", residency: "IN_DISTRICT", member_count: 5, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_a_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/households/${h_a_id}/payments"
              payload: { amount_cents: 120000, allocation: "BOND" }
              as: Treasurer
              captures: { h_a_bond_status: $.data.bond_status }
          trigger:
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_a_id}", zone: "WHOLE_FACILITY", start_iso: "2027-07-10T14:00:00Z", end_iso: "2027-07-10T18:30:00Z", guest_count: 26, host_party_size: 5 }
              as: PoolManager
              captures: { p_a_id: $.data.id, p_a_total: $.data.total_charge_cents }
          assert:
            - "Household.${h_a_id}.bond_status == PAID and Household.${h_a_id}.bond_paid_cents == 120000"
            - "PartyReservation.${p_a_id}.status == REQUESTED"
            - "PartyReservation.${p_a_id}.projected_bather_load == 31"
            - "PartyReservation.${p_a_id}.required_guard_count == 3"
            - "PartyReservation.${p_a_id}.duration_hours_ceil == 5"
            - "PartyReservation.${p_a_id}.lifeguard_surcharge_cents == 33000"
            - "PartyReservation.${p_a_id}.base_facility_fee_cents == 20000"
            - "PartyReservation.${p_a_id}.guest_overage_fee_cents == 11200"
            - "PartyReservation.${p_a_id}.subtotal_cents == 64200"
            - "PartyReservation.${p_a_id}.member_discount_cents == 9630"
            - "PartyReservation.${p_a_id}.total_charge_cents == 54570"
            - "PartyReservation.${p_a_id}.total_charge_cents != 57780 (the rejected tier keyed off base_fee + guest_overage only)"
            - "PartyReservation.${p_a_id}.refunded_cents == 0"
            - "Household.${h_a_id}.party_charges_owed_cents == 54570"

  # ===========================================================================
  # Rule 3 - non-linear state machines on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_dues_and_access_dimensions_evolve_independently
        grounds:
          - state_machines[Membership, dimension=dues_status]
          - state_machines[Membership, dimension=access_status]
          - complexity_profile.state_machine_shape
          - endpoints[POST /swim-club/memberships/{id}/invoice]
          - endpoints[POST /swim-club/seasons/{id}/billing-runs]
          - endpoints[POST /swim-club/memberships/{id}/write-off]
        distinguishing_aspect: |
          Non-linearity here is PARALLELISM on the Membership row: two state dimensions on one
          entity advance on different triggers, and the combined state is not a function of
          either dimension alone. The billing run moves dues_status INVOICED -> DELINQUENT while
          access_status stays ACTIVE (the household may still swim while it owes money), and only
          the write-off couples the dimensions, dragging access ACTIVE -> SUSPENDED as a side
          effect of a dues transition. The companion instance
          inspection_finding_remediation_reopen_cycle is non-linear on a DIFFERENT entity and in a
          different way - one dimension that revisits a state it has already occupied.
        test_recipe:
          setup:
            - "One FAMILY category and one OPEN 2027 season with dues_due_date 2027-04-15."
            - "The logical clock sits at 2027-07-06T09:00:00Z, strictly after dues_due_date, so the billing run's delinquency precondition is satisfied."
            - "One household in GOOD_STANDING holding one freshly created Membership: dues_status UNBILLED, access_status PENDING."
            - "No payment is ever made, so balance_due_cents stays strictly positive and the billing run finds the membership."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Alvarez Household", address_line: "14 Poolside Lane", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_a_id: $.data.id, m_dues_0: $.data.dues_status, m_access_0: $.data.access_status }
          trigger:
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_dues_1: $.data.dues_status, m_access_1: $.data.access_status, m_bal_1: $.data.balance_due_cents }
            - call: "POST /swim-club/seasons/${s27_id}/billing-runs"
              payload: {}
              as: Treasurer
            - call: "GET /swim-club/memberships/${m_a_id}"
              payload: {}
              as: Treasurer
              captures: { m_dues_2: $.data.dues_status, m_access_2: $.data.access_status }
            - call: "POST /swim-club/memberships/${m_a_id}/write-off"
              payload: { reason: "Household unreachable after two collection notices" }
              as: Treasurer
              captures: { m_dues_3: $.data.dues_status, m_access_3: $.data.access_status, m_bal_3: $.data.balance_due_cents }
          assert:
            - "state 0 (after create): dues_status == UNBILLED and access_status == PENDING"
            - "state 1 (after invoice): dues_status == INVOICED and access_status == ACTIVE, and balance_due_cents == 167674 minus nothing, i.e. strictly > 0"
            - "state 2 (after the billing run): dues_status == DELINQUENT while access_status is STILL ACTIVE - the dues dimension moved and the access dimension did not"
            - "state 3 (after the write-off): dues_status == WRITTEN_OFF and access_status == SUSPENDED, and balance_due_cents == 0"
            - "the four (dues_status, access_status) pairs are UNBILLED/PENDING, INVOICED/ACTIVE, DELINQUENT/ACTIVE, WRITTEN_OFF/SUSPENDED - four distinct combined states from three triggers"
            - "Membership.${m_a_id}.version increased on every one of the four writes"
            - "no SwimTeamRegistration or PartyReservation exists, so the SUSPENDED cascade has nothing to cancel and the write-off still succeeds"

      - name: inspection_finding_remediation_reopen_cycle
        grounds:
          - state_machines[InspectionFinding]
          - entities.InspectionFinding.fields.reopen_count
          - entities.InspectionFinding.fields.verified_by_user_id
          - calculations.facility_posture_derivation
          - validations[priority=5]
          - endpoints[POST /swim-club/inspection-findings/{id}/transitions]
        distinguishing_aspect: |
          Non-linearity here is a CYCLE on a single dimension of a different entity: the finding
          re-enters REMEDIATION_SUBMITTED after having already left it, and reopen_count is the
          loop counter that proves the machine went round rather than forward. Nothing about
          parallel dimensions is involved. The severity is deliberately MINOR so the cycle can be
          observed with facility_posture pinned at OPEN the whole way through, isolating the state
          machine from the posture cascade. The companion instance
          membership_dues_and_access_dimensions_evolve_independently is a different entity and a
          different non-linearity (two dimensions, no revisited state).
        test_recipe:
          setup:
            - "One OPEN 2027 season with facility_posture OPEN and zero open findings."
            - "One MINOR InspectionFinding recorded by HealthInspector user hi-001, so recorded_by_user_id is hi-001 and posture is unaffected by this finding at every step."
            - "A second HealthInspector user hi-002 exists to satisfy the two-person control on VERIFIED_CLOSED."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-14T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
              captures: { posture_0: $.data.facility_posture }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-12", inspector_name: "K. Rowe", finding_code: "PH-LOG-INCOMPLETE", severity: "MINOR", narrative: "Chlorine log missing two afternoon readings." }
              as: HealthInspector
              as_user_id: "hi-001"
              captures: { f_id: $.data.id, f_status_0: $.data.status, f_reopen_0: $.data.reopen_count }
          trigger:
            - call: "POST /swim-club/inspection-findings/${f_id}/transitions"
              payload: { to_status: "REMEDIATION_SUBMITTED", remediation_note: "Log reconstructed from the DPD test tapes; staff retrained." }
              as: PoolManager
              as_user_id: "pm-001"
              captures: { f_status_1: $.data.status, f_reopen_1: $.data.reopen_count }
            - call: "POST /swim-club/inspection-findings/${f_id}/transitions"
              payload: { to_status: "REOPENED" }
              as: HealthInspector
              as_user_id: "hi-001"
              captures: { f_status_2: $.data.status, f_reopen_2: $.data.reopen_count }
            - call: "POST /swim-club/inspection-findings/${f_id}/transitions"
              payload: { to_status: "REMEDIATION_SUBMITTED", remediation_note: "Second submission: continuous DPD logging installed, sample sheet attached." }
              as: PoolManager
              as_user_id: "pm-001"
              captures: { f_status_3: $.data.status, f_reopen_3: $.data.reopen_count }
            - call: "POST /swim-club/inspection-findings/${f_id}/transitions"
              payload: { to_status: "VERIFIED_CLOSED" }
              as: HealthInspector
              as_user_id: "hi-002"
              captures: { f_status_4: $.data.status, f_verified_by: $.data.verified_by_user_id }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: HealthInspector
              captures: { posture_final: $.data.facility_posture, crit_final: $.data.open_critical_finding_count, major_final: $.data.open_major_finding_count }
          assert:
            - "the visited status sequence is OPEN, REMEDIATION_SUBMITTED, REOPENED, REMEDIATION_SUBMITTED, VERIFIED_CLOSED - REMEDIATION_SUBMITTED is occupied twice, which no acyclic machine can do"
            - "InspectionFinding.${f_id}.reopen_count == 0 at states 0 and 1, == 1 at states 2 and 3 (the counter increments only on the REMEDIATION_SUBMITTED -> REOPENED edge, not on re-entry)"
            - "InspectionFinding.${f_id}.remediation_note is the SECOND note, because the second REMEDIATION_SUBMITTED overwrites the first"
            - "InspectionFinding.${f_id}.verified_by_user_id == \"hi-002\" and != InspectionFinding.${f_id}.recorded_by_user_id (\"hi-001\")"
            - "Season.${s27_id}.facility_posture == OPEN at every one of the five observations, because a MINOR finding never affects posture"
            - "Season.${s27_id}.open_critical_finding_count == 0 and open_major_finding_count == 0 throughout"
            - "Season.${s27_id}.closure_started_at is null throughout"

  # ===========================================================================
  # Rule 4 - transitive cascades with different triggers and different depths
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: conduct_suspension_cascade_to_meet_understaffing
        grounds:
          - state_machines[ConductCase].UNDER_REVIEW_to_SANCTIONED
          - calculations.conduct_sanction_standing_map
          - state_machines[Household].GOOD_STANDING_to_SUSPENDED
          - state_machines[Membership, dimension=access_status].ACTIVE_to_SUSPENDED
          - state_machines[SwimTeamRegistration].CONFIRMED_to_REVOKED
          - state_machines[VolunteerAssignment].ASSIGNED_to_RELEASED
          - state_machines[Meet].STAFFED_to_UNDERSTAFFED
          - endpoints[POST /swim-club/conduct-cases/{id}/transitions]
        distinguishing_aspect: |
          Depth 6, triggered by a CONDUCT decision, and the chain runs DOWNWARD through ownership:
          ConductCase -> Household -> Membership -> SwimTeamRegistration -> VolunteerAssignment ->
          Meet. The terminal hop is a state REGRESSION on an unrelated aggregate (a meet that was
          already STAFFED falls back to UNDERSTAFFED and accrues a penalty) even though nobody
          touched the meet. The companion instance
          critical_finding_closure_cascade_to_membership_settlement is depth 4, is triggered by a
          HEALTH-DEPARTMENT finding rather than a conduct decision, and its chain runs through
          MONEY (refund -> account credit -> dues settlement -> capital reserve) rather than
          through ownership.
        test_recipe:
          setup:
            - "One FAMILY category (volunteer_credits_required 4) and one OPEN 2027 season."
            - "One household in GOOD_STANDING with one invoiced Membership (dues INVOICED, access ACTIVE)."
            - "Two SwimTeamRegistrations on that membership, both moved to CONFIRMED."
            - "One Meet with volunteer_slots_required 2, carrying one TIMER assignment (credit 1) and one MARSHAL assignment (credit 1), so volunteer_slots_filled is exactly 2."
            - "The meet's roster is closed, which puts the meet in STAFFED with understaffed_penalty_cents 0."
            - "One MAJOR ConductCase against that household, reported by PoolManager user pm-001 and already moved to UNDER_REVIEW; BoardPresident user bp-001 will decide it, satisfying the two-person control."
            - "CONDUCT_POINTS[MAJOR] is 4, which is below CONDUCT_SUSPENSION_THRESHOLD (6), so the suspension comes from the sanction_type and not from the point total - the cascade is driven by the decision, not by accumulation."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Alvarez Household", address_line: "14 Poolside Lane", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_a_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_a_id}", season_id: "${s27_id}", swimmer_name: "Mateo Alvarez", swimmer_birthdate: "2013-03-04", squad: "SENIOR" }
              as: SwimTeamCoach
              captures: { r1_id: $.data.id }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_a_id}", season_id: "${s27_id}", swimmer_name: "Nina Alvarez", swimmer_birthdate: "2015-06-11", squad: "JUNIOR" }
              as: SwimTeamCoach
