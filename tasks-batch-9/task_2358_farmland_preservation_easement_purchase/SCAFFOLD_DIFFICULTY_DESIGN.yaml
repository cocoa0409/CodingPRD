  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: monitoring_visit_windows_are_half_open_and_cancelled_visits_free_the_window
        grounds:
          - validations[priority=20]
          - entities.MonitoringVisit.fields.window_start
          - entities.MonitoringVisit.fields.window_end
          - state_machines.MonitoringVisit.SCHEDULED_to_CANCELLED
          - endpoints[POST /monitoring-visits]
          - endpoints[POST /monitoring-visits/{id}/cancellation]
          - errors.ERR_MONITORING_WINDOW_OVERLAP
        distinguishing_aspect: |
          The occupancy test is HALF-OPEN, so a visit starting exactly at an existing visit's
          window_end is legal while a visit starting one day earlier is not: 2027-06-08 ..
          2027-06-15 is accepted against 2027-06-01 .. 2027-06-08, but 2027-06-07 ..
          2027-06-14 is refused. Occupancy is also state-scoped to SCHEDULED, so cancelling
          both visits makes the previously refused 2027-06-07 .. 2027-06-14 window succeed
          verbatim. A closed-interval test rejects the adjacent window; an implementation that
          ignores status keeps rejecting after the cancellations.
        test_recipe:
          setup:
            - "Easement EA1 exists from the 2026-12-15 closing of AP1, with stewardship_hold false and compliance_status COMPLIANT."
            - "One SCHEDULED MonitoringVisit V1 occupies the half-open window 2027-06-01 .. 2027-06-08. The clock is 2026-12-15."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - *c_get_app_a_v1
            - *c_offer_a
            - *c_get_app_a_v2
            - *c_plan_a
            - *c_clk_1012
            - *c_accept_a
            - *c_get_req_title
            - *c_get_req_sub
            - *c_get_req_survey
            - *c_submit_req_title
            - *c_review_req_title
            - *c_submit_req_sub
            - *c_review_req_sub
            - *c_submit_req_survey
            - *c_review_req_survey
            - *c_clk_1215
            - *c_close_a
            - *c_visit_a1
          trigger:
            - call: "POST /monitoring-visits"
              payload: { easement_id: "${ease_a_id}", window_start: "2027-06-08T00:00:00Z", window_end: "2027-06-15T00:00:00Z" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
              captures: { visit_adj_id: $.data.id }
            - call: "POST /monitoring-visits"
              payload: { easement_id: "${ease_a_id}", window_start: "2027-06-07T00:00:00Z", window_end: "2027-06-14T00:00:00Z" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
            - call: "POST /monitoring-visits/${visit_a1_id}/cancellation"
              payload: { reason: "monitor reassigned to a flood-damaged easement" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
            - call: "POST /monitoring-visits/${visit_adj_id}/cancellation"
              payload: { reason: "consolidating both windows into one visit" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
            - call: "POST /monitoring-visits"
              payload: { easement_id: "${ease_a_id}", window_start: "2027-06-07T00:00:00Z", window_end: "2027-06-14T00:00:00Z" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
              captures: { visit_replacement_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 201 because 2027-06-08 is not strictly less than V1's window_end 2027-06-08"
            - "MonitoringVisit.${visit_adj_id}.status == SCHEDULED and window_start == 2027-06-08T00:00:00Z"
            - "the second trigger call returns HTTP 409 with error_id ERR_MONITORING_WINDOW_OVERLAP"
            - "GET /easements/${ease_a_id}/monitoring-visits returns total_count == 2 immediately after the refusal"
            - "MonitoringVisit.${visit_a1_id}.status == CANCELLED with cancellation_reason == monitor reassigned to a flood-damaged easement"
            - "MonitoringVisit.${visit_adj_id}.status == CANCELLED"
            - "the fifth trigger call returns HTTP 201 with MonitoringVisit.${visit_replacement_id}.window_start == 2027-06-07T00:00:00Z and window_end == 2027-06-14T00:00:00Z"
            - "GET /easements/${ease_a_id}/monitoring-visits?status=SCHEDULED returns total_count == 1 containing only ${visit_replacement_id}"
            - "Easement.${ease_a_id}.next_monitoring_due_on == 2027-12-15T00:00:00Z and last_monitored_on is null (scheduling and cancelling never move the due date)"

      - name: appraisal_engagements_are_closed_intervals_widened_by_a_three_day_buffer
        grounds:
          - validations[priority=19]
          - entities.PreservationProgram.fields.appraisal_engagement_buffer_days
          - entities.Appraisal.fields.engagement_start
          - entities.Appraisal.fields.engagement_end
          - state_machines.Appraisal.SUBMITTED_to_REJECTED
          - endpoints[POST /applications/{id}/appraisals]
          - errors.ERR_APPRAISAL_ENGAGEMENT_CONFLICT
        distinguishing_aspect: |
          The complementary geometry to the monitoring instance: a CLOSED interval widened
          symmetrically by appraisal_engagement_buffer_days == 3. Against an ASSIGNED
          engagement of 2026-08-12 .. 2026-08-26 the buffered end is 2026-08-29, so a new
          engagement starting 2026-08-29 conflicts (<=, not <) while one starting 2026-08-30
          does not — the opposite inclusivity from the half-open visit windows on the same
          scaffold. Occupancy is state-scoped to {ASSIGNED, SUBMITTED, CERTIFIED}, so once the
          second engagement is REJECTED its interval is released and an identical engagement
          is accepted.
        test_recipe:
          setup:
            - "Program P1 has appraisal_engagement_buffer_days == 3."
            - "Application AP1 was filed at clock 2026-08-10 and carries one ASSIGNED Appraisal AR1 engaged by officer-1 to appraiser-1 over 2026-08-12 .. 2026-08-26."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
          trigger:
            - call: "POST /applications/${app_a_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-2", appraiser_firm: "Conestoga Valuation", engagement_start: "2026-08-29T00:00:00Z", engagement_end: "2026-09-12T00:00:00Z", method: "INCOME_CAPITALIZATION" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "POST /applications/${app_a_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-2", appraiser_firm: "Conestoga Valuation", engagement_start: "2026-08-30T00:00:00Z", engagement_end: "2026-09-13T00:00:00Z", method: "INCOME_CAPITALIZATION" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
              captures: { appr_a2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /appraisals/${appr_a2_id}/submission"
              payload: { unrestricted_value_cents: 250000000, restricted_value_cents: 130000000 }
              as: Appraiser
              as_user_id: "appraiser-2"
            - call: "POST /appraisals/${appr_a2_id}/review"
              payload: { decision: "REJECT", review_note: "income capitalization inputs unsupported for this market" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /applications/${app_a_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-2", appraiser_firm: "Conestoga Valuation", engagement_start: "2026-08-30T00:00:00Z", engagement_end: "2026-09-13T00:00:00Z", method: "PAIRED_SALES" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
              captures: { appr_a3_id: $.data.id }
          assert:
            - "PreservationProgram.${prog_id}.appraisal_engagement_buffer_days == 3"
            - "the first trigger call returns HTTP 409 with error_id ERR_APPRAISAL_ENGAGEMENT_CONFLICT because 2026-08-29 <= 2026-08-26 + 3 days"
            - "the second trigger call returns HTTP 201 because 2026-08-30 > 2026-08-29"
            - "Appraisal.${appr_a2_id}.status == ASSIGNED, engaged_by_user_id == officer-1, appraiser_user_id == appraiser-2"
            - "Appraisal.${appr_a2_id}.status == SUBMITTED with easement_value_cents == 120000000 and submission_count == 1 after the fourth trigger call"
            - "Appraisal.${appr_a2_id}.status == REJECTED with review_note == income capitalization inputs unsupported for this market after the fifth trigger call"
            - "the sixth trigger call returns HTTP 201 with Appraisal.${appr_a3_id}.engagement_start == 2026-08-30T00:00:00Z and engagement_end == 2026-09-13T00:00:00Z"
            - "Appraisal.${appr_a_id}.status == ASSIGNED throughout, so AR1 never stopped occupying its own buffered interval"
            - "GET /applications/${app_a_id}/appraisals returns total_count == 3"
            - "Application.${app_a_id}.certified_easement_value_cents is null (no appraisal has been certified)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: closing_cancellation_restores_every_source_ledger_including_the_absorbed_remainder
        grounds:
          - concurrency_rules.funding-plan-supersede-stale-application
          - state_machines.Application.closing_status.PENDING_REQUIREMENTS_to_CANCELLED
          - state_machines.FundingCommitment.OBLIGATED_to_RELEASED
          - state_machines.FundingSource.FULLY_OBLIGATED_to_ACTIVE
          - entities.FundingSource.fields.committed_cents
          - entities.FundingSource.fields.available_cents
          - entities.FundingCommitment.fields.absorbed_remainder_cents
          - endpoints[POST /applications/{id}/closing-cancellation]
          - validations[priority=29]
        distinguishing_aspect: |
          The money invariant is authorized_cents == available_cents + committed_cents on every
          source, with committed_cents == the sum of that source's OBLIGATED plus DISBURSED
          commitments. Acceptance drives all three sources off their initial values, including
          the FEDERAL source whose commitment carries the extra 1 cent of floor remainder that
          exceeds its own max_share_pct. Cancelling the closing must reverse the ledger EXACTLY
          — every source back to committed 0, reserved 0, available == authorized — so the
          absorbed remainder cannot leak. An implementation that reverses using the recomputed
          per-source cap rather than the stored commitment amount leaves the FEDERAL source one
          cent short at 199,999,999 available, which still satisfies a naive "did it decrease"
          check.
        test_recipe:
          setup:
            - "Program P1 with the three sources at authorized 60,000,000 / 120,000,000 / 200,000,000, all ACTIVE with committed_cents 0, reserved_cents 0, available_cents == authorized_cents."
            - "Application AP1 is offered BARGAIN_SALE at 175,550,000 with total_program_cost_cents 160,364,925 and its funding plan is assembled at clock 2026-10-05 (three RESERVED commitments 56,127,723 / 64,145,970 / 40,091,232)."
            - "At clock 2026-10-12 the landowner accepts, so all three commitments become OBLIGATED, funding_plan_status becomes OBLIGATED, closing_status becomes PENDING_REQUIREMENTS and three ClosingRequirement rows are created."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - *c_get_app_a_v1
            - *c_offer_a
            - *c_get_app_a_v2
            - *c_plan_a
            - *c_clk_1012
            - *c_accept_a
            - *c_get_req_title
            - *c_get_req_sub
            - *c_get_req_survey
          trigger:
            - call: "POST /applications/${app_a_id}/closing-cancellation"
              payload: { reason: "title defect discovered outside the commitment schedule" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "before the trigger: FundingSource.${src_local_id}.committed_cents == 56127723 and available_cents == 3872277"
            - "before the trigger: FundingSource.${src_state_id}.committed_cents == 64145970 and available_cents == 55854030"
            - "before the trigger: FundingSource.${src_fed_id}.committed_cents == 40091232 and available_cents == 159908768"
            - "before the trigger: Application.${app_a_id}.status == ACCEPTED, funding_plan_status == OBLIGATED, closing_status == PENDING_REQUIREMENTS"
            - "after the trigger: FundingSource.${src_local_id}.committed_cents == 0, reserved_cents == 0, available_cents == 60000000"
            - "after the trigger: FundingSource.${src_state_id}.committed_cents == 0, reserved_cents == 0, available_cents == 120000000"
            - "after the trigger: FundingSource.${src_fed_id}.committed_cents == 0, reserved_cents == 0, available_cents == 200000000"
            - "after the trigger: FundingSource.${src_fed_id}.available_cents != 199999999, so the 1-cent absorbed remainder was returned rather than dropped"
            - "after the trigger: every source satisfies authorized_cents == available_cents + committed_cents"
            - "after the trigger: GET /funding-commitments?application_id=${app_a_id} returns total_count == 3 and every row has status RELEASED with lapse_reason CLOSING_CANCELLED"
            - "after the trigger: Application.${app_a_id}.closing_status == CANCELLED, status == WITHDRAWN, withdrawal_reason == CLOSING_CANCELLED, funding_plan_status == RELEASED"
            - "after the trigger: ClosingRequirement.${req_title_id}.status == WAIVED with waiver_reason == CLOSING_CANCELLED, and the same holds for ${req_sub_id} and ${req_survey_id}"
            - "after the trigger: Parcel.${parcel_a_id}.status == ELIGIBLE"
            - "after the trigger: FundingSource.${src_local_id}.disbursed_cents == 0 and FundingSource.${src_local_id}.status == ACTIVE"

      - name: amendment_rescission_restores_the_residential_rights_conservation_pair
        grounds:
          - state_machines.Amendment.APPROVED_to_RESCINDED
          - state_machines.Easement.AMENDED_to_RECORDED
          - entities.Easement.fields.residential_rights_retained
          - entities.Easement.fields.residential_rights_extinguished
          - entities.Amendment.fields.applied_rights_delta
          - entities.Parcel.fields.baseline_dwelling_rights
          - validations[priority=23]
          - endpoints[POST /amendments/{id}/rescission]
        distinguishing_aspect: |
          A NON-MONETARY conservation invariant on a different aggregate than the funding
          instance: residential_rights_retained + residential_rights_extinguished must equal
          Parcel.baseline_dwelling_rights == 4 at every observable moment. Approving a
          RESIDENTIAL_RIGHT_RELOCATION with residential_rights_delta -1 moves the pair 2/2 ->
          1/3 and flips Easement.status RECORDED -> AMENDED; rescinding must restore exactly
          2/2, zero applied_rights_delta, drop amendment_count back to 0 and return the status
          to RECORDED. Reversing by recomputing from the parcel baseline instead of from the
          stored applied_rights_delta cannot be distinguished here, but reversing with the
          wrong SIGN yields 3/1, which still sums to 4 and so passes the invariant while being
          wrong — hence the pair is asserted field by field, not just as a sum.
        test_recipe:
          setup:
            - "Easement EA1 exists from the 2026-12-15 closing of AP1 on Parcel PA1 (baseline_dwelling_rights 4), recorded with residential_rights_retained 2 and residential_rights_extinguished 2, status RECORDED, compliance_status COMPLIANT, amendment_count 0."
            - "At clock 2027-01-10 a RESIDENTIAL_RIGHT_RELOCATION amendment AM3 with residential_rights_delta -1 and net_conservation_benefit_cents 250,000 is created, submitted and APPROVED, so the pair becomes 1/3, Amendment.applied_rights_delta == -1, Easement.status == AMENDED and amendment_count == 1."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - *c_get_app_a_v1
            - *c_offer_a
            - *c_get_app_a_v2
            - *c_plan_a
            - *c_clk_1012
            - *c_accept_a
            - *c_get_req_title
            - *c_get_req_sub
            - *c_get_req_survey
            - *c_submit_req_title
            - *c_review_req_title
            - *c_submit_req_sub
            - *c_review_req_sub
            - *c_submit_req_survey
            - *c_review_req_survey
            - *c_clk_1215
            - *c_close_a
            - *c_clk_270110
            - *c_get_ease_a_v1
            - call: "POST /easements/${ease_a_id}/amendments"
              payload: { expected_easement_version: "${ease_a_v1}", amendment_type: "RESIDENTIAL_RIGHT_RELOCATION", net_conservation_benefit_cents: 250000, residential_rights_delta: -1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { amend_rights_id: $.data.id }
            - call: "POST /amendments/${amend_rights_id}/submission"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /amendments/${amend_rights_id}/decision"
              payload: { decision: "APPROVE", reason: "dwelling envelope relocated off prime soils" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /amendments/${amend_rights_id}/rescission"
              payload: { reason: "relocation deed never executed by the landowner" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "before the trigger: Easement.${ease_a_id}.residential_rights_retained == 1 and residential_rights_extinguished == 3"
            - "before the trigger: Amendment.${amend_rights_id}.status == APPROVED and applied_rights_delta == -1"
            - "before the trigger: Easement.${ease_a_id}.status == AMENDED and amendment_count == 1"
            - "after the trigger: Easement.${ease_a_id}.residential_rights_retained == 2"
            - "after the trigger: Easement.${ease_a_id}.residential_rights_extinguished == 2"
            - "after the trigger: residential_rights_retained + residential_rights_extinguished == 4 == Parcel.${parcel_a_id}.baseline_dwelling_rights"
            - "after the trigger: the pair is 2/2 and not 3/1, so the reversal used the stored applied_rights_delta with the correct sign"
            - "after the trigger: Amendment.${amend_rights_id}.status == RESCINDED with rescission_reason == relocation deed never executed by the landowner"
            - "after the trigger: Amendment.${amend_rights_id}.applied_rights_delta == 0 and applied_impervious_sqft is null"
            - "after the trigger: Easement.${ease_a_id}.amendment_count == 0 and status == RECORDED"
            - "after the trigger: Easement.${ease_a_id}.impervious_allowance_sqft == 139392 (unchanged by a rights-only amendment)"
            - "after the trigger: Easement.${ease_a_id}.compliance_status == COMPLIANT and stewardship_status == MONITORING_CURRENT"
