            - "${closed_status} == CLOSED_UNSUBSTANTIATED, ${closed_remedy} == APOLOGY_ONLY, ${closed_amount} == null and ${closed_version} == 2  # expected_complaint_version 1 is still current because both refusals bumped nothing"
