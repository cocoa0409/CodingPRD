            - { call: "PUT /households/${h1}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h1}", full_name: "O1", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
