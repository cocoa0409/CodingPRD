          ConsentReview is a branching fork-join machine on the ConsentReview entity: PENDING forks to
          GRANTED_WITH_CONDITIONS, the join back to consent grant requires ALL child ConsentConditions ACCEPTED,
          and any REJECTED child arms a GRANTED_WITH_CONDITIONS -> RESCINDED revert — fork-join plus revert on the
          review entity, exercised here through the rescind branch.
