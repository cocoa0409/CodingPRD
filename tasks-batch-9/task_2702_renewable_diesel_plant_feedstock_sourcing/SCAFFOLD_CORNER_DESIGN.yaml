        excluded_because:
          difficulty_instance: lcfs_credit_provisional_vs_verified_at_identical_ci
          rationale: "That §1.8 instance holds the CI constant and shows the PROVISIONAL and VERIFIED variants of the LCFS credit quantity diverging solely through VERIFICATION_DISCOUNT, asserting both values and their difference on one credit block."

