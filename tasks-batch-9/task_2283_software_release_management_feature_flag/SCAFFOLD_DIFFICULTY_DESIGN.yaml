# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine rule_ids x 2 instances = 18 instances. Every numeric assert below was
# computed by executing the §1.3 formulas with their declared constants.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: change_risk_score_preliminary_vs_final_diverge_on_dependency_depth
        grounds:
          - calculations.change_risk_score
          - entities.ChangeRequest.fields.risk_score_preliminary
          - entities.ChangeRequest.fields.risk_score_final
          - entities.ChangeRequest.fields.dependency_depth
          - state_machines.ChangeRequest.RISK_CLASSIFIED_to_APPROVED
        distinguishing_aspect: |
          The preliminary variant pins DEPTH_INPUT = 0 at submit while the final variant reads
          ChangeRequest.dependency_depth at the approval join, so a ChangeDependency added between
          submit and approval makes risk_score_preliminary == 62 and risk_score_final == 67 coexist
          on the same ChangeRequest row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (before the release's freeze_at 2026-08-08T00:00:00Z)."
            - "Train core-train: code_freeze_lead_hours 48, stabilization_hours 72, risk_budget_points 120."
            - "Release 2026.08.1 with cut_at 2026-08-10T00:00:00Z, phase OPEN."
            - "ChangeRequest CR_A: lines_changed 250, touched_subsystem_count 3, has_schema_migration true, declared_blast_radius SINGLE_TENANT, no rollback plan, no flag link."
            - "ChangeRequest CR_B: lines_changed 40, touched_subsystem_count 1, declared_blast_radius INTERNAL (scores LOW and auto-approves at submit)."
            - "CR_A is submitted FIRST (preliminary pinned with depth 0), and only afterwards declared dependent on CR_B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Shard the write path", summary_internal: "Split primary writes across two shards", lines_changed: 250, touched_subsystem_count: 3, declared_blast_radius: "SINGLE_TENANT", has_schema_migration: true }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_a: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Raise default page size", summary_internal: "Config-only default bump", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_b: $.data.id }
            - call: "POST /change-requests/${cr_a}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { prelim_a: $.data.risk_score_preliminary }
            - call: "POST /change-requests/${cr_b}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_a}/dependencies"
              payload: { to_change_id: "${cr_b}", note: "needs the new page-size default first" }
              as: Engineer
              as_user_id: "u-eng-1"
          trigger:
            - call: "POST /change-requests/${cr_a}/approvals"
              payload: { kind: "TECHNICAL", decision: "APPROVE" }
              as: ChangeApprover
              as_user_id: "u-appr-1"
            - call: "POST /change-requests/${cr_a}/approvals"
              payload: { kind: "COMPLIANCE", decision: "APPROVE", comment: "regulated subsystem reviewed" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { final_a: $.data.pinned_risk_score }
          assert:
            - "ChangeRequest.${cr_a}.risk_score_preliminary == 62"
            - "ChangeRequest.${cr_a}.risk_score_final == 67"
            - "ChangeRequest.${cr_a}.risk_score_final - ChangeRequest.${cr_a}.risk_score_preliminary == 5"
            - "ChangeRequest.${cr_a}.dependency_depth == 1"
            - "ChangeRequest.${cr_a}.risk_class == HIGH"
            - "ChangeRequest.${cr_a}.state == APPROVED"
            - "Approval.pinned_risk_score for both CR_A approvals == 62 (the preliminary value, not 67)"
            - "Release.${rel_id}.risk_budget_consumed_points == 76"
            - "Release.${rel_id}.committed_change_count == 2"

      - name: release_readiness_projected_vs_attested_diverge_on_deferred_change
        grounds:
          - calculations.release_readiness_score
          - entities.Release.fields.readiness_score_projected
          - entities.Release.fields.readiness_score_attested
          - state_machines.Release.OPEN_to_CUT
          - state_machines.ChangeRequest.RISK_CLASSIFIED_to_DEFERRED
        distinguishing_aspect: |
          The projected variant treats a still-live RISK_CLASSIFIED change as certain to land and
          charges nothing, while the attested variant charges NOT_LANDED_BY_FREEZE_PENALTY 6 for the
          same change once the cut auto-defers it, so readiness_score_projected == 100 and
          readiness_score_attested == 94 coexist on the same Release row.
        test_recipe:
          setup:
            - "Train core-train (code_freeze_lead_hours 48), Release 2026.08.1 cut_at 2026-08-10T00:00:00Z => freeze_at 2026-08-08T00:00:00Z."
            - "CR_L (LOW, score 9) merged at clock 2026-08-01T00:00:00Z, i.e. strictly before freeze_at."
            - "CR_M (MEDIUM, score 33) submitted and left in RISK_CLASSIFIED with no approvals."
            - "Clock advanced to exactly freeze_at 2026-08-08T00:00:00Z so the cut precondition holds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Copy tweak", summary_internal: "Trivial copy change", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_l: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Retry policy rewrite", summary_internal: "New backoff policy across two subsystems", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_m: $.data.id }
            - call: "POST /change-requests/${cr_l}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_m}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_l}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "GET /releases/${rel_id}"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { proj_before_cut: $.data.readiness_score_projected }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { attested: $.data.readiness_score_attested, projected_after: $.data.readiness_score_projected }
          assert:
            - "readiness_score_projected captured before the cut == 100"
            - "Release.${rel_id}.readiness_score_attested == 94"
            - "Release.${rel_id}.readiness_score_projected == 100"
            - "Release.${rel_id}.readiness_score_projected != Release.${rel_id}.readiness_score_attested"
            - "ChangeRequest.${cr_m}.state == DEFERRED"
            - "ChangeRequest.${cr_l}.state == MERGED"
            - "Release.${rel_id}.phase == CUT"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: canary_error_rate_per_signal_rounding_then_request_weighted_mean
        grounds:
          - calculations.canary_health_verdict
          - entities.CanaryEvaluation.fields.error_rate_pct_rounded
          - entities.CanaryEvaluation.fields.weighted_health_score
          - entities.HealthSignal.fields.cohort
          - state_machines.Deployment.IN_PROGRESS_to_CANARY_SOAK
        distinguishing_aspect: |
          Rounding order is load-bearing: per-signal error rates are rounded to 1 decimal FIRST
          (16.7 and 33.3) and only then request-weighted, giving error_rate_pct_rounded == 22.23,
          whereas pooling raw counts (2/9) and rounding once yields 22.22 — and the BASELINE row plus
          the row at the exclusive window bound must not enter any term.
        test_recipe:
          setup:
            - "Environment prod-us: tier PROD, deploy window hours 2..6 UTC, cooldown_minutes 30, requires_compliance_evidence false."
            - "Release 2026.08.1 cut at clock 2026-08-08T00:00:00Z."
            - "Deployment: strategy CANARY, canary_pct 10, abort_error_rate_pct 25.0, abort_latency_p95_ms 800, min_sample_count 5, window 2026-08-10T02:00Z..04:00Z, started at 02:05Z."
            - "HealthSignals: CANARY 02:10Z (6 requests, 1 error, p95 300), CANARY 02:20Z (3 requests, 1 error, p95 420), BASELINE 02:15Z (100 requests, 0 errors, p95 100), CANARY 02:30Z (10 requests, 10 errors, p95 900)."
            - "Evaluation window is half-open [02:00Z, 02:30Z), so the 02:30Z canary row is excluded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 30, requires_compliance_evidence: false }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T04:00:00Z", strategy: "CANARY", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800, canary_pct: 10, min_sample_count: 5 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { dep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:05:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /deployments/${dep_id}/start"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /deployments/${dep_id}/health-signals"
              payload: { observed_at: "2026-08-10T02:10:00Z", cohort: "CANARY", request_count: 6, error_count: 1, latency_p95_ms: 300 }
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /deployments/${dep_id}/health-signals"
              payload: { observed_at: "2026-08-10T02:15:00Z", cohort: "BASELINE", request_count: 100, error_count: 0, latency_p95_ms: 100 }
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /deployments/${dep_id}/health-signals"
              payload: { observed_at: "2026-08-10T02:20:00Z", cohort: "CANARY", request_count: 3, error_count: 1, latency_p95_ms: 420 }
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /deployments/${dep_id}/health-signals"
              payload: { observed_at: "2026-08-10T02:30:00Z", cohort: "CANARY", request_count: 10, error_count: 10, latency_p95_ms: 900 }
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:31:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /deployments/${dep_id}/canary-evaluations"
              payload: { window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T02:30:00Z" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { eval_rate: $.data.error_rate_pct_rounded, eval_score: $.data.weighted_health_score }
          assert:
            - "CanaryEvaluation.sample_count == 9"
            - "CanaryEvaluation.error_rate_pct_rounded == 22.23"
            - "CanaryEvaluation.error_rate_pct_rounded != 22.22"
            - "CanaryEvaluation.latency_p95_ms == 420"
            - "CanaryEvaluation.weighted_health_score == 59.59"
            - "CanaryEvaluation.verdict == PASS"
            - "CanaryEvaluation.abort_triggered == false"
            - "Deployment.${dep_id}.verification_state == PASSING"
            - "Deployment.${dep_id}.health_score == 59.59"
            - "Deployment.${dep_id}.delivery_state == CANARY_SOAK"

      - name: evidence_completeness_waiver_cap_tier_selected_from_base_index
        grounds:
          - calculations.evidence_completeness_index
          - entities.ComplianceEvidencePacket.fields.base_index
          - entities.ComplianceEvidencePacket.fields.waiver_credit_points
          - entities.ComplianceEvidencePacket.fields.completeness_index
          - validations[priority=16]
          - concurrency_rules[evidence-packet-create-stale-release]
        distinguishing_aspect: |
          The cap tier is selected once from base_index == 75 (cap 10) and never re-selected from the
          post-credit index, so two waivers worth a raw 12.50 credit clamp to 10 and produce
          completeness_index == 85.0 rather than the re-tiered 87.5, and the packet consequently
          fails the SEAL_FLOOR 90 gate.
        test_recipe:
          setup:
            - "Release 2026.08.1 on core-train (freeze_at 2026-08-08T00:00:00Z) with one LOW change CR_L merged at 2026-08-01T00:00:00Z."
            - "No PROD deployment exists and no CUSTOMER release notes are published, so canary_pass (15) and release_notes (10) are the only unsatisfied items."
            - "Satisfied items: approvals_complete 25 (LOW needs none), rollback_plans 20 (no HIGH/CRITICAL merged), freeze_discipline 15, flag_hygiene 15 => base_index 75."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Tighten log redaction", summary_internal: "Small redaction fix", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_l: $.data.id }
            - call: "POST /change-requests/${cr_l}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_l}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "GET /releases/${rel_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { rel_v: $.data.version }
          trigger:
            - call: "POST /releases/${rel_id}/evidence-packets"
              payload: { expected_release_version: "${rel_v}" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pkt_id: $.data.id, pkt_base: $.data.base_index }
            - call: "POST /evidence-packets/${pkt_id}/waivers"
              payload: { item_code: "canary_pass", justification: "no PROD canary fleet for this hotfix train" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { credit_after_first: $.data.waiver_credit_points, index_after_first: $.data.completeness_index }
            - call: "POST /evidence-packets/${pkt_id}/waivers"
              payload: { item_code: "release_notes", justification: "internal-only release, notes deferred" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { credit_after_second: $.data.waiver_credit_points, index_after_second: $.data.completeness_index }
            - call: "POST /evidence-packets/${pkt_id}/seal"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { seal_error: $.data.error_id }
          assert:
            - "ComplianceEvidencePacket.${pkt_id}.base_index == 75"
            - "ComplianceEvidencePacket.${pkt_id}.waiver_credit_points after the first waiver == 7.5"
            - "ComplianceEvidencePacket.${pkt_id}.completeness_index after the first waiver == 82.5"
            - "ComplianceEvidencePacket.${pkt_id}.waiver_credit_points after the second waiver == 10"
            - "ComplianceEvidencePacket.${pkt_id}.completeness_index after the second waiver == 85.0"
            - "ComplianceEvidencePacket.${pkt_id}.completeness_index != 87.5"
            - "ComplianceEvidencePacket.${pkt_id}.waiver_count == 2"
            - "ComplianceEvidencePacket.${pkt_id}.missing_items == []"
            - "The seal call returns HTTP 422 with error_id ERR_EVIDENCE_INCOMPLETE"
            - "ComplianceEvidencePacket.${pkt_id}.state == DRAFT"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: feature_flag_pause_resume_cycle_returns_to_active_rolling_out_twice
        grounds:
          - state_machines.FeatureFlag.ACTIVE_ROLLING_OUT_to_PAUSED
          - state_machines.FeatureFlag.PAUSED_to_ACTIVE_ROLLING_OUT
          - entities.FeatureFlag.fields.kill_switch_engaged
          - concurrency_rules[rollout-step-create-stale-flag]
        distinguishing_aspect: |
          Cyclic shape: FeatureFlag traverses ACTIVE_ROLLING_OUT -> PAUSED -> ACTIVE_ROLLING_OUT twice
          and ends in a state it already occupied, with current_exposure_pct pinned at 0 and the
          SOAKING step untouched, proving the cycle carries no exposure side effect.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "FeatureFlag checkout-v2 owned by u-eng-1, expires_at 2026-12-01T00:00:00Z, cleanup_state COMPLIANT, no change links."
            - "One rollout step at target_pct 5 / soak_minutes 30 moved to SOAKING, which lifted the flag DRAFT -> ACTIVE_ROLLING_OUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: $.data.id, flag_v0: $.data.version }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step1_id: $.data.id }
            - call: "POST /flag-rollout-steps/${step1_id}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
          trigger:
            - call: "POST /feature-flags/${flag_id}/pause"
              payload: { reason: "latency regression suspected" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { state_after_pause_1: $.data.state }
            - call: "POST /feature-flags/${flag_id}/resume"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { state_after_resume_1: $.data.state }
            - call: "POST /feature-flags/${flag_id}/pause"
              payload: { reason: "second regression during incident triage" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { state_after_pause_2: $.data.state }
            - call: "POST /feature-flags/${flag_id}/resume"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { state_after_resume_2: $.data.state }
          assert:
            - "FeatureFlag.${flag_id}.state after the first pause == PAUSED"
            - "FeatureFlag.${flag_id}.state after the first resume == ACTIVE_ROLLING_OUT"
            - "FeatureFlag.${flag_id}.state after the second pause == PAUSED"
            - "FeatureFlag.${flag_id}.state after the second resume == ACTIVE_ROLLING_OUT"
            - "FeatureFlag.${flag_id}.kill_switch_engaged == false"
            - "FeatureFlag.${flag_id}.current_exposure_pct == 0"
            - "FeatureFlag.${flag_id}.applied_step_count == 0"
            - "FlagRolloutStep.${step1_id}.state == SOAKING"

      - name: change_request_risk_fork_critical_to_cab_review_versus_low_auto_approve
        grounds:
          - state_machines.ChangeRequest.DRAFT_to_RISK_CLASSIFIED
          - state_machines.ChangeRequest.RISK_CLASSIFIED_to_CAB_REVIEW
          - state_machines.ChangeRequest.RISK_CLASSIFIED_to_APPROVED
          - state_machines.ChangeRequest.CAB_REVIEW_to_APPROVED
          - calculations.change_risk_score
        distinguishing_aspect: |
          Branching fork-join shape: one identical POST /submit call lands a CRITICAL change (score 85)
          in CAB_REVIEW and a LOW change (score 9) directly in APPROVED with zero Approval rows, and
          the CRITICAL branch then requires a three-lane join (TECHNICAL + COMPLIANCE + CAB by three
          distinct user ids) before it reaches the same APPROVED state.
        test_recipe:
          setup:
            - "Train core-train (risk_budget_points 120), Release 2026.08.1 phase OPEN, clock 2026-08-01T00:00:00Z."
            - "CR_CRIT: lines_changed 700, touched_subsystem_count 6, has_schema_migration true, declared_blast_radius GLOBAL, rollback_plan present and rollback_tested true => 95 raw - 10 credit = 85 CRITICAL."
            - "CR_LOW: lines_changed 40, touched_subsystem_count 1, declared_blast_radius INTERNAL => 9 LOW."
