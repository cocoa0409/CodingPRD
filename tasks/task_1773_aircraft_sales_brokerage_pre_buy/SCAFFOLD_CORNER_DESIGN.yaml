            - "trigger[1] response data.status == FORFEITED and data.forfeited_usd == 100000.00"
            - "trigger[1] response data.refunded_usd == 0 and data.released_usd == 0; released+refunded+forfeited == deposit_amount_usd == 100000.00"
            - "GET /api/listings/${lst_id}: status == ACTIVE"
