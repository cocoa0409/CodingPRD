  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_grant_report_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-amend-stale-affiliate]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The second concurrency rule's write endpoint: after one report create bumps Affiliate.version, a second create carrying the pre-bump expected_affiliate_version is 412 ERR_STALE_VERSION — deterministic over two sequential requests."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate at version 1 (captured at creation)."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - call: "POST /family-planning/affiliates/${c_aff_id}/grant-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", valuation_variant: "FIFO", expected_affiliate_version: "${c_aff_v}" }
              as: GrantAdministrator
              captures: { c_repo1: $.data.id }
          trigger:
            - call: "POST /family-planning/affiliates/${c_aff_id}/grant-reports"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", valuation_variant: "FIFO", expected_affiliate_version: "${c_aff_v}" }
              as: GrantAdministrator
              captures: { err_id: $.data.error_id }
            - call: "GET /family-planning/affiliates/${c_aff_id}"
              payload: {}
              as: GrantAdministrator
              captures: { c_aff_v6: $.data.version }
            - call: "POST /family-planning/affiliates/${c_aff_id}/grant-reports"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", valuation_variant: "FIFO", expected_affiliate_version: "${c_aff_v6}" }
              as: GrantAdministrator
              captures: { c_repo2: $.data.id }
          assert:
            - "stale expected_affiliate_version: status 412 and error_id == ERR_STALE_VERSION"
            - "retry with re-read version succeeds: GrantReport.${c_repo2}.status == DRAFT"
            - "GET /family-planning/affiliates/${c_aff_id}/grant-reports returns 2 rows"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Affiliate
          - entities.Patient
        distinguishing_aspect: "common_fields contract: each successful mutation increments version by exactly 1 and refreshes updated_at; reads never increment. Affiliate goes 1 -> 2 on suspend -> 3 on reinstate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate at version 1."
