      - name: winback_requires_plan_active_not_retired
        grounds:
          - state_machines.Subscription.CANCELLED_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_PLAN_RETIRED]
          - entities.SubscriptionPlan.fields.status
        distinguishing_aspect: |
          Subscription win-back depends on the referenced SubscriptionPlan's state: if the plan was
          RETIRED after cancellation, win-back is rejected with ERR_PLAN_RETIRED. Entity pair:
          Subscription -> SubscriptionPlan — a different pair than Allocation -> ShippingWave.
        test_recipe:
          setup:
            - "Subscriber S cancelled (inside window), then the plan is retired."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "CE2", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
