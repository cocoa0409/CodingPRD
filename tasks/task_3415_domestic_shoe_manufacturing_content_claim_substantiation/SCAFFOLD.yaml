errors:
- id: ERR_MISSING_USER_CONTEXT
  http: 400
  condition: X-User-ID or X-User-Role header missing, or X-User-Role not a declared role
- id: ERR_FORBIDDEN_ROLE
  http: 403
  condition: Role not listed for the endpoint
- id: ERR_FACTORY_OWNERSHIP_MISMATCH
  http: 403
  condition: FactoryManager attempted hold/resume on a run whose factory_id != X-User-ID
- id: ERR_BUYER_REF_MISMATCH
  http: 403
  condition: CustomProgramCustomer created/cancelled an order whose buyer_ref != X-User-ID
- id: ERR_SELF_ATTESTATION_FORBIDDEN
  http: 403
  condition: Evidence uploader (uploaded_by == X-User-ID) attempted to verify or reject the same document
- id: ERR_FACTORY_NOT_FOUND
  http: 404
  condition: factory id does not resolve
- id: ERR_MODEL_NOT_FOUND
  http: 404
  condition: model id does not resolve
- id: ERR_COMPONENT_NOT_FOUND
  http: 404
  condition: component id does not resolve (path, body, or bom_lines entry)
- id: ERR_LOT_NOT_FOUND
  http: 404
  condition: material lot id does not resolve
- id: ERR_RUN_NOT_FOUND
  http: 404
  condition: production run id does not resolve
- id: ERR_REPORT_NOT_FOUND
  http: 404
  condition: content report id does not resolve
- id: ERR_ORDER_NOT_FOUND
  http: 404
  condition: custom order id does not resolve
- id: ERR_CLAIM_NOT_FOUND
  http: 404
  condition: label claim id does not resolve
- id: ERR_DOC_NOT_FOUND
  http: 404
  condition: evidence document id does not resolve
- id: ERR_WORKER_NOT_FOUND
  http: 404
  condition: worker id does not resolve
- id: ERR_ENROLLMENT_NOT_FOUND
  http: 404
  condition: training enrollment id does not resolve
- id: ERR_ALLOCATION_NOT_FOUND
  http: 404
  condition: capacity allocation id does not resolve, or no allocation exists for (factory_id, iso_week) at reserve time
- id: ERR_CONTRACT_NOT_FOUND
  http: 404
  condition: government contract id does not resolve
- id: ERR_CERTIFICATION_NOT_FOUND
  http: 404
  condition: worker holds no certification entry for the operation in the path
- id: ERR_INVALID_REQUEST
  http: 400
  condition: missing required field, invalid enum, or violated numeric/date range (incl. end_day <= start_day, valid_until <= valid_from, fulfillment_end <= fulfillment_start, score outside 0..100)
- id: ERR_DOC_LINK_AMBIGUOUS
  http: 400
  condition: evidence document has zero or more than one of claim_id / material_lot_id / production_run_id set
- id: ERR_CLOCK_REGRESSION
  http: 400
  condition: clock set to a timestamp earlier than the current logical clock
- id: ERR_INVALID_STATE
  http: 409
  condition: target resource not in a state that allows the requested transition (generic state error)
- id: ERR_FACTORY_NOT_ACTIVE
  http: 409
  condition: run reserve/start/resume or contract start while run's/contract's factory is SUSPENDED
- id: ERR_MODEL_NOT_ACTIVE
  http: 409
  condition: operation requires an ACTIVE model (run reserve, order accept, claim publish, contract start) but model is DISCONTINUED
- id: ERR_REPORT_NOT_CERTIFIED
  http: 409
  condition: substantiate given a PROVISIONAL report
- id: ERR_REPORT_NOT_ACTIVE
  http: 409
  condition: substantiate given a SUPERSEDED report
- id: ERR_RUN_NOT_COMPLETED
  http: 409
  condition: CERTIFIED report creation or order fulfill while the run is not COMPLETED
- id: ERR_RUN_NOT_READY
  http: 409
  condition: order schedule while the run is not MATERIAL_RESERVED
- id: ERR_ALLOCATION_NOT_LOCKED
  http: 409
  condition: reserve or shift against an allocation that is not LOCKED
- id: ERR_WORKER_NOT_ACTIVE
  http: 409
  condition: training enrollment for a SUSPENDED worker
- id: ERR_CONTENT_THRESHOLD_NOT_MET
  http: 422
  condition: 'claim_threshold_check fails: report us_content_pct or final_assembly_domestic does not satisfy the claim_type minimum'
- id: ERR_BERRY_CONTENT_NOT_PROVEN
  http: 422
  condition: no ACTIVE CERTIFIED report with us_content_pct == 100.00 on a run of (contract.model_id, contract.factory_id) at start-fulfillment
- id: ERR_GOV_RUN_REQUIRES_CLEARED_DOMESTIC_FACTORY
  http: 422
  condition: GOVERNMENT run created on a factory that is not DOMESTIC or not government_cleared
- id: ERR_POLICY_FORBIDS_IMPORT
  http: 422
  condition: DOMESTIC_ONLY model run created on an OVERSEAS factory
- id: ERR_POLICY_FORBIDS_DOMESTIC
  http: 422
  condition: IMPORT_ONLY model run created on a DOMESTIC factory
- id: ERR_POLICY_NOT_DOMESTIC_ONLY
  http: 422
  condition: contract start-fulfillment with model.production_policy != DOMESTIC_ONLY
- id: ERR_FACTORY_NOT_CLEARED
  http: 422
  condition: contract start-fulfillment with factory not DOMESTIC or not government_cleared
- id: ERR_CUSTOM_REQUIRES_DOMESTIC
  http: 422
  condition: custom order created on an IMPORT_ONLY model, or scheduled onto a run at an OVERSEAS factory
- id: ERR_LINE_WINDOW_CONFLICT
  http: 409
  condition: half-open [start_day, end_day) of the reserving run intersects another active run on the same (factory, line_index); touching boundaries are allowed
- id: ERR_GOV_CONTRACT_WINDOW_CONFLICT
  http: 409
  condition: closed [fulfillment_start, fulfillment_end] of a new contract intersects (including touching endpoints) another AWARDED/IN_FULFILLMENT/COMPLIANCE_AUDIT contract at the same factory
- id: ERR_EVIDENCE_STALE
  http: 422
  condition: publish attempted when a required claim-attached document is no longer VERIFIED and unexpired
- id: ERR_MATERIAL_SHORTAGE
  http: 409
  condition: eligible lots cannot cover a BOM line's required units (non-DOMESTIC_REQUIRED line)
- id: ERR_DOMESTIC_MATERIAL_SHORTAGE
  http: 409
  condition: domestic lots cannot cover a DOMESTIC_REQUIRED BOM line
- id: ERR_WORKFORCE_SHORTFALL
  http: 422
  condition: 'start/resume workforce check fails: fewer ACTIVE CERTIFIED workers than REQUIRED_WORKERS_PER_RUN for some operation'
- id: ERR_STYLE_CODE_EXISTS
  http: 409
  condition: model style_code already in use
- id: ERR_CONTRACT_NUMBER_EXISTS
  http: 409
  condition: contract_number already in use
- id: ERR_CLAIM_ALREADY_EXISTS
  http: 409
  condition: a non-REVOKED claim already exists for (model_id, claim_type)
- id: ERR_ALLOCATION_ALREADY_EXISTS
  http: 409
  condition: an allocation already exists for (factory_id, iso_week)
- id: ERR_ENROLLMENT_ALREADY_OPEN
  http: 409
  condition: an ENROLLED or REMEDIATION enrollment already exists for (worker_id, operation)
- id: ERR_REPORT_MODEL_MISMATCH
  http: 422
  condition: substantiate with a report whose run's model_id != claim.model_id
- id: ERR_MODEL_MISMATCH
  http: 422
  condition: order schedule with a run whose model_id != order.model_id
- id: ERR_NOT_A_CUSTOM_RUN
  http: 422
  condition: order schedule onto a run whose run_type != CUSTOM_BATCH
- id: ERR_MODEL_HAS_OPEN_RUNS
  http: 409
  condition: 'discontinue blocked: model has runs in PLANNED|MATERIAL_RESERVED|IN_PRODUCTION|QUALITY_HOLD'
- id: ERR_MODEL_HAS_PUBLISHED_CLAIMS
  http: 409
  condition: 'discontinue blocked: model has a PUBLISHED claim'
- id: ERR_REQUIRED_EVIDENCE_MISSING
  http: 422
  condition: substantiate without >= 1 VERIFIED unexpired SUPPLIER_ORIGIN_CERT and >= 1 VERIFIED unexpired ASSEMBLY_LABOR_RECORD attached to the claim
- id: ERR_TOTAL_EXCEEDS_WEEKLY_CAPACITY
  http: 422
  condition: allocation total_reserved_units > factory.weekly_capacity_units
- id: ERR_CAPACITY_WEEK_EXCEEDED
  http: 422
  condition: reserve would push the week's consumed units above the applicable (domestic/import) pool
- id: ERR_RUN_ORDER_CAPACITY_EXCEEDED
  http: 422
  condition: order schedule would push the run's scheduled+in-production order units above planned_units
- id: ERR_SHIFT_EXCEEDS_SOURCE
  http: 422
  condition: shift units > source bucket (import_reserved_units for TO_DOMESTIC, domestic_reserved_units for TO_IMPORT)
- id: ERR_SHIFT_BELOW_CONSUMED
  http: 422
  condition: TO_IMPORT shift would leave domestic_reserved_units below the units already consumed by runs in {MATERIAL_RESERVED, IN_PRODUCTION, QUALITY_HOLD, COMPLETED} for (factory, iso_week)
- id: ERR_WEEK_RUNS_OPEN
  http: 409
  condition: 'reconcile blocked: runs of (factory, iso_week) still in PLANNED|MATERIAL_RESERVED|IN_PRODUCTION|QUALITY_HOLD'
- id: ERR_STALE_RUN_VERSION
  http: 412
  condition: expected_run_version != run.version on content-report creation
- id: ERR_STALE_ALLOCATION_VERSION
  http: 412
  condition: expected_allocation_version != allocation.version on shift
roles:
- name: PlatformAdmin
  description: 'Central operations administrator: factories, capacity allocations, contract award, logical clock'
  identity: opaque
  exclusive_operations:
  - POST /_clock/set_current_utc
  - POST /footwear/factories
  - factory suspend/reactivate
  - capacity allocation create/lock/shift/reconcile
  - POST /footwear/gov-contracts
  shared_operations:
  - all GET endpoints
- name: SourcingManager
  description: Owns styles, components, and material supply; uploads supplier-facing evidence
  identity: opaque
  exclusive_operations:
  - model create/discontinue
  - component create
  - lot create
  shared_operations:
  - evidence document create (shared with ComplianceOfficer)
  - all GET endpoints
- name: ProductionPlanner
  description: Plans and drives production runs, content reports, and the custom-order pipeline
  identity: opaque
  exclusive_operations:
  - run create/reserve/release/start/complete/cancel
  - content report create
  - order accept/schedule/fulfill
  - order create (planner-on-behalf)
  shared_operations:
  - run hold/resume (shared with FactoryManager)
  - order cancel (shared with CustomProgramCustomer)
  - all GET endpoints
- name: ComplianceOfficer
  description: Owns labeling claims, evidence verification, and government-contract compliance actions
  identity: opaque
  exclusive_operations:
  - claim create/substantiate/publish/revoke
  - evidence verify/reject (never on own uploads)
  - contract start-fulfillment/initiate-audit/complete-audit
  shared_operations:
  - evidence document create (shared with SourcingManager)
  - all GET endpoints
- name: TrainingCoordinator
  description: 'Owns workforce: workers, certifications, training pipeline'
  identity: opaque
  exclusive_operations:
  - worker create/suspend/reinstate
  - certification suspend/reinstate
  - training enrollment create
  - record-assessment
  shared_operations:
  - all GET endpoints
- name: FactoryManager
  description: Floor manager of one factory; X-User-ID equals the managed Factory.id
  identity: entity_backed:Factory
  exclusive_operations: []
  shared_operations:
  - run hold/resume (only where run.factory_id == X-User-ID)
  - all GET endpoints
- name: CustomProgramCustomer
  description: External custom-program buyer; buyer_ref on orders must equal X-User-ID
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - order create (buyer_ref == X-User-ID)
  - order cancel (own orders only)
  - all GET endpoints
