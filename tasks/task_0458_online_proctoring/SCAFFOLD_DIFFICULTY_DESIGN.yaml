              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (open SCHEDULED appointment blocks exam close)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: proctor_double_book_half_open_touching_allowed
        grounds:
          - validations[priority=9]
          - entities.Appointment.fields.effective_end_utc
          - errors[ERR_PROCTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Proctor resource overlap uses HALF-OPEN interval semantics: appt1 occupies [09:00, 11:10) (60min base +
          10 setup = 70min) so a second appointment starting exactly 11:10 is ACCEPTED (endpoints touch), but one
          starting 11:00 is rejected ERR_PROCTOR_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "A proctor with one SCHEDULED appointment [09:00, 11:10) for candidate1."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst O" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc O", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand O1", email: "o1@x.com" }
              as: SchedulingCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand O2", email: "o2@x.com" }
              as: SchedulingCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Ovl Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T08:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c1_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c2_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${appt1_id}.effective_end_utc == 2026-07-01T11:10:00Z"
            - "response error_id == ERR_PROCTOR_DOUBLE_BOOKED (11:00 start overlaps [09:00,11:10))"

      - name: candidate_same_exam_back_to_back_closed_interval_rejected
        grounds:
          - validations[priority=10]
          - entities.Appointment.fields.effective_end_utc
          - errors[ERR_CANDIDATE_OVERLAP]
        distinguishing_aspect: |
          Candidate-for-same-exam overlap uses CLOSED-interval semantics on a DIFFERENT resource entity
          (Candidate, not Proctor): a back-to-back sitting whose start exactly equals the prior appointment's
          effective_end_utc (a 0-minute gap) is STILL rejected ERR_CANDIDATE_OVERLAP — the opposite adjacency rule
          from the proctor's half-open semantics.
        test_recipe:
          setup:
            - "Candidate with one SCHEDULED appointment [09:00, 11:10) for exam X on proctor A; a second proctor B is free."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst P" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc P-A", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { procA_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc P-B", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { procB_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand P", email: "p@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Cand Ovl Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T08:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${procA_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${procB_id}", scheduled_start_utc: "2026-07-01T11:10:00Z" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${appt1_id}.effective_end_utc == 2026-07-01T11:10:00Z"
            - "response error_id == ERR_CANDIDATE_OVERLAP (11:10 start touches prior end; closed-interval rejects 0-gap)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_recompute_conserves_proctor_weighted_load
        grounds:
          - state_machines.ProctoringSession.ACTIVE_to_VOIDED
          - calculations.proctor_load_factor
          - entities.Proctor.fields.load_factor
          - entities.Proctor.fields.active_session_count
        distinguishing_aspect: |
          Conserved quantity = proctor weighted active load. Invariant: load_factor == (sum of MODE_WEIGHT over
          sessions in {ACTIVE,PAUSED}) / capacity at all times. Forward action (check-in admits a 1.0 LIVE
          session) and compensating action (auto-void removes it) must leave load_factor back at its pre-admission
          value with no drift: 0.2500 -> 0.5000 -> 0.2500.
        test_recipe:
          setup:
            - "Proctor(cap 4) running one ACTIVE LIVE session (load 0.2500); a second appointment is checked in (load 0.5000)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst Q" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc Q", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand Q1", email: "q1@x.com" }
              as: SchedulingCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand Q2", email: "q2@x.com" }
              as: SchedulingCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Cons Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c1_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${c1_id}"
              captures: { sess1_id: $.data.id }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${c2_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T11:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments/${appt2_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${c2_id}"
              captures: { sess2_id: $.data.id }
            - call: "POST /sessions/${sess2_id}/flags"
              payload: { kind: "PROHIBITED_MATERIAL", severity: "CRITICAL" }
              as: Proctor
              as_user_id: "${proc_id}"
          trigger:
            - call: "POST /sessions/${sess2_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "GET /proctors/${proc_id}"
              as: SchedulingCoordinator
              captures: { load_final: $.data.load_factor, count_final: $.data.active_session_count }
          assert:
            - "ProctoringSession.${sess2_id}.status == VOIDED (penalty 55 -> score 45 < 50)"
            - "Proctor.${proc_id}.load_factor == 0.2500 (restored to pre-admission value; only sess1 counted)"
            - "Proctor.${proc_id}.active_session_count == 1"

      - name: dismiss_conserves_session_integrity_penalty_set
        grounds:
          - state_machines.Escalation.UNDER_REVIEW_to_DISMISSED
          - state_machines.ProctoringSession.REVIEW_HELD_to_ACTIVE
          - calculations.session_integrity_score
          - entities.IncidentFlag.fields.status
        distinguishing_aspect: |
          Conserved quantity = session integrity_score (a DIFFERENT conserved quantity than proctor load). Forward
          action (escalating a MINOR flag sets it ESCALATED, keeping its weight in the penalty set) and compensating
          action (DISMISS resolves the flag, removing its weight) must leave integrity_score restored to 100.00 —
          the single MINOR penalty is fully reversed, no drift.
        test_recipe:
          setup:
            - "One session with a single MINOR flag (score 95) escalated and UNDER_REVIEW; flag status ESCALATED."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst R" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Opener R", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { opener_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Officer R", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { officer_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand R", email: "r@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Dis Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "GAZE_OFF_SCREEN", severity: "MINOR" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { flag_id: $.data.id }
            - call: "POST /escalations"
              payload: { session_id: "${sess_id}", incident_flag_id: "${flag_id}" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { esc_id: $.data.id }
            - call: "POST /escalations/${esc_id}/claim"
              payload: {}
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { esc_v: $.data.version }
          trigger:
            - call: "POST /escalations/${esc_id}/decide"
              payload: { verdict: "DISMISSED", expected_escalation_version: "${esc_v}" }
              as: ReviewOfficer
              as_user_id: "${officer_id}"
            - call: "GET /sessions/${sess_id}"
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { score_after: $.data.integrity_score }
          assert:
            - "ProctoringSession.${sess_id}.integrity_score == 100.00 (MINOR penalty reversed on dismiss)"
            - "ProctoringSession.${sess_id}.status == ACTIVE"
