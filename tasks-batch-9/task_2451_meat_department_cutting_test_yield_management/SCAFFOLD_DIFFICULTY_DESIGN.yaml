  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: grinder_window_half_open_overlap_and_sanitation_gap
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - errors[ERR_GRINDER_WINDOW_CONFLICT]
          - errors[ERR_SANITATION_BUFFER_REQUIRED]
          - entities.GrindRun.fields.declared_coo
          - entities.Department.fields.grind_sanitation_buffer_min
        distinguishing_aspect: |
          The shared resource is the single grinder and the intervals are HALF-OPEN
          [scheduled_start_at, scheduled_end_at): a run starting exactly when another ends is
          accepted, a straddling window is refused with ERR_GRINDER_WINDOW_CONFLICT, and a
          country-of-origin changeover additionally needs a gap >= 30 minutes so a touching
          CAN-after-USA window is refused with ERR_SANITATION_BUFFER_REQUIRED while a gap of
          exactly 30 minutes is accepted. The sibling instance shares pickup capacity over
          CLOSED intervals, where touching endpoints DO collide.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config (grind_sanitation_buffer_min 30); clock at 2026-08-05T08:00:00Z."
            - "GRD80 (GROUND) exists; grinder scheduling does not require it to be priced (priority 11 only guards START)."
            - "GrindRun GR1 occupies [2026-08-06T06:00:00Z, 2026-08-06T07:00:00Z) with declared_coo USA and status SCHEDULED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_id: $.data.id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "USA", scheduled_start_at: "2026-08-06T06:00:00Z", scheduled_end_at: "2026-08-06T07:00:00Z", target_lean_pct: 80.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gr1_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "USA", scheduled_start_at: "2026-08-06T07:00:00Z", scheduled_end_at: "2026-08-06T08:00:00Z", target_lean_pct: 80.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gr2_id: $.data.id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "USA", scheduled_start_at: "2026-08-06T06:30:00Z", scheduled_end_at: "2026-08-06T07:30:00Z", target_lean_pct: 80.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "CAN", scheduled_start_at: "2026-08-06T08:00:00Z", scheduled_end_at: "2026-08-06T09:00:00Z", target_lean_pct: 80.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_sanitation: $.data.error_id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "CAN", scheduled_start_at: "2026-08-06T08:30:00Z", scheduled_end_at: "2026-08-06T09:30:00Z", target_lean_pct: 80.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gr5_id: $.data.id }
          assert:
            - "GR2 (${gr2_id}) is created 201 with status SCHEDULED: [07:00, 08:00) touches GR1's exclusive end and does not overlap, and the declared_coo is unchanged so no sanitation gap is needed"
            - "${err_overlap} == ERR_GRINDER_WINDOW_CONFLICT with HTTP 409 for [06:30, 07:30)"
            - "${err_sanitation} == ERR_SANITATION_BUFFER_REQUIRED with HTTP 409 for the CAN window at [08:00, 09:00): the gap after GR2 is 0 minutes, below grind_sanitation_buffer_min 30"
            - "GR5 (${gr5_id}) is created 201 with status SCHEDULED: the CAN window at [08:30, 09:30) leaves exactly 30 minutes after GR2 ends at 08:00, and a gap equal to the buffer is accepted"
            - "GET /meat-ops/grind-runs filtered by department returns total_count == 3 (GR1, GR2, GR5); the two refused windows created nothing"
            - "GrindRun.${gr5_id}.coo_label == PENDING and batch_weight_lb == 0.00"

      - name: pickup_slot_capacity_over_closed_intervals
        grounds:
          - validations[priority=26]
          - errors[ERR_PICKUP_SLOT_CAPACITY_EXCEEDED]
          - entities.Department.fields.pickup_slot_capacity
          - state_machines.PreOrder.REQUESTED_to_CONFIRMED
          - calculations.pre_order_deposit_settlement
        distinguishing_aspect: |
          The shared resource is the counter's pickup capacity (2) and the intervals are CLOSED
          [pickup_window_start_at, pickup_window_end_at], so windows that merely touch at an
          endpoint DO collide: [14:00,15:00] and [15:00,16:00] both confirm, a third window
          [15:00,15:30] touching the first and overlapping the second is refused with
          ERR_PICKUP_SLOT_CAPACITY_EXCEEDED, and [16:00,17:00] confirms because it collides with
          only one. The sibling instance uses half-open grinder windows where touching is legal.
        test_recipe:
