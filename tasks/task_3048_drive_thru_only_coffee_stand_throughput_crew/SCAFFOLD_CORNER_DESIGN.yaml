  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_stand_version_rejected_on_order_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-create-stale-stand]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC rule order-create-stale-stand: a create carrying the stand's pre-mutation version (captured before another order bumped it) fails 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Stand OPEN with recipe; client holds stand version v1, then another order bumps it to v1+1."]
          setup_api_calls:
            - *k_clock
            - *k_region
