              as: ComplianceOfficer
              as_user_id: "officer-close-2"
              captures: { voided: $.data.voided_at }
            - call: "GET /land-application-sites/${site_id}/loading-summary"
              payload: { applied_year: 2026 }
              as: ComplianceOfficer
              captures: { cum: $.data.cumulative_loading_kg_per_hectare }
          assert:
            - "the site now has exactly 2 LoadingLedgerEntry rows: the original APPLICATION at +0.1793 and one REVERSAL at -0.1793 whose reversal_of_id is the APPLICATION row id"
            - "the APPLICATION row is unchanged - kg_per_hectare_delta still +0.1793, applied_year still 2026"
            - "GET /land-application-sites/${site_id}/loading-summary returns cumulative_loading_kg_per_hectare[\"CADMIUM\"] == 0.0000 and annual_loading_kg_per_hectare[\"2026:CADMIUM\"] == 0.0000"
            - "LandApplicationSite.${site_id}.status == PERMITTED with restriction_reason == null"
            - "ApplicationEvent.${ev_a}.status == VOIDED with voided_at set and applied_dry_tons 80.000 / applied_wet_tons 400.00 retained for audit"
            - "ApplicationEvent.${ev_b}.status is still DEFERRED with defer_reason == SITE_RESTRICTED - compensation does not reschedule it"
            - "SolidsBatch.${batch_id}.unallocated_dry_tons == 80.000 and TreatmentFacility.${fac_id}.storage_used_wet_tons == 800.00"
            - "cplr_headroom_kg_per_hectare[\"CADMIUM\"] == 0.1900, exactly the pre-close-out headroom"

      - name: diversion_void_restores_batch_dry_tons_conservation
        conserved_quantity: SolidsBatch dry tons (dry_tons_produced == unallocated + reserved + applied + diverted)
        grounds:
          - state_machines.DiversionOrder.COMMITTED_to_VOIDED
          - calculations.dry_tons_conservation
          - entities.AlternativeOutlet.fields.ytd_accepted_wet_tons
          - entities.DiversionOrder.fields.void_reason
          - calculations.outlet_cost_comparison
        distinguishing_aspect: |
          A different conserved quantity on a different entity: voiding a COMMITTED diversion
          returns all 60.000 dry tons to the batch and unwinds the outlet's annual acceptance
          by 300.00 wet tons, while storage_used_wet_tons never moves because settlement never
          happened. The costed figures (total 6110.78) are retained on the voided row, so the
          compensation is financial history, not deletion.
        test_recipe:
          setup:
            - "TreatmentFacility with 5000.00 wet tons capacity, one DEWATERED SolidsBatch of 800.00 wet tons / 160.000 dry tons produced."
            - "One ACCEPTING COMPOST outlet: gate 12.00, 0.2400 per mile-ton, min load 25.00, annual cap 5000, min percent solids 15.0."
            - "One COMMITTED DiversionOrder of 60.000 dry tons / 300.00 wet tons over 30.0 miles, costed at 3600.00 + 2332.80 = 5932.80 subtotal, 3% surcharge 177.98, total 6110.78, 101.85 per dry ton."
            - "Pre-order baseline to restore: batch unallocated 160.000, outlet ytd 0.00, facility storage 800.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DEWATERED", percent_solids: 20.0 }
              as: FacilityOperator
              captures: { batch_v: $.data.version }
            - call: "POST /alternative-outlets"
              payload: { name: "Greenfield Compost", outlet_type: "COMPOST", gate_fee_per_wet_ton: 12.00, haul_rate_per_mile_per_wet_ton: 0.2400, min_load_wet_tons: 25.00, max_annual_wet_tons: 5000, min_percent_solids: 15.0 }
              as: FacilityOperator
              captures: { outlet_id: $.data.id }
            - call: "POST /diversion-orders"
              payload: { batch_id: "${batch_id}", outlet_id: "${outlet_id}", expected_batch_version: "${batch_v}", dry_tons: 60.000, wet_tons: 300.00, haul_miles: 30.0 }
              as: FacilityOperator
              captures: { order_id: $.data.id }
            - call: "POST /diversion-orders/${order_id}/commit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /diversion-orders/${order_id}/void"
              payload: { void_reason: "Compost site suspended intake after a wet-weather washout" }
              as: ComplianceOfficer
              captures: { status_after: $.data.status }
          assert:
            - "DiversionOrder.${order_id}.status == VOIDED with void_reason set and committed_at retained"
            - "DiversionOrder.${order_id}.total_cost == 6110.78, subtotal_cost == 5932.80, surcharge_pct == 0.03, surcharge_cost == 177.98 and cost_per_dry_ton == 101.85 are all retained on the voided row"
            - "SolidsBatch.${batch_id}.unallocated_dry_tons == 160.000, exactly the pre-order value"
            - "SolidsBatch.${batch_id}.dry_tons_produced == 160.000 == unallocated 160.000 + reserved 0.000 + applied 0.000 + diverted 0.000, so calculations.dry_tons_conservation holds"
            - "AlternativeOutlet.${outlet_id}.ytd_accepted_wet_tons == 0.00"
            - "TreatmentFacility.${fac_id}.storage_used_wet_tons == 800.00 and storage_utilization_pct == 16.00 - a voided commitment never touched storage"
            - "GET /diversion-orders?batch_id=${batch_id} still returns 1 row; the order was not deleted"
