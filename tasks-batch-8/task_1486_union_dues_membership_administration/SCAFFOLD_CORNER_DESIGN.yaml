              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Vic Version", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id", v0: "$.data.version" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
          trigger:
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 1000 }, as: Member, as_user_id: "${mem}" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { v1: "$.data.version" }
          assert:
            - "${v0} == 1 at registration; the assessment run bumped it once (charge posted)"
            - "${v1} == 3 after the payment (run + payment = two mutations) — version increments by exactly 1 per mutation"

      - name: credit_balance_drained_by_next_charge
        claim_type: derived_field_reconciliation
        grounds: [entities.Member.fields.credit_balance_cents, calculations.payment_waterfall]
        distinguishing_aspect: "Derived pair stays consistent with the ledger across an overpayment then a new charge: credit 1000 is consumed by the next 5000 assessment, leaving arrears 4000 and credit 0."
