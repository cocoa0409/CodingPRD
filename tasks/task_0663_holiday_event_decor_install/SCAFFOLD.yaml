scenario: "663. Commercial Holiday & Event Décor Install (Christmas Decor Inc style): design & inventory (trees/wreaths/garland/lighting), install/refresh/takedown scheduling, off-season storage of client décor, commercial/HOA recurring contract & early-bird, damage/repair & restock, route/crew, renewal, custom design 输出文件夹：tasks/task_0663_holiday_event_decor_install"
domain_name: holiday-event-decor-install
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  # Contract → DesignProposal → ProposalLineItem is a hierarchy; WorkOrder/Crew/StorageLot/
  # InventoryItem are flat peers cross-referencing the hierarchy by FK (route/crew, storage,
  # restock all cut across the contract tree).
  state_machine_shape: parallel
  # Contract is cyclic (renewal loop), WorkOrder carries parallel schedule_status × billing_status
  # dimensions, DamageReport forks REPAIR/RESTOCK, RenewalOffer branches accept/decline.
  relationship_patterns:
    - one_to_many        # Contract→DesignProposal→ProposalLineItem; WorkOrder→Visit; WorkOrder→DamageReport
    - cross_aggregate    # WorkOrder.crew_id, StorageLot.contract_id, RestockOrder.inventory_item_id
    - self_referential   # Contract.renewed_from_contract_id chains renewal generations
  role_model: peer_roles
  # AccountManager owns Client/Contract/Proposal surface; FieldSupervisor owns Crew/WorkOrder/
  # Visit/StorageLot/DamageReport surface; ClientContact (entity_backed:Client) views & signs;
  # PlatformAdmin opaque operator for catalog + clock.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal/business name of the commercial account or HOA
      - name: account_type
        type: enum
        source: input
        description: type of account; gates early-bird eligibility & escalation
        constraints: "one of {COMMERCIAL, HOA, EVENT}"
      - name: contact_email
        type: string
        source: input
        description: primary contact email; also the login identity for ClientContact role
      - name: site_address
        type: string
        source: input
        description: primary installation site street address
      - name: status
        type: enum
        source: system
        description: account standing (set ACTIVE at creation; no lifecycle transitions in scope)
        default: ACTIVE
        constraints: "one of {ACTIVE}"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the account this contract serves"
      - name: renewed_from_contract_id
        type: string
        source: system
        description: "FK -> Contract.id; set when this contract was minted by a RenewalOffer acceptance, else null (self-referential renewal chain)"
        default: null
      - name: contract_type
        type: enum
        source: input
        description: "recurring billing kind; drives early_bird_pct and escalation_pct"
        constraints: "one of {COMMERCIAL, HOA, EVENT}; must equal the owning Client.account_type"
      - name: season_year
        type: integer
        source: input
        description: holiday season this contract covers (e.g. 2026)
      - name: early_bird_deadline
        type: datetime
        source: input
        description: signing on/before this instant unlocks the early-bird discount
      - name: custom_design_surcharge_cents
        type: integer
        source: input
        description: flat surcharge for bespoke custom-design work on top of catalog pricing
        default: 0
        constraints: ">= 0"
      - name: install_fee_cents
        type: integer
        source: computed
        description: "labor+materials install fee summed from the SIGNED DesignProposal's line items (calc compute_install_fee); null until a proposal is accepted"
        default: null
      - name: storage_fee_cents
        type: integer
        source: computed
        description: "tiered off-season storage fee over the contract's STORED StorageLot unit counts (calc compute_storage_fee)"
        default: null
      - name: early_bird_discount_cents
        type: integer
        source: computed
        description: "early-bird discount applied at signing (calc compute_contract_total); 0 when signed after deadline or EVENT type"
        default: null
      - name: total_amount_cents
        type: integer
        source: computed
        description: "final contract price (calc compute_contract_total); set on SIGN"
        default: null
      - name: status
        type: enum
        source: system
        description: contract lifecycle state (cyclic via renewal)
        default: DRAFT
        constraints: "one of {DRAFT, PROPOSED, SIGNED, ACTIVE, RENEWAL_OFFERED, EXPIRED, CANCELLED}"

  - name: DesignProposal
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract this proposal designs decor for"
      - name: theme
        type: string
        source: input
        description: free-text design theme (e.g. 'Winter Gold', 'Classic Red & Green')
      - name: is_custom
        type: boolean
        source: input
        description: true when the proposal contains bespoke custom-design line items
        default: false
      - name: total_unit_count
        type: integer
        source: computed
        description: "sum of quantity over all this proposal's ProposalLineItem rows; drives the bundle discount tier"
        default: 0
      - name: status
        type: enum
        source: system
        description: proposal lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED, SUPERSEDED}"

  - name: ProposalLineItem
    parent: DesignProposal
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> DesignProposal.id; the proposal this line belongs to"
      - name: inventory_item_id
        type: string
        source: input
        description: "FK -> InventoryItem.id; the catalog decor SKU being installed"
      - name: quantity
        type: integer
        source: input
        description: number of decor units of this SKU
        constraints: ">= 1"
      - name: unit_install_cents
        type: integer
        source: input
        description: per-unit install labor+materials charge for this line
        constraints: ">= 0"

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: catalog stock-keeping unit code; unique across catalog
        constraints: "unique among InventoryItem.sku"
      - name: category
        type: enum
        source: input
        description: decor category
        constraints: "one of {TREE, WREATH, GARLAND, LIGHTING}"
      - name: unit_replacement_cents
        type: integer
        source: input
        description: replacement cost of one unit; drives damage settlement
        constraints: ">= 0"
      - name: on_hand_qty
        type: integer
        source: system
        description: warehouse stock count; decremented by restock cascade, replenished by RestockOrder fulfillment
        default: 0
        constraints: ">= 0"
      - name: reorder_threshold
        type: integer
        source: input
        description: on_hand_qty at or below which the SKU is flagged low-stock
        default: 0
        constraints: ">= 0"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: crew_name
        type: string
        source: input
        description: installer crew display name
      - name: daily_capacity_minutes
        type: integer
        source: input
        description: total minutes of route work the crew can absorb per scheduled date
        constraints: ">= 1"
      - name: home_base_zip
        type: string
        source: input
        description: crew depot ZIP for routing
      - name: planned_utilization_pct
        type: integer
        source: computed
        description: "PLANNED variant of compute_crew_utilization over SCHEDULED/DISPATCHED WorkOrders assigned to this crew on its busiest date"
        default: 0
      - name: actual_utilization_pct
        type: integer
        source: computed
        description: "ACTUAL variant of compute_crew_utilization over COMPLETED visits only"
        default: 0

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract whose decor this work order services"
      - name: crew_id
        type: string
        source: system
        description: "FK -> Crew.id; assigned crew, null until scheduled (cross-aggregate)"
        default: null
      - name: job_type
        type: enum
        source: input
        description: nature of the field visit
        constraints: "one of {INSTALL, REFRESH, TAKEDOWN}"
      - name: scheduled_date
        type: datetime
        source: system
        description: date the crew performs this job; null until scheduled
        default: null
      - name: route_total_minutes
        type: integer
        source: computed
        description: "total route time = round-per-leg drive minutes + on-site minutes (calc compute_route_minutes); set on schedule"
        default: null
      - name: schedule_status
        type: enum
        source: system
        description: scheduling dimension (parallel with billing_status)
        default: UNSCHEDULED
        constraints: "one of {UNSCHEDULED, SCHEDULED, DISPATCHED, COMPLETED, CANCELLED}"
      - name: billing_status
        type: enum
        source: system
        description: billing dimension (parallel with schedule_status)
        default: PENDING
        constraints: "one of {PENDING, INVOICED, PAID}"

  - name: Visit
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the route this visit is a leg of"
      - name: stop_sequence
        type: integer
        source: input
        description: 1-based position of this stop in the route; ties broken by created_at ASC
        constraints: ">= 1"
      - name: leg_distance_km
        type: number
        source: input
        description: drive distance in km from the previous stop (or depot for sequence 1)
        constraints: ">= 0"
      - name: on_site_minutes
        type: integer
        source: input
        description: planned minutes spent at this stop
        constraints: ">= 0"
      - name: actual_minutes
        type: integer
        source: system
        description: actual minutes recorded when the visit is completed; null until COMPLETED
        default: null
      - name: visit_status
        type: enum
        source: system
        description: per-stop completion state
        default: PLANNED
        constraints: "one of {PLANNED, COMPLETED, SKIPPED}"

  - name: StorageLot
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the client whose off-season decor is stored"
      - name: storage_bay_id
        type: string
        source: input
        description: "FK -> StorageBay.id; the physical bay holding the lot"
      - name: unit_count
        type: integer
        source: input
        description: number of stored decor units; counts against bay aggregate capacity and feeds storage-fee tier
        constraints: ">= 1"
      - name: stored_from
        type: datetime
        source: input
        description: half-open interval start (inclusive) of bay occupancy
      - name: released_on
        type: datetime
        source: input
        description: half-open interval end (exclusive) of bay occupancy; must be after stored_from
      - name: status
        type: enum
        source: system
        description: storage lifecycle
        default: RESERVED
        constraints: "one of {RESERVED, STORED, RELEASED}"

  - name: StorageBay
    parent: null
    common_fields: true
    fields:
      - name: bay_code
        type: string
        source: input
        description: warehouse bay label; unique
        constraints: "unique among StorageBay.bay_code"
      - name: capacity_units
        type: integer
        source: input
        description: maximum decor units the bay can hold across overlapping lots
        constraints: ">= 1"

  - name: DamageReport
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the TAKEDOWN work order during which damage was found"
      - name: inventory_item_id
        type: string
        source: input
        description: "FK -> InventoryItem.id; the damaged SKU"
      - name: damaged_qty
        type: integer
        source: input
        description: number of damaged units assessed
        constraints: ">= 1"
      - name: resolution_path
        type: enum
        source: system
        description: branch chosen at ASSESS time; drives divergent settle side-effects
        default: null
        constraints: "one of {REPAIR, RESTOCK}"
      - name: replacement_cost_cents
        type: integer
        source: computed
        description: "damaged_qty * InventoryItem.unit_replacement_cents (calc compute_damage_settlement)"
        default: null
      - name: settlement_total_cents
        type: integer
        source: computed
        description: "replacement_cost + labor_fee with loyalty-waiver tier (calc compute_damage_settlement)"
        default: null
      - name: status
        type: enum
        source: system
        description: damage lifecycle (fork at ASSESSED)
        default: OPEN
        constraints: "one of {OPEN, ASSESSED, SETTLED, VOID}"

  - name: RestockOrder
    parent: null
    common_fields: true
    fields:
      - name: damage_report_id
        type: string
        source: system
        description: "FK -> DamageReport.id; the report whose RESTOCK settle minted this order (null for manual restocks)"
        default: null
      - name: inventory_item_id
        type: string
        source: input
        description: "FK -> InventoryItem.id; SKU to replenish"
      - name: quantity
        type: integer
        source: input
        description: units to replenish
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: restock lifecycle
        default: REQUESTED
        constraints: "one of {REQUESTED, FULFILLED}"

  - name: RenewalOffer
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the ACTIVE contract being offered for renewal"
      - name: provisional_price_cents
        type: integer
        source: computed
        description: "renewal quote excluding unsettled-damage carry (calc compute_renewal_price PROVISIONAL variant); set at offer creation"
        default: null
      - name: final_price_cents
        type: integer
        source: computed
        description: "renewal price including unsettled-damage carry-forward (calc compute_renewal_price FINAL variant); set on ACCEPT"
        default: null
      - name: expires_at
        type: datetime
        source: input
        description: offer auto-expires if not accepted on/before this instant
      - name: status
        type: enum
        source: system
        description: renewal-offer lifecycle (branch accept/decline/expire)
        default: DRAFT
        constraints: "one of {DRAFT, SENT, ACCEPTED, DECLINED, EXPIRED}"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /clients/{client_id}/contracts/{id}/propose"
        actor: AccountManager
        preconditions:
          - "contract.status == DRAFT"
          - "at least one DesignProposal for this contract is in status SUBMITTED"
        side_effects:
          - "increments Contract.version by 1"
        note: "moves the contract into the client-review window"
      - from: PROPOSED
        to: SIGNED
        trigger: "POST /clients/{client_id}/contracts/{id}/sign"
        actor: ClientContact
        preconditions:
          - "contract.status == PROPOSED"
          - "exactly one DesignProposal for this contract is in status ACCEPTED (acceptance happens via POST /design-proposals/{id}/accept before signing)"
        side_effects:
          - "computes Contract.install_fee_cents via compute_install_fee over the ACCEPTED proposal's line items"
          - "computes Contract.storage_fee_cents via compute_storage_fee over the contract's STORED StorageLots"
          - "computes Contract.early_bird_discount_cents and Contract.total_amount_cents via compute_contract_total"
          - "increments Contract.version by 1"
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /clients/{client_id}/contracts/{id}/activate"
        actor: AccountManager
        preconditions:
          - "contract.status == SIGNED"
        side_effects:
          - "increments Contract.version by 1"
        note: "contract is now serviceable; WorkOrders may be scheduled against it"
      - from: ACTIVE
        to: RENEWAL_OFFERED
        trigger: "POST /contracts/{id}/renewal-offers (system marks the parent contract)"
        actor: AccountManager
        preconditions:
          - "contract.status == ACTIVE"
          - "no existing RenewalOffer for this contract in status {DRAFT, SENT}"
        side_effects:
          - "creates a RenewalOffer in DRAFT with provisional_price_cents computed via compute_renewal_price (PROVISIONAL)"
          - "increments Contract.version by 1"
      - from: RENEWAL_OFFERED
        to: ACTIVE
        trigger: "POST /renewal-offers/{id}/decline (system reverts the parent contract)"
        actor: ClientContact
        preconditions:
          - "contract.status == RENEWAL_OFFERED"
          - "the RenewalOffer is in status SENT"
        side_effects:
          - "RenewalOffer.status := DECLINED"
          - "increments Contract.version by 1"
        note: "cyclic: contract returns to ACTIVE so another renewal can be offered later"
      - from: RENEWAL_OFFERED
        to: EXPIRED
        trigger: "POST /renewal-offers/{id}/accept (terminal for the old contract)"
        actor: ClientContact
        preconditions:
          - "contract.status == RENEWAL_OFFERED"
          - "the RenewalOffer is in status SENT"
          - "clock.now <= RenewalOffer.expires_at"
        side_effects:
          - "RenewalOffer.status := ACCEPTED; RenewalOffer.final_price_cents computed via compute_renewal_price (FINAL)"
          - "mints a new Contract in status SIGNED with renewed_from_contract_id := this contract.id, total_amount_cents := RenewalOffer.final_price_cents, season_year := old.season_year + 1 (CASCADE hop 2)"
          - "old contract.status := EXPIRED (CASCADE hop 3)"
          - "increments Contract.version by 1"
        note: "depth-3 cascade: accept → offer ACCEPTED → new Contract minted + old Contract EXPIRED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /clients/{client_id}/contracts/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "contract.status == ACTIVE"
          - "no WorkOrder for this contract in schedule_status DISPATCHED"
        side_effects:
          - "cancels every non-terminal WorkOrder for this contract: schedule_status := CANCELLED (conditional cascade, only UNSCHEDULED/SCHEDULED)"
          - "releases every RESERVED/STORED StorageLot for this contract: status := RELEASED"
          - "increments Contract.version by 1"

  - entity: DesignProposal
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /design-proposals/{id}/submit"
        actor: AccountManager
        preconditions:
          - "proposal.status == DRAFT"
          - "proposal has at least one ProposalLineItem"
        side_effects:
          - "recomputes DesignProposal.total_unit_count = sum of line-item quantity"
          - "increments DesignProposal.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /design-proposals/{id}/accept"
        actor: ClientContact
        preconditions:
          - "proposal.status == SUBMITTED"
          - "the owning Contract.status == PROPOSED"
          - "no sibling DesignProposal under the same Contract is already in status ACCEPTED"
        side_effects:
          - "every sibling DesignProposal under the same Contract in status {DRAFT, SUBMITTED} := SUPERSEDED (cascade)"
          - "increments DesignProposal.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /design-proposals/{id}/reject"
        actor: ClientContact
        preconditions:
          - "proposal.status == SUBMITTED"
        side_effects:
          - "increments DesignProposal.version by 1"

  - entity: WorkOrder
    initial_state: UNSCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "parallel dimensions — schedule_status (below) evolves independently from billing_status (separate machine)"
    transitions:
      - from: UNSCHEDULED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: FieldSupervisor
        preconditions:
          - "schedule_status == UNSCHEDULED"
          - "the owning Contract.status == ACTIVE"
          - "crew assignment passes crew temporal-overlap check (compute_route_minutes; no overlapping date window on the crew incl. 1-day buffer)"
          - "work order has at least one Visit"
        side_effects:
          - "sets WorkOrder.crew_id, scheduled_date"
          - "computes WorkOrder.route_total_minutes via compute_route_minutes"
          - "recomputes assigned Crew.planned_utilization_pct via compute_crew_utilization (PLANNED)"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: FieldSupervisor
        preconditions:
          - "schedule_status == SCHEDULED"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: FieldSupervisor
        preconditions:
          - "schedule_status == DISPATCHED"
          - "every Visit on this work order is in status COMPLETED or SKIPPED"
        side_effects:
          - "recomputes assigned Crew.actual_utilization_pct via compute_crew_utilization (ACTUAL)"
          - "increments WorkOrder.version by 1"
      - from: UNSCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: FieldSupervisor
        preconditions:
          - "schedule_status in {UNSCHEDULED, SCHEDULED}"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: FieldSupervisor
        preconditions:
          - "schedule_status in {UNSCHEDULED, SCHEDULED}"
        side_effects:
          - "frees the crew date window; recomputes assigned Crew.planned_utilization_pct via compute_crew_utilization (PLANNED)"
          - "increments WorkOrder.version by 1"

  - entity: WorkOrderBilling
    initial_state: PENDING
    terminal_states: [PAID]
    note: "second parallel dimension on the SAME WorkOrder row (billing_status); evolves independently of schedule_status"
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "POST /work-orders/{id}/invoice"
        actor: AccountManager
        preconditions:
          - "billing_status == PENDING"
          - "schedule_status == COMPLETED"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /work-orders/{id}/mark-paid"
        actor: AccountManager
        preconditions:
          - "billing_status == INVOICED"
        side_effects:
          - "increments WorkOrder.version by 1"

  - entity: DamageReport
    initial_state: OPEN
    terminal_states: [SETTLED, VOID]
    note: "fork-join — ASSESS sets resolution_path ∈ {REPAIR, RESTOCK}; SETTLE side-effects diverge per branch"
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /damage-reports/{id}/assess"
        actor: FieldSupervisor
        preconditions:
          - "status == OPEN"
          - "the parent WorkOrder.job_type == TAKEDOWN"
          - "the parent WorkOrder.schedule_status == COMPLETED"
        side_effects:
          - "sets resolution_path from request body (REPAIR or RESTOCK)"
          - "computes replacement_cost_cents and settlement_total_cents via compute_damage_settlement"
          - "increments DamageReport.version by 1"
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /damage-reports/{id}/settle (REPAIR branch)"
        actor: FieldSupervisor
        preconditions:
          - "status == ASSESSED"
          - "resolution_path == REPAIR"
        side_effects:
          - "no inventory movement (units are repaired in place); StorageLot unchanged"
          - "increments DamageReport.version by 1"
        note: "REPAIR branch: settlement billed, no restock minted"
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /damage-reports/{id}/settle (RESTOCK branch)"
        actor: FieldSupervisor
        preconditions:
          - "status == ASSESSED"
          - "resolution_path == RESTOCK"
        side_effects:
          - "mints a RestockOrder in REQUESTED (damage_report_id := this report, quantity := damaged_qty) — CASCADE hop 2"
          - "decrements InventoryItem.on_hand_qty by damaged_qty, floored at 0 — CASCADE hop 3 (triggered by the RestockOrder, not the settle)"
          - "increments DamageReport.version by 1"
        note: "RESTOCK branch: depth-3 cascade settle → RestockOrder minted → InventoryItem.on_hand_qty decremented"
      - from: OPEN
        to: VOID
        trigger: "POST /damage-reports/{id}/void"
        actor: FieldSupervisor
        preconditions:
          - "status == OPEN"
        side_effects:
          - "increments DamageReport.version by 1"

  - entity: StorageLot
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: STORED
        trigger: "POST /storage-lots/{id}/check-in"
        actor: FieldSupervisor
        preconditions:
          - "status == RESERVED"
          - "the owning Contract.status in {SIGNED, ACTIVE}"
        side_effects:
          - "increments StorageLot.version by 1"
        note: "STORED lots are the input set for compute_storage_fee"
      - from: STORED
        to: RELEASED
        trigger: "POST /storage-lots/{id}/release"
        actor: FieldSupervisor
        preconditions:
          - "status == STORED"
        side_effects:
          - "frees the bay capacity occupied by this lot's interval"
          - "increments StorageLot.version by 1"

  - entity: RenewalOffer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    note: "branch — SENT forks to ACCEPTED / DECLINED / EXPIRED with divergent side-effect sets"
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /renewal-offers/{id}/send"
        actor: AccountManager
        preconditions:
          - "status == DRAFT"
          - "the parent Contract.status == RENEWAL_OFFERED"
        side_effects:
          - "increments RenewalOffer.version by 1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /renewal-offers/{id}/accept"
        actor: ClientContact
        preconditions:
          - "status == SENT"
          - "clock.now <= expires_at"
        side_effects:
          - "computes final_price_cents via compute_renewal_price (FINAL)"
          - "mints a new Contract (SIGNED, renewed_from_contract_id set) — see Contract RENEWAL_OFFERED→EXPIRED cascade"
          - "old Contract.status := EXPIRED"
          - "increments RenewalOffer.version by 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /renewal-offers/{id}/decline"
        actor: ClientContact
        preconditions:
          - "status == SENT"
        side_effects:
          - "parent Contract.status := ACTIVE (revert)"
          - "increments RenewalOffer.version by 1"
      - from: SENT
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing clock past expires_at, then GET that lazily evaluates expiry; or POST /renewal-offers/{id}/expire"
        actor: system
        preconditions:
          - "status == SENT"
          - "clock.now > expires_at"
        side_effects:
          - "parent Contract.status := ACTIVE (revert; another offer may be issued later)"
          - "increments RenewalOffer.version by 1"

  - entity: RestockOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED]
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST /restock-orders/{id}/fulfill"
        actor: PlatformAdmin
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "increments the referenced InventoryItem.on_hand_qty by RestockOrder.quantity (compensates the settle-time decrement)"
          - "increments RestockOrder.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: proposal-accept-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /design-proposals/{id}/accept"
    occ_field: "expected_contract_version"
    description: |
      Accepting a DesignProposal against a Contract whose version has advanced
      since the client last observed it is rejected. A prior accept of a sibling
      proposal legitimately supersedes the others and bumps the owning Contract's
      version; a subsequent accept that still carries the stale contract version
      is rejected on the stale-version check rather than racing the supersede.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: renewal-offer-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/renewal-offers"
    occ_field: "expected_contract_version"
    description: |
      Creating a RenewalOffer against a Contract whose version has advanced since
      the client last read it is rejected. A first renewal-offer creation moves
      the Contract ACTIVE→RENEWAL_OFFERED and bumps its version; a second create
      carrying the stale version is rejected on the stale-version check.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: compute_install_fee
    trigger: "Contract PROPOSED→SIGNED (POST /contracts/{id}/sign)"
    algorithm: tiered_pricing
    formula: |
      lines = ProposalLineItem rows of the contract's ACCEPTED DesignProposal
      total_units = sum(li.quantity for li in lines)            # = DesignProposal.total_unit_count
      bundle_pct = 0.00 if total_units < 50
                 = 0.05 if 50 <= total_units < 100
                 = 0.10 if 100 <= total_units < 200
                 = 0.15 if total_units >= 200
      # PIN: round each line AFTER discount, THEN sum (round-per-line-then-sum).
      install_fee_cents = sum over lines of
          round_half_up(li.unit_install_cents * li.quantity * (1 - bundle_pct))
    input_set: "ProposalLineItem rows whose proposal is the contract's single ACCEPTED DesignProposal; SUPERSEDED/REJECTED proposals excluded"
    constants:
      TIER1_MAX: 50
      TIER2_MAX: 100
      TIER3_MAX: 200
      TIER1_PCT: 0.05
      TIER2_PCT: 0.10
      TIER3_PCT: 0.15
    precision: "integer cents, round_half_up; round-per-line before summing"
    variants: []
  - name: compute_storage_fee
    trigger: "Contract PROPOSED→SIGNED (POST /contracts/{id}/sign)"
    algorithm: threshold
    formula: |
      stored_units = sum(lot.unit_count for lot in contract's StorageLots with status == STORED)
      storage_fee_cents = 15000                          if stored_units <= 20
                        = 15000 + (stored_units - 20) * 600   if stored_units > 20
    input_set: "StorageLot rows for this contract in status STORED only; RESERVED and RELEASED lots excluded"
    constants:
      BASE_FEE_CENTS: 15000
      FREE_UNITS: 20
      PER_UNIT_OVERAGE_CENTS: 600
    precision: "integer cents"
    variants: []
  - name: compute_contract_total
    trigger: "Contract PROPOSED→SIGNED (POST /contracts/{id}/sign)"
    algorithm: forward_looking
    formula: |
      # >=3 inputs with non-linear conditional interaction (combinatorial mode a).
      # Evaluation order PINNED:
      # 1) install = compute_install_fee
      # 2) storage = compute_storage_fee
      # 3) surcharge = Contract.custom_design_surcharge_cents
      # 4) eb_pct = (0.10 if contract_type==COMMERCIAL
      #              else 0.12 if contract_type==HOA
      #              else 0.00)    if clock.now <= early_bird_deadline else 0.00
      #    (EVENT never qualifies; signing after deadline never qualifies)
      # 5) early_bird_discount_cents = round_half_up((install + storage) * eb_pct)
      #    (surcharge is NEVER discounted)
      # 6) total_amount_cents = install + storage + surcharge - early_bird_discount_cents
    input_set: "the contract's computed install_fee_cents, storage_fee_cents, its custom_design_surcharge_cents, contract_type, early_bird_deadline, and the logical clock at sign time"
    constants:
      EB_PCT_COMMERCIAL: 0.10
      EB_PCT_HOA: 0.12
      EB_PCT_EVENT: 0.00
    precision: "integer cents, round_half_up on the discount only"
    variants: []
  - name: compute_route_minutes
    trigger: "WorkOrder UNSCHEDULED→SCHEDULED (POST /work-orders/{id}/schedule)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding where order matters.
      # PIN: round EACH leg's drive time to whole minutes, THEN sum (round-per-leg).
      # "sum raw then round" is the WRONG order and is explicitly NOT used.
      visits = Visit rows of this WorkOrder ordered by stop_sequence ASC, ties by created_at ASC
      drive_minutes = sum over visits of round_half_up(visit.leg_distance_km / AVG_SPEED_KMH * 60)
      onsite_minutes = sum(visit.on_site_minutes for visit in visits)
      route_total_minutes = drive_minutes + onsite_minutes
    input_set: "all Visit rows belonging to the WorkOrder (PLANNED at schedule time)"
    constants:
      AVG_SPEED_KMH: 40
    precision: "whole minutes, round_half_up per leg before summing"
    variants: []
  - name: compute_damage_settlement
    trigger: "DamageReport OPEN→ASSESSED (POST /damage-reports/{id}/assess)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (c): circular-looking dependency, evaluation order PINNED.
      # 1) replacement_cost_cents = damaged_qty * InventoryItem.unit_replacement_cents
      # 2) base_pct = 0.20 if replacement_cost < 50000
      #             = 0.15 if 50000 <= replacement_cost < 150000
      #             = 0.10 if replacement_cost >= 150000
      # 3) effective_pct = max(base_pct - 0.05, 0.05) if the owning Contract is
      #    RENEWAL_OFFERED or has a SENT RenewalOffer (loyalty waiver, cross-entity),
      #    else base_pct
      # 4) labor_fee_cents = round_half_up(replacement_cost * effective_pct)
      # 5) settlement_total_cents = replacement_cost + labor_fee_cents
    input_set: "the single damaged InventoryItem and its unit_replacement_cents; the owning Contract's renewal posture for the waiver"
    constants:
      TIER_LOW_MAX: 50000
      TIER_MID_MAX: 150000
      PCT_LOW: 0.20
      PCT_MID: 0.15
      PCT_HIGH: 0.10
      LOYALTY_WAIVER: 0.05
      PCT_FLOOR: 0.05
    precision: "integer cents, round_half_up on labor_fee"
    variants:
      - name: standard
        when: "owning Contract not in a renewal posture"
        difference: "effective_pct == base_pct (no waiver)"
      - name: loyalty_waiver
        when: "owning Contract is RENEWAL_OFFERED or has a SENT RenewalOffer"
        difference: "effective_pct = max(base_pct - 0.05, 0.05)"
  - name: compute_renewal_price
    trigger: "PROVISIONAL at RenewalOffer creation; FINAL at RenewalOffer SENT→ACCEPTED"
    algorithm: forward_looking
    formula: |
      base = the offered Contract.total_amount_cents
      escalation_pct = 0.05 if contract_type in {COMMERCIAL, HOA} else 0.00   # EVENT not escalated
      escalated = round_half_up(base * (1 + escalation_pct))
      # PROVISIONAL: quote at offer time, excludes damage carry-forward.
      provisional_price_cents = escalated
      # FINAL: at acceptance, add unsettled damage carry-forward.
      unsettled = sum(dr.settlement_total_cents for dr in the contract's WorkOrders' DamageReports
                      with status == ASSESSED)            # ASSESSED-but-not-yet-SETTLED only
      final_price_cents = escalated + unsettled
    input_set: "PROVISIONAL: only the offered Contract.total_amount_cents and contract_type. FINAL: same plus the sum of settlement_total_cents over DamageReports in status ASSESSED for the contract's work orders"
    constants:
      ESCALATION_PCT: 0.05
    precision: "integer cents, round_half_up on escalation"
    variants:
      - name: provisional
        when: "RenewalOffer creation (offer time)"
        difference: "excludes unsettled-damage carry-forward — quote only"
      - name: final
        when: "RenewalOffer SENT→ACCEPTED (acceptance)"
        difference: "adds sum of ASSESSED DamageReport.settlement_total_cents; diverges from provisional whenever an ASSESSED-not-SETTLED report exists"
  - name: compute_crew_utilization
    trigger: "PLANNED on WorkOrder schedule/cancel; ACTUAL on WorkOrder complete"
    algorithm: weighted_scoring
    formula: |
      # PLANNED variant:
      busiest_date = the scheduled_date with the greatest summed route_total_minutes
                     among this crew's WorkOrders in schedule_status {SCHEDULED, DISPATCHED};
                     ties broken by earliest date ASC
      planned_minutes = sum(wo.route_total_minutes for those WorkOrders on busiest_date)
      planned_utilization_pct = round_half_up(planned_minutes / crew.daily_capacity_minutes * 100)
      # ACTUAL variant:
      actual_minutes = sum(visit.actual_minutes for visits in status COMPLETED
                           on this crew's COMPLETED WorkOrders' busiest_date)
      actual_utilization_pct = round_half_up(actual_minutes / crew.daily_capacity_minutes * 100)
    input_set: "PLANNED: SCHEDULED/DISPATCHED WorkOrders' route_total_minutes. ACTUAL: COMPLETED Visit.actual_minutes on COMPLETED WorkOrders"
    constants: {}
    precision: "integer percent, round_half_up; values above 100 indicate overbooking and are NOT capped"
    variants:
      - name: planned
        when: "WorkOrder schedule or cancel"
        difference: "uses scheduled route_total_minutes of SCHEDULED/DISPATCHED work orders"
      - name: actual
        when: "WorkOrder complete"
        difference: "uses Visit.actual_minutes of COMPLETED visits only; diverges from planned when actual differs from on_site estimates"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed ClientContact, X-User-ID equals the Client.id that owns the targeted Contract/Proposal/RenewalOffer"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ClientContact sign/accept/reject/decline operations"
  - priority: 4
    category: existence
    check: "every path-referenced resource exists (validated left-to-right in the path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "every FK in the request body references an existing resource"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/link endpoints"
  - priority: 6
    category: state
    check: "request body required fields present and well-typed; enums in allowed set; numeric constraints (quantity>=1, capacity>=1, released_on>stored_from)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 7
    category: state
    check: "OCC: expected_contract_version equals current Contract.version on guarded writes"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /design-proposals/{id}/accept, POST /contracts/{id}/renewal-offers"
  - priority: 8
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: business_constraint
    check: "contract_type must equal the owning Client.account_type on contract create"
    error_id: ERR_CONTRACT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /clients/{id}/contracts"
  - priority: 10
    category: business_referential
    check: "a DesignProposal accept requires the owning Contract in PROPOSED and no sibling already ACCEPTED"
    error_id: ERR_PROPOSAL_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /design-proposals/{id}/accept"
  - priority: 11
    category: business_referential
    check: "DamageReport assess requires the parent WorkOrder.job_type == TAKEDOWN and schedule_status == COMPLETED"
    error_id: ERR_DAMAGE_CONTEXT_INVALID
    http_status: 409
    applies_to: "POST /damage-reports/{id}/assess"
  - priority: 12
    category: business_safety
    check: "WorkOrder schedule may not double-book a crew: the requested scheduled_date must clear every other non-cancelled WorkOrder window on that crew by at least the 1-day buffer (closed-interval, buffer-strict)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 13
    category: business_temporal
    check: "StorageLot reservation may not exceed the bay's aggregate capacity over its half-open [stored_from, released_on) interval"
    error_id: ERR_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /storage-lots"
  - priority: 14
    category: business_constraint
    check: "WorkOrder schedule requires the owning Contract.status == ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 15
    category: business_temporal
    check: "RenewalOffer accept requires clock.now <= expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /renewal-offers/{id}/accept"
  - priority: 16
    category: business_constraint
    check: "SKU uniqueness on InventoryItem.sku and bay_code uniqueness on StorageBay.bay_code"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /inventory-items, POST /storage-bays"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "create a commercial/HOA/event account"
    roles: [AccountManager]
    code: 201
    input: [legal_name, account_type, contact_email, site_address]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "fetch a client account"
    roles: [AccountManager, FieldSupervisor, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "list clients (paginated)"
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "account_type?"]
    output: Client[]
    side_effects: []

  # ---- Contract (sub-resource of Client) ----
  - method: POST
    path: "/clients/{id}/contracts"
    description: "create a DRAFT contract for the client"
    roles: [AccountManager]
    code: 201
    input: [contract_type, season_year, early_bird_deadline, "custom_design_surcharge_cents?"]
    output: Contract
    side_effects: ["validates contract_type == Client.account_type"]
  - method: GET
    path: "/clients/{id}/contracts"
    description: "list a client's contracts (FK reverse-reachability for Contract.client_id)"
    roles: [AccountManager, FieldSupervisor, ClientContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Contract[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}"
    description: "fetch a contract with computed fee fields"
    roles: [AccountManager, FieldSupervisor, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "list/filter contracts; renewed_from_contract_id filter gives the renewal-chain reverse-reachability"
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "renewed_from_contract_id?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/contracts/{contract_id}/propose"
    description: "DRAFT→PROPOSED"
    roles: [AccountManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["increments Contract.version"]
  - method: POST
    path: "/clients/{id}/contracts/{contract_id}/sign"
    description: "PROPOSED→SIGNED; computes all fee fields"
    roles: [ClientContact]
    code: 200
    input: []
    output: Contract
    side_effects: ["compute_install_fee", "compute_storage_fee", "compute_contract_total", "increments Contract.version"]
  - method: POST
    path: "/clients/{id}/contracts/{contract_id}/activate"
    description: "SIGNED→ACTIVE"
    roles: [AccountManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["increments Contract.version"]
  - method: POST
    path: "/clients/{id}/contracts/{contract_id}/cancel"
    description: "ACTIVE→CANCELLED; cascades to non-terminal WorkOrders and StorageLots"
    roles: [AccountManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["cancels non-terminal WorkOrders", "releases RESERVED/STORED StorageLots", "increments Contract.version"]

  # ---- DesignProposal (sub-resource of Contract) ----
  - method: POST
    path: "/contracts/{id}/design-proposals"
    description: "create a DRAFT proposal under a contract"
    roles: [AccountManager]
    code: 201
    input: [theme, "is_custom?"]
    output: DesignProposal
    side_effects: []
  - method: GET
    path: "/contracts/{id}/design-proposals"
    description: "list a contract's proposals (FK reverse-reachability for DesignProposal.contract_id)"
    roles: [AccountManager, FieldSupervisor, ClientContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: DesignProposal[]
    side_effects: []
  - method: GET
    path: "/design-proposals/{id}"
    description: "fetch a proposal"
    roles: [AccountManager, FieldSupervisor, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: DesignProposal
    side_effects: []
  - method: POST
    path: "/design-proposals/{id}/line-items"
    description: "add a ProposalLineItem (decor SKU + qty + unit install)"
    roles: [AccountManager]
    code: 201
    input: [inventory_item_id, quantity, unit_install_cents]
    output: ProposalLineItem
    side_effects: ["recomputes DesignProposal.total_unit_count"]
  - method: GET
    path: "/design-proposals/{id}/line-items"
    description: "list a proposal's line items (FK reverse-reachability for ProposalLineItem.proposal_id)"
    roles: [AccountManager, FieldSupervisor, ClientContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ProposalLineItem[]
    side_effects: []
  - method: POST
    path: "/design-proposals/{id}/submit"
    description: "DRAFT→SUBMITTED"
    roles: [AccountManager]
    code: 200
    input: []
    output: DesignProposal
    side_effects: ["recomputes total_unit_count", "increments DesignProposal.version"]
  - method: POST
    path: "/design-proposals/{id}/accept"
    description: "SUBMITTED→ACCEPTED; supersedes sibling proposals; OCC-guarded on parent Contract"
    roles: [ClientContact]
    code: 200
    input: [expected_contract_version]
    output: DesignProposal
    side_effects: ["supersedes sibling DRAFT/SUBMITTED proposals", "increments Contract.version by 1", "increments DesignProposal.version"]
  - method: POST
    path: "/design-proposals/{id}/reject"
    description: "SUBMITTED→REJECTED"
    roles: [ClientContact]
    code: 200
    input: []
    output: DesignProposal
    side_effects: ["increments DesignProposal.version"]

  # ---- InventoryItem (catalog) ----
  - method: POST
    path: "/inventory-items"
    description: "create a catalog decor SKU"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, category, unit_replacement_cents, "reorder_threshold?", "on_hand_qty?"]
    output: InventoryItem
    side_effects: []
  - method: GET
    path: "/inventory-items/{id}"
    description: "fetch an inventory item"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []
  - method: GET
    path: "/inventory-items"
    description: "list catalog items"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "category?"]
    output: InventoryItem[]
    side_effects: []
  - method: GET
    path: "/inventory-items/{id}/proposal-line-items"
    description: "list every ProposalLineItem that references this SKU (FK reverse-reachability for ProposalLineItem.inventory_item_id)"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ProposalLineItem[]
    side_effects: []

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "create an installer crew"
    roles: [FieldSupervisor]
    code: 201
    input: [crew_name, daily_capacity_minutes, home_base_zip]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "fetch a crew with utilization fields"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews"
    description: "list crews"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Crew[]
    side_effects: []

  # ---- WorkOrder ----
  - method: POST
    path: "/work-orders"
    description: "create an UNSCHEDULED work order for a contract"
    roles: [FieldSupervisor]
    code: 201
    input: [contract_id, job_type]
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders/{id}"
    description: "fetch a work order (schedule_status + billing_status)"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "list/filter work orders; contract_id and crew_id filters give FK reverse-reachability for WorkOrder.contract_id and WorkOrder.crew_id"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "contract_id?", "crew_id?", "schedule_status?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/visits"
    description: "add a route Visit (leg) to a work order"
    roles: [FieldSupervisor]
    code: 201
    input: [stop_sequence, leg_distance_km, on_site_minutes]
    output: Visit
    side_effects: []
  - method: GET
    path: "/work-orders/{id}/visits"
    description: "list a work order's visits (FK reverse-reachability for Visit.work_order_id)"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/schedule"
    description: "UNSCHEDULED→SCHEDULED; assigns crew + date; computes route minutes; crew overlap check"
    roles: [FieldSupervisor]
    code: 200
    input: [crew_id, scheduled_date]
    output: WorkOrder
    side_effects: ["compute_route_minutes", "compute_crew_utilization PLANNED", "increments WorkOrder.version"]
  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "SCHEDULED→DISPATCHED"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["increments WorkOrder.version"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "DISPATCHED→COMPLETED; requires all visits terminal; recomputes crew ACTUAL utilization"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["compute_crew_utilization ACTUAL", "increments WorkOrder.version"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "UNSCHEDULED/SCHEDULED→CANCELLED; frees crew window if scheduled"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["frees crew window", "compute_crew_utilization PLANNED if was SCHEDULED", "increments WorkOrder.version"]
  - method: POST
    path: "/work-orders/{id}/invoice"
    description: "billing PENDING→INVOICED (requires schedule_status COMPLETED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["increments WorkOrder.version"]
  - method: POST
    path: "/work-orders/{id}/mark-paid"
    description: "billing INVOICED→PAID"
    roles: [AccountManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["increments WorkOrder.version"]

  # ---- Visit completion ----
  - method: POST
    path: "/visits/{id}/complete"
    description: "PLANNED→COMPLETED for one visit; records actual_minutes"
    roles: [FieldSupervisor]
    code: 200
    input: [actual_minutes]
    output: Visit
    side_effects: ["sets actual_minutes", "increments Visit.version"]
  - method: POST
    path: "/visits/{id}/skip"
    description: "PLANNED→SKIPPED for one visit"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Visit
    side_effects: ["increments Visit.version"]
  - method: GET
    path: "/visits/{id}"
    description: "fetch one visit"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: []

  # ---- StorageBay + StorageLot ----
  - method: POST
    path: "/storage-bays"
    description: "create a warehouse storage bay"
    roles: [FieldSupervisor]
    code: 201
    input: [bay_code, capacity_units]
    output: StorageBay
    side_effects: []
  - method: GET
    path: "/storage-bays/{id}"
    description: "fetch a storage bay"
    roles: [FieldSupervisor, AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: StorageBay
    side_effects: []
  - method: POST
    path: "/storage-lots"
    description: "reserve a storage lot for a contract on a bay over a half-open interval; aggregate-capacity overlap check"
    roles: [FieldSupervisor]
    code: 201
    input: [contract_id, storage_bay_id, unit_count, stored_from, released_on]
    output: StorageLot
    side_effects: ["validates bay aggregate capacity over interval"]
  - method: GET
    path: "/storage-lots/{id}"
    description: "fetch a storage lot"
    roles: [FieldSupervisor, AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: StorageLot
    side_effects: []
  - method: GET
    path: "/storage-lots"
    description: "list/filter storage lots; contract_id filter = FK reverse-reachability for StorageLot.contract_id; storage_bay_id filter = reverse-reachability for StorageLot.storage_bay_id"
    roles: [FieldSupervisor, AccountManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "contract_id?", "storage_bay_id?", "status?"]
    output: StorageLot[]
    side_effects: []
  - method: POST
    path: "/storage-lots/{id}/check-in"
    description: "RESERVED→STORED"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: StorageLot
    side_effects: ["increments StorageLot.version"]
  - method: POST
    path: "/storage-lots/{id}/release"
    description: "STORED→RELEASED; frees bay capacity"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: StorageLot
    side_effects: ["increments StorageLot.version"]

  # ---- DamageReport (sub-resource of WorkOrder) ----
  - method: POST
    path: "/work-orders/{id}/damage-reports"
    description: "open a damage report against a TAKEDOWN work order"
    roles: [FieldSupervisor]
    code: 201
    input: [inventory_item_id, damaged_qty]
    output: DamageReport
    side_effects: []
  - method: GET
    path: "/work-orders/{id}/damage-reports"
    description: "list a work order's damage reports (FK reverse-reachability for DamageReport.work_order_id)"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DamageReport[]
    side_effects: []
  - method: GET
    path: "/damage-reports/{id}"
    description: "fetch a damage report with settlement fields"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: []
    output: DamageReport
    side_effects: []
  - method: GET
    path: "/damage-reports"
    description: "list/filter damage reports; inventory_item_id filter = FK reverse-reachability for DamageReport.inventory_item_id"
    roles: [AccountManager, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "inventory_item_id?", "status?"]
    output: DamageReport[]
    side_effects: []
  - method: POST
    path: "/damage-reports/{id}/assess"
    description: "OPEN→ASSESSED; pins resolution_path; computes settlement"
    roles: [FieldSupervisor]
    code: 200
    input: [resolution_path]
    output: DamageReport
    side_effects: ["compute_damage_settlement", "increments DamageReport.version"]
  - method: POST
    path: "/damage-reports/{id}/settle"
    description: "ASSESSED→SETTLED; RESTOCK branch mints RestockOrder + decrements inventory"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["RESTOCK branch: mint RestockOrder, decrement InventoryItem.on_hand_qty", "increments DamageReport.version"]
  - method: POST
    path: "/damage-reports/{id}/void"
    description: "OPEN→VOID"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["increments DamageReport.version"]

  # ---- RestockOrder ----
  - method: GET
    path: "/restock-orders/{id}"
    description: "fetch a restock order"
    roles: [FieldSupervisor, PlatformAdmin]
    code: 200
    input: []
    output: RestockOrder
    side_effects: []
  - method: GET
    path: "/restock-orders"
    description: "list/filter restock orders; damage_report_id filter = FK reverse-reachability for RestockOrder.damage_report_id; inventory_item_id filter = reverse-reachability for RestockOrder.inventory_item_id"
    roles: [FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "damage_report_id?", "inventory_item_id?", "status?"]
    output: RestockOrder[]
    side_effects: []
  - method: POST
    path: "/restock-orders/{id}/fulfill"
    description: "REQUESTED→FULFILLED; replenishes InventoryItem.on_hand_qty by quantity"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["increments InventoryItem.on_hand_qty by quantity", "increments RestockOrder.version"]

  # ---- RenewalOffer ----
  - method: POST
    path: "/contracts/{id}/renewal-offers"
    description: "ACTIVE→RENEWAL_OFFERED; creates DRAFT offer with provisional price; OCC-guarded on Contract"
    roles: [AccountManager]
    code: 201
    input: [expires_at, expected_contract_version]
    output: RenewalOffer
    side_effects: ["compute_renewal_price PROVISIONAL", "increments Contract.version by 1"]
  - method: GET
    path: "/contracts/{id}/renewal-offers"
    description: "list a contract's renewal offers (FK reverse-reachability for RenewalOffer.contract_id)"
    roles: [AccountManager, ClientContact, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RenewalOffer[]
    side_effects: []
  - method: GET
    path: "/renewal-offers/{id}"
    description: "fetch a renewal offer"
    roles: [AccountManager, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: []
  - method: POST
    path: "/renewal-offers/{id}/send"
    description: "DRAFT→SENT"
    roles: [AccountManager]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["increments RenewalOffer.version"]
  - method: POST
    path: "/renewal-offers/{id}/accept"
    description: "SENT→ACCEPTED; computes FINAL price; mints new SIGNED Contract; expires old contract (depth-3 cascade)"
    roles: [ClientContact]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["compute_renewal_price FINAL", "mint new Contract", "old Contract.status:=EXPIRED", "increments RenewalOffer.version"]
  - method: POST
    path: "/renewal-offers/{id}/decline"
    description: "SENT→DECLINED; reverts parent Contract to ACTIVE"
    roles: [ClientContact]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["parent Contract.status:=ACTIVE", "increments RenewalOffer.version"]
  - method: POST
    path: "/renewal-offers/{id}/expire"
    description: "SENT→EXPIRED when clock.now > expires_at; reverts parent Contract to ACTIVE"
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["parent Contract.status:=ACTIVE", "increments RenewalOffer.version"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock used for early-bird deadline and offer-expiry checks. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets the logical clock"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "ClientContact X-User-ID is not the Client that owns the target contract/proposal/offer"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a body FK references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing/mistyped field, bad enum, or violated numeric constraint (quantity<1, capacity<1, released_on<=stored_from)"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version != current Contract.version on an OCC-guarded write"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the resource's current state"
  - id: ERR_CONTRACT_TYPE_MISMATCH
    http: 422
    condition: "contract_type on create does not equal the owning Client.account_type"
  - id: ERR_PROPOSAL_ALREADY_DECIDED
    http: 409
    condition: "accept attempted while a sibling proposal under the same contract is already ACCEPTED, or contract not in PROPOSED"
  - id: ERR_DAMAGE_CONTEXT_INVALID
    http: 409
    condition: "damage assess when the parent work order is not a COMPLETED TAKEDOWN"
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "scheduling would place a crew within the 1-day buffer of an existing non-cancelled window"
  - id: ERR_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "storage-lot reservation pushes overlapping aggregate unit_count above the bay capacity over the half-open interval"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "work-order schedule attempted while owning contract is not ACTIVE"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "renewal-offer accept attempted after expires_at (clock.now > expires_at)"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "InventoryItem.sku or StorageBay.bay_code collides with an existing value"
  - id: ERR_VISITS_NOT_COMPLETE
    http: 409
    condition: "work-order complete attempted while a Visit is still PLANNED"
  - id: ERR_WORKORDER_NOT_COMPLETED
    http: 409
    condition: "billing invoice attempted while schedule_status != COMPLETED"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: AccountManager
    description: "owns the sales surface — clients, contracts, proposals authoring, renewals, billing"
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{id}/contracts (and propose/activate/cancel)"
      - "POST /contracts/{id}/design-proposals + line-items + submit"
      - "POST /work-orders/{id}/invoice, /mark-paid"
      - "POST /contracts/{id}/renewal-offers, /renewal-offers/{id}/send"
    shared_operations:
      - "GET reads on clients/contracts/proposals/work-orders/crews/storage/damage/restock/renewal"
      - "POST /renewal-offers/{id}/expire (shared with PlatformAdmin)"
  - name: FieldSupervisor
    description: "owns the operations surface — crews, work orders, visits, storage logistics, damage assessment"
    identity: opaque
    exclusive_operations:
      - "POST /crews"
      - "POST /work-orders + visits + schedule/dispatch/complete/cancel"
      - "POST /visits/{id}/complete, /skip"
      - "POST /storage-bays, /storage-lots + check-in/release"
      - "POST /work-orders/{id}/damage-reports + assess/settle/void"
    shared_operations:
      - "GET reads on operational resources"
  - name: ClientContact
    description: "the client-side signer; signs contracts, accepts/rejects proposals, accepts/declines renewals"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /clients/{id}/contracts/{contract_id}/sign"
      - "POST /design-proposals/{id}/accept, /reject"
      - "POST /renewal-offers/{id}/accept, /decline"
    shared_operations:
      - "GET reads on own client's contracts/proposals/renewal-offers"
  - name: PlatformAdmin
    description: "operator for catalog, restock fulfillment, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /inventory-items"
      - "POST /restock-orders/{id}/fulfill"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /renewal-offers/{id}/expire (shared with AccountManager)"
