  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_maintenance_resubmit
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OUTSIDE_FILING_WINDOW]
        distinguishing_aspect: |
          Pair state vs business_temporal: a re-submitted MaintenanceFiling already in
          SUBMITTED (state violation) while the clock sits beyond the grace window
          (temporal violation) MUST surface ERR_INVALID_STATE (priority 5), not
          ERR_OUTSIDE_FILING_WINDOW (priority 10).
        test_recipe:
          setup:
            - "Client; record REGISTERED 2026-08-10 with classes [9]; one VERIFIED evidence item (specimen 2031-06-01); filing created and SUBMITTED at clock 2031-09-01; clock then advanced beyond grace close (2033-03-01)"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/register"
              payload: { registration_date: "2026-08-10T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/evidence-items"
              payload: { nice_class: 9, specimen_type: LABEL, specimen_date: "2031-06-01T00:00:00Z" }
              as: Paralegal
              as_user_id: para_1
              captures: { ev_id: $.data.id }
            - call: "POST /brand/evidence-items/${ev_id}/verify"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/trademark-records/${rec_id}/maintenance-filings"
              payload: { filing_type: SECTION_8, evidence_item_ids: ["${ev_id}"] }
              as: Paralegal
              captures: { fil_id: $.data.id }
            - call: "POST /brand/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brand/maintenance-filings/${fil_id}/submit"
