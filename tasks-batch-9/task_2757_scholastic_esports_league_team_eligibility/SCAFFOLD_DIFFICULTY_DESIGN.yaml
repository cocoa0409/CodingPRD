          setup:
            - "One district, school, three coaches and three DRAFT teams in one season (no registration needed: POST /matches has no team-state precondition)"
            - "One match Alpha vs Bravo, forfeited by Bravo, which sets result_status ADJUDICATED and dispute_deadline_at = 2026-08-03T00:00:00.000Z"
            - "Coach Alpha files a dispute inside the window, which the league accepts for review"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default throughout"
