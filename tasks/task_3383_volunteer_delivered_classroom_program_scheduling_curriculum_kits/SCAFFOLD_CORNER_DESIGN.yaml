  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_read_after_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_/ja-programs/districts/{district_id}
        distinguishing_aspect: "Immediate consistency: a district mutation is fully visible in the very next read — the ACTIVATE response and the following GET agree on relationship_status PARTNER and the bumped version, with no reconciliation lag."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office; district PROSPECT (version 1)."
          setup_api_calls:
            - *clk
            - *office
            - *dist
          trigger:
            - call: "POST /ja-programs/districts/${dist_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
              captures: { after: $.data }
            - call: "GET /ja-programs/districts/${dist_id}"
              payload: {}
              as: Funder
              captures: { readback: $.data }
          assert:
            - "the ACTIVATE response shows relationship_status == PARTNER and version == 2"
            - "the immediately following GET returns relationship_status == PARTNER and version == 2 (same request stream, no staleness)"
            - "updated_at on the readback is >= the create-time updated_at"

  - section: errors
    instances:
      - name: corner_record_funding_exact_pledge_then_overflow_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.PartnershipAgreement.ACTIVE_to_ACTIVE
          - errors.ERR_FUNDING_EXCEEDS_PLEDGE
        distinguishing_aspect: "The funding cap is inclusive at the pledge: RECORD_FUNDING of the full 175000 against a 175000 pledge succeeds (received == pledged), and a further 1-cent record is rejected 422 ERR_FUNDING_EXCEEDS_PLEDGE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain (no volunteers needed); program JA-BIZ; agreement (pledge 175000) ACTIVE with funding_received_cents == 0."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
          trigger:
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "RECORD_FUNDING", amount_cents: 175000 }
              as: AreaDirector
              captures: { funded: $.data }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "RECORD_FUNDING", amount_cents: 1 }
              as: AreaDirector
              captures: { err: $.data }
          assert:
            - "RECORD_FUNDING 175000 succeeds: funding_received_cents == 175000 == funding_pledged_cents (inclusive boundary)"
            - "RECORD_FUNDING 1 on top: 422 ERR_FUNDING_EXCEEDS_PLEDGE"
            - "funding_received_cents remains 175000 after the rejection"
