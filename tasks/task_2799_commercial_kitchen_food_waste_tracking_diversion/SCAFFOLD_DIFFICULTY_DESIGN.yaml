            - "The first reject returns status OPEN, rejection_count == 1, rejection_note 'June 11 service was omitted', and the setup GET immediately afterwards shows baseline_entry_count 0, baseline_waste_grams 0, baseline_waste_kg null, baseline_meals_served 0, baseline_intensity_kg_per_1k_meals null and baseline_cost_cents 0 — every frozen metric was cleared, not retained."
            - "The second submit re-derives DIFFERENT numbers from the enlarged source set: baseline_entry_count 4, baseline_waste_grams 3500, baseline_waste_kg 3.500, baseline_meals_served 350 (both shifts are CLOSED), baseline_intensity_kg_per_1k_meals 10.000 and baseline_cost_cents 1681 (1576 + 105)."
            - "The second reject returns rejection_count == 2 and clears the metrics again; the third submit reproduces the 3500 g / 350 meals / 10.000 / 1681 figures exactly, because the source rows did not change between laps."
            - "The trigger returns status CERTIFIED with certified_at == 2026-08-01T00:00:00Z (the default logical clock), rejection_count still 2, and the four frozen metrics unchanged by certification."
            - "POST /baseline-periods/${period_id}/reject after the trigger returns 409 ERR_INVALID_BASELINE_STATE — CERTIFIED is terminal and the loop cannot be re-entered."
            - "POST /baseline-periods/${period_id}/submit after the trigger also returns 409 ERR_INVALID_BASELINE_STATE."

  # =======================================================================
  - rule_id: transitive_cascade
    mechanism: |
      Three different single writes each detonate a chain in which every hop is
      caused by the PREVIOUS hop's output, not by the request:
      (1) POST /waste-entries/{id}/void — depth 4: entry status -> Shift
          intensity -> CoachingAlert AUTO_RESOLVED -> Site.open_alert_count and
          Site.coaching_posture;
      (2) POST /hauler-tickets/{id}/accept — depth 3: consignment settlement flip
          -> Site.diverted_weight_grams_settled / diversion_rate_pct ->
          ReductionTarget.attainment_state;
      (3) POST /shifts/{id}/close — depth 4 on a money path: shift status ->
          per-entry RECIPE_FINAL revaluation -> Site.valued_waste_cost_cents,
          with a parallel hop 3/4 that expires the OPEN alert and repostures the
          site.
      Each chain crosses a different set of entities, so an implementation that
      hard-codes one propagation path still fails the other two.
    instances:

      - name: void_entry_cascades_four_hops_to_site_coaching_posture
        grounds: "§1.2 state_machines.WasteEntry.RECORDED_to_VOIDED side effects CASCADE hop 1..4; §1.2 state_machines.CoachingAlert.OPEN_to_AUTO_RESOLVED; §1.3 calculations.shift_waste_intensity, coaching_alert_trigger, site_waste_aggregates."
        distinguishing_aspect: "Depth 4, and the chain is a REMOVAL: the trigger deletes a row from the aggregation set, which drags the intensity BELOW the coaching threshold, which retires an alert, which reposture the site. Hops 3 and 4 are conditional — they fire only because 8.800 < 12.000 — so an implementation that recomputes aggregates but never revisits alerts stops at hop 2 with open_alert_count stuck at 1."
        test_recipe:
          setup: |
            Site with target_intensity_kg_per_1k_meals 10.000 and ONE ACTIVE PREP station.
            FT_PREP (640 c/kg) and FT_SPOIL (210 c/kg). Shift 2026-06-10 AM meals_served 250 with
            three captures 1200 g + 1000 g + 800 g = 3000 g, so intensity is exactly 12.000 and one
            INTENSITY_BREACH alert is OPEN. The shift is left OPEN.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE", target_intensity_kg_per_1k_meals: 10.000 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Mixed Produce Trim", category: "PRODUCE", default_cost_per_kg_cents: 210, donation_eligible: false, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 12 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { spoil_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1200, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:05:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${spoil_type_id}", weight_grams: 800, loss_reason: "SPOILAGE", captured_at: "2026-06-10T10:10:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { third_entry_id: "$.data.id" }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "GET /coaching-alerts?shift_id=${shift_id}"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { alert_id: "$.data[0].id" }
          trigger:
            - call: "POST /waste-entries/${third_entry_id}/void"
              payload: { void_reason: "duplicate of the 10:05 weigh-in" }
              as: ShiftLead
              as_user_id: "sl-1"
          assert:
            - "Before the trigger, the setup GET /sites/${site_id} returns total_captured_weight_grams == 3000, valued_waste_cost_cents == 1576 (768 + 640 + 168), open_alert_count == 1 and coaching_posture == INTERVENTION."
            - "Before the trigger, GET /coaching-alerts?shift_id=${shift_id} returns total_count == 1 with status OPEN, alert_type INTENSITY_BREACH, severity MEDIUM and observed_intensity == 12.000."
            - "HOP 1 — the trigger response returns status VOIDED with void_reason set and version == 2."
            - "HOP 2 — GET /shifts/${shift_id} now returns shift_waste_grams == 2200 and waste_intensity_kg_per_1k_meals == 8.800; leaderboard_score is still null because the shift is OPEN, so the removal did not leak into scoring."
            - "HOP 3 — GET /coaching-alerts/${alert_id} now returns status AUTO_RESOLVED with resolved_at == 2026-08-01T00:00:00Z; observed_intensity stays 12.000 (the historical observation is not rewritten to 8.800)."
            - "HOP 4 — GET /sites/${site_id} now returns open_alert_count == 0 and coaching_posture == MONITORING."
            - "Direct effect of hop 1 — the same site read returns total_captured_weight_grams == 2200 and valued_waste_cost_cents == 1408 (768 + 640)."
            - "GET /waste-entries?shift_id=${shift_id} returns total_count == 3; the voided row still exists and only left the aggregation set."

      - name: accept_ticket_cascades_three_hops_to_flip_reduction_target_attainment
        grounds: "§1.2 state_machines.DiversionConsignment.settlement.TICKET_SUBMITTED_to_SETTLED side effects CASCADE hop 1..3; §1.3 calculations.site_waste_aggregates, reduction_attainment; §1.1 ReductionTarget.attainment_state."
