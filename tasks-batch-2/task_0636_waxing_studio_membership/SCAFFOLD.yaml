    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/studio/memberships/{id}/activate"
    description: "Activate a PENDING membership: anchor cycle and grant first cycle credits."
    roles: [StudioAdmin, FrontDesk]
    code: 200
    input: []
    output: Membership
    side_effects: ["status PENDING->ACTIVE", "GRANT ledger entry", "recompute credit_balance", "increments Membership.version by 1"]

  - method: POST
    path: "/studio/memberships/{id}/freeze"
    description: "Freeze an ACTIVE membership; park credits."
    roles: [Member, FrontDesk, StudioAdmin]
    code: 200
    input: [freeze_days]
    output: Membership
    side_effects: ["status ACTIVE->FROZEN", "FREEZE_PARK ledger entry", "set freeze_until_utc", "recompute credit_balance", "increments Membership.version by 1"]

  - method: POST
    path: "/studio/memberships/{id}/unfreeze"
    description: "Unfreeze a FROZEN membership; restore parked credits."
    roles: [Member, FrontDesk, StudioAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["status FROZEN->ACTIVE", "UNFREEZE_RESTORE ledger entry", "clear freeze_until_utc", "recompute credit_balance", "increments Membership.version by 1"]

  - method: POST
    path: "/studio/memberships/{id}/renew"
    description: "Renew a membership cycle: rollover settlement + grant (SUCCEEDED) or move to PAST_DUE (FAILED)."
    roles: [StudioAdmin, FrontDesk]
    code: 200
    input: [payment_outcome]
    output: Membership
    side_effects: ["ACTIVE->ACTIVE / PAST_DUE->ACTIVE / ACTIVE->PAST_DUE", "ROLLOVER_FORFEIT + GRANT ledger entries on SUCCEEDED", "advance cycle_anchor_utc + cycle_index on SUCCEEDED", "recompute credit_balance", "increments Membership.version by 1"]

  - method: POST
    path: "/studio/memberships/{id}/cancel"
    description: "Cancel a membership; forfeit remaining credits to wallet store-credit and cascade-cancel its open CREDIT reservations."
    roles: [Member, FrontDesk, StudioAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["status ->CANCELLED", "cascade cancel open CREDIT reservations -> REFUND entries", "remaining credits -> Member.wallet_credit_cents at 100c/credit", "recompute credit_balance to 0", "increments Membership.version by 1"]

  - method: GET
    path: "/studio/memberships/{id}/ledger"
    description: "List the credit ledger entries for a membership (FK reverse-reachability for CreditLedgerEntry.membership_id)."
    roles: [StudioAdmin, FrontDesk, Member]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []

  # ---- Reservations ----
  - method: POST
    path: "/studio/reservations"
    description: "Book a reservation. Validates hours, certification, overlaps (room + technician), credit/deposit gating, OCC against Room and Membership."
    roles: [Member, FrontDesk]
    code: 201
    input: [member_id, location_id, room_id, technician_id, service_type_id, start_utc, payment_method, expected_room_version, "membership_id?", "expected_membership_version?"]
    output: Reservation
    side_effects:
      - "booking_status=BOOKED"
      - "settlement axis -> CREDIT_HELD (CREDIT) / DEPOSIT_HELD (DEPOSIT) / UNSETTLED (INTRO_FREE/WALK_IN)"
      - "CREDIT: DEBIT ledger entry -credit_cost; sets credits_held; increments Membership.version by 1"
      - "DEPOSIT: sets deposit_held_cents = Location.deposit_required_cents"
      - "computes end_utc and provisional charged_amount_cents (calc reservation_charge)"
      - "holds room/technician slot; increments Room.version by 1"

  - method: GET
    path: "/studio/reservations/{id}"
    description: "Get a reservation."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/studio/reservations"
    description: "List reservations; filter by member_id, location_id, room_id, technician_id, service_type_id, membership_id (FK reverse-reachability for all six Reservation FKs)."
    roles: [StudioAdmin, FrontDesk, Technician, Member]
    code: 200
    input: ["member_id?", "location_id?", "room_id?", "technician_id?", "service_type_id?", "membership_id?", "booking_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/studio/reservations/{id}/check-in"
    description: "Check a member in (BOOKED->CHECKED_IN)."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status BOOKED->CHECKED_IN", "increments Reservation.version by 1"]

  - method: POST
    path: "/studio/reservations/{id}/complete"
    description: "Complete a visit (CHECKED_IN->COMPLETED); finalize charge, consume credits, set intro_used if INTRO_FREE."
    roles: [FrontDesk, Technician]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status CHECKED_IN->COMPLETED", "settlement -> PAID", "finalize charged_amount_cents (calc reservation_charge)", "INTRO_FREE -> Member.intro_used=true", "increments Reservation.version by 1"]

  - method: POST
    path: "/studio/reservations/{id}/cancel"
    description: "Cancel a reservation; timely (>=24h) refunds, late (<24h) forfeits and mints a LATE_CANCEL strike."
    roles: [Member, FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status ->CANCELLED", "settlement -> REFUNDED (timely) or FORFEITED (late)", "timely CREDIT: REFUND ledger entry; timely DEPOSIT: deposit -> wallet", "late: mint NoShowStrike LATE_CANCEL", "void PENDING attached RetailSales", "increments Reservation.version by 1"]

  - method: POST
    path: "/studio/reservations/{id}/mark-no-show"
    description: "Mark a BOOKED reservation as a no-show (forfeit + NO_SHOW strike)."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status BOOKED->NO_SHOW", "settlement -> FORFEITED", "mint NoShowStrike NO_SHOW", "void PENDING attached RetailSales", "increments Reservation.version by 1"]

  # ---- Retail sales ----
  - method: POST
    path: "/studio/retail-sales"
    description: "Attach a retail product purchase to a reservation (PENDING)."
    roles: [Member, FrontDesk]
    code: 201
    input: [member_id, reservation_id, product_id, quantity]
    output: RetailSale
    side_effects: ["status=PENDING; no stock change yet; computes provisional gross/discount/net (calc retail_net)"]

  - method: GET
    path: "/studio/retail-sales/{id}"
    description: "Get a retail sale."
    roles: [StudioAdmin, FrontDesk, Member]
    code: 200
    input: []
    output: RetailSale
    side_effects: []

  - method: GET
    path: "/studio/retail-sales"
    description: "List retail sales; filter by member_id, reservation_id, product_id (FK reverse-reachability for RetailSale FKs)."
    roles: [StudioAdmin, FrontDesk, Member]
    code: 200
    input: ["member_id?", "reservation_id?", "product_id?", "status?", "limit?", "offset?"]
    output: RetailSale[]
    side_effects: []

  - method: POST
    path: "/studio/retail-sales/{id}/confirm"
    description: "Confirm a PENDING retail sale (requires the visit COMPLETED + stock); decrements stock."
    roles: [FrontDesk]
    code: 200
    input: ["expected_product_version"]
    output: RetailSale
    side_effects: ["status PENDING->CONFIRMED", "decrement Product.stock_qty", "finalize net_cents (calc retail_net)", "increments RetailSale.version by 1"]

  - method: POST
    path: "/studio/retail-sales/{id}/void"
    description: "Void a PENDING retail sale."
    roles: [FrontDesk]
    code: 200
    input: []
    output: RetailSale
    side_effects: ["status PENDING->VOIDED", "increments RetailSale.version by 1"]

  # ---- No-show strikes ----
  - method: GET
    path: "/studio/no-show-strikes/{id}"
    description: "Get a no-show strike."
    roles: [StudioAdmin, FrontDesk, Member]
    code: 200
    input: []
    output: NoShowStrike
    side_effects: []

  - method: GET
    path: "/studio/no-show-strikes"
    description: "List no-show strikes; filter by member_id, reservation_id (FK reverse-reachability for NoShowStrike FKs)."
    roles: [StudioAdmin, FrontDesk, Member]
    code: 200
    input: ["member_id?", "reservation_id?", "status?", "limit?", "offset?"]
    output: NoShowStrike[]
    side_effects: []

  - method: POST
    path: "/studio/no-show-strikes/{id}/waive"
    description: "Waive an ACTIVE strike (StudioAdmin); refunds fee to wallet, recomputes strike count."
    roles: [StudioAdmin]
    code: 200
    input: []
    output: NoShowStrike
    side_effects: ["status ACTIVE->WAIVED", "refund fee to Member.wallet_credit_cents", "recompute Member.no_show_strike_count"]

  # ---- Test-driving clock + scheduled sweeps ----
  - method: POST
    path: "/studio/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default (never real wall-clock). Advancing the clock runs scheduled sweeps: no-show sweep (BOOKED past start+15m -> NO_SHOW), strike expiry (ACTIVE strikes past 90d -> EXPIRED), freeze auto-expiry (FROZEN past freeze_until_utc -> ACTIVE), and due renewals."
    roles: [StudioAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Sets logical clock to to_iso8601"
      - "Runs no-show sweep, strike-expiry sweep, freeze-expiry sweep across all entities"

  - method: POST
    path: "/studio/_clock/run_sweeps"
    description: "Idempotently re-run the scheduled sweeps at the current clock without changing the clock (no-show, strike expiry, freeze expiry)."
    roles: [StudioAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "Runs no-show sweep, strike-expiry sweep, freeze-expiry sweep"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity-backed role acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range integer (e.g. quantity<=0, freeze_days outside [1,90])" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (any state field)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on a guarded write" }
  - { id: ERR_RESOURCE_MISMATCH, http: 409, condition: "Cross-entity coherence broken: room/tech not at the reservation location, tech not certified for service, inactive room/tech/service, membership/payment_method mismatch, membership owner != member" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "CREDIT booking against a non-ACTIVE membership" }
  - { id: ERR_OUTSIDE_HOURS, http: 409, condition: "Reservation slot falls outside the location open/close window or start is in the past" }
  - { id: ERR_INTRO_NOT_ELIGIBLE, http: 409, condition: "INTRO_FREE requested but intro already used or service not intro-eligible" }
  - { id: ERR_DEPOSIT_REQUIRED, http: 409, condition: "CREDIT booking blocked because member has >=2 active strikes (non-UNLIMITED); must use DEPOSIT" }
  - { id: ERR_TECH_DOUBLE_BOOKED, http: 409, condition: "Technician slot overlaps an existing non-terminal reservation (no buffer; closed-open)" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Room buffered window overlaps an existing non-terminal reservation (buffer-inclusive)" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 409, condition: "CREDIT booking exceeds available membership credit balance (non-UNLIMITED)" }
  - { id: ERR_OUT_OF_STOCK, http: 409, condition: "Retail confirm requested quantity exceeds Product.stock_qty" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member email already registered" }
  - { id: ERR_CHECKIN_TOO_EARLY, http: 409, condition: "Check-in attempted earlier than 30 minutes before start_utc" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset out of allowed range (limit 1..100, offset >= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioAdmin
    description: "Cross-location operator: manages config (locations, rooms, technicians, service types, products) and strike waivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /studio/locations"
      - "POST /studio/service-types"
      - "PATCH /studio/service-types/{id}"
      - "POST /studio/products"
      - "POST /studio/rooms"
      - "POST /studio/technicians"
      - "POST /studio/no-show-strikes/{id}/waive"
      - "POST /studio/_clock/set_current_utc"
      - "POST /studio/_clock/run_sweeps"
    shared_operations:
      - "POST /studio/members (with FrontDesk)"
      - "POST /studio/memberships and lifecycle (with FrontDesk; freeze/unfreeze/cancel also Member)"
      - "GET endpoints (read access to all resources)"

  - name: FrontDesk
    description: "Per-location desk operator: registers members, manages memberships, books and runs reservations, handles retail."
    identity: "opaque"
    exclusive_operations:
      - "POST /studio/reservations/{id}/check-in"
      - "POST /studio/reservations/{id}/mark-no-show"
      - "POST /studio/retail-sales/{id}/confirm"
      - "POST /studio/retail-sales/{id}/void"
      - "POST /studio/memberships/{id}/activate"
      - "POST /studio/memberships/{id}/renew"
    shared_operations:
      - "POST /studio/members (with StudioAdmin)"
      - "POST /studio/reservations (with Member)"
      - "POST /studio/reservations/{id}/complete (with Technician)"
      - "POST /studio/reservations/{id}/cancel (with Member)"
      - "POST /studio/retail-sales (with Member)"
      - "POST /studio/memberships/{id}/freeze|unfreeze|cancel (with Member, StudioAdmin)"
      - "GET endpoints"

  - name: Technician
    description: "Service provider: completes visits assigned to self; reads schedule."
    identity: "entity_backed:Technician"
    exclusive_operations: []
    shared_operations:
      - "POST /studio/reservations/{id}/complete (with FrontDesk; only on reservations where technician_id == X-User-ID)"
      - "GET endpoints (read access)"

  - name: Member
    description: "Customer acting on own resources: books for self, manages own membership freeze/unfreeze/cancel, attaches retail, cancels own reservation."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /studio/reservations (with FrontDesk; only member_id == X-User-ID)"
      - "POST /studio/reservations/{id}/cancel (with FrontDesk; only own reservation)"
      - "POST /studio/retail-sales (with FrontDesk; only own member_id)"
      - "POST /studio/memberships/{id}/freeze|unfreeze|cancel (with FrontDesk, StudioAdmin; only own membership)"
      - "GET endpoints for own resources"
