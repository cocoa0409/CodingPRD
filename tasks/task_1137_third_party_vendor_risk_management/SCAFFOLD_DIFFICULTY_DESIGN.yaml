      - name: dd_package_reject_resubmit_cycle
        grounds:
          - state_machines.DueDiligencePackage.transitions
        distinguishing_aspect: |
          Entity = DueDiligencePackage. Cycle: DRAFT → SUBMITTED → UNDER_REVIEW
          → REJECTED → SUBMITTED → UNDER_REVIEW → APPROVED. The loop is
          bounded by review_round < 3; the test exercises one full loop and
          asserts review_round incremented from 1 to 2.
        test_recipe:
          setup:
            - "Vendor, engagement, and DD package exist; package has been submitted, begun review, and rejected once."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Cycle Vendor", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_cyc: $.data.id }
