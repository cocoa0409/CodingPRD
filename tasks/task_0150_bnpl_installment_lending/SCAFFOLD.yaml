# =============================================================================
# task_0150_bnpl_installment_lending — SCAFFOLD.yaml (§1.0–§1.7)
# =============================================================================

scenario: |
  150. BNPL / Installment Lending: soft-credit eligibility, installment plan
  (Pay-in-4/monthly), down payment, repayment/autopay schedule, late
  fee/delinquency, partial-return reallocation, merchant settlement/MDR, Reg Z
  disclosure

domain_name: bnpl-installment-lending
api_prefix: ""   # flat top-level collections (/merchants, /borrowers, /applications, /loans, ...)

# Primary archetype: ledger-reconciliation (the same financed principal yields
# divergent per-installment numbers under Pay-in-4 even-split vs monthly amortized
# interest; a partial return reallocates the ledger two valid ways). Secondary:
# compliance/audit (Reg Z disclosure acceptance gates loan activation; autopay and
# settlement carry a tamper-evident trail). Topology is FLAT (peer entities linked
# by foreign keys, no nested URL ownership) to prioritize the under-represented
# pattern. State-machine shapes are non-linear on distinct entities: Application is
# branching (fork to APPROVED / DECLINED / COUNTERED with a revision loop back to
# SUBMITTED), and Loan carries two parallel state dimensions (lifecycle `status` and
# `delinquency_status`) that evolve independently on the same row.
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel        # Loan: status × delinquency_status; Application is branching/cyclic
  relationship_patterns:
    - one_to_many                       # Loan -> Installment, Loan -> Payment
    - flat                              # Application/Loan/Settlement linked by FK, no URL nesting
    - cross_aggregate                   # Return on a Loan claws back a prior MerchantSettlement
  role_model: peer_roles                # Borrower owns applications/payments; Merchant owns its loans/settlements; Servicer is operational
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Merchant
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: display_name, type: string, source: input, description: "Merchant legal/display name" }
      - { name: mdr_bps, type: integer, source: input, description: "Merchant discount rate in basis points applied to financed principal at settlement; 0..1000", constraints: "0 <= mdr_bps <= 1000" }
      - { name: settlement_hold_days, type: integer, source: input, default: 2, description: "Whole days a loan's settlement is held after activation before it may be released; 0..30", constraints: "0 <= settlement_hold_days <= 30" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — suspended merchants cannot originate new applications", default: ACTIVE, constraints: "ACTIVE,SUSPENDED" }
      - { name: gross_financed_cents, type: integer, source: computed, description: "Running sum of financed_principal_cents across this merchant's loans whose status IN {ACTIVE, PAID_OFF, DELINQUENT, DEFAULTED}" }
      - { name: net_settled_cents, type: integer, source: computed, description: "Running sum of net_settlement_cents across this merchant's MerchantSettlement rows whose status == RELEASED, minus clawbacks" }

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Borrower full name" }
      - { name: email, type: string, source: input, description: "Borrower email; unique across borrowers", constraints: "unique" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported annual income in cents; soft-credit input", constraints: ">= 0" }
      - { name: soft_credit_score, type: integer, source: input, description: "Soft-pull credit score 300..850 supplied at registration", constraints: "300 <= soft_credit_score <= 850" }
      - { name: eligible_credit_limit_cents, type: integer, source: computed, description: "Provisional soft-credit limit derived from soft_credit_score and annual_income_cents (see calculations.eligibility_limit). Recomputed only at registration; static thereafter" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "Sum of remaining_principal_cents over this borrower's loans whose status IN {ACTIVE, DELINQUENT}" }
      - { name: available_credit_cents, type: integer, source: computed, description: "eligible_credit_limit_cents - outstanding_principal_cents; never below 0" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; the applying borrower" }
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; the originating merchant" }
      - { name: cart_amount_cents, type: integer, source: input, description: "Total cart price the borrower wants to finance", constraints: "> 0" }
      - { name: plan_type, type: enum, source: input, description: "PAY_IN_4 | MONTHLY — installment plan family", constraints: "PAY_IN_4,MONTHLY" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly installments; REQUIRED and 3..24 when plan_type==MONTHLY, MUST be omitted for PAY_IN_4 (fixed at 4 bi-weekly installments)", constraints: "3 <= term_months <= 24 for MONTHLY" }
      - { name: requested_down_payment_cents, type: integer, source: input, default: 0, description: "Down payment the borrower offers up front; 0 allowed", constraints: ">= 0 and < cart_amount_cents" }
      - { name: apr_bps, type: integer, source: computed, description: "Annual percentage rate in basis points: 0 for PAY_IN_4; for MONTHLY = 1990 (constant) — pinned by calculations.finance_charge" }
      - { name: financed_principal_cents, type: integer, source: computed, description: "cart_amount_cents - approved_down_payment_cents (provisional value uses requested_down_payment_cents; final set at approval)" }
      - { name: approved_down_payment_cents, type: integer, source: computed, description: "Down payment fixed at approval; may be raised above requested when eligibility requires (see calculations.eligibility_limit final variant)" }
      - { name: finance_charge_cents, type: integer, source: computed, description: "Total Reg Z finance charge (sum of interest across the schedule); 0 for PAY_IN_4" }
      - { name: total_of_payments_cents, type: integer, source: computed, description: "financed_principal_cents + finance_charge_cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | COUNTERED | DECLINED | ACTIVATED | WITHDRAWN", default: SUBMITTED, constraints: "SUBMITTED,APPROVED,COUNTERED,DECLINED,ACTIVATED,WITHDRAWN" }
      - { name: decline_reason, type: enum, source: computed, required: false, description: "INSUFFICIENT_CREDIT | MERCHANT_SUSPENDED | DOWN_PAYMENT_TOO_LOW — set on DECLINED" }

  - name: DisclosureAcceptance
    parent: null
    common_fields: false   # immutable audit record: id + created_at only
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application being disclosed" }
      - { name: disclosed_apr_bps, type: integer, source: system, description: "Snapshot of Application.apr_bps at disclosure time (Reg Z)" }
      - { name: disclosed_finance_charge_cents, type: integer, source: system, description: "Snapshot of Application.finance_charge_cents (Reg Z amount-of-finance-charge box)" }
      - { name: disclosed_total_of_payments_cents, type: integer, source: system, description: "Snapshot of Application.total_of_payments_cents (Reg Z total-of-payments box)" }
      - { name: disclosed_installment_count, type: integer, source: system, description: "Number of scheduled installments disclosed" }
      - { name: accepted, type: boolean, source: input, description: "true => borrower accepts the Reg Z disclosure; false is rejected (ERR_DISCLOSURE_NOT_ACCEPTED)" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the activated application that originated this loan" }
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; copied from the application" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from the application" }
      - { name: financed_principal_cents, type: integer, source: system, description: "Snapshot of Application.financed_principal_cents at activation" }
      - { name: apr_bps, type: integer, source: system, description: "Snapshot of Application.apr_bps" }
      - { name: finance_charge_cents, type: integer, source: system, description: "Snapshot of Application.finance_charge_cents" }
      - { name: remaining_principal_cents, type: integer, source: computed, description: "financed_principal_cents minus principal_paid across PAID installments; floored at 0" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents across this loan's Payment rows (any source)" }
      - { name: late_fee_accrued_cents, type: integer, source: computed, description: "Sum of late_fee_cents across this loan's installments whose status IN {LATE, PAID} where a late fee was assessed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAID_OFF | DEFAULTED | CANCELLED — lifecycle dimension", default: ACTIVE, constraints: "ACTIVE,PAID_OFF,DEFAULTED,CANCELLED" }
      - { name: delinquency_status, type: enum, source: computed, description: "CURRENT | LATE | DELINQUENT — second, parallel state dimension derived from the oldest unpaid installment's days-past-due (see calculations.delinquency_posture)", default: CURRENT, constraints: "CURRENT,LATE,DELINQUENT" }

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the owning loan" }
      - { name: sequence_no, type: integer, source: system, description: "1-based position in the schedule; ordering key for allocation and posture", constraints: ">= 1" }
      - { name: due_date, type: datetime, source: system, description: "ISO 8601 UTC due date for this installment" }
      - { name: amount_due_cents, type: integer, source: system, description: "Scheduled amount (principal+interest portion) for this installment" }
      - { name: principal_portion_cents, type: integer, source: system, description: "Principal share of amount_due_cents (used for remaining_principal_cents accounting)" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment allocations applied to this installment" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late fee assessed on this installment when it became LATE; 0 until assessed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PAID; SCHEDULED -> LATE -> PAID; LATE -> WRITTEN_OFF; SCHEDULED/LATE -> CANCELLED", default: SCHEDULED, constraints: "SCHEDULED,LATE,PAID,WRITTEN_OFF,CANCELLED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: source, type: enum, source: input, description: "MANUAL | AUTOPAY — origination channel of the payment", default: MANUAL, constraints: "MANUAL,AUTOPAY" }
      - { name: allocation, type: array, source: computed, description: "Ordered list of {installment_id, applied_cents} produced by the oldest-due-first allocation (see calculations.payment_allocation)" }
      - { name: unapplied_cents, type: integer, source: computed, description: "Overpayment that no open installment could absorb; refunded to borrower balance" }

  - name: Return
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan whose financed goods are partially returned" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from the loan" }
      - { name: return_amount_cents, type: integer, source: input, description: "Refunded merchandise value to credit against the loan", constraints: "> 0" }
      - { name: principal_reduction_cents, type: integer, source: computed, description: "Portion of return_amount_cents applied to outstanding principal (see calculations.return_reallocation)" }
      - { name: settlement_clawback_cents, type: integer, source: computed, description: "Net settlement attributable to the returned goods clawed back from the merchant = return_amount_cents - round_half_up(return_amount_cents * mdr_bps / 10000); capped at the settlement's remaining net" }
      - { name: status, type: enum, source: system, description: "POSTED — terminal once reallocation completes", default: POSTED, constraints: "POSTED" }

  - name: AutopayMandate
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan this mandate auto-pays" }
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; copied from the loan" }
      - { name: status, type: enum, source: system, description: "ENABLED | DISABLED — only ENABLED mandates may be charged by the servicer sweep", default: ENABLED, constraints: "ENABLED,DISABLED" }

  - name: MerchantSettlement
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; the merchant being settled" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan that produced this settlement row" }
      - { name: gross_financed_cents, type: integer, source: system, description: "Loan.financed_principal_cents snapshot at origination" }
      - { name: mdr_fee_cents, type: integer, source: computed, description: "Merchant discount fee = round_half_up(gross_financed_cents * mdr_bps / 10000) at origination" }
      - { name: net_settlement_cents, type: integer, source: computed, description: "gross_financed_cents - mdr_fee_cents at origination" }
      - { name: clawed_back_cents, type: integer, source: computed, description: "Cumulative clawback applied by Returns against this settlement", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | RELEASED | CLAWED_BACK — PENDING until hold elapses; RELEASED on release; CLAWED_BACK when cumulative clawback (from a Return, or a full clawback on Loan default/cancel) reaches net_settlement_cents from either PENDING or RELEASED. A partially-clawed RELEASED settlement stays RELEASED; Merchant.net_settled_cents sums (net_settlement_cents - clawed_back_cents) over RELEASED rows", default: PENDING, constraints: "PENDING,RELEASED,CLAWED_BACK" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Application: branching with a revision loop (COUNTERED -> SUBMITTED) ----
  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [DECLINED, WITHDRAWN, ACTIVATED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /applications/{id}/decision (decision=APPROVE)"
        actor: Servicer
        preconditions:
          - "Merchant.status == ACTIVE (else DECLINE path with decline_reason=MERCHANT_SUSPENDED)"
          - "Borrower.available_credit_cents >= financed_principal_cents computed with requested_down_payment_cents (else COUNTER or DECLINE)"
        side_effects:
          - "approved_down_payment_cents := requested_down_payment_cents"
          - "Recompute apr_bps, finance_charge_cents, financed_principal_cents, total_of_payments_cents (calculations.finance_charge final variant)"

      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /applications/{id}/decision (decision=COUNTER)"
        actor: Servicer
        preconditions:
          - "Borrower.available_credit_cents < financed_principal_cents at requested_down_payment_cents BUT a higher down payment makes financed_principal_cents <= available_credit_cents"
        side_effects:
          - "approved_down_payment_cents := cart_amount_cents - Borrower.available_credit_cents (the minimum down payment that fits the limit; see calculations.eligibility_limit final variant)"
          - "Recompute financed_principal_cents, finance_charge_cents, total_of_payments_cents off the countered down payment"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /applications/{id}/decision (decision=DECLINE)"
        actor: Servicer
        preconditions:
          - "Merchant.status == SUSPENDED, OR Borrower.available_credit_cents == 0, OR even full-minus-one-cent down payment cannot fit the limit"
        side_effects:
          - "decline_reason set (MERCHANT_SUSPENDED | INSUFFICIENT_CREDIT | DOWN_PAYMENT_TOO_LOW)"

      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /applications/{id}/revise (new requested_down_payment_cents)"
        actor: Borrower
        preconditions:
          - "Application.status == COUNTERED"
          - "new requested_down_payment_cents >= the countered approved_down_payment_cents"
        side_effects:
          - "requested_down_payment_cents := new value; status returns to SUBMITTED for re-decision (revision loop)"

      - from: APPROVED
        to: ACTIVATED
        trigger: "POST /loans (creates the Loan from an APPROVED application)"
        actor: Borrower
        preconditions:
          - "A DisclosureAcceptance with accepted==true exists for this application (Reg Z, ERR_DISCLOSURE_NOT_ACCEPTED)"
          - "Borrower.available_credit_cents >= financed_principal_cents still holds at activation (ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "Loan created (status=ACTIVE, delinquency_status=CURRENT); financed_principal/apr/finance_charge snapshotted"
          - "Installment schedule generated (calculations.installment_schedule)"
          - "MerchantSettlement created PENDING (calculations.merchant_settlement_net)"
          - "Borrower.outstanding_principal_cents and available_credit_cents recomputed"
          - "Merchant.gross_financed_cents recomputed"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Borrower
        preconditions: ["Application.status == SUBMITTED"]
        side_effects: []

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Borrower
        preconditions: ["Application.status == COUNTERED"]
        side_effects: []

  # ---- Loan: PARALLEL dimensions — lifecycle `status` AND `delinquency_status` ----
  - entity: Loan
    initial_state: ACTIVE              # lifecycle (status) dimension
    terminal_states: [PAID_OFF, DEFAULTED, CANCELLED]
    note: |
      Two independent dimensions on one row. `status` is the lifecycle below.
      `delinquency_status` (CURRENT/LATE/DELINQUENT) is a parallel dimension recomputed
      by calculations.delinquency_posture on every clock advance and every payment, and
      is NOT a lifecycle state — a loan can be ACTIVE+DELINQUENT or ACTIVE+CURRENT.
    transitions:
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system, on the Payment or Return that drives remaining_principal_cents to 0 and leaves no SCHEDULED/LATE installment"
        actor: system
        preconditions:
          - "remaining_principal_cents == 0 AND no installment in {SCHEDULED, LATE}"
        side_effects:
          - "delinquency_status forced to CURRENT"
          - "AutopayMandate (if ENABLED) -> DISABLED"
          - "Borrower.outstanding_principal_cents / available_credit_cents recomputed"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /loans/{id}/default"
        actor: Servicer
        preconditions:
          - "Loan.delinquency_status == DELINQUENT (ERR_NOT_DELINQUENT)"
          - "expected_loan_version matches Loan.version (OCC)"
        side_effects:
          - "increments Loan.version by 1"
          - "All SCHEDULED/LATE installments -> WRITTEN_OFF"
          - "AutopayMandate (if ENABLED) -> DISABLED"
          - "MerchantSettlement: if still PENDING -> CLAWED_BACK in full; if RELEASED, no change"
          - "Borrower.outstanding_principal_cents / available_credit_cents recomputed"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /loans/{id}/cancel"
        actor: Servicer
        preconditions:
          - "total_paid_cents == 0 (no payment yet made; ERR_LOAN_HAS_PAYMENTS)"
          - "expected_loan_version matches Loan.version (OCC)"
        side_effects:
          - "increments Loan.version by 1"
          - "All installments -> CANCELLED"
          - "MerchantSettlement -> CLAWED_BACK in full"
          - "AutopayMandate -> DISABLED"
          - "Borrower / Merchant aggregates recomputed"

  # ---- Installment: linear with a LATE revert and write-off branch ----
  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [PAID, WRITTEN_OFF, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "system, when a Payment allocation fully covers amount_due_cents"
        actor: system
        preconditions: ["amount_paid_cents >= amount_due_cents"]
        side_effects:
          - "Loan.remaining_principal_cents reduced by principal_portion_cents"
          - "Loan.delinquency_status recomputed (calculations.delinquency_posture)"
          - "If this was the last open installment and principal hits 0 -> Loan -> PAID_OFF (bubble-up)"

      - from: SCHEDULED
        to: LATE
        trigger: "system, on clock advance when now > due_date + GRACE_DAYS and amount_paid_cents < amount_due_cents"
        actor: system
        preconditions: ["now > due_date + GRACE_DAYS (calculations.late_fee_assessment boundary)"]
        side_effects:
          - "late_fee_cents assessed (calculations.late_fee_assessment)"
          - "Loan.late_fee_accrued_cents recomputed; Loan.delinquency_status recomputed"

      - from: LATE
        to: PAID
        trigger: "system, when a Payment allocation fully covers amount_due_cents (late fee paid separately is NOT required to mark PAID)"
        actor: system
        preconditions: ["amount_paid_cents >= amount_due_cents"]
        side_effects:
          - "Loan.remaining_principal_cents reduced by principal_portion_cents"
          - "Loan.delinquency_status recomputed"

      - from: LATE
        to: WRITTEN_OFF
        trigger: "system, on Loan -> DEFAULTED"
        actor: system
        preconditions: ["Loan transitioning to DEFAULTED"]
        side_effects: ["amount excluded from remaining_principal accounting"]

      - from: SCHEDULED
        to: WRITTEN_OFF
        trigger: "system, on Loan -> DEFAULTED"
        actor: system
        preconditions: ["Loan transitioning to DEFAULTED"]
        side_effects: ["amount excluded from remaining_principal accounting"]

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, on Loan -> CANCELLED or full reallocation by a Return (calculations.return_reallocation) zeroing the installment"
        actor: system
        preconditions: ["Loan -> CANCELLED, OR return reallocation fully covers this installment's remaining amount_due"]
        side_effects: ["amount_due_cents reduced to amount_paid_cents; excluded from posture"]

      - from: LATE
        to: CANCELLED
        trigger: "system, on Loan -> CANCELLED"
        actor: system
        preconditions: ["Loan -> CANCELLED"]
        side_effects: []

  # ---- MerchantSettlement: PENDING -> RELEASED / CLAWED_BACK ----
  - entity: MerchantSettlement
    initial_state: PENDING
    terminal_states: [RELEASED, CLAWED_BACK]
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "POST /merchant-settlements/{id}/release"
        actor: Servicer
        preconditions:
          - "now >= Loan.created_at + Merchant.settlement_hold_days days (ERR_SETTLEMENT_HOLD_ACTIVE)"
          - "Loan.status == ACTIVE (ERR_INVALID_STATE if loan CANCELLED/DEFAULTED while settlement PENDING)"
        side_effects:
          - "Merchant.net_settled_cents recomputed (adds net_settlement_cents - clawed_back_cents)"

      - from: PENDING
        to: CLAWED_BACK
        trigger: "system, on Loan -> CANCELLED, Loan -> DEFAULTED (PENDING), or a Return whose clawback drives clawed_back_cents to net_settlement_cents"
        actor: system
        preconditions: ["clawed_back_cents >= net_settlement_cents after the clawback"]
        side_effects: ["Merchant.net_settled_cents recomputed (PENDING never contributed, so no change for the default/cancel path)"]

      - from: RELEASED
        to: CLAWED_BACK
        trigger: "system, on a Return whose clawback drives clawed_back_cents to net_settlement_cents on an already-RELEASED settlement"
        actor: system
        preconditions: ["clawed_back_cents >= net_settlement_cents after the clawback"]
        side_effects: ["Merchant.net_settled_cents recomputed: the previously-released net is reversed back out (sum over RELEASED rows excludes a CLAWED_BACK row)"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent `version` — the only sanctioned race)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: loan-default-stale-version
    parent_entity: Loan
    write_endpoint: "POST /loans/{id}/default"
    occ_field: "expected_loan_version"
    description: |
      Declaring DEFAULT on a Loan whose version has advanced since the client last
      observed it is rejected. A prior writer may have already moved the loan
      (cancel, or a payment-driven posture/lifecycle change) so that the current
      writer's view of the loan is stale; the default is rejected on the version
      mismatch rather than acting on out-of-date state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: loan-cancel-stale-version
    parent_entity: Loan
    write_endpoint: "POST /loans/{id}/cancel"
    occ_field: "expected_loan_version"
    description: |
      Cancelling a Loan whose version has advanced since the client last observed it
      is rejected. The cancel legitimately supersedes the prior loan state under the
      product's servicer-correction policy, but only when applied to the version the
      client actually read; a stale version means an intervening mutation has changed
      the loan and the cancel is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 instance A (Loan/Installment domain) + Rule 2 instance A (mode a) ---
  - name: installment_schedule
    trigger: "Application SUBMITTED->ACTIVATED side-effect (POST /loans)"
    algorithm: dual_variant_amortization
    formula: |
      Let P = financed_principal_cents (integer cents), activation_date = Loan.created_at (UTC date).
      PAY_IN_4 variant (apr_bps == 0, four bi-weekly installments):
        base = floor(P / 4); residual = P - base*4
        installments 1..4 due at activation_date + {0, 14, 28, 42} days.
        amount_due_cents[i] = base for i in 1..3; amount_due_cents[4] = base + residual.
        principal_portion_cents[i] = amount_due_cents[i] (zero interest).
      MONTHLY variant (apr_bps == 1990, term_months = N, monthly amortization):
        r = apr_bps / 10000 / 12                      # monthly periodic rate, full float precision
        if r == 0: pmt = P / N
        else: pmt = P * r * (1+r)^N / ((1+r)^N - 1)   # standard amortization payment, float
        amount_due_cents[i] = round_half_up(pmt) for i in 1..N-1
        amount_due_cents[N] = total_of_payments_cents - sum(amount_due_cents[1..N-1])   # last absorbs residual
        Build principal_portion via running balance:
          bal = P
          for i in 1..N:
            interest_i = round_half_up(bal * r)
            principal_portion_cents[i] = amount_due_cents[i] - interest_i
            bal -= principal_portion_cents[i]
          principal_portion_cents[N] += bal   # final principal absorbs any residual so sum == P
        installments 1..N due at activation_date + i*30 days.
    input_set: "Application fields snapshotted onto the Loan at activation"
    constants:
      MONTHLY_APR_BPS: 1990
      PAY_IN_4_INTERVAL_DAYS: 14
      MONTHLY_INTERVAL_DAYS: 30
    precision: "integer cents; round_half_up on each per-installment amount; last installment absorbs residual so sum(amount_due)==total_of_payments_cents and sum(principal_portion)==financed_principal_cents"
    variants:
      - name: pay_in_4
        when: "plan_type == PAY_IN_4"
        difference: "Zero interest; even split with the residual cents loaded onto installment #4; 4 bi-weekly due dates."
      - name: monthly_amortized
        when: "plan_type == MONTHLY"
        difference: "Amortized at 19.90% APR; per-installment interest computed on the declining balance; final installment absorbs rounding residual."

  - name: finance_charge
    trigger: "Application decision APPROVE/COUNTER and re-derived at activation"
    algorithm: chronological
    formula: |
      apr_bps = 0 if plan_type == PAY_IN_4 else MONTHLY_APR_BPS (1990).
      financed_principal_cents = cart_amount_cents - approved_down_payment_cents.
      Evaluation order is pinned (circular-looking dependency resolved):
        1) approved_down_payment_cents fixed first (from decision/counter),
        2) financed_principal_cents := cart_amount_cents - approved_down_payment_cents,
        3) build schedule via installment_schedule on financed_principal_cents,
        4) finance_charge_cents := sum(amount_due_cents) - financed_principal_cents,
        5) total_of_payments_cents := financed_principal_cents + finance_charge_cents.
      PAY_IN_4: finance_charge_cents == 0, total_of_payments_cents == financed_principal_cents.
    input_set: "Single application; its approved_down_payment and plan"
    constants: { MONTHLY_APR_BPS: 1990 }
    precision: "integer cents; finance_charge derived from the rounded schedule (step 3 before step 4) so it equals the sum of per-installment interest exactly"

  # --- Rule 1 instance B (Borrower domain) ---
  - name: eligibility_limit
    trigger: "Borrower registration (provisional); Application decision (final)"
    algorithm: threshold
    formula: |
      PROVISIONAL (at registration, sets Borrower.eligible_credit_limit_cents):
        score = soft_credit_score
        if score < 580: base_limit = 0
        elif score < 670: base_limit = 50000          # $500.00
        elif score < 740: base_limit = 200000         # $2,000.00
        else:             base_limit = 500000         # $5,000.00
        income_cap = floor(annual_income_cents * 0.10)   # 10% of annual income
        eligible_credit_limit_cents = min(base_limit, income_cap)
      FINAL (at application decision, determines approved_down_payment_cents):
        avail = available_credit_cents = max(0, eligible_credit_limit_cents - outstanding_principal_cents)
        need = cart_amount_cents - requested_down_payment_cents
        if avail == 0: DECLINE (INSUFFICIENT_CREDIT)
        elif need <= avail: APPROVE, approved_down_payment_cents = requested_down_payment_cents
        elif (cart_amount_cents - 1) <= avail: COUNTER, approved_down_payment_cents = cart_amount_cents - avail
        else: DECLINE (DOWN_PAYMENT_TOO_LOW)
    input_set: "Borrower soft_credit_score, annual_income_cents; at decision also outstanding_principal_cents"
    constants:
      SCORE_TIER_1: 580
      SCORE_TIER_2: 670
      SCORE_TIER_3: 740
      LIMIT_TIER_2_CENTS: 50000
      LIMIT_TIER_3_CENTS: 200000
      LIMIT_TIER_4_CENTS: 500000
      INCOME_FACTOR: 0.10
    precision: "integer cents; floor on income_cap; min() selects tighter of base vs income"
    variants:
      - name: provisional_soft_limit
        when: "registration"
        difference: "Soft-pull only; uses score tier and income cap; set once and static."
      - name: final_decision_limit
        when: "application decision"
        difference: "Re-evaluates against live outstanding_principal_cents; can force a counter down payment or decline."

  # --- Rule 2 instance B (mode b: nested rounding where order is pinned) ---
  - name: return_reallocation
    trigger: "POST /returns (Return POSTED)"
    algorithm: waterfall_allocation
    formula: |
      A return credits return_amount_cents against the loan. Reallocation is pinned as:
        1) principal_reduction_cents = min(return_amount_cents, Loan.remaining_principal_cents).
        2) Distribute principal_reduction across UNPAID installments (status IN {SCHEDULED, LATE}),
           NEWEST-due-first (descending sequence_no), reducing each installment's outstanding
           (amount_due_cents - amount_paid_cents) before moving to the next. An installment whose
           outstanding is fully covered -> CANCELLED.
        3) ROUNDING ORDER IS PINNED: when the reduction lands mid-installment, reduce
           amount_due_cents by the exact integer cents removed (no per-installment rounding —
           the reduction is computed as a single integer subtraction then applied, NOT distributed
           pro-rata-then-rounded). Sum of reductions == principal_reduction_cents exactly.
        4) mdr_on_return = round_half_up(return_amount_cents * Merchant.mdr_bps / 10000).
           settlement_clawback_cents = min(return_amount_cents - mdr_on_return,
                                           MerchantSettlement.net_settlement_cents - MerchantSettlement.clawed_back_cents).
           Add settlement_clawback_cents to MerchantSettlement.clawed_back_cents. The merchant keeps the
           MDR on returned goods; the net principal it was paid for those goods is clawed back.
           If clawed_back_cents reaches net_settlement_cents the settlement -> CLAWED_BACK and any
           RELEASED amount is reversed out of Merchant.net_settled_cents.
        5) If remaining_principal hits 0 and no SCHEDULED/LATE installment remains -> Loan PAID_OFF.
    input_set: "One Return; the loan's UNPAID installments newest-first; the loan's MerchantSettlement"
    constants: {}
    precision: "integer cents; round_half_up only on mdr_on_return; principal reduction is exact integer subtraction (single subtraction, not pro-rata-then-round) so no residual drift"

  - name: payment_allocation
    trigger: "POST /payments (manual) and servicer autopay sweep"
    algorithm: waterfall_allocation
    formula: |
      Allocate amount_cents across the loan's installments OLDEST-due-first
      (ascending sequence_no; tie-break by created_at ASC then sequence_no ASC),
      restricted to status IN {SCHEDULED, LATE}:
        for inst in ordered_unpaid:
          need = inst.amount_due_cents - inst.amount_paid_cents
          applied = min(remaining_payment, need)
          inst.amount_paid_cents += applied; remaining_payment -= applied
          if inst.amount_paid_cents >= inst.amount_due_cents: inst -> PAID
        unapplied_cents = remaining_payment   # overpayment beyond all open installments
      Late fees are tracked on Loan.late_fee_accrued_cents and are NOT consumed by this allocation.
    input_set: "One Payment; the loan's installments with status IN {SCHEDULED, LATE}"
    constants: {}
    precision: "integer cents; no rounding (pure integer subtraction)"

  - name: late_fee_assessment
    trigger: "clock advance (POST /_clock/set_current_utc) marking SCHEDULED -> LATE"
    algorithm: threshold
    formula: |
      An installment becomes LATE when now > due_date + GRACE_DAYS (strict >; exactly at
      due_date + GRACE_DAYS is still on-time). On becoming LATE:
        outstanding = amount_due_cents - amount_paid_cents
        late_fee_cents = min(LATE_FEE_CAP_CENTS, max(LATE_FEE_FLOOR_CENTS,
                             round_half_up(outstanding * LATE_FEE_RATE)))
      A late fee is assessed at most ONCE per installment (idempotent on repeated clock advances).
    input_set: "Installments with status==SCHEDULED whose due_date+GRACE_DAYS < now"
    constants:
      GRACE_DAYS: 10
      LATE_FEE_RATE: 0.05
      LATE_FEE_FLOOR_CENTS: 700        # $7.00 minimum
      LATE_FEE_CAP_CENTS: 1500         # $15.00 cap
    precision: "integer cents; round_half_up inside the clamp"

  - name: merchant_settlement_net
    trigger: "Application SUBMITTED->ACTIVATED side-effect (MerchantSettlement created)"
    algorithm: aggregation
    formula: |
      At loan origination, per loan:
        gross_financed_cents = Loan.financed_principal_cents
        mdr_fee_cents = round_half_up(gross_financed_cents * Merchant.mdr_bps / 10000)
        net_settlement_cents = gross_financed_cents - mdr_fee_cents
        clawed_back_cents = 0; status = PENDING
      Merchant.net_settled_cents = sum over this merchant's MerchantSettlement rows with
        status == RELEASED of (net_settlement_cents - clawed_back_cents).
    input_set: "One MerchantSettlement at creation; aggregate over merchant's RELEASED settlements for the rollup"
    constants: {}
    precision: "integer cents; round_half_up on the MDR fee; subtraction exact"

  - name: delinquency_posture
    trigger: "every payment, every return, and every clock advance"
    algorithm: threshold
    formula: |
      Let oldest = the unpaid installment (status IN {SCHEDULED, LATE}) with the smallest
      sequence_no (tie-break created_at ASC); if none, delinquency_status = CURRENT.
      dpd = floor((now - oldest.due_date) / 1 day)   # days past due, can be negative
      if dpd < 0 or oldest not yet past due+GRACE_DAYS: CURRENT
      elif dpd >= DELINQUENT_DAYS: DELINQUENT
      else (oldest is LATE but dpd < DELINQUENT_DAYS): LATE
    input_set: "The loan's installments with status IN {SCHEDULED, LATE}, oldest by sequence_no"
    constants:
      GRACE_DAYS: 10
      DELINQUENT_DAYS: 30
    precision: "integer days; floor on the day difference; >= boundary for DELINQUENT"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7 RBAC matrix; entity_backed roles acting on a resource must own it (X-User-ID == resource owner FK)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and body FK ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body schema valid: required fields present, types/enums valid, term_months present for MONTHLY and absent for PAY_IN_4, requested_down_payment_cents < cart_amount_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /applications, POST /borrowers, POST /merchants, POST /payments, POST /returns"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "application decision/revise/withdraw, loan default/cancel, settlement release"

  - priority: 6
    category: business_referential
    check: "Idempotency / uniqueness: borrower email unique; only one DisclosureAcceptance(accepted=true) consumed per activation; one AutopayMandate per loan"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /borrowers, POST /autopay-mandates"

  - priority: 7
    category: business_safety
    check: "Reg Z gate: a Loan may be activated only if an accepted DisclosureAcceptance exists for the application"
    error_id: ERR_DISCLOSURE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /loans"

  - priority: 8
    category: business_temporal
    check: "Settlement may be RELEASED only after now >= Loan.created_at + Merchant.settlement_hold_days"
    error_id: ERR_SETTLEMENT_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /merchant-settlements/{id}/release"

  - priority: 9
    category: business_constraint
    check: "Loan default requires delinquency_status == DELINQUENT"
    error_id: ERR_NOT_DELINQUENT
    http_status: 409
    applies_to: "POST /loans/{id}/default"

  - priority: 10
    category: business_constraint
    check: "Loan cancel requires total_paid_cents == 0"
    error_id: ERR_LOAN_HAS_PAYMENTS
    http_status: 409
    applies_to: "POST /loans/{id}/cancel"

  - priority: 11
    category: business_fiscal
    check: "Activation re-checks Borrower.available_credit_cents >= financed_principal_cents; payment amount must be > 0; return_amount must be > 0 and <= remaining_principal_cents + already-paid recoverable (return cannot exceed cart_amount_cents)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 409
    applies_to: "POST /loans, POST /returns"

  - priority: 12
    category: business_fiscal
    check: "OCC: expected_loan_version must equal Loan.version on guarded loan writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /loans/{id}/default, POST /loans/{id}/cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Merchant ----
  - method: POST
    path: "/merchants"
    description: "Register a merchant"
    roles: [Servicer]
    code: 201
    input: [display_name, mdr_bps, "settlement_hold_days?"]
    output: Merchant
    side_effects: ["status=ACTIVE; gross_financed_cents=0; net_settled_cents=0"]

  - method: GET
    path: "/merchants/{id}"
    description: "Fetch a merchant (includes computed gross_financed_cents / net_settled_cents)"
    roles: [Servicer, Merchant]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: POST
    path: "/merchants/{id}/suspend"
    description: "Suspend a merchant so it can no longer originate applications"
    roles: [Servicer]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status -> SUSPENDED"]

  # ---- Borrower ----
  - method: POST
    path: "/borrowers"
    description: "Register a borrower; computes provisional eligible_credit_limit_cents"
    roles: [Servicer]
    code: 201
    input: [full_name, email, annual_income_cents, soft_credit_score]
    output: Borrower
    side_effects: ["eligible_credit_limit_cents computed (calculations.eligibility_limit provisional); outstanding/available recomputed"]

  - method: GET
    path: "/borrowers/{id}"
    description: "Fetch a borrower (includes computed credit fields)"
    roles: [Servicer, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/applications"
    description: "Submit a financing application"
    roles: [Borrower]
    code: 201
    input: [borrower_id, merchant_id, cart_amount_cents, plan_type, "term_months?", "requested_down_payment_cents?"]
    output: Application
    side_effects: ["status=SUBMITTED; provisional apr/financed_principal/finance_charge/total_of_payments computed"]

  - method: GET
    path: "/applications/{id}"
    description: "Fetch an application (includes computed disclosure figures)"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications, filterable by borrower or merchant (FK reverse-reachability)"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: ["borrower_id?", "merchant_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/decision"
    description: "Servicer decides an application (APPROVE / COUNTER / DECLINE)"
    roles: [Servicer]
    code: 200
    input: [decision]
    output: Application
    side_effects:
      - "APPROVE -> APPROVED, approved_down_payment fixed, finance figures recomputed"
      - "COUNTER -> COUNTERED, approved_down_payment raised to fit limit"
      - "DECLINE -> DECLINED, decline_reason set"

  - method: POST
    path: "/applications/{id}/revise"
    description: "Borrower revises a COUNTERED application's down payment, returning it to SUBMITTED"
    roles: [Borrower]
    code: 200
    input: [requested_down_payment_cents]
    output: Application
    side_effects: ["status COUNTERED -> SUBMITTED; requested_down_payment updated"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Borrower withdraws a SUBMITTED or COUNTERED application"
    roles: [Borrower]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN"]

  # ---- DisclosureAcceptance (Reg Z) ----
  - method: POST
    path: "/disclosure-acceptances"
    description: "Borrower views and accepts (or rejects) the Reg Z disclosure for an APPROVED application"
    roles: [Borrower]
    code: 201
    input: [application_id, accepted]
    output: DisclosureAcceptance
    side_effects: ["snapshots disclosed_apr_bps/finance_charge/total_of_payments/installment_count from the application"]

  - method: GET
    path: "/disclosure-acceptances/{id}"
    description: "Fetch a single disclosure acceptance record"
    roles: [Servicer, Borrower]
    code: 200
    input: []
    output: DisclosureAcceptance
    side_effects: []

  - method: GET
    path: "/disclosure-acceptances"
    description: "List disclosure acceptances, filterable by application (FK reverse-reachability)"
    roles: [Servicer, Borrower]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: DisclosureAcceptance[]
    side_effects: []

  # ---- Loan ----
  - method: POST
    path: "/loans"
    description: "Activate an APPROVED application into a Loan (Reg Z gate enforced)"
    roles: [Borrower]
    code: 201
    input: [application_id]
    output: Loan
    side_effects:
      - "Application -> ACTIVATED; Loan ACTIVE/CURRENT created"
      - "Installment schedule generated (calculations.installment_schedule)"
      - "MerchantSettlement PENDING created (calculations.merchant_settlement_net)"
      - "Borrower/Merchant aggregates recomputed"

  - method: GET
    path: "/loans/{id}"
    description: "Fetch a loan (status, delinquency_status, balances)"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/loans"
    description: "List loans, filterable by borrower or merchant (FK reverse-reachability for Loan.borrower_id and Loan.merchant_id)"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: ["borrower_id?", "merchant_id?", "application_id?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/loans/{id}/default"
    description: "Servicer declares a DELINQUENT loan DEFAULTED (OCC-guarded)"
    roles: [Servicer]
    code: 200
    input: [expected_loan_version]
    output: Loan
    side_effects:
      - "increments Loan.version by 1"
      - "status -> DEFAULTED; open installments -> WRITTEN_OFF; autopay disabled; PENDING settlement clawed back"

  - method: POST
    path: "/loans/{id}/cancel"
    description: "Servicer cancels a no-payment loan (OCC-guarded)"
    roles: [Servicer]
    code: 200
    input: [expected_loan_version]
    output: Loan
    side_effects:
      - "increments Loan.version by 1"
      - "status -> CANCELLED; installments -> CANCELLED; settlement clawed back; autopay disabled"

  # ---- Installment ----
  - method: GET
    path: "/installments/{id}"
    description: "Fetch a single installment"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: []
    output: Installment
    side_effects: []

  - method: GET
    path: "/installments"
    description: "List installments, filterable by loan (FK reverse-reachability), ordered by sequence_no"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: ["loan_id?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []

  # ---- Payment ----
  - method: POST
    path: "/payments"
    description: "Borrower makes a manual payment against a loan (oldest-due-first allocation)"
    roles: [Borrower]
    code: 201
    input: [loan_id, amount_cents, "source?"]
    output: Payment
    side_effects:
      - "allocation computed (calculations.payment_allocation); installments may -> PAID"
      - "Loan remaining_principal/total_paid/delinquency recomputed; may bubble Loan -> PAID_OFF"

  - method: GET
    path: "/payments/{id}"
    description: "Fetch a single payment (includes allocation breakdown)"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments, filterable by loan (FK reverse-reachability)"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: ["loan_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Return ----
  - method: POST
    path: "/returns"
    description: "Merchant posts a partial return; reallocates principal newest-first and claws back settlement"
    roles: [Merchant]
    code: 201
    input: [loan_id, return_amount_cents]
    output: Return
    side_effects:
      - "principal_reduction/settlement_clawback computed (calculations.return_reallocation)"
      - "installments reduced/CANCELLED newest-first; settlement clawed back; may bubble Loan -> PAID_OFF"

  - method: GET
    path: "/returns/{id}"
    description: "Fetch a single return"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: []
    output: Return
    side_effects: []

  - method: GET
    path: "/returns"
    description: "List returns, filterable by loan or merchant (FK reverse-reachability for Return.loan_id and Return.merchant_id)"
    roles: [Servicer, Borrower, Merchant]
    code: 200
    input: ["loan_id?", "merchant_id?", "limit?", "offset?"]
    output: Return[]
    side_effects: []

  # ---- AutopayMandate ----
  - method: POST
    path: "/autopay-mandates"
    description: "Borrower enables autopay on an ACTIVE loan"
    roles: [Borrower]
    code: 201
    input: [loan_id]
    output: AutopayMandate
    side_effects: ["status=ENABLED"]

  - method: GET
    path: "/autopay-mandates"
    description: "List autopay mandates, filterable by loan or borrower (FK reverse-reachability)"
    roles: [Servicer, Borrower]
    code: 200
    input: ["loan_id?", "borrower_id?", "limit?", "offset?"]
    output: AutopayMandate[]
    side_effects: []

  - method: GET
    path: "/autopay-mandates/{id}"
    description: "Fetch a single autopay mandate"
    roles: [Servicer, Borrower]
    code: 200
    input: []
    output: AutopayMandate
    side_effects: []

  - method: POST
    path: "/autopay-mandates/{id}/disable"
    description: "Borrower disables an autopay mandate"
    roles: [Borrower]
    code: 200
    input: []
    output: AutopayMandate
    side_effects: ["status -> DISABLED"]

  # ---- MerchantSettlement ----
  - method: GET
    path: "/merchant-settlements/{id}"
    description: "Fetch a settlement row"
    roles: [Servicer, Merchant]
    code: 200
    input: []
    output: MerchantSettlement
    side_effects: []

  - method: GET
    path: "/merchant-settlements"
    description: "List settlements, filterable by merchant or loan (FK reverse-reachability)"
    roles: [Servicer, Merchant]
    code: 200
    input: ["merchant_id?", "loan_id?", "limit?", "offset?"]
    output: MerchantSettlement[]
    side_effects: []

  - method: POST
    path: "/merchant-settlements/{id}/release"
    description: "Servicer releases a held settlement after the hold window elapses"
    roles: [Servicer]
    code: 200
    input: []
    output: MerchantSettlement
    side_effects: ["status PENDING -> RELEASED; Merchant.net_settled_cents recomputed"]

  # ---- Servicer autopay sweep + test-driving clock ----
  - method: POST
    path: "/_servicer/run_autopay_sweep"
    description: "Test/operator endpoint: charge every ENABLED autopay mandate whose loan has an installment due on or before now, oldest-due-first, for the next due installment's amount"
    roles: [Servicer]
    code: 200
    input: []
    output: "{ charged_count: integer, payment_ids: string[] }"
    side_effects: ["creates AUTOPAY Payments; same allocation + cascade as POST /payments"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test/operator endpoint: set the server's current UTC instant; drives due-date, late-fee, delinquency, and settlement-hold evaluation"
    roles: [Servicer]
    code: 200
    input: [to_iso8601]
    output: "{ now: string, transitioned_installment_ids: string[] }"
    side_effects:
      - "SCHEDULED installments past due+GRACE_DAYS -> LATE with late_fee assessed (calculations.late_fee_assessment)"
      - "Loan.delinquency_status recomputed for all ACTIVE loans (calculations.delinquency_posture)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed actor does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body FK id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Body schema invalid: missing/typed field, bad enum, term_months presence wrong for plan_type, or requested_down_payment >= cart_amount" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which this transition is legal" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique/idempotency violation: borrower email reused, or a second AutopayMandate on a loan" }
  - { id: ERR_DISCLOSURE_NOT_ACCEPTED, http: 409, condition: "Activation attempted without an accepted DisclosureAcceptance for the application (Reg Z)" }
  - { id: ERR_SETTLEMENT_HOLD_ACTIVE, http: 409, condition: "Settlement release attempted before now >= Loan.created_at + Merchant.settlement_hold_days" }
  - { id: ERR_NOT_DELINQUENT, http: 409, condition: "Loan default attempted while delinquency_status != DELINQUENT" }
  - { id: ERR_LOAN_HAS_PAYMENTS, http: 409, condition: "Loan cancel attempted after at least one payment was made (total_paid_cents > 0)" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 409, condition: "Activation re-check fails (available_credit < financed_principal), or return_amount exceeds cart_amount_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_loan_version does not equal current Loan.version on an OCC-guarded write" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Servicer
    description: "Platform loan servicer / operator: decides applications, declares default/cancel, releases settlements, runs sweeps and the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /merchants — register merchant"
      - "POST /merchants/{id}/suspend — suspend merchant"
      - "POST /borrowers — register borrower"
      - "POST /applications/{id}/decision — decide application"
      - "POST /loans/{id}/default — declare default"
      - "POST /loans/{id}/cancel — cancel loan"
      - "POST /merchant-settlements/{id}/release — release settlement"
      - "POST /_servicer/run_autopay_sweep — run autopay sweep"
      - "POST /_clock/set_current_utc — advance the clock"
    shared_operations:
      - "GET on all collections and resources"

  - name: Borrower
    description: "Consumer who applies, accepts Reg Z disclosure, activates loans, pays, and manages autopay"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /applications — submit application (own borrower_id)"
      - "POST /applications/{id}/revise — revise own countered application"
      - "POST /applications/{id}/withdraw — withdraw own application"
      - "POST /disclosure-acceptances — accept/reject own Reg Z disclosure"
      - "POST /loans — activate own approved application"
      - "POST /payments — pay own loan"
      - "POST /autopay-mandates — enable autopay on own loan"
      - "POST /autopay-mandates/{id}/disable — disable own autopay"
    shared_operations:
      - "GET on own borrower, applications, loans, installments, payments, autopay mandates"

  - name: Merchant
    description: "Originating merchant; posts partial returns and views its loans/settlements"
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /returns — post a partial return on own loan"
    shared_operations:
      - "GET on own merchant, applications, loans, returns, settlements"
