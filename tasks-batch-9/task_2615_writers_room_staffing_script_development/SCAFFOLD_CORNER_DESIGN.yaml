            - "ClearanceItem.${it2}.risk_weight == 5"
            - "ClearanceReview.${cr}.item_count == 2 but decided_item_count == 0 and risk_score == 0"
            - "ClearanceReview.${cr}.posture == PENDING and Episode.${ep1}.clearance_posture == PENDING - undecided items keep the review PENDING"

      - name: credit_submission_creation_starts_submitted_with_no_share_and_no_credit
        claim_type: creation
        grounds:
          - entities.CreditSubmission
          - entities.CreditSubmission.fields.status
          - entities.CreditSubmission.fields.provisional_share_pct
          - endpoints.POST_/episodes/{episode_id}/credit-submissions
        distinguishing_aspect: |
          A claim can only be filed while the episode's credit window is open (which only the first
          APPROVED assignment opens) and it starts inert: status SUBMITTED, provisional_share_pct 0,
          arbitrated_share_pct null, receives_credit false. Nothing is normalised until the window closes,
          so two submissions claiming 60 and 30 leave the episode's provisional map empty.
        test_recipe:
          setup:
            - "A1 (TELEPLAY, W1) is APPROVED on EP1, so script_readiness == READY and credit_status == SUBMISSIONS_OPEN."
            - "A2 (STORY, W2) is APPROVED as well; both writers are therefore eligible claimants."
          setup_api_calls:
            - *C_AG
            - *C_SR
