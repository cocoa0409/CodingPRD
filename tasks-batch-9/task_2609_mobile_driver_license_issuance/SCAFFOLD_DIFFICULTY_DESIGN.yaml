      - name: update_order_with_zero_deliveries_closes_completed_immediately
        grounds: "calculations.update_order_status_rollup, the `if delivery_count == 0: status = COMPLETED` branch; endpoint POST /mdl/holders/{id}/address-change"
        distinguishing_aspect: "A different metric (cardinality of the delivery set at exactly zero, not a seconds threshold) probed through a different endpoint (POST /mdl/holders/{id}/address-change, not GET revocation-status). The empty aggregate is the trap: the natural `delivered_count == delivery_count` test also yields COMPLETED here, but only an implementation that treats zero as a first-class outcome also stamps closed_at inside the same request instead of leaving the order OPEN."
