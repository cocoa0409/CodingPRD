  - method: POST
    path: /traffic/spots/{id}/preempt
    description: "Preempt a scheduled spot (DRAFT log only); frees seconds and marks the reason"
    roles: [TrafficManager]
    code: 200
    input: [preempt_reason]
    output: Spot
    side_effects:
      - "Spot transition SCHEDULED -> PREEMPTED per §1.2"
      - "posts provisional discrepancy credit per §1.3"
      - "increments AvailUnit.version by 1"
  - method: POST
    path: /traffic/spots/{id}/offer-make-good
    description: "Create a make-good spot for a preempted spot"
    roles: [TrafficManager]
    code: 201
    input: []
    output: Spot
    side_effects: ["Spot transition PREEMPTED -> MAKE_GOOD_OFFERED per §1.2"]
  - method: POST
    path: /traffic/spots/{id}/decline-make-good
    description: "Decline an offered make-good"
    roles: [SalesRep]
    code: 200
    input: []
    output: Spot
    side_effects: ["Spot transition MAKE_GOOD_OFFERED -> CANCELLED per §1.2"]

  - method: GET
    path: /traffic/log-days/{id}
    description: "Get one log day"
    roles: [SalesRep, TrafficManager, BillingClerk, StationAdmin]
    code: 200
    input: []
    output: LogDay
    side_effects: []
  - method: POST
    path: /traffic/log-days/{id}/finalize
    description: "Finalize a log day: fixes spot order, assigns copy by rotation, locks the week"
    roles: [TrafficManager]
    code: 200
    input: []
    output: LogDay
    side_effects:
      - "LogDay transition DRAFT -> FINALIZED per §1.2"
      - "copy_rotation_select per §1.3"
      - "AvailWeek OPEN -> LOCKED"
  - method: POST
    path: /traffic/log-days/{id}/reconcile
    description: "Post as-run entries; airs or preempts reported spots, posts credits and shortfall"
    roles: [BillingClerk]
    code: 200
    input: [entries]
    output: LogDay
    side_effects:
      - "creates AsRunEntry rows"
      - "Spot SCHEDULED -> AIRED or -> PREEMPTED per §1.2"
      - "discrepancy_credit and audience_delivery_shortfall per §1.3"
      - "AvailWeek LOCKED -> CLOSED when all week log days reconciled"

  - method: POST
    path: /traffic/_clock/set_current_utc
    description: "Test-driving endpoint: set the server's logical clock. Startup default is 2026-08-01T00:00:00Z; before any set call the clock reads exactly this default and never the real wall clock."
    roles: [StationAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "runs the order completion sweep: APPROVED orders whose flight_end_date < new clock date and whose spots are all terminal transition to COMPLETED"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "authenticated role is not in the endpoint's roles list"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or referenced *_id does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition does not exist from the entity's current state (includes terminal-state lockdown and finalize/preempt on FINALIZED+ logs)"
  - id: ERR_DATE_WINDOW
    http: 422
    condition: "flight/air/log date-window violation (end before start, air_date outside week, weekday mismatch, placement outside flight, finalize of a past log)"
  - id: ERR_REFERENCE_MISMATCH
    http: 422
    condition: "cross-reference incoherent: line program missing, placement program mismatch, copy length mismatch, make-good rating downgrade"
  - id: ERR_POLITICAL_RESERVE
    http: 422
    condition: "commercial placement would consume reserved political seconds, or political-priority preempt attempted against a POLITICAL spot"
  - id: ERR_AVAIL_OVERFLOW
    http: 422
    condition: "avail headroom exceeded, or duplicate outstanding make-good for the same preempted spot"
  - id: ERR_SEPARATION_VIOLATION
    http: 422
    condition: "placement would put two same-product-category spots within MIN_SEPARATION_POSITIONS of each other in one break"
  - id: ERR_COPY_NOT_RECEIVED
    http: 422
    condition: "finalize attempted while a scheduled spot has no RECEIVED copy of matching length"
  - id: ERR_RECONCILE_MISMATCH
    http: 422
    condition: "reconcile entries do not cover exactly the log's scheduled spots, or aired entry lacks actual_rating"
  - id: ERR_CREDIT_LIMIT
    http: 422
    condition: "order approval would push advertiser outstanding exposure above credit_limit_cents"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum, non-positive price/weight, or invalid spot length"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not match the order's current version at approve time"
  - id: ERR_STALE_AVAIL_VERSION
    http: 412
    condition: "expected_avail_unit_version does not match the avail unit's current version at placement time"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesRep
    description: "Station account executive: builds orders, owns advertiser relationship, requests revisions, declines make-goods"
    identity: opaque
    exclusive_operations:
      - "create advertisers"
      - "create/submit/revise/cancel orders"
      - "add or cancel order lines"
      - "decline make-goods"
    shared_operations:
      - "read advertisers, programs, avails, orders, spots, post-buy reports, copy instructions"
  - name: TrafficManager
    description: "Station traffic manager: owns programs, avail inventory, log building, order approval, placement, preemption and make-goods"
    identity: opaque
    exclusive_operations:
      - "create programs, avail weeks, avail units, log days"
      - "approve or reject orders"
      - "place, preempt, and offer make-goods on spots"
      - "finalize log days"
    shared_operations:
      - "read advertisers, programs, avails, orders, spots, post-buy reports, copy instructions"
  - name: CopyCoordinator
    description: "Copy/continuity desk: registers advertiser copy and clears or withdraws it"
    identity: opaque
    exclusive_operations:
      - "create copy instructions"
      - "receive (clear) copy"
      - "expire copy"
    shared_operations:
      - "read advertisers and copy instructions"
  - name: BillingClerk
    description: "Billing/reconciliation clerk: posts as-run reconciliation and reads post-buy credit reports"
    identity: opaque
    exclusive_operations:
      - "reconcile log days (post as-run entries)"
    shared_operations:
      - "read advertisers, programs, avails, orders, spots, log days, as-run entries, post-buy reports"
  - name: StationAdmin
    description: "Station system administrator: operates the logical clock and reads everything"
    identity: opaque
    exclusive_operations:
      - "set the logical clock"
    shared_operations:
      - "read advertisers, programs, avails, orders, spots, log days, as-run entries, post-buy reports"
