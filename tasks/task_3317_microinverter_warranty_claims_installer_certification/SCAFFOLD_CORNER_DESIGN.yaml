              captures: { cm1_sys: "$.data.id", cm1_status: "$.data.warranty_status", cm1_base: "$.data.base_warranty_end_at", cm1_ext: "$.data.extended_warranty_end_at", cm1_units: "$.data.unit_count", cm1_ratio: "$.data.replacement_ratio" }
