          Metric: pace threshold. On POST /timing-reads, a 5km finish read with
          elapsed exactly 600000ms (5.0 x 120 x 1000) raises NO flag (strict <);
          599999ms raises AUTO COURSE_CUT_SUSPECT — one millisecond decides.
