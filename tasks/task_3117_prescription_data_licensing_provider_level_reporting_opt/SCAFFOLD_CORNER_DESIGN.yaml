              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /projection-cells/${c_id}/recompute"
              payload: { projection_variant: "PROJECTION_WEIGHTED", sampled_outlets: 0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /projection-cells/${c_id} still shows estimate_units null"

      - name: duplicate_optout_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=23]
          - errors[ERR_DUPLICATE_OPT_OUT]
        distinguishing_aspect: "A second opt-out for a prescriber with an existing SUBMITTED opt-out returns ERR_DUPLICATE_OPT_OUT; after the first is REJECTED (terminal), a new opt-out may be created."
        test_recipe:
          setup:
            - "Prescriber ACTIVE with one opt-out SUBMITTED."
          setup_api_calls:
            - call: "POST /prescribers"
              payload: { full_name: "Dr Dup", npi: "NPI-601", state_code: "TX", specialty: "CARDIOLOGY" }
