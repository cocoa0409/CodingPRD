scenario: "2212. Hazard Mitigation Buyout & Acquisition Program (hazard mitigation grant program administrator): project application with benefit-cost analysis and hazard risk documentation, voluntary participation confirmation with pre-event fair market value determination, appraisal, review appraisal and offer development with duplication-of-benefits deduction, relocation assistance obligations and tenant benefits under federal relocation law, closing, demolition and debris disposal with utility disconnection, deed restriction for permanent open space with monitoring and prohibited uses, holdout parcel management and neighborhood viability decisions, program income, resale prohibitions and long-term maintenance responsibility"
domain_name: "hazard-mitigation-buyout-program"
api_prefix: "/"   # all collections are mounted at the service root; MitigationProject is the aggregate root but parcels, appraisals, offers, closings, work orders, deed restrictions and ledger entries are addressed as top-level collections

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # Parcel <-> Parcel many-to-many self-referential adjacency (ParcelAdjacency) drives the
  # neighborhood-viability connected-component calculation; Appraisal also self-references
  # (REVIEW appraisal -> reviewed INITIAL appraisal), PurchaseOffer self-references
  # (superseded_by_offer_id) and ProgramIncomeLedgerEntry self-references (reverses_entry_id).
  # Acquisition artifacts hang off Parcel as peer entities linked by FK rather than by URL
  # nesting depth.

  state_machine_shape: parallel
  # Parcel carries two independent state dimensions (participation_status x acquisition_status).
  # Appraisal, RelocationCase, DemolitionWorkOrder and DeedRestriction are cyclic.
  # DemolitionWorkOrder readiness is compound (derived from UtilityDisconnection children).
  # PurchaseOffer is branching (PRESENTED -> {ACCEPTED, DECLINED, EXPIRED, WITHDRAWN}) with a
  # different side-effect set per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # SoD-1: the ReviewAppraiser who accepts a REVIEW appraisal may be neither the author of that
  #        REVIEW appraisal nor the StaffAppraiser who authored the reviewed INITIAL appraisal.
  # SoD-2: the ProgramAdministrator who VALIDATED the BenefitCostAnalysis may not be the
  #        ProgramAdministrator who APPROVES the MitigationProject.
  # SoD-3: the ComplianceMonitor who reported a prohibited use may not record its cure.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: MitigationProject
    parent: null
    common_fields: true
    fields:
      - name: project_code
        type: string
        source: input
        description: Subrecipient-assigned project identifier
        constraints: unique across all projects, 4-32 chars
      - name: grant_program
        type: enum
        source: input
        description: Federal mitigation program funding the acquisition
        constraints: one of HMGP, FMA, BRIC
      - name: disaster_declaration_number
        type: string
        source: input
        description: Federal disaster declaration the project is tied to; required when grant_program == HMGP
      - name: subrecipient_name
        type: string
        source: input
        description: Local government subrecipient administering the buyout
      - name: cost_share_federal_pct
        type: number
        source: input
        description: Federal cost-share fraction applied to obligations and program income
        default: 0.75
        constraints: 0.5 <= value <= 1.0, 2 decimal places
      - name: total_federal_share_cap_cents
        type: integer
        source: input
        description: Ceiling on cumulative federal obligation for this project
        constraints: '> 0'
      - name: period_of_performance_end_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); closings may not be funded when scheduled after this date
      - name: status
        type: enum
        source: system
        description: Project lifecycle state
        default: DRAFT
        constraints: one of DRAFT, SUBMITTED, APPROVED, CLOSEOUT_PENDING, CLOSED_OUT, DENIED
      - name: validated_bcr
        type: number
        source: computed
        description: Benefit-cost ratio copied from the BenefitCostAnalysis that reached VALIDATED, 3 decimal places; null until validation
      - name: validated_bca_method
        type: enum
        source: computed
        description: analysis_method of the VALIDATED BenefitCostAnalysis; null until validation
        constraints: one of FEMA_BCA_TOOLKIT, PRE_CALCULATED_BENEFIT
      - name: validated_by_user_id
        type: string
        source: computed
        description: X-User-ID that VALIDATED the BenefitCostAnalysis, copied onto the project for the SoD-2 check; null until validation
      - name: federal_obligated_cents
        type: integer
        source: computed
        description: 'Conserved quantity A - see calculations.federal_obligation'
        default: 0
      - name: program_income_balance_cents
        type: integer
        source: computed
        description: 'Conserved quantity B - see calculations.program_income_federal_share'
        default: 0
      - name: protected_open_space_acres
        type: number
        source: computed
        description: 'Conserved quantity C - see calculations.protected_open_space_acres, 2 decimal places'
        default: 0
      - name: participating_parcel_count
        type: integer
        source: computed
        description: Count of Parcel with project_id == this project and participation_status IN {NOT_CONTACTED, INTERESTED, VOLUNTARY_CONFIRMED, DECLINED}
        default: 0
      - name: holdout_parcel_count
        type: integer
        source: computed
        description: Count of Parcel with project_id == this project and participation_status == DECLINED
        default: 0
      - name: contiguous_open_space_parcel_count
        type: integer
        source: computed
        description: Size of the largest adjacency-connected component of acquired parcels - see calculations.neighborhood_viability_ratio
        default: 0
      - name: largest_component_parcel_ids
        type: array
        source: computed
        description: Parcel ids of the winning connected component ordered by Parcel.created_at ASC; empty array when no acquired parcel exists
      - name: neighborhood_viability_ratio
        type: number
        source: computed
        description: contiguous_open_space_parcel_count / participating_parcel_count, 4 decimal places; 0 when participating_parcel_count == 0
        default: 0
      - name: viability_status
        type: enum
        source: computed
        description: Derived neighborhood-viability posture - see calculations.neighborhood_viability_ratio
        default: NONVIABLE
        constraints: one of NONVIABLE, AT_RISK, VIABLE

  - name: BenefitCostAnalysis
    parent: MitigationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> MitigationProject.id; the project this analysis supports
      - name: analysis_method
        type: enum
        source: input
        description: Selects the benefit_cost_ratio variant
        constraints: one of FEMA_BCA_TOOLKIT, PRE_CALCULATED_BENEFIT
      - name: hazard_type
        type: enum
        source: input
        description: Documented hazard driving the risk
        constraints: one of RIVERINE_FLOOD, COASTAL_SURGE, WILDFIRE, LANDSLIDE
      - name: sfha_zone
        type: enum
        source: input
        description: FEMA special flood hazard area zone from the risk documentation
        constraints: one of AE, VE, A, X
      - name: repetitive_loss_flag
        type: boolean
        source: input
        description: True when the risk documentation shows repetitive-loss history
        default: false
      - name: annualized_loss_avoided_cents
        type: integer
        source: input
        description: Average annual damage avoided by the acquisition
        constraints: '> 0'
      - name: project_useful_life_years
        type: integer
        source: input
        description: Useful life of the mitigation action in years
        constraints: 1 <= value <= 100
      - name: discount_rate_pct
        type: number
        source: input
        description: Federal discount rate as a fraction (0.07 == 7 percent)
        default: 0.07
        constraints: 0 < value < 1, 2 decimal places
      - name: mitigation_cost_cents
        type: integer
        source: input
        description: Total project cost used as the BCR denominator
        constraints: '> 0'
      - name: pv_annuity_factor
        type: number
        source: computed
        description: Present-value annuity factor, 6 decimal places; exactly 0 for the undiscounted_life_cycle variant
        default: 0
      - name: npv_benefits_cents
        type: integer
        source: computed
        description: Present value of avoided losses - see calculations.benefit_cost_ratio
        default: 0
      - name: bcr
        type: number
        source: computed
        description: npv_benefits_cents / mitigation_cost_cents, 3 decimal places, round_half_up
        default: 0
      - name: validated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdministrator that validated this analysis; null while SUBMITTED
      - name: status
        type: enum
        source: system
        description: Analysis lifecycle state
        default: SUBMITTED
        constraints: one of SUBMITTED, VALIDATED, REJECTED

  - name: Parcel
    parent: MitigationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> MitigationProject.id; the project acquiring this parcel
      - name: apn
        type: string
        source: input
        description: Assessor parcel number
        constraints: unique within project_id
      - name: site_address
        type: string
        source: input
        description: Street address of the parcel
      - name: acreage
        type: number
        source: input
        description: Parcel area in acres, 2 decimal places
        constraints: '> 0'
      - name: occupancy_type
        type: enum
        source: input
        description: Occupancy at the time of the disaster; drives relocation obligations and owner-occupant incentive eligibility
        constraints: one of OWNER_OCCUPIED, TENANT_OCCUPIED, VACANT
      - name: structure_type
        type: enum
        source: input
        description: Structure present on the parcel
        constraints: one of SINGLE_FAMILY, MULTI_FAMILY, MANUFACTURED_HOME, NONE
      - name: substantial_damage_pct
        type: number
        source: input
        description: Damage as a percentage of pre-event structure value, 2 decimal places
        default: 0
        constraints: 0 <= value <= 100
      - name: pre_event_fmv_cents
        type: integer
        source: system
        description: Pre-event fair market value set by POST /parcels/{parcel_id}/pre-event-value; null until determined
      - name: pre_event_value_basis
        type: enum
        source: system
        description: Basis of the pre-event FMV determination; null until determined
        constraints: one of ASSESSOR_ROLL, PRE_EVENT_APPRAISAL, MARKET_STUDY
      - name: pre_event_value_determined_at
        type: datetime
        source: system
        description: Logical-clock ISO 8601 UTC timestamp of the pre-event FMV determination; null until determined
      - name: voluntary_acknowledgement_signed_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) the owner signed the voluntary-participation acknowledgement; null until participation_status reaches VOLUNTARY_CONFIRMED
      - name: participation_status
        type: enum
        source: system
        description: Voluntary-participation dimension of the parcel state
        default: NOT_CONTACTED
        constraints: one of NOT_CONTACTED, INTERESTED, VOLUNTARY_CONFIRMED, DECLINED, WITHDRAWN
      - name: acquisition_status
        type: enum
        source: system
        description: Acquisition-pipeline dimension of the parcel state; evolves independently of participation_status
        default: NOT_STARTED
        constraints: one of NOT_STARTED, APPRAISAL_IN_PROGRESS, VALUE_ESTABLISHED, OFFER_OUTSTANDING, OFFER_ACCEPTED, CLOSED, DEMOLISHED, OPEN_SPACE_RECORDED, ACQUISITION_CANCELLED
      - name: dob_deduction_total_cents
        type: integer
        source: computed
        description: Sum of per-record duplication-of-benefits deductions - see calculations.dob_deduction_total
        default: 0

  - name: ParcelAdjacency
    parent: MitigationProject
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> MitigationProject.id; both parcels must have this project_id
      - name: parcel_a_id
        type: string
        source: input
        description: FK -> Parcel.id; one endpoint of the shared boundary (self-referential graph edge)
      - name: parcel_b_id
        type: string
        source: input
        description: FK -> Parcel.id; the other endpoint of the shared boundary (self-referential graph edge)
      - name: shared_boundary_feet
        type: number
        source: input
        description: Length of the shared boundary in feet, 2 decimal places
        constraints: '> 0'

  - name: Appraisal
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel being valued
      - name: reviewed_appraisal_id
        type: string
        source: input
        description: FK -> Appraisal.id; required when appraisal_type == REVIEW, naming the INITIAL appraisal under review (self-referential); must be null when appraisal_type == INITIAL
      - name: appraisal_type
        type: enum
        source: input
        description: INITIAL is authored by StaffAppraiser; REVIEW is authored by ReviewAppraiser
        constraints: one of INITIAL, REVIEW
      - name: valuation_basis
        type: enum
        source: input
        description: Whether the opinion of value is pre-event or post-event
        constraints: one of PRE_EVENT, POST_EVENT
      - name: appraiser_user_id
        type: string
        source: system
        description: X-User-ID that created the appraisal; input to the SoD-1 check
      - name: appraiser_license_no
        type: string
        source: input
        description: State appraiser license number
      - name: effective_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the opinion of value is effective; inclusive start of the half-open validity interval
      - name: validity_end_date
        type: string
        source: computed
        description: effective_date + APPRAISAL_VALIDITY_MONTHS calendar months; EXCLUSIVE upper bound of the half-open validity interval; null while DRAFT
      - name: indicated_value_cents
        type: integer
        source: input
        description: Opinion of value in cents
        constraints: '> 0'
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this appraisal has entered RETURNED_FOR_REVISION
        default: 0
      - name: status
        type: enum
        source: system
        description: Appraisal review lifecycle, cyclic through RETURNED_FOR_REVISION
        default: DRAFT
        constraints: one of DRAFT, SUBMITTED, RETURNED_FOR_REVISION, ACCEPTED, REJECTED

  - name: DuplicationOfBenefitsRecord
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel whose offer this prior benefit reduces
      - name: benefit_source
        type: enum
        source: input
        description: Source of the prior disaster benefit; selects the source factor
        constraints: one of NFIP_CLAIM, ICC, PRIVATE_INSURANCE, SBA_LOAN, CDBG_DR
      - name: amount_cents
        type: integer
        source: input
        description: Gross benefit amount received by the owner
        constraints: '> 0'
      - name: repair_documented_cents
        type: integer
        source: input
        description: Portion of the benefit the owner documented as spent on eligible repairs
        default: 0
        constraints: '>= 0'
      - name: deductible_cents
        type: integer
        source: computed
        description: Per-record deduction after repair offset and source factor - see calculations.dob_deduction_total
        default: 0
      - name: received_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the benefit was received; primary sort key of the deduction sweep
      - name: status
        type: enum
        source: system
        description: ACTIVE records enter the deduction sweep; REVERSED records are excluded
        default: ACTIVE
        constraints: one of ACTIVE, REVERSED
      - name: reversal_reason
        type: string
        source: input
        description: Free-text justification recorded when the record is reversed; null while ACTIVE

  - name: PurchaseOffer
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel being offered on
      - name: source_appraisal_id
        type: string
        source: input
        description: FK -> Appraisal.id; the ACCEPTED REVIEW appraisal whose indicated_value_cents seeds base_value_cents
      - name: offer_basis
        type: enum
        source: input
        description: Valuation basis the offer is built on; must correspond to the source appraisal's valuation_basis
        constraints: one of PRE_EVENT_FMV, POST_EVENT_FMV
      - name: base_value_cents
        type: integer
        source: computed
        description: indicated_value_cents of source_appraisal_id, snapshotted at offer creation
        default: 0
      - name: dob_deduction_cents
        type: integer
        source: computed
        description: Parcel.dob_deduction_total_cents snapshotted at offer creation
        default: 0
      - name: pre_incentive_net_cents
        type: integer
        source: computed
        description: max(0, base_value_cents - dob_deduction_cents); the pinned sole input to the incentive tier lookup
        default: 0
      - name: incentive_cents
        type: integer
        source: computed
        description: Owner-occupant incentive - see calculations.net_offer_amount step 4
        default: 0
      - name: net_offer_cents
        type: integer
        source: computed
        description: pre_incentive_net_cents + incentive_cents
        default: 0
      - name: presented_at
        type: datetime
        source: system
        description: Logical-clock ISO 8601 UTC timestamp when the offer was presented; null while DRAFT
      - name: expires_at
        type: datetime
        source: computed
        description: presented_at + OFFER_VALIDITY_DAYS; null while DRAFT
      - name: withdrawal_reason
        type: string
        source: input
        description: Free-text justification recorded when the offer is withdrawn; null otherwise
      - name: superseded_by_offer_id
        type: string
        source: system
        description: FK -> PurchaseOffer.id; set on the prior offer when a replacement offer is created on the same parcel (self-referential); null otherwise
      - name: status
        type: enum
        source: system
        description: Offer lifecycle; branches from PRESENTED into four terminal outcomes with different side-effect sets
        default: DRAFT
        constraints: one of DRAFT, PRESENTED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN, SUPERSEDED
      - name: expected_parcel_version
        type: integer
        source: input
        description: OCC guard - the Parcel.version the client last observed; see concurrency_rules.offer-create-stale-parcel
        constraints: '>= 1'
  - name: RelocationCase
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the displacement site
      - name: displacee_type
        type: enum
        source: input
        description: Federal relocation-law class of the displaced person
        constraints: one of OWNER_OCCUPANT, TENANT_90_DAY, TENANT_UNDER_90_DAY, BUSINESS
      - name: household_reference
        type: string
        source: input
        description: Subrecipient-assigned displacee reference; unique within parcel_id only. The SAME household_reference may appear on two different parcels of one project, which is what makes the rental-assistance interval overlap check (validations priority 43) reachable
      - name: acquisition_price_cents
        type: integer
        source: computed
        description: net_offer_cents of the PurchaseOffer with status == ACCEPTED on parcel_id, snapshotted at eligibility determination
        default: 0
      - name: comparable_dwelling_price_cents
        type: integer
        source: input
        description: Price of the comparable replacement dwelling; required when displacee_type == OWNER_OCCUPANT
        default: 0
      - name: actual_purchase_price_cents
        type: integer
        source: input
        description: Price actually paid for the replacement dwelling; required when rhp_method == ACTUAL_REPLACEMENT
        default: 0
      - name: current_rent_cents
        type: integer
        source: input
        description: Monthly contract rent at displacement
        default: 0
      - name: current_utility_cents
        type: integer
        source: input
        description: Monthly utility allowance at displacement
        default: 0
      - name: comparable_rent_cents
        type: integer
        source: input
        description: Monthly rent of the comparable replacement rental
        default: 0
      - name: comparable_utility_cents
        type: integer
        source: input
        description: Monthly utility allowance of the comparable replacement rental
        default: 0
      - name: monthly_gross_income_cents
        type: integer
        source: input
        description: Monthly gross household income used for the ability-to-pay leg of the rental-assistance formula
        default: 0
      - name: rhp_method
        type: enum
        source: input
        description: Selects the replacement_housing_payment variant; recorded at eligibility determination
        constraints: one of COMPARABLE_DWELLING, ACTUAL_REPLACEMENT
      - name: rental_assistance_start_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); inclusive start of the rental-assistance occupation interval on the household
      - name: rental_assistance_months
        type: integer
        source: computed
        description: Months of rental assistance granted by displacee_type tier - see calculations.rental_assistance_payment
        default: 0
      - name: rental_assistance_end_date
        type: string
        source: computed
        description: rental_assistance_start_date + rental_assistance_months calendar months; EXCLUSIVE end of the rental-assistance occupation interval; null until eligibility determination
      - name: replacement_housing_payment_cents
        type: integer
        source: computed
        description: Replacement housing payment - see calculations.replacement_housing_payment
        default: 0
      - name: rental_assistance_cents
        type: integer
        source: computed
        description: Rental assistance payment - see calculations.rental_assistance_payment
        default: 0
      - name: moving_expense_cents
        type: integer
        source: input
        description: Fixed moving-expense schedule payment recorded at eligibility determination
        default: 0
      - name: total_relocation_benefit_cents
        type: integer
        source: computed
        description: replacement_housing_payment_cents + rental_assistance_cents + moving_expense_cents
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: Free-text reason recorded when a claim is denied; null otherwise
      - name: appeal_basis
        type: string
        source: input
        description: Free-text basis recorded when the displacee appeals a denial; null otherwise
      - name: appeal_count
        type: integer
        source: computed
        description: Number of times the case has entered APPEALED
        default: 0
      - name: status
        type: enum
        source: system
        description: Relocation claim lifecycle, cyclic through APPEALED
        default: OPENED
        constraints: one of OPENED, ELIGIBILITY_DETERMINED, CLAIM_SUBMITTED, CLAIM_PAID, CLAIM_DENIED, APPEALED, CLAIM_DENIED_FINAL

  - name: ClosingRecord
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel being conveyed
      - name: accepted_offer_id
        type: string
        source: input
        description: FK -> PurchaseOffer.id; the PurchaseOffer with status == ACCEPTED funding this closing
      - name: scheduled_closing_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the closing is scheduled for
      - name: purchase_price_cents
        type: integer
        source: computed
        description: net_offer_cents of accepted_offer_id, snapshotted at ClosingRecord creation
        default: 0
      - name: settlement_cost_cents
        type: integer
        source: input
        description: Eligible settlement and recording costs paid by the subrecipient
        default: 0
        constraints: '>= 0'
      - name: funded_at
        type: datetime
        source: system
        description: Logical-clock ISO 8601 UTC timestamp of funding; null until FUNDED
      - name: funded_by_user_id
        type: string
        source: system
        description: X-User-ID that funded the closing; null until FUNDED
      - name: recording_reference
        type: string
        source: input
        description: County recorder book/page reference supplied at deed recording; null until RECORDED
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock ISO 8601 UTC timestamp of deed recording; null until RECORDED
      - name: status
        type: enum
        source: system
        description: Closing lifecycle
        default: SCHEDULED
        constraints: one of SCHEDULED, FUNDED, RECORDED

  - name: DemolitionContractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the demolition contractor
        constraints: unique across all contractors
      - name: license_no
        type: string
        source: input
        description: State demolition contractor license number
      - name: asbestos_certified
        type: boolean
        source: input
        description: True when the contractor holds NESHAP asbestos abatement certification
        default: false
      - name: max_concurrent_work_orders
        type: integer
        source: input
        description: Aggregate capacity - how many buffered demolition windows this contractor may hold at once
        default: 1
        constraints: 1 <= value <= 10
      - name: status
        type: enum
        source: system
        description: Contractor eligibility posture; SUSPENDED contractors may not start work
        default: ACTIVE
        constraints: one of ACTIVE, SUSPENDED
      - name: active_work_order_count
        type: integer
        source: computed
        description: Count of DemolitionWorkOrder with contractor_id == this contractor and status IN {ISSUED, UTILITY_HOLD, READY, IN_PROGRESS, FAILED_INSPECTION}
        default: 0

  - name: DemolitionWorkOrder
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel to be cleared
      - name: contractor_id
        type: string
        source: input
        description: FK -> DemolitionContractor.id; the contractor whose buffered window capacity this work order occupies
      - name: asbestos_survey_status
        type: enum
        source: input
        description: NESHAP asbestos survey posture; CLEARED or ABATED is required before work starts
        default: NOT_PERFORMED
        constraints: one of NOT_PERFORMED, PERFORMED_POSITIVE, ABATED, CLEARED
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive start of the CLOSED demolition window [scheduled_start, scheduled_end]
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive end of the CLOSED demolition window; must be > scheduled_start
      - name: buffered_start
        type: datetime
        source: computed
        description: scheduled_start - DEMOLITION_BUFFER_HOURS; inclusive start of the mobilization-buffered occupation interval
      - name: buffered_end
        type: datetime
        source: computed
        description: scheduled_end + DEMOLITION_BUFFER_HOURS; inclusive end of the mobilization-buffered occupation interval
      - name: required_utility_types
        type: array
        source: computed
        description: Copy of REQUIRED_UTILITY_TYPES; each must exist as a CONFIRMED UtilityDisconnection child before the work order becomes READY
      - name: confirmed_utility_types
        type: array
        source: computed
        description: utility_type values of UtilityDisconnection children with status == CONFIRMED, ordered by UtilityDisconnection.created_at ASC
      - name: total_debris_tons
        type: number
        source: input
        description: Total debris tonnage reported at completion, 2 decimal places
        default: 0
        constraints: '>= 0'
      - name: recycled_tons
        type: number
        source: input
        description: Tonnage diverted to recycling, 2 decimal places
        default: 0
        constraints: '>= 0 and <= total_debris_tons'
      - name: diversion_pct
        type: number
        source: computed
        description: Debris diversion percentage - see calculations.debris_diversion_pct
        default: 0
      - name: disposal_manifest_no
        type: string
        source: input
        description: Debris disposal manifest number recorded at completion; null until COMPLETED
      - name: disposal_facility_type
        type: enum
        source: input
        description: Destination of the non-diverted debris; recorded at completion
        constraints: one of LANDFILL, RECYCLING, COMBINED
      - name: failed_inspection_count
        type: integer
        source: computed
        description: Number of times the work order has entered FAILED_INSPECTION
        default: 0
      - name: status
        type: enum
        source: system
        description: Compound state - UTILITY_HOLD/READY derive from UtilityDisconnection children; cyclic through FAILED_INSPECTION
        default: ISSUED
        constraints: one of ISSUED, UTILITY_HOLD, READY, IN_PROGRESS, FAILED_INSPECTION, COMPLETED

  - name: UtilityDisconnection
    parent: DemolitionWorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: FK -> DemolitionWorkOrder.id; the demolition this disconnection gates
      - name: utility_type
        type: enum
        source: input
        description: Utility being disconnected; unique within work_order_id
        constraints: one of WATER, ELECTRIC, GAS, SEWER
      - name: provider_name
        type: string
        source: input
        description: Utility provider performing the disconnection
      - name: confirmation_reference
        type: string
        source: input
        description: Provider confirmation number; required when outcome == CONFIRMED
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock ISO 8601 UTC timestamp of the most recent resolve attempt; null while PENDING
      - name: failed_attempt_count
        type: integer
        source: computed
        description: Number of FAILED resolve outcomes recorded on this disconnection
        default: 0
      - name: status
        type: enum
        source: system
        description: Disconnection lifecycle, cyclic through FAILED
        default: PENDING
        constraints: one of PENDING, CONFIRMED, FAILED

  - name: DeedRestriction
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel encumbered in perpetuity
      - name: closing_record_id
        type: string
        source: input
        description: FK -> ClosingRecord.id; the closing whose deed recording created this restriction
      - name: restriction_type
        type: enum
        source: system
        description: Only perpetual open space is permitted by the program
        default: OPEN_SPACE_PERPETUAL
        constraints: one of OPEN_SPACE_PERPETUAL
      - name: prohibited_uses
        type: array
        source: system
        description: Copy of PROHIBITED_USE_CODES enforced on the parcel in perpetuity
      - name: recorded_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) the restriction was recorded; the date part of the logical clock at the recording call
      - name: monitoring_interval_months
        type: integer
        source: system
        description: Copy of MONITORING_INTERVAL_MONTHS
        default: 36
      - name: next_monitoring_due_date
        type: string
        source: computed
        description: ISO 8601 date (YYYY-MM-DD) the next monitoring inspection is due - see calculations.monitoring_schedule
      - name: corrective_deadline_date
        type: string
        source: computed
        description: ISO 8601 date (YYYY-MM-DD) the open violation must be cured by; null unless status == VIOLATION_OPEN
      - name: open_violation_code
        type: enum
        source: computed
        description: Prohibited-use code of the open violation; null unless status == VIOLATION_OPEN
        constraints: one of NEW_STRUCTURE, FILL_PLACEMENT, RESALE_FOR_DEVELOPMENT, PERMANENT_STORAGE
      - name: violation_reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceMonitor that recorded the PROHIBITED_USE_OBSERVED inspection; input to the SoD-3 check; null unless a violation has been reported
      - name: cured_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) the most recent violation was cured; null until a cure is recorded
      - name: maintenance_responsible_party
        type: string
        source: input
        description: Entity accountable for long-term open-space maintenance, supplied at deed recording
      - name: termination_authorization_reference
        type: string
        source: input
        description: Federal termination authorization reference; must start with OPEN_SPACE_TERMINATION_AUTH_PREFIX; null unless status == TERMINATED
      - name: status
        type: enum
        source: system
        description: Restriction compliance lifecycle, cyclic through VIOLATION_OPEN and CURED
        default: RECORDED
        constraints: one of RECORDED, IN_COMPLIANCE, VIOLATION_OPEN, CURED, TERMINATED

  - name: MonitoringInspection
    parent: DeedRestriction
    common_fields: false
    fields:
      - name: deed_restriction_id
        type: string
        source: input
        description: FK -> DeedRestriction.id; the restriction inspected
      - name: inspection_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the site visit occurred
      - name: finding
        type: enum
        source: input
        description: Outcome of the site visit
        constraints: one of COMPLIANT, PROHIBITED_USE_OBSERVED
      - name: prohibited_use_code
        type: enum
        source: input
        description: Required when finding == PROHIBITED_USE_OBSERVED; must be null when finding == COMPLIANT
        constraints: one of NEW_STRUCTURE, FILL_PLACEMENT, RESALE_FOR_DEVELOPMENT, PERMANENT_STORAGE
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceMonitor that recorded the inspection
      - name: narrative
        type: string
        source: input
        description: Observation narrative

  - name: ProgramIncomeLedgerEntry
    parent: MitigationProject
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> MitigationProject.id; the project the income accrues to
      - name: applied_to_parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; optional parcel the entry is attributed to; null for project-level entries
      - name: entry_type
        type: enum
        source: input
        description: Nature of the program-income movement; EXPENDITURE is applied as a debit
        constraints: one of LEASE_REVENUE, SALVAGE_PROCEEDS, EASEMENT_FEE, DOB_RECOVERY, EXPENDITURE
      - name: amount_cents
        type: integer
        source: input
        description: Gross positive magnitude of the movement
        constraints: '> 0'
      - name: federal_share_cents
        type: integer
        source: computed
        description: Signed federal share of this entry - see calculations.program_income_federal_share
        default: 0
      - name: posted_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the entry is posted; primary sort key of the ledger sweep
      - name: reverses_entry_id
        type: string
        source: input
        description: FK -> ProgramIncomeLedgerEntry.id; set only on a reversing entry (self-referential); null otherwise
      - name: status
        type: enum
        source: system
        description: ACTIVE entries contribute to the balance; REVERSED entries are excluded
        default: ACTIVE
        constraints: one of ACTIVE, REVERSED
      - name: expected_project_version
        type: integer
        source: input
        description: OCC guard - the MitigationProject.version the client last observed; see concurrency_rules.program-income-stale-project
        constraints: '>= 1'
state_machines:
  - entity: MitigationProject
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mitigation-projects/{project_id}/submit"
        actor: SubrecipientCoordinator
        preconditions:
          - "MitigationProject.status == DRAFT"
          - "at least one BenefitCostAnalysis with project_id == this project has status == SUBMITTED"
          - "at least one Parcel with project_id == this project exists"
        side_effects:
          - "MitigationProject.status = SUBMITTED"
          - "increments MitigationProject.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /mitigation-projects/{project_id}/return"
        actor: ProgramAdministrator
        preconditions:
          - "MitigationProject.status == SUBMITTED"
        side_effects:
          - "MitigationProject.status = DRAFT"
          - "every BenefitCostAnalysis with project_id == this project and status == SUBMITTED remains SUBMITTED (no cascade)"
          - "increments MitigationProject.version by 1"
        note: "Revert edge; the project may be resubmitted any number of times."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mitigation-projects/{project_id}/approve with decision == APPROVE"
        actor: ProgramAdministrator
        preconditions:
          - "MitigationProject.status == SUBMITTED"
          - "exactly one BenefitCostAnalysis with project_id == this project has status == VALIDATED"
          - "acting X-User-ID != MitigationProject.validated_by_user_id (SoD-2)"
          - "MitigationProject.validated_bcr >= BCR_APPROVAL_THRESHOLD"
        side_effects:
          - "MitigationProject.status = APPROVED"
          - "recompute MitigationProject.participating_parcel_count, holdout_parcel_count, contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status (calculations.neighborhood_viability_ratio)"
          - "increments MitigationProject.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /mitigation-projects/{project_id}/approve with decision == DENY"
        actor: ProgramAdministrator
        preconditions:
          - "MitigationProject.status == SUBMITTED"
        side_effects:
          - "MitigationProject.status = DENIED"
          - "LINK 1: every Parcel with project_id == this project and acquisition_status IN {NOT_STARTED, APPRAISAL_IN_PROGRESS, VALUE_ESTABLISHED, OFFER_OUTSTANDING, OFFER_ACCEPTED} moves acquisition_status to ACQUISITION_CANCELLED"
          - "LINK 2: each Parcel arriving at ACQUISITION_CANCELLED itself moves every PurchaseOffer on that parcel with status IN {DRAFT, PRESENTED} to WITHDRAWN, ordered by PurchaseOffer.created_at ASC"
          - "LINK 3: each PurchaseOffer arriving at WITHDRAWN itself recomputes MitigationProject.federal_obligated_cents (calculations.federal_obligation), deobligating that offer's federal share"
          - "increments MitigationProject.version by 1"
        note: "Transitive cascade of depth 3 originating from the project DENY decision: MitigationProject -> Parcel.acquisition_status -> PurchaseOffer.status -> MitigationProject.federal_obligated_cents."
      - from: APPROVED
        to: CLOSEOUT_PENDING
        trigger: "POST /mitigation-projects/{project_id}/closeout with decision == INITIATE"
        actor: ProgramAdministrator
        preconditions:
          - "MitigationProject.status == APPROVED"
          - "MitigationProject.participating_parcel_count >= 1"
          - "every Parcel with project_id == this project has acquisition_status IN {OPEN_SPACE_RECORDED, ACQUISITION_CANCELLED}"
          - "no DeedRestriction whose parcel_id belongs to this project has status == VIOLATION_OPEN"
          - "no DeedRestriction whose parcel_id belongs to this project has status IN {RECORDED, IN_COMPLIANCE, CURED} with next_monitoring_due_date < date(clock_now)"
          - "MitigationProject.viability_status != NONVIABLE"
        side_effects:
          - "MitigationProject.status = CLOSEOUT_PENDING"
          - "recompute MitigationProject.program_income_balance_cents (calculations.program_income_federal_share) and protected_open_space_acres (calculations.protected_open_space_acres)"
          - "increments MitigationProject.version by 1"
      - from: CLOSEOUT_PENDING
        to: CLOSED_OUT
        trigger: "POST /mitigation-projects/{project_id}/closeout with decision == FINALIZE"
        actor: ProgramAdministrator
        preconditions:
          - "MitigationProject.status == CLOSEOUT_PENDING"
          - "MitigationProject.program_income_balance_cents == 0"
        side_effects:
          - "MitigationProject.status = CLOSED_OUT"
          - "increments MitigationProject.version by 1"
        note: "Long-term maintenance and deed-restriction monitoring obligations survive CLOSED_OUT; DeedRestriction remains mutable via the monitoring, cure and terminate endpoints after the project is CLOSED_OUT."

  - entity: BenefitCostAnalysis
    initial_state: SUBMITTED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /benefit-cost-analyses/{bca_id}/validate with decision == VALIDATE"
        actor: ProgramAdministrator
        preconditions:
          - "BenefitCostAnalysis.status == SUBMITTED"
          - "MitigationProject.status == SUBMITTED for BenefitCostAnalysis.project_id"
          - "no other BenefitCostAnalysis with the same project_id has status == VALIDATED"
        side_effects:
          - "BenefitCostAnalysis.status = VALIDATED; validated_by_user_id = acting X-User-ID"
          - "MitigationProject.validated_bcr = BenefitCostAnalysis.bcr; validated_bca_method = analysis_method; validated_by_user_id = acting X-User-ID"
          - "increments BenefitCostAnalysis.version by 1; increments MitigationProject.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /benefit-cost-analyses/{bca_id}/validate with decision == REJECT"
        actor: ProgramAdministrator
        preconditions:
          - "BenefitCostAnalysis.status == SUBMITTED"
          - "MitigationProject.status == SUBMITTED for BenefitCostAnalysis.project_id"
        side_effects:
          - "BenefitCostAnalysis.status = REJECTED"
          - "MitigationProject.validated_bcr, validated_bca_method and validated_by_user_id are left unchanged"
          - "increments BenefitCostAnalysis.version by 1"

  - entity: Parcel
    initial_state: NOT_CONTACTED
    terminal_states: [WITHDRAWN]
    note: "PARALLEL DIMENSION 1 of 2 on Parcel - participation_status. Evolves independently of the acquisition_status dimension declared in the next machine; neither dimension's transition list constrains the other's current value except where a precondition says so explicitly."
    transitions:
      - from: NOT_CONTACTED
        to: INTERESTED
        trigger: "POST /parcels/{parcel_id}/participation with participation_decision == INTERESTED"
        actor: SubrecipientCoordinator
        preconditions:
          - "Parcel.participation_status == NOT_CONTACTED"
          - "MitigationProject.status == APPROVED for Parcel.project_id"
        side_effects:
          - "Parcel.participation_status = INTERESTED"
          - "increments Parcel.version by 1"
      - from: INTERESTED
        to: VOLUNTARY_CONFIRMED
        trigger: "POST /parcels/{parcel_id}/participation with participation_decision == CONFIRM_VOLUNTARY"
        actor: SubrecipientCoordinator
        preconditions:
          - "Parcel.participation_status == INTERESTED"
          - "Parcel.pre_event_fmv_cents is not null"
          - "request field voluntary_acknowledgement_signed_on is supplied and <= date(clock_now)"
        side_effects:
          - "Parcel.participation_status = VOLUNTARY_CONFIRMED"
          - "Parcel.voluntary_acknowledgement_signed_on = request voluntary_acknowledgement_signed_on"
          - "increments Parcel.version by 1"
        note: "Voluntary participation cannot be confirmed before the pre-event fair market value determination."
      - from: INTERESTED
        to: DECLINED
        trigger: "POST /parcels/{parcel_id}/participation with participation_decision == DECLINE"
        actor: SubrecipientCoordinator
        preconditions:
          - "Parcel.participation_status == INTERESTED"
        side_effects:
          - "Parcel.participation_status = DECLINED"
          - "LINK 1: Parcel.acquisition_status moves to ACQUISITION_CANCELLED when the current acquisition_status IN {NOT_STARTED, APPRAISAL_IN_PROGRESS, VALUE_ESTABLISHED, OFFER_OUTSTANDING, OFFER_ACCEPTED}"
          - "LINK 2: the Parcel arriving at ACQUISITION_CANCELLED itself moves every PurchaseOffer on this parcel with status IN {DRAFT, PRESENTED} to WITHDRAWN, ordered by PurchaseOffer.created_at ASC"
          - "LINK 3: each PurchaseOffer arriving at WITHDRAWN itself recomputes MitigationProject.federal_obligated_cents (calculations.federal_obligation), deobligating that offer's federal share"
          - "recompute MitigationProject.holdout_parcel_count, contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status"
          - "increments Parcel.version by 1; increments MitigationProject.version by 1"
        note: "Holdout parcel. Transitive cascade of depth 3 originating from the owner's DECLINE decision - distinct trigger from the project-DENY cascade."
      - from: NOT_CONTACTED
        to: DECLINED
        trigger: "POST /parcels/{parcel_id}/participation with participation_decision == DECLINE"
        actor: SubrecipientCoordinator
        preconditions:
          - "Parcel.participation_status == NOT_CONTACTED"
        side_effects:
          - "Parcel.participation_status = DECLINED"
          - "recompute MitigationProject.holdout_parcel_count, neighborhood_viability_ratio, viability_status"
          - "increments Parcel.version by 1; increments MitigationProject.version by 1"
      - from: VOLUNTARY_CONFIRMED
        to: WITHDRAWN
        trigger: "POST /parcels/{parcel_id}/participation with participation_decision == WITHDRAW"
        actor: SubrecipientCoordinator
        preconditions:
          - "Parcel.participation_status == VOLUNTARY_CONFIRMED"
          - "Parcel.acquisition_status NOT IN {CLOSED, DEMOLISHED, OPEN_SPACE_RECORDED}"
        side_effects:
          - "Parcel.participation_status = WITHDRAWN"
          - "Parcel.acquisition_status moves to ACQUISITION_CANCELLED when the current acquisition_status IN {NOT_STARTED, APPRAISAL_IN_PROGRESS, VALUE_ESTABLISHED, OFFER_OUTSTANDING, OFFER_ACCEPTED}"
          - "every PurchaseOffer on this parcel with status IN {DRAFT, PRESENTED} moves to WITHDRAWN, each deobligating its federal share from MitigationProject.federal_obligated_cents"
          - "every RelocationCase on this parcel with status IN {OPENED, ELIGIBILITY_DETERMINED, CLAIM_SUBMITTED, CLAIM_DENIED, APPEALED} moves to CLAIM_DENIED_FINAL"
          - "recompute MitigationProject.participating_parcel_count, neighborhood_viability_ratio, viability_status"
          - "increments Parcel.version by 1; increments MitigationProject.version by 1"
        note: "Withdrawal after the closing has funded is impossible - the deed restriction is perpetual."
      - from: DECLINED
        to: INTERESTED
        trigger: "POST /parcels/{parcel_id}/participation with participation_decision == INTERESTED"
        actor: SubrecipientCoordinator
        preconditions:
          - "Parcel.participation_status == DECLINED"
          - "MitigationProject.status == APPROVED for Parcel.project_id"
        side_effects:
          - "Parcel.participation_status = INTERESTED"
          - "Parcel.acquisition_status moves to NOT_STARTED when the current acquisition_status == ACQUISITION_CANCELLED"
          - "recompute MitigationProject.holdout_parcel_count, neighborhood_viability_ratio, viability_status"
          - "increments Parcel.version by 1; increments MitigationProject.version by 1"
        note: "Cycle edge INTERESTED -> DECLINED -> INTERESTED: a holdout owner may re-enter the program while the project is APPROVED."

  - entity: Parcel
    initial_state: NOT_STARTED
    terminal_states: [OPEN_SPACE_RECORDED, ACQUISITION_CANCELLED]
    note: "PARALLEL DIMENSION 2 of 2 on Parcel - acquisition_status. Advanced by Appraisal, PurchaseOffer, ClosingRecord, DemolitionWorkOrder and DeedRestriction side effects rather than by a dedicated endpoint."
    transitions:
      - from: NOT_STARTED
        to: APPRAISAL_IN_PROGRESS
        trigger: "POST /parcels/{parcel_id}/appraisals with appraisal_type == INITIAL"
        actor: StaffAppraiser
        preconditions:
          - "Parcel.acquisition_status == NOT_STARTED"
          - "Parcel.participation_status IN {INTERESTED, VOLUNTARY_CONFIRMED}"
          - "MitigationProject.status == APPROVED for Parcel.project_id"
        side_effects:
          - "Parcel.acquisition_status = APPRAISAL_IN_PROGRESS"
          - "increments Parcel.version by 1"
      - from: APPRAISAL_IN_PROGRESS
        to: VALUE_ESTABLISHED
        trigger: "system event: an Appraisal on this parcel with appraisal_type == REVIEW reaches ACCEPTED"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == APPRAISAL_IN_PROGRESS"
          - "the accepted Appraisal has appraisal_type == REVIEW"
        side_effects:
          - "Parcel.acquisition_status = VALUE_ESTABLISHED"
          - "increments Parcel.version by 1"
      - from: VALUE_ESTABLISHED
        to: OFFER_OUTSTANDING
        trigger: "system event: a PurchaseOffer on this parcel reaches PRESENTED"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == VALUE_ESTABLISHED"
        side_effects:
          - "Parcel.acquisition_status = OFFER_OUTSTANDING"
          - "increments Parcel.version by 1"
      - from: OFFER_OUTSTANDING
        to: OFFER_ACCEPTED
        trigger: "system event: the PurchaseOffer with status == PRESENTED on this parcel reaches ACCEPTED"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == OFFER_OUTSTANDING"
        side_effects:
          - "Parcel.acquisition_status = OFFER_ACCEPTED"
          - "increments Parcel.version by 1"
      - from: OFFER_OUTSTANDING
        to: VALUE_ESTABLISHED
        trigger: "system event: the PurchaseOffer with status == PRESENTED on this parcel reaches DECLINED, EXPIRED or WITHDRAWN"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == OFFER_OUTSTANDING"
          - "no other PurchaseOffer on this parcel has status == PRESENTED"
        side_effects:
          - "Parcel.acquisition_status = VALUE_ESTABLISHED"
          - "increments Parcel.version by 1"
        note: "Revert edge enabling a superseding offer without re-appraisal."
      - from: OFFER_ACCEPTED
        to: CLOSED
        trigger: "system event: the ClosingRecord whose accepted_offer_id is this parcel's ACCEPTED offer reaches FUNDED"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == OFFER_ACCEPTED"
        side_effects:
          - "Parcel.acquisition_status = CLOSED"
          - "recompute MitigationProject.contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status"
          - "increments Parcel.version by 1; increments MitigationProject.version by 1"
      - from: CLOSED
        to: DEMOLISHED
        trigger: "system event: a DemolitionWorkOrder on this parcel reaches COMPLETED"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == CLOSED"
        side_effects:
          - "Parcel.acquisition_status = DEMOLISHED"
          - "increments Parcel.version by 1"
      - from: DEMOLISHED
        to: OPEN_SPACE_RECORDED
        trigger: "system event: a DeedRestriction is created for this parcel by the ClosingRecord FUNDED -> RECORDED transition"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == DEMOLISHED"
        side_effects:
          - "Parcel.acquisition_status = OPEN_SPACE_RECORDED"
          - "recompute MitigationProject.protected_open_space_acres (calculations.protected_open_space_acres)"
          - "increments Parcel.version by 1; increments MitigationProject.version by 1"
      - from: NOT_STARTED
        to: ACQUISITION_CANCELLED
        trigger: "system event: Parcel.participation_status moves to DECLINED or WITHDRAWN, or MitigationProject.status moves to DENIED"
        actor: system
        preconditions:
          - "Parcel.acquisition_status IN {NOT_STARTED, APPRAISAL_IN_PROGRESS, VALUE_ESTABLISHED, OFFER_OUTSTANDING, OFFER_ACCEPTED}"
        side_effects:
          - "Parcel.acquisition_status = ACQUISITION_CANCELLED"
          - "every PurchaseOffer on this parcel with status IN {DRAFT, PRESENTED} moves to WITHDRAWN"
          - "increments Parcel.version by 1"
        note: "Conditional cascade - parcels already CLOSED, DEMOLISHED or OPEN_SPACE_RECORDED are never cancelled. Reachable from any of the four pre-closing acquisition states."
      - from: ACQUISITION_CANCELLED
        to: NOT_STARTED
        trigger: "system event: Parcel.participation_status moves DECLINED -> INTERESTED"
        actor: system
        preconditions:
          - "Parcel.acquisition_status == ACQUISITION_CANCELLED"
          - "Parcel.participation_status == DECLINED immediately before the participation transition"
        side_effects:
          - "Parcel.acquisition_status = NOT_STARTED"
          - "increments Parcel.version by 1"
        note: "Cycle edge on the acquisition dimension mirroring the participation re-entry cycle."

  - entity: Appraisal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /appraisals/{appraisal_id}/submit"
        actor: StaffAppraiser
        preconditions:
          - "Appraisal.status == DRAFT"
          - "acting X-User-ID == Appraisal.appraiser_user_id"
          - "when appraisal_type == INITIAL: no other Appraisal with the same parcel_id, appraisal_type == INITIAL and status IN {SUBMITTED, ACCEPTED} has a half-open validity interval [effective_date, validity_end_date) that intersects this appraisal's own half-open validity interval"
        side_effects:
          - "Appraisal.status = SUBMITTED"
          - "Appraisal.validity_end_date = effective_date + APPRAISAL_VALIDITY_MONTHS calendar months"
          - "increments Appraisal.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /appraisals/{appraisal_id}/review-decision with decision == RETURN"
        actor: ReviewAppraiser
        preconditions:
          - "Appraisal.status == SUBMITTED"
          - "acting X-User-ID != Appraisal.appraiser_user_id (SoD-1)"
        side_effects:
          - "Appraisal.status = RETURNED_FOR_REVISION"
          - "Appraisal.revision_count += 1"
          - "increments Appraisal.version by 1"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /appraisals/{appraisal_id}/submit"
        actor: StaffAppraiser
        preconditions:
          - "Appraisal.status == RETURNED_FOR_REVISION"
          - "acting X-User-ID == Appraisal.appraiser_user_id"
          - "Appraisal.revision_count <= MAX_APPRAISAL_REVISIONS"
          - "when appraisal_type == INITIAL: the half-open validity interval overlap check above still passes against the (possibly revised) effective_date"
        side_effects:
          - "Appraisal.status = SUBMITTED"
          - "Appraisal.validity_end_date recomputed from the current effective_date"
          - "increments Appraisal.version by 1"
        note: "Cycle edge SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED, bounded by MAX_APPRAISAL_REVISIONS."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /appraisals/{appraisal_id}/review-decision with decision == ACCEPT"
        actor: ReviewAppraiser
        preconditions:
          - "Appraisal.status == SUBMITTED"
          - "acting X-User-ID != Appraisal.appraiser_user_id (SoD-1)"
          - "when appraisal_type == REVIEW: Appraisal.reviewed_appraisal_id names an Appraisal with appraisal_type == INITIAL and status == ACCEPTED"
          - "when appraisal_type == REVIEW: acting X-User-ID != the reviewed INITIAL Appraisal.appraiser_user_id (SoD-1)"
        side_effects:
          - "Appraisal.status = ACCEPTED"
          - "when appraisal_type == REVIEW: Parcel.acquisition_status moves APPRAISAL_IN_PROGRESS -> VALUE_ESTABLISHED (increments Parcel.version by 1)"
          - "increments Appraisal.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /appraisals/{appraisal_id}/review-decision with decision == REJECT"
        actor: ReviewAppraiser
        preconditions:
          - "Appraisal.status == SUBMITTED"
          - "acting X-User-ID != Appraisal.appraiser_user_id (SoD-1)"
        side_effects:
          - "Appraisal.status = REJECTED"
          - "increments Appraisal.version by 1"
      - from: RETURNED_FOR_REVISION
        to: REJECTED
        trigger: "POST /appraisals/{appraisal_id}/review-decision with decision == REJECT"
        actor: ReviewAppraiser
        preconditions:
          - "Appraisal.status == RETURNED_FOR_REVISION"
          - "acting X-User-ID != Appraisal.appraiser_user_id (SoD-1)"
        side_effects:
          - "Appraisal.status = REJECTED"
          - "increments Appraisal.version by 1"

  - entity: PurchaseOffer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, WITHDRAWN, SUPERSEDED]
    note: "BRANCHING machine: PRESENTED forks into four terminal outcomes whose side-effect sets differ - ACCEPTED advances the parcel, while DECLINED / EXPIRED / WITHDRAWN each revert the parcel and deobligate the federal share."
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /purchase-offers/{offer_id}/present"
        actor: SubrecipientCoordinator
        preconditions:
          - "PurchaseOffer.status == DRAFT"
          - "Parcel.participation_status == VOLUNTARY_CONFIRMED"
          - "Parcel.acquisition_status == VALUE_ESTABLISHED"
          - "PurchaseOffer.source_appraisal_id names an Appraisal with appraisal_type == REVIEW and status == ACCEPTED"
          - "MitigationProject.federal_obligated_cents + round_half_up(PurchaseOffer.net_offer_cents * MitigationProject.cost_share_federal_pct) <= MitigationProject.total_federal_share_cap_cents"
        side_effects:
          - "PurchaseOffer.status = PRESENTED; presented_at = clock_now; expires_at = clock_now + OFFER_VALIDITY_DAYS"
          - "Parcel.acquisition_status moves VALUE_ESTABLISHED -> OFFER_OUTSTANDING"
          - "recompute MitigationProject.federal_obligated_cents (calculations.federal_obligation)"
          - "increments PurchaseOffer.version by 1; increments Parcel.version by 1; increments MitigationProject.version by 1"
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /purchase-offers/{offer_id}/owner-response with response == ACCEPT"
        actor: SubrecipientCoordinator
        preconditions:
          - "PurchaseOffer.status == PRESENTED"
          - "clock_now <= PurchaseOffer.expires_at"
          - "Parcel.participation_status == VOLUNTARY_CONFIRMED"
        side_effects:
          - "PurchaseOffer.status = ACCEPTED"
          - "Parcel.acquisition_status moves OFFER_OUTSTANDING -> OFFER_ACCEPTED"
          - "MitigationProject.federal_obligated_cents unchanged (the obligation already booked at PRESENTED carries over to ACCEPTED)"
          - "increments PurchaseOffer.version by 1; increments Parcel.version by 1"
        note: "ACCEPT branch - the only branch that advances the acquisition dimension."
      - from: PRESENTED
        to: DECLINED
        trigger: "POST /purchase-offers/{offer_id}/owner-response with response == DECLINE"
        actor: SubrecipientCoordinator
        preconditions:
          - "PurchaseOffer.status == PRESENTED"
          - "clock_now <= PurchaseOffer.expires_at"
        side_effects:
          - "PurchaseOffer.status = DECLINED"
          - "Parcel.acquisition_status moves OFFER_OUTSTANDING -> VALUE_ESTABLISHED"
          - "recompute MitigationProject.federal_obligated_cents, deobligating this offer's federal share"
          - "increments PurchaseOffer.version by 1; increments Parcel.version by 1; increments MitigationProject.version by 1"
        note: "DECLINE branch - reverts the parcel and releases the obligation; the parcel stays VOLUNTARY_CONFIRMED so a superseding offer may be built."
      - from: PRESENTED
        to: EXPIRED
        trigger: "POST /purchase-offers/{offer_id}/expire"
        actor: ProgramAdministrator
        preconditions:
          - "PurchaseOffer.status == PRESENTED"
          - "clock_now > PurchaseOffer.expires_at"
        side_effects:
          - "PurchaseOffer.status = EXPIRED"
          - "Parcel.acquisition_status moves OFFER_OUTSTANDING -> VALUE_ESTABLISHED"
          - "recompute MitigationProject.federal_obligated_cents, deobligating this offer's federal share"
          - "increments PurchaseOffer.version by 1; increments Parcel.version by 1; increments MitigationProject.version by 1"
        note: "EXPIRE branch - identical parcel/ledger effects to DECLINE but gated on the offer validity window instead of an owner response."
      - from: PRESENTED
        to: WITHDRAWN
        trigger: "POST /purchase-offers/{offer_id}/withdraw"
        actor: SubrecipientCoordinator
        preconditions:
          - "PurchaseOffer.status == PRESENTED"
        side_effects:
          - "PurchaseOffer.status = WITHDRAWN; withdrawal_reason = request withdrawal_reason"
          - "Parcel.acquisition_status moves OFFER_OUTSTANDING -> VALUE_ESTABLISHED"
          - "recompute MitigationProject.federal_obligated_cents, deobligating this offer's federal share"
          - "increments PurchaseOffer.version by 1; increments Parcel.version by 1; increments MitigationProject.version by 1"
        note: "WITHDRAW branch - the compensating action for PRESENT; calculations.federal_obligation must return to its exact pre-PRESENT value."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /purchase-offers/{offer_id}/withdraw"
        actor: SubrecipientCoordinator
        preconditions:
          - "PurchaseOffer.status == DRAFT"
        side_effects:
          - "PurchaseOffer.status = WITHDRAWN; withdrawal_reason = request withdrawal_reason"
          - "MitigationProject.federal_obligated_cents unchanged (a DRAFT offer was never obligated)"
          - "increments PurchaseOffer.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: a new PurchaseOffer is created on the same parcel_id by POST /parcels/{parcel_id}/purchase-offers"
        actor: system
        preconditions:
          - "PurchaseOffer.status IN {DRAFT, DECLINED, EXPIRED}"
        side_effects:
          - "PurchaseOffer.status = SUPERSEDED; superseded_by_offer_id = the newly created PurchaseOffer.id"
          - "increments PurchaseOffer.version by 1"
        note: "CREATE-with-supersede. Also fires from DECLINED and EXPIRED. This is the product semantics that makes concurrency_rules.offer-create-stale-parcel a genuine OCC case rather than a state precondition."
      - from: DECLINED
        to: SUPERSEDED
        trigger: "system event: a new PurchaseOffer is created on the same parcel_id by POST /parcels/{parcel_id}/purchase-offers"
        actor: system
        preconditions:
          - "PurchaseOffer.status == DECLINED"
        side_effects:
          - "PurchaseOffer.status = SUPERSEDED; superseded_by_offer_id = the newly created PurchaseOffer.id"
          - "increments PurchaseOffer.version by 1"
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system event: a new PurchaseOffer is created on the same parcel_id by POST /parcels/{parcel_id}/purchase-offers"
        actor: system
        preconditions:
          - "PurchaseOffer.status == EXPIRED"
        side_effects:
          - "PurchaseOffer.status = SUPERSEDED; superseded_by_offer_id = the newly created PurchaseOffer.id"
          - "increments PurchaseOffer.version by 1"

  - entity: RelocationCase
    initial_state: OPENED
    terminal_states: [CLAIM_PAID, CLAIM_DENIED_FINAL]
    transitions:
      - from: OPENED
        to: ELIGIBILITY_DETERMINED
        trigger: "POST /relocation-cases/{case_id}/determine-eligibility"
        actor: RelocationSpecialist
        preconditions:
          - "RelocationCase.status == OPENED"
          - "exactly one PurchaseOffer with parcel_id == RelocationCase.parcel_id has status == ACCEPTED"
          - "no other RelocationCase in the same project (Parcel.project_id) with the same household_reference has a rental-assistance occupation interval [rental_assistance_start_date, rental_assistance_end_date) that intersects this case's interval"
        side_effects:
          - "RelocationCase.status = ELIGIBILITY_DETERMINED"
          - "RelocationCase.acquisition_price_cents = net_offer_cents of that ACCEPTED PurchaseOffer"
          - "compute RelocationCase.rental_assistance_months, rental_assistance_end_date, replacement_housing_payment_cents (calculations.replacement_housing_payment), rental_assistance_cents (calculations.rental_assistance_payment) and total_relocation_benefit_cents"
          - "increments RelocationCase.version by 1"
      - from: ELIGIBILITY_DETERMINED
        to: CLAIM_SUBMITTED
        trigger: "POST /relocation-cases/{case_id}/submit-claim"
        actor: RelocationSpecialist
        preconditions:
          - "RelocationCase.status == ELIGIBILITY_DETERMINED"
          - "RelocationCase.displacee_type != TENANT_UNDER_90_DAY"
        side_effects:
          - "RelocationCase.status = CLAIM_SUBMITTED"
          - "increments RelocationCase.version by 1"
      - from: CLAIM_SUBMITTED
        to: CLAIM_PAID
        trigger: "POST /relocation-cases/{case_id}/resolve-claim with decision == PAY"
        actor: ProgramAdministrator
        preconditions:
          - "RelocationCase.status == CLAIM_SUBMITTED"
          - "MitigationProject.federal_obligated_cents + round_half_up(RelocationCase.total_relocation_benefit_cents * MitigationProject.cost_share_federal_pct) <= MitigationProject.total_federal_share_cap_cents"
        side_effects:
          - "RelocationCase.status = CLAIM_PAID"
          - "recompute MitigationProject.federal_obligated_cents (calculations.federal_obligation), obligating this case's federal share"
          - "increments RelocationCase.version by 1; increments MitigationProject.version by 1"
      - from: CLAIM_SUBMITTED
        to: CLAIM_DENIED
        trigger: "POST /relocation-cases/{case_id}/resolve-claim with decision == DENY"
        actor: ProgramAdministrator
        preconditions:
          - "RelocationCase.status == CLAIM_SUBMITTED"
        side_effects:
          - "RelocationCase.status = CLAIM_DENIED; denial_reason = request denial_reason"
          - "increments RelocationCase.version by 1"
      - from: CLAIM_DENIED
        to: APPEALED
        trigger: "POST /relocation-cases/{case_id}/appeal"
        actor: RelocationSpecialist
        preconditions:
          - "RelocationCase.status == CLAIM_DENIED"
          - "RelocationCase.appeal_count < MAX_RELOCATION_APPEALS"
        side_effects:
          - "RelocationCase.status = APPEALED; appeal_basis = request appeal_basis; appeal_count += 1"
          - "increments RelocationCase.version by 1"
      - from: APPEALED
        to: CLAIM_SUBMITTED
        trigger: "POST /relocation-cases/{case_id}/submit-claim"
        actor: RelocationSpecialist
        preconditions:
          - "RelocationCase.status == APPEALED"
          - "RelocationCase.displacee_type != TENANT_UNDER_90_DAY"
        side_effects:
          - "RelocationCase.status = CLAIM_SUBMITTED"
          - "increments RelocationCase.version by 1"
        note: "Cycle edge CLAIM_SUBMITTED -> CLAIM_DENIED -> APPEALED -> CLAIM_SUBMITTED, bounded by MAX_RELOCATION_APPEALS."
      - from: APPEALED
        to: CLAIM_DENIED_FINAL
        trigger: "POST /relocation-cases/{case_id}/resolve-claim with decision == DENY"
        actor: ProgramAdministrator
        preconditions:
          - "RelocationCase.status == APPEALED"
        side_effects:
          - "RelocationCase.status = CLAIM_DENIED_FINAL; denial_reason = request denial_reason"
          - "increments RelocationCase.version by 1"
      - from: CLAIM_DENIED
        to: CLAIM_DENIED_FINAL
        trigger: "system event: Parcel.participation_status moves VOLUNTARY_CONFIRMED -> WITHDRAWN"
        actor: system
        preconditions:
          - "RelocationCase.status IN {OPENED, ELIGIBILITY_DETERMINED, CLAIM_SUBMITTED, CLAIM_DENIED, APPEALED}"
        side_effects:
          - "RelocationCase.status = CLAIM_DENIED_FINAL"
          - "increments RelocationCase.version by 1"
        note: "Cascade-down from the parcel withdrawal; reachable from every non-terminal case state."

  - entity: ClosingRecord
    initial_state: SCHEDULED
    terminal_states: [RECORDED]
    transitions:
      - from: SCHEDULED
        to: FUNDED
        trigger: "POST /closing-records/{closing_id}/fund"
        actor: ProgramAdministrator
        preconditions:
          - "ClosingRecord.status == SCHEDULED"
          - "Parcel.acquisition_status == OFFER_ACCEPTED"
          - "ClosingRecord.scheduled_closing_date <= MitigationProject.period_of_performance_end_date"
          - "every RelocationCase with parcel_id == ClosingRecord.parcel_id has status IN {CLAIM_PAID, CLAIM_DENIED_FINAL}"
          - "MitigationProject.federal_obligated_cents + round_half_up(ClosingRecord.settlement_cost_cents * MitigationProject.cost_share_federal_pct) <= MitigationProject.total_federal_share_cap_cents"
        side_effects:
          - "ClosingRecord.status = FUNDED; funded_at = clock_now; funded_by_user_id = acting X-User-ID"
          - "Parcel.acquisition_status moves OFFER_ACCEPTED -> CLOSED"
          - "recompute MitigationProject.federal_obligated_cents, obligating the settlement-cost federal share"
          - "recompute MitigationProject.contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status"
          - "increments ClosingRecord.version by 1; increments Parcel.version by 1; increments MitigationProject.version by 1"
      - from: FUNDED
        to: RECORDED
        trigger: "POST /closing-records/{closing_id}/record"
        actor: SubrecipientCoordinator
        preconditions:
          - "ClosingRecord.status == FUNDED"
          - "Parcel.acquisition_status == DEMOLISHED"
          - "no DeedRestriction with closing_record_id == this ClosingRecord.id exists"
        side_effects:
          - "ClosingRecord.status = RECORDED; recording_reference = request recording_reference; recorded_at = clock_now"
          - "LINK 1: creates a DeedRestriction with parcel_id == ClosingRecord.parcel_id, closing_record_id == this ClosingRecord.id, status == RECORDED, restriction_type == OPEN_SPACE_PERPETUAL, prohibited_uses = PROHIBITED_USE_CODES, recorded_on = date(clock_now), monitoring_interval_months = MONITORING_INTERVAL_MONTHS, maintenance_responsible_party = request maintenance_responsible_party, next_monitoring_due_date per calculations.monitoring_schedule"
          - "LINK 2: the DeedRestriction creation itself moves Parcel.acquisition_status DEMOLISHED -> OPEN_SPACE_RECORDED"
          - "LINK 3: the Parcel arriving at OPEN_SPACE_RECORDED itself recomputes MitigationProject.protected_open_space_acres (calculations.protected_open_space_acres)"
          - "increments ClosingRecord.version by 1; increments Parcel.version by 1; increments MitigationProject.version by 1"
        note: "Transitive cascade of depth 3 originating from the deed recording: ClosingRecord -> DeedRestriction -> Parcel.acquisition_status -> MitigationProject.protected_open_space_acres."

  - entity: DemolitionContractor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /demolition-contractors/{contractor_id}/status with status == SUSPENDED"
        actor: ProgramAdministrator
        preconditions:
          - "DemolitionContractor.status == ACTIVE"
        side_effects:
          - "DemolitionContractor.status = SUSPENDED"
          - "existing DemolitionWorkOrder rows are left in place; only future READY -> IN_PROGRESS and FAILED_INSPECTION -> IN_PROGRESS transitions are blocked"
          - "increments DemolitionContractor.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /demolition-contractors/{contractor_id}/status with status == ACTIVE"
        actor: ProgramAdministrator
        preconditions:
          - "DemolitionContractor.status == SUSPENDED"
        side_effects:
          - "DemolitionContractor.status = ACTIVE"
          - "increments DemolitionContractor.version by 1"
        note: "Cycle edge - reinstatement."

  - entity: DemolitionWorkOrder
    initial_state: ISSUED
    terminal_states: [COMPLETED]
    note: "COMPOUND machine - the UTILITY_HOLD/READY pair is derived from the statuses of the UtilityDisconnection children; also cyclic through FAILED_INSPECTION and through READY -> UTILITY_HOLD."
    transitions:
      - from: ISSUED
        to: UTILITY_HOLD
        trigger: "system event: the first UtilityDisconnection child is created by POST /demolition-work-orders/{work_order_id}/utility-disconnections"
        actor: system
        preconditions:
          - "DemolitionWorkOrder.status == ISSUED"
        side_effects:
          - "DemolitionWorkOrder.status = UTILITY_HOLD"
          - "increments DemolitionWorkOrder.version by 1"
      - from: UTILITY_HOLD
        to: READY
        trigger: "system event: a UtilityDisconnection child reaches CONFIRMED and the confirmed set becomes complete"
        actor: system
        preconditions:
          - "DemolitionWorkOrder.status == UTILITY_HOLD"
          - "every utility_type in DemolitionWorkOrder.required_utility_types has a UtilityDisconnection child with that utility_type and status == CONFIRMED"
        side_effects:
          - "DemolitionWorkOrder.status = READY"
          - "recompute DemolitionWorkOrder.confirmed_utility_types"
          - "increments DemolitionWorkOrder.version by 1"
      - from: READY
        to: UTILITY_HOLD
        trigger: "system event: a UtilityDisconnection child moves CONFIRMED -> FAILED"
        actor: system
        preconditions:
          - "DemolitionWorkOrder.status == READY"
        side_effects:
          - "DemolitionWorkOrder.status = UTILITY_HOLD"
          - "recompute DemolitionWorkOrder.confirmed_utility_types"
          - "increments DemolitionWorkOrder.version by 1"
        note: "Cycle edge UTILITY_HOLD -> READY -> UTILITY_HOLD driven entirely by child state."
      - from: READY
        to: IN_PROGRESS
        trigger: "POST /demolition-work-orders/{work_order_id}/start"
        actor: SubrecipientCoordinator
        preconditions:
          - "DemolitionWorkOrder.status == READY"
          - "DemolitionWorkOrder.asbestos_survey_status IN {CLEARED, ABATED}"
          - "when asbestos_survey_status == ABATED: the DemolitionContractor named by contractor_id has asbestos_certified == true"
          - "the DemolitionContractor named by contractor_id has status == ACTIVE"
          - "Parcel.acquisition_status == CLOSED"
        side_effects:
          - "DemolitionWorkOrder.status = IN_PROGRESS"
          - "increments DemolitionWorkOrder.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /demolition-work-orders/{work_order_id}/complete"
        actor: SubrecipientCoordinator
        preconditions:
          - "DemolitionWorkOrder.status == IN_PROGRESS"
          - "computed diversion_pct >= MIN_DIVERSION_PCT, OR request total_debris_tons == 0 (zero-quantity waiver)"
        side_effects:
          - "DemolitionWorkOrder.total_debris_tons, recycled_tons, disposal_manifest_no and disposal_facility_type set from the request"
          - "DemolitionWorkOrder.diversion_pct computed (calculations.debris_diversion_pct)"
          - "DemolitionWorkOrder.status = COMPLETED"
          - "Parcel.acquisition_status moves CLOSED -> DEMOLISHED"
          - "recompute DemolitionContractor.active_work_order_count for contractor_id"
          - "increments DemolitionWorkOrder.version by 1; increments Parcel.version by 1; increments DemolitionContractor.version by 1"
      - from: IN_PROGRESS
        to: FAILED_INSPECTION
        trigger: "POST /demolition-work-orders/{work_order_id}/fail-inspection"
        actor: ComplianceMonitor
        preconditions:
          - "DemolitionWorkOrder.status == IN_PROGRESS"
        side_effects:
          - "DemolitionWorkOrder.status = FAILED_INSPECTION; failed_inspection_count += 1"
          - "increments DemolitionWorkOrder.version by 1"
      - from: FAILED_INSPECTION
        to: IN_PROGRESS
        trigger: "POST /demolition-work-orders/{work_order_id}/start"
        actor: SubrecipientCoordinator
        preconditions:
          - "DemolitionWorkOrder.status == FAILED_INSPECTION"
          - "DemolitionWorkOrder.asbestos_survey_status IN {CLEARED, ABATED}"
          - "the DemolitionContractor named by contractor_id has status == ACTIVE"
          - "DemolitionWorkOrder.failed_inspection_count <= MAX_DEMOLITION_REWORKS"
        side_effects:
          - "DemolitionWorkOrder.status = IN_PROGRESS"
          - "increments DemolitionWorkOrder.version by 1"
        note: "Cycle edge IN_PROGRESS -> FAILED_INSPECTION -> IN_PROGRESS, bounded by MAX_DEMOLITION_REWORKS."

  - entity: UtilityDisconnection
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /utility-disconnections/{disconnection_id}/resolve with outcome == CONFIRMED"
        actor: SubrecipientCoordinator
        preconditions:
          - "UtilityDisconnection.status == PENDING"
          - "request confirmation_reference is supplied and non-empty"
          - "the parent DemolitionWorkOrder.status IN {UTILITY_HOLD, READY}"
        side_effects:
          - "UtilityDisconnection.status = CONFIRMED; confirmation_reference set; resolved_at = clock_now"
          - "the parent DemolitionWorkOrder recomputes confirmed_utility_types and, when complete, moves UTILITY_HOLD -> READY"
          - "increments UtilityDisconnection.version by 1; increments DemolitionWorkOrder.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /utility-disconnections/{disconnection_id}/resolve with outcome == FAILED"
        actor: SubrecipientCoordinator
        preconditions:
          - "UtilityDisconnection.status == PENDING"
          - "the parent DemolitionWorkOrder.status IN {UTILITY_HOLD, READY}"
        side_effects:
          - "UtilityDisconnection.status = FAILED; failed_attempt_count += 1; resolved_at = clock_now"
          - "increments UtilityDisconnection.version by 1"
      - from: FAILED
        to: CONFIRMED
        trigger: "POST /utility-disconnections/{disconnection_id}/resolve with outcome == CONFIRMED"
        actor: SubrecipientCoordinator
        preconditions:
          - "UtilityDisconnection.status == FAILED"
          - "request confirmation_reference is supplied and non-empty"
          - "the parent DemolitionWorkOrder.status IN {UTILITY_HOLD, READY}"
        side_effects:
          - "UtilityDisconnection.status = CONFIRMED; confirmation_reference set; resolved_at = clock_now"
          - "the parent DemolitionWorkOrder recomputes confirmed_utility_types and, when complete, moves UTILITY_HOLD -> READY"
          - "increments UtilityDisconnection.version by 1; increments DemolitionWorkOrder.version by 1"
      - from: FAILED
        to: FAILED
        trigger: "POST /utility-disconnections/{disconnection_id}/resolve with outcome == FAILED"
        actor: SubrecipientCoordinator
        preconditions:
          - "UtilityDisconnection.status == FAILED"
          - "the parent DemolitionWorkOrder.status IN {UTILITY_HOLD, READY}"
        side_effects:
          - "UtilityDisconnection.failed_attempt_count += 1; resolved_at = clock_now"
          - "increments UtilityDisconnection.version by 1"
        note: "Self-loop cycle: repeated provider failures accumulate on failed_attempt_count."
      - from: CONFIRMED
        to: FAILED
        trigger: "POST /utility-disconnections/{disconnection_id}/resolve with outcome == FAILED"
        actor: SubrecipientCoordinator
        preconditions:
          - "UtilityDisconnection.status == CONFIRMED"
          - "the parent DemolitionWorkOrder.status IN {UTILITY_HOLD, READY}"
        side_effects:
          - "UtilityDisconnection.status = FAILED; failed_attempt_count += 1; resolved_at = clock_now"
          - "the parent DemolitionWorkOrder recomputes confirmed_utility_types and moves READY -> UTILITY_HOLD when it was READY"
          - "increments UtilityDisconnection.version by 1; increments DemolitionWorkOrder.version by 1"
        note: "Bubble-up revocation - the compound parent loses readiness."

  - entity: DeedRestriction
    initial_state: RECORDED
    terminal_states: [TERMINATED]
    transitions:
      - from: RECORDED
        to: IN_COMPLIANCE
        trigger: "system event: a MonitoringInspection with finding == COMPLIANT is created by POST /deed-restrictions/{restriction_id}/monitoring-inspections"
        actor: system
        preconditions:
          - "DeedRestriction.status == RECORDED"
        side_effects:
          - "DeedRestriction.status = IN_COMPLIANCE"
          - "DeedRestriction.next_monitoring_due_date = inspection_date + MONITORING_INTERVAL_MONTHS calendar months (calculations.monitoring_schedule)"
          - "increments DeedRestriction.version by 1"
      - from: RECORDED
        to: VIOLATION_OPEN
        trigger: "system event: a MonitoringInspection with finding == PROHIBITED_USE_OBSERVED is created"
        actor: system
        preconditions:
          - "DeedRestriction.status == RECORDED"
          - "the inspection's prohibited_use_code is a member of DeedRestriction.prohibited_uses"
        side_effects:
          - "DeedRestriction.status = VIOLATION_OPEN; open_violation_code = the inspection's prohibited_use_code; violation_reported_by_user_id = the inspection's inspector_user_id"
          - "DeedRestriction.corrective_deadline_date = inspection_date + CURE_WINDOW_DAYS days (calculations.monitoring_schedule); next_monitoring_due_date unchanged"
          - "increments DeedRestriction.version by 1"
      - from: IN_COMPLIANCE
        to: VIOLATION_OPEN
        trigger: "system event: a MonitoringInspection with finding == PROHIBITED_USE_OBSERVED is created"
        actor: system
        preconditions:
          - "DeedRestriction.status == IN_COMPLIANCE"
          - "the inspection's prohibited_use_code is a member of DeedRestriction.prohibited_uses"
        side_effects:
          - "DeedRestriction.status = VIOLATION_OPEN; open_violation_code and violation_reported_by_user_id set from the inspection"
          - "DeedRestriction.corrective_deadline_date = inspection_date + CURE_WINDOW_DAYS days"
          - "increments DeedRestriction.version by 1"
      - from: VIOLATION_OPEN
        to: CURED
        trigger: "POST /deed-restrictions/{restriction_id}/cure"
        actor: ComplianceMonitor
        preconditions:
          - "DeedRestriction.status == VIOLATION_OPEN"
          - "acting X-User-ID != DeedRestriction.violation_reported_by_user_id (SoD-3)"
          - "request cure_date <= date(clock_now)"
        side_effects:
          - "DeedRestriction.status = CURED; cured_on = request cure_date; corrective_deadline_date = null; open_violation_code = null"
          - "DeedRestriction.next_monitoring_due_date = cure_date + MONITORING_INTERVAL_MONTHS calendar months"
          - "increments DeedRestriction.version by 1"
      - from: CURED
        to: IN_COMPLIANCE
        trigger: "system event: a MonitoringInspection with finding == COMPLIANT is created"
        actor: system
        preconditions:
          - "DeedRestriction.status == CURED"
        side_effects:
          - "DeedRestriction.status = IN_COMPLIANCE"
          - "DeedRestriction.next_monitoring_due_date = inspection_date + MONITORING_INTERVAL_MONTHS calendar months"
          - "increments DeedRestriction.version by 1"
        note: "Cycle edge IN_COMPLIANCE -> VIOLATION_OPEN -> CURED -> IN_COMPLIANCE."
      - from: CURED
        to: VIOLATION_OPEN
        trigger: "system event: a MonitoringInspection with finding == PROHIBITED_USE_OBSERVED is created"
        actor: system
        preconditions:
          - "DeedRestriction.status == CURED"
          - "the inspection's prohibited_use_code is a member of DeedRestriction.prohibited_uses"
        side_effects:
          - "DeedRestriction.status = VIOLATION_OPEN; open_violation_code and violation_reported_by_user_id set from the inspection; cured_on retained"
          - "DeedRestriction.corrective_deadline_date = inspection_date + CURE_WINDOW_DAYS days"
          - "increments DeedRestriction.version by 1"
      - from: IN_COMPLIANCE
        to: TERMINATED
        trigger: "POST /deed-restrictions/{restriction_id}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "DeedRestriction.status IN {RECORDED, IN_COMPLIANCE, CURED}"
          - "request termination_authorization_reference starts with OPEN_SPACE_TERMINATION_AUTH_PREFIX"
        side_effects:
          - "DeedRestriction.status = TERMINATED; termination_authorization_reference set from the request"
          - "recompute MitigationProject.protected_open_space_acres for Parcel.project_id - the parcel's acreage leaves the protected total"
          - "increments DeedRestriction.version by 1; increments MitigationProject.version by 1"
        note: "Also reachable from RECORDED and CURED under the same preconditions. Compensating action for the deed-recording cascade with respect to protected_open_space_acres."
      - from: RECORDED
        to: TERMINATED
        trigger: "POST /deed-restrictions/{restriction_id}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "DeedRestriction.status == RECORDED"
          - "request termination_authorization_reference starts with OPEN_SPACE_TERMINATION_AUTH_PREFIX"
        side_effects:
          - "DeedRestriction.status = TERMINATED; termination_authorization_reference set from the request"
          - "recompute MitigationProject.protected_open_space_acres for Parcel.project_id"
          - "increments DeedRestriction.version by 1; increments MitigationProject.version by 1"
      - from: CURED
        to: TERMINATED
        trigger: "POST /deed-restrictions/{restriction_id}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "DeedRestriction.status == CURED"
          - "request termination_authorization_reference starts with OPEN_SPACE_TERMINATION_AUTH_PREFIX"
        side_effects:
          - "DeedRestriction.status = TERMINATED; termination_authorization_reference set from the request"
          - "recompute MitigationProject.protected_open_space_acres for Parcel.project_id"
          - "increments DeedRestriction.version by 1; increments MitigationProject.version by 1"

concurrency_rules:
  - rule_id: offer-create-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /parcels/{parcel_id}/purchase-offers"
    occ_field: "expected_parcel_version"
    description: |
      Creating a PurchaseOffer against a Parcel whose version has advanced since the client
      last observed it is rejected with a stale-version error. The product semantics make the
      new offer legitimately supersede any prior DRAFT, DECLINED or EXPIRED offer on the same
      parcel (see state_machines.PurchaseOffer DRAFT -> SUPERSEDED), so a second create from a
      stale view would otherwise silently displace an offer the client never saw and snapshot a
      base_value_cents / dob_deduction_cents pair that no longer reflects the parcel.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
  - rule_id: program-income-stale-project
    parent_entity: MitigationProject
    write_endpoint: "POST /mitigation-projects/{project_id}/program-income-entries"
    occ_field: "expected_project_version"
    description: |
      Posting a ProgramIncomeLedgerEntry against a MitigationProject whose version has advanced
      since the client last observed it is rejected with a stale-version error. Ledger entries
      are computed against MitigationProject.cost_share_federal_pct and validated against the
      running program_income_balance_cents, both of which move whenever any parcel-level cascade
      touches the project, so a stale view would post a federal share against a superseded
      cost-share basis.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
calculations:
  - name: benefit_cost_ratio
    description: |
      Computes BenefitCostAnalysis.pv_annuity_factor, npv_benefits_cents and bcr, and through the
      VALIDATE transition seeds MitigationProject.validated_bcr. DUAL VARIANT calculation: the
      variant is selected by BenefitCostAnalysis.analysis_method, and the two variants consume the
      SAME stored inputs yet produce materially different npv_benefits_cents and bcr.
    algorithm_type: threshold
    variants:
      - variant_id: discounted_npv
        selector: "BenefitCostAnalysis.analysis_method == FEMA_BCA_TOOLKIT"
        formula: |
          STEP 1 pv_annuity_factor = round_half_up(
              (1 - (1 + discount_rate_pct) ** (-project_useful_life_years)) / discount_rate_pct, 6)
          STEP 2 npv_benefits_cents = round_half_up(annualized_loss_avoided_cents * pv_annuity_factor, 0)
          STEP 3 bcr = round_half_up(npv_benefits_cents / mitigation_cost_cents, 3)
        note: |
          pv_annuity_factor is rounded to 6 decimals BEFORE it multiplies the annualized loss; the
          product is then rounded to whole cents. Rounding only at the end produces a different
          npv_benefits_cents. When discount_rate_pct == 0 this variant is rejected by
          validations (ERR_INVALID_REQUEST) rather than falling back to the other variant.
      - variant_id: undiscounted_life_cycle
        selector: "BenefitCostAnalysis.analysis_method == PRE_CALCULATED_BENEFIT"
        formula: |
          STEP 1 pv_annuity_factor = 0 (stored as exactly 0; the discount rate is ignored entirely)
          STEP 2 npv_benefits_cents = annualized_loss_avoided_cents * project_useful_life_years
                 (exact integer product, no rounding step)
          STEP 3 bcr = round_half_up(npv_benefits_cents / mitigation_cost_cents, 3)
        note: |
          discount_rate_pct is stored but never read. STEP 2 has no rounding at all, so the two
          variants diverge by the whole discounting effect, not by a rounding cent.
    variant_divergence_example: |
      Inputs annualized_loss_avoided_cents=4000000, project_useful_life_years=30,
      discount_rate_pct=0.07, mitigation_cost_cents=45000000.
        discounted_npv        -> pv_annuity_factor 12.409041, npv_benefits_cents 49636164, bcr 1.103
        undiscounted_life_cycle -> pv_annuity_factor 0,       npv_benefits_cents 120000000, bcr 2.667
    inputs:
      - "BenefitCostAnalysis.analysis_method"
      - "BenefitCostAnalysis.annualized_loss_avoided_cents"
      - "BenefitCostAnalysis.project_useful_life_years"
      - "BenefitCostAnalysis.discount_rate_pct"
      - "BenefitCostAnalysis.mitigation_cost_cents"
    input_set_filter: "single BenefitCostAnalysis row; recomputed only at creation (POST /mitigation-projects/{project_id}/benefit-cost-analyses)"
    constants:
      BCR_APPROVAL_THRESHOLD: 1.0
    precision: "pv_annuity_factor 6 decimal places round_half_up; npv_benefits_cents whole cents; bcr 3 decimal places round_half_up"
    used_by:
      - "MitigationProject.validated_bcr"
      - "validations priority 47 (ERR_BCR_BELOW_THRESHOLD) - approve requires validated_bcr >= BCR_APPROVAL_THRESHOLD, so bcr == 1.000 exactly must PASS"

  - name: replacement_housing_payment
    description: |
      Computes RelocationCase.replacement_housing_payment_cents at eligibility determination.
      DUAL VARIANT calculation selected by RelocationCase.rhp_method. Both variants read the same
      acquisition_price_cents but a different replacement-cost leg, and both are clamped by the
      same statutory cap, so the cap can mask the divergence when both legs are far above it.
    algorithm_type: threshold
    variants:
      - variant_id: comparable_dwelling
        selector: "RelocationCase.rhp_method == COMPARABLE_DWELLING"
        formula: |
          STEP 1 gross_gap_cents = comparable_dwelling_price_cents - acquisition_price_cents
          STEP 2 eligible_gap_cents = max(0, gross_gap_cents)
          STEP 3 replacement_housing_payment_cents =
                   min(eligible_gap_cents, RHP_OWNER_CAP_CENTS) when displacee_type == OWNER_OCCUPANT
                   0 for every other displacee_type
      - variant_id: actual_replacement
        selector: "RelocationCase.rhp_method == ACTUAL_REPLACEMENT"
        formula: |
          STEP 1 gross_gap_cents = actual_purchase_price_cents - acquisition_price_cents
          STEP 2 eligible_gap_cents = max(0, gross_gap_cents)
          STEP 3 replacement_housing_payment_cents =
                   min(eligible_gap_cents, RHP_OWNER_CAP_CENTS) when displacee_type == OWNER_OCCUPANT
                   0 for every other displacee_type
        note: "actual_purchase_price_cents is required by validations when this variant is selected; comparable_dwelling_price_cents is stored but never read."
    variant_divergence_example: |
      Inputs acquisition_price_cents=19794998, comparable_dwelling_price_cents=22000000,
      actual_purchase_price_cents=20500000, displacee_type=OWNER_OCCUPANT.
        comparable_dwelling -> 2205002
        actual_replacement  ->  705002
      Delta 1500000 on identical stored data.
    inputs:
      - "RelocationCase.rhp_method"
      - "RelocationCase.displacee_type"
      - "RelocationCase.acquisition_price_cents"
      - "RelocationCase.comparable_dwelling_price_cents"
      - "RelocationCase.actual_purchase_price_cents"
    input_set_filter: "single RelocationCase row; acquisition_price_cents is itself snapshotted from the ACCEPTED PurchaseOffer on RelocationCase.parcel_id"
    constants:
      RHP_OWNER_CAP_CENTS: 3150000
    precision: "whole cents; no rounding required (all legs are integer cents)"
    used_by:
      - "RelocationCase.total_relocation_benefit_cents"
      - "calculations.federal_obligation"

  - name: rental_assistance_payment
    description: |
      Computes RelocationCase.rental_assistance_months, rental_assistance_end_date and
      rental_assistance_cents, then RelocationCase.total_relocation_benefit_cents. NESTED MIN/MAX
      over 5 independent monetary inputs with a displacee_type branch in front of them; the
      ability-to-pay leg and the contract-rent leg compete inside a min() whose loser is silently
      discarded, and the differential is floored at 0 before the month multiplier is applied.
    algorithm_type: threshold
    formula: |
      STEP 1 rental_assistance_months =
               MAX_RENTAL_ASSISTANCE_MONTHS when displacee_type == TENANT_90_DAY
               0                            when displacee_type IN {OWNER_OCCUPANT, TENANT_UNDER_90_DAY, BUSINESS}
      STEP 2 rental_assistance_end_date = rental_assistance_start_date + rental_assistance_months
               calendar months (EXCLUSIVE upper bound; when the anchor day-of-month does not exist
               in the target month, clamp to the last day of the target month)
      STEP 3 current_housing_cost_cents = current_rent_cents + current_utility_cents
      STEP 4 ability_to_pay_cents = round_half_up(monthly_gross_income_cents * INCOME_RENT_RATIO, 0)
      STEP 5 base_monthly_cents = min(current_housing_cost_cents, ability_to_pay_cents)
      STEP 6 comparable_housing_cost_cents = comparable_rent_cents + comparable_utility_cents
      STEP 7 monthly_differential_cents = max(0, comparable_housing_cost_cents - base_monthly_cents)
      STEP 8 uncapped_cents = monthly_differential_cents * rental_assistance_months
      STEP 9 rental_assistance_cents = min(uncapped_cents, RENTAL_ASSISTANCE_CAP_CENTS)
      STEP 10 total_relocation_benefit_cents = replacement_housing_payment_cents
                + rental_assistance_cents + moving_expense_cents
    worked_example: |
      displacee_type=TENANT_90_DAY, current_rent_cents=90000, current_utility_cents=15000,
      monthly_gross_income_cents=320000, comparable_rent_cents=130000,
      comparable_utility_cents=20000, moving_expense_cents=175000.
        STEP 1 months 42
        STEP 3 current_housing_cost 105000
        STEP 4 ability_to_pay 96000
        STEP 5 base_monthly 96000   (the ability-to-pay leg wins; 105000 is discarded)
        STEP 6 comparable_housing_cost 150000
        STEP 7 monthly_differential 54000
        STEP 8 uncapped 2268000
        STEP 9 rental_assistance_cents 2268000 (below the 3150000 cap)
        STEP 10 replacement_housing_payment_cents 0 (tenant) + 2268000 + 175000 = 2443000
    inputs:
      - "RelocationCase.displacee_type"
      - "RelocationCase.current_rent_cents"
      - "RelocationCase.current_utility_cents"
      - "RelocationCase.monthly_gross_income_cents"
      - "RelocationCase.comparable_rent_cents"
      - "RelocationCase.comparable_utility_cents"
      - "RelocationCase.rental_assistance_start_date"
      - "RelocationCase.moving_expense_cents"
      - "RelocationCase.replacement_housing_payment_cents"
    input_set_filter: "single RelocationCase row, evaluated once at POST /relocation-cases/{case_id}/determine-eligibility"
    constants:
      MAX_RENTAL_ASSISTANCE_MONTHS: 42
      INCOME_RENT_RATIO: 0.30
      RENTAL_ASSISTANCE_CAP_CENTS: 3150000
    precision: "ability_to_pay_cents rounded to whole cents round_half_up BEFORE the min() in STEP 5; all other steps are exact integer arithmetic"
    used_by:
      - "RelocationCase.total_relocation_benefit_cents"
      - "calculations.federal_obligation"
      - "validations priority 43 (ERR_RELOCATION_PERIOD_OVERLAP) - the half-open interval [rental_assistance_start_date, rental_assistance_end_date)"

  - name: dob_deduction_total
    description: |
      Computes DuplicationOfBenefitsRecord.deductible_cents per record and then
      Parcel.dob_deduction_total_cents. ROUND-PER-RECORD-THEN-SUM: each record's source factor is
      applied and rounded to whole cents individually, and only the rounded per-record values are
      summed. Rounding the aggregate instead of the parts yields a different total.
    algorithm_type: chronological
    formula: |
      INPUT SET: every DuplicationOfBenefitsRecord with parcel_id == the parcel and status == ACTIVE.
      ORDER: received_on ASC, then created_at ASC (deterministic tie-break; record id is never used).
      FOR EACH record in that order:
        STEP 1 net_award_cents = max(0, amount_cents - repair_documented_cents)
        STEP 2 factor = DOB_SOURCE_FACTORS[benefit_source]
        STEP 3 deductible_cents = round_half_up(net_award_cents * factor, 0)   <-- rounded HERE, per record
      THEN:
        STEP 4 Parcel.dob_deduction_total_cents = sum of the STEP 3 deductible_cents values,
               accumulated in the ORDER above
    worked_example: |
      Three ACTIVE records on one parcel:
        received_on 2025-03-01 NFIP_CLAIM     amount 1200000 repair_documented 300000
              -> net 900000  * 1.00 = 900000.0  -> deductible 900000
        received_on 2025-04-01 SBA_LOAN       amount  500001 repair_documented      0
              -> net 500001  * 0.50 = 250000.5  -> deductible 250001
        received_on 2025-05-01 SBA_LOAN       amount  700001 repair_documented      0
              -> net 700001  * 0.50 = 350000.5  -> deductible 350001
      Parcel.dob_deduction_total_cents = 900000 + 250001 + 350001 = 1500002
      (Summing the unrounded products first gives 1500001.0 -> 1500001, which is WRONG.)
    inputs:
      - "DuplicationOfBenefitsRecord.amount_cents"
      - "DuplicationOfBenefitsRecord.repair_documented_cents"
      - "DuplicationOfBenefitsRecord.benefit_source"
      - "DuplicationOfBenefitsRecord.received_on"
      - "DuplicationOfBenefitsRecord.status"
    input_set_filter: "status == ACTIVE only; REVERSED records are excluded from the sweep and their deductible_cents is frozen at its last ACTIVE value for audit"
    constants:
      DOB_SOURCE_FACTORS:
        NFIP_CLAIM: 1.00
        ICC: 1.00
        PRIVATE_INSURANCE: 1.00
        SBA_LOAN: 0.50
        CDBG_DR: 0.85
    precision: "whole cents, round_half_up, applied per record at STEP 3 and never at the aggregate"
    used_by:
      - "PurchaseOffer.dob_deduction_cents (snapshotted at offer creation)"
      - "validations priority 54 (ERR_DOB_EXCEEDS_BASE_VALUE)"

  - name: net_offer_amount
    description: |
      Computes PurchaseOffer.base_value_cents, dob_deduction_cents, pre_incentive_net_cents,
      incentive_cents and net_offer_cents at offer creation. The incentive tier is keyed on the
      POST-DEDUCTION pre_incentive_net_cents, not on base_value_cents, so the evaluation order is
      load-bearing and the result is NOT monotone in base_value_cents. Executing the steps in any
      other order (for example tiering on base_value_cents, or applying the cap before the tier)
      produces a different net_offer_cents.
    algorithm_type: tiered_pricing
    formula: |
      STEP 1 base_value_cents = indicated_value_cents of the Appraisal named by source_appraisal_id
             (that appraisal must be appraisal_type == REVIEW and status == ACCEPTED)
      STEP 2 dob_deduction_cents = Parcel.dob_deduction_total_cents at this instant
             (see calculations.dob_deduction_total)
      STEP 3 pre_incentive_net_cents = max(0, base_value_cents - dob_deduction_cents)
      STEP 4 incentive_rate =
               0.0 when Parcel.occupancy_type != OWNER_OCCUPIED
               else the single tier whose half-open band contains pre_incentive_net_cents:
                 pre_incentive_net_cents  < 10000000                        -> 0.10
                 10000000 <= pre_incentive_net_cents < 25000000             -> 0.07
                 25000000 <= pre_incentive_net_cents                        -> 0.05
      STEP 5 incentive_cents = min(round_half_up(pre_incentive_net_cents * incentive_rate, 0),
                                  INCENTIVE_CAP_CENTS)
      STEP 6 net_offer_cents = pre_incentive_net_cents + incentive_cents
      The tier is a FLAT rate on the whole pre_incentive_net_cents (average rate), never a marginal
      rate applied band by band.
    worked_example: |
      OWNER_OCCUPIED parcel, ACCEPTED REVIEW appraisal indicated_value_cents=20000000,
      Parcel.dob_deduction_total_cents=1500002.
        STEP 3 pre_incentive_net 18499998
        STEP 4 rate 0.07 (18499998 falls in the middle band)
        STEP 5 18499998 * 0.07 = 1294999.86 -> 1295000 (below the 2250000 cap)
        STEP 6 net_offer_cents 19794998
      Order-sensitivity proof (two offers, dob_deduction 100000 on both):
        base 10000000 -> pre 9900000  -> rate 0.10 -> incentive 990000 -> net 10890000
        base 10100000 -> pre 10000000 -> rate 0.07 -> incentive 700000 -> net 10700000
      A LARGER appraised value yields a SMALLER net offer, because the tier is keyed on the
      post-deduction figure. Tiering on base_value_cents instead would give 10890000 and 10700000
      swapped in the wrong direction.
    inputs:
      - "Appraisal.indicated_value_cents (via PurchaseOffer.source_appraisal_id)"
      - "Parcel.dob_deduction_total_cents"
      - "Parcel.occupancy_type"
    input_set_filter: "evaluated once at POST /parcels/{parcel_id}/purchase-offers; all five derived fields are frozen snapshots thereafter, so later DOB records do not retroactively move a created offer"
    constants:
      INCENTIVE_TIERS:
        - {upper_exclusive_cents: 10000000, rate: 0.10}
        - {upper_exclusive_cents: 25000000, rate: 0.07}
        - {upper_exclusive_cents: null, rate: 0.05}
      INCENTIVE_CAP_CENTS: 2250000
    precision: "incentive_cents rounded to whole cents round_half_up BEFORE the cap min() in STEP 5"
    used_by:
      - "ClosingRecord.purchase_price_cents"
      - "RelocationCase.acquisition_price_cents"
      - "calculations.federal_obligation"

  - name: neighborhood_viability_ratio
    description: |
      Computes MitigationProject.contiguous_open_space_parcel_count, largest_component_parcel_ids,
      neighborhood_viability_ratio and viability_status. Largest connected component over the
      ParcelAdjacency graph restricted to ACQUIRED parcels - holdout parcels sever the edges that
      pass through them, which is exactly the neighborhood-viability decision the program has to
      make when an owner declines.
    algorithm_type: topological
    formula: |
      STEP 1 NODE SET = every Parcel with project_id == this project and
             acquisition_status IN {CLOSED, DEMOLISHED, OPEN_SPACE_RECORDED}
      STEP 2 EDGE SET = every ParcelAdjacency with project_id == this project whose parcel_a_id AND
             parcel_b_id are BOTH in the NODE SET. An adjacency with exactly one endpoint acquired
             contributes no edge (the holdout severs it). Edges are undirected.
      STEP 3 Partition the NODE SET into connected components under the EDGE SET. An acquired parcel
             with no surviving edge is its own component of size 1.
      STEP 4 contiguous_open_space_parcel_count = the maximum component size, or 0 when the NODE SET
             is empty.
      STEP 5 largest_component_parcel_ids = the member ids of the winning component ordered by
             Parcel.created_at ASC. TIE-BREAK when two or more components share the maximum size:
             choose the component whose EARLIEST member Parcel.created_at is earliest. Parcel id is
             never used as a tie-break. Empty array when the NODE SET is empty.
      STEP 6 denominator = MitigationProject.participating_parcel_count (count of Parcel with
             project_id == this project and participation_status IN
             {NOT_CONTACTED, INTERESTED, VOLUNTARY_CONFIRMED})
      STEP 7 neighborhood_viability_ratio =
               0 when denominator == 0
               else round_half_up(contiguous_open_space_parcel_count / denominator, 4)
      STEP 8 viability_status =
               VIABLE     when neighborhood_viability_ratio >= VIABILITY_VIABLE_MIN
               AT_RISK    when VIABILITY_AT_RISK_MIN <= neighborhood_viability_ratio < VIABILITY_VIABLE_MIN
               NONVIABLE  otherwise
      STEP 9 holdout_parcel_count = count of Parcel with project_id == this project and
             participation_status == DECLINED
    worked_example: |
      Four parcels P1..P4 (created in that order), all participation_status VOLUNTARY_CONFIRMED, so
      participating_parcel_count = 4. Adjacencies P1-P2 and P3-P4. P1, P2 and P3 have reached
      acquisition_status CLOSED; P4 is still VALUE_ESTABLISHED.
        STEP 1 NODE SET {P1, P2, P3}
        STEP 2 EDGE SET {P1-P2}  (P3-P4 dropped because P4 is not acquired)
        STEP 3 components {P1,P2} and {P3}
        STEP 4 contiguous_open_space_parcel_count 2
        STEP 5 largest_component_parcel_ids [P1.id, P2.id]
        STEP 7 ratio round_half_up(2/4, 4) = 0.5
        STEP 8 viability_status AT_RISK (0.5 >= 0.50 and < 0.75)
      Empty-graph case: no parcel acquired -> count 0, ids [], ratio 0, viability_status NONVIABLE.
    inputs:
      - "Parcel.acquisition_status"
      - "Parcel.participation_status"
      - "Parcel.created_at"
      - "ParcelAdjacency.parcel_a_id"
      - "ParcelAdjacency.parcel_b_id"
      - "ParcelAdjacency.project_id"
    input_set_filter: "recomputed on every Parcel.participation_status change, on every Parcel.acquisition_status change reaching or leaving {CLOSED, DEMOLISHED, OPEN_SPACE_RECORDED}, on ParcelAdjacency creation, and at project APPROVE"
    constants:
      VIABILITY_VIABLE_MIN: 0.75
      VIABILITY_AT_RISK_MIN: 0.50
    precision: "neighborhood_viability_ratio 4 decimal places round_half_up"
    used_by:
      - "validations priority 49 (ERR_NEIGHBORHOOD_NONVIABLE) - closeout INITIATE requires viability_status != NONVIABLE"

  - name: program_income_federal_share
    description: |
      Computes ProgramIncomeLedgerEntry.federal_share_cents per entry and
      MitigationProject.program_income_balance_cents. SIGNED ledger with ROUND-PER-ENTRY-THEN-SUM:
      EXPENDITURE entries are debits, every other entry_type is a credit, and the federal share is
      rounded to whole cents on each entry before the running balance accumulates it.
    algorithm_type: aggregation
    formula: |
      PER ENTRY (at POST /mitigation-projects/{project_id}/program-income-entries):
        STEP 1 sign = -1 when entry_type == EXPENDITURE, else +1
        STEP 2 magnitude_cents = round_half_up(amount_cents * MitigationProject.cost_share_federal_pct, 0)
        STEP 3 federal_share_cents = sign * magnitude_cents
               (round_half_up is applied to the POSITIVE magnitude, so -0.5 rounds away from zero to -1,
               never toward zero)
      RUNNING BALANCE:
        INPUT SET: every ProgramIncomeLedgerEntry with project_id == this project and status == ACTIVE
        ORDER: posted_on ASC, then created_at ASC (entry id is never used as a sort key)
        STEP 4 MitigationProject.program_income_balance_cents = sum of the STEP 3 federal_share_cents
               values, accumulated in the ORDER above
      REVERSAL: a reversing entry carries reverses_entry_id, is itself created with the OPPOSITE
      sign and the SAME magnitude_cents as the target, and sets the target entry's status to
      REVERSED. Both the target and the reversal then leave the ACTIVE input set, so the balance
      returns to EXACTLY its pre-target value with no rounding drift.
    worked_example: |
      cost_share_federal_pct = 0.75.
        entry A posted_on 2026-08-10 LEASE_REVENUE   amount 100002 -> 100002*0.75 =  75001.5 ->  75002
        entry B posted_on 2026-08-11 SALVAGE_PROCEEDS amount 300002 -> 300002*0.75 = 225001.5 -> 225002
      program_income_balance_cents = 75002 + 225002 = 300004
      (Summing gross first gives 400004*0.75 = 300003.0 -> 300003, which is WRONG.)
      Debit example: entry C EXPENDITURE amount 100002 -> federal_share_cents -75002, balance 225002.
    inputs:
      - "ProgramIncomeLedgerEntry.entry_type"
      - "ProgramIncomeLedgerEntry.amount_cents"
      - "ProgramIncomeLedgerEntry.posted_on"
      - "ProgramIncomeLedgerEntry.status"
      - "MitigationProject.cost_share_federal_pct"
    input_set_filter: "status == ACTIVE only; a REVERSED entry and its reversing entry are BOTH excluded"
    constants: {}
    precision: "whole cents, round_half_up on the positive magnitude, applied per entry at STEP 2 and never at the aggregate"
    used_by:
      - "validations priority 56 (ERR_PROGRAM_INCOME_OVERDRAWN) - the balance may never go negative"
      - "state_machines.MitigationProject CLOSEOUT_PENDING -> CLOSED_OUT requires program_income_balance_cents == 0"

  - name: federal_obligation
    description: |
      Computes MitigationProject.federal_obligated_cents. CONSERVED QUANTITY A. Every obligating
      event adds a per-item federal share rounded individually; every compensating event removes
      exactly the same rounded amount, so the running total must return bit-for-bit to its previous
      value after a compensation and must never exceed total_federal_share_cap_cents.
    algorithm_type: aggregation
    formula: |
      INPUT SET, in this group order, each group ordered by created_at ASC:
        GROUP 1 every PurchaseOffer whose parcel_id belongs to this project with
                status IN {PRESENTED, ACCEPTED}
                item_cents = round_half_up(net_offer_cents * cost_share_federal_pct, 0)
        GROUP 2 every ClosingRecord whose parcel_id belongs to this project with
                status IN {FUNDED, RECORDED}
                item_cents = round_half_up(settlement_cost_cents * cost_share_federal_pct, 0)
        GROUP 3 every RelocationCase whose parcel_id belongs to this project with
                status == CLAIM_PAID
                item_cents = round_half_up(total_relocation_benefit_cents * cost_share_federal_pct, 0)
      MitigationProject.federal_obligated_cents = sum of item_cents over GROUP 1, then GROUP 2,
      then GROUP 3, each item rounded individually before accumulation.
      An offer that leaves {PRESENTED, ACCEPTED} for DECLINED, EXPIRED, WITHDRAWN or SUPERSEDED
      drops out of GROUP 1 entirely - the deobligation is the exact rounded item_cents that was
      added, never a re-derived approximation.
    worked_example: |
      cost_share_federal_pct = 0.75.
        PRESENT an offer with net_offer_cents 19794998
          -> item_cents round_half_up(14846248.5) = 14846249, federal_obligated_cents 14846249
        PAY a relocation claim with total_relocation_benefit_cents 2443000
          -> item_cents 1832250, federal_obligated_cents 16678499
        WITHDRAW the offer
          -> GROUP 1 empty, federal_obligated_cents 1832250 (exactly the pre-PRESENT value plus the
             relocation item; the 14846249 is removed with no residue)
    inputs:
      - "PurchaseOffer.net_offer_cents and PurchaseOffer.status"
      - "ClosingRecord.settlement_cost_cents and ClosingRecord.status"
      - "RelocationCase.total_relocation_benefit_cents and RelocationCase.status"
      - "MitigationProject.cost_share_federal_pct"
    input_set_filter: "only the statuses listed per group; DRAFT offers, SCHEDULED closings and non-CLAIM_PAID relocation cases contribute nothing"
    constants: {}
    precision: "whole cents, round_half_up per item before accumulation"
    used_by:
      - "validations priority 55 (ERR_FEDERAL_SHARE_CAP_EXCEEDED) - federal_obligated_cents + the prospective item_cents must be <= total_federal_share_cap_cents"

  - name: protected_open_space_acres
    description: |
      Computes MitigationProject.protected_open_space_acres. CONSERVED QUANTITY B. Acreage enters
      the total when a parcel reaches OPEN_SPACE_RECORDED and leaves it when the parcel's deed
      restriction is TERMINATED, so recording and termination are exact inverses.
    algorithm_type: aggregation
    formula: |
      INPUT SET: every Parcel with project_id == this project and
                 acquisition_status == OPEN_SPACE_RECORDED whose DeedRestriction
                 (the one with that parcel_id) has status IN {RECORDED, IN_COMPLIANCE,
                 VIOLATION_OPEN, CURED} - that is, any status EXCEPT TERMINATED.
      ORDER: Parcel.created_at ASC.
      STEP 1 protected_open_space_acres = round_half_up(sum of Parcel.acreage over the input set, 2)
      A parcel whose restriction is VIOLATION_OPEN still counts - the encumbrance exists, it is
      merely being violated. Only TERMINATION removes acreage.
    worked_example: |
      Parcels with acreage 0.34, 0.41 and 1.25 all at OPEN_SPACE_RECORDED with non-TERMINATED
      restrictions -> protected_open_space_acres 2.00. Terminating the 0.41 parcel's restriction
      -> 1.59.
    inputs:
      - "Parcel.acreage"
      - "Parcel.acquisition_status"
      - "DeedRestriction.status"
    input_set_filter: "recomputed on Parcel.acquisition_status DEMOLISHED -> OPEN_SPACE_RECORDED, on DeedRestriction termination, and at closeout INITIATE"
    constants: {}
    precision: "2 decimal places round_half_up, applied to the aggregate (acreage inputs are already 2 decimal places, so no per-item rounding is needed)"
    used_by:
      - "MitigationProject.protected_open_space_acres"

  - name: debris_diversion_pct
    description: |
      Computes DemolitionWorkOrder.diversion_pct at completion and gates the
      IN_PROGRESS -> COMPLETED transition on MIN_DIVERSION_PCT. Threshold rule with an explicit
      ZERO-QUANTITY WAIVER: a work order that generated no debris at all cannot be held to a
      diversion percentage.
    algorithm_type: threshold
    formula: |
      STEP 1 diversion_pct =
               0.00 when total_debris_tons == 0
               else round_half_up(recycled_tons / total_debris_tons * 100, 2)
      STEP 2 gate:
               total_debris_tons == 0                  -> PASS (zero-quantity waiver)
               diversion_pct >= MIN_DIVERSION_PCT      -> PASS
               otherwise                               -> FAIL (ERR_DEBRIS_DIVERSION_BELOW_MINIMUM)
      The comparison in STEP 2 uses the ROUNDED diversion_pct from STEP 1, so a raw ratio of
      24.9958 percent that rounds to 25.00 PASSES.
    worked_example: |
      total_debris_tons 48.00, recycled_tons 12.00 -> diversion_pct 25.00 -> PASS (exactly at MIN_DIVERSION_PCT)
      total_debris_tons 48.00, recycled_tons 11.99 -> diversion_pct 24.98 -> FAIL
      total_debris_tons  0.00, recycled_tons  0.00 -> diversion_pct  0.00 -> PASS via the waiver
    inputs:
      - "DemolitionWorkOrder.total_debris_tons"
      - "DemolitionWorkOrder.recycled_tons"
    input_set_filter: "single DemolitionWorkOrder row, evaluated at POST /demolition-work-orders/{work_order_id}/complete from the request body values"
    constants:
      MIN_DIVERSION_PCT: 25.0
    precision: "2 decimal places round_half_up; the threshold comparison is made against the rounded value"
    used_by:
      - "validations priority 53 (ERR_DEBRIS_DIVERSION_BELOW_MINIMUM)"

  - name: monitoring_schedule
    description: |
      Computes DeedRestriction.next_monitoring_due_date and corrective_deadline_date. Calendar-month
      arithmetic for the perpetual monitoring interval and calendar-DAY arithmetic for the cure
      window - the two use deliberately different units.
    algorithm_type: forward_looking
    formula: |
      STEP 1 anchor_date =
               DeedRestriction.recorded_on                          at restriction creation
               MonitoringInspection.inspection_date                 when an inspection sets the
                                                                    restriction to IN_COMPLIANCE
               DeedRestriction.cured_on                             when a cure is recorded
      STEP 2 next_monitoring_due_date = anchor_date + MONITORING_INTERVAL_MONTHS calendar months.
             When the anchor day-of-month does not exist in the target month, clamp to the last day
             of the target month.
      STEP 3 corrective_deadline_date, set only when the restriction enters VIOLATION_OPEN:
               MonitoringInspection.inspection_date + CURE_WINDOW_DAYS calendar days.
             Cleared to null on cure. next_monitoring_due_date is NOT moved by a violation.
      STEP 4 the restriction is OVERDUE when status IN {RECORDED, IN_COMPLIANCE, CURED} and
             next_monitoring_due_date < date(clock_now).
    worked_example: |
      recorded_on 2026-09-15 -> next_monitoring_due_date 2029-09-15 (36 months)
      A PROHIBITED_USE_OBSERVED inspection on 2029-09-20 -> corrective_deadline_date 2029-12-19
      (90 calendar days), next_monitoring_due_date still 2029-09-15
      Cure recorded with cure_date 2029-10-01 -> next_monitoring_due_date 2032-10-01,
      corrective_deadline_date null
      Month-end clamp: anchor 2026-01-31 + 36 months -> 2029-01-31; anchor 2026-11-30 + 36 months
      -> 2029-11-30
    inputs:
      - "DeedRestriction.recorded_on"
      - "DeedRestriction.cured_on"
      - "MonitoringInspection.inspection_date"
      - "MonitoringInspection.finding"
    input_set_filter: "single DeedRestriction row; re-anchored on every MonitoringInspection creation and on every cure"
    constants:
      MONITORING_INTERVAL_MONTHS: 36
      CURE_WINDOW_DAYS: 90
    precision: "whole calendar dates (YYYY-MM-DD); months clamp to month end, days are exact"
    used_by:
      - "validations priority 45 (ERR_MONITORING_OVERDUE)"
      - "state_machines.MitigationProject APPROVED -> CLOSEOUT_PENDING"

  - name: appraisal_validity_window
    description: |
      Computes Appraisal.validity_end_date and defines the HALF-OPEN validity interval used by the
      INITIAL-appraisal overlap check. Adjacent intervals (one ending exactly where the next begins)
      do NOT overlap.
    algorithm_type: interval_merge
    formula: |
      STEP 1 validity_end_date = effective_date + APPRAISAL_VALIDITY_MONTHS calendar months, clamped
             to month end when the anchor day-of-month does not exist in the target month.
      STEP 2 the validity interval is HALF-OPEN: [effective_date, validity_end_date).
      STEP 3 two INITIAL appraisals A and B on the same parcel_id, both with status IN
             {SUBMITTED, ACCEPTED}, OVERLAP iff
               A.effective_date < B.validity_end_date AND B.effective_date < A.validity_end_date
             Touching intervals (A.validity_end_date == B.effective_date) do NOT overlap.
      REVIEW appraisals are exempt from the overlap check entirely - a review appraisal is expected
      to sit inside the interval of the INITIAL appraisal it reviews.
    worked_example: |
      APPRAISAL_VALIDITY_MONTHS = 12.
        A: effective_date 2026-07-01 -> validity_end_date 2027-07-01, interval [2026-07-01, 2027-07-01)
        B: effective_date 2027-07-01 -> validity_end_date 2028-07-01 -> ADJACENT, no overlap, PASSES
        C: effective_date 2027-06-30 -> validity_end_date 2028-06-30 -> OVERLAPS A by one day, FAILS
    inputs:
      - "Appraisal.effective_date"
      - "Appraisal.appraisal_type"
      - "Appraisal.status"
      - "Appraisal.parcel_id"
    input_set_filter: "peer set is Appraisal rows with the same parcel_id, appraisal_type == INITIAL and status IN {SUBMITTED, ACCEPTED}; DRAFT, RETURNED_FOR_REVISION and REJECTED appraisals are excluded"
    constants:
      APPRAISAL_VALIDITY_MONTHS: 12
      MAX_APPRAISAL_REVISIONS: 2
    precision: "whole calendar dates; the interval upper bound is EXCLUSIVE"
    used_by:
      - "validations priority 40 (ERR_APPRAISAL_WINDOW_OVERLAP)"

  - name: demolition_buffered_window
    description: |
      Computes DemolitionWorkOrder.buffered_start and buffered_end and defines the CLOSED buffered
      occupation interval used for the contractor capacity check. Deliberately CLOSED, so touching
      buffered windows DO conflict - the opposite convention from calculations.appraisal_validity_window.
    algorithm_type: interval_merge
    formula: |
      STEP 1 buffered_start = scheduled_start - DEMOLITION_BUFFER_HOURS
      STEP 2 buffered_end   = scheduled_end   + DEMOLITION_BUFFER_HOURS
      STEP 3 the buffered occupation interval is CLOSED: [buffered_start, buffered_end].
      STEP 4 two DemolitionWorkOrder rows W and X with the same contractor_id and status IN
             {ISSUED, UTILITY_HOLD, READY, IN_PROGRESS, FAILED_INSPECTION} CONFLICT iff
               W.buffered_start <= X.buffered_end AND X.buffered_start <= W.buffered_end
             Touching buffered windows (W.buffered_end == X.buffered_start) DO conflict.
      STEP 5 AGGREGATE CAPACITY: creation of a new work order is rejected when the number of
             existing conflicting rows found in STEP 4 is >= DemolitionContractor.max_concurrent_work_orders.
             With max_concurrent_work_orders == 2, two mutually conflicting rows are permitted and a
             third conflicting row is rejected - each row is individually legal but the collective
             exceeds the contractor's capacity.
      STEP 6 active_work_order_count = number of DemolitionWorkOrder rows with this contractor_id and
             status IN {ISSUED, UTILITY_HOLD, READY, IN_PROGRESS, FAILED_INSPECTION}. COMPLETED rows
             release capacity.
    worked_example: |
      DEMOLITION_BUFFER_HOURS = 24.
        W1 scheduled 2026-10-05T08:00:00Z .. 2026-10-06T17:00:00Z
           -> buffered [2026-10-04T08:00:00Z, 2026-10-07T17:00:00Z]
        W2 scheduled 2026-10-08T09:00:00Z .. 2026-10-08T17:00:00Z
           -> buffered [2026-10-07T09:00:00Z, 2026-10-09T17:00:00Z]  -> CONFLICTS with W1
        W3 scheduled 2026-10-08T18:00:00Z .. 2026-10-09T02:00:00Z
           -> buffered [2026-10-07T18:00:00Z, 2026-10-10T02:00:00Z]  -> does NOT conflict with W1
              (W1.buffered_end 2026-10-07T17:00:00Z < W3.buffered_start 2026-10-07T18:00:00Z)
      The unbuffered scheduled windows of W1 and W2 are 16 hours apart and never intersect; only the
      buffered intervals reveal the conflict.
    inputs:
      - "DemolitionWorkOrder.scheduled_start"
      - "DemolitionWorkOrder.scheduled_end"
      - "DemolitionWorkOrder.contractor_id"
      - "DemolitionWorkOrder.status"
      - "DemolitionContractor.max_concurrent_work_orders"
    input_set_filter: "peer set is DemolitionWorkOrder rows with the same contractor_id and a non-COMPLETED status; work orders on a different contractor never conflict, however close their windows"
    constants:
      DEMOLITION_BUFFER_HOURS: 24
      MAX_DEMOLITION_REWORKS: 2
      REQUIRED_UTILITY_TYPES: [WATER, ELECTRIC, GAS, SEWER]
    precision: "whole seconds on ISO 8601 UTC timestamps; the interval is CLOSED at both ends"
    used_by:
      - "validations priority 41 (ERR_DEMOLITION_WINDOW_CONFLICT)"
      - "DemolitionContractor.active_work_order_count"

global_constants:
  BCR_APPROVAL_THRESHOLD: 1.0
  APPRAISAL_VALIDITY_MONTHS: 12
  MAX_APPRAISAL_REVISIONS: 2
  OFFER_VALIDITY_DAYS: 30
  MONITORING_INTERVAL_MONTHS: 36
  CURE_WINDOW_DAYS: 90
  REQUIRED_UTILITY_TYPES: [WATER, ELECTRIC, GAS, SEWER]
  PROHIBITED_USE_CODES: [NEW_STRUCTURE, FILL_PLACEMENT, RESALE_FOR_DEVELOPMENT, PERMANENT_STORAGE]
  MIN_DIVERSION_PCT: 25.0
  VIABILITY_VIABLE_MIN: 0.75
  VIABILITY_AT_RISK_MIN: 0.50
  DEMOLITION_BUFFER_HOURS: 24
  MAX_DEMOLITION_REWORKS: 2
  RHP_OWNER_CAP_CENTS: 3150000
  RENTAL_ASSISTANCE_CAP_CENTS: 3150000
  MAX_RENTAL_ASSISTANCE_MONTHS: 42
  INCOME_RENT_RATIO: 0.30
  INCENTIVE_CAP_CENTS: 2250000
  MAX_RELOCATION_APPEALS: 2
  OPEN_SPACE_TERMINATION_AUTH_PREFIX: "FEMA-OSR-"
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-08-01T00:00:00Z"
validations:
  # Single global ordering. Every write endpoint runs the applicable rows in ascending priority and
  # returns the FIRST violated row's error_id. Categories in order of appearance:
  #   auth (1) -> authz (2-3) -> body_shape (4) -> existence (5-17) -> referential (18-19)
  #   -> occ (20-21) -> state (22-33) -> business_safety (34-36) -> business_temporal (37-44)
  #   -> business_constraint / business_referential / business_fiscal interleaved (45-69)
  # THREE DELIBERATE PRIORITY-CONFLICT PAIRS (see scaffold_difficulty_design priority_pair_validation_conflict):
  #   PAIR A  26 ERR_INVALID_OFFER_STATE          beats 53 ERR_FEDERAL_SHARE_CAP_EXCEEDED
  #   PAIR B  34 ERR_ASBESTOS_SURVEY_MISSING      beats 46 ERR_UTILITY_DISCONNECT_INCOMPLETE
  #   PAIR C  44 ERR_PERIOD_OF_PERFORMANCE_EXPIRED beats 53 ERR_FEDERAL_SHARE_CAP_EXCEEDED
  # Every precondition in state_machines is reachable through the endpoints in the endpoints
  # section; the only test-driving endpoint is POST /_clock/set_current_utc, which exists because
  # offer expiry, appraisal validity windows, monitoring due dates and the period of performance
  # cannot otherwise be advanced.

  - priority: 1
    category: auth
    condition: "X-User-ID request header is absent or empty on any endpoint other than POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: ["all endpoints except POST /_clock/set_current_utc"]

  - priority: 2
    category: authz
    condition: "the X-Role request header names a role that is not permitted to invoke this endpoint (see roles)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["all endpoints except POST /_clock/set_current_utc"]

  - priority: 3
    category: authz
    condition: |
      the acting X-User-ID collides with a segregation-of-duties bar:
        SoD-1  POST /appraisals/{appraisal_id}/review-decision where X-User-ID == Appraisal.appraiser_user_id,
               or (for appraisal_type == REVIEW) X-User-ID == the reviewed INITIAL Appraisal.appraiser_user_id
        SoD-2  POST /mitigation-projects/{project_id}/approve where X-User-ID == MitigationProject.validated_by_user_id
        SoD-3  POST /deed-restrictions/{restriction_id}/cure where X-User-ID == DeedRestriction.violation_reported_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to:
      - "POST /appraisals/{appraisal_id}/review-decision"
      - "POST /mitigation-projects/{project_id}/approve"
      - "POST /deed-restrictions/{restriction_id}/cure"
    note: "Evaluated before existence checks on referenced BODY entities but after path-entity existence, because the bar is read off the path entity itself."

  - priority: 4
    category: body_shape
    condition: |
      request body fails structural validation: a required field is missing; a field has the wrong
      JSON type; an enum field carries a value outside its declared set; a *_cents field is negative;
      acreage / shared_boundary_feet / substantial_damage_pct / total_debris_tons / recycled_tons is
      negative; recycled_tons > total_debris_tons; cost_share_federal_pct outside (0, 1];
      discount_rate_pct <= 0 while analysis_method == FEMA_BCA_TOOLKIT; project_useful_life_years < 1
      or > 100; max_concurrent_work_orders outside 1..10; scheduled_end <= scheduled_start;
      a date field is not YYYY-MM-DD or a datetime field is not ISO 8601 UTC;
      MonitoringInspection.prohibited_use_code present when finding == COMPLIANT or absent when
      finding == PROHIBITED_USE_OBSERVED; RelocationCase.comparable_dwelling_price_cents absent when
      displacee_type == OWNER_OCCUPANT and rhp_method == COMPARABLE_DWELLING;
      RelocationCase.actual_purchase_price_cents absent when rhp_method == ACTUAL_REPLACEMENT;
      MitigationProject.disaster_declaration_number absent when grant_program == HMGP;
      UtilityDisconnection confirmation_reference absent when outcome == CONFIRMED;
      pagination limit outside 1..100 or offset < 0
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: ["all write endpoints and all list endpoints"]

  - priority: 5
    category: existence
    condition: "the MitigationProject named by a path project_id or a body project_id does not exist"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /mitigation-projects/{project_id}", "POST /mitigation-projects/{project_id}/submit", "POST /mitigation-projects/{project_id}/return", "POST /mitigation-projects/{project_id}/approve", "POST /mitigation-projects/{project_id}/closeout", "POST /mitigation-projects/{project_id}/benefit-cost-analyses", "POST /mitigation-projects/{project_id}/parcels", "POST /mitigation-projects/{project_id}/program-income-entries", "POST /parcel-adjacencies"]

  - priority: 6
    category: existence
    condition: "the BenefitCostAnalysis named by a path bca_id does not exist"
    error_id: ERR_BCA_NOT_FOUND
    http_status: 404
    applies_to: ["GET /benefit-cost-analyses/{bca_id}", "POST /benefit-cost-analyses/{bca_id}/validate"]

  - priority: 7
    category: existence
    condition: "the Parcel named by a path parcel_id, or by a body parcel_a_id / parcel_b_id / applied_to_parcel_id, does not exist"
    error_id: ERR_PARCEL_NOT_FOUND
    http_status: 404
