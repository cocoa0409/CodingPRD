              as: ElitesDirector
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: SUB_ELITE, gender: MALE, max_qualifying_seconds: 9000, bib_range_start: 200, bib_range_end: 210 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Record Gate Reps", license_code: "AGT-RG-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Record Alpha", country_code: USA, gender: MALE, birth_date: "1996-01-01", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athA_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Record Beta", country_code: USA, gender: MALE, birth_date: "1996-01-02", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athB_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Record Gamma", country_code: USA, gender: MALE, birth_date: "1996-01-03", whereabouts_filed: true }
              as: ElitesDirector
              captures: { athC_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${athA_id}", race_name: "Qual RG-A", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-RG-A", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { prA_id: "$.data.id" }
            - call: POST /performance-records/${prA_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /performance-records
              payload: { athlete_id: "${athB_id}", race_name: "Qual RG-B", performance_date: "2026-03-02", performance_seconds: 7910, division: ELITE, sanctioning_ref: "SB-RG-B", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { prB_id: "$.data.id" }
            - call: POST /performance-records/${prB_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7910 }
              as: TechnicalOfficial
            - call: POST /performance-records
              payload: { athlete_id: "${athC_id}", race_name: "Qual RG-C", performance_date: "2026-03-03", performance_seconds: 8800, division: SUB_ELITE, sanctioning_ref: "SB-RG-C", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { prC_id: "$.data.id" }
            - call: POST /performance-records/${prC_id}/verification
              payload: { decision: VERIFIED, official_seconds: 8800 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athA_id}", agent_id: "${agt_id}", qualifying_performance_id: "${prA_id}", division: ELITE }
              as: ElitesDirector
              captures: { invA_id: "$.data.id" }
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athB_id}", agent_id: "${agt_id}", qualifying_performance_id: "${prB_id}", division: ELITE }
              as: ElitesDirector
              captures: { invB_id: "$.data.id" }
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${athC_id}", agent_id: "${agt_id}", qualifying_performance_id: "${prC_id}", division: SUB_ELITE }
              as: ElitesDirector
              captures: { invC_id: "$.data.id" }
            - call: POST /invitations/${invA_id}/offer
              payload: { appearance_fee_cents: 400000, air_class: ECONOMY, hotel_nights: 2, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${invB_id}/offer
              payload: { appearance_fee_cents: 400000, air_class: ECONOMY, hotel_nights: 2, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${invC_id}/offer
              payload: { appearance_fee_cents: 0, air_class: ECONOMY, hotel_nights: 1, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${invA_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: POST /invitations/${invB_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: POST /invitations/${invC_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: POST /invitations/${invA_id}/assign-bib
              as: ElitesDirector
            - call: POST /invitations/${invB_id}/assign-bib
              as: ElitesDirector
            - call: POST /invitations/${invC_id}/assign-bib
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/lock-field
              as: ElitesDirector
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-11-01T09:00:00Z" }
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
            - call: POST /race-results
              payload: { race_edition_id: "${ed_id}", invitation_id: "${invA_id}", gun_seconds: 7400, net_seconds: 7398 }
              as: TechnicalOfficial
              captures: { resA_id: "$.data.id" }
            - call: POST /race-results
              payload: { race_edition_id: "${ed_id}", invitation_id: "${invB_id}", gun_seconds: 7500, net_seconds: 7498 }
              as: TechnicalOfficial
              captures: { resB_id: "$.data.id" }
            - call: POST /race-results
              payload: { race_edition_id: "${ed_id}", invitation_id: "${invC_id}", gun_seconds: 8600, net_seconds: 8598 }
              as: TechnicalOfficial
              captures: { resC_id: "$.data.id" }
            - call: POST /race-results/${resA_id}/certify
              as: TechnicalOfficial
            - call: POST /race-results/${resB_id}/certify
              as: TechnicalOfficial
            - call: POST /race-results/${resC_id}/certify
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
          trigger:
            - call: POST /race-results/${resC_id}/record-submission
              payload: { sanctioning_submission_ref: "PKG-SUB-ELITE" }
              as: TechnicalOfficial
              captures: { err1: "$.data.error_id" }
            - call: POST /race-results/${resA_id}/record-submission
              payload: { sanctioning_submission_ref: "PKG-A1" }
              as: TechnicalOfficial
            - call: POST /race-results/${resA_id}/record-submission
              payload: { sanctioning_submission_ref: "PKG-A2" }
              as: TechnicalOfficial
              captures: { err2: "$.data.error_id" }
            - call: POST /race-results/${resB_id}/record-decision
              payload: { decision: RATIFIED, decision_note: "decided without a package" }
              as: SanctioningBody
              captures: { err3: "$.data.error_id" }
            - call: POST /race-results/${resB_id}/disqualify
              payload: { dq_reason: COURSE_CUTTING }
              as: TechnicalOfficial
            - call: POST /race-results/${resB_id}/record-submission
              payload: { sanctioning_submission_ref: "PKG-B1" }
              as: TechnicalOfficial
              captures: { err4: "$.data.error_id" }
            - call: GET /race-results
              payload: { race_edition_id: "${ed_id}", record_claim_status: SUBMITTED }
              as: TechnicalOfficial
          assert:
            - "trigger call 1 returns HTTP 422 with error_id == ERR_RECORD_CLAIM_NOT_ELIGIBLE — a SUB_ELITE result never raises a course-record claim, so its NONE claim is an eligibility failure, not a state failure"
            - "trigger call 2 returns HTTP 200 with record_claim_status == SUBMITTED, sanctioning_submission_ref == \"PKG-A1\" and certification_status still CERTIFIED"
            - "trigger call 3 returns HTTP 409 with error_id == ERR_INVALID_RECORD_CLAIM_STATE — an already SUBMITTED claim cannot be resubmitted, and the stored ref stays \"PKG-A1\""
            - "trigger call 4 returns HTTP 409 with error_id == ERR_INVALID_RECORD_CLAIM_STATE — record-decision requires a SUBMITTED claim and B is only CLAIMED"
            - "trigger call 5 returns certification_status == DISQUALIFIED, dq_reason == COURSE_CUTTING and record_claim_status == REJECTED (cross-dimension coupling)"
            - "trigger call 6 returns HTTP 409 with error_id == ERR_RESULT_NOT_CERTIFIED — claim REJECTED would permit resubmission but the result is no longer CERTIFIED, so the certification precondition is what fails"
            - "trigger call 7 returns total_count == 1 with data[0].id == the A result — only A's package is live with the sanctioning body"

      - name: corner_endpoint_settle_purse_action_endpoint_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /race-editions/{id}/settle-purse]
          - endpoints[POST /race-editions/{id}/certify-results]
          - errors.ERR_RESULTS_NOT_ALL_ADJUDICATED
          - errors.ERR_AWARDS_NOT_ALL_SETTLED
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: >-
          The two closing actions each refuse to run until their whole child set is quiescent:
          certify-results rejects while any result is still PROVISIONAL, and settle-purse rejects
          while any award is still COMPUTED or APPROVED — and the only way through the award gate
          requires two distinct FinanceOfficer user ids, so the terminal PURSE_SETTLED state is
          reachable only after approval and payment are genuinely separated.
        test_recipe:
          setup:
            - "Edition with total_purse_cents 8,000,000, one OVERALL MALE place-1 line of 1,000,000, two ACCEPTED and bibbed ELITE MALE athletes who both finish; a CLEARED IN_COMPETITION doping test exists for the winner."
