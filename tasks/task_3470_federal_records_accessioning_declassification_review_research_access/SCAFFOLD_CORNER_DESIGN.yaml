            - "err_nperm == ERR_NOT_PERMANENT_DISPOSITION (409) for the APPROVED TEMPORARY schedule"
            - "GET /records/transfers?agency_id=${ag_doj} returns 0 rows"

      - name: description_incomplete_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DESCRIPTION_INCOMPLETE
          - validations[priority=13]
        distinguishing_aspect: "All three description elements must be non-empty: an empty scope_note is 422 ERR_DESCRIPTION_INCOMPLETE and the collection stays PROCESSING."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC collection C2 in PROCESSING."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
