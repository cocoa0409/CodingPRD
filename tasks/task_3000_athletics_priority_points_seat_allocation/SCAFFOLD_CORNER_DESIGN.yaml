      - name: selection_event_created_starts_in_draft_with_default_slot_geometry
        claim_type: initial_state
        grounds:
          - state_machines.SelectionEvent.status.initial_state
          - entities.SelectionEvent.fields.slot_buffer_minutes
          - entities.SelectionEvent.fields.eligible_donor_min_points
        distinguishing_aspect: |
          Event creation is deliberately NOT gated on the parent recalculation
          being CERTIFIED (priority 10 lists only publish-slots, START_RESEATING
          and retention-analysis), so an event may be drafted against a DRAFT
          recalculation. It must land in DRAFT with both counters at 0 and with
          the two optional geometry inputs defaulted to 0 rather than to null.
        test_recipe:
          setup:
            - "Empty database except one PointRecalculation for cycle 2026 still in status DRAFT (never run)."
          setup_api_calls:
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dr_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-recalculations/${dr_id}/selection-events"
              payload: { event_type: "POSTSEASON", window_start: "2026-10-01T00:00:00.000Z", window_end: "2026-10-03T00:00:00.000Z", slot_minutes: 60 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dev_id: "$.data.id" }
          assert:
            - "HTTP 201 (not 200) with an object envelope whose data is the SelectionEvent."
            - "SelectionEvent.${dev_id}.status == \"DRAFT\""
            - "SelectionEvent.${dev_id}.recalculation_id == \"${dr_id}\" (taken from the path, echoed as a system field)"
            - "SelectionEvent.${dev_id}.slot_buffer_minutes == 0 and SelectionEvent.${dev_id}.eligible_donor_min_points == 0.00"
            - "SelectionEvent.${dev_id}.published_slot_count == 0 and SelectionEvent.${dev_id}.scheduled_slot_count == 0"
            - "SelectionEvent.${dev_id}.version == 1"
            - "PointRecalculation.${dr_id}.status == \"DRAFT\" (event creation did not advance the parent)"
            - "GET /athletics/selection-slots?selection_event_id=${dev_id} returns total_count 0"

      - name: gating_an_event_open_straight_from_draft_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.SelectionEvent.status.transitions.SLOTS_PUBLISHED_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          There is no DRAFT -> OPEN edge: OPEN is reachable only from
          SLOTS_PUBLISHED. Gating a DRAFT event must therefore fail with 409
          ERR_INVALID_STATE before any window-overlap arithmetic runs, so an
          event with a perfectly valid non-overlapping window is still refused
          and its version stays 1.
        test_recipe:
          setup:
            - "One PointRecalculation in DRAFT owning exactly one SelectionEvent in DRAFT with zero slots."
          setup_api_calls:
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { gr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${gr_id}/selection-events"
              payload: { event_type: "SEASON_TICKET", window_start: "2026-09-01T00:00:00.000Z", window_end: "2026-09-05T00:00:00.000Z", slot_minutes: 2880 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { gev_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/selection-events/${gev_id}/gate"
              payload: { to_status: "OPEN" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 409 with error.code == \"ERR_INVALID_STATE\" (not ERR_SELECTION_WINDOW_OVERLAP and not ERR_RECALCULATION_NOT_CERTIFIED)"
            - "SelectionEvent.${gev_id}.status == \"DRAFT\" and version == 1"
            - "SelectionEvent.${gev_id}.published_slot_count == 0"

      - name: transfer_creation_forks_to_exception_pending_when_the_basis_precondition_fails
        claim_type: initial_state
        grounds:
          - state_machines.PointTransfer.status.transitions.REQUESTED_to_EXCEPTION_PENDING
          - calculations.transfer_cap_evaluation
        distinguishing_aspect: |
          PointTransfer.status has declared initial_state REQUESTED, yet creation
          lands in EXCEPTION_PENDING whenever the basis's factual precondition
          fails — here basis DEATH against a still-ACTIVE source donor. The
          entry state is therefore data-dependent, and transfer_pct_cap /
          max_transferable_points must still be computed (1.00 and 15.00) even on
          the forked path, with no points moved yet.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donor A, ACTIVE, INDIVIDUAL, certified_points 15.00 after one completed run of a cycle-2026 recalculation."
            - "Donor B, ACTIVE, INDIVIDUAL, certified_points 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
