              as: Investigator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

