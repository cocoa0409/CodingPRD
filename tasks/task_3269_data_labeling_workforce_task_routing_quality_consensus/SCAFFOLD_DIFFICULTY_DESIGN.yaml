  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: accuracy_exactly_at_the_floor_is_feasible
        grounds:
          - calculations.capacity_requirement_points
          - entities.CustomerProgram.accuracy_floor_variant_below
          - entities.CustomerProgram.accuracy_high_watermark_pct
          - validations[priority=9]
        distinguishing_aspect: |
          A numeric threshold crossing where equality is inclusive: accuracy exactly at the floor is
          feasible while one hundredth below it is infeasible, and the same rule pins the high
          watermark as inclusive on the cheap side.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with accuracy_floor_pct 85, accuracy_high_watermark_pct 95, capacity_points 100 and two units with max_items 10 each, so demand_points is 20."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "nadia-hassan" }
              as: Anonymous
              captures: { nadia_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4400", name: "Boundary Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", capacity_points: 100, accuracy_floor_pct: 85, accuracy_high_watermark_pct: 95, commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1, gold_rate: 0.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-2", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1, gold_rate: 0.0 }
              as: PlatformAdmin
              captures: { u2_id: "$.data.id" }
          trigger:
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "ASSESS_CAPACITY", plan_variant: "ACCEPTED" }
              as: PlatformAdmin
              captures: { dmnd: "$.data.demand_points", req: "$.data.capacity_requirement_points", feas: "$.data.capacity_feasible", below: "$.data.accuracy_floor_variant_below" }
          assert:
            - "with no gold audits graded yet, accepted_accuracy_pct is 0.00 and accuracy_floor_variant_below == true, so capacity_feasible == false even though demand_points 20 and capacity_requirement_points 20 are equal"
            - "capacity_requirement_points == 20 and capacity_points == 20, so the capacity comparison is satisfied and only the floor gate blocks feasibility -- proving the two conditions are separate AND terms"
            - "accuracy exactly equal to accuracy_floor_pct takes the medium branch and sets accuracy_floor_variant_below false, which makes the same plan feasible"
            - "accuracy exactly equal to accuracy_high_watermark_pct takes the high branch, where the per-item cost is 2 rather than 3"
            - "an assessment whose accuracy sits at the floor exactly returns capacity_feasible true, while one hundredth of a point below sets accuracy_floor_variant_below true and makes the same plan infeasible"

      - name: gold_rotation_boundary_at_exactly_three_audits
        grounds:
          - entities.LabelingItem.gold_audits_this_week
          - entities.LabelingItem.gold_rotation
          - errors[ERR_GOLD_ROTATION_ACTIVE]
          - errors[ERR_NO_ELIGIBLE_WORKER]
        distinguishing_aspect: |
          A numeric threshold crossing on a rotation counter rather than on an accuracy
          percentage: the third gold audit on a piece is admitted while the fourth is refused,
          and the same dispatch path reports ERR_NO_ELIGIBLE_WORKER on an empty pool, so the two
          boundaries sit on different metrics and are reached through different endpoints.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit at panel_size 1 and gold_rate 1.0 holding one released piece whose single member has committed; two gold audits have already been created and graded on it, so the weekly counter sits at exactly 2."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "kevin-lum" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1, min_consensus_agreement: 0.6 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1, gold_rate: 1.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${w_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${w_id}"
            - call: "POST /api/commits/${c1_id}/gold-audits"
              payload: { gold_task_key: "gold-000001" }
              as: PlatformReviewer
            - call: "POST /api/commits/${c1_id}/gold-audits"
              payload: { gold_task_key: "gold-000002" }
              as: PlatformReviewer
          trigger:
            - call: "POST /api/commits/${c1_id}/gold-audits"
              payload: { gold_task_key: "gold-000003" }
              as: PlatformReviewer
              captures: { g3_id: "$.data.id" }
          assert:
            - "the third audit is admitted, so LabelingItem.${it1_id}.gold_audits_this_week reaches exactly 3 and gold_rotation becomes true"
            - "a fourth audit request is then refused with ERR_GOLD_ROTATION_ACTIVE at status 409, so the boundary is reached at exactly 3 rather than at 4"
            - "the same engagement with a pool holding no eligible member returns ERR_NO_ELIGIBLE_WORKER at status 422 from the dispatch endpoint, which is the second, non-numeric boundary"
            - "advancing the clock across a week boundary resets gold_audits_this_week to 0 and clears gold_rotation, so a fourth audit is then admitted"
            - "a piece in REWORK is exempt from the rotation gate, because gold_rotation reads false while consensus_status is REWORK"

