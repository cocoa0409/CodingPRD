          trigger:
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_stale}", goals: ["Adult day program"] }
              as: CareManager
              as_user_id: "${cm_dana}"
