# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Retail Gift Card & Stored-Value Program — EXPERT
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - "entities.Program"
          - "endpoints"
        distinguishing_aspect: "POST /v1/programs with only name → 201; default_currency=USD, reload_min_cents=500, reload_max_balance_cents=100000 applied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
          assert:
            - "response.status == 201"
            - "Program.${prog}.reload_min_cents == 500"
            - "Program.${prog}.reload_max_balance_cents == 100000"
            - "Program.${prog}.default_currency == USD"
            - "Program.${prog}.version == 1"

      - name: get_card_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.GiftCard"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /v1/cards/{nonexistent} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/cards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 404"
            - "${eid} == ERR_NOT_FOUND"

      - name: create_state_rule_missing_breakage_policy_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.StateRule"
          - "validations[priority=4]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /v1/state-rules omitting required breakage_policy → ERR_VALIDATION (422)."
        test_recipe:
          setup: ["a program exists"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /v1/state-rules"
              payload: { program_id: "${prog}", state_code: "FL", expiration_allowed: true, dormancy_fee_allowed: false }
              as: ProgramAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 422"
            - "${eid} == ERR_VALIDATION"

      - name: card_computed_balance_ignores_input_value
        claim_type: Computed Fields
        grounds:
          - "entities.GiftCard.fields.settled_balance_cents"
        distinguishing_aspect: "settled_balance_cents is system-computed from the ledger; a client cannot set it at issuance — a freshly issued INACTIVE card reads 0."
        test_recipe:
          setup: ["a program exists"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
          assert:
            - "GiftCard.${card}.lifecycle_status == INACTIVE"
            - "GiftCard.${card}.risk_status == CLEAR"
            - "GiftCard.${card}.settled_balance_cents == 0"
            - "GiftCard.${card}.available_balance_cents == 0"

      - name: create_card_invalid_form_factor_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.GiftCard.fields.form_factor"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /v1/cards with form_factor='PLASTIC' (not DIGITAL|PHYSICAL) → ERR_VALIDATION (422)."
        test_recipe:
          setup: ["a program exists"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PLASTIC", state_code: "FL" }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 422"
            - "${eid} == ERR_VALIDATION"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.LedgerEntry"
        distinguishing_aspect: "LedgerEntry has common_fields:false (append-only) — it is read via GET only; the activate that creates a LOAD entry surfaces it through the filtered ledger list, and it has no version field."
        test_recipe:
          setup: ["an ACTIVE card with a single LOAD entry of 4000"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
          trigger:
            - call: "GET /v1/ledger-entries"
              payload: { card_id: "${card}", entry_type: "LOAD" }
              as: StoreAssociate
          assert:
            - "response.data is an array of length 1"
            - "response.data[0].entry_type == LOAD"
            - "response.data[0].amount_cents == 4000"

      - name: list_cards_paginated_envelope
        claim_type: Listing
        grounds:
          - "entities.GiftCard"
          - "endpoints"
        distinguishing_aspect: "GET /v1/cards?program_id returns paginated array with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["a program with two issued cards"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PHYSICAL", state_code: "FL" }
              as: StoreAssociate
          trigger:
            - call: "GET /v1/cards"
              payload: { program_id: "${prog}", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "response.response_type == array"
            - "total_count == 2"
            - "has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_card_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.GiftCard.INACTIVE_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Activating a card already ACTIVE → ERR_INVALID_STATE (409); no second LOAD posted."
        test_recipe:
          setup: ["an ACTIVE card with settled 4000"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
          trigger:
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 1000 }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_INVALID_STATE"
            - "GiftCard.${card}.settled_balance_cents == 4000"

      - name: void_already_voided_redemption_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Redemption.DRAFT_to_VOIDED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "VOIDED is terminal for Redemption; voiding a VOIDED redemption → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a DRAFT redemption that has been voided"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: ["${card}"] }
              as: StoreAssociate
              captures: { red: $.data.id }
            - call: "POST /v1/redemptions/${red}/void"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /v1/redemptions/${red}/void"
              payload: {}
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_INVALID_STATE"

      - name: flag_inactive_card_rejected_lifecycle_guard
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.GiftCard.CLEAR_to_FLAGGED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Flagging requires lifecycle_status IN {ACTIVE, EXHAUSTED}; flagging an INACTIVE card → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a freshly issued INACTIVE card"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
          trigger:
            - call: "POST /v1/cards/${card}/flag"
              payload: {}
              as: FraudAnalyst
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_INVALID_STATE"

      - name: card_auto_exhausts_when_balance_hits_zero
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.GiftCard.ACTIVE_to_EXHAUSTED"
          - "state_machines.Redemption.DRAFT_to_SETTLED"
        distinguishing_aspect: "A full-balance redemption drives the card to settled 0 and auto-transitions lifecycle_status ACTIVE→EXHAUSTED (bubble-up auto-transition)."
        test_recipe:
          setup: ["an ACTIVE card with settled 2000; a DRAFT redemption for 2000 over [card]"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 2000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 2000, card_id_order: ["${card}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: StoreAssociate
          assert:
            - "GiftCard.${card}.settled_balance_cents == 0"
            - "GiftCard.${card}.lifecycle_status == EXHAUSTED"

      - name: reload_revives_exhausted_card_to_active
        claim_type: Valid Transition
        grounds:
          - "state_machines.GiftCard.EXHAUSTED_to_ACTIVE"
        distinguishing_aspect: "Reloading an EXHAUSTED card posts a RELOAD credit and revives lifecycle_status EXHAUSTED→ACTIVE."
        test_recipe:
          setup: ["an EXHAUSTED card (settled 0 after a full redemption)"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 2000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 2000, card_id_order: ["${card}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
          trigger:
            - call: "POST /v1/cards/${card}/reload"
              payload: { amount_cents: 1500 }
              as: StoreAssociate
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: StoreAssociate
          assert:
            - "GiftCard.${card}.lifecycle_status == ACTIVE"
            - "GiftCard.${card}.settled_balance_cents == 1500"

      - name: freeze_releases_active_holds_cascade
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.GiftCard.FLAGGED_to_FROZEN_RISK"
          - "state_machines.AuthorizationHold.ACTIVE_to_RELEASED"
        distinguishing_aspect: "Freezing a FLAGGED card cascades all ACTIVE holds to RELEASED and recomputes pending_hold_cents to 0; settled unchanged."
        test_recipe:
          setup: ["an ACTIVE FLAGGED card settled 5000 with two ACTIVE holds (1000, 500)"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/holds"
              payload: { card_id: "${card}", amount_cents: 1000 }
              as: StoreAssociate
              captures: { h1: $.data.id }
            - call: "POST /v1/holds"
              payload: { card_id: "${card}", amount_cents: 500 }
              as: StoreAssociate
              captures: { h2: $.data.id }
            - call: "POST /v1/cards/${card}/flag"
              payload: {}
              as: FraudAnalyst
          trigger:
            - call: "POST /v1/cards/${card}/freeze"
              payload: {}
              as: FraudAnalyst
            - call: "GET /v1/holds/${h1}"
              payload: {}
              as: FraudAnalyst
          assert:
            - "AuthorizationHold.${h1}.status == RELEASED"
            - "GiftCard.${card}.pending_hold_cents == 0"
            - "GiftCard.${card}.settled_balance_cents == 5000"
            - "GiftCard.${card}.available_balance_cents == 5000"

      - name: hold_release_on_active_hold
        claim_type: Valid Transition
        grounds:
          - "state_machines.AuthorizationHold.ACTIVE_to_RELEASED"
        distinguishing_aspect: "Releasing an ACTIVE hold before expiry → status RELEASED; pending_hold_cents decreases, available_balance_cents restored."
        test_recipe:
          setup: ["an ACTIVE card settled 5000 with one ACTIVE hold of 2000"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", hold_ttl_seconds: 900 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/holds"
              payload: { card_id: "${card}", amount_cents: 2000 }
              as: StoreAssociate
              captures: { hold: $.data.id }
          trigger:
            - call: "POST /v1/holds/${hold}/release"
              payload: {}
              as: StoreAssociate
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: StoreAssociate
          assert:
            - "AuthorizationHold.${hold}.status == RELEASED"
            - "GiftCard.${card}.pending_hold_cents == 0"
            - "GiftCard.${card}.available_balance_cents == 5000"

      - name: replacement_reject_no_card_mutation
        claim_type: Valid Transition
        grounds:
          - "state_machines.ReplacementRequest.OPEN_to_REJECTED"
        distinguishing_aspect: "Rejecting an OPEN replacement → status REJECTED; old card stays ACTIVE with its balance intact (no transfer)."
        test_recipe:
          setup: ["an ACTIVE card settled 3000 with an OPEN replacement"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PHYSICAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${card}", reason: "LOST" }
              as: FraudAnalyst
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /v1/replacements/${rep}/reject"
              payload: {}
              as: FraudAnalyst
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: FraudAnalyst
          assert:
            - "ReplacementRequest.${rep}.status == REJECTED"
            - "GiftCard.${card}.lifecycle_status == ACTIVE"
            - "GiftCard.${card}.settled_balance_cents == 3000"

      - name: campaign_sync_status_scheduled_to_active
        claim_type: Valid Transition
        grounds:
          - "state_machines.PromoCampaign.SCHEDULED_to_ACTIVE"
        distinguishing_aspect: "With the clock inside [window_start, window_end), sync-status moves a SCHEDULED campaign to ACTIVE."
        test_recipe:
          setup: ["a SCHEDULED campaign over [2026-01-01, 2026-03-01); clock set to 2026-02-01"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/campaigns"
              payload: { program_id: "${prog}", name: "Winter", bonus_pct: 0.10, window_start: "2026-01-01T00:00:00Z", window_end: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/campaigns/${camp}/sync-status"
              payload: {}
              as: ProgramAdmin
          assert:
            - "PromoCampaign.${camp}.status == ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: reload_bonus_credited_during_active_campaign
        claim_type: Correct Result
        grounds:
          - "state_machines.GiftCard.ACTIVE_to_ACTIVE"
          - "calculations.card_balance_dual_variant"
        distinguishing_aspect: "Reloading 5000 while a 10% campaign is ACTIVE posts RELOAD 5000 + BONUS 500; a card at 2000 reaches settled 7500."
        test_recipe:
          setup: ["an ACTIVE card settled 2000; a campaign over [2026-01-01,2026-03-01) bonus 0.10; clock 2026-02-01; campaign synced ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/campaigns"
              payload: { program_id: "${prog}", name: "Winter", bonus_pct: 0.10, window_start: "2026-01-01T00:00:00Z", window_end: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /v1/campaigns/${camp}/sync-status"
              payload: {}
              as: ProgramAdmin
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 2000 }
              as: StoreAssociate
          trigger:
            - call: "POST /v1/cards/${card}/reload"
              payload: { amount_cents: 5000 }
              as: StoreAssociate
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: StoreAssociate
          assert:
            - "GiftCard.${card}.settled_balance_cents == 7500"

      - name: dormancy_fee_min_with_balance_floor
        claim_type: Correct Result
        grounds:
          - "calculations.dormancy_assessment"
        distinguishing_aspect: "dormancy_fee_allowed, expiration_allowed false; a dormant card with settled 1500 is charged min(200,1500)=200 leaving 1300; card stays ACTIVE (not expired)."
        test_recipe:
          setup: ["FL StateRule (dormancy_fee_allowed true, expiration_allowed false, RECOGNIZE, threshold 12); card activated 2025-01-01 settled 1500; clock 2026-02-01"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/state-rules"
              payload: { program_id: "${prog}", state_code: "FL", expiration_allowed: false, dormancy_fee_allowed: true, breakage_policy: "RECOGNIZE", dormancy_threshold_months: 12 }
              as: ProgramAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 1500 }
              as: StoreAssociate
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/cards/${card}/assess-dormancy"
              payload: {}
              as: ProgramAdmin
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "GiftCard.${card}.settled_balance_cents == 1300"
            - "GiftCard.${card}.lifecycle_status == ACTIVE"

      - name: split_tender_order_reversed_changes_legs
        claim_type: Variant Divergence
        grounds:
          - "calculations.split_tender_allocation"
          - "entities.RedemptionLeg.fields.leg_amount_cents"
        distinguishing_aspect: "Same cards A=3000,B=1500,C=4000, demand 5000, order [C,B,A]: legs C=4000,B=1000 (no A leg) — different per-card draw than the [A,B,C] difficulty instance."
        test_recipe:
          setup: ["three ACTIVE cards A=3000,B=1500,C=4000; a DRAFT redemption for 5000 with order [C,B,A]"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
