            - "assigning ${rx} to the section-C application succeeds: Assignment.${a_x3}.status == ASSIGNED (8 days apart)"
            - "Reviewer.${rx}.active_assignment_count == 2"

      - name: nce_extensions_adjoin_without_gap_or_overlap
        grounds:
          - state_machines.AwardModification.PENDING_APPROVAL_to_APPROVED
          - validations[priority=18]
        distinguishing_aspect: |
          Interval semantics: half-open contiguous budget periods on the Award resource — a no-cost
          extension must adjoin the current end_date exactly (new interval [end, new_end)), the
          first extension of <= 365 days auto-approves, and a second extension is never automatic
          (PENDING_APPROVAL) even though its 183-day length is within the limit.
