            - "trigger[1] returns HTTP 201 with TalkpathRequest.${tp_prc_ok}.outcome == GRANTED and priority_class_at_grant == 3"
            - "Site.${site_prc_id}.busy_talkpaths == 1, granted_request_count == 1, busied_request_count == 0 and grade_of_service_pct == 100.0"

      - name: otar_window_outside_crypto_period_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=33]
          - endpoints[POST /radio-system/otar-campaigns]
          - errors.ERR_OTAR_WINDOW_OUTSIDE_CRYPTO_PERIOD
        distinguishing_aspect: "A campaign window ending 2026-09-05T00:00:00Z against a crypto period ending 2026-09-01T00:00:00Z is refused with HTTP 422 ERR_OTAR_WINDOW_OUTSIDE_CRYPTO_PERIOD, while a window ending exactly at crypto_period_end is accepted (containment uses <=)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Keyset KS-CRYPTO-WIN (AES256) is ACTIVE with crypto period [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Crypto Window Agency", agency_code: "CRW01", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_crw_id: "$.data.id" }
            - call: "POST /radio-system/keysets"
              payload: { keyset_name: "KS-CRYPTO-WIN", algorithm: "AES256", crypto_period_start: "2026-08-01T00:00:00Z", crypto_period_end: "2026-09-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { keyset_crw_id: "$.data.id" }
            - call: "POST /radio-system/keysets/${keyset_crw_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_crw_id}", agency_id: "${agency_crw_id}", window_start: "2026-08-25T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { crypto_window_error_id: "$.data.error_id" }
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_crw_id}", agency_id: "${agency_crw_id}", window_start: "2026-08-25T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { campaign_crw_ok: "$.data.id" }
          assert:
            - "trigger[0] returns HTTP 422 with data.error_id == ERR_OTAR_WINDOW_OUTSIDE_CRYPTO_PERIOD"
            - "trigger[1] returns HTTP 201 and OtarCampaign.${campaign_crw_ok}.status == SCHEDULED"
            - "GET /radio-system/otar-campaigns?keyset_id=${keyset_crw_id} returns total_count == 1"

      - name: fee_period_longer_than_366_days_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - endpoints[POST /radio-system/agencies/{agency_id}/fee-assessments]
          - errors.ERR_FEE_PERIOD_INVALID
        distinguishing_aspect: "A 577-day period [2025-01-01, 2026-08-01) exceeds the 366-day cap and returns HTTP 422 ERR_FEE_PERIOD_INVALID with no fiscal field written, even though the expected_agency_version is current."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one agency with no assessment history."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Long Period Agency", agency_code: "LNG01", agency_type: "PUBLIC_WORKS", recorder_retention_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_lng_id: "$.data.id", agency_lng_v1: "$.data.version" }
          trigger:
            - call: "POST /radio-system/agencies/${agency_lng_id}/fee-assessments"
              payload: { period_start: "2025-01-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_agency_version: "${agency_lng_v1}" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { fee_period_error_id: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 422 with data.error_id == ERR_FEE_PERIOD_INVALID"
            - "MemberAgency.${agency_lng_id}.last_assessed_fee_cents == 0, lifetime_assessed_cents == 0, fee_balance_cents == 0 and payment_due_at == null"
            - "MemberAgency.${agency_lng_id}.version == ${agency_lng_v1} (a rejected assessment does not bump the version)"
            - "A repeat with period_start 2025-08-01T00:00:00Z (365 days) returns HTTP 200"

      - name: voting_suspended_target_agency_blocks_deploy
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=38]
          - calculations.agency_billing_status_recompute
          - state_machines.ProgrammingChangeRequest.APPROVED_to_DEPLOYING
          - errors.ERR_AGENCY_VOTING_SUSPENDED
        distinguishing_aspect: "Deployment validity depends on a different entity's fiscal state: once the TARGET agency's billing_status has decayed to SUSPENDED_FROM_VOTING the deploy call returns HTTP 403 ERR_AGENCY_VOTING_SUSPENDED and the change request stays APPROVED."
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-11-01T00:00:00Z."
            - "Agency VOT (EMS) owns one ASSIGNED unit on PUBLISHED template VOT-BASE-1; it is assessed 4200 cents for [2026-07-01, 2026-08-01) with payment_due_at 2026-08-31."
            - "After the clock passes payment_due_at + 60 grace days, a 1-cent payment re-runs agency_billing_status_recompute and lands the agency in SUSPENDED_FROM_VOTING."
            - "Change request CR-VOT targeting VOT is APPROVED after all template writes, so its pinned_template_record_version is still current."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Voting Suspended Agency", agency_code: "VOT01", agency_type: "EMS", fee_basis: "SNAPSHOT", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_vot_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "VOT-BASE-1", target_standard: "P25_PHASE2", talkgroup_slot_count: 4 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_vot_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_vot_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_vot_id}", serial_number: "VOT0001", radio_id: 34001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_vot_id}"
              captures: { unit_vot_id: "$.data.id" }
            - call: "POST /radio-system/units/${unit_vot_id}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_vot_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_vot_id}"
            - call: "GET /radio-system/agencies/${agency_vot_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_vot_v: "$.data.version" }
            - call: "POST /radio-system/agencies/${agency_vot_id}/fee-assessments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_agency_version: "${agency_vot_v}" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies/${agency_vot_id}/payments"
              payload: { amount_cents: 1 }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/change-requests"
              payload: { template_id: "${tpl_vot_id}", target_agency_id: "${agency_vot_id}", title: "Refresh suspended agency fleet" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { cr_vot_id: "$.data.id" }
            - call: "POST /radio-system/change-requests/${cr_vot_id}/submit"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/change-requests/${cr_vot_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: ChangeControlBoard
              as_user_id: "ccb-1"
          trigger:
            - call: "POST /radio-system/change-requests/${cr_vot_id}/deploy"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { voting_suspended_error_id: "$.data.error_id" }
          assert:
            - "Baseline after the 1-cent payment: MemberAgency.${agency_vot_id}.fee_balance_cents == 4199, billing_status == SUSPENDED_FROM_VOTING, governance_vote_weight == 0, voting_eligible == false"
            - "trigger[0] returns HTTP 403 with data.error_id == ERR_AGENCY_VOTING_SUSPENDED"
            - "ProgrammingChangeRequest.${cr_vot_id}.status == APPROVED with deployment_started_at == null, deployed_at == null, deployed_unit_count == 0 and failed_unit_count == 0"
            - "SubscriberUnit.${unit_vot_id}.provision_status == ASSIGNED and template_id == ${tpl_vot_id}"

      - name: fee_assessment_priority_conflict_state_before_fiscal
        claim_type: priority_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=39]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / fee_assessment_stale_version_outranks_invalid_fee_period
          rationale: "That §1.8 instance violates the priority-8 state rule and the priority-39 fiscal rule in one call and asserts the 412 wins."

      - name: patch_priority_conflict_safety_before_referential
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=29]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / patch_coverage_safety_outranks_encryption_mode_mismatch
          rationale: "That §1.8 instance violates the priority-20 business_safety rule and the priority-29 business_referential rule together and asserts which error_id surfaces."

      - name: maintenance_buffer_cascading_validation
        claim_type: cascading_validation
        grounds:
          - validations[priority=26]
