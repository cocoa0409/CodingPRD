              payload: {}
              as: StandOperator
              captures: { stcyc_status: $.data.status }
          assert:
            - "Stand.${stcyc_id}.status == OPEN"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: expire_lot_to_waste_to_event_cost_to_net_statement_depth3
        grounds:
          - state_machines.InventoryLot.ACTIVE_to_EXPIRED
          - entities.WasteRecord.fields.cost_cents
          - entities.Event.fields.waste_cost_cents
          - calculations.revenue_share_settlement
          - state_machines.Event.IN_PROGRESS_to_SETTLED
        distinguishing_aspect: |
          Depth-3 cascade from the expire-lots trigger: expiring a lot CREATES a
          WasteRecord (hop 1), which BUMPS Event.waste_cost_cents (hop 2), which
          under NET basis SHRINKS the settled RevenueShareStatement venue_share
          (hop 3). Each link is caused by the prior link, not by the sweep call.
        test_recipe:
          setup:
            - "Venue NET basis, venue_share_pct=20, service_fee_pct=7."
            - "Event/stand opened with staff; hotdog (base 1000) on menu and stocked; a perishable bun lot of 50 units @ 40c expiring at 2026-06-07T19:00:00Z."
            - "One order of 4 hotdogs picked up (gross 4922). Clock advanced past lot expiry; expire-lots run creates an EXPIRY WasteRecord (50*40=2000). Stand closed, event settled."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "CascVenue", venue_share_pct: 20, share_basis: "NET", spoilage_valuation: "FIFO", service_fee_pct: 7 }
              as: ConcessionsManager
              captures: { vc_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vc_id}", sku: "HOTDOG", name: "Hot Dog", base_price_cents: 1000, unit_cost_cents: 200, perishable: false }
              as: ConcessionsManager
              captures: { hot_c_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vc_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 40, perishable: true }
              as: ConcessionsManager
              captures: { bun_c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T17:00:00.000Z" }
              as: ConcessionsManager
            - call: "POST /concessions/events"
              payload: { venue_id: "${vc_id}", name: "EvtCasc", doors_time: "2026-06-07T18:00:00.000Z", end_time: "2026-06-07T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evc_id: $.data.id }
            - call: "POST /concessions/events/${evc_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evc_id}", name: "StandCasc", demand_tier: "MID", expected_orders_per_hour: 80 }
              as: ConcessionsManager
              captures: { stc_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stc_id}", worker_name: "Gus", shift_start: "2026-06-07T18:00:00.000Z", shift_end: "2026-06-07T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shc_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shc_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stc_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${stc_id}", product_id: "${hot_c_id}", available: true }
              as: ConcessionsManager
              captures: { mic_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stc_id}", product_id: "${hot_c_id}", received_qty: 50, unit_cost_cents: 200, par_level: 50, reorder_point: 10 }
              as: StockRunner
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stc_id}", product_id: "${bun_c_id}", received_qty: 50, unit_cost_cents: 40, par_level: 60, reorder_point: 10, expires_at: "2026-06-07T19:00:00.000Z" }
              as: StockRunner
            - call: "POST /concessions/patrons"
              payload: { display_name: "PatCasc" }
              as: Patron
              captures: { pat_c_id: $.data.id }
            - call: "POST /concessions/orders"
              payload: { event_id: "${evc_id}", stand_id: "${stc_id}", patron_id: "${pat_c_id}" }
              as: Patron
              as_user_id: "${pat_c_id}"
              captures: { orc_id: $.data.id }
            - call: "POST /concessions/orders/${orc_id}/lines"
              payload: { menu_item_id: "${mic_id}", qty: 4 }
              as: Patron
              as_user_id: "${pat_c_id}"
            - call: "POST /concessions/orders/${orc_id}/place"
              payload: {}
              as: Patron
              as_user_id: "${pat_c_id}"
            - call: "POST /concessions/orders/${orc_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${pat_c_id}"
            - call: "GET /concessions/stands/${stc_id}"
              payload: {}
              as: StandOperator
              captures: { stc_v: $.data.version }
            - call: "POST /concessions/orders/${orc_id}/ready"
              payload: { expected_stand_version: "${stc_v}" }
              as: StandOperator
            - call: "POST /concessions/orders/${orc_id}/pickup"
              payload: {}
              as: StandOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T20:00:00.000Z" }
              as: ConcessionsManager
            - call: "POST /concessions/stands/${stc_id}/expire-lots"
              payload: {}
              as: StockRunner
            - call: "POST /concessions/stands/${stc_id}/close"
              payload: {}
              as: StandOperator
          trigger:
            - call: "POST /concessions/events/${evc_id}/settle"
              payload: {}
              as: ConcessionsManager
              captures: { stmt_c_id: $.data.id }
          assert:
            - "Event.${evc_id}.waste_cost_cents == 2000"
            - "RevenueShareStatement.${stmt_c_id}.gross_sales_cents == 4922"
            - "RevenueShareStatement.${stmt_c_id}.waste_cost_cents == 2000"
            - "RevenueShareStatement.${stmt_c_id}.venue_share_cents == 584"
            - "RevenueShareStatement.${stmt_c_id}.operator_net_cents == 4338"

      - name: peak_window_open_to_price_and_staff_recompute_depth2
        grounds:
          - state_machines.Event.DOORS_OPEN_to_IN_PROGRESS
          - entities.Event.fields.peak_window
          - calculations.event_day_item_pricing
          - calculations.required_staffing
          - entities.MenuItem.fields.price_cents
          - entities.Stand.fields.required_staff
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (peak-window open): setting
          event.peak_window=true (hop 1) recomputes every MenuItem.price_cents
          AND every OPEN stand's required_staff (hop 2). Origin transition
          differs from the expire-lots cascade above.
        test_recipe:
          setup:
            - "Event mult 120, doors open; stand demand_tier=HIGH expected_orders_per_hour=160, opened with staff; hotdog (base 850) on menu with off-peak price 1326; required_staff 4 off-peak."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "PeakVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vpk_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vpk_id}", sku: "HOTDOG", name: "Hot Dog", base_price_cents: 850, unit_cost_cents: 200, perishable: false }
              as: ConcessionsManager
              captures: { hot_pk_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vpk_id}", name: "EvtPeak", doors_time: "2026-06-08T18:00:00.000Z", end_time: "2026-06-08T23:00:00.000Z", event_multiplier_pct: 120 }
              as: ConcessionsManager
              captures: { evpk_id: $.data.id }
            - call: "POST /concessions/events/${evpk_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evpk_id}", name: "StandPeak", demand_tier: "HIGH", expected_orders_per_hour: 160 }
              as: ConcessionsManager
              captures: { stpk_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stpk_id}", worker_name: "Hal", shift_start: "2026-06-08T18:00:00.000Z", shift_end: "2026-06-08T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shpk_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shpk_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stpk_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${stpk_id}", product_id: "${hot_pk_id}", available: true }
              as: ConcessionsManager
              captures: { mipk_id: $.data.id }
          trigger:
            - call: "POST /concessions/events/${evpk_id}/peak-window/open"
              payload: {}
              as: ConcessionsManager
            - call: "GET /concessions/menu-items/${mipk_id}"
              payload: {}
              as: ConcessionsManager
              captures: { mipk_price: $.data.price_cents }
            - call: "GET /concessions/stands/${stpk_id}"
              payload: {}
              as: ConcessionsManager
              captures: { stpk_staff: $.data.required_staff }
          assert:
            - "MenuItem.${mipk_id}.price_cents == 1428"
            - "Stand.${stpk_id}.required_staff == 5"
            - "Event.${evpk_id}.peak_window == true"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_order_unpaid_on_ready
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ORDER_UNPAID]
        distinguishing_aspect: |
          Category pair state (priority 5, ERR_INVALID_STATE) vs
          business_constraint (priority 10, ERR_ORDER_UNPAID). An order still in
          CART (not PLACED) and UNPAID, readied, fails BOTH; the lower-priority
          state check wins → ERR_INVALID_STATE, not ERR_ORDER_UNPAID.
        test_recipe:
          setup:
            - "Event/stand opened with staff, water product stocked, an order in CART with one line (never placed, never paid)."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "PvVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vpv_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vpv_id}", sku: "WATER", name: "Water", base_price_cents: 100, unit_cost_cents: 10, perishable: false }
              as: ConcessionsManager
              captures: { wpv_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vpv_id}", name: "EvtPv", doors_time: "2026-06-09T18:00:00.000Z", end_time: "2026-06-09T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evpv_id: $.data.id }
            - call: "POST /concessions/events/${evpv_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evpv_id}", name: "StandPv", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stpv_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stpv_id}", worker_name: "Ivy", shift_start: "2026-06-09T18:00:00.000Z", shift_end: "2026-06-09T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shpv_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shpv_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stpv_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${stpv_id}", product_id: "${wpv_id}", available: true }
              as: ConcessionsManager
              captures: { mipv_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stpv_id}", product_id: "${wpv_id}", received_qty: 50, unit_cost_cents: 10, par_level: 50, reorder_point: 10 }
              as: StockRunner
            - call: "POST /concessions/patrons"
              payload: { display_name: "PatPv" }
              as: Patron
              captures: { patpv_id: $.data.id }
            - call: "POST /concessions/orders"
              payload: { event_id: "${evpv_id}", stand_id: "${stpv_id}", patron_id: "${patpv_id}" }
              as: Patron
              as_user_id: "${patpv_id}"
              captures: { orpv_id: $.data.id }
            - call: "POST /concessions/orders/${orpv_id}/lines"
              payload: { menu_item_id: "${mipv_id}", qty: 1 }
              as: Patron
              as_user_id: "${patpv_id}"
            - call: "GET /concessions/stands/${stpv_id}"
              payload: {}
              as: StandOperator
              captures: { stpv_v: $.data.version }
          trigger:
            - call: "POST /concessions/orders/${orpv_id}/ready"
              payload: { expected_stand_version: "${stpv_v}" }
              as: StandOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: forbidden_role_beats_not_found_on_settle
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Category pair auth (priority 2, ERR_FORBIDDEN_ROLE) vs existence
          (priority 3, ERR_NOT_FOUND), a different pair from the state-vs-business
          conflict above. A StockRunner settling a NON-existent event fails both;
          authorization is checked before existence → ERR_FORBIDDEN_ROLE.
        test_recipe:
          setup:
            - "Empty DB (no event with the given id); caller is StockRunner, not the ConcessionsManager who alone may settle."
          setup_api_calls: []
          trigger:
            - call: "POST /concessions/events/00000000-0000-4000-8000-000000000000/settle"
              payload: {}
              as: StockRunner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "response.status == 403"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: staffing_ceiling_boundary_160_vs_161
        grounds:
          - calculations.required_staffing
          - entities.Stand.fields.expected_orders_per_hour
          - entities.Stand.fields.required_staff
          - state_machines.Stand.CLOSED_to_OPEN
        distinguishing_aspect: |
          Metric: ceil(expected_orders_per_hour / 40). At exactly 160 the ceiling
          is 4 (no extra worker); the boundary is the open transition. Tests the
          == k*40 exact case (not 161 which would yield 5).
        test_recipe:
          setup:
            - "Event/stand with expected_orders_per_hour=160, doors open, staff checked in, opened off-peak."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "StaffVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vst_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vst_id}", name: "EvtStaff", doors_time: "2026-06-10T18:00:00.000Z", end_time: "2026-06-10T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evst_id: $.data.id }
            - call: "POST /concessions/events/${evst_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evst_id}", name: "StandStaff", demand_tier: "MID", expected_orders_per_hour: 160 }
              as: ConcessionsManager
              captures: { stst_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stst_id}", worker_name: "Jan", shift_start: "2026-06-10T18:00:00.000Z", shift_end: "2026-06-10T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shst_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shst_id}/check-in"
              payload: {}
              as: StandOperator
          trigger:
            - call: "POST /concessions/stands/${stst_id}/open"
              payload: {}
              as: StandOperator
              captures: { stst_staff: $.data.required_staff }
          assert:
            - "Stand.${stst_id}.required_staff == 4"

      - name: replenishment_suggestion_at_reorder_point_inclusive
        grounds:
          - calculations.replenishment_suggestion
          - entities.InventoryLot.fields.reorder_point
          - entities.InventoryLot.fields.par_level
          - entities.InventoryLot.fields.remaining_qty
        distinguishing_aspect: |
          Different metric and endpoint from staffing: on_hand vs reorder_point
          on the replenishment-suggestions read. on_hand exactly == reorder_point
          (60 == 60) triggers a suggestion of par-on_hand=140 via the inclusive
          (<=) comparison; on_hand=61 would not.
        test_recipe:
          setup:
            - "Stand with one bun lot whose remaining_qty is exactly the reorder_point (60), par_level 200."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "ReplVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vrp_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vrp_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: true }
              as: ConcessionsManager
              captures: { brp_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vrp_id}", name: "EvtRepl", doors_time: "2026-06-11T18:00:00.000Z", end_time: "2026-06-11T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evrp_id: $.data.id }
            - call: "POST /concessions/events/${evrp_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evrp_id}", name: "StandRepl", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { strp_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${strp_id}", product_id: "${brp_id}", received_qty: 60, unit_cost_cents: 30, par_level: 200, reorder_point: 60 }
              as: StockRunner
              captures: { lrp_id: $.data.id }
          trigger:
            - call: "GET /concessions/stands/${strp_id}/replenishment-suggestions"
              payload: {}
              as: StockRunner
          assert:
            - "response.data is a non-empty array containing one entry for product ${brp_id}"
            - "the entry for product ${brp_id} has on_hand == 60 and suggested_qty == 140"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stand_open_requires_event_doors_open_pair_stand_event
        grounds:
          - state_machines.Stand.CLOSED_to_OPEN
          - validations[priority=7]
          - errors[ERR_EVENT_NOT_OPENABLE]
          - entities.Event.fields.status
        distinguishing_aspect: |
          Pair Stand→Event: a Stand's CLOSED→OPEN transition is gated by the
          parent Event being DOORS_OPEN/IN_PROGRESS. With the event still
          SCHEDULED, opening the stand (staff present) is rejected
          ERR_EVENT_NOT_OPENABLE.
        test_recipe:
          setup:
            - "Event left SCHEDULED (doors NOT opened); stand created with a checked-in staff shift."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "CeVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vce_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vce_id}", name: "EvtCe", doors_time: "2026-06-12T18:00:00.000Z", end_time: "2026-06-12T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evce_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${evce_id}", name: "StandCe", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stce_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stce_id}", worker_name: "Kim", shift_start: "2026-06-12T18:00:00.000Z", shift_end: "2026-06-12T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shce_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shce_id}/check-in"
              payload: {}
              as: StandOperator
          trigger:
            - call: "POST /concessions/stands/${stce_id}/open"
              payload: {}
              as: StandOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_NOT_OPENABLE"
            - "response.status == 409"

      - name: order_place_requires_stand_open_pair_order_stand
        grounds:
          - state_machines.Order.fulfillment_CART_to_PLACED
          - validations[priority=9]
          - errors[ERR_STAND_NOT_OPEN]
          - entities.Stand.fields.status
        distinguishing_aspect: |
          Pair Order→Stand (different from Stand→Event above): placing a CART
          order is gated by the stand being OPEN. With the stand SUSPENDED, the
          place is rejected ERR_STAND_NOT_OPEN even though the order itself is
          line-complete and the event is live.
        test_recipe:
          setup:
            - "Event/stand opened with staff, water stocked, an order in CART with one line; then the stand is SUSPENDED."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "CeoVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vceo_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vceo_id}", sku: "WATER", name: "Water", base_price_cents: 100, unit_cost_cents: 10, perishable: false }
              as: ConcessionsManager
              captures: { wceo_id: $.data.id }
            - call: "POST /concessions/events"
