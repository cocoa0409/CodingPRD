      - name: evidence_multiplier_comes_from_base_band_not_priority_band
        claim_type: constants_applied
        grounds:
          - calculations.pair_triage_effective_score
          - global_constants.BAND_MULTIPLIER_P1
          - global_constants.BAND_MULTIPLIER_P3
        distinguishing_aspect: "The multiplier is pinned to base_band: a match_score of 86.00 selects BAND_MULTIPLIER_P1 1.5, so -12.00 evidence points become -18.00 and the effective_score lands on 68.00 in band P3 - an implementation that read the multiplier off the resulting priority_band would report 80.00."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-C9."
            - "One MatchRuleSet RS-BAND with weights last_name 26.00, first_name 15.00, dob 25.00, ssn_last4 15.00, sex 5.00, postal_code 9.00, phone 5.00 (sum 100.00), auto_link_threshold 90.00 and review_threshold 70.00. auto_link_threshold sits ABOVE BAND_CUTOFF_P1 85.00, which is what makes a P1 pair reachable without AUTO_LINK."
            - "Two PatientRecord rows agreeing on last_name, first_name, dob, ssn_last4 and sex, with C9-2000 leaving postal_code and phone null: match_score is 26.00 + 15.00 + 25.00 + 15.00 + 5.00 = 86.00, so classification is POTENTIAL_DUPLICATE (86.00 < 90.00) and base_band is P1."
            - "The pair is triaged (version 2) and taken into review (version 3); two SUPPORTS_DISTINCT evidence rows of 10.00 and 2.00 are then filed (versions 4 and 5) because a single row may not exceed 10.00 weight_points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
