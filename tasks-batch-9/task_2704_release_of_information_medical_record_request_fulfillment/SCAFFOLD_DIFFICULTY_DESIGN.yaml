          /roi/requests/{id}/release, with a second leg that proves 47 was really
          violated: from SENSITIVE_REVIEW with billing PENDING_INVOICE the answer is
          ERR_REQUEST_STATE_INVALID (409), and from RELEASE_READY with the very same
