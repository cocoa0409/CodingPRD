scaffold_difficulty_design:

  # =============================================================================
  # RULE 1 - dual_variant_calc
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: restitution_variant_divergence_driven_by_scope_area_tolerance
        grounds:
          - calculations.restitution_exposure
          - calculations.error_rate_and_tolerance
          - entities.Criticism.fields.restitution_method
          - entities.Criticism.fields.restitution_exposure_cents
          - entities.ExamScopeArea.fields.tolerance_breached
          - entities.Examination.fields.pending_restitution_cents
        distinguishing_aspect: |
          Two scope areas of ONE examination carry byte-identical sample harm (10 reviewed files,
          3 MATERIAL errors of 25000 + 18000 + 7333 cents, population 4000) and receive
          byte-identical MATERIAL criticisms; only error_tolerance_pct differs (3.00 vs 40.00), so
          tolerance_breached alone flips restitution_method and the exposure moves from 50333 to
          20132000 cents - a 400x divergence produced by the variant selector, not by the inputs.
        test_recipe:
          setup:
            - "One LICENSED carrier AURORA (40000 policies, 120 complaints -> complaint_ratio_per_1k 3.00, risk_tier ELEVATED)."
            - "One ON_SITE examination on AURORA, fieldwork window 2026-09-01 .. 2026-11-30, scope locked."
            - "Scope area CLAIMS: population 4000, sample 10, error_tolerance_pct left to the CLAIMS statutory default 3.00."
            - "Scope area UNDERWRITING: population 4000, sample 10, error_tolerance_pct explicitly overridden to 40.00."
            - "Both areas TESTED after identical bulk reviews: reviewed 10, error_count 3, error_rate_pct 30.00; CLAIMS tolerance_breached true, UNDERWRITING tolerance_breached false."
            - "Examination is therefore in CRITICISM with both fieldwork workpaper types recorded."
            - "Logical clock left at its 2026-08-01T00:00:00Z default throughout."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "UNDERWRITING", population_size: 4000, sample_size: 10, error_tolerance_pct: 40.00 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { uw_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "POST /market-conduct/scope-areas/${clm_area_id}/data-calls"
              payload: { records_requested: 4000, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_dc_id: "$.data.id" }
            - call: "POST /market-conduct/scope-areas/${uw_area_id}/data-calls"
              payload: { records_requested: 4000, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { uw_dc_id: "$.data.id" }
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/respond"
              payload: { records_received: 4000, submitted_by_contact: "D. Reyes, Compliance Director" }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
            - call: "POST /market-conduct/data-calls/${uw_dc_id}/respond"
              payload: { records_received: 4000, submitted_by_contact: "D. Reyes, Compliance Director" }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/disposition"
              payload: { disposition: "ACCEPTED", disposition_reason: "Production complete and on time." }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/data-calls/${uw_dc_id}/disposition"
              payload: { disposition: "ACCEPTED", disposition_reason: "Production complete and on time." }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/examinations/${exam_id}/fieldwork-activities"
              payload: { activity_type: "SYSTEM_WALKTHROUGH", area: "CLAIMS", participant_name: "R. Vance", participant_title: "VP Claims Operations", summary: "Walked the claims adjudication platform end to end with the carrier.", evidence_ref: "WP-CLM-01" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/examinations/${exam_id}/fieldwork-activities"
              payload: { activity_type: "INTERVIEW", area: "CLAIMS", participant_name: "L. Ortiz", participant_title: "Claims Manager", summary: "Interviewed the claims manager on prompt-pay handling and denials.", evidence_ref: "WP-CLM-02" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/bulk-review"
              payload:
                reviews:
                  - { file_reference: "CLM-000001", error_severity: "MATERIAL", underpaid_amount_cents: 25000, days_to_pay: 61 }
                  - { file_reference: "CLM-000401", error_severity: "MATERIAL", underpaid_amount_cents: 18000, days_to_pay: 47 }
                  - { file_reference: "CLM-000801", error_severity: "MATERIAL", underpaid_amount_cents: 7333, days_to_pay: 39 }
                  - { file_reference: "CLM-001201", error_severity: "NONE" }
                  - { file_reference: "CLM-001601", error_severity: "NONE" }
                  - { file_reference: "CLM-002001", error_severity: "NONE" }
                  - { file_reference: "CLM-002401", error_severity: "NONE" }
                  - { file_reference: "CLM-002801", error_severity: "NONE" }
                  - { file_reference: "CLM-003201", error_severity: "NONE" }
                  - { file_reference: "CLM-003601", error_severity: "NONE" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/data-calls/${uw_dc_id}/bulk-review"
              payload:
                reviews:
                  - { file_reference: "UW-000001", error_severity: "MATERIAL", underpaid_amount_cents: 25000, days_to_pay: 61 }
                  - { file_reference: "UW-000401", error_severity: "MATERIAL", underpaid_amount_cents: 18000, days_to_pay: 47 }
                  - { file_reference: "UW-000801", error_severity: "MATERIAL", underpaid_amount_cents: 7333, days_to_pay: 39 }
                  - { file_reference: "UW-001201", error_severity: "NONE" }
                  - { file_reference: "UW-001601", error_severity: "NONE" }
                  - { file_reference: "UW-002001", error_severity: "NONE" }
                  - { file_reference: "UW-002401", error_severity: "NONE" }
                  - { file_reference: "UW-002801", error_severity: "NONE" }
                  - { file_reference: "UW-003201", error_severity: "NONE" }
                  - { file_reference: "UW-003601", error_severity: "NONE" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
          trigger:
            - call: "POST /market-conduct/criticisms"
              payload: { exam_id: "${exam_id}", scope_area_id: "${clm_area_id}", statute_citation: "NRS 686A.310(1)(e)", severity: "MATERIAL", affected_file_count: 3 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { crit_clm_id: "$.data.id", clm_method: "$.data.restitution_method", clm_exposure: "$.data.restitution_exposure_cents" }
            - call: "POST /market-conduct/criticisms"
              payload: { exam_id: "${exam_id}", scope_area_id: "${uw_area_id}", statute_citation: "NRS 686A.310(1)(e)", severity: "MATERIAL", affected_file_count: 3 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { crit_uw_id: "$.data.id", uw_method: "$.data.restitution_method", uw_exposure: "$.data.restitution_exposure_cents" }
          assert:
            - "ExamScopeArea.${clm_area_id}.error_rate_pct == 30.00 and ExamScopeArea.${uw_area_id}.error_rate_pct == 30.00"
            - "ExamScopeArea.${clm_area_id}.tolerance_breached == true (30.00 >= 3.00)"
            - "ExamScopeArea.${uw_area_id}.tolerance_breached == false (30.00 < 40.00)"
            - "Criticism.${crit_clm_id}.restitution_method == POPULATION_EXTRAPOLATED"
            - "Criticism.${crit_clm_id}.restitution_exposure_cents == 20132000"
            - "Criticism.${crit_uw_id}.restitution_method == SAMPLE_ACTUAL"
            - "Criticism.${crit_uw_id}.restitution_exposure_cents == 50333"
            - "Criticism.${crit_clm_id}.restitution_exposure_cents != Criticism.${crit_uw_id}.restitution_exposure_cents"
            - "Examination.${exam_id}.pending_restitution_cents == 20182333"
            - "Examination.${exam_id}.aggregate_restitution_cents == 0"
            - "Examination.${exam_id}.open_criticism_count == 2"

      - name: penalty_variant_divergence_flips_cooperation_credit_tier
        grounds:
          - calculations.penalty_determination
          - entities.ConsentOrder.fields.penalty_variant
          - entities.ConsentOrder.fields.cooperation_credit_pct
          - entities.ConsentOrder.fields.order_total_cents
          - endpoints[GET /market-conduct/examinations/{id}/exposure-summary]
        distinguishing_aspect: |
          On ONE examination with aggregate_restitution_cents 24000000 and penalty_units_total 20 the
          two penalty variants do not merely produce different penalties (500000 vs 1740000 gross):
          because the cooperation credit is keyed on restitution + gross penalty, PER_VIOLATION lands
          at subtotal 24500000 and earns the 5% credit while TIERED_AGGREGATE lands at subtotal
          25740000 and earns the 15% credit - the variant choice changes the credit RATE itself, not
          just the base it is applied to.
        test_recipe:
          setup:
            - "AURORA carrier; ON_SITE examination 2026-09-01 .. 2026-11-30, scope locked."
            - "Single CLAIMS scope area: population 4000, sample 10, statutory tolerance 3.00."
            - "Sample harm 30000 + 20000 + 10000 = 60000 over 10 reviewed files -> average 6000 cents -> POPULATION_EXTRAPOLATED exposure 6000 * 4000 = 24000000."
            - "One MATERIAL criticism sustained with penalty_units 20, so Examination.aggregate_restitution_cents == 24000000, penalty_units_total == 20, sustained_criticism_count == 1 and the examination sits in NEGOTIATION."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
