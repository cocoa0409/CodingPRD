            - "the 12:00-13:00 candidate also returns 409 ERR_ROOM_OCCUPIED: the buffer is applied to the candidate too, so [12:00, 13:30) reaches into the incumbent's start at 13:00 - an implementation that only buffers the incumbent wrongly returns 201 here"
            - "the 14:30-15:30 candidate returns 201: 14:30 == existing.scheduled_end + turnover_buffer_min, and the buffered windows [13:00, 14:30) and [14:30, 16:00) are half-open, so exact adjacency is legal"
