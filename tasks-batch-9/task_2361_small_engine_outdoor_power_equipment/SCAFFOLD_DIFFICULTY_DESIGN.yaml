# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2361 — Small Engine & Outdoor Power Equipment Plant
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file leaves
# the declared behaviour identical — it only makes coverage harder to audit.
#
# YAML anchors: the canonical fixture prelude is defined once (as `&a_*` call
# objects, in the first instance that legitimately needs each call) and aliased
# thereafter. Aliases are per-node and valid for the remainder of this document.
# Every numeric literal in `assert:` was computed by executing the relevant
# §1.3 formula with its declared constants.
#
# Canonical prelude values (aliased throughout):
#   clock            2026-08-03T08:00:00Z
#   family           2027-EPA-208SS, EPA_PHASE3, 190..224 cc, 500 h,
#                    limit 8.00 g/kWh, declared baseline 4.00 g/kWh
#   platform         208SS, 208 cc, torque 22.0 Nm +/-5% x 4 fasteners,
#                    hot-test window 3200..3600 rpm
#   durability run   [2026-08-03T09:00Z, 2026-08-24T09:00Z), initial 5.00,
#                    completed at 500 h with final 6.40  -> df 1.2800,
#                    certified 5.12, margin 36.00
#   model            WM-21-BBC, WALK_MOWER, DUAL, cost 21000, dealer share 0.55
#   line             L1, WALK_MOWER + SNOW_THROWER, 500 units/week, gap 1 week
#   suppliers/lots   SUP-CARB/CB-001, SUP-IGN/IG-001, SUP-CAST/CS-001 (800 each,
#                    NORMAL -> sample 40, inspected with 0 defects -> ACCEPTED)
#   machining run    CYLINDER_BORE, LSL 64.980 / USL 65.020, cpk 2.1082 -> CLOSED
#   build order      PRE_SEASON, week 2026-09-14, span 2, planned 6
#                    -> value 126000, 24 carry weeks, rate 0.0040, carry 12096
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: deterioration_factor_multiplicative_vs_additive_diverge
        grounds:
          - calculations.deterioration_factor_and_certified_emission
          - entities.CertificationFamily.fields.deterioration_factor
          - entities.CertificationFamily.fields.certified_emission_g_per_kwh
          - entities.CertificationFamily.fields.compliance_margin_pct
          - entities.DurabilityTestRun.fields.df_method
          - state_machines.DurabilityTestRun.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Entity domain 1 of 2 — emission compliance arithmetic on CertificationFamily.
          Two families receive byte-identical durability readings (baseline 4.00,
          initial 5.00, final 6.40, 500 h accumulated); EPA_PHASE3 applies the
          deterioration factor MULTIPLICATIVELY (df 1.2800 -> certified 5.12) while
          CARB_2024 applies it ADDITIVELY (df 1.4000 -> certified 5.40), a 0.28 g/kWh
          divergence and a 3.50-point compliance-margin divergence on the same data.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-03T08:00:00Z."
            - "Family 2027-EPA-208SS (EPA_PHASE3) with platform 208SS, and family 2027-CARB-208SS (CARB_2024) with platform 208SS-C; both declare baseline 4.00 g/kWh against an 8.00 g/kWh family limit over a 500 h durability period."
            - "Each family has exactly one SCHEDULED durability run with initial_emission_g_per_kwh 5.00; the runs sit on different platforms so no window overlap applies."
          setup_api_calls:
            - &a_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlantAdmin
            - &a_fam
              call: "POST /certification-families"
              payload: { family_code: "2027-EPA-208SS", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_id: $.data.id, fam_v1: $.data.version }
            - &a_plat
              call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "208SS", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /certification-families"
              payload: { family_code: "2027-CARB-208SS", model_year: 2027, emission_standard: "CARB_2024", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_carb_id: $.data.id, fam_carb_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_carb_id}", platform_code: "208SS-C", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_carb_id: $.data.id }
            - &a_dur
              call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_id: $.data.id }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_carb_id}", engine_platform_id: "${plat_carb_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_carb_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_carb_id: $.data.id }
          trigger:
            - &a_dur_complete
              call: "POST /durability-tests/${dur_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 6.40 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /durability-tests/${dur_carb_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 6.40 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
          assert:
            - "DurabilityTestRun.${dur_id}.df_method == MULTIPLICATIVE"
            - "DurabilityTestRun.${dur_id}.computed_deterioration_factor == 1.2800"
            - "DurabilityTestRun.${dur_id}.extrapolated == false"
            - "DurabilityTestRun.${dur_id}.status == COMPLETED"
            - "CertificationFamily.${fam_id}.deterioration_factor == 1.2800"
            - "CertificationFamily.${fam_id}.certified_emission_g_per_kwh == 5.12"
            - "CertificationFamily.${fam_id}.compliance_margin_pct == 36.00"
            - "CertificationFamily.${fam_id}.status == DURABILITY_COMPLETE"
            - "DurabilityTestRun.${dur_carb_id}.df_method == ADDITIVE"
            - "DurabilityTestRun.${dur_carb_id}.computed_deterioration_factor == 1.4000"
            - "CertificationFamily.${fam_carb_id}.deterioration_factor == 1.4000"
            - "CertificationFamily.${fam_carb_id}.certified_emission_g_per_kwh == 5.40"
            - "CertificationFamily.${fam_carb_id}.compliance_margin_pct == 32.50"
            - "CertificationFamily.${fam_id}.certified_emission_g_per_kwh != CertificationFamily.${fam_carb_id}.certified_emission_g_per_kwh (5.12 vs 5.40 on identical readings)"

      - name: supplier_ppm_pooled_vs_per_lot_average_diverge
        grounds:
          - calculations.supplier_defect_ppm
          - calculations.lot_sample_plan
          - calculations.supplier_inspection_level_ladder
          - entities.Supplier.fields.rolling_defect_ppm
          - entities.ComponentLot.fields.defect_ppm
          - state_machines.Supplier.APPROVED_to_PROBATION
        distinguishing_aspect: |
          Entity domain 2 of 2 — supplier quality scoring on Supplier, not emission
          arithmetic on CertificationFamily. Two lots with UNEQUAL sample sizes
          (40 pieces / 0 defects and 10 pieces / 2 defects) make the two aggregation
          choices disagree by 2.5x: POOLED weights by sample size (2/50 -> 40000 ppm,
          stored on Supplier.rolling_defect_ppm and the only value the ladder reads)
          while PER_LOT_AVERAGE weights every lot equally ((0 + 200000)/2 -> 100000 ppm
          on GET /suppliers/{id}/scorecard) — the average would tie PPM_SUSPEND_THRESHOLD
          where the pooled value only crosses PPM_PROBATION_THRESHOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "Supplier SUP-CARB (CARBURETOR, criticality MAJOR, APPROVED, NORMAL inspection level)."
            - "Lot CB-001 of 800 pieces received at NORMAL -> sample_size 40, acceptance_number 4; inspected with 0 defects -> ACCEPTED, defect_ppm 0, consecutive_accepted_lots 1."
            - "Lot CB-002 of 200 pieces received while the supplier is still NORMAL (streak 1 < REDUCED_STREAK 3) -> sample_size 10, acceptance_number 1."
          setup_api_calls:
            - *a_clock
            - &a_sup_carb
              call: "POST /suppliers"
              payload: { supplier_code: "SUP-CARB", name: "Kirin Carburetor Works", component_category: "CARBURETOR" }
              as: PlantAdmin
              captures: { sup_carb_id: $.data.id }
            - &a_lot_carb
              call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-001", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_carb_id: $.data.id }
            - &a_inspect_carb_clean
              call: "POST /component-lots/${lot_carb_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_lot_carb2
              call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-002", lot_quantity: 200 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_carb2_id: $.data.id }
          trigger:
            - &a_inspect_carb2_reject
              call: "POST /component-lots/${lot_carb2_id}/inspect"
              payload: { defects_found: 2 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /suppliers/${sup_carb_id}/scorecard"
              payload: {}
              as: QualityEngineer
              captures: { pooled_ppm: $.data.rolling_defect_ppm, average_ppm: $.data.scorecard_average_ppm }
          assert:
            - "ComponentLot.${lot_carb_id}.sample_size == 40"
            - "ComponentLot.${lot_carb_id}.acceptance_number == 4"
            - "ComponentLot.${lot_carb_id}.defect_ppm == 0"
            - "ComponentLot.${lot_carb2_id}.sample_size == 10"
            - "ComponentLot.${lot_carb2_id}.acceptance_number == 1"
            - "ComponentLot.${lot_carb2_id}.status == REJECTED (2 defects > acceptance_number 1)"
            - "ComponentLot.${lot_carb2_id}.defect_ppm == 200000"
            - "Supplier.${sup_carb_id}.rolling_defect_ppm == 40000 (POOLED: 2 defects / 50 sampled pieces)"
            - "GET /suppliers/${sup_carb_id}/scorecard -> data.scorecard_average_ppm == 100000 (PER_LOT_AVERAGE: (0 + 200000)/2)"
            - "${average_ppm} == 2.5 * ${pooled_ppm}"
            - "Supplier.${sup_carb_id}.approval_status == PROBATION (pooled 40000 > PPM_PROBATION_THRESHOLD 25000, and not > PPM_SUSPEND_THRESHOLD 100000)"
            - "Supplier.${sup_carb_id}.incoming_inspection_level == TIGHTENED"
            - "Supplier.${sup_carb_id}.consecutive_accepted_lots == 0"
            - "Supplier.${sup_carb_id}.inspected_lot_count == 2"

      - name: deterioration_extrapolation_scaling_diverges_per_variant
        grounds:
          - calculations.deterioration_factor_and_certified_emission
          - entities.DurabilityTestRun.fields.extrapolated
          - entities.DurabilityTestRun.fields.accumulated_hours
        distinguishing_aspect: |
          Variant SELECTION under extrapolation: a run stopped at 250 of the family's
          500 durability hours scales by 2.0, but a ratio scales around 1 while an
          offset scales around 0 — MULTIPLICATIVE gives 1 + (1.28 - 1) * 2 = 1.5600
          (certified 6.24, margin 22.00) whereas ADDITIVE gives 1.40 * 2 = 2.8000
          (certified 6.80, margin 15.00). The additive family loses 7.00 more margin
          points on the same shortfall, so the divergence is not a constant offset.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "Family 2027-EPA-208XT (EPA_PHASE3) on platform 208XT-E and family 2027-CARB-208XT (CARB_2024) on platform 208XT-C; both 500 durability hours, limit 8.00, declared baseline 4.00."
            - "Each family has one SCHEDULED run with initial_emission_g_per_kwh 5.00 on its own platform."
          setup_api_calls:
            - *a_clock
            - call: "POST /certification-families"
              payload: { family_code: "2027-EPA-208XT", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_xt_id: $.data.id, fam_xt_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_xt_id}", platform_code: "208XT-E", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_xt_id: $.data.id }
            - call: "POST /certification-families"
              payload: { family_code: "2027-CARB-208XT", model_year: 2027, emission_standard: "CARB_2024", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_xtc_id: $.data.id, fam_xtc_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_xtc_id}", platform_code: "208XT-C", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_xtc_id: $.data.id }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_xt_id}", engine_platform_id: "${plat_xt_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_xt_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_xt_id: $.data.id }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_xtc_id}", engine_platform_id: "${plat_xtc_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_xtc_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_xtc_id: $.data.id }
          trigger:
            - call: "POST /durability-tests/${dur_xt_id}/complete"
              payload: { accumulated_hours: 250, final_emission_g_per_kwh: 6.40 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /durability-tests/${dur_xtc_id}/complete"
              payload: { accumulated_hours: 250, final_emission_g_per_kwh: 6.40 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
          assert:
            - "DurabilityTestRun.${dur_xt_id}.extrapolated == true"
            - "DurabilityTestRun.${dur_xt_id}.computed_deterioration_factor == 1.5600"
            - "CertificationFamily.${fam_xt_id}.certified_emission_g_per_kwh == 6.24"
            - "CertificationFamily.${fam_xt_id}.compliance_margin_pct == 22.00"
            - "DurabilityTestRun.${dur_xtc_id}.extrapolated == true"
            - "DurabilityTestRun.${dur_xtc_id}.computed_deterioration_factor == 2.8000"
            - "CertificationFamily.${fam_xtc_id}.certified_emission_g_per_kwh == 6.80"
            - "CertificationFamily.${fam_xtc_id}.compliance_margin_pct == 15.00"
            - "both families remain DURABILITY_COMPLETE and both stay under the 8.00 limit, so the divergence is observable without a rejection"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes {(a),(b),(c)}
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: carry_cost_tier_selection_non_linear_in_quantity
        grounds:
          - calculations.build_carry_cost
          - entities.BuildOrder.fields.carry_rate
          - entities.BuildOrder.fields.carry_cost_cents
          - entities.BuildOrder.fields.total_committed_cents
          - state_machines.BuildOrder.PLANNED
        distinguishing_aspect: |
          MODE (a) — four interacting inputs (planned_quantity, model.standard_cost_cents,
          production_week vs SEASON_START[product_line], week_span) feed a tiered-rate
          selection, so the carry cost is NON-LINEAR in quantity: 600 units carry at
          0.0030 (907200 cents = 1512 cents/unit) while 1000 units cross
          CARRY_TIER_2_CEILING and carry at 0.0020 (1008000 cents = 1008 cents/unit).
          The per-unit carry cost DROPS as the order grows, which no linear formula
          reproduces.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "Family 2027-EPA-208SS with platform 208SS (certification not required to PLAN an order)."
            - "Model WM-21-BBC (WALK_MOWER, DUAL, standard_cost_cents 21000) with a valid PASSED safety certification, RELEASED."
            - "Three RUNNING lines each of 500 units/week capacity: L1, L-CARRY-M, L-CARRY-L — one per order, so no aggregate-capacity interaction leaks into this instance."
            - "Order bo (6 units, PRE_SEASON, week 2026-09-14, span 2) already planned on L1: SEASON_START[WALK_MOWER] 2027-03-01 gives floor(169/7) = 24 carry weeks."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - &a_model
              call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-21-BBC", product_line: "WALK_MOWER", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 0.55, dealer_cap_units: 500, mass_retail_cap_units: 500 }
              as: PlantAdmin
              captures: { model_id: $.data.id }
            - &a_safety
              call: "POST /safety-certifications"
              payload: { product_model_id: "${model_id}", standard_code: "ANSI_B71_1", blade_stop_time_ms: 2600, opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2027-07-15" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { safety_id: $.data.id }
            - &a_model_release
              call: "POST /product-models/${model_id}/release"
              payload: {}
              as: PlantAdmin
            - &a_line
              call: "POST /assembly-lines"
              payload: { line_code: "L1", supported_product_lines: ["WALK_MOWER", "SNOW_THROWER"], weekly_capacity_units: 500, changeover_gap_weeks: 1, status: "RUNNING" }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /assembly-lines"
              payload: { line_code: "L-CARRY-M", supported_product_lines: ["WALK_MOWER"], weekly_capacity_units: 500, changeover_gap_weeks: 1, status: "RUNNING" }
              as: PlantAdmin
              captures: { line_m_id: $.data.id }
            - call: "POST /assembly-lines"
              payload: { line_code: "L-CARRY-L", supported_product_lines: ["WALK_MOWER"], weekly_capacity_units: 500, changeover_gap_weeks: 1, status: "RUNNING" }
              as: PlantAdmin
              captures: { line_l_id: $.data.id }
            - &a_bo
              call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 6 }
              as: ProductionPlanner
              captures: { bo_id: $.data.id, bo_v1: $.data.version }
          trigger:
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_m_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 600 }
              as: ProductionPlanner
              captures: { bo_m_id: $.data.id }
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_l_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 1000 }
              as: ProductionPlanner
              captures: { bo_l_id: $.data.id }
          assert:
            - "BuildOrder.${bo_id}.build_value_cents == 126000"
            - "BuildOrder.${bo_id}.carry_weeks == 24"
            - "BuildOrder.${bo_id}.carry_rate == 0.0040 (build_value < CARRY_TIER_1_CEILING 5000000)"
            - "BuildOrder.${bo_id}.carry_cost_cents == 12096"
            - "BuildOrder.${bo_id}.total_committed_cents == 138096"
            - "BuildOrder.${bo_m_id}.build_value_cents == 12600000"
            - "BuildOrder.${bo_m_id}.carry_rate == 0.0030"
            - "BuildOrder.${bo_m_id}.carry_cost_cents == 907200"
            - "BuildOrder.${bo_m_id}.total_committed_cents == 13507200"
            - "BuildOrder.${bo_l_id}.build_value_cents == 21000000"
            - "BuildOrder.${bo_l_id}.carry_rate == 0.0020 (>= CARRY_TIER_2_CEILING 20000000)"
            - "BuildOrder.${bo_l_id}.carry_cost_cents == 1008000"
            - "BuildOrder.${bo_l_id}.total_committed_cents == 22008000"
            - "carry cost per unit falls as the order grows: 12096/6 == 2016.0, 907200/600 == 1512.0, 1008000/1000 == 1008.0 cents"
            - "all three orders are PLANNED with allocation_status UNALLOCATED and staged_quantity 0"

      - name: channel_waterfall_floor_then_remainder_rounding_order
        grounds:
          - calculations.channel_allocation_waterfall
          - entities.BuildOrder.fields.allocated_dealer_units
          - entities.BuildOrder.fields.allocated_mass_retail_units
          - entities.BuildOrder.fields.unallocated_units
          - concurrency_rules[allocation-run-stale-build-order]
          - state_machines.EngineUnit.HOT_TESTED_to_RELEASED
        distinguishing_aspect: |
          MODE (b) — nested rounding where the ORDER is pinned: both raw shares are
          FLOORED first (3 * 0.55 = 1.65 -> 1, 3 * 0.45 = 1.35 -> 1) and the single
          remaining unit then goes to the larger fractional part (0.65 > 0.35 -> DEALER),
          never by row id. Rounding each share independently (round(1.65) + round(1.35)
          = 2 + 1) happens to agree here, but "round then cap" instead of "cap after
          remainder" would not: the pinned order is floor -> remainder -> mass cap ->
          dealer cap.
        test_recipe:
          setup:
