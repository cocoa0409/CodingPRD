            - call: "POST /geo-orgs/${org2}/transition"
              payload: { target_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /geo-orgs/license-grants/${grant2}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org2_v0}" }
              as: LicenseAdmin
          trigger:
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org_id}", username: "ada", email: "ada2@meridian.example", named_user_level: "VIEWER", home_license_grant_id: "${grant_named_id}" }
              as: LicenseAdmin
              captures: { err_dup: $.data.error_id }
            - call: "POST /geo-orgs/named-users"
              payload: { organization_id: "${org2}", username: "ada", email: "ada@other.example", named_user_level: "VIEWER", home_license_grant_id: "${grant2}" }
              as: LicenseAdmin
          assert:
            - "same-org duplicate returns 409 err_dup == ERR_DUPLICATE_VALUE"
            - "cross-org same username succeeds (201)"

      - name: derived_field_reconciles_after_reverse_and_settle
        claim_type: derived_field_reconciliation
        grounds: [entities.Organization.fields.credit_balance, entities.CreditPool.fields.posture]
        distinguishing_aspect: "credit_balance and posture stay consistent with the source fields across the full lifecycle: after reserve (balance drops, posture LOW_CREDIT), after reverse (restored), after settle (consumed replaces reserved)."
        test_recipe:
          setup: ["Base chain; pool capacity 1000 (threshold 500); key."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org, *c_act_grant, *c_user, *c_accept, *c_key]
          trigger:
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 150, idempotency_key: "dr-1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { b1: $.data.id }
            - call: "GET /geo-orgs/${org_id}"
              payload: {}
              as: BillingAdmin
              captures: { bal_reserved: $.data.credit_balance }
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v: "$.data[0].version" }
            - call: "POST /geo-orgs/credit-batches/${b1}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
            - call: "GET /geo-orgs/${org_id}"
              payload: {}
              as: BillingAdmin
              captures: { bal_settled: $.data.credit_balance }
          assert:
            - "bal_reserved == 450 (1000 - 550; 150 units = 400 + 50*3 = 550 reserved)"
            - "bal_settled == 450 (settle in period 0: consumed 550 replaces reserved 550 — no drift between reserved and settled views)"
            - "posture is LOW_CREDIT in both reads (450 < 500)"
            - "Organization.credit_balance always equals capacity - consumed - reserved"
