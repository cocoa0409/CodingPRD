      - name: casing_credit_uses_default_rate_without_active_agreement
        claim_type: Constants Applied
        grounds:
          - calculations.casing_credit_accrual.constants.DEFAULT_CASING_CREDIT_CENTS
          - calculations.casing_credit_accrual.constants.GRADE_FACTOR_A
          - entities.FleetAccount.fields.casing_credit_balance_cents
        distinguishing_aspect: "With no ACTIVE agreement covering the clock date the accrual falls back to DEFAULT_CASING_CREDIT_CENTS 12000 rather than failing or accruing zero, and a DRAFT agreement with a different rate must NOT be picked up — only ACTIVE agreements count."
        test_recipe:
          setup:
            - "one fleet with a DRIVE policy and a DRAFT (never activated) agreement whose casing_credit_rate_cents is 30000"
            - "one casing collected, ready for grading at A"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Constant Commercial", location_code: "CNC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4019", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Constant Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "CNS-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.20, casing_credit_rate_cents: 30000, emergency_response_minutes: 60, emergency_labor_rate_cents_per_hour: 20000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4019", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
          trigger:
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casing_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
          assert:
            - "NationalAgreement.${agr_id}.status == \"DRAFT\" at trigger time"
            - "the ACCRUAL entry's amount_cents == 12000 (DEFAULT_CASING_CREDIT_CENTS * GRADE_FACTOR_A 1.00 * decay 1.00), NOT 30000"
            - "Casing.${casing_id}.provisional_credit_cents == 12000 and FleetAccount.${fleet_id}.casing_credit_balance_cents == 12000"
            - "Casing.${casing_id}.status == \"INSPECTED\", inspection_grade == \"A\", inspected_by_user_id == \"inspector-1\""

      - name: technician_dispatch_selector_picks_by_rank_then_load
        claim_type: Correct Result
        grounds:
          - calculations.technician_dispatch_selector
          - endpoints.POST_/road-service-calls/{call_id}/dispatch
          - entities.Technician.fields.completed_call_count
        distinguishing_aspect: "With technician_id omitted on an EMERGENCY call the selector must filter to TIA_CERTIFIED only, then rank by certification then by ASCENDING completed_call_count, and only then fall back to created_at. The busy TIA technician was created FIRST, so a created_at-only implementation picks the wrong one."
        test_recipe:
          setup:
            - "one location with three technicians created in this order: T1 LEVEL_1, T2 TIA_CERTIFIED, T3 TIA_CERTIFIED"
            - "T2 has completed one call, so completed_call_count is 1 while T3's is 0"
            - "a second EMERGENCY call is then opened with no technician named"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Selector Commercial", location_code: "SLC2", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4020", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Selector Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-118", vehicle_type: "TRACTOR", current_odometer_miles: 7000 }
              as: DealerAdmin
              captures: { veh1_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-119", vehicle_type: "TRACTOR", current_odometer_miles: 8000 }
              as: DealerAdmin
              captures: { veh2_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Sel One", certification_level: "LEVEL_1" }
              as: DealerAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Sel Two", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech2_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Sel Three", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech3_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh1_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "First job", reported_at: "2026-08-19T12:00:00Z" }
              as: DispatchCoordinator
              captures: { call1_id: $.data.id }
            - call: "POST /road-service-calls/${call1_id}/dispatch"
              payload: { dispatched_at: "2026-08-19T12:05:00Z", dispatch_miles: 3, technician_id: "${tech2_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call1_id}/arrive"
              payload: { arrived_at: "2026-08-19T12:30:00Z" }
              as: TireTechnician
              as_user_id: "${tech2_id}"
            - call: "POST /road-service-calls/${call1_id}/complete"
              payload: { closed_at: "2026-08-19T13:00:00Z", labor_hours: 0.25 }
              as: TireTechnician
              as_user_id: "${tech2_id}"
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh2_id}", service_location_id: "${loc_id}", priority: "EMERGENCY", complaint: "Second job", reported_at: "2026-08-19T14:00:00Z" }
              as: DispatchCoordinator
              captures: { call2_id: $.data.id }
          trigger:
            - call: "POST /road-service-calls/${call2_id}/dispatch"
              payload: { dispatched_at: "2026-08-19T14:10:00Z", dispatch_miles: 12 }
              as: DispatchCoordinator
          assert:
            - "before the trigger Technician.${tech2_id}.completed_call_count == 1, Technician.${tech3_id}.completed_call_count == 0, and both are AVAILABLE"
            - "RoadServiceCall.${call2_id}.technician_id == ${tech3_id}"
            - "the LEVEL_1 technician ${tech1_id} was filtered out entirely by the EMERGENCY certification predicate"
            - "${tech2_id} lost on completed_call_count ASC despite being created earlier, so created_at is a tie-break only"
            - "Technician.${tech3_id}.status == \"ON_CALL\" and Vehicle.${veh2_id}.status == \"OUT_OF_SERVICE\""

