              as: Parent
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "setup invariant: SupportPackage.${pkg_id}.remaining_calls == 0 (captured rem_calls) so the quota check would also fail"
            - "response error_id == ERR_SCHEDULING_CONFLICT (HTTP 409), NOT ERR_ENTITLEMENT_EXHAUSTED — temporal priority 7 beats quota priority 9"
            - "SupportPackage.${pkg_id}.version unchanged by the rejected booking"

