  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (two different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: attestation_rejection_revision_loop
        grounds:
          - state_machines.DirectionAttestation.REJECTED_to_SUBMITTED
          - state_machines.DirectionAttestation.SUBMITTED_to_REJECTED
          - entities.DirectionAttestation.fields.submitted_count
          - entities.DirectionAttestation.fields.rejection_reason
        distinguishing_aspect: |
          DirectionAttestation is cyclic: SUBMITTED -> REJECTED -> SUBMITTED is a
          revision loop (not a linear pipeline), and each pass through the loop
          increments submitted_count while clearing rejection_reason; the sibling
          instance exercises a BillingClaim cycle — a different entity.
        test_recipe:
          setup:
            - "Site S; fee P100; physicians D and D2 (2027 creds); roster 2026-08-10 PUBLISHED; case [540,600)"
            - "DirectionAttestation for (case, D) freshly created: IN_PROGRESS, submitted_count == 0"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Direct", provider_type: "ANESTHESIOLOGIST", npi: "1000000002", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Peer", provider_type: "ANESTHESIOLOGIST", npi: "1000000005", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d2_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 0, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /anesthesia-ops/attestations"
              payload: { case_id: "${case_id}", physician_id: "${d_id}" }
              as: Scheduler
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/attestations/${att_id}/submit"
              payload: { step_preanesthetic_exam: true, step_prescribes_plan: true, step_participates_key_portions: true, step_ensures_qualified_personnel: true, step_monitors_course: true, step_available_for_emergencies: true, step_post_anesthesia_care: true }
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
              captures: { sc1: $.data.submitted_count }
            - call: "POST /anesthesia-ops/attestations/${att_id}/reject"
              payload: { rejection_reason: "MISSING_INDUCTION_DETAIL" }
              as: AttendingAnesthesiologist
              as_user_id: "${d2_id}"
              captures: { st_rej: $.data.status, rr: $.data.rejection_reason }
            - call: "POST /anesthesia-ops/attestations/${att_id}/submit"
              payload: { step_preanesthetic_exam: true, step_prescribes_plan: true, step_participates_key_portions: true, step_ensures_qualified_personnel: true, step_monitors_course: true, step_available_for_emergencies: true, step_post_anesthesia_care: true }
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
              captures: { sc2: $.data.submitted_count, st_resub: $.data.status, rr2: $.data.rejection_reason }
            - call: "POST /anesthesia-ops/attestations/${att_id}/verify"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${d2_id}"
              captures: { st_fin: $.data.status }
          assert:
            - "${sc1} == 1 and status SUBMITTED after first submit"
            - "After reject: status == REJECTED, rejection_reason == 'MISSING_INDUCTION_DETAIL'"
            - "After resubmission (REJECTED -> SUBMITTED cycle): ${sc2} == 2, status == SUBMITTED, rejection_reason == null (cleared on resubmit)"
            - "After peer verify: status == VERIFIED (terminal)"

      - name: claim_denial_resubmission_loop
        grounds:
          - state_machines.BillingClaim.DENIED_to_READY
          - state_machines.BillingClaim.SUBMITTED_to_DENIED
          - entities.BillingClaim.fields.resubmission_count
        distinguishing_aspect: |
          BillingClaim is cyclic: SUBMITTED -> DENIED -> READY is a resubmission
          loop on a different entity than DirectionAttestation; each loop
          increments resubmission_count and clears denial_reason without
          recomputing charge_cents.
        test_recipe:
          setup:
            - "Site S; fee P400 base_units=4, max 1000000; MD physician (2027 creds)"
            - "Roster 2026-08-10 (slots 1, day_end 1200) PUBLISHED; case P400 [540,600); MD primary CONFIRMED"
            - "Case started 09:00 and completed 10:30 (actual 90 min -> 6.0 time units -> 10.0 units -> PERSONAL claim 80000 cents, DRAFT)"
            - "Roster LOCKED (case terminal) so claims may be submitted"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P400", base_units: 4, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Avery", provider_type: "ANESTHESIOLOGIST", npi: "1000000001", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P400", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${md_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${md_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:30:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}" }
              as: Scheduler
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/lock"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /anesthesia-ops/claims/${claim_id}/mark-ready"
              payload: {}
              as: BillingSpecialist
            - call: "POST /anesthesia-ops/claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /anesthesia-ops/claims/${claim_id}/record-denial"
              payload: { denial_reason: "MISSING_DOCUMENTATION" }
              as: BillingSpecialist
              captures: { st_den: $.data.status }
            - call: "POST /anesthesia-ops/claims/${claim_id}/mark-ready"
              payload: {}
              as: BillingSpecialist
              captures: { rc: $.data.resubmission_count, dr: $.data.denial_reason, st_re: $.data.status }
            - call: "POST /anesthesia-ops/claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /anesthesia-ops/claims/${claim_id}/record-payment"
              payload: { paid_amount_cents: 80000 }
              as: BillingSpecialist
              captures: { st_paid: $.data.status, paid: $.data.paid_amount_cents }
          assert:
            - "After DENIED -> READY resubmission: resubmission_count == 1, denial_reason == null, status == READY"
            - "charge_cents unchanged == 80000 across the denial/resubmission loop (no recomputation on resubmission)"
            - "After second submit + record-payment: status == PAID (terminal), paid_amount_cents == 80000"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two different triggering transitions)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: case_completion_cascade_to_audit_scores
        grounds:
          - state_machines.AnesthesiaCase.IN_PROGRESS_to_COMPLETED
          - state_machines.CaseAssignment.CONFIRMED_to_COMPLETED
          - calculations.modifier_determination
          - calculations.compliance_risk_score
        distinguishing_aspect: |
          Depth-3 cascade originating at POST /cases/{id}/complete: completion
          auto-creates the TEFRA_GAP AuditFinding (creating the roster's OPEN
          ComplianceAudit because none exists); that finding creation itself
          triggers the audit's period_score recompute; the score recompute
          re-derives risk_band. Sibling cascade originates at the credentials
          PATCH — a different triggering transition.
        test_recipe:
          setup:
            - "Site S; fee P100 base_units=5; D (ANESTHESIOLOGIST), C1 (CRNA), both 2027 creds"
            - "Roster 2026-08-10 (slots 1, day_end 1020) PUBLISHED; case [540,660) P1"
            - "C1 CASE_PRIMARY CONFIRMED; D CASE_DIRECTING CONFIRMED; NO attestation for (case, D)"
            - "Case started at 09:00 (540); clock advanced to 11:00 (660)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Direct", provider_type: "ANESTHESIOLOGIST", npi: "1000000002", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${c1_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_p: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_p}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${c1_id}"
            - call: "GET /anesthesia-ops/cases/${case_id}"
              as: Scheduler
              captures: { case_v2: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${d_id}", assignment_role: "CASE_DIRECTING", expected_case_version: "${case_v2}" }
              as: Scheduler
              captures: { asg_d: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_d}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
              captures: { final_charge: $.data.final_charge_cents }
            - call: "GET /anesthesia-ops/assignments"
              payload: { case_id: "${case_id}" }
              as: Scheduler
              captures: { a0_status: "$.data[0].status", a1_status: "$.data[1].status" }
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}", provider_id: "${c1_id}" }
              as: Scheduler
              captures: { prim_mod: "$.data[0].modifier_code", prim_charge: "$.data[0].charge_cents" }
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}", provider_id: "${d_id}" }
              as: Scheduler
              captures: { phys_mod: "$.data[0].modifier_code", phys_units: "$.data[0].units_total", phys_charge: "$.data[0].charge_cents" }
            - call: "GET /anesthesia-ops/audits"
              payload: { roster_id: "${roster_id}" }
              as: ComplianceAuditor
              captures: { audit_id: "$.data[0].id", audit_rt: "$.data[0].realtime_score", audit_ps: "$.data[0].period_score", audit_band: "$.data[0].risk_band" }
            - call: "GET /anesthesia-ops/findings"
              payload: { audit_id: "${audit_id}" }
              as: ComplianceAuditor
              captures: { f_type: "$.data[0].finding_type", f_sev: "$.data[0].severity", f_status: "$.data[0].status", f_case: "$.data[0].case_id" }
          assert:
            - "Hop 1: both CaseAssignments (CONFIRMED primary + CONFIRMED directing) transitioned to COMPLETED"
            - "Hop 2a: primary claim modifier QZ charge_cents == 97500 (13.0 units x CRNA_SOLO 7500); physician claim modifier AD, units_total == 3.0, charge_cents == 12000 (AD_FLAT 3 x SUPERVISION_CF 4000, no time units) because the attestation is missing"
            - "Hop 2b: AnesthesiaCase.final_charge_cents == 109500 == 97500 + 12000"
            - "Hop 3: exactly one AuditFinding TEFRA_GAP / MAJOR / OPEN linked to case ${case_id} on the auto-created OPEN audit"
            - "Hop 4: audit.period_score == 30 (MAJOR weight; case COMPLETED -> terminal bucket), realtime_score == 0, risk_band == ELEVATED (20 <= 30 < 50)"

      - name: credential_shorten_cascade_to_audit_scores
        grounds:
          - entities.Provider.fields.credential_expires_on
          - entities.AuditFinding.fields.finding_type
          - calculations.compliance_risk_score
          - calculations.audit_scan
        distinguishing_aspect: |
          Depth-2+ cascade originating at PATCH /providers/{id}/credentials
          (different trigger than case completion): shortening a provider's
          expiry below confirmed service dates raises one CREDENTIAL_LAPSE
          finding per exposed PROPOSED/CONFIRMED assignment; each finding
          creation triggers the (auto-created) OPEN audit's score recompute,
          which re-derives risk_band.
        test_recipe:
          setup:
            - "Site S; fee P100; CRNA P3 with credential/DEA expiry 2026-08-15 (valid for service date 2026-08-10 at assignment time)"
            - "Roster 2026-08-10 (slots 2, day_end 1200) PUBLISHED; case1 [600,660) and case2 [700,760), each with a PROPOSED P3 CASE_PRIMARY assignment (disjoint intervals)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna Three", provider_type: "CRNA", npi: "1000000006", credential_expires_on: "2026-08-15", dea_expires_on: "2026-08-15" }
              as: GroupAdministrator
              captures: { p3_id: $.data.id, p3_ver: $.data.version }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 2, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 600, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { c1_id: $.data.id, c1_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${c1_id}/assignments"
              payload: { provider_id: "${p3_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${c1_ver}" }
              as: Scheduler
              captures: { a1_id: $.data.id }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 700, scheduled_end_minute: 760 }
              as: Scheduler
              captures: { c2_id: $.data.id, c2_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${c2_id}/assignments"
              payload: { provider_id: "${p3_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${c2_ver}" }
              as: Scheduler
              captures: { a2_id: $.data.id }
          trigger:
            - call: "PATCH /anesthesia-ops/providers/${p3_id}/credentials"
              payload: { credential_expires_on: "2026-08-08", dea_expires_on: "2026-08-08", expected_provider_version: "${p3_ver}" }
              as: GroupAdministrator
              captures: { p3_ver_after: $.data.version, p3_status: $.data.status }
            - call: "GET /anesthesia-ops/audits"
              payload: { roster_id: "${roster_id}" }
              as: ComplianceAuditor
              captures: { audit_id: "$.data[0].id", audit_rt: "$.data[0].realtime_score", audit_ps: "$.data[0].period_score", audit_band: "$.data[0].risk_band" }
            - call: "GET /anesthesia-ops/findings"
              payload: { audit_id: "${audit_id}", finding_type: "CREDENTIAL_LAPSE" }
              as: ComplianceAuditor
              captures: { f0_asg: "$.data[0].assignment_id", f1_asg: "$.data[1].assignment_id" }
          assert:
            - "Provider.${p3_id}.version incremented exactly once by the patch (no suspension: 2026-08-08 >= default clock date 2026-08-01, status stays ACTIVE)"
            - "Hop 1: two OPEN CREDENTIAL_LAPSE findings (severity MINOR), one per exposed PROPOSED assignment ${a1_id} and ${a2_id}, on a single auto-created OPEN audit for the roster"
            - "Hop 2: audit.realtime_score == 20 (2 x MINOR 10; both cases SCHEDULED -> non-terminal bucket), period_score == 0, risk_band == LOW (period < 20)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: duplicate_claim_beats_charge_max
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_DUPLICATE_CLAIM]
          - errors[ERR_CHARGE_EXCEEDS_MAX]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 8 duplicate guard)
          vs business_fiscal (priority 11 contracted-max): the second mark-ready
          violates BOTH (a READY sibling claim exists AND 72000 > 50000) and must
          surface ERR_DUPLICATE_CLAIM (409), proving referential-before-fiscal
          ordering. Sibling instance exercises auth vs business_safety.
        test_recipe:
          setup:
            - "Site S; fee P500 base_units=5, contracted_max_cents initially 1000000; MD physician (2027 creds)"
            - "Roster 2026-08-10 PUBLISHED; case [540,600); MD primary CONFIRMED; case completed 09:00->10:00 (60 min -> 9.0 units -> PERSONAL claim 72000 cents, DRAFT)"
            - "Manual second DRAFT claim created for the same (case, provider) via POST /claims (duplicates allowed at creation)"
            - "First claim marked READY; then fee-schedule contracted_max_cents amended DOWN to 50000 (below both claims' 72000)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P500", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
              captures: { fee_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Avery", provider_type: "ANESTHESIOLOGIST", npi: "1000000001", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P500", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${md_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${md_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}" }
              as: Scheduler
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /anesthesia-ops/claims"
              payload: { case_id: "${case_id}", provider_id: "${md_id}" }
              as: BillingSpecialist
              captures: { c2_id: $.data.id }
            - call: "POST /anesthesia-ops/claims/${c1_id}/mark-ready"
              payload: {}
              as: BillingSpecialist
            - call: "PATCH /anesthesia-ops/fee-schedules/${fee_id}"
              payload: { contracted_max_cents: 50000 }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/claims/${c2_id}/mark-ready"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with error_id ERR_DUPLICATE_CLAIM — NOT 402 ERR_CHARGE_EXCEEDS_MAX, although charge_cents 72000 > amended contracted_max_cents 50000 also holds"
            - "BillingClaim.${c2_id} remains DRAFT"

      - name: ownership_mismatch_beats_tefra_incomplete
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_OWNERSHIP_MISMATCH]
          - errors[ERR_TEFRA_STEPS_INCOMPLETE]
        distinguishing_aspect: |
          Error-category pair auth (priority 5 ownership / segregation of duties)
          vs business_safety (priority 12 TEFRA completeness): a non-owner
          physician submitting with all seven steps false must receive
          ERR_OWNERSHIP_MISMATCH (403), not ERR_TEFRA_STEPS_INCOMPLETE (422) —
          the §1.4 priority-12 note pins exactly this order.
        test_recipe:
          setup:
            - "Site S; fee P100; physicians D and D2 (2027 creds); roster 2026-08-10 PUBLISHED; case [540,600)"
            - "DirectionAttestation for (case, physician D) exists in IN_PROGRESS"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Direct", provider_type: "ANESTHESIOLOGIST", npi: "1000000002", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Peer", provider_type: "ANESTHESIOLOGIST", npi: "1000000005", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d2_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 0, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /anesthesia-ops/attestations"
              payload: { case_id: "${case_id}", physician_id: "${d_id}" }
              as: Scheduler
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/attestations/${att_id}/submit"
              payload: { step_preanesthetic_exam: false, step_prescribes_plan: false, step_participates_key_portions: false, step_ensures_qualified_personnel: false, step_monitors_course: false, step_available_for_emergencies: false, step_post_anesthesia_care: false }
              as: AttendingAnesthesiologist
              as_user_id: "${d2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 403 with error_id ERR_OWNERSHIP_MISMATCH — NOT 422 ERR_TEFRA_STEPS_INCOMPLETE, although all seven step booleans are false"
            - "DirectionAttestation.${att_id} remains IN_PROGRESS with submitted_count == 0"
  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: standby_notice_exactly_120_partial_119_full
        grounds:
          - calculations.standby_pay
          - entities.AnesthesiaCase.fields.cancellation_notice_minutes
        distinguishing_aspect: |
          Boundary on the cancellation-notice-minutes metric via POST
          /cases/{id}/cancel: notice exactly 120 takes the >= 120 branch
          (PARTIAL 15000), notice 119 takes the < 120 branch (FULL 30000).
          Sibling instance probes the rest-gap metric via a different endpoint.
        test_recipe:
          setup:
            - "Site S with StipendAgreement covering 2026-08-10 (standby_full 30000, standby_partial 15000, late_stay_rate 50, call 12000)"
            - "CRNA P (2027 creds); roster 2026-08-10 (slots 2, day_end 1200) PUBLISHED"
            - "Case A [600,660) and case B [700,760), each with CASE_PRIMARY P CONFIRMED (disjoint intervals)"
            - "Logical clock at 2026-08-10T08:00:00Z (minute 480)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/stipend-agreements"
              payload: { site_id: "${site_id}", effective_from: "2026-08-10", effective_to: "2026-08-10", call_stipend_cents: 12000, late_stay_rate_cents_per_minute: 50, standby_full_cents: 30000, standby_partial_cents: 15000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 2, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 600, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { ca_id: $.data.id, ca_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${ca_id}/assignments"
              payload: { provider_id: "${p_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${ca_ver}" }
              as: Scheduler
              captures: { aag_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${aag_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${p_id}"
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 700, scheduled_end_minute: 760 }
              as: Scheduler
              captures: { cb_id: $.data.id, cb_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${cb_id}/assignments"
              payload: { provider_id: "${p_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${cb_ver}" }
              as: Scheduler
              captures: { abg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${abg_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${p_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/cases/${ca_id}/cancel"
              payload: { cancellation_reason: "PATIENT_NPO_VIOLATION" }
              as: Scheduler
              captures: { ca_notice: $.data.cancellation_notice_minutes }
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:41:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${cb_id}/cancel"
              payload: { cancellation_reason: "PATIENT_NPO_VIOLATION" }
              as: Scheduler
              captures: { cb_notice: $.data.cancellation_notice_minutes }
          assert:
            - "Case A: cancellation_notice_minutes == 120 (600 - 480) and the created STANDBY entry has amount_cents == 15000 == standby_partial_cents (exactly 120 takes the >= 120 branch, NOT the full tier)"
            - "Case B: cancellation_notice_minutes == 119 (700 - 581) and the created STANDBY entry has amount_cents == 30000 == standby_full_cents (119 < 120)"
            - "Both entries applied in full (bucket total 45000 <= 50000 daily cap): applied_amount_cents == amount_cents for each"

      - name: rest_buffer_exactly_480_allowed_479_rejected
        grounds:
          - calculations.rest_buffer_check
          - errors[ERR_INSUFFICIENT_REST]
        distinguishing_aspect: |
          Boundary on the rest-gap-minutes metric via POST
          /cases/{id}/assignments: gap exactly 480 == REST_MINUTES is allowed
          (rejection only when strictly less), gap 479 is rejected. Different
          metric and different endpoint than the standby-notice instance.
        test_recipe:
          setup:
            - "Site S; fee P100; CRNA P (2027 creds); roster 2026-08-10 (slots 2, day_end 1200) PUBLISHED"
            - "P holds a CallAssignment window [0,480] on the roster (closed interval, end minute 480)"
            - "Case A scheduled [960,1020) (gap 960 - 480 == 480); case B scheduled [900,959) (gap 900 - 480 == 420 < 480; [900,959) is adjacent-but-disjoint from case A's interval)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 2, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/call-assignments"
              payload: { roster_id: "${roster_id}", provider_id: "${p_id}", window_start_minute: 0, window_end_minute: 480 }
              as: Scheduler
              captures: { call_id: $.data.id }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 960, scheduled_end_minute: 1020 }
              as: Scheduler
              captures: { ca_id: $.data.id, ca_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 900, scheduled_end_minute: 959 }
              as: Scheduler
              captures: { cb_id: $.data.id, cb_ver: $.data.version }
          trigger:
            - call: "POST /anesthesia-ops/cases/${ca_id}/assignments"
              payload: { provider_id: "${p_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${ca_ver}" }
              as: Scheduler
              captures: { aa_id: $.data.id, aa_status: $.data.status }
            - call: "POST /anesthesia-ops/cases/${cb_id}/assignments"
              payload: { provider_id: "${p_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${cb_ver}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "Case A assignment created (201, status PROPOSED): gap 480 == REST_MINUTES is allowed (reject only when strictly less)"
            - "Case B assignment rejected 409 ERR_INSUFFICIENT_REST: gap 420 < 480"
            - "GET /assignments?case_id=${cb_id} returns an empty list (no assignment materialized)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_accept_gated_by_provider_active
        grounds:
          - state_machines.CaseAssignment.PROPOSED_to_CONFIRMED
          - state_machines.Provider.ACTIVE_to_SUSPENDED
          - errors[ERR_PROVIDER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair CaseAssignment -> Provider: the PROPOSED -> CONFIRMED
          transition is gated on the Provider's status being ACTIVE; a clock
          sweep past the credential expiry flips the Provider to SUSPENDED and
          the accept is rejected even though the credential check itself
          (service_date 2026-08-03 <= expiry 2026-08-05) would still pass.
          Sibling instance gates BillingClaim on DailyRoster — a different pair.
        test_recipe:
          setup:
            - "Site S; fee P100; CRNA P with credential/DEA expiry 2026-08-05"
            - "Roster 2026-08-03 (slots 1, day_end 1200) PUBLISHED; case [540,600); P CASE_PRIMARY PROPOSED (created while 2026-08-03 <= 2026-08-05)"
            - "Logical clock advanced to 2026-08-06T00:00:00Z -> sweep suspends P (2026-08-06 > 2026-08-05)"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2026-08-05", dea_expires_on: "2026-08-05" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-03", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${p_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: GroupAdministrator
          trigger:
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with error_id ERR_PROVIDER_SUSPENDED (Provider sweep flipped status to SUSPENDED before the accept)"
            - "CaseAssignment.${asg_id} remains PROPOSED (GET /assignments/${asg_id})"

      - name: claim_submit_gated_by_roster_locked
        grounds:
          - state_machines.BillingClaim.READY_to_SUBMITTED
          - state_machines.DailyRoster.PUBLISHED_to_LOCKED
          - errors[ERR_ROSTER_NOT_LOCKED]
        distinguishing_aspect: |
          Entity pair BillingClaim -> DailyRoster: READY -> SUBMITTED is gated
          on the case's roster being LOCKED; while the roster is PUBLISHED the
          submit is rejected, and only after the roster lock transition does the
          identical request succeed. Different entity pair than
          CaseAssignment -> Provider.
        test_recipe:
          setup:
            - "Site S; fee P100 base_units=5, max 1000000; MD physician (2027 creds)"
            - "Roster 2026-08-10 (slots 1, day_end 1200) PUBLISHED; case [540,600); MD primary CONFIRMED; case completed 09:00->10:00; claim DRAFT -> READY via mark-ready"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Avery", provider_type: "ANESTHESIOLOGIST", npi: "1000000001", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${md_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${md_id}"
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/cases/${case_id}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /anesthesia-ops/claims"
              payload: { case_id: "${case_id}" }
              as: Scheduler
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /anesthesia-ops/claims/${claim_id}/mark-ready"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /anesthesia-ops/claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/lock"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
              captures: { st_sub: $.data.status }
          assert:
            - "First submit rejected 409 ERR_ROSTER_NOT_LOCKED while roster is PUBLISHED"
            - "After POST /rosters/{id}/lock (case COMPLETED -> all terminal), the identical submit succeeds: status == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics + resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: call_window_closed_interval_endpoint_minute_conflict
        grounds:
          - validations[priority=9]
          - entities.CallAssignment.fields.window_end_minute
          - errors[ERR_CALL_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed-interval minute semantics on the CallAssignment resource: two
          windows sharing ANY minute — including a single endpoint minute —
          conflict, and the rule applies per provider per service_date across
          ALL rosters (window B on a different site's roster still collides).
          [600,900] vs [900,1200] conflict; [901,1200] does not. Sibling
          instance uses aggregate-capacity semantics on the directing resource.
        test_recipe:
          setup:
            - "Sites S1 and S2; CRNA P (2027 creds)"
            - "Roster R1 (S1, 2026-08-10) and roster R2 (S2, 2026-08-10), both PUBLISHED"
            - "P holds CallAssignment A on R1, window [600,900]"
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { s1_id: $.data.id }
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "Surgery Center" }
              as: GroupAdministrator
              captures: { s2_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${s1_id}", service_date: "2026-08-10", required_primary_slots: 0, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { r1_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${r1_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${s2_id}", service_date: "2026-08-10", required_primary_slots: 0, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { r2_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${r2_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/call-assignments"
              payload: { roster_id: "${r1_id}", provider_id: "${p_id}", window_start_minute: 600, window_end_minute: 900 }
              as: Scheduler
              captures: { call_a: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/call-assignments"
              payload: { roster_id: "${r2_id}", provider_id: "${p_id}", window_start_minute: 900, window_end_minute: 1200 }
              as: Scheduler
              captures: { err: $.data.error_id }
            - call: "POST /anesthesia-ops/call-assignments"
              payload: { roster_id: "${r2_id}", provider_id: "${p_id}", window_start_minute: 901, window_end_minute: 1200 }
              as: Scheduler
              captures: { call_c: $.data.id, call_c_status: $.data.status }
          assert:
            - "Window [900,1200] on roster R2 rejected 409 ERR_CALL_WINDOW_OVERLAP: closed intervals share endpoint minute 900 (cross-roster, same provider, same service_date)"
            - "Window [901,1200] on roster R2 created (201, SCHEDULED): shares no minute with [600,900]"

      - name: supervision_ratio_capacity_4_allowed_5th_rejected
        grounds:
          - calculations.supervision_ratio_check
          - errors[ERR_SUPERVISION_RATIO_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the physician directing
          resource: half-open directing intervals may overlap pairwise up to
          RATIO_MAX — four fully-overlapping rooms are allowed (peak 4 <= 4) and
          only the fifth (peak 5 > 4) is rejected. This is NOT pairwise
          disjointness: a different geometric treatment than CallAssignment's
          closed-interval rule, on a different resource entity (CaseAssignment
          CASE_DIRECTING capacity).
        test_recipe:
          setup:
            - "Site S; fee P100; physician D (ANESTHESIOLOGIST, 2027 creds)"
            - "Roster 2026-08-10 (slots 0, day_end 1200) PUBLISHED; five cases K1..K5 all scheduled [540,660)"
