      - name: audit_close_is_blocked_while_a_finding_remains_open
        claim_type: conditional_action
        grounds:
          - "validations[priority=55 ERR_OPEN_FINDINGS_BLOCK_CLOSURE]"
          - "state_machines.CertificationAudit.FINDINGS_ISSUED_to_CLOSED_CONFORMING"
          - "state_machines.CertificationAudit.CAR_REVIEW_to_CLOSED_CONFORMING"
          - "endpoints[POST /timberland/certification-audits/{id}/advance]"
        distinguishing_aspect: |
          CLOSE is a conditional action: the SAME call is refused and then accepted with no change
          to its payload, purely because the finding underneath it moved OPEN -> CAR_SUBMITTED ->
          CLOSED. The gate is on open_major_count + open_minor_count, so a single MINOR is enough to
          block closure, and CLOSE must be reachable from CAR_REVIEW as well as FINDINGS_ISSUED.
