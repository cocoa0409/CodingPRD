    - errors[ERR_FORBIDDEN]
    distinguishing_aspect: A Driver acting on the billable surface is refused with ERR_FORBIDDEN, because statement issuance sits in DistrictAdmin's exclusive operation list and never in Driver's shared list.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one district and one vetted ACTIVE driver.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
