  - section: endpoints
    instances:
      - name: written_rows_read_back_identically_through_every_declared_route
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/organizations
          - endpoints.GET_/organizations
          - endpoints.GET_/organizations/{organization_id}
          - endpoints.POST_/filing-records
          - endpoints.GET_/filing-records/{filing_record_id}
          - endpoints.GET_/organizations/{id}/filing-records
        distinguishing_aspect: |
          The catalogue offers exactly three ways to read a row - by id, through its
          parent's sub-resource list, and through the collection list with filters -
          and no PUT, PATCH or DELETE anywhere, so create-plus-read is the whole of
          CRUD in this product. The instance writes two filings that differ only in
          source_kind and then demands that all three routes agree field for field,
          including the optional joint_cost_allocated_cents that one filing omits
          and the other supplies, and that each declared query filter partitions the
          same two rows correctly.
        test_recipe:
          setup:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "FORM_990", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, expected_organization_version: "${org1_v1}" }
              as: OrganizationRep
              as_user_id: "${org1}"
              captures: { f990: $.data.id, f990_status: $.data.status, f990_joint: $.data.joint_cost_allocated_cents }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { org1_v2: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 500000, expected_organization_version: "${org1_v2}" }
              as: OrganizationRep
              as_user_id: "${org1}"
              captures: { faud: $.data.id }
            - call: "GET /filing-records/${faud}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { faud_read_joint: $.data.joint_cost_allocated_cents, faud_read_status: $.data.status, faud_read_version: $.data.version }
            - call: "GET /organizations/${org1}/filing-records?source_kind=FORM_990"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { only990: "$.data[0].id" }
            - call: "GET /organizations/${org1}/filing-records?fiscal_year=2024"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "GET /organizations?org_type=PUBLIC_CHARITY"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { charity_first: "$.data[0].id" }
            - call: "GET /organizations?org_type=PRIVATE_FOUNDATION"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
          assert:
            - "${f990_status} == SUBMITTED and ${f990_joint} == null: joint_cost_allocated_cents is optional and is echoed as null rather than 0 when omitted"
            - "${faud_read_joint} == 500000, ${faud_read_status} == SUBMITTED and ${faud_read_version} == 1: the read by id reproduces the create response exactly"
            - "GET /organizations/${org1}/filing-records with no filter returns total_count == 2, and ${only990} == ${f990} with total_count == 1 under source_kind=FORM_990 - the two filings share (organization_id, fiscal_year) and are separated only by source_kind"
            - "GET /organizations/${org1}/filing-records?fiscal_year=2024 returns total_count == 0 with an empty data array and has_more == false, not a 404"
            - "${charity_first} == ${org1} with total_count == 1, while org_type=PRIVATE_FOUNDATION returns total_count == 0: the filter reads the stored enum and does not fall back to returning everything"
            - "No update or delete route exists for either entity in §1.5: an Organization's ein and an unvalidated filing's figures can only be changed through the correction workflow, which is why the OCC version on Organization is the only mutation channel a client sees"
      - name: disposing_each_comment_walks_the_unresolved_ledger_down_to_the_adoption_gate
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/public-comments/{public_comment_id}/dispose
          - endpoints.POST_/methodology-versions/{methodology_version_id}/adopt
          - entities.MethodologyVersion.fields.unresolved_comment_count
          - entities.PublicComment.fields.status
          - validations[priority=24]
        distinguishing_aspect: |
          dispose is the smallest action endpoint in the catalogue and every one of
          its three declared side effects lands on a different row: the comment's
          own status, the parent version's unresolved_comment_count, and two
          separate version counters. The instance disposes one comment each way,
          watches the ledger fall 2 -> 1 -> 0 while comment_count stays pinned at 2,
          and then proves the ledger is load-bearing by adopting the version, which
          priority 24 would have refused a call earlier.
        test_recipe:
          setup:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /public-comments"
              payload: { methodology_version_id: "${m1}", commenter_kind: "DONOR", body: "Publish the sensitivity analysis behind the weights" }
              as: PublicUser
              as_user_id: "public-1"
              captures: { pc1: $.data.id }
            - call: "POST /public-comments"
              payload: { methodology_version_id: "${m1}", commenter_kind: "RATED_ORGANIZATION", body: "Small charities cannot supply a third-party evaluation" }
              as: OrganizationRep
              as_user_id: "org-rep-1"
              captures: { pc2: $.data.id }
            - call: "GET /methodology-versions/${m1}"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { unresolved_before: $.data.unresolved_comment_count, mv_before: $.data.version }
          trigger:
            - call: "POST /public-comments/${pc1}/dispose"
              payload: { disposition: "INCORPORATED", disposition_note: "the sensitivity table will accompany the methodology" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { pc1_status: $.data.status, pc1_version: $.data.version }
            - call: "GET /methodology-versions/${m1}"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { unresolved_mid: $.data.unresolved_comment_count, comment_count_mid: $.data.comment_count }
            - call: "POST /public-comments/${pc2}/dispose"
              payload: { disposition: "DECLINED", disposition_note: "the standard already exempts organizations below the revenue floor" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { pc2_status: $.data.status }
            - call: "GET /methodology-versions/${m1}"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { unresolved_after: $.data.unresolved_comment_count, comment_count_after: $.data.comment_count, mv_after: $.data.version }
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-10-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1_status: $.data.status, m1_adopted: $.data.adopted_at }
            - call: "GET /methodology-versions/${m1}/public-comments?status=INCORPORATED"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { incorporated_first: "$.data[0].id" }
          assert:
            - "${unresolved_before} == 2 and ${mv_before} == 2: each accepted comment incremented the parent version once, on top of the open-comment transition"
            - "${pc1_status} == INCORPORATED, ${pc1_version} == 2 and ${unresolved_mid} == 1 while ${comment_count_mid} == 2: dispose moves a comment out of the unresolved ledger without deleting it from the tally"
            - "${pc2_status} == DECLINED and ${unresolved_after} == 0 with ${comment_count_after} == 2: DECLINED resolves a comment exactly as firmly as INCORPORATED does"
            - "${mv_after} == ${mv_before} + 2: each dispose incremented the parent MethodologyVersion version once"
            - "${m1_status} == ADOPTED and ${m1_adopted} == 2026-08-01T00:00:00Z: with unresolved_comment_count at 0 the priority-24 gate is open, which is the whole point of the ledger"
            - "${incorporated_first} == ${pc1} with total_count == 1, and the same list filtered to status=SUBMITTED returns total_count == 0"
      - name: a_bulk_override_with_one_bad_entry_writes_nothing_at_all
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/dimension-overrides
          - errors.ERR_DIMENSION_SCORE_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
