scenario: |
  Enterprise travel reimbursement system: travel application approval with destination, duration, purpose,
  estimated budget, multi-level approval by amount and travel scope, urgent application expedited routing,
  and approval-to-booking gating; itinerary booking with corporate booking platform integration
  (flight/train/hotel/car), policy-based available-option filtering, single-trip multi-segment booking,
  change-and-cancellation handling, and booking-cost pre-allocation to application; expense standard
  validation with city-tier and employee-level standards (lodging/per-diem/transportation), self-paid
  portion calculation for over-standard, special-approval for over-standard cases, holiday and overseas
  standard differentiation, and standard-version effective-date control; invoice OCR verification with
  invoice OCR recognition, tax-authority invoice verification, duplicate-reimbursement detection,
  invoice-to-itinerary matching, and invalid-invoice rejection; reimbursement form multi-level approval
  with form filling and invoice attachment, item-level expense classification,
  supervisor/department/finance/general manager multi-level approval, rejection-and-correction workflow,
  and approval-record retention; payment with payment-channel selection, batch payment generation,
  payment execution, payment status tracking, and payment-failure retry; event-driven synchronization
  with finance, banking, electronic-invoice, and corporate booking platforms; audit logging for approval
  actions and payment records.

domain_name: travel-reimburse
api_prefix: /travel-applications

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - version_pinning_on_approval
    - idempotency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many       # Application -> Itineraries; ReimbursementForm -> ReimbursementItems
    - cross_aggregate   # Invoice references ItinerarySegment; ReimbursementItem references Invoice
    - polymorphic       # ItinerarySegment.segment_type -> different option pools
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Employee full name."
      - name: employee_level
        type: enum
        source: input
        description: "Employee rank; drives expense-standard tier."
        constraints: "One of {STAFF, MANAGER, DIRECTOR, EXECUTIVE}."
      - name: department_id
        type: string
        source: input
        description: "Employee's department UUID."
      - name: supervisor_id
        type: string
        source: input
        description: "UUID of the supervisor Employee (approval-chain step 1)."
      - name: status
        type: enum
        source: system
        description: "ACTIVE employees may file applications; INACTIVE cannot."
        constraints: "One of {ACTIVE, INACTIVE}."
        default: ACTIVE

  - name: ExpenseStandard
    parent: null
    common_fields: false
    fields:
      - name: version
        type: integer
        source: input
        description: "Monotonic version number for this standard set (immutable once created)."
      - name: effective_from
        type: datetime
        source: input
        description: "UTC ISO 8601 timestamp at which this version becomes active."
      - name: effective_to
        type: datetime
        source: input
        description: "UTC ISO 8601 timestamp at which this version expires (null = open ended)."
      - name: city_tier
        type: enum
        source: input
        description: "Geographic tier this row applies to."
        constraints: "One of {TIER_1, TIER_2, TIER_3, OVERSEAS}."
      - name: employee_level
        type: enum
        source: input
        description: "Employee rank this row applies to."
        constraints: "One of {STAFF, MANAGER, DIRECTOR, EXECUTIVE}."
      - name: lodging_daily_cap
        type: number
        source: input
        description: "Per-night lodging cap in CNY."
      - name: per_diem_amount
        type: number
        source: input
        description: "Per-day meal & incidentals allowance in CNY."
      - name: transportation_daily_cap
        type: number
        source: input
        description: "Per-day ground transportation cap in CNY."
      - name: holiday_multiplier
        type: number
        source: input
        description: "Multiplier applied to all three caps on declared holidays (e.g. 1.30)."
        default: 1.00

  - name: TravelApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "Owner Employee UUID."
      - name: destination_city
        type: string
        source: input
        description: "Primary destination city name."
      - name: destination_tier
        type: enum
        source: input
        description: "City tier of destination; pins which ExpenseStandard row applies."
        constraints: "One of {TIER_1, TIER_2, TIER_3, OVERSEAS}."
      - name: travel_scope
        type: enum
        source: input
        description: "Domestic vs overseas (determines approval chain depth)."
        constraints: "One of {DOMESTIC, OVERSEAS}."
      - name: purpose
        type: string
        source: input
        description: "Free-text purpose statement."
      - name: planned_start
        type: datetime
        source: input
        description: "Planned departure (UTC, ISO 8601)."
      - name: planned_end
        type: datetime
        source: input
        description: "Planned return (UTC, ISO 8601). Must be strictly after planned_start."
      - name: estimated_budget
        type: number
        source: input
        description: "Applicant's estimated total CNY cost."
      - name: urgent
        type: boolean
        source: input
        description: "True triggers expedited routing (skips department-head step)."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        constraints: "One of {DRAFT, SUBMITTED, SUPERVISOR_APPROVED, DEPT_HEAD_APPROVED, FINANCE_APPROVED, GM_APPROVED, APPROVED, REJECTED, BOOKING_LOCKED, COMPLETED, CANCELLED}."
        default: DRAFT
      - name: required_chain
        type: array
        source: computed
        description: "Computed ordered list of approval steps required (e.g. [SUPERVISOR, FINANCE] or [SUPERVISOR, DEPT_HEAD, FINANCE, GM]). Pinned at SUBMITTED, immutable thereafter."
      - name: standard_version_pinned
        type: integer
        source: computed
        description: "ExpenseStandard.version that was active at SUBMITTED moment; reimbursement caps use this version even if a newer standard is later published."
      - name: total_booked_cost
        type: number
        source: computed
        description: "Aggregated sum of all ACTIVE ItinerarySegment.cost values; pre-allocated against estimated_budget."
      - name: rejection_reason
        type: string
        source: input
        description: "Filled by approver on REJECT action."
        default: null

  - name: ItinerarySegment
    parent: TravelApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "Parent TravelApplication UUID."
      - name: segment_type
        type: enum
        source: input
        description: "Mode of transport / lodging."
        constraints: "One of {FLIGHT, TRAIN, HOTEL, CAR}."
      - name: option_code
        type: string
        source: input
        description: "Corporate-booking-platform option identifier (must be a policy-eligible code for this employee_level + segment_type)."
      - name: start_at
        type: datetime
        source: input
        description: "Segment start (UTC, ISO 8601)."
      - name: end_at
        type: datetime
        source: input
        description: "Segment end (UTC, ISO 8601). For HOTEL: checkout. For FLIGHT/TRAIN: arrival."
      - name: cost
        type: number
        source: input
        description: "Booked cost in CNY as returned by the booking platform."
      - name: status
        type: enum
        source: system
        description: "Segment lifecycle."
        constraints: "One of {ACTIVE, CHANGED, CANCELLED}."
        default: ACTIVE
      - name: prior_segment_id
        type: string
        source: system
        description: "When this row supersedes another via CHANGE, the predecessor segment id; otherwise null."
        default: null

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "Owner Employee UUID."
      - name: invoice_number
        type: string
        source: input
        description: "Tax-authority invoice serial. Unique across non-VOID invoices."
      - name: invoice_code
        type: string
        source: input
        description: "Tax-authority invoice code."
      - name: amount
        type: number
        source: input
        description: "Invoice gross amount in CNY (as recognized by OCR or supplied)."
      - name: invoice_date
        type: datetime
        source: input
        description: "Invoice issue date (UTC)."
      - name: category
        type: enum
        source: input
        description: "Expense classification of this invoice."
        constraints: "One of {LODGING, PER_DIEM, TRANSPORTATION, OTHER}."
      - name: ocr_status
        type: enum
        source: system
        description: "OCR pipeline state."
        constraints: "One of {PENDING_OCR, OCR_RECOGNIZED, TAX_VERIFIED, REJECTED, ATTACHED, CONSUMED}."
        default: PENDING_OCR
      - name: matched_segment_id
        type: string
        source: input
        description: "ItinerarySegment id whose date window must enclose invoice_date and whose category matches; nullable for PER_DIEM/OTHER."
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: "Set when ocr_status moves to REJECTED."
        default: null

  - name: ReimbursementForm
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "TravelApplication UUID this form reimburses (must be in BOOKING_LOCKED or COMPLETED)."
      - name: applicant_id
        type: string
        source: input
        description: "Owner Employee UUID; must equal TravelApplication.applicant_id."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        constraints: "One of {DRAFT, SUBMITTED, SUPERVISOR_APPROVED, DEPT_APPROVED, FINANCE_APPROVED, GM_APPROVED, APPROVED, REJECTED, PAID, FAILED}."
        default: DRAFT
      - name: total_claimed
        type: number
        source: computed
        description: "Sum of ReimbursementItem.claimed_amount over all items."
      - name: total_reimbursable
        type: number
        source: computed
        description: "Sum of ReimbursementItem.reimbursable_amount (after standard caps)."
      - name: total_self_paid
        type: number
        source: computed
        description: "Sum of ReimbursementItem.self_paid_amount (over-standard portion)."
      - name: requires_special_approval
        type: boolean
        source: computed
        description: "True iff total_self_paid > 0 and special_approval_granted is False."
      - name: special_approval_granted
        type: boolean
        source: input
        description: "GM may set true to reimburse over-standard portions."
        default: false
      - name: correction_round
        type: integer
        source: system
        description: "Increments by 1 each time form returns from any *_APPROVED state to DRAFT via reject-and-correct."
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: "Filled by rejecting approver."
        default: null

  - name: ReimbursementItem
    parent: ReimbursementForm
    common_fields: true
    fields:
      - name: form_id
        type: string
        source: input
        description: "Parent ReimbursementForm UUID."
      - name: invoice_id
        type: string
        source: input
        description: "Invoice UUID being attached (must currently have ocr_status == TAX_VERIFIED)."
      - name: category
        type: enum
        source: input
        description: "Item classification."
        constraints: "One of {LODGING, PER_DIEM, TRANSPORTATION, OTHER}."
      - name: covered_days
        type: integer
        source: input
        description: "Number of policy-eligible days this item covers (used to compute cap = standard * covered_days)."
      - name: claimed_amount
        type: number
        source: input
        description: "Amount the applicant claims for this item in CNY."
      - name: reimbursable_amount
        type: number
        source: computed
        description: "min(claimed_amount, standard_cap_for_this_item)."
      - name: self_paid_amount
        type: number
        source: computed
        description: "max(0, claimed_amount - standard_cap_for_this_item)."
      - name: standard_cap_applied
        type: number
        source: computed
        description: "The per-item cap value that was used; preserved for audit even if standard changes later."

  - name: ApprovalRecord
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: "Which entity this approval action targets."
        constraints: "One of {TRAVEL_APPLICATION, REIMBURSEMENT_FORM}."
      - name: subject_id
        type: string
        source: system
        description: "UUID of the subject entity."
      - name: actor_id
        type: string
        source: system
        description: "Employee UUID of the approver."
      - name: actor_role
        type: enum
        source: system
        description: "Role of the approver at action time."
        constraints: "One of {SUPERVISOR, DEPT_HEAD, FINANCE, GM}."
      - name: action
        type: enum
        source: system
        description: "Approval verdict."
        constraints: "One of {APPROVE, REJECT}."
      - name: comment
        type: string
        source: system
        description: "Approver-supplied note (rejection_reason on REJECT)."
        default: null
      - name: from_status
        type: string
        source: system
        description: "Subject status before this action."
      - name: to_status
        type: string
        source: system
        description: "Subject status after this action."

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: form_id
        type: string
        source: input
        description: "ReimbursementForm being paid (status must be APPROVED)."
      - name: channel
        type: enum
        source: input
        description: "Payment channel."
        constraints: "One of {BANK_TRANSFER, CORPORATE_CARD_REFUND, INTERNAL_WALLET}."
      - name: amount
        type: number
        source: computed
        description: "Equals ReimbursementForm.total_reimbursable at payment-creation time; pinned immutably."
      - name: batch_id
        type: string
        source: system
        description: "Server-assigned batch identifier (all payments created within the same POST /payments/batches call share this id)."
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle."
        constraints: "One of {PENDING, EXECUTING, SUCCESS, FAILED, RETRYING}."
        default: PENDING
      - name: attempt_count
        type: integer
        source: system
        description: "Number of execution attempts (1, 2, 3); capped at MAX_PAYMENT_ATTEMPTS=3."
        default: 0
      - name: external_ref
        type: string
        source: system
        description: "Reference returned by external banking system on success."
        default: null
      - name: failure_reason
        type: string
        source: system
        description: "Reason returned by external system on FAILED."
        default: null

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: "Audit category."
        constraints: "One of {APPROVAL_ACTION, PAYMENT_EVENT, EXTERNAL_SYNC}."
      - name: subject_type
        type: enum
        source: system
        description: "Entity class touched."
        constraints: "One of {TRAVEL_APPLICATION, REIMBURSEMENT_FORM, PAYMENT, INVOICE}."
      - name: subject_id
        type: string
        source: system
        description: "UUID of the subject entity."
      - name: actor_id
        type: string
        source: system
        description: "Employee UUID or 'system' for automated events."
      - name: payload
        type: object
        source: system
        description: "Free-form JSON snapshot of relevant fields at event time."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TravelApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /travel-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "applicant_id == X-User-ID."
          - "planned_end > planned_start."
          - "estimated_budget >= 0."
          - "applicant.status == ACTIVE."
        side_effects:
          - "Compute required_chain. If estimated_budget > AMOUNT_GM_THRESHOLD OR travel_scope == OVERSEAS, chain = [SUPERVISOR, DEPT_HEAD, FINANCE, GM]; else if estimated_budget > AMOUNT_DEPT_THRESHOLD, chain = [SUPERVISOR, DEPT_HEAD, FINANCE]; else chain = [SUPERVISOR, FINANCE]. If urgent == true and travel_scope == DOMESTIC, drop DEPT_HEAD from the chain (urgent OVERSEAS keeps the full chain)."
          - "Pin standard_version_pinned = ExpenseStandard.version whose [effective_from, effective_to) interval contains current server time; if no row, reject (ERR_NO_ACTIVE_STANDARD)."
        note: "Approval chain is computed once and immutable thereafter."

      - from: SUBMITTED
        to: SUPERVISOR_APPROVED
        trigger: "POST /travel-applications/{id}/approve as SUPERVISOR"
        actor: Supervisor
        preconditions:
          - "Acting user id == applicant.supervisor_id."
          - "First unconsumed step of required_chain == SUPERVISOR."
        side_effects:
          - "Append ApprovalRecord."
          - "If required_chain has no further steps, auto-transition to APPROVED (rare)."

      - from: SUPERVISOR_APPROVED
        to: DEPT_HEAD_APPROVED
        trigger: "POST /travel-applications/{id}/approve as DEPT_HEAD"
        actor: DeptHead
        preconditions:
          - "Next unconsumed step of required_chain == DEPT_HEAD."
        side_effects:
          - "Append ApprovalRecord."

      - from: SUPERVISOR_APPROVED
        to: FINANCE_APPROVED
        trigger: "POST /travel-applications/{id}/approve as FINANCE (DEPT_HEAD not in chain — urgent domestic)"
        actor: Finance
        preconditions:
          - "Next unconsumed step of required_chain == FINANCE (i.e. DEPT_HEAD was skipped)."
        side_effects:
          - "Append ApprovalRecord."

      - from: DEPT_HEAD_APPROVED
        to: FINANCE_APPROVED
        trigger: "POST /travel-applications/{id}/approve as FINANCE"
        actor: Finance
        preconditions:
          - "Next unconsumed step of required_chain == FINANCE."
        side_effects:
          - "Append ApprovalRecord."

      - from: FINANCE_APPROVED
        to: GM_APPROVED
        trigger: "POST /travel-applications/{id}/approve as GM"
        actor: GeneralManager
        preconditions:
          - "Next unconsumed step of required_chain == GM."
        side_effects:
          - "Append ApprovalRecord."

      - from: FINANCE_APPROVED
        to: APPROVED
        trigger: "POST /travel-applications/{id}/approve as FINANCE (GM not in chain)"
        actor: Finance
        preconditions:
          - "required_chain ends at FINANCE."
        side_effects:
          - "Append ApprovalRecord."
          - "Open booking window."

      - from: GM_APPROVED
        to: APPROVED
        trigger: "system auto-transition once GM approves and required_chain is exhausted"
        actor: system
        preconditions:
          - "All required_chain steps consumed."
        side_effects:
          - "Open booking window."

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /travel-applications/{id}/reject as any current-step approver"
        actor: ApproverInChain
        preconditions:
          - "Acting role matches the first unconsumed step."
          - "rejection_reason supplied."
        side_effects:
          - "Append ApprovalRecord(action=REJECT)."

      - from: SUPERVISOR_APPROVED
        to: REJECTED
        trigger: "POST /travel-applications/{id}/reject"
        actor: ApproverInChain
        preconditions:
          - "Acting role matches the next unconsumed step."
        side_effects:
          - "Append ApprovalRecord(action=REJECT)."

      - from: DEPT_HEAD_APPROVED
        to: REJECTED
        trigger: "POST /travel-applications/{id}/reject"
        actor: ApproverInChain
        preconditions:
          - "Acting role matches the next unconsumed step."
        side_effects:
          - "Append ApprovalRecord(action=REJECT)."

      - from: FINANCE_APPROVED
        to: REJECTED
        trigger: "POST /travel-applications/{id}/reject"
        actor: GeneralManager
        preconditions:
          - "GM is the next unconsumed step."
        side_effects:
          - "Append ApprovalRecord(action=REJECT)."

      - from: APPROVED
        to: BOOKING_LOCKED
        trigger: "First successful POST /travel-applications/{id}/itineraries"
        actor: system
        preconditions:
          - "At least one ItinerarySegment with status ACTIVE exists."
        side_effects:
          - "Recompute total_booked_cost = sum of ACTIVE ItinerarySegment.cost."

      - from: BOOKING_LOCKED
        to: BOOKING_LOCKED
        trigger: "POST /travel-applications/{id}/itineraries/{segId}/change or /cancel"
        actor: Applicant
        preconditions:
          - "Segment exists and is ACTIVE."
        side_effects:
          - "On change: mark old ACTIVE→CHANGED, insert new ACTIVE row with prior_segment_id=old.id."
          - "On cancel: mark ACTIVE→CANCELLED."
          - "Recompute total_booked_cost; if new total > estimated_budget * BUDGET_OVERRUN_FACTOR, reject with ERR_BUDGET_OVERRUN."

      - from: BOOKING_LOCKED
        to: COMPLETED
        trigger: "POST /travel-applications/{id}/complete"
        actor: Applicant
        preconditions:
          - "Current server time >= max(ItinerarySegment.end_at) over ACTIVE segments."
        side_effects:
          - "Emit ExternalSync event {target: BOOKING_PLATFORM, event: TRIP_COMPLETED}."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /travel-applications/{id}/cancel"
        actor: Applicant
        preconditions: ["applicant_id == X-User-ID."]
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /travel-applications/{id}/cancel"
        actor: Applicant
        preconditions:
          - "No ItinerarySegment with status ACTIVE exists."
        side_effects: []

  - entity: Invoice
    initial_state: PENDING_OCR
    terminal_states: [REJECTED, CONSUMED]
    transitions:
      - from: PENDING_OCR
        to: OCR_RECOGNIZED
        trigger: "POST /invoices/{id}/ocr"
        actor: system
        preconditions:
          - "Idempotency: re-posting the same Idempotency-Key returns the prior result without state change."
        side_effects:
          - "Populate amount, invoice_date, category from OCR output (if not already supplied)."

      - from: OCR_RECOGNIZED
        to: TAX_VERIFIED
        trigger: "POST /invoices/{id}/verify-tax"
        actor: system
        preconditions:
          - "No other Invoice with the same (invoice_code, invoice_number) is currently in {TAX_VERIFIED, ATTACHED, CONSUMED}."
          - "amount > 0."
        side_effects:
          - "Emit ExternalSync event {target: ELECTRONIC_INVOICE, event: VERIFIED}."

      - from: OCR_RECOGNIZED
        to: REJECTED
        trigger: "system: tax-authority lookup returns INVALID, or duplicate detected"
        actor: system
        preconditions: []
        side_effects:
          - "Set rejection_reason."

      - from: TAX_VERIFIED
        to: ATTACHED
        trigger: "POST /reimbursement-forms/{id}/items (this invoice attached)"
        actor: Applicant
        preconditions:
          - "For category in {LODGING, TRANSPORTATION}: matched_segment_id is non-null, segment belongs to the same Application, segment.status==ACTIVE, segment.start_at <= invoice_date <= segment.end_at, and segment.segment_type maps to this category (FLIGHT/TRAIN/CAR -> TRANSPORTATION, HOTEL -> LODGING)."
        side_effects: []

      - from: ATTACHED
        to: TAX_VERIFIED
        trigger: "DELETE /reimbursement-forms/{id}/items/{itemId} OR form moves to DRAFT via reject-and-correct"
        actor: Applicant
        preconditions: []
        side_effects: []

      - from: ATTACHED
        to: CONSUMED
        trigger: "Payment for the parent ReimbursementForm reaches SUCCESS"
        actor: system
        preconditions:
          - "Parent ReimbursementForm.status == PAID."
        side_effects: []

  - entity: ReimbursementForm
    initial_state: DRAFT
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reimbursement-forms/{id}/submit"
        actor: Applicant
        preconditions:
          - "TravelApplication.status in {BOOKING_LOCKED, COMPLETED}."
          - "At least one ReimbursementItem exists."
          - "Every attached Invoice has ocr_status==ATTACHED."
          - "If requires_special_approval == true (i.e., total_self_paid > 0), special_approval_granted must already be true OR the form is being submitted for over-standard approval (status still flows through chain; GM step toggles flag)."
        side_effects:
          - "Recompute total_claimed, total_reimbursable, total_self_paid using TravelApplication.standard_version_pinned."

      - from: SUBMITTED
        to: SUPERVISOR_APPROVED
        trigger: "POST /reimbursement-forms/{id}/approve as SUPERVISOR"
        actor: Supervisor
        preconditions:
          - "Acting user == applicant.supervisor_id."
        side_effects: ["Append ApprovalRecord."]

      - from: SUPERVISOR_APPROVED
        to: DEPT_APPROVED
        trigger: "POST /reimbursement-forms/{id}/approve as DEPT_HEAD"
        actor: DeptHead
        preconditions: []
        side_effects: ["Append ApprovalRecord."]

      - from: DEPT_APPROVED
        to: FINANCE_APPROVED
        trigger: "POST /reimbursement-forms/{id}/approve as FINANCE"
        actor: Finance
        preconditions: []
        side_effects: ["Append ApprovalRecord."]

      - from: FINANCE_APPROVED
        to: GM_APPROVED
        trigger: "POST /reimbursement-forms/{id}/approve as GM"
        actor: GeneralManager
        preconditions:
          - "requires_special_approval == true."
        side_effects:
          - "Append ApprovalRecord."
          - "Set special_approval_granted = true."

      - from: FINANCE_APPROVED
        to: APPROVED
        trigger: "POST /reimbursement-forms/{id}/approve as FINANCE (no over-standard)"
        actor: Finance
        preconditions:
          - "requires_special_approval == false."
        side_effects: ["Append ApprovalRecord."]

      - from: GM_APPROVED
        to: APPROVED
        trigger: "system auto-transition after GM approval"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /reimbursement-forms/{id}/reject (with correction=true)"
        actor: ApproverInChain
        preconditions:
          - "rejection_reason supplied."
        side_effects:
          - "Increment correction_round."
          - "For every attached Invoice: revert ATTACHED→TAX_VERIFIED."
          - "Append ApprovalRecord(action=REJECT)."

      - from: SUPERVISOR_APPROVED
        to: DRAFT
        trigger: "POST /reimbursement-forms/{id}/reject (with correction=true)"
        actor: ApproverInChain
        preconditions: ["rejection_reason supplied."]
        side_effects:
          - "Increment correction_round."
          - "Revert attached Invoices ATTACHED→TAX_VERIFIED."
          - "Append ApprovalRecord(action=REJECT)."

      - from: DEPT_APPROVED
        to: DRAFT
        trigger: "POST /reimbursement-forms/{id}/reject (with correction=true)"
        actor: ApproverInChain
        preconditions: ["rejection_reason supplied."]
        side_effects:
          - "Increment correction_round."
          - "Revert attached Invoices."
          - "Append ApprovalRecord(action=REJECT)."

      - from: FINANCE_APPROVED
        to: DRAFT
        trigger: "POST /reimbursement-forms/{id}/reject (with correction=true)"
        actor: ApproverInChain
        preconditions: ["rejection_reason supplied."]
        side_effects:
          - "Increment correction_round."
          - "Revert attached Invoices."
          - "Append ApprovalRecord(action=REJECT)."

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reimbursement-forms/{id}/reject (with correction=false)"
        actor: ApproverInChain
        preconditions: ["rejection_reason supplied."]
        side_effects: ["Append ApprovalRecord(action=REJECT)."]

      - from: APPROVED
        to: PAID
        trigger: "Payment.status moves to SUCCESS"
        actor: system
        preconditions: []
        side_effects:
          - "For every ReimbursementItem.invoice_id: Invoice ATTACHED→CONSUMED."
          - "Emit AuditLog(event_type=PAYMENT_EVENT, payload includes form_id, amount, channel)."
          - "Emit ExternalSync event {target: FINANCE_SYSTEM, event: REIMBURSEMENT_POSTED}."

      - from: APPROVED
        to: FAILED
        trigger: "Payment.status reaches FAILED after attempt_count == MAX_PAYMENT_ATTEMPTS"
        actor: system
        preconditions: []
        side_effects: ["Emit AuditLog."]

  - entity: Payment
    initial_state: PENDING
    terminal_states: [SUCCESS]
    transitions:
      - from: PENDING
        to: EXECUTING
        trigger: "POST /payments/{id}/execute"
        actor: Finance
        preconditions:
          - "Parent ReimbursementForm.status == APPROVED."
          - "amount > 0."
        side_effects: ["attempt_count += 1."]

      - from: EXECUTING
        to: SUCCESS
        trigger: "POST /payments/{id}/result with outcome=SUCCESS (banking-platform callback simulation)"
        actor: system
        preconditions: []
        side_effects:
          - "Set external_ref."
          - "Cascade ReimbursementForm APPROVED→PAID (which itself cascades Invoice ATTACHED→CONSUMED)."
          - "Emit ExternalSync event {target: BANKING, event: PAID}."

      - from: EXECUTING
        to: FAILED
        trigger: "POST /payments/{id}/result with outcome=FAILED"
        actor: system
        preconditions: []
        side_effects: ["Set failure_reason."]

      - from: FAILED
        to: RETRYING
        trigger: "POST /payments/{id}/retry"
        actor: Finance
        preconditions:
          - "attempt_count < MAX_PAYMENT_ATTEMPTS (=3)."
        side_effects: []

      - from: RETRYING
        to: EXECUTING
        trigger: "POST /payments/{id}/execute"
        actor: Finance
        preconditions: []
        side_effects: ["attempt_count += 1."]

# §1.2.1 Concurrency Rules
concurrency_rules:
  - scenario: "Two approvers in the same chain step click approve simultaneously on the same TravelApplication."
    guarantee: "Exactly one transition succeeds; the loser sees the application already in the next status."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TravelApplication.status using OCC version."

  - scenario: "Applicant submits an Invoice for OCR twice with the same Idempotency-Key."
    guarantee: "The second request returns the result of the first without re-running OCR; ocr_status is unchanged from the first call's outcome."
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 409
    serialization: "Idempotency-Key acts as a unique key on (Invoice.id, key)."

  - scenario: "Two different ReimbursementForms attempt to attach the same TAX_VERIFIED Invoice concurrently."
    guarantee: "At most one attach succeeds; the other receives ERR_INVOICE_ALREADY_ATTACHED because Invoice.ocr_status has moved to ATTACHED."
    error_id: ERR_INVOICE_ALREADY_ATTACHED
    http_status: 409
    serialization: "First-writer-wins on Invoice.ocr_status."

  - scenario: "Two Finance officers click execute on the same Payment in PENDING simultaneously."
    guarantee: "Exactly one attempt_count increment succeeds; the loser sees the payment already EXECUTING."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Payment.status using OCC version."

  - scenario: "Applicant cancels an itinerary segment while another approver rejects the parent application; the segment-cancel arrives first."
    guarantee: "Reject still succeeds against the BOOKING_LOCKED-rooted application; only DRAFT/SUBMITTED-stage rejects rebuild required_chain. (Concretely: reject in BOOKING_LOCKED is not a valid transition and returns ERR_INVALID_STATE.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "Reject is only valid from {SUBMITTED, SUPERVISOR_APPROVED, DEPT_HEAD_APPROVED, FINANCE_APPROVED}."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: travel_application_required_chain
    trigger: "POST /travel-applications/{id}/submit (computed once at DRAFT→SUBMITTED)"
    algorithm: threshold
    formula: |
      base_chain = [SUPERVISOR]
      if estimated_budget > AMOUNT_DEPT_THRESHOLD or travel_scope == OVERSEAS:
          base_chain.append(DEPT_HEAD)
      base_chain.append(FINANCE)
      if estimated_budget > AMOUNT_GM_THRESHOLD or travel_scope == OVERSEAS:
          base_chain.append(GM)
      if urgent == true and travel_scope == DOMESTIC and DEPT_HEAD in base_chain:
          base_chain.remove(DEPT_HEAD)
      required_chain = base_chain  # pinned, immutable after SUBMITTED
    input_set: "Fields of the TravelApplication at the moment of submit."
    constants:
      AMOUNT_DEPT_THRESHOLD: 5000.00
      AMOUNT_GM_THRESHOLD: 30000.00
    precision: "N/A (boolean / list)."

  - name: total_booked_cost
    trigger: "After any change in {INSERT, CHANGE, CANCEL} on ItinerarySegment under the same TravelApplication."
    algorithm: aggregation
    formula: |
      total_booked_cost = sum(seg.cost for seg in ItinerarySegment
                              where seg.application_id == app.id and seg.status == ACTIVE)
      # Pre-allocation check (rejects the offending mutation if it would breach):
      if total_booked_cost > app.estimated_budget * BUDGET_OVERRUN_FACTOR:
          reject with ERR_BUDGET_OVERRUN
    input_set: "Only ItinerarySegments with status == ACTIVE under the parent application."
    constants:
      BUDGET_OVERRUN_FACTOR: 1.20
    precision: "2 decimal places, round_half_up."

  - name: reimbursable_amount_per_item__forward_estimate
    trigger: "GET /travel-applications/{id}/budget-projection (preview before form submission)"
    algorithm: forward_looking
    formula: |
      # Forward-looking estimate uses the CURRENTLY ACTIVE ExpenseStandard
      # (whichever version's [effective_from, effective_to) contains now()).
      # For each planned ItinerarySegment (status=ACTIVE), project caps using:
      #   item_cap = standard_unit_cap * planned_days
      #     where:
      #       FLIGHT/TRAIN/CAR -> transportation_daily_cap * ceil((end_at-start_at)/24h)
      #       HOTEL            -> lodging_daily_cap        * nights(end_at, start_at)
      #     and standard is keyed on (city_tier=app.destination_tier, employee_level=applicant.employee_level)
      # Multiply by holiday_multiplier if planned_start..planned_end overlaps any DECLARED_HOLIDAY date.
      projected_reimbursable = sum(min(seg.cost, item_cap) for seg in ACTIVE segments)
    input_set: "ACTIVE ItinerarySegments under the application; ExpenseStandard rows whose effective window contains now()."
    constants:
      DECLARED_HOLIDAY: ["2025-01-01", "2025-05-01", "2025-10-01"]
    precision: "2 decimal places, round_half_up."
    variants:
      - name: holiday_projection
        when: "Any day of [planned_start, planned_end] falls in DECLARED_HOLIDAY."
        difference: "Caps for those days are multiplied by holiday_multiplier."

  - name: reimbursable_amount_per_item__chronological_final
    trigger: "POST /reimbursement-forms/{id}/submit (final-settlement recompute)"
    algorithm: chronological
    formula: |
      # Final settlement uses the ExpenseStandard version PINNED at TravelApplication submit
      # (app.standard_version_pinned), NOT the version active when the form is submitted.
      # Items are sorted by (invoice_date ASC, ReimbursementItem.created_at ASC) and processed in order:
      #   per_unit_cap = standard[ standard_version_pinned ][ city_tier=app.destination_tier,
      #                                                       employee_level=applicant.employee_level ]
      #                    .field_for_category(item.category)
      #   if any day of the item's coverage window falls in DECLARED_HOLIDAY:
      #       per_unit_cap = per_unit_cap * holiday_multiplier
      #   item.standard_cap_applied   = round(per_unit_cap * item.covered_days, 2)
      #   item.reimbursable_amount    = min(item.claimed_amount, item.standard_cap_applied)
      #   item.self_paid_amount       = max(0, item.claimed_amount - item.standard_cap_applied)
      # Rounding: each item is rounded to 2 dp BEFORE summing the form-level totals.
      form.total_claimed      = sum(item.claimed_amount for item)
      form.total_reimbursable = sum(item.reimbursable_amount for item)
      form.total_self_paid    = sum(item.self_paid_amount   for item)
      form.requires_special_approval = (form.total_self_paid > 0 and form.special_approval_granted == false)
    input_set: "All ReimbursementItem rows on the form, processed in (invoice_date ASC, item.created_at ASC) order. Uses pinned ExpenseStandard version."
    constants:
      DECLARED_HOLIDAY: ["2025-01-01", "2025-05-01", "2025-10-01"]
    precision: "Per-item: 2 decimal places, round_half_up. Form totals: sum AFTER per-item rounding."
    variants:
      - name: overseas_pinning
        when: "TravelApplication.travel_scope == OVERSEAS (city_tier OVERSEAS row used)."
        difference: "City tier is forced to OVERSEAS regardless of destination_tier (overseas trips always read the OVERSEAS row)."

  - name: payment_batch_amount
    trigger: "POST /payments/batches"
    algorithm: aggregation
    formula: |
      # Server gathers all APPROVED ReimbursementForms whose ids are in request.form_ids,
      # sorts them by (form.applicant_id ASC, form.created_at ASC),
      # and creates one Payment per form with amount = form.total_reimbursable.
      # batch_id is a single uuid attached to every payment created in this call.
      batch_total = sum(p.amount for p in payments_created)
    input_set: "ReimbursementForms with status==APPROVED whose ids appear in the request; duplicates and unknown ids reject the whole batch (ERR_INVALID_BATCH)."
    constants: {}
    precision: "2 decimal places, round_half_up; batch_total is the sum of already-rounded form totals."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources (TravelApplication/{id}, ItinerarySegment/{id}, Invoice/{id}, ReimbursementForm/{id}, Payment/{id}) exist; validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body foreign keys resolve (applicant_id -> Employee, application_id -> TravelApplication, form_id -> ReimbursementForm, invoice_id -> Invoice, matched_segment_id -> ItinerarySegment in the same application)."
    error_id: ERR_REFERENCE_INVALID
    http_status: 422
    applies_to: ["POST /travel-applications", "POST /travel-applications/{id}/itineraries", "POST /reimbursement-forms", "POST /reimbursement-forms/{id}/items"]

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is allowed (per §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["all action endpoints"]

  - priority: 6
    category: business_safety
    check: "Approval action arrives at the correct chain step (chain_step_pointer == actor's role). Acting Supervisor must equal applicant.supervisor_id."
    error_id: ERR_NOT_CURRENT_APPROVER
    http_status: 403
    applies_to: ["POST /travel-applications/{id}/approve", "POST /travel-applications/{id}/reject", "POST /reimbursement-forms/{id}/approve", "POST /reimbursement-forms/{id}/reject"]

  - priority: 7
    category: business_constraint
    check: "Itinerary policy filter: option_code must appear in the policy-eligible option set for (segment_type, applicant.employee_level)."
    error_id: ERR_OPTION_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /travel-applications/{id}/itineraries", "POST /travel-applications/{id}/itineraries/{segId}/change"]

  - priority: 8
    category: business_temporal
    check: "ItinerarySegment.start_at and end_at must lie within [TravelApplication.planned_start, TravelApplication.planned_end] inclusive."
    error_id: ERR_SEGMENT_OUTSIDE_TRIP
    http_status: 422
    applies_to: ["POST /travel-applications/{id}/itineraries", "POST /travel-applications/{id}/itineraries/{segId}/change"]

  - priority: 9
    category: business_temporal
    check: "Two ACTIVE ItinerarySegments under the SAME application whose segment_type is in {FLIGHT, TRAIN, CAR} must not have time intervals that overlap; equal endpoints (one ends exactly when the next begins) are allowed."
    error_id: ERR_SEGMENT_TIME_OVERLAP
    http_status: 422
    applies_to: ["POST /travel-applications/{id}/itineraries", "POST /travel-applications/{id}/itineraries/{segId}/change"]

  - priority: 10
    category: business_temporal
    check: "Two ACTIVE HOTEL ItinerarySegments under the same application MUST NOT have overlapping [start_at, end_at) night intervals (half-open: checkout day may equal next check-in day)."
    error_id: ERR_HOTEL_NIGHT_OVERLAP
    http_status: 422
    applies_to: ["POST /travel-applications/{id}/itineraries", "POST /travel-applications/{id}/itineraries/{segId}/change"]

  - priority: 11
    category: business_constraint
    check: "Invoice (invoice_code, invoice_number) is unique across all invoices not in REJECTED."
    error_id: ERR_INVOICE_DUPLICATE
    http_status: 409
    applies_to: ["POST /invoices", "POST /invoices/{id}/verify-tax"]

  - priority: 12
    category: business_referential
    check: "When attaching a ReimbursementItem with category in {LODGING, TRANSPORTATION}, matched_segment_id must be supplied and segment-category compatibility must hold (HOTEL->LODGING; FLIGHT/TRAIN/CAR->TRANSPORTATION); invoice_date must lie within [segment.start_at, segment.end_at]."
    error_id: ERR_INVOICE_NOT_MATCHED
    http_status: 422
    applies_to: ["POST /reimbursement-forms/{id}/items"]

  - priority: 13
    category: business_constraint
    check: "Invoice.ocr_status must be TAX_VERIFIED when attached to a ReimbursementForm item."
    error_id: ERR_INVOICE_NOT_VERIFIED
    http_status: 422
    applies_to: ["POST /reimbursement-forms/{id}/items"]

  - priority: 14
    category: business_fiscal
    check: "total_booked_cost <= estimated_budget * BUDGET_OVERRUN_FACTOR (1.20)."
    error_id: ERR_BUDGET_OVERRUN
    http_status: 422
    applies_to: ["POST /travel-applications/{id}/itineraries", "POST /travel-applications/{id}/itineraries/{segId}/change"]

  - priority: 15
    category: business_fiscal
    check: "If form.requires_special_approval is true at the FINANCE step, FINANCE cannot move it to APPROVED — it must go to GM_APPROVED."
    error_id: ERR_GM_APPROVAL_REQUIRED
    http_status: 422
    applies_to: ["POST /reimbursement-forms/{id}/approve"]

  - priority: 16
    category: business_fiscal
    check: "Payment.amount must equal ReimbursementForm.total_reimbursable at the moment Payment is created; once created, amount is immutable."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /payments/batches", "POST /payments/{id}/execute"]

  - priority: 17
    category: business_constraint
    check: "Payment.attempt_count < MAX_PAYMENT_ATTEMPTS (=3) for any retry; the third FAILED is terminal and cascades the form to FAILED."
    error_id: ERR_PAYMENT_RETRY_EXHAUSTED
    http_status: 422
    applies_to: ["POST /payments/{id}/retry"]

  - priority: 18
    category: business_constraint
    check: "Body schema: required fields present, types match, enums valid, numeric values non-negative where applicable, datetimes ISO 8601."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 19
    category: business_constraint
    check: "Optimistic concurrency: if request body's version != current entity.version, reject."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: ["PATCH /travel-applications/{id}", "PATCH /reimbursement-forms/{id}"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Employee (admin-managed reference data) -----
  - method: POST
    path: /employees
    description: "Register an Employee (admin bootstrap)."
    roles: [Admin]
    code: 201
    input: [full_name, employee_level, department_id, supervisor_id]
    output: Employee
    side_effects: []

  - method: GET
    path: /employees/{id}
    description: "Fetch employee."
    roles: [Admin, Applicant, Supervisor, DeptHead, Finance, GeneralManager]
    code: 200
    input: []
    output: Employee
    side_effects: []

  # ----- ExpenseStandard (admin-managed; versioned, immutable per version) -----
  - method: POST
    path: /expense-standards
    description: "Create a new ExpenseStandard row. Combination of (version, city_tier, employee_level) must be unique. effective_from must be > all previous versions' effective_from; effective_to of any prior open row in the same (city_tier, employee_level) bucket is auto-closed."
    roles: [Admin]
    code: 201
    input: [version, effective_from, effective_to, city_tier, employee_level, lodging_daily_cap, per_diem_amount, transportation_daily_cap, holiday_multiplier]
    output: ExpenseStandard
    side_effects: ["Auto-close prior open ExpenseStandard rows of the same (city_tier, employee_level)."]

  - method: GET
    path: /expense-standards
    description: "List ExpenseStandard rows; supports filter by version, city_tier, employee_level."
    roles: [Admin, Finance, Applicant]
    code: 200
    input: ["version?", "city_tier?", "employee_level?", "limit?", "offset?"]
    output: ExpenseStandard[]
    side_effects: []

  # ----- TravelApplication -----
  - method: POST
    path: /travel-applications
    description: "Create draft application."
    roles: [Applicant]
    code: 201
    input: [destination_city, destination_tier, travel_scope, purpose, planned_start, planned_end, estimated_budget, "urgent?"]
    output: TravelApplication
    side_effects: []

  - method: GET
    path: /travel-applications/{id}
    description: "Get application detail."
    roles: [Applicant, Supervisor, DeptHead, Finance, GeneralManager, Admin]
    code: 200
    input: []
    output: TravelApplication
    side_effects: []

  - method: PATCH
    path: /travel-applications/{id}
    description: "Edit a DRAFT application (OCC via version)."
    roles: [Applicant]
    code: 200
    input: ["destination_city?", "destination_tier?", "travel_scope?", "purpose?", "planned_start?", "planned_end?", "estimated_budget?", "urgent?", version]
    output: TravelApplication
    side_effects: []

  - method: POST
    path: /travel-applications/{id}/submit
    description: "Submit DRAFT → SUBMITTED; computes required_chain and pins standard_version_pinned."
    roles: [Applicant]
    code: 200
    input: []
    output: TravelApplication
    side_effects: ["calc travel_application_required_chain", "pin standard_version_pinned"]

  - method: POST
    path: /travel-applications/{id}/approve
    description: "Approve current chain step."
    roles: [Supervisor, DeptHead, Finance, GeneralManager]
    code: 200
    input: ["comment?"]
    output: TravelApplication
    side_effects: ["append ApprovalRecord", "AuditLog APPROVAL_ACTION"]

  - method: POST
    path: /travel-applications/{id}/reject
    description: "Reject current chain step."
    roles: [Supervisor, DeptHead, Finance, GeneralManager]
    code: 200
    input: [rejection_reason]
    output: TravelApplication
    side_effects: ["append ApprovalRecord", "AuditLog APPROVAL_ACTION"]

  - method: POST
    path: /travel-applications/{id}/itineraries
    description: "Book a new ItinerarySegment. Application must be in APPROVED or BOOKING_LOCKED."
    roles: [Applicant]
    code: 201
    input: [segment_type, option_code, start_at, end_at, cost]
    output: ItinerarySegment
    side_effects: ["TravelApplication APPROVED→BOOKING_LOCKED (first segment)", "recompute total_booked_cost"]

  - method: GET
    path: /travel-applications/{id}/itineraries
    description: "List segments under an application."
    roles: [Applicant, Supervisor, DeptHead, Finance, GeneralManager, Admin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ItinerarySegment[]
    side_effects: []

  - method: POST
    path: /travel-applications/{id}/itineraries/{segId}/change
    description: "Replace an ACTIVE segment with a new one (records prior_segment_id)."
    roles: [Applicant]
    code: 200
    input: [segment_type, option_code, start_at, end_at, cost]
    output: ItinerarySegment
    side_effects: ["old ACTIVE→CHANGED", "new ACTIVE inserted", "recompute total_booked_cost", "AuditLog EXTERNAL_SYNC -> BOOKING_PLATFORM:CHANGED"]

  - method: POST
    path: /travel-applications/{id}/itineraries/{segId}/cancel
    description: "Cancel an ACTIVE segment."
    roles: [Applicant]
    code: 200
    input: []
    output: ItinerarySegment
    side_effects: ["ACTIVE→CANCELLED", "recompute total_booked_cost", "AuditLog EXTERNAL_SYNC -> BOOKING_PLATFORM:CANCELLED"]

  - method: GET
    path: /travel-applications/{id}/budget-projection
    description: "Run forward-looking reimbursable estimate (calc reimbursable_amount_per_item__forward_estimate)."
    roles: [Applicant, Finance]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: /travel-applications/{id}/complete
    description: "Mark trip COMPLETED (post-travel)."
    roles: [Applicant]
    code: 200
    input: []
    output: TravelApplication
    side_effects: ["AuditLog EXTERNAL_SYNC -> BOOKING_PLATFORM:TRIP_COMPLETED"]

  - method: POST
    path: /travel-applications/{id}/cancel
    description: "Cancel a DRAFT or APPROVED-without-bookings application."
    roles: [Applicant]
    code: 200
    input: []
    output: TravelApplication
    side_effects: []

  # ----- Invoice -----
  - method: POST
    path: /invoices
    description: "Upload an invoice image (creates row in PENDING_OCR)."
    roles: [Applicant]
    code: 201
    input: [applicant_id, invoice_number, invoice_code, "amount?", "invoice_date?", category]
    output: Invoice
    side_effects: []

  - method: POST
    path: /invoices/{id}/ocr
    description: "Run OCR. Idempotent on Idempotency-Key header."
    roles: [Applicant]
    code: 200
    input: []
    output: Invoice
    side_effects: ["PENDING_OCR→OCR_RECOGNIZED"]

  - method: POST
    path: /invoices/{id}/verify-tax
    description: "Run tax-authority verification. Triggers duplicate-detection across (invoice_code, invoice_number)."
    roles: [Applicant, Finance]
    code: 200
    input: []
    output: Invoice
    side_effects: ["OCR_RECOGNIZED→TAX_VERIFIED or →REJECTED", "AuditLog EXTERNAL_SYNC -> ELECTRONIC_INVOICE"]

  - method: GET
    path: /invoices/{id}
    description: "Fetch invoice."
    roles: [Applicant, Finance, Admin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # ----- ReimbursementForm -----
  - method: POST
    path: /reimbursement-forms
    description: "Create a draft reimbursement form bound to a TravelApplication."
    roles: [Applicant]
    code: 201
    input: [application_id]
    output: ReimbursementForm
    side_effects: []

  - method: POST
    path: /reimbursement-forms/{id}/items
    description: "Attach a ReimbursementItem (and its Invoice) to a DRAFT form."
    roles: [Applicant]
    code: 201
    input: [invoice_id, category, covered_days, claimed_amount, "matched_segment_id?"]
    output: ReimbursementItem
    side_effects: ["Invoice TAX_VERIFIED→ATTACHED", "recompute form totals"]

  - method: DELETE
    path: /reimbursement-forms/{id}/items/{itemId}
    description: "Remove an item from a DRAFT form."
    roles: [Applicant]
    code: 204
    input: []
    output: null
    side_effects: ["Invoice ATTACHED→TAX_VERIFIED", "recompute form totals"]

  - method: POST
    path: /reimbursement-forms/{id}/submit
    description: "Submit form for approval. Runs calc reimbursable_amount_per_item__chronological_final."
    roles: [Applicant]
    code: 200
    input: []
    output: ReimbursementForm
    side_effects: ["DRAFT→SUBMITTED", "recompute totals using pinned standard"]

  - method: POST
    path: /reimbursement-forms/{id}/approve
    description: "Approve current chain step."
    roles: [Supervisor, DeptHead, Finance, GeneralManager]
    code: 200
    input: ["comment?"]
    output: ReimbursementForm
    side_effects: ["append ApprovalRecord", "AuditLog APPROVAL_ACTION"]

  - method: POST
    path: /reimbursement-forms/{id}/reject
    description: "Reject current chain step. correction=true returns to DRAFT; correction=false terminates as REJECTED."
    roles: [Supervisor, DeptHead, Finance, GeneralManager]
    code: 200
    input: [rejection_reason, correction]
    output: ReimbursementForm
    side_effects: ["append ApprovalRecord", "if correction=true: increment correction_round, revert Invoice ATTACHED→TAX_VERIFIED"]

  - method: GET
    path: /reimbursement-forms/{id}
    description: "Fetch form (with computed totals)."
    roles: [Applicant, Supervisor, DeptHead, Finance, GeneralManager, Admin]
    code: 200
    input: []
    output: ReimbursementForm
    side_effects: []

  # ----- Payment -----
  - method: POST
    path: /payments/batches
    description: "Create a batch of Payments — one per APPROVED form in request body; all share batch_id."
    roles: [Finance]
    code: 201
    input: [form_ids, channel]
    output: object
    side_effects: ["create N Payments in PENDING"]

  - method: POST
    path: /payments/{id}/execute
    description: "Execute (or re-execute) a Payment."
    roles: [Finance]
    code: 200
    input: []
    output: Payment
    side_effects: ["PENDING→EXECUTING or RETRYING→EXECUTING; attempt_count += 1"]

  - method: POST
    path: /payments/{id}/result
    description: "Banking callback simulation: posts SUCCESS or FAILED outcome."
    roles: [Finance, system]
    code: 200
    input: [outcome, "external_ref?", "failure_reason?"]
    output: Payment
    side_effects: ["EXECUTING→SUCCESS or EXECUTING→FAILED; on SUCCESS cascade Form APPROVED→PAID and Invoice ATTACHED→CONSUMED", "AuditLog PAYMENT_EVENT"]

  - method: POST
    path: /payments/{id}/retry
    description: "Move FAILED → RETRYING (only if attempt_count < MAX_PAYMENT_ATTEMPTS)."
    roles: [Finance]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: /payments/{id}
    description: "Fetch payment with status and attempt_count."
    roles: [Finance, Applicant, Admin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: /payments
    description: "List payments; supports filter by batch_id, status, form_id."
    roles: [Finance, Admin]
    code: 200
    input: ["batch_id?", "status?", "form_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ----- Audit + ApprovalRecord -----
  - method: GET
    path: /audit-logs
    description: "Stream audit log entries; supports filter by subject_type, subject_id, event_type, since."
    roles: [Admin, Finance]
    code: 200
    input: ["subject_type?", "subject_id?", "event_type?", "since?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  - method: GET
    path: /approval-records
    description: "List approval records; supports filter by subject_type, subject_id, actor_id."
    roles: [Admin, Finance, Applicant]
    code: 200
    input: ["subject_type?", "subject_id?", "actor_id?", "limit?", "offset?"]
    output: ApprovalRecord[]
    side_effects: []

  # ----- Test harness endpoints (per §1.5 testability-completeness) -----
  - method: POST
    path: /_clock/advance
    description: "Test-only: advance server clock by N seconds. Required because trip completion is gated on now() >= max(segment.end_at), and ExpenseStandard versioning is gated on effective_from."
    roles: [Admin]
    code: 200
    input: [seconds]
    output: object
    side_effects: ["Re-evaluate any clock-driven preconditions on the next request."]

  - method: POST
    path: /_external/invoice-verify-result
    description: "Test-only: simulate the tax-authority verification verdict for the next /invoices/{id}/verify-tax call on a specific invoice."
    roles: [Admin]
    code: 200
    input: [invoice_id, verdict]
    output: object
    side_effects: ["Pins outcome (VALID or INVALID) for the queued verify-tax call."]

  - method: POST
    path: /_external/booking-options
    description: "Test-only: seed/clear the policy-eligible option codes for (segment_type, employee_level)."
    roles: [Admin]
    code: 200
    input: [segment_type, employee_level, option_codes]
    output: object
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header absent."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint per RBAC matrix."

  - id: ERR_NOT_CURRENT_APPROVER
    http: 403
    condition: "Approval action arrived at the wrong chain step, or acting Supervisor is not the applicant's supervisor."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource id in path does not exist."

  - id: ERR_REFERENCE_INVALID
    http: 422
    condition: "Body foreign key references a non-existent entity."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state that permits the requested transition (per §1.2)."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH."

  - id: ERR_VALIDATION
    http: 422
    condition: "Body schema, type, enum, or numeric validation failed."

  - id: ERR_NO_ACTIVE_STANDARD
    http: 422
    condition: "No ExpenseStandard row's [effective_from, effective_to) contains the moment of submit for the applicable (city_tier, employee_level)."

  - id: ERR_OPTION_NOT_ELIGIBLE
    http: 422
    condition: "Itinerary option_code is not in the policy-eligible set for (segment_type, applicant.employee_level)."

  - id: ERR_SEGMENT_OUTSIDE_TRIP
    http: 422
    condition: "ItinerarySegment start_at or end_at falls outside [planned_start, planned_end]."

  - id: ERR_SEGMENT_TIME_OVERLAP
    http: 422
    condition: "Two ACTIVE non-HOTEL segments under the same application have strictly-overlapping time intervals."

  - id: ERR_HOTEL_NIGHT_OVERLAP
    http: 422
    condition: "Two ACTIVE HOTEL segments have overlapping [start_at, end_at) night intervals."

  - id: ERR_BUDGET_OVERRUN
    http: 422
    condition: "total_booked_cost would exceed estimated_budget * BUDGET_OVERRUN_FACTOR (1.20)."

  - id: ERR_INVOICE_DUPLICATE
    http: 409
    condition: "Another non-REJECTED Invoice already exists with the same (invoice_code, invoice_number)."

  - id: ERR_INVOICE_NOT_VERIFIED
    http: 422
    condition: "Attempt to attach an Invoice whose ocr_status is not TAX_VERIFIED."

  - id: ERR_INVOICE_NOT_MATCHED
    http: 422
    condition: "ReimbursementItem of category LODGING/TRANSPORTATION lacks a valid matched_segment_id, or invoice_date is not within the segment's date window, or segment-category mismatch."

  - id: ERR_INVOICE_ALREADY_ATTACHED
    http: 409
    condition: "Invoice has ocr_status==ATTACHED already (consumed by another form item)."

  - id: ERR_IDEMPOTENT_REPLAY
    http: 409
    condition: "Idempotency-Key replayed with different request payload, or replay attempted on a non-idempotent endpoint."

  - id: ERR_GM_APPROVAL_REQUIRED
    http: 422
    condition: "Form has requires_special_approval==true at the FINANCE step; FINANCE cannot move it directly to APPROVED."

  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "Payment.amount no longer equals ReimbursementForm.total_reimbursable at execute time (form mutated underneath)."

  - id: ERR_PAYMENT_RETRY_EXHAUSTED
    http: 422
    condition: "Payment retry attempted after attempt_count reached MAX_PAYMENT_ATTEMPTS (3)."

  - id: ERR_INVALID_BATCH
    http: 422
    condition: "Payment-batch request contains duplicate form_ids, unknown form_ids, or any form not in APPROVED."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Employee who files travel applications, books itineraries, uploads invoices, and submits reimbursement forms."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /travel-applications (own only)"
      - "PATCH /travel-applications/{id} (own DRAFT only)"
      - "POST /travel-applications/{id}/submit (own only)"
      - "POST /travel-applications/{id}/cancel (own only)"
      - "POST /travel-applications/{id}/itineraries (own only)"
      - "POST /travel-applications/{id}/itineraries/{segId}/change (own only)"
      - "POST /travel-applications/{id}/itineraries/{segId}/cancel (own only)"
      - "POST /travel-applications/{id}/complete (own only)"
      - "POST /invoices (own only)"
      - "POST /invoices/{id}/ocr (own only)"
      - "POST /reimbursement-forms (own only)"
      - "POST /reimbursement-forms/{id}/items (own only)"
      - "DELETE /reimbursement-forms/{id}/items/{itemId} (own only)"
      - "POST /reimbursement-forms/{id}/submit (own only)"
    shared_operations:
      - "GET /travel-applications/{id}"
      - "GET /travel-applications/{id}/itineraries"
      - "GET /travel-applications/{id}/budget-projection"
      - "GET /invoices/{id}"
      - "GET /reimbursement-forms/{id}"
      - "GET /payments/{id}"
      - "GET /employees/{id}"
      - "GET /approval-records"
      - "GET /expense-standards"
      - "POST /invoices/{id}/verify-tax"

  - name: Supervisor
    description: "Direct line manager of the applicant; performs SUPERVISOR step of the approval chain."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /travel-applications/{id}/approve (chain step == SUPERVISOR)"
      - "POST /travel-applications/{id}/reject"
      - "POST /reimbursement-forms/{id}/approve (chain step == SUPERVISOR)"
      - "POST /reimbursement-forms/{id}/reject"
      - "GET /travel-applications/{id}"
      - "GET /reimbursement-forms/{id}"

  - name: DeptHead
    description: "Department head; performs DEPT_HEAD step."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /travel-applications/{id}/approve (chain step == DEPT_HEAD)"
      - "POST /travel-applications/{id}/reject"
      - "POST /reimbursement-forms/{id}/approve (chain step == DEPT_HEAD)"
      - "POST /reimbursement-forms/{id}/reject"
      - "GET /travel-applications/{id}"
      - "GET /reimbursement-forms/{id}"

  - name: Finance
    description: "Finance officer; performs FINANCE step, runs tax verification, manages payments."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /payments/batches"
      - "POST /payments/{id}/execute"
      - "POST /payments/{id}/retry"
    shared_operations:
      - "POST /travel-applications/{id}/approve (chain step == FINANCE)"
      - "POST /travel-applications/{id}/reject"
      - "POST /reimbursement-forms/{id}/approve (chain step == FINANCE)"
      - "POST /reimbursement-forms/{id}/reject"
      - "POST /invoices/{id}/verify-tax"
      - "GET /travel-applications/{id}/budget-projection"
      - "GET /audit-logs"
      - "GET /approval-records"
      - "POST /payments/{id}/result"
      - "GET /payments"
      - "GET /payments/{id}"

  - name: GeneralManager
    description: "Highest-level approver; performs GM step on large or overseas applications and on over-standard reimbursements."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /travel-applications/{id}/approve (chain step == GM)"
      - "POST /travel-applications/{id}/reject"
      - "POST /reimbursement-forms/{id}/approve (chain step == GM)"
      - "POST /reimbursement-forms/{id}/reject"
      - "GET /travel-applications/{id}"
      - "GET /reimbursement-forms/{id}"

  - name: Admin
    description: "Platform administrator; bootstraps employees, expense standards, and operates test-harness endpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /employees"
      - "POST /expense-standards"
      - "POST /_clock/advance"
      - "POST /_external/invoice-verify-result"
      - "POST /_external/booking-options"
    shared_operations:
      - "GET /employees/{id}"
      - "GET /expense-standards"
      - "GET /travel-applications/{id}"
      - "GET /reimbursement-forms/{id}"
      - "GET /payments"
      - "GET /payments/{id}"
      - "GET /audit-logs"
      - "GET /approval-records"
      - "POST /payments/{id}/result"
