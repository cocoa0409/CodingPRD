            - "Outage.${o1_id}.badged_worker_count == 1 and Outage.${o2_id}.badged_worker_count == 1"
            - "Both workers passed through BADGE_READY: the join fired only once background_status was CLEAR and training_status COMPLETE"

      - name: alara_review_reference_required_only_when_the_flag_is_set
        claim_type: conditional_validation
        grounds: ["validations[priority=11]", "errors[ERR_ALARA_REVIEW_REQUIRED]", "calculations.rwp_committed_dose"]
        distinguishing_aspect: "The rule is gated on the permit's own alara_review_required flag. The heavy permit (collective 625.00 at or above ALARA_REVIEW_THRESHOLD_MREM 300) is rejected without a reference and admitted with one; the light permit (collective 150.00) is admitted with no reference at all, proving the rule is conditional rather than universal."
