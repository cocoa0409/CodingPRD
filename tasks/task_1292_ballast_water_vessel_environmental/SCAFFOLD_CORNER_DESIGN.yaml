# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Enumerative breadth walk of SCAFFOLD.yaml §1.1–§1.7 per claim-extraction-guide taxonomy.
# Instances already exercised by §1.8 appear as excluded_because stubs (no test_recipe).
scaffold_corner_design:

  # ============================================================
  # Section: entities (claim-extraction-guide Table 1)
  # ============================================================
  - section: entities
    instances:
      - name: vessel_create_returns_201_with_computed_defaults
        claim_type: creation
        grounds: [entities.Vessel, "endpoints[POST /vessels]"]
        distinguishing_aspect: "POST /vessels with all required fields returns 201; server mints id, version starts at 1, computed compliance_posture defaults to OPEN, flag_state defaults to US."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vessels"
              payload: { imo_number: "9100001", vessel_name: "MV Avery", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 52000, keel_laid_date: "2009-01-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, ver: $.data.version, posture: $.data.compliance_posture, flag: $.data.flag_state }
          assert:
            - "HTTP 201; ${v} is a server-minted UUID"
            - "${ver} == 1 AND ${posture} == OPEN AND ${flag} == US"

      - name: vessel_create_missing_imo_number_returns_400
        claim_type: required_fields
        grounds: [entities.Vessel.fields.imo_number, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "imo_number is source:input with no default; omitting it is a generic request-body validation failure -> ERR_VALIDATION (400), and no Vessel row is persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vessels"
              payload: { vessel_name: "MV Broken", bwms_type: EXCHANGE_ONLY, gross_tonnage: 10000, keel_laid_date: "2015-01-01T00:00:00Z", ballast_capacity_m3: 5000 }
              as: ShoreComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP 400; GET /vessels returns total_count == 0"

      - name: vessel_create_invalid_bwms_type_returns_400
        claim_type: type_constraints
        grounds: [entities.Vessel.fields.bwms_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "bwms_type is enum [NONE, EXCHANGE_ONLY, TREATMENT_USCG_TYPE_APPROVED, TREATMENT_ALTERNATIVE]; value MAGIC_BWMS is outside the enum -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vessels"
              payload: { imo_number: "9100002", vessel_name: "MV Badenum", bwms_type: MAGIC_BWMS, gross_tonnage: 10000, keel_laid_date: "2015-01-01T00:00:00Z", ballast_capacity_m3: 5000 }
              as: ShoreComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP 400"

      - name: vessel_create_zero_gross_tonnage_returns_400
        claim_type: type_constraints
        grounds: [entities.Vessel.fields.gross_tonnage, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "gross_tonnage constraint is >= 1; value 0 violates the numeric floor -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vessels"
              payload: { imo_number: "9100003", vessel_name: "MV ZeroGT", bwms_type: NONE, gross_tonnage: 0, keel_laid_date: "2015-01-01T00:00:00Z", ballast_capacity_m3: 5000 }
              as: ShoreComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP 400"

      - name: vessel_get_unknown_id_returns_404
        claim_type: not_found
        grounds: [entities.Vessel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed UUID that was never registered resolves no entity -> ERR_NOT_FOUND (404), priority 3 existence."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vessels/123e4567-e89b-42d3-a456-426614174000"
              as: ShoreComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP 404"

      - name: vessel_list_pagination_limit_and_offset
        claim_type: listing
        grounds: ["endpoints[GET /vessels]", response_envelope]
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more per §1.0: with 2 vessels, limit=1 page 0 has total_count 2 and has_more true; offset=1 returns the second vessel with has_more false."
        test_recipe:
          setup: ["Two vessels registered (IMO 9100010, 9100011)"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100010", vessel_name: "MV PageOne", bwms_type: NONE, gross_tonnage: 9000, keel_laid_date: "2014-01-01T00:00:00Z", ballast_capacity_m3: 4000 }
              as: ShoreComplianceOfficer
            - call: "POST /vessels"
              payload: { imo_number: "9100011", vessel_name: "MV PageTwo", bwms_type: NONE, gross_tonnage: 9500, keel_laid_date: "2014-06-01T00:00:00Z", ballast_capacity_m3: 4500 }
              as: ShoreComplianceOfficer
          trigger:
            - call: "GET /vessels?limit=1&offset=0"
              as: FlagSurveyor
            - call: "GET /vessels?limit=1&offset=1"
              as: FlagSurveyor
              captures: { second_name: "$.data[0].vessel_name" }
          assert:
            - "Page 0: total_count == 2, has_more == true, exactly 1 item"
            - "Page 1: has_more == false AND ${second_name} == MV PageTwo"

      - name: vessel_create_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Vessel]
        distinguishing_aspect: "id is server-minted: a client-supplied id in the create body is ignored (not honored, not echoed); the response id differs from the supplied value."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vessels"
              payload: { id: "11111111-2222-4333-8444-555555555555", imo_number: "9100012", vessel_name: "MV IdSeed", bwms_type: NONE, gross_tonnage: 8000, keel_laid_date: "2016-01-01T00:00:00Z", ballast_capacity_m3: 4000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id }
          assert:
            - "HTTP 201"
            - "${v} != 11111111-2222-4333-8444-555555555555 (client-supplied id ignored)"

      - name: ballast_event_immutability_no_version_field
        claim_type: immutability
        grounds: [entities.BallastWaterEvent]
        distinguishing_aspect: "BallastWaterEvent declares common_fields: false — the append-only event row carries id and created_at only; responses expose no version/updated_at and §1.5 declares no PUT/PATCH/DELETE for ballast-events."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9201 IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9100013", vessel_name: "MV Cormorant", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9201", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: $.data.version }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 100, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
              captures: { ev: $.data.id }
          assert:
            - "BallastWaterEvent.${ev} response contains id and created_at but no version and no updated_at key"
            - "§1.5 declares no update/delete endpoint for ballast-events (append-only log)"

      - name: voyage_under_wrong_vessel_returns_404
        claim_type: parent_relationships
        grounds: [entities.Voyage.fields.vessel_id, "validations[priority=3]"]
        distinguishing_aspect: "Hierarchical path segments must form a valid ancestor chain: voyage V9202 belongs to vessel A; addressing it under vessel B's path fails existence -> ERR_NOT_FOUND (404), not a cross-reference leak."
        test_recipe:
          setup: ["Vessels A (IMO 9100014) and B (IMO 9100015); voyage V9202 created under vessel A"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100014", vessel_name: "MV Dunlin", bwms_type: NONE, gross_tonnage: 8000, keel_laid_date: "2016-01-01T00:00:00Z", ballast_capacity_m3: 4000 }
              as: ShoreComplianceOfficer
              captures: { vA: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "9100015", vessel_name: "MV Egret", bwms_type: NONE, gross_tonnage: 8200, keel_laid_date: "2016-03-01T00:00:00Z", ballast_capacity_m3: 4200 }
              as: ShoreComplianceOfficer
              captures: { vB: $.data.id }
            - call: "POST /vessels/${vA}/voyages"
              payload: { voyage_number: "V9202", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: false, enters_us_eez: true }
              as: ShoreComplianceOfficer
              captures: { vy: $.data.id }
          trigger:
            - call: "GET /vessels/${vB}/voyages/${vy}"
              as: PSCOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP 404; no Voyage data leaks across the ancestor chain"

      - name: standing_record_book_defaults_open_without_voyage
        claim_type: defaults
        grounds: [entities.RecordBook, "endpoints[POST /vessels/{vessel_id}/record-books]"]
        distinguishing_aspect: "Standing (non-ballast) record books are created with status OPEN and voyage_id null when the optional voyage_id is omitted; BALLAST_WATER books are never creatable via this endpoint's declared intent (auto-created per voyage)."
        test_recipe:
          setup: ["Vessel MV Gadwall registered"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100016", vessel_name: "MV Gadwall", bwms_type: NONE, gross_tonnage: 8000, keel_laid_date: "2016-01-01T00:00:00Z", ballast_capacity_m3: 4000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id }
          trigger:
            - call: "POST /vessels/${v}/record-books"
              payload: { book_kind: GARBAGE }
              as: VesselMaster
              captures: { book: $.data.id, st: $.data.status, vyid: $.data.voyage_id }
          assert:
            - "HTTP 201; ${st} == OPEN"
            - "${vyid} is null (standing ship-level book)"

  # ============================================================
  # Section: state_machines (claim-extraction-guide Table 2)
  # ============================================================
  - section: state_machines
    instances:
      - name: voyage_created_with_initial_parallel_states
        claim_type: initial_state
        grounds: [state_machines.Voyage]
        distinguishing_aspect: "A newly created voyage starts at PENDING (compliance_status) x NOT_DUE (reporting_status), version 1, before any depart action."
        test_recipe:
          setup: ["Vessel MV Harlequin registered"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100017", vessel_name: "MV Harlequin", bwms_type: NONE, gross_tonnage: 8000, keel_laid_date: "2016-01-01T00:00:00Z", ballast_capacity_m3: 4000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id }
          trigger:
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9301", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: false, enters_us_eez: true }
              as: VesselMaster
              captures: { cs: $.data.compliance_status, rs: $.data.reporting_status, ver: $.data.version }
          assert:
            - "${cs} == PENDING AND ${rs} == NOT_DUE AND ${ver} == 1"

      - name: plan_supersede_on_higher_revision_approval
        claim_type: side_effect_execution
        grounds: [state_machines.BallastWaterManagementPlan.SUBMITTED_to_APPROVED, state_machines.BallastWaterManagementPlan.APPROVED_to_SUPERSEDED]
        distinguishing_aspect: "Approving plan rev2 cascades: rev1 APPROVED -> SUPERSEDED, rev2 becomes governing plan, and every non-terminal voyage gets a fresh ComplianceDetermination with trigger_reason PLAN_AMENDMENT marked is_current."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with plan rev1 APPROVED; voyage V9302 IN_PROGRESS (one departure determination exists)"
            - "Plan rev2 created, submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9100018", vessel_name: "MV Indigo", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9302", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { v_ver2: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 2, approval_authority: USCG, approved_at: "2026-07-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver2}" }
              as: ShoreComplianceOfficer
              captures: { p2: $.data.id }
            - call: "POST /vessels/${v}/plans/${p2}/submit"
              as: ShoreComplianceOfficer
          trigger:
            - call: "POST /vessels/${v}/plans/${p2}/approve"
              as: FlagSurveyor
              captures: { p2_st: $.data.status }
            - call: "GET /vessels/${v}/plans"
              payload: { status: SUPERSEDED }
              as: FlagSurveyor
              captures: { sup_id: "$.data[0].id" }
            - call: "GET /vessels/${v}/voyages/${vy}/determinations"
              as: FlagSurveyor
              captures: { d_reason: "$.data[0].trigger_reason", d_cur: "$.data[0].is_current" }
          assert:
            - "${p2_st} == APPROVED"
            - "${sup_id} == ${p1} (prior APPROVED plan superseded by cascade)"
            - "${d_reason} == PLAN_AMENDMENT AND ${d_cur} == true (determinations recomputed for non-terminal voyages)"

      - name: plan_withdraw_from_submitted_succeeds
        claim_type: valid_transition
        grounds: [state_machines.BallastWaterManagementPlan.SUBMITTED_to_WITHDRAWN]
        distinguishing_aspect: "A SUBMITTED plan can be withdrawn by ShoreComplianceOfficer -> WITHDRAWN (terminal); withdraw carries no side effects."
        test_recipe:
          setup: ["Vessel with plan rev1 SUBMITTED"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100019", vessel_name: "MV Jackdaw", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
          trigger:
            - call: "POST /vessels/${v}/plans/${p1}/withdraw"
              as: ShoreComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "${st} == WITHDRAWN"

      - name: plan_withdraw_from_approved_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.BallastWaterManagementPlan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is reachable only from DRAFT or SUBMITTED; withdrawing an APPROVED plan violates the state precondition -> ERR_INVALID_STATE (409), plan stays APPROVED."
        test_recipe:
          setup: ["Vessel with plan rev1 APPROVED"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100020", vessel_name: "MV Kittiwake", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
          trigger:
            - call: "POST /vessels/${v}/plans/${p1}/withdraw"
              as: ShoreComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP 409; BallastWaterManagementPlan.${p1}.status unchanged == APPROVED"

      - name: plan_approve_from_draft_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.BallastWaterManagementPlan.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approval requires status == SUBMITTED; approving a DRAFT plan is an invalid-from transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Vessel with plan rev1 in DRAFT"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100021", vessel_name: "MV Lapwing", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP 409"

      - name: plan_submit_twice_returns_409
        claim_type: idempotency
        grounds: [state_machines.BallastWaterManagementPlan.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submit is not idempotent: the same trigger twice — the second hits a SUBMITTED plan, for which submit is not a declared transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Vessel with plan rev1 SUBMITTED (submitted once)"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100022", vessel_name: "MV Magpie", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
          trigger:
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
