          - errors[ERR_OPEN_CYCLE_EXISTS]
        distinguishing_aspect: |
          At most one non-CLOSED cycle per program, so a different cycle_year is
          not a way around the rule; the refusal also leaves the program's
          lifecycle_state at UNDER_REVIEW rather than re-cascading it.
        test_recipe:
          setup:
            - "Program HIST-BA with one cycle for 2026 in state SELF_STUDY_OPEN."
