# =============================================================================
# §1.8 Scaffold Difficulty Design — Parametric & Index-Based Insurance
# 9 rule_ids x 2 instances each = 18 instances.
# All formula-derived assertion literals were pre-computed by executing the
# §1.3 formulas (round_half_up, integer cents).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: payout_provisional_forward_vs_final_chronological_capped
        grounds:
          - calculations.provisional_payout
          - calculations.final_payout
          - state_machines.PayoutClaim.GENERATED_to_APPROVED
        distinguishing_aspect: |
          Same claim data (sum_insured 2,000,000, tier 2 fraction 0.50), two valid
          algorithms on the PayoutClaim domain: the forward-looking provisional
          variant yields 1,000,000 at GENERATED, while the chronological capped
          variant at approval yields 0 because a prior APPROVED tier-3 claim in
          the same coverage year already consumed the full 2,000,000 per-year
          aggregate cap — min(1,000,000, max(0, 2,000,000 - 2,000,000)) = 0.
        test_recipe:
          setup:
            - "Program ACTIVE with ADMITTED_INSURANCE classification and exposure_limit 100,000,000"
            - "Index ACTIVE, strike BELOW, thresholds t1<=50mm/0.25 t2<=30mm/0.50 t3<=20mm/1.00, freq 0.20 elr 0.60"
            - "One COMMISSIONED PHYSICAL_STATION weight 1.0"
            - "Policyholder ACTIVE (acknowledged), policy sum_insured 2,000,000 BOUND; invoice 306,000 PAID"
            - "Claim1 APPROVED with final_payout_cents = 2,000,000 (tier-3 event window 2026-06-30 observed at 15mm)"
            - "Second breaching window 2026-07-31 observed at 30mm -> event2 tier 2 -> claim2 GENERATED with provisional 1,000,000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-DV1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-2026-A", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-P1", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-RAIN-1", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-001", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 }, { tier: 2, threshold_value: 30, payout_fraction: 0.5 }, { tier: 3, threshold_value: 20, payout_fraction: 1.0 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "Holder DV1", tax_id: "T-DV1", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_id}" }
              as: ServicingAgent
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: 306000 }
              as: ServicingAgent
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st_id}", window_end_date: "2026-06-30", measured_value: 15 }
              as: DataOperations
            - call: "GET /programs/${prog_id}/trigger-events"
              payload: { index_definition_id: "${idx_id}" }
              as: ClaimsAdjuster
              captures: { ev1_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev1_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev1_id}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /programs/${prog_id}/claims"
              payload: { trigger_event_id: "${ev1_id}" }
              as: ClaimsAdjuster
              captures: { claim1_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/claims/${claim1_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st_id}", window_end_date: "2026-07-31", measured_value: 30 }
              as: DataOperations
            - call: "GET /programs/${prog_id}/trigger-events"
              payload: { index_definition_id: "${idx_id}", status: "DETECTED" }
              as: ClaimsAdjuster
              captures: { ev2_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev2_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev2_id}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /programs/${prog_id}/claims"
              payload: { trigger_event_id: "${ev2_id}" }
              as: ClaimsAdjuster
              captures: { claim2_id: "$.data[0].id", claim2_prov: "$.data[0].provisional_payout_cents" }
          trigger:
            - call: "POST /programs/${prog_id}/claims/${claim2_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
            - call: "GET /programs/${prog_id}/claims/${claim2_id}"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "claim2 provisional_payout_cents (captured ${claim2_prov}) == 1000000 (forward-looking variant, uncapped tier-2 fraction 0.50 on si 2,000,000)"
            - "PayoutClaim.${claim2_id}.final_payout_cents == 0 (chronological capped variant: min(1000000, max(0, 2000000 - 2000000 prior APPROVED tier-3)))"
            - "PayoutClaim.${claim2_id}.final_payout_cents != PayoutClaim.${claim2_id}.provisional_payout_cents"
            - "PayoutClaim.${claim2_id}.status == APPROVED (cap-clamped to zero is still a valid approval outcome)"

      - name: premium_loading_vs_cession_rounding_divergence
        grounds:
          - calculations.premium_pricing
          - calculations.cession_allocation
        distinguishing_aspect: |
          Two dual-variant computations on different entity domains than payouts:
          premium_pricing on ParametricPolicy applies loading-then-tax in pinned
          order (SURPLUS_LINES: 1,000,000 * 0.10 * 0.50 = 50,000 pure; *1.35 =
          67,500 premium; tax on loaded 67,500 * 0.05 = 3,375 — NOT tax on pure),
          while cession_allocation on ReinsuranceTreaty rounds per-treaty then sums
          (a 333,333 final payout at 33% rounds to 110,000 per treaty before sum,
          diverging from sum-then-round on fractional input).
        test_recipe:
          setup:
            - "Program ACTIVE, SURPLUS_LINES, exposure_limit 100,000,000"
            - "Index ACTIVE BELOW t1<=50/0.25; freq 0.10 elr 0.50; one COMMISSIONED PHYSICAL station w=1.0"
            - "Holder ACTIVE; policy A sum_insured 1,000,000 (premium trap case) and policy B sum_insured 333,333 both BOUND"
            - "Treaty ACTIVE: 33%, attachment 0, limit 10,000,000"
            - "Policy B claim with final 333,333 approved and ready to release"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-DV2", peril_type: "WINDSPEED", regulatory_classification: "SURPLUS_LINES", contract_wording_version: "CW-2026-S", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-DV2", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-WIND-2", measurement_unit: "m/s", aggregation_window_days: 7, data_source_agreement_ref: "DSA-002", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 1.0 } ], strike_direction: "BELOW", historical_breach_frequency: 0.1, expected_loss_ratio: 0.5 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
              captures: { prog_v_after_activate: $.data.version }
            - call: "POST /programs/${prog_id}/treaties"
              payload: { treaty_name: "TR-33", ceded_percentage: 33, attachment_point_cents: 0, treaty_limit_cents: 10000000 }
              as: ProgramManager
              captures: { treaty_id: $.data.id }
            - call: "POST /programs/${prog_id}/treaties/${treaty_id}/bind-treaty"
              payload: { expected_program_version: "${prog_v_after_activate}" }
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "Holder DV2", tax_id: "T-DV2", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 1000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_a_id: $.data.id, pol_a_premium: $.data.premium_cents, pol_a_tax: $.data.premium_tax_cents }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_a_id}" }
              as: ServicingAgent
              captures: { inv_a_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/invoices/${inv_a_id}/payments"
              payload: { amount_cents: 70875 }
              as: ServicingAgent
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_a_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 333333, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_b_id: $.data.id }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_b_id}" }
              as: ServicingAgent
              captures: { inv_b_id: "$.data[0].id", inv_b_amount: "$.data[0].invoice_amount_cents" }
            - call: "POST /programs/${prog_id}/invoices/${inv_b_id}/payments"
              payload: { amount_cents: "${inv_b_amount}" }
              as: ServicingAgent
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_b_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st_id}", window_end_date: "2026-06-30", measured_value: 40 }
              as: DataOperations
            - call: "GET /programs/${prog_id}/trigger-events"
              payload: { index_definition_id: "${idx_id}" }
              as: ClaimsAdjuster
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /programs/${prog_id}/claims"
              payload: { policy_id: "${pol_b_id}" }
              as: ClaimsAdjuster
              captures: { claim_b_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/claims/${claim_b_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
          trigger:
            - call: "POST /programs/${prog_id}/claims/${claim_b_id}/release-payment"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "treasury-9"
            - call: "GET /programs/${prog_id}/claims/${claim_b_id}"
              payload: {}
              as: TreasuryOfficer
          assert:
            - "ParametricPolicy.${pol_a_id} premium (captured ${pol_a_premium}) == 67500 (loading on pure 50000 at 35% SURPLUS; tax-on-loaded order pinned)"
            - "ParametricPolicy.${pol_a_id} premium_tax (captured ${pol_a_tax}) == 3375 (5% of 67500 loaded premium, not of pure 50000)"
            - "PayoutClaim.${claim_b_id}.final_payout_cents == 333333 (tier1 fraction 1.0 on si 333333, uncapped first claim)"
            - "PayoutClaim.${claim_b_id}.ceded_recovery_cents == 110000 (round_half_up(333333*33/100) per-treaty-then-sum)"
            - "PayoutClaim.${claim_b_id}.net_payment_cents == 223333"
            - "PayoutClaim.${claim_b_id}.status == RECOVERY_CEDED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes (a)/(b)/(c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: premium_pricing_mode_a_multibranch_formula
        grounds:
          - calculations.premium_pricing
          - entities.ParametricPolicy.fields.premium_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >= 3 inputs and conditional branch on
          program.regulatory_classification: same sum_insured and same index
          distribution (freq 0.20, elr 0.60, si 2,000,000 -> pure 240,000) prices
          to premium 300,000 + tax 6,000 under ADMITTED_INSURANCE, versus
          324,000 + tax 16,200 under SURPLUS_LINES — only the classification
          branch differs, proving non-linear interaction of the classification
          input with loading and tax tiers.
        test_recipe:
          setup:
            - "Two programs, ADMITTED (PRG-CF-A) and SURPLUS (PRG-CF-S), both ACTIVE with identical index parameters (freq 0.20, elr 0.60)"
            - "One ACTIVE holder in each; quoting identical policies sum_insured 2,000,000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-CF-A", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-A", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_a: $.data.id }
            - call: "POST /programs/${prog_a}/stations"
              payload: { station_code: "ST-A", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_a}/index-definitions"
              payload: { index_code: "IDX-A", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-A", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_a: $.data.id }
            - call: "POST /programs/${prog_a}/index-definitions/${idx_a}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_a}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_a}/policyholders"
              payload: { legal_name: "H-A", tax_id: "T-A", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_a: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "PRG-CF-S", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "SURPLUS_LINES", contract_wording_version: "CW-S", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_s: $.data.id }
            - call: "POST /programs/${prog_s}/stations"
              payload: { station_code: "ST-S", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_s}/index-definitions"
              payload: { index_code: "IDX-S", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-S", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_s: $.data.id }
            - call: "POST /programs/${prog_s}/index-definitions/${idx_s}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_s}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_s}/policyholders"
              payload: { legal_name: "H-S", tax_id: "T-S", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_s: $.data.id }
          trigger:
            - call: "POST /programs/${prog_a}/policyholders/${holder_a}/policies"
              payload: { index_definition_id: "${idx_a}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_a: $.data.id, prem_a: $.data.premium_cents, tax_a: $.data.premium_tax_cents }
            - call: "POST /programs/${prog_s}/policyholders/${holder_s}/policies"
              payload: { index_definition_id: "${idx_s}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_s: $.data.id, prem_s: $.data.premium_cents, tax_s: $.data.premium_tax_cents }
          assert:
            - "ADMITTED branch: premium ${prem_a} == 300000 (240000 * 1.25) and tax ${tax_a} == 6000 (2% of loaded)"
            - "SURPLUS branch: premium ${prem_s} == 324000 (240000 * 1.35) and tax ${tax_s} == 16200 (5% of loaded)"
            - "prem_a != prem_s although pure premium inputs identical — classification branch alone drives divergence"

      - name: cession_waterfall_mode_b_rounding_order
        grounds:
          - calculations.cession_allocation
          - entities.PayoutClaim.fields.ceded_recovery_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the scaffold pins
          round-per-treaty-THEN-sum. Claim final 333,333 with two treaties
          (T1 33% attachment 0; T2 10% attachment 100,000) yields
          rhu(333,333*0.33)=110,000 plus rhu(233,333*0.10)=23,333 -> total
          133,333; sum-then-round of the unrounded products (109,999.89 +
          23,333.30 = 133,333.19) would round to the same 133,333 here, so the
          instance additionally asserts the per-treaty recovered_to_date_cents
          values 110,000 and 23,333 individually, which only per-treaty rounding
          produces.
        test_recipe:
          setup:
            - "Program ACTIVE, DERIVATIVE_CONTRACT (tax 0 to keep invoice arithmetic trivial), exposure 100,000,000"
            - "Index ACTIVE BELOW t1<=50/1.00 freq 0.10 elr 0.50; PHYSICAL station w 1.0"
            - "Two ACTIVE treaties: T1 33%/attachment 0/limit 10,000,000 (created first), T2 10%/attachment 100,000/limit 10,000,000 (created second)"
            - "Holder ACTIVE; policy si 333,333 BOUND; breaching observation 40 on 2026-06-30; claim approved (final 333,333)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-CF-B", peril_type: "EARTHQUAKE_MAGNITUDE", regulatory_classification: "DERIVATIVE_CONTRACT", contract_wording_version: "CW-D", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-B", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-B", measurement_unit: "Mw", aggregation_window_days: 1, data_source_agreement_ref: "DSA-B", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 1.0 } ], strike_direction: "BELOW", historical_breach_frequency: 0.1, expected_loss_ratio: 0.5 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/treaties"
              payload: { treaty_name: "T1-33", ceded_percentage: 33, attachment_point_cents: 0, treaty_limit_cents: 10000000 }
              as: ProgramManager
              captures: { t1_id: $.data.id }
            - call: "POST /programs/${prog_id}/treaties"
              payload: { treaty_name: "T2-10", ceded_percentage: 10, attachment_point_cents: 100000, treaty_limit_cents: 10000000 }
              as: ProgramManager
              captures: { t2_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { prog_v: $.data.version }
            - call: "POST /programs/${prog_id}/treaties/${t1_id}/bind-treaty"
              payload: { expected_program_version: "${prog_v}" }
              as: ProgramManager
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { prog_v2: $.data.version }
            - call: "POST /programs/${prog_id}/treaties/${t2_id}/bind-treaty"
              payload: { expected_program_version: "${prog_v2}" }
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "H-B", tax_id: "T-B", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 333333, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "GET /programs/${prog_id}/invoices"
              payload: { policy_id: "${pol_id}" }
              as: ServicingAgent
              captures: { inv_id: "$.data[0].id", inv_amount: "$.data[0].invoice_amount_cents" }
            - call: "POST /programs/${prog_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: "${inv_amount}" }
              as: ServicingAgent
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/observations"
              payload: { station_id: "${st_id}", window_end_date: "2026-06-30", measured_value: 40 }
              as: DataOperations
            - call: "GET /programs/${prog_id}/trigger-events"
