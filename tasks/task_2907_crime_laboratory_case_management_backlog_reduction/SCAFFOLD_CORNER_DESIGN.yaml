            - "Case C1 (OTHER) ACCEPTED with two DIGITAL_DEVICE vault items; requests R4 (item_count 4) and R3 (item_count 3) are QUEUED."
            - "Hand-executed formula for R4: base 25000*4 = 100000; rush 0; tier_basis 100000 >= 100000 so pct 0.04; discount round_half_up(100000 * 0.04) = 4000; award 96000."
            - "Hand-executed formula for R3: base 75000; tier_basis 75000 < 100000 so pct 0.00; discount 0; award 75000. Ledger: 96000 + 75000 = 171000 <= 1000000."
