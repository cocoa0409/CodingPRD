          rationale: "S1's +25c delta equal to LINE_TOLERANCE_CENTS is asserted MATCHED inside that §1.8 instance (tolerance inclusive boundary)."
      - name: protection_start_inclusive_boundary
        claim_type: precision
        grounds: ["calculations.order_line_commission", "entities.ProjectRegistration.fields.protection_start"]
        excluded_because:
          difficulty_instance: line_commission_rate_stack_protected
          rationale: "PO-P is placed exactly at protection_start and asserted protected (1200bp / 60,000c) in that §1.8 instance."
      - name: termination_cascade_registration_expiry
        claim_type: side_effect_execution
        grounds: ["state_machines.Principal.NOTICE_PENDING_to_TERMINATED"]
        excluded_because:
