scenario: |
  Cost Basis Reporting & Wash Sale Tracking (brokerage tax reporting group): lot
  selection method & default disposal order, corporate action basis adjustment,
  transfer statement receipt/delivery for moved positions, wash sale detection
  across accounts & disallowed loss deferral, covered vs noncovered classification,
  1099-B generation & correction cycle, gifted/inherited basis rules, customer
  basis change requests.

domain_name: cost-basis-wash-sale-tracking
api_prefix: /firms

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BrokerageFirm
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Firm legal name" }
      - { name: tax_year_open, type: integer, source: system, default: 2025, description: "Earliest tax year whose books are still open for new transactions" }
      - { name: wash_sale_window_days, type: integer, source: system, default: 30, description: "Regulatory wash-sale half-window in days (full window is 2*30+1=61 days inclusive)" }
      - { name: correction_deadline_days, type: integer, source: system, default: 1095, description: "Statute-of-limitations days after FILED within which a 1099-B correction may be issued" }

  - name: Customer
    parent: BrokerageFirm
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: taxpayer_tin, type: string, source: input, description: "Taxpayer identification number; unique per firm" }
      - { name: display_name, type: string, source: input, description: "Customer display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: wash_sale_scope_key, type: string, source: computed, description: "Cross-account wash-sale aggregation key; equals taxpayer_tin" }

  - name: Account
    parent: Customer
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: account_number, type: string, source: input, description: "Unique per firm" }
      - { name: account_type, type: enum, source: input, description: "TAXABLE | IRA | ROTH_IRA (IRAs can themselves trigger wash sales that taint a taxable account's loss)" }
      - { name: default_disposal_method, type: enum, source: input, default: FIFO, description: "FIFO | LIFO | HIFO | SPECIFIC_ID — the account's default lot-selection method" }
      - { name: status, type: enum, source: system, description: "OPEN | RESTRICTED | CLOSED" }

  - name: Security
    parent: BrokerageFirm
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: cusip, type: string, source: input, description: "9-char CUSIP; unique per firm" }
      - { name: ticker, type: string, source: input, description: "Ticker symbol" }
      - { name: security_type, type: enum, source: input, description: "EQUITY | CORPORATE_BOND | OPTION | MUTUAL_FUND" }
      - { name: covered_security_effective_date, type: datetime, source: input, description: "Acquisitions on/after this date produce covered lots (per IRC 6045 phase-in: equities 2011-01-01, mutual funds 2012-01-01, options/bonds 2014-01-01)" }

  - name: TaxLot
    parent: Account
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id" }
      - { name: acquisition_date, type: datetime, source: input, description: "Trade date of the acquisition (drives covered/noncovered + short/long-term)" }
      - { name: quantity, type: number, source: input, description: "Original share quantity (may be fractional)" }
      - { name: quantity_remaining, type: number, source: computed, description: "Shares not yet disposed; decremented by disposition lot-allocations" }
      - { name: original_cost_basis_cents, type: integer, source: input, description: "Total cost paid for the original quantity, in cents" }
      - { name: adjusted_cost_basis_cents, type: integer, source: computed, description: "Cost basis after corporate-action adjustments and wash-sale deferrals, in cents" }
      - { name: acquisition_kind, type: enum, source: input, default: PURCHASE, description: "PURCHASE | GIFT | INHERITANCE | TRANSFER_IN | CORPORATE_ACTION_DERIVED" }
      - { name: gift_donor_basis_cents, type: integer, source: input, description: "For acquisition_kind=GIFT: donor's adjusted basis at gift date; required for GIFT" }
      - { name: gift_fmv_cents_at_gift, type: integer, source: input, description: "For acquisition_kind=GIFT: FMV per share times quantity at gift date; required for GIFT" }
      - { name: inherited_fmv_cents_at_death, type: integer, source: input, description: "For acquisition_kind=INHERITANCE: FMV at date of death (stepped-up basis); required for INHERITANCE" }
      - { name: holding_period_start, type: datetime, source: computed, description: "Effective start of holding period (for INHERITANCE always LONG; for wash-sale-tainted replacement lots, tacks on the sold lot's holding period)" }
      - { name: wash_sale_taint_basis_cents, type: integer, source: computed, default: 0, description: "Cumulative deferred loss (in cents) added to this lot from wash-sale events on OTHER lots" }
      - { name: covered_status, type: enum, source: computed, description: "COVERED | NONCOVERED — derived from acquisition_date vs Security.covered_security_effective_date" }
      - { name: lot_status, type: enum, source: system, description: "OPEN | PARTIALLY_DISPOSED | FULLY_DISPOSED | SUPERSEDED (by corporate action)" }
      - { name: superseded_by_action_id, type: string, source: system, description: "FK -> CorporateAction.id; set when this lot was replaced by derived lots from a corporate action" }

  - name: Disposition
    parent: Account
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id" }
      - { name: trade_date, type: datetime, source: input, description: "Trade date of the sale" }
      - { name: settlement_date, type: datetime, source: input, description: "Settlement date (T+1 for equities); the disposition is FINALIZED at settlement" }
      - { name: quantity, type: number, source: input, description: "Shares sold" }
      - { name: proceeds_cents, type: integer, source: input, description: "Gross proceeds in cents" }
      - { name: method, type: enum, source: input, description: "FIFO | LIFO | HIFO | SPECIFIC_ID — override of Account.default_disposal_method for this sale; SPECIFIC_ID requires lot_allocations" }
      - { name: lot_allocations, type: array, source: input, description: "For SPECIFIC_ID: [{lot_id, quantity}] pairs; ignored otherwise" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED | CORRECTED | VOIDED" }
      - { name: realized_gain_cents, type: integer, source: computed, description: "proceeds_cents - sum(allocated adjusted basis); set at SETTLED" }
      - { name: is_wash_sale_flag, type: boolean, source: computed, default: false, description: "Set when any lot allocation is flagged as a wash-sale loss" }
      - { name: wash_sale_disallowed_loss_cents, type: integer, source: computed, default: 0, description: "Total disallowed loss deferred to replacement lots" }

  - name: CorporateAction
    parent: Security
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; the source (pre-action) security" }
      - { name: action_type, type: enum, source: input, description: "SPLIT | REVERSE_SPLIT | MERGER | SPINOFF" }
      - { name: effective_date, type: datetime, source: input, description: "Date the action takes effect" }
      - { name: split_ratio_numerator, type: number, source: input, description: "For SPLIT/REVERSE_SPLIT: new-shares-per-old numerator (e.g. 2 for 2:1 split, 1 for 1:5 reverse)" }
      - { name: split_ratio_denominator, type: number, source: input, description: "For SPLIT/REVERSE_SPLIT: denominator (e.g. 1 for 2:1, 5 for 1:5 reverse)" }
      - { name: merger_acquirer_security_id, type: string, source: input, description: "For MERGER/SPINOFF: FK -> Security.id of the resulting/acquirer security" }
      - { name: merger_cash_per_share_cents, type: integer, source: input, description: "For MERGER: cash boot paid per source share (taxable to extent of gain)" }
      - { name: merger_shares_per_source_share, type: number, source: input, description: "For MERGER/SPINOFF: shares of acquirer security per source share" }
      - { name: spinoff_cost_allocation_pct, type: number, source: input, description: "For SPINOFF: fraction (0..1) of pre-action basis allocated to the spun-off security" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | EFFECTIVE | CANCELLED" }

  - name: TransferStatement
    parent: Account
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the account sending or receiving the position" }
      - { name: direction, type: enum, source: input, description: "INBOUND | OUTBOUND" }
      - { name: counterparty_firm_name, type: string, source: input, description: "External broker name" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id" }
      - { name: quantity, type: number, source: input, description: "Shares transferred" }
      - { name: transfer_date, type: datetime, source: input, description: "Date the transfer executed" }
      - { name: lots_payload, type: array, source: input, description: "Array of {acquisition_date, quantity, original_cost_basis_cents} describing the basis detail received from / delivered to the counterparty; required before DELIVERED" }
      - { name: status, type: enum, source: system, description: "PENDING | DELIVERED | ACCEPTED | REJECTED | SUPERSEDED" }
      - { name: replaces_statement_id, type: string, source: input, description: "FK -> TransferStatement.id; when set, this statement supersedes an earlier one (the earlier flips to SUPERSEDED)" }

  - name: WashSaleEvent
    parent: Disposition
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: disposition_id, type: string, source: system, description: "FK -> Disposition.id; the loss sale that triggered the wash sale" }
      - { name: triggering_lot_id, type: string, source: system, description: "FK -> TaxLot.id; the replacement acquisition that caused the wash sale (may live in a DIFFERENT Account under the same Customer.wash_sale_scope_key)" }
      - { name: sold_lot_id, type: string, source: system, description: "FK -> TaxLot.id; the lot whose loss is disallowed" }
      - { name: disallowed_loss_cents, type: integer, source: computed, description: "Loss amount deferred onto triggering_lot" }
      - { name: wash_sale_window_start, type: datetime, source: computed, description: "trade_date - wash_sale_window_days" }
      - { name: wash_sale_window_end, type: datetime, source: computed, description: "trade_date + wash_sale_window_days (inclusive)" }
      - { name: matching_rule, type: enum, source: computed, description: "SHARE_FOR_SHARE | PARTIAL_PRORATA — how the loss was allocated when replacement quantity != sold quantity" }

  - name: TaxForm1099B
    parent: Customer
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year of the form" }
      - { name: status, type: enum, source: system, description: "DRAFT | GENERATED | FILED | CORRECTION_PENDING | REFILED | FROZEN" }
      - { name: short_term_proceeds_cents, type: integer, source: computed, description: "Sum of proceeds from covered short-term dispositions" }
      - { name: short_term_basis_cents, type: integer, source: computed, description: "Sum of adjusted basis (after wash-sale deferral) for covered short-term dispositions" }
      - { name: short_term_gain_cents, type: integer, source: computed, description: "= short_term_proceeds_cents - short_term_basis_cents" }
      - { name: long_term_proceeds_cents, type: integer, source: computed, description: "Sum of proceeds from covered long-term dispositions" }
      - { name: long_term_basis_cents, type: integer, source: computed, description: "Sum of adjusted basis for covered long-term dispositions" }
      - { name: long_term_gain_cents, type: integer, source: computed, description: "= long_term_proceeds_cents - long_term_basis_cents" }
      - { name: disallowed_wash_sale_loss_cents, type: integer, source: computed, description: "Sum of wash_sale_disallowed_loss_cents over the year's dispositions (reported in Box 1g)" }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp the form was first filed" }
      - { name: correction_count, type: integer, source: system, default: 0, description: "Number of corrections issued; each REFILED increments" }
      - { name: generated_from_version, type: integer, source: system, description: "Customer.version at the moment the form was generated; if Customer.version advances while FILED, the form becomes stale" }

  - name: BasisChangeRequest
    parent: Customer
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> BrokerageFirm.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: tax_lot_id, type: string, source: input, description: "FK -> TaxLot.id being re-classified or re-priced" }
      - { name: request_kind, type: enum, source: input, description: "COVERAGE_RECLASS | BASIS_AMOUNT_CORRECTION | ACQUISITION_DATE_CORRECTION | GIFT_BASIS_SUPPLY" }
      - { name: proposed_basis_cents, type: integer, source: input, description: "For BASIS_AMOUNT_CORRECTION and GIFT_BASIS_SUPPLY" }
      - { name: proposed_acquisition_date, type: datetime, source: input, description: "For ACQUISITION_DATE_CORRECTION and COVERAGE_RECLASS" }
      - { name: proposed_coverage, type: enum, source: input, description: "For COVERAGE_RECLASS: COVERED | NONCOVERED" }
      - { name: gift_donor_basis_cents, type: integer, source: input, description: "For GIFT_BASIS_SUPPLY" }
      - { name: gift_fmv_cents_at_gift, type: integer, source: input, description: "For GIFT_BASIS_SUPPLY" }
      - { name: supporting_doc_ref, type: string, source: input, description: "Reference to supporting documentation" }
      - { name: status, type: enum, source: system, description: "PENDING | UNDER_REVIEW | APPROVED | APPLIED | REJECTED | RESUBMITTED" }
      - { name: approved_by_user_id, type: string, source: system, description: "TaxOps user who approved (segregation-of-duties: APPLIED must be by a DIFFERENT user)" }
      - { name: applied_by_user_id, type: string, source: system, description: "TaxOps user who applied the change" }
      - { name: version_applied_to, type: integer, source: system, description: "TaxLot.version at the moment APPROVED was granted; the APPLY step OCC-checks this" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /firms/{firmId}/customers/{customerId}/suspend"
        actor: FirmAdmin
        preconditions: []
        side_effects:
          - "All OPEN/PARTIALLY_DISPOSED TaxLots under this Customer's Accounts are still readable, but new Dispositions are rejected with ERR_CUSTOMER_SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /firms/{firmId}/customers/{customerId}/reinstate"
        actor: FirmAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /firms/{firmId}/customers/{customerId}/close"
        actor: FirmAdmin
        preconditions:
          - "Every Account under this Customer must be in CLOSED state (ERR_CUSTOMER_HAS_OPEN_ACCOUNTS)"
          - "No BasisChangeRequest under this Customer is in PENDING or UNDER_REVIEW or APPROVED (ERR_PENDING_BASIS_REQUESTS)"
        side_effects:
          - "Customer.version += 1 (cascades stale every non-REFILED TaxForm1099B whose generated_from_version is now stale)"

  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /firms/{firmId}/accounts/{accountId}/restrict"
        actor: FirmAdmin | TaxOps
        preconditions: []
        side_effects:
          - "New Dispositions under this Account rejected with ERR_ACCOUNT_RESTRICTED"

      - from: RESTRICTED
        to: OPEN
        trigger: "POST /firms/{firmId}/accounts/{accountId}/reopen"
        actor: FirmAdmin | TaxOps
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /firms/{firmId}/accounts/{accountId}/close"
        actor: FirmAdmin | TaxOps
        preconditions:
          - "Every TaxLot under this Account must have quantity_remaining == 0 OR lot_status in {FULLY_DISPOSED, SUPERSEDED} (ERR_ACCOUNT_HAS_OPEN_LOTS)"
        side_effects: []

      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /firms/{firmId}/accounts/{accountId}/close"
        actor: FirmAdmin | TaxOps
        preconditions:
          - "Every TaxLot under this Account must have quantity_remaining == 0 OR lot_status in {FULLY_DISPOSED, SUPERSEDED}"
        side_effects: []

  - entity: TaxLot
    initial_state: OPEN
    terminal_states: [FULLY_DISPOSED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: PARTIALLY_DISPOSED
        trigger: "system (Disposition SETTLED consumes part of the lot)"
        actor: system
        preconditions:
          - "lot.quantity_remaining > 0 and allocated quantity < lot.quantity_remaining"
        side_effects:
          - "quantity_remaining decremented by allocated quantity"
          - "updated_at refreshed"

      - from: OPEN
        to: FULLY_DISPOSED
        trigger: "system (Disposition SETTLED consumes the entire remaining quantity)"
        actor: system
        preconditions:
          - "allocated quantity == lot.quantity_remaining"
        side_effects:
          - "quantity_remaining := 0"

      - from: PARTIALLY_DISPOSED
        to: FULLY_DISPOSED
        trigger: "system (subsequent Disposition consumes the remainder)"
        actor: system
        preconditions:
          - "allocated quantity == lot.quantity_remaining"
        side_effects:
          - "quantity_remaining := 0"

      - from: OPEN
        to: SUPERSEDED
        trigger: "system (CorporateAction transitions ANNOUNCED → EFFECTIVE)"
        actor: system
        preconditions:
          - "CorporateAction.security_id == this lot's security_id"
          - "CorporateAction.action_type in {SPLIT, REVERSE_SPLIT, MERGER, SPINOFF}"
        side_effects:
          - "superseded_by_action_id := the CorporateAction.id"
          - "quantity_remaining := 0 (this lot is replaced by derived lots)"
          - "Spawn one or more derived TaxLots with acquisition_kind = CORPORATE_ACTION_DERIVED (see calculations.corporate_action_basis_adjustment)"

      - from: PARTIALLY_DISPOSED
        to: SUPERSEDED
        trigger: "system (CorporateAction transitions ANNOUNCED → EFFECTIVE)"
        actor: system
        preconditions:
          - "Same as OPEN → SUPERSEDED"
        side_effects:
          - "Same as OPEN → SUPERSEDED, applied to remaining quantity only"

  - entity: Disposition
    initial_state: PENDING
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /firms/{firmId}/dispositions/{dispositionId}/settle OR system at settlement_date"
        actor: TaxOps | system
        preconditions:
          - "Account.status == OPEN"
          - "Customer.status == ACTIVE"
          - "Total allocated quantity == Disposition.quantity (ERR_LOT_ALLOCATION_MISMATCH)"
          - "For SPECIFIC_ID: every lot_allocations[i].lot_id must reference an OPEN or PARTIALLY_DISPOSED TaxLot on this Account+Security with quantity_remaining >= allocation"
          - "Sufficient quantity_remaining across selected lots (ERR_INSUFFICIENT_LOT_QUANTITY)"
        side_effects:
          - "Run calculations.lot_selection_and_gain (compute realized_gain_cents)"
          - "Run calculations.wash_sale_detection (creates WashSaleEvent(s) if replacement acquisitions exist within window across ALL Accounts sharing the Customer.wash_sale_scope_key)"
          - "If wash sale detected: cascade — create WashSaleEvent(s), defer disallowed loss onto triggering TaxLot (wash_sale_taint_basis_cents += disallowed, adjusted_cost_basis_cents recomputed, holding_period_start tacked)"
          - "If is_wash_sale_flag: any TaxForm1099B for this Customer covering this tax_year in {DRAFT, GENERATED} is invalidated back to DRAFT (see calculations.form_1099b_aggregation)"
          - "Disposition.status := SETTLED"

      - from: SETTLED
        to: CORRECTED
        trigger: "POST /firms/{firmId}/dispositions/{dispositionId}/correct"
        actor: TaxOps
        preconditions:
          - "Disposition.status == SETTLED"
          - "At least one corrected field differs (proceeds_cents / quantity / lot_allocations)"
          - "Every TaxForm1099B covering this Customer and tax_year must NOT be in FROZEN status (ERR_FORM_FROZEN)"
        side_effects:
          - "Reverse prior lot allocations (restore quantity_remaining, reverse lot_status back toward OPEN if it had flipped to FULLY_DISPOSED solely due to this disposition)"
          - "Reverse prior WashSaleEvents whose disposition_id == this id (unwind triggering_lot's wash_sale_taint_basis_cents and adjusted_cost_basis_cents)"
          - "Re-apply lot selection with the corrected inputs and re-run wash_sale_detection"
          - "Disposition.status := CORRECTED (a terminal audit marker; a NEW Disposition row is created with the corrected values and transitions PENDING → SETTLED atomically in the same request)"
          - "Any TaxForm1099B in {GENERATED, FILED, CORRECTION_PENDING} for this Customer + tax_year is marked CORRECTION_PENDING"

      - from: PENDING
        to: VOIDED
        trigger: "POST /firms/{firmId}/dispositions/{dispositionId}/void"
        actor: TaxOps
        preconditions:
          - "Disposition.status == PENDING"
        side_effects:
          - "Reserved lot allocations released (no quantity was consumed yet)"

  - entity: CorporateAction
    initial_state: ANNOUNCED
    terminal_states: [EFFECTIVE, CANCELLED]
    transitions:
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "POST /firms/{firmId}/corporate_actions/{actionId}/apply"
        actor: TaxOps
        preconditions:
          - "CorporateAction.action_type fields consistent: SPLIT/REVERSE_SPLIT requires split_ratio_numerator>0 AND split_ratio_denominator>0; MERGER requires merger_acquirer_security_id AND merger_cash_per_share_cents >= 0 AND merger_shares_per_source_share > 0; SPINOFF requires merger_acquirer_security_id AND 0 < spinoff_cost_allocation_pct < 1 (ERR_INCOMPLETE_ACTION_PAYLOAD)"
          - "For MERGER/SPINOFF: merger_acquirer_security_id references a Security in the same firm (ERR_SECURITY_NOT_FOUND)"
        side_effects:
          - "For every TaxLot on (this Account, this Security) with lot_status in {OPEN, PARTIALLY_DISPOSED}: flip lot_status to SUPERSEDED, set superseded_by_action_id"
          - "Spawn derived TaxLots (acquisition_kind=CORPORATE_ACTION_DERIVED) per calculations.corporate_action_basis_adjustment"
          - "Bubble up: for every Account that held affected lots, Account.updated_at refreshed and Account.version += 1"

      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /firms/{firmId}/corporate_actions/{actionId}/cancel"
        actor: TaxOps
        preconditions:
          - "status == ANNOUNCED"
        side_effects: []

  - entity: TransferStatement
    initial_state: PENDING
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /firms/{firmId}/transfer_statements/{stmtId}/deliver"
        actor: TaxOps
        preconditions:
          - "status == PENDING"
          - "lots_payload is non-empty (ERR_TRANSFER_MISSING_LOT_DETAIL)"
          - "For direction == OUTBOUND: source Account must have TaxLots on this security with total quantity_remaining >= TransferStatement.quantity (ERR_TRANSFER_INSUFFICIENT_POSITION)"
        side_effects:
          - "For OUTBOUND: the source Account's TaxLots are consumed in the Account.default_disposal_method order (mark FULLY_DISPOSED / PARTIALLY_DISPOSED); their basis is bundled onto lots_payload"
          - "status := DELIVERED"

      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /firms/{firmId}/transfer_statements/{stmtId}/accept"
        actor: TaxOps
        preconditions:
          - "status == DELIVERED"
        side_effects:
          - "For INBOUND: materialize one TaxLot per lots_payload entry with acquisition_kind=TRANSFER_IN, original_cost_basis_cents from payload, adjusted_cost_basis_cents := original_cost_basis_cents, holding_period_start := acquisition_date"
          - "status := ACCEPTED"

      - from: DELIVERED
        to: REJECTED
        trigger: "POST /firms/{firmId}/transfer_statements/{stmtId}/reject"
        actor: TaxOps
        preconditions:
          - "status == DELIVERED"
        side_effects:
          - "For OUTBOUND: the source TaxLots consumed at DELIVERED are restored (quantity_remaining and lot_status rolled back)"
          - "For INBOUND: no lots were created yet, nothing to roll back"
          - "status := REJECTED"

      - from: REJECTED
        to: PENDING
        trigger: "POST /firms/{firmId}/transfer_statements/{stmtId}/redeliver"
        actor: TaxOps
        preconditions:
          - "status == REJECTED"
          - "A replacement TransferStatement with replaces_statement_id == this.id has NOT already reached DELIVERED (ERR_TRANSFER_ALREADY_SUPERSEDED)"
        side_effects:
          - "status := PENDING (lots_payload may be edited before re-delivery)"

      - from: DELIVERED
        to: SUPERSEDED
        trigger: "system (a NEW TransferStatement with replaces_statement_id == this.id reaches DELIVERED)"
        actor: system
        preconditions:
          - "This statement is in DELIVERED and a replacement references it"
        side_effects:
          - "If direction == OUTBOUND and this was DELIVERED: restore source lots, then the replacement's own deliver side-effects consume them afresh"
          - "status := SUPERSEDED"

  - entity: TaxForm1099B
    initial_state: DRAFT
    terminal_states: [REFILED, FROZEN]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/generate"
        actor: TaxOps
        preconditions:
          - "status == DRAFT"
          - "Customer.status != CLOSED"
        side_effects:
          - "Run calculations.form_1099b_aggregation over this Customer + tax_year; populate all six totals + disallowed_wash_sale_loss_cents"
          - "generated_from_version := Customer.version"
          - "status := GENERATED"

      - from: GENERATED
        to: FILED
        trigger: "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/file"
        actor: FirmAdmin
        preconditions:
          - "status == GENERATED"
          - "Customer.version == generated_from_version (ERR_STALE_FORM_VERSION if Customer has been mutated since generation)"
        side_effects:
          - "filed_at := current logical clock time"
          - "status := FILED"

      - from: FILED
        to: CORRECTION_PENDING
        trigger: "system (any of: Disposition in scope is CORRECTED; BasisChangeRequest in scope reaches APPLIED; WashSaleEvent created in scope after FILED)"
        actor: system
        preconditions:
          - "status == FILED"
        side_effects:
          - "status := CORRECTION_PENDING"
          - "Customer.version += 1"

      - from: CORRECTION_PENDING
        to: REFILED
        trigger: "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/refile"
        actor: FirmAdmin
        preconditions:
          - "status == CORRECTION_PENDING"
          - "current logical clock time <= filed_at + BrokerageFirm.correction_deadline_days (ERR_CORRECTION_WINDOW_CLOSED)"
        side_effects:
          - "Re-run calculations.form_1099b_aggregation with the corrected source data; overwrite all totals"
          - "correction_count += 1"
          - "generated_from_version := Customer.version"
          - "status := REFILED"

      - from: REFILED
        to: CORRECTION_PENDING
        trigger: "system (a further qualifying change lands in scope)"
        actor: system
        preconditions:
          - "status == REFILED"
        side_effects:
          - "status := CORRECTION_PENDING (the FILED ↔ CORRECTION_PENDING ↔ REFILED loop is unbounded within the deadline window)"

      - from: CORRECTION_PENDING
        to: FROZEN
        trigger: "system (logical clock crosses filed_at + BrokerageFirm.correction_deadline_days)"
        actor: system
        preconditions:
          - "status == CORRECTION_PENDING"
        side_effects:
          - "status := FROZEN (permanently; no further corrections accepted)"

  - entity: BasisChangeRequest
    initial_state: PENDING
    terminal_states: [APPLIED]
    transitions:
      - from: PENDING
        to: UNDER_REVIEW
        trigger: "POST /firms/{firmId}/basis_change_requests/{reqId}/start_review"
        actor: TaxOps
        preconditions:
          - "status == PENDING"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /firms/{firmId}/basis_change_requests/{reqId}/approve"
        actor: TaxOps
        preconditions:
          - "status == UNDER_REVIEW"
          - "supporting_doc_ref present (ERR_MISSING_SUPPORTING_DOC)"
        side_effects:
          - "approved_by_user_id := acting X-User-ID"
          - "version_applied_to := TaxLot.version at approval time"

      - from: APPROVED
        to: APPLIED
        trigger: "POST /firms/{firmId}/basis_change_requests/{reqId}/apply"
        actor: TaxOps
        preconditions:
          - "status == APPROVED"
          - "acting X-User-ID != approved_by_user_id (segregation of duties; ERR_SOD_VIOLATION)"
          - "TaxLot.version == version_applied_to (OCC; ERR_STALE_LOT_VERSION)"
          - "TaxLot.lot_status in {OPEN, PARTIALLY_DISPOSED} (cannot apply to FULLY_DISPOSED or SUPERSEDED)"
        side_effects:
          - "Apply the change per request_kind (see calculations.basis_change_request_application)"
          - "Recompute the lot's covered_status if acquisition date or coverage changed"
          - "Any TaxForm1099B in {GENERATED, FILED, REFILED} for this Customer covering the lot's tax_year is moved to CORRECTION_PENDING"
          - "applied_by_user_id := acting X-User-ID"
          - "status := APPLIED"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /firms/{firmId}/basis_change_requests/{reqId}/reject"
        actor: TaxOps
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects: []

      - from: REJECTED
        to: RESUBMITTED
        trigger: "POST /firms/{firmId}/basis_change_requests/{reqId}/resubmit"
        actor: Customer
        preconditions:
          - "status == REJECTED"
          - "Caller is the Customer who owns this request"
        side_effects:
          - "status := RESUBMITTED"

      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /firms/{firmId}/basis_change_requests/{reqId}/start_review"
        actor: TaxOps
        preconditions:
          - "status == RESUBMITTED"
        side_effects: []

  - entity: Security
    initial_state: ACTIVE
    terminal_states: []
    transitions: []
    note: "Security has no lifecycle state machine; its covered_security_effective_date is the only field that drives downstream classification."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: transfer-deliver-stale-account
    parent_entity: Account
    write_endpoint: "POST /firms/{firmId}/transfer_statements/{stmtId}/deliver"
    occ_field: "expected_account_version"
    description: |
      Delivering an OUTBOUND TransferStatement against an Account whose
      version has advanced since the client last observed it is rejected.
      A prior delivery (or another lot-mutating event) has already consumed
      the source lots, so the current writer's view of the Account position
      is stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: basis-apply-stale-lot
    parent_entity: TaxLot
    write_endpoint: "POST /firms/{firmId}/basis_change_requests/{reqId}/apply"
    occ_field: "expected_tax_lot_version"
    description: |
      Applying an APPROVED BasisChangeRequest against a TaxLot whose version
      has advanced since approval is rejected — the lot's basis may already
      have been mutated (e.g., by a corporate action or a wash-sale taint),
      so the approval's snapshot is stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: form-generate-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/generate"
    occ_field: "expected_customer_version"
    description: |
      Generating a TaxForm1099B against a Customer whose version has
      advanced since the DRAFT form was created is rejected — the DRAFT's
      snapshot no longer reflects the customer's lot universe.
    error_id: ERR_STALE_FORM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_selection_and_gain
    trigger: "Disposition transitions PENDING → SETTLED"
    description: "Pick which lots the disposition consumes and compute realized gain/loss"
    algorithm: chronological
    formula: |
      # Step 1 — pick candidate lots on this Account+Security in lot_status ∈ {OPEN, PARTIALLY_DISPOSED}.
      # Step 2 — order candidates per Disposition.method:
      #   FIFO: sort by acquisition_date ASC, tie-break TaxLot.created_at ASC
      #   LIFO: sort by acquisition_date DESC, tie-break TaxLot.created_at DESC
      #   HIFO: sort by per-share adjusted basis DESC (adjusted_cost_basis_cents / quantity), tie-break TaxLot.created_at ASC
      #   SPECIFIC_ID: use Disposition.lot_allocations verbatim (no sort; the request dictates the order)
      # Step 3 — walk the ordered list, consuming min(needed, lot.quantity_remaining) per lot until
      #          Disposition.quantity is satisfied. For each allocation:
      #   per_share_basis = round_half_up( lot.adjusted_cost_basis_cents / lot.quantity , 0 )  # whole cents per share
      #   allocation_basis_cents = per_share_basis * allocated_quantity
      #   lot.quantity_remaining -= allocated_quantity
      #   lot.adjusted_cost_basis_cents -= allocation_basis_cents
      # Step 4 — totals:
      #   total_basis_consumed = Σ allocation_basis_cents
      #   Disposition.realized_gain_cents = Disposition.proceeds_cents - total_basis_consumed
      #   Negative realized_gain_cents ⇒ candidate loss (subject to wash-sale review).
    input_set: "TaxLots on the disposition's Account AND Security, lot_status ∈ {OPEN, PARTIALLY_DISPOSED}, quantity_remaining > 0"
    constants:
      ROUNDING: round_half_up
      PRECISION: integer_cents
    precision: "integer cents, round_half_up at the per-share step"
    variants:
      - name: provisional_estimate
        when: "When the Disposition is still PENDING (i.e., computed via GET /dispositions/{id}/preview_gain), the same algorithm runs in PREVIEW mode — it does NOT decrement lot.quantity_remaining and does NOT persist realized_gain_cents. Preview uses current lot state and may drift once lots change."
        difference: "Preview is read-only; SETTLED writes the canonical values. Preview and SETTLED can disagree if lots change between the two calls."
      - name: settled_final
        when: "On the actual PENDING → SETTLED transition"
        difference: "Allocations are written to the lots; realized_gain_cents is persisted and immutable except via the SETTLED → CORRECTED cycle."

  - name: wash_sale_detection
    trigger: "Disposition PENDING → SETTLED, after lot_selection_and_gain produces a negative realized_gain_cents"
    description: "Detect replacement acquisitions in the wash-sale window across ALL accounts sharing the Customer.wash_sale_scope_key"
    algorithm: chronological
    formula: |
      If Disposition.realized_gain_cents >= 0: skip (no wash sale).
      Let window_start = Disposition.trade_date - BrokerageFirm.wash_sale_window_days
          window_end   = Disposition.trade_date + BrokerageFirm.wash_sale_window_days
          (both inclusive — an acquisition exactly 30 days before or exactly 30 days after the sale is INSIDE the window)
      Let candidate_lots = every TaxLot whose:
        - Account.Customer.wash_sale_scope_key == this Customer.wash_sale_scope_key
        - security.cusip == this Disposition's security.cusip   # same CUSIP, ANY account
        - acquisition_date in [window_start, window_end]
        - acquisition_date > (the sold lot's acquisition_date)   # must be a REPLACEMENT, not the lot just sold
        - lot_id NOT in (the sold lot's id)
        - lot_status ∈ {OPEN, PARTIALLY_DISPOSED}
      Order candidates by acquisition_date ASC, tie-break TaxLot.created_at ASC.
      Let shares_sold_at_loss = total allocated quantity from this Disposition whose per-lot gain < 0.
      Walk candidates in order; for each candidate:
        replacement_shares = min(candidate.quantity_remaining, shares_sold_at_loss_remaining)
        If candidate.quantity_remaining >= shares_sold_at_loss_remaining: matching_rule = SHARE_FOR_SHARE
        Else: matching_rule = PARTIAL_PRORATA
        candidate_disallowed_share = round_half_up( |realized_loss_cents| * replacement_shares / shares_sold_at_loss , 0 )
        Create WashSaleEvent(disposition_id, sold_lot_id, triggering_lot_id=candidate.id,
                              disallowed_loss_cents=candidate_disallowed_share, matching_rule=...)
        Cascade onto candidate:
          candidate.wash_sale_taint_basis_cents += candidate_disallowed_share
          candidate.adjusted_cost_basis_cents += candidate_disallowed_share
          candidate.holding_period_start := min(candidate.holding_period_start, sold_lot.holding_period_start)
        shares_sold_at_loss_remaining -= replacement_shares
        Stop when shares_sold_at_loss_remaining == 0 or candidates exhausted.
      Disposition.wash_sale_disallowed_loss_cents = Σ candidate_disallowed_share
      Disposition.is_wash_sale_flag = (Disposition.wash_sale_disallowed_loss_cents > 0)
      If Disposition.wash_sale_disallowed_loss_cents > 0:
        Disposition.realized_gain_cents := Disposition.realized_gain_cents + Disposition.wash_sale_disallowed_loss_cents
        # i.e., the recognized loss is reduced by the disallowed portion (never below zero overall —
        # a wash sale cannot turn a loss into a gain).
    input_set: "Replacement TaxLots across all of the Customer's Accounts within the 61-day window"
    constants:
      WASH_SALE_HALF_WINDOW_DAYS: 30
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up at the per-candidate deferral step"
    variants:
      - name: same_account_only
        when: "PREVIEW mode (when GET /dispositions/{id}/preview_wash_sale is called before SETTLED) only scans the Disposition's OWN account — used as a quick triage signal"
        difference: "Same-account-only detection is a subset of the cross-account rule; cross-account is the canonical, SETTLED-time behavior. This variant exists so a PENDING disposition can warn the trader without running the full cross-account sweep."
      - name: cross_account_full
        when: "At SETTLED time (the regulatory rule)"
        difference: "Scans every Account sharing wash_sale_scope_key, including IRAs — an IRA replacement purchase permanently disallows the loss (no basis adjustment in the IRA; the deferred basis sticks to the IRA lot but is never usable)."

  - name: corporate_action_basis_adjustment
    trigger: "CorporateAction ANNOUNCED → EFFECTIVE"
    description: "Allocate pre-action basis across post-action (derived) lots"
    algorithm: waterfall_allocation
    formula: |
      For each source TaxLot on the action's security with lot_status ∈ {OPEN, PARTIALLY_DISPOSED}:
        Let Q = source_lot.quantity_remaining, B = source_lot.adjusted_cost_basis_cents.
        If action_type == SPLIT:
          new_quantity = Q * numerator / denominator   # may be fractional
          derived_lot:
            quantity = new_quantity
            quantity_remaining = new_quantity
            original_cost_basis_cents = B
            adjusted_cost_basis_cents = B    # total basis unchanged; only per-share changes
            acquisition_date = source_lot.acquisition_date  # tacked — does NOT reset holding period
            holding_period_start = source_lot.holding_period_start
            acquisition_kind = CORPORATE_ACTION_DERIVED
            wash_sale_taint_basis_cents = source_lot.wash_sale_taint_basis_cents
        If action_type == REVERSE_SPLIT:
          new_quantity = floor(Q * numerator / denominator)
          cash_in_lieu_cents = round_half_up( (Q * numerator / denominator - new_quantity) * source_lot.adjusted_cost_basis_cents / Q , 0 )
          derived_lot:
            quantity = new_quantity
            quantity_remaining = new_quantity
            original_cost_basis_cents = B - cash_in_lieu_cents
            adjusted_cost_basis_cents = B - cash_in_lieu_cents
            acquisition_date = source_lot.acquisition_date
            holding_period_start = source_lot.holding_period_start
            acquisition_kind = CORPORATE_ACTION_DERIVED
            wash_sale_taint_basis_cents = source_lot.wash_sale_taint_basis_cents - cash_in_lieu_cents (floor at 0)
          # cash_in_lieu is a taxable deemed sale of the fractional share — realized gain vs that fraction's basis
        If action_type == MERGER:
          new_quantity = Q * merger_shares_per_source_share   # may be fractional
          total_consideration_value_cents = Q * merger_cash_per_share_cents   # plus FMV of new shares — caller passes a fixed appraised price per share via Security master for determinism
          derived_lot (on merger_acquirer_security_id):
            quantity = new_quantity
            quantity_remaining = new_quantity
            original_cost_basis_cents = B - min(Q * merger_cash_per_share_cents, B)   # basis reduced by cash boot, but never below 0
            adjusted_cost_basis_cents = original_cost_basis_cents
            acquisition_date = source_lot.acquisition_date
            holding_period_start = source_lot.holding_period_start
            acquisition_kind = CORPORATE_ACTION_DERIVED
            wash_sale_taint_basis_cents = source_lot.wash_sale_taint_basis_cents
          # cash boot in excess of basis is taxable gain; recognized in the year of the action.
        If action_type == SPINOFF:
          derived_spun_off_lot (on merger_acquirer_security_id):
            quantity = Q * merger_shares_per_source_share
            quantity_remaining = quantity
            original_cost_basis_cents = round_half_up( B * spinoff_cost_allocation_pct , 0 )
            adjusted_cost_basis_cents = original_cost_basis_cents
            acquisition_date = source_lot.acquisition_date
            holding_period_start = source_lot.holding_period_start
            acquisition_kind = CORPORATE_ACTION_DERIVED
          derived_parent_lot (on the SAME security as the source):
            quantity = Q
            quantity_remaining = Q
            original_cost_basis_cents = B - spun_off_basis_cents
            adjusted_cost_basis_cents = original_cost_basis_cents
            acquisition_date = source_lot.acquisition_date
            holding_period_start = source_lot.holding_period_start
            acquisition_kind = CORPORATE_ACTION_DERIVED
          # Σ derived basis == source basis (conservation invariant)
      Source lot → SUPERSEDED, quantity_remaining := 0.
    input_set: "OPEN/PARTIALLY_DISPOSED TaxLots on CorporateAction.security_id at the moment of apply"
    constants:
      ROUNDING: round_half_up
      FRACTIONAL_SHARES: allowed
    precision: "integer cents, round_half_up at the per-lot allocation step"
    variants:
      - name: with_cash_boot
        when: "MERGER with merger_cash_per_share_cents > 0"
        difference: "Boot reduces derived basis; the boot-vs-basis excess is recognized gain. Without boot, basis carries over unchanged (just re-papered)."
      - name: pro_rata_pure
        when: "SPLIT / REVERSE_SPLIT / SPINOFF without boot"
        difference: "Pure basis reallocation; no taxable event."

  - name: gift_basis_dual_rule
    trigger: "TaxLot.acquisition_kind == GIFT at SETTLED time (lot_selection_and_gain invokes this per allocated share)"
    description: "IRC §1015 dual-basis rule for gifted property"
    algorithm: constraint_propagation
    formula: |
      # Inputs per share: donor_basis_per_share = gift_donor_basis_cents / quantity
      #                   fmv_per_share         = gift_fmv_cents_at_gift / quantity
      #                   sale_price_per_share  = Disposition.proceeds_cents / Disposition.quantity
      #
      # Rule:
      #   For GAIN determination (sale_price_per_share > donor_basis_per_share):
      #     basis_used_per_share = donor_basis_per_share
      #     gain = (sale_price - donor_basis) * shares
      #   For LOSS determination (sale_price_per_share < fmv_per_share AND fmv_per_share < donor_basis_per_share):
      #     basis_used_per_share = fmv_per_share
      #     loss = (fmv_per_share - sale_price_per_share) * shares
      #   NO-MAN'S-LAND (fmv_per_share <= sale_price_per_share <= donor_basis_per_share):
      #     recognized gain = 0 AND recognized loss = 0
      #
      # The basis_used decision is made PER ALLOCATION at SETTLED time, not at lot creation —
      # the same GIFT lot can produce a gain, a loss, or zero depending on the sale price.
      # holding_period rule: if the sale uses donor's basis (gain path), holding_period_start tacks
      # the donor's holding period (caller supplies donor_holding_start via the acquisition payload);
      # if the sale uses FMV basis (loss path), holding period starts at the gift date.
    input_set: "The allocated quantity from a GIFT TaxLot"
    constants: {}
    precision: "integer cents, round_half_up at the per-share step"

  - name: inheritance_stepped_up_basis
    trigger: "TaxLot.acquisition_kind == INHERITANCE at lot creation AND at SETTLED time"
    description: "IRC §1014 stepped-up basis; holding period is automatically long-term"
    algorithm: forward_looking
    formula: |
      At lot creation:
        adjusted_cost_basis_cents := inherited_fmv_cents_at_death   # IGNORES original_cost_basis_cents if supplied
        covered_status := NONCOVERED  # inherited lots are always NONCOVERED under §6045 (basis reported by recipient's estate, not the broker)
        holding_period_start := acquisition_date (date of death)
        # An INHERITANCE lot is ALWAYS treated as LONG_TERM for gain/loss character, regardless of holding duration.
      At SETTLED time:
        per_share_basis = round_half_up( adjusted_cost_basis_cents / quantity , 0 )
        gain_or_loss uses that per_share_basis; the term classification is LONG_TERM unconditionally.
    input_set: "The INHERITANCE TaxLot"
    constants: {}
    precision: "integer cents, round_half_up at the per-share step"

  - name: covered_status_classification
    trigger: "TaxLot creation AND after any BasisChangeRequest of kind ACQUISITION_DATE_CORRECTION or COVERAGE_RECLASS is APPLIED"
    description: "IRC §6045 covered vs noncovered classification"
    algorithm: threshold
    formula: |
      If TaxLot.acquisition_kind == INHERITANCE: covered_status = NONCOVERED
      Else if TaxLot.acquisition_kind == GIFT: covered_status = NONCOVERED  # gifts are not "acquired through a broker"
      Else if TaxLot.acquisition_date >= Security.covered_security_effective_date: covered_status = COVERED
      Else: covered_status = NONCOVERED
      # Note the boundary: acquisition_date EXACTLY EQUAL to covered_security_effective_date → COVERED (>=, not >).
    input_set: "The TaxLot being classified"
    constants:
      BOUNDARY: ">="  # inclusive on the effective date
    precision: "date comparison only"

  - name: short_long_term_classification
    trigger: "Disposition SETTLED, per allocation"
    description: "Short-term vs long-term character for each allocated share"
    algorithm: threshold
    formula: |
      If sold_lot.acquisition_kind == INHERITANCE: term = LONG_TERM
      Else if sold_lot.acquisition_kind == GIFT AND wash_sale_taint_basis_cents > 0:
          # tacked holding period via wash-sale rules dominates; use holding_period_start
          holding_days = Disposition.trade_date - sold_lot.holding_period_start (in days)
          term = LONG_TERM if holding_days > 365 else SHORT_TERM
      Else:
          holding_days = Disposition.trade_date - sold_lot.holding_period_start (in days)
          term = LONG_TERM if holding_days > 365 else SHORT_TERM
      # Boundary: holding_days EXACTLY 365 → SHORT_TERM (strictly > 365 required for LONG_TERM).
    input_set: "Each (sold_lot, allocated_quantity) pair"
    constants:
      LONG_TERM_THRESHOLD_DAYS: 365
      BOUNDARY: ">"   # strictly greater
    precision: "day-granularity date arithmetic"

  - name: form_1099b_aggregation
    trigger: "TaxForm1099B DRAFT → GENERATED, and CORRECTION_PENDING → REFILED"
    description: "Aggregate the year's SETTLED/CORRECTED dispositions into the six Box totals + wash-sale Box 1g"
    algorithm: aggregation
    formula: |
      # Input set: every Disposition on every Account of this Customer where:
      #   - Disposition.status == SETTLED (CORRECTED dispositions are excluded — they were replaced)
      #   - tax_year of Disposition.trade_date == TaxForm1099B.tax_year
      #   - Disposition has at least one lot allocation from a COVERED TaxLot
      #     (noncovered dispositions are NOT reported on 1099-B; they appear only on the customer's own records)
      #
      # For each qualifying disposition, split its allocations by term:
      #   short_term_proceeds += proceeds_cents * (short_term_shares / total_shares)
      #   short_term_basis   += basis consumed from covered short_term lots
      #   long_term_proceeds += proceeds_cents * (long_term_shares / total_shares)
      #   long_term_basis    += basis consumed from covered long_term lots
      # The per-disposition split uses the per-share allocation already computed in lot_selection_and_gain.
      # disallowed_wash_sale_loss_cents = Σ Disposition.wash_sale_disallowed_loss_cents across the same set.
      #
      # short_term_gain_cents = short_term_proceeds_cents - short_term_basis_cents
      # long_term_gain_cents  = long_term_proceeds_cents  - long_term_basis_cents
      #
      # Rounding order is PINNED: per-disposition per-term proceeds and basis are summed first as integers
      # (already cent-quantized by lot_selection_and_gain); NO further rounding occurs at aggregation time.
    input_set: "Covered SETTLED Dispositions on Customer's Accounts for the form's tax_year"
    constants:
      ROUNDING: integer_cents_no_op_at_aggregation
    precision: "integer cents (no rounding at aggregation step)"

  - name: basis_change_request_application
    trigger: "BasisChangeRequest APPROVED → APPLIED"
    description: "Apply the approved change to the target TaxLot"
    algorithm: constraint_propagation
    formula: |
      Switch on request_kind:
        COVERAGE_RECLASS:
          lot.covered_status := proposed_coverage  (overrides the computed value)
          # If the lot was already consumed by a SETTLED disposition in a year with a FILED form:
          #   mark the relevant TaxForm1099B CORRECTION_PENDING (cascade).
        BASIS_AMOUNT_CORRECTION:
          lot.adjusted_cost_basis_cents := proposed_basis_cents
          # original_cost_basis_cents is preserved for audit.
          # Recompute downstream: any SETTLED disposition that consumed this lot is left alone
          #   (historical dispositions do NOT re-open); only future dispositions see the new basis.
        ACQUISITION_DATE_CORRECTION:
          lot.acquisition_date := proposed_acquisition_date
          lot.covered_status := covered_status_classification(lot)   # recompute
          lot.holding_period_start := proposed_acquisition_date
          # If the new date changes the term classification of any SETTLED disposition that used
          #   this lot, mark the relevant TaxForm1099B CORRECTION_PENDING.
        GIFT_BASIS_SUPPLY:
          lot.gift_donor_basis_cents := gift_donor_basis_cents
          lot.gift_fmv_cents_at_gift := gift_fmv_cents_at_gift
          lot.acquisition_kind := GIFT
          # covered_status is forced to NONCOVERED by the gift classification rule.
    input_set: "The target TaxLot"
    constants: {}
    precision: "field-level replacement; no arithmetic except recomputed covered_status"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted on this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-template resource ids (firm, customer, account, lot, disposition, form, request, statement, action) must exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "Target entity must be in the from-state required by the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: all action endpoints

  - priority: 5
    category: business_compliance
    check: "Customer must not be SUSPENDED or CLOSED for new Dispositions or BasisChangeRequests"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/dispositions", "POST /firms/{firmId}/customers/{customerId}/basis_change_requests"]

  - priority: 6
    category: business_compliance
    check: "Account must be OPEN (not RESTRICTED, not CLOSED) for new Dispositions or OUTBOUND TransferStatements"
    error_id: ERR_ACCOUNT_RESTRICTED
    http_status: 409
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/dispositions", "POST /firms/{firmId}/accounts/{accountId}/transfer_statements"]

  - priority: 7
    category: business_referential
    check: "Foreign keys in request body (security_id, tax_lot_id, merger_acquirer_security_id, replaces_statement_id) must resolve to existing in-firm entities"
    error_id: ERR_FOREIGN_KEY_UNRESOLVABLE
    http_status: 422
    applies_to: all POST endpoints with body FKs

  - priority: 8
    category: business_temporal
    check: "Disposition.trade_date must be >= BrokerageFirm.tax_year_open-01-01 (cannot book into a year whose books are closed)"
    error_id: ERR_TAX_YEAR_CLOSED
    http_status: 422
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/dispositions"]

  - priority: 9
    category: business_temporal
    check: "For SPECIFIC_ID method: every referenced lot must be on the same Account and Security as the disposition"
    error_id: ERR_LOT_SCOPE_MISMATCH
    http_status: 422
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/dispositions"]

  - priority: 10
    category: business_constraint
    check: "CorporateAction payload consistency per action_type (ratios > 0, acquirer present for MERGER/SPINOFF, spinoff pct in (0,1))"
    error_id: ERR_INCOMPLETE_ACTION_PAYLOAD
    http_status: 422
    applies_to: ["POST /firms/{firmId}/securities/{securityId}/corporate_actions", "POST /firms/{firmId}/corporate_actions/{actionId}/apply"]

  - priority: 11
    category: business_constraint
    check: "GIFT lots require gift_donor_basis_cents and gift_fmv_cents_at_gift; INHERITANCE lots require inherited_fmv_cents_at_death"
    error_id: ERR_INCOMPLETE_LOT_BASIS_DETAIL
    http_status: 422
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/tax_lots"]

  - priority: 12
    category: business_fiscal
    check: "Disposition.quantity must be > 0; proceeds_cents must be >= 0; per-allocation quantities in lot_allocations must be > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/dispositions"]

  - priority: 13
    category: business_fiscal
    check: "For SPECIFIC_ID: sum(lot_allocations.quantity) must equal Disposition.quantity exactly"
    error_id: ERR_LOT_ALLOCATION_MISMATCH
    http_status: 422
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/dispositions"]

  - priority: 14
    category: business_fiscal
    check: "Total quantity_remaining across selected lots must be >= Disposition.quantity"
    error_id: ERR_INSUFFICIENT_LOT_QUANTITY
    http_status: 422
    applies_to: ["POST /firms/{firmId}/dispositions/{dispositionId}/settle"]

  - priority: 15
    category: business_compliance
    check: "BasisChangeRequest.apply: acting user must differ from approved_by_user_id (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /firms/{firmId}/basis_change_requests/{reqId}/apply"]

  - priority: 16
    category: business_compliance
    check: "BasisChangeRequest.approve: supporting_doc_ref must be non-empty"
    error_id: ERR_MISSING_SUPPORTING_DOC
    http_status: 422
    applies_to: ["POST /firms/{firmId}/basis_change_requests/{reqId}/approve"]

  - priority: 17
    category: business_temporal
    check: "TaxForm1099B.refile: current logical clock time must be <= filed_at + correction_deadline_days"
    error_id: ERR_CORRECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/refile"]

  - priority: 18
    category: business_constraint
    check: "TransferStatement with replaces_statement_id: the referenced statement must exist and be in DELIVERED state"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/transfer_statements"]

  - priority: 19
    category: business_compliance
    check: "OUTBOUND TransferStatement.deliver: source Account must hold >= statement.quantity of the security in OPEN/PARTIALLY_DISPOSED lots"
    error_id: ERR_TRANSFER_INSUFFICIENT_POSITION
    http_status: 422
    applies_to: ["POST /firms/{firmId}/transfer_statements/{stmtId}/deliver"]

  - priority: 20
    category: business_compliance
    check: "Disposition.correct: any in-scope TaxForm1099B must not be FROZEN"
    error_id: ERR_FORM_FROZEN
    http_status: 409
    applies_to: ["POST /firms/{firmId}/dispositions/{dispositionId}/correct"]

  - priority: 21
    category: business_fiscal
    check: "Account.close: every TaxLot must be FULLY_DISPOSED or SUPERSEDED (quantity_remaining == 0)"
    error_id: ERR_ACCOUNT_HAS_OPEN_LOTS
    http_status: 409
    applies_to: ["POST /firms/{firmId}/accounts/{accountId}/close"]

  - priority: 22
    category: business_fiscal
    check: "Customer.close: every Account CLOSED and no PENDING/UNDER_REVIEW/APPROVED BasisChangeRequests"
    error_id: ERR_CUSTOMER_HAS_OPEN_ACCOUNTS
    http_status: 409
    applies_to: ["POST /firms/{firmId}/customers/{customerId}/close"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- BrokerageFirm ---
  - method: POST
    path: "/firms"
    description: "Create a brokerage firm"
    roles: [FirmAdmin]
    code: 201
    input: [legal_name]
    output: BrokerageFirm
    side_effects: ["tax_year_open=2025, wash_sale_window_days=30, correction_deadline_days=1095"]

  - method: GET
    path: "/firms/{firmId}"
    description: "Get a firm"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: BrokerageFirm
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/customers"
    description: "List customers of a firm"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/firms/{firmId}/customers"
    description: "Create a customer"
    roles: [FirmAdmin, TaxOps]
    code: 201
    input: [taxpayer_tin, display_name]
    output: Customer
    side_effects: ["status=ACTIVE, wash_sale_scope_key=taxpayer_tin"]

  - method: GET
    path: "/firms/{firmId}/customers/{customerId}"
    description: "Get a customer"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/suspend"
    description: "Suspend a customer"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → SUSPENDED; new dispositions and basis change requests blocked"]

  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/reinstate"
    description: "Reinstate a suspended customer"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/close"
    description: "Close a customer"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → CLOSED; bumps Customer.version; stale-marks non-REFILED forms"]

  - method: GET
    path: "/firms/{firmId}/customers/{customerId}/accounts"
    description: "List accounts under a customer"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  # --- Account ---
  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/accounts"
    description: "Open a new account"
    roles: [FirmAdmin, TaxOps]
    code: 201
    input: [account_number, account_type, "default_disposal_method?"]
    output: Account
    side_effects: ["status=OPEN, default_disposal_method defaults to FIFO"]

  - method: GET
    path: "/firms/{firmId}/accounts/{accountId}"
    description: "Get an account"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/accounts/{accountId}/restrict"
    description: "Restrict an account (no new dispositions or outbound transfers)"
    roles: [FirmAdmin, TaxOps]
    code: 200
    input: []
    output: Account
    side_effects: ["status → RESTRICTED"]

  - method: POST
    path: "/firms/{firmId}/accounts/{accountId}/reopen"
    description: "Reopen a restricted account"
    roles: [FirmAdmin, TaxOps]
    code: 200
    input: []
    output: Account
    side_effects: ["status → OPEN"]

  - method: POST
    path: "/firms/{firmId}/accounts/{accountId}/close"
    description: "Close an account"
    roles: [FirmAdmin, TaxOps]
    code: 200
    input: []
    output: Account
    side_effects: ["status → CLOSED; requires all lots fully disposed"]

  # --- Security ---
  - method: POST
    path: "/firms/{firmId}/securities"
    description: "Register a security master record"
    roles: [FirmAdmin, TaxOps]
    code: 201
    input: [cusip, ticker, security_type, covered_security_effective_date]
    output: Security
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/securities/{securityId}"
    description: "Get a security"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: Security
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/securities"
    description: "List securities"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: ["cusip?", "security_type?", "limit?", "offset?"]
    output: "Security[]"
    side_effects: []

  # --- TaxLot ---
  - method: POST
    path: "/firms/{firmId}/accounts/{accountId}/tax_lots"
    description: "Book an acquisition lot"
    roles: [FirmAdmin, TaxOps, CustomerService]
    code: 201
    input: [security_id, acquisition_date, quantity, original_cost_basis_cents, "acquisition_kind?", "gift_donor_basis_cents?", "gift_fmv_cents_at_gift?", "inherited_fmv_cents_at_death?"]
    output: TaxLot
    side_effects:
      - "covered_status computed per covered_status_classification"
      - "quantity_remaining := quantity"
      - "adjusted_cost_basis_cents := original_cost_basis_cents (or inherited_fmv_cents_at_death for INHERITANCE)"
      - "lot_status := OPEN"

  - method: GET
    path: "/firms/{firmId}/tax_lots/{lotId}"
    description: "Get a tax lot"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: TaxLot
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/accounts/{accountId}/tax_lots"
    description: "List lots under an account"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: ["security_id?", "lot_status?", "covered_status?", "acquisition_kind?", "limit?", "offset?"]
    output: "TaxLot[]"
    side_effects: []

  # --- Disposition ---
  - method: POST
    path: "/firms/{firmId}/accounts/{accountId}/dispositions"
    description: "Book a sale (PENDING)"
    roles: [FirmAdmin, TaxOps, CustomerService]
    code: 201
    input: [security_id, trade_date, settlement_date, quantity, proceeds_cents, "method?", "lot_allocations?"]
    output: Disposition
    side_effects: ["status=PENDING; method defaults to account.default_disposal_method"]

  - method: GET
    path: "/firms/{firmId}/dispositions/{dispositionId}"
    description: "Get a disposition"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: Disposition
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/accounts/{accountId}/dispositions"
    description: "List dispositions under an account"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: ["security_id?", "status?", "tax_year?", "limit?", "offset?"]
    output: "Disposition[]"
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/dispositions/{dispositionId}/settle"
    description: "Settle a PENDING disposition"
    roles: [TaxOps]
    code: 200
    input: []
    output: Disposition
    side_effects:
      - "Run lot_selection_and_gain, consume lots, compute realized_gain_cents"
      - "Run wash_sale_detection; create WashSaleEvents; cascade taint onto replacement lots"
      - "If wash sale detected: any in-scope DRAFT/GENERATED TaxForm1099B is invalidated to DRAFT"

  - method: POST
    path: "/firms/{firmId}/dispositions/{dispositionId}/void"
    description: "Void a PENDING disposition (no lot consumption occurred)"
    roles: [TaxOps]
    code: 200
    input: []
    output: Disposition
    side_effects: ["status → VOIDED"]

  - method: POST
    path: "/firms/{firmId}/dispositions/{dispositionId}/correct"
    description: "Correct a SETTLED disposition (creates a replacement PENDING disposition)"
    roles: [TaxOps]
    code: 200
    input: ["proceeds_cents?", "quantity?", "lot_allocations?"]
    output: Disposition
    side_effects:
      - "Original → CORRECTED; lot allocations reversed; WashSaleEvents unwound"
      - "A NEW Disposition row is created with corrected fields, immediately SETTLED"
      - "In-scope TaxForm1099B → CORRECTION_PENDING"

  - method: GET
    path: "/firms/{firmId}/dispositions/{dispositionId}/preview_gain"
    description: "Preview realized gain for a PENDING disposition (read-only, no lot mutation)"
    roles: [TaxOps, CustomerService, FirmAdmin]
    code: 200
    input: []
    output: "{ realized_gain_cents: integer, allocations: array }"
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/dispositions/{dispositionId}/preview_wash_sale"
    description: "Preview same-account wash-sale signal (read-only)"
    roles: [TaxOps, CustomerService, FirmAdmin]
    code: 200
    input: []
    output: "{ would_trigger: boolean, candidate_lot_ids: array }"
    side_effects: []

  # --- CorporateAction ---
  - method: POST
    path: "/firms/{firmId}/securities/{securityId}/corporate_actions"
    description: "Announce a corporate action"
    roles: [FirmAdmin, TaxOps]
    code: 201
    input: [action_type, effective_date, "split_ratio_numerator?", "split_ratio_denominator?", "merger_acquirer_security_id?", "merger_cash_per_share_cents?", "merger_shares_per_source_share?", "spinoff_cost_allocation_pct?"]
    output: CorporateAction
    side_effects: ["status=ANNOUNCED"]

  - method: GET
    path: "/firms/{firmId}/corporate_actions/{actionId}"
    description: "Get a corporate action"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: CorporateAction
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/securities/{securityId}/corporate_actions"
    description: "List corporate actions for a security"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CorporateAction[]"
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/corporate_actions/{actionId}/apply"
    description: "Apply a corporate action to all affected lots"
    roles: [TaxOps]
    code: 200
    input: []
    output: CorporateAction
    side_effects:
      - "Source lots → SUPERSEDED; derived lots created per corporate_action_basis_adjustment"
      - "Affected Account.version += 1"

  - method: POST
    path: "/firms/{firmId}/corporate_actions/{actionId}/cancel"
    description: "Cancel an ANNOUNCED corporate action"
    roles: [TaxOps]
    code: 200
    input: []
    output: CorporateAction
    side_effects: ["status → CANCELLED"]

  # --- TransferStatement ---
  - method: POST
    path: "/firms/{firmId}/accounts/{accountId}/transfer_statements"
    description: "Create a transfer statement (inbound receipt or outbound delivery)"
    roles: [TaxOps, FirmAdmin]
    code: 201
    input: [direction, counterparty_firm_name, security_id, quantity, transfer_date, "lots_payload?", "replaces_statement_id?"]
    output: TransferStatement
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/firms/{firmId}/transfer_statements/{stmtId}"
    description: "Get a transfer statement"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor]
    code: 200
    input: []
    output: TransferStatement
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/accounts/{accountId}/transfer_statements"
    description: "List transfer statements for an account"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor]
    code: 200
    input: ["direction?", "status?", "limit?", "offset?"]
    output: "TransferStatement[]"
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/transfer_statements/{stmtId}/deliver"
    description: "Deliver a transfer statement (outbound consumes source lots; OCC-guarded)"
    roles: [TaxOps]
    code: 200
    input: [expected_account_version]
    output: TransferStatement
    side_effects:
      - "For OUTBOUND: source lots consumed in account.default_disposal_method order; increments Account.version by 1"
      - "status → DELIVERED"

  - method: POST
    path: "/firms/{firmId}/transfer_statements/{stmtId}/accept"
    description: "Accept a delivered statement (inbound materializes lots)"
    roles: [TaxOps]
    code: 200
    input: []
    output: TransferStatement
    side_effects: ["status → ACCEPTED; INBOUND creates TRANSFER_IN lots"]

  - method: POST
    path: "/firms/{firmId}/transfer_statements/{stmtId}/reject"
    description: "Reject a delivered statement (outbound rolls back source lots)"
    roles: [TaxOps]
    code: 200
    input: []
    output: TransferStatement
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/firms/{firmId}/transfer_statements/{stmtId}/redeliver"
    description: "Move a REJECTED statement back to PENDING for editing"
    roles: [TaxOps]
    code: 200
    input: []
    output: TransferStatement
    side_effects: ["status → PENDING"]

  # --- WashSaleEvent ---
  - method: GET
    path: "/firms/{firmId}/wash_sale_events/{eventId}"
    description: "Get a wash sale event"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor]
    code: 200
    input: []
    output: WashSaleEvent
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/dispositions/{dispositionId}/wash_sale_events"
    description: "List wash-sale events triggered by a disposition"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "WashSaleEvent[]"
    side_effects: []

  # --- TaxForm1099B ---
  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/tax_forms_1099b"
    description: "Create a DRAFT 1099-B for a customer+year"
    roles: [TaxOps, FirmAdmin]
    code: 201
    input: [tax_year]
    output: TaxForm1099B
    side_effects: ["status=DRAFT; totals zeroed"]

  - method: GET
    path: "/firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}"
    description: "Get a 1099-B form"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: TaxForm1099B
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/customers/{customerId}/tax_forms_1099b"
    description: "List 1099-B forms for a customer"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: ["tax_year?", "status?", "limit?", "offset?"]
    output: "TaxForm1099B[]"
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/generate"
    description: "Generate totals for a DRAFT form (OCC-guarded on Customer.version)"
    roles: [TaxOps]
    code: 200
    input: [expected_customer_version]
    output: TaxForm1099B
    side_effects:
      - "Run form_1099b_aggregation; populate all six totals + disallowed_wash_sale_loss_cents"
      - "generated_from_version := Customer.version at generate time"
      - "status → GENERATED"

  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/file"
    description: "File a GENERATED form"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: TaxForm1099B
    side_effects: ["filed_at := now; status → FILED"]

  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/refile"
    description: "Refile a CORRECTION_PENDING form (re-aggregates with corrected source data)"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: TaxForm1099B
    side_effects: ["correction_count += 1; totals recomputed; status → REFILED"]

  # --- BasisChangeRequest ---
  - method: POST
    path: "/firms/{firmId}/customers/{customerId}/basis_change_requests"
    description: "Customer submits a basis change request"
    roles: [Customer, CustomerService]
    code: 201
    input: [tax_lot_id, request_kind, "proposed_basis_cents?", "proposed_acquisition_date?", "proposed_coverage?", "gift_donor_basis_cents?", "gift_fmv_cents_at_gift?", "supporting_doc_ref?"]
    output: BasisChangeRequest
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/firms/{firmId}/basis_change_requests/{reqId}"
    description: "Get a basis change request"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: []
    output: BasisChangeRequest
    side_effects: []

  - method: GET
    path: "/firms/{firmId}/customers/{customerId}/basis_change_requests"
    description: "List basis change requests for a customer"
    roles: [FirmAdmin, TaxOps, CustomerService, Auditor, Customer]
    code: 200
    input: ["status?", "request_kind?", "limit?", "offset?"]
    output: "BasisChangeRequest[]"
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/basis_change_requests/{reqId}/start_review"
    description: "TaxOps starts review"
    roles: [TaxOps]
    code: 200
    input: []
    output: BasisChangeRequest
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/firms/{firmId}/basis_change_requests/{reqId}/approve"
    description: "TaxOps approves the request (snapshot TaxLot.version)"
    roles: [TaxOps]
    code: 200
    input: []
    output: BasisChangeRequest
    side_effects: ["approved_by_user_id := actor; version_applied_to := TaxLot.version; status → APPROVED"]

  - method: POST
    path: "/firms/{firmId}/basis_change_requests/{reqId}/apply"
    description: "Apply an APPROVED request (different TaxOps user; OCC-guarded on TaxLot.version)"
    roles: [TaxOps]
    code: 200
    input: [expected_tax_lot_version]
    output: BasisChangeRequest
    side_effects:
      - "Apply the change per basis_change_request_application"
      - "Increments TaxLot.version by 1"
      - "Any in-scope TaxForm1099B → CORRECTION_PENDING"
      - "status → APPLIED"

  - method: POST
    path: "/firms/{firmId}/basis_change_requests/{reqId}/reject"
    description: "TaxOps rejects the request"
    roles: [TaxOps]
    code: 200
    input: []
    output: BasisChangeRequest
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/firms/{firmId}/basis_change_requests/{reqId}/resubmit"
    description: "Customer resubmits a REJECTED request"
    roles: [Customer]
    code: 200
    input: []
    output: BasisChangeRequest
    side_effects: ["status → RESUBMITTED"]

  # --- Flat read surface (FK reverse-reachability + segment registration) ---
  # These flat single-resource and filtered-list GETs complement the nested
  # paths above. They exist so every FK declared in §1.1 is reverse-reachable
  # per §1.5's rule, and so list filtering across FK dimensions is first-class.
