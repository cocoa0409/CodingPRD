              captures: { cake_tonnes: "$.data.digestate_solids_tonnes", liquid_tonnes: "$.data.digestate_liquid_tonnes", bedding_tonnes: "$.data.bedding_recovered_tonnes" }
            - call: "GET /facilities/${facility_id}/financial-summary"
