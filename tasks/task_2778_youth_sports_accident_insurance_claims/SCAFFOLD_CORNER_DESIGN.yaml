            - "after the trigger: Participant.${p1_id}.enrolled_policy_count == 0 and roster_status == INACTIVE"
            - "after the trigger: LeaguePolicy.${pol_id}.annual_premium_cents is still 822840 - withdrawal does not re-rate the policy mid-term"

      - name: cyclic_shape_correction_loop_termination
        claim_type: cyclic
        grounds: [state_machines.InjuryReport.RETURNED_FOR_CORRECTION_to_PENDING_VERIFICATION]
        excluded_because:
          difficulty_instance: non_linear_state_machine / injury_report_correction_loop_capped_at_two_rounds_then_verifiable
          rationale: "That instance drives the return/resubmit cycle twice, proves the third return is refused with ERR_CORRECTION_ROUNDS_EXHAUSTED, and shows the loop counter frozen at 2 while a VERIFY still succeeds - the full cyclic-shape claim."

      - name: parallel_shape_independent_state_dimensions
        claim_type: parallel
        grounds: [state_machines.Claim.PENDING_COORDINATION_to_UNDER_ADJUDICATION]
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_dual_axis_adjudication_and_coordination_advance_independently
          rationale: "That instance advances each Claim axis in isolation and asserts the combined state plus the single declared join, which is exactly the parallel-shape claim."

      - name: cascade_down_side_effect_pattern
        claim_type: cascade_down
        grounds: [state_machines.League.SANCTIONED_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_report_verification_freezes_policy_and_rejects_pending_activity
          rationale: "That instance verifies the five-link chain down to the pending activity being REJECTED with rejection_reason POLICY_FROZEN, and asserts only non-terminal children are touched."

      - name: cross_entity_side_effect_pattern
        claim_type: cross_entity
        grounds: [state_machines.Claim.APPROVED_to_PAID]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_catastrophic_payment_exhausts_lifetime_and_rejects_pending_report
          rationale: "That instance shows a BenefitPayment write adjusting the Enrollment's lifetime counters and then the InjuryReport, with each downstream entity's state and fields asserted."

      - name: compensation_side_effect_pattern
        claim_type: compensation
        grounds: [state_machines.BenefitPayment.ISSUED_to_VOIDED]
        excluded_because:
          difficulty_instance: compensating_invariant / benefit_payment_void_restores_paid_loss_and_reserve_money_invariant
          rationale: "That instance asserts the post-void aggregates are byte-identical to the pre-payment aggregates, i.e. every original side effect reversed with no drift."

      - name: guarded_transition_cross_entity_precondition
        claim_type: guarded transitions
        grounds: [state_machines.Claim.UNDER_ADJUDICATION_to_APPROVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_adjudication_guarded_two_hops_through_policy_to_league_sanctioning
          rationale: "That instance is the A->B-only-if-C-in-state-X claim, driven both ways across two hops (Claim <- LeaguePolicy <- League)."

  - section: calculations
    instances:

      - name: out_of_network_allowed_amount_uses_one_hundred_forty_percent_of_fee_schedule
        claim_type: correct_result
        grounds:
          - calculations.provider_bill_allowed_amount
          - global_constants.OON_FEE_SCHEDULE_MULTIPLIER_BPS
          - global_constants.OON_FAMILY_SHARE_CAP_CENTS
          - entities.ProviderBill.fields.negotiated_amount_cents
        distinguishing_aspect: "Two OUT_OF_NETWORK bills on one claim separate the two ceilings: with a fee schedule of 200000 the 140 percent multiplier binds at 280000 (below the 300000 scheduled cap), while with a fee schedule of 260000 the multiplier yields 364000 so the cap binds at 300000. Family responsibility is capped at 15000 on each bill even though the balances are 200000 and 180000, which is the balance-protection claim."
        test_recipe:
          setup:
            - "One league, one BASEBALL_U12 classification (DIAGNOSTIC_IMAGING cap 300000) and one ACTIVE policy with 404 participants."
            - "One ENROLLED athlete with a VERIFIED MODERATE injury report, so the severity cap factor is 10000 bps and the scheduled cap stays at 300000."
            - "Two OUT_OF_NETWORK DIAGNOSTIC_IMAGING bills, both billed 480000, with fee schedules of 200000 and 260000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /leagues"
              payload: { name: "Oakhaven Baseball", league_code: "OHB-120", state_code: "MD", governing_body_code: "USYSA", contact_email: "admin@ohb.example" }
