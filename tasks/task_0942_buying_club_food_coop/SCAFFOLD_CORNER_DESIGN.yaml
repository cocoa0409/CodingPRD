      - call: POST /order-lines
        payload:
          member_order_id: ${mo_a}
          item_id: ${i_salt}
          qty_units: 5
          expected_member_order_version: ${mo_a_v1}
        as: Member
        as_user_id: ${ma_id}
        captures:
          ol_salt: $.data.id
      - call: POST /member-orders/${mo_a}/submit
        payload: {}
        as: Member
        as_user_id: ${ma_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-25T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /cycles/${cyc}/lock
        payload: {}
        as: ClubAdmin
      - call: GET /drop-runs/${dr_b}
        payload: {}
        as: ClubAdmin
      - call: GET /order-lines/${ol_salt}
        payload: {}
        as: Member
        as_user_id: ${ma_id}
      - call: GET /route-runs
        payload:
          cycle_id: ${cyc}
        as: ClubAdmin
        captures:
          rrx: $.data[0].id
      - call: GET /case-aggregates
        payload:
          route_run_id: ${rrx}
        as: ClubAdmin
        captures:
          cax: $.data[0].id
      assert:
      - the lock response itself carries Cycle.status == LOCKED and a non-null locked_at
      - OrderLine.${ol_salt}.status == CONFIRMED
      - OrderLine.${ol_salt}.bound_case_price_cents == 5250
      - OrderLine.${ol_salt}.unit_price_cents == 1050
      - OrderLine.${ol_salt}.confirmed_units == 5
      - MemberOrder.${mo_a}.status == LOCKED
      - DropRun.${dr_b}.subtotal_cents == 5250
      - DropRun.${dr_b}.status == QUALIFIED
      - CaseAggregate.${cax}.requested_units == 5
      - CaseAggregate.${cax}.cases_ordered == 1
      - CaseAggregate.${cax}.covered_units == 5
      - RouteRun.${rrx}.status == QUALIFIED
