              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 20000, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
            - call: "POST /pricing/repricing-rules"
              payload: { market_id: "${m_id}", category_code: "APPLIANCE", target_position_bp: 9700, max_change_pct: 0.10, change_frequency_limit_days: 7, priority: 10 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { r_id: $.data.id }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "AUTOMATED_RULE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-02T00:00:00Z", expected_product_version: "${p_ver1}" }
              as: PricingAnalyst
