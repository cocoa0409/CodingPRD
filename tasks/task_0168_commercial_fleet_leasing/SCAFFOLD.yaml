scenario: |
  Commercial Fleet Leasing: vehicle allocation, mileage/fuel card/maintenance, Telematics,
  mileage overage settlement, collision repair, lease-end return, IFTA fuel tax filing.

domain_name: commercial-fleet-leasing
api_prefix: /lease-agreements

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - cascading_side_effects
  entity_topology: hybrid
  state_machine_shape: branching            # CollisionClaim revisions + LeaseAgreement compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                           # FuelCardTransaction can be IFTA-eligible or not
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lessee
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered business name of the lessee company.
        constraints: 1..120 characters, non-empty after trim.
      - name: dot_number
        type: string
        source: input
        description: US Department of Transportation operator number.
        constraints: 6..8 digits, unique across all Lessees.
      - name: base_jurisdiction
        type: enum
        source: input
        description: Two-letter US state code used as IFTA base jurisdiction.
        constraints: "Values in {CA, TX, NY, IL, FL, OH, PA, GA, WA, AZ}."
      - name: account_status
        type: enum
        source: computed
        description: Lifecycle status; gates new lease allocation.
        default: ACTIVE
        constraints: "Values in {ACTIVE, SUSPENDED, CLOSED}."
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: Sum of unpaid settlement.balance_cents for this lessee.
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: 17-character vehicle identification number.
        constraints: Exactly 17 chars [A-HJ-NPR-Z0-9]; unique across Vehicle.
      - name: vehicle_class
        type: enum
        source: input
        description: Tractor class drives maintenance cadence and overage rate.
        constraints: "Values in {CLASS_3, CLASS_5, CLASS_7, CLASS_8}."
      - name: model_year
        type: integer
        source: input
        description: Manufacturing year.
        constraints: 2000..2030 inclusive.
      - name: odometer_baseline_miles
        type: integer
        source: input
        description: Odometer reading at allocation, used as the baseline for overage math.
        default: 0
        constraints: ">= 0."
      - name: odometer_current_miles
        type: integer
        source: computed
        description: Latest reconciled odometer per §1.3 odometer_reconciliation.
        default: 0
      - name: vehicle_status
        type: enum
        source: computed
        description: Lifecycle state; gates allocation.
        default: AVAILABLE
        constraints: "Values in {AVAILABLE, ALLOCATED, IN_SHOP, GROUNDED, RETIRED}."
      - name: current_lease_id
        type: string
        source: computed
        description: Foreign key to active LeaseAgreement, or null when AVAILABLE/RETIRED.
        default: null

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - name: lessee_id
        type: string
        source: input
        description: Foreign key to Lessee.
      - name: vehicle_id
        type: string
        source: input
        description: Foreign key to Vehicle.
      - name: term_start_date
        type: datetime
        source: input
        description: First day of the lease (inclusive).
      - name: term_end_date
        type: datetime
        source: input
        description: Scheduled last day of the lease (inclusive).
        constraints: term_end_date > term_start_date; max 60 months.
      - name: monthly_mileage_allowance
        type: integer
        source: input
        description: Miles included per calendar month at no extra charge.
        constraints: 1000..15000 inclusive.
      - name: overage_rate_cents_per_mile
        type: integer
        source: input
        description: Per-mile charge applied to overage above allowance.
        constraints: 5..100 inclusive.
      - name: tiered_overage_enabled
        type: boolean
        source: input
        description: When true, calculation overage_settlement uses tiered_pricing variant; otherwise flat-rate variant.
        default: false
      - name: lease_state
        type: enum
        source: computed
        description: Compound state derived from active sub-flows (see §1.2 LeaseAgreement).
        default: DRAFT
        constraints: "Values in {DRAFT, ACTIVE, IN_RETURN, CLOSED, DEFAULTED}."
      - name: cumulative_overage_miles
        type: integer
        source: computed
        description: Sum across closed monthly settlements; resets at term close.
        default: 0
      - name: collision_open_count
        type: integer
        source: computed
        description: Count of CollisionClaim rows on this lease whose claim_status is not in {APPROVED, REJECTED}.
        default: 0

  - name: FuelCard
    parent: LeaseAgreement
    common_fields: true
    fields:
      - name: lease_agreement_id
        type: string
        source: input
        description: Foreign key to parent LeaseAgreement.
      - name: card_pan_last4
        type: string
        source: input
        description: Last 4 digits of card PAN (PCI-safe).
        constraints: exactly 4 digits.
      - name: monthly_limit_cents
        type: integer
        source: input
        description: Monthly spend cap enforced when posting transactions.
        constraints: 50000..1000000 inclusive.
      - name: card_status
        type: enum
        source: computed
        description: Card lifecycle.
        default: ACTIVE
        constraints: "Values in {ACTIVE, BLOCKED, CLOSED}."
      - name: current_period_spend_cents
        type: integer
        source: computed
        description: Sum of FuelCardTransaction.amount_cents within current calendar month with txn_status=POSTED.
        default: 0

  - name: FuelCardTransaction
    parent: FuelCard
    common_fields: false
    fields:
      - name: fuel_card_id
        type: string
        source: input
        description: Foreign key to FuelCard.
      - name: posted_at
        type: datetime
        source: input
        description: Wall-clock timestamp of the transaction at the pump.
      - name: jurisdiction
        type: enum
        source: input
        description: Two-letter US state code where the fuel was dispensed.
        constraints: "Values in {CA, TX, NY, IL, FL, OH, PA, GA, WA, AZ}."
      - name: gallons
        type: number
        source: input
        description: Fuel quantity, in gallons; up to 3 decimals.
        constraints: "> 0; <= 200."
      - name: amount_cents
        type: integer
        source: input
        description: Total transaction amount in US cents.
        constraints: "> 0; <= 100000."
      - name: txn_status
        type: enum
        source: computed
        description: Transaction lifecycle.
        default: POSTED
        constraints: "Values in {POSTED, REVERSED, IFTA_INCLUDED}."
      - name: ifta_eligible
        type: boolean
        source: computed
        description: True iff vehicle_class in {CLASS_7, CLASS_8} on the vehicle owning the parent fuel card at posted_at.

  - name: TelematicsEvent
    parent: Vehicle
    common_fields: false
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: Foreign key to Vehicle.
      - name: event_ts
        type: datetime
        source: input
        description: Timestamp the device produced the reading.
      - name: odometer_reading
        type: integer
        source: input
        description: Cumulative miles reported by the device.
        constraints: ">= 0."
      - name: harsh_event_count
        type: integer
        source: input
        description: Harsh-brake / harsh-acceleration count since prior event.
        default: 0
        constraints: ">= 0."
      - name: fault_code
        type: string
        source: input
        description: OEM-specific fault code or empty string.
        default: ""
      - name: ingest_status
        type: enum
        source: computed
        description: Whether the event was kept (advanced odometer) or discarded as stale.
        default: ACCEPTED
        constraints: "Values in {ACCEPTED, REJECTED_STALE}."

  - name: MaintenanceTicket
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: Foreign key to Vehicle.
      - name: ticket_kind
        type: enum
        source: input
        description: PM = preventive maintenance triggered by mileage; REPAIR = ad-hoc.
        constraints: "Values in {PM, REPAIR}."
      - name: opened_at_odometer
        type: integer
        source: system
        description: Vehicle.odometer_current_miles at ticket open time.
      - name: estimate_cents
        type: integer
        source: input
        description: Vendor cost estimate, in cents.
        default: 0
      - name: actual_cents
        type: integer
        source: input
        description: Final cost on close, in cents.
        default: 0
      - name: ticket_status
        type: enum
        source: computed
        description: Workshop status.
        default: OPEN
        constraints: "Values in {OPEN, IN_SHOP, CLOSED, CANCELLED}."

  - name: CollisionClaim
    parent: LeaseAgreement
    common_fields: true
    fields:
      - name: lease_agreement_id
        type: string
        source: input
        description: Foreign key to LeaseAgreement.
      - name: vehicle_id
        type: string
        source: system
        description: Copied from LeaseAgreement.vehicle_id at create time (immutable).
      - name: incident_ts
        type: datetime
        source: input
        description: Wall-clock timestamp of the collision.
      - name: estimate_cents
        type: integer
        source: input
        description: Initial repair estimate from vendor, in cents.
        constraints: ">= 0."
      - name: revised_estimate_cents
        type: integer
        source: input
        description: Revised vendor estimate; only set after a REVISION_REQUESTED cycle.
        default: 0
      - name: lessee_deductible_cents
        type: integer
        source: computed
        description: Per §1.3 collision_settlement; equals min(estimate_cents, DEDUCTIBLE_CAP_CENTS).
        default: 0
      - name: claim_status
        type: enum
        source: computed
        description: Branching workflow with revert.
        default: FILED
        constraints: "Values in {FILED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED}."
      - name: revision_round
        type: integer
        source: computed
        description: Number of REVIEW → REVISION_REQUESTED → REVIEW cycles consumed.
        default: 0

  - name: OverageSettlement
    parent: LeaseAgreement
    common_fields: true
    fields:
      - name: lease_agreement_id
        type: string
        source: input
        description: Foreign key to LeaseAgreement.
      - name: period_year
        type: integer
        source: input
        description: Calendar year of the billing period.
        constraints: 2000..2099 inclusive.
      - name: period_month
        type: integer
        source: input
        description: Calendar month (1..12) of the billing period.
        constraints: 1..12 inclusive.
      - name: provisional_overage_miles
        type: integer
        source: computed
        description: Estimated overage at draft time using latest telematics odometer.
        default: 0
      - name: final_overage_miles
        type: integer
        source: computed
        description: Locked overage at finalize time using period-end odometer.
        default: 0
      - name: provisional_balance_cents
        type: integer
        source: computed
        description: Draft money owed at provisional time per §1.3 overage_settlement (forward-looking variant).
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: Finalized money owed per §1.3 overage_settlement (chronological variant).
        default: 0
      - name: settlement_status
        type: enum
        source: computed
        description: Lifecycle of the settlement record.
        default: DRAFT
        constraints: "Values in {DRAFT, FINAL, PAID, DISPUTED}."

  - name: IFTAQuarter
    parent: Lessee
    common_fields: true
    fields:
      - name: lessee_id
        type: string
        source: input
        description: Foreign key to Lessee.
      - name: year
        type: integer
        source: input
        description: Calendar year of the quarter.
        constraints: 2000..2099 inclusive.
      - name: quarter
        type: integer
        source: input
        description: Quarter index (1..4).
        constraints: 1..4 inclusive.
      - name: filing_status
        type: enum
        source: computed
        description: Filing lifecycle; CLOSED is terminal.
        default: OPEN
        constraints: "Values in {OPEN, READY, CLOSED}."
      - name: total_taxable_gallons
        type: number
        source: computed
        description: Sum of FuelCardTransaction.gallons across ifta_eligible POSTED txns in the quarter window.
        default: 0
      - name: total_tax_cents
        type: integer
        source: computed
        description: Per §1.3 ifta_tax; signed (negative => refund).
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LeaseAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, DEFAULTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /lease-agreements/{id}/activate
        actor: FleetManager
        preconditions:
          - LeaseAgreement.lease_state == DRAFT
          - Vehicle.vehicle_status == AVAILABLE
          - Lessee.account_status == ACTIVE
          - Lessee.outstanding_balance_cents < SUSPEND_THRESHOLD_CENTS
        side_effects:
          - Vehicle.vehicle_status -> ALLOCATED
          - Vehicle.current_lease_id -> this LeaseAgreement.id
          - Vehicle.odometer_current_miles set to Vehicle.odometer_baseline_miles
      - from: ACTIVE
        to: IN_RETURN
        trigger: POST /lease-agreements/{id}/begin-return
        actor: FleetManager
        preconditions:
          - LeaseAgreement.lease_state == ACTIVE
          - LeaseAgreement.collision_open_count == 0
        side_effects:
          - Vehicle.vehicle_status -> IN_SHOP
          - Generate a final OverageSettlement record for the last partial month (DRAFT)
      - from: IN_RETURN
        to: CLOSED
        trigger: POST /lease-agreements/{id}/finalize-return
        actor: FleetManager
        preconditions:
          - LeaseAgreement.lease_state == IN_RETURN
          - All MaintenanceTicket rows for the vehicle are in {CLOSED, CANCELLED}
          - All OverageSettlement rows for the lease have settlement_status in {PAID, DISPUTED} or FINAL with balance_cents == 0
        side_effects:
          - Vehicle.vehicle_status -> AVAILABLE
          - Vehicle.current_lease_id -> null
          - FuelCard.card_status -> CLOSED (for all cards under this lease)
      - from: ACTIVE
        to: DEFAULTED
        trigger: POST /lessees/{id}/suspend (when Lessee.outstanding_balance_cents >= DEFAULT_THRESHOLD_CENTS)
        actor: system
        preconditions:
          - LeaseAgreement.lease_state == ACTIVE
          - Lessee.account_status == SUSPENDED
          - Lessee.outstanding_balance_cents >= DEFAULT_THRESHOLD_CENTS
        side_effects:
          - Vehicle.vehicle_status -> GROUNDED
          - FuelCard.card_status -> BLOCKED for every card under this lease
        note: |
          Transitive cascade depth 3: Lessee.suspend -> LeaseAgreement.DEFAULTED -> FuelCard.BLOCKED.

  - entity: CollisionClaim
    initial_state: FILED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: POST /collision-claims/{id}/start-review
        actor: ClaimAdjuster
        preconditions:
          - CollisionClaim.claim_status == FILED
          - LeaseAgreement.lease_state in {ACTIVE, IN_RETURN}
        side_effects:
          - LeaseAgreement.collision_open_count is unchanged (still non-terminal)
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /collision-claims/{id}/approve
        actor: ClaimAdjuster
        preconditions:
          - CollisionClaim.claim_status == UNDER_REVIEW
        side_effects:
          - Compute lessee_deductible_cents per §1.3 collision_settlement
          - LeaseAgreement.collision_open_count decremented by 1
          - Lessee.outstanding_balance_cents += lessee_deductible_cents
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: POST /collision-claims/{id}/request-revision
        actor: ClaimAdjuster
        preconditions:
          - CollisionClaim.claim_status == UNDER_REVIEW
          - CollisionClaim.revision_round < MAX_REVISION_ROUNDS
        side_effects:
          - CollisionClaim.revision_round += 1
        note: Cyclic re-entry to UNDER_REVIEW after revised estimate is provided.
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: PATCH /collision-claims/{id} with revised_estimate_cents
        actor: VendorOps
        preconditions:
          - CollisionClaim.claim_status == REVISION_REQUESTED
          - revised_estimate_cents > 0
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /collision-claims/{id}/reject
        actor: ClaimAdjuster
        preconditions:
          - CollisionClaim.claim_status == UNDER_REVIEW
        side_effects:
          - LeaseAgreement.collision_open_count decremented by 1

  - entity: OverageSettlement
    initial_state: DRAFT
    terminal_states: [PAID, DISPUTED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: POST /overage-settlements/{id}/finalize
        actor: FleetManager
        preconditions:
          - OverageSettlement.settlement_status == DRAFT
          - LeaseAgreement.lease_state in {ACTIVE, IN_RETURN}
        side_effects:
          - Recompute final_overage_miles + balance_cents per §1.3 overage_settlement (chronological)
          - LeaseAgreement.cumulative_overage_miles += final_overage_miles
      - from: FINAL
        to: PAID
        trigger: POST /overage-settlements/{id}/mark-paid
        actor: FleetManager
        preconditions:
          - OverageSettlement.settlement_status == FINAL
        side_effects:
          - Lessee.outstanding_balance_cents -= balance_cents
      - from: FINAL
        to: DISPUTED
        trigger: POST /overage-settlements/{id}/dispute
        actor: Lessee
        preconditions:
          - OverageSettlement.settlement_status == FINAL
          - now() <= OverageSettlement.created_at + DISPUTE_WINDOW_DAYS
        side_effects: []
        note: |
          Lessee actor must own the LeaseAgreement: X-User-ID == LeaseAgreement.lessee_id.

  - entity: MaintenanceTicket
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_SHOP
        trigger: POST /maintenance-tickets/{id}/start
        actor: VendorOps
        preconditions:
          - MaintenanceTicket.ticket_status == OPEN
          - Vehicle.vehicle_status in {ALLOCATED, GROUNDED}
        side_effects:
          - Vehicle.vehicle_status -> IN_SHOP
      - from: IN_SHOP
        to: CLOSED
        trigger: POST /maintenance-tickets/{id}/close
        actor: VendorOps
        preconditions:
          - MaintenanceTicket.ticket_status == IN_SHOP
          - actual_cents > 0
        side_effects:
          - Vehicle.vehicle_status -> ALLOCATED (if previous was ALLOCATED via current_lease_id) or GROUNDED otherwise
      - from: OPEN
        to: CANCELLED
        trigger: POST /maintenance-tickets/{id}/cancel
        actor: FleetManager
        preconditions:
          - MaintenanceTicket.ticket_status == OPEN
        side_effects: []

  - entity: IFTAQuarter
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: READY
        trigger: POST /ifta-quarters/{id}/prepare
        actor: TaxAdmin
        preconditions:
          - IFTAQuarter.filing_status == OPEN
          - now() >= quarter_end_date(year, quarter)
        side_effects:
          - Recompute total_taxable_gallons + total_tax_cents per §1.3 ifta_tax
      - from: READY
        to: CLOSED
        trigger: POST /ifta-quarters/{id}/file
        actor: TaxAdmin
        preconditions:
          - IFTAQuarter.filing_status == READY
        side_effects:
          - All POSTED FuelCardTransaction rows in the quarter window with ifta_eligible == true flip to txn_status=IFTA_INCLUDED
          - These transactions become immutable thereafter
        note: |
          Ops-run checkpoint — once CLOSED, no new IFTA-eligible txns may be added to the quarter window;
          new POSTED txns dated in a closed quarter are rejected with ERR_QUARTER_CLOSED.

  - entity: Lessee
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /lessees/{id}/suspend
        actor: FleetManager
        preconditions:
          - Lessee.account_status == ACTIVE
          - Lessee.outstanding_balance_cents >= SUSPEND_THRESHOLD_CENTS
        side_effects:
          - All LeaseAgreement rows with this lessee in lease_state == ACTIVE may transition to DEFAULTED (see LeaseAgreement state machine) when outstanding_balance_cents >= DEFAULT_THRESHOLD_CENTS
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /lessees/{id}/reinstate
        actor: FleetManager
        preconditions:
          - Lessee.account_status == SUSPENDED
          - Lessee.outstanding_balance_cents < SUSPEND_THRESHOLD_CENTS
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: Two lease agreements activated against the same Vehicle simultaneously.
    guarantee: At most one activation succeeds; the second is rejected.
    error_id: ERR_VEHICLE_ALREADY_ALLOCATED
    http_status: 409
    serialization: First-writer-wins on Vehicle.vehicle_status flip AVAILABLE → ALLOCATED.

  - scenario: Two finalize calls land on the same OverageSettlement.
    guarantee: Exactly one finalize wins; the loser sees the row already advanced.
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: First-writer-wins on OverageSettlement.settlement_status.

  - scenario: A POST FuelCardTransaction lands at the exact moment the parent IFTAQuarter is filed.
    guarantee: Either the txn lands before file (POSTED, becomes IFTA_INCLUDED on file) or it is rejected with ERR_QUARTER_CLOSED.
    error_id: ERR_QUARTER_CLOSED
    http_status: 409
    serialization: First-writer-wins on IFTAQuarter.filing_status flip READY → CLOSED.

  - scenario: PATCH on CollisionClaim arrives concurrent with a state transition.
    guarantee: Stale version is rejected; OCC field guards the row.
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: Optimistic concurrency on CollisionClaim.version.

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: overage_settlement
    trigger: |
      Provisional variant: GET /overage-settlements/{id} (when settlement_status == DRAFT)
      and POST /overage-settlements (create draft); side-effect of LeaseAgreement.begin-return
      also generates a DRAFT row.
      Final variant: POST /overage-settlements/{id}/finalize.
    algorithm: tiered_pricing
    formula: |
      # Inputs: lease (LeaseAgreement), period (year, month), variant in {provisional, final}
      # Step 1 - resolve odometer endpoints for the period
      if variant == "provisional":
          end_odometer = latest TelematicsEvent.odometer_reading for vehicle as of now()  # may extend past period_end
      else:  # final
          end_odometer = max TelematicsEvent.odometer_reading for vehicle with event_ts <= period_end (last day of month, 23:59:59.999)
      start_odometer = latest TelematicsEvent.odometer_reading for vehicle with event_ts <= period_start (first day of month, 00:00:00.000)
      if no TelematicsEvent before period_start: start_odometer = Vehicle.odometer_baseline_miles
      period_miles = end_odometer - start_odometer       # never negative; if negative -> 0
      overage_miles = max(0, period_miles - lease.monthly_mileage_allowance)
      # Step 2 - tiered or flat rate
      if lease.tiered_overage_enabled == false:
          balance_cents = overage_miles * lease.overage_rate_cents_per_mile
      else:
          # Tier breakpoints, both endpoints inclusive on the lower bound, exclusive on the upper bound.
          # Tier 1: [0, TIER1_BREAK)            -> rate = overage_rate_cents_per_mile
          # Tier 2: [TIER1_BREAK, TIER2_BREAK)  -> rate = overage_rate_cents_per_mile * TIER2_MULT_BPS / 10000
          # Tier 3: [TIER2_BREAK, +inf)         -> rate = overage_rate_cents_per_mile * TIER3_MULT_BPS / 10000
          # Compute charge per-tier (integer cents), then sum (round per-line-item then sum).
          tier1 = min(overage_miles, TIER1_BREAK) * overage_rate_cents_per_mile
          tier2_miles = max(0, min(overage_miles, TIER2_BREAK) - TIER1_BREAK)
          tier2 = round_half_up( tier2_miles * overage_rate_cents_per_mile * TIER2_MULT_BPS / 10000 )
          tier3_miles = max(0, overage_miles - TIER2_BREAK)
          tier3 = round_half_up( tier3_miles * overage_rate_cents_per_mile * TIER3_MULT_BPS / 10000 )
          balance_cents = tier1 + tier2 + tier3
      # variant write-back
      if variant == "provisional":
          settlement.provisional_overage_miles = overage_miles
          settlement.provisional_balance_cents = balance_cents
      else:
          settlement.final_overage_miles = overage_miles
          settlement.balance_cents = balance_cents
    input_set: |
      TelematicsEvent rows for the vehicle with ingest_status == ACCEPTED.
      Provisional variant: includes events through now() (forward-looking; the latest reading may extend
      beyond the period end). Final variant: window is strictly the calendar month [period_start, period_end].
    constants:
      TIER1_BREAK: 500
      TIER2_BREAK: 2000
      TIER2_MULT_BPS: 12500    # 1.25x
      TIER3_MULT_BPS: 15000    # 1.50x
    precision: integer cents; per-tier round_half_up; rounding order is per-line-item then sum.
    variants:
      - name: provisional
        when: settlement_status == DRAFT (during a billing period, may use latest telematics extending past period end).
        difference: |
          End-odometer is the latest accepted TelematicsEvent reading as of now() — forward-looking.
          May overstate or understate vs the chronological final once the period closes.
      - name: final
        when: POST /overage-settlements/{id}/finalize.
        difference: |
          End-odometer is the latest accepted TelematicsEvent strictly within the calendar month — chronological.
          Locks balance_cents and increments LeaseAgreement.cumulative_overage_miles.

  - name: ifta_tax
    trigger: |
      POST /ifta-quarters/{id}/prepare (compute and store on the row);
      GET /ifta-quarters/{id} returns the stored values plus per-jurisdiction breakdown.
    algorithm: weighted_scoring
    formula: |
      # Inputs: lessee_id, year, quarter
      # Step 1 - assemble eligible txns
      window_start = first day of quarter at 00:00:00.000
      window_end   = last day of quarter at 23:59:59.999
      eligible = [t for t in FuelCardTransaction
                  where fuel_card belongs to a LeaseAgreement.lessee_id == lessee_id
                    AND posted_at in [window_start, window_end]
                    AND txn_status == POSTED
                    AND ifta_eligible == true]
      # Step 2 - per-jurisdiction
      per_j = {}
      for t in eligible:
          per_j[t.jurisdiction] = per_j.get(t.jurisdiction, 0) + t.gallons
      total_taxable_gallons = sum(per_j.values())   # sum of gallons across jurisdictions
      # Step 3 - tax owed and tax credit
      tax_owed_cents = 0
      for j, gallons in per_j.items():
          # tax_owed at jurisdiction rate; one rate per j from IFTA_RATES; round_half_up per jurisdiction.
          tax_owed_cents += round_half_up(gallons * IFTA_RATES[j])
      # tax credit at base-jurisdiction rate, regardless of where fuel was bought
      base_rate = IFTA_RATES[Lessee.base_jurisdiction]
      tax_credit_cents = round_half_up(total_taxable_gallons * base_rate)
      total_tax_cents = tax_owed_cents - tax_credit_cents     # signed; negative => refund
    input_set: |
      FuelCardTransaction rows in the quarter window with txn_status==POSTED and ifta_eligible==true.
      Exclude REVERSED and IFTA_INCLUDED. Tie-break for txn ordering within a jurisdiction: posted_at ASC, then id ASC.
    constants:
      IFTA_RATES:
        CA: 87        # cents per gallon (state-level fuel tax)
        TX: 20
        NY: 45
        IL: 47
        FL: 36
        OH: 47
        PA: 75
        GA: 32
        WA: 49
        AZ: 26
    precision: integer cents; round_half_up applied per jurisdiction and on the credit sum.
    variants:
      - name: per_jurisdiction_then_sum
        when: Standard quarterly close path.
        difference: |
          Per-jurisdiction round_half_up first, sum after. Pinned order.
      - name: sum_then_round_DO_NOT_USE
        when: Anti-pattern.
        difference: |
          Summing un-rounded amounts and rounding once at the end produces a different value by a few cents.
          The scaffold explicitly forbids this variant; tests assert per_jurisdiction_then_sum.

  - name: collision_settlement
    trigger: POST /collision-claims/{id}/approve
    algorithm: threshold
    formula: |
      # Lessee deductible
      raw = min(CollisionClaim.estimate_cents if revised_estimate_cents == 0 else revised_estimate_cents,
                DEDUCTIBLE_CAP_CENTS)
      # Reduce by 25% on first revision if no fault_code in any TelematicsEvent for the vehicle in [incident_ts - 24h, incident_ts]
      if has_fault_code_in_window:
          lessee_deductible_cents = raw
      else:
          # threshold rule (strict > vs >=)
          if revised_estimate_cents > 0 and revision_round >= 1:
              lessee_deductible_cents = round_half_up(raw * (10000 - GOOD_TELEMATICS_DISCOUNT_BPS) / 10000)
          else:
              lessee_deductible_cents = raw
    input_set: |
      TelematicsEvent rows with vehicle_id == CollisionClaim.vehicle_id, ingest_status == ACCEPTED,
      and event_ts in (incident_ts - 24h, incident_ts] (left-exclusive, right-inclusive).
    constants:
      DEDUCTIBLE_CAP_CENTS: 250000     # $2,500
      GOOD_TELEMATICS_DISCOUNT_BPS: 2500   # 25%
    precision: integer cents; round_half_up on the discounted amount.

  - name: odometer_reconciliation
    trigger: POST /vehicles/{id}/telematics-events
    algorithm: chronological
    formula: |
      # When a TelematicsEvent is posted:
      if event.odometer_reading < Vehicle.odometer_current_miles:
          event.ingest_status = REJECTED_STALE
          # Do NOT advance Vehicle.odometer_current_miles
      else:
          event.ingest_status = ACCEPTED
          Vehicle.odometer_current_miles = event.odometer_reading
    input_set: All POSTed TelematicsEvent rows for the vehicle, in arrival order.
    constants: {}
    precision: integer miles.

  - name: monthly_card_spend
    trigger: POST /fuel-card-transactions and POST /fuel-card-transactions/{id}/reverse
    algorithm: aggregation
    formula: |
      # Recompute FuelCard.current_period_spend_cents on each posted/reversed txn
      now_month_start = first day of current calendar month at 00:00:00.000
      now_month_end   = last day of current calendar month at 23:59:59.999
      current_period_spend_cents = sum(t.amount_cents for t in FuelCardTransaction
                                       where t.fuel_card_id == card.id
                                         AND t.posted_at in [now_month_start, now_month_end]
                                         AND t.txn_status == POSTED)
    input_set: FuelCardTransaction in current calendar month with txn_status==POSTED.
    constants: {}
    precision: integer cents.

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: X-User-ID and X-User-Role headers present and non-empty.
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: X-User-Role is one of the declared roles in §1.7.
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: Role is authorized for the endpoint per §1.7 RBAC matrix.
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: For Lessee-acting endpoints, X-User-ID matches the LeaseAgreement.lessee_id of the target resource.
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to:
      - POST /overage-settlements/{id}/dispute

  - priority: 5
    category: existence
    check: All path-id resources exist (left-to-right path order).
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 6
    category: state
    check: Resource is in a state that admits the requested transition (per §1.2).
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: Optimistic concurrency — `version` field, when present in the request body, equals the resource's current version.
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: all PATCH endpoints

  - priority: 8
    category: business_safety
    check: |
      Vehicle activation: target Vehicle.vehicle_status == AVAILABLE and Vehicle.current_lease_id is null.
    error_id: ERR_VEHICLE_ALREADY_ALLOCATED
    http_status: 409
    applies_to:
      - POST /lease-agreements/{id}/activate

  - priority: 9
    category: business_safety
    check: |
      Collision-blocks-return: LeaseAgreement.collision_open_count == 0 when calling begin-return.
    error_id: ERR_OPEN_COLLISION_BLOCKS_RETURN
    http_status: 409
    applies_to:
      - POST /lease-agreements/{id}/begin-return

  - priority: 10
    category: business_referential
    check: |
      FuelCardTransaction post requires the parent FuelCard's lease to be in lease_state == ACTIVE
      and FuelCard.card_status == ACTIVE.
    error_id: ERR_CARD_INACTIVE
    http_status: 409
    applies_to:
      - POST /fuel-card-transactions

  - priority: 11
    category: business_temporal
    check: |
      FuelCardTransaction.posted_at must not fall within a CLOSED IFTAQuarter window for the lessee.
    error_id: ERR_QUARTER_CLOSED
    http_status: 409
    applies_to:
      - POST /fuel-card-transactions

  - priority: 12
    category: business_constraint
    check: |
      Revision round limit — CollisionClaim.revision_round must be < MAX_REVISION_ROUNDS at request-revision.
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to:
      - POST /collision-claims/{id}/request-revision

  - priority: 13
    category: business_fiscal
    check: |
      FuelCard monthly cap — current_period_spend_cents + amount_cents must NOT exceed monthly_limit_cents.
      Boundary: equal is allowed (<=); strictly greater is rejected.
    error_id: ERR_CARD_LIMIT_EXCEEDED
    http_status: 422
    applies_to:
      - POST /fuel-card-transactions

  - priority: 14
    category: business_fiscal
    check: |
      Dispute window — POST /overage-settlements/{id}/dispute must occur within DISPUTE_WINDOW_DAYS days
      of OverageSettlement.created_at (inclusive boundary: now() <= created_at + window).
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to:
      - POST /overage-settlements/{id}/dispute

  - priority: 15
    category: business_temporal
    check: |
      IFTA prepare cannot run before quarter end — now() >= quarter_end_date(year, quarter).
    error_id: ERR_QUARTER_NOT_READY
    http_status: 409
    applies_to:
      - POST /ifta-quarters/{id}/prepare

  - priority: 16
    category: business_constraint
    check: |
      OverageSettlement creation: a DRAFT row must not exist for the same lease+year+month.
      Boundary: zero existing rows allowed; one existing row blocks.
    error_id: ERR_DUPLICATE_SETTLEMENT_PERIOD
    http_status: 409
    applies_to:
      - POST /overage-settlements

  - priority: 17
    category: business_constraint
    check: |
      MaintenanceTicket close requires actual_cents > 0. Boundary: zero rejected.
    error_id: ERR_ACTUAL_COST_REQUIRED
    http_status: 422
    applies_to:
      - POST /maintenance-tickets/{id}/close

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Lessee ----------
  - method: POST
    path: /lessees
    description: Register a new lessee. Returns the new Lessee.
    roles: [FleetManager]
    code: 201
    input: [legal_name, dot_number, base_jurisdiction]
    output: Lessee
    side_effects: []

  - method: GET
    path: /lessees/{id}
    description: Retrieve a lessee.
    roles: [FleetManager, TaxAdmin, ClaimAdjuster, VendorOps, Lessee]
    code: 200
    input: []
    output: Lessee
    side_effects: []

  - method: POST
    path: /lessees/{id}/suspend
    description: Suspend the lessee; may cascade to DEFAULTED leases.
    roles: [FleetManager]
    code: 200
    input: []
    output: Lessee
    side_effects:
      - Lessee.account_status -> SUSPENDED
      - LeaseAgreements with this lessee in lease_state==ACTIVE and Lessee.outstanding_balance_cents >= DEFAULT_THRESHOLD_CENTS -> DEFAULTED
      - For each DEFAULTED lease, FuelCards under it -> BLOCKED

  - method: POST
    path: /lessees/{id}/reinstate
    description: Reinstate a suspended lessee whose balance dropped below SUSPEND_THRESHOLD_CENTS.
    roles: [FleetManager]
    code: 200
    input: []
    output: Lessee
    side_effects: []

  # ---------- Vehicle ----------
  - method: POST
    path: /vehicles
    description: Add a vehicle to the fleet (AVAILABLE).
    roles: [FleetManager]
    code: 201
    input: [vin, vehicle_class, model_year, odometer_baseline_miles]
    output: Vehicle
    side_effects: []

  - method: GET
    path: /vehicles/{id}
    description: Retrieve a vehicle.
    roles: [FleetManager, TaxAdmin, ClaimAdjuster, VendorOps]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: /vehicles/{id}/telematics-events
    description: Post a telematics event. Drives odometer reconciliation.
    roles: [FleetManager, VendorOps]
    code: 201
    input: [event_ts, odometer_reading, "harsh_event_count?", "fault_code?"]
    output: TelematicsEvent
    side_effects:
      - Run §1.3 odometer_reconciliation; Vehicle.odometer_current_miles may advance

  # ---------- LeaseAgreement ----------
  - method: POST
    path: /lease-agreements
    description: Draft a lease agreement (DRAFT).
    roles: [FleetManager]
    code: 201
    input: [lessee_id, vehicle_id, term_start_date, term_end_date, monthly_mileage_allowance, overage_rate_cents_per_mile, "tiered_overage_enabled?"]
    output: LeaseAgreement
    side_effects: []

  - method: GET
    path: /lease-agreements/{id}
    description: Retrieve a lease agreement, including computed compound state.
    roles: [FleetManager, TaxAdmin, ClaimAdjuster, VendorOps, Lessee]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: []

  - method: POST
    path: /lease-agreements/{id}/activate
    description: Allocate the lease's vehicle and move lease to ACTIVE.
    roles: [FleetManager]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects:
      - Vehicle.vehicle_status -> ALLOCATED
      - Vehicle.current_lease_id -> {id}
      - Vehicle.odometer_current_miles -> Vehicle.odometer_baseline_miles

  - method: POST
    path: /lease-agreements/{id}/begin-return
    description: Move the lease to IN_RETURN; bookkeeping for return phase.
    roles: [FleetManager]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects:
      - Generates a final-month DRAFT OverageSettlement record
      - Vehicle.vehicle_status -> IN_SHOP

  - method: POST
    path: /lease-agreements/{id}/finalize-return
    description: Close the lease (CLOSED) when all preconditions met.
    roles: [FleetManager]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects:
      - Vehicle.vehicle_status -> AVAILABLE
      - Vehicle.current_lease_id -> null
      - FuelCards under this lease -> CLOSED

  # ---------- FuelCard ----------
  - method: POST
    path: /lease-agreements/{lease_id}/fuel-cards
    description: Issue a fuel card under a lease (ACTIVE).
    roles: [FleetManager]
    code: 201
    input: [card_pan_last4, monthly_limit_cents]
    output: FuelCard
    side_effects: []

  - method: GET
    path: /fuel-cards/{id}
    description: Retrieve a fuel card with current_period_spend_cents.
    roles: [FleetManager, TaxAdmin, VendorOps, Lessee]
    code: 200
    input: []
    output: FuelCard
    side_effects: []

  # ---------- FuelCardTransaction ----------
  - method: POST
    path: /fuel-card-transactions
    description: Post a fuel transaction; updates current_period_spend_cents, may flag IFTA eligibility.
    roles: [FleetManager, VendorOps]
    code: 201
    input: [fuel_card_id, posted_at, jurisdiction, gallons, amount_cents]
    output: FuelCardTransaction
    side_effects:
      - Recompute FuelCard.current_period_spend_cents (§1.3 monthly_card_spend)
      - Compute ifta_eligible from the vehicle_class of the card's vehicle at posted_at

  - method: POST
    path: /fuel-card-transactions/{id}/reverse
    description: Reverse a posted transaction (REVERSED) — must precede any IFTA close in that window.
    roles: [FleetManager]
    code: 200
    input: []
    output: FuelCardTransaction
    side_effects:
      - Recompute FuelCard.current_period_spend_cents

  # ---------- MaintenanceTicket ----------
  - method: POST
    path: /vehicles/{vehicle_id}/maintenance-tickets
    description: Open a maintenance ticket on a vehicle.
    roles: [FleetManager, VendorOps]
    code: 201
    input: [ticket_kind, estimate_cents]
    output: MaintenanceTicket
    side_effects:
      - Stamps opened_at_odometer with Vehicle.odometer_current_miles

  - method: POST
    path: /maintenance-tickets/{id}/start
    description: Vendor starts the work (IN_SHOP). Vehicle becomes IN_SHOP.
    roles: [VendorOps]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects:
      - Vehicle.vehicle_status -> IN_SHOP

  - method: POST
    path: /maintenance-tickets/{id}/close
    description: Vendor closes the ticket (CLOSED) with actual_cents.
    roles: [VendorOps]
    code: 200
    input: [actual_cents]
    output: MaintenanceTicket
    side_effects:
      - Vehicle.vehicle_status restored

  - method: POST
    path: /maintenance-tickets/{id}/cancel
    description: Cancel a ticket while still OPEN.
    roles: [FleetManager]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: []

  # ---------- CollisionClaim ----------
  - method: POST
    path: /lease-agreements/{lease_id}/collision-claims
    description: File a collision claim (FILED).
    roles: [FleetManager, VendorOps]
    code: 201
    input: [incident_ts, estimate_cents]
    output: CollisionClaim
    side_effects:
      - LeaseAgreement.collision_open_count += 1

  - method: POST
    path: /collision-claims/{id}/start-review
    description: Move FILED -> UNDER_REVIEW.
    roles: [ClaimAdjuster]
    code: 200
    input: []
    output: CollisionClaim
    side_effects: []

  - method: POST
    path: /collision-claims/{id}/request-revision
    description: UNDER_REVIEW -> REVISION_REQUESTED; bump revision_round.
    roles: [ClaimAdjuster]
    code: 200
    input: []
    output: CollisionClaim
    side_effects:
      - CollisionClaim.revision_round += 1

  - method: PATCH
    path: /collision-claims/{id}
    description: Submit revised estimate. REVISION_REQUESTED -> UNDER_REVIEW.
    roles: [VendorOps]
    code: 200
    input: [revised_estimate_cents, version]
    output: CollisionClaim
    side_effects: []

  - method: POST
    path: /collision-claims/{id}/approve
    description: Approve a claim; compute lessee deductible.
    roles: [ClaimAdjuster]
    code: 200
    input: []
    output: CollisionClaim
    side_effects:
      - Compute lessee_deductible_cents via §1.3 collision_settlement
      - LeaseAgreement.collision_open_count -= 1
      - Lessee.outstanding_balance_cents += lessee_deductible_cents

  - method: POST
    path: /collision-claims/{id}/reject
    description: Reject a claim under review.
    roles: [ClaimAdjuster]
    code: 200
    input: []
    output: CollisionClaim
    side_effects:
      - LeaseAgreement.collision_open_count -= 1

  # ---------- OverageSettlement ----------
  - method: POST
    path: /overage-settlements
    description: Create a DRAFT overage settlement for a lease+year+month.
    roles: [FleetManager]
    code: 201
    input: [lease_agreement_id, period_year, period_month]
    output: OverageSettlement
    side_effects:
      - Compute provisional_overage_miles + provisional_balance_cents via §1.3 overage_settlement (provisional)

  - method: GET
    path: /overage-settlements/{id}
    description: Retrieve a settlement with both provisional and (if FINAL) final values.
    roles: [FleetManager, TaxAdmin, Lessee]
    code: 200
    input: []
    output: OverageSettlement
    side_effects: []

  - method: POST
    path: /overage-settlements/{id}/finalize
    description: Finalize (DRAFT -> FINAL), recompute via chronological variant.
    roles: [FleetManager]
    code: 200
    input: []
    output: OverageSettlement
    side_effects:
      - Recompute final_overage_miles + balance_cents (chronological)
      - LeaseAgreement.cumulative_overage_miles += final_overage_miles

  - method: POST
    path: /overage-settlements/{id}/mark-paid
    description: Mark as PAID; reduces lessee outstanding balance.
    roles: [FleetManager]
    code: 200
    input: []
    output: OverageSettlement
    side_effects:
      - Lessee.outstanding_balance_cents -= balance_cents

  - method: POST
    path: /overage-settlements/{id}/dispute
    description: Lessee disputes a FINAL settlement within DISPUTE_WINDOW_DAYS.
    roles: [Lessee]
    code: 200
    input: []
    output: OverageSettlement
    side_effects: []

  # ---------- IFTAQuarter ----------
  - method: POST
    path: /lessees/{lessee_id}/ifta-quarters
    description: Open an IFTA quarter (OPEN) for tracking purposes.
    roles: [TaxAdmin]
    code: 201
    input: [year, quarter]
    output: IFTAQuarter
    side_effects: []

  - method: GET
    path: /ifta-quarters/{id}
    description: Retrieve an IFTA quarter with computed totals.
    roles: [FleetManager, TaxAdmin]
    code: 200
    input: []
    output: IFTAQuarter
    side_effects: []

  - method: POST
    path: /ifta-quarters/{id}/prepare
    description: Recompute totals from eligible fuel transactions.
    roles: [TaxAdmin]
    code: 200
    input: []
    output: IFTAQuarter
    side_effects:
      - Recompute total_taxable_gallons + total_tax_cents via §1.3 ifta_tax

  - method: POST
    path: /ifta-quarters/{id}/file
    description: File the quarter (READY -> CLOSED); locks eligible txns.
    roles: [TaxAdmin]
    code: 200
    input: []
    output: IFTAQuarter
    side_effects:
      - Flip POSTED ifta_eligible txns in window to IFTA_INCLUDED (cascade depth ≥ 3 trigger)

  # ---------- Test-driving endpoints ----------
  - method: POST
    path: /_clock/advance
    description: Test-only — advance wall clock to ISO timestamp (idempotent if older). Required for time-gated checks (dispute window, quarter end).
    roles: [FleetManager, TaxAdmin]
    code: 200
    input: [to]
    output: null
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: Missing or unknown X-User-ID / X-User-Role header.

  - id: ERR_FORBIDDEN
    http: 403
    condition: Authenticated role lacks permission, or Lessee-owned resource accessed by another lessee.

  - id: ERR_NOT_FOUND
    http: 404
    condition: A path-id resource does not exist.

  - id: ERR_INVALID_STATE
    http: 409
    condition: Resource is not in a state that admits the requested transition.

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: Optimistic-concurrency `version` mismatch on PATCH.

  - id: ERR_VALIDATION
    http: 422
    condition: Generic input-shape failure (missing required field, type mismatch, out-of-range scalar).

  - id: ERR_VEHICLE_ALREADY_ALLOCATED
    http: 409
    condition: Activating a lease whose vehicle is not AVAILABLE (or current_lease_id non-null).

  - id: ERR_OPEN_COLLISION_BLOCKS_RETURN
    http: 409
    condition: begin-return called while LeaseAgreement.collision_open_count > 0.

  - id: ERR_CARD_INACTIVE
    http: 409
    condition: Posting on a card whose card_status != ACTIVE or whose lease is not ACTIVE.

  - id: ERR_QUARTER_CLOSED
    http: 409
    condition: Fuel txn posted into a calendar quarter whose IFTAQuarter for this lessee is CLOSED.

  - id: ERR_QUARTER_NOT_READY
    http: 409
    condition: prepare or file called before quarter_end_date(year, quarter).

  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: CollisionClaim.revision_round >= MAX_REVISION_ROUNDS at request-revision.

  - id: ERR_CARD_LIMIT_EXCEEDED
    http: 422
    condition: Adding the txn would push current_period_spend_cents above monthly_limit_cents (strictly >).

  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: dispute called after now() > OverageSettlement.created_at + DISPUTE_WINDOW_DAYS.

  - id: ERR_DUPLICATE_SETTLEMENT_PERIOD
    http: 409
    condition: An OverageSettlement already exists for the lease+year+month.

  - id: ERR_ACTUAL_COST_REQUIRED
    http: 422
    condition: maintenance-ticket close called with actual_cents == 0.

  - id: ERR_VEHICLE_NOT_RETURNABLE
    http: 409
    condition: finalize-return called while open MaintenanceTickets or unsettled overage rows remain.

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetManager
    description: Operator who allocates vehicles, manages lessees, and supervises returns.
    identity: opaque
    exclusive_operations:
      - POST /lessees
      - POST /lessees/{id}/suspend
      - POST /lessees/{id}/reinstate
      - POST /vehicles
      - POST /lease-agreements
      - POST /lease-agreements/{id}/activate
      - POST /lease-agreements/{id}/begin-return
      - POST /lease-agreements/{id}/finalize-return
      - POST /lease-agreements/{lease_id}/fuel-cards
      - POST /fuel-card-transactions/{id}/reverse
      - POST /maintenance-tickets/{id}/cancel
      - POST /overage-settlements
      - POST /overage-settlements/{id}/finalize
      - POST /overage-settlements/{id}/mark-paid
    shared_operations:
      - POST /vehicles/{id}/telematics-events
      - POST /fuel-card-transactions
      - POST /vehicles/{vehicle_id}/maintenance-tickets
      - POST /lease-agreements/{lease_id}/collision-claims
      - GET (all read endpoints)
      - POST /_clock/advance

  - name: TaxAdmin
    description: IFTA tax administrator; opens, prepares, and files quarters.
    identity: opaque
    exclusive_operations:
      - POST /lessees/{lessee_id}/ifta-quarters
      - POST /ifta-quarters/{id}/prepare
      - POST /ifta-quarters/{id}/file
    shared_operations:
      - GET (all read endpoints)
      - POST /_clock/advance

  - name: ClaimAdjuster
    description: Reviews and decides collision claims; cannot file or post telematics.
    identity: opaque
    exclusive_operations:
      - POST /collision-claims/{id}/start-review
      - POST /collision-claims/{id}/request-revision
      - POST /collision-claims/{id}/approve
      - POST /collision-claims/{id}/reject
    shared_operations:
      - GET (all read endpoints)

  - name: VendorOps
    description: Maintenance / repair vendor; opens / progresses tickets, posts telematics, submits revised estimates.
    identity: opaque
    exclusive_operations:
      - POST /maintenance-tickets/{id}/start
      - POST /maintenance-tickets/{id}/close
      - PATCH /collision-claims/{id}
    shared_operations:
      - POST /vehicles/{id}/telematics-events
      - POST /fuel-card-transactions
      - POST /vehicles/{vehicle_id}/maintenance-tickets
      - POST /lease-agreements/{lease_id}/collision-claims
      - GET (all read endpoints)

  - name: Lessee
    description: The leasing customer; can dispute settlements on their own lease and read their resources.
    identity: entity_backed:Lessee
    exclusive_operations:
      - POST /overage-settlements/{id}/dispute
    shared_operations:
      - GET (own lessee, own lease agreements, own settlements, own fuel cards)
