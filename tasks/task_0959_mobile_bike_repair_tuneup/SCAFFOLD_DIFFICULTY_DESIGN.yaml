# =============================================================================
# Task 959 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_totals
        grounds:
          - calculations.provisional_quote
          - calculations.final_invoice
          - entities.ServiceRequest.fields.quoted_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Same request context priced twice by two valid algorithms on the
          billing domain: provisional quote (no parts, no overage) yields 11391
          cents while the final invoice (actual parts, 15 overage minutes) yields
          16541 cents; both values pinned from the formulas.
        test_recipe:
          setup:
            - "Zone callout 2500; STANDARD tier 8900/75min/110c-min; FLEET customer with 10% subscription (included 5)"
            - "Mechanical bike; request window 2026-05-02 10:00-12:00; mechanic+van+route day; dispatched stop 10:00-11:30"
            - "Van stock: part A (1200c) x5, part B (735c) x5; consumed A x2, B x1; labor 90 min"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "STANDARD", base_price_cents: 8900, included_minutes: 75, overage_rate_cents_per_min: 110, labor_warranty_days: 60 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Fleet Co", email: "fleet@x.com", account_kind: "FLEET" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { customer_id: "${cust_id}", included_tunes_per_period: 5, discount_pct: 0.10, period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z" }, as: Dispatcher, captures: { sub_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", subscription_id: "${sub_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id, quoted_at_create: $.data.quoted_total_cents } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "A1", name: "Chain", unit_price_cents: 1200, warranty_days: 90 }, as: PlatformAdmin, captures: { part_a: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "B1", name: "Cable", unit_price_cents: 735, warranty_days: 30 }, as: PlatformAdmin, captures: { part_b: $.data.id } }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part_a}", quantity: 5, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part_b}", quantity: 5, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:30:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 2, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 2, action: "CONSUME" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_b}", quantity: 1, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_b}", quantity: 1, action: "CONSUME" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "COMPLETE", labor_minutes: 90 }, as: Mechanic, as_user_id: "${mech_id}" }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/invoices", payload: {}, as: Dispatcher, captures: { inv_total: $.data.total_cents, inv_subtotal: $.data.subtotal_cents, inv_discount: $.data.discount_cents, inv_tax: $.data.tax_cents, inv_surcharge: $.data.surcharge_cents } }
          assert:
            - "ServiceRequest.${req_id}.quoted_total_cents == 11391 (provisional: 2500 + (8900-890) = 10510; +500 surcharge; +881 tax)"
            - "Invoice.total_cents == 16541 (labor 10550-1055=9495; parts 2400-240 + 735-74 = 2821; subtotal 14816; surcharge 500; tax 1225)"
            - "Invoice.discount_cents == 1429 (labor 1055 + part A 240 + part B 74)"
            - "Invoice.total_cents != ServiceRequest.${req_id}.quoted_total_cents"

      - name: subscription_allowance_reserved_vs_settled_views
        grounds:
          - calculations.subscription_allowance
          - entities.Subscription.fields.allowance_remaining
          - entities.Subscription.fields.settled_allowance_remaining
        distinguishing_aspect: |
          Allowance on the Subscription domain has two valid readings: the
          forward-looking reserved view and the chronological settled view
          diverge while a covered request is open (2 vs 4, then 2 vs 3 after one
          completion) — a different entity domain from invoice pricing.
        test_recipe:
          setup:
            - "FLEET customer; subscription included_tunes_per_period=4, discount 0.10, period May 2026"
            - "Two covered STANDARD requests open; first then completed via full dispatch chain"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Fleet Co", email: "fleet@x.com", account_kind: "FLEET" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { customer_id: "${cust_id}", included_tunes_per_period: 4, discount_pct: 0.10, period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z" }, as: Dispatcher, captures: { sub_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike1: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike2: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike1}", zone_id: "${zone_id}", tier_id: "${tier_id}", subscription_id: "${sub_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req1: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike2}", zone_id: "${zone_id}", tier_id: "${tier_id}", subscription_id: "${sub_id}", window_start: "2026-05-02T13:00:00Z", window_end: "2026-05-02T15:00:00Z" }, as: Dispatcher, captures: { req2: $.data.id } }
            - { call: "GET /v1/subscriptions/${sub_id}", as: Dispatcher, captures: { rem_mid: $.data.allowance_remaining, settled_mid: $.data.settled_allowance_remaining, res_mid: $.data.allowance_reserved } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req1}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /v1/route-stops/${stop1}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req1}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req1}/events", payload: { event_type: "COMPLETE", labor_minutes: 40 }, as: Mechanic, as_user_id: "${mech_id}" }
          trigger:
            - { call: "GET /v1/subscriptions/${sub_id}", as: Dispatcher, captures: { rem_end: $.data.allowance_remaining, settled_end: $.data.settled_allowance_remaining, res_end: $.data.allowance_reserved, con_end: $.data.allowance_consumed } }
          assert:
            - "Mid-flight: allowance_reserved == 2, allowance_remaining == 2, settled_allowance_remaining == 4 (divergent while requests open)"
            - "After completing req1: allowance_reserved == 1, allowance_consumed == 1, allowance_remaining == 2, settled_allowance_remaining == 3"
            - "The two variants disagree (2 != 3) for identical underlying data"

  - rule_id: combinatorial_formula
    instances:
      - name: final_invoice_overage_tiers_surcharge
        grounds:
          - calculations.final_invoice
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — max(0, minutes -
          included) overage gate, tier rate selection, and surcharge bracket all
          feed one total; pinned inputs yield total 18020 (no subscription).
        test_recipe:
          setup:
            - "Zone callout 2500; STANDARD tier 8900/75/110; INDIVIDUAL customer, mechanical bike"
            - "Labor 90 min (15 overage); parts A x2 @1200, B x1 @735 consumed; no subscription"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "STANDARD", base_price_cents: 8900, included_minutes: 75, overage_rate_cents_per_min: 110, labor_warranty_days: 60 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "A1", name: "Chain", unit_price_cents: 1200, warranty_days: 90 }, as: PlatformAdmin, captures: { part_a: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "B1", name: "Cable", unit_price_cents: 735, warranty_days: 30 }, as: PlatformAdmin, captures: { part_b: $.data.id } }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part_a}", quantity: 5, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part_b}", quantity: 5, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:30:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 2, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 2, action: "CONSUME" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_b}", quantity: 1, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_b}", quantity: 1, action: "CONSUME" }, as: Mechanic, as_user_id: "${mech_id}" }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "COMPLETE", labor_minutes: 90 }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/invoices", payload: {}, as: Dispatcher, captures: { inv_total: $.data.total_cents } }
          assert:
            - "Invoice.labor_cents == 10550 (8900 + max(0, 90-75) * 110)"
            - "Invoice.parts_gross_cents == 3135 (2*1200 + 1*735)"
            - "Invoice.subtotal_cents == 16185; Invoice.surcharge_cents == 500; Invoice.tax_cents == 1335 (round_half_up(16685 * 0.08))"
            - "Invoice.total_cents == 18020"

      - name: per_line_discount_rounding_order
        grounds:
          - calculations.parts_line_discounts
          - entities.Invoice.fields.discount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — two 333-cent part lines at 10% must be
          rounded per line (33 + 33 = 66), NOT summed then rounded (would give 67);
          the invoice-level discount_cents 556 pins the per-line-then-sum order.
        test_recipe:
          setup:
            - "Zone callout 2500; BASIC tier 4900/45; FLEET customer, subscription 10% (included 3)"
            - "Two distinct parts P1/P2 @333 cents each, qty 1 each consumed; labor 40 min (no overage)"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Fleet Co", email: "fleet@x.com", account_kind: "FLEET" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { customer_id: "${cust_id}", included_tunes_per_period: 3, discount_pct: 0.10, period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z" }, as: Dispatcher, captures: { sub_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", subscription_id: "${sub_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "P1", name: "Bolt", unit_price_cents: 333, warranty_days: 30 }, as: PlatformAdmin, captures: { part1: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "P2", name: "Nut", unit_price_cents: 333, warranty_days: 30 }, as: PlatformAdmin, captures: { part2: $.data.id } }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part1}", quantity: 2, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part2}", quantity: 2, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part1}", quantity: 1, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part1}", quantity: 1, action: "CONSUME" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part2}", quantity: 1, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part2}", quantity: 1, action: "CONSUME" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "COMPLETE", labor_minutes: 40 }, as: Mechanic, as_user_id: "${mech_id}" }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/invoices", payload: {}, as: Dispatcher, captures: { inv_total: $.data.total_cents, inv_disc: $.data.discount_cents } }
          assert:
            - "Invoice.discount_cents == 556 (labor round(490.0)=490 + 33 + 33; sum-then-round over 5566 would give 557)"
            - "Invoice.subtotal_cents == 7510 (2500 + 4410 + 600)"
            - "Invoice.surcharge_cents == 0; Invoice.tax_cents == 601; Invoice.total_cents == 8111"

      - name: surcharge_bracket_evaluation_order
        grounds:
          - calculations.route_surcharge
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — surcharge is part of the total
          but its bracket is keyed on the PRE-surcharge subtotal; subtotal 19500
          yields surcharge 500 (total 20000 would cross into the 1200 bracket if
          keyed post-surcharge), pinning evaluation order.
        test_recipe:
          setup:
            - "Zone callout 2500; PREMIUM tier 14900/120; INDIVIDUAL customer; part @2100 qty1; labor 100 min (within included)"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "PREMIUM", base_price_cents: 14900, included_minutes: 120, overage_rate_cents_per_min: 100, labor_warranty_days: 90 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T13:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "X1", name: "Cassette", unit_price_cents: 2100, warranty_days: 60 }, as: PlatformAdmin, captures: { part1: $.data.id } }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part1}", quantity: 2, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
