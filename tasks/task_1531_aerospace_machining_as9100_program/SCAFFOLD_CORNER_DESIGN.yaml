          trigger:
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { lta_v3: $.data.version, rem: $.data.remaining_ceiling_cents } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-C3", part_number: "P127", part_revision: "A", quantity: 100, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v3}" }, as: ContractsManager, captures: { err: $.data.error_id } }
          assert:
            - "remaining_ceiling_cents == 100000 after two POs (1000000 - 2 x 450000)"
            - "Third PO rejected: error_id == ERR_LTA_CEILING_EXCEEDED, http_status == 402"

