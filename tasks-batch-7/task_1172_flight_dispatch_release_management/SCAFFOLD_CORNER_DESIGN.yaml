            - { call: "POST /dispatch/legs", payload: { flight_no: "FD430", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 0, bags_count: 0, cargo_kg: 8070 }, as: Dispatcher, as_user_id: "${d1}", captures: { man1: $.data.id, man1_cg: $.data.cg_percent_mac } }
            - { call: "POST /dispatch/mel-items", payload: { aircraft_id: "${ac1}", item_code: "CDL-9", category: "CDL", deferral_category: "C", repair_deadline_utc: "2026-05-10T00:00:00Z" }, as: DispatchSupervisor, captures: { cdl1: $.data.id } }
          trigger:
            - { call: "PUT /dispatch/manifests/${man1}", payload: { cargo_kg: 8070 }, as: Dispatcher, as_user_id: "${d1}", captures: { cg_err: $.data.error_id } }
          assert:
            - "man1_cg == 30.50 — accepted under the normal envelope [20.0, 31.0]"
            - "cg_err == ERR_CG_OUT_OF_ENVELOPE — with an OPEN CDL item the envelope narrows to [22.0, 30.0] and 30.50 > 30.0"

      - name: contingency_floor_on_short_leg
        claim_type: correct_result
        grounds: [calculations.required_fuel]
        excluded_because:
          difficulty_instance: combinatorial_formula / manifest_component_rounding_order_mode_b
          rationale: "That instance's 200nm leg asserts contingency_kg == 100 (the MIN_CONTINGENCY_KG floor branch) and required_fuel_kg == 3149."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected 401 before anything else is evaluated."
        test_recipe:
          setup: ["One station exists"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
          trigger:
            - { call: "GET /dispatch/stations/${sta}", captures: { auth_err: $.data.error_id } }
          assert:
            - "auth_err == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: auth_priority_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "A request that is both unauthenticated AND targets a missing resource returns 401, proving auth runs before existence."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /dispatch/legs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { prio_err: $.data.error_id } }
          assert:
            - "prio_err == ERR_UNAUTHENTICATED (not ERR_NOT_FOUND)"

      - name: captain_not_qualified_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_CAPTAIN_NOT_QUALIFIED]"]
        distinguishing_aspect: "Captain qualified only on B737 cannot be assigned to an A320 leg."
        test_recipe:
          setup: ["Stations, AC1 (type A320), D1, C2 qualified [B737]"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
