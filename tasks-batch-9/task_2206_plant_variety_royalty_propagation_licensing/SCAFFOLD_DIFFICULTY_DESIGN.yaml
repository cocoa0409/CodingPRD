              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Hollow Creek Farms", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver: $.data.version }
          trigger:
            - call: "POST /royalty-reports/${r_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
          assert:
            - "GET /royalty-line-items?report_id=${r_id} returns an empty list before the trigger"
            - "The trigger returns 422 with data.error_id == ERR_REPORT_HAS_NO_LINES"
            - "RoyaltyReport.${r_id}.review_status is still DRAFT, submitted_at is null, provisional_total_cents == 0 and version is unchanged"
            - "After POST /royalty-reports/${r_id}/line-items with quota_id ${q_id}, reported_units 1 and a freshly read expected_report_version, the identical submit succeeds with review_status == SUBMITTED"
            - "On that success RoyaltyLineItem.provisional_amount_cents == 35 and RoyaltyReport.${r_id}.provisional_total_cents == 35 (TIER_B, DOMESTIC, band 1.00, no performance premium)"

  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_submission_requires_governing_agreement_active
        grounds:
          - validations[priority=11]
          - state_machines.RoyaltyReport.review_status.DRAFT_to_SUBMITTED
          - state_machines.PropagatorAgreement.status.ACTIVE_to_SUSPENDED
          - state_machines.PropagatorAgreement.status.SUSPENDED_to_ACTIVE
          - errors.ERR_AGREEMENT_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair RoyaltyReport -> PropagatorAgreement. The report itself is
          in a perfectly valid DRAFT state with a valid line item; what blocks
          the transition is the state of a DIFFERENT entity two hops up
          (report.agreement_id). Reinstating that other entity - without
          touching the report at all - unblocks the identical call.
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE TIER_B PropagatorAgreement for US-WA, one ACTIVE ProductionQuota with allocated_units 20000."
            - "One DRAFT RoyaltyReport carrying one line item with reported_units 500."
            - "The agreement is then suspended manually, which also freezes the quota but leaves the report and its line item untouched."
            - "The propagator has no penalty events, so compliance_score is 100 and material_audit_finding_count is 0 - reinstatement is available."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Lantern Quince", species: "Cydonia oblonga", breeder_code: "LQ", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
