            - "Case.${case_id}.status == 'ON_APPEAL'"
            - "Appeal.${ap_id}.status == 'NOTICE_FILED'"

      - name: cascade_depth3_service_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ServiceOfProcess.ATTEMPTED_to_COMPLETED
        excluded_because:
          difficulty_instance: transitive_cascade / service_complete_depth3_party_deadline_posture
          rationale: "The depth-3 service cascade is exercised by the named §1.8 instance."

