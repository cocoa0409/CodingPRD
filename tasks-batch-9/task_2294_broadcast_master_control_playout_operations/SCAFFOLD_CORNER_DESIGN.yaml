            - "${e_reactivate} == ERR_OVERRIDE_INVALID_STATE with status 409 — ACTIVE_CRAWL -> ACTIVE_CRAWL is not a declared edge, and activated_utc keeps its first value"
            - "${e_refile} == ERR_NOTIFICATION_INVALID_STATE with status 409 — a FILED notification cannot be re-filed, filed_reference is unchanged and Transmitter.${tx1_id}.notification_pending_count stays 0"
            - "${e_clock_equal} == ERR_CLOCK_NOT_MONOTONIC with status 409 — the clock must move strictly forward, so an equal value is refused"
