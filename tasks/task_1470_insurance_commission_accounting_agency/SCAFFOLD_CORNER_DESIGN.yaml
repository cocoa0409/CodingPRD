          assert:
            - "P-TA entry status == MATCHED (|1200100 - 1200000| == 100 <= tolerance)"
            - "P-TB entry status == VARIANCE (101 > 100)"

      - name: cancel_month_zero_full_chargeback
        claim_type: correct_result
        grounds: ["calculations.chargeback_unearned_commission"]
        distinguishing_aspect: "Whole-month floor: cancel effective 2026-08-15 vs effective_date 2026-08-01 earns 0 whole months (partial month discarded), so the chargeback equals the full 1200000 entry and the EARNED_ADJUSTMENT is 0."
