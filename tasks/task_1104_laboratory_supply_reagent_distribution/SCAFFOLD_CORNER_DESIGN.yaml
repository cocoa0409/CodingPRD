            - { call: "GET /lab/order-lines", payload: { order_id: "${order_id}" }, as: OpsAdmin, captures: { line_st: "$.data[0].status", line_alloc: "$.data[0].allocated_quantity" } }
          assert:
            - "captured st == DRAFT and captured total is null"
            - "captured line_st == PENDING and line_alloc == 0"

      - name: kit_assembly_execute_consumes_components_fefo
        claim_type: side_effect_execution
        grounds: [state_machines.KitAssemblyJob.PLANNED_to_COMPLETED, calculations.fefo_allocation_selection]
        distinguishing_aspect: "Executing a job for 2 kits of a 3x-A kit consumes exactly 6 units of product A from the earliest-expiry lot, records consumption_summary, and flips kits_built to 2."
        test_recipe:
          setup:
            - "warehouse + AMBIENT zone; product A (10000) with lot L1 qty 10 (manufacture 2026-01-15) and lot L2 qty 10 (manufacture 2026-02-15)"
            - "kit with components [{A, 3}] ACTIVATED; job for quantity_to_build 2 PLANNED"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "KA-01", name: "Kit Part A", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 10000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_a: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Delta", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_a}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot1_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_a}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-02-15" }, as: InventoryClerk, captures: { lot2_id: "$.data.id" } }
            - { call: "POST /lab/kits", payload: { customer_id: "${cust_id}", name: "Triple-A Kit", components: [ { product_id: "${prod_a}", quantity_per_kit: 3 } ] }, as: CatalogManager, captures: { kit_id: "$.data.id" } }
            - { call: "POST /lab/kits/${kit_id}/activate", payload: {}, as: CatalogManager }
            - { call: "POST /lab/kit-assembly-jobs", payload: { kit_id: "${kit_id}", warehouse_id: "${wh_id}", quantity_to_build: 2 }, as: InventoryClerk, captures: { job_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/kit-assembly-jobs/${job_id}/execute", payload: {}, as: InventoryClerk, captures: { built: "$.data.kits_built", st: "$.data.status" } }
          assert:
            - "captured built == 2 and st == COMPLETED"
            - "ReagentLot.${lot1_id}.quantity_on_hand == 4 and quantity_consumed == 6 (earliest-expiry lot consumed first)"
            - "ReagentLot.${lot2_id}.quantity_on_hand == 10 (untouched)"
            - "KitAssemblyJob.${job_id}.consumption_summary records 6 units of product ${prod_a} against lot ${lot1_id}"

  - section: calculations
    instances:
      - name: fefo_prefers_earliest_expiry_lot
        claim_type: correct_result
        grounds: [calculations.fefo_allocation_selection, entities.StorageZone.fields.rotation_policy]
        distinguishing_aspect: "Under FEFO the reservation lands on the lot with the earliest expiry_date (2026-05-31) even though that lot was received SECOND."
        test_recipe:
          setup:
            - "FEFO zone; lot L1 received first with manufacture 2026-03-01 (expiry 2026-06-29); lot L2 received second with manufacture 2026-04-01 (expiry 2026-05-31); both qty 10"
            - "order qty 3 ANY submitted"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
