      - name: to_member_buffer_60min_gap
        grounds:
          - validations[priority=8]
          - errors[ERR_MEMBER_SCHEDULE_CONFLICT]
          - entities.Reservation.fields.start_time
        distinguishing_aspect: "On the Member resource, a new reservation whose gap to the member's existing reservation is 30 minutes (< MEMBER_TURNAROUND_MIN=60) is rejected, while a 90-minute gap is accepted — a buffer/gap interval semantics where adjacency is NOT allowed, distinct from the boat's half-open adjacency-allowed rule."
