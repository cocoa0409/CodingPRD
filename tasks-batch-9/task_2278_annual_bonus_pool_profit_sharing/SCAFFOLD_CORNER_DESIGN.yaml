        distinguishing_aspect: |
          Setup writes are allowed in DRAFT and TARGETS_SET only, so the window
          closes the moment the plan is submitted for certification — not when it is
          certified. Adding a participant would silently invalidate the awards the
          committee is about to certify, and adding a metric would break the 100.00
          weight sum; both are 409s and neither row is created.
