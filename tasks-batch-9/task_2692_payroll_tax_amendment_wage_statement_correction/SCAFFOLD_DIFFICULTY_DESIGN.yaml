            - "A first amended return prepared with accrual_through_date 2025-04-30 (days_late 365), signed by u_off_bree, submitted on 2026-05-01 and then REJECTED by the agency, so the case may be re-amended and the 45-day buffer runs from 2026-05-01."
            - "The same return is walked AGENCY_REJECTED -> DRAFT -> PREPARED and re-signed, so it sits in SIGNED awaiting the second submission."
