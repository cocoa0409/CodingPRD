            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "INSTALLATION", description: "t", estimated_hours: 2.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
