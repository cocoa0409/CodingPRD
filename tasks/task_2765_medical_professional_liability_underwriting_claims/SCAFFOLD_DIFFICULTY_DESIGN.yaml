          Both DDR gates are inclusive at 5: years_in_practice 4 with step_year 5 and
          years_in_practice 5 with step_year 4 are each rejected with ERR_DDR_NOT_ELIGIBLE (422),
          while years_in_practice 5 with step_year 5 quotes a free tail at tail_factor 0.00 off a
          mature_premium_basis of 24800.00.
