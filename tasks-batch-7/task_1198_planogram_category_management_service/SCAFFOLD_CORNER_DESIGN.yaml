# =============================================================================
# §1.9 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerates testable claims from §1.1–§1.7 not covered by §1.8.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_retailer_with_defaults
        claim_type: creation
        grounds: [entities.Retailer]
        distinguishing_aspect: "POST /retailers with only required field returns 201 + system defaults applied (status=ACTIVE, compliance_threshold_pct=85)"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id, status: $.data.status, thr: $.data.compliance_threshold_pct }
          assert:
            - "status == ACTIVE"
            - "thr == 85"
            - "data.version == 1"

      - name: get_retailer_returns_stored
        claim_type: retrieval
        grounds: [entities.Retailer, 'endpoints.GET /retailers/{rid}']
        distinguishing_aspect: "GET /retailers/{rid} returns the stored retailer with matching id, name, version"
        test_recipe:
          setup: ["Retailer R exists"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /retailers/${rid}"
              payload: {}
              as: PlatformAdmin
              captures: { got_name: $.data.name, got_id: $.data.id }
          assert:
            - "got_id == ${rid}"
            - "got_name == Acme"

      - name: get_nonexistent_retailer_returns_404
        claim_type: not_found
        grounds: [entities.Retailer, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET with a non-existent UUID returns 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /retailers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: category_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Category, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /retailers/{rid}/categories missing required `code` returns 400 ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["Retailer R"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/categories"
              payload: { role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 5 }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: product_invalid_role_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Category, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /categories with role='INVALID' (not in enum) returns 400"
        test_recipe:
          setup: ["Retailer R"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "X", role: "NOT_A_ROLE", annual_sales_cents: 100, total_linear_feet: 5 }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: supplier_default_is_captain_false
        claim_type: defaults
        grounds: [entities.Supplier]
        distinguishing_aspect: "Supplier created without is_captain field defaults is_captain to false"
        test_recipe:
          setup: ["Retailer R"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { cap: $.data.is_captain }
          assert:
            - "cap == false"

      - name: planogram_id_system_generated_input_ignored
        claim_type: system_fields
        grounds: [entities.Planogram]
        distinguishing_aspect: "Client-supplied id field in POST planogram is ignored; server-minted id returned"
        test_recipe:
          setup: ["Category C"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 5 }
              as: CategoryManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE", id: "client-supplied-fake-id" }
              as: CategoryManager
              captures: { pid: $.data.id }
          assert:
            - "pid != client-supplied-fake-id (server mints the id)"

      - name: planogram_line_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.PlanogramLine]
        distinguishing_aspect: "Client-supplied days_of_supply or dos_flag in POST line payload is ignored; server computes from capacity and demand"
        test_recipe:
          setup: ["Category C; planogram PG in DRAFT; product P LISTED with weekly_demand_units=70"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 70 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 3, capacity_units: 30, days_of_supply: 9999.0, dos_flag: "OVERSTOCK" }
              as: CategoryManager
              captures: { dos: $.data.days_of_supply, flag: $.data.dos_flag }
          assert:
            - "dos == 3.0 (server-computed, client-sentinel 9999 ignored)"
            - "flag == OK (server-computed, client-sentinel OVERSTOCK ignored)"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: planogram_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.Planogram]
        distinguishing_aspect: "A newly created planogram starts in DRAFT"
        test_recipe:
          setup: ["Category C"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { st: $.data.status }
          assert:
            - "st == DRAFT"

      - name: planogram_activate_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Planogram, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Cannot activate directly from DRAFT (must go through IN_REVIEW and APPROVED)"
        test_recipe:
          setup: ["Planogram PG in DRAFT"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}"
              payload: {}
              as: CategoryManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/activate"
              payload: { expected_category_version: "${cv}" }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: planogram_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Planogram, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "REJECTED is terminal — cannot transition to APPROVED or back to DRAFT"
        test_recipe:
          setup: ["Planogram PG in REJECTED"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/reject"
              payload: {}
              as: CategoryManager
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: audit_score_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AuditEvent]
        distinguishing_aspect: "SCORED audit cannot be re-scored; REJECTED audit cannot be scored"
        test_recipe:
          setup: ["Audit A in SCORED"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST", cluster: "BASE" }
              as: RetailerAdmin
              captures: { stid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}"
              payload: {}
              as: CategoryManager
              captures: { cv: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/activate"
              payload: { expected_category_version: "${cv}" }
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores/${stid}/audits"
              payload: { planogram_id: "${pgid}", photo_url: "https://x/y.jpg" }
              as: FieldAuditor
              captures: { aid: $.data.id }
            - call: "POST /retailers/${rid}/stores/${stid}/audits/${aid}/score"
              payload: { matched_facings: 4 }
              as: AuditReviewer
          trigger:
            - call: "POST /retailers/${rid}/stores/${stid}/audits/${aid}/score"
              payload: { matched_facings: 5 }
              as: AuditReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: product_delisted_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Product]
        distinguishing_aspect: "DELISTED product cannot be re-discontinued or cut-in directly; only relist to CANDIDATE is allowed"
        test_recipe:
          setup: ["Product P is DELISTED (clock past effective_date)"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { pid: $.data.id }
            - call: "POST /retailers/${rid}/products/${pid}/list"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/products/${pid}"
              payload: {}
              as: CategoryManager
              captures: { pv: $.data.version }
            - call: "POST /retailers/${rid}/products/${pid}/discontinue"
              payload: { discontinuation_effective_date: "2026-06-01T00:00:00Z", expected_product_version: "${pv}" }
              as: CategoryManager
            - call: "POST /retailers/${rid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /retailers/${rid}/products/${pid}"
              payload: {}
              as: CategoryManager
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/products/${pid}/discontinue"
              payload: { discontinuation_effective_date: "2026-07-01T00:00:00Z", expected_product_version: "${pv2}" }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: funding_deal_active_via_clock
        claim_type: valid_transition
        grounds: [state_machines.FundingDeal]
        distinguishing_aspect: "APPROVED funding deal transitions to ACTIVE when clock reaches starts_at"
        test_recipe:
          setup: ["Funding deal APPROVED with starts_at = 2026-06-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/funding-deals"
              payload: { category_id: "${cid}", supplier_id: "${sid}", amount_cents: 5000, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z" }
              as: RetailerAdmin
              captures: { fdid: $.data.id, fdv: $.data.version }
            - call: "POST /retailers/${rid}/funding-deals/${fdid}/approve"
              payload: { expected_funding_deal_version: "${fdv}" }
              as: RetailerAdmin
          trigger:
            - call: "POST /retailers/${rid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /retailers/${rid}/funding-deals/${fdid}"
              payload: {}
              as: RetailerAdmin
              captures: { st: $.data.status }
          assert:
            - "st == ACTIVE"

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: dos_zero_demand_sentinel
        claim_type: correct_result
        grounds: [calculations.days_of_supply]
        distinguishing_aspect: "Product with weekly_demand_units=0 yields dos=9999.0 sentinel and dos_flag=OVERSTOCK"
        test_recipe:
          setup: ["Product P with weekly_demand_units=0 LISTED"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 0 }
              as: CategoryManager
              captures: { pid: $.data.id }
            - call: "POST /retailers/${rid}/products/${pid}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${pid}", position_index: 1, facings: 2, capacity_units: 10 }
              as: CategoryManager
              captures: { dos: $.data.days_of_supply, flag: $.data.dos_flag }
          assert:
            - "dos == 9999.0 (sentinel for zero demand)"
            - "flag == OVERSTOCK"

      - name: shelf_utilization_computed_correctly
        claim_type: correct_result
        grounds: [calculations.shelf_utilization]
        distinguishing_aspect: "shelf_utilization_pct = sum(facings * width_in) / (linear_feet * 12) * 100 rounded half-up to 1 decimal"
        test_recipe:
          setup:
            - "Category with total_linear_feet=10 → 120 inches"
            - "P1 width_in=6 LISTED; P2 width_in=12 LISTED"
            - "PG line1: P1 facings=5 (used 30 in); line2: P2 facings=5 (used 60 in) → total 90 in → 90/120 * 100 = 75.0"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P2", width_in: 12, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { p2: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/products/${p2}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p2}", position_index: 2, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}/planograms/${pgid}"
              payload: {}
              as: CategoryManager
              captures: { util: $.data.shelf_utilization_pct }
          assert:
            - "util == 75.0"

      - name: compliance_score_zero_facings
        claim_type: correct_result
