scaffold_corner_design:

  - section: entities
    instances:
      - name: community_create_returns_201_with_system_defaults_applied
        claim_type: Creation
        grounds: ["entities.Community.fields.status", "entities.Community.fields.fee_balance_cents", "entities.Community.fields.avg_satisfaction_score"]
        distinguishing_aspect: "POST /communities with the six required fields returns 201 and the row carries status ACTIVE, fee_balance_cents 0, satisfaction_survey_count 0, avg_satisfaction_score 0 and version 1 without the client supplying any of them."
        test_recipe:
          setup: ["Empty database; logical clock untouched, so it reads the 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "GET /communities"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 2, quality_rating: 4.0 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Community.${c1_id}.status == ACTIVE"
            - "Community.${c1_id}.fee_balance_cents == 0"
            - "Community.${c1_id}.satisfaction_survey_count == 0"
            - "Community.${c1_id}.avg_satisfaction_score == 0"
            - "Community.${c1_id}.version == 1"
            - "Community.${c1_id}.id matches the dashed UUID form 8-4-4-4-12 with no type prefix"
            - "response envelope has meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: unknown_ids_return_entity_specific_not_found_codes
        claim_type: Not Found
        grounds: ["errors[ERR_COMMUNITY_NOT_FOUND]", "errors[ERR_INQUIRY_NOT_FOUND]", "errors[ERR_TOUR_NOT_FOUND]", "errors[ERR_SURVEY_NOT_FOUND]", "errors[ERR_LEDGER_ENTRY_NOT_FOUND]", "errors[ERR_ASSIGNMENT_NOT_FOUND]", "errors[ERR_GUIDANCE_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]", "errors[ERR_PLACEMENT_NOT_FOUND]", "errors[ERR_MATCH_NOT_FOUND]", "errors[ERR_ASSESSMENT_NOT_FOUND]", "errors[ERR_INVENTORY_NOT_FOUND]", "errors[ERR_ADVISOR_NOT_FOUND]", "errors[ERR_FAMILY_NOT_FOUND]"]
        distinguishing_aspect: "Each single-resource GET answers with its OWN 404 code rather than a shared generic not-found, so a client can tell which of the fourteen resource types was missing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "GET /communities"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /communities/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /inquiries/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /tours/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /surveys/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /ledger-entries/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlatformAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /caseload-assignments/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlatformAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /benefit-guidances/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: PlatformAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /referral-invoices/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PlatformAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /placements/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PlatformAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /matches/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PlatformAdmin
              captures: { e10: $.data.error_id }
            - call: "GET /assessments/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: PlatformAdmin
              captures: { e11: $.data.error_id }
            - call: "GET /inventories/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: PlatformAdmin
              captures: { e12: $.data.error_id }
            - call: "GET /advisors/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: PlatformAdmin
              captures: { e13: $.data.error_id }
            - call: "GET /families/00000000-0000-4000-8000-00000000000e"
              payload: {}
              as: PlatformAdmin
              captures: { e14: $.data.error_id }
          assert:
            - "every call returns HTTP status == 404"
            - "the fourteen data.error_id values are, in call order: ERR_COMMUNITY_NOT_FOUND, ERR_INQUIRY_NOT_FOUND, ERR_TOUR_NOT_FOUND, ERR_SURVEY_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_GUIDANCE_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_MATCH_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_INVENTORY_NOT_FOUND, ERR_ADVISOR_NOT_FOUND, ERR_FAMILY_NOT_FOUND"
            - "each error body has response_type == error and a non-empty data.message"

      - name: advisors_list_returns_pagination_envelope_with_limit_and_offset
        claim_type: Listing
        grounds: ["endpoints[GET /advisors]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three advisors stored, GET /advisors?limit=2&offset=0 returns 2 rows, total_count 3 and has_more true; offset=2 returns 1 row and has_more false."
        test_recipe:
          setup: ["Three advisors exist: Ann (TX-AUS), Ben (TX-AUS), Cara (TX-DAL)."]
          setup_api_calls:
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /advisors"
              payload: { full_name: "Ben Cho", email: "ben@apfm.test", region_code: "TX-AUS", is_va_certified: true, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /advisors"
              payload: { full_name: "Cara Diaz", email: "cara@apfm.test", region_code: "TX-DAL", is_va_certified: false, caseload_capacity: 5 }
              as: PlatformAdmin
              captures: { a3_id: $.data.id }
          trigger:
            - call: "GET /advisors"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /advisors"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /advisors"
              payload: { region_code: "TX-DAL" }
              as: PlatformAdmin
          assert:
            - "first call: response_type == array, 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: 1 row returned, total_count == 3, has_more == false"
            - "third call: 1 row returned whose id is ${a3_id} and region_code is TX-DAL, total_count == 1"

      - name: inquiry_create_missing_required_declared_budget_returns_validation
        claim_type: Required Fields
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]", "entities.Inquiry.fields.declared_budget_monthly_cents"]
        distinguishing_aspect: "declared_budget_monthly_cents has source input and no default, so omitting it fails at priority 4 with ERR_VALIDATION (422) and no Inquiry row is created."
        test_recipe:
          setup: ["One Family row exists; logical clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_VALIDATION"
            - "GET /inquiries with family_id=${f1_id} returns 0 rows"

      - name: inquiry_create_rejects_illegal_origin_enum_member
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", "entities.Inquiry.fields.origin", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "origin is constrained to {WEB, PHONE, PARTNER_REFERRAL}; the value MAILER is rejected at priority 4 with ERR_VALIDATION rather than being silently stored or defaulted."
        test_recipe:
          setup: ["One Family row exists; logical clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "MAILER", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_VALIDATION"
            - "GET /inquiries with family_id=${f1_id} returns 0 rows"

      - name: inventory_create_rejects_client_supplied_computed_available_units
        claim_type: Computed Fields
        grounds: ["validations[priority=4]", "entities.CommunityInventory.fields.available_units", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "available_units has source computed and is not in POST /inventories input, so a body carrying it is rejected at priority 4 with ERR_VALIDATION; the server never lets a client seed a derived counter."
        test_recipe:
          setup: ["Community Cedar Grove exists with no inventory pools."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 2, quality_rating: 4.0 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /inventories"
              payload: { community_id: "${c1_id}", care_level: "ASSISTED_LIVING", total_units: 5, monthly_rate_cents: 500000, available_units: 99 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_VALIDATION"
            - "GET /inventories with community_id=${c1_id} returns 0 rows"

  - section: state_machines
    instances:
      - name: toured_match_returned_to_shortlist_supports_a_second_tour_round
        claim_type: cyclic
        grounds: ["state_machines.Match.TOURED_to_SHORTLISTED", "state_machines.Match.SHORTLISTED_to_TOUR_SCHEDULED", "entities.Match.fields.tour_round"]
        distinguishing_aspect: "The Match cycle SHORTLISTED -> TOUR_SCHEDULED -> TOURED -> SHORTLISTED -> TOUR_SCHEDULED runs twice on one row: tour_round reaches 2 and two Tour rows exist for the same match, the first COMPLETED and the second SCHEDULED."
        test_recipe:
          setup:
            - "Inquiry Q1 with an APPROVED assessment; match M1 at Cedar Grove is TOURED after tour T1 on 2026-06-05 15:00Z-16:00Z was completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 5, quality_rating: 4.0 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /inventories"
              payload: { community_id: "${c1_id}", care_level: "ASSISTED_LIVING", total_units: 5, monthly_rate_cents: 500000 }
              as: PlatformAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /assessments"
              payload: { inquiry_id: "${q1_id}", adl_score: 6, cognitive_score: 4, mobility_score: 5, budget_monthly_cents: 520000, gross_monthly_income_cents: 320000, va_eligible: true, marital_status: "MARRIED" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /matches"
              payload: { inquiry_id: "${q1_id}", community_id: "${c1_id}", care_level: "ASSISTED_LIVING" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /matches/${m1_id}/shortlist"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /tours"
              payload: { match_id: "${m1_id}", scheduled_start: "2026-06-05T15:00:00Z", scheduled_end: "2026-06-05T16:00:00Z", mode: "IN_PERSON" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tours/${t1_id}/complete"
              payload: { outcome_rating: 3 }
              as: Advisor
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /matches/${m1_id}/shortlist"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /tours"
              payload: { match_id: "${m1_id}", scheduled_start: "2026-06-12T15:00:00Z", scheduled_end: "2026-06-12T16:00:00Z", mode: "VIRTUAL" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { t2_id: $.data.id }
          assert:
            - "Match.${m1_id}.status == TOUR_SCHEDULED"
            - "Match.${m1_id}.tour_round == 2"
            - "Tour.${t1_id}.status == COMPLETED"
            - "Tour.${t2_id}.status == SCHEDULED and Tour.${t2_id}.mode == VIRTUAL"
            - "GET /tours with match_id=${m1_id} returns exactly 2 rows"
            - "Inquiry.${q1_id}.status == TOURING"

      - name: tour_cancel_returns_match_to_shortlisted_and_frees_the_community_slot
        claim_type: Compensation
        grounds: ["state_machines.Tour.SCHEDULED_to_CANCELLED", "state_machines.Match.TOUR_SCHEDULED_to_SHORTLISTED", "validations[priority=25]"]
        distinguishing_aspect: "Cancelling T1 both returns M1 to SHORTLISTED and removes T1 from the community's SCHEDULED overlap count, so a replacement tour in the identical 15:00Z-16:00Z window at a tour_slot_capacity 1 community is accepted where it would otherwise raise ERR_TOUR_SLOT_CONFLICT."
        test_recipe:
          setup:
            - "Cedar Grove has tour_slot_capacity 1 and one SCHEDULED tour T1 on 2026-06-05 15:00Z-16:00Z for match M1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 1, quality_rating: 4.0 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /inventories"
              payload: { community_id: "${c1_id}", care_level: "ASSISTED_LIVING", total_units: 5, monthly_rate_cents: 500000 }
              as: PlatformAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /assessments"
              payload: { inquiry_id: "${q1_id}", adl_score: 6, cognitive_score: 4, mobility_score: 5, budget_monthly_cents: 520000, gross_monthly_income_cents: 320000, va_eligible: true, marital_status: "MARRIED" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /matches"
              payload: { inquiry_id: "${q1_id}", community_id: "${c1_id}", care_level: "ASSISTED_LIVING" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /matches/${m1_id}/shortlist"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /tours"
              payload: { match_id: "${m1_id}", scheduled_start: "2026-06-05T15:00:00Z", scheduled_end: "2026-06-05T16:00:00Z", mode: "IN_PERSON" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /tours/${t1_id}/cancel"
              payload: { reason_code: "FAMILY_RESCHEDULE" }
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /tours"
              payload: { match_id: "${m1_id}", scheduled_start: "2026-06-05T15:00:00Z", scheduled_end: "2026-06-05T16:00:00Z", mode: "IN_PERSON" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { t2_id: $.data.id }
          assert:
            - "Tour.${t1_id}.status == CANCELLED and Tour.${t1_id}.cancel_reason_code == FAMILY_RESCHEDULE"
            - "the second call returns HTTP status == 201"
            - "Tour.${t2_id}.status == SCHEDULED"
            - "Match.${m1_id}.status == TOUR_SCHEDULED and Match.${m1_id}.tour_round == 2"
            - "GET /tours with community_id=${c1_id} and status=SCHEDULED returns exactly 1 row whose id is ${t2_id}"

      - name: completing_an_already_completed_tour_returns_tour_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Tour.SCHEDULED_to_COMPLETED", "validations[priority=10]", "errors[ERR_TOUR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is a terminal Tour state; a second complete call is refused with ERR_TOUR_INVALID_STATE (409) and does not overwrite outcome_rating or re-fire the Match TOUR_SCHEDULED -> TOURED side effect."
        test_recipe:
          setup: ["Tour T1 for match M1 has been completed with outcome_rating 3, so M1 is TOURED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 5, quality_rating: 4.0 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /inventories"
              payload: { community_id: "${c1_id}", care_level: "ASSISTED_LIVING", total_units: 5, monthly_rate_cents: 500000 }
              as: PlatformAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /assessments"
              payload: { inquiry_id: "${q1_id}", adl_score: 6, cognitive_score: 4, mobility_score: 5, budget_monthly_cents: 520000, gross_monthly_income_cents: 320000, va_eligible: true, marital_status: "MARRIED" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/review"
