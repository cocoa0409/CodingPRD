              as_user_id: "${rev_c}"
            - call: "GET /ad-policy/reviewers/${rev_a}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/reviewers/${rev_b}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "Reviewer A's claim returns HTTP 403 with error_id ERR_REVIEWER_NOT_AUTHORIZED_COUNTRY (CA is missing from country_authorizations)"
            - "Reviewer B's claim returns HTTP 403 with error_id ERR_REVIEWER_QUEUE_MISMATCH (the task's queue REGULATED_CERT is not a specialty)"
            - "Reviewer C's claim returns HTTP 200 with assigned_reviewer_id ${rev_c} and claimed_at 2026-08-01T00:00:00Z"
            - "Reviewer A and Reviewer B both still report claimed_task_count 0 and version 1 — a refused claim does not touch the reviewer row"

      - name: error_catalog_appeal_lifecycle_rejects_a_second_decision_a_second_appeal_and_an_expired_notice
        claim_type: Error triggerability
        grounds:
          - validations[priority=38].ERR_APPEAL_ALREADY_EXISTS
          - validations[priority=40].ERR_APPEAL_NOT_PENDING
          - validations[priority=40].ERR_NOTICE_NOT_APPEALABLE
        distinguishing_aspect: |
          Three refusals that all look like "you cannot appeal that" must be distinguished:
          re-deciding a DENIED appeal is ERR_APPEAL_NOT_PENDING, re-appealing a notice that
          already has an appeal is ERR_APPEAL_ALREADY_EXISTS (priority 38, ahead of the state
          check), and appealing a notice the sweep has EXPIRED is ERR_NOTICE_NOT_APPEALABLE
          at priority 40 — never ERR_APPEAL_WINDOW_CLOSED, which sits at 74.
