              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-07-31T23:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-07-31T23:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station2}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /oven-stations/${station}/mark-down"
              payload: { down_reason: "burner service" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /oven-stations/${station}/restore"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /cooling-bays/${bay}/mark-down"
              payload: { down_reason: "blower belt" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /cooling-bays/${bay}/restore"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "the arm_index 3 create returns status 422 with data.error_id 'ERR_INVALID_QUANTITY' because OVN-CD-1 has arm_count 2"
            - "the AMBIENT plus back-dated create returns status 422 with data.error_id 'ERR_COOLING_MODE_MISMATCH', not 'ERR_OVEN_START_IN_PAST'"
            - "the FORCED_AIR plus back-dated create returns status 422 with data.error_id 'ERR_OVEN_START_IN_PAST' — 2026-07-31T23:00:00Z is before the logical clock"
            - "the OVN-CD-2 create returns status 422 with data.error_id 'ERR_SIZE_CLASS_NOT_SUPPORTED' because SIZE_CLASS_ORDER[MID] exceeds SIZE_CLASS_ORDER[COMPACT]"
            - "the create against the DOWN station returns status 409 with data.error_id 'ERR_OVEN_STATION_DOWN', not the 422 ERR_COOLING_MODE_MISMATCH its AMBIENT body also earns"
            - "the create against the DOWN bay returns status 409 with data.error_id 'ERR_COOLING_BAY_DOWN'"
            - "ProductionOrder.${po}.version == ${po_v} and status == 'READY_TO_SCHEDULE' after all six refusals — a rejected create consumes no OCC token"
            - "GET /molding-cycles?production_order_id=${po} returns total_count 0 before the final call"
            - "the final create returns status 201, ProductionOrder.${po}.status == 'IN_PRODUCTION' and ProductionOrder.${po}.version == ${po_v} + 1"

      - name: err_cycle_lifecycle_invalid_state_and_the_cooling_time_floor
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CYCLE_INVALID_STATE
          - errors.ERR_COOLING_TIME_INSUFFICIENT
          - validations.priority_35
          - validations.priority_54
        distinguishing_aspect: |
          The cycle's four-step lifecycle refuses every out-of-order call with
          ERR_CYCLE_INVALID_STATE (enter-cooling and demold on a SCHEDULED
          cycle, a second start-oven on an OVEN_RUNNING one), and the demold
          time floor is asserted on the minute: 29 floored cooling minutes is
          422 ERR_COOLING_TIME_INSUFFICIENT against min_cooling_minutes 30 while
          exactly 30 is accepted.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with one SCHEDULED cycle holding a 24.000 kg RESERVED charge; PM-CD-KM.min_cooling_minutes is 30."
          setup_api_calls:
            - *cd2_clock0
