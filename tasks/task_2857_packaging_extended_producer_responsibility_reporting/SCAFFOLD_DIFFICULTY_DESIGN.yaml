            - "ReportLine.${line_e_id}.eco_mod_detail[0].malus_pct == 60 and bonus_pct == 40 and net_pct == 20"
            - "ReportLine.${line_e_id}.line_fee_cents == 39600"
            - "ReportLine.${line_f_id}.eco_mod_detail[0].malus_pct == 0 and bonus_pct == 40 and net_pct == -30"
            - "ReportLine.${line_f_id}.line_fee_cents == 23100"
            - "PackagingReport.${rep_id}.fee_subtotal_cents == 62700"
            - "ReportLine.${line_f_id}.line_fee_cents != 19800 (the unclamped net -40 value)"

      - name: invoice_admin_fee_mode_c_bracket_keyed_on_subtotal
        grounds:
          - calculations.invoice_administrative_fee
          - entities.Invoice.fields.admin_fee_bps_applied
          - entities.Invoice.fields.total_cents
          - entities.FeeSchedule.fields.admin_fee_bps_low
          - state_machines.PackagingReport_fee_status.FINAL_to_INVOICED
        distinguishing_aspect: |
          Mode (c): the invoice total looks circular because total_cents = fee_subtotal_cents +
          admin_fee_cents while the two basis-point brackets are described as brackets of "the
          invoice"; the pinned evaluation order keys the bracket on fee_subtotal_cents 39000
          (< ADMIN_TIER_BREAK_CENTS 40000) so admin_fee_bps_applied is 500 and total_cents is 40950,
