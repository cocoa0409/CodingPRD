  - rule_id: non_linear_state_machine
    instances:
      - name: absence_unfilled_internal_coverage_cycle
        grounds:
          - state_machines.Absence.DISPATCHING_to_UNFILLED
          - state_machines.Absence.UNFILLED_to_COVERED_INTERNALLY
          - state_machines.Absence.COVERED_INTERNALLY_to_UNFILLED
          - calculations.absence_day_coverage
        distinguishing_aspect: |
          Absence fill_status is cyclic (DISPATCHING -> UNFILLED -> COVERED_INTERNALLY ->
          UNFILLED) driven by child InternalCoverage state, not a linear pipeline: the last
          coverage cancellation loops the absence back to UNFILLED and day counters re-derive.
        test_recipe:
          setup:
            - "District defaults; school budget 1000000; teachers T1 (SCIENCE/HIGH, absent) and T2 (covering)"
            - "No SCIENCE-qualified substitute exists (empty pool); absence Mon 2026-08-03 single day"
            - "Dispatch batch on 2026-08-04 marks it UNFILLED"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach Two", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-08-04" }, as: DistrictAdmin, captures: { batch: $.data.id, n_unfilled: $.data.absences_marked_unfilled, n_offers: $.data.offers_created } }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs1}", staff_member_id: "${t2}", coverage_date: "2026-08-03", periods: 2 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { cov1: $.data.id } }
            - { call: "POST /internal-coverages/${cov1}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /internal-coverages/${cov1}/cancel", payload: {}, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { abs_fill: $.data.fill_status, abs_dci: $.data.days_covered_internal, abs_du: $.data.days_uncovered } }
          assert:
            - "DispatchBatch.${batch}: offers_created == 0 (empty pool fallback) and absences_marked_unfilled == 1"
            - "After coverage approval: Absence.fill_status was COVERED_INTERNALLY with days_covered_internal == 1, days_uncovered == 0"
            - "After coverage cancel (trigger): Absence.${abs1}.fill_status == UNFILLED, days_covered_internal == 0, days_uncovered == 1 — the cycle closed"

      - name: assignment_offered_fork_divergent_cascades
        grounds:
          - state_machines.Assignment.OFFERED_to_DECLINED
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - calculations.dispatch_candidate_ranking
        distinguishing_aspect: |
          Assignment OFFERED forks with divergent side-effect sets: DECLINE leaves the absence
          DISPATCHING and immediately re-offers to the next-ranked substitute (offer_sequence 2,
          no budget movement, no reliability event), while ACCEPT commits budget and flips the
          absence to ASSIGNED — two branches of the same fork produce disjoint cascades.
        test_recipe:
          setup:
            - "District defaults; school NONE budget 1000000; teacher MATH/HIGH"
            - "Subs A (registered first, rate 20000) and B (rate 18000), both ACTIVE qualified MATH/HIGH, both trailing 100 -> tie broken by created_at ASC so A is offered first"
            - "Absence Mon 2026-08-03..Tue 2026-08-04 (2 days, no approval); dispatch batch creates offer to A"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA1: $.data.id } }
            - { call: "POST /clearances/${clrA1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA2: $.data.id } }
            - { call: "POST /clearances/${clrA2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes", payload: { full_name: "Sub B", base_daily_rate_cents: 18000 }, as: DistrictAdmin, captures: { subB: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subB}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB1: $.data.id } }
            - { call: "POST /clearances/${clrB1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB2: $.data.id } }
            - { call: "POST /clearances/${clrB2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subB}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-04", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-07-29" }, as: DistrictAdmin, captures: { batch: $.data.id, n_offers: $.data.offers_created } }
            - { call: "GET /assignments", payload: { absence_id: "${abs1}", status: "OFFERED" }, as: DistrictAdmin, captures: { asgA: "$.data[0].id", asgA_sub: "$.data[0].substitute_id", asgA_seq: "$.data[0].offer_sequence" } }
            - { call: "POST /assignments/${asgA}/respond", payload: { decision: "DECLINE" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "GET /assignments", payload: { absence_id: "${abs1}", status: "OFFERED" }, as: DistrictAdmin, captures: { asgB: "$.data[0].id", asgB_sub: "$.data[0].substitute_id", asgB_seq: "$.data[0].offer_sequence" } }
          trigger:
            - { call: "POST /assignments/${asgB}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subB}" }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { abs_fill: $.data.fill_status } }
            - { call: "GET /schools/${sch}", payload: {}, as: DistrictAdmin, captures: { committed: $.data.coverage_budget_committed_cents } }
          assert:
            - "First offer went to ${subA} with offer_sequence == 1 (rank tie -> earliest created_at)"
            - "After DECLINE: Assignment.${asgA}.status == DECLINED, Substitute.${subA}.reliability_trailing_score == 100 (declines carry no event), absence still DISPATCHING"
            - "Re-dispatch created Assignment.${asgB} for ${subB} with offer_sequence == 2 and offer_source == AUTO_DISPATCH"
            - "After ACCEPT (trigger): Absence.${abs1}.fill_status == ASSIGNED and School.${sch}.coverage_budget_committed_cents == 36000 (2 days x 18000 at premium 1.00)"

  - rule_id: transitive_cascade
    instances:
      - name: escalate_flag_dnr_cancel_reopen_reoffer
        grounds:
          - state_machines.PerformanceFlag.OPEN_to_ESCALATED
          - state_machines.SchoolSubstituteMark.ACTIVE_to_LIFTED
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
          - state_machines.Absence.ASSIGNED_to_DISPATCHING
          - calculations.dispatch_candidate_ranking
        distinguishing_aspect: |
          Depth-4 chained cascade where each link is caused by the previous one: flag review
          ESCALATE creates the DO_NOT_RETURN mark; mark creation cancels the substitute's
          ACCEPTED assignment at that school (DNR_CANCEL); the cancellation reopens the absence
          to DISPATCHING; the reopen re-runs the selector and creates a new offer to the next
          eligible substitute.
        test_recipe:
          setup:
            - "District defaults; school S1 NONE budget 1000000; teacher MATH/HIGH; coordinator"
            - "Subs X (20000) and Y (18000) both ACTIVE qualified MATH/HIGH"
            - "Absence Mon 2026-08-03..Tue 2026-08-04; manual offer to X; X ACCEPTED (committed 40000)"
