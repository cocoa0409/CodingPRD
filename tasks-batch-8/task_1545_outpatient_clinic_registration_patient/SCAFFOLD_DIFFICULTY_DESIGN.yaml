scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: copay_estimate_payer_verified_vs_fee_schedule
        grounds:
          - calculations.copay_estimate
          - entities.CopayEstimate.fields.method
          - entities.CopayEstimate.fields.estimated_patient_responsibility_cents
        distinguishing_aspect: |
          Dual variant on the CopayEstimate domain: identical appointment and
          allowed amount yield 44000 cents under PAYER_VERIFIED (deductible
          30000 + 20% coinsurance on 70000) versus 26400 cents under
          FEE_SCHEDULE (NEW visit 22000 * 1.2), driven purely by whether a
          fresh ACTIVE EligibilityCheck exists.
        test_recipe:
          setup:
            - "Registered patient P with REGISTERED status and an ACTIVE PPO policy (deductible_remaining 30000, oop_max_remaining 500000)"
            - "NEW appointment A (visit_type NEW) in PRE_CHECKED with one fresh EligibilityCheck coverage_status=ACTIVE, copay_cents=0, coinsurance_pct=20, auth_required=false"
            - "Second NEW appointment A2 (visit_type NEW) for a second registered patient P2 with an identical ACTIVE PPO policy but NO eligibility check posted"
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Ana", last_name: "Vera", date_of_birth: "1980-04-02", sex_at_birth: "F", primary_phone: "+15551000001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "M100", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 30000, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99205", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "NEW", provider_code: "DRSMITH" }
              as: Registrar
              captures: { appt_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${appt_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 20, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${appt_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/patients"
              payload: { first_name: "Bob", last_name: "Lee", date_of_birth: "1975-11-20", sex_at_birth: "M", primary_phone: "+15551000002" }
              as: Registrar
              captures: { p2_id: $.data.id }
            - call: "POST /patient-access/patients/${p2_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p2_id}", payer_id: "PAYER1", member_id: "M200", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 30000, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol2_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p2_id}", department_code: "ORTHO", procedure_code: "99205", scheduled_start: "2026-08-10T10:00:00Z", duration_minutes: 30, visit_type: "NEW", provider_code: "DRJONES" }
              as: Registrar
              captures: { appt2_id: $.data.id }
            - call: "POST /patient-access/appointments/${appt2_id}/copay-estimates"
              payload: { policy_id: "${pol2_id}", allowed_amount_cents: 100000 }
              as: FinancialCounselor
              captures: { est2_id: $.data.id }
          trigger:
            - call: "POST /patient-access/appointments/${appt_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 100000 }
              as: FinancialCounselor
              captures: { est1_id: $.data.id }
          assert:
            - "CopayEstimate.${est1_id}.method == PAYER_VERIFIED"
            - "CopayEstimate.${est1_id}.estimated_patient_responsibility_cents == 44000"
            - "CopayEstimate.${est2_id}.method == FEE_SCHEDULE"
            - "CopayEstimate.${est2_id}.estimated_patient_responsibility_cents == 26400"
            - "CopayEstimate.${est1_id}.estimated_patient_responsibility_cents != CopayEstimate.${est2_id}.estimated_patient_responsibility_cents"

      - name: deposit_rule_risk_adjusted_vs_standard
        grounds:
          - calculations.deposit_rule
          - calculations.no_show_strike
          - entities.CopayEstimate.fields.deposit_required_cents
        distinguishing_aspect: |
          Dual variant on the deposit domain (distinct from estimate
          calculation): two patients with identical 44000-cent estimates get
          deposit_required 11000 (25% standard tier, strikes == 0) versus
          44000 (100% high-risk tier, strikes >= 2), driven by the trailing
          no-show strike count.
        test_recipe:
          setup:
            - "Registered patient LOW with 0 trailing NO_SHOW appointments, PPO policy, PRE_CHECKED ESTABLISHED appointment with PAYER_VERIFIED estimate 44000"
            - "Registered patient HIGH with 2 trailing NO_SHOW appointments inside the 365-day window, identical policy and estimate"
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Low", last_name: "Risk", date_of_birth: "1990-01-01", sex_at_birth: "F", primary_phone: "+15552000001" }
              as: Registrar
              captures: { pl_id: $.data.id }
            - call: "POST /patient-access/patients/${pl_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${pl_id}", payer_id: "PAYER1", member_id: "ML", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 30000, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { poll_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${pl_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRA" }
              as: Registrar
              captures: { al_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${poll_id}", appointment_id: "${al_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 20, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/patients"
              payload: { first_name: "Hi", last_name: "Risk", date_of_birth: "1991-02-02", sex_at_birth: "M", primary_phone: "+15552000002" }
              as: Registrar
              captures: { ph_id: $.data.id }
            - call: "POST /patient-access/patients/${ph_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${ph_id}", payer_id: "PAYER1", member_id: "MH", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 30000, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { polh_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${ph_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-05T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRB" }
              as: Registrar
              captures: { ah1_id: $.data.id }
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/appointments/${ah1_id}/mark-no-show"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${ph_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-06T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRB" }
              as: Registrar
              captures: { ah2_id: $.data.id }
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T10:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/appointments/${ah2_id}/mark-no-show"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${ph_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRB" }
              as: Registrar
              captures: { ah3_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${polh_id}", appointment_id: "${ah3_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 20, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${al_id}/copay-estimates"
              payload: { policy_id: "${poll_id}", allowed_amount_cents: 100000 }
              as: FinancialCounselor
              captures: { estl_id: $.data.id }
          trigger:
            - call: "POST /patient-access/appointments/${ah3_id}/copay-estimates"
              payload: { policy_id: "${polh_id}", allowed_amount_cents: 100000 }
              as: FinancialCounselor
              captures: { esth_id: $.data.id }
          assert:
            - "CopayEstimate.${estl_id}.estimated_patient_responsibility_cents == 44000"
            - "CopayEstimate.${estl_id}.deposit_required_cents == 11000"
            - "CopayEstimate.${esth_id}.estimated_patient_responsibility_cents == 44000"
            - "CopayEstimate.${esth_id}.deposit_required_cents == 44000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) and (c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: copay_estimate_deductible_coinsurance_oop_interaction
        grounds:
          - calculations.copay_estimate
        distinguishing_aspect: |
          Mode (a): the PAYER_VERIFIED formula has >= 3 inputs
          (allowed_amount, deductible_remaining, coinsurance_pct,
          oop_max_remaining) with non-linear interaction — nested
          min(deductible), conditional copay==0 branch, and a capping min
          against oop_max; the test pins a case where the oop cap binds
          (resp capped at 2000 when the raw path yields 44000).
        test_recipe:
          setup:
            - "Registered patient with PPO policy: deductible_remaining_cents=30000, oop_max_remaining_cents=2000"
            - "PRE_CHECKED ESTABLISHED appointment with fresh ACTIVE eligibility check (copay_cents=0, coinsurance_pct=20)"
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Cap", last_name: "Case", date_of_birth: "1988-03-03", sex_at_birth: "X", primary_phone: "+15553000001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MC", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 30000, oop_max_remaining_cents: 2000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRC" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 20, auth_required: false }
              as: Registrar
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 100000 }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
          assert:
            - "CopayEstimate.${est_id}.estimated_patient_responsibility_cents == 2000"
            - "CopayEstimate.${est_id}.deposit_required_cents == 500"

      - name: clearance_status_evaluation_order_is_pinned
        grounds:
          - calculations.clearance_status
          - entities.Appointment.fields.registration_gate
          - entities.Appointment.fields.auth_satisfied
        distinguishing_aspect: |
          Mode (c): clearance_status has a circular-looking dependency —
          registration_gate depends on auth_satisfied and on the deposit of
          the latest estimate, while estimate supersession and authorization
          expiry both re-enter the same computation. The scaffold pins the
          7-step evaluation order; the test proves that voiding the
          Authorization flips the gate to BLOCKED even though the deposit is
          fully collected (step 2 dominates step 7).
        test_recipe:
          setup:
            - "Registered patient, PPO plan (referral not needed), PROCEDURE appointment PRE_CHECKED with estimate deposit 0-collected-sufficient, and an APPROVED Authorization; gate == CLEAR after full deposit posted"
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Ord", last_name: "Er", date_of_birth: "1985-05-05", sex_at_birth: "M", primary_phone: "+15553000002" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MO", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "SURG", procedure_code: "47562", scheduled_start: "2026-08-12T09:00:00Z", duration_minutes: 60, visit_type: "PROCEDURE", provider_code: "DRD" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 20, auth_required: true }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/authorizations"
              payload: { patient_id: "${p_id}", appointment_id: "${a_id}", payer_auth_number: "AUTH123", authorized_units: 1, valid_until: "2026-08-31" }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 100000 }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /patient-access/appointments/${a_id}/payments"
              payload: { amount_cents: 10000, method: "CARD", kind: "POST" }
              as: FinancialCounselor
            - call: "GET /patient-access/appointments/${a_id}"
              as: FinancialCounselor
              captures: { gate_pre: $.data.registration_gate }
            - call: "GET /patient-access/appointments/${a_id}/authorizations"
              as: AccessSupervisor
              captures: { auth_id: "$.data[0].id" }
          trigger:
            - call: "POST /patient-access/authorizations/${auth_id}/void"
              payload: {}
              as: AccessSupervisor
            - call: "GET /patient-access/appointments/${a_id}"
              as: FinancialCounselor
              captures: { gate_post: $.data.registration_gate, auth_sat_post: $.data.auth_satisfied }
          assert:
            - "CopayEstimate.${est_id}.estimated_patient_responsibility_cents == 20000"
            - "Appointment.${a_id}.amount_collected_cents == 10000"
            - "gate_pre == CLEAR"
            - "gate_post == BLOCKED"
            - "auth_sat_post == false"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_precheck_revert_cycle
        grounds:
          - state_machines.Appointment.SCHEDULED_to_PRE_CHECKED
          - state_machines.Appointment.PRE_CHECKED_to_SCHEDULED
        distinguishing_aspect: |
          Appointment exhibits a branching-with-revert cycle:
          SCHEDULED -> PRE_CHECKED -> SCHEDULED via revert-precheck; after
          reverting, pre-check can be taken again, demonstrating A->B->A.
        test_recipe:
          setup:
            - "Registered patient, PPO policy, appointment with fresh ACTIVE eligibility; appointment currently PRE_CHECKED"
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Cyc", last_name: "Lic", date_of_birth: "1979-09-09", sex_at_birth: "F", primary_phone: "+15554000001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MCY", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-15T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRE" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 3500, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/revert-precheck"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
              captures: { st: $.data.status }
          assert:
            - "after revert-precheck Appointment.${a_id}.status == SCHEDULED"
            - "st == PRE_CHECKED"

      - name: queue_ticket_called_skipped_branch
        grounds:
          - state_machines.QueueTicket.WAITING_to_CALLED
          - state_machines.QueueTicket.CALLED_to_SKIPPED
          - state_machines.Appointment.ARRIVED_to_IN_ROOM
        distinguishing_aspect: |
          QueueTicket exhibits fork-join branching: WAITING -> CALLED then
          either CALLED -> SERVED (via appointment completion) or
          CALLED -> SKIPPED (front desk skips), with divergent side effects
          on the owning Appointment (stays IN_ROOM vs returns to ARRIVED) —
          a non-linear shape on a different entity than Appointment's own
          revert cycle.
        test_recipe:
          setup:
            - "ARRIVED appointment (gate CLEAR, no deposit due) with WAITING ticket in department ORTHO for queue_date 2026-08-10"
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Que", last_name: "Ue", date_of_birth: "1992-12-12", sex_at_birth: "M", primary_phone: "+15554000002" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MQ", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-10T09:05:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRF" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 3500, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 5000 }
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${a_id}/payments"
              payload: { amount_cents: 875, method: "CARD", kind: "POST" }
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${a_id}/mark-ready"
              payload: {}
              as: FinancialCounselor
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:04:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/appointments/${a_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/queue-tickets/call-next"
              payload: { department_code: "ORTHO", queue_date: "2026-08-10" }
              as: FrontDeskAgent
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /patient-access/queue-tickets/${t_id}/skip"
              payload: {}
              as: FrontDeskAgent
              captures: { t_state: $.data.state }
            - call: "GET /patient-access/appointments/${a_id}"
              as: FrontDeskAgent
              captures: { a_state: $.data.status }
          assert:
            - "t_state == SKIPPED"
            - "a_state == ARRIVED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: policy_terminate_estimate_supersede_gate_recompute
        grounds:
          - state_machines.InsurancePolicy.ACTIVE_to_TERMINATED
          - state_machines.CopayEstimate.PROVISIONAL_to_SUPERSEDED
          - calculations.clearance_status
        distinguishing_aspect: |
          Depth-3 chain: terminate policy (A) -> its PROVISIONAL CopayEstimate
          flips SUPERSEDED (B, caused by A's cascade) -> owning Appointment's
          estimated_patient_responsibility re-derives to 0 and
          registration_gate recomputes from CLEAR_WITH_PAYMENT to CLEAR
          (C, caused by B's supersession).
        test_recipe:
          setup:
            - "Registered patient, PPO policy, PRE_CHECKED ESTABLISHED appointment with PAYER_VERIFIED estimate 44000 / deposit 11000, nothing collected, gate == CLEAR_WITH_PAYMENT"
          setup_api_calls:
