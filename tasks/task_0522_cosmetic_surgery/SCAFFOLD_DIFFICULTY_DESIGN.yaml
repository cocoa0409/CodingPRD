# =============================================================================
# §1.8 — Scaffold Difficulty Design (Test Targeting Index)
# Concierge Cosmetic & Plastic Surgery (cash-pay)
# 9 rule_id blocks x 2 instances = 18 instances.
#
# Canonical fixture literals (locked by executed formula):
#   ProcA (RHINO01): surgical 500000 / facility 200000 / anesthesia 150000  -> bundle 850000, revision_window_days 90
#   ProcB (LIPO01):  surgical 300000 / facility 150000 / anesthesia 100000  -> bundle 550000, revision_window_days 90
#   Quote A+B (2 lines): subtotal 1400000, discount 5%, total 1330000, required_deposit 266000
#   Quote A only (1 line): subtotal 850000, discount 0%, total 850000, required_deposit 170000
#   CareCredit fin 500000: fee 15000, net 485000 ;  Cherry fin 500000: fee 25000, net 475000
#   scheduled surgery 2026-08-01T00:00:00Z ; default clock 2026-05-01T00:00:00Z
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_financing_lender_net
        grounds:
          - calculations.practice_net
          - entities.FinancingApplication.fields.practice_net_cents
          - entities.FinancingApplication.fields.merchant_fee_cents
        distinguishing_aspect: |
          Two APPROVED FinancingApplications with identical approved_amount_cents=500000 but
          different lenders diverge in the FinancingApplication domain: CHERRY -> merchant_fee_cents=25000,
          practice_net_cents=475000 while CARECREDIT -> merchant_fee_cents=15000, practice_net_cents=485000.
        test_recipe:
          setup:
            - "Two ACCEPTED quotes (each total 1330000, deposit 266000 paid) exist; one has a CHERRY financing app, the other a CARECREDIT financing app, each requesting 500000."
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /procedures"
              payload: { code: "LIPO01", name: "Liposuction", surgical_fee_cents: 300000, facility_fee_cents: 150000, anesthesia_fee_cents: 100000 }
              as: PracticeAdmin
              captures: { procB: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", age_years: 34, bmi: 24, asa_class: 1, smoker: false }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /patients/${pat1}/clearances"
              payload: { tier_provided: "STANDARD" }
              as: Surgeon
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procB}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/consents"
              payload: { before_photo_ref: "s3://b/1", photo_consent_signed: true, surgical_consent_signed: true }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/deposits"
              payload: { amount_cents: 266000 }
              as: BillingSpecialist
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/accept"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /financing-applications"
              payload: { quote_package_id: "${q1}", lender: "CHERRY", requested_amount_cents: 500000 }
              as: BillingSpecialist
              captures: { fin_cherry: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P Two", date_of_birth: "1990-01-01", age_years: 34, bmi: 24, asa_class: 1, smoker: false }
              as: FrontDeskCoordinator
              captures: { pat2: $.data.id }
            - call: "POST /patients/${pat2}/clearances"
              payload: { tier_provided: "STANDARD" }
              as: Surgeon
            - call: "POST /consultations"
              payload: { patient_id: "${pat2}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons2: $.data.id }
            - call: "POST /consultations/${cons2}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons2}" }
              as: FrontDeskCoordinator
              captures: { q2: $.data.id }
            - call: "POST /quote-packages/${q2}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q2}/line-items"
              payload: { procedure_id: "${procB}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q2}/consents"
              payload: { before_photo_ref: "s3://b/2", photo_consent_signed: true, surgical_consent_signed: true }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q2}/deposits"
              payload: { amount_cents: 266000 }
              as: BillingSpecialist
            - call: "POST /quote-packages/${q2}/present"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q2}/accept"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /financing-applications"
              payload: { quote_package_id: "${q2}", lender: "CARECREDIT", requested_amount_cents: 500000 }
              as: BillingSpecialist
              captures: { fin_cc: $.data.id }
          trigger:
            - call: "POST /financing-applications/${fin_cherry}/approve"
              payload: {}
              as: BillingSpecialist
              captures: { cherry_fee: $.data.merchant_fee_cents, cherry_net: $.data.practice_net_cents }
            - call: "POST /financing-applications/${fin_cc}/approve"
              payload: {}
              as: BillingSpecialist
              captures: { cc_fee: $.data.merchant_fee_cents, cc_net: $.data.practice_net_cents }
          assert:
            - "FinancingApplication.${fin_cherry}.merchant_fee_cents == 25000"
            - "FinancingApplication.${fin_cherry}.practice_net_cents == 475000"
            - "FinancingApplication.${fin_cc}.merchant_fee_cents == 15000"
            - "FinancingApplication.${fin_cc}.practice_net_cents == 485000"

      - name: dual_variant_revision_charge_attribution
        grounds:
          - calculations.revision_charge
          - state_machines.ComplicationCase.UNDER_REVIEW_to_REVISION_APPROVED
          - entities.ComplicationCase.fields.revision_charge_cents
        distinguishing_aspect: |
          On the ComplicationCase domain (distinct from practice_net's FinancingApplication domain),
          identical line surgical_fee_cents=500000 yields two different revision charges: SURGICAL_ORIGIN
          within window -> revision_charge_cents=0 vs PATIENT_FACTOR within window -> revision_charge_cents=250000.
        test_recipe:
          setup:
            - "Two COMPLETED surgery bookings each with a line item on ProcA (surgical_fee 500000); one complication case attributed SURGICAL_ORIGIN, the other PATIENT_FACTOR, both reported within the 90-day window."
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", age_years: 34, bmi: 24, asa_class: 1, smoker: false }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /patients/${pat1}/clearances"
              payload: { tier_provided: "STANDARD" }
              as: Surgeon
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
              captures: { li1: $.data.id }
            - call: "POST /quote-packages/${q1}/consents"
              payload: { before_photo_ref: "s3://b/1", photo_consent_signed: true, surgical_consent_signed: true }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/deposits"
              payload: { amount_cents: 170000 }
              as: BillingSpecialist
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/accept"
              payload: {}
              as: FrontDeskCoordinator
              captures: { q1_v: $.data.version }
            - call: "POST /surgery-bookings"
              payload: { quote_package_id: "${q1}", surgeon_user_id: "surgeon-1", or_room: "OR1", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T03:00:00Z", expected_quote_package_version: "${q1_v}" }
              as: FrontDeskCoordinator
              captures: { bk1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: PracticeAdmin
            - call: "POST /surgery-bookings/${bk1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /complication-cases"
              payload: { surgery_booking_id: "${bk1}", line_item_id: "${li1}", attribution: "SURGICAL_ORIGIN" }
              as: Surgeon
              captures: { case_surg: $.data.id }
            - call: "POST /complication-cases/${case_surg}/review"
              payload: {}
              as: Surgeon
            - call: "POST /complication-cases"
              payload: { surgery_booking_id: "${bk1}", line_item_id: "${li1}", attribution: "PATIENT_FACTOR" }
              as: Surgeon
              captures: { case_pat: $.data.id }
            - call: "POST /complication-cases/${case_pat}/review"
              payload: {}
              as: Surgeon
          trigger:
            - call: "POST /complication-cases/${case_surg}/approve-revision"
              payload: {}
              as: Surgeon
              captures: { surg_charge: $.data.revision_charge_cents }
            - call: "POST /complication-cases/${case_pat}/approve-revision"
              payload: {}
              as: Surgeon
              captures: { pat_charge: $.data.revision_charge_cents }
          assert:
            - "ComplicationCase.${case_surg}.revision_charge_cents == 0"
            - "ComplicationCase.${case_surg}.within_revision_window == true"
            - "ComplicationCase.${case_pat}.revision_charge_cents == 250000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_quote_total_rounding_order
        grounds:
          - calculations.quote_total
          - entities.QuotePackage.fields.total_cents
          - entities.QuotePackage.fields.discount_pct
        distinguishing_aspect: |
          Mode (b) — rounding order is pinned: with subtotal 1400000 and a 5% two-line discount,
          sum-then-discount-then-round yields total_cents=1330000 (round_half_up applied once to
          1400000*0.95), NOT a per-line rounding path.
        test_recipe:
          setup:
            - "A DRAFT quote holds two line items (ProcA bundle 850000, ProcB bundle 550000); count==2 selects discount 0.05."
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /procedures"
              payload: { code: "LIPO01", name: "Liposuction", surgical_fee_cents: 300000, facility_fee_cents: 150000, anesthesia_fee_cents: 100000 }
              as: PracticeAdmin
              captures: { procB: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "both" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
          trigger:
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procB}" }
              as: FrontDeskCoordinator
            - call: "GET /quote-packages/${q1}"
              payload: {}
              as: FrontDeskCoordinator
              captures: { subtotal: $.data.subtotal_cents, disc: $.data.discount_pct, total: $.data.total_cents, dep: $.data.required_deposit_cents }
          assert:
            - "QuotePackage.${q1}.subtotal_cents == 1400000"
            - "QuotePackage.${q1}.discount_pct == 0.05"
            - "QuotePackage.${q1}.total_cents == 1330000"
            - "QuotePackage.${q1}.required_deposit_cents == 266000"

      - name: combinatorial_risk_score_nonlinear_penalties
        grounds:
          - calculations.surgical_risk_score
          - entities.Patient.fields.surgical_risk_score
          - entities.Patient.fields.clearance_tier
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear tiered interaction: asa_class=2, bmi=31, smoker=true,
          age_years=52, prior=0 combine as 25 + 10 + 20 + 8 + 0 = 63, and the >=40/<70 band derives
          clearance_tier=STANDARD (distinct axis from the rounding-order mode above).
        test_recipe:
          setup:
            - "Empty DB; a single Patient is created with the risk-driving fields set."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Risky R", date_of_birth: "1974-01-01", age_years: 52, bmi: 31, asa_class: 2, smoker: true, prior_complication_count: 0 }
              as: FrontDeskCoordinator
              captures: { pat: $.data.id, score: $.data.surgical_risk_score, tier: $.data.clearance_tier }
          assert:
            - "Patient.${pat}.surgical_risk_score == 63"
            - "Patient.${pat}.clearance_tier == STANDARD"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_complication_case_cycle
        grounds:
          - state_machines.ComplicationCase.UNDER_REVIEW_to_OPEN
          - state_machines.ComplicationCase.OPEN_to_UNDER_REVIEW
        distinguishing_aspect: |
          ComplicationCase is cyclic: OPEN -> UNDER_REVIEW -> OPEN -> UNDER_REVIEW is legal, unlike a
          linear pipeline; after review then reopen then review the status returns to UNDER_REVIEW.
        test_recipe:
          setup:
            - "A COMPLETED surgery booking with one line item and an OPEN complication case exists."
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /patients/${pat1}/clearances"
              payload: { tier_provided: "STANDARD" }
              as: Surgeon
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
              captures: { li1: $.data.id }
            - call: "POST /quote-packages/${q1}/consents"
              payload: { before_photo_ref: "s3://b/1", photo_consent_signed: true, surgical_consent_signed: true }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/deposits"
              payload: { amount_cents: 170000 }
              as: BillingSpecialist
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/accept"
              payload: {}
              as: FrontDeskCoordinator
              captures: { q1_v: $.data.version }
            - call: "POST /surgery-bookings"
              payload: { quote_package_id: "${q1}", surgeon_user_id: "surgeon-1", or_room: "OR1", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T03:00:00Z", expected_quote_package_version: "${q1_v}" }
              as: FrontDeskCoordinator
              captures: { bk1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: PracticeAdmin
            - call: "POST /surgery-bookings/${bk1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /complication-cases"
              payload: { surgery_booking_id: "${bk1}", line_item_id: "${li1}", attribution: "SURGICAL_ORIGIN" }
              as: Surgeon
              captures: { case1: $.data.id }
          trigger:
            - call: "POST /complication-cases/${case1}/review"
              payload: {}
              as: Surgeon
            - call: "POST /complication-cases/${case1}/reopen"
              payload: {}
              as: Surgeon
            - call: "POST /complication-cases/${case1}/review"
              payload: {}
              as: Surgeon
              captures: { st: $.data.status }
          assert:
            - "ComplicationCase.${case1}.status == UNDER_REVIEW"

      - name: nonlinear_quote_branching_accept_vs_reject
        grounds:
          - state_machines.QuotePackage.PRESENTED_to_ACCEPTED
          - state_machines.QuotePackage.PRESENTED_to_REJECTED
        distinguishing_aspect: |
          QuotePackage branches from PRESENTED with divergent side effects: the ACCEPT arm converts the
          consultation (COMPLETED->CONVERTED) while the REJECT arm voids submitted financing; the two arms
          lead to different terminal/derived states on a different entity than ComplicationCase.
        test_recipe:
          setup:
            - "A PRESENTED quote (deposit paid, consent signed) with a SUBMITTED financing app is rejected."
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /financing-applications"
              payload: { quote_package_id: "${q1}", lender: "CHERRY", requested_amount_cents: 100000 }
              as: BillingSpecialist
              captures: { fin1: $.data.id }
          trigger:
            - call: "POST /quote-packages/${q1}/reject"
              payload: {}
              as: FrontDeskCoordinator
              captures: { qst: $.data.status }
            - call: "GET /financing-applications/${fin1}"
              payload: {}
              as: BillingSpecialist
              captures: { finst: $.data.status }
          assert:
            - "QuotePackage.${q1}.status == REJECTED"
            - "FinancingApplication.${fin1}.status == VOIDED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_booking_cancel_voids_financing_reconciles_balance
        grounds:
          - state_machines.SurgeryBooking.SCHEDULED_to_CANCELLED
          - state_machines.FinancingApplication.SUBMITTED_to_VOIDED
          - entities.QuotePackage.fields.balance_due_cents
        distinguishing_aspect: |
          Depth-3 chain from booking cancel: booking->CANCELLED (hop1 cause) => APPROVED financing->VOIDED
          (hop2, caused by hop1) => QuotePackage.financed_cents drops 500000->0 and balance_due_cents
          recomputes to 1064000 (hop3, caused by hop2). Refund tier here is 100% (61 days notice).
        test_recipe:
          setup:
            - "An ACCEPTED quote (total 1330000, deposit 266000 paid) with an APPROVED CareCredit financing of 500000 (balance_due 564000) and a SCHEDULED booking (surgery 2026-08-01, clock 2026-06-01, 61 days notice)."
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /procedures"
              payload: { code: "LIPO01", name: "Liposuction", surgical_fee_cents: 300000, facility_fee_cents: 150000, anesthesia_fee_cents: 100000 }
              as: PracticeAdmin
              captures: { procB: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /patients/${pat1}/clearances"
              payload: { tier_provided: "STANDARD" }
              as: Surgeon
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "both" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procB}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/consents"
              payload: { before_photo_ref: "s3://b/1", photo_consent_signed: true, surgical_consent_signed: true }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/deposits"
              payload: { amount_cents: 266000 }
              as: BillingSpecialist
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
