              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Xan Bell", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_xan" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-02-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: PolicyAdmin
              captures: { pv: $.data.version }
            - call: "POST /policy-loans"
              payload: { policy_id: "${policy_id}", expected_policy_version: "${pv}", principal_cents: 20000 }
              as: PolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-05-02T00:00:00Z" }
              as: PolicyAdmin
          trigger:
            - call: "POST /policy-loans/${loan_id}/repay"
              payload: { amount_cents: 20395 }
              as: PolicyAdmin
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: PolicyAdmin
              captures: { net_cv: $.data.net_cash_value_cents, gross_cv: $.data.gross_cash_value_cents, olb: $.data.outstanding_loan_balance_cents }
          assert:
