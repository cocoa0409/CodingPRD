# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage)
# task_0464_scuba_dive_certification
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Every active instance's setup_api_calls/trigger conforms to §1.5.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_diver_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Diver, endpoints]
        distinguishing_aspect: "POST /divers with full_name+email returns 201; cert_level=NONE, nitrox_certified=false, medical_status=UNKNOWN, deposit_on_hold_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /divers"
              payload: { full_name: "Dee Fault", email: "dee@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
          assert:
            - "Diver.${diver_id}.cert_level == NONE"
            - "Diver.${diver_id}.nitrox_certified == false"
            - "Diver.${diver_id}.medical_status == UNKNOWN"
            - "Diver.${diver_id}.deposit_on_hold_cents == 0"
            - "Diver.${diver_id}.version == 1"

      - name: get_diver_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Diver, endpoints]
        distinguishing_aspect: "GET /divers/{id} returns the stored diver with matching id and full_name."
        test_recipe:
          setup: ["One diver exists."]
          setup_api_calls:
            - call: "POST /divers"
              payload: { full_name: "Reed Get", email: "reed@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
          trigger:
            - call: "GET /divers/${diver_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "Diver.${diver_id}.full_name == 'Reed Get'"

      - name: list_divers_paginated_envelope
        claim_type: Listing
        grounds: [entities.Diver, endpoints]
        distinguishing_aspect: "GET /divers returns an array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two divers exist."]
          setup_api_calls:
            - call: "POST /divers"
              payload: { full_name: "List A", email: "la@x.com" }
              as: ShopAdmin
            - call: "POST /divers"
              payload: { full_name: "List B", email: "lb@x.com" }
              as: ShopAdmin
          trigger:
            - call: "GET /divers"
              payload: { limit: 1, offset: 0 }
              as: ShopAdmin
          assert:
            - "response_type == array"
            - "response total_count == 2"
            - "response has_more == true"

      - name: get_diver_not_found
        claim_type: Not Found
        grounds: [entities.Diver, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /divers/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /divers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_course_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Course, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /courses missing course_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { title: "No Type", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: course_grants_specialty_default_none
        claim_type: Defaults
        grounds: [entities.Course.fields.grants_specialty]
        distinguishing_aspect: "POST /courses omitting grants_specialty applies default NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { title: "Plain OW", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
          assert:
            - "Course.${course_id}.grants_specialty == NONE"

      - name: session_computed_max_students_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Session.fields.max_students, calculations.instructor_ratio_capacity]
        distinguishing_aspect: "Session.max_students is computed from ratio formula; POOL with 1 assistant => 12 regardless of any client-supplied value."
        test_recipe:
          setup: ["Clock default. A course and an INSTRUCTOR exist."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 1, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Pool Pat", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "POOL", primary_instructor_id: "${inst_id}", assistant_count: 1, starts_at: "2026-07-10T08:00:00Z", ends_at: "2026-07-10T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id }
          assert:
            - "Session.${sess_id}.max_students == 12"

      - name: diver_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Diver]
        distinguishing_aspect: "id, created_at, updated_at, version are server-minted; created_at is ISO 8601 with three fractional digits and version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /divers"
              payload: { full_name: "Sys Field", email: "sys@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
          assert:
            - "Diver.${diver_id}.version == 1"
            - "Diver.${diver_id}.created_at is present and ISO 8601"

      - name: instructor_invalid_rating_enum
        claim_type: Type Constraints
        grounds: [entities.Instructor.fields.rating, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /instructors with rating='MASTER' (not in {DIVEMASTER,INSTRUCTOR}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instructors"
              payload: { full_name: "Bad Rating", rating: "MASTER" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: session_ends_before_starts_rejected
        claim_type: Type Constraints
        grounds: [entities.Session.fields.starts_at, entities.Session.fields.ends_at, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /sessions with ends_at <= starts_at returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A course and INSTRUCTOR exist."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Order Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-07-01T12:00:00Z", ends_at: "2026-07-01T11:00:00Z" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: certification_card_immutable_no_version
        claim_type: Immutability
        grounds: [entities.CertificationCard]
        distinguishing_aspect: "CertificationCard has common_fields:false — no version field, no update endpoint; only created via issue-certification and read via list."
        test_recipe:
          setup: ["A COMPLETED enrollment that issued a card."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Card Carl", email: "carl@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /instructors"
              payload: { full_name: "Cert Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/elearning-progress"
              payload: { elearning_pct: 100 }
              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /session-bookings/${sb_id}/attend"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /enrollments/${enr_id}/recompute-eligibility"
              payload: {}
              as: ShopAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /enrollments/${enr_id}/issue-certification"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ShopAdmin
          trigger:
            - call: "GET /certification-cards"
              payload: { diver_id: "${diver_id}" }
              as: ShopAdmin
          assert:
            - "exactly one CertificationCard listed for diver ${diver_id} with level=OPEN_WATER, specialty=NONE"

      - name: enrollment_wrong_course_parent_not_found
        claim_type: Parent Relationships
        grounds: [entities.Enrollment.fields.course_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /enrollments referencing a non-existent course_id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["One diver exists; no course with the supplied id."]
          setup_api_calls:
            - call: "POST /divers"
              payload: { full_name: "Orphan Olive", email: "oo@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "00000000-0000-0000-0000-000000000000" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

      - name: flat_fk_filtered_list_enrollment_by_diver
        claim_type: Foreign key references validated
        grounds: [entities.Enrollment.fields.diver_id, endpoints]
        distinguishing_aspect: "Flat topology FK reverse-reachability: GET /enrollments?diver_id={id} returns the diver's enrollments as an array."
        test_recipe:
          setup: ["One diver with one enrollment."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Filt Fran", email: "fran@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
          trigger:
            - call: "GET /enrollments"
              payload: { diver_id: "${diver_id}" }
              as: ShopAdmin
          assert:
            - "response_type == array containing enrollment ${enr_id}"
            - "response total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: enrollment_starts_active
        claim_type: Initial State
        grounds: [state_machines.Enrollment]
        distinguishing_aspect: "A newly created enrollment has status ACTIVE."
        test_recipe:
          setup: ["A course and a diver exist."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Init Ida", email: "ida@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.status == ACTIVE"

      - name: cancel_already_cancelled_session_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Session.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a CANCELLED session returns ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup: ["A SCHEDULED session that has been CANCELLED."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Term Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-07-01T08:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/cancel"
              payload: {}
              as: ShopAdmin
          trigger:
            - call: "POST /sessions/${sess_id}/cancel"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: complete_session_before_start_invalid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Session.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a session before current clock >= starts_at fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-06-01T00:00:00Z. A SCHEDULED session that starts later (2026-07-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Early Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-07-01T08:00:00Z", ends_at: "2026-07-01T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: terminal_completed_enrollment_no_withdraw
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Enrollment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing a COMPLETED enrollment fails with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["A COMPLETED enrollment (card issued)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Done Dora", email: "dora@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /instructors"
              payload: { full_name: "Term2 Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/elearning-progress"
              payload: { elearning_pct: 100 }
              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /session-bookings/${sb_id}/attend"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /enrollments/${enr_id}/recompute-eligibility"
              payload: {}
              as: ShopAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /enrollments/${enr_id}/issue-certification"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ShopAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: enrollment_withdraw_cancels_booked_sessions
        claim_type: Side Effect Execution
        grounds: [state_machines.Enrollment.ACTIVE_to_WITHDRAWN, state_machines.SessionBooking.BOOKED_to_CANCELLED]
        distinguishing_aspect: "Withdrawing an enrollment cancels its BOOKED session bookings and releases the session seat (cascade down)."
        test_recipe:
          setup: ["An ACTIVE enrollment with one BOOKED session booking on a session with confirmed_seats 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "Wd Will", email: "will@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /instructors"
              payload: { full_name: "Side Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-10T08:00:00Z", ends_at: "2026-06-10T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: ShopAdmin
            - call: "GET /session-bookings/${sb_id}"
              payload: {}
              as: ShopAdmin
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "Enrollment.${enr_id}.status == WITHDRAWN"
            - "SessionBooking.${sb_id}.status == CANCELLED"
            - "Session.${sess_id}.confirmed_seats == 0"

      - name: session_complete_marks_unattended_no_show
        claim_type: Side Effect Execution
        grounds: [state_machines.Session.SCHEDULED_to_COMPLETED, state_machines.SessionBooking.BOOKED_to_NO_SHOW]
        distinguishing_aspect: "Completing a session turns its still-BOOKED bookings to NO_SHOW and releases their seats."
        test_recipe:
          setup: ["A SCHEDULED OW session (start time passed) with one BOOKED, never-attended booking."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /divers"
              payload: { full_name: "NoShow Nan", email: "nan@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
