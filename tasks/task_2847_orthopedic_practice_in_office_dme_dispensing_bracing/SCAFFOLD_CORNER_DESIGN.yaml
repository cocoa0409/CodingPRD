            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Umi Stroud", npi: "1700000461", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_a_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Nia Frost", dob: "1958-07-07", payer_type: "COMMERCIAL", member_id: "CM-461", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { product_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_id}", product_id: "${product_id}", ordering_physician_id: "${phys_a_id}", quantity: 1 }
              as: OrthoPhysician
              as_user_id: "${phys_a_id}"
              captures: { enc_id: $.data.id }
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M54.50", mn_functional_deficit: "lumbar instability limiting ambulation", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_a_id}"
              captures: { enc_v_documented: $.data.version, enc_clinical_documented: $.data.clinical_status }
          trigger:
            - call: "POST /dme/encounters/${enc_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_a_id}"
              captures: { err_self: $.data.error_id }
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { after_denial_attested_at: $.data.ioas_attested_at, after_denial_attester: $.data.ioas_attesting_physician_id, after_denial_version: $.data.version }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Vito Ames", npi: "1700000462", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_b_id: $.data.id }
            - call: "POST /dme/encounters/${enc_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "GENERAL" }
              as: OrthoPhysician
              as_user_id: "${phys_b_id}"
              captures: { ok_attester: $.data.ioas_attesting_physician_id, ok_level: $.data.ioas_supervision_level_observed, ok_attested_at: $.data.ioas_attested_at, ok_version: $.data.version }
            - call: "POST /dme/encounters/${enc_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_b_id}"
              captures: { re_attester: $.data.ioas_attesting_physician_id, re_level: $.data.ioas_supervision_level_observed, re_version: $.data.version }
            - call: "POST /dme/encounters/${enc_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_a_id}"
              captures: { err_self_again: $.data.error_id }
          assert:
            - "${enc_clinical_documented} == DOCUMENTED and ${enc_v_documented} == 2 before any attestation"
            - "${err_self} == ERR_SEGREGATION_OF_DUTIES with HTTP 409: the ordering physician is refused even though the role, the clinic and the payload are all correct"
            - "${after_denial_attested_at} == null, ${after_denial_attester} == null and ${after_denial_version} == ${enc_v_documented}: the refusal wrote nothing and did not bump the version"
            - "the second physician's attestation succeeds with ${ok_attester} == ${phys_b_id}, ${ok_level} == GENERAL, ${ok_attested_at} == 2026-08-01T00:00:00Z and ${ok_version} == 3"
            - "re-attestation by the SAME second physician succeeds: ${re_attester} == ${phys_b_id}, ${re_level} == DIRECT and ${re_version} == 4, so the observed level can be corrected while the encounter is still pre-delivery"
            - "${err_self_again} == ERR_SEGREGATION_OF_DUTIES: the rule is evaluated per request against ordering_physician_id and is not satisfied by an earlier valid attestation from someone else"
            - "the encounter's clinical_status is still DOCUMENTED after all four attestation attempts: attestation moves neither dimension"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_stale_par_level_version_on_reservation_rejected
        claim_type: Optimistic Concurrency
        grounds:
          - concurrency_rules.reservation-stale-par-level
          - errors[ERR_STALE_PAR_LEVEL_VERSION]
          - endpoints[POST /dme/encounters/{id}/reservations]
          - entities.ClinicParLevel.version
        distinguishing_aspect: |
          The reservation endpoint guards the shelf, not the encounter, so the
          version a fitter must quote belongs to an entity that is NOT the
          endpoint's own output: the call returns a DispenseEncounter while the
          guarded version lives on ClinicParLevel. That makes the guard easy to
          get wrong in three ways, all pinned here -- a version that was correct
          before someone else's successful reservation is now stale, a version
          from the future is equally invalid because the comparison is equality
          and not "at least", and a fitter's own successful reservation
          invalidates the number they were holding. The shelf must be untouched
          after every refusal.
        test_recipe:
          setup:
            - "one SPINE clinic with a shelf at par_min 1 / par_max 20 holding 3 units"
            - "three encounters (A, B, C) for the same product, each documented and verified as covered, all ready to reserve"
          setup_api_calls:
