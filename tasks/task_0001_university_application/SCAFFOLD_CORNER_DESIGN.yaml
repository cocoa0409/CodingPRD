              payload: { applicant_id: "${applicant_id}", email: "par@x.com", full_name: "Par", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /applicants/${applicant_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { ps_before: $.data.profile_status }
          trigger:
