  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_study_update
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[study-design-update-occ]", "errors[ERR_STALE_STUDY_VERSION]"]
        distinguishing_aspect: "PUT /studies/{id}: first update with the observed version succeeds (version 1 -> 2); a second update replaying the SAME observed version is rejected with ERR_STALE_STUDY_VERSION (412) — two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["study DRAFT (version 1)"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "OCC Co", contact_email: "occ@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Teriyaki", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PUT /sensory-lab/studies/${study_id}", payload: { expected_study_version: "${v1}", product_name: "Teriyaki v2" }, as: SensoryScientist, captures: { v2: $.data.version } }
            - { call: "PUT /sensory-lab/studies/${study_id}", payload: { expected_study_version: "${v1}", product_name: "Teriyaki v3" }, as: SensoryScientist, captures: { err: $.data.error_id } }
          assert:
            - "first PUT: 200, version == 2, product_name == 'Teriyaki v2'"
            - "second PUT with stale expected_study_version == ${v1}: error_id == ERR_STALE_STUDY_VERSION (http 412)"
            - "Study.${study_id}.product_name remains 'Teriyaki v2' (rejected write applied nothing)"

      - name: occ_stale_version_on_recommendation_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[recommendation-create-occ]", "errors[ERR_STALE_STUDY_VERSION]"]
        distinguishing_aspect: "POST /date-code-recommendations bumps Study.version (create-with-supersede semantics); a second create replaying the pre-first-create version is rejected 412, and the first PROPOSED recommendation is left untouched (no supersede fired by the rejected write)."
        test_recipe:
          setup: ["study ANALYSIS (tp0 SKIPPED); version captured before any recommendation exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "OCC2 Co", contact_email: "occ2@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Hoisin", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "GET /sensory-lab/studies/${study_id}", payload: {}, as: SensoryScientist, captures: { v_pre: $.data.version } }
          trigger:
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_id}", arm_id: "${arm_id}", expected_study_version: "${v_pre}" }, as: SensoryScientist, captures: { rec1: $.data.id } }
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_id}", arm_id: "${arm_id}", expected_study_version: "${v_pre}" }, as: SensoryScientist, captures: { err: $.data.error_id } }
          assert:
            - "first create: 201, DateCodeRecommendation.${rec1}.status == PROPOSED, computed_days == 42 (fallback from target 60)"
            - "second create with the same (now stale) version: error_id == ERR_STALE_STUDY_VERSION (http 412)"
            - "DateCodeRecommendation.${rec1}.status remains PROPOSED (rejected write did not supersede it)"

      - name: clock_default_is_2026_08_01
        claim_type: scheduled_actions
        grounds: ["endpoints[POST /_clock/set_current_utc]", entities.Study.fields.actual_start_utc]
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: a study activated with no clock interaction gets actual_start_utc == 2026-08-01T00:00:00Z (deterministic default, no wall-clock leak)."
        test_recipe:
          setup: ["study SCHEDULED (1 control arm, tp0); client topped up 100; NO clock endpoint call anywhere in the chain"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "Clock Co", contact_email: "clock@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Oyster Sauce", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist, captures: { start: $.data.actual_start_utc } }
          assert:
            - "Study.${study_id}.actual_start_utc == 2026-08-01T00:00:00Z (the pinned default, not wall-clock)"
            - "Study.${study_id}.status == IN_PROGRESS"

      - name: retain_sweep_strict_expiry_boundary
        claim_type: scheduled_actions
        grounds: [state_machines.SampleUnit.STORED_to_EXPIRED, "endpoints[POST /sensory-lab/retain-sweeps]"]
        distinguishing_aspect: "Expiry uses a STRICT less-than against the clock: at retention_until - 1s and at exactly retention_until the sweep expires nothing; at +1s the RETAIN unit flips to EXPIRED and chamber reserved_units decrements."
        test_recipe:
          setup:
            - "study COMPLETED at clock 2026-08-01T00:00:00Z (full chain: activate, pull 1 EVALUATION + 1 RETAIN at tp0, skip tp0 discarding only the EVALUATION unit, close, rec accepted, report released with no claims); the RETAIN unit has retention_until_utc == 2026-10-30T00:00:00Z"
            - "chamber reserved_units == 1 (the RETAIN unit)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Ret Co", contact_email: "ret@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
