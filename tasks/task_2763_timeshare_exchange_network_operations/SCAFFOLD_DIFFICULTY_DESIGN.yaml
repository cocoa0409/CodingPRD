              captures: { dep: "$.data.id" }
            - call: "POST /exchange-network/disputes"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", subject_type: "TRADING_POWER", narrative: "The trading power awarded for this GOLD week is below the published schedule.", deposit_id: "${dep}" }
              captures: { disp: "$.data.id" }
            - call: "POST /exchange-network/disputes/${disp}/review"
