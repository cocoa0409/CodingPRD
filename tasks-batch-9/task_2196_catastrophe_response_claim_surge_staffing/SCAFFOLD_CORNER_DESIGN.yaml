              as_user_id: "dc_1"
          assert:
            - "${sev} == 38.00 and ${adv_status} == VOIDED and ${adv_voided_at} == 2026-08-01T00:00:00.000Z"
            - "trigger call 1 response HTTP status == 409 and response.data.error_id == ERR_CLAIM_NOT_IN_INTAKE"
            - "trigger call 2 response HTTP status == 409 and response.data.error_id == ERR_ADVANCE_NOT_ISSUED"
            - "trigger call 3 response HTTP status == 409 and response.data.error_id == ERR_HOUSING_NOT_PENDING"
            - "Claim.${cl}.severity_score == ${sev} and deadline_utc == ${deadline} and version == ${cl_v_before}"
            - "Claim.${cl}.handling_status == TRIAGED and payment_status == NONE"
            - "Claim.${cl}.case_reserve == 22500.00 and paid_amount == 0.00 and advance_paid_total == 0.00"
            - "Claim.${cl}.advance_issuing_examiner_user_id == ce_1   # retained through the void and through the replay"
            - "GET /reserve-entries?claim_id=${cl} returns meta.total_count == 3 with entry_type INITIAL_CASE, PAYMENT, REVERSAL and sequence_no 1, 2, 3 — no fourth row"
            - "GET /advance-payments?claim_id=${cl} returns meta.total_count == 1 and row 0 voided_at_utc == ${adv_voided_at}"
            - "CatastropheEvent.${ev}.incurred_total == 22500.00 and case_reserve_total == 22500.00 and paid_total == 0.00"
            - "HousingBlock.${hb}.status == ACTIVE and rooms_available == 2 and rooms_occupied == 0"

      - name: corner_sm_side_effect_execution_no_access_reresolves_mode_without_a_revision
        claim_type: side_effect_execution
        grounds:
          - state_machines.InspectionAssignment.IN_PROGRESS_to_NO_ACCESS
          - state_machines.Claim.INSPECTION_PENDING_to_INSPECTED
          - calculations.inspection_mode_resolution
          - endpoints[POST /inspection-assignments/{assignmentId}/report-no-access]
        distinguishing_aspect: |
          report-no-access fires the scaffold's densest single-call side-effect set, and its distinguishing
          feature is a NEGATIVE one: the claim reaches INSPECTED with verified_damage_amount left null and
          NO REVISION ReserveEntry appended, so the ledger depth and every money field must be byte-identical
          to the pre-call state. At the same time access_status flips to INACCESSIBLE and inspection_mode is
          RE-RESOLVED from FIELD to DESK (tier STANDARD is not in {COMPLEX, CAT_SEVERE}, so the aerial branch
          is not taken), while severity_score is NOT recomputed because that only happens at triage/reopen.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-09-02T08:00:00Z so the assignment window has opened."
            - "One DECLARED CatastropheEvent 'CAT-2026-1107' (HAIL, TX, expected_severity_index 0.0000)."
            - "One STAFF Adjuster licensed in [TX], license_expiry 2027-06-30 (credential VALID)."
            - "One cat-coded Claim triaged to STANDARD: severity 38.00, inspection_mode FIELD (40000 > 10000.00), case_reserve 22500.00, ReserveEntry #1 only."
            - "A CONFIRMED FIELD Deployment 2026-09-01 -> 2026-09-10 (no housing block) and a SCHEDULED FIELD InspectionAssignment 2026-09-02 -> 2026-09-03, started to IN_PROGRESS."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1107", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 400, avg_insured_value: 150000, expected_severity_index: 0.0000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "No Access Nate", employment_type: "STAFF", home_state: "TX", licensed_states: ["TX"], license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 8, daily_rate: 600, per_diem_rate: 80, desk_certified: true, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /claims"
              payload: { policy_number: "POL-1107A", loss_state: "TX", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 40000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 0, estimated_damage_amount: 50000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { sev: $.data.severity_score, mode_before: $.data.inspection_mode, access_before: $.data.access_status, reserve_before: $.data.case_reserve }
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "FIELD", window_start_utc: "2026-09-01T00:00:00.000Z", window_end_utc: "2026-09-10T00:00:00.000Z", adjuster_id: "${adj}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { dep: $.data.id }
            - call: "POST /deployments/${dep}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /inspection-assignments"
              payload: { claim_id: "${cl}", mode: "FIELD", window_start_utc: "2026-09-02T00:00:00.000Z", window_end_utc: "2026-09-03T00:00:00.000Z", adjuster_id: "${adj}", deployment_id: "${dep}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { asg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T08:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /inspection-assignments/${asg}/start"
              payload: {}
              as: Adjuster
              as_user_id: "${adj}"
              captures: { asg_status_started: $.data.status }
          trigger:
            - call: "POST /inspection-assignments/${asg}/report-no-access"
              payload: {}
              as: Adjuster
              as_user_id: "${adj}"
          assert:
            - "${sev} == 38.00 and ${mode_before} == FIELD and ${access_before} == ACCESSIBLE and ${reserve_before} == 22500.00 and ${asg_status_started} == IN_PROGRESS"
            - "response HTTP status == 200"
            - "response.data.status == NO_ACCESS"
            - "response.data.report_submitted_at_utc == 2026-09-02T08:00:00.000Z"
            - "response.data.verified_damage_amount == null"
            - "Claim.${cl}.access_status == INACCESSIBLE"
            - "Claim.${cl}.inspection_mode == DESK   # INACCESSIBLE + STANDARD -> DESK; the AERIAL branch needs COMPLEX or CAT_SEVERE"
            - "Claim.${cl}.handling_status == INSPECTED and Claim.${cl}.verified_damage_amount == null"
            - "Claim.${cl}.severity_score == ${sev} and triage_tier == STANDARD   # severity is stamped at triage/reopen only, never re-derived here"
            - "Claim.${cl}.case_reserve == ${reserve_before}"
            - "GET /reserve-entries?claim_id=${cl} returns meta.total_count == 1 with entry_type == INITIAL_CASE — NO REVISION row was appended"
            - "CatastropheEvent.${ev}.case_reserve_total == 22500.00 and incurred_total == 22500.00 and paid_total == 0.00"
            - "Adjuster.${adj}.open_assignment_count == 0 and surge_capacity_score == 100.00"
            - "GET /inspection-assignments?claim_id=${cl}&status=NO_ACCESS returns meta.total_count == 1 with id ${asg}"

      - name: corner_sm_parallel_dimensions_handling_and_payment_axes
        claim_type: parallel_dimensions
        grounds:
          - state_machines.Claim.handling_status
          - state_machines.Claim.payment_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / claim_handling_and_payment_axes_evolve_independently"
          rationale: |
            That instance already drives the two axes of one Claim row through four interleaved combinations
            (TRIAGED+ADVANCE_ISSUED, INSPECTION_PENDING+ADVANCE_ISSUED, INSPECTED+PARTIAL_PAID,
            CLOSED+SETTLED) and asserts after every hop that neither axis gated the other. A corner-level
            re-test would be a strict subset of those assertions.

      - name: corner_sm_cyclic_loop_back_credential_axis
        claim_type: cyclic_loop_back
        grounds:
          - state_machines.Adjuster.credential_status
        excluded_because:
          difficulty_instance: "non_linear_state_machine / adjuster_credential_axis_cycles_expired_waived_expired"
          rationale: |
            The cycle EXPIRED -> WAIVED -> EXPIRED is walked twice there, with surge_capacity_score
            re-derived at each visit (0.00 under the 100-point EXPIRED penalty, 92.00 under the 8-point
            WAIVED penalty) to prove the loop returns to the same state without accumulating drift.

      - name: corner_sm_branching_fork_paths_event_close
        claim_type: branching_fork_paths
        grounds:
          - state_machines.CatastropheEvent.DECLARED_to_CLOSED
          - state_machines.CatastropheEvent.DEMOBILIZING_to_CLOSED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / event_close_branch_standdown_vs_demobilizing_divergent_side_effects"
          rationale: |
            Both outgoing CLOSED branches are exercised on two sibling events from the same trigger path
            there, with the divergent side-effect sets compared field by field (vendor deactivation and the
            transfer-batch gate fire only on the DEMOBILIZING branch, housing release fires on both).

      - name: corner_sm_guarded_transitions_deployment_confirm
        claim_type: guarded_transitions
        grounds:
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
          - validations[priority=19]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / deployment_confirm_gated_by_adjuster_resting_axis"
          rationale: |
            The guard is tested from both sides there: the same confirm call is refused with
            ERR_ADJUSTER_NOT_AVAILABLE while the adjuster's parallel deployment axis reads RESTING at +6h,
            and accepted once the rest window closes at exactly +12h, with nothing but the clock changing.

      - name: corner_sm_cascade_down_demobilize_chain
        claim_type: cascade_down
        grounds:
          - cascades.demobilize_deployment_chain
        excluded_because:
          difficulty_instance: "transitive_cascade / demobilize_deployment_chain_depth5_end_to_end"
          rationale: |
            All five links are asserted end to end there — deployment DEMOBILIZED, rooms returned with the
            block flipping EXHAUSTED -> ACTIVE, assignments cancelled, the claim regressed
            INSPECTION_PENDING -> TRIAGED and the event's posture recomputed — from a single API call.

      - name: corner_sm_compensation_void_advance_chain
        claim_type: compensation
        grounds:
          - cascades.void_advance_chain
        excluded_because:
          difficulty_instance: "transitive_cascade / void_advance_chain_depth4_end_to_end"
          rationale: |
            The compensating shape (REVERSAL entry, payment axis returning to NONE, snapshots staling, posture
            recompute) is walked link by link there from one void call, including the deliberate retention of
            advance_issuing_examiner_user_id.

      - name: corner_sm_ledger_sync_reserve_roll_ups
        claim_type: ledger_sync
        grounds:
          - state_machines.Claim.NONE_to_ADVANCE_ISSUED
          - calculations.reserve_conservation_invariant
        excluded_because:
          difficulty_instance: "compensating_invariant / incurred_dollars_conserved_across_advance_issue_then_void"
          rationale: |
            Ledger-to-aggregate synchronisation is the whole point of that instance: incurred_total is
            re-derived from the ReserveEntry rows at three checkpoints and must read 33750.00 at every one,
            with case_reserve and paid_amount moving in equal and opposite directions.

      - name: corner_sm_conditional_cascade_room_return_on_cancel
        claim_type: conditional_cascade
        grounds:
          - cascades.cancel_deployment_chain
          - state_machines.HousingBlock.EXHAUSTED_to_ACTIVE
        excluded_because:
          difficulty_instance: "compensating_invariant / physical_rooms_conserved_across_confirm_then_cancel"
          rationale: |
            The conditionality is exactly what that instance pins down: rooms are returned only for a
            deployment that had actually drawn them (CONFIRMED/ON_SITE), while a REQUESTED deployment
            cancelled by the same path returns nothing, and rooms_total == available + occupied holds at
            every checkpoint.
# §1.9 Scaffold Corner Design — PART A (sections: calculations, validations)
# Task 2196 — Catastrophe Response & Claim Surge Staffing
# Clock startup default is exactly 2026-08-01T00:00:00.000Z (§1.5 POST /_clock/set_current_utc).
# Every formula-derived literal below was computed with the §1.3 constants and the
# declared rounding order (round_half_up, clamp-before-round where declared).
  - section: calculations
    instances:
      - name: corner_calc_event_posture_restricted_at_strain_exactly_three
        claim_type: constants_applied
        grounds:
          - calculations.event_posture_recompute
          - entities.CatastropheEvent.fields.posture
          - entities.LossEstimateSnapshot.fields.stale
        distinguishing_aspect: "A single stale latest snapshot contributes exactly 3 strain, which equals RESTRICTED_STRAIN_THRESHOLD, so posture is RESTRICTED and not OPEN even though no severe claim is unassigned and no moratorium is in force."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00.000Z startup default throughout."
            - "One CatastropheEvent 'CAT-2026-201' (HURRICANE, FL, exposure_count 1000, avg_insured_value 250000, expected_severity_index 0.0400) in DECLARED."
            - "One Claim on the event still in INTAKE, and one EXPOSURE_BASED LossEstimateSnapshot whose input_reserve_sequence_high_water is 0 (no ReserveEntry exists yet), stale == false, so pre-trigger strain is 0 and posture is OPEN."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-201", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.0400 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-201", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 120000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 5000, estimated_damage_amount: 150000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v1: $.data.version }
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v1}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { snap: $.data.id }
          trigger:
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "Claim.${cl}.severity_score == 35.30"
            - "Claim.${cl}.triage_tier == STANDARD"
            - "Claim.${cl}.case_reserve == 65250.00"
            - "LossEstimateSnapshot.${snap}.input_reserve_sequence_high_water == 0"
            - "LossEstimateSnapshot.${snap}.stale == true"
            - "CatastropheEvent.${ev}.posture == RESTRICTED"
            - "CatastropheEvent.${ev}.incurred_total == 65250.00"

      - name: corner_calc_event_posture_frozen_at_strain_exactly_eight
        claim_type: constants_applied
        grounds:
          - calculations.event_posture_recompute
          - entities.CatastropheEvent.fields.posture
          - entities.CatastropheEvent.fields.moratorium_active
        distinguishing_aspect: "One unassigned COMPLEX claim (1) plus a stale latest snapshot (3) plus an EFFECTIVE CANCELLATION_MORATORIUM (4) sum to exactly 8 strain, which equals FROZEN_STRAIN_THRESHOLD, so posture is FROZEN while the event's status is still DECLARED."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00.000Z startup default throughout."
            - "One CatastropheEvent 'CAT-2026-202' (HURRICANE, FL) in DECLARED."
            - "One CANCELLATION_MORATORIUM RegulatoryBulletin on the event, jurisdiction FL, window 2026-08-01T00:00:00.000Z (inclusive) to 2026-12-01T00:00:00.000Z (exclusive), status EFFECTIVE, so moratorium_active is true and pre-trigger strain is 4 (posture RESTRICTED, not FROZEN, which is what lets the triage through)."
            - "One EXPOSURE_BASED LossEstimateSnapshot with input_reserve_sequence_high_water 0 and stale == false, and one Claim on the event in INTAKE whose triage will land tier COMPLEX."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-202", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.0400 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /regulatory-bulletins"
              payload: { event_id: "${ev}", bulletin_number: "FL-2026-M1", jurisdiction_state: "FL", bulletin_type: "CANCELLATION_MORATORIUM", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-12-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { bul: $.data.id }
            - call: "POST /regulatory-bulletins/${bul}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-202", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 180000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 5000, estimated_damage_amount: 300000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v1: $.data.version }
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v1}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { snap: $.data.id }
          trigger:
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "Claim.${cl}.severity_score == 52.55"
            - "Claim.${cl}.triage_tier == COMPLEX"
            - "Claim.${cl}.handling_status == TRIAGED"
            - "Claim.${cl}.case_reserve == 191750.00"
            - "CatastropheEvent.${ev}.moratorium_active == true"
            - "LossEstimateSnapshot.${snap}.stale == true"
            - "CatastropheEvent.${ev}.status == DECLARED"
            - "CatastropheEvent.${ev}.posture == FROZEN"

      - name: corner_calc_event_posture_only_latest_snapshot_stale_flag_counts
        claim_type: input_set_filtering
        grounds:
          - calculations.event_posture_recompute
          - entities.LossEstimateSnapshot.fields.stale
          - entities.LossEstimateSnapshot.fields.computed_at_utc
          - entities.CatastropheEvent.fields.gross_loss_estimate
        distinguishing_aspect: "With an older stale snapshot and a newer fresh snapshot on the same event, stale_flag is 0 because only the greatest-computed_at_utc snapshot is read, so posture stays OPEN instead of RESTRICTED."
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00.000Z and is advanced once to 2026-08-02T00:00:00.000Z so the two snapshots have strictly ordered computed_at_utc values."
            - "One CatastropheEvent 'CAT-2026-203' (HURRICANE, FL, exposure_count 1000, avg_insured_value 250000, expected_severity_index 0.0400) in DECLARED."
            - "One Claim TRIAGED at tier STANDARD (INITIAL_CASE ReserveEntry sequence_no 1, 65250.00), then snapshot A taken at high-water 1, then a manual REVISION ReserveEntry of +100.00 at sequence_no 2 which stales snapshot A, then snapshot B taken at high-water 2."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-203", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.0400 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-203", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 120000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 5000, estimated_damage_amount: 150000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v1: $.data.version }
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v1}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { snap_a: $.data.id }
            - call: "GET /claims/${cl}"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl_v1: $.data.version }
            - call: "POST /claims/${cl}/reserve-entries"
              payload: { expected_claim_version: "${cl_v1}", entry_type: "REVISION", delta_case_reserve: 100.00, delta_paid: 0.00, memo: "manual uplift" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v2: $.data.version }
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v2}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { snap_b: $.data.id }
          assert:
            - "LossEstimateSnapshot.${snap_a}.input_reserve_sequence_high_water == 1"
            - "LossEstimateSnapshot.${snap_a}.stale == true"
            - "LossEstimateSnapshot.${snap_b}.input_reserve_sequence_high_water == 2"
            - "LossEstimateSnapshot.${snap_b}.stale == false"
            - "LossEstimateSnapshot.${snap_b}.computed_at_utc == 2026-08-02T00:00:00.000Z"
            - "LossEstimateSnapshot.${snap_b}.reported_component == 65350.00"
            - "LossEstimateSnapshot.${snap_b}.ibnr_component == 13934650.00"
            - "LossEstimateSnapshot.${snap_b}.gross_estimate == 14000000.00"
