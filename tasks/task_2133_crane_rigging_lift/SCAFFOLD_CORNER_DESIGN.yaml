  - section: consistency_model
    instances:

      - name: cascade_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.RiggingGear.SERVICEABLE_to_QUARANTINED", "entities.RiggingGear.fields.committed_assignment_count"]
        distinguishing_aspect: "consistency_model is `immediate`: the FAIL inspection's own 201 response already shows resulting_status QUARANTINED, and an immediately following read of the gear shows committed_assignment_count 0 with no settling delay or second request needed."
        test_recipe:
          setup: ["A SURVEYED plan holds one ACTIVE assignment of a SERVICEABLE sling."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 3500 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-9900", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 3500, access_notes: "apron", mat_inventory_available: true }
              as: Dispatcher
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-5001", gear_type: "SLING", rated_wll_lb: 30000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "acceptance" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_v: $.data.version }
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 4, sling_angle_deg: 60, expected_gear_version: "${gear_v}" }
              as: Dispatcher
              captures: { ga_id: $.data.id }
          trigger:
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "FAIL", inspector_note: "core protrusion" }
              as: SafetyManager
              captures: { res: $.data.resulting_status }
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: SafetyManager
              captures: { st: $.data.status, cac: $.data.committed_assignment_count }
            - call: "GET /gear-assignments"
              payload: { gear_id: "${gear_id}", status: "VOIDED" }
              as: Dispatcher
              captures: { voided_id: "$.data[0].id" }
          assert:
            - "${res} == QUARANTINED   (visible in the inspection's own response body)"
            - "${st} == QUARANTINED and ${cac} == 0"
            - "${voided_id} == ${ga_id} and total_count == 1"
            - "GET /gear-assignments?lift_plan_id=${plan_id}&status=ACTIVE returns an empty array with total_count 0"
