            - "Second trigger call: HTTP status == 400 with response.data.error_id == \"ERR_INVALID_REQUEST\"; the caller cannot short-circuit the case lifecycle by supplying status"
            - "GET /ei/children/${child_id} still reports active_referral_count == 0"

      - name: assessment_requires_an_existing_parent_referral
        claim_type: parent_relationships
        grounds:
          - entities.Assessment.fields.referral_id
          - validations[priority 6 -> ERR_REFERRAL_NOT_FOUND]
          - endpoints[POST /ei/assessments]
        distinguishing_aspect: |
          Body-level FK resolution on a peer collection: Assessment declares
          `referral_id` as `FK -> Referral.id`, so an unknown value fails with
          ERR_REFERRAL_NOT_FOUND at priority 6 — before the domain-completeness rule at priority 34
          that the same body would also violate (only four domains are listed).
        test_recipe:
          setup:
            - "Logical clock parked at 2026-03-02T09:00:00Z; no referrals exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/assessments"
              payload: { referral_id: "9f0c7a52-6b1e-4c8d-9a3f-0000000000c1", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL"] }
              as: Evaluator
          assert:
            - "HTTP status == 404 with response.data.error_id == \"ERR_REFERRAL_NOT_FOUND\", NOT ERR_EVALUATION_DOMAINS_INCOMPLETE, because existence (priority 6) precedes business safety (priority 34)"
            - "GET /ei/assessments?referral_id=9f0c7a52-6b1e-4c8d-9a3f-0000000000c1 returns an empty array with total_count == 0"

