              as: CreditAnalyst
              captures: { run_id: $.data.id, v1: $.data.version }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              captures: { v2: $.data.version }
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
              captures: { v3: $.data.version }
          assert:
            - "version sequence: 1 (${v1}) -> 2 (${v2}) -> 3 (${v3})"

      - name: derived_resync_on_evaluation_patch
        claim_type: derived_field_reconciliation
        grounds: [calculations.run_totals, calculations.individual_specific_reserve]
        distinguishing_aspect: "The run's denormalized individual_reserve_cents re-syncs on evaluation mutation: execute snapshots 86000 (COLLATERAL_FAIR_VALUE); after PATCH to DISCOUNTED_CASH_FLOW the run reads 16777 before any review."
        test_recipe:
          setup: ["Run EXECUTED with one DRAFT evaluation (SUBSTANDARD loan 500000, collateral 460000)"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
