      - name: logical_clock_cannot_run_backwards_but_may_be_re_set_to_the_same_instant
        claim_type: Violation → Error
        grounds:
          - validations[priority 60].ERR_CLOCK_NOT_MONOTONIC
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The monotonicity guard is >=, not >, so re-setting the clock to the instant it already holds must succeed while one second earlier must fail — and the failed attempt must not move the clock, which the following successful advance proves."
        test_recipe:
          setup:
            - "The clock starts at its declared default 2026-08-01T00:00:00Z and is advanced once to 2026-09-05T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T11:59:59Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T12:00:01Z" }
              as: PlatformAdmin
          assert:
            - "Rewinding by one second -> 422 ERR_CLOCK_NOT_MONOTONIC"
            - "Re-setting to the identical instant -> 200 (the comparison is >=)"
            - "Advancing by one second -> 200, confirming the clock was never moved by the refused call"

      - name: agency_availability_is_checked_before_agency_capacity_on_note_routing
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 160].ERR_AGENCY_INACTIVE
          - validations[priority 160].ERR_AGENCY_CAPACITY_EXCEEDED
        distinguishing_aspect: "Both clauses sit at priority 160 on the same endpoint, so their relative order has to be pinned explicitly by an agency that is both INACTIVE and already at its open-request cap."
        excluded_because:
          difficulty_instance: fiscal_note_routing_refused_by_agency_status_then_by_agency_open_request_capacity
          rationale: "That §1.8 instance drives an agency to its cap, flips it INACTIVE, shows ERR_AGENCY_INACTIVE outranks ERR_AGENCY_CAPACITY_EXCEEDED on the identical call, then reactivates and shows the capacity error underneath."

      - name: member_intake_hold_is_reported_ahead_of_priority_slot_exhaustion
        claim_type: Priority conflict
        grounds:
          - validations[priority 145].ERR_MEMBER_INTAKE_HOLD
          - validations[priority 170].ERR_PRIORITY_SLOTS_EXHAUSTED
        distinguishing_aspect: "A single POST /drafting-requests can violate priority 145 and priority 170 at once, and the 25-point gap between them is only observable when the member is both held and out of slots."
        excluded_because:
          difficulty_instance: drafting_request_intake_hold_error_outranks_priority_slots_exhausted_error
          rationale: "That §1.8 instance builds a member with clarification_pending_count 2 and zero remaining slots, asserts ERR_MEMBER_INTAKE_HOLD, clears the hold and then asserts ERR_PRIORITY_SLOTS_EXHAUSTED on the identical payload."

      - name: favorable_report_is_refused_while_the_bills_fiscal_status_is_still_pending
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 140].ERR_FISCAL_NOTE_REQUIRED
          - entities.Bill.fields.fiscal_status
        distinguishing_aspect: "The referral is perfectly reportable in its own right; the blocking condition lives entirely on a different entity's state field, and the UNFAVORABLE outcome is exempt from it."
        excluded_because:
          difficulty_instance: favorable_committee_report_blocked_until_the_bills_fiscal_status_reaches_note_complete
          rationale: "That §1.8 instance refuses the FAVORABLE report at NOTE_PENDING, certifies the note to reach NOTE_COMPLETE, reports successfully, and separately shows an UNFAVORABLE report passing straight through the gate."

      - name: zero_appropriation_switches_the_fiscal_note_obligation_off_entirely
        claim_type: Conditional validation
        grounds:
          - entities.Bill.fields.fiscal_status
          - validations[priority 140].ERR_FISCAL_NOTE_REQUIRED
        distinguishing_aspect: "The whole fiscal-note branch of the workflow is switched on by a single cent of requested appropriation, so the conditional must be probed at 0 and at 1 rather than at a plausible dollar figure."
        excluded_because:
          difficulty_instance: bill_introduction_zero_versus_one_cent_appropriation_decides_fiscal_note_obligation
          rationale: "That §1.8 instance introduces two otherwise identical bills at appropriation 0 and 1, asserts fiscal_status NOT_REQUIRED versus NOTE_PENDING, and shows the report path open for one and closed for the other."

      - name: introduction_deadline_error_is_masked_by_the_requests_own_state_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority 100].ERR_INVALID_DRAFTING_REQUEST_STATE
          - validations[priority 150].ERR_INTRODUCTION_DEADLINE_PASSED
        distinguishing_aspect: "Priority 100 and priority 150 are both violated by one POST /bills, and the deadline error can only be exposed once the state error is repaired on a second request that is DRAFT_READY past the deadline."
        excluded_because:
          difficulty_instance: bill_introduction_state_error_outranks_introduction_deadline_error
          rationale: "That §1.8 instance holds one request in DRAFTING and another in DRAFT_READY, advances the clock past introduction_deadline_utc, and asserts ERR_INVALID_DRAFTING_REQUEST_STATE for the first and ERR_INTRODUCTION_DEADLINE_PASSED for the second."

