  - section: state_machines
    instances:
      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - "state_machines.Equipment.approval_status"
          - "state_machines.Inspector.license_status"
          - "state_machines.VesselWatch.status"
          - "state_machines.Appeal.status"
        distinguishing_aspect: "Every state machine's initial_state must be observable straight from the create response: Equipment PENDING_APPROVAL, Inspector PROBATIONARY, FeeSchedule DRAFT, Sample SEALED, VesselWatch SCHEDULED and Appeal FILED — none of them may be pre-advanced by creation side effects."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00Z; one DESIGNATED area, one applicant and one export request with EXPORT_SUPERVISION requested exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T07:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Ocean Grain Traders", account_code: "OGT-100", contact_email: "export@ocean.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1201", full_name: "I. Initial", endorsements: ["SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-INIT", declared_quantity_bushels: 5000, requested_services: ["GRADING", "EXPORT_SUPERVISION"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${insp}/activate
              as: ServiceAdmin
              payload: {}
          trigger:
            - call: POST /grain-inspection/vessel-watches
              as: SupervisingInspector
              payload: { inspection_request_id: "${req}", supervisor_inspector_id: "${insp}", vessel_name: "MV Initial", window_start_at: "2026-08-03T08:00:00Z", window_end_at: "2026-08-03T12:00:00Z", holds_declared: 2 }
              captures: { vw: "$.data.id" }
          assert:
            - "201; status == SCHEDULED, started_at == null, closed_at == null, supervision_minutes == null, stowage_certified == false"
            - "GET /grain-inspection/service-areas/${area} -> open_watch_count == 1 (scheduling occupies capacity immediately)"
            - "The inspector created in setup returned license_status == PROBATIONARY with performance_score 100 and training_hours_completed 0 before any training record"
            - "GET /grain-inspection/inspection-requests/${req} -> grading_status == OPEN, weighing_status == NOT_REQUIRED (WEIGHING was not requested)"

      - name: certificate_cannot_be_issued_before_a_final_grading_result_exists
        claim_type: invalid_transitions
        grounds:
          - "state_machines.InspectionRequest.grading_status.GRADED_to_GRADE_CERTIFIED"
          - "validations[priority=9]"
          - "errors[ERR_GRADING_RESULT_MISSING]"
        distinguishing_aspect: "From grading_status SAMPLED the GRADE-certificate trigger is not a declared transition, so the attempt must fail with ERR_GRADING_RESULT_MISSING and leave the request in SAMPLED — no fee is assessed and no certificate row appears."
        test_recipe:
          setup:
            - "A DELEGATED area with an ACTIVE GRADING schedule, an APPROVED SAMPLING_DEVICE and an inspector holding SAMPLING and GRADING."
            - "A CORN request in grading_status SAMPLED with a SEALED sample of 2 portions and no grading result."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
