            - &b_enroll2
              call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-WI"
                term_start_date: "2026-12-01"
                term_end_date: "2027-02-28"
                credits: 1
                expected_employee_version: "${employee_version_2}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { enrollment_2_id: "$.data.id" }
            - &b_confirm2
              call: "POST /enrollments/${enrollment_2_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - &b_invoices2
              call: "GET /enrollments/${enrollment_2_id}/invoices"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { invoice_2_id: "$.data[0].id" }
            - &b_approve2
              call: "POST /tuition-invoices/${invoice_2_id}/approve-payment"
