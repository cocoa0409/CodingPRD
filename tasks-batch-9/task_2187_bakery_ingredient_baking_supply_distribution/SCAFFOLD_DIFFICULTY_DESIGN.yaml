            - "Order.${order_id}.pricing_status == PROVISIONAL"
            - "Order.${order_id}.total_cents == 620267"
            - "Customer.${cust_id}.open_exposure_cents == 620267"
            - "Customer.${cust_id}.allergen_risk_score == 55.00"
            - "Customer.${cust_id}.risk_tier == AMBER"

      - name: conserved_committed_contract_pounds_short_shipment_returns_the_undelivered_volume
        grounds:
          - calculations.contract_volume_conservation
          - state_machines.Order.LOADED_to_SHORT_SHIPPED
          - entities.ContractLine.fields.volume_drawn_lb
          - entities.Order.fields.short_ship_lb
          - calculations.lot_inventory_conservation
        distinguishing_aspect: |
          Conserved quantity #2 = COMMITTED CONTRACT POUNDS, a different ledger on a different
          entity from instance 1, and the compensation here is PARTIAL rather than total: an order
          drew 20000 lb against a 50000 lb commitment, only 12000 lb are delivered, so exactly the
          8000 shorted pounds must flow back to ContractLine.volume_drawn_lb (20000 -> 12000) AND
          to Lot.quantity_on_hand_lb (30000 -> 38000) while 12000 lb move to quantity_consumed_lb.
          Both ledgers must land on the same 12000/8000 split from a single call.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-05T00:00:00Z; customer Short Drop Bakery ACTIVE, credit_limit_cents 5000000, min_drop_cents 25000."
            - "Flour SKU FLR-HRW-50 (GLUTEN, index HRW_WHEAT, list 42) with lot LOT-FLR-9001 of 50000 lb in OPEN GLUTEN zone; HRW_WHEAT quote 38 c/lb effective 2026-08-01."
            - "ForwardPricingContract 2026-09-01..2026-12-31, ORDER_DATE_INDEX, one ContractLine with volume_committed_lb 50000 and basis 6; offered by am-1, activated by pc-1 (status ACTIVE)."
            - "One BAGGED order on that contract with a single 20000 lb flour line, submitted at 44 c/lb (total_cents 866404) so ContractLine.volume_drawn_lb is 20000 while the contract stays ACTIVE (20000 < 50000), then allocated (lot reserved 20000, on hand 30000)."
            - "Route R-SHORT-01 for 2026-09-15 (capacity 24000) carries the order on window 08:00-10:00, sealed; the clock is advanced to 2026-09-15T00:00:00Z and the route dispatched, so the order is LOADED."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
