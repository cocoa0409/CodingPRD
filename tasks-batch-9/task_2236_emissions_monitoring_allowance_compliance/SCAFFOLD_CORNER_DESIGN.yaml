            - "AllowanceTransaction.${tx_id}.status == PROPOSED — holdings are untouched, AllowanceAccount.${acct_id}.holdings_current_vintage_tons is still 10.000"
            - "Unit.${unit_id}.dispatch_state == OFFLINE"

