# =============================================================================
# Task 1648 — Scaffold Corner Design (§1.9 Coverage Index)
# Breadth probe over every §1.1–§1.7 claim not already covered by §1.8.
# Canonical intake-only setup: clock -> vendor -> household -> application.
# Canonical approvable chain adds: policy+activate, source, documents, submit,
# duplication-check + resolve, GET application, verification + complete, approve.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: household_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Household.fields.annual_income_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /assistance/households without annual_income_cents fails 400 ERR_INVALID_REQUEST; every input field without a default is mandatory."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
          trigger:
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "No Income", address: "1 Nowhere Rd", phone: "555-9001", household_size: 2 }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST and HTTP status 400"

      - name: household_create_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds: ["entities.Household"]
        distinguishing_aspect: "Server mints id/created_at/updated_at/version; a client-supplied id is ignored and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
          trigger:
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Sys Fields", address: "2 Nowhere Rd", phone: "555-9002", household_size: 1, annual_income_cents: 500000, id: "11111111-1111-1111-1111-111111111111" }
              as: Caseworker
              captures: { hh: $.data.id, v: $.data.version }
          assert:
            - "${hh} != 11111111-1111-1111-1111-111111111111 (server-minted)"
            - "${v} == 1 and created_at == 2026-08-01T00:00:00Z (logical clock, three fractional digits ISO8601)"

      - name: policy_defaults_applied_on_create
        claim_type: defaults
        grounds: ["entities.EligibilityPolicy.fields.appeal_window_days", "entities.EligibilityPolicy.fields.require_lease_ledger"]
        distinguishing_aspect: "Omitting the four optional policy fields yields appeal_window_days 30, require_eviction_notice true, require_lease_ledger false, require_utility_bill true."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
          trigger:
            - call: "POST /assistance/policies"
              payload: { name: "Defaults", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
          assert:
            - "EligibilityPolicy.${pol}.appeal_window_days == 30"
            - "EligibilityPolicy.${pol}.require_eviction_notice == true and require_lease_ledger == false and require_utility_bill == true"
            - "EligibilityPolicy.${pol}.status == DRAFT (initial state)"

      - name: application_created_in_intake_with_intake_caseworker_recorded
        claim_type: creation
        grounds: ["entities.AssistanceApplication.fields.intake_caseworker_id", "state_machines.AssistanceApplication"]
        distinguishing_aspect: "New application starts in INTAKE (initial state) with intake_caseworker_id copied from X-User-ID and active_award_id empty."
        test_recipe:
          setup: ["vendor and household exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Init State", address: "3 Nowhere Rd", phone: "555-9003", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-9"
              captures: { app: $.data.id, st: $.data.status, cw: $.data.intake_caseworker_id }
          assert:
            - "${st} == INTAKE and ${cw} == cw-9"
            - "AssistanceApplication.${app}.active_award_id == '' and policy_id == '' (unset until submit)"

      - name: funding_source_computed_balances_input_ignored
        claim_type: computed_fields
        grounds: ["entities.FundingSource.fields.reserved_cents", "entities.FundingSource.fields.available_cents"]
        distinguishing_aspect: "reserved_cents/committed_cents/available_cents are computed: client-sent values are ignored; a fresh source reports reserved 0, committed 0, available == total_budget."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
          trigger:
            - call: "POST /assistance/funding-sources"
              payload: { name: "CF", funder_name: "Funder CF", source_type: "DONOR_UNRESTRICTED", allowed_categories: ["RENT"], period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 70000, max_per_household_cents: 1000000, reserved_cents: 99999 }
              as: ProgramManager
              captures: { src: $.data.id }
          assert:
            - "FundingSource.${src}.reserved_cents == 0 and committed_cents == 0 (client input ignored)"
            - "FundingSource.${src}.available_cents == 70000 and status == ACTIVE"

      - name: case_note_immutable_no_version_and_default_occurred_at
        claim_type: immutability
        grounds: ["entities.CaseNote", "entities.CaseNote.fields.occurred_at"]
        distinguishing_aspect: "CaseNote carries id+created_at only (no version/updated_at); an omitted occurred_at defaults to the logical clock time."
        test_recipe:
          setup: ["application in INTAKE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Note Taker", address: "4 Nowhere Rd", phone: "555-9004", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /assistance/applications/${app}/case-notes"
              payload: { note_type: "GENERAL", body: "initial intake conversation" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { note: $.data.id }
          assert:
            - "CaseNote.${note} response contains no version field (append-only, common_fields false)"
            - "CaseNote.${note}.occurred_at == 2026-08-01T00:00:00Z (defaulted to logical clock)"
            - "CaseNote.${note}.author_id == cw-1"

      - name: follow_up_note_missing_outcome_rejected
        claim_type: type_constraints
        grounds: ["entities.CaseNote.fields.outcome", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "outcome is conditionally required: note_type FOLLOW_UP without outcome fails ERR_INVALID_REQUEST while GENERAL without outcome succeeds."
        test_recipe:
          setup: ["application in INTAKE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Outcome Test", address: "5 Nowhere Rd", phone: "555-9005", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /assistance/applications/${app}/case-notes"
              payload: { note_type: "FOLLOW_UP", body: "called the family" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (FOLLOW_UP requires outcome)"

      - name: application_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Fetching a random UUID returns the 404 error envelope, not an empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
          trigger:
            - call: "GET /assistance/applications/3f4a9b2c-1111-4222-8333-444455556666"
              payload: {}
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND and HTTP status 404"

      - name: application_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds: ["entities.AssistanceApplication.fields.category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category outside {RENT, UTILITY} fails ERR_INVALID_REQUEST at priority 3 before any existence or state check."
        test_recipe:
          setup: ["vendor and household exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Enum Test", address: "6 Nowhere Rd", phone: "555-9006", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "MEDICAL", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: application_fk_to_missing_household_returns_404
        claim_type: parent_relationships
        grounds: ["entities.AssistanceApplication.fields.household_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a well-formed application referencing a non-existent household fails ERR_NOT_FOUND (existence before business rules)."
        test_recipe:
          setup: ["vendor exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /assistance/applications"
              payload: { household_id: "9f4a9b2c-1111-4222-8333-444455556666", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_from_withdrawn_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AssistanceApplication", "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: submit on a withdrawn application fails ERR_INVALID_APPLICATION_STATE and nothing changes."
        test_recipe:
          setup: ["application created then withdrawn while still INTAKE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Term Lock", address: "7 Nowhere Rd", phone: "555-9101", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
            - { call: "POST /assistance/applications/${app}/withdraw", payload: {}, as: Caseworker, as_user_id: "cw-1" }
          trigger:
            - call: "POST /assistance/applications/${app}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_APPLICATION_STATE"
            - "AssistanceApplication.${app}.status == WITHDRAWN (unchanged)"

      - name: approve_from_intake_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.AssistanceApplication", "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "Approve exists only from PENDING_DECISION; from INTAKE it fails ERR_INVALID_APPLICATION_STATE even though every business rule would pass."
        test_recipe:
          setup: ["application in INTAKE with ACTIVE policy and funded source present"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Inv Trans", address: "8 Nowhere Rd", phone: "555-9102", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - { call: "POST /assistance/funding-sources", payload: { name: "GF", funder_name: "First Church", source_type: "DONOR_UNRESTRICTED", allowed_categories: ["RENT", "UTILITY"], period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 100000, max_per_household_cents: 1000000 }, as: ProgramManager }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /assistance/applications/${app}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_APPLICATION_STATE and no award was created"

      - name: verification_complete_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.VendorVerification", "errors[ERR_INVALID_VERIFICATION_STATE]"]
        distinguishing_aspect: "Completing an already-PASSED verification fails ERR_INVALID_VERIFICATION_STATE; terminal states accept no transitions."
        test_recipe:
          setup: ["application UNDER_VERIFICATION; verification completed PASSED once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Ver Twice", address: "9 Nowhere Rd", phone: "555-9103", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
            - { call: "POST /assistance/applications/${app}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/v2.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_v: $.data.version }
            - { call: "POST /assistance/applications/${app}/verifications", payload: { expected_application_version: "${app_v}" }, as: Caseworker, as_user_id: "cw-2", captures: { ver: $.data.id } }
            - { call: "POST /assistance/verifications/${ver}/complete", payload: { outcome: "PASSED", confirmed_amount_cents: 5000 }, as: Caseworker, as_user_id: "cw-2" }
          trigger:
            - call: "POST /assistance/verifications/${ver}/complete"
              payload: { outcome: "FAILED" }
              as: Caseworker
              as_user_id: "cw-2"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_VERIFICATION_STATE"
            - "VendorVerification.${ver}.status == PASSED (unchanged) and application stays PENDING_DECISION"

      - name: duplication_override_on_pending_check_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DuplicationCheck", "errors[ERR_INVALID_DUPLICATION_CHECK_STATE]"]
        distinguishing_aspect: "Override exists only from FLAGGED; overriding a PENDING check fails ERR_INVALID_DUPLICATION_CHECK_STATE."
        test_recipe:
          setup: ["application SUBMITTED with a PENDING duplication check"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Dup State", address: "10 Nowhere Rd", phone: "555-9104", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 5000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
            - { call: "POST /assistance/applications/${app}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/d1.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_v: $.data.version }
            - { call: "POST /assistance/applications/${app}/duplication-checks", payload: { agency_name: "County HHS", expected_application_version: "${app_v}" }, as: Caseworker, as_user_id: "cw-1", captures: { dup: $.data.id } }
          trigger:
            - call: "POST /assistance/duplication-checks/${dup}/override"
              payload: { override_justification: "verified by phone" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_DUPLICATION_CHECK_STATE"

      - name: award_void_with_issued_payment_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.AssistanceAward.ACTIVE_to_VOIDED", "errors[ERR_PAYMENTS_OUTSTANDING]"]
        distinguishing_aspect: "An ISSUED (in-flight) payment blocks void with ERR_PAYMENTS_OUTSTANDING; the payment must be voided or failed first."
        test_recipe:
          setup: ["canonical approved award 20000; one payment 20000 ISSUED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Void Block", address: "11 Nowhere Rd", phone: "555-9105", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "GF", funder_name: "First Church", source_type: "DONOR_UNRESTRICTED", allowed_categories: ["RENT", "UTILITY"], period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 100000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { src: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 20000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
            - { call: "POST /assistance/applications/${app}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/vb.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app}/submit"
              payload: {}
              as: Caseworker
