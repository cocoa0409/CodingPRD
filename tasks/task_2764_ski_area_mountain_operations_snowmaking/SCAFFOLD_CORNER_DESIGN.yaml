      - name: new_snow_at_exactly_twelve_inches_invalidates_the_avalanche_clearance
        claim_type: rate_threshold_triggers
        grounds:
          - endpoints[POST /mountain-ops/day-plans/{id}/weather]
          - validations[priority=27]
          - errors[ERR_MITIGATION_NOT_CURRENT]
          - entities.TerrainArea.fields.mitigation_clearance_expires_at
          - state_machines.AvalancheMitigationMission.EXECUTED_to_CLEARED
        distinguishing_aspect: |
          A weather observation is normally inert on terrain, but at new_snow_in >= 12.0 it silently voids
          every avalanche clearance in the season and drops the cleared areas to PATROL_HOLD. The threshold
          is inclusive, so 11.9 must change nothing at all and 12.0 must fire - and the trap is that the
          firing is a NULLING of a datetime, not a state change on the mission: the mission stays CLEARED
          while the area it cleared is no longer openable. Only a brand new mission can restore the
          clearance, which the last three triggers prove.
