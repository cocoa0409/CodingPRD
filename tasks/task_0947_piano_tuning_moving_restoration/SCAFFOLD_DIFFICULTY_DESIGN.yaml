scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 - dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: warranty_claim_prorated_credit_vs_free_reservice
        grounds:
          - calculations.warranty_claim_resolution
          - entities.WarrantyClaim.fields.resolution_variant
          - entities.WarrantyClaim.fields.credit_cents
          - entities.Warranty.fields.covered_price_cents
          - entities.WarrantyClaim.fields.elapsed_fraction
        distinguishing_aspect: |
          This dual-variant calculation lives on the Warranty / WarrantyClaim domain:
          the SAME warranty and the SAME covered_price_cents produce credit_cents 0
          under FREE_RESERVICE and credit_cents 8666 under PRORATED_CREDIT, selected
          purely by whether elapsed_fraction crosses 0.50.
        test_recipe:
          setup:
            - "One INDIVIDUAL client in ZONE_A with a ZONE_A location and one UPRIGHT instrument assessed at TIER_0."
            - "The client has been funded with 100000 cents of manual credit."
            - "A TUNE service order for 19500 cents has been fully accepted and completed at 2026-05-01, minting an ACTIVE 90-day warranty with covered_price_cents 19500."
            - "The logical clock has been advanced to 2026-06-20, exactly 50 days into the 90-day term."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Harlow Residence", email: "harlow@example.com", phone: "555-0100", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Residence", zone_code: "ZONE_A", address_key: "12-elm-street", distance_miles_from_shop: 8.0, stair_flights: 0, climate_controlled: true }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-D1-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech A", certification_level: "APPRENTICE", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /clients/${cl_id}/credit-adjustments"
              payload: { amount_cents: 100000, memo: "opening funds" }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "TUNE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
            - call: "GET /service-orders/${so_id}/milestones"
              payload: {}
              as: ShopManager
              captures: { ms1_id: "$.data[0].id" }
            - call: "POST /milestones/${ms1_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-release-1"
            - call: "POST /milestones/${ms1_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders/${so_id}/complete"
              payload: {}
              as: ShopManager
            - call: "GET /warranties"
              payload: { instrument_id: "${inst_id}" }
              as: ShopManager
              captures: { w_id: "$.data[0].id", w_v: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty-claims"
              payload: { warranty_id: "${w_id}", reported_issue: "unison drift in the tenor break", expected_warranty_version: "${w_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { claim_id: "$.data.id" }
          assert:
            - "WarrantyClaim.${claim_id}.elapsed_fraction == 0.5556"
            - "WarrantyClaim.${claim_id}.resolution_variant == PRORATED_CREDIT"
            - "WarrantyClaim.${claim_id}.credit_cents == 8666"
            - "Warranty.${w_id}.covered_price_cents == 19500"
            - "Warranty.${w_id}.claim_count == 1"
            - "Client.${cl_id}.account_credit_cents == 89166"
            - "GET /ledger-entries with client_id=${cl_id} and entry_type=WARRANTY_CREDIT returns exactly 1 row whose amount_cents == 8666"
            - "Had the clock been set to 2026-06-14 (44 days, elapsed_fraction 0.4889) instead, the same call would yield resolution_variant FREE_RESERVICE, credit_cents 0 and NO WARRANTY_CREDIT ledger row"

      - name: move_distance_per_mile_vs_long_haul_flat
        grounds:
          - calculations.move_distance_component
          - calculations.move_stair_component
          - calculations.move_pricing
          - entities.MoveJob.fields.distance_variant
          - entities.MoveJob.fields.total_cents
        distinguishing_aspect: |
          This dual-variant calculation lives on the MoveJob domain, not on any
          warranty or service subject: distance_variant PER_MILE charges 420 cents
          per mile while LONG_HAUL_FLAT charges a flat 52000, so the SAME instrument
          moved 151.0 miles over 4 stair flights costs 183000 while the same move at
          150.0 miles over 3 flights costs 196000.
        test_recipe:
          setup:
            - "One client with three ZONE_A locations: origin with 2 stair flights, an alternate origin with 3 stair flights, and a destination with 1 stair flight."
            - "One GRAND instrument sited at the 2-flight origin."
            - "No move jobs exist yet, so no move-window buffer applies to the first create."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Bellwether Hall", email: "hall@example.com", phone: "555-0110", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Origin 2F", zone_code: "ZONE_A", address_key: "40-north-quay", distance_miles_from_shop: 12.0, stair_flights: 2 }
              as: ShopManager
              captures: { loc_o2: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Origin 3F", zone_code: "ZONE_A", address_key: "41-north-quay", distance_miles_from_shop: 12.0, stair_flights: 3 }
              as: ShopManager
              captures: { loc_o3: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Destination", zone_code: "ZONE_A", address_key: "9-abbey-lane", distance_miles_from_shop: 160.0, stair_flights: 1 }
              as: ShopManager
              captures: { loc_d: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_o2}", make: "Steinway", model: "B", serial_number: "SN-D2-0001", instrument_class: "GRAND", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
          trigger:
            - call: "POST /move-jobs"
              payload: { instrument_id: "${inst_id}", origin_location_id: "${loc_o2}", destination_location_id: "${loc_d}", distance_miles: 150.0, scheduled_window_start_utc: "2026-05-10T09:00:00Z", scheduled_window_end_utc: "2026-05-10T11:00:00Z", crane_required: false, climate_controlled_transport: true }
              as: MoveCoordinator
              captures: { mj_a: "$.data.id" }
            - call: "POST /move-jobs"
              payload: { instrument_id: "${inst_id}", origin_location_id: "${loc_o3}", destination_location_id: "${loc_d}", distance_miles: 151.0, scheduled_window_start_utc: "2026-05-20T09:00:00Z", scheduled_window_end_utc: "2026-05-20T11:00:00Z", crane_required: false, climate_controlled_transport: true }
              as: MoveCoordinator
              captures: { mj_b: "$.data.id" }
          assert:
            - "MoveJob.${mj_a}.distance_variant == PER_MILE"
            - "MoveJob.${mj_a}.distance_cents == 63000"
            - "MoveJob.${mj_a}.stair_flights_total == 3"
            - "MoveJob.${mj_a}.stair_cents == 27000"
            - "MoveJob.${mj_a}.total_cents == 196000"
            - "MoveJob.${mj_b}.distance_variant == LONG_HAUL_FLAT"
            - "MoveJob.${mj_b}.distance_cents == 52000"
            - "MoveJob.${mj_b}.stair_flights_total == 4"
            - "MoveJob.${mj_b}.stair_cents == 25000"
            - "MoveJob.${mj_b}.total_cents == 183000"
            - "MoveJob.${mj_b}.total_cents < MoveJob.${mj_a}.total_cents even though every input of B is larger"

  # =========================================================================
  # RULE 2 - combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: quote_per_line_rounding_before_sum
        grounds:
          - calculations.quote_pricing
          - calculations.quote_line_composition
          - entities.Quote.fields.line_discount_cents
          - entities.Quote.fields.subtotal_cents
        distinguishing_aspect: |
          MODE (b) - nested rounding where the ORDER matters. A DEALER TUNE quote on a
          GRAND at TIER_2 carries two lines of 26325 and 12825; rounding each line's
          0.82 net independently and then summing gives 32104, while summing the bases
          and rounding once gives 32103. The scaffold pins per-line-then-sum, so
          subtotal_cents is 36604 and can never be 36603.
        test_recipe:
          setup:
            - "One DEALER client with a ZONE_B location and one GRAND instrument."
            - "The instrument has been assessed at 20.0 cents flat, putting it in TIER_2 with no overdue bump (no tuning recall exists)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Northgate Pianos", email: "trade@example.com", phone: "555-0120", home_zone_code: "ZONE_B", client_type: "DEALER" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Trade Floor", zone_code: "ZONE_B", address_key: "77-market-row", distance_miles_from_shop: 30.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Bosendorfer", model: "185", serial_number: "SN-D3-0001", instrument_class: "GRAND", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: -20.0 }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
          trigger:
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "TUNE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
          assert:
            - "Instrument.${inst_id}.raw_pitch_tier == TIER_2"
            - "Instrument.${inst_id}.pitch_raise_tier == TIER_2"
            - "Quote.${q_id}.line_count == 2"
            - "Quote.${q_id}.pricing_variant == DEALER_NET"
            - "Quote.${q_id}.base_price_cents == 39150"
            - "Quote.${q_id}.line_discount_cents == 7046"
            - "Quote.${q_id}.zone_surcharge_cents == 4500"
            - "Quote.${q_id}.subtotal_cents == 36604"
            - "Quote.${q_id}.loyalty_discount_cents == 0"
            - "Quote.${q_id}.total_cents == 36604"
            - "Quote.${q_id}.subtotal_cents != 36603, which is what sum-then-round would produce"

      - name: loyalty_tier_keyed_on_subtotal_not_on_total
        grounds:
          - calculations.loyalty_discount
          - calculations.quote_pricing
          - calculations.deposit_required
          - entities.Quote.fields.loyalty_discount_cents
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          MODE (c) - a circular-looking dependency whose evaluation order is pinned.
          A REGULATE quote on a GRAND in ZONE_B has subtotal_cents exactly 119250,
          the LOYALTY_TIER_1_MIN_CENTS boundary, so a 3% discount of 3578 applies and
          total_cents is 115672. Keying the tier on total_cents instead would read
          115672, fall below the boundary and yield a discount of 0 - a different,
          self-contradicting answer.
        test_recipe:
          setup:
            - "One INDIVIDUAL client with a ZONE_B location and one GRAND instrument."
            - "The instrument has been assessed and moved to condition_status SERVICEABLE so a REGULATE quote passes the service-ladder prerequisite."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Ivy Conservatory", email: "ivy@example.com", phone: "555-0130", home_zone_code: "ZONE_B", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Recital Room", zone_code: "ZONE_B", address_key: "3-ivy-close", distance_miles_from_shop: 22.0, stair_flights: 1, climate_controlled: true }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Kawai", model: "GX-2", serial_number: "SN-D4-0001", instrument_class: "GRAND", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 1.5 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "assessed and playable" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
          trigger:
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "REGULATE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
          assert:
            - "Quote.${q_id}.line_count == 1"
            - "Quote.${q_id}.base_price_cents == 114750"
            - "Quote.${q_id}.line_discount_cents == 0"
            - "Quote.${q_id}.zone_surcharge_cents == 4500"
            - "Quote.${q_id}.subtotal_cents == 119250"
            - "Quote.${q_id}.loyalty_discount_cents == 3578"
            - "Quote.${q_id}.total_cents == 115672"
            - "Quote.${q_id}.deposit_variant == PERCENT_OF_CONTRACT"
            - "Quote.${q_id}.deposit_required_cents == 28918"
            - "The same instrument quoted from a ZONE_A location would have subtotal_cents 114750 and loyalty_discount_cents 0, proving the boundary is read off the subtotal"

  # =========================================================================
  # RULE 3 - non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: milestone_capped_rejection_loop_on_third_attempt
        grounds:
          - state_machines.Milestone.status.RELEASED_to_REJECTED
          - state_machines.Milestone.status.REJECTED_to_READY
          - entities.Milestone.fields.rejection_count
          - validations[priority=55]
          - errors[ERR_ATTEMPT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          The Milestone machine is non-linear through a CAPPED RETRY LOOP:
          RELEASED -> REJECTED -> READY may be traversed exactly
          MILESTONE_REJECTION_RETRY_LIMIT (2) times, and the third rejection is
          refused while the milestone stays READY - a shape no other entity in this
          scaffold carries.
        test_recipe:
          setup:
            - "One INDIVIDUAL client funded with 200000 cents, one UPRIGHT instrument moved to SERVICEABLE."
            - "A VOICE service order for 42000 cents exists, IN_PROGRESS, with two 21000-cent milestones both READY and a 25000-cent deposit held."
            - "Milestone 1 has already been released and rejected twice, so rejection_count is 2 and its status is READY."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Marlow Studio", email: "marlow@example.com", phone: "555-0140", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Studio", zone_code: "ZONE_A", address_key: "18-marlow-way", distance_miles_from_shop: 6.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U3", serial_number: "SN-D5-0001", instrument_class: "UPRIGHT", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech J", certification_level: "JOURNEYMAN", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /clients/${cl_id}/credit-adjustments"
              payload: { amount_cents: 200000, memo: "opening funds" }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 1.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "playable" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "VOICE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
            - call: "GET /service-orders/${so_id}/milestones"
              payload: {}
              as: ShopManager
              captures: { ms1_id: "$.data[0].id" }
            - call: "POST /milestones/${ms1_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-release-1"
            - call: "POST /milestones/${ms1_id}/reject"
              payload: { reason: "hammer voicing uneven" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /milestones/${ms1_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-release-1"
            - call: "POST /milestones/${ms1_id}/reject"
              payload: { reason: "still uneven" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /milestones/${ms1_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-release-1"
          trigger:
            - call: "POST /milestones/${ms1_id}/reject"
              payload: { reason: "third complaint" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_ATTEMPT_LIMIT_EXCEEDED"
            - "Milestone.${ms1_id}.status == RELEASED (the third rejection did not fire, so the milestone stays where the third release left it)"
            - "Milestone.${ms1_id}.rejection_count == 2"
            - "Milestone.${ms1_id}.released_by_user_id == mgr-release-1"
            - "ServiceOrder.${so_id}.billed_cents == 0"

      - name: instrument_condition_and_custody_axes_advance_independently
        grounds:
          - state_machines.Instrument.condition_status.NEEDS_ASSESSMENT_to_SERVICEABLE
          - state_machines.Instrument.condition_status.SERVICEABLE_to_NEEDS_REGULATION
          - state_machines.Instrument.custody_status.AT_CLIENT_SITE_to_IN_TRANSIT
          - state_machines.Instrument.custody_status.IN_TRANSIT_to_IN_SHOP
          - entities.Instrument.fields.condition_status
          - entities.Instrument.fields.custody_status
        distinguishing_aspect: |
          Instrument carries TWO PARALLEL state dimensions on one row: three custody
          transitions leave condition_status untouched at SERVICEABLE, and a later
          condition transition to NEEDS_REGULATION leaves custody_status untouched at
          IN_SHOP - a parallel shape that belongs to Instrument and to no other entity
          in this scaffold except Appointment.
        test_recipe:
          setup:
            - "One client with two ZONE_A locations (residence and shop-side receiving bay) and one UPRIGHT instrument at the residence."
            - "A move-certified technician exists and a MoveJob has been created and DISPATCHED for that instrument."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Quillon Family", email: "quillon@example.com", phone: "555-0150", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Residence", zone_code: "ZONE_A", address_key: "5-quillon-terrace", distance_miles_from_shop: 9.0, stair_flights: 1 }
              as: ShopManager
              captures: { loc_home: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Receiving Bay", zone_code: "ZONE_A", address_key: "1-shop-yard", distance_miles_from_shop: 0.0, stair_flights: 0, climate_controlled: true }
              as: ShopManager
              captures: { loc_shop: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_home}", make: "Petrof", model: "P125", serial_number: "SN-D6-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Mover M", certification_level: "JOURNEYMAN", zone_codes: ["ZONE_A"], move_certified: true }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 3.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "assessed" }
              as: ShopManager
            - call: "POST /move-jobs"
              payload: { instrument_id: "${inst_id}", origin_location_id: "${loc_home}", destination_location_id: "${loc_shop}", distance_miles: 9.0, scheduled_window_start_utc: "2026-05-06T09:00:00Z", scheduled_window_end_utc: "2026-05-06T12:00:00Z", move_technician_id: "${tech_id}" }
              as: MoveCoordinator
              captures: { mj_id: "$.data.id" }
            - call: "POST /move-jobs/${mj_id}/status-transitions"
              payload: { to_status: "SCHEDULED" }
              as: MoveCoordinator
            - call: "POST /move-jobs/${mj_id}/status-transitions"
              payload: { to_status: "DISPATCHED" }
              as: MoveCoordinator
          trigger:
            - call: "POST /instruments/${inst_id}/custody-transitions"
              payload: { to_custody_status: "IN_TRANSIT", authorizing_move_job_id: "${mj_id}" }
              as: MoveCoordinator
            - call: "POST /instruments/${inst_id}/custody-transitions"
              payload: { to_custody_status: "IN_SHOP", authorizing_move_job_id: "${mj_id}" }
              as: MoveCoordinator
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "NEEDS_REGULATION", note: "action found tight after transport" }
              as: ShopManager
          assert:
            - "after the first trigger call Instrument.${inst_id}.custody_status == IN_TRANSIT and condition_status is still SERVICEABLE"
            - "after the second trigger call Instrument.${inst_id}.custody_status == IN_SHOP and condition_status is still SERVICEABLE"
            - "after the third trigger call Instrument.${inst_id}.condition_status == NEEDS_REGULATION and custody_status is still IN_SHOP"
            - "Instrument.${inst_id}.unauthorized_move_flag == false"
            - "Instrument.${inst_id}.current_location_id == ${loc_shop}"
            - "MoveJob.${mj_id}.status == DELIVERED"

  # =========================================================================
  # RULE 4 - transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_a_unauthorized_move_depth_five
        grounds:
          - cascades[cascade-a-unauthorized-move]
          - state_machines.Instrument.custody_status.AT_CLIENT_SITE_to_IN_TRANSIT
          - state_machines.Warranty.status.ACTIVE_to_VOIDED
          - state_machines.WarrantyClaim.status.SUBMITTED_to_DENIED
          - entities.LedgerEntry.fields.reverses_entry_id
          - entities.Client.fields.account_credit_cents
        distinguishing_aspect: |
          A five-hop chain whose ORIGIN is a custody transition: the unauthorized_move_flag
          causes the warranty void, the void causes the claim denial, the denial causes the
          ledger reversal, and the reversal causes the client balance recomputation - each
          link caused by the previous link, never by the original request.
        test_recipe:
          setup:
            - "One INDIVIDUAL client funded with 100000 cents, one UPRIGHT instrument at a ZONE_A location."
            - "A completed TUNE order for 19500 cents has minted an ACTIVE 90-day warranty."
            - "The clock sits at 2026-06-20 and a SUBMITTED claim carrying a provisional 8666-cent WARRANTY_CREDIT exists, so the client balance is 89166."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Tavish Home", email: "tavish@example.com", phone: "555-0160", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Residence", zone_code: "ZONE_A", address_key: "22-tavish-row", distance_miles_from_shop: 7.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-D7-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech A7", certification_level: "APPRENTICE", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /clients/${cl_id}/credit-adjustments"
              payload: { amount_cents: 100000, memo: "opening funds" }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "TUNE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
            - call: "GET /service-orders/${so_id}/milestones"
              payload: {}
              as: ShopManager
              captures: { ms1_id: "$.data[0].id" }
            - call: "POST /milestones/${ms1_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-release-7"
            - call: "POST /milestones/${ms1_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders/${so_id}/complete"
              payload: {}
              as: ShopManager
            - call: "GET /warranties"
              payload: { instrument_id: "${inst_id}" }
              as: ShopManager
              captures: { w_id: "$.data[0].id", w_v: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty-claims"
              payload: { warranty_id: "${w_id}", reported_issue: "tenor unisons drifted", expected_warranty_version: "${w_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /instruments/${inst_id}/custody-transitions"
              payload: { to_custody_status: "IN_TRANSIT" }
              as: MoveCoordinator
          assert:
            - "hop 1: Instrument.${inst_id}.custody_status == IN_TRANSIT and Instrument.${inst_id}.unauthorized_move_flag == true"
            - "hop 2: Warranty.${w_id}.status == VOIDED and Warranty.${w_id}.void_reason == UNAUTHORIZED_MOVE"
            - "hop 3: WarrantyClaim.${claim_id}.status == DENIED"
            - "hop 4: GET /ledger-entries with client_id=${cl_id} and entry_type=REVERSAL returns exactly 1 row with amount_cents == -8666 whose reverses_entry_id is the id of the WARRANTY_CREDIT row"
            - "hop 5: Client.${cl_id}.account_credit_cents == 80500"
            - "the WARRANTY_CREDIT row still reads amount_cents == 8666 and was never mutated"
            - "Instrument.${inst_id}.condition_status is unchanged at NEEDS_ASSESSMENT (the cascade touches only the custody axis)"

      - name: cascade_b_rebuild_approval_supersedes_depth_five
        grounds:
          - cascades[cascade-b-rebuild-supersedes]
          - state_machines.Quote.status.ISSUED_to_APPROVED
          - state_machines.ServiceOrder.status.IN_PROGRESS_to_VOIDED_BY_REBUILD
          - state_machines.Milestone.status.READY_to_CANCELLED
          - entities.ServiceOrder.fields.deposit_refunded_cents
          - entities.Client.fields.account_credit_cents
        distinguishing_aspect: |
          A five-hop chain whose ORIGIN is a quote approval, not a custody transition:
          approving a REBUILD quote voids the in-flight VOICE order, the void cancels that
          order's milestones, the last milestone cancellation triggers the 25000-cent
          deposit refund, and the refund recomputes the client balance to 200000.
        test_recipe:
          setup:
            - "One INDIVIDUAL client funded with 200000 cents and one UPRIGHT instrument moved to condition_status SERVICEABLE."
            - "A VOICE service order for 42000 cents is IN_PROGRESS with two 21000-cent milestones READY and 25000 cents of deposit held, so the balance is 175000."
            - "A REBUILD quote for the same instrument has been drafted and ISSUED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Rowan Academy", email: "rowan@example.com", phone: "555-0170", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Practice Room", zone_code: "ZONE_A", address_key: "60-rowan-street", distance_miles_from_shop: 10.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Schimmel", model: "C120", serial_number: "SN-D8-0001", instrument_class: "UPRIGHT", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech J8", certification_level: "JOURNEYMAN", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /clients/${cl_id}/credit-adjustments"
              payload: { amount_cents: 200000, memo: "opening funds" }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 1.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "assessed" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v1: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "VOICE", expected_instrument_version: "${inst_v1}" }
              as: ShopManager
              captures: { vq_id: "$.data.id" }
            - call: "POST /quotes/${vq_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${vq_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${vq_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v2: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "REBUILD", expected_instrument_version: "${inst_v2}" }
              as: ShopManager
              captures: { rq_id: "$.data.id" }
            - call: "POST /quotes/${rq_id}/issue"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /quotes/${rq_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          assert:
            - "hop 1: Quote.${rq_id}.status == APPROVED"
            - "Instrument.${inst_id}.condition_status == REBUILD_REQUIRED"
            - "hop 2: ServiceOrder.${so_id}.status == VOIDED_BY_REBUILD"
            - "hop 3: both milestones returned by GET /service-orders/${so_id}/milestones have status CANCELLED"
            - "hop 4: ServiceOrder.${so_id}.deposit_refunded_cents == 25000 and GET /ledger-entries with client_id=${cl_id} and entry_type=DEPOSIT_REFUND returns exactly 1 row with amount_cents == 25000"
            - "hop 5: Client.${cl_id}.account_credit_cents == 200000"
            - "Quote.${vq_id}.status is still APPROVED - the cascade voids the ORDER, not the quote that produced it"

  # =========================================================================
  # RULE 5 - validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: client_not_active_beats_stale_instrument_version
        grounds:
          - validations[priority=19]
          - validations[priority=28]
          - errors[ERR_CLIENT_NOT_ACTIVE]
          - errors[ERR_STALE_INSTRUMENT_VERSION]
          - concurrency_rules[quote-create-stale-instrument]
        distinguishing_aspect: |
          The conflicting pair is category `state` (priority 19, ERR_CLIENT_NOT_ACTIVE,
          409) against category `business_constraint` (priority 28, the OCC rung
          ERR_STALE_INSTRUMENT_VERSION, 412) - a state-versus-concurrency pairing that
          appears nowhere else in this ladder.
        test_recipe:
          setup:
            - "One INDIVIDUAL client with a ZONE_A location and one UPRIGHT instrument."
            - "The client last observed the instrument at version V, then a first TUNE quote was created, which advanced the instrument to V+1, so V is now stale."
            - "The client has been moved to status SUSPENDED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Sable Trust", email: "sable@example.com", phone: "555-0180", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Hall", zone_code: "ZONE_A", address_key: "8-sable-court", distance_miles_from_shop: 5.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Kawai", model: "K300", serial_number: "SN-D9-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 3.0 }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v_stale: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "TUNE", expected_instrument_version: "${inst_v_stale}" }
              as: ShopManager
              captures: { q1_id: "$.data.id" }
            - call: "PATCH /clients/${cl_id}"
              payload: { status: "SUSPENDED" }
              as: ShopManager
          trigger:
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "REGULATE", expected_instrument_version: "${inst_v_stale}" }
              as: ShopManager
              captures: { err_state: "$.data.error_id" }
            - call: "PATCH /clients/${cl_id}"
              payload: { status: "ACTIVE" }
              as: ShopManager
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "REGULATE", expected_instrument_version: "${inst_v_stale}" }
              as: ShopManager
              captures: { err_occ: "$.data.error_id" }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_CLIENT_NOT_ACTIVE, NOT 412 ERR_STALE_INSTRUMENT_VERSION, even though the version is also stale"
            - "the third trigger call returns HTTP 412 with error_id ERR_STALE_INSTRUMENT_VERSION once the state rung is satisfied"
            - "neither rejected call created a Quote: GET /quotes with instrument_id=${inst_id} still returns exactly 1 row, the one captured as ${q1_id}"
            - "Instrument.${inst_id}.version is unchanged by either rejected call"

      - name: milestone_sequence_beats_deposit_not_settled
        grounds:
          - validations[priority=54]
          - validations[priority=59]
          - errors[ERR_MILESTONE_SEQUENCE]
          - errors[ERR_DEPOSIT_NOT_SETTLED]
          - entities.Milestone.fields.sequence_index
        distinguishing_aspect: |
          The conflicting pair is category `business_constraint` (priority 54,
          ERR_MILESTONE_SEQUENCE, 409) against category `business_fiscal` (priority 59,
          ERR_DEPOSIT_NOT_SETTLED, 402) - an ordering-versus-money pairing distinct from
          the state-versus-concurrency pairing of the other instance.
        test_recipe:
          setup:
            - "One INDIVIDUAL client who has NEVER been funded, so the 25000-cent deposit charge leaves account_credit_cents at -25000."
            - "A VOICE service order for 42000 cents is IN_PROGRESS with two 21000-cent milestones, both READY, neither ACCEPTED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Underfunded Hall", email: "under@example.com", phone: "555-0190", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Hall", zone_code: "ZONE_A", address_key: "14-under-lane", distance_miles_from_shop: 4.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U3", serial_number: "SN-D10-0001", instrument_class: "UPRIGHT", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech J10", certification_level: "JOURNEYMAN", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 1.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "assessed" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "VOICE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
            - call: "GET /service-orders/${so_id}/milestones"
              payload: {}
              as: ShopManager
              captures: { ms1_id: "$.data[0].id", ms2_id: "$.data[1].id" }
          trigger:
            - call: "POST /milestones/${ms2_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-release-10"
              captures: { err_seq: "$.data.error_id" }
            - call: "POST /milestones/${ms1_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-release-10"
              captures: { err_dep: "$.data.error_id" }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_MILESTONE_SEQUENCE, NOT 402 ERR_DEPOSIT_NOT_SETTLED, even though the deposit is equally unsettled for milestone 2"
            - "the second trigger call returns HTTP 402 with error_id ERR_DEPOSIT_NOT_SETTLED once the sequence rung is satisfied"
            - "Client.${cl_id}.account_credit_cents == -25000"
            - "both milestones still have status READY and released_by_user_id null"

  # =========================================================================
  # RULE 6 - boundary-precision checks on different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: climate_ratio_exactly_one_quarter_does_not_trip_the_flag
        grounds:
          - calculations.climate_out_of_band_evaluation
          - entities.Location.fields.out_of_band_flag
          - entities.Location.fields.out_of_band_count
          - entities.Location.fields.readings_in_window
        distinguishing_aspect: |
          The metric is the out-of-band RATIO on POST /climate-readings: at exactly
          1 of 4 readings the ratio is 0.25, which is NOT strictly greater than
          CLIMATE_OUT_OF_BAND_RATIO_THRESHOLD, so out_of_band_flag stays false; a fifth
          out-of-band reading takes it to 2 of 5 = 0.4 and flips it true.
        test_recipe:
          setup:
            - "One client with one ZONE_A location and no climate readings."
            - "The logical clock sits at its startup default 2026-05-01T00:00:00Z, so every April 2026 reading is inside the 180-day lookback window."
            - "Three in-band readings at 45.0% RH have already been recorded."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Cellar Archive", email: "cellar@example.com", phone: "555-0200", home_zone_code: "ZONE_A", client_type: "INSTITUTION" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Archive Room", zone_code: "ZONE_A", address_key: "1-cellar-vault", distance_miles_from_shop: 3.0, stair_flights: 0, climate_controlled: false }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /climate-readings"
              payload: { location_id: "${loc_id}", recorded_at_utc: "2026-04-01T12:00:00Z", relative_humidity_pct: 45.0, temperature_f: 68.0 }
              as: ShopManager
            - call: "POST /climate-readings"
              payload: { location_id: "${loc_id}", recorded_at_utc: "2026-04-02T12:00:00Z", relative_humidity_pct: 45.0, temperature_f: 68.0 }
              as: ShopManager
            - call: "POST /climate-readings"
              payload: { location_id: "${loc_id}", recorded_at_utc: "2026-04-03T12:00:00Z", relative_humidity_pct: 45.0, temperature_f: 68.0 }
              as: ShopManager
          trigger:
            - call: "POST /climate-readings"
              payload: { location_id: "${loc_id}", recorded_at_utc: "2026-04-04T12:00:00Z", relative_humidity_pct: 20.0, temperature_f: 68.0 }
              as: ShopManager
              captures: { r4_in_band: "$.data.in_band" }
            - call: "POST /climate-readings"
              payload: { location_id: "${loc_id}", recorded_at_utc: "2026-04-05T12:00:00Z", relative_humidity_pct: 62.0, temperature_f: 68.0 }
              as: ShopManager
          assert:
            - "after the first trigger call Location.${loc_id}.readings_in_window == 4, out_of_band_count == 1 and out_of_band_flag == false (ratio exactly 0.25 is not strictly greater than 0.25)"
            - "the first trigger call's response has in_band == false"
            - "after the second trigger call Location.${loc_id}.readings_in_window == 5, out_of_band_count == 2 and out_of_band_flag == true"
            - "a reading of exactly 35.0 or exactly 55.0 RH would count as IN band, since the band bounds are inclusive"

      - name: cancellation_lead_exactly_seventy_two_hours_is_free
        grounds:
          - calculations.cancellation_fee
          - entities.Appointment.fields.cancellation_fee_cents
          - state_machines.Appointment.scheduling_status.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          A different metric on a different endpoint: the lead-time threshold on
          POST /appointments/{id}/cancel. A cancellation with lead_hours exactly
          72.0 falls in the free band because the comparison is >=, while the same
          instrument cancelled one minute inside the boundary (71.983 hours) is
          charged 15% of 19500, i.e. 2925.
        test_recipe:
          setup:
