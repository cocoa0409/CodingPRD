  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_assignment_cross_contract_buffer
        grounds:
          - validations[priority=15]
          - entities.CrewAssignment.fields.start_date
          - entities.CrewAssignment.fields.end_date
        distinguishing_aspect: |
          Resource Crew with half-open interval semantics plus a conditional buffer: a cross-contract assignment
          must leave a 1-day buffer beyond any existing assignment end, so [2027-04-05, ...) collides
          while [2027-04-06, ...) is admissible (same-contract adjacency is covered in corner design).
        test_recipe:
          setup:
            - "Crew CR-1; contracts C1 and C2 (both DRAFT); assignment A1 on C1 covering [2027-04-01, 2027-04-05)"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-DST", min_elevation_ft: 1400, max_elevation_ft: 2400 }, as: NurseryManager, captures: { z_dst: $.data.id } }
            - { call: "POST /reforestation/landowners", payload: { legal_name: "Owner V", contact_email: "v@x.com", tax_id: "T-V" }, as: ContractOfficer, captures: { lo_id: $.data.id } }
            - { call: "POST /reforestation/seedling-orders", payload: { landowner_id: "${lo_id}", destination_zone_id: "${z_dst}", species: "DOUGLAS_FIR", quantity: 1000, requested_ship_date: "2027-04-05" }, as: Landowner, as_user_id: "${lo_id}", captures: { o_1: $.data.id } }
            - { call: "POST /reforestation/seedling-orders", payload: { landowner_id: "${lo_id}", destination_zone_id: "${z_dst}", species: "DOUGLAS_FIR", quantity: 1000, requested_ship_date: "2027-04-05" }, as: Landowner, as_user_id: "${lo_id}", captures: { o_2: $.data.id } }
            - { call: "POST /reforestation/planting-contracts", payload: { landowner_id: "${lo_id}", seedling_order_id: "${o_1}", site_zone_id: "${z_dst}", acres: 2, trees_per_acre: 400, contingency_pct: 0, planting_window_start: "2027-04-01", planting_window_end: "2027-04-30" }, as: ContractOfficer, captures: { c_1: $.data.id } }
            - { call: "POST /reforestation/planting-contracts", payload: { landowner_id: "${lo_id}", seedling_order_id: "${o_2}", site_zone_id: "${z_dst}", acres: 2, trees_per_acre: 400, contingency_pct: 0, planting_window_start: "2027-04-01", planting_window_end: "2027-04-30" }, as: ContractOfficer, captures: { c_2: $.data.id } }
            - { call: "POST /reforestation/crews", payload: { crew_code: "CR-1", capacity_per_day: 100000 }, as: ContractOfficer, captures: { crew_id: $.data.id } }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_1}", start_date: "2027-04-01", end_date: "2027-04-05", planned_seedlings: 800 }, as: ContractOfficer, captures: { a_1: $.data.id } }
          trigger:
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_2}", start_date: "2027-04-05", end_date: "2027-04-07", planned_seedlings: 200 }, as: ContractOfficer, captures: { a_3_err: $.data.error_id } }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_2}", start_date: "2027-04-06", end_date: "2027-04-08", planned_seedlings: 200 }, as: ContractOfficer, captures: { a_4: $.data.id } }
          assert:
            - "a_3_err == ERR_CREW_OVERLAP (cross-contract start 2027-04-05 violates the 1-day buffer after end 2027-04-05)"
            - "a_4 is created (cross-contract start 2027-04-06 == end + 1 day satisfies the buffer)"
            - "same-contract half-open adjacency is exercised in corner design instance crew_assignment_same_contract_adjacency_allowed"
      - name: storage_aggregate_load_release_and_reuse
        grounds:
          - calculations.storage_load
          - validations[priority=23]
          - state_machines.StoragePlacement.ACTIVE_to_DISCARDED
        distinguishing_aspect: |
          Resource StorageUnit with aggregate-capacity interval semantics (different from the Crew's
          pairwise half-open clash): capacity is consumed by the SUM of placements in ACTIVE status whose occupancy spans overlap,
          and discarding one placement frees its share for a later placement — no pairwise date arithmetic
          is involved.
        test_recipe:
          setup:
            - "GRADED batch with 45000 plantable; unit capacity 25000; P1 20000 and P2 5000 fill the unit"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-SRC", min_elevation_ft: 1000, max_elevation_ft: 2000 }, as: NurseryManager, captures: { z_src: $.data.id } }
            - { call: "POST /reforestation/seed-lots", payload: { source_zone_id: "${z_src}", species: "DOUGLAS_FIR", collected_on: "2026-07-15", quantity_grams: 1000, germination_pct: 0.85 }, as: NurseryManager, captures: { lot_id: $.data.id, lot_v: $.data.version } }
            - { call: "POST /reforestation/crop-batches", payload: { seed_lot_id: "${lot_id}", planned_sow_date: "2026-09-01", lift_window_start: "2027-03-01", lift_window_end: "2027-03-31", expected_seed_lot_version: "${lot_v}" }, as: NurseryManager, captures: { b_id: $.data.id } }
            - { call: "POST /reforestation/crop-batches/${b_id}/sow", payload: { actual_sow_date: "2026-09-01", sown_grams: 600 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/lift", payload: { lifted_on: "2027-03-10", lifted_count: 48000 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/grade", payload: { plantable_count: 45000 }, as: NurseryManager }
            - { call: "POST /reforestation/storage-units", payload: { unit_code: "CU-1", capacity_units: 25000, temp_min_c: -2, temp_max_c: 2 }, as: NurseryManager, captures: { unit_id: $.data.id } }
            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 20000, placed_on: "2027-03-12" }, as: NurseryManager, captures: { p1: $.data.id } }
            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 5000, placed_on: "2027-03-12" }, as: NurseryManager, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 20000, placed_on: "2027-03-13" }, as: NurseryManager, captures: { p3_err: $.data.error_id } }
            - { call: "POST /reforestation/storage-placements/${p1}/discard", payload: { reason: "mold detected" }, as: NurseryManager }
            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 20000, placed_on: "2027-03-13" }, as: NurseryManager, captures: { p3: $.data.id } }
            - { call: "GET /reforestation/storage-units/${unit_id}", payload: {}, as: NurseryManager, captures: { load: $.data.current_load } }
          assert:
            - "p3_err == ERR_STORAGE_CAPACITY_EXCEEDED (aggregate 20000+5000+20000 > 25000)"
            - "after discarding P1 the identical retry succeeds: p3 is created"
            - "load == 25000 (aggregate of ACTIVE placements P2 5000 + P3 20000)"
  - rule_id: compensating_invariant
    instances:
      - name: storage_load_conserved_across_place_discard_ship
        grounds:
          - calculations.storage_load
          - entities.StorageUnit.fields.current_load
          - entities.StoragePlacement.fields.withdrawn_quantity
        distinguishing_aspect: |
          Conserved quantity: stored seedling units. current_load must equal
          SUM(quantity - withdrawn_quantity over ACTIVE placements) after every hop of the sequence
          place 20000 -> place 5000 -> discard 20000 -> place 20000 -> ship-withdraw 6000 (oldest-first):
          20000, 25000, 5000, 25000, 19000 — no drift.
        test_recipe:
          setup:
            - "GRADED batch 45000 plantable; unit cap 25000; READY_TO_PLANT contract with order 9000 allocated"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-SRC", min_elevation_ft: 1000, max_elevation_ft: 2000 }, as: NurseryManager, captures: { z_src: $.data.id } }
