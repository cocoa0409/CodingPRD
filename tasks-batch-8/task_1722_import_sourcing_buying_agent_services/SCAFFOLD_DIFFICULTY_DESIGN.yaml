      - name: quotation_accept_gated_by_factory_audit_grade
        grounds:
          - state_machines.Quotation.OPEN_to_ACCEPTED
          - entities.Factory.fields.latest_audit_grade
          - errors[ERR_FACTORY_GRADE_INSUFFICIENT]
        distinguishing_aspect: |
          Entity pair (Quotation, FactoryAudit): accept on a quotation whose
          factory's latest APPROVED ONSITE audit scored grade C (55) fails
          with ERR_FACTORY_GRADE_INSUFFICIENT, while an identical quotation
          from a grade-B factory (75) accepts — quotation's transition depends
          on FactoryAudit-derived factory state, a different entity pair than
          (PurchaseOrder, Inspection).
        test_recipe:
          setup:
            - "Buyer b1, agent a1; factory fC with APPROVED ONSITE audit scoring 55 (grade C: qs50 sc60 pc55 fs55 cf0); factory fB scoring 75 (grade B: qs75 sc75 pc75 fs75)"
            - "SR sr1 (same request can collect quotations from both factories); quotation qC from fC and qB from fB, both unit 100, moq 1, valid 2027-01-01"
