          - calculations.counterfeit_confirmation_sweep
        distinguishing_aspect: "The system-only SUSPENDED -> REVOKED leg: a first confirmed report suspends the implicated AUTHORIZED converter; a second distinct confirmed report against the same SUSPENDED converter revokes it, and reinstate on REVOKED is then locked out with ERR_INVALID_STATE."
        test_recipe:
          setup:
