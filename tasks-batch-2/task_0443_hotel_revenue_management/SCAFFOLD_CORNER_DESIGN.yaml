            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "STD", name: "Standard", physical_rooms: 50 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 230, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id, rpv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 50, transient_sold_rooms: 10 }
              as: RevenueManager
            - call: "POST /channel-mappings"
              payload: { rate_plan_id: "${rp}", channel: "DIRECT", markup_pct: 0.0 }
              as: ChannelManager
            - call: "POST /channel-mappings"
              payload: { rate_plan_id: "${rp}", channel: "OTA_B", markup_pct: 0.15 }
              as: ChannelManager
              captures: { ota: $.data.id }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-06T00:00:00Z", requested_rate: 230 }
              as: RevenueManager
              captures: { dec: $.data.id }
            - call: "POST /rate-decisions/${dec}/publish"
              payload: { expected_rate_plan_version: "${rpv}" }
              as: RevenueManager
          trigger:
            - call: "PATCH /channel-mappings/${ota}"
              payload: { manual_rate_override: 200.0 }
              as: ChannelManager
              captures: { ps: $.data.parity_status, cr: $.data.channel_rate }
          assert:
            - "OTA_B ChannelMapping.${ota}.channel_rate == 200.00 and parity_status == OUT_OF_PARITY"

