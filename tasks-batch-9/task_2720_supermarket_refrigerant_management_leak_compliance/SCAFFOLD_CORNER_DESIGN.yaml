              as: ComplianceManager
              captures: { s1: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { s2: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { s3: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { s4: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { s5: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { s6: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${s1}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { e1: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${s2}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { e2: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${s3}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { e3: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${s4}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { e4: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${s5}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { e5: $.data.id }
          trigger:
            - call: "GET /leak-events?status=OPEN&limit=2&offset=0"
              payload: {}
              as: ComplianceManager
              captures: { p1_first: "$.data[0].id", p1_second: "$.data[1].id" }
            - call: "POST /leak-events"
