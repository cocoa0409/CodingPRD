            - call: "POST /registrations/${reg_a}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /registrations/${reg_a}/determine"
              payload: {}
              as: ProgramAdmin
              captures: { e_det: $.data.error_id }
            - call: "POST /registrations/${reg_a}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { e_act: $.data.error_id }
          assert:
            - "${e_det} == ERR_INVALID_REGISTRATION_STATE with HTTP 409 (determine is only permitted from DRAFT)"
            - "${e_act} == ERR_INVALID_REGISTRATION_STATE with HTTP 409 (activate is only permitted from DETERMINED)"
            - "Registration.${reg_a}.status is still ACTIVE and registration_number is still 'MPR-2026-0001'"
