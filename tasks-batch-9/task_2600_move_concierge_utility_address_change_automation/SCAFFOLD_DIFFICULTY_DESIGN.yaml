  - rule_id: compensating_invariant
    instances:
      - name: placement_reversal_zeroes_ledger_net
        grounds:
          - state_machines.ReferralPlacement.CONVERTED_to_REVERSED
          - calculations.referral_attributed_share_cents
          - "entities.RevenueShareLedgerEntry.fields.entry_type"
          - "entities.FeedSource.fields.accrued_share_cents"
        distinguishing_aspect: |
          Conserved quantity: placement_ledger_net_cents(P) = sum of amount_cents over the placement's
          immutable ledger entries. A conversion posts ACCRUAL +27000 and FEED_SOURCE_SHARE -4725 (net
          22275); the compensating reversal posts REVERSAL -27000 and FEED_SOURCE_SHARE_REVERSAL +4725, so
          the net returns to EXACTLY 0 with four entries retained and FeedSource.accrued_share_cents back
          to 0 — no entry is deleted or mutated, and no rounding residue is left behind.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Feed source referral_revenue_share_pct 0.1750; partner Skyline Fiber REV_SHARE_PCT 0.3000, attribution_window_days 14, attribution_basis PLACEMENT_ACCEPTANCE, monthly_placement_cap 5."
            - "Resident with a GRANTED PARTNER_MARKETING consent, one verified move for 2026-08-20."
            - "One INTERNET placement created, accepted, and converted with gross_revenue_cents 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /referral-partners"
              payload: { name: "Skyline Fiber", vertical: "INTERNET", payout_model: "REV_SHARE_PCT", rev_share_pct: 0.3000, attribution_window_days: 14, attribution_basis: "PLACEMENT_ACCEPTANCE", monthly_placement_cap: 5 }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "PARTNER_MARKETING", source_channel: "WEB_PORTAL", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { cs_mkt_id: $.data.id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "KBA" }
              as: MoveOpsAgent
              captures: { idv_id: $.data.id }
            - call: "POST /identity-verifications/${idv_id}/kba-result"
              payload: { outcome: "PASSED", score: 720 }
              as: ExternalServiceGateway
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: MoveOpsAgent
              captures: { mv_v1: $.data.version }
            - call: "POST /moves/${mv_id}/referral-placements"
              payload: { partner_id: "${partner_id}", expected_move_version: "${mv_v1}" }
              as: MoveOpsAgent
              captures: { pl_id: $.data.id }
            - call: "POST /referral-placements/${pl_id}/acceptance"
              payload: {}
              as: PartnerAgent
              as_user_id: "${partner_id}"
            - call: "POST /referral-placements/${pl_id}/conversions"
              payload: { gross_revenue_cents: 100000 }
              as: PartnerAgent
              as_user_id: "${partner_id}"
          trigger:
            - call: "POST /referral-placements/${pl_id}/reversal"
              payload: { reversal_reason: "Partner reported the subscription was cancelled inside the trial window" }
              as: PlatformAdmin
          assert:
            - "before the trigger: ReferralPlacement.${pl_id}.attributed_share_cents == 27000, feed_source_share_cents == 4725, and GET /revenue-share-ledger-entries?placement_id=${pl_id} returns total_count == 2 summing to 22275"
            - "before the trigger: FeedSource.${fs_id}.accrued_share_cents == 4725"
            - "trigger returns HTTP 200 with placement_status == REVERSED"
            - "after the trigger: ReferralPlacement.${pl_id}.attributed_share_cents == 0 and feed_source_share_cents == 0"
            - "GET /revenue-share-ledger-entries?placement_id=${pl_id} returns total_count == 4 with entry_type values ACCRUAL (+27000), FEED_SOURCE_SHARE (-4725), REVERSAL (-27000), FEED_SOURCE_SHARE_REVERSAL (+4725)"
            - "the sum of those four amount_cents is exactly 0, so placement_ledger_net_cents(${pl_id}) == 0"
            - "FeedSource.${fs_id}.accrued_share_cents == 0 (a REVERSED placement contributes nothing to the roll-up)"
            - "the (move, INTERNET) uniqueness slot is free again because REVERSED is not in {PLACED, ACCEPTED, CONVERTED, SETTLED}, so a fresh INTERNET placement on ${mv_id} is accepted with HTTP 201"

      - name: order_cancellation_restores_address_window_occupancy
        grounds:
          - "endpoints[POST /moves/{id}/cancellation]"
          - state_machines.UtilityOrder.OPEN_PROVISION_to_CANCELLED
          - "validations[priority=32]"
          - state_machines.MoveRecord.NON_TERMINAL_to_CANCELLED
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: occupied_window_count(service_address_id, utility_type), the
          number of SCHEDULED or ACTIVE_SERVICE windows held on one address. A window that was refused
          while the incumbent order held its slot must become grantable after the incumbent move is
          cancelled — the cancellation clears both window fields, dropping the count from 1 to 0, and the
