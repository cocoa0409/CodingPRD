# =============================================================================
# task_0686_golf_entertainment_range — §1.9 Scaffold Corner Design
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# section / claim_type values are taken from references/claim-extraction-guide.md.
# Clock default 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_computed_counters
        claim_type: Creation
        grounds:
          - entities.Venue.fields.available_bay_count
          - entities.Venue.fields.open_queue_length
        distinguishing_aspect: "POST /golf/venues with name+bay_count returns 201; available_bay_count==bay_count, open_queue_length==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/venues"
              payload: { name: "V1", bay_count: 5 }
              as: RangeManager
              captures: { vid: $.data.id }
          assert:
            - "response.status == 201"
            - "Venue.${vid}.available_bay_count == 5"
            - "Venue.${vid}.open_queue_length == 0"
            - "Venue.${vid}.version == 1"

      - name: create_reservation_missing_time_band_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Reservation.fields.time_band
          - validations[priority=5]
        distinguishing_aspect: "time_band has source:input and no default; omitting it on POST /golf/reservations returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Venue+Bay+Member exist."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "a@x.com", full_name: "A" }
              as: RangeManager
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /golf/reservations"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z" }
              as: Guest
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_member_default_tier_is_standard
        claim_type: Defaults
        grounds:
          - entities.Member.fields.tier
        distinguishing_aspect: "Omitting tier on POST /golf/members applies default STANDARD; wallet/loyalty all start at 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/members"
              payload: { email: "d@x.com", full_name: "D" }
              as: Guest
              captures: { mid: $.data.id }
          assert:
            - "Member.${mid}.tier == STANDARD"
            - "Member.${mid}.wallet_balance_cents == 0"
            - "Member.${mid}.loyalty_points == 0"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /golf/members/{random-uuid} for a non-existent member returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /golf/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_bay_with_unknown_venue_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Bay.fields.venue_id
          - validations[priority=4]
        distinguishing_aspect: "POST /golf/bays whose venue_id FK does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/bays"
              payload: { venue_id: "00000000-0000-4000-8000-000000000001", label: "B1" }
              as: RangeManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: duplicate_member_email_returns_conflict
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.email
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Registering a second Member with an email already in use returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["One member with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /golf/members"
              payload: { email: "dup@x.com", full_name: "First" }
              as: RangeManager
          trigger:
            - call: "POST /golf/members"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: RangeManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: gift_card_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.GiftCard.fields.status
        distinguishing_aspect: "GiftCard has common_fields:false — its read carries id/created_at but no version field; redemption mutates remaining_cents without OCC."
        test_recipe:
          setup: ["A GiftCard face 5000 exists."]
          setup_api_calls:
            - call: "POST /golf/gift-cards"
              payload: { face_value_cents: 5000 }
              as: RangeManager
              captures: { gid: $.data.id }
          trigger:
            - call: "GET /golf/gift-cards/${gid}"
              payload: {}
              as: FrontDesk
          assert:
            - "GiftCard.${gid}.status == ISSUED"
            - "GiftCard.${gid}.remaining_cents == 5000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_cancelled_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.HOLD_to_CANCELLED
          - validations[priority=6]
        distinguishing_aspect: "Confirming a reservation that is CANCELLED (no overlap involved) returns ERR_INVALID_STATE; no charge created."
        test_recipe:
          setup: ["Venue+Bay+Member; one HOLD reservation cancelled."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id, bv: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "ic@x.com", full_name: "IC" }
              as: RangeManager
              captures: { mid: $.data.id }
            - call: "POST /golf/reservations"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", time_band: "OFFPEAK" }
              as: Guest
              as_user_id: "${mid}"
              captures: { rid: $.data.id }
            - call: "POST /golf/reservations/${rid}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${mid}"
          trigger:
            - call: "POST /golf/reservations/${rid}/confirm"
              payload: { expected_bay_version: "${bv}" }
              as: Guest
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: complete_lesson_twice_second_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Lesson.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "A COMPLETED Lesson is terminal; a second complete returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED lesson completed once."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "ls@x.com", full_name: "LS" }
              as: RangeManager
              captures: { mid: $.data.id }
            - call: "POST /golf/lessons"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", kind: "SIMULATOR", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", seats: 1 }
              as: Guest
              as_user_id: "${mid}"
              captures: { lid: $.data.id }
            - call: "POST /golf/lessons/${lid}/complete"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /golf/lessons/${lid}/complete"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: parallel_dimensions_void_after_end_independent_axes
        claim_type: parallel
        grounds:
          - state_machines.GameSession.OPEN_to_ENDED
          - state_machines.GameSession.UNBILLED_to_VOID
        distinguishing_aspect: "play_status and billing_status are independent axes: a session can be ENDED (play) yet still UNBILLED, then VOID (billing) without re-touching play_status."
        test_recipe:
          setup: ["Walk-in GameSession started then ENDED, still UNBILLED."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "pv@x.com", full_name: "PV" }
              as: RangeManager
              captures: { mid: $.data.id }
            - call: "POST /golf/sessions"
              payload: { bay_id: "${bid}", member_id: "${mid}" }
              as: FrontDesk
              captures: { sid: $.data.id }
            - call: "POST /golf/sessions/${sid}/end"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /golf/sessions/${sid}/void"
              payload: {}
              as: RangeManager
          assert:
            - "GameSession.${sid}.play_status == ENDED"
            - "GameSession.${sid}.billing_status == VOID"

      - name: new_reservation_starts_in_hold
        claim_type: Initial State
        grounds:
          - state_machines.Reservation.initial_state
        distinguishing_aspect: "A newly created reservation starts in HOLD with a non-null hold_expires_utc and no charge."
        test_recipe:
          setup: ["Venue+Bay+Member exist."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "is@x.com", full_name: "IS" }
              as: RangeManager
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /golf/reservations"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", time_band: "OFFPEAK" }
              as: Guest
              as_user_id: "${mid}"
              captures: { rid: $.data.id }
          assert:
            - "Reservation.${rid}.status == HOLD"
            - "Reservation.${rid}.charge_id is null"

      - name: confirm_hold_after_expiry_returns_hold_expired
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Reservation.HOLD_to_CONFIRMED
          - errors[ERR_HOLD_EXPIRED]
        distinguishing_aspect: "Confirming a HOLD whose hold_expires_utc has passed (clock advanced beyond it) returns ERR_HOLD_EXPIRED (409)."
        test_recipe:
          setup: ["HOLD reservation created at 2026-06-01T12:00Z; clock advanced past HOLD_TTL."]
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id, bv: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "he@x.com", full_name: "HE" }
              as: RangeManager
              captures: { mid: $.data.id }
            - call: "POST /golf/reservations"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", start_utc: "2026-06-05T18:00:00Z", end_utc: "2026-06-05T19:00:00Z", time_band: "OFFPEAK" }
              as: Guest
              as_user_id: "${mid}"
              captures: { rid: $.data.id }
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T23:00:00Z" }
              as: RangeManager
          trigger:
            - call: "POST /golf/reservations/${rid}/confirm"
              payload: { expected_bay_version: "${bv}" }
              as: Guest
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_HOLD_EXPIRED"

      - name: cancel_event_confirmed_refunds_deposit
        claim_type: Compensation
        grounds:
          - state_machines.EventPackage.QUOTED_to_CANCELLED
          - entities.Member.fields.wallet_balance_cents
        distinguishing_aspect: "Cancelling a CONFIRMED EventPackage credits the full deposit_cents back to organizer wallet (no waterfall, no partial)."
        test_recipe:
          setup: ["Organizer wallet 60000; EventPackage CONFIRMED with deposit_cents=40000 (wallet now 20000)."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 4 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "ec@x.com", full_name: "EC" }
              as: RangeManager
              captures: { oid: $.data.id }
            - call: "POST /golf/members/${oid}/wallet/topup"
              payload: { amount_cents: 60000 }
              as: RangeManager
            - call: "POST /golf/event-packages"
              payload: { venue_id: "${vid}", organizer_member_id: "${oid}", headcount_estimate: 10, per_head_package_cents: 5000, bay_block_cents: 15000, deposit_cents: 40000 }
              as: RangeManager
              captures: { ep: $.data.id }
            - call: "POST /golf/event-packages/${ep}/confirm"
              payload: {}
              as: RangeManager
          trigger:
            - call: "POST /golf/event-packages/${ep}/cancel"
              payload: {}
              as: RangeManager
          assert:
            - "EventPackage.${ep}.status == CANCELLED"
            - "Member.${oid}.wallet_balance_cents == 60000"

  # ===========================================================================
  - section: calculations
    instances:
      - name: scoring_empty_session_total_is_zero
        claim_type: Correct Result
        grounds:
          - calculations.SCORING
          - entities.GameSession.fields.total_score
        distinguishing_aspect: "A GameSession with zero shots has total_score==0 and shot_count==0 (empty-set edge)."
        test_recipe:
          setup: ["Walk-in GameSession started, no shots."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "es@x.com", full_name: "ES" }
              as: RangeManager
              captures: { mid: $.data.id }
            - call: "POST /golf/sessions"
              payload: { bay_id: "${bid}", member_id: "${mid}" }
              as: FrontDesk
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /golf/sessions/${sid}"
              payload: {}
              as: FrontDesk
          assert:
            - "GameSession.${sid}.total_score == 0"
            - "GameSession.${sid}.shot_count == 0"

      - name: bay_price_twilight_platinum_discount_applied
        claim_type: Constants Applied
        grounds:
          - calculations.DYNAMIC_BAY_PRICE
          - entities.Reservation.fields.quoted_price_cents
        distinguishing_aspect: "TWILIGHT band (0.80) * WEEKDAY (1.00) on 90-min base 2500 = gross 6000, PLATINUM 0.15 discount 900 -> quoted 5100."
        test_recipe:
          setup: ["Venue base 2500; Bay; PLATINUM member."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1, base_rate_cents_per_half_hour: 2500 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "tw@x.com", full_name: "TW", tier: "PLATINUM" }
              as: RangeManager
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /golf/reservations"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", start_utc: "2026-06-02T07:00:00Z", end_utc: "2026-06-02T08:30:00Z", time_band: "TWILIGHT", day_type: "WEEKDAY" }
              as: Guest
              as_user_id: "${mid}"
              captures: { rid: $.data.id }
          assert:
            - "Reservation.${rid}.quoted_price_cents == 5100"

      - name: deposit_waterfall_overflow_refunds_remainder
        claim_type: Correct Result
        grounds:
          - calculations.DEPOSIT_WATERFALL
          - entities.EventPackage.fields.deposit_refund_cents
        distinguishing_aspect: "Deposit 140000 over buckets [bay 15000, per-head 110500, F&B 8200] fully fills all three (133700 applied) and refunds the 6300 remainder to organizer wallet."
        test_recipe:
          setup: ["Organizer wallet 200000; EventPackage CONFIRMED deposit 140000, est headcount 20 per_head 6500 block 15000; one CLOSED event FBTab total 8200; settle with actual 17."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 4 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "dw@x.com", full_name: "DW" }
              as: RangeManager
              captures: { oid: $.data.id }
            - call: "POST /golf/members/${oid}/wallet/topup"
              payload: { amount_cents: 200000 }
              as: RangeManager
            - call: "POST /golf/event-packages"
              payload: { venue_id: "${vid}", organizer_member_id: "${oid}", headcount_estimate: 20, per_head_package_cents: 6500, bay_block_cents: 15000, deposit_cents: 140000 }
              as: RangeManager
              captures: { ep: $.data.id }
            - call: "POST /golf/event-packages/${ep}/confirm"
              payload: {}
              as: RangeManager
            - call: "POST /golf/fb-tabs"
              payload: { event_package_id: "${ep}" }
              as: FrontDesk
              captures: { tab: $.data.id }
            - call: "POST /golf/fb-tabs/${tab}/items"
              payload: { name: "Catering", unit_price_cents: 8200, qty: 1 }
              as: FrontDesk
            - call: "POST /golf/fb-tabs/${tab}/close"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /golf/event-packages/${ep}/settle"
              payload: { actual_attendee_count: 17 }
              as: RangeManager
          assert:
            - "EventPackage.${ep}.deposit_refund_cents == 6300"
            - "Member.${oid}.wallet_balance_cents == 66300"

      - name: bay_price_round_total_order_diverges_from_per_segment
        claim_type: Precision
        grounds:
          - calculations.DYNAMIC_BAY_PRICE
        distinguishing_aspect: "ROUND_TOTAL is pinned: base 2495, OFFPEAK*WEEKEND (1.25) on 90 min -> round(2495*3*1.25)=round(9356.25)=9356, NOT per-segment round(2495*1.25)*3=9357."
        test_recipe:
          setup: ["Venue base 2495; Bay; STANDARD member."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1, base_rate_cents_per_half_hour: 2495 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "rt@x.com", full_name: "RT", tier: "STANDARD" }
              as: RangeManager
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /golf/reservations"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", start_utc: "2026-06-06T18:00:00Z", end_utc: "2026-06-06T19:30:00Z", time_band: "OFFPEAK", day_type: "WEEKEND" }
              as: Guest
              as_user_id: "${mid}"
              captures: { rid: $.data.id }
          assert:
            - "Reservation.${rid}.quoted_price_cents == 9356"

  # ===========================================================================
  - section: validations
    instances:
      - name: peak_demand_factor_out_of_range_returns_validation_range
        claim_type: Violation -> Error
        grounds:
          - entities.Venue.fields.peak_demand_factor
          - errors[ERR_VALIDATION_RANGE]
        distinguishing_aspect: "Creating a Venue with peak_demand_factor=2.0 (outside [0.5,1.5]) returns ERR_VALIDATION_RANGE (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1, peak_demand_factor: 2.0 }
              as: RangeManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_RANGE"

      - name: reservation_non_30_min_span_returns_invalid_request
        claim_type: Violation -> Error
        grounds:
          - entities.Reservation.fields.end_utc
          - validations[priority=5]
        distinguishing_aspect: "A reservation window of 45 minutes (not a whole number of 30-min segments) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Venue+Bay+Member exist."]
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${vid}", label: "B1" }
              as: RangeManager
              captures: { bid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "ns@x.com", full_name: "NS" }
              as: RangeManager
              captures: { mid: $.data.id }
          trigger:
