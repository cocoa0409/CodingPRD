            - "No vehicle entries, so entry_count-driven requirements stay at their floors"
            - "Tiers PITSIDE (allot 3000) and UPPER (allot 3000) so expected_attendance == 6000 and required_bls_staff_count == MAX(2, CEIL(6000/2500)) == 3"
