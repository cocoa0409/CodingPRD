            - call: "GET /fleet/assets"
              payload: {}
              as: FleetAdmin
              captures: { asset: "$.data[0].id" }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site INV1-A", address: "13 Way", capacity_assets: 5, geofence_radius_m: 300 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { jsA: $.data.id }
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site INV1-B", address: "14 Way", capacity_assets: 5, geofence_radius_m: 300 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { jsB: $.data.id }
            - call: "POST /fleet/assets/${asset}/deploy"
              payload: { jobsite_id: "${jsA}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
          trigger:
            - call: "POST /fleet/assets/${asset}/transfer"
              payload: { target_jobsite_id: "${jsB}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
              captures: { st_mid: $.data.status }
            - call: "GET /fleet/jobsites/${jsA}"
              payload: {}
              as: FleetAdmin
              captures: { cntA_mid: $.data.deployed_asset_count }
            - call: "GET /fleet/jobsites/${jsB}"
              payload: {}
              as: FleetAdmin
              captures: { cntB_mid: $.data.deployed_asset_count }
            - call: "POST /fleet/assets/${asset}/cancel-transfer"
