        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder ACTIVE, licensee Summit ACTIVE, OPEN cycle; freight order submitted, run, picked, shipped; clock advanced to 2026-09-05T10:00:00Z and the order DELIVERED (delivered_at pinned)."
