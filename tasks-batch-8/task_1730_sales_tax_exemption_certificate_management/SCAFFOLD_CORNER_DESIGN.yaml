      - name: cert_missing_state_registration
        claim_type: violation_to_error
        grounds: ["errors[ERR_MISSING_STATE_REGISTRATION]"]
        distinguishing_aspect: "JurisdictionRule requires_state_registration_number=true and cert submits with empty string -> ERR_MISSING_STATE_REGISTRATION"
        test_recipe:
          setup: ["CA rule requiring registration; cert with empty registration"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/jurisdiction_rules"
