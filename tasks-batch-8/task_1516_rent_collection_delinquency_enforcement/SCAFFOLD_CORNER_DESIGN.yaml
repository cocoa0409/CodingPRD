            - "${fa} PAID (outstanding 0); ${fb} PARTIALLY_PAID (outstanding 3000); ${rc} OPEN (outstanding 200000)"

      - name: waterfall_created_at_tiebreak
        claim_type: correct_result
        grounds: ["calculations.payment_waterfall_allocation"]
        distinguishing_aspect: "Two fee charges with identical kind and due_date are ordered by created_at ASC (never by id): the first-created charge absorbs the whole 3000 payment; the second stays fully OPEN."
