            - "BillingClaim.${clm}.status remains FINALIZED"
  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: linac_turnover_buffer_blocks_back_to_back
        grounds:
          - calculations.linac_slot_overlap
          - entities.FractionSession.fields.machine_id
        distinguishing_aspect: |
          Buffer-augmented half-open semantics on FractionSession/LINAC: a session starting exactly
          at the previous session's end (09:20 after 09:00-09:20) still CONFLICTS because the
          10-minute turnover buffer extends occupation to 09:30; a start at exactly 09:30 is the
          first permitted slot (strict < against end + buffer).
        test_recipe:
          setup:
            - "IMRT course 2000/10 TREATMENT_READY (plan approved, no deliveries yet)"
            - "Session s1 booked on Linac-OV1 at 2026-08-03T09:00-09:20"
          setup_api_calls:
