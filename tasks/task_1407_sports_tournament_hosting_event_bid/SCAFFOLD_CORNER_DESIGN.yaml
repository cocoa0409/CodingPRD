  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1: a request without X-User-Role/X-User-ID headers fails 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401; error_id == ERR_UNAUTHENTICATED (test sends the call with auth headers omitted)"

      - name: teamrep_cannot_create_venue_even_when_event_missing
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Authorization (p2) precedes existence (p3): a TeamRep posting a venue under a nonexistent event gets 403 ERR_FORBIDDEN, not 404."
        test_recipe:
          setup: ["empty DB (event id in path does not exist)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/v1/events/00000000-0000-0000-0000-000000000000/venues", payload: { name: "Ghost Park", address: "0 Nowhere", rental_fee_cents: 1000, revenue_share_pct: 0.10 }, as: TeamRep, as_user_id: "00000000-0000-0000-0000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_FORBIDDEN (not ERR_NOT_FOUND)"

      - name: reviewer_cannot_verify_own_submitted_evidence
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SOD_VIOLATION]", state_machines.BidRequirement.EVIDENCE_SUBMITTED_to_VERIFIED]
        distinguishing_aspect: "SoD: the same operator id that submitted the evidence cannot verify it — 403 ERR_SOD_VIOLATION, requirement stays EVIDENCE_SUBMITTED."
        test_recipe:
          setup: ["Event E; bid with mandatory requirement R1; evidence submitted by shared-1"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "shared-1" }
          trigger:
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "shared-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_SOD_VIOLATION"
            - "BidRequirement.${rq1}.status remains EVIDENCE_SUBMITTED"

      - name: settlement_sod_and_uniqueness_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "validations[priority=8.12]", "errors[ERR_SOD_VIOLATION]", "errors[ERR_SETTLEMENT_EXISTS]"]
