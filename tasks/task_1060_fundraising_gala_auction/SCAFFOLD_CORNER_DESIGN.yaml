scaffold_corner_design:
  - section: entities
    instances:
      - name: create_gala_event_applies_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.GalaEvent.fields.status
          - entities.GalaEvent.fields.posture
          - entities.GalaEvent.fields.match_cap_cents
          - endpoints["POST /api/events"]
        distinguishing_aspect: "Creating an event without match_cap_cents yields status DRAFT, posture OPEN, match_cap_cents 0, version 1 and all money rollups at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock left at its 2026-07-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
          trigger:
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id, ev_status: $.data.status, ev_posture: $.data.posture, ev_cap: $.data.match_cap_cents, ev_ver: $.data.version }
          assert:
            - "${ev_status} == DRAFT"
            - "${ev_posture} == OPEN"
            - "${ev_cap} == 0"
            - "${ev_ver} == 1"
            - "GalaEvent.${ev_id}.gross_collected_cents == 0"
            - "GalaEvent.${ev_id}.open_lot_count == 0"
            - "GalaEvent.${ev_id}.unpaid_invoice_count == 0"

      - name: get_event_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_EVENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid UUID that matches no GalaEvent returns ERR_EVENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
          trigger:
            - call: "GET /api/events/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_EVENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_bidder_missing_required_paddle_number_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Bidder.fields.paddle_number
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "paddle_number has source input and no default, so omitting it returns ERR_INVALID_REQUEST with HTTP 400 and no Bidder row is created."
        test_recipe:
          setup:
            - "One DRAFT event exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: bid_effective_max_is_computed_from_amount_and_proxy
        claim_type: computed_fields
        grounds:
          - entities.Bid.fields.effective_max_cents
          - calculations.auction_item_valuation
        distinguishing_aspect: "Bid.effective_max_cents equals max(amount_cents, proxy_max_cents) = 20000 for a placed 10000 with a 20000 proxy ceiling."
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED; one OPEN lot; bidder A with a card on file."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Napa Weekend", item_type: "SILENT", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-04T00:00:00Z", close_at_utc: "2026-07-30T00:00:00Z" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
          trigger:
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 10000, proxy_max_cents: 20000 }
              as: Bidder
              as_user_id: "${b_a}"
              captures: { bid_1: $.data.id, eff: $.data.effective_max_cents, st: $.data.status }
          assert:
            - "${eff} == 20000"
            - "${st} == ACTIVE"
            - "AuctionItem.${item_1}.current_leading_amount_cents == 10000"

      - name: list_bidders_returns_paginated_envelope
        claim_type: listing
        grounds:
          - endpoints["GET /api/bidders"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /api/bidders?event_id=...&limit=1&offset=0 returns one row with total_count 2 and has_more true."
        test_recipe:
          setup:
            - "One DRAFT event with two registered bidders."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Grace Hopper", email: "grace@example.org", paddle_number: 102 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_b: $.data.id }
          trigger:
            - call: "GET /api/bidders"
              payload: { event_id: "${ev_id}", limit: 1, offset: 0 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "meta pagination total_count == 2"
            - "meta pagination has_more == true"
            - "${first_id} == ${b_a}"
            - "Bidder.${b_b}.payment_method_on_file == false"

  - section: state_machines
    instances:
      - name: publish_event_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.GalaEvent.DRAFT_to_PUBLISHED
          - errors[ERR_INVALID_STATE]
          - validations[priority=8]
        distinguishing_aspect: "The second publish observes status PUBLISHED, which is not a declared from-state for the publish trigger, so it returns ERR_INVALID_STATE with HTTP 409."
        test_recipe:
          setup:
            - "One event with a table, already PUBLISHED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
          trigger:
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "GalaEvent.${ev_id}.status == PUBLISHED"

      - name: publish_event_without_any_table_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GalaEvent.DRAFT_to_PUBLISHED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The DRAFT -> PUBLISHED precondition requires at least one TicketTable; an event with none is rejected with ERR_INVALID_STATE and stays DRAFT."
        test_recipe:
          setup:
            - "One DRAFT event with zero tables."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_STATE"
            - "GalaEvent.${ev_id}.status == DRAFT"

      - name: unpublish_releases_every_held_table_hold
        claim_type: side_effect_execution
        grounds:
          - state_machines.GalaEvent.PUBLISHED_to_DRAFT
          - state_machines.TableHold.HELD_to_RELEASED
          - entities.TableHold.fields.status
        distinguishing_aspect: "Unpublishing a PUBLISHED event with one HELD hold cascades that hold to RELEASED and returns the event to DRAFT."
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; PUBLISHED event with table T1 and one HELD hold for bidder A."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { tbl_id: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/table-holds"
              payload: { table_id: "${tbl_id}", bidder_id: "${b_a}", hold_start_utc: "2026-07-05T18:00:00Z", hold_end_utc: "2026-07-05T20:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { hold_1: $.data.id }
          trigger:
            - call: "POST /api/events/${ev_id}/unpublish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_status: $.data.status }
            - call: "GET /api/table-holds/${hold_1}"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { hold_status: $.data.status }
          assert:
            - "${ev_status} == DRAFT"
            - "${hold_status} == RELEASED"
            - "TicketTable.${tbl_id}.seats_reserved == 0"

      - name: retract_bid_on_awarded_lot_is_locked_out
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Bid.ACTIVE_to_RETRACTED
          - validations[priority=9]
          - errors[ERR_ITEM_NOT_OPEN]
        distinguishing_aspect: "Bid retraction requires the parent lot to be OPEN; once the lot is AWARDED the retraction is refused with ERR_ITEM_NOT_OPEN and the bid stays WON."
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED; one lot AWARDED at hammer 12500 with bidder A's bid in WON."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Napa Weekend", item_type: "SILENT", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-04T00:00:00Z", close_at_utc: "2026-07-30T00:00:00Z" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 12500 }
              as: Bidder
              as_user_id: "${b_a}"
              captures: { bid_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/close"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
          trigger:
            - call: "POST /api/bids/${bid_1}/retract"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_ITEM_NOT_OPEN"
            - "Bid.${bid_1}.status == WON"

      - name: pledge_lapse_before_grace_window_expires_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Pledge.PROMISED_to_LAPSED
          - errors[ERR_INVALID_STATE]
          - global_constants.PLEDGE_LAPSE_GRACE_DAYS
        distinguishing_aspect: "With first_due_utc 2026-08-01 and the clock at 2026-08-20 the 30-day grace has not elapsed, so lapse returns ERR_INVALID_STATE and the pledge stays PROMISED."
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z when the pledge is recorded, then advanced to 2026-08-20T00:00:00Z."
            - "One PROMISED pledge of 300000 with first_due_utc 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/pledges"
              payload: { event_id: "${ev_id}", bidder_id: "${b_a}", total_amount_cents: 300000, installment_count: 3, first_due_utc: "2026-08-01T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pl_1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "fin-1"
          trigger:
            - call: "POST /api/pledges/${pl_1}/lapse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_STATE"
            - "Pledge.${pl_1}.status == PROMISED"
            - "Pledge.${pl_1}.received_amount_cents == 0"

      - name: reconciliation_run_reopen_returns_run_to_prepared
        claim_type: valid_transition
        grounds:
          - state_machines.ReconciliationRun.FINALIZED_to_PREPARED
          - calculations.event_posture
          - entities.ReconciliationRun.fields.finalized_by_user_id
        distinguishing_aspect: "Reopening a FINALIZED run clears finalized_by_user_id, returns status to PREPARED and un-freezes the event posture back to OPEN."
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; PUBLISHED event with no revenue at all, so expected_total_cents == 0 and variance_cents == 0."
            - "One run prepared by fin-1 and finalized by fin-2, leaving the event FROZEN."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { ev_ver_1: $.data.version }
            - call: "POST /api/events/${ev_id}/reconciliation-runs"
              payload: { expected_event_version: "${ev_ver_1}", revenue_basis: "BOOKED" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { run_1: $.data.id, exp_1: $.data.expected_total_cents, mat_1: $.data.is_material_variance }
            - call: "POST /api/reconciliation-runs/${run_1}/finalize"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { fin_by: $.data.finalized_by_user_id }
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { posture_frozen: $.data.posture }
          trigger:
            - call: "POST /api/reconciliation-runs/${run_1}/reopen"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { run_status: $.data.status, fin_by_2: $.data.finalized_by_user_id }
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { posture_after: $.data.posture }
          assert:
            - "${exp_1} == 0"
            - "${mat_1} == false"
            - "${fin_by} == fin-2"
            - "${posture_frozen} == FROZEN"
            - "${run_status} == PREPARED"
            - "${fin_by_2} == null"
            - "${posture_after} == OPEN"

      - name: creating_a_second_run_supersedes_the_prepared_one
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReconciliationRun.PREPARED_to_SUPERSEDED
          - endpoints["POST /api/events/{id}/reconciliation-runs"]
        distinguishing_aspect: "Creating a second run drives the first PREPARED run to SUPERSEDED while the new run is PREPARED."
        test_recipe:
          setup:
