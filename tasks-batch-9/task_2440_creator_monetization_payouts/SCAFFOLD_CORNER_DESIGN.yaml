            - call: "POST /monetization/creator-funds/${fd}/disburse"
              payload: {}
              as: FinanceOperator
          trigger:
            - call: "GET /monetization/creators/${cr_a}/ledger-entries"
              payload: {}
              as: Auditor
              as_user_id: "aud_1"
            - call: "GET /monetization/creator-funds/${fd}/fund-allocations"
              payload: {}
              as: Auditor
              as_user_id: "aud_1"
            - call: "GET /monetization/creators"
              payload: {}
              as: Auditor
              as_user_id: "aud_1"
          assert:
            - "first trigger: HTTP status == 200 and total_count == 1 and data[0].entry_type == 'FUND_CREDIT'"
            - "second trigger: HTTP status == 200 and total_count == 2"
            - "second trigger: data[0].amount_cents == 80000 and data[1].amount_cents == 24000"
            - "third trigger: HTTP status == 200 and total_count == 2"

      - name: platform_admin_cannot_perform_finance_money_operations
        claim_type: role_cannot_perform_other_exclusive_operations
        grounds:
          - "roles[PlatformAdmin].scoping"
          - "roles[FinanceOperator].exclusive_operations"
          - "validations[priority 4]"
        distinguishing_aspect: "PlatformAdmin is explicitly not a superset role: verify, close, finalize and record-settlement all answer 403 for it even though it owns the calendar and catalog those operations act on."
        test_recipe:
          setup: ["One creator with a SUBMITTED W9 profile and one OPEN August period."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
