      - name: prerequisite_edge_rejects_cross_program_and_cycle
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PREREQUISITE_PROGRAM_MISMATCH]
          - errors[ERR_PREREQUISITE_CYCLE]
          - validations.priority_25_ERR_PREREQUISITE_PROGRAM_MISMATCH
          - validations.priority_26_ERR_PREREQUISITE_CYCLE
        distinguishing_aspect: "Both graph guards are 422 but they are ordered: a foreign-program prerequisite is a MISMATCH (checked at 25) before any cycle reasoning happens at 26, and the cycle check must catch the degenerate self-edge as well as the two-hop A->B->A closure that only shows up after a legal edge already exists."
        test_recipe:
          setup:
            - "two PUBLISHED programs; program 1 holds IT-101 and IT-201, program 2 holds BUS-101"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { p1_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${p1_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${p1_id}", code: "IT-201", title: "Distributed Transactions", unit_value: 4, level: "CORE" }
              as: Registrar
              captures: { c2_id: $.data.id }
            - call: "POST /programs/${p1_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /programs"
              payload: { code: "CBE-BSBA", title: "BS Business Administration" }
              as: Registrar
              captures: { p2_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${p2_id}", code: "BUS-101", title: "Managerial Accounting", unit_value: 3, level: "FOUNDATION" }
              as: Registrar
              captures: { c3_id: $.data.id }
            - call: "POST /programs/${p2_id}/publish"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /competencies/${c2_id}/prerequisite"
              payload: { prerequisite_competency_id: "${c3_id}" }
              as: Registrar
              captures: { e_mismatch: $.data.error_id }
            - call: "POST /competencies/${c1_id}/prerequisite"
              payload: { prerequisite_competency_id: "${c1_id}" }
              as: Registrar
              captures: { e_self_cycle: $.data.error_id }
            - call: "POST /competencies/${c2_id}/prerequisite"
              payload: { prerequisite_competency_id: "${c1_id}" }
              as: Registrar
              captures: { ok_prereq: $.data.prerequisite_competency_id, ok_depth: $.data.prerequisite_depth }
            - call: "POST /competencies/${c1_id}/prerequisite"
              payload: { prerequisite_competency_id: "${c2_id}" }
              as: Registrar
              captures: { e_two_hop_cycle: $.data.error_id }
            - call: "GET /competencies/${c1_id}"
              payload: {}
              as: Registrar
              captures: { c1_prereq: $.data.prerequisite_competency_id, c1_depth: $.data.prerequisite_depth, c1_version: $.data.version }
          assert:
            - "${e_mismatch} == ERR_PREREQUISITE_PROGRAM_MISMATCH"
            - "${e_self_cycle} == ERR_PREREQUISITE_CYCLE"
            - "${e_two_hop_cycle} == ERR_PREREQUISITE_CYCLE"
            - "all three refusals have status code 422"
            - "${ok_prereq} == ${c1_id}"
            - "${ok_depth} == 1"
            - "${c1_prereq} == null"
            - "${c1_depth} == 0"
            - "${c1_version} == 1"

      - name: blueprint_rejects_every_malformed_weight_set
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RUBRIC_WEIGHTS_INVALID]
          - validations.priority_24_ERR_RUBRIC_WEIGHTS_INVALID
          - entities.AssessmentBlueprint.fields.dimensions
        distinguishing_aspect: "One code covers four distinct rubric defects — weights summing to 0.9000, a zero weight inside an otherwise valid sum, a non-positive max_score, and duplicate dimension codes — and every rejection must leave the competency untouched at version 1 with effective_blueprint_id still null, so a later well-formed rubric still binds as BP-1."
        test_recipe:
          setup:
            - "a PUBLISHED program with one ACTIVE competency and no blueprint yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
