      - name: loadout_bay_create_read_list_and_deactivate_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /loadout-bays]
          - endpoints[PATCH /loadout-bays/{bay_id}]
          - endpoints[GET /yards/{id}/loadout-bays]
        distinguishing_aspect: >
          The only PATCH in the API flips is_active, bumps version to 2 and is
          immediately reflected by both the item read and the yard-scoped
          listing filtered on is_active.
        test_recipe:
          setup:
            - one yard with two bays, one of which will be deactivated
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /yards
              payload: { code: YRD-DAL, country_code: US, teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: USD }
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
            - call: POST /loadout-bays
              payload: { yard_id: "${yard_id}", bay_number: 1, crane_capacity_kg: 40000 }
              as: PlatformAdmin
              captures: { bay1_id: "$.data.id" }
            - call: POST /loadout-bays
              payload: { yard_id: "${yard_id}", bay_number: 2, crane_capacity_kg: 15000 }
              as: PlatformAdmin
              captures: { bay2_id: "$.data.id" }
          trigger:
            - call: GET /loadout-bays/${bay1_id}
              payload: {}
              as: AuctionOperator
            - call: PATCH /loadout-bays/${bay2_id}
              payload: { is_active: false }
              as: PlatformAdmin
            - call: GET /yards/${yard_id}/loadout-bays
              payload: { is_active: true, limit: 10, offset: 0 }
              as: AuctionOperator
            - call: GET /loadout-bays/${bay2_id}
              payload: {}
              as: AuctionOperator
          assert:
            - both creates return 201 with is_active defaulting to true, reserved_tonnage_kg == 0 and version == 1
            - GET /loadout-bays/${bay1_id} returns crane_capacity_kg == 40000 and bay_number == 1
            - PATCH returns 200 with is_active == false and version == 2
            - the filtered listing reports total_count == 1, has_more == false and contains only ${bay1_id}
            - GET /loadout-bays/${bay2_id} still reports crane_capacity_kg == 15000 (the PATCH touched only is_active)

      - name: reschedule_restamps_the_loadout_deadline_from_the_new_window_end
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /auctions/{auction_id}/reschedule]
          - entities.Auction.fields.loadout_deadline_at
          - state_machines.Auction.initial_state
        distinguishing_aspect: >
          loadout_deadline_at is derived, not stored input: created from
          2026-08-10T22:00:00Z plus the yard's 10 days it reads
          2026-08-20T22:00:00Z, and after rescheduling to
          2026-09-01T22:00:00Z it reads 2026-09-11T22:00:00Z.
        test_recipe:
          setup:
            - one yard with loadout_deadline_days 10 and one SCHEDULED LIVE_ONSITE auction
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /yards
              payload: { code: YRD-DAL, country_code: US, teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: USD }
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
            - call: POST /auctions
              payload:
                yard_id: ${yard_id}
                kind: LIVE_ONSITE
                reserve_policy: RESERVE_ALLOWED
                premium_schedule_code: STANDARD
                window_start: "2026-08-10T14:00:00Z"
                window_end: "2026-08-10T22:00:00Z"
              as: AuctionOperator
              captures: { auction_id: "$.data.id" }
          trigger:
            - call: POST /auctions/${auction_id}/reschedule
              payload: { window_start: "2026-09-01T14:00:00Z", window_end: "2026-09-01T22:00:00Z" }
              as: AuctionOperator
            - call: GET /auctions/${auction_id}
              payload: {}
              as: AuctionOperator
          assert:
            - at creation Auction.status == "SCHEDULED", loadout_deadline_at == "2026-08-20T22:00:00Z" and version == 1
            - reschedule returns 200 with window_start == "2026-09-01T14:00:00Z" and window_end == "2026-09-01T22:00:00Z"
            - loadout_deadline_at == "2026-09-11T22:00:00Z" and version == 2
            - the auction is still SCHEDULED and assigned_lot_count is unchanged at 0

