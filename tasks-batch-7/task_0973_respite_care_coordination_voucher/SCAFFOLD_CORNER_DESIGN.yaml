      - name: redetermination_blocks_new_voucher
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_REDETERMINATION_OVERDUE]", state_machines.Caregiver.ACTIVE_to_REDETERMINATION_PENDING]
        distinguishing_aspect: "After the ops-run at 2027-05-02 flips the caregiver to REDETERMINATION_PENDING (due 2027-05-01), voucher creation fails with ERR_REDETERMINATION_OVERDUE even though the allocation is still OPEN with 80.00h available."
        test_recipe:
          setup: ["Caregiver approved at 2026-05-01 (redetermination due 2027-05-01); clock advanced to 2027-05-02T00:00:00Z; STANDARD ops-run applied"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
