            - "the first create returns HTTP 422 with error_id == ERR_NO_COMMODITY_INDEX"
            - "it is not ERR_NO_CHARGEABLE_PARTY: the dispatch set current_brewer_id and the FILL set filling_brewer_id, so only the index half of priority 32 is unsatisfied"
            - "the refusal did not bump the keg, so the SAME ${k1_v} is still current and the replay needs no re-read"
            - "the replayed create returns HTTP 201 with commodity_index_id == ${ci1_id}, gross_value_cents == 23500, scrap_credit_cents == 3900 (round_half_up(12.5 x 480 x 0.65)), assessed_value_cents == 19600, brewer_liability_pct_bp == 10000 and net_chargeback_cents == 19600"
            - "Keg.${k1_id}.assessment_open == true and Keg.${k1_id}.custody_state is still FILLED (the assessment only becomes a custody move when it is upheld)"

      # ---- codes whose only reachable trigger already lives in §1.8 ----
      - name: segregation_of_duties_blocks_the_tester_from_releasing
        claim_type: triggerable
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority=25]
        excluded_because:
          difficulty_instance: keg_parallel_custody_and_service_dimensions_with_quarantine_retest_loop
          rationale: "That §1.8 instance already refuses the release performed by the technician recorded in pressure_test_performed_by_user_id and then accepts the identical release from the second technician, which is exactly the trigger and the control this code needs."

      - name: responding_twice_from_the_same_side_is_out_of_turn
        claim_type: triggerable
        grounds:
          - errors.ERR_RESPONDER_OUT_OF_TURN
          - validations[priority=19]
        excluded_because:
          difficulty_instance: claim_counter_negotiation_cycle_hits_round_limit_then_agrees
          rationale: "That §1.8 instance already counters twice from the same side inside the alternating cycle and asserts the 409, with last_responder_role unchanged afterwards; the corner instance stale_expected_claim_version_on_respond_returns_412 above additionally proves priority 9 outranks it."

      - name: a_fourth_counter_exceeds_the_round_limit
        claim_type: triggerable
        grounds:
          - errors.ERR_CLAIM_ROUND_LIMIT
          - validations[priority=42]
        excluded_because:
          difficulty_instance: claim_counter_negotiation_cycle_hits_round_limit_then_agrees
          rationale: "That §1.8 instance drives round_count to MAX_CLAIM_ROUNDS 3, takes the 409 on the fourth COUNTER and then proves AGREE is still permitted from the same state, which is the full triggerable surface of this code."

      - name: the_service_centre_refuses_a_clashing_intake_and_a_full_line
        claim_type: triggerable
        grounds:
          - errors.ERR_INTAKE_WINDOW_CONFLICT
          - errors.ERR_SERVICE_CAPACITY_EXCEEDED
          - calculations.service_center_intake
        excluded_because:
          difficulty_instance: service_center_closed_intake_window_and_aggregate_capacity
          rationale: "That §1.8 instance already probes both halves of calculation service_center_intake at their boundaries — a received_at exactly intake_buffer_hours after an existing intake, and an open_cycle_count exactly at concurrent_cycle_capacity — so both codes are triggered there with tighter literals than a corner probe would use."

      - name: an_order_beyond_the_credit_limit_is_refused_with_402
        claim_type: triggerable
        grounds:
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
          - validations[priority=50]
        excluded_because:
          difficulty_instance: order_creation_agreement_state_beats_fiscal_credit_limit
          rationale: "That §1.8 instance triggers the 402 on its own and then shows priority 12 pre-empting it when both rules apply, so the code is covered together with its position in the ladder."

      - name: a_fill_on_an_unfit_keg_is_refused
        claim_type: triggerable
        grounds:
          - errors.ERR_KEG_NOT_FIT_FOR_FILL
          - validations[priority=20]
        excluded_because:
          difficulty_instance: fill_scan_safety_beats_referential_brand_mismatch
          rationale: "That §1.8 instance triggers ERR_KEG_NOT_FIT_FOR_FILL on a keg whose service_state is SERVICE_FAILED and proves it outranks the referential ERR_BRAND_MISMATCH on the same request; the corner instance pressure_certification_at_exactly_730_days_still_fills covers its sibling code ERR_PRESSURE_TEST_OVERDUE at the boundary."

  # ==========================================================================
  # RBAC — the two per-role bullets of Table 7 (`exclusive_operations` /
  # `shared_operations`) plus the declared role_model pattern
  # (complexity_profile.role_model = segregation_of_duties, i.e. the guide's
  # "Segregation of duties" row). approval_chain, peer_roles,
  # hierarchical_override and delegated_authority are NOT declared and are
  # deliberately not probed.
  # ==========================================================================
  - section: rbac
    instances:
      - name: pool_operator_exclusive_writes_are_closed_to_the_other_four_roles
        claim_type: exclusive_operations
        grounds:
          - roles.PoolOperator.exclusive_operations
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Priority 2 sits above priority 3, so a Brewer-role header carrying an X-User-ID that matches no Brewer row still returns ERR_FORBIDDEN_ROLE and never ERR_UNKNOWN_ACTOR — the endpoint's role list is consulted before the actor is resolved. The same sweep is repeated on a second operator-exclusive endpoint that has a path id, to show the role check also precedes the 404."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z and one pool created by the operator; nothing else is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG" }
              as: Brewer
              as_user_id: "br_does_not_exist"
              captures: { e1: "$.data.error_id" }
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG" }
              as: Distributor
              as_user_id: "di_does_not_exist"
              captures: { e2: "$.data.error_id" }
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { e3: "$.data.error_id" }
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { e4: "$.data.error_id" }
            - call: "POST /pools/p_does_not_exist/replenishment-sweep"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { e5: "$.data.error_id" }
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
          assert:
            - "the first four calls each return HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "the first two are ERR_FORBIDDEN_ROLE and not ERR_UNKNOWN_ACTOR even though br_does_not_exist and di_does_not_exist match no row: priority 2 precedes priority 3"
            - "the sweep attempt returns HTTP 403 ERR_FORBIDDEN_ROLE and not 404 ERR_POOL_NOT_FOUND: the role check also precedes the path-id lookup at priority 6"
            - "no Brewer row was created by any of the four refusals — the control create by PoolOperator returns HTTP 201 and is the first and only Brewer"
            - "KegPool.${p1_id} is untouched: kegs_total == 0, available_pct == 0.00 and posture == FROZEN (an empty pool is frozen by definition, 0 pct being below freeze_threshold_pct 10)"

      - name: analyst_only_verbs_are_closed_to_the_operator_and_the_brewer
        claim_type: exclusive_operations
        grounds:
          - roles.AssetRecoveryAnalyst.exclusive_operations
          - roles.Brewer.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "The loss desk's three write verbs (open an assessment, resolve one, open an investigation) are analyst-exclusive even for the PoolOperator who owns everything else, and the brewer's dispute verb is closed to the analyst who created the assessment. The accepted WAIVED resolution at the end proves the endpoints themselves were reachable and only the role was wrong."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480; brewer RDG; pool HB-50L with three kegs; agreement float_size_kegs 3 at 2200 activated 2026-08-01."
            - "One keg allocated and dispatched 2026-08-01T00:00:00Z, which gives it a chargeable current_brewer_id without a FILL."
            - "analyst-1 opens a NOT_RETURNED_DWELL assessment; the keg stays ISSUED_TO_BREWER, so a later WAIVE moves no custody at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002", fill_count: 5, fills_at_last_pressure_test: 5 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003", fill_count: 6, fills_at_last_pressure_test: 6 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 3, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "NOT_RETURNED_DWELL", expected_keg_version: "${k1_v}", assessment_basis: "REPLACEMENT_COST" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { la1_id: "$.data.id" }
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v2: "$.data.version" }
          trigger:
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "LOST_IN_TRADE", expected_keg_version: "${k1_v2}" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_create: "$.data.error_id" }
            - call: "POST /theft-investigations"
              payload: { pool_id: "${p1_id}", opened_reason: "SCRAP_YARD_TIP", keg_ids: ["${k1_id}"] }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_inv: "$.data.error_id" }
            - call: "POST /loss-assessments/${la1_id}/resolve"
              payload: { resolution: "WAIVED", resolution_notes: "Operator tried to close its own loss." }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_resolve: "$.data.error_id" }
            - call: "POST /loss-assessments/${la1_id}/dispute"
              payload: { dispute_reason: "Analyst attempting the brewer's verb." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { e_dispute: "$.data.error_id" }
            - call: "POST /loss-assessments/${la1_id}/resolve"
              payload: { resolution: "WAIVED", resolution_notes: "Keg was found in the taproom cellar." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
          assert:
            - "all four attempts return HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "the refusals wrote nothing: GET /loss-assessments with keg_id ${k1_id} returns total_count 1, GET /theft-investigations returns total_count 0, and LossAssessment.${la1_id}.assessment_status is still PROPOSED with dispute_reason == null"
            - "the accepted WAIVE by analyst-2 returns HTTP 200 with assessment_status == WAIVED, resolved_by_user_id == analyst-2 and chargeback_status still NONE"
            - "the WAIVE cleared Keg.${k1_id}.assessment_open to false while leaving custody_state == ISSUED_TO_BREWER and Brewer.${b1_id}.chargeback_balance_cents == 0"
            - "Brewer.${b1_id}.upheld_loss_count == 0 and status == ACTIVE: a waive never touches the loss counters"

      - name: assessment_creator_cannot_resolve_the_assessment_they_opened
        claim_type: Segregation of duties
        grounds:
          - roles.AssetRecoveryAnalyst.note
          - validations[priority=26]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The role is right and the state is right; only the X-User-ID collides with created_by_user_id, so the refusal is 403 ERR_SEGREGATION_OF_DUTIES and not ERR_FORBIDDEN_ROLE. It fires for BOTH resolutions (UPHELD and WAIVED), and it survives the dispute step, which shows the rule compares against the creator rather than against the last actor."
