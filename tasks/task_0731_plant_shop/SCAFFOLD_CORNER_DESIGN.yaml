  - section: cross_cutting_complexity_layers
    instances:
      - name: stock_unit_adjust_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[stock-unit-adjust-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a care-log write bumps StockUnit.version, using the old version on /stock-units/{id}/adjust → 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["StockUnit with a care-log entry appended (version bumped)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /plants"
              payload: { name: "Sk", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 3000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
              captures: { su_id: "$.data.id", v_at_create: "$.data.version" }
            - call: "POST /stock-units/${su_id}/care-log"
              payload: { entry_type: "WATER" }
              as: Horticulturist
          trigger:
            - call: "POST /stock-units/${su_id}/adjust"
              payload: { expected_stock_unit_version: "${v_at_create}", health_status: "DECLINING" }
              as: Manager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_STALE_VERSION"
        # Note: /stock-units/{id}/care-log's side_effects list does not explicitly say it bumps StockUnit.version;
        # per the concurrency_rules entry, care-log intentionally cascades that bump so the OCC test can trigger.
        # See §1.2.1 stock-unit-adjust-stale-version description for the rationale.

      - name: scheduler_fulfill_advances_next_fulfillment_by_30_days
        claim_type: scheduled_action
        grounds:
