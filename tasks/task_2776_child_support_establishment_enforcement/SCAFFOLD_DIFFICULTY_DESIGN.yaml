  # =====================================================================
  # RULE 7 — cross_entity_state_dependency
  # Differentiation: instance 1 gates SupportOrder on PaternityAction state;
  # instance 2 gates SupportOrder entry on InterstateReferral state — two
  # different entity pairs.
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_creation_requires_established_paternity
        grounds:
          - validations[priority=12]
          - errors[ERR_PATERNITY_NOT_ESTABLISHED]
          - state_machines.PaternityAction.status.GENETIC_COLLECTED_to_ESTABLISHED
          - state_machines.SupportCase.case_status.PATERNITY_PENDING_to_ORDER_ESTABLISHMENT
          - entities.PaternityAction.fields.genetic_cost_liable_party
        distinguishing_aspect: |
          The identical POST /cases/{case_id}/orders request is refused with
          ERR_PATERNITY_NOT_ESTABLISHED while the case's PaternityAction sits in
          GENETIC_COLLECTED and succeeds the moment the genetic result pushes
          that same action to ESTABLISHED — no field on the SupportCase or the
          request changes, only the state of a different entity.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false, good_cause_claim false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD."
            - "A FEDERAL_PLS locate referral moves the case OPENED -> LOCATE and the NCP to PENDING; a LOCATED result then makes the NCP locatable."
            - "A GENETIC_TEST paternity action opens in PENDING (case -> PATERNITY_PENDING)."
            - "A genetic test is ordered with a collection appointment of 2026-08-05T00:00:00Z (strictly after the clock), setting genetic_cost_cents to 48000."
            - "The clock is advanced to the appointment and a clean specimen is collected, leaving the action in GENETIC_COLLECTED — collected but not yet resulted."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Lia Moreau", ssn_last4: "2626", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Max Moreau", ssn_last4: "2727", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/locate-referrals"
              payload: { locate_source: "FEDERAL_PLS" }
              as: CaseWorker
              captures: { cs_locate: $.data.case_status, ref_count: $.data.locate_referral_count }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
              captures: { loc: $.data.locate_status, attempts: $.data.locate_attempt_count }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "GENETIC_TEST" }
              as: CaseWorker
              captures: { pat_id: $.data.id, pat_st0: $.data.status }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs_pat: $.data.case_status }
            - call: "POST /child-support/paternity-actions/${pat_id}/genetic-test-order"
              payload: { collection_appointment_at: "2026-08-05T00:00:00Z" }
              as: SupervisingAttorney
              captures: { pat_st1: $.data.status, gcost: $.data.genetic_cost_cents, liable0: $.data.genetic_cost_liable_party }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/paternity-actions/${pat_id}/specimen-collection"
              payload: { chain_of_custody_ok: true }
              as: CaseWorker
              captures: { pat_st2: $.data.status, collected: $.data.specimen_collected_at }
          trigger:
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-09-01" }
              as: CaseWorker
              captures: { err_blocked: $.data.error_id }
            - call: "POST /child-support/paternity-actions/${pat_id}/genetic-result"
              payload: { genetic_probability_pct: 99.5 }
              as: SupervisingAttorney
              captures: { pat_st3: $.data.status, est_method: $.data.established_method, est_at: $.data.established_at, liable1: $.data.genetic_cost_liable_party }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs_after: $.data.case_status }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-09-01" }
              as: CaseWorker
              captures: { order_id: $.data.id, order_st: $.data.status }
          assert:
            - "${cs_locate} == \"LOCATE\""
            - "${ref_count} == 1"
            - "${loc} == \"LOCATED\""
            - "${attempts} == 1"
            - "${pat_st0} == \"PENDING\""
            - "${cs_pat} == \"PATERNITY_PENDING\""
            - "${pat_st1} == \"GENETIC_ORDERED\""
            - "${gcost} == 48000  # GENETIC_TEST_COST_CENTS"
            - "${liable0} == \"NONE\"  # liability is not assigned until the result comes back"
            - "${pat_st2} == \"GENETIC_COLLECTED\""
            - "${collected} == \"2026-08-05T00:00:00Z\""
            - "${err_blocked} == \"ERR_PATERNITY_NOT_ESTABLISHED\"  # HTTP 409; GENETIC_COLLECTED is not ESTABLISHED or NOT_REQUIRED"
            - "${pat_st3} == \"ESTABLISHED\"  # 99.5 >= 99.0"
            - "${est_method} == \"GENETIC_TEST\""
            - "${est_at} == \"2026-08-05T00:00:00Z\""
            - "${liable1} == \"NCP\"  # inclusion, not exclusion, so the NCP owes the 48000"
            - "${cs_after} == \"ORDER_ESTABLISHMENT\"  # the case followed the paternity action"
            - "${order_st} == \"DRAFT\"  # the byte-identical request now succeeds"

      - name: order_entry_blocked_by_foreign_controlling_order
        grounds:
          - validations[priority=17]
          - errors[ERR_NO_CONTROLLING_ORDER_JURISDICTION]
          - calculations.controlling_order_determination
          - state_machines.InterstateReferral.status.DRAFT_to_REGISTERED
          - state_machines.InterstateReferral.status.REGISTERED_to_RETURNED
          - state_machines.SupportCase.interstate_role.NONE_to_RESPONDING
        distinguishing_aspect: |
          A CALCULATED MEDICAL_SUPPORT order cannot enter while the case's
          REGISTERED InterstateReferral names a TX controlling order — the CEJ
          gate at priority 17 — and the same entry request succeeds untouched
          once that referral is RETURNED with NO_JURISDICTION and
          controlling_order_state_code is cleared; the blocking condition lives
          entirely on the InterstateReferral, not on the order.
