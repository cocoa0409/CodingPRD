# =============================================================================
# Task 1028 — Rare & Used Bookstore / Book-Scout
# Seed tables (SCAFFOLD.yaml) — §1.0–§1.7
# Difficulty band: Expert (10–15 entities / 20–32 endpoints)
# =============================================================================

scenario: |
  1028. Rare & Used Bookstore / Book-Scout: intake & condition/first-edition grading,
  appraisal & consignment, online + shop catalog, want-list & sourcing, fair/show,
  buyback/credit, shipping/packing, provenance

domain_name: rare-used-bookstore
api_prefix: /            # flat topology: entities mount at the root as peer collections (/patrons, /book-items, /sale-orders, ...)

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat            # peer entities linked by explicit FK fields; shallow URL nesting
  state_machine_shape: parallel     # CatalogListing carries two independent status axes; ConsignmentAgreement is cyclic
  relationship_patterns:
    - one_to_many                   # IntakeLot -> BookItem
    - cross_aggregate               # SaleOrder line items reference BookItem across aggregates
  role_model: peer_roles            # Patron owns own records; Appraiser / StoreClerk / Manager own operations
  consistency_model: immediate      # all cascades atomic within the triggering request
  entity_count: 11
  state_machine_count: 7
  calculation_count: 8
  endpoint_count: 35
  error_code_count: 32
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Person or dealer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Patrons" }
      - { name: default_commission_pct, type: number, source: input, default: 0.30, description: "Default consignment commission fraction (0..1) used when an agreement omits commission_pct" }
      - { name: store_credit_cents, type: integer, source: computed, default: 0, description: "Derived ledger: Σ ACCEPTED BuybackOffer.credit_amount_cents − Σ store_credit_applied_cents on CONFIRMED SaleOrders; never negative (see store_credit_balance)" }
      - { name: consignor_payable_cents, type: integer, source: computed, default: 0, description: "Derived ledger: Σ consignor payouts accrued on CONFIRMED consigned sales; never negative (see consignor_payable_balance)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Patron lifecycle (single active state in scope)", constraints: "ACTIVE" }

  - name: IntakeLot
    parent: null
    common_fields: true
    fields:
      - { name: consignor_id, type: string, source: input, default: null, description: "Patron id of the party the lot was taken in from; validated to exist when non-null (null for shop-purchase lots). Reverse-lookup of lots-by-consignor is out of scope; discover consigned items via the BookItem list instead." }
      - { name: acquisition_channel, type: enum, source: input, description: "How the lot entered the shop", constraints: "BUYBACK, CONSIGNMENT, PURCHASE, FAIR" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "Count of BookItems currently attached to this lot" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "IntakeLot lifecycle", constraints: "DRAFT, SETTLED, REJECTED" }

  - name: BookItem
    parent: null
    common_fields: true
    fields:
      - { name: intake_lot_id, type: string, source: input, description: "FK -> IntakeLot.id; the lot this item was intaken under" }
      - { name: consignor_id, type: string, source: computed, default: null, description: "FK -> Patron.id; copied from the intake lot's consignor_id at creation (null for shop-owned)" }
      - { name: title, type: string, source: input, description: "Book title" }
      - { name: author, type: string, source: input, description: "Primary author" }
      - { name: printing_number, type: integer, source: input, default: 1, description: "Stated printing/impression number" }
      - { name: stated_first_edition, type: boolean, source: input, default: false, description: "Whether the copy is marked 'First Edition' on the copyright page" }
      - { name: comp_median_cents, type: integer, source: input, default: 0, description: "Median comparable-sale price used as the valuation base" }
      - { name: condition_grade, type: enum, source: system, default: null, description: "Grading outcome set by the grade action; null until graded; input at create ignored", constraints: "POOR, GOOD, VERY_GOOD, FINE, AS_NEW" }
      - { name: is_first_edition, type: boolean, source: computed, default: false, description: "Computed at grade time (see first_edition_determination)" }
      - { name: appraised_value_cents, type: integer, source: computed, default: null, description: "Latest ISSUED Appraisal.final_value_cents; null until an appraisal issues" }
      - { name: provenance, type: array, source: computed, description: "Append-only computed log: array of {event_type, note, actor_role, at}; events pushed by grade/appraise/list/sell/withdraw/consign/buyback flows" }
      - { name: status, type: enum, source: system, default: "INTAKE", description: "BookItem lifecycle", constraints: "INTAKE, GRADED, APPRAISED, LISTED, SOLD, WITHDRAWN" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: book_item_id, type: string, source: input, description: "FK -> BookItem.id; the item being appraised" }
      - { name: basis, type: enum, source: input, description: "Valuation basis selected for final_value_cents", constraints: "FAIR_MARKET, RETAIL_REPLACEMENT" }
      - { name: fair_market_value_cents, type: integer, source: computed, default: 0, description: "Fair-market variant (see appraised_value)" }
      - { name: retail_replacement_value_cents, type: integer, source: computed, default: 0, description: "Retail-replacement variant (see appraised_value)" }
      - { name: final_value_cents, type: integer, source: computed, default: 0, description: "The variant selected by `basis`; copied to BookItem.appraised_value_cents on issue" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "Appraisal lifecycle", constraints: "ISSUED, SUPERSEDED, VOIDED" }

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the consignor" }
      - { name: book_item_id, type: string, source: input, description: "FK -> BookItem.id; the consigned item (1:1)" }
      - { name: commission_pct, type: number, source: input, description: "Commission fraction (0..1) the shop retains on sale" }
      - { name: fee_model, type: enum, source: input, default: "GROSS_COMMISSION", description: "Payout basis (see consignment_payout)", constraints: "GROSS_COMMISSION, NET_COMMISSION" }
      - { name: flat_fee_cents, type: integer, source: input, default: 0, description: "Fixed handling fee subtracted before commission under NET_COMMISSION" }
      - { name: amendment_no, type: integer, source: system, default: 0, description: "Increments on each amend" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "Agreement lifecycle (cyclic PROPOSED<->AMENDED)", constraints: "PROPOSED, AMENDED, ACTIVE, SETTLED" }

  - name: CatalogListing
    parent: null
    common_fields: true
    fields:
      - { name: book_item_id, type: string, source: input, description: "FK -> BookItem.id; the item being listed (1:1)" }
      - { name: list_price_cents, type: integer, source: input, description: "Advertised price" }
      - { name: online_status, type: enum, source: system, default: "DRAFT", description: "Online sales-channel axis (independent of shop_status)", constraints: "DRAFT, LIVE, SOLD, DELISTED" }
      - { name: shop_status, type: enum, source: system, default: "DRAFT", description: "Physical-shop sales-channel axis (independent of online_status)", constraints: "DRAFT, ON_SHELF, SOLD, PULLED" }
      - { name: sold_channel, type: enum, source: computed, default: null, description: "Which axis recorded the sale; null until sold", constraints: "ONLINE, SHOP" }

  - name: BuybackOffer
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the seller receiving store credit" }
      - { name: book_item_id, type: string, source: input, default: null, description: "FK -> BookItem.id; the item offered for buyback (nullable)" }
      - { name: offer_value_cents, type: integer, source: input, description: "Store-credit value offered for the item" }
      - { name: credit_amount_cents, type: integer, source: computed, default: 0, description: "Store credit issued on acceptance (equals offer_value_cents)" }
      - { name: auto_approved, type: boolean, source: computed, default: false, description: "True iff offer_value_cents <= AUTO_APPROVE_LIMIT_CENTS at creation" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "BuybackOffer lifecycle", constraints: "PENDING, AUTO_APPROVED, ACCEPTED, VOIDED" }

  - name: FairEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fair/show name" }
      - { name: table_capacity, type: integer, source: input, description: "Max display slots occupiable across overlapping BoothSlots at any instant" }
      - { name: reserved_display_count, type: integer, source: computed, default: 0, description: "Σ display_item_count over currently-RESERVED BoothSlots (informational snapshot)" }

  - name: BoothSlot
    parent: null
    common_fields: true
    fields:
      - { name: fair_event_id, type: string, source: input, description: "FK -> FairEvent.id; the fair this slot belongs to" }
      - { name: booth_table, type: string, source: input, description: "Identifier of the physical table this slot occupies" }
      - { name: window_start, type: datetime, source: input, description: "Slot occupation start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Slot occupation end (exclusive); must be > window_start" }
      - { name: display_item_count, type: integer, source: input, default: 1, description: "How many display slots this reservation consumes" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "BoothSlot lifecycle (reserved on creation)", constraints: "RESERVED" }

  - name: SaleOrder
    parent: null
    common_fields: true
    fields:
      - { name: buyer_patron_id, type: string, source: input, default: null, description: "Buyer Patron id; validated to exist when non-null (null for walk-in cash). Store-credit and payout ledgers key off this patron; reverse-lookup of orders-by-buyer is out of scope." }
      - { name: channel, type: enum, source: input, description: "Sales channel", constraints: "ONLINE, SHOP" }
      - { name: line_items, type: array, source: input, description: "Array of {book_item_id, sale_price_cents, discount_pct}; one entry per book sold" }
      - { name: tax_pct, type: number, source: input, default: 0.08, description: "Tax fraction applied per line item" }
      - { name: store_credit_applied_cents, type: integer, source: input, default: 0, description: "Store credit the buyer elects to spend on this order" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Σ per-line rounded net+tax amounts (see order_total)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents − store_credit_applied_cents; never below 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "SaleOrder lifecycle", constraints: "DRAFT, CONFIRMED, REFUNDED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: sale_order_id, type: string, source: input, description: "FK -> SaleOrder.id; the order being shipped" }
      - { name: packing_station_label, type: string, source: input, description: "Logical packing station this shipment occupies (plain label; buffer overlap grouped by this value)" }
      - { name: weight_grams, type: integer, source: input, description: "Total package weight" }
      - { name: zone, type: integer, source: input, description: "Shipping zone 1..4" }
      - { name: declared_value_cents, type: integer, source: input, default: 0, description: "Declared value driving insurance" }
      - { name: insured, type: boolean, source: input, default: false, description: "Whether insurance is purchased" }
      - { name: pack_start, type: datetime, source: input, description: "Packing-slot start (inclusive)" }
      - { name: pack_end, type: datetime, source: input, description: "Packing-slot end (exclusive); must be > pack_start" }
      - { name: shipping_cost_cents, type: integer, source: computed, default: 0, description: "Computed carriage + insurance (see shipping_cost)" }
      - { name: status, type: enum, source: system, default: "PACKED", description: "Shipment lifecycle (packed on creation)", constraints: "PACKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- IntakeLot: branching (SETTLED vs REJECTED); reject drives depth-2 cascade
  - entity: IntakeLot
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: "POST /intake-lots/{id}/settle"
        actor: Manager
        preconditions:
          - "item_count >= 1 (ERR_EMPTY_LOT)"
          - "Every BookItem with intake_lot_id == this lot has status APPRAISED (ERR_LOT_ITEMS_NOT_APPRAISED)"
        side_effects: []
      - from: DRAFT
        to: REJECTED
        trigger: "POST /intake-lots/{id}/reject"
        actor: Manager
        preconditions: []
        side_effects:
          - "CASCADE depth-2 hop 1: every BookItem with intake_lot_id == this lot AND status != SOLD transitions to WITHDRAWN"
          - "CASCADE depth-2 hop 2: each such BookItem WITHDRAWN transition itself sets every Appraisal with book_item_id == that item AND status == ISSUED to VOIDED, and clears that BookItem.appraised_value_cents to null"
          - "Pushes a provenance entry {event_type: WITHDRAWN} onto each withdrawn BookItem"

  # ---- BookItem: branching lifecycle; cross-entity guard on LISTED; terminal SOLD/WITHDRAWN
  - entity: BookItem
    field: status
    initial_state: INTAKE
    terminal_states: [SOLD, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: GRADED
        trigger: "POST /book-items/{id}/grade"
        actor: Appraiser
        preconditions:
          - "BookItem.status == INTAKE (ERR_ITEM_NOT_GRADED covers wrong-state grade attempts)"
        side_effects:
          - "Sets condition_grade and is_first_edition (see first_edition_determination)"
          - "Pushes provenance entry {event_type: GRADED}"
      - from: [GRADED, APPRAISED]
        to: APPRAISED
        trigger: "system (an Appraisal issues via POST /book-items/{id}/appraisals)"
        actor: system
        preconditions:
          - "BookItem.status IN {GRADED, APPRAISED} (ERR_ITEM_NOT_GRADED); re-appraising an already-APPRAISED item is permitted and supersedes the prior ISSUED appraisal"
        side_effects:
          - "Copies the newly issued Appraisal.final_value_cents into appraised_value_cents"
          - "Pushes provenance entry {event_type: APPRAISED} (first issue only)"
      - from: APPRAISED
        to: LISTED
        trigger: "system (a CatalogListing is created via POST /book-items/{id}/listing)"
        actor: system
        preconditions:
          - "CROSS-ENTITY (BookItem<-CatalogListing): listing creation requires BookItem.status == APPRAISED (ERR_ITEM_NOT_APPRAISED)"
        side_effects:
          - "Pushes provenance entry {event_type: LISTED}"
      - from: LISTED
        to: SOLD
        trigger: "system (SaleOrder confirm sells this item — cascade hop 1)"
        actor: system
        preconditions:
          - "BookItem.status == LISTED (ERR_ITEM_NOT_LISTED)"
        side_effects:
          - "CASCADE depth-3 hop 2: this SOLD transition sets the item's CatalogListing sold axis to SOLD (see CatalogListing)"
          - "Pushes provenance entry {event_type: SOLD}"
      - from: SOLD
        to: LISTED
        trigger: "system (SaleOrder refund — compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "Restores the CatalogListing sold axis to its pre-sale live value; clears sold_channel"
      - from: [INTAKE, GRADED, APPRAISED, LISTED]
        to: WITHDRAWN
        trigger: "system (parent IntakeLot rejected — cascade hop 1)"
        actor: system
        preconditions:
          - "BookItem.status != SOLD"
        side_effects:
          - "Voids ISSUED Appraisals for this item and clears appraised_value_cents (cascade hop 2)"
          - "Pushes provenance entry {event_type: WITHDRAWN}"

  # ---- Appraisal: branching; superseded by newer appraisal; voided on withdraw
  - entity: Appraisal
    field: status
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (a newer Appraisal is created for the same BookItem via POST /book-items/{id}/appraisals)"
        actor: system
        preconditions: []
        side_effects:
          - "The newer Appraisal becomes the item's authoritative valuation"
      - from: ISSUED
        to: VOIDED
        trigger: "system (BookItem withdrawn — cascade hop 2)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- ConsignmentAgreement: CYCLIC negotiation (PROPOSED <-> AMENDED); non-linear (Rule 3)
  - entity: ConsignmentAgreement
    field: status
    initial_state: PROPOSED
    terminal_states: [SETTLED]
    transitions:
      - from: [PROPOSED, AMENDED]
        to: AMENDED
        trigger: "POST /consignment-agreements/{id}/amend"
        actor: Manager
        preconditions:
          - "Agreement.status IN {PROPOSED, AMENDED} (ERR_AGREEMENT_NOT_AMENDABLE)"
          - "expected_consignment_agreement_version matches version (ERR_STALE_VERSION)"
        side_effects:
          - "increments amendment_no by 1"
          - "increments ConsignmentAgreement.version by 1"
          - "Updates commission_pct / fee_model / flat_fee_cents from the amend payload"
      - from: [PROPOSED, AMENDED]
        to: ACTIVE
        trigger: "POST /consignment-agreements/{id}/activate"
        actor: Manager
        preconditions:
          - "CROSS-ENTITY (ConsignmentAgreement<-BookItem): the referenced BookItem.status IN {APPRAISED, LISTED} (ERR_ITEM_NOT_APPRAISED)"
        side_effects:
          - "Pushes provenance entry {event_type: CONSIGNED} onto the book item"
      - from: ACTIVE
        to: SETTLED
        trigger: "system (SaleOrder confirm sells the consigned item — cascade hop 3)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE depth-3 hop 4: accrues consignor payout (see consignment_payout) into Patron.consignor_payable_cents"
      - from: SETTLED
        to: ACTIVE
        trigger: "system (SaleOrder refund — compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "Reverses the accrued payout from Patron.consignor_payable_cents (exact)"

  # ---- CatalogListing: PARALLEL dimensions online_status × shop_status; non-linear (Rule 3)
  - entity: CatalogListing
    field: "online_status × shop_status"
    initial_state: "online_status=DRAFT, shop_status=DRAFT"
    terminal_states: []
    transitions:
      - from: "online_status=DRAFT"
        to: "online_status=LIVE"
        trigger: "PATCH /catalog-listings/{id} with online_status=LIVE"
        actor: StoreClerk
        preconditions:
          - "shop_status axis independent and unchanged"
          - "expected_catalog_listing_version matches version (ERR_STALE_VERSION)"
        side_effects:
          - "increments CatalogListing.version by 1"
      - from: "shop_status=DRAFT"
        to: "shop_status=ON_SHELF"
        trigger: "PATCH /catalog-listings/{id} with shop_status=ON_SHELF"
        actor: StoreClerk
        preconditions:
          - "online_status axis independent and unchanged"
          - "expected_catalog_listing_version matches version (ERR_STALE_VERSION)"
        side_effects:
          - "increments CatalogListing.version by 1"
      - from: "online_status=LIVE"
        to: "online_status=SOLD"
        trigger: "system (SaleOrder confirm with channel=ONLINE — cascade hop 2)"
        actor: system
        preconditions:
          - "BookItem just transitioned to SOLD (cascade)"
        side_effects:
          - "Sets sold_channel=ONLINE; sets shop_status=PULLED so the physical copy leaves the shelf"
      - from: "shop_status=ON_SHELF"
        to: "shop_status=SOLD"
        trigger: "system (SaleOrder confirm with channel=SHOP — cascade hop 2)"
        actor: system
        preconditions:
          - "BookItem just transitioned to SOLD (cascade)"
        side_effects:
          - "Sets sold_channel=SHOP; sets online_status=DELISTED so the online copy is withdrawn"

  # ---- BuybackOffer: branching (AUTO_APPROVED vs PENDING->ACCEPTED); compensating VOIDED
  - entity: BuybackOffer
    field: status
    initial_state: PENDING
    terminal_states: [ACCEPTED, VOIDED]
    transitions:
      - from: PENDING
        to: AUTO_APPROVED
        trigger: "system (at creation, offer_value_cents <= AUTO_APPROVE_LIMIT_CENTS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PENDING, AUTO_APPROVED]
        to: ACCEPTED
        trigger: "POST /buyback-offers/{id}/accept"
        actor: Manager
        preconditions:
          - "Offer.status IN {PENDING, AUTO_APPROVED} (ERR_OFFER_NOT_ACCEPTABLE)"
        side_effects:
          - "Sets credit_amount_cents = offer_value_cents"
          - "INVARIANT store_credit: Patron.store_credit_cents += credit_amount_cents"
          - "Pushes provenance entry {event_type: BUYBACK} if book_item_id present"
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /buyback-offers/{id}/void"
        actor: Manager
        preconditions:
          - "Offer.status == ACCEPTED (ERR_OFFER_NOT_VOIDABLE)"
          - "Patron.store_credit_cents >= credit_amount_cents (ERR_CREDIT_ALREADY_SPENT)"
        side_effects:
          - "INVARIANT store_credit (compensation): Patron.store_credit_cents -= credit_amount_cents (exact reversal)"

  # ---- SaleOrder: branching CONFIRMED vs REFUNDED; drives depth-3 cascade + both ledger invariants
  - entity: SaleOrder
    field: status
    initial_state: DRAFT
    terminal_states: [REFUNDED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /sale-orders/{id}/confirm"
        actor: Manager
        preconditions:
          - "line_items is non-empty (ERR_EMPTY_ORDER)"
          - "STATE: every line item's BookItem.status == LISTED (ERR_ITEM_NOT_LISTED)"
          - "REFERENTIAL: for a consigned line item, the item's ConsignmentAgreement.status == ACTIVE (ERR_CONSIGNMENT_NOT_ACTIVE)"
          - "FISCAL: store_credit_applied_cents <= buyer Patron.store_credit_cents (ERR_INSUFFICIENT_STORE_CREDIT)"
        side_effects:
          - "CASCADE depth-3 hop 1: each line item's BookItem -> SOLD"
          - "CASCADE depth-3 hop 2: each BookItem SOLD -> its CatalogListing sold axis -> SOLD (per channel)"
          - "CASCADE depth-3 hop 3+4: each consigned item's ConsignmentAgreement ACTIVE -> SETTLED -> accrues payout into Patron.consignor_payable_cents"
          - "INVARIANT store_credit: buyer Patron.store_credit_cents -= store_credit_applied_cents"
          - "INVARIANT consignor_payable: Patron.consignor_payable_cents += Σ consignment_payout over consigned line items"
      - from: CONFIRMED
        to: REFUNDED
        trigger: "POST /sale-orders/{id}/refund"
        actor: Manager
        preconditions:
          - "SaleOrder.status == CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
        side_effects:
          - "COMPENSATION: each line item's BookItem SOLD -> LISTED; CatalogListing sold axis restored; sold_channel cleared"
          - "COMPENSATION store_credit: buyer Patron.store_credit_cents += store_credit_applied_cents (exact reversal)"
          - "COMPENSATION consignor_payable: Patron.consignor_payable_cents -= Σ consignment_payout (exact); each ConsignmentAgreement SETTLED -> ACTIVE"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; true supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: appraisal-create-stale-book
    parent_entity: BookItem
    write_endpoint: "POST /book-items/{id}/appraisals"
    occ_field: "expected_book_item_version"
    description: |
      Creating an Appraisal against a BookItem whose version has advanced since the
      client last observed it is rejected. A new appraisal legitimately supersedes the
      prior ISSUED appraisal for that item; if another writer has already issued one
      (advancing the item's version and superseding state), the current writer's view
      of the item is stale and the create is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: amend-stale-agreement
    parent_entity: ConsignmentAgreement
    write_endpoint: "POST /consignment-agreements/{id}/amend"
    occ_field: "expected_consignment_agreement_version"
    description: |
      Amending a ConsignmentAgreement whose version has advanced since the client last
      observed it is rejected. A new amendment legitimately supersedes the prior terms;
      if another writer has already amended (advancing the version), the current writer's
      proposed terms rest on a stale view and are refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: listing-update-stale
    parent_entity: CatalogListing
    write_endpoint: "PATCH /catalog-listings/{id}"
    occ_field: "expected_catalog_listing_version"
    description: |
      Updating a CatalogListing (price or channel status) whose version has advanced
      since the client last observed it is rejected. The later update legitimately
      supersedes the earlier one on the same row; a client carrying a stale version has
      not seen the intervening change and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Rule 1 dual-variant instance A: valuation domain (Appraisal/BookItem)
  - name: appraised_value
    trigger: "POST /book-items/{id}/appraisals (issue)"
    algorithm: weighted_scoring
    formula: |
      cm    = book_item.comp_median_cents
      cmult = CONDITION_MULT[book_item.condition_grade]
      prem  = FIRST_EDITION_PREMIUM if book_item.is_first_edition else 0.0
      fair_market_value_cents        = round_half_up(cm * cmult * (1 + prem))
      retail_replacement_value_cents = round_half_up(cm * RETAIL_MARKUP * cmult * (1 + prem))
      final_value_cents = fair_market_value_cents        if basis == FAIR_MARKET
                          else retail_replacement_value_cents   # basis == RETAIL_REPLACEMENT
      # Both variants use identical inputs; they diverge by the RETAIL_MARKUP factor.
    input_set: "The single BookItem named by book_item_id; requires condition_grade non-null (item GRADED)."
    constants:
      CONDITION_MULT: { POOR: 0.4, GOOD: 0.7, VERY_GOOD: 1.0, FINE: 1.4, AS_NEW: 1.8 }
      FIRST_EDITION_PREMIUM: 0.5
      RETAIL_MARKUP: 1.6
    precision: "integer cents, round_half_up"
    variants:
      - name: FAIR_MARKET
        when: "basis == FAIR_MARKET"
        difference: "No retail markup; final = comp * condition_mult * (1+premium)."
      - name: RETAIL_REPLACEMENT
        when: "basis == RETAIL_REPLACEMENT"
        difference: "Multiplies by RETAIL_MARKUP=1.6 before rounding — strictly larger for positive inputs."

  # ---- Rule 1 dual-variant instance B: consignor-payout domain (ConsignmentAgreement/Patron)
  - name: consignment_payout
    trigger: "SaleOrder confirm cascade hop 4 (ConsignmentAgreement ACTIVE -> SETTLED)"
    algorithm: aggregation
    formula: |
      # sp = the confirmed line item's sale_price_cents (gross, pre-discount) for the consigned book.
      # cp = agreement.commission_pct ; ff = agreement.flat_fee_cents
      payout_cents = round_half_up(sp * (1 - cp))               if fee_model == GROSS_COMMISSION
                     else round_half_up((sp - ff) * (1 - cp))    # fee_model == NET_COMMISSION
      # The two fee models produce different payouts for the same sale.
    input_set: "The consigned line item's sale_price_cents and its ConsignmentAgreement terms (commission_pct, flat_fee_cents)."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: GROSS_COMMISSION
        when: "agreement.fee_model == GROSS_COMMISSION"
        difference: "Commission taken on gross sale price; flat_fee_cents ignored."
      - name: NET_COMMISSION
        when: "agreement.fee_model == NET_COMMISSION"
        difference: "flat_fee_cents subtracted from the sale price BEFORE commission — smaller payout."

  # ---- Rule 2 mode (b): nested rounding order pinned (round per line, THEN sum)
  - name: order_total
    trigger: "SaleOrder create and confirm recompute"
    algorithm: aggregation
    formula: |
      # Evaluation order is FIXED: for EACH line item compute a whole-cent amount, THEN sum.
      for each line L in line_items:
        net_L    = L.sale_price_cents * (1 - L.discount_pct)
        taxed_L  = net_L * (1 + tax_pct)
        amount_L = round_half_up(taxed_L)          # ROUND PER LINE ITEM (not after summing)
      subtotal_cents = sum(amount_L over all lines) # sum of already-rounded line amounts
      total_cents    = max(0, subtotal_cents - store_credit_applied_cents)
      # "round per-line then sum" is pinned; "sum then round" is INCORRECT and can differ by cents.
    input_set: "All entries in line_items on the order; store_credit_applied_cents; tax_pct."
    constants: {}
    precision: "integer cents, round_half_up applied once per line before summation"

  # ---- Rule 2 mode (a): >=3 inputs with nested min/max
  - name: shipping_cost
    trigger: "POST /sale-orders/{id}/shipment"
    algorithm: tiered_pricing
    formula: |
      base          = BASE_CENTS[zone]                          # zone in 1..4
      billable_over = max(0, weight_grams - FREE_WEIGHT_GRAMS)
      steps         = ceil(billable_over / WEIGHT_STEP_GRAMS)
      carriage      = base + steps * PER_STEP_CENTS
      carriage      = min(CARRIAGE_CAP_CENTS, max(CARRIAGE_FLOOR_CENTS, carriage))   # clamp both ends
      if insured:
        insurance = min(INSURANCE_CAP_CENTS, max(INSURANCE_MIN_CENTS, round_half_up(declared_value_cents * INSURANCE_RATE)))
      else:
        insurance = 0
      shipping_cost_cents = carriage + insurance
    input_set: "This shipment's weight_grams, zone, declared_value_cents, insured flag."
    constants:
      BASE_CENTS: { 1: 500, 2: 800, 3: 1200, 4: 1800 }
      FREE_WEIGHT_GRAMS: 500
      WEIGHT_STEP_GRAMS: 250
      PER_STEP_CENTS: 150
      CARRIAGE_FLOOR_CENTS: 500
      CARRIAGE_CAP_CENTS: 6000
      INSURANCE_RATE: 0.02
      INSURANCE_MIN_CENTS: 200
      INSURANCE_CAP_CENTS: 5000
    precision: "integer cents, round_half_up on insurance"

  # ---- Grading: first-edition determination (boundary on printing_number)
  - name: first_edition_determination
    trigger: "POST /book-items/{id}/grade"
    algorithm: threshold
    formula: |
      is_first_edition = (stated_first_edition == true) and (printing_number <= FIRST_EDITION_MAX_PRINTING)
      # printing_number == 1 with stated_first_edition -> true; printing_number == 2 -> false.
      condition_grade = payload.condition_grade    # operator judgment, one of the 5 grades
    input_set: "The BookItem's stated_first_edition, printing_number, and the grade payload's condition_grade."
    constants:
      FIRST_EDITION_MAX_PRINTING: 1
    precision: "n/a (boolean + enum)"

  # ---- Buyback auto-approval threshold (declares AUTO_APPROVE_LIMIT_CENTS)
  - name: buyback_auto_approval
    trigger: "POST /buyback-offers (at creation)"
    algorithm: threshold
    formula: |
      auto_approved = (offer_value_cents <= AUTO_APPROVE_LIMIT_CENTS)
      status = AUTO_APPROVED if auto_approved else PENDING
      # Boundary: offer_value_cents == 5000 auto-approves (<=); 5001 stays PENDING.
    input_set: "The single BuybackOffer's offer_value_cents at creation."
    constants:
      AUTO_APPROVE_LIMIT_CENTS: 5000
    precision: "n/a (boolean)"

  # ---- Derived-field reconciliation: store credit ledger (compensating invariant #1)
  - name: store_credit_balance
    trigger: "buyback accept/void; sale-order confirm/refund"
    algorithm: aggregation
    formula: |
      Patron.store_credit_cents =
          Σ credit_amount_cents over BuybackOffer where patron_id == P and status == ACCEPTED
        − Σ store_credit_applied_cents over SaleOrder where buyer_patron_id == P and status == CONFIRMED
      # INVARIANT: any accept immediately followed by its void, and any confirm immediately followed
      # by its refund, returns Patron.store_credit_cents to its exact pre-action value. Never negative.
    input_set: "All ACCEPTED BuybackOffers and all CONFIRMED SaleOrders for the patron."
    constants: {}
    precision: "integer cents"

  # ---- Derived-field reconciliation: consignor payable ledger (compensating invariant #2)
  - name: consignor_payable_balance
    trigger: "sale-order confirm/refund (consigned line items)"
    algorithm: aggregation
    formula: |
      Patron.consignor_payable_cents =
        Σ consignment_payout over consigned line items on CONFIRMED SaleOrders
          where the consigned BookItem.consignor_id == P
      # INVARIANT: confirm accrues Σ consignment_payout; the matching refund subtracts the identical Σ,
      # so a confirm+refund pair leaves consignor_payable_cents unchanged. Never negative.
    input_set: "Consigned line items across the patron's CONFIRMED SaleOrders."
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The role in X-User-Role is permitted to call this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path exists, validated left-to-right"
    error_id: "ERR_PATRON_NOT_FOUND / ERR_INTAKE_LOT_NOT_FOUND / ERR_BOOK_ITEM_NOT_FOUND / ERR_AGREEMENT_NOT_FOUND / ERR_LISTING_NOT_FOUND / ERR_OFFER_NOT_FOUND / ERR_FAIR_NOT_FOUND / ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_referential
    check: "FK fields in the request body reference existing resources (consignor_id, book_item_id, patron_id, fair_event_id, sale_order_id, intake_lot_id)"
    error_id: "ERR_BOOK_ITEM_NOT_FOUND / ERR_PATRON_NOT_FOUND / ERR_INTAKE_LOT_NOT_FOUND / ERR_FAIR_NOT_FOUND / ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints carrying FK body fields"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, numbers non-negative, and window_end > window_start / pack_end > pack_start"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_WINDOW"
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition (grade requires INTAKE; appraisal issue requires GRADED; listing requires APPRAISED; SaleOrder confirm requires every line item's BookItem.status == LISTED)"
    error_id: "ERR_ITEM_NOT_LISTED / ERR_ITEM_NOT_GRADED / ERR_ITEM_NOT_APPRAISED / ERR_INVALID_STATE / ERR_ORDER_NOT_CONFIRMED / ERR_AGREEMENT_NOT_AMENDABLE / ERR_OFFER_NOT_ACCEPTABLE / ERR_OFFER_NOT_VOIDABLE / ERR_EMPTY_LOT / ERR_LOT_ITEMS_NOT_APPRAISED / ERR_EMPTY_ORDER"
    http_status: 409
    applies_to: "state-transition endpoints"
    note: "PRIORITY-PAIR CONFLICT #1 (Rule 5): on SaleOrder confirm, ERR_ITEM_NOT_LISTED (this row, category=state) OUTRANKS ERR_CONSIGNMENT_NOT_ACTIVE (priority 7, category=business_referential)."

  - priority: 7
    category: business_referential
    check: "For a consigned line item on SaleOrder confirm, the item's ConsignmentAgreement.status == ACTIVE"
    error_id: ERR_CONSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sale-orders/{id}/confirm"
    note: "Lower priority than the state check at priority 6 — see PRIORITY-PAIR CONFLICT #1."

  - priority: 8
    category: business_temporal
    check: |
      Resource temporal-overlap check #1 (BoothSlot on a FairEvent booth table — HALF-OPEN, adjacency allowed):
      reject if any existing BoothSlot E with the same fair_event_id AND same booth_table
      satisfies (E.window_start < new.window_end) AND (new.window_start < E.window_end).
      Touching intervals (E.window_end == new.window_start) do NOT overlap.
    error_id: ERR_BOOTH_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /fair-events/{id}/booth-slots"
    note: "PRIORITY-PAIR CONFLICT #2 (Rule 5): ERR_BOOTH_SLOT_CONFLICT (this row, category=business_temporal) OUTRANKS ERR_FAIR_CAPACITY_EXCEEDED (priority 9, category=business_constraint)."

  - priority: 9
    category: business_constraint
    check: |
      Fair aggregate-capacity check: for a new BoothSlot, Σ display_item_count over all existing BoothSlots
      on the same fair_event_id whose window overlaps the new window (half-open), PLUS the new display_item_count,
      must be <= FairEvent.table_capacity.
    error_id: ERR_FAIR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fair-events/{id}/booth-slots"
    note: "Lower priority than booth overlap at priority 8 — see PRIORITY-PAIR CONFLICT #2."

  - priority: 10
    category: business_temporal
    check: |
      Resource temporal-overlap check #2 (Shipment packing slot on a packing_station_label — BUFFER semantics):
      reject if any existing Shipment E with the same packing_station_label violates the required idle gap, i.e.
      NOT ((new.pack_start >= E.pack_end + PACK_BUFFER_MINUTES) OR (E.pack_start >= new.pack_end + PACK_BUFFER_MINUTES)).
      Exactly-buffer-apart is ACCEPTED (the comparison is >=). PACK_BUFFER_MINUTES = 15.
    error_id: ERR_PACKING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /sale-orders/{id}/shipment"

  - priority: 11
    category: business_fiscal
    check: "On SaleOrder confirm, store_credit_applied_cents <= buyer Patron.store_credit_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /sale-orders/{id}/confirm"

  - priority: 12
    category: business_fiscal
    check: "On buyback void, buyer's current store_credit_cents >= the offer's credit_amount_cents (credit not yet spent)"
    error_id: ERR_CREDIT_ALREADY_SPENT
    http_status: 402
    applies_to: "POST /buyback-offers/{id}/void"

  - priority: 13
    category: business_constraint
    check: "Patron.email is unique across Patrons"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /patrons"

  - priority: 14
    category: business_constraint
    check: "A BookItem may have at most one CatalogListing and at most one ConsignmentAgreement"
    error_id: ERR_DUPLICATE_LISTING
    http_status: 409
    applies_to: "POST /book-items/{id}/listing, POST /consignment-agreements"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /book-items/{id}/appraisals, POST /consignment-agreements/{id}/amend, PATCH /catalog-listings/{id}"

# =============================================================================
# §1.5 API Endpoint Table (35 endpoints)
# =============================================================================
endpoints:
  # --- Patron ---
  - method: POST
    path: "/patrons"
    description: "Register a Patron (consignor / buyer / seller)"
    roles: [StoreClerk, Manager]
    code: 201
    input: [display_name, email, "default_commission_pct?"]
    output: Patron
    side_effects: ["status=ACTIVE, store_credit_cents=0, consignor_payable_cents=0"]

  - method: GET
    path: "/patrons/{id}"
    description: "Get a Patron (includes derived ledger balances)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: Patron
    side_effects: []

  # --- IntakeLot ---
  - method: POST
    path: "/intake-lots"
    description: "Open an intake lot"
    roles: [StoreClerk, Manager]
    code: 201
    input: [acquisition_channel, "consignor_id?"]
    output: IntakeLot
    side_effects: ["status=DRAFT, item_count=0"]

  - method: GET
    path: "/intake-lots/{id}"
    description: "Get an intake lot"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: IntakeLot
    side_effects: []

  - method: POST
    path: "/intake-lots/{id}/book-items"
    description: "Intake a BookItem into the lot"
    roles: [StoreClerk]
    code: 201
    input: [title, author, comp_median_cents, "printing_number?", "stated_first_edition?"]
    output: BookItem
    side_effects: ["status=INTAKE; consignor_id copied from lot; lot.item_count += 1; pushes provenance {event_type:INTAKE}"]

  - method: POST
    path: "/intake-lots/{id}/settle"
    description: "Settle a fully-appraised lot"
    roles: [Manager]
    code: 200
    input: []
    output: IntakeLot
    side_effects: ["status -> SETTLED (requires item_count>=1 and all items APPRAISED)"]

  - method: POST
    path: "/intake-lots/{id}/reject"
    description: "Reject a lot (depth-2 cascade)"
    roles: [Manager]
    code: 200
    input: []
    output: IntakeLot
    side_effects:
      - "status -> REJECTED"
      - "cascade hop 1: non-SOLD BookItems in lot -> WITHDRAWN"
      - "cascade hop 2: their ISSUED Appraisals -> VOIDED; appraised_value_cents cleared"

  # --- BookItem ---
  - method: GET
    path: "/book-items/{id}"
    description: "Get a BookItem (includes provenance array)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: BookItem
    side_effects: []

  - method: GET
    path: "/book-items"
    description: "List/filter BookItems (reverse-lookup by lot or consignor)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: ["intake_lot_id?", "consignor_id?", "status?", "limit?", "offset?"]
    output: "BookItem[]"
    side_effects: []

  - method: POST
    path: "/book-items/{id}/grade"
    description: "Grade condition and determine first-edition"
    roles: [Appraiser]
    code: 200
    input: [condition_grade]
    output: BookItem
    side_effects: ["status INTAKE -> GRADED; sets condition_grade, is_first_edition; pushes provenance {event_type:GRADED}"]

  - method: POST
    path: "/book-items/{id}/appraisals"
    description: "Issue an appraisal (supersedes prior; OCC on BookItem.version)"
    roles: [Appraiser]
    code: 201
    input: [basis, expected_book_item_version]
    output: Appraisal
    side_effects:
      - "status=ISSUED; computes fair_market/retail_replacement/final_value_cents"
      - "supersedes any prior ISSUED Appraisal for the item -> SUPERSEDED"
      - "BookItem GRADED -> APPRAISED; copies final_value_cents into appraised_value_cents; pushes provenance {event_type:APPRAISED}"
      - "increments BookItem.version by 1"

  - method: GET
    path: "/book-items/{id}/appraisals"
    description: "List appraisals for an item (reverse FK)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appraisal[]"
    side_effects: []

  - method: POST
    path: "/book-items/{id}/listing"
    description: "Create the catalog listing (requires item APPRAISED)"
    roles: [StoreClerk]
    code: 201
    input: [list_price_cents]
    output: CatalogListing
    side_effects: ["online_status=DRAFT, shop_status=DRAFT; BookItem APPRAISED -> LISTED; pushes provenance {event_type:LISTED}"]

  - method: GET
    path: "/book-items/{id}/listing"
    description: "Get the item's catalog listing (reverse FK; array of 0..1)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: "CatalogListing[]"
    side_effects: []

  # --- ConsignmentAgreement ---
  - method: POST
    path: "/consignment-agreements"
    description: "Propose a consignment agreement for an item"
    roles: [Manager]
    code: 201
    input: [patron_id, book_item_id, commission_pct, "fee_model?", "flat_fee_cents?"]
    output: ConsignmentAgreement
    side_effects: ["status=PROPOSED (at most one agreement per book item)"]

  - method: GET
    path: "/consignment-agreements/{id}"
    description: "Get a consignment agreement"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []

  - method: GET
    path: "/consignment-agreements"
    description: "List/filter consignment agreements (reverse FK by patron or item)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: ["patron_id?", "book_item_id?", "status?", "limit?", "offset?"]
    output: "ConsignmentAgreement[]"
    side_effects: []

  - method: POST
    path: "/consignment-agreements/{id}/amend"
    description: "Amend terms (cyclic PROPOSED<->AMENDED; OCC on agreement.version)"
    roles: [Manager]
    code: 200
    input: ["commission_pct?", "fee_model?", "flat_fee_cents?", expected_consignment_agreement_version]
    output: ConsignmentAgreement
    side_effects: ["status -> AMENDED; amendment_no += 1; increments ConsignmentAgreement.version by 1; updates terms"]

  - method: POST
    path: "/consignment-agreements/{id}/activate"
    description: "Activate the agreement (requires item APPRAISED/LISTED)"
    roles: [Manager]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status -> ACTIVE; pushes provenance {event_type:CONSIGNED}"]

  # --- CatalogListing ---
  - method: PATCH
    path: "/catalog-listings/{id}"
    description: "Update listing price and/or an independent channel status axis (OCC on listing.version)"
    roles: [StoreClerk]
    code: 200
    input: ["list_price_cents?", "online_status?", "shop_status?", expected_catalog_listing_version]
    output: CatalogListing
    side_effects: ["applies the supplied axis change(s); increments CatalogListing.version by 1"]

  # --- BuybackOffer ---
  - method: POST
    path: "/buyback-offers"
    description: "Create a buyback offer (auto-approves at/under limit)"
    roles: [StoreClerk, Manager]
    code: 201
    input: [patron_id, offer_value_cents, "book_item_id?"]
    output: BuybackOffer
    side_effects: ["status=PENDING; if offer_value_cents <= AUTO_APPROVE_LIMIT_CENTS -> AUTO_APPROVED and auto_approved=true"]

  - method: GET
    path: "/buyback-offers/{id}"
    description: "Get a buyback offer"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: BuybackOffer
    side_effects: []

  - method: GET
    path: "/buyback-offers"
    description: "List/filter buyback offers (reverse FK by patron or item)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: ["patron_id?", "book_item_id?", "status?", "limit?", "offset?"]
    output: "BuybackOffer[]"
    side_effects: []

  - method: POST
    path: "/buyback-offers/{id}/accept"
    description: "Accept a buyback offer -> issues store credit (invariant)"
    roles: [Manager]
    code: 200
    input: []
    output: BuybackOffer
    side_effects: ["status -> ACCEPTED; credit_amount_cents=offer_value_cents; Patron.store_credit_cents += credit_amount_cents; pushes provenance {event_type:BUYBACK} if book_item_id set"]

  - method: POST
    path: "/buyback-offers/{id}/void"
    description: "Void an accepted buyback -> reverses store credit (compensation)"
    roles: [Manager]
    code: 200
    input: []
    output: BuybackOffer
    side_effects: ["status -> VOIDED; Patron.store_credit_cents -= credit_amount_cents (requires balance >= credit_amount_cents)"]

  # --- FairEvent / BoothSlot ---
  - method: POST
    path: "/fair-events"
    description: "Create a fair/show"
    roles: [Manager]
    code: 201
    input: [name, table_capacity]
    output: FairEvent
    side_effects: ["reserved_display_count=0"]

  - method: GET
    path: "/fair-events/{id}"
    description: "Get a fair/show"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: FairEvent
    side_effects: []

  - method: POST
    path: "/fair-events/{id}/booth-slots"
    description: "Reserve a booth slot (temporal overlap + aggregate capacity)"
    roles: [StoreClerk, Manager]
    code: 201
    input: [booth_table, window_start, window_end, "display_item_count?"]
    output: BoothSlot
    side_effects: ["status=RESERVED; updates FairEvent.reserved_display_count"]

  - method: GET
    path: "/fair-events/{id}/booth-slots"
    description: "List booth slots for a fair (reverse FK)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: "BoothSlot[]"
    side_effects: []

  # --- SaleOrder / Shipment ---
  - method: POST
    path: "/sale-orders"
    description: "Draft a sale order (computes subtotal/total via order_total)"
    roles: [StoreClerk, Manager]
    code: 201
    input: [channel, line_items, "buyer_patron_id?", "tax_pct?", "store_credit_applied_cents?"]
    output: SaleOrder
    side_effects: ["status=DRAFT; computes subtotal_cents, total_cents"]

  - method: GET
    path: "/sale-orders/{id}"
    description: "Get a sale order"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: SaleOrder
    side_effects: []

  - method: POST
    path: "/sale-orders/{id}/confirm"
    description: "Confirm the order (depth-3 cascade + both ledger invariants)"
    roles: [Manager]
    code: 200
    input: []
    output: SaleOrder
    side_effects:
      - "status -> CONFIRMED"
      - "each line item's BookItem -> SOLD; its CatalogListing sold axis -> SOLD"
      - "each consigned item's ConsignmentAgreement ACTIVE -> SETTLED; accrues consignment_payout into consignor payable"
      - "buyer Patron.store_credit_cents -= store_credit_applied_cents"

  - method: POST
    path: "/sale-orders/{id}/refund"
    description: "Refund a confirmed order (full compensation)"
    roles: [Manager]
    code: 200
    input: []
    output: SaleOrder
    side_effects:
      - "status -> REFUNDED"
      - "BookItems SOLD -> LISTED; listings restored; agreements SETTLED -> ACTIVE"
      - "store credit and consignor payable reversed exactly"

  - method: POST
    path: "/sale-orders/{id}/shipment"
    description: "Pack/ship a confirmed order (shipping_cost + packing-slot buffer overlap)"
    roles: [StoreClerk]
    code: 201
    input: [packing_station_label, weight_grams, zone, pack_start, pack_end, "declared_value_cents?", "insured?"]
    output: Shipment
    side_effects: ["status=PACKED; computes shipping_cost_cents"]

  - method: GET
    path: "/sale-orders/{id}/shipment"
    description: "Get the order's shipment (reverse FK; array of 0..1)"
    roles: [Patron, Appraiser, StoreClerk, Manager]
    code: 200
    input: []
    output: "Shipment[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog (32 codes)
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role in X-User-Role may not perform this operation" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, negative amount, or wrong type" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "window_end <= window_start or pack_end <= pack_start" }
  # --- not found ---
  - { id: ERR_PATRON_NOT_FOUND, http: 404, condition: "Referenced Patron id does not exist" }
  - { id: ERR_INTAKE_LOT_NOT_FOUND, http: 404, condition: "Referenced IntakeLot id does not exist" }
  - { id: ERR_BOOK_ITEM_NOT_FOUND, http: 404, condition: "Referenced BookItem id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Referenced ConsignmentAgreement id does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "Referenced CatalogListing id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "Referenced BuybackOffer id does not exist" }
  - { id: ERR_FAIR_NOT_FOUND, http: 404, condition: "Referenced FairEvent id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Referenced SaleOrder id does not exist" }
  # --- state ---
  - { id: ERR_ITEM_NOT_GRADED, http: 409, condition: "Operation requires BookItem status INTAKE (grade) or GRADED (appraise); wrong state" }
  - { id: ERR_ITEM_NOT_APPRAISED, http: 409, condition: "Listing/consignment-activation requires BookItem status APPRAISED (or LISTED for activate)" }
  - { id: ERR_ITEM_NOT_LISTED, http: 409, condition: "SaleOrder confirm requires every line item's BookItem status LISTED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not permitted from the resource's current state (e.g., settle a non-DRAFT lot, activate an ACTIVE agreement, illegal catalog axis change)" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "Refund requires SaleOrder status CONFIRMED" }
  - { id: ERR_AGREEMENT_NOT_AMENDABLE, http: 409, condition: "Amend requires agreement status PROPOSED or AMENDED" }
  - { id: ERR_OFFER_NOT_ACCEPTABLE, http: 409, condition: "Accept requires offer status PENDING or AUTO_APPROVED" }
  - { id: ERR_OFFER_NOT_VOIDABLE, http: 409, condition: "Void requires offer status ACCEPTED" }
  - { id: ERR_EMPTY_LOT, http: 409, condition: "Settle requires the lot to contain at least one BookItem" }
  - { id: ERR_LOT_ITEMS_NOT_APPRAISED, http: 409, condition: "Settle requires every BookItem in the lot to be APPRAISED" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Confirm requires line_items to be non-empty" }
  # --- business ---
  - { id: ERR_CONSIGNMENT_NOT_ACTIVE, http: 409, condition: "A consigned line item's ConsignmentAgreement is not ACTIVE at confirm" }
  - { id: ERR_BOOTH_SLOT_CONFLICT, http: 409, condition: "New booth slot overlaps an existing slot on the same table (half-open)" }
  - { id: ERR_FAIR_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping reserved display_item_count plus the new slot exceeds FairEvent.table_capacity" }
  - { id: ERR_PACKING_SLOT_CONFLICT, http: 409, condition: "New packing slot is within the cleanup buffer of another shipment on the same packing_station_label" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 402, condition: "store_credit_applied_cents exceeds the buyer's store_credit_cents" }
  - { id: ERR_CREDIT_ALREADY_SPENT, http: 402, condition: "Buyback void would drive store_credit_cents negative (credit already spent)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Patron email already registered" }
  - { id: ERR_DUPLICATE_LISTING, http: 409, condition: "BookItem already has a CatalogListing or a ConsignmentAgreement" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patron
    description: "Consignor / buyer / seller acting on their own records; read-only over most surfaces"
    identity: "entity_backed:Patron"
    exclusive_operations: []
    shared_operations:
      - "GET /patrons/{id} — view own profile and ledger balances"
      - "GET /book-items, GET /book-items/{id} — browse catalog inventory"
      - "GET /consignment-agreements, GET /consignment-agreements/{id} — view own agreements"
      - "GET /buyback-offers, GET /buyback-offers/{id} — view own offers"
      - "GET /sale-orders/{id}, GET /sale-orders/{id}/shipment — view own orders"

  - name: Appraiser
    description: "Grades condition/first-edition and issues appraisals"
    identity: "opaque"
    exclusive_operations:
      - "POST /book-items/{id}/grade — grade an item"
      - "POST /book-items/{id}/appraisals — issue an appraisal"
    shared_operations:
      - "GET endpoints (read)"

  - name: StoreClerk
    description: "Front-of-house: intake, listing, catalog edits, buyback intake, booth reservations, sale drafting, packing"
    identity: "opaque"
    exclusive_operations:
      - "POST /intake-lots/{id}/book-items — intake a book"
      - "POST /book-items/{id}/listing — create a catalog listing"
      - "PATCH /catalog-listings/{id} — edit listing price/status"
      - "POST /sale-orders/{id}/shipment — pack/ship an order"
    shared_operations:
      - "POST /patrons, POST /intake-lots, POST /buyback-offers, POST /fair-events/{id}/booth-slots, POST /sale-orders (shared with Manager)"
      - "GET endpoints (read)"

  - name: Manager
    description: "Back-of-house authority: lot settlement/rejection, consignment lifecycle, buyback accept/void, fair creation, sale confirm/refund"
    identity: "opaque"
    exclusive_operations:
      - "POST /intake-lots/{id}/settle, POST /intake-lots/{id}/reject"
      - "POST /consignment-agreements, POST /consignment-agreements/{id}/amend, POST /consignment-agreements/{id}/activate"
      - "POST /buyback-offers/{id}/accept, POST /buyback-offers/{id}/void"
      - "POST /fair-events"
      - "POST /sale-orders/{id}/confirm, POST /sale-orders/{id}/refund"
    shared_operations:
      - "POST /patrons, POST /intake-lots, POST /buyback-offers, POST /fair-events/{id}/booth-slots, POST /sale-orders (shared with StoreClerk)"
      - "GET endpoints (read)"
