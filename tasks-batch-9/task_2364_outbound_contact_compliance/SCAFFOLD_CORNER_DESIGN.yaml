- section: validations
  instances:
  - name: contact_create_with_duplicate_phone_number_rejected
    claim_type: Violation → Error
    grounds:
    - validations[priority=100]
    - errors[ERR_DUPLICATE_PHONE_NUMBER]
    - entities.Contact.fields.phone_number
    distinguishing_aspect: The uniqueness rule is on phone_number alone, so a second Contact reusing the number is refused with ERR_DUPLICATE_PHONE_NUMBER even though its state_code, offset and phone_type all differ.
    test_recipe:
      setup:
      - clock at 2026-08-03T00:00:00Z
      - one CA WIRELESS contact on +14155550101
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      trigger:
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: NV
          utc_offset_minutes: -480
          time_zone_label: America/Los_Angeles
          phone_type: LANDLINE
          attempt_budget_total: 2
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 409 with data.error_id == "ERR_DUPLICATE_PHONE_NUMBER"
      - GET /compliance/contacts/${c1_id} still shows state_code CA and version 1
      - only one Contact row exists for +14155550101
  - name: second_pending_revocation_for_the_same_contact_rejected
    claim_type: Violation → Error
    grounds:
    - validations[priority=102]
    - errors[ERR_DUPLICATE_REVOCATION_PENDING]
    - entities.RevocationRequest.fields.intake_status
    distinguishing_aspect: The duplicate guard looks only at intake_status RECEIVED for the same contact, so a second intake is refused while the first is still un-adjudicated.
    test_recipe:
      setup:
      - clock at 2026-08-03T14:00:00Z; one CA contact with an ACTIVE VOICE consent
      - one RevocationRequest with intake_status RECEIVED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T14:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - call: POST /compliance/revocation-requests
        payload:
          contact_id: ${c1_id}
          channel_received: SMS
          method: REPLY_STOP
          scope: ALL_CHANNELS
          received_note: STOP
        as: ComplianceOfficer
        captures:
          rev_id: $.data.id
      trigger:
      - call: POST /compliance/revocation-requests
        payload:
          contact_id: ${c1_id}
          channel_received: EMAIL
          method: EMAIL_REQUEST
          scope: VOICE
          received_note: Please stop calling
        as: ComplianceOfficer
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 409 with data.error_id == "ERR_DUPLICATE_REVOCATION_PENDING"
      - RevocationRequest.${rev_id}.intake_status == RECEIVED and scope == ALL_CHANNELS (untouched)
      - GET /compliance/contacts/${c1_id}/revocation-requests returns total_count == 1
  - name: reply_stop_on_a_non_sms_channel_rejected
    claim_type: Violation → Error
    grounds:
    - validations[priority=103]
    - errors[ERR_METHOD_CHANNEL_MISMATCH]
    - entities.RevocationRequest.fields.method
    distinguishing_aspect: REPLY_STOP is a reasonable method only on channel_received SMS, so the same method arriving on EMAIL is refused with ERR_METHOD_CHANNEL_MISMATCH rather than accepted as a reasonable revocation.
