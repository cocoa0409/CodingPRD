              as: SchedulingManager
              captures: { ag1_id: "$.data.id" }
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-MON", skill_code: "VOICE_EN", start_time_local: "08:00", duration_minutes: 480, days_of_week: [0], slots_total: 2, unpaid_break_minutes: 30 }
              as: SchedulingManager
              captures: { t_mon: "$.data.id" }
            - call: "POST /schedule-shifts"
