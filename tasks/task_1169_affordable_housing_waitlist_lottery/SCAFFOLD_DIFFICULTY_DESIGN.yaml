          - calculations.certified_income_annualization
        distinguishing_aspect: |
          Metric = income cents vs limit cents, endpoint = POST /income-certifications/{id}/advance
          (CERTIFY): per-source rounding lifts $39999.96 to exactly 40000 dollars == the 4000000
          limit; the inclusive (<=) boundary means CERTIFY succeeds with ami_percentage_bp == 10000
          rather than failing with ERR_OVER_INCOME.
        test_recipe:
          setup:
