      - name: roster_threshold_exact_equality_elects_slot
        grounds:
          - calculations.election_threshold_votes
          - calculations.election_outcome_resolution
          - entities.Ballot.fields.threshold_votes_final
          - endpoints[POST /ballots/{id}/audit-decision]
        distinguishing_aspect: |
          A different metric (integer vote counts, not calendar years) on a different endpoint
          (POST /ballots/{id}/audit-decision, not POST /candidacies). With
          credentialed_roster_at_close == 4 the final bar is ceil(4 * 0.75) == 3; slot1 holds
          exactly 3 votes and must be ELECTED because the qualifying comparison is >=, while slot2
          holds 1 vote and is NOT_ELECTED. One vote fewer on slot1 would have produced NO_ELECTION,
          so the equality case is the whole boundary.
        test_recipe:
          setup:
            - "EligibilityRule (PLAYER, MODERN) with election_threshold_pct 0.75, carryover_min_pct 0.05, runoff_floor_pct 0.25."
            - "VoterBloc WRITERS with FOUR credentialed electors and min_participation_pct 0.50."
            - "Two advanced candidacies, so slot_count 2 and max_votes_per_elector 1."
            - "e1, e2 and e3 select slot1; e4 selects slot2, so all four submissions are COUNTED and credentialed_roster_at_close == 4."
            - "The ballot is CLOSED and tallied: ballots_cast 4, threshold_votes_provisional ceil(4 * 0.75) == 3, slot1 votes_received 3 with vote_pct 0.75, slot2 votes_received 1 with vote_pct 0.25."
          setup_api_calls:
            - call: "POST /eligibility-rules"
