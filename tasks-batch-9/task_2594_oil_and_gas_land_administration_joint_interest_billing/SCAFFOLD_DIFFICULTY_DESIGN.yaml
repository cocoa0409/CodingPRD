            - "Two CAPITAL AFEs on the well, each with estimated_cost_cents 2000000, non_consent_penalty_multiple 3.0 and election_deadline_date 2026-07-31: AFE-2026-A with minimum_consent_pct 0.800000 and AFE-2026-B with minimum_consent_pct 0.800001"
            - "On each AFE, OA submits CONSENT and OB submits NON_CONSENT, so every non-operator holder has filed and the window may be closed early"
