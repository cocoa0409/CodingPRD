  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_half_open_window_adjacency_vs_overlap
        grounds:
          - errors[ERR_INSPECTION_WINDOW_CONFLICT]
          - entities.Inspection.fields.duration_days
          - entities.Inspection.fields.scheduled_date
        distinguishing_aspect: |
          Resource Inspector with half-open interval semantics
          [scheduled_date, scheduled_date + duration_days): an existing BOOKED
          window [2026-08-10, +2d) rejects a new booking starting 2026-08-11
          (overlap) but accepts one starting 2026-08-12 (adjacent, touching
          endpoints do not overlap because the interval is half-open).
