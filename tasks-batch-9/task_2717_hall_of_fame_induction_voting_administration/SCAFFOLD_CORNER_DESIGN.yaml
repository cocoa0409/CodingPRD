  - section: endpoints
    instances:
      - name: candidate_create_read_and_patch_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /candidates]
          - endpoints[GET /candidates/{id}]
          - endpoints[PATCH /candidates/{id}]
          - entities.Candidate
        distinguishing_aspect: |
          Candidate is the one entity with a full create-read-update surface, and the patch is
          partial: sending only career_seasons and career_metric_value leaves full_name, category and
          retirement_year untouched, bumps version 1 -> 2 and moves updated_at while created_at holds.
          No DELETE endpoint is declared anywhere in §1.5, so the D of CRUD is intentionally absent.
        test_recipe:
          setup:
            - "An empty database; no cycle, rule or elector is required for candidate maintenance."
          setup_api_calls: []
          trigger:
            - call: "POST /candidates"
              payload: { full_name: "Player Crud", category: "PLAYER", retirement_year: 2018, career_seasons: 15, career_metric_value: 3000, is_deceased: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cand9: "$.data.id", v1: "$.data.version" }
            - call: "GET /candidates/${cand9}"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "PATCH /candidates/${cand9}"
              payload: { career_seasons: 16, career_metric_value: 3100 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { v2: "$.data.version" }
          assert:
            - "the create returns HTTP 201 and the read returns HTTP 200 with identical stored values"
            - "the read echoes full_name == Player Crud, category == PLAYER, retirement_year == 2018"
            - "the read shows hof_status == NOT_INDUCTED and ballot_appearances_used == 0"
            - "the patch returns HTTP 200"
            - "${v1} == 1 and ${v2} == 2"
            - "Candidate.${cand9}.career_seasons == 16"
            - "Candidate.${cand9}.career_metric_value == 3100"
            - "Candidate.${cand9}.full_name == Player Crud"
            - "Candidate.${cand9}.retirement_year == 2018"

      - name: ballot_certify_action_opens_the_round_and_publishes_the_vote_cap
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /ballots/{id}/certify]
          - state_machines.Ballot.DRAFT_to_OPEN
          - calculations.max_votes_per_elector_for_round
          - entities.Ballot.fields.max_votes_per_elector
        distinguishing_aspect: |
          certify is a pure action endpoint: no body, and its whole job is to move voting_status
          DRAFT -> OPEN once slot_count >= 1 and the clock sits inside [opens_at, closes_at). It also
          exposes the vote cap the round was built with - one LISTED slot, no VETERANS slot, so
          floor(1/2) is clamped up to MIN_VOTES_FLOOR and max_votes_per_elector is 1, not 0.
        test_recipe:
          setup:
            - "A BALLOTING 2026 cycle with one DRAFT ballot printing a single LISTED slot."
            - "opens_at 2026-08-01 and closes_at 2026-08-20 with the clock at 2026-08-01."
            - "The ballot is at version 1 and tally_status NOT_TALLIED."
          setup_api_calls:
            - call: "POST /eligibility-rules"
              payload: { category: "PLAYER", pathway: "MODERN", waiting_period_years: 5, min_career_seasons: 10, min_career_metric: 2000, max_ballot_appearances: 3, election_threshold_pct: 0.75, carryover_min_pct: 0.05, runoff_floor_pct: 0.25 }
