  # =========================================================================
  # RULE 5 — validation priority conflicts across different category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_referential_on_schedule
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NEWSPAPER_NOT_QUALIFIED]
        distinguishing_aspect: |
          Category pair STATE (p4) vs BUSINESS_REFERENTIAL (p5): scheduling a DRAFT notice (wrong
          state) against an UNQUALIFIED newspaper triggers both, and the higher-priority state check
          wins -> ERR_INVALID_STATE (409), not ERR_NEWSPAPER_NOT_QUALIFIED.
        test_recipe:
          setup:
            - "UNQUALIFIED newspaper (circulation_qualified=false) in SPRINGFIELD"
            - "PROBATE requirement min_insertions=2"
            - "A PROBATE notice still in DRAFT (never submitted)"
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Pennysaver", county: "SPRINGFIELD", circulation_qualified: false, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id", notice_v: "$.data.version"}
          trigger:
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"
            - "Notice.${notice_id}.status == DRAFT"

      - name: temporal_beats_constraint_on_schedule
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INSERTION_AFTER_DEADLINE]
          - errors[ERR_EDITION_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair BUSINESS_TEMPORAL (p7) vs BUSINESS_CONSTRAINT (p8): a BID notice whose single
          insertion date is BOTH after the statutory deadline cutoff AND would overflow the edition
          line capacity triggers both; the temporal check wins -> ERR_INSERTION_AFTER_DEADLINE (422),
          not ERR_EDITION_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Qualified newspaper with small edition_line_capacity=5"
            - "BID requirement min_insertions=1, min_days_before_deadline=10"
            - "Notice X (BID, line_count 3) already SCHEDULED on 2026-03-01, occupying 3 of 5 edition lines"
            - "Notice Y (BID, line_count 3) PROOF_APPROVED with deadline 2026-03-05 (cutoff 2026-02-23) so 03-01 is past deadline"
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 5, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "BID", county: "SPRINGFIELD", min_insertions: 1, min_days_before_deadline: 10 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "BID", county: "SPRINGFIELD", title: "Bid X", body_text: "NOTICE OF FORECLOSURE SALE. The property secured by the deed of trust will be sold at auction today.", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { x_id: "$.data.id"}
            - call: "POST /notices/${x_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${x_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { x_proof: "$.data[0].id"}
            - call: "POST /proofs/${x_proof}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${x_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { x_v: "$.data.version"}
            - call: "POST /notices/${x_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${x_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "BID", county: "SPRINGFIELD", title: "Bid Y", body_text: "NOTICE OF FORECLOSURE SALE. The property secured by the deed of trust will be sold at auction today.", deadline_date: "2026-03-05" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { y_id: "$.data.id"}
            - call: "POST /notices/${y_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${y_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { y_proof: "$.data[0].id"}
            - call: "POST /proofs/${y_proof}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${y_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { y_v: "$.data.version"}
          trigger:
            - call: "POST /notices/${y_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${y_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "response.error_id == ERR_INSERTION_AFTER_DEADLINE"
            - "response.http_status == 422"
            - "Notice.${y_id}.status == PROOF_APPROVED"

  # =========================================================================
  # RULE 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: insertions_published_reaches_required_boundary
        grounds:
          - state_machines.Notice.SCHEDULED_to_RUNNING
          - state_machines.Notice.RUNNING_to_PUBLISHED
          - entities.Notice.fields.insertions_published
        distinguishing_aspect: |
          COUNT metric on the /publish endpoint: at insertions_published == 1 (< required 2) the
          notice is RUNNING with no affidavit; the SECOND publish makes insertions_published == 2
          (>= required) and only then bubbles to PUBLISHED and mints the affidavit -- boundary is
          '>= required', tested exactly at the crossing.
        test_recipe:
          setup:
            - "A PROBATE notice (required_insertions=2) scheduled; first insertion already PUBLISHED (RUNNING, insertions_published=1, no affidavit yet)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id", ins2_id: "$.data[1].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
            - call: "GET /notices/${notice_id}/affidavits"
              as: Publisher
              as_user_id: "${np_id}"
              captures: { aff_count_before: "$.data"}
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins2_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
          assert:
            - "before trigger: Notice.${notice_id}.status == RUNNING and Notice.${notice_id}.insertions_published == 1 and GET /notices/${notice_id}/affidavits returns 0 rows"
            - "Notice.${notice_id}.insertions_published == 2"
            - "Notice.${notice_id}.status == PUBLISHED"
            - "GET /notices/${notice_id}/affidavits returns exactly 1 row"

      - name: last_insertion_date_deadline_cutoff_boundary
        grounds:
          - calculations.insertion_schedule
          - validations[priority=7]
          - errors[ERR_INSERTION_AFTER_DEADLINE]
        distinguishing_aspect: |
          DAYS metric on the /schedule endpoint (different metric and endpoint than the count
          boundary above): with min_days_before_deadline=7 and last insertion 2026-03-15, a deadline
          of 2026-03-21 (cutoff 03-14) rejects because 03-15 > 03-14; a deadline of 2026-03-22
