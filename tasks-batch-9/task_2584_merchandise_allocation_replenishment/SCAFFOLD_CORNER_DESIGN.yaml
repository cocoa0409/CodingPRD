            - "POST /allocation/_run-assortment-detection returns 200 as Allocator and again as AllocationManager, and POST /allocation/performance-snapshots returns 201 under both roles as well"
            - "The final StoreOperator read of its own position and the PlanningAdmin read of the item agree: 0101 is COMPLETE, 0102 is COMPLETE, and Item.lifecycle_state has re-derived from BROKEN to ACTIVE"
      - name: segregation_of_duties_binds_the_author_not_the_executor_and_spares_system_proposals
        claim_type: segregation_of_duties
        grounds:
          - validations[priority:12]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
          - entities.AllocationRun.fields.proposed_by_user_id
          - entities.TransferRecommendation.fields.proposed_by_user_id
          - entities.TransferRecommendation.fields.approved_by_user_id
        distinguishing_aspect: |
          The role model is segregation_of_duties, which means authorisation is not decided by role alone:
          an AllocationManager holding the correct role is still refused when its X-User-ID equals the
          proposer's. Both guarded steps are exercised - run commit against run.proposed_by_user_id and
          transfer approve against recommendation.proposed_by_user_id - and the rung is pinned from both
          sides, because rung 12 sits between two neighbours it is easy to confuse it with: a LOCKED program
          answers rung 9 for the very same self-commit, and an already-COMMITTED run answers rung 8, so the
          same call returns three different codes depending on state. The exemption is the other half: the
          CONSOLIDATION transfer created by an assortment action carries proposed_by_user_id = 'system', so
          the manager who ran the detection sweep AND executed the action may still approve the transfer that
          execution produced - the rule compares against the recorded proposer, not against whoever caused
          the row to exist. That same transfer's benefit ratio is 6690bp against a 15000bp bar, so it also
          proves the two CONSOLIDATION exemptions (rung 12 and rung 34) are independent.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE (transfer_min_ratio_bp defaults to 15000) with stores 0101(A,URBAN,freight 41.00,sell-through 6500), 0102(B,URBAN,freight 38.00,5800), 0103(C,SUBURBAN,freight 42.00,4200)"
            - "Shelf plans: 0101 capacity 48 / presentation minimum 6, 0102 capacity 24 / minimum 2, 0103 capacity 20 / minimum 2"
            - "SKU-1001 SEASONAL on TOP-4SZ (S 2000 / M 3500 / L 3000 / XL 1500), all four core, retail 36.50"
            - "Positions: 0101 holds 4 units (M 3 / L 1) -> BROKEN, need 9 x 4 - 4 = 32; 0102 holds 30 units of every size -> COMPLETE, need 0; 0103 holds 5 units of every size -> COMPLETE, need 3 x 4 - 5 = 7"
            - "Receipt ASN-R301 carries 39 units and Allocator u-alloc-1 proposed a DEMAND_DRIVEN / FORWARD_LOOKING run, so run.proposed_by_user_id = 'u-alloc-1'"
