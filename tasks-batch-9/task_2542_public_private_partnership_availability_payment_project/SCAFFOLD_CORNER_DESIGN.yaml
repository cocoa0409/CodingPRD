            - call: "POST /ppp/concessions/${csn_id}/enforcement-actions"
              payload: { action_type: "TERMINATION", trigger_reason: "FORCE_MAJEURE", effective_date: "2027-04-02" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { ea1_id: $.data.id }
          trigger:
            - call: "GET /ppp/concessionaires/${cnr_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
            - call: "GET /ppp/drawdown-milestones/${m1_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
            - call: "GET /ppp/performance-reports/${pr1_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
            - call: "GET /ppp/deduction-events/${de1_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
            - call: "GET /ppp/deduction-disputes/${dsp1_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
            - call: "GET /ppp/relief-claims/${rc1_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
            - call: "GET /ppp/enforcement-actions/${ea1_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
            - call: "GET /ppp/concessionaires"
              as: PlatformAdmin
          assert:
            - "every call returns 200"
            - "Concessionaire.${cnr_id}.legal_name == \"Meridian Infrastructure Partners\" and status == \"ACTIVE\""
            - "DrawdownMilestone.${m1_id}.status == \"DISBURSED\" and equity_portion_cents == 100000000 and debt_portion_cents == 20000000"
            - "PerformanceReport.${pr1_id}.status == \"VERIFIED\" and reported_points == 320 and service_period_id == ${sp1_id}"
            - "DeductionEvent.${de1_id}.status == \"DISPUTED\" and points == 400 and allowed_amount_cents == 500000"
            - "DeductionDispute.${dsp1_id}.status == \"RAISED\" and round_no == 1 and deduction_event_id == ${de1_id}"
            - "ReliefClaim.${rc1_id}.status == \"NOTIFIED\" and claimed_relief_days == 3 and granted_relief_days == 0"
            - "EnforcementAction.${ea1_id}.status == \"NOTIFIED\" and trigger_reason == \"FORCE_MAJEURE\" and cure_deadline == null"
            - "LifecycleReserveTransaction.${tx1_id}.resulting_balance_cents == 10000000 — readable via GET /ppp/reserve-transactions/${tx1_id} on the same pattern"
            - "RefinancingEvent.${rf1_id}.status == \"PROPOSED\" and gross_gain_cents == 50000000 — readable via GET /ppp/refinancing-events/${rf1_id}"
            - "the concessionaire list returns total_count == 1 and has_more == false"
            - "no read altered any row: a second pass of the same eight GETs returns byte-identical data blocks"

  - section: state_machines
    instances:

      - name: a_new_milestone_starts_in_requested_with_no_split_computed
        claim_type: initial_state
        grounds:
          - state_machines.DrawdownMilestone.initial_state
          - endpoints[POST /ppp/concessions/{id}/drawdown-milestones]
          - entities.DrawdownMilestone.fields.equity_portion_cents
          - entities.DrawdownMilestone.fields.debt_portion_cents
        distinguishing_aspect: |
          Creation must land in REQUESTED with certified_cost_cents, both portion fields,
          approved_at and disbursed_at all null — the equity-first split is computed at
          APPROVE, not at request time, so an implementation that eagerly splits
          requested_amount_cents fails here.
        test_recipe:
          setup:
            - "A concession at FINANCIAL_CLOSE (monthly_unitary_charge_cents 8604167)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
          trigger:
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "DrawdownMilestone.${m1_id}.status == \"REQUESTED\" and sequence_no == 1"
            - "DrawdownMilestone.${m1_id}.requested_amount_cents == 120000000 and certified_cost_cents == null"
            - "DrawdownMilestone.${m1_id}.equity_portion_cents == null and debt_portion_cents == null"
            - "DrawdownMilestone.${m1_id}.approved_at == null and disbursed_at == null and rejection_reason == null"
            - "Concession.${csn_id}.equity_drawn_cents == 0 and senior_debt_drawn_cents == 0 and cumulative_drawn_pct == 0"
            - "Concession.${csn_id}.status == \"FINANCIAL_CLOSE\" and version == ${csn_v_close} + 1"

      - name: financial_close_derives_the_unitary_charge_and_advances_the_concession
        claim_type: valid_transition
        grounds:
          - state_machines.Concession.DRAFTED_to_FINANCIAL_CLOSE
          - endpoints[POST /ppp/concessions/{id}/financial-close]
          - calculations.monthly_unitary_charge
        distinguishing_aspect: |
          One call must do three things: move DRAFTED -> FINANCIAL_CLOSE, stamp
          financial_close_date from the body (not from the clock), and produce
          monthly_unitary_charge_cents 8604167 — the sole producer of that field.
        test_recipe:
          setup:
            - "A DRAFTED concession with masp_cents 100000000 and indexation_pct 0.0325; clock at 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
          trigger:
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v: $.data.version }
          assert:
            - "HTTP status is 200"
            - "Concession.${csn_id}.status == \"FINANCIAL_CLOSE\""
            - "Concession.${csn_id}.financial_close_date == \"2026-09-15\""
            - "Concession.${csn_id}.monthly_unitary_charge_cents == 8604167"
            - "Concession.${csn_id}.version == 2 and ${csn_v} == 2"
            - "Concession.${csn_id}.actual_service_commencement == null and ld_accrued_cents == 0"
            - "Concessionaire.${cnr_id}.concessions_count == 1"

      - name: milestone_rejection_is_terminal_and_moves_no_drawn_total
        claim_type: valid_transition
        grounds:
          - state_machines.DrawdownMilestone.REQUESTED_to_REJECTED
          - endpoints[POST /ppp/drawdown-milestones/{id}/reject]
          - calculations.drawdown_funding_conservation
        distinguishing_aspect: |
          REJECTED is terminal and contributes nothing: rejection_reason is stored, both
          portion fields stay at 0/null, and the concession's drawn totals and
          cumulative_drawn_pct must be exactly as they were — no FINANCIAL_CLOSE ->
          CONSTRUCTION evaluation may be triggered by a rejection.
        test_recipe:
          setup:
            - "A concession at FINANCIAL_CLOSE with one REQUESTED milestone of 120000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /ppp/drawdown-milestones/${m1_id}/reject"
              payload: { rejection_reason: "certifier could not substantiate 120000000 of cost" }
              as: IndependentCertifier
          assert:
            - "HTTP status is 200"
            - "DrawdownMilestone.${m1_id}.status == \"REJECTED\""
            - "DrawdownMilestone.${m1_id}.rejection_reason == \"certifier could not substantiate 120000000 of cost\""
            - "DrawdownMilestone.${m1_id}.certified_cost_cents == null and approved_at == null and disbursed_at == null"
            - "Concession.${csn_id}.equity_drawn_cents == 0 and senior_debt_drawn_cents == 0"
            - "Concession.${csn_id}.cumulative_drawn_pct == 0 and status == \"FINANCIAL_CLOSE\""
            - "GET /ppp/reserve-transactions?concession_id=${csn_id} returns total_count == 0 — no CONSTRUCTION seed was appended"

      - name: disbursing_a_requested_milestone_is_an_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.DrawdownMilestone.transitions
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - endpoints[POST /ppp/drawdown-milestones/{id}/disburse]
        distinguishing_aspect: |
          Only APPROVED -> DISBURSED is declared, so disburse from REQUESTED must be a 409
          ERR_INVALID_STATE_TRANSITION. The call is made as LenderAgent, which IS the
          endpoint's role, so nothing masks the state check — and no drawn total may move.
        test_recipe:
          setup:
            - "A concession at FINANCIAL_CLOSE with one milestone still in REQUESTED (never certified)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "DrawdownMilestone.${m1_id}.status == \"REQUESTED\" and disbursed_at == null"
            - "Concession.${csn_id}.equity_drawn_cents == 0 and senior_debt_drawn_cents == 0 and status == \"FINANCIAL_CLOSE\""

      - name: verifying_a_period_that_was_never_self_reported_is_an_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.ServicePeriod.reporting_status.transitions
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - endpoints[POST /ppp/service-periods/{id}/verify]
        distinguishing_aspect: |
          The reporting axis declares only SELF_REPORTED -> VERIFIED, so verifying a
          PENDING period must fail — the authority cannot verify counts nobody reported.
          No availability_ratio, no net_payment_cents and no deduction event may appear.
        test_recipe:
          setup:
            - "The base chain to OPERATIONS plus ServicePeriod 1, with NO performance report submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
            - call: "POST /ppp/concessions/${csn_id}/service-periods"
              payload: { period_index: 1, period_start: "2027-03-01", period_end: "2027-04-01" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { sp1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ppp/service-periods/${sp1_id}/verify"
              payload: { verified_unavailable_minutes: 100, verified_category_a_failures: 2, verified_category_b_failures: 4 }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "ServicePeriod.${sp1_id}.reporting_status == \"PENDING\" and verified_at == null"
            - "ServicePeriod.${sp1_id}.unavailable_minutes_verified == null and availability_ratio == null and net_payment_cents == null"
            - "ServicePeriod.${sp1_id}.version == 1 — the failed write bumped nothing"
            - "GET /ppp/deduction-events?service_period_id=${sp1_id} returns total_count == 0"

      - name: invoicing_a_period_before_verification_is_rejected
        claim_type: invalid_transitions
        grounds:
          - endpoints[POST /ppp/service-periods/{id}/invoice]
          - state_machines.ServicePeriod.payment_status.UNBILLED_to_INVOICED
          - errors[ERR_INVALID_STATE_TRANSITION]
        excluded_because:
          difficulty_instance: service_period_two_axes_advance_independently_with_one_cross_axis_gate
          rationale: "That instance drives the payment axis from UNBILLED and asserts the single cross-axis gate — invoice rejected while reporting_status is SELF_REPORTED, accepted once VERIFIED — which is exactly this claim."

      - name: approving_an_already_rejected_milestone_is_locked_out
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DrawdownMilestone.terminal_states
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          REJECTED is terminal, so approve must fail from it even though approve is a
          legal transition from REQUESTED and even though the certifier is the correct
          role and certified_cost_cents is a perfectly fundable 120000000 — a handler
          that keys only on "is the actor allowed" reopens a closed milestone here.
        test_recipe:
          setup:
            - "A concession at FINANCIAL_CLOSE with one milestone already REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/reject"
              payload: { rejection_reason: "cost evidence incomplete" }
              as: IndependentCertifier
          trigger:
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "DrawdownMilestone.${m1_id}.status == \"REJECTED\" and certified_cost_cents == null"
            - "DrawdownMilestone.${m1_id}.rejection_reason == \"cost evidence incomplete\" and approved_at == null"
            - "Concession.${csn_id}.equity_drawn_cents == 0 and senior_debt_drawn_cents == 0"

      - name: a_second_financial_close_on_the_same_concession_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Concession.DRAFTED_to_FINANCIAL_CLOSE
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - calculations.monthly_unitary_charge
        distinguishing_aspect: |
          Replaying financial-close with a LATER close_date must be rejected rather than
          re-stamping financial_close_date and re-deriving the unitary charge — the
          derived charge is frozen onto every service period, so a second close would
          silently rewrite history. The original 2026-09-15 must survive.
        test_recipe:
          setup:
            - "A concession already at FINANCIAL_CLOSE, closed on 2026-09-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
