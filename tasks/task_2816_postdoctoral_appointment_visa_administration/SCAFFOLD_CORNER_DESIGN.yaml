              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_58"
              captures: { f58_id: "$.data.id" }
            - call: "POST /funding-sources/${f58_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_16"
            - call: "POST /postdocs"
