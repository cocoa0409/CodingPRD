          trigger:
            - call: "POST /udrp/appointments/${apt_a_id}/conflict-screening"
              payload: { disclosed_prior_representation: false, disclosed_same_firm: false, disclosed_financial_interest: true, prior_appointments_with_complainant: 0, months_since_last_contact: 36 }
              as: Panelist
