# =============================================================================
# Task 0970: §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances. All chains replay against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Common fixture shorthand used below: a plan, senior, subscription, kit,
# installer, appointment install, and activation bring a senior to posture ACTIVE.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: proration_daily_vs_full_cycle_swap
        grounds:
          - calculations.billing_proration
          - entities.Subscription.fields.last_change_net_cents
        distinguishing_aspect: |
          Subscription-domain calculation: for identical inputs (plan 6000 ->
          9000, days_remaining=10) DAILY_PRORATE yields net 1000 and keeps
          current_period_end, while FULL_CYCLE_SWAP yields net 3000 and resets
          current_period_end — two valid algorithms, different numbers.
        test_recipe:
          setup:
            - "Two plans: PLUS2 (6000 cents, 2 included sensors, fee 199) and PREM2 (9000 cents, 2 included, fee 199)"
            - "Two seniors S_a and S_b, each with a PLUS2 subscription activated at 2026-05-01T00:00:00Z (period_end 2026-05-31T00:00:00Z)"
            - "Clock at 2026-05-21T00:00:00Z (days_remaining = 10)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_plus: $.data.id } }
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_prem: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Senior A", date_of_birth: "1940-01-01", address: "1 A St" }, as: PlatformAdmin, captures: { s_a: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Senior B", date_of_birth: "1941-01-01", address: "2 B St" }, as: PlatformAdmin, captures: { s_b: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_a}", plan_id: "${plan_plus}" }, as: PlatformAdmin, captures: { sub_a: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_b}", plan_id: "${plan_plus}" }, as: PlatformAdmin, captures: { sub_b: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_a}" }, as: PlatformAdmin, captures: { kit_a: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_b}" }, as: PlatformAdmin, captures: { kit_b: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_a}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_a}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_b}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_b}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst One", region: "R1" }, as: PlatformAdmin, captures: { inst1: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_a}", kit_id: "${kit_a}", installer_id: "${inst1}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_a: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_b}", kit_id: "${kit_b}", installer_id: "${inst1}", window_start: "2026-05-01T10:30:00Z", window_end: "2026-05-01T11:30:00Z" }, as: PlatformAdmin, captures: { appt_b: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_a}/confirm", payload: {}, as: Installer, as_user_id: "${inst1}" }
            - { call: "POST /v1/install-appointments/${appt_b}/confirm", payload: {}, as: Installer, as_user_id: "${inst1}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_a}/complete", payload: {}, as: Installer, as_user_id: "${inst1}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_b}/complete", payload: {}, as: Installer, as_user_id: "${inst1}" }
            - { call: "POST /v1/subscriptions/${sub_a}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/subscriptions/${sub_b}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_a}/change-plan", payload: { plan_id: "${plan_prem}", proration_mode: "DAILY_PRORATE" }, as: PlatformAdmin, captures: { a_credit: $.data.last_change_total_credit_cents, a_charge: $.data.last_change_total_charge_cents, a_net: $.data.last_change_net_cents, a_end: $.data.current_period_end } }
            - { call: "POST /v1/subscriptions/${sub_b}/change-plan", payload: { plan_id: "${plan_prem}", proration_mode: "FULL_CYCLE_SWAP" }, as: PlatformAdmin, captures: { b_credit: $.data.last_change_total_credit_cents, b_charge: $.data.last_change_total_charge_cents, b_net: $.data.last_change_net_cents, b_end: $.data.current_period_end } }
          assert:
            - "a_credit == 2000 and a_charge == 3000 and a_net == 1000"
            - "b_credit == 6000 and b_charge == 9000 and b_net == 3000"
            - "a_end == '2026-05-31T11:00:00Z' (unchanged) and b_end == '2026-06-20T00:00:00Z' (reset)"
            - "a_net != b_net for identical plan pair and clock"
      - name: wellness_index_provisional_vs_final
        grounds:
          - calculations.wellness_index
          - calculations.adherence_pct
          - calculations.activity_score
          - entities.WellnessReport.fields.wellness_index
        distinguishing_aspect: |
          WellnessReport-domain calculation (different entity domain from the
          Subscription-domain proration instance): for the same underlying data,
          PROVISIONAL counts the still-PENDING 05-04 dose as on-time TAKEN and
          divides activity by elapsed_days (3), yielding index 73.6 / adherence
          62.5; FINAL replays terminal doses only (4th dose MISSED) over full
          period_days (4), yielding 46.5 / 37.5.
        test_recipe:
          setup:
            - "PREMIUM plan (fee 9000, 2 included sensors, meds+wellness enabled, checkin 24h)"
            - "Senior S_w with subscription ACTIVE (activated 2026-05-01T09:30:00Z), kit installed, gateway + one motion device ONLINE"
            - "ROUTINE med schedule at 20:00 daily, window 60, start 2026-05-01"
            - "Dose 05-01 confirmed punctual (20:10); dose 05-02 confirmed late (20:40); dose 05-03 MISSED; dose 05-04 PENDING at provisional time"
            - "3 MOTION events on 05-01 and 3 on 05-02 (2 active days); no FALL alerts"
            - "Report period 2026-05-01T00:00:00Z .. 2026-05-05T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_p: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Well Senior", date_of_birth: "1938-05-05", address: "5 W St" }, as: PlatformAdmin, captures: { s_w: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_w}", plan_id: "${plan_p}" }, as: PlatformAdmin, captures: { sub_w: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_w}" }, as: PlatformAdmin, captures: { kit_w: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_w}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_w}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst W", region: "R1" }, as: PlatformAdmin, captures: { inst_w: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_w}", kit_id: "${kit_w}", installer_id: "${inst_w}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_w: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_w}/confirm", payload: {}, as: Installer, as_user_id: "${inst_w}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_w}/complete", payload: {}, as: Installer, as_user_id: "${inst_w}" }
            - { call: "POST /v1/subscriptions/${sub_w}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/seniors/${s_w}", payload: {}, as: PlatformAdmin, captures: { s_w_v: $.data.version } }
            - { call: "POST /v1/medication-schedules", payload: { senior_id: "${s_w}", medication_name: "Vitamin D", times_of_day: ["20:00"], window_minutes: 60, criticality: "ROUTINE", start_date: "2026-05-01", expected_senior_version: "${s_w_v}" }, as: PlatformAdmin, captures: { sched_w: $.data.id } }
            - { call: "GET /v1/devices", payload: { kit_id: "${kit_w}" }, as: PlatformAdmin, captures: { dev_gw: "$.data[0].id", dev_motion: "$.data[2].id" } }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_gw}", event_type: "HEARTBEAT", observed_at: "2026-05-01T09:30:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "HEARTBEAT", observed_at: "2026-05-01T09:30:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "MOTION", observed_at: "2026-05-01T09:28:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "MOTION", observed_at: "2026-05-01T09:29:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "MOTION", observed_at: "2026-05-01T09:30:00Z" }, as: DeviceHub }
            - { call: "GET /v1/dose-events", payload: { schedule_id: "${sched_w}" }, as: PlatformAdmin, captures: { dose1: "$.data[0].id", dose2: "$.data[1].id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T20:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/dose-events/${dose1}/confirm", payload: {}, as: Senior, as_user_id: "${s_w}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T20:40:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/dose-events/${dose2}/confirm", payload: {}, as: Senior, as_user_id: "${s_w}" }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "MOTION", observed_at: "2026-05-02T08:00:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "MOTION", observed_at: "2026-05-02T09:00:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "MOTION", observed_at: "2026-05-02T10:00:00Z" }, as: DeviceHub }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T21:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T20:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_gw}", event_type: "HEARTBEAT", observed_at: "2026-05-04T20:10:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "HEARTBEAT", observed_at: "2026-05-04T20:10:00Z" }, as: DeviceHub }
          trigger:
            - { call: "POST /v1/wellness-reports", payload: { senior_id: "${s_w}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-05T00:00:00Z", mode: "PROVISIONAL" }, as: PlatformAdmin, captures: { prov_idx: $.data.wellness_index, prov_adh: $.data.adherence_pct, prov_act: $.data.activity_score } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:01:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_gw}", event_type: "HEARTBEAT", observed_at: "2026-05-05T00:01:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_motion}", event_type: "HEARTBEAT", observed_at: "2026-05-05T00:01:00Z" }, as: DeviceHub }
            - { call: "POST /v1/wellness-reports", payload: { senior_id: "${s_w}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-05T00:00:00Z", mode: "FINAL" }, as: PlatformAdmin, captures: { fin_idx: $.data.wellness_index, fin_adh: $.data.adherence_pct, fin_act: $.data.activity_score } }
          assert:
            - "prov_act == 66.7 and prov_adh == 62.5 and prov_idx == 73.6"
            - "fin_act == 50.0 and fin_adh == 37.5 and fin_idx == 46.5"
            - "prov_idx != fin_idx for the same underlying period data"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: wellness_index_weighted_sum_with_fall_cap
        grounds:
          - calculations.wellness_index
          - entities.WellnessReport.fields.fall_cap_applied
        distinguishing_aspect: |
          Mode (a) combinatorial: a 3-input weighted sum (0.40*activity +
          0.35*adherence + 0.25*device_health) with a conditional state branch
          (adherence < 60 multiplier) and a nested min() cap (FALL alert ->
          min(raw, 59)). Here raw = 100.0 would result without the cap; the
          branch structure forces 59.0. Mode differs from the rounding-order
          instance (mode b).
        test_recipe:
          setup:
            - "PREMIUM plan; senior S_c ACTIVE (activated 2026-05-01T09:30:00Z); gateway + motion ONLINE; no medication schedules (adherence vacuous 100)"
            - "3 MOTION events on 05-01 and 3 on 05-02 (both period days active -> activity 100)"
            - "One FALL_DETECTED event on 05-02 -> CRITICAL FALL alert stays RAISED (no contact tree)"
            - "Report period 2026-05-01T00:00:00Z .. 2026-05-03T00:00:00Z, generated FINAL at 2026-05-03T00:01:00Z"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_c: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Cap Senior", date_of_birth: "1937-07-07", address: "7 C St" }, as: PlatformAdmin, captures: { s_c: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_c}", plan_id: "${plan_c}" }, as: PlatformAdmin, captures: { sub_c: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_c}" }, as: PlatformAdmin, captures: { kit_c: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_c}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_c}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst C", region: "R1" }, as: PlatformAdmin, captures: { inst_c: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_c}", kit_id: "${kit_c}", installer_id: "${inst_c}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_c: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_c}/confirm", payload: {}, as: Installer, as_user_id: "${inst_c}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_c}/complete", payload: {}, as: Installer, as_user_id: "${inst_c}" }
            - { call: "POST /v1/subscriptions/${sub_c}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/devices", payload: { kit_id: "${kit_c}" }, as: PlatformAdmin, captures: { dev_gw_c: "$.data[0].id", dev_wear_c: "$.data[1].id", dev_mot_c: "$.data[2].id" } }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_gw_c}", event_type: "HEARTBEAT", observed_at: "2026-05-01T09:30:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "HEARTBEAT", observed_at: "2026-05-01T09:30:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "MOTION", observed_at: "2026-05-01T09:28:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "MOTION", observed_at: "2026-05-01T09:29:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "MOTION", observed_at: "2026-05-01T09:30:00Z" }, as: DeviceHub }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "MOTION", observed_at: "2026-05-02T08:00:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "MOTION", observed_at: "2026-05-02T09:00:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "MOTION", observed_at: "2026-05-02T09:30:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_wear_c}", event_type: "FALL_DETECTED", observed_at: "2026-05-02T09:45:00Z" }, as: DeviceHub, captures: { fall_alertless: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:01:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_gw_c}", event_type: "HEARTBEAT", observed_at: "2026-05-03T00:01:00Z" }, as: DeviceHub }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_mot_c}", event_type: "HEARTBEAT", observed_at: "2026-05-03T00:01:00Z" }, as: DeviceHub }
          trigger:
            - { call: "POST /v1/wellness-reports", payload: { senior_id: "${s_c}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-03T00:00:00Z", mode: "FINAL" }, as: PlatformAdmin, captures: { cap_idx: $.data.wellness_index, cap_flag: $.data.fall_cap_applied, cap_adh: $.data.adherence_pct, cap_act: $.data.activity_score } }
          assert:
            - "cap_act == 100.0 and cap_adh == 100.0 (vacuous adherence — no doses due)"
            - "cap_idx == 59.0 and cap_flag == true (raw 100.0 capped by the open FALL alert)"
      - name: proration_per_line_rounding_order
        grounds:
          - calculations.billing_proration
          - entities.Subscription.fields.last_change_total_credit_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned per-line-then-sum.
          With old fee 5999, one extra sensor at 199, days_remaining=14, per-line
          rounding gives 2800 + 93 = 2893 while sum-then-round would give
          round((5999+199)*14/30) = 2892 — a 1-cent observable difference.
          Mode differs from the weighted-sum instance (mode a).
        test_recipe:
          setup:
            - "Plan OLD (fee 5999, 1 included sensor, extra fee 199); plan NEW (fee 9000, 2 included sensors, extra fee 199)"
            - "Senior S_r with kit ordered with motion_sensor_count=2 (one extra sensor under OLD), subscription ACTIVE since 2026-05-01T11:00:00Z (period_end 2026-05-31T11:00:00Z)"
            - "Clock at 2026-05-17T11:00:00Z -> days_remaining = 14"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 5999, included_motion_sensors: 1, extra_sensor_fee_cents: 199, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_old: $.data.id } }
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_new: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Round Senior", date_of_birth: "1936-03-03", address: "3 R St" }, as: PlatformAdmin, captures: { s_r: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_r}", plan_id: "${plan_old}" }, as: PlatformAdmin, captures: { sub_r: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_r}", motion_sensor_count: 2 }, as: PlatformAdmin, captures: { kit_r: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_r}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_r}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst R", region: "R1" }, as: PlatformAdmin, captures: { inst_r: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_r}", kit_id: "${kit_r}", installer_id: "${inst_r}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PlatformAdmin, captures: { appt_r: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_r}/confirm", payload: {}, as: Installer, as_user_id: "${inst_r}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_r}/complete", payload: {}, as: Installer, as_user_id: "${inst_r}" }
            - { call: "POST /v1/subscriptions/${sub_r}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-17T11:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_r}/change-plan", payload: { plan_id: "${plan_new}", proration_mode: "DAILY_PRORATE" }, as: PlatformAdmin, captures: { r_plan_credit: $.data.last_change_plan_credit_cents, r_sensor_credit: $.data.last_change_sensor_credit_cents, r_total_credit: $.data.last_change_total_credit_cents, r_total_charge: $.data.last_change_total_charge_cents, r_net: $.data.last_change_net_cents } }
          assert:
