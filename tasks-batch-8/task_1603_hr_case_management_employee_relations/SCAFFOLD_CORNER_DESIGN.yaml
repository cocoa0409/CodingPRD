# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# HR Case Management & Employee Relations Investigations
# Breadth probe across the claim-extraction-guide taxonomy. Names are unique
# across the union of this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: employee_creation_applies_defaults_and_system_fields
        claim_type: creation_and_defaults
        grounds:
          - entities.Employee.fields.employment_status
          - entities.Employee
        distinguishing_aspect: "POST /er/employees omitting employment_status yields 201 with employment_status == ACTIVE (input default) and server-minted id/created_at/updated_at/version == 1; any client-supplied id or version in the payload is not in the endpoint input schema and ignored."
        test_recipe:
          setup:
            - "Empty database; clock at default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /er/employees"
              payload: { employee_number: "E-9001", full_name: "Default Test", email: "e9001@example.com", location_code: "SF", department: "Ops", hire_date: "2021-05-01T00:00:00Z" }
              as: ERManager
              captures: { e1: $.data.id, e1_status: $.data.employment_status, e1_v: $.data.version }
          assert:
            - "Employee.${e1}.employment_status == ACTIVE (default applied)"
            - "Employee.${e1}.version == 1"
            - "Employee.${e1}.created_at == 2026-08-01T00:00:00.000Z (logical clock default)"
            - "Employee.${e1}.manager_id is null (optional field omitted)"

      - name: employee_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Employee
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /er/employees/{id} with a well-formed UUID that does not exist returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /er/employees/00000000-0000-4000-8000-000000000000"
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: employee_list_pagination_envelope
        claim_type: listing_pagination
        grounds:
          - entities.Employee
          - response_envelope
        distinguishing_aspect: "GET /er/employees with 12 employees and default pagination returns limit=10 rows with total_count == 12 and has_more == true; offset=10 returns the remaining 2 with has_more == false."
        test_recipe:
          setup:
            - "Twelve employees E-P01..E-P12 exist."
          setup_api_calls:
            - call: "POST /er/employees"
              payload: { employee_number: "E-P01", full_name: "Page One", email: "ep01@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P02", full_name: "Page Two", email: "ep02@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P03", full_name: "Page Three", email: "ep03@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P04", full_name: "Page Four", email: "ep04@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P05", full_name: "Page Five", email: "ep05@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P06", full_name: "Page Six", email: "ep06@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P07", full_name: "Page Seven", email: "ep07@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P08", full_name: "Page Eight", email: "ep08@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P09", full_name: "Page Nine", email: "ep09@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P10", full_name: "Page Ten", email: "ep10@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P11", full_name: "Page Eleven", email: "ep11@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
            - call: "POST /er/employees"
              payload: { employee_number: "E-P12", full_name: "Page Twelve", email: "ep12@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
          trigger:
            - call: "GET /er/employees"
              as: ERManager
              captures: { page1: $.data }
            - call: "GET /er/employees?offset=10"
              as: ERManager
              captures: { page2: $.data }
          assert:
            - "page 1 returns 10 rows, total_count == 12, has_more == true"
            - "page 2 (offset=10) returns 2 rows, total_count == 12, has_more == false"

      - name: employee_duplicate_employee_number_rejected
        claim_type: uniqueness_constraint
        grounds:
          - entities.Employee.fields.employee_number
          - validations[priority=15]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Creating a second employee with an existing employee_number returns 409 ERR_DUPLICATE; the unique constraint is enforced independent of email uniqueness."
        test_recipe:
          setup:
            - "Employee E-D01 exists."
          setup_api_calls:
            - call: "POST /er/employees"
              payload: { employee_number: "E-D01", full_name: "Dup Base", email: "ed01a@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
          trigger:
            - call: "POST /er/employees"
              payload: { employee_number: "E-D01", full_name: "Dup Other", email: "ed01b@example.com", location_code: "LA", department: "Sales", hire_date: "2021-01-01T00:00:00Z" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE"
            - "http status == 409"

      - name: employee_manager_cycle_rejected
        claim_type: graph_constraint
        grounds:
          - entities.Employee.fields.manager_id
          - validations[priority=15]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "PATCH /er/employees/{id} setting manager_id such that the chain becomes cyclic (A managed by B, then B's manager set to A) is rejected with ERR_DUPLICATE (manager-chain acyclicity check)."
        test_recipe:
          setup:
            - "Employees A and B exist; A.manager_id == B."
          setup_api_calls:
            - call: "POST /er/employees"
              payload: { employee_number: "E-C01", full_name: "Cyc A", email: "ec01@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
              captures: { emp_a: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "E-C02", full_name: "Cyc B", email: "ec02@example.com", location_code: "SF", department: "Ops", hire_date: "2020-01-01T00:00:00Z" }
              as: ERManager
              captures: { emp_b: $.data.id }
            - call: "PATCH /er/employees/${emp_a}"
              payload: { manager_id: "${emp_b}" }
              as: ERManager
          trigger:
            - call: "PATCH /er/employees/${emp_b}"
              payload: { manager_id: "${emp_a}" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE (cycle rejected)"
            - "http status == 409"
            - "Employee.${emp_b}.manager_id remains null"

      - name: investigator_computed_active_case_count_ignores_input
        claim_type: computed_field
        grounds:
          - entities.Investigator.fields.active_case_count
        distinguishing_aspect: "Investigator.active_case_count is computed; creation initializes it to 0 and it changes only via assignment/closure cascades, never via PATCH input (the PATCH endpoint input schema excludes it)."
        test_recipe:
          setup:
            - "Investigator INV exists with active_case_count == 0."
          setup_api_calls:
            - call: "POST /er/employees"
              payload: { employee_number: "I-9001", full_name: "Inv Comp", email: "i9001@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei}", certification_level: "LEVEL_2", max_active_cases: 4 }
              as: ERManager
              captures: { inv: $.data.id, inv_c0: $.data.active_case_count }
          trigger:
            - call: "PATCH /er/investigators/${inv}"
              payload: { max_active_cases: 6 }
              as: ERManager
              captures: { inv_c1: $.data.active_case_count }
          assert:
            - "Investigator.${inv}.active_case_count == 0 at creation"
            - "Investigator.${inv}.active_case_count == 0 after PATCH (computed field untouched by profile updates)"
            - "Investigator.${inv}.max_active_cases == 6"

      - name: case_intake_applies_channel_defaults
        claim_type: creation_and_defaults
        grounds:
          - entities.Case.fields.category
          - entities.Case.fields.severity
          - entities.IntakeChannelConfig.fields.default_category
        distinguishing_aspect: "POST /er/cases omitting category and severity inherits the channel's default_category and default_severity; explicit values override the defaults."
        test_recipe:
          setup:
            - "Channel with default_category SAFETY and default_severity CRITICAL exists; subject employee exists."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "ANONYMOUS_LETTER", display_name: "Anon", default_category: "SAFETY", default_severity: "CRITICAL", sla_business_days: 3 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9001", full_name: "Subj Def", email: "s9001@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", subject_employee_id: "${sub}" }
              as: ERManager
              captures: { c1: $.data.id, c1_cat: $.data.category, c1_sev: $.data.severity, c1_status: $.data.status }
          assert:
            - "Case.${c1}.category == SAFETY (channel default)"
            - "Case.${c1}.severity == CRITICAL (channel default)"
            - "Case.${c1}.status == TRIAGE (initial state)"
            - "Case.${c1}.reporter_employee_id is null (anonymous channel)"

      - name: holiday_calendar_entry_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.HolidayCalendarEntry
        distinguishing_aspect: "HolidayCalendarEntry has common_fields: false — its representation exposes id and created_at but NO version or updated_at field, and no PATCH/PUT endpoint exists for it in §1.5."
        test_recipe:
          setup:
            - "One holiday entry exists."
          setup_api_calls:
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-12-25T00:00:00Z", label: "Christmas" }
              as: ERManager
              captures: { h1: $.data.id }
          trigger:
            - call: "GET /er/holiday-calendar"
              as: ERManager
              captures: { entries: $.data }
          assert:
            - "HolidayCalendarEntry.${h1} response contains id, created_at, holiday_date, label"
            - "HolidayCalendarEntry.${h1} response does NOT contain version or updated_at (common_fields: false)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: case_assign_from_investigating_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Case
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /er/cases/{id}/assign from INVESTIGATING (not TRIAGE/REOPENED) is rejected with ERR_INVALID_STATE and no side effects fire (assigned_investigator_id unchanged)."
        test_recipe:
          setup:
            - "A case in INVESTIGATING assigned to INV1; second investigator INV2 available."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hot X", default_category: "HARASSMENT", default_severity: "MEDIUM", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-9101", full_name: "Rep X", email: "r9101@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9101", full_name: "Sub X", email: "s9101@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9101", full_name: "Inv X1", email: "i9101@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9102", full_name: "Inv X2", email: "i9102@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei2: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei2}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv2: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "MEDIUM" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_v2: $.data.version }
          trigger:
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv2}", expected_case_version: "${c1_v2}" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"
            - "Case.${c1}.assigned_investigator_id remains ${inv1}"
            - "Investigator.${inv2}.active_case_count remains 0 (no side effects fired)"

      - name: case_terminal_closed_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Case
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From CLOSED, triggers other than reopen are rejected: begin-investigation on a CLOSED case returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A fully processed CLOSED case (anonymous intake, so only the subject notice is required)."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "ANONYMOUS_LETTER", display_name: "Anon T", default_category: "SAFETY", default_severity: "MEDIUM", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9201", full_name: "Sub T", email: "s9201@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9201", full_name: "Inv T1", email: "i9201@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9202", full_name: "Inv T2", email: "i9202@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei2: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9203", full_name: "Inv T3", email: "i9203@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei3: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei2}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv2: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei3}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv3: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", subject_employee_id: "${sub}", category: "SAFETY", severity: "MEDIUM" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${sub}", scheduled_start: "2026-07-27T09:00:00Z", scheduled_end: "2026-07-27T10:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv1: $.data.id }
            - call: "POST /er/interviews/${iv1}/complete"
              payload: { documentation_text: "Terminal case subject interview fully documented with material statements recorded at length." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/evidence-items"
              payload: { submitted_by_employee_id: "${sub}", evidence_type: "PHOTO", description: "Terminal case photo." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { ev1: $.data.id }
            - call: "POST /er/evidence-items/${ev1}/begin-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev1}/admit"
              payload: { weight: 0.8 }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/credibility-assessments"
              payload: { subject_employee_id: "${sub}", corroboration_count: 4, contradiction_count: 0, account_age_days: 2 }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/findings"
              payload: { rationale_text: "Terminal case finding: evidence and interview establish the unsafe condition on the balance of probabilities." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { f1: $.data.id }
            - call: "POST /er/findings/${f1}/substantiate"
              payload: { outcome: "SUBSTANTIATED" }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/actions"
              payload: { action_type: "POLICY_CHANGE", severity_points: 30, justification: "Policy change proportionate to the terminal case outcome." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/submit-for-calibration"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv2}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv3}"
            - call: "POST /er/cases/${c1}/closure-notices"
              payload: { recipient_employee_id: "${sub}", recipient_role: "SUBJECT", confidentiality_tier: "TIER_2_LIMITED", body_text: "The safety investigation concerning you has concluded with a substantiated finding." }
              as: ERManager
              captures: { n1s: $.data.id }
            - call: "POST /er/closure-notices/${n1s}/send"
              payload: {}
              as: ERManager
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_v2: $.data.version }
            - call: "POST /er/cases/${c1}/close"
              payload: { expected_case_version: "${c1_v2}" }
              as: ERManager
          trigger:
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"
            - "Case.${c1}.status remains CLOSED"

      - name: interview_complete_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Interview.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing an already-COMPLETED interview returns ERR_INVALID_STATE; completed_at and documentation_word_count remain those of the first completion."
        test_recipe:
          setup:
            - "A case in INVESTIGATING with one COMPLETED interview (documentation ~15 words)."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "WEB_PORTAL", display_name: "Portal I", default_category: "POLICY_VIOLATION", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-9301", full_name: "Rep I", email: "r9301@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9301", full_name: "Sub I", email: "s9301@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
