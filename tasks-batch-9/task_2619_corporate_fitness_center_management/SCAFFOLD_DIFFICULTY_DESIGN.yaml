          - constants.ACTIVATION_MIN_READINESS
          - validations[priority 19].ERR_READINESS_BELOW_THRESHOLD
          - state_machines.ProgramOffering.DRAFT_to_ACTIVE
          - endpoints[POST /program-offerings/{id}/status-changes]
        distinguishing_aspect: |
          Metric: the weighted readiness score, tested through
          POST /program-offerings/{id}/status-changes. Lead A scores exactly
          ACTIVATION_MIN_READINESS (0.5*100 credential + 0.3*0 drill + 0.2*100
          coverage = 70) and MUST activate, because the gate is `>=` and not `>`.
          Lead B scores 68 (credential EXPIRING_SOON 60, drill 180-day-stale 60,
          coverage 100) and MUST be rejected with 422 ERR_READINESS_BELOW_THRESHOLD
          even though the EXPIRING_SOON credential still satisfies the separate
          priority-14 credential gate. An implementation using `> 70` fails the
          first call; one that rounds the weighted sum up fails the second.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ACTIVE COST_PLUS contract with a READY AED, so the AED precondition never masks the readiness gate."
            - "Lead A ('Nia Brooks'): GROUP_EX_CERT VERIFIED (expires 2027-05-31), last_drill_on null, committed_minutes_current_period 0 -> readiness_index exactly 70."
            - "Lead B ('Owen Diaz'): GROUP_EX_CERT VERIFIED at clock 2026-08-01 but expiring 2026-08-20, drill on 2026-04-01 (122 days stale), committed 0. One ops run moves the credential to EXPIRING_SOON, so readiness recomputes to 68."
            - "Each lead owns one DRAFT offering."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
