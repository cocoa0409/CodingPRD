            - call: "POST /wind-ops/crews"
              payload: { wind_farm_id: "${farm_id}", crew_code: "C-BRAVO", technician_count: 5, certifications: ["GWO_BASIC", "CRANE_BANKSMAN"], max_work_wind_speed_ms: 14.0, daily_hours_capacity: 40, hourly_rate_cents: 90000 }
