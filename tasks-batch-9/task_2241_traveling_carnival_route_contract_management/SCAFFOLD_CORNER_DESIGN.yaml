          - validations[priority=41]
          - validations[priority=90]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stop_state_41_beats_lot_capacity_90_on_a_darkened_stop
          rationale: "That §1.8 instance violates both rules with one call and asserts that the priority-41 error is the one returned."

      - name: cross_entity_validation_reads_the_child_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=102]
          - errors[ERR_CLOSURE_NOT_ADJUDICATED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_finalize_blocked_by_a_child_weather_closure_still_logged
          rationale: "Finalize is blocked by a LOGGED child closure and admitted once it is ADJUDICATED — both directions are asserted there."

      - name: temporal_validation_detects_a_future_resource_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=70]
          - errors[ERR_RIDE_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / ride_occupation_is_closed_and_needs_a_four_hour_transport_buffer
          rationale: "The closed occupation interval plus the 4 h transport buffer is driven there at both the failing and the admitted boundary."

