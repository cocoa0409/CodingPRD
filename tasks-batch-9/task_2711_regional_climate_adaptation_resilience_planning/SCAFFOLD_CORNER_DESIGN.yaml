              as: HazardAnalyst
          trigger:
            - call: "POST /resilience/vulnerability-assessments/${va1_id}/assess"
              payload: {}
              as: HazardAnalyst
          assert:
            - "immediately before the trigger the row read status == STALE with vulnerability_score == 0.82 and vulnerability_band == EXTREME retained as the stale reading"
            - "status 200, data.status == ASSESSED, data.vulnerability_score == 0.67, data.vulnerability_band == HIGH"
            - "data.assessed_profile_version == 2, matching HazardProfile.${hp1_id}.published_version"

      - name: asset_ranking_without_an_assessed_vulnerability_rejected
        claim_type: Precondition Enforcement
        grounds:
