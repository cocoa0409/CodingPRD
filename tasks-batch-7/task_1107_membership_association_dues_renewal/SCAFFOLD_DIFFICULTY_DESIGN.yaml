        distinguishing_aspect: |
          Trigger = POST /api/dues-invoices/{id}/refund. Cascade depth 3:
          refund flips invoice SETTLED->REFUNDED (link 1) -> member
          lifetime_dues_paid_cents decremented AND chapter share ledger
          debited (link 2) -> BenefitEntitlement rows SUSPENDED and
          Member.status drops to GRACE when no remaining SETTLED
          coverage (link 3). Three transitive hops, each caused by the
          prior — not a fan-out.
