              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a2_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-14T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v1}" }
              as: Programmer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 422 and $.data.error_id == ERR_REFERENCE_MISMATCH."
            - "DcpAsset.${a2_id}.venue_id == ${v2_id} while the posted venue_id was ${v_id} - both rows exist, so this is not a not-found case."
            - "GET /showtimes?venue_id=${v_id} returns 0 rows and GET /showtimes?venue_id=${v2_id} returns 0 rows."
            - "RightsClearance.${c_id}.screenings_remaining == 6."

  # ==========================================================================
  - section: state_machines
    instances:

      - name: clearance_submitted_to_cleared_is_a_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.RightsClearance[SUBMITTED -> CLEARED]
          - endpoints[POST /clearances/{id}/clear]
          - entities.RightsClearance.cleared_by_user_id
        distinguishing_aspect: |
          The happy path of the rights machine: a SUBMITTED clearance lodged by one rights manager is
          cleared by a different one and only then becomes eligible to carry screenings. It fails if clearing
          does not record the second actor, or if the allowance counters move on clearing rather than on
          scheduling.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title and a CONFIRMED booking."
            - "A RightsClearance was lodged by X-User-ID u-rm-1 and sits in its initial state SUBMITTED with screenings_used 0 and screenings_remaining 6."
            - "No showtime exists yet."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
          assert:
            - "The response status is 200 and RightsClearance.${c_id}.status == CLEARED."
            - "RightsClearance.${c_id}.submitted_by_user_id == u-rm-1 and cleared_by_user_id == u-rm-2."
            - "RightsClearance.${c_id}.screenings_used == 0 and screenings_remaining == 6 - clearing grants the licence, it does not consume it."
            - "RightsClearance.${c_id}.version == 2 and updated_at is later than created_at."

      - name: booking_confirm_after_the_offer_lapses_violates_its_precondition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking[OFFERED -> CONFIRMED]
          - errors[ERR_OFFER_EXPIRED]
          - validations[priority=28]
          - entities.BookingOffer.expires_at
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The confirm transition carries three preconditions and this instance violates exactly one of them
          - the offer's 72-hour validity - while leaving the other two satisfied. Only a logical-clock move
          makes the lapse observable, so an implementation that reads wall-clock time cannot pass.
        test_recipe:
          setup:
            - "The logical clock starts at its mandatory startup default 2026-08-01T00:00:00Z."
            - "Canonical venue (base_house_nut_weekly_cents 200000), distributor and title exist."
            - "The booking was created at that clock, so its round-1 BookingOffer has expires_at 2026-08-04T00:00:00.000Z (created_at + 72 hours) and outcome PENDING."
            - "Its proposed_house_nut_cents is 12500, comfortably under the venue cap, so the cap precondition is satisfied."
            - "The clock is then advanced to 2026-08-05T00:00:00Z, one day past the offer's expiry."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ExecutiveDirector
          trigger:
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 422 and $.data.error_id == ERR_OFFER_EXPIRED, not ERR_BOOKING_INVALID_STATE - the booking IS in a state that admits confirm."
            - "Booking.${b_id}.status is still OFFERED and confirmed_by_user_id is null."
            - "GET /bookings/${b_id}/offers returns exactly 1 row whose outcome is still PENDING and whose expires_at == 2026-08-04T00:00:00.000Z."
            - "Booking.${b_id}.house_nut_cents == 12500 was never overwritten by an acceptance copy."

      - name: booking_confirm_executes_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.Booking[OFFERED -> CONFIRMED]
          - entities.Booking.confirmed_by_user_id
          - entities.BookingOffer.outcome
          - endpoints[GET /bookings/{id}/offers]
        distinguishing_aspect: |
          The confirm transition declares three side effects - accept the pending offer, copy its four
          terms onto the booking, and stamp the confirming user - and all three must fire together. It fails if
          the booking flips state without accepting the offer row, which would leave the negotiation log
          claiming a round is still open.
        test_recipe:
          setup:
            - "Canonical venue, distributor and title."
            - "The booking was created with house_nut_cents 12500, distributor_share_pct 0.35, min_run_days 4 and guarantee_cents 3000, so its round-1 offer proposes exactly those terms and sits at outcome PENDING with round_index 1."
            - "The clock is at the startup default 2026-08-01T00:00:00Z, well inside the offer's 72-hour validity."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "GET /bookings/${b_id}/offers"
              payload: {}
              as: Programmer
          assert:
            - "The confirm returns 200 and Booking.${b_id}.status == CONFIRMED."
            - "Booking.${b_id}.confirmed_by_user_id == u-ed-1 while created_by_user_id is unchanged."
            - "The offers listing returns exactly 1 row with round_index == 1 and outcome == ACCEPTED - no round is left PENDING."
            - "Booking.${b_id}.house_nut_cents == 12500, distributor_share_pct == 0.35, min_run_days == 4 and guarantee_cents == 3000 match the accepted offer."
            - "Booking.${b_id}.round_count == 1 and scheduled_showtime_count == 0."

      - name: dcp_asset_traffic_update_skipping_a_step_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.DcpAsset[REQUESTED -> IN_TRANSIT]
          - errors[ERR_DCP_ASSET_INVALID_STATE]
          - validations[priority=6]
        distinguishing_aspect: |
          Print traffic is a strict chain, so from REQUESTED the ONLY declared trigger is IN_TRANSIT.
          Asking for INGESTING jumps two steps and must be refused even though INGESTING is a legal status
          value of the field. It fails if the machine accepts any forward status, which would let an unarrived
          print be marked ingesting.
        test_recipe:
          setup:
            - "Canonical venue, distributor and title."
            - "One DcpAsset exists in its initial state REQUESTED with received_at and ingested_at both null."
            - "Its ingest window [2026-07-30T08:00:00Z, 2026-07-31T08:00:00Z] has already opened relative to the startup clock, so the window precondition is not what blocks the call."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-77120", ingest_window_start_at: "2026-07-30T08:00:00Z", ingest_window_end_at: "2026-07-31T08:00:00Z" }
              as: TechnicalManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /dcp-assets/${a_id}/traffic-update"
              payload: { new_status: "INGESTING" }
              as: TechnicalManager
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 409 and $.data.error_id == ERR_DCP_ASSET_INVALID_STATE."
            - "DcpAsset.${a_id}.status is still REQUESTED."
            - "DcpAsset.${a_id}.received_at is null and ingested_at is null."
            - "DcpAsset.${a_id}.version is unchanged at 1."

      - name: every_new_row_lands_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Booking
          - state_machines.BookingOffer
          - state_machines.RightsClearance
          - state_machines.DcpAsset
          - state_machines.Member
        distinguishing_aspect: |
          Five machines declare an initial_state and none of them is reachable by a transition, so the only
          way to prove them is to read freshly created rows. The BookingOffer is the interesting one: it is
          minted as a side effect of booking creation rather than by its own endpoint, so its PENDING initial
          state must still hold.
        test_recipe:
          setup:
            - "Canonical venue, distributor and title."
            - "A Booking was created and was NOT confirmed; a RightsClearance was lodged against it and was NOT cleared."
            - "A DcpAsset was created and no traffic update was sent."
            - "A Member was created and no donation was lodged."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
