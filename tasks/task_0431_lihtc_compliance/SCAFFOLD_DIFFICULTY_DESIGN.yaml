            - call: "POST /units/${um_id}/lease"
              payload: { household_id: "${h1_id}", monthly_rent_cents: 150000, rent_start_date: "2026-01-01T00:00:00Z", rent_end_date: "2026-06-01T00:00:00Z" }
              as: OwnerAgent
              captures: { l1_id: $.data.id }
