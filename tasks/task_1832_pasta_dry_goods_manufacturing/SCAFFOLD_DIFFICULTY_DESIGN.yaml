# =============================================================================
# Task 1832 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances. Every chain replayed against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Clock default is 2026-08-01T00:00:00Z unless a call sets it.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: semolina_grade_certificate_vs_lab_divergence
        grounds:
          - calculations.semolina_grade
          - entities.SemolinaLot.fields.cert_grade_score
          - entities.SemolinaLot.fields.lab_grade_score
        distinguishing_aspect: |
          Same lot, two valid algorithms on the SemolinaLot quality domain: the CERTIFICATE
          variant (supplier values 13.0/14.5/80/300) yields 63.75 / GRADE_B while the LAB
          variant (measured 13.8/13.0/88/340) yields 81.50 / GRADE_A — provisional vs final
          divergence on quality scoring.
        test_recipe:
          setup:
            - "ACTIVE SEMOLINA contract C-GR1 (base 500, ref 100.0, INDEX_LAGGED, 2026-01-01..2026-12-31)"
            - "Lot received with certificate values protein 13.0, moisture 14.5, gluten 80, falling 300"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-GR1", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id, cert_score: $.data.cert_grade_score }
          trigger:
            - call: "POST /semolina-lots/${lot_id}/lab-results"
              payload: { lab_protein_pct: 13.8, lab_moisture_pct: 13.0, lab_gluten_index: 88, lab_falling_number_s: 340 }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { lab_score: $.data.lab_grade_score }
          assert:
            - "SemolinaLot.${lot_id}.cert_grade_score == 63.75"
            - "SemolinaLot.${lot_id}.cert_grade == GRADE_B"
            - "SemolinaLot.${lot_id}.lab_grade_score == 81.5"
            - "SemolinaLot.${lot_id}.lab_grade == GRADE_A"
            - "SemolinaLot.${lot_id}.status == QUARANTINED (lab results alone do not accept)"

      - name: settlement_price_index_lagged_vs_spot_blend_divergence
        grounds:
          - calculations.contract_settlement_price
          - entities.SemolinaLot.fields.unit_price_cents
        distinguishing_aspect: |
          Same base price (500c) and reference (100.0) on the IngredientContract fiscal domain:
          INDEX_LAGGED prices off the month-start reading (120.0 -> ratio 1.2 -> 600c/kg) while
          SPOT_BLEND averages the 30-day window (100.0 and 110.0 -> 105.0 -> ratio 1.05 -> 525c/kg)
          — two valid settlement interpretations produce different money for identical inputs.
        test_recipe:
          setup:
            - "Contract A: SEMOLINA, INDEX_LAGGED, ACTIVE, readings 2026-07-31=90.0 and 2026-08-01=120.0"
            - "Contract B: DURUM_SEMOLINA (no window overlap vs A), SPOT_BLEND, ACTIVE, readings 2026-07-20=100.0 and 2026-08-10=110.0"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-PRC-A", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { ca_id: $.data.id }
            - call: "POST /ingredient-contracts/${ca_id}/index-readings"
              payload: { effective_date: "2026-07-31", index_value: 90.0 }
              as: ProcurementManager
            - call: "POST /ingredient-contracts/${ca_id}/index-readings"
              payload: { effective_date: "2026-08-01", index_value: 120.0 }
              as: ProcurementManager
            - call: "POST /ingredient-contracts/${ca_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-PRC-B", supplier_name: "Durum Co", ingredient_type: "DURUM_SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "SPOT_BLEND", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { cb_id: $.data.id }
            - call: "POST /ingredient-contracts/${cb_id}/index-readings"
              payload: { effective_date: "2026-07-20", index_value: 100.0 }
              as: ProcurementManager
            - call: "POST /ingredient-contracts/${cb_id}/index-readings"
              payload: { effective_date: "2026-08-10", index_value: 110.0 }
              as: ProcurementManager
            - call: "POST /ingredient-contracts/${cb_id}/activate"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /semolina-lots"
              payload: { contract_id: "${ca_id}", delivery_date: "2026-08-15", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_a: $.data.id, unit_a: $.data.unit_price_cents }
            - call: "POST /semolina-lots"
              payload: { contract_id: "${cb_id}", delivery_date: "2026-08-15", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_b: $.data.id, unit_b: $.data.unit_price_cents }
          assert:
            - "SemolinaLot.${lot_a}.unit_price_cents == 600"
            - "SemolinaLot.${lot_a}.total_price_cents == 60000"
            - "SemolinaLot.${lot_b}.unit_price_cents == 525"
            - "SemolinaLot.${lot_b}.total_price_cents == 52500"
            - "unit_a != unit_b (variant divergence on identical base/reference/weight)"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: changeover_matrix_wear_tier_allergen_composition
        grounds:
          - calculations.changeover_minutes
          - entities.ProductionRun.fields.changeover_minutes
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: shape-family matrix base
          (SPECIALTY->LONG_CUT = 75) + die wear tier adder (ratio 0.85 >= 0.80 -> +40)
          + allergen adder (0, both runs non-GF) compose to exactly 115 minutes.
        test_recipe:
          setup:
            - "ACTIVE SEMOLINA contract; ACCEPTED lot of 3000 kg (lab protein 13.8 >= recipe minimum 12.0)"
            - "Recipe R1 SPECIALTY BRANDED non-GF STANDARD curve approved; die D-SPE SPECIALTY rated 2000 kg mounted on line L1"
            - "Run1 (1700 kg, window 2026-08-10T00:00:00Z..2026-08-11T00:00:00Z) driven to COMPLETED so die.extruded_kg == 1700 (wear ratio 0.85)"
            - "Recipe R2 LONG_CUT BRANDED non-GF approved"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-CHO", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 3000.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /semolina-lots/${lot_id}/lab-results"
              payload: { lab_protein_pct: 13.8, lab_moisture_pct: 13.0, lab_gluten_index: 88, lab_falling_number_s: 340 }
              as: QATechnician
              as_user_id: "tech-1"
            - call: "POST /semolina-lots/${lot_id}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /recipes"
              payload: { recipe_name: "Farfalle R1", brand_type: "BRANDED", shape_family: "SPECIALTY", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0, min_protein_pct: 12.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r1_id: $.data.id }
            - call: "POST /recipes/${r1_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /recipes"
              payload: { recipe_name: "Spaghetti R2", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0, min_protein_pct: 12.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r2_id: $.data.id }
            - call: "POST /recipes/${r2_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /production-lines"
              payload: { line_name: "L1" }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /extrusion-dies"
              payload: { die_code: "D-SPE", shape_family: "SPECIALTY", rated_capacity_kg: 2000.0 }
              as: PlantManager
              captures: { die_id: $.data.id }
            - call: "POST /extrusion-dies/${die_id}/mount"
              payload: { line_id: "${line_id}" }
              as: ProductionOperator
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { line_v: $.data.version }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r1_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 1700.0, scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-11T00:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionOperator
              captures: { run1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-runs/${run1_id}/advance"
              payload: { initial_moisture_pct: 28.0 }
              as: ProductionOperator
            - call: "GET /drying-sessions"
              payload: { run_id: "${run1_id}" }
              as: ProductionOperator
              captures: { sess_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlantManager
            - call: "POST /drying-sessions/${sess_id}/finish"
              payload: {}
              as: ProductionOperator
            - call: "POST /drying-sessions/${sess_id}/lab-results"
              payload: { lab_moisture_pct: 12.0 }
              as: QATechnician
              as_user_id: "tech-1"
            - call: "POST /production-runs/${run1_id}/advance"
              payload: { actual_yield_kg: 1600.0 }
              as: ProductionOperator
            - call: "GET /packaging-jobs"
              payload: { run_id: "${run1_id}" }
              as: ProductionOperator
              captures: { job_id: "$.data[0].id" }
            - call: "POST /packaging-jobs/${job_id}/complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionOperator
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { line_v2: $.data.version }
          trigger:
            - call: "POST /production-runs"
              payload: { recipe_id: "${r2_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 100.0, scheduled_start: "2026-08-12T00:00:00Z", scheduled_end: "2026-08-13T00:00:00Z", expected_line_version: "${line_v2}" }
              as: ProductionOperator
              captures: { run2_id: $.data.id, cho2: $.data.changeover_minutes }
          assert:
            - "ExtrusionDie.${die_id}.extruded_kg == 1700.0 (wear ratio 0.85)"
            - "ProductionRun.${run1_id}.production_status == COMPLETED"
            - "ProductionRun.${run2_id}.changeover_minutes == 115"
            - "changeover decomposition: 75 (SPECIALTY->LONG_CUT) + 40 (wear >= 0.80) + 0 (no allergen transition)"

      - name: case_plan_weight_cap_then_partial_then_pallet_rounding
        grounds:
          - calculations.case_plan
          - entities.PackagingJob.fields.units_per_case
          - entities.PackagingJob.fields.pallet_count
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: weight cap floors units-per-case FIRST
          (min(30, floor(12000/500)) = 24), then floor division into cases (2002 = 83*24 + 10),
          branded remainder 10 >= 6 adds one partial case, ceil into pallets LAST (84 cases ->
          3 pallets). Aggregating at nominal 30/case instead would wrongly yield 67 cases / 2 pallets.
        test_recipe:
          setup:
            - "ACTIVE SEMOLINA contract; ACCEPTED lot 3000 kg"
            - "BRANDED recipe LONG_CUT STANDARD target 12.5, unit 500g, nominal 30/case, cap 12.0 kg, 40 cases/pallet"
            - "Run planned 2000 kg driven to DRYING with CONFIRMED session"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-PKG", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 3000.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /semolina-lots/${lot_id}/lab-results"
              payload: { lab_protein_pct: 13.8, lab_moisture_pct: 13.0, lab_gluten_index: 88, lab_falling_number_s: 340 }
              as: QATechnician
              as_user_id: "tech-1"
            - call: "POST /semolina-lots/${lot_id}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /recipes"
              payload: { recipe_name: "Penne PKG", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0, min_protein_pct: 12.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_id: $.data.id }
            - call: "POST /recipes/${r_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /production-lines"
              payload: { line_name: "L-PKG" }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /extrusion-dies"
              payload: { die_code: "D-PKG", shape_family: "LONG_CUT", rated_capacity_kg: 100000.0 }
              as: PlantManager
              captures: { die_id: $.data.id }
            - call: "POST /extrusion-dies/${die_id}/mount"
              payload: { line_id: "${line_id}" }
              as: ProductionOperator
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { line_v: $.data.version }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 2000.0, scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-11T00:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionOperator
              captures: { run_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /production-runs/${run_id}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-runs/${run_id}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-runs/${run_id}/advance"
              payload: { initial_moisture_pct: 28.0 }
              as: ProductionOperator
            - call: "GET /drying-sessions"
              payload: { run_id: "${run_id}" }
              as: ProductionOperator
              captures: { sess_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlantManager
            - call: "POST /drying-sessions/${sess_id}/finish"
              payload: {}
              as: ProductionOperator
            - call: "POST /drying-sessions/${sess_id}/lab-results"
              payload: { lab_moisture_pct: 12.0 }
              as: QATechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /production-runs/${run_id}/advance"
              payload: { actual_yield_kg: 1001.0 }
              as: ProductionOperator
            - call: "GET /packaging-jobs"
              payload: { run_id: "${run_id}" }
              as: ProductionOperator
              captures: { job_id: "$.data[0].id" }
          assert:
            - "PackagingJob.${job_id}.total_units == 2002"
            - "PackagingJob.${job_id}.units_per_case == 24 (weight cap binds below nominal 30)"
            - "PackagingJob.${job_id}.full_case_count == 83"
            - "PackagingJob.${job_id}.partial_case_count == 1 (remainder 10 >= PARTIAL_CASE_MIN_UNITS 6, BRANDED)"
            - "PackagingJob.${job_id}.scrapped_units == 0"
            - "PackagingJob.${job_id}.case_count == 84"
            - "PackagingJob.${job_id}.pallet_count == 3"
            - "Unit conservation: 83*24 + 10 + 0 == 2002"

      - name: settlement_tier_evaluation_order_pre_delivery_cumulative
        grounds:
          - calculations.contract_settlement_price
          - entities.IngredientContract.fields.cumulative_delivered_kg
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned: the volume tier is read from
          cumulative_delivered_kg BEFORE the current receipt is added. A 500 kg receipt at
          cumulative 19900 prices at tier 1 (400c) even though it pushes the contract to
          20400; only the NEXT receipt (tier 2, 392c) sees the crossed threshold.
        test_recipe:
          setup:
            - "ACTIVE SEMOLINA contract C-TIER (base 400, ref 100.0, INDEX_LAGGED, no readings -> ratio 1.0000)"
            - "Receipt 1 of 19900 kg already priced at tier 1"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-TIER", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 400, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 19900.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-02", received_weight_kg: 500.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot2: $.data.id }
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-03", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot3: $.data.id }
          assert:
            - "SemolinaLot.${lot1}.unit_price_cents == 400 (tier 1 at cumulative 0)"
            - "SemolinaLot.${lot2}.unit_price_cents == 400 (tier read BEFORE adding: 19900 < 20000)"
            - "SemolinaLot.${lot2}.total_price_cents == 200000"
            - "SemolinaLot.${lot3}.unit_price_cents == 392 (tier 2 at cumulative 20400; 400*0.98)"
            - "SemolinaLot.${lot3}.total_price_cents == 39200"
            - "IngredientContract.${c_id}.cumulative_delivered_kg == 20500.0"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: production_run_dual_dimension_independence
        grounds:
          - state_machines.ProductionRun.PENDING_QA_to_HELD
          - state_machines.ProductionRun.HELD_to_RELEASED
          - entities.ProductionRun.fields.production_status
          - entities.ProductionRun.fields.quality_disposition
        distinguishing_aspect: |
          ProductionRun carries two independent state dimensions on one row: quality_disposition
          moves PENDING_QA -> HELD while production_status stays PACKAGING, a quality-release is
          rejected (ERR_INVALID_STATE) until production reaches COMPLETED, and the dimensions then
          settle at COMPLETED x RELEASED — neither dimension is a function of the other.
        test_recipe:
          setup:
            - "ACTIVE contract + ACCEPTED lot 3000 kg + approved BRANDED non-GF LONG_CUT recipe + line with mounted LONG_CUT die"
            - "Run planned 2000 kg advanced to PACKAGING (drying CONFIRMED, PackagingJob CREATED)"
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-DD", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
