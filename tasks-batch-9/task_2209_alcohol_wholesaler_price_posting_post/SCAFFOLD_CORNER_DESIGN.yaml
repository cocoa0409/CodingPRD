# =============================================================================
# §1.9 Scaffold Corner Design — task_2209_alcohol_wholesaler_price_posting_post
#
# Breadth probe. Walks references/claim-extraction-guide.md row by row against
# §1.1–§1.7 of SCAFFOLD.yaml and emits one instance per applicable row that
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already exercise. Every
# non-stub instance carries a fully executable test_recipe reachable from an
# empty database using only §1.5 endpoints; the logical clock starts at
# 2026-08-01T00:00:00Z and is moved only through POST /_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: state_program_creation_returns_created_program_with_supplied_fields
        claim_type: creation
        grounds: [entities.StateProgram, "endpoints[POST /state-programs]"]
        distinguishing_aspect: "Creation with every optional threshold supplied explicitly: the response must echo all sixteen configuration fields, not just the two required ones, and must mint id/created_at/updated_at/version."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to its start instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "NV", program_name: "Nevada Price Posting Program", posting_deadline_day: 5, hold_window_days: 2, correction_window_days: 9, combo_cooldown_days: 4, quantity_discount_allowed: false, combination_sale_allowed: false, max_quantity_discount_pct: 0.20, max_promotional_allowance_pct: 0.03, depletion_allowance_per_case_cents: 200, late_filing_penalty_cents: 300000, repeat_correction_penalty_cents: 120000, frivolous_amendment_penalty_cents: 80000, off_posted_penalty_rate_pct: 0.50, max_corrections_per_schedule: 1 }
              as: ComplianceOfficer
              captures: { prog_nv: $.data.id }
          assert:
            - "HTTP status is 201."
            - "data.state_code == \"NV\" and data.program_name == \"Nevada Price Posting Program\"."
            - "data.posting_deadline_day == 5, data.hold_window_days == 2, data.correction_window_days == 9, data.combo_cooldown_days == 4."
            - "data.quantity_discount_allowed == false and data.combination_sale_allowed == false."
            - "data.max_quantity_discount_pct == 0.20 and data.max_promotional_allowance_pct == 0.03."
            - "data.depletion_allowance_per_case_cents == 200."
            - "data.late_filing_penalty_cents == 300000, data.repeat_correction_penalty_cents == 120000, data.frivolous_amendment_penalty_cents == 80000."
            - "data.off_posted_penalty_rate_pct == 0.50 and data.max_corrections_per_schedule == 1."
            - "data.id is a non-empty string, data.created_at and data.updated_at are ISO-8601 instants, data.version == 1."
            - "meta.api_request_id and meta.api_request_timestamp are present and response_type == \"object\"."

      - name: state_program_omitted_optional_fields_receive_declared_defaults
        claim_type: defaults
        grounds: [entities.StateProgram.posting_deadline_day, entities.StateProgram.hold_window_days, entities.StateProgram.correction_window_days, entities.StateProgram.combo_cooldown_days, entities.StateProgram.max_quantity_discount_pct, entities.StateProgram.max_promotional_allowance_pct, entities.StateProgram.depletion_allowance_per_case_cents, entities.StateProgram.late_filing_penalty_cents, entities.StateProgram.repeat_correction_penalty_cents, entities.StateProgram.frivolous_amendment_penalty_cents, entities.StateProgram.off_posted_penalty_rate_pct, entities.StateProgram.max_corrections_per_schedule]
        distinguishing_aspect: "All fourteen optional fields omitted at once; every declared default must materialise, including the two booleans that default to true and the money defaults the whole penalty ledger depends on."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
          assert:
            - "HTTP status is 201."
            - "data.posting_deadline_day == 10, data.hold_window_days == 3, data.correction_window_days == 15, data.combo_cooldown_days == 7."
            - "data.quantity_discount_allowed == true and data.combination_sale_allowed == true."
            - "data.max_quantity_discount_pct == 0.15 and data.max_promotional_allowance_pct == 0.05."
            - "data.depletion_allowance_per_case_cents == 150."
            - "data.late_filing_penalty_cents == 250000, data.repeat_correction_penalty_cents == 100000, data.frivolous_amendment_penalty_cents == 75000."
            - "data.off_posted_penalty_rate_pct == 0.40 and data.max_corrections_per_schedule == 2."

      - name: state_program_missing_required_program_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.StateProgram.program_name, "validations[priority 4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A required field with no default is absent while every optional field is also absent, so the only possible complaint is the missing required field."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "TX" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400."
            - "data.error_id == \"ERR_INVALID_REQUEST\"."
            - "response_type == \"error\" and no StateProgram was created: a following GET /state-programs returns data == [] with total_count == 0."

      - name: state_program_posting_deadline_day_above_declared_range_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.StateProgram.posting_deadline_day, "validations[priority 4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Numeric range boundary on an OPTIONAL field: 28 is the declared maximum and must be accepted, 29 must be rejected — the range is enforced even though omitting the field entirely is legal."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "OK", program_name: "Oklahoma Program", posting_deadline_day: 28 }
              as: ComplianceOfficer
              captures: { prog_ok: $.data.id }
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Program", posting_deadline_day: 29 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "The setup_api_calls creation with posting_deadline_day 28 returned 201 with data.posting_deadline_day == 28."
            - "The trigger returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /state-programs returns total_count == 1 — only the OK program exists."

      - name: wholesaler_license_status_unknown_enum_member_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Wholesaler.license_status, "validations[priority 4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Enum membership on an optional enum field: the value is a plausible-looking third state (REVOKED) that the constraint does not declare, so it must be rejected at priority 4 before the state_program_id foreign key at priority 5 is even resolved."
        test_recipe:
          setup:
            - "One state program exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}", license_status: "REVOKED" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400."
            - "data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /wholesalers returns data == [] with total_count == 0."

      - name: brand_registration_interval_ordered_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Brand.registration_expires_on, "validations[priority 4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Interval ordering is a priority-4 body-shape complaint, not a priority-13 interval-conflict complaint: with zero existing registrations there is nothing to overlap, so only the reversed interval can explain the rejection."
        test_recipe:
          setup:
            - "One state program, one wholesaler and one FILING_AGENT licensee user exist; no brands exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}" }
              as: ComplianceOfficer
              captures: { whA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agentA: $.data.id }
          trigger:
            - call: "POST /brands"
              payload: { wholesaler_id: "${whA}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2027-01-01T00:00:00Z", registration_expires_on: "2026-01-01T00:00:00Z" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400."
            - "data.error_id == \"ERR_INVALID_REQUEST\" — not ERR_BRAND_REGISTRATION_OVERLAP."
            - "GET /brands?wholesaler_id=${whA} returns data == [] with total_count == 0."

      - name: price_schedule_computed_fields_are_server_derived_and_client_values_are_ignored_input
        claim_type: computed_fields
        grounds: [entities.PriceSchedule.effective_date, entities.PriceSchedule.status, entities.PriceSchedule.is_late, entities.PriceSchedule.item_count, calculations.schedule_effective_date]
        distinguishing_aspect: "The create payload carries values for four computed fields at once (status POSTED, effective_date in the past, is_late true, item_count 9). §1.5 declares only three inputs, so every one of them must be ignored and the server's own derivation must win."
        test_recipe:
          setup:
            - "One state program, one wholesaler and one FILING_AGENT user exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}" }
              as: ComplianceOfficer
              captures: { whA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agentA: $.data.id }
          trigger:
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${whA}", state_program_id: "${prog}", posting_month: "2026-09", status: "POSTED", effective_date: "2020-01-01T00:00:00Z", is_late: true, item_count: 9 }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { schedA: $.data.id }
          assert:
            - "HTTP status is 201."
            - "data.status == \"DRAFT\" — the supplied POSTED was ignored."
            - "data.effective_date == \"2026-10-01T00:00:00.000Z\" — derived from posting_month, not the supplied 2020 instant."
            - "data.is_late == false and data.item_count == 0."
            - "data.filed_at == null, data.filed_by_user_id == null, data.certified_at == null, data.certified_by_user_id == null, data.hold_window_ends_at == null."
            - "data.return_count == 0, data.correction_count == 0, data.superseded_by_schedule_id == null."

      - name: price_schedule_item_system_fields_are_minted_by_server_and_client_id_is_ignored_input
        claim_type: system_fields
        grounds: [entities.PriceScheduleItem, "endpoints[POST /price-schedule-items]"]
        distinguishing_aspect: "A client-supplied id/created_at/version on a child entity must not be honoured; the parent's item_count and version must also advance, proving the server owns the whole record."
        test_recipe:
          setup:
            - "A DRAFT price schedule with an approved brand exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}" }
              as: ComplianceOfficer
              captures: { whA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agentA: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${whA}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { brandA: $.data.id }
            - call: "POST /brands/${brandA}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${whA}", state_program_id: "${prog}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { schedA: $.data.id, schedA_v0: $.data.version }
          trigger:
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${schedA}", brand_id: "${brandA}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000, id: "11111111-1111-1111-1111-111111111111", created_at: "2001-01-01T00:00:00Z", version: 77, status: "EFFECTIVE", amendment_count: 4 }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { itemA: $.data.id }
          assert:
            - "HTTP status is 201."
            - "data.id != \"11111111-1111-1111-1111-111111111111\"."
            - "data.created_at is not \"2001-01-01T00:00:00.000Z\"; it equals the logical clock instant 2026-08-01T00:00:00.000Z."
            - "data.version == 1, data.status == \"DRAFT\", data.amendment_count == 0, data.correction_count == 0."
            - "data.certified_case_price_cents == null and data.certified_unit_price_cents == null."
            - "GET /price-schedules/${schedA} shows item_count == 1 and version == ${schedA_v0} + 1."

      - name: wholesaler_retrieval_returns_stored_fields_with_every_penalty_counter_zeroed
        claim_type: retrieval
        grounds: [entities.Wholesaler, "endpoints[GET /wholesalers/{id}]"]
        distinguishing_aspect: "A freshly created wholesaler must read back with all nine computed accrual/counter fields at their zero defaults — the penalty ledger starts empty, and this is the baseline every later ledger assertion is measured against."
        test_recipe:
          setup:
            - "One state program exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}" }
              as: ComplianceOfficer
              captures: { whA: $.data.id }
          trigger:
            - call: "GET /wholesalers/${whA}"
              as: FilingAgent
          assert:
            - "HTTP status is 200."
            - "data.license_number == \"W-1001\", data.legal_name == \"Lone Star Distributing\", data.state_program_id == \"${prog}\"."
            - "data.license_status == \"ACTIVE\" (default applied)."
            - "data.late_filing_penalty_accrued_cents == 0, data.correction_penalty_accrued_cents == 0, data.amendment_penalty_accrued_cents == 0, data.assessed_penalty_cents == 0, data.penalty_exposure_cents == 0."
            - "data.late_filing_count == 0, data.frivolous_amendment_count == 0, data.off_posted_violation_count == 0, data.open_audit_count == 0."
            - "data.version == 1."

      - name: licensee_user_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /licensee-users]", response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "Three records with limit 2: the first page must report has_more true with total_count 3, and the second page must report has_more false while total_count stays 3 — total_count is the unpaginated count, not the page size."
        test_recipe:
          setup:
            - "One wholesaler with three licensee users exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}" }
              as: ComplianceOfficer
              captures: { whA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agentA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { certA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Dana Dual", user_role: "DUAL_ROLE" }
              as: ComplianceOfficer
              captures: { dualA: $.data.id }
          trigger:
            - call: "GET /licensee-users?wholesaler_id=${whA}&limit=2&offset=0"
              as: ComplianceOfficer
            - call: "GET /licensee-users?wholesaler_id=${whA}&limit=2&offset=2"
              as: ComplianceOfficer
          assert:
            - "Both calls return HTTP 200 with response_type == \"array\"."
            - "First call: data has exactly 2 elements, total_count == 3, has_more == true, limit == 2, offset == 0."
            - "Second call: data has exactly 1 element, total_count == 3, has_more == false, limit == 2, offset == 2."
            - "The three ids returned across the two pages are exactly ${agentA}, ${certA} and ${dualA} with no repeats."
            - "GET /licensee-users?wholesaler_id=${whA}&user_role=DUAL_ROLE returns total_count == 1 and data[0].id == \"${dualA}\"."

      - name: get_price_schedule_item_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PRICE_SCHEDULE_ITEM_NOT_FOUND]", "validations[priority 3]"]
        distinguishing_aspect: "A syntactically valid but unissued UUID on a path parameter must produce the entity-specific 404, not a generic 400 and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database beyond the clock reset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /price-schedule-items/99999999-9999-4999-8999-999999999999"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404."
            - "data.error_id == \"ERR_PRICE_SCHEDULE_ITEM_NOT_FOUND\"."
            - "response_type == \"error\"."

      - name: audit_finding_is_immutable_with_no_version_field_and_no_write_endpoint
        claim_type: immutability
        grounds: [entities.AuditFinding, "endpoints[GET /audit-findings]", "endpoints[GET /audit-findings/{id}]"]
        distinguishing_aspect: "AuditFinding is the only entity declared with common_fields false. It must materialise only as a side effect of collection, expose id/created_at but no updated_at and no version, and §1.5 must offer no way to create, edit or delete one."
        test_recipe:
          setup:
            - "An off-posted invoice line has been collected into a compliance audit, producing exactly one finding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}" }
              as: ComplianceOfficer
              captures: { whA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agentA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { certA: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${whA}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { brandA: $.data.id }
            - call: "POST /brands/${brandA}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${whA}", state_program_id: "${prog}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { schedA: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${schedA}", brand_id: "${brandA}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { itemA: $.data.id }
            - call: "POST /price-schedules/${schedA}/submit"
              as: FilingAgent
              as_user_id: "${agentA}"
            - call: "POST /price-schedules/${schedA}/certify"
              as: CertifyingOfficer
              as_user_id: "${certA}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog}" }
