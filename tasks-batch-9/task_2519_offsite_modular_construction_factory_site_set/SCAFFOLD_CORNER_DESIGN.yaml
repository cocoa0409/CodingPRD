            - "${gust} == 8 — the weather observation is shared with ProgramAdmin, an opaque role that needs no ownership binding"
            - "${cst} == 'OPEN' and ${claim} is a stored id — claim creation is shared between the factory and the field"
            - "${ls} == 'PAUSED' — the line-state PATCH is shared between ProgramAdmin and FactoryProductionManager"

      - name: segregation_of_duties_on_the_design_review
