        distinguishing_aspect: "The body carries a well-formed expected_reagent_lot_version, so the 404 proves subject existence is resolved BEFORE the optimistic-concurrency comparison — otherwise a 412 could mask a typo'd id forever."
        test_recipe:
          setup:
            - "One PLANNED ReagentLot ENT-NF-2 exists only so a real version number is available for the OCC field; the triggering call targets a different, non-existent lot id."
