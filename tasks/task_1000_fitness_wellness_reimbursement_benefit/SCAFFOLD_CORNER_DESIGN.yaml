            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "EB", full_name: "Mem B", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { mB: $.data.id } }
          trigger:
            - { call: "GET /api/members/${mB}", payload: {}, as: Member, as_user_id: "${mA}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP; http 403"

      - name: provider_operator_cannot_activate_provider
        claim_type: rbac_denial
        grounds: [roles."ProviderOperator", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Provider lifecycle is BenefitsAdmin-exclusive; the provider itself cannot self-activate."
        test_recipe:
          setup: ["provider in PENDING_ONBOARD"]
          setup_api_calls:
            - { call: "POST /api/providers", payload: { name: "SelfGym", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: ProviderOperator, as_user_id: "${prov_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE; http 403; provider remains PENDING_ONBOARD"

  - section: cross_cutting_complexity_layers
    instances:
      - name: plan_tier_amendment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-tier-amendment-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on BenefitPlan.version: a tier amendment carrying the pre-amendment version fails 412 after a first amendment advanced it."
        test_recipe:
          setup: ["plan DRAFT with initial tier set (version advanced to 2 by the first PUT)"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
          trigger:
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin, captures: { plan_v2: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 99999, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first PUT succeeds and BenefitPlan.version == ${plan_v} + 1"
            - "second PUT with the stale ${plan_v} error_id == ERR_STALE_VERSION; http 412"

      - name: provider_contract_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[provider-contract-amendment-stale-provider]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Provider.version: a contract re-paper with a stale expected version fails 412 after a prior amendment advanced the version."
