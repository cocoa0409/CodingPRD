      - name: passthrough_estimate_rolls_up_to_cycle_ledger
        claim_type: ledger_sync
        grounds:
          - endpoints[POST /cpa/pass-through-claims]
          - entities.ScheduleCycle.fields.estimated_passthrough_total_usd
          - entities.PassThroughClaim.fields.estimated_amount_usd
        distinguishing_aspect: "Creating a pass-through claim immediately syncs the parent cycle's estimate ledger while leaving the settlement ledger at 0.00 — the two ledgers move on different events."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base and an OPEN cycle 2026-09 (published_departures 10) that has no pass-through claims."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
