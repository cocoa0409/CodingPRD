scaffold_corner_design:
  - section: validations
    instances:
      - name: validation_p13_component_shortage_already_asserted_by_difficulty_design
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_COMPONENT_SHORTAGE]
          - entities.Component.fields.on_hand_qty
          - state_machines.ProductionOrder.DRAFT_to_COMPONENT_RESERVED
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_component_stock_exact_vs_one_short
          rationale: "Asserted as the failure path of the named §1.8 instance: its trigger drives POST /api/v1/production-orders/{id}/reserve-components for an order whose requirement is qty_per_car 2 * quantity 5 == 10 while Component.on_hand_qty is 9, and its third assertion pins error_id ${sh_err} == ERR_COMPONENT_SHORTAGE with http_status == 409, alongside the accepted on_hand_qty 10 control that commits the stock exactly."

      - name: validation_p14_horizon_short_of_worst_gated_lead_returns_lead_time_infeasible
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_LEAD_TIME_INFEASIBLE]
          - calculations.production_feasibility_gate
          - entities.Component.fields.lead_time_days
          - entities.ProductionOrder.fields.required_delivery_date
        distinguishing_aspect: "A 29-day order-to-delivery horizon on a car type whose only gated row is a WHEELSET with lead_time_days 60 and qty_per_car 2, so worst_lead is ceil(60 / 2) = 30 days, is rejected at order creation by priority 14 with ERR_LEAD_TIME_INFEASIBLE and HTTP 422, while the identical order whose horizon is exactly 30 days is accepted with HTTP 201."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type LT-100 (BOXCAR, build_hours 1, regulatory_life_years 15, line_count_family LT_LINE) with one bill-of-material row against WHEELSET WS-LT-1 at qty_per_car 2."
            - "Component WS-LT-1 is created with lead_time_days 60 and on_hand_qty 100, so the gated lead per §1.3 production_feasibility_gate is ceil(60 / 2) = 30 days and stock is not the binding constraint."
            - "Horizon is required_delivery_date - order_date: 2026-09-01 to 2026-09-30 is 29 days (one short of the gate) and 2026-09-01 to 2026-10-01 is exactly 30 days (the boundary)."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "LT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "LT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-LT-1", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 60, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 2 }
              as: ProductionPlanner
          trigger:
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-30" }
              as: ProductionPlanner
              captures: { err_lead: $.data.error_id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-10-01" }
              as: ProductionPlanner
              captures: { ok_id: $.data.id, ok_status: $.data.status }
            - call: "GET /api/v1/production-orders?car_type_id=${ct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { only_order: "$.data[0].id" }
          assert:
            - "The 29-day order returns HTTP 422 with data.error_id == ${err_lead} == \"ERR_LEAD_TIME_INFEASIBLE\""
            - "The comparison is horizon 29 (2026-09-30 minus 2026-09-01) < worst_lead 30 == ceil(60 / 2) over the single gated WHEELSET row"
            - "The 30-day order at the exact boundary is accepted with HTTP 201, data.status == ${ok_status} == \"DRAFT\", id ${ok_id}"
            - "GET /api/v1/production-orders?car_type_id=${ct_id} lists exactly one row, ${only_order} == ${ok_id}, so the rejected 29-day order persisted nothing"
            - "The gate reads only WHEELSET and CASTING rows, so the rejection is driven by the gated lead rather than by component stock, which is 100 units against a requirement of 2"

      - name: validation_p14_satisfaction_horizon_exactly_worst_lead_passes
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=14]
          - calculations.production_feasibility_gate
          - entities.Component.fields.lead_time_days
          - state_machines.ProductionOrder.DRAFT_to_COMPONENT_RESERVED
        distinguishing_aspect: "An order whose horizon equals the worst gated lead time exactly (30 == ceil(60 / 2)) is not merely created but also passes the second site of the same gate, POST /api/v1/production-orders/{id}/reserve-components, moving the order to COMPONENT_RESERVED with HTTP 200."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type LT-100 (BOXCAR, build_hours 1, regulatory_life_years 15, line_count_family LT_LINE) with one bill-of-material row against WHEELSET WS-LT-1 at qty_per_car 2 and on_hand_qty 100."
            - "The order is created with order_date 2026-09-01 and required_delivery_date 2026-10-01, giving horizon 30 days against worst_lead ceil(60 / 2) == 30 — satisfied exactly, with no slack."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "LT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "LT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-LT-1", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 60, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 2 }
              as: ProductionPlanner
          trigger:
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-10-01" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_status: $.data.status, po_horizon_end: $.data.required_delivery_date }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
              captures: { reserved_status: $.data.status, reserved_version: $.data.version }
          assert:
            - "Creation returns HTTP 201 with data.status == ${po_status} == \"DRAFT\" and required_delivery_date == ${po_horizon_end} == \"2026-10-01\""
            - "The horizon is exactly 30 days (2026-10-01 minus 2026-09-01) and worst_lead is exactly ceil(60 / 2) == 30, so the >= gate is satisfied with zero slack"
            - "The second gate site passes too: POST /api/v1/production-orders/${po_id}/reserve-components returns HTTP 200 with data.status == ${reserved_status} == \"COMPONENT_RESERVED\" and data.version == ${reserved_version} == 2"
            - "Component ${ws_id}.on_hand_qty == 98 after reservation (100 - qty_per_car 2 * quantity 1), proving the reservation committed stock rather than short-circuiting on the feasibility gate"

      - name: validation_p15_approved_material_endorsement_blocks_release
        claim_type: Violation → Error
        grounds:
          - validations[priority=15]
          - errors[ERR_MATERIAL_ENDORSEMENT_PENDING]
          - entities.SubstitutionEndorsement.fields.decides_material
          - state_machines.SubstitutionEndorsement.APPROVED_to_APPLIED
          - state_machines.ProductionOrder.COMPONENT_RESERVED_to_RELEASED
        distinguishing_aspect: "A production order carrying a SubstitutionEndorsement with decides_material true in status APPROVED is refused at POST /api/v1/production-orders/{id}/release with ERR_MATERIAL_ENDORSEMENT_PENDING and HTTP 409, and the order stays COMPONENT_RESERVED, even though every other release precondition holds."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type E15-100 (BOXCAR, build_hours 1, regulatory_life_years 15, line_count_family E15_LINE) with one bill-of-material row against WHEELSET WS-E15-A at qty_per_car 1."
            - "WHEELSET WS-E15-A (unit_cost_cents 1000, lead_time_days 5, on_hand_qty 100) is the original component; CASTING CS-E15-B (unit_cost_cents 2000, lead_time_days 5, on_hand_qty 100) is the substitute, a different component_class, so decides_material is true."
            - "A SOLD order of quantity 1 (planned_shop_days 1, order_date 2026-09-01, required_delivery_date 2026-09-20, horizon 19 >= ceil(5 / 1) = 5) is created; its version is captured at creation, before any mutation."
            - "The endorsement is created while the order is still DRAFT (so expected_production_order_version is the freshly captured version 1), then the order is component-reserved — the original wheelset is in stock, so the reservation does not auto-approve the endorsement — and the endorsement is then approved by a second operator whose X-User-ID differs from the creator's."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "E15-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "E15_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-E15-A", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { ws_a_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-E15-B", component_class: "CASTING", unit_cost_cents: 2000, lead_time_days: 5, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { cs_b_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_a_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws_a_id}", substitute_component_id: "${cs_b_id}", substitute_qty_per_car: 1, decides_material: true, expected_production_order_version: "${po_v}" }
              as: ProductionPlanner
              as_user_id: "planner-15"
              captures: { end_id: $.data.id, end_status: $.data.status }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
              captures: { po_status_reserved: $.data.status }
            - call: "POST /api/v1/substitution-endorsements/${end_id}/approve"
              payload: {}
              as: LeaseAdministrator
              as_user_id: "lease-admin-15"
              captures: { end_status_approved: $.data.status }
          trigger:
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
              captures: { err_material: $.data.error_id }
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: PlatformAdmin
              captures: { po_status_after: $.data.status }
            - call: "GET /api/v1/substitution-endorsements/${end_id}"
              payload: {}
              as: PlatformAdmin
              captures: { end_status_after: $.data.status, end_material_after: $.data.decides_material }
            - call: "GET /api/v1/components/${ws_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ws_a_on_hand: $.data.on_hand_qty, ws_a_reserved: $.data.reserved_qty }
          assert:
            - "Release returns HTTP 409 with data.error_id == ${err_material} == \"ERR_MATERIAL_ENDORSEMENT_PENDING\""
            - "The blocking endorsement is material: decides_material == ${end_material_after} == true and its status at release time is ${end_status_after} == \"APPROVED\", captured as ${end_status} == \"PENDING\" at creation and ${end_status_approved} == \"APPROVED\" after approval"
            - "The order does not advance: ${po_status_reserved} == \"COMPONENT_RESERVED\" and ${po_status_after} == \"COMPONENT_RESERVED\" (never RELEASED), so the rejection performs no partial mutation"
            - "Component ${ws_a_id}.on_hand_qty == ${ws_a_on_hand} == 99 (the reservation committed 1 unit) and reserved_qty == ${ws_a_reserved} == 0, since only RELEASED orders contribute reservations per §1.3 component_allocation"
            - "The endorsement is not applied: it stays APPROVED rather than APPLIED, which is exactly the state priority 15 forbids at release"

      - name: validation_p16_declared_uniqueness_violations_return_duplicate_row
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_ROW]
          - entities.CarType.fields.model_code
          - entities.Component.fields.part_number
          - entities.Lessee.fields.legal_name
          - entities.RetrofitProgram.fields.mandate_code
          - entities.CarTypeComponentRequirement.fields.car_type_id
        distinguishing_aspect: "Each of the five declared uniqueness surfaces — CarType.model_code, Component.part_number, Lessee.legal_name, RetrofitProgram.mandate_code and the (car_type_id, component_id) pair of CarTypeComponentRequirement — rejects its own second insert with ERR_DUPLICATE_ROW and HTTP 409 while the first row of each survives unchanged."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "One row is created on each uniqueness surface: car type DUP-100, component DUP-WS-1, lessee \"Dup Row Rail Co\", retrofit program DUP-MAND-1, and a bill-of-material row pairing DUP-100 with DUP-WS-1."
            - "Every duplicate trigger repeats the same key with an otherwise legal payload (legal enums and numeric ranges), so priority 16 is the only live check and priority 4 cannot fire first — every referenced FK resolves to the row created in setup."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "DUP-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "DUP_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "DUP-WS-1", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 10 }
              as: SupplyChainCoordinator
              captures: { comp_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_id}", qty_per_car: 1 }
              as: ProductionPlanner
              captures: { req_id: $.data.id }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Dup Row Rail Co", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 1000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "DUP-MAND-1", description: "Uniqueness probe mandate", compliance_deadline_date: "2027-01-01", required_shop_days_per_car: 3 }
              as: RegulatoryRetrofitist
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /api/v1/car-types"
              payload: { model_code: "DUP-100", car_class: "TANK", build_hours: 2, regulatory_life_years: 20, line_count_family: "DUP_OTHER_LINE" }
              as: ProductionPlanner
              captures: { err_ct: $.data.error_id }
            - call: "POST /api/v1/components"
              payload: { part_number: "DUP-WS-1", component_class: "CASTING", unit_cost_cents: 2000, lead_time_days: 7, on_hand_qty: 10 }
              as: SupplyChainCoordinator
              captures: { err_comp: $.data.error_id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_id}", qty_per_car: 2 }
              as: ProductionPlanner
              captures: { err_req: $.data.error_id }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Dup Row Rail Co", credit_tier: "C", utilization_threshold_pct: 10, credit_ceiling_cents: 500 }
              as: LeaseAdministrator
              captures: { err_lessee: $.data.error_id }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "DUP-MAND-1", description: "Second mandate under the same code", compliance_deadline_date: "2028-01-01", required_shop_days_per_car: 9 }
              as: RegulatoryRetrofitist
              captures: { err_prog: $.data.error_id }
            - call: "GET /api/v1/car-types/${ct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { kept_model_code: $.data.model_code, kept_build_hours: $.data.build_hours }
          assert:
            - "Duplicate CarType.model_code returns HTTP 409 with data.error_id == ${err_ct} == \"ERR_DUPLICATE_ROW\""
            - "Duplicate Component.part_number returns HTTP 409 with data.error_id == ${err_comp} == \"ERR_DUPLICATE_ROW\""
            - "Duplicate (car_type_id, component_id) pair returns HTTP 409 with data.error_id == ${err_req} == \"ERR_DUPLICATE_ROW\" even though qty_per_car differs (2 vs the stored 1), because the pair itself is the unique key"
            - "Duplicate Lessee.legal_name returns HTTP 409 with data.error_id == ${err_lessee} == \"ERR_DUPLICATE_ROW\""
            - "Duplicate RetrofitProgram.mandate_code returns HTTP 409 with data.error_id == ${err_prog} == \"ERR_DUPLICATE_ROW\""
            - "The first row survives untouched: CarType ${ct_id}.model_code == ${kept_model_code} == \"DUP-100\" and build_hours == ${kept_build_hours} == 1, not the rejected payload's 2"

      - name: validation_p17_missing_enum_and_range_violations_return_invalid_request
        claim_type: Violation → Error
        grounds:
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
          - entities.CarType.fields.car_class
          - entities.Component.fields.component_class
          - entities.ProductionOrder.fields.planned_shop_days
          - entities.ProductionOrder.fields.quantity
          - entities.LeaseContract.fields.term_end_date
        distinguishing_aspect: "Every shape of priority-17 violation — a missing required field, an illegal enum member, a below-minimum integer, and a planned_shop_days that does not equal car_type.build_hours * quantity — is rejected with ERR_INVALID_REQUEST and HTTP 400, while a fully conforming payload on the same endpoints returns 201."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type VAL-100 (BOXCAR, build_hours 1, regulatory_life_years 15, line_count_family VAL_LINE) and lessee \"Valid Request Rail Co\" (credit_tier A, utilization_threshold_pct 50, credit_ceiling_cents 1000000) exist so every FK a rejected payload names still resolves and priority 4 cannot pre-empt priority 17."
            - "The car type has build_hours 1, so a quantity-3 order must carry planned_shop_days 3; the rejected payload carries 5."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "VAL-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "VAL_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id, ct_created_status: $.data.status }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Valid Request Rail Co", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 1000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /api/v1/car-types"
              payload: { model_code: "VAL-BAD-ENUM", car_class: "SUBMARINE", build_hours: 1, regulatory_life_years: 15, line_count_family: "VAL_LINE" }
              as: ProductionPlanner
              captures: { err_enum: $.data.error_id }
            - call: "POST /api/v1/car-types"
              payload: { model_code: "VAL-BAD-RANGE", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 5, line_count_family: "VAL_LINE" }
              as: ProductionPlanner
              captures: { err_life: $.data.error_id }
            - call: "POST /api/v1/components"
              payload: { part_number: "VAL-BAD-CLASS", component_class: "BOLT", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 10 }
              as: SupplyChainCoordinator
              captures: { err_comp_enum: $.data.error_id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 0, planned_shop_days: 0, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { err_qty: $.data.error_id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 3, planned_shop_days: 5, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { err_shop_days: $.data.error_id }
            - call: "POST /api/v1/production-orders"
              payload: { quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { err_missing: $.data.error_id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "NET", per_diem_rate_cents: 2000, liability_bearer: "LESSEE", term_start_date: "2026-09-01", term_end_date: "2026-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { err_term: $.data.error_id }
          assert:
            - "Illegal CarType.car_class \"SUBMARINE\" returns HTTP 400 with data.error_id == ${err_enum} == \"ERR_INVALID_REQUEST\""
            - "CarType.regulatory_life_years 5 below the declared minimum 10 returns HTTP 400 with data.error_id == ${err_life} == \"ERR_INVALID_REQUEST\""
            - "Illegal Component.component_class \"BOLT\" returns HTTP 400 with data.error_id == ${err_comp_enum} == \"ERR_INVALID_REQUEST\""
            - "ProductionOrder.quantity 0 below the declared minimum 1 returns HTTP 400 with data.error_id == ${err_qty} == \"ERR_INVALID_REQUEST\""
            - "planned_shop_days 5 != build_hours 1 * quantity 3 == 3 returns HTTP 400 with data.error_id == ${err_shop_days} == \"ERR_INVALID_REQUEST\""
            - "A missing required car_type_id returns HTTP 400 with data.error_id == ${err_missing} == \"ERR_INVALID_REQUEST\" rather than a 404, because the field is absent rather than unresolvable"
            - "term_end_date 2026-09-01 == term_start_date 2026-09-01 (the rule requires strictly greater) returns HTTP 400 with data.error_id == ${err_term} == \"ERR_INVALID_REQUEST\""
            - "The conforming setup payload was accepted: CarType ${ct_id} was created with status == ${ct_created_status} == \"ACTIVE\", so priority 17 rejects only the malformed payloads"

