    side_effects: ["permit_fee recomputed under the per_unit_rounded variant", "PermitSale.fee_cents := revised_fee_cents and status REMITTED -> CORRECTED", "status TRANSMITTED -> CORRECTED", "remit_variance_cents recomputed against the frozen snapshot"]

