  # =============================================================================
  # RULE 4 - transitive_cascade
  # =============================================================================
  - rule_id: transitive_cascade
    instances:

      - name: final_sample_review_cascades_area_exam_and_collaboration
        grounds:
          - state_machines.ExamScopeArea
          - state_machines.Examination
          - state_machines.MultistateCollaboration
          - calculations.error_rate_and_tolerance
          - endpoints[POST /market-conduct/file-samples/{id}/review]
        distinguishing_aspect: |
          Bubble-up cascade of depth 4 fired by the SMALLEST possible write - reviewing the single
          remaining UNREVIEWED file sample: FileSample -> ExamScopeArea (FIELDWORK -> TESTED plus five
          derived counters) -> Examination (FIELDWORK -> CRITICISM plus criticism_phase_opened_at) ->
          MultistateCollaboration (LEAD_ASSIGNED -> ACTIVE). The area is the LAST one of the
          examination, so the bubble-up guard "every scope area TESTED" is what releases hops 3 and 4.
        test_recipe:
          setup:
            - "AURORA carrier; ON_SITE examination 2026-09-01 .. 2026-11-30 with exactly one scope area (CLAIMS, population 4000, sample 10, statutory tolerance 3.00)."
            - "A multistate collaboration exists on the examination with the standard NV / AZ / UT roster, so it sits in LEAD_ASSIGNED with lead_state_code NV."
            - "Data call accepted -> ten CLM samples drawn at interval 400; area FIELDWORK; examination FIELDWORK."
            - "Both fieldwork workpapers recorded."
            - "Nine of the ten samples already reviewed: CLM-000001 MATERIAL 25000, CLM-000401 MATERIAL 18000 and seven clean; exactly CLM-000801 is left UNREVIEWED."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "POST /market-conduct/examinations/${exam_id}/collaborations"
              payload:
