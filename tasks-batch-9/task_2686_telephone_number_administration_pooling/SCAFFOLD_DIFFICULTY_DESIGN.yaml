  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_approval_rechecks_carrier_readiness_at_review_time
        grounds:
          - state_machines.AllocationRequest.PENDING_REVIEW_to_APPROVED
          - state_machines.Carrier.VERIFIED_to_FAILED
          - validations[priority=13]
          - entities.Carrier.fields.facilities_readiness_status
          - entities.Carrier.fields.eligibility_status
        distinguishing_aspect: |
          The AllocationRequest never leaves PENDING_REVIEW, yet the identical
          APPROVE call is refused and then accepted purely because a different
          entity - the applicant Carrier - moved VERIFIED to FAILED and back to
          VERIFIED, proving eligibility is re-read at review time instead of
          being inherited from the snapshot taken at submission.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier A (OCN 1234) reached license_status GRANTED and facilities_readiness_status VERIFIED, so eligibility_status is ELIGIBLE."
            - "NPA 614 / rate center COLUMBUS with one POOL_AVAILABLE block 614-556-0."
            - "Carrier A submitted a 2026H1 filing computing to 93.33 with forecast [1200, 800, 600, 400] and filed a GROWTH request for 1 block while it was still ELIGIBLE."
