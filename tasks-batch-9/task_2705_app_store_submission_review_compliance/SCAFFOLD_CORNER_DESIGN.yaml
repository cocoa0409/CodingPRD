        distinguishing_aspect: "LOCAL_KEYCHAIN is a legal key_custody value at creation but is refused at activation for a DISTRIBUTION_CERT: 409 ERR_KEY_CUSTODY_NOT_PERMITTED while the row itself remains PENDING_ACTIVATION."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account ACTIVE at version 1 with one PENDING_ACTIVATION IOS DISTRIBUTION_CERT whose key_custody is LOCAL_KEYCHAIN and whose interval covers the clock."
