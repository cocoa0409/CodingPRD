# =============================================================================
# PRD Benchmark Seed Tables
# Task: Community Foundation Fund Administration
# =============================================================================

scenario: |
  Community Foundation Fund Administration (local community foundation): fund establishment (donor advised/designated/scholarship) & agreement terms, contribution acceptance including complex assets, investment pool allocation & unit accounting, grant recommendation review & due diligence on grantees, spending policy & administrative fee assessment, fund advisor succession & inactivity policy, scholarship committee & award disbursement, annual statement & impact reporting

domain_name: community-foundation-funds
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: fund_name, type: string, source: input, description: "Legal fund name; unique per foundation" }
      - { name: fund_type, type: enum, source: input, description: "DONOR_ADVISED | DESIGNATED | SCHOLARSHIP" }
      - { name: status, type: enum, source: system, description: "PENDING_AGREEMENT -> ACTIVE -> INACTIVE -> DORMANT -> CLOSED; also ACTIVE -> CLOSED" }
      - { name: endowed, type: boolean, source: input, description: "True = permanent endowment (spending-policy only); false = non-endowed (fully expendable)" }
      - { name: cash_balance, type: number, source: computed, description: "Spendable cash ledger, starts 0.00; credited on contribution acceptance, debited on grant disbursement, fee assessment, award disbursement" }
      - { name: invested_units, type: number, source: computed, description: "Total pool units currently held across all pools, starts 0.0000" }
      - { name: invested_market_value, type: number, source: computed, description: "Sum over pool holdings of units_held * current unit_price, recomputed on every UnitizationEvent; 2dp" }
      - { name: total_market_value, type: number, source: computed, description: "cash_balance + invested_market_value; 2dp" }
      - { name: spendable_balance, type: number, source: computed, description: "For endowed funds: min(cash_balance, current_spending_allowance_remaining); for non-endowed: cash_balance; 2dp" }
      - { name: current_spending_allowance, type: number, source: computed, description: "Allowance granted by the most recent SpendingPolicyRun for the current fiscal year; 0.00 until first run; 2dp" }
      - { name: allowance_used, type: number, source: computed, description: "Grants+awards disbursed against current fiscal year allowance; resets to 0.00 on each SpendingPolicyRun; 2dp" }
      - { name: inception_date, type: datetime, source: system, description: "Set when fund first reaches ACTIVE" }
      - { name: last_activity_at, type: datetime, source: system, description: "Timestamp of latest contribution acceptance or grant/award disbursement on this fund" }
      - { name: inactivity_months, type: integer, source: computed, description: "Whole months between last_activity_at and current logical clock" }

  - name: FundAgreement
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; agreement governs this fund" }
      - { name: agreement_version_no, type: integer, source: system, description: "1 for the first agreement on a fund; each amendment mints +1" }
      - { name: status, type: enum, source: system, description: "DRAFT -> EXECUTED -> SUPERSEDED; EXECUTED -> TERMINATED" }
      - { name: spending_rate_pct, type: number, source: input, description: "Annual spending rate as decimal percent, e.g. 4.50; range 0.00-20.00" }
      - { name: spending_formula, type: enum, source: input, description: "AVERAGE_12Q (trailing 12 quarter-end average) | FIXED_3YR (trailing 3 fiscal-year-end average)" }
      - { name: fee_tier_schedule, type: enum, source: input, description: "STANDARD (1.00/0.60/0.30 marginal tiers) | FLAT (0.75% flat)" }
      - { name: successor_advisor_id, type: string, source: input, description: "FK -> FundAdvisor.id; optional named successor for DAF inactivity; null allowed", default: null }
      - { name: inactivity_trigger_months, type: integer, source: input, description: "Months without qualifying activity before fund goes INACTIVE; default 36", default: 36 }
      - { name: dormancy_trigger_months, type: integer, source: input, description: "Additional INACTIVE months before DORMANT sweep; default 24", default: 24 }
      - { name: min_initial_contribution, type: number, source: input, description: "Minimum first contribution to activate the fund, in dollars; default 10000.00", default: 10000.00 }
      - { name: executed_at, type: datetime, source: system, description: "Timestamp when agreement moved DRAFT -> EXECUTED" }

  - name: FundAdvisor
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; advisor serves this fund" }
      - { name: advisor_name, type: string, source: input, description: "Full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across all advisors" }
      - { name: advisor_kind, type: enum, source: input, description: "PRIMARY | SUCCESSOR" }
      - { name: status, type: enum, source: system, description: "INVITED -> ACTIVE -> RESIGNED; ACTIVE -> DECEASED; INVITED -> REVOKED" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp of INVITED -> ACTIVE acceptance" }

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; receiving fund" }
      - { name: donor_name, type: string, source: input, description: "Donor legal name" }
      - { name: asset_kind, type: enum, source: input, description: "CASH | PUBLICLY_TRADED | RESTRICTED_STOCK | REAL_PROPERTY" }
      - { name: declared_value, type: number, source: input, description: "Donor-declared fair market value in dollars; 2dp; must be > 0" }
      - { name: acceptance_status, type: enum, source: system, description: "PLEDGED -> ACCEPTED / DECLINED (parallel dimension 1)" }
      - { name: liquidation_status, type: enum, source: system, description: "NOT_REQUIRED -> PENDING_LIQUIDATION -> LIQUIDATED (parallel dimension 2; CASH starts LIQUIDATED, non-cash starts PENDING_LIQUIDATION)" }
      - { name: net_proceeds, type: number, source: computed, description: "For CASH: declared_value; for non-cash: computed by liquidation waterfall at LIQUIDATED; 2dp" }
      - { name: gift_date, type: datetime, source: system, description: "Timestamp of acceptance (PLEDGED -> ACCEPTED)" }
      - { name: decline_reason, type: string, source: system, description: "Required to record when DECLINED; null otherwise", default: null }

  - name: AssetLot
    parent: null
    common_fields: false
    fields:
      - { name: contribution_id, type: string, source: input, description: "FK -> Contribution.id; lot belongs to this contribution" }
      - { name: description, type: string, source: input, description: "Asset description (ticker, parcel id, etc.)" }
      - { name: quantity, type: number, source: input, description: "Units/shares; > 0" }
      - { name: appraised_value, type: number, source: input, description: "Appraised value of this lot in dollars; 2dp; must be > 0" }
      - { name: liquidation_fee_pct, type: number, source: input, description: "Liquidation fee percent for this lot class; default 1.50", default: 1.50 }
      - { name: gross_proceeds, type: number, source: input, description: "Actual gross sale proceeds recorded at liquidation; 2dp; must be >= 0" }

  - name: InvestmentPool
    parent: null
    common_fields: true
    fields:
      - { name: pool_name, type: string, source: input, description: "Pool name; unique" }
      - { name: pool_kind, type: enum, source: input, description: "CONSERVATIVE | BALANCED | GROWTH" }
      - { name: status, type: enum, source: system, description: "OPEN -> SUSPENDED -> OPEN; OPEN -> TERMINATED (terminal)" }
      - { name: nav, type: number, source: computed, description: "Net asset value in dollars; updated only by mark-to-market UnitizationEvent; 2dp" }
      - { name: units_outstanding, type: number, source: computed, description: "Total units issued to all funds; 4dp" }
      - { name: unit_price, type: number, source: computed, description: "nav / units_outstanding, 4dp round_half_up; defined only when units_outstanding > 0" }

  - name: PoolHolding
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; holder fund" }
      - { name: pool_id, type: string, source: input, description: "FK -> InvestmentPool.id; held pool" }
      - { name: units_held, type: number, source: computed, description: "Units of this pool held by this fund; 4dp; row exists only while units_held > 0" }

  - name: UnitizationEvent
    parent: null
    common_fields: false
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> InvestmentPool.id; event's pool" }
      - { name: event_kind, type: enum, source: input, description: "BUY_IN | REDEMPTION | MARK_TO_MARKET" }
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; required for BUY_IN and REDEMPTION; null for MARK_TO_MARKET", default: null }
      - { name: cash_amount, type: number, source: input, description: "BUY_IN: dollars invested; REDEMPTION: units to redeem (interpreted via units_amount) — for BUY_IN this is the cash debited from fund; 2dp" }
      - { name: units_amount, type: number, source: input, description: "REDEMPTION only: units to redeem, 4dp; null otherwise", default: null }
      - { name: new_nav, type: number, source: input, description: "MARK_TO_MARKET only: replacement NAV in dollars, 2dp; null otherwise", default: null }
      - { name: unit_price_applied, type: number, source: computed, description: "Pool unit_price at the instant the event executed; 4dp" }
      - { name: units_delta, type: number, source: computed, description: "Signed units minted (+) or burned (-) by this event; 0.0000 for MARK_TO_MARKET; 4dp" }

  - name: Grantee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Organization legal name; unique" }
      - { name: tax_id, type: string, source: input, description: "9-digit EIN; unique; format NNNNNNNNN" }
      - { name: irs_subsection, type: enum, source: input, description: "C3_501 (public charity) | C3_PRIVATE_FOUNDATION | GOVERNMENT | OTHER" }
      - { name: due_diligence_status, type: enum, source: system, description: "UNVETTED -> IN_REVIEW -> CLEARED / REJECTED_DD; CLEARED -> EXPIRED (auto at 12 months); EXPIRED -> IN_REVIEW" }
      - { name: cleared_at, type: datetime, source: system, description: "Timestamp of last transition to CLEARED; null until first clearance", default: null }
      - { name: expenditure_responsibility_required, type: boolean, source: computed, description: "True when irs_subsection != C3_501 and != GOVERNMENT; drives grant preconditions" }

  - name: GrantRecommendation
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; granting fund" }
      - { name: grantee_id, type: string, source: input, description: "FK -> Grantee.id; recipient" }
      - { name: amount, type: number, source: input, description: "Grant amount in dollars; 2dp; minimum 250.00" }
      - { name: purpose, type: string, source: input, description: "Charitable purpose text" }
      - { name: recommended_by_advisor_id, type: string, source: input, description: "FK -> FundAdvisor.id; advisor who recommended; required for DONOR_ADVISED funds, forbidden otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> COMPLIANCE_REVIEW -> APPROVED -> DISBURSED; COMPLIANCE_REVIEW -> RETURNED -> SUBMITTED (revision loop); COMPLIANCE_REVIEW -> DENIED; APPROVED -> CANCELLED" }
      - { name: revision_count, type: integer, source: computed, description: "Increments on each COMPLIANCE_REVIEW -> RETURNED; starts 0" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of most recent DRAFT/RETURNED -> SUBMITTED" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of APPROVED/DENIED decision; null while pending", default: null }

  - name: Disbursement
    parent: null
    common_fields: false
    fields:
      - { name: source_kind, type: enum, source: input, description: "GRANT | SCHOLARSHIP_AWARD" }
      - { name: grant_id, type: string, source: input, description: "FK -> GrantRecommendation.id; set when source_kind=GRANT; null otherwise", default: null }
      - { name: award_id, type: string, source: input, description: "FK -> ScholarshipAward.id; set when source_kind=SCHOLARSHIP_AWARD; null otherwise", default: null }
      - { name: fund_id, type: string, source: computed, description: "FK -> Fund.id; denormalized from grant/award for statement sweeps" }
      - { name: amount, type: number, source: computed, description: "Dollars disbursed; copied from grant.amount or award.amount at creation; 2dp" }

  - name: SpendingPolicyRun
    parent: null
    common_fields: false
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the allowance applies to, e.g. 2026; unique per fund per year enforced via run scope" }
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; fund whose allowance is computed" }
      - { name: formula_used, type: enum, source: computed, description: "Copied from the fund's EXECUTED FundAgreement.spending_formula at run time" }
      - { name: base_value, type: number, source: computed, description: "Averaged asset base per the formula variant; 2dp" }
      - { name: allowance_granted, type: number, source: computed, description: "base_value * spending_rate_pct / 100; 2dp" }
      - { name: market_values_used, type: array, source: computed, description: "The exact quarter-end or fiscal-year-end market values included in the average (12 or 3 numbers)" }

  - name: MarketValueSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; fund valued" }
      - { name: snapshot_kind, type: enum, source: input, description: "QUARTER_END | FISCAL_YEAR_END" }
      - { name: effective_date, type: datetime, source: input, description: "Date the value is effective; determines trailing-window membership" }
      - { name: market_value, type: number, source: input, description: "Fund total market value at effective_date; 2dp; must be >= 0" }

  - name: FeeAssessment
    parent: null
    common_fields: false
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; assessed fund" }
      - { name: quarter_end_date, type: datetime, source: input, description: "Quarter-end the fee is based on" }
      - { name: quarter_end_balance, type: number, source: input, description: "Fund total_market_value used as the fee base; 2dp" }
      - { name: schedule_used, type: enum, source: computed, description: "Copied from EXECUTED FundAgreement.fee_tier_schedule" }
      - { name: annual_fee, type: number, source: computed, description: "Tiered annual fee on quarter_end_balance; 2dp" }
      - { name: quarterly_fee, type: number, source: computed, description: "annual_fee / 4; 2dp round_half_up; this is the amount debited from cash_balance" }

  - name: ScholarshipProgram
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; fund bankrolling the program; fund_type must be SCHOLARSHIP" }
      - { name: program_name, type: string, source: input, description: "Program name; unique" }
      - { name: status, type: enum, source: system, description: "SETUP -> OPEN -> SCORING -> AWARDED -> CLOSED; SETUP -> CANCELLED" }
      - { name: application_open, type: datetime, source: input, description: "Applications accepted at/after this timestamp" }
      - { name: application_close, type: datetime, source: input, description: "Applications accepted before this timestamp; must be > application_open" }
      - { name: award_amount, type: number, source: input, description: "Fixed award per winner; 2dp; minimum 500.00" }
      - { name: max_awards, type: integer, source: input, description: "Maximum winners selectable; >= 1" }
      - { name: committee_size, type: integer, source: system, description: "Count of committee members enrolled via enrollment endpoint; quorum is ceil(committee_size/2) + (committee_size mod 2 == 0 ? 1 : 0) i.e. strict majority" }
      - { name: quorum_threshold, type: integer, source: computed, description: "floor(committee_size/2) + 1; recomputed on enrollment changes" }

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ScholarshipProgram.id; committee served" }
      - { name: member_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Member email; unique per program" }
      - { name: status, type: enum, source: system, description: "SEATED -> RECUSED / REMOVED" }

  - name: ScholarshipApplication
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ScholarshipProgram.id; program applied to" }
      - { name: applicant_name, type: string, source: input, description: "Applicant full name" }
      - { name: applicant_email, type: string, source: input, description: "Applicant email; unique per program" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_SCORING -> SELECTED / NOT_SELECTED; SELECTED -> ACCEPTED_AWARD / DECLINED_AWARD" }
      - { name: final_score, type: number, source: computed, description: "Mean of submitted ScoreEntry.weighted_score values once quorum met; 2dp; null until quorum", default: null }

  - name: ScoreEntry
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> ScholarshipApplication.id; scored application" }
      - { name: member_id, type: string, source: input, description: "FK -> CommitteeMember.id; scoring member; (application_id, member_id) unique" }
      - { name: academic, type: integer, source: input, description: "0-100" }
      - { name: financial_need, type: integer, source: input, description: "0-100" }
      - { name: essay, type: integer, source: input, description: "0-100" }
      - { name: interview, type: integer, source: input, description: "0-100" }
      - { name: weighted_score, type: number, source: computed, description: "0.40*academic + 0.30*financial_need + 0.20*essay + 0.10*interview; 2dp round_half_up" }

  - name: ScholarshipAward
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> ScholarshipApplication.id; winning application" }
      - { name: program_id, type: string, source: computed, description: "FK -> ScholarshipProgram.id; denormalized from application" }
      - { name: fund_id, type: string, source: computed, description: "FK -> Fund.id; denormalized from program" }
      - { name: amount, type: number, source: computed, description: "Copied from program.award_amount at award creation; 2dp" }
      - { name: status, type: enum, source: system, description: "OFFERED -> ACCEPTED -> DISBURSED; OFFERED -> DECLINED; ACCEPTED -> FORFEITED" }

  - name: AnnualStatement
    parent: null
    common_fields: false
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; statement's fund" }
      - { name: fiscal_year, type: integer, source: input, description: "Statement fiscal year; (fund_id, fiscal_year) unique" }
      - { name: opening_value, type: number, source: computed, description: "Total market value at fiscal-year open; 2dp" }
      - { name: contributions_total, type: number, source: computed, description: "Sum of net_proceeds of contributions ACCEPTED and (liquidation_status=LIQUIDATED) with gift_date in the fiscal year; 2dp" }
      - { name: grants_total, type: number, source: computed, description: "Sum of Disbursement.amount for the fund with disbursement created in the fiscal year; 2dp" }
      - { name: fees_total, type: number, source: computed, description: "Sum of FeeAssessment.quarterly_fee for the fund with quarter_end_date in the fiscal year; 2dp" }
      - { name: closing_value, type: number, source: computed, description: "opening_value + contributions_total - grants_total - fees_total + investment_gain_loss; 2dp" }
      - { name: investment_gain_loss, type: number, source: computed, description: "Change in invested_market_value attributable to MARK_TO_MARKET events in the fiscal year; 2dp; may be negative" }
      - { name: status, type: enum, source: system, description: "GENERATED -> DELIVERED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Fund
    initial_state: PENDING_AGREEMENT
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_AGREEMENT
        to: ACTIVE
        trigger: "POST /funds/{fundId}/activate"
        actor: FoundationAdmin
        preconditions:
          - "Fund has an EXECUTED FundAgreement (ERR_AGREEMENT_NOT_EXECUTED)"
          - "Fund has received at least one ACCEPTED contribution with net_proceeds >= agreement.min_initial_contribution (ERR_MIN_INITIAL_CONTRIBUTION)"
        side_effects:
          - "inception_date set to current logical clock"
          - "last_activity_at set to current logical clock"

      - from: ACTIVE
        to: INACTIVE
        trigger: "system (POST /_clock/set_current_utc advancing inactivity_months to >= agreement.inactivity_trigger_months)"
        actor: system
        preconditions:
          - "fund_type == DONOR_ADVISED"
          - "inactivity_months >= fund's EXECUTED agreement.inactivity_trigger_months"
        side_effects: []

      - from: INACTIVE
        to: ACTIVE
        trigger: "system (any of: contribution acceptance on the fund; grant or award disbursement on the fund; advisor succession event where an INVITED successor auto-activates on this fund)"
        actor: system
        preconditions: []
        side_effects:
          - "last_activity_at refreshed to the current logical clock"

      - from: INACTIVE
        to: DORMANT
        trigger: "system (POST /_clock/set_current_utc advancing inactivity beyond dormancy threshold)"
        actor: system
        preconditions:
          - "inactivity_months >= agreement.inactivity_trigger_months + agreement.dormancy_trigger_months"
        side_effects:
          - "If no ACTIVE or INVITED successor advisor exists: full cash_balance swept to foundation unrestricted fund via internal transfer (recorded as a Disbursement of source_kind GRANT only when a grant exists; sweep is cash ledger movement only)"
          - "GrantRecommendation in DRAFT/SUBMITTED/RETURNED -> DENIED with decided_at set (cascade)"

      - from: DORMANT
        to: CLOSED
        trigger: "POST /funds/{fundId}/close"
        actor: FoundationAdmin
        preconditions:
          - "cash_balance == 0.00 AND invested_units == 0.0000 (ERR_FUND_NOT_EMPTY)"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /funds/{fundId}/close"
        actor: FoundationAdmin
        preconditions:
          - "cash_balance == 0.00 AND invested_units == 0.0000 (ERR_FUND_NOT_EMPTY)"
          - "No GrantRecommendation in {DRAFT, SUBMITTED, COMPLIANCE_REVIEW, RETURNED, APPROVED} (ERR_PENDING_GRANTS)"
          - "No ScholarshipProgram in {SETUP, OPEN, SCORING, AWARDED} (ERR_PROGRAM_OPEN)"
        side_effects: []

  - entity: FundAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /agreements/{agreementId}/execute"
        actor: FoundationAdmin
        preconditions:
          - "No other EXECUTED agreement exists for the same fund (ERR_AGREEMENT_ALREADY_EXECUTED)"
          - "successor_advisor_id, if set, references a FundAdvisor on the same fund (ERR_SUCCESSOR_NOT_ON_FUND)"
        side_effects:
          - "executed_at set to current logical clock"

      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system (a new FundAgreement for the same fund is EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Fund fields derived from agreement terms (spending allowance basis, fee schedule) rebind to the new agreement"

      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /agreements/{agreementId}/terminate"
        actor: FoundationAdmin
        preconditions:
          - "Fund.status == CLOSED (ERR_FUND_NOT_CLOSED)"
        side_effects: []

  - entity: FundAdvisor
    initial_state: INVITED
    terminal_states: [RESIGNED, DECEASED, REVOKED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /advisors/{advisorId}/accept"
        actor: Advisor
        preconditions:
          - "Acting advisor's X-User-ID == this advisor's id (ERR_NOT_THE_INVITED_ADVISOR)"
        side_effects:
          - "activated_at set"

      - from: INVITED
        to: REVOKED
        trigger: "POST /advisors/{advisorId}/revoke"
        actor: FoundationAdmin
        preconditions: []
        side_effects:
          - "If this advisor is named successor_advisor_id on any DRAFT agreement, that field is nulled"

      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /advisors/{advisorId}/resign"
        actor: Advisor
        preconditions:
          - "Acting advisor's X-User-ID == this advisor's id (ERR_NOT_THE_INVITED_ADVISOR)"
        side_effects:
          - "Fund.last_activity_at unchanged (resignation is not qualifying activity)"

      - from: ACTIVE
        to: DECEASED
        trigger: "POST /advisors/{advisorId}/record-deceased"
        actor: FoundationAdmin
        preconditions: []
        side_effects:
          - "Hop 1: this advisor -> DECEASED"
          - "Hop 2 (caused by hop 1): if the fund's EXECUTED agreement names a successor_advisor_id whose status is INVITED, that successor auto-transitions INVITED -> ACTIVE (succession cascade)"
          - "Hop 3 (caused by hop 2): the successor's auto-activation is an advisor succession event on the fund, which refreshes fund.last_activity_at; if Fund.status == INACTIVE the fund auto-transitions INACTIVE -> ACTIVE per the Fund machine"

  - entity: Contribution
    initial_state: "PLEDGED / NOT_REQUIRED-or-PENDING_LIQUIDATION (parallel dimensions)"
    terminal_states: ["ACCEPTED + LIQUIDATED", "DECLINED"]
    transitions:
      - from: PLEDGED
        to: ACCEPTED
        trigger: "POST /contributions/{contributionId}/accept"
        actor: GiftOfficer
        preconditions:
          - "Fund.status in {ACTIVE, PENDING_AGREEMENT} (ERR_FUND_NOT_ACCEPTING)"
        side_effects:
          - "gift_date set to current logical clock"
          - "If asset_kind == CASH: net_proceeds = declared_value, cash_balance += net_proceeds immediately, liquidation_status = LIQUIDATED, fund.last_activity_at refreshed"
          - "If asset_kind != CASH: liquidation_status remains PENDING_LIQUIDATION; cash not yet credited"

      - from: PLEDGED
        to: DECLINED
        trigger: "POST /contributions/{contributionId}/decline"
        actor: GiftOfficer
        preconditions: []
        side_effects:
          - "decline_reason recorded from payload"

      - from: "ACCEPTED + PENDING_LIQUIDATION (liquidation dimension)"
        to: "ACCEPTED + LIQUIDATED"
        trigger: "POST /contributions/{contributionId}/liquidate"
        actor: GiftOfficer
        preconditions:
          - "Every AssetLot of this contribution has gross_proceeds recorded in the liquidate payload (ERR_LOT_PROCEEDS_MISSING)"
        side_effects:
          - "net_proceeds computed by liquidation waterfall (calc liquidation_net_proceeds)"
          - "fund.cash_balance += net_proceeds"
          - "fund.last_activity_at refreshed"
          - "If Fund.status == INACTIVE, auto-transition to ACTIVE"

  - entity: Grantee
    initial_state: UNVETTED
    terminal_states: []
    transitions:
      - from: UNVETTED
        to: IN_REVIEW
        trigger: "POST /grantees/{granteeId}/begin-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /grantees/{granteeId}/clear"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "cleared_at set to current logical clock"

      - from: IN_REVIEW
        to: REJECTED_DD
        trigger: "POST /grantees/{granteeId}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: CLEARED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc advancing current time >= cleared_at + 12 months)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXPIRED
        to: IN_REVIEW
        trigger: "POST /grantees/{granteeId}/begin-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: REJECTED_DD
        to: IN_REVIEW
        trigger: "POST /grantees/{granteeId}/begin-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: GrantRecommendation
    initial_state: DRAFT
    terminal_states: [DISBURSED, DENIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /grants/{grantId}/submit"
        actor: Advisor | FoundationAdmin
        preconditions:
          - "Fund.status == ACTIVE (ERR_FUND_NOT_ACTIVE_FOR_GRANTS)"
          - "For DONOR_ADVISED funds: recommended_by_advisor_id references an ACTIVE advisor on the fund and acting X-User-ID equals it (ERR_ADVISOR_NOT_AUTHORIZED); for DESIGNATED/SCHOLARSHIP funds the actor is FoundationAdmin and recommended_by_advisor_id is null"
          - "amount >= 250.00 (ERR_GRANT_BELOW_MINIMUM)"
          - "revision_count < 3 (ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "submitted_at set"

      - from: SUBMITTED
        to: COMPLIANCE_REVIEW
        trigger: "POST /grants/{grantId}/claim-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: COMPLIANCE_REVIEW
        to: APPROVED
        trigger: "POST /grants/{grantId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Approving ComplianceOfficer X-User-ID != X-User-ID that executed claim-review on this grant (segregation of duties, ERR_SOD_SELF_APPROVAL)"
          - "Grantee.due_diligence_status == CLEARED (ERR_GRANTEE_NOT_CLEARED)"
          - "If grantee.expenditure_responsibility_required == true, payload include_er_acknowledgement == true (ERR_ER_ACK_REQUIRED)"
          - "amount <= fund.spendable_balance at decision instant (ERR_EXCEEDS_SPENDABLE)"
        side_effects:
          - "decided_at set"

      - from: COMPLIANCE_REVIEW
        to: RETURNED
        trigger: "POST /grants/{grantId}/return"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "revision_count += 1"
          - "If revision_count reaches 3 on this transition, grant auto-transitions RETURNED -> DENIED immediately (cascade; decided_at set)"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /grants/{grantId}/submit"
        actor: Advisor | FoundationAdmin
        preconditions:
          - "Same preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "submitted_at refreshed"

      - from: COMPLIANCE_REVIEW
        to: DENIED
        trigger: "POST /grants/{grantId}/deny"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "decided_at set"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /grants/{grantId}/disburse"
        actor: FinanceOfficer
        preconditions:
          - "Disbursing FinanceOfficer X-User-ID != approving ComplianceOfficer X-User-ID recorded on grant (segregation of duties, ERR_SOD_SELF_DISBURSE)"
          - "amount <= fund.cash_balance (ERR_INSUFFICIENT_CASH)"
        side_effects:
          - "fund.cash_balance -= amount"
          - "fund.allowance_used += amount (endowed funds only)"
          - "fund.last_activity_at refreshed; INACTIVE fund auto-ACTIVE"
          - "Disbursement row created (source_kind=GRANT, grant_id, fund_id denormalized, amount copied)"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /grants/{grantId}/cancel"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: ScholarshipProgram
    initial_state: SETUP
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /programs/{programId}/open"
        actor: ProgramOfficer
        preconditions:
          - "committee_size >= 3 (ERR_COMMITTEE_TOO_SMALL)"
          - "application_close > application_open"
          - "Current logical clock < application_close (ERR_WINDOW_CLOSED)"
        side_effects: []

      - from: OPEN
        to: SCORING
        trigger: "POST /programs/{programId}/close-applications"
        actor: ProgramOfficer
        preconditions:
          - "Current logical clock >= application_close (ERR_WINDOW_STILL_OPEN)"
          - "At least 1 ScholarshipApplication exists for the program (ERR_NO_APPLICATIONS)"
        side_effects:
          - "All SUBMITTED applications -> UNDER_SCORING (cascade)"

      - from: SCORING
        to: AWARDED
        trigger: "POST /programs/{programId}/select-winners"
        actor: ProgramOfficer
        preconditions:
          - "Count of applications with final_score != null >= 1 (quorum met on at least one application) (ERR_QUORUM_NOT_MET)"
          - "Payload winner_application_ids length <= max_awards (ERR_TOO_MANY_WINNERS)"
          - "Every winner application has final_score != null (ERR_UNSCORED_WINNER)"
        side_effects:
          - "Each winner application -> SELECTED; all other UNDER_SCORING applications -> NOT_SELECTED"
          - "ScholarshipAward created per winner (status OFFERED, amount copied from program.award_amount, fund_id/program_id denormalized)"
          - "Fund-level check: program.max_awards * award_amount <= fund.cash_balance else transition rejected (ERR_INSUFFICIENT_CASH)"

      - from: AWARDED
        to: CLOSED
        trigger: "POST /programs/{programId}/close"
        actor: ProgramOfficer
        preconditions:
          - "No ScholarshipAward in {OFFERED, ACCEPTED} for the program (ERR_AWARDS_PENDING)"
        side_effects: []

      - from: SETUP
        to: CANCELLED
        trigger: "POST /programs/{programId}/cancel"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []

  - entity: ScholarshipApplication
    initial_state: SUBMITTED
    terminal_states: [NOT_SELECTED, ACCEPTED_AWARD, DECLINED_AWARD]
    transitions:
      - from: SUBMITTED
        to: UNDER_SCORING
        trigger: "system (program OPEN -> SCORING cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_SCORING
        to: SELECTED
        trigger: "system (select-winners cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_SCORING
        to: NOT_SELECTED
        trigger: "system (select-winners cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SELECTED
        to: ACCEPTED_AWARD
        trigger: "POST /awards/{awardId}/accept (cascades to application)"
        actor: Applicant
        preconditions: []
        side_effects: []

      - from: SELECTED
        to: DECLINED_AWARD
        trigger: "POST /awards/{awardId}/decline (cascades to application)"
        actor: Applicant
        preconditions: []
        side_effects: []

  - entity: ScholarshipAward
    initial_state: OFFERED
    terminal_states: [DISBURSED, DECLINED, FORFEITED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /awards/{awardId}/accept"
        actor: Applicant
        preconditions:
          - "Acting Applicant X-User-ID == application's applicant contact id (ERR_NOT_THE_APPLICANT)"
        side_effects:
          - "Application -> ACCEPTED_AWARD"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /awards/{awardId}/decline"
        actor: Applicant
        preconditions:
          - "Acting Applicant X-User-ID == application's applicant contact id (ERR_NOT_THE_APPLICANT)"
        side_effects:
          - "Application -> DECLINED_AWARD"
          - "Program: if all awards for the program are now terminal, program remains AWARDED until closed (no auto-close)"

      - from: ACCEPTED
        to: DISBURSED
        trigger: "POST /awards/{awardId}/disburse"
        actor: FinanceOfficer
        preconditions:
          - "amount <= fund.cash_balance (ERR_INSUFFICIENT_CASH)"
          - "Fund.status == ACTIVE (ERR_FUND_NOT_ACTIVE_FOR_GRANTS)"
        side_effects:
          - "fund.cash_balance -= amount"
          - "fund.allowance_used += amount (endowed funds only)"
          - "fund.last_activity_at refreshed"
          - "Disbursement row created (source_kind=SCHOLARSHIP_AWARD)"

      - from: ACCEPTED
        to: FORFEITED
        trigger: "POST /awards/{awardId}/forfeit"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []

  - entity: AnnualStatement
    initial_state: GENERATED
    terminal_states: [DELIVERED]
    transitions:
      - from: GENERATED
        to: DELIVERED
        trigger: "POST /statements/{statementId}/deliver"
        actor: FoundationAdmin
        preconditions: []
        side_effects: []

  - entity: InvestmentPool
    initial_state: OPEN
    terminal_states: [TERMINATED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /pools/{poolId}/suspend"
        actor: InvestmentManager
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: OPEN
        trigger: "POST /pools/{poolId}/reopen"
        actor: InvestmentManager
        preconditions: []
        side_effects: []

      - from: OPEN
        to: TERMINATED
        trigger: "POST /pools/{poolId}/terminate"
        actor: InvestmentManager
        preconditions:
          - "units_outstanding == 0.0000 (ERR_POOL_NOT_EMPTY)"
        side_effects: []

  - entity: CommitteeMember
    initial_state: SEATED
    terminal_states: [RECUSED, REMOVED]
    transitions:
      - from: SEATED
        to: RECUSED
        trigger: "POST /committee-members/{memberId}/recuse"
        actor: CommitteeMember
        preconditions:
          - "Acting member X-User-ID == this member's id (ERR_NOT_THE_MEMBER)"
        side_effects:
          - "Program.committee_size decremented and quorum_threshold recomputed"
          - "Member's existing ScoreEntries remain valid"

      - from: SEATED
        to: REMOVED
        trigger: "POST /committee-members/{memberId}/remove"
        actor: ProgramOfficer
        preconditions:
          - "Program.status in {SETUP, OPEN} (ERR_PROGRAM_LOCKED)"
        side_effects:
          - "Program.committee_size decremented and quorum_threshold recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: grant-submit-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /grants"
    occ_field: "expected_fund_version"
    description: |
      Creating a GrantRecommendation against a Fund whose version has advanced
      since the client last observed it is rejected, because spendable_balance
      may have moved with that version. The OCC check on Fund.version captures
      the case where a fee assessment or another disbursement landed between the
      client's read and its create.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

  - rule_id: buyin-stale-pool
    parent_entity: InvestmentPool
    write_endpoint: "POST /pools/{poolId}/unitization-events"
    occ_field: "expected_pool_version"
    description: |
      Recording a BUY_IN or REDEMPTION UnitizationEvent against an InvestmentPool
      whose version has advanced since the client last observed it is rejected,
      because unit_price is a function of nav and units_outstanding that the
      prior mutation may have changed. MARK_TO_MARKET events are exempt from the
      OCC requirement (they reprice rather than transact at a stale price).
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

  - rule_id: agreement-amend-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /funds/{fundId}/agreements"
    occ_field: "expected_fund_version"
    description: |
      Creating an amending FundAgreement for a Fund whose version has advanced
      since the client last observed it is rejected. The new agreement will
      supersede the currently EXECUTED one, so the client must have seen the
      latest fund state before its amendment is accepted.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: unit_price_and_units
    trigger: "BUY_IN or REDEMPTION UnitizationEvent; MARK_TO_MARKET reprices unit_price"
    algorithm: tiered_pricing
    formula: |
      unit_price = round4(nav / units_outstanding)   # 4dp round_half_up
      BUY_IN:      units_minted = round4(cash_amount / unit_price)
                   units_outstanding += units_minted
                   nav += cash_amount
      REDEMPTION:  cash_out = round2(units_amount * unit_price)
                   units_outstanding -= units_amount
                   nav -= cash_out
      MARK_TO_MARKET: nav = new_nav (units_outstanding unchanged; unit_price recomputed)
    input_set: "The single InvestmentPool the event targets; pool must be status OPEN"
    constants:
      UNIT_DP: 4
      CASH_DP: 2
    precision: "units 4 decimal places, cash 2 decimal places, round_half_up"
    variants:
      - name: buy_in
        when: "event_kind == BUY_IN"
        difference: "mints units at current price; requires fund cash_balance >= cash_amount"
      - name: redemption
        when: "event_kind == REDEMPTION"
        difference: "burns units at current price; credits fund cash_balance"

  - name: spending_allowance
    trigger: "POST /funds/{fundId}/spending-policy-runs (annual run)"
    algorithm: aggregation
    formula: |
      if formula == AVERAGE_12Q:
        window = 12 most recent QUARTER_END MarketValueSnapshots for the fund
                 with effective_date <= run date, ordered effective_date DESC
        require len(window) == 12 else ERR_INSUFFICIENT_HISTORY
        base_value = round2(sum(market_value of window) / 12)
      if formula == FIXED_3YR:
        window = 3 most recent FISCAL_YEAR_END snapshots, same ordering
        require len(window) == 3 else ERR_INSUFFICIENT_HISTORY
        base_value = round2(sum / 3)
      allowance_granted = round2(base_value * spending_rate_pct / 100)
      Rounding order is pinned: average first (round 2), then rate multiply (round 2).
    input_set: "MarketValueSnapshot rows for the fund, snapshot_kind matched to formula, effective_date <= run date; ties on effective_date broken by created_at ASC"
    constants:
      QUARTERS_REQUIRED: 12
      YEARS_REQUIRED: 3
    precision: "2 decimal places, round_half_up; average-rounded-then-multiplied order is normative"
    variants:
      - name: average_12q
        when: "agreement.spending_formula == AVERAGE_12Q"
        difference: "uses 12 quarter-end snapshots; smoother base"
      - name: fixed_3yr
        when: "agreement.spending_formula == FIXED_3YR"
        difference: "uses 3 fiscal-year-end snapshots; same fund/rate/date yields a different allowance than average_12q"

  - name: admin_fee
    trigger: "POST /funds/{fundId}/fee-assessments (quarterly)"
    algorithm: tiered_pricing
    formula: |
      STANDARD schedule (marginal tiers on quarter_end_balance):
        t1 = min(balance, 250000.00) * 0.0100
        t2 = max(0, min(balance - 250000.00, 750000.00)) * 0.0060
        t3 = max(0, balance - 1000000.00) * 0.0030
        annual_fee = round2(t1 + t2 + t3)
      FLAT schedule:
        annual_fee = round2(balance * 0.0075)
      quarterly_fee = round2(annual_fee / 4)
      Rounding order is pinned: annual fee rounded to 2dp first, then divided
      by 4 and rounded to 2dp. Dividing first then rounding yields different
      cents and is non-conformant.
    input_set: "Caller-supplied quarter_end_balance (the fund's total_market_value at quarter end); schedule from the fund's EXECUTED agreement"
    constants:
      TIER1_CAP: 250000.00
      TIER1_RATE: 0.0100
      TIER2_CAP: 750000.00
      TIER2_RATE: 0.0060
      TIER3_RATE: 0.0030
      FLAT_RATE: 0.0075
    precision: "2 decimal places, round_half_up; annual-rounded-then-divided order is normative"
    variants:
      - name: standard_tiered
        when: "agreement.fee_tier_schedule == STANDARD"
        difference: "marginal three-tier computation"
      - name: flat
        when: "agreement.fee_tier_schedule == FLAT"
        difference: "single flat rate on the whole balance"

  - name: liquidation_net_proceeds
    trigger: "POST /contributions/{contributionId}/liquidate"
    algorithm: waterfall_allocation
    formula: |
      Per AssetLot in order of lot.created_at ASC (tie-break: appraised_value DESC):
        lot_fee = round2(gross_proceeds * liquidation_fee_pct / 100)
        lot_net = gross_proceeds - lot_fee - BROKERAGE_FLAT_PER_LOT
        if lot_net < 0: lot_net = 0   (floor; fee never exceeds proceeds at lot level)
      contribution.net_proceeds = round2(sum(lot_net over all lots))
      Rounding order is pinned: per-lot fee rounded to 2dp first, then netted,
      then the per-lot nets summed. Sum-gross-then-fee is non-conformant.
    input_set: "All AssetLot rows of the contribution; each must have gross_proceeds recorded"
    constants:
      BROKERAGE_FLAT_PER_LOT: 75.00
    precision: "2 decimal places, round_half_up; per-lot-then-sum order is normative"

  - name: weighted_application_score
    trigger: "POST /applications/{applicationId}/scores"
    algorithm: weighted_scoring
    formula: |
      weighted_score = round2(0.40*academic + 0.30*financial_need + 0.20*essay + 0.10*interview)
    input_set: "Single ScoreEntry payload; each component integer 0-100"
    constants:
      W_ACADEMIC: 0.40
      W_NEED: 0.30
      W_ESSAY: 0.20
      W_INTERVIEW: 0.10
    precision: "2 decimal places, round_half_up"

  - name: application_final_score
    trigger: "system after each ScoreEntry insert for an application"
    algorithm: aggregation
    formula: |
      submitted = ScoreEntries for the application whose member.status == SEATED
                  at the time of scoring
      if count(submitted) >= program.quorum_threshold:
        final_score = round2(mean(weighted_score of submitted))
      else:
        final_score remains null
    input_set: "ScoreEntry rows for the application; duplicate (application_id, member_id) rejected"
    precision: "2 decimal places, round_half_up"

  - name: inactivity_months
    trigger: "read of Fund; also evaluated on POST /_clock/set_current_utc for auto-transitions"
    algorithm: decay_function
    formula: |
      months = full calendar months between fund.last_activity_at and current
      logical clock, computed as (year diff * 12 + month diff) minus 1 if the
      day-of-month of the clock is earlier than the day-of-month of
      last_activity_at. Qualifying activity (contribution acceptance, grant or
      award disbursement) resets the baseline by refreshing last_activity_at.
    input_set: "Fund.last_activity_at; logical clock"
    precision: "integer months"

  - name: statement_roll_forward
    trigger: "POST /funds/{fundId}/annual-statements"
    algorithm: projection
    formula: |
      opening_value = total_market_value at fiscal year open (from snapshots if
                      present, else carried closing of prior statement, else 0)
      contributions_total = round2(sum(net_proceeds) over contributions of the
                            fund with acceptance_status=ACCEPTED,
                            liquidation_status=LIQUIDATED, gift_date in FY)
      grants_total = round2(sum(amount) over Disbursement rows of the fund
                     created in FY)
      fees_total = round2(sum(quarterly_fee) over FeeAssessment rows of the
                   fund with quarter_end_date in FY)
      investment_gain_loss = round2(sum over MARK_TO_MARKET UnitizationEvents
                             in FY of (fund's units_held at event * (new price - old price)))
      closing_value = round2(opening + contributions - grants - fees + gain_loss)
    input_set: "Fund's contributions, disbursements, fee assessments, pool events bounded to the fiscal year window [FY-01-01, FY-12-31] inclusive"
    precision: "2 decimal places, round_half_up"

  - name: spendable_balance
    trigger: "read of Fund; enforced at grant approve/disburse"
    algorithm: constraint_propagation
    formula: |
      if fund.endowed:
        remaining_allowance = max(0, current_spending_allowance - allowance_used)
        spendable_balance = round2(min(cash_balance, remaining_allowance))
      else:
        spendable_balance = cash_balance
    input_set: "Fund's cash_balance, current_spending_allowance, allowance_used"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (fund before contribution before lot; pool before event; program before application before score)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Request-body FK references exist (fund_id, grantee_id, advisor id, member_id, application_id, winner_application_ids)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: all creation endpoints

  - priority: 5
    category: state
    check: "Target resource in a legal state for the transition (state machine precondition; covers ERR_FUND_NOT_ACTIVE_FOR_GRANTS, ERR_GRANTEE_NOT_CLEARED is business but state-like ordering below, ERR_PROGRAM_LOCKED, ERR_POOL_NOT_OPEN)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "OCC expected version matches current parent version where required (grants create vs Fund, unitization BUY_IN/REDEMPTION vs Pool, agreement amend vs Fund)"
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
    applies_to: "POST /grants; POST /funds/{fundId}/agreements; POST /pools/{poolId}/unitization-events"
    note: "pool variant returns ERR_STALE_POOL_VERSION"

  - priority: 7
    category: business_temporal
    check: "Time-window rules: program application window (open <= clock < close for new applications; clock >= close to move to SCORING); grantee clearance freshness (CLEARED within 12 months); contribution gift_date not in future"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /programs/{id}/applications; POST /programs/{id}/close-applications; POST /grantees/*; POST /contributions/{id}/accept"

  - priority: 8
    category: business_referential
    check: "Cross-entity reference coherence: advisor belongs to fund; successor on agreement serves same fund; application belongs to program; score member seated on application's program; winner applications belong to this program"
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "grant submit, agreement execute, score create, select-winners"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: grant approver != reviewer who claimed; grant disburser != approver; advisor acts only as self; applicant acts only as self; committee member recuses only self"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "grant approve/disburse; advisor accept/resign; award accept/decline; member recuse"

  - priority: 10
    category: business_safety
    check: "Compliance gates: grantee CLEARED and not expired; expenditure-responsibility acknowledgement when required; revision_count < 3 for resubmission"
    error_id: ERR_COMPLIANCE_GATE
    http_status: 422
    applies_to: "POST /grants/{id}/approve; POST /grants/{id}/submit"

  - priority: 11
    category: business_constraint
    check: "Uniqueness and structural constraints: fund_name unique; grantee tax_id unique; advisor email unique; applicant email unique per program; (fund_id, fiscal_year) unique for statements; (application_id, member_id) unique for scores; self-reference forbidden (successor != primary advisor row)"
    error_id: ERR_UNIQUENESS_VIOLATION
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 12
    category: business_constraint
    check: "Field domain constraints: amount >= 250.00 grants; award_amount >= 500.00; contribution declared_value > 0; score components in [0,100]; max_awards >= 1; spending_rate_pct in [0,20]; tax_id 9 digits"
    error_id: ERR_FIELD_CONSTRAINT
    http_status: 422
    applies_to: "creation and update endpoints"

  - priority: 13
    category: business_fiscal
    check: "Capacity gates: grant amount <= spendable_balance at approve; amount <= cash_balance at disburse; buy-in cash <= fund cash_balance; redemption units <= fund units_held in pool; initial contribution >= min_initial_contribution at fund activation; winner count * award <= cash at select-winners"
    error_id: ERR_FISCAL_CAPACITY
    http_status: 422
    applies_to: "grant approve/disburse; unitization events; fund activate; select-winners; fee assessment (cash may go no lower than 0 — fee debit rejected if it would drive cash_balance negative)"

  - priority: 14
    category: business_fiscal
    check: "History sufficiency for spending policy run: 12 quarter-end or 3 fiscal-year-end snapshots present"
    error_id: ERR_INSUFFICIENT_HISTORY
    http_status: 422
    applies_to: "POST /funds/{fundId}/spending-policy-runs"

  - priority: 15
    category: business_constraint
    check: "ScoreEntry uniqueness on (application_id, member_id): a second score by the same member on the same application is rejected"
    error_id: ERR_DUPLICATE_SCORE
    http_status: 409
    applies_to: "POST /applications/{applicationId}/scores"

  - priority: 16
    category: business_constraint
    check: "Grant resubmission allowed only while revision_count < 3 (grant auto-DENIED at the third return; submit from a DENIED grant is also blocked by the state machine)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /grants/{grantId}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock evaluates time-based auto-transitions (fund INACTIVE/DORMANT, grantee CLEARED->EXPIRED)."
    roles: [FoundationAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["time-based auto-transitions evaluated foundation-wide"]

  # --- Fund ---
  - method: POST
    path: "/funds"
    description: "Establish a fund"
    roles: [FoundationAdmin]
    code: 201
    input: [fund_name, fund_type, endowed]
    output: Fund
    side_effects: ["status PENDING_AGREEMENT; cash_balance 0; invested_units 0"]

  - method: GET
    path: "/funds"
    description: "List funds with optional filters"
    roles: [FoundationAdmin, GiftOfficer, ComplianceOfficer, FinanceOfficer, ProgramOfficer, InvestmentManager, Advisor, Applicant, CommitteeMember]
    code: 200
    input: ["fund_type?", "status?", "limit?", "offset?"]
    output: "Fund[]"
    side_effects: []

  - method: GET
    path: "/funds/{fundId}"
    description: "Get fund detail (computed fields refreshed)"
    roles: [FoundationAdmin, GiftOfficer, ComplianceOfficer, FinanceOfficer, ProgramOfficer, InvestmentManager, Advisor, Applicant, CommitteeMember]
    code: 200
    input: []
    output: Fund
    side_effects: []

  - method: POST
    path: "/funds/{fundId}/activate"
    description: "Activate fund once agreement executed and minimum initial contribution accepted"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Fund
    side_effects: ["status -> ACTIVE; inception_date, last_activity_at set; increments Fund.version"]

  - method: POST
    path: "/funds/{fundId}/close"
    description: "Close an emptied fund"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Fund
    side_effects: ["status -> CLOSED; increments Fund.version"]

  # --- FundAgreement ---
  - method: POST
    path: "/funds/{fundId}/agreements"
    description: "Create agreement (first or amendment). Amendment carries OCC on Fund."
    roles: [FoundationAdmin]
    code: 201
    input: [spending_rate_pct, spending_formula, fee_tier_schedule, "successor_advisor_id?", "inactivity_trigger_months?", "dormancy_trigger_months?", "min_initial_contribution?", "expected_fund_version?"]
    output: FundAgreement
    side_effects: ["agreement_version_no assigned; status DRAFT; expected_fund_version required only when an EXECUTED agreement already exists (amendment)"]

  - method: GET
    path: "/funds/{fundId}/agreements"
    description: "List agreements for a fund"
    roles: [FoundationAdmin, ComplianceOfficer, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FundAgreement[]"
    side_effects: []

  - method: GET
    path: "/agreements/{agreementId}"
    description: "Get an agreement"
    roles: [FoundationAdmin, ComplianceOfficer, FinanceOfficer]
    code: 200
    input: []
    output: FundAgreement
    side_effects: []

  - method: POST
    path: "/agreements/{agreementId}/execute"
    description: "Execute a DRAFT agreement"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: FundAgreement
    side_effects: ["status -> EXECUTED; executed_at set; any prior EXECUTED agreement for the fund -> SUPERSEDED; increments Fund.version"]

  - method: POST
    path: "/agreements/{agreementId}/terminate"
    description: "Terminate an EXECUTED agreement (fund must be CLOSED)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: FundAgreement
    side_effects: ["status -> TERMINATED"]

  # --- FundAdvisor ---
  - method: POST
    path: "/funds/{fundId}/advisors"
    description: "Invite an advisor to a fund"
    roles: [FoundationAdmin]
    code: 201
    input: [advisor_name, email, advisor_kind]
    output: FundAdvisor
    side_effects: ["status INVITED"]

  - method: GET
    path: "/funds/{fundId}/advisors"
    description: "List advisors for a fund"
    roles: [FoundationAdmin, ComplianceOfficer, Advisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "FundAdvisor[]"
    side_effects: []

  - method: GET
    path: "/advisors/{advisorId}"
    description: "Get advisor"
    roles: [FoundationAdmin, ComplianceOfficer, Advisor]
    code: 200
    input: []
    output: FundAdvisor
    side_effects: []

  - method: POST
    path: "/advisors/{advisorId}/accept"
    description: "Advisor accepts invitation (self only)"
    roles: [Advisor]
    code: 200
    input: []
    output: FundAdvisor
    side_effects: ["status -> ACTIVE; activated_at set"]

  - method: POST
    path: "/advisors/{advisorId}/resign"
    description: "Advisor resigns (self only)"
    roles: [Advisor]
    code: 200
    input: []
    output: FundAdvisor
    side_effects: ["status -> RESIGNED"]

  - method: POST
    path: "/advisors/{advisorId}/revoke"
    description: "Revoke an invitation"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: FundAdvisor
    side_effects: ["status -> REVOKED; nulls successor_advisor_id on DRAFT agreements naming this advisor"]

  - method: POST
    path: "/advisors/{advisorId}/record-deceased"
    description: "Record advisor deceased; triggers succession cascade"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: FundAdvisor
    side_effects: ["status -> DECEASED; named successor INVITED -> ACTIVE; succession refreshes fund.last_activity_at and reactivates an INACTIVE fund"]

  # --- Contribution & AssetLot ---
  - method: POST
    path: "/contributions"
    description: "Record a pledged contribution"
    roles: [GiftOfficer]
    code: 201
    input: [fund_id, donor_name, asset_kind, declared_value]
    output: Contribution
    side_effects: ["acceptance_status PLEDGED; liquidation_status NOT_REQUIRED for CASH else PENDING_LIQUIDATION"]

  - method: GET
    path: "/contributions"
    description: "List contributions, filterable by fund"
    roles: [FoundationAdmin, GiftOfficer, FinanceOfficer]
    code: 200
    input: ["fund_id?", "acceptance_status?", "limit?", "offset?"]
    output: "Contribution[]"
    side_effects: []

  - method: GET
    path: "/contributions/{contributionId}"
    description: "Get contribution"
    roles: [FoundationAdmin, GiftOfficer, FinanceOfficer]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: POST
    path: "/contributions/{contributionId}/lots"
    description: "Add an asset lot to a non-cash contribution"
    roles: [GiftOfficer]
    code: 201
    input: [description, quantity, appraised_value, "liquidation_fee_pct?"]
    output: AssetLot
    side_effects: []

  - method: GET
    path: "/contributions/{contributionId}/lots"
    description: "List lots of a contribution"
    roles: [FoundationAdmin, GiftOfficer, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AssetLot[]"
    side_effects: []

  - method: POST
    path: "/contributions/{contributionId}/accept"
    description: "Accept a pledge"
    roles: [GiftOfficer]
    code: 200
    input: []
    output: Contribution
    side_effects: ["acceptance_status -> ACCEPTED; gift_date set; CASH: net_proceeds=declared_value and cash credited; increments Fund.version"]

  - method: POST
    path: "/contributions/{contributionId}/decline"
    description: "Decline a pledge"
    roles: [GiftOfficer]
    code: 200
    input: [decline_reason]
    output: Contribution
    side_effects: ["acceptance_status -> DECLINED"]

  - method: POST
    path: "/contributions/{contributionId}/liquidate"
    description: "Record liquidation of all lots; computes net_proceeds and credits cash"
    roles: [GiftOfficer]
    code: 200
    input: [lot_proceeds]
    output: Contribution
    side_effects: ["liquidation_status -> LIQUIDATED; net_proceeds computed per waterfall; fund.cash_balance credited; fund.last_activity_at refreshed; increments Fund.version"]

  # --- InvestmentPool / Unitization ---
  - method: POST
    path: "/pools"
    description: "Create an investment pool"
    roles: [InvestmentManager]
    code: 201
    input: [pool_name, pool_kind, initial_nav, initial_units]
    output: InvestmentPool
    side_effects: ["status OPEN; nav/units_outstanding seeded (initial_units > 0 required so unit_price defined)"]

  - method: GET
    path: "/pools"
    description: "List pools"
    roles: [FoundationAdmin, InvestmentManager, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "InvestmentPool[]"
    side_effects: []

  - method: GET
    path: "/pools/{poolId}"
    description: "Get pool"
    roles: [FoundationAdmin, InvestmentManager, FinanceOfficer]
    code: 200
    input: []
    output: InvestmentPool
    side_effects: []

  - method: POST
    path: "/pools/{poolId}/suspend"
    description: "Suspend a pool (blocks BUY_IN/REDEMPTION)"
    roles: [InvestmentManager]
    code: 200
    input: []
    output: InvestmentPool
    side_effects: ["status -> SUSPENDED; increments InvestmentPool.version"]

  - method: POST
    path: "/pools/{poolId}/reopen"
    description: "Reopen a suspended pool"
    roles: [InvestmentManager]
    code: 200
    input: []
    output: InvestmentPool
    side_effects: ["status -> OPEN; increments InvestmentPool.version"]

  - method: POST
    path: "/pools/{poolId}/terminate"
    description: "Terminate an empty pool"
    roles: [InvestmentManager]
    code: 200
    input: []
    output: InvestmentPool
    side_effects: ["status -> TERMINATED"]

  - method: POST
    path: "/pools/{poolId}/unitization-events"
    description: "Record BUY_IN / REDEMPTION / MARK_TO_MARKET. BUY_IN/REDEMPTION require expected_pool_version (OCC)."
    roles: [InvestmentManager, FinanceOfficer]
    code: 201
    input: [event_kind, "fund_id?", "cash_amount?", "units_amount?", "new_nav?", "expected_pool_version?"]
    output: UnitizationEvent
    side_effects: ["unit_price_applied snapshot; units_delta computed; pool nav/units_outstanding updated; PoolHolding upserted for BUY_IN/REDEMPTION; fund.cash_balance debited (BUY_IN) or credited (REDEMPTION); fund.invested_units and invested_market_value recomputed; increments InvestmentPool.version and Fund.version"]

  - method: GET
    path: "/pools/{poolId}/unitization-events"
    description: "List events of a pool"
    roles: [FoundationAdmin, InvestmentManager, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "UnitizationEvent[]"
    side_effects: []

  - method: GET
    path: "/funds/{fundId}/pool-holdings"
    description: "List a fund's pool holdings"
    roles: [FoundationAdmin, InvestmentManager, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PoolHolding[]"
    side_effects: []

  # --- Grantee ---
  - method: POST
    path: "/grantees"
    description: "Register a grantee organization"
    roles: [ComplianceOfficer]
    code: 201
    input: [legal_name, tax_id, irs_subsection]
    output: Grantee
    side_effects: ["due_diligence_status UNVETTED; expenditure_responsibility_required computed"]

  - method: GET
    path: "/grantees"
    description: "List grantees"
    roles: [FoundationAdmin, ComplianceOfficer, Advisor]
    code: 200
    input: ["due_diligence_status?", "limit?", "offset?"]
    output: "Grantee[]"
    side_effects: []

  - method: GET
    path: "/grantees/{granteeId}"
    description: "Get grantee"
    roles: [FoundationAdmin, ComplianceOfficer, Advisor]
    code: 200
    input: []
    output: Grantee
    side_effects: []

  - method: POST
    path: "/grantees/{granteeId}/begin-review"
    description: "Move grantee to IN_REVIEW"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Grantee
    side_effects: ["status -> IN_REVIEW"]

  - method: POST
    path: "/grantees/{granteeId}/clear"
    description: "Clear grantee (sets 12-month freshness window)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Grantee
    side_effects: ["status -> CLEARED; cleared_at set"]

  - method: POST
    path: "/grantees/{granteeId}/reject"
    description: "Reject grantee in due diligence"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Grantee
    side_effects: ["status -> REJECTED_DD"]

  # --- GrantRecommendation ---
  - method: POST
    path: "/grants"
    description: "Create a grant recommendation (OCC on Fund via expected_fund_version)"
    roles: [Advisor, FoundationAdmin]
    code: 201
    input: [fund_id, grantee_id, amount, purpose, "recommended_by_advisor_id?", expected_fund_version]
    output: GrantRecommendation
    side_effects: ["status DRAFT; revision_count 0; increments Fund.version"]

  - method: GET
    path: "/grants"
    description: "List grants, filterable"
    roles: [FoundationAdmin, ComplianceOfficer, FinanceOfficer, Advisor]
    code: 200
    input: ["fund_id?", "grantee_id?", "recommended_by_advisor_id?", "status?", "limit?", "offset?"]
    output: "GrantRecommendation[]"
    side_effects: []

  - method: GET
    path: "/grants/{grantId}"
    description: "Get grant"
    roles: [FoundationAdmin, ComplianceOfficer, FinanceOfficer, Advisor]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: []

  - method: POST
    path: "/grants/{grantId}/submit"
    description: "Submit from DRAFT or RETURNED. Advisor submits DONOR_ADVISED grants (identity-checked); FoundationAdmin submits staff-initiated grants on DESIGNATED/SCHOLARSHIP funds."
    roles: [Advisor, FoundationAdmin]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> SUBMITTED; submitted_at set"]

  - method: POST
    path: "/grants/{grantId}/claim-review"
    description: "Compliance claims the grant for review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> COMPLIANCE_REVIEW; records claiming officer id on grant"]

  - method: POST
    path: "/grants/{grantId}/approve"
    description: "Approve grant (approver != claimer; SoD)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["include_er_acknowledgement?"]
    output: GrantRecommendation
    side_effects: ["status -> APPROVED; decided_at set; records approving officer id"]

  - method: POST
    path: "/grants/{grantId}/return"
    description: "Return grant for revision; 3rd return auto-denies"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> RETURNED; revision_count += 1; auto-DENIED at revision_count == 3"]

  - method: POST
    path: "/grants/{grantId}/deny"
    description: "Deny grant"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> DENIED; decided_at set"]

  - method: POST
    path: "/grants/{grantId}/cancel"
    description: "Cancel an approved grant"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> CANCELLED"]

  - method: POST
    path: "/grants/{grantId}/disburse"
    description: "Disburse an approved grant (disburser != approver; SoD)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: GrantRecommendation
    side_effects: ["status -> DISBURSED; fund.cash_balance debited; allowance_used += amount (endowed); Disbursement row created; fund.last_activity_at refreshed; increments Fund.version"]

  # --- Spending policy / fees / snapshots / statements ---
  - method: POST
    path: "/funds/{fundId}/market-value-snapshots"
    description: "Record a quarter-end or fiscal-year-end market value"
    roles: [FinanceOfficer]
    code: 201
    input: [snapshot_kind, effective_date, market_value]
    output: MarketValueSnapshot
    side_effects: []

  - method: GET
    path: "/funds/{fundId}/market-value-snapshots"
    description: "List snapshots for a fund"
    roles: [FoundationAdmin, FinanceOfficer]
    code: 200
    input: ["snapshot_kind?", "limit?", "offset?"]
    output: "MarketValueSnapshot[]"
    side_effects: []

  - method: POST
    path: "/funds/{fundId}/spending-policy-runs"
    description: "Run annual spending policy for a fiscal year"
    roles: [FinanceOfficer]
    code: 201
    input: [fiscal_year]
    output: SpendingPolicyRun
    side_effects: ["base_value and allowance_granted computed per agreement formula; fund.current_spending_allowance set; fund.allowance_used reset to 0; increments Fund.version"]

  - method: GET
    path: "/funds/{fundId}/spending-policy-runs"
    description: "List spending policy runs"
    roles: [FoundationAdmin, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "SpendingPolicyRun[]"
