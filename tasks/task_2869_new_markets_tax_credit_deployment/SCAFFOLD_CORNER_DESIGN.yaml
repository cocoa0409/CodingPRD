            - call: "GET /nmtc/allocation-awards/${award_one_id}"
              payload: {}
              as: CDESponsor
              as_user_id: "${cde_two_id}"
            - call: "POST /nmtc/allocation-awards/${award_one_id}/agency-reports"
              payload: { report_year: 2026 }
              as: CDESponsor
              as_user_id: "${cde_one_id}"
          assert:
            - "The foreign agency report returns HTTP 403 with error_id == \"ERR_NOT_RESOURCE_OWNER\" — the role is correct, the owner is not"
            - "TRANSITIVE — the foreign void of ${qei_one_id} also returns HTTP 403 ERR_NOT_RESOURCE_OWNER, resolved through QEI -> award -> cde, not through any field on the QEI itself"
