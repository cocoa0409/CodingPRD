  # ==========================================================================
  - section: consistency_model
    instances:

      - name: submit_response_already_carries_the_provisional_settlement_figures
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.expense_allocation_settlement
        distinguishing_aspect: "The provisional expense allocation is computed during the SUBMIT request and is present in that request's own response body — no follow-up read is required — and an immediately following GET returns byte-identical figures."
        test_recipe:
          setup:
            - "The logical clock is at 2026-04-01T00:00:00Z."
            - "One affiliate with a DRAFT agreement declaring housing 200000, meals 200000, travel 100000 and facility upkeep 80000 against a cap of 900000."
            - "Author-computed provisional lines in CATEGORY_ORDER: HOUSING round(200000*0.75) == 150000, MEALS round(200000*0.60) == 120000, TRAVEL round(100000*1.00) == 100000, FACILITY_UPKEEP round(80000*0.25) == 20000; per-category sub-caps at cap 900000 are 259615, 207692, 346154 and 86538, none of which binds, so provisional_club_obligation_cents == 390000 and affiliate_overflow_cents == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates"
              payload: { name: "Immediate Club", level: "HIGH_A", market_city: "Rome", meal_stipend_cents_per_day: 2800 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { im_aff: $.data.id }
            - call: "POST /affiliates/${im_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0, housing_expense_cents: 200000, meal_expense_cents: 200000, travel_expense_cents: 100000, upkeep_expense_cents: 80000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { im_agr: $.data.id, im_prov0: $.data.provisional_club_obligation_cents }
          trigger:
            - call: "POST /agreements/${im_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${im_aff}"
              captures: { im_status: $.data.status, im_prov: $.data.provisional_club_obligation_cents, im_over: $.data.affiliate_overflow_cents, im_v: $.data.version }
            - call: "GET /affiliates/${im_aff}/agreements"
              payload: { status: "SUBMITTED" }
              as: AffiliateOperator
              as_user_id: "${im_aff}"
              captures: { im_prov2: "$.data[0].provisional_club_obligation_cents", im_v2: "$.data[0].version" }
          assert:
            - "At create the agreement is DRAFT with provisional_club_obligation_cents == 0 — the calculation is bound to the SUBMIT transition, not to creation"
            - "The SUBMIT response itself returns status == SUBMITTED with provisional_club_obligation_cents == 390000 and affiliate_overflow_cents == 0"
            - "The immediately following list read returns the same 390000 and the same version, with no intervening delay or refresh"
            - "settlement_status is still NOT_SETTLED and final_club_obligation_cents is still 0 at this point"

      - name: approval_response_and_the_next_pool_read_agree_on_the_new_ledger
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.signing_pool_charge
        distinguishing_aspect: "A cross-entity write is read back from the other entity in the very next call: the signing APPROVE response carries pool_charge_cents and overage_tax_cents while the immediately following GET of the pool already shows allocated_cents, overage_tax_accrued_cents, a negative remaining_cents and status HARD_CAPPED."
        test_recipe:
          setup:
            - "The logical clock is at 2026-04-01T00:00:00Z."
            - "A DOMINICAN_ACADEMY affiliate with an ACTIVE agreement (minimum_active_players 0) and a SigningPool for 2026 with base_pool_cents 1000000."
            - "Author-computed for a single 1200000 bonus: effective_before == 1000000, prior_overage == 0, new_allocated == 1200000, total_overage == 200000; tier_tax(200000) == 0.75*200000 == 150000 and tier_tax(0) == 0, so overage_tax_cents == 150000, pool_charge_cents == 1200000, tier3_breach == false, remaining_cents == 1000000 - 1200000 == -200000 and status == HARD_CAPPED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates"
              payload: { name: "Immediate Academy", level: "DOMINICAN_ACADEMY", market_city: "Santiago", meal_stipend_cents_per_day: 2500 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { ia_acad: $.data.id }
            - call: "POST /affiliates/${ia_acad}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { ia_agr: $.data.id }
            - call: "POST /agreements/${ia_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${ia_acad}"
            - call: "POST /agreements/${ia_agr}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /signing-pools"
              payload: { season_year: 2026, base_pool_cents: 1000000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { ia_pool: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Immediate Signing", origin: "INTERNATIONAL_FA", signed_date: "2026-01-15" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ia_p: $.data.id }
            - call: "GET /signing-pools/${ia_pool}"
              payload: {}
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ia_pv: $.data.version }
            - call: "POST /international-signings"
              payload: { pool_id: "${ia_pool}", player_id: "${ia_p}", academy_affiliate_id: "${ia_acad}", bonus_cents: 1200000, expected_pool_version: "${ia_pv}" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ia_sign: $.data.id }
          trigger:
            - call: "POST /international-signings/${ia_sign}/disposition"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { ia_charge: $.data.pool_charge_cents, ia_tax: $.data.overage_tax_cents, ia_breach: $.data.tier3_breach, ia_status: $.data.status }
            - call: "GET /signing-pools/${ia_pool}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { ia_alloc: $.data.allocated_cents, ia_rem: $.data.remaining_cents, ia_pool_status: $.data.status, ia_accrued: $.data.overage_tax_accrued_cents }
            - call: "GET /international-signings/${ia_sign}"
              payload: {}
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ia_charge2: $.data.pool_charge_cents }
          assert:
            - "The APPROVE response itself carries status == APPROVED, pool_charge_cents == 1200000, overage_tax_cents == 150000 and tier3_breach == false"
            - "The immediately following pool read shows allocated_cents == 1200000, overage_tax_accrued_cents == 150000, effective_pool_cents == 1000000, remaining_cents == -200000 and status == HARD_CAPPED"
            - "forfeited_cents is still 0 because total_overage 200000 never crossed POOL_TIER_2_CEILING_CENTS"
            - "Re-reading the signing returns the identical pool_charge_cents — no value was recomputed differently on the read path"
