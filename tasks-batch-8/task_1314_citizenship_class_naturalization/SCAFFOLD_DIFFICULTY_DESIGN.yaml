  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_gated_by_screening_outcome_and_expiry
        grounds:
          - state_machines.Enrollment
          - calculations.screening_outcome
          - validations[priority=10]
        distinguishing_aspect: |
          Pair Enrollment -> Screening: enrollment creation is gated on the parent
          applicant's ACTIVE screening outcome (ELIGIBLE/ELIGIBLE_WITH_EXEMPTION) AND
          its 180-day expiry against the logical clock — NOT_ELIGIBLE yields
          ERR_SCREENING_NOT_ELIGIBLE; an ELIGIBLE screening 181 days old yields
          ERR_SCREENING_EXPIRED.
        test_recipe:
          setup:
            - "Section with open seats; applicant X with NOT_ELIGIBLE screening (residence 40 < 60); applicant Y with ELIGIBLE screening created at 2026-08-01, clock later advanced to 2027-01-29 (181 days)"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vol_id}/training-credits"
              payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vol_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/class-sections"
              payload: { title: "Open", weekday: "THU", start_minute: 600, end_minute: 660, room_id: "R5", instructor_volunteer_id: "${vol_id}", capacity: 4, total_sessions: 8 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v0: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Not Elig", email: "nx@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { x_id: $.data.id, x_v: $.data.version }
            - call: "POST /naturalization/applicants/${x_id}/screenings"
              payload: { expected_applicant_version: "${x_v}", marital_to_citizen: false, lpr_months: 50, continuous_residence_months: 40, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Soon Expired", email: "ey@x.com", date_of_birth: "1991-01-01" }
              as: IntakeCoordinator
              captures: { y_id: $.data.id, y_v: $.data.version }
            - call: "POST /naturalization/applicants/${y_id}/screenings"
              payload: { expected_applicant_version: "${y_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 35, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2027-01-29T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${x_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v0}" }
              as: IntakeCoordinator
              captures: { err_x: $.data.error_id }
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${y_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v0}" }
              as: IntakeCoordinator
              captures: { err_y: $.data.error_id }
          assert:
            - "applicant X enrollment rejected: ERR_SCREENING_NOT_ELIGIBLE (outcome NOT_ELIGIBLE)"
            - "applicant Y enrollment rejected: ERR_SCREENING_EXPIRED (expires_at 2027-01-28T00:00:00Z <= clock 2027-01-29)"
            - "ClassSection.${sec_id}.enrolled_count == 0 after both rejections"

      - name: packet_creation_gated_by_workshop_seat_state
        grounds:
          - state_machines.ApplicationPacket
          - state_machines.WorkshopSeat
        distinguishing_aspect: |
          Pair ApplicationPacket -> WorkshopSeat/Workshop: packet creation requires a
          seat in ATTENDED state (which only exists after the Workshop COMPLETED
          transition); a RESERVED seat (workshop still SCHEDULED) is rejected with
          ERR_WORKSHOP_NOT_ATTENDED, proving the packet machine consults the sibling
          workshop aggregate's state, not the applicant's.
        test_recipe:
          setup:
            - "Eligible applicant; LEGAL supervisor; workshop scheduled 2026-08-05T10:00:00Z but NOT completed; seat RESERVED; GENERAL preparer volunteer"
          setup_api_calls:
