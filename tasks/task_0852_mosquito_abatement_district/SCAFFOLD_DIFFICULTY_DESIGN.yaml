          - state_machines.TrapCollection.LOGGED_to_SUBMITTED
          - errors[ERR_COLLECTION_NOT_SUBMITTED]
        distinguishing_aspect: |
          Entity pair #1 is LabPool -> TrapCollection: a pool cannot even be created
          while its parent collection is still LOGGED (ERR_COLLECTION_NOT_SUBMITTED),
          and the identical request succeeds once the collection reaches SUBMITTED,
          which also flips the collection to POOLED.
