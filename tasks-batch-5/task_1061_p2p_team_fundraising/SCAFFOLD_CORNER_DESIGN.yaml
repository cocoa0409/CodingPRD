              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
          trigger:
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"
            - "Donation.${don_id}.payment_status == PENDING"

      - name: campaign_manager_cannot_publish_another_organizations_campaign
        claim_type: ownership_denial
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", "roles.CampaignManager"]
        distinguishing_aspect: "CampaignManager identity is entity_backed:Organization, so acting with organization B's X-User-ID on organization A's campaign returns 403 ERR_UNAUTHORIZED and the campaign stays DRAFT."
        test_recipe:
          setup: ["Two organizations; organization A owns a DRAFT campaign."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_a_id: $.data.id }
