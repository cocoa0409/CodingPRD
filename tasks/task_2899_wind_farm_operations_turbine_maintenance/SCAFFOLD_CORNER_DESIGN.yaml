        distinguishing_aspect: |
          A crane is created REQUESTED and only a reservation cascade mobilizes it, so demobilize is
          legal at exactly one point in the lifecycle: refused before the reservation, accepted after
          it, and the reservation itself is what moves the crane, not any direct crane endpoint.
        test_recipe:
          setup:
            - "one MAJOR_COMPONENT work order with a PLANNED gearbox replacement and one REQUESTED crane"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/spare-parts"
              payload: { component_type: "GEARBOX", part_number: "GB-4200-A", quantity_on_hand: 2, lead_time_days: 210, reorder_point: 1, unit_cost_cents: 48000000, uptower_repairable: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { sp_id: $.data.id }
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 20 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_id}", component_type: "GEARBOX", estimated_lift_hours: 8.0, uptower_labor_hours: 0.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { cr_id: $.data.id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "CRAWLER_600T", mobilization_start_utc: "2026-08-09T00:00:00Z", demobilization_end_utc: "2026-08-12T00:00:00Z", day_rate_cents: 3800000, mobilization_fee_cents: 12000000, max_lift_wind_speed_ms: 9.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/crane-mobilizations/${cm_id}/demobilize"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_early: $.data.error_id }
            - call: "POST /wind-ops/component-replacements/${cr_id}/reserve-crane"
              payload: { crane_mobilization_id: "${cm_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/crane-mobilizations/${cm_id}/demobilize"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
          assert:
            - "the early demobilize returns HTTP 409 with ${err_early} == ERR_INVALID_STATE and CraneMobilization.${cm_id}.state is still REQUESTED"
            - "the reserve-crane call returns 200, moves ComponentReplacement.${cr_id} to CRANE_RESERVED and cascades CraneMobilization.${cm_id} to MOBILIZED"
            - "the second demobilize returns 200 and CraneMobilization.${cm_id}.state == DEMOBILIZED"
            - "ComponentReplacement.${cr_id}.state is still CRANE_RESERVED, so demobilizing the crane does not retract the reservation"
  - section: errors
    instances:
      - name: unknown_path_ids_return_the_collection_specific_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_FAULT_EVENT_NOT_FOUND]
          - errors[ERR_PATH_RESOURCE_NOT_FOUND]
          - response_envelope.error
        distinguishing_aspect: |
          Four of the five path collections have dedicated codes and everything else shares one
          fallback, so the SAME unknown UUID must produce three different error_ids depending on which
          collection it was addressed to - and the fallback must be used for /crews/{id}, which has no
          code of its own.
        test_recipe:
          setup:
            - "an empty database except for the logical clock"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /wind-ops/work-orders/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_wo: $.data.error_id }
            - call: "POST /wind-ops/work-orders/11111111-2222-3333-4444-555555555555/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_wo_action: $.data.error_id }
            - call: "GET /wind-ops/fault-events/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_fe: $.data.error_id }
            - call: "POST /wind-ops/fault-events/11111111-2222-3333-4444-555555555555/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "rel-1"
              captures: { err_fe_action: $.data.error_id }
            - call: "GET /wind-ops/crews/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_crew: $.data.error_id }
            - call: "GET /wind-ops/spare-parts/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { err_sp: $.data.error_id }
          assert:
            - "both work-order calls return HTTP 404 with ${err_wo} == ERR_WORK_ORDER_NOT_FOUND and ${err_wo_action} == ERR_WORK_ORDER_NOT_FOUND, so the read and the action agree"
            - "both fault-event calls return HTTP 404 with ${err_fe} == ERR_FAULT_EVENT_NOT_FOUND and ${err_fe_action} == ERR_FAULT_EVENT_NOT_FOUND"
            - "the crew read returns HTTP 404 with ${err_crew} == ERR_PATH_RESOURCE_NOT_FOUND, the fallback for a collection with no dedicated code"
            - "the spare-part read returns HTTP 404 with ${err_sp} == ERR_PATH_RESOURCE_NOT_FOUND"
            - "every one of the six responses is the error envelope: response_type error, meta.api_request_id present, and data holding only error_id and message"
  - section: rbac
    instances:
      - name: a_missing_or_undeclared_role_header_is_unauthenticated
        claim_type: authentication_enforcement
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 10 outranks everything, so an absent header, an empty header and a role name outside
          the declared six are all 401 - never 403, and never a 404 even when the path id is also
          unknown, which proves authentication runs before path resolution.
        test_recipe:
          setup:
            - "one farm so that a legitimate resource exists to aim at"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
          trigger:
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: NONE
              as_user_id: "admin-1"
              captures: { err_no_role: $.data.error_id }
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: ""
              as_user_id: "admin-1"
              captures: { err_empty_role: $.data.error_id }
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: SiteAdmin
              as_user_id: ""
              captures: { err_empty_user: $.data.error_id }
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: TurbineTechnicianIntern
              as_user_id: "intern-1"
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /wind-ops/turbines/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: NONE
              as_user_id: "admin-1"
              captures: { err_no_role_unknown_path: $.data.error_id }
          assert:
            - "the call with no X-User-Role header returns HTTP 401 with ${err_no_role} == ERR_UNAUTHENTICATED"
            - "the call with an empty X-User-Role returns HTTP 401 with ${err_empty_role} == ERR_UNAUTHENTICATED"
            - "the call with an empty X-User-ID returns HTTP 401 with ${err_empty_user} == ERR_UNAUTHENTICATED, so both headers are required"
            - "the call naming a role outside the declared six returns HTTP 401 with ${err_unknown_role} == ERR_UNAUTHENTICATED, not 403"
            - "the unauthenticated call against an unknown turbine id returns HTTP 401 with ${err_no_role_unknown_path} == ERR_UNAUTHENTICATED, NOT 404, because priority 10 runs before priority 32"
      - name: another_roles_exclusive_operation_is_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=20]
          - roles.SiteAdmin.exclusive_operations
          - roles.ControlRoomOperator.exclusive_operations
          - roles.MaintenancePlanner.exclusive_operations
          - roles.CommercialManager.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Peer roles, not a hierarchy: SiteAdmin is NOT a superuser and is refused the commercial
          manager's settlement create, exactly as the control room operator is refused the farm
          registry. The commercially restricted GETs are refused to the control room too, so read
          access is not uniform across the six roles.
        test_recipe:
          setup:
            - "one farm, one turbine and one service agreement to aim the calls at"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/service-agreements"
              payload: { wind_farm_id: "${farm_id}", guaranteed_availability_pct: 97.0, availability_basis: "TIME_BASED", lda_rate_cents_per_pct_point: 500000, lda_cap_cents: 4000000, period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/farms"
              payload: { name: "Rogue Site", region_code: "MT-W", grid_operator_code: "NWMT", landowner_budget_cap_cents: 100000000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_farm_create: $.data.error_id }
            - call: "POST /wind-ops/turbines/${t_id}/scada-sync"
              payload: { operating_hours_delta: 10.0, actual_energy_kwh: 20000.0, potential_energy_kwh: 21000.0 }
