            - "ContributionRecord.${rec2_id}.status == CERTIFIED and ContributionRecord.${rec2_id}.plan_year_start == 2024 (adjacent intervals are accepted)"
            - "${err} == ERR_CONTRIBUTION_PERIOD_OVERLAP"
            - "HTTP status of the third POST /contribution-records == 409"
            - "GET /contribution-records filtered by employer_id ${emp_id} returns total_count == 2"
            - "Employer.${emp_id}.version == ${emp_v3} (the rejected record bumped nothing)"

      - name: valuation_measurement_windows_are_half_open_with_a_thirty_day_quiet_buffer
        grounds:
          - validations[priority=11]
          - errors[ERR_VALUATION_WINDOW_CONFLICT]
          - entities.PlanYearValuation.fields.measurement_window_start
          - entities.PlanYearValuation.fields.measurement_window_end
          - calculations.anchor_valuation_selector
        distinguishing_aspect: |
          Different interval semantics on a different resource entity (Plan, not Employer): half-open
          datetime windows guarded by a thirty-day quiet buffer, so a window starting 2025-10-15
          collides with an incumbent ending 2025-10-01 even though the raw intervals are disjoint,
          while a window starting exactly at 2025-10-31 — the incumbent end plus thirty days — is
          accepted. Adjacency is REJECTED here, the opposite of the contribution-record rule.
        test_recipe:
          setup:
            - "Plan registered; one CERTIFIED valuation for plan year 2025 whose measurement window is [2025-01-01T00:00:00Z, 2025-10-01T00:00:00Z)."
            - "Clock left at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Empire Retail Clerks Pension Plan", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "PLAN_ELECTED_HIGH", interest_rate_bps: 725, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 6000000000, uvb_pool_cents: 600000000, all_employer_contributions_cents: 1500000000, all_employer_cbu: 1500000, interest_rate_bps: 725, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { v2025_id: "$.data.id" }
          trigger:
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, measurement_window_start: "2025-10-15T00:00:00Z", measurement_window_end: "2026-06-01T00:00:00Z", uvb_total_cents: 6100000000, uvb_pool_cents: 610000000, all_employer_contributions_cents: 1500000000, all_employer_cbu: 1500000, interest_rate_bps: 725, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, measurement_window_start: "2025-10-31T00:00:00Z", measurement_window_end: "2026-06-01T00:00:00Z", uvb_total_cents: 6100000000, uvb_pool_cents: 610000000, all_employer_contributions_cents: 1500000000, all_employer_cbu: 1500000, interest_rate_bps: 725, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { v2026_id: "$.data.id" }
          assert:
            - "${err} == ERR_VALUATION_WINDOW_CONFLICT"
            - "HTTP status of the first trigger POST /plan-year-valuations == 409"
            - "PlanYearValuation.${v2026_id}.measurement_window_start == 2025-10-31T00:00:00Z"
            - "PlanYearValuation.${v2026_id}.status == CERTIFIED"
            - "PlanYearValuation.${v2025_id}.status == CERTIFIED (the incumbent was neither superseded nor touched)"
            - "GET /plan-year-valuations filtered by plan_id ${plan_id} returns total_count == 2"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: employer_outstanding_liability_decomposition_survives_schedule_regeneration
        grounds:
          - entities.Employer.fields.outstanding_liability_cents
          - entities.PaymentSchedule.fields.applied_credit_cents
          - entities.PaymentSchedule.fields.capped_basis_cents
          - calculations.amortization_and_twenty_year_cap
          - state_machines.PaymentSchedule.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity EMPLOYER_OUTSTANDING_LIABILITY: the forward action (issue, then pay
          installment 1 for 8928571) and the compensating action (regenerate the schedule after the
          plan concedes 150000000) must leave the decomposition exact —
          capped_basis 141071429 + forgiven 0 + applied_credit 8928571 == net_assessed 150000000 —
          and Employer.outstanding_liability_cents must equal 141071429 with no drift.
        test_recipe:
          setup:
            - "Baseline 250000000-cent assessment ISSUED at 2026-08-01T00:00:00Z with annual_payment_cents 50000000 and 28 installments of 8928571 / 8928583."
            - "Clock advanced to 2026-09-30T00:00:00Z, a sweep run, installment 1 paid for exactly 8928571 cents."
            - "Request for review filed 2026-10-01T00:00:00Z and DECIDED REDUCED on 2026-10-15T00:00:00Z with recomputed_net_assessed_cents 150000000."
