      - name: terminal_encounter_phase_at_priority_8_01_outranks_the_expired_credential_at_priority_11_1
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8.01]
          - validations[priority=11.1]
          - errors[ERR_ENCOUNTER_PHASE_TERMINAL]
          - errors[ERR_STAFF_CREDENTIAL_EXPIRED]
          - endpoints[POST /care-assignments]
          - endpoints[PATCH /staff-members/{staffId}]
          - state_machines.LaborEncounter.labor_phase
        distinguishing_aspect: |
          This is §1.4's declared PRIORITY CONFLICT PAIR 1, and it crosses HTTP families: the
          state rung answers 409 while the business-safety rung answers 422. An implementation that
          front-loads all its "is this staff member usable" checks (a cheap credential comparison
          against clock_now) before loading the encounter aggregate would answer 422 here. The
          expired credential is manufactured by PATCHing an already-ACTIVE shift's staff member —
          PATCH /staff-members only runs priorities 1, 2, 3 and 5, so it is the only way to hold an
          ACTIVE shift whose staff credential has lapsed, keeping priority 8.08 satisfied so that
          nothing between 8.01 and 11.1 can fire. The control call on a non-terminal encounter
          proves 11.1 is armed and that only the phase check outranked it.
        test_recipe:
          setup: |
            One unit with a single AVAILABLE LDR bed, an ACTIVE CHARGE shift covering the clock, and
            two encounters: one transferred out (terminal labor_phase TRANSFERRED_OUT) and one still
            ANTEPARTUM. Neither encounter holds a bed, so the bed stays AVAILABLE and the posture is
            never DIVERT. The shift's staff credential is retro-dated into the past after the shift
            is already ACTIVE.
