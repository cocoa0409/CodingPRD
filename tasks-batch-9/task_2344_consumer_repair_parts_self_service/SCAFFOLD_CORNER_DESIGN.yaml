      - name: compatibility_tool_reference_links_a_third_part_and_an_unknown_tool_is_rejected
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /repair-program/part-compatibilities]
          - endpoints[GET /repair-program/part-compatibilities]
          - endpoints[GET /repair-program/part-catalog-items/{part_id}/part-compatibilities]
          - validations[priority=20]
        distinguishing_aspect: |
          The junction row carries three foreign keys, and the tool reference is
          the one that is neither of the two sides of the association — it must be
          validated on write and must be reachable by reverse lookup from the tool
          part, not only from the component part.
        test_recipe:
          setup:
            - "Model CRX-E4; PUBLISHED component SKU-E4-P and PUBLISHED tool SKU-E4-T."
          setup_api_calls:
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-E4", product_family: "CRX", market_release_date: "2023-01-01T00:00:00Z", repairability_tier: "TIER_B_GUIDED" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E4-P", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 5000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E4-T", part_class: "TOOL", safety_class: "UNRESTRICTED", list_price_cents: 3500, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { tool_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items/${part_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${tool_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2023-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 40, required_tool_part_id: "00000000-0000-0000-0000-0000000000ff" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { e1: $.data.error_id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2023-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 40, required_tool_part_id: "${tool_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { compat_id: $.data.id, flagged: $.data.superseded_by_safety_restriction }
            - call: "GET /repair-program/part-compatibilities"
              payload: { required_tool_part_id: "${tool_id}" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { n_by_tool: $.total_count }
            - call: "GET /repair-program/part-catalog-items/${tool_id}/part-compatibilities"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { n_tool_nested: $.total_count }
            - call: "GET /repair-program/product-models/${model_id}/part-compatibilities"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { n_by_model: $.total_count }
          assert:
            - "${e1} == ERR_PART_NOT_FOUND with HTTP 404 and no junction row was created"
            - "${compat_id} is a fresh row with ${flagged} == false"
            - "${n_by_tool} == 1 and the row's id equals ${compat_id}"
            - "${n_tool_nested} == 1 — the tool part reaches the junction through required_tool_part_id even though it is neither part_id nor model_id"
            - "${n_by_model} == 1 and the row's required_tool_part_id equals ${tool_id}"

