    instances:
      - name: blocked_customer_beats_window_full_state_vs_safety
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_CUSTOMER_BLOCKED]
          - errors[ERR_WINDOW_FULL]
        distinguishing_aspect: |
          Pair = business_safety (priority 9, ERR_CUSTOMER_BLOCKED) vs
          business_temporal capacity (priority 14, ERR_WINDOW_FULL). A schedule by a
          BLOCKED customer into a FULL pickup window returns ERR_CUSTOMER_BLOCKED
          because priority 9 < 14.
