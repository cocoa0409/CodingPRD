  - section: validations
    instances:
      - name: superseded_determination_blocks_new_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_WAGE_DETERMINATION_NOT_PUBLISHED]", "state_machines.WageDetermination.PUBLISHED_to_SUPERSEDED"]
        distinguishing_aspect: "After a same-tuple determination supersedes WD1, a job order still referencing WD1 cannot submit: ERR_WAGE_DETERMINATION_NOT_PUBLISHED 409."
        test_recipe:
          setup: ["WD1 PUBLISHED; J1 created referencing WD1 (DRAFT); WD2 same (state, crop, activity, year) tuple created afterwards (supersedes WD1)"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1975, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd2: $.data.id } }
          trigger:
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /h2a/wage-determinations?status=SUPERSEDED", as: ProgramReviewer, captures: { superseded_id: "$.data[0].id" } }
          assert:
            - "409 with error_id == ERR_WAGE_DETERMINATION_NOT_PUBLISHED"
            - "GET /h2a/wage-determinations?status=SUPERSEDED returns exactly [${wd1}]; WD2 is PUBLISHED"

      - name: submitted_order_immune_to_determination_supersede
        claim_type: conditional_validation
        grounds: ["calculations.job_order_derived_terms", "entities.JobOrder.fields.locked_aewr_hourly_cents"]
        distinguishing_aspect: "Version-pinning on submit: J0 submitted while WD1 was PUBLISHED keeps floor 1850 forever, even after WD2 (aewr 1975) supersedes WD1; a DRAFT order J2 referencing WD2 computes floor 1975."
        test_recipe:
          setup: ["WD1 PUBLISHED; J0 submitted (locked); WD2 same tuple created (aewr 1975) superseding WD1; J2 DRAFT referencing WD2"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
