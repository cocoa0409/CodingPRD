  # ==========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances from different modes {a,b,c})
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: listing_price_ceil_per_component_then_sum
        grounds:
          - calculations.listing_price
        distinguishing_aspect: |
          Mode (b) nested rounding. base=101c, APPAREL (fee_bps=1500), markup_bps=1500.
          Scaffold pins CEIL-per-component BEFORE addition: platform_fee = ceil(101*1500/10000) = 16,
          creator_markup = ceil(101*1500/10000) = 16, listed_price_cents = 101 + 16 + 16 = 133.
          The alternate order 'sum bps then ceil' would give ceil(101*3000/10000) = 31 -> 132, which differs by 1.
        test_recipe:
          setup:
            - "One APPAREL Product with base_cost_cents=101 and one Variant."
            - "One VERIFIED Creator with a Storefront markup_bps=1500."
            - "One APPROVED Design and one PUBLISHED Listing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/products"
              payload: { sku: "T-EDGE", category: "APPAREL", base_cost_cents: 101, dimensions_json: { width_px: 3000, height_px: 3600, dpi: 300 } }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /pod/products/${prod_id}/variants"
              payload: { color: "GREY", size: "S" }
              as: PlatformAdmin
              captures: { var_id: $.data.id }
            - call: "POST /pod/creators/register"
              payload: { email: "c@example.com", display_name: "C", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "c-sf", integration_channel: "NATIVE", markup_bps: 1500 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/designs"
              payload: { file_hash: "hash_c_1" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { design_id: $.data.id }
            - call: "POST /pod/designs/${design_id}/mockup"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /pod/designs/${design_id}/approve"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /pod/listings"
              payload: { storefront_id: "${sf_id}", design_id: "${design_id}", variant_id: "${var_id}", title: "Edge Tee" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { new_listing_id: $.data.id, priced: $.data.listed_price_cents }
          assert:
            - "priced == 133"
            - "priced != 132"

      - name: payout_cycle_pinned_gross_then_fee_then_net_order
        grounds:
          - calculations.payout_cycle
          - state_machines.PayoutCycle.DRAFT_to_RELEASED
        distinguishing_aspect: |
          Mode (c) pinned evaluation order for a circular-looking dependency. gross depends on which
          orders count, fee = floor(gross * bps/10000), net = gross - fee. Pin: gross FIRST from
          delivered eligible orders in window, THEN fee (floored), THEN net. For gross=1000c and
          fee_bps=250 the scaffold yields fee=25 and net=975 (a fee-then-gross order would fail).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z."
            - "One VERIFIED Creator, one Storefront, one DELIVERED non-sample Order with creator_net_cents=1000 (base=2000c, markup_bps=5000, item_count=1 -> markup_per_unit=1000c)."
            - "A DRAFT PayoutCycle covering the window [2026-06-01T00:00:00Z, 2026-06-30T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/fulfillment-partners"
