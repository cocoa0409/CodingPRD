              payload: { model_variant: "CONTRACTUAL", as_of_date: "2026-08-01", expected_scenario_version: "${sc_v1}" }
              as: TreasuryAnalyst
              captures: { run_a: $.data.id }
            - call: "GET /liquidity/stress-scenarios/${sc}"
              as: TreasuryAnalyst
              captures: { sc_v2: $.data.version, sc_rc: $.data.run_count }
            - call: "POST /liquidity/stress-scenarios/${sc}/projection-runs"
              payload: { model_variant: "CONTRACTUAL", as_of_date: "2026-08-01", expected_scenario_version: "${sc_v2}" }
              as: TreasuryAnalyst
              captures: { run_b: $.data.id }
            - call: "GET /liquidity/projection-runs/${run_a}"
              as: TreasuryAnalyst
              captures: { ra_st: $.data.status }
            - call: "POST /liquidity/stress-scenarios/${sc}/projection-runs"
              payload: { model_variant: "BEHAVIORAL", as_of_date: "2026-08-01", expected_scenario_version: "${sc_v1}" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "sc_rc == 1 and sc_v2 == 2  (run creation bumped scenario run_count and version)"
            - "ra_st == DISCARDED  (superseded by the newer same-variant DRAFT)"
            - "err == ERR_STALE_VERSION  (version 1 is stale after two run creations)"

      - name: cascading_layer_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: pledge_release_cascades_to_line_suspension_and_action_block
          rationale: "N-level cascade ordering is asserted end-to-end by the transitive_cascade difficulty instances (pledge release and RED reading chains)."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: hqla_baseline_vs_stress_haircut_divergence
          rationale: "Both variants and their divergence are asserted by the dual_variant_calc difficulty instances (HQLA and projection domains)."

      - name: threshold_layer_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: funding_limit_value_equal_does_not_breach
          rationale: "Cumulative-vs-boundary threshold behavior (== no breach, > breaches; amber >= 3) is asserted by the boundary_precision_check difficulty instances."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: draw_response_reflects_mutation_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.borrowing_power]
        distinguishing_aspect: "Immediate consistency: the draw response itself carries the updated drawn_cents/borrowing_power_cents, and a follow-up GET returns identical values (no lag, no recompute drift)."
        test_recipe:
          setup: ["Line 80000000/5000; LEVEL_2A asset 100000000 pledged (power 42500000)"]
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "FHLB", line_type: "FHLB", total_capacity_cents: 80000000, advance_rate_bps: 5000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2A", reference: "A1", market_value_cents: 100000000 }
              as: TreasuryOps
              captures: { a1: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${a1}", line_id: "${ln}" }
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/borrowing-lines/${ln}/draw"
              payload: { amount_cents: 30000000 }
              as: TreasuryOps
              captures: { dr1: $.data.drawn_cents, pw1: $.data.borrowing_power_cents }
            - call: "GET /liquidity/borrowing-lines/${ln}"
              as: TreasuryOps
              captures: { dr2: $.data.drawn_cents, pw2: $.data.borrowing_power_cents }
          assert:
            - "dr1 == 30000000 and pw1 == 12500000  (mutation visible in the same response)"
            - "dr2 == 30000000 and pw2 == 12500000  (read-after-write agrees immediately)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: fail_executing_drawdown_compensates_draw
        claim_type: side_effect_execution
        grounds: [state_machines.PlaybookAction.EXECUTING_to_FAILED, calculations.borrowing_power]
        distinguishing_aspect: "Compensation pattern: failing an EXECUTING LINE_DRAWDOWN reverses its draw — drawn_cents returns to 0 and borrowing_power_cents returns to its pre-execution value, with no drift."
        test_recipe:
          setup:
            - "ACTIVE playbook (line 100000000/10000 with LEVEL_1 200000000 pledged, power 100000000) with one LINE_DRAWDOWN action est 10000000 lag 0; action EXECUTING (line drawn 10000000, power 90000000)"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 10000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 10000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
            - call: "POST /liquidity/playbook-actions/${act}/execute"
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/playbook-actions/${act}/fail"
              as: TreasuryOps
              captures: { act_st: $.data.status }
            - call: "GET /liquidity/borrowing-lines/${ln}"
              as: TreasuryOps
              captures: { ln_dr: $.data.drawn_cents, ln_pw: $.data.borrowing_power_cents }
          assert:
            - "act_st == FAILED"
            - "ln_dr == 0 and ln_pw == 100000000  (draw fully compensated)"

      - name: reinstate_suspended_line_restores_blocked_actions
        claim_type: side_effect_execution
        grounds: [state_machines.BorrowingLine.SUSPENDED_to_ACTIVE, state_machines.PlaybookAction.BLOCKED_to_READY]
        distinguishing_aspect: "Cyclic line machine reverse arc: manual suspend blocks the READY drawdown action; reinstate (drawn 0 within capacity) returns the line to ACTIVE and the BLOCKED action to READY, after which execution succeeds."
        test_recipe:
          setup:
            - "ACTIVE playbook (line 50000000/10000 with LEVEL_1 60000000 pledged, power 50000000) with one LINE_DRAWDOWN action est 5000000 (READY); line manually suspended by RiskOfficer (action BLOCKED)"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 50000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 60000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 5000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 5000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
            - call: "POST /liquidity/borrowing-lines/${ln}/suspend"
              as: RiskOfficer
          trigger:
            - call: "GET /liquidity/playbook-actions/${act}"
              as: TreasuryOps
              captures: { act_st1: $.data.status }
            - call: "POST /liquidity/borrowing-lines/${ln}/reinstate"
              as: RiskOfficer
              captures: { ln_st: $.data.status }
            - call: "GET /liquidity/playbook-actions/${act}"
              as: TreasuryOps
              captures: { act_st2: $.data.status }
            - call: "POST /liquidity/playbook-actions/${act}/execute"
              as: TreasuryOps
              captures: { act_st3: $.data.status }
          assert:
            - "act_st1 == BLOCKED  (suspend cascade)"
            - "ln_st == ACTIVE"
            - "act_st2 == READY  (reinstate restores the blocked action; playbook is ACTIVATED)"
            - "act_st3 == EXECUTING"

      - name: posture_snapshot_history_lists_evaluations
        claim_type: valid_transition
        grounds: [state_machines.PostureSnapshot, "endpoints[GET /liquidity/posture-snapshots]"]
        distinguishing_aspect: "Append-only history: one READING_AUTO escalation plus one manual evaluation produce exactly two snapshots ordered by snapshot_seq, with trigger values READING_AUTO then MANUAL_EVALUATION."
        test_recipe:
          setup: ["Metric M (amber 1000, red 5000, cadence 0) with one RED reading 6000 (auto-escalation to SEVERE)"]
          setup_api_calls:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M", name: "m", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m: $.data.id }
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 6000 }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/posture-evaluations"
              as: RiskOfficer
              captures: { snap_lvl: $.data.level, snap_prior: $.data.prior_level, snap_trig: $.data.trigger }
            - call: "GET /liquidity/posture-snapshots"
              as: RiskOfficer
          assert:
            - "snap_lvl == SEVERE and snap_prior == SEVERE and snap_trig == MANUAL_EVALUATION"
            - "snapshot list contains exactly 2 entries ordered by snapshot_seq: first READING_AUTO, second MANUAL_EVALUATION"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: asset_reprice_updates_hqla_summary
        claim_type: derived_field_reconciliation
        grounds: [calculations.hqla_adjusted_value, "endpoints[PATCH /liquidity/liquid-assets/{id}]"]
        distinguishing_aspect: "Derived reconciliation: repricing an asset (market 1000000 -> 2000000) is reflected in the very next hqla-summary read (baseline total 750000 -> 1500000); no staleness."
        test_recipe:
          setup: ["BASELINE scenario (addon 0); one UNENCUMBERED LEVEL_2B asset at 1000000"]
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2B", reference: "B1", market_value_cents: 1000000 }
              as: TreasuryOps
              captures: { a1: $.data.id }
          trigger:
            - call: "GET /liquidity/hqla-summary"
              payload: { scenario_id: "${sc}" }
              as: TreasuryAnalyst
              captures: { tot1: $.data.baseline_total_cents }
            - call: "PATCH /liquidity/liquid-assets/${a1}"
              payload: { market_value_cents: 2000000 }
              as: TreasuryOps
            - call: "GET /liquidity/hqla-summary"
              payload: { scenario_id: "${sc}" }
              as: TreasuryAnalyst
              captures: { tot2: $.data.baseline_total_cents }
          assert:
            - "tot1 == 750000  (floor(1000000*0.75))"
            - "tot2 == 1500000  (floor(2000000*0.75); reprice flows through immediately)"
