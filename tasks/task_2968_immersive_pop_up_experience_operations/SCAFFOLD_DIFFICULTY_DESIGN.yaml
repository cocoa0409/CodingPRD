      - name: buildout_waterfall_buckets_always_sum_to_the_spend
        grounds:
          - calculations.buildout_allowance_drawdown
          - validations[priority 150].ERR_BUILDOUT_CAP_EXCEEDED
          - endpoints[POST /venues/{venueId}/buildout-draws]
        distinguishing_aspect: |
          A third conserved quantity — buildout money — with a fixed bucket order rather than a
          two-way split: buildout_spend_cents must always equal allowance_drawn_cents +
          kit_credit_drawn_cents + operator_capex_cents, and the three buckets must fill strictly in the
          declared order regardless of draw size. Two draws deliberately straddle a bucket boundary (a
          600000 draw that finishes the landlord allowance and spills 300000 into the reuse credit, then a
          900000 draw that empties the credit and pushes 700000 onto operator capital), one draw is
          refused for breaching the cap and must leave all four counters byte-identical, and a final draw
          lands the spend exactly ON the cap to show the comparison is strictly greater-than.
        test_recipe:
          setup:
            - "One PERMITTED / LEASE_ACTIVE NYC venue with buildout_allowance_cents 1500000, kit_reuse_credit_cents 500000 and buildout_cap_cents 3000000; all four cumulative counters start at 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, kit_reuse_credit_cents: 500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
          trigger:
            - call: "POST /venues/${venue_id}/buildout-draws"
              payload: { draw_amount_cents: 1200000, memo: "steel and rigging" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/buildout-draws"
              payload: { draw_amount_cents: 600000, memo: "millwork" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/buildout-draws"
              payload: { draw_amount_cents: 900000, memo: "AV and lighting" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/buildout-draws"
              payload: { draw_amount_cents: 400000, memo: "overrun" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/buildout-draws"
              payload: { draw_amount_cents: 300000, memo: "final fit-out to the cap" }
              as: VenueOpsManager
              as_user_id: "vom-1"
          assert:
            - "after draw 1 (1200000): allowance_drawn_cents == 1200000, kit_credit_drawn_cents == 0, operator_capex_cents == 0, buildout_spend_cents == 1200000 and 1200000 == 1200000 + 0 + 0"
            - "after draw 2 (600000): allowance_drawn_cents == 1500000 (bucket 1 exhausted), kit_credit_drawn_cents == 300000, operator_capex_cents == 0, buildout_spend_cents == 1800000 and 1800000 == 1500000 + 300000 + 0"
            - "after draw 3 (900000): allowance_drawn_cents == 1500000, kit_credit_drawn_cents == 500000 (bucket 2 exhausted), operator_capex_cents == 700000, buildout_spend_cents == 2700000 and 2700000 == 1500000 + 500000 + 700000"
            - "draw 4 (400000) responds 409 with data.error_id == ERR_BUILDOUT_CAP_EXCEEDED because 2700000 + 400000 > 3000000, and the cap is checked BEFORE any bucket is touched"
            - "after the refusal all four counters are unchanged (1500000 / 500000 / 700000 / 2700000) and PopupVenue.${venue_id}.version is unchanged — no partial allocation was applied"
            - "draw 5 (300000) responds 200 because 2700000 + 300000 == 3000000 is not GREATER than the cap: operator_capex_cents == 1000000, buildout_spend_cents == 3000000 and 3000000 == 1500000 + 500000 + 1000000"
            - "a further draw of any positive amount would now be refused; the invariant buildout_spend_cents == allowance_drawn_cents + kit_credit_drawn_cents + operator_capex_cents held after each of the four accepted or refused calls"
