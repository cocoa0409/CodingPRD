              as: BillingClerk
              captures: { settlement_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_v: $.data.version }
            - call: "POST /harvest/settlements/${settlement_id}/issue"
              payload: { expected_contract_version: "${contract_v}" }
              as: BillingClerk
            - call: "POST /harvest/settlements/${settlement_id}/dispute"
              payload: {}
              as: GrowerLiaison
          trigger:
            - call: "POST /harvest/settlements/${settlement_id}/resolve"
              payload: { resolution_note: "adjusted" }
              as: BillingClerk
          assert:
            - "Settlement.${settlement_id}.status == RESOLVED"
            - "CustomerContract.${contract_id}.status == SETTLED (re-read)"

      - name: cancel_contract_cascades_scheduled_stops
        claim_type: cross_entity
        grounds:
          - state_machines.CustomerContract.transitions.COMMITTED_to_CANCELLED
        distinguishing_aspect: "Cancelling a COMMITTED contract cascades SCHEDULED stops to SKIPPED and RESERVED assignments to CANCELLED."
        test_recipe:
          setup: ["Contract COMMITTED with one SCHEDULED stop holding a RESERVED assignment"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /harvest/contracts/${contract_id}/cancel"
              payload: {}
              as: GrowerLiaison
          assert:
            - "CustomerContract.${contract_id}.status == CANCELLED"
            - "RouteStop.${stop_id}.status == SKIPPED (re-read)"
            - "MachineAssignment.${asg_id}.status == CANCELLED (re-read)"
            - "Machine.${machine_id}.status == AVAILABLE (re-read)"

      - name: contract_list_filter_by_season_id
        claim_type: listing
        grounds:
          - endpoints.GET_/harvest/contracts
        distinguishing_aspect: "GET /harvest/contracts?season_id=X returns only contracts belonging to season X."
        test_recipe:
          setup: ["Two seasons each with one contract"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
