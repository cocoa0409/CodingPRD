# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# K-12 Student Information System — Expert
# 9 rule_ids × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ada_aggregate_membership_vs_days_present_diverge
        grounds:
          - calculations.ada_funding_total
          - entities.AdaFundingReport.fields.total_ada
          - entities.Enrollment.fields.present_days
          - entities.School.fields.ada_method
        distinguishing_aspect: |
          Identical roster, identical membership span (3 days) but 1 absent day:
          AGGREGATE_MEMBERSHIP school computes total_ada=0.0167 (span 3/180) while a
          DAYS_PRESENT school computes total_ada=0.0111 (present 2/180) — divergent
          ADA on the AdaFundingReport/Enrollment domain.
        test_recipe:
          setup:
            - "Two schools: school AGG (ada_method=AGGREGATE_MEMBERSHIP) and school DP (ada_method=DAYS_PRESENT), each session_total_days=180, minimum_daily_minutes=240, clock advanced to day 3."
            - "Each school has one 240-minute section, one enrollment entry_day_index=1 fte=1.0, present days 1 and 2, absent day 3."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "AGG School", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", minimum_daily_minutes: 240, session_total_days: 180 }
              as: Registrar
              captures: { sch_agg: $.data.id }
            - call: "POST /schools"
              payload: { name: "DP School", state_code: "CA", ada_method: "DAYS_PRESENT", minimum_daily_minutes: 240, session_total_days: 180 }
              as: Registrar
              captures: { sch_dp: $.data.id }
            - call: "POST /schools/${sch_agg}/clock/advance"
              payload: { by_days: 3 }
              as: Registrar
            - call: "POST /schools/${sch_dp}/clock/advance"
              payload: { by_days: 3 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch_agg}", state_student_id: "SSID-A1", first_name: "Ann", last_name: "Agg", grade_level: "5", birth_date: "2015-03-01" }
              as: Registrar
              captures: { stu_agg: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch_dp}", state_student_id: "SSID-D1", first_name: "Dan", last_name: "Dp", grade_level: "5", birth_date: "2015-04-01" }
              as: Registrar
              captures: { stu_dp: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_agg}", entry_day_index: 1, fte: 1.0 }
              as: Registrar
              captures: { enr_agg: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_dp}", entry_day_index: 1, fte: 1.0 }
              as: Registrar
              captures: { enr_dp: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch_agg}", course_code: "MATH5", title: "Math 5", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs_agg: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch_dp}", course_code: "MATH5", title: "Math 5", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs_dp: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs_agg}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 240 }
              as: Registrar
              captures: { sec_agg: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs_dp}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 240 }
              as: Registrar
              captures: { sec_dp: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr_agg}", section_id: "${sec_agg}" }
              as: Registrar
              captures: { sa_agg: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr_dp}", section_id: "${sec_dp}" }
              as: Registrar
              captures: { sa_dp: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa_agg}", day_index: 1, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa_agg}", day_index: 2, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa_agg}", day_index: 3, code: "ABSENT_UNEXCUSED" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa_dp}", day_index: 1, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa_dp}", day_index: 2, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa_dp}", day_index: 3, code: "ABSENT_UNEXCUSED" }
              as: Teacher
          trigger:
            - call: "POST /ada-funding-reports"
              payload: { school_id: "${sch_agg}", as_of_day_index: 3 }
              as: StateReportingOfficer
              as_user_id: "officer-1"
              captures: { rep_agg: $.data.id, agg_total: $.data.total_ada }
            - call: "POST /ada-funding-reports"
              payload: { school_id: "${sch_dp}", as_of_day_index: 3 }
              as: StateReportingOfficer
              as_user_id: "officer-1"
              captures: { rep_dp: $.data.id, dp_total: $.data.total_ada }
          assert:
            - "AdaFundingReport.${rep_agg}.method_used == AGGREGATE_MEMBERSHIP"
            - "AdaFundingReport.${rep_agg}.total_ada == 0.0167"
            - "AdaFundingReport.${rep_dp}.method_used == DAYS_PRESENT"
            - "AdaFundingReport.${rep_dp}.total_ada == 0.0111"
            - "AdaFundingReport.${rep_agg}.total_ada != AdaFundingReport.${rep_dp}.total_ada"

      - name: report_card_standards_vs_traditional_letter_diverge
        grounds:
          - calculations.section_letter_grade
          - entities.Course.fields.grading_mode
          - entities.StandardScore.fields.mastery_level
          - entities.StandardScore.fields.percentage_points
        distinguishing_aspect: |
          A STANDARDS course with weighted_mastery 3.0 yields letter B / grade_points 3.0,
          while a TRADITIONAL course with weighted_pct 88.0 yields letter B / grade_points 3.0
          but mastery_or_percent differs (3.0 vs 88.0) and the two formulas read different
          fields — letter-grade computation diverges by entity-config (Course.grading_mode).
        test_recipe:
          setup:
            - "One school, one enrolled student scheduled into two sections: section S (STANDARDS course) and section T (TRADITIONAL course)."
            - "Section S has one standard score mastery_level=3 weight=1; section T has one standard score percentage_points=88 weight=1."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Grade School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-G1", first_name: "Gia", last_name: "Grade", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "ENG9", title: "English 9", grading_mode: "STANDARDS", credit_value: 1.0 }
              as: Registrar
              captures: { crs_s: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "HIS9", title: "History 9", grading_mode: "TRADITIONAL", credit_value: 1.0 }
              as: Registrar
              captures: { crs_t: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs_s}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec_s: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs_t}", teacher_user_id: "teacher-1", period: 2 }
              as: Registrar
              captures: { sec_t: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec_s}" }
              as: Registrar
              captures: { sa_s: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec_t}" }
              as: Registrar
              captures: { sa_t: $.data.id }
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${sa_s}", standard_code: "ENG.9.RL.1", mastery_level: 3, weight: 1.0 }
              as: Teacher
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${sa_t}", standard_code: "HIS.9.1", mastery_level: 3, weight: 1.0, percentage_points: 88 }
              as: Teacher
            - call: "POST /report-cards"
              payload: { enrollment_id: "${enr}", term_label: "Q1" }
              as: Teacher
              captures: { rc: $.data.id, rc_v: $.data.version }
          trigger:
            - call: "POST /report-cards/${rc}/finalize"
              payload: { expected_report_card_version: "${rc_v}" }
              as: Teacher
              captures: { gpa: $.data.overall_gpa }
          assert:
            - "ReportCard.${rc}.status == FINALIZED"
            - "ReportCard.${rc}.line_items[section_id=${sec_s}].grade_points == 3.0 and mastery_or_percent == 3.0"
            - "ReportCard.${rc}.line_items[section_id=${sec_t}].grade_points == 3.0 and mastery_or_percent == 88.0"
            - "ReportCard.${rc}.overall_gpa == 3.0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: daily_rollup_present_partial_absent_branching
        grounds:
          - calculations.daily_attendance_rollup
          - entities.DailyAttendance.fields.daily_code
          - entities.AttendanceRecord.fields.present_minutes
        distinguishing_aspect: |
          Mode (a) nonlinear with >=3 inputs: daily_code branches on (present_minutes_total,
          expected_minutes, empty-set) — two 50-min sections present in one period and absent in
          the other yields present_minutes_total=50 < expected_minutes=100 -> PARTIAL, not PRESENT.
        test_recipe:
          setup:
            - "One school (AGGREGATE_MEMBERSHIP), enrollment entry_day_index=1, clock at day 1, scheduled into two 50-minute sections in periods 1 and 2."
            - "Day 1: present in period-1 section, absent_unexcused in period-2 section."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Roll School", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", minimum_daily_minutes: 240 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 1 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-R1", first_name: "Ro", last_name: "Roll", grade_level: "6", birth_date: "2014-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 50 }
              as: Registrar
              captures: { sec1: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 2, meeting_minutes: 50 }
              as: Registrar
              captures: { sec2: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec1}" }
              as: Registrar
              captures: { sa1: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec2}" }
              as: Registrar
              captures: { sa2: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa1}", day_index: 1, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa2}", day_index: 1, code: "ABSENT_UNEXCUSED" }
              as: Teacher
          trigger:
            - call: "GET /enrollments/${enr}/daily-attendance"
              payload: { day_index: 1 }
              as: Registrar
              captures: { code: "$.data[0].daily_code", mins: "$.data[0].present_minutes_total" }
          assert:
            - "DailyAttendance[enrollment=${enr},day=1].present_minutes_total == 50"
            - "DailyAttendance[enrollment=${enr},day=1].daily_code == PARTIAL"
            - "DailyAttendance[enrollment=${enr},day=1].ada_eligible == true"

      - name: ada_round_then_sum_order_pinned
        grounds:
          - calculations.ada_funding_total
          - entities.AdaFundingReport.fields.total_ada
          - entities.Enrollment.fields.fte
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: with two enrollments fte=0.5 each over
          span 3/180, per-enrollment ADA rounds to 0.0083 (3/180*0.5=0.008333) FIRST, then sums to
          0.0166 — whereas sum-then-round (0.016666) would round to 0.0167. The scaffold pins
          round-per-enrollment-then-sum, so total_ada must equal 0.0166.
        test_recipe:
          setup:
            - "One school (AGGREGATE_MEMBERSHIP, session 180), clock at day 3, with two half-day (fte=0.5) enrollments entry_day_index=1, each scheduled+present days 1-3 in a 240-min section."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Round School", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", session_total_days: 180 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 3 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-H1", first_name: "Hal", last_name: "Half", grade_level: "K", birth_date: "2019-01-01" }
              as: Registrar
              captures: { stu1: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-H2", first_name: "Hana", last_name: "Half", grade_level: "K", birth_date: "2019-02-01" }
              as: Registrar
              captures: { stu2: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu1}", entry_day_index: 1, fte: 0.5 }
              as: Registrar
              captures: { enr1: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu2}", entry_day_index: 1, fte: 0.5 }
              as: Registrar
              captures: { enr2: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "KIND", title: "Kindergarten", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 240 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr1}", section_id: "${sec}" }
              as: Registrar
              captures: { sa1: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr2}", section_id: "${sec}" }
              as: Registrar
              captures: { sa2: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa1}", day_index: 1, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa1}", day_index: 2, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa1}", day_index: 3, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa2}", day_index: 1, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa2}", day_index: 2, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa2}", day_index: 3, code: "PRESENT" }
              as: Teacher
          trigger:
            - call: "POST /ada-funding-reports"
              payload: { school_id: "${sch}", as_of_day_index: 3 }
              as: Registrar
              captures: { rep: $.data.id, total: $.data.total_ada }
          assert:
            - "AdaFundingReport.${rep}.total_ada == 0.0166"
            - "AdaFundingReport.${rep}.funded_enrollment_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: incident_branch_referred_to_dismissed_vs_adjudicated
        grounds:
          - state_machines.DisciplineIncident.REFERRED_to_DISMISSED
          - state_machines.DisciplineIncident.UNDER_REVIEW_to_ADJUDICATED
          - state_machines.DisciplineIncident.REFERRED_to_UNDER_REVIEW
        distinguishing_aspect: |
          DisciplineIncident is a fork-with-revert: from REFERRED it can branch to DISMISSED
          (terminal, no consequence) or proceed REFERRED->UNDER_REVIEW->ADJUDICATED with a
          consequence — divergent side-effect sets per branch on the DisciplineIncident entity.
        test_recipe:
          setup:
            - "One school, an enrolled student, one incident REFERRED by teacher-1, then taken UNDER_REVIEW by admin-1."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Disc School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-X1", first_name: "Xan", last_name: "Disc", grade_level: "8", birth_date: "2011-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /discipline-incidents"
              payload: { enrollment_id: "${enr}", category: "DISRUPTION", severity: 2, incident_day_index: 1 }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { inc: $.data.id }
            - call: "POST /discipline-incidents/${inc}/begin-review"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /discipline-incidents/${inc}/dismiss"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
          assert:
            - "DisciplineIncident.${inc}.status == DISMISSED"
            - "DisciplineIncident.${inc} cannot subsequently transition to ADJUDICATED (DISMISSED is terminal)"

      - name: report_card_cycle_draft_finalize_reopen_finalize
        grounds:
          - state_machines.ReportCard.DRAFT_to_FINALIZED
          - state_machines.ReportCard.FINALIZED_to_REOPENED
          - entities.ReportCard.fields.status
        distinguishing_aspect: |
          ReportCard is a cyclic machine DRAFT->FINALIZED->REOPENED->FINALIZED on a different
          entity than the incident branch: the loop back to FINALIZED proves the machine is not
          a linear pipeline, and the second finalize recomputes line_items after a grade change.
        test_recipe:
          setup:
            - "One enrolled student with one STANDARDS section graded mastery_level=4; report card finalized once, then reopened by admin, the grade lowered to mastery_level=2, then finalized again."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cycle School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-C1", first_name: "Cy", last_name: "Cycle", grade_level: "10", birth_date: "2009-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "BIO10", title: "Biology", grading_mode: "STANDARDS", credit_value: 1.0 }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${sa}", standard_code: "BIO.1", mastery_level: 4, weight: 1.0 }
              as: Teacher
            - call: "POST /report-cards"
              payload: { enrollment_id: "${enr}", term_label: "Q1" }
              as: Teacher
              captures: { rc: $.data.id, v0: $.data.version }
            - call: "POST /report-cards/${rc}/finalize"
              payload: { expected_report_card_version: "${v0}" }
              as: Teacher
            - call: "POST /report-cards/${rc}/reopen"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${sa}", standard_code: "BIO.1", mastery_level: 2, weight: 1.0 }
              as: Teacher
            - call: "GET /report-cards/${rc}"
              payload: {}
              as: Teacher
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /report-cards/${rc}/finalize"
              payload: { expected_report_card_version: "${v2}" }
              as: Teacher
              captures: { gpa: $.data.overall_gpa }
          assert:
            - "ReportCard.${rc}.status == FINALIZED"
            - "ReportCard.${rc}.overall_gpa == 1.0"
            - "ReportCard.${rc}.line_items[section_id=${sec}].mastery_or_percent == 2.0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: oss_suspension_cascade_depth3_present_days
        grounds:
          - state_machines.DisciplineConsequence.ACTIVE_to_ACTIVE
          - calculations.daily_attendance_rollup
          - calculations.enrollment_present_days
          - entities.AttendanceRecord.fields.source
        distinguishing_aspect: |
          Depth-3 cascade triggered by consequence-create: attach OSS -> writes SYSTEM_SUSPENSION
          AttendanceRecords on days 3-4 (link1) -> those records flip each day's DailyAttendance to
          ABSENT (link2, caused by link1) -> enrollment.present_days drops from 5 to 3 (link3, caused
          by link2). Each link is caused by the previous, not by the original action.
        test_recipe:
          setup:
            - "AGGREGATE_MEMBERSHIP school, clock at day 5, enrolled student in a 240-min period-1 section, PRESENT days 1-5 (present_days=5). Incident UNDER_REVIEW by admin-1."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Susp School", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", minimum_daily_minutes: 240 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 5 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-S1", first_name: "Sue", last_name: "Susp", grade_level: "7", birth_date: "2013-01-01" }
              as: Registrar
