      - name: waitlist_queue_promotes_the_oldest_row_not_the_richest
        claim_type: chronological
        grounds:
          - calculations.waitlist_promotion_selector
          - state_machines.Booking[WAITLISTED -> OPTION]
          - endpoints[POST /sailings/{id}/ops-run]
        distinguishing_aspect: |
          created_at ASC is the FIRST ordering key and net_ticket_cents DESC only breaks ties, so
          the cheapest waitlisted booking wins when it was created first - a selector that sorted
          by revenue would promote the wrong row. The promotion also re-stamps deposit_due_date
          from the promotion instant while deliberately NOT repricing the fare pinned at
          creation, and it promotes exactly one row because only one cabin was freed.
        test_recipe:
          setup:
