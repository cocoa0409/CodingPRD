          setup:
            - "An AUTOMOTIVE_SAFETY program with committed_pieces 500000, minimum_order_quantity 25000, required_ppk 1.33, quoted at 26000 pieces (unit 24 cents), PPAP APPROVED so the design is PRODUCTION_RELEASED."
