          assert:
            - "ReimbursementClaim.${claim_id}.free_count == 1"
            - "ReimbursementClaim.${claim_id}.reduced_count == 1"
            - "ReimbursementClaim.${claim_id}.paid_count == 1"
            - "ReimbursementClaim.${claim_id}.estimated_reimbursement_cents == 889"

      - name: alacarte_per_line_round_then_sum
        grounds:
          - calculations.alacarte_total
          - entities.SchoolSite.fields.sales_tax_bps
          - entities.MealTransaction.fields.alacarte_total_cents
        distinguishing_aspect: "Mode (b): nested rounding order is pinned — tax rounded PER LINE then summed: two lines each base 100 at 725 bps give round(7.25)=7 per line -> 200+7+7=214, whereas sum-then-round would give 200+round(14.5)=215."
        test_recipe:
          setup:
            - "Site with sales_tax_bps=725; a compliant APPROVED lunch menu and a PREPARED production; one PAID student funded; a compliant snack food item for a-la-carte."
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Tax", site_code: "TAX-1", sales_tax_bps: 725, negative_balance_allowed: true }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
