          setup:
            - "ACTIVE bank; Unit N with 1 ACTIVE employee; census cycle A CONFIGURED then OPEN; second cycle B CONFIGURED with a disjoint window"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Overlap Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { ov_bank: $.data.id }
