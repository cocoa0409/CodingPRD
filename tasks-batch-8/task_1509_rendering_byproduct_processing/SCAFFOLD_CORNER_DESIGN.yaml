            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 20, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
