            - "Plan OK: STRAIGHT_SALARY base_salary_cents 36000000, status SUBMITTED, benchmark_percentile exactly 90.00."
            - "Logical clock advanced to 2027-08-02T00:00:00Z, one day past the opinion's expiry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
