# §1.9 Scaffold Corner Design (Claim-Extraction Walk)
# Domain: cancer-program-accreditation-tumor-registry (api_prefix /cancer-registry)
# Every section below is one row-group of references/claim-extraction-guide.md walked against
# §1.1-§1.7 of SCAFFOLD.yaml. Instance names are globally unique across this file and
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already carried by a §1.8 instance appear here as
# `excluded_because` stubs that name that instance instead of duplicating its recipe.
# Fixtures assume an EMPTY database and the mandatory startup clock 2026-08-01T00:00:00Z.
# Canonical fixture dates used throughout: diagnosis_date 2026-07-01, first_contact_date
# 2026-07-05 (referral lag 4 days, CLASS_10, analytic), abstract_due_date 2027-01-01
# (first_contact + 180), days_to_due 153 at the default clock, so a fresh case is ON_TIME.
scaffold_corner_design:

  # =========================================================================
  # Guide section 1 - From Table 1 (Entities)  [13 entities, topology: flat]
  # =========================================================================
  - section: entities
    instances:

      - name: program_creation_returns_accreditation_defaults_and_zeroed_counters
        claim_type: Creation
        grounds:
          - entities.CancerProgram
          - endpoints[POST /cancer-registry/programs]
          - calculations.conference_compliance
        distinguishing_aspect: |
          The 201 body must already carry every derived CancerProgram field at its documented
          zero state, including required_sessions_12mo == 12 for a caseload of 300 (below
          CONFERENCE_CASELOAD_THRESHOLD 500), not a null or absent key.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 and data.id is a UUID string"
            - "data.accreditation_state == ACCREDITED and data.registry_posture == OPEN"
            - "data.survey_date == null and data.survey_year == null and data.next_survey_due_year == null"
            - "data.identified_case_count == 0 and data.open_backlog_count == 0 and data.overdue_backlog_count == 0"
            - "data.follow_up_rate_coc_pct == 100.0 and data.follow_up_rate_state_pct == 100.0 and data.lost_to_follow_up_pct == 0.0"
            - "data.credited_sessions_12mo == 0 and data.required_sessions_12mo == 12"
            - "data.conference_frequency_compliant == false and data.coordinator_attendance_compliant == false"
            - "data.open_critical_deficiency_count == 0 and data.version == 1"

      - name: abstractor_retrieval_returns_stored_record
        claim_type: Retrieval
        grounds:
          - entities.Abstractor
          - endpoints[GET /cancer-registry/abstractors/{abstractorId}]
        distinguishing_aspect: |
          GET by id echoes the four input fields byte-for-byte and reports the documented
          derived baseline (quality_score_rolling_90d 100.0, productivity_status BELOW),
          proving the read path is not recomputing a fresh default row.
        test_recipe:
          setup:
            - "One program and one CTR abstractor."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
          trigger:
            - call: "GET /cancer-registry/abstractors/${abs_a_id}"
              payload: {}
              as: RegistryManager
          assert:
            - "HTTP 200 and data.id == ${abs_a_id}"
            - "data.program_id == ${prog_id} and data.name == 'Dana Reyes'"
            - "data.credential == CTR and data.productivity_target_cases_per_day == 2"
            - "data.certification_expires_on == 2027-12-31 and data.employment_status == ACTIVE"
            - "data.assigned_open_case_count == 0 and data.lifetime_discrepancy_points == 0 and data.audit_fail_streak == 0"
            - "data.quality_score_rolling_90d == 100.0 and data.quality_score_cumulative == 100.0"
            - "data.completed_cases_30d == 0 and data.productivity_rate_per_day == 0.0 and data.productivity_status == BELOW"

      - name: case_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /cancer-registry/cases]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three identified cases read through limit=2 must report total_count 3 with has_more
          true on the first page and has_more false with exactly one row on offset=2 - the
          count is the unpaginated total, not the page length.
        test_recipe:
          setup:
            - "One program, one PATHOLOGY source, three entries decided REPORTABLE (three IDENTIFIED cases)."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_1_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_1_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_1_id: $.data.created_case_id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0002", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_2_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_2_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_2_id: $.data.created_case_id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0003", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_3_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_3_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_3_id: $.data.created_case_id }
          trigger:
            - call: "GET /cancer-registry/cases?program_id=${prog_id}&limit=2&offset=0"
              payload: {}
              as: RegistryManager
            - call: "GET /cancer-registry/cases?program_id=${prog_id}&limit=2&offset=2"
              payload: {}
              as: RegistryManager
          assert:
            - "first response: HTTP 200, response_type == array, len(data) == 2, meta/pagination total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second response: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "the union of the two pages contains exactly {${case_1_id}, ${case_2_id}, ${case_3_id}} with no duplicates"
            - "every returned row has case_state == IDENTIFIED and submission_state == NOT_SUBMITTED"

      - name: case_detail_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /cancer-registry/cases/{caseId}]
          - errors[ERR_CASE_NOT_FOUND]
          - validations[priority 10 path existence]
        distinguishing_aspect: |
          A syntactically valid but unknown case UUID yields ERR_CASE_NOT_FOUND (404), not an
          empty 200 body and not the generic ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database (no cases at all)."
          setup_api_calls: []
          trigger:
            - call: "GET /cancer-registry/cases/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_CASE_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: abstractor_create_missing_credential_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.Abstractor.fields.credential
          - endpoints[POST /cancer-registry/abstractors]
          - validations[priority 3 request shape]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          credential has source input with no default, so omitting it must fail at priority 3
          with ERR_INVALID_REQUEST (400) rather than defaulting to NON_CTR.
        test_recipe:
          setup:
            - "One program exists."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /cancer-registry/abstractors?program_id=${prog_id} returns total_count == 0 (no partial row was written)"

      - name: program_create_omitting_timeliness_standard_days_applies_default_180
        claim_type: Defaults
        grounds:
          - entities.CancerProgram.fields.timeliness_standard_days
          - endpoints[POST /cancer-registry/programs]
          - calculations.abstract_timeliness
        distinguishing_aspect: |
          The default is observable twice: the created program reports 180, and a case created
          from a 2026-07-05 first contact inherits abstract_due_date 2027-01-01 from it.
        test_recipe:
          setup:
            - "Empty database; timeliness_standard_days is omitted from the create payload."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Harborview Cancer Program", coc_program_id: "COC-2201H", annual_analytic_caseload: 300, reference_year: 2018 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
          assert:
            - "GET /cancer-registry/programs/${prog_id} reports timeliness_standard_days == 180"
            - "GET /cancer-registry/cases/${case_id} reports abstract_due_date == 2027-01-01"
            - "that case reports days_to_due == 153 and timeliness_status == ON_TIME"

      - name: entry_computed_referral_lag_days_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.CasefindingEntry.fields.referral_lag_days
          - calculations.class_of_case_determination
          - endpoints[POST /cancer-registry/casefinding-sources/{sourceId}/entries]
        distinguishing_aspect: |
          referral_lag_days is source computed even though the create endpoint accepts the key:
          a posted 999 must be discarded and recomputed as first_contact_date - diagnosis_date
          == 4, and the class/analytic derivation must use 4 rather than the posted value.
        test_recipe:
          setup:
            - "One program and one PATHOLOGY source; the entry posts referral_lag_days 999 alongside real dates 4 days apart."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0007", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: false, first_treatment_at_facility: true, referral_lag_days: 999 }
              as: RegistryManager
              captures: { entry_id: $.data.id }
          assert:
            - "HTTP 201 and data.referral_lag_days == 4 (not 999)"
            - "data.class_of_case_code == CLASS_20 because 4 <= REFERRAL_ANALYTIC_MAX_DAYS 120"
            - "data.analytic_flag == true"
            - "data.program_id == ${prog_id} (copied from the source, not posted)"
            - "GET /cancer-registry/casefinding-entries/${entry_id} still reports referral_lag_days == 4"

      - name: submission_system_state_fields_generated_and_client_state_input_ignored
        claim_type: System Fields
        grounds:
          - entities.RegistrySubmission.fields.submission_state
          - entities.RegistrySubmission.fields.transmitted_at
          - entities.RegistrySubmission.fields.total_case_count
          - endpoints[POST /cancer-registry/submissions]
        distinguishing_aspect: |
          id, created_at, version, submission_state, transmitted_at and total_case_count are
          system/computed: a payload that tries to seed submission_state TRANSMITTED and
          total_case_count 99 must still produce DRAFT / null / 0 with version 1.
        test_recipe:
          setup:
            - "One program; the submission payload carries forged system fields."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-06-30", deadline_date: "2026-12-31", submission_state: "TRANSMITTED", total_case_count: 99, transmitted_at: "2020-01-01T00:00:00Z", version: 47 }
              as: RegistryManager
              captures: { sub_id: $.data.id }
          assert:
            - "HTTP 201 and data.submission_state == DRAFT"
            - "data.total_case_count == 0 and data.transmitted_at == null and data.version == 1"
            - "data.pre_hold_state == null, data.accepted_item_count == 0, data.failed_item_count == 0"
            - "data.edit_error_codes == [] and data.resubmission_round == 0 and data.assessment_due_cents == 0"
            - "data.created_at and data.updated_at are server-generated ISO-8601 strings, not 2020-01-01T00:00:00Z"

      - name: abstractor_create_with_invalid_credential_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Abstractor.fields.credential
          - validations[priority 3 request shape]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          credential is constrained to CTR | NON_CTR | TRAINEE, so a plausible-looking
          'REGISTERED' value is a 400 at priority 3 - before any program or role check.
        test_recipe:
          setup:
            - "One program exists."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "REGISTERED", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /cancer-registry/abstractors?program_id=${prog_id} reports total_count == 0"

      - name: conference_session_with_end_at_not_after_start_at_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ConferenceSession.fields.end_at
          - endpoints[POST /cancer-registry/conference-sessions]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          end_at must be strictly greater than start_at, so an equal pair (a zero-length
          session) is rejected with 400 and never reaches the §1.3 conference_slot_overlap
          buffer check that would otherwise report ERR_CONFERENCE_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "One program with no sessions."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-07-15T13:00:00Z", end_at: "2026-07-15T13:00:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "RADIATION_ONCOLOGY"] }
              as: AccreditationCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST (not ERR_CONFERENCE_SLOT_CONFLICT)"
            - "GET /cancer-registry/conference-sessions?program_id=${prog_id} reports total_count == 0"

      - name: follow_up_contact_is_immutable_event_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.FollowUpContact
          - endpoints[POST /cancer-registry/cases/{caseId}/follow-up-contacts]
          - endpoints[GET /cancer-registry/follow-up-contacts]
        distinguishing_aspect: |
          FollowUpContact declares common_fields false and entity_kind event: §1.5 exposes only
          a create and a list endpoint for it, the create body carries no version key, and the
          only way to change the follow-up picture is to append a second contact - after which
          the case keeps the LATER contact_date because the side effect is max(existing, posted).
        test_recipe:
          setup:
            - "One program, an author abstractor and a QA reviewer; one case COMPLETED through QA approval with last_contact_date 2026-07-20."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/cases/${case_id}/follow-up-contacts"
              payload: { contact_date: "2026-07-20", contact_method: "CLINIC_VISIT", outcome: "CONTACT_MADE", vital_status_at_contact: "ALIVE" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { fu1_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/cases/${case_id}/follow-up-contacts"
              payload: { contact_date: "2026-07-28", contact_method: "PHONE", outcome: "NO_RESPONSE", vital_status_at_contact: "UNKNOWN" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { fu2_id: $.data.id }
          assert:
            - "both create responses are HTTP 201 and neither body contains a version key"
            - "the second contact reports counts_for_follow_up == false (outcome NO_RESPONSE) while ${fu1_id} reports counts_for_follow_up == true"
            - "GET /cancer-registry/follow-up-contacts?case_id=${case_id} reports total_count == 2 and the 2026-07-20 row is unchanged (contact_method still CLINIC_VISIT, outcome still CONTACT_MADE)"
            - "TumorCase.${case_id}.last_contact_date == 2026-07-28 (max of existing and posted) and vital_status == UNKNOWN"
            - "§1.5 declares no PATCH/PUT/DELETE for follow-up contacts - the append above is the only mutation path"

      - name: entry_create_under_unknown_source_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CasefindingEntry.parent
          - endpoints[POST /cancer-registry/casefinding-sources/{sourceId}/entries]
          - errors[ERR_SOURCE_NOT_FOUND]
          - validations[priority 10 path existence]
        distinguishing_aspect: |
          The path parent is resolved at priority 10, before the body is validated, so an
          unknown {sourceId} with an otherwise perfect entry body returns ERR_SOURCE_NOT_FOUND
          (404) rather than 400.
        test_recipe:
          setup:
            - "One program exists but no casefinding source."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/casefinding-sources/00000000-0000-4000-8000-0000000000ff/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_SOURCE_NOT_FOUND"
            - "GET /cancer-registry/casefinding-entries?program_id=${prog_id} reports total_count == 0"

      - name: abstractor_create_with_unknown_program_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Abstractor.fields.program_id
          - validations[priority 15 body FK existence]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The flat topology carries parents in the BODY, so program_id is checked at priority 15
          (body FK) and an unknown value returns ERR_PROGRAM_NOT_FOUND (404) - the same class of
          failure as a bad path id but reached through a different validation band.
        test_recipe:
          setup:
            - "Empty database (no programs at all)."
          setup_api_calls: []
          trigger:
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "00000000-0000-4000-8000-0000000000aa", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "GET /cancer-registry/abstractors reports total_count == 0"

      - name: program_with_duplicate_coc_program_id_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CancerProgram.fields.coc_program_id
          - validations[priority 61 coc_program_id uniqueness]
          - errors[ERR_DUPLICATE_COC_PROGRAM_ID]
