        grounds: ["validations[priority=6]", "validations[priority=10]", "endpoints[POST /bikes/{id}/usage-logs]"]
        distinguishing_aspect: "Category pair (state vs business_fiscal): a usage logged against a TRIAGED bike (never routed to refurb) with a zero-stock part fails BOTH the bike-state precondition and the stock check; priority 6 state wins over priority 10 fiscal, so the error is ERR_INVALID_STATE, not ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup:
            - "Donor + bike TRIAGED grade A (not routed); Part with quantity_on_hand 0 (version 1); APPRENTICE volunteer logger (skill/suspension gates pass so only state vs fiscal compete)"
          setup_api_calls:
