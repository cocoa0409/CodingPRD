          - entities.Application.fields.cure_count
          - endpoints[POST /plan/applications/{id}/resubmission].side_effects
        distinguishing_aspect: |
          Each individual cure return is legal; it is the accumulated count that trips the rule, and the
          counter lives on the resubmission rather than on the return. After two completed rounds the
          application is a perfectly ordinary SUBMITTED row - so the third return is refused on the
          aggregate alone. Every resubmission also invalidates the MVR, which is why the cure loop
          cannot be used to smuggle a stale driving record past certification.
