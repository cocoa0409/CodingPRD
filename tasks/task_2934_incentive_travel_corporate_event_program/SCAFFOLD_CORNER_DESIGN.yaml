- section: state_machines
  instances:
  - name: every_new_row_starts_in_its_declared_initial_state
    claim_type: initial_state
    grounds:
    - §1.2 initial_state for Program, Destination (both dimensions), SupplierContract, DepositMilestone,
      Qualifier (both dimensions), Registration (both dimensions), OnsiteActivity, ActivitySignup, TaxAwardReport
    distinguishing_aspect: |-
      Every one of the twelve declared state dimensions must open on its declared initial value at creation — Program DESIGN, Destination CANDIDATE / NOT_INSPECTED, SupplierContract DRAFT, DepositMilestone SCHEDULED, Qualifier PENDING_REVIEW / NOT_APPLICABLE, Registration INVITED / NOT_REQUESTED, OnsiteActivity OPEN, ActivitySignup BOOKED-or-WAITLISTED by capacity, TaxAwardReport DRAFT — with no row ever created directly into a later state.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - A program in SOURCING with Lisbon SHORTLISTED, a DRAFT contract and one SCHEDULED milestone, created
        without invoking any transition endpoint.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
