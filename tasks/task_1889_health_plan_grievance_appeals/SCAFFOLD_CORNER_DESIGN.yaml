scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: member_creation_required_fields_and_defaults
        claim_type: creation
        grounds: [entities.Member]
        distinguishing_aspect: "POST /appeals/members with all required fields returns 201; enrollment_status defaults to ACTIVE and computed counters default to 0; system fields (id, created_at, version=1) are server-generated."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EN1", full_name: "Lena Moth", program: "MEDI_CAL" }
              as: PlatformAdmin
              captures: { m_en1: $.data.id }
          trigger:
            - call: "GET /appeals/members/${m_en1}"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.enrollment_status, oc: $.data.open_case_count }
          assert:
            - "Member.enrollment_status == ACTIVE (default applied)"
            - "Member.open_case_count == 0 and ctm_linked_case_count == 0"
            - "version == 1 and id is a bare UUID without type prefix"

      - name: member_missing_required_field_returns_validation_error
        claim_type: required_fields
        grounds: [entities.Member.fields.member_ref, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required member_ref yields ERR_VALIDATION (400); each input-sourced field without a default is required at creation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /appeals/members"
              payload: { full_name: "No Ref", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: member_invalid_program_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Member.fields.program, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "program outside {MEDICARE, MEDI_CAL, DUAL} is rejected at intake."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EN3", full_name: "Bad Enum", program: "TRICARE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: provider_npi_format_constraint
        claim_type: type_constraints
        grounds: [entities.Provider.fields.npi, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "npi must be exactly 10 digits; a 9-digit value is rejected."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /appeals/providers"
              payload: { npi: "123456789", legal_name: "Short NPI", contract_status: "CONTRACTED" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: member_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /appeals/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: case_event_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.CaseEvent]
        distinguishing_aspect: "CaseEvent has common_fields: false — response carries id and created_at but no version or updated_at; no PATCH/PUT endpoint exists for events."
        test_recipe:
          setup: ["Member + GRIEVANCE case in RECEIVED"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EN6", full_name: "Mo Na", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_en6: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_en6}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_en6: $.data.id }
          trigger:
            - call: "POST /appeals/cases/${c_en6}/events"
              payload: { event_type: "NOTE", body: "hello" }
              as: IntakeSpecialist
              captures: { ev: $.data }
          assert:
            - "Response data contains id, created_at, occurred_at, actor_role, actor_id, event_type, body"
            - "Response data has no version key and no updated_at key"

      - name: fk_reference_to_missing_member_rejected
        claim_type: parent_relationships
        grounds: [entities.GrievanceAppealCase.fields.member_id, "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "Case intake with a nonexistent member_id yields ERR_REFERENCE_NOT_FOUND (422) — body FK checked after path existence."
        test_recipe:
          setup: ["Empty DB except clock set"]
          setup_api_calls:
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /appeals/cases"
              payload: { member_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND and http status 422"

      - name: system_fields_in_input_ignored
        claim_type: system_fields
        grounds: [entities.Member]
        distinguishing_aspect: "Client-supplied id/created_at/version in a create payload are ignored; server mints its own."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EN8", full_name: "Sys Fields", program: "DUAL", id: "11111111-2222-3333-4444-555555555555", version: 99 }
              as: PlatformAdmin
              captures: { rid: $.data.id, rver: $.data.version }
          assert:
            - "Response id != 11111111-2222-3333-4444-555555555555 (server-minted)"
            - "Response version == 1"

      - name: case_computed_overdue_input_ignored
        claim_type: computed_fields
        grounds: [entities.GrievanceAppealCase.fields.overdue]
        distinguishing_aspect: "The overdue field is computed from resolution_due_at vs clock; client-supplied overdue in the intake payload is ignored."
        test_recipe:
          setup: ["Member exists"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EN9", full_name: "Ov Due", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_en9: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_en9}", case_kind: "GRIEVANCE", overdue: true }
              as: IntakeSpecialist
              captures: { od: $.data.overdue }
          assert:
            - "Response overdue == false (computed; input ignored — a RECEIVED case before triage has null resolution_due_at and is never overdue)"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: case_initial_state_received
        claim_type: initial_state
        grounds: [state_machines.GrievanceAppealCase]
        distinguishing_aspect: "A newly intaken case starts in RECEIVED with decision_outcome null and received_at stamped."
        test_recipe:
          setup: ["Member exists"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-SM1", full_name: "Ini State", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_sm1: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_sm1}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { st: $.data.status, do: $.data.decision_outcome }
          assert:
            - "status == RECEIVED"
            - "decision_outcome is null and received_at == 2026-08-01T00:00:00Z"

      - name: triage_from_in_review_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.GrievanceAppealCase.RECEIVED_to_TRIAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "triage is declared only from RECEIVED; calling it from IN_REVIEW is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["GRIEVANCE case advanced to IN_REVIEW"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-SM2", full_name: "Inv Tr", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_sm2: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_sm2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_sm2: $.data.id }
            - call: "POST /appeals/cases/${c_sm2}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_sm2}/begin-review"
              payload: {}
              as: CaseAnalyst
          trigger:
            - call: "POST /appeals/cases/${c_sm2}/triage"
              payload: {}
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: terminal_case_lockdown_close_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.GrievanceAppealCase, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Mutations on a CLOSED case (e.g. expedite) are rejected with ERR_ALREADY_TERMINAL; reopening creation is the only permitted operation."
        test_recipe:
          setup: ["Fully closed GRIEVANCE case"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-SM3", full_name: "Term Lock", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_sm3: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_sm3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_sm3: $.data.id }
            - call: "POST /appeals/cases/${c_sm3}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_sm3}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_sm3}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_sm3}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_sm3: $.data.id }
            - call: "POST /appeals/notifications/${n_sm3}/mark-sent"
              payload: {}
              as: MemberServicesRep
            - call: "POST /appeals/cases/${c_sm3}/close"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /appeals/cases/${c_sm3}/expedite"
              payload: {}
              as: MedicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"

      - name: withdraw_idempotency_second_attempt_fails
        claim_type: idempotency
        grounds: [state_machines.GrievanceAppealCase.RECEIVED_to_WITHDRAWN]
        distinguishing_aspect: "The same withdraw trigger applied twice: first succeeds, second fails with ERR_ALREADY_TERMINAL (terminal-state lockdown on WITHDRAWN)."
        test_recipe:
          setup: ["RECEIVED GRIEVANCE case"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-SM4", full_name: "Idem Pot", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_sm4: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_sm4}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_sm4: $.data.id }
          trigger:
            - call: "POST /appeals/cases/${c_sm4}/withdraw"
              payload: {}
              as: MemberServicesRep
            - call: "POST /appeals/cases/${c_sm4}/withdraw"
              payload: {}
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "Second withdraw: error_id == ERR_ALREADY_TERMINAL"
            - "Member.open_case_count == 0 (decremented exactly once)"

      - name: decide_side_effect_creates_effectuation_only_when_favorable
        claim_type: side_effect_execution
        grounds: [state_machines.GrievanceAppealCase.IN_REVIEW_to_DECIDED]
        distinguishing_aspect: "UNFAVORABLE grievance decisions create no Effectuation; FULLY_FAVORABLE ones create exactly one PENDING Effectuation with effectuation_due_at set."
        test_recipe:
          setup: ["Two GRIEVANCE cases in IN_REVIEW"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-SM5", full_name: "Side Eff", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_sm5: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_sm5}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_sm5a: $.data.id }
            - call: "POST /appeals/cases/${c_sm5a}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_sm5a}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_sm5}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_sm5b: $.data.id }
            - call: "POST /appeals/cases/${c_sm5b}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_sm5b}/begin-review"
              payload: {}
              as: CaseAnalyst
          trigger:
            - call: "POST /appeals/cases/${c_sm5a}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_sm5b}/decide"
              payload: { decision_outcome: "FULLY_FAVORABLE", payment_amount_cents: 0 }
              as: CaseAnalyst
            - call: "GET /appeals/cases/${c_sm5a}/effectuations"
              payload: {}
              as: ComplianceOfficer
              captures: { effs_a: $.data }
            - call: "GET /appeals/cases/${c_sm5b}/effectuations"
              payload: {}
              as: ComplianceOfficer
              captures: { effs_b: $.data }
          assert:
            - "UNFAVORABLE case has 0 effectuations and effectuation_due_at == null"
            - "FULLY_FAVORABLE case has exactly 1 effectuation with status == PENDING and case.effectuation_due_at == decided_at + 72h"

      - name: notification_mark_sent_requires_complete
        claim_type: precondition_enforcement
        grounds: [state_machines.Notification.QUEUED_to_SENT, "errors[ERR_NOTIFICATION_INCOMPLETE]"]
        distinguishing_aspect: "mark-sent on a notification with completeness_score < 1.00 is rejected; after PATCH supplies the missing element, mark-sent succeeds."
        test_recipe:
          setup: ["DECIDED GRIEVANCE case; DECISION notification missing one element"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-SM6", full_name: "Pre Cond", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_sm6: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_sm6}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_sm6: $.data.id }
            - call: "POST /appeals/cases/${c_sm6}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_sm6}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_sm6}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_sm6}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information"] }
              as: MemberServicesRep
              captures: { n_sm6: $.data.id }
          trigger:
            - call: "POST /appeals/notifications/${n_sm6}/mark-sent"
              payload: {}
              as: MemberServicesRep
              captures: { err: $.data.error_id }
            - call: "PATCH /appeals/notifications/${n_sm6}"
              payload: { supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
            - call: "POST /appeals/notifications/${n_sm6}/mark-sent"
              payload: {}
              as: MemberServicesRep
              captures: { st: $.data.status }
          assert:
            - "First mark-sent: error_id == ERR_NOTIFICATION_INCOMPLETE"
            - "After PATCH: status == SENT"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: medical_necessity_weighted_sum_known_inputs
        claim_type: correct_result
        grounds: [calculations.medical_necessity_scoring]
        distinguishing_aspect: "Weighted scoring with pinned sum-then-round: inputs (8,6,9,4,5) yield exactly 70.00; max inputs (10,10,10,10,10) yield 100.00."
        test_recipe:
          setup: ["APPEAL case in PENDING_CLINICAL with ASSIGNED review"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CA1", full_name: "Calc One", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ca1: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "1020304050", legal_name: "Calc Clinic", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_ca1: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ca1}", provider_id: "${p_ca1}", case_kind: "APPEAL" }
              as: IntakeSpecialist
              captures: { c_ca1: $.data.id }
            - call: "POST /appeals/cases/${c_ca1}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_ca1}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ca1}/clinical-reviews"
              payload: {}
              as: CaseAnalyst
              captures: { cr_ca1: $.data.id }
            - call: "POST /appeals/clinical-reviews/${cr_ca1}/assign"
              payload: { reviewer_physician_id: "md-801" }
              as: MedicalDirector
              as_user_id: "md-admin"
          trigger:
            - call: "POST /appeals/clinical-reviews/${cr_ca1}/draft-determination"
              payload: { severity: 8, acuity: 6, guideline_match: 9, comorbidity: 4, functional_impairment: 5 }
              as: MedicalDirector
              as_user_id: "md-801"
              captures: { score: $.data.medical_necessity_score }
          assert:
            - "medical_necessity_score == 70.00 (0.35*8 + 0.25*6 + 0.20*9 + 0.10*4 + 0.10*5 = 7.0, x10, round_half_up to 2dp, sum-then-round order)"

      - name: medical_necessity_physician_override_clamps
        claim_type: variant_selection
        grounds: [calculations.medical_necessity_scoring]
        distinguishing_aspect: "The physician_override variant stores the override (rounded half-up to 2dp) instead of the weighted result; override 88.555 -> 88.56."
        test_recipe:
          setup: ["APPEAL case in PENDING_CLINICAL with ASSIGNED review"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CA2", full_name: "Calc Two", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ca2: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "1122334455", legal_name: "Override Clinic", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_ca2: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ca2}", provider_id: "${p_ca2}", case_kind: "APPEAL" }
              as: IntakeSpecialist
              captures: { c_ca2: $.data.id }
            - call: "POST /appeals/cases/${c_ca2}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_ca2}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ca2}/clinical-reviews"
              payload: {}
              as: CaseAnalyst
              captures: { cr_ca2: $.data.id }
