  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: grant_funds_conservation
        grounds:
          - entities.Grant.fields.federal_obligated
          - entities.Grant.fields.federal_drawn
          - entities.Grant.fields.federal_available
          - calculations.closeout_final_settlement
        distinguishing_aspect: |
          Conserved quantity: the grant's federal cash pool — INVARIANT
          federal_obligated == federal_drawn + federal_available must hold after drawdown approval
          (forward), after amendment approval (obligation increase), and after closeout
          de-obligation (compensating action); no drift is tolerated at any checkpoint.
        test_recipe:
          setup:
            - "ACTIVE grant (obligated 900,000.00); one APPROVED drawdown of 81,000.00; one PENDING amendment adding 100,000 scope (federal_delta 200,000.00)"
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
