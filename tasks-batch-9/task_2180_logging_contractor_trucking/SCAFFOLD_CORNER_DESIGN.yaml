      - name: mobilize_with_unknown_tract_id_returns_tract_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRACT_NOT_FOUND]
          - validations[priority=40]
        distinguishing_aspect: |
          Every declared error must be triggerable. Existence is resolved at priority 40,
          left to right through the path and then through the body foreign keys in their
          declared input order, so this unknown id must surface ERR_TRACT_NOT_FOUND and nothing else.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
          trigger:
            - call: "POST /tracts/00000000-0000-4000-8000-000000000000/mobilize"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { err_id: $.data.error_id }
