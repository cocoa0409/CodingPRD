            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "MUST_CARRY", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 0 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
          trigger:
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "PATCH /retrans/elections/${el_id}"
              payload: { requested_tier: "BROADCAST_BASIC" }
              as: StationGroupNegotiator
