              as: StudioOwner
              as_user_id: "${studio_ok_id}"
              captures: { rai4_id: $.data.id }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_ok_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CO" }
              as: Client
              captures: { maya_ok_id: $.data.id }
          trigger:
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_ok_id}", class_template_id: "${tpl_ok4_id}", instructor_staff_id: "${rai4_id}", room_code: "ROOM-A", start_at: "2026-06-25T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_ok_v}" }
