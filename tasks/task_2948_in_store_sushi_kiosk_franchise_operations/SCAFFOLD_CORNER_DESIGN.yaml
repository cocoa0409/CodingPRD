          The space credit is conditional on the attestation: 205 attested sqft against a 220 obligation gives space_shortfall_sqft 15 and a credit of min(15 x 1250, 25 percent of 296000) = 18750, dropping net_due to 277250, whereas an attestation of 240 gives credit 0 and net_due 296000.
        test_recipe:
          setup:
