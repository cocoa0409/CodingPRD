    description: "Get a claim line"
    roles: [SupplierUser, PayerReviewer]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []
  - method: GET
    path: "/claim-lines"
    description: "List claim lines; filter by order_id, rental_cycle_id, audit_id (FK reverse-reachability for all three ClaimLine FKs)"
    roles: [SupplierUser, PayerReviewer]
    code: 200
    input: ["order_id?", "rental_cycle_id?", "audit_id?", "line_type?", "status?", "limit?", "offset?"]
    output: ClaimLine[]
