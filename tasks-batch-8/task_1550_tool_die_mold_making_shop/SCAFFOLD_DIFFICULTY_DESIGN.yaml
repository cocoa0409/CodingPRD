  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: firm_quote_issue_gated_by_design_release
        grounds:
          - state_machines.Quote.DRAFT_to_ISSUED
          - validations[priority=11]
          - errors[ERR_DESIGN_NOT_RELEASED]
        distinguishing_aspect: |
          Entity pair Quote -> ToolDesign: issuing a FIRM quote requires the
          DESIGN's status (a different entity) to be RELEASED — FIRM on a
          SUBMITTED design fails ERR_DESIGN_NOT_RELEASED while a BUDGETARY quote
          on the same SUBMITTED design issues fine (conditional gate by
          quote_kind). BUDGETARY issue also pins the 14-day validity:
          issued_at 2026-08-01T00:00:00Z -> valid_until 2026-08-15T00:00:00Z.
        test_recipe:
          setup:
            - "Customer C ACTIVE; design D (PN-1002, CLASS_103, 4 cavities, complexity 10) in SUBMITTED (never reviewed)"
            - "Quote Q_F FIRM and quote Q_B BUDGETARY created against D"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Gate Co", contact_email: "gt@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-1002", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q_f: $.data.id}
            - call: "GET /tool-designs/${d1}"
              as: Any
              captures: {d1_ver2: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "BUDGETARY", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver2}"}
              as: Estimator
              captures: {q_b: $.data.id}
          trigger:
            - call: "POST /quotes/${q_f}/issue"
              as: Estimator
              captures: {err1: $.data.error_id}
