scaffold_corner_design:
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_species_success
        claim_type: creation
        grounds: [entities.Species]
        distinguishing_aspect: "POST /species with all required care-sheet fields returns 201 and echoes the stored fields including care_feeder_type."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /species"
              payload: { common_name: "Ball Python", scientific_name: "Python regius", is_regulated: false, permit_class: "NONE", min_quarantine_days: 7, warranty_days: 30, care_temp_low_c: 27, care_temp_high_c: 31, care_humidity_low_pct: 50, care_humidity_high_pct: 60, feed_interval_days: 7, care_feeder_type: "MOUSE_ADULT" }
              as: StoreManager
              captures: { sp_id: $.data.id, ver: $.data.version }
          assert:
            - "Species.${sp_id}.care_feeder_type == MOUSE_ADULT"
            - "Species.${sp_id}.version == 1"

      - name: species_create_missing_required_returns_validation
        claim_type: required_fields
        grounds: [entities.Species.fields.warranty_days, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required warranty_days on POST /species returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /species"
              payload: { common_name: "X", scientific_name: "Y", min_quarantine_days: 7, care_temp_low_c: 20, care_temp_high_c: 30, care_humidity_low_pct: 40, care_humidity_high_pct: 60, feed_interval_days: 7, care_feeder_type: "CRICKET" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: animal_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Animal, "errors[ERR_ANIMAL_NOT_FOUND]"]
        distinguishing_aspect: "GET /animals/{unknown-uuid} returns ERR_ANIMAL_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /animals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ANIMAL_NOT_FOUND"

      - name: care_sheet_computed_read
        claim_type: computed_fields
        grounds: [entities.Species, endpoints]
        distinguishing_aspect: "GET /species/{id}/care-sheet returns the derived husbandry view with the stored care_feeder_type and humidity band."
        test_recipe:
          setup: ["One Species with care_feeder_type DUBIA."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Bearded Dragon", scientific_name: "Pogona vitticeps", is_regulated: false, permit_class: "NONE", min_quarantine_days: 5, warranty_days: 14, care_temp_low_c: 24, care_temp_high_c: 40, care_humidity_low_pct: 20, care_humidity_high_pct: 40, feed_interval_days: 1, care_feeder_type: "DUBIA" }
              as: StoreManager
              captures: { sp_id: $.data.id }
          trigger:
            - call: "GET /species/${sp_id}/care-sheet"
              payload: {}
              as: SalesAssociate
              captures: { ft: $.data.care_feeder_type }
          assert:
            - "response.data.care_feeder_type == DUBIA"
            - "response.data.care_humidity_high_pct == 40"

      - name: animal_defaults_applied
        claim_type: defaults
        grounds: [entities.Animal.fields.sex, entities.Animal.fields.status]
        distinguishing_aspect: "Creating an Animal without sex defaults sex to UNKNOWN and status to INTAKE."
        test_recipe:
          setup: ["One Species."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Corn Snake", scientific_name: "Pantherophis guttatus", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 24, care_temp_high_c: 30, care_humidity_low_pct: 40, care_humidity_high_pct: 60, feed_interval_days: 7, care_feeder_type: "MOUSE_ADULT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Amel", acquisition_cost_cents: 5000, list_price_cents: 15000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
          assert:
            - "Animal.${an_id}.sex == UNKNOWN"
            - "Animal.${an_id}.status == INTAKE"

  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: start_quarantine_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Animal.INTAKE_to_QUARANTINE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /animals/{id}/start-quarantine on an animal already in QUARANTINE returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Animal in QUARANTINE (one start-quarantine done)."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Kingsnake", scientific_name: "Lampropeltis getula", is_regulated: false, permit_class: "NONE", min_quarantine_days: 3, warranty_days: 30, care_temp_low_c: 24, care_temp_high_c: 30, care_humidity_low_pct: 40, care_humidity_high_pct: 60, feed_interval_days: 7, care_feeder_type: "MOUSE_ADULT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Cal", acquisition_cost_cents: 3000, list_price_cents: 12000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
          trigger:
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: clear_before_required_until_returns_quarantine_not_complete
        claim_type: precondition_enforcement
        grounds: ["validations[priority=44]", "errors[ERR_QUARANTINE_NOT_COMPLETE]"]
        distinguishing_aspect: "Clearing at 2026-07-14 (one day before required_until 2026-07-15) with 2 PASS checks returns ERR_QUARANTINE_NOT_COMPLETE — the strict-below side of the inclusive >= boundary tested in §1.8."
        test_recipe:
          setup: ["Species min_quarantine_days=14; Animal in QUARANTINE (required_until 2026-07-15) with 2 PASS checks; clock at 2026-07-14."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Skink", scientific_name: "Tiliqua scincoides", is_regulated: false, permit_class: "NONE", min_quarantine_days: 14, warranty_days: 30, care_temp_low_c: 24, care_temp_high_c: 32, care_humidity_low_pct: 40, care_humidity_high_pct: 60, feed_interval_days: 3, care_feeder_type: "DUBIA" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "N", acquisition_cost_cents: 6000, list_price_cents: 15000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-14T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_QUARANTINE_NOT_COMPLETE"
            - "Animal.${an_id}.status == QUARANTINE"

      - name: clear_with_one_pass_check_returns_quarantine_not_complete
        claim_type: precondition_enforcement
        grounds: ["validations[priority=44]", calculations.quarantine_required_until]
        distinguishing_aspect: "With min_quarantine_days=0 (required_until reached) but only ONE PASS check (< MIN_PASS_CHECKS 2), clearance returns ERR_QUARANTINE_NOT_COMPLETE."
        test_recipe:
          setup: ["Species min_quarantine_days=0; Animal in QUARANTINE with only 1 PASS check."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Gecko", scientific_name: "Eublepharis macularius", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 22, care_temp_high_c: 32, care_humidity_low_pct: 30, care_humidity_high_pct: 40, feed_interval_days: 2, care_feeder_type: "CRICKET" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "T", acquisition_cost_cents: 5000, list_price_cents: 18000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
          trigger:
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_QUARANTINE_NOT_COMPLETE"

      - name: permit_revoke_cascade_voids_confirmed_sale
        claim_type: cross_entity_cascade
        grounds: [state_machines.Permit.VERIFIED_to_REVOKED, state_machines.Sale.DRAFT_to_CONFIRMED, state_machines.Animal.RESERVED_to_AVAILABLE]
        distinguishing_aspect: "Revoking a VERIFIED permit voids the CONFIRMED regulated Sale citing it and releases the Animal RESERVED->AVAILABLE."
        test_recipe:
          setup: ["Regulated CLASS_II species; Animal AVAILABLE; VERIFIED CLASS_II permit; Sale CONFIRMED citing permit (Animal RESERVED)."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Boa", scientific_name: "Boa constrictor", is_regulated: true, permit_class: "CLASS_II", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 26, care_temp_high_c: 32, care_humidity_low_pct: 50, care_humidity_high_pct: 70, feed_interval_days: 10, care_feeder_type: "RAT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Motley", acquisition_cost_cents: 9000, list_price_cents: 30000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "Ro Vane", email: "ro@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/permits"
              payload: { permit_number: "BC-1", permit_class: "CLASS_II", issued_date: "2026-06-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: SalesAssociate
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/verify"
              payload: {}
              as: StoreManager
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}", permit_id: "${permit_id}" }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /permits/${permit_id}/revoke"
              payload: {}
              as: StoreManager
          assert:
            - "Permit.${permit_id}.status == REVOKED"
            - "Sale.${sale_id}.status == VOIDED"
            - "Animal.${an_id}.status == AVAILABLE"

      - name: expo_cancel_cascades_assignment_cancel
        claim_type: cross_entity_cascade
        grounds: [state_machines.Expo.SCHEDULED_to_CANCELLED, state_machines.ExpoAssignment.ASSIGNED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED expo transitions every ASSIGNED ExpoAssignment to CANCELLED."
        test_recipe:
          setup: ["Animal AVAILABLE; SCHEDULED expo with the animal ASSIGNED."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Crested Gecko", scientific_name: "Correlophus ciliatus", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 14, care_temp_low_c: 20, care_temp_high_c: 27, care_humidity_low_pct: 60, care_humidity_high_pct: 80, feed_interval_days: 2, care_feeder_type: "CRICKET" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "H", acquisition_cost_cents: 2000, list_price_cents: 9000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /expos"
              payload: { name: "Reptile Expo", venue: "Center", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z", venue_capacity: 5 }
              as: StoreManager
              captures: { ex_id: $.data.id }
            - call: "POST /expos/${ex_id}/assignments"
              payload: { animal_id: "${an_id}" }
              as: SalesAssociate
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /expos/${ex_id}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "Expo.${ex_id}.status == CANCELLED"
            - "ExpoAssignment.${asg_id}.status == CANCELLED"

      - name: resolve_before_approve_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WarrantyClaim.APPROVED_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a WarrantyClaim still in SUBMITTED (not APPROVED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["FULFILLED Sale with a SUBMITTED DOA WarrantyClaim (not yet approved)."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Hognose", scientific_name: "Heterodon nasicus", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 24, care_temp_high_c: 30, care_humidity_low_pct: 30, care_humidity_high_pct: 50, feed_interval_days: 5, care_feeder_type: "MOUSE_PINKY" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "A", acquisition_cost_cents: 3000, list_price_cents: 18000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "Su Blythe", email: "su@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_id}/warranty-claims"
              payload: { claim_type: "DOA", reason: "x" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${wc_id}/resolve"
              payload: { resolution: "REFUND" }
              as: StoreManager
              as_user_id: "mgr-approve"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: fulfill_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Sale.CONFIRMED_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Fulfilling a Sale still in DRAFT (never confirmed) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT Sale (animal exists, never confirmed)."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Milk Snake", scientific_name: "Lampropeltis triangulum", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 24, care_temp_high_c: 30, care_humidity_low_pct: 40, care_humidity_high_pct: 60, feed_interval_days: 7, care_feeder_type: "MOUSE_ADULT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Pueblan", acquisition_cost_cents: 3000, list_price_cents: 10000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ty Rune", email: "ty@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: confirm_regulated_without_permit_returns_permit_required
        claim_type: violation_to_error
        grounds: ["validations[priority=55]", "errors[ERR_PERMIT_REQUIRED]"]
        distinguishing_aspect: "Confirming a regulated-species sale for an AVAILABLE animal with no permit_id returns ERR_PERMIT_REQUIRED (422)."
        test_recipe:
          setup: ["Regulated CLASS_I species; Animal AVAILABLE; Sale drafted without permit_id."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Tegu", scientific_name: "Salvator merianae", is_regulated: true, permit_class: "CLASS_I", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 26, care_temp_high_c: 35, care_humidity_low_pct: 60, care_humidity_high_pct: 80, feed_interval_days: 3, care_feeder_type: "RAT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "BW", acquisition_cost_cents: 12000, list_price_cents: 40000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "Vi Cole", email: "vi@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PERMIT_REQUIRED"

      - name: confirm_with_unverified_permit_returns_permit_not_verified
        claim_type: violation_to_error
        grounds: ["validations[priority=55]", "errors[ERR_PERMIT_NOT_VERIFIED]"]
        distinguishing_aspect: "Confirming a regulated sale citing a PENDING_VERIFICATION permit returns ERR_PERMIT_NOT_VERIFIED (422)."
        test_recipe:
          setup: ["Regulated CLASS_I species; Animal AVAILABLE; Customer permit created but NOT verified; Sale cites it."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Monitor", scientific_name: "Varanus", is_regulated: true, permit_class: "CLASS_I", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 28, care_temp_high_c: 40, care_humidity_low_pct: 50, care_humidity_high_pct: 70, feed_interval_days: 4, care_feeder_type: "RAT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Ackie", acquisition_cost_cents: 15000, list_price_cents: 45000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
