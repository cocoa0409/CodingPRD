  - rule_id: compensating_invariant
    instances:

      - name: reissue_conserves_reservation_arcade_credit_total
        grounds:
          - state_machines.Wristband.transitions.ACTIVE_to_ISSUED
          - calculations.arcade_credit_accrual
          - entities.Wristband.fields.arcade_credit_limit_cents
        distinguishing_aspect: |
          The conserved quantity is arcade credit ceiling: for any Reservation, the sum of
          arcade_credit_limit_cents over its non-REISSUED wristbands always equals
          credited_arcade_cents, so a re-issue moves the ceiling to the successor rather
          than minting a second one.
        test_recipe:
          setup:
            - "Resort with arcade_credit_rate_cents_per_unit 9450, a checked-in Reservation for 2 guests and one active guest band"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Bloomington", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 9450 }
              as: platform_ops
              captures: { r20_id: "$.data.id" }
            - call: "POST /resorts/${r20_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rt20_id: "$.data.id" }
            - call: "GET /resorts/${r20_id}"
              payload: {}
              as: platform_ops
              captures: { r20_v: "$.data.version" }
            - call: "POST /resorts/${r20_id}/reservations"
