              captures: { r5: $.data.error_id }
            - call: "POST /print-jobs/${job}/inspect"
              payload: { sample_size: 500, defect_count: 6 }
              as: PrintVendorRep
              as_user_id: "${vend}"
              captures: { r6: $.data.error_id }
            - call: "POST /print-jobs/${job}/deliver"
              payload: { lots: [{ lot_code: "L-001", quantity_shipped: 12500, seal_number: "SEAL-1001" }] }
              as: WarehouseCustodian
              captures: { r7: $.data.error_id }
            - call: "POST /print-jobs/${job}/inspect"
              payload: { sample_size: 500, defect_count: 6 }
              as: WarehouseCustodian
              captures: { ok_status: $.data.status, ok_rate: $.data.defect_rate_bp }
          assert:
            - "All seven rejected calls answer HTTP 403 with ${r1} .. ${r7} each == \"ERR_UNAUTHORIZED\"."
            - "${r1}: lock-styles is ElectionsDirector-exclusive. The election is already STYLES_LOCKED, so an authorized caller would have received ERR_ELECTION_PHASE_INVALID (409) - priority 20 beats priority 70, so the coordinator sees 403 instead."
            - "${r2} and ${r4}: creating a ballot style and placing a print order are BallotCoordinator-exclusive and the ElectionsDirector cannot borrow them - there is no hierarchical override in this role model."
            - "${r3}: only the LanguageAccessCoordinator may attest translation and format coverage, which is why that attestation is a meaningful precondition for proofing."
            - "${r5}: registering equipment is VotingSystemTechnician-exclusive even though the custodian is the role that later seals and deploys it."
            - "${r6} and ${r7}: inspect belongs to the WarehouseCustodian and deliver to the PrintVendorRep, so the two parties to the same shipment cannot perform each other's step."
            - "The final call is byte-identical to call 6 except for the role and returns HTTP 200 with ${ok_status} == \"QC_PASSED\" and ${ok_rate} == 120 - proof that every 403 above was about the caller, not about the job."
            - "No side effect leaked from the rejected calls: the election is still STYLES_LOCKED with exactly one BallotStyle, one PrintJob and zero TabulatorUnit rows."

