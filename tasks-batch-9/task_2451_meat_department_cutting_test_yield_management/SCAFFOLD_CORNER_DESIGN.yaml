              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 62.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 18.5, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 3, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "APPROVE" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "GET /meat-ops/retail-items/${ri1_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_v: $.data.version, ri1_prov: $.data.provisional_price_per_lb_cents }
          trigger:
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-activations"
              payload: { expected_retail_item_version: "${ri1_v}", cutting_test_id: "${t1_id}" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { act_status: $.data.price_status, act_final: $.data.final_price_per_lb_cents, act_active: $.data.active_price_per_lb_cents }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-activations"
              payload: { expected_retail_item_version: "${ri1_v}", cutting_test_id: "${t1_id}" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_stale_item: $.data.error_id }
            - call: "GET /meat-ops/retail-items/${ri1_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_v2: $.data.version, ri1_active2: $.data.active_price_per_lb_cents }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-activations"
              payload: { expected_retail_item_version: "${ri1_v2}", cutting_test_id: "${t1_id}" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { re_status: $.data.price_status, re_active: $.data.active_price_per_lb_cents, re_variance: $.data.price_variance_pct }
          assert:
            - "${ri1_prov} == 2149 before activation and ${act_status} == PRICED with ${act_final} == 1989 and ${act_active} == 1989"
            - "${err_stale_item} == ERR_STALE_PARENT_VERSION with HTTP 412 — the version captured before the first activation is no longer current"
            - "${ri1_v2} == ${ri1_v} plus 1 and ${ri1_active2} == 1989 — the refused activation changed nothing"
            - "${re_status} == PRICED with ${re_active} == 1989 and ${re_variance} == -0.0745 — the re-activation on the fresh version is accepted and idempotent in value"

      - name: case_plan_roll_ups_reconcile_after_every_line_event
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CasePlan.fields.total_expected_movement_lb
          - entities.CasePlan.fields.total_required_fill_lb
          - entities.CasePlan.fields.total_actual_fill_lb
          - endpoints[POST /meat-ops/case-plans/{id}/lines]
