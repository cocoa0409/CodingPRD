  - rule_id: priority_pair_validation_conflict
    instances:
      - name: case_state_error_beats_active_stay
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_INVALID_CASE_STATE]
          - errors[ERR_ACTIVE_STAY]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: one request violates
          both (case still REFERRED AND an ACTIVE litigation stay exists);
          priority 7 state must win over priority 19 safety, so the response
          is ERR_INVALID_CASE_STATE, not ERR_ACTIVE_STAY.
        test_recipe:
          setup:
            - "Case LN-V1 in REFERRED with an ACTIVE LITIGATION_HOLD stay filed (hold_status == LITIGATION_HOLD); clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Iota", reference_code: "BEN-V1", contact_email: "iota@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-V1", borrower_name: "Borrower V", property_address: "11 Priority Pkwy", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/stay-orders", payload: { stay_type: "LITIGATION_HOLD", court_case_number: "CV-26-0001", filed_at: "2026-07-31T08:00:00Z" }, as: CaseManager }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-08-01", instrument_number: "NOTS-V1" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_CASE_STATE (state priority 7 beats business_safety priority 19)"
            - "no NoticeOfTrusteeSale created: GET /api/foreclosure-cases/${case_id}/notices-of-trustee-sale total_count == 0"

      - name: quote_expired_beats_payment_shortfall
        grounds:
          - validations[priority=29]
          - validations[priority=31]
          - errors[ERR_QUOTE_EXPIRED]
          - errors[ERR_PAYMENT_SHORTFALL]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_fiscal: accept a
          quote whose good_through_date has passed AND whose tendered amount is
          wrong; priority 29 temporal must win over priority 31 fiscal, so the
          response is ERR_QUOTE_EXPIRED, not ERR_PAYMENT_SHORTFALL.
        test_recipe:
          setup:
            - "Case LN-V2 (REFERRED) with a PAYOFF quote good_through 2026-08-10; clock then advanced to 2026-08-11"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Kappa", reference_code: "BEN-V2", contact_email: "kappa@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-V2", borrower_name: "Borrower W", property_address: "12 Priority Pkwy", county_code: "CC01", unpaid_principal_balance_cents: 10000000, monthly_payment_cents: 100000, months_in_arrears: 1, late_fee_per_month_cents: 5000, note_rate_pct: 4.5, last_interest_paid_date: "2026-07-20", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { case_id: $.data.id, case_v: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${case_id}/quotes", payload: { quote_type: "PAYOFF", good_through_date: "2026-08-10", expected_foreclosure_case_version: "${case_v}" }, as: CaseManager, captures: { q_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: TrusteeAdmin }
          trigger:
            - { call: "POST /api/quotes/${q_id}/accept", payload: { tendered_amount_cents: 1 }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_QUOTE_EXPIRED (business_temporal priority 29 beats business_fiscal priority 31)"
            - "Quote.${q_id} remains unaccepted (status reads EXPIRED via lazy derivation)"

  - rule_id: boundary_precision_check
    instances:
      - name: nots_day90_boundary_allowed_day89_rejected
        grounds:
          - validations[priority=21]
          - calculations.reinstatement_window_dates
          - errors[ERR_NOTS_TOO_EARLY]
        distinguishing_aspect: |
          Metric: statutory day count on the NOTS-record endpoint. Clock date
          exactly NOD+90 (2026-10-30) is allowed (>=), one day earlier
          (2026-10-29) is rejected ERR_NOTS_TOO_EARLY — an exact >= vs >
          boundary, distinct metric and endpoint from the postponement count.
        test_recipe:
          setup:
            - "Case LN-B1 with NOD recorded 2026-08-01 (deadline 2026-10-30)"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Lambda", reference_code: "BEN-B1", contact_email: "lambda@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-B1", borrower_name: "Borrower B", property_address: "13 Boundary Blvd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-B1" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-29T00:00:00Z" }, as: TrusteeAdmin }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-29", instrument_number: "NOTS-EARLY" }, as: CaseManager, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-B1" }, as: CaseManager, captures: { nots_id: $.data.id } }
          assert:
            - "${err} == ERR_NOTS_TOO_EARLY (day 89 rejected)"
            - "day-90 retry succeeds: NoticeOfTrusteeSale.${nots_id} created with status RECORDED"
            - "ForeclosureCase.${case_id}.lifecycle_status == NOTS_RECORDED after the boundary-day success"

      - name: postponement_third_allowed_fourth_rejected
        grounds:
          - validations[priority=27]
          - state_machines.AuctionSale.SCHEDULED_to_SCHEDULED
          - errors[ERR_POSTPONEMENT_LIMIT]
        distinguishing_aspect: |
          Metric: integer count of postponements on the postponements endpoint.
          The 3rd postponement (count 2 -> 3) is allowed; the 4th (count == 3)
          is rejected ERR_POSTPONEMENT_LIMIT — a count boundary on a different
          endpoint than the NOTS day-count boundary.
        test_recipe:
          setup:
