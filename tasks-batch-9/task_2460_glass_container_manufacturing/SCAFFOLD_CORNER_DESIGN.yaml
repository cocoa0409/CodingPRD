              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
              as: BatchHouseTech
            - call: "POST /glass-plant/customers"
              payload: { name: "Alpha Filling", account_code: "CUST-E12", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-E12", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
