              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2025-01-01T00:00:00Z", term_end_utc: "2026-12-31T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { ag_v1: $.data.version }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/renewal-offers"
              payload: { proposed_by_role: "NETWORK_AFFILIATE_RELATIONS", proposed_reverse_comp_pct: 0.45, proposed_retrans_share_pct: 0.55, proposed_term_months: 24, expected_agreement_version: "${ag_v1}" }
              as: NetworkAffiliateRelations
              captures: { offer1: $.data.id, ag_v2: $.data.version }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/renewal-offers"
              payload: { proposed_by_role: "STATION_GROUP_OWNER", proposed_reverse_comp_pct: 0.35, proposed_retrans_share_pct: 0.65, proposed_term_months: 36, expected_agreement_version: "${ag_v2}" }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { offer2: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/renewal-offers/${offer2}/accept"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { offer2_status: $.data.status }
            - call: "GET /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/renewal-offers/${offer1}"
              payload: {}
