      - name: invoice_tier_boundary_at_300000_flips_waiver_and_discount
        claim_type: tiered_pricing
        grounds:
          - calculations.installation_invoice_total
          - state_machines.SetJob.SET_COMPLETE_to_CLOSED
          - entities.SetJob.fields.crossover_fee_cents
        distinguishing_aspect: |
          Two otherwise identical single-wide jobs differing by one cent of labour
          straddle TIER_3_MIN_CENTS: labour 240000 gives a tier basis of exactly
          300000, so the inclusive lower bound selects 3 percent, the 60000
          crossover line is waived and the invoice is 240000 - 9000 = 231000;
          labour 239999 gives 299999, no tier, the crossover line is billed and the
