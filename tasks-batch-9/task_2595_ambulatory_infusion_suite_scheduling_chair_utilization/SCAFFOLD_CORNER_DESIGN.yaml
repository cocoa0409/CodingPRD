      - name: a_chair_patch_is_refused_only_when_the_resulting_row_would_be_out_of_service_and_urgent_reserved
        claim_type: conditional_action
        grounds:
          - endpoints[PATCH /chairs/{id}]
          - endpoints[POST /chairs]
          - validations[priority 49]
          - errors[ERR_CHAIR_OUT_OF_SERVICE]
        distinguishing_aspect: |
          The guard is on the POST-WRITE combination, not on either field alone, so the same
          PATCH body is legal or illegal depending on the row's other field: setting
          OUT_OF_SERVICE is refused while reserved_for_urgent is true and accepted one call
          later once the flag is cleared, and re-flagging the now-out-of-service chair is
          refused in turn. Both orders of the same two-field write must therefore be
          rejected in a single request, and the center's counters must not move on a refusal.
        test_recipe:
          setup:
            - "One center with urgent_reserve_chair_count 1 and one chair R1 created with reserved_for_urgent true and status AVAILABLE."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "R1", chair_type: "BARIATRIC", status: "AVAILABLE", reserved_for_urgent: true }
              as: Scheduler
              captures: { ch_r1: $.data.id, r1_version: $.data.version }
          trigger:
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "R2", chair_type: "STANDARD", status: "OUT_OF_SERVICE", reserved_for_urgent: true }
              as: Scheduler
              captures: { err_create_combo: $.data.error_id }
            - call: "PATCH /chairs/${ch_r1}"
              payload: { status: "OUT_OF_SERVICE" }
              as: Scheduler
              captures: { err_patch_status: $.data.error_id }
            - call: "PATCH /chairs/${ch_r1}"
              payload: { reserved_for_urgent: false }
              as: Scheduler
              captures: { cleared_flag: $.data.reserved_for_urgent, cleared_version: $.data.version }
            - call: "PATCH /chairs/${ch_r1}"
              payload: { status: "OUT_OF_SERVICE" }
              as: Scheduler
              captures: { now_out: $.data.status }
            - call: "PATCH /chairs/${ch_r1}"
              payload: { reserved_for_urgent: true }
              as: Scheduler
              captures: { err_patch_flag: $.data.error_id }
          assert:
            - "${err_create_combo} == 'ERR_CHAIR_OUT_OF_SERVICE' with HTTP 409 — the same guard runs on creation"
            - "${err_patch_status} == 'ERR_CHAIR_OUT_OF_SERVICE' with HTTP 409, and Chair.${ch_r1}.version is still ${r1_version} — a refusal never bumps the version"
            - "${cleared_flag} == false and ${cleared_version} == 2"
            - "${now_out} == 'OUT_OF_SERVICE' — the identical PATCH body that failed two calls earlier now succeeds"
            - "${err_patch_flag} == 'ERR_CHAIR_OUT_OF_SERVICE' with HTTP 409 — the mirrored order is refused too"
            - "Chair.${ch_r1}.reserved_for_urgent == false and status == 'OUT_OF_SERVICE' at the end"
            - "InfusionCenter.${ctr}.available_chair_count == 0 and reserved_chair_count == 0 — the refused R2 was never created and R1's flag is cleared"
            - "GET /chairs filtered by center_id == ${ctr} returns exactly 1 row"

