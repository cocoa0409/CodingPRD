            - "response.data.declared_at_utc == 2026-08-01T00:00:00.000Z   # unchanged by the surge hop"
            - "response.data.version > ${ev_v}"
            - "CatastropheEvent.${ev}.open_claim_count == 1 and surge_adjuster_count == 0"
