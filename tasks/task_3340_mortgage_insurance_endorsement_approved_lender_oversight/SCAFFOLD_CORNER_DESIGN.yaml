            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: ServicerOfficer, as_user_id: "${len_id}" }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: FhaApprover, as_user_id: app-1 }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: ClaimsExaminer, as_user_id: cx-1 }
          assert:
            - "all six responses have status == 200"
            - "all six responses return the same Lender id ${len_id}"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_create_after_version_advance
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[filing-create-stale-lender]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "filing-create-stale-lender: a second filing create carrying the pre-advance lender version (1) after the first create bumped it to 2 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["one lender whose version advanced to 2 after a first filing was created; client still holds version 1"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "OCC Create Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v1: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}" }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 51000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 6000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}" }
          assert:
            - "response status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_fresh_version_succeeds
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[filing-create-stale-lender]", "endpoints[POST /mi/lenders/{lenderId}/financial-filings]"]
        distinguishing_aspect: "The matching positive control: re-reading the lender and sending the CURRENT version lets the second filing create succeed with 201."
        test_recipe:
          setup: ["one lender with one SUBMITTED filing (version 2)"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "OCC Fresh Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v1: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}" }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v2: $.data.version } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2024-12-31", total_assets_cents: 49000000000, total_liabilities_cents: 48000000000, liquid_assets_cents: 4000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_2: $.data.id } }
          assert:
            - "response status == 201"
            - "FinancialFiling.${fil_2}.status == SUBMITTED"
            - "Lender.${len_id}.version == 3"

      - name: suspension_cascade_blocks_cases_and_freezes_escrows
        claim_type: cascading_side_effects
        grounds: ["state_machines.Lender.APPROVED_to_SUSPENDED", "state_machines.LoanCase.UNDERWRITE_SUBMITTED_to_BLOCKED", "state_machines.RepairEscrow.OPEN_to_FROZEN"]
        distinguishing_aspect: "Cascade B end-to-end: SUSPEND moves the case UNDERWRITE_SUBMITTED -> BLOCKED (hop 1) and that case's OPEN escrow -> FROZEN with freeze_origin SUSPENSION (hop 2, caused by hop 1)."
        test_recipe:
          setup: ["one approved lender, one case in UNDERWRITE_SUBMITTED holding one OPEN escrow"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /mi/lenders", payload: { legal_name: "Cascade B Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "CB-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/repair-escrows", payload: { amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-06-30" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { esc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: SUSPEND }, as: FhaApprover, as_user_id: app-1 }
          assert:
            - "Lender.${len_id}.status == SUSPENDED"
            - "LoanCase.${lc_id}.status == BLOCKED"
            - "RepairEscrow.${esc_id}.status == FROZEN"
            - "RepairEscrow.${esc_id}.freeze_origin == SUSPENSION"

      - name: reinstate_reverses_suspension_cascade
        claim_type: cascading_side_effects
        grounds: ["state_machines.Lender.SUSPENDED_to_APPROVED", "state_machines.LoanCase.BLOCKED_to_UNDERWRITE_SUBMITTED", "state_machines.RepairEscrow.FROZEN_to_OPEN"]
        distinguishing_aspect: "REINSTATE reverses cascade B completely: case returns BLOCKED -> UNDERWRITE_SUBMITTED and the escrow FROZEN(SUSPENSION) -> OPEN with freeze_origin cleared — the compensation leaves no drift."
        test_recipe:
          setup: ["one suspended lender whose case and escrow were cascade-frozen"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /mi/lenders", payload: { legal_name: "Cascade Reverse Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "CR-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/repair-escrows", payload: { amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-06-30" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { esc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: SUSPEND }, as: FhaApprover, as_user_id: app-1 }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: REINSTATE }, as: FhaApprover, as_user_id: app-1 }
          assert:
            - "Lender.${len_id}.status == APPROVED"
            - "LoanCase.${lc_id}.status == UNDERWRITE_SUBMITTED"
            - "RepairEscrow.${esc_id}.status == OPEN"
            - "RepairEscrow.${esc_id}.freeze_origin == null"

      - name: derived_field_reconciliation_after_void
        claim_type: derived_field_reconciliation
        grounds: ["calculations.endorsed_volume", "entities.Lender.fields.endorsed_volume_cents"]
        distinguishing_aspect: "Lender.endorsed_volume_cents tracks the source rows: 0 before endorsement, 30000000 after endorsement, and exactly 0 again after void-endorsement (recompute on each mutation)."
        test_recipe:
          setup: ["one approved lender with one endorsed case (volume 30000000)"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Reconcile Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "REC-V", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-07-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /mi/appraisals/${ap_id}/decide", payload: { decision: ACCEPT }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/endorsement-review", payload: { decision: ENDORSE }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { vol_after_endorse: $.data.endorsed_volume_cents } }
            - { call: "POST /mi/loan-cases/${lc_id}/void-endorsement", payload: { reason: "erroneous endorsement" }, as: FhaApprover, as_user_id: app-1 }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin }
          assert:
            - "vol_after_endorse == 30000000"
            - "final GET: data.endorsed_volume_cents == 0"

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_cascade_visible_in_same_read
        claim_type: consistency_immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.Lender.APPROVED_to_SUSPENDED"]
        distinguishing_aspect: "consistency_model immediate: the SUSPEND response already reflects the cascaded child mutations — a read immediately after returns the case BLOCKED and the escrow FROZEN with no settling window."
        test_recipe:
          setup: ["one approved lender with an UNDERWRITE_SUBMITTED case holding an OPEN escrow"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /mi/lenders", payload: { legal_name: "Immediate Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "IMM-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/repair-escrows", payload: { amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-06-30" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { esc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: SUSPEND }, as: FhaApprover, as_user_id: app-1 }
            - { call: "GET /mi/loan-cases/${lc_id}", payload: {}, as: PlatformAdmin }
            - { call: "GET /mi/loan-cases/${lc_id}/repair-escrows", payload: {}, as: PlatformAdmin }
          assert:
            - "SUSPEND response data.status == SUSPENDED"
            - "immediate GET of case ${lc_id}: status == BLOCKED"
            - "immediate GET of escrows: RepairEscrow.${esc_id}.status == FROZEN"
