  # ---- codification submissions -------------------------------------
  - method: POST
    path: "/clerk/codification-submissions"
    description: "Files a client-origin codification submission into an OPEN cycle under OCC on the code title's version."
    roles: [CodificationEditor]
    code: 201
    input: [cycle_id, instrument_id, code_section_ref, action, expected_code_title_version]
    output: CodificationSubmission
    side_effects:
      - "submission.origin = CLIENT; cycle.submission_count += 1 and cycle.client_submission_count += 1"
      - "increments CodeTitle.version by 1"
      - "a PENDING submission of the SAME instrument and code_section_ref in the same cycle -> WITHDRAWN (supersede, net-zero counters)"
      - "a PENDING or IN_REVIEW submission of a DIFFERENT instrument on the same code_section_ref puts both rows in CONFLICT_HELD and increments cycle.conflict_count by 1"
      - "validation 60 rejects the fourth client-origin submission with ERR_CYCLE_SUBMISSION_CAPACITY; validation 90 rejects a section or title mismatch with ERR_CODE_SECTION_UNKNOWN"
