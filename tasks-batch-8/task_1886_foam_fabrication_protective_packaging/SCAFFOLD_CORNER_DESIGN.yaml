# =============================================================================
# Task 1886 — Foam Fabrication & Protective Packaging
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: ["entities.Customer.fields.branding_required", "entities.Customer.fields.credit_balance_cents"]
        distinguishing_aspect: "Omitting branding_required yields false; credit_balance_cents starts at 0; response carries server-minted id, created_at, updated_at, version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id, branding: $.data.branding_required, credit: $.data.credit_balance_cents, ver: $.data.version } }
          assert:
            - "Customer.${cust_id}.branding_required == false (default applied)"
            - "Customer.${cust_id}.credit_balance_cents == 0"
            - "Customer.${cust_id}.version == 1 and id is a server-minted UUID"

      - name: material_creation_and_retrieval_round_trip
        claim_type: creation
        grounds: ["entities.Material", "endpoints[POST /api/materials]", "endpoints[GET /api/materials/{id}]"]
        distinguishing_aspect: "POST with all required fields returns 201 and every stored field; GET by id returns the same values."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /api/materials", payload: { foam_family: "XLPE", density_pcf: 2.2, ild_lb_25: 90, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 3, cost_per_board_ft_cents: 310, recyclable: true, scrap_credit_per_lb_cents: 14 }, as: PlantManager, captures: { mat_id: $.data.id } }
          trigger:
            - { call: "GET /api/materials/${mat_id}", as: SalesEngineer, captures: { fam: $.data.foam_family, ild: $.data.ild_lb_25, cost: $.data.cost_per_board_ft_cents } }
          assert:
            - "GET returns foam_family == XLPE, ild_lb_25 == 90, cost_per_board_ft_cents == 310 (round trip)"

      - name: package_spec_computes_required_ild_at_band_boundaries
        claim_type: computed_fields
        grounds: ["calculations.cushion_ild_calc", "entities.PackageSpec.fields.required_ild_lb"]
        distinguishing_aspect: "required_ild_lb is server-computed: drop 23 -> LOW band (ceil(5*8)=40); drop exactly 24 -> MEDIUM (50); drop exactly 48 -> HIGH band (ceil(20*12)=240). Band lower edges are inclusive."
        test_recipe:
          setup: ["Customer + material exist"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 300, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
          trigger:
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "S23", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 23, max_fragility_g: 60 }, as: SalesEngineer, captures: { ild23: $.data.required_ild_lb } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "S24", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 24, max_fragility_g: 60 }, as: SalesEngineer, captures: { ild24: $.data.required_ild_lb } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "S48", part_length_in: 10, part_width_in: 8, product_weight_lb: 20, required_drop_height_in: 48, max_fragility_g: 60 }, as: SalesEngineer, captures: { ild48: $.data.required_ild_lb } }
          assert:
            - "drop 23 -> required_ild_lb == 40 (LOW band, factor 8)"
            - "drop 24 -> required_ild_lb == 50 (MEDIUM band, lower edge inclusive)"
            - "drop 48 -> required_ild_lb == 240 (HIGH band, lower edge inclusive)"

      - name: package_spec_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /api/package-specs/{id}]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/package-specs/00000000-0000-4000-8000-000000000000", as: SalesEngineer, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: package_spec_list_filters_by_customer_and_paginates
        claim_type: listing
        grounds: ["endpoints[GET /api/package-specs]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "Filtered list returns only the customer's specs with total_count; limit=1 yields has_more == true and exactly 1 row."
        test_recipe:
          setup: ["Two customers; two specs for customer A, one for customer B"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_a: $.data.id } }
            - { call: "POST /api/customers", payload: { name: "Beta Corp", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_b: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_a}", material_id: "${mat_id}", part_name: "A1", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_a}", material_id: "${mat_id}", part_name: "A2", part_length_in: 12, part_width_in: 9, product_weight_lb: 6, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_b}", material_id: "${mat_id}", part_name: "B1", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer }
          trigger:
            - { call: "GET /api/package-specs?customer_id=${cust_a}&limit=1&offset=0", as: SalesEngineer, captures: { first_part: "$.data[0].part_name" } }
          assert:
            - "Filtered list for customer A: total_count == 2, has_more == true with limit=1, exactly 1 row returned"
            - "Unfiltered-by-B check: no row in the A-filtered list belongs to customer B"

      - name: material_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Material", "response_envelope"]
        distinguishing_aspect: "Client-supplied id/version/created_at in a create payload are ignored; the server mints its own id and version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/materials", payload: { id: "11111111-1111-4111-8111-111111111111", version: 99, foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id, ver: $.data.version } }
          assert:
            - "Response id != 11111111-1111-4111-8111-111111111111 (server-minted)"
            - "Response version == 1 (client-supplied 99 ignored)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: spec_double_submit_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PackageSpec.DRAFT_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second submit on an already-SUBMITTED spec fails with ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["Spec in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
          trigger:
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer, captures: { err: $.data.error_id } }
          assert:
            - "Second submit -> ERR_INVALID_STATE; spec remains SUBMITTED"

      - name: spec_approve_before_validated_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PackageSpec.VALIDATED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve from IN_VALIDATION (not VALIDATED) is rejected with ERR_INVALID_STATE even when the acting customer owns the spec."
        test_recipe:
          setup: ["Spec IN_VALIDATION owned by the acting customer"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
          trigger:
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "Approve -> ERR_INVALID_STATE; spec remains IN_VALIDATION"

      - name: drop_test_record_pass_at_exact_limit
        claim_type: valid_transition
        grounds: ["state_machines.DropTest.SCHEDULED_to_RECORDED", "entities.DropTest.fields.result"]
        distinguishing_aspect: "measured_peak_g == pass_limit_g (60 == 60) yields PASS — the <= comparison is inclusive at the boundary."
        test_recipe:
          setup: ["Spec IN_VALIDATION; drop test scheduled (pass_limit_g pinned 60)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
          trigger:
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 60 }, as: QualityEngineer, captures: { res: $.data.result } }
            - { call: "GET /api/package-specs/${spec_id}", as: QualityEngineer, captures: { spec_status: $.data.status } }
          assert:
            - "DropTest.result == PASS at measured == limit (inclusive)"
            - "Spec auto-transitions to VALIDATED"

      - name: drop_test_fail_blocks_auto_validation
        claim_type: side_effect_execution
        grounds: ["state_machines.PackageSpec.IN_VALIDATION_to_VALIDATED", "state_machines.DropTest.SCHEDULED_to_RECORDED"]
        distinguishing_aspect: "A recorded FAIL prevents auto-validation even when a later test PASSes; the spec stays IN_VALIDATION until revision."
        test_recipe:
          setup: ["Spec IN_VALIDATION; DT1 recorded FAIL (75); DT2 scheduled and recorded PASS (55)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt1: $.data.id } }
            - { call: "POST /api/drop-tests/${dt1}/record", payload: { measured_peak_g: 75 }, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T10:30:00Z", scheduled_end: "2026-08-02T11:30:00Z", drop_height_in: 30, orientation: "EDGE" }, as: QualityEngineer, captures: { dt2: $.data.id } }
          trigger:
            - { call: "POST /api/drop-tests/${dt2}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer, captures: { res2: $.data.result } }
            - { call: "GET /api/package-specs/${spec_id}", as: QualityEngineer, captures: { spec_status: $.data.status } }
          assert:
            - "DT2 result == PASS"
            - "Spec.status remains IN_VALIDATION (a recorded FAIL exists, so auto-validate does not fire)"

      - name: tooling_retire_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Tooling", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From RETIRED no further transitions are possible: commission on a retired die fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["DIE cut program with tooling retired"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/retire", payload: {}, as: DesignEngineer, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer, captures: { err: $.data.error_id } }
          assert:
            - "Retire -> status == RETIRED"
            - "Commission after retire -> ERR_INVALID_STATE (terminal lockdown)"

      - name: release_deallocate_clears_price_and_returns_reservation
        claim_type: valid_transition
        grounds: ["state_machines.ReleaseOrder.ALLOCATED_to_PENDING", "entities.ReleaseOrder.fields.unit_price_cents"]
        distinguishing_aspect: "ALLOCATED -> PENDING via deallocate returns reserved stock and nulls unit_price_cents/total_price_cents; a later re-allocate reprices."
        test_recipe:
          setup: ["Program ACTIVE with on_hand 300; release qty 100 ALLOCATED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "CNC_ROUTE", machine_seconds_per_part: 40, expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", package_spec_id: "${spec_id}", pricing_mode: "CURRENT", max_stock_qty: 500, reorder_point_qty: 100, min_release_qty: 50 }, as: SalesEngineer, captures: { prog: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog}/activate", payload: {}, as: SalesEngineer }
            - { call: "POST /api/inventory-programs/${prog}/replenish", payload: { qty: 300 }, as: PlantManager, captures: { rpo: $.data.id } }
            - { call: "POST /api/production-orders/${rpo}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T09:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${rpo}/start", payload: {}, as: PlantManager }
            - { call: "POST /api/production-orders/${rpo}/complete", payload: {}, as: PlantManager }
            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog}", qty: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel: $.data.id } }
            - { call: "POST /api/release-orders/${rel}/allocate", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /api/release-orders/${rel}/deallocate", payload: {}, as: PlantManager, captures: { st: $.data.status, up: $.data.unit_price_cents, tp: $.data.total_price_cents } }
            - { call: "GET /api/inventory-programs/${prog}", as: PlantManager, captures: { reserved: $.data.reserved_qty } }
          assert:
            - "Deallocate -> status == PENDING, unit_price_cents == null, total_price_cents == null"
            - "Program.reserved_qty == 0 (reservation returned)"

      - name: program_close_blocked_with_open_release
        claim_type: precondition_enforcement
        grounds: ["state_machines.InventoryProgram", "errors[ERR_PROGRAM_HAS_OPEN_RELEASES]"]
        distinguishing_aspect: "Close on a program with a PENDING release fails with ERR_PROGRAM_HAS_OPEN_RELEASES; after the release is cancelled, close succeeds."
        test_recipe:
          setup: ["Program ACTIVE with one PENDING release"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
