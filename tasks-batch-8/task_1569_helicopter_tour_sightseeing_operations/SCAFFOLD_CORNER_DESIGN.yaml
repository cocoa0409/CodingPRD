        distinguishing_aspect: |
          RESUME re-evaluates the rolling quota at resume time: with the count
          still at the threshold of 3 the resume fails with
          ERR_ROUTE_QUOTA_STILL_EXCEEDED; after the clock advances 31 days so
          all three complaints age out of the window, the same RESUME succeeds.
        test_recipe:
          setup:
            - "Base defaults (threshold 3, window 30d); route RC zones [VILLAGE]; flight F dep 2026-08-03T14:00 COMPLETED 14:25"
            - "Three VILLAGE complaints observed 14:10 (auto-MATCHED to F), each REVIEW + SUBSTANTIATE -> count 3 -> route auto-SUSPENDED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RC", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: ["VILLAGE"], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { f_id: $.data.id }
            - { call: "POST /flights/${f_id}/events", payload: { event_type: "PILOT_ACK" }, as: Pilot, as_user_id: "${pilot_id}" }
            - { call: "POST /flights/${f_id}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher, as_user_id: "disp-1" }
            - call: "GET /flights/${f_id}"
              as: Dispatcher
              captures: { fv: $.data.version }
            - { call: "POST /flights/${f_id}/close-manifest", payload: { expected_flight_version: "${fv}" }, as: Dispatcher, as_user_id: "disp-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /flights/${f_id}/events", payload: { event_type: "DISPATCH" }, as: Dispatcher, as_user_id: "disp-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:25:00Z" }, as: OpsAdmin }
            - { call: "POST /flights/${f_id}/events", payload: { event_type: "COMPLETE" }, as: Dispatcher, as_user_id: "disp-2" }
            - call: "POST /complaints"
              payload: { base_id: "${base_id}", zone: "VILLAGE", observed_at: "2026-08-03T14:10:00Z", description: "n1", reporter_ref: "r1" }
              as: CommunityReporter
              captures: { c1: $.data.id, c1_match: $.data.match_status }
            - call: "POST /complaints"
              payload: { base_id: "${base_id}", zone: "VILLAGE", observed_at: "2026-08-03T14:10:00Z", description: "n2", reporter_ref: "r2" }
              as: CommunityReporter
              captures: { c2: $.data.id }
            - call: "POST /complaints"
              payload: { base_id: "${base_id}", zone: "VILLAGE", observed_at: "2026-08-03T14:10:00Z", description: "n3", reporter_ref: "r3" }
              as: CommunityReporter
              captures: { c3: $.data.id }
            - { call: "POST /complaints/${c1}/events", payload: { event_type: "REVIEW" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c2}/events", payload: { event_type: "REVIEW" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c3}/events", payload: { event_type: "REVIEW" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c1}/events", payload: { event_type: "SUBSTANTIATE" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c2}/events", payload: { event_type: "SUBSTANTIATE" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c3}/events", payload: { event_type: "SUBSTANTIATE" }, as: ComplianceOfficer }
            - call: "GET /routes/${route_id}"
              as: OpsAdmin
              captures: { r_status: $.data.status, r_cnt: $.data.substantiated_complaints_30d }
          trigger:
            - call: "POST /routes/${route_id}/events"
              payload: { event_type: "RESUME" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /routes/${route_id}/events"
              payload: { event_type: "RESUME" }
              as: OpsAdmin
              captures: { r_status2: $.data.status }
          assert:
            - "setup capture c1_match == MATCHED (auto-match found the COMPLETED flight inside [14:00, 14:55))"
            - "setup capture r_status == SUSPENDED and r_cnt == 3 (third SUBSTANTIATE tripped the quota cascade)"
            - "trigger capture err == ERR_ROUTE_QUOTA_STILL_EXCEEDED (RESUME requires count < threshold at resume time)"
            - "trigger capture r_status2 == ACTIVE (at 2026-09-03 the window [08-04, 09-03] excludes all three 08-03 complaints -> count 0)"

      - name: open_boarding_blocked_during_weather_hold
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - calculations.weather_posture
          - state_machines.Flight.SCHEDULED_to_BOARDING
          - errors[ERR_WEATHER_HOLD_ACTIVE]
        distinguishing_aspect: |
          OPEN_BOARDING honors the same posture gate as DISPATCH: during a valid
          adverse observation the boarding call fails with
          ERR_WEATHER_HOLD_ACTIVE, and once validity_until passes the identical
          call succeeds — while the flight itself (departure outside the
          observation window) was never cancelled.
        test_recipe:
          setup:
            - "Flight dep 2026-08-03T16:00:00Z; adverse observation (ceiling 800 < 1000) posted at observed_at 15:00, valid [15:00, 16:00) — the 16:00 departure sits outside the cancellation window (half-open), so the flight survives"
            - "Clock at 15:30 (posture WEATHER_HOLD)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T16:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - { call: "POST /weather-observations", payload: { base_id: "${base_id}", observed_at: "2026-08-03T15:00:00Z", ceiling_ft: 800, visibility_sm: 5, wind_kt: 10 }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: OpsAdmin }
          trigger:
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "OPEN_BOARDING" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T16:00:00Z" }, as: OpsAdmin }
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "OPEN_BOARDING" }
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "Flight.${flight_id}.status == SCHEDULED at 15:30 (16:00 departure is outside [15:00, 16:00) — no weather cancellation)"
            - "trigger capture err == ERR_WEATHER_HOLD_ACTIVE (posture WEATHER_HOLD at 15:30)"
            - "trigger capture st == BOARDING (validity_until 16:00 reached -> posture NORMAL -> gate passes)"

