# =============================================================================
# §1.9 Scaffold Corner Design — task_3204
# Playlist Editorial Pitching & Algorithmic Promotion Trade-Offs
# Breadth probe: claims §1.8 does not already exercise. Clock default
# 2026-09-01T00:00:00Z; releases are dated >= 14 days out unless stated.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: artist_create_returns_system_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.Artist
          - endpoints.POST_/catalog/artists
        distinguishing_aspect: "A minimal artist POST returns 201 with status ACTIVE, fraud_strikes 0, version 1, and server-minted id/created_at/updated_at — none of which are client-suppliable."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/artists"
              payload: { stage_name: "Nova", primary_genre: "POP", home_territory: "US", follower_count: 1200 }
              as: PlatformAdmin
              captures: { art_n: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Artist.${art_n}.status == ACTIVE and fraud_strikes == 0 and version == 1"
            - "id, created_at, updated_at are present and non-null"
            - "created_at == 2026-09-01T00:00:00Z (the logical clock, not wall clock)"

      - name: release_territory_allowlist_defaults_to_worldwide_empty
        claim_type: Defaults
        grounds:
          - entities.Release.fields.territory_allowlist
          - endpoints.POST_/catalog/releases
        distinguishing_aspect: "Omitting territory_allowlist stores the empty array (worldwide), not null and not an error — and a presave from any territory is then convertible at go-live."
        test_recipe:
          setup:
            - "Clock 2026-09-01. One artist."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Def", primary_genre: "JAZZ", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_d: $.data.id }
          trigger:
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_d}", title: "RD", release_type: "EP", release_date: "2026-09-20T00:00:00Z", genre_tags: ["JAZZ"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_d}"
              captures: { rel_d: $.data.id }
          assert:
            - "Release.${rel_d}.territory_allowlist == []"
            - "Release.${rel_d}.status == SCHEDULED and date_change_count == 0 and presave_count == 0"

      - name: track_duration_below_minimum_is_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Track.fields.duration_ms
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "duration_ms carries a >= 30000 constraint; 29999 is rejected 400 ERR_INVALID_REQUEST while 30000 is accepted — the constraint boundary is inclusive."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with a SCHEDULED release dated 2026-09-20."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Dur", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_du: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_du}", title: "RDu", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_du}"
              captures: { rel_du: $.data.id }
          trigger:
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_du}", title: "TooShort", duration_ms: 29999, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_du}"
              captures: { err_dur: $.data.error_id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_du}", title: "JustRight", duration_ms: 30000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_du}"
              captures: { trk_du: $.data.id }
          assert:
            - "the 29999ms create returns 400 err_dur == ERR_INVALID_REQUEST"
            - "the 30000ms create returns 201 and Track.${trk_du}.status == AVAILABLE"

      - name: release_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/catalog/releases/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the release path yields 404 ERR_NOT_FOUND, not 400."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /catalog/releases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "response status 404 and err_nf == ERR_NOT_FOUND"
            - "response_type == error with both error_id and message present"

      - name: placements_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/catalog/placements
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two placements on one playlist, limit=1&offset=0 returns 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Two artists each with a SCHEDULED release (2026-09-20) and focus track; playlist slot_count 2; two pitches claimed and accepted."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "PgA", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_p1: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "PgB", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_p2: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_p1}", title: "RP1", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_p1}"
              captures: { rel_p1: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_p2}", title: "RP2", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_p2}"
              captures: { rel_p2: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_p1}", title: "TP1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_p1}"
              captures: { trk_p1: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_p2}", title: "TP2", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_p2}"
              captures: { trk_p2: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Paged", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_pg: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_p1}", pitch_text: "a", target_playlist_id: "${pl_pg}" }
              as: RightsHolder
              as_user_id: "${art_p1}"
              captures: { pit_p1: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_p2}", pitch_text: "b", target_playlist_id: "${pl_pg}" }
              as: RightsHolder
              as_user_id: "${art_p2}"
              captures: { pit_p2: $.data.id }
            - call: "POST /catalog/pitches/${pit_p1}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_p1}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
            - call: "POST /catalog/pitches/${pit_p2}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_p2}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
          trigger:
            - call: "GET /catalog/placements"
              payload: { playlist_id: "${pl_pg}", limit: 1, offset: 0 }
              as: EditorialLead
          assert:
            - "page 1 returns 1 row with total_count == 2 and has_more == true"
            - "page 2 (offset=1) returns 1 row with total_count == 2 and has_more == false"
            - "the two pages together contain the placements of ${pit_p1} (slot 0) and ${pit_p2} (slot 1) exactly once"

      - name: stream_event_is_append_only_without_version_field
        claim_type: Immutability
        grounds:
          - entities.StreamEvent
        distinguishing_aspect: "StreamEvent declares common_fields false — it carries id and created_at but no version and no updated_at, and there is no update endpoint; the only mutation ever applied is the fraud-cascade is_tainted flip."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with LIVE-dated release and track; OPEN period covering September."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "AO", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_ao: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ao}", title: "RAO", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ao}"
              captures: { rel_ao: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_ao}", title: "TAO", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_ao}"
              captures: { trk_ao: $.data.id }
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", pool_cents: 1000 }
              as: PlatformAdmin
              captures: { per_ao: $.data.id }
          trigger:
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_ao}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-06T00:00:00Z", ms_played: 90000 }
              as: PlatformAdmin
              captures: { stm_ao: $.data.id }
          assert:
            - "StreamEvent.${stm_ao} carries id, created_at, is_tainted == false, royalty_period_id == ${per_ao}"
            - "the response has no version field and no updated_at field"
            - "no PATCH/PUT/DELETE endpoint exists for /catalog/streams"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pitch_withdraw_from_accepted_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PitchSubmission
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "ACCEPTED is terminal for PitchSubmission: withdrawing an accepted pitch is 409 ERR_INVALID_STATE and the SCHEDULED placement it spawned survives — withdrawal cannot claw back a placement."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist, SCHEDULED release 2026-09-20, focus track, playlist; pitch claimed and accepted."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Wd", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_wd: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_wd}", title: "RWd", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_wd}"
              captures: { rel_wd: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_wd}", title: "TWd", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_wd}"
              captures: { trk_wd: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "WD List", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_wd: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_wd}", pitch_text: "x", target_playlist_id: "${pl_wd}" }
              as: RightsHolder
              as_user_id: "${art_wd}"
              captures: { pit_wd: $.data.id }
            - call: "POST /catalog/pitches/${pit_wd}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_wd}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
          trigger:
            - call: "POST /catalog/pitches/${pit_wd}/withdraw"
              payload: {}
              as: RightsHolder
              as_user_id: "${art_wd}"
              captures: { err_wd: $.data.error_id }
          assert:
            - "409 err_wd == ERR_INVALID_STATE"
            - "PitchSubmission.${pit_wd}.status remains ACCEPTED"
            - "GET /catalog/placements?pitch_id=${pit_wd} still returns exactly 1 row in SCHEDULED"

      - name: presave_conversion_at_go_live_respects_territory_allowlist
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Release.SCHEDULED_to_LIVE
          - calculations.presave_conversion
        distinguishing_aspect: "At go-live the SAVED presaves split deterministically: territories inside the allowlist convert, territories outside cancel, and presave_count is recomputed to the count of CONVERTED rows (SAVED rows no longer exist)."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with release dated 2026-09-05, territory_allowlist [\"US\"]."
            - "Three presaves: fan US, fan CA, fan US (tokens fan-1, fan-2, fan-3)."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "PS", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_ps: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ps}", title: "RPS", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [], territory_allowlist: ["US"] }
              as: RightsHolder
              as_user_id: "${art_ps}"
              captures: { rel_ps: $.data.id }
            - call: "POST /catalog/presaves"
              payload: { release_id: "${rel_ps}", fan_token: "fan-1", territory: "US" }
              as: PlatformAdmin
              captures: { ps_1: $.data.id }
            - call: "POST /catalog/presaves"
              payload: { release_id: "${rel_ps}", fan_token: "fan-2", territory: "CA" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/presaves"
              payload: { release_id: "${rel_ps}", fan_token: "fan-3", territory: "CA" }
              as: PlatformAdmin
              captures: { err_ps: $.data.error_id }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the CA presave is rejected at creation with 422 err_ps == ERR_TERRITORY_RESTRICTED (priority 19) — outside-allowlist presaves never enter SAVED"
            - "after the clock crosses release_date: Release.${rel_ps}.status == LIVE"
            - "PreSave.${ps_1}.status == CONVERTED"
            - "Release.${rel_ps}.presave_count == 1"

      - name: release_date_change_preserves_sufficient_lead_pitches
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Release.SCHEDULED_to_SCHEDULED
          - entities.Release.fields.date_change_count
        distinguishing_aspect: "A date change that still leaves every in-flight pitch at least MIN_PITCH_LEAD_DAYS of residual lead withdraws nothing — the cascade is conditional on the recomputed lead, not automatic; date_change_count increments exactly once and version bumps by one."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with release R1 dated 2026-09-25 (focus track T1, pitch P1 submitted at 09-01) and release R2 dated 2026-09-30 (focus track T2, pitch P2)."
            - "Playlist slot_count 5."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "DC", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_dc: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_dc}", title: "R1", release_type: "SINGLE", release_date: "2026-09-25T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_dc}"
              captures: { rel_d1: $.data.id, rel_d1v: $.data.version }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_dc}", title: "R2", release_type: "SINGLE", release_date: "2026-09-30T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_dc}"
              captures: { rel_d2: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_d1}", title: "T1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_dc}"
              captures: { trk_d1: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_d2}", title: "T2", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_dc}"
              captures: { trk_d2: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "DC List", genre_focus: "POP", mood_focus: "ANY", slot_count: 5, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_dc: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_d1}", pitch_text: "p1", target_playlist_id: "${pl_dc}" }
              as: RightsHolder
              as_user_id: "${art_dc}"
              captures: { pit_d1: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_d2}", pitch_text: "p2", target_playlist_id: "${pl_dc}" }
              as: RightsHolder
              as_user_id: "${art_dc}"
              captures: { pit_d2: $.data.id }
          trigger:
            - call: "POST /catalog/releases/${rel_d1}/change-date"
              payload: { release_date: "2026-09-10T00:00:00Z", expected_release_version: "${rel_d1v}" }
              as: RightsHolder
              as_user_id: "${art_dc}"
          assert:
            - "Release.${rel_d1}.release_date == 2026-09-10T00:00:00Z and date_change_count == 1 and version incremented by exactly 1"
            - "PitchSubmission.${pit_d1}.status == PITCHED — the residual lead under the new date is 9 days (09-01 to 09-10) which is >= MIN_PITCH_LEAD_DAYS 7, so the pitch survives; this pins the >= comparison"
            - "PitchSubmission.${pit_d2}.status == PITCHED (its release was untouched)"
            - "boundary note: a change to 2026-09-08T00:00:00Z (residual lead exactly 7) also survives, while 2026-09-07T00:00:00Z (residual 6) would have withdrawn the pitch"

      - name: playlist_retire_evicts_all_non_terminal_placements
        claim_type: Cascade down
        grounds:
          - state_machines.PlaylistPlacement.SCHEDULED_to_EVICTED
          - endpoints.POST_/catalog/playlists/{id}/retire
        distinguishing_aspect: "Retiring a playlist evicts SCHEDULED and ACTIVE placements alike but leaves ROTATED_OUT rows untouched — the cascade is conditional on child state."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Two artists with releases dated 2026-09-05, focus tracks; playlist slot 2 cadence 3 days; both pitches accepted; clock to 09-05; P1 activated, P2 left SCHEDULED."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Ev1", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_e1: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "Ev2", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_e2: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_e1}", title: "RE1", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_e1}"
              captures: { rel_e1: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_e2}", title: "RE2", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_e2}"
              captures: { rel_e2: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_e1}", title: "TE1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_e1}"
              captures: { trk_e1: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_e2}", title: "TE2", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_e2}"
              captures: { trk_e2: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Retire Me", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 3, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_ev: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_e1}", pitch_text: "p1", target_playlist_id: "${pl_ev}" }
              as: RightsHolder
              as_user_id: "${art_e1}"
              captures: { pit_e1: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_e2}", pitch_text: "p2", target_playlist_id: "${pl_ev}" }
              as: RightsHolder
              as_user_id: "${art_e2}"
              captures: { pit_e2: $.data.id }
            - call: "POST /catalog/pitches/${pit_e1}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_e1}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
            - call: "POST /catalog/pitches/${pit_e2}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_e2}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
            - call: "GET /catalog/placements"
              payload: { pitch_id: "${pit_e1}" }
              as: EditorialLead
              captures: { plc_e1: "$.data[0].id" }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/placements/${plc_e1}/activate"
              payload: {}
              as: PlaylistEditor
          trigger:
            - call: "POST /catalog/playlists/${pl_ev}/retire"
              payload: {}
              as: EditorialLead
          assert:
            - "EditorialPlaylist.${pl_ev}.status == RETIRED"
            - "the ACTIVE placement ${plc_e1} is EVICTED"
            - "the SCHEDULED placement of pitch ${pit_e2} is EVICTED"
            - "GET /catalog/placements?playlist_id=${pl_ev}&status=ACTIVE returns 0 rows"

  # ===========================================================================
  - section: calculations
    instances:
      - name: boost_score_cap_is_inclusive_at_ninety
        claim_type: Correct Result
        grounds:
          - calculations.editorial_boost_score
        distinguishing_aspect: "save 0.9 / completion 0.9 / skip 0.0 at follower tier 1.2 gives raw 72 x 1.2 = 86.4 -> floor 86 (below cap); a maxed rollup save 1.0 / completion 1.0 / skip 0.0 gives raw 80 x 1.2 = 96 -> clamped to exactly BOOST_CAP 90, and min() is inclusive so exactly-90 stays 90."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist follower_count 200000 with release 2026-09-05 and focus track; playlist; pitch accepted; clock 09-05; placement activated."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Cap", primary_genre: "POP", home_territory: "US", follower_count: 200000 }
              as: PlatformAdmin
              captures: { art_cp: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_cp}", title: "RCp", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_cp}"
              captures: { rel_cp: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_cp}", title: "TCp", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_cp}"
              captures: { trk_cp: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Cap List", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_cp: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_cp}", pitch_text: "cap", target_playlist_id: "${pl_cp}" }
              as: RightsHolder
              as_user_id: "${art_cp}"
              captures: { pit_cp: $.data.id }
            - call: "POST /catalog/pitches/${pit_cp}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_cp}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
            - call: "GET /catalog/placements"
              payload: { pitch_id: "${pit_cp}" }
              as: EditorialLead
              captures: { plc_cp: "$.data[0].id" }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/placements/${plc_cp}/activate"
              payload: {}
              as: PlaylistEditor
          trigger:
            - call: "POST /catalog/tracks/${trk_cp}/signal-rollup"
              payload: { window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-12T00:00:00Z", save_rate: 0.9, completion_rate: 0.9, skip_rate: 0.0 }
              as: PlatformAdmin
              captures: { boost_86: $.data.boost_score }
            - call: "POST /catalog/tracks/${trk_cp}/signal-rollup"
              payload: { window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-12T00:00:00Z", save_rate: 1.0, completion_rate: 1.0, skip_rate: 0.0 }
              as: PlatformAdmin
              captures: { boost_cap: $.data.boost_score }
          assert:
            - "boost_86 == 86 (floor(72 x 1.2) = 86, below the cap)"
            - "boost_cap == 90 (floor(80 x 1.2) = 96 clamped by the inclusive min to BOOST_CAP)"
            - "variant == STANDARD for both rollups (placement was ACTIVE in the window)"

      - name: royalty_close_excludes_tainted_streams_from_input_set
        claim_type: Input Set Filtering
        grounds:
          - calculations.royalty_pool_share
        distinguishing_aspect: "The close-time input set filters is_tainted == false only; streams tainted after ingest still bind royalty_period_id but vanish from raw/effective counts — verified by a one-artist period where the single tainted stream leaves zero statements."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Solo artist with track; OPEN period pool 5000; one stream 09-11 then tainted by a CONFIRMED case covering it."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Solo", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_so: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_so}", title: "RSo", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_so}"
              captures: { rel_so: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_so}", title: "TSo", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_so}"
              captures: { trk_so: $.data.id }
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", pool_cents: 5000 }
              as: PlatformAdmin
              captures: { per_so: $.data.id, per_sov: $.data.version }
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_so}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-11T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_so}", window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-12T00:00:00Z", signal_bot_ratio: 1.0, signal_velocity_zscore: 1.0, signal_device_concentration: 0.6 }
              as: FraudAnalyst
              captures: { fc_so: $.data.id }
            - call: "POST /catalog/fraud-cases/${fc_so}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/royalty-periods/${per_so}/close"
              payload: { variant: "GROSS", expected_period_version: "${per_sov}" }
              as: PlatformAdmin
          assert:
            - "close succeeds and GET /catalog/royalty-statements?period_id=${per_so} returns 0 rows — the only stream was tainted, so no artist qualifies"
            - "FraudCase.${fc_so}.clawback_cents == 0.40 is recorded on the case for sweep into the next statement (no unsettled statement exists to absorb it)"
            - "RoyaltyPeriod.${per_so}.status == CLOSED"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_required_release_field_is_invalid_request
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "release_date is required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the shape check, which precedes every state/business rule."
        test_recipe:
          setup:
            - "Clock 2026-09-01. One artist."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Miss", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_mi: $.data.id }
          trigger:
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_mi}", title: "RM", release_type: "SINGLE", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_mi}"
              captures: { err_mi: $.data.error_id }
          assert:
            - "400 err_mi == ERR_INVALID_REQUEST"
            - "GET /catalog/releases?artist_id=${art_mi} returns 0 rows"

      - name: rights_holder_cannot_touch_another_artists_release
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "RightsHolder identity is entity_backed by Artist: X-User-ID of artist A attempting change-date on artist B's release is 403 ERR_FORBIDDEN (priority 2), before existence, state, or OCC checks run."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artists A and B; B has a SCHEDULED release dated 2026-09-25."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "OwnA", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_oa: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "OwnB", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_ob: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ob}", title: "RB", release_type: "SINGLE", release_date: "2026-09-25T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ob}"
              captures: { rel_ob: $.data.id, rel_obv: $.data.version }
          trigger:
            - call: "POST /catalog/releases/${rel_ob}/change-date"
              payload: { release_date: "2026-10-01T00:00:00Z", expected_release_version: "${rel_obv}" }
              as: RightsHolder
              as_user_id: "${art_oa}"
              captures: { err_own: $.data.error_id }
          assert:
            - "403 err_own == ERR_FORBIDDEN"
            - "Release.${rel_ob}.release_date is unchanged at 2026-09-25T00:00:00Z and version unchanged"

      - name: stream_ingest_before_period_end_close_blocked_until_clock_passes
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=15]
          - errors.ERR_PERIOD_NOT_CLOSABLE
        distinguishing_aspect: "Closing a period whose period_end is still in the future is 409 ERR_PERIOD_NOT_CLOSABLE; advancing the clock to exactly period_end flips the check to pass — the boundary is inclusive (clock >= period_end)."
        test_recipe:
          setup:
            - "Clock 2026-09-01. OPEN period [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", pool_cents: 100 }
              as: PlatformAdmin
              captures: { per_cl: $.data.id, per_clv: $.data.version }
          trigger:
            - call: "POST /catalog/royalty-periods/${per_cl}/close"
              payload: { variant: "GROSS", expected_period_version: "${per_clv}" }
              as: PlatformAdmin
              captures: { err_cl: $.data.error_id }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/royalty-periods/${per_cl}/close"
              payload: { variant: "GROSS", expected_period_version: "${per_clv}" }
              as: PlatformAdmin
          assert:
            - "first close returns 409 err_cl == ERR_PERIOD_NOT_CLOSABLE"
            - "at exactly 2026-10-01T00:00:00Z the close succeeds (inclusive boundary) and status == CLOSED"

      - name: pitch_on_non_focus_track_is_not_pitchable
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_PITCH_NOT_PITCHABLE
        distinguishing_aspect: "Only the release's focus track is pitchable: pitching the non-focus track of the same release is 409 ERR_PITCH_NOT_PITCHABLE even when every temporal and fit check would pass."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with release 2026-09-20, focus track T1 and non-focus track T2; playlist exists."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "NF", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_nf: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_nf}", title: "RNF", release_type: "EP", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_nf}"
              captures: { rel_nf: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_nf}", title: "Focus", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_nf}"
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_nf}", title: "B-Side", duration_ms: 180000, is_focus_track: false }
              as: RightsHolder
              as_user_id: "${art_nf}"
              captures: { trk_nf: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "NF List", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_nf: $.data.id }
          trigger:
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_nf}", pitch_text: "pitch the b-side", target_playlist_id: "${pl_nf}" }
              as: RightsHolder
              as_user_id: "${art_nf}"
              captures: { err_nf2: $.data.error_id }
          assert:
            - "409 err_nf2 == ERR_PITCH_NOT_PITCHABLE"
            - "GET /catalog/pitches?track_id=${trk_nf} returns 0 rows"

      - name: playlist_genre_fit_mismatch_blocks_pitch
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_PLAYLIST_FIT_MISMATCH
        distinguishing_aspect: "A ROCK-only release pitched at a POP-focus playlist fails priority 8 with ERR_PLAYLIST_FIT_MISMATCH — the fit check is over the release's genre_tags, not the artist's primary_genre."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist (primary_genre POP) with a release tagged genre_tags [ROCK], focus track; POP playlist."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Fit", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_ft: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ft}", title: "Rock Out", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["ROCK"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ft}"
              captures: { rel_ft: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_ft}", title: "TFt", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_ft}"
              captures: { trk_ft: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Pop Only", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_ft: $.data.id }
          trigger:
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_ft}", pitch_text: "wrong shelf", target_playlist_id: "${pl_ft}" }
              as: RightsHolder
              as_user_id: "${art_ft}"
              captures: { err_ft: $.data.error_id }
          assert:
            - "409 err_ft == ERR_PLAYLIST_FIT_MISMATCH"
            - "the artist's primary_genre POP does not rescue the release-level genre_tags [ROCK]"

      - name: promotion_suspend_requires_disclosure_token
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - errors.ERR_DISCLOSURE_TOKEN_MISMATCH
        distinguishing_aspect: "The promotion program's disclosure is enforced mechanically: suspend without the disclosure_token minted at enroll is 403 ERR_DISCLOSURE_TOKEN_MISMATCH; with the token it succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with release/track; enrollment created (token captured from the create response)."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Disc", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_di: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_di}", title: "RDi", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_di}"
              captures: { rel_di: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_di}", title: "TDi", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_di}"
              captures: { trk_di: $.data.id }
            - call: "POST /catalog/promotions"
              payload: { track_id: "${trk_di}", discount_factor: 0.5, starts_on: "2026-09-10T00:00:00Z", ends_on: "2026-09-20T00:00:00Z" }
              as: RightsHolder
              as_user_id: "${art_di}"
              captures: { enr_di: $.data.id, disc_tok: $.data.disclosure_token }
          trigger:
            - call: "POST /catalog/promotions/${enr_di}/suspend"
              payload: { disclosure_token: "forged-token" }
              as: RightsHolder
              as_user_id: "${art_di}"
              captures: { err_di: $.data.error_id }
            - call: "POST /catalog/promotions/${enr_di}/suspend"
              payload: { disclosure_token: "${disc_tok}" }
              as: RightsHolder
              as_user_id: "${art_di}"
          assert:
            - "the forged token returns 403 err_di == ERR_DISCLOSURE_TOKEN_MISMATCH"
            - "the minted token succeeds and PromotionEnrollment.${enr_di}.status == SUSPENDED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: signal_rollup_is_a_computed_read_action
        claim_type: Computed read
        grounds:
          - endpoints.POST_/catalog/tracks/{id}/signal-rollup
        distinguishing_aspect: "The rollup endpoint returns an inline object { boost_score, variant } rather than an entity — the response envelope still wraps it as response_type object with meta present."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist follower_count 5000, release 2026-09-05, focus track, no placement (COLD_START)."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "CR", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_cr: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_cr}", title: "RCr", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_cr}"
              captures: { rel_cr: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_cr}", title: "TCr", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_cr}"
              captures: { trk_cr: $.data.id }
          trigger:
            - call: "POST /catalog/tracks/${trk_cr}/signal-rollup"
              payload: { window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-12T00:00:00Z", save_rate: 0.5, completion_rate: 0.4, skip_rate: 0.1 }
              as: PlatformAdmin
              captures: { cr_score: $.data.boost_score }
          assert:
            - "response_type == object and meta.api_request_id is present"
            - "cr_score == 14 (STANDARD 28 halved by COLD_START) and variant == COLD_START"

      - name: royalty_settle_locks_statements
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/catalog/royalty-periods/{id}/settle
          - state_machines.RoyaltyPeriod
        distinguishing_aspect: "Settle is only defined from CLOSED: settling an OPEN period is 409 ERR_INVALID_STATE, and after settle the period is terminal — a second settle is also 409."
        test_recipe:
          setup:
            - "Clock 2026-09-01. OPEN period [2026-09-01, 2026-09-10) pool 100; clock advanced to 09-10; period closed."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-10T00:00:00Z", pool_cents: 100 }
              as: PlatformAdmin
              captures: { per_st: $.data.id, per_stv: $.data.version }
          trigger:
            - call: "POST /catalog/royalty-periods/${per_st}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { err_st1: $.data.error_id }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/royalty-periods/${per_st}/close"
              payload: { variant: "GROSS", expected_period_version: "${per_stv}" }
              as: PlatformAdmin
            - call: "POST /catalog/royalty-periods/${per_st}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /catalog/royalty-periods/${per_st}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { err_st2: $.data.error_id }
          assert:
            - "settle from OPEN: 409 err_st1 == ERR_INVALID_STATE"
            - "settle from CLOSED: 200 and status == SETTLED"
            - "second settle from terminal SETTLED: 409 err_st2 == ERR_INVALID_STATE"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_release_date_change_window_triple_condition
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DATE_CHANGE_WINDOW
          - validations[priority=10]
        distinguishing_aspect: "ERR_DATE_CHANGE_WINDOW fires on three distinct conditions: new date not in the future, change attempted inside the 7-day pitch window before the old date, and date_change_count == MAX_DATE_CHANGES (3) — the fourth change attempt is rejected even though its new date is valid."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with release dated 2026-09-25; three successful date changes already applied (each pushing the date forward, keeping the pitch window open)."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "DCW", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_dw: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_dw}", title: "RDW", release_type: "SINGLE", release_date: "2026-09-25T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_dw}"
              captures: { rel_dw: $.data.id, rel_dwv: $.data.version }
            - call: "POST /catalog/releases/${rel_dw}/change-date"
              payload: { release_date: "2026-10-02T00:00:00Z", expected_release_version: "${rel_dwv}" }
              as: RightsHolder
              as_user_id: "${art_dw}"
              captures: { rel_dwv2: $.data.version }
            - call: "POST /catalog/releases/${rel_dw}/change-date"
              payload: { release_date: "2026-10-09T00:00:00Z", expected_release_version: "${rel_dwv2}" }
              as: RightsHolder
              as_user_id: "${art_dw}"
              captures: { rel_dwv3: $.data.version }
            - call: "POST /catalog/releases/${rel_dw}/change-date"
              payload: { release_date: "2026-10-16T00:00:00Z", expected_release_version: "${rel_dwv3}" }
              as: RightsHolder
              as_user_id: "${art_dw}"
              captures: { rel_dwv4: $.data.version }
          trigger:
            - call: "POST /catalog/releases/${rel_dw}/change-date"
              payload: { release_date: "2026-08-01T00:00:00Z", expected_release_version: "${rel_dwv4}" }
              as: RightsHolder
              as_user_id: "${art_dw}"
              captures: { err_dw1: $.data.error_id }
            - call: "POST /catalog/releases/${rel_dw}/change-date"
              payload: { release_date: "2026-10-23T00:00:00Z", expected_release_version: "${rel_dwv4}" }
              as: RightsHolder
              as_user_id: "${art_dw}"
              captures: { err_dw2: $.data.error_id }
          assert:
            - "past-date attempt: 409 err_dw1 == ERR_DATE_CHANGE_WINDOW"
            - "fourth change attempt with a valid future date: 409 err_dw2 == ERR_DATE_CHANGE_WINDOW (date_change_count == 3 == MAX_DATE_CHANGES)"
            - "Release.${rel_dw}.release_date remains 2026-10-16T00:00:00Z and date_change_count == 3"

      - name: error_unauthenticated_when_role_header_missing
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "A request whose role header is not a declared role is 401 ERR_UNAUTHENTICATED — priority 1 precedes even existence checks, so the same call against a nonexistent id still returns 401, not 404."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /catalog/releases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GhostRole
              captures: { err_un: $.data.error_id }
          assert:
            - "401 err_un == ERR_UNAUTHENTICATED (not 404 despite the unknown id, and not 403 — the role is unknown, not merely unauthorized)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: editor_cannot_decide_and_lead_cannot_claim
        claim_type: exclusive_operations
        grounds:
          - roles.PlaylistEditor
          - roles.EditorialLead
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Segregation of duties inside editorial: PlaylistEditor owns claim/request-revision but decide is EditorialLead-only (403 ERR_FORBIDDEN for the editor), and claim is editor-only (403 for the lead) — the two editorial roles are mutually exclusive, not hierarchical."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with release 2026-09-20, focus track, playlist; two pitches P1, P2 (on two releases' focus tracks) both PITCHED."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "RBAC", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_rb: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_rb}", title: "RR1", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_rb}"
              captures: { rel_rb1: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_rb}", title: "RR2", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_rb}"
              captures: { rel_rb2: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_rb1}", title: "TR1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_rb}"
              captures: { trk_rb1: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_rb2}", title: "TR2", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_rb}"
              captures: { trk_rb2: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "RBAC List", genre_focus: "POP", mood_focus: "ANY", slot_count: 3, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_rb: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_rb1}", pitch_text: "one", target_playlist_id: "${pl_rb}" }
              as: RightsHolder
              as_user_id: "${art_rb}"
              captures: { pit_rb1: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_rb2}", pitch_text: "two", target_playlist_id: "${pl_rb}" }
              as: RightsHolder
              as_user_id: "${art_rb}"
              captures: { pit_rb2: $.data.id }
          trigger:
            - call: "POST /catalog/pitches/${pit_rb1}/decide"
              payload: { decision: "ACCEPT" }
              as: PlaylistEditor
              captures: { err_rb1: $.data.error_id }
            - call: "POST /catalog/pitches/${pit_rb2}/claim"
              payload: { team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { err_rb2: $.data.error_id }
          assert:
            - "editor decide: 403 err_rb1 == ERR_FORBIDDEN and pitch stays PITCHED"
            - "lead claim: 403 err_rb2 == ERR_FORBIDDEN and pitch stays PITCHED"

      - name: fraud_analyst_cannot_ingest_streams
        claim_type: exclusive_operations
        grounds:
          - roles.FraudAnalyst
          - roles.PlatformAdmin
        distinguishing_aspect: "Stream ingest is PlatformAdmin-exclusive: the FraudAnalyst (who may read streams and adjudicate cases) gets 403 on POST /catalog/streams — read access does not imply write access across the segregation boundary."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist, release, track, OPEN period."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Seg", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_sg: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_sg}", title: "RSg", release_type: "SINGLE", release_date: "2026-09-05T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_sg}"
              captures: { rel_sg: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_sg}", title: "TSg", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_sg}"
              captures: { trk_sg: $.data.id }
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", pool_cents: 100 }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_sg}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-06T00:00:00Z", ms_played: 1000 }
              as: FraudAnalyst
              captures: { err_sg: $.data.error_id }
          assert:
            - "403 err_sg == ERR_FORBIDDEN"
            - "GET /catalog/streams?track_id=${trk_sg} as FraudAnalyst succeeds (200) and returns 0 rows"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: release_change_date_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[release-change-date-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Release.version: a change-date carrying the pre-first-change version is 412 ERR_STALE_VERSION after a successful change advanced the version — two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Artist with release dated 2026-09-25, version captured at creation."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "OCC", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_oc: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_oc}", title: "ROC", release_type: "SINGLE", release_date: "2026-09-25T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_oc}"
              captures: { rel_oc: $.data.id, rel_ocv: $.data.version }
          trigger:
            - call: "POST /catalog/releases/${rel_oc}/change-date"
              payload: { release_date: "2026-10-02T00:00:00Z", expected_release_version: "${rel_ocv}" }
              as: RightsHolder
              as_user_id: "${art_oc}"
              captures: { rel_ocv2: $.data.version }
            - call: "POST /catalog/releases/${rel_oc}/change-date"
              payload: { release_date: "2026-10-09T00:00:00Z", expected_release_version: "${rel_ocv} - 1" }
              as: RightsHolder
              as_user_id: "${art_oc}"
              captures: { err_occ: $.data.error_id }
          assert:
            - "first change succeeds: release_date 2026-10-02 and version == ${rel_ocv} + 1"
            - "second change with the now-stale version expression returns 412 err_occ == ERR_STALE_VERSION"
            - "Release.${rel_oc}.release_date remains 2026-10-02T00:00:00Z and date_change_count == 1"

      - name: period_close_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[period-close-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on RoyaltyPeriod.version guards the close: the version captured before any cascade must match at close time; a deliberately stale expression (${v} - 1) is 412 even when every other close precondition passes."
        test_recipe:
          setup:
            - "Clock 2026-09-01. OPEN period [2026-09-01, 2026-09-10); clock advanced to 09-10."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-10T00:00:00Z", pool_cents: 100 }
              as: PlatformAdmin
              captures: { per_oc: $.data.id, per_ocv: $.data.version }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/royalty-periods/${per_oc}/close"
              payload: { variant: "GROSS", expected_period_version: "${per_ocv} - 1" }
              as: PlatformAdmin
              captures: { err_pocc: $.data.error_id }
            - call: "POST /catalog/royalty-periods/${per_oc}/close"
              payload: { variant: "EFFECTIVE", expected_period_version: "${per_ocv}" }
              as: PlatformAdmin
          assert:
            - "stale-version close: 412 err_pocc == ERR_STALE_VERSION and the period stays OPEN"
            - "correct-version close succeeds, status == CLOSED, closed_variant == EFFECTIVE, version advanced by 1"

      - name: clock_advance_fires_release_and_rotation_transitions_deterministically
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/catalog/_clock/set_current_utc
          - state_machines.Release.SCHEDULED_to_LIVE
        distinguishing_aspect: "The clock endpoint is the single driver of scheduled transitions: before any set call the logical time is exactly 2026-09-01T00:00:00Z (never wall clock); advancing past a release_date flips SCHEDULED -> LIVE, and advancing past scheduled_rotation_on rotates ACTIVE placements out, both in the same set call."
        test_recipe:
          setup:
            - "Artist with release dated 2026-09-03, focus track, playlist cadence 2 days; pitch accepted; clock to 09-03; placement activated (rotation due 09-05)."
          setup_api_calls:
            - *c_clock
            - call: "POST /catalog/artists"
              payload: { stage_name: "Clk", primary_genre: "POP", home_territory: "US", follower_count: 10 }
              as: PlatformAdmin
              captures: { art_ck: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ck}", title: "RCk", release_type: "SINGLE", release_date: "2026-09-03T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ck}"
              captures: { rel_ck: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_ck}", title: "TCk", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_ck}"
              captures: { trk_ck: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Clock List", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 2, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_ck: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_ck}", pitch_text: "clockwork", target_playlist_id: "${pl_ck}" }
              as: RightsHolder
              as_user_id: "${art_ck}"
              captures: { pit_ck: $.data.id }
            - call: "POST /catalog/pitches/${pit_ck}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_ck}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
            - call: "GET /catalog/placements"
              payload: { pitch_id: "${pit_ck}" }
              as: EditorialLead
              captures: { plc_ck: "$.data[0].id" }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/placements/${plc_ck}/activate"
              payload: {}
              as: PlaylistEditor
          trigger:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Release.${rel_ck}.status flipped to LIVE at the 09-03 set call"
            - "after the 09-05 set call PlaylistPlacement.${plc_ck}.status == ROTATED_OUT (scheduled_rotation_on was 2026-09-05T00:00:00Z, boundary inclusive)"
            - "the clock set response echoes current_utc == 2026-09-05T00:00:00Z"

