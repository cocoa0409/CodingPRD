            - "BuybackDemand.${bb_c1}.unpaid_principal_cents == 2801000 and reserve_offset_cents == 161058 and admin_fee_cents == 25000"
            - "BuybackDemand.${bb_c1}.buyback_amount_cents == 2987058"
