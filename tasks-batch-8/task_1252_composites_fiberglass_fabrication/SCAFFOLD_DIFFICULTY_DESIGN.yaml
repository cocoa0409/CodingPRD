  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_layup_gated_on_mold_active
        grounds:
          - state_machines.WorkOrder.RELEASED_to_LAYUP_IN_PROGRESS
          - state_machines.Mold.ACTIVE_to_MAINTENANCE_DUE
        distinguishing_aspect: |
          Entity pair WorkOrder -> Mold: the start-layup transition is legal
          only while the referenced Mold.status == ACTIVE; after a completed
          cure cycle wears the mold into MAINTENANCE_DUE the same transition is
          rejected. Companion instance crosses a different pair
          (LayupSession -> ResinBatch).
        test_recipe:
          setup:
            - "Clock T0; permit; approved PN-100; PRODUCTION mold interval 1; WO-G1 completed its cure (mold now MAINTENANCE_DUE) and demolded; WO-G2 released against the same mold"
