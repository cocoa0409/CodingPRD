          - endpoints.POST_/_clock/set_current_utc
          - entities.RepairOrder.fields.checkin_at
        distinguishing_aspect: >-
          The clock endpoint returns the bare {current_utc} projection rather than an entity, and the
          value it sets is the source of every later system stamp: two orders created either side of one
          clock move carry different checkin_at values, and a teardown finding stamped after a second
          move proves the clock is read per request and never cached at boot.
        test_recipe:
          setup:
            - "One Customer and one Insurer, created while the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { t0: $.data.current_utc }
            - call: "POST /customers"
              payload: { full_name: "Moe Abe", phone: "555-1038", email: "moe@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-38", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90043", vehicle_vin: "1HGCV1F30LA090043", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_early: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T13:45:00Z" }
              as: ShopAdmin
              captures: { t1: $.data.current_utc }
          assert:
            - "HTTP 200 with data.current_utc == 2026-09-15T13:45:00Z and no other field in data"
            - "RepairOrder.${ro_early}.checkin_at is still 2026-08-01T00:00:00Z - moving the clock does not rewrite existing stamps"
            - "a second order created now carries checkin_at == 2026-09-15T13:45:00Z"
            - "a teardown finding recorded on ${ro_early} now is accepted and the order moves to TEARDOWN, so the clock move did not disturb the aggregate"

