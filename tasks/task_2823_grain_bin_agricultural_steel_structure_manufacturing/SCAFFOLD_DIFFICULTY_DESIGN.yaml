            - "hop 1: DealerOrder.${o1_id}.production_status == CANCELLED, financial_status == VOIDED and credit_hold_cents == 0"
            - "hop 2: Dealer.${dlr_a_id}.credit_committed_cents == 1999734, credit_available_cents == 1999733 and status == ACTIVE"
            - "hop 3: DealerOrder.${o2_id}.production_status == QUEUED with credit_hold_cents still 1999734"
            - "DealerOrder.${o2_id}.version == 4 - create, confirm, the HOLD_CREDIT cascade and the requeue cascade"
            - "DealerOrder.${o2_id}.financial_status == AWAITING_DEPOSIT throughout - the requeue touches only the production dimension"
            - "the chain is transitive: hop 2 reads the credit_hold_cents zeroed by hop 1 and hop 3 fires only because hop 2 moved the Dealer to ACTIVE; had the limit been lowered to 1999733 instead, hop 2 would not fire and O2 would stay in HOLD_CREDIT"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: unsealed_design_state_error_precedes_credit_limit_fiscal_error_on_order_confirm
        grounds:
          - validations[priority=7]
          - validations[priority=33]
          - errors.ERR_DESIGN_NOT_SEALED
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
          - calculations.dealer_credit_ledger
        distinguishing_aspect: |
          Category pair state (priority 7, 409) versus business_fiscal (priority 33, 402) on
          POST /dealer-orders/{id}/confirm. One request violates both: the design in a seal-required
          jurisdiction has only reached UNDER_REVIEW, and the dealer's credit_available_cents of 0 is
          far below the order's credit_hold_cents of 1999734. The state check wins, so a naive
          implementation that validates money before workflow state is caught by the HTTP status
          alone (409 not 402). Repairing only the state defect then exposes the fiscal error, proving
          both were genuinely live.
        test_recipe:
          setup:
            - "Jurisdiction IA-CENTRAL: seal_required true, min_design_wind_speed_mph 105, seismic_design_category B, permit_review_days 21."
            - "GrainProfile CORN, CoatingSpec G115, and two engineers: PE-1001 (author) and PE-1002 (sealer), both licensed in IA-CENTRAL."
            - "Dealer Gamma in IA-CENTRAL with credit_limit_cents 0, program_tier BASE."
            - "BinDesign D1 (12.0 m x 9.6 m, pitch 30, wind 105, moisture 14.0, ASD) carried to UNDER_REVIEW - NOT sealed - by one PASS ASD analysis plus submit-review; under seismic category B the seismic demand is 8.148 kPa, still below the governing grain demand of 28.518 kPa, so the design keeps 12 stiffeners."
            - "DealerOrder O_G on D1 (NONE / GRAVITY) in production_status DRAFT with credit_hold_cents 1999734; order creation is legal because the design is not RECALLED."
            - "Logical clock at its 2026-08-01T00:00:00Z default when the order is created, so OFFSEASON is the derived season."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "IA-CENTRAL", name: "Iowa Central", seal_required: true, min_design_wind_speed_mph: 105, seismic_design_category: "B", permit_review_days: 21 }
              as: PlantAdmin
              captures: { j_s_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Rex Sealer", license_number: "PE-1002", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_s_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Gamma Bin Center", region_code: "IA-03", jurisdiction_id: "${j_s_id}", credit_limit_cents: 0, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_g_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_g_id}", jurisdiction_id: "${j_s_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${d1_v}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an1_id: $.data.id }
            - call: "POST /bin-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_status: $.data.status }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_g_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_g_id}"
              captures: { o_g_id: $.data.id, hold_g: $.data.credit_hold_cents }
          trigger:
            - call: "POST /dealer-orders/${o_g_id}/confirm"
              payload: {}
