              as: LicensingAdmin
              captures: { sched_ch_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_ch_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Harbourfront Concert Hall", venue_category: "CONCERT_HALL", seating_capacity: 800, standing_capacity: 0, occupancy_limit: 900, music_use_profile: "LIVE_ONLY", weekly_live_performance_nights: 3, annual_cover_revenue_cents: 10000000 }
              as: LicensingAdmin
