# =============================================================================
# SCAFFOLD: Turf Equipment Distributor Programs & Course Fleet Leasing
# §1.0–§1.7 (difficulty and corner designs live in sibling files)
# =============================================================================

scenario: |
  Turf Equipment Distributor Programs & Course Fleet Leasing (The Toro Company): distributor network with territory assignment, parts stocking obligations and technician certification requirements, golf course fleet leasing where an entire mower and utility vehicle fleet is replaced on a multi-year cycle with trade-in valuation, equipment specification by turf type, cut quality requirements and course maintenance standards, seasonal demand with spring delivery peaks and off-season order incentive programs, irrigation product line sold through separate distribution with design support and controller programming, parts availability commitments for equipment kept in service well past warranty, warranty claim adjudication between distributor labor rates and factory allowances, used equipment remarketing after fleet turnover

domain_name: turf-equipment-leasing
api_prefix: /turf

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor legal name" }
      - { name: territory_codes, type: array, source: input, description: "State/region codes the distributor is authorized to serve" }
      - { name: channel, type: enum, source: input, constraints: "EQUIPMENT | IRRIGATION", description: "Distribution channel: equipment program vs separate irrigation channel" }
      - { name: min_parts_stock_value_cents, type: integer, source: input, description: "Minimum trailing-365d received parts stock value the distributor must hold (stocking obligation)" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Hourly labor rate the distributor bills on warranty claims" }
      - { name: annual_claim_cap_cents, type: integer, source: input, description: "Maximum warranty payouts credited per calendar year" }
      - { name: status, type: enum, source: system, default: ONBOARDING, constraints: "ONBOARDING | ACTIVE | PROBATION | SUSPENDED | TERMINATED", description: "Program standing; driven only by compliance reviews" }
      - { name: fill_rate, type: number, source: computed, default: 1.0, description: "received_units / ordered_units over own PartsOrders with status RECEIVED created in trailing CONST.REVIEW_WINDOW_DAYS; 1.0 when no such orders" }
      - { name: stock_value_trailing_cents, type: integer, source: computed, default: 0, description: "Sum of received qty x Part.unit_cost_cents over orders RECEIVED in trailing window" }
      - { name: committed_parts_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over own PartsOrders in SUBMITTED | ALLOCATED | SHIPPED" }
      - { name: service_credit_balance_cents, type: integer, source: computed, default: 0, description: "Cumulative warranty payouts credited to this distributor" }
      - { name: claims_paid_ytd_cents, type: integer, source: computed, default: 0, description: "Sum of payable_total_cents over own claims PAID with paid_at in the current calendar year of the logical clock" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set from acting DistributorManager identity" }
      - { name: full_name, type: string, source: input, description: "Technician full name" }
      - { name: cert_level, type: enum, source: system, constraints: "APPRENTICE | JOURNEYMAN | MASTER", description: "Certification level; null until first certification" }
      - { name: cert_status, type: enum, source: system, default: CERT_PENDING, constraints: "CERT_PENDING | CERT_ACTIVE | CERT_EXPIRED", description: "Certification standing" }
      - { name: cert_expires_at, type: datetime, source: system, description: "Certification expiry instant; null until certified" }

  - name: GolfCourse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Course name" }
      - { name: turf_profile, type: enum, source: input, constraints: "BENTGRASS | BERMUDA | POA_ANNUA | MIXED", description: "Dominant turf type driving equipment spec" }
      - { name: cut_quality_standard, type: enum, source: input, constraints: "CHAMPIONSHIP | CLUB | MAINTENANCE", description: "Cut quality requirement tier driving equipment spec" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum approved lease contract value" }
      - { name: assigned_distributor_id, type: string, source: input, description: "FK -> Distributor.id; territory assignment, must reference a channel=EQUIPMENT distributor" }
      - { name: status, type: enum, source: system, default: PROSPECT, constraints: "PROSPECT | ACTIVE_LEASE | IN_RENEWAL", description: "Derived from lease lifecycle; system-driven only" }

  - name: EquipmentModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Unique manufacturer model code" }
      - { name: category, type: enum, source: input, constraints: "MOWER | UTILITY_VEHICLE | AERATOR | IRRIGATION_CONTROLLER", description: "Equipment category" }
      - { name: tier, type: enum, source: input, constraints: "TOURNAMENT | PRO | STANDARD", description: "Cut-quality capability tier" }
      - { name: list_price_cents, type: integer, source: input, description: "Factory list price" }
      - { name: eligible_turf_types, type: array, source: input, description: "Subset of turf_profile enum values this model may serve" }
      - { name: factory_warranty_months, type: integer, source: input, description: "Warranty duration from unit delivery" }
      - { name: warranty_labor_hourly_cap_cents, type: integer, source: input, description: "Factory hourly labor allowance cap for warranty adjudication" }
      - { name: parts_support_years, type: integer, source: input, description: "Years parts must remain available after model launch" }
      - { name: lifecycle_status, type: enum, source: system, default: CATALOG_ACTIVE, constraints: "CATALOG_ACTIVE | DISCONTINUED", description: "Sales status; DISCONTINUED set by rollover once age exceeds CONST.MODEL_SALES_WINDOW_MONTHS" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique part SKU" }
      - { name: name, type: string, source: input, description: "Part name" }
      - { name: primary_model_id, type: string, source: input, description: "FK -> EquipmentModel.id; model family this part belongs to" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Distributor net cost per unit" }
      - { name: min_stock_qty, type: integer, source: input, description: "Minimum on-hand quantity per stocking obligation" }
      - { name: support_status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | LAST_BUY | DISCONTINUED | SUPERSEDED", description: "Parts availability lifecycle for kept-in-service equipment" }
      - { name: superseded_by_part_id, type: string, source: system, description: "FK -> Part.id; nullable; successor part when SUPERSEDED" }

  - name: PartsOrder
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set from acting DistributorManager identity" }
      - { name: order_type, type: enum, source: input, constraints: "STOCK | CUSTOMER", description: "STOCK replenishment vs customer-specific order" }
      - { name: lines, type: array, source: input, description: "Array of { part_id, qty }; qty must be >= 1" }
      - { name: off_season_applied, type: boolean, source: computed, default: false, description: "True when off-season incentive discount applied at submit" }
      - { name: discount_tier_pct, type: number, source: computed, default: 0, description: "Incentive tier percentage applied (0 when none)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of qty x unit_cost_cents over lines" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Incentive discount; computed per line then summed (pinned order)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: ordered_units, type: integer, source: computed, description: "Sum of qty over lines" }
      - { name: received_units, type: integer, source: computed, default: 0, description: "Sum of received qty recorded at RECEIVED" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | ALLOCATED | SHIPPED | RECEIVED | CANCELLED", description: "Order pipeline state" }

  - name: FleetLease
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> GolfCourse.id; lessee" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set from acting DistributorManager identity" }
      - { name: cycle_months, type: integer, source: input, description: "Fleet replacement cycle length in months" }
      - { name: start_date, type: string, source: input, description: "Lease start date YYYY-MM-DD; not before current logical date" }
      - { name: end_date, type: string, source: computed, description: "start_date + cycle_months months" }
      - { name: lines, type: array, source: input, description: "Array of { model_id, qty }; expands to LeaseUnit rows in line order" }
      - { name: spec_compliant, type: boolean, source: computed, description: "Computed at SPEC_REVIEW submit per equipment_spec_compliance" }
      - { name: base_value_cents, type: integer, source: computed, description: "Sum of model list_price_cents x qty at approve" }
      - { name: total_contract_value_cents, type: integer, source: computed, description: "base x tier multiplier x seasonal factor at approve" }
      - { name: trade_in_credit_cents, type: integer, source: computed, default: 0, description: "Sum of valued_cents over appraisals moved to CREDITED at approve" }
      - { name: net_contract_value_cents, type: integer, source: computed, description: "total_contract_value_cents - trade_in_credit_cents, floored at 0" }
      - { name: monthly_rate_cents, type: integer, source: computed, description: "round_half_up(net_contract_value_cents / cycle_months)" }
      - { name: billed_to_date_cents, type: integer, source: computed, default: 0, description: "Billed portion of net value; advanced by rollover while ACTIVE" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "net_contract_value_cents - billed_to_date_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SPEC_REVIEW | APPROVED | ACTIVE | TURNOVER_IN_PROGRESS | CLOSED | CANCELLED", description: "Lease lifecycle" }

  - name: LeaseUnit
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> FleetLease.id; owning lease" }
      - { name: model_id, type: string, source: system, description: "FK -> EquipmentModel.id; from lease line" }
      - { name: unit_seq, type: integer, source: system, description: "1-based sequence within lease from line expansion; canonical list sort key" }
      - { name: serial_number, type: string, source: input, description: "Factory serial; assigned at DELIVERED; unique per model" }
      - { name: hours_used, type: integer, source: input, description: "Engine hours recorded at RETURNED" }
      - { name: condition_grade, type: enum, source: input, constraints: "A | B | C | D", description: "Condition grade recorded at RETURNED" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical instant of DELIVERED transition" }
      - { name: returned_at, type: datetime, source: system, description: "Logical instant of RETURNED transition" }
      - { name: asking_price_cents, type: integer, source: computed, description: "Current remarketing ask; decays one step per rollover while REMARKET_LISTED" }
      - { name: floor_price_cents, type: integer, source: computed, description: "Minimum ask; computed at REMARKET_LISTED" }
      - { name: sale_price_cents, type: integer, source: computed, description: "Final sale price captured at SOLD" }
      - { name: reserved_by_course_id, type: string, source: system, description: "FK -> GolfCourse.id; nullable; buyer course while RESERVED" }
      - { name: reservation_expires_at, type: datetime, source: system, description: "Nullable; reservation deadline while RESERVED" }
      - { name: status, type: enum, source: system, default: ORDERED, constraints: "ORDERED | DELIVERED | IN_SERVICE | RETURN_REQUESTED | RETURNED | REMARKET_LISTED | RESERVED | SOLD | RETIRED", description: "Unit lifecycle" }

  - name: TradeInAppraisal
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> FleetLease.id; the NEW lease this trade-in credits" }
      - { name: model_id, type: string, source: input, description: "FK -> EquipmentModel.id; model of the traded unit" }
      - { name: external_serial, type: string, source: input, description: "Serial of the traded unit (pre-system equipment)" }
      - { name: hours, type: integer, source: input, description: "Reported engine hours" }
      - { name: condition_grade, type: enum, source: input, constraints: "A | B | C | D", description: "Appraised condition" }
      - { name: policy, type: enum, source: input, constraints: "BOOK | MARKET", description: "Valuation variant selector" }
      - { name: book_value_cents, type: integer, source: computed, description: "BOOK variant result" }
      - { name: market_value_cents, type: integer, source: computed, description: "MARKET variant result" }
      - { name: valued_cents, type: integer, source: computed, description: "book_value_cents when policy=BOOK else market_value_cents" }
      - { name: status, type: enum, source: system, default: VALUED, constraints: "VALUED | ACCEPTED | DISPUTED | VOIDED | CREDITED", description: "Appraisal negotiation state" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; set from acting DistributorManager identity" }
      - { name: lease_unit_id, type: string, source: input, description: "FK -> LeaseUnit.id; unit under repair" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; repairing technician, must belong to same distributor" }
      - { name: labor_hours, type: number, source: input, description: "Claimed labor hours; > 0" }
      - { name: parts_cost_cents, type: integer, source: input, description: "Parts cost at distributor net" }
      - { name: claimed_labor_cents, type: integer, source: computed, description: "labor_hours x distributor.labor_rate_cents" }
      - { name: factory_allowance_cents, type: integer, source: computed, description: "labor_hours x model.warranty_labor_hourly_cap_cents" }
      - { name: approved_labor_hours, type: number, source: system, description: "Adjudicator-set hours on PARTIAL_APPROVED; else null" }
      - { name: adjudicated_labor_cents, type: integer, source: computed, description: "min over claimed vs factory allowance on effective hours" }
      - { name: parts_reimbursed_cents, type: integer, source: computed, description: "parts_cost_cents x (1 + CONST.PARTS_HANDLING_PCT), round_half_up" }
      - { name: payable_total_cents, type: integer, source: computed, description: "adjudicated_labor_cents + parts_reimbursed_cents" }
      - { name: paid_at, type: datetime, source: system, description: "Logical instant of PAID transition; null until paid" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | PARTIAL_APPROVED | DENIED | DISPUTED | PAID", description: "Claim adjudication state" }

  - name: IrrigationProject
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Distributor.id; set from acting IrrigationDealer identity (channel=IRRIGATION)" }
      - { name: course_id, type: string, source: input, description: "FK -> GolfCourse.id" }
      - { name: acreage, type: integer, source: input, description: "Irrigated acreage" }
      - { name: zone_count, type: integer, source: input, description: "Number of irrigation zones" }
      - { name: controller_model_id, type: string, source: system, description: "FK -> EquipmentModel.id; pinned at design submit" }
      - { name: controllers_required, type: integer, source: computed, description: "ceil(zone_count / CONST.ZONES_PER_CONTROLLER)" }
      - { name: design_fee_cents, type: integer, source: computed, description: "Design support fee per irrigation_design_spec" }
      - { name: water_budget_gpd, type: integer, source: computed, description: "Daily water budget gallons per irrigation_design_spec" }
      - { name: install_window_start, type: string, source: system, description: "Half-open install window start YYYY-MM-DD, set at design submit" }
      - { name: install_window_end, type: string, source: system, description: "Half-open install window end YYYY-MM-DD, set at design submit" }
      - { name: pinned_config_version, type: integer, source: system, description: "EquipmentModel.version of controller pinned at APPROVED" }
      - { name: controller_program_version, type: string, source: system, description: "Controller programming version recorded at COMMISSIONED" }
      - { name: status, type: enum, source: system, default: BRIEF, constraints: "BRIEF | DESIGN_SUBMITTED | APPROVED | INSTALLED | COMMISSIONED | CANCELLED", description: "Irrigation project pipeline" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Distributor
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /turf/distributors/{id}/compliance_review"
        actor: CorporateAdmin
        preconditions:
          - ">= 1 Technician with distributor_id == this id and cert_status == CERT_ACTIVE"
          - "territory_codes is non-empty"
        side_effects: ["status=ACTIVE"]
        note: "Failing preconditions leave status ONBOARDING; the review itself still returns 200."
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /turf/distributors/{id}/compliance_review"
        actor: CorporateAdmin
        preconditions:
          - "fill_rate < CONST.MIN_FILL_RATE OR stock_value_trailing_cents < min_parts_stock_value_cents"
        side_effects:
          - "Cascade C2 link 1: distributor standing mutates"
          - "Cascade C2 link 2: every FleetLease of this distributor in SPEC_REVIEW -> DRAFT (lease.version += 1)"
          - "Cascade C2 link 3: on each reverted lease, TradeInAppraisals in VALUED or DISPUTED -> VOIDED; ACCEPTED -> VALUED"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /turf/distributors/{id}/compliance_review"
        actor: CorporateAdmin
        preconditions:
          - "fill_rate >= CONST.MIN_FILL_RATE AND stock_value_trailing_cents >= min_parts_stock_value_cents"
        side_effects: ["status=ACTIVE"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /turf/distributors/{id}/compliance_review"
        actor: CorporateAdmin
        preconditions:
          - "fill_rate < CONST.MIN_FILL_RATE OR stock_value_trailing_cents < min_parts_stock_value_cents"
        side_effects: ["Same Cascade C2 links 2-3 fire again for any leases back in SPEC_REVIEW"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /turf/distributors/{id}/compliance_review"
        actor: CorporateAdmin
        preconditions:
          - "fill_rate >= CONST.MIN_FILL_RATE AND stock_value_trailing_cents >= min_parts_stock_value_cents"
        side_effects: ["status=ACTIVE (reinstatement)"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /turf/distributors/{id}/compliance_review"
        actor: CorporateAdmin
        preconditions:
          - "fill_rate < CONST.MIN_FILL_RATE OR stock_value_trailing_cents < min_parts_stock_value_cents"
        side_effects: ["Distributor becomes read-only; no new leases, orders, claims, or projects"]

  - entity: Technician
    initial_state: CERT_PENDING
    terminal_states: []
    transitions:
      - from: CERT_PENDING
        to: CERT_ACTIVE
        trigger: "POST /turf/technicians/{id}/certify"
        actor: CorporateAdmin
        preconditions: ["expires_at > current logical clock"]
        side_effects: ["cert_level and cert_expires_at set from payload"]
      - from: CERT_ACTIVE
        to: CERT_EXPIRED
        trigger: "system (run_season_rollover when cert_expires_at < current logical clock)"
        actor: system
        preconditions: []
        side_effects: ["Existing SUBMITTED claims stay; new claims naming this technician are rejected"]
      - from: CERT_EXPIRED
        to: CERT_ACTIVE
        trigger: "POST /turf/technicians/{id}/certify"
        actor: CorporateAdmin
        preconditions: ["expires_at > current logical clock"]
        side_effects: ["cert_level and cert_expires_at refreshed"]
        note: "Renewal loop makes this machine cyclic"

  - entity: GolfCourse
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ACTIVE_LEASE
        trigger: "system (side effect of FleetLease APPROVED -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE_LEASE
        to: IN_RENEWAL
        trigger: "system (Cascade C1 link 3: owning FleetLease TURNOVER_IN_PROGRESS -> CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_RENEWAL
        to: ACTIVE_LEASE
        trigger: "system (side effect of next FleetLease APPROVED -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Course cycles between ACTIVE_LEASE and IN_RENEWAL across replacement cycles"

  - entity: EquipmentModel
    initial_state: CATALOG_ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: CATALOG_ACTIVE
        to: DISCONTINUED
        trigger: "system (run_season_rollover when created_at + CONST.MODEL_SALES_WINDOW_MONTHS < current logical clock)"
        actor: system
        preconditions: []
        side_effects:
          - "New lease lines referencing the model rejected (ERR_MODEL_DISCONTINUED)"
          - "Pending irrigation design approvals referencing the model rejected (ERR_STALE_REFERENCE)"
          - "Parts and warranty claims remain admissible (kept-in-service commitment)"

  - entity: Part
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: LAST_BUY
        trigger: "POST /turf/parts/{id}/transition {to: LAST_BUY}"
        actor: CorporateAdmin
        preconditions: []
        side_effects: []
      - from: LAST_BUY
        to: DISCONTINUED
        trigger: "POST /turf/parts/{id}/transition {to: DISCONTINUED}"
        actor: CorporateAdmin
        preconditions: []
        side_effects: ["New parts order lines naming this part rejected (ERR_PART_DISCONTINUED)"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /turf/parts/{id}/transition {to: SUPERSEDED, successor_part_id}"
        actor: CorporateAdmin
        preconditions:
          - "successor_part_id references an existing Part with support_status == ACTIVE"
          - "walking superseded_by_part_id from the successor never reaches this part (cycle check, ERR_SUPERSESSION_CYCLE)"
        side_effects: ["superseded_by_part_id set"]
        note: "Supersession chains form an acyclic directed graph; cycle check is the graph constraint"

  - entity: PartsOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /turf/parts-orders/{id}/transition {to: SUBMITTED}"
        actor: DistributorManager
        preconditions:
          - "lines non-empty and every line qty >= 1 (ERR_EMPTY_ORDER / ERR_ZERO_QUANTITY_LINE at create; re-checked here)"
          - "every referenced Part has support_status in {ACTIVE, LAST_BUY} (ERR_PART_DISCONTINUED)"
          - "distributor.status == ACTIVE (ERR_DISTRIBUTOR_NOT_ACTIVE)"
          - "distributor.channel == EQUIPMENT (ERR_WRONG_CHANNEL)"
        side_effects:
          - "Run offseason_incentive_discount: sets off_season_applied, discount_tier_pct, subtotal_cents, discount_cents, total_cents, ordered_units"
          - "Distributor.committed_parts_cents += total_cents"
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "POST /turf/parts-orders/{id}/transition {to: ALLOCATED}"
        actor: CorporateAdmin
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /turf/parts-orders/{id}/transition {to: SHIPPED}"
        actor: CorporateAdmin
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /turf/parts-orders/{id}/transition {to: RECEIVED, received_lines}"
        actor: DistributorManager
        preconditions: ["every received_lines qty <= ordered qty for that part and >= 0"]
        side_effects:
          - "received_units = sum of received qty"
          - "Distributor.committed_parts_cents -= total_cents"
          - "Fill-rate and stock inputs recorded for next compliance review"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /turf/parts-orders/{id}/transition {to: CANCELLED}"
        actor: DistributorManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /turf/parts-orders/{id}/transition {to: CANCELLED}"
        actor: DistributorManager
        preconditions: []
        side_effects: ["Compensation: Distributor.committed_parts_cents -= total_cents; discount_cents voided with the order"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /turf/parts-orders/{id}/transition {to: CANCELLED}"
        actor: CorporateAdmin
        preconditions: []
        side_effects: ["Compensation: Distributor.committed_parts_cents -= total_cents"]

  - entity: FleetLease
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SPEC_REVIEW
        trigger: "POST /turf/leases/{id}/transition {to: SPEC_REVIEW, expected_lease_version}"
        actor: DistributorManager
        preconditions:
          - "acting distributor owns the lease and has channel == EQUIPMENT (ERR_WRONG_CHANNEL)"
          - "distributor.status == ACTIVE (ERR_DISTRIBUTOR_NOT_ACTIVE)"
          - "expected_lease_version == lease.version (ERR_STALE_LEASE_VERSION)"
        side_effects: ["spec_compliant recomputed per equipment_spec_compliance", "version += 1"]
      - from: SPEC_REVIEW
        to: DRAFT
        trigger: "POST /turf/leases/{id}/transition {to: DRAFT, expected_lease_version} OR system Cascade C2"
        actor: DistributorManager
        preconditions: ["expected_lease_version == lease.version for the API-driven path"]
        side_effects:
          - "Appraisals of this lease in VALUED or DISPUTED -> VOIDED; ACCEPTED -> VALUED"
          - "version += 1"
        note: "Revision loop: DRAFT -> SPEC_REVIEW -> DRAFT is legal and cyclic"
      - from: SPEC_REVIEW
        to: APPROVED
        trigger: "POST /turf/leases/{id}/transition {to: APPROVED, expected_lease_version}"
        actor: CorporateAdmin
        preconditions:
          - "expected_lease_version == lease.version (ERR_STALE_LEASE_VERSION)"
          - "distributor.status == ACTIVE (ERR_DISTRIBUTOR_NOT_ACTIVE)"
          - "spec_compliant == true (ERR_SPEC_VIOLATION)"
          - "no sibling lease of the same course in {APPROVED, ACTIVE, TURNOVER_IN_PROGRESS} whose closed [start_date, end_date] intersects this lease (ERR_LEASE_CYCLE_OVERLAP)"
          - "every referenced model lifecycle_status == CATALOG_ACTIVE (ERR_MODEL_DISCONTINUED)"
          - "total_contract_value_cents <= course.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Run fleet_lease_rate: base_value_cents, total_contract_value_cents, trade_in_credit_cents, net_contract_value_cents, monthly_rate_cents"
          - "billed_to_date_cents = 0; remaining_balance_cents = net_contract_value_cents"
          - "Appraisals of this lease in ACCEPTED -> CREDITED (trade-in credit locked)"
          - "version += 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /turf/leases/{id}/transition {to: ACTIVE, expected_lease_version}"
        actor: DistributorManager
        preconditions:
          - "expected_lease_version == lease.version (ERR_STALE_LEASE_VERSION)"
          - "current logical date >= start_date (ERR_LEASE_NOT_STARTED)"
        side_effects: ["GolfCourse of the lease: PROSPECT or IN_RENEWAL -> ACTIVE_LEASE", "version += 1"]
      - from: ACTIVE
        to: TURNOVER_IN_PROGRESS
        trigger: "system (run_season_rollover when current logical date >= end_date)"
        actor: system
        preconditions: []
        side_effects: ["Every LeaseUnit of this lease in IN_SERVICE -> RETURN_REQUESTED"]
      - from: TURNOVER_IN_PROGRESS
        to: CLOSED
        trigger: "system (Cascade C1 link 2: fires when the last unit leaves {ORDERED, DELIVERED, IN_SERVICE, RETURN_REQUESTED})"
        actor: system
        preconditions: []
        side_effects: ["Cascade C1 link 3: GolfCourse ACTIVE_LEASE -> IN_RENEWAL"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /turf/leases/{id}/transition {to: CANCELLED, expected_lease_version}"
        actor: DistributorManager
        preconditions: ["expected_lease_version == lease.version"]
        side_effects: ["Appraisals in VALUED or DISPUTED -> VOIDED; ACCEPTED -> VALUED", "version += 1"]
      - from: SPEC_REVIEW
        to: CANCELLED
        trigger: "POST /turf/leases/{id}/transition {to: CANCELLED, expected_lease_version}"
        actor: CorporateAdmin
        preconditions: ["expected_lease_version == lease.version"]
        side_effects: ["Same appraisal compensation as the DRAFT cancel path", "version += 1"]

  - entity: LeaseUnit
    initial_state: ORDERED
    terminal_states: [SOLD, RETIRED]
    transitions:
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /turf/units/{id}/transition {to: DELIVERED, serial_number}"
        actor: DistributorManager
        preconditions:
          - "owning lease status in {APPROVED, ACTIVE}"
          - "serial_number not used by any other unit of the same model (ERR_DUPLICATE_SERIAL)"
        side_effects: ["delivered_at = current logical clock"]
      - from: DELIVERED
        to: IN_SERVICE
        trigger: "POST /turf/units/{id}/transition {to: IN_SERVICE}"
        actor: CourseManager
        preconditions: ["acting course is the lease course (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: []
      - from: IN_SERVICE
        to: RETURN_REQUESTED
        trigger: "POST /turf/units/{id}/transition {to: RETURN_REQUESTED} OR system at lease turnover"
        actor: CourseManager
        preconditions: ["acting course is the lease course for the API-driven path"]
        side_effects: []
      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /turf/units/{id}/transition {to: RETURNED, hours_used, condition_grade}"
        actor: DistributorManager
        preconditions: ["acting distributor owns the lease"]
        side_effects:
          - "returned_at = current logical clock; hours_used and condition_grade recorded"
          - "Cascade C1 link 1->2: if every unit of the lease is outside {ORDERED, DELIVERED, IN_SERVICE, RETURN_REQUESTED}, FleetLease TURNOVER_IN_PROGRESS -> CLOSED"
      - from: RETURNED
        to: REMARKET_LISTED
        trigger: "POST /turf/units/{id}/transition {to: REMARKET_LISTED}"
        actor: DistributorManager
        preconditions: ["acting distributor owns the lease"]
        side_effects: ["Run remarketing_pricing: asking_price_cents and floor_price_cents set"]
      - from: REMARKET_LISTED
        to: RESERVED
        trigger: "POST /turf/units/{id}/transition {to: RESERVED}"
        actor: CourseManager
        preconditions: []
        side_effects: ["reserved_by_course_id = acting course", "reservation_expires_at = clock + CONST.RESERVATION_HOLD_DAYS"]
      - from: RESERVED
        to: SOLD
        trigger: "POST /turf/units/{id}/transition {to: SOLD}"
        actor: CourseManager
        preconditions: ["acting course == reserved_by_course_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["sale_price_cents = current asking_price_cents"]
      - from: RESERVED
        to: REMARKET_LISTED
        trigger: "system (run_season_rollover when reservation_expires_at < current logical clock)"
        actor: system
        preconditions: []
        side_effects: ["reserved_by_course_id and reservation_expires_at cleared"]
        note: "Reservation expiry loop makes REMARKET_LISTED <-> RESERVED cyclic"
      - from: REMARKET_LISTED
        to: RETIRED
        trigger: "POST /turf/units/{id}/transition {to: RETIRED}"
        actor: DistributorManager
        preconditions: ["acting distributor owns the lease"]
        side_effects: []

  - entity: TradeInAppraisal
    initial_state: VALUED
    terminal_states: [VOIDED, CREDITED]
    transitions:
      - from: VALUED
        to: ACCEPTED
        trigger: "POST /turf/appraisals/{id}/transition {to: ACCEPTED}"
        actor: CourseManager
        preconditions: ["acting course is the lease course", "owning lease status in {DRAFT, SPEC_REVIEW}"]
        side_effects: []
      - from: VALUED
        to: DISPUTED
        trigger: "POST /turf/appraisals/{id}/transition {to: DISPUTED}"
        actor: CourseManager
        preconditions: ["acting course is the lease course"]
        side_effects: []
      - from: DISPUTED
        to: VALUED
        trigger: "POST /turf/appraisals/{id}/transition {to: VALUED, hours?, condition_grade?, policy?}"
        actor: DistributorManager
        preconditions: ["acting distributor owns the lease"]
        side_effects: ["Optional overrides applied, then trade_in_valuation re-runs: book_value_cents, market_value_cents, valued_cents refreshed"]
        note: "Negotiation rounds make VALUED <-> DISPUTED cyclic"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /turf/appraisals/{id}/transition {to: VOIDED}"
        actor: DistributorManager
        preconditions: ["acting distributor owns the lease"]
        side_effects: []
      - from: VALUED
        to: VOIDED
        trigger: "system (Cascade C2 link 3 / lease cancel compensation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: VALUED
        trigger: "system (Cascade C2 link 3 / lease revert compensation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CREDITED
        trigger: "system (side effect of FleetLease SPEC_REVIEW -> APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["valued_cents folded into lease.trade_in_credit_cents"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /turf/warranty-claims/{id}/transition {to: UNDER_REVIEW, expected_claim_version}"
        actor: CorporateAdmin
        preconditions: ["expected_claim_version == claim.version (ERR_STALE_CLAIM_VERSION)"]
        side_effects: ["version += 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /turf/warranty-claims/{id}/transition {to: APPROVED, expected_claim_version}"
        actor: CorporateAdmin
        preconditions: ["expected_claim_version == claim.version"]
        side_effects: ["Run warranty_labor_adjudication with effective hours = labor_hours", "version += 1"]
      - from: UNDER_REVIEW
        to: PARTIAL_APPROVED
        trigger: "POST /turf/warranty-claims/{id}/transition {to: PARTIAL_APPROVED, expected_claim_version, approved_labor_hours}"
        actor: CorporateAdmin
        preconditions: ["expected_claim_version == claim.version", "0 < approved_labor_hours < labor_hours"]
        side_effects: ["Run warranty_labor_adjudication with effective hours = approved_labor_hours", "version += 1"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /turf/warranty-claims/{id}/transition {to: DENIED, expected_claim_version}"
        actor: CorporateAdmin
        preconditions: ["expected_claim_version == claim.version"]
        side_effects: ["version += 1"]
      - from: DENIED
        to: DISPUTED
        trigger: "POST /turf/warranty-claims/{id}/transition {to: DISPUTED, expected_claim_version}"
        actor: DistributorManager
        preconditions: ["acting distributor owns the claim", "expected_claim_version == claim.version"]
        side_effects: ["version += 1"]
      - from: PARTIAL_APPROVED
        to: DISPUTED
        trigger: "POST /turf/warranty-claims/{id}/transition {to: DISPUTED, expected_claim_version}"
        actor: DistributorManager
        preconditions: ["acting distributor owns the claim", "expected_claim_version == claim.version"]
        side_effects: ["version += 1"]
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /turf/warranty-claims/{id}/transition {to: UNDER_REVIEW, expected_claim_version}"
        actor: CorporateAdmin
        preconditions: ["expected_claim_version == claim.version"]
        side_effects: ["version += 1"]
        note: "Re-review loop makes UNDER_REVIEW -> DENIED/PARTIAL_APPROVED -> DISPUTED -> UNDER_REVIEW cyclic"
      - from: APPROVED
        to: PAID
        trigger: "POST /turf/warranty-claims/{id}/transition {to: PAID, expected_claim_version}"
        actor: CorporateAdmin
        preconditions:
          - "expected_claim_version == claim.version"
          - "distributor claims_paid_ytd_cents + payable_total_cents <= distributor.annual_claim_cap_cents (ERR_CLAIM_CAP_EXCEEDED)"
        side_effects: ["paid_at = clock", "Distributor.service_credit_balance_cents += payable_total_cents", "version += 1"]
      - from: PARTIAL_APPROVED
        to: PAID
        trigger: "POST /turf/warranty-claims/{id}/transition {to: PAID, expected_claim_version}"
        actor: CorporateAdmin
        preconditions: ["same as APPROVED -> PAID"]
        side_effects: ["same as APPROVED -> PAID"]

  - entity: IrrigationProject
    initial_state: BRIEF
    terminal_states: [COMMISSIONED, CANCELLED]
    transitions:
      - from: BRIEF
        to: DESIGN_SUBMITTED
        trigger: "POST /turf/irrigation-projects/{id}/transition {to: DESIGN_SUBMITTED, controller_model_id, install_window_start, install_window_end}"
        actor: IrrigationDealer
        preconditions:
          - "controller model exists, has category IRRIGATION_CONTROLLER and lifecycle_status == CATALOG_ACTIVE (ERR_MODEL_DISCONTINUED)"
          - "install_window_end > current logical date (ERR_WINDOW_IN_PAST)"
          - "install_window_start < install_window_end (ERR_INVALID_REQUEST)"
          - "no sibling project of the same course in {DESIGN_SUBMITTED, APPROVED, INSTALLED} whose half-open [start, end) intersects; adjacency allowed (ERR_WINDOW_OVERLAP)"
        side_effects: ["Run irrigation_design_spec: controllers_required, design_fee_cents, water_budget_gpd", "controller_model_id and window fields pinned on the project"]
      - from: DESIGN_SUBMITTED
        to: BRIEF
        trigger: "POST /turf/irrigation-projects/{id}/transition {to: BRIEF}"
        actor: IrrigationDealer
        preconditions: ["acting dealer owns the project"]
        side_effects: ["Design fields cleared for a fresh submission"]
        note: "Revision loop makes BRIEF <-> DESIGN_SUBMITTED cyclic"
      - from: DESIGN_SUBMITTED
        to: APPROVED
        trigger: "POST /turf/irrigation-projects/{id}/transition {to: APPROVED}"
        actor: CourseManager
        preconditions:
          - "acting course is the project course"
          - "pinned controller model still lifecycle_status == CATALOG_ACTIVE (ERR_STALE_REFERENCE)"
        side_effects: ["pinned_config_version = current EquipmentModel.version of the controller model"]
      - from: APPROVED
        to: INSTALLED
        trigger: "POST /turf/irrigation-projects/{id}/transition {to: INSTALLED}"
        actor: IrrigationDealer
        preconditions: ["current logical date >= install_window_start (ERR_LEASE_NOT_STARTED)"]
        side_effects: []
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /turf/irrigation-projects/{id}/transition {to: COMMISSIONED, controller_program_version}"
        actor: IrrigationDealer
        preconditions: ["acting dealer owns the project"]
        side_effects: ["controller_program_version recorded"]
      - from: BRIEF
        to: CANCELLED
        trigger: "POST /turf/irrigation-projects/{id}/transition {to: CANCELLED}"
        actor: IrrigationDealer
        preconditions: []
        side_effects: []
      - from: DESIGN_SUBMITTED
        to: CANCELLED
        trigger: "POST /turf/irrigation-projects/{id}/transition {to: CANCELLED}"
        actor: IrrigationDealer
        preconditions: []
        side_effects: ["Window occupation released"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: lease-transition-stale-version
    parent_entity: FleetLease
    write_endpoint: "POST /turf/leases/{id}/transition"
    occ_field: expected_lease_version
    description: |
      A lease transition request carrying an expected_lease_version that no
      longer equals the lease's current version is rejected. This captures the
      case where another writer has just advanced the lease (submit, approve,
      or a cascade-driven revert) and the current writer's view is stale.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
  - rule_id: claim-transition-stale-version
    parent_entity: WarrantyClaim
    write_endpoint: "POST /turf/warranty-claims/{id}/transition"
    occ_field: expected_claim_version
    description: |
      A claim transition request carrying an expected_claim_version that no
      longer equals the claim's current version is rejected. This captures the
      case where another adjudication step has already advanced the claim and
      the current writer's view is stale.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fleet_lease_rate
    description: "Monthly fleet lease rate from unit mix, course tier, delivery seasonality, and trade-in credit"
    trigger: "FleetLease SPEC_REVIEW -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      base_value_cents = sum over lines of (model.list_price_cents * qty)
      tier_mult = TIER_MULTIPLIER_CHAMPIONSHIP if course.cut_quality_standard == CHAMPIONSHIP
                  else TIER_MULTIPLIER_CLUB if CLUB else TIER_MULTIPLIER_MAINTENANCE
      seasonal = SPRING_PEAK_FACTOR if month(start_date) in SPRING_PEAK_MONTHS else 1.00
      total_contract_value_cents = round_half_up(base_value_cents * tier_mult * seasonal)
      trade_in_credit_cents = sum of valued_cents over appraisals of this lease moving to CREDITED
      net_contract_value_cents = max(0, total_contract_value_cents - trade_in_credit_cents)
      monthly_rate_cents = round_half_up(net_contract_value_cents / cycle_months)
      Pinned rounding order: round the tier x seasonal product ONCE, subtract the
      credit, then round the monthly division ONCE. No per-line rounding.
    input_set: "Lease lines and their EquipmentModels; the lease course; ACCEPTED appraisals of this lease"
    constants:
      TIER_MULTIPLIER_CHAMPIONSHIP: 1.15
      TIER_MULTIPLIER_CLUB: 1.08
      TIER_MULTIPLIER_MAINTENANCE: 1.00
      SPRING_PEAK_MONTHS: [3, 4, 5]
      SPRING_PEAK_FACTOR: 1.06
    precision: "integer cents; round_half_up at the two pinned steps only"
    variants:
      - name: credit_amortized
        when: "at least one appraisal is CREDITED at approve time"
        difference: "monthly rate divides the credit-reduced net value; with zero credit it divides the full contract value"
  - name: trade_in_valuation
    description: "Dual-variant valuation of a traded fleet unit (book schedule vs market index)"
    trigger: "TradeInAppraisal creation, and again on every DISPUTED -> VALUED revaluation"
    algorithm: weighted_scoring
    formula: |
      age_months = whole months between the lease course's previous fleet delivery
                   context and the appraisal; pinned to the appraisal input set as
                   hours-based usage: BOOK uses the age_months input derived from
                   (current logical date - model launch proxy). For determinism the
                   appraisal carries an explicit age_months via hours/MONTHLY_HOURS_NORM.
      age_months = floor(hours / MONTHLY_HOURS_NORM)
      book_raw = model.list_price_cents * (1 - age_months / BOOK_DEPRECIATION_MONTHS)
      book_value_cents = round_half_up(max(book_raw, model.list_price_cents * BOOK_RESIDUAL_FLOOR_PCT))
      hours_factor = 1 - (min(hours, MARKET_HOURS_CAP) / MARKET_HOURS_CAP) * MARKET_HOURS_DECAY_PCT
      cond_mult = CONDITION_MULTIPLIER_A|_B|_C|_D by condition_grade
      market_value_cents = round_half_up(model.list_price_cents * MARKET_BASE_PCT * cond_mult * hours_factor)
      valued_cents = book_value_cents when policy == BOOK else market_value_cents
    input_set: "The appraisal's model, hours, condition_grade, policy"
    constants:
      MONTHLY_HOURS_NORM: 50
      BOOK_DEPRECIATION_MONTHS: 84
      BOOK_RESIDUAL_FLOOR_PCT: 0.15
      MARKET_BASE_PCT: 0.60
      MARKET_HOURS_CAP: 4000
      MARKET_HOURS_DECAY_PCT: 0.50
      CONDITION_MULTIPLIER_A: 1.00
      CONDITION_MULTIPLIER_B: 0.85
      CONDITION_MULTIPLIER_C: 0.70
      CONDITION_MULTIPLIER_D: 0.50
    precision: "integer cents; round_half_up once per variant at the final step"
    variants:
      - name: book_schedule
        when: "policy == BOOK"
        difference: "straight-line depreciation over 84 months with a 15% residual floor; ignores condition grade"
      - name: market_index
        when: "policy == MARKET"
        difference: "60% base of list, scaled by condition multiplier and hours decay; ignores depreciation schedule"
  - name: offseason_incentive_discount
    description: "Off-season STOCK order incentive with per-line rounding pinned"
    trigger: "PartsOrder DRAFT -> SUBMITTED"
    algorithm: tiered_pricing
    formula: |
      Applies only when order_type == STOCK and month(current logical clock) in OFF_SEASON_MONTHS.
      subtotal_cents = sum over lines of (qty * part.unit_cost_cents)
      tier_pct = TIER2_PCT when subtotal_cents >= TIER2_THRESHOLD_CENTS
                 else TIER1_PCT when subtotal_cents >= TIER1_THRESHOLD_CENTS
                 else BASE_PCT
      PINNED ROUNDING ORDER (per-line then sum):
        line_discount_cents[line] = round_half_up(qty * unit_cost_cents * tier_pct)
        discount_cents = sum of line_discount_cents
      (Sum-then-round would produce different cents; it is NOT the rule.)
      total_cents = subtotal_cents - discount_cents
      When the incentive does not apply: off_season_applied=false, discount_tier_pct=0, discount_cents=0.
    input_set: "PartsOrder lines with their Parts; logical clock month at submit"
    constants:
      OFF_SEASON_MONTHS: [11, 12, 1, 2]
      TIER2_THRESHOLD_CENTS: 200000
      TIER2_PCT: 0.12
      TIER1_THRESHOLD_CENTS: 50000
      TIER1_PCT: 0.07
      BASE_PCT: 0.03
    precision: "integer cents; per-line round_half_up then sum (pinned)"
  - name: warranty_labor_adjudication
    description: "Dual-variant labor valuation adjudicated between distributor rate and factory allowance"
    trigger: "WarrantyClaim UNDER_REVIEW -> APPROVED or PARTIAL_APPROVED"
    algorithm: constraint_propagation
    formula: |
      effective_hours = labor_hours on APPROVED; approved_labor_hours on PARTIAL_APPROVED
      claimed path: claimed_labor_cents = labor_hours * distributor.labor_rate_cents (always computed at creation)
      factory path: factory_allowance_cents = labor_hours * model.warranty_labor_hourly_cap_cents (at creation)
      adjudicated_labor_cents = min(effective_hours * distributor.labor_rate_cents,
                                    effective_hours * model.warranty_labor_hourly_cap_cents)
      parts_reimbursed_cents = round_half_up(parts_cost_cents * (1 + PARTS_HANDLING_PCT))
      payable_total_cents = adjudicated_labor_cents + parts_reimbursed_cents
    input_set: "The claim, its distributor (rate), its unit's model (factory cap)"
    constants:
      PARTS_HANDLING_PCT: 0.10
    precision: "integer cents; round_half_up on the parts reimbursement only"
    variants:
      - name: distributor_claimed
        when: "what the distributor bills"
        difference: "labor priced at distributor.labor_rate_cents; higher when the distributor rate exceeds the factory cap"
      - name: factory_allowance
        when: "what the factory allows"
        difference: "labor priced at model.warranty_labor_hourly_cap_cents; the payable adjudication takes the min of the two"

  - name: parts_stocking_compliance
    description: "Quarterly stocking-obligation and fill-rate evaluation driving distributor standing"
    trigger: "POST /turf/distributors/{id}/compliance_review"
    algorithm: threshold
    formula: |
      window = orders of this distributor with status == RECEIVED and
               created_at in [review_date - REVIEW_WINDOW_DAYS, review_date] (both bounds inclusive)
      if window is empty: fill_rate = 1.0 (vacuous pass on fill rate)
      else: fill_rate = sum(received_units) / sum(ordered_units) over the window
      stock_value_trailing_cents = sum over window of (received qty x part.unit_cost_cents per line)
      fill_ok = (fill_rate >= MIN_FILL_RATE)         # boundary: exactly 0.92 passes
      stock_ok = (stock_value_trailing_cents >= min_parts_stock_value_cents)
      pass = fill_ok AND stock_ok
      Outcome mapping: ONBOARDING pass requires the technician/territory gate instead;
      ACTIVE: pass keeps ACTIVE, fail -> PROBATION; PROBATION: pass -> ACTIVE, fail -> SUSPENDED;
      SUSPENDED: pass -> ACTIVE, fail -> TERMINATED.
    input_set: "Distributor's RECEIVED parts orders in the trailing 365-day window (CANCELLED and in-flight orders excluded)"
    constants:
      MIN_FILL_RATE: 0.92
      REVIEW_WINDOW_DAYS: 365
    precision: "fill_rate compared as exact rational arithmetic; the 0.92 boundary is inclusive"
  - name: remarketing_pricing
    description: "Remarketing ask with per-rollover decay and a hard floor"
    trigger: "LeaseUnit RETURNED -> REMARKET_LISTED (initial ask); run_season_rollover (one decay step per run)"
    algorithm: decay_function
    formula: |
      At listing: asking_0 = round_half_up(model.list_price_cents * REMARKET_BASE_PCT * condition_mult)
      where condition_mult uses CONDITION_MULTIPLIER_A..D from trade_in_valuation.
      floor_price_cents = round_half_up(asking_0 * FLOOR_PCT)
      Each rollover while status == REMARKET_LISTED applies exactly one step:
        asking_price_cents = max(floor_price_cents, round_half_up(asking_price_cents * (1 - WEEKLY_DECAY_PCT)))
      PINNED: decay compounds per rollover run with round_half_up at every step;
      reservation expiry clears reservation fields but does not change the ask.
    input_set: "The unit's model list price and return condition grade"
    constants:
      REMARKET_BASE_PCT: 0.55
      WEEKLY_DECAY_PCT: 0.02
      FLOOR_PCT: 0.60
      RESERVATION_HOLD_DAYS: 7
    precision: "integer cents; round_half_up at listing and at every decay step"
  - name: irrigation_design_spec
    description: "Irrigation design support fee, controller count, and water budget with pinned evaluation order"
    trigger: "IrrigationProject BRIEF -> DESIGN_SUBMITTED"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (controllers feed the fee; the fee never feeds controllers):
      1. controllers_required = ceil(zone_count / ZONES_PER_CONTROLLER)
      2. design_fee_cents = BASE_DESIGN_FEE_CENTS
                            + controllers_required * CONTROLLER_FEE_CENTS
                            + acreage * ACRE_FEE_CENTS
      3. water_budget_gpd = acreage * GPD_PER_ACRE for the course turf_profile
      The circular-looking dependency (fee depends on controllers, controllers depend
      on zones) is resolved by this fixed order; no iteration.
    input_set: "Project acreage and zone_count; the course turf_profile"
    constants:
      ZONES_PER_CONTROLLER: 8
      BASE_DESIGN_FEE_CENTS: 250000
      CONTROLLER_FEE_CENTS: 45000
      ACRE_FEE_CENTS: 12000
      GPD_PER_ACRE_BENTGRASS: 22000
      GPD_PER_ACRE_BERMUDA: 16000
      GPD_PER_ACRE_POA_ANNUA: 20000
      GPD_PER_ACRE_MIXED: 18000
    precision: "integer cents and gallons; ceil on controllers"
  - name: equipment_spec_compliance
    description: "Course turf and cut-quality standard vs the leased equipment mix"
    trigger: "FleetLease DRAFT -> SPEC_REVIEW (recomputed on every submit)"
    algorithm: constraint_propagation
    formula: |
      required_tiers = {TOURNAMENT} when course.cut_quality_standard == CHAMPIONSHIP
                       {TOURNAMENT, PRO} when CLUB
                       {TOURNAMENT, PRO, STANDARD} when MAINTENANCE
      spec_compliant = for EVERY lease line: model.tier in required_tiers
                       AND course.turf_profile in model.eligible_turf_types
      A single violating line makes the whole lease non-compliant.
    input_set: "Lease lines with their EquipmentModels; the lease course"
    constants:
      CHAMPIONSHIP_TIERS: [TOURNAMENT]
      CLUB_TIERS: [TOURNAMENT, PRO]
      MAINTENANCE_TIERS: [TOURNAMENT, PRO, STANDARD]
    precision: "boolean; no partial credit"
  - name: lease_billing_progression
    description: "Monthly billing against the net contract value with final-remainder absorption"
    trigger: "run_season_rollover (for every ACTIVE lease)"
    algorithm: chronological
    formula: |
      elapsed_months = whole months between start_date and the current logical date,
                       clamped to [0, cycle_months]
      Per-month rounding is absorbed by the FINAL month, not spread:
      months 1..cycle_months-1 bill exactly monthly_rate_cents; the final month bills
      net_contract_value_cents - (cycle_months - 1) * monthly_rate_cents.
      Equivalently: billed_to_date_cents =
        min(net_contract_value_cents, elapsed_months * monthly_rate_cents)
        for elapsed_months < cycle_months, else net_contract_value_cents.
      remaining_balance_cents = net_contract_value_cents - billed_to_date_cents
      INVARIANT (compensating invariant INV-1): at every observable instant,
        billed_to_date_cents + remaining_balance_cents == net_contract_value_cents
    input_set: "ACTIVE leases; logical clock"
    constants: {}
    precision: "integer cents; no rounding beyond the pinned monthly rate"
  - name: model_sales_window_expiry
    description: "Catalog aging: models leave sale after their sales window"
    trigger: "run_season_rollover"
    algorithm: threshold
    formula: |
      For every EquipmentModel in CATALOG_ACTIVE:
        if created_at + MODEL_SALES_WINDOW_MONTHS < current logical clock:
          lifecycle_status = DISCONTINUED
      Boundary: age exactly == MODEL_SALES_WINDOW_MONTHS does NOT discontinue (strict >).
    input_set: "All CATALOG_ACTIVE models"
    constants:
      MODEL_SALES_WINDOW_MONTHS: 240
    precision: "month granularity; strict-greater boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed identity: X-User-ID resolves to an entity of the role's backing type, and for owned resources the resource's owner FK equals X-User-ID (lease.distributor_id, claim.distributor_id, project.dealer_id, unit.lease.course_id for course actions, unit.reserved_by_course_id for SOLD)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "all mutating endpoints of DistributorManager, CourseManager, IrrigationDealer"
  - priority: 4
    category: existence
    check: "Path and body references resolve left-to-right: distributor, technician, course, model, part, order, lease, unit, appraisal, claim, project"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, types match; parts order lines non-empty (ERR_EMPTY_ORDER); every line qty >= 1 (ERR_ZERO_QUANTITY_LINE); labor_hours > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"
  - priority: 6
    category: state
    check: "Transition is declared for the resource's current state (unknown or inapplicable target included); terminal states accept no transitions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_lease_version == lease.version on lease transitions; expected_claim_version == claim.version on claim transitions"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "POST /turf/leases/{id}/transition"
  - priority: 8
    category: state
    check: "OCC: expected_claim_version == claim.version on claim transitions"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /turf/warranty-claims/{id}/transition"
  - priority: 9
    category: business_referential
    check: "Territory integrity: lease course.assigned_distributor_id == acting distributor; claim technician belongs to the acting distributor; claim unit's lease belongs to the acting distributor"
    error_id: ERR_TERRITORY_MISMATCH
    http_status: 409
    applies_to: "POST /turf/leases, POST /turf/warranty-claims"
  - priority: 10
    category: business_temporal
    check: "Lease start_date not before current logical date (ERR_WINDOW_IN_PAST); new lease closed [start,end] must not intersect a sibling APPROVED|ACTIVE|TURNOVER_IN_PROGRESS lease of the same course (ERR_LEASE_CYCLE_OVERLAP); irrigation window end after current date (ERR_WINDOW_IN_PAST) and half-open non-overlap (ERR_WINDOW_OVERLAP); claim unit age within factory_warranty_months (ERR_WARRANTY_EXPIRED)"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /turf/leases, POST /turf/irrigation-projects/{id}/transition, POST /turf/warranty-claims"
  - priority: 11
    category: business_safety
    check: "Technician cert_status == CERT_ACTIVE on claim create (ERR_TECHNICIAN_CERT_INVALID); parts order lines reference parts in ACTIVE|LAST_BUY (ERR_PART_DISCONTINUED); lease lines and irrigation controller reference CATALOG_ACTIVE models (ERR_MODEL_DISCONTINUED); irrigation approve requires pinned controller still CATALOG_ACTIVE (ERR_STALE_REFERENCE)"
    error_id: ERR_TECHNICIAN_CERT_INVALID
    http_status: 409
    applies_to: "POST /turf/warranty-claims, POST /turf/parts-orders, POST /turf/leases, POST /turf/irrigation-projects/{id}/transition"
  - priority: 12
    category: business_constraint
    check: "Distributor channel matches workflow (ERR_WRONG_CHANNEL); distributor.status == ACTIVE where required (ERR_DISTRIBUTOR_NOT_ACTIVE); spec_compliant on approve (ERR_SPEC_VIOLATION); serial unique per model (ERR_DUPLICATE_SERIAL); supersession acyclicity (ERR_SUPERSESSION_CYCLE)"
    error_id: ERR_WRONG_CHANNEL
    http_status: 422
    applies_to: "workflow-scoped endpoints"
  - priority: 13
    category: business_fiscal
    check: "Lease total_contract_value_cents <= course.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED); claim PAID only while claims_paid_ytd_cents + payable_total_cents <= annual_claim_cap_cents (ERR_CLAIM_CAP_EXCEEDED)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /turf/leases/{id}/transition, POST /turf/warranty-claims/{id}/transition"

