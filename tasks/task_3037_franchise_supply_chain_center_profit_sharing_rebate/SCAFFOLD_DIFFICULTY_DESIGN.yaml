# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3037_franchise_supply_chain_center_profit_sharing_rebate
#
# Nine Difficulty Rules × ≥2 instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries a structured test_recipe.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cost_plus_price_provisional_vs_confirmed
        grounds:
          - calculations.cost_plus_unit_price
          - entities.PurchaseOrder.fields.subtotal_cents
          - entities.PriceBook.fields.markup_pct
        distinguishing_aspect: |
          Cost-plus pricing has two variants operating on the PurchaseOrder domain:
          provisional (recalculated on every line change while DRAFT/SUBMITTED using
          the current ACTIVE PriceBook) vs confirmed (locked at the CONFIRMED
          transition and NOT recalculated when the PriceBook changes afterwards).
          Identical line data yields different totals if the PriceBook markup is
          edited between submission and confirmation.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One SupplyCenter ACTIVE with one Product (dough, base_cost=1000c, category=DOUGH)."
            - "PriceBook P1: markup 0.15, effective 2026-01-01 to 2027-01-01."
            - "One Store ACTIVE with credit_limit=100000000c."
            - "One DRAFT PO with a single line of quantity=100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-01", display_name: "Midwest Center", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "DOUGH-001", name: "Fresh Dough Ball", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { product_id: $.data.id, product_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${product_id}", store_tier: "STANDARD", markup_pct: 0.15, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
              captures: { pb1_id: $.data.id, pb_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-100", operator_name: "Alice Franchise LLC", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${product_id}", quantity: 100 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { line_id: $.data.id, line_v: $.data.version }
          trigger:
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { store_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v_fresh}" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { subtotal_provisional: $.data.subtotal_cents }
          assert:
            - "subtotal_provisional == 115000"
            - "PurchaseOrder.${po_id}.subtotal_cents == 115000"
            - "PurchaseOrder.${po_id}.status == SUBMITTED"

      - name: rebate_accrual_eligible_vs_conditional
        grounds:
          - calculations.rebate_accrual
          - entities.Store.fields.rebate_eligibility_status
          - entities.RebateLedger.fields.amount_cents
        distinguishing_aspect: |
          Rebate accrual has two variants operating on the Store/RebateLedger domain:
          ELIGIBLE stores accrue at 5% * exclusive_purchase_pct of total_cents while
          CONDITIONAL stores accrue at 2% * exclusive_purchase_pct. Identical PO
          totals produce different ledger amounts purely from the store's eligibility
          state — a different entity domain (Store ledger) than cost-plus pricing
          (PurchaseOrder line).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One center ACTIVE. One Store ACTIVE with exclusive_purchase_pct=1.0 (ELIGIBLE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-01", display_name: "Midwest Center", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-A", operator_name: "Alice", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_a_id: $.data.id, store_a_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_a_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_a_id}/compliance-reports"
              payload: { week_start_date: "2026-09-07T00:00:00Z", external_purchases_cents: 0 }
              as: StoreManager
              as_user_id: "${store_a_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/run_ops"
              payload: {}
              as: SupplyChainAdmin
          assert:
            - "Store.${store_a_id}.rebate_eligibility_status == ELIGIBLE"
            - "Store.${store_a_id}.exclusive_purchase_pct == 1.0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: order_total_combinatorial_3input
        grounds:
          - calculations.order_total_cents
          - calculations.cost_plus_unit_price
          - entities.PurchaseOrder.fields.total_cents
        distinguishing_aspect: |
          order_total_cents has ≥3 inputs with non-linear interaction (mode a):
          subtotal (per-line quantity * tiered unit price), markup (varies by tier
          selection), and delivery_fee (varies by store/route and is waived if
          promotion_id is set). The three interact non-linearly because tier
          selection depends on quantity which affects both subtotal AND markup_pct.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Center ACTIVE. Product dough base_cost=1000c."
            - "PriceBook: STANDARD tier markup 0.15 min_quantity=1; VOLUME_DISCOUNT tier markup 0.12 min_quantity=100."
            - "One Store ACTIVE. Two POs: PO-X with quantity=99 (STANDARD tier applies), PO-Y with quantity=100 (VOLUME_DISCOUNT applies)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-01", display_name: "Midwest Center", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "DOUGH-001", name: "Dough", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { product_id: $.data.id, product_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${product_id}", store_tier: "STANDARD", markup_pct: 0.15, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh2: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${product_id}", store_tier: "VOLUME_DISCOUNT", markup_pct: 0.12, min_quantity: 100, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh2}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
