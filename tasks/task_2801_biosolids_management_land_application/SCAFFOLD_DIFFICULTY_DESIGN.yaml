            - call: "POST /application-events"
              payload: { site_id: "${site_id}", batch_id: "${batch_id}", agreement_id: "${agr_id}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", application_method: "SURFACE", acres_treated: 20.0, planned_dry_tons: 80.200 }
              as: Agronomist
