          Date-window boundary (different metric and endpoint from the seconds
          clock): posting a CERTIFIED 300A on Apr 30 of year+1 is inside the
          inclusive window; posting on May 01 is rejected ERR_POSTING_WINDOW.
          Metric = calendar date within [Feb 1, Apr 30]; endpoint =
          POST /safety/summaries/{id}/post.
