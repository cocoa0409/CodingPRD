  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: filing_disputed_state_cycles_back_to_normalized
        grounds:
          - state_machines.Filing.NORMALIZED_to_DISPUTED
          - state_machines.Filing.DISPUTED_to_NORMALIZED
          - state_machines.ExtractedField.NORMALIZED_to_CORRECTED
          - endpoints.POST_/nonprofits/filings/{id}/normalize
          - endpoints.POST_/nonprofits/correction-requests/{id}/decide
        distinguishing_aspect: |
          The Filing machine is cyclic on a different entity from the CorrectionRequest
          machine: NORMALIZED -> DISPUTED (driven by an accepted correction) then
          DISPUTED -> NORMALIZED (driven by POST /nonprofits/filings/{id}/normalize) returns the
          same row to a state it already occupied, without losing the CORRECTED field.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cascade Youth Trust is ACTIVE with a NORMALIZED filing whose single TOTREV revenue line normalized to 100000 cents."
            - "A CorrectionRequest against that line has been claimed and ACCEPTed with requested_value \"2000.00\", so the filing is DISPUTED and the field is CORRECTED."
          setup_api_calls:
            - *clock
            - &cy_org
              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Cascade Youth Trust", ein: "864209753", org_type: "501C3", state_code: "WA", ntee_code: "B82", mission_statement: "Scholarships and mentoring for first-generation students." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { cy_id: $.data.id, cy_v0: $.data.version }
            - &cy_prog
              call: "POST /nonprofits/organizations/${cy_id}/programs"
              payload: { program_name: "First-Gen Scholars", fiscal_year: 2025, subject_code: "B82", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
            - &cy_l1
              call: "POST /nonprofits/organizations/${cy_id}/leadership-members"
              payload: { full_name: "Maya Lindqvist", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${cy_id}"
            - &cy_l2
              call: "POST /nonprofits/organizations/${cy_id}/leadership-members"
              payload: { full_name: "Desmond Hale", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${cy_id}"
            - &cy_l3
              call: "POST /nonprofits/organizations/${cy_id}/leadership-members"
              payload: { full_name: "Farah Nasser", office_title: "Secretary", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${cy_id}"
            - &cy_verify
              call: "POST /nonprofits/organizations/${cy_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { cy_v1: $.data.version }
            - &cy_filing
              call: "POST /nonprofits/filings"
              payload: { organization_id: "${cy_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${cy_v1}" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_filing_id: $.data.id }
            - &cy_extract
              call: "POST /nonprofits/filings/${cy_filing_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1000.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - &cy_normalize
              call: "POST /nonprofits/filings/${cy_filing_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "GET /nonprofits/filings/${cy_filing_id}/extracted-fields"
              payload: {}
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_field: "$.data[0].id", cy_field_v: "$.data[0].version" }
            - call: "POST /nonprofits/extracted-fields/${cy_field}/correction-requests"
              payload: { requested_value: "2000.00", evidence_url: "https://evidence.example.org/cascade-2025-audited.pdf", justification: "The audited statement reports total revenue of 2000.00.", expected_extracted_field_version: "${cy_field_v}" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_cr: $.data.id }
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "CLAIM" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "ACCEPT" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "GET /nonprofits/filings/${cy_filing_id}"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { cy_filing_v_disputed: $.data.version }
            - call: "POST /nonprofits/filings/${cy_filing_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { cy_filing_v_renorm: $.data.version }
          assert:
            - "the GET trigger reports Filing.status == DISPUTED"
            - "the re-normalize trigger returns 200 and Filing.status == NORMALIZED"
            - "Filing.${cy_filing_id}.total_revenue_cents == 200000 both before and after re-normalization"
            - "ExtractedField.${cy_field}.normalization_status == CORRECTED before and after re-normalization"
            - "Filing.${cy_filing_id}.version after re-normalization is greater than the version the GET trigger observed"

      - name: correction_request_return_for_info_cycles_back_to_submitted
        grounds:
          - state_machines.CorrectionRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.CorrectionRequest.UNDER_REVIEW_to_SUBMITTED
          - state_machines.CorrectionRequest.UNDER_REVIEW_to_REJECTED
          - endpoints.POST_/nonprofits/correction-requests/{id}/decide
        distinguishing_aspect: |
          The CorrectionRequest machine is cyclic on an entity the Filing machine does not
          touch: SUBMITTED -> UNDER_REVIEW -> SUBMITTED -> UNDER_REVIEW -> REJECTED, and the
          REJECTED terminal leaves the target ExtractedField and its Filing completely untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cascade Youth Trust is ACTIVE with a NORMALIZED filing whose single TOTREV revenue line normalized to 100000 cents, and one SUBMITTED CorrectionRequest against that line."
          setup_api_calls:
            - *clock
            - *cy_org
            - *cy_prog
            - *cy_l1
            - *cy_l2
            - *cy_l3
            - *cy_verify
            - *cy_filing
            - *cy_extract
            - *cy_normalize
            - call: "GET /nonprofits/filings/${cy_filing_id}/extracted-fields"
              payload: {}
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_field: "$.data[0].id", cy_field_v: "$.data[0].version" }
            - call: "POST /nonprofits/extracted-fields/${cy_field}/correction-requests"
              payload: { requested_value: "2000.00", evidence_url: "https://evidence.example.org/cascade-2025-audited.pdf", justification: "The audited statement reports total revenue of 2000.00.", expected_extracted_field_version: "${cy_field_v}" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_cr: $.data.id }
          trigger:
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "CLAIM" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "RETURN_FOR_INFO", review_note: "Please attach the audited statement for fiscal 2025." }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "CLAIM" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "REJECT", review_note: "The filed return already matches the audited statement." }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          assert:
            - "the four trigger responses report statuses UNDER_REVIEW, SUBMITTED, UNDER_REVIEW, REJECTED in that order"
            - "CorrectionRequest.${cy_cr}.status == REJECTED and decided_by_user_id == \"ver-dana\""
            - "ExtractedField.${cy_field}.normalized_value_cents == 100000 and normalization_status == NORMALIZED"
            - "Filing.${cy_filing_id}.status == NORMALIZED and total_revenue_cents == 100000"
            - "Organization.${cy_id}.open_correction_count == 0 after the rejection"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: demographics_replacement_cascades_four_hops_to_seal_revocation
        grounds:
          - state_machines.TransparencySeal.ACTIVE_to_REVOKED
          - calculations.disclosure_pct
          - calculations.organization_derived_counters
          - endpoints.PATCH_/nonprofits/organizations/{id}
          - endpoints.POST_/nonprofits/organizations/{id}/seals
        distinguishing_aspect: |
          Depth-4 cascade from a profile PATCH: hop 1 replaces the DemographicRecord set,
          hop 2 recomputes Organization.disclosure_pct from 0.9000 to 0.8250, hop 3 revokes
          the ACTIVE PLATINUM seal because 0.8250 is below its 0.90 floor, and hop 4 clears
          Organization.transparency_seal_level to NONE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Meridian Relief Network is ACTIVE, INDEPENDENTLY_AUDITED, and holds one ACTIVE PLATINUM seal awarded at disclosure_pct 0.9000."
            - "Its demographic set is one PUBLIC AGE_BAND record, which is the only thing keeping the DEMOGRAPHICS disclosure dimension at 1.0."
