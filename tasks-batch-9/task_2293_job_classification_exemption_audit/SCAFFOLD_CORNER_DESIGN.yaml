          assert:
            - "JobChangeTrigger.${trg_id}.requires_reanalysis == true with reason_code DUTY_DELTA_EXCEEDED"
            - "the create with ${pos_v1} returns 412 with error_id ERR_STALE_POSITION_VERSION and creates nothing"
            - "${pos_v2} is strictly greater than ${pos_v1}"
            - "the create with ${pos_v2} returns 201 and ExemptionAnalysis.${an_id}.status == DRAFT with revision_round 0"
            - "GET /positions/${pos_id}/exemption-analyses returns exactly 1 row"

      - name: stale_case_version_blocks_the_back_wage_estimate_then_the_fresh_one_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-create-stale-case]", "errors[ERR_STALE_CASE_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "Covers concurrency rule estimate-create-stale-case: sending the notice advances the case version, so an estimate submitted against the version captured at case creation is refused with 412 ERR_STALE_CASE_VERSION; re-reading and retrying succeeds and writes the exposure. A second sequential estimate is legal by design, so only the version guard can reject the first attempt."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA (reclass_notice_days 7, liquidated multiplier 1.0, lookback override 156)."
            - "AuditProject FY26 with lookback_policy WILLFUL_3Y in FIELDWORK, one JobFamily, one Position (annual 5500000, incumbent_count 2, avg_weekly_hours 47, no interviews so validated_weekly_hours is 47 and weekly_ot_hours is 7)."
            - "One ReclassificationCase with window 2026-10-01 to 2026-10-31; its version at creation is captured as case_v1, then a SEND_NOTICE advances it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, liquidated_damages_multiplier: 1.0, reclass_notice_days: 7, back_wage_lookback_weeks_override: 156 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "WILLFUL_3Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
            - call: "POST /reclassification-cases"
              payload: { position_id: "${pos_id}", effective_date: "2026-10-01", effective_end_date: "2026-10-31", conversion_method: "SALARY_DIV_2080" }
              as: CompensationManager
              as_user_id: "cm-1"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /reclassification-cases/${case_id}/communication"
              payload: { action: "SEND_NOTICE", notice_channel: "EMAIL" }
              as: EmployeeRelationsLead
              as_user_id: "er-1"
          trigger:
            - call: "POST /back-wage-estimates"
              payload: { reclassification_case_id: "${case_id}", method: "FULL_RATE", expected_reclassification_case_version: "${case_v1}" }
              as: CompensationManager
              as_user_id: "cm-1"
            - call: "GET /reclassification-cases/${case_id}"
              payload: {}
              as: CompensationManager
              as_user_id: "cm-1"
              captures: { case_v2: $.data.version }
            - call: "POST /back-wage-estimates"
              payload: { reclassification_case_id: "${case_id}", method: "FULL_RATE", expected_reclassification_case_version: "${case_v2}" }
              as: CompensationManager
              as_user_id: "cm-1"
              captures: { est_id: $.data.id }
          assert:
            - "the estimate with ${case_v1} returns 412 with error_id ERR_STALE_CASE_VERSION and creates nothing"
            - "${case_v2} is strictly greater than ${case_v1}"
            - "the estimate with ${case_v2} returns 201 with lookback_weeks 156, weekly_ot_hours 7, week_ot_cents 27764, gross_exposure_cents 8662368 and total_exposure_cents 17324736"
            - "BackWageEstimate.${est_id}.status == ACTIVE and ReclassificationCase.${case_id}.exposure_cents == 17324736"
            - "AuditProject.${proj_id}.total_back_wage_exposure_cents == 0 because the Position is still UNREVIEWED and outside the rollup population"

      - name: corner_cascading_side_effects_across_the_full_chain
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers", "calculations.project_remediation_posture"]
        excluded_because:
          difficulty_instance: transitive_cascade / duties_change_trigger_cascades_six_hops_back_to_open_posture
          rationale: "That instance verifies a six-hop chain end to end with per-hop assertions, which is the N-level cascading-side-effects claim."

      - name: corner_dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers", "calculations.back_wage_exposure.variants"]
        excluded_because:
          difficulty_instance: dual_variant_calc / back_wage_full_rate_versus_half_time_diverge_on_identical_case
          rationale: "That instance runs both declared variants on identical inputs and pins the delta, which is the layer's claim."

      - name: corner_rate_threshold_trigger_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers", "calculations.exemption_test_evaluation"]
        excluded_because:
          difficulty_instance: boundary_precision_check / state_salary_floor_boundary_is_exact_to_the_cent
          rationale: "That instance tests the salary threshold exactly at and one cent below the boundary, which is the rate/threshold-trigger claim for this layer."

