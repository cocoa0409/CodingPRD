            - "Formula.${f1}.version == ${v_appr} + 1"
            - "first trigger call returns HTTP status == 409 with data.error_id == ERR_PINNED_FORMULA_STALE"
            - "ScaleUpBatch.${sb1}.status == REQUESTED and ScaleUpBatch.${sb1}.material_cost_cents is null and ScaleUpBatch.${sb1}.tolerance_spec == []"
            - "second trigger call returns HTTP status == 201 with ${sb2_pin} == ${v_appr} + 1"
            - "third trigger call returns HTTP status == 200 with sb2_total == 445000"
            - "ScaleUpBatch.${sb2}.material_cost_cents == 375000 and ScaleUpBatch.${sb2}.compounding_fee_pct == 12.0 and ScaleUpBatch.${sb2}.compounding_fee_cents == 45000"
            - "ScaleUpBatch.${sb2}.production_cost_per_kg_cents == 2967 and ScaleUpBatch.${sb2}.status == TOLERANCE_SET"

      - name: component_count_and_weight_sum_reconcile_after_add_cost_delete_and_re_add
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Formula.fields.component_count
          - entities.Formula.fields.total_weight_pct
          - state_machines.Formula.COSTED_to_DRAFT
          - calculations.formula_bench_cost
        distinguishing_aspect: "The pair of derived fields is re-read after five successive edits on one formula - add, add, cost, delete, re-add, re-cost - and the cost invalidation on the delete clears contribution_cents on the surviving line as well, so the second costing recomputes 1200 and 800 from scratch rather than reusing the stale line values."
        test_recipe:
          setup:
            - "Brief BRF-0001 accepted; formula F1 exists with no components, so component_count == 0 and total_weight_pct == 0.0000."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id", f1_count0: "$.data.component_count", f1_sum0: "$.data.total_weight_pct" }
          trigger:
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 60.0 }
              as: Flavorist
              captures: { c_keep: "$.data.id" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 40.0 }
              as: Flavorist
              captures: { c_drop: "$.data.id" }
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
              captures: { bench_1: "$.data.bench_cost_per_kg_cents" }
            - call: "DELETE /formula-components/${c_drop}"
              payload: {}
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 40.0 }
              as: Flavorist
              captures: { c_new: "$.data.id" }
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
              captures: { bench_2: "$.data.bench_cost_per_kg_cents" }
          assert:
            - "f1_count0 == 0 and f1_sum0 == 0.0000"
            - "after trigger 1: Formula.${f1}.component_count == 1 and Formula.${f1}.total_weight_pct == 60.0000"
            - "after trigger 2: Formula.${f1}.component_count == 2 and Formula.${f1}.total_weight_pct == 100.0000"
            - "bench_1 == 2000 with FormulaComponent.${c_keep}.contribution_cents == 1200 and FormulaComponent.${c_drop}.contribution_cents == 800"
            - "after trigger 4: HTTP status == 204, Formula.${f1}.status == DRAFT, component_count == 1, total_weight_pct == 60.0000, bench_cost_per_kg_cents is null and FormulaComponent.${c_keep}.contribution_cents is null"
            - "after trigger 5: Formula.${f1}.component_count == 2 and Formula.${f1}.total_weight_pct == 100.0000 and Formula.${f1}.status == DRAFT"
            - "bench_2 == 2000 with FormulaComponent.${c_keep}.contribution_cents == 1200 and FormulaComponent.${c_new}.contribution_cents == 800"
            - "GET /formula-components?formula_id=${f1} returns total_count == 2"

      - name: multi_link_cascade_chain_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / kosher_certificate_revocation_four_link_compliance_cascade
          rationale: "That instance already walks the four-link chain certificate -> material -> formula -> lot -> shipment plus the independent batch and forecast fan-out, asserting every intermediate row, which is the whole cascading_side_effects claim for this domain."

      - name: both_calculation_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_in_use_bench_vs_firm_variant_divergence
          rationale: "That instance pins both cost-in-use variants from one component set and the volume-discount and yield-loss delta between them, and dual_variant_calc / forecast_risk_weighted_vs_committed_variant_divergence covers the second variant pair with its reconciliation on close, leaving nothing for a separate corner instance."

  - section: consistency_model
    instances:
      - name: computed_and_cross_dimension_values_appear_in_the_same_mutating_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /formulas/{formula_id}/cost]
          - endpoints[POST /sample-lots/{lot_id}/qc]
          - response_envelope.success
        distinguishing_aspect: "Under the immediate model the write response is already the settled row: the costing response itself carries bench_cost_per_kg_cents, both cost-in-use variants and all four claim-profile fields, and the FAILED qc response carries the other state dimension's SCRAPPED value in the same body - a follow-up read returns byte-identical values with no second pass."
        test_recipe:
          setup:
            - "Brief BRF-0001 accepted (dosage 1.0000 %, annual 500 kg); formula F1 holds GUM-BASE at 100.0000 % and is APPROVED; lot L1 of 500 g was compounded by u_lab_1 and is qc_status PENDING / disposition_status HELD."
            - "A second formula F2 on the same brief holds GUM-BASE at 100.0000 % and has never been costed."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
            - call: "POST /formulas/${f1}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f1}/decision"
              payload: { decision: "APPROVED" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
            - call: "POST /sample-lots"
              payload: { formula_id: "${f1}", batch_size_g: 500 }
              as: LabTech
              as_user_id: "u_lab_1"
              captures: { l1: "$.data.id" }
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F2" }
              as: Flavorist
              captures: { f2: "$.data.id" }
            - call: "POST /formulas/${f2}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
          trigger:
            - call: "POST /formulas/${f2}/cost"
              payload: {}
              as: Flavorist
              captures: { w_bench: "$.data.bench_cost_per_kg_cents", w_bench_ciu: "$.data.bench_cost_in_use_cents_per_tonne", w_firm_ciu: "$.data.firm_cost_in_use_cents_per_tonne", w_stale: "$.data.cost_stale", w_kosher: "$.data.kosher_eligible" }
            - call: "GET /formulas/${f2}"
              payload: {}
              as: Flavorist
              captures: { r_bench: "$.data.bench_cost_per_kg_cents", r_bench_ciu: "$.data.bench_cost_in_use_cents_per_tonne", r_firm_ciu: "$.data.firm_cost_in_use_cents_per_tonne" }
            - call: "POST /sample-lots/${l1}/qc"
              payload: { result: "FAILED", qc_note: "off-note in the top" }
              as: LabTech
              as_user_id: "u_lab_2"
              captures: { w_qc: "$.data.qc_status", w_disp: "$.data.disposition_status" }
            - call: "GET /sample-lots/${l1}"
              payload: {}
              as: LabTech
              captures: { r_qc: "$.data.qc_status", r_disp: "$.data.disposition_status" }
          assert:
            - "first trigger call returns HTTP status == 200 with w_bench == 2000, w_bench_ciu == 20000, w_firm_ciu == 19690, w_stale == false"
            - "w_kosher == false and the same response reports natural_claim_eligible == false, halal_eligible == false and allergen_codes == []"
            - "the first response also reports status == COSTED and version already incremented"
            - "r_bench == 2000 and r_bench_ciu == 20000 and r_firm_ciu == 19690: the read adds nothing the write response did not already carry"
            - "third trigger call returns HTTP status == 200 with w_qc == FAILED and w_disp == SCRAPPED in one body"
            - "r_qc == FAILED and r_disp == SCRAPPED"
            - "SampleLot.${l1}.qc_by_user_id == \"u_lab_2\""
            - "every response carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: reprice_fan_out_is_readable_on_the_very_next_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[PATCH /raw-materials/{material_id}]
          - calculations.formula_bench_cost
        distinguishing_aspect: "The reprice response is a RawMaterial, yet the two formulas it re-costs and their component lines are already settled when the immediately following reads run - no lag window and no re-read is needed - and the SUBMITTED formula's rework_reason is visible on that first read too."
        test_recipe:
          setup:
            - "Brief BRF-0001 accepted; formula FA holds GUM-BASE at 100.0000 % and is APPROVED, formula FB holds GUM-BASE at 50.0000 % plus SALT at 50.0000 % and is SUBMITTED."
            - "SALT costs 100 cents/kg, so FB's bench cost before the reprice is 1050 cents/kg (1000 + 50)."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /raw-materials"
              payload: { material_code: "SALT", name: "Fine Salt", cost_per_kg_cents: 100, natural_status: "NATURAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m2: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream FA" }
              as: Flavorist
              captures: { fa: "$.data.id" }
            - call: "POST /formulas/${fa}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${fa}/cost"
              payload: {}
              as: Flavorist
            - call: "POST /formulas/${fa}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${fa}/decision"
              payload: { decision: "APPROVED" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream FB" }
              as: Flavorist
              captures: { fb: "$.data.id" }
            - call: "POST /formulas/${fb}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 50.0 }
              as: Flavorist
              captures: { fb_line1: "$.data.id" }
            - call: "POST /formulas/${fb}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 50.0 }
              as: Flavorist
              captures: { fb_line2: "$.data.id" }
            - call: "POST /formulas/${fb}/cost"
              payload: {}
              as: Flavorist
              captures: { fb_bench_before: "$.data.bench_cost_per_kg_cents" }
            - call: "POST /formulas/${fb}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_2"
          trigger:
            - call: "PATCH /raw-materials/${m1}"
              payload: { cost_per_kg_cents: 2500 }
              as: PurchasingManager
              captures: { mat_cost: "$.data.cost_per_kg_cents" }
            - call: "GET /formulas/${fa}"
              payload: {}
              as: Flavorist
              captures: { fa_bench: "$.data.bench_cost_per_kg_cents", fa_status: "$.data.status", fa_stale: "$.data.cost_stale" }
            - call: "GET /formulas/${fb}"
              payload: {}
              as: Flavorist
              captures: { fb_bench: "$.data.bench_cost_per_kg_cents", fb_status: "$.data.status", fb_reason: "$.data.rework_reason" }
            - call: "GET /formula-components"
              payload: { formula_id: "${fb}" }
              as: Flavorist
              captures: { fb_c1: "$.data[0].contribution_cents", fb_c2: "$.data[1].contribution_cents" }
          assert:
            - "fb_bench_before == 1050"
            - "first trigger call returns HTTP status == 200 with mat_cost == 2500"
            - "fa_bench == 2500 and fa_status == APPROVED and fa_stale == true"
            - "fb_bench == 1300 and fb_status == REWORK_REQUIRED and fb_reason == RAW_MATERIAL_REPRICED"
            - "fb_c1 == 1250 and fb_c2 == 50 (sequence_no 1 then 2)"
            - "GET /formulas/${fa} reports bench_cost_in_use_cents_per_tonne == 25000 and firm_cost_in_use_cents_per_tonne == 24620"
            - "no read had to be repeated: the first read after the write already returns the settled values"
