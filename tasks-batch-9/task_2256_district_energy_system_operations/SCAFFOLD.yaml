    input: []
    output: PipeSegment
    side_effects: []
  - method: GET
    path: "/district-energy/pipe-segments"
    description: "List buried segments, filterable by owning loop, upstream segment and condition band."
    roles: [SystemController, DispatchOperator, NetworkEngineer, FieldTechnician, BillingAnalyst]
    code: 200
    input: ["loop_id?", "upstream_segment_id?", "condition?", "limit?", "offset?"]
    output: PipeSegment[]
