        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair (state, business_safety): when Project is in DRAFT (not CASTING)
          AND the chosen talent has an overlapping conflict, ERR_INVALID_STATE
          must win over ERR_TALENT_CONFLICT.
        test_recipe:
          setup:
            - "Project in DRAFT (never opened casting)"
            - "Talent has ACTIVE ConflictExclusion overlapping now in project.product_category"
            - "Project has exclusivity_required=true"
            - "SelfAudition exists (faked by putting project through casting first then re-opening — impossible). Instead: craft a project that went CASTING, audition submitted, then another audition submitted by talent_with_conflict; then project is in CASTING (state passes), but to trigger state conflict we'd need DRAFT. Alternative: use an audition id from a DIFFERENT project — but then existence fires first."
            - "Simplest: put project in CASTING, audition by T1 (no conflict) submitted. Then project is CAST after selecting T1. Try select_talent AGAIN with another audition id (sibling now REJECTED) — state fails because project is CAST, not CASTING. Talent conflict on the new audition ALSO exists. State check must win."
