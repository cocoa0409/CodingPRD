      - name: settlement_before_execution_rejected
        claim_type: Conditional action
        grounds:
          - validations.priority_71
          - errors.ERR_PLAN_NOT_LOCKED
          - endpoints."POST /payout-runs/{payoutRunId}/settle-true-up"
          - "state_machines.PayoutRun: EXECUTED -> SETTLED"
        distinguishing_aspect: |
          Rule 71 is two-sided: execute demands plan.status == LOCKED, settle
          demands PAID_OUT. The plan here IS locked, which is exactly why a naive
          single-state reading of the rule would let the settlement through and book
          a true-up against cash that was never paid. The run must stay DRAFT and
          both true_up_cents fields must stay 0.
