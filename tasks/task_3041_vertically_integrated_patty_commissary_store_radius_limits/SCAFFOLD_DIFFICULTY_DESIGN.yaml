              as: CommissaryPlanner
              captures: { bd_ok: $.data.id }
            - call: "POST /v1/beef-deliveries"
              payload: { commissary_id: "${com_id}", supplier_id: "${sup_id}", shipped_at: "2026-09-01T07:00:00Z", raw_beef_lbs: 500, transit_temp_celsius: 4.1 }
              as: CommissaryPlanner
              captures: { bd_hot: $.data.id }
            - call: "POST /v1/beef-deliveries/${bd_ok}/ship"
