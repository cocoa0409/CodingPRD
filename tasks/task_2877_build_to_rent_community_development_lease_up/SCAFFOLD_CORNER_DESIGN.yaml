      - name: stabilized_valuation_variants_diverge_on_identical_community_state
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: stabilized_valuation_trailing_actual_versus_forward_stabilized_same_state
          rationale: |
            The §1.8 dual_variant_calc instance already reads both bases against one frozen community
            state and asserts every intermediate line of each variant plus the resulting loan_to_value
            delta, which is exactly the variant-divergence claim.

      - name: concession_amortization_variant_selection_between_the_two_modes
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: concession_straight_line_versus_upfront_from_identical_lease_inputs
          rationale: |
            The §1.8 dual_variant_calc instance already drives both amortization_mode values from
            identical lease inputs and asserts the per-period schedule, the first-period charge and the
            net effective rent for each mode.

      - name: services_fee_tier_boundaries_are_exercised_at_the_break_points
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: community_services_fee_tier_boundary_at_exactly_200000_cents
          rationale: |
            The §1.8 boundary_precision_check instance already prices leases at 199999, 200000 and a
            high-tier rent, which covers threshold-1 / threshold / threshold+ for the fee ladder.

      - name: absorption_pacing_index_tier_thresholds_and_clamped_supply_factor
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: absorption_pacing_index_four_input_interaction_with_restricted_penalty
          rationale: |
            The §1.8 combinatorial_formula instance already exercises the clamped supply factor, the
            RESTRICTED penalty branch, the zero-absorption short circuit and the tier/growth selection
            in one comparison set.

      - name: rent_growth_step_is_clamped_at_the_maximum_step
        claim_type: threshold
        excluded_because:
          difficulty_instance: rent_growth_step_clamp_binds_at_exactly_20000_cents
          rationale: |
            The §1.8 boundary_precision_check instance already publishes at a rent whose computed step is
            exactly MAX_STEP_CENTS and at one whose raw step exceeds it, which is the whole clamp claim.

      - name: concession_rounding_residual_lands_in_the_final_period
        claim_type: aggregation
        excluded_because:
          difficulty_instance: concession_rounding_order_places_residual_in_the_final_period
          rationale: |
            The §1.8 combinatorial_formula instance already asserts every period of the schedule
            including the larger final period and the reconciliation of the per-period credits against
            the total, so a separate aggregation claim would repeat it verbatim.

  - section: validations
    instances:
      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: violation_to_error
        grounds:
          - validations.priority_30_path_id_resolves
          - errors.ERR_PHASE_NOT_FOUND
          - errors.ERR_RENT_SCHEDULE_NOT_FOUND
          - errors.ERR_CONCESSION_PROGRAM_NOT_FOUND
          - errors.ERR_HOUSEHOLD_NOT_FOUND
          - errors.ERR_LEASE_NOT_FOUND
          - errors.ERR_TURN_WORK_ORDER_NOT_FOUND
          - errors.ERR_ABSORPTION_REVIEW_NOT_FOUND
        distinguishing_aspect: |
          Priority 30 must resolve the path id against the right collection and name the right entity:
          seven reads with the same unknown UUID must each return a different error_id. A server that
          emits one generic 404 for all of them fails this instance.
        test_recipe:
          setup:
            - "One community exists so no collection is empty; no phase, schedule, program, household, lease, work order or review has the probed id."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Cobbleford", market_code: "TX-AUS", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
          trigger:
            - call: "GET /phases/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "GET /market-rent-schedules/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "GET /concession-programs/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "GET /households/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "GET /leases/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "GET /turn-work-orders/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "GET /absorption-reviews/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
          assert:
            - "Every trigger returns HTTP 404 with response_type error"
            - "The error_ids are, in order: ERR_PHASE_NOT_FOUND, ERR_RENT_SCHEDULE_NOT_FOUND, ERR_CONCESSION_PROGRAM_NOT_FOUND, ERR_HOUSEHOLD_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_TURN_WORK_ORDER_NOT_FOUND, ERR_ABSORPTION_REVIEW_NOT_FOUND"
            - "Community.${c} is unaffected with version == 1"

      - name: plat_decision_by_the_submitting_user_is_rejected_for_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations.priority_25_segregation_of_duties
          - state_machines.Community.plat.SUBMITTED_to_APPROVED.preconditions
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          The check is on X-User-ID, not on the role: one human holding both hats submits the plat as
          DeveloperPrincipal and then decides it as EntitlementOfficer. That must be refused with
          ERR_SEGREGATION_OF_DUTIES at priority 25 — ahead of every state check — while the identical
          decision from a different user id succeeds.
        test_recipe:
          setup:
            - "Community 'Dunwarren' whose plat was submitted by user u_both wearing the DeveloperPrincipal role."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Dunwarren", market_code: "TX-SAT", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_both"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-DW-1" }
              as: DeveloperPrincipal
              as_user_id: "u_both"
          trigger:
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_both"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
          assert:
            - "The first trigger returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "After the first trigger Community.${c}.plat_status is still SUBMITTED and posture is still FROZEN"
            - "The second trigger returns HTTP 200 with plat_status == APPROVED and posture == OPEN"
            - "Community.${c}.plat_submitted_by_user_id is still 'u_both' after the approval"

      - name: plat_approval_is_rejected_when_the_single_ownership_covenant_is_false
        claim_type: violation_to_error
        grounds:
          - validations.priority_56_single_ownership_covenant
          - calculations.community_posture
          - errors.ERR_SINGLE_OWNERSHIP_COVENANT_REQUIRED
        distinguishing_aspect: |
          Single-ownership operation is the defining constraint of build-to-rent: a community created
          with single_ownership_covenant false may be platted and submitted but can never be approved,
          and its posture is FROZEN by the covenant clause of the posture formula independently of the
          plat status.
        test_recipe:
          setup:
            - "Community 'Elsmere' created with single_ownership_covenant false and its plat submitted."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Elsmere", market_code: "TX-DFW", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: false, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-EM-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          trigger:
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
          assert:
            - "HTTP 409 with data.error_id == ERR_SINGLE_OWNERSHIP_COVENANT_REQUIRED"
            - "Community.${c}.plat_status is still SUBMITTED"
            - "Community.${c}.posture == FROZEN, driven by the covenant clause rather than by the plat status"

      - name: pm_transition_on_a_planning_community_is_rejected_by_the_staffing_gate
        claim_type: violation_to_error
        grounds:
          - validations.priority_57_maintenance_staffing
          - state_machines.Community.management.DEVELOPER_SELF_MANAGED_to_PM_MANAGED.preconditions
          - errors.ERR_MAINTENANCE_STAFFING_REQUIRED
        distinguishing_aspect: |
          Priority 57 couples two conditions in one rule: the community must already be leasing
          (lifecycle LEASE_UP or STABILIZED) and must carry at least one maintenance technician. A
          community whose plat was only just approved satisfies the headcount half but not the lifecycle
          half, and the rule must still reject it — ahead of the occupancy-threshold rule at priority 58.
        test_recipe:
          setup:
            - "Community 'Fenwick' with plat APPROVED, maintenance_tech_headcount 2, still in lifecycle PLANNING with no phase started."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Fenwick", market_code: "TX-HOU", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-FW-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
          trigger:
            - call: "POST /communities/${c}/pm-transitions"
              payload: { pm_company_name: "Northgate Residential", effective_from: "2026-08-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          assert:
            - "HTTP 409 with data.error_id == ERR_MAINTENANCE_STAFFING_REQUIRED, not ERR_LEASE_UP_THRESHOLD_NOT_MET"
            - "Community.${c}.management_mode is still DEVELOPER_SELF_MANAGED with pm_company_name == null and pm_effective_from == null"
            - "Community.${c}.lifecycle_status is still PLANNING"

      - name: pm_transition_below_half_occupancy_is_refused_and_succeeds_at_exactly_half
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_58_lease_up_threshold
          - state_machines.Community.management.DEVELOPER_SELF_MANAGED_to_PM_MANAGED
          - errors.ERR_LEASE_UP_THRESHOLD_NOT_MET
        distinguishing_aspect: |
          The property-management handover gate is an inclusive >= 0.5000 test on occupancy_ratio. With
          one of four planned units leased the ratio is 0.2500 and the transition is refused; executing a
          second lease brings it to exactly 0.5000 and the same request must now succeed and, because
          effective_from equals the logical clock, land directly in PM_MANAGED rather than
          PM_TRANSITION_PENDING.
        test_recipe:
          setup:
            - "Community 'Glenmara' with total_planned_units 4, two released DETACHED homesites at 285000, two households, and one EXECUTED lease on the first homesite."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Glenmara", market_code: "TX-AUS", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 2000000, facility_commitment_cents: 25000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-GM-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { cv: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${cv}" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 4, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph: $.data.id }
            - call: "POST /phases/${ph}/construction-start"
