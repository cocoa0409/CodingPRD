  # ==========================================================================
  # Rule 9 - compensating_invariant (2 instances, different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: supportive_measure_active_count_conserved
        grounds:
          - entities.Case.fields.active_supportive_measure_count
          - state_machines.SupportiveMeasure.ACTIVE_to_TERMINATED
          - state_machines.SupportiveMeasure.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Conserved quantity: case.active_supportive_measure_count == count of SupportiveMeasure rows
          with status ACTIVE. Create (+1) paired with terminate (-1) leaves the quantity unchanged;
          three create/terminate pairs interleaved with an expiry end exactly at the baseline, and a
          double-terminate of the same measure is rejected so the counter cannot drift below reality.
        test_recipe:
          setup:
            - "Case [STALKING] in JURISDICTION_REVIEW with measure M1 ACTIVE (counseling, open-ended) and M2 ACTIVE (housing, expiring 2026-08-05)"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - call: "POST /api/cases/${case_id}/supportive-measures"
              payload: { measure_type: "COUNSELING", party_side: "COMPLAINANT", description: "Weekly counseling", effective_from: "2026-08-01T00:00:00Z" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /api/cases/${case_id}/supportive-measures"
              payload: { measure_type: "HOUSING_CHANGE", party_side: "COMPLAINANT", description: "Temporary housing", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-05T00:00:00Z" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /api/cases/${case_id}/supportive-measures"
              payload: { measure_type: "ESCORT", party_side: "BOTH", description: "Campus escort", effective_from: "2026-08-02T00:00:00Z" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { m3_id: $.data.id }
            - { call: "POST /api/supportive-measures/${m3_id}/terminate", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: CaseAdministrator }
            - { call: "POST /api/cases/${case_id}/reconcile", as: CaseAdministrator }
            - { call: "POST /api/supportive-measures/${m3_id}/terminate", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { err: $.data.error_id } }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { cnt: $.data.active_supportive_measure_count } }
            - { call: "GET /api/cases/${case_id}/supportive-measures", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { active_first: "$.data[0].id" } }
          assert:
            - "Case.${case_id}.active_supportive_measure_count == 1: create(+1) x3 balanced by terminate(-1) and reconcile-expiry(-1) and the compensating terminate(-1) - forward/compensating pairs cancel"
            - "the sole surviving ACTIVE measure is ${m1_id} (M3 terminated, M2 expired at exactly its effective_to boundary 2026-08-05T00:00:00Z via inclusive expiry)"
            - "second terminate of M3 rejected ERR_INVALID_STATE_TRANSITION (terminal lockdown) so the counter cannot be double-decremented"
            - "invariant: active_supportive_measure_count equals the number of ACTIVE rows on GET /api/cases/${case_id}/supportive-measures?status=ACTIVE"

      - name: suspension_days_not_doubled_across_remand
        grounds:
          - state_machines.Sanction.ACTIVE_to_STAYED
          - state_machines.Determination.ISSUED_to_SUPERSEDED
          - state_machines.Sanction.ACTIVE_to_LIFTED_ON_APPEAL
        distinguishing_aspect: |
          Conserved quantity: the respondent's total ACTIVE suspension days ==
          sum(duration_days over Sanction rows with sanction_type == SUSPENSION and status == ACTIVE).
          Impose 120d, appeal-remand (STAYED), re-determine 120d (new ACTIVE) - the total is 120, not
