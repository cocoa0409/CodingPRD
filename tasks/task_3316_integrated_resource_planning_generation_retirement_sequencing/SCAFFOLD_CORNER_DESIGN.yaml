        distinguishing_aspect: "Reopen clears the plan's window fields (comment_window_opens_on/closes_on, submitted_on) and preferred_portfolio_id to null; a fresh open-comment re-stamps them from the then-current clock (2026-08-31 -> closes 2026-09-30)."
