              captures: { appl_id: $.data.id }
            - call: "POST /land-bank/disposition-applications"
              payload: { property_id: "${p_id}", applicant_id: "${appl_id}", program: "HOMEOWNER_SALE", proposed_use: "Owner-occupied single family", offer_price_cents: 100000 }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { app_id: $.data.id }
            - call: "POST /land-bank/disposition-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /land-bank/disposition-applications/${app_id}/screen"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { screener: $.data.screened_by_user_id }
            - call: "POST /land-bank/disposition-applications/${app_id}/recommend"
              payload: { recommendation_memo: "Self-signed recommendation" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { e_recommend: $.data.error_id }
            - call: "POST /land-bank/disposition-applications/${app_id}/recommend"
              payload: { recommendation_memo: "Independent review of the screening" }
              as: DispositionOfficer
              as_user_id: "disp-2"
              captures: { app_status: $.data.status }
          assert:
            - "${initiator} == intake-1 and HTTP 403 with ${e_close} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP 200 and ${pk_status} == CLOSED  # a different holder of the same role closes it"
            - "${screener} == disp-1 and HTTP 403 with ${e_recommend} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP 200 and ${app_status} == RECOMMENDED with recommended_by_user_id == disp-2"
            - "the two refusals left AcquisitionPacket.${pk_id} in BOARD_APPROVED and DispositionApplication.${app_id} in SCREENED at the moment they were made"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_property_version_rejected_then_current_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules[maintenance-order-create-stale-property]
          - errors.ERR_STALE_PROPERTY_VERSION
        distinguishing_aspect: "The parcel's version is bumped by a completely unrelated writer - a code-violation report filed by intake - between the client's read and its order creation, so the client's expected_property_version is one behind and the write is 412 ERR_STALE_PROPERTY_VERSION; replaying the identical body with the refreshed version succeeds, which shows the refusal was purely about staleness and not about the order itself."
        test_recipe:
          setup:
            - "An ACQUIRED 10000 sqft grade C parcel (MOW estimate 19703) on an ANY source authorized 1000000, plus a licensed MOW crew. The client reads the parcel's version, then intake files a code-violation report on the same parcel."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "OCC Property Line", source_type: "GRANT", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203320", address: "3320 Hornbeam Row", situs_ward: 6, lot_area_sqft: 10000, assessed_value_cents: 300000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Hornbeam Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-820" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-5020-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/contractors"
              payload: { name: "Hornbeam Mowing", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 2, specialties: ["MOW"] }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id }
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v_old: $.data.version }
            - call: "POST /land-bank/properties/${p_id}/code-violation-report"
              payload: { open_code_violation_count: 1, nuisance_complaint_count: 2 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_v_new: $.data.version }
          trigger:
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z", expected_property_version: "${p_v_old}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z", expected_property_version: "${p_v_new}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { order_id: $.data.id, est: $.data.estimated_cost_cents }
          assert:
            - "${p_v_new} == ${p_v_old} + 1  # the unrelated report is what moved the parcel"
            - "HTTP 412 and ${err_id} == ERR_STALE_PROPERTY_VERSION"
            - "after the refusal no MaintenanceOrder existed and FundingSource.${fs_id}.committed_cents was still 0"
            - "HTTP 201 for the replay: ${est} == 19703 and MaintenanceOrder.${order_id}.status == SCHEDULED"
            - "Property.${p_id}.version == ${p_v_new} + 1 after the accepted write  # every successful write bumps the row"

      - name: stale_funding_source_version_rejected_then_current_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules[demolition-run-create-stale-funding-source]
          - errors.ERR_STALE_FUNDING_SOURCE_VERSION
        distinguishing_aspect: "The second §1.2.1 rule guards a different parent on a different endpoint: an acquisition commitment lands on the source between the planner's read and its run creation, so the budget picture has moved and the plan is 412 ERR_STALE_FUNDING_SOURCE_VERSION; the identical budget replanned at the fresh version is accepted and open_run_count moves to 1."
        test_recipe:
          setup:
            - "An ANY source authorized 1000000 (reserve floor 50000). The planner reads version, then a packet board-approval commits 200000 against the same source."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "OCC Source Line", source_type: "GRANT", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id, fs_v_old: $.data.version }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203330", address: "3330 Ironbark Row", situs_ward: 6, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 195000, title_search_fee_cents: 5000 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-830" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "GET /land-bank/funding-sources/${fs_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { fs_v_new: $.data.version, avail: $.data.available_cents, comm: $.data.committed_cents }
          trigger:
            - call: "POST /land-bank/demolition-runs"
              payload: { funding_source_id: "${fs_id}", budget_cents: 500000, situs_ward_filter: 42, expected_funding_source_version: "${fs_v_old}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /land-bank/demolition-runs"
              payload: { funding_source_id: "${fs_id}", budget_cents: 500000, situs_ward_filter: 42, expected_funding_source_version: "${fs_v_new}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { run_id: $.data.id, run_status: $.data.status, run_seq: $.data.run_sequence }
          assert:
            - "${comm} == 200000 and ${avail} == 750000  # 1000000 - 50000 floor - 200000 committed"
            - "${fs_v_new} > ${fs_v_old}"
            - "HTTP 412 and ${err_id} == ERR_STALE_FUNDING_SOURCE_VERSION, and no DemolitionRun row was created by the refused plan"
            - "HTTP 201 for the replay: ${run_status} == PLANNED and ${run_seq} == 1  # the refused attempt did not consume a run_sequence"
            - "FundingSource.${fs_id}.open_run_count == 1 and committed_cents == 200000  # planning reserves nothing"

      - name: sweep_cascade_reaches_every_dependent_row_in_order
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: compliance_sweep_reverter_depth_three_cascade
          rationale: "The N-level chain claim (agreement REVERTED -> parcel CONVEYED->REVERTED and area back in inventory -> the buyer's screening counters and eligibility_status -> pending applications suspended) is exactly the §1.8 transitive-cascade fixture, and the four-level funding chain on run execution is the other one; a third copy would re-walk the same edges."

      - name: both_calculation_variants_are_reachable_and_differ
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: tax_discharge_statutory_vs_negotiated_divergence
          rationale: "Both dual-variant rules in §1.3 already have §1.8 instances that pin the two variants and their delta on identical inputs (tax relief STATUTORY vs NEGOTIATED, and the blight score's INTAKE_PROVISIONAL vs SWEEP_FINAL holding term), so the layer-level claim has no independent content."

      - name: run_selector_ranks_and_skips_by_policy
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers.selector_policy
          - calculations.demolition_run_allocation
        excluded_because:
          difficulty_instance: demolition_run_execute_depth_four_funding_cascade
          rationale: "The selector's eligibility filter, its score-then-area-then-created_at ranking, the MAX_PROPERTIES_PER_RUN cap and the skip-over behaviour under the provisional cap are asserted by the §1.8 cascade and admin-fee instances plus the four candidate-selection instances in this file's calculations section."

      - name: run_checkpoint_commits_exactly_once
        claim_type: ops_run_checkpoint
        grounds:
          - complexity_profile.complexity_layers.ops_run_checkpoint
        excluded_because:
          difficulty_instance: demolition_run_admin_fee_circular_dependency_pinned
          rationale: "The checkpoint claim - PLANNED reserves nothing, EXECUTED commits the orders plus the admin fee exactly once, and a replay is refused without a second commitment - is split across the §1.8 admin-fee instance and run_execute_replay_on_executed_run_rejected in this file's validations section."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: ledger_and_derived_reads_are_current_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.funding_ledger_position
          - calculations.inventory_area_position
        distinguishing_aspect: "Nothing lags: the order-creation response already carries the 19703 estimate, the very next read of the source shows that estimate as committed with available reduced by the same amount, and the authority-wide summary agrees on the same request - no second read or settle step is needed anywhere."
        test_recipe:
          setup:
            - "An ACQUIRED 10000 sqft grade C parcel (MOW estimate 19703) on an ANY source authorized 1000000 whose reserve floor is 50000, plus a licensed MOW crew."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
