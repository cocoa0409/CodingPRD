  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: meal_window_boundary_exactly_360_no_penalty
        claim_type: threshold_boundary
        grounds:
          - "calculations.work_log_penalties"
          - "entities.WorkDayLog.fields.meal_penalty_units"
        distinguishing_aspect: "Meal-window boundary is INCLUSIVE: first meal starting exactly at call+360 (840) yields 0 penalty units; one minute later (841) yields 1 unit = 3125 cents at daily rate 100000."
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production IN_PRODUCTION; CAMERA crew @100000 ACTIVE"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Yarrow LLC", fein: "20-0000024" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Yarrow Stem", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 840, end_minutes: 870 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-11", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 841, end_minutes: 871 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l2_id: $.data.id } }
          assert:
            - "WorkDayLog.${l1_id}.meal_penalty_units == 0 and meal_penalty_cents == 0"
            - "WorkDayLog.${l2_id}.meal_penalty_units == 1 and meal_penalty_cents == 3125"
            - "WorkDayLog.${l1_id}.penalty_cents == 0"

