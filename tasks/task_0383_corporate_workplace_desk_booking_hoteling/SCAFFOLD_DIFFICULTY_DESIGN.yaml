  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: seat_half_open_overlap_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=12]
          - errors[ERR_SEAT_DOUBLE_BOOKED]
          - entities.Reservation.fields.start_minute
          - entities.Reservation.fields.end_minute
        distinguishing_aspect: |
          Seat overlap uses half-open [start, end) intervals: a new booking starting
          exactly at the prior booking's end_minute (600) is ALLOWED (touching), but a
          booking overlapping the [540,600) window (e.g. 580..640) is rejected with
          ERR_SEAT_DOUBLE_BOOKED. Interval semantics: pure half-open adjacency, no buffer.
        test_recipe:
          setup:
            - "Floor, neighborhood, seat; existing BOOKED reservation 540..600 on 2026-07-06."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ15" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 15, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng15", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v0: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e15a@x.com", full_name: "E15A", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_a: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "e15b@x.com", full_name: "E15B", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_b: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-07-06", current_minute: 500 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_a}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-07-06", start_minute: 540, end_minute: 600, expected_seat_version: "${seat_v0}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { r_a: $.data.id }
            - call: "GET /workplace/seats/${seat_id}"
              payload: {}
              as: FacilityManager
              captures: { seat_v1: $.data.version }
          trigger:
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_b}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-07-06", start_minute: 580, end_minute: 640, expected_seat_version: "${seat_v1}" }
              as: Employee
              as_user_id: "${emp_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SEAT_DOUBLE_BOOKED"

      - name: room_buffered_overlap_turnover_buffer_after_booking
        grounds:
          - validations[priority=13]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - entities.Room.fields.turnover_buffer_minute
        distinguishing_aspect: |
          Room overlap geometry differs: each booking reserves [start, end +
          turnover_buffer_minute). With buffer 15 and an existing 600..660 booking, a new
          660..720 booking is rejected because 660 falls inside the buffered tail [660,675);
          a seat with the same touching geometry would be allowed. Interval semantics:
          asymmetric buffer appended after each booking, on the Room entity.
        test_recipe:
          setup:
            - "Floor, room (turnover_buffer_minute=15); existing 600..660 room booking on 2026-07-07."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ16" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 16, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/rooms"
              payload: { label: "R1", seats_capacity: 8, turnover_buffer_minute: 15 }
              as: FacilityManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e16a@x.com", full_name: "E16A", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_a: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "e16b@x.com", full_name: "E16B", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_b: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-07-07", current_minute: 500 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_a}", resource_type: "ROOM", room_id: "${room_id}", booking_date: "2026-07-07", start_minute: 600, end_minute: 660, expected_room_version: "${room_v0}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { r_a: $.data.id }
            - call: "GET /workplace/rooms/${room_id}"
              payload: {}
              as: FacilityManager
              captures: { room_v1: $.data.version }
          trigger:
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_b}", resource_type: "ROOM", room_id: "${room_id}", booking_date: "2026-07-07", start_minute: 660, end_minute: 720, expected_room_version: "${room_v1}" }
              as: Employee
              as_user_id: "${emp_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ROOM_DOUBLE_BOOKED"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: book_then_cancel_conserves_neighborhood_occupancy_count
        grounds:
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - calculations.neighborhood_capacity_check
          - entities.Neighborhood.fields.effective_cap_seats
        distinguishing_aspect: |
          Conserved quantity: distinct_reserved seat-count for a neighborhood on a date.
          Forward action (book a seat) increments it; compensating action (cancel that
          reservation) must restore it to the pre-booking value, so a subsequent booking
          of a third distinct seat at cap=2 still succeeds. Invariant: distinct_reserved
          after book+cancel == distinct_reserved before book.
        test_recipe:
          setup:
            - "Floor; neighborhood cap_pct=60 with 3 seats => effective_cap_seats=2; one seat (A) reserved (distinct=1) on 2026-07-08."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ17" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 17, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Cap60b", capacity_cap_pct: 60 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "A" }
              as: FacilityManager
              captures: { seat_a: $.data.id, sa_v: $.data.version }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "B" }
              as: FacilityManager
              captures: { seat_b: $.data.id, sb_v: $.data.version }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "C" }
              as: FacilityManager
              captures: { seat_c: $.data.id, sc_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e17a@x.com", full_name: "E17A", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_a: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "e17b@x.com", full_name: "E17B", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_b: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "e17c@x.com", full_name: "E17C", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_c: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-07-08", current_minute: 500 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_a}", resource_type: "SEAT", seat_id: "${seat_a}", booking_date: "2026-07-08", start_minute: 540, end_minute: 600, expected_seat_version: "${sa_v}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { r_a: $.data.id }
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_b}", resource_type: "SEAT", seat_id: "${seat_b}", booking_date: "2026-07-08", start_minute: 540, end_minute: 600, expected_seat_version: "${sb_v}" }
              as: Employee
              as_user_id: "${emp_b}"
              captures: { r_b: $.data.id }
          trigger:
            - call: "POST /workplace/reservations/${r_b}/cancel"
              payload: {}
              as: Employee
              as_user_id: "${emp_b}"
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_c}", resource_type: "SEAT", seat_id: "${seat_c}", booking_date: "2026-07-08", start_minute: 540, end_minute: 600, expected_seat_version: "${sc_v}" }
              as: Employee
              as_user_id: "${emp_c}"
              captures: { r_c: $.data.id, occ: $.data.occupancy_status }
          assert:
            - "Reservation.${r_b}.occupancy_status == CANCELLED"
            - "response status of third booking == 201"
            - "Reservation.${r_c}.occupancy_status == BOOKED"

      - name: amenity_approve_then_cancel_conserves_provisional_chargeback
        grounds:
          - state_machines.AmenityRequest.REQUESTED_to_APPROVED
          - state_machines.AmenityRequest.APPROVED_to_CANCELLED
          - calculations.amenity_chargeback
          - entities.Reservation.fields.provisional_chargeback_cents
        distinguishing_aspect: |
          Conserved quantity: provisional_chargeback_cents (monetary). Starting from one
          APPROVED line (1000c => subtotal 1000, fee 85, pre 1085, 10% tier, discount 109,
          provisional 976), adding a second line, approving it, then cancelling it must
          restore provisional_chargeback_cents to exactly 976 (its pre-second-line value).
          Different conserved quantity (cents) and different forward/compensating pair
          (approve/cancel) than the seat-count invariant above.
        test_recipe:
          setup:
            - "Floor, neighborhood, seat, employee; CHECKED_IN reservation with one APPROVED amenity line (1000c) on 2026-07-09."
            - "Baseline provisional_chargeback_cents = 976 (subtotal 1000 + per-line fee 85 = pre 1085; tier >=1000 -> 10%; discount round(108.5)=109; 1085-109=976)."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ18" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 18, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng18", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e18@x.com", full_name: "E18", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-07-09", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-07-09", start_minute: 540, end_minute: 1080, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "MONITOR", unit_price_cents: 1000, quantity: 1 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { l1: $.data.id }
            - call: "POST /workplace/amenity-requests/${l1}/approve"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "PARKING", unit_price_cents: 500, quantity: 1 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { l2: $.data.id }
            - call: "POST /workplace/amenity-requests/${l2}/approve"
              payload: {}
              as: FacilityManager
            - call: "POST /workplace/amenity-requests/${l2}/cancel"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /workplace/reservations/${resv_id}"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { prov_after: $.data.provisional_chargeback_cents }
          assert:
            - "Reservation.${resv_id}.provisional_chargeback_cents == 976"
            - "AmenityRequest.${l2}.line_status == CANCELLED"
