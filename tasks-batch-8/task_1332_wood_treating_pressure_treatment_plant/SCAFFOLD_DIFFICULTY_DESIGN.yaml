            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
