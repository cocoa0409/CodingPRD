      - name: discontinue_cascade_visible_in_same_request
        claim_type: immediate
        grounds: [state_machines.InfusionOrder.ACTIVE_to_DISCONTINUED, entities.DrugCatalog.fields.on_hand_vials]
        distinguishing_aspect: "Immediate consistency: a GET issued right after discontinue sees the WASTED compound and the restored on_hand_vials with no settling delay."
