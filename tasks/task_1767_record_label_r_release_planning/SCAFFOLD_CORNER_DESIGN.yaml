        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a track created and advanced is fully visible in the very next GET in the same request chain — no lag, no async reconciliation."
        test_recipe:
          setup: ["Label; funded contract; project RECORDING"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label M1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
