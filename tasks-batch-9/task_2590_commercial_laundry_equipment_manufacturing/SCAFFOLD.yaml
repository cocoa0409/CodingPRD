scenario: |
  Generate task harder than expert level!

  2590. Commercial Laundry Equipment Manufacturing (commercial laundry equipment manufacturer): product lines
  across on-premises laundry, vended and industrial tunnel systems with capacity ratings, machine assembly with
  drum fabrication, bearing installation and control integration, efficiency and water consumption certification
  with utility rebate qualification documentation, payment system integration for vended equipment with card,
  mobile and coin options, distributor network management with installation training and territory assignment,
  laundromat customer financing programs and equipment package deals, service parts distribution with technician
  certification and diagnostics tools, warranty analysis by component and duty cycle

domain_name: commercial-laundry-equipment-manufacturing
api_prefix: "/clm"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: ServicePart is self-referential (supersession chain); WarrantyClaim joins BuildOrder x ServicePart x
  # Distributor x Technician; QuoteLine joins PackageQuote x MachineModel; StationLog joins BuildOrder x
  # AssemblyStation x Technician. No single ownership tree governs the URL space.

  state_machine_shape: cyclic
  # BuildOrder loops QA_HOLD -> REWORK -> ON_FLOOR -> ... -> QA_HOLD under a rework ceiling; CertificationDossier
  # loops CERTIFIED -> RESURVEY_REQUIRED -> IN_REVIEW -> CERTIFIED; MachineModel loops RELEASED -> SUSPENDED ->
  # CERTIFIED -> RELEASED; PackageQuote loops SUBMITTED -> REVISION_REQUESTED -> SUBMITTED; CertificationDossier
  # additionally carries two independent review dimensions on one row (energy_review_state x water_review_state).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The ComplianceOfficer who prepares a dossier cannot review either dimension of it; the two review dimensions
  # must be decided by two different operator ids; the QualityInspector who signs off a BuildOrder must not appear
  # as technician_id on any StationLog of that BuildOrder.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: MachineModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Catalog code of the machine model; unique across all MachineModel rows"
        constraints: "1..32 chars, uppercase A-Z 0-9 and '-' only; uniqueness -> ERR_DUPLICATE_RESOURCE_CODE"
      - name: product_line
        type: enum
        source: input
        description: "Product line the model belongs to"
        constraints: "ON_PREMISES | VENDED | INDUSTRIAL_TUNNEL"
      - name: capacity_rating_lb
        type: integer
        source: input
        description: "Rated dry-load capacity in pounds"
        constraints: >-
          band depends on product_line (inclusive both ends): ON_PREMISES 20..200, VENDED 20..80,
          INDUSTRIAL_TUNNEL 150..600; outside band -> ERR_CAPACITY_RATING_OUT_OF_BAND
      - name: rated_water_gal_per_cwt
        type: number
        source: input
        description: "Nameplate water consumption in gallons per hundred pounds of dry load"
        constraints: "> 0, exactly 2 decimal places"
      - name: rated_kwh_per_cwt
        type: number
        source: input
        description: "Nameplate energy consumption in kWh per hundred pounds of dry load"
        constraints: "> 0, exactly 2 decimal places"
      - name: drum_alloy_grade
        type: enum
        source: input
        description: "Drum shell alloy; selects the bearing preload acceptance window used at BEARING_INSTALL"
        constraints: "AISI_304 | AISI_316 | DUPLEX_2205"
      - name: payment_module_options
        type: array
        source: input
        description: "Payment modules orderable on this model; VENDED requires at least one, other lines require an empty array"
        default: []
        constraints: >-
          subset of {COIN, CARD, MOBILE}, no duplicates; product_line == VENDED requires length >= 1;
          product_line != VENDED requires length == 0; violation -> ERR_PAYMENT_MODULE_NOT_SUPPORTED
      - name: max_rework_cycles
        type: integer
        source: input
        description: "Ceiling on BuildOrder.rework_count; exceeding it auto-scraps the unit"
        default: 2
        constraints: "0..3"
      - name: min_first_pass_yield_pct
        type: number
        source: input
        description: "First-pass-yield floor below which the model's CERTIFIED dossier is forced back to resurvey"
        default: 80.00
        constraints: "0.00..100.00, exactly 2 decimal places"
      - name: list_price_cents
        type: integer
        source: input
        description: "Book list price per unit in cents; snapshotted onto QuoteLine.unit_price_cents at line creation"
        constraints: "> 0"
      - name: certification_state
        type: enum
        source: system
        description: "Lifecycle state of the model in the certification and release workflow"
        default: DRAFT
        constraints: "DRAFT | CERTIFIED | RELEASED | SUSPENDED"
      - name: suspended_reason
        type: enum
        source: system
        description: "Why the model is SUSPENDED; reset to NONE when the model returns to CERTIFIED"
        default: NONE
        constraints: "NONE | YIELD_RESURVEY | MANUAL"
      - name: accepted_unit_count
        type: integer
        source: computed
        description: "Count of BuildOrder rows for this model with build_state == ACCEPTED"
        default: 0
      - name: scrapped_unit_count
        type: integer
        source: computed
        description: "Count of BuildOrder rows for this model with build_state == SCRAPPED"
        default: 0
      - name: quality_hold_unit_count
        type: integer
        source: computed
        description: "Count of BuildOrder rows for this model with build_state == QUALITY_HOLD"
        default: 0
      - name: first_pass_yield_pct
        type: number
        source: computed
        description: "See calculations.first_pass_yield; 0.00 while the model has no terminal BuildOrder"
        default: 0.00
      - name: rebate_program_codes
        type: array
        source: computed
        description: >-
          Sorted (ASC) RebateProgram.program_code values that the model's currently CERTIFIED dossier qualifies for;
          emptied whenever certification_state leaves CERTIFIED or RELEASED
        default: []
      - name: rebate_amount_cents
        type: integer
        source: computed
        description: "Rebate value of the selected program; see calculations.rebate_qualification"
        default: 0

  - name: RebateProgram
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: "Utility rebate program code; unique across all RebateProgram rows"
        constraints: "1..32 chars, uppercase A-Z 0-9 and '-' only; uniqueness -> ERR_DUPLICATE_RESOURCE_CODE"
      - name: utility_code
        type: string
        source: input
        description: "Sponsoring utility; the (utility_code, program_class) pair is the resource whose effective windows must not collide"
        constraints: "1..32 chars"
      - name: program_class
        type: enum
        source: input
        description: "Which consumption dimension the program pays on"
        constraints: "WATER | ENERGY | COMBINED"
      - name: eligible_product_lines
        type: array
        source: input
        description: "Product lines the program accepts"
        constraints: "non-empty subset of {ON_PREMISES, VENDED, INDUSTRIAL_TUNNEL}, no duplicates"
      - name: max_water_gal_per_cwt
        type: number
        source: input
        description: "Inclusive ceiling compared against CertificationDossier.measured_water_gal_per_cwt"
        constraints: "> 0, exactly 2 decimal places"
      - name: max_kwh_per_cwt
        type: number
        source: input
        description: "Inclusive ceiling compared against CertificationDossier.measured_kwh_per_cwt"
        constraints: "> 0, exactly 2 decimal places"
      - name: min_capacity_rating_lb
        type: integer
        source: input
        description: "Inclusive floor compared against MachineModel.capacity_rating_lb"
        constraints: ">= 0"
      - name: rebate_base_cents
        type: integer
        source: input
        description: "Base rebate value in cents before the capacity bonus"
        constraints: "> 0"
      - name: capacity_bonus_cents_per_10lb
        type: integer
        source: input
        description: "Bonus cents added per whole 10 lb of capacity above min_capacity_rating_lb"
        default: 0
        constraints: ">= 0"
      - name: rebate_cap_cents
        type: integer
        source: input
        description: "Inclusive ceiling on the computed rebate value"
        constraints: ">= rebate_base_cents"
      - name: effective_from
        type: datetime
        source: input
        description: "First instant of the program window; only the UTC date component participates in window arithmetic"
        constraints: "ISO 8601 UTC"
      - name: effective_to
        type: datetime
        source: input
        description: "Last instant of the program window (inclusive); UTC date component only"
        constraints: "ISO 8601 UTC; date(effective_to) >= date(effective_from) else ERR_INTERVAL_INVALID"
      - name: program_state
        type: enum
        source: system
        description: "ACTIVE until the logical clock passes effective_to, then RETIRED by the clock sweep"
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: CertificationDossier
    parent: MachineModel
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: system
        description: "FK -> MachineModel.id; taken from the creation path, never from the body"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that created the dossier; barred from both review dimensions"
      - name: measured_water_gal_per_cwt
        type: number
        source: input
        description: "Measured water consumption from the efficiency test run"
        constraints: "> 0, exactly 2 decimal places"
      - name: measured_kwh_per_cwt
        type: number
        source: input
        description: "Measured energy consumption from the efficiency test run"
        constraints: "> 0, exactly 2 decimal places"
      - name: test_cycle_count
        type: integer
        source: input
        description: "Number of wash cycles the test run covered"
        constraints: ">= 50 else ERR_INVALID_REQUEST"
      - name: energy_review_state
        type: enum
        source: system
        description: "Energy review dimension; advances independently of water_review_state"
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED"
      - name: water_review_state
        type: enum
        source: system
        description: "Water review dimension; advances independently of energy_review_state"
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED"
      - name: energy_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID that decided the energy dimension; null while energy_review_state == PENDING"
        default: null
      - name: water_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID that decided the water dimension; null while water_review_state == PENDING"
        default: null
      - name: dossier_state
        type: enum
        source: system
        description: "Compound state derived from the two review dimensions plus the resurvey cascade"
        default: IN_REVIEW
        constraints: "IN_REVIEW | CERTIFIED | REJECTED | RESURVEY_REQUIRED"
      - name: resurvey_reason
        type: enum
        source: system
        description: "Why the dossier was pushed back to resurvey"
        default: NONE
        constraints: "NONE | YIELD_BREACH"
      - name: qualified_program_codes
        type: array
        source: computed
        description: "See calculations.rebate_qualification; recomputed at every entry into CERTIFIED"
        default: []
      - name: rebate_amount_cents
        type: integer
        source: computed
        description: "Rebate value of the selected program at certification time"
        default: 0
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent entry into CERTIFIED; null before the first"
        default: null
      - name: resurvey_count
        type: integer
        source: system
        description: "How many times this dossier has been pushed back to RESURVEY_REQUIRED"
        default: 0

  - name: ServicePart
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        description: "Service part number; unique across all ServicePart rows"
        constraints: "1..32 chars, uppercase A-Z 0-9 and '-' only; uniqueness -> ERR_DUPLICATE_RESOURCE_CODE"
      - name: component_class
        type: enum
        source: input
        description: "Component family the part belongs to; the warranty analysis rolls up on this field"
        constraints: "DRUM | BEARING | CONTROL_BOARD | PAYMENT_MODULE | MOTOR | DIAGNOSTIC_TOOL"
      - name: supersedes_part_id
        type: string
        source: input
        description: "FK -> ServicePart.id; the part this one replaces in the supersession chain, null for an original part"
        default: null
        constraints: "must not equal the row's own id; the referenced part must exist else ERR_PART_NOT_FOUND"
      - name: fits_product_lines
        type: array
        source: input
        description: "Product lines the part is released for; checked against the claimed BuildOrder's model at adjudication"
        constraints: "non-empty subset of {ON_PREMISES, VENDED, INDUSTRIAL_TUNNEL}, no duplicates"
      - name: fits_min_capacity_lb
        type: integer
        source: input
        description: "Inclusive lower bound of the capacity range the part fits"
        constraints: ">= 0"
      - name: fits_max_capacity_lb
        type: integer
        source: input
        description: "Inclusive upper bound of the capacity range the part fits"
        constraints: ">= fits_min_capacity_lb else ERR_INVALID_REQUEST"
      - name: rated_duty_cycles
        type: integer
        source: input
        description: "Design life in wash cycles; denominator of the pro-rata warranty calculation"
        constraints: "> 0"
      - name: warranty_months
        type: integer
        source: input
        description: "Warranty term in months from in-service date"
        constraints: "12..60"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Distributor price per unit in cents; ceiling of any covered warranty amount"
        constraints: "> 0"
      - name: requires_cert_scope
        type: enum
        source: input
        description: "Certification scope the reporting technician must hold for claims naming this part"
        default: NONE
        constraints: "NONE | DIAGNOSTICS_TOOL | CONTROL_INTEGRATION"
      - name: on_hand_qty
        type: integer
        source: system
        description: "Units physically available; only stock-adjustments, claim approval and claim void move it"
        default: 0
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: system
        description: "Units committed to APPROVED warranty claims and not yet released"
        default: 0
        constraints: ">= 0"
      - name: reorder_point_qty
        type: integer
        source: input
        description: "Inclusive threshold at or below which a non-zero on_hand_qty is reported as LOW"
        default: 2
        constraints: ">= 0"
      - name: stock_state
        type: enum
        source: computed
        description: "Derived from on_hand_qty and reorder_point_qty; see calculations.part_stock_projection"
        default: BACKORDERED
        constraints: "IN_STOCK | LOW | BACKORDERED"

  - name: AssemblyStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: "Shop-floor station code; unique across all AssemblyStation rows"
        constraints: "1..32 chars, uppercase A-Z 0-9 and '-' only; uniqueness -> ERR_DUPLICATE_RESOURCE_CODE"
      - name: station_type
        type: enum
        source: input
        description: "Assembly operation the station performs"
        constraints: "DRUM_FAB | BEARING_INSTALL | CONTROL_INTEGRATION"
      - name: parallel_capacity
        type: integer
        source: input
        description: "How many buffer-inflated occupations the station tolerates over one instant"
        constraints: "1..4"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: "Minutes appended to every StationLog completed_at to form the station-side occupation interval"
        constraints: "0..120"
      - name: supported_product_lines
        type: array
        source: input
        description: "Product lines the station is tooled for; checked against the BuildOrder's model at station-log creation"
        constraints: "non-empty subset of {ON_PREMISES, VENDED, INDUSTRIAL_TUNNEL}, no duplicates"
      - name: station_state
        type: enum
        source: input
        description: "OPEN accepts station logs; MAINTENANCE rejects them"
        default: OPEN
        constraints: "OPEN | MAINTENANCE"

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: employee_code
        type: string
        source: input
        description: "Badge code; unique across all Technician rows"
        constraints: "1..32 chars, uppercase A-Z 0-9 and '-' only; uniqueness -> ERR_DUPLICATE_RESOURCE_CODE"
      - name: full_name
        type: string
        source: input
        description: "Technician display name"
        constraints: "1..120 chars"
      - name: employer
        type: enum
        source: input
        description: "FACTORY technicians staff assembly stations; DISTRIBUTOR technicians report field claims"
        constraints: "FACTORY | DISTRIBUTOR"
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; required when employer == DISTRIBUTOR, must be null when employer == FACTORY"
        default: null
      - name: cert_scopes
        type: array
        source: system
        description: "Scopes currently granted; set by certification-actions GRANT/RENEW, emptied by REVOKE and by clock expiry"
        default: []
        constraints: "subset of {DRUM_FAB, BEARING_INSTALL, CONTROL_INTEGRATION, QA_SIGNOFF, DIAGNOSTICS_TOOL}, no duplicates"
      - name: cert_state
        type: enum
        source: system
        description: "Certification lifecycle state of the technician"
        default: UNCERTIFIED
        constraints: "UNCERTIFIED | ACTIVE | EXPIRED | REVOKED"
      - name: cert_expires_on
        type: datetime
        source: system
        description: "Instant at which the granted scopes lapse; the clock sweep flips ACTIVE to EXPIRED at or after it"
        default: null
      - name: last_cert_action_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent certification-action on this technician"
        default: null
      - name: revocation_count
        type: integer
        source: system
        description: "How many times this technician's certification has been revoked"
        default: 0

  - name: BuildOrder
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: "FK -> MachineModel.id; the model being built"
      - name: serial_number
        type: string
        source: input
        description: "Unit serial; unique across all BuildOrder rows"
        constraints: "1..32 chars, uppercase A-Z 0-9 and '-' only; uniqueness -> ERR_DUPLICATE_RESOURCE_CODE"
      - name: planned_start_at
        type: datetime
        source: input
        description: "Planned floor start; informational, not used in overlap arithmetic"
        constraints: "ISO 8601 UTC"
      - name: build_state
        type: enum
        source: system
        description: "Assembly workflow state; the station chain is DRUM_FAB then BEARING_INSTALL then CONTROL_INTEGRATION"
        default: PLANNED
        constraints: "PLANNED | ON_FLOOR | DRUM_DONE | BEARINGS_DONE | QA_HOLD | REWORK | QUALITY_HOLD | ACCEPTED | SCRAPPED"
      - name: rework_count
        type: integer
        source: system
        description: "Times the unit has been pushed back to REWORK; compared against MachineModel.max_rework_cycles"
        default: 0
      - name: integrity_hold
        type: boolean
        source: system
        description: "True while at least one implicated technician's certification is REVOKED"
        default: false
      - name: labor_minutes_total
        type: integer
        source: computed
        description: "Sum of StationLog.labor_minutes over every StationLog row with build_order_id == this row's id"
        default: 0
      - name: station_pass_count
        type: integer
        source: computed
        description: "Count of StationLog rows for this build with outcome == PASS"
        default: 0
      - name: scrap_reason
        type: enum
        source: system
        description: "Why the unit was scrapped"
        default: NONE
        constraints: "NONE | REWORK_LIMIT"
      - name: qa_inspector_user_id
        type: string
        source: system
        description: "Technician id that signed the most recent QA decision on this unit"
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the unit reached ACCEPTED"
        default: null

  - name: StationLog
    parent: BuildOrder
    common_fields: false
    fields:
      - name: build_order_id
        type: string
        source: system
        description: "FK -> BuildOrder.id; taken from the creation path"
      - name: station_id
        type: string
        source: input
        description: "FK -> AssemblyStation.id; the station occupied by this operation"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; must equal the acting X-User-ID of the Technician role"
      - name: station_type
        type: enum
        source: input
        description: "Operation claimed by the caller; must equal the referenced station's station_type"
        constraints: "DRUM_FAB | BEARING_INSTALL | CONTROL_INTEGRATION"
      - name: started_at
        type: datetime
        source: input
        description: "Operation start instant; left edge of both the technician-side and station-side intervals"
        constraints: "ISO 8601 UTC"
      - name: completed_at
        type: datetime
        source: input
        description: "Operation finish instant; must be strictly after started_at else ERR_INTERVAL_INVALID"
        constraints: "ISO 8601 UTC"
      - name: outcome
        type: enum
        source: input
        description: "PASS advances the build one station; FAIL pushes the build to REWORK"
        constraints: "PASS | FAIL"
      - name: defect_code
        type: enum
        source: input
        description: "Defect observed; must be NONE when outcome == PASS and must not be NONE when outcome == FAIL"
        default: NONE
        constraints: "NONE | DRUM_WELD | BEARING_PRELOAD | CONTROL_FIRMWARE | PAYMENT_MODULE"
      - name: bearing_preload_micron
        type: number
        source: input
        description: "Measured bearing preload; required when station_type == BEARING_INSTALL, must be null otherwise"
        default: null
        constraints: "exactly 2 decimal places; acceptance window keyed on MachineModel.drum_alloy_grade"
      - name: labor_minutes
        type: integer
        source: computed
        description: "floor((completed_at - started_at) / 60s); excludes the station changeover buffer"
      - name: occupation_from
        type: datetime
        source: computed
        description: "Station-side occupation left edge; equals started_at"
      - name: occupation_to
        type: datetime
        source: computed
        description: "Station-side occupation right edge; equals completed_at plus AssemblyStation.changeover_buffer_minutes"

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: distributor_code
        type: string
        source: input
        description: "Distributor code; unique across all Distributor rows"
        constraints: "1..32 chars, uppercase A-Z 0-9 and '-' only; uniqueness -> ERR_DUPLICATE_RESOURCE_CODE"
      - name: legal_name
        type: string
        source: input
        description: "Distributor legal name"
        constraints: "1..160 chars"
      - name: territory_code
        type: string
        source: input
        description: "Assigned sales territory"
        constraints: "1..16 chars, uppercase A-Z 0-9 and '-' only"
      - name: territory_exclusive
        type: boolean
        source: input
        description: "True when the distributor claims exclusivity over territory_code"
        default: false
        constraints: >-
          at most one Distributor with territory_exclusive == true and distributor_state IN
          {PENDING_TRAINING, AUTHORIZED, PROBATION} may exist per territory_code else ERR_TERRITORY_EXCLUSIVITY_CONFLICT
      - name: completed_training_keys
        type: array
        source: system
        description: >-
          Append-only set of "<technician_id>|<training_module>" strings recorded by training-completions; the
          uniqueness key that makes a duplicate submission detectable
        default: []
      - name: trained_technician_count
        type: integer
        source: computed
        description: "Count of distinct technician_id values present in completed_training_keys"
        default: 0
      - name: installation_training_state
        type: enum
        source: system
        description: "NOT_STARTED before the first record, IN_PROGRESS after it, COMPLETE once the authorization threshold is met"
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_PROGRESS | COMPLETE"
      - name: distributor_state
        type: enum
        source: system
        description: "Channel authorization state"
        default: PENDING_TRAINING
        constraints: "PENDING_TRAINING | AUTHORIZED | PROBATION | TERMINATED"
      - name: probation_reason
        type: enum
        source: system
        description: "Why the distributor is on probation; reset to NONE on reinstatement"
        default: NONE
        constraints: "NONE | WARRANTY_ABUSE | MANUAL"
      - name: warranty_credit_cents
        type: integer
        source: system
        description: "Running warranty credit ledger; incremented on claim approval and decremented by the exact same amount on void"
        default: 0
        constraints: ">= 0"
      - name: open_claim_count
        type: integer
        source: computed
        description: "Count of WarrantyClaim rows with this distributor_id and claim_state == SUBMITTED"
        default: 0

  - name: PackageQuote
    parent: null
    common_fields: true
    fields:
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; owner of the quote, must equal the acting Distributor X-User-ID"
      - name: customer_name
        type: string
        source: input
        description: "Laundromat customer name"
        constraints: "1..160 chars"
      - name: laundromat_site_code
        type: string
        source: input
        description: "Customer site code the package is quoted for"
        constraints: "1..32 chars"
      - name: stated_credit_score
        type: integer
        source: input
        description: "Credit score stated by the distributor; drives the provisional financing variant"
        constraints: "300..850"
      - name: verified_credit_score
        type: integer
        source: system
        description: "Bureau-verified score supplied on the APPROVE decision; drives the final financing variant"
        default: null
        constraints: "300..850 when present"
      - name: financing_program
        type: enum
        source: input
        description: "Requested financing term; NONE means cash and suppresses all financing computations"
        default: NONE
        constraints: "NONE | TERM_36 | TERM_60"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Cash down payment in cents; must be strictly less than total_cents at submit time"
        default: 0
        constraints: ">= 0"
      - name: package_discount_pct
        type: number
        source: input
        description: "Package-level discount percent applied once to the summed line subtotal"
        default: 0.00
        constraints: "0.00..15.00, exactly 2 decimal places"
      - name: freight_cents
        type: integer
        source: input
        description: "Freight added after the package discount; never discounted"
        default: 0
        constraints: ">= 0"
      - name: quote_state
        type: enum
        source: system
        description: "Deal desk workflow state"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | DECLINED"
      - name: line_count
        type: integer
        source: computed
        description: "Count of QuoteLine rows with quote_id == this row's id"
        default: 0
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: "Sum of the already-rounded QuoteLine.line_total_cents values; see calculations.quote_rollup"
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: "Package discount in cents, rounded once against line_subtotal_cents"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "line_subtotal_cents - discount_cents + freight_cents"
        default: 0
      - name: origination_fee_cents
        type: integer
        source: computed
        description: "Financing origination fee; tier keyed on the pre-fee principal, see calculations.financing_terms"
        default: 0
      - name: financed_principal_cents
        type: integer
        source: computed
        description: "pre-fee principal plus origination_fee_cents; 0 while financing_program == NONE"
        default: 0
      - name: provisional_apr_bp
        type: integer
        source: computed
        description: "APR in basis points computed at submit from stated_credit_score"
        default: null
      - name: provisional_monthly_payment_cents
        type: integer
        source: computed
        description: "Level monthly payment computed at submit from provisional_apr_bp"
        default: null
      - name: final_apr_bp
        type: integer
        source: computed
        description: "APR in basis points computed at approval from verified_credit_score"
        default: null
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Level monthly payment computed at approval from final_apr_bp"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ChannelManager that recorded the most recent decision"
        default: null
      - name: revision_round
        type: integer
        source: system
        description: "How many times the quote has been sent back for revision"
        default: 0

  - name: QuoteLine
    parent: PackageQuote
    common_fields: false
    fields:
      - name: quote_id
        type: string
        source: system
        description: "FK -> PackageQuote.id; taken from the creation path"
      - name: model_id
        type: string
        source: input
        description: "FK -> MachineModel.id; the quoted model"
      - name: quantity
        type: integer
        source: input
        description: "Units of the model on this line"
        constraints: "1..50"
      - name: payment_module
        type: enum
        source: input
        description: "Payment module ordered per unit; must be listed in the model's payment_module_options, else NONE"
        default: NONE
        constraints: "NONE | COIN | CARD | MOBILE"
      - name: line_discount_pct
        type: number
        source: input
        description: "Line-level discount percent applied to the line gross before the single per-line rounding"
        default: 0.00
        constraints: "0.00..20.00, exactly 2 decimal places"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Snapshot of MachineModel.list_price_cents at line creation; immune to later model repricing"
      - name: payment_surcharge_cents
        type: integer
        source: computed
        description: "Per-unit payment module surcharge selected by payment_module"
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: "See calculations.quote_line_total; rounded exactly once, at the line level"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; the serialized unit the failure occurred on"
      - name: part_id
        type: string
        source: input
        description: "FK -> ServicePart.id; the component claimed as failed"
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; claiming distributor, must equal the acting Distributor X-User-ID"
      - name: reported_by_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; field technician that ran the diagnostics, must be employed by distributor_id"
      - name: failure_cycle_count
        type: integer
        source: input
        description: "Wash cycles the unit had run at failure; numerator side of the duty-cycle test"
        constraints: "> 0"
      - name: in_service_months
        type: integer
        source: input
        description: "Whole months in service at failure"
        constraints: ">= 0"
      - name: duty_cycle_class
        type: enum
        source: input
        description: "Observed duty cycle; multiplies the part's rated_duty_cycles"
        constraints: "LIGHT | STANDARD | HEAVY"
      - name: diagnostics_code
        type: string
        source: input
        description: "Diagnostics tool fault code captured in the field"
        constraints: "1..32 chars"
      - name: claim_state
        type: enum
        source: system
        description: "Claim workflow state"
        default: SUBMITTED
        constraints: "SUBMITTED | FULFILLMENT_BLOCKED | APPROVED | DENIED | VOIDED"
      - name: effective_rated_cycles
        type: integer
        source: computed
        description: "Duty- and product-line-adjusted design life; see calculations.warranty_coverage"
        default: 0
      - name: coverage_variant
        type: enum
        source: system
        description: "Which coverage algorithm produced covered_amount_cents"
        default: NONE
        constraints: "NONE | FULL_REPLACEMENT | PRO_RATA"
      - name: covered_amount_cents
        type: integer
        source: computed
        description: "Approved warranty credit in cents; retained after a void for audit"
        default: 0
      - name: denial_reason
        type: enum
        source: system
        description: "Recorded on a DENY decision"
        default: NONE
        constraints: "NONE | OUT_OF_WARRANTY | DUTY_CYCLE_ABUSE | PART_NOT_FITTED"
      - name: block_reason
        type: enum
        source: system
        description: "Why the claim sits in FULFILLMENT_BLOCKED"
        default: NONE
        constraints: "NONE | PART_BACKORDERED | BUILD_INTEGRITY_HOLD"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WarrantyAnalyst that adjudicated the claim"
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the approval was reversed"
        default: null

# Notation: `from: ANY_OF[A, B, C]` means one transition rule whose behavior, preconditions and side effects are
# identical from each listed state. Every other row names exactly one `from:` state.
state_machines:
  - entity: MachineModel
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "system: this model's CertificationDossier enters CERTIFIED (POST /clm/certification-dossiers/{id}/reviews)"
        actor: system
        preconditions:
          - "the dossier's model_id equals this model's id"
          - "certification_state == DRAFT"
        side_effects:
          - "rebate_program_codes = dossier.qualified_program_codes (already sorted ASC)"
          - "rebate_amount_cents = dossier.rebate_amount_cents"
          - "suspended_reason = NONE"
          - "increments MachineModel.version by 1 and refreshes updated_at"
      - from: CERTIFIED
        to: RELEASED
        trigger: "POST /clm/machine-models/{id}/lifecycle-actions with action == RELEASE"
        actor: ProductEngineer
        preconditions:
          - "certification_state == CERTIFIED else ERR_MODEL_STATE_INVALID"
        side_effects:
          - "increments MachineModel.version by 1"
        note: "Only a RELEASED or CERTIFIED model may back a release-to-floor; see BuildOrder.PLANNED_to_ON_FLOOR."
      - from: RELEASED
        to: SUSPENDED
        trigger: "POST /clm/machine-models/{id}/lifecycle-actions with action == SUSPEND"
        actor: ProductEngineer
        preconditions:
          - "certification_state == RELEASED else ERR_MODEL_STATE_INVALID"
        side_effects:
          - "suspended_reason = MANUAL"
          - "rebate_program_codes = [] and rebate_amount_cents = 0"
          - "increments MachineModel.version by 1"
      - from: RELEASED
        to: SUSPENDED
        trigger: "system: hop 5 of the yield-breach cascade (this model's CERTIFIED dossier left CERTIFIED with resurvey_reason == YIELD_BREACH)"
        actor: system
        preconditions:
          - "the dossier that left CERTIFIED has model_id == this model's id"
        side_effects:
          - "suspended_reason = YIELD_RESURVEY"
          - "rebate_program_codes = [] and rebate_amount_cents = 0"
          - "hop 6: every BuildOrder of this model whose build_state is ON_FLOOR, DRUM_DONE, BEARINGS_DONE or QA_HOLD moves to QUALITY_HOLD with integrity_hold = true, processed in BuildOrder.created_at ASC order"
          - "quality_hold_unit_count recomputed after hop 6"
          - "increments MachineModel.version by 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system: hop 5 of the yield-breach cascade on a model that was certified but never released"
        actor: system
        preconditions:
          - "the dossier that left CERTIFIED has model_id == this model's id"
        side_effects:
          - "identical to the RELEASED_to_SUSPENDED system row, including hop 6"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "system: this model's dossier re-enters CERTIFIED after a resurvey (POST /clm/certification-dossiers/{id}/reviews)"
        actor: system
        preconditions:
          - "certification_state == SUSPENDED"
        side_effects:
          - "suspended_reason = NONE"
          - "rebate_program_codes and rebate_amount_cents recomputed from the dossier"
          - "increments MachineModel.version by 1"
        note: "A model suspended for YIELD_RESURVEY must be released again explicitly to reach RELEASED."

  - entity: CertificationDossier
    initial_state: IN_REVIEW
    terminal_states: [REJECTED]
    transitions:
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /clm/certification-dossiers/{id}/reviews with decision == APPROVE while the other dimension is still PENDING"
        actor: ComplianceOfficer
        preconditions:
          - "dossier_state == IN_REVIEW else ERR_DOSSIER_STATE_INVALID"
          - "the addressed dimension's review state == PENDING else ERR_DOSSIER_STATE_INVALID"
          - "X-User-ID != prepared_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "X-User-ID != the other dimension's reviewer id when that id is set else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets energy_review_state or water_review_state to APPROVED and the matching reviewer id to X-User-ID"
          - "increments CertificationDossier.version by 1"
        note: "The two review dimensions are independent state axes on one row; neither one alone moves dossier_state."
      - from: IN_REVIEW
        to: CERTIFIED
        trigger: "POST /clm/certification-dossiers/{id}/reviews with decision == APPROVE that makes both dimensions APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "same preconditions as the IN_REVIEW_to_IN_REVIEW row"
          - "the other dimension's review state == APPROVED"
        side_effects:
          - "certified_at = current logical clock instant"
          - "qualified_program_codes and rebate_amount_cents computed per calculations.rebate_qualification"
          - "hop 1 of the certification cascade: the parent MachineModel takes DRAFT_to_CERTIFIED or SUSPENDED_to_CERTIFIED"
          - "increments CertificationDossier.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /clm/certification-dossiers/{id}/reviews with decision == REJECT on either dimension"
        actor: ComplianceOfficer
        preconditions:
          - "same preconditions as the IN_REVIEW_to_IN_REVIEW row"
        side_effects:
          - "sets the addressed dimension to REJECTED and its reviewer id to X-User-ID; the other dimension keeps whatever state it already had"
          - "qualified_program_codes = [] and rebate_amount_cents = 0"
          - "the parent MachineModel is untouched and stays in certification_state DRAFT"
          - "increments CertificationDossier.version by 1"
        note: "REJECTED is terminal for the dossier; a fresh dossier must be created to certify the model."
      - from: CERTIFIED
        to: RESURVEY_REQUIRED
        trigger: "system: hop 4 of the yield-breach cascade (the parent model's first_pass_yield_pct dropped below min_first_pass_yield_pct)"
        actor: system
        preconditions:
          - "dossier_state == CERTIFIED"
          - "the parent model has at least one BuildOrder in ACCEPTED or SCRAPPED"
        side_effects:
          - "resurvey_reason = YIELD_BREACH and resurvey_count += 1"
          - "energy_review_state and water_review_state are left at APPROVED for audit; qualified_program_codes = [] and rebate_amount_cents = 0"
          - "hop 5: the parent MachineModel moves to SUSPENDED with suspended_reason = YIELD_RESURVEY"
          - "increments CertificationDossier.version by 1"
      - from: RESURVEY_REQUIRED
        to: IN_REVIEW
        trigger: "POST /clm/certification-dossiers/{id}/resurvey-submissions"
        actor: ComplianceOfficer
        preconditions:
          - "dossier_state == RESURVEY_REQUIRED else ERR_DOSSIER_STATE_INVALID"
        side_effects:
          - "replaces measured_water_gal_per_cwt, measured_kwh_per_cwt and test_cycle_count with the submitted values"
          - "energy_review_state and water_review_state reset to PENDING; both reviewer ids reset to null"
          - "resurvey_reason = NONE"
          - "prepared_by_user_id is replaced with the submitting X-User-ID, so segregation of duties is re-armed for the new round"
          - "increments CertificationDossier.version by 1"

  - entity: BuildOrder
    initial_state: PLANNED
    terminal_states: [ACCEPTED, SCRAPPED]
    transitions:
      - from: PLANNED
        to: ON_FLOOR
        trigger: "POST /clm/build-orders/{id}/release-to-floor"
        actor: PlantManager
        preconditions:
          - "build_state == PLANNED or REWORK else ERR_BUILD_STATE_INVALID"
          - "MachineModel.certification_state IN {CERTIFIED, RELEASED} else ERR_MODEL_NOT_CERTIFIED"
        side_effects:
          - "increments BuildOrder.version by 1"
      - from: REWORK
        to: ON_FLOOR
        trigger: "POST /clm/build-orders/{id}/release-to-floor"
        actor: PlantManager
        preconditions:
          - "build_state == REWORK else ERR_BUILD_STATE_INVALID"
          - "MachineModel.certification_state IN {CERTIFIED, RELEASED} else ERR_MODEL_NOT_CERTIFIED"
        side_effects:
          - "the station chain restarts at DRUM_FAB; prior StationLog rows are retained and keep contributing to labor_minutes_total"
          - "increments BuildOrder.version by 1"
        note: "This is the closing edge of the rework cycle QA_HOLD -> REWORK -> ON_FLOOR -> ... -> QA_HOLD."
      - from: ON_FLOOR
        to: DRUM_DONE
        trigger: "POST /clm/build-orders/{id}/station-logs with station_type == DRUM_FAB and outcome == PASS"
        actor: Technician
        preconditions:
          - "build_state == ON_FLOOR else ERR_BUILD_STATE_INVALID"
          - "station.station_type == DRUM_FAB else ERR_STATION_TYPE_MISMATCH"
          - "technician certification, station and interval checks in validations priorities 34..46 all pass"
        side_effects:
          - "creates the StationLog row; labor_minutes_total and station_pass_count recomputed"
          - "increments BuildOrder.version by 1"
      - from: DRUM_DONE
        to: BEARINGS_DONE
        trigger: "POST /clm/build-orders/{id}/station-logs with station_type == BEARING_INSTALL and outcome == PASS"
        actor: Technician
        preconditions:
          - "build_state == DRUM_DONE else ERR_BUILD_STATE_INVALID"
          - "bearing_preload_micron inside the window for MachineModel.drum_alloy_grade else ERR_PRELOAD_OUT_OF_SPEC"
        side_effects:
          - "creates the StationLog row; labor_minutes_total and station_pass_count recomputed"
          - "increments BuildOrder.version by 1"
      - from: BEARINGS_DONE
        to: QA_HOLD
        trigger: "POST /clm/build-orders/{id}/station-logs with station_type == CONTROL_INTEGRATION and outcome == PASS"
        actor: Technician
        preconditions:
          - "build_state == BEARINGS_DONE else ERR_BUILD_STATE_INVALID"
        side_effects:
          - "creates the StationLog row; labor_minutes_total and station_pass_count recomputed"
          - "increments BuildOrder.version by 1"
      - from: ANY_OF[ON_FLOOR, DRUM_DONE, BEARINGS_DONE]
        to: REWORK
        trigger: "POST /clm/build-orders/{id}/station-logs with outcome == FAIL"
        actor: Technician
        preconditions:
          - "station_type matches the station expected from build_state else ERR_BUILD_STATE_INVALID"
          - "defect_code != NONE else ERR_INVALID_REQUEST"
        side_effects:
          - "creates the StationLog row"
          - "rework_count += 1"
          - "when rework_count > MachineModel.max_rework_cycles the unit immediately takes REWORK_to_SCRAPPED"
          - "increments BuildOrder.version by 1"
      - from: QA_HOLD
        to: ACCEPTED
        trigger: "POST /clm/build-orders/{id}/qa-signoff with decision == APPROVE"
        actor: QualityInspector
        preconditions:
          - "build_state == QA_HOLD else ERR_BUILD_STATE_INVALID"
          - "the acting technician holds QA_SIGNOFF with cert_state == ACTIVE and cert_expires_on > now else ERR_TECHNICIAN_NOT_CERTIFIED"
          - "no StationLog of this build has technician_id == X-User-ID else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "accepted_at = current logical clock instant; qa_inspector_user_id = X-User-ID"
          - "MachineModel.accepted_unit_count += 1 and first_pass_yield_pct recomputed"
          - "when the recomputed first_pass_yield_pct < MachineModel.min_first_pass_yield_pct the yield-breach cascade fires from hop 4"
          - "increments BuildOrder.version by 1"
      - from: QA_HOLD
        to: REWORK
        trigger: "POST /clm/build-orders/{id}/qa-signoff with decision == REJECT"
        actor: QualityInspector
        preconditions:
          - "build_state == QA_HOLD else ERR_BUILD_STATE_INVALID"
          - "the acting technician holds QA_SIGNOFF with cert_state == ACTIVE else ERR_TECHNICIAN_NOT_CERTIFIED"
          - "no StationLog of this build has technician_id == X-User-ID else ERR_SEGREGATION_OF_DUTIES"
          - "defect_code != NONE else ERR_INVALID_REQUEST"
        side_effects:
          - "hop 1 of the yield-breach cascade: rework_count += 1 and qa_inspector_user_id = X-User-ID"
          - "hop 2: when rework_count > MachineModel.max_rework_cycles the unit takes REWORK_to_SCRAPPED immediately"
          - "increments BuildOrder.version by 1"
      - from: REWORK
        to: SCRAPPED
        trigger: "system: rework_count exceeded MachineModel.max_rework_cycles"
        actor: system
        preconditions:
          - "rework_count > MachineModel.max_rework_cycles"
        side_effects:
          - "scrap_reason = REWORK_LIMIT"
          - "hop 3: MachineModel.scrapped_unit_count += 1 and MachineModel.first_pass_yield_pct recomputed"
          - "hop 4: when the recomputed first_pass_yield_pct < MachineModel.min_first_pass_yield_pct and the model has >= 1 terminal BuildOrder, the model's CERTIFIED dossier takes CERTIFIED_to_RESURVEY_REQUIRED"
          - "increments BuildOrder.version by 1"
      - from: ANY_OF[ON_FLOOR, DRUM_DONE, BEARINGS_DONE, QA_HOLD]
        to: QUALITY_HOLD
        trigger: "system: hop 2 of the certification-revocation cascade, or hop 6 of the yield-breach cascade"
        actor: system
        preconditions:
          - "the build has at least one StationLog whose technician just entered cert_state REVOKED (revocation cascade), or the build's model just entered SUSPENDED (yield cascade)"
        side_effects:
          - "integrity_hold = true (revocation cascade only)"
          - "MachineModel.quality_hold_unit_count recomputed"
          - "hop 3 of the revocation cascade: every WarrantyClaim with claim_state == SUBMITTED on this build moves to FULFILLMENT_BLOCKED with block_reason = BUILD_INTEGRITY_HOLD"
          - "increments BuildOrder.version by 1"
        note: >-
          Conditional cascade: a build already in ACCEPTED or SCRAPPED does NOT change state. An ACCEPTED build
          instead only takes integrity_hold = true (terminal states are never re-opened); a SCRAPPED build is
          untouched entirely.
      - from: QUALITY_HOLD
        to: REWORK
        trigger: "system: certification-regrant cascade (POST /clm/technicians/{id}/certification-actions with action == GRANT on a REVOKED technician)"
        actor: system
        preconditions:
          - "build_state == QUALITY_HOLD"
          - "every technician appearing on this build's StationLog rows now has cert_state == ACTIVE"
        side_effects:
          - "integrity_hold = false; rework_count += 1"
          - "when rework_count > MachineModel.max_rework_cycles the unit takes REWORK_to_SCRAPPED"
          - "MachineModel.quality_hold_unit_count recomputed"
          - "increments BuildOrder.version by 1"

  - entity: Technician
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: UNCERTIFIED
        to: ACTIVE
        trigger: "POST /clm/technicians/{id}/certification-actions with action == GRANT"
        actor: TrainingAdministrator
        preconditions:
          - "cert_state IN {UNCERTIFIED, EXPIRED, REVOKED} else ERR_TECHNICIAN_STATE_INVALID"
          - "scopes is a non-empty subset of the scope enum else ERR_INVALID_REQUEST"
          - "expires_on > current logical clock instant else ERR_INVALID_REQUEST"
          - "when employer == DISTRIBUTOR the employing Distributor.distributor_state IN {AUTHORIZED, PROBATION} else ERR_DISTRIBUTOR_NOT_AUTHORIZED"
        side_effects:
          - "cert_scopes = the submitted scopes; cert_expires_on = expires_on; last_cert_action_at = now"
          - "increments Technician.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /clm/technicians/{id}/certification-actions with action == RENEW"
        actor: TrainingAdministrator
        preconditions:
          - "cert_state == ACTIVE else ERR_TECHNICIAN_STATE_INVALID"
        side_effects:
          - "cert_scopes replaced by the submitted scopes; cert_expires_on replaced; last_cert_action_at = now"
          - "increments Technician.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock to or past cert_expires_on"
        actor: system
        preconditions:
          - "cert_state == ACTIVE and cert_expires_on <= the new clock instant"
        side_effects:
          - "cert_scopes = []"
          - "no integrity cascade fires: expiry is not revocation, so BuildOrder rows are untouched"
          - "increments Technician.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /clm/technicians/{id}/certification-actions with action == REVOKE"
        actor: TrainingAdministrator
        preconditions:
          - "cert_state == ACTIVE else ERR_TECHNICIAN_STATE_INVALID"
        side_effects:
          - "hop 1 of the certification-revocation cascade: cert_scopes = [], revocation_count += 1, last_cert_action_at = now"
          - "hop 2: every BuildOrder carrying a StationLog by this technician takes the QUALITY_HOLD transition (state change for ON_FLOOR / DRUM_DONE / BEARINGS_DONE / QA_HOLD, integrity_hold-only for ACCEPTED), processed in BuildOrder.created_at ASC order"
          - "hop 3: every WarrantyClaim with claim_state == SUBMITTED on those builds moves to FULFILLMENT_BLOCKED with block_reason = BUILD_INTEGRITY_HOLD, processed in WarrantyClaim.created_at ASC order"
          - "hop 4: Distributor.open_claim_count is recomputed for every distributor that owned one of those claims"
          - "increments Technician.version by 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /clm/technicians/{id}/certification-actions with action == GRANT or RENEW"
        actor: TrainingAdministrator
        preconditions:
          - "cert_state == EXPIRED"
          - "expires_on > current logical clock instant else ERR_INVALID_REQUEST"
        side_effects:
          - "cert_scopes and cert_expires_on replaced; last_cert_action_at = now"
          - "increments Technician.version by 1"
      - from: REVOKED
        to: ACTIVE
        trigger: "POST /clm/technicians/{id}/certification-actions with action == GRANT"
        actor: TrainingAdministrator
        preconditions:
          - "cert_state == REVOKED"
        side_effects:
          - "cert_scopes and cert_expires_on replaced; last_cert_action_at = now"
          - "regrant hop 1: every BuildOrder with integrity_hold == true whose StationLog technicians are now all ACTIVE takes integrity_hold = false, and those in QUALITY_HOLD take QUALITY_HOLD_to_REWORK"
          - "regrant hop 2: every WarrantyClaim in FULFILLMENT_BLOCKED with block_reason == BUILD_INTEGRITY_HOLD on those builds returns to SUBMITTED when the claimed part's stock_state != BACKORDERED"
          - "regrant hop 3: Distributor.open_claim_count recomputed for the affected distributors"
          - "increments Technician.version by 1"

  - entity: Distributor
    initial_state: PENDING_TRAINING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_TRAINING
        to: PENDING_TRAINING
        trigger: "POST /clm/distributors/{id}/training-completions that does not yet satisfy the authorization threshold"
        actor: TrainingAdministrator
        preconditions:
          - "distributor_state == PENDING_TRAINING else ERR_DISTRIBUTOR_STATE_INVALID"
          - "the referenced technician has employer == DISTRIBUTOR and distributor_id == this distributor else ERR_TECHNICIAN_DISTRIBUTOR_MISMATCH"
          - "the key \"<technician_id>|<training_module>\" is not already in completed_training_keys else ERR_TRAINING_RECORD_DUPLICATE"
        side_effects:
          - "appends the key to completed_training_keys; trained_technician_count recomputed"
          - "installation_training_state = IN_PROGRESS"
          - "increments Distributor.version by 1"
      - from: PENDING_TRAINING
        to: AUTHORIZED
        trigger: "POST /clm/distributors/{id}/training-completions that satisfies the authorization threshold"
        actor: TrainingAdministrator
        preconditions:
          - "after appending the key, trained_technician_count >= 2 AND both INSTALLATION and PAYMENT_SYSTEMS appear in completed_training_keys"
        side_effects:
          - "installation_training_state = COMPLETE"
          - "increments Distributor.version by 1"
      - from: AUTHORIZED
        to: PROBATION
        trigger: "POST /clm/distributors/{id}/status-actions with action == PROBATION"
        actor: ChannelManager
        preconditions:
          - "distributor_state == AUTHORIZED else ERR_DISTRIBUTOR_STATE_INVALID"
        side_effects:
          - "probation_reason = the submitted reason (WARRANTY_ABUSE or MANUAL)"
          - "increments Distributor.version by 1"
        note: "PROBATION still permits quote drafting and claim filing but blocks quote submission."
      - from: PROBATION
        to: AUTHORIZED
        trigger: "POST /clm/distributors/{id}/status-actions with action == REINSTATE"
        actor: ChannelManager
        preconditions:
          - "distributor_state == PROBATION else ERR_DISTRIBUTOR_STATE_INVALID"
        side_effects:
          - "probation_reason = NONE"
          - "increments Distributor.version by 1"
      - from: ANY_OF[AUTHORIZED, PROBATION]
        to: TERMINATED
        trigger: "POST /clm/distributors/{id}/status-actions with action == TERMINATE"
        actor: ChannelManager
        preconditions:
          - "distributor_state IN {AUTHORIZED, PROBATION} else ERR_DISTRIBUTOR_STATE_INVALID"
        side_effects:
          - "increments Distributor.version by 1"

  - entity: PackageQuote
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /clm/quotes/{id}/submit"
        actor: Distributor
        preconditions:
          - "quote_state IN {DRAFT, REVISION_REQUESTED} else ERR_QUOTE_STATE_INVALID"
          - "line_count >= 1 else ERR_QUOTE_HAS_NO_LINES"
          - "Distributor.distributor_state == AUTHORIZED else ERR_DISTRIBUTOR_NOT_AUTHORIZED"
          - "when financing_program != NONE, down_payment_cents < total_cents else ERR_INVALID_REQUEST"
        side_effects:
          - "provisional_apr_bp and provisional_monthly_payment_cents computed per calculations.financing_terms variant provisional; both stay null when financing_program == NONE"
          - "origination_fee_cents and financed_principal_cents computed"
          - "increments PackageQuote.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /clm/quotes/{id}/submit"
        actor: Distributor
        preconditions:
          - "identical to the DRAFT_to_SUBMITTED row"
        side_effects:
          - "identical to the DRAFT_to_SUBMITTED row; the provisional variant is recomputed from the current lines and the current distributor_state"
        note: "Closing edge of the quote revision cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /clm/quotes/{id}/decision with decision == APPROVE"
        actor: ChannelManager
        preconditions:
          - "quote_state == SUBMITTED else ERR_QUOTE_STATE_INVALID"
          - "verified_credit_score present else ERR_INVALID_REQUEST"
        side_effects:
          - "verified_credit_score stored; final_apr_bp and monthly_payment_cents computed per calculations.financing_terms variant final"
          - "decided_by_user_id = X-User-ID"
          - "increments PackageQuote.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /clm/quotes/{id}/decision with decision == DECLINE"
        actor: ChannelManager
        preconditions:
          - "quote_state == SUBMITTED else ERR_QUOTE_STATE_INVALID"
        side_effects:
          - "decided_by_user_id = X-User-ID; final_apr_bp and monthly_payment_cents stay null"
          - "increments PackageQuote.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /clm/quotes/{id}/decision with decision == REQUEST_REVISION"
        actor: ChannelManager
        preconditions:
          - "quote_state == SUBMITTED else ERR_QUOTE_STATE_INVALID"
        side_effects:
          - "revision_round += 1; decided_by_user_id = X-User-ID"
          - "provisional_apr_bp and provisional_monthly_payment_cents reset to null so the next submit recomputes them"
          - "lines become editable again"
          - "increments PackageQuote.version by 1"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /clm/warranty-claims/{id}/adjudicate with decision == APPROVE"
        actor: WarrantyAnalyst
        preconditions:
          - "claim_state == SUBMITTED else ERR_CLAIM_STATE_INVALID"
          - "expected_part_version == ServicePart.version else ERR_STALE_PART_VERSION"
          - "the part fits the built model's product line and capacity else ERR_PART_NOT_FITTED"
          - "the claim is coverable (in_service_months <= part.warranty_months AND failure_cycle_count <= effective_rated_cycles) else ERR_CLAIM_NOT_COVERABLE"
          - "ServicePart.on_hand_qty >= 1 else ERR_INSUFFICIENT_PART_STOCK"
        side_effects:
          - "coverage_variant and covered_amount_cents set per calculations.warranty_coverage"
          - "ServicePart.on_hand_qty -= 1 and ServicePart.reserved_qty += 1; increments ServicePart.version by 1"
          - "stock hop: ServicePart.stock_state recomputed; when it becomes BACKORDERED every other SUBMITTED claim on that part moves to FULFILLMENT_BLOCKED with block_reason = PART_BACKORDERED, processed in WarrantyClaim.created_at ASC order"
          - "Distributor.warranty_credit_cents += covered_amount_cents; Distributor.open_claim_count recomputed"
          - "increments WarrantyClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /clm/warranty-claims/{id}/adjudicate with decision == DENY"
        actor: WarrantyAnalyst
        preconditions:
          - "claim_state == SUBMITTED else ERR_CLAIM_STATE_INVALID"
          - "expected_part_version == ServicePart.version else ERR_STALE_PART_VERSION"
          - "denial_reason present and != NONE else ERR_INVALID_REQUEST"
        side_effects:
          - "denial_reason stored; covered_amount_cents stays 0 and coverage_variant stays NONE"
          - "ServicePart stock is untouched but increments ServicePart.version by 1 (the adjudication is journaled against the part)"
          - "Distributor.open_claim_count recomputed"
          - "increments WarrantyClaim.version by 1"
      - from: SUBMITTED
        to: FULFILLMENT_BLOCKED
        trigger: "system: the claimed part became BACKORDERED, or the claimed build took an integrity hold"
        actor: system
        preconditions:
          - "claim_state == SUBMITTED"
        side_effects:
          - "block_reason = PART_BACKORDERED or BUILD_INTEGRITY_HOLD"
          - "Distributor.open_claim_count recomputed"
          - "increments WarrantyClaim.version by 1"
      - from: FULFILLMENT_BLOCKED
        to: SUBMITTED
        trigger: "system: the blocking condition cleared (stock adjustment lifted BACKORDERED, a void returned a unit, or the implicated technician was re-certified)"
        actor: system
        preconditions:
          - "claim_state == FULFILLMENT_BLOCKED"
          - "the claimed part's stock_state != BACKORDERED AND the claimed build's integrity_hold == false"
        side_effects:
          - "block_reason = NONE"
          - "Distributor.open_claim_count recomputed"
          - "increments WarrantyClaim.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /clm/warranty-claims/{id}/void"
        actor: WarrantyAnalyst
        preconditions:
          - "claim_state == APPROVED else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "voided_at = now; covered_amount_cents and coverage_variant are retained for audit"
          - "ServicePart.on_hand_qty += 1 and ServicePart.reserved_qty -= 1; increments ServicePart.version by 1"
          - "ServicePart.stock_state recomputed; when it leaves BACKORDERED every FULFILLMENT_BLOCKED claim on that part with block_reason == PART_BACKORDERED whose build has integrity_hold == false returns to SUBMITTED"
          - "Distributor.warranty_credit_cents -= the claim's covered_amount_cents"
          - "Distributor.open_claim_count recomputed"
          - "increments WarrantyClaim.version by 1"

  - entity: ServicePart
    initial_state: BACKORDERED
    terminal_states: []
    transitions:
      - from: ANY_OF[BACKORDERED, LOW, IN_STOCK]
        to: ANY_OF[BACKORDERED, LOW, IN_STOCK]
        trigger: "system: any mutation of on_hand_qty (POST /clm/service-parts/{id}/stock-adjustments, claim approval, claim void)"
        actor: system
        preconditions:
          - "on_hand_qty >= 0 after the mutation else ERR_STOCK_ADJUSTMENT_NEGATIVE"
        side_effects:
          - "stock_state = BACKORDERED when on_hand_qty == 0, LOW when 0 < on_hand_qty <= reorder_point_qty, IN_STOCK otherwise"
          - "on entry to BACKORDERED: every SUBMITTED claim on this part moves to FULFILLMENT_BLOCKED with block_reason = PART_BACKORDERED"
          - "on exit from BACKORDERED: every FULFILLMENT_BLOCKED claim on this part with block_reason == PART_BACKORDERED whose build has integrity_hold == false returns to SUBMITTED"
          - "increments ServicePart.version by 1"
        note: "stock_state is a derived dimension on the ServicePart row; the initial value is BACKORDERED because on_hand_qty starts at 0."

  - entity: RebateProgram
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /_clock/set_current_utc advancing the clock past effective_to"
        actor: system
        preconditions:
          - "program_state == ACTIVE and effective_to < date(the new clock instant)"
        side_effects:
          - "a RETIRED program no longer qualifies any dossier certified afterwards (calculations.rebate_qualification requires program_state == ACTIVE)"
          - "already-stored MachineModel.rebate_program_codes and rebate_amount_cents are NOT rewritten by retirement; they are audit snapshots of the certification instant"
          - "increments RebateProgram.version by 1"

concurrency_rules:
  - rule_id: quote-line-create-stale-quote
    parent_entity: PackageQuote
    write_endpoint: "POST /clm/quotes/{id}/lines"
    occ_field: "expected_quote_version"
    description: |
      Adding a QuoteLine to a PackageQuote whose version has advanced since the client last read it is rejected.
      A line addition is legitimately repeatable (two identical lines are a valid two-line quote), so the write is
      not covered by any state precondition; the stale-version check is what tells a client that the money fields
      it based its decision on (line_subtotal_cents, discount_cents, total_cents) have already moved.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
  - rule_id: claim-adjudicate-stale-part
    parent_entity: ServicePart
    write_endpoint: "POST /clm/warranty-claims/{id}/adjudicate"
    occ_field: "expected_part_version"
    description: |
      Adjudicating a WarrantyClaim against a ServicePart whose version has advanced since the analyst read its
      stock position is rejected. Adjudicating a second, different claim on the same part is legitimate on its own
      terms, so no state precondition covers it; the stale-version check forces the analyst to re-read on_hand_qty
      and stock_state before committing another unit of that part.
    error_id: ERR_STALE_PART_VERSION
    http_status: 412

# Rounding contract for every calculation below: all money is integer cents; all ratios and percentages are
# evaluated in exact decimal arithmetic at >= 28 significant digits with NO intermediate rounding, and the single
# rounding step named in each formula uses round_half_up (0.5 always away from zero). Percent inputs are decimals
# in percent units (7.25 means 7.25%), so a percent is always divided by 100 before use.
calculations:
  - name: quote_line_total
    trigger: "on POST /clm/quotes/{id}/lines, once per line created"
    algorithm: surcharge_extension
    precision: "integer cents; one round_half_up on the extended amount"
    description: >-
      Extended price of one QuoteLine, including the payment-module surcharge for vended equipment and the
      line-level discount. Rounded exactly once, after the quantity multiplication.
    inputs:
      - "MachineModel.list_price_cents (snapshotted into QuoteLine.unit_price_cents at line creation)"
      - "QuoteLine.quantity (1..50)"
      - "QuoteLine.payment_module (NONE | COIN | CARD | MOBILE)"
      - "QuoteLine.line_discount_pct (0.00..40.00, two decimals)"
    formula: |
      payment_surcharge_cents = surcharge_table[payment_module]
        surcharge_table: NONE -> 0, COIN -> 3500, CARD -> 12500, MOBILE -> 9000
      line_total_cents = round_half_up(
          (unit_price_cents + payment_surcharge_cents) * quantity * (1 - line_discount_pct / 100)
      )
    constraints:
      - "The surcharge is per unit, so it is inside the quantity multiplication."
      - "payment_module must appear in MachineModel.payment_module_options else ERR_PAYMENT_MODULE_NOT_SUPPORTED."
      - "unit_price_cents is a snapshot: a later change to MachineModel.list_price_cents never re-prices an existing line."
    rounding_order_trap: >-
      Rounding must happen once, on the fully extended amount. Rounding the discounted unit price first and then
      multiplying by quantity gives a different answer whenever the per-unit result has a .5 fraction.
    worked_example: |
      unit_price_cents = 780000, payment_module = CARD (surcharge 12500), quantity = 3, line_discount_pct = 2.50
        (780000 + 12500) = 792500
        792500 * 3 = 2377500
        2377500 * (1 - 0.0250) = 2377500 * 0.9750 = 2318062.5
        round_half_up(2318062.5) = 2318063   <-- line_total_cents
      Wrong order (round per unit first): round_half_up(792500 * 0.9750) = round_half_up(772687.5) = 772688;
      772688 * 3 = 2318064, which is 1 cent too high.

  - name: quote_money_rollup
    trigger: "after every QuoteLine create and delete, and re-read at submit and decision time"
    algorithm: aggregation
    precision: "integer cents; one round_half_up on the package discount only"
    description: >-
      Rolls the already-rounded QuoteLine totals up to the PackageQuote money fields. Recomputed on every line
      create and line delete, and re-read at submit and decision time.
    inputs:
      - "the set of QuoteLine rows of the quote, each with its stored line_total_cents"
      - "PackageQuote.package_discount_pct (0.00..15.00, two decimals)"
      - "PackageQuote.freight_cents (>= 0)"
    formula: |
      line_count          = count(lines)
      line_subtotal_cents = sum(line.line_total_cents)                       # a sum of already-rounded integers
      discount_cents      = round_half_up(line_subtotal_cents * package_discount_pct / 100)
      total_cents         = line_subtotal_cents - discount_cents + freight_cents
    constraints:
      - "The subtotal sums stored, already-rounded line totals; it never recomputes lines from unit prices."
      - "The package discount applies to the subtotal only, never to freight_cents."
      - "An empty quote has line_count 0, line_subtotal_cents 0, discount_cents 0 and total_cents == freight_cents."
      - "Money identity that must hold after every line create and every line delete: line_subtotal_cents == sum of surviving line_total_cents, and total_cents == line_subtotal_cents - discount_cents + freight_cents."
    worked_example: |
      lines: [2318063, 2500000] -> line_count = 2, line_subtotal_cents = 4818063
      package_discount_pct = 5.00 -> discount_cents = round_half_up(4818063 * 0.05) = round_half_up(240903.15) = 240903
      freight_cents = 250000 -> total_cents = 4818063 - 240903 + 250000 = 4827160

  - name: financing_terms
    trigger: "variant provisional on POST /clm/quotes/{id}/submit; variant final on POST /clm/quotes/{id}/decision with decision == APPROVE"
    algorithm: tiered_pricing
    precision: "integer cents and integer basis points; monthly_rate held at full decimal precision, one round_half_up on the fee and one on the payment"
    variants:
      - name: provisional
        when: "quote submission, before the channel has verified the buyer's credit"
        difference: "APR adjustment keyed on stated_credit_score; writes provisional_apr_bp and provisional_monthly_payment_cents, and is the only variant that computes origination_fee_cents and financed_principal_cents"
      - name: final
        when: "quote approval, on the channel-verified credit score"
        difference: "APR adjustment keyed on verified_credit_score; writes final_apr_bp and monthly_payment_cents and reuses the principal frozen at submit time"
    description: >-
      Two-variant financing computation for a laundromat equipment package. The provisional variant runs at submit
      time on the distributor-stated credit score; the final variant runs at approval time on the channel-verified
      score. Both variants use the same origination-fee and payment formulas; they differ only in which score
      feeds the APR adjustment and in which fields they write.
    inputs:
      - "PackageQuote.total_cents (from quote_money_rollup)"
      - "PackageQuote.down_payment_cents (>= 0, < total_cents when financing_program != NONE)"
      - "PackageQuote.financing_program (NONE | TERM_36 | TERM_60)"
      - "PackageQuote.stated_credit_score (provisional variant) / PackageQuote.verified_credit_score (final variant)"
      - "Distributor.distributor_state (a distributor on PROBATION carries a risk add-on)"
    formula: |
      # --- shared: principal and origination fee -------------------------------------------------
      pre_fee_principal_cents = total_cents - down_payment_cents
      origination_rate_pct = 2.50  when pre_fee_principal_cents <= 5000000
                             1.75  when 5000000 <  pre_fee_principal_cents <= 15000000
                             1.00  when pre_fee_principal_cents >  15000000
      origination_fee_cents   = round_half_up(pre_fee_principal_cents * origination_rate_pct / 100)
      financed_principal_cents = pre_fee_principal_cents + origination_fee_cents

      # --- variant-specific APR ------------------------------------------------------------------
      base_apr_bp = 1450 when financing_program == TERM_36
                    1690 when financing_program == TERM_60
      score  = stated_credit_score   (variant provisional)
             = verified_credit_score (variant final)
      score_adjustment_bp = -250 when score >= 760
                            -100 when 700 <= score < 760
                               0 when 640 <= score < 700
                            +300 when score < 640
      probation_addon_bp = 150 when Distributor.distributor_state == PROBATION else 0
      apr_bp = clamp(base_apr_bp + score_adjustment_bp + probation_addon_bp, 900, 2400)

      # --- shared: level monthly payment ---------------------------------------------------------
      term_months     = 36 when financing_program == TERM_36 else 60
      monthly_rate    = apr_bp / 10000 / 12            # exact decimal, never pre-rounded
      monthly_payment_cents = round_half_up(
          financed_principal_cents * monthly_rate / (1 - (1 + monthly_rate) ** (-term_months))
      )

      # variant provisional writes provisional_apr_bp, provisional_monthly_payment_cents,
      #   origination_fee_cents, financed_principal_cents
      # variant final      writes final_apr_bp, monthly_payment_cents and leaves the provisional pair untouched
    constraints:
      - "When financing_program == NONE all six financing fields stay null/0 and no fee is charged."
      - "The origination tier is keyed on pre_fee_principal_cents, NOT on financed_principal_cents; the fee never re-tiers itself."
      - "origination_fee_cents and financed_principal_cents are computed once at submit and are NOT recomputed at approval, so an approval never changes the principal."
      - "monthly_rate is kept at full precision; rounding the rate to 4 or 6 decimals before the payment formula changes the payment."
      - "The clamp is applied after both adjustments are summed, never to each adjustment separately."
    worked_example: |
      total_cents = 5450000, down_payment_cents = 500000, financing_program = TERM_60,
      stated_credit_score = 715, verified_credit_score = 668, distributor_state = AUTHORIZED
        pre_fee_principal_cents = 5450000 - 500000 = 4950000
        4950000 <= 5000000 -> origination_rate_pct = 2.50
        origination_fee_cents = round_half_up(4950000 * 0.0250) = 123750
        financed_principal_cents = 4950000 + 123750 = 5073750
        provisional: 700 <= 715 < 760 -> adj = -100 -> provisional_apr_bp = 1690 - 100 = 1590
          monthly_rate = 1590/10000/12 = 0.01325
          provisional_monthly_payment_cents = round_half_up(5073750 * 0.01325 / (1 - 1.01325^-60)) = 123114
        final: 640 <= 668 < 700 -> adj = 0 -> final_apr_bp = 1690
          monthly_rate = 1690/10000/12 = 0.01408333333...
          monthly_payment_cents = round_half_up(5073750 * monthly_rate / (1 - (1+monthly_rate)^-60)) = 125823
      Tier trap: keying the tier on financed_principal_cents (5073750 > 5000000 -> 1.75%) gives
      origination_fee_cents = 86625 and financed_principal_cents = 5036625, both wrong.

  - name: warranty_coverage
    trigger: "effective_rated_cycles at POST /clm/warranty-claims; the full settlement at POST /clm/warranty-claims/{id}/adjudicate with decision == APPROVE"
    algorithm: decay_function
    precision: "integer cents; floor on effective_rated_cycles, one round_half_up on the pro-rata amount"
    variants:
      - name: FULL_REPLACEMENT
        when: "in_service_months <= 12 AND failure_cycle_count * 2 <= effective_rated_cycles"
        difference: "pays the whole unit_price_cents with no depletion applied"
      - name: PRO_RATA
        when: "otherwise"
        difference: "pays unit_price_cents scaled by the MINIMUM of the cycle-remaining and month-remaining ratios"
    description: >-
      Two-variant warranty settlement for a failed service part, driven by duty cycle and product line. The same
      claim inputs feed both branch formulas; the branch selector decides which one is authoritative.
    inputs:
      - "ServicePart.rated_duty_cycles, ServicePart.warranty_months, ServicePart.unit_price_cents"
      - "WarrantyClaim.duty_cycle_class (LIGHT | STANDARD | HEAVY)"
      - "MachineModel.product_line of the claimed BuildOrder (ON_PREMISES | VENDED | INDUSTRIAL_TUNNEL)"
      - "WarrantyClaim.failure_cycle_count (>= 0), WarrantyClaim.in_service_months (>= 0)"
    formula: |
      duty_multiplier = LIGHT -> 1.25, STANDARD -> 1.00, HEAVY -> 0.70
      line_factor     = ON_PREMISES -> 1.00, VENDED -> 0.85, INDUSTRIAL_TUNNEL -> 1.30
      effective_rated_cycles = floor(rated_duty_cycles * duty_multiplier * line_factor)   # floor, not round

      coverable = (in_service_months <= warranty_months) AND (failure_cycle_count <= effective_rated_cycles)
      # not coverable -> ERR_CLAIM_NOT_COVERABLE on adjudicate APPROVE

      # --- branch selector ---
      variant = FULL_REPLACEMENT when in_service_months <= 12 AND failure_cycle_count * 2 <= effective_rated_cycles
              = PRO_RATA         otherwise

      # --- branch FULL_REPLACEMENT ---
      covered_amount_cents = unit_price_cents

      # --- branch PRO_RATA ---
      cycle_remaining_ratio = (effective_rated_cycles - failure_cycle_count) / effective_rated_cycles
      month_remaining_ratio = (warranty_months - in_service_months) / warranty_months
      covered_amount_cents  = round_half_up(unit_price_cents * min(cycle_remaining_ratio, month_remaining_ratio))
    constraints:
      - "effective_rated_cycles uses floor on the exact product; the two multipliers are multiplied together before the floor, never floored one at a time."
      - "The PRO_RATA branch takes the MINIMUM of the two ratios, so whichever entitlement is more depleted governs."
      - "A DENY adjudication leaves coverage_variant NONE and covered_amount_cents 0 regardless of these formulas."
      - "coverage_variant and covered_amount_cents are frozen at adjudication; a later void keeps both for audit while reversing the money on the distributor."
    worked_example: |
      part: rated_duty_cycles = 30000, warranty_months = 36, unit_price_cents = 42000
      claim A: duty_cycle_class = STANDARD, product_line = ON_PREMISES, failure_cycle_count = 8000, in_service_months = 8
        effective_rated_cycles = floor(30000 * 1.00 * 1.00) = 30000
        selector: 8 <= 12 AND 16000 <= 30000 -> FULL_REPLACEMENT -> covered_amount_cents = 42000
        (the PRO_RATA branch on the SAME data would give
           min((30000-8000)/30000, (36-8)/36) = min(0.7333333..., 0.7777777...) = 0.7333333...
           round_half_up(42000 * 0.7333333...) = 30800, which is the wrong answer here)
      claim B: duty_cycle_class = HEAVY, product_line = VENDED, failure_cycle_count = 8000, in_service_months = 14
        effective_rated_cycles = floor(30000 * 0.70 * 0.85) = floor(17850.0) = 17850
        selector: 14 > 12 -> PRO_RATA
        cycle_remaining_ratio = (17850 - 8000)/17850 = 0.5518207...
        month_remaining_ratio = (36 - 14)/36 = 0.6111111...
        covered_amount_cents = round_half_up(42000 * 0.5518207...) = round_half_up(23176.47...) = 23176

  - name: rebate_qualification
    trigger: "on the review that moves a CertificationDossier from IN_REVIEW to CERTIFIED"
    algorithm: threshold
    precision: "integer cents; no rounding, the cap is a min() not a round"
    description: >-
      Selects the single best utility rebate program a certified model qualifies for, from the measured efficiency
      figures on the dossier, and records the payable amount.
    inputs:
      - "CertificationDossier.measured_water_gal_per_cwt, measured_kwh_per_cwt, certified_at"
      - "MachineModel.product_line, MachineModel.capacity_rating_lb"
      - "every RebateProgram row"
    formula: |
      qualifying = programs P where
          P.program_state == ACTIVE
        AND MachineModel.product_line IN P.eligible_product_lines
        AND measured_water_gal_per_cwt <= P.max_water_gal_per_cwt          # inclusive
        AND measured_kwh_per_cwt       <= P.max_kwh_per_cwt                # inclusive
        AND MachineModel.capacity_rating_lb >= P.min_capacity_rating_lb    # inclusive
        AND P.effective_from <= date(certified_at) <= P.effective_to       # inclusive on both ends

      for each qualifying P:
        bonus_steps      = floor((capacity_rating_lb - P.min_capacity_rating_lb) / 10)
        uncapped_cents   = P.rebate_base_cents + P.capacity_bonus_cents_per_10lb * bonus_steps
        payable_cents    = min(uncapped_cents, P.rebate_cap_cents)

      ranking key: uncapped_cents DESC, then P.effective_from ASC, then P.program_code ASC
      qualified_program_codes = [program_code of every qualifying P, sorted program_code ASC]
      rebate_amount_cents    = payable_cents of the top-ranked program
      when qualifying is empty: qualified_program_codes = [] and rebate_amount_cents = 0
    constraints:
      - "All three efficiency/capacity thresholds are inclusive: a model measuring exactly max_water_gal_per_cwt still qualifies."
      - "The date window compares the DATE part of certified_at against effective_from/effective_to inclusively."
      - "Ranking is on the UNCAPPED amount but the stored amount is the CAPPED one, so a program can win the ranking and still pay less than a runner-up would."
      - "qualified_program_codes lists every qualifying program, not just the winner, and is sorted by code."
    worked_example: |
      program UTIL-A-W1: eligible [ON_PREMISES, VENDED, INDUSTRIAL_TUNNEL], max_water 1.05, max_kwh 0.45,
        min_capacity 40, base 60000, bonus 5000 per 10 lb, cap 90000, window 2026-07-01..2026-12-31
      model OPL-60-A: ON_PREMISES, capacity 60 lb; dossier measured water 1.05 (exactly at the limit),
        kwh 0.40, certified_at 2026-08-01T00:00:00Z
        bonus_steps = floor((60 - 40)/10) = 2 -> uncapped = 60000 + 5000*2 = 70000
        payable = min(70000, 90000) = 70000 -> rebate_amount_cents = 70000, codes = ["UTIL-A-W1"]
      model TNL-350-T: INDUSTRIAL_TUNNEL, capacity 350 lb, same program
        bonus_steps = floor((350 - 40)/10) = 31 -> uncapped = 60000 + 155000 = 215000
        payable = min(215000, 90000) = 90000 -> rebate_amount_cents = 90000 (cap binds)

  - name: model_first_pass_yield
    trigger: "on every BuildOrder entry into ACCEPTED or SCRAPPED"
    algorithm: aggregation
    precision: "2 decimal places, round_half_up"
    description: >-
      Share of finished units of a model that cleared QA without any rework. Recomputed on every BuildOrder entry
      into ACCEPTED or SCRAPPED, and it is the trigger metric for the yield-breach cascade.
    inputs:
      - "every BuildOrder of the model whose build_state is ACCEPTED or SCRAPPED"
      - "each such BuildOrder's rework_count"
      - "MachineModel.min_first_pass_yield_pct"
    formula: |
      terminal_units  = count(builds where build_state IN {ACCEPTED, SCRAPPED})
      first_pass_units = count(builds where build_state == ACCEPTED AND rework_count == 0)
      first_pass_yield_pct = 0.00 when terminal_units == 0
                           = round_half_up_2dp(first_pass_units * 100 / terminal_units) otherwise
      breach = terminal_units >= 1 AND first_pass_yield_pct < min_first_pass_yield_pct
    constraints:
      - "Only terminal units count; units on the floor, in rework and on quality hold are excluded from both numerator and denominator."
      - "An ACCEPTED unit with rework_count >= 1 counts in the denominator but not the numerator."
      - "The empty-set answer is 0.00, not null and not 100.00, but it never breaches because terminal_units == 0."
      - "The comparison is strict less-than, so a yield exactly equal to min_first_pass_yield_pct does not breach."
    worked_example: |
      model with max_rework_cycles = 2, min_first_pass_yield_pct = 80.00
      no terminal builds yet -> first_pass_yield_pct = 0.00, breach = false
      one build SCRAPPED (rework_count 3), no accepted units -> terminal_units = 1, first_pass_units = 0
        first_pass_yield_pct = 0.00 and breach = true (0.00 < 80.00) -> yield-breach cascade fires
      later: 4 ACCEPTED with rework_count 0 and 1 SCRAPPED -> 4 * 100 / 5 = 80.00 -> no breach (not strictly less)

  - name: station_occupation_window
    trigger: "on POST /clm/build-orders/{id}/station-logs, before the contention checks"
    algorithm: interval_merge
    precision: "whole minutes, floor"
    description: >-
      Turns a StationLog work interval into the occupation window that a station and a technician are actually
      consumed for, including machine changeover, and reports the labor charged to the build.
    inputs:
      - "StationLog.started_at, StationLog.completed_at (UTC instants, minute precision)"
      - "AssemblyStation.changeover_buffer_minutes (0..120)"
      - "AssemblyStation.parallel_capacity (1..4)"
    formula: |
      occupation_from = started_at
      occupation_to   = completed_at + changeover_buffer_minutes
      labor_minutes   = floor((completed_at - started_at) in minutes)         # buffer is NOT billable labor
      BuildOrder.labor_minutes_total = sum(labor_minutes of every StationLog of the build)

      # station contention, evaluated over occupation windows as CLOSED intervals
      overlaps(A, B) = A.occupation_from <= B.occupation_to AND B.occupation_from <= A.occupation_to
      concurrent_at_station = count(existing logs at the same station whose window overlaps the new window)
      reject with ERR_STATION_CAPACITY_CONFLICT when concurrent_at_station >= parallel_capacity

      # technician contention, evaluated over WORK intervals as HALF-OPEN [started_at, completed_at)
      tech_overlaps(A, B) = A.started_at < B.completed_at AND B.started_at < A.completed_at
      reject with ERR_TECHNICIAN_DOUBLE_BOOKED when any existing log of the same technician tech_overlaps the new one
    constraints:
      - "Station windows are closed on both ends, so a new window starting exactly at an existing occupation_to conflicts."
      - "Technician work intervals are half-open, so a technician may start a new log at the exact instant a previous one completed."
      - "The changeover buffer extends the STATION window only; it never extends the technician window and never counts as labor."
      - "started_at < completed_at else ERR_INTERVAL_INVALID."
      - "labor_minutes uses floor on whole minutes."
    worked_example: |
      station DRUM-01: parallel_capacity = 1, changeover_buffer_minutes = 30
      existing log: started_at 2026-08-01T08:00:00Z, completed_at 2026-08-01T09:00:00Z
        occupation window = [08:00, 09:30], labor_minutes = 60
      new log at 09:15 -> 09:15 <= 09:30 and 08:00 <= new.occupation_to -> overlaps, concurrent = 1 >= 1
        -> ERR_STATION_CAPACITY_CONFLICT
      new log at 09:30 -> 09:30 <= 09:30 is also an overlap under the closed rule -> still a conflict
      new log at 09:31 -> no overlap -> accepted
      same technician, second log started_at exactly 09:00:00Z -> half-open work intervals do not overlap -> allowed

  - name: part_stock_projection
    trigger: "after every mutation of ServicePart.on_hand_qty"
    algorithm: threshold
    precision: "integer units; no rounding"
    description: "Projects ServicePart.stock_state from the on-hand position after any inventory movement."
    inputs:
      - "ServicePart.on_hand_qty after the movement"
      - "ServicePart.reorder_point_qty"
    formula: |
      stock_state = BACKORDERED when on_hand_qty == 0
                  = LOW         when 0 < on_hand_qty <= reorder_point_qty
                  = IN_STOCK    otherwise
      unit conservation invariant across an approve/void pair:
        on_hand_qty + reserved_qty is unchanged by a claim approval and unchanged by a claim void
    constraints:
      - "on_hand_qty may never go negative: a stock adjustment that would take it below 0 is ERR_STOCK_ADJUSTMENT_NEGATIVE and an approval with on_hand_qty == 0 is ERR_INSUFFICIENT_PART_STOCK."
      - "The LOW boundary is inclusive: on_hand_qty exactly equal to reorder_point_qty is LOW, not IN_STOCK."
    worked_example: |
      reorder_point_qty = 2; stock adjustment delta +3 from 0 -> on_hand_qty 3, reserved 0 -> IN_STOCK
      claim approved -> on_hand 2, reserved 1 -> 2 <= 2 -> LOW (sum 3 conserved)
      two more approvals -> on_hand 0, reserved 3 -> BACKORDERED, and every other SUBMITTED claim on the part
        moves to FULFILLMENT_BLOCKED with block_reason PART_BACKORDERED
      one void -> on_hand 1, reserved 2 -> LOW (sum 3 conserved) and the blocked claims return to SUBMITTED

# Priorities are globally unique and strictly ordered: for any single request that violates several rows, the
# row with the LOWEST priority number is the one whose error_id is returned. Path existence is checked
# left-to-right before any body FK; every state precondition outranks every business rule; fiscal checks are last.
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the nine roles declared in §1.7 and that role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body parses, every required input field is present, every enum value is a declared member, every integer is within its declared range, every decimal has at most its declared scale, and unknown fields are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "{id} in /clm/machine-models/{id}/... resolves to a MachineModel"
    error_id: ERR_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/machine-models/{id}, GET /clm/machine-models/{id}/warranty-analysis, POST /clm/machine-models/{id}/lifecycle-actions, POST /clm/machine-models/{id}/certification-dossiers, GET /clm/machine-models/{id}/certification-dossiers"
  - priority: 5
    category: existence
    check: "{id} in /clm/rebate-programs/{id} resolves to a RebateProgram"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/rebate-programs/{id}"
  - priority: 6
    category: existence
    check: "{id} in /clm/certification-dossiers/{id}/... resolves to a CertificationDossier"
    error_id: ERR_DOSSIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/certification-dossiers/{id}, POST /clm/certification-dossiers/{id}/reviews, POST /clm/certification-dossiers/{id}/resurvey-submissions"
  - priority: 7
    category: existence
    check: "{id} in /clm/service-parts/{id}/... resolves to a ServicePart"
    error_id: ERR_PART_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/service-parts/{id}, POST /clm/service-parts/{id}/stock-adjustments"
  - priority: 8
    category: existence
    check: "{id} in /clm/assembly-stations/{id} resolves to an AssemblyStation"
    error_id: ERR_STATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/assembly-stations/{id}"
  - priority: 9
    category: existence
    check: "{id} in /clm/technicians/{id}/... resolves to a Technician"
    error_id: ERR_TECHNICIAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/technicians/{id}, POST /clm/technicians/{id}/certification-actions"
  - priority: 10
    category: existence
    check: "{id} in /clm/build-orders/{id}/... resolves to a BuildOrder"
    error_id: ERR_BUILD_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/build-orders/{id}, POST /clm/build-orders/{id}/release-to-floor, POST /clm/build-orders/{id}/qa-signoff, POST /clm/build-orders/{id}/station-logs"
  - priority: 11
    category: existence
    check: "{id} in /clm/station-logs/{id} resolves to a StationLog"
    error_id: ERR_LOG_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/station-logs/{id}"
  - priority: 12
    category: existence
    check: "{id} in /clm/distributors/{id}/... resolves to a Distributor"
    error_id: ERR_DISTRIBUTOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/distributors/{id}, POST /clm/distributors/{id}/training-completions, POST /clm/distributors/{id}/status-actions"
  - priority: 13
    category: existence
    check: "{id} in /clm/quotes/{id}/... resolves to a PackageQuote"
    error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/quotes/{id}, POST /clm/quotes/{id}/lines, DELETE /clm/quotes/{id}/lines/{line_id}, POST /clm/quotes/{id}/submit, POST /clm/quotes/{id}/decision"
  - priority: 14
    category: existence
    check: "{line_id} in /clm/quotes/{id}/lines/{line_id} resolves to a QuoteLine whose quote_id equals {id}; checked only after the quote itself resolved"
    error_id: ERR_QUOTE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "DELETE /clm/quotes/{id}/lines/{line_id}, GET /clm/quote-lines/{id}"
  - priority: 15
    category: existence
    check: "{id} in /clm/warranty-claims/{id}/... resolves to a WarrantyClaim"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /clm/warranty-claims/{id}, POST /clm/warranty-claims/{id}/adjudicate, POST /clm/warranty-claims/{id}/void"
  - priority: 16
    category: existence
    check: "body model_id resolves to a MachineModel"
    error_id: ERR_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "POST /clm/build-orders, POST /clm/quotes/{id}/lines"
  - priority: 17
    category: existence
    check: "body part_id resolves to a ServicePart, and body supersedes_part_id resolves to a ServicePart when present"
    error_id: ERR_PART_NOT_FOUND
    http_status: 404
    applies_to: "POST /clm/service-parts, POST /clm/warranty-claims"
  - priority: 18
    category: existence
    check: "body build_order_id resolves to a BuildOrder"
    error_id: ERR_BUILD_NOT_FOUND
    http_status: 404
    applies_to: "POST /clm/warranty-claims"
  - priority: 19
    category: existence
    check: "body station_id resolves to an AssemblyStation"
    error_id: ERR_STATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /clm/build-orders/{id}/station-logs"
  - priority: 20
    category: existence
    check: "body technician_id / reported_by_technician_id resolves to a Technician"
    error_id: ERR_TECHNICIAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /clm/distributors/{id}/training-completions, POST /clm/warranty-claims"
  - priority: 21
    category: existence
    check: "body distributor_id resolves to a Distributor, and Technician.distributor_id resolves when employer == DISTRIBUTOR"
    error_id: ERR_DISTRIBUTOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /clm/technicians, POST /clm/quotes, POST /clm/warranty-claims"
  - priority: 22
    category: existence
    check: "the acting X-User-ID of an entity_backed role resolves to a row of its backing entity (Technician for Technician and QualityInspector, Distributor for Distributor)"
    error_id: ERR_TECHNICIAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /clm/build-orders/{id}/station-logs, POST /clm/build-orders/{id}/qa-signoff"
  - priority: 23
    category: business_safety
    check: "for the Distributor role, the addressed resource's distributor_id (PackageQuote.distributor_id, WarrantyClaim.distributor_id, or the body distributor_id on create) equals X-User-ID"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /clm/quotes, GET /clm/quotes/{id}, POST /clm/quotes/{id}/lines, DELETE /clm/quotes/{id}/lines/{line_id}, POST /clm/quotes/{id}/submit, POST /clm/warranty-claims, GET /clm/warranty-claims/{id}"
  - priority: 24
    category: state
    check: "MachineModel.certification_state permits the requested lifecycle action (RELEASE requires CERTIFIED, SUSPEND requires RELEASED)"
    error_id: ERR_MODEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /clm/machine-models/{id}/lifecycle-actions"
  - priority: 25
    category: state
    check: "CertificationDossier.dossier_state permits the operation (reviews require IN_REVIEW and the addressed dimension PENDING; resurvey-submissions require RESURVEY_REQUIRED)"
    error_id: ERR_DOSSIER_STATE_INVALID
    http_status: 409
    applies_to: "POST /clm/certification-dossiers/{id}/reviews, POST /clm/certification-dossiers/{id}/resurvey-submissions"
  - priority: 26
    category: state
    check: "BuildOrder.build_state permits the operation (release-to-floor requires PLANNED or REWORK; qa-signoff requires QA_HOLD; a station-log requires the state whose next station is the submitted station_type; claim creation requires ACCEPTED)"
    error_id: ERR_BUILD_STATE_INVALID
    http_status: 409
    applies_to: "POST /clm/build-orders/{id}/release-to-floor, POST /clm/build-orders/{id}/qa-signoff, POST /clm/build-orders/{id}/station-logs, POST /clm/warranty-claims"
  - priority: 27
    category: state
    check: "the BuildOrder's MachineModel.certification_state is CERTIFIED or RELEASED"
    error_id: ERR_MODEL_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /clm/build-orders/{id}/release-to-floor"
  - priority: 28
    category: state
    check: "Technician.cert_state permits the requested certification action (GRANT requires UNCERTIFIED, EXPIRED or REVOKED; RENEW requires ACTIVE or EXPIRED; REVOKE requires ACTIVE)"
    error_id: ERR_TECHNICIAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /clm/technicians/{id}/certification-actions"
  - priority: 29
    category: state
    check: "Distributor.distributor_state permits the operation (training-completions require PENDING_TRAINING; PROBATION requires AUTHORIZED; REINSTATE requires PROBATION; TERMINATE requires AUTHORIZED or PROBATION; a TERMINATED distributor accepts nothing)"
    error_id: ERR_DISTRIBUTOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /clm/distributors/{id}/training-completions, POST /clm/distributors/{id}/status-actions, POST /clm/quotes, POST /clm/warranty-claims"
  - priority: 30
    category: state
    check: "PackageQuote.quote_state permits the operation (line create and line delete require DRAFT or REVISION_REQUESTED; submit requires DRAFT or REVISION_REQUESTED; decision requires SUBMITTED)"
    error_id: ERR_QUOTE_STATE_INVALID
    http_status: 409
    applies_to: "POST /clm/quotes/{id}/lines, DELETE /clm/quotes/{id}/lines/{line_id}, POST /clm/quotes/{id}/submit, POST /clm/quotes/{id}/decision"
  - priority: 31
    category: state
    check: "WarrantyClaim.claim_state permits the operation (adjudicate requires SUBMITTED; void requires APPROVED)"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /clm/warranty-claims/{id}/adjudicate, POST /clm/warranty-claims/{id}/void"
  - priority: 32
    category: business_constraint
    check: "expected_quote_version equals PackageQuote.version"
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
    applies_to: "POST /clm/quotes/{id}/lines, DELETE /clm/quotes/{id}/lines/{line_id}"
  - priority: 33
    category: business_constraint
    check: "expected_part_version equals ServicePart.version of the claimed part"
    error_id: ERR_STALE_PART_VERSION
    http_status: 412
    applies_to: "POST /clm/warranty-claims/{id}/adjudicate"
  - priority: 34
    category: business_safety
    check: "the acting X-User-ID is not the dossier's prepared_by_user_id and is not the other dimension's reviewer id (a preparer may not review own dossier, and one officer may not clear both dimensions)"
    error_id: ERR_SEGREGATION_OF_DUTIES
