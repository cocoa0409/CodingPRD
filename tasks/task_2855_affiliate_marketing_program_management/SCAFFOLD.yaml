--- # ============================================================================
# SCAFFOLD — Affiliate Marketing Program Management (retail affiliate program)
# §1.0-§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# ============================================================================

scenario: |
  2855. Affiliate Marketing Program Management (retail affiliate program): affiliate application review with site quality, traffic source and brand suitability screening, commission structure by category with new versus returning customer differentiation, tracking implementation with cookie window, cross-device attribution and deduplication against other channels, coupon and loyalty affiliate policy limiting last-click credit for low-incrementality partners, trademark bidding and paid search policy enforcement with monitoring, fraud detection for cookie stuffing, forced clicks and unauthorized coupon distribution, commission validation against returns and cancellations with clawback, payout processing, tax documentation and network fee reconciliation

domain_name: affiliate-program-management

# Flat topology: every business resource is a top-level collection; the empty
# prefix means paths are `/affiliates`, `/conversions`, `/payout-batches`, ...
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections joined by foreign keys. No business resource is nested more
  # than one segment under another; sub-resource GETs exist only as reverse-
  # reachability read channels, never as the identity of the child.

  state_machine_shape: branching
  # AffiliateApplication forks SCREENED -> {APPROVED, APPROVED_WITH_CONDITIONS,
  # REJECTED, CHANGES_REQUESTED} with divergent side-effect sets per branch and a
  # revision loop CHANGES_REQUESTED -> SUBMITTED. Conversion additionally carries
  # two independent state dimensions (attribution_status x validation_status) that
  # advance on different triggers, and PolicyViolationCase is cyclic
  # (REMEDIATION_SUBMITTED -> OPEN on a failed verification).

  relationship_patterns:
    - one_to_many          # Affiliate -> TrackingLink, PayoutBatch -> PayoutLine
    - self_referential     # Affiliate.parent_affiliate_id -> Affiliate.id (sub-networks)
    - cross_aggregate      # CommissionLedgerEntry spans Affiliate / Conversion / PayoutBatch
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The operator who screens an application MUST NOT decide it; the operator who
  # prepares a PayoutBatch MUST NOT approve it. Enforced on X-User-ID, not role.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 49 endpoints / 50 error codes / 7 calculations / 7 state machines.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  - name: Network
    parent: null
    common_fields: true
    description: >-
      Affiliate network the retailer transacts through. Configuration entity:
      supplies the fee model used when a PayoutBatch is settled.
    fields:
      - name: name
        type: string
        source: input
        description: display name of the network
        constraints: "1..120 chars, unique across Network"
      - name: fee_model
        type: enum
        source: input
        description: how the network charges its override fee
        constraints: "PERCENT_OF_COMMISSION | FLAT_PER_CONVERSION | HYBRID"
      - name: fee_bps
        type: integer
        source: input
        description: percentage component of the network fee in basis points
        constraints: "0..3000; MUST be 0 when fee_model == FLAT_PER_CONVERSION"
      - name: flat_fee_cents
        type: integer
        source: input
        description: per-conversion flat component of the network fee, in cents
        constraints: "0..1000; MUST be 0 when fee_model == PERCENT_OF_COMMISSION"
      - name: statement_currency
        type: enum
        source: input
        description: currency the network issues its statements in
        constraints: "USD | EUR | GBP"

  - name: Affiliate
    parent: null
    common_fields: true
    description: >-
      A publisher partner in the program. Root of the commission ledger; carries
      both risk scores, the incrementality tier, and the money balances.
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal entity name of the partner
        constraints: "1..160 chars"
      - name: contact_email
        type: string
        source: input
        description: primary contact address
        constraints: "must contain '@'; unique across Affiliate"
      - name: partner_type
        type: enum
        source: input
        description: promotional model the partner operates
        constraints: "CONTENT | INFLUENCER | PAID_SEARCH | COUPON | LOYALTY_CASHBACK | SUB_NETWORK"
      - name: network_id
        type: string
        source: input
        description: "FK -> Network.id; the network this partner is contracted through"
      - name: parent_affiliate_id
        type: string
        source: input
        default: null
        description: "FK -> Affiliate.id; set when this partner is a sub-affiliate of a SUB_NETWORK parent. Null for top-level partners."
      - name: sub_affiliate_depth
        type: integer
        source: computed
        default: 0
        description: 0 when parent_affiliate_id is null, otherwise parent.sub_affiliate_depth + 1
        constraints: "MUST be <= MAX_SUB_AFFILIATE_DEPTH (1)"
      - name: payout_currency
        type: enum
        source: input
        description: currency the partner is paid in
        constraints: "USD | EUR | GBP"
      - name: status
        type: enum
        source: system
        default: PENDING_APPLICATION
        description: lifecycle state; see state_machines.Affiliate
        constraints: "PENDING_APPLICATION | ACTIVE | SUSPENDED | TERMINATED"
      - name: suspension_cause
        type: enum
        source: system
        default: NONE
        description: why the partner is currently suspended
        constraints: "NONE | COMPLIANCE_ACTION | FRAUD_SCORE_BREACH | PARENT_SUSPENSION"
      - name: fraud_risk_score
        type: integer
        source: computed
        default: 0
        description: POINT_IN_TIME variant of calculations.fraud_risk_score; gates auto-suspension
        constraints: "0..100"
      - name: fraud_risk_score_trailing
        type: number
        source: computed
        default: 0.0
        description: TRAILING_90D_DECAY variant of calculations.fraud_risk_score; gates reinstatement
        constraints: "0.0..100.0, one decimal place"
      - name: incrementality_score_bps
        type: integer
        source: computed
        default: 0
        description: output of calculations.affiliate_incrementality_score, in basis points
        constraints: "0..10000"
      - name: incrementality_tier
        type: enum
        source: computed
        default: MEDIUM
        description: tier derived from incrementality_score_bps; selects the attribution variant
        constraints: "LOW | MEDIUM | HIGH"
      - name: attributed_conversion_count
        type: integer
        source: computed
        default: 0
        description: count of Conversion rows whose attributed_affiliate_id is this partner and whose attribution_status is in {AFFILIATE_ATTRIBUTED, CREDIT_REDUCED}
      - name: new_customer_attributed_count
        type: integer
        source: computed
        default: 0
        description: subset of attributed_conversion_count where Conversion.is_new_customer is true
      - name: coupon_assisted_conversion_count
        type: integer
        source: computed
        default: 0
        description: subset of attributed_conversion_count where Conversion.coupon_code_used is non-null
      - name: accrued_balance_cents
        type: integer
        source: computed
        default: 0
        description: unreserved commission pool; sum of every CommissionLedgerEntry.amount_cents for this partner that is not reserved by an APPROVED batch. May go negative after a clawback.
      - name: reserved_balance_cents
        type: integer
        source: computed
        default: 0
        description: amount moved out of accrued_balance_cents by PayoutBatch approval and not yet paid or released
      - name: lifetime_paid_cents
        type: integer
        source: computed
        default: 0
        description: cumulative sum of PayoutLine.net_cents across PAID lines
      - name: tax_document_status
        type: enum
        source: computed
        default: NONE
        description: status of the partner's most recent TaxDocument by created_at DESC, or NONE when it has none
        constraints: "NONE | PENDING | VALID | EXPIRED | REJECTED"
      - name: open_violation_case_count
        type: integer
        source: computed
        default: 0
        description: count of PolicyViolationCase rows for this partner whose state is in {OPEN, REMEDIATION_REQUESTED, REMEDIATION_SUBMITTED, ESCALATED}
      - name: tracking_link_count
        type: integer
        source: computed
        default: 0
        description: count of TrackingLink rows for this partner regardless of link status

  - name: AffiliateApplication
    parent: null
    common_fields: true
    description: >-
      One review cycle of a partner's admission request. Screening writes the
      two quality scores; the decision branch drives Affiliate.status.
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; the applicant"
      - name: site_url
        type: string
        source: input
        description: primary property the partner will promote from
        constraints: "must start with 'https://'"
      - name: primary_traffic_source
        type: enum
        source: input
        description: dominant traffic source declared by the applicant
        constraints: "ORGANIC_SEARCH | CONTENT_NEWSLETTER | SOCIAL_ORGANIC | PAID_SEARCH | COUPON_DIRECTORY | CASHBACK_PORTAL | INCENTIVIZED_TRAFFIC"
      - name: monthly_traffic_estimate
        type: integer
        source: input
        description: self-reported monthly sessions
        constraints: ">= 0"
      - name: declared_promo_methods
        type: array
        source: input
        description: promotional methods the applicant declares
        constraints: "non-empty array of {EDITORIAL_CONTENT, EMAIL, SOCIAL_POST, COUPON_FEED, TRADEMARK_PAID_SEARCH, BROWSER_EXTENSION, TOOLBAR}"
      - name: product_categories
        type: array
        source: input
        description: retail categories the applicant intends to promote
        constraints: "non-empty array of {APPAREL, ELECTRONICS, HOME, BEAUTY, GROCERY}"
      - name: review_state
        type: enum
        source: system
        default: SUBMITTED
        description: review lifecycle; see state_machines.AffiliateApplication
        constraints: "SUBMITTED | SCREENED | CHANGES_REQUESTED | APPROVED | APPROVED_WITH_CONDITIONS | REJECTED"
      - name: site_quality_score
        type: number
        source: computed
        default: null
        description: output of calculations.site_quality_composite_score; null until screened
        constraints: "0.0..100.0, one decimal place"
      - name: brand_suitability_score
        type: number
        source: computed
        default: null
        description: output of calculations.brand_suitability_score; null until screened
        constraints: "0.0..100.0, one decimal place"
      - name: screening_outcome
        type: enum
        source: computed
        default: NOT_SCREENED
        description: gate derived from the two screening scores
        constraints: "NOT_SCREENED | PASS | CONDITIONAL | FAIL"
      - name: screened_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ComplianceAnalyst that screened this application
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the PartnerManager that decided this application
      - name: revision_round_count
        type: integer
        source: computed
        default: 0
        description: number of completed CHANGES_REQUESTED -> SUBMITTED loops
        constraints: "0..MAX_REVISION_ROUNDS (2)"
      - name: decision_notes
        type: string
        source: input
        default: null
        description: free-text rationale recorded by the decision
      - name: conditional_requirements
        type: array
        source: input
        default: []
        description: obligations attached by an APPROVE_WITH_CONDITIONS decision

  - name: CommissionPolicy
    parent: null
    common_fields: true
    description: >-
      Category-scoped commission schedule with new-versus-returning customer
      rates and a half-open effective window.
    fields:
      - name: policy_code
        type: string
        source: input
        description: human handle for the schedule
        constraints: "1..40 chars, unique across CommissionPolicy"
      - name: product_category
        type: enum
        source: input
        description: retail category the schedule applies to
        constraints: "APPAREL | ELECTRONICS | HOME | BEAUTY | GROCERY"
      - name: partner_type_scope
        type: array
        source: input
        description: partner types this schedule applies to
        constraints: "non-empty array of Affiliate.partner_type values"
      - name: new_customer_rate_bps
        type: integer
        source: input
        description: commission rate applied when Conversion.is_new_customer is true
        constraints: "0..2000"
      - name: returning_customer_rate_bps
        type: integer
        source: input
        description: commission rate applied when Conversion.is_new_customer is false
        constraints: "0..2000"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive lower bound of the effective window (ISO 8601 UTC)
      - name: effective_to
        type: datetime
        source: input
        description: exclusive upper bound of the effective window (ISO 8601 UTC)
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: lifecycle state; see state_machines.CommissionPolicy
        constraints: "DRAFT | ACTIVE | SUPERSEDED"
      - name: superseded_by_policy_id
        type: string
        source: system
        default: null
        description: "FK -> CommissionPolicy.id; set on the older schedule when a newer one for the same (product_category, partner_type_scope) is activated with an identical window"

  - name: TrackingLink
    parent: null
    common_fields: true
    description: Tracking implementation issued to a partner; owns the cookie window.
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; the partner the link belongs to"
      - name: landing_url
        type: string
        source: input
        description: destination the click resolves to
        constraints: "must start with 'https://'"
      - name: sub_id
        type: string
        source: input
        description: partner-chosen sub-identifier for reporting
        constraints: "1..40 chars; unique per affiliate_id"
      - name: cookie_window_days
        type: integer
        source: input
        default: 30
        description: length of the attribution lookback window in days
        constraints: "1..90"
      - name: device_graph_enabled
        type: boolean
        source: input
        default: false
        description: when true, cross-device attribution may match on household_id as well as device_id
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: lifecycle state; see state_machines.TrackingLink
        constraints: "ACTIVE | DISABLED"
      - name: disabled_reason
        type: string
        source: system
        default: null
        description: reason recorded when the link was disabled

  - name: ClickEvent
    parent: null
    common_fields: false
    description: >-
      Append-only click record. Immutable: carries only id and created_at, no
      version, and no update endpoint.
    fields:
      - name: tracking_link_id
        type: string
        source: input
        description: "FK -> TrackingLink.id; the link that produced the click"
      - name: occurred_at
        type: datetime
        source: input
        description: client-asserted click instant (ISO 8601 UTC, three fractional digits)
      - name: device_id
        type: string
        source: input
        description: device fingerprint the click was observed on
        constraints: "1..64 chars"
      - name: household_id
        type: string
        source: input
        description: device-graph household identifier used for cross-device matching
        constraints: "1..64 chars"
      - name: click_type
        type: enum
        source: input
        description: nature of the click as classified at ingestion
        constraints: "ORGANIC_CLICK | FORCED_CLICK | IFRAME_IMPRESSION"
      - name: referrer_domain
        type: string
        source: input
        description: referring domain observed on the click
        constraints: "1..120 chars"
      - name: paid_search_keyword
        type: string
        source: input
        default: null
        description: keyword the click was bought on, when the click came from paid search
      - name: is_trademark_term
        type: boolean
        source: input
        default: false
        description: true when paid_search_keyword contains a protected brand term

  - name: Conversion
    parent: null
    common_fields: true
    description: >-
      A retail order posted to the program. Carries two independent state
      dimensions: attribution_status (who gets credit) and validation_status
      (whether the commission survived returns and cancellations).
    fields:
      - name: order_ref
        type: string
        source: input
        description: retailer order identifier
        constraints: "1..40 chars, unique across Conversion"
      - name: order_total_cents
        type: integer
        source: input
        description: order subtotal eligible for commission, in cents
        constraints: ">= 1"
      - name: product_category
        type: enum
        source: input
        description: category the order is commissioned under
        constraints: "APPAREL | ELECTRONICS | HOME | BEAUTY | GROCERY"
      - name: customer_ref
        type: string
        source: input
        description: pseudonymous customer identifier
        constraints: "1..64 chars"
      - name: is_new_customer
        type: boolean
        source: input
        description: true when the retailer classified the buyer as a new customer
      - name: placed_at
        type: datetime
        source: input
        description: order instant (ISO 8601 UTC, three fractional digits); anchors the cookie window
      - name: device_id
        type: string
        source: input
        description: device the order was placed on; matched against ClickEvent.device_id
      - name: household_id
        type: string
        source: input
        description: household of the buying device; matched against ClickEvent.household_id when the winning link has device_graph_enabled
      - name: coupon_code_used
        type: string
        source: input
        default: null
        description: coupon code redeemed on the order, when any
      - name: other_channel_touch
        type: enum
        source: input
        default: NONE
        description: last non-affiliate marketing touch the retailer recorded on this order
        constraints: "NONE | PAID_SOCIAL | EMAIL | BRAND_PAID_SEARCH | DIRECT"
      - name: other_channel_touch_at
        type: datetime
        source: input
        default: null
        description: instant of the non-affiliate touch; required when other_channel_touch != NONE
      - name: attribution_status
        type: enum
        source: system
        default: UNATTRIBUTED
        description: credit dimension; see state_machines.Conversion
        constraints: "UNATTRIBUTED | AFFILIATE_ATTRIBUTED | CREDIT_REDUCED | DEDUPED_TO_OTHER_CHANNEL | DETACHED"
      - name: validation_status
        type: enum
        source: system
        default: PENDING_VALIDATION
        description: money dimension; see state_machines.Conversion
        constraints: "PENDING_VALIDATION | VALIDATED | REVERSED | CLAWED_BACK"
      - name: attributed_affiliate_id
        type: string
        source: computed
        default: null
        description: "FK -> Affiliate.id; partner that won last-click ranking, null while UNATTRIBUTED or after DETACHED"
      - name: attributed_click_id
        type: string
        source: computed
        default: null
        description: "FK -> ClickEvent.id; the click that won last-click ranking"
      - name: commission_policy_id
        type: string
        source: computed
        default: null
        description: "FK -> CommissionPolicy.id; schedule selected at attribution time"
      - name: candidate_click_count
        type: integer
        source: computed
        default: 0
        description: number of ClickEvent rows that satisfied the cookie-window, click-type, link-status and device-match filters at the last attribution evaluation
      - name: gross_commission_cents
        type: integer
        source: computed
        default: 0
        description: commission under the LAST_CLICK_RAW variant of calculations.attribution_resolution
      - name: payable_commission_cents
        type: integer
        source: computed
        default: 0
        description: commission under the selected variant of calculations.attribution_resolution; the amount actually booked to the ledger
      - name: clawed_back_cents
        type: integer
        source: computed
        default: 0
        description: cumulative magnitude reversed or clawed back from payable_commission_cents
      - name: returned_amount_cents
        type: integer
        source: computed
        default: 0
        description: cumulative merchandise value returned or cancelled on this order

  - name: AttributionDecision
    parent: null
    common_fields: false
    description: >-
      Append-only audit row. Every attribution evaluation writes ONE row per
      declared variant, so the divergence between the two algorithms is
      observable even though only one row drives the ledger.
    fields:
      - name: conversion_id
        type: string
        source: input
        description: "FK -> Conversion.id; the order this evaluation belongs to"
      - name: algorithm_variant
        type: enum
        source: system
        description: which variant of calculations.attribution_resolution produced this row
        constraints: "LAST_CLICK_RAW | INCREMENTALITY_ADJUSTED"
      - name: selected
        type: boolean
        source: system
        description: true on exactly one row per evaluation; that row's commission is booked
      - name: candidate_click_count
        type: integer
        source: system
        description: size of the eligible click set at evaluation time
      - name: winning_click_occurred_at
        type: datetime
        source: system
        default: null
        description: occurred_at of the click that won last-click ranking; null when the candidate set was empty
      - name: device_match_mode
        type: enum
        source: system
        default: NONE
        description: how the winning click matched the order
        constraints: "NONE | DEVICE_EXACT | HOUSEHOLD_GRAPH"
      - name: credit_share_bps
        type: integer
        source: system
        description: share of last-click credit granted under this variant, in basis points
        constraints: "0..10000"
      - name: computed_commission_cents
        type: integer
        source: system
        description: commission this variant would book
      - name: dedup_reason
        type: enum
        source: system
        default: NONE
        description: why credit was withheld or reduced
        constraints: "NONE | OTHER_CHANNEL_LATER_TOUCH | LOW_INCREMENTALITY_PARTNER | NO_ELIGIBLE_CLICK"
      - name: evaluated_at
        type: datetime
        source: system
        description: logical-clock instant of the evaluation

  - name: MonitoringScan
    parent: null
    common_fields: false
    description: >-
      Append-only paid-search and traffic-quality monitoring result for one
      partner over one closed observation window. Creating a scan is the sole
      automated source of PolicyViolationCase rows.
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; partner that was monitored"
      - name: engine
        type: enum
        source: input
        description: surface that was monitored
        constraints: "GOOGLE_ADS | BING_ADS | SHOPPING_FEED | EXTENSION_STORE"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the observation window
      - name: window_end
        type: datetime
        source: input
        description: inclusive end of the observation window
      - name: trademark_hits
        type: integer
        source: input
        description: count of ad impressions bought on protected brand terms
        constraints: ">= 0"
      - name: forced_click_ratio_bps
        type: integer
        source: input
        description: share of the partner's clicks classified as forced, in basis points
        constraints: "0..10000"
      - name: cookie_stuffing_index
        type: integer
        source: input
        description: composite stuffing indicator on a 0..100 scale
        constraints: "0..100"
      - name: unauthorized_coupon_hits
        type: integer
        source: input
        description: count of unauthorized coupon placements observed
        constraints: ">= 0"
      - name: opened_case_count
        type: integer
        source: computed
        description: number of PolicyViolationCase rows this scan created

  - name: PolicyViolationCase
    parent: null
    common_fields: true
    description: >-
      One compliance or fraud case against a partner. Cyclic lifecycle: a failed
      verification returns the case to OPEN for another remediation round.
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; partner the case is against"
      - name: source_scan_id
        type: string
        source: system
        default: null
        description: "FK -> MonitoringScan.id; the scan that opened the case, null for manually filed cases"
      - name: violation_type
        type: enum
        source: input
        description: nature of the violation
        constraints: "TRADEMARK_BIDDING | UNAUTHORIZED_COUPON | COOKIE_STUFFING | FORCED_CLICK"
      - name: evidence_ref
        type: string
        source: input
        description: pointer to the evidence artifact
        constraints: "1..120 chars"
      - name: detected_at
        type: datetime
        source: input
        description: instant the violation was observed; anchors the trailing-decay variant
      - name: state
        type: enum
        source: system
        default: OPEN
        description: case lifecycle; see state_machines.PolicyViolationCase
        constraints: "OPEN | REMEDIATION_REQUESTED | REMEDIATION_SUBMITTED | VERIFIED_CLEARED | ESCALATED | UPHELD"
      - name: severity_weight
        type: integer
        source: computed
        description: SEVERITY_WEIGHT constant selected by violation_type
        constraints: "20 | 25 | 30 | 40"
      - name: failed_verification_count
        type: integer
        source: computed
        default: 0
        description: number of REMEDIATION_SUBMITTED -> OPEN loops this case has taken
      - name: remediation_evidence_ref
        type: string
        source: input
        default: null
        description: artifact the partner submitted for the current remediation round
      - name: opened_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID that filed the case manually; null for scan-opened cases
      - name: last_note
        type: string
        source: input
        default: null
        description: note recorded by the most recent transition

  - name: TaxDocument
    parent: null
    common_fields: true
    description: Tax documentation on file for a partner; gates payout release.
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; partner the document belongs to"
      - name: form_type
        type: enum
        source: input
        description: form the partner filed
        constraints: "W9 | W8BEN"
      - name: tax_id_last4
        type: string
        source: input
        description: last four characters of the tax identifier
        constraints: "exactly 4 chars"
      - name: treaty_withholding_bps
        type: integer
        source: input
        description: withholding rate claimed under treaty, in basis points
        constraints: "0..3000; MUST be 0 when form_type == W9"
      - name: expires_on
        type: datetime
        source: input
        description: instant after which the document is no longer valid
      - name: status
        type: enum
        source: system
        default: PENDING
        description: verification lifecycle; see state_machines.TaxDocument
        constraints: "PENDING | VALID | EXPIRED | REJECTED"
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the FinanceController that verified the document

  - name: CommissionLedgerEntry
    parent: null
    common_fields: false
    description: >-
      Append-only signed money movement on a partner's commission pool. Never
      updated except for payout_batch_id stamping and un-stamping, which are the
      only two mutations the scaffold permits on this entity.
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; partner whose pool moves"
      - name: conversion_id
        type: string
        source: input
        default: null
        description: "FK -> Conversion.id; order that caused the movement, null for batch-level adjustments"
      - name: payout_batch_id
        type: string
        source: system
        default: null
        description: "FK -> PayoutBatch.id; batch that has claimed this entry, null while unbatched"
      - name: entry_type
        type: enum
        source: system
        description: kind of movement
        constraints: "ACCRUAL | REVERSAL | CLAWBACK | ADJUSTMENT | SETTLEMENT"
      - name: amount_cents
        type: integer
        source: system
        description: signed movement; positive for ACCRUAL, negative for REVERSAL, CLAWBACK, SETTLEMENT, and for post-settlement ADJUSTMENT
      - name: memo
        type: string
        source: system
        description: short machine-generated description of the movement

  - name: PayoutBatch
    parent: null
    common_fields: true
    description: >-
      One settlement run for one network over one period. Holds the network-fee
      reconciliation against the network's statement.
    fields:
      - name: network_id
        type: string
        source: input
        description: "FK -> Network.id; network this run settles through"
      - name: period_start
        type: datetime
        source: input
        description: inclusive lower bound of the settlement period
      - name: period_end
        type: datetime
        source: input
        description: exclusive upper bound of the settlement period
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: lifecycle state; see state_machines.PayoutBatch
        constraints: "DRAFT | VALIDATED | APPROVED | PAID | VOIDED"
      - name: line_count
        type: integer
        source: computed
        description: number of PayoutLine rows generated for this batch
      - name: gross_commission_cents
        type: integer
        source: computed
        default: 0
        description: sum of PayoutLine.gross_cents over lines with state != VOIDED
      - name: clawback_cents
        type: integer
        source: computed
        default: 0
        description: sum of PayoutLine.clawback_cents over lines with state != VOIDED
      - name: network_fee_cents
        type: integer
        source: computed
        default: 0
        description: sum of PayoutLine.network_fee_cents over lines with state in {INCLUDED, PAID}
      - name: withholding_cents
        type: integer
        source: computed
        default: 0
        description: sum of PayoutLine.withholding_cents over lines with state in {INCLUDED, PAID}
      - name: net_payable_cents
        type: integer
        source: computed
        default: 0
        description: sum of PayoutLine.net_cents over lines with state in {INCLUDED, PAID}
      - name: statement_gross_cents
        type: integer
        source: input
        default: null
        description: gross commission the network reported for the period; supplied at validation
      - name: statement_fee_cents
        type: integer
        source: input
        default: null
        description: override fee the network reported for the period; supplied at validation
      - name: network_fee_variance_cents
        type: integer
        source: computed
        default: null
        description: statement_fee_cents - network_fee_cents
      - name: network_fee_variance_bps
        type: integer
        source: computed
        default: null
        description: abs(network_fee_variance_cents) relative to network_fee_cents, in basis points
      - name: reconciliation_status
        type: enum
        source: computed
        default: PENDING
        description: outcome of calculations.network_fee_reconciliation
        constraints: "PENDING | MATCHED | ACCEPTED_WITH_VARIANCE"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceAnalyst that created the batch
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the FinanceController that approved the batch
      - name: payment_reference
        type: string
        source: input
        default: null
        description: external payment identifier recorded when the batch is paid
      - name: void_reason
        type: string
        source: input
        default: null
        description: reason recorded when the batch is voided

  - name: PayoutLine
    parent: null
    common_fields: true
    description: One partner's settlement position inside a PayoutBatch.
    fields:
      - name: payout_batch_id
        type: string
        source: input
        description: "FK -> PayoutBatch.id; batch this line belongs to"
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; partner this line settles"
      - name: gross_cents
        type: integer
        source: computed
        description: sum of ACCRUAL CommissionLedgerEntry.amount_cents stamped to this batch for this partner
      - name: clawback_cents
        type: integer
        source: computed
        description: magnitude of REVERSAL, CLAWBACK and ADJUSTMENT entries stamped to this batch for this partner
      - name: net_before_fees_cents
        type: integer
        source: computed
        description: gross_cents - clawback_cents
      - name: conversion_count
        type: integer
        source: computed
        description: number of distinct Conversion rows behind this line's ACCRUAL entries
      - name: network_fee_cents
        type: integer
        source: computed
        description: per-line network fee, rounded to whole cents before any batch-level summation
      - name: withholding_bps
        type: integer
        source: computed
        description: withholding rate applied to this line
      - name: withholding_cents
        type: integer
        source: computed
        description: per-line tax withholding, rounded to whole cents before any batch-level summation
      - name: net_cents
        type: integer
        source: computed
        description: net_before_fees_cents - network_fee_cents - withholding_cents
      - name: state
        type: enum
        source: system
        default: INCLUDED
        description: line lifecycle; see state_machines.PayoutLine
        constraints: "INCLUDED | HELD_TAX_DOC | HELD_FRAUD | HELD_BELOW_MINIMUM | PAID | VOIDED"
      - name: hold_reason
        type: string
        source: system
        default: null
        description: explanation attached when the line entered a HELD_ state
      - name: released_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the FinanceController that released a hold on this line

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  - entity: Affiliate
    initial_state: PENDING_APPLICATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_APPLICATION
        to: ACTIVE
        trigger: "POST /affiliate-applications/{id}/decide with decision APPROVE or APPROVE_WITH_CONDITIONS"
        actor: PartnerManager
        preconditions:
          - "affiliate.status == PENDING_APPLICATION"
          - "application.review_state == SCREENED"
          - "application.affiliate_id == this affiliate"
          - "no PolicyViolationCase for this affiliate has state == UPHELD"
        side_effects:
          - "sets Affiliate.status = ACTIVE and Affiliate.suspension_cause = NONE"
          - "increments Affiliate.version by 1"
          - "recomputes Affiliate.incrementality_score_bps and Affiliate.incrementality_tier per calculations.affiliate_incrementality_score"
      - from: PENDING_APPLICATION
        to: TERMINATED
        trigger: "POST /affiliate-applications/{id}/decide with decision REJECT"
        actor: PartnerManager
        preconditions:
          - "affiliate.status == PENDING_APPLICATION"
          - "application.review_state == SCREENED"
        side_effects:
          - "sets Affiliate.status = TERMINATED"
          - "sets every TrackingLink of this affiliate whose status == ACTIVE to DISABLED with disabled_reason 'APPLICATION_REJECTED'"
          - "increments Affiliate.version by 1"
      - from: PENDING_APPLICATION
        to: SUSPENDED
        trigger: "POST /affiliates/{id}/status-change with target_status SUSPENDED"
        actor: ComplianceAnalyst
        preconditions:
          - "affiliate.status in {PENDING_APPLICATION, ACTIVE}"
        side_effects:
          - "sets Affiliate.status = SUSPENDED and Affiliate.suspension_cause = COMPLIANCE_ACTION"
          - "increments Affiliate.version by 1"
        note: "Compliance may freeze an applicant mid-review; the pending application stays SCREENED but can no longer be approved."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /affiliates/{id}/status-change with target_status SUSPENDED"
        actor: ComplianceAnalyst
        preconditions:
          - "affiliate.status in {PENDING_APPLICATION, ACTIVE}"
        side_effects:
          - "sets Affiliate.status = SUSPENDED and Affiliate.suspension_cause = COMPLIANCE_ACTION"
          - "cascade hop: sets every Affiliate whose parent_affiliate_id == this affiliate and whose status == ACTIVE to SUSPENDED with suspension_cause = PARENT_SUSPENSION"
          - "cascade hop caused by each suspension above: for every affiliate newly SUSPENDED in this request, sets its TrackingLink rows with status == ACTIVE to DISABLED with disabled_reason 'AFFILIATE_SUSPENDED', and sets its PayoutLine rows with state == INCLUDED whose batch state is in {DRAFT, VALIDATED} to HELD_FRAUD with hold_reason 'AFFILIATE_SUSPENDED'"
          - "cascade hop caused by the PayoutLine holds above: recomputes PayoutBatch.network_fee_cents, PayoutBatch.withholding_cents and PayoutBatch.net_payable_cents for every touched batch"
          - "increments Affiliate.version by 1 on every affiliate touched"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: calculations.fraud_risk_score POINT_IN_TIME variant reaches or exceeds FRAUD_SUSPENSION_THRESHOLD (70) after a PolicyViolationCase is created or advanced"
        actor: system
        preconditions:
          - "affiliate.status == ACTIVE"
          - "recomputed Affiliate.fraud_risk_score >= 70"
        side_effects:
          - "sets Affiliate.status = SUSPENDED and Affiliate.suspension_cause = FRAUD_SCORE_BREACH"
          - "cascade hop: sets every Affiliate whose parent_affiliate_id == this affiliate and whose status == ACTIVE to SUSPENDED with suspension_cause = PARENT_SUSPENSION"
          - "cascade hop caused by each suspension above: for every affiliate newly SUSPENDED in this request, sets its TrackingLink rows with status == ACTIVE to DISABLED with disabled_reason 'AFFILIATE_SUSPENDED', and sets its PayoutLine rows with state == INCLUDED whose batch state is in {DRAFT, VALIDATED} to HELD_FRAUD with hold_reason 'AFFILIATE_SUSPENDED'"
          - "cascade hop caused by the PayoutLine holds above: recomputes PayoutBatch.network_fee_cents, PayoutBatch.withholding_cents and PayoutBatch.net_payable_cents for every touched batch"
          - "increments Affiliate.version by 1 on every affiliate touched"
        note: "Sub-affiliate suspension does NOT re-evaluate the sub-affiliate's own fraud score; it is a pure parent-propagation hop."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /affiliates/{id}/status-change with target_status ACTIVE"
        actor: ProgramAdmin
        preconditions:
          - "affiliate.status == SUSPENDED"
          - "affiliate.open_violation_case_count == 0"
          - "affiliate.fraud_risk_score_trailing < REINSTATEMENT_TRAILING_CEILING (25.0)"
          - "if affiliate.parent_affiliate_id is non-null, the parent's status == ACTIVE"
        side_effects:
          - "sets Affiliate.status = ACTIVE and Affiliate.suspension_cause = NONE"
          - "TrackingLink rows are NOT re-enabled; the partner must request new links"
          - "PayoutLine holds are NOT released; a FinanceController must release each line explicitly"
          - "increments Affiliate.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /affiliates/{id}/status-change with target_status TERMINATED"
        actor: ProgramAdmin
        preconditions:
          - "affiliate.status in {PENDING_APPLICATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "sets Affiliate.status = TERMINATED"
          - "sets every TrackingLink of this affiliate whose status == ACTIVE to DISABLED with disabled_reason 'AFFILIATE_TERMINATED'"
          - "increments Affiliate.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /affiliates/{id}/status-change with target_status TERMINATED"
        actor: ProgramAdmin
        preconditions:
          - "affiliate.status in {PENDING_APPLICATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "sets Affiliate.status = TERMINATED"
          - "sets every TrackingLink of this affiliate whose status == ACTIVE to DISABLED with disabled_reason 'AFFILIATE_TERMINATED'"
          - "increments Affiliate.version by 1"

  - entity: AffiliateApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, APPROVED_WITH_CONDITIONS, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /affiliate-applications/{id}/screen"
        actor: ComplianceAnalyst
        preconditions:
          - "application.review_state == SUBMITTED"
          - "affiliate.status == PENDING_APPLICATION"
        side_effects:
          - "computes AffiliateApplication.site_quality_score per calculations.site_quality_composite_score"
          - "computes AffiliateApplication.brand_suitability_score per calculations.brand_suitability_score"
          - "sets AffiliateApplication.screening_outcome from the two scores per calculations.site_quality_composite_score.gate"
          - "records AffiliateApplication.screened_by_user_id = X-User-ID"
          - "increments AffiliateApplication.version by 1"
      - from: SCREENED
        to: APPROVED
        trigger: "POST /affiliate-applications/{id}/decide with decision APPROVE"
        actor: PartnerManager
        preconditions:
          - "application.review_state == SCREENED"
          - "application.screening_outcome == PASS"
          - "X-User-ID != application.screened_by_user_id"
          - "expected_affiliate_version == affiliate.version"
          - "affiliate.status == PENDING_APPLICATION"
          - "no PolicyViolationCase for this affiliate has state == UPHELD"
        side_effects:
          - "sets AffiliateApplication.review_state = APPROVED and decided_by_user_id = X-User-ID"
          - "cascade hop: transitions Affiliate PENDING_APPLICATION -> ACTIVE"
          - "increments AffiliateApplication.version by 1"
      - from: SCREENED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /affiliate-applications/{id}/decide with decision APPROVE_WITH_CONDITIONS"
        actor: PartnerManager
        preconditions:
          - "application.review_state == SCREENED"
          - "application.screening_outcome in {PASS, CONDITIONAL}"
          - "conditional_requirements is a non-empty array"
          - "X-User-ID != application.screened_by_user_id"
          - "expected_affiliate_version == affiliate.version"
          - "affiliate.status == PENDING_APPLICATION"
          - "no PolicyViolationCase for this affiliate has state == UPHELD"
        side_effects:
          - "sets AffiliateApplication.review_state = APPROVED_WITH_CONDITIONS, stores conditional_requirements, sets decided_by_user_id = X-User-ID"
          - "cascade hop: transitions Affiliate PENDING_APPLICATION -> ACTIVE"
          - "increments AffiliateApplication.version by 1"
        note: "Divergent branch: unlike APPROVE this branch requires a non-empty conditional_requirements array and accepts a CONDITIONAL screening outcome."
      - from: SCREENED
        to: CHANGES_REQUESTED
        trigger: "POST /affiliate-applications/{id}/decide with decision REQUEST_CHANGES"
        actor: PartnerManager
        preconditions:
          - "application.review_state == SCREENED"
          - "application.revision_round_count < MAX_REVISION_ROUNDS (2)"
          - "X-User-ID != application.screened_by_user_id"
          - "expected_affiliate_version == affiliate.version"
        side_effects:
          - "sets AffiliateApplication.review_state = CHANGES_REQUESTED and decided_by_user_id = X-User-ID"
          - "Affiliate.status is unchanged and stays PENDING_APPLICATION"
          - "increments AffiliateApplication.version by 1"
        note: "Divergent branch: no Affiliate cascade at all, unlike the three terminal branches."
      - from: SCREENED
        to: REJECTED
        trigger: "POST /affiliate-applications/{id}/decide with decision REJECT"
        actor: PartnerManager
        preconditions:
          - "application.review_state == SCREENED"
          - "X-User-ID != application.screened_by_user_id"
          - "expected_affiliate_version == affiliate.version"
          - "affiliate.status == PENDING_APPLICATION"
        side_effects:
          - "sets AffiliateApplication.review_state = REJECTED and decided_by_user_id = X-User-ID"
          - "cascade hop: transitions Affiliate PENDING_APPLICATION -> TERMINATED"
          - "increments AffiliateApplication.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /affiliate-applications/{id}/resubmit"
        actor: AffiliatePartner
        preconditions:
          - "application.review_state == CHANGES_REQUESTED"
          - "X-User-ID == application.affiliate_id"
          - "affiliate.status == PENDING_APPLICATION"
          - "application.revision_round_count < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "overwrites site_url, primary_traffic_source and declared_promo_methods with the resubmitted values"
          - "increments AffiliateApplication.revision_round_count by 1"
          - "clears site_quality_score, brand_suitability_score and screened_by_user_id back to null and screening_outcome back to NOT_SCREENED"
          - "increments AffiliateApplication.version by 1"
        note: "Cycle: the application returns to SUBMITTED and must be screened again by a ComplianceAnalyst."

  - entity: CommissionPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /commission-policies/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "policy.status == DRAFT"
          - "expected_policy_version == policy.version"
          - "policy.effective_from < policy.effective_to"
          - "no CommissionPolicy with status == ACTIVE, the same product_category, and a non-empty partner_type_scope intersection has a window overlapping [effective_from, effective_to) under half-open arithmetic"
        side_effects:
          - "sets CommissionPolicy.status = ACTIVE"
          - "cascade hop: when an ACTIVE policy exists with the same product_category, an identical [effective_from, effective_to) window and a non-empty partner_type_scope intersection, that policy transitions ACTIVE -> SUPERSEDED and its superseded_by_policy_id is set to this policy"
          - "increments CommissionPolicy.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: another CommissionPolicy with an identical window and overlapping scope is activated"
        actor: system
        preconditions:
          - "policy.status == ACTIVE"
          - "the incoming policy's window equals this policy's window exactly"
        side_effects:
          - "sets CommissionPolicy.status = SUPERSEDED and superseded_by_policy_id = the activating policy's id"
          - "increments CommissionPolicy.version by 1"
        note: "Exactly-equal windows supersede; partially overlapping windows are rejected instead with ERR_POLICY_WINDOW_OVERLAP."

  - entity: TrackingLink
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /tracking-links/{id}/disable"
        actor: PartnerManager
        preconditions:
          - "link.status == ACTIVE"
        side_effects:
          - "sets TrackingLink.status = DISABLED and disabled_reason = request reason"
          - "increments TrackingLink.version by 1"
          - "already-recorded ClickEvent rows are retained but stop being eligible attribution candidates"
      - from: ACTIVE
        to: DISABLED
        trigger: "system event: the owning Affiliate transitions to SUSPENDED or TERMINATED"
        actor: system
        preconditions:
          - "link.status == ACTIVE"
        side_effects:
          - "sets TrackingLink.status = DISABLED with disabled_reason 'AFFILIATE_SUSPENDED', 'AFFILIATE_TERMINATED' or 'APPLICATION_REJECTED' according to the causing transition"
          - "increments TrackingLink.version by 1"

  - entity: Conversion
    initial_state: "UNATTRIBUTED x PENDING_VALIDATION"
    terminal_states: ["DETACHED x REVERSED", "CREDIT_REDUCED x CLAWED_BACK", "AFFILIATE_ATTRIBUTED x CLAWED_BACK", "DEDUPED_TO_OTHER_CHANNEL x PENDING_VALIDATION"]
    note: >-
      Two independent state dimensions on one row. attribution_status advances on
      POST /conversions/{id}/attribute; validation_status advances on the payout
      batch validation sweep and on POST /conversions/{id}/order-adjustment. The
      dimensions never share a trigger except order-adjustment, which moves both.
    transitions:
      - from: UNATTRIBUTED
        to: AFFILIATE_ATTRIBUTED
        trigger: "POST /conversions/{id}/attribute when the selected variant is LAST_CLICK_RAW"
        actor: TrackingIngestor
        preconditions:
          - "conversion.attribution_status == UNATTRIBUTED"
          - "expected_conversion_version == conversion.version"
          - "the eligible click set is non-empty"
          - "the winning click's TrackingLink.status == ACTIVE"
          - "the winning click's Affiliate.status == ACTIVE"
          - "an ACTIVE CommissionPolicy covers (conversion.product_category, affiliate.partner_type) at conversion.placed_at"
          - "affiliate.incrementality_tier (pre-state) != LOW and the coupon-partner override does not apply"
          - "conversion.other_channel_touch == NONE or other_channel_touch_at <= winning click's occurred_at"
        side_effects:
          - "writes two AttributionDecision rows, one per algorithm_variant, with selected true on LAST_CLICK_RAW"
          - "sets attribution_status = AFFILIATE_ATTRIBUTED, attributed_affiliate_id, attributed_click_id, commission_policy_id, candidate_click_count, gross_commission_cents and payable_commission_cents"
          - "cascade hop: appends an ACCRUAL CommissionLedgerEntry of +payable_commission_cents"
          - "cascade hop caused by the ledger append: increases Affiliate.accrued_balance_cents by the same amount"
          - "increments Affiliate.attributed_conversion_count, and new_customer_attributed_count / coupon_assisted_conversion_count where applicable, then recomputes Affiliate.incrementality_score_bps and incrementality_tier to their post-state values"
          - "increments Conversion.version by 1 and Affiliate.version by 1"
      - from: UNATTRIBUTED
        to: CREDIT_REDUCED
        trigger: "POST /conversions/{id}/attribute when the selected variant is INCREMENTALITY_ADJUSTED"
        actor: TrackingIngestor
        preconditions:
          - "conversion.attribution_status == UNATTRIBUTED"
          - "expected_conversion_version == conversion.version"
          - "the eligible click set is non-empty"
          - "the winning click's TrackingLink.status == ACTIVE"
          - "the winning click's Affiliate.status == ACTIVE"
          - "an ACTIVE CommissionPolicy covers (conversion.product_category, affiliate.partner_type) at conversion.placed_at"
          - "affiliate.incrementality_tier (pre-state) == LOW, or affiliate.partner_type is in {COUPON, LOYALTY_CASHBACK} and conversion.coupon_code_used is non-null"
          - "conversion.other_channel_touch == NONE or other_channel_touch_at <= winning click's occurred_at"
        side_effects:
          - "writes two AttributionDecision rows, one per algorithm_variant, with selected true on INCREMENTALITY_ADJUSTED and dedup_reason LOW_INCREMENTALITY_PARTNER"
          - "sets attribution_status = CREDIT_REDUCED and payable_commission_cents to the reduced amount while gross_commission_cents keeps the raw amount"
          - "cascade hop: appends an ACCRUAL CommissionLedgerEntry of +payable_commission_cents"
          - "cascade hop caused by the ledger append: increases Affiliate.accrued_balance_cents by the same amount"
          - "increments Affiliate.attributed_conversion_count, and new_customer_attributed_count / coupon_assisted_conversion_count where applicable, then recomputes Affiliate.incrementality_score_bps and incrementality_tier to their post-state values"
          - "increments Conversion.version by 1 and Affiliate.version by 1"
      - from: UNATTRIBUTED
        to: DEDUPED_TO_OTHER_CHANNEL
        trigger: "POST /conversions/{id}/attribute when a non-affiliate touch is later than the winning click"
        actor: TrackingIngestor
        preconditions:
          - "conversion.attribution_status == UNATTRIBUTED"
          - "expected_conversion_version == conversion.version"
          - "the eligible click set is non-empty"
          - "conversion.other_channel_touch != NONE and other_channel_touch_at > winning click's occurred_at"
        side_effects:
          - "writes two AttributionDecision rows with credit_share_bps 0, computed_commission_cents 0 and dedup_reason OTHER_CHANNEL_LATER_TOUCH; selected is true on LAST_CLICK_RAW"
          - "sets attribution_status = DEDUPED_TO_OTHER_CHANNEL, attributed_affiliate_id = null, attributed_click_id = the winning click, gross_commission_cents = 0 and payable_commission_cents = 0"
          - "appends NO CommissionLedgerEntry and leaves every Affiliate counter and balance unchanged"
          - "increments Conversion.version by 1"
      - from: UNATTRIBUTED
        to: UNATTRIBUTED
        trigger: "POST /conversions/{id}/attribute when the eligible click set is empty"
        actor: TrackingIngestor
        preconditions:
          - "conversion.attribution_status == UNATTRIBUTED"
          - "expected_conversion_version == conversion.version"
          - "the eligible click set is empty"
        side_effects:
          - "writes two AttributionDecision rows with candidate_click_count 0, credit_share_bps 0, computed_commission_cents 0 and dedup_reason NO_ELIGIBLE_CLICK"
          - "leaves attribution_status = UNATTRIBUTED with candidate_click_count = 0 and payable_commission_cents = 0"
          - "appends NO CommissionLedgerEntry"
          - "increments Conversion.version by 1"
        note: "Empty-set edge: the request succeeds with 200 rather than raising an error, so a later attribute call with a fresh click can still win."
      - from: AFFILIATE_ATTRIBUTED
        to: DETACHED
        trigger: "POST /conversions/{id}/order-adjustment with adjustment_type FULL_CANCELLATION while validation_status == PENDING_VALIDATION"
        actor: TrackingIngestor
        preconditions:
          - "conversion.attribution_status in {AFFILIATE_ATTRIBUTED, CREDIT_REDUCED}"
          - "conversion.validation_status == PENDING_VALIDATION"
          - "returned_amount_cents == conversion.order_total_cents"
        side_effects:
          - "sets attribution_status = DETACHED, validation_status = REVERSED, attributed_affiliate_id = null"
          - "cascade hop: appends a REVERSAL CommissionLedgerEntry of -payable_commission_cents against the same conversion_id"
          - "cascade hop caused by the ledger append: decreases Affiliate.accrued_balance_cents by the same magnitude"
          - "cascade hop caused by the detachment: decrements Affiliate.attributed_conversion_count, and new_customer_attributed_count / coupon_assisted_conversion_count where they were incremented, then recomputes Affiliate.incrementality_score_bps and incrementality_tier"
          - "sets Conversion.clawed_back_cents = payable_commission_cents and returned_amount_cents = order_total_cents"
          - "increments Conversion.version by 1 and Affiliate.version by 1"
      - from: CREDIT_REDUCED
        to: DETACHED
        trigger: "POST /conversions/{id}/order-adjustment with adjustment_type FULL_CANCELLATION while validation_status == PENDING_VALIDATION"
        actor: TrackingIngestor
        preconditions:
          - "conversion.attribution_status in {AFFILIATE_ATTRIBUTED, CREDIT_REDUCED}"
          - "conversion.validation_status == PENDING_VALIDATION"
          - "returned_amount_cents == conversion.order_total_cents"
        side_effects:
          - "identical to the AFFILIATE_ATTRIBUTED -> DETACHED transition; the reversal magnitude is the reduced payable_commission_cents, not the raw gross"
          - "increments Conversion.version by 1 and Affiliate.version by 1"
      - from: PENDING_VALIDATION
        to: VALIDATED
        trigger: "system event: the validation sweep run by POST /payout-batches"
        actor: system
        preconditions:
          - "conversion.attribution_status in {AFFILIATE_ATTRIBUTED, CREDIT_REDUCED}"
          - "conversion.placed_at + VALIDATION_HOLD_DAYS (30) <= logical clock now"
        side_effects:
          - "sets validation_status = VALIDATED"
          - "increments Conversion.version by 1"
        note: "Boundary is inclusive: a conversion whose placed_at is exactly 30 days before the clock validates in this sweep."
      - from: VALIDATED
        to: CLAWED_BACK
        trigger: "POST /conversions/{id}/order-adjustment with adjustment_type FULL_RETURN"
        actor: TrackingIngestor
        preconditions:
          - "conversion.validation_status == VALIDATED"
          - "returned_amount_cents == conversion.order_total_cents"
        side_effects:
          - "sets validation_status = CLAWED_BACK; attribution_status is left unchanged"
          - "cascade hop: appends a CLAWBACK entry of -clawback_commission_cents, or an ADJUSTMENT entry of the same magnitude when the conversion's ACCRUAL entry is stamped to a PAID PayoutBatch"
          - "cascade hop caused by the ledger append: decreases Affiliate.accrued_balance_cents by the same magnitude"
          - "cascade hop caused by the ledger append when the ACCRUAL entry is stamped to a batch whose state is in {DRAFT, VALIDATED}: stamps the new entry to that batch and recomputes the affiliate's PayoutLine in it per calculations.payout_line_settlement"
          - "cascade hop caused by the PayoutLine recompute: when the recomputed net_cents < MIN_PAYOUT_CENTS (2500) the line moves INCLUDED -> HELD_BELOW_MINIMUM and the batch totals are recomputed"
          - "increments Conversion.version by 1 and Affiliate.version by 1"
      - from: VALIDATED
        to: VALIDATED
        trigger: "POST /conversions/{id}/order-adjustment with adjustment_type PARTIAL_RETURN"
        actor: TrackingIngestor
        preconditions:
          - "conversion.validation_status == VALIDATED"
          - "0 < returned_amount_cents < conversion.order_total_cents"
        side_effects:
          - "leaves validation_status = VALIDATED and accumulates Conversion.returned_amount_cents and clawed_back_cents"
          - "cascade hop: appends a CLAWBACK entry (or ADJUSTMENT when already settled) for the pro-rata magnitude per calculations.clawback_allocation"
          - "cascade hop caused by the ledger append: decreases Affiliate.accrued_balance_cents by the same magnitude and, when the entry is stamped to a non-terminal batch, recomputes that batch's PayoutLine and totals"
          - "increments Conversion.version by 1 and Affiliate.version by 1"
      - from: PENDING_VALIDATION
        to: REVERSED
        trigger: "POST /conversions/{id}/order-adjustment with adjustment_type FULL_RETURN while still PENDING_VALIDATION"
        actor: TrackingIngestor
        preconditions:
          - "conversion.validation_status == PENDING_VALIDATION"
          - "returned_amount_cents == conversion.order_total_cents"
        side_effects:
          - "sets validation_status = REVERSED and attribution_status = DETACHED"
          - "cascade hop: appends a REVERSAL entry of -payable_commission_cents"
          - "cascade hop caused by the ledger append: decreases Affiliate.accrued_balance_cents and decrements the affiliate's attribution counters, then recomputes incrementality"
          - "increments Conversion.version by 1 and Affiliate.version by 1"

  - entity: PolicyViolationCase
    initial_state: OPEN
    terminal_states: [VERIFIED_CLEARED, UPHELD]
    transitions:
      - from: OPEN
        to: REMEDIATION_REQUESTED
        trigger: "POST /policy-violation-cases/{id}/transition with action REQUEST_REMEDIATION"
        actor: ComplianceAnalyst
        preconditions:
          - "case.state == OPEN"
          - "affiliate.status != TERMINATED"
        side_effects:
          - "sets PolicyViolationCase.state = REMEDIATION_REQUESTED and last_note = request note"
          - "increments PolicyViolationCase.version by 1"
      - from: REMEDIATION_REQUESTED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /policy-violation-cases/{id}/transition with action SUBMIT_REMEDIATION"
        actor: AffiliatePartner
        preconditions:
          - "case.state == REMEDIATION_REQUESTED"
          - "X-User-ID == case.affiliate_id"
          - "affiliate.status != TERMINATED"
          - "remediation_evidence_ref is present"
        side_effects:
          - "sets state = REMEDIATION_SUBMITTED and stores remediation_evidence_ref"
          - "increments PolicyViolationCase.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: VERIFIED_CLEARED
        trigger: "POST /policy-violation-cases/{id}/transition with action VERIFY and verify_outcome CLEARED"
        actor: ComplianceAnalyst
        preconditions:
          - "case.state == REMEDIATION_SUBMITTED"
          - "X-User-ID != case.opened_by_user_id"
        side_effects:
          - "sets state = VERIFIED_CLEARED"
          - "cascade hop: decrements Affiliate.open_violation_case_count and recomputes both fraud_risk_score variants; the cleared case contributes CLEARED_DECAY_MULTIPLIER (0.25) to the trailing variant and nothing to the point-in-time variant"
          - "increments PolicyViolationCase.version by 1 and Affiliate.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: OPEN
        trigger: "POST /policy-violation-cases/{id}/transition with action VERIFY and verify_outcome FAILED"
        actor: ComplianceAnalyst
        preconditions:
          - "case.state == REMEDIATION_SUBMITTED"
          - "X-User-ID != case.opened_by_user_id"
        side_effects:
          - "sets state = OPEN and increments failed_verification_count by 1"
          - "recomputes both Affiliate fraud_risk_score variants; the point-in-time contribution is unchanged because OPEN and REMEDIATION_SUBMITTED both count"
          - "increments PolicyViolationCase.version by 1"
        note: "Cycle: the case can loop OPEN -> REMEDIATION_REQUESTED -> REMEDIATION_SUBMITTED -> OPEN any number of times, but ESCALATE becomes available only once failed_verification_count >= 2."
      - from: OPEN
        to: ESCALATED
        trigger: "POST /policy-violation-cases/{id}/transition with action ESCALATE"
        actor: ComplianceAnalyst
        preconditions:
          - "case.state == OPEN"
          - "case.failed_verification_count >= ESCALATION_FAILED_ROUNDS (2)"
        side_effects:
          - "sets state = ESCALATED"
          - "increments PolicyViolationCase.version by 1"
      - from: ESCALATED
        to: UPHELD
        trigger: "POST /policy-violation-cases/{id}/transition with action VERIFY and verify_outcome UPHELD"
        actor: ProgramAdmin
        preconditions:
          - "case.state == ESCALATED"
        side_effects:
          - "sets state = UPHELD"
          - "cascade hop: recomputes both Affiliate fraud_risk_score variants; UPHELD still contributes full severity_weight to the point-in-time variant"
          - "cascade hop caused by the recompute: when the point-in-time score reaches 70 the affiliate auto-suspends per state_machines.Affiliate"
          - "increments PolicyViolationCase.version by 1"

  - entity: TaxDocument
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: VALID
        trigger: "POST /tax-documents/{id}/verify with verification_outcome VALID"
        actor: FinanceController
        preconditions:
          - "document.status == PENDING"
          - "document.expires_on > logical clock now"
        side_effects:
          - "sets TaxDocument.status = VALID and verified_by_user_id = X-User-ID"
          - "cascade hop: sets Affiliate.tax_document_status = VALID when this is the partner's most recent document by created_at DESC"
          - "increments TaxDocument.version by 1 and Affiliate.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /tax-documents/{id}/verify with verification_outcome REJECTED"
        actor: FinanceController
        preconditions:
          - "document.status == PENDING"
        side_effects:
          - "sets TaxDocument.status = REJECTED"
          - "cascade hop: sets Affiliate.tax_document_status = REJECTED when this is the partner's most recent document by created_at DESC"
          - "increments TaxDocument.version by 1 and Affiliate.version by 1"
      - from: VALID
        to: EXPIRED
        trigger: "system event: the tax-status refresh run at the start of POST /payout-batches and POST /payout-batches/{id}/validate"
        actor: system
        preconditions:
          - "document.status == VALID"
          - "document.expires_on <= logical clock now"
        side_effects:
          - "sets TaxDocument.status = EXPIRED"
          - "cascade hop: sets Affiliate.tax_document_status = EXPIRED when this is the partner's most recent document by created_at DESC"
          - "increments TaxDocument.version by 1 and Affiliate.version by 1"

  - entity: PayoutBatch
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /payout-batches/{id}/validate"
        actor: FinanceAnalyst
        preconditions:
          - "batch.state == DRAFT"
          - "statement_gross_cents == batch.gross_commission_cents"
          - "calculations.network_fee_reconciliation yields MATCHED or ACCEPTED_WITH_VARIANCE"
        side_effects:
          - "refreshes TaxDocument expiry and Affiliate.tax_document_status for every affiliate on the batch"
          - "applies holds: each PayoutLine with state == INCLUDED whose affiliate.tax_document_status != VALID moves to HELD_TAX_DOC; each whose affiliate.status != ACTIVE moves to HELD_FRAUD"
          - "recomputes network_fee_variance_cents, network_fee_variance_bps and reconciliation_status"
          - "recomputes network_fee_cents, withholding_cents and net_payable_cents over the surviving INCLUDED lines"
          - "sets batch.state = VALIDATED"
          - "increments PayoutBatch.version by 1"
      - from: VALIDATED
        to: APPROVED
        trigger: "POST /payout-batches/{id}/approve"
        actor: FinanceController
        preconditions:
          - "batch.state == VALIDATED"
          - "expected_batch_version == batch.version"
          - "X-User-ID != batch.prepared_by_user_id"
          - "batch.net_payable_cents <= APPROVAL_LIMIT_CENTS (5000000)"
        side_effects:
          - "sets batch.state = APPROVED and approved_by_user_id = X-User-ID"
          - "cascade hop: for every PayoutLine with state == INCLUDED, moves line.net_before_fees_cents from Affiliate.accrued_balance_cents to Affiliate.reserved_balance_cents"
          - "increments PayoutBatch.version by 1 and Affiliate.version by 1 for every reserved partner"
      - from: APPROVED
        to: PAID
        trigger: "POST /payout-batches/{id}/pay"
        actor: FinanceController
        preconditions:
          - "batch.state == APPROVED"
          - "payment_reference is present"
        side_effects:
          - "sets batch.state = PAID, records payment_reference, and moves every PayoutLine with state == INCLUDED to PAID"
          - "cascade hop: for every paid line, appends a SETTLEMENT CommissionLedgerEntry of -line.net_before_fees_cents stamped to this batch"
          - "cascade hop caused by the settlement entries: decreases Affiliate.reserved_balance_cents by line.net_before_fees_cents and increases Affiliate.lifetime_paid_cents by line.net_cents"
          - "PayoutLine rows in any HELD_ state stay held and their ledger entries are un-stamped back to payout_batch_id = null so a later batch can claim them"
          - "increments PayoutBatch.version by 1 and Affiliate.version by 1 for every paid partner"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /payout-batches/{id}/void"
        actor: FinanceController
        preconditions:
          - "batch.state in {DRAFT, VALIDATED, APPROVED}"
          - "void_reason is present"
        side_effects:
          - "sets batch.state = VOIDED, records void_reason, and moves every PayoutLine to VOIDED"
          - "cascade hop: for every line that had been reserved at approval, moves line.net_before_fees_cents back from Affiliate.reserved_balance_cents to Affiliate.accrued_balance_cents"
          - "cascade hop: un-stamps every CommissionLedgerEntry whose payout_batch_id is this batch back to null; NO ledger entry is created or deleted"
          - "increments PayoutBatch.version by 1 and Affiliate.version by 1 for every released partner"
        note: "Compensating action for approval: the pair (approve, void) leaves accrued_balance_cents + reserved_balance_cents and the ledger row set exactly as they were before approval."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /payout-batches/{id}/void"
        actor: FinanceController
        preconditions:
          - "batch.state in {DRAFT, VALIDATED, APPROVED}"
          - "void_reason is present"
        side_effects:
          - "sets batch.state = VOIDED and moves every PayoutLine to VOIDED"
          - "cascade hop: un-stamps every CommissionLedgerEntry whose payout_batch_id is this batch back to null"
          - "no balance movement occurs because a DRAFT batch never reserved anything"
          - "increments PayoutBatch.version by 1"
      - from: VALIDATED
        to: VOIDED
        trigger: "POST /payout-batches/{id}/void"
        actor: FinanceController
        preconditions:
          - "batch.state in {DRAFT, VALIDATED, APPROVED}"
          - "void_reason is present"
        side_effects:
          - "sets batch.state = VOIDED and moves every PayoutLine to VOIDED"
          - "cascade hop: un-stamps every CommissionLedgerEntry whose payout_batch_id is this batch back to null"
          - "no balance movement occurs because a VALIDATED batch has not reserved anything yet"
          - "increments PayoutBatch.version by 1"

  - entity: PayoutLine
    initial_state: INCLUDED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: INCLUDED
        to: HELD_BELOW_MINIMUM
        trigger: "system event: calculations.payout_line_settlement yields net_cents < MIN_PAYOUT_CENTS (2500) at generation, at validation, or after a clawback recompute"
        actor: system
        preconditions:
          - "line.state == INCLUDED"
          - "recomputed net_cents < 2500"
        side_effects:
          - "sets state = HELD_BELOW_MINIMUM with hold_reason 'BELOW_MINIMUM_PAYOUT'"
          - "excludes the line from batch.network_fee_cents, batch.withholding_cents and batch.net_payable_cents"
          - "increments PayoutLine.version by 1"
        note: "Boundary is inclusive on the pay side: net_cents exactly 2500 stays INCLUDED; 2499 holds."
      - from: INCLUDED
        to: HELD_TAX_DOC
        trigger: "system event: the tax check inside POST /payout-batches/{id}/validate"
        actor: system
        preconditions:
          - "line.state == INCLUDED"
          - "affiliate.tax_document_status != VALID"
        side_effects:
          - "sets state = HELD_TAX_DOC with hold_reason 'TAX_DOCUMENT_NOT_VALID'"
          - "excludes the line from the batch payable totals"
          - "increments PayoutLine.version by 1"
      - from: INCLUDED
        to: HELD_FRAUD
        trigger: "system event: the owning Affiliate transitions to SUSPENDED, or the affiliate is not ACTIVE at validation time"
        actor: system
        preconditions:
          - "line.state == INCLUDED"
          - "batch.state in {DRAFT, VALIDATED}"
        side_effects:
          - "sets state = HELD_FRAUD with hold_reason 'AFFILIATE_SUSPENDED'"
          - "excludes the line from the batch payable totals and recomputes them"
          - "increments PayoutLine.version by 1"
      - from: HELD_TAX_DOC
        to: INCLUDED
        trigger: "POST /payout-lines/{id}/release-hold"
        actor: FinanceController
        preconditions:
          - "line.state in {HELD_TAX_DOC, HELD_BELOW_MINIMUM}"
          - "batch.state in {DRAFT, VALIDATED}"
          - "affiliate.tax_document_status == VALID"
        side_effects:
          - "sets state = INCLUDED, hold_reason = null and released_by_user_id = X-User-ID"
          - "cascade hop: recomputes the line per calculations.payout_line_settlement"
          - "cascade hop caused by the line recompute: recomputes batch.network_fee_cents, batch.withholding_cents and batch.net_payable_cents and increments PayoutBatch.version by 1 while leaving batch.state unchanged"
          - "increments PayoutLine.version by 1"
      - from: HELD_BELOW_MINIMUM
        to: INCLUDED
        trigger: "POST /payout-lines/{id}/release-hold"
        actor: FinanceController
        preconditions:
          - "line.state in {HELD_TAX_DOC, HELD_BELOW_MINIMUM}"
          - "batch.state in {DRAFT, VALIDATED}"
          - "affiliate.tax_document_status == VALID"
        side_effects:
          - "identical to the HELD_TAX_DOC -> INCLUDED transition; the minimum-payout floor is waived for this line only"
          - "increments PayoutLine.version by 1"
        note: "HELD_FRAUD is deliberately NOT releasable through this endpoint; it is rejected with ERR_FRAUD_HOLD_NOT_CLEARABLE."
      - from: INCLUDED
        to: PAID
        trigger: "POST /payout-batches/{id}/pay"
        actor: FinanceController
        preconditions:
          - "line.state == INCLUDED"
          - "batch.state == APPROVED"
        side_effects:
          - "sets state = PAID"
          - "increments PayoutLine.version by 1"
      - from: INCLUDED
        to: VOIDED
        trigger: "POST /payout-batches/{id}/void"
        actor: FinanceController
        preconditions:
          - "batch.state in {DRAFT, VALIDATED, APPROVED}"
        side_effects:
          - "sets state = VOIDED"
          - "increments PayoutLine.version by 1"
      - from: HELD_FRAUD
        to: VOIDED
        trigger: "POST /payout-batches/{id}/void"
        actor: FinanceController
        preconditions:
          - "batch.state in {DRAFT, VALIDATED, APPROVED}"
        side_effects:
          - "sets state = VOIDED"
          - "increments PayoutLine.version by 1"

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# ============================================================================

concurrency_rules:
  - rule_id: decide-stale-affiliate
    parent_entity: Affiliate
    write_endpoint: "POST /affiliate-applications/{id}/decide"
    occ_field: "expected_affiliate_version"
    description: |
      A decision carrying an expected_affiliate_version older than the
      applicant's current Affiliate.version is rejected. This captures the
      reviewer whose view of the applicant predates a partner-side write that
      legitimately advanced the applicant record without changing its status —
      for example a tax document filed under POST /affiliates/{id}/tax-documents,
      which bumps Affiliate.version and sets tax_document_status to PENDING. The
      status precondition still reads PENDING_APPLICATION, so nothing in §1.2 or
      §1.4 would reject the decision; only the stale version does.
    error_id: ERR_STALE_AFFILIATE_VERSION
    http_status: 412

  - rule_id: attribute-stale-conversion
    parent_entity: Conversion
    write_endpoint: "POST /conversions/{id}/attribute"
    occ_field: "expected_conversion_version"
    description: |
      An attribution run carrying an expected_conversion_version older than the
      order's current Conversion.version is rejected. A late click ingested under
      POST /tracking-links/{id}/clicks that falls inside an UNATTRIBUTED order's
      cookie window refreshes Conversion.candidate_click_count and bumps
      Conversion.version, so the caller's cached candidate set is stale even
      though attribution_status is still UNATTRIBUTED and the run would otherwise
      be perfectly legitimate.
    error_id: ERR_STALE_CONVERSION_VERSION
    http_status: 412

  - rule_id: approve-stale-batch
    parent_entity: PayoutBatch
    write_endpoint: "POST /payout-batches/{id}/approve"
    occ_field: "expected_batch_version"
    description: |
      An approval carrying an expected_batch_version older than the batch's
      current PayoutBatch.version is rejected. Releasing a hold on any line of a
      VALIDATED batch under POST /payout-lines/{id}/release-hold recomputes the
      batch totals and bumps PayoutBatch.version while leaving batch.state at
      VALIDATED, so the approver would otherwise approve a payable total they
      never saw.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation & Algorithm Table
# ============================================================================

calculations:

  - name: site_quality_composite_score
    algorithm_type: weighted_scoring
    trigger: "POST /affiliate-applications/{id}/screen"
    inputs:
      - "domain_authority (integer 0..100, request body)"
      - "content_originality_pct (integer 0..100, request body)"
      - "broken_link_ratio_bps (integer 0..10000, request body)"
      - "brand_safety_flag_count (integer 0..20, request body)"
      - "AffiliateApplication.primary_traffic_source"
      - "AffiliateApplication.declared_promo_methods"
      - "AffiliateApplication.product_categories"
    formula: |
      base = 0.45 * domain_authority
           + 0.35 * content_originality_pct
           + 0.20 * max(0, 100 - broken_link_ratio_bps / 100)

      multiplier = SOURCE_MULTIPLIER[primary_traffic_source]
      penalty    = min(PENALTY_CAP, PENALTY_PER_FLAG * brand_safety_flag_count)

      site_quality_score = round_half_up(
        max(0, min(100, base * multiplier - penalty)), 1)
    constants:
      SOURCE_MULTIPLIER:
        ORGANIC_SEARCH: 1.00
        CONTENT_NEWSLETTER: 0.95
        SOCIAL_ORGANIC: 0.90
        PAID_SEARCH: 0.75
        COUPON_DIRECTORY: 0.65
        CASHBACK_PORTAL: 0.60
        INCENTIVIZED_TRAFFIC: 0.40
      PENALTY_PER_FLAG: 10
      PENALTY_CAP: 30
      RESTRICTED_PENALTY_CAP: 45
      RESTRICTED_METHOD_MULTIPLIER: 0.90
      GATE_PASS_MIN: 60.0
      GATE_CONDITIONAL_MIN: 45.0
      BRAND_SUITABILITY_PASS_MIN: 70.0
    variants:
      - name: STANDARD_SCREEN
        applies_when: "declared_promo_methods contains neither TRADEMARK_PAID_SEARCH nor COUPON_FEED"
        difference: "penalty is capped at PENALTY_CAP (30) and no extra multiplier is applied"
      - name: RESTRICTED_CATEGORY_SCREEN
        applies_when: "declared_promo_methods contains TRADEMARK_PAID_SEARCH or COUPON_FEED"
        difference: >-
          penalty is capped at RESTRICTED_PENALTY_CAP (45) instead of 30, and the
          product of base * multiplier is additionally multiplied by
          RESTRICTED_METHOD_MULTIPLIER (0.90) before the penalty is subtracted.
          The rounding still happens exactly once, at the very end.
    gate: |
      screening_outcome =
        PASS        when site_quality_score >= 60.0 AND brand_suitability_score >= 70.0
        CONDITIONAL when 45.0 <= site_quality_score < 60.0 AND brand_suitability_score >= 70.0
        FAIL        when site_quality_score < 45.0 OR brand_suitability_score < 70.0
      The lower CONDITIONAL bound is inclusive: exactly 45.0 is CONDITIONAL, and
      the PASS bound is inclusive at exactly 60.0.
    precision: "site_quality_score is a number rounded HALF_UP to 1 decimal place; the intermediate base*multiplier product is NOT rounded"
    worked_example: |
      domain_authority 72, content_originality_pct 88, broken_link_ratio_bps 450,
      brand_safety_flag_count 1, primary_traffic_source COUPON_DIRECTORY,
      declared_promo_methods ["EDITORIAL_CONTENT"] (STANDARD_SCREEN):
        base = 32.4 + 30.8 + 0.20 * (100 - 4.5) = 32.4 + 30.8 + 19.1 = 82.3
        82.3 * 0.65 = 53.495 ; penalty = 10
        site_quality_score = round_half_up(43.495, 1) = 43.5   -> below 45.0 -> FAIL

  - name: brand_suitability_score
    algorithm_type: weighted_scoring
    trigger: "POST /affiliate-applications/{id}/screen"
    inputs:
      - "restricted_vertical_overlap_bps (integer 0..10000, request body)"
      - "brand_safety_flag_count (integer 0..20, request body)"
    formula: |
      brand_suitability_score = round_half_up(
        max(0, min(100,
          100 - restricted_vertical_overlap_bps / 100
              - OVERLAP_FLAG_WEIGHT * brand_safety_flag_count)), 1)
    constants:
      OVERLAP_FLAG_WEIGHT: 12
    precision: "number, HALF_UP to 1 decimal place"
    worked_example: |
      restricted_vertical_overlap_bps 800, brand_safety_flag_count 1:
        100 - 8.0 - 12 = 80.0 -> brand_suitability_score = 80.0 (>= 70.0, so the
        gate outcome is decided by site_quality_score alone)

  - name: attribution_resolution
    algorithm_type: chronological
    trigger: "POST /conversions/{id}/attribute"
    inputs:
      - "Conversion.placed_at, device_id, household_id, order_total_cents, product_category, is_new_customer, coupon_code_used, other_channel_touch, other_channel_touch_at"
      - "every ClickEvent whose TrackingLink belongs to any Affiliate"
      - "TrackingLink.cookie_window_days, device_graph_enabled, status"
      - "Affiliate.partner_type, status, incrementality_tier (pre-state)"
      - "the ACTIVE CommissionPolicy selected by commission_policy_selection"
    formula: |
      STEP 1 — eligible click set. A ClickEvent K is eligible when ALL hold:
        K.click_type == ORGANIC_CLICK                      (FORCED_CLICK and
                                                            IFRAME_IMPRESSION never
                                                            attribute)
        K.tracking_link.status == ACTIVE
        conversion.placed_at - link.cookie_window_days * 86400s <= K.occurred_at
        K.occurred_at < conversion.placed_at                (HALF-OPEN: the lower
                                                            bound is inclusive, the
                                                            upper bound is strict)
        device match: K.device_id == conversion.device_id
                      OR (link.device_graph_enabled == true
                          AND K.household_id == conversion.household_id
                          AND K.household_id is non-null)
      candidate_click_count = |eligible set|

      STEP 2 — winning click. Rank the eligible set by K.occurred_at DESC, then by
      K.created_at DESC. The `id` field is NEVER used as a tie-break.
      If the eligible set is EMPTY: candidate_click_count = 0, attribution_status
      stays UNATTRIBUTED, gross_commission_cents = 0, payable_commission_cents = 0,
      no CommissionLedgerEntry is appended, and the request still returns 200.

      STEP 3 — channel deduplication. If conversion.other_channel_touch != NONE
      AND conversion.other_channel_touch_at > winning.occurred_at, the affiliate
      loses last click: attribution_status = DEDUPED_TO_OTHER_CHANNEL,
      credit_share_bps = 0, commission = 0, attributed_affiliate_id = null,
      dedup_reason = OTHER_CHANNEL_LATER_TOUCH. A tie (other_channel_touch_at
      exactly equal to winning.occurred_at) does NOT dedupe; the affiliate keeps
      the credit.

      STEP 4 — raw commission.
        rate_bps = conversion.is_new_customer ? policy.new_customer_rate_bps
                                              : policy.returning_customer_rate_bps
        gross_commission_cents = round_half_up(
          conversion.order_total_cents * rate_bps / 10000)

      STEP 5 — credit share by variant (see `variants`).
        payable_commission_cents = round_half_up(
          gross_commission_cents * credit_share_bps / 10000)

      Both variants are ALWAYS materialised as AttributionDecision rows; exactly
      one row has selected == true.
    constants:
      FULL_CREDIT_SHARE_BPS: 10000
      INCREMENTALITY_CREDIT_SHARE_BPS: 3000
    variants:
      - name: LAST_CLICK_RAW
        applies_when: >-
          affiliate.incrementality_tier (read BEFORE this conversion's counters are
          incremented) is MEDIUM or HIGH, AND it is not the case that
          affiliate.partner_type is in {COUPON, LOYALTY_CASHBACK} with a non-null
          conversion.coupon_code_used
        difference: "credit_share_bps = 10000, so payable_commission_cents == gross_commission_cents and attribution_status = AFFILIATE_ATTRIBUTED"
      - name: INCREMENTALITY_ADJUSTED
        applies_when: >-
          affiliate.incrementality_tier (pre-state) == LOW, OR
          affiliate.partner_type is in {COUPON, LOYALTY_CASHBACK} and
          conversion.coupon_code_used is non-null
        difference: >-
          credit_share_bps = 3000, so payable_commission_cents =
          round_half_up(gross_commission_cents * 3000 / 10000) and
          attribution_status = CREDIT_REDUCED with dedup_reason
          LOW_INCREMENTALITY_PARTNER. gross_commission_cents still carries the
          unreduced amount, so the two fields diverge on the same row.
    precision: "all money is integer cents; the two roundings (gross, then payable) are applied in that order and each is HALF_UP. Computing payable directly as order_total * rate_bps * credit_share / 10^8 is FORBIDDEN."
    worked_example: |
      order_total_cents 133000, returning customer, policy returning_customer_rate_bps 400:
        gross_commission_cents = round_half_up(133000 * 400 / 10000)
                               = round_half_up(5320.0) = 5320
      COUPON partner with a fresh counter set (incrementality_score_bps 3000 -> LOW):
        payable_commission_cents = round_half_up(5320 * 3000 / 10000)
                                 = round_half_up(1596.0) = 1596
      Same order on a fresh CONTENT partner (incrementality_score_bps 4500 -> MEDIUM):
        payable_commission_cents = 5320

  - name: commission_policy_selection
    algorithm_type: chronological
    trigger: "POST /conversions/{id}/attribute"
    inputs:
      - "Conversion.product_category, Conversion.placed_at"
      - "the winning click's Affiliate.partner_type"
      - "every CommissionPolicy with status == ACTIVE"
    formula: |
      candidates = every CommissionPolicy P where
        P.status == ACTIVE
        AND P.product_category == conversion.product_category
        AND affiliate.partner_type is an element of P.partner_type_scope
        AND P.effective_from <= conversion.placed_at < P.effective_to   (HALF-OPEN)

      Rank candidates by P.effective_from DESC, then by P.created_at ASC.
      The winner supplies new_customer_rate_bps / returning_customer_rate_bps and
      is stamped onto Conversion.commission_policy_id.
      If candidates is empty the request fails with ERR_NO_ACTIVE_COMMISSION_POLICY
      (422) and NOTHING is written: no AttributionDecision rows, no ledger entry,
      no version bump.
    precision: "not applicable; selection only"
    note: >-
      Contrast with attribution_resolution's empty-set case, which succeeds with
      200. An empty click set is a normal outcome; a missing rate card is a
      configuration error.

  - name: affiliate_incrementality_score
    algorithm_type: constraint_propagation
    trigger: >-
      recomputed at the end of POST /conversions/{id}/attribute,
      POST /conversions/{id}/order-adjustment, and the Affiliate
      PENDING_APPLICATION -> ACTIVE transition
    inputs:
      - "Affiliate.attributed_conversion_count"
      - "Affiliate.new_customer_attributed_count"
      - "Affiliate.coupon_assisted_conversion_count"
      - "Affiliate.partner_type"
    formula: |
      coupon_assisted_share_bps =
        coupon_assisted_conversion_count * 10000 / max(1, attributed_conversion_count)
      new_customer_share_bps =
        new_customer_attributed_count * 10000 / max(1, attributed_conversion_count)

      incrementality_score_bps = max(0, min(10000, round_half_up(
          0.55 * new_customer_share_bps
        + 0.45 * (10000 - coupon_assisted_share_bps)
        - PARTNER_TYPE_DISCOUNT_BPS[partner_type])))

      incrementality_tier =
        LOW    when incrementality_score_bps <= 3500
        MEDIUM when 3501 <= incrementality_score_bps <= 6000
        HIGH   when incrementality_score_bps >= 6001

      PINNED EVALUATION ORDER inside POST /conversions/{id}/attribute — the score
      depends on the counters and the counters depend on the attribution, so the
      order is fixed and MUST NOT be reordered:
        (1) resolve the winning click and the commission policy
        (2) read incrementality_tier from the counters as they stand BEFORE this
            conversion (the pre-state) and choose the attribution variant from it
        (3) compute gross_commission_cents and payable_commission_cents
        (4) THEN increment attributed_conversion_count, and
            new_customer_attributed_count when is_new_customer, and
            coupon_assisted_conversion_count when coupon_code_used is non-null
        (5) recompute incrementality_score_bps and incrementality_tier to their
            post-state values and persist them
      A conversion therefore never reduces its own credit share; only the next
      conversion sees the effect.
    constants:
      PARTNER_TYPE_DISCOUNT_BPS:
        CONTENT: 0
        INFLUENCER: 0
        PAID_SEARCH: 500
        SUB_NETWORK: 500
        COUPON: 1500
        LOYALTY_CASHBACK: 2000
      TIER_LOW_MAX_BPS: 3500
      TIER_MEDIUM_MAX_BPS: 6000
    precision: "integer basis points, HALF_UP; the two share terms are NOT individually rounded"
    worked_example: |
      A brand-new partner has all three counters at 0, so both shares are 0 and
      the score is round_half_up(0.55*0 + 0.45*10000 - discount) = 4500 - discount:
        CONTENT / INFLUENCER  -> 4500 -> MEDIUM
        PAID_SEARCH / SUB_NETWORK -> 4000 -> MEDIUM
        COUPON                -> 3000 -> LOW
        LOYALTY_CASHBACK      -> 2500 -> LOW
      After one returning-customer coupon-assisted conversion on a COUPON partner
      (counters 1 / 0 / 1): new_customer_share_bps 0, coupon_assisted_share_bps
      10000 -> 0.55*0 + 0.45*0 - 1500 = -1500 -> clamped to 0 -> LOW.

  - name: fraud_risk_score
    algorithm_type: decay_function
    trigger: >-
      recomputed whenever a PolicyViolationCase is created by POST /monitoring-scans
      or POST /policy-violation-cases, and on every
      POST /policy-violation-cases/{id}/transition
    inputs:
      - "every PolicyViolationCase whose affiliate_id is this affiliate"
      - "PolicyViolationCase.violation_type, state, detected_at"
      - "the logical clock"
    formula: |
      SEVERITY_WEIGHT[violation_type] is the per-case weight (also persisted on
      PolicyViolationCase.severity_weight at creation).

      Case -> violation_type mapping applied by POST /monitoring-scans, evaluated in
      this fixed order, each condition opening at most one case per scan:
        trademark_hits > 0                                -> TRADEMARK_BIDDING
        forced_click_ratio_bps >= FORCED_CLICK_BPS (1500)  -> FORCED_CLICK
        cookie_stuffing_index >= STUFFING_INDEX (60)       -> COOKIE_STUFFING
        unauthorized_coupon_hits > 0                       -> UNAUTHORIZED_COUPON

      See `variants` for the two scores. Both are recomputed and persisted on every
      trigger; they are never derived from each other.
    constants:
      SEVERITY_WEIGHT:
        COOKIE_STUFFING: 40
        FORCED_CLICK: 30
        UNAUTHORIZED_COUPON: 25
        TRADEMARK_BIDDING: 20
      FRAUD_SUSPENSION_THRESHOLD: 70
      REINSTATEMENT_TRAILING_CEILING: 25.0
      TRAILING_WINDOW_DAYS: 90
      DECAY_PER_DAY: 0.01
      DECAY_FLOOR: 0.20
      CLEARED_DECAY_MULTIPLIER: 0.25
      FORCED_CLICK_BPS: 1500
      STUFFING_INDEX: 60
    variants:
      - name: POINT_IN_TIME
        applies_when: "always; persisted to Affiliate.fraud_risk_score and used to gate auto-suspension at >= 70"
        difference: |
          Includes ONLY cases whose state is in
          {OPEN, REMEDIATION_REQUESTED, REMEDIATION_SUBMITTED, ESCALATED, UPHELD}
          and applies NO decay:
            fraud_risk_score = min(100, sum of SEVERITY_WEIGHT over those cases)
          VERIFIED_CLEARED cases contribute exactly 0. detected_at is ignored, so a
          three-year-old OPEN case still counts at full weight.
      - name: TRAILING_90D_DECAY
        applies_when: "always; persisted to Affiliate.fraud_risk_score_trailing and used to gate reinstatement at < 25.0"
        difference: |
          Includes cases in ANY state (VERIFIED_CLEARED included) whose
          detected_at >= clock_now - 90 days, and applies age decay:
            age_days     = floor((clock_now - detected_at) / 86400s)
            decay        = max(0.20, 1.00 - 0.01 * age_days)
            state_factor = 0.25 when state == VERIFIED_CLEARED else 1.00
            contribution = SEVERITY_WEIGHT * decay * state_factor
            fraud_risk_score_trailing = round_half_up(min(100, sum), 1)
          A case older than 90 days drops out entirely, so this variant can be
          strictly lower than the point-in-time score for the same case set — and
          strictly higher when the only cases are recent and cleared.
    precision: "fraud_risk_score is an integer 0..100; fraud_risk_score_trailing is a number HALF_UP to 1 decimal place"
    worked_example: |
      Clock 2026-08-01T00:00:00Z. One OPEN TRADEMARK_BIDDING case detected
      2026-07-22T00:00:00Z (age 10 days) and one OPEN FORCED_CLICK case detected the
      same instant:
        POINT_IN_TIME       = 20 + 30 = 50            (below 70, no suspension)
        TRAILING_90D_DECAY  = (20 + 30) * max(0.20, 1.00 - 0.10)
                            = 50 * 0.90 = 45.0
      Adding a pre-existing OPEN UNAUTHORIZED_COUPON case (weight 25) pushes the
      point-in-time score to 75 >= 70 and auto-suspends the partner.

  - name: payout_line_settlement
    algorithm_type: aggregation
    trigger: "POST /payout-batches, POST /payout-batches/{id}/validate, POST /payout-lines/{id}/release-hold, and the clawback recompute inside POST /conversions/{id}/order-adjustment"
    inputs:
      - "every CommissionLedgerEntry whose payout_batch_id is this batch, grouped by affiliate_id"
      - "Network.fee_bps, Network.flat_fee_cents"
      - "the partner's most recent TaxDocument (created_at DESC) and its status / treaty_withholding_bps"
      - "PayoutLine.conversion_count"
    formula: |
      Line generation. POST /payout-batches first runs the validation sweep
      (Conversion PENDING_VALIDATION -> VALIDATED where
      placed_at + 30 days <= clock_now), then claims every unstamped
      CommissionLedgerEntry (payout_batch_id == null) whose conversion is VALIDATED
      or CLAWED_BACK and whose conversion.placed_at is inside [period_start,
      period_end), stamps payout_batch_id onto each, and creates one PayoutLine per
      distinct affiliate_id. If no entry qualifies, NO batch row is created and the
      request fails with ERR_NO_ELIGIBLE_PAYOUT_LINES (422).

      Per line, over the entries stamped to this batch for this affiliate:
        gross_cents           = sum of amount_cents where entry_type == ACCRUAL
        clawback_cents        = absolute value of the sum of amount_cents where
                                entry_type is in {REVERSAL, CLAWBACK, ADJUSTMENT}
        net_before_fees_cents = gross_cents - clawback_cents
        conversion_count      = number of distinct conversion_id values with an
                                ACCRUAL entry stamped to this batch
        network_fee_cents     = round_half_up(net_before_fees_cents
                                              * network.fee_bps / 10000)
                                + network.flat_fee_cents * conversion_count
        withholding_base      = net_before_fees_cents - network_fee_cents
        withholding_bps       = tax_doc.status == VALID
                                  ? tax_doc.treaty_withholding_bps
                                  : DEFAULT_BACKUP_WITHHOLDING_BPS (2400)
        withholding_cents     = round_half_up(withholding_base
                                              * withholding_bps / 10000)
        net_cents             = withholding_base - withholding_cents

      ROUNDING ORDER IS PINNED. Each line is rounded to whole cents first; the
      batch totals are plain integer sums of the already-rounded per-line values:
        batch.gross_commission_cents = sum of line.gross_cents
        batch.clawback_cents         = sum of line.clawback_cents
        batch.network_fee_cents      = sum of line.network_fee_cents
        batch.withholding_cents      = sum of line.withholding_cents
        batch.net_payable_cents      = sum of line.net_cents
      Summing the unrounded per-line products and rounding once at the batch level
      is FORBIDDEN and produces a different, wrong answer.

      Only lines whose state == INCLUDED contribute to network_fee_cents,
      withholding_cents and net_payable_cents. gross_commission_cents and
      clawback_cents include EVERY line regardless of state, so the reconciliation
      check in network_fee_reconciliation sees the full statement-side gross.

      Minimum payout. A line whose net_cents < MIN_PAYOUT_CENTS (2500) moves to
      HELD_BELOW_MINIMUM. The boundary is inclusive on the pay side: exactly 2500
      stays INCLUDED.
    constants:
      DEFAULT_BACKUP_WITHHOLDING_BPS: 2400
      MIN_PAYOUT_CENTS: 2500
      VALIDATION_HOLD_DAYS: 30
      APPROVAL_LIMIT_CENTS: 5000000
    precision: "integer cents throughout; HALF_UP at each per-line rounding step, never at the batch level"
    worked_example: |
      Two CONTENT partners on a network with fee_bps 375 and flat_fee_cents 0, each
      holding one VALIDATED conversion of order_total_cents 133000 at 400 bps, each
      with a VALID W9 whose treaty_withholding_bps is 0:
        per line: gross 5320, clawback 0, net_before_fees 5320
                  network_fee = round_half_up(5320 * 375 / 10000)
                              = round_half_up(199.5) = 200
                  withholding_base 5120, withholding 0, net_cents 5120
        batch:    gross_commission_cents 10640
                  network_fee_cents 200 + 200 = 400
                  net_payable_cents 5120 + 5120 = 10240
      Sum-then-round would compute round_half_up(10640 * 375 / 10000) =
      round_half_up(399.0) = 399 and a net of 10241. The 1-cent divergence is the
      falsifying signature of the wrong rounding order.

  - name: network_fee_reconciliation
    algorithm_type: threshold
    trigger: "POST /payout-batches/{id}/validate"
    inputs:
      - "statement_gross_cents (request body)"
      - "statement_fee_cents (request body)"
      - "PayoutBatch.gross_commission_cents and PayoutBatch.network_fee_cents as recomputed by payout_line_settlement in this same request"
    formula: |
      The gross check runs first and is exact:
        statement_gross_cents != batch.gross_commission_cents
          -> ERR_NETWORK_FEE_VARIANCE (422), nothing is written

      Then the fee variance:
        variance_cents = statement_fee_cents - batch.network_fee_cents
        variance_bps   = round_half_up(
                           abs(variance_cents) * 10000
                           / max(1, batch.network_fee_cents))

        variance_cents == 0                             -> MATCHED
        variance_bps <= VARIANCE_TOLERANCE_BPS (50)     -> ACCEPTED_WITH_VARIANCE
        otherwise                                       -> ERR_NETWORK_FEE_VARIANCE (422)

      ACCEPTED_WITH_VARIANCE records network_fee_variance_cents and
      network_fee_variance_bps on the batch but does NOT adjust
      network_fee_cents, net_payable_cents, or any CommissionLedgerEntry. The
      retailer's own computation remains authoritative; the statement difference is
      only annotated. variance_cents keeps its sign, so a statement that undercharges
      records a negative value.
    constants:
      VARIANCE_TOLERANCE_BPS: 50
    precision: "variance_cents is a signed integer; variance_bps is a non-negative integer rounded HALF_UP"
    worked_example: |
      batch.network_fee_cents 400:
        statement_fee_cents 400 -> variance 0, 0 bps       -> MATCHED
        statement_fee_cents 402 -> variance 2,
                                   round_half_up(2*10000/400) = 50 bps
                                                            -> ACCEPTED_WITH_VARIANCE (boundary, inclusive)
        statement_fee_cents 403 -> variance 3, 75 bps       -> ERR_NETWORK_FEE_VARIANCE

  - name: clawback_allocation
    algorithm_type: waterfall_allocation
    trigger: "POST /conversions/{id}/order-adjustment"
    inputs:
      - "Conversion.validation_status, order_total_cents, payable_commission_cents, returned_amount_cents, clawed_back_cents"
      - "returned_amount_cents and adjustment_type (request body)"
      - "the state of the PayoutBatch that the conversion's ACCRUAL entry is stamped to, if any"
    formula: |
      cumulative_returned = conversion.returned_amount_cents + request.returned_amount_cents
      cumulative_returned > conversion.order_total_cents
        -> ERR_ADJUSTMENT_EXCEEDS_ORDER (422)

      Bucket 1 — the unvalidated window. When
      conversion.validation_status == PENDING_VALIDATION the entire accrual is
      undone regardless of how much of the order came back:
        magnitude   = conversion.payable_commission_cents
        entry_type  = REVERSAL
        validation_status -> REVERSED, attribution_status -> DETACHED
        the affiliate's attribution counters are decremented and
        affiliate_incrementality_score is recomputed
      A partial return inside this window therefore still reverses the full
      commission; the retailer has not yet accepted the order.

      Bucket 2 — the validated window. When
      conversion.validation_status == VALIDATED the clawback is pro-rata on the
      returned amount:
        target_total = round_half_up(conversion.payable_commission_cents
                                     * cumulative_returned
                                     / conversion.order_total_cents)
        magnitude    = target_total - conversion.clawed_back_cents
        entry_type   = CLAWBACK, or ADJUSTMENT when the conversion's ACCRUAL entry
                       is stamped to a PayoutBatch whose state == PAID
        validation_status -> CLAWED_BACK when
                             cumulative_returned == order_total_cents,
                             otherwise it stays VALIDATED
        attribution_status is NOT changed and the attribution counters are NOT
        decremented; the conversion really happened and its incrementality signal
        is retained.
      Computing each increment independently instead of differencing against
      clawed_back_cents lets two partial returns drift by a cent; the target-total
      form is authoritative.

      The new entry is stamped to the same payout_batch_id as the ACCRUAL when that
      batch's state is in {DRAFT, VALIDATED}, which triggers a
      payout_line_settlement recompute of that line and the batch totals. When the
      batch is PAID the ADJUSTMENT entry is left unstamped so a later batch claims
      it, and the paid batch's totals are never rewritten.
    constants:
      FULL_RETURN_TOLERANCE_CENTS: 0
    precision: "integer cents; the pro-rata figure is rounded HALF_UP once, against the cumulative return, and the increment is the difference from clawed_back_cents"
    worked_example: |
      payable_commission_cents 4000 on an order_total_cents of 100000, VALIDATED,
      ACCRUAL stamped to a DRAFT batch:
        PARTIAL_RETURN of 30000 -> target round_half_up(4000*30000/100000) = 1200,
                                   magnitude 1200, CLAWBACK -1200, still VALIDATED
        PARTIAL_RETURN of 70000 -> cumulative 100000, target 4000,
                                   magnitude 4000 - 1200 = 2800, CLAWBACK -2800,
                                   validation_status CLAWED_BACK
        line: gross 4000, clawback 4000, net_before_fees 0, net_cents 0
              -> below MIN_PAYOUT_CENTS -> HELD_BELOW_MINIMUM,
                 batch.net_payable_cents 0

# ============================================================================
# §1.4 Validation Rule Table — evaluated in strictly ascending priority order.
# The FIRST rule whose condition holds decides the response; no later rule is
# evaluated. Categories in play: auth, existence, ownership, input, state,
# concurrency, business_safety, business_temporal, business_constraint,
# business_referential, business_fiscal.
# ============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-ID header is present and names a known user"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /affiliates"
    description: "Missing or unknown X-User-ID on any authenticated route. POST /affiliates is the only Anonymous route."

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role check precedes every existence lookup, so a wrong-role caller cannot probe which ids exist."

  - priority: 3
    category: existence
    check: "the {id} path parameter of an /affiliates route names an existing Affiliate"
    error_id: ERR_AFFILIATE_NOT_FOUND
    http_status: 404
    applies_to: "GET /affiliates/{id}, POST /affiliates/{id}/status-change, GET /affiliates/{id}/monitoring-scans, GET /affiliates/{id}/tax-documents, POST /affiliates/{id}/tax-documents, POST /affiliates/{id}/applications, POST /affiliates/{id}/tracking-links, GET /affiliates/{id}/tracking-links"
    description: "Also raised when POST /affiliates carries a parent_affiliate_id or network_id naming no row, and when POST /monitoring-scans or POST /policy-violation-cases carries an unknown affiliate_id."

  - priority: 4
    category: existence
    check: "the {id} path parameter of an /affiliate-applications route names an existing AffiliateApplication"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /affiliate-applications/{id}, POST /affiliate-applications/{id}/screen, POST /affiliate-applications/{id}/decide, POST /affiliate-applications/{id}/resubmit"
    description: "Unknown application id."

  - priority: 5
    category: existence
    check: "the {id} path parameter of a /commission-policies route names an existing CommissionPolicy"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "GET /commission-policies/{id}, POST /commission-policies/{id}/activate"
    description: "Unknown commission policy id."

  - priority: 6
    category: existence
    check: "the {id} path parameter of a /tracking-links route names an existing TrackingLink"
    error_id: ERR_TRACKING_LINK_NOT_FOUND
    http_status: 404
    applies_to: "GET /tracking-links/{id}, POST /tracking-links/{id}/disable, POST /tracking-links/{id}/clicks, GET /tracking-links/{id}/clicks"
    description: "Unknown tracking link id."

  - priority: 7
    category: existence
    check: "the {id} path parameter of a /conversions route names an existing Conversion"
    error_id: ERR_CONVERSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /conversions/{id}, POST /conversions/{id}/attribute, POST /conversions/{id}/order-adjustment, GET /conversions/{id}/attribution-decisions"
    description: "Unknown conversion id."

  - priority: 8
    category: existence
    check: "the {id} path parameter of a /policy-violation-cases route names an existing PolicyViolationCase"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /policy-violation-cases/{id}, POST /policy-violation-cases/{id}/transition"
    description: "Unknown violation case id; also raised when POST /policy-violation-cases carries a source_scan_id naming no MonitoringScan."

  - priority: 9
    category: existence
    check: "the {id} path parameter of a /payout-batches route names an existing PayoutBatch"
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "GET /payout-batches/{id}, POST /payout-batches/{id}/validate, POST /payout-batches/{id}/approve, POST /payout-batches/{id}/pay, POST /payout-batches/{id}/void"
    description: "Unknown payout batch id."

  - priority: 10
    category: existence
    check: "the {id} path parameter of a /payout-lines route names an existing PayoutLine"
    error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /payout-lines/{id}, POST /payout-lines/{id}/release-hold"
    description: "Unknown payout line id."

  - priority: 11
    category: existence
    check: "the network_id supplied on POST /affiliates or POST /payout-batches names an existing Network"
    error_id: ERR_NETWORK_NOT_FOUND
    http_status: 404
    applies_to: "GET /networks/{id}, POST /affiliates, POST /payout-batches"
    description: "Unknown network id."

  - priority: 12
    category: existence
    check: "the {id} path parameter of a /tax-documents route names an existing TaxDocument"
    error_id: ERR_TAX_DOCUMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /tax-documents/{id}/verify"
    description: "Unknown tax document id."

  - priority: 13
    category: ownership
    check: "when the caller's role is AffiliatePartner, the addressed resource resolves to the caller's own affiliate_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /affiliates/{id}, GET /affiliates/{id}/tracking-links, GET /affiliates/{id}/tax-documents, POST /affiliates/{id}/tax-documents, POST /affiliates/{id}/applications, POST /affiliate-applications/{id}/resubmit, POST /policy-violation-cases/{id}/transition"
    description: "AffiliatePartner is entity_backed:Affiliate; X-User-ID is the Affiliate id. Reaching another partner's row is a 403, distinct from a 404, and is checked AFTER existence so the message is accurate."

  - priority: 14
    category: input
    check: "every required body field is present with the declared type, every enum value is a declared member, and every integer respects its declared range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Covers missing required fields, unknown enum members, negative money, out-of-range scores, malformed ISO-8601 instants, and non-array declared_promo_methods. Unknown extra keys are ignored, not rejected."

  - priority: 15
    category: input
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "GET /affiliates, GET /affiliate-applications, GET /commission-policies, GET /conversions, GET /policy-violation-cases, GET /commission-ledger-entries, GET /payout-batches, GET /payout-lines, GET /affiliates/{id}/monitoring-scans, GET /affiliates/{id}/tax-documents, GET /affiliates/{id}/tracking-links, GET /tracking-links/{id}/clicks, GET /conversions/{id}/attribution-decisions"
    description: "limit 0, limit 101 and offset -1 are all rejected; omitting both applies limit 10 / offset 0."

  - priority: 16
    category: ownership
    check: "the acting X-User-ID differs from the user who performed the paired earlier step"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /affiliate-applications/{id}/decide, POST /payout-batches/{id}/approve, POST /policy-violation-cases/{id}/transition"
    description: "The screener may not decide; the batch preparer may not approve; the analyst who opened a case may not verify its remediation. Enforced on X-User-ID, never on role."

  - priority: 17
    category: state
    check: "the affiliate whose resource is being written is not SUSPENDED or TERMINATED"
    error_id: ERR_AFFILIATE_SUSPENDED
    http_status: 409
    applies_to: "POST /affiliates/{id}/tracking-links, POST /affiliates/{id}/applications, POST /tracking-links/{id}/clicks, POST /affiliate-applications/{id}/resubmit"
    description: "A suspended or terminated partner cannot mint links, file new applications, or have clicks ingested."

  - priority: 18
    category: state
    check: "application.review_state is not one of the terminal states APPROVED, APPROVED_WITH_CONDITIONS, REJECTED"
    error_id: ERR_APPLICATION_TERMINAL
    http_status: 409
    applies_to: "POST /affiliate-applications/{id}/screen, POST /affiliate-applications/{id}/decide, POST /affiliate-applications/{id}/resubmit"
    description: "Terminal-state lockdown for AffiliateApplication; also the idempotency guard on a repeated decide."

  - priority: 19
    category: state
    check: "application.review_state == SCREENED when deciding, and == SUBMITTED when screening, and == CHANGES_REQUESTED when resubmitting"
    error_id: ERR_APPLICATION_NOT_SCREENED
    http_status: 409
    applies_to: "POST /affiliate-applications/{id}/screen, POST /affiliate-applications/{id}/decide, POST /affiliate-applications/{id}/resubmit"
    description: "Non-terminal wrong-state transition attempt, e.g. deciding a SUBMITTED application or screening one already SCREENED."

  - priority: 20
    category: state
    check: "conversion.attribution_status == UNATTRIBUTED"
    error_id: ERR_CONVERSION_ALREADY_ATTRIBUTED
    http_status: 409
    applies_to: "POST /conversions/{id}/attribute"
    description: "Attribution runs at most once per conversion; a second call is rejected even when the first produced an empty candidate set only if that call moved the status, which it does not — the empty-set case stays UNATTRIBUTED and remains re-runnable."

  - priority: 21
    category: state
    check: "conversion.attribution_status is not UNATTRIBUTED and validation_status is not already REVERSED or CLAWED_BACK"
    error_id: ERR_CONVERSION_NOT_ATTRIBUTED
    http_status: 409
    applies_to: "POST /conversions/{id}/order-adjustment"
    description: "There is no commission to unwind on an unattributed order, and an already fully reversed or clawed-back conversion is terminal on the validation dimension."

  - priority: 22
    category: state
    check: "case.state is not one of the terminal states VERIFIED_CLEARED, UPHELD"
    error_id: ERR_CASE_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /policy-violation-cases/{id}/transition"
    description: "Terminal-state lockdown for PolicyViolationCase."

  - priority: 23
    category: state
    check: "the requested action is declared for case.state in state_machines.PolicyViolationCase, and ESCALATE additionally requires failed_verification_count >= 2"
    error_id: ERR_CASE_INVALID_TRANSITION
    http_status: 409
    applies_to: "POST /policy-violation-cases/{id}/transition"
    description: "Covers VERIFY from OPEN, SUBMIT_REMEDIATION from OPEN, and ESCALATE before two failed verification rounds."

  - priority: 24
    category: state
    check: "batch.state is not one of the terminal states PAID, VOIDED"
    error_id: ERR_BATCH_TERMINAL
    http_status: 409
    applies_to: "POST /payout-batches/{id}/validate, POST /payout-batches/{id}/approve, POST /payout-batches/{id}/pay, POST /payout-batches/{id}/void"
    description: "Terminal-state lockdown for PayoutBatch; also the idempotency guard on a repeated pay or void."

  - priority: 25
    category: state
    check: "batch.state == VALIDATED when approving, == DRAFT when validating, and == APPROVED when paying"
    error_id: ERR_BATCH_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /payout-batches/{id}/validate, POST /payout-batches/{id}/approve, POST /payout-batches/{id}/pay"
    description: "Non-terminal wrong-state transition attempt on the payout chain, e.g. approving a DRAFT batch or paying a VALIDATED one."

  - priority: 26
    category: state
    check: "line.state is in {HELD_TAX_DOC, HELD_BELOW_MINIMUM, HELD_FRAUD} and the owning batch state is in {DRAFT, VALIDATED}"
    error_id: ERR_LINE_NOT_HELD
    http_status: 409
    applies_to: "POST /payout-lines/{id}/release-hold"
    description: >-
      Releasing an INCLUDED, PAID or VOIDED line, or any line on an APPROVED or
      terminal batch, is rejected. HELD_FRAUD deliberately SATISFIES this check so
      that a fraud-held line falls through to the business_safety rule at
      priority 34 rather than being reported as merely 'not held'.

  - priority: 27
    category: state
    check: "the applicant Affiliate.status == PENDING_APPLICATION and no PolicyViolationCase for it is UPHELD"
    error_id: ERR_AFFILIATE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /affiliate-applications/{id}/decide"
    description: "Cross-entity gate: a decision cannot activate a partner that compliance has already suspended, terminated, or upheld a violation against."

  - priority: 28
    category: state
    check: "the tracking link status == ACTIVE"
    error_id: ERR_TRACKING_LINK_DISABLED
    http_status: 409
    applies_to: "POST /tracking-links/{id}/clicks, POST /tracking-links/{id}/disable"
    description: "Clicks cannot be ingested through a disabled link, and a disabled link cannot be disabled again."

  - priority: 29
    category: concurrency
    check: "expected_affiliate_version == affiliate.version"
    error_id: ERR_STALE_AFFILIATE_VERSION
    http_status: 412
    applies_to: "POST /affiliate-applications/{id}/decide"
    description: "OCC rule decide-stale-affiliate from §1.2.1."

  - priority: 30
    category: concurrency
    check: "expected_conversion_version == conversion.version"
    error_id: ERR_STALE_CONVERSION_VERSION
    http_status: 412
    applies_to: "POST /conversions/{id}/attribute"
    description: "OCC rule attribute-stale-conversion from §1.2.1."

  - priority: 31
    category: concurrency
    check: "expected_batch_version == batch.version"
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /payout-batches/{id}/approve"
    description: "OCC rule approve-stale-batch from §1.2.1."

  - priority: 32
    category: concurrency
    check: "expected_policy_version == policy.version"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /commission-policies/{id}/activate"
    description: "A rate card edited after the activator read it cannot be activated on the stale view."

  - priority: 33
    category: business_safety
    check: "the screened application's brand_suitability_score >= 70.0"
    error_id: ERR_BRAND_SUITABILITY_VIOLATION
    http_status: 422
    applies_to: "POST /affiliate-applications/{id}/decide"
    description: "Brand safety veto: an application whose suitability score is below the floor can never be approved, not even with conditions."

  - priority: 34
    category: business_safety
    check: "line.state != HELD_FRAUD"
    error_id: ERR_FRAUD_HOLD_NOT_CLEARABLE
    http_status: 409
    applies_to: "POST /payout-lines/{id}/release-hold"
    description: "A fraud hold is never releasable through the finance endpoint; the partner must first be reinstated, which regenerates the line in a later batch. Outranks the fiscal tax-document check on the same call."

  - priority: 35
    category: business_safety
    check: "affiliate.open_violation_case_count == 0 when reinstating"
    error_id: ERR_OPEN_VIOLATION_CASES
    http_status: 409
    applies_to: "POST /affiliates/{id}/status-change"
    description: "A SUSPENDED -> ACTIVE reinstatement requires every case closed."

  - priority: 36
    category: business_safety
    check: "affiliate.fraud_risk_score_trailing < 25.0 when reinstating"
    error_id: ERR_RISK_SCORE_TOO_HIGH
    http_status: 409
    applies_to: "POST /affiliates/{id}/status-change"
    description: "Even with every case closed, a recently-cleared partner whose decayed trailing score is still 25.0 or above stays suspended. The boundary is strict: exactly 25.0 is rejected."

  - priority: 37
    category: business_temporal
    check: "policy.effective_from < policy.effective_to"
    error_id: ERR_INVALID_EFFECTIVE_WINDOW
    http_status: 422
    applies_to: "POST /commission-policies/{id}/activate"
    description: "Window ordering is enforced only at activation, never at creation, so a DRAFT policy may legitimately hold an inverted window. Outranks the overlap check."

  - priority: 38
    category: business_temporal
    check: "the requested scan window does not overlap or sit within 24 hours of another MonitoringScan for the same affiliate and engine"
    error_id: ERR_SCAN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /monitoring-scans"
    description: >-
      Scan windows are CLOSED intervals [window_start, window_end], so touching
      endpoints overlap, and consecutive scans additionally need a
      SCAN_COOLDOWN_HOURS (24) gap. A different engine on the same window is
      always allowed.

  - priority: 39
    category: business_constraint
    check: "no ACTIVE CommissionPolicy with the same product_category and an intersecting partner_type_scope has a half-open window overlapping the activating policy's window, unless the windows are exactly equal"
    error_id: ERR_POLICY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /commission-policies/{id}/activate"
    description: >-
      Overlap predicate: new.effective_from < existing.effective_to AND
      existing.effective_from < new.effective_to. Adjacency is therefore ALLOWED
      (a window starting exactly where another ends is fine), and an exactly-equal
      window supersedes the incumbent instead of failing.

  - priority: 40
    category: business_constraint
    check: "the affiliate has no AffiliateApplication in a non-terminal review_state"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /affiliates/{id}/applications"
    description: "One live application per partner; a REJECTED history does not block a fresh filing."

  - priority: 41
    category: business_constraint
    check: "order_ref is unique across Conversion"
    error_id: ERR_DUPLICATE_ORDER_REF
    http_status: 409
    applies_to: "POST /conversions"
    description: "Deduplicates double-fired conversion pixels on the retailer side."

  - priority: 42
    category: business_constraint
    check: "the prospective sub_affiliate_depth <= MAX_SUB_AFFILIATE_DEPTH (1)"
    error_id: ERR_SUB_AFFILIATE_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /affiliates"
    description: "A sub-affiliate of a sub-affiliate is rejected; only one level of sub-network nesting exists."

  - priority: 43
    category: business_constraint
    check: "parent_affiliate_id names an Affiliate whose partner_type == SUB_NETWORK and which is not the row being created"
    error_id: ERR_CIRCULAR_SUB_AFFILIATE
    http_status: 422
    applies_to: "POST /affiliates"
    description: "Only a SUB_NETWORK partner may parent others, which structurally prevents cycles under the depth cap."

  - priority: 44
    category: business_constraint
    check: "application.revision_round_count < MAX_REVISION_ROUNDS (2)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /affiliate-applications/{id}/decide, POST /affiliate-applications/{id}/resubmit"
    description: "The CHANGES_REQUESTED loop terminates: after two revision rounds the reviewer must approve or reject outright."

  - priority: 45
    category: business_constraint
    check: "the decision is compatible with screening_outcome: APPROVE needs PASS, APPROVE_WITH_CONDITIONS needs PASS or CONDITIONAL with a non-empty conditional_requirements array"
    error_id: ERR_SCREENING_NOT_PASSED
    http_status: 422
    applies_to: "POST /affiliate-applications/{id}/decide"
    description: "A FAIL screening outcome admits only REJECT or REQUEST_CHANGES."

  - priority: 46
    category: business_constraint
    check: "conversion.returned_amount_cents + request.returned_amount_cents <= conversion.order_total_cents"
    error_id: ERR_ADJUSTMENT_EXCEEDS_ORDER
    http_status: 422
    applies_to: "POST /conversions/{id}/order-adjustment"
    description: "Cumulative returns can never exceed the order; also enforces that FULL_RETURN and FULL_CANCELLATION supply exactly the outstanding remainder."

  - priority: 47
    category: business_referential
    check: "an ACTIVE CommissionPolicy covers (conversion.product_category, affiliate.partner_type) at conversion.placed_at"
    error_id: ERR_NO_ACTIVE_COMMISSION_POLICY
    http_status: 422
    applies_to: "POST /conversions/{id}/attribute"
    description: "Missing rate card is a configuration error and aborts the whole attribution write, unlike an empty click set which succeeds with a zero commission."

  - priority: 48
    category: business_fiscal
    check: "the affiliate has a TaxDocument with status VALID and expires_on > clock now"
    error_id: ERR_TAX_DOCUMENT_INVALID
    http_status: 422
    applies_to: "POST /payout-lines/{id}/release-hold"
    description: "Releasing a hold requires a currently valid tax form. Ranked below the fraud-hold check so a HELD_FRAUD line on a partner with an expired W9 reports the fraud hold."

  - priority: 49
    category: business_fiscal
    check: "batch.net_payable_cents <= APPROVAL_LIMIT_CENTS (5000000)"
    error_id: ERR_APPROVAL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /payout-batches/{id}/approve"
    description: "A single approval cannot release more than 5,000,000 cents. Ranked below the state check, so approving an over-limit DRAFT batch reports the state error."

  - priority: 50
    category: business_fiscal
    check: "the network statement reconciles per calculations.network_fee_reconciliation"
    error_id: ERR_NETWORK_FEE_VARIANCE
    http_status: 422
    applies_to: "POST /payout-batches/{id}/validate"
    description: "Raised when statement_gross_cents differs from the computed gross at all, or when the fee variance exceeds VARIANCE_TOLERANCE_BPS (50)."

  - priority: 51
    category: business_fiscal
    check: "at least one unstamped CommissionLedgerEntry qualifies for the requested period"
    error_id: ERR_NO_ELIGIBLE_PAYOUT_LINES
    http_status: 422
    applies_to: "POST /payout-batches"
    description: "Empty-set boundary: no PayoutBatch row is created, so a retry after the validation sweep catches up can still succeed."

# ============================================================================
# §1.5 API Endpoint Table
# Every first-position path parameter is literally `{id}`. Single-resource GETs
# are always `/<collection>/{id}` so each entity has an unambiguous collection
# segment.
# ============================================================================

endpoints:

  # --- Network ---------------------------------------------------------------
  - method: POST
    path: /networks
    description: Register an affiliate network with its fee model.
    roles: [ProgramAdmin]
    input: ["name", "fee_model", "fee_bps", "flat_fee_cents", "statement_currency"]
    output: Network
    success_code: 201
    side_effects:
      - "creates the Network row; fee_bps must be 0 when fee_model == FLAT_PER_CONVERSION and flat_fee_cents must be 0 when fee_model == PERCENT_OF_COMMISSION"

  - method: GET
    path: /networks/{id}
    description: Read one network.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController]
    input: []
    output: Network
    success_code: 200
    side_effects: []

  # --- Affiliate -------------------------------------------------------------
  - method: POST
    path: /affiliates
    description: Self-registration of a prospective publisher partner. The only Anonymous route.
    roles: [Anonymous, ProgramAdmin, PartnerManager]
    input: ["legal_name", "contact_email", "partner_type", "network_id", "payout_currency", "parent_affiliate_id?"]
    output: Affiliate
    success_code: 201
    side_effects:
      - "creates the Affiliate row with status PENDING_APPLICATION and suspension_cause NONE"
      - "computes sub_affiliate_depth as 0, or parent.sub_affiliate_depth + 1 when parent_affiliate_id is supplied"
      - "computes incrementality_score_bps and incrementality_tier from the zeroed counters per calculations.affiliate_incrementality_score"
      - "zeroes fraud_risk_score, fraud_risk_score_trailing, all counters and all balances; sets tax_document_status to MISSING"

  - method: GET
    path: /affiliates/{id}
    description: Read one partner including scores, tier and balances.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, FinanceAnalyst, FinanceController, AffiliatePartner]
    input: []
    output: Affiliate
    success_code: 200
    side_effects: []

  - method: GET
    path: /affiliates
    description: List partners, filterable by status, partner type, network and parent.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, FinanceAnalyst, FinanceController]
    input: ["status?", "partner_type?", "network_id?", "parent_affiliate_id?", "incrementality_tier?", "limit?", "offset?"]
    output: Affiliate[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /affiliates/{id}/status-change
    description: Suspend, reinstate or terminate a partner.
    roles: [ProgramAdmin, ComplianceAnalyst]
    input: ["target_status", "reason"]
    output: Affiliate
    success_code: 200
    side_effects:
      - "drives the Affiliate transitions in §1.2, including the sub-affiliate, tracking-link and payout-line cascade on suspension"
      - "reinstatement enforces open_violation_case_count == 0 and fraud_risk_score_trailing < 25.0"
      - "increments Affiliate.version on every affiliate touched"

  - method: GET
    path: /affiliates/{id}/monitoring-scans
    description: List the compliance scans recorded against a partner.
    roles: [ProgramAdmin, ComplianceAnalyst]
    input: ["engine?", "limit?", "offset?"]
    output: MonitoringScan[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /affiliates/{id}/tax-documents
    description: List a partner's tax forms.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController, AffiliatePartner]
    input: ["status?", "limit?", "offset?"]
    output: TaxDocument[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /affiliates/{id}/tax-documents
    description: File a tax form for a partner. Bumps Affiliate.version without changing status.
    roles: [ProgramAdmin, FinanceController, AffiliatePartner]
    input: ["form_type", "tax_id_last4", "treaty_withholding_bps", "expires_on"]
    output: TaxDocument
    success_code: 201
    side_effects:
      - "creates the TaxDocument row with status PENDING"
      - "sets Affiliate.tax_document_status to PENDING and increments Affiliate.version by 1 while leaving Affiliate.status untouched"

  - method: POST
    path: /affiliates/{id}/applications
    description: File a program application for a partner.
    roles: [ProgramAdmin, PartnerManager, AffiliatePartner]
    input: ["site_url", "primary_traffic_source", "monthly_traffic_estimate", "declared_promo_methods", "product_categories"]
    output: AffiliateApplication
    success_code: 201
    side_effects:
      - "creates the AffiliateApplication row with review_state SUBMITTED, screening_outcome NOT_SCREENED and revision_round_count 0"
      - "rejected when the partner already has a non-terminal application"

  - method: POST
    path: /affiliates/{id}/tracking-links
    description: Mint a tracking link for an active partner.
    roles: [ProgramAdmin, PartnerManager]
    input: ["landing_url", "sub_id", "cookie_window_days?", "device_graph_enabled?"]
    output: TrackingLink
    success_code: 201
    side_effects:
      - "creates the TrackingLink row with status ACTIVE; cookie_window_days defaults to 30 and device_graph_enabled defaults to false"
      - "increments Affiliate.tracking_link_count and Affiliate.version by 1"

  - method: GET
    path: /affiliates/{id}/tracking-links
    description: List a partner's tracking links.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, AffiliatePartner]
    input: ["status?", "limit?", "offset?"]
    output: TrackingLink[]
    success_code: 200
    side_effects: []

  # --- AffiliateApplication --------------------------------------------------
  - method: GET
    path: /affiliate-applications/{id}
    description: Read one application including its screening scores.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, AffiliatePartner]
    input: []
    output: AffiliateApplication
    success_code: 200
    side_effects: []

  - method: GET
    path: /affiliate-applications
    description: List applications, filterable by partner, review state and screening outcome.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst]
    input: ["affiliate_id?", "review_state?", "screening_outcome?", "limit?", "offset?"]
    output: AffiliateApplication[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /affiliate-applications/{id}/screen
    description: Record the site-quality and brand-suitability screen for an application.
    roles: [ComplianceAnalyst]
    input: ["domain_authority", "content_originality_pct", "broken_link_ratio_bps", "brand_safety_flag_count", "restricted_vertical_overlap_bps"]
    output: AffiliateApplication
    success_code: 200
    side_effects:
      - "computes site_quality_score per calculations.site_quality_composite_score, choosing the STANDARD_SCREEN or RESTRICTED_CATEGORY_SCREEN variant from declared_promo_methods"
      - "computes brand_suitability_score per calculations.brand_suitability_score"
      - "derives screening_outcome from both scores"
      - "records screened_by_user_id = X-User-ID and moves review_state SUBMITTED -> SCREENED"
      - "increments AffiliateApplication.version by 1"

  - method: POST
    path: /affiliate-applications/{id}/decide
    description: Approve, conditionally approve, request changes on, or reject a screened application.
    roles: [PartnerManager]
    input: ["decision", "decision_notes", "expected_affiliate_version", "conditional_requirements?"]
    output: AffiliateApplication
    success_code: 200
    side_effects:
      - "drives the AffiliateApplication SCREENED -> {APPROVED, APPROVED_WITH_CONDITIONS, CHANGES_REQUESTED, REJECTED} branches in §1.2 with their divergent Affiliate cascades"
      - "enforces segregation of duties against screened_by_user_id"
      - "enforces OCC rule decide-stale-affiliate on expected_affiliate_version"
      - "increments AffiliateApplication.version by 1 and Affiliate.version by 1 on the branches that cascade"

  - method: POST
    path: /affiliate-applications/{id}/resubmit
    description: Partner-side resubmission of an application that was sent back for changes.
    roles: [AffiliatePartner, ProgramAdmin]
    input: ["site_url", "primary_traffic_source", "declared_promo_methods"]
    output: AffiliateApplication
    success_code: 200
    side_effects:
      - "moves review_state CHANGES_REQUESTED -> SUBMITTED and increments revision_round_count by 1"
      - "clears site_quality_score, brand_suitability_score and screened_by_user_id and resets screening_outcome to NOT_SCREENED"
      - "increments AffiliateApplication.version by 1"

  # --- CommissionPolicy ------------------------------------------------------
  - method: POST
    path: /commission-policies
    description: Draft a rate card. No window ordering or overlap validation happens here.
    roles: [ProgramAdmin]
    input: ["policy_code", "product_category", "partner_type_scope", "new_customer_rate_bps", "returning_customer_rate_bps", "effective_from", "effective_to"]
    output: CommissionPolicy
    success_code: 201
    side_effects:
      - "creates the CommissionPolicy row with status DRAFT"
      - "deliberately accepts an inverted or overlapping window; both are enforced only at activation"

  - method: GET
    path: /commission-policies/{id}
    description: Read one rate card.
    roles: [ProgramAdmin, PartnerManager, FinanceAnalyst, FinanceController]
    input: []
    output: CommissionPolicy
    success_code: 200
    side_effects: []

  - method: GET
    path: /commission-policies
    description: List rate cards, filterable by status, category and superseding policy.
    roles: [ProgramAdmin, PartnerManager, FinanceAnalyst, FinanceController]
    input: ["status?", "product_category?", "superseded_by_policy_id?", "limit?", "offset?"]
    output: CommissionPolicy[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /commission-policies/{id}/activate
    description: Activate a draft rate card.
    roles: [ProgramAdmin]
    input: ["expected_policy_version"]
    output: CommissionPolicy
    success_code: 200
    side_effects:
      - "enforces effective_from < effective_to before the overlap check"
      - "rejects a partially overlapping ACTIVE policy with the same category and an intersecting partner_type_scope"
      - "supersedes an ACTIVE policy whose window is exactly equal, setting its superseded_by_policy_id"
      - "moves status DRAFT -> ACTIVE and increments CommissionPolicy.version by 1"

  # --- TrackingLink / ClickEvent --------------------------------------------
  - method: GET
    path: /tracking-links/{id}
    description: Read one tracking link.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, AffiliatePartner, TrackingIngestor]
    input: []
    output: TrackingLink
    success_code: 200
    side_effects: []

  - method: POST
    path: /tracking-links/{id}/disable
    description: Disable a tracking link so its clicks stop being attribution candidates.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst]
    input: ["reason"]
    output: TrackingLink
    success_code: 200
    side_effects:
      - "moves status ACTIVE -> DISABLED, stores disabled_reason and increments TrackingLink.version by 1"
      - "existing ClickEvent rows are retained but become ineligible"

  - method: POST
    path: /tracking-links/{id}/clicks
    description: Ingest a click. Refreshes candidate counts on still-unattributed orders.
    roles: [TrackingIngestor, ProgramAdmin]
    input: ["occurred_at", "device_id", "click_type", "household_id?", "referrer_domain?", "paid_search_keyword?", "is_trademark_term?"]
    output: ClickEvent
    success_code: 201
    side_effects:
      - "creates the immutable ClickEvent row"
      - "recomputes Conversion.candidate_click_count for every UNATTRIBUTED conversion this click falls inside the cookie window of, and increments those Conversion.version values by 1 — the version bumper behind OCC rule attribute-stale-conversion"

  - method: GET
    path: /tracking-links/{id}/clicks
    description: List the clicks recorded on a tracking link.
    roles: [ProgramAdmin, ComplianceAnalyst, TrackingIngestor]
    input: ["click_type?", "limit?", "offset?"]
    output: ClickEvent[]
    success_code: 200
    side_effects: []

  # --- Conversion ------------------------------------------------------------
  - method: POST
    path: /conversions
    description: Record a retail order that may be affiliate-attributable.
    roles: [TrackingIngestor, ProgramAdmin]
    input: ["order_ref", "order_total_cents", "product_category", "customer_ref", "is_new_customer", "placed_at", "device_id", "household_id?", "coupon_code_used?", "other_channel_touch?", "other_channel_touch_at?"]
    output: Conversion
    success_code: 201
    side_effects:
      - "creates the Conversion row with attribution_status UNATTRIBUTED and validation_status PENDING_VALIDATION"
      - "computes candidate_click_count from the clicks already on file, without selecting a winner"
      - "zeroes gross_commission_cents, payable_commission_cents, clawed_back_cents and returned_amount_cents"

  - method: GET
    path: /conversions/{id}
    description: Read one order with its attribution and validation state.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, FinanceAnalyst, FinanceController, TrackingIngestor]
    input: []
    output: Conversion
    success_code: 200
    side_effects: []

  - method: GET
    path: /conversions
    description: List orders, filterable by attributed partner, winning click, rate card and both state dimensions.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, FinanceAnalyst, FinanceController]
    input: ["attributed_affiliate_id?", "attributed_click_id?", "commission_policy_id?", "attribution_status?", "validation_status?", "limit?", "offset?"]
    output: Conversion[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /conversions/{id}/attribute
    description: Resolve last-click attribution, channel deduplication and the commission for an order.
    roles: [TrackingIngestor, ProgramAdmin]
    input: ["expected_conversion_version"]
    output: Conversion
    success_code: 200
    side_effects:
      - "runs calculations.commission_policy_selection, then calculations.attribution_resolution"
      - "writes one AttributionDecision row per algorithm_variant with exactly one selected"
      - "appends an ACCRUAL CommissionLedgerEntry and raises Affiliate.accrued_balance_cents on the crediting branches"
      - "increments the Affiliate attribution counters and recomputes incrementality_score_bps / incrementality_tier to their post-state values, in the pinned order of calculations.affiliate_incrementality_score"
      - "enforces OCC rule attribute-stale-conversion on expected_conversion_version"
      - "increments Conversion.version by 1, and Affiliate.version by 1 on the crediting branches"

  - method: POST
    path: /conversions/{id}/order-adjustment
    description: Record a cancellation or return and unwind the commission accordingly.
    roles: [TrackingIngestor, ProgramAdmin, FinanceAnalyst]
    input: ["adjustment_type", "returned_amount_cents", "occurred_at"]
    output: Conversion
    success_code: 200
    side_effects:
      - "runs calculations.clawback_allocation and appends a REVERSAL, CLAWBACK or ADJUSTMENT CommissionLedgerEntry"
      - "lowers Affiliate.accrued_balance_cents by the same magnitude"
      - "on the pre-validation bucket also detaches the attribution and decrements the Affiliate counters, then recomputes incrementality"
      - "recomputes the affiliate's PayoutLine and its batch totals when the accrual is stamped to a DRAFT or VALIDATED batch, possibly moving the line to HELD_BELOW_MINIMUM"
      - "increments Conversion.version by 1 and Affiliate.version by 1"

  - method: GET
    path: /conversions/{id}/attribution-decisions
    description: List both algorithm variants evaluated for an order.
    roles: [ProgramAdmin, PartnerManager, ComplianceAnalyst, FinanceAnalyst, FinanceController]
    input: ["algorithm_variant?", "limit?", "offset?"]
    output: AttributionDecision[]
    success_code: 200
    side_effects: []

  # --- MonitoringScan / PolicyViolationCase ---------------------------------
  - method: POST
    path: /monitoring-scans
    description: Record a paid-search and coupon-distribution monitoring sweep for a partner.
    roles: [ComplianceAnalyst, ProgramAdmin]
    input: ["affiliate_id", "engine", "window_start", "window_end", "trademark_hits", "forced_click_ratio_bps", "cookie_stuffing_index", "unauthorized_coupon_hits"]
    output: MonitoringScan
    success_code: 201
    side_effects:
      - "rejects a window that overlaps, touches, or sits within SCAN_COOLDOWN_HOURS (24) of another scan for the same affiliate and engine"
      - "opens one PolicyViolationCase per breached signal in the fixed order of calculations.fraud_risk_score and sets opened_case_count"
      - "raises Affiliate.open_violation_case_count and recomputes both fraud_risk_score variants"
      - "auto-suspends the partner when the point-in-time score reaches 70, cascading to sub-affiliates, tracking links, payout lines and batch totals"

  - method: POST
    path: /policy-violation-cases
    description: Open a violation case manually, optionally citing a scan.
    roles: [ComplianceAnalyst, ProgramAdmin]
    input: ["affiliate_id", "violation_type", "evidence_ref", "detected_at", "source_scan_id?"]
    output: PolicyViolationCase
    success_code: 201
    side_effects:
      - "creates the case in state OPEN with severity_weight from SEVERITY_WEIGHT and failed_verification_count 0"
      - "records opened_by_user_id = X-User-ID"
      - "raises Affiliate.open_violation_case_count and recomputes both fraud_risk_score variants, auto-suspending at 70"

  - method: GET
    path: /policy-violation-cases/{id}
    description: Read one violation case.
    roles: [ProgramAdmin, ComplianceAnalyst, PartnerManager, AffiliatePartner]
    input: []
    output: PolicyViolationCase
    success_code: 200
    side_effects: []

  - method: GET
    path: /policy-violation-cases
    description: List violation cases, filterable by partner, originating scan, state and type.
    roles: [ProgramAdmin, ComplianceAnalyst, PartnerManager]
    input: ["affiliate_id?", "source_scan_id?", "state?", "violation_type?", "limit?", "offset?"]
    output: PolicyViolationCase[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /policy-violation-cases/{id}/transition
    description: Advance a violation case through the remediation cycle.
    roles: [ComplianceAnalyst, ProgramAdmin, AffiliatePartner]
    input: ["action", "note", "remediation_evidence_ref?", "verify_outcome?"]
    output: PolicyViolationCase
    success_code: 200
    side_effects:
      - "drives the PolicyViolationCase transitions in §1.2, including the REMEDIATION_SUBMITTED -> OPEN failure cycle that increments failed_verification_count"
      - "enforces segregation of duties against opened_by_user_id on VERIFY"
      - "recomputes both Affiliate fraud_risk_score variants and open_violation_case_count on the closing transitions"
      - "auto-suspends the partner when an UPHELD outcome pushes the point-in-time score to 70"

  # --- TaxDocument -----------------------------------------------------------
  - method: POST
    path: /tax-documents/{id}/verify
    description: Accept or reject a filed tax form.
    roles: [FinanceController]
    input: ["verification_outcome"]
    output: TaxDocument
    success_code: 200
    side_effects:
      - "moves status PENDING -> VALID or PENDING -> REJECTED and records verified_by_user_id"
      - "mirrors the outcome onto Affiliate.tax_document_status when this is the partner's most recent document by created_at DESC"
      - "increments TaxDocument.version by 1 and Affiliate.version by 1"

  # --- CommissionLedgerEntry -------------------------------------------------
  - method: GET
    path: /commission-ledger-entries/{id}
    description: Read one immutable ledger entry.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController]
    input: []
    output: CommissionLedgerEntry
    success_code: 200
    side_effects: []

  - method: GET
    path: /commission-ledger-entries
    description: List ledger entries, filterable by partner, conversion, batch and entry type.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController, AffiliatePartner]
    input: ["affiliate_id?", "conversion_id?", "payout_batch_id?", "entry_type?", "limit?", "offset?"]
    output: CommissionLedgerEntry[]
    success_code: 200
    side_effects: []

  # --- PayoutBatch / PayoutLine ---------------------------------------------
  - method: POST
    path: /payout-batches
    description: Generate a payout batch for a network and period.
    roles: [FinanceAnalyst]
    input: ["network_id", "period_start", "period_end"]
    output: PayoutBatch
    success_code: 201
    side_effects:
      - "runs the validation sweep moving Conversion PENDING_VALIDATION -> VALIDATED where placed_at + 30 days <= clock now"
      - "refreshes TaxDocument VALID -> EXPIRED and the mirrored Affiliate.tax_document_status"
      - "claims and stamps every qualifying unstamped CommissionLedgerEntry and creates one PayoutLine per partner per calculations.payout_line_settlement"
      - "holds lines below MIN_PAYOUT_CENTS as HELD_BELOW_MINIMUM"
      - "records prepared_by_user_id = X-User-ID and state DRAFT"
      - "fails with ERR_NO_ELIGIBLE_PAYOUT_LINES and creates nothing when no entry qualifies"

  - method: GET
    path: /payout-batches/{id}
    description: Read one payout batch with its totals and reconciliation status.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController]
    input: []
    output: PayoutBatch
    success_code: 200
    side_effects: []

  - method: GET
    path: /payout-batches
    description: List payout batches, filterable by network and state.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController]
    input: ["network_id?", "state?", "reconciliation_status?", "limit?", "offset?"]
    output: PayoutBatch[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /payout-batches/{id}/validate
    description: Reconcile the batch against the network statement and apply tax and fraud holds.
    roles: [FinanceAnalyst]
    input: ["statement_gross_cents", "statement_fee_cents"]
    output: PayoutBatch
    success_code: 200
    side_effects:
      - "refreshes tax document expiry, then holds lines as HELD_TAX_DOC or HELD_FRAUD"
      - "recomputes every line and the batch totals per calculations.payout_line_settlement"
      - "runs calculations.network_fee_reconciliation, storing network_fee_variance_cents, network_fee_variance_bps and reconciliation_status"
      - "moves state DRAFT -> VALIDATED and increments PayoutBatch.version by 1"

  - method: POST
    path: /payout-batches/{id}/approve
    description: Approve a reconciled batch and reserve the partner balances.
    roles: [FinanceController]
    input: ["expected_batch_version"]
    output: PayoutBatch
    success_code: 200
    side_effects:
      - "enforces segregation of duties against prepared_by_user_id"
      - "enforces the APPROVAL_LIMIT_CENTS (5000000) ceiling on net_payable_cents"
      - "moves net_before_fees_cents per INCLUDED line from Affiliate.accrued_balance_cents to Affiliate.reserved_balance_cents"
      - "enforces OCC rule approve-stale-batch on expected_batch_version"
      - "moves state VALIDATED -> APPROVED and increments PayoutBatch.version by 1"

  - method: POST
    path: /payout-batches/{id}/pay
    description: Mark an approved batch paid and settle the reserved balances.
    roles: [FinanceController]
    input: ["payment_reference"]
    output: PayoutBatch
    success_code: 200
    side_effects:
      - "moves state APPROVED -> PAID and every INCLUDED line to PAID"
      - "appends a SETTLEMENT CommissionLedgerEntry per paid line, lowers Affiliate.reserved_balance_cents and raises Affiliate.lifetime_paid_cents"
      - "un-stamps the ledger entries of still-held lines back to payout_batch_id null"
      - "increments PayoutBatch.version by 1"

  - method: POST
    path: /payout-batches/{id}/void
    description: Void a batch, fully compensating any reservation it made.
    roles: [FinanceController]
    input: ["reason"]
    output: PayoutBatch
    success_code: 200
    side_effects:
      - "moves state {DRAFT, VALIDATED, APPROVED} -> VOIDED and every line to VOIDED"
      - "returns any reserved amount from Affiliate.reserved_balance_cents to Affiliate.accrued_balance_cents"
      - "un-stamps every CommissionLedgerEntry of this batch back to payout_batch_id null without creating or deleting a single entry"
      - "increments PayoutBatch.version by 1"

  - method: GET
    path: /payout-lines/{id}
    description: Read one payout line with its fee, withholding and hold state.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController, AffiliatePartner]
    input: []
    output: PayoutLine
    success_code: 200
    side_effects: []

  - method: GET
    path: /payout-lines
    description: List payout lines, filterable by batch, partner and state.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController, AffiliatePartner]
    input: ["payout_batch_id?", "affiliate_id?", "state?", "limit?", "offset?"]
    output: PayoutLine[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /payout-lines/{id}/release-hold
    description: Release a tax or minimum-payout hold. Recomputes the batch totals and bumps the batch version without changing batch state.
    roles: [FinanceController]
    input: ["reason"]
    output: PayoutLine
    success_code: 200
    side_effects:
      - "refuses HELD_FRAUD lines with ERR_FRAUD_HOLD_NOT_CLEARABLE, which outranks the tax-document check"
      - "requires a currently VALID TaxDocument on the partner"
      - "moves the line back to INCLUDED, recomputes it and the batch totals, and increments PayoutBatch.version by 1 while leaving batch.state unchanged — the version bumper behind OCC rule approve-stale-batch"
      - "increments PayoutLine.version by 1"

  # --- Test-only logical clock ----------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: >-
      Test-only control endpoint that pins the logical clock used by every
      temporal rule (cookie windows, the 30-day validation hold, the 90-day
      trailing decay, tax document expiry, the scan cooldown). The default
      logical clock is 2026-08-01T00:00:00Z until a call moves it.
    roles: [ProgramAdmin, FinanceAnalyst, FinanceController, ComplianceAnalyst, PartnerManager, TrackingIngestor]
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    success_code: 200
    side_effects:
      - "sets the logical clock; performs no business writes and triggers no sweep of its own"

# ============================================================================
# §1.6 Error Code Catalog — one row per code in §1.4, same ordering.
# ============================================================================

errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header absent or naming no known user"
    applies_to: ["all except POST /affiliates"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "caller's role is not listed in the endpoint's roles"
    applies_to: ["all"]
  - id: ERR_AFFILIATE_NOT_FOUND
    http_status: 404
    condition: "affiliate id in the path or body names no Affiliate"
    applies_to: ["GET /affiliates/{id}", "POST /affiliates/{id}/status-change", "GET /affiliates/{id}/monitoring-scans", "GET /affiliates/{id}/tax-documents", "POST /affiliates/{id}/tax-documents", "POST /affiliates/{id}/applications", "POST /affiliates/{id}/tracking-links", "GET /affiliates/{id}/tracking-links", "POST /affiliates", "POST /monitoring-scans", "POST /policy-violation-cases"]
  - id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    condition: "application id names no AffiliateApplication"
    applies_to: ["GET /affiliate-applications/{id}", "POST /affiliate-applications/{id}/screen", "POST /affiliate-applications/{id}/decide", "POST /affiliate-applications/{id}/resubmit"]
  - id: ERR_POLICY_NOT_FOUND
    http_status: 404
    condition: "policy id names no CommissionPolicy"
    applies_to: ["GET /commission-policies/{id}", "POST /commission-policies/{id}/activate"]
  - id: ERR_TRACKING_LINK_NOT_FOUND
    http_status: 404
    condition: "tracking link id names no TrackingLink"
    applies_to: ["GET /tracking-links/{id}", "POST /tracking-links/{id}/disable", "POST /tracking-links/{id}/clicks", "GET /tracking-links/{id}/clicks"]
  - id: ERR_CONVERSION_NOT_FOUND
    http_status: 404
    condition: "conversion id names no Conversion"
    applies_to: ["GET /conversions/{id}", "POST /conversions/{id}/attribute", "POST /conversions/{id}/order-adjustment", "GET /conversions/{id}/attribution-decisions"]
  - id: ERR_CASE_NOT_FOUND
    http_status: 404
    condition: "case id names no PolicyViolationCase, or source_scan_id names no MonitoringScan"
    applies_to: ["GET /policy-violation-cases/{id}", "POST /policy-violation-cases/{id}/transition", "POST /policy-violation-cases"]
  - id: ERR_BATCH_NOT_FOUND
    http_status: 404
    condition: "batch id names no PayoutBatch"
    applies_to: ["GET /payout-batches/{id}", "POST /payout-batches/{id}/validate", "POST /payout-batches/{id}/approve", "POST /payout-batches/{id}/pay", "POST /payout-batches/{id}/void"]
  - id: ERR_LINE_NOT_FOUND
    http_status: 404
    condition: "line id names no PayoutLine"
    applies_to: ["GET /payout-lines/{id}", "POST /payout-lines/{id}/release-hold"]
  - id: ERR_NETWORK_NOT_FOUND
    http_status: 404
    condition: "network id names no Network"
    applies_to: ["GET /networks/{id}", "POST /affiliates", "POST /payout-batches"]
  - id: ERR_TAX_DOCUMENT_NOT_FOUND
    http_status: 404
    condition: "tax document id names no TaxDocument"
    applies_to: ["POST /tax-documents/{id}/verify"]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "an AffiliatePartner caller addresses a resource belonging to a different Affiliate"
    applies_to: ["GET /affiliates/{id}", "GET /affiliates/{id}/tracking-links", "GET /affiliates/{id}/tax-documents", "POST /affiliates/{id}/tax-documents", "POST /affiliates/{id}/applications", "POST /affiliate-applications/{id}/resubmit", "POST /policy-violation-cases/{id}/transition"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required field, unknown enum member, wrong type, malformed instant, or out-of-range integer"
    applies_to: ["all"]
  - id: ERR_PAGINATION_INVALID
    http_status: 400
    condition: "limit outside 1..100 or offset below 0"
    applies_to: ["GET /affiliates", "GET /affiliate-applications", "GET /commission-policies", "GET /conversions", "GET /policy-violation-cases", "GET /commission-ledger-entries", "GET /payout-batches", "GET /payout-lines", "GET /affiliates/{id}/monitoring-scans", "GET /affiliates/{id}/tax-documents", "GET /affiliates/{id}/tracking-links", "GET /tracking-links/{id}/clicks", "GET /conversions/{id}/attribution-decisions"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "X-User-ID equals the user who performed the paired earlier step"
    applies_to: ["POST /affiliate-applications/{id}/decide", "POST /payout-batches/{id}/approve", "POST /policy-violation-cases/{id}/transition"]
  - id: ERR_AFFILIATE_SUSPENDED
    http_status: 409
    condition: "the owning Affiliate is SUSPENDED or TERMINATED"
    applies_to: ["POST /affiliates/{id}/tracking-links", "POST /affiliates/{id}/applications", "POST /tracking-links/{id}/clicks", "POST /affiliate-applications/{id}/resubmit"]
  - id: ERR_APPLICATION_TERMINAL
    http_status: 409
    condition: "review_state is APPROVED, APPROVED_WITH_CONDITIONS or REJECTED"
    applies_to: ["POST /affiliate-applications/{id}/screen", "POST /affiliate-applications/{id}/decide", "POST /affiliate-applications/{id}/resubmit"]
  - id: ERR_APPLICATION_NOT_SCREENED
    http_status: 409
    condition: "review_state is non-terminal but wrong for the requested step"
    applies_to: ["POST /affiliate-applications/{id}/screen", "POST /affiliate-applications/{id}/decide", "POST /affiliate-applications/{id}/resubmit"]
  - id: ERR_CONVERSION_ALREADY_ATTRIBUTED
    http_status: 409
    condition: "attribution_status is not UNATTRIBUTED"
    applies_to: ["POST /conversions/{id}/attribute"]
  - id: ERR_CONVERSION_NOT_ATTRIBUTED
    http_status: 409
    condition: "attribution_status is UNATTRIBUTED, or validation_status is already REVERSED or CLAWED_BACK"
    applies_to: ["POST /conversions/{id}/order-adjustment"]
  - id: ERR_CASE_ALREADY_TERMINAL
    http_status: 409
    condition: "case state is VERIFIED_CLEARED or UPHELD"
    applies_to: ["POST /policy-violation-cases/{id}/transition"]
  - id: ERR_CASE_INVALID_TRANSITION
    http_status: 409
    condition: "the requested action is not declared for the case's current state, or ESCALATE is attempted with failed_verification_count below 2"
    applies_to: ["POST /policy-violation-cases/{id}/transition"]
  - id: ERR_BATCH_TERMINAL
    http_status: 409
    condition: "batch state is PAID or VOIDED"
    applies_to: ["POST /payout-batches/{id}/validate", "POST /payout-batches/{id}/approve", "POST /payout-batches/{id}/pay", "POST /payout-batches/{id}/void"]
  - id: ERR_BATCH_NOT_VALIDATED
    http_status: 409
    condition: "batch state is non-terminal but wrong for the requested step"
    applies_to: ["POST /payout-batches/{id}/validate", "POST /payout-batches/{id}/approve", "POST /payout-batches/{id}/pay"]
  - id: ERR_LINE_NOT_HELD
    http_status: 409
    condition: "line state is not a releasable hold, or the owning batch is already APPROVED or terminal"
    applies_to: ["POST /payout-lines/{id}/release-hold"]
  - id: ERR_AFFILIATE_NOT_ELIGIBLE
    http_status: 409
    condition: "applicant Affiliate.status is not PENDING_APPLICATION, or the partner has an UPHELD violation case"
    applies_to: ["POST /affiliate-applications/{id}/decide"]
  - id: ERR_TRACKING_LINK_DISABLED
    http_status: 409
    condition: "tracking link status is DISABLED"
    applies_to: ["POST /tracking-links/{id}/clicks", "POST /tracking-links/{id}/disable"]
  - id: ERR_STALE_AFFILIATE_VERSION
    http_status: 412
    condition: "expected_affiliate_version differs from the applicant's current Affiliate.version"
    applies_to: ["POST /affiliate-applications/{id}/decide"]
  - id: ERR_STALE_CONVERSION_VERSION
    http_status: 412
    condition: "expected_conversion_version differs from the order's current Conversion.version"
    applies_to: ["POST /conversions/{id}/attribute"]
  - id: ERR_STALE_BATCH_VERSION
    http_status: 412
    condition: "expected_batch_version differs from the batch's current PayoutBatch.version"
    applies_to: ["POST /payout-batches/{id}/approve"]
  - id: ERR_STALE_POLICY_VERSION
    http_status: 412
    condition: "expected_policy_version differs from the policy's current CommissionPolicy.version"
    applies_to: ["POST /commission-policies/{id}/activate"]
  - id: ERR_BRAND_SUITABILITY_VIOLATION
    http_status: 422
    condition: "an approval branch is requested on an application whose brand_suitability_score is below 70.0"
    applies_to: ["POST /affiliate-applications/{id}/decide"]
  - id: ERR_FRAUD_HOLD_NOT_CLEARABLE
    http_status: 409
    condition: "the line is in HELD_FRAUD"
    applies_to: ["POST /payout-lines/{id}/release-hold"]
  - id: ERR_OPEN_VIOLATION_CASES
    http_status: 409
    condition: "reinstatement requested while open_violation_case_count is above 0"
    applies_to: ["POST /affiliates/{id}/status-change"]
  - id: ERR_RISK_SCORE_TOO_HIGH
    http_status: 409
    condition: "reinstatement requested while fraud_risk_score_trailing is 25.0 or above"
    applies_to: ["POST /affiliates/{id}/status-change"]
  - id: ERR_INVALID_EFFECTIVE_WINDOW
    http_status: 422
    condition: "effective_to is less than or equal to effective_from at activation time"
    applies_to: ["POST /commission-policies/{id}/activate"]
  - id: ERR_SCAN_WINDOW_OVERLAP
    http_status: 409
    condition: "the closed scan window touches or overlaps another scan for the same affiliate and engine, or starts inside the 24-hour cooldown after one"
    applies_to: ["POST /monitoring-scans"]
  - id: ERR_POLICY_WINDOW_OVERLAP
    http_status: 409
    condition: "an ACTIVE policy with the same category and an intersecting partner_type_scope has a partially overlapping half-open window"
    applies_to: ["POST /commission-policies/{id}/activate"]
  - id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    condition: "the partner already has an AffiliateApplication in a non-terminal review_state"
    applies_to: ["POST /affiliates/{id}/applications"]
  - id: ERR_DUPLICATE_ORDER_REF
    http_status: 409
    condition: "order_ref already exists on another Conversion"
    applies_to: ["POST /conversions"]
  - id: ERR_SUB_AFFILIATE_DEPTH_EXCEEDED
    http_status: 422
    condition: "the prospective sub_affiliate_depth would exceed MAX_SUB_AFFILIATE_DEPTH (1)"
    applies_to: ["POST /affiliates"]
  - id: ERR_CIRCULAR_SUB_AFFILIATE
    http_status: 422
    condition: "parent_affiliate_id names a partner whose partner_type is not SUB_NETWORK"
    applies_to: ["POST /affiliates"]
  - id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    condition: "revision_round_count has already reached MAX_REVISION_ROUNDS (2)"
    applies_to: ["POST /affiliate-applications/{id}/decide", "POST /affiliate-applications/{id}/resubmit"]
  - id: ERR_SCREENING_NOT_PASSED
    http_status: 422
    condition: "the requested decision is incompatible with screening_outcome, or APPROVE_WITH_CONDITIONS carries an empty conditional_requirements array"
    applies_to: ["POST /affiliate-applications/{id}/decide"]
  - id: ERR_ADJUSTMENT_EXCEEDS_ORDER
    http_status: 422
    condition: "cumulative returned_amount_cents would exceed order_total_cents"
    applies_to: ["POST /conversions/{id}/order-adjustment"]
  - id: ERR_NO_ACTIVE_COMMISSION_POLICY
    http_status: 422
    condition: "no ACTIVE CommissionPolicy covers the category, partner type and placed_at of the order"
    applies_to: ["POST /conversions/{id}/attribute"]
  - id: ERR_TAX_DOCUMENT_INVALID
    http_status: 422
    condition: "the partner has no TaxDocument that is VALID and unexpired against the logical clock"
    applies_to: ["POST /payout-lines/{id}/release-hold"]
  - id: ERR_APPROVAL_LIMIT_EXCEEDED
    http_status: 422
    condition: "net_payable_cents exceeds APPROVAL_LIMIT_CENTS (5000000)"
    applies_to: ["POST /payout-batches/{id}/approve"]
  - id: ERR_NETWORK_FEE_VARIANCE
    http_status: 422
    condition: "statement_gross_cents differs from the computed gross, or the fee variance exceeds VARIANCE_TOLERANCE_BPS (50)"
    applies_to: ["POST /payout-batches/{id}/validate"]
  - id: ERR_NO_ELIGIBLE_PAYOUT_LINES
    http_status: 422
    condition: "no unstamped CommissionLedgerEntry qualifies for the requested network and period"
    applies_to: ["POST /payout-batches"]

# ============================================================================
# §1.7 RBAC Permission Matrix
# ============================================================================

roles:
  - name: ProgramAdmin
    description: >-
      Program owner. Configures networks and rate cards, terminates and reinstates
      partners, and holds a read path into every collection. Cannot screen, decide,
      prepare or approve — those steps belong to the specialist roles so
      segregation of duties stays meaningful.
    identity: opaque
    exclusive_operations:
      - "POST /networks"
      - "POST /commission-policies"
      - "POST /commission-policies/{id}/activate"
      - "reinstating a SUSPENDED partner and terminating any partner via POST /affiliates/{id}/status-change"
    shared_operations:
      - "GET /networks/{id}"
      - "POST /affiliates"
      - "GET /affiliates/{id}"
      - "GET /affiliates"
      - "POST /affiliates/{id}/tax-documents"
      - "GET /affiliates/{id}/tax-documents"
      - "POST /affiliates/{id}/applications"
      - "POST /affiliates/{id}/tracking-links"
      - "GET /affiliates/{id}/tracking-links"
      - "GET /affiliates/{id}/monitoring-scans"
      - "GET /affiliate-applications/{id}"
      - "GET /affiliate-applications"
      - "POST /affiliate-applications/{id}/resubmit"
      - "GET /commission-policies/{id}"
      - "GET /commission-policies"
      - "GET /tracking-links/{id}"
      - "POST /tracking-links/{id}/disable"
      - "POST /tracking-links/{id}/clicks"
      - "GET /tracking-links/{id}/clicks"
      - "POST /conversions"
      - "GET /conversions/{id}"
      - "GET /conversions"
      - "POST /conversions/{id}/attribute"
      - "POST /conversions/{id}/order-adjustment"
      - "GET /conversions/{id}/attribution-decisions"
      - "POST /monitoring-scans"
      - "POST /policy-violation-cases"
      - "GET /policy-violation-cases/{id}"
      - "GET /policy-violation-cases"
      - "POST /policy-violation-cases/{id}/transition"
      - "GET /commission-ledger-entries/{id}"
      - "GET /commission-ledger-entries"
      - "GET /payout-batches/{id}"
      - "GET /payout-batches"
      - "GET /payout-lines/{id}"
      - "GET /payout-lines"
      - "POST /_clock/set_current_utc"

  - name: PartnerManager
    description: >-
      Owns the partner relationship. Decides screened applications, mints tracking
      links, and reads the commercial picture. Never screens an application, so the
      screen/decide split is structural, and never touches money.
    identity: opaque
    exclusive_operations:
      - "POST /affiliate-applications/{id}/decide"
    shared_operations:
      - "POST /affiliates"
      - "GET /affiliates/{id}"
      - "GET /affiliates"
      - "POST /affiliates/{id}/applications"
      - "POST /affiliates/{id}/tracking-links"
      - "GET /affiliates/{id}/tracking-links"
      - "GET /affiliate-applications/{id}"
      - "GET /affiliate-applications"
      - "GET /commission-policies/{id}"
      - "GET /commission-policies"
      - "GET /tracking-links/{id}"
      - "POST /tracking-links/{id}/disable"
      - "GET /conversions/{id}"
      - "GET /conversions"
      - "GET /conversions/{id}/attribution-decisions"
      - "GET /policy-violation-cases/{id}"
      - "GET /policy-violation-cases"
      - "POST /_clock/set_current_utc"

  - name: ComplianceAnalyst
    description: >-
      Runs site-quality screening and the trademark, coupon and fraud monitoring
      programme. Can suspend a partner but never reinstate one, and can open and
      verify cases but not the ones the same user opened.
    identity: opaque
    exclusive_operations:
      - "POST /affiliate-applications/{id}/screen"
      - "POST /monitoring-scans"
      - "suspending an ACTIVE or PENDING_APPLICATION partner via POST /affiliates/{id}/status-change"
    shared_operations:
      - "GET /affiliates/{id}"
      - "GET /affiliates"
      - "GET /affiliates/{id}/monitoring-scans"
      - "GET /affiliates/{id}/tracking-links"
      - "GET /affiliate-applications/{id}"
      - "GET /affiliate-applications"
      - "GET /tracking-links/{id}"
      - "POST /tracking-links/{id}/disable"
      - "GET /tracking-links/{id}/clicks"
      - "GET /conversions/{id}"
      - "GET /conversions"
      - "GET /conversions/{id}/attribution-decisions"
      - "POST /policy-violation-cases"
      - "GET /policy-violation-cases/{id}"
      - "GET /policy-violation-cases"
      - "POST /policy-violation-cases/{id}/transition"
      - "POST /_clock/set_current_utc"

  - name: FinanceAnalyst
    description: >-
      Prepares payout batches and reconciles the network statement. Cannot approve
      or pay what it prepared, which is the second segregation-of-duties axis.
    identity: opaque
    exclusive_operations:
      - "POST /payout-batches"
      - "POST /payout-batches/{id}/validate"
    shared_operations:
      - "GET /networks/{id}"
      - "GET /affiliates/{id}"
      - "GET /affiliates"
      - "GET /affiliates/{id}/tax-documents"
      - "GET /commission-policies/{id}"
      - "GET /commission-policies"
      - "GET /conversions/{id}"
      - "GET /conversions"
      - "POST /conversions/{id}/order-adjustment"
      - "GET /conversions/{id}/attribution-decisions"
      - "GET /commission-ledger-entries/{id}"
      - "GET /commission-ledger-entries"
      - "GET /payout-batches/{id}"
      - "GET /payout-batches"
      - "GET /payout-lines/{id}"
      - "GET /payout-lines"
      - "POST /_clock/set_current_utc"

  - name: FinanceController
    description: >-
      Approves, pays and voids batches, releases tax and minimum-payout holds, and
      verifies tax forms. Cannot prepare or reconcile a batch.
    identity: opaque
    exclusive_operations:
      - "POST /payout-batches/{id}/approve"
      - "POST /payout-batches/{id}/pay"
      - "POST /payout-batches/{id}/void"
      - "POST /payout-lines/{id}/release-hold"
      - "POST /tax-documents/{id}/verify"
    shared_operations:
      - "GET /networks/{id}"
      - "GET /affiliates/{id}"
      - "GET /affiliates"
      - "POST /affiliates/{id}/tax-documents"
      - "GET /affiliates/{id}/tax-documents"
      - "GET /commission-policies/{id}"
      - "GET /commission-policies"
      - "GET /conversions/{id}"
      - "GET /conversions"
      - "GET /conversions/{id}/attribution-decisions"
      - "GET /commission-ledger-entries/{id}"
      - "GET /commission-ledger-entries"
      - "GET /payout-batches/{id}"
      - "GET /payout-batches"
      - "GET /payout-lines/{id}"
      - "GET /payout-lines"
      - "POST /_clock/set_current_utc"

  - name: AffiliatePartner
    description: >-
      The publisher itself. X-User-ID is the Affiliate id, so every route it can
      reach is additionally narrowed to its own row by ERR_NOT_RESOURCE_OWNER.
      Reads its own money but can never move it.
    identity: entity_backed:Affiliate
    exclusive_operations: []
    shared_operations:
      - "GET /affiliates/{id}"
      - "POST /affiliates/{id}/tax-documents"
      - "GET /affiliates/{id}/tax-documents"
      - "POST /affiliates/{id}/applications"
      - "GET /affiliates/{id}/tracking-links"
      - "GET /affiliate-applications/{id}"
