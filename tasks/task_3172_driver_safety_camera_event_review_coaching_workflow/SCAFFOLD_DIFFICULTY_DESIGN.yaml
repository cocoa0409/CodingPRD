            - "SafetyEvent.${ev_xd}.review_count == 0 and GET /api/safety-events/${ev_xd}/review-decisions returns 0 rows"

      - name: session_complete_blocked_when_fleet_locked
        grounds:
          - state_machines.CoachingSession.ACKNOWLEDGED_to_COMPLETED
          - state_machines.Fleet
          - errors.ERR_FLEET_LOCKED
        distinguishing_aspect: |
          Pair CoachingSession -> Fleet (a different entity pair than
          SafetyEvent -> Driver): completing an ACKNOWLEDGED session is
          rejected with ERR_FLEET_LOCKED while the fleet posture is
          INCIDENT_LOCKDOWN, and succeeds after the posture returns to NORMAL.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; one HIGH event CONFIRMED (session auto-created ASSIGNED); driver acknowledged; fleet then moved to INCIDENT_LOCKDOWN."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "HIGH", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_lk: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_lk}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_lk: $.data.id }
            - call: "POST /api/footage-clips/${cl_lk}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_lk}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_lk}"
              payload: {}
              as: SafetyManager
              captures: { ev_lk_v: $.data.version }
            - call: "POST /api/safety-events/${ev_lk}/review"
              payload: { action: "CONFIRM", rationale: "coach this", expected_event_version: "${ev_lk_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
            - call: "GET /api/safety-events/${ev_lk}/coaching-sessions"
              payload: {}
              as: SafetyManager
              captures: { sess_lk: "$.data[0].id" }
            - call: "POST /api/coaching-sessions/${sess_lk}/acknowledge"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /api/fleets/${fleet_id}/posture"
              payload: { posture: "INCIDENT_LOCKDOWN", note: "depot incident under investigation" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/coaching-sessions/${sess_lk}/complete"
              payload: { outcome: "PASS", notes: "done during lockdown?" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { err_lk: $.data.error_id }
            - call: "POST /api/fleets/${fleet_id}/posture"
              payload: { posture: "NORMAL", note: "cleared" }
              as: PlatformAdmin
            - call: "POST /api/coaching-sessions/${sess_lk}/complete"
              payload: { outcome: "PASS", notes: "done after lockdown" }
              as: SafetyManager
              as_user_id: "sm-1"
          assert:
            - "first complete: HTTP 409 and err_lk == ERR_FLEET_LOCKED"
            - "after the rejected complete: CoachingSession.${sess_lk}.status == ACKNOWLEDGED and completed_at is null"
            - "after posture returns to NORMAL: second complete returns 200, status == COMPLETED, outcome == PASS"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coaching_sessions_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors.ERR_SESSION_WINDOW_OVERLAP
          - entities.CoachingSession
        distinguishing_aspect: |
          Resource = Driver schedule; half-open semantics [starts_at, ends_at):
          back-to-back sessions 10:00-11:00 and 11:00-12:00 coexist, while
          10:30-11:30 is rejected. Adjacency (end == start) is NOT overlap.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; one MEDIUM event CONFIRMED (no auto session at MEDIUM); no sessions yet."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_ov: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_ov}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_ov: $.data.id }
            - call: "POST /api/footage-clips/${cl_ov}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_ov}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_ov}"
              payload: {}
              as: SafetyManager
              captures: { ev_ov_v: $.data.version }
            - call: "POST /api/safety-events/${ev_ov}/review"
              payload: { action: "CONFIRM", rationale: "confirmed for coaching", expected_event_version: "${ev_ov_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
          trigger:
            - call: "POST /api/drivers/${drv_id}/coaching-sessions"
              payload: { event_id: "${ev_ov}", starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T11:00:00Z", due_at: "2026-09-09T00:00:00Z" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { sess1: $.data.id }
            - call: "POST /api/drivers/${drv_id}/coaching-sessions"
              payload: { event_id: "${ev_ov}", starts_at: "2026-09-02T11:00:00Z", ends_at: "2026-09-02T12:00:00Z", due_at: "2026-09-09T00:00:00Z" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { sess2: $.data.id }
            - call: "POST /api/drivers/${drv_id}/coaching-sessions"
              payload: { event_id: "${ev_ov}", starts_at: "2026-09-02T10:30:00Z", ends_at: "2026-09-02T11:30:00Z", due_at: "2026-09-09T00:00:00Z" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { err_ov: $.data.error_id }
          assert:
            - "first session created 201 (CoachingSession.${sess1} ASSIGNED)"
            - "second session created 201 — starts_at 11:00 == first ends_at 11:00 is adjacency, not overlap, under half-open semantics"
            - "third create: HTTP 409 and err_ov == ERR_SESSION_WINDOW_OVERLAP ([10:30,11:30) intersects both)"
            - "GET /api/drivers/${drv_id}/coaching-sessions returns exactly 2 rows"

      - name: union_agreement_closed_interval_touching_overlaps
        grounds:
          - validations[priority=8]
          - errors.ERR_AGREEMENT_WINDOW_OVERLAP
          - state_machines.UnionAgreement.DRAFT_to_RATIFIED
        distinguishing_aspect: |
          Resource = Terminal agreement coverage; closed-interval semantics
          [effective_from, effective_until] where touching endpoints SHARE an
          instant: ratifying an agreement whose window starts exactly at the
          incumbent's effective_until is rejected — the opposite treatment of
          adjacency from coaching sessions.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; agreement A RATIFIED with closed window [2026-01-01, 2026-06-30]; agreements B (touching) and C (gap) in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - call: "POST /api/union-agreements"
              payload: { terminal_id: "${term_id}", agreement_code: "CBA-2026-H1", inward_camera_allowed: false, live_view_allowed: false, audio_recording_allowed: false, coaching_requires_steward_present: true, effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /api/union-agreements/${ag_a}/ratify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/union-agreements"
              payload: { terminal_id: "${term_id}", agreement_code: "CBA-2026-H2-TOUCH", inward_camera_allowed: false, live_view_allowed: false, audio_recording_allowed: false, coaching_requires_steward_present: true, effective_from: "2026-06-30T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /api/union-agreements"
              payload: { terminal_id: "${term_id}", agreement_code: "CBA-2026-H2-GAP", inward_camera_allowed: true, live_view_allowed: false, audio_recording_allowed: false, coaching_requires_steward_present: true, effective_from: "2026-07-01T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { ag_c: $.data.id }
          trigger:
            - call: "POST /api/union-agreements/${ag_b}/ratify"
              payload: {}
              as: PlatformAdmin
              captures: { err_ag: $.data.error_id }
            - call: "POST /api/union-agreements/${ag_c}/ratify"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ratify B: HTTP 409 and err_ag == ERR_AGREEMENT_WINDOW_OVERLAP (closed intervals share the instant 2026-06-30T00:00:00Z)"
            - "UnionAgreement.${ag_b}.status == DRAFT (rejected ratify leaves state unchanged)"
            - "ratify C: HTTP 200, UnionAgreement.${ag_c}.status == RATIFIED (one full day of separation)"
            - "GET /api/terminals/${term_id}/union-agreements returns 3 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: confirm_then_exonerate_restores_score
        grounds:
          - state_machines.SafetyEvent.CONFIRMED_to_EXONERATED
          - calculations.driver_safety_score
          - state_machines.ExonerationClaim
        distinguishing_aspect: |
          Conserved quantity = driver final score (score points): a CONFIRM
          applies -7.50 (MEDIUM), and its compensating EXONERATE removes exactly
          the same penalty — driver_safety_score_final returns to 100.00 with
          zero drift, and confirmed_events_90d returns to 0.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; one MEDIUM COLLISION event CONFIRMED by reviewer sm-1; claim filed and in EVIDENCE_REVIEW."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "COLLISION", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_ci: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_ci}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_ci: $.data.id }
            - call: "POST /api/footage-clips/${cl_ci}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_ci}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_ci}"
              payload: {}
              as: SafetyManager
              captures: { ev_ci_v: $.data.version }
            - call: "POST /api/safety-events/${ev_ci}/review"
              payload: { action: "CONFIRM", rationale: "appears at fault", expected_event_version: "${ev_ci_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
            - call: "GET /api/drivers/${drv_id}"
              payload: {}
              as: SafetyManager
              captures: { drv_mid_final: $.data.safety_score_final }
            - call: "POST /api/safety-events/${ev_ci}/exoneration-claims"
              payload: { claim_ref: "CLM-100", police_report_ref: "PR-22" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { claim_ci: $.data.id }
            - call: "POST /api/exoneration-claims/${claim_ci}/begin-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca-1"
          trigger:
            - call: "POST /api/exoneration-claims/${claim_ci}/decide"
              payload: { decision: "EXONERATE", rationale: "video shows third party ran the light" }
              as: ClaimsAdjuster
              as_user_id: "ca-1"
          assert:
            - "mid-flight invariant: drv_mid_final == 92.50 (the CONFIRM applied exactly 7.50)"
            - "SafetyEvent.${ev_ci}.status == EXONERATED and confirmed_at is null"
            - "ExonerationClaim.${claim_ci}.status == EXONERATED and decided_by == ca-1"
            - "Driver.${drv_id}.safety_score_final == 100.00  (forward CONFIRM + compensating EXONERATE conserve the score)"
            - "Driver.${drv_id}.safety_score_provisional == 100.00"
            - "Driver.${drv_id}.confirmed_events_90d == 0"

      - name: hold_place_release_restores_retention_bytes
        grounds:
          - calculations.retention_used_bytes
          - state_machines.LitigationHold
        distinguishing_aspect: |
          Conserved quantity = fleet storage bytes (a different conserved
          quantity than score points): placing and later releasing a litigation
          hold changes retention_class but never retention_used_mb — 100 MB
          before, during, and after the hold cycle, with no drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; two COLLISION events each with a 50 MB clip UPLOADED; fleet.retention_used_mb == 100."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "COLLISION", severity: "HIGH", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_rb1: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_rb1}", camera_angle: "FORWARD", size_mb: 50, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_rb1: $.data.id }
            - call: "POST /api/footage-clips/${cl_rb1}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_rb1}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "COLLISION", severity: "HIGH", occurred_at: "2026-08-30T01:00:00Z" }
              as: TelematicsIngest
              captures: { ev_rb2: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_rb2}", camera_angle: "FORWARD", size_mb: 50, captured_at: "2026-08-30T01:00:00Z" }
              as: TelematicsIngest
              captures: { cl_rb2: $.data.id }
            - call: "POST /api/footage-clips/${cl_rb2}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_rb2}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/fleets/${fleet_id}"
              payload: {}
              as: SafetyManager
              captures: { fleet_mb_before: $.data.retention_used_mb }
          trigger:
            - call: "POST /api/litigation-holds"
              payload: { fleet_id: "${fleet_id}", scope: "DRIVER", driver_id: "${drv_id}", reason: "multi-claim litigation" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { hold_rb: $.data.id }
            - call: "GET /api/fleets/${fleet_id}"
              payload: {}
              as: SafetyManager
              captures: { fleet_mb_held: $.data.retention_used_mb }
            - call: "POST /api/litigation-holds/${hold_rb}/release"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-1"
            - call: "GET /api/fleets/${fleet_id}"
              payload: {}
              as: SafetyManager
              captures: { fleet_mb_after: $.data.retention_used_mb }
          assert:
            - "fleet_mb_before == 100 and fleet_mb_held == 100 and fleet_mb_after == 100 (bytes conserved across place+release)"
            - "during the hold: FootageClip.${cl_rb1}.retention_class == LITIGATION_HOLD and FootageClip.${cl_rb2}.retention_class == LITIGATION_HOLD"
            - "after release: both clips reverted to retention_class COLLISION (deterministic by event_type)"
            - "LitigationHold.${hold_rb}.status == RELEASED and released_at == 2026-09-01T00:00:00Z"
