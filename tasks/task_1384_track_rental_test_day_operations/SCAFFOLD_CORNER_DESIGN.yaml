  - section: consistency_model
    instances:
      - name: immediate_consistency_read_your_writes
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model

        distinguishing_aspect: "POST-then-GET on same resource returns updated fields in same request (no eventual lag)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /tracks"
              payload: { name: "Y1", noise_limit_db: 91, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_y1: $.data.id }
            - call: "GET /tracks/${tid_y1}"
              payload: {}
              as: TrackOps
              captures: { name_y1: $.data.name, nl: $.data.noise_limit_db }
          assert:
            - "GET returns name == 'Y1' AND noise_limit_db == 91 immediately"
