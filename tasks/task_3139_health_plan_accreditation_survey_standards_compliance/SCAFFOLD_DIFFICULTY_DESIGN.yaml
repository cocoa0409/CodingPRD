  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: decide_cascade_outcome_cap_application
        grounds:
          - state_machines.AccreditationApplication.SCORING_to_DECIDED
          - state_machines.AccreditationApplication.DECIDED_to_CORRECTIVE_ACTION
          - endpoints.POST_/accreditation/applications/{applicationId}/outcome
        distinguishing_aspect: |
          Depth-3 cascade from POST outcome: (1) AccreditationOutcome created
          with status ACCREDITED_WITH_CAP; (2) that status triggers
          auto-creation of an OPEN CAP (origin AUTO) for UM-1; (3) the new
          CAP's existence transitions the application DECIDED ->
          CORRECTIVE_ACTION. Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Base chain in SCORING with UM-1 FINAL at 1.60 (6 confirmed gaps) and all other elements FINAL."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_el_um2
            - *b_el_cr1
            - *b_el_mrr1
            - *b_el_qi1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_appv3
            - *b_ev3
            - *b_appv4
            - *b_ev4
            - *b_acc1
            - *b_acc2
            - *b_acc3
            - *b_acc4
            - *b_sample
            - *b_case1
            - *b_case2
            - *b_case3
            - *b_case4
            - *b_case5
            - *b_sample_submit
            - *b_sample_score
            - *b_advance
            - *b_appv5
            - *b_survey
            - *b_surveyor
            - *b_session
            - *b_confirm
            - *b_q1
            - *b_q2
            - *b_q3
            - *b_q4
            - *b_q5
            - *b_q6
            - *b_qa1
            - *b_qa2
            - *b_qa3
            - *b_qa4
            - *b_qa5
            - *b_qa6
            - *b_sess_complete
            - *b_survey_complete
            - *b_sc_um1
            - *b_sc_um2
            - *b_sc_cr1
            - *b_sc_mrr1
            - *b_sc_qi1
            - *b_fin_um1
            - *b_fin_um2
            - *b_fin_cr1
            - *b_fin_mrr1
            - *b_fin_qi1
          trigger:
            - call: "POST /accreditation/applications/${app_id}/outcome"
              payload: {}
              as: AccreditationOfficer
              captures: { outcome_cascade: $.data.id }
          assert:
            - "AccreditationOutcome.${outcome_cascade}.status == ACCREDITED_WITH_CAP (composite 92.00, 1 must-pass failure)"
            - "GET /accreditation/applications/${app_id}/corrective-action-plans returns exactly 1 CAP with origin == AUTO, standard_element_id == ${el_um1}, status == OPEN"
            - "CAP due_date == decided_at date + 90 days"
            - "AccreditationApplication.${app_id}.status == CORRECTIVE_ACTION (not DECIDED — the transient state was re-evaluated)"

      - name: supersede_cascade_edition_application_evidence
        grounds:
          - state_machines.StandardsEdition.PUBLISHED_to_SUPERSEDED
          - state_machines.AccreditationApplication.DRAFT_to_WITHDRAWN
          - state_machines.EvidenceItem.SUBMITTED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (POST supersede): (1)
          edition 2026 PUBLISHED -> SUPERSEDED; (2) the supersession
          transitions a DRAFT application on that edition to WITHDRAWN; (3)
          the withdrawal voids that application's SUBMITTED evidence. The
          final hop is caused by the application's withdrawal, not by the
          supersede call directly.
        test_recipe:
          setup:
            - "Edition 2026 PUBLISHED; plan + scope; application A2 on edition 2026 is DRAFT (never submitted)."
            - "Edition 2027 PUBLISHED with one element."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - call: "POST /accreditation/health-plans/${plan_id}/applications"
              payload: { product_line_scope_id: "${scope_id}", standards_edition_id: "${edition_id}", review_period_start: "2025-01-01T00:00:00Z", review_period_end: "2025-12-31T23:59:59Z" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { app_a2: $.data.id }
            - call: "POST /accreditation/standards-editions"
              payload: { edition_year: 2027, effective_from: "2027-01-01T00:00:00Z", effective_until: "2028-12-31T23:59:59Z", min_file_sample_per_category: 5, timeliness_threshold: 0.90 }
              as: PlatformAdmin
              captures: { edition_2027: $.data.id }
            - call: "POST /accreditation/standards-editions/${edition_2027}/standard-elements"
              payload: { element_code: "UM-1", category: "UM", max_points: 4, is_must_pass: true, evidence_required_count: 1 }
              as: PlatformAdmin
            - call: "POST /accreditation/standards-editions/${edition_2027}/publish"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /accreditation/standards-editions/${edition_id}/supersede"
              payload: { superseded_by_edition_id: "${edition_2027}" }
              as: PlatformAdmin
          assert:
            - "StandardsEdition.${edition_id}.status == SUPERSEDED"
            - "AccreditationApplication.${app_a2}.status == WITHDRAWN (cascade hop 2, caused by the supersession)"
            - "DRAFT applications carry no evidence; the evidence-voiding hop (withdrawal voids SUBMITTED EvidenceItems) is exercised by the withdraw_cascade_evidence_voiding instance on a SUBMITTED application"
            - "StandardsEdition.${edition_2027}.status == PUBLISHED (unchanged)"

      - name: withdraw_cascade_evidence_voiding
        grounds:
          - state_machines.AccreditationApplication.SUBMITTED_to_WITHDRAWN
          - state_machines.EvidenceItem.SUBMITTED_to_VOIDED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST withdraw): (1)
          application SUBMITTED -> WITHDRAWN; (2) the withdrawal voids every
          SUBMITTED EvidenceItem of that application. The second hop is caused
          by the application's transition, not by the withdraw call directly.
        test_recipe:
          setup:
            - "Application in SUBMITTED carrying one SUBMITTED EvidenceItem on UM-1 (evidence creation is allowed in SUBMITTED and EVIDENCE_REVIEW)."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_vw: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM policy pre-review", expected_application_version: "${app_vw}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev_wd: $.data.id }
          trigger:
            - call: "POST /accreditation/applications/${app_id}/withdraw"
              payload: {}
              as: PlanCoordinator
              as_user_id: "${plan_id}"
          assert:
            - "AccreditationApplication.${app_id}.status == WITHDRAWN"
            - "EvidenceItem.${ev_wd}.status == VOIDED (cascade hop 2)"
            - "a second POST withdraw returns 409 ERR_APPLICATION_INVALID_STATE (WITHDRAWN is terminal)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_temporal_on_session_create
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_SURVEY_INVALID_STATE
          - errors.ERR_SURVEYOR_SESSION_OVERLAP
        distinguishing_aspect: |
          Error-category pair (state vs business_temporal): creating a session
          on a CANCELLED survey whose time interval also overlaps an existing
          session of the same surveyor must return 409
          ERR_SURVEY_INVALID_STATE (priority 7), never
          ERR_SURVEYOR_SESSION_OVERLAP (priority 10).
        test_recipe:
          setup:
            - "Base chain with a FULL survey; surveyor has a SCHEDULED session 540-660 on 2026-10-05 on another survey of the same application... note second survey creation would violate survey date overlap only at confirm; here one survey holds session S1, survey is then cancelled."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_acc1
            - *b_acc2
            - *b_advance
            - *b_appv5
            - *b_survey
            - *b_surveyor
            - *b_session
            - call: "POST /accreditation/surveys/${survey_id}/cancel"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 600, end_minute: 700, is_onsite: false }
              as: AccreditationOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_SURVEY_INVALID_STATE"
            - "error_id != ERR_SURVEYOR_SESSION_OVERLAP (state check at priority 7 precedes temporal check at priority 10)"

      - name: temporal_beats_constraint_on_case_create
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors.ERR_CASE_OUTSIDE_REVIEW_PERIOD
          - errors.ERR_INVALID_TURNAROUND_DAYS
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_constraint):
          adding a case whose service_date is outside the review period AND
          whose required_turnaround_days is 0 must return 422
          ERR_CASE_OUTSIDE_REVIEW_PERIOD (priority 10), never
          ERR_INVALID_TURNAROUND_DAYS (priority 11).
        test_recipe:
          setup:
            - "Base chain to EVIDENCE_REVIEW with an OPEN DENIAL sample."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_sample
          trigger:
            - call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "BAD-1", service_date: "2024-06-01T00:00:00Z", decision_date: "2024-06-10T00:00:00Z", resolution_date: "2024-06-10T00:00:00Z", required_turnaround_days: 0 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "response status == 422 and error_id == ERR_CASE_OUTSIDE_REVIEW_PERIOD"
            - "error_id != ERR_INVALID_TURNAROUND_DAYS (temporal check at priority 10 precedes constraint check at priority 11)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: timeliness_rate_exactly_at_threshold_passes
        grounds:
          - calculations.sample_timeliness_rate
          - errors.ERR_SAMPLE_SIZE_BELOW_MINIMUM
        distinguishing_aspect: |
          Boundary on the timeliness_rate metric via the score endpoint:
          9 timely of 10 gives exactly 0.9000 and the comparison is >=, so
          must_pass_threshold_breached stays false; a second sample at 0.8000
          breaches. The two samples sit one timely case apart.
        test_recipe:
          setup:
            - "Base chain to EVIDENCE_REVIEW with two DENIAL samples: sample_pass (10 cases, 9 timely) and sample_fail (5 cases, 4 timely)."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_sample
            - *b_case1
            - *b_case2
            - *b_case3
            - *b_case4
            - *b_case5
            - call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-06", service_date: "2025-07-01T00:00:00Z", decision_date: "2025-07-15T00:00:00Z", resolution_date: "2025-07-15T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
