      - name: auto_substantiation_ceiling_boundary_2500_inclusive_versus_2501
        grounds:
          - calculations.card_transaction_auto_substantiation
          - calculations.card_transaction_auto_substantiation.constants.AUTO_SUBSTANTIATION_CEILING_CENTS
          - endpoints.POST_/benefits/card-transactions
          - state_machines.CardTransaction
          - entities.CardTransaction.fields.substantiation_status
        distinguishing_aspect: |
          METRIC: transaction amount in cents (money, not a headcount). ENDPOINT: POST
          /benefits/card-transactions (not the assessment endpoint of instance 1). The ceiling
          comparison is `amount_cents <= 2500`, so exactly 2500 must land in AUTO_SUBSTANTIATED with
          no document required while 2501 - one cent more - must land in PENDING_DOCS. Both post
          spend, so the ledger must move identically in both cases; only the status differs.
        test_recipe:
          setup:
            - "Employer 'Chicago Transit Card Co' is ACTIVE in the non-covered region US-IL-CHI with transit_group_limit_cents 30000, pretax_ratio_cap_pct 100 and program_cap_cents 5000000."
            - "One TRANSIT_PASS category with monthly_exclusion_limit_cents 30000 exists."
            - "One employee holds a TRANSIT_PASS BenefitAccount with no opening balance."
            - "ElectionWindow 2026-08 [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) took a pretax 10000 election and was LOCKED, so the election is FUNDED and the account holds available_balance_cents 10000 - comfortably above the 5001 cents the two swipes will consume."
            - "The clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Chicago Transit Card Co", region_code: "US-IL-CHI", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, pretax_ratio_cap_pct: 100, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "CHI-CEIL-1", work_region_code: "US-IL-CHI", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 10000, posttax_amount_cents: 0, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
              captures: { el_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /benefits/card-transactions"
              payload: { election_id: "${el_id}", amount_cents: 2500, merchant_category_code: 4111, merchant_name: "CTA VENTRA RELOAD", transaction_at: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
              captures: { at_ceiling_status: $.data.substantiation_status, at_ceiling_posted: $.data.posted_spend_cents, txn_lo_id: $.data.id }
            - call: "POST /benefits/card-transactions"
              payload: { election_id: "${el_id}", amount_cents: 2501, merchant_category_code: 4111, merchant_name: "CTA VENTRA RELOAD", transaction_at: "2026-08-04T08:00:00Z" }
              as: ProgramAdmin
              captures: { over_ceiling_status: $.data.substantiation_status, over_ceiling_posted: $.data.posted_spend_cents, txn_hi_id: $.data.id }
          assert:
            - "${at_ceiling_status} == AUTO_SUBSTANTIATED"
            - "${at_ceiling_posted} == 2500"
            - "${over_ceiling_status} == PENDING_DOCS"
            - "${over_ceiling_posted} == 2501"
            - "CardTransaction.${txn_lo_id}.reopen_count == 0"
            - "CardTransaction.${txn_hi_id}.reopen_count == 0"
            - "BenefitAccount.${acct_id}.spent_cents == 5001"
            - "BenefitAccount.${acct_id}.available_balance_cents == 4999"
            - "BenefitAccount.${acct_id}.ledger_entry_count == 3"
            - "the account has exactly two SPEND ledger entries, -2500 then -2501, with balance_after_cents 7500 then 4999"

      - name: line_surcharge_round_half_up_boundary_exact_half_cent_versus_just_below
        grounds:
          - calculations.order_batch_invoice_total
          - calculations.order_batch_invoice_total.precision
          - endpoints.POST_/benefits/order-batches/{batch_id}/seal
          - entities.MediaOrder.fields.line_surcharge_cents
          - entities.OrderBatch.fields.subtotal_cents
        distinguishing_aspect: |
          METRIC: sub-cent rounding of a regional surcharge (a precision boundary, not a threshold
          count and not a money ceiling). ENDPOINT: POST /benefits/order-batches/{batch_id}/seal - a
          third distinct endpoint. In US-TX-AUS at 2.5%, a 1020-cent line yields exactly 25.5 and
          MUST round UP to 26 under round_half_up, while a 1019-cent line yields 25.475 and MUST
          round DOWN to 25. Banker's rounding would give 25 for the first line and a subtotal of
          2089 instead of 2090.
        test_recipe:
          setup:
            - "Employer 'Austin Precision Passes' is ACTIVE in US-TX-AUS (REGION_SURCHARGE_PCT 2.5) with transit_group_limit_cents 30000, pretax_ratio_cap_pct 100 and program_cap_cents 5000000."
            - "One TRANSIT_PASS category with monthly_exclusion_limit_cents 30000 exists."
            - "Two ACTIVE US-TX-AUS TRANSIT_PASS products exist: sku AUS-HALF at unit_price_cents 1020 and sku AUS-UNDER at unit_price_cents 1019."
            - "TWO different employees each hold a TRANSIT_PASS BenefitAccount and each has a PENDING election in the same OPEN ElectionWindow 2026-08 [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) - two employees rather than two elections for one employee, so no supersede-cancel can remove a batch line."
            - "Both media orders (quantity 1 each) sit in the SAME OPEN OrderBatch for region US-TX-AUS, so line_count is 2 and the bulk discount tier is the 0.0% tier."
            - "The clock is at its 2026-08-01T00:00:00Z default, strictly before the cutoff."
