# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3344_site_fuel_cell_power_purchase_availability_guarantee
#
# Breadth probe over every testable claim SCAFFOLD.yaml §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. Every instance is also a §1.5 reachability audit: each
# setup_api_calls chain drives empty-DB into its stated precondition.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: site_create_returns_every_declared_field_and_starts_fueled
        claim_type: Creation
        grounds:
          - entities.Site
          - endpoints.POST_/power/sites
        distinguishing_aspect: "A site created with only its declared input fields comes back 201 with status SITE_ACTIVE, lifecycle_state RESOURCE_AVAILABLE, version 1, initial_fuel_inventory_therms 100000 and draw_position_therms equal to it — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
          trigger:
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Site.${site_id}.status == SITE_ACTIVE"
            - "Site.${site_id}.lifecycle_state == RESOURCE_AVAILABLE"
            - "Site.${site_id}.version == 1"
            - "Site.${site_id}.initial_fuel_inventory_therms == 100000"
            - "Site.${site_id}.draw_position_therms == 100000 and Site.${site_id}.clearance_zone_used == 0.0"

      - name: site_get_round_trips_every_configuration_field
        claim_type: Retrieval
        grounds:
          - entities.Site
          - endpoints.GET_/power/sites/{id}
        distinguishing_aspect: "Every declared Site configuration field round-trips through GET unchanged, including interconnect_exit_fee_cents_per_kw and footprint_sqm, and the computed aggregates are present rather than null."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site created with the full configuration."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /power/sites/${site_id}"
              payload: {}
              as: SiteOperator
              captures: { get_name: $.data.name, get_exit: $.data.interconnect_exit_fee_cents_per_kw }
          assert:
            - "the response status is 200 and response_type is object"
            - "Site.${site_id}.name == \"Gabilan Valley Cooling\" and utility_territory == PGE_CA"
            - "Site.${site_id}.interconnect_exit_fee_cents_per_kw == 95.0"
            - "Site.${site_id}.committed_feedstock_therms == 0 and Site.${site_id}.contracted_purchase_cents == 0"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: ppa_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - entities.Ppa
          - endpoints.GET_/power/ppas
        distinguishing_aspect: "A filtered list honours limit/offset and reports total_count and has_more consistently: two PPAs on the same site return total_count 2, has_more false at limit 10 and total_count 2, has_more true at limit 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site with two drafted PPAs against two customers."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Gabilan Growers Coop", industry_code: "111219", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust1_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Gabilan Cold Storage LLC", industry_code: "493120", credit_tier: "CREDIT_PRIME" }
              as: CustomerService
              captures: { cust2_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust1_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust2_id}", term_years: 10, contracted_kw: 300, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 1944000, tariff_base_cents_per_kwh: 11.50, escalator_pct: 0.02, fuel_adder_cents_per_therm: 2.20, guaranteed_availability_pct: 0.96, guaranteed_delivery_kwh: 1944000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 15000 }
              as: SiteOperator
          trigger:
            - call: "GET /power/ppas?site_id=${site_id}&limit=1&offset=0"
              payload: {}
              as: SiteOperator
              captures: { first_page: $.data.0.id }
          assert:
            - "the response status is 200 and response_type is array"
            - "the page carries total_count == 2 and has_more == true at limit 1"
            - "the page carries exactly one element"
            - "a second call at offset 1 returns the other PPA and has_more == false"

      - name: software_paa_get_with_unknown_id_returns_ppa_not_found
        claim_type: Not Found
        grounds:
          - entities.Ppa
          - errors[ERR_PPA_NOT_FOUND]
          - endpoints.GET_/power/ppas/{id}
        distinguishing_aspect: "A well-formed but unknown PPA id returns 404 with ERR_PPA_NOT_FOUND rather than an empty object, and the same id under a site that owns no such PPA returns the same error."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site exists; no PPAs."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /power/ppas/${site_id}"
              payload: {}
              as: SiteOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == ERR_PPA_NOT_FOUND"
            - "the response carries no data object with a state field"
            - "GET /power/ppas/${site_id}/ppas returns an empty array, not an error"

      - name: ppa_create_missing_term_years_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Ppa.fields.term_years
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/power/ppas
        distinguishing_aspect: "Omitting the required term_years on a PPA create returns 400 with ERR_INVALID_REQUEST and creates no row, while the identical payload with term_years present returns 201."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site and one customer exist."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Gabilan Growers Coop", industry_code: "111219", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /power/ppas?site_id=${site_id} returns total_count == 0"

      - name: site_create_defaults_apply_when_computed_fields_are_omitted
        claim_type: Defaults
        grounds:
          - entities.Site.fields.status
          - entities.Site.fields.active_ppa_count
          - endpoints.POST_/power/sites
        distinguishing_aspect: "Omitting every computed field leaves the declared defaults in place: status SITE_ACTIVE, active_ppa_count 0 and lifetime_customer_billable_cents 0, never null."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
          trigger:
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
          assert:
            - "Site.${site_id}.status == SITE_ACTIVE"
            - "Site.${site_id}.active_ppa_count == 0"
            - "Site.${site_id}.lifetime_customer_billable_cents == 0 and Site.${site_id}.lifetime_availability_credit_cents == 0"
            - "Site.${site_id}.lifetime_settle_reconcile_count == 0 and Site.${site_id}.reserved_capacity_hold_count == 0"

      - name: site_contracted_kw_is_derived_from_ppas_and_not_echoed
        claim_type: Computed Fields
        grounds:
          - entities.Site.fields.total_contracted_kw
          - entities.Site.fields.contracted_purchase_cents
          - endpoints.POST_/power/sites
        distinguishing_aspect: "A total_contracted_kw posted as 999 on the site create is ignored — the field is derived, so it reads 0 with no PPAs and 500 after one 500 kW PPA is drafted."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
          trigger:
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
          assert:
            - "Site.${site_id}.total_contracted_kw == 0 despite the site being created with no PPA"
            - "Site.${site_id}.committed_feedstock_therms == 0.0"
            - "after one 500 kW draft PPA is created, GET /power/sites/${site_id} reports total_contracted_kw == 500 and contracted_purchase_cents == 800000"

      - name: transition_ledger_is_append_only_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PpaTransition
          - endpoints.GET_/power/ppa-transitions/{id}
        distinguishing_aspect: "PpaTransition is declared common_fields false, so its records carry id and created_at only — no version and no update path — and a transition recorded cannot be edited through any declared endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site with one PPA activated, producing one transition record."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Gabilan Growers Coop", industry_code: "111219", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
          trigger:
            - call: "GET /power/ppas/${ppa_id}/transitions"
              payload: {}
              as: SiteOperator
              captures: { trans_id: $.data.0.id, trans_from: $.data.0.from_state, trans_to: $.data.0.to_state }
          assert:
            - "the list carries exactly one record with from_state PPA_DRAFT and to_state PPA_ACTIVE"
            - "the record carries an id and a created_at"
            - "the record carries no version field"
            - "Ppa.${ppa_id}.state == PPA_ACTIVE and PpaTransition.${trans_id}.transition_reversed == false"

      - name: ppa_site_parent_mismatch_returns_ppa_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Ppa.fields.site_id
          - errors[ERR_PPA_NOT_FOUND]
          - endpoints.POST_/power/ppas
        distinguishing_aspect: "A PPA naming a site_id that does not exist returns 404 with ERR_SITE_NOT_FOUND, and a settlement line addressed through the wrong parent PPA returns ERR_PPA_NOT_FOUND rather than operating on the sibling contract."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. Two sites, each with one drafted PPA."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_a_id: $.data.id }
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Packing", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_b_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Gabilan Growers Coop", industry_code: "111219", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_a_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_a_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_b_id}", customer_id: "${cust_id}", term_years: 10, contracted_kw: 300, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 1944000, tariff_base_cents_per_kwh: 11.50, escalator_pct: 0.02, fuel_adder_cents_per_therm: 2.20, guaranteed_availability_pct: 0.96, guaranteed_delivery_kwh: 1944000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 15000 }
              as: SiteOperator
              captures: { ppa_b_id: $.data.id }
          trigger:
            - call: "POST /power/ppas"
              payload: { site_id: "${ppa_a_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == ERR_SITE_NOT_FOUND"
            - "GET /power/sites/${site_a_id}/ppas returns exactly one PPA and GET /power/sites/${site_b_id}/ppas returns exactly one"
            - "GET /power/customers/${cust_id}/ppas returns both PPAs"

      - name: flat_topology_exposes_fk_reverse_lookups_both_ways
        claim_type: Parent Relationships
        grounds:
          - entities.FuelDelivery.fields.site_id
          - entities.FuelDelivery.fields.selected_ppa_id
          - endpoints.GET_/power/sites/{id}/fuel-deliveries
        distinguishing_aspect: "The flat FK topology is queryable from both ends: a delivery created under a site is discoverable through the site's nested list and through the contract's own fuel-deliveries list, so no child is reachable only by guessing its id."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site with one drafted PPA and one scheduled delivery."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Gabilan Valley Cooling", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /power/customers"
              payload: { name: "Gabilan Growers Coop", industry_code: "111219", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
