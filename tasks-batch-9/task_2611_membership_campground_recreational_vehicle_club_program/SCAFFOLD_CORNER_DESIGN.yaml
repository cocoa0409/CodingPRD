      - name: transient_stay_charge_precision_is_pinned_to_per_night_rounding
        claim_type: precision
        grounds:
          - calculations.transient_stay_charge
          - calculations.transient_stay_charge.constants.RESORT_FEE_PCT
        distinguishing_aspect: "The declared rounding order (round each night, then sum, then round the resort fee once) is the whole content of the precision claim for this calculation."
        excluded_because:
          difficulty_instance: combinatorial_formula / transient_stay_charge_rounds_each_night_then_sums
          rationale: "§1.8 already pins the per-night 9626 against the sum-then-round 19251 alternative and re-rounds the resort fee once, which is exactly the precision row for transient_stay_charge; a second recipe would replay the same arithmetic."
      - name: transient_stay_charge_peak_and_weekend_constants_are_applied
        claim_type: constants_applied
        grounds:
          - calculations.transient_stay_charge.constants.PEAK_MULTIPLIER
          - calculations.transient_stay_charge.constants.WEEKEND_MULTIPLIER
          - calculations.transient_stay_charge.constants.CLASS_NIGHT_RATE_CENTS
        distinguishing_aspect: "Whether PEAK_MULTIPLIER and WEEKEND_MULTIPLIER both apply to a peak-season Friday night, and neither applies outside their windows."
        excluded_because:
          difficulty_instance: combinatorial_formula / transient_stay_charge_rounds_each_night_then_sums
          rationale: "The §1.8 recipe books a stay that straddles the peak window edge and both weekend days, so each constant is exercised in both its applied and its unapplied form inside one stay."
      - name: entitlement_ledger_running_total_after_debit_and_after_credit
        claim_type: aggregation
        grounds:
          - calculations.entitlement_nights_charge
          - entities.Membership.fields.annual_nights_used
        distinguishing_aspect: "The aggregation row's add-then-reverse expectation: the running counter must return to its prior value after a credit, with no drift."
        excluded_because:
          difficulty_instance: compensating_invariant / entitlement_night_ledger_returns_to_zero_after_cancellation_and_rebooking_does_not_double_debit
          rationale: "§1.8 walks the counter up on confirmation, back to zero on cancellation and up again on a re-book, which is the running-total-after-add and after-reversal claim in full."
      - name: consecutive_run_interval_merge_across_a_one_night_gap
        claim_type: interval_merge
        grounds:
          - calculations.consecutive_occupancy_nights
          - calculations.consecutive_occupancy_nights.constants.LINK_GAP_NIGHTS
        distinguishing_aspect: "Adjacent and LINK_GAP_NIGHTS-separated stays merge into one run while a wider gap starts a new one."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / membership_stay_run_merges_across_a_one_night_gap_that_out_and_back_already_allows
          rationale: "§1.8 tests the merge at gap 1 (merged) and gap 2 (separate runs) at the same park for the same membership, covering the merged / adjacent / disjoint triple."
      - name: capital_priority_weighted_scoring_re_scores_when_the_compliance_weight_changes
        claim_type: weighted_scoring
        grounds:
          - calculations.capital_priority_score
          - calculations.capital_priority_score.constants.CATEGORY_WEIGHTS
        distinguishing_aspect: "The weighted_scoring row's weight-change-re-scores expectation for an already-scored project."
        excluded_because:
          difficulty_instance: transitive_cascade / maintenance_activation_cascades_park_hold_to_forced_cancellations_to_probation_to_capital_rescore
          rationale: "§1.8 drives the park from COMPLIANT to PROBATION and asserts the stored priority_score moves 3600 -> 4140 for the same project, which is the weight-change re-score claim."
      - name: park_rating_variant_divergence_lifetime_versus_trailing_window
        claim_type: variant_divergence
        grounds:
          - calculations.park_rating_score
          - calculations.park_rating_score.constants.TRAILING_WINDOW_DAYS
        distinguishing_aspect: "One survey set, two variants, two different numbers, and the delta between them."
        excluded_because:
          difficulty_instance: dual_variant_calc / park_rating_lifetime_decay_vs_trailing_window_mean_divergence
          rationale: "§1.8 reads 3.19 from the stored lifetime variant and 2.10 from the trailing variant off the same two surveys, including the empty-window fallback."
      - name: entitlement_variant_selection_provisional_at_confirmation_then_final_at_checkout
        claim_type: variant_selection
        grounds:
          - calculations.entitlement_nights_charge
          - entities.Reservation.fields.entitlement_nights_charged
        distinguishing_aspect: "Which variant runs in which context: the provisional charge at confirmation and every extension, the final charge only on check-out."
        excluded_because:
          difficulty_instance: dual_variant_calc / entitlement_nights_provisional_at_confirmation_vs_final_at_checkout
          rationale: "§1.8 asserts the provisional debit at confirmation and the recomputed final debit at check-out on the same reservation, so the context-selection claim is already covered."
      - name: entitlement_reconciliation_delta_credited_when_the_variant_switches
        claim_type: reconciliation
        grounds:
          - calculations.entitlement_nights_charge
          - endpoints["POST /reservations/{id}/check-out"]
        distinguishing_aspect: "The size and direction of the ledger delta applied at the provisional-to-final switch on an early departure."
        excluded_because:
          difficulty_instance: dual_variant_calc / entitlement_nights_provisional_at_confirmation_vs_final_at_checkout
          rationale: "The same §1.8 recipe checks out early and asserts the exact number of nights credited back to nights_used_class_* and annual_nights_used, which is the reconciliation row."
  - section: validations
    instances:
      - name: resale_permission_at_priority_thirty_seven_outranks_the_resale_hold_at_thirty_eight
        claim_type: priority_ordering
        grounds:
          - validations[priority=37]
          - validations[priority=38]
