            - { call: "GET /programs/${prog_id}", payload: {}, as: LogisticsOfficer, as_user_id: "log-user-1", captures: { pv2: $.data.version } }
            - { call: "POST /equipment-issuances", payload: { trainee_id: "${t1_id}", kit_type: "RADIO_KIT", expected_program_version: "${pv2}" }, as: LogisticsOfficer, as_user_id: "log-user-1", captures: { iss2_id: $.data.id } }
