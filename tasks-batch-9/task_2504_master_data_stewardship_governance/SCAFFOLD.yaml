scenario: |
  Generate task harder than expert level!

  2504. Master Data Stewardship & Governance (enterprise data governance office): domain definition across customer, product, vendor and location with authoritative source designation, data steward assignment with accountability for quality rules and issue resolution, match and merge rules for duplicate resolution with survivorship logic across sources, data quality rule definition with thresholds, scorecards and remediation workflows, change request process for reference data and hierarchies with approval routing, downstream consumer impact assessment before structural changes with notification lead times, data lineage documentation from source through transformation to reporting, access and classification policy with sensitive data handling requirements
domain_name: master-data-stewardship-governance
api_prefix: /mdm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Domain, SourceSystem and Steward are peer registries wired together by
  # many-to-many junctions (SourceRegistration, StewardAssignment) and by a
  # self-referential supersede edge on MasterRecord. No URL nesting beyond
  # action sub-paths; every association is expressed as an FK on a junction row.

  state_machine_shape: parallel
  # MasterRecord carries two independent dimensions (curation_status x
  # publication_status); ChangeRequest is branching-with-cycle; MergeProposal is
  # cyclic (REWORK -> PROPOSED); Domain.governance_posture is a derived posture
  # over child QualityFinding rows that gates publish / merge / apply.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The steward who requests a ChangeRequest may not review it; the steward who
  # plans a remediation may not waive it; the steward who proposes a merge may
  # not decide it. GovernanceAdmin owns registry/config operations only and can
  # never make a stewardship decision.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Domain
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: Master data domain being governed
        constraints: "one of CUSTOMER|PRODUCT|VENDOR|LOCATION; unique across Domain"
      - name: name
        type: string
        source: input
        description: Human-readable domain name
        constraints: "1..120 chars"
      - name: status
        type: enum
        source: system
        description: Lifecycle of the domain definition
        default: DRAFT
        constraints: "DRAFT|ACTIVE"
      - name: governance_posture
        type: enum
        source: computed
        description: Derived posture over the domain's open QualityFinding rows and authoritative-source availability; gates publish/merge/apply operations
        default: OPEN
        constraints: "OPEN|RESTRICTED|FROZEN; recomputed by calculations.domain_posture_recompute"
      - name: classification_level
        type: enum
        source: input
        description: Data classification of the domain's master data
        constraints: "PUBLIC|INTERNAL|CONFIDENTIAL|RESTRICTED; rank PUBLIC=1 < INTERNAL=2 < CONFIDENTIAL=3 < RESTRICTED=4"
      - name: sensitive_handling_required
        type: boolean
        source: computed
        description: True iff classification_level IN {CONFIDENTIAL, RESTRICTED}
        default: false
      - name: authoritative_source_code
        type: string
        source: computed
        description: "SourceSystem.code of the SourceRegistration with role=AUTHORITATIVE and status=ACTIVE for this domain; null when none exists. Not an FK declaration - the reverse lookup is GET /mdm/source-registrations?domain_id=&role=AUTHORITATIVE"
        default: null
      - name: notification_lead_days_floor
        type: integer
        source: input
        description: Minimum notification lead days imposed on any impacting change request
        default: 5
        constraints: "0..30"
      - name: expected_attribute_count
        type: integer
        source: input
        description: Number of attribute keys a complete MasterRecord in this domain must carry; denominator of completeness_pct
        default: 5
        constraints: "1..50"
      - name: open_finding_weight
        type: number
        source: computed
        description: Conserved quantity - sum of QualityFinding.severity_weight over findings of this domain with status IN {OPEN, REMEDIATION_PLANNED}
        default: 0
        constraints: "2 decimal places"
      - name: quality_score_provisional
        type: number
        source: computed
        description: Latest PROVISIONAL-basis weighted quality score, 2dp; null before the first PROVISIONAL run
        default: null
      - name: quality_score_certified
        type: number
        source: computed
        description: Latest CERTIFIED-basis weighted quality score, 2dp; null before the first CERTIFIED run
        default: null
      - name: scorecard_run_seq
        type: integer
        source: computed
        description: Monotonic scorecard epoch counter, incremented by one per ScorecardRun on this domain
        default: 0
      - name: reference_data_revision
        type: integer
        source: computed
        description: Incremented by one every time a ChangeRequest on this domain reaches APPLIED
        default: 0
      - name: published_master_record_count
        type: integer
        source: computed
        description: Conserved quantity - count of MasterRecord rows of this domain with publication_status=PUBLISHED
        default: 0
      - name: scheduled_change_count
        type: integer
        source: computed
        description: Conserved quantity - count of ChangeRequest rows of this domain with status=SCHEDULED
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant at which status became ACTIVE; null while DRAFT
        default: null

  - name: SourceSystem
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Short code of the contributing system
        constraints: "1..30 chars; unique across SourceSystem"
      - name: name
        type: string
        source: input
        description: Human-readable system name
      - name: trust_tier
        type: integer
        source: input
        description: Curation trust tier used by survivorship scoring
        constraints: "1..5; 5 = most trusted"
      - name: status
        type: enum
        source: system
        description: Certification lifecycle of the source system
        default: REGISTERED
        constraints: "REGISTERED|CERTIFIED|DECERTIFIED"
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; null until certified
        default: null
      - name: decertified_at
        type: datetime
        source: system
        description: Logical-clock instant of decertification; null unless DECERTIFIED
        default: null
      - name: decertification_reason
        type: string
        source: input
        description: Reason captured on decertification; null unless DECERTIFIED
        default: null

  - name: Steward
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Steward full name
      - name: email
        type: string
        source: input
        description: Steward email
        constraints: "unique across Steward"
      - name: certification_level
        type: enum
        source: input
        description: Stewardship certification level; PRINCIPAL is required to own a CRITICAL-severity quality rule
        constraints: "JUNIOR|SENIOR|PRINCIPAL"
      - name: open_finding_load
        type: integer
        source: computed
        description: Conserved quantity - count of QualityFinding rows where assigned_steward_id = this steward and status = REMEDIATION_PLANNED
        default: 0

  - name: SourceRegistration
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the domain this source is registered against
      - name: source_system_id
        type: string
        source: input
        description: FK -> SourceSystem.id; the registered source system
      - name: role
        type: enum
        source: input
        description: Designated role of the source for this domain
        constraints: "AUTHORITATIVE|CONTRIBUTING|CONSUMING"
      - name: trust_rank
        type: integer
        source: input
        description: Domain-local precedence rank of this registration
        constraints: "1..10; 1 = highest precedence"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the registration interval
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the registration interval; null means open-ended
        default: null
      - name: status
        type: enum
        source: system
        description: Registration lifecycle
        default: ACTIVE
        constraints: "ACTIVE|SUPERSEDED|REVOKED"
      - name: superseded_at
        type: datetime
        source: system
        description: Logical-clock instant at which a newer AUTHORITATIVE registration superseded this one
        default: null
      - name: revoked_reason
        type: string
        source: system
        description: Reason string written by the source-decertification cascade
        default: null

  - name: StewardAssignment
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the domain the steward is accountable for
      - name: steward_id
        type: string
        source: input
        description: FK -> Steward.id; the accountable steward
      - name: steward_role
        type: enum
        source: input
        description: Accountability role held on the domain
        constraints: "DATA_OWNER|DATA_STEWARD|CUSTODIAN"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the accountability interval
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the accountability interval; null means open-ended
        default: null
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle
        default: ACTIVE
        constraints: "ACTIVE|SUPERSEDED"
      - name: superseded_at
        type: datetime
        source: system
        description: Logical-clock instant at which an incoming assignment superseded this one
        default: null

  - name: QualityRule
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the domain the rule scores
      - name: owner_steward_id
        type: string
        source: input
        description: FK -> Steward.id; steward accountable for this rule and its findings
      - name: rule_code
        type: string
        source: input
        description: Rule code, ascending lexicographic order of which pins finding-creation order within a scorecard run
        constraints: "1..20 chars; unique per domain_id"
      - name: dimension
        type: enum
        source: input
        description: Data-quality dimension measured
        constraints: "COMPLETENESS|VALIDITY|UNIQUENESS|TIMELINESS|CONSISTENCY"
      - name: weight_points
        type: integer
        source: input
        description: Scorecard weight of this rule in points
        constraints: "1..100; sum of weight_points over status=ACTIVE rules of a domain must be <= 100"
      - name: threshold_pct
        type: number
        source: input
        description: Pass threshold; measured_pct >= threshold_pct earns full weight_points
        constraints: "0.00..100.00, 2 decimal places"
      - name: severity
        type: enum
        source: input
        description: Finding severity produced when the rule fails; CRITICAL requires owner certification_level = PRINCIPAL
        constraints: "LOW|MEDIUM|HIGH|CRITICAL"
      - name: status
        type: enum
        source: system
        description: Rule lifecycle; only ACTIVE rules are evaluated by a scorecard run
        default: ACTIVE
        constraints: "ACTIVE|RETIRED"

  - name: ScorecardRun
    parent: Domain
    common_fields: false
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the scored domain
      - name: run_seq
        type: integer
        source: computed
        description: Value of Domain.scorecard_run_seq after this run was recorded
      - name: basis
        type: enum
        source: input
        description: Scoring basis selecting the calculation variant
        constraints: "PROVISIONAL|CERTIFIED"
      - name: measured_at
        type: datetime
        source: system
        description: Logical-clock instant of the run
      - name: weighted_score
        type: number
        source: computed
        description: Weighted quality score for this run, 2dp, per calculations.domain_quality_scorecard
      - name: rules_evaluated_count
        type: integer
        source: computed
        description: Number of QualityRule rows entering the denominator of this run
      - name: rules_failed_count
        type: integer
        source: computed
        description: Number of evaluated rules whose measured_pct < threshold_pct
      - name: findings_created_count
        type: integer
        source: computed
        description: Number of new QualityFinding rows this run created (deduped against already-open findings)
      - name: posture_before
        type: enum
        source: computed
        description: Domain.governance_posture read at the instant the run started; pins the posture multiplier for every finding created by this run
        constraints: "OPEN|RESTRICTED|FROZEN"
      - name: posture_after
        type: enum
        source: computed
        description: Domain.governance_posture after the single end-of-run recompute
        constraints: "OPEN|RESTRICTED|FROZEN"
      - name: posture_multiplier_applied
        type: number
        source: computed
        description: Multiplier derived from posture_before and applied to every finding created by this run
        constraints: "1.00|1.25|1.50"

  - name: QualityFinding
    parent: ScorecardRun
    common_fields: true
    fields:
      - name: scorecard_run_id
        type: string
        source: system
        description: FK -> ScorecardRun.id; the run that opened this finding
      - name: quality_rule_id
        type: string
        source: system
        description: FK -> QualityRule.id; the breached rule (its domain_id identifies the owning domain)
      - name: status
        type: enum
        source: system
        description: Remediation workflow state
        default: OPEN
        constraints: "OPEN|REMEDIATION_PLANNED|RESOLVED|WAIVED"
      - name: severity_weight
        type: number
        source: computed
        description: Weight contributed to Domain.open_finding_weight; pinned at creation from the rule severity and the run's posture_multiplier_applied, never recomputed afterwards
        constraints: "2 decimal places"
      - name: measured_pct
        type: number
        source: system
        description: Most recent measured percentage supplied for the breached rule
      - name: gap_pct
        type: number
        source: computed
        description: round(QualityRule.threshold_pct - measured_pct, 2); refreshed whenever measured_pct is refreshed
      - name: assigned_steward_id
        type: string
        source: input
        description: FK -> Steward.id; steward assigned to remediate; null while OPEN
        default: null
      - name: planned_by_steward_id
        type: string
        source: system
        description: FK -> Steward.id; steward who planned the remediation; null while OPEN
        default: null
      - name: waived_by_steward_id
        type: string
        source: system
        description: FK -> Steward.id; data owner who waived the finding; null unless WAIVED
        default: null
      - name: due_at
        type: datetime
        source: input
        description: Remediation due instant; null while OPEN
        default: null
      - name: plan_note
        type: string
        source: input
        description: Remediation plan note
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Resolution note captured on resolve
        default: null
      - name: waiver_justification
        type: string
        source: input
        description: Waiver justification captured on waive
        default: null
      - name: opened_at
        type: datetime
        source: system
        description: Logical-clock instant at which the finding was opened
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of RESOLVED or WAIVED
        default: null

  - name: MasterRecord
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the domain this golden-record candidate belongs to
      - name: source_system_id
        type: string
        source: input
        description: FK -> SourceSystem.id; contributing source of this record
      - name: natural_key
        type: string
        source: input
        description: Business key of the record within the domain
        constraints: "1..60 chars; unique per (domain_id, source_system_id)"
      - name: attributes
        type: object
        source: input
        description: Flat map of attribute key to string value; null values count as missing
      - name: completeness_pct
        type: number
        source: computed
        description: round(100 * count(non-null keys in attributes) / Domain.expected_attribute_count, 2), capped at 100.00
      - name: last_verified_at
        type: datetime
        source: input
        description: Instant the record was last verified against its source; drives the recency component of survivorship_score
      - name: curation_status
        type: enum
        source: system
        description: Curation dimension of this record's parallel state machine
        default: CANDIDATE
        constraints: "CANDIDATE|CURATED|MERGED_AWAY|QUARANTINED"
      - name: publication_status
        type: enum
        source: system
        description: Publication dimension of this record's parallel state machine
        default: UNPUBLISHED
        constraints: "UNPUBLISHED|PUBLISHED|RETRACTED"
      - name: superseded_by_master_record_id
        type: string
        source: system
        description: FK -> MasterRecord.id; self-referential pointer to the effective survivor set when this record was merged away; null otherwise
        default: null
      - name: survivorship_score
        type: number
        source: computed
        description: Survivorship score per calculations.master_record_survivorship_score, 2dp; recomputed on create, curate, merge
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent publication
        default: null
      - name: quarantine_reason
        type: string
        source: system
        description: Reason written by the source-decertification cascade
        default: null

  - name: MergeProposal
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: computed
        description: FK -> Domain.id; copied from the survivor candidate's domain_id at creation
      - name: survivor_master_record_id
        type: string
        source: input
        description: FK -> MasterRecord.id; survivor proposed by the requester
      - name: duplicate_master_record_id
        type: string
        source: input
        description: FK -> MasterRecord.id; duplicate proposed by the requester
      - name: proposer_steward_id
        type: string
        source: system
        description: FK -> Steward.id; steward who created the proposal (X-User-ID at creation)
      - name: reviewer_steward_id
        type: string
        source: system
        description: FK -> Steward.id; steward who moved the proposal to UNDER_REVIEW; null before review
        default: null
      - name: name_similarity_pct
        type: number
        source: input
        description: Matching-engine name similarity, 2dp
        constraints: "0.00..100.00"
      - name: key_overlap_pct
        type: number
        source: input
        description: Matching-engine identifying-key overlap, 2dp
        constraints: "0.00..100.00"
      - name: match_score
        type: number
        source: computed
        description: Composite match score per calculations.merge_match_score, 2dp
      - name: match_confidence
        type: enum
        source: computed
        description: HIGH iff match_score >= 85.00; MEDIUM iff 60.00 <= match_score < 85.00; LOW iff match_score < 60.00
        constraints: "LOW|MEDIUM|HIGH"
      - name: status
        type: enum
        source: system
        description: Duplicate-resolution workflow state
        default: PROPOSED
        constraints: "PROPOSED|UNDER_REVIEW|MERGED|REJECTED|REWORK"
      - name: effective_survivor_master_record_id
        type: string
        source: computed
        description: FK -> MasterRecord.id; survivor selected by the survivorship policy at MERGE time; null until MERGED
        default: null
      - name: survivor_swapped
        type: boolean
        source: computed
        description: True iff effective_survivor_master_record_id differs from survivor_master_record_id
        default: false
      - name: survivorship_variant
        type: enum
        source: computed
        description: Survivorship variant applied at MERGE time; null until MERGED
        default: null
        constraints: "SOURCE_PRIORITY|SCORE_PRIORITY"
      - name: survivorship_field_map
        type: object
        source: computed
        description: Map of attribute key to the source MasterRecord.natural_key whose value won that key; null until MERGED
        default: null
      - name: rework_count
        type: integer
        source: computed
        description: Number of times this proposal has been rescored out of REWORK
        default: 0
      - name: override_justification
        type: string
        source: input
        description: Data-owner justification allowing a MEDIUM-confidence merge; null otherwise
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the terminal decision
        default: null

  - name: ChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; domain whose reference data or hierarchy changes
      - name: requester_steward_id
        type: string
        source: system
        description: FK -> Steward.id; steward who created the request (X-User-ID at creation)
      - name: reviewer_steward_id
        type: string
        source: system
        description: FK -> Steward.id; data owner who took the request under review; null before review
        default: null
      - name: change_type
        type: enum
        source: input
        description: Kind of change requested
        constraints: "REFERENCE_VALUE_ADD|HIERARCHY_RESTRUCTURE|CLASSIFICATION_UPLIFT"
      - name: structural
        type: boolean
        source: computed
        description: True iff change_type != REFERENCE_VALUE_ADD
      - name: title
        type: string
        source: input
        description: Short request title
      - name: proposed_values
        type: object
        source: input
        description: "Change payload; HIERARCHY_RESTRUCTURE requires keys parent_node_key and child_node_key; CLASSIFICATION_UPLIFT requires key target_classification_level; REFERENCE_VALUE_ADD requires key reference_value"
      - name: status
        type: enum
        source: system
        description: Approval-routing state
        default: DRAFT
        constraints: "DRAFT|SUBMITTED|UNDER_REVIEW|CHANGES_REQUESTED|APPROVED|REJECTED|SCHEDULED|APPLIED|WITHDRAWN"
      - name: impact_consumer_count
        type: integer
        source: computed
        description: Size of the impacted consumer set computed at submit per calculations.change_impact_lead_time
        default: 0
      - name: required_lead_days
        type: integer
        source: computed
        description: Notification lead days required before this change may take effect, computed at submit
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit
        default: null
      - name: earliest_apply_at
        type: datetime
        source: computed
        description: submitted_at + required_lead_days days; null before first submit
        default: null
      - name: scheduled_apply_at
        type: datetime
        source: input
        description: Scheduled effective instant; null until scheduled
        default: null
      - name: freeze_window_start
        type: datetime
        source: computed
        description: Start of the change-calendar freeze window occupied while SCHEDULED; null otherwise
        default: null
      - name: freeze_window_end
        type: datetime
        source: computed
        description: End of the change-calendar freeze window occupied while SCHEDULED; null otherwise
        default: null
      - name: revision_cycle_count
        type: integer
        source: computed
        description: Number of times this request has been resubmitted out of CHANGES_REQUESTED
        default: 0
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock instant at which the change was applied
        default: null
      - name: review_note
        type: string
        source: input
        description: Reviewer note captured on decide
        default: null
      - name: withdraw_reason
        type: string
        source: input
        description: Reason captured on withdraw
        default: null

  - name: ConsumerSubscription
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; domain consumed downstream
      - name: consumer_code
        type: string
        source: input
        description: Downstream consumer code
        constraints: "1..40 chars; unique across ConsumerSubscription"
      - name: reporting_asset_key
        type: string
        source: input
        description: Terminal reporting asset node key; must equal the last node of lineage_path
      - name: clearance_level
        type: enum
        source: input
        description: Consumer clearance; must be >= Domain.classification_level rank to stay ACTIVE
        constraints: "PUBLIC|INTERNAL|CONFIDENTIAL|RESTRICTED"
      - name: criticality
        type: enum
        source: input
        description: Consumer criticality tier; TIER1 consumers are impacted by every change and must acknowledge before apply
        constraints: "TIER1|TIER2|TIER3"
      - name: required_lead_days
        type: integer
        source: input
        description: Notification lead days this consumer requires before a structural change
        constraints: "1..30"
      - name: status
        type: enum
        source: system
        description: Subscription lifecycle
        default: ACTIVE
        constraints: "ACTIVE|SUSPENDED"
      - name: lineage_path
        type: array
        source: input
        description: Ordered node keys from authoritative source through transformations to the reporting asset
        default: []
      - name: lineage_status
        type: enum
        source: computed
        description: Lineage documentation state
        default: UNDOCUMENTED
        constraints: "UNDOCUMENTED|DOCUMENTED|STALE"
      - name: lineage_revision
        type: integer
        source: computed
        description: Domain.reference_data_revision at the instant lineage_path was documented; null while UNDOCUMENTED
        default: null
      - name: lineage_documented_at
        type: datetime
        source: system
        description: Logical-clock instant of lineage documentation
        default: null
      - name: pending_change_request_id
        type: string
        source: system
        description: FK -> ChangeRequest.id; change request this consumer was notified about and has not yet been released from; null when none
        default: null
      - name: notified_at
        type: datetime
        source: system
        description: Logical-clock instant of the pending change notification
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant of the consumer acknowledgement of the pending change
        default: null
      - name: acknowledged_revision
        type: integer
        source: computed
        description: Domain.reference_data_revision at acknowledgement time
        default: null
      - name: suspended_reason
        type: string
        source: system
        description: Reason written by the classification-uplift cascade
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Domain
    initial_state: DRAFT
    terminal_states: []
    note: |
      Parallel dimensions on one row. Dimension A is `status` (DRAFT -> ACTIVE).
      Dimension B is the derived `governance_posture` (OPEN | RESTRICTED |
      FROZEN), recomputed by calculations.domain_posture_recompute after every
      finding-set or authoritative-source mutation. Posture evolves independently
      of status: a DRAFT domain can already be FROZEN, and an ACTIVE domain moves
      between all three postures without any status change.

      VERSION SEMANTICS (binding for every transition below and for every
      endpoint side_effect that says "increment domain.version by 1"):
      Domain.version increments EXACTLY ONCE per HTTP request that mutates the
      domain row or any row the posture/counter recomputation reads - never once
      per declared side effect. A single request that creates a registration,
      flips the posture FROZEN -> OPEN and rewrites authoritative_source_code
      therefore moves version from N to N+1, not to N+3. A request that mutates
      nothing on the domain leaves version untouched. Because cascades make the
      exact number of intervening bumps hard to predict from the client side,
      every OCC write MUST send the value read from an immediately preceding
      GET /mdm/domains/{domain_id}.
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mdm/domains/{domain_id}/activate"
        actor: GovernanceAdmin
        preconditions:
          - "domain.status == DRAFT"
          - "count(QualityRule where domain_id == domain.id and status == ACTIVE) >= 1"
          - "exists StewardAssignment where domain_id == domain.id and steward_role == DATA_OWNER and status == ACTIVE and effective_from <= clock and (effective_to is null or clock < effective_to)"
          - "exists StewardAssignment where domain_id == domain.id and steward_role == DATA_STEWARD and status == ACTIVE and effective_from <= clock and (effective_to is null or clock < effective_to)"
          - "exists SourceRegistration where domain_id == domain.id and role == AUTHORITATIVE and status == ACTIVE and its SourceSystem.status == CERTIFIED"
        side_effects:
          - "domain.status = ACTIVE; domain.activated_at = clock"
          - "recompute domain.governance_posture per calculations.domain_posture_recompute"
          - "increment domain.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "system - end-of-run recompute inside POST /mdm/domains/{domain_id}/scorecard-runs, or finding-set mutation on plan/resolve/waive, or SourceRegistration status change"
        actor: system
        preconditions:
          - "recomputed open_finding_weight >= 15.00 and < 40.00, OR at least one QualityFinding with status IN {OPEN, REMEDIATION_PLANNED} whose QualityRule.severity == CRITICAL"
          - "an ACTIVE AUTHORITATIVE SourceRegistration exists for the domain"
        side_effects:
          - "domain.governance_posture = RESTRICTED"
          - "increment domain.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system - end-of-run recompute inside POST /mdm/domains/{domain_id}/scorecard-runs, or loss of the ACTIVE AUTHORITATIVE SourceRegistration"
        actor: system
        preconditions:
          - "recomputed open_finding_weight >= 40.00, OR no SourceRegistration with role == AUTHORITATIVE and status == ACTIVE exists for the domain"
        side_effects:
          - "domain.governance_posture = FROZEN"
          - "hop 4 of the decertification cascade: every MasterRecord of this domain with publication_status == PUBLISHED becomes publication_status = RETRACTED and curation_status = QUARANTINED with quarantine_reason = 'AUTHORITATIVE_SOURCE_LOST'; domain.published_master_record_count = 0"
          - "hop 5 of the decertification cascade: every ConsumerSubscription of this domain with status == ACTIVE and lineage_status == DOCUMENTED becomes lineage_status = STALE"
          - "increment domain.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system - end-of-run recompute, or resolve/waive of findings, or designation of a new ACTIVE AUTHORITATIVE SourceRegistration"
        actor: system
        preconditions:
          - "an ACTIVE AUTHORITATIVE SourceRegistration exists for the domain"
          - "recomputed open_finding_weight >= 15.00 and < 40.00, OR at least one open CRITICAL-severity finding remains"
        side_effects:
          - "domain.governance_posture = RESTRICTED"
          - "increment domain.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system - finding-set recompute on POST /mdm/quality-findings/{finding_id}/resolve or /waive"
        actor: system
        preconditions:
          - "an ACTIVE AUTHORITATIVE SourceRegistration exists for the domain"
          - "recomputed open_finding_weight < 15.00 and no QualityFinding with status IN {OPEN, REMEDIATION_PLANNED} whose QualityRule.severity == CRITICAL"
        side_effects:
          - "domain.governance_posture = OPEN"
          - "increment domain.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "system - loss of the ACTIVE AUTHORITATIVE SourceRegistration (hop 3 of the decertification cascade)"
        actor: system
        preconditions:
          - "no SourceRegistration with role == AUTHORITATIVE and status == ACTIVE exists for the domain"
        side_effects:
          - "domain.governance_posture = FROZEN; domain.authoritative_source_code = null"
          - "hop 4 of the decertification cascade: every MasterRecord of this domain with publication_status == PUBLISHED becomes publication_status = RETRACTED and curation_status = QUARANTINED with quarantine_reason = 'AUTHORITATIVE_SOURCE_LOST'; domain.published_master_record_count = 0"
          - "hop 5 of the decertification cascade: every ConsumerSubscription of this domain with status == ACTIVE and lineage_status == DOCUMENTED becomes lineage_status = STALE"
          - "increment domain.version by 1"

  - entity: SourceSystem
    initial_state: REGISTERED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: REGISTERED
        to: CERTIFIED
        trigger: "POST /mdm/source-systems/{source_system_id}/certify"
        actor: GovernanceAdmin
        preconditions:
          - "source_system.status == REGISTERED"
        side_effects:
          - "source_system.status = CERTIFIED; certified_at = clock"
          - "for every Domain holding an ACTIVE AUTHORITATIVE SourceRegistration on this system, recompute governance_posture"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /mdm/source-systems/{source_system_id}/decertify"
        actor: GovernanceAdmin
        preconditions:
          - "source_system.status == CERTIFIED"
        side_effects:
          - "hop 1: source_system.status = DECERTIFIED; decertified_at = clock; decertification_reason = payload.reason"
          - "hop 2 (caused by hop 1): every SourceRegistration with source_system_id == this system and status == ACTIVE becomes status = REVOKED with revoked_reason = 'SOURCE_DECERTIFIED'"
          - "hop 3 (caused by hop 2): every Domain that thereby holds no ACTIVE AUTHORITATIVE SourceRegistration sets authoritative_source_code = null and recomputes governance_posture, which yields FROZEN"
          - "hop 4 (caused by hop 3's FROZEN posture): every MasterRecord of those domains with publication_status == PUBLISHED becomes publication_status = RETRACTED and curation_status = QUARANTINED; domain.published_master_record_count = 0"
          - "hop 5 (caused by hop 4's retraction of the published set): every ConsumerSubscription of those domains with status == ACTIVE and lineage_status == DOCUMENTED becomes lineage_status = STALE"

  - entity: SourceRegistration
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    note: "Branching terminal fork with divergent side-effect sets: SUPERSEDED preserves the domain's authoritative pointer (a replacement exists), REVOKED destroys it."
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /mdm/source-registrations (incoming role == AUTHORITATIVE for the same domain)"
        actor: GovernanceAdmin
        preconditions:
          - "registration.status == ACTIVE and registration.role == AUTHORITATIVE"
          - "incoming registration has role == AUTHORITATIVE and the same domain_id"
        side_effects:
          - "registration.status = SUPERSEDED; superseded_at = clock; effective_to = incoming.effective_from"
          - "domain.authoritative_source_code = incoming registration's SourceSystem.code"
          - "recompute domain.governance_posture"
      - from: ACTIVE
        to: REVOKED
        trigger: "system - hop 2 of POST /mdm/source-systems/{source_system_id}/decertify"
        actor: system
        preconditions:
          - "registration.status == ACTIVE"
          - "the registration's SourceSystem transitioned CERTIFIED -> DECERTIFIED in this request"
        side_effects:
          - "registration.status = REVOKED; revoked_reason = 'SOURCE_DECERTIFIED'"
          - "if role == AUTHORITATIVE: domain.authoritative_source_code = null and domain.governance_posture recomputed to FROZEN"

  - entity: StewardAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /mdm/steward-assignments with supersede_incumbent == true"
        actor: GovernanceAdmin
        preconditions:
          - "incumbent.status == ACTIVE and incumbent.effective_to is null"
          - "incumbent.domain_id == incoming.domain_id and incumbent.steward_role == incoming.steward_role"
          - "incumbent.effective_from < incoming.effective_from"
        side_effects:
          - "incumbent.effective_to = incoming.effective_from; incumbent.status = SUPERSEDED; superseded_at = clock"
          - "increment domain.version by 1 (OCC anchor)"

  - entity: QualityRule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "PATCH /mdm/quality-rules/{rule_id} with status == RETIRED"
        actor: DataSteward
        preconditions:
          - "rule.status == ACTIVE"
          - "no QualityFinding on this rule has status IN {OPEN, REMEDIATION_PLANNED}"
        side_effects:
          - "rule.status = RETIRED"
          - "rule leaves the scorecard denominator from the next ScorecardRun onward"

  - entity: QualityFinding
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    note: "Branching fork from OPEN with divergent side-effect sets: the REMEDIATION_PLANNED path charges Steward.open_finding_load, the WAIVED path never does and requires a data owner."
    transitions:
      - from: OPEN
        to: REMEDIATION_PLANNED
        trigger: "POST /mdm/quality-findings/{finding_id}/plan-remediation"
        actor: DataSteward
        preconditions:
          - "finding.status == OPEN"
          - "payload.assigned_steward_id references a Steward holding an ACTIVE StewardAssignment with steward_role IN {DATA_STEWARD, CUSTODIAN, DATA_OWNER} on the finding's domain covering the clock"
          - "payload.due_at > clock"
        side_effects:
          - "finding.status = REMEDIATION_PLANNED; assigned_steward_id, due_at, plan_note stored; planned_by_steward_id = acting X-User-ID"
          - "increment Steward.open_finding_load by 1 for assigned_steward_id"
          - "domain.open_finding_weight unchanged (severity_weight is pinned at creation and the finding stays in the open set)"
      - from: REMEDIATION_PLANNED
        to: RESOLVED
        trigger: "POST /mdm/quality-findings/{finding_id}/resolve"
        actor: DataSteward
        preconditions:
          - "finding.status == REMEDIATION_PLANNED"
          - "payload.verified_measured_pct >= the finding's QualityRule.threshold_pct"
        side_effects:
          - "finding.status = RESOLVED; resolved_at = clock; measured_pct = payload.verified_measured_pct; gap_pct = 0.00; resolution_note stored"
          - "decrement Steward.open_finding_load by 1 for assigned_steward_id"
          - "domain.open_finding_weight recomputed (this finding's severity_weight leaves the sum)"
          - "recompute domain.governance_posture"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /mdm/quality-findings/{finding_id}/resolve"
        actor: DataSteward
        preconditions:
          - "finding.status == OPEN"
          - "payload.verified_measured_pct >= the finding's QualityRule.threshold_pct"
        side_effects:
          - "finding.status = RESOLVED; resolved_at = clock; measured_pct = payload.verified_measured_pct; gap_pct = 0.00"
          - "Steward.open_finding_load unchanged (no assignment was ever charged)"
          - "domain.open_finding_weight recomputed; recompute domain.governance_posture"
      - from: OPEN
        to: WAIVED
        trigger: "POST /mdm/quality-findings/{finding_id}/waive"
        actor: DataOwner
        preconditions:
          - "finding.status IN {OPEN, REMEDIATION_PLANNED}"
          - "acting steward holds an ACTIVE DATA_OWNER StewardAssignment on the finding's domain covering the clock"
          - "acting X-User-ID != finding.planned_by_steward_id"
          - "len(payload.waiver_justification) >= 20"
        side_effects:
          - "finding.status = WAIVED; waived_by_steward_id = acting X-User-ID; resolved_at = clock"
          - "if the finding was REMEDIATION_PLANNED: decrement Steward.open_finding_load by 1 for assigned_steward_id"
          - "domain.open_finding_weight recomputed; recompute domain.governance_posture"
      - from: REMEDIATION_PLANNED
        to: WAIVED
        trigger: "POST /mdm/quality-findings/{finding_id}/waive"
        actor: DataOwner
        preconditions:
          - "finding.status == REMEDIATION_PLANNED"
          - "acting X-User-ID != finding.planned_by_steward_id"
          - "len(payload.waiver_justification) >= 20"
        side_effects:
          - "finding.status = WAIVED; waived_by_steward_id = acting X-User-ID; resolved_at = clock"
          - "decrement Steward.open_finding_load by 1 for assigned_steward_id"
          - "domain.open_finding_weight recomputed; recompute domain.governance_posture"

  - entity: MasterRecord
    initial_state: CANDIDATE
    terminal_states: [MERGED_AWAY]
    note: |
      Parallel dimensions on one row. Dimension A is `curation_status`
      (CANDIDATE -> CURATED -> {MERGED_AWAY | QUARANTINED}, QUARANTINED ->
      CURATED). Dimension B is `publication_status` (UNPUBLISHED -> PUBLISHED ->
      RETRACTED -> PUBLISHED). The dimensions advance independently: publishing
      never changes curation_status, curating never changes publication_status,
      and only MERGED_AWAY / QUARANTINED force a publication retraction.
    transitions:
      - from: CANDIDATE
        to: CURATED
        trigger: "POST /mdm/master-records/{record_id}/curate"
        actor: DataSteward
        preconditions:
          - "record.curation_status == CANDIDATE"
          - "record's SourceSystem.status == CERTIFIED"
        side_effects:
          - "record.curation_status = CURATED; last_verified_at = payload.last_verified_at when supplied"
          - "recompute record.survivorship_score"
      - from: QUARANTINED
        to: CURATED
        trigger: "POST /mdm/master-records/{record_id}/curate"
        actor: DataSteward
        preconditions:
          - "record.curation_status == QUARANTINED"
          - "record's SourceSystem.status == CERTIFIED"
          - "payload.last_verified_at is supplied and > record.last_verified_at"
        side_effects:
          - "record.curation_status = CURATED; quarantine_reason = null; last_verified_at = payload.last_verified_at"
          - "recompute record.survivorship_score"
      - from: CURATED
        to: MERGED_AWAY
        trigger: "system - MERGE decision on POST /mdm/merge-proposals/{proposal_id}/decide"
        actor: system
        preconditions:
          - "record.curation_status == CURATED"
          - "record is the loser of the survivorship selection for the proposal"
        side_effects:
          - "record.curation_status = MERGED_AWAY; superseded_by_master_record_id = effective survivor id"
          - "if record.publication_status == PUBLISHED: publication_status = RETRACTED and domain.published_master_record_count decremented by 1"
      - from: CURATED
        to: QUARANTINED
        trigger: "system - hop 4 of POST /mdm/source-systems/{source_system_id}/decertify"
        actor: system
        preconditions:
          - "record.curation_status == CURATED"
          - "record's domain.governance_posture became FROZEN because the ACTIVE AUTHORITATIVE registration was revoked"
        side_effects:
          - "record.curation_status = QUARANTINED; quarantine_reason = 'AUTHORITATIVE_SOURCE_LOST'"
          - "if publication_status == PUBLISHED: publication_status = RETRACTED"
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /mdm/master-records/{record_id}/publish"
        actor: DataSteward
        preconditions:
          - "record.publication_status IN {UNPUBLISHED, RETRACTED}"
          - "record.curation_status == CURATED"
          - "record's domain.status == ACTIVE and domain.governance_posture == OPEN"
          - "record.completeness_pct >= 60.00"
        side_effects:
          - "record.publication_status = PUBLISHED; published_at = clock"
          - "increment domain.published_master_record_count by 1; increment domain.version by 1"
      - from: RETRACTED
        to: PUBLISHED
        trigger: "POST /mdm/master-records/{record_id}/publish"
        actor: DataSteward
        preconditions:
          - "record.publication_status == RETRACTED"
          - "record.curation_status == CURATED"
          - "record's domain.status == ACTIVE and domain.governance_posture == OPEN"
          - "record.completeness_pct >= 60.00"
        side_effects:
          - "record.publication_status = PUBLISHED; published_at = clock"
          - "increment domain.published_master_record_count by 1; increment domain.version by 1"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "system - MERGE decision loser, or hop 4 of source decertification"
        actor: system
        preconditions:
          - "record.publication_status == PUBLISHED"
        side_effects:
          - "record.publication_status = RETRACTED"
          - "decrement domain.published_master_record_count by 1; increment domain.version by 1"

  - entity: MergeProposal
    initial_state: PROPOSED
    terminal_states: [MERGED, REJECTED]
    note: "Cyclic: PROPOSED -> UNDER_REVIEW -> REWORK -> PROPOSED, with rework_count incrementing on each loop."
    transitions:
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /mdm/merge-proposals/{proposal_id}/review"
        actor: DataSteward
        preconditions:
          - "proposal.status == PROPOSED"
          - "acting steward holds an ACTIVE StewardAssignment on proposal.domain_id covering the clock"
        side_effects:
          - "proposal.status = UNDER_REVIEW; reviewer_steward_id = acting X-User-ID"
      - from: UNDER_REVIEW
        to: MERGED
        trigger: "POST /mdm/merge-proposals/{proposal_id}/decide with decision == MERGE"
        actor: DataOwner
        preconditions:
          - "proposal.status == UNDER_REVIEW"
          - "acting X-User-ID != proposal.proposer_steward_id"
          - "domain.governance_posture IN {OPEN, RESTRICTED}"
          - "both candidate records have curation_status == CURATED"
          - "the SourceSystem of the effective survivor has status == CERTIFIED"
          - "proposal.match_confidence == HIGH, or (match_confidence == MEDIUM and len(payload.override_justification) >= 20)"
        side_effects:
          - "hop 1: survivorship variant selected and effective_survivor_master_record_id / survivor_swapped / survivorship_variant / survivorship_field_map computed per calculations.master_record_survivorship_score; proposal.status = MERGED; decided_at = clock"
          - "hop 2 (caused by hop 1): the effective survivor's attributes are filled from the loser for every key the survivor leaves null; survivor.last_verified_at = max of the two; completeness_pct and survivorship_score recomputed"
          - "hop 3 (caused by hop 2's merge of the loser into the survivor): loser.curation_status = MERGED_AWAY and loser.superseded_by_master_record_id = effective survivor id; if loser.publication_status == PUBLISHED it becomes RETRACTED and domain.published_master_record_count is decremented by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /mdm/merge-proposals/{proposal_id}/decide with decision == REJECT"
        actor: DataOwner
        preconditions:
          - "proposal.status == UNDER_REVIEW"
          - "acting X-User-ID != proposal.proposer_steward_id"
        side_effects:
          - "proposal.status = REJECTED; decided_at = clock"
          - "no record is mutated; effective_survivor_master_record_id stays null and survivor_swapped stays false"
      - from: UNDER_REVIEW
        to: REWORK
        trigger: "POST /mdm/merge-proposals/{proposal_id}/decide with decision == REWORK"
        actor: DataOwner
        preconditions:
          - "proposal.status == UNDER_REVIEW"
          - "acting X-User-ID != proposal.proposer_steward_id"
          - "len(payload.rework_note) >= 10"
        side_effects:
          - "proposal.status = REWORK; reviewer_steward_id cleared to null; decided_at stays null"
      - from: REWORK
        to: PROPOSED
        trigger: "POST /mdm/merge-proposals/{proposal_id}/rescore"
        actor: DataSteward
        preconditions:
          - "proposal.status == REWORK"
          - "both candidate records still have curation_status IN {CANDIDATE, CURATED}"
        side_effects:
          - "match_score and match_confidence recomputed from the new name_similarity_pct / key_overlap_pct per calculations.merge_match_score"
          - "proposal.status = PROPOSED; increment rework_count by 1"

  - entity: ChangeRequest
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED, WITHDRAWN]
    note: "Branching fork UNDER_REVIEW -> {APPROVED | CHANGES_REQUESTED | REJECTED} with divergent side-effect sets, plus the CHANGES_REQUESTED -> SUBMITTED revision cycle."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mdm/change-requests/{change_request_id}/submit"
        actor: DataSteward
        preconditions:
          - "change_request.status == DRAFT"
          - "domain.status == ACTIVE"
          - "acting X-User-ID == change_request.requester_steward_id"
        side_effects:
          - "status = SUBMITTED; submitted_at = clock"
          - "impact_consumer_count, required_lead_days and earliest_apply_at computed per calculations.change_impact_lead_time"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /mdm/change-requests/{change_request_id}/submit"
        actor: DataSteward
        preconditions:
          - "change_request.status == CHANGES_REQUESTED"
          - "domain.status == ACTIVE"
          - "acting X-User-ID == change_request.requester_steward_id"
        side_effects:
          - "status = SUBMITTED; submitted_at = clock; increment revision_cycle_count by 1"
          - "impact_consumer_count, required_lead_days and earliest_apply_at recomputed from the current consumer set and the new submitted_at"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /mdm/change-requests/{change_request_id}/review"
        actor: DataOwner
        preconditions:
          - "change_request.status == SUBMITTED"
          - "acting steward holds an ACTIVE DATA_OWNER StewardAssignment on the domain covering the clock"
          - "acting X-User-ID != change_request.requester_steward_id"
        side_effects:
          - "status = UNDER_REVIEW; reviewer_steward_id = acting X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /mdm/change-requests/{change_request_id}/decide with decision == APPROVE"
        actor: DataOwner
        preconditions:
          - "change_request.status == UNDER_REVIEW"
          - "acting X-User-ID == change_request.reviewer_steward_id"
          - "if structural == true: every ConsumerSubscription of the domain with status == ACTIVE and criticality == TIER1 has lineage_status == DOCUMENTED"
        side_effects:
          - "status = APPROVED; review_note stored; reviewer_steward_id retained"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /mdm/change-requests/{change_request_id}/decide with decision == REQUEST_CHANGES"
        actor: DataOwner
        preconditions:
          - "change_request.status == UNDER_REVIEW"
          - "acting X-User-ID == change_request.reviewer_steward_id"
        side_effects:
          - "status = CHANGES_REQUESTED; review_note stored; reviewer_steward_id cleared to null"
          - "impact_consumer_count, required_lead_days and earliest_apply_at reset to 0 / 0 / null (a new submit recomputes them)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /mdm/change-requests/{change_request_id}/decide with decision == REJECT"
        actor: DataOwner
        preconditions:
          - "change_request.status == UNDER_REVIEW"
          - "acting X-User-ID == change_request.reviewer_steward_id"
        side_effects:
          - "status = REJECTED; review_note stored; reviewer_steward_id retained; earliest_apply_at retained for the audit trail"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /mdm/change-requests/{change_request_id}/schedule"
        actor: DataOwner
        preconditions:
          - "change_request.status == APPROVED"
          - "payload.scheduled_apply_at >= change_request.earliest_apply_at"
          - "the computed freeze window clears every other SCHEDULED window on the domain by at least 72 hours per calculations.freeze_window_geometry"
          - "if structural == true: fewer than 2 other SCHEDULED structural ChangeRequests on the domain have scheduled_apply_at within 30 days of payload.scheduled_apply_at"
        side_effects:
          - "status = SCHEDULED; scheduled_apply_at stored; freeze_window_start / freeze_window_end computed"
          - "increment domain.scheduled_change_count by 1; increment domain.version by 1"
          - "every impacted ConsumerSubscription (per calculations.change_impact_lead_time input_set) gets pending_change_request_id = this request, notified_at = clock, acknowledged_at = null, acknowledged_revision = null"
      - from: SCHEDULED
        to: APPLIED
        trigger: "POST /mdm/change-requests/{change_request_id}/apply"
        actor: GovernanceAdmin
        preconditions:
          - "change_request.status == SCHEDULED"
          - "clock >= change_request.scheduled_apply_at"
          - "domain.governance_posture != FROZEN"
          - "every ConsumerSubscription with pending_change_request_id == this request and criticality == TIER1 has acknowledged_at != null"
        side_effects:
          - "hop 1: status = APPLIED; applied_at = clock; increment domain.reference_data_revision by 1; if change_type == CLASSIFICATION_UPLIFT then domain.classification_level = proposed_values.target_classification_level and sensitive_handling_required recomputed; decrement domain.scheduled_change_count by 1; freeze window released (freeze_window_start / freeze_window_end set to null); increment domain.version by 1"
          - "hop 2 (caused by hop 1's new classification_level): every ConsumerSubscription of the domain with status == ACTIVE whose clearance_level rank < the new classification_level rank becomes status = SUSPENDED with suspended_reason = 'CLEARANCE_BELOW_CLASSIFICATION', and its pending_change_request_id / notified_at / acknowledged_at are cleared to null"
          - "hop 3 (caused by hop 2 shrinking the ACTIVE consumer set): every ChangeRequest of the domain with status IN {SUBMITTED, UNDER_REVIEW} recomputes impact_consumer_count, required_lead_days and earliest_apply_at against the surviving ACTIVE consumer set, keeping its own submitted_at"
          - "every ConsumerSubscription of the domain with lineage_status == DOCUMENTED and lineage_revision < the new reference_data_revision becomes lineage_status = STALE"
          - "every ConsumerSubscription with pending_change_request_id == this request that is still ACTIVE has pending_change_request_id / notified_at / acknowledged_at cleared to null"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /mdm/change-requests/{change_request_id}/withdraw"
        actor: DataSteward
        preconditions:
          - "change_request.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED, SCHEDULED}"
          - "acting X-User-ID == change_request.requester_steward_id, or the acting steward holds an ACTIVE DATA_OWNER StewardAssignment on the domain covering the clock"
        side_effects:
          - "status = WITHDRAWN; withdraw_reason stored"
          - "compensation of the schedule transition: freeze_window_start / freeze_window_end set to null; decrement domain.scheduled_change_count by 1; increment domain.version by 1"
          - "compensation of the notification fan-out: every ConsumerSubscription with pending_change_request_id == this request has pending_change_request_id, notified_at, acknowledged_at and acknowledged_revision cleared to null"
          - "domain.reference_data_revision unchanged"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /mdm/change-requests/{change_request_id}/withdraw"
        actor: DataSteward
        preconditions:
          - "change_request.status == DRAFT"
          - "acting X-User-ID == change_request.requester_steward_id"
        side_effects:
          - "status = WITHDRAWN; withdraw_reason stored"
          - "no freeze window and no notification existed, so no counter changes"

  - entity: ConsumerSubscription
    initial_state: ACTIVE
    terminal_states: []
    note: |
      Parallel dimensions on one row. Dimension A is `status` (ACTIVE ->
      SUSPENDED). Dimension B is `lineage_status` (UNDOCUMENTED -> DOCUMENTED,
      DOCUMENTED -> STALE, STALE -> DOCUMENTED). Suspension never clears the
      documented lineage, and re-documenting lineage never un-suspends.
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system - hop 2 of POST /mdm/change-requests/{change_request_id}/apply for change_type == CLASSIFICATION_UPLIFT"
        actor: system
        preconditions:
          - "subscription.status == ACTIVE"
          - "subscription.clearance_level rank < the domain's new classification_level rank"
        side_effects:
          - "status = SUSPENDED; suspended_reason = 'CLEARANCE_BELOW_CLASSIFICATION'"
          - "pending_change_request_id, notified_at, acknowledged_at cleared to null"
      - from: UNDOCUMENTED
        to: DOCUMENTED
        trigger: "PATCH /mdm/consumer-subscriptions/{subscription_id}/lineage"
        actor: DataSteward
        preconditions:
          - "subscription.lineage_status IN {UNDOCUMENTED, STALE}"
          - "len(payload.lineage_path) >= 3"
          - "payload.lineage_path[0] == domain.authoritative_source_code"
          - "payload.lineage_path[-1] == subscription.reporting_asset_key"
          - "payload.lineage_path contains no repeated node key"
        side_effects:
          - "lineage_path stored; lineage_status = DOCUMENTED; lineage_documented_at = clock; lineage_revision = domain.reference_data_revision"
      - from: STALE
        to: DOCUMENTED
        trigger: "PATCH /mdm/consumer-subscriptions/{subscription_id}/lineage"
        actor: DataSteward
        preconditions:
          - "subscription.lineage_status == STALE"
          - "len(payload.lineage_path) >= 3 and the path is acyclic and endpoint-matched as above"
        side_effects:
          - "lineage_path replaced; lineage_status = DOCUMENTED; lineage_revision = domain.reference_data_revision"
      - from: DOCUMENTED
        to: STALE
        trigger: "system - apply of a ChangeRequest on the domain, or loss of the ACTIVE AUTHORITATIVE registration (hop 5 of decertification)"
        actor: system
        preconditions:
          - "subscription.lineage_status == DOCUMENTED"
          - "domain.reference_data_revision advanced past subscription.lineage_revision, or domain.authoritative_source_code became null"
        side_effects:
          - "lineage_status = STALE"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: authoritative-source-designation-stale-domain
    parent_entity: Domain
    write_endpoint: "POST /mdm/source-registrations"
    occ_field: "expected_domain_version"
    description: |
      Registering a source with role == AUTHORITATIVE against a Domain whose
      version has advanced since the client last observed it is rejected. The
      product legitimately lets a new AUTHORITATIVE registration supersede the
      incumbent one, so the write itself would succeed on its own merits; the
      stale expected_domain_version is the only signal that the caller's view of
      the domain's authoritative designation predates another writer's change.
    error_id: ERR_STALE_DOMAIN_VERSION
    http_status: 412

  - rule_id: steward-assignment-supersede-stale-domain
    parent_entity: Domain
    write_endpoint: "POST /mdm/steward-assignments"
    occ_field: "expected_domain_version"
    description: |
      Creating a StewardAssignment with supersede_incumbent == true against a
      Domain whose version has advanced since the client last observed it is
      rejected. Superseding an open-ended incumbent assignment is a legitimate
      product operation, so only the stale expected_domain_version distinguishes
      a caller acting on an outdated accountability picture.
    error_id: ERR_STALE_DOMAIN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: record_completeness_pct
    trigger: "on POST /mdm/master-records (create), on POST /mdm/master-records/{record_id}/curate, and on hop 2 of a MERGE decision (attribute fill from the loser)"
    algorithm: aggregation
    formula: |
      non_null = count(k for k in record.attributes if record.attributes[k] is not null and record.attributes[k] != "")
      completeness_pct = min(100.00, round(100 * non_null / domain.expected_attribute_count, 2))
    input_set: "Only keys physically present in MasterRecord.attributes with a non-null, non-empty string value. Absent keys and null-valued keys are both counted as missing."
    constants:
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up"

  - name: domain_quality_scorecard
    trigger: "on POST /mdm/domains/{domain_id}/scorecard-runs; also evaluated read-only by GET /mdm/domains/{domain_id}/scorecard"
    algorithm: weighted_scoring
    formula: |
      # Step 1 - evaluated rule set (variant-dependent, see variants below)
      evaluated = variant_specific_rule_set()          # ordered by QualityRule.rule_code ASC
      if evaluated is empty: weighted_score = 0.00 and no findings are created

      # Step 2 - PER-RULE earned points, ROUNDED PER RULE (pinned order:
      #          round each rule's earned points to 2dp FIRST, then sum;
      #          summing unrounded points and rounding once at the end is WRONG)
      earned_per_rule[r] = r.weight_points                                if measured_pct[r] >= r.threshold_pct
                         = round(r.weight_points * measured_pct[r] / r.threshold_pct, 2)  otherwise
      earned_total = sum(earned_per_rule[r] for r in evaluated)           # sum of already-rounded terms

      # Step 3 - denominator and final score (one further rounding)
      weight_total   = sum(r.weight_points for r in evaluated)
      weighted_score = round(100 * earned_total / weight_total, 2)

      # Step 4 - findings, created in ascending r.rule_code order
      for r in evaluated where measured_pct[r] < r.threshold_pct:
        if exists QualityFinding on r with status IN {OPEN, REMEDIATION_PLANNED}:
            refresh that finding's measured_pct and gap_pct; DO NOT create a new
            finding and DO NOT touch its severity_weight
        else:
            create QualityFinding(status=OPEN, measured_pct=measured_pct[r],
              gap_pct=round(r.threshold_pct - measured_pct[r], 2),
              severity_weight per calculations.domain_posture_recompute)

      # Step 5 - persist
      domain.scorecard_run_seq += 1
      if basis == PROVISIONAL: domain.quality_score_provisional = weighted_score
      if basis == CERTIFIED:   domain.quality_score_certified  = weighted_score
    input_set: "QualityRule rows with domain_id == the target domain and status == ACTIVE. RETIRED rules never enter either the numerator or the denominator. Measurements arrive as payload.measurements = [{rule_code, measured_pct}]; a rule_code not matching an ACTIVE rule of the domain is rejected with ERR_UNKNOWN_RULE_CODE."
    constants:
      THRESHOLD_COMPARISON: ">= is a pass (measured_pct exactly equal to threshold_pct earns FULL weight_points)"
      ROUNDING: round_half_up
      EMPTY_RULE_SET_SCORE: 0.00
    precision: "2 decimal places, round_half_up, applied per rule in Step 2 and once again in Step 3"
    variants:
      - name: PROVISIONAL
        when: "payload.basis == PROVISIONAL; always permitted, including while the domain holds no certified authoritative source"
        difference: "The evaluated set is exactly the ACTIVE rules for which payload.measurements supplies a measured_pct. ACTIVE rules with no measurement are EXCLUDED from both numerator and denominator and produce no finding."
      - name: CERTIFIED
        when: "payload.basis == CERTIFIED; requires an ACTIVE AUTHORITATIVE SourceRegistration whose SourceSystem.status == CERTIFIED, else ERR_NO_CERTIFIED_AUTHORITATIVE_SOURCE"
        difference: "The evaluated set is EVERY ACTIVE rule of the domain. An ACTIVE rule with no supplied measurement is treated as measured_pct = 0.00 - it stays in the denominator, earns 0 points, and produces a finding. For identical measurement payloads the CERTIFIED score is therefore <= the PROVISIONAL score whenever any ACTIVE rule was left unmeasured."

  - name: domain_posture_recompute
    trigger: "at the END of POST /mdm/domains/{domain_id}/scorecard-runs (exactly once per run), and on every finding-set mutation (plan-remediation, resolve, waive) and every SourceRegistration status change"
    algorithm: constraint_propagation
    formula: |
      # --- Circular-looking dependency, resolved by a PINNED evaluation order ---
      # severity_weight depends on the posture, and the posture depends on the sum
      # of severity_weights. The order is pinned as follows and MUST NOT be
      # interleaved:
      #
      #   (1) posture_before := domain.governance_posture as it stands at the
      #       instant the request starts (for a scorecard run this is recorded on
      #       ScorecardRun.posture_before).
      #   (2) multiplier := MULTIPLIER[posture_before]  -- computed ONCE per
      #       request and applied to EVERY finding the request creates, in
      #       ascending QualityRule.rule_code order.
      #   (3) severity_weight := round(BASE_POINTS[rule.severity] * multiplier, 2)
      #       and it is FROZEN on the finding row forever after.
      #   (4) after ALL findings of the request exist, recompute
      #       open_finding_weight and the posture EXACTLY ONCE.
      #
      # Recomputing the posture after each individual finding (and thus using a
      # larger multiplier for later findings of the same request) is WRONG.

      multiplier = MULTIPLIER[posture_before]
      severity_weight(f) = round(BASE_POINTS[f.rule.severity] * multiplier, 2)

      open_finding_weight = round(sum(f.severity_weight
                                      for f in QualityFinding
                                      where f.rule.domain_id == domain.id
                                        and f.status IN {OPEN, REMEDIATION_PLANNED}), 2)

      has_open_critical = exists f in that same set with f.rule.severity == CRITICAL
      has_auth_source   = exists SourceRegistration where domain_id == domain.id
                                 and role == AUTHORITATIVE and status == ACTIVE

      governance_posture = FROZEN      if (not has_auth_source) or open_finding_weight >= 40.00
                         = RESTRICTED  else if open_finding_weight >= 15.00 or has_open_critical
                         = OPEN        otherwise
    input_set: "QualityFinding rows whose QualityRule.domain_id == the domain and whose status IN {OPEN, REMEDIATION_PLANNED}. RESOLVED and WAIVED findings leave the sum. Findings are created in ascending QualityRule.rule_code order (rule_code is unique per domain, so the order is total and no tie-break is required)."
    constants:
      BASE_POINTS: { LOW: 1, MEDIUM: 3, HIGH: 8, CRITICAL: 20 }
      MULTIPLIER: { OPEN: 1.00, RESTRICTED: 1.25, FROZEN: 1.50 }
      RESTRICTED_THRESHOLD: 15.00
      FROZEN_THRESHOLD: 40.00
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up; thresholds compared with >="

  - name: merge_match_score
    trigger: "on POST /mdm/merge-proposals (create) and on POST /mdm/merge-proposals/{proposal_id}/rescore"
    algorithm: weighted_scoring
    formula: |
      # >= 3 inputs with a non-linear conditional branch and an inner min()
      base = round(0.50 * name_similarity_pct
                 + 0.30 * key_overlap_pct
                 + 0.20 * min(survivor.completeness_pct, duplicate.completeness_pct), 2)

      # Intra-source duplicates are structurally less trustworthy: the whole
      # composite is discounted AFTER the weighted sum is rounded (pinned order).
      match_score = round(base * INTRA_SOURCE_DISCOUNT, 2)   if survivor.source_system_id == duplicate.source_system_id
                  = base                                      otherwise

      match_confidence = HIGH    if match_score >= 85.00
                       = MEDIUM  if match_score >= 60.00
                       = LOW     otherwise
    input_set: "The two MasterRecord rows named by survivor_master_record_id and duplicate_master_record_id, plus the two matching-engine percentages supplied in the payload. completeness_pct is read from the records as persisted at the moment of the call."
    constants:
      NAME_WEIGHT: 0.50
      KEY_WEIGHT: 0.30
      COMPLETENESS_WEIGHT: 0.20
      INTRA_SOURCE_DISCOUNT: 0.80
      CREATION_FLOOR: 45.00
      HIGH_CONFIDENCE_FLOOR: 85.00
      MEDIUM_CONFIDENCE_FLOOR: 60.00
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up, applied to the weighted sum and again after the intra-source discount"

  - name: master_record_survivorship_score
    trigger: "on POST /mdm/master-records (create), on POST /mdm/master-records/{record_id}/curate, and on hop 1/hop 2 of a MERGE decision"
    algorithm: weighted_scoring
    formula: |
      staleness_months = floor(whole_days_between(record.last_verified_at, clock) / 30)
      trust_component  = record.source_system.trust_tier * TRUST_TIER_POINTS      # 10..50
      complete_component = round(record.completeness_pct * COMPLETENESS_FACTOR, 2) # 0..40
      recency_component  = max(0, RECENCY_MAX - RECENCY_DECAY_PER_MONTH * staleness_months)
      survivorship_score = round(trust_component + complete_component + recency_component, 2)

      # ---- survivor selection at MERGE time (variant-dependent) ----
      # variant selection is NOT a client choice; see variants below
      # tie-break chain is total: variant key -> survivorship_score DESC ->
      # last_verified_at DESC -> created_at ASC (never id)
      effective_survivor = variant_specific_selection()
      survivor_swapped   = (effective_survivor.id != proposal.survivor_master_record_id)

      # ---- attribute survivorship (field-level, deterministic) ----
      for key in union(effective_survivor.attributes.keys(), loser.attributes.keys()):
        winning_value = effective_survivor.attributes[key]
                        if that key is present and non-null on the effective survivor
                        else loser.attributes[key]
        survivorship_field_map[key] = the natural_key of the record that supplied winning_value
      effective_survivor.last_verified_at = max(effective_survivor.last_verified_at, loser.last_verified_at)
      effective_survivor.completeness_pct = recomputed per calculations.record_completeness_pct
      effective_survivor.survivorship_score = recomputed with the formula above
    input_set: "Exactly the two MasterRecord rows referenced by the proposal, read at decision time. Records with curation_status == MERGED_AWAY or QUARANTINED are not eligible candidates (the decide transition rejects them)."
    constants:
      TRUST_TIER_POINTS: 10
      COMPLETENESS_FACTOR: 0.40
      RECENCY_MAX: 20
      RECENCY_DECAY_PER_MONTH: 4
      DAYS_PER_MONTH: 30
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up; staleness_months uses floor over whole UTC days"
    variants:
      - name: SOURCE_PRIORITY
        when: "EXACTLY ONE of the two candidates has source_system_id equal to the source_system_id of the domain's SourceRegistration with role == AUTHORITATIVE and status == ACTIVE at decision time"
        difference: "The survivor is that single authoritative-source candidate, EVEN IF its survivorship_score is strictly lower than the other candidate's. survivorship_score is used only to fill the survivorship_field_map afterwards, never to pick the survivor."
      - name: SCORE_PRIORITY
        when: "BOTH candidates share the authoritative source_system_id, or NEITHER of them carries it (including the case where the authoritative registration was superseded onto a third source system)"
        difference: "The survivor is the candidate with the higher survivorship_score, then last_verified_at DESC, then created_at ASC. For the same two records this selects a DIFFERENT survivor than SOURCE_PRIORITY whenever the authoritative-source record is not the higher-scoring one."

  - name: change_impact_lead_time
    trigger: "on POST /mdm/change-requests/{change_request_id}/submit (both the DRAFT and the CHANGES_REQUESTED entry), and on hop 3 of POST /mdm/change-requests/{change_request_id}/apply"
    algorithm: threshold
    formula: |
      # Step 1 - impacted consumer set (pinned filter)
      impacted = [s for s in ConsumerSubscription
                  where s.domain_id == cr.domain_id
                    and s.status == ACTIVE
                    and (cr.structural == true or s.criticality == 'TIER1')]

      # Step 2
      impact_consumer_count = count(impacted)

      # Step 3
      base_lead = max(s.required_lead_days for s in impacted) if impacted else 0

      # Step 4
      floor_lead = domain.notification_lead_days_floor if impact_consumer_count >= 1 else 0

      # Step 5 - breadth surcharge on the COUNT, not on the days
      breadth_surcharge = 3 if impact_consumer_count >= 5
                        = 1 if impact_consumer_count >= 3
                        = 0 otherwise

      # Step 6
      classification_surcharge = 2 if domain.classification_level IN {CONFIDENTIAL, RESTRICTED} else 0

      # Step 7 - PINNED ORDER: the floor is applied BEFORE the surcharges are
      # added, then the cap is applied LAST.
      #   required_lead_days = min(CAP, max(base_lead, floor_lead)
      #                                 + breadth_surcharge + classification_surcharge)
      # Folding the surcharges inside the max() -- max(base_lead + surcharges,
      # floor_lead) -- is WRONG and yields a smaller number whenever
      # base_lead < floor_lead.
      required_lead_days = min(LEAD_DAYS_CAP,
                              max(base_lead, floor_lead)
                              + breadth_surcharge + classification_surcharge)

      # Step 8
      earliest_apply_at = cr.submitted_at + required_lead_days days
    input_set: "ConsumerSubscription rows of the change request's domain with status == ACTIVE. SUSPENDED subscriptions never count. For a non-structural change (change_type == REFERENCE_VALUE_ADD) only criticality == TIER1 rows are impacted; for a structural change every ACTIVE row is impacted regardless of criticality."
    constants:
      LEAD_DAYS_CAP: 30
      BREADTH_TIER_1_COUNT: 3
      BREADTH_TIER_1_DAYS: 1
      BREADTH_TIER_2_COUNT: 5
      BREADTH_TIER_2_DAYS: 3
      CLASSIFICATION_SURCHARGE_DAYS: 2
    precision: "integer days; earliest_apply_at is an exact ISO-8601 UTC instant"

  - name: freeze_window_geometry
    trigger: "on POST /mdm/change-requests/{change_request_id}/schedule"
    algorithm: interval_merge
    formula: |
      # CLOSED interval on the domain's change calendar
      lead_hours  = STRUCTURAL_LEAD_HOURS  if cr.structural else NON_STRUCTURAL_LEAD_HOURS
      trail_hours = STRUCTURAL_TRAIL_HOURS if cr.structural else NON_STRUCTURAL_TRAIL_HOURS
      window_start = scheduled_apply_at - lead_hours
      window_end   = scheduled_apply_at + trail_hours

      # Separation test against every OTHER ChangeRequest of the same domain with
      # status == SCHEDULED. Endpoints are INCLUSIVE, so a mandatory separation
      # buffer is required between windows; exactly SEPARATION_BUFFER_HOURS of
      # separation is ACCEPTED (>=), one second less is REJECTED.
      for other in SCHEDULED change requests of this domain (excluding cr):
        ok = (window_start >= other.freeze_window_end + SEPARATION_BUFFER_HOURS)
          or (window_end + SEPARATION_BUFFER_HOURS <= other.freeze_window_start)
        if not ok: reject with ERR_FREEZE_WINDOW_CONFLICT

      # Aggregate calendar capacity, structural changes only
      if cr.structural:
        neighbours = count(other in SCHEDULED structural change requests of this
                           domain where abs(other.scheduled_apply_at
                                            - scheduled_apply_at) <= 30 days)
        if neighbours >= STRUCTURAL_CAPACITY_PER_30D: reject with ERR_CHANGE_CALENDAR_CAPACITY
    input_set: "ChangeRequest rows of the same domain with status == SCHEDULED. APPLIED and WITHDRAWN requests have released their windows (freeze_window_start / freeze_window_end are null) and never participate."
    constants:
      STRUCTURAL_LEAD_HOURS: 24
      STRUCTURAL_TRAIL_HOURS: 48
      NON_STRUCTURAL_LEAD_HOURS: 0
      NON_STRUCTURAL_TRAIL_HOURS: 12
      SEPARATION_BUFFER_HOURS: 72
      STRUCTURAL_CAPACITY_PER_30D: 2
      ROLLING_WINDOW_DAYS: 30
    precision: "exact ISO-8601 UTC instants; comparisons are inclusive (>=, <=)"

  - name: governed_counter_reconciliation
    trigger: "after every mutation that touches a finding, a publication, a schedule or an assignment; the counters are the invariants a compensating action must restore"
    algorithm: aggregation
    formula: |
      domain.open_finding_weight = round(sum(f.severity_weight for f in QualityFinding
                                             where f.rule.domain_id == domain.id
                                               and f.status IN {OPEN, REMEDIATION_PLANNED}), 2)

      domain.published_master_record_count = count(r for r in MasterRecord
                                                   where r.domain_id == domain.id
                                                     and r.publication_status == PUBLISHED)

      domain.scheduled_change_count = count(c for c in ChangeRequest
                                            where c.domain_id == domain.id
                                              and c.status == SCHEDULED)

      steward.open_finding_load = count(f for f in QualityFinding
                                        where f.assigned_steward_id == steward.id
                                          and f.status == REMEDIATION_PLANNED)
    input_set: "Whole-table recount with the explicit status filters above; no time window and no ordering, so the values are order-insensitive and every compensating action must restore them exactly."
    constants:
      ROUNDING: round_half_up
    precision: "open_finding_weight 2 decimal places, round_half_up; the other three are exact integers"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and is one of the roles declared in 1.7; X-User-ID is additionally required whenever the acting role is entity_backed (DataOwner, DataSteward, ConsumerRep) and is optional for the opaque roles (GovernanceAdmin, Auditor)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every resource named in the path exists, validated left-to-right"
    error_id: ERR_DOMAIN_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints; the concrete error_id is the one for the first missing path resource - ERR_DOMAIN_NOT_FOUND, ERR_SOURCE_SYSTEM_NOT_FOUND, ERR_STEWARD_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_QUALITY_RULE_NOT_FOUND, ERR_SCORECARD_RUN_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_MASTER_RECORD_NOT_FOUND, ERR_MERGE_PROPOSAL_NOT_FOUND, ERR_CHANGE_REQUEST_NOT_FOUND, ERR_SUBSCRIPTION_NOT_FOUND"
  - priority: 4
    category: business_constraint
    check: "request body schema - required fields present, enum members valid, numeric ranges respected, array shapes valid (measurements entries carry rule_code and measured_pct; lineage_path has at least 3 entries), string length minimums met"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (domain_id, source_system_id, steward_id, owner_steward_id, assigned_steward_id, survivor_master_record_id, duplicate_master_record_id)"
    error_id: ERR_STEWARD_NOT_FOUND
    http_status: 404
    applies_to: "POST /mdm/source-registrations, POST /mdm/steward-assignments, POST /mdm/quality-rules, POST /mdm/master-records, POST /mdm/merge-proposals, POST /mdm/change-requests, POST /mdm/consumer-subscriptions, POST /mdm/quality-findings/{finding_id}/plan-remediation"
  - priority: 6
    category: auth
    check: "acting identity is entitled on the target domain: DataOwner must hold an ACTIVE DATA_OWNER StewardAssignment on the domain covering the clock (ERR_NOT_DOMAIN_OWNER); DataSteward must hold an ACTIVE StewardAssignment with steward_role IN {DATA_STEWARD, CUSTODIAN} on the domain covering the clock (ERR_NOT_DOMAIN_STEWARD); ConsumerRep's X-User-ID must equal the target ConsumerSubscription.id (ERR_NOT_SUBSCRIPTION_OWNER)"
    error_id: ERR_NOT_DOMAIN_STEWARD
    http_status: 403
    applies_to: "every DataSteward / DataOwner / ConsumerRep write endpoint"
  - priority: 7
    category: state
    check: "expected_domain_version equals the current Domain.version"
    error_id: ERR_STALE_DOMAIN_VERSION
    http_status: 412
    applies_to: "POST /mdm/source-registrations, POST /mdm/steward-assignments"
  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition exists (per 1.2), including terminal-state lockdown"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint; specialised ids where 1.6 declares them - ERR_DOMAIN_NOT_DRAFT, ERR_DOMAIN_NOT_ACTIVE, ERR_SOURCE_NOT_CERTIFIED, ERR_FINDING_ALREADY_CLOSED, ERR_RECORD_NOT_CURATED, ERR_RECORD_ALREADY_PUBLISHED, ERR_PROPOSAL_NOT_UNDER_REVIEW, ERR_CHANGE_REQUEST_NOT_SCHEDULED, ERR_RULE_HAS_OPEN_FINDINGS (retiring a rule that still carries an OPEN or REMEDIATION_PLANNED finding), ERR_NO_PENDING_NOTIFICATION (acknowledge with no pending_change_request_id)"
  - priority: 9
    category: business_referential
    check: "cross-entity linkage integrity: a merge proposal's two records must belong to the same domain (ERR_CROSS_DOMAIN_MERGE) and must be distinct (ERR_SELF_MERGE); a quality rule referenced by a measurement must belong to the scored domain (ERR_UNKNOWN_RULE_CODE); a HIERARCHY_RESTRUCTURE payload's parent_node_key must differ from its child_node_key (ERR_HIERARCHY_CYCLE); a lineage_path must start at domain.authoritative_source_code (ERR_LINEAGE_SOURCE_MISMATCH), end at reporting_asset_key (ERR_LINEAGE_TARGET_MISMATCH) and repeat no node (ERR_LINEAGE_CYCLE), and lineage documentation requires the domain to have an ACTIVE AUTHORITATIVE registration at all (ERR_AUTHORITATIVE_SOURCE_UNDEFINED)"
    error_id: ERR_CROSS_DOMAIN_MERGE
    http_status: 422
    applies_to: "POST /mdm/merge-proposals, POST /mdm/domains/{domain_id}/scorecard-runs, POST /mdm/change-requests, PATCH /mdm/consumer-subscriptions/{subscription_id}/lineage"
  - priority: 10
    category: business_safety
    check: "segregation of duties: the reviewer of a ChangeRequest may not be its requester; the waiver of a QualityFinding may not be its planner; the decider of a MergeProposal may not be its proposer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mdm/change-requests/{change_request_id}/review, POST /mdm/quality-findings/{finding_id}/waive, POST /mdm/merge-proposals/{proposal_id}/decide"
  - priority: 11
    category: business_safety
    check: "governance posture gate: publishing a MasterRecord requires domain.governance_posture == OPEN and domain.status == ACTIVE; deciding a MERGE requires posture IN {OPEN, RESTRICTED}; applying a ChangeRequest requires posture != FROZEN"
    error_id: ERR_DOMAIN_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /mdm/master-records/{record_id}/publish, POST /mdm/merge-proposals/{proposal_id}/decide, POST /mdm/change-requests/{change_request_id}/apply"
  - priority: 12
    category: business_safety
    check: "classification and sensitive-data handling: a ConsumerSubscription may only be created with clearance_level rank >= domain.classification_level rank; a CLASSIFICATION_UPLIFT change request's target_classification_level must have a strictly higher rank than the domain's current classification_level"
    error_id: ERR_CLEARANCE_INSUFFICIENT
    http_status: 403
    applies_to: "POST /mdm/consumer-subscriptions, POST /mdm/change-requests"
  - priority: 13
    category: business_temporal
    check: "interval and calendar geometry: StewardAssignment half-open intervals [effective_from, effective_to) may not overlap for the same (domain_id, steward_role) unless supersede_incumbent == true (ERR_ASSIGNMENT_OVERLAP); SourceRegistration effective_from must be < effective_to when effective_to is supplied (ERR_INVALID_INTERVAL); a freeze window must clear every other SCHEDULED window by >= 72h (ERR_FREEZE_WINDOW_CONFLICT); scheduled_apply_at must be >= earliest_apply_at (ERR_LEAD_TIME_NOT_SATISFIED); apply requires clock >= scheduled_apply_at (ERR_APPLY_WINDOW_NOT_REACHED)"
    error_id: ERR_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /mdm/steward-assignments, POST /mdm/source-registrations, POST /mdm/change-requests/{change_request_id}/schedule, POST /mdm/change-requests/{change_request_id}/apply"
  - priority: 14
    category: business_constraint
    check: "capacity, uniqueness and confidence constraints: rule_code unique per domain (ERR_DUPLICATE_RULE_CODE); domain code unique (ERR_DUPLICATE_DOMAIN_CODE); consumer_code unique (ERR_DUPLICATE_CONSUMER_CODE); natural_key unique per (domain_id, source_system_id) (ERR_DUPLICATE_NATURAL_KEY); match_score >= 45.00 at proposal creation/rescore (ERR_MATCH_SCORE_BELOW_FLOOR); MERGE requires HIGH confidence or a >= 20-char override_justification with MEDIUM confidence (ERR_MATCH_CONFIDENCE_TOO_LOW); at most 2 SCHEDULED structural change requests per domain per rolling 30 days (ERR_CHANGE_CALENDAR_CAPACITY); publishing requires completeness_pct >= 60.00 (ERR_RECORD_INCOMPLETE); a CRITICAL rule's owner must be certification_level PRINCIPAL (ERR_OWNER_NOT_PRINCIPAL); every ACTIVE TIER1 consumer must be lineage DOCUMENTED before a structural approval (ERR_LINEAGE_INCOMPLETE); every TIER1 notified consumer must have acknowledged before apply (ERR_TIER1_ACK_MISSING); activation requires at least one ACTIVE quality rule (ERR_NO_QUALITY_RULES), a DATA_OWNER and a DATA_STEWARD assignment (ERR_STEWARDSHIP_INCOMPLETE) and a certified authoritative source (ERR_NO_CERTIFIED_AUTHORITATIVE_SOURCE); source_systems.code unique (ERR_DUPLICATE_SOURCE_CODE); stewards.email unique (ERR_DUPLICATE_STEWARD_EMAIL); plan-remediation due_at must be strictly after the clock (ERR_DUE_DATE_IN_PAST) and its assignee must hold an ACTIVE StewardAssignment on the finding's domain covering the clock (ERR_ASSIGNMENT_STEWARD_NOT_ELIGIBLE); resolve requires verified_measured_pct >= the rule's threshold_pct (ERR_RESOLUTION_BELOW_THRESHOLD)"
    error_id: ERR_MATCH_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /mdm/domains, POST /mdm/source-systems, POST /mdm/stewards, POST /mdm/quality-rules, POST /mdm/quality-findings/{finding_id}/plan-remediation, POST /mdm/quality-findings/{finding_id}/resolve, POST /mdm/master-records, POST /mdm/merge-proposals, POST /mdm/merge-proposals/{proposal_id}/rescore, POST /mdm/merge-proposals/{proposal_id}/decide, POST /mdm/master-records/{record_id}/publish, POST /mdm/consumer-subscriptions, POST /mdm/change-requests/{change_request_id}/decide, POST /mdm/change-requests/{change_request_id}/schedule, POST /mdm/change-requests/{change_request_id}/apply, POST /mdm/domains/{domain_id}/activate"
  - priority: 15
    category: business_fiscal
    check: "scorecard weight budget: the sum of weight_points over the domain's status == ACTIVE quality rules, including the incoming or updated rule, must be <= 100"
    error_id: ERR_RULE_WEIGHT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /mdm/quality-rules, PATCH /mdm/quality-rules/{rule_id}"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
list_conventions: |
  Every `GET` whose `output:` is a list returns `data` as a JSON array ordered by
  `created_at` ASC (never by `id`), supports `limit` (default 10, min 1, max 100) and
  `offset` (default 0), and echoes `total_count` and `has_more` alongside `data`
  in the response envelope. All declared query filters are optional and combine
  with AND; an unknown filter value that is not a member of the field's enum is
  rejected with ERR_INVALID_REQUEST. Filters never widen visibility beyond what
  the acting role may read per 1.7.
endpoints:
  # ---- Domain registry ----
  - method: POST
    path: "/mdm/domains"
    description: "Define a master data domain (CUSTOMER / PRODUCT / VENDOR / LOCATION) in DRAFT status"
    roles: [GovernanceAdmin]
    code: 201
    input: [code, name, classification_level, "notification_lead_days_floor?", "expected_attribute_count?"]
    output: Domain
    side_effects:
      - "status = DRAFT, governance_posture = FROZEN (no authoritative source yet), version = 1"
      - "sensitive_handling_required derived from classification_level"
  - method: GET
    path: "/mdm/domains"
    description: "List domains with pagination and filters"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: ["status?", "classification_level?", "governance_posture?", "limit?", "offset?"]
    output: Domain[]
    side_effects: []
  - method: GET
    path: "/mdm/domains/{domain_id}"
    description: "Read one domain including all derived governance counters"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: []
    output: Domain
    side_effects: []
  - method: POST
    path: "/mdm/domains/{domain_id}/activate"
    description: "Activate a DRAFT domain once stewardship, quality rules and a certified authoritative source are all in place"
    roles: [GovernanceAdmin]
    code: 200
    input: []
    output: Domain
    side_effects:
      - "status = ACTIVE, activated_at = clock"
      - "recompute governance_posture; increment Domain.version by 1"
  - method: GET
    path: "/mdm/domains/{domain_id}/scorecard"
    description: "Computed read of the domain scorecard for the requested basis, evaluated against the currently stored finding measurements without creating a ScorecardRun"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: ["basis?"]
    output: { domain_id: string, basis: string, weighted_score: number, rules_evaluated_count: integer, rules_failed_count: integer, open_finding_weight: number, governance_posture: string }
    side_effects: []
  - method: POST
    path: "/mdm/domains/{domain_id}/scorecard-runs"
    description: "Run the quality scorecard for the domain on the requested basis; creates a ScorecardRun, opens findings for breached rules and recomputes the governance posture exactly once at the end of the run"
    roles: [DataSteward, DataOwner]
    code: 201
    input: [basis, measurements]
    output: ScorecardRun
    side_effects:
      - "increment Domain.scorecard_run_seq by 1; set quality_score_provisional or quality_score_certified"
      - "create QualityFinding rows in ascending rule_code order using the run's pinned posture multiplier"
      - "recompute Domain.open_finding_weight and governance_posture once, after all findings exist"
      - "increment Domain.version by 1"

  # ---- Source systems ----
  - method: POST
    path: "/mdm/source-systems"
    description: "Register a contributing source system"
    roles: [GovernanceAdmin]
    code: 201
    input: [code, name, trust_tier]
    output: SourceSystem
    side_effects: ["status = REGISTERED"]
  - method: GET
    path: "/mdm/source-systems"
    description: "List source systems"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SourceSystem[]
    side_effects: []
  - method: GET
    path: "/mdm/source-systems/{source_system_id}"
    description: "Read one source system"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: []
    output: SourceSystem
    side_effects: []
  - method: POST
    path: "/mdm/source-systems/{source_system_id}/certify"
    description: "Certify a REGISTERED source system so it may be designated authoritative and contribute curated records"
    roles: [GovernanceAdmin]
    code: 200
    input: []
    output: SourceSystem
    side_effects:
      - "status = CERTIFIED, certified_at = clock"
      - "recompute governance_posture of every domain holding an ACTIVE AUTHORITATIVE registration on this system"
  - method: POST
    path: "/mdm/source-systems/{source_system_id}/decertify"
    description: "Decertify a CERTIFIED source system; runs the 5-hop revocation cascade over registrations, domain posture, published records and consumer lineage"
    roles: [GovernanceAdmin]
    code: 200
    input: [reason]
    output: SourceSystem
    side_effects:
      - "hop 1 status = DECERTIFIED; hop 2 ACTIVE registrations REVOKED; hop 3 affected domains lose authoritative_source_code and go FROZEN; hop 4 published records RETRACTED and QUARANTINED with published_master_record_count zeroed; hop 5 documented consumer lineage goes STALE"
      - "increment Domain.version by 1 for every affected domain"

  # ---- Stewards ----
  - method: POST
    path: "/mdm/stewards"
    description: "Register a data steward identity"
    roles: [GovernanceAdmin]
    code: 201
    input: [full_name, email, certification_level]
    output: Steward
    side_effects: ["open_finding_load = 0"]
  - method: GET
    path: "/mdm/stewards"
    description: "List stewards"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: ["certification_level?", "limit?", "offset?"]
    output: Steward[]
    side_effects: []
  - method: GET
    path: "/mdm/stewards/{steward_id}"
    description: "Read one steward including the derived open_finding_load"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: []
    output: Steward
    side_effects: []

  # ---- Authoritative source designation ----
  - method: POST
    path: "/mdm/source-registrations"
    description: "Register a source system against a domain with a designated role; an incoming AUTHORITATIVE registration supersedes the incumbent one. Optimistic concurrency on Domain.version."
    roles: [GovernanceAdmin]
    code: 201
    input: [domain_id, source_system_id, role, trust_rank, effective_from, "effective_to?", expected_domain_version]
    output: SourceRegistration
    side_effects:
      - "status = ACTIVE; if role == AUTHORITATIVE the incumbent ACTIVE AUTHORITATIVE registration becomes SUPERSEDED with effective_to = incoming.effective_from"
      - "Domain.authoritative_source_code updated; Domain.governance_posture recomputed"
      - "increments Domain.version by 1"
  - method: GET
    path: "/mdm/source-registrations"
    description: "List source registrations filtered by domain, source system, role or status"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: ["domain_id?", "source_system_id?", "role?", "status?", "limit?", "offset?"]
    output: SourceRegistration[]
    side_effects: []
  - method: GET
    path: "/mdm/source-registrations/{registration_id}"
    description: "Read one source registration"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: []
    output: SourceRegistration
    side_effects: []

  # ---- Steward assignment ----
  - method: POST
    path: "/mdm/steward-assignments"
    description: "Assign a steward to a domain for a half-open accountability interval; optionally supersede the open-ended incumbent for the same role. Optimistic concurrency on Domain.version."
    roles: [GovernanceAdmin]
    code: 201
    input: [domain_id, steward_id, steward_role, effective_from, "effective_to?", "supersede_incumbent?", expected_domain_version]
    output: StewardAssignment
    side_effects:
      - "status = ACTIVE; when supersede_incumbent == true the incumbent is end-dated to the incoming effective_from and marked SUPERSEDED"
      - "increments Domain.version by 1"
  - method: GET
    path: "/mdm/steward-assignments"
    description: "List steward assignments filtered by domain, steward, role or status"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: ["domain_id?", "steward_id?", "steward_role?", "status?", "limit?", "offset?"]
    output: StewardAssignment[]
    side_effects: []
  - method: GET
    path: "/mdm/steward-assignments/{assignment_id}"
    description: "Read one steward assignment"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: []
    output: StewardAssignment
    side_effects: []

  # ---- Quality rules ----
  - method: POST
    path: "/mdm/quality-rules"
    description: "Define a data quality rule with a pass threshold, scorecard weight and finding severity"
    roles: [DataSteward, DataOwner]
    code: 201
    input: [domain_id, owner_steward_id, rule_code, dimension, weight_points, threshold_pct, severity]
    output: QualityRule
    side_effects: ["status = ACTIVE; the rule enters the scorecard denominator of the next run"]
  - method: GET
    path: "/mdm/quality-rules"
    description: "List quality rules filtered by domain, owning steward or status"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: ["domain_id?", "owner_steward_id?", "status?", "dimension?", "limit?", "offset?"]
    output: QualityRule[]
    side_effects: []
  - method: GET
    path: "/mdm/quality-rules/{rule_id}"
    description: "Read one quality rule"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: []
    output: QualityRule
    side_effects: []
  - method: PATCH
    path: "/mdm/quality-rules/{rule_id}"
    description: "Adjust a quality rule's threshold or weight, or retire it"
    roles: [DataSteward, DataOwner]
    code: 200
    input: ["threshold_pct?", "weight_points?", "status?"]
    output: QualityRule
    side_effects:
      - "weight budget re-validated against the domain's ACTIVE rule set"
      - "retirement removes the rule from the next run's denominator; already-open findings keep their pinned severity_weight"

  # ---- Scorecard runs and findings ----
  - method: GET
    path: "/mdm/scorecard-runs"
    description: "List scorecard runs filtered by domain"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: ["domain_id?", "basis?", "limit?", "offset?"]
    output: ScorecardRun[]
    side_effects: []
  - method: GET
    path: "/mdm/scorecard-runs/{run_id}"
    description: "Read one immutable scorecard run"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: []
    output: ScorecardRun
    side_effects: []
  - method: GET
    path: "/mdm/quality-findings"
    description: "List quality findings filtered by run, rule, assigned / planning / waiving steward or status"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: ["scorecard_run_id?", "quality_rule_id?", "assigned_steward_id?", "planned_by_steward_id?", "waived_by_steward_id?", "status?", "limit?", "offset?"]
    output: QualityFinding[]
    side_effects: []
  - method: GET
    path: "/mdm/quality-findings/{finding_id}"
    description: "Read one quality finding"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: []
    output: QualityFinding
    side_effects: []
  - method: POST
    path: "/mdm/quality-findings/{finding_id}/plan-remediation"
    description: "Assign a steward and a due date to an OPEN finding"
    roles: [DataSteward, DataOwner]
    code: 200
    input: [assigned_steward_id, due_at, "plan_note?"]
    output: QualityFinding
    side_effects:
      - "status = REMEDIATION_PLANNED; planned_by_steward_id = acting X-User-ID"
      - "increment Steward.open_finding_load by 1 for the assignee; Domain.open_finding_weight unchanged"
  - method: POST
    path: "/mdm/quality-findings/{finding_id}/resolve"
    description: "Resolve a finding by evidencing a measured percentage that meets the rule threshold"
    roles: [DataSteward, DataOwner]
    code: 200
    input: [verified_measured_pct, "resolution_note?"]
    output: QualityFinding
    side_effects:
      - "status = RESOLVED; measured_pct refreshed; gap_pct = 0.00"
      - "decrement Steward.open_finding_load when an assignee was charged; recompute Domain.open_finding_weight and governance_posture; increment Domain.version by 1"
  - method: POST
    path: "/mdm/quality-findings/{finding_id}/waive"
    description: "Waive a finding as data owner; the waiver may not be the steward who planned the remediation"
    roles: [DataOwner]
    code: 200
    input: [waiver_justification]
    output: QualityFinding
    side_effects:
      - "status = WAIVED; waived_by_steward_id = acting X-User-ID"
      - "decrement Steward.open_finding_load when an assignee was charged; recompute Domain.open_finding_weight and governance_posture; increment Domain.version by 1"

  # ---- Master records ----
  - method: POST
    path: "/mdm/master-records"
    description: "Ingest a candidate golden record from a source system"
    roles: [DataSteward, DataOwner]
    code: 201
    input: [domain_id, source_system_id, natural_key, attributes, last_verified_at]
    output: MasterRecord
    side_effects:
      - "curation_status = CANDIDATE, publication_status = UNPUBLISHED"
      - "completeness_pct and survivorship_score computed"
  - method: GET
    path: "/mdm/master-records"
    description: "List master records filtered by domain, source, supersede pointer or either state dimension"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: ["domain_id?", "source_system_id?", "superseded_by_master_record_id?", "curation_status?", "publication_status?", "limit?", "offset?"]
    output: MasterRecord[]
    side_effects: []
  - method: GET
    path: "/mdm/master-records/{record_id}"
    description: "Read one master record"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: []
    output: MasterRecord
    side_effects: []
  - method: POST
    path: "/mdm/master-records/{record_id}/curate"
    description: "Promote a CANDIDATE or re-verify a QUARANTINED record to CURATED"
    roles: [DataSteward, DataOwner]
    code: 200
    input: ["last_verified_at?"]
    output: MasterRecord
    side_effects: ["curation_status = CURATED; survivorship_score recomputed"]
  - method: POST
    path: "/mdm/master-records/{record_id}/publish"
    description: "Publish a CURATED record to downstream consumers; blocked unless the domain is ACTIVE and its posture is OPEN"
    roles: [DataSteward, DataOwner]
    code: 200
    input: []
    output: MasterRecord
    side_effects:
      - "publication_status = PUBLISHED, published_at = clock"
      - "increment Domain.published_master_record_count by 1; increment Domain.version by 1"

  # ---- Match, merge and survivorship ----
  - method: POST
    path: "/mdm/merge-proposals"
    description: "Propose a duplicate resolution between two records of one domain; the composite match score and confidence are computed server-side"
    roles: [DataSteward, DataOwner]
    code: 201
    input: [survivor_master_record_id, duplicate_master_record_id, name_similarity_pct, key_overlap_pct]
    output: MergeProposal
    side_effects:
      - "status = PROPOSED; domain_id copied from the survivor candidate; proposer_steward_id = acting X-User-ID"
      - "match_score and match_confidence computed"
  - method: GET
    path: "/mdm/merge-proposals"
    description: "List merge proposals filtered by domain, either candidate, the effective survivor, proposer, reviewer or status"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: ["domain_id?", "survivor_master_record_id?", "duplicate_master_record_id?", "effective_survivor_master_record_id?", "proposer_steward_id?", "reviewer_steward_id?", "status?", "limit?", "offset?"]
    output: MergeProposal[]
    side_effects: []
  - method: GET
    path: "/mdm/merge-proposals/{proposal_id}"
    description: "Read one merge proposal including the survivorship field map"
    roles: [GovernanceAdmin, DataOwner, DataSteward, Auditor]
    code: 200
    input: []
    output: MergeProposal
    side_effects: []
  - method: POST
    path: "/mdm/merge-proposals/{proposal_id}/review"
    description: "Take a PROPOSED merge under review"
    roles: [DataSteward, DataOwner]
    code: 200
    input: []
    output: MergeProposal
    side_effects: ["status = UNDER_REVIEW; reviewer_steward_id = acting X-User-ID"]
  - method: POST
    path: "/mdm/merge-proposals/{proposal_id}/decide"
    description: "Decide a merge under review as data owner: MERGE (applies survivorship), REJECT (terminal, no mutation) or REWORK (returns the proposal to the matcher)"
    roles: [DataOwner]
    code: 200
    input: [decision, "rework_note?", "override_justification?"]
    output: MergeProposal
    side_effects:
      - "MERGE: survivorship variant selected, effective survivor enriched from the loser, loser MERGED_AWAY and retracted, Domain counters recomputed, Domain.version incremented"
      - "REJECT: terminal with no record mutation"
      - "REWORK: reviewer cleared, proposal returns to the matcher"
  - method: POST
    path: "/mdm/merge-proposals/{proposal_id}/rescore"
    description: "Resubmit a REWORK proposal with fresh matching-engine percentages"
    roles: [DataSteward, DataOwner]
    code: 200
    input: [name_similarity_pct, key_overlap_pct]
    output: MergeProposal
    side_effects: ["match_score and match_confidence recomputed; status = PROPOSED; rework_count incremented"]

  # ---- Change requests ----
  - method: POST
    path: "/mdm/change-requests"
    description: "Raise a reference-data, hierarchy or classification change request in DRAFT"
    roles: [DataSteward, DataOwner]
    code: 201
    input: [domain_id, change_type, title, proposed_values]
    output: ChangeRequest
    side_effects: ["status = DRAFT; requester_steward_id = acting X-User-ID; structural derived from change_type"]
  - method: GET
    path: "/mdm/change-requests"
    description: "List change requests filtered by domain, requester, reviewer or status"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: ["domain_id?", "requester_steward_id?", "reviewer_steward_id?", "status?", "change_type?", "limit?", "offset?"]
    output: ChangeRequest[]
    side_effects: []
  - method: GET
    path: "/mdm/change-requests/{change_request_id}"
    description: "Read one change request including the impact assessment and freeze window"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []
  - method: POST
    path: "/mdm/change-requests/{change_request_id}/submit"
    description: "Submit a DRAFT or CHANGES_REQUESTED request; computes the downstream consumer impact assessment and the required notification lead time"
    roles: [DataSteward, DataOwner]
    code: 200
    input: []
    output: ChangeRequest
    side_effects:
      - "status = SUBMITTED, submitted_at = clock"
      - "impact_consumer_count, required_lead_days and earliest_apply_at computed; revision_cycle_count incremented when re-entering from CHANGES_REQUESTED"
  - method: POST
    path: "/mdm/change-requests/{change_request_id}/review"
    description: "Data owner takes a SUBMITTED request under review; the requester may not review their own request"
    roles: [DataOwner]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["status = UNDER_REVIEW; reviewer_steward_id = acting X-User-ID"]
  - method: POST
    path: "/mdm/change-requests/{change_request_id}/decide"
    description: "Approve, request changes on, or reject a request under review"
    roles: [DataOwner]
    code: 200
    input: [decision, "review_note?"]
    output: ChangeRequest
    side_effects:
      - "APPROVE: status = APPROVED, reviewer retained, impact assessment retained"
      - "REQUEST_CHANGES: status = CHANGES_REQUESTED, reviewer cleared, impact assessment reset to 0 / 0 / null"
      - "REJECT: status = REJECTED, reviewer retained, impact assessment retained for audit"
  - method: POST
    path: "/mdm/change-requests/{change_request_id}/schedule"
    description: "Schedule an APPROVED request, occupying a closed freeze window on the domain change calendar and notifying every impacted consumer"
    roles: [DataOwner]
    code: 200
    input: [scheduled_apply_at]
    output: ChangeRequest
    side_effects:
      - "status = SCHEDULED; freeze_window_start / freeze_window_end computed; increment Domain.scheduled_change_count by 1; increment Domain.version by 1"
      - "every impacted ACTIVE consumer gets pending_change_request_id and notified_at set, acknowledged_at cleared"
  - method: POST
    path: "/mdm/change-requests/{change_request_id}/apply"
    description: "Apply a SCHEDULED request once the clock has reached the scheduled instant and every TIER1 consumer has acknowledged; runs the 3-hop classification cascade"
    roles: [GovernanceAdmin]
    code: 200
    input: []
    output: ChangeRequest
    side_effects:
      - "hop 1 status = APPLIED, reference_data_revision incremented, classification uplifted, freeze window released, scheduled_change_count decremented, Domain.version incremented"
      - "hop 2 under-cleared consumers SUSPENDED; hop 3 in-flight change requests of the domain recompute their impact assessment"
      - "documented consumer lineage older than the new revision goes STALE; pending notifications cleared"
  - method: POST
    path: "/mdm/change-requests/{change_request_id}/withdraw"
    description: "Withdraw a non-terminal request, compensating the freeze-window occupancy and the consumer notifications"
    roles: [DataSteward, DataOwner]
    code: 200
    input: [withdraw_reason]
    output: ChangeRequest
    side_effects:
      - "status = WITHDRAWN; freeze window released; Domain.scheduled_change_count decremented when it was SCHEDULED; Domain.version incremented"
      - "every notified consumer has pending_change_request_id, notified_at, acknowledged_at and acknowledged_revision cleared; reference_data_revision unchanged"

  # ---- Downstream consumers and lineage ----
  - method: POST
    path: "/mdm/consumer-subscriptions"
    description: "Register a downstream consumer of the domain with its clearance, criticality tier and required notification lead days"
    roles: [GovernanceAdmin]
    code: 201
    input: [domain_id, consumer_code, reporting_asset_key, clearance_level, criticality, required_lead_days]
    output: ConsumerSubscription
    side_effects: ["status = ACTIVE, lineage_status = UNDOCUMENTED"]
  - method: GET
    path: "/mdm/consumer-subscriptions"
    description: "List consumer subscriptions filtered by domain, pending change request, status or lineage status"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: ["domain_id?", "pending_change_request_id?", "status?", "lineage_status?", "criticality?", "limit?", "offset?"]
    output: ConsumerSubscription[]
    side_effects: []
  - method: GET
    path: "/mdm/consumer-subscriptions/{subscription_id}"
    description: "Read one consumer subscription including its documented lineage path"
    roles: [GovernanceAdmin, DataOwner, DataSteward, ConsumerRep, Auditor]
    code: 200
    input: []
    output: ConsumerSubscription
    side_effects: []
  - method: PATCH
    path: "/mdm/consumer-subscriptions/{subscription_id}/lineage"
    description: "Document the lineage path from the authoritative source through transformations to the reporting asset"
    roles: [DataSteward, DataOwner]
    code: 200
    input: [lineage_path]
    output: ConsumerSubscription
    side_effects: ["lineage_status = DOCUMENTED; lineage_revision = Domain.reference_data_revision; lineage_documented_at = clock"]
  - method: POST
    path: "/mdm/consumer-subscriptions/{subscription_id}/acknowledge"
    description: "Consumer acknowledges the pending change notification, unblocking apply for TIER1 consumers"
    roles: [ConsumerRep]
    code: 200
    input: []
    output: ConsumerSubscription
    side_effects: ["acknowledged_at = clock; acknowledged_revision = Domain.reference_data_revision"]

  # ---- Test-driving surface ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. The clock starts at the fixed default 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, interval and lead-time rule is evaluated against this logical clock."
    roles: [GovernanceAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock repositioned; no entity is mutated and no scheduled action fires implicitly"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a declared role, or X-User-ID missing while the acting role is entity_backed (DataOwner, DataSteward, ConsumerRep)"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_DOMAIN_OWNER
    http: 403
    condition: "acting DataOwner holds no ACTIVE DATA_OWNER StewardAssignment on the target domain covering the clock"
  - id: ERR_NOT_DOMAIN_STEWARD
    http: 403
    condition: "acting DataSteward holds no ACTIVE StewardAssignment with steward_role IN {DATA_STEWARD, CUSTODIAN} on the target domain covering the clock"
  - id: ERR_NOT_SUBSCRIPTION_OWNER
    http: 403
    condition: "acting ConsumerRep's X-User-ID differs from the target ConsumerSubscription.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "requester attempts to review their own change request, planner attempts to waive their own finding, or proposer attempts to decide their own merge proposal"
  - id: ERR_CLEARANCE_INSUFFICIENT
    http: 403
    condition: "consumer clearance_level rank is below the domain classification_level rank, or a CLASSIFICATION_UPLIFT target is not strictly above the current level"
  - id: ERR_DOMAIN_NOT_FOUND
    http: 404
    condition: "domain_id in the path or body does not exist"
  - id: ERR_SOURCE_SYSTEM_NOT_FOUND
    http: 404
    condition: "source_system_id in the path or body does not exist"
  - id: ERR_STEWARD_NOT_FOUND
    http: 404
    condition: "steward_id, owner_steward_id or assigned_steward_id does not exist"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration_id in the path does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id in the path does not exist"
  - id: ERR_QUALITY_RULE_NOT_FOUND
    http: 404
    condition: "rule_id in the path does not exist"
  - id: ERR_SCORECARD_RUN_NOT_FOUND
    http: 404
    condition: "run_id in the path does not exist"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "finding_id in the path does not exist"
  - id: ERR_MASTER_RECORD_NOT_FOUND
    http: 404
    condition: "record_id in the path, or survivor/duplicate id in the body, does not exist"
  - id: ERR_MERGE_PROPOSAL_NOT_FOUND
    http: 404
    condition: "proposal_id in the path does not exist"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "change_request_id in the path does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription_id in the path does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, invalid enum member, out-of-range number, malformed measurements array, lineage_path shorter than 3, justification shorter than its minimum length"
  - id: ERR_STALE_DOMAIN_VERSION
    http: 412
    condition: "expected_domain_version does not equal the current Domain.version on a source-registration or steward-assignment create"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition does not exist from the resource's current state and no specialised state error covers the case (e.g. certify on a DECERTIFIED source, rescore on a PROPOSED proposal, submit on an APPLIED request)"
  - id: ERR_DOMAIN_NOT_DRAFT
    http: 409
    condition: "activate called on a domain whose status is not DRAFT"
  - id: ERR_DOMAIN_NOT_ACTIVE
    http: 409
    condition: "an operation that requires an ACTIVE domain (change-request submit, record publish) is attempted while the domain is DRAFT"
  - id: ERR_SOURCE_NOT_CERTIFIED
    http: 409
    condition: "curating a record or merging into a survivor whose SourceSystem.status is not CERTIFIED"
  - id: ERR_FINDING_ALREADY_CLOSED
    http: 409
    condition: "plan-remediation, resolve or waive on a finding whose status is RESOLVED or WAIVED"
  - id: ERR_RECORD_NOT_CURATED
    http: 409
    condition: "publishing or merging a record whose curation_status is not CURATED"
  - id: ERR_RECORD_ALREADY_PUBLISHED
    http: 409
    condition: "publish called on a record whose publication_status is already PUBLISHED"
  - id: ERR_PROPOSAL_NOT_UNDER_REVIEW
    http: 409
    condition: "decide called on a merge proposal whose status is not UNDER_REVIEW"
  - id: ERR_CHANGE_REQUEST_NOT_SCHEDULED
    http: 409
    condition: "apply called on a change request whose status is not SCHEDULED"
  - id: ERR_RULE_HAS_OPEN_FINDINGS
    http: 409
    condition: "retiring a quality rule that still has a finding with status IN {OPEN, REMEDIATION_PLANNED}"
  - id: ERR_CROSS_DOMAIN_MERGE
    http: 422
    condition: "the two merge candidates belong to different domains"
  - id: ERR_SELF_MERGE
    http: 422
    condition: "survivor_master_record_id equals duplicate_master_record_id"
  - id: ERR_UNKNOWN_RULE_CODE
    http: 422
    condition: "a measurements entry names a rule_code that is not an ACTIVE QualityRule of the scored domain"
  - id: ERR_HIERARCHY_CYCLE
    http: 422
    condition: "a HIERARCHY_RESTRUCTURE payload names the same node as both parent_node_key and child_node_key"
  - id: ERR_LINEAGE_SOURCE_MISMATCH
    http: 422
    condition: "lineage_path[0] does not equal the domain's authoritative_source_code"
  - id: ERR_LINEAGE_TARGET_MISMATCH
    http: 422
    condition: "the last lineage_path node does not equal the subscription's reporting_asset_key"
  - id: ERR_LINEAGE_CYCLE
    http: 422
    condition: "lineage_path repeats a node key, so the documented flow is not acyclic"
  - id: ERR_AUTHORITATIVE_SOURCE_UNDEFINED
    http: 422
    condition: "lineage documentation attempted while the domain has no ACTIVE AUTHORITATIVE registration, so no valid first node exists"
  - id: ERR_DOMAIN_POSTURE_BLOCKED
    http: 409
    condition: "publish while posture != OPEN, merge while posture == FROZEN, or apply while posture == FROZEN"
  - id: ERR_ASSIGNMENT_OVERLAP
    http: 409
    condition: "an incoming StewardAssignment's half-open interval intersects an ACTIVE assignment for the same (domain_id, steward_role) and supersede_incumbent is not an eligible resolution"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "effective_to is supplied and is not strictly after effective_from"
  - id: ERR_FREEZE_WINDOW_CONFLICT
    http: 409
    condition: "the computed freeze window clears another SCHEDULED window on the domain by less than 72 hours"
  - id: ERR_CHANGE_CALENDAR_CAPACITY
    http: 409
    condition: "a third SCHEDULED structural change request would fall within 30 days of two existing ones on the same domain"
  - id: ERR_LEAD_TIME_NOT_SATISFIED
    http: 409
    condition: "scheduled_apply_at is earlier than the computed earliest_apply_at"
  - id: ERR_APPLY_WINDOW_NOT_REACHED
    http: 409
    condition: "apply attempted while the logical clock is before scheduled_apply_at"
  - id: ERR_TIER1_ACK_MISSING
    http: 409
    condition: "apply attempted while a notified TIER1 consumer has not acknowledged"
  - id: ERR_LINEAGE_INCOMPLETE
    http: 409
    condition: "approving a structural change request while an ACTIVE TIER1 consumer's lineage_status is not DOCUMENTED"
  - id: ERR_NO_PENDING_NOTIFICATION
    http: 409
    condition: "acknowledge called on a subscription with no pending_change_request_id"
  - id: ERR_MATCH_SCORE_BELOW_FLOOR
    http: 422
    condition: "the computed match_score is below 45.00 at proposal creation or rescore"
  - id: ERR_MATCH_CONFIDENCE_TOO_LOW
    http: 422
    condition: "MERGE decided on a LOW-confidence proposal, or on a MEDIUM-confidence proposal without a >= 20 character override_justification"
  - id: ERR_RECORD_INCOMPLETE
    http: 422
    condition: "publish attempted on a record whose completeness_pct is below 60.00"
  - id: ERR_OWNER_NOT_PRINCIPAL
    http: 422
    condition: "a CRITICAL-severity quality rule names an owner whose certification_level is not PRINCIPAL"
  - id: ERR_DUE_DATE_IN_PAST
    http: 422
    condition: "plan-remediation due_at is not strictly after the logical clock"
  - id: ERR_ASSIGNMENT_STEWARD_NOT_ELIGIBLE
    http: 422
    condition: "plan-remediation names an assignee holding no ACTIVE StewardAssignment on the finding's domain covering the clock"
  - id: ERR_RESOLUTION_BELOW_THRESHOLD
    http: 422
    condition: "resolve supplies a verified_measured_pct below the rule's threshold_pct"
  - id: ERR_NO_QUALITY_RULES
    http: 422
    condition: "activate attempted on a domain with zero ACTIVE quality rules"
  - id: ERR_STEWARDSHIP_INCOMPLETE
    http: 422
    condition: "activate attempted without both an ACTIVE DATA_OWNER and an ACTIVE DATA_STEWARD assignment covering the clock"
  - id: ERR_NO_CERTIFIED_AUTHORITATIVE_SOURCE
    http: 422
    condition: "activate, or a CERTIFIED-basis scorecard run, attempted while the domain has no ACTIVE AUTHORITATIVE registration on a CERTIFIED source system"
  - id: ERR_DUPLICATE_DOMAIN_CODE
    http: 409
    condition: "a domain with the same code already exists"
  - id: ERR_DUPLICATE_SOURCE_CODE
    http: 409
    condition: "a source system with the same code already exists"
  - id: ERR_DUPLICATE_STEWARD_EMAIL
    http: 409
    condition: "a steward with the same email already exists"
  - id: ERR_DUPLICATE_RULE_CODE
    http: 409
    condition: "a quality rule with the same rule_code already exists on the domain"
  - id: ERR_DUPLICATE_CONSUMER_CODE
    http: 409
    condition: "a consumer subscription with the same consumer_code already exists"
  - id: ERR_DUPLICATE_NATURAL_KEY
    http: 409
    condition: "a master record with the same natural_key already exists for the (domain_id, source_system_id) pair"
  - id: ERR_RULE_WEIGHT_BUDGET_EXCEEDED
    http: 422
    condition: "the sum of weight_points over the domain's ACTIVE quality rules, including the incoming or updated rule, exceeds 100"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: GovernanceAdmin
    description: "Governance office operator. Owns the registries (domains, source systems, stewards, registrations, assignments, consumer subscriptions), certification of sources, domain activation, change application and the logical clock. Never makes a stewardship decision."
    identity: opaque
    exclusive_operations:
      - "POST /mdm/domains"
      - "POST /mdm/domains/{domain_id}/activate"
      - "POST /mdm/source-systems"
      - "POST /mdm/source-systems/{source_system_id}/certify"
      - "POST /mdm/source-systems/{source_system_id}/decertify"
      - "POST /mdm/stewards"
      - "POST /mdm/source-registrations"
      - "POST /mdm/steward-assignments"
      - "POST /mdm/consumer-subscriptions"
      - "POST /mdm/change-requests/{change_request_id}/apply"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: DataOwner
    description: "Steward accountable for a domain. Reviews and decides change requests, decides merge proposals, waives findings and schedules approved changes. Identified by X-User-ID = Steward.id and must hold an ACTIVE DATA_OWNER StewardAssignment on the target domain covering the clock."
    identity: "entity_backed:Steward"
    exclusive_operations:
      - "POST /mdm/quality-findings/{finding_id}/waive"
      - "POST /mdm/merge-proposals/{proposal_id}/decide"
      - "POST /mdm/change-requests/{change_request_id}/review"
      - "POST /mdm/change-requests/{change_request_id}/decide"
      - "POST /mdm/change-requests/{change_request_id}/schedule"
    shared_operations:
      - "POST /mdm/quality-rules"
      - "PATCH /mdm/quality-rules/{rule_id}"
      - "POST /mdm/domains/{domain_id}/scorecard-runs"
      - "POST /mdm/quality-findings/{finding_id}/plan-remediation"
      - "POST /mdm/quality-findings/{finding_id}/resolve"
      - "POST /mdm/master-records"
      - "POST /mdm/master-records/{record_id}/curate"
      - "POST /mdm/master-records/{record_id}/publish"
      - "POST /mdm/merge-proposals"
      - "POST /mdm/merge-proposals/{proposal_id}/review"
      - "POST /mdm/merge-proposals/{proposal_id}/rescore"
      - "POST /mdm/change-requests"
      - "POST /mdm/change-requests/{change_request_id}/submit"
      - "POST /mdm/change-requests/{change_request_id}/withdraw"
      - "PATCH /mdm/consumer-subscriptions/{subscription_id}/lineage"
      - "all GET endpoints"
  - name: DataSteward
    description: "Operational steward of a domain. Defines quality rules, runs scorecards, plans and resolves findings, curates and publishes master records, proposes and reviews merges, raises change requests and documents lineage. Identified by X-User-ID = Steward.id and must hold an ACTIVE DATA_STEWARD or CUSTODIAN StewardAssignment on the target domain covering the clock."
    identity: "entity_backed:Steward"
    exclusive_operations: []
    shared_operations:
      - "POST /mdm/quality-rules"
      - "PATCH /mdm/quality-rules/{rule_id}"
      - "POST /mdm/domains/{domain_id}/scorecard-runs"
      - "POST /mdm/quality-findings/{finding_id}/plan-remediation"
      - "POST /mdm/quality-findings/{finding_id}/resolve"
      - "POST /mdm/master-records"
      - "POST /mdm/master-records/{record_id}/curate"
      - "POST /mdm/master-records/{record_id}/publish"
      - "POST /mdm/merge-proposals"
      - "POST /mdm/merge-proposals/{proposal_id}/review"
      - "POST /mdm/merge-proposals/{proposal_id}/rescore"
      - "POST /mdm/change-requests"
      - "POST /mdm/change-requests/{change_request_id}/submit"
      - "POST /mdm/change-requests/{change_request_id}/withdraw"
      - "PATCH /mdm/consumer-subscriptions/{subscription_id}/lineage"
      - "all GET endpoints"
  - name: ConsumerRep
    description: "Downstream consumer representative. Acknowledges pending change notifications for its own subscription. Identified by X-User-ID = ConsumerSubscription.id."
    identity: "entity_backed:ConsumerSubscription"
    exclusive_operations:
      - "POST /mdm/consumer-subscriptions/{subscription_id}/acknowledge"
    shared_operations:
      - "GET /mdm/domains, GET /mdm/domains/{domain_id}, GET /mdm/domains/{domain_id}/scorecard"
      - "GET /mdm/source-systems, GET /mdm/source-systems/{source_system_id}"
      - "GET /mdm/source-registrations, GET /mdm/source-registrations/{registration_id}"
      - "GET /mdm/change-requests, GET /mdm/change-requests/{change_request_id}"
      - "GET /mdm/consumer-subscriptions, GET /mdm/consumer-subscriptions/{subscription_id}"
  - name: Auditor
    description: "Read-only governance auditor. Can read every resource, including master records and findings, but can never mutate anything."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
