  # ---------------------------------------------------------------- Rule 8 --
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_window_half_open_adjacency
        grounds:
          - validations[priority=12]
          - entities.EditorShiftWindow.fields.start_at
          - entities.EditorShiftWindow.fields.end_at
        distinguishing_aspect: |
          Resource Editor, HALF-OPEN semantics [start_at, end_at): a window
          starting exactly at another's end (12:00 after 08:00-12:00) is ALLOWED,
          while a strictly intersecting window (11:00-13:00) is rejected —
          adjacency permitted, intersection forbidden.
        test_recipe:
          setup:
            - "Editor E exists; no windows yet"
          setup_api_calls:
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-08-03T12:00:00Z", end_at: "2026-08-03T16:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T13:00:00Z" }, as: Editor, as_user_id: "${e}", captures: { err: $.data.error_id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-08-03T07:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "GET /editors/${e}/shift-windows", payload: {}, as: VendorAdmin }
          assert:
            - "[12:00,16:00) accepted — end == start adjacency is not an overlap under half-open semantics"
            - "[11:00,13:00) rejected with ERR_SHIFT_WINDOW_OVERLAP — strict interior intersection"
            - "[07:00,08:00) accepted — adjacency on the left boundary also allowed"
            - "GET /editors/{E}/shift-windows returns 3 windows total"

      - name: billing_period_closed_interval_touching_conflict
        grounds:
          - validations[priority=14]
          - entities.BillingPeriod.fields.period_start
          - entities.BillingPeriod.fields.period_end
        distinguishing_aspect: |
          Resource ClinicAccount, CLOSED-interval semantics [start, end]: a new
          period whose start EQUALS an existing period's end conflicts (touching
          endpoints share an instant) — the opposite adjacency treatment from
          shift windows, on a different resource entity.
        test_recipe:
          setup:
            - "Clinic C exists; one period P1 [2026-08-01T00:00:00Z, 2026-08-31T23:59:59Z]"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: VendorAdmin, captures: { bp1: $.data.id } }
          trigger:
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-08-31T23:59:59Z", period_end: "2026-09-30T23:59:59Z" }, as: VendorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }, as: VendorAdmin }
            - { call: "GET /clinic-accounts/${c}/billing-periods", payload: {}, as: VendorAdmin }
          assert:
            - "period starting at 2026-08-31T23:59:59Z rejected with ERR_BILLING_PERIOD_OVERLAP — closed intervals share that instant"
            - "period starting at 2026-09-01T00:00:00Z accepted — one second clear of the closed end"
            - "GET /clinic-accounts/{C}/billing-periods returns 2 periods"

  # ---------------------------------------------------------------- Rule 9 --
  - rule_id: compensating_invariant
    instances:
      - name: claim_release_conserves_active_claim_count
        grounds:
          - state_machines.DictationJob.QUEUED_to_EDITING
          - state_machines.DictationJob.EDITING_to_QUEUED
          - entities.Editor.fields.active_claim_count
        distinguishing_aspect: |
          Conserved quantity: pool claim slots. A claim/release pair must leave
          Editor.active_claim_count and the global sum of active claims
          unchanged, and the job returns to QUEUED with claimed fields cleared
          and due_at untouched (release is the exact compensating action).
        test_recipe:
          setup:
            - "Clinic C (ROUTINE tat 1440), provider P, editor E with wide window; ROUTINE job J created at T0 (due 2026-08-02T00:00:00Z); E.active_claim_count == 0"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id, due0: $.data.due_at, v0: $.data.version } }
          trigger:
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/release", payload: {}, as: Editor, as_user_id: "${e}" }
            - { call: "GET /editors/${e}", payload: {}, as: VendorAdmin, captures: { active: $.data.active_claim_count } }
            - { call: "GET /dictation-jobs/${j}", payload: {}, as: VendorAdmin, captures: { st: $.data.workflow_status, claimed: $.data.claimed_by_editor_id, due1: $.data.due_at, v1: $.data.version } }
          assert:
            - "Editor.active_claim_count == 0 after the pair (was 0 before; claim +1, release -1)"
            - "Global invariant: sum of active_claim_count over all editors == count of jobs in EDITING/SUBMITTED (here 0 == 0)"
            - "DictationJob.workflow_status == QUEUED and claimed_by_editor_id == null"
            - "DictationJob.due_at == 2026-08-02T00:00:00Z (unchanged by claim/release)"
            - "DictationJob.version == 3 (create, claim, release each increment exactly once)"

      - name: dispute_reversal_conserves_gross_equals_net_plus_credit
        grounds:
          - state_machines.BillingPeriod.FINALIZED_to_DISPUTED
          - state_machines.BillingPeriod.DISPUTED_to_FINALIZED
          - calculations.sla_credit_and_period_rollup
          - entities.BillingPeriod.fields.net_amount_cents
        distinguishing_aspect: |
          Conserved quantity: billing identity gross == net + credit. A finalize
          (credit applied) followed by dispute + resolve-dispute(REVERSED) — the
          compensating action — restores credit to 0 and net to gross; the
          identity holds at every step (94 + 11 == 105, then 105 + 0 == 105).
        test_recipe:
          setup:
            - "Clinic C (STAT tat 120, rate 35c, credit pct 10, END_TO_END); provider P; editor E with wide window"
            - "One STAT job created T0, claimed 00:10, submitted (131 visible chars -> 3 lines -> 105c) at 02:10, QA-passed -> breach (elapsed 130 > 120)"
            - "Period [2026-07-01, 2026-09-01] closed and finalized: gross 105, credit 11, net 94"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 35, breach_credit_pct: 10, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: RADIOLOGY }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: RADIOLOGY_REPORT, priority: STAT, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:10:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:10:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
