            - "trigger 1 returns HTTP 403 with ${sod_err} == ERR_SEGREGATION_OF_DUTIES"
            - "after trigger 1 the wave is untouched: status still LOADING and CustomerOrder.${order_id}.fulfillment_status still LOADED with billing_status AUTHORIZED"
            - "trigger 2 returns HTTP 200 with DeliveryWave.${wave_1}.status == DISPATCHED"
            - "CustomerOrder.${order_id}.fulfillment_status == DISPATCHED, billing_status == CAPTURED, captured_amount_cents == 1999 (1400 merchandise + 599 fee at surge 1.00)"
            - "Tote.${tote_id}.status == LOADED"
            - "loading-sequence run by planner-1 in setup was accepted, proving the SoD guard is scoped to dispatch alone"

  - section: complexity_layers
    # One instance per declared layer in §0.1 complexity_profile.complexity_layers:
    #   optimistic_concurrency  -> two instances, one per §1.2.1 concurrency_rules entry
    #   selector_policy         -> the deterministic-selector instance below
    #   cascading_side_effects  -> stub, owned by §1.8 transitive_cascade
    #   dual_variant_calculation-> stub, owned by §1.8 dual_variant_calc
    instances:
      - name: occ_booking_rejects_an_order_version_captured_before_a_second_line_was_added
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.booking-create-stale-order
          - endpoints.POST /slot-bookings.input.expected_order_version
          - validations[priority=10].ERR_STALE_VERSION
        distinguishing_aspect: "The client reads CustomerOrder.version, then adds a second line -- a write that bumps the order's version through a completely different endpoint -- and its booking attempt is refused with 412 while the slot ledger stays at zero held units; re-reading the order yields exactly the old version plus one and the identical payload then succeeds, and the successful booking bumps the version once more."
        test_recipe:
          setup:
            - "Route R1, AMBIENT zone A1, SKU AMB-1 (700 cents, 100 units), a far-future slot with total_capacity_units 10, and a BASIC customer holding a DRAFT order with one 2-unit AMB-1 line."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { slot_1: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "a@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v0: $.data.version }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_1}", customer_order_id: "${order_id}", units: 3, expected_order_version: "${order_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { stale_err: $.data.error_id }
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v1: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_1}", customer_order_id: "${order_id}", units: 3, expected_order_version: "${order_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v2: $.data.version }
          assert:
            - "trigger 1 returns HTTP 412 with ${stale_err} == ERR_STALE_VERSION"
            - "after trigger 1: DeliverySlot.${slot_1}.held_units == 0, confirmed_units == 0, available_units == 10, and GET /slot-bookings?customer_order_id=${order_id} returns total_count == 0"
            - "after trigger 1 CustomerOrder.${order_id}.version is unchanged, i.e. ${order_v1} == ${order_v0} + 1 (only the line create bumped it, the refused booking did not)"
            - "trigger 3 returns HTTP 201 with SlotBooking.${booking_id}.status == HELD, units == 3, surge_multiplier_at_booking == 1.00 and quoted_fee_cents == 599"
            - "after trigger 3: DeliverySlot.${slot_1}.held_units == 3 and available_units == 7"
            - "CustomerOrder.${order_id}.merchandise_subtotal_cents == 2100 (3 x 700), delivery_fee_cents == 599, order_total_cents == 2699"
            - "${order_v2} == ${order_v1} + 1, proving every accepted write increments version by exactly one"

      - name: occ_proposal_rejects_an_order_line_version_captured_before_the_previous_round
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.proposal-create-stale-order-line
          - endpoints.POST /substitution-proposals.input.expected_order_line_version
          - validations[priority=10].ERR_STALE_VERSION
        distinguishing_aspect: "The second OCC rule guards a different parent entity (OrderLine, not CustomerOrder) on a different endpoint, and the version that goes stale is bumped by the client's OWN previous proposal: round 1 increments OrderLine.version, so replaying the round-1 view to open round 2 is refused with 412 even though supersedes_proposal_id names a legitimately DECLINED proposal -- priority 10 fires before the priority-21 supersede check would have passed."
