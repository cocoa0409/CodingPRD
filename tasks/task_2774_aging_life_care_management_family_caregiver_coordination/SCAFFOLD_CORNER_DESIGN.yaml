            - "Accepting the assessment re-derives acuity_score/risk_posture and bumps again: ${cli_v2} == ${cli_v1} + 1"
            - "Plan creation with the pre-cascade version returns HTTP 412 with data.error_id == \"ERR_STALE_CLIENT_VERSION\" and creates nothing"
            - "The retry with ${cli_v2} returns HTTP 201; each subsequent write bumps the plan by exactly one: ${cp_v1} == ${cp_v0} + 1, ${cp_v2} == ${cp_v1} + 1, and ${cp_v3} == ${cp_v2} + 1 after the authorization is created"
            - "Only one CarePlan exists for the client: ${only_plan} == ${cp}"

