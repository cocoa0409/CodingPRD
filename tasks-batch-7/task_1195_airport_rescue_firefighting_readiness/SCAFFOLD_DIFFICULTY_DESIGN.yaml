# =============================================================================
# Task 1195: ARFF Readiness — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All recipes replay from empty-DB.
# Index constants: VEH_REQ {A:1,B:2,C:2,D:3,E:3}; WATER_REQ {A:100,B:1500,C:3000,D:4000,E:6000};
# STAFF_REQ {A:2,B:3,C:3,D:4,E:5}; DRY_CHEM equiv 1.2 gal/lb; substitution cap 0.5*WATER_REQ[I];
# drill thresholds first<=180s, all<=240s; training currency 12 calendar months (inclusive);
# report window 10 days (inclusive); cure deadline 30 days; water 137 c/gal; dry chem 89 c/lb.
# Narrative literal used below is >= 200 characters.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two calculations with divergent valid variants
  # on DIFFERENT entity domains (vehicle/agent capacity vs firefighter staffing)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dv_agent_capacity_rated_vs_measured_basis
        grounds:
          - calculations.fire_suppression_capacity_score
          - entities.ArffVehicle.fields.latest_readiness_result
          - entities.ReadinessCheck.fields.result
        distinguishing_aspect: |
          Agent-capacity domain (ArffVehicle/ReadinessCheck): with identical fleet rows the
          rated-capacity variant yields supported index C (rated 4000 gal >= 3000) while the
          measured-readiness production variant yields B (newest checks measured 1000 gal +
          capped dry-chem credit = 2200 < 3000 but >= 1500). The two variants disagree on the
          same rows; production uses measured. The airport first reaches full C compliance on
          full-measurement checks, then the reduced rechecks drive the downgrade.
        test_recipe:
          setup:
            - "Profile certificated C; one qualifying band-C aircraft (138.2 ft, 6.0 dep/day)"
            - "Two vehicles rated 2000 gal / 500 lb each, first measured at full capacity (equipment C, airport COMPLIANT)"
            - "Four deployment-ready firefighters (trained 2026-04-15) so staffing supports D and does not mask the equipment result"
            - "Rechecks at 00:05Z measure 500 gal / 500 lb each (PASS), dropping equipment support C -> B and creating a downgrade notification"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager, captures: { profile_id: $.data.id } }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager, captures: { ac1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:05:00Z" }, as: AirportManager }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 500, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 500, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
          trigger:
            - { call: "GET /arff/airport-profile/readiness", as: ArffChief, captures: { rd_equip: $.data.supported_index_by_equipment, rd_rated: $.data.rated_basis_supported_index, rd_eff: $.data.effective_index, rd_water: $.data.effective_water_gal_at_certificated_index, rd_notif: $.data.open_notification_id } }
          assert:
            - "readiness.supported_index_by_equipment == \"B\"  # measured: 1000 gal + min(1200, 750) = 1750 >= 1500; C needs 3000"
            - "readiness.rated_basis_supported_index == \"C\"      # rated: 4000 gal + min(1200, 1500) = 5200 >= 3000"
            - "readiness.effective_water_gal_at_certificated_index == 2200  # 1000 + min(1000*1.2, 0.5*3000)"
            - "readiness.effective_index == \"B\" and readiness.index_compliance_status == \"NONCOMPLIANT\""
            - "readiness.open_notification_id is not null"
            - "GET /arff/index-downgrade-notifications returns exactly one row with cause == \"EQUIPMENT\", prior_index == \"C\", downgraded_index == \"B\", status == \"PENDING\""

      - name: dv_staffing_roster_vs_deployment_ready_basis
        grounds:
          - calculations.staffing_supported_index
          - entities.Firefighter.fields.is_deployable
          - entities.Firefighter.fields.is_training_current
        distinguishing_aspect: |
          Firefighter-staffing domain (different entity domain from the agent-capacity
          instance): with identical roster data the roster variant yields supported index D
          (4 ACTIVE >= 4) while the deployment-ready production variant yields C (3 ready
          >= 3 but < 4), because one ACTIVE firefighter's training lapsed. Production uses
          deployment-ready.
        test_recipe:
          setup:
            - "Profile certificated C; qualifying band-C aircraft; fleet fully measured at rated 2000 gal / 500 lb each (equipment supports C)"
            - "Four ACTIVE firefighters; three trained 2026-04-15 (current), one trained 2025-03-10 (lapsed: month diff 14 > 12 at clock 2026-05-01)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2025-03-10", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
          trigger:
            - { call: "GET /arff/airport-profile/readiness", as: AirportManager, captures: { rd_staff: $.data.supported_index_by_staffing, rd_roster: $.data.roster_basis_supported_index, rd_eff: $.data.effective_index } }
            - { call: "GET /arff/firefighters/${ff4}", as: ArffChief, captures: { ff4_current: $.data.is_training_current, ff4_deployable: $.data.is_deployable } }
          assert:
            - "readiness.roster_basis_supported_index == \"D\"   # 4 ACTIVE >= STAFF_REQ[D]=4"
            - "readiness.supported_index_by_staffing == \"C\"      # 3 deployment-ready >= STAFF_REQ[C]=3 but < STAFF_REQ[D]=4"
            - "readiness.roster_active_count == 4 and readiness.deployment_ready_count == 3"
            - "readiness.effective_index == \"C\" and readiness.index_compliance_status == \"COMPLIANT\""
            - "Firefighter.${ff4}.is_training_current == false and Firefighter.${ff4}.is_deployable == false"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — two combinatorial calculations in DIFFERENT
  # modes: (a) multi-input non-linear tiered formula vs (b) pinned nested rounding
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_suppression_substitution_cap_binds
        grounds:
          - calculations.fire_suppression_capacity_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (water_sum, chem_sum, index tier) with non-linear nested
          min() substitution cap over a tiered requirement table and a state-conditioned
          input set (IN_SERVICE + latest check PASS). The cap is decisive: uncapped
          dry-chem credit (9600 gal) would meet Index C, but capped effective water is
          2300 gal < 3000, so the fleet supports only B.
        test_recipe:
          setup:
            - "Profile certificated C; qualifying band-C aircraft; 4 deployment-ready firefighters (staffing supports D)"
            - "Two vehicles rated 1000 gal / 5000 lb; measured 400 gal / 4000 lb each, checks PASS"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 1000, dry_chem_capacity_lb: 5000 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 1000, dry_chem_capacity_lb: 5000 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 400, dry_chem_available_lb: 4000, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 400, dry_chem_available_lb: 4000, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
          trigger:
            - { call: "GET /arff/airport-profile/readiness", as: ArffChief, captures: { rd_equip: $.data.supported_index_by_equipment, rd_water: $.data.effective_water_gal_at_certificated_index, rd_eff: $.data.effective_index } }
          assert:
            - "readiness.effective_water_gal_at_certificated_index == 2300  # 800 + min(8000*1.2, 0.5*3000) = 800 + 1500"
            - "readiness.supported_index_by_equipment == \"B\"  # B: 800 + min(9600, 750) = 1550 >= 1500 and 2 vehicles >= 2"
            - "readiness.effective_index == \"B\""

      - name: cf_agent_expense_per_line_rounding
        grounds:
          - calculations.agent_expenditure_total
          - entities.IncidentReport.fields.agent_expense_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from cf_suppression_substitution_cap_binds):
          scaffold pins round-per-line-then-sum. Lines 3.5 gal -> 479.5c -> 480c, twice;
          2.5 lb -> 222.5c -> 223c. Pinned total 1183c; the alternative sum-then-round
          yields 1182c, so the rounding order is observable.
        test_recipe:
          setup:
            - "Compliant index-C airport (fleet measured at rated 2000/500, 4 current firefighters)"
            - "Incident controlled at 2026-05-01T00:30:00Z (within the 10-day report window)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/incidents", payload: { alert_level: "ALERT_2", location: "Runway 09L midfield" }, as: ArffChief, captures: { inc1: $.data.id } }
            - { call: "POST /arff/incidents/${inc1}/respond", as: ArffChief }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:30:00Z" }, as: AirportManager }
            - { call: "POST /arff/incidents/${inc1}/control", as: ArffChief }
          trigger:
            - { call: "POST /arff/incidents/${inc1}/reports", payload: { narrative: "Aircraft N12345 experienced a hydraulic systems failure during landing rollout on runway 09L at 10:42Z. ARFF units RED-1 and RED-2 responded within three minutes, applied a foam blanket around the leaking left main gear, and escorted the airframe to the hardstand. No injuries.", agent_expenditure_lines: [ { vehicle_id: "${veh1}", water_gal_used: 3.5, dry_chem_lb_used: 0 }, { vehicle_id: "${veh2}", water_gal_used: 3.5, dry_chem_lb_used: 0 }, { vehicle_id: "${veh1}", water_gal_used: 0, dry_chem_lb_used: 2.5 } ] }, as: SafetyOfficer, as_user_id: "user-so-1", captures: { rep1: $.data.id, rep1_total: $.data.agent_expense_total_cents } }
          assert:
            - "IncidentReport.${rep1}.agent_expense_total_cents == 1183  # 480 + 480 + 223 per-line rounded; sum-then-round would give 1182"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — cyclic machines on DIFFERENT entities
  # (ArffVehicle readiness cycle vs IncidentReport review loop)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_vehicle_readiness_cycle
        grounds:
          - state_machines.ArffVehicle.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.ArffVehicle.OUT_OF_SERVICE_to_IN_SERVICE
        distinguishing_aspect: |
          ArffVehicle cycles IN_SERVICE -> OUT_OF_SERVICE -> IN_SERVICE -> OUT_OF_SERVICE;
          the cycle is repeatable and the already-out-of-service re-entry is rejected.
          Different entity from the IncidentReport loop instance.
        test_recipe:
          setup:
            - "Compliant index-C airport (2 vehicles measured at rated 2000/500, 4 current firefighters, band-C aircraft)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
          trigger:
            - { call: "POST /arff/vehicles/${veh1}/out-of-service-events", payload: { reason: "Foam pump failure" }, as: ArffChief, captures: { oos1: $.data.id } }
            - { call: "POST /arff/vehicles/${veh1}/out-of-service-events", payload: { reason: "Second open attempt" }, as: ArffChief, captures: { err_oos2: $.data.error_id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/out-of-service-events/${oos1}/restore", as: ArffChief }
            - { call: "POST /arff/vehicles/${veh1}/out-of-service-events", payload: { reason: "Turntable repair" }, as: ArffChief, captures: { oos2: $.data.id } }
            - { call: "GET /arff/vehicles/${veh1}", as: ArffChief, captures: { veh1_status: $.data.status } }
          assert:
            - "ArffVehicle.${veh1}.status == \"OUT_OF_SERVICE\" after first and third triggers (cycle re-entered)"
            - "${err_oos2} == \"ERR_VEHICLE_ALREADY_OUT_OF_SERVICE\""
            - "OutOfServiceEvent.${oos2}.id != OutOfServiceEvent.${oos1}.id  # each loop iteration creates a new event"
            - "GET /arff/index-downgrade-notifications shows exactly one RESOLVED notification (from the first OOS/restore loop) and exactly one PENDING notification (from the second OOS)"

      - name: nl_report_review_revision_loop
        grounds:
