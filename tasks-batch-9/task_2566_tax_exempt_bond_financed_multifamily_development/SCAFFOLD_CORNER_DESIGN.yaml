      - name: clock_past_the_extended_use_end_releases_the_agreement_and_its_units_and_locks_patches
        claim_type: conditional_cascade
        grounds:
          - state_machines.Project.RESTRICTED_to_EXTENDED_USE
          - state_machines.Project.EXTENDED_USE_to_RELEASED
          - state_machines.RegulatoryAgreement.RECORDED_to_RELEASED
          - state_machines.UnitRestriction.ACTIVE_to_RELEASED
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[PATCH /unit-restrictions/{id}]
          - errors[ERR_UNIT_RESTRICTION_STATE_INVALID]
          - entities.UnitRestriction.fields.restricted_rent_cents
        distinguishing_aspect: |
          One clock advance to 2057-03-02 crosses BOTH declared time gates in a
          single pass - compliance_end_date 2042-03-01 and extended_use_end_date
          2057-03-01 - so the compliance axis must land on RELEASED rather than
          stopping at the intermediate EXTENDED_USE. The release cascades only
          into ACTIVE units, clearing restricted_rent_cents from 109,500 to null
          on the restricted rows while the market rows (already null) simply
          become RELEASED, and a later PATCH on a RELEASED row is refused.
