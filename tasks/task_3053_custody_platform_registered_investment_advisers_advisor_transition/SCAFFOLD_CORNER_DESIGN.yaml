              as: CustodyOperationsOfficer
              captures: { agr2_id: $.data.id }
            - call: "POST /ria/households"
              payload: { firm_id: "${f2_id}", household_name: "Nakamura Family" }
              as: AdvisorOperationsLead
              captures: { h2_id: $.data.id }
          trigger:
            - call: "GET /ria/households"
              as: AdvisorOperationsLead
            - call: "GET /ria/households?firm_id=${f2_id}"
              as: AdvisorOperationsLead
          assert:
            - "the unfiltered household list contains both households"
            - "the firm-2-filtered list contains exactly one row, Household.${h2_id}"
            - "Household.${h_id}.firm_id == ${f_id} and Household.${h2_id}.firm_id == ${f2_id}"
            - "GET /ria/firms/${f2_id} reports household_fee_basis_total_cents 0 while firm 1's total is independent of it"

      - name: pagination_and_filtering_on_accounts
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/ria/accounts
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filter and paginate interact correctly: with limit 2 over four accounts the first page reports total_count 4 and has_more true, and the account_status filter narrows total_count without disturbing the offset semantics."
