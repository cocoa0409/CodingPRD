  - rule_id: priority_pair_validation_conflict
    instances:
      - name: billing_hold_gate_preempts_study_state_rung_on_repeat
        grounds:
          - validations[priority=9]
          - validations[priority=19]
          - write_gate_precedence.order.G2_CLINIC_BILLING_HOLD
          - errors[ERR_CLINIC_BILLING_HOLD]
          - errors[ERR_STUDY_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair business_fiscal (rung 9) versus state (rung 19).
          A repeat is requested on a study still in ORDERED — which rung 19
          would reject with ERR_STUDY_INVALID_STATE — while the clinic sits on
          a billing hold. The write gate at rung 9 pre-empts everything from
          rung 13 onward, so the response is ERR_CLINIC_BILLING_HOLD and the
          state error never surfaces.
        test_recipe:
          setup:
            - "one clinic whose billing_hold_status has been set to HOLD"
            - "one TELERAD study still in workflow_status ORDERED under that clinic"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Arrears Vet", address_zone: "Z10" }
              as: PlatformAdmin
              captures: { cl_g: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cl_g}", patient_name: "Toby", species: "FELINE", study_kind: "TELERAD", requested_modality: "RADIOGRAPHY", priority: "ROUTINE", clinical_history: "limping" }
              as: ClinicUser
              as_user_id: "${cl_g}"
              captures: { rf_g: $.data.id }
            - call: "POST /referrals/${rf_g}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rf_g}" }
              as: Scheduler
              captures: { ap_g: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_g}", modality: "RADIOGRAPHY", body_region: "LEFT_HOCK" }
              as: ClinicUser
              as_user_id: "${cl_g}"
              captures: { s_g: $.data.id }
            - call: "POST /clinics/${cl_g}/billing-hold"
              payload: { billing_hold_status: "HOLD" }
              as: BillingAdmin
          trigger:
            - call: "POST /studies/${s_g}/repeat"
              payload: { repeat_cause: "CLINICIAN_EXTRA_VIEWS" }
              as: ClinicUser
              as_user_id: "${cl_g}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CLINIC_BILLING_HOLD"
            - "HTTP status == 409"
            - "Study.${s_g}.workflow_status == ORDERED"
            - "Study.${s_g}.repeat_count == 0"
            - "GET /studies?repeat_of_study_id=${s_g} returns 0 rows"

      - name: equipment_quarantine_gate_preempts_modality_mismatch_rung
        grounds:
          - validations[priority=11]
          - validations[priority=27]
          - write_gate_precedence.order.G4_EQUIPMENT_CALIBRATION
          - errors[ERR_EQUIPMENT_QUARANTINED]
          - errors[ERR_EQUIPMENT_MODALITY_MISMATCH]
        distinguishing_aspect: |
          A different error-category pair: business_safety (rung 11) versus
          business_referential (rung 27). The acquire names a RADIOGRAPHY unit
          for an ULTRASOUND study — a rung-27 violation — but that unit is also
          QUARANTINED, and gate G4 at rung 11 pre-empts every rung from 13
          onward, so ERR_EQUIPMENT_QUARANTINED wins.
        test_recipe:
          setup:
            - "one mobile unit carrying a calibrated RADIOGRAPHY modality unit that has just failed its QC check and is QUARANTINED"
            - "one ULTRASOUND study ORDERED at an ARRIVED stop of that unit's dispatched route"
            - "the acting technician is certified for both RADIOGRAPHY and ULTRASOUND and staffs the route"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Quarantine Vet", address_zone: "Z11" }
              as: PlatformAdmin
              captures: { cl_k: $.data.id }
            - call: "POST /mobile-units"
