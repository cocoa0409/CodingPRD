            - "GET /compliance/price-comparison-tools/${tool} -> data.outage_windows has 4 entries (the array is append-only and is NOT rewritten into merged form)"
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 0, data.tool_sla_breach_count == 0, data.penalty_exposure_cents == 0"

