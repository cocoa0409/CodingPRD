              captures: { due_v3: $.data.next_order_due_date, count_v3: $.data.autoship_item_count }
          assert:
            - "the call is accepted because a 42-day cadence from 2026-09-02 ends 2026-10-14, which lies before blackout_start_date 2026-10-10 is exceeded"
            - "AutoshipItem.${item_v3a}.cadence_days == ${ok_v3} == 42"
            - "the plan due date is recomputed from the earliest remaining item: AutoshipPlan.${plan_v3}.next_order_due_date == ${due_v3} == 2026-09-02T00:00:00Z with both items dated from the same day"
            - "AutoshipPlan.${plan_v3}.autoship_item_count == ${count_v3} == 2, so neither item left the plan through a cadence change"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: compose_bundles_every_due_item_into_one_order
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/v1/autoship-plans/{id}/compose
          - entities.Order.fields.bundle_line_count
        excluded_because:
          difficulty_instance: discount_rounding_order_changes_the_order_total
          rationale: "The two-item bundling and its line count are part of that §1.8 instance's fixture."
      - name: ship_commits_and_dispatch_consumes_refills
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/v1/orders/{id}/ship
          - state_machines.Order.PROCESSING_to_SHIPPED
        excluded_because:
          difficulty_instance: battery_capacity_ladder_and_guard_price_interact
          rationale: "The pack-and-dispatch path, including the reserved cold-pack units, is driven end to end in that instance."

      - name: callback_attempt_beyond_the_cap_leaves_the_prescription_failed
        claim_type: Action endpoint
        grounds:
          - state_machines.Prescription.VERIFICATION_IN_PROGRESS_to_VERIFICATION_FAILED
          - errors.ERR_INVALID_STATE
          - validations[priority=4]
        distinguishing_aspect: "The callback action endpoint is refused at its fourth invocation because VERIFICATION_FAILED is terminal for that trigger, so the endpoint's preconditions rather than the count arbitrate the refusal."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A prescription failed by the third callback attempt."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "EPT-01", product_name: "Callback cap pack", medication_scope: "PRESCRIPTION", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 2200 }
              as: PlatformAdmin
              captures: { prod_ep1: $.data.id }
            - call: "POST /v1/veterinarians"
              payload: { full_name: "Dr Selma Ortiz", clinic_name: "Rio Vet", clinic_phone: "4155550107", vet_email: "sortiz@riovet.example", license_number: "VET-CA-9007", license_state: "CA" }
              as: PharmacyTechnician
              captures: { vet_ep1: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Fern", species: "CAT", breed: "Somali", weight_kg: 3.8, owner_state: "CA" }
              as: Customer
              captures: { pet_ep1: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_ep1}" }
              as: Customer
              as_user_id: "${pet_ep1}"
              captures: { plan_ep1: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_ep1}/items"
              payload: { product_id: "${prod_ep1}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_ep1}"
              captures: { item_ep1: $.data.id }
            - call: "POST /v1/prescriptions"
              payload: { autoship_item_id: "${item_ep1}", prescriber_id: "${vet_ep1}", script_source: "UPLOADED_SCRIPT", script_document_id: "doc-cap-1", drug_schedule: "NONE", temperature_sensitive: false, authorized_qty_total: 90, refills_authorized: 5 }
              as: PharmacyTechnician
              captures: { rx_ep1: $.data.id }
            - call: "POST /v1/prescriptions/${rx_ep1}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
            - call: "POST /v1/prescriptions/${rx_ep1}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
            - call: "POST /v1/prescriptions/${rx_ep1}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
          trigger:
            - call: "POST /v1/prescriptions/${rx_ep1}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
              captures: { err_ep1: $.data.error_id }
          assert:
            - "the fourth attempt is refused with error_id == ${err_ep1} == \"ERR_INVALID_STATE\" and http status 409"
            - "Prescription.${rx_ep1}.callback_attempt_count is still 3, so the refused call did not increment it"
            - "Prescription.${rx_ep1}.rx_status is still VERIFICATION_FAILED"
            - "reopening through POST /v1/prescriptions/${rx_ep1}/reopen resets the count to 0 and returns the prescription to PENDING_VERIFICATION, so the cycle is repeatable rather than permanently capped"

      - name: shipment_creation_without_an_order_below_it_is_refused
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/v1/shipments
          - validations[priority=3]
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The shipment endpoint validates its referenced order before any business rule, so an unresolvable order id returns the existence error rather than a licence or capacity error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No order exists and no site is licensed for the destination."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/shipments"
              payload: { order_id: "00000000-0000-4000-8000-000000000000" }
              as: PharmacyTechnician
              captures: { err_ep2: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ${err_ep2} == \"ERR_RESOURCE_NOT_FOUND\""
            - "the licence and capacity rules are not reached, so the message does not mention a site"
            - "no shipment row was created: GET /v1/shipments returns 0 rows"

      - name: an_order_can_only_be_shipped_once
        claim_type: Conditional action
        grounds:
          - validations[priority=21]
          - errors.ERR_ORDER_ALREADY_SHIPPED
          - endpoints.POST_/v1/shipments
        distinguishing_aspect: "A second shipment against the same order is refused by the one-to-one referential rule, so the validity of the action depends on whether a sibling row already exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An order that already has one shipment."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
