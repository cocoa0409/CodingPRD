      - name: approve_then_evaluate_immediately_reflects_totals
        claim_type: immediate_visibility
        grounds: [calculations.credit_totals, 'endpoints[POST /recertification-records/{recordId}/evaluate]']
        distinguishing_aspect: "Immediate consistency: an approve followed by an evaluate in the next request already reports official_service_hours 5.0 — no lag, no stale cache."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE with PENDING record; one PENDING 5.0 SERVICE entry"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 5.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator }
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator, captures: { off: $.data.official_service_hours } }
          assert:
            - "captured off == 5.0   (visible on the very next request)"

