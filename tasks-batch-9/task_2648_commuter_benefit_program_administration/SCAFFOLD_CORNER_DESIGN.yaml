  # ===========================================================================
  - section: errors
    instances:
      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: Triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=10]
          - roles
        distinguishing_aspect: "Priority 10 outranks even existence: a read with NO X-User-Role header, and a read carrying the undeclared role 'SuperAdmin', must both return ERR_UNAUTHENTICATED (401) against a REAL employer id - so the failure cannot be confused with a 404 or with the 403 of ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "Employer 'Auth Gate Co' exists in DRAFT in US-TX-AUS; no other state is needed because authentication is checked before everything else."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Auth Gate Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
          trigger:
            - call: "GET /benefits/employers/${er_id}"
              payload: {}
              as: "<no X-User-Role header sent>"
              captures: { no_header_error: $.data.error_id }
            - call: "GET /benefits/employers/${er_id}"
              payload: {}
              as: "SuperAdmin"
              captures: { bad_role_error: $.data.error_id }
          assert:
            - "both attempts return HTTP 401"
            - "${no_header_error} == ERR_UNAUTHENTICATED"
            - "${bad_role_error} == ERR_UNAUTHENTICATED"
            - "${bad_role_error} is NOT ERR_ROLE_NOT_PERMITTED - an undeclared role fails authentication, not authorization"

      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: Triggerable
        grounds:
          - errors.ERR_EMPLOYER_NOT_FOUND
          - errors.ERR_ELECTION_WINDOW_NOT_FOUND
          - errors.ERR_BENEFIT_ACCOUNT_NOT_FOUND
          - errors.ERR_TRANSIT_MEDIA_NOT_FOUND
          - errors.ERR_ORDER_BATCH_NOT_FOUND
          - errors.ERR_MEDIA_ORDER_NOT_FOUND
          - errors.ERR_CARD_TRANSACTION_NOT_FOUND
          - errors.ERR_SUBSTANTIATION_CLAIM_NOT_FOUND
          - errors.ERR_PAYROLL_FILE_NOT_FOUND
          - validations[priority=30]
        distinguishing_aspect: "One well-formed but unknown UUID sent to nine different single-resource reads must produce NINE DIFFERENT error ids, all 404 - an implementation with a single generic ERR_NOT_FOUND, or one that reuses ERR_EMPLOYER_NOT_FOUND everywhere, fails on the second row onward."
        test_recipe:
          setup:
            - "The database is empty of every entity below; 00000000-0000-4000-8000-00000000dead belongs to nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /benefits/employers/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: ProgramAdmin
              captures: { er_err: $.data.error_id }
            - call: "GET /benefits/election-windows/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: ProgramAdmin
              captures: { win_err: $.data.error_id }
            - call: "GET /benefits/benefit-accounts/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: ProgramAdmin
              captures: { acct_err: $.data.error_id }
            - call: "GET /benefits/transit-media/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: OrderDesk
              as_user_id: "desk-probe"
              captures: { med_err: $.data.error_id }
            - call: "GET /benefits/order-batches/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: OrderDesk
              as_user_id: "desk-probe"
              captures: { batch_err: $.data.error_id }
            - call: "GET /benefits/media-orders/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: OrderDesk
              as_user_id: "desk-probe"
              captures: { order_err: $.data.error_id }
            - call: "GET /benefits/card-transactions/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-probe"
              captures: { tx_err: $.data.error_id }
            - call: "GET /benefits/substantiation-claims/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-probe"
              captures: { claim_err: $.data.error_id }
            - call: "GET /benefits/payroll-files/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: PayrollProcessor
              as_user_id: "pay-probe"
              captures: { pf_err: $.data.error_id }
          assert:
            - "all nine attempts return HTTP 404"
            - "${er_err} == ERR_EMPLOYER_NOT_FOUND"
            - "${win_err} == ERR_ELECTION_WINDOW_NOT_FOUND"
            - "${acct_err} == ERR_BENEFIT_ACCOUNT_NOT_FOUND"
            - "${med_err} == ERR_TRANSIT_MEDIA_NOT_FOUND"
            - "${batch_err} == ERR_ORDER_BATCH_NOT_FOUND"
            - "${order_err} == ERR_MEDIA_ORDER_NOT_FOUND"
            - "${tx_err} == ERR_CARD_TRANSACTION_NOT_FOUND"
            - "${claim_err} == ERR_SUBSTANTIATION_CLAIM_NOT_FOUND"
            - "${pf_err} == ERR_PAYROLL_FILE_NOT_FOUND"

      - name: out_of_range_limit_and_negative_offset_are_rejected
        claim_type: Triggerable
        grounds:
          - errors.ERR_INVALID_PAGINATION
          - validations[priority=36]
          - endpoints.GET_/benefits/employers
        distinguishing_aspect: "The three edges of the declared 1..100 / >= 0 window: limit 0, limit 101 and offset -1 must each return ERR_INVALID_PAGINATION (422), while limit 100 with offset 0 - the largest legal page - must return 200. An implementation that clamps silently instead of rejecting passes the fourth call and fails the first three."
        test_recipe:
          setup:
            - "One employer 'Page Guard Co' exists so the list endpoint has a row to return on the legal call."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Page Guard Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
          trigger:
            - call: "GET /benefits/employers?limit=0"
              payload: {}
              as: ProgramAdmin
              captures: { zero_err: $.data.error_id }
            - call: "GET /benefits/employers?limit=101"
              payload: {}
              as: ProgramAdmin
              captures: { over_err: $.data.error_id }
            - call: "GET /benefits/employers?offset=-1"
              payload: {}
              as: ProgramAdmin
              captures: { neg_err: $.data.error_id }
            - call: "GET /benefits/employers?limit=100&offset=0"
              payload: {}
              as: ProgramAdmin
              captures: { ok_head: "$.data[0].legal_name" }
          assert:
            - "the first three attempts each return HTTP 422"
            - "${zero_err} == ERR_INVALID_PAGINATION"
            - "${over_err} == ERR_INVALID_PAGINATION"
            - "${neg_err} == ERR_INVALID_PAGINATION"
            - "the fourth attempt returns HTTP 200 with total_count 1, limit 100, offset 0 and has_more false"
            - "${ok_head} == Page Guard Co"

