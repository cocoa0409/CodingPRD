            - "IdentityLink.${link_id}.status == CONFIRMED with decided_by_user_id == \"system\" — 1.0000 >= auto_merge_threshold 0.92 auto-merges at creation"
            - "IdentityLink.${link_id}.survivor_profile_id == ${p1_id} — the source_record_count and trust_tier discriminators tie, so the earlier created_at wins"
