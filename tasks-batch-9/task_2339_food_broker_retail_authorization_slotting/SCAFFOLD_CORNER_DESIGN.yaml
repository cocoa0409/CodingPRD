          assert:
            - "Calls 1-13 every one return 403 ERR_ROLE_FORBIDDEN: BrokerAdmin's contract writes are closed to the account manager and the portal user, the account manager's item/catalog writes are closed to the buyer and the audit manager, catalog-decision and the review calendar are RetailerBuyer-exclusive, POST /distribution-snapshots and POST /deductions are RetailerBuyer-exclusive, dispute is account-manager-exclusive and approve-recovery audit-exclusive"
            - "Call 9 shows the role check outranks existence: an unknown authorization_id and a non-UUID expected_authorization_version are both present, yet the reported id is ERR_ROLE_FORBIDDEN (priority 2), not ERR_AUTHORIZATION_NOT_FOUND or ERR_INVALID_REQUEST"
            - "Call 13 shows GET /principals/{principalId}/commission-statement is the one read the RetailerBuyer is denied — it is not in that role's shared reads"
            - "No forbidden call had any effect: GET /retailers returns total_count 1, GET /items total_count 1, GET /deductions total_count 1, GET /commission-agreements total_count 0, and Principal ${prin}.slotting_budget_cents is still 20000000 with version 1"
            - "Call 14 returns 200 with ${now} == 2026-08-02T00:00:00Z — POST /_clock/set_current_utc is the single write shared by all five roles, including the read-only portal user"
            - "Call 15 returns 200 with ${rn} == Bigmart (all GET reads are shared) and call 16 returns 200 with ${ds} == FILED from the correct role"

      - name: portal_user_reads_are_scoped_to_its_own_principal_and_never_write
