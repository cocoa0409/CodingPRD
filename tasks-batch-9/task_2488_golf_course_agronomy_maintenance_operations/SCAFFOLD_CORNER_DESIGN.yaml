              payload: { hours_added: 10 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { unit_hours: $.data.engine_hours, unit_status: $.data.status }
          assert:
            - "the plan create returns HTTP 201 with AgronomicPlan.${plan_id}.status == DRAFT and version == 1"
            - "the application returns HTTP 201 with Application.${app1_id}.total_lb == 13.77 and nitrogen_lb == 6.33"
            - "the certification returns HTTP 200 with ${cert_index} == 100.00 and ${cert_status} == CERTIFIED (every reading sits exactly on target, so all three per-area indices are 100.00)"
            - "PlayEvent.${pe1_id}.status == SCHEDULED: certification is the readiness dimension and does not touch the schedule dimension"
            - "the hour log returns HTTP 200 with ${unit_hours} == 10.0, hours_since_service == 10.0 and ${unit_status} == IN_SERVICE (10 is below the 250 hour interval)"

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_plan_version_blocks_task_scheduling
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-task-schedule-stale-plan]
          - validations[priority=26]
          - errors[ERR_STALE_PLAN_VERSION]
        distinguishing_aspect: "Covers concurrency_rules.plan-task-schedule-stale-plan on its declared write_endpoint POST /plan-tasks/{id}/schedule with its declared occ_field expected_plan_version: a sibling scheduling that touched nothing this caller cares about still invalidates the token, the refusal leaves the task and the window untouched, and the same call with the refetched version succeeds."
        test_recipe:
          setup:
            - "One course; one 5500 sq ft GREEN on hole 12 and one 130000 sq ft FAIRWAY on hole 5."
            - "One ACTIVE 2026 plan with a 40.00 lb budget carrying a FERTILITY task on the green at 0.85 lb/1000 and an AERATION task on the fairway, both planned for the whole of August."
            - "Two non-overlapping SCHEDULED windows, one per turf area, each two hours long."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 60, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "FAIRWAY", hole_number: 5, area_sq_ft: 130000, mowing_height_mm: 11.0, distance_to_water_ft: 90, soil_type: "NATIVE_LOAM" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { fw5_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-01T00:00:00Z", planned_window_end: "2026-08-31T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task_fert_id: $.data.id, task_fert_commitment: $.data.commitment_lb }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${fw5_id}", task_type: "AERATION", planned_window_start: "2026-08-01T00:00:00Z", planned_window_end: "2026-08-31T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task_aer_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T08:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_fert_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${fw5_id}", task_type: "AERATION", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T08:00:00Z", crew_size: 4 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_aer_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
          trigger:
            - call: "POST /plan-tasks/${task_aer_id}/schedule"
              payload: { maintenance_window_id: "${w_aer_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task_aer_status: $.data.status }
            - call: "POST /plan-tasks/${task_fert_id}/schedule"
              payload: { maintenance_window_id: "${w_fert_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /agronomic-plans/${plan_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
