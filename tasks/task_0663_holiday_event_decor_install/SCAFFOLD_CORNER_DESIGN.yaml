            - "meta.total_count == 1 and meta.has_more == false"

      - name: renewal_chain_reverse_reachable_by_renewed_from
        claim_type: Cross-reference link
        grounds: [entities.Contract.fields.renewed_from_contract_id]
        excluded_because:
          difficulty_instance: renewal_accept_depth3_new_contract_and_expire
          rationale: "GET /contracts?renewed_from_contract_id=... is exercised in the named §1.8 cascade assert."

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: stale_contract_version_on_renewal_offer_create
        claim_type: violation_to_error
        grounds: ["concurrency_rules[renewal-offer-create-stale-contract]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "Creating a RenewalOffer after the Contract.version advanced past the observed value → ERR_STALE_CONTRACT_VERSION 412."
        test_recipe:
          setup: ["ACTIVE COMMERCIAL contract; client observed version V at activate; a first renewal-offer create bumps version to V+1"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Papa2 Co", account_type: "COMMERCIAL", contact_email: "p2@x.test", site_address: "43 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-P2", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "T" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
              captures: { contract_v_active: $.data.version }
            - call: "POST /contracts/${contract_id}/renewal-offers"
              payload: { expires_at: "2026-12-31T00:00:00Z", expected_contract_version: "${contract_v_active}" }
              as: AccountManager
          trigger:
            - call: "POST /contracts/${contract_id}/renewal-offers"
              payload: { expires_at: "2026-12-31T00:00:00Z", expected_contract_version: "${contract_v_active}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_CONTRACT_VERSION"

      - name: stale_contract_version_on_proposal_accept
        claim_type: violation_to_error
        grounds: ["concurrency_rules[proposal-accept-stale-contract]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "Accepting a sibling proposal carrying a deliberately stale contract version (observed value minus 1) → ERR_STALE_CONTRACT_VERSION 412."
        test_recipe:
          setup: ["a PROPOSED contract with two SUBMITTED proposals; first accept bumps Contract.version"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Quebec2 Co", account_type: "COMMERCIAL", contact_email: "q2@x.test", site_address: "44 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-Q2", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "Plan A" }
              as: AccountManager
              captures: { proposal_a: $.data.id }
            - call: "POST /design-proposals/${proposal_a}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_a}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "Plan B" }
              as: AccountManager
              captures: { proposal_b: $.data.id }
            - call: "POST /design-proposals/${proposal_b}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 6, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_b}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_a}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { contract_v2: $.data.version }
          trigger:
            - call: "POST /design-proposals/${proposal_b}/accept"
              payload: { expected_contract_version: "${contract_v2} - 1" }
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_CONTRACT_VERSION"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: field_supervisor_cannot_create_client
        claim_type: forbidden_operation
        grounds: [roles.AccountManager, roles.FieldSupervisor, "validations[priority=2]"]
        distinguishing_aspect: "FieldSupervisor calling POST /clients (an AccountManager exclusive op) → ERR_FORBIDDEN_ROLE 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Romeo2 Co", account_type: "COMMERCIAL", contact_email: "r2@x.test", site_address: "45 St" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: wrong_client_contact_cannot_sign_other_clients_contract
        claim_type: forbidden_operation
        grounds: [roles.ClientContact, "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A ClientContact whose X-User-ID is a different Client signing a PROPOSED contract → ERR_NOT_RESOURCE_OWNER 403."
        test_recipe:
          setup: ["Client A owns a PROPOSED contract with one ACCEPTED proposal; Client B exists as a separate ClientContact identity"]
