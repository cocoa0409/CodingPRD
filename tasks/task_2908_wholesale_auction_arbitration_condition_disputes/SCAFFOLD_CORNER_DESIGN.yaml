      # --- corners already covered by §1.8 -----------------------------------
      - name: suspended_buyer_outranks_the_expired_window_excluded
        claim_type: priority_conflict
        grounds:
          - validations[priority 27 ERR_BUYER_PRIVILEGE_SUSPENDED]
          - validations[priority 33 ERR_ARBITRATION_WINDOW_EXPIRED]
        excluded_because:
          difficulty_instance: validation_priority_conflict / pair_a_suspended_buyer_beats_expired_window_rejected
          rationale: "That instance files a claim that violates both rules at once and asserts the priority-27 error, and also asserts each rule alone, which is the whole priority-conflict claim for this pair."

      - name: mandatory_unwind_outranks_the_over_cap_allowance_excluded
        claim_type: priority_conflict
        grounds:
          - validations[priority 42 ERR_UNWIND_MANDATORY]
          - validations[priority 47 ERR_ALLOWANCE_EXCEEDS_CAP]
        excluded_because:
          difficulty_instance: validation_priority_conflict / pair_b_mandatory_unwind_beats_over_cap_allowance_rejected
          rationale: "That instance issues a REPAIR_ALLOWANCE decision on a conceded case with an over-cap request and asserts ERR_UNWIND_MANDATORY, plus each rule in isolation."

      - name: expired_window_outranks_the_below_minimum_claim_excluded
        claim_type: priority_conflict
        grounds:
          - validations[priority 33 ERR_ARBITRATION_WINDOW_EXPIRED]
          - validations[priority 46 ERR_CLAIM_BELOW_MINIMUM]
        excluded_because:
          difficulty_instance: validation_priority_conflict / pair_c_expired_window_beats_below_minimum_claim_rejected
          rationale: "That instance files a late claim that is also below the minimum and asserts the priority-33 error."

