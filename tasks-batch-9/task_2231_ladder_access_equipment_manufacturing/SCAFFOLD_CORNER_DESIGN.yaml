  - name: submit_with_structural_margin_below_minimum_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=54]
    - errors[ERR_DESIGN_MARGIN_INSUFFICIENT]
    distinguishing_aspect: 'The same error_id guards two different fields at two different gates: structural_margin_pct 1.50 < 2.00 is caught at submit, and a section modulus of 0.150 < 0.180 survives submit
      but is caught at APPROVE.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA exists.
      - Revision A is DRAFT with structural_margin_pct 1.50 and rail_section_modulus_in3 0.250.
      - Revision B is DRAFT with structural_margin_pct 6.50 and rail_section_modulus_in3 0.150 and has been submitted successfully.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 1.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: GET /ladder-ops/products/${p1}
        payload: {}
        as: DesignEngineer
        captures:
          p1v2: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: B
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.15
          expected_product_version: ${p1v2}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r2: $.data.id
      - call: POST /ladder-ops/design-revisions/${r2}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      trigger:
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r2}/review
        payload:
          decision: APPROVE
        as: DesignApprover
        as_user_id: appr-1
      assert:
      - the submit of revision A returns HTTP 422 with error_id ERR_DESIGN_MARGIN_INSUFFICIENT
      - the APPROVE of revision B returns HTTP 422 with error_id ERR_DESIGN_MARGIN_INSUFFICIENT
      - DesignRevision.${r1}.status == DRAFT
      - DesignRevision.${r2}.status == SUBMITTED
      - DesignRevision.${r2}.reviewed_by_user_id == null
      - Product.${p1}.design_status == DRAFT
