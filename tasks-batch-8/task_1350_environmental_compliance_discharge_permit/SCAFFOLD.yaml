scenario: "Environmental Compliance & Discharge Permit (NPDES): outfall monitoring schedule & sample chain of custody, effluent limit exceedance & notification clock, discharge monitoring report generation, stormwater pollution prevention plan & inspection, best-management-practice corrective action, permit renewal & limit renegotiation, penalty/consent-order tracking, lab data validation"

domain_name: environmental-compliance-discharge-permit
api_prefix: /npdes

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers: [optimistic_concurrency, cascading_side_effects, rate_threshold_triggers, scheduled_deferred_actions]
  entity_topology: flat            # peer entities joined by FK references; no nested creation paths
  state_machine_shape: cyclic      # LabResult validation loop, DMR deficiency loop, CorrectiveAction reopen loop; SamplingEvent & Exceedance carry parallel state dimensions
  relationship_patterns: [one_to_many, self_referential, polymorphic, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs via canonical prefix)
# =============================================================================
entities:
  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: permit_number, type: string, source: input, description: "Unique NPDES permit number", constraints: "unique across all permits" }
      - { name: facility_name, type: string, source: input, description: "Permitted facility name" }
      - { name: receiving_water_body, type: string, source: input, description: "Receiving water body name" }
      - { name: effective_date, type: datetime, source: input, description: "Permit effective instant (UTC)" }
      - { name: expiration_date, type: datetime, source: input, description: "Permit expiration instant (UTC); must be strictly after effective_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | SUPERSEDED | TERMINATED", default: DRAFT }
      - { name: superseded_by_permit_id, type: string, source: system, description: "FK -> Permit.id; self-referential; set when a renewal approval creates the successor permit; null otherwise", constraints: "nullable" }
      - { name: compliance_posture, type: enum, source: computed, description: "GOOD_STANDING | UNDER_CORRECTIVE_ACTION | ENFORCEMENT; derived: ENFORCEMENT if any linked ConsentOrder status in {ISSUED, UNDER_APPEAL, FINAL} (via Exceedance chain), else UNDER_CORRECTIVE_ACTION if open_corrective_action_count > 0, else GOOD_STANDING", default: GOOD_STANDING }
      - { name: open_corrective_action_count, type: integer, source: computed, description: "Count of CorrectiveActions reachable via this permit's outfalls/exceedances/inspections with status in {OPEN, IN_PROGRESS, COMPLETED, REOPENED}", default: 0 }
      - { name: open_exceedance_count, type: integer, source: computed, description: "Count of Exceedances on this permit's outfalls with notification_status != CLOSED", default: 0 }

  - name: Outfall
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id" }
      - { name: outfall_number, type: string, source: input, description: "Outfall identifier; unique within the permit", constraints: "unique per permit_id" }
      - { name: description, type: string, source: input, description: "Optional description", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }

  - name: EffluentLimit
    parent: null
    common_fields: true
    fields:
      - { name: outfall_id, type: string, source: input, description: "FK -> Outfall.id" }
      - { name: parameter_code, type: enum, source: input, description: "BOD5 | TSS | PH | AMMONIA_N | COPPER | FECAL_COLIFORM" }
      - { name: limit_type, type: enum, source: input, description: "DAILY_MAX | MONTHLY_AVG" }
      - { name: limit_value, type: number, source: input, description: "Numeric effluent limit; strictly > 0" }
      - { name: unit, type: enum, source: input, description: "MG_L | SU | MPN_100ML" }
      - { name: average_method, type: enum, source: input, description: "ARITHMETIC | FLOW_WEIGHTED; selects monthly_average_effluent variant for MONTHLY_AVG evaluation", default: ARITHMETIC }
      - { name: monitoring_frequency, type: enum, source: input, description: "WEEKLY | MONTHLY; drives required sample counts" }
      - { name: effective_from, type: datetime, source: input, description: "Range start, inclusive (half-open range)" }
      - { name: effective_to, type: datetime, source: input, description: "Range end, exclusive; null = open-ended", constraints: "nullable; must be > effective_from when present" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | RESCINDED", default: ACTIVE }
      - { name: supersedes_limit_id, type: string, source: input, description: "FK -> EffluentLimit.id; self-referential; when set, that ACTIVE limit flips to SUPERSEDED atomically with this creation", constraints: "nullable" }

  - name: SamplingEvent
    parent: null
    common_fields: true
    fields:
      - { name: outfall_id, type: string, source: input, description: "FK -> Outfall.id" }
      - { name: parameter_code, type: enum, source: input, description: "BOD5 | TSS | PH | AMMONIA_N | COPPER | FECAL_COLIFORM" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned collection instant (UTC)" }
      - { name: collection_window_hours, type: integer, source: input, description: "Symmetric collection window around scheduled_for", default: 24, constraints: "1..168" }
      - { name: schedule_status, type: enum, source: system, description: "SCHEDULED | COLLECTED | CLOSED | MISSED | CANCELLED (parallel dimension 1)", default: SCHEDULED }
      - { name: custody_status, type: enum, source: system, description: "NOT_SEALED | SEALED | IN_TRANSIT | LAB_RECEIVED | ANALYZED (parallel dimension 2, evolves independently after collection)", default: NOT_SEALED }
      - { name: collected_at, type: datetime, source: system, description: "Actual collection instant = logical clock at collect; null until collected", constraints: "nullable" }
      - { name: collected_by_user_id, type: string, source: system, description: "X-User-ID of the FieldSampler who collected; null until collected", constraints: "nullable" }

  - name: ChainOfCustodyRecord
    parent: null
    common_fields: false
    fields:
      - { name: sampling_event_id, type: string, source: input, description: "FK -> SamplingEvent.id" }
      - { name: event_type, type: enum, source: input, description: "SEAL | TRANSFER | RECEIVE_LAB | ANALYSIS_START" }
      - { name: event_at, type: datetime, source: input, description: "When the custody event physically occurred (UTC)" }
      - { name: from_party, type: string, source: input, description: "Releasing party; required for TRANSFER/RECEIVE_LAB", constraints: "nullable for SEAL/ANALYSIS_START" }
      - { name: to_party, type: string, source: input, description: "Receiving party; required for TRANSFER/RECEIVE_LAB", constraints: "nullable for SEAL/ANALYSIS_START" }
      - { name: note, type: string, source: input, description: "Optional note", constraints: "nullable" }
      - { name: sequence_index, type: integer, source: system, description: "Monotonic 1-based index per sampling_event_id, assigned at append" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of caller" }

  - name: LabResult
    parent: null
    common_fields: true
    fields:
      - { name: sampling_event_id, type: string, source: input, description: "FK -> SamplingEvent.id" }
      - { name: parameter_code, type: enum, source: input, description: "Must equal the referenced SamplingEvent.parameter_code" }
      - { name: reported_value, type: number, source: input, description: "Analytical result; >= 0" }
      - { name: unit, type: enum, source: input, description: "MG_L | SU | MPN_100ML; must equal the governing EffluentLimit.unit" }
      - { name: method_detection_limit, type: number, source: input, description: "MDL; strictly > 0" }
      - { name: qualifier, type: enum, source: input, description: "NONE | BELOW_MDL | ESTIMATED", default: NONE }
      - { name: flow_mgd, type: number, source: input, description: "Measured flow at sampling time, million gallons/day; strictly > 0" }
      - { name: analyzed_at, type: datetime, source: input, description: "Analysis instant (UTC); drives holding-time validation" }
      - { name: analyzed_by_user_id, type: string, source: system, description: "X-User-ID of recording LabAnalyst" }
      - { name: validation_status, type: enum, source: system, description: "SUBMITTED | VALIDATED | REJECTED", default: SUBMITTED }
      - { name: validated_by_user_id, type: string, source: system, description: "X-User-ID of validating LabValidator; null until validated", constraints: "nullable" }
      - { name: validated_at, type: datetime, source: system, description: "Logical clock at validation; null until validated", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on rejection; null otherwise", constraints: "nullable" }
      - { name: exceeds_limit, type: boolean, source: computed, description: "Set at validation: comparison value vs governing DAILY_MAX limit; null until validated", constraints: "nullable" }
      - { name: exceedance_id, type: string, source: system, description: "FK -> Exceedance.id; set when validation spawns an exceedance; null otherwise", constraints: "nullable" }

  - name: Exceedance
    parent: null
    common_fields: true
    fields:
      - { name: lab_result_id, type: string, source: system, description: "FK -> LabResult.id" }
      - { name: effluent_limit_id, type: string, source: system, description: "FK -> EffluentLimit.id" }
      - { name: outfall_id, type: string, source: system, description: "FK -> Outfall.id; denormalized for queries" }
      - { name: parameter_code, type: enum, source: system, description: "Copied from LabResult" }
      - { name: reported_value, type: number, source: system, description: "Snapshot of the comparison value used at detection" }
      - { name: limit_value, type: number, source: system, description: "Snapshot of the limit at detection" }
      - { name: percent_over, type: number, source: computed, description: "= round_half_up((reported_value - limit_value)/limit_value*100, 2)" }
      - { name: detected_at, type: datetime, source: system, description: "= LabResult.validated_at" }
      - { name: oral_notification_due_at, type: datetime, source: computed, description: "= detected_at + 24h" }
      - { name: written_report_due_at, type: datetime, source: computed, description: "= detected_at + 120h" }
      - { name: notification_status, type: enum, source: system, description: "PENDING_ORAL | ORAL_OVERDUE | ORAL_NOTIFIED | WRITTEN_OVERDUE | WRITTEN_FILED | CLOSED (parallel dimension 1)", default: PENDING_ORAL }
      - { name: enforcement_status, type: enum, source: system, description: "NONE | ORDER_ISSUED | RESOLVED (parallel dimension 2, independent of notification_status)", default: NONE }
      - { name: oral_notified_at, type: datetime, source: system, description: "Logical clock at oral notification; null until notified", constraints: "nullable" }
      - { name: written_filed_at, type: datetime, source: system, description: "Logical clock at written report filing; null until filed", constraints: "nullable" }
      - { name: corrective_action_id, type: string, source: system, description: "FK -> CorrectiveAction.id; the BMP corrective action auto-created at detection", constraints: "nullable" }

  - name: DischargeMonitoringReport
    parent: null
    common_fields: true
    fields:
      - { name: outfall_id, type: string, source: input, description: "FK -> Outfall.id" }
      - { name: period_start, type: datetime, source: input, description: "Monitoring period start, inclusive" }
      - { name: period_end, type: datetime, source: input, description: "Monitoring period end, inclusive; must be >= period_start" }
      - { name: due_date, type: datetime, source: computed, description: "= period_end + 15 days" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | SUBMITTED | ACCEPTED | REJECTED", default: DRAFT }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of creating ComplianceOfficer" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifier; MUST differ from prepared_by_user_id; null until certified; reset to null on REJECTED -> DRAFT", constraints: "nullable" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission; null until submitted", constraints: "nullable" }
      - { name: is_late, type: boolean, source: computed, description: "true when (submitted_at is null and clock > due_date) or (submitted_at > due_date)" }
      - { name: required_sample_count, type: integer, source: computed, description: "Sum over parameters holding an ACTIVE EffluentLimit for this outfall during the period of the per-parameter required count (see monitoring_completeness)" }
      - { name: total_validated_results, type: integer, source: computed, description: "Count of VALIDATED LabResults whose SamplingEvent.outfall_id == this outfall and collected_at within [period_start, period_end] inclusive" }
      - { name: monitoring_completeness_ratio, type: number, source: computed, description: "= total_validated_results / required_sample_count (0 when required == 0), 4dp round_half_up" }
      - { name: summary_lines, type: array, source: computed, description: "Per-parameter objects: {parameter_code, sample_count, avg_concentration, max_concentration, total_loading_kg, exceeds_limit}" }
      - { name: deficiency_notes, type: string, source: system, description: "Agency notes on REJECTED; null otherwise", constraints: "nullable" }

  - name: StormwaterPlan
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id" }
      - { name: plan_title, type: string, source: input, description: "SWPPP title" }
      - { name: version_label, type: string, source: input, description: "Free-form version label, e.g. rev-2026-A" }
      - { name: inspection_frequency_days, type: integer, source: input, description: "Required routine inspection cadence in days; 1..365" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED", default: DRAFT }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StormwaterPlan.id" }
      - { name: scheduled_for, type: datetime, source: input, description: "Scheduled inspection instant (UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of scheduling FacilityInspector" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion; null until completed", constraints: "nullable" }
      - { name: findings, type: array, source: input, description: "Provided at completion: list of {description, severity} with severity in {CRITICAL, MAJOR, MINOR}; empty list allowed", default: [] }

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: system, description: "INSPECTION | EXCEEDANCE (polymorphic source discriminator)" }
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; set when source_type == INSPECTION; null otherwise", constraints: "nullable" }
      - { name: exceedance_id, type: string, source: system, description: "FK -> Exceedance.id; set when source_type == EXCEEDANCE; null otherwise", constraints: "nullable" }
      - { name: description, type: string, source: system, description: "Finding description (inspection-sourced) or auto-generated exceedance narrative" }
      - { name: severity, type: enum, source: system, description: "CRITICAL | MAJOR | MINOR; exceedance-sourced actions are always MAJOR" }
      - { name: deadline_at, type: datetime, source: computed, description: "= created_at + {CRITICAL: 7d, MAJOR: 30d, MINOR: 90d}" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | COMPLETED | VERIFIED | REOPENED | CLOSED", default: OPEN }
      - { name: is_overdue, type: boolean, source: computed, description: "true when status in {OPEN, IN_PROGRESS, REOPENED} and clock > deadline_at" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical clock at completion; null until completed", constraints: "nullable" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of completer; null until completed", constraints: "nullable" }
      - { name: actual_cost_cents, type: integer, source: system, description: "Remediation cost declared at completion; >= 0; null until completed", constraints: "nullable" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying Regulator; MUST differ from resolved_by_user_id; null until verified; reset to null on reopen", constraints: "nullable" }

  - name: RenewalApplication
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id" }
      - { name: proposed_expiration_date, type: datetime, source: input, description: "Requested new expiration (UTC)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED", default: SUBMITTED }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: info_request_note, type: string, source: system, description: "Most recent info request text; null until requested", constraints: "nullable" }
      - { name: decision_reason, type: string, source: system, description: "Denial reason; null unless DENIED", constraints: "nullable" }
      - { name: resulting_permit_id, type: string, source: system, description: "FK -> Permit.id; the successor permit created on APPROVED; null otherwise", constraints: "nullable" }

  - name: ConsentOrder
    parent: null
    common_fields: true
    fields:
      - { name: exceedance_id, type: string, source: input, description: "FK -> Exceedance.id" }
      - { name: assessment_variant, type: enum, source: input, description: "PER_DAY | ECONOMIC_BENEFIT; selects penalty_accrual variant" }
      - { name: base_penalty_cents, type: integer, source: input, description: "Base assessment; > 0 and <= statutory_cap_cents" }
      - { name: daily_accrual_cents, type: integer, source: input, description: "Stipulated per-day penalty (PER_DAY variant); >= 0; ignored for ECONOMIC_BENEFIT" }
      - { name: avoided_cost_cents, type: integer, source: input, description: "Compliance cost avoided (ECONOMIC_BENEFIT variant); >= 0; ignored for PER_DAY", constraints: "nullable" }
      - { name: gravity_factor, type: number, source: input, description: "Gravity multiplier (ECONOMIC_BENEFIT variant); > 0; ignored for PER_DAY", constraints: "nullable" }
      - { name: statutory_cap_cents, type: integer, source: input, description: "Statutory maximum total assessment; > 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ISSUED | UNDER_APPEAL | FINAL | SATISFIED", default: PROPOSED }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issuance; null until issued", constraints: "nullable" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical clock at finalization; null until FINAL", constraints: "nullable" }
      - { name: cure_date, type: datetime, source: computed, description: "Linked exceedance's corrective action resolved_at when status VERIFIED at finalize time, else finalized_at; null until FINAL", constraints: "nullable" }
      - { name: accrued_days, type: integer, source: computed, description: "Whole days from violation_date (date of Exceedance.detected_at) to end date, minimum 1; end date = cure_date when FINAL else current clock date" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Assessment with end date = current clock (per penalty_accrual variant), before mitigation credit" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Assessment at FINAL: variant amount at cure_date minus mitigation credit, floored at 0, capped at statutory_cap_cents; null until FINAL", constraints: "nullable" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of POSTED PenaltyPayments with direction PAYMENT", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Sum of POSTED PenaltyPayments with direction REFUND", default: 0 }
      - { name: outstanding_cents, type: integer, source: computed, description: "= final_amount_cents - (paid_cents - refunded_cents); 0 until FINAL", default: 0 }

  - name: PenaltyPayment
    parent: null
    common_fields: false
    fields:
      - { name: consent_order_id, type: string, source: input, description: "FK -> ConsentOrder.id" }
      - { name: direction, type: enum, source: input, description: "PAYMENT | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Strictly > 0" }
      - { name: posted_at, type: datetime, source: system, description: "Logical clock at posting" }
      - { name: status, type: enum, source: system, description: "POSTED (append-only ledger line; never mutated)", default: POSTED }

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Entity name of the mutated resource (polymorphic, not an FK)" }
      - { name: entity_id, type: string, source: system, description: "id of the mutated resource (polymorphic, not an FK)" }
      - { name: action, type: string, source: system, description: "Mutation label, e.g. PERMIT_ISSUED, RESULT_VALIDATED, LIMIT_SUPERSEDED" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the mutating caller; 'system' for clock-sweep transitions" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the mutating caller; 'system' for sweeps" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock at mutation" }
      - { name: prev_entry_hash, type: string, source: system, description: "SHA-256 hex of the previous AuditLogEntry; genesis = 64 zeros" }
      - { name: entry_hash, type: string, source: computed, description: "sha256(prev_entry_hash | entity_type | entity_id | action | actor_user_id | actor_role | occurred_at ISO)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /npdes/permits/{id}/issue"
        actor: EnvironmentalManager
        preconditions:
          - "Permit in DRAFT (ERR_PERMIT_NOT_IN_DRAFT)"
          - "effective_date <= logical clock < expiration_date (ERR_PERMIT_NOT_ISSUABLE)"
          - "At least one Outfall with status ACTIVE exists for this permit (ERR_PERMIT_NO_OUTFALL)"
          - "Every ACTIVE Outfall of this permit has at least one EffluentLimit with status ACTIVE (ERR_OUTFALL_NO_ACTIVE_LIMIT)"
        side_effects:
          - "Permit.version += 1; AuditLogEntry appended (PERMIT_ISSUED)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep (logical clock >= expiration_date)"
        actor: system
        preconditions:
          - "Permit ACTIVE and clock >= expiration_date"
        side_effects:
          - "Every Outfall of this permit with status ACTIVE -> INACTIVE (link 2 of cascade)"
          - "Every SamplingEvent of those outfalls with schedule_status SCHEDULED -> CANCELLED (link 3 of cascade)"
          - "AuditLogEntry appended (PERMIT_EXPIRED; actor system)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (RenewalApplication approval cascade)"
        actor: system
        preconditions:
          - "A RenewalApplication for this permit is being approved"
        side_effects:
          - "superseded_by_permit_id := resulting new Permit.id"
          - "Permit.version += 1"
          - "Every Outfall of this permit with status ACTIVE -> INACTIVE"
          - "Every SamplingEvent of those outfalls with schedule_status SCHEDULED -> CANCELLED"
          - "AuditLogEntry appended (PERMIT_SUPERSEDED; actor system)"

      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system (RenewalApplication approval cascade for an expired permit)"
        actor: system
        preconditions:
          - "A RenewalApplication for this permit is being approved"
        side_effects:
          - "superseded_by_permit_id := resulting new Permit.id; Permit.version += 1; AuditLogEntry appended"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /npdes/permits/{id}/terminate"
        actor: EnvironmentalManager
        preconditions:
          - "Permit in ACTIVE (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "Every Outfall of this permit with status ACTIVE -> INACTIVE"
          - "Every SamplingEvent of those outfalls with schedule_status SCHEDULED -> CANCELLED"
          - "Permit.version += 1; AuditLogEntry appended (PERMIT_TERMINATED)"

  - entity: Outfall
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /npdes/outfalls/{id}/deactivate OR system (permit cascade)"
        actor: EnvironmentalManager | system
        preconditions:
          - "Outfall ACTIVE (ERR_OUTFALL_INACTIVE)"
        side_effects:
          - "SamplingEvents of this outfall with schedule_status SCHEDULED -> CANCELLED"
          - "Outfall.version += 1; AuditLogEntry appended"

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /npdes/outfalls/{id}/reactivate"
        actor: EnvironmentalManager
        preconditions:
          - "Outfall INACTIVE (ERR_OUTFALL_NOT_INACTIVE)"
          - "Parent Permit (via Outfall.permit_id -> Permit.id) status == ACTIVE (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "Outfall.version += 1; AuditLogEntry appended"

  - entity: EffluentLimit
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /npdes/effluent-limits carrying supersedes_limit_id == this limit)"
        actor: system
        preconditions:
          - "This limit ACTIVE and named as supersedes_limit_id of a successfully created successor"
        side_effects:
          - "AuditLogEntry appended (LIMIT_SUPERSEDED)"

      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /npdes/effluent-limits/{id}/rescind"
        actor: EnvironmentalManager
        preconditions:
          - "Limit ACTIVE (ERR_LIMIT_NOT_ACTIVE)"
          - "Limit was itself created with a non-null supersedes_limit_id (ERR_LIMIT_NOT_A_SUCCESSOR)"
        side_effects:
          - "The limit L_old identified by this limit's supersedes_limit_id: SUPERSEDED -> ACTIVE (compensating restore)"
          - "Outfall.version += 1; AuditLogEntry appended (LIMIT_RESCINDED, LIMIT_RESTORED)"

      - from: SUPERSEDED
        to: ACTIVE
        trigger: "system (rescind of the successor limit)"
        actor: system
        preconditions:
          - "The successor limit referencing this limit via supersedes_limit_id is being rescinded"
        side_effects:
          - "AuditLogEntry appended (LIMIT_RESTORED)"

  - entity: SamplingEvent
    initial_state: "SCHEDULED (schedule dimension) / NOT_SEALED (custody dimension)"
    terminal_states: ["schedule: MISSED, CANCELLED, CLOSED", "custody: ANALYZED"]
    transitions:
      # --- schedule dimension ---
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /npdes/sampling-events/{id}/collect"
        actor: FieldSampler
        preconditions:
          - "schedule_status == SCHEDULED (ERR_SAMPLE_NOT_SCHEDULED)"
          - "scheduled_for - collection_window_hours <= clock <= scheduled_for + collection_window_hours (ERR_COLLECTION_WINDOW_CLOSED)"
          - "Parent outfall status == ACTIVE (ERR_OUTFALL_INACTIVE)"
        side_effects:
          - "collected_at := clock; collected_by_user_id := X-User-ID"
          - "custody_status NOT_SEALED -> SEALED; a SEAL ChainOfCustodyRecord is auto-appended (sequence_index 1)"
          - "SamplingEvent.version += 1; AuditLogEntry appended (SAMPLE_COLLECTED)"

      - from: SCHEDULED
        to: MISSED
        trigger: "system clock sweep (clock > scheduled_for + collection_window_hours while still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLogEntry appended (SAMPLE_MISSED; actor system)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /npdes/sampling-events/{id}/cancel OR system (permit/outfall cascade)"
        actor: FieldSampler | system
        preconditions:
          - "schedule_status == SCHEDULED (ERR_SAMPLE_NOT_SCHEDULED)"
        side_effects:
          - "AuditLogEntry appended (SAMPLE_CANCELLED)"

      - from: COLLECTED
        to: CLOSED
        trigger: "system (when every LabResult of this sample reaches VALIDATED and no LabResult is SUBMITTED or REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLogEntry appended (SAMPLE_CLOSED; actor system)"

      # --- custody dimension (independent of schedule dimension once COLLECTED) ---
      - from: SEALED
        to: IN_TRANSIT
        trigger: "POST /npdes/sampling-events/{id}/custody-events with event_type TRANSFER"
        actor: FieldSampler | LabAnalyst
        preconditions:
          - "custody_status == SEALED (ERR_CUSTODY_OUT_OF_ORDER)"
        side_effects:
          - "ChainOfCustodyRecord appended with next sequence_index; SamplingEvent.version += 1"

      - from: IN_TRANSIT
        to: LAB_RECEIVED
        trigger: "POST /npdes/sampling-events/{id}/custody-events with event_type RECEIVE_LAB"
        actor: FieldSampler | LabAnalyst
        preconditions:
          - "custody_status == IN_TRANSIT (ERR_CUSTODY_OUT_OF_ORDER)"
        side_effects:
          - "ChainOfCustodyRecord appended; SamplingEvent.version += 1"

      - from: LAB_RECEIVED
        to: ANALYZED
        trigger: "POST /npdes/sampling-events/{id}/custody-events with event_type ANALYSIS_START"
        actor: FieldSampler | LabAnalyst
        preconditions:
          - "custody_status == LAB_RECEIVED (ERR_CUSTODY_OUT_OF_ORDER)"
        side_effects:
          - "ChainOfCustodyRecord appended; SamplingEvent.version += 1"

  - entity: LabResult
    initial_state: SUBMITTED
    terminal_states: [VALIDATED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /npdes/lab-results/{id}/validate"
        actor: LabValidator
        preconditions:
          - "validation_status == SUBMITTED (ERR_RESULT_NOT_SUBMITTED)"
          - "X-User-ID != analyzed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Sample custody_status == ANALYZED (ERR_CUSTODY_NOT_ANALYZED)"
          - "analyzed_at - sample.collected_at <= HOLDING_TIME_HOURS[parameter_code] (ERR_HOLDING_TIME_EXCEEDED)"
        side_effects:
          - "validated_by_user_id := X-User-ID; validated_at := clock"
          - "exceedance detection: governing limit = EffluentLimit with status ACTIVE, outfall_id == sample.outfall_id, parameter_code == result.parameter_code, limit_type == DAILY_MAX, effective_from <= sample.collected_at < effective_to (or effective_to null); comparison value = reported_value, or method_detection_limit when qualifier == BELOW_MDL"
          - "If governing limit exists and comparison value > limit.limit_value (strictly greater): create Exceedance (PENDING_ORAL, enforcement NONE) snapshotting values; result.exceeds_limit := true; result.exceedance_id set (link 1 of cascade)"
          - "Exceedance creation itself creates a CorrectiveAction (source_type EXCEEDANCE, severity MAJOR, status OPEN) and sets Exceedance.corrective_action_id (link 2 of cascade)"
          - "CorrectiveAction creation increments Permit.open_corrective_action_count by 1 and recomputes Permit.compliance_posture (GOOD_STANDING -> UNDER_CORRECTIVE_ACTION) (link 3 of cascade)"
          - "Else: result.exceeds_limit := false"
          - "Permit.open_exceedance_count recomputed; LabResult.version += 1; AuditLogEntry appended (RESULT_VALIDATED)"
          - "If all LabResults of the sample now VALIDATED and none SUBMITTED/REJECTED: sample schedule_status COLLECTED -> CLOSED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /npdes/lab-results/{id}/reject"
        actor: LabValidator
        preconditions:
          - "validation_status == SUBMITTED (ERR_RESULT_NOT_SUBMITTED)"
          - "X-User-ID != analyzed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "rejection_reason := input reason; LabResult.version += 1; AuditLogEntry appended (RESULT_REJECTED)"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /npdes/lab-results/{id}/resubmit"
        actor: LabAnalyst
        preconditions:
          - "validation_status == REJECTED (ERR_RESULT_NOT_REJECTED)"
        side_effects:
          - "Apply corrected fields (reported_value?, qualifier?, analyzed_at?); analyzed_by_user_id := X-User-ID; rejection_reason := null"
          - "LabResult.version += 1; AuditLogEntry appended (RESULT_RESUBMITTED)"

  - entity: Exceedance
    initial_state: "PENDING_ORAL (notification dimension) / NONE (enforcement dimension)"
    terminal_states: ["notification: CLOSED", "enforcement: RESOLVED"]
    transitions:
      # --- notification dimension ---
      - from: PENDING_ORAL
        to: ORAL_NOTIFIED
        trigger: "POST /npdes/exceedances/{id}/notify"
        actor: ComplianceOfficer
        preconditions:
          - "notification_status in {PENDING_ORAL, ORAL_OVERDUE} (ERR_INVALID_NOTIFICATION_STATE)"
        side_effects:
          - "oral_notified_at := clock; AuditLogEntry appended (EXCEEDANCE_ORAL_NOTIFIED)"

      - from: PENDING_ORAL
        to: ORAL_OVERDUE
        trigger: "system clock sweep (clock > oral_notification_due_at while PENDING_ORAL)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLogEntry appended (EXCEEDANCE_ORAL_OVERDUE; actor system)"

      - from: ORAL_OVERDUE
        to: ORAL_NOTIFIED
        trigger: "POST /npdes/exceedances/{id}/notify"
        actor: ComplianceOfficer
        preconditions:
          - "notification_status in {PENDING_ORAL, ORAL_OVERDUE} (ERR_INVALID_NOTIFICATION_STATE)"
        side_effects:
          - "oral_notified_at := clock (late notification permitted but the ORAL_OVERDUE sojourn is preserved in the audit chain)"

      - from: ORAL_NOTIFIED
        to: WRITTEN_FILED
        trigger: "POST /npdes/exceedances/{id}/file-report"
        actor: ComplianceOfficer
        preconditions:
          - "notification_status in {ORAL_NOTIFIED, WRITTEN_OVERDUE} (ERR_INVALID_NOTIFICATION_STATE)"
        side_effects:
          - "written_filed_at := clock; AuditLogEntry appended (EXCEEDANCE_WRITTEN_FILED)"

      - from: ORAL_NOTIFIED
        to: WRITTEN_OVERDUE
        trigger: "system clock sweep (clock > written_report_due_at while ORAL_NOTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLogEntry appended (EXCEEDANCE_WRITTEN_OVERDUE; actor system)"

      - from: WRITTEN_OVERDUE
        to: WRITTEN_FILED
        trigger: "POST /npdes/exceedances/{id}/file-report"
        actor: ComplianceOfficer
        preconditions:
          - "notification_status in {ORAL_NOTIFIED, WRITTEN_OVERDUE} (ERR_INVALID_NOTIFICATION_STATE)"
        side_effects:
          - "written_filed_at := clock"

      - from: WRITTEN_FILED
        to: CLOSED
        trigger: "POST /npdes/exceedances/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "notification_status == WRITTEN_FILED (ERR_INVALID_NOTIFICATION_STATE)"
          - "Linked CorrectiveAction (Exceedance.corrective_action_id -> CorrectiveAction.id) status in {VERIFIED, CLOSED} (ERR_EXCEEDANCE_NOT_CLOSABLE)"
        side_effects:
          - "Permit.open_exceedance_count recomputed; Permit.compliance_posture recomputed; AuditLogEntry appended (EXCEEDANCE_CLOSED)"

      # --- enforcement dimension ---
      - from: NONE
        to: ORDER_ISSUED
        trigger: "system (POST /npdes/consent-orders naming this exceedance succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "Permit.compliance_posture recomputed (may become ENFORCEMENT)"

      - from: ORDER_ISSUED
        to: RESOLVED
        trigger: "system (linked ConsentOrder reaches SATISFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Permit.compliance_posture recomputed"

  - entity: DischargeMonitoringReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /npdes/dmrs/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT (ERR_DMR_NOT_DRAFT)"
          - "X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "monitoring_completeness_ratio >= 0.5 (ERR_DMR_MONITORING_INCOMPLETE)"
          - "Every Exceedance with outfall_id == DMR.outfall_id and detected_at within [period_start, period_end] has notification_status in {ORAL_NOTIFIED, WRITTEN_OVERDUE, WRITTEN_FILED, CLOSED} (ERR_DMR_EXCEEDANCES_UNRESOLVED)"
        side_effects:
          - "certified_by_user_id := X-User-ID; DischargeMonitoringReport.version += 1; AuditLogEntry appended (DMR_CERTIFIED)"

      - from: CERTIFIED
        to: SUBMITTED
        trigger: "POST /npdes/dmrs/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == CERTIFIED (ERR_DMR_NOT_CERTIFIED)"
          - "Every Exceedance with outfall_id == DMR.outfall_id and detected_at within [period_start, period_end] has notification_status in {WRITTEN_FILED, CLOSED} (ERR_DMR_EXCEEDANCES_UNRESOLVED)"
        side_effects:
          - "submitted_at := clock; is_late recomputed; DischargeMonitoringReport.version += 1; AuditLogEntry appended (DMR_SUBMITTED)"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /npdes/dmrs/{id}/agency-review with decision ACCEPTED"
        actor: Regulator
        preconditions:
          - "status == SUBMITTED (ERR_DMR_NOT_SUBMITTED)"
        side_effects:
          - "DischargeMonitoringReport.version += 1; AuditLogEntry appended (DMR_ACCEPTED)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /npdes/dmrs/{id}/agency-review with decision REJECTED"
        actor: Regulator
        preconditions:
          - "status == SUBMITTED (ERR_DMR_NOT_SUBMITTED)"
          - "decision REJECTED requires non-empty deficiency_notes (ERR_INVALID_REQUEST)"
        side_effects:
          - "deficiency_notes := input; DischargeMonitoringReport.version += 1; AuditLogEntry appended (DMR_REJECTED)"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /npdes/dmrs/{id}/revise"
        actor: ComplianceOfficer
        preconditions:
          - "status == REJECTED (ERR_DMR_NOT_REJECTED)"
        side_effects:
          - "certified_by_user_id := null; summary_lines / counts recomputed from current VALIDATED results; DischargeMonitoringReport.version += 1; AuditLogEntry appended (DMR_REVISED)"

  - entity: StormwaterPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /npdes/swppp-plans/{id}/activate"
        actor: FacilityInspector
        preconditions:
          - "status == DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "Parent Permit (via StormwaterPlan.permit_id -> Permit.id) status == ACTIVE (ERR_PERMIT_NOT_ACTIVE)"
          - "expected_permit_version == Permit.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "Any other StormwaterPlan of the same permit with status ACTIVE -> SUPERSEDED (AuditLogEntry PLAN_SUPERSEDED)"
          - "Permit.version += 1; AuditLogEntry appended (PLAN_ACTIVATED)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (activation of a successor plan for the same permit)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLogEntry appended (PLAN_SUPERSEDED; actor system)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /npdes/inspections/{id}/complete"
        actor: FacilityInspector
        preconditions:
          - "status == SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
          - "Parent plan (Inspection.plan_id -> StormwaterPlan.id) status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "completed_at := clock"
          - "For each finding in input findings: create CorrectiveAction (source_type INSPECTION, inspection_id set, severity from finding, status OPEN) (link 1 of cascade)"
          - "Each such CorrectiveAction creation increments the parent Permit.open_corrective_action_count by 1 and recomputes Permit.compliance_posture (link 2 of cascade)"
          - "Inspection.version += 1; AuditLogEntry appended (INSPECTION_COMPLETED)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /npdes/inspections/{id}/cancel"
        actor: FacilityInspector
        preconditions:
          - "status == SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
        side_effects:
          - "AuditLogEntry appended (INSPECTION_CANCELLED)"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /npdes/corrective-actions/{id}/start"
        actor: FacilityInspector
        preconditions:
          - "status in {OPEN, REOPENED} (ERR_CORRECTIVE_ACTION_INVALID_STATE)"
        side_effects:
          - "CorrectiveAction.version += 1; AuditLogEntry appended (CA_STARTED)"

      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /npdes/corrective-actions/{id}/start"
        actor: FacilityInspector
        preconditions:
          - "status in {OPEN, REOPENED} (ERR_CORRECTIVE_ACTION_INVALID_STATE)"
        side_effects:
          - "CorrectiveAction.version += 1; AuditLogEntry appended (CA_RESTARTED)"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /npdes/corrective-actions/{id}/complete"
        actor: FacilityInspector
        preconditions:
          - "status == IN_PROGRESS (ERR_CORRECTIVE_ACTION_INVALID_STATE)"
        side_effects:
          - "resolved_at := clock; resolved_by_user_id := X-User-ID; actual_cost_cents := input actual_cost_cents"
          - "CorrectiveAction.version += 1; AuditLogEntry appended (CA_COMPLETED)"

      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /npdes/corrective-actions/{id}/verify"
        actor: Regulator
        preconditions:
          - "status == COMPLETED (ERR_CORRECTIVE_ACTION_INVALID_STATE)"
          - "X-User-ID != resolved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
          - "Permit.open_corrective_action_count recomputed (this action leaves the open set); Permit.compliance_posture recomputed (may revert UNDER_CORRECTIVE_ACTION -> GOOD_STANDING) (compensating bubble-up)"
          - "CorrectiveAction.version += 1; AuditLogEntry appended (CA_VERIFIED)"

      - from: VERIFIED
        to: CLOSED
        trigger: "POST /npdes/corrective-actions/{id}/close"
        actor: FacilityInspector
        preconditions:
          - "status == VERIFIED (ERR_CORRECTIVE_ACTION_INVALID_STATE)"
        side_effects:
          - "AuditLogEntry appended (CA_CLOSED)"

      - from: VERIFIED
        to: REOPENED
        trigger: "POST /npdes/corrective-actions/{id}/reopen"
        actor: Regulator
        preconditions:
          - "status == VERIFIED (ERR_CORRECTIVE_ACTION_INVALID_STATE)"
        side_effects:
          - "verified_by_user_id := null; resolved_at := null; resolved_by_user_id := null; actual_cost_cents := null"
          - "Permit.open_corrective_action_count recomputed (this action re-enters the open set); Permit.compliance_posture recomputed"
          - "CorrectiveAction.version += 1; AuditLogEntry appended (CA_REOPENED)"

  - entity: RenewalApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /npdes/renewal-applications/{id}/start-review"
        actor: Regulator
        preconditions:
          - "status == SUBMITTED (ERR_RENEWAL_NOT_SUBMITTED)"
        side_effects:
          - "RenewalApplication.version += 1; AuditLogEntry appended (RENEWAL_UNDER_REVIEW)"

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /npdes/renewal-applications/{id}/request-info"
        actor: Regulator
        preconditions:
          - "status == UNDER_REVIEW (ERR_RENEWAL_NOT_UNDER_REVIEW)"
        side_effects:
          - "info_request_note := input info_request_note; RenewalApplication.version += 1; AuditLogEntry appended (RENEWAL_INFO_REQUESTED)"

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /npdes/renewal-applications/{id}/resume-review"
        actor: Regulator
        preconditions:
          - "status == INFO_REQUESTED (ERR_RENEWAL_NOT_INFO_REQUESTED)"
        side_effects:
          - "RenewalApplication.version += 1; AuditLogEntry appended (RENEWAL_REVIEW_RESUMED)"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /npdes/renewal-applications/{id}/approve"
        actor: Regulator
        preconditions:
          - "status == UNDER_REVIEW (ERR_RENEWAL_NOT_UNDER_REVIEW)"
          - "expected_permit_version == Permit.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "Create successor Permit (status ACTIVE, permit_number/new_effective_date/new_expiration_date from input) and set resulting_permit_id (link 1 of cascade)"
          - "Old Permit ACTIVE-or-EXPIRED -> SUPERSEDED with superseded_by_permit_id set, Permit.version += 1 (link 2 caused by link 1)"
          - "Old permit's Outfalls with status ACTIVE -> INACTIVE (link 3 caused by link 2)"
          - "Old outfalls' SamplingEvents with schedule_status SCHEDULED -> CANCELLED (link 4 caused by link 3)"
          - "AuditLogEntry appended for each hop (RENEWAL_APPROVED, PERMIT_SUPERSEDED, OUTFALL_DEACTIVATED, SAMPLE_CANCELLED)"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /npdes/renewal-applications/{id}/deny"
        actor: Regulator
        preconditions:
          - "status == UNDER_REVIEW (ERR_RENEWAL_NOT_UNDER_REVIEW)"
        side_effects:
          - "decision_reason := input reason; RenewalApplication.version += 1; AuditLogEntry appended (RENEWAL_DENIED)"

  - entity: ConsentOrder
    initial_state: PROPOSED
    terminal_states: [SATISFIED]
    transitions:
      - from: PROPOSED
        to: ISSUED
        trigger: "POST /npdes/consent-orders/{id}/issue"
        actor: Regulator
        preconditions:
          - "status == PROPOSED (ERR_CONSENT_ORDER_INVALID_STATE)"
        side_effects:
          - "issued_at := clock; accrual clock starts (violation_date = date of Exceedance.detected_at)"
          - "ConsentOrder.version += 1; AuditLogEntry appended (ORDER_ISSUED)"

      - from: ISSUED
        to: UNDER_APPEAL
        trigger: "POST /npdes/consent-orders/{id}/appeal"
        actor: EnvironmentalManager
        preconditions:
          - "status == ISSUED (ERR_CONSENT_ORDER_INVALID_STATE)"
        side_effects:
          - "Accrual continues during appeal (no pause); ConsentOrder.version += 1; AuditLogEntry appended (ORDER_APPEALED)"

      - from: ISSUED
        to: FINAL
        trigger: "POST /npdes/consent-orders/{id}/finalize"
        actor: Regulator
        preconditions:
          - "status in {ISSUED, UNDER_APPEAL} (ERR_CONSENT_ORDER_INVALID_STATE)"
        side_effects:
          - "finalized_at := clock; cure_date resolved; final_amount_cents computed per penalty_accrual variant minus penalty_mitigation_credit (floor 0, cap statutory_cap_cents); outstanding_cents := final_amount_cents"
          - "ConsentOrder.version += 1; AuditLogEntry appended (ORDER_FINAL)"

      - from: UNDER_APPEAL
        to: FINAL
        trigger: "POST /npdes/consent-orders/{id}/finalize"
        actor: Regulator
        preconditions:
          - "status in {ISSUED, UNDER_APPEAL} (ERR_CONSENT_ORDER_INVALID_STATE)"
        side_effects:
          - "Same as ISSUED -> FINAL (appeal upheld path)"

      - from: FINAL
        to: SATISFIED
        trigger: "system (a PenaltyPayment posting drives outstanding_cents to exactly 0)"
        actor: system
        preconditions:
          - "status == FINAL and outstanding_cents == 0 after posting"
        side_effects:
          - "Linked Exceedance (ConsentOrder.exceedance_id -> Exceedance.id) enforcement_status ORDER_ISSUED -> RESOLVED (link 2 of payment cascade)"
          - "Permit.compliance_posture recomputed (link 3 of payment cascade)"
          - "AuditLogEntry appended (ORDER_SATISFIED; actor system)"

# =============================================================================
# §1.2.1 Concurrency Rules (true create/act-with-supersede races only; OCC)
# =============================================================================
concurrency_rules:
  - rule_id: effluent-limit-create-stale-outfall
    parent_entity: Outfall
    write_endpoint: "POST /npdes/effluent-limits"
    occ_field: expected_outfall_version
    description: |
      Creating an EffluentLimit against an Outfall whose version has advanced
      since the client last observed it is rejected. Every successful limit
      creation bumps Outfall.version, so a client carrying a previously
      observed version is acting on a stale view of the outfall's limit set
      (e.g., unaware that a newer ACTIVE limit has already superseded the one
      it intends to supersede). Rejected with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: swppp-activate-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /npdes/swppp-plans/{id}/activate"
    occ_field: expected_permit_version
    description: |
      Activating a StormwaterPlan supersedes the permit's currently ACTIVE
      plan and bumps Permit.version. A client whose last observed permit
      version predates the most recent activation is superseding a plan it
      never saw; rejected with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: renewal-approve-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /npdes/renewal-applications/{id}/approve"
    occ_field: expected_permit_version
    description: |
      Approving a RenewalApplication supersedes the subject permit and bumps
      Permit.version. An approval request carrying a permit version older
      than the current one reflects a stale view of the permit's renewal
      state (e.g., a plan activation bumped the version in between) and is
      rejected with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: exceedance_magnitude_percent
    trigger: "LabResult validation (SUBMITTED -> VALIDATED)"
    algorithm: threshold
    formula: |
      comparison_value = (qualifier == BELOW_MDL) ? method_detection_limit : reported_value
      governing_limit = EffluentLimit where status == ACTIVE
                        and outfall_id == sample.outfall_id
                        and parameter_code == result.parameter_code
                        and limit_type == DAILY_MAX
                        and effective_from <= sample.collected_at
                        and (effective_to is null or sample.collected_at < effective_to)
      if no governing_limit: exceeds_limit = false; no Exceedance created
      else if comparison_value > governing_limit.limit_value:   # STRICTLY greater;
          exceeds_limit = true                                  # equality is NOT an exceedance
          percent_over = round_half_up((comparison_value - limit_value) / limit_value * 100, 2)
      else: exceeds_limit = false
    input_set: "The single LabResult being validated; its SamplingEvent; ACTIVE DAILY_MAX limits of that outfall/parameter covering collected_at (half-open range)"
    constants:
      ROUNDING: round_half_up_2dp
    precision: "percent_over 2 decimal places, round_half_up"

  - name: monthly_average_effluent
    trigger: "DMR creation/revise (summary_lines computation) for each parameter holding an ACTIVE MONTHLY_AVG limit"
    algorithm: aggregation
    formula: |
      results = LabResults with validation_status == VALIDATED,
                sample.outfall_id == DMR.outfall_id,
                parameter_code == line parameter,
                sample.collected_at within [period_start, period_end] inclusive,
                ordered by sample.collected_at ASC (tie-break: created_at ASC)
      variant ARITHMETIC: avg = round_half_up(sum(comparison_value_i) / n, 3)
      variant FLOW_WEIGHTED: avg = round_half_up(sum(comparison_value_i * flow_mgd_i) / sum(flow_mgd_i), 3)
      comparison_value_i = (qualifier_i == BELOW_MDL) ? mdl_i : reported_value_i
      n == 0 -> avg = null, sample_count = 0
    input_set: "VALIDATED LabResults for the outfall+parameter inside the period; SUBMITTED and REJECTED results are excluded"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: arithmetic
        when: "Governing EffluentLimit.average_method == ARITHMETIC (default)"
        difference: "Plain mean of comparison values"
      - name: flow_weighted
        when: "Governing EffluentLimit.average_method == FLOW_WEIGHTED"
        difference: "Flow-weighted mean; identical inputs yield a different avg whenever flows are non-uniform (e.g. values 1.0@4.0 MGD and 3.0@1.0 MGD: arithmetic 2.000 vs flow-weighted 1.400)"

  - name: dmr_pollutant_loading
    trigger: "DMR creation/revise (summary_lines computation) for each parameter line"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode b): round per-sample first, then sum, then round total.
      for each VALIDATED result i (same input set and ordering as monthly_average_effluent):
          load_i_kg = round_half_up(comparison_value_i * flow_mgd_i * 3.785, 3)   # per-sample round
      total_loading_kg = round_half_up(sum(load_i_kg), 2)                          # total round
      # The alternative order (sum raw loads, round once) is FORBIDDEN and yields a
      # different value on boundary data, e.g. loads 0.122634 + 0.1222555:
      #   pinned: round3(0.122634)=0.123, round3(0.1222555)=0.122, total=round2(0.245)=0.25
      #   forbidden: round2(0.2448895)=0.24
    input_set: "Same VALIDATED-result set as monthly_average_effluent"
    constants:
      CONVERSION_KG_PER_MG_L_MGD: 3.785
    precision: "per-sample 3dp round_half_up; period total 2dp round_half_up; order pinned above"

  - name: monitoring_completeness
    trigger: "DMR creation/revise; also re-evaluated on DMR certify"
    algorithm: threshold
    formula: |
      # Combinatorial (mode a): inputs = monitoring_frequency x period length x ACTIVE-limit coverage;
      # non-linear tiered branches on the ratio.
      days_in_period = (date(period_end) - date(period_start)).days + 1
      for each parameter_code P holding an EffluentLimit with status ACTIVE for DMR.outfall_id
      whose effective range intersects [period_start, period_end]:
          required_P = ceil(days_in_period / 7)   if limit(P).monitoring_frequency == WEEKLY
          required_P = number of calendar months touched by [period_start, period_end]  if MONTHLY
      required_sample_count = sum(required_P)
      validated_P = count of VALIDATED LabResults for outfall+parameter P with collected_at in period
      monitoring_completeness_ratio = round_half_up(sum(validated_P) / required_sample_count, 4)
                                      (0.0 when required_sample_count == 0)
      tier: ratio >= 1.0              -> COMPLETE
            0.5 <= ratio < 1.0        -> DEFICIENT   (certification allowed)
            ratio < 0.5               -> INCOMPLETE  (certification blocked, ERR_DMR_MONITORING_INCOMPLETE)
      summary_lines[].exceeds_limit = (parameter's MONTHLY_AVG limit exists and avg > limit_value)
                                      or (parameter's DAILY_MAX limit exists and max_concentration > limit_value)
    input_set: "ACTIVE EffluentLimits of the outfall whose effective range intersects the period; VALIDATED LabResults collected within [period_start, period_end] inclusive"
    precision: "ratio 4 decimal places, round_half_up"

  - name: notification_deadlines
    trigger: "Exceedance creation; clock sweep"
    algorithm: threshold
    formula: |
      oral_notification_due_at = detected_at + 24 hours
      written_report_due_at    = detected_at + 120 hours
      # Boundary: overdue iff clock is STRICTLY greater than the due instant.
      # Notifying at exactly due_at is timely (no overdue transition).
      if clock > oral_notification_due_at and notification_status == PENDING_ORAL: -> ORAL_OVERDUE
      if clock > written_report_due_at and notification_status == ORAL_NOTIFIED: -> WRITTEN_OVERDUE
    constants:
      ORAL_WINDOW_HOURS: 24
      WRITTEN_WINDOW_HOURS: 120
    precision: "instants compared at 1-second granularity"

  - name: corrective_action_deadline
    trigger: "CorrectiveAction creation; clock sweep (is_overdue)"
    algorithm: threshold
    formula: |
      deadline_at = created_at + DEADLINE_DAYS[severity]
      is_overdue = (status in {OPEN, IN_PROGRESS, REOPENED}) and (clock > deadline_at)   # strictly greater;
                                                                                          # exactly at deadline is not overdue
    constants:
      DEADLINE_DAYS: { CRITICAL: 7, MAJOR: 30, MINOR: 90 }
    precision: "instants compared at 1-second granularity"

  - name: penalty_accrual
    trigger: "ConsentOrder reads (provisional); ConsentOrder finalize (final)"
    algorithm: tiered_pricing
    formula: |
      violation_date = date(Exceedance.detected_at)                 # calendar date, UTC
      end_date       = date(cure_date) if status == FINAL/SATISFIED else date(current clock)
      accrued_days   = max(1, (end_date - violation_date).days)     # whole days, floor 1
      variant PER_DAY:
          gross = base_penalty_cents + daily_accrual_cents * accrued_days
      variant ECONOMIC_BENEFIT:
          months = ceil(accrued_days / 30)
          gross = base_penalty_cents + round(avoided_cost_cents * months * gravity_factor)
      gross_capped   = min(statutory_cap_cents, gross)
      provisional_amount_cents = gross_capped (end_date = current clock date)
      final: final_pre_credit = gross_capped (end_date = cure date)
      NOTE: provisional (clock-based) and final (cure-date-based) amounts diverge for the
      same data whenever the clock is read before cure; both are exposed fields.
    input_set: "The ConsentOrder, its Exceedance (violation date), the exceedance's CorrectiveAction resolved_at when VERIFIED (cure date)"
    constants:
      DAYS_PER_MONTH: 30
    precision: "integer cents; months via ceil"
    variants:
      - name: per_day
        when: "assessment_variant == PER_DAY"
        difference: "Linear daily accrual: base + daily rate x days"
      - name: economic_benefit
        when: "assessment_variant == ECONOMIC_BENEFIT"
        difference: "Benefit-based: base + avoided_cost x ceil(days/30) x gravity_factor; identical dates/costs yield a different total than PER_DAY (e.g. base 1000000, 10 days: PER_DAY 1500000 @50000/day vs ECONOMIC_BENEFIT 4000000 @ avoided 2000000 x 1 month x gravity 1.5)"

  - name: penalty_mitigation_credit
    trigger: "ConsentOrder finalize (after penalty_accrual final amount)"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial (mode c): circular-looking dependency with PINNED evaluation order.
      # Step 1: compute gross_capped from penalty_accrual (does NOT depend on credit).
      # Step 2: credit = min(round(MITIGATION_MAX_RATIO * gross_capped), verified_corrective_cost_cents)
      #         where verified_corrective_cost_cents = actual_cost_cents of the exceedance's
      #         CorrectiveAction if its status == VERIFIED/CLOSED at finalize, else 0.
      # Step 3: final_amount_cents = max(0, gross_capped - credit); outstanding := final_amount_cents.
      # The order is pinned: credit is derived FROM gross_capped; gross never depends on credit.
    constants:
      MITIGATION_MAX_RATIO: 0.25
    precision: "integer cents; ratio product rounded round_half_up to integer cents"

  - name: custody_holding_time
    trigger: "LabResult validation (SUBMITTED -> VALIDATED)"
    algorithm: threshold
    formula: |
      elapsed_hours = (analyzed_at - sample.collected_at) in hours
      valid iff elapsed_hours <= HOLDING_TIME_HOURS[parameter_code]   # inclusive boundary:
                                                                      # exactly at the limit is valid
      else reject validation with ERR_HOLDING_TIME_EXCEEDED
    constants:
      HOLDING_TIME_HOURS: { BOD5: 48, TSS: 168, PH: 2, AMMONIA_N: 672, COPPER: 4320, FECAL_COLIFORM: 8 }
    precision: "1-second granularity on instants"

  - name: inspection_spacing
    trigger: "Inspection scheduling (POST /npdes/inspections)"
    algorithm: interval_merge
    formula: |
      # Buffer semantics (distinct from the half-open range semantics of effluent limits):
      # two inspections of the same plan must be separated by a strict buffer.
      for all existing Inspections J of the same plan with status != CANCELLED:
          conflict iff abs(scheduled_for - J.scheduled_for) < MIN_GAP_DAYS days
      # |delta| exactly == MIN_GAP_DAYS is ALLOWED (>= semantics); strictly less is a conflict.
    constants:
      MIN_GAP_DAYS: 7
    precision: "1-second granularity"

  - name: dmr_due_date
    trigger: "DMR creation"
    algorithm: threshold
    formula: |
      due_date = period_end + 15 days
      is_late = (submitted_at is null and clock > due_date) or (submitted_at > due_date)
    constants:
      DUE_DAYS_AFTER_PERIOD: 15
    precision: "1-second granularity"

  - name: audit_hash_chain
    trigger: "every mutating endpoint and every system clock-sweep transition"
    algorithm: projection
    formula: |
      genesis prev_entry_hash = "0" * 64
      entry_hash = sha256_hex(prev_entry_hash + "|" + entity_type + "|" + entity_id + "|" +
                              action + "|" + actor_user_id + "|" + actor_role + "|" + occurred_at_iso)
      Entries are append-only, totally ordered by insertion (sequence follows mutation order);
      occurred_at uses the logical clock, so the chain is replay-deterministic.
    precision: "SHA-256 hex lowercase"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: business_constraint, check: "Input shape: required fields present, enum membership, numeric ranges (limit_value>0, mdl>0, flow_mgd>0, amount_cents>0), effective_to > effective_from when present, period_end >= period_start, expiration_date > effective_date, base_penalty_cents <= statutory_cap_cents", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutation endpoints" }
  - { priority: 5, category: state, check: "OCC: expected_outfall_version == Outfall.version / expected_permit_version == Permit.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /npdes/effluent-limits; POST /npdes/swppp-plans/{id}/activate; POST /npdes/renewal-applications/{id}/approve" }
  - { priority: 6, category: state, check: "Permit machine: issue requires DRAFT (ERR_PERMIT_NOT_IN_DRAFT), clock within [effective_date, expiration_date) (ERR_PERMIT_NOT_ISSUABLE), >= 1 ACTIVE outfall (ERR_PERMIT_NO_OUTFALL), every ACTIVE outfall has >= 1 ACTIVE limit (ERR_OUTFALL_NO_ACTIVE_LIMIT); terminate requires ACTIVE (ERR_PERMIT_NOT_ACTIVE)", error_id: "ERR_PERMIT_NOT_IN_DRAFT / ERR_PERMIT_NOT_ISSUABLE / ERR_PERMIT_NO_OUTFALL / ERR_OUTFALL_NO_ACTIVE_LIMIT / ERR_PERMIT_NOT_ACTIVE", http_status: 409, applies_to: "POST /npdes/permits/{id}/issue; POST /npdes/permits/{id}/terminate" }
  - { priority: 7, category: state, check: "Outfall machine: deactivate requires ACTIVE (ERR_OUTFALL_INACTIVE); reactivate requires INACTIVE (ERR_OUTFALL_NOT_INACTIVE)", error_id: "ERR_OUTFALL_INACTIVE / ERR_OUTFALL_NOT_INACTIVE", http_status: 409, applies_to: "POST /npdes/outfalls/{id}/deactivate; POST /npdes/outfalls/{id}/reactivate" }
  - { priority: 8, category: state, check: "EffluentLimit machine: rescind requires ACTIVE (ERR_LIMIT_NOT_ACTIVE) and a non-null supersedes_limit_id (ERR_LIMIT_NOT_A_SUCCESSOR)", error_id: "ERR_LIMIT_NOT_ACTIVE / ERR_LIMIT_NOT_A_SUCCESSOR", http_status: 409, applies_to: "POST /npdes/effluent-limits/{id}/rescind" }
  - { priority: 9, category: state, check: "SamplingEvent schedule machine: collect/cancel require schedule_status == SCHEDULED", error_id: ERR_SAMPLE_NOT_SCHEDULED, http_status: 409, applies_to: "POST /npdes/sampling-events/{id}/collect; POST /npdes/sampling-events/{id}/cancel" }
  - { priority: 10, category: state, check: "Custody machine: custody event type must match the exact next expected transition (TRANSFER from SEALED, RECEIVE_LAB from IN_TRANSIT, ANALYSIS_START from LAB_RECEIVED)", error_id: ERR_CUSTODY_OUT_OF_ORDER, http_status: 409, applies_to: "POST /npdes/sampling-events/{id}/custody-events" }
  - { priority: 11, category: state, check: "LabResult machine: validate/reject require SUBMITTED (ERR_RESULT_NOT_SUBMITTED); resubmit requires REJECTED (ERR_RESULT_NOT_REJECTED)", error_id: "ERR_RESULT_NOT_SUBMITTED / ERR_RESULT_NOT_REJECTED", http_status: 409, applies_to: "POST /npdes/lab-results/{id}/validate; /reject; /resubmit" }
  - { priority: 12, category: state, check: "Exceedance notification machine: notify requires {PENDING_ORAL, ORAL_OVERDUE}; file-report requires {ORAL_NOTIFIED, WRITTEN_OVERDUE}; close requires WRITTEN_FILED plus linked corrective action VERIFIED/CLOSED (ERR_EXCEEDANCE_NOT_CLOSABLE)", error_id: "ERR_INVALID_NOTIFICATION_STATE / ERR_EXCEEDANCE_NOT_CLOSABLE", http_status: 409, applies_to: "POST /npdes/exceedances/{id}/notify; /file-report; /close" }
  - { priority: 13, category: state, check: "DMR machine: certify requires DRAFT (ERR_DMR_NOT_DRAFT); submit requires CERTIFIED (ERR_DMR_NOT_CERTIFIED); agency-review requires SUBMITTED (ERR_DMR_NOT_SUBMITTED); revise requires REJECTED (ERR_DMR_NOT_REJECTED)", error_id: "ERR_DMR_NOT_DRAFT / ERR_DMR_NOT_CERTIFIED / ERR_DMR_NOT_SUBMITTED / ERR_DMR_NOT_REJECTED", http_status: 409, applies_to: "POST /npdes/dmrs/{id}/certify; /submit; /agency-review; /revise" }
  - { priority: 14, category: state, check: "Plan/inspection/corrective-action machines: activate requires plan DRAFT (ERR_PLAN_NOT_DRAFT); complete/cancel require inspection SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED); start requires CA in {OPEN, REOPENED}; complete requires IN_PROGRESS; verify/reopen/close per machine (ERR_CORRECTIVE_ACTION_INVALID_STATE)", error_id: "ERR_PLAN_NOT_DRAFT / ERR_INSPECTION_NOT_SCHEDULED / ERR_CORRECTIVE_ACTION_INVALID_STATE", http_status: 409, applies_to: "POST /npdes/swppp-plans/{id}/activate; POST /npdes/inspections/{id}/complete; /cancel; POST /npdes/corrective-actions/{id}/start; /complete; /verify; /reopen; /close" }
  - { priority: 15, category: state, check: "Renewal machine: start-review requires SUBMITTED (ERR_RENEWAL_NOT_SUBMITTED); request-info/approve/deny require UNDER_REVIEW (ERR_RENEWAL_NOT_UNDER_REVIEW); resume-review requires INFO_REQUESTED (ERR_RENEWAL_NOT_INFO_REQUESTED)", error_id: "ERR_RENEWAL_NOT_SUBMITTED / ERR_RENEWAL_NOT_UNDER_REVIEW / ERR_RENEWAL_NOT_INFO_REQUESTED", http_status: 409, applies_to: "POST /npdes/renewal-applications/{id}/start-review; /request-info; /resume-review; /approve; /deny" }
  - { priority: 16, category: state, check: "ConsentOrder machine: issue requires PROPOSED; appeal requires ISSUED; finalize requires {ISSUED, UNDER_APPEAL} (ERR_CONSENT_ORDER_INVALID_STATE); payments require status FINAL (ERR_CONSENT_ORDER_NOT_PAYABLE)", error_id: "ERR_CONSENT_ORDER_INVALID_STATE / ERR_CONSENT_ORDER_NOT_PAYABLE", http_status: 409, applies_to: "POST /npdes/consent-orders/{id}/issue; /appeal; /finalize; /payments" }
  - { priority: 17, category: business_safety, check: "Segregation of duties: LabResult validate/reject caller X-User-ID != analyzed_by_user_id; DMR certify caller != prepared_by_user_id; CorrectiveAction verify caller != resolved_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /npdes/lab-results/{id}/validate; /reject; POST /npdes/dmrs/{id}/certify; POST /npdes/corrective-actions/{id}/verify" }
  - { priority: 18, category: business_safety, check: "LabResult validation requires the sample's custody_status == ANALYZED", error_id: ERR_CUSTODY_NOT_ANALYZED, http_status: 409, applies_to: "POST /npdes/lab-results/{id}/validate" }
  - { priority: 19, category: business_safety, check: "LabResult recording requires the sample's custody_status in {LAB_RECEIVED, ANALYZED}", error_id: ERR_SAMPLE_NOT_IN_LAB, http_status: 409, applies_to: "POST /npdes/lab-results" }
  - { priority: 20, category: business_temporal, check: "Holding time: analyzed_at - sample.collected_at <= HOLDING_TIME_HOURS[parameter_code] (inclusive boundary)", error_id: ERR_HOLDING_TIME_EXCEEDED, http_status: 422, applies_to: "POST /npdes/lab-results/{id}/validate" }
  - { priority: 21, category: business_temporal, check: "Collection window: scheduled_for - collection_window_hours <= clock <= scheduled_for + collection_window_hours", error_id: ERR_COLLECTION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /npdes/sampling-events/{id}/collect" }
  - { priority: 22, category: business_temporal, check: "Inspection spacing: no other non-CANCELLED Inspection of the same plan within strictly less than 7 days of scheduled_for (exactly 7 days allowed)", error_id: ERR_INSPECTION_TOO_SOON, http_status: 409, applies_to: "POST /npdes/inspections" }
  - { priority: 23, category: business_temporal, check: "Renewal window: clock within [permit.expiration_date - 180 days, permit.expiration_date)", error_id: ERR_RENEWAL_WINDOW_CLOSED, http_status: 409, applies_to: "POST /npdes/renewal-applications" }
  - { priority: 24, category: business_constraint, check: "Limit range overlap (half-open [effective_from, effective_to)): no other ACTIVE EffluentLimit with same (outfall_id, parameter_code, limit_type) whose range intersects the new range, EXCLUDING the limit named by supersedes_limit_id (it flips to SUPERSEDED atomically); adjacency (new.effective_from == existing.effective_to) is allowed", error_id: ERR_LIMIT_RANGE_OVERLAP, http_status: 409, applies_to: "POST /npdes/effluent-limits" }
  - { priority: 25, category: business_constraint, check: "Uniqueness: permit_number globally unique (ERR_DUPLICATE_PERMIT_NUMBER); outfall_number unique within permit (ERR_DUPLICATE_OUTFALL_NUMBER)", error_id: "ERR_DUPLICATE_PERMIT_NUMBER / ERR_DUPLICATE_OUTFALL_NUMBER", http_status: 409, applies_to: "POST /npdes/permits; POST /npdes/outfalls" }
  - { priority: 26, category: business_constraint, check: "At most one RenewalApplication with status in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} per permit", error_id: ERR_RENEWAL_ALREADY_PENDING, http_status: 409, applies_to: "POST /npdes/renewal-applications" }
  - { priority: 27, category: business_constraint, check: "Sample scheduling cross-entity gate: permit (SamplingEvent.outfall_id -> Outfall.permit_id -> Permit.id) status == ACTIVE (ERR_PERMIT_NOT_ACTIVE); outfall status == ACTIVE (ERR_OUTFALL_INACTIVE); an ACTIVE EffluentLimit for (outfall, parameter_code) exists whose range covers scheduled_for (ERR_NO_ACTIVE_LIMIT). Outfall creation requires permit status in {DRAFT, ACTIVE} (ERR_PERMIT_NOT_ACTIVE); limit creation requires outfall ACTIVE (ERR_OUTFALL_INACTIVE)", error_id: "ERR_PERMIT_NOT_ACTIVE / ERR_OUTFALL_INACTIVE / ERR_NO_ACTIVE_LIMIT", http_status: 409, applies_to: "POST /npdes/sampling-events; POST /npdes/outfalls; POST /npdes/effluent-limits" }
  - { priority: 28, category: business_constraint, check: "DMR certify gates: monitoring_completeness_ratio >= 0.5 (ERR_DMR_MONITORING_INCOMPLETE, 422); no period exceedance with notification_status in {PENDING_ORAL, ORAL_OVERDUE} (ERR_DMR_EXCEEDANCES_UNRESOLVED, 409). DMR submit gate: no period exceedance with notification_status in {PENDING_ORAL, ORAL_OVERDUE, ORAL_NOTIFIED, WRITTEN_OVERDUE} (ERR_DMR_EXCEEDANCES_UNRESOLVED, 409)", error_id: "ERR_DMR_MONITORING_INCOMPLETE / ERR_DMR_EXCEEDANCES_UNRESOLVED", http_status: 409, applies_to: "POST /npdes/dmrs/{id}/certify; POST /npdes/dmrs/{id}/submit" }
  - { priority: 29, category: business_referential, check: "LabResult.parameter_code must equal SamplingEvent.parameter_code (ERR_PARAMETER_MISMATCH); LabResult.unit must equal the governing ACTIVE limit's unit when one exists (ERR_UNIT_MISMATCH)", error_id: "ERR_PARAMETER_MISMATCH / ERR_UNIT_MISMATCH", http_status: 400, applies_to: "POST /npdes/lab-results" }
  - { priority: 30, category: business_referential, check: "supersedes_limit_id must reference an ACTIVE EffluentLimit of the same outfall_id, parameter_code and limit_type", error_id: ERR_LIMIT_SUPERSEDE_MISMATCH, http_status: 400, applies_to: "POST /npdes/effluent-limits" }
  - { priority: 31, category: business_fiscal, check: "Penalty payments: PAYMENT amount_cents <= outstanding_cents (ERR_PAYMENT_AMOUNT_INVALID, 422); REFUND amount_cents <= paid_cents - refunded_cents (ERR_REFUND_EXCEEDS_PAID, 422)", error_id: "ERR_PAYMENT_AMOUNT_INVALID / ERR_REFUND_EXCEEDS_PAID", http_status: 422, applies_to: "POST /npdes/consent-orders/{id}/payments" }
  - { priority: 32, category: business_temporal, check: "Logical clock monotonicity: to_iso8601 must be strictly after the current logical clock", error_id: ERR_CLOCK_REGRESSION, http_status: 400, applies_to: "POST /npdes/_clock/set_current_utc" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Permits ---
  - { method: POST, path: "/npdes/permits", description: "Create a permit in DRAFT", roles: [EnvironmentalManager], code: 201, input: [permit_number, facility_name, receiving_water_body, effective_date, expiration_date], output: Permit, side_effects: ["AuditLogEntry appended (PERMIT_CREATED)"] }
  - { method: GET, path: "/npdes/permits", description: "List permits", roles: [Any], code: 200, input: ["status?", "superseded_by_permit_id?"], output: "Permit[]", side_effects: [] }
  - { method: GET, path: "/npdes/permits/{id}", description: "Get one permit (includes computed posture and counters)", roles: [Any], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: POST, path: "/npdes/permits/{id}/issue", description: "Issue a DRAFT permit -> ACTIVE", roles: [EnvironmentalManager], code: 200, input: [], output: Permit, side_effects: ["Permit DRAFT -> ACTIVE; Permit.version += 1; audit"] }
  - { method: POST, path: "/npdes/permits/{id}/terminate", description: "Terminate an ACTIVE permit", roles: [EnvironmentalManager], code: 200, input: [], output: Permit, side_effects: ["Permit ACTIVE -> TERMINATED; outfalls INACTIVE; SCHEDULED samples CANCELLED; Permit.version += 1; audit"] }

  # --- Outfalls ---
  - { method: POST, path: "/npdes/outfalls", description: "Create an outfall under a permit (permit must be DRAFT or ACTIVE)", roles: [EnvironmentalManager], code: 201, input: [permit_id, outfall_number, "description?"], output: Outfall, side_effects: ["AuditLogEntry appended (OUTFALL_CREATED)"] }
  - { method: GET, path: "/npdes/outfalls", description: "List outfalls", roles: [Any], code: 200, input: ["permit_id?", "status?"], output: "Outfall[]", side_effects: [] }
  - { method: GET, path: "/npdes/outfalls/{id}", description: "Get one outfall", roles: [Any], code: 200, input: [], output: Outfall, side_effects: [] }
  - { method: POST, path: "/npdes/outfalls/{id}/deactivate", description: "Deactivate an outfall; SCHEDULED samples of it are CANCELLED", roles: [EnvironmentalManager], code: 200, input: [], output: Outfall, side_effects: ["Outfall ACTIVE -> INACTIVE; samples CANCELLED; Outfall.version += 1; audit"] }
  - { method: POST, path: "/npdes/outfalls/{id}/reactivate", description: "Reactivate an outfall while its permit is ACTIVE", roles: [EnvironmentalManager], code: 200, input: [], output: Outfall, side_effects: ["Outfall INACTIVE -> ACTIVE; Outfall.version += 1; audit"] }

  # --- Effluent limits ---
  - { method: POST, path: "/npdes/effluent-limits", description: "Create an effluent limit (optionally superseding an existing ACTIVE limit). OCC: expected_outfall_version must equal Outfall.version.", roles: [EnvironmentalManager], code: 201, input: [outfall_id, parameter_code, limit_type, limit_value, unit, monitoring_frequency, effective_from, "effective_to?", "average_method?", "supersedes_limit_id?", expected_outfall_version], output: EffluentLimit, side_effects: ["Increments Outfall.version by 1", "If supersedes_limit_id set: that limit ACTIVE -> SUPERSEDED", "AuditLogEntry appended (LIMIT_CREATED, LIMIT_SUPERSEDED)"] }
  - { method: GET, path: "/npdes/effluent-limits", description: "List effluent limits", roles: [Any], code: 200, input: ["outfall_id?", "supersedes_limit_id?", "status?"], output: "EffluentLimit[]", side_effects: [] }
  - { method: GET, path: "/npdes/effluent-limits/{id}", description: "Get one effluent limit", roles: [Any], code: 200, input: [], output: EffluentLimit, side_effects: [] }
  - { method: POST, path: "/npdes/effluent-limits/{id}/rescind", description: "Rescind a successor limit; its superseded predecessor returns to ACTIVE (compensating action)", roles: [EnvironmentalManager], code: 200, input: [], output: EffluentLimit, side_effects: ["Limit ACTIVE -> RESCINDED; predecessor SUPERSEDED -> ACTIVE; Outfall.version += 1; audit"] }

  # --- Sampling events & custody ---
  - { method: POST, path: "/npdes/sampling-events", description: "Schedule a sampling event (permit ACTIVE, outfall ACTIVE, covering ACTIVE limit required)", roles: [FieldSampler], code: 201, input: [outfall_id, parameter_code, scheduled_for, "collection_window_hours?"], output: SamplingEvent, side_effects: ["AuditLogEntry appended (SAMPLE_SCHEDULED)"] }
  - { method: GET, path: "/npdes/sampling-events", description: "List sampling events", roles: [Any], code: 200, input: ["outfall_id?", "schedule_status?"], output: "SamplingEvent[]", side_effects: [] }
  - { method: GET, path: "/npdes/sampling-events/{id}", description: "Get one sampling event (both state dimensions)", roles: [Any], code: 200, input: [], output: SamplingEvent, side_effects: [] }
  - { method: POST, path: "/npdes/sampling-events/{id}/collect", description: "Collect within the window; seals custody (SEAL record auto-appended)", roles: [FieldSampler], code: 200, input: [], output: SamplingEvent, side_effects: ["schedule SCHEDULED -> COLLECTED; custody NOT_SEALED -> SEALED; SEAL custody record appended; SamplingEvent.version += 1; audit"] }
  - { method: POST, path: "/npdes/sampling-events/{id}/cancel", description: "Cancel a scheduled sampling event", roles: [FieldSampler], code: 200, input: [], output: SamplingEvent, side_effects: ["schedule SCHEDULED -> CANCELLED; audit"] }
  - { method: POST, path: "/npdes/sampling-events/{id}/custody-events", description: "Append a chain-of-custody event (TRANSFER/RECEIVE_LAB/ANALYSIS_START); advances the custody dimension", roles: [FieldSampler, LabAnalyst], code: 201, input: [event_type, event_at, "from_party?", "to_party?", "note?"], output: ChainOfCustodyRecord, side_effects: ["custody_status advanced per event_type; SamplingEvent.version += 1; audit (CUSTODY_APPENDED)"] }
  - { method: GET, path: "/npdes/sampling-events/{id}/custody-events", description: "List the custody chain of a sample, ordered by sequence_index", roles: [Any], code: 200, input: [], output: "ChainOfCustodyRecord[]", side_effects: [] }

  # --- Lab results ---
  - { method: POST, path: "/npdes/lab-results", description: "Record an analytical result (custody must be LAB_RECEIVED or ANALYZED)", roles: [LabAnalyst], code: 201, input: [sampling_event_id, parameter_code, reported_value, unit, method_detection_limit, flow_mgd, analyzed_at, "qualifier?"], output: LabResult, side_effects: ["analyzed_by_user_id := X-User-ID; validation_status = SUBMITTED; audit (RESULT_RECORDED)"] }
  - { method: GET, path: "/npdes/lab-results", description: "List lab results", roles: [Any], code: 200, input: ["sampling_event_id?", "exceedance_id?", "validation_status?"], output: "LabResult[]", side_effects: [] }
  - { method: GET, path: "/npdes/lab-results/{id}", description: "Get one lab result", roles: [Any], code: 200, input: [], output: LabResult, side_effects: [] }
  - { method: POST, path: "/npdes/lab-results/{id}/validate", description: "Validate a result (segregation: validator != analyst). Triggers exceedance detection cascade.", roles: [LabValidator], code: 200, input: [], output: LabResult, side_effects: ["SUBMITTED -> VALIDATED; exceedance detection per exceedance_magnitude_percent; on breach: Exceedance created -> CorrectiveAction created -> Permit counters/posture recomputed; sample may auto-CLOSE; audit"] }
  - { method: POST, path: "/npdes/lab-results/{id}/reject", description: "Reject a result with a reason (segregation applies)", roles: [LabValidator], code: 200, input: [reason], output: LabResult, side_effects: ["SUBMITTED -> REJECTED; audit"] }
  - { method: POST, path: "/npdes/lab-results/{id}/resubmit", description: "Resubmit a rejected result with corrections (validation cycle)", roles: [LabAnalyst], code: 200, input: ["reported_value?", "qualifier?", "analyzed_at?"], output: LabResult, side_effects: ["REJECTED -> SUBMITTED; analyzed_by_user_id := X-User-ID; rejection_reason cleared; audit"] }

  # --- Exceedances ---
  - { method: GET, path: "/npdes/exceedances", description: "List exceedances", roles: [Any], code: 200, input: ["outfall_id?", "lab_result_id?", "effluent_limit_id?", "corrective_action_id?", "notification_status?"], output: "Exceedance[]", side_effects: [] }
  - { method: GET, path: "/npdes/exceedances/{id}", description: "Get one exceedance (both state dimensions, deadlines)", roles: [Any], code: 200, input: [], output: Exceedance, side_effects: [] }
  - { method: POST, path: "/npdes/exceedances/{id}/notify", description: "Record the 24h oral notification (late notification allowed from ORAL_OVERDUE)", roles: [ComplianceOfficer], code: 200, input: [], output: Exceedance, side_effects: ["notification -> ORAL_NOTIFIED; oral_notified_at := clock; audit"] }
  - { method: POST, path: "/npdes/exceedances/{id}/file-report", description: "File the 5-day written report", roles: [ComplianceOfficer], code: 200, input: [report_summary], output: Exceedance, side_effects: ["notification -> WRITTEN_FILED; written_filed_at := clock; audit"] }
  - { method: POST, path: "/npdes/exceedances/{id}/close", description: "Close an exceedance whose corrective action is verified", roles: [ComplianceOfficer], code: 200, input: [], output: Exceedance, side_effects: ["notification -> CLOSED; Permit.open_exceedance_count and posture recomputed; audit"] }

  # --- DMRs ---
  - { method: POST, path: "/npdes/dmrs", description: "Generate a Discharge Monitoring Report for an outfall+period (computes counts, ratio, summary_lines)", roles: [ComplianceOfficer], code: 201, input: [outfall_id, period_start, period_end], output: DischargeMonitoringReport, side_effects: ["monitoring_completeness + monthly_average_effluent + dmr_pollutant_loading computed; prepared_by_user_id := X-User-ID; audit (DMR_CREATED)"] }
  - { method: GET, path: "/npdes/dmrs", description: "List DMRs", roles: [Any], code: 200, input: ["outfall_id?", "status?"], output: "DischargeMonitoringReport[]", side_effects: [] }
  - { method: GET, path: "/npdes/dmrs/{id}", description: "Get one DMR", roles: [Any], code: 200, input: [], output: DischargeMonitoringReport, side_effects: [] }
  - { method: POST, path: "/npdes/dmrs/{id}/certify", description: "Certify a DRAFT DMR (segregation: certifier != preparer; completeness/breach/oral-notification gates)", roles: [ComplianceOfficer], code: 200, input: [], output: DischargeMonitoringReport, side_effects: ["DRAFT -> CERTIFIED; certified_by_user_id := X-User-ID; audit"] }
  - { method: POST, path: "/npdes/dmrs/{id}/submit", description: "Submit a CERTIFIED DMR (all period exceedances must be WRITTEN_FILED/CLOSED)", roles: [ComplianceOfficer], code: 200, input: [], output: DischargeMonitoringReport, side_effects: ["CERTIFIED -> SUBMITTED; submitted_at := clock; is_late recomputed; audit"] }
  - { method: POST, path: "/npdes/dmrs/{id}/agency-review", description: "Agency decision on a SUBMITTED DMR (ACCEPTED or REJECTED with deficiency_notes)", roles: [Regulator], code: 200, input: [decision, "deficiency_notes?"], output: DischargeMonitoringReport, side_effects: ["SUBMITTED -> ACCEPTED | REJECTED; audit"] }
  - { method: POST, path: "/npdes/dmrs/{id}/revise", description: "Return a REJECTED DMR to DRAFT for correction (cycle); recomputes summary from current VALIDATED results", roles: [ComplianceOfficer], code: 200, input: [], output: DischargeMonitoringReport, side_effects: ["REJECTED -> DRAFT; certified_by_user_id cleared; summary recomputed; audit"] }

  # --- SWPPP plans & inspections ---
  - { method: POST, path: "/npdes/swppp-plans", description: "Create a stormwater pollution prevention plan (DRAFT)", roles: [FacilityInspector], code: 201, input: [permit_id, plan_title, version_label, inspection_frequency_days], output: StormwaterPlan, side_effects: ["AuditLogEntry appended (PLAN_CREATED)"] }
  - { method: GET, path: "/npdes/swppp-plans", description: "List SWPPP plans", roles: [Any], code: 200, input: ["permit_id?", "status?"], output: "StormwaterPlan[]", side_effects: [] }
  - { method: GET, path: "/npdes/swppp-plans/{id}", description: "Get one SWPPP plan", roles: [Any], code: 200, input: [], output: StormwaterPlan, side_effects: [] }
  - { method: POST, path: "/npdes/swppp-plans/{id}/activate", description: "Activate a plan; supersedes the permit's currently ACTIVE plan. OCC: expected_permit_version must equal Permit.version.", roles: [FacilityInspector], code: 200, input: [expected_permit_version], output: StormwaterPlan, side_effects: ["DRAFT -> ACTIVE; prior ACTIVE plan of same permit -> SUPERSEDED; increments Permit.version by 1; audit"] }
  - { method: POST, path: "/npdes/inspections", description: "Schedule an inspection (7-day minimum spacing per plan)", roles: [FacilityInspector], code: 201, input: [plan_id, scheduled_for], output: Inspection, side_effects: ["AuditLogEntry appended (INSPECTION_SCHEDULED)"] }
  - { method: GET, path: "/npdes/inspections", description: "List inspections", roles: [Any], code: 200, input: ["plan_id?", "status?"], output: "Inspection[]", side_effects: [] }
  - { method: GET, path: "/npdes/inspections/{id}", description: "Get one inspection", roles: [Any], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: POST, path: "/npdes/inspections/{id}/complete", description: "Complete an inspection with findings; each finding spawns an OPEN CorrectiveAction", roles: [FacilityInspector], code: 200, input: [findings], output: Inspection, side_effects: ["SCHEDULED -> COMPLETED; CorrectiveAction created per finding; Permit counters/posture recomputed; audit"] }
  - { method: POST, path: "/npdes/inspections/{id}/cancel", description: "Cancel a scheduled inspection", roles: [FacilityInspector], code: 200, input: [], output: Inspection, side_effects: ["SCHEDULED -> CANCELLED; audit"] }

  # --- Corrective actions ---
  - { method: GET, path: "/npdes/corrective-actions", description: "List corrective actions", roles: [Any], code: 200, input: ["inspection_id?", "exceedance_id?", "status?"], output: "CorrectiveAction[]", side_effects: [] }
  - { method: GET, path: "/npdes/corrective-actions/{id}", description: "Get one corrective action", roles: [Any], code: 200, input: [], output: CorrectiveAction, side_effects: [] }
  - { method: POST, path: "/npdes/corrective-actions/{id}/start", description: "Start work (from OPEN or REOPENED)", roles: [FacilityInspector], code: 200, input: [], output: CorrectiveAction, side_effects: ["OPEN/REOPENED -> IN_PROGRESS; audit"] }
  - { method: POST, path: "/npdes/corrective-actions/{id}/complete", description: "Mark work complete with actual remediation cost", roles: [FacilityInspector], code: 200, input: [actual_cost_cents], output: CorrectiveAction, side_effects: ["IN_PROGRESS -> COMPLETED; resolved_at/resolved_by/actual_cost_cents set; audit"] }
  - { method: POST, path: "/npdes/corrective-actions/{id}/verify", description: "Regulator verifies completed work (segregation: verifier != resolver); releases the permit's open-action count", roles: [Regulator], code: 200, input: [], output: CorrectiveAction, side_effects: ["COMPLETED -> VERIFIED; Permit.open_corrective_action_count and posture recomputed; audit"] }
  - { method: POST, path: "/npdes/corrective-actions/{id}/reopen", description: "Regulator reopens a verified action (cycle back into the open set)", roles: [Regulator], code: 200, input: [reason], output: CorrectiveAction, side_effects: ["VERIFIED -> REOPENED; resolver/verifier/cost fields cleared; Permit counters/posture recomputed; audit"] }
  - { method: POST, path: "/npdes/corrective-actions/{id}/close", description: "Close a verified corrective action (terminal)", roles: [FacilityInspector], code: 200, input: [], output: CorrectiveAction, side_effects: ["VERIFIED -> CLOSED; audit"] }

  # --- Renewal applications ---
  - { method: POST, path: "/npdes/renewal-applications", description: "Submit a renewal application (only inside the 180-day pre-expiration window; one open application per permit)", roles: [EnvironmentalManager], code: 201, input: [permit_id, proposed_expiration_date], output: RenewalApplication, side_effects: ["AuditLogEntry appended (RENEWAL_SUBMITTED)"] }
  - { method: GET, path: "/npdes/renewal-applications", description: "List renewal applications", roles: [Any], code: 200, input: ["permit_id?", "status?", "resulting_permit_id?"], output: "RenewalApplication[]", side_effects: [] }
  - { method: GET, path: "/npdes/renewal-applications/{id}", description: "Get one renewal application", roles: [Any], code: 200, input: [], output: RenewalApplication, side_effects: [] }
  - { method: POST, path: "/npdes/renewal-applications/{id}/start-review", description: "Agency starts review", roles: [Regulator], code: 200, input: [], output: RenewalApplication, side_effects: ["SUBMITTED -> UNDER_REVIEW; audit"] }
  - { method: POST, path: "/npdes/renewal-applications/{id}/request-info", description: "Agency requests additional information", roles: [Regulator], code: 200, input: [info_request_note], output: RenewalApplication, side_effects: ["UNDER_REVIEW -> INFO_REQUESTED; audit"] }
  - { method: POST, path: "/npdes/renewal-applications/{id}/resume-review", description: "Agency resumes review after info received", roles: [Regulator], code: 200, input: [], output: RenewalApplication, side_effects: ["INFO_REQUESTED -> UNDER_REVIEW; audit"] }
  - { method: POST, path: "/npdes/renewal-applications/{id}/approve", description: "Approve renewal: creates the successor Permit (ACTIVE) and cascades supersession. OCC: expected_permit_version must equal Permit.version.", roles: [Regulator], code: 200, input: [expected_permit_version, new_permit_number, new_effective_date, new_expiration_date], output: RenewalApplication, side_effects: ["UNDER_REVIEW -> APPROVED; successor Permit created; old Permit -> SUPERSEDED (Permit.version += 1); old outfalls INACTIVE; their SCHEDULED samples CANCELLED; audit per hop"] }
  - { method: POST, path: "/npdes/renewal-applications/{id}/deny", description: "Deny a renewal application", roles: [Regulator], code: 200, input: [reason], output: RenewalApplication, side_effects: ["UNDER_REVIEW -> DENIED; audit"] }

  # --- Consent orders & penalty ledger ---
  - { method: POST, path: "/npdes/consent-orders", description: "Propose a consent order against an exceedance (sets enforcement ORDER_ISSUED)", roles: [Regulator], code: 201, input: [exceedance_id, assessment_variant, base_penalty_cents, statutory_cap_cents, "daily_accrual_cents?", "avoided_cost_cents?", "gravity_factor?"], output: ConsentOrder, side_effects: ["Exceedance.enforcement_status NONE -> ORDER_ISSUED; Permit.compliance_posture recomputed (ENFORCEMENT); audit (ORDER_PROPOSED)"] }
  - { method: GET, path: "/npdes/consent-orders", description: "List consent orders", roles: [Any], code: 200, input: ["exceedance_id?", "status?"], output: "ConsentOrder[]", side_effects: [] }
  - { method: GET, path: "/npdes/consent-orders/{id}", description: "Get one consent order (provisional/final amounts recomputed at read)", roles: [Any], code: 200, input: [], output: ConsentOrder, side_effects: [] }
  - { method: POST, path: "/npdes/consent-orders/{id}/issue", description: "Issue the order; accrual starts from the violation date", roles: [Regulator], code: 200, input: [], output: ConsentOrder, side_effects: ["PROPOSED -> ISSUED; issued_at := clock; audit"] }
  - { method: POST, path: "/npdes/consent-orders/{id}/appeal", description: "Facility appeals the order (accrual continues)", roles: [EnvironmentalManager], code: 200, input: [appeal_grounds], output: ConsentOrder, side_effects: ["ISSUED -> UNDER_APPEAL; audit"] }
  - { method: POST, path: "/npdes/consent-orders/{id}/finalize", description: "Finalize assessment: resolves cure date, applies mitigation credit, fixes final_amount_cents", roles: [Regulator], code: 200, input: [], output: ConsentOrder, side_effects: ["ISSUED/UNDER_APPEAL -> FINAL; final_amount_cents and outstanding_cents computed; audit"] }
  - { method: POST, path: "/npdes/consent-orders/{id}/payments", description: "Post a payment or refund against a FINAL order; outstanding == 0 auto-satisfies the order and resolves enforcement", roles: [ComplianceOfficer], code: 201, input: [direction, amount_cents], output: PenaltyPayment, side_effects: ["PenaltyPayment POSTED; ConsentOrder paid_cents/refunded_cents/outstanding_cents recomputed; on outstanding == 0: order FINAL -> SATISFIED -> Exceedance.enforcement RESOLVED -> Permit posture recomputed; audit"] }
  - { method: GET, path: "/npdes/consent-orders/{id}/payments", description: "List the payment ledger of a consent order", roles: [Any], code: 200, input: [], output: "PenaltyPayment[]", side_effects: [] }

  # --- Audit chain & logical clock ---
  - { method: GET, path: "/npdes/audit-entries", description: "List audit log entries (append-only hash chain), filterable by entity", roles: [Any], code: 200, input: ["entity_type?", "entity_id?"], output: "AuditLogEntry[]", side_effects: [] }
  - { method: POST, path: "/npdes/_clock/set_current_utc", description: "Test-driving logical clock. Server startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock runs the sweep: permit expiry, sample MISSED, notification ORAL/WRITTEN overdue transitions. Clock is monotonic (regression rejected).", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string, transitions_applied: integer }", side_effects: ["Auto-transitions applied for Permit EXPIRED, SamplingEvent MISSED, Exceedance ORAL_OVERDUE/WRITTEN_OVERDUE; each sweep transition appends its own AuditLogEntry"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role not permitted for this endpoint" }
  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id not found" }
  - { id: ERR_OUTFALL_NOT_FOUND, http: 404, condition: "Outfall id not found" }
  - { id: ERR_LIMIT_NOT_FOUND, http: 404, condition: "EffluentLimit id not found" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "SamplingEvent id not found" }
  - { id: ERR_RESULT_NOT_FOUND, http: 404, condition: "LabResult id not found" }
  - { id: ERR_EXCEEDANCE_NOT_FOUND, http: 404, condition: "Exceedance id not found" }
  - { id: ERR_DMR_NOT_FOUND, http: 404, condition: "DischargeMonitoringReport id not found" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "StormwaterPlan id not found" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id not found" }
  - { id: ERR_CORRECTIVE_ACTION_NOT_FOUND, http: 404, condition: "CorrectiveAction id not found" }
  - { id: ERR_RENEWAL_NOT_FOUND, http: 404, condition: "RenewalApplication id not found" }
  - { id: ERR_CONSENT_ORDER_NOT_FOUND, http: 404, condition: "ConsentOrder id not found" }
  # --- input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, bad range, effective_to <= effective_from, period_end < period_start, expiration_date <= effective_date, base_penalty_cents > statutory_cap_cents, REJECTED review without deficiency_notes" }
  - { id: ERR_PARAMETER_MISMATCH, http: 400, condition: "LabResult.parameter_code differs from its SamplingEvent.parameter_code" }
  - { id: ERR_UNIT_MISMATCH, http: 400, condition: "LabResult.unit differs from the governing ACTIVE limit's unit" }
  - { id: ERR_LIMIT_SUPERSEDE_MISMATCH, http: 400, condition: "supersedes_limit_id references a limit of a different outfall, parameter, or limit_type" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_outfall_version / expected_permit_version does not match the parent's current version" }
  # --- state: permit / outfall / limit ---
  - { id: ERR_PERMIT_NOT_IN_DRAFT, http: 409, condition: "Issue requires the permit in DRAFT" }
  - { id: ERR_PERMIT_NOT_ISSUABLE, http: 409, condition: "Clock is outside [effective_date, expiration_date) at issue" }
  - { id: ERR_PERMIT_NO_OUTFALL, http: 409, condition: "Issue requires at least one ACTIVE outfall" }
  - { id: ERR_OUTFALL_NO_ACTIVE_LIMIT, http: 409, condition: "Issue requires every ACTIVE outfall to hold at least one ACTIVE effluent limit" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Operation requires the permit in ACTIVE (or DRAFT/ACTIVE for outfall creation)" }
  - { id: ERR_OUTFALL_INACTIVE, http: 409, condition: "Operation requires the outfall in ACTIVE" }
  - { id: ERR_OUTFALL_NOT_INACTIVE, http: 409, condition: "Reactivate requires the outfall in INACTIVE" }
  - { id: ERR_LIMIT_NOT_ACTIVE, http: 409, condition: "Rescind requires the limit in ACTIVE" }
  - { id: ERR_LIMIT_NOT_A_SUCCESSOR, http: 409, condition: "Rescind requires the limit to have been created with a supersedes_limit_id" }
  - { id: ERR_LIMIT_RANGE_OVERLAP, http: 409, condition: "New ACTIVE limit's half-open effective range intersects another ACTIVE limit of the same (outfall, parameter, limit_type)" }
  - { id: ERR_NO_ACTIVE_LIMIT, http: 409, condition: "No ACTIVE EffluentLimit covers (outfall, parameter_code) at scheduled_for" }
  # --- state: sampling / custody / results ---
  - { id: ERR_SAMPLE_NOT_SCHEDULED, http: 409, condition: "Collect/cancel require schedule_status SCHEDULED" }
  - { id: ERR_COLLECTION_WINDOW_CLOSED, http: 422, condition: "Clock outside [scheduled_for - window, scheduled_for + window] at collect" }
  - { id: ERR_CUSTODY_OUT_OF_ORDER, http: 409, condition: "Custody event type does not match the next expected custody transition" }
  - { id: ERR_SAMPLE_NOT_IN_LAB, http: 409, condition: "LabResult recording requires custody_status in {LAB_RECEIVED, ANALYZED}" }
  - { id: ERR_CUSTODY_NOT_ANALYZED, http: 409, condition: "LabResult validation requires custody_status == ANALYZED" }
  - { id: ERR_RESULT_NOT_SUBMITTED, http: 409, condition: "Validate/reject require validation_status SUBMITTED" }
  - { id: ERR_RESULT_NOT_REJECTED, http: 409, condition: "Resubmit requires validation_status REJECTED" }
  - { id: ERR_HOLDING_TIME_EXCEEDED, http: 422, condition: "analyzed_at - collected_at exceeds the parameter's holding time at validation" }
  # --- segregation ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caller is the same user who performed the upstream step (analyst/validator, preparer/certifier, resolver/verifier)" }
  # --- exceedances / DMR ---
  - { id: ERR_INVALID_NOTIFICATION_STATE, http: 409, condition: "Notify/file-report/close invoked from a notification_status that does not allow it" }
  - { id: ERR_EXCEEDANCE_NOT_CLOSABLE, http: 409, condition: "Close requires the linked corrective action VERIFIED or CLOSED" }
  - { id: ERR_DMR_NOT_DRAFT, http: 409, condition: "Certify requires DMR status DRAFT" }
  - { id: ERR_DMR_NOT_CERTIFIED, http: 409, condition: "Submit requires DMR status CERTIFIED" }
  - { id: ERR_DMR_NOT_SUBMITTED, http: 409, condition: "Agency review requires DMR status SUBMITTED" }
  - { id: ERR_DMR_NOT_REJECTED, http: 409, condition: "Revise requires DMR status REJECTED" }
  - { id: ERR_DMR_MONITORING_INCOMPLETE, http: 422, condition: "monitoring_completeness_ratio < 0.5 at certify" }
  - { id: ERR_DMR_EXCEEDANCES_UNRESOLVED, http: 409, condition: "Period exceedances block certify (oral pending) or submit (written pending)" }
  # --- SWPPP / inspections / corrective actions ---
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Plan activation requires status DRAFT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Inspection completion requires the parent plan ACTIVE" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "Complete/cancel require inspection SCHEDULED" }
  - { id: ERR_INSPECTION_TOO_SOON, http: 409, condition: "Another non-cancelled inspection of the same plan is scheduled strictly less than 7 days away" }
  - { id: ERR_CORRECTIVE_ACTION_INVALID_STATE, http: 409, condition: "CorrectiveAction transition invoked from a disallowed status" }
  # --- renewal ---
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Clock outside [expiration_date - 180d, expiration_date)" }
  - { id: ERR_RENEWAL_ALREADY_PENDING, http: 409, condition: "An open RenewalApplication already exists for this permit" }
  - { id: ERR_RENEWAL_NOT_SUBMITTED, http: 409, condition: "start-review requires SUBMITTED" }
  - { id: ERR_RENEWAL_NOT_UNDER_REVIEW, http: 409, condition: "request-info/approve/deny require UNDER_REVIEW" }
  - { id: ERR_RENEWAL_NOT_INFO_REQUESTED, http: 409, condition: "resume-review requires INFO_REQUESTED" }
  # --- consent orders / payments ---
  - { id: ERR_CONSENT_ORDER_INVALID_STATE, http: 409, condition: "issue/appeal/finalize invoked from a disallowed status" }
  - { id: ERR_CONSENT_ORDER_NOT_PAYABLE, http: 409, condition: "Payments require the order in FINAL" }
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 422, condition: "PAYMENT amount exceeds outstanding_cents (or is not positive)" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "REFUND amount exceeds paid_cents - refunded_cents" }
  # --- clock ---
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "to_iso8601 is not strictly after the current logical clock" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model; all roles opaque, X-User-ID
# is an operator id stored on entities and compared by the SoD checks)
# =============================================================================
roles:
  - name: EnvironmentalManager
    description: "Facility-side environmental manager: permit lifecycle, outfalls, effluent limits, renewals, consent-order appeals"
    identity: opaque
    exclusive_operations: ["POST /npdes/permits", "POST /npdes/permits/{id}/issue", "POST /npdes/permits/{id}/terminate", "POST /npdes/outfalls", "POST /npdes/outfalls/{id}/deactivate", "POST /npdes/outfalls/{id}/reactivate", "POST /npdes/effluent-limits", "POST /npdes/effluent-limits/{id}/rescind", "POST /npdes/renewal-applications", "POST /npdes/consent-orders/{id}/appeal"]
    shared_operations: ["all GET endpoints"]
  - name: FieldSampler
    description: "Field sampling crew: scheduling, collection, custody transfer"
    identity: opaque
    exclusive_operations: ["POST /npdes/sampling-events", "POST /npdes/sampling-events/{id}/collect", "POST /npdes/sampling-events/{id}/cancel"]
    shared_operations: ["POST /npdes/sampling-events/{id}/custody-events (with LabAnalyst)", "all GET endpoints"]
  - name: LabAnalyst
    description: "Laboratory analyst: lab receipt/analysis custody steps, result recording, resubmission"
    identity: opaque
    exclusive_operations: ["POST /npdes/lab-results", "POST /npdes/lab-results/{id}/resubmit"]
    shared_operations: ["POST /npdes/sampling-events/{id}/custody-events (with FieldSampler)", "all GET endpoints"]
  - name: LabValidator
    description: "Independent lab data validator (MUST NOT be the recording analyst on the same result)"
    identity: opaque
    exclusive_operations: ["POST /npdes/lab-results/{id}/validate", "POST /npdes/lab-results/{id}/reject"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Facility compliance officer: exceedance notifications/reports, DMR preparation & certification (preparer != certifier), penalty payments"
    identity: opaque
    exclusive_operations: ["POST /npdes/exceedances/{id}/notify", "POST /npdes/exceedances/{id}/file-report", "POST /npdes/exceedances/{id}/close", "POST /npdes/dmrs", "POST /npdes/dmrs/{id}/certify", "POST /npdes/dmrs/{id}/submit", "POST /npdes/dmrs/{id}/revise", "POST /npdes/consent-orders/{id}/payments"]
    shared_operations: ["all GET endpoints"]
  - name: FacilityInspector
    description: "SWPPP owner: plans, inspections, BMP corrective-action execution"
    identity: opaque
    exclusive_operations: ["POST /npdes/swppp-plans", "POST /npdes/swppp-plans/{id}/activate", "POST /npdes/inspections", "POST /npdes/inspections/{id}/complete", "POST /npdes/inspections/{id}/cancel", "POST /npdes/corrective-actions/{id}/start", "POST /npdes/corrective-actions/{id}/complete", "POST /npdes/corrective-actions/{id}/close"]
    shared_operations: ["all GET endpoints"]
  - name: Regulator
    description: "Agency regulator: DMR review, renewal decisions, corrective-action verification/reopen, consent-order issuance/finalization"
    identity: opaque
    exclusive_operations: ["POST /npdes/dmrs/{id}/agency-review", "POST /npdes/renewal-applications/{id}/start-review", "POST /npdes/renewal-applications/{id}/request-info", "POST /npdes/renewal-applications/{id}/resume-review", "POST /npdes/renewal-applications/{id}/approve", "POST /npdes/renewal-applications/{id}/deny", "POST /npdes/corrective-actions/{id}/verify", "POST /npdes/corrective-actions/{id}/reopen", "POST /npdes/consent-orders", "POST /npdes/consent-orders/{id}/issue", "POST /npdes/consent-orders/{id}/finalize"]
    shared_operations: ["all GET endpoints"]
  - name: SystemAdmin
    description: "Operator of the test-driving logical clock"
    identity: opaque
    exclusive_operations: ["POST /npdes/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: Any
    description: "Pseudo-role: any authenticated caller (including the eight roles above) may use read endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
