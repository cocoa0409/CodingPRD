        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A write call without X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-350", name: "Forest Service" }, as: GSAAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the test omits both headers entirely; priority 1 beats every other check)"

      - name: nonexistent_offer_select_returns_not_found_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "existence (priority 4) beats state (priority 6): selecting a well-formed but nonexistent offer id returns 404 ERR_NOT_FOUND, not a state error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /leasing/offers/00000000-0000-0000-0000-000000000000/select", as: GSALeasingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

