# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2478 — Occupational Licensure Portability & Military Spouse Endorsement
#
# Walk of references/claim-extraction-guide.md's nine sections against §1.1–§1.7.
# `section:` values and `claim_type:` values are taken only from that guide.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and no test_recipe.
# All chains start from an empty DB with the logical clock at its startup
# default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: profession_creation_returns_201_with_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.Profession
          - endpoints.POST_licensure_professions
        distinguishing_aspect: "POST /licensure/professions with all 14 required inputs returns 201 and echoes every declared Profession field, including the common id/created_at/updated_at/version block."
        test_recipe:
          setup: ["Empty database; no Profession row exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Profession.${prof}.profession_code == RN and title == Registered Nurse"
            - "Profession.${prof}.required_scope_elements == [ASSESS, TREAT, PRESCRIBE, SUPERVISE] and critical_scope_elements == [PRESCRIBE]"
            - "Profession.${prof}.exam_waiver_min_score == 70.00 and expedite_surcharge_pct == 0.15"
            - "Profession.${prof}.version == 1 and id, created_at, updated_at are all non-null"
            - "The envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: profession_retrieval_returns_stored_representation
        claim_type: Retrieval
        grounds:
          - entities.Profession
          - endpoints.GET_licensure_professions_id
        distinguishing_aspect: "GET /licensure/professions/{id} returns the same field values that the create call stored, with no version bump from the read."
        test_recipe:
          setup: ["One Profession RN created by AgencyAdmin with permit_fee_cents 6000 and version 1."]
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
          trigger:
            - call: "GET /licensure/professions/${prof}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
          assert:
            - "HTTP status is 200 and data.id == ${prof}"
            - "Profession.${prof}.permit_fee_cents == 6000 and standard_processing_days == 90"
            - "Profession.${prof}.version == 1 (the read did not bump version)"

      - name: reciprocal_agreement_listing_paginates_with_limit_and_offset
        claim_type: Listing
        grounds:
          - entities.ReciprocalAgreement
          - endpoints.GET_licensure_professions_id_reciprocal_agreements
        distinguishing_aspect: "With three ReciprocalAgreement rows under one Profession, GET with limit 2 and offset 0 returns 2 items, total_count 3 and has_more true, while offset 2 returns the last item with has_more false."
        test_recipe:
          setup:
            - "One Profession RN."
            - "Three ReciprocalAgreements under it for partner_state TX, NM and AZ, created in that order."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
            - call: "POST /licensure/professions/${prof}/reciprocal-agreements"
              payload: { partner_state: "TX", fee_waiver_pct: 0.50, exam_waiver_allowed: false, jurisprudence_waiver_allowed: false, expires_on: "2027-12-31T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { rec_tx: $.data.id }
            - call: "POST /licensure/professions/${prof}/reciprocal-agreements"
              payload: { partner_state: "NM", fee_waiver_pct: 0.25, exam_waiver_allowed: true, jurisprudence_waiver_allowed: false, expires_on: "2027-12-31T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { rec_nm: $.data.id }
            - call: "POST /licensure/professions/${prof}/reciprocal-agreements"
              payload: { partner_state: "AZ", fee_waiver_pct: 0.10, exam_waiver_allowed: false, jurisprudence_waiver_allowed: true, expires_on: "2027-12-31T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { rec_az: $.data.id }
          trigger:
            - call: "GET /licensure/professions/${prof}/reciprocal-agreements"
              payload: { limit: 2, offset: 0 }
              as: LicensingAnalyst
              as_user_id: "anl_1"
            - call: "GET /licensure/professions/${prof}/reciprocal-agreements"
              payload: { limit: 2, offset: 2 }
              as: LicensingAnalyst
              as_user_id: "anl_1"
          assert:
            - "The first call returns 2 items with total_count == 3 and has_more == true"
            - "The first call's items are ${rec_tx} then ${rec_nm} in created_at ASC order"
            - "The second call returns 1 item, ${rec_az}, with total_count == 3 and has_more == false"
            - "response_type == array on both calls"

      - name: applicant_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Applicant
          - validations[priority=4]
          - errors[ERR_APPLICANT_NOT_FOUND]
        distinguishing_aspect: "GET /licensure/applicants/{id} with an id that was never minted returns ERR_APPLICANT_NOT_FOUND with HTTP 404, not an empty 200 envelope."
        test_recipe:
          setup: ["Empty database; no Applicant row exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /licensure/applicants/ap_does_not_exist"
              payload: {}
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_APPLICANT_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: application_create_missing_pathway_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.LicenseApplication.fields.pathway
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required `pathway` input on POST /licensure/applications returns ERR_INVALID_REQUEST (400) and creates no LicenseApplication row."
        test_recipe:
          setup:
            - "One Profession RN and one Applicant with a verified ACTIVE credential."
            - "No LicenseApplication exists for that applicant."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Ana Wu", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-11001", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
          trigger:
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof}", primary_credential_id: "${cred}" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /licensure/applications with applicant_id ${ap} returns total_count == 0"

      - name: credential_defaults_status_active_and_unverified_when_omitted
        claim_type: Defaults
        grounds:
          - entities.OutOfStateCredential.fields.status
          - entities.OutOfStateCredential.fields.verified_good_standing
        distinguishing_aspect: "Omitting the optional `status` and `verified_good_standing` inputs yields status ACTIVE and verified_good_standing false — the credential defaults to unverified, so it is not yet a qualifying credential."
        test_recipe:
          setup: ["One Applicant with no credential rows."]
          setup_api_calls:
            - call: "POST /licensure/applicants"
              payload: { full_name: "Bo Nilsen", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-11002", scope_elements: ["ASSESS", "TREAT"], practice_hours: 900, issued_at: "2021-06-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
          assert:
            - "HTTP status is 201"
            - "OutOfStateCredential.${cred}.status == ACTIVE"
            - "OutOfStateCredential.${cred}.verified_good_standing == false"
            - "OutOfStateCredential.${cred}.applicant_id == ${ap}"
            - "GET /licensure/applicants/${ap}/out-of-state-credentials with status ACTIVE returns total_count == 1"

      - name: application_computed_fee_fields_are_zero_while_draft
        claim_type: Computed Fields
        grounds:
          - entities.LicenseApplication.fields.gross_total_cents
          - entities.LicenseApplication.fields.fee_balance_cents
          - entities.LicenseApplication.fields.statutory_waiver_pct
          - calculations.net_fee_due_cents
        distinguishing_aspect: "A DRAFT application has gross_total_cents 0, fee_balance_cents 0 and statutory_waiver_pct 0.00 because net_fee_due_cents is triggered by submit, not by create; no FeeLedgerEntry exists yet."
        test_recipe:
          setup: ["One Profession RN, one Applicant with a verified ACTIVE credential, and no submitted application."]
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Chen Li", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-11003", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
          trigger:
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
          assert:
            - "HTTP status is 201 and LicenseApplication.${app}.status == DRAFT"
            - "LicenseApplication.${app}.gross_total_cents == 0 and fee_balance_cents == 0"
            - "LicenseApplication.${app}.statutory_waiver_pct == 0.00"
            - "LicenseApplication.${app}.submitted_at is null and review_deadline_at is null"
            - "LicenseApplication.${app}.requirement_hours_satisfied == 0.0 and requirement_hours_remaining == 240.0"
            - "GET /licensure/applications/${app}/fee-ledger-entries returns total_count == 0"

      - name: applicant_system_fields_generated_on_create
        claim_type: System Fields
        grounds:
          - entities.Applicant
          - entities.Applicant.fields.disciplinary_risk_index_reported
          - entities.Applicant.fields.good_standing_flag
        distinguishing_aspect: "The server mints id, created_at, updated_at and version 1 on an Applicant create, and the four computed fields start at 0.00 / 0.00 / true / false without any client input."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensure/applicants"
              payload: { full_name: "Dara Okafor", state_code: "TX" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
          assert:
            - "HTTP status is 201 and data.id is a non-empty server-minted string"
            - "Applicant.${ap}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z and version == 1"
            - "Applicant.${ap}.residency_months == 0 and military_status == NONE (declared defaults)"
            - "Applicant.${ap}.disciplinary_risk_index_reported == 0.00 and disciplinary_risk_index_effective == 0.00"
            - "Applicant.${ap}.good_standing_flag == true and fee_waiver_eligible == false"

      - name: fee_ledger_entry_immutable_append_only_without_version
        claim_type: Immutability
        grounds:
          - entities.FeeLedgerEntry
          - endpoints.POST_licensure_applications_id_payments
        distinguishing_aspect: "FeeLedgerEntry is declared common_fields: false, so a payment response carries no `version` field and §1.5 exposes no update or delete route for it; the only way the ledger changes is by appending another row."
        test_recipe:
          setup:
            - "One Profession RN and one non-military applicant with a verified ACTIVE credential."
            - "An ENDORSEMENT application submitted, so gross_total_cents is 48000 and fee_balance_cents is 48000."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Elsa Marin", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-11004", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
            - call: "POST /licensure/applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
          trigger:
            - call: "POST /licensure/applications/${app}/payments"
              payload: { amount_cents: 20000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { pay: $.data.id, pay_amount: $.data.amount_cents }
          assert:
            - "HTTP status is 201 and data.amount_cents == -20000 (payments are stored as negative movements)"
            - "The payment response envelope contains no `version` key"
            - "GET /licensure/applications/${app}/fee-ledger-entries returns 3 entries: ASSESSMENT +48000, WAIVER_CREDIT 0, PAYMENT -20000"
            - "The ASSESSMENT entry's amount_cents is still 48000 after the payment (no in-place edit)"
            - "LicenseApplication.${app}.fee_balance_cents == 28000"

      - name: evaluator_create_invalid_enum_status_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Evaluator.fields.status
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Evaluator.status is constrained to ACTIVE | INACTIVE, so a create carrying status SUSPENDED returns ERR_INVALID_REQUEST (400) and mints no Evaluator row."
        test_recipe:
          setup: ["Empty database; no Evaluator row exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensure/evaluators"
              payload: { full_name: "Bad Enum", profession_code: "RN", status: "SUSPENDED", max_concurrent_reviews: 2 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "No Evaluator row was created (a follow-up GET on any minted id is impossible because no id was returned)"

      - name: credential_create_under_unknown_applicant_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.OutOfStateCredential.fields.applicant_id
          - validations[priority=4]
          - errors[ERR_APPLICANT_NOT_FOUND]
        distinguishing_aspect: "The path segment {id} of POST /licensure/applicants/{id}/out-of-state-credentials must resolve to a real Applicant; an unknown parent yields ERR_APPLICANT_NOT_FOUND (404) rather than an orphan credential."
        test_recipe:
          setup: ["Empty database; no Applicant row exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensure/applicants/ap_ghost_0001/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-11005", scope_elements: ["ASSESS"], practice_hours: 100, status: "ACTIVE", verified_good_standing: true, issued_at: "2021-06-01T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_APPLICANT_NOT_FOUND"
            - "response_type == error"

      - name: evaluation_with_credential_of_other_applicant_rejected
        claim_type: Parent Relationships
        grounds:
          - validations[priority=15]
          - errors[ERR_CREDENTIAL_APPLICANT_MISMATCH]
          - entities.CredentialEvaluation.fields.credential_id
        distinguishing_aspect: "The scaffold's entity_topology is flat, so cross-aggregate integrity is a body-level check: an evaluation naming a credential owned by a different Applicant returns ERR_CREDENTIAL_APPLICANT_MISMATCH (422) even though both ids exist."
        test_recipe:
          setup:
            - "One Profession RN."
            - "Applicant P with a verified ACTIVE credential and a SUBMITTED ENDORSEMENT application."
            - "Applicant Q with a separate verified ACTIVE credential and no application."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Pat Ozal", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_p: $.data.id }
            - call: "POST /licensure/applicants/${ap_p}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-11006", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap_p}"
              captures: { cred_p: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap_p}", profession_id: "${prof}", primary_credential_id: "${cred_p}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap_p}"
              captures: { app_p: $.data.id }
            - call: "POST /licensure/applications/${app_p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap_p}"
            - call: "POST /licensure/applicants"
              payload: { full_name: "Quinn Roth", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_q: $.data.id }
            - call: "POST /licensure/applicants/${ap_q}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-11007", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap_q}"
              captures: { cred_q: $.data.id }
          trigger:
            - call: "POST /licensure/credential-evaluations"
              payload: { application_id: "${app_p}", credential_id: "${cred_q}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == ERR_CREDENTIAL_APPLICANT_MISMATCH"
