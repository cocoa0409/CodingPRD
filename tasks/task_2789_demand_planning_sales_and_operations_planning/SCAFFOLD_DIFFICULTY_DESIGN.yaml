            - "Approve of ${p2_id} returns 200 — 2026-12..2027-01 begins in the month immediately after 2026-11, and closed-inclusive adjacency is NOT an overlap"
            - "Approve of ${p3_id} returns 409 with error_id ERR_PROMOTION_WINDOW_OVERLAP — 2026-11..2026-12 shares 2026-11 with ${p1_id} and 2026-12 with ${p2_id}"
            - "Promotion.${p3_id}.status is still \"DRAFT\" and its mere existence as a DRAFT never blocked ${p1_id} or ${p2_id}"
            - "Approve of ${p4_id} returns 200 — the identical 2026-11..2026-12 window is legal for Customer B because the constraint is scoped per (item_id, customer_id)"

      - name: capacity_block_half_open_dates_with_changeover_buffer
        grounds:
          - validations[priority=140]
          - validations[priority=150]
          - errors.ERR_CAPACITY_BLOCK_OVERLAP
          - errors.ERR_FAMILY_MONTHLY_HOURS_EXCEEDED
          - entities.CapacityBlock.fields.start_date
          - entities.CapacityBlock.fields.end_date
        distinguishing_aspect: |
          Different resource (a ProductFamily's production line, not a customer trade calendar)
          and the OPPOSITE interval semantics: HALF-OPEN day-granular windows [start_date,
          end_date) padded by CHANGEOVER_BUFFER_DAYS = 2, so unlike the promotion calendar
          adjacency is REJECTED and a one-day gap is still rejected — the first legal start is
          exactly end_date + 2 days. A second, orthogonal axis stacks on top: non-overlapping
          blocks can still be refused by the family's aggregate max_monthly_hours ceiling, and
          priority 140 is checked before priority 150.
        test_recipe:
          setup:
            - "One ProductFamily at 100 units/hour with max_monthly_hours = 800 and no capacity blocks yet."
          setup_api_calls:
            - call: "POST /sop/product-families"
