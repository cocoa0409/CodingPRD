scaffold_corner_design:

  # =====================================================================
  # Section 1: Entities
  # =====================================================================
  - section: entities
    instances:

      - name: create_community_with_all_required_fields_returns_201
        claim_type: creation
        grounds: [entities.Community, "endpoints[POST /hoa/communities]"]
        distinguishing_aspect: "POST /hoa/communities with only the required fields (name, fiscal_year_start_month, regular_assessment_cents) returns 201 and all defaults applied."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /hoa/communities"
              payload: { name: "TestHOA", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, default_grace: $.data.late_fee_grace_days, default_quorum: $.data.election_quorum_pct }
          assert:
            - "Response status == 201"
            - "Community.${c_id}.late_fee_grace_days == 15 (default)"
            - "Community.${c_id}.late_fee_flat_cents == 2500 (default)"
            - "Community.${c_id}.election_quorum_pct == 33 (default)"
            - "Community.${c_id}.reserve_inflation_bps == 300 (default)"
            - "Community.${c_id}.lien_threshold_cents == 250000 (default)"
            - "Community.${c_id}.version == 1"

      - name: get_community_by_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: [entities.Community, "errors[ERR_NOT_FOUND]", "endpoints[GET /hoa/communities/{id}]"]
        distinguishing_aspect: "GET /hoa/communities/{id} with a syntactically-valid but unknown UUID returns 404 / ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB (no Community created)"
          setup_api_calls: []
          trigger:
            - call: "GET /hoa/communities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "Response error_id == ERR_NOT_FOUND"

      - name: create_owner_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Owner, "errors[ERR_INVALID_REQUEST]", "endpoints[POST /hoa/owners]"]
        distinguishing_aspect: "POST /hoa/owners without `full_name` returns 400 / ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Community exists"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "ReqTest", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "noname@x.com" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "Response error_id == ERR_INVALID_REQUEST"

      - name: property_account_balance_recomputed_on_assessment_creation
        claim_type: computed_fields
        grounds: [entities.Property.fields.account_balance_cents, calculations.late_fee_accrual]
        distinguishing_aspect: "Property.account_balance_cents is a computed field that updates on every Assessment mutation. Creating an Assessment of principal=20000 against a clean Property sets balance to 20000 (no fees yet)."
        test_recipe:
          setup:
            - "Community + Owner + Property exist; balance starts at 0"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Comp1", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "cf@x.com", full_name: "CF" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "CF-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id, init_balance: $.data.account_balance_cents }
          trigger:
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 20000, due_date: "2027-01-01T00:00:00Z" }
              as: Treasurer
            - call: "GET /hoa/properties/${p_id}"
              payload: {}
              as: Treasurer
              captures: { final_balance: $.data.account_balance_cents }
          assert:
            - "Property.${p_id}.account_balance_cents initially == 0"
            - "Property.${p_id}.account_balance_cents after assessment == 20000 (computed-field reconciliation)"

      - name: payment_application_is_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.PaymentApplication]
        distinguishing_aspect: "PaymentApplication has common_fields: false (no version, no updated_at). The only state transition is APPLIED → REVERSED via POST /payments/{id}/reverse — there is no general UPDATE endpoint."
        test_recipe:
          setup:
            - "PaymentApplication exists in state APPLIED"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Immut", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "im@x.com", full_name: "IM" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "IM-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2027-06-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 5000, expected_assessment_version: "${a_v}" }
              as: Treasurer
              captures: { pa_id: $.data.id, pa_state: $.data.state }
          trigger:
            - call: "GET /hoa/payments/${pa_id}"
              payload: {}
              as: Treasurer
              captures: { fetched_state: $.data.state }
          assert:
            - "PaymentApplication.${pa_id}.state == APPLIED (state is system-managed; no PATCH/PUT endpoint in §1.5)"

  # =====================================================================
  # Section 2: State Machines
  # =====================================================================
  - section: state_machines
    instances:

      - name: assessment_initial_state_is_due
        claim_type: initial_state
        grounds: [state_machines.Assessment, state_machines.Assessment.initial_state]
        distinguishing_aspect: "A freshly created Assessment is in state DUE (per state_machines.Assessment.initial_state)."
        test_recipe:
          setup:
            - "Community + Owner + Property exist"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Init", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "in@x.com", full_name: "IN" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "IN-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2027-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, init_status: $.data.status }
          assert:
            - "Assessment.${a_id}.status == DUE (initial state)"

      - name: contest_violation_from_paid_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Violation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /violations/{id}/contest on a Violation already in PAID state is an undefined transition → ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Violation in PAID state (paid by HomeOwner)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "InvT", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "it@x.com", full_name: "IT" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "IT-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "PARKING" }
              as: BoardSecretary
              captures: { v_id: $.data.id }
            - call: "POST /hoa/violations/${v_id}/pay-fine"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /hoa/violations/${v_id}/contest"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_INVALID_STATE"

      - name: assessment_paid_is_terminal_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Assessment, state_machines.Assessment.terminal_states]
        distinguishing_aspect: "PAID is terminal per state_machines.Assessment.terminal_states. /assessments/{id}/waive from PAID → ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Assessment fully paid (status == PAID)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Term", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "tr@x.com", full_name: "TR" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "TR-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2027-06-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 10000, expected_assessment_version: "${a_v}" }
              as: Treasurer
          trigger:
            - call: "POST /hoa/assessments/${a_id}/waive"
              payload: {}
              as: BoardPresident
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_INVALID_STATE"

      - name: acc_revision_limit_three_then_fourth_request_revision_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ACCRequest.transitions.SUBMITTED_to_REVISION_REQUESTED, "errors[ERR_ACC_REVISION_LIMIT]", "validations[priority=8]"]
        distinguishing_aspect: "After 3 successful /request-revision → /resubmit cycles, ACCRequest.revision_count == 3. The 4th /request-revision is rejected with ERR_ACC_REVISION_LIMIT (precondition: revision_count < 3)."
        test_recipe:
          setup:
            - "ACCRequest exists in SUBMITTED state with revision_count == 3 (3 prior cycles completed)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "RevLim", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "rl@x.com", full_name: "RL" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "RL-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/acc-requests"
              payload: { property_id: "${p_id}", scope: "LANDSCAPING", description: "Garden" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /hoa/acc-requests/${acc_id}/request-revision"
              payload: {}
              as: ACCMember
            - call: "POST /hoa/acc-requests/${acc_id}/resubmit"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
            - call: "POST /hoa/acc-requests/${acc_id}/request-revision"
              payload: {}
              as: ACCMember
            - call: "POST /hoa/acc-requests/${acc_id}/resubmit"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
            - call: "POST /hoa/acc-requests/${acc_id}/request-revision"
              payload: {}
              as: ACCMember
            - call: "POST /hoa/acc-requests/${acc_id}/resubmit"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { rev_count_after_three: $.data.revision_count }
          trigger:
            - call: "POST /hoa/acc-requests/${acc_id}/request-revision"
              payload: {}
              as: ACCMember
              captures: { err: $.data.error_id }
          assert:
            - "ACCRequest.${acc_id}.revision_count == 3 after 3 cycles"
            - "Response status == 422"
            - "Response error_id == ERR_ACC_REVISION_LIMIT"

      - name: foreclosure_before_180_day_cooldown_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Lien.transitions.FILED_to_FORECLOSURE_INITIATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Initiating foreclosure before current_utc >= Lien.filed_at + 180 days → ERR_INVALID_STATE (the temporal cooldown precondition fails)."
        test_recipe:
          setup:
            - "Lien.status == FILED (filed_at = clock when delinquency cascade fired)"
            - "Clock is at filed_at + 90 days (still within cooldown)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "ForeC", fiscal_year_start_month: 1, regular_assessment_cents: 30000, lien_threshold_cents: 250000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "fc@x.com", full_name: "FC" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "FC-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "SPECIAL", principal_cents: 250000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /hoa/liens"
              payload: { property_id: "${p_id}" }
              as: BoardSecretary
              captures: { lien_id: "$.data[0].id" }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/liens/${lien_id}/initiate-foreclosure"
              payload: {}
              as: BoardPresident
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_INVALID_STATE (180-day cooldown precondition fails: only ~59 days elapsed since 2026-02-01)"

  # =====================================================================
  # Section 3: Calculations
  # =====================================================================
  - section: calculations
    instances:

      - name: late_fee_zero_when_within_grace_window
        claim_type: input_set_filtering
        grounds: [calculations.late_fee_accrual]
        distinguishing_aspect: "Within grace window (elapsed_days < grace), late_fee_cents == 0. Tests the input_set boundary at elapsed_days==grace (exactly at boundary)."
        test_recipe:
          setup:
            - "Assessment due_date=2026-01-01, principal=30000"
            - "Clock set to 2026-01-16 (exactly grace_days=15 later)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Grace", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "gr@x.com", full_name: "GR" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "GR-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 30000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /hoa/assessments/${a_id}"
              payload: {}
              as: Treasurer
              captures: { fee: $.data.late_fee_cents, status: $.data.status }
          assert:
            # current_utc (2026-01-16) > due_date+grace (2026-01-16)? No, equal not greater
            # → OVERDUE precondition not yet satisfied → status stays DUE, fee == 0
            - "Assessment.${a_id}.late_fee_cents == 0"
            - "Assessment.${a_id}.status == DUE (precondition current_utc > due_date+grace fails at exact equality)"

      - name: violation_tier_resets_after_365_day_window
        claim_type: input_set_filtering
        grounds: [calculations.violation_tier_assignment, entities.Violation.fields.opened_at]
        distinguishing_aspect: "violation_tier_assignment counts only prior Violations with opened_at >= current_utc - 365_days. A prior Violation 400 days ago is OUTSIDE the window → new violation is tier 1, not tier 2."
        test_recipe:
          setup:
            - "An old Violation exists opened_at=2025-01-01 (>= 365 days before clock)"
            - "Clock at 2026-03-01"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Window", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "win@x.com", full_name: "WIN" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "WIN-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "PARKING" }
              as: BoardSecretary
              captures: { v_old: $.data.id, old_tier: $.data.tier }
            - call: "POST /hoa/violations/${v_old}/pay-fine"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "PARKING" }
              as: BoardSecretary
              captures: { v_new: $.data.id, new_tier: $.data.tier, new_fine: $.data.fine_cents }
          assert:
            - "Violation.${v_new}.tier == 1 (window excludes opened_at < 2025-03-01)"
            - "Violation.${v_new}.fine_cents == 10000 (tier-1 fine)"

      - name: violation_tier_three_fine_50000
        claim_type: correct_result
        grounds: [calculations.violation_tier_assignment]
        distinguishing_aspect: "Three open Violations of same category in window → 4th is tier 4. Tests fine schedule at tier 3 (50000) and tier 4 (100000) boundary."
        test_recipe:
          setup:
            - "Three open Violations of category=NOISE already issued, all within the past 30 days"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Tiers", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "ti@x.com", full_name: "TI" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "TI-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "NOISE" }
              as: BoardSecretary
              captures: { v1: $.data.id, t1: $.data.tier, f1: $.data.fine_cents }
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "NOISE" }
              as: BoardSecretary
              captures: { v2: $.data.id, t2: $.data.tier, f2: $.data.fine_cents }
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "NOISE" }
              as: BoardSecretary
              captures: { v3: $.data.id, t3: $.data.tier, f3: $.data.fine_cents }
          trigger:
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "NOISE" }
              as: BoardSecretary
              captures: { v4: $.data.id, t4: $.data.tier, f4: $.data.fine_cents }
          assert:
            - "Violation.${v1}.tier == 1 and fine_cents == 10000"
            - "Violation.${v2}.tier == 2 and fine_cents == 25000"
            - "Violation.${v3}.tier == 3 and fine_cents == 50000"
            - "Violation.${v4}.tier == 4 and fine_cents == 100000 (cap)"

      - name: reserve_adequacy_zero_obligation_returns_full_percent
        claim_type: correct_result
        grounds: [calculations.reserve_adequacy_ratio]
        distinguishing_aspect: "When projected_obligation_cents == 0 (no ReserveComponents), percent_funded_bps defaults to 10000 (100%) by convention. Edge case: divide-by-zero guard."
        test_recipe:
          setup:
            - "Community exists with NO ReserveComponents"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "ZeroObl", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /hoa/reserve-studies"
              payload: { community_id: "${c_id}", fiscal_year: 2026, method: "COMPONENT", accumulated_funds_cents: 5000000 }
              as: BoardPresident
              captures: { rs_id: $.data.id, pct: $.data.percent_funded_bps, obl: $.data.projected_obligation_cents }
          assert:
            - "ReserveStudy.${rs_id}.projected_obligation_cents == 0"
            - "ReserveStudy.${rs_id}.percent_funded_bps == 10000 (convention for zero obligation)"

  # =====================================================================
  # Section 4: Validations
  # =====================================================================
  - section: validations
    instances:

      - name: overpayment_against_active_assessment_returns_overpayment_error
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "Payment amount_cents=15000 against Assessment with principal=10000 (no fees) and paid=0 in state DUE → ERR_OVERPAYMENT (state precondition passes; fiscal cap fires)."
        test_recipe:
          setup:
            - "Assessment in DUE state, principal=10000, paid=0"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "OvPay", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "op@x.com", full_name: "OP" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "OP-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2027-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, a_v: $.data.version }
          trigger:
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 15000, expected_assessment_version: "${a_v}" }
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_OVERPAYMENT"

      - name: duplicate_owner_email_in_same_community_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_DUPLICATE_OWNER_EMAIL]"]
        distinguishing_aspect: "Two Owners with same (community_id, email) → 2nd creation fails with ERR_DUPLICATE_OWNER_EMAIL."
        test_recipe:
          setup:
            - "Owner A exists with email same@x.com under Community C"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "DupEmail", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "same@x.com", full_name: "A" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "same@x.com", full_name: "B" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_DUPLICATE_OWNER_EMAIL"

      - name: duplicate_unit_label_in_community_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_UNIT_LABEL]"]
        distinguishing_aspect: "Two Properties with same unit_label under same Community → 2nd creation fails with ERR_DUPLICATE_UNIT_LABEL."
        test_recipe:
          setup:
            - "Property X exists with unit_label=U-Dup under Community C"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "DupUnit", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "du@x.com", full_name: "DU" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "U-Dup" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "U-Dup" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_DUPLICATE_UNIT_LABEL"

      - name: duplicate_vote_cast_blocked
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_VOTE]"]
        distinguishing_aspect: "One CAST Vote already exists for (election, owner) → second POST /votes for the same pair → ERR_DUPLICATE_VOTE (409)."
        test_recipe:
          setup:
            - "Election OPEN; Owner cast vote (CAST state)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "DupVote", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "dv@x.com", full_name: "DV" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "DV-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "DV-FY", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v}" }
              as: BoardSecretary
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_id}", candidate_name: "Alice" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_id}", candidate_name: "Bob" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_DUPLICATE_VOTE"

      - name: retracted_vote_does_not_block_new_vote
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=12]", state_machines.Violation, "endpoints[POST /hoa/votes/{id}/retract]"]
        distinguishing_aspect: "After retracting a vote (state==RETRACTED), the same Owner may cast a NEW vote — RETRACTED doesn't satisfy the 'CAST vote already exists' uniqueness clause. Inverse of duplicate_vote_cast_blocked."
        test_recipe:
          setup:
            - "Owner cast then retracted a vote in OPEN election"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Retract", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "re@x.com", full_name: "RE" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "RE-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "RE-FY", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v}" }
              as: BoardSecretary
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_id}", candidate_name: "Alice" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /hoa/votes/${v1_id}/retract"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_id}", candidate_name: "Bob" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { v2_id: $.data.id, v2_state: $.data.state }
          assert:
            - "Response status == 201 (new vote allowed after retraction)"
            - "Vote.${v2_id}.state == CAST"

  # =====================================================================
  # Section 5: Endpoints
  # =====================================================================
  - section: endpoints
    instances:

      - name: list_assessments_filtered_by_status_overdue
        claim_type: action_endpoint
        grounds: ["endpoints[GET /hoa/assessments]", state_machines.Assessment]
        distinguishing_aspect: "GET /hoa/assessments?status=OVERDUE returns only Assessments whose status == OVERDUE."
        test_recipe:
          setup:
            - "Two Assessments: one in DUE (future due_date), one OVERDUE (due_date in past, clock past grace)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Filter", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "fl@x.com", full_name: "FL" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "FL-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_overdue: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2027-06-01T00:00:00Z" }
              as: Treasurer
              captures: { a_due: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /hoa/assessments"
              payload: { property_id: "${p_id}", status: "OVERDUE" }
              as: Treasurer
              captures: { total: "$.data[0].id" }
          assert:
            - "Response status == 200"
            - "Response data array contains Assessment.${a_overdue}"
            - "Response data array does NOT contain Assessment.${a_due}"

      - name: projected_balance_endpoint_does_not_mutate_assessment
        claim_type: computed_read
        grounds: ["endpoints[GET /hoa/assessments/{id}/projected-balance]", calculations.late_fee_accrual.variants.forward_looking_projection]
        distinguishing_aspect: "GET /hoa/assessments/{id}/projected-balance returns projected_late_fee_cents AND does NOT advance Assessment.version or set Assessment.late_fee_cents."
        test_recipe:
          setup:
            - "Assessment with principal=30000 due_date=2026-01-01; clock at 2026-01-10 (within grace, no actual fee)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "ProjOnly", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "po@x.com", full_name: "PO" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "PO-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 30000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, v_before: $.data.version }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /hoa/assessments/${a_id}/projected-balance"
              payload: { as_of_iso8601: "2026-02-01T00:00:00Z" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { proj_fee: $.data.projected_late_fee_cents }
            - call: "GET /hoa/assessments/${a_id}"
              payload: {}
              as: Treasurer
              captures: { v_after: $.data.version, real_fee: $.data.late_fee_cents }
          assert:
            # forward_looking at as_of=2026-02-01: ceil(31/15)=3 cycles, per cycle 2500+3000=5500, total=16500
            - "Response projected_late_fee_cents == 16500"
            - "Assessment.${a_id}.late_fee_cents == 0 (NOT mutated by projection)"
            - "Assessment.${a_id}.version unchanged after projection (GET does not increment version)"

  # =====================================================================
  # Section 6: Errors — most error_ids already triggered above or in §1.8.
  # Add only the ones not yet covered.
  # =====================================================================
  - section: errors
    instances:

      - name: error_unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "Request without X-User-Role header → 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /hoa/communities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 401"
            - "Response error_id == ERR_UNAUTHENTICATED"

      - name: error_unauthorized_unknown_role
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHORIZED]", "validations[priority=2]"]
        distinguishing_aspect: "X-User-Role set to a value not in §1.7 (e.g., 'Hacker') → 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Community exists"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Unauth", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /hoa/communities/${c_id}"
              payload: {}
              as: Hacker
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 403"
            - "Response error_id == ERR_UNAUTHORIZED"

      - name: error_segregation_of_duties_president_certifies_after_opening
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=19]"]
        distinguishing_aspect: "BoardPresident who certifies has same X-User-ID as the BoardSecretary who issued OPEN → ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup:
            - "Election DRAFT exists; BoardSecretary opens with X-User-ID='same-officer-id'"
            - "After close (quorum met), the SAME 'same-officer-id' tries to certify under BoardPresident role"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "SegDut", fiscal_year_start_month: 1, regular_assessment_cents: 30000, election_quorum_pct: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "sd@x.com", full_name: "SD" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "SD-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "SD-FY", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "same-officer-id"
              captures: { e_id: $.data.id }
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v}" }
              as: BoardSecretary
              as_user_id: "same-officer-id"
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_id}", candidate_name: "Alice" }
              as: HomeOwner
              as_user_id: "${o_id}"
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections/${e_id}/close"
              payload: {}
              as: BoardSecretary
              as_user_id: "same-officer-id"
          trigger:
            - call: "POST /hoa/elections/${e_id}/certify"
              payload: {}
              as: BoardPresident
              as_user_id: "same-officer-id"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 403"
            - "Response error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: error_election_not_open_vote_before_window
        claim_type: violation_to_error
        grounds: ["errors[ERR_ELECTION_NOT_OPEN]", "validations[priority=10]"]
        distinguishing_aspect: "Vote cast while election still in DRAFT (status != OPEN) → ERR_ELECTION_NOT_OPEN."
        test_recipe:
          setup:
            - "Election DRAFT (not yet OPEN); Owner with Property in community"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "EarlyVote", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "ev@x.com", full_name: "EV" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "EV-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "EV-FY", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_id}", candidate_name: "Alice" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_ELECTION_NOT_OPEN"

