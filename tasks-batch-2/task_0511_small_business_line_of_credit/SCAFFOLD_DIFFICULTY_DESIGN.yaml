      - name: statement_window_closed_containment_overlap_rejected
        grounds:
          - validations[priority=15]
          - errors[ERR_STATEMENT_OVERLAP]
          - entities.Statement.fields.period_start
          - entities.Statement.fields.period_end
        distinguishing_aspect: |
          Resource = Statement window on the SAME line but a DIFFERENT interval-bearing entity
          and DIFFERENT geometry: closed-CONTAINMENT overlap on [period_start, period_end). A
          new window [2026-05-15, 2026-06-15) overlaps an existing [2026-05-01, 2026-06-01)
          and is rejected; an adjacent window starting exactly at the prior period_end would be
          allowed.
        test_recipe:
          setup:
