# =============================================================================
# PRD Benchmark Scaffold — Tourism Improvement District Administration
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================

scenario: |
  2888. Tourism Improvement District Administration (destination tourism improvement district):
  district formation with lodging business petition thresholds, boundary definition and assessment
  methodology, assessment collection through lodging operators with remittance schedules and
  delinquency enforcement, annual budget and work plan approval by the district board with permitted
  expenditure categories, sales and marketing program execution with performance measurement on room
  nights generated, transparency requirements including public meetings, annual reports and financial
  audits, renewal petition process before district expiration with business support thresholds,
  disputes over assessment calculation and exempt properties, coordination with the destination
  marketing organization and public lodging tax programs

domain_name: "tourism-improvement-district-administration"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Three junction entities carry the many-to-many load: PetitionSignature joins
  # PetitionDrive x LodgingBusiness, AssessmentStatement joins AssessmentPeriod x
  # LodgingBusiness, RoomNightClaim joins MarketingProgram x LodgingBusiness. No
  # entity is reachable only through a single ownership chain.

  state_machine_shape: parallel
  # AssessmentStatement carries two independent state dimensions on one row
  # (filing_status and payment_status) that advance without touching each other.
  # District, AnnualWorkPlan and AssessmentDispute additionally carry cycles;
  # PetitionDrive branches at tally into QUALIFIED or SHORT_OF_THRESHOLD.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # AnnualWorkPlan approval requires an approving BoardMember X-User-ID distinct
  # from the sponsoring BoardMember X-User-ID; statement certification requires an
  # IndependentAuditor X-User-ID distinct from audited_by_user_id; a FINANCIAL_AUDIT
  # TransparencyRecord must be advanced to COMPLETED and PUBLISHED by a
  # DistrictAdministrator X-User-ID distinct from the engaged_by_user_id recorded
  # when the engagement was created.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: District
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the tourism improvement district
        constraints: non-blank, 1..120 characters
      - name: assessment_method
        type: enum
        source: input
        description: methodology selector that decides which branch of the assessment_amount formula runs
        default: PCT_OF_ROOM_REVENUE
        constraints: one of {PCT_OF_ROOM_REVENUE, PER_OCCUPIED_ROOM_NIGHT, TIERED_BY_CLASSIFICATION}
      - name: included_zones
        type: array
        source: input
        description: boundary definition as the set of zone codes inside the district
        default: ["ZONE_CORE", "ZONE_PERIMETER"]
        constraints: non-empty subset of {ZONE_CORE, ZONE_PERIMETER}; duplicates rejected
      - name: status
        type: enum
        source: system
        description: district lifecycle state
        default: PROPOSED
        constraints: one of {PROPOSED, PETITION_CIRCULATING, FORMATION_FAILED, FORMED, ACTIVE, RENEWAL_PENDING, EXPIRED, DISESTABLISHED}
      - name: formation_threshold_pct
        type: number
        source: input
        description: minimum revenue-weighted support a FORMATION drive must reach to qualify
        default: 0.6000
        constraints: 4 decimal places, 0.0001..1.0000
      - name: renewal_threshold_pct
        type: number
        source: input
        description: minimum revenue-weighted support a RENEWAL drive must reach to qualify
        default: 0.6500
        constraints: 4 decimal places, 0.0001..1.0000
      - name: renewal_headcount_threshold_pct
        type: number
        source: input
        description: minimum headcount support a RENEWAL drive must reach in addition to the revenue-weighted test
        default: 0.5000
        constraints: 4 decimal places, 0.0001..1.0000
      - name: term_years
        type: integer
        source: input
        description: number of years each formation or renewal certification adds to expiration_date
        default: 5
        constraints: 1..10
      - name: formed_on
        type: datetime
        source: system
        description: logical-clock instant at which a FORMATION drive was certified; null before formation
        default: null
      - name: expiration_date
        type: datetime
        source: system
        description: instant at which the district term ends; set to formed_on + term_years at certification and extended by term_years on each renewal certification
        default: null
      - name: current_fiscal_year
        type: integer
        source: input
        description: fiscal year the district is presently budgeting for
        default: 2027
        constraints: 2020..2050
      - name: transparency_standing
        type: enum
        source: computed
        description: COMPLIANT while no ANNUAL_REPORT or FINANCIAL_AUDIT TransparencyRecord of this district is OVERDUE, otherwise DEFICIENT
        default: COMPLIANT
        constraints: one of {COMPLIANT, DEFICIENT}
      - name: dmo_name
        type: string
        source: system
        description: destination marketing organization named on the coordination agreement; null until a coordination call names one
        default: null
      - name: dmo_agreement_status
        type: enum
        source: system
        description: status of the destination marketing organization coordination agreement
        default: NONE
        constraints: one of {NONE, PROPOSED, EXECUTED, SUSPENDED, TERMINATED}
      - name: dmo_contract_cents
        type: integer
        source: system
        description: contracted destination marketing organization consideration in cents
        default: 0
        constraints: ">= 0"
      - name: public_lodging_tax_offset_cents
        type: integer
        source: system
        description: credit against district assessments granted by the city's public lodging tax program, in cents; set through POST /districts/{id}/dmo-coordination
        default: 0
        constraints: ">= 0"
      - name: lodging_tax_match_pool_cents
        type: integer
        source: system
        description: pool of public lodging tax dollars the city has made available to match district-funded marketing spend, in cents; set through POST /districts/{id}/dmo-coordination
        default: 0
        constraints: ">= 0"
      - name: lodging_tax_match_committed_cents
        type: integer
        source: computed
        description: sum of lodging_tax_matched_cents over the district's MarketingProgram rows whose status is not CANCELLED; may never exceed lodging_tax_match_pool_cents nor half of the approved work plan total
        default: 0
        constraints: ">= 0"
      - name: collected_to_date_cents
        type: integer
        source: computed
        description: conserved money quantity; equals the sum over every AssessmentStatement of this district of (interest_paid_cents + penalty_paid_cents + principal_paid_cents + credit_balance_cents)
        default: 0
      - name: delinquent_charges_cents
        type: integer
        source: computed
        description: sum over every AssessmentStatement of this district of (penalty_cents + interest_cents), accumulated from the per-statement rounded values
        default: 0
      - name: assessable_basis_cents
        type: integer
        source: computed
        description: sum of prior_year_gross_room_revenue_cents over LodgingBusiness rows of this district whose status == ASSESSABLE and exempt_status == NONE and boundary_zone is a member of included_zones
        default: 0
      - name: assessable_business_count
        type: integer
        source: computed
        description: count of the same LodgingBusiness set used by assessable_basis_cents
        default: 0

  - name: LodgingBusiness
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the district whose boundary and assessment methodology govern this property
      - name: legal_name
        type: string
        source: input
        description: registered operator name of the lodging property
        constraints: non-blank, 1..120 characters
      - name: boundary_zone
        type: enum
        source: input
        description: zone code the property sits in; OUTSIDE means it is not within any district zone
        constraints: one of {ZONE_CORE, ZONE_PERIMETER, OUTSIDE}
      - name: classification
        type: enum
        source: input
        description: lodging classification driving the class multiplier and the TIERED_BY_CLASSIFICATION flat fee
        constraints: one of {FULL_SERVICE, LIMITED_SERVICE, BOUTIQUE, SHORT_TERM_RENTAL}
      - name: room_count
        type: integer
        source: input
        description: rentable room count, used for the minimum-rooms exemption test and the room-night capacity ceiling
        constraints: ">= 1"
      - name: prior_year_gross_room_revenue_cents
        type: integer
        source: input
        description: prior-year gross room revenue in cents, used as the petition weighting basis
        constraints: ">= 0"
      - name: exempt_status
        type: enum
        source: input
        description: exemption ground asserted for the property
        default: NONE
        constraints: one of {NONE, GOVERNMENT_OWNED, UNDER_MINIMUM_ROOMS, NONPROFIT_RETREAT}
      - name: status
        type: enum
        source: system
        description: assessability state derived at creation and re-derived on every revision and boundary revision
        default: ASSESSABLE
        constraints: one of {ASSESSABLE, EXEMPT, OUTSIDE_BOUNDARY, CLOSED_OUT}
      - name: remittance_frequency
        type: enum
        source: input
        description: remittance schedule the operator is billed on
        default: MONTHLY
        constraints: one of {MONTHLY, QUARTERLY}
      - name: delinquency_strike_count
        type: integer
        source: computed
        description: number of AssessmentStatement rows of this property that a delinquency sweep has moved to payment_status DELINQUENT
        default: 0
      - name: compliance_standing
        type: enum
        source: computed
        description: GOOD while delinquency_strike_count == 0, WATCH at exactly 1, SUSPENDED at 2 or more
        default: GOOD
        constraints: one of {GOOD, WATCH, SUSPENDED}
      - name: operator_contact_email
        type: string
        source: input
        description: notice address for assessment statements and delinquency notices
        constraints: non-blank, must contain "@"

  - name: PetitionDrive
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the district this petition circulates for
      - name: drive_type
        type: enum
        source: input
        description: FORMATION drives create the district term, RENEWAL drives extend it
        constraints: one of {FORMATION, RENEWAL}
      - name: status
        type: enum
        source: system
        description: drive lifecycle state
        default: OPEN
        constraints: one of {OPEN, QUALIFIED, SHORT_OF_THRESHOLD, CERTIFIED, WITHDRAWN}
      - name: opened_on
        type: datetime
        source: system
        description: logical-clock instant at which the drive was opened
      - name: closes_at
        type: datetime
        source: input
        description: instant after which no further signature may be recorded; signatures are accepted while clock < closes_at
      - name: required_weighted_pct
        type: number
        source: system
        description: revenue-weighted threshold snapshotted from District.formation_threshold_pct for FORMATION drives and District.renewal_threshold_pct for RENEWAL drives at open time
      - name: required_headcount_pct
        type: number
        source: system
        description: headcount threshold; 0.0000 for FORMATION drives, District.renewal_headcount_threshold_pct for RENEWAL drives, snapshotted at open time
      - name: signed_basis_cents
        type: integer
        source: computed
        description: conserved petition-weight quantity; equals the sum of weight_basis_revenue_cents over PetitionSignature rows of this drive whose status == VALID
        default: 0
      - name: valid_signature_count
        type: integer
        source: computed
        description: count of PetitionSignature rows of this drive whose status == VALID
        default: 0
      - name: assessable_basis_snapshot_cents
        type: integer
        source: computed
        description: District.assessable_basis_cents as recomputed on every signature record, signature withdrawal, signature disqualification and boundary revision affecting this drive
        default: 0
      - name: assessable_count_snapshot
        type: integer
        source: computed
        description: District.assessable_business_count as recomputed on the same events as assessable_basis_snapshot_cents
        default: 0
      - name: weighted_support_pct
        type: number
        source: computed
        description: revenue-weighted support variant of petition_support; 0.0000 when assessable_basis_snapshot_cents == 0
        default: 0.0000
      - name: headcount_support_pct
        type: number
        source: computed
        description: headcount support variant of petition_support; 0.0000 when assessable_count_snapshot == 0
        default: 0.0000
      - name: short_reason
        type: enum
        source: system
        description: which threshold test failed at tally time
        default: NONE
        constraints: one of {NONE, WEIGHTED_BELOW_THRESHOLD, HEADCOUNT_BELOW_MINIMUM}
      - name: tallied_at
        type: datetime
        source: system
        description: logical-clock instant at which the tally was run; null while OPEN
        default: null

  - name: PetitionSignature
    parent: null
    common_fields: true
    fields:
      - name: petition_drive_id
        type: string
        source: input
        description: FK -> PetitionDrive.id; the drive this signature counts toward
      - name: lodging_business_id
        type: string
        source: input
        description: FK -> LodgingBusiness.id; the signing property, which must be the acting LodgingOperator
      - name: signed_at
        type: datetime
        source: system
        description: logical-clock instant at which the signature was recorded
      - name: weight_basis_revenue_cents
        type: integer
        source: computed
        description: snapshot of LodgingBusiness.prior_year_gross_room_revenue_cents taken at signing; never re-read afterwards
      - name: status
        type: enum
        source: system
        description: signature validity state
        default: VALID
        constraints: one of {VALID, WITHDRAWN, DISQUALIFIED}
      - name: disqualification_reason
        type: enum
        source: system
        description: cascade cause that moved this signature to DISQUALIFIED
        default: NONE
        constraints: one of {NONE, COMPLIANCE_SUSPENDED, OUTSIDE_BOUNDARY, BUSINESS_EXEMPT}

  - name: AssessmentPeriod
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the district this remittance period belongs to
      - name: period_label
        type: string
        source: input
        description: human label such as "2026-09"
        constraints: non-blank, 1..32 characters
      - name: period_start
        type: datetime
        source: input
        description: inclusive start instant of the half-open occupancy window
      - name: period_end
        type: datetime
        source: input
        description: exclusive end instant of the half-open occupancy window; must be strictly after period_start
      - name: due_date
        type: datetime
        source: input
        description: instant by which remittance is due; must be at or after period_end
      - name: grace_days
        type: integer
        source: input
        description: whole days added to due_date before a statement can be swept as delinquent
        default: 10
        constraints: 0..60
      - name: status
        type: enum
        source: system
        description: period lifecycle state
        default: OPEN
        constraints: one of {OPEN, CLOSED, DELINQUENCY_SWEPT}
      - name: statement_count
        type: integer
        source: computed
        description: count of AssessmentStatement rows generated for this period
        default: 0
      - name: billed_total_cents
        type: integer
        source: computed
        description: sum of effective_assessment_cents over every AssessmentStatement of this period
        default: 0
      - name: collected_total_cents
        type: integer
        source: computed
        description: sum of principal_paid_cents over every AssessmentStatement of this period
        default: 0

  - name: AssessmentStatement
    parent: null
    common_fields: true
    fields:
      - name: assessment_period_id
        type: string
        source: input
        description: FK -> AssessmentPeriod.id; the period being billed
      - name: lodging_business_id
        type: string
        source: input
        description: FK -> LodgingBusiness.id; the assessed property, which must be the acting LodgingOperator on filing and remittance calls
      - name: zone_at_period_start
        type: enum
        source: system
        description: snapshot of LodgingBusiness.boundary_zone taken at statement generation; the FINAL variant basis
        constraints: one of {ZONE_CORE, ZONE_PERIMETER, OUTSIDE}
      - name: classification_at_period_start
        type: enum
        source: system
        description: snapshot of LodgingBusiness.classification taken at statement generation; the FINAL variant basis
        constraints: one of {FULL_SERVICE, LIMITED_SERVICE, BOUTIQUE, SHORT_TERM_RENTAL}
      - name: assessment_method_at_period_start
        type: enum
        source: system
        description: snapshot of District.assessment_method taken at statement generation; pins which formula branch both variants use
        constraints: one of {PCT_OF_ROOM_REVENUE, PER_OCCUPIED_ROOM_NIGHT, TIERED_BY_CLASSIFICATION}
      - name: reported_room_nights
        type: integer
        source: input
        description: occupied room nights the operator self-reports for the period
        default: null
        constraints: ">= 0 when supplied"
      - name: reported_gross_room_revenue_cents
        type: integer
        source: input
        description: gross room revenue in cents the operator self-reports for the period
        default: null
        constraints: ">= 0 when supplied"
      - name: audited_room_nights
        type: integer
        source: system
        description: occupied room nights substituted by the IndependentAuditor at audit; null until audited
        default: null
      - name: audited_gross_room_revenue_cents
        type: integer
        source: system
        description: gross room revenue in cents substituted by the IndependentAuditor at audit; null until audited
        default: null
      - name: provisional_assessment_cents
        type: integer
        source: computed
        description: PROVISIONAL variant output of assessment_amount, recomputed on every filing and amendment
        default: 0
      - name: final_assessment_cents
        type: integer
        source: computed
        description: FINAL variant output of assessment_amount; null until the statement reaches filing_status AUDITED, recomputed on dispute resolution
        default: null
      - name: effective_assessment_cents
        type: integer
        source: computed
        description: final_assessment_cents when it is not null, otherwise max(provisional_assessment_cents - granted_adjustment_cents, 0)
        default: 0
      - name: granted_adjustment_cents
        type: integer
        source: computed
        description: cumulative adjustment granted by RESOLVED_ADJUSTED AssessmentDispute rows on this statement
        default: 0
      - name: filing_status
        type: enum
        source: system
        description: first independent state dimension, advanced only by filing, amendment and audit calls
        default: NOT_FILED
        constraints: one of {NOT_FILED, FILED, AMENDED, AUDITED, CERTIFIED}
      - name: payment_status
        type: enum
        source: system
        description: second independent state dimension, advanced only by remittance, reversal and delinquency-sweep events
        default: UNPAID
        constraints: one of {UNPAID, PARTIALLY_PAID, PAID_IN_FULL, DELINQUENT, REFUND_DUE}
      - name: delinquency_stage
        type: enum
        source: system
        description: enforcement escalation reached by the delinquency sweep on this statement
        default: NONE
        constraints: one of {NONE, NOTICE, LIEN_REFERRED}
      - name: penalty_cents
        type: integer
        source: computed
        description: one-time delinquency penalty assessed by the sweep, rounded per statement
        default: 0
      - name: interest_cents
        type: integer
        source: computed
        description: delinquency interest assessed by the sweep, rounded per statement
        default: 0
      - name: principal_paid_cents
        type: integer
        source: computed
        description: portion of applied remittances allocated to the assessment principal bucket
        default: 0
      - name: penalty_paid_cents
        type: integer
        source: computed
        description: portion of applied remittances allocated to the penalty bucket
        default: 0
      - name: interest_paid_cents
        type: integer
        source: computed
        description: portion of applied remittances allocated to the interest bucket
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: overpayment remainder after the interest/penalty/principal waterfall is exhausted
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: max(effective_assessment_cents + penalty_cents + interest_cents - principal_paid_cents - penalty_paid_cents - interest_paid_cents, 0)
        default: 0
      - name: amendment_count
        type: integer
        source: computed
        description: number of accepted amendment filings on this statement
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent accepted filing or amendment; null while NOT_FILED
        default: null
      - name: audited_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the IndependentAuditor who ran the audit; null until audited
        default: null

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - name: assessment_statement_id
        type: string
        source: input
        description: FK -> AssessmentStatement.id; the statement this payment is applied against
      - name: amount_cents
        type: integer
        source: input
        description: payment amount in cents
        constraints: ">= 1"
      - name: received_on
        type: datetime
        source: input
        description: instant the payment was received; must be at or before the logical clock
      - name: method
        type: enum
        source: input
        description: remittance instrument
        constraints: one of {ACH, CHECK, WIRE, CARD}
      - name: applied_to_interest_cents
        type: integer
        source: computed
        description: first waterfall bucket allocation for this payment
        default: 0
      - name: applied_to_penalty_cents
        type: integer
        source: computed
        description: second waterfall bucket allocation for this payment
        default: 0
      - name: applied_to_principal_cents
        type: integer
        source: computed
        description: third waterfall bucket allocation for this payment
        default: 0
      - name: applied_to_credit_cents
        type: integer
        source: computed
        description: overflow allocation for this payment after all three buckets are satisfied
        default: 0
      - name: status
        type: enum
        source: system
        description: APPLIED while the allocation stands, REVERSED once unwound
        default: APPLIED
        constraints: one of {APPLIED, REVERSED}
      - name: reversed_on
        type: datetime
        source: system
        description: logical-clock instant of reversal; null while APPLIED
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: administrator-supplied reversal justification; null while APPLIED
        default: null

  - name: AnnualWorkPlan
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the district whose board approves this plan
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the budget and work plan cover
        constraints: 2020..2050; unique per district across plans whose status is not CLOSED
      - name: status
        type: enum
        source: system
        description: board approval state, with a RETURN cycle back to DRAFT and an amendment cycle back to APPROVED
        default: DRAFT
        constraints: one of {DRAFT, BOARD_REVIEW, APPROVED, AMENDMENT_PENDING, CLOSED}
      - name: expenditure_lines
        type: array
        source: input
        description: budget lines, each an object with keys category, amount_cents and narrative; category must be one of {SALES_AND_MARKETING, DESTINATION_EVENTS, ADMINISTRATION, CONTINGENCY_RESERVE, CAPITAL_IMPROVEMENT} and amount_cents >= 1
        constraints: non-empty array; at most one line per category
      - name: total_budget_cents
        type: integer
        source: computed
        description: sum of expenditure_lines[].amount_cents
        default: 0
      - name: administration_cents
        type: integer
        source: computed
        description: amount_cents of the ADMINISTRATION line, 0 when absent
        default: 0
      - name: contingency_reserve_cents
        type: integer
        source: computed
        description: amount_cents of the CONTINGENCY_RESERVE line, 0 when absent
        default: 0
      - name: sales_and_marketing_cents
        type: integer
        source: computed
        description: amount_cents of the SALES_AND_MARKETING line, 0 when absent
        default: 0
      - name: destination_events_cents
        type: integer
        source: computed
        description: amount_cents of the DESTINATION_EVENTS line, 0 when absent
        default: 0
      - name: capital_improvement_cents
        type: integer
        source: computed
        description: amount_cents of the CAPITAL_IMPROVEMENT line, 0 when absent
        default: 0
      - name: assessment_revenue_forecast_cents
        type: integer
        source: computed
        description: sum of effective_assessment_cents over AssessmentStatement rows of this district whose filing_status is in {FILED, AMENDED, AUDITED, CERTIFIED}, recomputed on approval and on every statement amount change
        default: 0
      - name: funding_ratio
        type: number
        source: computed
        description: round_half_up(assessment_revenue_forecast_cents / total_budget_cents, 4); 0.0000 when total_budget_cents == 0
        default: 0.0000
      - name: sponsor_user_id
        type: string
        source: system
        description: opaque X-User-ID of the BoardMember who sponsored the plan into BOARD_REVIEW; null while DRAFT
        default: null
      - name: approver_user_id
        type: string
        source: system
        description: opaque X-User-ID of the BoardMember who approved the plan; null until first approval
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent approval; null until first approval
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: number of accepted amendment submissions on this plan
        default: 0
      - name: committed_program_cents
        type: integer
        source: computed
        description: sum of committed_cents over MarketingProgram rows of this plan whose status is not CANCELLED
        default: 0

  - name: MarketingProgram
    parent: null
    common_fields: true
    fields:
      - name: annual_work_plan_id
        type: string
        source: input
        description: FK -> AnnualWorkPlan.id; the approved plan funding this program
      - name: name
        type: string
        source: input
        description: program name
        constraints: non-blank, 1..120 characters
      - name: channel
        type: enum
        source: input
        description: sales and marketing channel
        constraints: one of {PAID_SEARCH, TRADE_SHOW, GROUP_SALES, OTA_CAMPAIGN, INFLUENCER}
      - name: committed_cents
        type: integer
        source: input
        description: gross program commitment in cents; the numerator of the gross cost-per-room-night pass
        constraints: ">= 1"
      - name: lodging_tax_matched_cents
        type: integer
        source: input
        description: portion of committed_cents matched from the public lodging tax pool
        default: 0
        constraints: ">= 0"
      - name: booking_window_start
        type: datetime
        source: input
        description: inclusive start of the stay window claims may be attributed to
      - name: booking_window_end
        type: datetime
        source: input
        description: exclusive end of the stay window claims may be attributed to; must be strictly after booking_window_start
      - name: status
        type: enum
        source: system
        description: execution state, with a suspension cycle driven by work plan amendment pressure
        default: PLANNED
        constraints: one of {PLANNED, RUNNING, SUSPENDED_PENDING_AMENDMENT, CLOSED, CANCELLED}
      - name: spend_frozen
        type: boolean
        source: system
        description: true while the funding work plan sits in AMENDMENT_PENDING and this program is RUNNING
        default: false
      - name: verified_room_nights
        type: integer
        source: computed
        description: sum of RoomNightClaim.verified_room_nights over claims of this program whose status == VERIFIED
        default: 0
      - name: gross_cost_per_room_night_cents
        type: integer
        source: computed
        description: pass-one figure round_half_up(committed_cents / verified_room_nights); null when verified_room_nights == 0
        default: null
      - name: efficiency_tier
        type: enum
        source: computed
        description: tier selected from gross_cost_per_room_night_cents in pass one and never recomputed from net figures
        default: null
        constraints: one of {TIER_EFFICIENT, TIER_STANDARD, TIER_MARGINAL, TIER_UNPRODUCTIVE} or null before closure
      - name: dmo_cost_share_cents
        type: integer
        source: computed
        description: round_half_up(committed_cents * dmo_cost_share_pct of efficiency_tier)
        default: 0
      - name: net_district_cost_cents
        type: integer
        source: computed
        description: committed_cents - dmo_cost_share_cents
        default: 0
      - name: net_cost_per_room_night_cents
        type: integer
        source: computed
        description: round_half_up(net_district_cost_cents / verified_room_nights); null when verified_room_nights == 0
        default: null
      - name: performance_index
        type: number
        source: computed
        description: round_half_up(BENCHMARK_CPRN_CENTS / net_cost_per_room_night_cents, 4); 0.0000 when verified_room_nights == 0
        default: 0.0000
      - name: performance_flag
        type: enum
        source: computed
        description: NOT_MEASURED before closure, then MEETS_BENCHMARK / BELOW_BENCHMARK / UNDERPERFORMING by performance_index band
        default: NOT_MEASURED
        constraints: one of {NOT_MEASURED, MEETS_BENCHMARK, BELOW_BENCHMARK, UNDERPERFORMING}
      - name: launched_at
        type: datetime
        source: system
        description: logical-clock instant of launch; null while PLANNED
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of closure; null until CLOSED
        default: null

  - name: RoomNightClaim
    parent: null
    common_fields: true
    fields:
      - name: marketing_program_id
        type: string
        source: input
        description: FK -> MarketingProgram.id; the program the room nights are attributed to
      - name: lodging_business_id
        type: string
        source: input
        description: FK -> LodgingBusiness.id; the claiming property, which must be the acting LodgingOperator
      - name: stay_start
        type: datetime
        source: input
        description: inclusive start of the half-open stay interval
      - name: stay_end
        type: datetime
        source: input
        description: exclusive end of the half-open stay interval; must be strictly after stay_start
      - name: room_nights
        type: integer
        source: input
        description: room nights claimed as generated by the program
        constraints: ">= 1"
      - name: attribution_method
        type: enum
        source: input
        description: attribution basis asserted by the operator
        default: DIRECT_PICKUP
        constraints: one of {DIRECT_PICKUP, LOOKBACK_WINDOW}
      - name: status
        type: enum
        source: system
        description: verification state
        default: SUBMITTED
        constraints: one of {SUBMITTED, VERIFIED, REJECTED}
      - name: verified_room_nights
        type: integer
        source: system
        description: room nights the IndependentAuditor allows, at most room_nights; null until verified
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: reason recorded when the auditor rejects the claim
        default: NONE
        constraints: one of {NONE, UNVERIFIABLE, DUPLICATE_STAY, OUTSIDE_ATTRIBUTION_WINDOW}
      - name: verified_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the IndependentAuditor who acted on the claim; null while SUBMITTED
        default: null

  - name: TransparencyRecord
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the district the transparency obligation belongs to
      - name: record_type
        type: enum
        source: input
        description: which statutory transparency artifact this row tracks
        constraints: one of {PUBLIC_MEETING, ANNUAL_REPORT, FINANCIAL_AUDIT}
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the artifact covers
        constraints: 2020..2050
      - name: scheduled_for
        type: datetime
        source: input
        description: instant the meeting is held or the artifact is targeted for; PUBLIC_MEETING separation is measured on this value
      - name: required_by
        type: datetime
        source: input
        description: statutory deadline; a clock advance past this instant while SCHEDULED or NOTICED moves the row to OVERDUE
      - name: status
        type: enum
        source: system
        description: transparency artifact state
        default: SCHEDULED
        constraints: one of {SCHEDULED, NOTICED, COMPLETED, PUBLISHED, OVERDUE}
      - name: noticed_on
        type: datetime
        source: system
        description: instant public notice was given; null before NOTICED
        default: null
      - name: completed_on
        type: datetime
        source: system
        description: instant the meeting was held or the artifact finished; null before COMPLETED
        default: null
      - name: published_on
        type: datetime
        source: system
        description: instant minutes, report or audit opinion were published; null before PUBLISHED
        default: null
      - name: document_reference
        type: string
        source: system
        description: published document handle supplied on the PUBLISHED advance; null before PUBLISHED
        default: null
      - name: engaged_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the actor who created the record; a FINANCIAL_AUDIT record may not be advanced by this same id

  - name: AssessmentDispute
    parent: null
    common_fields: true
    fields:
      - name: assessment_statement_id
        type: string
        source: input
        description: FK -> AssessmentStatement.id; the statement whose calculation or exemption is disputed
      - name: lodging_business_id
        type: string
        source: system
        description: FK -> LodgingBusiness.id; the disputing property, copied from the referenced statement's lodging_business_id at creation and never supplied by the client
      - name: dispute_note
        type: string
        source: input
        description: free-text narrative supplied by the filer; null when omitted
        default: null
      - name: dispute_type
        type: enum
        source: input
        description: ground of the dispute
        constraints: one of {CALCULATION_ERROR, EXEMPT_PROPERTY, BOUNDARY_MISCLASSIFICATION}
      - name: claimed_adjustment_cents
        type: integer
        source: input
        description: reduction in cents the operator asks for
        constraints: ">= 1"
      - name: granted_adjustment_cents
        type: integer
        source: system
        description: reduction in cents actually granted at resolution; 0 unless status == RESOLVED_ADJUSTED
        default: 0
      - name: status
        type: enum
        source: system
        description: dispute proceeding state, with an information-request cycle and a one-shot appeal cycle
        default: SUBMITTED
        constraints: one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, RESOLVED_ADJUSTED, RESOLVED_UPHELD, WITHDRAWN}
      - name: appeal_count
        type: integer
        source: computed
        description: number of appeals taken from RESOLVED_UPHELD; capped at MAX_APPEALS
        default: 0
      - name: resolved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the HearingOfficer who resolved the dispute; null before resolution
        default: null
      - name: resolution_note
        type: string
        source: system
        description: hearing officer note recorded at resolution; null before resolution
        default: null
      - name: filed_on
        type: datetime
        source: system
        description: logical-clock instant the dispute was filed

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: District
    initial_state: PROPOSED
    terminal_states: [FORMATION_FAILED, EXPIRED, DISESTABLISHED]
    transitions:
      - from: PROPOSED
        to: PETITION_CIRCULATING
        trigger: "POST /petition-drives with drive_type FORMATION"
        actor: DistrictAdministrator
        preconditions:
          - "District.status == PROPOSED"
          - "no PetitionDrive of this district has status == OPEN"
          - "District.assessable_business_count >= MIN_PETITION_POOL"
        side_effects:
          - "a PetitionDrive row is created with status OPEN, opened_on := logical clock, required_weighted_pct := District.formation_threshold_pct, required_headcount_pct := 0.0000"
          - "the new drive's assessable_basis_snapshot_cents := District.assessable_basis_cents and assessable_count_snapshot := District.assessable_business_count"
          - "District.status := PETITION_CIRCULATING"

      - from: PETITION_CIRCULATING
        to: FORMED
        trigger: "POST /petition-drives/{id}/certification for a FORMATION drive"
        actor: BoardMember
        preconditions:
          - "PetitionDrive.drive_type == FORMATION"
          - "PetitionDrive.status == QUALIFIED"
          - "District.status == PETITION_CIRCULATING"
        side_effects:
          - "PetitionDrive.status := CERTIFIED"
          - "District.status := FORMED; District.formed_on := logical clock; District.expiration_date := logical clock advanced by District.term_years years"

      - from: PETITION_CIRCULATING
        to: FORMATION_FAILED
        trigger: "POST /petition-drives/{id}/tally on a FORMATION drive whose weighted_support_pct < required_weighted_pct"
        actor: DistrictAdministrator
        preconditions:
          - "PetitionDrive.drive_type == FORMATION"
          - "PetitionDrive.status == OPEN"
          - "District.status == PETITION_CIRCULATING"
        side_effects:
          - "PetitionDrive.status := SHORT_OF_THRESHOLD; short_reason := WEIGHTED_BELOW_THRESHOLD; tallied_at := logical clock"
          - "District.status := FORMATION_FAILED"
        note: "branch sibling of the OPEN -> QUALIFIED tally outcome; the two branches carry different side-effect sets"

      - from: FORMED
        to: ACTIVE
        trigger: "POST /districts/{id}/lifecycle-advances with to_status ACTIVE"
        actor: DistrictAdministrator
        preconditions:
          - "District.status == FORMED"
          - "the district's FORMATION PetitionDrive has status == CERTIFIED"
          - "District.assessable_business_count >= MIN_PETITION_POOL, so a district whose assessable roll collapsed between certification and activation may not be activated"
        side_effects:
          - "District.status := ACTIVE"
          - "formed_on and expiration_date are NOT touched here; both were stamped when the FORMATION petition was certified"

      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /districts/{id}/lifecycle-advances with to_status RENEWAL_PENDING"
        actor: DistrictAdministrator
        preconditions:
          - "District.status == ACTIVE"
          - "logical clock >= District.expiration_date minus RENEWAL_WINDOW_DAYS days AND logical clock < District.expiration_date"
          - "District.transparency_standing == COMPLIANT"
          - "at least one TransparencyRecord of this district has record_type == ANNUAL_REPORT and status == PUBLISHED"
          - "at least one TransparencyRecord of this district has record_type == FINANCIAL_AUDIT and status == PUBLISHED"
        side_effects:
          - "District.status := RENEWAL_PENDING"
        note: "cross-entity guard on TransparencyRecord state; the District cannot enter renewal while any transparency artifact is OVERDUE"

      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /petition-drives/{id}/certification for a RENEWAL drive"
        actor: BoardMember
        preconditions:
          - "PetitionDrive.drive_type == RENEWAL"
          - "PetitionDrive.status == QUALIFIED"
          - "District.status == RENEWAL_PENDING"
        side_effects:
          - "PetitionDrive.status := CERTIFIED"
          - "District.expiration_date := District.expiration_date advanced by District.term_years years"
          - "District.status := ACTIVE"
        note: "closes the renewal cycle ACTIVE -> RENEWAL_PENDING -> ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /districts/{id}/lifecycle-advances with to_status EXPIRED"
        actor: DistrictAdministrator
        preconditions:
          - "District.status in {ACTIVE, RENEWAL_PENDING}"
          - "logical clock >= District.expiration_date"
        side_effects:
          - "District.status := EXPIRED"
          - "every AssessmentPeriod of this district with status == OPEN is left untouched; expiry does not close periods"

      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "POST /districts/{id}/lifecycle-advances with to_status EXPIRED"
        actor: DistrictAdministrator
        preconditions:
          - "District.status == RENEWAL_PENDING"
          - "logical clock >= District.expiration_date"
        side_effects:
          - "District.status := EXPIRED"
          - "every PetitionDrive of this district with status == OPEN moves to WITHDRAWN"

      - from: ACTIVE
        to: DISESTABLISHED
        trigger: "POST /districts/{id}/lifecycle-advances with to_status DISESTABLISHED"
        actor: BoardMember
        preconditions:
          - "District.status in {ACTIVE, RENEWAL_PENDING}"
          - "no AssessmentPeriod of this district has status == OPEN"
        side_effects:
          - "District.status := DISESTABLISHED"
          - "every PetitionDrive of this district with status == OPEN moves to WITHDRAWN"
          - "every MarketingProgram under an AnnualWorkPlan of this district whose status is in {PLANNED, RUNNING, SUSPENDED_PENDING_AMENDMENT} moves to CANCELLED and spend_frozen := false"

      - from: RENEWAL_PENDING
        to: DISESTABLISHED
        trigger: "POST /districts/{id}/lifecycle-advances with to_status DISESTABLISHED"
        actor: BoardMember
        preconditions:
          - "District.status == RENEWAL_PENDING"
          - "no AssessmentPeriod of this district has status == OPEN"
        side_effects:
          - "District.status := DISESTABLISHED"
          - "every PetitionDrive of this district with status == OPEN moves to WITHDRAWN"
          - "every MarketingProgram under an AnnualWorkPlan of this district whose status is in {PLANNED, RUNNING, SUSPENDED_PENDING_AMENDMENT} moves to CANCELLED"

  - entity: LodgingBusiness
    initial_state: ASSESSABLE
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: ASSESSABLE
        to: EXEMPT
        trigger: "POST /lodging-businesses (creation resolution), POST /lodging-businesses/{id}/revisions setting exempt_status != NONE or dropping room_count below MIN_ASSESSABLE_ROOMS, or POST /assessment-disputes/{id}/resolution with outcome ADJUSTED on a dispute whose dispute_type is EXEMPT_PROPERTY"
        actor: DistrictAdministrator
        preconditions:
          - "LodgingBusiness.status == ASSESSABLE"
          - "the resolved exempt_status != NONE, where room_count < MIN_ASSESSABLE_ROOMS (5) forces exempt_status := UNDER_MINIMUM_ROOMS and an EXEMPT_PROPERTY dispute resolution supplies exempt_status_granted"
        side_effects:
          - "LodgingBusiness.status := EXEMPT"
          - "District.assessable_basis_cents and District.assessable_business_count are recomputed"
          - "every PetitionSignature of this business with status == VALID on a PetitionDrive with status == OPEN moves to DISQUALIFIED with disqualification_reason := BUSINESS_EXEMPT; each affected drive's signed_basis_cents, valid_signature_count, weighted_support_pct and headcount_support_pct are recomputed"

      - from: EXEMPT
        to: ASSESSABLE
        trigger: "POST /lodging-businesses/{id}/revisions setting exempt_status NONE with room_count >= MIN_ASSESSABLE_ROOMS"
        actor: DistrictAdministrator
        preconditions:
          - "LodgingBusiness.status == EXEMPT"
          - "the resolved exempt_status == NONE"
          - "LodgingBusiness.room_count >= MIN_ASSESSABLE_ROOMS"
          - "LodgingBusiness.boundary_zone is a member of District.included_zones"
        side_effects:
          - "LodgingBusiness.status := ASSESSABLE"
          - "District.assessable_basis_cents and District.assessable_business_count are recomputed"
        note: "closes the exemption cycle ASSESSABLE -> EXEMPT -> ASSESSABLE"

      - from: ASSESSABLE
        to: OUTSIDE_BOUNDARY
        trigger: "POST /districts/{id}/boundary-revisions removing this property's zone, or POST /lodging-businesses/{id}/revisions setting boundary_zone OUTSIDE"
        actor: DistrictAdministrator
        preconditions:
          - "LodgingBusiness.status == ASSESSABLE"
          - "LodgingBusiness.boundary_zone is not a member of District.included_zones after the revision"
        side_effects:
          - "LodgingBusiness.status := OUTSIDE_BOUNDARY"
          - "District.assessable_basis_cents and District.assessable_business_count are recomputed"
          - "every PetitionSignature of this business with status == VALID on a PetitionDrive with status == OPEN moves to DISQUALIFIED with disqualification_reason := OUTSIDE_BOUNDARY; that signature change itself forces each affected drive to recompute signed_basis_cents, valid_signature_count and weighted_support_pct"

      - from: OUTSIDE_BOUNDARY
        to: ASSESSABLE
        trigger: "POST /districts/{id}/boundary-revisions re-adding the zone, or POST /lodging-businesses/{id}/revisions setting boundary_zone to an included zone"
        actor: DistrictAdministrator
        preconditions:
          - "LodgingBusiness.status == OUTSIDE_BOUNDARY"
          - "LodgingBusiness.boundary_zone is a member of District.included_zones after the revision"
          - "the resolved exempt_status == NONE and room_count >= MIN_ASSESSABLE_ROOMS"
        side_effects:
          - "LodgingBusiness.status := ASSESSABLE"
          - "District.assessable_basis_cents and District.assessable_business_count are recomputed"
          - "already DISQUALIFIED signatures are NOT restored"

      - from: ASSESSABLE
        to: CLOSED_OUT
        trigger: "POST /lodging-businesses/{id}/revisions with close_out true"
        actor: DistrictAdministrator
        preconditions:
          - "LodgingBusiness.status in {ASSESSABLE, EXEMPT, OUTSIDE_BOUNDARY}"
          - "no AssessmentStatement of this business has payment_status in {UNPAID, PARTIALLY_PAID, DELINQUENT} with total_due_cents > 0"
        side_effects:
          - "LodgingBusiness.status := CLOSED_OUT"
          - "District.assessable_basis_cents and District.assessable_business_count are recomputed"

  - entity: PetitionDrive
    initial_state: OPEN
    terminal_states: [SHORT_OF_THRESHOLD, CERTIFIED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: QUALIFIED
        trigger: "POST /petition-drives/{id}/tally"
        actor: DistrictAdministrator
        preconditions:
          - "PetitionDrive.status == OPEN"
          - "weighted_support_pct >= required_weighted_pct"
          - "headcount_support_pct >= required_headcount_pct"
        side_effects:
          - "PetitionDrive.status := QUALIFIED; short_reason := NONE; tallied_at := logical clock"
          - "weighted_support_pct and headcount_support_pct are recomputed from the current VALID signature set immediately before the threshold comparison"
        note: "forward branch of the tally fork; the divergent branch is OPEN -> SHORT_OF_THRESHOLD"

      - from: OPEN
        to: SHORT_OF_THRESHOLD
        trigger: "POST /petition-drives/{id}/tally"
        actor: DistrictAdministrator
        preconditions:
          - "PetitionDrive.status == OPEN"
          - "weighted_support_pct < required_weighted_pct OR headcount_support_pct < required_headcount_pct"
        side_effects:
          - "PetitionDrive.status := SHORT_OF_THRESHOLD; tallied_at := logical clock"
          - "short_reason := WEIGHTED_BELOW_THRESHOLD when weighted_support_pct < required_weighted_pct, otherwise HEADCOUNT_BELOW_MINIMUM; the weighted test is evaluated first"
          - "when drive_type == FORMATION the owning District moves PETITION_CIRCULATING -> FORMATION_FAILED; when drive_type == RENEWAL the District status is left unchanged at RENEWAL_PENDING"
        note: "reject branch of the tally fork; its side-effect set differs from the QUALIFIED branch by the District cascade and the short_reason stamp"

      - from: QUALIFIED
        to: CERTIFIED
        trigger: "POST /petition-drives/{id}/certification"
        actor: DistrictAdministrator
        preconditions:
          - "PetitionDrive.status == QUALIFIED"
          - "District.status == PETITION_CIRCULATING when drive_type == FORMATION, or District.status == RENEWAL_PENDING when drive_type == RENEWAL"
        side_effects:
          - "PetitionDrive.status := CERTIFIED"
          - "the owning District advances PETITION_CIRCULATING -> FORMED (FORMATION) or RENEWAL_PENDING -> ACTIVE (RENEWAL) with expiration_date extended by term_years"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /districts/{id}/lifecycle-advances with to_status DISESTABLISHED or EXPIRED"
        actor: system
        preconditions:
          - "PetitionDrive.status == OPEN"
          - "the owning District is entering DISESTABLISHED or EXPIRED"
        side_effects:
          - "PetitionDrive.status := WITHDRAWN"

  - entity: PetitionSignature
    initial_state: VALID
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: VALID
        to: WITHDRAWN
        trigger: "POST /petition-signatures/{id}/withdrawal"
        actor: LodgingOperator
        preconditions:
          - "PetitionSignature.status == VALID"
          - "when the acting X-User-Role is LodgingOperator its X-User-ID equals PetitionSignature.lodging_business_id; a DistrictAdministrator acting on the operator's behalf is exempt from this ownership test, which the priority-50 row scopes to LodgingOperator"
          - "the owning PetitionDrive.status == OPEN"
          - "logical clock < PetitionDrive.closes_at"
        side_effects:
          - "PetitionSignature.status := WITHDRAWN"
          - "PetitionDrive.signed_basis_cents := signed_basis_cents - PetitionSignature.weight_basis_revenue_cents; valid_signature_count := valid_signature_count - 1"
          - "PetitionDrive.weighted_support_pct and headcount_support_pct are recomputed, restoring the exact values they held immediately before this signature was recorded"

      - from: VALID
        to: DISQUALIFIED
        trigger: "delinquency sweep raising the signer to compliance_standing SUSPENDED, a boundary revision moving the signer OUTSIDE_BOUNDARY, or a revision moving the signer to EXEMPT"
        actor: system
        preconditions:
          - "PetitionSignature.status == VALID"
          - "the owning PetitionDrive.status == OPEN"
          - "the signing LodgingBusiness has just reached compliance_standing == SUSPENDED, status == OUTSIDE_BOUNDARY, or status == EXEMPT"
        side_effects:
          - "PetitionSignature.status := DISQUALIFIED; disqualification_reason := COMPLIANCE_SUSPENDED, OUTSIDE_BOUNDARY or BUSINESS_EXEMPT according to the cause"
          - "PetitionDrive.signed_basis_cents and valid_signature_count are reduced by this signature's contribution, and weighted_support_pct / headcount_support_pct are recomputed"

  - entity: AssessmentPeriod
    initial_state: OPEN
    terminal_states: [DELINQUENCY_SWEPT]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /assessment-periods/{id}/closure"
        actor: DistrictAdministrator
        preconditions:
          - "AssessmentPeriod.status == OPEN"
          - "logical clock >= AssessmentPeriod.period_end"
          - "AssessmentPeriod.statement_count >= 1"
        side_effects:
          - "AssessmentPeriod.status := CLOSED"
          - "AssessmentPeriod.billed_total_cents and collected_total_cents are recomputed from the period's statements"

      - from: CLOSED
        to: DELINQUENCY_SWEPT
        trigger: "POST /assessment-periods/{id}/delinquency-sweep"
        actor: DistrictAdministrator
        preconditions:
          - "AssessmentPeriod.status == CLOSED"
          - "logical clock > AssessmentPeriod.due_date advanced by AssessmentPeriod.grace_days days"
        side_effects:
          - "hop 1: every AssessmentStatement of this period whose payment_status is in {UNPAID, PARTIALLY_PAID} and whose total_due_cents > 0 moves payment_status := DELINQUENT, processed in created_at ASC order"
          - "hop 2: that DELINQUENT flip itself stamps the statement with delinquency_stage := NOTICE (or LIEN_REFERRED when outstanding_cents >= LIEN_REFERRAL_THRESHOLD_CENTS or the signer already stands SUSPENDED), sets penalty_cents and interest_cents from the delinquency_charges calculation, and adds those two per-statement rounded values into District.delinquent_charges_cents"
          - "hop 3: the delinquency stamp on the statement itself increments LodgingBusiness.delinquency_strike_count by 1 and re-derives LodgingBusiness.compliance_standing (0 -> GOOD, exactly 1 -> WATCH, >= 2 -> SUSPENDED)"
          - "hop 4: a business that has just reached compliance_standing == SUSPENDED as a result of hop 3 has every one of its VALID PetitionSignature rows on OPEN PetitionDrive rows moved to DISQUALIFIED with disqualification_reason := COMPLIANCE_SUSPENDED, and each affected drive recomputes signed_basis_cents, valid_signature_count and weighted_support_pct"
          - "AssessmentPeriod.status := DELINQUENCY_SWEPT"
        note: "four-hop transitive cascade: each hop is caused by the mutation the previous hop wrote, not by the sweep call itself"

  - entity: AssessmentStatement
    initial_state: NOT_FILED
    terminal_states: [CERTIFIED]
    note: "FIRST of two independent state dimensions on one AssessmentStatement row: filing_status. Nothing in this dimension reads or writes payment_status."
    transitions:
      - from: NOT_FILED
        to: FILED
        trigger: "POST /assessment-statements/{id}/filings"
        actor: LodgingOperator
        preconditions:
          - "AssessmentStatement.filing_status == NOT_FILED"
          - "when the acting X-User-Role is LodgingOperator its X-User-ID equals AssessmentStatement.lodging_business_id; a DistrictAdministrator acting on the operator's behalf is exempt from this ownership test, which the priority-50 row scopes to LodgingOperator"
          - "the owning AssessmentPeriod.status == OPEN"
          - "logical clock <= AssessmentPeriod.due_date, the same window the priority-75 ERR_FILING_WINDOW_CLOSED row enforces; a statement may be self-reported at any instant of the open window, there is no lower bound"
        side_effects:
          - "reported_room_nights and reported_gross_room_revenue_cents are stored; filed_at := logical clock"
          - "provisional_assessment_cents := assessment_amount PROVISIONAL variant output; effective_assessment_cents is re-derived"
          - "AssessmentPeriod.billed_total_cents is recomputed"
          - "payment_status is NOT touched by this transition"

      - from: FILED
        to: AMENDED
        trigger: "POST /assessment-statements/{id}/amendments"
        actor: LodgingOperator
        preconditions:
          - "AssessmentStatement.filing_status in {FILED, AMENDED}"
          - "when the acting X-User-Role is LodgingOperator its X-User-ID equals AssessmentStatement.lodging_business_id; a DistrictAdministrator acting on the operator's behalf is exempt from this ownership test, which the priority-50 row scopes to LodgingOperator"
          - "expected_statement_version equals AssessmentStatement.version"
          - "the amended reported_gross_room_revenue_cents deviates from the value stored by the original filing by at most AMENDMENT_VARIANCE_PCT"
        side_effects:
          - "reported_room_nights and reported_gross_room_revenue_cents are replaced; amendment_count := amendment_count + 1; filed_at := logical clock"
          - "provisional_assessment_cents is recomputed by the PROVISIONAL variant; effective_assessment_cents is re-derived"
          - "AssessmentStatement.version increments by 1"
          - "payment_status, principal_paid_cents, penalty_paid_cents and interest_paid_cents are NOT touched"

      - from: AMENDED
        to: AMENDED
        trigger: "POST /assessment-statements/{id}/amendments on an already amended statement"
        actor: LodgingOperator
        preconditions:
          - "AssessmentStatement.filing_status == AMENDED"
          - "expected_statement_version equals AssessmentStatement.version"
          - "amendment_count < MAX_AMENDMENTS"
        side_effects:
          - "same side effects as FILED -> AMENDED; the new revision supersedes the prior revision"
        note: "self-loop giving the filing dimension its revision cycle"

      - from: FILED
        to: AUDITED
        trigger: "POST /assessment-statements/{id}/audit-certification with action AUDIT"
        actor: IndependentAuditor
        preconditions:
          - "AssessmentStatement.filing_status in {FILED, AMENDED}"
          - "the owning AssessmentPeriod.status in {CLOSED, DELINQUENCY_SWEPT}"
        side_effects:
          - "audited_room_nights and audited_gross_room_revenue_cents are stored; audited_by_user_id := acting X-User-ID"
          - "final_assessment_cents := assessment_amount FINAL variant output; effective_assessment_cents := final_assessment_cents"
          - "AssessmentPeriod.billed_total_cents is recomputed"
        note: "cross-entity guard: the statement cannot be audited while its AssessmentPeriod is still OPEN"

      - from: AMENDED
        to: AUDITED
        trigger: "POST /assessment-statements/{id}/audit-certification with action AUDIT"
        actor: IndependentAuditor
        preconditions:
          - "AssessmentStatement.filing_status == AMENDED"
          - "the owning AssessmentPeriod.status in {CLOSED, DELINQUENCY_SWEPT}"
        side_effects:
          - "same side effects as FILED -> AUDITED"

      - from: AUDITED
        to: CERTIFIED
        trigger: "POST /assessment-statements/{id}/audit-certification with action CERTIFY"
        actor: IndependentAuditor
        preconditions:
          - "AssessmentStatement.filing_status == AUDITED"
          - "no AssessmentDispute on this statement has status in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "AssessmentStatement.filing_status := CERTIFIED; the amount is locked against further filings and amendments"

  - entity: AssessmentStatement
    initial_state: UNPAID
    terminal_states: []
    note: "SECOND of two independent state dimensions on the same AssessmentStatement row: payment_status. Every transition here is re-derived by the payment_status_derivation rule in §1.3 and never reads filing_status."
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /assessment-statements/{id}/remittances whose waterfall leaves 0 < principal_paid_cents < effective_assessment_cents"
        actor: LodgingOperator
        preconditions:
          - "AssessmentStatement.payment_status in {UNPAID, DELINQUENT}"
          - "when the acting X-User-Role is LodgingOperator its X-User-ID equals AssessmentStatement.lodging_business_id; a DistrictAdministrator acting on the operator's behalf is exempt from this ownership test, which the priority-50 row scopes to LodgingOperator"
          - "AssessmentStatement.filing_status != NOT_FILED"
        side_effects:
          - "a Remittance row is created with status APPLIED and its four applied_to_* bucket allocations"
          - "interest_paid_cents, penalty_paid_cents, principal_paid_cents and credit_balance_cents are increased by the corresponding bucket allocations"
          - "payment_status := PARTIALLY_PAID; total_due_cents is re-derived"
          - "District.collected_to_date_cents and AssessmentPeriod.collected_total_cents are increased by the payment amount"
          - "filing_status is NOT touched by this transition"

      - from: PARTIALLY_PAID
        to: PAID_IN_FULL
        trigger: "POST /assessment-statements/{id}/remittances whose waterfall exactly retires total_due_cents"
        actor: LodgingOperator
        preconditions:
          - "AssessmentStatement.payment_status in {UNPAID, PARTIALLY_PAID, DELINQUENT}"
          - "when the acting X-User-Role is LodgingOperator its X-User-ID equals AssessmentStatement.lodging_business_id; a DistrictAdministrator acting on the operator's behalf is exempt from this ownership test, which the priority-50 row scopes to LodgingOperator"
        side_effects:
          - "as for UNPAID -> PARTIALLY_PAID, then payment_status := PAID_IN_FULL with credit_balance_cents == 0 and total_due_cents == 0"

      - from: PARTIALLY_PAID
        to: REFUND_DUE
        trigger: "POST /assessment-statements/{id}/remittances whose waterfall overflows all three buckets"
        actor: LodgingOperator
        preconditions:
          - "AssessmentStatement.payment_status in {UNPAID, PARTIALLY_PAID, DELINQUENT}"
          - "the remittance amount_cents exceeds total_due_cents by at most OVERPAYMENT_TOLERANCE_CENTS"
        side_effects:
          - "the overflow lands in credit_balance_cents and in the Remittance row's applied_to_credit_cents"
          - "payment_status := REFUND_DUE"

      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /assessment-disputes/{id}/resolution with outcome ADJUSTED abating the whole assessment, or POST /assessment-statements/{id}/audit-certification with action AUDIT revising the basis to nothing owed"
        actor: HearingOfficer
        preconditions:
          - "AssessmentStatement.payment_status == UNPAID"
          - "the re-derived effective_assessment_cents is 0 and no penalty or interest has been charged, so total_due_cents becomes 0 with credit_balance_cents still 0"
        side_effects:
          - "payment_status := PAID_IN_FULL with principal_paid_cents, penalty_paid_cents, interest_paid_cents and credit_balance_cents all still 0"
          - "no Remittance row is created: a statement may be retired by abatement rather than by payment"
        note: "REFUND_DUE is NOT reachable this way, because credit_balance_cents stays 0 when nothing was ever paid"

      - from: UNPAID
        to: DELINQUENT
        trigger: "POST /assessment-periods/{id}/delinquency-sweep"
        actor: system
        preconditions:
          - "AssessmentStatement.payment_status in {UNPAID, PARTIALLY_PAID}"
          - "AssessmentStatement.total_due_cents > 0"
          - "logical clock > AssessmentPeriod.due_date advanced by grace_days days"
        side_effects:
          - "payment_status := DELINQUENT and the four-hop cascade documented on AssessmentPeriod CLOSED -> DELINQUENCY_SWEPT runs from this flip"

      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "POST /assessment-periods/{id}/delinquency-sweep"
        actor: system
        preconditions:
          - "AssessmentStatement.payment_status == PARTIALLY_PAID"
          - "AssessmentStatement.total_due_cents > 0"
        side_effects:
          - "payment_status := DELINQUENT and the same four-hop cascade runs"

      - from: PAID_IN_FULL
        to: UNPAID
        trigger: "POST /assessment-statements/{id}/remittance-reversals unwinding the only applied Remittance"
        actor: DistrictAdministrator
        preconditions:
          - "the named Remittance.status == APPLIED and belongs to this statement"
        side_effects:
          - "Remittance.status := REVERSED; reversed_on := logical clock"
          - "interest_paid_cents, penalty_paid_cents, principal_paid_cents and credit_balance_cents are each reduced by that Remittance's corresponding applied_to_* allocation"
          - "payment_status is re-derived by payment_status_derivation and returns to exactly the value it held before that Remittance was applied"
          - "District.collected_to_date_cents and AssessmentPeriod.collected_total_cents return to their pre-remittance values"

      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "POST /assessment-statements/{id}/remittance-reversals unwinding the only applied Remittance of a part-paid statement"
        actor: DistrictAdministrator
        preconditions:
          - "the named Remittance.status == APPLIED and belongs to this statement"
          - "no other Remittance of this statement has status == APPLIED, so the reversal empties every payment bucket"
        side_effects:
          - "Remittance.status := REVERSED; reversed_on := logical clock"
          - "interest_paid_cents, penalty_paid_cents, principal_paid_cents and credit_balance_cents are each reduced by that Remittance's corresponding applied_to_* allocation, leaving all four at 0"
          - "payment_status is re-derived by payment_status_derivation and returns to UNPAID, the value it held before that Remittance was applied"
          - "District.collected_to_date_cents and AssessmentPeriod.collected_total_cents return to their pre-remittance values"
        note: "the part-paid twin of PAID_IN_FULL -> UNPAID; without it a partially paid statement could never be unwound to its filed state"

      - from: REFUND_DUE
        to: PAID_IN_FULL
        trigger: "POST /assessment-statements/{id}/remittance-reversals unwinding an overpaying Remittance while earlier payments still retire total_due_cents"
        actor: DistrictAdministrator
        preconditions:
          - "the named Remittance.status == APPLIED and applied_to_credit_cents > 0"
        side_effects:
          - "credit_balance_cents is reduced by applied_to_credit_cents and payment_status is re-derived to PAID_IN_FULL"

      - from: PAID_IN_FULL
        to: PARTIALLY_PAID
        trigger: "POST /assessment-statements/{id}/remittance-reversals unwinding one of several applied Remittance rows, so a positive total_due_cents reappears while earlier payments remain"
        actor: DistrictAdministrator
        preconditions:
          - "AssessmentStatement.payment_status == PAID_IN_FULL"
          - "the named Remittance.status == APPLIED and belongs to this statement"
          - "at least one other Remittance of this statement is still APPLIED"
        side_effects:
          - "Remittance.status := REVERSED; reversed_on := logical clock; the four buckets are reduced by that row's applied_to_* allocations"
          - "payment_status is re-derived to PARTIALLY_PAID and total_due_cents returns to exactly the value it held before that Remittance was applied"
          - "District.collected_to_date_cents and AssessmentPeriod.collected_total_cents are reduced by amount_cents"

      - from: REFUND_DUE
        to: PARTIALLY_PAID
        trigger: "POST /assessment-statements/{id}/remittance-reversals unwinding a Remittance that had filled both principal and credit, so the reversal removes the credit and reopens a positive total_due_cents"
        actor: DistrictAdministrator
        preconditions:
          - "AssessmentStatement.payment_status == REFUND_DUE"
          - "the named Remittance.status == APPLIED with applied_to_credit_cents > 0 and applied_to_principal_cents > 0"
        side_effects:
          - "credit_balance_cents and principal_paid_cents are each reduced by that row's allocation and payment_status is re-derived to PARTIALLY_PAID"
          - "District.collected_to_date_cents and AssessmentPeriod.collected_total_cents are reduced by amount_cents"

      - from: DELINQUENT
        to: PAID_IN_FULL
        trigger: "POST /assessment-statements/{id}/remittances retiring interest, penalty and principal in full"
        actor: LodgingOperator
        preconditions:
          - "AssessmentStatement.payment_status == DELINQUENT"
        side_effects:
          - "the waterfall fills interest, then penalty, then principal; payment_status := PAID_IN_FULL"
          - "delinquency_stage is left at its swept value; payment in full does not erase the enforcement record"

      - from: PAID_IN_FULL
        to: REFUND_DUE
        trigger: "POST /assessment-statements/{id}/audit-certification with action AUDIT, or POST /assessment-disputes/{id}/resolution with outcome ADJUSTED, lowering effective_assessment_cents below the already-collected principal_paid_cents"
        actor: "IndependentAuditor (audit path) or HearingOfficer (dispute-resolution path)"
        preconditions:
          - "AssessmentStatement.payment_status == PAID_IN_FULL"
          - "the resolved amount reduction leaves effective_assessment_cents < principal_paid_cents"
        side_effects:
          - "assessment_amount is recomputed in its FINAL variant, so effective_assessment_cents falls to the audited or adjusted figure"
          - "the now-excess principal is migrated out of principal_paid_cents into credit_balance_cents so that principal_paid_cents == effective_assessment_cents and credit_balance_cents == the excess; the conserved money identity on District.collected_to_date_cents is untouched because the migration moves cents between buckets of the same statement rather than out of the district"
          - "total_due_cents is re-derived to 0 and payment_status := REFUND_DUE"
          - "filing_status is NOT touched by this transition"

  - entity: Remittance
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /assessment-statements/{id}/remittance-reversals"
        actor: DistrictAdministrator
        preconditions:
          - "Remittance.status == APPLIED"
          - "Remittance.assessment_statement_id equals the path statement id"
          - "the owning AssessmentStatement.filing_status != CERTIFIED"
        side_effects:
          - "Remittance.status := REVERSED; reversed_on := logical clock; reversal_reason is stored"
          - "the statement's four paid/credit buckets are decremented by this row's applied_to_* allocations and payment_status is re-derived"
          - "District.collected_to_date_cents decreases by amount_cents, restoring the conserved money identity collected_to_date_cents == sum over statements of (interest_paid_cents + penalty_paid_cents + principal_paid_cents + credit_balance_cents)"

  - entity: AnnualWorkPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: BOARD_REVIEW
        trigger: "POST /annual-work-plans/{id}/board-actions with action SPONSOR"
        actor: BoardMember
        preconditions:
          - "AnnualWorkPlan.status == DRAFT"
          - "AnnualWorkPlan.expenditure_lines is non-empty"
        side_effects:
          - "AnnualWorkPlan.status := BOARD_REVIEW; sponsor_user_id := acting X-User-ID"

      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "POST /annual-work-plans/{id}/board-actions with action APPROVE"
        actor: BoardMember
        preconditions:
          - "AnnualWorkPlan.status == BOARD_REVIEW"
          - "the acting X-User-ID != AnnualWorkPlan.sponsor_user_id"
          - "the permitted-category and share-cap tests of work_plan_compliance all pass"
        side_effects:
          - "AnnualWorkPlan.status := APPROVED; approver_user_id := acting X-User-ID; approved_at := logical clock"
          - "assessment_revenue_forecast_cents and funding_ratio are computed"

      - from: BOARD_REVIEW
        to: DRAFT
        trigger: "POST /annual-work-plans/{id}/board-actions with action RETURN"
        actor: BoardMember
        preconditions:
          - "AnnualWorkPlan.status == BOARD_REVIEW"
        side_effects:
          - "AnnualWorkPlan.status := DRAFT; sponsor_user_id := null"
        note: "closes the review cycle DRAFT -> BOARD_REVIEW -> DRAFT; a returned plan may be sponsored again by any BoardMember"

      - from: APPROVED
        to: AMENDMENT_PENDING
        trigger: "system re-evaluation of funding_ratio after any AssessmentStatement amount change in the plan's district"
        actor: system
        preconditions:
          - "AnnualWorkPlan.status == APPROVED"
          - "AnnualWorkPlan.fiscal_year == District.current_fiscal_year"
          - "the recomputed funding_ratio < MIN_FUNDING_RATIO"
        side_effects:
          - "AnnualWorkPlan.status := AMENDMENT_PENDING"
          - "that AMENDMENT_PENDING flip itself moves every MarketingProgram of this plan with status == PLANNED to SUSPENDED_PENDING_AMENDMENT, and sets spend_frozen := true on every MarketingProgram of this plan with status == RUNNING"

      - from: AMENDMENT_PENDING
        to: APPROVED
        trigger: "POST /annual-work-plans/{id}/amendments"
        actor: DistrictAdministrator
        preconditions:
          - "AnnualWorkPlan.status in {APPROVED, AMENDMENT_PENDING}"
          - "expected_work_plan_version equals AnnualWorkPlan.version"
          - "the revised expenditure_lines pass every work_plan_compliance test"
          - "the recomputed funding_ratio >= MIN_FUNDING_RATIO"
        side_effects:
          - "expenditure_lines are replaced wholesale and every derived category total is recomputed; revision_count := revision_count + 1"
          - "AnnualWorkPlan.status := APPROVED; AnnualWorkPlan.version increments by 1"
          - "every MarketingProgram of this plan with status == SUSPENDED_PENDING_AMENDMENT returns to PLANNED and every RUNNING program has spend_frozen := false"
        note: "closes the amendment cycle APPROVED -> AMENDMENT_PENDING -> APPROVED"

      - from: APPROVED
        to: CLOSED
        trigger: "POST /annual-work-plans/{id}/board-actions with action CLOSE"
        actor: BoardMember
        preconditions:
          - "AnnualWorkPlan.status == APPROVED"
          - "every MarketingProgram of this plan has status in {CLOSED, CANCELLED}"
        side_effects:
          - "AnnualWorkPlan.status := CLOSED"

  - entity: MarketingProgram
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /marketing-programs/{id}/launch"
        actor: DmoLiaison
        preconditions:
          - "MarketingProgram.status == PLANNED"
          - "the funding AnnualWorkPlan.status == APPROVED"
          - "the owning District.status == ACTIVE"
          - "the owning District.dmo_agreement_status == EXECUTED"
          - "logical clock >= booking_window_start AND logical clock < booking_window_end"
        side_effects:
          - "MarketingProgram.status := RUNNING; launched_at := logical clock"
        note: "cross-entity guard on District.dmo_agreement_status: a program cannot execute without an executed destination marketing organization agreement"

      - from: PLANNED
        to: SUSPENDED_PENDING_AMENDMENT
        trigger: "the owning AnnualWorkPlan moving APPROVED -> AMENDMENT_PENDING"
        actor: system
        preconditions:
          - "MarketingProgram.status == PLANNED"
          - "the funding AnnualWorkPlan has just entered AMENDMENT_PENDING"
        side_effects:
          - "MarketingProgram.status := SUSPENDED_PENDING_AMENDMENT"

      - from: SUSPENDED_PENDING_AMENDMENT
        to: PLANNED
        trigger: "POST /annual-work-plans/{id}/amendments restoring the plan to APPROVED"
        actor: system
        preconditions:
          - "MarketingProgram.status == SUSPENDED_PENDING_AMENDMENT"
          - "the funding AnnualWorkPlan has just returned to APPROVED"
        side_effects:
          - "MarketingProgram.status := PLANNED"
        note: "closes the suspension cycle PLANNED -> SUSPENDED_PENDING_AMENDMENT -> PLANNED"

      - from: RUNNING
        to: CLOSED
        trigger: "POST /marketing-programs/{id}/closure"
        actor: DmoLiaison
        preconditions:
          - "MarketingProgram.status == RUNNING"
          - "MarketingProgram.spend_frozen == false"
          - "no RoomNightClaim of this program has status == SUBMITTED"
        side_effects:
          - "the program_performance calculation runs and writes verified_room_nights, gross_cost_per_room_night_cents, efficiency_tier, dmo_cost_share_cents, net_district_cost_cents, net_cost_per_room_night_cents, performance_index and performance_flag"
          - "MarketingProgram.status := CLOSED; closed_at := logical clock"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /districts/{id}/lifecycle-advances with to_status DISESTABLISHED"
        actor: system
        preconditions:
          - "MarketingProgram.status in {PLANNED, RUNNING, SUSPENDED_PENDING_AMENDMENT}"
          - "the owning District is entering DISESTABLISHED"
        side_effects:
          - "MarketingProgram.status := CANCELLED; spend_frozen := false"
          - "AnnualWorkPlan.committed_program_cents is recomputed excluding this program"

  - entity: RoomNightClaim
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /room-night-claims/{id}/verification with decision ALLOW"
        actor: IndependentAuditor
        preconditions:
          - "RoomNightClaim.status == SUBMITTED"
          - "the allowed_room_nights supplied is >= 1 and <= RoomNightClaim.room_nights"
          - "the owning MarketingProgram.status == RUNNING"
        side_effects:
          - "RoomNightClaim.status := VERIFIED; verified_room_nights := allowed_room_nights; verified_by_user_id := acting X-User-ID"
          - "MarketingProgram.verified_room_nights is recomputed as the sum of verified_room_nights over VERIFIED claims of the program"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /room-night-claims/{id}/verification with decision REJECT"
        actor: IndependentAuditor
        preconditions:
          - "RoomNightClaim.status == SUBMITTED"
          - "a rejection_reason other than NONE is supplied"
        side_effects:
          - "RoomNightClaim.status := REJECTED; rejection_reason is stored; verified_room_nights stays null"
          - "MarketingProgram.verified_room_nights is unchanged, and the rejected interval no longer blocks a later overlapping claim"

  - entity: TransparencyRecord
    initial_state: SCHEDULED
    terminal_states: [PUBLISHED, OVERDUE]
    transitions:
      - from: SCHEDULED
        to: NOTICED
        trigger: "POST /transparency-records/{id}/advance with to_status NOTICED"
        actor: DistrictAdministrator
        preconditions:
          - "TransparencyRecord.status == SCHEDULED"
          - "the logical clock <= scheduled_for minus MIN_NOTICE_DAYS days; exactly MIN_NOTICE_DAYS whole days ahead is accepted"
        side_effects:
          - "TransparencyRecord.status := NOTICED; noticed_on := the logical clock"

      - from: NOTICED
        to: COMPLETED
        trigger: "POST /transparency-records/{id}/advance with to_status COMPLETED"
        actor: DistrictAdministrator
        preconditions:
          - "TransparencyRecord.status == NOTICED"
          - "the logical clock >= TransparencyRecord.scheduled_for"
          - "when record_type == FINANCIAL_AUDIT the acting X-User-ID != TransparencyRecord.engaged_by_user_id, so the administrator who engaged the audit may not also record its completion (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "TransparencyRecord.status := COMPLETED; completed_on := the logical clock"

      - from: COMPLETED
        to: PUBLISHED
        trigger: "POST /transparency-records/{id}/advance with to_status PUBLISHED"
        actor: DistrictAdministrator
        preconditions:
          - "TransparencyRecord.status == COMPLETED"
          - "document_reference is supplied and non-blank"
          - "when record_type == FINANCIAL_AUDIT the acting X-User-ID != TransparencyRecord.engaged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "TransparencyRecord.status := PUBLISHED; published_on := the logical clock; document_reference is stored"
          - "District.transparency_standing is re-derived; it returns to COMPLIANT only when no ANNUAL_REPORT or FINANCIAL_AUDIT record of the district remains OVERDUE"

      - from: SCHEDULED
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc advancing the logical clock past required_by"
        actor: system
        preconditions:
          - "TransparencyRecord.status in {SCHEDULED, NOTICED}"
          - "the new logical clock > TransparencyRecord.required_by"
        side_effects:
          - "TransparencyRecord.status := OVERDUE"
          - "that OVERDUE stamp itself sets District.transparency_standing := DEFICIENT when the record_type is ANNUAL_REPORT or FINANCIAL_AUDIT"
          - "the DEFICIENT standing in turn blocks the District ACTIVE -> RENEWAL_PENDING transition, so a missed report deadline forecloses renewal"

      - from: NOTICED
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc advancing the logical clock past required_by"
        actor: system
        preconditions:
          - "TransparencyRecord.status == NOTICED"
          - "the new logical clock > TransparencyRecord.required_by"
        side_effects:
          - "same three-hop cascade as SCHEDULED -> OVERDUE"

  - entity: AssessmentDispute
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_ADJUSTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /assessment-disputes/{id}/proceedings with action OPEN_REVIEW"
        actor: HearingOfficer
        preconditions:
          - "AssessmentDispute.status == SUBMITTED"
        side_effects:
          - "AssessmentDispute.status := UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /assessment-disputes/{id}/proceedings with action REQUEST_INFO"
        actor: HearingOfficer
        preconditions:
          - "AssessmentDispute.status == UNDER_REVIEW"
        side_effects:
          - "AssessmentDispute.status := INFO_REQUESTED"

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /assessment-disputes/{id}/proceedings with action SUBMIT_RESPONSE"
        actor: LodgingOperator
        preconditions:
          - "AssessmentDispute.status == INFO_REQUESTED"
          - "the acting X-User-ID equals AssessmentDispute.lodging_business_id"
        side_effects:
          - "AssessmentDispute.status := UNDER_REVIEW"
        note: "closes the information-request cycle UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, which may repeat without limit"

      - from: UNDER_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /assessment-disputes/{id}/resolution with outcome ADJUSTED"
        actor: HearingOfficer
        preconditions:
          - "AssessmentDispute.status == UNDER_REVIEW"
          - "granted_adjustment_cents >= 1 and <= AssessmentDispute.claimed_adjustment_cents"
          - "granted_adjustment_cents <= the statement's effective_assessment_cents"
          - "when dispute_type == EXEMPT_PROPERTY an exempt_status_granted value other than NONE is supplied"
        side_effects:
          - "hop 1: AssessmentDispute.status := RESOLVED_ADJUSTED; resolved_by_user_id and resolution_note are stored; the statement's granted_adjustment_cents increases by granted_adjustment_cents, final_assessment_cents (when non-null) and effective_assessment_cents are recomputed, and payment_status is re-derived — becoming REFUND_DUE when principal_paid_cents now exceeds effective_assessment_cents"
          - "hop 2: that change in the statement's effective_assessment_cents itself forces the district's AnnualWorkPlan for District.current_fiscal_year to recompute assessment_revenue_forecast_cents and funding_ratio; an APPROVED plan whose recomputed funding_ratio < MIN_FUNDING_RATIO moves APPROVED -> AMENDMENT_PENDING"
          - "hop 3: that AMENDMENT_PENDING flip itself moves every PLANNED MarketingProgram of the plan to SUSPENDED_PENDING_AMENDMENT and sets spend_frozen := true on every RUNNING MarketingProgram of the plan"
          - "when dispute_type == EXEMPT_PROPERTY the disputing LodgingBusiness additionally moves ASSESSABLE -> EXEMPT with exempt_status := exempt_status_granted"
        note: "three-hop transitive cascade originating from a dispute resolution, distinct from the delinquency-sweep cascade"

      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /assessment-disputes/{id}/resolution with outcome UPHELD"
        actor: HearingOfficer
        preconditions:
          - "AssessmentDispute.status == UNDER_REVIEW"
        side_effects:
          - "AssessmentDispute.status := RESOLVED_UPHELD; granted_adjustment_cents stays 0; resolved_by_user_id and resolution_note are stored"
          - "the statement's amounts, payment_status and the district's work plan forecast are all left untouched"

      - from: RESOLVED_UPHELD
        to: UNDER_REVIEW
        trigger: "POST /assessment-disputes/{id}/proceedings with action APPEAL"
        actor: LodgingOperator
        preconditions:
          - "AssessmentDispute.status == RESOLVED_UPHELD"
          - "the acting X-User-ID equals AssessmentDispute.lodging_business_id"
          - "AssessmentDispute.appeal_count < MAX_APPEALS"
        side_effects:
          - "AssessmentDispute.status := UNDER_REVIEW; appeal_count := appeal_count + 1; resolved_by_user_id := null"
        note: "closes the one-shot appeal cycle UNDER_REVIEW -> RESOLVED_UPHELD -> UNDER_REVIEW"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /assessment-disputes/{id}/proceedings with action WITHDRAW"
        actor: LodgingOperator
        preconditions:
          - "AssessmentDispute.status == SUBMITTED, so a dispute may be abandoned only before the hearing officer opens review; once review is open the matter runs to a resolution"
          - "the acting X-User-ID equals AssessmentDispute.lodging_business_id"
        side_effects:
          - "AssessmentDispute.status := WITHDRAWN"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's version only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: statement-amendment-stale-statement
    parent_entity: AssessmentStatement
    write_endpoint: "POST /assessment-statements/{id}/amendments"
    occ_field: "expected_statement_version"
    description: |
      Filing an amended statement against an AssessmentStatement whose version has
      advanced since the operator last read it is rejected. An amended filing
      legitimately supersedes the prior revision, so the second writer's request is
      not blocked by any state precondition; the stale expected_statement_version is
      the only thing that distinguishes it. A dispute resolution or a preceding
      amendment silently bumps the statement's version, so the operator's cached
      view goes stale without any state change the operator can observe.
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412

  - rule_id: work-plan-amendment-stale-plan
    parent_entity: AnnualWorkPlan
    write_endpoint: "POST /annual-work-plans/{id}/amendments"
    occ_field: "expected_work_plan_version"
    description: |
      Submitting a revised expenditure-line set against an AnnualWorkPlan whose
      version has advanced since the administrator last read it is rejected. A
      revision legitimately supersedes the prior expenditure_lines, so nothing in
      the plan's state machine blocks a second revision; the stale
      expected_work_plan_version is the only discriminator. The AMENDMENT_PENDING
      auto-transition driven by a funding_ratio recompute bumps the plan's version
      between the read and the write.
    error_id: ERR_STALE_WORK_PLAN_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: assessment_amount
    trigger: "on POST /assessment-statements/{id}/filings and POST /assessment-statements/{id}/amendments (PROVISIONAL variant writes provisional_assessment_cents); on POST /assessment-statements/{id}/audit-certification action AUDIT and on POST /assessment-disputes/{id}/resolution outcome ADJUSTED (FINAL variant writes final_assessment_cents)"
    algorithm: threshold
    formula: |
      # branch selected by AssessmentStatement.assessment_method_at_period_start
      if assessment_method_at_period_start == PCT_OF_ROOM_REVENUE:
          revenue_component_cents = round_half_up(revenue_basis_cents * ZONE_RATE[zone_basis] * CLASS_MULTIPLIER[class_basis])
          floor_cents             = nights_basis * PER_NIGHT_FLOOR_CENTS
          gross_cents             = max(revenue_component_cents, floor_cents)
      elif assessment_method_at_period_start == PER_OCCUPIED_ROOM_NIGHT:
          gross_cents = round_half_up(nights_basis * PER_NIGHT_RATE_CENTS * CLASS_MULTIPLIER[class_basis])
      else:   # TIERED_BY_CLASSIFICATION
          gross_cents = round_half_up(FLAT_FEE_CENTS[class_basis] * ZONE_FACTOR[zone_basis])

      capped_cents     = min(gross_cents, PERIOD_CAP_CENTS)
      assessment_cents = max(capped_cents - adjustment_basis_cents, 0)

      # exactly one rounding step per branch, applied before the max/min pair.
      # The max() floor test runs BEFORE the min() cap test; reversing the two
      # would let a floor above the cap escape the cap.
    input_set: "one AssessmentStatement row; only statements whose owning LodgingBusiness.status == ASSESSABLE at generation time exist at all, so EXEMPT, OUTSIDE_BOUNDARY and CLOSED_OUT properties are never billed"
    constants:
      ZONE_RATE: { ZONE_CORE: 0.0200, ZONE_PERIMETER: 0.0125, OUTSIDE: 0.0000 }
      CLASS_MULTIPLIER: { FULL_SERVICE: 1.00, LIMITED_SERVICE: 0.85, BOUTIQUE: 0.90, SHORT_TERM_RENTAL: 1.15 }
      ZONE_FACTOR: { ZONE_CORE: 1.0000, ZONE_PERIMETER: 0.6250, OUTSIDE: 0.0000 }
      FLAT_FEE_CENTS: { FULL_SERVICE: 500000, LIMITED_SERVICE: 300000, BOUTIQUE: 350000, SHORT_TERM_RENTAL: 150000 }
      PER_NIGHT_FLOOR_CENTS: 150
      PER_NIGHT_RATE_CENTS: 300
      PERIOD_CAP_CENTS: 2500000
    precision: "integer cents, round_half_up applied once per branch as written"
    variants:
      - name: PROVISIONAL
        when: "computed at filing and at every amendment, before any audit has run"
        difference: "zone_basis := the LodgingBusiness.boundary_zone read live at the moment of the call; class_basis := the LodgingBusiness.classification read live at the moment of the call; revenue_basis_cents := reported_gross_room_revenue_cents; nights_basis := reported_room_nights; adjustment_basis_cents := 0. Output lands in provisional_assessment_cents."
      - name: FINAL
        when: "computed at audit and recomputed on every RESOLVED_ADJUSTED dispute"
        difference: "zone_basis := AssessmentStatement.zone_at_period_start; class_basis := AssessmentStatement.classification_at_period_start; revenue_basis_cents := audited_gross_room_revenue_cents when non-null else reported_gross_room_revenue_cents; nights_basis := audited_room_nights when non-null else reported_room_nights; adjustment_basis_cents := AssessmentStatement.granted_adjustment_cents. Output lands in final_assessment_cents. Because a mid-period classification or zone revision moves the live values away from the period-start snapshot, the two variants return different integers for byte-identical reported data."

  - name: petition_support
    trigger: "recomputed on POST /petition-drives/{id}/signatures, POST /petition-signatures/{id}/withdrawal, any cascade that disqualifies a signature, any POST /districts/{id}/boundary-revisions, any POST /lodging-businesses/{id}/revisions that changes the assessable set, and immediately before the threshold comparison inside POST /petition-drives/{id}/tally"
    algorithm: weighted_scoring
    formula: |
      assessable_set = LodgingBusiness rows where
                         district_id == drive.district_id
                         AND status == ASSESSABLE
                         AND exempt_status == NONE
                         AND boundary_zone IN District.included_zones
      assessable_basis_snapshot_cents = sum(prior_year_gross_room_revenue_cents over assessable_set)
      assessable_count_snapshot       = count(assessable_set)

      valid_set          = PetitionSignature rows where petition_drive_id == drive.id AND status == VALID
      signed_basis_cents = sum(weight_basis_revenue_cents over valid_set)
      valid_signature_count = count(valid_set)

      # ONE division, ONE rounding, at the very end. Per-business shares are never
      # rounded and then summed; that order would drift by up to n half-cents.
      weighted_support_pct  = 0.0000 if assessable_basis_snapshot_cents == 0
                              else round_half_up(signed_basis_cents / assessable_basis_snapshot_cents, 4)
      headcount_support_pct = 0.0000 if assessable_count_snapshot == 0
                              else round_half_up(valid_signature_count / assessable_count_snapshot, 4)

      qualifies = (weighted_support_pct >= drive.required_weighted_pct)
                  AND (headcount_support_pct >= drive.required_headcount_pct)
      # both comparisons are >= , so a support level exactly equal to the
      # threshold qualifies.
    input_set: "signatures filtered to status == VALID only; WITHDRAWN and DISQUALIFIED signatures contribute nothing to either numerator. The denominator is the assessable set as of the recompute instant, not as of drive open."
    constants:
      DEFAULT_FORMATION_THRESHOLD_PCT: 0.6000
      DEFAULT_RENEWAL_THRESHOLD_PCT: 0.6500
      DEFAULT_RENEWAL_HEADCOUNT_THRESHOLD_PCT: 0.5000
      MIN_PETITION_POOL: 3
      MIN_ASSESSABLE_ROOMS: 5
    precision: "4 decimal places, round_half_up, applied once after the single division"
    variants:
      - name: REVENUE_WEIGHTED
        when: "the binding test for FORMATION drives, where required_headcount_pct is snapshotted as 0.0000"
        difference: "numerator and denominator are revenue in cents, so a single large property can carry a drive on its own. Writes weighted_support_pct."
      - name: HEADCOUNT
        when: "an additional binding test for RENEWAL drives, where required_headcount_pct is snapshotted from District.renewal_headcount_threshold_pct"
        difference: "numerator and denominator are unweighted counts of businesses, so property size is irrelevant. Writes headcount_support_pct. For a signature set dominated by one large property the two variants return materially different percentages from identical data, and a RENEWAL drive can pass the revenue test while failing the headcount test."

  - name: program_performance
    trigger: "on POST /marketing-programs/{id}/closure"
    algorithm: tiered_pricing
    formula: |
      # PASS 1 — gross basis. The tier is selected here and is NEVER reselected.
      verified_room_nights = sum(RoomNightClaim.verified_room_nights
                                 over claims of this program with status == VERIFIED)
      if verified_room_nights == 0:
          gross_cost_per_room_night_cents = null
          efficiency_tier   = TIER_UNPRODUCTIVE
      else:
          gross_cost_per_room_night_cents = round_half_up(committed_cents / verified_room_nights)
          efficiency_tier = TIER_EFFICIENT     if gross_cost_per_room_night_cents <= 1500
                       else TIER_STANDARD      if gross_cost_per_room_night_cents <= 3000
                       else TIER_MARGINAL      if gross_cost_per_room_night_cents <= 6000
                       else TIER_UNPRODUCTIVE

      # PASS 2 — net basis. Uses the tier fixed in pass 1.
      dmo_cost_share_cents   = round_half_up(committed_cents * DMO_SHARE_PCT[efficiency_tier])
      net_district_cost_cents = committed_cents - dmo_cost_share_cents
      if verified_room_nights == 0:
          net_cost_per_room_night_cents = null
          performance_index = 0.0000
      else:
          net_cost_per_room_night_cents = round_half_up(net_district_cost_cents / verified_room_nights)
          performance_index = round_half_up(BENCHMARK_CPRN_CENTS / net_cost_per_room_night_cents, 4)

      performance_flag = UNDERPERFORMING  if verified_room_nights == 0
                    else MEETS_BENCHMARK  if performance_index >= 1.0000
                    else BELOW_BENCHMARK  if performance_index >= 0.7500
                    else UNDERPERFORMING

      # The dependency looks circular — the share depends on the tier, the tier
      # depends on cost per room night, and cost per room night depends on the
      # share. The order above breaks it: tier from GROSS cost only, then share,
      # then net cost. Re-tiering on net_cost_per_room_night_cents is forbidden
      # and would change the published index.
    input_set: "only RoomNightClaim rows of this program with status == VERIFIED; SUBMITTED claims block closure entirely and REJECTED claims are excluded from the numerator and never restored"
    constants:
      DMO_SHARE_PCT: { TIER_EFFICIENT: 0.40, TIER_STANDARD: 0.25, TIER_MARGINAL: 0.10, TIER_UNPRODUCTIVE: 0.00 }
      BENCHMARK_CPRN_CENTS: 2500
      TIER_EFFICIENT_MAX_CENTS: 1500
      TIER_STANDARD_MAX_CENTS: 3000
      TIER_MARGINAL_MAX_CENTS: 6000
    precision: "integer cents for the three cost figures, 4 decimal places round_half_up for performance_index"

  - name: delinquency_charges
    trigger: "on POST /assessment-periods/{id}/delinquency-sweep, once per statement swept"
    algorithm: aggregation
    formula: |
      grace_deadline    = AssessmentPeriod.due_date advanced by AssessmentPeriod.grace_days whole days
      # STRICT inequality: a statement is swept only when the clock is past the
      # deadline. A clock landing exactly on grace_deadline is NOT delinquent.
      is_delinquent     = logical_clock > grace_deadline
      days_late         = whole days from grace_deadline to logical_clock   # >= 1 whenever is_delinquent

      outstanding_cents = max(effective_assessment_cents - principal_paid_cents, 0)
      penalty_cents     = round_half_up(outstanding_cents * PENALTY_PCT)
      interest_cents    = round_half_up(outstanding_cents * DAILY_INTEREST_PCT * days_late)

      delinquency_stage = LIEN_REFERRED if (outstanding_cents >= LIEN_REFERRAL_THRESHOLD_CENTS
                                            OR compliance_standing_at_sweep_start == SUSPENDED)
                          else NOTICE
      # compliance_standing_at_sweep_start is the LodgingBusiness.compliance_standing
      # as it stands when the sweep begins, BEFORE this sweep's own strike
      # increment. A business that reaches SUSPENDED because of this very sweep
      # is therefore staged NOTICE, not LIEN_REFERRED.

      # ROUNDING ORDER IS PINNED: penalty_cents and interest_cents are rounded
      # ONCE PER STATEMENT and only then accumulated into
      # District.delinquent_charges_cents. Summing outstanding_cents across the
      # period first and applying the rates to that aggregate yields a different
      # total whenever any per-statement product lands on a half cent.
      District.delinquent_charges_cents += (penalty_cents + interest_cents)
    input_set: "statements of the swept period with payment_status IN {UNPAID, PARTIALLY_PAID} and total_due_cents > 0, processed in created_at ASC order; PAID_IN_FULL, REFUND_DUE and already DELINQUENT statements are skipped"
    constants:
      PENALTY_PCT: 0.10
      DAILY_INTEREST_PCT: 0.0005
      LIEN_REFERRAL_THRESHOLD_CENTS: 1000000
    precision: "integer cents, round_half_up, rounded per statement before accumulation"

  - name: remittance_waterfall
    trigger: "on POST /assessment-statements/{id}/remittances (forward) and on POST /assessment-statements/{id}/remittance-reversals (exact inverse)"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents

      # Bucket order is fixed. A bucket is filled to its outstanding balance
      # before any cents reach the next bucket.
      interest_outstanding  = statement.interest_cents  - statement.interest_paid_cents
      applied_to_interest   = min(remaining, max(interest_outstanding, 0))
      remaining            -= applied_to_interest

      penalty_outstanding   = statement.penalty_cents   - statement.penalty_paid_cents
      applied_to_penalty    = min(remaining, max(penalty_outstanding, 0))
      remaining            -= applied_to_penalty

      principal_outstanding = statement.effective_assessment_cents - statement.principal_paid_cents
      applied_to_principal  = min(remaining, max(principal_outstanding, 0))
      remaining            -= applied_to_principal

      applied_to_credit     = remaining          # overflow, never discarded

      statement.interest_paid_cents  += applied_to_interest
      statement.penalty_paid_cents   += applied_to_penalty
      statement.principal_paid_cents += applied_to_principal
      statement.credit_balance_cents += applied_to_credit
      District.collected_to_date_cents += amount_cents

      # CONSERVED IDENTITY, checked after every forward and reverse call:
      #   District.collected_to_date_cents ==
      #     sum over the district's statements of
      #       (interest_paid_cents + penalty_paid_cents
      #        + principal_paid_cents + credit_balance_cents)
      # A reversal subtracts exactly the four per-bucket amounts recorded on the
      # Remittance row — it does NOT re-run the waterfall backwards — so the
      # identity holds no matter what order remittances and reversals arrive in.
    input_set: "the four buckets of exactly one AssessmentStatement plus the amount_cents of the one Remittance being applied or reversed; only Remittance rows with status == APPLIED contribute to the buckets"
    constants:
      OVERPAYMENT_TOLERANCE_CENTS: 500000
    precision: "integer cents; no rounding occurs anywhere in the waterfall, so it is exactly reversible"

  - name: payment_status_derivation
    trigger: "recomputed at the end of every call that changes any of the four money buckets, the effective assessment, or the delinquency stage: remittances, remittance reversals, filings, amendments, audit-certification, dispute resolution, delinquency-sweep"
    algorithm: threshold
    formula: |
      effective_assessment_cents = final_assessment_cents
                                   if final_assessment_cents is not null
                                   else max(provisional_assessment_cents - granted_adjustment_cents, 0)

      # REALLOCATION STEP. A downward adjustment can leave principal_paid_cents
      # above the new assessment. The excess migrates to credit rather than
      # vanishing, which is what keeps the conserved identity of
      # remittance_waterfall true after a dispute is granted.
      overpaid = principal_paid_cents - effective_assessment_cents
      if overpaid > 0:
          credit_balance_cents += overpaid
          principal_paid_cents  = effective_assessment_cents

      total_due_cents = max((effective_assessment_cents + penalty_cents + interest_cents)
                            - (principal_paid_cents + penalty_paid_cents + interest_paid_cents), 0)

      payment_status = REFUND_DUE      if credit_balance_cents > 0 AND total_due_cents == 0
                  else PAID_IN_FULL    if total_due_cents == 0
                  else DELINQUENT      if delinquency_stage != NONE
                  else PARTIALLY_PAID  if (principal_paid_cents + penalty_paid_cents + interest_paid_cents) > 0
                  else UNPAID
      # REFUND_DUE is tested before PAID_IN_FULL, and DELINQUENT before
      # PARTIALLY_PAID; the ladder is evaluated top to bottom and stops at the
      # first true branch.
    input_set: "one AssessmentStatement row after the buckets have settled; no aggregation across statements"
    precision: "integer cents"

  - name: work_plan_compliance
    trigger: "on POST /annual-work-plans/{id}/board-actions with action APPROVE, on POST /annual-work-plans/{id}/amendments, and recomputed as a cascade whenever any assessment statement of the plan's fiscal-year period changes its effective assessment"
    algorithm: constraint_propagation
    formula: |
      total_budget_cents = sum(line.amount_cents over expenditure_lines)

      # --- category caps. Evaluated ONLY at APPROVE and at amendment; a DRAFT
      # --- plan may hold a non-compliant mix, which is what makes the sponsor /
      # --- approver identity check reachable ahead of these checks.
      admin_cap_cents        = round_half_up(total_budget_cents * ADMIN_SHARE_CAP_PCT)
      contingency_cap_cents  = round_half_up(total_budget_cents * CONTINGENCY_SHARE_CAP_PCT)
      marketing_floor_cents  = round_half_up(total_budget_cents * MARKETING_SHARE_MIN_PCT)
      sum(ADMINISTRATION lines)      <= admin_cap_cents        else ERR_ADMIN_SHARE_EXCEEDED
      sum(CONTINGENCY_RESERVE lines) <= contingency_cap_cents  else ERR_CONTINGENCY_SHARE_EXCEEDED
      sum(SALES_AND_MARKETING lines) >= marketing_floor_cents  else ERR_MARKETING_SHARE_BELOW_MINIMUM
      any CAPITAL_IMPROVEMENT line is permitted only when
        District.assessment_method == PCT_OF_ROOM_REVENUE      else ERR_EXPENDITURE_CATEGORY_NOT_PERMITTED

      # --- lodging tax match ceiling
      lodging_tax_match_cap_cents = round_half_up(total_budget_cents * LODGING_TAX_MATCH_CAP_PCT)
      District.lodging_tax_match_committed_cents <= min(lodging_tax_match_cap_cents,
                                                        District.lodging_tax_match_pool_cents)
                                                                else ERR_LODGING_TAX_MATCH_CAP_EXCEEDED

      # --- amendment variance ceiling
      baseline_total_cents     = total_budget_cents as currently stored on the plan
      variance_allowance_cents = round_half_up(baseline_total_cents * AMENDMENT_VARIANCE_PCT)
      abs(proposed_total_budget_cents - baseline_total_cents) <= variance_allowance_cents
                                                                else ERR_AMENDMENT_VARIANCE_EXCEEDED
      revision_count < MAX_AMENDMENTS                           else ERR_AMENDMENT_VARIANCE_EXCEEDED

      # --- funding ratio, the propagated quantity
      assessment_forecast_cents = sum(effective_assessment_cents over the statements of
                                      every AssessmentPeriod of the plan's district whose
                                      period_label begins with "FY<plan.fiscal_year>")
      funding_ratio = 0.0000 if total_budget_cents == 0
                      else round_half_up(assessment_forecast_cents / total_budget_cents, 4)
      # A plan already APPROVED whose funding_ratio falls below the minimum is
      # driven to AMENDMENT_PENDING by the cascade; the check reaches a fixed
      # point because the recomputation touches only the plan and its programs
      # and never writes back to any statement.
      funding_ratio >= MIN_FUNDING_RATIO                        else ERR_FUNDING_RATIO_BELOW_MINIMUM
    input_set: "the plan's own expenditure_lines for the caps; for funding_ratio, every AssessmentStatement of every AssessmentPeriod of the district whose period_label begins with \"FY<plan.fiscal_year>\", regardless of payment_status, using effective assessments rather than cash collected"
    constants:
      ADMIN_SHARE_CAP_PCT: 0.15
      CONTINGENCY_SHARE_CAP_PCT: 0.10
      MARKETING_SHARE_MIN_PCT: 0.60
      LODGING_TAX_MATCH_CAP_PCT: 0.50
      AMENDMENT_VARIANCE_PCT: 0.25
      MAX_AMENDMENTS: 3
      MIN_FUNDING_RATIO: 0.9000
    precision: "integer cents for every cap; 4 decimal places round_half_up for funding_ratio"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# -----------------------------------------------------------------------------
validations:

  # --- 10 authentication -------------------------------------------------
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except the ten public ones whose §1.5 roles list contains PublicViewer — GET /districts, GET /districts/{id}, GET /districts/{id}/financial-summary, GET /districts/{id}/petition-drives, GET /districts/{id}/annual-work-plans, GET /districts/{id}/transparency-records, GET /petition-drives/{id}, GET /annual-work-plans/{id}, GET /marketing-programs/{id} and GET /transparency-records/{id} — which are served with no headers at all; on every other endpoint both headers are required"

  # --- 20 authorization --------------------------------------------------
  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: "when X-User-Role is LodgingOperator, X-User-ID must equal the id of an existing LodgingBusiness (the role is entity_backed per §1.7); an unresolvable operator identity is rejected before any path id is looked up"
    error_id: ERR_OPERATOR_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "every endpoint whose roles list contains LodgingOperator"

  # --- 30 request shape --------------------------------------------------
  - priority: 30
    category: existence
    check: "every non-optional field in the endpoint's input is present; enum fields carry a declared member; integer cent fields are integers >= 0; date and instant fields parse as ISO-8601; interval fields satisfy start < end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- 40 existence ------------------------------------------------------
  - priority: 40
    category: existence
    check: "path ids are resolved left to right, then body foreign keys in the order the fields are declared in §1.5 input; the first unresolved reference determines the error"
    error_id: "ERR_DISTRICT_NOT_FOUND | ERR_LODGING_BUSINESS_NOT_FOUND | ERR_PETITION_DRIVE_NOT_FOUND | ERR_PETITION_SIGNATURE_NOT_FOUND | ERR_ASSESSMENT_PERIOD_NOT_FOUND | ERR_ASSESSMENT_STATEMENT_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND | ERR_WORK_PLAN_NOT_FOUND | ERR_MARKETING_PROGRAM_NOT_FOUND | ERR_ROOM_NIGHT_CLAIM_NOT_FOUND | ERR_TRANSPARENCY_RECORD_NOT_FOUND | ERR_DISPUTE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id or a body foreign key"

  # --- 50 ownership ------------------------------------------------------
  - priority: 50
    category: auth
    check: "a LodgingOperator may only act on resources reachable from its own LodgingBusiness: the statement, signature, claim, remittance or dispute must chain back to lodging_business_id == X-User-ID. Checked AFTER existence so that a genuinely absent resource still yields 404 rather than leaking ownership information."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /petition-drives/{id}/signatures, POST /petition-signatures/{id}/withdrawal, POST /assessment-statements/{id}/filings, POST /assessment-statements/{id}/amendments, POST /assessment-statements/{id}/remittances, POST /assessment-disputes, POST /assessment-disputes/{id}/proceedings, POST /marketing-programs/{id}/room-night-claims, GET /lodging-businesses/{id} and its sub-resources"

  # --- 60 state preconditions -------------------------------------------
  - priority: 60
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2, including every cross-entity guard listed in that transition's preconditions (district ACTIVE, period OPEN or CLOSED, plan APPROVED, drive OPEN, program PLANNED or RUNNING, dispute non-terminal); terminal states accept nothing"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every POST that drives a state machine"

  - priority: 60
    category: state
    check: "a statement whose filing_status == CERTIFIED accepts no filing, no amendment and no further audit action; certification is the closing act of the statement's filing dimension"
    error_id: ERR_STATEMENT_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /assessment-statements/{id}/filings, POST /assessment-statements/{id}/amendments, POST /assessment-statements/{id}/audit-certification"

  - priority: 60
    category: state
    check: "a district whose status is EXPIRED, DISESTABLISHED or FORMATION_FAILED accepts no assessment, work-plan, program or transparency activity at all"
    error_id: ERR_DISTRICT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assessment-periods, POST /annual-work-plans, POST /marketing-programs, POST /transparency-records, POST /petition-drives"

  # --- 65 optimistic concurrency ----------------------------------------
  - priority: 65
    category: state
    check: "expected_statement_version equals AssessmentStatement.version as currently stored (§1.2.1 statement-amendment-stale-statement)"
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412
    applies_to: "POST /assessment-statements/{id}/amendments"

  - priority: 65
    category: state
    check: "expected_work_plan_version equals AnnualWorkPlan.version as currently stored (§1.2.1 work-plan-amendment-stale-plan)"
    error_id: ERR_STALE_WORK_PLAN_VERSION
    http_status: 412
    applies_to: "POST /annual-work-plans/{id}/amendments"

  # --- 70 business_safety: compliance and segregation of duties ---------
  - priority: 70
    category: business_safety
    check: "the X-User-ID approving a work plan must differ from the X-User-ID recorded as sponsor_user_id, the X-User-ID certifying a statement must differ from the X-User-ID recorded as audited_by_user_id, and the X-User-ID advancing a FINANCIAL_AUDIT TransparencyRecord to COMPLETED or PUBLISHED must differ from the X-User-ID recorded as engaged_by_user_id; one operator may not both propose and bless the same record"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /annual-work-plans/{id}/board-actions with action APPROVE, POST /assessment-statements/{id}/audit-certification with action CERTIFY, POST /transparency-records/{id}/advance with to_status COMPLETED or PUBLISHED on a FINANCIAL_AUDIT record"

  - priority: 70
    category: business_safety
    check: "before a renewal petition may be certified or a district may enter RENEWAL_PENDING, the district must hold PUBLISHED TransparencyRecord rows of record_type ANNUAL_REPORT and record_type FINANCIAL_AUDIT for District.current_fiscal_year, and District.transparency_standing must not be DEFICIENT"
    error_id: ERR_TRANSPARENCY_REQUIREMENTS_UNMET
    http_status: 409
    applies_to: "POST /districts/{id}/lifecycle-advances with to_status RENEWAL_PENDING, POST /petition-drives/{id}/certification for drive_type RENEWAL"

  # --- 75 business_temporal ---------------------------------------------
  - priority: 75
    category: business_temporal
    check: "the logical clock must lie within [opened_on, closes_at) of the drive; a signature or withdrawal outside that half-open window is rejected"
    error_id: ERR_PETITION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /petition-drives/{id}/signatures, POST /petition-signatures/{id}/withdrawal"

  - priority: 75
    category: business_temporal
    check: "a RENEWAL drive may only be created, and a district may only be moved to RENEWAL_PENDING, when the logical clock is within RENEWAL_WINDOW_DAYS (180) whole days before District.expiration_date and not after it"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /petition-drives with drive_type RENEWAL, POST /districts/{id}/lifecycle-advances with to_status RENEWAL_PENDING"

  - priority: 75
    category: business_temporal
    check: "advancing a TransparencyRecord to NOTICED requires the logical clock to be at least MIN_NOTICE_DAYS (14) whole days before scheduled_for; exactly 14 days is accepted, 13 is not"
    error_id: ERR_MEETING_NOTICE_TOO_LATE
    http_status: 409
    applies_to: "POST /transparency-records/{id}/advance with to_status NOTICED"

  - priority: 75
    category: business_temporal
    check: "a RoomNightClaim's [stay_start, stay_end) must fall entirely inside the owning MarketingProgram's [booking_window_start, booking_window_end) window and the claim must be submitted while the program is RUNNING"
    error_id: ERR_CLAIM_OUTSIDE_BOOKING_WINDOW
    http_status: 409
    applies_to: "POST /marketing-programs/{id}/room-night-claims"

  - priority: 75
    category: business_temporal
    check: "a filing or amendment requires the owning AssessmentPeriod to be OPEN and the logical clock to be at or before AssessmentPeriod.due_date; a CLOSED or DELINQUENCY_SWEPT period accepts neither"
    error_id: ERR_FILING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /assessment-statements/{id}/filings, POST /assessment-statements/{id}/amendments"

  # --- 80 business_referential ------------------------------------------
  - priority: 80
    category: business_referential
    check: "the acting LodgingBusiness must belong to the same district as the petition drive, assessment period or marketing program being acted on, must have boundary_zone in District.included_zones, and must have status == ASSESSABLE, in order to sign a petition, to be issued a statement, or to submit a room-night claim"
    error_id: ERR_BUSINESS_OUTSIDE_BOUNDARY
    http_status: 409
    applies_to: "POST /petition-drives/{id}/signatures, POST /assessment-periods/{id}/statement-generation, POST /marketing-programs/{id}/room-night-claims"

  - priority: 80
    category: business_referential
    check: "a LodgingBusiness whose exempt_status is not NONE, or whose status is EXEMPT, may not sign a petition and is excluded from statement generation"
    error_id: ERR_BUSINESS_EXEMPT
    http_status: 409
    applies_to: "POST /petition-drives/{id}/signatures"

  - priority: 80
    category: business_referential
    check: "at most one PetitionSignature with status VALID may exist per (petition_drive_id, lodging_business_id); a WITHDRAWN or DISQUALIFIED prior signature does not block a fresh one"
    error_id: ERR_DUPLICATE_SIGNATURE
    http_status: 409
    applies_to: "POST /petition-drives/{id}/signatures"

  - priority: 80
    category: business_referential
    check: "at most one AssessmentStatement may exist per (assessment_period_id, lodging_business_id); re-running statement generation on a period that already has statements generates only the eligible businesses that are still missing one, and is refused outright when no eligible business is missing a statement (generated_count would be 0)"
    error_id: ERR_STATEMENT_ALREADY_EXISTS_FOR_PERIOD
    http_status: 409
    applies_to: "POST /assessment-periods/{id}/statement-generation"

  - priority: 80
    category: business_referential
    check: "at most one non-terminal AssessmentDispute may exist per (assessment_statement_id, dispute_type)"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /assessment-disputes"

  - priority: 80
    category: business_referential
    check: "a Remittance may only be reversed once, and only while its status is APPLIED"
    error_id: ERR_REMITTANCE_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /assessment-statements/{id}/remittance-reversals"

  # --- 85 business_constraint -------------------------------------------
  - priority: 85
    category: business_constraint
    check: "AssessmentPeriod windows of one district, treated as half-open [period_start, period_end), must not overlap; a new period starting exactly on an existing period's period_end is accepted"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /assessment-periods"

  - priority: 85
    category: business_constraint
    check: "two TransparencyRecord rows of record_type PUBLIC_MEETING on the same district must have scheduled_for dates at least MIN_MEETING_SEPARATION_DAYS (10) whole days apart; a separation of exactly 10 days is accepted, 9 days is rejected"
    error_id: ERR_MEETING_SEPARATION_VIOLATION
    http_status: 409
    applies_to: "POST /transparency-records"

  - priority: 85
    category: business_constraint
    check: "RoomNightClaim stay intervals of the same (marketing_program_id, lodging_business_id) pair, treated as half-open [stay_start, stay_end), must not overlap; an interval starting exactly where another ends is accepted. Only claims with status SUBMITTED or VERIFIED occupy the interval; a REJECTED claim frees it."
    error_id: ERR_CLAIM_STAY_OVERLAP
    http_status: 409
    applies_to: "POST /marketing-programs/{id}/room-night-claims"

  - priority: 85
    category: business_constraint
    check: "room_nights must not exceed LodgingBusiness.room_count multiplied by the whole nights in [stay_start, stay_end); verified_room_nights must not exceed the claim's room_nights"
    error_id: ERR_CLAIM_EXCEEDS_CAPACITY
    http_status: 409
    applies_to: "POST /marketing-programs/{id}/room-night-claims, POST /room-night-claims/{id}/verification"

  - priority: 85
    category: business_constraint
    check: "every expenditure_lines category must be a member of the permitted set, and a CAPITAL_IMPROVEMENT line is permitted only when District.assessment_method == PCT_OF_ROOM_REVENUE"
    error_id: ERR_EXPENDITURE_CATEGORY_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /annual-work-plans/{id}/board-actions with action APPROVE, POST /annual-work-plans/{id}/amendments"

  - priority: 85
    category: business_constraint
    check: "sum of ADMINISTRATION lines must not exceed round_half_up(total_budget_cents * 0.15)"
    error_id: ERR_ADMIN_SHARE_EXCEEDED
    http_status: 409
    applies_to: "POST /annual-work-plans/{id}/board-actions with action APPROVE, POST /annual-work-plans/{id}/amendments"

  - priority: 85
    category: business_constraint
    check: "sum of CONTINGENCY_RESERVE lines must not exceed round_half_up(total_budget_cents * 0.10)"
    error_id: ERR_CONTINGENCY_SHARE_EXCEEDED
    http_status: 409
    applies_to: "POST /annual-work-plans/{id}/board-actions with action APPROVE, POST /annual-work-plans/{id}/amendments"

  - priority: 85
    category: business_constraint
    check: "sum of SALES_AND_MARKETING lines must be at least round_half_up(total_budget_cents * 0.60)"
    error_id: ERR_MARKETING_SHARE_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /annual-work-plans/{id}/board-actions with action APPROVE, POST /annual-work-plans/{id}/amendments"

  # --- 90 business_fiscal -----------------------------------------------
  - priority: 90
    category: business_fiscal
    check: "an amendment may not move total_budget_cents further than round_half_up(total_budget_cents * 0.25) away from the plan's total_budget_cents as currently stored, and no plan may accept more than MAX_AMENDMENTS (3) revisions (AnnualWorkPlan.revision_count)"
    error_id: ERR_AMENDMENT_VARIANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /annual-work-plans/{id}/amendments"

  - priority: 90
    category: business_fiscal
    check: "funding_ratio computed by work_plan_compliance must be at least MIN_FUNDING_RATIO (0.9000) at the moment of board approval"
    error_id: ERR_FUNDING_RATIO_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /annual-work-plans/{id}/board-actions with action APPROVE"

  - priority: 90
    category: business_fiscal
    check: "the sum of committed_cents over the plan's non-CANCELLED MarketingProgram rows must not exceed the plan's SALES_AND_MARKETING line total"
    error_id: ERR_PROGRAM_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /marketing-programs, POST /marketing-programs/{id}/launch"

  - priority: 90
    category: business_fiscal
    check: "District.lodging_tax_match_committed_cents must not exceed min(round_half_up(total_budget_cents * 0.50), District.lodging_tax_match_pool_cents), evaluated against the APPROVED plan of District.current_fiscal_year"
    error_id: ERR_LODGING_TAX_MATCH_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /marketing-programs, POST /districts/{id}/dmo-coordination, POST /annual-work-plans/{id}/board-actions with action APPROVE"

  - priority: 90
    category: business_fiscal
    check: "District.lodging_tax_match_committed_cents must not exceed District.lodging_tax_match_pool_cents"
    error_id: ERR_LODGING_TAX_MATCH_EXHAUSTED
    http_status: 409
    applies_to: "POST /districts/{id}/dmo-coordination"

  - priority: 90
    category: business_fiscal
    check: "a remittance amount_cents may exceed total_due_cents only by at most OVERPAYMENT_TOLERANCE_CENTS (500000); beyond that the payment is refused rather than banked as credit"
    error_id: ERR_REMITTANCE_EXCEEDS_TOTAL_DUE
    http_status: 409
    applies_to: "POST /assessment-statements/{id}/remittances"

  - priority: 90
    category: business_fiscal
    check: "a dispute resolution's adjustment_cents must not exceed the statement's current effective_assessment_cents"
    error_id: ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT
    http_status: 409
    applies_to: "POST /assessment-disputes/{id}/resolution"

  - priority: 90
    category: business_fiscal
    check: "a petition drive may not be certified unless the eligible assessable pool holds at least MIN_PETITION_POOL (3) businesses, so a one-property district cannot self-certify a district into existence"
    error_id: ERR_PETITION_POOL_TOO_SMALL
    http_status: 409
    applies_to: "POST /petition-drives/{id}/tally, POST /petition-drives/{id}/certification"

  # --- 60 state preconditions: cross-entity guards ----------------------
  - priority: 60
    category: state
    check: "an audit may only be recorded once the owning AssessmentPeriod has left OPEN; the statement's own filing_status being FILED or AMENDED is not sufficient"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /assessment-statements/{id}/audit-certification with action AUDIT"

  - priority: 60
    category: state
    check: "a marketing program may only be created against an AnnualWorkPlan whose status is APPROVED; DRAFT, BOARD_REVIEW, AMENDMENT_PENDING and CLOSED plans fund nothing"
    error_id: ERR_WORK_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /marketing-programs"

  - priority: 60
    category: state
    check: "a program may only be launched while District.dmo_agreement_status == EXECUTED; a program in a perfectly valid PLANNED state still cannot go to market under a merely PROPOSED or TERMINATED agreement"
    error_id: ERR_DMO_AGREEMENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /marketing-programs/{id}/launch"

  - priority: 60
    category: state
    check: "a RUNNING program whose spend_frozen flag is true, set when its funding work plan fell into AMENDMENT_PENDING, may not be closed: performance may not be published against a budget that is no longer funded. The program's status is still RUNNING, so the generic state check at this same priority does not fire and this error is the only possible outcome"
    error_id: ERR_PROGRAM_SPEND_FROZEN
    http_status: 409
    applies_to: "POST /marketing-programs/{id}/closure"

  - priority: 60
    category: state
    check: "a program may not be closed while any of its RoomNightClaim rows is still SUBMITTED, because performance measurement reads verified nights only and an unverified claim would silently drop out of the published index"
    error_id: ERR_CLAIMS_PENDING_VERIFICATION
    http_status: 409
    applies_to: "POST /marketing-programs/{id}/closure"

  - priority: 85
    category: business_constraint
    check: "a dispute may be appealed at most MAX_APPEALS (1) time; the second appeal of the same dispute is refused even though the dispute is again in a resolvable state"
    error_id: ERR_APPEAL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /assessment-disputes/{id}/proceedings with action APPEAL"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table  (api_prefix is "/", so every path below is absolute)
# -----------------------------------------------------------------------------
endpoints:

  # ---------- reads: District -------------------------------------------
  - method: GET
    path: "/districts"
    description: "Paginated list of tourism improvement districts, optionally narrowed by lifecycle status. Open to the public with no headers."
    roles: [PublicViewer, DistrictAdministrator, BoardMember, DmoLiaison, HearingOfficer, IndependentAuditor, LodgingOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: District[]
    side_effects: []

  - method: GET
    path: "/districts/{id}"
    description: "Single district including its computed assessable basis, collected-to-date total and transparency standing."
    roles: [PublicViewer, DistrictAdministrator, BoardMember, DmoLiaison, HearingOfficer, IndependentAuditor, LodgingOperator]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: GET
    path: "/districts/{id}/financial-summary"
    description: "Computed read published for transparency: reconciles billed, collected, delinquent and credit balances across every assessment period of the district. Values are derived on read from the statements themselves, never stored."
    roles: [PublicViewer, DistrictAdministrator, BoardMember, IndependentAuditor]
    code: 200
    input: ["fiscal_year?"]
    output: "{ district_id: string, fiscal_year: integer, billed_total_cents: integer, collected_to_date_cents: integer, delinquent_charges_cents: integer, outstanding_total_cents: integer, credit_total_cents: integer, statement_count: integer, delinquent_statement_count: integer, lodging_tax_match_committed_cents: integer }"
    side_effects: []

  - method: GET
    path: "/districts/{id}/lodging-businesses"
    description: "Lodging businesses on the district roll, optionally filtered by assessability status or boundary zone."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor, HearingOfficer]
    code: 200
    input: ["status?", "boundary_zone?", "limit?", "offset?"]
    output: LodgingBusiness[]
    side_effects: []

  - method: GET
    path: "/districts/{id}/petition-drives"
    description: "Formation and renewal petition drives of the district with their current support percentages."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor, PublicViewer]
    code: 200
    input: ["drive_type?", "status?"]
    output: PetitionDrive[]
    side_effects: []

  - method: GET
    path: "/districts/{id}/assessment-periods"
    description: "Assessment periods of the district in period_start ascending order."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssessmentPeriod[]
    side_effects: []

  - method: GET
    path: "/districts/{id}/annual-work-plans"
    description: "Annual budget and work plans of the district with their funding ratios."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor, DmoLiaison, PublicViewer]
    code: 200
    input: ["fiscal_year?", "status?"]
    output: AnnualWorkPlan[]
    side_effects: []

  - method: GET
    path: "/districts/{id}/transparency-records"
    description: "Public meeting notices, annual reports and financial audits of the district. Open to the public with no headers, since publication is the whole point of the record."
    roles: [PublicViewer, DistrictAdministrator, BoardMember, IndependentAuditor, LodgingOperator]
    code: 200
    input: ["record_type?", "status?", "fiscal_year?"]
    output: TransparencyRecord[]
    side_effects: []

  # ---------- reads: LodgingBusiness ------------------------------------
  - method: GET
    path: "/lodging-businesses/{id}"
    description: "Single lodging business with its delinquency strike count and compliance standing. A LodgingOperator may read only its own record."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor, HearingOfficer, LodgingOperator]
    code: 200
    input: []
    output: LodgingBusiness
    side_effects: []

  - method: GET
    path: "/lodging-businesses/{id}/petition-signatures"
    description: "Every petition signature this business has ever given, including withdrawn and disqualified ones."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor, LodgingOperator]
    code: 200
    input: ["status?"]
    output: PetitionSignature[]
    side_effects: []

  - method: GET
    path: "/lodging-businesses/{id}/assessment-statements"
    description: "Assessment statements issued to this business across all periods."
    roles: [DistrictAdministrator, IndependentAuditor, HearingOfficer, LodgingOperator]
    code: 200
    input: ["payment_status?", "filing_status?", "limit?", "offset?"]
    output: AssessmentStatement[]
    side_effects: []

  - method: GET
    path: "/lodging-businesses/{id}/room-night-claims"
    description: "Room-night claims this business has submitted against district marketing programs."
    roles: [DistrictAdministrator, DmoLiaison, IndependentAuditor, LodgingOperator]
    code: 200
    input: ["status?"]
    output: RoomNightClaim[]
    side_effects: []

  - method: GET
    path: "/lodging-businesses/{id}/disputes"
    description: "Assessment disputes raised by this business."
    roles: [DistrictAdministrator, HearingOfficer, IndependentAuditor, LodgingOperator]
    code: 200
    input: ["status?", "dispute_type?"]
    output: AssessmentDispute[]
    side_effects: []

  # ---------- reads: petitions ------------------------------------------
  - method: GET
    path: "/petition-drives/{id}"
    description: "Single petition drive with the snapshotted thresholds, both support percentages and the short_reason once tallied."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor, PublicViewer, LodgingOperator]
    code: 200
    input: []
    output: PetitionDrive
    side_effects: []

  - method: GET
    path: "/petition-drives/{id}/signatures"
    description: "Signatures collected by this drive with their weight basis and disqualification reason."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor]
    code: 200
    input: ["status?"]
    output: PetitionSignature[]
    side_effects: []

  - method: GET
    path: "/petition-signatures/{id}"
    description: "Single petition signature."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor, LodgingOperator]
    code: 200
    input: []
    output: PetitionSignature
    side_effects: []

  # ---------- reads: assessment -----------------------------------------
  - method: GET
    path: "/assessment-periods/{id}"
    description: "Single assessment period with statement count and billed/collected totals."
    roles: [DistrictAdministrator, BoardMember, IndependentAuditor]
    code: 200
    input: []
    output: AssessmentPeriod
    side_effects: []

  - method: GET
    path: "/assessment-periods/{id}/statements"
    description: "Statements of a period, filterable by owning business, filing status and payment status, in created_at ascending order."
    roles: [DistrictAdministrator, IndependentAuditor, HearingOfficer]
    code: 200
    input: ["lodging_business_id?", "filing_status?", "payment_status?", "limit?", "offset?"]
    output: AssessmentStatement[]
    side_effects: []

  - method: GET
    path: "/assessment-statements/{id}"
    description: "Single assessment statement with both assessment variants, the four money buckets, the delinquency stage and total_due_cents."
