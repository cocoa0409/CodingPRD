  - section: state_machines
    instances:
      - name: identify_discharge_package_walks_the_custody_dimension_forward
        claim_type: valid_transition
        grounds:
          - state_machines.Intake.custody_state.RECEIVED_to_IDENTIFIED
          - state_machines.Intake.custody_state.IDENTIFIED_to_DISCHARGED
          - state_machines.Intake.custody_state.DISCHARGED_to_PACKAGED
        distinguishing_aspect: "Each declared custody trigger moves the dimension exactly one step and applies its own field side effect (identified_chemistry, then soc_pct, then packaging_type) while version climbs 1 -> 2 -> 3 -> 4."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier, one NMC622 intake of net 100.0 kg."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { c2: "$.data.custody_state", chem: "$.data.identified_chemistry", v2: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 12.0 }
              as: PlantOperator
              captures: { c3: "$.data.custody_state", soc: "$.data.soc_pct", v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
              captures: { c4: "$.data.custody_state", pack: "$.data.packaging_type", v4: "$.data.version" }
          assert:
            - "${v1} == 1, ${v2} == 2, ${v3} == 3 and ${v4} == 4"
            - "${c2} == IDENTIFIED with ${chem} == NMC622"
            - "${c3} == DISCHARGED with ${soc} == 12.0"
            - "${c4} == PACKAGED with ${pack} == UN4G-STEEL-DRUM"
            - "Intake.${i_id}.compliance_state == MANIFEST_DRAFT throughout - the compliance dimension never moved"
            - "Intake.${i_id}.released_at == null and GET /recycling/settlements?intake_id=${i_id} reports total_count == 0"

      - name: package_above_soc_limit_rejected_then_accepted_after_second_discharge
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Intake.custody_state.DISCHARGED_to_PACKAGED
          - state_machines.Intake.custody_state.DISCHARGED_to_DISCHARGED
          - errors[ERR_SOC_ABOVE_PACKAGING_LIMIT]
          - validations[priority=9]
          - global_constants.SOC_PACKAGING_LIMIT_PCT
        distinguishing_aspect: "Packaging a pack read at 45.0% state of charge is refused with ERR_SOC_ABOVE_PACKAGING_LIMIT; the DISCHARGED self-loop overwrites soc_pct with exactly 30.0 and the same request then succeeds because the limit is an inclusive ceiling."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier, one IDENTIFIED NMC622 intake of net 100.0 kg."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
          trigger:
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 45.0 }
              as: PlantOperator
              captures: { soc1: "$.data.soc_pct", v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 30.0 }
              as: PlantOperator
              captures: { soc2: "$.data.soc_pct", cust2: "$.data.custody_state", v4: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
              captures: { cust3: "$.data.custody_state", v5: "$.data.version" }
          assert:
            - "The first discharge returns HTTP 200 with ${soc1} == 45.0 and ${v3} == 3"
            - "The first package attempt returns HTTP 422 with data.error_id == ERR_SOC_ABOVE_PACKAGING_LIMIT and leaves Intake.${i_id}.custody_state == DISCHARGED, packaging_type == null and version == ${v3}"
            - "The re-measurement returns HTTP 200 with ${soc2} == 30.0, ${cust2} == DISCHARGED (self-loop, not a forward move) and ${v4} == 4"
            - "The second package attempt returns HTTP 200 with ${cust3} == PACKAGED and ${v5} == 5 - soc_pct exactly 30.0 satisfies soc_pct <= SOC_PACKAGING_LIMIT_PCT"

      - name: release_before_manifest_closed_returns_invalid_compliance_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Intake.custody_state.PACKAGED_to_RELEASED
          - errors[ERR_INVALID_COMPLIANCE_STATE]
          - validations[priority=8]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "Release is guarded by the *other* state dimension: a PACKAGED intake whose compliance_state is still MANIFEST_DRAFT is refused with ERR_INVALID_COMPLIANCE_STATE and no settlement is cascade-created."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier, an NI index quote of 1600 c/kg effective 2026-07-01, and one NMC622 intake of net 100.0 kg walked to custody_state PACKAGED with compliance_state still MANIFEST_DRAFT."
