  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ship_state_error_precedes_lien_fiscal_error
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.ToolAsset.AWAITING_SHIPMENT_to_IN_TRANSIT
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a ship request on a job still
          IN_BUILD (tool IN_BUILD — state precondition failed) that ALSO exceeds
          the lien threshold (outstanding 10500000 > 1575000 — fiscal failed)
          MUST return ERR_INVALID_STATE (priority 7), never ERR_RETENTION_LIEN_BLOCK
          (priority 12).
        test_recipe:
          setup:
            - "CLASS_103 job BOOKED -> IN_BUILD (machine reserved); nothing paid; tool IN_BUILD"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Prio Co", contact_email: "pr@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-8001", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "GET /tool-assets"
              payload: {build_job_id: "${j1}"}
              as: Any
              captures: {t1: "$.data[0].id"}
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${j1}", machine_id: "CNC_1", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T16:00:00Z"}
              as: ProjectManager
            - call: "POST /build-jobs/${j1}/advance"
              payload: {target_state: "IN_BUILD"}
              as: ProjectManager
          trigger:
            - call: "POST /tool-assets/${t1}/ship"
              payload: {carrier: "OLD DOMINION", tracking_number: "TRK-X"}
              as: ProjectManager
              captures: {err1: $.data.error_id}
          assert:
            - "trigger returns http 409 with error_id == ERR_INVALID_STATE (state beats fiscal)"
            - "captured err1 == ERR_INVALID_STATE"
            - "captured err1 != ERR_RETENTION_LIEN_BLOCK"
            - "ToolAsset.${t1}.physical_status == IN_BUILD  # no side effects on rejection"

      - name: press_temporal_error_precedes_overlap_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - calculations.press_window_conflict_check
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: a press
          reservation whose window is internally invalid (end 12:00 <= start
          13:00) AND that overlaps an existing RESERVED window MUST return
          ERR_INVALID_TIME_WINDOW (priority 9), never ERR_PRESS_DOUBLE_BOOKED
          (priority 10) — a different category pair than the ship state-vs-fiscal
          conflict.
        test_recipe:
          setup:
            - "Customer + RELEASED design + ACCEPTED FIRM quote + job BOOKED"
            - "Existing PRESS_500T reservation 2026-08-10 10:00-14:00 RESERVED"
          setup_api_calls:
