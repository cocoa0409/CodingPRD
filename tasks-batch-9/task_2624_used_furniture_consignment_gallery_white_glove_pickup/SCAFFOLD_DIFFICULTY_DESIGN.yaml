      - name: election_deadline_p19_beats_disposition_eligibility_p30
        grounds:
          - validations[priority 19]
          - validations[priority 30]
          - errors.ERR_ELECTION_DEADLINE_PASSED
          - errors.ERR_DISPOSITION_NOT_ELIGIBLE
          - calculations.unsold_election_window
          - calculations.markdown_price
        conflicting_rules:
          higher: "priority 19, category business_temporal, ERR_ELECTION_DEADLINE_PASSED, 409 - the clock must be strictly before election_deadline_at"
          lower: "priority 30, category business_referential, ERR_DISPOSITION_NOT_ELIGIBLE, 422 - DONATE is refused for category ART"
        expected_error: ERR_ELECTION_DEADLINE_PASSED
        distinguishing_aspect: |
          A different category pair from the other instance (business_temporal vs
          business_referential) and a different status pair too: getting the order wrong
          changes the HTTP status from 409 to 422, not just the id. The clock is parked on
          exactly election_deadline_at, so only a strictly-before comparison fires; an
          implementation using <= would let the request through to the ART eligibility
          check and return the wrong error entirely.
