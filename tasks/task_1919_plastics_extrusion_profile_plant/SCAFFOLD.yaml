# =============================================================================
# Task 1919 — Plastics Extrusion & Profile Plant (custom profile extruder)
# Scaffold seed tables (§1.0–§1.7). Difficulty target: EXPERT+ (hard).
# =============================================================================

scenario: |
  1919. Plastics Extrusion & Profile Plant (custom profile extruder): die/profile tooling & line assignment, resin blend & colorant let-down ratio, line speed & dimensional SPC, regrind allowance & lot purity, cut-to-length & bundling, custom profile tooling amortization, resin index price pass-through, changeover purge scrap

domain_name: plastics-extrusion-profile-plant
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology with FK links)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer display name" }
      - { name: resin_index_basis, type: enum, source: input, description: "Pass-through index basis: MONTHLY_AVG | SHIPMENT_DATE" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted open exposure in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD", default: ACTIVE }
      - { name: open_exposure_cents, type: integer, source: computed, description: "Sum of estimated order value over WorkOrders with status IN {CONFIRMED, SCHEDULED, IN_PRODUCTION}; see calculation customer_open_exposure", default: 0 }

  - name: Profile
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: profile_code, type: string, source: input, description: "Unique profile cross-section code", constraints: "unique across Profile" }
      - { name: critical_dimensions, type: array, source: input, description: "Array of dimension spec objects {name, nominal_mm, tol_plus_mm, tol_minus_mm, ucl_mm, lcl_mm}; at least one required" }
      - { name: spc_subgroup_size, type: integer, source: input, description: "Number of measurements required per SPC sample" }
      - { name: sample_every_m, type: integer, source: input, description: "One SPC sample required per this many metres of good output" }
      - { name: resin_content_kg_per_m, type: number, source: input, description: "kg of resin per metre of profile; drives pass-through" }
      - { name: min_line_speed_mpm, type: number, source: input, description: "Minimum qualified line speed, metres/minute" }
      - { name: max_line_speed_mpm, type: number, source: input, description: "Maximum qualified line speed, metres/minute" }

  - name: Die
    parent: null
    common_fields: true
    fields:
      - { name: profile_id, type: string, source: input, description: "FK -> Profile.id; profile this die forms" }
      - { name: die_code, type: string, source: input, description: "Unique die tooling code", constraints: "unique across Die" }
      - { name: tooling_cost_cents, type: integer, source: input, description: "Total custom tooling cost to amortize, cents" }
      - { name: committed_length_m, type: number, source: input, description: "Customer-committed production metres at qualification" }
      - { name: committed_weight_kg, type: number, source: input, description: "Customer-committed production kg at qualification" }
      - { name: amortization_mode, type: enum, source: input, description: "PER_METER | PER_KG; locked once QUALIFIED" }
      - { name: buffer_hours, type: integer, source: input, description: "Minimum gap in hours between assignments using this die (cleaning/cooldown)" }
      - { name: min_screw_mm, type: number, source: input, description: "Minimum compatible extruder screw diameter, mm" }
      - { name: max_screw_mm, type: number, source: input, description: "Maximum compatible extruder screw diameter, mm" }
      - { name: amort_rate_cents_per_m, type: number, source: computed, description: "Pinned at QUALIFIED: round_half_up(tooling_cost_cents / committed_length_m, 4)" }
      - { name: amort_rate_cents_per_kg, type: number, source: computed, description: "Pinned at QUALIFIED: round_half_up(tooling_cost_cents / committed_weight_kg, 4)" }
      - { name: amortized_cents, type: integer, source: computed, description: "Cumulative amortization credited (runs + adjustments + invoice surcharge)", default: 0 }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "tooling_cost_cents - amortized_cents; invariant INV-AMORT", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | TRIAL | QUALIFIED | IN_SERVICE | MAINTENANCE | RETIRED", default: DRAFT }

  - name: ExtrusionLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line identifier", constraints: "unique across ExtrusionLine" }
      - { name: screw_diameter_mm, type: number, source: input, description: "Screw diameter, mm; drives purge factor tier and die compatibility" }
      - { name: status, type: enum, source: system, description: "IDLE | SETUP | RUNNING | DOWN", default: IDLE }

  - name: ResinLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_kind, type: enum, source: input, description: "VIRGIN | REGRIND | COLORANT" }
      - { name: resin_type, type: string, source: input, description: "Resin family code, e.g. PVC | ABS | PE; for COLORANT lots this is the carrier resin" }
      - { name: color_family, type: enum, source: input, description: "NATURAL | WHITE | YELLOW | RED | BLUE | GREEN | BROWN | BLACK; VIRGIN lots must be NATURAL" }
      - { name: received_kg, type: number, source: input, description: "Received quantity, kg" }
      - { name: supplier_lot_ref, type: string, source: input, description: "Supplier lot reference; 'INHOUSE-<run_id>' for system-created regrind", default: null, constraints: "optional" }
      - { name: consumed_kg, type: number, source: computed, description: "Sum of draws from non-quarantined BlendBatches (INV-MASS)", default: 0 }
      - { name: available_kg, type: number, source: computed, description: "received_kg - consumed_kg", default: 0 }
      - { name: status, type: enum, source: system, description: "RECEIVED | QC_PASSED | QC_REJECTED | DEPLETED", default: RECEIVED }

  - name: Formulation
    parent: null
    common_fields: true
    fields:
      - { name: profile_id, type: string, source: input, description: "FK -> Profile.id; profile this recipe serves" }
      - { name: formula_code, type: string, source: input, description: "Unique formulation code", constraints: "unique across Formulation" }
      - { name: base_resin_type, type: string, source: input, description: "Base resin family code, e.g. PVC" }
      - { name: color_family, type: enum, source: input, description: "NATURAL | WHITE | YELLOW | RED | BLUE | GREEN | BROWN | BLACK" }
      - { name: let_down_ratio, type: number, source: input, description: "Base-to-colorant ratio (e.g. 25.0 means 25:1); inclusive range [10.0, 50.0]" }
      - { name: max_regrind_pct, type: number, source: input, description: "Maximum regrind share of base material, percent; inclusive range [0, 40]" }

  - name: BlendBatch
    parent: null
    common_fields: true
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id; recipe used" }
      - { name: virgin_lot_id, type: string, source: input, description: "FK -> ResinLot.id; virgin resin lot drawn" }
      - { name: regrind_lot_id, type: string, source: input, description: "FK -> ResinLot.id; regrind lot drawn, or null", default: null, constraints: "optional" }
      - { name: colorant_lot_id, type: string, source: input, description: "FK -> ResinLot.id; colorant masterbatch lot drawn" }
      - { name: target_batch_kg, type: number, source: input, description: "Total batch size, kg" }
      - { name: colorant_kg, type: number, source: computed, description: "Colorant draw, kg (blend_composition)" }
      - { name: regrind_kg, type: number, source: computed, description: "Regrind draw, kg (blend_composition)" }
      - { name: virgin_kg, type: number, source: computed, description: "Virgin draw, kg (blend_composition)" }
      - { name: actual_regrind_pct, type: number, source: computed, description: "round_half_up(100 * regrind_kg / (virgin_kg + regrind_kg), 2)" }
      - { name: pre_quarantine_status, type: enum, source: system, description: "BLENDED | QC_RELEASED | CONSUMED — status captured on quarantine, restored on re-release", default: null }
      - { name: last_qc_user_id, type: string, source: system, description: "X-User-ID of the QualityInspector who performed the latest QC action (SoD anchor)", default: null }
      - { name: status, type: enum, source: system, description: "BLENDED | QC_RELEASED | CONSUMED | QUARANTINED", default: BLENDED }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: profile_id, type: string, source: input, description: "FK -> Profile.id; profile to extrude; must belong to customer_id" }
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id; recipe; must belong to profile_id" }
      - { name: die_id, type: string, source: input, description: "FK -> Die.id; tooling; must belong to profile_id" }
      - { name: ordered_length_m, type: number, source: input, description: "Ordered good length, metres" }
      - { name: cut_length_mm, type: integer, source: input, description: "Cut-to-length piece size, mm" }
      - { name: pieces_per_bundle, type: integer, source: input, description: "Full-bundle piece count" }
      - { name: base_unit_price_cents_per_m, type: number, source: input, description: "Quoted base price per metre before pass-through, cents" }
      - { name: quote_month, type: string, source: system, description: "YYYY-MM of logical clock at creation" }
      - { name: quote_index_cents_per_kg, type: number, source: system, description: "Resin index value of quote_month at creation" }
      - { name: pass_through_adj_cents_per_m, type: number, source: computed, description: "Current resin pass-through adjustment per metre (resin_price_pass_through)", default: 0 }
      - { name: current_unit_price_cents_per_m, type: number, source: computed, description: "base_unit_price_cents_per_m + pass_through_adj_cents_per_m" }
      - { name: produced_good_length_m, type: number, source: computed, description: "Sum of good_length_mm/1000 over COMPLETED ProductionRuns of this order's assignments", default: 0 }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | SCHEDULED | IN_PRODUCTION | CLOSED | CANCELLED", default: QUOTED }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | INVOICED — independent dimension from status", default: UNBILLED }
      - { name: billed_length_m, type: number, source: computed, description: "Metres billed at invoice", default: null }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Invoice total incl. tooling surcharge (closeout_invoice_total)", default: null }

  - name: LineAssignment
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; order being scheduled" }
      - { name: die_id, type: string, source: input, description: "FK -> Die.id; die committed to this window" }
      - { name: line_id, type: string, source: input, description: "FK -> ExtrusionLine.id; line committed to this window" }
      - { name: planned_start, type: datetime, source: input, description: "Planned window start, ISO8601 UTC" }
      - { name: planned_end, type: datetime, source: input, description: "Planned window end, ISO8601 UTC (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | CLOSED | CANCELLED", default: SCHEDULED }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> LineAssignment.id; assignment this run executes under" }
      - { name: batch_id, type: string, source: input, description: "FK -> BlendBatch.id; material batch consumed; formulation must match the assignment's work order" }
      - { name: line_speed_mpm, type: number, source: input, description: "Operating line speed, metres/minute; must lie within the profile's qualified window" }
      - { name: status, type: enum, source: system, description: "RUNNING | HOLD | COMPLETED", default: RUNNING }
      - { name: hold_origin, type: enum, source: system, description: "MANUAL | SYSTEM — set when entering HOLD", default: null }
      - { name: held_by_user_id, type: string, source: system, description: "X-User-ID that imposed a MANUAL hold (SoD anchor); null for SYSTEM holds", default: null }
      - { name: samples_posted, type: integer, source: computed, description: "Count of SPCSamples posted to this run", default: 0 }
      - { name: good_length_mm, type: integer, source: system, description: "Good output length, mm; set at complete", default: null }
      - { name: good_weight_kg, type: number, source: system, description: "Good output weight, kg; set at complete", default: null }
      - { name: trim_scrap_kg, type: number, source: system, description: "Regrindable in-process trim scrap, kg; set at complete", default: null }
      - { name: regrind_lot_id, type: string, source: system, description: "FK -> ResinLot.id; system-created REGRIND lot spawned from trim scrap at complete, null when trim_scrap_kg == 0", default: null }
      - { name: remnant_mm, type: integer, source: computed, description: "Uncut remainder: good_length_mm - pieces*cut_length_mm (bundle_cut_plan)", default: null }

  - name: SPCSample
    parent: null
    common_fields: false
    fields:
      - { name: run_id, type: string, source: input, description: "FK -> ProductionRun.id; run sampled" }
      - { name: dimension_name, type: string, source: input, description: "Must match a name in the profile's critical_dimensions" }
      - { name: measurements, type: array, source: input, description: "Array of numbers; length must equal profile.spc_subgroup_size" }
      - { name: xbar_mm, type: number, source: computed, description: "Subgroup mean, 4 decimal places round_half_up" }
      - { name: range_mm, type: number, source: computed, description: "max(measurements) - min(measurements)" }
      - { name: ooc, type: boolean, source: computed, description: "true iff xbar_mm > ucl_mm OR xbar_mm < lcl_mm (strict; exactly-on-limit is in control)" }
      - { name: spec_violations, type: integer, source: computed, description: "Count of individual measurements outside [nominal_mm - tol_minus_mm, nominal_mm + tol_plus_mm]" }

  - name: CutBundle
    parent: null
    common_fields: false
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> ProductionRun.id; run whose completion created this bundle" }
      - { name: bundle_seq, type: integer, source: system, description: "1-based sequence within the run; ascending in list responses" }
      - { name: pieces, type: integer, source: system, description: "Piece count in this bundle" }
      - { name: partial, type: boolean, source: system, description: "true iff pieces < work order's pieces_per_bundle" }
      - { name: total_length_mm, type: integer, source: computed, description: "pieces * cut_length_mm" }

  - name: PurgeEvent
    parent: null
    common_fields: false
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ExtrusionLine.id; line purged" }
      - { name: from_resin_type, type: string, source: input, description: "Resin family purged out" }
      - { name: to_resin_type, type: string, source: input, description: "Resin family purged in" }
      - { name: from_color_family, type: enum, source: input, description: "NATURAL | WHITE | YELLOW | RED | BLUE | GREEN | BROWN | BLACK" }
      - { name: to_color_family, type: enum, source: input, description: "NATURAL | WHITE | YELLOW | RED | BLUE | GREEN | BROWN | BLACK" }
      - { name: purge_grade, type: enum, source: input, description: "STANDARD | HIGH_EFFICIENCY" }
      - { name: transition_class, type: enum, source: computed, description: "SAME_RESIN_SAME_COLOR | SAME_RESIN_LIGHT_TO_DARK | SAME_RESIN_DARK_TO_LIGHT | RESIN_CHANGE (purge_scrap_estimate)" }
      - { name: scrap_kg, type: number, source: computed, description: "Purge scrap generated, kg (purge_scrap_estimate)" }

  - name: ResinIndexPoint
    parent: null
    common_fields: true
    fields:
      - { name: month, type: string, source: input, description: "Index month, YYYY-MM", constraints: "unique across ResinIndexPoint" }
      - { name: index_cents_per_kg, type: number, source: input, description: "Published resin index value, cents/kg" }

# =============================================================================
# §1.2 State Machine Table (8 machines; cyclic + two independent dimensions)
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /customers/{customer_id}/credit-status with action=HOLD"
        actor: PlantManager
        preconditions:
          - "Customer status is ACTIVE"
        side_effects:
          - "increments Customer.version by 1"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /customers/{customer_id}/credit-status with action=RELEASE"
        actor: PlantManager
        preconditions:
          - "Customer status is CREDIT_HOLD"
        side_effects:
          - "increments Customer.version by 1"

  - entity: Die
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: TRIAL
        trigger: "POST /dies/{die_id}/transition with to=TRIAL"
        actor: ProcessEngineer
        preconditions:
          - "Die status is DRAFT"
        side_effects:
          - "increments Die.version by 1"
      - from: TRIAL
        to: QUALIFIED
        trigger: "POST /dies/{die_id}/transition with to=QUALIFIED"
        actor: ProcessEngineer
        preconditions:
          - "Die status is TRIAL"
        side_effects:
          - "pins amort_rate_cents_per_m = round_half_up(tooling_cost_cents / committed_length_m, 4)"
          - "pins amort_rate_cents_per_kg = round_half_up(tooling_cost_cents / committed_weight_kg, 4)"
          - "increments Die.version by 1"
      - from: TRIAL
        to: DRAFT
        trigger: "POST /dies/{die_id}/transition with to=DRAFT (failed trial reverts to design)"
        actor: ProcessEngineer
        preconditions:
          - "Die status is TRIAL"
        side_effects:
          - "increments Die.version by 1"
      - from: QUALIFIED
        to: IN_SERVICE
        trigger: "system (first LineAssignment activation referencing this die)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Die.version by 1"
      - from: IN_SERVICE
        to: MAINTENANCE
        trigger: "POST /dies/{die_id}/transition with to=MAINTENANCE"
        actor: ProcessEngineer
        preconditions:
          - "Die status is IN_SERVICE"
          - "No LineAssignment referencing this die is in ACTIVE status"
        side_effects:
          - "increments Die.version by 1"
      - from: MAINTENANCE
        to: IN_SERVICE
        trigger: "POST /dies/{die_id}/transition with to=IN_SERVICE (return from maintenance; cycle)"
        actor: ProcessEngineer
        preconditions:
          - "Die status is MAINTENANCE"
        side_effects:
          - "increments Die.version by 1"
        note: "Cyclic edge IN_SERVICE <-> MAINTENANCE; amortization rates remain pinned"
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /dies/{die_id}/transition with to=RETIRED"
        actor: ProcessEngineer
        preconditions:
          - "Die status is IN_SERVICE"
          - "No LineAssignment referencing this die is in SCHEDULED or ACTIVE status"
        side_effects:
          - "increments Die.version by 1"
      - from: MAINTENANCE
        to: RETIRED
        trigger: "POST /dies/{die_id}/transition with to=RETIRED"
        actor: ProcessEngineer
        preconditions:
          - "Die status is MAINTENANCE"
          - "No LineAssignment referencing this die is in SCHEDULED or ACTIVE status"
        side_effects:
          - "increments Die.version by 1"

  - entity: ExtrusionLine
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: SETUP
        trigger: "system (POST /line-assignments/{assignment_id}/activate succeeds on this line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SETUP
        to: RUNNING
        trigger: "system (POST /runs succeeds against an ACTIVE assignment on this line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUNNING
        to: IDLE
        trigger: "system (POST /line-assignments/{assignment_id}/close succeeds on this line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUNNING
        to: DOWN
        trigger: "system (any ProductionRun on this line enters HOLD — SPC OOC sample, batch quarantine, or manual hold)"
        actor: system
        preconditions: []
        side_effects:
          - "Every LineAssignment on this line in SCHEDULED status -> CANCELLED (link 3 of hold cascade)"
          - "Each cancelled assignment's WorkOrder: if that order has no remaining SCHEDULED or ACTIVE assignments and no COMPLETED runs, WorkOrder SCHEDULED -> CONFIRMED"
      - from: DOWN
        to: RUNNING
        trigger: "system (held ProductionRun on this line released via POST /runs/{run_id}/hold-status RELEASE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SETUP
        to: IDLE
        trigger: "system (POST /line-assignments/{assignment_id}/cancel on the ACTIVE assignment before any run starts)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Cyclic core: SETUP -> RUNNING -> DOWN -> RUNNING; IDLE regained via close/cancel"

  - entity: ResinLot
    initial_state: RECEIVED
    terminal_states: [QC_REJECTED]
    transitions:
      - from: RECEIVED
        to: QC_PASSED
        trigger: "POST /resin-lots/{lot_id}/qc with outcome=PASS"
        actor: QualityInspector
        preconditions:
          - "ResinLot status is RECEIVED"
        side_effects:
          - "increments ResinLot.version by 1"
      - from: RECEIVED
        to: QC_REJECTED
        trigger: "POST /resin-lots/{lot_id}/qc with outcome=FAIL"
        actor: QualityInspector
        preconditions:
          - "ResinLot status is RECEIVED"
        side_effects:
          - "increments ResinLot.version by 1"
      - from: QC_PASSED
        to: QC_REJECTED
        trigger: "POST /resin-lots/{lot_id}/qc with outcome=REVERSE"
        actor: QualityInspector
        preconditions:
          - "ResinLot status is QC_PASSED"
        side_effects:
          - "Every BlendBatch in BLENDED or QC_RELEASED status referencing this lot as virgin_lot_id, regrind_lot_id, or colorant_lot_id -> QUARANTINED (pre_quarantine_status captured; drawn kg credited back to this and the batch's other lots)"
          - "increments ResinLot.version by 1"
      - from: QC_PASSED
        to: DEPLETED
        trigger: "system (available_kg reaches exactly 0 as a BlendBatch draw is applied)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ResinLot.version by 1"
      - from: DEPLETED
        to: QC_PASSED
        trigger: "system (a BlendBatch quarantine credit-back makes available_kg > 0 again)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ResinLot.version by 1"

  - entity: BlendBatch
    initial_state: BLENDED
    terminal_states: []
    note: "CONSUMED is absorbing once its consuming run is COMPLETED; before that, QC QUARANTINE can pull a CONSUMED batch back (pre_quarantine_status=CONSUMED)."
    transitions:
      - from: BLENDED
        to: QC_RELEASED
        trigger: "POST /blend-batches/{batch_id}/qc with action=RELEASE"
        actor: QualityInspector
        preconditions:
          - "BlendBatch status is BLENDED"
        side_effects:
          - "last_qc_user_id set to caller X-User-ID"
          - "increments BlendBatch.version by 1"
      - from: BLENDED
        to: QUARANTINED
        trigger: "POST /blend-batches/{batch_id}/qc with action=QUARANTINE, or system (resin lot QC REVERSE)"
        actor: "QualityInspector or system"
        preconditions:
          - "BlendBatch status is BLENDED"
        side_effects:
          - "pre_quarantine_status set to BLENDED"
          - "drawn kg credited back: virgin_lot.consumed_kg -= virgin_kg; regrind_lot.consumed_kg -= regrind_kg (if present); colorant_lot.consumed_kg -= colorant_kg (INV-MASS compensation)"
          - "last_qc_user_id set to caller X-User-ID when actor is QualityInspector"
          - "increments BlendBatch.version by 1"
      - from: QC_RELEASED
        to: QUARANTINED
        trigger: "POST /blend-batches/{batch_id}/qc with action=QUARANTINE, or system (resin lot QC REVERSE)"
        actor: "QualityInspector or system"
        preconditions:
          - "BlendBatch status is QC_RELEASED"
        side_effects:
          - "pre_quarantine_status set to QC_RELEASED"
          - "drawn kg credited back to component lots (INV-MASS compensation)"
          - "last_qc_user_id set to caller X-User-ID when actor is QualityInspector"
          - "increments BlendBatch.version by 1"
      - from: CONSUMED
        to: QUARANTINED
        trigger: "POST /blend-batches/{batch_id}/qc with action=QUARANTINE"
        actor: QualityInspector
        preconditions:
          - "BlendBatch status is CONSUMED"
          - "The ProductionRun with batch_id == this batch is in RUNNING or HOLD status"
        side_effects:
          - "pre_quarantine_status set to CONSUMED (no lot credit-back: material already consumed)"
          - "last_qc_user_id set to caller X-User-ID"
          - "The consuming ProductionRun, if RUNNING -> HOLD (hold_origin=SYSTEM) — link 2 of batch-quarantine cascade"
          - "That run's ExtrusionLine RUNNING -> DOWN — link 3"
          - "Every LineAssignment on that line in SCHEDULED status -> CANCELLED, with WorkOrder SCHEDULED -> CONFIRMED revert where the order has no remaining SCHEDULED or ACTIVE assignments and no COMPLETED runs — link 4"
          - "increments BlendBatch.version by 1"
      - from: QUARANTINED
        to: QC_RELEASED
        trigger: "POST /blend-batches/{batch_id}/qc with action=RE_RELEASE"
        actor: QualityInspector
        preconditions:
          - "BlendBatch status is QUARANTINED"
          - "pre_quarantine_status is BLENDED or QC_RELEASED"
          - "SoD: caller X-User-ID != last_qc_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "status set to pre_quarantine_status (BLENDED or QC_RELEASED); pre_quarantine_status cleared"
          - "drawn kg re-applied to component lots (INV-MASS forward action)"
          - "last_qc_user_id set to caller X-User-ID"
          - "increments BlendBatch.version by 1"
      - from: QUARANTINED
        to: CONSUMED
        trigger: "POST /blend-batches/{batch_id}/qc with action=RE_RELEASE"
        actor: QualityInspector
        preconditions:
          - "BlendBatch status is QUARANTINED"
          - "pre_quarantine_status is CONSUMED"
          - "SoD: caller X-User-ID != last_qc_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "status set to CONSUMED; pre_quarantine_status cleared (no lot re-draw)"
          - "last_qc_user_id set to caller X-User-ID"
          - "increments BlendBatch.version by 1"
      - from: QC_RELEASED
        to: CONSUMED
        trigger: "system (POST /runs succeeds with batch_id == this batch)"
        actor: system
        preconditions: []
        side_effects:
          - "increments BlendBatch.version by 1"

  - entity: WorkOrder
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED]
    note: "Two independent status dimensions evolve on one row: production `status` (this machine) and `billing_status` (UNBILLED -> INVOICED, next block). status CLOSED is terminal for production while billing may still advance."
    transitions:
      - from: QUOTED
        to: QUOTED
        trigger: "POST /work-orders/{work_order_id}/reprice (recalculates pass-through at current clock month; OCC-guarded)"
        actor: SalesEngineer
        preconditions:
          - "WorkOrder status is QUOTED"
        side_effects:
          - "pass_through_adj_cents_per_m and current_unit_price_cents_per_m recomputed per resin_price_pass_through"
          - "increments WorkOrder.version by 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /work-orders/{work_order_id}/confirm"
        actor: SalesEngineer
        preconditions:
          - "WorkOrder status is QUOTED"
          - "Customer status is ACTIVE (cross-entity gate; ERR_CUSTOMER_CREDIT_HOLD)"
          - "customer_open_exposure check passes (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "pass_through_adj_cents_per_m recomputed at current clock month"
          - "Customer.open_exposure_cents recomputed (this order now included)"
          - "increments WorkOrder.version by 1"
      - from: CONFIRMED
        to: QUOTED
        trigger: "POST /work-orders/{work_order_id}/reprice (re-opens the quote; revision loop)"
        actor: SalesEngineer
        preconditions:
          - "WorkOrder status is CONFIRMED"
        side_effects:
          - "pass_through_adj_cents_per_m and current_unit_price_cents_per_m recomputed"
          - "Customer.open_exposure_cents recomputed (this order now excluded)"
          - "increments WorkOrder.version by 1"
        note: "Cyclic edge QUOTED <-> CONFIRMED via reprice"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "system (first LineAssignment created for this order)"
        actor: system
        preconditions: []
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "system (all of this order's LineAssignments CANCELLED and no COMPLETED runs exist)"
        actor: system
        preconditions: []
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "system (first ProductionRun created under one of this order's assignments)"
        actor: system
        preconditions: []
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: IN_PRODUCTION
        to: CLOSED
        trigger: "system (produced_good_length_m >= ordered_length_m after a run completion; bubble-up)"
        actor: system
        preconditions: []
        side_effects:
          - "Customer.open_exposure_cents recomputed (this order leaves the exposure set)"
          - "increments WorkOrder.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /work-orders/{work_order_id}/cancel"
        actor: SalesEngineer
        preconditions:
          - "No ProductionRun under this order's assignments is RUNNING or HOLD (ERR_RUN_IN_PROGRESS)"
        side_effects:
          - "This order's LineAssignments in SCHEDULED or ACTIVE -> CANCELLED"
          - "Any line left in SETUP by a cancelled ACTIVE assignment -> IDLE"
          - "Customer.open_exposure_cents recomputed"
          - "increments WorkOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /work-orders/{work_order_id}/cancel"
        actor: SalesEngineer
        preconditions:
          - "No ProductionRun under this order's assignments is RUNNING or HOLD (ERR_RUN_IN_PROGRESS)"
        side_effects:
          - "Same cancellation side effects as QUOTED -> CANCELLED"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{work_order_id}/cancel"
        actor: SalesEngineer
        preconditions:
          - "No ProductionRun under this order's assignments is RUNNING or HOLD (ERR_RUN_IN_PROGRESS)"
        side_effects:
          - "Same cancellation side effects as QUOTED -> CANCELLED"
          - "increments WorkOrder.version by 1"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /work-orders/{work_order_id}/cancel"
        actor: SalesEngineer
        preconditions:
          - "No ProductionRun under this order's assignments is RUNNING or HOLD (ERR_RUN_IN_PROGRESS)"
        side_effects:
          - "Same cancellation side effects as QUOTED -> CANCELLED"
          - "increments WorkOrder.version by 1"

  - entity: WorkOrderBilling
    note: "Second independent status dimension of WorkOrder (billing_status). Evolves independently of production status."
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [INVOICED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /work-orders/{work_order_id}/invoice"
        actor: PlantManager
        preconditions:
          - "WorkOrder status is CLOSED (production dimension)"
          - "billing_status is UNBILLED"
        side_effects:
          - "closeout_invoice_total computed; invoice_total_cents and billed_length_m set"
          - "tooling surcharge credited to the Die: amortized_cents += tooling_surcharge_cents; remaining_balance_cents -= tooling_surcharge_cents (INV-AMORT preserved)"
          - "increments WorkOrder.version by 1"

  - entity: LineAssignment
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /line-assignments/{assignment_id}/activate"
        actor: ProcessEngineer
        preconditions:
          - "LineAssignment status is SCHEDULED"
          - "ExtrusionLine status is IDLE (ERR_LINE_NOT_IDLE)"
          - "Die status is QUALIFIED or IN_SERVICE (ERR_DIE_NOT_RUNNABLE)"
          - "die.min_screw_mm <= line.screw_diameter_mm <= die.max_screw_mm (ERR_LINE_INCOMPATIBLE_DIE)"
          - "Purge gate: if the reference prior assignment exists (same line, status CLOSED, latest planned_end among CLOSED assignments with planned_end <= this.planned_start; tie-break: later created_at) and its work order's formulation differs in base_resin_type or color_family from this order's formulation, a PurgeEvent must exist on this line with from_* equal to the prior formulation's (base_resin_type, color_family), to_* equal to this formulation's, and created_at >= the prior assignment's updated_at (ERR_PURGE_REQUIRED)"
        side_effects:
          - "ExtrusionLine IDLE -> SETUP"
          - "Die QUALIFIED -> IN_SERVICE if currently QUALIFIED"
          - "increments LineAssignment.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /line-assignments/{assignment_id}/close"
        actor: ProcessEngineer
        preconditions:
          - "LineAssignment status is ACTIVE"
          - "No ProductionRun under this assignment is RUNNING or HOLD (ERR_RUN_IN_PROGRESS)"
        side_effects:
          - "ExtrusionLine RUNNING -> IDLE"
          - "WorkOrder close check: produced_good_length_m >= ordered_length_m implies IN_PRODUCTION -> CLOSED"
          - "increments LineAssignment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /line-assignments/{assignment_id}/cancel, or system (line goes DOWN), or system (work order cancelled)"
        actor: "ProcessEngineer or system"
        preconditions: []
        side_effects:
          - "WorkOrder revert check: SCHEDULED -> CONFIRMED when no remaining SCHEDULED or ACTIVE assignments and no COMPLETED runs"
          - "increments LineAssignment.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /line-assignments/{assignment_id}/cancel, or system (work order cancelled)"
        actor: "ProcessEngineer or system"
        preconditions:
          - "No ProductionRun under this assignment is RUNNING or HOLD (ERR_RUN_IN_PROGRESS)"
        side_effects:
          - "ExtrusionLine SETUP -> IDLE if this assignment left the line in SETUP"
          - "WorkOrder revert check as in SCHEDULED -> CANCELLED"
          - "increments LineAssignment.version by 1"

  - entity: ProductionRun
    initial_state: RUNNING
    terminal_states: [COMPLETED]
    transitions:
      - from: RUNNING
        to: HOLD
        trigger: "POST /runs/{run_id}/hold-status with action=HOLD, or system (SPC OOC sample, batch quarantine cascade)"
        actor: "QualityInspector or system"
        preconditions:
          - "ProductionRun status is RUNNING"
        side_effects:
          - "hold_origin set: MANUAL (inspector action, held_by_user_id = caller X-User-ID) or SYSTEM (cascade)"
          - "ExtrusionLine RUNNING -> DOWN — link 2 of hold cascade"
          - "Every LineAssignment on that line in SCHEDULED status -> CANCELLED, with WorkOrder SCHEDULED -> CONFIRMED revert where applicable — link 3"
          - "increments ProductionRun.version by 1"
      - from: HOLD
        to: RUNNING
        trigger: "POST /runs/{run_id}/hold-status with action=RELEASE"
        actor: QualityInspector
        preconditions:
          - "ProductionRun status is HOLD"
          - "SoD: if hold_origin is MANUAL, caller X-User-ID != held_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "ExtrusionLine DOWN -> RUNNING"
          - "hold_origin and held_by_user_id cleared"
          - "increments ProductionRun.version by 1"
        note: "Cyclic edge RUNNING <-> HOLD"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /runs/{run_id}/complete"
        actor: LineOperator
        preconditions:
          - "ProductionRun status is RUNNING"
          - "SPC quota: samples_posted >= floor((good_length_mm/1000) / profile.sample_every_m) (ERR_SPC_SAMPLE_QUOTA)"
        side_effects:
          - "good_length_mm, good_weight_kg, trim_scrap_kg recorded; remnant_mm computed (bundle_cut_plan)"
          - "CutBundle rows created per bundle_cut_plan (floor nested: pieces then bundles)"
          - "If trim_scrap_kg > 0: system creates a ResinLot (lot_kind=REGRIND, resin_type and color_family from the work order's formulation, received_kg=trim_scrap_kg, supplier_lot_ref='INHOUSE-<run_id>', status=QC_PASSED)"
          - "tooling_amortization_credit applied to the Die (mode-selected rate; remaining_balance_cents floored at 0 via min())"
          - "WorkOrder.produced_good_length_m += good_length_mm/1000; close check (IN_PRODUCTION -> CLOSED if >= ordered_length_m)"
          - "Customer.open_exposure_cents recomputed if the order closed"
          - "increments ProductionRun.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only; all sequential-safe)
# =============================================================================
concurrency_rules:
  - rule_id: reprice-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{work_order_id}/reprice"
    occ_field: "expected_work_order_version"
    description: |
      Repricing a WorkOrder whose version has advanced since the client last
      observed it is rejected. Reprice is legitimately repeatable from QUOTED
      (recalculate) and CONFIRMED (revert to QUOTED), so state alone never
      rejects a second sequential reprice; only the stale-version check does.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: amort-adjust-stale-die
    parent_entity: Die
    write_endpoint: "POST /dies/{die_id}/amortization-adjustments"
    occ_field: "expected_die_version"
    description: |
      Posting a manual amortization adjustment against a Die whose version has
      advanced since the client last observed it is rejected. Adjustments do
      not change Die.status and remain legitimate from QUALIFIED, IN_SERVICE,
      and MAINTENANCE, so a second sequential adjustment is state-valid; only
      the stale-version check rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: restate-stale-index-point
    parent_entity: ResinIndexPoint
    write_endpoint: "POST /resin-index-points/{month}/restate"
    occ_field: "expected_index_point_version"
    description: |
      Restating a ResinIndexPoint whose version has advanced since the client
      last observed it is rejected. Restatement is always legitimate while the
      point exists, so state alone never rejects a second sequential restate;
      only the stale-version check does.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (8 rules)
# =============================================================================
calculations:
  - name: blend_composition
    trigger: "POST /blend-batches (at batch creation, before lot draws are applied)"
    algorithm: constraint_propagation
    formula: |
      Inputs: target_batch_kg T, formulation.let_down_ratio LDR,
              formulation.max_regrind_pct MAXP, regrind lot available_kg RAVAIL
              (0 when regrind_lot_id is null).
      Rounding order is pinned — do NOT reorder:
      1. colorant_kg = round_half_up(T / (1 + LDR), 1)            # rounded FIRST, 0.1 kg
      2. base_total_kg = T - colorant_kg                          # exact remainder
      3. regrind_request_kg = round_half_up(base_total_kg * MAXP / 100, 1)
      4. regrind_kg = min(regrind_request_kg, RAVAIL)             # availability cap absorbs shortfall
      5. virgin_kg = base_total_kg - regrind_kg                   # remainder, NOT re-rounded
      6. actual_regrind_pct = round_half_up(100 * regrind_kg / base_total_kg, 2)
      Availability gate (after composition): virgin_lot.available_kg >= virgin_kg AND
      colorant_lot.available_kg >= colorant_kg else ERR_INSUFFICIENT_LOT_QUANTITY.
    input_set: "BlendBatch being created plus its three referenced ResinLots (any status filter: lots must be QC_PASSED per validation)"
    precision: "component kg to 0.1 kg, round_half_up; percent to 2 decimals, round_half_up"
    variants:
      - name: regrind_absent
        when: "regrind_lot_id is null"
        difference: "regrind_kg = 0; virgin_kg = base_total_kg"
  - name: purge_scrap_estimate
    trigger: "POST /purge-events (at event creation)"
    algorithm: tiered_pricing
    formula: |
      1. transition_class:
         if from_resin_type != to_resin_type -> RESIN_CHANGE
         elif from_color_family == to_color_family -> SAME_RESIN_SAME_COLOR
         elif COLOR_RANK[to_color_family] > COLOR_RANK[from_color_family] -> SAME_RESIN_LIGHT_TO_DARK
         else -> SAME_RESIN_DARK_TO_LIGHT
      2. base_kg = PURGE_BASE_KG[transition_class]
      3. screw_factor: line.screw_diameter_mm <= 45 -> 1.0; 46..90 inclusive -> 1.6; > 90 -> 2.2
      4. grade_mult = GRADE_MULT[purge_grade]
      5. scrap_kg = round_half_up(base_kg * screw_factor * grade_mult, 2)
      Non-linear: 4-way class branch x 3 screw tiers x 2 grades.
    input_set: "the PurgeEvent inputs plus ExtrusionLine.screw_diameter_mm"
    constants:
      PURGE_BASE_KG_SAME_RESIN_SAME_COLOR: 2.0
      PURGE_BASE_KG_SAME_RESIN_LIGHT_TO_DARK: 4.0
      PURGE_BASE_KG_SAME_RESIN_DARK_TO_LIGHT: 8.0
      PURGE_BASE_KG_RESIN_CHANGE: 12.0
      SCREW_FACTOR_TIER1_MAX_MM: 45
      SCREW_FACTOR_TIER2_MAX_MM: 90
      SCREW_FACTOR_TIER1: 1.0
      SCREW_FACTOR_TIER2: 1.6
      SCREW_FACTOR_TIER3: 2.2
      GRADE_MULT_STANDARD: 1.0
      GRADE_MULT_HIGH_EFFICIENCY: 0.7
      COLOR_RANK: { NATURAL: 0, WHITE: 1, YELLOW: 2, RED: 3, BLUE: 4, GREEN: 5, BROWN: 6, BLACK: 7 }
    precision: "2 decimal places, round_half_up"
  - name: bundle_cut_plan
    trigger: "POST /runs/{run_id}/complete (after good_length_mm is recorded)"
    algorithm: aggregation
    formula: |
      Nested floor order is pinned — floor per piece FIRST, then per bundle:
      1. pieces = floor(good_length_mm / work_order.cut_length_mm)
      2. full_bundles = floor(pieces / work_order.pieces_per_bundle)
      3. loose_pieces = pieces - full_bundles * work_order.pieces_per_bundle
      4. remnant_mm = good_length_mm - pieces * work_order.cut_length_mm
      CutBundle rows created: bundle_seq 1..full_bundles with pieces=pieces_per_bundle,
      partial=false; plus one row bundle_seq=full_bundles+1 with pieces=loose_pieces,
      partial=true iff loose_pieces > 0. total_length_mm = pieces * cut_length_mm per row.
    input_set: "the completing ProductionRun and its WorkOrder"
    precision: "integer arithmetic (floor)"
  - name: tooling_amortization_credit
    trigger: "POST /runs/{run_id}/complete (credit); POST /dies/{die_id}/amortization-adjustments (manual adjustment); POST /work-orders/{work_order_id}/invoice (tooling surcharge credit)"
    algorithm: threshold
    formula: |
      At run completion, credit_cents depends on die.amortization_mode:
        PER_METER: raw = round_half_up((good_length_mm / 1000) * die.amort_rate_cents_per_m, 0)
        PER_KG:    raw = round_half_up(good_weight_kg * die.amort_rate_cents_per_kg, 0)
      credit_cents = min(die.remaining_balance_cents, raw)   # cap at remaining balance
      Apply: die.amortized_cents += credit_cents; die.remaining_balance_cents -= credit_cents.
      Rates were pinned at QUALIFIED:
        amort_rate_cents_per_m  = round_half_up(tooling_cost_cents / committed_length_m, 4)
        amort_rate_cents_per_kg = round_half_up(tooling_cost_cents / committed_weight_kg, 4)
      Manual adjustment of A cents: amortized_cents += A; remaining_balance_cents -= A;
      rejected with ERR_BAD_REQUEST unless 0 <= amortized_cents + A ... i.e. both resulting
      fields must stay within [0, tooling_cost_cents].
      INVARIANT INV-AMORT: amortized_cents + remaining_balance_cents == tooling_cost_cents
      after every credit, adjustment, and surcharge.
    input_set: "the completing ProductionRun (or adjustment/invoice request) and the Die"
    precision: "rates 4 decimals round_half_up; credit/adjustment integer cents round_half_up"
    variants:
      - name: per_meter
        when: "die.amortization_mode == PER_METER"
        difference: "credit scales with good metres run: good_length_mm/1000 * amort_rate_cents_per_m"
      - name: per_kg
        when: "die.amortization_mode == PER_KG"
        difference: "credit scales with good weight run: good_weight_kg * amort_rate_cents_per_kg; identical run data yields a different credit when kg-per-metre deviates from committed ratios"
  - name: resin_price_pass_through
    trigger: "POST /work-orders (adj=0 snapshot), POST /work-orders/{id}/confirm, POST /work-orders/{id}/reprice, POST /resin-index-points/{month}/restate (cascade recompute), POST /work-orders/{id}/invoice"
    algorithm: forward_looking
    formula: |
      quote_index_cents_per_kg = ResinIndexPoint.value of WorkOrder.quote_month (snapshot at creation).
      basis_index depends on customer.resin_index_basis (dual variant):
        MONTHLY_AVG:   arithmetic mean of the current index_cents_per_kg of every
                       ResinIndexPoint whose month M satisfies quote_month <= M <= current
                       clock month (inclusive both ends); mean rounded 2 decimals round_half_up.
                       Any month in the range without a point -> ERR_RESIN_INDEX_MISSING.
        SHIPMENT_DATE: index_cents_per_kg of the point whose month == current clock month;
                       missing -> ERR_RESIN_INDEX_MISSING.
      pass_through_adj_cents_per_m =
        round_half_up((basis_index - quote_index_cents_per_kg)
                      * profile.resin_content_kg_per_m * PASS_THROUGH_FACTOR, 2)
      current_unit_price_cents_per_m = base_unit_price_cents_per_m + pass_through_adj_cents_per_m
      Restate cascade: recompute on every WorkOrder with billing_status == UNBILLED and
      status != CANCELLED whose basis references the restated month (MONTHLY_AVG: month
      inside [quote_month, current month]; SHIPMENT_DATE: month == current month); then
      recompute each affected Customer.open_exposure_cents.
    input_set: "the WorkOrder, its Customer and Profile, and ResinIndexPoints in the basis window"
    constants:
      PASS_THROUGH_FACTOR: 0.85
    precision: "adj per metre 2 decimals round_half_up; basis mean 2 decimals round_half_up"
    variants:
      - name: monthly_avg
        when: "customer.resin_index_basis == MONTHLY_AVG"
        difference: "basis is the mean of monthly index points from quote_month through the current clock month inclusive"
      - name: shipment_date
        when: "customer.resin_index_basis == SHIPMENT_DATE"
        difference: "basis is the single index point of the current clock month; diverges from monthly_avg whenever the index trends within the window"
  - name: spc_control_evaluation
    trigger: "POST /spc-samples (at sample creation)"
    algorithm: threshold
    formula: |
      For the profile dimension spec d where d.name == dimension_name:
      xbar_mm = round_half_up(mean(measurements), 4)
      range_mm = round_half_up(max(measurements) - min(measurements), 4)
      ooc = (xbar_mm > d.ucl_mm) OR (xbar_mm < d.lcl_mm)     # STRICT: xbar == ucl is IN control
      spec_violations = count of measurements m with
        m < d.nominal_mm - d.tol_minus_mm OR m > d.nominal_mm + d.tol_plus_mm
        (individual-spec check, inclusive bounds: m exactly at a spec limit does NOT violate)
      If ooc: hold cascade link 1 fires (run RUNNING -> HOLD, hold_origin=SYSTEM).
    input_set: "the new SPCSample, its ProductionRun, and the Profile critical_dimensions entry"
    precision: "xbar and range 4 decimals round_half_up"
  - name: closeout_invoice_total
    trigger: "POST /work-orders/{work_order_id}/invoice"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned — the tooling surcharge depends on fields that the
      earlier steps settle (circular-looking dependency, resolved by ordering):
      1. billed_length_m = sum of good_length_mm/1000 over all COMPLETED ProductionRuns
         of this order's assignments (any assignment status).
      2. Recompute pass-through at the current clock month (resin_price_pass_through);
         final_unit_price_cents_per_m = base_unit_price_cents_per_m + adj.
      3. product_charges_cents = round_half_up(billed_length_m * final_unit_price_cents_per_m, 0)
      4. tooling_surcharge_cents = min(die.remaining_balance_cents,
                                       round_half_up(TOOLING_SURCHARGE_PCT * product_charges_cents, 0))
         # die.remaining_balance_cents was settled by run-completion credits in step-0 history
      5. invoice_total_cents = product_charges_cents + tooling_surcharge_cents
      6. Apply surcharge to die: amortized_cents += tooling_surcharge_cents;
         remaining_balance_cents -= tooling_surcharge_cents (INV-AMORT preserved).
    input_set: "the WorkOrder (must be CLOSED, UNBILLED), its COMPLETED runs, its Die, index points in basis window"
    constants:
      TOOLING_SURCHARGE_PCT: 0.10
    precision: "integer cents, round_half_up"
  - name: customer_open_exposure
    trigger: "WorkOrder confirm / reprice / cancel / close / system status changes; index restate cascade"
    algorithm: aggregation
    formula: |
      open_exposure_cents = sum over WorkOrders of this customer with
        status IN {CONFIRMED, SCHEDULED, IN_PRODUCTION} of
        round_half_up(ordered_length_m * current_unit_price_cents_per_m, 0)
      (QUOTED, CLOSED, CANCELLED, and INVOICED orders are excluded.)
      Credit gate at confirm: candidate_exposure = open_exposure_cents +
        round_half_up(this.ordered_length_m * this.current_unit_price_cents_per_m, 0);
      rejected with ERR_CREDIT_LIMIT_EXCEEDED iff candidate_exposure > credit_limit_cents
      (equality is ALLOWED: candidate == credit_limit passes).
    input_set: "all WorkOrders of the customer with status IN {CONFIRMED, SCHEDULED, IN_PRODUCTION}"
    precision: "integer cents, round_half_up per order then summed"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role must be in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids must exist, validated left-to-right (path first, then body fields in input declaration order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-orders/{work_order_id}/reprice; POST /dies/{die_id}/amortization-adjustments; POST /resin-index-points/{month}/restate"
  - priority: 5
    category: auth
    check: "Segregation of duties: run hold RELEASE caller != held_by_user_id when hold_origin=MANUAL; batch RE_RELEASE caller != last_qc_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /runs/{run_id}/hold-status; POST /blend-batches/{batch_id}/qc"
  - priority: 6
    category: state
    check: "Target resource must be in a valid from-state for the requested transition (incl. die QUALIFIED/IN_SERVICE/MAINTENANCE for amortization adjustments; run RUNNING for complete and samples; batch CONSUMED quarantine only while its run is RUNNING/HOLD)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 7
    category: state
    check: "Cross-entity state gates: customer ACTIVE for confirm; line IDLE for activate; die QUALIFIED/IN_SERVICE for activate; all referenced lots QC_PASSED for blend creation; batch QC_RELEASED for run creation; no RUNNING/HOLD runs for cancel/close"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /work-orders/{work_order_id}/confirm (customer gate)"
  - priority: 8
    category: state
    check: "ExtrusionLine must be IDLE to activate an assignment"
    error_id: ERR_LINE_NOT_IDLE
    http_status: 409
    applies_to: "POST /line-assignments/{assignment_id}/activate"
  - priority: 9
    category: state
    check: "Die must be QUALIFIED or IN_SERVICE to activate an assignment"
    error_id: ERR_DIE_NOT_RUNNABLE
    http_status: 409
    applies_to: "POST /line-assignments/{assignment_id}/activate"
  - priority: 10
    category: state
    check: "Every referenced ResinLot must be QC_PASSED when creating a BlendBatch; the referenced BlendBatch must be QC_RELEASED when creating a ProductionRun"
    error_id: ERR_MATERIAL_NOT_RELEASED
    http_status: 409
    applies_to: "POST /blend-batches; POST /runs"
  - priority: 11
    category: state
    check: "No ProductionRun under the scope may be RUNNING or HOLD when cancelling a work order / assignment or closing an assignment"
    error_id: ERR_RUN_IN_PROGRESS
    http_status: 409
    applies_to: "POST /work-orders/{work_order_id}/cancel; POST /line-assignments/{assignment_id}/cancel; POST /line-assignments/{assignment_id}/close"
  - priority: 12
    category: business_safety
    check: "Regrind purity: regrind lot must have lot_kind=REGRIND, resin_type == formulation.base_resin_type, color_family == formulation.color_family"
    error_id: ERR_REGRIND_PURITY_VIOLATION
    http_status: 422
    applies_to: "POST /blend-batches"
  - priority: 13
    category: business_safety
    check: "SPC quota: samples_posted >= floor((good_length_mm/1000) / profile.sample_every_m) at completion"
    error_id: ERR_SPC_SAMPLE_QUOTA
    http_status: 422
    applies_to: "POST /runs/{run_id}/complete"
  - priority: 14
    category: business_constraint
    check: "Domain constraint rules: let_down_ratio within [10.0, 50.0]; max_regrind_pct within [0, 40]; VIRGIN lots color_family NATURAL; line speed within profile window; line schedule half-open overlap; die buffer gap; screw compatibility; purge gate; lot compatibility; subgroup size; dimension name known; index month uniqueness"
    error_id: ERR_LET_DOWN_RANGE
    http_status: 400
    applies_to: "POST /formulations (let_down_ratio outside [10.0, 50.0] or max_regrind_pct outside [0, 40])"
  - priority: 15
    category: business_constraint
    check: "VIRGIN ResinLot must have color_family NATURAL"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "POST /resin-lots"
  - priority: 16
    category: business_constraint
    check: "line_speed_mpm must satisfy profile.min_line_speed_mpm <= line_speed_mpm <= profile.max_line_speed_mpm"
    error_id: ERR_LINE_SPEED_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /runs"
  - priority: 17
    category: business_constraint
    check: "Line schedule overlap (HALF-OPEN [planned_start, planned_end)): reject iff another assignment on the same line with status IN {SCHEDULED, ACTIVE} satisfies planned_start < other.planned_end AND planned_end > other.planned_start; touching windows (end == start) are allowed"
    error_id: ERR_LINE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /line-assignments"
  - priority: 18
    category: business_constraint
    check: "Die buffer (BUFFER semantics): reject iff another assignment on the same die with status IN {SCHEDULED, ACTIVE} has gap < die.buffer_hours, where gap = max(0, planned_start - other.planned_end) or max(0, other.planned_start - planned_end) for windows on either side; zero-overlap adjacency with gap < buffer_hours is still rejected"
    error_id: ERR_DIE_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /line-assignments"
  - priority: 19
    category: business_constraint
    check: "Die/line screw compatibility: die.min_screw_mm <= line.screw_diameter_mm <= die.max_screw_mm"
    error_id: ERR_LINE_INCOMPATIBLE_DIE
    http_status: 409
    applies_to: "POST /line-assignments/{assignment_id}/activate"
  - priority: 20
    category: business_constraint
    check: "Purge gate: prior CLOSED assignment on the same line (latest planned_end <= this.planned_start; tie-break later created_at) with differing formulation resin/color requires a matching PurgeEvent created_at >= prior assignment's updated_at"
    error_id: ERR_PURGE_REQUIRED
    http_status: 409
    applies_to: "POST /line-assignments/{assignment_id}/activate"
  - priority: 21
    category: business_constraint
    check: "Lot compatibility: virgin lot lot_kind=VIRGIN and resin_type == formulation.base_resin_type; colorant lot lot_kind=COLORANT, resin_type == formulation.base_resin_type, color_family == formulation.color_family; run batch formulation_id == assignment work order formulation_id"
    error_id: ERR_LOT_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /blend-batches; POST /runs"
  - priority: 22
    category: business_constraint
    check: "SPC sample shape: dimension_name must exist in profile.critical_dimensions; len(measurements) must equal profile.spc_subgroup_size"
    error_id: ERR_UNKNOWN_DIMENSION
    http_status: 400
    applies_to: "POST /spc-samples (unknown dimension_name)"
  - priority: 23
    category: business_constraint
    check: "len(measurements) == profile.spc_subgroup_size"
    error_id: ERR_SPC_SUBGROUP_SIZE
    http_status: 400
    applies_to: "POST /spc-samples (wrong measurement count)"
  - priority: 24
    category: business_constraint
    check: "ResinIndexPoint month must be unique; second POST for an existing month rejected (use restate)"
    error_id: ERR_INDEX_MONTH_EXISTS
    http_status: 409
    applies_to: "POST /resin-index-points"
  - priority: 25
    category: business_referential
    check: "WorkOrder referential integrity: profile.customer_id == work_order.customer_id; formulation.profile_id == work_order.profile_id; die.profile_id == work_order.profile_id"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "POST /work-orders"
  - priority: 26
    category: business_referential
    check: "Resin index coverage: a ResinIndexPoint must exist for the quote month at work-order creation, and for every month in the basis window at each pass-through evaluation"
    error_id: ERR_RESIN_INDEX_MISSING
    http_status: 422
    applies_to: "POST /work-orders; POST /work-orders/{work_order_id}/confirm; POST /work-orders/{work_order_id}/reprice; POST /work-orders/{work_order_id}/invoice"
  - priority: 27
    category: business_fiscal
    check: "Credit gate at confirm: candidate_exposure > customer.credit_limit_cents rejected; equality allowed"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /work-orders/{work_order_id}/confirm"
  - priority: 28
    category: business_fiscal
    check: "Lot quantity sufficiency: virgin_lot.available_kg >= virgin_kg and colorant_lot.available_kg >= colorant_kg after blend_composition (regrind shortfall is absorbed, never an error)"
    error_id: ERR_INSUFFICIENT_LOT_QUANTITY
    http_status: 422
    applies_to: "POST /blend-batches"
  - priority: 29
    category: business_fiscal
    check: "Amortization adjustment must keep amortized_cents and remaining_balance_cents within [0, tooling_cost_cents]"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "POST /dies/{die_id}/amortization-adjustments"
  - priority: 30
    category: business_constraint
    check: "Malformed request bodies, missing required fields, wrong types, invalid enum members, duplicate unique codes (profile_code, die_code, formula_code, line_code)"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "all"
    note: "Catch-all structural validation runs LAST for domain fields so domain-specific errors win; missing required JSON fields still fail fast within this tier."

# =============================================================================
# §1.5 API Endpoint Table (50 endpoints)
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/customers", description: "Create customer", roles: [PlantManager], code: 201, input: [name, resin_index_basis, credit_limit_cents], output: Customer, side_effects: ["status=ACTIVE, open_exposure_cents=0"] }
  - { method: GET, path: "/customers/{customer_id}", description: "Get customer", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/customers/{customer_id}/credit-status", description: "Place or release a credit hold (action HOLD|RELEASE)", roles: [PlantManager], code: 200, input: [action], output: Customer, side_effects: ["Customer status transition; increments Customer.version by 1"] }

  # --- Profile ---
  - { method: POST, path: "/profiles", description: "Create profile with SPC control plan", roles: [ProcessEngineer], code: 201, input: [customer_id, profile_code, critical_dimensions, spc_subgroup_size, sample_every_m, resin_content_kg_per_m, min_line_speed_mpm, max_line_speed_mpm], output: Profile, side_effects: [] }
  - { method: GET, path: "/profiles/{profile_id}", description: "Get profile", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: Profile, side_effects: [] }
  - { method: GET, path: "/profiles", description: "List profiles (reverse lookup for Profile.customer_id)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "Profile[]", side_effects: [] }

  # --- Die ---
  - { method: POST, path: "/dies", description: "Register die tooling", roles: [ProcessEngineer], code: 201, input: [profile_id, die_code, tooling_cost_cents, committed_length_m, committed_weight_kg, amortization_mode, buffer_hours, min_screw_mm, max_screw_mm], output: Die, side_effects: ["status=DRAFT, amortized_cents=0, remaining_balance_cents=tooling_cost_cents"] }
  - { method: GET, path: "/dies/{die_id}", description: "Get die", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: Die, side_effects: [] }
  - { method: GET, path: "/dies", description: "List dies (reverse lookup for Die.profile_id)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["profile_id?", "limit?", "offset?"], output: "Die[]", side_effects: [] }
  - { method: POST, path: "/dies/{die_id}/transition", description: "Drive die lifecycle (to TRIAL|QUALIFIED|DRAFT|MAINTENANCE|IN_SERVICE|RETIRED)", roles: [ProcessEngineer], code: 200, input: [to], output: Die, side_effects: ["status transition per Die machine; QUALIFIED pins amortization rates; increments Die.version by 1"] }
  - { method: POST, path: "/dies/{die_id}/amortization-adjustments", description: "Manual amortization adjustment (OCC on Die.version)", roles: [PlantManager], code: 200, input: [adjustment_cents, reason, expected_die_version], output: Die, side_effects: ["amortized_cents += adjustment_cents; remaining_balance_cents -= adjustment_cents (INV-AMORT); increments Die.version by 1"] }

  # --- ExtrusionLine ---
  - { method: POST, path: "/lines", description: "Register extrusion line", roles: [ProcessEngineer], code: 201, input: [line_code, screw_diameter_mm], output: ExtrusionLine, side_effects: ["status=IDLE"] }
  - { method: GET, path: "/lines/{line_id}", description: "Get line", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: ExtrusionLine, side_effects: [] }

  # --- ResinLot ---
  - { method: POST, path: "/resin-lots", description: "Receive a resin/regrind/colorant lot", roles: [LineOperator], code: 201, input: [lot_kind, resin_type, color_family, received_kg, "supplier_lot_ref?"], output: ResinLot, side_effects: ["status=RECEIVED, consumed_kg=0, available_kg=received_kg"] }
  - { method: GET, path: "/resin-lots/{lot_id}", description: "Get resin lot", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: ResinLot, side_effects: [] }
  - { method: POST, path: "/resin-lots/{lot_id}/qc", description: "QC disposition (outcome PASS|FAIL|REVERSE); REVERSE cascades to batches", roles: [QualityInspector], code: 200, input: [outcome], output: ResinLot, side_effects: ["ResinLot status transition; REVERSE quarantines BLENDED/QC_RELEASED batches referencing the lot with lot credit-back; increments ResinLot.version by 1"] }

  # --- Formulation ---
  - { method: POST, path: "/formulations", description: "Create formulation (resin + colorant let-down + regrind cap)", roles: [ProcessEngineer], code: 201, input: [profile_id, formula_code, base_resin_type, color_family, let_down_ratio, max_regrind_pct], output: Formulation, side_effects: [] }
  - { method: GET, path: "/formulations/{formulation_id}", description: "Get formulation", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: Formulation, side_effects: [] }
  - { method: GET, path: "/formulations", description: "List formulations (reverse lookup for Formulation.profile_id)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["profile_id?", "limit?", "offset?"], output: "Formulation[]", side_effects: [] }

  # --- BlendBatch ---
  - { method: POST, path: "/blend-batches", description: "Blend a material batch; computes composition and draws lots", roles: [LineOperator], code: 201, input: [formulation_id, virgin_lot_id, "regrind_lot_id?", colorant_lot_id, target_batch_kg], output: BlendBatch, side_effects: ["blend_composition computed; component lot consumed_kg/available_kg updated; DEPLETED flip when a lot's available_kg hits 0"] }
  - { method: GET, path: "/blend-batches/{batch_id}", description: "Get blend batch", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: BlendBatch, side_effects: [] }
  - { method: GET, path: "/blend-batches", description: "List blend batches (reverse lookup for its four FKs)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["formulation_id?", "virgin_lot_id?", "regrind_lot_id?", "colorant_lot_id?", "limit?", "offset?"], output: "BlendBatch[]", side_effects: [] }
  - { method: POST, path: "/blend-batches/{batch_id}/qc", description: "Batch QC action (RELEASE|QUARANTINE|RE_RELEASE); SoD on RE_RELEASE; QUARANTINE of a CONSUMED batch cascades to run/line/assignments", roles: [QualityInspector], code: 200, input: [action], output: BlendBatch, side_effects: ["BlendBatch status transition per machine incl. INV-MASS compensation and batch-quarantine cascade; increments BlendBatch.version by 1"] }

  # --- WorkOrder ---
  - { method: POST, path: "/work-orders", description: "Create work order; snapshots quote month and quote resin index", roles: [SalesEngineer], code: 201, input: [customer_id, profile_id, formulation_id, die_id, ordered_length_m, cut_length_mm, pieces_per_bundle, base_unit_price_cents_per_m], output: WorkOrder, side_effects: ["status=QUOTED, billing_status=UNBILLED, quote_month=clock month, quote_index_cents_per_kg snapshot, adj=0"] }
  - { method: GET, path: "/work-orders/{work_order_id}", description: "Get work order", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: GET, path: "/work-orders", description: "List work orders (reverse lookup for its four FKs)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["customer_id?", "profile_id?", "formulation_id?", "die_id?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/work-orders/{work_order_id}/confirm", description: "Confirm a quote (customer credit gates)", roles: [SalesEngineer], code: 200, input: [], output: WorkOrder, side_effects: ["status QUOTED->CONFIRMED; pass-through recomputed at clock month; exposure recomputed; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{work_order_id}/reprice", description: "Recalculate pass-through at current clock month (OCC); from CONFIRMED reverts to QUOTED", roles: [SalesEngineer], code: 200, input: [expected_work_order_version], output: WorkOrder, side_effects: ["resin_price_pass_through recomputed; CONFIRMED->QUOTED revert or QUOTED->QUOTED; exposure recomputed; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{work_order_id}/cancel", description: "Cancel an order; cascades to its assignments", roles: [SalesEngineer], code: 200, input: [], output: WorkOrder, side_effects: ["status->CANCELLED; SCHEDULED/ACTIVE assignments->CANCELLED; line SETUP->IDLE where freed; exposure recomputed; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{work_order_id}/invoice", description: "Invoice a closed order; bills actual metres plus tooling surcharge", roles: [PlantManager], code: 200, input: [], output: WorkOrder, side_effects: ["closeout_invoice_total; billing_status->INVOICED; surcharge credited to die; increments WorkOrder.version by 1"] }

  # --- LineAssignment ---
  - { method: POST, path: "/line-assignments", description: "Schedule an order+die onto a line over a planned window (overlap/buffer checks)", roles: [ProcessEngineer], code: 201, input: [work_order_id, die_id, line_id, planned_start, planned_end], output: LineAssignment, side_effects: ["status=SCHEDULED; WorkOrder CONFIRMED->SCHEDULED on first assignment"] }
  - { method: GET, path: "/line-assignments/{assignment_id}", description: "Get assignment", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: LineAssignment, side_effects: [] }
  - { method: GET, path: "/line-assignments", description: "List assignments (reverse lookup for its three FKs)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["work_order_id?", "die_id?", "line_id?", "limit?", "offset?"], output: "LineAssignment[]", side_effects: [] }
  - { method: POST, path: "/line-assignments/{assignment_id}/activate", description: "Activate a scheduled assignment (line/die state gates, screw compat, purge gate)", roles: [ProcessEngineer], code: 200, input: [], output: LineAssignment, side_effects: ["status->ACTIVE; line IDLE->SETUP; die QUALIFIED->IN_SERVICE; increments LineAssignment.version by 1"] }
  - { method: POST, path: "/line-assignments/{assignment_id}/close", description: "Close an active assignment after all runs complete", roles: [ProcessEngineer], code: 200, input: [], output: LineAssignment, side_effects: ["status->CLOSED; line RUNNING->IDLE; WorkOrder close check; increments LineAssignment.version by 1"] }
  - { method: POST, path: "/line-assignments/{assignment_id}/cancel", description: "Cancel an assignment with no active runs", roles: [ProcessEngineer], code: 200, input: [], output: LineAssignment, side_effects: ["status->CANCELLED; line SETUP->IDLE where applicable; WorkOrder revert check; increments LineAssignment.version by 1"] }

  # --- ProductionRun ---
  - { method: POST, path: "/runs", description: "Start a production run under an ACTIVE assignment consuming a QC_RELEASED batch", roles: [LineOperator], code: 201, input: [assignment_id, batch_id, line_speed_mpm], output: ProductionRun, side_effects: ["status=RUNNING; batch QC_RELEASED->CONSUMED; line SETUP->RUNNING (stays RUNNING if already); WorkOrder SCHEDULED->IN_PRODUCTION"] }
  - { method: GET, path: "/runs/{run_id}", description: "Get run", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: ProductionRun, side_effects: [] }
  - { method: GET, path: "/runs", description: "List runs (reverse lookup for assignment_id, batch_id, regrind_lot_id)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["assignment_id?", "batch_id?", "regrind_lot_id?", "limit?", "offset?"], output: "ProductionRun[]", side_effects: [] }
  - { method: POST, path: "/runs/{run_id}/hold-status", description: "Hold or release a run (action HOLD|RELEASE); SoD on releasing a MANUAL hold", roles: [QualityInspector], code: 200, input: [action], output: ProductionRun, side_effects: ["HOLD: run->HOLD (MANUAL), line->DOWN, SCHEDULED assignments on line->CANCELLED; RELEASE: run->RUNNING, line->RUNNING; increments ProductionRun.version by 1"] }
  - { method: POST, path: "/runs/{run_id}/complete", description: "Complete a run: record output, cut bundles, spawn regrind lot, credit amortization, bubble-up order close", roles: [LineOperator], code: 200, input: [good_length_mm, good_weight_kg, trim_scrap_kg], output: ProductionRun, side_effects: ["bundle_cut_plan creates CutBundles; when trim_scrap_kg>0 a REGRIND ResinLot is created and its id stored on run.regrind_lot_id; tooling_amortization_credit; produced_good_length_m += good_length_mm/1000; WorkOrder close check; increments ProductionRun.version by 1"] }

  # --- SPCSample ---
  - { method: POST, path: "/spc-samples", description: "Post a dimensional SPC sample to a RUNNING run; OOC result fires the hold cascade", roles: [LineOperator], code: 201, input: [run_id, dimension_name, measurements], output: SPCSample, side_effects: ["spc_control_evaluation; samples_posted += 1; if ooc: run RUNNING->HOLD (SYSTEM), line RUNNING->DOWN, SCHEDULED assignments on line->CANCELLED"] }
  - { method: GET, path: "/runs/{id}/spc-samples", description: "List samples of a run (reverse lookup for SPCSample.run_id)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["limit?", "offset?"], output: "SPCSample[]", side_effects: [] }

  # --- CutBundle ---
  - { method: GET, path: "/runs/{id}/bundles", description: "List bundles of a run, ordered by bundle_seq ascending (reverse lookup for CutBundle.run_id)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["limit?", "offset?"], output: "CutBundle[]", side_effects: [] }

  # --- PurgeEvent ---
  - { method: POST, path: "/purge-events", description: "Record a changeover purge on a line; computes transition class and scrap kg", roles: [LineOperator], code: 201, input: [line_id, from_resin_type, to_resin_type, from_color_family, to_color_family, purge_grade], output: PurgeEvent, side_effects: ["purge_scrap_estimate computed"] }
  - { method: GET, path: "/lines/{id}/purge-events", description: "List purge events of a line (reverse lookup for PurgeEvent.line_id)", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: ["limit?", "offset?"], output: "PurgeEvent[]", side_effects: [] }

  # --- ResinIndexPoint ---
  - { method: POST, path: "/resin-index-points", description: "Publish a monthly resin index point", roles: [PlantManager], code: 201, input: [month, index_cents_per_kg], output: ResinIndexPoint, side_effects: [] }
  - { method: GET, path: "/resin-index-points/{month}", description: "Get the index point for a month", roles: [PlantManager, ProcessEngineer, LineOperator, QualityInspector, SalesEngineer], code: 200, input: [], output: ResinIndexPoint, side_effects: [] }
  - { method: POST, path: "/resin-index-points/{month}/restate", description: "Restate a month's index value (OCC); cascades pass-through recompute on uninvoiced orders", roles: [PlantManager], code: 200, input: [index_cents_per_kg, expected_index_point_version], output: ResinIndexPoint, side_effects: ["index_cents_per_kg updated; recompute pass-through on WorkOrders billing_status=UNBILLED and status!=CANCELLED whose basis references this month; recompute affected customers' open_exposure_cents; increments ResinIndexPoint.version by 1"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time.", roles: [PlantManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock set; no entity mutations"] }

# =============================================================================
# §1.6 Error Code Catalog (27 codes)
# =============================================================================
errors:
  - { id: ERR_BAD_REQUEST, http: 400, condition: "Malformed body, missing required field, wrong type, invalid enum member, duplicate unique code, VIRGIN lot with non-NATURAL color, work-order referential mismatch, or amortization adjustment out of bounds" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in endpoint roles list" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation-of-duties breach: run hold RELEASE by the imposing inspector, or batch RE_RELEASE by the inspector who quarantined it" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path left-to-right, then body fields)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 409, condition: "Work order confirm while customer status is CREDIT_HOLD" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm would push candidate open exposure strictly above customer credit_limit_cents" }
  - { id: ERR_RESIN_INDEX_MISSING, http: 422, condition: "No ResinIndexPoint for the quote month at creation, or a basis-window month lacks a point at pass-through evaluation" }
  - { id: ERR_INDEX_MONTH_EXISTS, http: 409, condition: "POST /resin-index-points for a month that already has a point (use restate)" }
  - { id: ERR_LINE_NOT_IDLE, http: 409, condition: "Assignment activation while the line is SETUP, RUNNING, or DOWN" }
  - { id: ERR_LINE_INCOMPATIBLE_DIE, http: 409, condition: "Line screw diameter outside the die's [min_screw_mm, max_screw_mm] window at activation" }
  - { id: ERR_LINE_SCHEDULE_CONFLICT, http: 409, condition: "New assignment's half-open planned window overlaps another SCHEDULED/ACTIVE assignment on the same line" }
  - { id: ERR_DIE_BUFFER_CONFLICT, http: 409, condition: "Gap between new assignment and another SCHEDULED/ACTIVE assignment on the same die is less than die.buffer_hours, even with zero overlap" }
  - { id: ERR_DIE_NOT_RUNNABLE, http: 409, condition: "Assignment activation while the die is not QUALIFIED or IN_SERVICE" }
  - { id: ERR_PURGE_REQUIRED, http: 409, condition: "Prior CLOSED assignment on the line used a different resin/color and no matching PurgeEvent was recorded after its closure" }
  - { id: ERR_MATERIAL_NOT_RELEASED, http: 409, condition: "Blend creation with a lot not QC_PASSED, or run creation with a batch not QC_RELEASED" }
  - { id: ERR_REGRIND_PURITY_VIOLATION, http: 422, condition: "Regrind lot kind/resin/color does not exactly match the formulation (lot purity rule)" }
  - { id: ERR_LOT_INCOMPATIBLE, http: 422, condition: "Virgin/colorant lot kind, resin type, or color family incompatible with the formulation; or run batch formulation differs from the work order's" }
  - { id: ERR_INSUFFICIENT_LOT_QUANTITY, http: 422, condition: "Virgin or colorant lot available_kg below the computed draw" }
  - { id: ERR_LET_DOWN_RANGE, http: 400, condition: "let_down_ratio outside [10.0, 50.0] or max_regrind_pct outside [0, 40]" }
  - { id: ERR_LINE_SPEED_OUT_OF_RANGE, http: 400, condition: "line_speed_mpm outside the profile's qualified speed window" }
  - { id: ERR_SPC_SUBGROUP_SIZE, http: 400, condition: "measurements length != profile.spc_subgroup_size" }
  - { id: ERR_UNKNOWN_DIMENSION, http: 400, condition: "dimension_name not present in the profile's critical_dimensions" }
  - { id: ERR_SPC_SAMPLE_QUOTA, http: 422, condition: "Run completion with samples_posted below floor(good_length_m / sample_every_m)" }
  - { id: ERR_RUN_IN_PROGRESS, http: 409, condition: "Cancel/close requested while a scoped ProductionRun is RUNNING or HOLD" }

# =============================================================================
# §1.7 RBAC Matrix (5 roles, all opaque; segregation-of-duties anchors)
# =============================================================================
roles:
  - name: PlantManager
    description: "Owns customers, credit posture, resin index publication, tooling amortization adjustments, invoicing, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /customers; POST /customers/{customer_id}/credit-status"
      - "POST /resin-index-points; POST /resin-index-points/{month}/restate"
      - "POST /dies/{die_id}/amortization-adjustments"
      - "POST /work-orders/{work_order_id}/invoice"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: ProcessEngineer
    description: "Owns profiles, dies, formulations, lines, and line scheduling/activation"
    identity: opaque
    exclusive_operations:
      - "POST /profiles; POST /dies; POST /dies/{die_id}/transition; POST /lines"
      - "POST /formulations"
      - "POST /line-assignments; POST /line-assignments/{assignment_id}/activate; POST /line-assignments/{assignment_id}/close; POST /line-assignments/{assignment_id}/cancel"
    shared_operations:
      - "All GET endpoints"
  - name: LineOperator
    description: "Runs the floor: receives lots, blends batches, starts/completes runs, posts SPC samples, records purge events"
    identity: opaque
    exclusive_operations:
      - "POST /resin-lots"
      - "POST /blend-batches"
      - "POST /runs; POST /runs/{run_id}/complete"
      - "POST /spc-samples"
      - "POST /purge-events"
    shared_operations:
      - "All GET endpoints"
  - name: QualityInspector
    description: "Releases/rejects lots and batches, holds/releases runs; SoD: cannot release what the same user held or quarantined"
    identity: opaque
    exclusive_operations:
      - "POST /resin-lots/{lot_id}/qc"
      - "POST /blend-batches/{batch_id}/qc"
      - "POST /runs/{run_id}/hold-status"
    shared_operations:
      - "All GET endpoints"
  - name: SalesEngineer
    description: "Owns the commercial order lifecycle: quote, confirm, reprice, cancel"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders; POST /work-orders/{work_order_id}/confirm; POST /work-orders/{work_order_id}/reprice; POST /work-orders/{work_order_id}/cancel"
    shared_operations:
      - "All GET endpoints"
