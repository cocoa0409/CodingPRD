scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_building_missing_required_name_returns_400
        claim_type: required_fields
        grounds: [entities.Building.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /buildings without the required `name` field is rejected ERR_INVALID_REQUEST (400); no Building persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /buildings"
              payload: { fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /buildings afterwards returns total_count == 0"

      - name: group_optional_fields_defaults_applied
        claim_type: defaults
        grounds: [entities.ConferenceGroup.fields.has_minor_participants, entities.ConferenceGroup.fields.linen_tier, entities.ConferenceGroup.fields.deposit_paid_cents]
        distinguishing_aspect: "Omitting has_minor_participants / linen_tier / deposit_paid_cents yields defaults false / STANDARD / 0 on the created group."
        test_recipe:
          setup: ["building exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Abbot Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Minimalists", contact_email: "min@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
          assert:
            - "ConferenceGroup.${g_id}.has_minor_participants == false"
            - "ConferenceGroup.${g_id}.linen_tier == 'STANDARD'"
            - "ConferenceGroup.${g_id}.deposit_paid_cents == 0"
            - "ConferenceGroup.${g_id}.status == 'DRAFT' (initial state)"

      - name: participant_is_minor_computed_at_arrival_date
        claim_type: computed_field_correctness
        grounds: [entities.Participant.fields.is_minor]
        distinguishing_aspect: "is_minor derives from age at the group's arrival_date: a participant born 2008-07-01 is 17 at arrival 2026-06-15 (is_minor true); one born 2008-06-01 is 18 (is_minor false)."
        test_recipe:
          setup: ["building exists; group G with arrival_date 2026-06-15"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Bond Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Age Test", contact_email: "age@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", has_minor_participants: true, contracted_bed_count: 2 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "Still Seventeen", date_of_birth: "2008-07-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p_minor: $.data.id, minor_flag: $.data.is_minor }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "Just Eighteen", date_of_birth: "2008-06-01", role_in_group: "CHAPERONE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p_adult: $.data.id, adult_flag: $.data.is_minor }
          assert:
            - "Participant.${p_minor}.is_minor == true (17 at arrival)"
            - "Participant.${p_adult}.is_minor == false (18 at arrival — boundary: 18th birthday on/before arrival is NOT a minor)"

      - name: system_minted_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Building]
        distinguishing_aspect: "Client-supplied id / created_at / version / status in POST /buildings are ignored; server mints id (prefix-free UUID), version 1, status ACADEMIC_USE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /buildings"
              payload: { name: "Spoof Hall", fall_opening_date: "2026-08-20", key_pool_size: 5, id: "11111111-1111-4111-8111-111111111111", version: 99, status: "RELEASED" }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id, b_ver: $.data.version }
          assert:
            - "Building.${b_id}.version == 1 (client's 99 ignored)"
            - "Building.${b_id}.status == ACADEMIC_USE (client's RELEASED ignored)"
            - "Building.${b_id}.id != '11111111-1111-4111-8111-111111111111' (server-minted)"

      - name: get_room_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /rooms/{non-existent UUID} returns 404 ERR_NOT_FOUND with the standard error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rooms/00000000-0000-4000-8000-000000000000"
              as: ConferenceServicesAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 404 and error_id == ERR_NOT_FOUND"
            - "error envelope carries meta.api_request_id and data.message (per §1.0)"

      - name: list_groups_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /conference-groups?limit=2&offset=2 over 3 groups returns exactly 2 rows plus total_count 3 and has_more false."
        test_recipe:
          setup: ["building exists; 3 groups created"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Case Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "G1", contact_email: "g1@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1 }
              as: ConferenceServicesAdmin
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "G2", contact_email: "g2@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1 }
              as: ConferenceServicesAdmin
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "G3", contact_email: "g3@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1 }
              as: ConferenceServicesAdmin
          trigger:
            - call: "GET /conference-groups"
              payload: { limit: 2, offset: 2 }
              as: ConferenceServicesAdmin
          assert:
            - "response data array length == 2"
            - "envelope carries total_count == 3 and has_more == false"
            - "with offset 0 the same query returns has_more == true"

      - name: rooming_list_revision_has_no_version_field
        claim_type: immutability
        grounds: [entities.RoomingListRevision]
        distinguishing_aspect: "RoomingListRevision is common_fields: false — the create response carries id and created_at but NO version or updated_at; there is no update endpoint for revisions."
        test_recipe:
          setup: ["building TURN_ACTIVE with room R1; group DRAFT with 1 participant"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Dana Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 1 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Immutable List", contact_email: "il@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "A One", date_of_birth: "1990-01-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /conference-groups/${g_id}"
              as: ConferenceServicesAdmin
              captures: { g_ver: $.data.version }
          trigger:
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p1_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-17T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { rev_id: $.data.id }
          assert:
            - "RoomingListRevision.${rev_id} response carries id, created_at, revision_number == 1, status == ACTIVE, assignment_ids length 1"
            - "response has no `version` and no `updated_at` key (common_fields: false)"

      - name: room_creation_requires_existing_building
        claim_type: parent_relationship
        grounds: [entities.Room.fields.building_id]
        distinguishing_aspect: "POST /buildings/{bad-uuid}/rooms fails 404 ERR_NOT_FOUND — the parent path id is validated before the body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /buildings/00000000-0000-4000-8000-000000000000/rooms"
              payload: { room_number: "R1", bed_count: 2 }
              as: FacilitiesManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: resubmit_returned_group_revision_loop
        claim_type: valid_transition
        grounds: [state_machines.ConferenceGroup.RETURNED_to_SUBMITTED, state_machines.ConferenceGroup.SUBMITTED_to_RETURNED]
        distinguishing_aspect: "The DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED review loop works: return-for-revision then a second submit both succeed."
        test_recipe:
          setup: ["building exists; group with 1 participant, SUBMITTED once"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Ellis Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Loop Group", contact_email: "loop@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "A One", date_of_birth: "1990-01-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /conference-groups/${g_id}/return-for-revision"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
          assert:
            - "After return-for-revision: status == RETURNED"
            - "After resubmit: status == SUBMITTED (cyclic review loop traversed)"

      - name: submit_already_submitted_group_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ConferenceGroup.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUBMITTED is not a valid from-state for submit: second submit returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["building exists; group SUBMITTED"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Field Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Twice Submit", contact_email: "ts@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "A One", date_of_birth: "1990-01-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and error_id == ERR_INVALID_STATE"
            - "ConferenceGroup.${g_id}.status remains SUBMITTED; version unchanged by the failed call"

      - name: cancel_in_house_group_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ConferenceGroup, "errors[ERR_GROUP_NOT_CANCELLABLE]", "validations[priority=11]"]
        distinguishing_aspect: "Cancel from IN_HOUSE (guests checked in) is rejected with the domain-specific ERR_GROUP_NOT_CANCELLABLE, not generic ERR_INVALID_STATE."
        test_recipe:
          setup: ["full chain to IN_HOUSE: building TURN_ACTIVE, room R1, group CONFIRMED, assignment checked in at 2026-06-15T16:00:00Z"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Gray Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 1 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "In House", contact_email: "ih@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1, deposit_paid_cents: 5000 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "A One", date_of_birth: "1990-01-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /conference-groups/${g_id}"
              as: ConferenceServicesAdmin
              captures: { g_ver: $.data.version }
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p1_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-17T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/confirm"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T16:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "GET /stay-assignments"
              payload: { group_id: "${g_id}", participant_id: "${p1_id}" }
              as: ConferenceServicesAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /stay-assignments/${a1_id}/check-in"
              payload: {  }
              as: ConferenceServicesAdmin
          trigger:
            - call: "POST /conference-groups/${g_id}/cancel"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and error_id == ERR_GROUP_NOT_CANCELLABLE"
            - "group remains IN_HOUSE; assignment remains CHECKED_IN; no counters change"

      - name: closed_group_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ConferenceGroup]
        distinguishing_aspect: "CLOSED is terminal: submit / cancel / return-for-revision / close-out from CLOSED all fail 409."
        test_recipe:
          setup: ["complete lifecycle to CLOSED: group DEPARTED, invoice FINALIZED and PAID (auto-transition to CLOSED)"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Holt Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 1 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Terminal", contact_email: "t@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-17", contracted_bed_count: 1, deposit_paid_cents: 5000 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "A One", date_of_birth: "1990-01-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /conference-groups/${g_id}"
              as: ConferenceServicesAdmin
              captures: { g_ver: $.data.version }
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p1_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-17T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/confirm"
              payload: {  }
              as: ConferenceServicesAdmin
              captures: { inv_id: $.data.provisional_invoice_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T16:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "GET /stay-assignments"
              payload: { group_id: "${g_id}", participant_id: "${p1_id}" }
              as: ConferenceServicesAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /stay-assignments/${a1_id}/check-in"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T10:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "POST /stay-assignments/${a1_id}/check-out"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /conference-groups/${g_id}/close-out"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /invoices/${inv_id}/finalize"
              payload: {  }
              as: FinanceOfficer
            - call: "POST /invoices/${inv_id}/record-payment"
              payload: { amount_cents: 4000 }
              as: FinanceOfficer
          trigger:
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /conference-groups/${g_id}/cancel"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /conference-groups/${g_id}/close-out"
              payload: {  }
              as: ConferenceServicesAdmin
              captures: { err3: $.data.error_id }
          assert:
            - "Group reached CLOSED (payment auto-transition DEPARTED -> CLOSED fired)"
            - "Payment math: final 2 nights * 4500 = 9000, balance 9000 - 5000 = 4000 == amount paid"
            - "submit from CLOSED: 409 ERR_INVALID_STATE; cancel from CLOSED: 409 ERR_GROUP_NOT_CANCELLABLE; close-out from CLOSED: 409 ERR_INVALID_STATE"

      - name: building_full_season_cycle
        claim_type: cyclic_shape
        grounds: [state_machines.Building]
        distinguishing_aspect: "The building machine is cyclic across seasons: ACADEMIC_USE -> RELEASE_REVIEW -> RELEASED -> TURN_ACTIVE -> FALL_PREP -> READY_FOR_FALL -> ACADEMIC_USE all traverse in one run."
        test_recipe:
          setup: ["building with 1 room, fully released and turn-season begun, no stays ever booked"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Ives Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 1 }
              as: FacilitiesManager
          trigger:
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-fall-prep"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/certify-fall-ready"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/reopen-academic"
              payload: {  }
              as: FacilitiesManager
          assert:
            - "Statuses in order: RELEASE_REVIEW, RELEASED (room cascaded ACADEMIC_OCCUPIED -> RELEASED), TURN_ACTIVE, FALL_PREP, READY_FOR_FALL, ACADEMIC_USE"
            - "After reopen-academic: rooms back to ACADEMIC_OCCUPIED; released_bed_count/reserved_bed_count/available_bed_count all 0"

      - name: begin_fall_prep_blocked_by_open_turn_task
