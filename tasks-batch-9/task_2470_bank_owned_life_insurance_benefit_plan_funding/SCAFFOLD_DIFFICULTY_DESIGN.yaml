            - call: "POST /policy-valuations"
              payload: { policy_id: "${policy_nonmec_id}", period_start_date: "2026-08-15T00:00:00Z", as_of_date: "2026-09-30T00:00:00Z", credited_interest_usd: 306000.00, mortality_expense_charge_usd: 6000.00, gross_crediting_rate_bps: 2550 }
              as: TreasuryController
