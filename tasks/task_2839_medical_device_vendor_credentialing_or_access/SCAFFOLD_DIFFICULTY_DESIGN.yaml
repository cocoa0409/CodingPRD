            - "LoanerSet.${ls_9601_id}.late_minutes_current_basis == 0"
            - "LoanerSet.${ls_9601_id}.assessed_late_fee_cents == 0"
            - "VendorRep.${rep_sam_id}.access_status == PENDING_CREDENTIALING — a MAJOR substantiation never reaches the VendorRep machine"
            - "Vendor.${v_orthop_id}.adjudicated_compliance_score == 92"
            - "Vendor.${v_orthop_id}.provisional_compliance_score == 92"
            - "Vendor.${v_orthop_id}.late_fee_balance_cents == 0"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: revoked_rep_state_check_precedes_badge_window_and_returns_409
        grounds:
          - validations.priority_10_ERR_REP_ACCESS_REVOKED
          - validations.priority_26_ERR_BADGE_WINDOW_NOT_OPEN
          - errors.ERR_REP_ACCESS_REVOKED
          - errors.ERR_BADGE_WINDOW_NOT_OPEN
          - calculations.badge_validity_window
        distinguishing_aspect: |
          Category pair state (priority 10, 409) versus business_temporal (priority 26, 422) on
          POST /vendor-access/kiosk-check-ins. Both conditions hold simultaneously: the rep's access is
          REVOKED and the logical clock sits 30 minutes past the badge window's end. The ladder must
          return ERR_REP_ACCESS_REVOKED with 409, never ERR_BADGE_WINDOW_NOT_OPEN with 422 — and the
          two errors carry different HTTP statuses, so the pair is unambiguous.
        test_recipe:
          setup:
            - "Facility BR-09 uses the default badge_lead_minutes 60 and badge_grace_minutes 30."
            - "Rep Nia Brooks of Vendor VASCU is CREDENTIALED with four credentials VERIFIED to 2027-07-01T00:00:00Z."
            - "Case CASE-9701 runs 2026-09-10T14:00:00Z to 18:00:00Z, so the badge window is 13:00:00Z to 18:30:00Z."
            - "The authorization is approved at the 2026-08-01T00:00:00Z default clock."
            - "The clock is then moved to 2026-09-10T19:00:00Z, which is BOTH outside the badge window AND after the case start, so the subsequent revoke-access does not cascade into the authorization (rep-driven revocation only touches cases whose scheduled_start_utc >= now)."
            - "Access is revoked, leaving the authorization APPROVED so that priority 14 cannot mask the pair."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Bayridge Vascular Center", code: "BR-09", spd_turnaround_hours: 6, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_br_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Vasculine Access Corp", vendor_code: "VASCU" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_vascu_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_vascu_id}", full_name: "Nia Brooks", email: "nia.brooks@vasculine.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_nia_id: $.data.id }
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_nia_id}", credential_type: "IMMUNIZATION_INFLUENZA", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "IMM-NIA-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_nia_flu_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_nia_flu_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_nia_id}", credential_type: "TRAINING_BLOODBORNE_PATHOGENS", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BBP-NIA-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_nia_bbp_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_nia_bbp_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_nia_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-NIA-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_nia_bgc_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_nia_bgc_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_nia_id}", credential_type: "COI_GIFT_ATTESTATION", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "COI-NIA-01" }
              as: CredentialingOfficer
