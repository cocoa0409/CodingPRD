      - name: inspection_late_partial_response_takes_the_flat_deduction
        claim_type: threshold
        grounds:
          - "§1.3 calculations.inspection_completeness_score formula 'matched = count of DISTINCT kinds in intersection(provided_document_kinds, requested_document_kinds)', 'raw = round(100 * matched / max(1, count(requested_document_kinds)), 2)', 'completeness_score = raw if responded_at <= response_due_at else round(max(0.00, raw - LATE_RESPONSE_DEDUCTION), 2)'"
          - "§1.3 constants INSPECTION_RESPONSE_DAYS 7, LATE_RESPONSE_DEDUCTION 20.00, INSPECTION_SATISFIED_MIN 100.00"
          - "§1.6 ERR_INSPECTION_RESPONSE_WINDOW_CLOSED (422): 'submit-response when now > response_due_at + INSPECTION_RESPONSE_DAYS (7) days'"
        distinguishing_aspect: "The provided PLAN_COPY is not in the requested set so it never enters matched (1 of 2 -> raw 50.00), and responding on 2026-08-10 — two days past response_due_at but still inside the hard cutoff 2026-08-15 — subtracts a flat 20.00, giving exactly 30.00 and CLOSED_DEFICIENT."
