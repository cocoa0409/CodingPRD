    roles: [SchedulingOfficer, Operator, UnionRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BidEntry[]
    side_effects: []
  - method: POST
    path: "/api/sign-up-periods/{id}/cut-runs"
    description: "Validate all CUT runs against the spread rule; VALIDATED or WITHDRAWN"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: SignUpPeriod
    side_effects: ["Run transitions CUT->VALIDATED or CUT->WITHDRAWN", "SignUpPeriod DRAFT->RUNS_CUT", "increments SignUpPeriod.version by 1"]
  - method: POST
    path: "/api/sign-up-periods/{id}/post-runs"
    description: "Post VALIDATED runs and size the extra board"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: SignUpPeriod
    side_effects: ["Run VALIDATED->POSTED", "creates ExtraBoardSlot rows per extra_board_size calc", "SignUpPeriod RUNS_CUT->OPEN", "increments SignUpPeriod.version by 1"]
  - method: POST
    path: "/api/sign-up-periods/{id}/open-picking"
    description: "Open seniority pick round"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: SignUpPeriod
    side_effects: ["SignUpPeriod OPEN->PICKING", "picked_through_rank = 0", "increments SignUpPeriod.version by 1"]
  - method: POST
    path: "/api/sign-up-periods/{id}/adjudicate-next"
    description: "Adjudicate the next-most-senior pending bidder"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: SignUpPeriod
    side_effects: ["BidEntry AWARDED/PASSED transitions", "Run POSTED->AWARDED", "possible Operator->EXTRA_BOARD demotion with ExtraBoardSlot FILLED", "picked_through_rank updated", "increments SignUpPeriod.version by 1"]
  - method: POST
    path: "/api/sign-up-periods/{id}/lock"
    description: "Lock the pick; unawarded POSTED runs become EXTRA_BOARD_HELD"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: SignUpPeriod
    side_effects: ["Run POSTED->EXTRA_BOARD_HELD", "OPEN ExtraBoardSlot->EXHAUSTED", "SignUpPeriod PICKING->LOCKED", "increments SignUpPeriod.version by 1"]
  - method: POST
    path: "/api/sign-up-periods/{id}/implement"
    description: "Implement the sign-up; materialize DailyAssignments"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: SignUpPeriod
    side_effects: ["creates DailyAssignment rows for AWARDED runs and FILLED board slots", "SignUpPeriod LOCKED->IMPLEMENTED", "increments SignUpPeriod.version by 1"]
  - method: POST
    path: "/api/sign-up-periods/{id}/schedule-revisions"
    description: "Mid-pick service change: bump schedule_revision, withdraw stale POSTED runs, cut replacement runs"
    roles: [SchedulingOfficer]
    code: 201
    input: [new_runs]
    output: SignUpPeriod
    side_effects: ["schedule_revision += 1", "prior POSTED Runs -> WITHDRAWN with bid cascade", "new Runs CUT -> VALIDATED/WITHDRAWN -> POSTED", "picked_through_rank reset 0", "SignUpPeriod PICKING->RUNS_CUT", "increments SignUpPeriod.version by 1"]
