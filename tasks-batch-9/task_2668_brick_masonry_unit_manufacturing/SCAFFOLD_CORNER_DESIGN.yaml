            - "${a_base} == 26.00 == 0.62 * 10 + 4.0 * 4.95, which is exactly target_cdi 20.00 + OVERFIRE_CDI_MARGIN 6.00"
            - "${a_grade} == OFF_COLOR_SALVAGE, NOT OVERFIRE_SCRAP - the overfire test is strictly greater than"
            - "${a_color} == 69.20 == 50.0 + 3.2 * 6.00, ${a_status} == AVAILABLE and ${a_avail} == 9600 - salvage stock is still sellable"
            - "${b_base} == 26.06 == 0.62 * 10.1 + 19.8, one hundredth over the margin"
            - "${b_grade} == OVERFIRE_SCRAP, ${b_color} == 69.39 and ${b_status} == SCRAP"
            - "${p1_scrap} == 9600 - only the strictly-over lot was written off; the boundary lot was not"
            - "${a_dev} == 6.95 == |1000 - 1050| / 10 + |4.95 - 3.0| - deviation is scored against the kiln setpoint and the formulation's target soak, independently of the grade band"

      - name: body_blend_chemistry_weights_three_pit_shares_to_one_hundred
        claim_type: weighted_scoring
        grounds:
          - calculations.body_blend_chemistry
          - validations[priority=35]
        distinguishing_aspect: "Three components at 40/30/30 exercise every coefficient of the weighted chemistry at once, and only the SHALE share - not the pit count - drives shale_share_pct."
        test_recipe:
          setup:
            - "Plant P1 with three pits, all iron_oxide_pct 6.000 and lime_pct 1.000, of which exactly one is SHALE"
            - "Formulation F3 with shares CLAY-A 40.00, CLAY-B 30.00, SHALE-C 30.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-B", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-C", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_c: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F3", target_color_family: "BUFF", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f3: "$.data.id", f3v1: "$.data.version" }
            - call: "POST /formulations/${f3}/components"
              payload: { pit_id: "${pit_a}", share_pct: 40.00, expected_formulation_version: "${f3v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f3v2: "$.data.version", share_1: "$.data.component_share_total_pct" }
            - call: "POST /formulations/${f3}/components"
              payload: { pit_id: "${pit_b}", share_pct: 30.00, expected_formulation_version: "${f3v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f3v3: "$.data.version", share_2: "$.data.component_share_total_pct" }
            - call: "POST /formulations/${f3}/components"
              payload: { pit_id: "${pit_c}", share_pct: 30.00, expected_formulation_version: "${f3v3}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { share_3: "$.data.component_share_total_pct" }
          trigger:
            - call: "POST /formulations/${f3}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { fe: "$.data.blend_iron_oxide_pct", lime: "$.data.blend_lime_pct", shale: "$.data.shale_share_pct", abs: "$.data.absorption_index", dur: "$.data.computed_durability_grade", st: "$.data.status" }
          assert:
            - "${share_1} == 40.00, ${share_2} == 70.00 and ${share_3} == 100.00 - the running weight total is maintained per add"
            - "${fe} == 6.000 == 6.000 * 0.40 + 6.000 * 0.30 + 6.000 * 0.30 - identical inputs cannot drift the weighted mean"
            - "${lime} == 1.000 and ${shale} == 30.00 - one SHALE pit out of three contributes its 30.00 share, not 33.33"
            - "${abs} == 9.90 == round(18.0 - 1.2 * 6.000 - 0.08 * 30.00 + 1.5 * 1.000, 2) - all four coefficients applied"
            - "${dur} == MW because 8.00 < 9.90 <= 14.00, and ${st} == QUALIFIED"

      - name: clay_tonnage_residual_allocation_is_covered_by_the_difficulty_design
        claim_type: waterfall_allocation
        grounds:
          - calculations.clay_tonnage_commitment
        excluded_because:
          difficulty_instance: clay_tonnage_per_pit_rounding_residual_mode_b
          rationale: "The per-pit waterfall - fill each share, then hand the rounding residual to the last component by created_at ASC so the parts still sum to the total - is asserted there at 33.33/33.33/33.34 giving 10.67/10.67/10.66 against a 32.00 total."

      - name: freight_surcharge_tier_boundaries_are_covered_by_the_difficulty_design
        claim_type: tiered_pricing
        grounds:
          - calculations.order_freight_cost
        excluded_because:
          difficulty_instance: freight_surcharge_tier_keyed_on_base_mode_c
          rationale: "Each tier boundary, the keying of the tier on base freight rather than on tonnage, and the non-monotonic result where a smaller order invoices more are all asserted there at bases of 49980 and 50000 cents."

      - name: green_yield_hold_threshold_is_covered_by_the_difficulty_design
        claim_type: threshold
        grounds:
          - calculations.green_yield
        excluded_because:
          difficulty_instance: green_yield_projected_versus_actual_on_close_green
          rationale: "The GREEN_LOSS_HOLD_PCT fork is tested there at exactly 6.00 (lands SET) and 6.20 (lands HELD), which is the threshold row for this calculation."

      - name: green_yield_variant_divergence_is_covered_by_the_difficulty_design
        claim_type: variant_divergence
        grounds:
          - calculations.green_yield.variants
        excluded_because:
          difficulty_instance: green_yield_projected_versus_actual_on_close_green
          rationale: "PROJECTED (basis-point handling loss plus a per-car setting allowance) and ACTUAL (the counted loss) are computed over the same run there, and the -38 unit delta is asserted as green_loss_variance_units."

      - name: freight_variant_selection_is_covered_by_the_difficulty_design
        claim_type: variant_selection
        grounds:
          - calculations.order_freight_cost.variants
        excluded_because:
          difficulty_instance: order_freight_estimated_versus_final_on_package
          rationale: "That instance proves ESTIMATED is the variant used at assign-plant and FINAL the one used at package, keyed off the freight_status dimension rather than off the caller."

      - name: freight_reconciliation_is_covered_by_the_difficulty_design
        claim_type: reconciliation
        grounds:
          - calculations.order_freight_cost.variants
        excluded_because:
          difficulty_instance: order_freight_estimated_versus_final_on_package
          rationale: "The ESTIMATED -> FINAL switch writes freight_variance_cents as the exact delta, and that instance asserts 71102 -> 73182 with a 2080 cent variance including the pallet tare and banding weight that only the FINAL variant sees."

