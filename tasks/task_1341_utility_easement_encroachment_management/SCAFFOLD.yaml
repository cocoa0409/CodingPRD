scenario: |
  Utility Easement & Encroachment Management (utility right-of-way department): easement document inventory & GIS mapping, encroachment discovery & notification, removal negotiation & escalation, new easement acquisition & compensation, permitting on third-party land, vegetation/structure limitation enforcement, title research & recording, litigation referral

domain_name: utility-easement-encroachment
api_prefix: /easement-cases

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - conditional_feature_flags
    - selector_policy

  entity_topology: hybrid
  # Top-level: EasementCase (aggregate root). Children: EasementDocument, Encroachment,
  # AcquisitionOffer, ThirdPartyPermit, VegetationZone, TitleSearchTask, LitigationReferral.
  # Cross-aggregate links: Encroachment -> EasementDocument (FK), AcquisitionOffer -> EasementCase,
  # ThirdPartyPermit -> Encroachment + EasementCase (dual FK), LitigationReferral -> Encroachment.

  state_machine_shape: compound
  # EasementCase.status is derived from children (encroachments open? permits active? title cleared?).
  # Encroachment has a cyclic negotiation loop (NEGOTIATING -> COUNTERED -> NEGOTIATING).
  # AcquisitionOffer has branching fork (ACCEPTED / REJECTED / EXPIRED -> CONDEMNATION_REFERRED).
  # ThirdPartyPermit has parallel dimensions (approval_status x field_inspection_status).

  relationship_patterns:
    - one_to_many        # EasementCase -> documents, encroachments, offers, permits, zones, referrals
    - cross_aggregate    # ThirdPartyPermit references Encroachment and EasementCase; LitigationReferral -> Encroachment
    - polymorphic        # EasementDocument.doc_kind is a discriminated record type (DEED/PLAT/AMENDMENT/JUDGMENT)

  role_model: segregation_of_duties
  # RightOfWayAgent negotiates/acquires; TitleExaminer researches/records;
  # VegetationInspector enforces vegetation; LitigationCounsel takes referrals;
  # DepartmentDirector approves high-compensation offers, finalizes cases.
  # Segregation: the same user cannot both negotiate an offer AND approve its compensation.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EasementCase
    parent: null
    common_fields: true
    fields:
      - { name: case_code, type: string, source: input, description: "Unique human-readable case identifier (e.g. ESM-2026-0142)" }
      - { name: utility_district, type: string, source: input, description: "Utility district code" }
      - { name: county, type: string, source: input, description: "County of the easement" }
      - { name: parcel_id, type: string, source: input, description: "Assessor parcel number" }
      - { name: easement_width_ft, type: number, source: input, description: "Total width of the easement strip in feet" }
      - { name: easement_area_sqft, type: number, source: input, description: "Gross easement area in square feet" }
      - { name: fair_market_value_per_sqft, type: number, source: input, description: "Appraised FMV per square foot for acquisition compensation" }
      - { name: acquisition_budget_cents, type: integer, source: input, description: "Budget cap for new-easement compensation, in cents" }
      - { name: compensation_committed_cents, type: integer, source: computed, default: 0, description: "Sum of accepted/pending offers' compensation amounts" }
      - { name: compensation_balance_cents, type: integer, source: computed, description: "acquisition_budget_cents - compensation_committed_cents" }
      - { name: open_encroachment_count, type: integer, source: computed, default: 0, description: "Count of encroachments not yet in a terminal state" }
      - { name: encroachment_pressure_score, type: number, source: computed, default: 0, description: "Aggregate encroachment severity (see calculation)" }
      - { name: title_cleared, type: boolean, source: computed, default: false, description: "True only when the latest TitleSearchTask for the case is COMPLETED_CLEAN" }
      - { name: active_permit_count, type: integer, source: computed, default: 0, description: "Count of ThirdPartyPermit with approval_status=APPROVED and field_inspection_status != FAILED" }
      - { name: status, type: enum, source: system, description: "INTAKE -> MAPPING -> ACTIVE_MONITORING -> RESOLUTION_PENDING -> CLOSED_RESOLVED | CLOSED_CONDEMNED | CLOSED_ABANDONED" }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; increments on every mutation" }

  - name: EasementDocument
    parent: EasementCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id" }
      - { name: doc_kind, type: enum, source: input, description: "DEED | PLAT | AMENDMENT | JUDGMENT" }
      - { name: instrument_number, type: string, source: input, description: "County recorder instrument number" }
      - { name: recording_date, type: datetime, source: input, description: "Date document was recorded" }
      - { name: grantor_name, type: string, source: input, description: "Grantor of the easement" }
      - { name: grantee_name, type: string, source: input, description: "Grantee (utility)" }
      - { name: gis_polygon_wkt, type: string, source: input, description: "WKT polygon of the easement footprint" }
      - { name: encumbrance_rank, type: integer, source: computed, description: "Recording priority rank; lower rank = earlier recording_date, ties broken by created_at ASC" }
      - { name: width_ft, type: number, source: input, description: "Width granted by this document" }
      - { name: supersedes_document_id, type: string, source: input, default: null, description: "FK -> EasementDocument.id; amendment/judgment that replaces an earlier document" }
      - { name: status, type: enum, source: system, description: "DRAFT -> RECORDED -> SUPERSEDED | REJECTED_DEFECTIVE" }

  - name: Encroachment
    parent: EasementCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id" }
      - { name: discovered_via, type: enum, source: input, description: "AERIAL_SURVEY | FIELD_INSPECTION | THIRD_PARTY_REPORT | TITLE_SEARCH" }
      - { name: encroachment_type, type: enum, source: input, description: "STRUCTURE | VEGETATION | FENCE | PAVEMENT | UTILITY_CROSSING | OTHER" }
      - { name: encroachment_area_sqft, type: number, source: input, description: "Area encroaching into easement, in sqft" }
      - { name: depth_into_easement_ft, type: number, source: input, description: "Maximum perpendicular encroachment depth, feet" }
      - { name: encroaches_document_id, type: string, source: input, description: "FK -> EasementDocument.id; the recorded document whose strip is encroached" }
      - { name: severity_tier, type: enum, source: computed, description: "MINOR | MODERATE | SEVERE | CRITICAL (see severity_tier calculation)" }
      - { name: estimated_removal_cost_cents, type: integer, source: input, description: "Estimated cost to remove, cents" }
      - { name: owner_response_due_date, type: datetime, source: computed, description: "Notice sent + OWNER_RESPONSE_WINDOW_DAYS" }
      - { name: negotiation_round, type: integer, source: computed, default: 0, description: "Number of counter-offer cycles completed" }
      - { name: status, type: enum, source: system, description: "DISCOVERED -> NOTIFIED -> NEGOTIATING -> COUNTERED -> NEGOTIATING | REMOVAL_AGREED -> REMOVED | ESCALATED_TO_LEGAL | PERMITTED_RETROACTIVELY | WAIVED" }

  - name: AcquisitionOffer
    parent: EasementCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id" }
      - { name: landowner_name, type: string, source: input, description: "Name of the landowner" }
      - { name: landowner_contact, type: string, source: input, description: "Contact details" }
      - { name: offered_area_sqft, type: number, source: input, description: "Area to be acquired, sqft" }
      - { name: base_compensation_cents, type: integer, source: computed, description: "offered_area_sqft * fair_market_value_per_sqft * 100, rounded half-up" }
      - { name: negotiated_compensation_cents, type: integer, source: computed, description: "Amount after negotiation rounds (may differ from base)" }
      - { name: severance_damages_cents, type: integer, source: input, default: 0, description: "Damages to remainder parcel, cents" }
      - { name: total_compensation_cents, type: integer, source: computed, description: "negotiated_compensation_cents + severance_damages_cents" }
      - { name: negotiation_round, type: integer, source: computed, default: 0, description: "Number of counter-offer cycles" }
      - { name: negotiation_deadline, type: datetime, source: computed, description: "Offer creation + NEGOTIATION_WINDOW_DAYS" }
      - { name: requires_director_approval, type: boolean, source: computed, description: "True when total_compensation_cents >= DIRECTOR_APPROVAL_THRESHOLD_CENTS" }
      - { name: status, type: enum, source: system, description: "DRAFT -> TENDERED -> COUNTERED -> TENDERED | ACCEPTED | REJECTED_BY_OWNER | EXPIRED -> CONDEMNATION_REFERRED | WITHDRAWN" }

  - name: ThirdPartyPermit
    parent: EasementCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id" }
      - { name: encroachment_id, type: string, source: input, description: "FK -> Encroachment.id; the encroachment being retroactively permitted (nullable for proactive permits)" }
      - { name: permittee_name, type: string, source: input, description: "Party requesting the permit" }
      - { name: permit_type, type: enum, source: input, description: "DRIVEWAY | LANDSCAPING | FENCE_RETENTION | STRUCTURE_RETENTION | UTILITY_CROSSING" }
      - { name: requested_area_sqft, type: number, source: input, description: "Area of the permitted use" }
      - { name: requested_start_date, type: datetime, source: input, description: "Start of permitted use window" }
      - { name: requested_end_date, type: datetime, source: input, description: "End of permitted use window" }
      - { name: annual_fee_cents, type: integer, source: computed, description: "Annual permit fee (see permit_fee calculation)" }
      - { name: approval_status, type: enum, source: system, description: "PENDING -> APPROVED | DENIED | REVOKED" }
      - { name: field_inspection_status, type: enum, source: system, description: "NOT_SCHEDULED -> SCHEDULED -> PASSED | FAILED" }
      - { name: insurance_certificate_on_file, type: boolean, source: input, default: false, description: "Whether permittee has filed liability insurance" }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version" }

  - name: VegetationZone
    parent: EasementCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id" }
      - { name: zone_label, type: string, source: input, description: "Zone label (e.g. 'North strip 0-200ft')" }
      - { name: max_allowed_height_ft, type: number, source: input, description: "Max allowed vegetation height, feet" }
      - { name: prohibited_species, type: array, source: input, description: "List of prohibited species names" }
      - { name: wire_zone_width_ft, type: number, source: input, description: "Width of wire zone (most restrictive)" }
      - { name: border_zone_width_ft, type: number, source: input, description: "Width of border zone" }
      - { name: last_inspection_date, type: datetime, source: system, description: "Last time this zone was inspected" }
      - { name: violation_count, type: integer, source: computed, default: 0, description: "Open vegetation violations in this zone" }
      - { name: status, type: enum, source: system, description: "ACTIVE_MONITORING -> VIOLATION_DETECTED -> REMEDIATION_REQUIRED -> CLEARED" }

  - name: VegetationViolation
    parent: VegetationZone
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: system, description: "FK -> VegetationZone.id" }
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id (denormalized for case-level queries)" }
      - { name: species, type: string, source: input, description: "Species observed" }
      - { name: observed_height_ft, type: number, source: input, description: "Observed height, feet" }
      - { name: location_within_zone, type: enum, source: input, description: "WIRE_ZONE | BORDER_ZONE" }
      - { name: excess_height_ft, type: number, source: computed, description: "observed_height_ft - zone.max_allowed_height_ft (wire-zone limit if location=WIRE_ZONE)" }
      - { name: remediation_deadline, type: datetime, source: computed, description: "Detection + REMEDIATION_WINDOW_DAYS" }
      - { name: status, type: enum, source: system, description: "DETECTED -> NOTIFIED -> REMEDIATED | ESCALATED_TO_LEGAL | EXEMPTED" }

  - name: TitleSearchTask
    parent: EasementCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id" }
      - { name: search_scope, type: enum, source: input, description: "FULL_CHAIN | CURRENT_OWNER | LIEN_ONLY" }
      - { name: ordered_by, type: string, source: system, description: "X-User-ID of TitleExaminer who ordered the search" }
      - { name: completed_by, type: string, source: system, description: "X-User-ID of TitleExaminer who completed it" }
      - { name: liens_found, type: integer, source: input, default: 0, description: "Number of liens/encumbrances discovered" }
      - { name: defects_found, type: integer, source: input, default: 0, description: "Number of title defects discovered" }
      - { name: chain_of_title_json, type: object, source: input, description: "Structured chain of title" }
      - { name: status, type: enum, source: system, description: "ORDERED -> IN_PROGRESS -> COMPLETED_CLEAN | COMPLETED_WITH_DEFECTS | CANCELLED" }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version" }

  - name: LitigationReferral
    parent: EasementCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EasementCase.id" }
      - { name: encroachment_id, type: string, source: input, description: "FK -> Encroachment.id; the encroachment referred to counsel" }
      - { name: referral_reason, type: enum, source: input, description: "NEGOTIATION_FAILED | VEGETATION_REMEDIATION_FAILED | TITLE_DEFECT | CONDEMNATION" }
      - { name: referred_by, type: string, source: system, description: "X-User-ID of RightOfWayAgent who referred" }
      - { name: accepted_by, type: string, source: system, description: "X-User-ID of LitigationCounsel who accepted" }
      - { name: filing_deadline, type: datetime, source: computed, description: "Referral + FILING_WINDOW_DAYS" }
      - { name: status, type: enum, source: system, description: "REFERRED -> ACCEPTED -> FILED -> SETTLED | JUDGMENT_OBTAINED | WITHDRAWN" }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EasementCase
    initial_state: INTAKE
    terminal_states: [CLOSED_RESOLVED, CLOSED_CONDEMNED, CLOSED_ABANDONED]
    transitions:
      - from: INTAKE
        to: MAPPING
        trigger: POST /easement-cases/{caseId}/begin-mapping
        actor: RightOfWayAgent
        preconditions:
          - "At least one EasementDocument exists for the case (ERR_NO_DOCUMENTS_ON_CASE)"
        side_effects: []

      - from: MAPPING
        to: ACTIVE_MONITORING
        trigger: POST /easement-cases/{caseId}/activate-monitoring
        actor: RightOfWayAgent
        preconditions:
          - "At least one EasementDocument is in RECORDED status (ERR_NO_RECORDED_DOCUMENT)"
          - "Latest TitleSearchTask for the case is COMPLETED_CLEAN (ERR_TITLE_NOT_CLEARED)"
        side_effects:
          - "title_cleared recomputed"
          - "status -> ACTIVE_MONITORING"

      - from: ACTIVE_MONITORING
        to: RESOLUTION_PENDING
        trigger: "system (automatic when first Encroachment becomes DISCOVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "open_encroachment_count incremented"
          - "encroachment_pressure_score recomputed"

      - from: RESOLUTION_PENDING
        to: ACTIVE_MONITORING
        trigger: "system (automatic when open_encroachment_count drops to 0)"
        actor: system
        preconditions:
          - "open_encroachment_count == 0"
        side_effects: []

      - from: ACTIVE_MONITORING
        to: CLOSED_RESOLVED
        trigger: POST /easement-cases/{caseId}/close-case
        actor: DepartmentDirector
        preconditions:
          - "open_encroachment_count == 0 (ERR_OPEN_ENCROACHMENTS_REMAIN)"
          - "No AcquisitionOffer in {DRAFT, TENDERED, COUNTERED} (ERR_OPEN_OFFERS_EXIST)"
          - "No ThirdPartyPermit with approval_status=PENDING (ERR_PENDING_PERMITS_EXIST)"
          - "No LitigationReferral in {REFERRED, ACCEPTED} (ERR_PENDING_LITIGATION_EXISTS)"
        side_effects:
          - "All VegetationZones -> CLEARED"
          - "compensation_balance_cents finalized"

      - from: RESOLUTION_PENDING
        to: CLOSED_CONDEMNED
        trigger: POST /easement-cases/{caseId}/condemn
        actor: DepartmentDirector
        preconditions:
          - "At least one AcquisitionOffer is in CONDEMNATION_REFERRED"
          - "Latest TitleSearchTask for the case is COMPLETED_CLEAN or COMPLETED_WITH_DEFECTS"
        side_effects:
          - "All open Encroachments -> ESCALATED_TO_LEGAL"
          - "Case closed; compensation_committed_cents released for non-accepted offers"

      - from: INTAKE
        to: CLOSED_ABANDONED
        trigger: POST /easement-cases/{caseId}/abandon
        actor: DepartmentDirector
        preconditions:
          - "Case has no RECORDED EasementDocument (ERR_RECORDED_DOCUMENT_EXISTS)"
        side_effects: []

  - entity: EasementDocument
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED_DEFECTIVE]
    transitions:
      - from: DRAFT
        to: RECORDED
        trigger: POST /easement-cases/{caseId}/documents/{docId}/record
        actor: TitleExaminer
        preconditions:
          - "EasementCase.status IN {MAPPING, ACTIVE_MONITORING, RESOLUTION_PENDING} (ERR_CASE_NOT_OPEN_FOR_RECORDING)"
          - "instrument_number is unique across the county (ERR_DUPLICATE_INSTRUMENT_NUMBER)"
        side_effects:
          - "encumbrance_rank computed: rank among case's RECORDED documents by recording_date ASC, tie created_at ASC"
          - "If this document's supersedes_document_id is set: superseded document -> SUPERSEDED, its rank freed"
          - "Case.title_cleared recomputed"

      - from: DRAFT
        to: REJECTED_DEFECTIVE
        trigger: POST /easement-cases/{caseId}/documents/{docId}/reject-defective
        actor: TitleExaminer
        preconditions:
          - "Document is in DRAFT"
        side_effects: []

      - from: RECORDED
        to: SUPERSEDED
        trigger: "system (automatic when another document with supersedes_document_id == this.id is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "encumbrance_rank freed"
          - "Any Encroachment whose encroaches_document_id == this.id remains, but its severity_tier is recomputed against the superseding document's width_ft"

  - entity: Encroachment
    initial_state: DISCOVERED
    terminal_states: [REMOVED, PERMITTED_RETROACTIVELY, WAIVED, ESCALATED_TO_LEGAL]
    transitions:
      - from: DISCOVERED
        to: NOTIFIED
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/notify
        actor: RightOfWayAgent
        preconditions:
          - "EasementCase.status IN {ACTIVE_MONITORING, RESOLUTION_PENDING} (ERR_CASE_NOT_MONITORING)"
        side_effects:
          - "owner_response_due_date = now + OWNER_RESPONSE_WINDOW_DAYS"

      - from: NOTIFIED
        to: NEGOTIATING
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/begin-negotiation
        actor: RightOfWayAgent
        preconditions:
          - "Encroachment is NOTIFIED"
        side_effects:
          - "negotiation_round incremented to 1"

      - from: NEGOTIATING
        to: COUNTERED
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/counter
        actor: RightOfWayAgent
        preconditions:
          - "Encroachment is NEGOTIATING"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_ROUNDS_EXHAUSTED)"
        side_effects:
          - "negotiation_round incremented by 1"

      - from: COUNTERED
        to: NEGOTIATING
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/resume-negotiation
        actor: RightOfWayAgent
        preconditions:
          - "Encroachment is COUNTERED"
        side_effects: []

      - from: NEGOTIATING
        to: REMOVAL_AGREED
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/agree-removal
        actor: RightOfWayAgent
        preconditions:
          - "Encroachment is NEGOTIATING or COUNTERED"
        side_effects:
          - "If encroachment_type == VEGETATION: linked VegetationViolation (if any) -> NOTIFIED"

      - from: COUNTERED
        to: REMOVAL_AGREED
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/agree-removal
        actor: RightOfWayAgent
        preconditions: []
        side_effects:
          - "If encroachment_type == VEGETATION: linked VegetationViolation (if any) -> NOTIFIED"

      - from: REMOVAL_AGREED
        to: REMOVED
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/confirm-removal
        actor: RightOfWayAgent
        preconditions:
          - "EasementCase.status IN {ACTIVE_MONITORING, RESOLUTION_PENDING}"
        side_effects:
          - "open_encroachment_count decremented"
          - "encroachment_pressure_score recomputed"
          - "If open_encroachment_count drops to 0: case RESOLUTION_PENDING -> ACTIVE_MONITORING"

      - from: NEGOTIATING
        to: ESCALATED_TO_LEGAL
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/escalate
        actor: RightOfWayAgent
        preconditions:
          - "negotiation_round >= MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_ROUNDS_NOT_EXHAUSTED)"
        side_effects:
          - "A LitigationReferral is auto-created (REFERRED, referral_reason=NEGOTIATION_FAILED)"

      - from: COUNTERED
        to: ESCALATED_TO_LEGAL
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/escalate
        actor: RightOfWayAgent
        preconditions:
          - "negotiation_round >= MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "A LitigationReferral is auto-created (REFERRED, referral_reason=NEGOTIATION_FAILED)"

      - from: NOTIFIED
        to: ESCALATED_TO_LEGAL
        trigger: "system (automatic when owner_response_due_date passes with no begin-negotiation)"
        actor: system
        preconditions: []
        side_effects:
          - "A LitigationReferral is auto-created (REFERRED, referral_reason=NEGOTIATION_FAILED)"

      - from: NEGOTIATING
        to: PERMITTED_RETROACTIVELY
        trigger: "system (automatic when ThirdPartyPermit for this encroachment becomes APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "open_encroachment_count decremented"
          - "encroachment_pressure_score recomputed"

      - from: NEGOTIATING
        to: WAIVED
        trigger: POST /easement-cases/{caseId}/encroachments/{encId}/waive
        actor: DepartmentDirector
        preconditions:
          - "severity_tier == MINOR (ERR_ONLY_MINOR_WAIVABLE)"
        side_effects:
          - "open_encroachment_count decremented"
          - "encroachment_pressure_score recomputed"

  - entity: AcquisitionOffer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED_BY_OWNER, EXPIRED, CONDEMNATION_REFERRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: TENDERED
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/tender
        actor: RightOfWayAgent
        preconditions:
          - "EasementCase.status IN {MAPPING, ACTIVE_MONITORING, RESOLUTION_PENDING}"
          - "title_cleared == true (ERR_TITLE_NOT_CLEARED)"
          - "total_compensation_cents <= compensation_balance_cents (ERR_COMPENSATION_EXCEEDS_BUDGET)"
          - "If requires_director_approval == true: offer cannot be tendered by the same user who created it (ERR_NEGOTIATOR_CANNOT_APPROVE_OWN_OFFER)"
        side_effects:
          - "compensation_committed_cents += total_compensation_cents"
          - "compensation_balance_cents recomputed"
          - "negotiation_deadline = now + NEGOTIATION_WINDOW_DAYS"

      - from: TENDERED
        to: COUNTERED
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/counter
        actor: RightOfWayAgent
        preconditions:
          - "AcquisitionOffer is TENDERED"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_ROUNDS_EXHAUSTED)"
        side_effects:
          - "negotiation_round incremented by 1"
          - "negotiated_compensation_cents updated to counter amount"
          - "total_compensation_cents recomputed"
          - "compensation_committed_cents adjusted by delta (new_total - old_total)"
          - "requires_director_approval recomputed"

      - from: COUNTERED
        to: TENDERED
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/re-tender
        actor: RightOfWayAgent
        preconditions:
          - "AcquisitionOffer is COUNTERED"
        side_effects:
          - "negotiated_compensation_cents updated to new tender amount"
          - "total_compensation_cents recomputed"
          - "compensation_committed_cents adjusted by delta"

      - from: TENDERED
        to: ACCEPTED
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/accept
        actor: RightOfWayAgent
        preconditions:
          - "AcquisitionOffer is TENDERED or COUNTERED"
          - "If requires_director_approval == true: acting user must be DepartmentDirector (ERR_DIRECTOR_APPROVAL_REQUIRED)"
        side_effects:
          - "compensation_committed_cents unchanged (offer remains committed until case closes)"
          - "A new EasementDocument of kind=DEED is auto-created in DRAFT for the acquired strip"

      - from: COUNTERED
        to: ACCEPTED
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/accept
        actor: RightOfWayAgent
        preconditions:
          - "If requires_director_approval == true: acting user must be DepartmentDirector"
        side_effects:
          - "Same as TENDERED -> ACCEPTED"

      - from: TENDERED
        to: REJECTED_BY_OWNER
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/reject
        actor: RightOfWayAgent
        preconditions: []
        side_effects:
          - "compensation_committed_cents -= total_compensation_cents (released)"
          - "compensation_balance_cents recomputed"

      - from: COUNTERED
        to: REJECTED_BY_OWNER
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/reject
        actor: RightOfWayAgent
        preconditions: []
        side_effects:
          - "compensation_committed_cents -= total_compensation_cents"

      - from: TENDERED
        to: EXPIRED
        trigger: "system (automatic when negotiation_deadline passes)"
        actor: system
        preconditions: []
        side_effects:
          - "compensation_committed_cents -= total_compensation_cents"

      - from: COUNTERED
        to: EXPIRED
        trigger: "system (automatic when negotiation_deadline passes)"
        actor: system
        preconditions: []
        side_effects:
          - "compensation_committed_cents -= total_compensation_cents"

      - from: EXPIRED
        to: CONDEMNATION_REFERRED
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/refer-to-condemnation
        actor: DepartmentDirector
        preconditions:
          - "Offer is EXPIRED or REJECTED_BY_OWNER"
        side_effects:
          - "A LitigationReferral is auto-created (REFERRED, referral_reason=CONDEMNATION)"

      - from: REJECTED_BY_OWNER
        to: CONDEMNATION_REFERRED
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/refer-to-condemnation
        actor: DepartmentDirector
        preconditions: []
        side_effects:
          - "A LitigationReferral is auto-created (REFERRED, referral_reason=CONDEMNATION)"

      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/withdraw
        actor: RightOfWayAgent
        preconditions: []
        side_effects: []

      - from: TENDERED
        to: WITHDRAWN
        trigger: POST /easement-cases/{caseId}/offers/{offerId}/withdraw
        actor: RightOfWayAgent
        preconditions: []
        side_effects:
          - "compensation_committed_cents -= total_compensation_cents"

  - entity: ThirdPartyPermit
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED]
    # Parallel dimensions: approval_status and field_inspection_status evolve semi-independently.
    transitions:
      # --- approval_status dimension ---
      - from: PENDING
        to: APPROVED
        trigger: POST /easement-cases/{caseId}/permits/{permitId}/approve
        actor: RightOfWayAgent
        preconditions:
          - "EasementCase.status IN {ACTIVE_MONITORING, RESOLUTION_PENDING}"
          - "field_inspection_status == PASSED (ERR_INSPECTION_NOT_PASSED)"
          - "insurance_certificate_on_file == true (ERR_INSURANCE_REQUIRED)"
          - "No temporal overlap with another APPROVED permit on the same case covering the same area (ERR_PERMIT_OVERLAP)"
          - "If encroachment_id is set: that Encroachment must be NEGOTIATING or COUNTERED (ERR_ENCROACHMENT_NOT_NEGOTIATING)"
        side_effects:
          - "If encroachment_id set: Encroachment -> PERMITTED_RETROACTIVELY"
          - "active_permit_count recomputed"
          - "annual_fee_cents computed"

      - from: PENDING
        to: DENIED
        trigger: POST /easement-cases/{caseId}/permits/{permitId}/deny
        actor: RightOfWayAgent
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: REVOKED
        trigger: POST /easement-cases/{caseId}/permits/{permitId}/revoke
        actor: DepartmentDirector
        preconditions:
          - "field_inspection_status == FAILED (ERR_ONLY_FAILED_INSPECTION_REVOKABLE)"
        side_effects:
          - "active_permit_count recomputed"
          - "If encroachment_id set: Encroachment reverts to NEGOTIATING, open_encroachment_count incremented"

      # --- field_inspection_status dimension ---
      - from: NOT_SCHEDULED
        to: SCHEDULED
        trigger: POST /easement-cases/{caseId}/permits/{permitId}/schedule-inspection
        actor: VegetationInspector
        preconditions:
          - "approval_status == PENDING"
        side_effects: []

      - from: SCHEDULED
        to: PASSED
        trigger: POST /easement-cases/{caseId}/permits/{permitId}/record-inspection
        actor: VegetationInspector
        preconditions:
          - "field_inspection_status == SCHEDULED"
        side_effects: []

      - from: SCHEDULED
        to: FAILED
        trigger: POST /easement-cases/{caseId}/permits/{permitId}/record-inspection
        actor: VegetationInspector
        preconditions:
          - "field_inspection_status == SCHEDULED"
        side_effects:
          - "If approval_status == APPROVED: approval_status -> REVOKED (auto)"

  - entity: VegetationZone
    initial_state: ACTIVE_MONITORING
    terminal_states: [CLEARED]
    transitions:
      - from: ACTIVE_MONITORING
        to: VIOLATION_DETECTED
        trigger: "system (automatic on first VegetationViolation created)"
        actor: system
        preconditions: []
        side_effects:
          - "violation_count incremented"

      - from: VIOLATION_DETECTED
        to: REMEDIATION_REQUIRED
        trigger: "system (automatic when violation_count >= VIOLATION_REMEDIATION_THRESHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "All open violations in zone get remediation_deadline set (or refreshed)"

      - from: REMEDIATION_REQUIRED
        to: CLEARED
        trigger: "system (automatic when all violations in zone reach terminal state)"
        actor: system
        preconditions: []
        side_effects: []

      - from: VIOLATION_DETECTED
        to: CLEARED
        trigger: "system (automatic when all violations in zone reach terminal state)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VegetationViolation
    initial_state: DETECTED
    terminal_states: [REMEDIATED, ESCALATED_TO_LEGAL, EXEMPTED]
    transitions:
      - from: DETECTED
        to: NOTIFIED
        trigger: POST /easement-cases/{caseId}/vegetation-zones/{zoneId}/violations/{violId}/notify
        actor: VegetationInspector
        preconditions: []
        side_effects:
          - "remediation_deadline = now + REMEDIATION_WINDOW_DAYS"

      - from: NOTIFIED
        to: REMEDIATED
        trigger: POST /easement-cases/{caseId}/vegetation-zones/{zoneId}/violations/{violId}/confirm-remediation
        actor: VegetationInspector
        preconditions: []
        side_effects:
          - "zone.violation_count decremented"
          - "If zone.violation_count drops below VIOLATION_REMEDIATION_THRESHOLD: zone REMEDIATION_REQUIRED -> VIOLATION_DETECTED"
          - "If zone.violation_count drops to 0: zone -> CLEARED"

      - from: NOTIFIED
        to: ESCALATED_TO_LEGAL
        trigger: "system (automatic when remediation_deadline passes)"
        actor: system
        preconditions: []
        side_effects:
          - "A LitigationReferral is auto-created (REFERRED, referral_reason=VEGETATION_REMEDIATION_FAILED)"

      - from: DETECTED
        to: EXEMPTED
        trigger: POST /easement-cases/{caseId}/vegetation-zones/{zoneId}/violations/{violId}/exempt
        actor: DepartmentDirector
        preconditions:
          - "species is NOT in zone.prohibited_species (ERR_PROHIBITED_SPECIES_NOT_EXEMPTABLE)"
          - "excess_height_ft <= EXEMPTABLE_HEIGHT_MARGIN_FT (ERR_EXCESS_HEIGHT_TOO_LARGE)"
        side_effects:
          - "zone.violation_count decremented"

  - entity: TitleSearchTask
    initial_state: ORDERED
    terminal_states: [COMPLETED_CLEAN, COMPLETED_WITH_DEFECTS, CANCELLED]
    transitions:
      - from: ORDERED
        to: IN_PROGRESS
        trigger: POST /easement-cases/{caseId}/title-searches/{taskId}/begin
        actor: TitleExaminer
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED_CLEAN
        trigger: POST /easement-cases/{caseId}/title-searches/{taskId}/complete
        actor: TitleExaminer
        preconditions:
          - "liens_found == 0 AND defects_found == 0 (ERR_TITLE_DEFECTS_EXIST)"
        side_effects:
          - "case.title_cleared recomputed (true if this is the latest task and it is COMPLETED_CLEAN)"

      - from: IN_PROGRESS
        to: COMPLETED_WITH_DEFECTS
        trigger: POST /easement-cases/{caseId}/title-searches/{taskId}/complete
        actor: TitleExaminer
        preconditions:
          - "liens_found > 0 OR defects_found > 0"
        side_effects:
          - "case.title_cleared = false"
          - "Any AcquisitionOffer in {DRAFT} on this case is blocked from tender until a clean search completes"

      - from: ORDERED
        to: CANCELLED
        trigger: POST /easement-cases/{caseId}/title-searches/{taskId}/cancel
        actor: TitleExaminer
        preconditions: []
        side_effects: []

  - entity: LitigationReferral
    initial_state: REFERRED
    terminal_states: [SETTLED, JUDGMENT_OBTAINED, WITHDRAWN]
    transitions:
      - from: REFERRED
        to: ACCEPTED
        trigger: POST /easement-cases/{caseId}/litigation-referrals/{refId}/accept
        actor: LitigationCounsel
        preconditions: []
        side_effects:
          - "filing_deadline = now + FILING_WINDOW_DAYS"

      - from: ACCEPTED
        to: FILED
        trigger: POST /easement-cases/{caseId}/litigation-referrals/{refId}/file
        actor: LitigationCounsel
        preconditions:
          - "Referral is ACCEPTED"
        side_effects: []

      - from: FILED
        to: SETTLED
        trigger: POST /easement-cases/{caseId}/litigation-referrals/{refId}/settle
        actor: LitigationCounsel
        preconditions: []
        side_effects:
          - "If referral_reason == CONDEMNATION: linked AcquisitionOffer's compensation finalized; case may proceed to CLOSED_CONDEMNED"
          - "If referral_reason == NEGOTIATION_FAILED: linked Encroachment -> REMOVED (court-ordered removal)"

      - from: FILED
        to: JUDGMENT_OBTAINED
        trigger: POST /easement-cases/{caseId}/litigation-referrals/{refId}/record-judgment
        actor: LitigationCounsel
        preconditions: []
        side_effects:
          - "If referral_reason == NEGOTIATION_FAILED: linked Encroachment -> REMOVED"
          - "If referral_reason == VEGETATION_REMEDIATION_FAILED: linked VegetationViolation -> REMEDIATED"
          - "If referral_reason == CONDEMNATION: case -> CLOSED_CONDEMNED"

      - from: REFERRED
        to: WITHDRAWN
        trigger: POST /easement-cases/{caseId}/litigation-referrals/{refId}/withdraw
        actor: LitigationCounsel
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: offer-tender-stale-case
    parent_entity: EasementCase
    write_endpoint: POST /easement-cases/{caseId}/offers/{offerId}/tender
    occ_field: expected_case_version
    description: |
      Tendering an AcquisitionOffer against an EasementCase whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just recorded a new EasementDocument (which
      legitimately alters title_cleared and compensation balance) and the
      current writer's view of the case is therefore stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: permit-approve-stale-case
    parent_entity: EasementCase
    write_endpoint: POST /easement-cases/{caseId}/permits/{permitId}/approve
    occ_field: expected_case_version
    description: |
      Approving a ThirdPartyPermit against an EasementCase whose version has
      advanced since the client last observed it is rejected. A newly recorded
      document or a newly discovered encroachment may change the permit's
      eligibility (e.g. title_cleared flipped), so the approver's stale view
      must not silently succeed.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: encroachment-notify-stale-case
    parent_entity: EasementCase
    write_endpoint: POST /easement-cases/{caseId}/encroachments/{encId}/notify
    occ_field: expected_case_version
    description: |
      Sending an encroachment notice against an EasementCase whose version has
      advanced since the client last observed it is rejected. A newly recorded
      superseding document may change the encroachment's severity_tier, so the
      notifier's stale view must not silently succeed.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: base_compensation
    trigger: "AcquisitionOffer creation"
    algorithm: forward_looking
    formula: |
      base_compensation_cents = round_half_up(offered_area_sqft * fair_market_value_per_sqft * 100)
    precision: "integer cents, round_half_up"

  - name: total_compensation
    trigger: "AcquisitionOffer create, counter, re-tender"
    algorithm: aggregation
    formula: |
      total_compensation_cents = negotiated_compensation_cents + severance_damages_cents
      # negotiated_compensation_cents is initialized to base_compensation_cents at creation,
      # then overwritten by counter/re-tender payloads.
    precision: "integer cents"

  - name: compensation_balance
    trigger: "AcquisitionOffer tender, counter, re-tender, reject, withdraw, expire, accept"
    algorithm: aggregation
    formula: |
      compensation_committed_cents = SUM(total_compensation_cents)
        for offers with status IN {TENDERED, COUNTERED, ACCEPTED}
      compensation_balance_cents = acquisition_budget_cents - compensation_committed_cents
    precision: "integer cents"
    variants:
      - name: provisional_view
        when: "During negotiation (offer in TENDERED or COUNTERED)"
        difference: "committed includes the offer's current negotiated total"
      - name: final_view
        when: "After offer is ACCEPTED and case closes"
        difference: "committed includes accepted offers only; rejected/withdrawn/expired are released"

  - name: severity_tier
    trigger: "Encroachment creation; when encroaches_document_id's width_ft changes (supersede)"
    algorithm: threshold
    formula: |
      depth_ratio = depth_into_easement_ft / encroaching_document.width_ft
      area_ratio  = encroachment_area_sqft / case.easement_area_sqft

      if encroachment_type == UTILITY_CROSSING:
        base_score = 4
      elif encroachment_type == STRUCTURE:
        base_score = 3
      elif encroachment_type == FENCE or PAVEMENT:
        base_score = 2
      else:  # VEGETATION, OTHER
        base_score = 1

      # Non-linear interaction: depth matters more when area is large
      if area_ratio >= 0.25:
        depth_multiplier = 2.0
      elif area_ratio >= 0.10:
        depth_multiplier = 1.5
      else:
        depth_multiplier = 1.0

      raw_score = base_score * (1 + depth_ratio * depth_multiplier)

      if raw_score >= 6.0: severity_tier = CRITICAL
      elif raw_score >= 3.5: severity_tier = SEVERE
      elif raw_score >= 1.8: severity_tier = MODERATE
      else: severity_tier = MINOR
    constants:
      AREA_TIER_1: 0.10
      AREA_TIER_2: 0.25
    precision: "score to 3 decimal places, tier pinned at exact thresholds (>=)"
    variants:
      - name: provisional_severity
        when: "Computed at encroachment creation"
        difference: "Uses the currently-RECORDED document's width_ft"
      - name: re_derived_severity
        when: "When the encroached document is superseded by a new RECORDED document"
        difference: "Recomputed using the superseding document's width_ft; may upgrade or downgrade the tier"

  - name: encroachment_pressure_score
    trigger: "Encroachment create, terminal transition, severity_tier change"
    algorithm: weighted_scoring
    formula: |
      score = 0
      for each Encroachment on the case with status NOT IN {REMOVED, PERMITTED_RETROACTIVELY, WAIVED, ESCALATED_TO_LEGAL}:
        tier_weight = { MINOR: 1, MODERATE: 3, SEVERE: 7, CRITICAL: 15 }[severity_tier]
        age_days = floor((now - encroachment.created_at) / 86400)
        # decay: unresolved pressure compounds
        age_multiplier = 1 + min(age_days, 90) * 0.01
        score += tier_weight * age_multiplier
      encroachment_pressure_score = round_half_up(score, 2)
    precision: "2 decimal places, round_half_up"

  - name: permit_fee
    trigger: "ThirdPartyPermit approval"
    algorithm: tiered_pricing
    formula: |
      # Tiered by permit_type and requested_area_sqft
      # Nested rounding: round per-tier then sum (pinned order)
      base_rates = {
        DRIVEWAY: 25000,          # cents per year
        LANDSCAPING: 10000,
        FENCE_RETENTION: 15000,
        STRUCTURE_RETENTION: 50000,
        UTILITY_CROSSING: 75000
      }
      base = base_rates[permit_type]

      # Area tiers (sqft): 0-500, 501-2000, 2001+
      if requested_area_sqft <= 500:
        area_component = round_half_up(requested_area_sqft * 12)   # 12 cents/sqft
      elif requested_area_sqft <= 2000:
        area_component = round_half_up(500 * 12 + (requested_area_sqft - 500) * 8)
      else:
        area_component = round_half_up(500 * 12 + 1500 * 8 + (requested_area_sqft - 2000) * 5)

      annual_fee_cents = base + area_component
    precision: "integer cents; per-tier round_half_up before summing (pinned)"
    key_insight: |
      Per-tier rounding (round each tier's component then sum) differs from
      sum-then-round by up to 2 cents for areas straddling tier boundaries.

  - name: encumbrance_rank
    trigger: "EasementDocument record; supersede"
    algorithm: chronological
    formula: |
      Among the case's documents with status == RECORDED:
        sort by recording_date ASC
        tie-break: created_at ASC (never id)
      encumbrance_rank = 1-based position in this ordering
      A superseded document keeps its last rank until it transitions to SUPERSEDED, then its rank is freed.
    key_insight: "Rank determines priority for conflicting encroachment claims; ties must never use id"

  - name: vegetation_excess_height
    trigger: "VegetationViolation creation"
    algorithm: aggregation
    formula: |
      applicable_limit = zone.wire_zone_width_ft > 0 and location_within_zone == WIRE_ZONE
        ? zone.max_allowed_height_ft * 0.5   # wire zone is stricter: half the max height
        : zone.max_allowed_height_ft
      excess_height_ft = max(0, observed_height_ft - applicable_limit)
    precision: "1 decimal place, round_half_up"

  - name: title_clearance_check
    trigger: "TitleSearchTask complete; EasementDocument record"
    algorithm: aggregation
    formula: |
      latest_task = the TitleSearchTask for the case with the greatest created_at
        (tie-break: created_at ASC, never id)
      title_cleared = (latest_task.status == COMPLETED_CLEAN)
        AND (at least one EasementDocument on the case is RECORDED)
    key_insight: "A clean title search alone is insufficient; a recorded document must also exist"

  - name: overlap_window_check
    trigger: "ThirdPartyPermit approval"
    algorithm: interval_merge
    formula: |
      # Reject if [requested_start_date, requested_end_date) overlaps any other APPROVED
      # permit on the same case whose permit_type is the same OR whose area intersects.
      # Adjacent intervals (end == start) do NOT overlap (half-open).
      # Buffer: a 30-day maintenance buffer is added around STRUCTURE_RETENTION permits.
      buffer_days = 30 if permit_type == STRUCTURE_RETENTION else 0
      effective_start = requested_start_date - buffer_days*86400
      effective_end   = requested_end_date + buffer_days*86400
      overlap = effective_start < other.requested_end_date AND other.requested_start_date < effective_end
    key_insight: "STRUCTURE_RETENTION gets a 30-day buffer; other types use exact half-open adjacency"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for the requested endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist, validated left-to-right"
    error_id: ERR_CASE_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_ENCROACHMENT_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_ZONE_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_TITLE_TASK_NOT_FOUND | ERR_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: all nested endpoints
    note: "Validate caseId first, then child id; return on first not found"

  - priority: 4
    category: state
    check: "Parent EasementCase must be in a state that permits the child operation"
    error_id: ERR_CASE_NOT_OPEN_FOR_RECORDING | ERR_CASE_NOT_MONITORING | ERR_CASE_ALREADY_CLOSED
    http_status: 409
    applies_to: "child creates and transitions"

  - priority: 5
    category: state
    check: "Target resource must be in the correct state for this transition"
    error_id: "ERR_INVALID_STATE (specific per entity, e.g. ERR_OFFER_NOT_TENDERED, ERR_ENCROACHMENT_NOT_NEGOTIATING, ERR_PERMIT_NOT_PENDING, ERR_TASK_NOT_IN_PROGRESS)"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Referenced document/encroachment must exist and belong to the same case"
    error_id: ERR_CROSS_CASE_REFERENCE
    http_status: 409
    applies_to: "POST encroachments, POST permits, POST referrals"

  - priority: 7
    category: business_safety
    check: "Title must be cleared (latest TitleSearchTask COMPLETED_CLEAN) before recording documents, tendering offers, or activating monitoring"
    error_id: ERR_TITLE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /documents/{id}/record, POST /offers/{id}/tender, POST /cases/{id}/activate-monitoring"

  - priority: 8
    category: business_constraint
    check: "Uniqueness and referential integrity: instrument_number unique per county; encroaches_document_id must be RECORDED; supersedes_document_id must be RECORDED and not self"
    error_id: ERR_DUPLICATE_INSTRUMENT_NUMBER | ERR_DOCUMENT_NOT_RECORDED | ERR_SELF_SUPERSEDE
    http_status: 409
    applies_to: "POST /documents, POST /documents/{id}/record"

  - priority: 9
    category: business_temporal
    check: "Temporal validity: recording_date not in future; requested_end_date > requested_start_date; negotiation_deadline not passed"
    error_id: ERR_INVALID_DATE_RANGE | ERR_DEADLINE_PASSED
    http_status: 422
    applies_to: "document create, permit create/approve, offer counter"

  - priority: 10
    category: business_constraint
    check: "Segregation of duties: the user who created an AcquisitionOffer cannot tender it when requires_director_approval is true; only DepartmentDirector can accept high-compensation offers"
    error_id: ERR_NEGOTIATOR_CANNOT_APPROVE_OWN_OFFER | ERR_DIRECTOR_APPROVAL_REQUIRED
    http_status: 403
    applies_to: "POST /offers/{id}/tender, POST /offers/{id}/accept"

  - priority: 11
    category: business_constraint
    check: "Negotiation rounds: counter/re-tender allowed only while negotiation_round < MAX_NEGOTIATION_ROUNDS; escalate allowed only when rounds exhausted"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED | ERR_NEGOTIATION_ROUNDS_NOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /offers/{id}/counter, POST /encroachments/{id}/counter, POST /encroachments/{id}/escalate"

  - priority: 12
    category: business_temporal
    check: "Permit overlap: no two APPROVED permits on the same case may cover overlapping windows for the same permit_type; STRUCTURE_RETENTION gets 30-day buffer"
    error_id: ERR_PERMIT_OVERLAP
    http_status: 409
    applies_to: "POST /permits/{id}/approve"

  - priority: 13
    category: business_safety
    check: "Vegetation: violation may be exempted only when species not prohibited and excess_height_ft <= EXEMPTABLE_HEIGHT_MARGIN_FT"
    error_id: ERR_PROHIBITED_SPECIES_NOT_EXEMPTABLE | ERR_EXCESS_HEIGHT_TOO_LARGE
    http_status: 409
    applies_to: "POST /violations/{id}/exempt"

  - priority: 14
    category: business_fiscal
    check: "Fiscal: total_compensation_cents of a tendered/countered offer must not exceed compensation_balance_cents"
    error_id: ERR_COMPENSATION_EXCEEDS_BUDGET
    http_status: 402
    applies_to: "POST /offers/{id}/tender, POST /offers/{id}/counter, POST /offers/{id}/re-tender"

  - priority: 15
    category: business_constraint
    check: "Closure gate: case cannot close while open encroachments, open offers, pending permits, or pending litigation exist"
    error_id: ERR_OPEN_ENCROACHMENTS_REMAIN | ERR_OPEN_OFFERS_EXIST | ERR_PENDING_PERMITS_EXIST | ERR_PENDING_LITIGATION_EXISTS
    http_status: 409
    applies_to: "POST /cases/{id}/close-case"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- EasementCase ---
  - method: POST
    path: "/easement-cases"
    description: "Create a new easement case"
    roles: [RightOfWayAgent]
    code: 201
    input: [case_code, utility_district, county, parcel_id, easement_width_ft, easement_area_sqft, fair_market_value_per_sqft, acquisition_budget_cents]
    output: EasementCase
    side_effects: ["compensation_committed_cents=0, compensation_balance_cents=acquisition_budget_cents, open_encroachment_count=0, encroachment_pressure_score=0, title_cleared=false, active_permit_count=0, status=INTAKE"]

  - method: GET
    path: "/easement-cases"
    description: "List easement cases"
    roles: [RightOfWayAgent, TitleExaminer, VegetationInspector, LitigationCounsel, DepartmentDirector]
    code: 200
    input: ["status?", "county?", "limit?", "offset?"]
    output: "EasementCase[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}"
    description: "Get one easement case"
    roles: [RightOfWayAgent, TitleExaminer, VegetationInspector, LitigationCounsel, DepartmentDirector]
    code: 200
    input: []
    output: EasementCase
    side_effects: []

  - method: POST
    path: "/easement-cases/{caseId}/begin-mapping"
    description: "Transition case INTAKE -> MAPPING"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: EasementCase
    side_effects: ["status -> MAPPING"]

  - method: POST
    path: "/easement-cases/{caseId}/activate-monitoring"
    description: "Transition case MAPPING -> ACTIVE_MONITORING"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: EasementCase
    side_effects: ["title_cleared recomputed", "status -> ACTIVE_MONITORING"]

  - method: POST
    path: "/easement-cases/{caseId}/close-case"
    description: "Transition case ACTIVE_MONITORING -> CLOSED_RESOLVED"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: EasementCase
    side_effects: ["VegetationZones -> CLEARED", "compensation finalized"]

  - method: POST
    path: "/easement-cases/{caseId}/condemn"
    description: "Transition case RESOLUTION_PENDING -> CLOSED_CONDEMNED"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: EasementCase
    side_effects: ["Open encroachments -> ESCALATED_TO_LEGAL", "Non-accepted offers released"]

  - method: POST
    path: "/easement-cases/{caseId}/abandon"
    description: "Transition case INTAKE -> CLOSED_ABANDONED"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: EasementCase
    side_effects: []

  # --- EasementDocument ---
  - method: POST
    path: "/easement-cases/{caseId}/documents"
    description: "Create an easement document (DRAFT)"
    roles: [TitleExaminer]
    code: 201
    input: [doc_kind, instrument_number, recording_date, grantor_name, grantee_name, gis_polygon_wkt, width_ft, "supersedes_document_id?"]
    output: EasementDocument
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}/documents"
    description: "List documents for a case"
    roles: [RightOfWayAgent, TitleExaminer, LitigationCounsel, DepartmentDirector]
    code: 200
    input: ["status?", "doc_kind?", "limit?", "offset?"]
    output: "EasementDocument[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}/documents/{docId}"
    description: "Get one document"
    roles: [RightOfWayAgent, TitleExaminer, LitigationCounsel, DepartmentDirector]
    code: 200
    input: []
    output: EasementDocument
    side_effects: []

  - method: POST
    path: "/easement-cases/{caseId}/documents/{docId}/record"
    description: "Record a DRAFT document"
    roles: [TitleExaminer]
    code: 200
    input: []
    output: EasementDocument
    side_effects: ["status -> RECORDED", "encumbrance_rank computed", "superseded doc -> SUPERSEDED", "case.title_cleared recomputed"]

  - method: POST
    path: "/easement-cases/{caseId}/documents/{docId}/reject-defective"
    description: "Reject a DRAFT document as defective"
    roles: [TitleExaminer]
    code: 200
    input: []
    output: EasementDocument
    side_effects: ["status -> REJECTED_DEFECTIVE"]

  # --- Encroachment ---
  - method: POST
    path: "/easement-cases/{caseId}/encroachments"
    description: "Report a discovered encroachment"
    roles: [RightOfWayAgent]
    code: 201
    input: [discovered_via, encroachment_type, encroachment_area_sqft, depth_into_easement_ft, encroaches_document_id, estimated_removal_cost_cents]
    output: Encroachment
    side_effects: ["severity_tier computed", "open_encroachment_count incremented", "encroachment_pressure_score recomputed", "case ACTIVE_MONITORING -> RESOLUTION_PENDING"]

  - method: GET
    path: "/easement-cases/{caseId}/encroachments"
    description: "List encroachments for a case"
    roles: [RightOfWayAgent, VegetationInspector, LitigationCounsel, DepartmentDirector]
    code: 200
    input: ["status?", "severity_tier?", "limit?", "offset?"]
    output: "Encroachment[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}/encroachments/{encId}"
    description: "Get one encroachment"
    roles: [RightOfWayAgent, VegetationInspector, LitigationCounsel, DepartmentDirector]
    code: 200
    input: []
    output: Encroachment
    side_effects: []

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/notify"
    description: "Send encroachment notice (DISCOVERED -> NOTIFIED)"
    roles: [RightOfWayAgent]
    code: 200
    input: [expected_case_version]
    output: Encroachment
    side_effects: ["status -> NOTIFIED", "owner_response_due_date set", "increments EasementCase.version by 1"]

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/begin-negotiation"
    description: "Begin negotiation (NOTIFIED -> NEGOTIATING)"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: Encroachment
    side_effects: ["status -> NEGOTIATING", "negotiation_round = 1"]

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/counter"
    description: "Record a counter-offer (NEGOTIATING -> COUNTERED)"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: Encroachment
    side_effects: ["status -> COUNTERED", "negotiation_round incremented"]

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/resume-negotiation"
    description: "Resume after counter (COUNTERED -> NEGOTIATING)"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: Encroachment
    side_effects: ["status -> NEGOTIATING"]

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/agree-removal"
    description: "Reach removal agreement (NEGOTIATING|COUNTERED -> REMOVAL_AGREED)"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: Encroachment
    side_effects: ["status -> REMOVAL_AGREED", "linked VegetationViolation -> NOTIFIED"]

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/confirm-removal"
    description: "Confirm removal (REMOVAL_AGREED -> REMOVED)"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: Encroachment
    side_effects: ["status -> REMOVED", "open_encroachment_count decremented", "case may auto-revert to ACTIVE_MONITORING"]

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/escalate"
    description: "Escalate to legal (NEGOTIATING|COUNTERED -> ESCALATED_TO_LEGAL)"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: Encroachment
    side_effects: ["status -> ESCALATED_TO_LEGAL", "LitigationReferral auto-created"]

  - method: POST
    path: "/easement-cases/{caseId}/encroachments/{encId}/waive"
    description: "Waive a MINOR encroachment"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: Encroachment
    side_effects: ["status -> WAIVED", "open_encroachment_count decremented"]

  # --- AcquisitionOffer ---
  - method: POST
    path: "/easement-cases/{caseId}/offers"
    description: "Create an acquisition offer (DRAFT)"
    roles: [RightOfWayAgent]
    code: 201
    input: [landowner_name, landowner_contact, offered_area_sqft, "severance_damages_cents?"]
    output: AcquisitionOffer
    side_effects: ["base_compensation_cents computed", "negotiated_compensation_cents initialized to base", "total_compensation_cents computed", "requires_director_approval computed"]

  - method: GET
    path: "/easement-cases/{caseId}/offers"
    description: "List offers for a case"
    roles: [RightOfWayAgent, DepartmentDirector, LitigationCounsel]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AcquisitionOffer[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}/offers/{offerId}"
    description: "Get one offer"
    roles: [RightOfWayAgent, DepartmentDirector, LitigationCounsel]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects: []

  - method: POST
    path: "/easement-cases/{caseId}/offers/{offerId}/tender"
    description: "Tender an offer (DRAFT -> TENDERED)"
    roles: [RightOfWayAgent]
    code: 200
    input: [expected_case_version]
    output: AcquisitionOffer
    side_effects: ["compensation_committed_cents += total", "negotiation_deadline set", "increments EasementCase.version by 1"]

  - method: POST
    path: "/easement-cases/{caseId}/offers/{offerId}/counter"
    description: "Counter an offer (TENDERED -> COUNTERED)"
    roles: [RightOfWayAgent]
    code: 200
    input: [counter_amount_cents]
    output: AcquisitionOffer
    side_effects: ["negotiated_compensation_cents updated", "total recomputed", "committed adjusted by delta", "negotiation_round incremented", "requires_director_approval recomputed"]

  - method: POST
    path: "/easement-cases/{caseId}/offers/{offerId}/re-tender"
    description: "Re-tender after counter (COUNTERED -> TENDERED)"
    roles: [RightOfWayAgent]
    code: 200
    input: [new_amount_cents]
    output: AcquisitionOffer
    side_effects: ["negotiated_compensation_cents updated", "total recomputed", "committed adjusted by delta"]

  - method: POST
    path: "/easement-cases/{caseId}/offers/{offerId}/accept"
    description: "Accept an offer (TENDERED|COUNTERED -> ACCEPTED)"
    roles: [RightOfWayAgent, DepartmentDirector]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects: ["status -> ACCEPTED", "new EasementDocument auto-created in DRAFT"]

  - method: POST
    path: "/easement-cases/{caseId}/offers/{offerId}/reject"
    description: "Mark offer rejected by owner"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects: ["status -> REJECTED_BY_OWNER", "compensation_committed_cents -= total"]

  - method: POST
    path: "/easement-cases/{caseId}/offers/{offerId}/withdraw"
    description: "Withdraw an offer"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects: ["status -> WITHDRAWN", "if TENDERED: compensation_committed_cents -= total"]

  - method: POST
    path: "/easement-cases/{caseId}/offers/{offerId}/refer-to-condemnation"
    description: "Refer an expired/rejected offer to condemnation"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects: ["status -> CONDEMNATION_REFERRED", "LitigationReferral auto-created"]

  # --- ThirdPartyPermit ---
  - method: POST
    path: "/easement-cases/{caseId}/permits"
    description: "Request a third-party permit"
    roles: [RightOfWayAgent]
    code: 201
    input: [permittee_name, permit_type, requested_area_sqft, requested_start_date, requested_end_date, "encroachment_id?", "insurance_certificate_on_file?"]
    output: ThirdPartyPermit
    side_effects: ["approval_status=PENDING", "field_inspection_status=NOT_SCHEDULED"]

  - method: GET
    path: "/easement-cases/{caseId}/permits"
    description: "List permits for a case"
    roles: [RightOfWayAgent, VegetationInspector, DepartmentDirector]
    code: 200
    input: ["approval_status?", "permit_type?", "limit?", "offset?"]
    output: "ThirdPartyPermit[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}/permits/{permitId}"
    description: "Get one permit"
    roles: [RightOfWayAgent, VegetationInspector, DepartmentDirector]
    code: 200
    input: []
    output: ThirdPartyPermit
    side_effects: []

  - method: POST
    path: "/easement-cases/{caseId}/permits/{permitId}/schedule-inspection"
    description: "Schedule field inspection"
    roles: [VegetationInspector]
    code: 200
    input: []
    output: ThirdPartyPermit
    side_effects: ["field_inspection_status -> SCHEDULED"]

  - method: POST
    path: "/easement-cases/{caseId}/permits/{permitId}/record-inspection"
    description: "Record inspection result"
    roles: [VegetationInspector]
    code: 200
    input: [result]   # PASSED | FAILED
    output: ThirdPartyPermit
    side_effects: ["field_inspection_status -> PASSED or FAILED", "if FAILED and APPROVED: auto-REVOKE"]

  - method: POST
    path: "/easement-cases/{caseId}/permits/{permitId}/approve"
    description: "Approve a permit"
    roles: [RightOfWayAgent]
    code: 200
    input: [expected_case_version]
    output: ThirdPartyPermit
    side_effects: ["approval_status -> APPROVED", "annual_fee_cents computed", "active_permit_count recomputed", "linked Encroachment -> PERMITTED_RETROACTIVELY", "increments EasementCase.version by 1"]

  - method: POST
    path: "/easement-cases/{caseId}/permits/{permitId}/deny"
    description: "Deny a permit"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: ThirdPartyPermit
    side_effects: ["approval_status -> DENIED"]

  - method: POST
    path: "/easement-cases/{caseId}/permits/{permitId}/revoke"
    description: "Revoke an approved permit after failed inspection"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: ThirdPartyPermit
    side_effects: ["approval_status -> REVOKED", "linked Encroachment reverts to NEGOTIATING", "open_encroachment_count incremented"]

  # --- VegetationZone & Violation ---
  - method: POST
    path: "/easement-cases/{caseId}/vegetation-zones"
    description: "Create a vegetation zone"
    roles: [VegetationInspector]
