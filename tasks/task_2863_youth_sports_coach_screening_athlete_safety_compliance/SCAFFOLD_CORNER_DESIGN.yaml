        excluded_because:
          difficulty_instance: cross_entity_state_dependency / coach_assignment_activation_depends_on_member_training_dimension
          rationale: "The guarded transition and its cross-entity precondition are asserted there in both the blocked and the unblocked direction."

  - section: calculations
    instances:
      - name: expedite_fee_rounds_half_up_on_the_post_discount_net
        claim_type: precision
        grounds:
          - calculations.screening_order_charge.formula
          - calculations.screening_order_charge.precision
          - entities.ScreeningOrder.fields.expedite_cents
        distinguishing_aspect: |
          Only the expedite step can produce a half-cent tie, because gross subtotals are always
          multiples of 100 and so the 5%/10% discount is always exact: a TIER_3 order with four
          jurisdictions has gross 12500, discount 1250 and net 11250, and 11250 * 0.35 is exactly
          3937.5 - round_half_up must make expedite_cents 3938 (not 3937) so charged_cents is
          15188 and escrow drops to exactly 484812.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000 and total_funded_cents 500000"
            - "member m_pr is a HEAD_COACH with minor-athlete contact and four jurisdiction codes, so risk_points is 40 + 25 + min(15, 5*3) = 80 and required_tier is TIER_3"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Pat Rowe", email: "pat.rowe@alpha.test", role_type: "HEAD_COACH", has_minor_athlete_contact: true, date_of_birth: "1980-08-14", jurisdiction_codes: ["CA", "NV", "AZ", "OR"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_pr_id: $.data.id, pr_points: $.data.risk_points, pr_tier: $.data.required_tier }
          trigger:
            - call: "POST /safesport/members/${m_pr_id}/screening-orders"
              payload: { expedited: true, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { pr_order_id: $.data.id, pr_tier_snap: $.data.tier, pr_jc: $.data.jurisdiction_count, pr_gross: $.data.gross_subtotal_cents, pr_discount: $.data.discount_cents, pr_expedite: $.data.expedite_cents, pr_charged: $.data.charged_cents }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { pr_escrow: $.data.escrow_balance_cents, pr_funded: $.data.total_funded_cents }
          assert:
            - "${pr_points} == 80"
            - "${pr_tier} == TIER_3"
            - "${pr_tier_snap} == TIER_3"
            - "${pr_jc} == 4"
            - "${pr_gross} == 12500"
            - "${pr_discount} == 1250"
            - "${pr_expedite} == 3938"
            - "${pr_charged} == 15188"
            - "${pr_escrow} == 484812"
            - "${pr_funded} == 500000"
      - name: cancelled_stay_frees_the_slot_for_a_third_booking
        claim_type: input_set_filtering
        grounds:
          - calculations.room_slot_overlap_check.input_set
          - endpoints[POST /safesport/room-stays/{room_stay_id}/cancel].side_effects
          - errors[ERR_ROOM_OCCUPANCY_CONFLICT]
        distinguishing_aspect: |
          The overlap input set is restricted to BOOKED rows, so the third overlapping
          minor-athlete stay in a ROOM_SLOT_CAPACITY 2 slot is refused with
          ERR_ROOM_OCCUPANCY_CONFLICT, and the very same request succeeds once one of the two
          neighbours is CANCELLED - the cancelled interval must stop counting even though the
          row still exists and still carries its original check_in and check_out.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists"
            - "slot (club, SPRING_MEET, 204) already holds two BOOKED MINOR_ATHLETE stays over 2026-10-10T15:00:00Z..2026-10-12T11:00:00Z"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "MINOR_ATHLETE", trip_label: "SPRING_MEET", room_number: "204", check_in: "2026-10-10T15:00:00Z", check_out: "2026-10-12T11:00:00Z", minor_athlete_age: 12 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_f1: $.data.id }
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "MINOR_ATHLETE", trip_label: "SPRING_MEET", room_number: "204", check_in: "2026-10-10T15:00:00Z", check_out: "2026-10-12T11:00:00Z", minor_athlete_age: 13 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_f2: $.data.id, rs_f2_status: $.data.status }
          trigger:
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "MINOR_ATHLETE", trip_label: "SPRING_MEET", room_number: "204", check_in: "2026-10-11T15:00:00Z", check_out: "2026-10-12T11:00:00Z", minor_athlete_age: 14 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_f3_error: $.data.error_id }
            - call: "POST /safesport/room-stays/${rs_f2}/cancel"
              payload: { reason: "athlete moved to a different room" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_f2_cancelled: $.data.status, rs_f2_check_in: $.data.check_in }
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "MINOR_ATHLETE", trip_label: "SPRING_MEET", room_number: "204", check_in: "2026-10-11T15:00:00Z", check_out: "2026-10-12T11:00:00Z", minor_athlete_age: 14 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_f3_id: $.data.id, rs_f3_status: $.data.status }
          assert:
            - "${rs_f2_status} == BOOKED"
            - "${rs_f3_error} == ERR_ROOM_OCCUPANCY_CONFLICT"
            - "HTTP status is 409 on the first third-bed attempt"
            - "${rs_f2_cancelled} == CANCELLED"
            - "${rs_f2_check_in} == 2026-10-10T15:00:00.000Z"
            - "${rs_f3_status} == BOOKED"
            - "GET /safesport/clubs/${club_a_id}/room-stays with trip_label SPRING_MEET, room_number 204 and status BOOKED reports total_count 2"
      - name: compliance_score_returns_the_documented_edge_values
        claim_type: aggregation
        grounds:
          - calculations.club_compliance_score.formula
          - entities.ClubAudit.fields.compliance_score
          - endpoints[POST /safesport/club-audits/{club_audit_id}/finalize].side_effects
        distinguishing_aspect: |
          The two short-circuit branches are ordered and both must be reachable: an audit with
          an empty sample scores 100.00 even though nothing was verified (sampled_member_count
          == 0 wins first), while a REGISTRY_VERIFIED audit that DOES sample a member but finds
          no PENDING or ACTIVE CoachAssignment at the club has denominator_count 0 and scores
          0.00 - swapping the branch order would score the empty audit 0.00.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with roster_size_attested 3 and no coach assignments at all"
            - "member m_ed exists and is still PENDING / UNSCREENED"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Ed Dane", email: "ed.dane@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1992-09-15", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_ed_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-03-31T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: [] }
              as: ComplianceAuditor
              captures: { audit_empty_id: $.data.id, empty_sample_count: $.data.sampled_member_count }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-04-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", score_variant: "REGISTRY_VERIFIED", sampled_member_ids: ["${m_ed_id}"] }
              as: ComplianceAuditor
              captures: { audit_zero_id: $.data.id, zero_sample_count: $.data.sampled_member_count }
          trigger:
            - call: "POST /safesport/club-audits/${audit_empty_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { empty_score: $.data.compliance_score, empty_compliant: $.data.compliant_member_count, empty_denominator: $.data.denominator_count }
            - call: "POST /safesport/club-audits/${audit_zero_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { zero_score: $.data.compliance_score, zero_compliant: $.data.compliant_member_count, zero_denominator: $.data.denominator_count }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { club_score_after: $.data.compliance_score }
          assert:
            - "${empty_sample_count} == 0"
            - "${zero_sample_count} == 1"
            - "${empty_score} == 100.00"
            - "${empty_compliant} == 0"
            - "${empty_denominator} == 3"
            - "${zero_score} == 0.00"
            - "${zero_compliant} == 0"
            - "${zero_denominator} == 0"
            - "${club_score_after} == 0.00"
      - name: waiving_the_third_open_finding_relaxes_posture_from_restricted_to_open
        claim_type: constraint_propagation
        grounds:
          - calculations.club_compliance_posture.formula
          - calculations.club_compliance_posture.constants.RESTRICT_FINDING_THRESHOLD
          - endpoints[POST /safesport/audit-findings/{audit_finding_id}/decision].side_effects
        distinguishing_aspect: |
          The posture rule is recomputed downward as well as upward: three OPEN MINOR findings
          put Club.open_finding_count at exactly RESTRICT_FINDING_THRESHOLD 3 so the posture is
          RESTRICTED, and WAIVING one of them drops the count to 2 and must return the posture
          to OPEN - with critical_open_finding_count staying 0 throughout, so the FROZEN branch
          never applies.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with member m_po in the audit sample"
            - "audit audit_po is FINDINGS_ISSUED and carries three OPEN MINOR findings"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Pola Ott", email: "pola.ott@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1993-10-16", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_po_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: ["${m_po_id}"] }
              as: ComplianceAuditor
              captures: { audit_po_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_po_id}/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", member_id: "${m_po_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { f_po_1: $.data.id }
            - call: "POST /safesport/club-audits/${audit_po_id}/findings"
              payload: { finding_code: "TRAINING_OVERDUE", severity: "MINOR", member_id: "${m_po_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { f_po_2: $.data.id }
            - call: "POST /safesport/club-audits/${audit_po_id}/findings"
              payload: { finding_code: "UNSCREENED_CONTACT", severity: "MINOR", member_id: "${m_po_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { f_po_3: $.data.id }
            - call: "POST /safesport/club-audits/${audit_po_id}/finalize"
              payload: {}
              as: ComplianceAuditor
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { po_posture_before: $.data.compliance_posture, po_open_before: $.data.open_finding_count, po_critical_before: $.data.critical_open_finding_count }
          trigger:
            - call: "POST /safesport/audit-findings/${f_po_3}/decision"
              payload: { decision: "WAIVED", note: "finding withdrawn after document review" }
              as: ComplianceAuditor
              captures: { po_f3_status: $.data.status }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { po_posture_after: $.data.compliance_posture, po_open_after: $.data.open_finding_count, po_critical_after: $.data.critical_open_finding_count }
          assert:
            - "${po_open_before} == 3"
            - "${po_critical_before} == 0"
            - "${po_posture_before} == RESTRICTED"
            - "${po_f3_status} == WAIVED"
            - "${po_open_after} == 2"
            - "${po_critical_after} == 0"
            - "${po_posture_after} == OPEN"
            - "ClubAudit.${audit_po_id}.open_finding_count == 2"
            - "ClubAudit.${audit_po_id}.waived_finding_count == 1"
            - "ClubAudit.${audit_po_id}.finding_total_count == 3"
      - name: eligible_through_is_the_earlier_of_the_screening_and_training_expiries
        claim_type: correct_result
        grounds:
          - calculations.member_eligibility_projection.formula
          - endpoints[GET /safesport/members/{member_id}/eligibility-projection].output
          - entities.Member.fields.eligible_through
        distinguishing_aspect: |
          The projection is a minimum over two independent expiries and it is null while EITHER
          leg is missing: with the screen adjudicated on 2026-08-01 the screening leg is
          2028-07-31 but projected_eligible_through is still null because no required course is
          completed, and completing SS101 (validity_days 365) on the same clock adds a training
          leg of 2027-08-01, which is the smaller of the two and therefore the stamped
          eligible_through.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000 and course SS101 (validity_days 365) required for all three tiers"
            - "member m_mn is a VOLUNTEER with one jurisdiction and no minor contact, so risk_points 10 and required_tier TIER_1"
            - "m_mn's screening order has been adjudicated CLEAR, so screening_expires_at is 2028-07-31T00:00:00.000Z"
            - "m_mn has an ASSIGNED SS101 assignment that has been started but not yet completed"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Mona Nash", email: "mona.nash@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1994-11-17", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_mn_id: $.data.id }
            - call: "POST /safesport/members/${m_mn_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_mn_id: $.data.id }
            - call: "POST /safesport/screening-orders/${so_mn_id}/result"
              payload: { vendor_disposition: "NO_RECORD" }
              as: ScreeningVendor
            - call: "POST /safesport/screening-orders/${so_mn_id}/adjudicate"
              payload: { disposition: "CLEAR", rationale: "registry return carried no records" }
              as: SafeSportOfficer
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_mn_id}", course_code: "SS101", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta_mn_id: $.data.id }
            - call: "POST /safesport/training-assignments/${ta_mn_id}/start"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "GET /safesport/members/${m_mn_id}/eligibility-projection"
              payload: { variant: "AUDIT_SNAPSHOT" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { mn_before_projected: $.data.projected_eligible_through, mn_before_screen_exp: $.data.screening_expiry, mn_before_train_exp: $.data.training_expiry }
          trigger:
            - call: "POST /safesport/training-assignments/${ta_mn_id}/complete"
              payload: { score: 88 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { mn_ta_expires: $.data.expires_at }
            - call: "GET /safesport/members/${m_mn_id}/eligibility-projection"
              payload: { variant: "AUDIT_SNAPSHOT" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { mn_variant: $.data.variant, mn_projected: $.data.projected_eligible_through, mn_screen_exp: $.data.screening_expiry, mn_train_exp: $.data.training_expiry, mn_train_status: $.data.training_status, mn_contact: $.data.contact_eligibility }
            - call: "GET /safesport/members/${m_mn_id}"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { mn_eligible_through: $.data.eligible_through, mn_screen_expires: $.data.screening_expires_at }
          assert:
            - "${mn_before_screen_exp} == 2028-07-31T00:00:00.000Z"
            - "${mn_before_train_exp} == null"
            - "${mn_before_projected} == null"
            - "${mn_ta_expires} == 2027-08-01T00:00:00.000Z"
            - "${mn_variant} == AUDIT_SNAPSHOT"
            - "${mn_train_exp} == 2027-08-01T00:00:00.000Z"
            - "${mn_screen_exp} == 2028-07-31T00:00:00.000Z"
            - "${mn_projected} == 2027-08-01T00:00:00.000Z"
            - "${mn_train_status} == CURRENT"
            - "${mn_contact} == ELIGIBLE"
            - "${mn_eligible_through} == 2027-08-01T00:00:00.000Z"
            - "${mn_screen_expires} == 2028-07-31T00:00:00.000Z"
      - name: risk_point_caps_clamp_both_the_jurisdiction_and_the_history_term
        claim_type: weighted_scoring
        grounds:
          - calculations.screening_tier_assignment.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / screening_tier_nested_caps_with_role_branch
          rationale: "Both nested caps are exercised there - six jurisdiction codes clamp 25 to 15 and three NON_DISQUALIFYING_RECORD adjudications clamp 36 to 30 - together with the role branch."
      - name: tier_threshold_uses_greater_or_equal_at_seventy_five
        claim_type: threshold
        grounds:
          - calculations.screening_tier_assignment.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / tier_threshold_at_exactly_seventy_five_risk_points
          rationale: "The at-threshold and threshold-minus-five cases are asserted there against TIER_3_THRESHOLD."
      - name: volume_discount_band_boundary_and_marginal_rate
        claim_type: tiered_pricing
        grounds:
          - calculations.screening_order_charge.formula
        excluded_because:
          difficulty_instance: boundary_precision_check / volume_discount_band_at_exactly_eight_thousand_gross_subtotal
          rationale: "The 8000-cent band boundary is asserted there on both sides, and the pinned pre-discount keying is asserted in screening_charge_discount_keyed_on_pre_discount_gross."
      - name: sanction_fine_rounds_each_finding_before_summing
        claim_type: precision
        grounds:
          - calculations.audit_sanction_fine.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / sanction_fine_rounds_per_finding_before_sum
          rationale: "The one-cent divergence between round-then-sum and sum-then-round is asserted there with three identical MINOR repeat findings."
      - name: sanction_fine_counts_only_open_findings
        claim_type: input_set_filtering
        grounds:
          - calculations.audit_sanction_fine.input_set
        excluded_because:
          difficulty_instance: combinatorial_formula / sanction_fine_rounds_per_finding_before_sum
          rationale: "That instance's audit carries only OPEN findings at close time and asserts the exact total, and finding_partition_conserved_across_remediation_reject_cycle covers the REMEDIATED/WAIVED exclusions."
      - name: projection_variants_diverge_on_in_flight_assignments
        claim_type: variant_divergence
        grounds:
          - calculations.member_eligibility_projection.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / eligibility_projection_audit_snapshot_vs_renewal_forward
          rationale: "Both variants are read over identical rows there, with the null/non-null divergence asserted."
      - name: compliance_score_variants_use_different_denominators
        claim_type: variant_divergence
        grounds:
          - calculations.club_compliance_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / compliance_score_self_attested_vs_registry_verified
          rationale: "The 33.33 vs 100.00 divergence over an identical sample is asserted there."
      - name: room_slot_intervals_are_half_open_so_adjacency_is_legal
        claim_type: interval_merge
        grounds:
          - calculations.room_slot_overlap_check.formula
        excluded_because:
          difficulty_instance: resource_temporal_overlap / room_slot_half_open_adjacency_is_legal_one_minute_overlap_is_not
          rationale: "The touching-endpoint and one-minute-overlap cases are asserted there."
      - name: measure_windows_are_closed_and_carry_a_fourteen_day_buffer
        claim_type: interval_merge
        grounds:
          - calculations.measure_window_conflict_check.formula
        excluded_because:
          difficulty_instance: resource_temporal_overlap / interim_measure_window_closed_buffer_end_is_still_a_conflict
          rationale: "The inclusive buffer end date and the same-kind filter are asserted there."
      - name: escrow_and_finding_aggregates_reconcile_after_compensation
        claim_type: aggregation
        grounds:
          - calculations.escrow_conservation_invariant.formula
          - calculations.finding_partition_invariant.formula
        excluded_because:
          difficulty_instance: compensating_invariant / escrow_conservation_across_screening_order_and_void
          rationale: "Money conservation across order/void is asserted there and set-cardinality conservation across the remediation cycle in finding_partition_conserved_across_remediation_reject_cycle."
      - name: training_lapse_boundary_is_inclusive_of_the_expiry_instant
        claim_type: precision
        grounds:
          - calculations.contact_eligibility_derivation.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / training_lapse_at_exactly_the_expiry_instant
          rationale: "One second before and exactly at training_expiry are both asserted there, including the membership_status side effect."

  - section: validations
    instances:
      - name: escrow_shortfall_blocks_the_order_until_the_club_funds_it
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors[ERR_ESCROW_INSUFFICIENT]
          - endpoints[POST /safesport/clubs/{club_id}/escrow-funding]
        distinguishing_aspect: |
          The fiscal gate compares escrow_balance_cents against the charge computed for THIS
          order, so a club holding 1000 cents cannot order a 2500-cent TIER_1 screen and gets
          ERR_ESCROW_INSUFFICIENT with HTTP 402 (not 409) and no escrow movement; after a
          5000-cent funding the identical request succeeds and leaves escrow at exactly 3500
          with total_funded_cents 6000.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Thin Ice Skating' created with initial_escrow_cents 1000, so escrow_balance_cents and total_funded_cents are both 1000"
            - "member m_ei is a VOLUNTEER with one jurisdiction code, so required_tier TIER_1 and the order would cost 2500"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Thin Ice Skating", state_code: "MN", roster_size_attested: 2, minor_athlete_program: true, initial_escrow_cents: 1000 }
              as: NgbAdmin
              captures: { club_t_id: $.data.id, club_t_v1: $.data.version }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_t_id}", full_name: "Ez Ives", email: "ez.ives@thinice.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1996-12-18", jurisdiction_codes: ["MN"] }
              as: ClubAdministrator
              as_user_id: "${club_t_id}"
              captures: { m_ei_id: $.data.id, ei_tier: $.data.required_tier }
          trigger:
            - call: "POST /safesport/members/${m_ei_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_t_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_t_id}"
              captures: { ei_error: $.data.error_id }
            - call: "GET /safesport/clubs/${club_t_id}"
              payload: {}
              as: NgbAdmin
              captures: { ei_escrow_mid: $.data.escrow_balance_cents, ei_version_mid: $.data.version }
            - call: "POST /safesport/clubs/${club_t_id}/escrow-funding"
              payload: { amount_cents: 5000 }
              as: ClubAdministrator
              as_user_id: "${club_t_id}"
              captures: { ei_escrow_funded: $.data.escrow_balance_cents, ei_funded_total: $.data.total_funded_cents, club_t_v2: $.data.version }
            - call: "POST /safesport/members/${m_ei_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_t_v2}" }
              as: ClubAdministrator
              as_user_id: "${club_t_id}"
              captures: { ei_order_id: $.data.id, ei_charged: $.data.charged_cents }
            - call: "GET /safesport/clubs/${club_t_id}"
              payload: {}
              as: NgbAdmin
              captures: { ei_escrow_after: $.data.escrow_balance_cents, ei_funded_after: $.data.total_funded_cents }
          assert:
            - "${ei_tier} == TIER_1"
            - "${ei_error} == ERR_ESCROW_INSUFFICIENT"
            - "HTTP status is 402 on the first order attempt"
            - "${ei_escrow_mid} == 1000"
            - "${ei_version_mid} == ${club_t_v1}"
            - "${ei_escrow_funded} == 6000"
            - "${ei_funded_total} == 6000"
            - "${ei_charged} == 2500"
            - "${ei_escrow_after} == 3500"
            - "${ei_funded_after} == 6000"
            - "Member.${m_ei_id}.screening_status == SCREENING_ORDERED"
      - name: renewal_window_opens_exactly_ninety_days_before_eligible_through
        claim_type: temporal_validation
        grounds:
          - validations[priority=20]
          - errors[ERR_RENEWAL_WINDOW_NOT_OPEN]
          - state_machines.Member.membership.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          RENEWAL_WINDOW_DAYS is 90 and the comparison is >=, so for a member whose
          eligible_through is 2027-08-01T00:00:00Z the window opens at exactly
          2027-05-03T00:00:00Z: at 2027-05-02T23:59:59Z the early renewal is refused with
          ERR_RENEWAL_WINDOW_NOT_OPEN and HTTP 422, and one second later the same call succeeds,
          stamps last_renewed_at and keeps membership_status ACTIVE rather than moving it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow 500000 and course SS101 (validity_days 365) required for all tiers"
            - "member m_rw is CLEARED (screening_expires_at 2028-07-31T00:00:00.000Z) and completed SS101 on 2026-08-01, so training expiry is 2027-08-01T00:00:00.000Z, membership_status is ACTIVE and eligible_through is 2027-08-01T00:00:00.000Z"
