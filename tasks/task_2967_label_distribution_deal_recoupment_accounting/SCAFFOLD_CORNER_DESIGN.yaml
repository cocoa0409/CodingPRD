            - "approved_at == \"2026-08-01T00:00:00.000Z\", the default logical clock, with exactly three fractional digits"
            - "recoupability == \"FULLY_RECOUPABLE\", derived from category DIGITAL_ADS because no recoupability_override was supplied"
            - "${spend_v2} == ${spend_v1} + 1 == ${spend_v0} + 2: each accepted transition bumps the version exactly once"
            - "the deal read after the trigger shows marketing_committed_cents == 100000, exactly equal to marketing_budget_cents: the rule-12 test is <=, so the ceiling itself is allowed"
            - "no error envelope appears anywhere: rules 1, 2, 3, 5, 8 (SUBMITTED is a declared from-state), 8 (the release is RELEASED, so ERR_RELEASE_NOT_PROMOTABLE does not fire), 9 (biz-affairs-01 != label-admin-01) and 12 are all satisfied on one call"

      - name: auth_ladder_401_before_403_before_404_before_400_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - validations[priority 5]
        distinguishing_aspect: |
          One endpoint, one payload, five header/path permutations, walking the ladder down. The
          SAME request that would fail schema validation must report 401 when the role header is
          blank, 403 when the role is a valid role without access, 403 when the role value is not a
          §1.7 role at all, 404 when the role is permitted but the path id is fabricated, and only
          then 400. Any implementation that validates the body first collapses four of the five
          into ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "one Distributor, one Artist, one EXECUTED deal, one RELEASED release and one SUBMITTED MarketingSpend"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000222", title: "Ladder", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-V2-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /marketing-spends"
              payload: { release_id: "${rel1_id}", category: "DIGITAL_ADS", amount_cents: 100000, vendor: "Northlight Media" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { spend_id: $.data.id, spend_v1: $.data.version }
            - call: "POST /marketing-spends/${spend_id}/submit"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { spend_v2: $.data.version }
          trigger:
            - call: "POST /marketing-spends/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "MAYBE" }
              as: ""
              as_user_id: "biz-affairs-01"
              captures: { e_blank: $.data.error_id }
            - call: "POST /marketing-spends/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "MAYBE" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { e_wrong_role: $.data.error_id }
            - call: "POST /marketing-spends/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "MAYBE" }
              as: Auditor
              as_user_id: "biz-affairs-01"
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /marketing-spends/00000000-0000-4000-8000-000000000000/decide"
              payload: { decision: "MAYBE" }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { e_missing: $.data.error_id }
            - call: "POST /marketing-spends/${spend_id}/decide"
              payload: { decision: "MAYBE" }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { e_schema: $.data.error_id }
            - call: "GET /marketing-spends/${spend_id}"
              payload: {}
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
          assert:
            - "the first call sends X-User-Role as a zero-length string (and a valid X-User-ID): ${e_blank} == \"ERR_UNAUTHENTICATED\" with HTTP 401 — priority 1 outranks the fabricated path id AND the bad enum; a whitespace-only header value must behave identically"
            - "${e_wrong_role} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403: Artist is a real §1.7 role but is absent from the decide endpoint's roles list, and priority 2 outranks the 404"
            - "${e_unknown_role} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403 as well: an unrecognised role value fails the same rule rather than producing 401 or 400"
            - "${e_missing} == \"ERR_MARKETING_SPEND_NOT_FOUND\" with HTTP 404: the permitted role reaches priority 3, which outranks the invalid decision enum"
            - "${e_schema} == \"ERR_INVALID_REQUEST\" with HTTP 400: only when auth and existence pass does priority 5 report the unrecognised decision value \"MAYBE\""
            - "every error body is the §1.0 error envelope with response_type == \"error\" and data.error_id plus data.message, and no data.id"
            - "the spend read at the end is still status \"SUBMITTED\" with version ${spend_v2} == ${spend_v1} + 1: none of the five rejected calls wrote anything"

      - name: body_schema_400_rejects_before_body_foreign_keys_are_resolved
        claim_type: priority_ordering
        grounds:
          - validations[priority 5]
          - validations[priority 6]
        distinguishing_aspect: |
          POST /releases carries both a format-checked upc and three body foreign keys. A payload
          that is both malformed (upc "12") and unresolvable (deal_id and
          primary_artist_id both fabricated) must report ERR_INVALID_REQUEST 400; repairing only the
          upc then exposes ERR_DEAL_NOT_FOUND 404, and repairing the deal_id exposes
          ERR_ARTIST_NOT_FOUND 404 — the pinned priority-6 token order (distributor_id, artist_id,
          deal_id, primary_artist_id, release_id, artist_agreement_id, supersedes_agreement_id) puts
          deal_id ahead of primary_artist_id, so the pair of bad FKs resolves deterministically.
        test_recipe:
          setup:
            - "one Distributor, one Artist and one DRAFT deal exist so that a repaired payload can succeed"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /releases"
              payload: { deal_id: "00000000-0000-4000-8000-000000000000", primary_artist_id: "00000000-0000-4000-8000-000000000000", upc: "12", title: "Malformed", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_schema: $.data.error_id }
            - call: "POST /releases"
              payload: { deal_id: "00000000-0000-4000-8000-000000000000", primary_artist_id: "00000000-0000-4000-8000-000000000000", upc: "099000000223", title: "Bad Deal FK", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_deal: $.data.error_id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "00000000-0000-4000-8000-000000000000", upc: "099000000223", title: "Bad Artist FK", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_artist: $.data.error_id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000223", title: "Repaired", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel_ok: $.data.id }
            - call: "GET /releases"
              payload: { deal_id: "${deal_id}" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "${e_schema} == \"ERR_INVALID_REQUEST\" with HTTP 400: upc \"12\" is shorter than the declared 12..14 digits, and priority 5 fires before either fabricated FK is looked up"
            - "${e_deal} == \"ERR_DEAL_NOT_FOUND\" with HTTP 404 once the upc is well formed, even though primary_artist_id is equally unresolvable"
            - "${e_artist} == \"ERR_ARTIST_NOT_FOUND\" with HTTP 404 once deal_id resolves: each FK reports the error of its own target entity, never a generic 404"
            - "the fourth call returns 201 with id ${rel_ok} and upc \"099000000223\" — the same upc the two rejected calls carried, proving no partial row was persisted by either"
            - "GET /releases?deal_id=${deal_id} reports total_count == 1"

      - name: resource_owner_403_outranks_report_state_409_rejected
        claim_type: priority_conflict
        grounds:
          - validations[priority 4]
          - validations[priority 8]
          - endpoints[POST /dsp-revenue-reports/{id}/submit]
          - endpoints[POST /dsp-revenue-reports/{id}/lines]
        distinguishing_aspect: |
          An ACCEPTED report violates BOTH the ownership rule (when the caller is the wrong
          distributor) and the state rule (submit has no ACCEPTED from-state). Priority 4 must win,
          so the stranger learns only ERR_NOT_RESOURCE_OWNER and never that the report has already
          been accepted; the rightful owner making the identical call gets the 409. A single
          role-only permission check reports 409 to both callers and leaks state to a stranger.
        test_recipe:
          setup:
            - "two Distributors A and B, one Artist, one EXECUTED deal on distributor A, one RELEASED release and one STRM/US/PREMIUM card at 4000 micros"
            - "one ACCEPTED report of 250000 streams on that deal"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_a_id: $.data.id }
            - call: "POST /distributors"
