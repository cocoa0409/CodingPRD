  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_rejected_then_fresh_accepted
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[change-order-create-stale-project]", "validations[priority=6]", "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "After CO1 advances Project.version, a second create carrying the previously observed version is rejected 412 ERR_STALE_PROJECT_VERSION; re-reading the version and retrying succeeds — strictly sequential requests, OCC-resolved."
        test_recipe:
          setup: ["project INTAKE; version v0 captured at creation; CO1 created with v0 (version advances)"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC X1", license_no: "LIC-X1" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H X1", email: "hx1@x.com", phone: "x1" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "X1 St", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id, v0: $.data.version } }
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "first", kind: "ADD", scope_items: [{ description: "a", qty: 1, unit_cost_cents: 1000 }], allowance_draws: [], expected_project_version: "${v0}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co1: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "second-stale", kind: "ADD", scope_items: [{ description: "b", qty: 1, unit_cost_cents: 2000 }], allowance_draws: [], expected_project_version: "${v0}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { v_fresh: $.data.version } }
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "second-fresh", kind: "ADD", scope_items: [{ description: "b", qty: 1, unit_cost_cents: 2000 }], allowance_draws: [], expected_project_version: "${v_fresh}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co2: $.data.id } }
          assert:
            - "stale create: error_id == ERR_STALE_PROJECT_VERSION, http 412"
            - "fresh create succeeds (201) and supersedes CO1 (CO1 status SUPERSEDED)"
            - "Project.version advanced by exactly 1 per successful create"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: select_response_reflects_recompute_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST /api/allowance-lines/{id}/select", entities.AllowanceLine.fields.variance_cents]
        distinguishing_aspect: "Immediate consistency: the select response itself carries recomputed variance_cents and remaining_cents — no re-read required to observe the derived fields."
        test_recipe:
          setup: ["project INTAKE with AllowanceLine budgeted 100000"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC S1", license_no: "LIC-S1" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H S1", email: "hs1@x.com", phone: "s1" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "S1 St", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/allowance-lines", payload: { name: "FLOORING", budgeted_cents: 100000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { al_id: $.data.id } }
          trigger:
            - { call: "POST /api/allowance-lines/${al_id}/select", payload: { actual_cents: 90000 }, as: Homeowner, as_user_id: "${ho_id}", captures: { al_var: $.data.variance_cents, al_rem: $.data.remaining_cents, al_sel: $.data.selected } }
          assert:
            - "select response: selected == true, variance_cents == -10000, remaining_cents == 10000 in the same response envelope"
            - "Project price immediately FINAL with contract_price_cents == 3990000 (= 4000000 + (-10000))"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_read
        claim_type: computed_read
        grounds: [response_envelope, "endpoints.GET /api/projects/{id}"]
        distinguishing_aspect: "Every success response wraps data in the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type object — and errors carry data.error_id + data.message."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC S2", license_no: "LIC-S2" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H S2", email: "hs2@x.com", phone: "s2" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "S2 St", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
          trigger:
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp (ISO8601), response_type == object, data contains the Project"
            - "an error response (e.g. GET on unknown id) has response_type == error with data.error_id and data.message"
