            - "second trigger: HTTP status == 403 and error.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "third trigger: HTTP status == 403 and error.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "TaxProfile.${tp}.status == 'SUBMITTED'"
            - "EarningsPeriod.${per}.status == 'OPEN'"
            - "Creator.${cr}.evaluation_count == 0"

      - name: platform_admin_cannot_perform_policy_operations
        claim_type: role_cannot_perform_other_exclusive_operations
        grounds:
          - "roles[PlatformAdmin].scoping"
          - "roles[PolicyReviewer].exclusive_operations"
        distinguishing_aspect: "Rating content, striking a creator and opening an investigation are all 403 for PlatformAdmin, so configuration authority carries no policy judgement even over rows it created."
        test_recipe:
          setup: ["One creator with one GREEN content item, both created by PlatformAdmin."]
