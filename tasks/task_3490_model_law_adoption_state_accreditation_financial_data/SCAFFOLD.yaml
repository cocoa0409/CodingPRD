scenario: |
  Model Law Adoption, State Accreditation & Financial Data Filing (National Association of Insurance Commissioners): model law and regulation development through committee process with exposure drafts and member votes, state adoption tracking with variations that create inconsistent requirements across jurisdictions, accreditation program evaluating state insurance departments on solvency oversight standards with periodic review teams, financial statement filing collection from insurers in a standard format with validation edits and analysis tools, risk-based capital computation and action level triggers feeding regulatory intervention, producer licensing and company admission data services shared among states, market conduct data collection and analysis supporting coordinated examinations, valuation and reserving standard maintenance with actuarial guidance

domain_name: "naic-model-law-accreditation-filings"
api_prefix: "/naic"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ModelAct
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Stable code of the model instrument line, e.g. MDL-101; a new version_label under the same model_code supersedes the prior PUBLISHED act on publish", constraints: "unique together with version_label" }
      - { name: version_label, type: string, source: input, description: "Version tag within the model_code line, e.g. v2026.1", constraints: "unique together with model_code" }
      - { name: title, type: string, source: input, description: "Full title of the model law or regulation" }
      - { name: act_type, type: enum, source: input, description: "MODEL_LAW | MODEL_REGULATION", constraints: "enum: MODEL_LAW, MODEL_REGULATION" }
      - { name: committee_name, type: string, source: input, description: "Name of the sponsoring committee (free text; committees are not persisted entities)" }
      - { name: is_core, type: boolean, source: input, description: "Core acts count in State.core_act_coverage_pct", default: false }
      - { name: status, type: enum, source: system, description: "Lifecycle state, see state_machines.ModelAct", default: DRAFTING, constraints: "enum: DRAFTING, EXPOSURE_OPEN, BALLOTING, ADOPTED, PUBLISHED, SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of the ADOPTED->PUBLISHED transition; null until published", default: null }
      - { name: votes_cast, type: integer, source: computed, description: "Count of MemberBallot rows for this act with status == CAST (rescinded/voided ballots excluded)", default: 0 }
      - { name: favorable_votes, type: integer, source: computed, description: "Count of CAST ballots with vote == YEA", default: 0 }

  - name: ExposureDraft
    parent: null
    common_fields: true
    fields:
      - { name: model_act_id, type: string, source: input, description: "FK -> ModelAct.id; the act this draft exposes" }
      - { name: exposure_number, type: integer, source: computed, description: "Per-act sequential number: 1 + count of prior drafts (any status) of the same act" }
      - { name: comment_window_start, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: comment_window_end, type: datetime, source: input, description: "Half-open window end (exclusive); window length must be >= MIN_COMMENT_DAYS (30)" }
      - { name: status, type: enum, source: system, description: "OPEN until explicitly closed", default: OPEN, constraints: "enum: OPEN, CLOSED" }

  - name: MemberBallot
    parent: null
    common_fields: true
    fields:
      - { name: model_act_id, type: string, source: input, description: "FK -> ModelAct.id; the act being voted on (path act)" }
      - { name: state_code, type: string, source: input, description: "Jurisdiction code of the voting state; must equal the acting StateRegulator's State.code (ownership, not an FK)" }
      - { name: vote, type: enum, source: input, description: "YEA | NAY | ABSTAIN; ABSTAIN counts toward votes_cast but not favorable_votes", constraints: "enum: YEA, NAY, ABSTAIN" }
      - { name: status, type: enum, source: system, description: "CAST until voided by a failed close-ballot", default: CAST, constraints: "enum: CAST, VOID" }
      - { name: cast_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }

  - name: State
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Two-letter jurisdiction code, e.g. CA", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Full jurisdiction name" }
      - { name: accreditation_status, type: enum, source: system, description: "Driven exclusively by AccreditationReview finalize cascade (see state_machines.State)", default: ACCREDITED, constraints: "enum: ACCREDITED, PROBATION, SUSPENDED" }
      - { name: consecutive_fail_count, type: integer, source: system, description: "Consecutive FINAL_FAIL reviews; reset to 0 on FINAL_PASS", default: 0 }
      - { name: core_act_coverage_pct, type: number, source: computed, description: "100.0 x count(own StateAdoption with status IN {CERTIFIED_SIMILAR, CERTIFIED_VARIED} of acts with is_core == true) / count(ModelAct with status == PUBLISHED AND is_core == true); 100.0 when denominator is 0", default: 100.0 }

  - name: StateAdoption
    parent: null
    common_fields: true
    fields:
      - { name: model_act_id, type: string, source: input, description: "FK -> ModelAct.id; the PUBLISHED act being adopted" }
      - { name: state_code, type: string, source: input, description: "Jurisdiction code of the adopting state; must equal acting StateRegulator's State.code" }
      - { name: adopted_citation, type: string, source: input, description: "Local statutory citation of the adoption" }
      - { name: enacted_on, type: datetime, source: input, description: "Date the local enactment took effect" }
      - { name: status, type: enum, source: system, description: "PENDING_CERTIFICATION until certified; SUPERSEDED when the act is superseded or a successor adoption is certified", default: PENDING_CERTIFICATION, constraints: "enum: PENDING_CERTIFICATION, CERTIFIED_SIMILAR, CERTIFIED_VARIED, REJECTED_NOT_SIMILAR, SUPERSEDED" }

  - name: AccreditationReview
    parent: null
    common_fields: true
    fields:
      - { name: state_id, type: string, source: input, description: "FK -> State.id; the department under review" }
      - { name: period_start, type: datetime, source: input, description: "Review period start; closed-interval boundary (inclusive); auto-created reviews use current logical clock" }
      - { name: period_end, type: datetime, source: input, description: "Review period end; closed-interval boundary (inclusive); auto-created reviews use clock + AUTO_REVIEW_PERIOD_DAYS (180)" }
      - { name: team_lead_id, type: string, source: input, description: "Opaque operator id of the review team lead; null on auto-created (coverage-triggered) reviews; may not equal the team_lead_id of the same state's most recent FINAL_PASS/FINAL_FAIL review (rotation)", default: null }
      - { name: self_assessment_compliant, type: integer, source: input, description: "Count of standards the state self-assessed as compliant (desk variant input); >= 0 and <= self_assessment_total" }
      - { name: self_assessment_total, type: integer, source: input, description: "Count of standards in the self-assessment; >= 1" }
      - { name: desk_score, type: number, source: computed, description: "accreditation_score desk variant at creation: 100 x self_assessment_compliant / self_assessment_total, 1 decimal round_half_up", default: null }
      - { name: findings_compliant, type: integer, source: input, description: "On-site findings: standards found compliant; supplied at issue-findings; >= 0 and <= findings_total", default: null }
      - { name: findings_total, type: integer, source: input, description: "On-site findings: standards reviewed; supplied at issue-findings; >= 1", default: null }
      - { name: onsite_score, type: number, source: computed, description: "accreditation_score onsite variant at issue-findings: 100 x findings_compliant / findings_total, 1 decimal round_half_up", default: null }
      - { name: proposed_outcome, type: enum, source: computed, description: "PASS iff onsite_score >= PASS_THRESHOLD (75.0) else FAIL; set at issue-findings", default: null, constraints: "enum: PASS, FAIL" }
      - { name: origin, type: enum, source: system, description: "MANUAL when scheduled via POST /reviews; AUTO_COVERAGE when created by the publish supersede cascade", default: MANUAL, constraints: "enum: MANUAL, AUTO_COVERAGE" }
      - { name: status, type: enum, source: system, description: "See state_machines.AccreditationReview", default: SCHEDULED, constraints: "enum: SCHEDULED, FINDINGS_ISSUED, FINAL_PASS, FINAL_FAIL" }

  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - { name: naic_code, type: string, source: input, description: "NAIC company code", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Legal name" }
      - { name: domicile_state_code, type: string, source: input, description: "Jurisdiction code of domicile; must match an existing State.code" }
      - { name: status, type: enum, source: system, description: "Cyclic supervision status driven by RBC validate cascade (see state_machines.Insurer)", default: ACTIVE, constraints: "enum: ACTIVE, UNDER_SUPERVISION" }
      - { name: latest_rbc_ratio, type: number, source: computed, description: "ratio_covariance of the most recent VALIDATED non-SUPERSEDED FinancialFiling; null when none exists", default: null }
      - { name: latest_action_level, type: enum, source: computed, description: "Action level of that same filing; null when none exists", default: null, constraints: "enum: NONE, COMPANY_ACTION, REGULATORY_ACTION, AUTHORIZED_CONTROL, MANDATORY_CONTROL" }

  - name: FinancialFiling
    parent: null
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id; filing insurer" }
      - { name: period_year, type: integer, source: input, description: "Statement year" }
      - { name: period_quarter, type: enum, source: input, description: "Q1 | Q2 | Q3 | Q4 | ANNUAL", constraints: "enum: Q1, Q2, Q3, Q4, ANNUAL" }
      - { name: valuation_standard_code, type: string, source: input, description: "Code of the valuation standard; server pins the currently ACTIVE version at creation" }
      - { name: valuation_standard_version_label, type: string, source: system, description: "Version label of the ACTIVE standard pinned at creation; validate rejects when the ACTIVE version has moved on", default: null }
      - { name: reported_surplus_cents, type: integer, source: input, description: "Total adjusted capital base (>= 0); becomes RBCReport.tac_cents verbatim" }
      - { name: asset_risk_cents, type: integer, source: input, description: "Asset risk charge (>= 0)" }
      - { name: underwriting_risk_cents, type: integer, source: input, description: "Underwriting risk charge (>= 0)" }
      - { name: other_risk_cents, type: integer, source: input, description: "All other risk charges (>= 0)" }
      - { name: status, type: enum, source: system, description: "See state_machines.FinancialFiling", default: DRAFT, constraints: "enum: DRAFT, SUBMITTED, VALIDATED, EDITS_FAILED, SUPERSEDED" }
      - { name: edit_failures, type: array, source: computed, description: "List of failed edit ids (subset of E101, E103, E106, E107) set when validate moves the filing to EDITS_FAILED; empty on VALIDATED", default: [] }

  - name: RBCReport
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: system, description: "FK -> FinancialFiling.id; the filing this report was computed from (1:1 with a VALIDATED filing)" }
      - { name: insurer_naic_code, type: string, source: system, description: "Denormalized insurer code for analysis reads (not an FK)" }
      - { name: tac_cents, type: number, source: computed, description: "Total adjusted capital: reported_surplus_cents verbatim (2 decimals)" }
      - { name: acl_covariance_cents, type: number, source: computed, description: "Authorized control level, covariance variant: round_half_up(sqrt(sum of squared risk charges), 2)" }
      - { name: acl_additive_cents, type: number, source: computed, description: "Authorized control level, additive upper-bound variant: sum of risk charges (2 decimals)" }
      - { name: ratio_covariance, type: number, source: computed, description: "round_half_up(tac_cents / acl_covariance_cents, 4); official ratio driving action_level" }
      - { name: ratio_additive, type: number, source: computed, description: "round_half_up(tac_cents / acl_additive_cents, 4); conservative comparison ratio" }
      - { name: action_level, type: enum, source: computed, description: "From ratio_covariance: >= 2.0000 NONE; [1.5000,2.0000) COMPANY_ACTION; [1.0000,1.5000) REGULATORY_ACTION; [0.7000,1.0000) AUTHORIZED_CONTROL; < 0.7000 MANDATORY_CONTROL", constraints: "enum: NONE, COMPANY_ACTION, REGULATORY_ACTION, AUTHORIZED_CONTROL, MANDATORY_CONTROL" }

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: npn, type: string, source: input, description: "National producer number", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Producer legal name" }
      - { name: home_state_code, type: string, source: input, description: "Home jurisdiction code (informational)" }
      - { name: active_license_count, type: integer, source: computed, description: "Count of own ProducerLicense rows with status == ISSUED", default: 0 }

  - name: ProducerLicense
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id" }
      - { name: state_code, type: string, source: input, description: "Jurisdiction of licensure; must match an existing State.code" }
      - { name: license_class, type: enum, source: input, description: "LIFE | HEALTH | PROPERTY_CASUALTY | PERSONAL_LINES", constraints: "enum: LIFE, HEALTH, PROPERTY_CASUALTY, PERSONAL_LINES" }
      - { name: effective_from, type: datetime, source: input, description: "Closed-interval window start; must be < valid_until" }
      - { name: valid_until, type: datetime, source: input, description: "Closed-interval window end; license EXPIRED once logical clock passes it" }
      - { name: status, type: enum, source: system, description: "See state_machines.ProducerLicense", default: APPLIED, constraints: "enum: APPLIED, ISSUED, REVOKED, EXPIRED" }

  - name: MarketConductCall
    parent: null
    common_fields: true
    fields:
      - { name: call_code, type: string, source: input, description: "Unique data-call code", constraints: "unique" }
      - { name: topic, type: string, source: input, description: "Subject matter of the coordinated data call" }
      - { name: lead_state_code, type: string, source: system, description: "Derived from the acting StateRegulator's State.code at creation (never client-supplied)" }
      - { name: total_cost_cents, type: integer, source: input, description: "Examination cost pool to allocate across responding insurers; >= MIN_CALL_COST_CENTS (100000)" }
      - { name: status, type: enum, source: system, description: "OPEN until closed", default: OPEN, constraints: "enum: OPEN, CLOSED" }

  - name: MarketConductResponse
    parent: null
    common_fields: true
    fields:
      - { name: call_id, type: string, source: input, description: "FK -> MarketConductCall.id (path call)" }
      - { name: insurer_naic_code, type: string, source: system, description: "Derived from the acting InsurerUser's Insurer.naic_code (never client-supplied)" }
      - { name: direct_premium_cents, type: integer, source: input, description: "Direct written premium in the call's subject line; > 0" }
      - { name: complaint_count, type: integer, source: input, description: "Confirmed complaints in the subject line; >= 0" }
      - { name: exam_priority_score, type: number, source: computed, description: "exam_priority_score at creation (see calculations); 2 decimals round_half_up" }
      - { name: escalation_flag, type: boolean, source: computed, description: "True when the insurer is UNDER_SUPERVISION at response creation, or set true by the RBC supervision cascade", default: false }
      - { name: allocated_cost_cents, type: integer, source: computed, description: "Cost share assigned at call close; null until then", default: null }
      - { name: cost_share_excluded, type: boolean, source: computed, description: "True when pass-1 share fell below MIN_SHARE_PCT at close; null until close", default: null }

  - name: ValuationStandard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Standard code, e.g. VM-20", constraints: "unique together with version_label" }
      - { name: version_label, type: string, source: input, description: "Version tag within the code line", constraints: "unique together with code" }
      - { name: guidance_text, type: string, source: input, description: "Actuarial guidance body" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creating Actuary; the same id may not activate the standard (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> RETIRED (retired by activation of a successor version)", default: DRAFT, constraints: "enum: DRAFT, ACTIVE, RETIRED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ModelAct
    initial_state: DRAFTING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFTING
        to: EXPOSURE_OPEN
        trigger: "POST /naic/exposure-drafts (first exposure draft for this act)"
        actor: AssociationStaff
        preconditions: ["act.status == DRAFTING", "window and overlap validations pass (see validations)"]
        side_effects: ["ExposureDraft created with exposure_number == 1", "act.version increments"]
      - from: EXPOSURE_OPEN
        to: EXPOSURE_OPEN
        trigger: "POST /naic/exposure-drafts (additional draft; act stays EXPOSURE_OPEN, no status change)"
        actor: AssociationStaff
        preconditions: ["window and overlap validations pass"]
        side_effects: ["ExposureDraft created with exposure_number == prior count + 1", "act.version increments"]
        note: "Self-loop recorded so the second-draft path is an explicit transition, not an implicit no-op."
      - from: EXPOSURE_OPEN
        to: BALLOTING
        trigger: "POST /naic/exposure-drafts/{id}/close when that draft was the last OPEN draft of the act"
        actor: AssociationStaff
        preconditions: ["draft.status == OPEN", "logical clock >= draft.comment_window_end (ERR_COMMENT_WINDOW_OPEN)", "after closing, no other OPEN draft remains on the act"]
        side_effects: ["draft.status := CLOSED", "act.status := BALLOTING", "act.version increments"]
      - from: BALLOTING
        to: ADOPTED
        trigger: "POST /naic/model-acts/{id}/close-ballot when ballot_adoption_rule passes"
        actor: AssociationStaff
        preconditions: ["act.status == BALLOTING (ERR_ACT_NOT_BALLOTING)"]
        side_effects: ["act.votes_cast and act.favorable_votes recomputed from CAST ballots", "act.version increments"]
      - from: BALLOTING
        to: DRAFTING
        trigger: "POST /naic/model-acts/{id}/close-ballot when ballot_adoption_rule fails (revision loop)"
        actor: AssociationStaff
        preconditions: ["act.status == BALLOTING (ERR_ACT_NOT_BALLOTING)"]
        side_effects: ["every CAST MemberBallot of this act becomes VOID (cascade, hop 1)", "act.votes_cast := 0 and act.favorable_votes := 0 (cascade, hop 2)", "act.version increments"]
      - from: ADOPTED
        to: PUBLISHED
        trigger: "POST /naic/model-acts/{id}/publish"
        actor: AssociationStaff
        preconditions: ["act.status == ADOPTED (ERR_ACT_NOT_ADOPTED)"]
        side_effects:
          - "act.published_at := current logical clock; act.version increments"
          - "cascade hop 1: any other ModelAct with same model_code and status == PUBLISHED becomes SUPERSEDED"
          - "cascade hop 2: every StateAdoption of each superseded act with status IN {PENDING_CERTIFICATION, CERTIFIED_SIMILAR, CERTIFIED_VARIED} becomes SUPERSEDED (REJECTED_NOT_SIMILAR adoptions are untouched)"
          - "cascade hop 3: State.core_act_coverage_pct recomputed for every state whose adoption was superseded in hop 2"
          - "cascade hop 4: for each such state with accreditation_status == ACCREDITED and recomputed coverage < MIN_COVERAGE_PCT (50.0), an AccreditationReview is auto-created (origin AUTO_COVERAGE, team_lead_id null, period [now, now + 180 days], self_assessment fields 0/1, status SCHEDULED)"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a successor act with the same model_code transitions ADOPTED -> PUBLISHED"
        actor: system
        preconditions: []
        side_effects: ["see publish cascade hops 2-4 on the successor's publish transition"]

  - entity: ExposureDraft
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /naic/exposure-drafts/{id}/close"
        actor: AssociationStaff
        preconditions: ["draft.status == OPEN (ERR_EXPOSURE_DRAFT_NOT_OPEN)", "logical clock >= comment_window_end (ERR_COMMENT_WINDOW_OPEN)"]
        side_effects: ["if this was the last OPEN draft of the parent act, act EXPOSURE_OPEN -> BALLOTING", "draft.version increments"]

  - entity: MemberBallot
    initial_state: CAST
    terminal_states: [VOID]
    transitions:
      - from: CAST
        to: VOID
        trigger: "system: parent act's close-ballot fails the adoption rule (BALLOTING -> DRAFTING)"
        actor: system
        preconditions: []
        side_effects: ["ballot excluded from votes_cast / favorable_votes thereafter"]

  - entity: State
    initial_state: ACCREDITED
    terminal_states: []
    transitions:
      - from: ACCREDITED
        to: PROBATION
        trigger: "POST /naic/reviews/{id}/finalize yields FINAL_FAIL and state.consecutive_fail_count becomes 1"
        actor: system
        preconditions: []
        side_effects: ["state.consecutive_fail_count := 1", "state.version increments"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /naic/reviews/{id}/finalize yields FINAL_FAIL and state.consecutive_fail_count becomes 2"
        actor: system
        preconditions: []
        side_effects: ["state.consecutive_fail_count := 2", "state.version increments"]
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "POST /naic/reviews/{id}/finalize yields FINAL_FAIL and consecutive_fail_count was already >= 2"
        actor: system
        preconditions: []
        side_effects: ["state.consecutive_fail_count += 1", "state.version increments"]
      - from: ACCREDITED
        to: ACCREDITED
        trigger: "POST /naic/reviews/{id}/finalize yields FINAL_PASS"
        actor: system
        preconditions: []
        side_effects: ["state.consecutive_fail_count := 0", "state.version increments"]
      - from: PROBATION
        to: ACCREDITED
        trigger: "POST /naic/reviews/{id}/finalize yields FINAL_PASS"
        actor: system
        preconditions: []
        side_effects: ["state.consecutive_fail_count := 0", "state.version increments"]
      - from: SUSPENDED
        to: ACCREDITED
        trigger: "POST /naic/reviews/{id}/finalize yields FINAL_PASS (reinstatement loop)"
        actor: system
        preconditions: []
        side_effects: ["state.consecutive_fail_count := 0", "state.version increments"]

  - entity: StateAdoption
    initial_state: PENDING_CERTIFICATION
    terminal_states: [REJECTED_NOT_SIMILAR, SUPERSEDED]
    transitions:
      - from: PENDING_CERTIFICATION
        to: CERTIFIED_SIMILAR
        trigger: "POST /naic/adoptions/{id}/certify with variation_class == SUBSTANTIALLY_SIMILAR"
        actor: AssociationStaff
        preconditions: ["adoption.status == PENDING_CERTIFICATION (ERR_ADOPTION_NOT_PENDING)"]
        side_effects: ["adopting state's core_act_coverage_pct recomputed", "adoption.version increments"]
      - from: PENDING_CERTIFICATION
        to: CERTIFIED_VARIED
        trigger: "POST /naic/adoptions/{id}/certify with variation_class == SUBSTANTIVE_VARIATIONS"
        actor: AssociationStaff
        preconditions: ["adoption.status == PENDING_CERTIFICATION (ERR_ADOPTION_NOT_PENDING)"]
        side_effects: ["adopting state's core_act_coverage_pct recomputed", "adoption.version increments"]
      - from: PENDING_CERTIFICATION
        to: REJECTED_NOT_SIMILAR
        trigger: "POST /naic/adoptions/{id}/certify with variation_class == NOT_SIMILAR"
        actor: AssociationStaff
        preconditions: ["adoption.status == PENDING_CERTIFICATION (ERR_ADOPTION_NOT_PENDING)"]
        side_effects: ["adopting state's core_act_coverage_pct recomputed", "adoption.version increments"]
      - from: CERTIFIED_SIMILAR
        to: SUPERSEDED
        trigger: "system: a successor adoption by the same state for the same act is certified, OR the adopted act becomes SUPERSEDED"
        actor: system
        preconditions: []
        side_effects: ["adopting state's core_act_coverage_pct recomputed"]
      - from: CERTIFIED_VARIED
        to: SUPERSEDED
        trigger: "system: a successor adoption by the same state for the same act is certified, OR the adopted act becomes SUPERSEDED"
        actor: system
        preconditions: []
        side_effects: ["adopting state's core_act_coverage_pct recomputed"]
      - from: PENDING_CERTIFICATION
        to: SUPERSEDED
        trigger: "system: the adopted act becomes SUPERSEDED (publish cascade hop 2)"
        actor: system
        preconditions: []
        side_effects: ["adopting state's core_act_coverage_pct recomputed"]

  - entity: AccreditationReview
    initial_state: SCHEDULED
    terminal_states: [FINAL_PASS, FINAL_FAIL]
    transitions:
      - from: SCHEDULED
        to: FINDINGS_ISSUED
        trigger: "POST /naic/reviews/{id}/issue-findings"
        actor: ReviewTeamLead
        preconditions: ["review.status == SCHEDULED (ERR_REVIEW_NOT_SCHEDULED)", "X-User-ID == review.team_lead_id (ERR_FORBIDDEN); a null team_lead_id can never match, so AUTO_COVERAGE reviews cannot issue findings until reassigned (out of scope of this API)"]
        side_effects: ["onsite_score computed (accreditation_score onsite variant)", "proposed_outcome := PASS iff onsite_score >= 75.0 else FAIL", "review.version increments"]
      - from: FINDINGS_ISSUED
        to: FINAL_PASS
        trigger: "POST /naic/reviews/{id}/finalize when proposed_outcome == PASS"
        actor: AssociationStaff
        preconditions: ["review.status == FINDINGS_ISSUED (ERR_REVIEW_NOT_FINDINGS_ISSUED)"]
        side_effects: ["state.accreditation_status := ACCREDITED and consecutive_fail_count := 0 (see state_machines.State)", "review.version increments"]
      - from: FINDINGS_ISSUED
        to: FINAL_FAIL
        trigger: "POST /naic/reviews/{id}/finalize when proposed_outcome == FAIL"
        actor: AssociationStaff
        preconditions: ["review.status == FINDINGS_ISSUED (ERR_REVIEW_NOT_FINDINGS_ISSUED)"]
        side_effects: ["state.consecutive_fail_count += 1; accreditation_status := PROBATION when the count becomes 1, SUSPENDED when it becomes >= 2 (see state_machines.State)", "review.version increments"]

  - entity: FinancialFiling
    initial_state: DRAFT
    terminal_states: [VALIDATED, EDITS_FAILED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /naic/filings/{id}/submit"
        actor: InsurerUser
        preconditions: ["filing.status == DRAFT (ERR_FILING_NOT_DRAFT)", "X-User-ID == filing.insurer_id (ERR_FORBIDDEN)"]
        side_effects: ["filing.version increments"]
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /naic/filings/{id}/validate when all validation edits pass"
        actor: AssociationStaff
        preconditions: ["filing.status == SUBMITTED (ERR_FILING_NOT_SUBMITTED)", "pinned valuation standard still ACTIVE (ERR_VALUATION_STANDARD_NOT_ACTIVE)", "edits E101/E103/E106/E107 all pass (else EDITS_FAILED, not an error)"]
        side_effects:
          - "cascade hop 1: RBCReport created for this filing (rbc_capital_aggregation + rbc_action_level)"
          - "cascade hop 2: insurer.latest_rbc_ratio / latest_action_level set from the new report; insurer.status := UNDER_SUPERVISION when action_level IN {AUTHORIZED_CONTROL, MANDATORY_CONTROL}, else ACTIVE"
          - "cascade hop 3: when the insurer became UNDER_SUPERVISION in hop 2, every MarketConductResponse by that insurer on an OPEN call gets escalation_flag := true"
          - "filing.edit_failures := []"
          - "filing.version increments; insurer.version increments"
      - from: SUBMITTED
        to: EDITS_FAILED
        trigger: "POST /naic/filings/{id}/validate when at least one validation edit fails"
        actor: AssociationStaff
        preconditions: ["filing.status == SUBMITTED (ERR_FILING_NOT_SUBMITTED)", "pinned valuation standard still ACTIVE (ERR_VALUATION_STANDARD_NOT_ACTIVE)"]
        side_effects: ["filing.edit_failures := list of failed edit ids", "no RBCReport is created", "filing.version increments"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a new filing is created for the same (insurer_id, period_year, period_quarter)"
        actor: system
        preconditions: []
        side_effects: ["see POST /naic/filings supersede semantics", "filing.version increments"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a new filing is created for the same (insurer_id, period_year, period_quarter)"
        actor: system
        preconditions: []
        side_effects: ["filing.version increments"]
      - from: EDITS_FAILED
        to: SUPERSEDED
        trigger: "system: a new filing is created for the same (insurer_id, period_year, period_quarter)"
        actor: system
        preconditions: []
        side_effects: ["filing.version increments"]
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system: a new filing is created for the same (insurer_id, period_year, period_quarter)"
        actor: system
        preconditions: []
        side_effects: ["its RBCReport remains for history but insurer.latest_rbc_ratio / latest_action_level are recomputed to null until a successor filing validates", "filing.version increments"]

  - entity: Insurer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: UNDER_SUPERVISION
        trigger: "system: a filing validates with action_level IN {AUTHORIZED_CONTROL, MANDATORY_CONTROL}"
        actor: system
        preconditions: []
        side_effects: ["escalation cascade (see FinancialFiling VALIDATED hop 3)"]
      - from: UNDER_SUPERVISION
        to: ACTIVE
        trigger: "system: a filing validates with action_level IN {NONE, COMPANY_ACTION, REGULATORY_ACTION} (reinstatement loop)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProducerLicense
    initial_state: APPLIED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /naic/licenses/{id}/issue"
        actor: StateRegulator
        preconditions: ["license.status == APPLIED (ERR_LICENSE_NOT_APPLIED)", "State with code == license.state_code has accreditation_status != SUSPENDED (ERR_STATE_SUSPENDED)", "acting regulator's State.code == license.state_code (ERR_FORBIDDEN)"]
        side_effects: ["producer.active_license_count += 1", "license.version increments"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /naic/licenses/{id}/revoke"
        actor: StateRegulator
        preconditions: ["license.status == ISSUED (ERR_LICENSE_NOT_ISSUED)", "acting regulator's State.code == license.state_code (ERR_FORBIDDEN)"]
        side_effects: ["producer.active_license_count -= 1", "license.version increments"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /naic/_clock/set_current_utc advances the logical clock past valid_until"
        actor: system
        preconditions: ["new logical clock > license.valid_until"]
        side_effects: ["producer.active_license_count -= 1", "license.version increments"]

  - entity: MarketConductCall
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /naic/market-conduct-calls/{id}/close"
        actor: StateRegulator
        preconditions: ["call.status == OPEN (ERR_CALL_NOT_OPEN)", "acting regulator's State.code == call.lead_state_code (ERR_FORBIDDEN)", "at least 1 MarketConductResponse exists on the call (ERR_CALL_NO_RESPONSES)"]
        side_effects: ["cost_share_assessment runs; each response gets allocated_cost_cents and cost_share_excluded", "call.version increments"]

  - entity: ValuationStandard
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /naic/valuation-standards/{id}/activate"
        actor: Actuary
        preconditions: ["standard.status == DRAFT (ERR_STANDARD_NOT_DRAFT)", "X-User-ID != standard.author_user_id (ERR_SELF_ACTIVATION_FORBIDDEN)"]
        side_effects: ["cascade: any other standard with same code and status == ACTIVE becomes RETIRED", "standard.version increments"]
      - from: ACTIVE
        to: RETIRED
        trigger: "system: a successor standard with the same code is activated"
        actor: system
        preconditions: []
        side_effects: ["filings pinned to the retired version fail validate with ERR_VALUATION_STANDARD_NOT_ACTIVE"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: filing-refile-stale-insurer
    parent_entity: Insurer
    write_endpoint: "POST /naic/filings"
    occ_field: "expected_insurer_version"
    description: |
      Creating a FinancialFiling against an Insurer whose version has advanced
      since the client last observed it is rejected. A new filing for an
      already-used (insurer, period_year, period_quarter) legitimately
      supersedes the prior filing, so a client holding a stale insurer version
      must be refused rather than allowed to supersede on an outdated view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: adoption-supersede-stale-state
    parent_entity: State
    write_endpoint: "POST /naic/adoptions"
    occ_field: "expected_state_version"
    description: |
      Creating a StateAdoption against a State whose version has advanced
      since the client last observed it is rejected. A new adoption for an
      act the state has already certified legitimately supersedes the prior
      certified adoption, so a client holding a stale state version must be
      refused rather than allowed to supersede on an outdated view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ballot_adoption_rule
    trigger: "POST /naic/model-acts/{id}/close-ballot"
    algorithm: threshold
    formula: |
      eligible_count := count(State with accreditation_status IN {ACCREDITED, PROBATION})
      quorum := ceil(QUORUM_PCT * eligible_count)
      votes_cast := count(MemberBallot of act with status == CAST)   # YEA + NAY + ABSTAIN all count
      favorable := count(MemberBallot of act with status == CAST and vote == YEA)
      required_yea := ceil(SUPERMAJORITY_NUM / SUPERMAJORITY_DEN * votes_cast)
      ADOPTION_PASSES := (votes_cast >= quorum) AND (favorable >= required_yea)
      On pass: act BALLOTING -> ADOPTED. On fail: act BALLOTING -> DRAFTING and all CAST ballots become VOID.
    input_set: "All states (eligibility filter above); ballots of this act with status == CAST only (VOID ballots excluded)"
    constants:
      QUORUM_PCT: 0.60
      SUPERMAJORITY_NUM: 2
      SUPERMAJORITY_DEN: 3
    precision: "integer arithmetic with ceil at exactly the two points shown"
    variants: []

  - name: rbc_capital_aggregation
    trigger: "POST /naic/filings/{id}/validate when validation edits pass (FinancialFiling SUBMITTED -> VALIDATED)"
    algorithm: aggregation
    formula: |
      tac_cents := round_half_up(reported_surplus_cents, 2)
      # PINNED ROUNDING ORDER (mode b): square and sum the integer cent charges,
      # take sqrt, THEN round the ACL to 2 decimals half-up, THEN divide.
      acl_covariance_cents := round_half_up(sqrt(asset_risk_cents^2 + underwriting_risk_cents^2 + other_risk_cents^2), 2)
      acl_additive_cents := round_half_up(asset_risk_cents + underwriting_risk_cents + other_risk_cents, 2)
      ratio_covariance := round_half_up(tac_cents / acl_covariance_cents, 4)   # uses the ROUNDED ACL, never the unrounded sqrt
      ratio_additive := round_half_up(tac_cents / acl_additive_cents, 4)
      # Dividing by the unrounded sqrt is a different, prohibited order:
      # e.g. charges (1,1,1), surplus 3 -> pinned order yields 1.7341; unpinned yields 1.7321.
    input_set: "Exactly the filing being validated; no other filings or insurers are read"
    constants: {}
    precision: "2 decimals round_half_up for money; 4 decimals round_half_up for ratios"
    variants: []

  - name: rbc_action_level
    trigger: "Immediately after rbc_capital_aggregation on the same validate call"
    algorithm: threshold
    formula: |
      if ratio_covariance >= 2.0000: action_level := NONE
      elif ratio_covariance >= 1.5000: action_level := COMPANY_ACTION
      elif ratio_covariance >= 1.0000: action_level := REGULATORY_ACTION
      elif ratio_covariance >= 0.7000: action_level := AUTHORIZED_CONTROL
      else: action_level := MANDATORY_CONTROL
      # Boundaries are inclusive on the lower edge of each upper band:
      # exactly 2.0000 -> NONE; 1.9999 -> COMPANY_ACTION.
    input_set: "ratio_covariance of the RBCReport just computed"
    constants:
      NONE_FLOOR: 2.0000
      COMPANY_FLOOR: 1.5000
      REGULATORY_FLOOR: 1.0000
      AUTHORIZED_FLOOR: 0.7000
    precision: "comparison applied to the 4-decimal rounded ratio"
    variants:
      - name: covariance_official
        when: "always; drives action_level, insurer.latest_rbc_ratio and the supervision cascade"
        difference: "uses acl_covariance_cents (sqrt of squared charges), the smaller ACL, hence the higher ratio"
      - name: additive_upper_bound
        when: "reported alongside as ratio_additive for conservative review; never drives action_level"
        difference: "uses acl_additive_cents (plain sum), the larger ACL, hence an equal or lower ratio; identical filing data can classify differently under the two variants (e.g. charges 1000000/800000/600000, surplus 4000000 -> covariance 2.8284 NONE vs additive 1.6667 COMPANY_ACTION)"

  - name: accreditation_score
    trigger: "desk variant at POST /naic/reviews; onsite variant at POST /naic/reviews/{id}/issue-findings"
    algorithm: weighted_scoring
    formula: |
      desk_score := round_half_up(100 * self_assessment_compliant / self_assessment_total, 1)
      onsite_score := round_half_up(100 * findings_compliant / findings_total, 1)
      proposed_outcome := PASS iff onsite_score >= PASS_THRESHOLD else FAIL
    input_set: "desk: the self-assessment counts supplied at creation; onsite: the findings counts supplied at issue-findings"
    constants:
      PASS_THRESHOLD: 75.0
    precision: "1 decimal, round_half_up"
    variants:
      - name: desk_self_assessed
        when: "computed at review creation from state-reported counts"
        difference: "uses self_assessment_* inputs; a state can score PASS-worthy at desk yet FAIL on site (18/20 desk = 90.0 vs 12/20 onsite = 60.0)"
      - name: onsite_findings
        when: "computed at issue-findings from review-team counts; sole input to proposed_outcome"
        difference: "uses findings_* inputs; overrides the desk picture entirely"

  - name: exam_priority_score
    trigger: "POST /naic/market-conduct-calls/{id}/responses (computed at response creation)"
    algorithm: weighted_scoring
    formula: |
      complaints_per_million := 100000000 * complaint_count / direct_premium_cents
      complaint_points := COMPLAINT_WEIGHT * min(COMPLAINT_CAP, complaints_per_million)
      latest_ratio := the responding insurer's latest_rbc_ratio (null when no VALIDATED non-SUPERSEDED filing exists)
      if latest_ratio is null: rbc_points := NEUTRAL_RBC_POINTS
      elif latest_ratio < 0.7000: rbc_points := 50
      elif latest_ratio < 1.0000: rbc_points := 35
      elif latest_ratio < 1.5000: rbc_points := 20
      elif latest_ratio < 2.0000: rbc_points := 10
      else: rbc_points := 0
      share := direct_premium_cents / sum(direct_premium_cents over all responses on this call, including this one)
      if share >= 0.25: share_points := 20
      elif share >= 0.10: share_points := 10
      else: share_points := 0
      exam_priority_score := round_half_up(min(SCORE_CAP, complaint_points + rbc_points + share_points), 2)
    input_set: "The response being created; the responding insurer's latest_rbc_ratio; all existing responses on the same call (share denominator)"
    constants:
      COMPLAINT_WEIGHT: 0.5
      COMPLAINT_CAP: 50
      NEUTRAL_RBC_POINTS: 25
      SCORE_CAP: 100
    precision: "2 decimals, round_half_up"

  - name: cost_share_assessment
    trigger: "POST /naic/market-conduct-calls/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER (mode c — circular-looking floor):
      # pass 1 computes shares over ALL responses; the floor exclusion uses pass-1 shares;
      # pass 2 renormalizes ONCE over survivors. No iteration to a fixed point.
      pass1_share_i := premium_i / sum(premium over all responses)
      survivors := { i : pass1_share_i >= MIN_SHARE_PCT }   # excluded responses get cost_share_excluded := true, allocated_cost_cents := 0
      if survivors is empty: every response is a survivor (no exclusion applied)   # pinned empty-set fallback
      pass2_share_i := premium_i / sum(premium over survivors)   # for i in survivors
      raw_cents_i := total_cost_cents * pass2_share_i
      allocated_cost_cents_i := floor(raw_cents_i)
      remainder := total_cost_cents - sum(allocated over survivors)
      # distribute the remainder one cent at a time by descending fractional part of raw_cents_i;
      # tie-break: insurer_naic_code ASC (deterministic; ids never decide)
      add 1 cent to the first `remainder` survivors in that order
      INVARIANT: sum(allocated_cost_cents over all responses) == total_cost_cents
    input_set: "All MarketConductResponse rows of the call (any creation order); the call's total_cost_cents"
    constants:
      MIN_SHARE_PCT: 0.05
    precision: "integer cents; floor then largest-remainder distribution"

  - name: core_act_coverage
    trigger: "StateAdoption certify; StateAdoption supersede (either cascade hop); ModelAct publish (for every affected state)"
    algorithm: aggregation
    formula: |
      numerator := count(StateAdoption of the state with status IN {CERTIFIED_SIMILAR, CERTIFIED_VARIED}
                         whose ModelAct.is_core == true)
      denominator := count(ModelAct with status == PUBLISHED and is_core == true)
      core_act_coverage_pct := 100.0 when denominator == 0
                               else round_half_up(100.0 * numerator / denominator, 1)
    input_set: "StateAdoption rows of exactly this state in the two certified statuses; all PUBLISHED core acts"
    constants:
      MIN_COVERAGE_PCT: 50.0
    precision: "1 decimal, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first failing check wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role; for entity_backed roles X-User-ID must name an existing instance of that entity", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed on the endpoint; ownership rules: StateRegulator's State.code must equal the ballot/adoption/license/call state_code (call close: lead_state_code); InsurerUser's id must equal the filing/response insurer; ProducerUser's id must equal the license producer_id; ReviewTeamLead's X-User-ID must equal review.team_lead_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids resolve left-to-right (act, draft, state, adoption, review, insurer, filing, producer, license, call)", error_id: ERR_MODEL_ACT_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids; per-resource ids: ERR_EXPOSURE_DRAFT_NOT_FOUND, ERR_STATE_NOT_FOUND, ERR_ADOPTION_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_INSURER_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_PRODUCER_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_MARKET_CONDUCT_CALL_NOT_FOUND, ERR_VALUATION_STANDARD_NOT_FOUND" }
  - { priority: 4, category: existence, check: "Body references resolve: model_act_id, insurer_id, producer_id, state_code / domicile_state_code, valuation_standard_code", error_id: ERR_STATE_NOT_FOUND, http_status: 404, applies_to: "POST endpoints with body references; id per referenced resource kind (ERR_MODEL_ACT_NOT_FOUND, ERR_INSURER_NOT_FOUND, ERR_PRODUCER_NOT_FOUND, ERR_STATE_NOT_FOUND, ERR_VALUATION_STANDARD_NOT_FOUND)" }
  - { priority: 5, category: existence, check: "Request shape: required fields present; enums valid; integer amounts >= 0 (direct_premium_cents > 0); window end strictly after start; findings/self-assessment totals >= 1 with compliant <= total", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "Exposure-draft create: act.status IN {DRAFTING, EXPOSURE_OPEN}", error_id: ERR_ACT_NOT_OPEN_FOR_EXPOSURE, http_status: 409, applies_to: "POST /naic/exposure-drafts" }
  - { priority: 7, category: state, check: "Draft close: draft.status == OPEN; then logical clock >= comment_window_end", error_id: ERR_EXPOSURE_DRAFT_NOT_OPEN, http_status: 409, applies_to: "POST /naic/exposure-drafts/{id}/close (clock check: ERR_COMMENT_WINDOW_OPEN, 409)" }
  - { priority: 8, category: state, check: "Ballot cast and close-ballot: act.status == BALLOTING", error_id: ERR_ACT_NOT_BALLOTING, http_status: 409, applies_to: "POST /naic/model-acts/{id}/ballots, POST /naic/model-acts/{id}/close-ballot" }
  - { priority: 9, category: state, check: "Publish: act.status == ADOPTED", error_id: ERR_ACT_NOT_ADOPTED, http_status: 409, applies_to: "POST /naic/model-acts/{id}/publish" }
  - { priority: 10, category: state, check: "Adoption create: act.status == PUBLISHED", error_id: ERR_ACT_NOT_PUBLISHED, http_status: 422, applies_to: "POST /naic/adoptions" }
  - { priority: 11, category: state, check: "Certify: adoption.status == PENDING_CERTIFICATION", error_id: ERR_ADOPTION_NOT_PENDING, http_status: 409, applies_to: "POST /naic/adoptions/{id}/certify" }
  - { priority: 12, category: state, check: "Issue-findings: review.status == SCHEDULED; finalize: review.status == FINDINGS_ISSUED", error_id: ERR_REVIEW_NOT_SCHEDULED, http_status: 409, applies_to: "POST /naic/reviews/{id}/issue-findings (finalize: ERR_REVIEW_NOT_FINDINGS_ISSUED, 409)" }
  - { priority: 13, category: state, check: "Submit: filing.status == DRAFT; validate: filing.status == SUBMITTED", error_id: ERR_FILING_NOT_DRAFT, http_status: 409, applies_to: "POST /naic/filings/{id}/submit (validate: ERR_FILING_NOT_SUBMITTED, 409)" }
  - { priority: 14, category: state, check: "License issue: license.status == APPLIED; revoke: license.status == ISSUED", error_id: ERR_LICENSE_NOT_APPLIED, http_status: 409, applies_to: "POST /naic/licenses/{id}/issue (revoke: ERR_LICENSE_NOT_ISSUED, 409)" }
  - { priority: 15, category: state, check: "Respond / close: call.status == OPEN", error_id: ERR_CALL_NOT_OPEN, http_status: 409, applies_to: "POST /naic/market-conduct-calls/{id}/responses, POST /naic/market-conduct-calls/{id}/close" }
  - { priority: 16, category: state, check: "Activate: standard.status == DRAFT", error_id: ERR_STANDARD_NOT_DRAFT, http_status: 409, applies_to: "POST /naic/valuation-standards/{id}/activate" }
  - { priority: 17, category: state, check: "OCC: expected_insurer_version == insurer.version (POST /naic/filings); expected_state_version == state.version (POST /naic/adoptions)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /naic/filings, POST /naic/adoptions" }
  - { priority: 18, category: business_safety, check: "Review create: team_lead_id differs from the team_lead_id of the same state's most recent FINAL_PASS / FINAL_FAIL review", error_id: ERR_REVIEWER_ROTATION_REQUIRED, http_status: 422, applies_to: "POST /naic/reviews" }
  - { priority: 19, category: business_safety, check: "Standard activate: X-User-ID != standard.author_user_id", error_id: ERR_SELF_ACTIVATION_FORBIDDEN, http_status: 422, applies_to: "POST /naic/valuation-standards/{id}/activate" }
  - { priority: 20, category: business_constraint, check: "Uniqueness: (model_code, version_label) on ModelAct; naic_code on Insurer; npn on Producer; (code, version_label) on ValuationStandard; call_code on MarketConductCall", error_id: ERR_DUPLICATE_MODEL_ACT, http_status: 409, applies_to: "create endpoints (per-resource ids: ERR_DUPLICATE_NAIC_CODE, ERR_DUPLICATE_NPN, ERR_DUPLICATE_STANDARD_VERSION, ERR_DUPLICATE_CALL_CODE)" }
  - { priority: 21, category: business_constraint, check: "Exposure window length >= MIN_COMMENT_DAYS (30 days)", error_id: ERR_COMMENT_WINDOW_TOO_SHORT, http_status: 422, applies_to: "POST /naic/exposure-drafts" }
  - { priority: 22, category: business_constraint, check: "Ballot: voting state's accreditation_status != SUSPENDED", error_id: ERR_VOTING_STATE_SUSPENDED, http_status: 422, applies_to: "POST /naic/model-acts/{id}/ballots" }
  - { priority: 23, category: business_constraint, check: "Ballot: no existing CAST ballot by the same state on the same act", error_id: ERR_DUPLICATE_BALLOT, http_status: 409, applies_to: "POST /naic/model-acts/{id}/ballots" }
  - { priority: 24, category: business_constraint, check: "Adoption: no existing PENDING_CERTIFICATION adoption by the same state for the same act", error_id: ERR_DUPLICATE_ADOPTION, http_status: 409, applies_to: "POST /naic/adoptions" }
  - { priority: 25, category: business_constraint, check: "Response: no existing response by the same insurer on the same call", error_id: ERR_DUPLICATE_RESPONSE, http_status: 409, applies_to: "POST /naic/market-conduct-calls/{id}/responses" }
  - { priority: 26, category: business_constraint, check: "License issue: State with code == license.state_code has accreditation_status != SUSPENDED", error_id: ERR_STATE_SUSPENDED, http_status: 422, applies_to: "POST /naic/licenses/{id}/issue" }
  - { priority: 27, category: business_temporal, check: "Exposure window (half-open [start, end)) must not intersect the window of any other existing draft of the same act in any status; adjacency (new start == existing end) is allowed", error_id: ERR_EXPOSURE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /naic/exposure-drafts" }
  - { priority: 28, category: business_temporal, check: "Review periods (closed [start, end]) of the same state must not intersect; then the new period_start minus the most recent prior period_end must be >= MIN_REVIEW_GAP_DAYS (180)", error_id: ERR_REVIEW_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /naic/reviews (gap check: ERR_REVIEW_GAP_TOO_SHORT, 422)" }
  - { priority: 29, category: business_temporal, check: "License windows (closed [effective_from, valid_until]) for the same (producer_id, state_code, license_class) with status IN {APPLIED, ISSUED} must not intersect; touching endpoints count as overlap", error_id: ERR_LICENSE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /naic/licenses" }
  - { priority: 30, category: business_referential, check: "Filing create: valuation_standard_code must resolve to an ACTIVE standard (version pinned at creation); validate: the pinned version must still be the ACTIVE one for its code", error_id: ERR_VALUATION_STANDARD_NOT_ACTIVE, http_status: 422, applies_to: "POST /naic/filings, POST /naic/filings/{id}/validate" }
  - { priority: 31, category: business_fiscal, check: "total_cost_cents >= MIN_CALL_COST_CENTS (100000)", error_id: ERR_CALL_COST_BELOW_MINIMUM, http_status: 422, applies_to: "POST /naic/market-conduct-calls" }
  - { priority: 32, category: business_constraint, check: "Call close: at least 1 response exists", error_id: ERR_CALL_NO_RESPONSES, http_status: 422, applies_to: "POST /naic/market-conduct-calls/{id}/close" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/naic/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Advancing past a license's valid_until expires it (ISSUED -> EXPIRED)."
    roles: [AssociationStaff]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["license expiry sweep (see state_machines.ProducerLicense)"]
  - method: POST
    path: "/naic/model-acts"
    description: "Create a model law/regulation in DRAFTING"
    roles: [AssociationStaff]
    code: 201
    input: [model_code, version_label, title, act_type, committee_name, "is_core?"]
    output: ModelAct
    side_effects: []
  - method: GET
    path: "/naic/model-acts/{id}"
    description: "Read one model act"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: []
    output: ModelAct
    side_effects: []
  - method: POST
    path: "/naic/model-acts/{id}/close-ballot"
    description: "Tally CAST ballots per ballot_adoption_rule; act moves BALLOTING -> ADOPTED (pass) or BALLOTING -> DRAFTING (fail, ballots voided)"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: ModelAct
    side_effects: ["ballot_adoption_rule", "on fail: CAST ballots become VOID"]
  - method: POST
    path: "/naic/model-acts/{id}/publish"
    description: "Publish an ADOPTED act; supersedes the prior PUBLISHED act of the same model_code and fires the coverage cascade"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: ModelAct
    side_effects: ["supersede cascade hops 1-4 (see state_machines.ModelAct)", "core_act_coverage recompute"]
  - method: POST
    path: "/naic/exposure-drafts"
    description: "Open an exposure draft on an act; first draft moves the act DRAFTING -> EXPOSURE_OPEN"
    roles: [AssociationStaff]
    code: 201
    input: [model_act_id, comment_window_start, comment_window_end]
    output: ExposureDraft
    side_effects: ["act DRAFTING -> EXPOSURE_OPEN on first draft", "act.version increments"]
  - method: GET
    path: "/naic/model-acts/{id}/exposure-drafts"
    description: "List exposure drafts of an act"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: ExposureDraft[]
    side_effects: []
  - method: POST
    path: "/naic/exposure-drafts/{id}/close"
    description: "Close an OPEN draft once the logical clock has reached comment_window_end; closing the last OPEN draft moves the act to BALLOTING"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: ExposureDraft
    side_effects: ["act EXPOSURE_OPEN -> BALLOTING when this was the last OPEN draft"]
  - method: POST
    path: "/naic/model-acts/{id}/ballots"
    description: "Cast the acting state's ballot on a BALLOTING act"
    roles: [StateRegulator]
    code: 201
    input: [state_code, vote]
    output: MemberBallot
    side_effects: ["act.votes_cast / favorable_votes recomputed", "act.version increments"]
  - method: GET
    path: "/naic/model-acts/{id}/ballots"
    description: "List ballots of an act"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: MemberBallot[]
    side_effects: []
  - method: POST
    path: "/naic/states"
    description: "Register a jurisdiction (accreditation_status starts ACCREDITED)"
    roles: [AssociationStaff]
    code: 201
    input: [code, name]
    output: State
    side_effects: []
  - method: GET
    path: "/naic/states/{id}"
    description: "Read one state (accreditation status, coverage, version)"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: []
    output: State
    side_effects: []
  - method: POST
    path: "/naic/adoptions"
    description: "Record the acting state's adoption of a PUBLISHED act; supersedes that state's prior CERTIFIED_* adoption of the same act; OCC on state version"
    roles: [StateRegulator]
    code: 201
    input: [model_act_id, state_code, adopted_citation, enacted_on, expected_state_version]
    output: StateAdoption
    side_effects: ["prior CERTIFIED_* adoption of same state+act becomes SUPERSEDED", "state.version increments by 1", "core_act_coverage recompute when a supersession occurred"]
  - method: GET
    path: "/naic/model-acts/{id}/adoptions"
    description: "List adoptions of an act"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: StateAdoption[]
    side_effects: []
  - method: POST
    path: "/naic/adoptions/{id}/certify"
    description: "Certify a PENDING_CERTIFICATION adoption into one of three outcome branches"
    roles: [AssociationStaff]
    code: 200
    input: [variation_class]
    output: StateAdoption
    side_effects: ["core_act_coverage recompute for the adopting state"]

  - method: POST
    path: "/naic/reviews"
    description: "Schedule an accreditation review (rotation, overlap and gap validations apply)"
    roles: [AssociationStaff]
    code: 201
    input: [state_id, period_start, period_end, team_lead_id, self_assessment_compliant, self_assessment_total]
    output: AccreditationReview
    side_effects: ["desk_score computed (accreditation_score desk variant)"]
  - method: GET
    path: "/naic/states/{id}/reviews"
    description: "List accreditation reviews of a state"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: AccreditationReview[]
    side_effects: []
  - method: POST
    path: "/naic/reviews/{id}/issue-findings"
    description: "Review team lead issues findings; computes onsite_score and proposed_outcome"
    roles: [ReviewTeamLead]
    code: 200
    input: [findings_compliant, findings_total]
    output: AccreditationReview
    side_effects: ["accreditation_score onsite variant", "proposed_outcome derived"]
  - method: POST
    path: "/naic/reviews/{id}/finalize"
    description: "Finalize into FINAL_PASS or FINAL_FAIL per proposed_outcome; drives the state accreditation cascade"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: AccreditationReview
    side_effects: ["state accreditation_status / consecutive_fail_count transition (see state_machines.State)"]
  - method: POST
    path: "/naic/insurers"
    description: "Register an insurer"
    roles: [AssociationStaff]
    code: 201
    input: [naic_code, name, domicile_state_code]
    output: Insurer
    side_effects: []
  - method: GET
    path: "/naic/insurers/{id}"
    description: "Read one insurer (status, latest RBC posture, version)"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: []
    output: Insurer
    side_effects: []
  - method: POST
    path: "/naic/filings"
    description: "Create a DRAFT financial filing; supersedes any existing non-SUPERSEDED filing of the same (insurer, period_year, period_quarter); OCC on insurer version; pins the ACTIVE valuation standard version"
    roles: [InsurerUser]
    code: 201
    input: [insurer_id, period_year, period_quarter, valuation_standard_code, reported_surplus_cents, asset_risk_cents, underwriting_risk_cents, other_risk_cents, expected_insurer_version]
    output: FinancialFiling
    side_effects: ["prior non-SUPERSEDED filing of same period becomes SUPERSEDED (VALIDATED ones also clear insurer.latest_rbc_ratio/latest_action_level to null)", "insurer.version increments by 1"]
  - method: GET
    path: "/naic/insurers/{id}/filings"
    description: "List filings of an insurer"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?", "period_year?", "status?"]
    output: FinancialFiling[]
    side_effects: []
  - method: GET
    path: "/naic/filings/{id}"
    description: "Read one filing"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: []
    output: FinancialFiling
    side_effects: []
  - method: POST
    path: "/naic/filings/{id}/submit"
    description: "Submit a DRAFT filing"
    roles: [InsurerUser]
    code: 200
    input: []
    output: FinancialFiling
    side_effects: ["filing DRAFT -> SUBMITTED"]
  - method: POST
    path: "/naic/filings/{id}/validate"
    description: "Run validation edits; pass -> VALIDATED plus RBC cascade; fail -> EDITS_FAILED with edit_failures (200 either way)"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: FinancialFiling
    side_effects: ["on pass: rbc_capital_aggregation + rbc_action_level + supervision/escalation cascade (see state_machines.FinancialFiling)"]
  - method: GET
    path: "/naic/filings/{id}/rbc-reports"
    description: "List RBC reports computed from a filing (0 or 1 element)"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: RBCReport[]
    side_effects: []

  - method: POST
    path: "/naic/producers"
    description: "Register a producer"
    roles: [AssociationStaff]
    code: 201
    input: [npn, full_name, home_state_code]
    output: Producer
    side_effects: []
  - method: GET
    path: "/naic/producers/{id}"
    description: "Read one producer (active_license_count)"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: []
    output: Producer
    side_effects: []
  - method: POST
    path: "/naic/licenses"
    description: "Apply for a producer license in a jurisdiction (window overlap validation applies)"
    roles: [ProducerUser]
    code: 201
    input: [producer_id, state_code, license_class, effective_from, valid_until]
    output: ProducerLicense
    side_effects: []
  - method: GET
    path: "/naic/producers/{id}/licenses"
    description: "List licenses of a producer"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: ProducerLicense[]
    side_effects: []
  - method: POST
    path: "/naic/licenses/{id}/issue"
    description: "Issue an APPLIED license; blocked while the licensing state is SUSPENDED"
    roles: [StateRegulator]
    code: 200
    input: []
    output: ProducerLicense
    side_effects: ["producer.active_license_count += 1"]
  - method: POST
    path: "/naic/licenses/{id}/revoke"
    description: "Revoke an ISSUED license"
    roles: [StateRegulator]
    code: 200
    input: []
    output: ProducerLicense
    side_effects: ["producer.active_license_count -= 1"]
  - method: POST
    path: "/naic/market-conduct-calls"
    description: "Open a coordinated market conduct data call; lead state is the acting regulator's state"
    roles: [StateRegulator]
    code: 201
    input: [call_code, topic, total_cost_cents]
    output: MarketConductCall
    side_effects: []
  - method: GET
    path: "/naic/market-conduct-calls/{id}"
    description: "Read one data call"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: []
    output: MarketConductCall
    side_effects: []
  - method: POST
    path: "/naic/market-conduct-calls/{id}/responses"
    description: "File the acting insurer's response to an OPEN call; computes exam_priority_score"
    roles: [InsurerUser]
    code: 201
    input: [direct_premium_cents, complaint_count]
    output: MarketConductResponse
    side_effects: ["exam_priority_score", "escalation_flag set when insurer currently UNDER_SUPERVISION"]
  - method: GET
    path: "/naic/market-conduct-calls/{id}/responses"
    description: "List responses of a call"
    roles: [AssociationStaff, Actuary, StateRegulator, InsurerUser, ProducerUser, ReviewTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: MarketConductResponse[]
    side_effects: []
  - method: POST
    path: "/naic/market-conduct-calls/{id}/close"
    description: "Close an OPEN call; runs cost_share_assessment over its responses"
    roles: [StateRegulator]
    code: 200
    input: []
    output: MarketConductCall
    side_effects: ["cost_share_assessment", "response allocated_cost_cents / cost_share_excluded set"]
  - method: POST
    path: "/naic/valuation-standards"
    description: "Draft a valuation/reserving standard version"
    roles: [Actuary]
    code: 201
    input: [code, version_label, guidance_text]
    output: ValuationStandard
    side_effects: []
  - method: POST
    path: "/naic/valuation-standards/{id}/activate"
    description: "Activate a DRAFT standard (must be a different actuary than the author); retires the prior ACTIVE version of the same code"
    roles: [Actuary]
    code: 200
    input: []
    output: ValuationStandard
    side_effects: ["prior ACTIVE version of same code becomes RETIRED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID, or entity_backed id does not resolve" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership mismatch (wrong state / insurer / producer / review team lead)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, negative amount, non-positive premium, inverted window, or compliant > total" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_insurer_version / expected_state_version does not match the parent's current version (OCC)" }
  - { id: ERR_MODEL_ACT_NOT_FOUND, http: 404, condition: "Model act id (path or body) does not exist" }
  - { id: ERR_EXPOSURE_DRAFT_NOT_FOUND, http: 404, condition: "Exposure draft id does not exist" }
  - { id: ERR_STATE_NOT_FOUND, http: 404, condition: "State id or referenced state_code does not exist" }
  - { id: ERR_ADOPTION_NOT_FOUND, http: 404, condition: "Adoption id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "Review id does not exist" }
  - { id: ERR_INSURER_NOT_FOUND, http: 404, condition: "Insurer id (path or body) does not exist" }
  - { id: ERR_FILING_NOT_FOUND, http: 404, condition: "Filing id does not exist" }
  - { id: ERR_PRODUCER_NOT_FOUND, http: 404, condition: "Producer id (path or body) does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "License id does not exist" }
  - { id: ERR_MARKET_CONDUCT_CALL_NOT_FOUND, http: 404, condition: "Market conduct call id (path or body) does not exist" }
  - { id: ERR_VALUATION_STANDARD_NOT_FOUND, http: 404, condition: "Valuation standard id does not exist" }

  - { id: ERR_ACT_NOT_OPEN_FOR_EXPOSURE, http: 409, condition: "Exposure-draft create while act.status is not DRAFTING or EXPOSURE_OPEN" }
  - { id: ERR_ACT_NOT_BALLOTING, http: 409, condition: "Ballot cast or close-ballot while act.status != BALLOTING" }
  - { id: ERR_ACT_NOT_ADOPTED, http: 409, condition: "Publish while act.status != ADOPTED" }
  - { id: ERR_ACT_NOT_PUBLISHED, http: 422, condition: "Adoption create for an act whose status != PUBLISHED" }
  - { id: ERR_EXPOSURE_DRAFT_NOT_OPEN, http: 409, condition: "Draft close while draft.status != OPEN" }
  - { id: ERR_COMMENT_WINDOW_OPEN, http: 409, condition: "Draft close before the logical clock reaches comment_window_end" }
  - { id: ERR_ADOPTION_NOT_PENDING, http: 409, condition: "Certify while adoption.status != PENDING_CERTIFICATION" }
  - { id: ERR_REVIEW_NOT_SCHEDULED, http: 409, condition: "Issue-findings while review.status != SCHEDULED" }
  - { id: ERR_REVIEW_NOT_FINDINGS_ISSUED, http: 409, condition: "Finalize while review.status != FINDINGS_ISSUED" }
  - { id: ERR_FILING_NOT_DRAFT, http: 409, condition: "Submit while filing.status != DRAFT" }
  - { id: ERR_FILING_NOT_SUBMITTED, http: 409, condition: "Validate while filing.status != SUBMITTED" }
  - { id: ERR_LICENSE_NOT_APPLIED, http: 409, condition: "Issue while license.status != APPLIED" }
  - { id: ERR_LICENSE_NOT_ISSUED, http: 409, condition: "Revoke while license.status != ISSUED" }
  - { id: ERR_CALL_NOT_OPEN, http: 409, condition: "Respond or close while call.status != OPEN" }
  - { id: ERR_STANDARD_NOT_DRAFT, http: 409, condition: "Activate while standard.status != DRAFT" }
  - { id: ERR_REVIEWER_ROTATION_REQUIRED, http: 422, condition: "Review create: team_lead_id equals the lead of the same state's most recent FINAL_PASS/FINAL_FAIL review" }
  - { id: ERR_SELF_ACTIVATION_FORBIDDEN, http: 422, condition: "Activate: X-User-ID equals standard.author_user_id" }
  - { id: ERR_DUPLICATE_MODEL_ACT, http: 409, condition: "ModelAct (model_code, version_label) already exists" }
  - { id: ERR_DUPLICATE_NAIC_CODE, http: 409, condition: "Insurer naic_code already exists" }
  - { id: ERR_DUPLICATE_NPN, http: 409, condition: "Producer npn already exists" }
  - { id: ERR_DUPLICATE_STANDARD_VERSION, http: 409, condition: "ValuationStandard (code, version_label) already exists" }
  - { id: ERR_DUPLICATE_CALL_CODE, http: 409, condition: "MarketConductCall call_code already exists" }
  - { id: ERR_DUPLICATE_BALLOT, http: 409, condition: "Same state already holds a CAST ballot on this act" }
  - { id: ERR_DUPLICATE_ADOPTION, http: 409, condition: "Same state already holds a PENDING_CERTIFICATION adoption for this act" }
  - { id: ERR_DUPLICATE_RESPONSE, http: 409, condition: "Same insurer already responded to this call" }
  - { id: ERR_COMMENT_WINDOW_TOO_SHORT, http: 422, condition: "Exposure window shorter than 30 days" }
  - { id: ERR_VOTING_STATE_SUSPENDED, http: 422, condition: "Ballot cast by a SUSPENDED state" }
  - { id: ERR_STATE_SUSPENDED, http: 422, condition: "License issue while the licensing state is SUSPENDED" }
  - { id: ERR_EXPOSURE_WINDOW_OVERLAP, http: 409, condition: "Half-open exposure window intersects another draft window of the same act" }
  - { id: ERR_REVIEW_WINDOW_OVERLAP, http: 409, condition: "Closed review period intersects another review period of the same state" }
  - { id: ERR_REVIEW_GAP_TOO_SHORT, http: 422, condition: "Fewer than 180 days between the new period_start and the most recent prior period_end for the state" }
  - { id: ERR_LICENSE_WINDOW_OVERLAP, http: 409, condition: "Closed license window intersects another APPLIED/ISSUED license of the same producer, state and class" }
  - { id: ERR_VALUATION_STANDARD_NOT_ACTIVE, http: 422, condition: "Filing create: no ACTIVE standard for the code; validate: pinned version no longer ACTIVE" }
  - { id: ERR_CALL_COST_BELOW_MINIMUM, http: 422, condition: "total_cost_cents < 100000" }
  - { id: ERR_CALL_NO_RESPONSES, http: 422, condition: "Close attempted on a call with zero responses" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssociationStaff
    description: "Association staff: administers model acts, exposure drafts, ballots, certifications, review scheduling/finalization, filing validation, registries, logical clock"
    identity: opaque
    exclusive_operations: ["model-act create/close-ballot/publish", "exposure-draft create/close", "adoption certify", "review create/finalize", "filing validate", "state/insurer/producer registration", "logical clock"]
    shared_operations: ["all reads"]
  - name: Actuary
    description: "Actuarial standards maintainer; author and activator of a standard must be different people (segregation of duties)"
    identity: opaque
    exclusive_operations: ["valuation-standard create", "valuation-standard activate"]
    shared_operations: ["all reads"]
  - name: StateRegulator
    description: "Insurance department of a state; X-User-ID is the State.id the regulator acts for"
    identity: "entity_backed:State"
    exclusive_operations: ["ballot cast (own state)", "adoption create (own state)", "license issue/revoke (own state)", "market-conduct-call create/close (lead = own state)"]
    shared_operations: ["all reads"]
  - name: InsurerUser
    description: "Insurer filer; X-User-ID is the Insurer.id"
    identity: "entity_backed:Insurer"
    exclusive_operations: ["filing create/submit (own insurer)", "market-conduct response create (own insurer)"]
    shared_operations: ["all reads"]
  - name: ProducerUser
    description: "Producer applicant; X-User-ID is the Producer.id"
    identity: "entity_backed:Producer"
    exclusive_operations: ["license apply (own producer)"]
    shared_operations: ["all reads"]
  - name: ReviewTeamLead
    description: "Accreditation review team lead; X-User-ID is the opaque operator id stored as review.team_lead_id"
    identity: opaque
    exclusive_operations: ["review issue-findings (own assigned review)"]
    shared_operations: ["all reads"]












