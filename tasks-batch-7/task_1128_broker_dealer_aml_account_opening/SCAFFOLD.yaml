# =============================================================================
# Task 1128: Broker-Dealer AML & Account Opening — seed tables (§1.0–§1.7)
# Difficulty target: beyond Expert (18 entities, 14 state machines, 10
# calculations, 21 validation rows, 56 endpoints, 66 error codes, 7 roles).
# =============================================================================

scenario: |
  1128. Broker-Dealer AML & Account Opening (broker-dealer AML unit): customer identification program & documentation, beneficial ownership certification for legal entities, risk rating & enhanced due diligence for high-risk accounts, transaction monitoring for securities-specific typologies (low-priced securities), deposit of physical certificates review, SAR filing & continuing review, 314(a) list scanning & response, independent testing & audit

domain_name: broker-dealer-aml
api_prefix: /aml

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on BrokerageAccount.version and PhysicalCertificateDeposit.version
    - cascading_side_effects        # 314(a) confirm cascade (depth 4); suspicious-cert cascade (depth 3)
    - dual_variant_calculation      # INITIAL vs ONGOING risk; INITIAL vs CONTINUING SAR deadlines
    - ops_run_checkpoint            # daily sweep advances document expiry, EDD refresh, SAR review, 314(a) overdue, cert holds, finding aging
  entity_topology: flat             # peer entities joined by FK references; flat /aml/<collection> URLs
  state_machine_shape: cyclic       # plus a parallel posture dimension on BrokerageAccount (posture-driven gating)
  relationship_patterns:
    - one_to_many                   # Customer -> accounts/documents/certifications; account -> txns/reviews/alerts/cases/deposits
    - self_referential              # SARFiling.prior_filing_id (continuing SARs); EDDReview.prior_review_id
    - cross_aggregate               # Match314A -> account; alert -> rule + transaction; case -> origin alert
  role_model: segregation_of_duties # rep opens, analyst investigates, officer approves, SAROfficer files, auditor verifies; identity-level SoD on SAR filing and finding remediation
  consistency_model: immediate      # every mutation + cascaded side effect is atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (18 entities; flat topology, FK-linked)
# =============================================================================
entities:
  - name: RegisteredRep
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Rep full legal name" }
      - { name: crd_number, type: string, source: input, description: "CRD registration number; unique across reps (ERR_DUPLICATE_CRD_NUMBER)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; suspended reps cannot create customers or accounts (ERR_REP_SUSPENDED)", constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: registered_rep_id, type: string, source: system, description: "FK -> RegisteredRep.id; set from X-User-ID at creation" }
      - { name: customer_type, type: enum, source: input, description: "INDIVIDUAL | LEGAL_ENTITY", constraints: "enum {INDIVIDUAL, LEGAL_ENTITY}" }
      - { name: full_name, type: string, source: input, description: "Legal name of person or entity" }
      - { name: tax_id, type: string, source: input, description: "Tax identification number (SSN/EIN)" }
      - { name: country_risk_tier, type: enum, source: input, description: "LOW | MEDIUM | HIGH | PROHIBITED — drives risk scoring", constraints: "enum {LOW, MEDIUM, HIGH, PROHIBITED}" }
      - { name: is_pep, type: boolean, source: input, default: false, description: "Politically exposed person flag" }
      - { name: date_of_birth, type: string, source: input, required: false, description: "YYYY-MM-DD; required for INDIVIDUAL CIP matching" }

  - name: BrokerageAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: product_set, type: array, source: input, description: "Subset of {CASH, LOW_PRICED_SECURITIES, MARGIN, OPTIONS, CORRESPONDENT}; drives product_points" }
      - { name: lifecycle_status, type: enum, source: system, default: PENDING_APPROVAL, description: "PENDING_APPROVAL | OPEN | RESTRICTED | CLOSED | DECLINED", constraints: "enum {PENDING_APPROVAL, OPEN, RESTRICTED, CLOSED, DECLINED}" }
      - { name: aml_posture, type: enum, source: computed, default: STANDARD, description: "STANDARD | ELEVATED | SEVERE — derived dimension gating transactions; see state_machines BrokerageAccount.aml_posture", constraints: "enum {STANDARD, ELEVATED, SEVERE}" }
      - { name: risk_score, type: number, source: computed, description: "0-100, see calculations.account_risk_score" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | PROHIBITED", constraints: "enum {LOW, MEDIUM, HIGH, PROHIBITED}" }
      - { name: risk_variant_used, type: enum, source: system, description: "INITIAL | ONGOING — which variant produced current risk_score", constraints: "enum {INITIAL, ONGOING}" }
      - { name: exposure_30d_amount, type: number, source: computed, description: "Sum of amount over transactions (status != REVERSED) with created_at date in trailing 30 calendar days inclusive" }
      - { name: exposure_tier, type: enum, source: computed, description: "T1 < 100000 | T2 in [100000, 500000) | T3 >= 500000", constraints: "enum {T1, T2, T3}" }
      - { name: wire_velocity_30d_amount, type: number, source: computed, description: "Sum of amount over WIRE_OUT transactions (status != REVERSED) in trailing 30 calendar days inclusive" }
      - { name: open_alert_count, type: integer, source: computed, description: "Count of MonitoringAlert for this account with status IN {NEW, UNDER_REVIEW}" }
      - { name: open_case_count, type: integer, source: computed, description: "Count of AMLCase for this account with status IN {OPEN, INVESTIGATING, SAR_RECOMMENDED, REOPENED}" }
      - { name: has_suspicion_flag, type: boolean, source: system, default: false, description: "Set by REJECT_SUSPICIOUS cert decision; never auto-cleared; keeps aml_posture >= ELEVATED" }
      - { name: decline_reason, type: string, source: system, required: false, description: "Recorded on DECLINED transition" }

  - name: IdentificationDocument
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: doc_type, type: enum, source: input, description: "GOVERNMENT_ID | FORMATION_DOC | PROOF_OF_ADDRESS | W9", constraints: "enum {GOVERNMENT_ID, FORMATION_DOC, PROOF_OF_ADDRESS, W9}" }
      - { name: document_number, type: string, source: input, description: "Document serial/number" }
      - { name: expiry_date, type: string, source: input, description: "YYYY-MM-DD; sweep flips VERIFIED -> EXPIRED when expiry_date < clock date" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | VERIFIED | REJECTED | EXPIRED | SUPERSEDED", constraints: "enum {SUBMITTED, VERIFIED, REJECTED, EXPIRED, SUPERSEDED}" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Recorded on reject" }

  - name: BeneficialOwnershipCertification
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; customer must be LEGAL_ENTITY (ERR_CERTIFICATION_REQUIRES_LEGAL_ENTITY)" }
      - { name: no_25pct_owner_attested, type: boolean, source: input, default: false, description: "Attestation that no natural person owns >= 25.00%" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CERTIFIED | SUPERSEDED", constraints: "enum {DRAFT, CERTIFIED, SUPERSEDED}" }
      - { name: certified_at, type: datetime, source: system, required: false, description: "Set on certify" }
      - { name: total_ownership_pct, type: number, source: computed, description: "Sum of BeneficialOwner.ownership_pct; must be <= 100.0" }
      - { name: covered_owner_count, type: integer, source: computed, description: "Count of owners with ownership_pct >= 25.00 having full KYC (tax_id, date_of_birth, address all present)" }

  - name: BeneficialOwner
    parent: null
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: system, description: "FK -> BeneficialOwnershipCertification.id" }
      - { name: full_name, type: string, source: input, description: "Owner legal name" }
      - { name: ownership_pct, type: number, source: input, description: "0 < pct <= 100, two decimals" }
      - { name: is_control_person, type: boolean, source: input, default: false, description: "At least one control person required per certification" }
      - { name: is_entity_owner, type: boolean, source: input, default: false, description: "True when owner is itself a legal entity (layered ownership -> opacity points)" }
      - { name: tax_id, type: string, source: input, required: false, description: "Required when ownership_pct >= 25.00" }
      - { name: date_of_birth, type: string, source: input, required: false, description: "Required when ownership_pct >= 25.00" }
      - { name: address, type: string, source: input, required: false, description: "Required when ownership_pct >= 25.00" }

  - name: EDDReview
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> BrokerageAccount.id" }
      - { name: period_start, type: string, source: input, description: "YYYY-MM-DD; half-open review period start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "YYYY-MM-DD; half-open review period end (exclusive); must be > period_start" }
      - { name: trigger_reason, type: string, source: input, description: "Why the review was opened" }
      - { name: prior_review_id, type: string, source: input, required: false, description: "FK -> EDDReview.id; links a refresh review to the review it refreshes" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | IN_REVIEW | APPROVED | REJECTED | REFRESH_DUE", constraints: "enum {PENDING, IN_REVIEW, APPROVED, REJECTED, REFRESH_DUE}" }
      - { name: refresh_due_date, type: string, source: computed, required: false, description: "completed date + tier interval (HIGH 12mo, MEDIUM 24mo, LOW 36mo); tier captured at completion" }
      - { name: tier_at_completion, type: enum, source: system, required: false, description: "Account risk_tier captured when review completed; fixes refresh interval", constraints: "enum {LOW, MEDIUM, HIGH}" }
      - { name: decision_notes, type: string, source: system, required: false, description: "Recorded on complete" }

  - name: SecurityTransaction
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> BrokerageAccount.id" }
      - { name: txn_type, type: enum, source: input, description: "DEPOSIT_CERT | DEPOSIT_DTC | BUY | SELL | WIRE_OUT | JOURNAL", constraints: "enum {DEPOSIT_CERT, DEPOSIT_DTC, BUY, SELL, WIRE_OUT, JOURNAL}" }
      - { name: security_id, type: string, source: input, required: false, description: "CUSIP/symbol for security types" }
      - { name: quantity, type: number, source: input, required: false, description: "Required for DEPOSIT_DTC/BUY/SELL" }
      - { name: unit_price, type: number, source: input, required: false, description: "Required for DEPOSIT_DTC/BUY/SELL" }
      - { name: amount, type: number, source: input, required: false, description: "Input for WIRE_OUT/JOURNAL only; for security types the field is COMPUTED as round_half_up(quantity * unit_price, 2) and any client-sent value is ignored" }
      - { name: is_low_priced, type: boolean, source: computed, description: "true iff security type AND unit_price < 5.00 (exactly 5.00 is NOT low-priced); false for WIRE_OUT/JOURNAL" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | FLAGGED | CLEARED | ESCALATED | REVERSED", constraints: "enum {POSTED, FLAGGED, CLEARED, ESCALATED, REVERSED}" }
      - { name: reversal_reason, type: string, source: system, required: false, description: "Recorded on reverse" }

  - name: MonitoringRule
    parent: null
    common_fields: true
    fields:
      - { name: rule_code, type: enum, source: input, description: "LPS_LIQUIDATION | LPS_DEPOSIT_LIQUIDATE | WIRE_VELOCITY | STRUCTURING", constraints: "enum {LPS_LIQUIDATION, LPS_DEPOSIT_LIQUIDATE, WIRE_VELOCITY, STRUCTURING}" }
      - { name: threshold_amount, type: number, source: input, description: "Aggregate trigger threshold; alert fires when aggregate >= threshold_amount" }
      - { name: window_days, type: integer, source: input, description: "Trailing calendar-day window, both ends inclusive" }
      - { name: min_transaction_count, type: integer, source: input, default: 1, description: "Minimum matching transaction count (STRUCTURING uses 3)" }
      - { name: enabled, type: boolean, source: input, default: true, description: "Disabled rules are skipped by scans (ERR_RULE_DISABLED on direct use)" }

  - name: MonitoringAlert
    parent: null
    common_fields: true
    fields:
      - { name: rule_id, type: string, source: system, description: "FK -> MonitoringRule.id" }
      - { name: rule_code, type: string, source: system, description: "Denormalized rule code (or FINCEN_314A_MATCH / CERT_SUSPICION for cascade-created alerts)" }
      - { name: account_id, type: string, source: system, description: "FK -> BrokerageAccount.id" }
      - { name: transaction_id, type: string, source: system, required: false, description: "FK -> SecurityTransaction.id; triggering transaction with greatest created_at, tie-break greatest amount, then smallest quantity" }
      - { name: window_start, type: string, source: system, description: "YYYY-MM-DD inclusive window start used by the scan" }
      - { name: window_end, type: string, source: system, description: "YYYY-MM-DD inclusive window end (clock date at scan); dedup key component" }
      - { name: aggregate_amount, type: number, source: computed, description: "Sum of per-transaction amounts, each rounded round_half_up to 2dp BEFORE summation (pinned rounding order)" }
      - { name: severity, type: integer, source: computed, description: "round_half_up(100 * min(aggregate/threshold, 2.0) * risk_multiplier, 0); see calculations.alert_severity_score" }
      - { name: status, type: enum, source: system, default: NEW, description: "NEW | UNDER_REVIEW | ESCALATED_TO_CASE | CLOSED_NO_ACTION", constraints: "enum {NEW, UNDER_REVIEW, ESCALATED_TO_CASE, CLOSED_NO_ACTION}" }
      - { name: close_rationale, type: string, source: system, required: false, description: "Recorded on close-no-action" }

  - name: AMLCase
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> BrokerageAccount.id" }
      - { name: origin_alert_id, type: string, source: system, required: false, description: "FK -> MonitoringAlert.id when created by escalation; null for manual cases" }
      - { name: priority, type: enum, source: computed, description: "CRITICAL if origin alert severity >= 150; HIGH >= 100; MEDIUM >= 50; else LOW. Manual cases default MEDIUM. Computed from alert severity AS OF escalation, BEFORE the escalation-triggered risk recalc", constraints: "enum {LOW, MEDIUM, HIGH, CRITICAL}" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | INVESTIGATING | SAR_RECOMMENDED | DECIDED_FILED | DECIDED_NO_FILE | CLOSED | REOPENED", constraints: "enum {OPEN, INVESTIGATING, SAR_RECOMMENDED, DECIDED_FILED, DECIDED_NO_FILE, CLOSED, REOPENED}" }
      - { name: recommending_analyst_id, type: string, source: system, required: false, description: "X-User-ID of the AMLAnalyst who recommended SAR; SAR filer MUST differ (ERR_SOD_VIOLATION)" }
      - { name: initial_detection_date, type: string, source: system, required: false, description: "YYYY-MM-DD captured on recommend-sar; drives initial SAR filing_deadline" }
      - { name: reopen_reason, type: string, source: system, required: false, description: "Recorded on reopen" }

  - name: SARFiling
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> AMLCase.id" }
      - { name: prior_filing_id, type: string, source: input, required: false, description: "FK -> SARFiling.id; set for continuing-activity filings; must reference a FILED filing of the SAME case (ERR_PRIOR_FILING_CASE_MISMATCH)" }
      - { name: narrative, type: string, source: input, description: "SAR narrative" }
      - { name: activity_start, type: string, source: input, description: "YYYY-MM-DD suspicious activity window start" }
      - { name: activity_end, type: string, source: input, description: "YYYY-MM-DD; must be >= activity_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FILED | SUPERSEDED", constraints: "enum {DRAFT, FILED, SUPERSEDED}" }
      - { name: filing_deadline, type: string, source: computed, description: "Initial: case.initial_detection_date + 30 calendar days. Continuing: prior_filing.filed_at date + 120 calendar days" }
      - { name: filed_at, type: datetime, source: system, required: false, description: "Set on file transition" }
      - { name: filed_late, type: boolean, source: computed, description: "true iff filed date > filing_deadline" }
      - { name: continuing_review_due_date, type: string, source: computed, required: false, description: "filed_at date + 90 calendar days" }
      - { name: continuing_review_count, type: integer, source: system, default: 0, description: "Increments on each continuing review" }
      - { name: last_continuing_review_at, type: datetime, source: system, required: false, description: "Set by continuing-reviews endpoint" }
      - { name: review_overdue, type: boolean, source: system, default: false, description: "Set true by sweep when continuing_review_due_date < clock date and filing still FILED (not SUPERSEDED)" }

  - name: FinCENRequest314A
    parent: null
    common_fields: true
    fields:
      - { name: request_reference, type: string, source: input, description: "FinCEN list reference; unique (ERR_DUPLICATE_314A_REQUEST)" }
      - { name: subjects, type: array, source: input, description: "Array of {name, tax_id?, date_of_birth?, subject_type: INDIVIDUAL|ENTITY}" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: response_deadline, type: string, source: computed, description: "received date + 14 calendar days" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | SCAN_COMPLETE | RESPONSE_SUBMITTED | OVERDUE", constraints: "enum {RECEIVED, SCAN_COMPLETE, RESPONSE_SUBMITTED, OVERDUE}" }
      - { name: match_count, type: integer, source: computed, description: "Count of Match314A generated by scan" }
      - { name: responded_at, type: datetime, source: system, required: false, description: "Set on submit-response" }
      - { name: responded_late, type: boolean, source: computed, description: "true iff responded date > response_deadline" }

  - name: Match314A
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> FinCENRequest314A.id" }
      - { name: account_id, type: string, source: system, description: "FK -> BrokerageAccount.id" }
      - { name: matched_subject_name, type: string, source: system, description: "Subject name that matched" }
      - { name: match_basis, type: enum, source: system, description: "TAX_ID_EXACT | NAME_DOB | NAME_EXACT; strongest basis wins per (subject, account)", constraints: "enum {TAX_ID_EXACT, NAME_DOB, NAME_EXACT}" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | CONFIRMED | FALSE_POSITIVE | RESOLVED", constraints: "enum {PENDING_REVIEW, CONFIRMED, FALSE_POSITIVE, RESOLVED}" }
      - { name: reviewed_by, type: string, source: system, required: false, description: "X-User-ID of deciding ComplianceOfficer" }

  - name: PhysicalCertificateDeposit
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> BrokerageAccount.id" }
      - { name: transaction_id, type: string, source: system, description: "FK -> SecurityTransaction.id; the DEPOSIT_CERT transaction created at intake (status FLAGGED)" }
      - { name: certificate_number, type: string, source: input, description: "Physical certificate serial; unique among deposits with status NOT IN {REJECTED, REJECTED_SUSPICIOUS} (ERR_DUPLICATE_CERTIFICATE_NUMBER)" }
      - { name: cusip, type: string, source: input, description: "Security identifier" }
      - { name: security_name, type: string, source: input, description: "Issuer/security name" }
      - { name: quantity, type: integer, source: input, description: "Shares on certificate (positive integer)" }
      - { name: unit_price, type: number, source: input, description: "Estimated unit price at intake" }
      - { name: has_restrictive_legend, type: boolean, source: input, default: false, description: "Rule 144-style restrictive legend; adds 5 calendar days to hold" }
      - { name: is_low_priced, type: boolean, source: computed, description: "true iff unit_price < 5.00" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | ELIGIBILITY_REVIEW | AUTHENTICITY_REVIEW | CLEARANCE_HOLD | READY_TO_ACCEPT | ACCEPTED | REJECTED | REJECTED_SUSPICIOUS | RESUBMITTED", constraints: "enum {RECEIVED, ELIGIBILITY_REVIEW, AUTHENTICITY_REVIEW, CLEARANCE_HOLD, READY_TO_ACCEPT, ACCEPTED, REJECTED, REJECTED_SUSPICIOUS, RESUBMITTED}" }
      - { name: hold_release_date, type: string, source: computed, required: false, description: "CLEARANCE_HOLD entry date + hold days (10 low-priced, else 5; +5 if has_restrictive_legend)" }
      - { name: decision_reason, type: string, source: system, required: false, description: "Recorded on decision" }

  - name: LostStolenCertificateEntry
    parent: null
    common_fields: true
    fields:
      - { name: certificate_number, type: string, source: input, description: "Reported lost/stolen certificate serial; unique (ERR_DUPLICATE_CERTIFICATE_NUMBER)" }
      - { name: cusip, type: string, source: input, description: "Security identifier" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED", constraints: "enum {ACTIVE, CANCELLED}" }

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - { name: scope_unit, type: enum, source: input, description: "AML_PROGRAM | CIP_PROCESS | SANCTIONS_SCREENING | TRANSACTION_MONITORING", constraints: "enum {AML_PROGRAM, CIP_PROCESS, SANCTIONS_SCREENING, TRANSACTION_MONITORING}" }
      - { name: start_date, type: string, source: input, description: "YYYY-MM-DD; CLOSED interval start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "YYYY-MM-DD; CLOSED interval end (inclusive); must be >= start_date" }
      - { name: lead_auditor_id, type: string, source: system, description: "X-User-ID of creating IndependentAuditor" }
      - { name: report_summary, type: string, source: system, required: false, description: "Set on issue-report" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | FIELDWORK | REPORTED | CLOSED", constraints: "enum {PLANNED, FIELDWORK, REPORTED, CLOSED}" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | HIGH | MEDIUM | LOW; sweep escalates one level on overdue crossing (CRITICAL stays)", constraints: "enum {CRITICAL, HIGH, MEDIUM, LOW}" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: remediation_deadline, type: string, source: computed, description: "created date + severity days (CRITICAL 30, HIGH 60, MEDIUM 90, LOW 180); fixed at issuance" }
      - { name: is_overdue, type: boolean, source: system, default: false, description: "Set true by sweep when remediation_deadline < clock date and status IN {OPEN, REMEDIATION_SUBMITTED}" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | REMEDIATION_SUBMITTED | REMEDIATED | ACCEPTED_RISK", constraints: "enum {OPEN, REMEDIATION_SUBMITTED, REMEDIATED, ACCEPTED_RISK}" }
      - { name: remediation_note, type: string, source: system, required: false, description: "Set on submit-remediation" }
      - { name: submitted_by, type: string, source: system, required: false, description: "X-User-ID of remediating ComplianceOfficer" }
      - { name: verified_by, type: string, source: system, required: false, description: "X-User-ID of verifying IndependentAuditor; MUST differ from submitted_by (ERR_SOD_VIOLATION)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RegisteredRep
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /aml/reps/{id}/suspend"
        actor: SystemAdmin
        preconditions: ["Rep must be ACTIVE (ERR_INVALID_LIFECYCLE_TRANSITION)"]
        side_effects: ["increments RegisteredRep.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /aml/reps/{id}/reinstate"
        actor: SystemAdmin
        preconditions: ["Rep must be SUSPENDED (ERR_INVALID_LIFECYCLE_TRANSITION)"]
        side_effects: ["increments RegisteredRep.version by 1"]

  - entity: BrokerageAccount
    initial_state: PENDING_APPROVAL
    terminal_states: [CLOSED, DECLINED]
    transitions:
      - from: PENDING_APPROVAL
        to: OPEN
        trigger: "POST /aml/accounts/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "CIP complete: at least one VERIFIED IdentificationDocument of doc_type GOVERNMENT_ID for INDIVIDUAL customers; FORMATION_DOC + PROOF_OF_ADDRESS for LEGAL_ENTITY customers (ERR_CIP_INCOMPLETE)"
          - "LEGAL_ENTITY customers: exists BeneficialOwnershipCertification with status CERTIFIED (ERR_BENEFICIAL_OWNERSHIP_REQUIRED)"
          - "risk_tier != PROHIBITED (ERR_PROHIBITED_TIER)"
          - "risk_tier == HIGH: exists EDDReview with status APPROVED for this account (ERR_EDD_APPROVAL_REQUIRED)"
        side_effects:
          - "aml_posture recomputed (STANDARD absent elevation triggers)"
          - "risk_variant_used = INITIAL (score computed at creation)"
          - "increments BrokerageAccount.version by 1"
      - from: PENDING_APPROVAL
        to: DECLINED
        trigger: "POST /aml/accounts/{id}/decline"
        actor: ComplianceOfficer
        preconditions: ["Account in PENDING_APPROVAL (ERR_INVALID_LIFECYCLE_TRANSITION)"]
        side_effects: ["decline_reason recorded", "increments BrokerageAccount.version by 1"]
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /aml/accounts/{id}/restrict OR system cascade (Match314A CONFIRMED, EDDReview REJECTED)"
        actor: ComplianceOfficer | system
        preconditions: ["Account in OPEN (ERR_INVALID_LIFECYCLE_TRANSITION)"]
        side_effects:
          - "All SecurityTransaction for this account with status POSTED become FLAGGED"
          - "For each newly FLAGGED transaction without an alert in {NEW, UNDER_REVIEW, ESCALATED_TO_CASE}: MonitoringAlert created (status NEW, rule_code per cause)"
          - "Account risk recalculated with ONGOING variant (reads the alert set produced by the previous hop)"
          - "increments BrokerageAccount.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /aml/accounts/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "Account in RESTRICTED (ERR_INVALID_LIFECYCLE_TRANSITION)"
          - "No Match314A for this account with status CONFIRMED (ERR_MATCH_314A_UNRESOLVED)"
          - "No AMLCase for this account with priority CRITICAL and status IN {OPEN, INVESTIGATING, SAR_RECOMMENDED, REOPENED} (ERR_CRITICAL_CASE_OPEN)"
        side_effects: ["increments BrokerageAccount.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /aml/accounts/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Account in OPEN or RESTRICTED (ERR_INVALID_LIFECYCLE_TRANSITION)"
          - "No AMLCase with status IN {OPEN, INVESTIGATING, SAR_RECOMMENDED, REOPENED, DECIDED_FILED, DECIDED_NO_FILE} (ERR_ACCOUNT_CLOSE_BLOCKED)"
          - "No Match314A with status IN {PENDING_REVIEW, CONFIRMED} (ERR_ACCOUNT_CLOSE_BLOCKED)"
          - "No PhysicalCertificateDeposit with status NOT IN {ACCEPTED, REJECTED, REJECTED_SUSPICIOUS} (ERR_ACCOUNT_CLOSE_BLOCKED)"
          - "No SecurityTransaction with status IN {FLAGGED, ESCALATED} (ERR_ACCOUNT_CLOSE_BLOCKED)"
        side_effects: ["increments BrokerageAccount.version by 1"]
      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /aml/accounts/{id}/close"
        actor: ComplianceOfficer
        preconditions: ["Same as OPEN -> CLOSED"]
        side_effects: ["increments BrokerageAccount.version by 1"]

  - entity: BrokerageAccount.aml_posture
    initial_state: STANDARD
    terminal_states: []
    note: "Derived dimension, parallel to lifecycle_status. System-managed only; recomputed after every posture trigger and stored on the account row. SEVERE gates ALL transaction posting (ERR_POSTURE_SEVERE_BLOCKS); ELEVATED auto-flags newly posted transactions."
    transitions:
      - from: STANDARD
        to: ELEVATED
        trigger: "system recompute: any of {VERIFIED->EXPIRED IdentificationDocument on customer, EDDReview REFRESH_DUE, has_suspicion_flag == true, risk_score >= 70}"
        actor: system
        preconditions: []
        side_effects: ["increments BrokerageAccount.version by 1"]
      - from: ELEVATED
        to: SEVERE
        trigger: "system recompute: exists Match314A status CONFIRMED for account OR exists AMLCase with priority CRITICAL and status IN {OPEN, INVESTIGATING, SAR_RECOMMENDED, REOPENED}"
        actor: system
        preconditions: []
        side_effects: ["increments BrokerageAccount.version by 1"]
      - from: STANDARD
        to: SEVERE
        trigger: "system recompute: exists Match314A status CONFIRMED for account OR exists AMLCase with priority CRITICAL and status IN {OPEN, INVESTIGATING, SAR_RECOMMENDED, REOPENED}"
        actor: system
        preconditions: []
        side_effects: ["increments BrokerageAccount.version by 1"]
      - from: SEVERE
        to: ELEVATED
        trigger: "system recompute after all CONFIRMED matches RESOLVED and CRITICAL cases decided/closed, while an elevation trigger remains"
        actor: system
        preconditions: []
        side_effects: ["increments BrokerageAccount.version by 1"]
      - from: SEVERE
        to: STANDARD
        trigger: "system recompute after all CONFIRMED matches RESOLVED and CRITICAL cases decided/closed, no elevation trigger remains"
        actor: system
        preconditions: []
        side_effects: ["increments BrokerageAccount.version by 1"]
      - from: ELEVATED
        to: STANDARD
        trigger: "system recompute after expired document SUPERSEDED by newly VERIFIED replacement AND no other elevation trigger"
        actor: system
        preconditions: []
        side_effects: ["increments BrokerageAccount.version by 1"]

  - entity: IdentificationDocument
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /aml/identification-documents/{id}/verify"
        actor: AMLAnalyst
        preconditions: ["Document in SUBMITTED (ERR_DOCUMENT_NOT_VERIFIABLE)"]
        side_effects:
          - "Any other document of same customer_id + doc_type with status IN {VERIFIED, EXPIRED} becomes SUPERSEDED"
          - "aml_posture recomputed for every account of the customer (expiry elevation may clear)"
          - "increments IdentificationDocument.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /aml/identification-documents/{id}/reject"
        actor: AMLAnalyst
        preconditions: ["Document in SUBMITTED (ERR_DOCUMENT_NOT_REJECTABLE)"]
        side_effects: ["rejection_reason recorded", "increments IdentificationDocument.version by 1"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (daily sweep: expiry_date < clock date)"
        actor: system
        preconditions: []
        side_effects:
          - "aml_posture recomputed for every account of the customer (ELEVATED while any EXPIRED document is not yet SUPERSEDED)"
          - "increments IdentificationDocument.version by 1"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system (newer document of same customer_id + doc_type VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["increments IdentificationDocument.version by 1"]
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system (newer document of same customer_id + doc_type VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["aml_posture recomputed for every account of the customer", "increments IdentificationDocument.version by 1"]

  - entity: BeneficialOwnershipCertification
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /aml/beneficial-ownership-certifications/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "Certification in DRAFT (ERR_CERTIFICATION_NOT_DRAFT)"
          - "total_ownership_pct <= 100.0 (ERR_EXCESSIVE_OWNERSHIP_TOTAL)"
          - "At least one BeneficialOwner with is_control_person == true (ERR_CONTROL_PERSON_REQUIRED)"
          - "Every owner with ownership_pct >= 25.00 has tax_id AND date_of_birth AND address present (ERR_OWNER_KYC_REQUIRED)"
          - "At least one owner with ownership_pct >= 25.00 OR no_25pct_owner_attested == true (ERR_OWNER_KYC_REQUIRED)"
        side_effects:
          - "certified_at stamped; total_ownership_pct and covered_owner_count computed"
          - "Any other CERTIFIED certification for same customer becomes SUPERSEDED"
          - "increments BeneficialOwnershipCertification.version by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system (newer certification for same customer CERTIFIED)"
        actor: system
        preconditions: []
        side_effects: ["increments BeneficialOwnershipCertification.version by 1"]

  - entity: EDDReview
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /aml/edd-reviews/{id}/begin"
        actor: AMLAnalyst
        preconditions: ["Review in PENDING or REFRESH_DUE (ERR_EDD_REVIEW_NOT_ACTIONABLE)"]
        side_effects: ["increments EDDReview.version by 1"]
      - from: REFRESH_DUE
        to: IN_REVIEW
        trigger: "POST /aml/edd-reviews/{id}/begin"
        actor: AMLAnalyst
        preconditions: ["Review in PENDING or REFRESH_DUE (ERR_EDD_REVIEW_NOT_ACTIONABLE)"]
        side_effects: ["increments EDDReview.version by 1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /aml/edd-reviews/{id}/complete with decision=APPROVED"
        actor: ComplianceOfficer
        preconditions: ["Review in IN_REVIEW (ERR_EDD_REVIEW_NOT_ACTIONABLE)"]
        side_effects:
          - "tier_at_completion = account.risk_tier; refresh_due_date = completion date + interval (HIGH 12mo, MEDIUM 24mo, LOW 36mo)"
          - "account aml_posture recomputed"
          - "increments EDDReview.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /aml/edd-reviews/{id}/complete with decision=REJECTED"
        actor: ComplianceOfficer
        preconditions: ["Review in IN_REVIEW (ERR_EDD_REVIEW_NOT_ACTIONABLE)"]
        side_effects:
          - "If account.lifecycle_status == PENDING_APPROVAL: account -> DECLINED (decline_reason = EDD rejection)"
          - "If account.lifecycle_status == OPEN: account -> RESTRICTED (with the full restrict cascade: POSTED txns FLAGGED, alerts created, ONGOING risk recalc)"
          - "increments EDDReview.version by 1"
      - from: APPROVED
        to: REFRESH_DUE
        trigger: "system (daily sweep: refresh_due_date < clock date)"
        actor: system
        preconditions: []
        side_effects: ["account aml_posture recomputed (ELEVATED while any REFRESH_DUE review exists)", "increments EDDReview.version by 1"]

  - entity: SecurityTransaction
    initial_state: POSTED
    terminal_states: [CLEARED, REVERSED]
    transitions:
      - from: POSTED
        to: FLAGGED
        trigger: "system (scan match, posture ELEVATED at post time, or account restriction cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments SecurityTransaction.version by 1"]
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /aml/transactions/{id}/clear"
        actor: AMLAnalyst
        preconditions: ["Transaction in FLAGGED (ERR_TRANSACTION_NOT_CLEARABLE)"]
        side_effects: ["account exposure_30d_amount / wire_velocity_30d_amount unchanged (CLEARED still counted)", "increments SecurityTransaction.version by 1"]
      - from: FLAGGED
        to: ESCALATED
        trigger: "system (owning MonitoringAlert escalated to case)"
        actor: system
        preconditions: []
        side_effects: ["increments SecurityTransaction.version by 1"]
      - from: POSTED
        to: REVERSED
        trigger: "POST /aml/transactions/{id}/reverse OR system (cert deposit decision REJECTED / REJECT_SUSPICIOUS)"
        actor: OperationsAnalyst | system
        preconditions: ["Transaction in POSTED or FLAGGED (ERR_TRANSACTION_NOT_REVERSIBLE)"]
        side_effects:
          - "reversal_reason recorded"
          - "account exposure_30d_amount and wire_velocity_30d_amount recomputed EXCLUDING this transaction (compensating invariant: post+reverse leaves both equal to pre-post values)"
          - "increments SecurityTransaction.version by 1 AND increments BrokerageAccount.version by 1"
      - from: FLAGGED
        to: REVERSED
        trigger: "POST /aml/transactions/{id}/reverse OR system (cert deposit decision)"
        actor: OperationsAnalyst | system
        preconditions: ["Transaction in POSTED or FLAGGED (ERR_TRANSACTION_NOT_REVERSIBLE)"]
        side_effects: ["Same as POSTED -> REVERSED"]
      - from: ESCALATED
        to: CLEARED
        trigger: "system (case DECIDED_NO_FILE clears linked escalated transactions)"
        actor: system
        preconditions: []
        side_effects: ["increments SecurityTransaction.version by 1"]

  - entity: MonitoringAlert
    initial_state: NEW
    terminal_states: []
    transitions:
      - from: NEW
        to: UNDER_REVIEW
        trigger: "POST /aml/alerts/{id}/begin-review"
        actor: AMLAnalyst
        preconditions: ["Alert in NEW or CLOSED_NO_ACTION (ERR_ALERT_NOT_ACTIONABLE)"]
        side_effects: ["account.open_alert_count recomputed", "increments MonitoringAlert.version by 1"]
      - from: CLOSED_NO_ACTION
        to: UNDER_REVIEW
        trigger: "POST /aml/alerts/{id}/reopen"
        actor: AMLAnalyst
        preconditions: ["Alert in CLOSED_NO_ACTION (ERR_ALERT_NOT_ACTIONABLE)"]
        side_effects: ["account.open_alert_count recomputed", "increments MonitoringAlert.version by 1"]
      - from: UNDER_REVIEW
        to: CLOSED_NO_ACTION
        trigger: "POST /aml/alerts/{id}/close-no-action"
        actor: AMLAnalyst
        preconditions: ["Alert in UNDER_REVIEW (ERR_ALERT_NOT_ACTIONABLE)"]
        side_effects: ["close_rationale recorded", "account.open_alert_count recomputed", "increments MonitoringAlert.version by 1"]
      - from: UNDER_REVIEW
        to: ESCALATED_TO_CASE
        trigger: "POST /aml/alerts/{id}/escalate"
        actor: AMLAnalyst
        preconditions: ["Alert in UNDER_REVIEW (ERR_ALERT_NOT_ACTIONABLE)"]
        side_effects:
          - "AMLCase created (status OPEN, origin_alert_id = this alert, priority from this alert's severity BEFORE any recalc)"
          - "Triggering transaction (transaction_id) with status FLAGGED becomes ESCALATED"
          - "Account risk recalculated with ONGOING variant AFTER case priority is assigned (pinned evaluation order)"
          - "account.open_alert_count and open_case_count recomputed"
          - "increments MonitoringAlert.version by 1 AND increments BrokerageAccount.version by 1"
      - from: ESCALATED_TO_CASE
        to: UNDER_REVIEW
        trigger: "system (origin case DECIDED_NO_FILE returns alert for re-triage; compensating action for escalation)"
        actor: system
        preconditions: []
        side_effects: ["account.open_alert_count recomputed", "increments MonitoringAlert.version by 1"]

  - entity: AMLCase
    initial_state: OPEN
    terminal_states: []  # CLOSED is reachable but reopenable; no absorbing terminal state
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /aml/aml-cases/{id}/begin-investigation"
        actor: AMLAnalyst
        preconditions: ["Case in OPEN or REOPENED (ERR_CASE_NOT_ACTIONABLE)"]
        side_effects: ["increments AMLCase.version by 1"]
      - from: REOPENED
        to: INVESTIGATING
        trigger: "POST /aml/aml-cases/{id}/begin-investigation"
        actor: AMLAnalyst
        preconditions: ["Case in OPEN or REOPENED (ERR_CASE_NOT_ACTIONABLE)"]
        side_effects: ["increments AMLCase.version by 1"]
      - from: INVESTIGATING
        to: SAR_RECOMMENDED
        trigger: "POST /aml/aml-cases/{id}/recommend-sar"
        actor: AMLAnalyst
        preconditions: ["Case in INVESTIGATING (ERR_CASE_NOT_ACTIONABLE)"]
        side_effects: ["recommending_analyst_id = X-User-ID", "initial_detection_date recorded", "increments AMLCase.version by 1"]
      - from: SAR_RECOMMENDED
        to: DECIDED_FILED
        trigger: "system (SARFiling for this case FILED)"
        actor: system
        preconditions: []
        side_effects: ["increments AMLCase.version by 1"]
      - from: INVESTIGATING
        to: DECIDED_NO_FILE
        trigger: "POST /aml/aml-cases/{id}/decide-no-file"
        actor: SAROfficer
        preconditions: ["Case in INVESTIGATING or SAR_RECOMMENDED (ERR_CASE_NOT_ACTIONABLE)"]
        side_effects:
          - "Origin alert (if any) ESCALATED_TO_CASE -> UNDER_REVIEW (compensating invariant: open workload unchanged across escalate + decide-no-file pair)"
          - "Linked ESCALATED transactions become CLEARED"
          - "account.open_case_count / open_alert_count recomputed; aml_posture recomputed"
          - "increments AMLCase.version by 1 AND increments BrokerageAccount.version by 1"
      - from: SAR_RECOMMENDED
        to: DECIDED_NO_FILE
        trigger: "POST /aml/aml-cases/{id}/decide-no-file"
        actor: SAROfficer
        preconditions: ["Case in INVESTIGATING or SAR_RECOMMENDED (ERR_CASE_NOT_ACTIONABLE)"]
        side_effects: ["Same as INVESTIGATING -> DECIDED_NO_FILE"]
      - from: DECIDED_NO_FILE
        to: CLOSED
        trigger: "POST /aml/aml-cases/{id}/close"
        actor: SAROfficer
        preconditions:
          - "Case in DECIDED_NO_FILE or DECIDED_FILED (ERR_CASE_NOT_ACTIONABLE)"
          - "No SARFiling for this case with status DRAFT (ERR_CASE_HAS_OPEN_FILING)"
        side_effects: ["account.open_case_count recomputed", "aml_posture recomputed", "increments AMLCase.version by 1"]
      - from: DECIDED_FILED
        to: CLOSED
        trigger: "POST /aml/aml-cases/{id}/close"
        actor: SAROfficer
        preconditions: ["Same as DECIDED_NO_FILE -> CLOSED"]
        side_effects: ["Same as DECIDED_NO_FILE -> CLOSED"]
      - from: CLOSED
        to: REOPENED
        trigger: "POST /aml/aml-cases/{id}/reopen"
        actor: AMLAnalyst
        preconditions: ["Case in CLOSED (ERR_CASE_NOT_ACTIONABLE)"]
        side_effects: ["reopen_reason recorded", "account.open_case_count recomputed", "aml_posture recomputed", "increments AMLCase.version by 1"]

  - entity: SARFiling
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /aml/sar-filings/{id}/file"
        actor: SAROfficer
        preconditions:
          - "Filing in DRAFT (ERR_SAR_NOT_FILABLE)"
          - "Initial filing (prior_filing_id null): case in SAR_RECOMMENDED (ERR_CASE_NOT_SAR_RECOMMENDED)"
          - "Continuing filing (prior_filing_id set): case in DECIDED_FILED and prior filing status FILED (ERR_PRIOR_FILING_CASE_MISMATCH)"
          - "SoD: X-User-ID != case.recommending_analyst_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "filed_at stamped; filed_late computed (filed date > filing_deadline)"
          - "continuing_review_due_date = filed date + 90 calendar days"
          - "Initial: case SAR_RECOMMENDED -> DECIDED_FILED"
          - "Continuing: prior filing FILED -> SUPERSEDED"
          - "increments SARFiling.version by 1"
      - from: FILED
        to: SUPERSEDED
        trigger: "system (continuing filing with prior_filing_id = this filing is FILED)"
        actor: system
        preconditions: []
        side_effects: ["increments SARFiling.version by 1"]

  - entity: FinCENRequest314A
    initial_state: RECEIVED
    terminal_states: [RESPONSE_SUBMITTED]
    transitions:
      - from: RECEIVED
        to: SCAN_COMPLETE
        trigger: "POST /aml/fincen-314a-requests/{id}/scan"
        actor: ComplianceOfficer
        preconditions: ["Request in RECEIVED (ERR_FINCEN_REQUEST_NOT_SCANNABLE)"]
        side_effects:
          - "Match314A rows generated per deterministic matching: TAX_ID_EXACT if subject.tax_id == customer.tax_id; else NAME_DOB if INDIVIDUAL subject and case-insensitive name match and equal date_of_birth; else NAME_EXACT on case-insensitive name. Strongest basis per (subject, account); one row per (subject, account)"
          - "match_count recomputed"
          - "increments FinCENRequest314A.version by 1"
      - from: SCAN_COMPLETE
        to: RESPONSE_SUBMITTED
        trigger: "POST /aml/fincen-314a-requests/{id}/submit-response"
        actor: ComplianceOfficer
        preconditions:
          - "Request in SCAN_COMPLETE or OVERDUE (ERR_FINCEN_REQUEST_NOT_SCANNABLE)"
          - "Every Match314A of this request has status IN {FALSE_POSITIVE, RESOLVED} (ERR_FINCEN_RESPONSE_INCOMPLETE)"
        side_effects: ["responded_at stamped; responded_late computed (responded date > response_deadline)", "increments FinCENRequest314A.version by 1"]
      - from: OVERDUE
        to: RESPONSE_SUBMITTED
        trigger: "POST /aml/fincen-314a-requests/{id}/submit-response"
        actor: ComplianceOfficer
        preconditions: ["Same as SCAN_COMPLETE -> RESPONSE_SUBMITTED"]
        side_effects: ["Same as SCAN_COMPLETE -> RESPONSE_SUBMITTED (responded_late will be true)"]
      - from: RECEIVED
        to: OVERDUE
        trigger: "system (daily sweep: response_deadline < clock date)"
        actor: system
        preconditions: []
        side_effects: ["increments FinCENRequest314A.version by 1"]
      - from: SCAN_COMPLETE
        to: OVERDUE
        trigger: "system (daily sweep: response_deadline < clock date)"
        actor: system
        preconditions: []
        side_effects: ["increments FinCENRequest314A.version by 1"]

  - entity: Match314A
    initial_state: PENDING_REVIEW
    terminal_states: [FALSE_POSITIVE, RESOLVED]
    transitions:
      - from: PENDING_REVIEW
        to: CONFIRMED
        trigger: "POST /aml/fincen-314a-matches/{id}/confirm"
        actor: ComplianceOfficer
        preconditions: ["Match in PENDING_REVIEW (ERR_MATCH_NOT_REVIEWABLE)"]
        side_effects:
          - "reviewed_by = X-User-ID"
          - "Hop 1: account OPEN -> RESTRICTED (if OPEN); aml_posture -> SEVERE"
          - "Hop 2 (caused by hop 1 restriction cascade): all POSTED SecurityTransaction of account -> FLAGGED"
          - "Hop 3 (caused by hop 2 flagging): MonitoringAlert created per newly FLAGGED transaction (status NEW, rule_code FINCEN_314A_MATCH) when no open alert exists for that transaction"
          - "Hop 4 (caused by hop 3 alert creation): account risk recalculated with ONGOING variant reading the new alert set"
          - "increments Match314A.version by 1 AND increments BrokerageAccount.version by 1"
      - from: PENDING_REVIEW
        to: FALSE_POSITIVE
        trigger: "POST /aml/fincen-314a-matches/{id}/mark-false-positive"
        actor: ComplianceOfficer
        preconditions: ["Match in PENDING_REVIEW (ERR_MATCH_NOT_REVIEWABLE)"]
        side_effects: ["reviewed_by = X-User-ID", "increments Match314A.version by 1"]
      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /aml/fincen-314a-matches/{id}/resolve"
        actor: ComplianceOfficer
        preconditions: ["Match in CONFIRMED (ERR_MATCH_NOT_REVIEWABLE)"]
        side_effects: ["aml_posture recomputed (may leave SEVERE when no CONFIRMED matches remain)", "increments Match314A.version by 1 AND increments BrokerageAccount.version by 1"]

  - entity: PhysicalCertificateDeposit
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED_SUSPICIOUS]
    transitions:
      - from: RECEIVED
        to: ELIGIBILITY_REVIEW
        trigger: "POST /aml/certificate-deposits/{id}/advance"
        actor: OperationsAnalyst
        preconditions: ["Deposit in RECEIVED or RESUBMITTED (ERR_DEPOSIT_NOT_ADVANCEABLE)"]
        side_effects: ["increments PhysicalCertificateDeposit.version by 1"]
      - from: ELIGIBILITY_REVIEW
        to: AUTHENTICITY_REVIEW
        trigger: "POST /aml/certificate-deposits/{id}/advance"
        actor: OperationsAnalyst
        preconditions:
          - "Deposit in ELIGIBILITY_REVIEW (ERR_DEPOSIT_NOT_ADVANCEABLE)"
          - "No ACTIVE LostStolenCertificateEntry with this certificate_number (ERR_CERT_REPORTED_LOST_STOLEN — re-checked at authenticity entry)"
        side_effects: ["increments PhysicalCertificateDeposit.version by 1"]
      - from: RESUBMITTED
        to: AUTHENTICITY_REVIEW
        trigger: "POST /aml/certificate-deposits/{id}/advance"
        actor: OperationsAnalyst
        preconditions:
          - "Deposit in RECEIVED or RESUBMITTED (ERR_DEPOSIT_NOT_ADVANCEABLE); from RESUBMITTED eligibility is skipped"
          - "No ACTIVE LostStolenCertificateEntry with this certificate_number (ERR_CERT_REPORTED_LOST_STOLEN)"
        side_effects: ["increments PhysicalCertificateDeposit.version by 1"]
      - from: AUTHENTICITY_REVIEW
        to: CLEARANCE_HOLD
        trigger: "POST /aml/certificate-deposits/{id}/advance"
        actor: OperationsAnalyst
        preconditions: ["Deposit in AUTHENTICITY_REVIEW (ERR_DEPOSIT_NOT_ADVANCEABLE)"]
        side_effects:
          - "hold_release_date = clock date + hold days (10 if is_low_priced else 5; + 5 more if has_restrictive_legend)"
          - "increments PhysicalCertificateDeposit.version by 1"
      - from: CLEARANCE_HOLD
        to: READY_TO_ACCEPT
        trigger: "system (daily sweep: hold_release_date <= clock date)"
        actor: system
        preconditions: []
        side_effects: ["increments PhysicalCertificateDeposit.version by 1"]
      - from: READY_TO_ACCEPT
        to: ACCEPTED
        trigger: "POST /aml/certificate-deposits/{id}/decision with outcome=ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "Deposit in READY_TO_ACCEPT (ERR_DEPOSIT_NOT_DECIDABLE)"
          - "OCC: expected_deposit_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "Linked DEPOSIT_CERT transaction FLAGGED -> CLEARED"
          - "decision_reason recorded; increments PhysicalCertificateDeposit.version by 1"
      - from: READY_TO_ACCEPT
        to: REJECTED
        trigger: "POST /aml/certificate-deposits/{id}/decision with outcome=REJECT"
        actor: ComplianceOfficer
        preconditions: ["Deposit in READY_TO_ACCEPT (ERR_DEPOSIT_NOT_DECIDABLE)", "OCC: expected_deposit_version == current version (ERR_STALE_VERSION)"]
        side_effects:
          - "Linked DEPOSIT_CERT transaction FLAGGED -> REVERSED (exposure/velocity recomputed)"
          - "decision_reason recorded; increments PhysicalCertificateDeposit.version by 1"
      - from: READY_TO_ACCEPT
        to: REJECTED_SUSPICIOUS
        trigger: "POST /aml/certificate-deposits/{id}/decision with outcome=REJECT_SUSPICIOUS"
        actor: ComplianceOfficer
        preconditions: ["Deposit in READY_TO_ACCEPT (ERR_DEPOSIT_NOT_DECIDABLE)", "OCC: expected_deposit_version == current version (ERR_STALE_VERSION)"]
        side_effects:
          - "Hop 1: linked DEPOSIT_CERT transaction FLAGGED -> REVERSED (exposure recomputed)"
          - "Hop 2 (caused by hop 1 reversal): account.has_suspicion_flag = true; aml_posture recomputed -> at least ELEVATED"
          - "Hop 3 (caused by hop 2 suspicion flag): MonitoringAlert created (status NEW, rule_code CERT_SUSPICION, transaction_id = reversed transaction)"
          - "decision_reason recorded; increments PhysicalCertificateDeposit.version by 1 AND increments BrokerageAccount.version by 1"
      - from: REJECTED
        to: RESUBMITTED
        trigger: "POST /aml/certificate-deposits/{id}/resubmit"
        actor: OperationsAnalyst
        preconditions: ["Deposit in REJECTED (ERR_DEPOSIT_NOT_RESUBMITTABLE)"]
        side_effects: ["increments PhysicalCertificateDeposit.version by 1"]

  - entity: AuditEngagement
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: FIELDWORK
        trigger: "POST /aml/audit-engagements/{id}/begin-fieldwork"
        actor: IndependentAuditor
        preconditions: ["Engagement in PLANNED (ERR_ENGAGEMENT_NOT_ACTIVE)"]
        side_effects: ["increments AuditEngagement.version by 1"]
      - from: FIELDWORK
        to: REPORTED
        trigger: "POST /aml/audit-engagements/{id}/issue-report"
        actor: IndependentAuditor
        preconditions: ["Engagement in FIELDWORK (ERR_ENGAGEMENT_NOT_ACTIVE)"]
        side_effects: ["report_summary recorded", "increments AuditEngagement.version by 1"]
      - from: REPORTED
        to: CLOSED
        trigger: "POST /aml/audit-engagements/{id}/close"
        actor: IndependentAuditor
        preconditions:
          - "Engagement in REPORTED (ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "All AuditFinding of this engagement have status IN {REMEDIATED, ACCEPTED_RISK} (ERR_ENGAGEMENT_HAS_OPEN_FINDINGS)"
        side_effects: ["increments AuditEngagement.version by 1"]

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [REMEDIATED, ACCEPTED_RISK]
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /aml/audit-findings/{id}/submit-remediation"
        actor: ComplianceOfficer
        preconditions: ["Finding in OPEN (ERR_FINDING_NOT_OPEN)"]
        side_effects: ["remediation_note recorded; submitted_by = X-User-ID", "increments AuditFinding.version by 1"]
      - from: REMEDIATION_SUBMITTED
        to: REMEDIATED
        trigger: "POST /aml/audit-findings/{id}/verify-remediation with decision=CONFIRM"
        actor: IndependentAuditor
        preconditions:
          - "Finding in REMEDIATION_SUBMITTED (ERR_FINDING_NOT_SUBMITTED)"
          - "SoD: X-User-ID != submitted_by (ERR_SOD_VIOLATION)"
        side_effects: ["verified_by = X-User-ID", "increments AuditFinding.version by 1"]
      - from: REMEDIATION_SUBMITTED
        to: OPEN
        trigger: "POST /aml/audit-findings/{id}/verify-remediation with decision=REJECT"
        actor: IndependentAuditor
        preconditions:
          - "Finding in REMEDIATION_SUBMITTED (ERR_FINDING_NOT_SUBMITTED)"
          - "SoD: X-User-ID != submitted_by (ERR_SOD_VIOLATION)"
        side_effects: ["verified_by = X-User-ID; finding cycles back to OPEN for another remediation round", "increments AuditFinding.version by 1"]
      - from: OPEN
        to: ACCEPTED_RISK
        trigger: "POST /aml/audit-findings/{id}/accept-risk"
        actor: IndependentAuditor
        preconditions:
          - "Finding in OPEN (ERR_FINDING_NOT_OPEN)"
          - "severity IN {LOW, MEDIUM} (ERR_RISK_ACCEPTANCE_NOT_ALLOWED)"
        side_effects: ["increments AuditFinding.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: case-create-stale-account
    parent_entity: BrokerageAccount
    write_endpoint: "POST /aml/aml-cases"
    occ_field: "expected_account_version"
    description: |
      Creating an AMLCase against a BrokerageAccount whose version has advanced
      since the client last observed it is rejected. Opening a case legitimately
      mutates the account (open_case_count, ONGOING risk recalc, version bump),
      so a create carrying an older expected_account_version is acting on a
      stale view of the account and is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: risk-recalc-stale-account
    parent_entity: BrokerageAccount
    write_endpoint: "POST /aml/accounts/{id}/risk-recalculations"
    occ_field: "expected_account_version"
    description: |
      Running an ONGOING risk recalculation with an expected_account_version
      older than the account's current version is rejected: any account mutation
      (transaction posting changing exposure/velocity, alert creation, case
      open/close, posture change) since the client's observation invalidates the
      basis of the recalculation, so the stale request is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cert-decision-stale-deposit
    parent_entity: PhysicalCertificateDeposit
    write_endpoint: "POST /aml/certificate-deposits/{id}/decision"
    occ_field: "expected_deposit_version"
    description: |
      Deciding a PhysicalCertificateDeposit whose version has advanced since the
      reviewer last observed it (e.g., a supplement note was added during
      READY_TO_ACCEPT, which legitimately keeps the deposit decidable) is
      rejected: the review basis is stale and the decision is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: account_risk_score
    trigger: "account creation (INITIAL variant); account approval re-stamps INITIAL; explicit POST /aml/accounts/{id}/risk-recalculations; alert escalation; case open; Match314A confirm (ONGOING variant for all but creation/approval)"
    algorithm: weighted_scoring
    formula: |
      score = clamp(0, 100,
          country_points            # LOW 0, MEDIUM 10, HIGH 25; PROHIBITED -> tier PROHIBITED regardless of score
        + customer_type_points      # INDIVIDUAL 0, LEGAL_ENTITY 10
        + pep_points                # is_pep -> 20, else 0
        + product_points            # min(25, 15*[LOW_PRICED_SECURITIES in product_set] + 5*[MARGIN] + 5*[OPTIONS] + 10*[CORRESPONDENT])
        + ownership_opacity_points  # LEGAL_ENTITY whose current CERTIFIED certification has any BeneficialOwner.is_entity_owner == true -> 10; else 0
        + activity_points           # ONGOING variant ONLY: 5 * count(MonitoringAlert of account with status IN {UNDER_REVIEW, ESCALATED_TO_CASE})
                                    #                     + 10 * count(SARFiling with status FILED belonging to cases of this account)
                                    #                     + velocity_band_points
      )
      velocity_band_points: ratio = wire_velocity_30d_amount / tier_limit
        ratio < 0.5 -> 0 ; 0.5 <= ratio < 0.8 -> 5 ; ratio >= 0.8 -> 10
      tier_limit: LOW 250000, MEDIUM 100000, HIGH 25000 (evaluated against the tier in effect BEFORE this recalc; on creation use LOW limit)
      tier: PROHIBITED if customer.country_risk_tier == PROHIBITED
            else HIGH if score >= 70 ; MEDIUM if score >= 40 ; else LOW
    input_set: "Customer profile fields, account.product_set, current CERTIFIED BeneficialOwnershipCertification owners, account alerts/SARs/wires (ONGOING only)"
    constants:
      PRODUCT_CAP: 25
      TIER_HIGH: 70
      TIER_MEDIUM: 40
      VELOCITY_BAND_MID: 0.5
      VELOCITY_BAND_HIGH: 0.8
    precision: "integer score (all point values are integers); tier thresholds inclusive at lower bound (>=)"
    variants:
      - name: INITIAL
        when: "account creation and approval"
        difference: "activity_points is ALWAYS 0 (no alert/SAR/velocity history is read); identical static profile therefore scores lower than ONGOING once activity exists"
      - name: ONGOING
        when: "explicit recalculation, escalation, case open, 314(a) confirm"
        difference: "activity_points included: 5 per open-workflow alert, 10 per FILED SAR, plus velocity_band_points"

  - name: sar_filing_deadlines
    trigger: "SARFiling creation (DRAFT): initial filings and continuing filings use different variants; continuing_review_due_date computed on file"
    algorithm: threshold
    formula: |
      INITIAL variant (prior_filing_id is null):
        filing_deadline = case.initial_detection_date + 30 calendar days
      CONTINUING variant (prior_filing_id set):
        filing_deadline = prior_filing.filed_at date + 120 calendar days
      On file (both variants):
        filed_late = (filed date > filing_deadline)
        continuing_review_due_date = filed date + 90 calendar days
    input_set: "the case's initial_detection_date; the prior filing's filed_at"
    constants:
      INITIAL_FILING_DAYS: 30
      CONTINUING_FILING_DAYS: 120
      CONTINUING_REVIEW_DAYS: 90
    precision: "day granularity, YYYY-MM-DD, UTC"
    variants:
      - name: INITIAL_DETECTION
        when: "first SAR for a case"
        difference: "deadline anchored to detection date, 30 days"
      - name: CONTINUING_ACTIVITY
        when: "continuing-activity SAR linked via prior_filing_id"
        difference: "deadline anchored to prior filing's filed_at, 120 days — for the same detection date a continuing filing has a different, later deadline"

  - name: low_priced_liquidation_proceeds
    trigger: "monitoring scan evaluating LPS_LIQUIDATION rule"
    algorithm: aggregation
    formula: |
      For each matching SELL transaction t (is_low_priced == true, status IN {POSTED, FLAGGED, ESCALATED}, created_at date in window):
        line_proceeds(t) = round_half_up(t.quantity * t.unit_price, 2)   # ROUND PER LINE FIRST
      aggregate_amount = sum(line_proceeds(t) for all t)               # THEN SUM (pinned order)
      Alert fires when aggregate_amount >= rule.threshold_amount AND count(t) >= rule.min_transaction_count.
      (The alternative order — sum raw products then round — can differ by cents, e.g. two lines of 1 @ 2.345: per-line 2.35+2.35 = 4.70 vs sum-then-round round(4.690,2) = 4.69. The scaffold PINS per-line-then-sum.)
    input_set: "SELL transactions of the account, is_low_priced == true, status IN {POSTED, FLAGGED, ESCALATED}, created_at date in [clock_date - window_days, clock_date] inclusive"
    precision: "2 decimal places, round_half_up per line, then exact sum"
    variants: []

  - name: alert_severity_score
    trigger: "alert creation (scan or cascade); severity is FROZEN on the alert at creation; case priority reads this frozen severity"
    algorithm: threshold
    formula: |
      severity_base = 100 * min(aggregate_amount / rule.threshold_amount, 2.0)
      risk_multiplier = 1.0 + (0.25 if account.risk_tier == HIGH else 0) + (0.10 if account.risk_tier == MEDIUM else 0)
      severity = round_half_up(severity_base * risk_multiplier, 0)   # integer
      Pinned evaluation order for escalation (circular-looking dependency resolved):
        (1) alert -> ESCALATED_TO_CASE, AMLCase created;
        (2) case.priority = mapping from alert.severity AS FROZEN AT ALERT CREATION (pre-recalc);
        (3) account risk recalculated ONGOING (which may change risk_tier and thus the multiplier a FUTURE alert would get);
        (4) open_alert_count / open_case_count recomputed.
      Case priority mapping: severity >= 150 -> CRITICAL ; >= 100 -> HIGH ; >= 50 -> MEDIUM ; else LOW.
    input_set: "the alert's aggregate_amount, its rule's threshold_amount, account.risk_tier at alert-creation time"
    constants:
      SEVERITY_CAP_RATIO: 2.0
      CRITICAL_FLOOR: 150
      HIGH_FLOOR: 100
      MEDIUM_FLOOR: 50
    precision: "severity is an integer, round_half_up"

  - name: wire_velocity_30d
    trigger: "posting a WIRE_OUT transaction; ONGOING risk recalculation (velocity band); WIRE_VELOCITY scan rule"
    algorithm: aggregation
    formula: |
      wire_velocity_30d_amount = sum(amount) over WIRE_OUT transactions of the account with
        status != REVERSED and created_at date in [clock_date - 30, clock_date] inclusive.
      Posting check: projected = wire_velocity_30d_amount + new_wire.amount
        reject with ERR_VELOCITY_LIMIT_EXCEEDED iff projected > tier_limit
        (projected == tier_limit PASSES — strict-greater semantics).
      tier_limit: LOW 250000, MEDIUM 100000, HIGH 25000 (tier in effect at posting time).
    input_set: "WIRE_OUT transactions, status != REVERSED, trailing 30 calendar days inclusive"
    constants:
      LIMIT_LOW: 250000
      LIMIT_MEDIUM: 100000
      LIMIT_HIGH: 25000
    precision: "2 decimal places"

  - name: beneficial_ownership_coverage
    trigger: "certify transition on BeneficialOwnershipCertification"
    algorithm: threshold
    formula: |
      total_ownership_pct = sum(ownership_pct over all BeneficialOwner rows)  # must be <= 100.0
      covered owner: ownership_pct >= 25.00 (exactly 25.00 IS covered — inclusive boundary)
      Every covered owner MUST have tax_id, date_of_birth, address all present (ERR_OWNER_KYC_REQUIRED).
      Require: (count of covered owners >= 1) OR (no_25pct_owner_attested == true), else ERR_OWNER_KYC_REQUIRED.
      Require: at least one owner with is_control_person == true (ERR_CONTROL_PERSON_REQUIRED).
      covered_owner_count = count of covered owners with full KYC present.
    input_set: "BeneficialOwner rows of this certification"
    constants:
      COVERAGE_THRESHOLD: 25.00
      MAX_TOTAL_PCT: 100.0
    precision: "percentages compared at 2 decimal places"

  - name: edd_refresh_schedule
    trigger: "EDDReview complete with decision=APPROVED; daily sweep flips APPROVED -> REFRESH_DUE"
    algorithm: threshold
    formula: |
      On completion: tier_at_completion = account.risk_tier (captured, immutable afterwards)
      refresh_due_date = completion date + interval months
        interval: HIGH 12, MEDIUM 24, LOW 36 (calendar months, same day-of-month)
      Daily sweep: review APPROVED and refresh_due_date < clock date -> REFRESH_DUE
        (refresh_due_date == clock date is NOT yet due — strict less-than).
    input_set: "the completed review, account.risk_tier at completion"
    constants:
      INTERVAL_HIGH_MONTHS: 12
      INTERVAL_MEDIUM_MONTHS: 24
      INTERVAL_LOW_MONTHS: 36
    precision: "day granularity, YYYY-MM-DD"

  - name: audit_finding_aging
    trigger: "AuditFinding creation; daily sweep"
    algorithm: threshold
    formula: |
      remediation_deadline = created date + severity_days
        severity_days: CRITICAL 30, HIGH 60, MEDIUM 90, LOW 180  (fixed at issuance from INITIAL severity)
      Daily sweep: status IN {OPEN, REMEDIATION_SUBMITTED} and remediation_deadline < clock date
        -> is_overdue = true AND severity escalated one level (LOW->MEDIUM->HIGH->CRITICAL; CRITICAL unchanged)
        remediation_deadline does NOT move after issuance.
      deadline == clock date is NOT overdue (strict less-than).
    input_set: "findings with status IN {OPEN, REMEDIATION_SUBMITTED}"
    constants:
      DAYS_CRITICAL: 30
      DAYS_HIGH: 60
      DAYS_MEDIUM: 90
      DAYS_LOW: 180
    precision: "day granularity"

  - name: certificate_hold_period
    trigger: "PhysicalCertificateDeposit advance into CLEARANCE_HOLD; daily sweep releases"
    algorithm: threshold
    formula: |
      hold_days = (10 if is_low_priced else 5) + (5 if has_restrictive_legend else 0)
      hold_release_date = CLEARANCE_HOLD entry date + hold_days (calendar days)
      Daily sweep: status CLEARANCE_HOLD and hold_release_date <= clock date -> READY_TO_ACCEPT
        (release is INCLUSIVE: clock date == hold_release_date releases).
    input_set: "the deposit's is_low_priced and has_restrictive_legend"
    constants:
      HOLD_LOW_PRICED: 10
      HOLD_REGULAR: 5
      HOLD_LEGEND_EXTRA: 5
    precision: "day granularity"

  - name: exposure_tier_30d
    trigger: "any transaction post/reverse/clear; ONGOING risk recalc reads the band"
    algorithm: aggregation
    formula: |
      exposure_30d_amount = sum(amount) over ALL transactions of the account with
        status != REVERSED and created_at date in [clock_date - 30, clock_date] inclusive.
      exposure_tier: T1 if exposure_30d_amount < 100000 ;
                     T2 if 100000 <= exposure_30d_amount < 500000 ;
                     T3 if exposure_30d_amount >= 500000 (exactly 500000 IS T3).
    input_set: "all transaction types, status != REVERSED, trailing 30 calendar days inclusive"
    constants:
      T2_FLOOR: 100000
      T3_FLOOR: 500000
    precision: "2 decimal places; tier boundaries inclusive at lower bound"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Segregation of duties: SAR filer X-User-ID != case.recommending_analyst_id; finding verifier X-User-ID != finding.submitted_by"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /aml/sar-filings/{id}/file", "POST /aml/audit-findings/{id}/verify-remediation"]
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right (rep, customer, account, document, certification, owner, review, transaction, rule, alert, case, filing, request, match, deposit, lost/stolen entry, engagement, finding)"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: state
    check: "Actor entity state: RegisteredRep must be ACTIVE to create customers/accounts/documents/certifications"
    error_id: ERR_REP_SUSPENDED
    http_status: 409
    applies_to: ["POST /aml/customers", "POST /aml/accounts", "POST /aml/customers/{id}/identification-documents", "POST /aml/customers/{id}/beneficial-ownership-certifications"]
  - priority: 6
    category: state
    check: "Target resource lifecycle permits the operation (account OPEN for transactions and not CLOSED/DECLINED terminal; review/alert/case/match/deposit/finding/engagement in an actionable state; OCC expected_*_version match)"
    error_id: "ERR_ACCOUNT_NOT_OPEN | ERR_ACCOUNT_RESTRICTED | ERR_ACCOUNT_CLOSED_TERMINAL | ERR_INVALID_LIFECYCLE_TRANSITION | ERR_EDD_REVIEW_NOT_ACTIONABLE | ERR_ALERT_NOT_ACTIONABLE | ERR_CASE_NOT_ACTIONABLE | ERR_MATCH_NOT_REVIEWABLE | ERR_DEPOSIT_NOT_ADVANCEABLE | ERR_DEPOSIT_NOT_DECIDABLE | ERR_DEPOSIT_NOT_RESUBMITTABLE | ERR_TRANSACTION_NOT_REVERSIBLE | ERR_TRANSACTION_NOT_CLEARABLE | ERR_SAR_NOT_FILABLE | ERR_FINCEN_REQUEST_NOT_SCANNABLE | ERR_FINDING_NOT_OPEN | ERR_FINDING_NOT_SUBMITTED | ERR_ENGAGEMENT_NOT_ACTIVE | ERR_CERTIFICATION_NOT_DRAFT | ERR_DOCUMENT_NOT_VERIFIABLE | ERR_DOCUMENT_NOT_REJECTABLE | ERR_STALE_VERSION (412)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Account aml_posture SEVERE blocks ALL new transaction posting and certificate deposit intake"
    error_id: ERR_POSTURE_SEVERE_BLOCKS
    http_status: 403
    applies_to: ["POST /aml/accounts/{id}/transactions", "POST /aml/accounts/{id}/certificate-deposits"]
  - priority: 8
    category: business_safety
    check: "Certificate number not on ACTIVE lost/stolen registry (checked at deposit creation AND at advance into AUTHENTICITY_REVIEW)"
    error_id: ERR_CERT_REPORTED_LOST_STOLEN
    http_status: 403
    applies_to: ["POST /aml/accounts/{id}/certificate-deposits", "POST /aml/certificate-deposits/{id}/advance"]
  - priority: 9
    category: business_safety
    check: "PROHIBITED risk tier can never be approved; account approval gates (CIP completeness, certified beneficial ownership for legal entities, APPROVED EDD for HIGH tier) satisfied"
    error_id: "ERR_PROHIBITED_TIER | ERR_CIP_INCOMPLETE | ERR_BENEFICIAL_OWNERSHIP_REQUIRED | ERR_EDD_APPROVAL_REQUIRED"
    http_status: 403
    applies_to: ["POST /aml/accounts/{id}/approve"]
  - priority: 10
    category: business_safety
    check: "Reinstate blocked while unresolved CONFIRMED 314(a) match or open CRITICAL case exists"
    error_id: "ERR_MATCH_314A_UNRESOLVED | ERR_CRITICAL_CASE_OPEN"
    http_status: 409
    applies_to: ["POST /aml/accounts/{id}/reinstate"]
  - priority: 11
    category: business_constraint
    check: "Uniqueness: crd_number, request_reference, certificate_number (among non-rejected deposits and ACTIVE registry), lost/stolen certificate_number"
    error_id: "ERR_DUPLICATE_CRD_NUMBER | ERR_DUPLICATE_314A_REQUEST | ERR_DUPLICATE_CERTIFICATE_NUMBER"
    http_status: 409
    applies_to: ["POST /aml/reps", "POST /aml/fincen-314a-requests", "POST /aml/accounts/{id}/certificate-deposits", "POST /aml/lost-stolen-certificates"]
  - priority: 12
    category: business_constraint
    check: "Temporal overlap: EDD review periods half-open [start, end) per account; audit engagement windows closed [start, end] per scope_unit"
    error_id: "ERR_OVERLAPPING_EDD_REVIEW | ERR_OVERLAPPING_AUDIT_ENGAGEMENT"
    http_status: 409
    applies_to: ["POST /aml/accounts/{id}/edd-reviews", "POST /aml/audit-engagements"]
  - priority: 13
    category: business_constraint
    check: "Ownership aggregation: total_ownership_pct <= 100.0"
    error_id: ERR_EXCESSIVE_OWNERSHIP_TOTAL
    http_status: 422
    applies_to: ["POST /aml/beneficial-ownership-certifications/{id}/certify"]
  - priority: 14
    category: business_temporal
    check: "Date sanity: period_start < period_end (EDD), start_date <= end_date (engagement), activity_start <= activity_end (SAR), dates well-formed YYYY-MM-DD"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: ["POST /aml/accounts/{id}/edd-reviews", "POST /aml/audit-engagements", "POST /aml/sar-filings"]
  - priority: 15
    category: business_referential
    check: "Cross-references valid: certification customer is LEGAL_ENTITY; owner certification is DRAFT; origin alert belongs to case account; continuing SAR's prior filing belongs to SAME case and is FILED; enum values valid"
    error_id: "ERR_CERTIFICATION_REQUIRES_LEGAL_ENTITY | ERR_CERTIFICATION_NOT_DRAFT | ERR_ALERT_ACCOUNT_MISMATCH | ERR_PRIOR_FILING_CASE_MISMATCH | ERR_INVALID_ENUM"
    http_status: 400
    applies_to: ["POST /aml/customers/{id}/beneficial-ownership-certifications", "POST /aml/beneficial-ownership-certifications/{id}/owners", "POST /aml/aml-cases", "POST /aml/sar-filings", "all endpoints with enum inputs"]
  - priority: 16
    category: business_referential
    check: "Certification content rules: covered-owner KYC completeness, control-person presence, 25% coverage or attestation"
    error_id: "ERR_OWNER_KYC_REQUIRED | ERR_CONTROL_PERSON_REQUIRED"
    http_status: 422
    applies_to: ["POST /aml/beneficial-ownership-certifications/{id}/certify"]
  - priority: 17
    category: business_fiscal
    check: "Wire velocity: projected 30d WIRE_OUT total must be <= tier limit (== passes, > rejects)"
    error_id: ERR_VELOCITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /aml/accounts/{id}/transactions (txn_type=WIRE_OUT)"]
  - priority: 18
    category: business_fiscal
    check: "Monitoring rule must be enabled to be referenced by ad-hoc scans"
    error_id: ERR_RULE_DISABLED
    http_status: 409
    applies_to: ["POST /aml/monitoring-scans/run"]
  - priority: 19
    category: state
    check: "Case close blocked while DRAFT SAR exists; account close blocked by open cases/matches/deposits/flagged transactions; engagement close blocked by non-terminal findings; SAR draft requires case SAR_RECOMMENDED (initial) or DECIDED_FILED (continuing); risk acceptance only for LOW/MEDIUM findings"
    error_id: "ERR_CASE_HAS_OPEN_FILING | ERR_ACCOUNT_CLOSE_BLOCKED | ERR_ENGAGEMENT_HAS_OPEN_FINDINGS | ERR_CASE_NOT_SAR_RECOMMENDED | ERR_RISK_ACCEPTANCE_NOT_ALLOWED"
    http_status: 409
    applies_to: ["POST /aml/aml-cases/{id}/close", "POST /aml/accounts/{id}/close", "POST /aml/audit-engagements/{id}/close", "POST /aml/sar-filings", "POST /aml/audit-findings/{id}/accept-risk"]
  - priority: 20
    category: business_safety
    check: "314(a) response requires every match resolved (FALSE_POSITIVE or RESOLVED)"
    error_id: ERR_FINCEN_RESPONSE_INCOMPLETE
    http_status: 409
    applies_to: ["POST /aml/fincen-314a-requests/{id}/submit-response"]
  - priority: 21
    category: existence
    check: "Malformed or missing required body fields, wrong types"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock & ops-run sweep (test-driving / ops surface) ---
  - method: POST
    path: "/aml/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the clock NEVER falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["No state recomputation; use run-daily-sweep to apply time-based transitions"]

  - method: POST
    path: "/aml/maintenance/run-daily-sweep"
    description: "Ops-run checkpoint: applies all time-based transitions at current clock (document expiry, EDD refresh-due, SAR review overdue, 314(a) overdue, cert hold release, finding aging + severity escalation)"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: { documents_expired: integer, edd_reviews_flagged: integer, sar_reviews_due: integer, requests_314a_overdue: integer, holds_released: integer, findings_aged: integer }
    side_effects: ["Each affected entity's version increments; affected accounts recompute aml_posture"]

  # --- Registered Reps ---
  - method: POST
    path: "/aml/reps"
    description: "Create a registered rep"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, crd_number]
    output: RegisteredRep
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/aml/reps"
    description: "List reps"
    roles: &ROLES_ALL [RegisteredRep, AMLAnalyst, ComplianceOfficer, SAROfficer, OperationsAnalyst, IndependentAuditor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "RegisteredRep[]"
    side_effects: []
  - method: GET
    path: "/aml/reps/{id}"
    description: "Get a rep"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: RegisteredRep
    side_effects: []
  - method: POST
    path: "/aml/reps/{id}/suspend"
    description: "Suspend a rep"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: RegisteredRep
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/aml/reps/{id}/reinstate"
    description: "Reinstate a rep"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: RegisteredRep
    side_effects: ["status -> ACTIVE"]

  # --- Customers (CIP) ---
  - method: POST
    path: "/aml/customers"
    description: "Create a customer (CIP record); registered_rep_id from X-User-ID"
    roles: [RegisteredRep]
    code: 201
    input: [customer_type, full_name, tax_id, country_risk_tier, "is_pep?", "date_of_birth?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/aml/customers"
    description: "List customers"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "registered_rep_id?", "tax_id?", "customer_type?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/aml/customers/{id}"
    description: "Get a customer"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Identification documents ---
  - method: POST
    path: "/aml/customers/{customerId}/identification-documents"
    description: "Submit a CIP identification document"
    roles: [RegisteredRep]
    code: 201
    input: [doc_type, document_number, expiry_date]
    output: IdentificationDocument
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/aml/identification-documents"
    description: "List identification documents"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?", "doc_type?"]
    output: "IdentificationDocument[]"
    side_effects: []
  - method: GET
    path: "/aml/identification-documents/{id}"
    description: "Get a document"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: IdentificationDocument
    side_effects: []
  - method: POST
    path: "/aml/identification-documents/{id}/verify"
    description: "Verify a document; supersedes prior VERIFIED/EXPIRED docs of same customer+doc_type; recomputes posture"
    roles: [AMLAnalyst]
    code: 200
    input: []
    output: IdentificationDocument
    side_effects: ["status -> VERIFIED", "same-type VERIFIED/EXPIRED docs -> SUPERSEDED", "posture recompute on customer's accounts"]
  - method: POST
    path: "/aml/identification-documents/{id}/reject"
    description: "Reject a document"
    roles: [AMLAnalyst]
    code: 200
    input: [reason]
    output: IdentificationDocument
    side_effects: ["status -> REJECTED"]

  # --- Beneficial ownership ---
  - method: POST
    path: "/aml/customers/{customerId}/beneficial-ownership-certifications"
    description: "Open a beneficial ownership certification (LEGAL_ENTITY customers only)"
    roles: [RegisteredRep]
    code: 201
    input: ["no_25pct_owner_attested?"]
    output: BeneficialOwnershipCertification
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/aml/beneficial-ownership-certifications"
    description: "List certifications"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "BeneficialOwnershipCertification[]"
    side_effects: []
  - method: GET
    path: "/aml/beneficial-ownership-certifications/{id}"
    description: "Get a certification"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: BeneficialOwnershipCertification
    side_effects: []
  - method: POST
    path: "/aml/beneficial-ownership-certifications/{certId}/owners"
    description: "Add a beneficial owner row (certification must be DRAFT)"
    roles: [RegisteredRep]
    code: 201
    input: [full_name, ownership_pct, "is_control_person?", "is_entity_owner?", "tax_id?", "date_of_birth?", "address?"]
    output: BeneficialOwner
    side_effects: ["certification total_ownership_pct recomputed"]
  - method: GET
    path: "/aml/beneficial-owners"
    description: "List beneficial owners"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "certification_id?"]
    output: "BeneficialOwner[]"
    side_effects: []
  - method: GET
    path: "/aml/beneficial-owners/{id}"
    description: "Get a beneficial owner"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: BeneficialOwner
    side_effects: []
  - method: POST
    path: "/aml/beneficial-ownership-certifications/{id}/certify"
    description: "Certify ownership (runs beneficial_ownership_coverage); supersedes prior CERTIFIED certification"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BeneficialOwnershipCertification
    side_effects: ["status -> CERTIFIED", "prior CERTIFIED certification for customer -> SUPERSEDED"]

  # --- Brokerage accounts ---
  - method: POST
    path: "/aml/accounts"
    description: "Open-account request; INITIAL risk computed at creation"
    roles: [RegisteredRep]
    code: 201
    input: [customer_id, product_set]
    output: BrokerageAccount
    side_effects: ["lifecycle_status = PENDING_APPROVAL", "risk_score/risk_tier computed (INITIAL variant)", "aml_posture = STANDARD"]
  - method: GET
    path: "/aml/accounts"
    description: "List accounts"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "customer_id?", "lifecycle_status?", "risk_tier?", "aml_posture?"]
    output: "BrokerageAccount[]"
    side_effects: []
  - method: GET
    path: "/aml/accounts/{id}"
    description: "Get an account"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: BrokerageAccount
    side_effects: []
  - method: POST
    path: "/aml/accounts/{id}/approve"
    description: "Approve account opening (gated by CIP, beneficial ownership, tier rules, EDD for HIGH)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BrokerageAccount
    side_effects: ["lifecycle_status -> OPEN", "increments BrokerageAccount.version by 1"]
  - method: POST
    path: "/aml/accounts/{id}/decline"
    description: "Decline account opening"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: BrokerageAccount
    side_effects: ["lifecycle_status -> DECLINED", "increments BrokerageAccount.version by 1"]
  - method: POST
    path: "/aml/accounts/{id}/restrict"
    description: "Restrict an OPEN account"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: BrokerageAccount
    side_effects: ["lifecycle_status -> RESTRICTED", "POSTED transactions -> FLAGGED", "alerts created per newly flagged transaction", "ONGOING risk recalc", "increments BrokerageAccount.version by 1"]
  - method: POST
    path: "/aml/accounts/{id}/reinstate"
    description: "Reinstate a RESTRICTED account"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BrokerageAccount
    side_effects: ["lifecycle_status -> OPEN", "increments BrokerageAccount.version by 1"]
  - method: POST
    path: "/aml/accounts/{id}/close"
    description: "Close an account (blocked by open cases/matches/deposits/flagged transactions)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BrokerageAccount
    side_effects: ["lifecycle_status -> CLOSED", "increments BrokerageAccount.version by 1"]
  - method: POST
    path: "/aml/accounts/{id}/risk-recalculations"
    description: "Run ONGOING risk recalculation (OCC-guarded on account version)"
    roles: [AMLAnalyst, ComplianceOfficer]
    code: 200
    input: [expected_account_version]
    output: BrokerageAccount
    side_effects: ["risk_score/risk_tier recomputed (ONGOING variant)", "risk_variant_used = ONGOING", "aml_posture recomputed", "increments BrokerageAccount.version by 1"]

  # --- EDD reviews ---
  - method: POST
    path: "/aml/accounts/{accountId}/edd-reviews"
    description: "Open an EDD review; half-open period overlap check per account"
    roles: [AMLAnalyst]
    code: 201
    input: [period_start, period_end, trigger_reason, "prior_review_id?"]
    output: EDDReview
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/aml/edd-reviews"
    description: "List EDD reviews"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "account_id?", "status?", "prior_review_id?"]
    output: "EDDReview[]"
    side_effects: []
  - method: GET
    path: "/aml/edd-reviews/{id}"
    description: "Get an EDD review"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: EDDReview
    side_effects: []
  - method: POST
    path: "/aml/edd-reviews/{id}/begin"
    description: "Begin review (from PENDING or REFRESH_DUE)"
    roles: [AMLAnalyst]
    code: 200
    input: []
    output: EDDReview
    side_effects: ["status -> IN_REVIEW"]
  - method: POST
    path: "/aml/edd-reviews/{id}/complete"
    description: "Complete review with decision; sets refresh_due_date on APPROVED; REJECTED cascades to account DECLINED/RESTRICTED"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "notes?"]
    output: EDDReview
    side_effects: ["status -> APPROVED or REJECTED", "refresh_due_date computed on APPROVED", "account cascade on REJECTED"]

  # --- Transactions ---
  - method: POST
    path: "/aml/accounts/{accountId}/transactions"
    description: "Post a transaction. Security types compute amount = round_half_up(quantity*unit_price, 2) and is_low_priced = unit_price < 5.00. WIRE_OUT checked against 30d velocity. Posture ELEVATED auto-flags; SEVERE blocks."
    roles: [RegisteredRep, OperationsAnalyst]
    code: 201
    input: [txn_type, "security_id?", "quantity?", "unit_price?", "amount?"]
    output: SecurityTransaction
    side_effects: ["status = POSTED (or FLAGGED when account aml_posture == ELEVATED)", "exposure_30d_amount / wire_velocity_30d_amount / exposure_tier recomputed", "increments BrokerageAccount.version by 1"]
  - method: GET
    path: "/aml/transactions"
    description: "List transactions"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "account_id?", "status?", "txn_type?"]
    output: "SecurityTransaction[]"
    side_effects: []
  - method: GET
    path: "/aml/transactions/{id}"
    description: "Get a transaction"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: SecurityTransaction
    side_effects: []
  - method: POST
    path: "/aml/transactions/{id}/reverse"
    description: "Reverse a POSTED or FLAGGED transaction (compensating action)"
    roles: [OperationsAnalyst]
    code: 200
    input: [reason]
    output: SecurityTransaction
    side_effects: ["status -> REVERSED", "exposure_30d_amount / wire_velocity_30d_amount recomputed excluding this transaction", "increments BrokerageAccount.version by 1"]
  - method: POST
    path: "/aml/transactions/{id}/clear"
    description: "Clear a FLAGGED transaction"
    roles: [AMLAnalyst]
    code: 200
    input: []
    output: SecurityTransaction
    side_effects: ["status -> CLEARED"]

  # --- Monitoring rules & scans ---
  - method: POST
    path: "/aml/monitoring-rules"
    description: "Create a transaction-monitoring rule"
    roles: [SystemAdmin]
    code: 201
    input: [rule_code, threshold_amount, window_days, "min_transaction_count?", "enabled?"]
    output: MonitoringRule
    side_effects: []
  - method: GET
    path: "/aml/monitoring-rules"
    description: "List monitoring rules"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "rule_code?", "enabled?"]
    output: "MonitoringRule[]"
    side_effects: []
  - method: GET
    path: "/aml/monitoring-rules/{id}"
    description: "Get a monitoring rule"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: MonitoringRule
    side_effects: []
  - method: PATCH
    path: "/aml/monitoring-rules/{id}"
    description: "Update a monitoring rule (enable/disable, threshold)"
    roles: [SystemAdmin]
    code: 200
    input: ["enabled?", "threshold_amount?", "window_days?", "min_transaction_count?"]
    output: MonitoringRule
    side_effects: ["increments MonitoringRule.version by 1"]
  - method: POST
    path: "/aml/monitoring-scans/run"
    description: "Ops-run: evaluate every ENABLED rule against each account's trailing window; create deduped alerts (dedup key rule_code+account_id+window_end among statuses {NEW, UNDER_REVIEW, ESCALATED_TO_CASE}); matched POSTED transactions become FLAGGED"
    roles: [AMLAnalyst]
    code: 200
    input: []
    output: { alerts_created: integer, transactions_flagged: integer }
    side_effects: ["MonitoringAlert rows created (severity frozen at creation)", "matched POSTED transactions -> FLAGGED", "open_alert_count recomputed per account"]

  # --- Alerts ---
  - method: GET
    path: "/aml/alerts"
    description: "List alerts"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "account_id?", "transaction_id?", "rule_id?", "status?"]
    output: "MonitoringAlert[]"
    side_effects: []
  - method: GET
    path: "/aml/alerts/{id}"
    description: "Get an alert"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: []
  - method: POST
    path: "/aml/alerts/{id}/begin-review"
    description: "NEW -> UNDER_REVIEW"
    roles: [AMLAnalyst]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: ["status -> UNDER_REVIEW", "open_alert_count recomputed"]
  - method: POST
    path: "/aml/alerts/{id}/close-no-action"
    description: "UNDER_REVIEW -> CLOSED_NO_ACTION"
    roles: [AMLAnalyst]
    code: 200
    input: [rationale]
    output: MonitoringAlert
    side_effects: ["status -> CLOSED_NO_ACTION", "open_alert_count recomputed"]
  - method: POST
    path: "/aml/alerts/{id}/reopen"
    description: "CLOSED_NO_ACTION -> UNDER_REVIEW"
    roles: [AMLAnalyst]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: ["status -> UNDER_REVIEW", "open_alert_count recomputed"]
  - method: POST
    path: "/aml/alerts/{id}/escalate"
    description: "UNDER_REVIEW -> ESCALATED_TO_CASE; creates AMLCase with priority from the alert's frozen severity BEFORE the escalation-triggered ONGOING recalc"
    roles: [AMLAnalyst]
    code: 201
    input: []
    output: { alert_id: string, case_id: string, case_priority: string }
    side_effects: ["alert -> ESCALATED_TO_CASE", "AMLCase created OPEN with origin_alert_id", "triggering FLAGGED transaction -> ESCALATED", "account ONGOING risk recalc AFTER priority assignment", "open_alert_count/open_case_count recomputed", "increments BrokerageAccount.version by 1"]

  # --- AML cases ---
  - method: POST
    path: "/aml/aml-cases"
    description: "Manually open a case (OCC-guarded on account version); origin_alert_id optional, must belong to same account"
    roles: [AMLAnalyst]
    code: 201
    input: [account_id, expected_account_version, "origin_alert_id?"]
    output: AMLCase
    side_effects: ["status = OPEN", "priority = MEDIUM (manual) or alert-derived", "account ONGOING risk recalc", "open_case_count recomputed", "increments BrokerageAccount.version by 1"]
  - method: GET
    path: "/aml/aml-cases"
    description: "List cases"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "account_id?", "origin_alert_id?", "status?", "priority?"]
    output: "AMLCase[]"
    side_effects: []
  - method: GET
    path: "/aml/aml-cases/{id}"
    description: "Get a case"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: AMLCase
    side_effects: []
  - method: POST
    path: "/aml/aml-cases/{id}/begin-investigation"
    description: "OPEN or REOPENED -> INVESTIGATING"
    roles: [AMLAnalyst]
    code: 200
    input: []
    output: AMLCase
    side_effects: ["status -> INVESTIGATING"]
  - method: POST
    path: "/aml/aml-cases/{id}/recommend-sar"
    description: "INVESTIGATING -> SAR_RECOMMENDED; stamps recommending_analyst_id and initial_detection_date"
    roles: [AMLAnalyst]
    code: 200
    input: [recommendation_note, initial_detection_date]
    output: AMLCase
    side_effects: ["status -> SAR_RECOMMENDED", "recommending_analyst_id = X-User-ID"]
  - method: POST
    path: "/aml/aml-cases/{id}/decide-no-file"
    description: "INVESTIGATING or SAR_RECOMMENDED -> DECIDED_NO_FILE; compensating return of origin alert to UNDER_REVIEW"
    roles: [SAROfficer]
    code: 200
    input: [rationale]
    output: AMLCase
    side_effects: ["status -> DECIDED_NO_FILE", "origin alert ESCALATED_TO_CASE -> UNDER_REVIEW", "linked ESCALATED transactions -> CLEARED", "open counts + posture recomputed"]
  - method: POST
    path: "/aml/aml-cases/{id}/close"
    description: "DECIDED_NO_FILE or DECIDED_FILED -> CLOSED (blocked by DRAFT filings)"
    roles: [SAROfficer]
    code: 200
    input: []
    output: AMLCase
    side_effects: ["status -> CLOSED", "open_case_count + posture recomputed"]
  - method: POST
    path: "/aml/aml-cases/{id}/reopen"
    description: "CLOSED -> REOPENED"
    roles: [AMLAnalyst]
    code: 200
    input: [reason]
    output: AMLCase
    side_effects: ["status -> REOPENED", "open_case_count + posture recomputed"]

  # --- SAR filings ---
  - method: POST
    path: "/aml/sar-filings"
    description: "Draft a SAR. Initial: case must be SAR_RECOMMENDED. Continuing: prior_filing_id required, prior must be FILED on SAME case, case DECIDED_FILED."
    roles: [SAROfficer]
    code: 201
    input: [case_id, narrative, activity_start, activity_end, "prior_filing_id?"]
    output: SARFiling
    side_effects: ["status = DRAFT", "filing_deadline computed per variant"]
  - method: GET
    path: "/aml/sar-filings"
    description: "List SAR filings"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "case_id?", "prior_filing_id?", "status?"]
    output: "SARFiling[]"
    side_effects: []
  - method: GET
    path: "/aml/sar-filings/{id}"
    description: "Get a SAR filing"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: SARFiling
    side_effects: []
  - method: POST
    path: "/aml/sar-filings/{id}/file"
    description: "File a DRAFT SAR (SoD vs recommending analyst); stamps filed_at, filed_late, continuing_review_due_date"
    roles: [SAROfficer]
    code: 200
    input: []
    output: SARFiling
    side_effects: ["status -> FILED", "initial: case -> DECIDED_FILED", "continuing: prior filing -> SUPERSEDED"]
  - method: POST
    path: "/aml/sar-filings/{id}/continuing-reviews"
    description: "Record continuing-activity review on a FILED filing; CONTINUING_ACTIVITY creates a linked DRAFT filing"
    roles: [SAROfficer]
    code: 200
    input: [outcome, note, "narrative?", "activity_start?", "activity_end?"]
    output: { new_draft_filing_id: string, next_review_due: string }
    side_effects: ["continuing_review_count += 1", "last_continuing_review_at stamped", "review_overdue cleared", "on CONTINUING_ACTIVITY: new DRAFT SARFiling with prior_filing_id = this filing (filing_deadline = this filed_at date + 120d)"]

  # --- FinCEN 314(a) ---
  - method: POST
    path: "/aml/fincen-314a-requests"
    description: "Register a 314(a) list; response_deadline = received date + 14 days"
    roles: [ComplianceOfficer]
    code: 201
    input: [request_reference, subjects]
    output: FinCENRequest314A
    side_effects: ["status = RECEIVED", "received_at stamped from logical clock"]
  - method: GET
    path: "/aml/fincen-314a-requests"
    description: "List 314(a) requests"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "FinCENRequest314A[]"
    side_effects: []
  - method: GET
    path: "/aml/fincen-314a-requests/{id}"
    description: "Get a 314(a) request"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: FinCENRequest314A
    side_effects: []
  - method: POST
    path: "/aml/fincen-314a-requests/{id}/scan"
    description: "Run deterministic subject matching; creates Match314A rows"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FinCENRequest314A
    side_effects: ["status -> SCAN_COMPLETE", "Match314A rows created", "match_count recomputed"]
  - method: POST
    path: "/aml/fincen-314a-requests/{id}/submit-response"
    description: "Submit 314(a) response; requires all matches resolved"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FinCENRequest314A
    side_effects: ["status -> RESPONSE_SUBMITTED", "responded_at stamped", "responded_late computed"]
  - method: GET
    path: "/aml/fincen-314a-matches"
    description: "List 314(a) matches"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "request_id?", "account_id?", "status?"]
    output: "Match314A[]"
    side_effects: []
  - method: GET
    path: "/aml/fincen-314a-matches/{id}"
    description: "Get a 314(a) match"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: Match314A
    side_effects: []
  - method: POST
    path: "/aml/fincen-314a-matches/{id}/confirm"
    description: "Confirm a match; triggers the depth-4 restriction cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Match314A
    side_effects: ["status -> CONFIRMED", "account RESTRICTED + posture SEVERE", "POSTED transactions -> FLAGGED", "alerts created per flagged transaction", "ONGOING risk recalc"]
  - method: POST
    path: "/aml/fincen-314a-matches/{id}/mark-false-positive"
    description: "Mark a match false positive"
    roles: [ComplianceOfficer]
    code: 200
    input: [rationale]
    output: Match314A
    side_effects: ["status -> FALSE_POSITIVE"]
  - method: POST
    path: "/aml/fincen-314a-matches/{id}/resolve"
    description: "Resolve a CONFIRMED match after response actions; recomputes posture"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Match314A
    side_effects: ["status -> RESOLVED", "aml_posture recomputed"]

  # --- Physical certificate deposits ---
  - method: POST
    path: "/aml/accounts/{accountId}/certificate-deposits"
    description: "Intake a physical certificate; creates linked DEPOSIT_CERT transaction (FLAGGED); lost/stolen and duplicate checks"
    roles: [OperationsAnalyst]
    code: 201
    input: [certificate_number, cusip, security_name, quantity, unit_price, "has_restrictive_legend?"]
    output: PhysicalCertificateDeposit
    side_effects: ["status = RECEIVED", "linked SecurityTransaction DEPOSIT_CERT created FLAGGED", "is_low_priced computed", "exposure recomputed"]
  - method: GET
    path: "/aml/certificate-deposits"
    description: "List certificate deposits"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "account_id?", "transaction_id?", "status?"]
    output: "PhysicalCertificateDeposit[]"
    side_effects: []
  - method: GET
    path: "/aml/certificate-deposits/{id}"
    description: "Get a certificate deposit"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: PhysicalCertificateDeposit
    side_effects: []
  - method: POST
    path: "/aml/certificate-deposits/{id}/advance"
    description: "Advance review pipeline: RECEIVED->ELIGIBILITY_REVIEW->AUTHENTICITY_REVIEW->CLEARANCE_HOLD; RESUBMITTED->AUTHENTICITY_REVIEW; lost/stolen re-checked entering AUTHENTICITY_REVIEW"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: PhysicalCertificateDeposit
    side_effects: ["status advanced one step", "hold_release_date set when entering CLEARANCE_HOLD"]
  - method: POST
    path: "/aml/certificate-deposits/{id}/supplement"
    description: "Attach supplemental review information; no state change; bumps deposit version (OCC interplay)"
    roles: [OperationsAnalyst]
    code: 200
    input: [note]
    output: PhysicalCertificateDeposit
    side_effects: ["increments PhysicalCertificateDeposit.version by 1"]
  - method: POST
    path: "/aml/certificate-deposits/{id}/decision"
    description: "Decide a READY_TO_ACCEPT deposit (OCC-guarded): ACCEPT -> txn CLEARED; REJECT -> txn REVERSED; REJECT_SUSPICIOUS -> txn REVERSED + suspicion cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_deposit_version, outcome, "reason?"]
    output: PhysicalCertificateDeposit
    side_effects: ["status -> ACCEPTED | REJECTED | REJECTED_SUSPICIOUS", "linked transaction CLEARED or REVERSED", "REJECT_SUSPICIOUS: has_suspicion_flag = true, posture recompute, CERT_SUSPICION alert created", "increments PhysicalCertificateDeposit.version by 1"]
  - method: POST
    path: "/aml/certificate-deposits/{id}/resubmit"
    description: "REJECTED -> RESUBMITTED (cycle back into authenticity review)"
    roles: [OperationsAnalyst]
    code: 200
    input: [note]
    output: PhysicalCertificateDeposit
    side_effects: ["status -> RESUBMITTED"]

  # --- Lost/stolen certificate registry ---
  - method: POST
    path: "/aml/lost-stolen-certificates"
    description: "Report a lost/stolen certificate"
    roles: [SystemAdmin]
    code: 201
    input: [certificate_number, cusip]
    output: LostStolenCertificateEntry
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/aml/lost-stolen-certificates"
    description: "List lost/stolen registry entries"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "certificate_number?", "status?"]
    output: "LostStolenCertificateEntry[]"
    side_effects: []
  - method: GET
    path: "/aml/lost-stolen-certificates/{id}"
    description: "Get a registry entry"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: LostStolenCertificateEntry
    side_effects: []

  # --- Independent testing & audit ---
  - method: POST
    path: "/aml/audit-engagements"
    description: "Plan an audit engagement; closed-interval overlap check per scope_unit"
    roles: [IndependentAuditor]
    code: 201
    input: [scope_unit, start_date, end_date]
    output: AuditEngagement
    side_effects: ["status = PLANNED", "lead_auditor_id = X-User-ID"]
  - method: GET
    path: "/aml/audit-engagements"
    description: "List audit engagements"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "status?", "scope_unit?"]
    output: "AuditEngagement[]"
    side_effects: []
  - method: GET
    path: "/aml/audit-engagements/{id}"
    description: "Get an audit engagement"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []
  - method: POST
    path: "/aml/audit-engagements/{id}/begin-fieldwork"
    description: "PLANNED -> FIELDWORK"
    roles: [IndependentAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status -> FIELDWORK"]
  - method: POST
    path: "/aml/audit-engagements/{id}/issue-report"
    description: "FIELDWORK -> REPORTED"
    roles: [IndependentAuditor]
    code: 200
    input: [report_summary]
    output: AuditEngagement
    side_effects: ["status -> REPORTED"]
  - method: POST
    path: "/aml/audit-engagements/{id}/close"
    description: "REPORTED -> CLOSED; requires all findings terminal"
    roles: [IndependentAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/aml/audit-engagements/{engagementId}/findings"
    description: "Record a finding (engagement must be FIELDWORK or REPORTED)"
    roles: [IndependentAuditor]
    code: 201
    input: [severity, description]
    output: AuditFinding
    side_effects: ["status = OPEN", "remediation_deadline computed from severity"]
  - method: GET
    path: "/aml/audit-findings"
    description: "List audit findings"
    roles: *ROLES_ALL
    code: 200
    input: ["limit?", "offset?", "engagement_id?", "status?", "severity?"]
    output: "AuditFinding[]"
    side_effects: []
  - method: GET
    path: "/aml/audit-findings/{id}"
    description: "Get an audit finding"
    roles: *ROLES_ALL
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: POST
    path: "/aml/audit-findings/{id}/submit-remediation"
    description: "OPEN -> REMEDIATION_SUBMITTED"
    roles: [ComplianceOfficer]
    code: 200
    input: [remediation_note]
    output: AuditFinding
    side_effects: ["status -> REMEDIATION_SUBMITTED", "submitted_by = X-User-ID"]
  - method: POST
    path: "/aml/audit-findings/{id}/verify-remediation"
    description: "REMEDIATION_SUBMITTED -> REMEDIATED (CONFIRM) or -> OPEN (REJECT); SoD vs submitted_by"
    roles: [IndependentAuditor]
    code: 200
    input: [decision]
    output: AuditFinding
    side_effects: ["status -> REMEDIATED or OPEN", "verified_by = X-User-ID"]
  - method: POST
    path: "/aml/audit-findings/{id}/accept-risk"
    description: "OPEN -> ACCEPTED_RISK; LOW/MEDIUM severity only"
    roles: [IndependentAuditor]
    code: 200
    input: [rationale]
    output: AuditFinding
    side_effects: ["status -> ACCEPTED_RISK"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: SAR filer equals recommending analyst, or finding verifier equals remediation submitter" }
  # --- Generic input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, malformed body, limit/offset out of bounds" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value outside its declared set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "period_start >= period_end, start_date > end_date, or activity_start > activity_end" }
  # --- Not found ---
  - { id: ERR_REP_NOT_FOUND, http: 404, condition: "RegisteredRep id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "BrokerageAccount id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "IdentificationDocument id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "BeneficialOwnershipCertification id does not exist" }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "BeneficialOwner id does not exist" }
  - { id: ERR_EDD_REVIEW_NOT_FOUND, http: 404, condition: "EDDReview id does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "SecurityTransaction id does not exist" }
  - { id: ERR_RULE_NOT_FOUND, http: 404, condition: "MonitoringRule id does not exist" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "MonitoringAlert id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "AMLCase id does not exist" }
  - { id: ERR_SAR_FILING_NOT_FOUND, http: 404, condition: "SARFiling id does not exist" }
  - { id: ERR_FINCEN_REQUEST_NOT_FOUND, http: 404, condition: "FinCENRequest314A id does not exist" }
  - { id: ERR_MATCH_NOT_FOUND, http: 404, condition: "Match314A id does not exist" }
  - { id: ERR_DEPOSIT_NOT_FOUND, http: 404, condition: "PhysicalCertificateDeposit id does not exist" }
  - { id: ERR_LOST_STOLEN_ENTRY_NOT_FOUND, http: 404, condition: "LostStolenCertificateEntry id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "AuditEngagement id does not exist" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "AuditFinding id does not exist" }
  # --- Account lifecycle & posture ---
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 409, condition: "Transaction posted against account not in OPEN lifecycle_status" }
  - { id: ERR_ACCOUNT_RESTRICTED, http: 409, condition: "Account is RESTRICTED; new transactions and deposits blocked" }
  - { id: ERR_ACCOUNT_CLOSED_TERMINAL, http: 409, condition: "Account is CLOSED or DECLINED; no further transitions" }
  - { id: ERR_INVALID_LIFECYCLE_TRANSITION, http: 409, condition: "Requested transition not valid from current lifecycle_status (or rep status)" }
  - { id: ERR_POSTURE_SEVERE_BLOCKS, http: 403, condition: "Account aml_posture SEVERE blocks all transaction posting and certificate intake" }
  - { id: ERR_ACCOUNT_CLOSE_BLOCKED, http: 409, condition: "Close blocked by open cases, unresolved matches, non-terminal deposits, or FLAGGED/ESCALATED transactions" }
  - { id: ERR_MATCH_314A_UNRESOLVED, http: 409, condition: "Reinstate blocked: CONFIRMED 314(a) match unresolved" }
  - { id: ERR_CRITICAL_CASE_OPEN, http: 409, condition: "Reinstate blocked: open case with priority CRITICAL" }
  # --- CIP / beneficial ownership ---
  - { id: ERR_REP_SUSPENDED, http: 409, condition: "Suspended rep cannot create customers, accounts, documents, or certifications" }
  - { id: ERR_DOCUMENT_NOT_VERIFIABLE, http: 409, condition: "Document not in SUBMITTED" }
  - { id: ERR_DOCUMENT_NOT_REJECTABLE, http: 409, condition: "Document not in SUBMITTED" }
  - { id: ERR_CIP_INCOMPLETE, http: 409, condition: "Approval blocked: required VERIFIED identification documents missing for customer type" }
  - { id: ERR_CERTIFICATION_REQUIRES_LEGAL_ENTITY, http: 400, condition: "Beneficial ownership certification only for LEGAL_ENTITY customers" }
  - { id: ERR_CERTIFICATION_NOT_DRAFT, http: 409, condition: "Owners can only be added while certification is DRAFT; certify requires DRAFT" }
  - { id: ERR_BENEFICIAL_OWNERSHIP_REQUIRED, http: 422, condition: "LEGAL_ENTITY account approval requires a CERTIFIED beneficial ownership certification" }
  - { id: ERR_EXCESSIVE_OWNERSHIP_TOTAL, http: 422, condition: "total_ownership_pct exceeds 100.0" }
  - { id: ERR_OWNER_KYC_REQUIRED, http: 422, condition: "Owner with ownership_pct >= 25.00 lacks tax_id/date_of_birth/address, or no covered owner and no attestation" }
  - { id: ERR_CONTROL_PERSON_REQUIRED, http: 422, condition: "No BeneficialOwner with is_control_person == true" }
  # --- Risk / EDD ---
  - { id: ERR_PROHIBITED_TIER, http: 403, condition: "PROHIBITED-tier account can never be approved" }
  - { id: ERR_EDD_APPROVAL_REQUIRED, http: 409, condition: "HIGH-tier account approval requires an APPROVED EDDReview" }
  - { id: ERR_EDD_REVIEW_NOT_ACTIONABLE, http: 409, condition: "EDD review not in required state for begin/complete" }
  - { id: ERR_OVERLAPPING_EDD_REVIEW, http: 409, condition: "Half-open review period overlaps an existing non-REJECTED review for the account" }
  # --- Transactions / monitoring ---
  - { id: ERR_TRANSACTION_NOT_REVERSIBLE, http: 409, condition: "Transaction not in POSTED or FLAGGED" }
  - { id: ERR_TRANSACTION_NOT_CLEARABLE, http: 409, condition: "Transaction not in FLAGGED" }
  - { id: ERR_VELOCITY_LIMIT_EXCEEDED, http: 422, condition: "Projected 30d WIRE_OUT total strictly greater than tier limit" }
  - { id: ERR_RULE_DISABLED, http: 409, condition: "Monitoring rule disabled" }
  - { id: ERR_ALERT_NOT_ACTIONABLE, http: 409, condition: "Alert not in required state for begin-review/close/reopen/escalate" }
  - { id: ERR_ALERT_ACCOUNT_MISMATCH, http: 400, condition: "origin_alert_id belongs to a different account" }
  # --- Cases / SAR ---
  - { id: ERR_CASE_NOT_ACTIONABLE, http: 409, condition: "Case not in required state for the requested transition" }
  - { id: ERR_CASE_NOT_SAR_RECOMMENDED, http: 409, condition: "Initial SAR draft requires case SAR_RECOMMENDED" }
  - { id: ERR_CASE_HAS_OPEN_FILING, http: 409, condition: "Case close blocked by DRAFT SAR filing" }
  - { id: ERR_SAR_NOT_FILABLE, http: 409, condition: "SAR filing not in DRAFT" }
  - { id: ERR_PRIOR_FILING_CASE_MISMATCH, http: 400, condition: "prior_filing_id references another case's filing or a non-FILED filing" }
  # --- 314(a) ---
  - { id: ERR_FINCEN_REQUEST_NOT_SCANNABLE, http: 409, condition: "Request not in required state for scan/submit-response" }
  - { id: ERR_MATCH_NOT_REVIEWABLE, http: 409, condition: "Match not in required state for confirm/false-positive/resolve" }
  - { id: ERR_FINCEN_RESPONSE_INCOMPLETE, http: 409, condition: "314(a) response requires all matches FALSE_POSITIVE or RESOLVED" }
  - { id: ERR_DUPLICATE_314A_REQUEST, http: 409, condition: "request_reference already registered" }
  # --- Certificates ---
  - { id: ERR_CERT_REPORTED_LOST_STOLEN, http: 403, condition: "Certificate number on ACTIVE lost/stolen registry" }
  - { id: ERR_DUPLICATE_CERTIFICATE_NUMBER, http: 409, condition: "Certificate number already used by a non-rejected deposit or ACTIVE registry entry" }
  - { id: ERR_DEPOSIT_NOT_ADVANCEABLE, http: 409, condition: "Deposit not in a state from which advance is defined" }
  - { id: ERR_DEPOSIT_NOT_DECIDABLE, http: 409, condition: "Deposit not in READY_TO_ACCEPT" }
  - { id: ERR_DEPOSIT_NOT_RESUBMITTABLE, http: 409, condition: "Deposit not in REJECTED" }
  # --- Audit ---
  - { id: ERR_OVERLAPPING_AUDIT_ENGAGEMENT, http: 409, condition: "Closed-interval engagement window overlaps another non-CLOSED engagement of the same scope_unit" }
  - { id: ERR_ENGAGEMENT_NOT_ACTIVE, http: 409, condition: "Engagement not in required state for the requested transition" }
  - { id: ERR_ENGAGEMENT_HAS_OPEN_FINDINGS, http: 409, condition: "Close blocked: findings not all REMEDIATED or ACCEPTED_RISK" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "Finding not in OPEN" }
  - { id: ERR_FINDING_NOT_SUBMITTED, http: 409, condition: "Finding not in REMEDIATION_SUBMITTED" }
  - { id: ERR_RISK_ACCEPTANCE_NOT_ALLOWED, http: 409, condition: "Only LOW/MEDIUM severity findings may be risk-accepted" }
  # --- Concurrency / misc ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_DUPLICATE_CRD_NUMBER, http: 409, condition: "crd_number already registered" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegisteredRep
    description: "Registered representative; opens customers/accounts, submits CIP documents and beneficial ownership data"
    identity: "entity_backed:RegisteredRep"
    exclusive_operations:
      - "POST /aml/customers"
      - "POST /aml/accounts"
      - "POST /aml/customers/{id}/identification-documents"
      - "POST /aml/customers/{id}/beneficial-ownership-certifications"
      - "POST /aml/beneficial-ownership-certifications/{id}/owners"
    shared_operations:
      - "POST /aml/accounts/{id}/transactions (shared with OperationsAnalyst)"
      - "All GET endpoints (shared with all roles)"
  - name: AMLAnalyst
    description: "AML unit analyst; verifies CIP documents, runs scans, triages alerts, opens/investigates cases, conducts EDD reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /aml/identification-documents/{id}/verify and /reject"
      - "POST /aml/monitoring-scans/run"
      - "POST /aml/alerts/{id}/begin-review, /close-no-action, /reopen, /escalate"
      - "POST /aml/aml-cases and case /begin-investigation, /recommend-sar, /reopen"
      - "POST /aml/accounts/{id}/edd-reviews and /aml/edd-reviews/{id}/begin"
      - "POST /aml/transactions/{id}/clear"
    shared_operations:
      - "POST /aml/accounts/{id}/risk-recalculations (shared with ComplianceOfficer)"
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "AML compliance officer; approves/declines/restricts/reinstates/closes accounts, certifies beneficial ownership, completes EDD reviews, manages 314(a) responses, decides certificate deposits, submits finding remediations"
    identity: "opaque"
    exclusive_operations:
      - "POST /aml/accounts/{id}/approve, /decline, /restrict, /reinstate, /close"
      - "POST /aml/beneficial-ownership-certifications/{id}/certify"
      - "POST /aml/edd-reviews/{id}/complete"
      - "POST /aml/fincen-314a-requests, /scan, /submit-response and match /confirm, /mark-false-positive, /resolve"
      - "POST /aml/certificate-deposits/{id}/decision"
      - "POST /aml/audit-findings/{id}/submit-remediation"
    shared_operations:
      - "POST /aml/accounts/{id}/risk-recalculations (shared with AMLAnalyst)"
      - "All GET endpoints"
  - name: SAROfficer
    description: "SAR filing officer; decides no-file, drafts/files SARs, runs continuing reviews — segregated from investigating analysts"
    identity: "opaque"
    exclusive_operations:
      - "POST /aml/aml-cases/{id}/decide-no-file, /close"
      - "POST /aml/sar-filings and /aml/sar-filings/{id}/file, /continuing-reviews"
    shared_operations:
      - "All GET endpoints"
  - name: OperationsAnalyst
    description: "Operations analyst; posts/reverses transactions, intakes and advances physical certificate deposits, supplements review files"
    identity: "opaque"
    exclusive_operations:
      - "POST /aml/transactions/{id}/reverse"
      - "POST /aml/accounts/{id}/certificate-deposits"
      - "POST /aml/certificate-deposits/{id}/advance, /supplement, /resubmit"
    shared_operations:
      - "POST /aml/accounts/{id}/transactions (shared with RegisteredRep)"
      - "All GET endpoints"
  - name: IndependentAuditor
    description: "Independent tester; plans and runs audit engagements, records/verifies findings — no operational mutations"
    identity: "opaque"
    exclusive_operations:
      - "POST /aml/audit-engagements and /begin-fieldwork, /issue-report, /close"
      - "POST /aml/audit-engagements/{id}/findings"
      - "POST /aml/audit-findings/{id}/verify-remediation, /accept-risk"
    shared_operations:
      - "All GET endpoints"
  - name: SystemAdmin
    description: "Platform administrator; manages reps, monitoring rules, lost/stolen registry, logical clock, and the daily sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /aml/reps, /aml/reps/{id}/suspend, /reinstate"
      - "POST /aml/monitoring-rules and PATCH /aml/monitoring-rules/{id}"
      - "POST /aml/lost-stolen-certificates"
      - "POST /aml/_clock/set_current_utc"
      - "POST /aml/maintenance/run-daily-sweep"
    shared_operations:
      - "All GET endpoints"
