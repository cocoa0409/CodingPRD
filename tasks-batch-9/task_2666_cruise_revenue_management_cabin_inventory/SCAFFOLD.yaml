scenario: |
  Generate task harder than expert level!

  2666. Cruise Revenue Management & Cabin Inventory (cruise line revenue management): sailing-level inventory by cabin category with upgrade hierarchy and guarantee-category oversell strategy, pricing by booking window with promotional cadence, group allocations and repeat-guest offers, occupancy optimization balancing third and fourth berth utilization against onboard revenue expectations, deposit, final payment and cancellation penalty schedules affecting inventory release timing, group block management with tentative holds, review dates and release policy, upsell and upgrade bidding programs close to sailing, itinerary change and port cancellation compensation policy, revenue per available lower berth day and onboard spend modeling in pricing decisions

domain_name: cruise-revenue-cabin-inventory
api_prefix: ""   # flat top-level collections: /sailings, /cabin-categories, /sailing-inventories, /fare-rules, /promotions, /group-blocks, /guests, /bookings, /upgrade-bids, /itinerary-changes

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer collections joined by explicit foreign keys; no nesting in URL paths except
  # append-only sub-resources (payment-events) and action endpoints. CabinCategory is
  # self-referential (upgrade_to_category_id) forming the upgrade hierarchy chain.

  state_machine_shape: parallel
  # Booking carries two independent state dimensions (booking_status x payment_status)
  # that evolve separately and cross-gate each other; Sailing is cyclic
  # (OPEN_FOR_SALE <-> SALES_SUSPENDED, bounded by suspension_count); UpgradeBid is
  # cyclic (SUBMITTED <-> COUNTERED, bounded by counter_rounds); GroupBlock branches
  # (TENTATIVE -> {DEFINITE, PARTIALLY_RELEASED, RELEASED, TENTATIVE self-loop}).

  relationship_patterns:
    - one_to_many          # Sailing -> SailingInventory / FareRule / Promotion / GroupBlock / Booking
    - self_referential     # CabinCategory.upgrade_to_category_id -> CabinCategory.id (upgrade hierarchy)
    - cross_aggregate      # Booking -> GroupBlock, UpgradeBid -> SailingInventory of target category
    - polymorphic: false

  role_model: segregation_of_duties
  # Peer operator roles (RevenueManager / ReservationAgent / GroupSalesAgent /
  # PortOpsCoordinator) plus an entity_backed Guest. Four-eyes rule: the
  # GroupSalesAgent operator id that created a GroupBlock may not be the operator id
  # that signs it DEFINITE.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Sailing
    parent: null
    common_fields: true
    fields:
      - name: ship_code
        type: string
        source: input
        description: Vessel identifier the voyage operates on.
        constraints: 1..32 chars, non-empty
      - name: voyage_code
        type: string
        source: input
        description: Business key of the voyage.
        constraints: unique across all Sailing rows; 1..32 chars
      - name: embark_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the voyage departs; the anchor for every days_to_sail computation.
      - name: nights
        type: integer
        source: input
        description: Voyage length in nights; multiplier for available lower berth days and onboard spend.
        constraints: ">= 1"
      - name: total_lower_berths
        type: integer
        source: input
        description: Sellable lower berths the revenue manager books against; denominator of occupancy_pct and of available lower berth days.
        constraints: ">= 2"
      - name: final_payment_days_before
        type: integer
        source: input
        default: 75
        description: Days before embark_date when full payment is due.
        constraints: ">= 1"
      - name: deposit_due_days_after_booking
        type: integer
        source: input
        default: 7
        description: Days after booking creation when the deposit is due.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Sales lifecycle state.
        constraints: "PLANNED | OPEN_FOR_SALE | SALES_SUSPENDED | INVENTORY_CLOSED | SAILED"
      - name: suspension_count
        type: integer
        source: computed
        default: 0
        description: Number of completed suspend-sales transitions; bounds the OPEN_FOR_SALE <-> SALES_SUSPENDED cycle at MAX_SALES_SUSPENSIONS.
      - name: suspension_reason
        type: string
        source: system
        default: null
        description: Reason captured by the most recent suspend-sales call; cleared to null on resume-sales.
      - name: inventory_posture
        type: enum
        source: computed
        default: OPEN
        description: Occupancy-derived gate over child operations; recomputed by calc sailing_occupancy_posture.
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: lower_berths_sold
        type: integer
        source: computed
        default: 0
        description: Sum of occupancy_adults over Bookings of this sailing with booking_status IN {OPTION, CONFIRMED, SAILED}.
      - name: third_berths_sold
        type: integer
        source: computed
        default: 0
        description: Sum of third_berth_guests over the same Booking set as lower_berths_sold.
      - name: fourth_berths_sold
        type: integer
        source: computed
        default: 0
        description: Sum of fourth_berth_guests over the same Booking set as lower_berths_sold.
      - name: occupancy_pct
        type: number
        source: computed
        default: 0.0
        description: lower_berths_sold / total_lower_berths * 100, round_half_up to 2 decimals.
      - name: gross_ticket_revenue_cents
        type: integer
        source: computed
        default: 0
        description: Sum of net_ticket_cents + upgrade_charge_cents over Bookings with booking_status IN {OPTION, CONFIRMED, SAILED}.
      - name: projected_onboard_revenue_cents
        type: integer
        source: computed
        default: 0
        description: Sum of projected_onboard_net_cents over the same Booking set as gross_ticket_revenue_cents.
      - name: compensation_liability_cents
        type: integer
        source: computed
        default: 0
        description: Sum of itinerary_compensation_obc_cents + itinerary_refund_cents over the same Booking set.
      - name: available_lower_berth_days_gross
        type: integer
        source: computed
        default: 0
        description: total_lower_berths * nights.
      - name: available_lower_berth_days_net
        type: integer
        source: computed
        default: 0
        description: max(1, total_lower_berths - held_lower_berths) * nights, where held_lower_berths is the group-held berth count from calc sailing_ralbd.
      - name: ralbd_gross_cents
        type: integer
        source: computed
        default: 0
        description: Revenue per available lower berth day on the GROSS_CAPACITY_BASIS variant of calc sailing_ralbd.
      - name: ralbd_net_cents
        type: integer
        source: computed
        default: 0
        description: Revenue per available lower berth day on the NET_CAPACITY_BASIS variant of calc sailing_ralbd.
      - name: revenue_alert
        type: boolean
        source: computed
        default: false
        description: True when ralbd_net_cents < RALBD_ALERT_FLOOR_CENTS; recomputed on every ralbd recomputation.
      - name: confirmed_bookings_count
        type: integer
        source: computed
        default: 0
        description: Count of Bookings of this sailing with booking_status == CONFIRMED.
      - name: paid_in_full_bookings_count
        type: integer
        source: computed
        default: 0
        description: Count of Bookings of this sailing with payment_status == PAID_IN_FULL and booking_status IN {OPTION, CONFIRMED, SAILED}.
      - name: final_payment_risk_flag
        type: boolean
        source: computed
        default: false
        description: True when confirmed_bookings_count > 0 AND paid_in_full_bookings_count * 2 < confirmed_bookings_count, i.e. fewer than half of the confirmed bookings have paid in full; recomputed by calc sailing_occupancy_posture.

  - name: CabinCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Category code (e.g. IZ, IA, OV, BA).
        constraints: unique across all CabinCategory rows; 1..8 chars
      - name: tier_rank
        type: integer
        source: input
        description: Position in the upgrade hierarchy; higher rank is a richer category.
        constraints: ">= 1; unique across all CabinCategory rows"
      - name: is_guarantee
        type: boolean
        source: input
        default: false
        description: True for guarantee (GTY) categories, the only categories whose SailingInventory may carry a non-zero oversell_allowance.
      - name: lower_berths
        type: integer
        source: input
        default: 2
        description: Lower berths per physical cabin of this category.
        constraints: "1 or 2"
      - name: max_occupancy
        type: integer
        source: input
        description: Regulatory berth capacity per cabin (lifeboat/berth limit) enforced by validation priority 12.
        constraints: "2 <= max_occupancy <= 4"
      - name: onboard_spend_lower_per_night_cents
        type: integer
        source: input
        description: Modelled onboard spend per lower-berth guest per night for this category.
        constraints: ">= 0"
      - name: onboard_spend_upper_per_night_cents
        type: integer
        source: input
        description: Modelled onboard spend per third/fourth-berth guest per night for this category.
        constraints: ">= 0"
      - name: upgrade_to_category_id
        type: string
        source: input
        default: null
        description: "FK -> CabinCategory.id; self-referential next step in the upgrade hierarchy, null at the top of the chain. Target must have a strictly greater tier_rank."
      - name: upgrade_chain_length
        type: integer
        source: computed
        default: 0
        description: Number of categories strictly above this one reachable by following upgrade_to_category_id transitively; 0 at the top of the chain.

  - name: SailingInventory
    parent: null
    common_fields: true
    fields:
      - name: sailing_id
        type: string
        source: input
        description: "FK -> Sailing.id; the sailing this allotment belongs to."
      - name: cabin_category_id
        type: string
        source: input
        description: "FK -> CabinCategory.id; the category this allotment prices and counts."
      - name: physical_cabins
        type: integer
        source: input
        description: Physical cabins of this category on this sailing.
        constraints: ">= 1"
      - name: oversell_allowance
        type: integer
        source: input
        default: 0
        description: Cabins the revenue manager is willing to oversell above physical_cabins; must be 0 unless the category has is_guarantee == true.
        constraints: ">= 0"
      - name: effective_oversell_cabins
        type: integer
        source: computed
        default: 0
        description: Oversell headroom actually usable right now, per calc oversell_availability.
      - name: group_held_cabins
        type: integer
        source: computed
        default: 0
        description: Sum of cabins_held over GroupBlocks of this (sailing, category) with status IN {TENTATIVE, DEFINITE, PARTIALLY_RELEASED}.
      - name: booked_cabins
        type: integer
        source: computed
        default: 0
        description: Count of Bookings currently occupying a cabin of this (sailing, category) - see calc oversell_availability for the exact filter.
      - name: waitlisted_bookings_count
        type: integer
        source: computed
        default: 0
        description: Count of Bookings of this (sailing, category) with booking_status == WAITLISTED.
      - name: available_cabins
        type: integer
        source: computed
        default: 0
        description: physical_cabins + effective_oversell_cabins - booked_cabins - group_held_cabins.
      - name: released_cabins_total
        type: integer
        source: computed
        default: 0
        description: Cumulative cabins returned to this allotment by group review releases; audit counter, never decremented.

  - name: FareRule
    parent: null
    common_fields: true
    fields:
      - name: sailing_id
        type: string
        source: input
        description: "FK -> Sailing.id; the sailing this booking-window price applies to."
      - name: cabin_category_id
        type: string
        source: input
        description: "FK -> CabinCategory.id; the category this booking-window price applies to."
      - name: window_open_days_to_sail
        type: integer
        source: input
        description: Exclusive upper bound of the booking window in days_to_sail.
        constraints: "> window_close_days_to_sail; <= 730"
      - name: window_close_days_to_sail
        type: integer
        source: input
        description: Inclusive lower bound of the booking window in days_to_sail. The window is the half-open interval [window_close_days_to_sail, window_open_days_to_sail).
        constraints: ">= 0"
      - name: base_lower_berth_fare_cents
        type: integer
        source: input
        description: Fare per lower-berth guest in this window.
        constraints: ">= 1"
      - name: third_berth_fare_cents
        type: integer
        source: input
        description: Fare for a third-berth guest in this window, before the berth discount tier.
        constraints: ">= 0"
      - name: fourth_berth_fare_cents
        type: integer
        source: input
        description: Fare for a fourth-berth guest in this window, before the berth discount tier.
        constraints: ">= 0"
      - name: bookings_pinned_count
        type: integer
        source: computed
        default: 0
        description: Count of Bookings whose fare_rule_id pins this rule; never decremented (pinned fares survive booking cancellation).

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - name: sailing_id
        type: string
        source: input
        description: "FK -> Sailing.id; promotions are scoped to one sailing and compete for cadence spacing on it."
      - name: code
        type: string
        source: input
        description: Promotion code quoted on bookings.
        constraints: unique per sailing_id; 1..24 chars
      - name: audience
        type: enum
        source: input
        description: Who may redeem this promotion.
        constraints: "GENERAL | REPEAT_GUEST | GROUP"
      - name: discount_pct
        type: number
        source: input
        description: Fraction taken off each fare component, applied per component then summed.
        constraints: "0 < discount_pct <= 0.5"
      - name: starts_on
        type: datetime
        source: input
        description: Inclusive start of the promotion's closed campaign interval.
      - name: ends_on
        type: datetime
        source: input
        description: Inclusive end of the promotion's closed campaign interval.
        constraints: ">= starts_on"
      - name: max_redemptions
        type: integer
        source: input
        description: Redemption cap for this promotion.
        constraints: ">= 1"
      - name: redemption_count
        type: integer
        source: computed
        default: 0
        description: Count of Bookings quoting this promotion with booking_status != CANCELLED; decremented when such a booking is cancelled.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Campaign lifecycle state.
        constraints: "SCHEDULED | ACTIVE | EXHAUSTED | EXPIRED | WITHDRAWN"
      - name: withdraw_reason
        type: string
        source: system
        default: null
        description: Reason captured by the withdraw transition.

  - name: GroupBlock
    parent: null
    common_fields: true
    fields:
      - name: sailing_id
        type: string
        source: input
        description: "FK -> Sailing.id; the sailing whose inventory the block holds."
      - name: cabin_category_id
        type: string
        source: input
        description: "FK -> CabinCategory.id; the category whose allotment the block holds."
      - name: agency_name
        type: string
        source: input
        description: Booking agency or organiser holding the block.
        constraints: 1..64 chars
      - name: cabins_held
        type: integer
        source: input
        description: Cabins currently held off inventory by this block; reduced by review releases.
        constraints: ">= 1 at creation"
      - name: picked_up_cabins
        type: integer
        source: computed
        default: 0
        description: Count of Bookings whose group_block_id is this block and whose booking_status IN {OPTION, CONFIRMED, SAILED}.
      - name: review_date
        type: datetime
        source: input
        description: Instant from which the release policy may be applied.
      - name: release_policy
        type: enum
        source: input
        description: What the review does with unpicked cabins.
        constraints: "FULL_RELEASE | ATTRITION_50"
      - name: status
        type: enum
        source: system
        default: TENTATIVE
        description: Block lifecycle state.
        constraints: "TENTATIVE | DEFINITE | PARTIALLY_RELEASED | RELEASED"
      - name: review_count
        type: integer
        source: computed
        default: 0
        description: Number of review transitions applied to this block, including zero-release self-loops.
      - name: review_extension_count
        type: integer
        source: computed
        default: 0
        description: Number of extend-review transitions applied; bounded by MAX_REVIEW_EXTENSIONS.
      - name: released_cabins_total
        type: integer
        source: computed
        default: 0
        description: Cumulative cabins this block has returned to inventory across all reviews.
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the GroupSalesAgent operator that created the block; the segregation-of-duties comparand.
      - name: confirmed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the GroupSalesAgent operator that signed the block DEFINITE.
      - name: contract_reference
        type: string
        source: system
        default: null
        description: Signed contract reference captured by the confirm-definite transition.

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Guest name.
        constraints: 1..96 chars
      - name: email
        type: string
        source: input
        description: Guest email, the login identity.
        constraints: unique across all Guest rows
      - name: prior_sailings_count
        type: integer
        source: input
        default: 0
        description: Completed sailings credited to this guest before joining the system; incremented by the sail-off cascade.
        constraints: ">= 0"
      - name: loyalty_tier
        type: enum
        source: computed
        default: NONE
        description: Tier derived from prior_sailings_count by calc guest_loyalty_tier.
        constraints: "NONE | MEMBER | GOLD | PLATINUM"
      - name: repeat_guest_offer_pct
        type: number
        source: computed
        default: 0.0
        description: Automatic repeat-guest offer fraction implied by loyalty_tier, per constant LOYALTY_OFFER_PCT.
      - name: bookings_count
        type: integer
        source: computed
        default: 0
        description: Count of Bookings of this guest with booking_status != CANCELLED.

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: sailing_id
        type: string
        source: input
        description: "FK -> Sailing.id; the sailing booked."
      - name: cabin_category_id
        type: string
        source: input
        description: "FK -> CabinCategory.id; the category booked (a guarantee category when the guest buys GTY)."
      - name: assigned_cabin_category_id
        type: string
        source: computed
        default: null
        description: "FK -> CabinCategory.id; the category the cabin is actually taken from after guarantee assignment or upgrade award; null until then."
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the lead guest, and the Guest identity permitted to act on this booking."
      - name: group_block_id
        type: string
        source: input
        default: null
        description: "FK -> GroupBlock.id; set when the booking picks up a cabin from a group block."
      - name: promotion_id
        type: string
        source: input
        default: null
        description: "FK -> Promotion.id; the promotion quoted at creation."
      - name: fare_rule_id
        type: string
        source: computed
        description: "FK -> FareRule.id; the booking-window rule selected at creation and pinned for the life of the booking."
      - name: pinned_fare_rule_version
        type: integer
        source: computed
        description: FareRule.version observed when the fare was pinned.
      - name: occupancy_adults
        type: integer
        source: input
        description: Lower-berth guests.
        constraints: "1 or 2"
      - name: third_berth_guests
        type: integer
        source: input
        default: 0
        description: Third-berth guests.
        constraints: "0 or 1"
      - name: fourth_berth_guests
        type: integer
        source: input
        default: 0
        description: Fourth-berth guests; requires third_berth_guests == 1.
        constraints: "0 or 1"
      - name: guest_count
        type: integer
        source: computed
        description: occupancy_adults + third_berth_guests + fourth_berth_guests.
      - name: allow_waitlist
        type: boolean
        source: input
        default: false
        description: When true, a request that finds available_cabins < 1 creates a WAITLISTED booking instead of failing with ERR_CATEGORY_SOLD_OUT.
      - name: booking_status
        type: enum
        source: system
        default: OPTION
        description: Inventory dimension of the booking's parallel state.
        constraints: "WAITLISTED | OPTION | CONFIRMED | SAILED | CANCELLED"
      - name: payment_status
        type: enum
        source: system
        default: AWAITING_DEPOSIT
        description: Money dimension of the booking's parallel state.
        constraints: "AWAITING_DEPOSIT | DEPOSIT_PAID | PAID_IN_FULL | DELINQUENT | PENALTY_ASSESSED | REFUNDED"
      - name: booked_days_to_sail
        type: integer
        source: computed
        description: days_to_sail at creation; selects the FareRule window and is never recomputed.
      - name: lower_berth_subtotal_cents
        type: integer
        source: computed
        description: Step 1 of calc booking_fare_buildup.
      - name: berth_discount_pct
        type: number
        source: computed
        description: Step 2 of calc booking_fare_buildup; tier keyed on lower_berth_subtotal_cents only.
      - name: third_berth_net_cents
        type: integer
        source: computed
        default: 0
        description: Step 3 of calc booking_fare_buildup for the third berth.
      - name: fourth_berth_net_cents
        type: integer
        source: computed
        default: 0
        description: Step 3 of calc booking_fare_buildup for the fourth berth.
      - name: gross_ticket_cents
        type: integer
        source: computed
        description: Step 4 of calc booking_fare_buildup.
      - name: promo_discount_cents
        type: integer
        source: computed
        default: 0
        description: Step 5a of calc booking_fare_buildup; rounded per component then summed.
      - name: loyalty_discount_cents
        type: integer
        source: computed
        default: 0
        description: Step 5b of calc booking_fare_buildup; applied to post-promo components, rounded per component then summed.
      - name: net_ticket_cents
        type: integer
        source: computed
        description: gross_ticket_cents - promo_discount_cents - loyalty_discount_cents; pinned at creation.
      - name: upgrade_charge_cents
        type: integer
        source: computed
        default: 0
        description: Award amount captured by an accepted UpgradeBid.
      - name: itinerary_compensation_obc_cents
        type: integer
        source: computed
        default: 0
        description: Onboard credit granted by published itinerary changes.
      - name: itinerary_refund_cents
        type: integer
        source: computed
        default: 0
        description: Cash compensation granted by published itinerary changes; a credit against balance_due_cents.
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: Sum of PaymentEvent.amount_cents for kinds {DEPOSIT, FINAL_PAYMENT, PARTIAL, UPGRADE_CHARGE} minus the sum for kind REFUND.
      - name: balance_due_cents
        type: integer
        source: computed
        description: net_ticket_cents + upgrade_charge_cents - itinerary_refund_cents - amount_paid_cents.
      - name: deposit_due_cents
        type: integer
        source: computed
        description: Step 7 of calc booking_fare_buildup.
      - name: deposit_due_date
        type: datetime
        source: computed
        description: Creation instant + Sailing.deposit_due_days_after_booking days.
      - name: final_payment_due_date
        type: datetime
        source: computed
        description: Sailing.embark_date - Sailing.final_payment_days_before days, or deposit_due_date when payment_terms == FULL_AT_BOOKING.
      - name: payment_terms
        type: enum
        source: computed
        description: STANDARD when booked_days_to_sail > Sailing.final_payment_days_before, else FULL_AT_BOOKING.
        constraints: "STANDARD | FULL_AT_BOOKING"
      - name: provisional_penalty_cents
        type: integer
        source: computed
        default: null
        description: PROVISIONAL variant of calc cancellation_settlement, stamped by the cancel transition for disclosure.
      - name: cancellation_penalty_cents
        type: integer
        source: computed
        default: null
        description: FINAL variant of calc cancellation_settlement, stamped by the settle-cancellation transition; the amount actually retained.
      - name: refund_cents
        type: integer
        source: computed
        default: null
        description: max(0, amount_paid_cents_at_settlement - cancellation_penalty_cents), paid out as a REFUND PaymentEvent.
      - name: cancelled_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the cancel transition.
      - name: cancel_reason
        type: string
        source: system
        default: null
        description: Reason captured by the cancel transition, or AUTO_DELINQUENT for ops-run auto-cancellation.
      - name: settled_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the settle-cancellation transition.
      - name: delinquent_since
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the ops-run marked this booking DELINQUENT; the base for DELINQUENCY_GRACE_DAYS.
      - name: projected_onboard_gross_cents
        type: integer
        source: computed
        description: Step 1 of calc booking_onboard_projection.
      - name: projected_onboard_net_cents
        type: integer
        source: computed
        description: max(0, projected_onboard_gross_cents - itinerary_compensation_obc_cents).
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ReservationAgent operator that created the booking.

  - name: PaymentEvent
    parent: Booking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this money movement belongs to."
      - name: kind
        type: enum
        source: input
        description: Money movement type. DEPOSIT/FINAL_PAYMENT/PARTIAL are client-posted; UPGRADE_CHARGE and REFUND are system-created by transitions.
        constraints: "DEPOSIT | FINAL_PAYMENT | PARTIAL | UPGRADE_CHARGE | REFUND"
      - name: amount_cents
        type: integer
        source: input
        description: Positive magnitude of the movement; REFUND rows reduce amount_paid_cents by this magnitude.
        constraints: ">= 1"
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant the event was appended; drives on-time evaluation against final_payment_due_date.
      - name: resulting_payment_status
        type: enum
        source: system
        description: Booking.payment_status immediately after this event was applied.
        constraints: "AWAITING_DEPOSIT | DEPOSIT_PAID | PAID_IN_FULL | DELINQUENT | PENALTY_ASSESSED | REFUNDED"
      - name: note
        type: string
        source: system
        default: null
        description: System annotation for machine-created events (UPGRADE_AWARD, CANCELLATION_SETTLEMENT, ITINERARY_COMPENSATION).

  - name: UpgradeBid
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking bidding for an upgrade."
      - name: target_cabin_category_id
        type: string
        source: input
        description: "FK -> CabinCategory.id; the category bid for; must be reachable from the booking's current category through the upgrade hierarchy."
      - name: bid_amount_per_guest_cents
        type: integer
        source: input
        description: Offer per guest.
        constraints: ">= 1"
      - name: guest_count
        type: integer
        source: computed
        description: Booking.guest_count copied at submission; the award multiplier.
      - name: min_acceptable_per_guest_cents
        type: integer
        source: computed
        description: Floor from calc upgrade_bid_floor, evaluated at submission against the fare rules applicable at that instant.
      - name: countered_min_per_guest_cents
        type: integer
        source: computed
        default: null
        description: Floor recomputed and published by the most recent counter transition.
      - name: counter_rounds
        type: integer
        source: computed
        default: 0
        description: Number of counter transitions applied; bounded by MAX_COUNTER_ROUNDS.
      - name: award_amount_cents
        type: integer
        source: computed
        default: null
        description: bid_amount_per_guest_cents * guest_count, stamped by the accept transition.
      - name: submitted_days_to_sail
        type: integer
        source: computed
        description: days_to_sail at submission; must lie inside the bid window.
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Bid lifecycle state.
        constraints: "SUBMITTED | COUNTERED | ACCEPTED | DECLINED | EXPIRED"
      - name: decline_reason
        type: string
        source: system
        default: null
        description: Reason captured by the decline transition.

  - name: ItineraryChange
    parent: null
    common_fields: true
    fields:
      - name: sailing_id
        type: string
        source: input
        description: "FK -> Sailing.id; the sailing whose itinerary changed."
      - name: kind
        type: enum
        source: input
        description: Nature of the change.
        constraints: "PORT_CANCELLED | PORT_SUBSTITUTED | ITINERARY_SHORTENED"
      - name: affected_port_code
        type: string
        source: input
        description: Port affected by the change.
        constraints: 1..8 chars
      - name: compensation_policy
        type: enum
        source: input
        description: Compensation schedule selected by the port ops coordinator.
        constraints: "OBC_ONLY | OBC_PLUS_REFUND_PCT"
      - name: obc_per_guest_cents
        type: integer
        source: computed
        description: Onboard credit per guest implied by compensation_policy, per calc itinerary_compensation.
      - name: refund_pct
        type: number
        source: computed
        description: Cash compensation fraction of net_ticket_cents implied by (compensation_policy, kind), per calc itinerary_compensation.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Publication state.
        constraints: "DRAFT | PUBLISHED"
      - name: published_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of publication.
      - name: affected_bookings_count
        type: integer
        source: computed
        default: 0
        description: Count of Bookings compensated by this publication.
      - name: total_obc_granted_cents
        type: integer
        source: computed
        default: 0
        description: Sum of onboard credit granted by this publication.
      - name: total_refund_granted_cents
        type: integer
        source: computed
        default: 0
        description: Sum of cash compensation granted by this publication.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Sailing ---
  # Cyclic: OPEN_FOR_SALE <-> SALES_SUSPENDED, bounded by MAX_SALES_SUSPENSIONS.
  - entity: Sailing
    initial_state: PLANNED
    terminal_states: [SAILED]
    transitions:
      - from: PLANNED
        to: OPEN_FOR_SALE
        trigger: "POST /sailings/{id}/open-for-sale"
        actor: RevenueManager
        preconditions:
          - "status == PLANNED"
          - "at least one SailingInventory row exists with sailing_id == this sailing (else ERR_SAILING_NOT_SELLABLE)"
          - "at least one FareRule row exists with sailing_id == this sailing (else ERR_SAILING_NOT_SELLABLE)"
        side_effects:
          - "status = OPEN_FOR_SALE"
          - "recompute Sailing.available_lower_berth_days_gross, available_lower_berth_days_net, ralbd_gross_cents, ralbd_net_cents, revenue_alert (calc sailing_ralbd)"
          - "recompute Sailing.inventory_posture (calc sailing_occupancy_posture)"
          - "increments Sailing.version by 1"
      - from: OPEN_FOR_SALE
        to: SALES_SUSPENDED
        trigger: "POST /sailings/{id}/suspend-sales"
        actor: RevenueManager
        preconditions:
          - "status == OPEN_FOR_SALE"
          - "suspension_count < MAX_SALES_SUSPENSIONS (else ERR_SUSPENSION_LIMIT_REACHED)"
        side_effects:
          - "status = SALES_SUSPENDED"
          - "suspension_count += 1"
          - "suspension_reason = request.reason"
          - "increments Sailing.version by 1"
        note: "Existing bookings are untouched; only new Booking and GroupBlock creation is gated."
      - from: SALES_SUSPENDED
        to: OPEN_FOR_SALE
        trigger: "POST /sailings/{id}/resume-sales"
        actor: RevenueManager
        preconditions:
          - "status == SALES_SUSPENDED"
        side_effects:
          - "status = OPEN_FOR_SALE"
          - "suspension_reason = null"
          - "increments Sailing.version by 1"
        note: "Closes the cycle. The bound lives on the suspend side: the third suspend attempt fails with ERR_SUSPENSION_LIMIT_REACHED, so at most MAX_SALES_SUSPENSIONS full loops are possible."
      - from: OPEN_FOR_SALE
        to: INVENTORY_CLOSED
        trigger: "POST /sailings/{id}/close-inventory"
        actor: RevenueManager
        preconditions:
          - "status IN {OPEN_FOR_SALE, SALES_SUSPENDED}"
        side_effects:
          - "status = INVENTORY_CLOSED"
          - "every Booking of this sailing with booking_status == WAITLISTED transitions WAITLISTED -> CANCELLED with cancel_reason = 'INVENTORY_CLOSED', provisional_penalty_cents = 0, cancellation_penalty_cents = 0, payment_status unchanged"
          - "recompute each affected SailingInventory.waitlisted_bookings_count"
          - "increments Sailing.version by 1"
      - from: SALES_SUSPENDED
        to: INVENTORY_CLOSED
        trigger: "POST /sailings/{id}/close-inventory"
        actor: RevenueManager
        preconditions:
          - "status IN {OPEN_FOR_SALE, SALES_SUSPENDED}"
        side_effects:
          - "identical to OPEN_FOR_SALE -> INVENTORY_CLOSED"
          - "increments Sailing.version by 1"
      - from: INVENTORY_CLOSED
        to: SAILED
        trigger: "POST /sailings/{id}/ops-run (system, when current_utc >= embark_date)"
        actor: system
        preconditions:
          - "status IN {OPEN_FOR_SALE, SALES_SUSPENDED, INVENTORY_CLOSED}"
          - "current_utc >= embark_date"
        side_effects:
          - "status = SAILED"
          - "each Booking of this sailing with booking_status == CONFIRMED transitions CONFIRMED -> SAILED"
          - "because a Booking reached SAILED, its Guest.prior_sailings_count += 1"
          - "because Guest.prior_sailings_count changed, Guest.loyalty_tier and Guest.repeat_guest_offer_pct are recomputed (calc guest_loyalty_tier)"
          - "each Booking of this sailing with booking_status IN {OPTION, WAITLISTED} transitions to CANCELLED with cancel_reason = 'SAILED_UNCONFIRMED'"
          - "increments Sailing.version by 1"
      - from: OPEN_FOR_SALE
        to: SAILED
        trigger: "POST /sailings/{id}/ops-run (system, when current_utc >= embark_date)"
        actor: system
        preconditions:
          - "current_utc >= embark_date"
        side_effects:
          - "identical to INVENTORY_CLOSED -> SAILED"
          - "increments Sailing.version by 1"

  # ------------------------------------------------------------- Promotion ---
  # Branching: ACTIVE -> {EXHAUSTED, EXPIRED, WITHDRAWN} with divergent side effects.
  - entity: Promotion
    initial_state: SCHEDULED
    terminal_states: [EXHAUSTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /promotions/{id}/activate, or POST /sailings/{id}/ops-run step 2"
        actor: RevenueManager
        preconditions:
          - "status == SCHEDULED"
          - "starts_on <= current_utc <= ends_on (else ERR_PROMO_WINDOW_NOT_CURRENT)"
          - "Sailing.inventory_posture != FROZEN (else ERR_POSTURE_FROZEN)"
        side_effects:
          - "status = ACTIVE"
          - "increments Promotion.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "POST /bookings (system, when redemption_count reaches max_redemptions)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "redemption_count + 1 == max_redemptions"
        side_effects:
          - "redemption_count += 1"
          - "status = EXHAUSTED"
          - "increments Promotion.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /sailings/{id}/ops-run step 1 (system, when ends_on < current_utc)"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, ACTIVE}"
          - "ends_on < current_utc"
        side_effects:
          - "status = EXPIRED"
          - "increments Promotion.version by 1"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /sailings/{id}/ops-run step 1 (system, when ends_on < current_utc)"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, ACTIVE}"
          - "ends_on < current_utc"
        side_effects:
          - "status = EXPIRED"
          - "increments Promotion.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /promotions/{id}/withdraw"
        actor: RevenueManager
        preconditions:
          - "status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "status = WITHDRAWN"
          - "withdraw_reason = request.reason"
          - "Bookings already quoting this promotion keep their pinned promo_discount_cents (no repricing)"
          - "increments Promotion.version by 1"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /promotions/{id}/withdraw"
        actor: RevenueManager
        preconditions:
          - "status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "identical to ACTIVE -> WITHDRAWN"
          - "increments Promotion.version by 1"

  # ------------------------------------------------------------ GroupBlock ---
  # Branching with a zero-release self-loop and a review-extension cycle.
  - entity: GroupBlock
    initial_state: TENTATIVE
    terminal_states: [RELEASED]
    transitions:
      - from: TENTATIVE
        to: DEFINITE
        trigger: "POST /group-blocks/{id}/confirm-definite"
        actor: GroupSalesAgent
        preconditions:
          - "status == TENTATIVE"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Sailing.status IN {OPEN_FOR_SALE, SALES_SUSPENDED}"
        side_effects:
          - "status = DEFINITE"
          - "confirmed_by_user_id = X-User-ID"
          - "contract_reference = request.contract_reference"
          - "cabins_held is frozen: review transitions are no longer available from DEFINITE"
          - "increments GroupBlock.version by 1"
      - from: TENTATIVE
        to: PARTIALLY_RELEASED
        trigger: "POST /group-blocks/{id}/review, or POST /sailings/{id}/ops-run step 3"
        actor: GroupSalesAgent
        preconditions:
          - "status IN {TENTATIVE, PARTIALLY_RELEASED}"
          - "current_utc >= review_date (else ERR_REVIEW_DATE_NOT_REACHED)"
          - "released_now > 0 and cabins_held - released_now > 0, where released_now comes from calc group_attrition_release"
        side_effects:
          - "cabins_held -= released_now; released_cabins_total += released_now; review_count += 1; status = PARTIALLY_RELEASED"
          - "because GroupBlock.cabins_held decreased, SailingInventory(sailing_id, cabin_category_id).group_held_cabins is recomputed, released_cabins_total += released_now, and available_cabins is recomputed (calc oversell_availability)"
          - "because SailingInventory.available_cabins increased above 0, calc waitlist_promotion_selector runs on that allotment: each promoted Booking transitions WAITLISTED -> OPTION and SailingInventory.booked_cabins += 1 / waitlisted_bookings_count -= 1 per promotion, repeated while available_cabins >= 1"
          - "because Booking rows reached OPTION, Sailing.lower_berths_sold / third_berths_sold / fourth_berths_sold / occupancy_pct / inventory_posture / gross_ticket_revenue_cents / projected_onboard_revenue_cents / ralbd_gross_cents / ralbd_net_cents / revenue_alert are recomputed"
          - "increments GroupBlock.version by 1"
      - from: PARTIALLY_RELEASED
        to: PARTIALLY_RELEASED
        trigger: "POST /group-blocks/{id}/review, or POST /sailings/{id}/ops-run step 3"
        actor: GroupSalesAgent
        preconditions:
          - "status IN {TENTATIVE, PARTIALLY_RELEASED}"
          - "current_utc >= review_date"
          - "released_now > 0 and cabins_held - released_now > 0"
        side_effects:
          - "identical to TENTATIVE -> PARTIALLY_RELEASED"
          - "increments GroupBlock.version by 1"
      - from: TENTATIVE
        to: RELEASED
        trigger: "POST /group-blocks/{id}/review, or POST /sailings/{id}/ops-run step 3"
        actor: GroupSalesAgent
        preconditions:
          - "status IN {TENTATIVE, PARTIALLY_RELEASED}"
          - "current_utc >= review_date"
          - "cabins_held - released_now == 0 (every held cabin is returned)"
        side_effects:
          - "cabins_held = 0; released_cabins_total += released_now; review_count += 1; status = RELEASED"
          - "because GroupBlock.cabins_held reached 0, SailingInventory.group_held_cabins is recomputed and available_cabins increases by released_now"
          - "because SailingInventory.available_cabins increased, calc waitlist_promotion_selector runs exactly as in TENTATIVE -> PARTIALLY_RELEASED"
          - "increments GroupBlock.version by 1"
      - from: TENTATIVE
        to: TENTATIVE
        trigger: "POST /group-blocks/{id}/review, or POST /sailings/{id}/ops-run step 3"
        actor: GroupSalesAgent
        preconditions:
          - "status == TENTATIVE"
          - "current_utc >= review_date"
          - "released_now == 0 (calc group_attrition_release returned zero: cabins_held - picked_up_cabins == 0, or ATTRITION_50 floored to zero)"
        side_effects:
          - "review_count += 1"
          - "review_date += REVIEW_EXTENSION_DAYS days"
          - "cabins_held unchanged; SailingInventory.group_held_cabins unchanged; no waitlist promotion runs"
          - "increments GroupBlock.version by 1"
        note: "Zero-release self-loop: the empty-set boundary of the attrition calculation is a legal transition, not an error."
      - from: PARTIALLY_RELEASED
        to: TENTATIVE
        trigger: "POST /group-blocks/{id}/extend-review"
        actor: GroupSalesAgent
        preconditions:
          - "status IN {TENTATIVE, PARTIALLY_RELEASED}"
          - "review_extension_count < MAX_REVIEW_EXTENSIONS (else ERR_MAX_REVIEW_EXTENSIONS_EXCEEDED)"
          - "request.new_review_date > current_utc (else ERR_REVIEW_DATE_IN_PAST)"
        side_effects:
          - "status = TENTATIVE"
          - "review_date = request.new_review_date"
          - "review_extension_count += 1"
          - "cabins_held and SailingInventory.group_held_cabins unchanged"
          - "increments GroupBlock.version by 1"
        note: "Closes the review cycle: a partially released block returns to TENTATIVE for a later review date."
      - from: TENTATIVE
        to: TENTATIVE
        trigger: "POST /group-blocks/{id}/extend-review"
        actor: GroupSalesAgent
        preconditions:
          - "status IN {TENTATIVE, PARTIALLY_RELEASED}"
          - "review_extension_count < MAX_REVIEW_EXTENSIONS"
          - "request.new_review_date > current_utc"
        side_effects:
          - "review_date = request.new_review_date; review_extension_count += 1"
          - "increments GroupBlock.version by 1"

  # ---------------------------------------- Booking, dimension booking_status ---
  # Parallel dimension 1 of 2. Evolves independently of payment_status but
  # cross-gates it (confirm requires a paid deposit; auto-cancel is driven by
  # the payment dimension).
  - entity: Booking
    dimension: booking_status
    initial_state: OPTION
    terminal_states: [SAILED, CANCELLED]
    transitions:
      - from: WAITLISTED
        to: OPTION
        trigger: "system, calc waitlist_promotion_selector during POST /group-blocks/{id}/review or POST /sailings/{id}/ops-run step 4"
        actor: system
        preconditions:
          - "booking_status == WAITLISTED"
          - "SailingInventory(sailing_id, cabin_category_id).available_cabins >= 1"
          - "Sailing.status IN {OPEN_FOR_SALE, SALES_SUSPENDED}"
        side_effects:
          - "booking_status = OPTION"
          - "SailingInventory.booked_cabins += 1; waitlisted_bookings_count -= 1; available_cabins recomputed"
          - "net_ticket_cents, fare_rule_id and pinned_fare_rule_version are NOT recomputed - the fare pinned at creation survives promotion"
          - "deposit_due_date = current_utc + Sailing.deposit_due_days_after_booking days (the deposit clock starts at promotion)"
          - "Sailing.lower_berths_sold / third_berths_sold / fourth_berths_sold / occupancy_pct / inventory_posture / gross_ticket_revenue_cents / projected_onboard_revenue_cents / ralbd_gross_cents / ralbd_net_cents / revenue_alert recomputed"
          - "increments Booking.version by 1"
      - from: OPTION
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: ReservationAgent
        preconditions:
          - "booking_status == OPTION"
          - "payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} (else ERR_DEPOSIT_NOT_PAID)"
          - "Sailing.status == OPEN_FOR_SALE (else ERR_SAILING_NOT_OPEN)"
          - "group_block_id is null OR GroupBlock.status == DEFINITE (else ERR_GROUP_BLOCK_NOT_DEFINITE)"
        side_effects:
          - "booking_status = CONFIRMED"
          - "Sailing.confirmed_bookings_count += 1"
          - "because Sailing.confirmed_bookings_count changed, Sailing.final_payment_risk_flag is recomputed"
          - "increments Booking.version by 1"
      - from: OPTION
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, or POST /sailings/{id}/ops-run step 6 (auto-cancel)"
        actor: ReservationAgent
        preconditions:
          - "booking_status IN {WAITLISTED, OPTION, CONFIRMED}"
          - "acting Guest, when the actor role is Guest, satisfies X-User-ID == guest_id (else ERR_NOT_BOOKING_OWNER)"
        side_effects:
          - "booking_status = CANCELLED; cancelled_at = current_utc; cancel_reason = request.reason"
          - "payment_status -> PENALTY_ASSESSED (see the payment dimension) with provisional_penalty_cents from the PROVISIONAL variant of calc cancellation_settlement"
          - "SailingInventory.booked_cabins -= 1 (or waitlisted_bookings_count -= 1 when cancelling from WAITLISTED); available_cabins recomputed; no waitlist promotion runs here"
          - "Promotion.redemption_count -= 1 when promotion_id is set; a Promotion in EXHAUSTED stays EXHAUSTED"
          - "GroupBlock.picked_up_cabins recomputed when group_block_id is set"
          - "Sailing.lower_berths_sold / occupancy_pct / inventory_posture / gross_ticket_revenue_cents / projected_onboard_revenue_cents / compensation_liability_cents / ralbd_* / revenue_alert recomputed"
          - "increments Booking.version by 1"
        note: "Freed cabins are deliberately NOT promoted to waitlisted bookings inside the cancel transition; promotion happens on the next review or ops-run."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, or POST /sailings/{id}/ops-run step 6 (auto-cancel)"
        actor: ReservationAgent
        preconditions:
          - "booking_status IN {WAITLISTED, OPTION, CONFIRMED}"
        side_effects:
          - "identical to OPTION -> CANCELLED, plus Sailing.confirmed_bookings_count -= 1 and Sailing.final_payment_risk_flag recomputed"
          - "increments Booking.version by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, POST /sailings/{id}/close-inventory, or POST /sailings/{id}/ops-run step 6"
        actor: ReservationAgent
        preconditions:
          - "booking_status IN {WAITLISTED, OPTION, CONFIRMED}"
        side_effects:
          - "booking_status = CANCELLED; SailingInventory.waitlisted_bookings_count -= 1; booked_cabins unchanged"
          - "provisional_penalty_cents = 0 and cancellation_penalty_cents = 0 (a waitlisted booking never held a cabin)"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: SAILED
        trigger: "POST /sailings/{id}/ops-run step 8 (system, when current_utc >= Sailing.embark_date)"
        actor: system
        preconditions:
          - "booking_status == CONFIRMED"
          - "Sailing transitions to SAILED in the same ops-run"
        side_effects:
          - "booking_status = SAILED"
          - "because this booking reached SAILED, Guest.prior_sailings_count += 1"
          - "because Guest.prior_sailings_count changed, Guest.loyalty_tier and Guest.repeat_guest_offer_pct are recomputed"
          - "increments Booking.version by 1"

  # ---------------------------------------- Booking, dimension payment_status ---
  # Parallel dimension 2 of 2.
  - entity: Booking
    dimension: payment_status
    initial_state: AWAITING_DEPOSIT
    terminal_states: [REFUNDED]
    transitions:
      - from: AWAITING_DEPOSIT
        to: DEPOSIT_PAID
        trigger: "POST /bookings/{id}/payments with kind == DEPOSIT"
        actor: ReservationAgent
        preconditions:
          - "payment_status IN {AWAITING_DEPOSIT, DELINQUENT}"
          - "booking_status IN {OPTION, CONFIRMED}"
          - "request.amount_cents >= deposit_due_cents (else ERR_DEPOSIT_BELOW_MINIMUM)"
          - "request.amount_cents <= balance_due_cents (else ERR_PAYMENT_EXCEEDS_BALANCE)"
          - "amount_paid_cents + request.amount_cents < net_ticket_cents + upgrade_charge_cents - itinerary_refund_cents, otherwise the target state is PAID_IN_FULL"
        side_effects:
          - "append PaymentEvent{kind: DEPOSIT, amount_cents, posted_at: current_utc, resulting_payment_status: DEPOSIT_PAID}"
          - "amount_paid_cents and balance_due_cents recomputed"
          - "payment_status = DEPOSIT_PAID; delinquent_since = null"
          - "increments Booking.version by 1"
      - from: AWAITING_DEPOSIT
        to: PAID_IN_FULL
        trigger: "POST /bookings/{id}/payments with kind == DEPOSIT and amount covering the whole balance (payment_terms == FULL_AT_BOOKING)"
        actor: ReservationAgent
        preconditions:
          - "payment_status IN {AWAITING_DEPOSIT, DELINQUENT}"
          - "request.amount_cents >= deposit_due_cents"
          - "amount_paid_cents + request.amount_cents == net_ticket_cents + upgrade_charge_cents - itinerary_refund_cents"
        side_effects:
          - "append PaymentEvent{kind: DEPOSIT, resulting_payment_status: PAID_IN_FULL}"
          - "payment_status = PAID_IN_FULL; delinquent_since = null"
          - "Sailing.paid_in_full_bookings_count += 1 and Sailing.final_payment_risk_flag recomputed"
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /bookings/{id}/payments with kind == FINAL_PAYMENT"
        actor: ReservationAgent
        preconditions:
          - "payment_status IN {DEPOSIT_PAID, DELINQUENT}"
          - "booking_status IN {OPTION, CONFIRMED}"
          - "current_utc <= final_payment_due_date (else ERR_FINAL_PAYMENT_OVERDUE)"
          - "request.amount_cents == balance_due_cents (else ERR_PAYMENT_EXCEEDS_BALANCE when greater, ERR_FINAL_PAYMENT_SHORT when smaller)"
        side_effects:
          - "append PaymentEvent{kind: FINAL_PAYMENT, posted_at: current_utc, resulting_payment_status: PAID_IN_FULL}"
          - "amount_paid_cents and balance_due_cents recomputed; balance_due_cents == 0"
          - "payment_status = PAID_IN_FULL; delinquent_since = null"
          - "Sailing.paid_in_full_bookings_count += 1 and Sailing.final_payment_risk_flag recomputed"
          - "increments Booking.version by 1"
        note: "The comparison is inclusive: a FINAL_PAYMENT posted at exactly final_payment_due_date is on time."
      - from: DEPOSIT_PAID
        to: DEPOSIT_PAID
        trigger: "POST /bookings/{id}/payments with kind == PARTIAL"
        actor: ReservationAgent
        preconditions:
          - "payment_status IN {DEPOSIT_PAID, DELINQUENT}"
          - "request.amount_cents < balance_due_cents (else the FINAL_PAYMENT path applies)"
        side_effects:
          - "append PaymentEvent{kind: PARTIAL, resulting_payment_status: DEPOSIT_PAID}"
          - "amount_paid_cents and balance_due_cents recomputed; payment_status stays DEPOSIT_PAID"
          - "increments Booking.version by 1"
      - from: AWAITING_DEPOSIT
        to: DELINQUENT
        trigger: "POST /sailings/{id}/ops-run step 5 (system, when deposit_due_date < current_utc)"
        actor: system
        preconditions:
          - "payment_status == AWAITING_DEPOSIT"
          - "booking_status IN {OPTION, CONFIRMED}"
          - "deposit_due_date < current_utc"
        side_effects:
          - "payment_status = DELINQUENT; delinquent_since = current_utc"
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: DELINQUENT
        trigger: "POST /sailings/{id}/ops-run step 5 (system, when final_payment_due_date < current_utc)"
        actor: system
        preconditions:
          - "payment_status == DEPOSIT_PAID"
          - "booking_status IN {OPTION, CONFIRMED}"
          - "final_payment_due_date < current_utc"
        side_effects:
          - "payment_status = DELINQUENT; delinquent_since = current_utc"
          - "increments Booking.version by 1"
      - from: DELINQUENT
        to: PAID_IN_FULL
        trigger: "POST /bookings/{id}/payments with kind == FINAL_PAYMENT (cure inside the grace period)"
        actor: ReservationAgent
        preconditions:
          - "payment_status == DELINQUENT"
          - "current_utc < delinquent_since + DELINQUENCY_GRACE_DAYS days"
          - "request.amount_cents == balance_due_cents"
        side_effects:
          - "append PaymentEvent{kind: FINAL_PAYMENT, resulting_payment_status: PAID_IN_FULL}"
          - "payment_status = PAID_IN_FULL; delinquent_since = null"
          - "Sailing.paid_in_full_bookings_count += 1 and final_payment_risk_flag recomputed"
          - "increments Booking.version by 1"
        note: "The ERR_FINAL_PAYMENT_OVERDUE guard does not apply on the cure path; the grace window replaces it."
      - from: DELINQUENT
        to: PENALTY_ASSESSED
        trigger: "POST /sailings/{id}/ops-run step 6 (system auto-cancel after the grace period)"
        actor: system
        preconditions:
          - "payment_status == DELINQUENT"
          - "current_utc >= delinquent_since + DELINQUENCY_GRACE_DAYS days"
        side_effects:
          - "booking_status -> CANCELLED with cancel_reason = 'AUTO_DELINQUENT' (see the booking dimension)"
          - "payment_status = PENALTY_ASSESSED"
          - "provisional_penalty_cents and cancellation_penalty_cents both set from the FINAL variant of calc cancellation_settlement evaluated at current_utc"
          - "increments Booking.version by 1"
        note: "Auto-cancellation skips the PROVISIONAL/FINAL split: there is no client request instant, so both fields carry the FINAL value."
      - from: DEPOSIT_PAID
        to: PENALTY_ASSESSED
        trigger: "POST /bookings/{id}/cancel"
        actor: ReservationAgent
        preconditions:
          - "payment_status IN {AWAITING_DEPOSIT, DEPOSIT_PAID, PAID_IN_FULL, DELINQUENT}"
          - "booking_status IN {OPTION, CONFIRMED} (a WAITLISTED cancel leaves payment_status untouched)"
        side_effects:
          - "payment_status = PENALTY_ASSESSED"
          - "provisional_penalty_cents = PROVISIONAL variant of calc cancellation_settlement at current_utc"
          - "cancellation_penalty_cents and refund_cents stay null until settlement"
          - "Sailing.paid_in_full_bookings_count -= 1 when the prior state was PAID_IN_FULL; final_payment_risk_flag recomputed"
          - "increments Booking.version by 1"
      - from: PAID_IN_FULL
        to: PENALTY_ASSESSED
        trigger: "POST /bookings/{id}/cancel"
        actor: ReservationAgent
        preconditions:
          - "payment_status IN {AWAITING_DEPOSIT, DEPOSIT_PAID, PAID_IN_FULL, DELINQUENT}"
        side_effects:
          - "identical to DEPOSIT_PAID -> PENALTY_ASSESSED"
          - "increments Booking.version by 1"
      - from: PENALTY_ASSESSED
        to: REFUNDED
        trigger: "POST /bookings/{id}/settle-cancellation"
        actor: RevenueManager
        preconditions:
          - "payment_status == PENALTY_ASSESSED (else ERR_BOOKING_NOT_AWAITING_SETTLEMENT)"
          - "booking_status == CANCELLED"
        side_effects:
          - "cancellation_penalty_cents = FINAL variant of calc cancellation_settlement evaluated at the settlement instant"
          - "refund_cents = max(0, amount_paid_cents - cancellation_penalty_cents)"
          - "when refund_cents > 0, append PaymentEvent{kind: REFUND, amount_cents: refund_cents, note: 'CANCELLATION_SETTLEMENT', resulting_payment_status: REFUNDED}"
          - "amount_paid_cents recomputed; the invariant amount_paid_cents == cancellation_penalty_cents holds whenever the pre-settlement amount_paid_cents >= cancellation_penalty_cents"
          - "payment_status = REFUNDED; settled_at = current_utc"
          - "increments Booking.version by 1"

  # ------------------------------------------------------------- UpgradeBid ---
  # Cyclic: SUBMITTED <-> COUNTERED, bounded by MAX_COUNTER_ROUNDS.
  - entity: UpgradeBid
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /upgrade-bids/{id}/counter"
        actor: RevenueManager
        preconditions:
          - "status == SUBMITTED (else ERR_BID_NOT_PENDING)"
          - "counter_rounds < MAX_COUNTER_ROUNDS (else ERR_MAX_COUNTER_ROUNDS_EXCEEDED)"
          - "Sailing.status IN {OPEN_FOR_SALE, SALES_SUSPENDED, INVENTORY_CLOSED}"
        side_effects:
          - "status = COUNTERED"
          - "counter_rounds += 1"
          - "countered_min_per_guest_cents = calc upgrade_bid_floor re-evaluated at current_utc"
          - "increments UpgradeBid.version by 1"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /upgrade-bids/{id}/rebid"
        actor: Guest
        preconditions:
          - "status == COUNTERED (else ERR_BID_NOT_COUNTERED)"
          - "X-User-ID == Booking.guest_id (else ERR_NOT_BOOKING_OWNER)"
          - "request.bid_amount_per_guest_cents >= countered_min_per_guest_cents (else ERR_BID_BELOW_FLOOR)"
          - "BID_WINDOW_MIN_DAYS <= days_to_sail <= BID_WINDOW_MAX_DAYS (else ERR_BID_WINDOW_CLOSED)"
        side_effects:
          - "bid_amount_per_guest_cents = request value"
          - "status = SUBMITTED"
          - "min_acceptable_per_guest_cents = countered_min_per_guest_cents (the published floor is now binding)"
          - "increments UpgradeBid.version by 1"
        note: "Closes the negotiation cycle; counter_rounds is not reset, so at most MAX_COUNTER_ROUNDS loops are possible."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /upgrade-bids/{id}/accept"
        actor: RevenueManager
        preconditions:
          - "status == SUBMITTED (else ERR_BID_NOT_PENDING)"
          - "bid_amount_per_guest_cents >= min_acceptable_per_guest_cents (else ERR_BID_BELOW_FLOOR)"
          - "SailingInventory(Booking.sailing_id, target_cabin_category_id).available_cabins >= 1 (else ERR_TARGET_CATEGORY_UNAVAILABLE)"
          - "target CabinCategory.max_occupancy >= Booking.guest_count (else ERR_MAX_OCCUPANCY_EXCEEDED)"
          - "BID_WINDOW_MIN_DAYS <= days_to_sail <= BID_WINDOW_MAX_DAYS (else ERR_BID_WINDOW_CLOSED)"
        side_effects:
          - "status = ACCEPTED; award_amount_cents = bid_amount_per_guest_cents * guest_count"
          - "Booking.assigned_cabin_category_id = target_cabin_category_id; Booking.upgrade_charge_cents = award_amount_cents"
          - "append PaymentEvent{kind: UPGRADE_CHARGE, amount_cents: award_amount_cents, note: 'UPGRADE_AWARD'} so amount_paid_cents rises by the same amount and balance_due_cents is unchanged"
          - "SailingInventory of the source category: booked_cabins -= 1, available_cabins recomputed"
          - "SailingInventory of the target category: booked_cabins += 1, available_cabins recomputed"
          - "Booking.projected_onboard_gross_cents and projected_onboard_net_cents recomputed against the target category's onboard spend indices"
          - "every other UpgradeBid of the same booking with status IN {SUBMITTED, COUNTERED} transitions to DECLINED with decline_reason = 'SUPERSEDED_BY_AWARD'"
          - "Sailing.gross_ticket_revenue_cents / projected_onboard_revenue_cents / ralbd_gross_cents / ralbd_net_cents / revenue_alert recomputed"
          - "increments UpgradeBid.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /upgrade-bids/{id}/decline"
        actor: RevenueManager
        preconditions:
          - "status IN {SUBMITTED, COUNTERED}"
        side_effects:
          - "status = DECLINED; decline_reason = request.reason"
          - "no inventory or money movement"
          - "increments UpgradeBid.version by 1"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /upgrade-bids/{id}/decline"
        actor: RevenueManager
        preconditions:
          - "status IN {SUBMITTED, COUNTERED}"
        side_effects:
          - "identical to SUBMITTED -> DECLINED"
          - "increments UpgradeBid.version by 1"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /sailings/{id}/ops-run step 7 (system, when days_to_sail < BID_WINDOW_MIN_DAYS)"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, COUNTERED}"
          - "days_to_sail < BID_WINDOW_MIN_DAYS"
        side_effects:
          - "status = EXPIRED"
          - "increments UpgradeBid.version by 1"
      - from: COUNTERED
        to: EXPIRED
        trigger: "POST /sailings/{id}/ops-run step 7 (system, when days_to_sail < BID_WINDOW_MIN_DAYS)"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, COUNTERED}"
          - "days_to_sail < BID_WINDOW_MIN_DAYS"
        side_effects:
          - "status = EXPIRED"
          - "increments UpgradeBid.version by 1"

  # -------------------------------------------------------- ItineraryChange ---
  - entity: ItineraryChange
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /itinerary-changes/{id}/publish"
        actor: PortOpsCoordinator
        preconditions:
          - "status == DRAFT (else ERR_ITINERARY_CHANGE_NOT_DRAFT)"
          - "Sailing.status IN {OPEN_FOR_SALE, SALES_SUSPENDED, INVENTORY_CLOSED} (else ERR_SAILING_ALREADY_SAILED)"
        side_effects:
          - "status = PUBLISHED; published_at = current_utc"
          - "because the change is PUBLISHED, every Booking of the sailing with booking_status IN {OPTION, CONFIRMED} is compensated: itinerary_compensation_obc_cents += obc_per_guest_cents * guest_count and itinerary_refund_cents += round_half_up(net_ticket_cents * refund_pct)"
          - "because Booking.itinerary_compensation_obc_cents changed, Booking.projected_onboard_net_cents = max(0, projected_onboard_gross_cents - itinerary_compensation_obc_cents) is recomputed, and because itinerary_refund_cents changed, Booking.balance_due_cents is recomputed"
          - "because those Booking fields changed, Sailing.projected_onboard_revenue_cents and Sailing.compensation_liability_cents are recomputed"
          - "because those Sailing aggregates changed, Sailing.ralbd_gross_cents and Sailing.ralbd_net_cents are recomputed (calc sailing_ralbd)"
          - "because ralbd_net_cents changed, Sailing.revenue_alert = (ralbd_net_cents < RALBD_ALERT_FLOOR_CENTS) is recomputed"
          - "affected_bookings_count, total_obc_granted_cents, total_refund_granted_cents stamped on the ItineraryChange"
          - "increments ItineraryChange.version by 1 and Sailing.version by 1"
        note: "WAITLISTED, CANCELLED and SAILED bookings are excluded from compensation."

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: oversell-adjust-stale-inventory
    parent_entity: SailingInventory
    write_endpoint: "PATCH /sailing-inventories/{id}"
    occ_field: "expected_inventory_version"
    description: |
      Re-setting oversell_allowance on an allotment whose version has advanced
      since the client last read it is rejected. Two revenue managers may each
      legitimately set the same allowance value from the same observed state, so
      no state precondition covers this: the guard is the stale-version check,
      which forces the second writer to re-read the allotment (whose booked_cabins,
      group_held_cabins and effective_oversell_cabins may have moved) before
      re-committing an oversell decision.
    error_id: ERR_STALE_INVENTORY_VERSION
    http_status: 412

  - rule_id: promotion-create-stale-sailing
    parent_entity: Sailing
    write_endpoint: "POST /promotions"
    occ_field: "expected_sailing_version"
    description: |
      Creating a Promotion against a Sailing whose version has advanced since the
      client last read it is rejected. Promotion admission depends on the sailing's
      whole campaign calendar (the PROMO_CADENCE_GAP_DAYS spacing check) and on its
      inventory_posture, both of which move with every booking; a second creation
      carrying a stale expected_sailing_version would otherwise be admitted against
      a calendar the writer never saw.
    error_id: ERR_STALE_SAILING_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:

  # ------------------------------------------------------------------ 1 of 12 ---
  - name: booking_fare_buildup
    trigger: "POST /bookings (every booking, including WAITLISTED ones)"
    algorithm_type: tiered_pricing
    inputs:
      - "Sailing.embark_date, Sailing.final_payment_days_before, Sailing.deposit_due_days_after_booking"
      - "the logical clock value current_utc"
      - "FareRule.base_lower_berth_fare_cents, third_berth_fare_cents, fourth_berth_fare_cents for the matching booking window"
      - "request.occupancy_adults, request.third_berth_guests, request.fourth_berth_guests"
      - "Promotion.discount_pct when a promotion is quoted"
      - "Guest.repeat_guest_offer_pct"
    formula: |
      The seven steps run in exactly this pinned order. Reordering step 4 relative
      to steps 5-7, or collapsing the per-component rounding of steps 7 and 9 into
      a single rounding of the total, changes the answer.

      1. booked_days_to_sail = floor((Sailing.embark_date - current_utc) / 86400 seconds)
      2. Pin the fare window. Select the FareRule row with the booking's sailing_id
         and cabin_category_id whose half-open window contains booked_days_to_sail:
             window_close_days_to_sail <= booked_days_to_sail < window_open_days_to_sail
         No match -> ERR_NO_FARE_RULE_FOR_WINDOW. Store fare_rule_id and
         pinned_fare_rule_version; later fare edits never reprice this booking.
      3. lower_berth_subtotal_cents =
             occupancy_adults == 2 -> base_lower_berth_fare_cents * 2
             occupancy_adults == 1 -> round_half_up(base_lower_berth_fare_cents * SINGLE_SUPPLEMENT_MULT)
      4. berth_discount_pct is chosen from lower_berth_subtotal_cents ALONE, before any
         upper-berth money exists, evaluated highest tier first:
             lower_berth_subtotal_cents >= BERTH_TIER_3_FLOOR_CENTS -> BERTH_TIER_3_PCT
             lower_berth_subtotal_cents >= BERTH_TIER_2_FLOOR_CENTS -> BERTH_TIER_2_PCT
             lower_berth_subtotal_cents >= BERTH_TIER_1_FLOOR_CENTS -> BERTH_TIER_1_PCT
             otherwise                                              -> 0.00
         Comparisons are inclusive at the floor.
      5. third_berth_net_cents  = round_half_up(third_berth_fare_cents  * (1 - berth_discount_pct)) * third_berth_guests
         fourth_berth_net_cents = round_half_up(fourth_berth_fare_cents * (1 - berth_discount_pct)) * fourth_berth_guests
         The berth discount applies to upper berths only; the lower-berth subtotal is
         never discounted by it.
      6. gross_ticket_cents = lower_berth_subtotal_cents + third_berth_net_cents + fourth_berth_net_cents
      7. promo_discount_cents is rounded PER COMPONENT and then summed:
             round_half_up(lower_berth_subtotal_cents * discount_pct)
           + round_half_up(third_berth_net_cents      * discount_pct)
           + round_half_up(fourth_berth_net_cents     * discount_pct)
         with discount_pct = 0 when no promotion is quoted. A promotion is quotable only
         when Promotion.status == ACTIVE, starts_on <= current_utc <= ends_on,
         redemption_count < max_redemptions, and the audience matches:
             GENERAL      -> always eligible
             REPEAT_GUEST -> Guest.loyalty_tier != NONE
             GROUP        -> request.group_block_id is not null
      8. Each component is reduced by its own rounded promo share, producing
         post_promo_lower, post_promo_third, post_promo_fourth.
      9. loyalty_discount_cents is likewise rounded PER post-promo COMPONENT and summed:
             round_half_up(post_promo_lower  * Guest.repeat_guest_offer_pct)
           + round_half_up(post_promo_third  * Guest.repeat_guest_offer_pct)
           + round_half_up(post_promo_fourth * Guest.repeat_guest_offer_pct)
      10. net_ticket_cents = gross_ticket_cents - promo_discount_cents - loyalty_discount_cents
      11. deposit_due_cents = max(DEPOSIT_MIN_PER_GUEST_CENTS * guest_count,
                                round_half_up(net_ticket_cents * DEPOSIT_PCT))
         where guest_count = occupancy_adults + third_berth_guests + fourth_berth_guests.
      12. final_payment_due_date = Sailing.embark_date - Sailing.final_payment_days_before days
         deposit_due_date       = current_utc + Sailing.deposit_due_days_after_booking days
         payment_terms = booked_days_to_sail <= Sailing.final_payment_days_before
                         ? FULL_AT_BOOKING : STANDARD
         When payment_terms == FULL_AT_BOOKING, deposit_due_cents is overridden to
         net_ticket_cents and deposit_due_date is set to current_utc.
      13. balance_due_cents = net_ticket_cents + upgrade_charge_cents
                             - itinerary_refund_cents - amount_paid_cents
    constants:
      SINGLE_SUPPLEMENT_MULT: 1.75
      BERTH_TIER_1_FLOOR_CENTS: 250000
      BERTH_TIER_1_PCT: 0.10
      BERTH_TIER_2_FLOOR_CENTS: 400000
      BERTH_TIER_2_PCT: 0.20
      BERTH_TIER_3_FLOOR_CENTS: 600000
      BERTH_TIER_3_PCT: 0.30
      DEPOSIT_PCT: 0.20
      DEPOSIT_MIN_PER_GUEST_CENTS: 25000
    precision: "integer cents; round_half_up at every rounding point named above; berth_discount_pct is an exact 2-decimal constant"
    outputs:
      - Booking.booked_days_to_sail
      - Booking.fare_rule_id
      - Booking.pinned_fare_rule_version
      - Booking.lower_berth_subtotal_cents
      - Booking.berth_discount_pct
      - Booking.third_berth_net_cents
      - Booking.fourth_berth_net_cents
      - Booking.gross_ticket_cents
      - Booking.promo_discount_cents
      - Booking.loyalty_discount_cents
      - Booking.net_ticket_cents
      - Booking.deposit_due_cents
      - Booking.deposit_due_date
      - Booking.final_payment_due_date
      - Booking.payment_terms
      - Booking.balance_due_cents
      - Booking.guest_count

  # ------------------------------------------------------------------ 2 of 12 ---
  - name: booking_onboard_projection
    trigger: "POST /bookings; POST /upgrade-bids/{id}/accept; POST /itinerary-changes/{id}/publish"
    algorithm_type: projection
    inputs:
      - "CabinCategory.onboard_spend_lower_per_night_cents and onboard_spend_upper_per_night_cents of Booking.assigned_cabin_category_id (falling back to cabin_category_id before any upgrade award)"
      - "Sailing.nights"
      - "Booking.occupancy_adults, third_berth_guests, fourth_berth_guests"
      - "Booking.itinerary_compensation_obc_cents"
    formula: |
      upper_guests = third_berth_guests + fourth_berth_guests
      projected_onboard_gross_cents =
          Sailing.nights * ( occupancy_adults * onboard_spend_lower_per_night_cents
                           + upper_guests     * onboard_spend_upper_per_night_cents )
      projected_onboard_net_cents =
          max(0, projected_onboard_gross_cents - itinerary_compensation_obc_cents)
      Onboard credit granted as itinerary compensation is spend the guest no longer
      pays for, so it is subtracted from the projection rather than added to revenue.
      Bookings whose booking_status is WAITLISTED or CANCELLED contribute 0 to
      Sailing.projected_onboard_revenue_cents regardless of their own stored projection.
    constants: {}
    precision: "integer cents; every factor is an integer so no rounding occurs"
    outputs:
      - Booking.projected_onboard_gross_cents
      - Booking.projected_onboard_net_cents

  # ------------------------------------------------------------------ 3 of 12 ---
  - name: sailing_ralbd
    trigger: "any change to a Booking of the sailing, any SailingInventory or GroupBlock change, POST /itinerary-changes/{id}/publish, POST /sailings/{id}/ops-run, GET /sailings/{id}/revenue-summary"
    algorithm_type: aggregation
    inputs:
      - "Sailing.total_lower_berths, Sailing.nights"
      - "Booking.net_ticket_cents + Booking.upgrade_charge_cents over bookings with booking_status IN {OPTION, CONFIRMED, SAILED}"
      - "Booking.projected_onboard_net_cents over the same set"
      - "Booking.itinerary_compensation_obc_cents + Booking.itinerary_refund_cents over the same set"
      - "SailingInventory.group_held_cabins (unpicked held cabins only, per calc oversell_availability) and CabinCategory.lower_berths for every allotment of the sailing"
    formula: |
      gross_ticket_revenue_cents      = sum(net_ticket_cents + upgrade_charge_cents)
      projected_onboard_revenue_cents = sum(projected_onboard_net_cents)
      compensation_liability_cents    = sum(itinerary_compensation_obc_cents + itinerary_refund_cents)
      total_revenue_cents = gross_ticket_revenue_cents
                          + projected_onboard_revenue_cents
                          - compensation_liability_cents

      group_held_lower_berths = sum over allotments of
                                  ( SailingInventory.group_held_cabins
                                    * CabinCategory.lower_berths )

      available_lower_berth_days_gross = total_lower_berths * nights
      available_lower_berth_days_net   = max(1, total_lower_berths - group_held_lower_berths) * nights

      Revenue per available lower berth day, by variant:
          ralbd_cents = round_half_up(total_revenue_cents / available_lower_berth_days_<variant>)

      revenue_alert = (ralbd_net_cents < RALBD_ALERT_FLOOR_CENTS)
      The alert comparison is strict, so a sailing sitting exactly on the floor is NOT
      flagged. revenue_alert always reads the NET variant, never the gross one.
    variants:
      GROSS_CAPACITY_BASIS: |
        Divides by available_lower_berth_days_gross, i.e. every lower berth on the ship
        counts as sellable inventory whether or not it is fenced inside a tentative
        group block. This is the published fleet-comparison number and is written to
        Sailing.ralbd_gross_cents.
      NET_CAPACITY_BASIS: |
        Divides by available_lower_berth_days_net, which removes the lower berths locked
        inside group holds from the denominator, so the metric reflects only capacity the
        revenue manager can still transact against. Because the denominator is smaller,
        this variant is always >= the gross variant whenever any group cabins are held.
        It is written to Sailing.ralbd_net_cents and is the sole driver of revenue_alert.
    constants:
      RALBD_ALERT_FLOOR_CENTS: 20000
    precision: "integer cents; round_half_up on the single division per variant"
    outputs:
      - Sailing.gross_ticket_revenue_cents
      - Sailing.projected_onboard_revenue_cents
      - Sailing.compensation_liability_cents
      - Sailing.available_lower_berth_days_gross
      - Sailing.available_lower_berth_days_net
      - Sailing.ralbd_gross_cents
      - Sailing.ralbd_net_cents
      - Sailing.revenue_alert

  # ------------------------------------------------------------------ 4 of 12 ---
  - name: cancellation_settlement
    trigger: "POST /bookings/{id}/cancel (PROVISIONAL); POST /bookings/{id}/settle-cancellation (FINAL); POST /sailings/{id}/ops-run step 6 auto-cancel (FINAL)"
    algorithm_type: threshold
    inputs:
      - "Booking.net_ticket_cents, Booking.upgrade_charge_cents, Booking.amount_paid_cents"
      - "Sailing.embark_date"
      - "the logical clock value current_utc at the evaluation instant"
    formula: |
      days_to_sail = floor((Sailing.embark_date - evaluation_instant) / 86400 seconds)

      penalty_pct is chosen from days_to_sail, evaluated from the least punitive band
      downward, with every band closed at its lower bound and open at its upper bound:
          days_to_sail >= PENALTY_FREE_DAYS                      -> 0.00
          PENALTY_T1_DAYS <= days_to_sail < PENALTY_FREE_DAYS    -> PENALTY_T1_PCT
          PENALTY_T2_DAYS <= days_to_sail < PENALTY_T1_DAYS      -> PENALTY_T2_PCT
          PENALTY_T3_DAYS <= days_to_sail < PENALTY_T2_DAYS      -> PENALTY_T3_PCT
          days_to_sail < PENALTY_T3_DAYS                         -> 1.00

      penalty_base_cents = net_ticket_cents + upgrade_charge_cents
      penalty_cents      = round_half_up(penalty_base_cents * penalty_pct)

      A booking cancelled from booking_status WAITLISTED is exempt: penalty_cents = 0
      at both variants, because a waitlisted booking never held a cabin.
    variants:
      PROVISIONAL: |
        Evaluated at the cancel instant and written to Booking.provisional_penalty_cents.
        It is a quote only: no money moves, no PaymentEvent is appended, and
        cancellation_penalty_cents and refund_cents stay null.
      FINAL: |
        Evaluated at the settle-cancellation instant and written to
        Booking.cancellation_penalty_cents. Because the clock may have advanced between
        cancel and settlement, the FINAL evaluation can land in a harsher band than the
        PROVISIONAL one, and the FINAL value is the only figure that moves cash:
            refund_cents = max(0, amount_paid_cents - cancellation_penalty_cents)
        The delta cancellation_penalty_cents - provisional_penalty_cents is the
        reconciliation amount; the provisional figure is never retroactively corrected.
    constants:
      PENALTY_FREE_DAYS: 120
      PENALTY_T1_DAYS: 90
      PENALTY_T1_PCT: 0.25
      PENALTY_T2_DAYS: 60
      PENALTY_T2_PCT: 0.50
      PENALTY_T3_DAYS: 30
      PENALTY_T3_PCT: 0.75
      DELINQUENCY_GRACE_DAYS: 7
    precision: "integer cents; round_half_up once on the penalty product; refund is exact subtraction"
    outputs:
      - Booking.provisional_penalty_cents
      - Booking.cancellation_penalty_cents
      - Booking.refund_cents

  # ------------------------------------------------------------------ 5 of 12 ---
  - name: oversell_availability
    trigger: "POST /sailing-inventories; PATCH /sailing-inventories/{id}; POST /bookings; POST /bookings/{id}/cancel; POST /group-blocks; POST /group-blocks/{id}/review; POST /upgrade-bids/{id}/accept; POST /sailings/{id}/ops-run"
    algorithm_type: constraint_propagation
    inputs:
      - "SailingInventory.physical_cabins, oversell_allowance, booked_cabins"
      - "sum of max(0, GroupBlock.cabins_held - GroupBlock.picked_up_cabins) over TENTATIVE / DEFINITE / PARTIALLY_RELEASED blocks on the same (sailing_id, cabin_category_id)"
      - "CabinCategory.is_guarantee"
    formula: |
      group_held_cabins = sum of max(0, GroupBlock.cabins_held - GroupBlock.picked_up_cabins)
          over blocks of this (sailing_id, cabin_category_id) whose status IN
          {TENTATIVE, DEFINITE, PARTIALLY_RELEASED}; RELEASED blocks contribute 0.
          Only UNPICKED held cabins are fenced: the moment a group member books, the cabin
          leaves the group fence and enters booked_cabins, so it is never counted twice.

      Oversell is permitted only on guarantee categories, and only up to a ceiling
      expressed as a share of physical inventory. The three-way nest is evaluated
      inside out and the ceil is taken before the min:
          allowance_cap = ceil(physical_cabins * OVERSELL_PCT_CAP)
          effective_oversell_cabins =
              CabinCategory.is_guarantee
                  ? max(0, min(oversell_allowance, allowance_cap))
                  : 0

      sellable_capacity = physical_cabins + effective_oversell_cabins
      available_cabins  = max(0, sellable_capacity - booked_cabins - group_held_cabins)

      The identity
          physical_cabins + effective_oversell_cabins
              == available_cabins + booked_cabins + group_held_cabins
      holds whenever available_cabins > 0, and is the compensating invariant that every
      inventory-moving transition must preserve.
    constants:
      OVERSELL_PCT_CAP: 0.10
    precision: "integers only; ceil on the allowance cap, no other rounding"
    outputs:
      - SailingInventory.group_held_cabins
      - SailingInventory.effective_oversell_cabins
      - SailingInventory.available_cabins

  # ------------------------------------------------------------------ 6 of 12 ---
  - name: group_attrition_release
    trigger: "POST /group-blocks/{id}/review; POST /sailings/{id}/ops-run step 3"
    algorithm_type: waterfall_allocation
    inputs:
      - "GroupBlock.cabins_held, GroupBlock.picked_up_cabins, GroupBlock.release_policy"
    formula: |
      unpicked = max(0, cabins_held - picked_up_cabins)
      released_now =
          release_policy == FULL_RELEASE -> unpicked
          release_policy == ATTRITION_50 -> floor(unpicked * ATTRITION_RETAIN_PCT)
      new_cabins_held = cabins_held - released_now

      Picked-up cabins are protected first; only the unpicked remainder is exposed to
      attrition. released_now == 0 is a legal outcome (a fully picked-up block, or an
      ATTRITION_50 block with a single unpicked cabin) and drives the TENTATIVE
      self-loop rather than an error.
    constants:
      ATTRITION_RETAIN_PCT: 0.5
      REVIEW_EXTENSION_DAYS: 14
    precision: "integers only; floor on the ATTRITION_50 product"
    outputs:
      - GroupBlock.cabins_held
      - GroupBlock.released_cabins_total
      - GroupBlock.review_count
      - GroupBlock.status
      - SailingInventory.group_held_cabins

  # ------------------------------------------------------------------ 7 of 12 ---
  - name: upgrade_bid_floor
    trigger: "POST /bookings/{id}/upgrade-bids; POST /upgrade-bids/{id}/counter; POST /upgrade-bids/{id}/rebid; POST /upgrade-bids/{id}/accept"
    algorithm_type: threshold
    inputs:
      - "the FareRule rows of the source and target cabin categories whose half-open window contains the bid instant's days_to_sail"
      - "CabinCategory.onboard_spend_upper_per_night_cents of the source and target categories"
      - "Sailing.nights, Booking.guest_count"
    formula: |
      days_to_sail = floor((Sailing.embark_date - current_utc) / 86400 seconds)
      Bidding is open only while
          BID_WINDOW_MIN_DAYS <= days_to_sail <= BID_WINDOW_MAX_DAYS
      otherwise ERR_BID_WINDOW_CLOSED.

      Both fares are re-derived at the bid instant, NOT taken from the booking's pinned
      fare rule, so a bid placed inside the near window is floored against near-window
      prices:
          target_base = base_lower_berth_fare_cents of the target category's current-window FareRule
          source_base = base_lower_berth_fare_cents of the source category's current-window FareRule
          fare_gap    = max(0, target_base - source_base)

      The onboard-spend uplift the line expects to earn from the richer category
      subsidises the floor:
          onboard_uplift_cents =
              Sailing.nights * Booking.guest_count
              * max(0, target.onboard_spend_upper_per_night_cents
                       - source.onboard_spend_upper_per_night_cents)

          min_acceptable_per_guest_cents =
              max(0, round_half_up(fare_gap * BID_FLOOR_PCT)
                     - round_half_up(onboard_uplift_cents / Booking.guest_count))

      A bid below the floor is rejected with ERR_BID_BELOW_FLOOR. On acceptance:
          award_amount_cents = bid_amount_per_guest_cents * guest_count
    constants:
      BID_FLOOR_PCT: 0.40
      BID_WINDOW_MIN_DAYS: 3
      BID_WINDOW_MAX_DAYS: 60
    precision: "integer cents; round_half_up on the fare-gap product and on the per-guest onboard uplift, each independently, before the subtraction"
    outputs:
      - UpgradeBid.submitted_days_to_sail
      - UpgradeBid.min_acceptable_per_guest_cents
      - UpgradeBid.countered_min_per_guest_cents
      - UpgradeBid.award_amount_cents
      - UpgradeBid.guest_count

  # ------------------------------------------------------------------ 8 of 12 ---
  - name: sailing_occupancy_posture
    trigger: "any Booking creation, promotion, cancellation or upgrade award on the sailing; POST /sailings/{id}/ops-run; POST /sailings/{id}/open-for-sale"
    algorithm_type: threshold
    inputs:
      - "Booking.occupancy_adults, third_berth_guests, fourth_berth_guests over bookings with booking_status IN {OPTION, CONFIRMED, SAILED}"
      - "Sailing.total_lower_berths, Sailing.confirmed_bookings_count, Sailing.paid_in_full_bookings_count"
    formula: |
      lower_berths_sold  = sum(occupancy_adults)
      third_berths_sold  = sum(third_berth_guests)
      fourth_berths_sold = sum(fourth_berth_guests)
      occupancy_pct = round_half_up(lower_berths_sold / total_lower_berths * 100, 2)

      inventory_posture, evaluated highest band first with inclusive floors:
          occupancy_pct >= POSTURE_FROZEN_PCT     -> FROZEN
          occupancy_pct >= POSTURE_RESTRICTED_PCT -> RESTRICTED
          otherwise                               -> OPEN
      A sailing sitting exactly on POSTURE_RESTRICTED_PCT is RESTRICTED, and exactly on
      POSTURE_FROZEN_PCT is FROZEN. The comparison uses the 2-decimal rounded
      occupancy_pct, not the raw ratio.

      Posture gates child operations:
          OPEN       -> everything allowed
          RESTRICTED -> new GroupBlock creation and Promotion activation are refused
                        (ERR_POSTURE_RESTRICTED); bookings still allowed
          FROZEN     -> new Booking creation is refused unless allow_waitlist is true,
                        in which case the booking is created WAITLISTED
                        (ERR_POSTURE_FROZEN when allow_waitlist is false)

      final_payment_risk_flag =
          confirmed_bookings_count > 0
          AND paid_in_full_bookings_count * 2 < confirmed_bookings_count
      i.e. it raises once fewer than half of the confirmed bookings have paid in full.
    constants:
      POSTURE_RESTRICTED_PCT: 90.00
      POSTURE_FROZEN_PCT: 100.00
    precision: "occupancy_pct is a number with exactly 2 decimals, round_half_up"
    outputs:
      - Sailing.lower_berths_sold
      - Sailing.third_berths_sold
      - Sailing.fourth_berths_sold
      - Sailing.occupancy_pct
      - Sailing.inventory_posture
      - Sailing.final_payment_risk_flag

  # ------------------------------------------------------------------ 9 of 12 ---
  - name: guest_loyalty_tier
    trigger: "POST /guests; POST /sailings/{id}/ops-run step 8 whenever a Booking reaches SAILED"
    algorithm_type: threshold
    inputs:
      - "Guest.prior_sailings_count"
    formula: |
      Evaluated highest band first, inclusive floors:
          prior_sailings_count >= PLATINUM_FLOOR -> PLATINUM, repeat_guest_offer_pct = PLATINUM_PCT
          prior_sailings_count >= GOLD_FLOOR     -> GOLD,     repeat_guest_offer_pct = GOLD_PCT
          prior_sailings_count >= MEMBER_FLOOR   -> MEMBER,   repeat_guest_offer_pct = MEMBER_PCT
          otherwise                              -> NONE,     repeat_guest_offer_pct = 0.00
      A tier change never reprices an existing Booking: loyalty_discount_cents was
      pinned by calc booking_fare_buildup at creation.
    constants:
      MEMBER_FLOOR: 1
      MEMBER_PCT: 0.00
      GOLD_FLOOR: 3
      GOLD_PCT: 0.03
      PLATINUM_FLOOR: 6
      PLATINUM_PCT: 0.05
    precision: "repeat_guest_offer_pct is an exact 2-decimal constant"
    outputs:
      - Guest.loyalty_tier
      - Guest.repeat_guest_offer_pct

  # ----------------------------------------------------------------- 10 of 12 ---
  - name: waitlist_promotion_selector
    trigger: "POST /group-blocks/{id}/review; POST /group-blocks/{id}/confirm-definite is NOT a trigger; POST /sailings/{id}/ops-run step 4"
    algorithm_type: chronological
    inputs:
      - "Booking rows with booking_status == WAITLISTED on the affected (sailing_id, cabin_category_id)"
      - "SailingInventory.available_cabins for that allotment"
    formula: |
      Eligibility: booking_status == WAITLISTED AND the booking's sailing_id and
      cabin_category_id equal the allotment's AND Sailing.status IN
      {OPEN_FOR_SALE, SALES_SUSPENDED}.

      Ordering, applied in this exact sequence:
          1. Booking.created_at ASC          (the queue is first-come, first-served)
          2. Booking.net_ticket_cents DESC   (tie-break on revenue)
          3. Booking.third_berth_guests DESC (tie-break toward upper-berth utilisation)
      Booking.id is never used as a tie-break.

      Promotion loop: while available_cabins >= 1 and the eligible pool is non-empty,
      take the head of the ordered pool, transition it WAITLISTED -> OPTION, then
      recompute available_cabins via calc oversell_availability before the next
      iteration. An empty eligible pool is a silent no-op, never an error.
    constants: {}
    precision: "not applicable"
    outputs:
      - Booking.booking_status
      - Booking.deposit_due_date
      - SailingInventory.booked_cabins
      - SailingInventory.waitlisted_bookings_count
      - SailingInventory.available_cabins

  # ----------------------------------------------------------------- 11 of 12 ---
  - name: itinerary_compensation
    trigger: "POST /itinerary-changes; POST /itinerary-changes/{id}/publish"
    algorithm_type: forward_looking
    inputs:
      - "ItineraryChange.kind, ItineraryChange.compensation_policy"
      - "Booking.guest_count and Booking.net_ticket_cents over bookings with booking_status IN {OPTION, CONFIRMED}"
    formula: |
      Derived at creation and frozen onto the ItineraryChange:
          obc_per_guest_cents =
              compensation_policy == OBC_PLUS_REFUND_PCT -> OBC_HIGH_PER_GUEST_CENTS
              compensation_policy == OBC_ONLY            -> OBC_LOW_PER_GUEST_CENTS
          refund_pct =
              compensation_policy == OBC_ONLY            -> 0.00
              kind == ITINERARY_SHORTENED                -> REFUND_PCT_SHORTENED
              otherwise (PORT_CANCELLED, PORT_SUBSTITUTED) -> REFUND_PCT_PORT

      On publish, for every Booking of the sailing with booking_status IN {OPTION, CONFIRMED}:
          obc_grant_cents    = obc_per_guest_cents * guest_count
          refund_grant_cents = round_half_up(net_ticket_cents * refund_pct)
          itinerary_compensation_obc_cents += obc_grant_cents
          itinerary_refund_cents           += refund_grant_cents
      and on the ItineraryChange:
          affected_bookings_count    = number of bookings touched
          total_obc_granted_cents    = sum(obc_grant_cents)
          total_refund_granted_cents = sum(refund_grant_cents)

      A second publication of a different ItineraryChange on the same sailing accumulates
      onto the same Booking fields; grants are additive, never replacing.
    constants:
      OBC_LOW_PER_GUEST_CENTS: 2500
      OBC_HIGH_PER_GUEST_CENTS: 5000
      REFUND_PCT_PORT: 0.05
      REFUND_PCT_SHORTENED: 0.10
    precision: "integer cents; round_half_up per booking on the refund product, then summed"
    outputs:
      - ItineraryChange.obc_per_guest_cents
      - ItineraryChange.refund_pct
      - ItineraryChange.affected_bookings_count
      - ItineraryChange.total_obc_granted_cents
      - ItineraryChange.total_refund_granted_cents
      - Booking.itinerary_compensation_obc_cents
      - Booking.itinerary_refund_cents

  # ----------------------------------------------------------------- 12 of 12 ---
  - name: upgrade_chain_depth
    trigger: "POST /cabin-categories"
    algorithm_type: topological
    inputs:
      - "CabinCategory.upgrade_to_category_id of the new row and of every row already stored"
    formula: |
      The upgrade hierarchy is the self-referential chain formed by
      upgrade_to_category_id. Walking from a category to its upgrade target and onward:
          upgrade_chain_length =
              upgrade_to_category_id is null -> 0
              otherwise                      -> 1 + target.upgrade_chain_length

      A category may only point at a strictly richer category:
          target.tier_rank > this.tier_rank      else ERR_UPGRADE_PATH_INVALID
      Because tier_rank is unique and strictly increases along every edge, the graph is
      acyclic by construction and the walk always terminates; a self-reference or any
      cycle is rejected by the same tier_rank check.

      Creating a category that is the new target of an existing category is not possible
      (upgrade_to_category_id must already exist at creation time), so chain lengths are
      assigned once and never re-derived.
    constants: {}
    precision: "integers only"
    outputs:
      - CabinCategory.upgrade_chain_length

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:

  # ---- 1-3: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request, including POST /_clock/set_current_utc"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator, Guest"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  # ---- 4: request shape ----------------------------------------------------
  - priority: 4
    category: business_constraint
    check: "request body and query parameters are well-formed: every required input field present, every enum value inside its declared set, every integer within its declared range, discount_pct in (0, 0.5], occupancy_adults IN {1,2}, third_berth_guests IN {0,1}, fourth_berth_guests IN {0,1}, limit in [1,100], offset >= 0, datetimes parseable ISO 8601 UTC, FareRule.window_open_days_to_sail > window_close_days_to_sail, Promotion.ends_on >= starts_on, CabinCategory.max_occupancy in [2,4], and every uniqueness constraint declared in §1.1 satisfied (voyage_code, CabinCategory.code, CabinCategory.tier_rank, Guest.email, Promotion.code per sailing)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    note: "Uniqueness collisions surface as the specific ERR_DUPLICATE_* codes in §1.6 at this same priority; the dedicated code wins over the generic one."

  # ---- 5-6: existence ------------------------------------------------------
  - priority: 5
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: ERR_SAILING_NOT_FOUND | ERR_CABIN_CATEGORY_NOT_FOUND | ERR_SAILING_INVENTORY_NOT_FOUND | ERR_FARE_RULE_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_GROUP_BLOCK_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_UPGRADE_BID_NOT_FOUND | ERR_ITINERARY_CHANGE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "every foreign key in the request body resolves to a stored row, validated in the field order declared in §1.1 (sailing_id, then cabin_category_id / target_cabin_category_id, then guest_id, then group_block_id, then promotion_id)"
    error_id: ERR_SAILING_NOT_FOUND | ERR_CABIN_CATEGORY_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_GROUP_BLOCK_NOT_FOUND | ERR_PROMOTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /sailing-inventories, POST /fare-rules, POST /promotions, POST /group-blocks, POST /bookings, POST /bookings/{id}/upgrade-bids, POST /itinerary-changes, POST /cabin-categories"

  # ---- 7-8: ownership and segregation of duties ----------------------------
  - priority: 7
    category: auth
    check: "when X-User-Role is Guest, X-User-ID equals the Booking's guest_id (for booking-scoped calls) or the UpgradeBid's Booking.guest_id"
    error_id: ERR_NOT_BOOKING_OWNER
    http_status: 403
    applies_to: "GET /bookings/{id}, POST /bookings/{id}/cancel, POST /bookings/{id}/upgrade-bids, POST /upgrade-bids/{id}/rebid, GET /upgrade-bids/{id}, GET /bookings/{id}/payment-events"

  - priority: 8
    category: auth
    check: "X-User-ID differs from GroupBlock.created_by_user_id: the agent who created a tentative block may not be the agent who signs it definite"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /group-blocks/{id}/confirm-definite"

  # ---- 9: optimistic concurrency ------------------------------------------
  - priority: 9
    category: state
    check: "expected_inventory_version equals SailingInventory.version; expected_sailing_version equals Sailing.version"
    error_id: ERR_STALE_INVENTORY_VERSION | ERR_STALE_SAILING_VERSION
    http_status: 412
    applies_to: "PATCH /sailing-inventories/{id}, POST /promotions"

  # ---- 10-11: state preconditions ----------------------------------------
  - priority: 10
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_SAILING_NOT_PLANNED | ERR_SAILING_NOT_OPEN | ERR_SAILING_NOT_SUSPENDED | ERR_SAILING_ALREADY_SAILED | ERR_BOOKING_NOT_IN_OPTION | ERR_BOOKING_NOT_ACTIVE | ERR_BOOKING_NOT_AWAITING_SETTLEMENT | ERR_PAYMENT_STATE_INVALID | ERR_GROUP_BLOCK_NOT_TENTATIVE | ERR_GROUP_BLOCK_CLOSED | ERR_PROMOTION_NOT_SCHEDULED | ERR_PROMOTION_ALREADY_CLOSED | ERR_BID_NOT_PENDING | ERR_BID_NOT_COUNTERED | ERR_ITINERARY_CHANGE_NOT_DRAFT
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 11
    category: state
    check: "cross-entity state guards: Sailing.status IN {OPEN_FOR_SALE, SALES_SUSPENDED} to create a Booking or GroupBlock; Sailing.status == OPEN_FOR_SALE to confirm a Booking; GroupBlock.status == DEFINITE for any Booking carrying group_block_id to be confirmed; Booking.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} to confirm a Booking; Booking.booking_status IN {OPTION, CONFIRMED} to submit an UpgradeBid"
    error_id: ERR_SAILING_NOT_OPEN | ERR_GROUP_BLOCK_NOT_DEFINITE | ERR_DEPOSIT_NOT_PAID | ERR_BOOKING_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/confirm, POST /group-blocks, POST /bookings/{id}/upgrade-bids"

  # ---- 12-13: berth safety and oversell policy ----------------------------
  - priority: 12
    category: business_safety
    check: "the requested party fits the cabin: occupancy_adults + third_berth_guests + fourth_berth_guests <= CabinCategory.max_occupancy, and occupancy_adults <= CabinCategory.lower_berths. On an upgrade award the same check runs against the target category."
    error_id: ERR_MAX_OCCUPANCY_EXCEEDED
    http_status: 422
    applies_to: "POST /bookings, POST /upgrade-bids/{id}/accept"

  - priority: 13
    category: business_safety
    check: "berths fill in order: fourth_berth_guests == 1 requires third_berth_guests == 1; a fourth berth may never be sold over an empty third berth"
    error_id: ERR_BERTH_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 14
    category: business_safety
    check: "oversell_allowance > 0 is accepted only when the allotment's CabinCategory.is_guarantee is true; a named category may never be oversold"
    error_id: ERR_OVERSELL_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /sailing-inventories, PATCH /sailing-inventories/{id}"

  # ---- 15-16: temporal windows -------------------------------------------
  - priority: 15
    category: business_temporal
    check: "a FareRule exists for the booking's (sailing_id, cabin_category_id) whose half-open window contains booked_days_to_sail; for an UpgradeBid the same must hold for both the source and target categories at the bid instant"
    error_id: ERR_NO_FARE_RULE_FOR_WINDOW
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/upgrade-bids, POST /upgrade-bids/{id}/counter, POST /upgrade-bids/{id}/rebid, POST /upgrade-bids/{id}/accept"

  - priority: 16
    category: business_temporal
    check: "temporal window integrity: BID_WINDOW_MIN_DAYS <= days_to_sail <= BID_WINDOW_MAX_DAYS for any bid operation (ERR_BID_WINDOW_CLOSED); current_utc >= GroupBlock.review_date to review a block (ERR_REVIEW_DATE_NOT_REACHED); a new review date is strictly after current_utc (ERR_REVIEW_DATE_IN_PAST); a new FareRule's half-open window must not overlap an existing rule for the same (sailing_id, cabin_category_id) - touching at a shared endpoint is allowed (ERR_FARE_WINDOW_OVERLAP); a new Promotion's closed interval must be separated from every existing non-WITHDRAWN Promotion interval on the same sailing by at least PROMO_CADENCE_GAP_DAYS whole days (ERR_PROMO_CADENCE_CONFLICT); Promotion.starts_on <= current_utc <= ends_on to activate (ERR_PROMO_WINDOW_NOT_CURRENT); current_utc <= Booking.final_payment_due_date to post a FINAL_PAYMENT from DEPOSIT_PAID (ERR_FINAL_PAYMENT_OVERDUE)"
    error_id: ERR_BID_WINDOW_CLOSED | ERR_REVIEW_DATE_NOT_REACHED | ERR_REVIEW_DATE_IN_PAST | ERR_FARE_WINDOW_OVERLAP | ERR_PROMO_CADENCE_CONFLICT | ERR_PROMO_WINDOW_NOT_CURRENT | ERR_FINAL_PAYMENT_OVERDUE
    http_status: 422
    applies_to: "POST /fare-rules, POST /promotions, POST /promotions/{id}/activate, POST /group-blocks/{id}/review, POST /group-blocks/{id}/extend-review, POST /bookings/{id}/upgrade-bids, POST /upgrade-bids/{id}/counter, POST /upgrade-bids/{id}/rebid, POST /upgrade-bids/{id}/accept, POST /bookings/{id}/payments"
    constants:
      PROMO_CADENCE_GAP_DAYS: 7
      DELINQUENCY_GRACE_DAYS: 7

  # ---- 17: referential / hierarchy integrity ------------------------------
  - priority: 17
    category: business_referential
    check: "graph integrity of the upgrade hierarchy and of promotion audiences: CabinCategory.upgrade_to_category_id must point at a category with a strictly greater tier_rank; an UpgradeBid's target_cabin_category_id must be reachable from the booking's current assigned_cabin_category_id by following upgrade_to_category_id one or more times (ERR_UPGRADE_PATH_INVALID); a quoted Promotion's audience must match the booking (GENERAL always; REPEAT_GUEST requires Guest.loyalty_tier != NONE; GROUP requires a non-null group_block_id) (ERR_PROMO_AUDIENCE_MISMATCH); a Booking's group_block_id must reference a GroupBlock whose sailing_id and cabin_category_id both equal the booking's (ERR_GROUP_BLOCK_MISMATCH); a SailingInventory, FareRule, GroupBlock or Booking may not reference a cabin_category_id that has no SailingInventory row on that sailing, except for the SailingInventory row itself (ERR_CATEGORY_NOT_ON_SAILING)"
    error_id: ERR_UPGRADE_PATH_INVALID | ERR_PROMO_AUDIENCE_MISMATCH | ERR_GROUP_BLOCK_MISMATCH | ERR_CATEGORY_NOT_ON_SAILING
    http_status: 422
    applies_to: "POST /cabin-categories, POST /bookings, POST /bookings/{id}/upgrade-bids, POST /group-blocks, POST /fare-rules"

  # ---- 18: posture gates --------------------------------------------------
  - priority: 18
    category: business_constraint
    check: "Sailing.inventory_posture gates child writes: RESTRICTED blocks GroupBlock creation and Promotion activation (ERR_POSTURE_RESTRICTED); FROZEN additionally blocks Booking creation unless request.allow_waitlist is true (ERR_POSTURE_FROZEN)"
    error_id: ERR_POSTURE_RESTRICTED | ERR_POSTURE_FROZEN
    http_status: 422
    applies_to: "POST /bookings, POST /group-blocks, POST /promotions/{id}/activate"

  # ---- 19: capacity and counters -----------------------------------------
  - priority: 19
    category: business_constraint
    check: "capacity and bounded-cycle counters: SailingInventory.available_cabins >= 1 to create a non-waitlisted Booking, otherwise the booking is created WAITLISTED when allow_waitlist is true and rejected with ERR_CATEGORY_SOLD_OUT when it is false; a Booking carrying group_block_id draws from its own fence instead, so the check becomes GroupBlock.cabins_held - GroupBlock.picked_up_cabins >= 1 (ERR_GROUP_BLOCK_EXHAUSTED) and such a booking is never waitlisted; SailingInventory.available_cabins >= request.cabins_held to create a GroupBlock (ERR_INSUFFICIENT_GROUP_INVENTORY); SailingInventory.available_cabins >= 1 on the target allotment to accept an UpgradeBid (ERR_TARGET_CATEGORY_UNAVAILABLE); at most one SailingInventory row per (sailing_id, cabin_category_id) (ERR_DUPLICATE_INVENTORY); Sailing.suspension_count < MAX_SALES_SUSPENSIONS (ERR_SUSPENSION_LIMIT_REACHED); UpgradeBid.counter_rounds < MAX_COUNTER_ROUNDS (ERR_MAX_COUNTER_ROUNDS_EXCEEDED); GroupBlock.review_extension_count < MAX_REVIEW_EXTENSIONS (ERR_MAX_REVIEW_EXTENSIONS_EXCEEDED); a Sailing must have at least one SailingInventory row and one FareRule to open for sale (ERR_SAILING_NOT_SELLABLE)"
    error_id: ERR_CATEGORY_SOLD_OUT | ERR_GROUP_BLOCK_EXHAUSTED | ERR_INSUFFICIENT_GROUP_INVENTORY | ERR_TARGET_CATEGORY_UNAVAILABLE | ERR_DUPLICATE_INVENTORY | ERR_SUSPENSION_LIMIT_REACHED | ERR_MAX_COUNTER_ROUNDS_EXCEEDED | ERR_MAX_REVIEW_EXTENSIONS_EXCEEDED | ERR_SAILING_NOT_SELLABLE
    http_status: 422
    applies_to: "POST /bookings, POST /group-blocks, POST /sailing-inventories, POST /sailings/{id}/suspend-sales, POST /sailings/{id}/open-for-sale, POST /upgrade-bids/{id}/counter, POST /upgrade-bids/{id}/accept, POST /group-blocks/{id}/extend-review"
    constants:
      MAX_SALES_SUSPENSIONS: 2
      MAX_COUNTER_ROUNDS: 2
      MAX_REVIEW_EXTENSIONS: 2

  # ---- 20: money ---------------------------------------------------------
  - priority: 20
    category: business_fiscal
    check: "money gates, checked last: a DEPOSIT payment must be at least Booking.deposit_due_cents (ERR_DEPOSIT_BELOW_MINIMUM); no payment may exceed Booking.balance_due_cents (ERR_PAYMENT_EXCEEDS_BALANCE); a FINAL_PAYMENT must equal balance_due_cents exactly, a smaller amount must be posted as PARTIAL (ERR_FINAL_PAYMENT_SHORT); a quoted Promotion must be ACTIVE (ERR_PROMOTION_NOT_ACTIVE) with redemption_count < max_redemptions (ERR_PROMO_EXHAUSTED); a bid amount must be >= the applicable floor, which is countered_min_per_guest_cents once a counter exists and min_acceptable_per_guest_cents otherwise (ERR_BID_BELOW_FLOOR); a guarantee assignment target must be a non-guarantee category on the same sailing and the booking must have been sold into a guarantee category (ERR_NOT_GUARANTEE_BOOKING)"
    error_id: ERR_DEPOSIT_BELOW_MINIMUM | ERR_PAYMENT_EXCEEDS_BALANCE | ERR_FINAL_PAYMENT_SHORT | ERR_PROMOTION_NOT_ACTIVE | ERR_PROMO_EXHAUSTED | ERR_BID_BELOW_FLOOR | ERR_NOT_GUARANTEE_BOOKING
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/payments, POST /bookings/{id}/upgrade-bids, POST /upgrade-bids/{id}/rebid, POST /upgrade-bids/{id}/accept, POST /bookings/{id}/assign-guarantee"

# =============================================================================
# 1.5 API Endpoint Table  (flat top-level collections; api_prefix is "")
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Sailing ---
  - method: POST
    path: "/sailings"
    description: "Create a voyage in PLANNED status."
    roles: [RevenueManager]
    code: 201
    input: [ship_code, voyage_code, embark_date, nights, total_lower_berths, "final_payment_days_before?", "deposit_due_days_after_booking?"]
    output: Sailing
    side_effects:
      - "status = PLANNED"
      - "available_lower_berth_days_gross = total_lower_berths * nights; available_lower_berth_days_net = same value (no group holds yet)"
      - "occupancy_pct = 0.00; inventory_posture = OPEN; ralbd_gross_cents = 0; ralbd_net_cents = 0; revenue_alert = true (calc sailing_ralbd)"

  - method: GET
    path: "/sailings/{id}"
    description: "Read one voyage with all derived revenue fields."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator, Guest]
    code: 200
    input: []
    output: Sailing
    side_effects: []

  - method: GET
    path: "/sailings"
    description: "List voyages with filtering and pagination."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator]
    code: 200
    input: ["ship_code?", "voyage_code?", "status?", "inventory_posture?", "revenue_alert?", "limit?", "offset?"]
    output: Sailing[]
    side_effects: []

  - method: POST
    path: "/sailings/{id}/open-for-sale"
    description: "PLANNED -> OPEN_FOR_SALE. Requires at least one SailingInventory row and one FareRule."
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects:
      - "state_machines.Sailing PLANNED -> OPEN_FOR_SALE"
      - "recompute calc sailing_ralbd and calc sailing_occupancy_posture"
      - "increments Sailing.version by 1"

  - method: POST
    path: "/sailings/{id}/suspend-sales"
    description: "OPEN_FOR_SALE -> SALES_SUSPENDED, bounded by MAX_SALES_SUSPENSIONS."
    roles: [RevenueManager]
    code: 200
    input: [reason]
    output: Sailing
    side_effects:
      - "state_machines.Sailing OPEN_FOR_SALE -> SALES_SUSPENDED"
      - "suspension_count += 1; suspension_reason = reason"
      - "increments Sailing.version by 1"

  - method: POST
    path: "/sailings/{id}/resume-sales"
    description: "SALES_SUSPENDED -> OPEN_FOR_SALE, closing the suspension cycle."
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects:
      - "state_machines.Sailing SALES_SUSPENDED -> OPEN_FOR_SALE"
      - "suspension_reason = null"
      - "increments Sailing.version by 1"

  - method: POST
    path: "/sailings/{id}/close-inventory"
    description: "Close the sailing to new business; cancels every WAITLISTED booking."
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects:
      - "state_machines.Sailing {OPEN_FOR_SALE, SALES_SUSPENDED} -> INVENTORY_CLOSED"
      - "every WAITLISTED Booking of the sailing transitions to CANCELLED with cancel_reason = 'INVENTORY_CLOSED'"
      - "recompute SailingInventory.waitlisted_bookings_count for each affected allotment"
      - "increments Sailing.version by 1"

  - method: POST
    path: "/sailings/{id}/ops-run"
    description: |
      Operator-driven maintenance sweep for one sailing, executed in this fixed step
      order against the current logical clock:
        1. expire Promotions whose ends_on < current_utc
        2. activate SCHEDULED Promotions whose window contains current_utc
        3. review every GroupBlock whose review_date <= current_utc (calc group_attrition_release)
        4. promote waitlisted Bookings into freed cabins (calc waitlist_promotion_selector)
        5. mark overdue Bookings DELINQUENT
        6. auto-cancel Bookings whose delinquency grace period has elapsed, assessing the FINAL cancellation penalty
        7. expire UpgradeBids whose days_to_sail has fallen below BID_WINDOW_MIN_DAYS
        8. when current_utc >= embark_date, transition the Sailing to SAILED, its CONFIRMED Bookings to SAILED, and bump each traveller's Guest.prior_sailings_count
        9. recompute calc sailing_occupancy_posture and calc sailing_ralbd
      Steps whose candidate set is empty are silent no-ops.
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects:
      - "all nine steps above, in order"
      - "increments Sailing.version by 1"

  - method: GET
    path: "/sailings/{id}/revenue-summary"
    description: "Computed read: recomputes and returns the sailing with its occupancy, RALBD and compensation-liability fields refreshed from current child state."
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects:
      - "recompute calc sailing_occupancy_posture and calc sailing_ralbd (read-through refresh; does not increment Sailing.version)"

  # ------------------------------------------------------- CabinCategory ---
  - method: POST
    path: "/cabin-categories"
    description: "Create a cabin category and place it in the upgrade hierarchy."
    roles: [RevenueManager]
    code: 201
    input: [code, tier_rank, max_occupancy, onboard_spend_lower_per_night_cents, onboard_spend_upper_per_night_cents, "is_guarantee?", "lower_berths?", "upgrade_to_category_id?"]
    output: CabinCategory
    side_effects:
      - "calc upgrade_chain_depth sets upgrade_chain_length"

  - method: GET
    path: "/cabin-categories/{id}"
    description: "Read one cabin category."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator, Guest]
    code: 200
    input: []
    output: CabinCategory
    side_effects: []

  - method: GET
    path: "/cabin-categories"
    description: "List cabin categories; filter by guarantee flag or by upgrade target to walk the hierarchy backwards."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator, Guest]
    code: 200
    input: ["is_guarantee?", "upgrade_to_category_id?", "code?", "limit?", "offset?"]
    output: CabinCategory[]
    side_effects: []

  # ---------------------------------------------------- SailingInventory ---
  - method: POST
    path: "/sailing-inventories"
    description: "Create the allotment of one cabin category on one sailing."
    roles: [RevenueManager]
    code: 201
    input: [sailing_id, cabin_category_id, physical_cabins, "oversell_allowance?"]
    output: SailingInventory
    side_effects:
      - "calc oversell_availability sets effective_oversell_cabins, group_held_cabins and available_cabins"

  - method: GET
    path: "/sailing-inventories/{id}"
    description: "Read one allotment."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator]
    code: 200
    input: []
    output: SailingInventory
    side_effects: []

  - method: GET
    path: "/sailing-inventories"
    description: "List allotments; filter by sailing or by cabin category."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator]
    code: 200
    input: ["sailing_id?", "cabin_category_id?", "limit?", "offset?"]
    output: SailingInventory[]
    side_effects: []

  - method: PATCH
    path: "/sailing-inventories/{id}"
    description: "Re-set the guarantee-category oversell allowance. Optimistic concurrency on the allotment's own version (concurrency_rules oversell-adjust-stale-inventory)."
    roles: [RevenueManager]
    code: 200
    input: [oversell_allowance, expected_inventory_version]
    output: SailingInventory
    side_effects:
      - "oversell_allowance = request value"
      - "calc oversell_availability recomputes effective_oversell_cabins and available_cabins"
      - "increments SailingInventory.version by 1"

  # ------------------------------------------------------------ FareRule ---
  - method: POST
    path: "/fare-rules"
    description: "Declare the fare for one cabin category inside one half-open booking window."
    roles: [RevenueManager]
    code: 201
    input: [sailing_id, cabin_category_id, window_open_days_to_sail, window_close_days_to_sail, base_lower_berth_fare_cents, third_berth_fare_cents, fourth_berth_fare_cents]
    output: FareRule
    side_effects:
      - "bookings_pinned_count = 0"

  - method: GET
    path: "/fare-rules/{id}"
    description: "Read one fare rule."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent]
    code: 200
    input: []
    output: FareRule
    side_effects: []

  - method: GET
    path: "/fare-rules"
    description: "List fare rules; filter by sailing or cabin category."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent]
    code: 200
    input: ["sailing_id?", "cabin_category_id?", "limit?", "offset?"]
    output: FareRule[]
    side_effects: []

  # ----------------------------------------------------------- Promotion ---
  - method: POST
    path: "/promotions"
    description: "Schedule a promotional campaign on a sailing. Optimistic concurrency on the parent Sailing's version (concurrency_rules promotion-create-stale-sailing); the PROMO_CADENCE_GAP_DAYS spacing check runs against every non-WITHDRAWN campaign already on the sailing."
    roles: [RevenueManager]
    code: 201
    input: [sailing_id, code, audience, discount_pct, starts_on, ends_on, max_redemptions, expected_sailing_version]
    output: Promotion
    side_effects:
      - "status = SCHEDULED; redemption_count = 0"
      - "increments Sailing.version by 1"

  - method: GET
    path: "/promotions/{id}"
    description: "Read one promotion."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: GET
    path: "/promotions"
    description: "List promotions; filter by sailing, status or audience."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent]
    code: 200
    input: ["sailing_id?", "status?", "audience?", "code?", "limit?", "offset?"]
    output: Promotion[]
    side_effects: []

  - method: POST
    path: "/promotions/{id}/activate"
    description: "SCHEDULED -> ACTIVE. Refused when the sailing's inventory_posture is RESTRICTED or FROZEN."
    roles: [RevenueManager]
    code: 200
    input: []
    output: Promotion
    side_effects:
      - "state_machines.Promotion SCHEDULED -> ACTIVE"
      - "increments Promotion.version by 1"

  - method: POST
    path: "/promotions/{id}/withdraw"
    description: "Pull a campaign. Bookings that already quoted it keep their pinned discount."
    roles: [RevenueManager]
    code: 200
    input: [reason]
    output: Promotion
    side_effects:
      - "state_machines.Promotion {SCHEDULED, ACTIVE} -> WITHDRAWN"
      - "withdraw_reason = reason"
      - "increments Promotion.version by 1"

  # ---------------------------------------------------------- GroupBlock ---
  - method: POST
    path: "/group-blocks"
    description: "Place a tentative hold on cabins for a travel agency, with a review date and a release policy."
    roles: [GroupSalesAgent]
    code: 201
    input: [sailing_id, cabin_category_id, agency_name, cabins_held, review_date, release_policy]
    output: GroupBlock
    side_effects:
      - "status = TENTATIVE; created_by_user_id = X-User-ID"
      - "calc oversell_availability recomputes SailingInventory.group_held_cabins and available_cabins"
      - "calc sailing_ralbd recomputes Sailing.available_lower_berth_days_net, ralbd_gross_cents, ralbd_net_cents and revenue_alert"

  - method: GET
    path: "/group-blocks/{id}"
    description: "Read one group block."
    roles: [RevenueManager, GroupSalesAgent, ReservationAgent]
    code: 200
    input: []
    output: GroupBlock
    side_effects: []

  - method: GET
    path: "/group-blocks"
    description: "List group blocks; filter by sailing, cabin category or status."
    roles: [RevenueManager, GroupSalesAgent, ReservationAgent]
    code: 200
    input: ["sailing_id?", "cabin_category_id?", "status?", "limit?", "offset?"]
    output: GroupBlock[]
    side_effects: []

  - method: POST
    path: "/group-blocks/{id}/confirm-definite"
    description: "Sign a tentative block into a contracted one. Four-eyes rule: X-User-ID must differ from created_by_user_id."
    roles: [GroupSalesAgent]
    code: 200
    input: [contract_reference]
    output: GroupBlock
    side_effects:
      - "state_machines.GroupBlock TENTATIVE -> DEFINITE"
      - "confirmed_by_user_id = X-User-ID; contract_reference = request value"
      - "increments GroupBlock.version by 1"

  - method: POST
    path: "/group-blocks/{id}/review"
    description: "Run the review-date release policy. Releases unpicked cabins per calc group_attrition_release, then promotes waitlisted bookings into whatever was freed."
    roles: [GroupSalesAgent]
    code: 200
    input: []
    output: GroupBlock
    side_effects:
      - "calc group_attrition_release computes released_now and the resulting status (PARTIALLY_RELEASED, RELEASED, or the TENTATIVE zero-release self-loop)"
      - "calc oversell_availability recomputes SailingInventory.group_held_cabins, released_cabins_total and available_cabins"
      - "calc waitlist_promotion_selector promotes WAITLISTED bookings to OPTION while available_cabins >= 1"
      - "calc sailing_occupancy_posture and calc sailing_ralbd recompute the Sailing aggregates"
      - "increments GroupBlock.version by 1"

  - method: POST
    path: "/group-blocks/{id}/extend-review"
    description: "Push the review date out, returning a partially released block to TENTATIVE. Bounded by MAX_REVIEW_EXTENSIONS."
    roles: [GroupSalesAgent]
    code: 200
    input: [new_review_date]
    output: GroupBlock
    side_effects:
      - "state_machines.GroupBlock {TENTATIVE, PARTIALLY_RELEASED} -> TENTATIVE"
      - "review_date = new_review_date; review_extension_count += 1"
      - "increments GroupBlock.version by 1"

  # --------------------------------------------------------------- Guest ---
  - method: POST
    path: "/guests"
    description: "Create a guest profile; loyalty tier and repeat-guest offer are derived from prior_sailings_count."
    roles: [ReservationAgent]
    code: 201
    input: [full_name, email, "prior_sailings_count?"]
    output: Guest
    side_effects:
      - "calc guest_loyalty_tier sets loyalty_tier and repeat_guest_offer_pct"

  - method: GET
    path: "/guests/{id}"
    description: "Read one guest."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/guests"
    description: "List guests; filter by email or loyalty tier."
    roles: [RevenueManager, ReservationAgent]
    code: 200
    input: ["email?", "loyalty_tier?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  # ------------------------------------------------------------- Booking ---
  - method: POST
    path: "/bookings"
    description: "Sell a cabin. Prices the booking through calc booking_fare_buildup, projects onboard spend, and consumes one cabin of the allotment - or creates the booking WAITLISTED when the allotment is exhausted and allow_waitlist is true."
    roles: [ReservationAgent]
    code: 201
    input: [sailing_id, cabin_category_id, guest_id, occupancy_adults, "third_berth_guests?", "fourth_berth_guests?", "group_block_id?", "promotion_id?", "allow_waitlist?"]
    output: Booking
    side_effects:
      - "booking_status = OPTION when a cabin is available, otherwise WAITLISTED; payment_status = AWAITING_DEPOSIT"
      - "calc booking_fare_buildup pins fare_rule_id, pinned_fare_rule_version and every money field"
      - "calc booking_onboard_projection sets projected_onboard_gross_cents and projected_onboard_net_cents"
      - "assigned_cabin_category_id = cabin_category_id"
      - "FareRule.bookings_pinned_count += 1"
      - "Promotion.redemption_count += 1 when promotion_id is set, transitioning the Promotion ACTIVE -> EXHAUSTED when the cap is reached"
      - "Guest.bookings_count += 1"
      - "SailingInventory.booked_cabins += 1 (OPTION) or waitlisted_bookings_count += 1 (WAITLISTED); calc oversell_availability recomputes available_cabins"
      - "GroupBlock.picked_up_cabins += 1 when group_block_id is set, which lowers SailingInventory.group_held_cabins by 1 as the cabin moves out of the group fence and into booked_cabins"
      - "calc sailing_occupancy_posture and calc sailing_ralbd recompute the Sailing aggregates"

  - method: GET
    path: "/bookings/{id}"
    description: "Read one booking. A Guest may only read their own."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings; every foreign key is a filter, so children are reachable from any parent id."
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent]
    code: 200
    input: ["sailing_id?", "cabin_category_id?", "assigned_cabin_category_id?", "guest_id?", "group_block_id?", "promotion_id?", "fare_rule_id?", "booking_status?", "payment_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/confirm"
    description: "OPTION -> CONFIRMED. Requires a paid deposit, an OPEN_FOR_SALE sailing, and - for a group booking - a DEFINITE block."
    roles: [ReservationAgent]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "state_machines.Booking booking_status OPTION -> CONFIRMED"
      - "Sailing.confirmed_bookings_count += 1; Sailing.final_payment_risk_flag recomputed"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/payments"
    description: "Post a DEPOSIT, PARTIAL or FINAL_PAYMENT against the booking; returns the appended immutable PaymentEvent."
    roles: [ReservationAgent]
    code: 201
    input: [kind, amount_cents]
    output: PaymentEvent
    side_effects:
      - "append an immutable PaymentEvent with posted_at = current_utc and resulting_payment_status"
      - "Booking.amount_paid_cents and balance_due_cents recomputed"
      - "Booking.payment_status advances along the payment dimension (AWAITING_DEPOSIT -> DEPOSIT_PAID -> PAID_IN_FULL, or the DELINQUENT cure path)"
      - "Sailing.paid_in_full_bookings_count and final_payment_risk_flag recomputed when the booking reaches PAID_IN_FULL"
      - "increments Booking.version by 1"

  - method: GET
    path: "/bookings/{id}/payment-events"
    description: "The append-only payment ledger of one booking, ordered by posted_at ASC then created_at ASC."
    roles: [RevenueManager, ReservationAgent, Guest]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: PaymentEvent[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking and quote the PROVISIONAL cancellation penalty. Releases the cabin back to the allotment without promoting the waitlist."
    roles: [ReservationAgent, Guest]
    code: 200
    input: [reason]
    output: Booking
    side_effects:
      - "state_machines.Booking booking_status {WAITLISTED, OPTION, CONFIRMED} -> CANCELLED and payment_status -> PENALTY_ASSESSED"
      - "calc cancellation_settlement PROVISIONAL variant sets provisional_penalty_cents; no money moves"
      - "SailingInventory counters and available_cabins recomputed via calc oversell_availability"
      - "Promotion.redemption_count -= 1 when promotion_id is set; GroupBlock.picked_up_cabins recomputed when group_block_id is set"
      - "calc sailing_occupancy_posture and calc sailing_ralbd recompute the Sailing aggregates"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/settle-cancellation"
    description: "Close out a cancelled booking: re-evaluates the penalty with the FINAL variant at the settlement instant and refunds the remainder."
    roles: [RevenueManager]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "state_machines.Booking payment_status PENALTY_ASSESSED -> REFUNDED"
      - "calc cancellation_settlement FINAL variant sets cancellation_penalty_cents and refund_cents"
      - "append a PaymentEvent of kind REFUND when refund_cents > 0"
      - "settled_at = current_utc"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/assign-guarantee"
    description: "Assign a named cabin category to a booking sold into a guarantee (GTY) category, close to sailing. Moves the cabin count between the two allotments without changing the fare."
    roles: [ReservationAgent]
    code: 200
    input: [assigned_cabin_category_id]
    output: Booking
    side_effects:
      - "assigned_cabin_category_id = request value; net_ticket_cents is unchanged (the guarantee fare is honoured)"
      - "SailingInventory of the guarantee category: booked_cabins -= 1; SailingInventory of the named category: booked_cabins += 1; calc oversell_availability recomputes both available_cabins"
      - "calc booking_onboard_projection recomputes projected_onboard_gross_cents and projected_onboard_net_cents against the named category's spend indices"
      - "calc sailing_ralbd recomputes Sailing.projected_onboard_revenue_cents, ralbd_gross_cents, ralbd_net_cents and revenue_alert"
      - "increments Booking.version by 1"

  # ---------------------------------------------------------- UpgradeBid ---
  - method: POST
    path: "/bookings/{id}/upgrade-bids"
    description: "Submit an upgrade bid on a booking, inside the BID_WINDOW_MIN_DAYS..BID_WINDOW_MAX_DAYS window. The floor is derived at the bid instant from near-window fares net of the expected onboard-spend uplift."
    roles: [Guest, ReservationAgent]
    code: 201
    input: [target_cabin_category_id, bid_amount_per_guest_cents]
    output: UpgradeBid
    side_effects:
      - "status = SUBMITTED; counter_rounds = 0"
      - "calc upgrade_bid_floor sets submitted_days_to_sail, guest_count and min_acceptable_per_guest_cents"

  - method: GET
    path: "/upgrade-bids/{id}"
    description: "Read one upgrade bid. A Guest may only read bids on their own bookings."
    roles: [RevenueManager, ReservationAgent, Guest]
    code: 200
    input: []
    output: UpgradeBid
    side_effects: []

  - method: GET
    path: "/upgrade-bids"
    description: "List upgrade bids; filter by booking or by target cabin category."
    roles: [RevenueManager, ReservationAgent]
    code: 200
    input: ["booking_id?", "target_cabin_category_id?", "status?", "limit?", "offset?"]
    output: UpgradeBid[]
    side_effects: []

  - method: POST
    path: "/upgrade-bids/{id}/counter"
    description: "SUBMITTED -> COUNTERED: publish a re-derived floor back to the guest. Bounded by MAX_COUNTER_ROUNDS."
    roles: [RevenueManager]
    code: 200
    input: []
    output: UpgradeBid
    side_effects:
      - "state_machines.UpgradeBid SUBMITTED -> COUNTERED"
      - "counter_rounds += 1; calc upgrade_bid_floor re-evaluated into countered_min_per_guest_cents"
      - "increments UpgradeBid.version by 1"

  - method: POST
    path: "/upgrade-bids/{id}/rebid"
    description: "COUNTERED -> SUBMITTED: the guest raises the bid to at least the countered floor, closing the negotiation cycle."
    roles: [Guest]
    code: 200
    input: [bid_amount_per_guest_cents]
    output: UpgradeBid
    side_effects:
      - "state_machines.UpgradeBid COUNTERED -> SUBMITTED"
      - "bid_amount_per_guest_cents = request value; min_acceptable_per_guest_cents = countered_min_per_guest_cents"
      - "increments UpgradeBid.version by 1"

  - method: POST
    path: "/upgrade-bids/{id}/accept"
    description: "Award the upgrade: moves the booking to the target category, charges the award, and declines every sibling bid on the same booking."
    roles: [RevenueManager]
    code: 200
    input: []
    output: UpgradeBid
    side_effects:
      - "state_machines.UpgradeBid SUBMITTED -> ACCEPTED"
      - "award_amount_cents = bid_amount_per_guest_cents * guest_count"
      - "Booking.assigned_cabin_category_id and upgrade_charge_cents updated; a PaymentEvent of kind UPGRADE_CHARGE is appended"
      - "both SailingInventory rows recomputed via calc oversell_availability"
      - "calc booking_onboard_projection and calc sailing_ralbd recomputed"
      - "sibling UpgradeBids in {SUBMITTED, COUNTERED} transition to DECLINED with decline_reason = 'SUPERSEDED_BY_AWARD'"
      - "increments UpgradeBid.version by 1"

  - method: POST
    path: "/upgrade-bids/{id}/decline"
    description: "Reject a bid outright; no inventory or money movement."
    roles: [RevenueManager]
    code: 200
    input: [reason]
    output: UpgradeBid
    side_effects:
      - "state_machines.UpgradeBid {SUBMITTED, COUNTERED} -> DECLINED"
      - "decline_reason = reason"
      - "increments UpgradeBid.version by 1"

  # ------------------------------------------------------ ItineraryChange ---
  - method: POST
    path: "/itinerary-changes"
    description: "Draft a port cancellation, substitution or shortened itinerary with its compensation policy. Nothing is granted until it is published."
    roles: [PortOpsCoordinator]
    code: 201
    input: [sailing_id, kind, affected_port_code, compensation_policy]
    output: ItineraryChange
    side_effects:
      - "status = DRAFT"
      - "calc itinerary_compensation freezes obc_per_guest_cents and refund_pct"

  - method: GET
    path: "/itinerary-changes/{id}"
    description: "Read one itinerary change."
    roles: [RevenueManager, PortOpsCoordinator, ReservationAgent, Guest]
    code: 200
    input: []
    output: ItineraryChange
    side_effects: []

  - method: GET
    path: "/itinerary-changes"
    description: "List itinerary changes; filter by sailing, status or kind."
    roles: [RevenueManager, PortOpsCoordinator, ReservationAgent]
    code: 200
    input: ["sailing_id?", "status?", "kind?", "limit?", "offset?"]
    output: ItineraryChange[]
    side_effects: []

  - method: POST
    path: "/itinerary-changes/{id}/publish"
    description: "Publish the change and cascade compensation: onboard credit and cash refunds to every OPTION/CONFIRMED booking, then the sailing's onboard-revenue projection, compensation liability, RALBD figures and revenue alert."
    roles: [PortOpsCoordinator]
    code: 200
    input: []
    output: ItineraryChange
    side_effects:
      - "state_machines.ItineraryChange DRAFT -> PUBLISHED; published_at = current_utc"
      - "calc itinerary_compensation grants OBC and refunds onto every OPTION/CONFIRMED Booking of the sailing"
      - "calc booking_onboard_projection recomputes each Booking.projected_onboard_net_cents"
      - "calc sailing_ralbd recomputes Sailing.projected_onboard_revenue_cents, compensation_liability_cents, ralbd_gross_cents, ralbd_net_cents and revenue_alert"
      - "affected_bookings_count, total_obc_granted_cents and total_refund_granted_cents stamped on the ItineraryChange"
      - "increments ItineraryChange.version by 1 and Sailing.version by 1"

  # ---------------------------------------------- test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the server's logical clock, which every days_to_sail, deadline, review-date and
      bid-window computation reads. Before the first call the clock reads exactly
      2026-08-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time.
      Test-driving endpoint: no plausible business surface exists for moving time.
    roles: [RevenueManager, ReservationAgent, GroupSalesAgent, PortOpsCoordinator, Guest]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "current_utc = to_iso8601; no entity is mutated and no version is incremented"
      - "the clock may move forward or backward; nothing is re-derived until the next business call"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization ------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five roles declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_BOOKING_OWNER
    http: 403
    condition: "a Guest acts on a Booking, PaymentEvent ledger or UpgradeBid whose Booking.guest_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the GroupSalesAgent confirming a block definite is the same X-User-ID that created it"

  # ---- request shape / uniqueness ---------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range integer, unparseable datetime, window_open <= window_close, ends_on < starts_on, discount_pct outside (0, 0.5], limit outside [1,100]"
  - id: ERR_DUPLICATE_VOYAGE_CODE
    http: 400
    condition: "a Sailing with this voyage_code already exists"
  - id: ERR_DUPLICATE_CATEGORY_CODE
    http: 400
    condition: "a CabinCategory with this code already exists"
  - id: ERR_DUPLICATE_TIER_RANK
    http: 400
    condition: "a CabinCategory with this tier_rank already exists"
  - id: ERR_DUPLICATE_GUEST_EMAIL
    http: 400
    condition: "a Guest with this email already exists"
  - id: ERR_DUPLICATE_PROMO_CODE
    http: 400
    condition: "a Promotion with this code already exists on the same sailing_id"

  # ---- existence ---------------------------------------------------------
  - id: ERR_SAILING_NOT_FOUND
    http: 404
    condition: "no Sailing with the referenced id"
  - id: ERR_CABIN_CATEGORY_NOT_FOUND
    http: 404
    condition: "no CabinCategory with the referenced id (path id, cabin_category_id, assigned_cabin_category_id, target_cabin_category_id or upgrade_to_category_id)"
  - id: ERR_SAILING_INVENTORY_NOT_FOUND
    http: 404
    condition: "no SailingInventory with the referenced id, or no allotment exists for the (sailing_id, cabin_category_id) pair a booking or block needs"
  - id: ERR_FARE_RULE_NOT_FOUND
    http: 404
    condition: "no FareRule with the referenced id"
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "no Promotion with the referenced id"
  - id: ERR_GROUP_BLOCK_NOT_FOUND
    http: 404
    condition: "no GroupBlock with the referenced id"
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "no Guest with the referenced id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no Booking with the referenced id"
  - id: ERR_UPGRADE_BID_NOT_FOUND
    http: 404
    condition: "no UpgradeBid with the referenced id"
  - id: ERR_ITINERARY_CHANGE_NOT_FOUND
    http: 404
    condition: "no ItineraryChange with the referenced id"

  # ---- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_INVENTORY_VERSION
    http: 412
    condition: "expected_inventory_version does not equal SailingInventory.version on PATCH /sailing-inventories/{id}"
  - id: ERR_STALE_SAILING_VERSION
    http: 412
    condition: "expected_sailing_version does not equal Sailing.version on POST /promotions"

  # ---- state preconditions ----------------------------------------------
  - id: ERR_SAILING_NOT_PLANNED
    http: 409
    condition: "open-for-sale called on a Sailing whose status is not PLANNED"
  - id: ERR_SAILING_NOT_OPEN
    http: 409
    condition: "suspend-sales, booking confirmation, or a child write requires Sailing.status OPEN_FOR_SALE (or {OPEN_FOR_SALE, SALES_SUSPENDED}) and the sailing is outside that set"
  - id: ERR_SAILING_NOT_SUSPENDED
    http: 409
    condition: "resume-sales called on a Sailing whose status is not SALES_SUSPENDED"
  - id: ERR_SAILING_ALREADY_SAILED
    http: 409
    condition: "an operation is attempted on a Sailing in SAILED, or an ItineraryChange is published against one"
  - id: ERR_BOOKING_NOT_IN_OPTION
    http: 409
    condition: "confirm called on a Booking whose booking_status is not OPTION"
  - id: ERR_BOOKING_NOT_ACTIVE
    http: 409
    condition: "cancel, payment posting or bid submission attempted on a Booking whose booking_status is CANCELLED or SAILED"
  - id: ERR_BOOKING_NOT_AWAITING_SETTLEMENT
    http: 409
    condition: "settle-cancellation called on a Booking whose payment_status is not PENALTY_ASSESSED"
  - id: ERR_PAYMENT_STATE_INVALID
    http: 409
    condition: "the requested payment kind has no declared transition from the booking's current payment_status (e.g. DEPOSIT posted when already PAID_IN_FULL, or any payment posted after REFUNDED)"
  - id: ERR_DEPOSIT_NOT_PAID
    http: 409
    condition: "confirm called while payment_status is AWAITING_DEPOSIT or DELINQUENT"
  - id: ERR_GROUP_BLOCK_NOT_TENTATIVE
    http: 409
    condition: "confirm-definite called on a GroupBlock whose status is not TENTATIVE"
  - id: ERR_GROUP_BLOCK_CLOSED
    http: 409
    condition: "review or extend-review called on a GroupBlock in DEFINITE or RELEASED"
  - id: ERR_GROUP_BLOCK_NOT_DEFINITE
    http: 409
    condition: "a Booking carrying group_block_id is confirmed while its GroupBlock is still TENTATIVE, PARTIALLY_RELEASED or RELEASED"
  - id: ERR_PROMOTION_NOT_SCHEDULED
    http: 409
    condition: "activate called on a Promotion whose status is not SCHEDULED"
  - id: ERR_PROMOTION_ALREADY_CLOSED
    http: 409
    condition: "withdraw called on a Promotion already in EXHAUSTED, EXPIRED or WITHDRAWN"
  - id: ERR_BID_NOT_PENDING
    http: 409
    condition: "counter or accept called on an UpgradeBid whose status is not SUBMITTED"
  - id: ERR_BID_NOT_COUNTERED
    http: 409
    condition: "rebid called on an UpgradeBid whose status is not COUNTERED"
  - id: ERR_ITINERARY_CHANGE_NOT_DRAFT
    http: 409
    condition: "publish called on an ItineraryChange already PUBLISHED"

  # ---- berth safety ------------------------------------------------------
  - id: ERR_MAX_OCCUPANCY_EXCEEDED
    http: 422
    condition: "the party size exceeds CabinCategory.max_occupancy, or occupancy_adults exceeds CabinCategory.lower_berths, on booking creation or on an upgrade award into the target category"
  - id: ERR_BERTH_SEQUENCE_INVALID
    http: 422
    condition: "fourth_berth_guests == 1 while third_berth_guests == 0"
  - id: ERR_OVERSELL_NOT_PERMITTED
    http: 422
    condition: "oversell_allowance > 0 requested on an allotment whose CabinCategory.is_guarantee is false"

  # ---- temporal ----------------------------------------------------------
  - id: ERR_NO_FARE_RULE_FOR_WINDOW
    http: 422
    condition: "no FareRule half-open window contains the operation's days_to_sail for the required cabin category"
  - id: ERR_BID_WINDOW_CLOSED
    http: 422
    condition: "days_to_sail is outside [BID_WINDOW_MIN_DAYS, BID_WINDOW_MAX_DAYS] for a bid submit, counter, rebid or accept"
  - id: ERR_REVIEW_DATE_NOT_REACHED
    http: 422
    condition: "review called while current_utc < GroupBlock.review_date"
  - id: ERR_REVIEW_DATE_IN_PAST
    http: 422
    condition: "extend-review called with new_review_date <= current_utc"
  - id: ERR_FARE_WINDOW_OVERLAP
    http: 422
    condition: "a new FareRule's half-open window overlaps an existing rule for the same (sailing_id, cabin_category_id); windows that merely touch at a shared endpoint are accepted"
  - id: ERR_PROMO_CADENCE_CONFLICT
    http: 422
    condition: "a new Promotion's closed interval is separated by fewer than PROMO_CADENCE_GAP_DAYS whole days from an existing non-WITHDRAWN campaign on the same sailing"
  - id: ERR_PROMO_WINDOW_NOT_CURRENT
    http: 422
    condition: "activate called while current_utc is outside [starts_on, ends_on]"
  - id: ERR_FINAL_PAYMENT_OVERDUE
    http: 422
    condition: "a FINAL_PAYMENT is posted from DEPOSIT_PAID after final_payment_due_date has passed; the DELINQUENT cure path is exempt"

  # ---- referential / hierarchy ------------------------------------------
  - id: ERR_UPGRADE_PATH_INVALID
    http: 422
    condition: "upgrade_to_category_id points at a category whose tier_rank is not strictly greater, or a bid's target_cabin_category_id is not reachable from the booking's assigned_cabin_category_id by following upgrade_to_category_id"
  - id: ERR_PROMO_AUDIENCE_MISMATCH
    http: 422
    condition: "a REPEAT_GUEST promotion is quoted for a Guest whose loyalty_tier is NONE, or a GROUP promotion is quoted without group_block_id"
  - id: ERR_GROUP_BLOCK_MISMATCH
    http: 422
    condition: "the referenced GroupBlock's sailing_id or cabin_category_id differs from the booking's"
  - id: ERR_CATEGORY_NOT_ON_SAILING
    http: 422
    condition: "a FareRule, GroupBlock or Booking references a cabin_category_id that has no SailingInventory row on that sailing"

  # ---- posture, capacity and bounded cycles ----------------------------
  - id: ERR_POSTURE_RESTRICTED
    http: 422
    condition: "GroupBlock creation or Promotion activation attempted while Sailing.inventory_posture is RESTRICTED or FROZEN"
  - id: ERR_POSTURE_FROZEN
    http: 422
    condition: "Booking creation attempted while Sailing.inventory_posture is FROZEN and allow_waitlist is false"
  - id: ERR_CATEGORY_SOLD_OUT
    http: 422
    condition: "SailingInventory.available_cabins is 0 and allow_waitlist is false"
  - id: ERR_GROUP_BLOCK_EXHAUSTED
    http: 422
    condition: "a Booking carrying group_block_id is created while GroupBlock.cabins_held - picked_up_cabins is 0"
  - id: ERR_INSUFFICIENT_GROUP_INVENTORY
    http: 422
    condition: "requested cabins_held exceeds SailingInventory.available_cabins"
  - id: ERR_TARGET_CATEGORY_UNAVAILABLE
    http: 422
    condition: "the target allotment has available_cabins == 0 when an upgrade bid is accepted, or the guarantee-assignment target allotment is exhausted"
  - id: ERR_DUPLICATE_INVENTORY
    http: 422
    condition: "a SailingInventory row already exists for this (sailing_id, cabin_category_id)"
  - id: ERR_SUSPENSION_LIMIT_REACHED
    http: 422
    condition: "suspend-sales called while Sailing.suspension_count == MAX_SALES_SUSPENSIONS"
  - id: ERR_MAX_COUNTER_ROUNDS_EXCEEDED
    http: 422
    condition: "counter called while UpgradeBid.counter_rounds == MAX_COUNTER_ROUNDS"
  - id: ERR_MAX_REVIEW_EXTENSIONS_EXCEEDED
    http: 422
    condition: "extend-review called while GroupBlock.review_extension_count == MAX_REVIEW_EXTENSIONS"
  - id: ERR_SAILING_NOT_SELLABLE
    http: 422
    condition: "open-for-sale called on a Sailing with no SailingInventory row or no FareRule"

  # ---- money -------------------------------------------------------------
  - id: ERR_DEPOSIT_BELOW_MINIMUM
    http: 422
    condition: "a DEPOSIT payment is smaller than Booking.deposit_due_cents"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds Booking.balance_due_cents"
  - id: ERR_FINAL_PAYMENT_SHORT
    http: 422
    condition: "a FINAL_PAYMENT is smaller than Booking.balance_due_cents"
  - id: ERR_PROMOTION_NOT_ACTIVE
    http: 422
    condition: "the quoted Promotion's status is not ACTIVE, or current_utc is outside [starts_on, ends_on]"
  - id: ERR_PROMO_EXHAUSTED
    http: 422
    condition: "the quoted Promotion's redemption_count has reached max_redemptions"
  - id: ERR_BID_BELOW_FLOOR
    http: 422
    condition: "bid_amount_per_guest_cents is below min_acceptable_per_guest_cents, or below countered_min_per_guest_cents once a counter exists"
  - id: ERR_NOT_GUARANTEE_BOOKING
    http: 422
    condition: "assign-guarantee called on a Booking whose cabin_category_id is not a guarantee category, or with a target that is itself a guarantee category or sits on a different sailing"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RevenueManager
    description: "Owns pricing, inventory, promotions, oversell strategy, upgrade-bid adjudication and cancellation settlement."
    identity: opaque
    exclusive_operations:
      - "POST /sailings"
      - "POST /sailings/{id}/open-for-sale"
      - "POST /sailings/{id}/suspend-sales"
      - "POST /sailings/{id}/resume-sales"
      - "POST /sailings/{id}/close-inventory"
      - "POST /sailings/{id}/ops-run"
      - "GET /sailings/{id}/revenue-summary"
      - "POST /cabin-categories"
      - "POST /sailing-inventories"
      - "PATCH /sailing-inventories/{id}"
      - "POST /fare-rules"
      - "POST /promotions"
      - "POST /promotions/{id}/activate"
      - "POST /promotions/{id}/withdraw"
      - "POST /bookings/{id}/settle-cancellation"
      - "POST /upgrade-bids/{id}/counter"
      - "POST /upgrade-bids/{id}/accept"
      - "POST /upgrade-bids/{id}/decline"
    shared_operations:
      - "GET /sailings/{id}, GET /sailings, GET /cabin-categories/{id}, GET /cabin-categories"
      - "GET /sailing-inventories/{id}, GET /sailing-inventories, GET /fare-rules/{id}, GET /fare-rules"
      - "GET /promotions/{id}, GET /promotions, GET /group-blocks/{id}, GET /group-blocks"
      - "GET /guests/{id}, GET /guests, GET /bookings/{id}, GET /bookings"
      - "GET /bookings/{id}/payment-events, GET /upgrade-bids/{id}, GET /upgrade-bids"
      - "GET /itinerary-changes/{id}, GET /itinerary-changes"
      - "POST /_clock/set_current_utc"

  - name: ReservationAgent
    description: "Sells and services individual bookings: creation, confirmation, payments, cancellation, guarantee assignment."
    identity: opaque
    exclusive_operations:
      - "POST /guests"
      - "POST /bookings"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/payments"
      - "POST /bookings/{id}/assign-guarantee"
    shared_operations:
      - "POST /bookings/{id}/cancel (shared with Guest, who may only cancel their own)"
      - "POST /bookings/{id}/upgrade-bids (shared with Guest)"
      - "GET /sailings/{id}, GET /sailings, GET /cabin-categories/{id}, GET /cabin-categories"
      - "GET /sailing-inventories/{id}, GET /sailing-inventories, GET /fare-rules/{id}, GET /fare-rules"
      - "GET /promotions/{id}, GET /promotions, GET /group-blocks/{id}, GET /group-blocks"
      - "GET /guests/{id}, GET /guests, GET /bookings/{id}, GET /bookings"
      - "GET /bookings/{id}/payment-events, GET /upgrade-bids/{id}, GET /upgrade-bids"
      - "GET /itinerary-changes/{id}, GET /itinerary-changes"
      - "POST /_clock/set_current_utc"

  - name: GroupSalesAgent
    description: "Owns travel-agency group blocks: tentative holds, the four-eyes definite signature, review-date releases and review extensions."
    identity: opaque
    exclusive_operations:
      - "POST /group-blocks"
      - "POST /group-blocks/{id}/confirm-definite"
      - "POST /group-blocks/{id}/review"
      - "POST /group-blocks/{id}/extend-review"
    shared_operations:
      - "GET /sailings/{id}, GET /sailings, GET /cabin-categories/{id}, GET /cabin-categories"
      - "GET /sailing-inventories/{id}, GET /sailing-inventories, GET /fare-rules/{id}, GET /fare-rules"
      - "GET /promotions/{id}, GET /promotions, GET /group-blocks/{id}, GET /group-blocks"
      - "GET /guests/{id}, GET /bookings/{id}, GET /bookings"
      - "GET /itinerary-changes/{id}, GET /itinerary-changes"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: X-User-ID on POST /group-blocks/{id}/confirm-definite must differ from GroupBlock.created_by_user_id. Both ids are opaque operator identifiers, never Guest ids."

  - name: PortOpsCoordinator
    description: "Owns itinerary disruption: drafting and publishing port cancellations, substitutions and shortened itineraries with their compensation policy."
    identity: opaque
    exclusive_operations:
      - "POST /itinerary-changes"
      - "POST /itinerary-changes/{id}/publish"
    shared_operations:
      - "GET /sailings/{id}, GET /sailings, GET /cabin-categories/{id}, GET /cabin-categories"
      - "GET /sailing-inventories/{id}, GET /sailing-inventories"
      - "GET /itinerary-changes/{id}, GET /itinerary-changes"
      - "POST /_clock/set_current_utc"

  - name: Guest
    description: "The traveller acting on their own booking: reading it, cancelling it, bidding for an upgrade and re-bidding after a counter."
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /upgrade-bids/{id}/rebid"
    shared_operations:
      - "POST /bookings/{id}/cancel (own booking only)"
      - "POST /bookings/{id}/upgrade-bids (own booking only)"
      - "GET /bookings/{id} (own booking only), GET /bookings/{id}/payment-events (own booking only)"
      - "GET /upgrade-bids/{id} (own booking only)"
      - "GET /sailings/{id}, GET /cabin-categories/{id}, GET /cabin-categories"
      - "GET /guests/{id}, GET /itinerary-changes/{id}"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID for this role is a Guest.id. Ownership checks compare X-User-ID to Booking.guest_id (priority 7 in §1.4)."
