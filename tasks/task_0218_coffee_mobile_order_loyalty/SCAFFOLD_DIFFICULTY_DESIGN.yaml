            - { call: "POST /members/${mem1}/orders/${ord1}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mem1}" }
            - { call: "POST /members/${mem1}/orders/${ord1}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mem1}" }
            - { call: "POST /members", payload: { email: "b2@x.com", full_name: "B2", birth_month_day: "01-01" }, as: Anonymous, captures: { mem2: $.data.id } }
