  - rule_id: boundary_precision_check
    instances:
      - name: evv_rounding_half_increment_boundary
        grounds:
          - calculations.visit_charge_provisional
          - entities.Visit.fields.billable_minutes
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          A 7-minute EVV window rounds to 0 billable minutes (charge 0.00) while an 8-minute window
          rounds up to 15 minutes (charge 7.50): the half-increment boundary (7.5 min for a 15-min
          increment) is exact — reached through the clock-out endpoint.
        test_recipe:
          setup:
            - "Two IN_PROGRESS visits ready to clock out: V7 with a 7-minute window, V8 with an 8-minute window."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: Scheduler
              captures: { v7: $.data.id }
            - call: "POST /visits/${v7}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Scheduler
              captures: { v8: $.data.id }
            - call: "POST /visits/${v8}/clock-in"
              payload: { event_at: "2026-06-01T11:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "POST /visits/${v7}/clock-out"
              payload: { event_at: "2026-06-01T09:07:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { bm7: $.data.billable_minutes }
            - call: "POST /visits/${v8}/clock-out"
              payload: { event_at: "2026-06-01T11:08:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { bm8: $.data.billable_minutes }
          assert:
            - "Visit.${v7}.billable_minutes == 0"
            - "Visit.${v7}.visit_charge == 0.00"
            - "Visit.${v8}.billable_minutes == 15"
            - "Visit.${v8}.visit_charge == 7.50"

      - name: weekly_hours_at_exact_cap_vs_over
        grounds:
          - validations[priority=14]
          - entities.Caregiver.fields.max_weekly_hours
          - entities.Visit.fields.scheduled_start
        distinguishing_aspect: |
          With max_weekly_hours=10 and one 8h SCHEDULED visit, a second 2h visit reaching exactly 10h
          is accepted (10 is not ABOVE 10) while a 3h visit reaching 11h is rejected with
          ERR_WEEKLY_HOURS_EXCEEDED — a different metric (cumulative weekly hours) and a different
          endpoint (POST /visits) than the EVV-rounding boundary.
        test_recipe:
          setup:
            - "Caregiver max_weekly_hours=10 with one 8h SCHEDULED visit Mon 09:00-17:00 (no overlap with the new visits, different days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, travel_buffer_minutes: 0 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA", max_weekly_hours: 10 }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T17:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Scheduler
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T10:00:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "Visit.${v2}.status == SCHEDULED  (second visit v2 brings the week to exactly 10h and is accepted)"
            - "response error_id == ERR_WEEKLY_HOURS_EXCEEDED  (the third 1h visit reaching 11h is rejected)"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: match_activate_requires_caregiver_active
        grounds:
          - state_machines.CaregiverMatch.PROPOSED_to_ACTIVE
          - entities.Caregiver.fields.employment_status
          - validations[priority=7]
        distinguishing_aspect: |
          A PROPOSED match cannot activate while its Caregiver.employment_status is APPLICANT (not yet
          activated): the Match->Caregiver pair gates the transition with ERR_CAREGIVER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Caregiver CG cleared to TIER_2 but still APPLICANT; client CL ACTIVE; a PROPOSED match."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_2" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
          trigger:
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAREGIVER_NOT_ACTIVE"
            - "HTTP status == 409"
            - "CaregiverMatch.${mt}.match_status == PROPOSED"

      - name: visit_clockin_requires_care_plan_published
        grounds:
          - state_machines.Visit.SCHEDULED_to_IN_PROGRESS
          - entities.CarePlan.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          A clock-in is rejected when the visit's CarePlan.status is still DRAFT (not PUBLISHED):
          the Visit->CarePlan pair gates clock-in with ERR_CARE_PLAN_NOT_PUBLISHED — a different
          entity pair than Match->Caregiver.
        test_recipe:
          setup:
            - "ACTIVE match, ACTIVE client, a DRAFT (unpublished) care plan, one SCHEDULED visit referencing that plan."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CARE_PLAN_NOT_PUBLISHED"
            - "HTTP status == 409"
            - "Visit.${v1}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: caregiver_half_open_overlap
        grounds:
          - validations[priority=12]
          - entities.Visit.fields.scheduled_start
          - entities.Visit.fields.scheduled_end
        distinguishing_aspect: |
          On the caregiver resource the interval is HALF-OPEN: a new visit starting exactly at an
          existing visit's end (11:00 == 11:00) is accepted, but a visit overlapping by even a minute
          (10:30-11:30 vs 09:00-11:00) is rejected with ERR_CAREGIVER_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Caregiver CG with one SCHEDULED visit 09:00-11:00 for client CL_A."
            - "A second client CL_B exists so the touching/overlapping new visits are for CG but different client (isolating the caregiver rule)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, travel_buffer_minutes: 0 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA", max_weekly_hours: 50 }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL_A", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cla: $.data.id }
            - call: "POST /clients/${cla}/care-plans"
              payload: { title: "PlanA" }
              as: Scheduler
              captures: { plana: $.data.id }
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL_B", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { clb: $.data.id }
            - call: "POST /clients/${clb}/care-plans"
              payload: { title: "PlanB" }
              as: Scheduler
              captures: { planb: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cla}", care_plan_id: "${plana}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${clb}", care_plan_id: "${planb}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Scheduler
              captures: { v_touch: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${clb}", care_plan_id: "${planb}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T10:30:00Z", scheduled_end: "2026-06-01T11:30:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "Visit.${v_touch}.status == SCHEDULED  (touching endpoint 11:00==11:00 accepted)"
            - "response error_id == ERR_CAREGIVER_DOUBLE_BOOKED  (10:30-11:30 overlap rejected)"
            - "HTTP status == 409"

      - name: client_buffered_overlap
        grounds:
          - validations[priority=13]
          - entities.Agency.fields.travel_buffer_minutes
          - entities.Visit.fields.scheduled_start
        distinguishing_aspect: |
          On the client resource the interval is BUFFER-EXPANDED by travel_buffer_minutes=30: a new
          visit for the same client starting 15 minutes after an existing one ends (within the buffer)
          is rejected with ERR_CLIENT_VISIT_CONFLICT, whereas a 35-minute gap clears the buffer — a
          different interval geometry on a different resource entity than the caregiver half-open rule.
        test_recipe:
          setup:
            - "Client CL with one SCHEDULED visit 09:00-10:00 by caregiver CG1; a second caregiver CG2 exists so the conflict is purely the client buffer (not caregiver double-booking)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, travel_buffer_minutes: 30 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG1", hire_state_code: "CA", max_weekly_hours: 50 }
              as: AgencyAdmin
              captures: { cg1: $.data.id }
            - call: "POST /caregivers/${cg1}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg1}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG2", hire_state_code: "CA", max_weekly_hours: 50 }
              as: AgencyAdmin
              captures: { cg2: $.data.id }
            - call: "POST /caregivers/${cg2}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg2}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg1}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg2}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T10:35:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { v_ok: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { caregiver_id: "${cg2}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T13:15:00Z", scheduled_end: "2026-06-01T14:00:00Z" }
              as: Scheduler
              captures: { v_ok2: $.data.id }
            - call: "POST /visits"
              payload: { caregiver_id: "${cg2}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T10:15:00Z", scheduled_end: "2026-06-01T10:25:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "Visit.${v_ok}.status == SCHEDULED  (35-min gap clears the 30-min buffer)"
            - "response error_id == ERR_CLIENT_VISIT_CONFLICT  (10:15 start, 15-min gap inside buffer, rejected)"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_submit_then_deny_conserves_client_responsibility
        grounds:
          - state_machines.LtcClaim.DRAFT_to_SUBMITTED
          - state_machines.LtcClaim.SUBMITTED_to_DENIED
          - entities.Invoice.fields.client_responsible_amount
          - entities.Invoice.fields.invoice_total
        distinguishing_aspect: |
          Conserved quantity: client_responsible_amount. submit lowers it from invoice_total 240.00 to
          120.00; the compensating deny restores it exactly to 240.00 (== invoice_total), leaving no
          drift in the client-responsibility ledger.
        test_recipe:
          setup:
            - "An ISSUED invoice (total 240.00) with a SUBMITTED claim (covered 120.00, client responsible 120.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T17:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v1}/clock-out"
              payload: { event_at: "2026-06-01T17:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { iv: $.data.version }
            - call: "POST /ltc-claims"
              payload: { client_id: "${cl}", invoice_id: "${inv}", insurer_name: "Ins", policy_number: "P1", covered_pct: 0.50, daily_benefit_max: 500, covered_days: 5, expected_invoice_version: "${iv}" }
              as: BillingClerk
              captures: { claim: $.data.id }
            - call: "POST /ltc-claims/${claim}/submit"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /ltc-claims/${claim}/transition"
              payload: { action: "DENY" }
              as: AgencyAdmin
              captures: { st: $.data.status }
          assert:
            - "Invoice.${inv}.invoice_total == 240.00"
            - "Invoice.${inv}.client_responsible_amount == 240.00"
            - "LtcClaim.${claim}.covered_amount == 0"

      - name: visit_clockin_then_reset_conserves_visit_charge_ledger
        grounds:
          - state_machines.Visit.SCHEDULED_to_IN_PROGRESS
          - state_machines.Visit.IN_PROGRESS_to_SCHEDULED
          - entities.Visit.fields.visit_charge
          - entities.Visit.fields.billable_minutes
        distinguishing_aspect: |
          Conserved quantity: the visit's billing ledger (billable_minutes and visit_charge). A clock-in
          followed by its compensating RESET leaves billable_minutes==0 and visit_charge==0.00 — back to
          the pre-clock baseline, a different conserved quantity than client_responsible_amount.
        test_recipe:
          setup:
            - "One SCHEDULED visit with an ACTIVE match, ACTIVE client, PUBLISHED plan."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:05:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "POST /visits/${v1}/transition"
              payload: { action: "RESET" }
              as: Scheduler
              captures: { st: $.data.status }
          assert:
            - "Visit.${v1}.status == SCHEDULED"
            - "Visit.${v1}.billable_minutes == 0"
            - "Visit.${v1}.visit_charge == 0.00"
            - "Visit.${v1}.clock_in_at == null"
