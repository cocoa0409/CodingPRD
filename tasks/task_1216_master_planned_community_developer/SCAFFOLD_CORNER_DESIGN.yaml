  # ========================================================== validations ====
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without a recognized role header is 401 ERR_UNAUTHENTICATED before any other check (sent before existence and state checks)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mpc/communities"
              payload: { community_name: "Anon Acres", total_planned_units: 5 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (http 401); the community is not created"

      - name: forbidden_role_matrix
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - "errors[ERR_FORBIDDEN_ROLE]"
          - roles
        distinguishing_aspect: "Exclusive operations reject foreign roles with 403: BuilderRep cannot create budgets, LifestyleCoordinator cannot create agreements, DesignReviewer cannot create events, HomeownerResident cannot drive the clock."
        test_recipe:
          setup: ["ACTIVE community exists"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Role Ridge", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
          trigger:
            - call: "POST /mpc/budgets"
              payload: { community_id: "${c_id}", fiscal_year: 2027 }
              as: BuilderRep
              as_user_id: "builder-x"
              captures: { err1: $.data.error_id }
            - call: "POST /mpc/agreements"
              payload: { community_id: "${c_id}", builder_id: "builder-x", phase_id: "phase-x", base_price_per_lot_cents: 100, annual_escalation_pct: 1.0, penalty_per_lot_per_day_cents: 1, earnest_money_cents: 1, total_lots_committed: 1 }
              as: LifestyleCoordinator
              captures: { err2: $.data.error_id }
            - call: "POST /mpc/events"
              payload: { community_id: "${c_id}", title: "Nope", venue: "SALES_CENTER", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T12:00:00Z", capacity: 5 }
              as: DesignReviewer
              captures: { err3: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HomeownerResident
              as_user_id: "res-x"
              captures: { err4: $.data.error_id }
          assert:
            - "${err1} == ERR_FORBIDDEN_ROLE; ${err2} == ERR_FORBIDDEN_ROLE; ${err3} == ERR_FORBIDDEN_ROLE; ${err4} == ERR_FORBIDDEN_ROLE (all http 403)"

      - name: duplicate_constraints
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - "errors[ERR_DUPLICATE_FISCAL_YEAR]"
