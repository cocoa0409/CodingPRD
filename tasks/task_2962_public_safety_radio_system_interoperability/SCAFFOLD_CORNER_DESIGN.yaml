      - name: maintenance_concurrency_cap_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=27]
          - endpoints[POST /radio-system/site-events]
          - errors.ERR_MAINTENANCE_CONCURRENCY_CAP
        distinguishing_aspect: "Two OPEN PLANNED_MAINTENANCE windows on two different sites are individually legal, but a third overlapping window on a third site breaks MAX_CONCURRENT_MAINTENANCE_SITES = 2 and returns HTTP 409 ERR_MAINTENANCE_CONCURRENCY_CAP."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three sites CAP-1, CAP-2, CAP-3 exist; CAP-1 and CAP-2 each hold an OPEN PLANNED_MAINTENANCE window over [2026-08-10T08:00Z, 2026-08-10T12:00Z]."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "CAP-1", name: "Cap One", channel_capacity: 4, backup_power_type: "GENERATOR" }
