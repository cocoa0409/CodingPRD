              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_a: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000001401", item_description: "Milk 1gal", category_code: "DAIRY", old_retail_cents: 449, new_retail_cents: 399, net_content_qty: 1, net_content_uom: "GAL" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000001402", item_description: "Butter 1lb", category_code: "DAIRY", old_retail_cents: 549, new_retail_cents: 499, net_content_qty: 1, net_content_uom: "LB" }
              as: PricingAdmin
              captures: { line_2: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000001403", item_description: "Cream 16floz", category_code: "DAIRY", old_retail_cents: 349, new_retail_cents: 299, net_content_qty: 16, net_content_uom: "FL_OZ" }
              as: PricingAdmin
              captures: { line_3: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000001404", item_description: "Yogurt 6ct", category_code: "DAIRY", old_retail_cents: 599, new_retail_cents: 549, net_content_qty: 6, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { line_4: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/distribute"
              payload: {}
              as: PricingAdmin
              captures: { file_v1: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_a}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T00:00:00Z", scheduled_end_at: "2026-08-03T07:00:00Z", expected_price_change_file_version: "${file_v1}" }
              as: PricingAdmin
              captures: { task_420: $.data.id }
            - call: "GET /price-integrity/price-change-files/${file_a}"
              as: PricingAdmin
              captures: { file_v2: $.data.version }
          trigger:
            - call: "POST /price-integrity/price-change-files/${file_a}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_2}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T07:01:00Z", scheduled_end_at: "2026-08-03T08:01:00Z", expected_price_change_file_version: "${file_v2}" }
              as: PricingAdmin
              captures: { task_at_cap: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_3}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T08:02:00Z", scheduled_end_at: "2026-08-03T08:03:00Z", expected_price_change_file_version: "${file_v2}" }
              as: PricingAdmin
              captures: { err_cap: $.data.error_id }
            - call: "POST /price-integrity/price-change-files/${file_a}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_3}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-04T08:02:00Z", scheduled_end_at: "2026-08-04T08:03:00Z", expected_price_change_file_version: "${file_v2}" }
              as: PricingAdmin
