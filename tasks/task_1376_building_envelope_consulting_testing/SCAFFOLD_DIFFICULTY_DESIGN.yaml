# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_1376_building_envelope_consulting_testing
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two instances on DIFFERENT entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: remediation_estimate_vs_actual_cost
        grounds:
          - calculations.remediation_cost_estimate
          - state_machines.RemediationPlan.DRAFT_to_ISSUED
          - state_machines.RemediationPlan.ISSUED_to_COMPLETED
        distinguishing_aspect: |
          Entity domain = RemediationPlan. The ESTIMATE variant (issue) applies a
          20% contingency on the severity subtotal and excludes mobilization; the
          ACTUAL variant (complete) drops contingency and adds per-section
          mobilization — for HIGH+MEDIUM with 4 sections ESTIMATE = 6600000 but
          ACTUAL = 6000000, so identical anomaly inputs yield different costs and
          the completion reconciles a NEGATIVE delta of -600000 into
          Engagement.recognized_fees_cents.
        test_recipe:
          setup:
            - "Engagement E IN_PROGRESS, posture OPEN, fee_cap 50000000, labor_rate 15000"
            - "Assembly A1 review_status APPROVED not required here; anomalies AN1 (HIGH, VERIFIED) and AN2 (MEDIUM, VERIFIED) exist, both survey-sourced from a completed+analyzed survey"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E1", client_name: "C1", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W1", assembly_type: "CURTAIN_WALL", design_u_factor: 1.8, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-09-01", ambient_delta_t_c: 1.0 }
              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "HIGH", description: "leak at slab edge" }
              as: Consultant
              captures: { an1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "MOISTURE_TRAP", severity: "MEDIUM", description: "wet insulation" }
              as: Consultant
              captures: { an2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${an1_id}/verify"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/anomalies/${an2_id}/verify"
              payload: {}
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans"
              payload: { anomaly_ids: ["${an1_id}", "${an2_id}"], spec_sections: ["07 01 00", "07 02 00", "08 01 00", "08 02 00"], expected_engagement_version: "${eng_v}" }
              as: Consultant
              captures: { plan_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v2: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans/${plan_id}/issue"
              payload: { expected_engagement_version: "${eng_v2}" }
              as: Consultant
          trigger:
            - call: "POST /engagements/${eng_id}/remediation-plans/${plan_id}/complete"
              payload: {}
              as: Principal
              captures: { actual_cost: $.data.actual_cost_cents }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Principal
              captures: { recognized: $.data.recognized_fees_cents }
          assert:
            - "RemediationPlan.${plan_id}.estimated_cost_cents == 6600000"
            - "RemediationPlan.${plan_id}.actual_cost_cents == 6000000"
            - "actual_cost_cents != estimated_cost_cents (6000000 != 6600000)"
            - "Engagement.${eng_id}.recognized_fees_cents == 6000000 (6600000 at issue, then -600000 reconciliation delta at completion)"
      - name: engagement_provisional_vs_final_fee_accrual
        grounds:
          - calculations.engagement_fee_accrual
          - calculations.warranty_recovery_share
          - state_machines.Engagement.IN_PROGRESS_to_CLOSE_OUT
        distinguishing_aspect: |
          Entity domain = Engagement (fee ledger), distinct from the
          RemediationPlan cost domain of the sibling instance. The PROVISIONAL
          variant nets the warranty recovery into recognized_fees_cents with a
          per-event floor of 0; the FINAL variant replays positive fee events
          chronologically and EXCLUDES both recoveries and negative
          reconciliation deltas — the same event stream yields
          recognized_fees_cents == 380000 before close-out but == 6980000 after
          the FINAL recompute at begin-close-out.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS, fee_cap 50000000; one approved design review (8 drawings, 2 barriers, round 0 -> fee 380000); one remediation plan ISSUED then COMPLETED (estimate 6600000, actual 6000000, delta -600000); one warranty claim RESOLVED with recovery 6000000; all anomalies REMEDIATED; no field tests; all reviews terminal; risk stays >= 70 throughout so posture never blocks issuance"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E2", client_name: "C2", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W2", assembly_type: "WINDOW_WALL", design_u_factor: 2.0, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["AIR", "WATER"], drawing_count: 8 }
              as: Consultant
              captures: { rev_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-09-05", ambient_delta_t_c: 1.0 }
              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "HIGH", description: "leak" }
              as: Consultant
              captures: { an1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "MOISTURE_TRAP", severity: "MEDIUM", description: "wet" }
              as: Consultant
              captures: { an2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${an1_id}/verify"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/anomalies/${an2_id}/verify"
              payload: {}
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans"
              payload: { anomaly_ids: ["${an1_id}", "${an2_id}"], spec_sections: ["07 01 00", "07 02 00", "08 01 00", "08 02 00"], expected_engagement_version: "${eng_v}" }
              as: Consultant
              captures: { plan_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v2: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans/${plan_id}/issue"
              payload: { expected_engagement_version: "${eng_v2}" }
              as: Consultant
            - call: "POST /engagements/${eng_id}/remediation-plans/${plan_id}/complete"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/warranty-claims"
              payload: { anomaly_id: "${an1_id}", manufacturer_name: "ACME Glazing", claimed_amount_cents: 8000000 }
              as: Consultant
              captures: { claim_id: $.data.id }
            - call: "POST /engagements/${eng_id}/warranty-claims/${claim_id}/manufacturer-acknowledge"
              payload: {}
              as: ManufacturerRep
            - call: "POST /engagements/${eng_id}/warranty-claims/${claim_id}/manufacturer-decide"
              payload: { decision: "ACCEPTED" }
              as: ManufacturerRep
            - call: "POST /engagements/${eng_id}/warranty-claims/${claim_id}/resolve"
              payload: {}
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Principal
              captures: { recognized_before: $.data.recognized_fees_cents }
          trigger:
            - call: "POST /engagements/${eng_id}/begin-close-out"
              payload: {}
              as: Principal
              captures: { recognized_after: $.data.recognized_fees_cents }
          assert:
            - "recognized_before == 380000 (PROVISIONAL: 380000 + 6600000 - 600000 - 6000000)"
            - "recognized_after == 6980000 (FINAL: positive events only = 380000 + 6600000; negative delta and recovery excluded)"
            - "recognized_before != recognized_after — identical event stream, two valid algorithms"
            - "Engagement.${eng_id}.status == CLOSE_OUT"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (two instances in DIFFERENT modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: design_review_fee_tiered_branching
        grounds:
          - calculations.design_review_fee
          - state_machines.DesignReview.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a) — a >= 3-input formula with non-linear interaction: tiered
          marginal rates on drawing_count, a conditional branch per tier, a flat
          per-extra-barrier surcharge, and a revision surcharge proportional to
          base. 18 drawings + 3 barriers + 2 revision rounds yields exactly
          812000 cents (base 610000 + barrier 80000 + revision 122000); the
          tier boundary itself is exercised: 5 drawings -> 250000 vs 6 drawings
          -> 280000.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS posture OPEN; assembly A approved-capable; design review with drawing_count 18, barrier_scope [AIR, WATER, THERMAL], driven through two full revision cycles so revision_round == 2 and reviewer of round is rev-user-1 while approver is rev-user-2"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E3", client_name: "C3", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W3", assembly_type: "MASONRY", design_u_factor: 1.2, required_airtightness_lps_m2: 2.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["AIR", "WATER", "THERMAL"], drawing_count: 18 }
              as: Consultant
              captures: { rev_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/submit-revision"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/submit-revision"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
          trigger:
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-2"
              captures: { fee: $.data.review_fee_cents }
          assert:
            - "DesignReview.${rev_id}.review_fee_cents == 812000"
            - "DesignReview.${rev_id}.revision_round == 2"
            - "Engagement recognized_fees_cents == 812000 (GET /engagements/${eng_id})"
      - name: mockup_fee_nested_rounding_order
        grounds:
          - calculations.mockup_testing_fee
          - state_machines.MockUp.TESTING_to_PASSED
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins per-day rounding
          BEFORE multiplying by days and attempt_number. With daily_rate 123456
          and 3 specimens, the unrounded day charge is 135801.6; per-day-first
          yields 135802 * 3 days * 1 attempt = 407406, while the rejected
          sum-then-round order would yield 407405 — a one-cent divergence the
          test pins to the pinned order.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS posture OPEN; chamber slot CHAMBER-A 2026-09-01..2026-09-04 (3 days) daily_rate 123456; mock-up with specimen_count 3 driven to TESTING within window"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E4", client_name: "C4", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W4", assembly_type: "CURTAIN_WALL", design_u_factor: 1.8, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-A", start_date: "2026-09-01", end_date: "2026-09-04", daily_rate_cents: 123456 }
              as: Consultant
              captures: { slot_id: $.data.id }
            - call: "POST /engagements/${eng_id}/mock-ups"
              payload: { assembly_id: "${asm_id}", chamber_slot_id: "${slot_id}", specimen_count: 3 }
              as: Consultant
              captures: { mu_id: $.data.id }
            - call: "POST /engagements/${eng_id}/mock-ups/${mu_id}/begin-construction"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/mock-ups/${mu_id}/declare-ready"
              payload: {}
              as: Consultant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: Principal
            - call: "POST /engagements/${eng_id}/mock-ups/${mu_id}/begin-testing"
              payload: {}
              as: Consultant
          trigger:
            - call: "POST /engagements/${eng_id}/mock-ups/${mu_id}/record-result"
              payload: { measured_leakage_lps_m2: 1.0 }
              as: Consultant
              captures: { fee: $.data.testing_fee_cents }
          assert:
            - "MockUp.${mu_id}.testing_fee_cents == 407406"
            - "MockUp.${mu_id}.status == PASSED"
            - "testing_fee_cents != 407405 (sum-then-round order explicitly rejected)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (two instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: design_review_cyclic_revision_loop
        grounds:
          - state_machines.DesignReview.REVISED_to_UNDER_REVIEW
          - state_machines.DesignReview.COMMENTS_ISSUED_to_REVISED
          - entities.DesignReview.fields.revision_round
        distinguishing_aspect: |
          Entity = DesignReview, shape = cyclic: SUBMITTED -> UNDER_REVIEW ->
          COMMENTS_ISSUED -> REVISED -> UNDER_REVIEW loops; each loop increments
          revision_round by exactly 1 and the segregation-of-duties constraint
          (approver != round reviewer) only engages once revision_round >= 1.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS OPEN; review submitted with 3 drawings, 1 barrier; driven through one full cycle"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E5", client_name: "C5", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W5", assembly_type: "ROOFING", design_u_factor: 0.9, required_airtightness_lps_m2: 2.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["WATER"], drawing_count: 3 }
              as: Consultant
              captures: { rev_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/submit-revision"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
          trigger:
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "second-cycle approve by rev-user-1 (the round's comment issuer) is rejected with ERR_DUTY_SEGREGATION_VIOLATION (403)"
            - "DesignReview.${rev_id}.revision_round == 1"
            - "DesignReview.${rev_id}.status == UNDER_REVIEW (unchanged)"
      - name: field_test_parallel_dimensions
        grounds:
          - state_machines.FieldTest.IN_PROGRESS_to_RESULT_RECORDED
          - state_machines.FieldTest.UNDIAGNOSED_to_DIAGNOSING
          - state_machines.FieldTest.RESULT_RECORDED_to_CERTIFIED
        distinguishing_aspect: |
          Entity = FieldTest, shape = parallel dimensions: execution_status
          (SCHEDULED -> IN_PROGRESS -> RESULT_RECORDED -> CERTIFIED) evolves
          independently of diagnosis_status (NOT_REQUIRED -> UNDIAGNOSED ->
          DIAGNOSING -> DIAGNOSED), which only engages when result == FAIL; a
          FAIL result blocks certification until the diagnosis dimension reaches
          DIAGNOSED while a PASS result certifies with diagnosis NOT_REQUIRED.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS OPEN; assembly APPROVED (via approved review); field test begun; result recorded as FAIL (measured 3.0001 vs allowable 3.0 at pressure 150, required 1.5); certification attempted while diagnosis UNDIAGNOSED"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E6", client_name: "C6", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W6", assembly_type: "WINDOW_WALL", design_u_factor: 2.2, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["AIR"], drawing_count: 2 }
              as: Consultant
              captures: { rev_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-9"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-9"
            - call: "POST /engagements/${eng_id}/field-tests"
              payload: { assembly_id: "${asm_id}", test_method: "ASTM_E783", test_date: "2026-09-10", test_pressure_pa: 150 }
              as: Consultant
              captures: { ft_id: $.data.id }
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/begin"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-user-1"
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/record-result"
              payload: { measured_leakage_lps_m2: 3.0001 }
              as: FieldTechnician
              as_user_id: "tech-user-1"
          trigger:
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/certify"
              payload: {}
              as: Principal
              as_user_id: "principal-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "certify rejected with ERR_DIAGNOSIS_INCOMPLETE (409): execution RESULT_RECORDED but diagnosis UNDIAGNOSED"
            - "FieldTest.${ft_id}.result == FAIL"
            - "FieldTest.${ft_id}.diagnosis_status == UNDIAGNOSED (auto-engaged by FAIL)"
            - "FieldTest.${ft_id}.execution_status == RESULT_RECORDED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two instances, different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: plan_completion_remediates_anomaly_recovers_risk_thaws_posture
        grounds:
          - state_machines.RemediationPlan.ISSUED_to_COMPLETED
          - state_machines.Anomaly.VERIFIED_to_REMEDIATED
          - calculations.risk_score_update
          - calculations.posture_derivation
        distinguishing_aspect: |
          Depth-3 cascade: POST .../remediation-plans/{id}/complete mutates
          RemediationPlan; that mutation itself flips each covered Anomaly
          VERIFIED -> REMEDIATED; each anomaly flip applies risk_score_update
          +10; the risk change re-derives Engagement.posture (RESTRICTED ->
          OPEN when the last OPEN/VERIFIED anomaly clears and risk recovers).
          Trigger = plan completion.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; anomaly AN2 (MEDIUM) VERIFIED (risk 95, no OPEN anomalies -> posture OPEN); plan covering AN2 with 1 spec section created and ISSUED (ESTIMATE 1800000); THEN anomaly AN1 (LOW) raised and left OPEN so posture flips to RESTRICTED before the completion trigger — proving the cascade's posture re-derivation is observable against a non-trivial starting posture"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E7", client_name: "C7", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
