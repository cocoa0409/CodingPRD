            - "That assignment already has a SUBMITTED 2026-08 report of 40 hours."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Duplicate Report Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
