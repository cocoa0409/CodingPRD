# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0272_escape_room_attraction_booking
# Breadth probe over §1.1-§1.7 claims NOT covered by §1.8. Same seven-point
# contract and §1.5 reachability gates as §1.8. excluded_because: stubs cite a
# named §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Venue
          - endpoints
        distinguishing_aspect: "POST /venues with all required fields -> 201; response has server-minted id, created_at, version==1, no_show_fee_pct default 0.5 echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id, ver: $.data.version }
          assert:
            - "response_type == object"
            - "Venue.${ven}.version == 1"
            - "Venue.${ven}.no_show_fee_pct == 0.5"
            - "Venue.${ven}.no_show_strike_limit == 3"

      - name: create_room_required_field_missing_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Room.fields.base_price_cents
          - validations[priority=5]
        distinguishing_aspect: "POST room missing base_price_cents (required, no default) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, game_minutes: 60 }
              as: VenueManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: room_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Room.fields.min_age
          - entities.Room.fields.waiver_required
          - entities.Room.fields.reset_buffer_minutes
        distinguishing_aspect: "Omitting min_age/waiver_required/reset_buffer_minutes -> defaults 0/true/0 applied."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 1000, game_minutes: 60 }
              as: VenueManager
              captures: { room: $.data.id }
          assert:
            - "Room.${room}.min_age == 0"
            - "Room.${room}.waiver_required == true"
            - "Room.${room}.reset_buffer_minutes == 0"
            - "Room.${room}.status == ACTIVE"

      - name: timeslot_computed_block_end_includes_buffer
        claim_type: Computed Fields
        grounds:
          - entities.TimeSlot.fields.game_end_utc
          - entities.TimeSlot.fields.block_end_utc
        distinguishing_aspect: "On slot create with game=60 buffer=30 start 14:00, game_end_utc==15:00 and block_end_utc==15:30 (computed, ignoring any client input)."
        test_recipe:
          setup: ["Venue open all day; Room game=60 buffer=30."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 1000, game_minutes: 60, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
          trigger:
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id }
          assert:
            - "TimeSlot.${slot}.game_end_utc == 2026-07-01T15:00:00.000Z"
            - "TimeSlot.${slot}.block_end_utc == 2026-07-01T15:30:00.000Z"
            - "TimeSlot.${slot}.status == OPEN"

      - name: get_booking_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Booking
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET booking with a well-formed but non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              as: Customer
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: duplicate_customer_email_returns_duplicate_resource
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.email
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "Registering a second customer with an email matching an existing one (case-insensitive) -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["A customer dup@x.com already registered."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Customer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { email: "DUP@x.com", full_name: "Second" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DUPLICATE_RESOURCE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_booking_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Booking.lifecycle_status.DRAFT_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_giftcard_fiscal_on_confirm
          rationale: "Second confirm on an already-CONFIRMED booking returning ERR_INVALID_STATE is asserted as the winning error of the named §1.8 instance."

      - name: complete_from_confirmed_skips_checkin_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Booking.lifecycle_status.CHECKED_IN_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "complete requires CHECKED_IN; calling complete on a CONFIRMED booking (skipping check-in) -> ERR_INVALID_STATE; no settlement fires."
        test_recipe:
          setup: ["Venue open all day; Room canonical off-peak; one GM, one slot; booking CONFIRMED group_size=2."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 2000, game_minutes: 60, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "x1@x.com", full_name: "X1" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/complete"
              payload: { expected_booking_version: "${bk_v2}" }
              as: GameMaster
              as_user_id: "${gm}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: close_held_slot_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TimeSlot.status.OPEN_to_HELD
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "close accepts only OPEN/BLOCKED; closing a HELD slot (booking holding it) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Venue open all day; Room canonical; one GM; one slot grabbed by a DRAFT booking (slot HELD)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 2000, game_minutes: 60, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "x2@x.com", full_name: "X2" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id }
            - call: "GET /time-slots/${slot}"
              as: VenueManager
              captures: { slot_v2: $.data.version }
          trigger:
            - call: "POST /time-slots/${slot}/close"
              payload: { expected_time_slot_version: "${slot_v2}" }
              as: VenueManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminal_cancelled_booking_cannot_cancel_again
        claim_type: terminal_state
        grounds:
          - state_machines.Booking.lifecycle_status.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal; a second cancel on a CANCELLED booking -> ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup: ["Venue open all day; Room canonical; one GM; one slot; DRAFT booking already CANCELLED."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 2000, game_minutes: 60, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "x3@x.com", full_name: "X3" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/cancel"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: { expected_booking_version: "${bk_v2}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: waiver_cyclic_revoke_after_sign
        claim_type: cyclic
        grounds:
          - state_machines.Participant.waiver_status.PENDING_to_SIGNED
          - state_machines.Participant.waiver_status.SIGNED_to_REVOKED
          - entities.Participant.fields.waiver_status
        distinguishing_aspect: "Participant waiver loop: PENDING->SIGNED then SIGNED->REVOKED; final waiver_status==REVOKED and version incremented twice."
        test_recipe:
          setup: ["Venue open all day; Room canonical; one GM; one slot; DRAFT booking with one PENDING participant."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 2000, game_minutes: 60, reset_buffer_minutes: 30, waiver_required: true }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "x4@x.com", full_name: "X4" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 1, expected_time_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/participants"
              payload: { display_name: "P1", age: 30 }
              as: Customer
              as_user_id: "${cust}"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /participants/${p1}/sign-waiver"
              payload: { expected_participant_version: "${p1_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { p1_v2: $.data.version }
          trigger:
            - call: "POST /participants/${p1}/revoke-waiver"
              payload: { expected_participant_version: "${p1_v2}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { p1_status: $.data.waiver_status }
          assert:
            - "Participant.${p1}.waiver_status == REVOKED"

      - name: giftcard_void_then_topup_returns_invalid_state
        claim_type: terminal_state
        grounds:
          - state_machines.GiftCard.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VOID is terminal for GiftCard; top-up on a VOID card -> ERR_INVALID_STATE; no TOPUP entry appended."
        test_recipe:
          setup: ["Venue; gift card issued then VOID."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /gift-cards"
              payload: { venue_id: "${ven}", code: "GC1", initial_balance_cents: 5000 }
              as: VenueManager
              captures: { gc: $.data.id, gc_v: $.data.version }
            - call: "POST /gift-cards/${gc}/void"
              payload: { expected_gift_card_version: "${gc_v}" }
              as: VenueManager
              captures: { gc_v2: $.data.version }
          trigger:
            - call: "POST /gift-cards/${gc}/top-up"
              payload: { amount_cents: 1000, expected_gift_card_version: "${gc_v2}" }
              as: VenueManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: settlement_full_group_equals_quote
        claim_type: Variant Selection
        grounds:
          - calculations.price_settlement
          - entities.Booking.fields.final_charge_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_diverges_from_quote_on_partial_checkin
          rationale: "The full-group settle_full variant (final==quote) is the complement of the partial divergence asserted in the named §1.8 instance; covered by the same recipe family with all participants present."

      - name: no_show_fee_round_half_up_boundary
        claim_type: Precision
        grounds:
          - calculations.no_show_fee
          - entities.Booking.fields.no_show_fee_cents
        distinguishing_aspect: "no_show_fee_pct=0.5 on quoted_charge_cents=6001 -> round_half_up(3000.5)=3001 (half rounds up, not down)."
        test_recipe:
          setup: ["Venue no_show_fee_pct=0.5. Room base such that an off-peak group quote == 6001 is unreachable in cents; instead use base=6001 with group_size=1 off-peak so quote==6001. One GM, one slot; booking CONFIRMED."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 6001, game_minutes: 60, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "x5@x.com", full_name: "X5" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 1, expected_time_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/no-show"
              payload: { expected_booking_version: "${bk_v2}" }
              as: GameMaster
              as_user_id: "${gm}"
          assert:
            - "Booking.${bk}.quoted_charge_cents == 6001"
            - "Booking.${bk}.no_show_fee_cents == 3001"

      - name: private_surcharge_added_after_per_participant_multipliers
        claim_type: Correct Result
        grounds:
          - calculations.price_quote
          - entities.Room.fields.private_surcharge_cents
          - entities.Booking.fields.is_private
        distinguishing_aspect: "is_private=true adds private_surcharge_cents=5000 once to the line total AFTER per-participant peak+large steps: 2000->3000->3600, *4=14400, +5000 = 19400."
        test_recipe:
          setup: ["Venue open all day; Room base=2000 private_surcharge=5000; PricingRule peak Wed 12-18 bps15000, large_threshold=4 bps12000; one GM, one peak slot; DRAFT booking group_size=4 is_private=true."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, reset_buffer_minutes: 30, private_surcharge_cents: 5000 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /pricing-rules"
              payload: { venue_id: "${ven}", room_id: "${room}", peak_dow_mask: 4, peak_start_minute_of_day: 720, peak_end_minute_of_day: 1080, large_group_threshold: 4, peak_multiplier_bps: 15000, large_group_multiplier_bps: 12000 }
              as: VenueManager
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "x6@x.com", full_name: "X6" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 4, expected_time_slot_version: "${slot_v}", is_private: true }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Booking.${bk}.quoted_charge_cents == 19400"

      - name: off_peak_dow_not_in_mask_uses_base_rate
        claim_type: Constants Applied
        grounds:
          - calculations.price_quote
          - entities.PricingRule.fields.peak_dow_mask
        distinguishing_aspect: "Slot on Thursday 2026-07-02T14:00 with peak mask=4 (Wednesday only): peak predicate false -> no peak multiplier; group 2 base 2000 -> quote 4000."
        test_recipe:
