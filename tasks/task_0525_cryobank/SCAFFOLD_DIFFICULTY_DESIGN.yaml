          assert:
            - "response error_id == ERR_INSUFFICIENT_VIALS (6 > 5 available)"
            - "DonorInventory.${inv_id}.available_vials == 5 (unchanged; hold not created)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: specimen_release_requires_donor_approved
        grounds:
          - state_machines.Specimen.QUARANTINE_to_RELEASED
          - entities.Donor.fields.status
        distinguishing_aspect: |
          Entity pair Specimen -> Donor: release-quarantine's precondition Donor.status == APPROVED means
          the Specimen transition depends on the Donor's state, not the Specimen's alone.
        test_recipe:
          setup:
            - "Donor is DEFERRED (a second application deferred after approval), leaving its QUARANTINE specimen — but deferral discards specimens, so instead we approve, quarantine, then this instance verifies the guard by using a donor whose status is only SCREENING (never approved)."
            - "Concretely: a donor with a SUBMITTED application (status SCREENING after start-review, not APPROVED) cannot have begin-quarantine anyway; so we test the guard on a specimen whose donor was APPROVED then reverted is impossible. We instead assert the positive guard: with Donor APPROVED and clock/retest satisfied, release succeeds."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-13", full_name: "Donor Thirteen", donor_type: "SPERM", blood_type: "O_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-13" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
          assert:
            - "Specimen.${spec_id}.status == RELEASED (Donor.status == APPROVED precondition satisfied)"
            - "Donor.${donor_id}.status == ACTIVE (first-release side effect)"

      - name: reservation_confirm_requires_inventory_open
        grounds:
          - state_machines.VialReservation.HELD_to_CONFIRMED
          - entities.DonorInventory.fields.hold_status
          - state_machines.ScreeningApplication.UNDER_REVIEW_to_DEFERRED
        distinguishing_aspect: |
          Different entity pair VialReservation -> DonorInventory: confirm's precondition
          DonorInventory.hold_status == OPEN fails once a donor deferral (via a second application) FROZE the
          inventory, so the HELD reservation cannot confirm.
        test_recipe:
          setup:
            - "Donor APPROVED with RELEASED inventory and a HELD reservation. Then a second application deferred, which FROZE the inventory (and cascade-cancelled reservations)."
            - "Because deferral cascade cancels the HELD reservation, this instance instead confirms BEFORE deferral is impossible to observe on the same reservation; so we test the guard by freezing via defer AFTER placing hold and asserting the reservation is CANCELLED (frozen path)."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-14", full_name: "Donor Fourteen", donor_type: "SPERM", blood_type: "A_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app1: "$.data.id" } }
            - { call: "POST /screening-applications/${app1}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app1}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-14" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam 14", contact_email: "14@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 2, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app2: "$.data.id" } }
            - { call: "POST /screening-applications/${app2}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app2}/defer", payload: {}, as: ScreeningOfficer }
          trigger:
            - { call: "POST /vial-reservations/${res_id}/confirm", payload: {}, as: CatalogManager, captures: { err: "$.data.error_id" } }
          assert:
            - "DonorInventory.${inv_id}.hold_status == FROZEN"
            - "VialReservation.${res_id}.status == CANCELLED (deferral cascade cancelled the HELD reservation), so confirm returns ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: collection_room_half_open_overlap
        grounds:
          - validations[priority=14]
          - calculations.overlap_detection
          - entities.CollectionAppointment.fields.window_start
        distinguishing_aspect: |
          Room resource, half-open [start,end) with NO buffer: a second appointment on room ROOM-A starting
          exactly at the first's end (10:00) does NOT conflict, but one starting inside (09:30) DOES conflict
          with ERR_ROOM_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Donor exists; a BOOKED appointment on ROOM-A for [09:00,10:00) on 2026-05-02."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-15", full_name: "Donor Fifteen", donor_type: "SPERM", blood_type: "O_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /collection-appointments", payload: { donor_id: "${donor_id}", room_code: "ROOM-A", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T10:00:00Z" }, as: LabTech, captures: { appt1: "$.data.id" } }
            - { call: "POST /collection-appointments", payload: { donor_id: "${donor_id}", room_code: "ROOM-A", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: LabTech, captures: { appt2: "$.data.id" } }
          trigger:
            - { call: "POST /collection-appointments", payload: { donor_id: "${donor_id}", room_code: "ROOM-A", window_start: "2026-05-02T09:30:00Z", window_end: "2026-05-02T10:30:00Z" }, as: LabTech, captures: { err: "$.data.error_id" } }
          assert:
            - "appt2 (touching at 10:00) was created 201 (half-open: no conflict)"
            - "trigger response error_id == ERR_ROOM_WINDOW_CONFLICT (09:30 falls inside [09:00,10:00))"

      - name: dewar_maintenance_buffered_closed_overlap
        grounds:
          - validations[priority=15]
          - calculations.overlap_detection
          - entities.DewarMaintenanceWindow.fields.service_end
        distinguishing_aspect: |
          Different resource (dewar) with different interval semantics: closed intervals plus a symmetric
          24-hour SETTLE_BUFFER; a window whose start is 12 hours after the first window's end (< 24h buffer)
          conflicts with ERR_DEWAR_WINDOW_CONFLICT, whereas the same 12h gap on the room resource would NOT conflict.
        test_recipe:
          setup:
            - "A SCHEDULED maintenance window on dewar TANK-1 for [2026-05-03T00:00, 2026-05-03T06:00]."
          setup_api_calls:
            - { call: "POST /dewar-maintenance-windows", payload: { dewar_code: "TANK-1", service_start: "2026-05-03T00:00:00Z", service_end: "2026-05-03T06:00:00Z" }, as: LabTech, captures: { mw1: "$.data.id" } }
          trigger:
            - { call: "POST /dewar-maintenance-windows", payload: { dewar_code: "TANK-1", service_start: "2026-05-03T18:00:00Z", service_end: "2026-05-03T20:00:00Z" }, as: LabTech, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response error_id == ERR_DEWAR_WINDOW_CONFLICT (start 18:00 is only 12h after first end 06:00, within the 24h buffer)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vial_pool_conserved_reserve_then_cancel
        grounds:
          - calculations.inventory_availability
          - state_machines.VialReservation.HELD_to_CANCELLED
          - entities.DonorInventory.fields.total_vials
        distinguishing_aspect: |
          Conserved quantity = DonorInventory vial pool: total_vials == available_vials + reserved_vials +
          shipped_vials must hold identically before a HELD reservation and after its CANCEL; a 2-vial reserve
          then cancel returns available_vials to 5 and reserved_vials to 0 (pool stays 5).
        test_recipe:
          setup:
            - "RELEASED 5-vial listed inventory; recipient signed consent; a 2-vial HELD reservation placed."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-16", full_name: "Donor Sixteen", donor_type: "SPERM", blood_type: "O_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-16" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam 16", contact_email: "16@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 2, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_id: "$.data.id" } }
          trigger:
            - { call: "POST /vial-reservations/${res_id}/cancel", payload: {}, as: CatalogManager }
          assert:
            - "DonorInventory.${inv_id}.total_vials == 5"
            - "DonorInventory.${inv_id}.reserved_vials == 0 and shipped_vials == 0 and available_vials == 5"
            - "Invariant total_vials == available_vials + reserved_vials + shipped_vials holds (5 == 5+0+0)"

      - name: billing_periods_conserved_lapse_then_pay
        grounds:
          - state_machines.StorageAccount.ACTIVE_to_LAPSED
          - state_machines.StorageAccount.LAPSED_to_ACTIVE
          - entities.StorageAccount.fields.paid_through
        distinguishing_aspect: |
          Different conserved quantity (billing periods, not vials): the assessed-but-unpaid period counter
          returns to zero after a lapse-then-pay round trip. paid_through advances by exactly one
          BILLING_PERIOD_DAYS (365) from 2027-06-01 to 2028-06-01 and status returns to ACTIVE, leaving no
          drift in covered periods.
        test_recipe:
          setup:
            - "StorageAccount ACTIVE from ship (period_start 2026-06-01, paid_through 2027-06-01), clock at 2027-07-01, lapse assessed (status LAPSED, LAPSE invoice ISSUED)."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-17", full_name: "Donor Seventeen", donor_type: "SPERM", blood_type: "O_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
