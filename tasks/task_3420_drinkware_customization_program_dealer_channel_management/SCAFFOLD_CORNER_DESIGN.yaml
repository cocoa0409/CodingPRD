          trigger:
            - call: "POST /drinkware/warranty-claims/${claim_cred}/decide"
              payload: { outcome: "APPROVE_REPLACEMENT", decision_reason: "cannot repair a stripped thread" }
              as: WarrantyAgent
              as_user_id: "wa-1"
          assert:
            - "WarrantyClaim.${claim_cred}.status == APPROVED_REPLACEMENT"
            - "replacement_colorway_resolution == CREDIT_EQUIVALENT (line not ACTIVE, no order colorway)"
            - "credit_equivalent_cents == 3499 (map_price_cents snapshot)"

      - name: proof_round_cap_at_3_exhausts_artwork
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CustomizationOrder.artwork_status
          - errors.ERR_PROOF_ROUND_EXHAUSTED
        distinguishing_aspect: "The revision cycle is capped: after the THIRD request-changes the order lands in PROOF_EXHAUSTED, a fourth proof submission is 422 ERR_PROOF_ROUND_EXHAUSTED, and the only remaining lifecycle action is cancel (fee 0 — art was never approved)."
        test_recipe:
          setup:
