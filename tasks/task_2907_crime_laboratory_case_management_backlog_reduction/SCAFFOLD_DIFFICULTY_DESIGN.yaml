# =============================================================================
# 1.8  Scaffold Difficulty Design - forensic-laboratory-casework (task 2907)
# -----------------------------------------------------------------------------
# Machine-readable index of every difficulty feature SCAFFOLD.yaml already
# declares in §1.1-§1.7, cross-referenced against the nine Difficulty Rules.
# This file adds NO behaviour: deleting it leaves the scaffold's declared
# semantics byte-identical, it only makes test coverage auditable.
#
# Conventions used by every test_recipe below:
#   * api_prefix is /lab; every `call:` is a §1.5-declared endpoint.
#   * The logical clock starts at 2026-08-01T00:00:00Z; every chain that depends
#     on time re-pins it explicitly through POST /lab/_clock/set_current_utc.
#   * `as:` is the X-Role header value. `as_user_id:` is the X-User-ID header;
#     it is pinned wherever identity is load-bearing (role Analyst, and the
#     segregation-of-duties comparisons on the three review endpoints) and
#     omitted for opaque roles where any non-empty operator id satisfies
#     validations[priority=1].
#   * Every numeric literal in an `assert:` line was produced by executing the
#     relevant §1.3 formula with Decimal ROUND_HALF_UP, not estimated.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: analyst_workload_projected_estimate_vs_realized_logged
        grounds:
          - calculations.analyst_workload_variants
          - entities.Analyst.fields.assigned_casework_hours
          - entities.ExaminationRequest.fields.actual_hours_logged
          - state_machines.Assignment.ACTIVE_to_COMPLETED
          - endpoints[GET /lab/analysts/{analyst_id}/workload]
        distinguishing_aspect: |
          One analyst with one COMPLETED assignment that logged 24.00 actual hours against a
          6.00-hour estimate plus one ACTIVE assignment estimated at 6.00 yields
          projected_utilization_pct 18.75 and realized_utilization_pct 93.75 from the same
          available_hours 32.00 - the PROJECTED_ESTIMATE variant drops completed work out of
          the numerator entirely while REALIZED_LOGGED adds it back at actual_hours_logged.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: disciplines [CHEMISTRY], competency_level 4, weekly_capacity_hours 40.00, training_hours_per_week 8.00 -> available_hours 32.00."
            - "Method M1 VALIDATED, discipline CHEMISTRY, standard_hours_per_item 2.00, min_competency_level 3, max_items_per_request 10."
            - "Case C1 (DRUG_OFFENSE, no statutory deadline, no court date) -> priority_score 12.00, priority_class P3_ROUTINE, ACCEPTED with two vault items."
            - "Request R1 (item_count 3, estimated_hours 6.00) fully analysed by A1 with actual_hours 24.00, so its Assignment is COMPLETED."
            - "Request R2 (item_count 3, estimated_hours 6.00) currently ASSIGNED to A1, so its Assignment is ACTIVE."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Ada Nakamura", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/analysts"
              payload: { full_name: "Bo Ferreira", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a2: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "D-2026-0101", submitting_agency: "METRO PD", offense_category: "DRUG_OFFENSE", suspect_in_custody: false }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed bag, white crystalline powder", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "2", item_description: "Sealed vial, amber liquid", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e2: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 3 }
              as: CaseManager
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg1: $.data.id }
            - call: "POST /lab/examination-requests/${r1}/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/examination-requests/${r1}/complete-analysis"
              payload: { actual_hours: 24.00, evidence_consumed: false }
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e2}", method_id: "${m1}", item_count: 3 }
              as: CaseManager
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /lab/examination-requests/${r2}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r2_v}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg2: $.data.id }
          trigger:
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: QualityManager
          assert:
            - "workload.available_hours == 32.00"
            - "workload.projected_load_hours == 6.00"
            - "workload.projected_utilization_pct == 18.75"
            - "workload.realized_load_hours == 30.00"
            - "workload.realized_utilization_pct == 93.75"
            - "workload.projected_utilization_pct != workload.realized_utilization_pct"
            - "workload.casework_training_ratio == 0.75"
            - "workload.active_assignment_count == 1"
            - "workload.assigned_casework_hours == 6.00"
            - "Analyst.${a1}.assigned_casework_hours == 6.00"
            - "Assignment.${asg1}.status == COMPLETED"
            - "Assignment.${asg2}.status == ACTIVE"
            - "ExaminationRequest.${r1}.actual_hours_logged == 24.00"
            - "ExaminationRequest.${r2}.actual_hours_logged is null"

      - name: case_turnaround_gross_calendar_vs_net_lab_custody
        grounds:
          - calculations.case_turnaround_variants
          - entities.Case.fields.gross_turnaround_days
          - entities.Case.fields.net_turnaround_days
          - entities.ExaminationRequest.fields.vendor_custody_days
          - state_machines.VendorEngagement.AT_VENDOR_to_RETURNED
          - state_machines.Case.IN_PROGRESS_to_REPORTED
        distinguishing_aspect: |
          The same reported case yields gross_turnaround_days 40.00 and net_turnaround_days 25.00
          because the GROSS_CALENDAR variant counts every second from received_at_utc to
          reported_at_utc while NET_LAB_CUSTODY subtracts the merged union of RETURNED vendor
          windows (a single 15.00-day window here), so the delta equals vendor custody exactly.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z, so Case C1.received_at_utc == 2026-08-01T00:00:00Z."
            - "Vendor V1 accredited for CHEMISTRY until 2027-01-01T00:00:00Z, concurrent_case_capacity 2, unit_price_cents 45000, rush_surcharge_pct 0.00, contract_ceiling_cents 10000000."
            - "Request R1 (item_count 2) is outsourced to V1, shipped on 2026-08-05T00:00:00Z and returned on 2026-08-20T00:00:00Z -> engagement custody_days 15.00."
            - "The returned request is technically reviewed by analyst A2 (never the assigned analyst - an outsourced request has assigned_analyst_id null) and administratively approved, reaching RELEASED."
            - "The clock is advanced to 2026-09-10T00:00:00Z before the case report is released."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Bo Ferreira", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a2: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/vendors"
              payload: { name: "Cascade Reference Laboratory", accredited_disciplines: ["CHEMISTRY"], accreditation_expires_at_utc: "2027-01-01T00:00:00Z", concurrent_case_capacity: 2, unit_price_cents: 45000, rush_surcharge_pct: 0.00, contract_ceiling_cents: 10000000 }
              as: LabDirector
              captures: { v1: $.data.id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "D-2026-0202", submitting_agency: "METRO PD", offense_category: "DRUG_OFFENSE", suspect_in_custody: false }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed bag, tan powder", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { r1: $.data.id }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/examination-requests/${r1}/vendor-engagements"
              payload: { vendor_id: "${v1}", window_start_utc: "2026-08-05T00:00:00Z", window_end_utc: "2026-08-20T00:00:00Z", rush_flag: false }
              as: CaseManager
              captures: { ve1: $.data.id }
            - call: "POST /lab/vendor-engagements/${ve1}/confirm-shipment"
              payload: {}
              as: CaseManager
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/vendor-engagements/${ve1}/record-return"
              payload: { final_invoice_cents: 90000 }
              as: CaseManager
            - call: "POST /lab/examination-requests/${r1}/technical-review"
              payload: { decision: "AGREE", rationale: "Vendor data package reviewed against method acceptance criteria; conclusions supported." }
              as: Analyst
              as_user_id: "${a2}"
            - call: "POST /lab/examination-requests/${r1}/administrative-review"
              payload: { decision: "APPROVE", rationale: "Report format, chain of custody and scope statement verified." }
              as: CaseManager
              as_user_id: "ops-casemgr-1"
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/cases/${c1}/report"
              payload: {}
              as: CaseManager
              as_user_id: "ops-casemgr-1"
          assert:
            - "Case.${c1}.workflow_status == REPORTED"
            - "Case.${c1}.reported_at_utc == 2026-09-10T00:00:00Z"
            - "Case.${c1}.gross_turnaround_days == 40.00"
            - "Case.${c1}.net_turnaround_days == 25.00"
            - "Case.${c1}.gross_turnaround_days - Case.${c1}.net_turnaround_days == 15.00"
            - "VendorEngagement.${ve1}.custody_days == 15.00"
            - "VendorEngagement.${ve1}.status == RETURNED"
            - "VendorEngagement.${ve1}.variance_cents == 0"
            - "ExaminationRequest.${r1}.vendor_custody_days == 15.00"
            - "ExaminationRequest.${r1}.assigned_analyst_id is null"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: case_priority_score_violence_multiplier_before_temporal_blend
        grounds:
          - calculations.case_priority_scoring
          - entities.Case.fields.priority_score
          - entities.Case.fields.priority_class
          - entities.Case.fields.violent_crime_flag
          - endpoints[POST /lab/cases]
        distinguishing_aspect: |
          Three interacting stages in a pinned order - VIOLENT_MULTIPLIER applied to
          (severity + custody) only, then a max/half-min temporal blend of deadline and court
          points, then the SCORE_CAP - produce 85.00; the naive order that sums all four point
          sources and then multiplies by 1.10 produces 90.20, so the two orders are separable
          by a single assertion.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z, so received_at_utc == 2026-08-01T00:00:00Z."
            - "No other rows exist; the score depends only on the submitted body and the clock."
            - "Inputs: HOMICIDE (SEVERITY_POINTS 40), suspect_in_custody true (CUSTODY_POINTS 15), statutory_deadline_utc 2026-08-20T00:00:00Z (days_to_deadline 19 -> deadline_points 22), court_date_utc 2026-09-15T00:00:00Z (days_to_court 45 -> court_points 5)."
            - "Hand-executed formula: weighted_base = round_half_up((40 + 15) * 1.10, 2) = 60.50; temporal_points = round_half_up(22 + 5 * 0.50, 2) = 24.50; priority_score = min(100.00, 85.00) = 85.00."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/cases"
              payload: { agency_case_number: "H-2026-0001", submitting_agency: "METRO PD", offense_category: "HOMICIDE", suspect_in_custody: true, statutory_deadline_utc: "2026-08-20T00:00:00Z", court_date_utc: "2026-09-15T00:00:00Z" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
          assert:
            - "Case.${c1}.violent_crime_flag == true"
            - "Case.${c1}.received_at_utc == 2026-08-01T00:00:00Z"
            - "Case.${c1}.priority_score == 85.00"
            - "Case.${c1}.priority_score != 90.20"
            - "Case.${c1}.priority_class == P1_STATUTORY"
            - "Case.${c1}.priority_override_class is null"
            - "Case.${c1}.workflow_status == SUBMITTED"
            - "Case.${c1}.discovery_status == NONE"

      - name: vendor_award_rush_surcharge_enters_tier_basis_before_discount
        grounds:
          - calculations.vendor_award_pricing
          - entities.VendorEngagement.fields.tier_basis_cents
          - entities.VendorEngagement.fields.award_amount_cents
          - entities.Vendor.fields.encumbered_cents
          - state_machines.ExaminationRequest.QUEUED_to_OUTSOURCED
        distinguishing_aspect: |
          The rush surcharge is circular with the volume tier, and the pinned six-step order
          (surcharge first, tier chosen on base+surcharge, discount last) awards 238050 cents
          where the rejected discount-then-surcharge order awards 248400 - a 10350-cent gap
          that no rounding choice can explain.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Vendor V1: unit_price_cents 45000, rush_surcharge_pct 0.15, accredited for CHEMISTRY until 2027-01-01T00:00:00Z, concurrent_case_capacity 2, contract_ceiling_cents 10000000, encumbered_cents 0, spent_cents 0."
            - "Method M1 VALIDATED, discipline CHEMISTRY, max_items_per_request 10."
            - "Case C1 ACCEPTED with one vault item; Request R1 QUEUED with item_count 5."
            - "Hand-executed formula: base 45000*5 = 225000; surcharge round_half_up(225000*0.15) = 33750; tier_basis 258750 >= 250000 -> 0.08; discount round_half_up(258750*0.08) = 20700; award 258750 - 20700 = 238050."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/vendors"
              payload: { name: "Cascade Reference Laboratory", accredited_disciplines: ["CHEMISTRY"], accreditation_expires_at_utc: "2027-01-01T00:00:00Z", concurrent_case_capacity: 2, unit_price_cents: 45000, rush_surcharge_pct: 0.15, contract_ceiling_cents: 10000000 }
              as: LabDirector
              captures: { v1: $.data.id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "D-2026-0303", submitting_agency: "METRO PD", offense_category: "DRUG_OFFENSE", suspect_in_custody: false }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Five sealed bindles", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 5 }
              as: CaseManager
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /lab/examination-requests/${r1}/vendor-engagements"
              payload: { vendor_id: "${v1}", window_start_utc: "2026-08-05T00:00:00Z", window_end_utc: "2026-08-25T00:00:00Z", rush_flag: true }
              as: CaseManager
              captures: { ve1: $.data.id }
          assert:
            - "VendorEngagement.${ve1}.item_count == 5"
            - "VendorEngagement.${ve1}.base_amount_cents == 225000"
            - "VendorEngagement.${ve1}.rush_surcharge_cents == 33750"
            - "VendorEngagement.${ve1}.tier_basis_cents == 258750"
            - "VendorEngagement.${ve1}.volume_discount_pct == 0.08"
            - "VendorEngagement.${ve1}.discount_amount_cents == 20700"
            - "VendorEngagement.${ve1}.award_amount_cents == 238050"
            - "VendorEngagement.${ve1}.award_amount_cents != 248400"
            - "VendorEngagement.${ve1}.status == AWARDED"
            - "Vendor.${v1}.encumbered_cents == 238050"
            - "Vendor.${v1}.spent_cents == 0"
            - "ExaminationRequest.${r1}.status == OUTSOURCED"
            - "Case.${c1}.workflow_status == IN_PROGRESS"

      - name: backlog_index_rounds_each_request_age_before_weighting
        grounds:
          - calculations.backlog_aging_index
          - entities.Case.fields.priority_class
          - endpoints[GET /lab/backlog-report]
        distinguishing_aspect: |
          A single P1_STATUTORY request aged 10.005 days at the requested as_of_utc yields
          backlog_index 15.02 under the pinned per-request round-then-weight-then-round order
          and 15.01 under the rejected weight-the-unrounded-age order, so one assertion
          separates the two rounding orders on a one-row population.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Case C1 (HOMICIDE, suspect_in_custody true, statutory_deadline_utc 2026-08-20T00:00:00Z, court_date_utc 2026-09-15T00:00:00Z) -> priority_class P1_STATUTORY, PRIORITY_WEIGHT 1.50."
            - "Case C1 ACCEPTED with one vault item; Request R1 QUEUED with requested_at_utc 2026-08-01T00:00:00Z; it is the only non-terminal request in the system."
            - "as_of_utc 2026-08-11T00:07:12Z is exactly 864432 seconds after requested_at_utc = 10.005 days."
            - "Hand-executed formula: age_days = round_half_up(10.005, 2) = 10.01; weighted = round_half_up(10.01 * 1.50, 2) = round_half_up(15.015, 2) = 15.02; index = round_half_up(15.02 / 1, 2) = 15.02. The rejected order gives round_half_up(10.005 * 1.50, 2) = 15.01."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "H-2026-0404", submitting_agency: "METRO PD", offense_category: "HOMICIDE", suspect_in_custody: true, statutory_deadline_utc: "2026-08-20T00:00:00Z", court_date_utc: "2026-09-15T00:00:00Z" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed swab box from scene", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r1: $.data.id }
          trigger:
            - call: "GET /lab/backlog-report"
              payload: { as_of_utc: "2026-08-11T00:07:12Z" }
              as: QualityManager
          assert:
            - "backlog_report.as_of_utc == 2026-08-11T00:07:12Z"
            - "backlog_report.open_request_count == 1"
            - "backlog_report.backlog_index == 15.02"
            - "backlog_report.backlog_index != 15.01"
