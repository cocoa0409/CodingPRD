              captures: { after_release_id: "$.data.id", after_release_status: "$.data.status" }
          assert:
            - "hold1_status == HELD"
            - "the 12:00Z GRAND_BALLROOM request returns HTTP 409 with buffer_error == ERR_FUNCTION_SPACE_CONFLICT"
            - "other_space_status == HELD (the buffer is per space_code)"
            - "at_buffer_status == HELD (12:45Z is exactly the end of the buffered interval and is free)"
            - "FunctionSpaceHold.${hold1_id}.status == RELEASED after the release call"
            - "after_release_status == HELD (releasing the blocking hold frees the buffered slot)"
            - "GET /group-sales/leads/${lead_id}/function-space-holds returns 4 rows: one RELEASED and three HELD"

  - rule_id: compensating_invariant
    instances:

      - name: block_night_room_conservation_survives_cancel_then_cutoff
        grounds:
          - calculations.sub_block_allocation
          - calculations.block_pickup
          - state_machines.Reservation.PENDING_to_CANCELLED
          - state_machines.RoomBlock.OPEN_to_CUT_OFF
        distinguishing_aspect: |
          The conserved quantity is per master night:
          rooms_allotted == rooms_sub_allocated + rooms_picked_up + rooms_released + rooms_open.
          A reservation is booked against the master and then cancelled, which must hand its rooms back
          to rooms_open on exactly the nights of the half-open stay and leave the identity intact; the
          cutoff cascade then converts the remaining rooms_open into rooms_released. The invariant is
          asserted on every night of both blocks after the compensating cancel and again after the
          cascade, so an implementation that double-counts the returned rooms (open goes to 3 on the
          11th, or the cancelled reservation still shows in rooms_picked_up) is caught even though the
          block-level totals could still look plausible.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; InventoryDay rows for 2026-11-09..11; package P1; lead CLEARED"
            - "contract signed with allotments 4/4/4 -> master block SETUP, cutoff_date 2026-10-19, InventoryDay committed 4/4/4"
