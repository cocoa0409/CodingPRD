              captures: { err_session: $.data.error_id }
            - call: "GET /cash-ops/safe-transactions/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { err_txn: $.data.error_id }
            - call: "GET /cash-ops/deposits/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { err_deposit: $.data.error_id }
            - call: "GET /cash-ops/bank-credit-records/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { err_credit: $.data.error_id }
            - call: "GET /cash-ops/card-settlements/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { err_settlement: $.data.error_id }
            - call: "GET /cash-ops/variance-cases/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: LossPreventionInvestigator
