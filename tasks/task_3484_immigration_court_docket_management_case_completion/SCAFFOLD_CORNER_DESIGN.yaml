              captures: { case2: $.data.id }
            - call: "POST /eoir/cases/${case2}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case2_v2: $.data.version }
            - call: "POST /eoir/hearings"
