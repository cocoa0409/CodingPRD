  # =================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: product_line_stock_conserved_service_consume_then_restore
        grounds:
          - "state_machines.ServiceOrder.IN_PROGRESS_to_READY"
          - "state_machines.ServiceOrder.READY_to_CANCELLED"
          - "entities.Product.fields.stock_qty"
          - "entities.ServiceOrder.fields.stock_consumed"
        distinguishing_aspect: "Conserved quantity is physical line stock (Product.stock_qty): a ServiceOrder reaching READY deducts 2 units (50 -> 48); cancelling from READY restores exactly 2 (-> 50), leaving stock at its pre-service value with zero drift."
        test_recipe:
          setup:
            - "Customer C. Product P stock 50. ServiceOrder S (base 2500, rate 30, estimated 100, product P) is DIAGNOSED, IN_PROGRESS, then READY consuming line_units 2 (P.stock_qty now 48, stock_consumed true)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Cons", email: "c.ci1@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/products"
              payload: { sku: "LINE-12", name: "12lb", category: "LINE", unit_price_cents: 0, stock_qty: 50 }
              as: ShopManager
              captures: { p_id: "$.data.id" }
            - call: "POST /api/service-orders"
              payload: { customer_id: "${c_id}", service_type: "SPOOLING", base_service_cents: 2500, product_id: "${p_id}", line_price_cents_per_meter: 30, estimated_line_meters: 100 }
              as: ShopClerk
              captures: { s_id: "$.data.id" }
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "DIAGNOSED" }
              as: ShopClerk
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: ShopClerk
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "READY", actual_line_meters: 120, parts_cents: 800, line_units: 2 }
              as: ShopClerk
          trigger:
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: ShopClerk
          assert:
            - "Product.${p_id}.stock_qty == 50"
            - "ServiceOrder.${s_id}.stock_consumed == false"
            - "ServiceOrder.${s_id}.status == CANCELLED"

      - name: loyalty_points_conserved_license_issue_then_void
        grounds:
          - "state_machines.LicenseSale.ACTIVE_to_VOIDED"
          - "calculations.license_points_earned"
          - "entities.Customer.fields.loyalty_points_balance"
          - "entities.Customer.fields.lifetime_points_earned"
        distinguishing_aspect: "Conserved quantity is loyalty points (a different quantity than physical stock): issuing a 3000-cent license credits 30 points (balance 30, lifetime 30); voiding within grace reverses exactly 30, returning both to 0 with no drift, and refunds the full 3000."
        test_recipe:
          setup:
            - "Clock 2026-07-10. Customer M with balance 0. LicenseType LT base 3000, min_age 0, season all-2026, validity 365. M is issued a license (points 30 credited)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "M Loyal", email: "m.ci2@x.com", date_of_birth: "1980-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-ANN9", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
              captures: { ls_id: "$.data.id", pts: "$.data.points_earned" }
          trigger:
            - call: "POST /api/license-sales/${ls_id}/void"
              payload: {}
              as: ShopClerk
