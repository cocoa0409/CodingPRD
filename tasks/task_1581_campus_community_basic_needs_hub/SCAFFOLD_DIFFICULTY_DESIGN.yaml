              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /grant-funds"
              payload: { fund_name: "FY26-mini", fiscal_year: 2026, allocated_cents: 100000 }
              as: HubAdmin
              captures: { f_id: $.data.id }
            - call: "POST /clients/${c_id}/grant-applications"
              payload: { fund_id: "${f_id}", category: "TRANSPORT", requested_cents: 20000, hardship_statement: "bus pass" }
              as: Client
              as_user_id: "${c_id}"
              captures: { g_id: $.data.id }
            - call: "POST /clients/${c_id}/suspend"
              payload: {}
              as: HubAdmin
            - call: "POST /grant-funds/${f_id}/close"
              payload: {}
              as: HubAdmin
          trigger:
            - call: "POST /grant-applications/${g_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with error_id == ERR_CLIENT_NOT_ACTIVE (state, priority 8)"
            - "error_id != ERR_FUND_CLOSED although the fund is also CLOSED (business_fiscal, priority 22)"

