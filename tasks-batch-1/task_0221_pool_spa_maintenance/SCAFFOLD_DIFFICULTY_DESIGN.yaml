scaffold_difficulty_design:
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dosing_provisional_vs_final_on_chemical_reading
        grounds:
          - calculations.dosing_recommendation
          - entities.ChemicalReading.fields.recommended_dose_grams
          - state_machines.ServiceVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant lives on the ChemicalReading domain (water chemistry): the provisional
          route-estimate uses last-known readings while the final uses the actual measured reading,
          so identical pool volume yields a different recommended_dose_grams than the bill calc.
        test_recipe:
          setup:
            - "Customer + CHLORINE pool 20000 gal, ACTIVE one-time plan, route DISPATCHED, one SCHEDULED visit on it, pool OPEN."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann Owner", email: "ann@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_id}/readings"
              payload: { free_chlorine_ppm: 1.0, ph: 7.5, total_alkalinity_ppm: 80 }
              as: FieldTechnician
              captures: { reading_id: $.data.id }
          assert:
            - "ChemicalReading.${reading_id}.recommended_dose_grams == 116.0"
            - "ChemicalReading.${reading_id}.recommended_dose_grams != ServiceVisit.${visit_id}.billed_amount_cents"

      - name: visit_bill_provisional_quote_vs_final_on_service_visit
        grounds:
          - calculations.final_visit_bill
          - entities.ServiceVisit.fields.billed_amount_cents
          - state_machines.ServiceVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant lives on the ServiceVisit billing domain (money), a different entity domain
          than dosing: provisional plan quote bills base only (8000) while final on a green-pool initial
          visit bills base+green surcharge (26000), diverging when a surcharge fires.
        test_recipe:
          setup:
            - "CHLORINE pool 20000 gal OPEN, ACTIVE one-time plan rate 8000, route DISPATCHED, one SCHEDULED visit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo Owner", email: "bo@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
          assert:
            - "ServiceVisit.${visit_id}.billed_amount_cents == 26000"
            - "ServiceVisit.${visit_id}.billed_amount_cents != ServicePlan.${plan_id}.per_visit_rate_cents"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dosing_sum_then_round_order_pinned
        grounds:
          - calculations.dosing_recommendation
          - entities.ChemicalReading.fields.recommended_dose_grams
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: chlorine and alkalinity components are summed
          THEN rounded once; with a pH penalty multiplier (1.25) on chlorine only, round-each-then-sum
          would differ from sum-then-round at the 0.1 boundary.
        test_recipe:
          setup:
            - "SALTWATER pool 20000 gal OPEN, ACTIVE plan, route DISPATCHED, SCHEDULED visit; reading fc=1.0 ph=8.0 ta=100."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ce Owner", email: "ce@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Spa", water_type: "SALTWATER", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_id}/readings"
              payload: { free_chlorine_ppm: 1.0, ph: 8.0, total_alkalinity_ppm: 100 }
              as: FieldTechnician
              captures: { reading_id: $.data.id }
          assert:
            - "ChemicalReading.${reading_id}.recommended_dose_grams == 100.0"

      - name: repair_total_pinned_evaluation_order
        grounds:
          - calculations.repair_total
          - entities.WorkOrder.fields.repair_total_cents
          - state_machines.WorkOrder.AWAITING_APPROVAL_to_RESOLVED
        distinguishing_aspect: |
          Mode (a) ≥3 inputs with non-linear interaction: ceil-to-whole-hour labor, a severity multiplier
          applied to labor ONLY, parts added after, then a single final tax round — branches on severity
          enum and labor bracket, a different combinatorial axis than dosing's rounding mode.
        test_recipe:
          setup:
            - "Pool with a MAJOR work order taken OPEN->DIAGNOSED(parts 5000, labor 90)->AWAITING_APPROVAL; customer owns pool."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "De Owner", email: "de@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /work-orders"
              payload: { pool_id: "${pool_id}", component: "PUMP", severity: "MAJOR" }
              as: FieldTechnician
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/diagnose"
              payload: { quoted_parts_cents: 5000, labor_minutes: 90 }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/submit-for-approval"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /work-orders/${wo_id}/resolve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "WorkOrder.${wo_id}.repair_total_cents == 27499"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_hold_rediagnose_cycle
        grounds:
          - state_machines.WorkOrder.AWAITING_APPROVAL_to_ON_HOLD
          - state_machines.WorkOrder.ON_HOLD_to_DIAGNOSED
          - state_machines.WorkOrder.DIAGNOSED_to_AWAITING_APPROVAL
        distinguishing_aspect: |
          WorkOrder is cyclic: AWAITING_APPROVAL->ON_HOLD->DIAGNOSED->AWAITING_APPROVAL forms a revision
          loop on the WorkOrder entity, re-setting the quote each loop.
        test_recipe:
          setup:
            - "WorkOrder AWAITING_APPROVAL with quote parts 5000 labor 90; customer owns pool."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ef Owner", email: "ef@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /work-orders"
              payload: { pool_id: "${pool_id}", component: "HEATER", severity: "MAJOR" }
              as: FieldTechnician
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/diagnose"
              payload: { quoted_parts_cents: 5000, labor_minutes: 90 }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/submit-for-approval"
              payload: {}
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/hold"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/re-diagnose"
              payload: { quoted_parts_cents: 9000, labor_minutes: 120 }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/submit-for-approval"
              payload: {}
              as: FieldTechnician
              captures: { wo_status: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == AWAITING_APPROVAL"
            - "WorkOrder.${wo_id}.quoted_parts_cents == 9000"

      - name: service_visit_branching_complete_vs_skip
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_COMPLETED
          - state_machines.ServiceVisit.SCHEDULED_to_SKIPPED
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          ServiceVisit branches SCHEDULED -> {COMPLETED, SKIPPED, CANCELLED} with divergent side-effect
          sets (COMPLETED bills + recomputes plan; SKIPPED may makeup + never bills), on a different
          entity than WorkOrder.
        test_recipe:
          setup:
            - "Two SCHEDULED visits on one DISPATCHED route, pool OPEN, ACTIVE recurring plan; complete one, skip(WEATHER) the other."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gh Owner", email: "gh@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000, prepaid_visit_count: 0 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_a: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 600, slot_end_minute: 660 }
              as: RouteManager
              captures: { visit_b: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_a}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
            - call: "POST /visits/${visit_b}/skip"
              payload: { skip_reason: "WEATHER" }
              as: RouteManager
          assert:
            - "ServiceVisit.${visit_a}.status == COMPLETED"
            - "ServiceVisit.${visit_a}.billed_amount_cents == 6000"
            - "ServiceVisit.${visit_b}.status == SKIPPED"
            - "ServiceVisit.${visit_b}.billed_amount_cents == 0"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: green_pool_completion_cascade_depth3
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_COMPLETED
          - state_machines.Pool.OPEN_to_GREEN_RECOVERY
          - entities.ServiceVisit.fields.makeup_visit_id
        distinguishing_aspect: |
          Depth-3 cascade from visit completion: complete(green) mutates ServiceVisit->COMPLETED (A);
          that completion mutates Pool->GREEN_RECOVERY (B caused by A); that pool flip itself creates a new
          RECOVERY_SCHEDULED follow-up ServiceVisit (C caused by B). Each hop caused by the prior.
        test_recipe:
          setup:
            - "CHLORINE pool 20000 OPEN, ACTIVE one-time plan, route DISPATCHED, one SCHEDULED visit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ij Owner", email: "ij@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
          assert:
            - "ServiceVisit.${visit_id}.status == COMPLETED"
            - "Pool.${pool_id}.service_status == GREEN_RECOVERY"
            - "GET /routes/${route_id}/visits contains exactly one ServiceVisit with status == RECOVERY_SCHEDULED"

      - name: invoice_issue_balance_cascade_depth2
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.Pool.fields.balance_due_cents
          - calculations.invoice_total
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (invoice issuance, not visit completion): issue mutates
          Invoice->ISSUED (A) and computes amount_cents; that issuance mutates Pool.balance_due_cents (B
          caused by A's amount_cents). Different conserved subject (money balance) than the green cascade.
        test_recipe:
          setup:
            - "Pool with a COMPLETED visit billed 26000 (green initial) and a DRAFT invoice referencing it."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Kl Owner", email: "kl@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
            - call: "POST /invoices"
              payload: { pool_id: "${pool_id}", visit_id: "${visit_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: AccountManager
          assert:
            - "Invoice.${inv_id}.amount_cents == 26000"
            - "Pool.${pool_id}.balance_due_cents == 26000"

  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_invoice_issue
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Error-category pair {state (P5) vs business_fiscal (P14)}: issuing an already-ISSUED zero-charge
          invoice violates both; state precondition (P5) wins, returning ERR_INVALID_STATE not ERR_NOTHING_TO_BILL.
        test_recipe:
          setup:
            - "Pool with a COMPLETED prepaid recurring visit billed 0, a DRAFT invoice referencing it, already ISSUED once."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mn Owner", email: "mn@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
            - call: "POST /invoices"
              payload: { pool_id: "${pool_id}", visit_id: "${visit_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: safety_before_temporal_on_seasonal_apply
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.Pool.CLOSED_to_OPEN
        distinguishing_aspect: |
          Error-category pair {business_safety (P9) vs business_temporal (P10)}: a CLOSED pool with a
          CRITICAL open work order AND an OPEN-only-relevant temporal check — opening is gated by the safety
          check (P9 ERR_CRITICAL_REPAIR_BLOCKS_OPEN), which fires before any temporal close check.
        test_recipe:
          setup:
            - "CLOSED pool with one CRITICAL OPEN work order; a REQUESTED OPEN seasonal event."
