      - name: policy_activation_rejects_a_stale_expected_policy_version
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority 32]
          - errors[ERR_STALE_POLICY_VERSION]
          - endpoints[POST /commission-policies/{id}/activate]
          - state_machines.CommissionPolicy[DRAFT -> ACTIVE]
        distinguishing_aspect: "ERR_STALE_POLICY_VERSION is a §1.4 guard on activate that has no §1.2.1 concurrency rule behind it, so it must be enforced independently: a DRAFT policy sitting at version 1 refuses expected_policy_version 0 with 412 and stays DRAFT, and the same call with version 1 activates it to version 2. This distinguishes an implementation that only wires OCC for the three declared concurrency_rules from one that honours the whole validation table."
        test_recipe:
          setup:
            - "Clock 2026-07-05T00:00:00Z."
            - "One Network and one DRAFT APPAREL/CONTENT policy at version 1; no ACTIVE policy exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 300, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-CONTENT-2026", product_category: "APPAREL", partner_type_scope: ["CONTENT"], new_customer_rate_bps: 900, returning_customer_rate_bps: 400, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { pol_id: "$.data.id", pol_v1: "$.data.version" }
          trigger:
            - call: "POST /commission-policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v1} - 1" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /commission-policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          assert:
            - "${pol_v1} == 1 and CommissionPolicy.${pol_id}.status == \"DRAFT\" before the triggers"
            - "the activate carrying expected_policy_version ${pol_v1} - 1 returns HTTP 412 with data.error_id == \"ERR_STALE_POLICY_VERSION\""
            - "after the refusal CommissionPolicy.${pol_id}.status == \"DRAFT\", version == 1 and GET /commission-policies?status=ACTIVE returns total_count == 0"
            - "the activate carrying ${pol_v1} returns HTTP 200 with status == \"ACTIVE\", version == 2 and superseded_by_policy_id null"
            - "GET /commission-policies?status=ACTIVE returns total_count == 1 with data[0].id == ${pol_id}"

      - name: fraud_point_in_time_score_auto_suspends_at_seventy_but_not_at_sixty_five
        claim_type: rate_threshold_triggers
        grounds:
