        grounds:
          - calculations.brand_fund_balance
          - state_machines.AdFundSpendProposal.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          Conserved quantity: brand fund balance. Invariant: balance ==
          sum(COLLECT) - sum(SPEND) after every execute; a proposal executed
