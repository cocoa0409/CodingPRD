# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Tanker & Bulk Liquid Trucking — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: meter_ticket_observed_vs_net60_divergence
        grounds:
          - calculations.net60_temperature_correction
          - entities.MeterTicket.fields.observed_gallons
          - entities.MeterTicket.fields.net60_gallons
        distinguishing_aspect: |
          Measurement domain (MeterTicket): for one identical closing
          observation, the observed_basis variant yields 5000.0 gallons while
          the net60_basis variant yields 4860.0 gallons — the two declared
          variants of the same measurement diverge.
        test_recipe:
          setup:
            - "Shipment for a PETROLEUM CLASS_3 product (temp_coeff 0.0007), planned into rack window 2026-08-02 10:00-12:00Z, checked in; logical clock 2026-08-02T10:30:00Z"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 5000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator }
          trigger:
            - { call: "POST /bulk-liquid/shipments/${ship}/close-meter", payload: { meter_start_gal: 0, meter_end_gal: 5000, observed_temp_F: 100 }, as: TerminalOperator, captures: { mt_obs: $.data.observed_gallons, mt_net: $.data.net60_gallons } }
          assert:
            - "MeterTicket.observed_gallons == 5000.0 (observed_basis variant)"
            - "MeterTicket.net60_gallons == 4860.0 (net60_basis variant: 5000 * (1 - 0.0007*40))"
            - "MeterTicket.observed_gallons != MeterTicket.net60_gallons"
            - "Shipment.${ship}.provisional_total_cents == 535000 (provisional billing uses the observed basis: 500000 + 20000 + 15000)"
      - name: billing_provisional_vs_final_divergence
        grounds:
          - calculations.billing_totals
          - entities.Shipment.fields.provisional_total_cents
          - entities.Shipment.fields.final_total_cents
        distinguishing_aspect: |
          Fiscal domain (Shipment billing — distinct from the MeterTicket
          measurement domain of the sibling instance): identical route data
          produces provisional_total_cents 535000 (observed basis, no shortage
          credit) but final_total_cents 516106 (net-60 delivered basis minus
          shortage credit) — two variants, two different money amounts.
        test_recipe:
          setup:
            - "5000-gal PETROLEUM shipment closed at the meter at 100F (loaded net60 4860.0), weights verified, placards confirmed, approved spill plan, departed, delivering; clock 2026-08-02T10:30:00Z"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 5000, route_miles: 500, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/close-meter", payload: { meter_start_gal: 0, meter_end_gal: 5000, observed_temp_F: 100 }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/record-weights", payload: { steer_lb: 10200, drive_lb: 34000, trailer_lb: 14820 }, as: TerminalOperator, as_user_id: "op-scale" }
            - { call: "POST /bulk-liquid/shipments/${ship}/confirm-placards", payload: { observed_placard_code: "UN1993" }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/spill-response-plans", payload: { customer_id: "${cust}", product_id: "${prod}", equipment_checklist: ["pads", "boom"] }, as: CustomerRep, as_user_id: "${cust}", captures: { srp: $.data.id } }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/submit", as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/approve", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /bulk-liquid/shipments/${ship}/depart", as: Dispatcher }
            - { call: "POST /bulk-liquid/shipments/${ship}/start-delivery", as: Driver, as_user_id: "${drv}" }
            - { call: "GET /bulk-liquid/delivery-tickets?shipment_id=${ship}", as: Dispatcher, captures: { dtick: "$.data[0].id" } }
          trigger:
            - { call: "POST /bulk-liquid/delivery-tickets/${dtick}/close", payload: { delivered_observed_gal: 4900, delivered_temp_F: 80, retain_sample_ml: 500 }, as: Driver, as_user_id: "${drv}", captures: { dt_status: $.data.status } }
            - { call: "POST /bulk-liquid/shipments/${ship}/resolve-variance", payload: { resolution_note: "customer accepted shortage" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /bulk-liquid/shipments/${ship}/reconcile", as: FleetAdmin, captures: { final_c: $.data.final_total_cents } }
          assert:
            - "Shipment.${ship}.provisional_total_cents == 535000"
            - "DeliveryTicket.${dtick}.status == CLOSED_VARIANCE (variance 28.6 > allowed 15.0 for 500 miles)"
            - "Shipment.${ship}.final_total_cents == 516106 (= round(4831.4*100)=483140 + round(0.04*483140)=19326 + 15000 - round(13.6*100)=1360)"
            - "Shipment.${ship}.final_total_cents != Shipment.${ship}.provisional_total_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: allowed_loss_cap_binds_with_nested_min
        grounds:
          - calculations.allowed_delivery_loss
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (loaded_net60, delivered_net60,
          route_miles) with a nested min() cap — at 3000 miles the uncapped
          term 5 + 0.02*3000 = 65.0 exceeds LOSS_CAP_GAL, so the cap 50.0
          binds and a 60.0-gal shortage is rejected into VARIANCE_REVIEW.
        test_recipe:
          setup:
            - "1000-gal shipment over a 3000-mile route, delivered short at 940.0 observed @60F"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 3000, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/close-meter", payload: { meter_start_gal: 0, meter_end_gal: 1000, observed_temp_F: 60 }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/record-weights", payload: { steer_lb: 6600, drive_lb: 12500, trailer_lb: 12900 }, as: TerminalOperator, as_user_id: "op-scale" }
            - { call: "POST /bulk-liquid/shipments/${ship}/confirm-placards", payload: { observed_placard_code: "UN1993" }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/spill-response-plans", payload: { customer_id: "${cust}", product_id: "${prod}", equipment_checklist: ["pads"] }, as: CustomerRep, as_user_id: "${cust}", captures: { srp: $.data.id } }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/submit", as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/approve", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /bulk-liquid/shipments/${ship}/depart", as: Dispatcher }
            - { call: "POST /bulk-liquid/shipments/${ship}/start-delivery", as: Driver, as_user_id: "${drv}" }
            - { call: "GET /bulk-liquid/delivery-tickets?shipment_id=${ship}", as: Dispatcher, captures: { dtick: "$.data[0].id" } }
          trigger:
            - { call: "POST /bulk-liquid/delivery-tickets/${dtick}/close", payload: { delivered_observed_gal: 940, delivered_temp_F: 60, retain_sample_ml: 250 }, as: Driver, as_user_id: "${drv}", captures: { dt_status: $.data.status, dt_allowed: $.data.allowed_loss_gal, dt_var: $.data.variance_gallons } }
          assert:
            - "DeliveryTicket.${dtick}.allowed_loss_gal == 50.0 (cap binds: min(50.0, 65.0))"
            - "DeliveryTicket.${dtick}.variance_gallons == 60.0"
            - "DeliveryTicket.${dtick}.status == CLOSED_VARIANCE"
            - "Shipment.${ship}.status == VARIANCE_REVIEW"
      - name: billing_per_line_rounding_beats_sum_first
        grounds:
          - calculations.billing_totals
        distinguishing_aspect: |
          Mode (b) combinatorial (distinct from sibling's mode (a)): nested
          rounding order is pinned per-line — charge 12512.5c rounds to 12513
          and surcharge 500.5c rounds to 501 BEFORE summing, yielding 28014;
          the alternative sum-first order yields 28013. The one-cent delta is
          the observable under test.
        test_recipe:
          setup:
            - "Shipment with rate 125 c/gal, 100.1 net60 gallons loaded and delivered exactly in tolerance (variance 0), reconciled"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 100, route_miles: 10, rate_per_gal_cents: 125 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/close-meter", payload: { meter_start_gal: 0, meter_end_gal: 100.1, observed_temp_F: 60 }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/record-weights", payload: { steer_lb: 6000, drive_lb: 9000, trailer_lb: 10701 }, as: TerminalOperator, as_user_id: "op-scale" }
            - { call: "POST /bulk-liquid/shipments/${ship}/confirm-placards", payload: { observed_placard_code: "UN1993" }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/spill-response-plans", payload: { customer_id: "${cust}", product_id: "${prod}", equipment_checklist: ["pads"] }, as: CustomerRep, as_user_id: "${cust}", captures: { srp: $.data.id } }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/submit", as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/approve", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /bulk-liquid/shipments/${ship}/depart", as: Dispatcher }
            - { call: "POST /bulk-liquid/shipments/${ship}/start-delivery", as: Driver, as_user_id: "${drv}" }
            - { call: "GET /bulk-liquid/delivery-tickets?shipment_id=${ship}", as: Dispatcher, captures: { dtick: "$.data[0].id" } }
            - { call: "POST /bulk-liquid/delivery-tickets/${dtick}/close", payload: { delivered_observed_gal: 100.1, delivered_temp_F: 60, retain_sample_ml: 250 }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /bulk-liquid/shipments/${ship}/reconcile", as: FleetAdmin, captures: { final_c: $.data.final_total_cents } }
          assert:
            - "Shipment.${ship}.final_total_cents == 28014 (per-line: round(100.1*125)=12513 + round(0.04*12512.5)=501 + 15000 - 0)"
            - "Shipment.${ship}.final_total_cents != 28013 (sum-first order 12512.5+500.5+15000=28013.0 is the WRONG evaluation order)"
            - "Shipment.${ship}.status == RECONCILED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_loading_abort_cycle
        grounds:
          - state_machines.Shipment.LOADING_to_PLANNED
          - state_machines.Shipment.PLANNED_to_LOADING
          - state_machines.MeterTicket.OPEN_to_VOIDED
        distinguishing_aspect: |
          Cyclic machine on Shipment: PLANNED -> LOADING -> PLANNED (abort)
          -> LOADING again; the loop is legal, each cycle voids the open meter
          ticket and a fresh ticket is minted on re-entry.
        test_recipe:
          setup:
            - "Shipment planned into rack window 2026-08-02 10:00-12:00Z; clock inside the window"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator, as_user_id: "op-meter" }
          trigger:
            - { call: "POST /bulk-liquid/shipments/${ship}/abort-loading", as: TerminalOperator, captures: { s_mid: $.data.status } }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator, as_user_id: "op-meter", captures: { s_end: $.data.status } }
            - { call: "GET /bulk-liquid/meter-tickets?shipment_id=${ship}", as: Dispatcher, captures: { t1_status: "$.data[0].status", t2_status: "$.data[1].status", t1_id: "$.data[0].id", t2_id: "$.data[1].id" } }
          assert:
            - "after abort: Shipment.${ship}.status == PLANNED (cycle back)"
            - "after second check-in: Shipment.${ship}.status == LOADING"
            - "GET /bulk-liquid/meter-tickets?shipment_id=${ship} returns total_count == 2"
            - "first MeterTicket (created_at ASC) .status == VOIDED; second .status == OPEN; ids differ"
      - name: spill_incident_review_reopen_cycle
        grounds:
          - state_machines.SpillIncident.UNDER_REVIEW_to_REPORTED
          - state_machines.SpillIncident.CLOSED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on SpillIncident (different entity than Shipment):
          REPORTED -> UNDER_REVIEW -> REPORTED (request-info) -> UNDER_REVIEW
