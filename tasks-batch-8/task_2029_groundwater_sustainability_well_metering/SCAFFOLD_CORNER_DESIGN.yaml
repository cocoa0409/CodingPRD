      - name: self_transfer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_SELF_TRANSFER]"]
        distinguishing_aspect: "seller_account_id == buyer_account_id is rejected with ERR_SELF_TRANSFER."
        test_recipe:
          setup: ["Account ST-1 (ACTIVE) exists"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper ST-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_st: $.data.id }
          trigger:
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_st}", buyer_account_id: "${acct_st}", quantity_af: 5.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_st}"
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_SELF_TRANSFER"

      - name: appeal_at_deadline_allowed_after_deadline_rejected
        claim_type: boundary_edge
        grounds: ["validations[priority=24]", "errors[ERR_APPEAL_WINDOW_CLOSED]", state_machines.PenaltyAssessment.ASSESSED_to_APPEALED]
        distinguishing_aspect: "The 30-day appeal window is inclusive at the deadline: an assessment created at 2026-08-01T00:00:00Z (default clock) may be appealed at exactly 2026-08-31T00:00:00Z, but one second later the appeal fails with ERR_APPEAL_WINDOW_CLOSED."
        test_recipe:
          setup: ["Account AP-1 (ACTIVE) with two LATE_REPORT assessments PA-1 and PA-2, both created at the default clock instant 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper AP-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ap: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_ap}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_a1: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_ap}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_a2: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: WaterMaster
            - call: "POST /penalty-assessments/${pa_a1}/appeal"
              payload: { grounds: "at deadline" }
              as: WellOwner
              as_user_id: "${acct_ap}"
              captures: { st_a1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: WaterMaster
            - call: "POST /penalty-assessments/${pa_a2}/appeal"
              payload: { grounds: "one second late" }
              as: WellOwner
              as_user_id: "${acct_ap}"
              captures: { err_a2: $.data.error_id }
          assert:
            - "Appeal at exactly created_at + 30 days succeeds: status == APPEALED (captured ${st_a1})"
            - "Appeal one second later rejected: captured ${err_a2} == ERR_APPEAL_WINDOW_CLOSED"

      - name: decide_reduced_missing_amount_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", state_machines.PenaltyAssessment.APPEALED_to_REDUCED]
        distinguishing_aspect: "outcome REDUCED requires reduced_amount_cents in the request body; omitting it fails request validation with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Account DR-1 (ACTIVE) with one LATE_REPORT assessment, appealed (status APPEALED)"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper DR-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_dr: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_dr}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_dr: $.data.id }
            - call: "POST /penalty-assessments/${pa_dr}/appeal"
              payload: { grounds: "dispute" }
              as: WellOwner
              as_user_id: "${acct_dr}"
          trigger:
            - call: "POST /penalty-assessments/${pa_dr}/decide"
              payload: { outcome: "REDUCED" }
              as: AppealsOfficer
              as_user_id: "ao-1"
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST: reduced_amount_cents is conditionally required for outcome REDUCED"

      - name: reading_future_measured_at_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", entities.MonitoringReading.fields.measured_at]
        distinguishing_aspect: "A monitoring reading whose measured_at is after the logical clock (2026-09-01 vs default 2026-08-01) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Agency account AG with one ACTIVE MONITORING well (threshold 100.0)"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-1", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_1: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
          trigger:
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-09-01T08:00:00Z", depth_to_water_ft: 90.0, collector_name: "Field Tech" }
              as: WaterMaster
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST: future-dated measurements are not accepted"

      - name: domestic_well_report_rejected_exemption
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_INVALID_WELL_TYPE]"]
        distinguishing_aspect: "Domestic-well reporting exemption: an extraction report against an ACTIVE DOMESTIC well is rejected with ERR_INVALID_WELL_TYPE — domestic wells are outside the reporting/allocation regime entirely."
        test_recipe:
          setup: ["Account HD (ACTIVE) with one ACTIVE DOMESTIC well (exemption activation path)"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Household HD", account_type: "DOMESTIC", base_allocation_af: 2.000 }
              as: WaterMaster
              captures: { acct_hd: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_hd}", well_type: "DOMESTIC", location_description: "Home parcel" }
              as: WellOwner
              as_user_id: "${acct_hd}"
              captures: { well_hd: $.data.id }
            - call: "POST /wells/${well_hd}/activate"
              as: WaterMaster
          trigger:
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_hd}", water_year: 2026, month: 6, reported_af: 0.500 }
              as: WellOwner
              as_user_id: "${acct_hd}"
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_WELL_TYPE: only PRODUCTION wells file extraction reports"

      - name: close_year_with_unresolved_reports_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_CLOSE_YEAR_UNRESOLVED_REPORTS]"]
        distinguishing_aspect: "Year close is blocked while any SUBMITTED or DISPUTED report exists for that water year; here a single SUBMITTED June report triggers ERR_CLOSE_YEAR_UNRESOLVED_REPORTS."
        test_recipe:
          setup: ["Account CY (ACTIVE) with ACTIVE PRODUCTION well; report (2026, month 6, 5.000) still SUBMITTED"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper CY", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_cy: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_cy}", well_type: "PRODUCTION", location_description: "Parcel CY" }
              as: WellOwner
              as_user_id: "${acct_cy}"
              captures: { well_cy: $.data.id }
            - call: "POST /wells/${well_cy}/install-meter"
              payload: { meter_serial: "M-CY1" }
              as: WellOwner
              as_user_id: "${acct_cy}"
            - call: "POST /wells/${well_cy}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_cy}", water_year: 2026, month: 6, reported_af: 5.000 }
              as: WellOwner
              as_user_id: "${acct_cy}"
          trigger:
            - call: "POST /admin/close-water-year"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_CLOSE_YEAR_UNRESOLVED_REPORTS"

      - name: annual_report_unclosed_then_duplicate_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "validations[priority=23]", "errors[ERR_WATER_YEAR_NOT_CLOSED]", "errors[ERR_ANNUAL_REPORT_EXISTS]"]
        distinguishing_aspect: "Two distinct constraint errors on the same endpoint: generating a report for a year that was never closed fails with ERR_WATER_YEAR_NOT_CLOSED; after closing and generating, a second generation for the same year fails with ERR_ANNUAL_REPORT_EXISTS."
        test_recipe:
          setup: ["Empty DB; year 2026 not yet closed"]
          setup_api_calls: []
          trigger:
            - call: "POST /annual-state-reports"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { err_unclosed: $.data.error_id }
            - call: "POST /admin/close-water-year"
              payload: { water_year: 2026 }
              as: WaterMaster
            - call: "POST /annual-state-reports"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { ann_id: $.data.id, ann_status: $.data.status }
            - call: "POST /annual-state-reports"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { err_dup: $.data.error_id }
          assert:
            - "Unclosed year: captured ${err_unclosed} == ERR_WATER_YEAR_NOT_CLOSED"
            - "After close: report created (id ${ann_id}) with status == DRAFT (captured ${ann_status})"
            - "Duplicate year: captured ${err_dup} == ERR_ANNUAL_REPORT_EXISTS"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_not_found
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id, meta.api_request_timestamp, response_type (array for lists) and pagination fields on list responses; errors carry response_type error and data.error_id/data.message."
        test_recipe:
          setup: ["One account exists so the list is non-empty"]
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Env Pumper", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_env: $.data.id }
          trigger:
            - call: "GET /water-user-accounts"
              as: WaterMaster
            - call: "GET /water-user-accounts/99999999-9999-4999-8999-999999999999"
              as: WaterMaster
              captures: { err_id: $.data.error_id }
          assert:
            - "List response: meta.api_request_id present, meta.api_request_timestamp present, response_type == array, data is an array of length 1, and pagination fields limit/offset/total_count/has_more present with defaults limit 10, offset 0, total_count 1, has_more false"
            - "Error response: response_type == error and data.error_id == ERR_ACCOUNT_NOT_FOUND (captured ${err_id}) with data.message present"

      - name: settle_insufficient_water_after_interleaved_verify
        claim_type: conditional_action
        grounds: ["validations[priority=28]", "errors[ERR_SETTLE_INSUFFICIENT_WATER]", calculations.available_water_af]
        distinguishing_aspect: "The settlement re-check uses the settled variant at settle time, not proposal time: a 30.000-af order was sound when proposed (extracted 40.000, available 60.000), but a 45.000-af report verified between accept and settle drops the deliverable to 15.000, so settlement fails with ERR_SETTLE_INSUFFICIENT_WATER and the order stays ACCEPTED. (extracted 85.000 <= 100.000, so no overdraft cascade fires.)"
        test_recipe:
          setup:
            - "Seller SS (allocation 100.000) with ACTIVE PRODUCTION well; report (2026, month 6, 40.000) VERIFIED"
            - "Buyer SB (allocation 50.000); transfer qty 30.000 window [2026-08-01, 2026-10-01) ACCEPTED"
            - "Report (2026, month 7, 45.000) VERIFIED after acceptance -> extracted_af_ytd 85.000"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller SS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_ss: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer SB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_sb: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ss}", well_type: "PRODUCTION", location_description: "Parcel SS" }
              as: WellOwner
              as_user_id: "${acct_ss}"
              captures: { well_ss: $.data.id }
            - call: "POST /wells/${well_ss}/install-meter"
              payload: { meter_serial: "M-SS1" }
              as: WellOwner
              as_user_id: "${acct_ss}"
            - call: "POST /wells/${well_ss}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_ss}", water_year: 2026, month: 6, reported_af: 40.000 }
              as: WellOwner
              as_user_id: "${acct_ss}"
              captures: { rep_ss1: $.data.id }
            - call: "POST /extraction-reports/${rep_ss1}/verify"
              as: WaterMaster
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_ss}", buyer_account_id: "${acct_sb}", quantity_af: 30.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_ss}"
              captures: { tr_ss: $.data.id }
            - call: "POST /transfer-orders/${tr_ss}/accept"
              as: WellOwner
              as_user_id: "${acct_sb}"
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_ss}", water_year: 2026, month: 7, reported_af: 45.000 }
              as: WellOwner
              as_user_id: "${acct_ss}"
              captures: { rep_ss2: $.data.id }
            - call: "POST /extraction-reports/${rep_ss2}/verify"
              as: WaterMaster
          trigger:
            - call: "POST /transfer-orders/${tr_ss}/settle"
              as: WaterMaster
              captures: { err: $.data.error_id }
            - call: "GET /transfer-orders/${tr_ss}"
              as: WaterMaster
              captures: { st: $.data.status }
          assert:
            - "captured ${err} == ERR_SETTLE_INSUFFICIENT_WATER: settled-variant deliverable is 100 - 85 = 15.000 < 30.000"
            - "TransferOrder.${tr_ss}.status == ACCEPTED (captured ${st}): the failed settlement leaves the order in place"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_overdraft_amount_mismatch_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_OVERDRAFT_AMOUNT_MISMATCH]"]
        excluded_because:
          difficulty_instance: overdraft_penalty_tiered_marginal_calculation
