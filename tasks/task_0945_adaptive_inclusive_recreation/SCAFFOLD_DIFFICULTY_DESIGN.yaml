  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: goal_enters_then_leaves_mastered_as_newer_ratings_arrive
        grounds:
          - state_machines.Goal.ACTIVE_to_MASTERED
          - state_machines.Goal.MASTERED_to_ACTIVE
          - calculations.goal_mastery_status
          - entities.GoalRating.fields.rated_session_start_at
        distinguishing_aspect: |
          The Goal axis is cyclic on ONE entity: the same row travels
          ACTIVE -> MASTERED -> ACTIVE as the rolling window of the last M ratings
          slides, which no linear pipeline can express. The two edges are exercised on
          the same goal id with only three ratings.
        test_recipe:
          setup:
            - "A LOW-risk program with no consent or certification requirements and three weekly sessions."
            - "One ACTIVE INDEPENDENT participant CONFIRMED and then ATTENDED on all three sessions, each session staffed by one GROUP assignment and locked."
            - "One Goal with mastery_mode N_OF_M, mastery_window_m 2, mastery_hits_n 2, mastery_criterion_score 4."
