              captures: { van1: "$.data[0].id" }
            - call: "POST /inventory-buckets/${van1}/adjust"
              payload: { delta_pairs: 10 }
              as: PlatformAdmin
            - call: "POST /rate-cards"
              payload: { label: "2026 base", effective_from: "2026-01-01", price_trim_cents: 2200, price_reset_cents: 3800, price_new_shoes_cents: 6500, price_corrective_cents: 9800, price_glue_on_cents: 8400, pad_price_cents: 1600, trip_fee_zone_a_cents: 4500, trip_fee_zone_b_cents: 7000, trip_fee_zone_c_cents: 11000 }
              as: PlatformAdmin
              captures: { rc1: "$.data.id" }
            - call: "POST /rate-cards/${rc1}/activate"
