              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 0, cep_participating: true, cep_identified_student_pct: 70.00 }
              as: ProgramAdmin
          trigger:
            - call: "GET /erate/applicants/${app}/budget-summary"
              payload: { funding_cycle_id: "${cyc}" }
              as: Any
              captures: { share: $.data.nslp_share_pct, r1: $.data.discount_rate_c1_pct, r2: $.data.discount_rate_c2_pct }
          assert:
            - "share == 100.0 (min(70.00 * 1.6, 100.00) — cap applied, not 112.00)"
            - "r1 == 90 and r2 == 85 (top band, C2 capped below C1)"

      - name: library_budget_floor_variant
        claim_type: correct_result
