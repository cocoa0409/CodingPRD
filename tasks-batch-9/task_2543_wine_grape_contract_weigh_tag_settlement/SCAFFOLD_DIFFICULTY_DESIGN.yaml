            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
          assert:
            - "The first trigger call returns 403 with error_id == ERR_GROWER_SUSPENDED while Grower.${grower_id}.status == SUSPENDED"
            - "GrapeContract.${contract_id}.lifecycle_status is still OFFERED, contract_cap_tons == null and no PaymentInstallment rows exist for it"
            - "The third trigger call returns 409 with error_id == ERR_NO_ALLOCATIONS on the reinstated producer, a different accept precondition on the same endpoint"
            - "The fourth trigger call returns 200: GrapeContract.${contract_id}.lifecycle_status == ACTIVE, contract_cap_tons == 40.000, hard_cap_tons == 44.000"
