              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s2@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s3@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s4@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
