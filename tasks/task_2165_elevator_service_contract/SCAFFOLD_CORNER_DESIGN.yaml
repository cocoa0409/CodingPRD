          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10 runs before everything: a POST /elevator-program/contracts with no X-User-Role header returns 401 ERR_UNAUTHENTICATED even though the body is perfectly valid."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Rb Six", building_address: "7 Rb St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-r6", contractor_user_id: "sc-r6", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: Anonymous
              captures: { e_rb6: $.data.error_id }
          assert:
