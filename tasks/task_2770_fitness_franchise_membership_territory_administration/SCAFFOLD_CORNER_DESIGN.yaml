              captures: { ag1_id: $.data.id }
          assert:
            - "the stale attempt response status == 412"
            - "the stale attempt response data.error_id == ERR_STALE_CLUB_VERSION"
            - "the re-read club version ${c1_v_fresh} is greater than ${c1_v_stale}"
            - "Club.${c1_id}.last_inspection_score == 91"
            - "the fresh attempt response status == 201"
            - "MembershipAgreement.${ag1_id}.agreement_status == PENDING"
            - "MembershipAgreement.${ag1_id}.effective_monthly_dues_cents == 4500"
            - "Club.${c1_id}.version is greater than ${c1_v_fresh}"

