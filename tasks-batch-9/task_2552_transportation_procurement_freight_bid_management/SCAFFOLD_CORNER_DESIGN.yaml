# §1.9 Scaffold Corner Design — Transportation Procurement & Freight Bid Management
#
# Breadth probe over the claim-extraction-guide's nine sections, walked against
# this scaffold's §1.1–§1.7. Corners already asserted by a §1.8 difficulty
# instance appear as `excluded_because:` stubs naming that instance.
#
# Shared setup vocabulary used by the chains below:
#   ALFL  = Alpha Freight Lines, SCAC ALFL, DRY_VAN, 120 power units,
#           auto 1000000.00 / cargo 250000.00, insurance expiry 2027-06-30,
#           capability_score 88.00, composite_score 90.60 (PROVISIONAL_SCREENING)
#   L-1147 = 1147 mi, annual 550 loads, service_days 3, accessorial 137.55,
#            trailing 480, seasonality 1.20, incumbent ALFL @ 2.4000
#            -> data_quality_flags [] and baseline_cost_usd 1589692.50
#   logical clock starts at 2026-08-01T00:00:00Z unless the instance moves it.
#
# CHAIN:AWARDED_CONTRACT — the one deep chain reused verbatim by the late-stage
# instances (contracts, rate records, tenders, mini-bids, scorecards). Written out
# once here instead of being copied into a dozen recipes; an instance that names it
# starts from its end state and lists only its own extra calls. Ordered calls, all
# under /freight-procurement except the clock:
#   S1  POST /_clock/set_current_utc {to_iso8601: 2026-08-01T00:00:00Z}      as ProcurementAnalyst
#   S2  POST /carriers  {ALFL as above}                     -> ${carrier_a_id}   as ProcurementAnalyst
#   S3  POST /carriers/${carrier_a_id}/qualification-reviews
#         {required_modes:[DRY_VAN], min_auto_liability_usd:1000000.00,
#          min_cargo_usd:100000.00}                          -> ${review_a_id}   as ComplianceOfficer
#   S4  POST /qualification-reviews/${review_a_id}/insurance-verification
#         {verified_auto_liability_usd:1000000.00, verified_cargo_usd:250000.00,
#          verified_expiry_date:2027-06-30T00:00:00Z}                            as ComplianceOfficer
#   S5  POST /qualification-reviews/${review_a_id}/capability-screening {}       as ComplianceOfficer
#   S6  POST /qualification-reviews/${review_a_id}/decision {outcome: APPROVE}   as ComplianceOfficer
#         -> Carrier ALFL QUALIFIED, composite_score 90.60
#   S7  POST /bid-events {name: "Fall 2026 Truckload Bid", cost_basis: FORECAST,
#         fuel_index_per_mile:0.4800, accessorial_inflation_factor:1.15,
#         rate_floor_per_mile:1.5000, rounds_allowed:1, cost_weight:0.55,
#         service_weight:0.20, capacity_weight:0.15, diversity_weight:0.10,
#         diversity_min_pct:0.00, max_award_share_pct:100.00,
#         max_carriers_per_lane:1, contract_effective_from:2026-09-01T00:00:00Z,
#         contract_effective_to:2027-09-01T00:00:00Z}         -> ${event_id}     as ProcurementAnalyst
#   S8  POST /bid-events/${event_id}/lanes {L-1147 as above, incumbent ALFL}
#                                                             -> ${lane_a_id}    as ProcurementAnalyst
#       POST /lanes/${lane_a_id}/validate {}                                     as ProcurementAnalyst
#       POST /bid-events/${event_id}/lock-lanes {}                               as ProcurementAnalyst
#   S9  POST /bid-events/${event_id}/invitations
#         {carrier_id:${carrier_a_id}, nda_required:false}     -> ${invite_id}    as ProcurementAnalyst
#       POST /invitations/${invite_id}/response {accept:true}  as CarrierRep as_user_id ${carrier_a_id}
#   S10 POST /bid-events/${event_id}/bid-rounds
#         {incumbent_visibility: RANK_ONLY, closes_at:2026-08-20T00:00:00Z} -> ${round_id}
#                                                                                as ProcurementAnalyst
#       POST /bid-rounds/${round_id}/lane-bids {lane_id:${lane_a_id},
#         carrier_id:${carrier_a_id}, rate_per_mile:2.0000,
#         fuel_surcharge_included:true, committed_volume_loads:600,
#         transit_days_offered:3}                             -> ${bid_a_id}
#                                                              as CarrierRep as_user_id ${carrier_a_id}
#       POST /bid-rounds/${round_id}/close {}                                     as ProcurementAnalyst
#   S11 GET  /bid-events/${event_id} -> captures ${event_v} = $.data.version      as ProcurementAnalyst
#       POST /optimization-runs {bid_event_id:${event_id},
#         expected_bid_event_version:${event_v}, scenario_label: BASE,
#         max_carriers_per_lane:1, diversity_min_pct:0.00,
#         min_capacity_coverage_pct:0.00}                     -> ${run_id}        as ProcurementAnalyst
#       POST /optimization-runs/${run_id}/routing-guide {}                        as ProcurementAnalyst
#       GET  /award-allocations?bid_event_id=${event_id} -> ${alloc_id} = "$.data[0].id"
#                                                                                as ProcurementAnalyst
#       POST /award-allocations/${alloc_id}/approve {}   as CategoryManager as_user_id "cm-001"
#       POST /bid-events/${event_id}/award {}                  as CategoryManager as_user_id "cm-001"
#   S12 GET  /contracts?bid_event_id=${event_id} -> ${contract_id} = "$.data[0].id" as ContractAdmin
#       POST /contracts/${contract_id}/rate-records {lane_id:${lane_a_id},
#         carrier_id:${carrier_a_id}, award_allocation_id:${alloc_id},
#         routing_position: PRIMARY, rate_per_mile:2.0000,
#         fuel_surcharge_included:true, committed_volume_loads:550,
#         effective_from:2026-09-01T00:00:00Z,
#         effective_to:2027-09-01T00:00:00Z}                  -> ${rate_a_id}     as ContractAdmin
#       POST /contracts/${contract_id}/carrier-signature {}
#                                                        as CarrierRep as_user_id ${carrier_a_id}
#       POST /contracts/${contract_id}/shipper-signature {}
#                                                        as ContractAdmin as_user_id "ca-001"
#         -> Contract EXECUTED / FULLY_SIGNED; base 1261700.00, discount 0.015 /
#            18925.50, subtotal 1242774.50, allowance 0.020 / 24855.49,
#            total_committed_value_usd 1267629.99
#       POST /rate-records/${rate_a_id}/load {}                                   as ContractAdmin
#         -> RateRecord LOADED, Contract.rate_load_status STAGED -> LOADED
#   End state: Carrier QUALIFIED, BidEvent AWARDED, AwardAllocation EXECUTED (PRIMARY,
#   allocated_volume_loads 550 = min(remaining 550, committed 600, share_cap 550),
#   allocated_pct 100.00), Lane.unallocated_volume_loads 0, Contract FULLY_SIGNED,
#   RateRecord ${rate_a_id} LOADED, clock 2026-08-01.
#   "CHAIN:AWARDED_CONTRACT + go-live" additionally runs:
#       POST /_clock/set_current_utc {to_iso8601: 2026-09-01T00:00:00Z}           as ProcurementAnalyst
#       POST /rate-records/${rate_a_id}/go-live {}                                as ContractAdmin
#         -> RateRecord LIVE, BidEvent LIVE

scaffold_corner_design:
  - section: entities
    instances:
      - name: carrier_creation_returns_declared_fields_and_registered_initial_state
        claim_type: Creation
        grounds:
          - endpoints.POST_carriers
          - entities.Carrier
          - state_machines.Carrier.initial_state
        distinguishing_aspect: "A carrier POSTed with all eight required inputs comes back 201 with every declared field present, the counters at zero and the score fields still null — qualification has not run yet."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "data.legal_name == \"Alpha Freight Lines\", data.scac_code == \"ALFL\", data.service_modes == [\"DRY_VAN\"], data.fleet_power_units == 120"
            - "data.auto_liability_limit_usd == 1000000.00, data.cargo_limit_usd == 250000.00, data.insurance_expiry_date == \"2027-06-30T00:00:00Z\""
            - "data.status == \"REGISTERED\" (the declared initial_state) and data.status_reason is null"
            - "data.diversity_classification == \"NONE\""
            - "data.capability_score is null, data.composite_score is null, data.composite_score_variant is null, data.qualified_at is null"
            - "data.published_scorecard_count == 0, data.active_primary_lane_count == 0, data.committed_volume_loads == 0"
            - "data.version == 1 and data.id, data.created_at, data.updated_at are all present"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: carrier_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints.GET_carriers_id
          - entities.Carrier
        distinguishing_aspect: "The single read echoes exactly what creation persisted, including the null score fields — a GET never triggers the qualification calculations."
        test_recipe:
          setup:
            - "One REGISTERED carrier ALFL exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
          trigger:
            - call: "GET /freight-procurement/carriers/${carrier_a_id}"
              payload: {}
              as: CategoryManager
          assert:
            - "HTTP 200, response_type == \"object\", data.id == ${carrier_a_id}"
            - "data.scac_code == \"ALFL\" and data.status == \"REGISTERED\""
            - "data.capability_score is null — the read did not run calculations.capability_screening_score"
            - "data.version == 1, unchanged by the read"

      - name: carrier_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_carriers
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three carriers, limit 2: the first page reports total_count 3 and has_more true; the second page has_more false. total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Three REGISTERED carriers with SCACs ALFL, BFLX and CFLT, created in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Beacon Flatbed", scac_code: "BFLX", diversity_classification: "MWBE", service_modes: ["FLATBED"], fleet_power_units: 60, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 100000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Central Fleet", scac_code: "CFLT", diversity_classification: "NONE", service_modes: ["DRY_VAN", "REEFER"], fleet_power_units: 200, auto_liability_limit_usd: 2000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "GET /freight-procurement/carriers"
              payload: { limit: 2, offset: 0 }
              as: ProcurementAnalyst
            - call: "GET /freight-procurement/carriers"
              payload: { limit: 2, offset: 2 }
              as: ProcurementAnalyst
          assert:
            - "page 1 — HTTP 200, response_type == \"array\", 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2 — 1 row, total_count == 3, has_more == false, offset == 2"
            - "the two pages together return all three distinct carrier ids with no repeats"

      - name: carrier_get_with_unknown_id_returns_carrier_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_CARRIER_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "A syntactically valid but unknown path id resolves to that entity's own 404 code, not a generic not-found."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "GET /freight-procurement/carriers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { err_carrier_404: $.data.error_id }
          assert:
            - "HTTP 404, response_type == \"error\", data.error_id == \"ERR_CARRIER_NOT_FOUND\""
            - "data.message is a non-empty string and no Carrier row was created"

      - name: carrier_create_missing_scac_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations.priority_4_existence
          - errors.ERR_INVALID_REQUEST
          - entities.Carrier.fields.scac_code
        distinguishing_aspect: "scac_code has source input and no default, so its absence is a 400 body-shape failure — checked before any uniqueness or business rule."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { err_missing_scac: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /freight-procurement/carriers returns total_count == 0 — nothing was persisted"

      - name: bid_event_create_omitting_optional_knobs_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - endpoints.POST_bid_events
          - entities.BidEvent.fields.rounds_allowed
          - entities.BidEvent.fields.max_award_share_pct
          - entities.BidEvent.fields.diversity_min_pct
        distinguishing_aspect: "Every BidEvent input that carries a declared default is omitted at once; each field must come back at its scaffold default rather than null or zero."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "Defaults Event", cost_basis: "FORECAST", rate_floor_per_mile: 1.5000, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
          assert:
            - "HTTP 201 and data.fuel_index_per_mile == 0.4500"
            - "data.accessorial_inflation_factor == 1.15"
            - "data.rounds_allowed == 2"
            - "data.diversity_min_pct == 10.00"
            - "data.max_award_share_pct == 60.00"
            - "data.max_carriers_per_lane == 3"
            - "data.status == \"DRAFT\", data.current_round_no == 0, data.lane_count == 0, data.coverage_pct == 0.00, data.diversity_pct == 0.00"
            - "data.baseline_cost_usd is null and data.award_cost_usd is null — no lane and no contract exist yet"

      - name: lane_create_omitting_seasonality_and_incumbent_applies_defaults_and_advisory_flag
        claim_type: Defaults
        grounds:
          - entities.Lane.fields.seasonality_peak_index
          - entities.Lane.fields.incumbent_carrier_id
          - calculations.lane_data_quality_flags
          - calculations.lane_baseline_cost
        distinguishing_aspect: "Omitting seasonality_peak_index yields the 1.00 default; omitting both incumbent fields yields the advisory NO_INCUMBENT_BASELINE flag and a 0.00 baseline that keeps the lane out of event savings — the lane still validates."
        test_recipe:
          setup:
            - "A DRAFT bid event with no lanes; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "Lane Defaults Event", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 1, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-0600", origin_zip3: "300", dest_zip3: "372", equipment_type: "DRY_VAN", mileage: 600, annual_volume_loads: 120, service_days_required: 2, accessorial_history_usd_per_load: 90.00, trailing_12m_actual_loads: 120 }
              as: ProcurementAnalyst
              captures: { lane_b_id: $.data.id }
            - call: "POST /freight-procurement/lanes/${lane_b_id}/validate"
              payload: {}
              as: ProcurementAnalyst
          assert:
            - "create — HTTP 201, data.seasonality_peak_index == 1.00 (declared default), data.incumbent_carrier_id is null, data.incumbent_rate_per_mile is null"
            - "create — data.status == \"DRAFT\", data.awarded_coverage_pct == 0.00, data.data_quality_flags == []"
            - "validate — HTTP 200, data.status == \"VALIDATED\", data.validated_at == \"2026-08-01T00:00:00Z\""
            - "validate — data.data_quality_flags == [\"NO_INCUMBENT_BASELINE\"]: advisory only, so validation still succeeds"
            - "validate — data.baseline_cost_usd == 0.00 and data.unallocated_volume_loads == 120 (initialised to annual_volume_loads)"

      - name: lane_computed_baseline_and_flags_are_derived_at_validation_not_supplied
        claim_type: Computed Fields
        grounds:
          - calculations.lane_baseline_cost
          - calculations.lane_data_quality_flags
          - entities.Lane.fields.baseline_cost_usd
        distinguishing_aspect: "baseline_cost_usd is null while the lane is DRAFT and only appears at validation, computed from the lane's own mileage, incumbent rate and accessorial history in the pinned three-step rounding order — no client input can set it."
        test_recipe:
          setup:
            - "A DRAFT bid event; carrier ALFL registered so it can be named as incumbent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "Baseline Event", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 1, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480, seasonality_peak_index: 1.20, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { lane_a_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/lanes/${lane_a_id}/validate"
              payload: {}
              as: ProcurementAnalyst
          assert:
            - "before the trigger, GET /freight-procurement/lanes/${lane_a_id} shows status DRAFT, baseline_cost_usd null, unallocated_volume_loads null"
            - "HTTP 200, data.status == \"VALIDATED\", data.validated_at == \"2026-08-01T00:00:00Z\""
            - "data.baseline_cost_usd == 1589692.50 — round(1147 * 2.4000, 2) = 2752.80, + 137.55 = 2890.35, * 550"
            - "data.data_quality_flags == [] — mileage 1147 is inside [25, 3200], trailing volume present, variance 12.73 <= 25.00, seasonality 1.20 < 1.50, incumbent present, accessorial 137.55 <= round(2752.80 * 0.1, 2) = 275.28"
            - "data.unallocated_volume_loads == 550 and data.awarded_coverage_pct == 0.00"
            - "the baseline uses the incumbent rate as recorded — accessorial_inflation_factor 1.15 is NOT applied to it"

      - name: carrier_system_fields_are_generated_and_version_starts_at_one
        claim_type: System Fields
        grounds:
          - entities.Carrier.fields.qualified_at
          - entities.Carrier.fields.status_reason
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server, and the two system-sourced business fields (status_reason, qualified_at) stay null until a status change or a qualification decision writes them."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
          assert:
            - "HTTP 201, data.id is a server-generated identifier the request never supplied"
            - "data.created_at == \"2026-08-01T00:00:00Z\" and data.updated_at == \"2026-08-01T00:00:00Z\" — both read the logical clock, not wall time"
            - "data.version == 1"
            - "data.status_reason is null and data.qualified_at is null"

      - name: carrier_create_with_undeclared_service_mode_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Carrier.fields.service_modes
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "service_modes must be a non-empty subset of {DRY_VAN, REEFER, FLATBED}; an undeclared member is a 400 even though the field is present and the array is non-empty."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Box Truck Only", scac_code: "BTOX", diversity_classification: "NONE", service_modes: ["BOX_TRUCK"], fleet_power_units: 10, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 100000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { err_bad_mode: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "an empty service_modes array is rejected the same way, since the constraint requires a non-empty subset"
            - "no Carrier row is created"

      - name: bid_event_create_with_weights_not_summing_to_one_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.BidEvent.fields.diversity_weight
          - errors.ERR_INVALID_REQUEST
          - calculations.optimization_objective_score
        distinguishing_aspect: "Each weight is individually inside 0.00..1.00, so only the cross-field sum constraint catches this — the four objective weights must total exactly 1.00 or the objective score is meaningless."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "Bad Weights Event", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 1, cost_weight: 0.60, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { err_weights: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\" — the four weights sum to 1.05"
            - "no BidEvent row is created"
            - "a contract window with contract_effective_from >= contract_effective_to is rejected by the same rule"

      - name: lane_create_under_unknown_bid_event_returns_bid_event_not_found
        claim_type: Parent Relationships
        grounds:
          - errors.ERR_BID_EVENT_NOT_FOUND
          - validations.priority_3_existence
          - entities.Lane.parent
        distinguishing_aspect: "The parent id sits in the path, so it is checked at priority 3 — before the body shape — and reports the parent entity's own 404 code."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events/00000000-0000-0000-0000-000000000000/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480 }
              as: ProcurementAnalyst
              captures: { err_event_404: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_BID_EVENT_NOT_FOUND\""
            - "no Lane row is created"

      - name: lane_bid_referencing_a_lane_of_another_event_is_rejected
        claim_type: Parent Relationships
        grounds:
          - errors.ERR_LANE_NOT_IN_EVENT_SCOPE
          - validations.priority_15_business_constraint
        excluded_because:
          difficulty_instance: carrier_not_invited_beats_lane_out_of_event_scope
          rationale: "That §1.8 instance builds two events and submits a bid whose lane belongs to the other one, asserting the cross-event FK rejection as the lower-priority half of its pair."

      - name: tender_event_is_immutable_and_carries_no_version_or_update_path
        claim_type: Immutability
        grounds:
          - entities.TenderEvent
          - errors.ERR_DUPLICATE_LOAD_REFERENCE
          - endpoints.POST_rate_records_id_tender_events
        distinguishing_aspect: "TenderEvent is the one entity declared with common_fields false: it is an append-only fact, so it has no version field, no updated_at and no mutation endpoint, and the only protection against restating a load is the load_reference uniqueness rule."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live: record ${rate_a_id} LIVE at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "REJECTED", load_reference: "LD-2001", reject_reason: "No power available" }
              as: ProcurementAnalyst
              captures: { tender_1_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-2001" }
              as: ProcurementAnalyst
              captures: { err_duplicate_load: $.data.error_id }
          assert:
            - "the first append returned HTTP 201 with data.outcome == \"REJECTED\", data.load_reference == \"LD-2001\", data.reject_reason == \"No power available\", data.position_used == \"PRIMARY\" and data.tendered_at == \"2026-09-01T00:00:00Z\""
            - "the created row exposes id, rate_record_id, outcome, load_reference, reject_reason, position_used and tendered_at and NOTHING ELSE — no version, no created_at/updated_at pair"
            - "the §1.5 endpoint table declares no PATCH, PUT or DELETE for tender events: the only writes are the append and the list/read"
            - "the second append returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_LOAD_REFERENCE\" — a tender outcome cannot be restated by re-posting the same load_reference"
            - "RateRecord.tender_count is still 1 and rejection_pct is still 100.00 after the refused restatement (1 of 1), so the record stays LIVE: tender_count 1 < MIN_TENDER_SAMPLE 5"

  - section: state_machines
    instances:
      - name: qualification_review_reaches_screened_only_after_both_fork_prongs_complete
        claim_type: Valid Transition
        grounds:
          - state_machines.QualificationReview.SUBMITTED_to_SUBMITTED
          - state_machines.QualificationReview.SUBMITTED_to_SCREENED
          - calculations.capability_screening_score
        distinguishing_aspect: "The fork joins on results, not on call count: the first prong leaves the review in SUBMITTED with one PENDING result, and only the second prong flips it to SCREENED. Order does not matter, but a single prong is never enough."
        test_recipe:
          setup:
            - "Carrier ALFL REGISTERED with a fresh QualificationReview requiring DRY_VAN and minimums 1000000.00 / 100000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
          assert:
            - "review creation moved Carrier.status REGISTERED -> SCREENING and created the review with status SUBMITTED, insurance_result PENDING, capability_result PENDING, remediation_count 0"
            - "after the capability prong — HTTP 200, data.status == \"SUBMITTED\" (join incomplete), data.capability_result == \"PASS\", data.capability_score == 88.00, data.capability_screened_at == \"2026-08-01T00:00:00Z\", data.insurance_result still \"PENDING\""
            - "capability_score 88.00 = 0.40 * 100.00 mode coverage + 0.30 * 60.00 fleet (120 / 200) + 0.30 * 100.00 insurance component, and Carrier.capability_score == 88.00 too"
            - "after the insurance prong — data.status == \"SCREENED\", data.insurance_result == \"PASS\", data.insurance_verified_at == \"2026-08-01T00:00:00Z\""
            - "Carrier.status is still SCREENING — reaching SCREENED does not qualify the carrier, only the decision does"

      - name: qualification_decision_before_both_prongs_returns_review_not_screened
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_REVIEW_NOT_SCREENED
          - validations.priority_9_state
          - state_machines.QualificationReview.SCREENED_to_APPROVED
        distinguishing_aspect: "One prong done, one PENDING: the decision endpoint must refuse at priority 9 rather than approving a carrier whose insurance was never verified."
        test_recipe:
          setup:
            - "Carrier ALFL in SCREENING with a review whose capability prong passed and whose insurance prong is still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE", decision_note: "Looks fine" }
              as: ComplianceOfficer
              captures: { err_not_screened: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_REVIEW_NOT_SCREENED\""
            - "QualificationReview.status is still \"SUBMITTED\" and decision_outcome is null"
            - "Carrier.status is still \"SCREENING\", qualified_at null, composite_score null"

      - name: insurance_verification_below_declared_minimum_writes_fail_and_copies_nothing
        claim_type: Side Effect Execution
        grounds:
          - state_machines.QualificationReview.SUBMITTED_to_SUBMITTED
          - entities.QualificationReview.fields.insurance_result
          - entities.QualificationReview.fields.verified_auto_liability_usd
        distinguishing_aspect: "The verified figures are always recorded on the review, but the copy-forward onto the Carrier row is conditional on PASS — a FAIL must leave the carrier's own limits exactly as registered."
        test_recipe:
          setup:
            - "Carrier ALFL registered with auto 1000000.00 / cargo 250000.00; review minimums 1000000.00 / 100000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 500000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
          assert:
            - "HTTP 200, data.insurance_result == \"FAIL\" — 500000.00 < min_auto_liability_usd 1000000.00, even though cargo and expiry both pass"
            - "data.verified_auto_liability_usd == 500000.00, data.verified_cargo_usd == 250000.00, data.insurance_verified_at == \"2026-08-01T00:00:00Z\""
            - "data.status == \"SUBMITTED\" — the capability prong is still PENDING so the join has not closed"
            - "GET /freight-procurement/carriers/${carrier_a_id} still shows auto_liability_limit_usd == 1000000.00 and cargo_limit_usd == 250000.00: the copy-forward runs on PASS only"

      - name: remediation_decision_reopens_the_fork_and_clears_both_prong_results
        claim_type: Valid Transition
        grounds:
          - state_machines.QualificationReview.SCREENED_to_REMEDIATION
          - state_machines.QualificationReview.REMEDIATION_to_SUBMITTED
          - entities.QualificationReview.fields.remediation_count
        distinguishing_aspect: "REMEDIATE is the cyclic edge of this machine: it increments remediation_count and resets BOTH results to PENDING, so the review must be re-screened on both prongs before another decision is possible — and the carrier stays in SCREENING throughout."
        test_recipe:
          setup:
            - "Carrier ALFL in SCREENING with a SCREENED review (both prongs PASS)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "REMEDIATE", decision_note: "Provide a current certificate of insurance" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
          assert:
            - "after REMEDIATE — HTTP 200, data.status == \"REMEDIATION\", data.remediation_count == 1, data.insurance_result == \"PENDING\", data.capability_result == \"PENDING\", data.decision_outcome == \"REMEDIATE\""
            - "Carrier.status is still \"SCREENING\" — the SCREENING -> SCREENING self-loop leaves the carrier where it was"
            - "after the re-verification — data.status == \"SUBMITTED\" and data.insurance_result == \"PASS\", with capability_result back at \"PENDING\": the fork genuinely re-opened"
            - "data.remediation_count stays 1 — re-screening does not increment it, only a REMEDIATE decision does"

      - name: lock_lanes_with_a_draft_lane_returns_lane_not_validated
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_LANE_NOT_VALIDATED
          - state_machines.BidEvent.DRAFT_to_LANES_LOCKED
          - validations.priority_9_state
        distinguishing_aspect: "The lock is all-or-nothing across the event's lane set: one un-validated lane blocks the whole event, and the already-validated lane must not be locked as a side effect of the failed call."
        test_recipe:
