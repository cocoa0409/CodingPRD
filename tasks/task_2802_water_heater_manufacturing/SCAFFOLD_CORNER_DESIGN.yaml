            - "ProductModel.${m1_id}.certification_status is TEST_PENDING after the reject and uef_rated is still null"
            - "approving the REJECTED certification returns 409 with error_id == 'ERR_INVALID_CERTIFICATION_STATE'"
            - "the resubmission returns 200: status == SUBMITTED, submitted_by_user_id == 'eng-2', reason_code == null and certified_uef == 0.59, certified_fhr == 63, certified_recovery == 41.3 with uef_test_count == 3"
            - "the approve by eng-2 returns 403 with error_id == 'ERR_SOD_APPROVER_IS_SUBMITTER' (the target moved from eng-1 to eng-2)"
            - "the approve by appr-1 returns 200 even though appr-1 rejected the earlier round: status == APPROVED with approved_by_user_id == 'appr-1'"
