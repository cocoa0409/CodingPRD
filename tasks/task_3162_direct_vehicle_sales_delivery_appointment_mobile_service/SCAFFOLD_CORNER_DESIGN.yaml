            - call: "POST /v1/delivery-appointments/${apt_issue_id}/complete"
              payload: { acceptance_inspection_result: "ISSUES_DOCUMENTED", documented_issues: [{ issue_code: "PAINT_CHIP", observed_mileage: 4, blocked_handover: true }], expected_order_version: "${ord_v}" }
              as: DeliveryAdvisor
              captures: { veh_issue_id: $.data.id }
            - call: "GET /v1/issue-notes"
              payload: { order_id: "${ord_id}" }
              as: PlatformAdmin
              captures: { note_id: "$.data[0].id" }
          trigger:
            - call: "POST /v1/issue-notes/${note_id}/waive"
              payload: { waiver_reason: "" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the empty-reason call returns 400 with error_id == ERR_INVALID_REQUEST"
            - "VehicleIssueNote.${note_id}.status == OPEN and blocked_handover == true"
            - "GET /v1/vehicles/${veh_issue_id}/issue-notes returns exactly 1 row"
            - "re-issuing the call with waiver_reason \"buyer accepted documented chip\" returns 200 and VehicleIssueNote.${note_id}.status == WAIVED"

      - name: parts_shipment_confirmation_requires_the_parts_reserved_step
        claim_type: Action endpoint
        grounds:
