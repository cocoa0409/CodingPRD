scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: net_income_standard_vs_elderly_disabled
        grounds:
          - calculations.calc_net_monthly_income
          - calculations.calc_net_monthly_income.variants.standard_household
          - calculations.calc_net_monthly_income.variants.elderly_or_disabled_household
          - entities.Household.fields.has_elderly_or_disabled
          - entities.Member.fields.is_disabled
        distinguishing_aspect: |
          Operates on Household income computation. The same income/expense inputs produce
          a strictly lower net_monthly_income_cents when has_elderly_or_disabled is true
          (excess-shelter deduction is uncapped) versus when it is false (capped at 67200
          cents). Different entity domain from instance #2 below (purchase eligibility on
          Transaction line-items).
        test_recipe:
          setup:
            - "Create Household H1 with state_code=CA, address_zip=94110, dependent_care_expense_cents=0, shelter_expense_cents=250000."
            - "Add Members A,B to H1 with date_of_birth implying age 35, is_disabled=false, is_pregnant=false, earned_income_cents=150000 each, unearned_income_cents=0."
            - "Create Household H2 (mirror of H1) but add Member C with date_of_birth implying age 65 (or is_disabled=true)."
            - "Add Members A',B' to H2 with the same income shape so household_size=3 and earned totals match H1."
          trigger:
            - "GET /households/{H1.id}"
            - "GET /households/{H2.id}"
          assert:
            - "H1.net_monthly_income_cents == 153500"
            - "H2.net_monthly_income_cents == 81050"
            - "H1.has_elderly_or_disabled == false"
            - "H2.has_elderly_or_disabled == true"
            - "H1.net_monthly_income_cents != H2.net_monthly_income_cents"

      - name: eligible_amount_standard_vs_restaurant_meals
        grounds:
          - calculations.calc_eligible_amount
          - calculations.calc_eligible_amount.variants.standard_household_purchase
          - calculations.calc_eligible_amount.variants.restaurant_meals_program
          - entities.Merchant.fields.hot_food_pilot
          - entities.Transaction.fields.line_items
        distinguishing_aspect: |
          Operates on Transaction-level cart eligibility (different entity domain than instance #1).
          The same cart of line_items produces a strictly higher eligible_amount_cents when
          (Merchant.hot_food_pilot=true AND Household.has_elderly_or_disabled=true) — HOT_PREPARED
          and COLD_PREPARED items count as eligible — versus the standard path where they are
          excluded.
        test_recipe:
          setup:
            - "Create elderly Household HE (size 1 with is_disabled=true Member), approve application, fund card."
            - "Create non-elderly Household HN (size 1, age 30), approve application, fund card."
            - "Create Merchant M_PILOT with hot_food_pilot=true, snap_authorization_status=AUTHORIZED."
            - "Create Merchant M_STD   with hot_food_pilot=false, snap_authorization_status=AUTHORIZED."
            - "Define cart C = [STAPLE @ 500 x3, NON_FOOD @ 2000 x1, HOT_PREPARED @ 1200 x2]; requested = 1500 + 2000 + 2400 = 5900."
          trigger:
            - "POST /transactions {card=HE.card, merchant=M_PILOT, requested_amount_cents=5900, line_items=C}"
            - "POST /transactions {card=HN.card, merchant=M_PILOT, requested_amount_cents=5900, line_items=C}"
            - "POST /transactions {card=HE.card, merchant=M_STD,   requested_amount_cents=5900, line_items=C}"
          assert:
            - "First transaction (HE+M_PILOT) has status=APPROVED and eligible_amount_cents == 3900 and ineligible_amount_cents == 2000"
            - "Second transaction (HN+M_PILOT) has eligible_amount_cents == 1500 (HOT_PREPARED excluded because household not elderly/disabled)"
            - "Third transaction (HE+M_STD) has eligible_amount_cents == 1500 (HOT_PREPARED excluded because merchant not in pilot)"
            - "3900 != 1500 — the elderly-disabled-on-pilot variant produces a strictly higher eligible amount for identical inputs"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: net_income_per_step_rounding_pinned
        grounds:
          - calculations.calc_net_monthly_income
          - calculations.calc_net_monthly_income.precision
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The formula PINS per-step
          round_half_up: earned_income_deduction is rounded BEFORE adjustment, and
          half_adjusted is rounded BEFORE the excess_shelter subtraction. Different ordering
          (e.g., compute adjusted_income exactly without intermediate rounding, then round
          once) produces a different net value when earned_income * 0.20 ends in .5 cents.
        test_recipe:
          setup:
            - "Create Household H with size=3, shelter_expense_cents=200000, dependent_care=0."
            - "Add Members with earned_income totaling 199995 cents (e.g., 99998+99997 so earned_ded = round(199995*0.20)=round(39999)=39999)."
            - "Use unearned=0; non-elderly path."
          trigger:
            - "GET /households/{H.id}"
          assert:
            - "earned_income_deduction step = round_half_up(199995 * 0.20) = 39999"
            - "adjusted_income = max(0, 199995 - 19300 - 39999 - 0) = 140696"
            - "half_adjusted = round_half_up(140696 / 2) = 70348"
            - "excess_shelter_raw = 200000 - 70348 = 129652; capped at 67200"
            - "H.net_monthly_income_cents == 73496"

      - name: fraud_score_sum_then_round_pinned
        grounds:
          - calculations.calc_fraud_score
          - calculations.calc_fraud_score.precision
          - entities.FraudCase.fields.suspicious_score
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, in the OPPOSITE direction from
          calc_net_monthly_income. calc_fraud_score PINS sum-then-round: the three weighted
          signals are summed at full precision and rounded once at the end. Rounding each
          signal first to two decimals then summing yields a different score in cases where
          the cents-of-percent accumulate (e.g., three .005 ties). Because calc_net pins
          round-then-sum while calc_fraud pins sum-then-round, the scaffold exercises BOTH
          orderings — confirming this is a distinct mode-(b) instance from #1.
        test_recipe:
          setup:
            - "Advance clock to a fixed t0."
            - "Create Household H (size=1, approved, allotment_cents=9500 — minimum benefit floor case)."
            - "Post BenefitLedger REGULAR_ALLOTMENT 9500 for current month."
            - "Post 3 APPROVED Transactions in window: T1 eligible_amount=2666 (one cent off even), T2=2667, T3=2667 from in-state and out-of-state merchants alternating so a_signal raw value has non-clean digits."
            - "Open FraudCase F on H."
          trigger:
            - "GET /fraud-cases/{F.id}"
          assert:
            - "F.suspicious_score is the result of round_half_up(0.50*a + 0.30*b + 0.20*c, 2) with a,b,c computed at full precision then a SINGLE rounding step at the end"
            - "F.suspicious_score is reported to exactly two decimal places"
            - "F.suspicious_score != the value that would result from per-signal pre-rounding when a,b,c each carry sub-cent fractions"

      - name: monthly_allotment_minimum_benefit_floor
        grounds:
          - calculations.calc_monthly_allotment
          - calculations.calc_monthly_allotment.constants
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (household_size, net_monthly_income_cents,
          MAX_ALLOTMENT_TABLE, MINIMUM_BENEFIT_CENTS) interacting non-linearly: tiered table
          lookup, 30% expected-contribution subtraction, then a conditional floor that
          applies ONLY when household_size <= 2. The conditional branch on entity state
          (household_size bracket) creates a discontinuity at size==3.
        test_recipe:
          setup:
            - "Create Household H1 size=1, net_monthly_income_cents=124800 (right at NET limit)."
            - "Create Household H3 size=3, net_monthly_income_cents=211800 (right at NET limit)."
            - "Approve applications for both."
          trigger:
            - "GET /households/{H1.id}"
            - "GET /households/{H3.id}"
          assert:
            - "H1.monthly_allotment_cents == 2300  # expected_contribution=37440; raw=max(0,29100-37440)=0; floor applies for size<=2"
            - "H3.monthly_allotment_cents == 13060 # expected_contribution=round(211800*0.30)=63540; raw=max(0,76600-63540)=13060; no floor"
            - "The floor branch fires for H1 (size<=2) but not for H3, even though both are at the NET income ceiling"

  # ===========================================================================
  # Rule 3 — Non-linear state machine shape on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_branching_with_revert
        grounds:
          - state_machines.Application
          - state_machines.Application.SUBMITTED_to_DRAFT
          - state_machines.Application.INTERVIEW_DONE_to_APPROVED
          - state_machines.Application.INTERVIEW_DONE_to_DENIED
        distinguishing_aspect: |
          Branching with revert on Application: SUBMITTED can revert back to DRAFT
          (return-for-correction), and from INTERVIEW_DONE the case forks to APPROVED or
          DENIED with disjoint side-effect sets (APPROVED triggers EbtCard issuance +
          BenefitLedger seed; DENIED does not).
        test_recipe:
          setup:
            - "Create Household H with valid members; create Application A in DRAFT."
            - "POST submit so A=SUBMITTED."
          trigger:
            - "POST /households/{H.id}/applications/{A.id}/return-for-correction"
            - "POST /households/{H.id}/applications/{A.id}/submit (re-submit)"
            - "POST /households/{H.id}/applications/{A.id}/schedule-interview"
            - "POST /households/{H.id}/applications/{A.id}/complete-interview"
            - "POST /households/{H.id}/applications/{A.id}/approve"
          assert:
            - "After return-for-correction A.state == DRAFT and A.submitted_at == null"
            - "After re-submit + interview cycle, A.state == INTERVIEW_DONE"
            - "After approve, A.state == APPROVED and an EbtCard ISSUED side effect fired"
            - "Side-effect set on APPROVED ≠ side-effect set on DENIED (no EbtCard auto-issuance on DENIED)"

      - name: fraud_case_cyclic_via_appeal
        grounds:
          - state_machines.FraudCase
          - state_machines.FraudCase.APPEAL_PENDING_to_OPEN
          - state_machines.FraudCase.SUBSTANTIATED_to_APPEAL_PENDING
          - state_machines.FraudCase.APPEAL_PENDING_to_UNFOUNDED
        distinguishing_aspect: |
          Cyclic state machine on FraudCase (a different entity than Application):
          SUBSTANTIATED -> APPEAL_PENDING -> OPEN -> UNDER_REVIEW -> SUBSTANTIATED again is
          a closed cycle of length 4. This is a structurally different non-linear shape
          (cycle vs branching-with-revert) on a different entity.
        test_recipe:
          setup:
            - "Create Household H, approve application, fund card."
            - "POST /fraud-cases {household_id=H.id, trigger_reason=TRAFFICKING_PATTERN} -> F.state=OPEN."
            - "POST /fraud-cases/{F.id}/assign {investigator_user_id=inv1} -> UNDER_REVIEW."
            - "Set suspicious_score >= 0.70 via setup data; POST .../substantiate -> SUBSTANTIATED."
          trigger:
            - "POST /fraud-cases/{F.id}/appeal           # SUBSTANTIATED -> APPEAL_PENDING"
            - "POST /fraud-cases/{F.id}/reopen-investigation  # APPEAL_PENDING -> OPEN (cycle hit)"
            - "POST /fraud-cases/{F.id}/assign {investigator_user_id=inv2}  # OPEN -> UNDER_REVIEW"
            - "POST /fraud-cases/{F.id}/substantiate     # back to SUBSTANTIATED (cycle closed)"
          assert:
            - "F.state passes through {SUBSTANTIATED, APPEAL_PENDING, OPEN, UNDER_REVIEW, SUBSTANTIATED} in that order"
            - "Final F.state == SUBSTANTIATED"
            - "Cycle length == 4 transitions"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers (depths ≥3 and ≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: application_approve_to_card_to_ledger_to_balance
        grounds:
          - state_machines.Application.INTERVIEW_DONE_to_APPROVED
          - state_machines.EbtCard
          - entities.BenefitLedger
          - entities.EbtCard.fields.balance_cents
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by Application APPROVE:
          (1) Application INTERVIEW_DONE->APPROVED causes
          (2) EbtCard auto-issued in ISSUED state, which causes
          (3) BenefitLedger REGULAR_ALLOTMENT entry posted, which causes
          (4) EbtCard.balance_cents recomputed to equal monthly_allotment_cents.
          Each hop is caused by the previous hop, NOT by the original approve action — the
          BenefitLedger entry is only posted because an EbtCard was just created.
        test_recipe:
          setup:
            - "Create Household H, size=3, set incomes so net_monthly_income_cents == 153500."
            - "Create Application A; submit; schedule-interview; complete-interview."
            - "Confirm no EbtCard for H exists yet, no BenefitLedger entries for H."
          trigger:
            - "POST /households/{H.id}/applications/{A.id}/approve"
          assert:
            - "After approve, exactly one EbtCard EXISTS for H with status=ISSUED"
            - "After approve, exactly one BenefitLedger entry exists for H with entry_type=REGULAR_ALLOTMENT and amount_cents == 30550"
            - "EbtCard.balance_cents == 30550 (matches monthly_allotment_cents from calc_monthly_allotment)"
            - "Hop sequence: Application.state==APPROVED -> EbtCard created -> BenefitLedger entry -> balance updated"

      - name: fraud_substantiate_suspends_card_blocks_purchase
        grounds:
          - state_machines.FraudCase.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.EbtCard.ACTIVE_to_SUSPENDED
          - validations[priority=6]
          - entities.Transaction.fields.decline_reason
        distinguishing_aspect: |
          Depth-2 transitive cascade triggered by Fraud SUBSTANTIATE (different originator
          than instance #1, which started from Application APPROVE):
          (1) FraudCase UNDER_REVIEW->SUBSTANTIATED causes
          (2) all ACTIVE EbtCards for the household to SUSPENDED, which causes
          (3) any subsequent POST /transactions to fail with ERR_CARD_NOT_ACTIVE.
          The third hop (transaction decline) is caused only because of step (2)'s state
          change, not directly by the substantiate action.
        test_recipe:
          setup:
            - "Create Household H, approve application, activate card so card.status=ACTIVE."
            - "Open FraudCase F on H; assign investigator; ensure suspicious_score>=0.70 via setup."
          trigger:
            - "POST /fraud-cases/{F.id}/substantiate"
            - "POST /transactions {card_id=H.card.id, merchant_id=M.id, requested_amount_cents=500, line_items=[{STAPLE,500,1}]}"
          assert:
            - "F.state == SUBSTANTIATED"
            - "H.card.status == SUSPENDED (cascade hop 2)"
            - "Transaction status == DECLINED with decline_reason == CARD_NOT_ACTIVE (cascade hop 3)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_transaction
        grounds:
          - validations[priority=6]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): when a transaction is submitted against a card
          that is SUSPENDED AND the eligible_amount exceeds the (frozen) balance,
          ERR_CARD_NOT_ACTIVE (priority 6, state) wins over ERR_INSUFFICIENT_FUNDS
          (priority 12, business_fiscal).
        test_recipe:
          setup:
            - "Create Household H with approved application and card.balance_cents = 100 (very low)."
            - "Suspend the card (status=SUSPENDED)."
            - "Authorize merchant M."
          trigger:
            - "POST /transactions {card_id=H.card.id, merchant_id=M.id, requested_amount_cents=5000, line_items=[{STAPLE, 5000, 1}]}"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_CARD_NOT_ACTIVE  # NOT ERR_INSUFFICIENT_FUNDS, even though balance < requested"

      - name: safety_fraud_hold_beats_state_on_resume
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair (business_safety vs state): when /cards/{cardId}/resume is called on a
          SUSPENDED card belonging to a household with a SUBSTANTIATED FraudCase,
          ERR_FRAUD_HOLD (priority 7, business_safety) wins. Different error-category pair
          from instance #1 (state-vs-fiscal).
        test_recipe:
          setup:
            - "Create Household H, approve application, activate card."
            - "Suspend card (status=SUSPENDED)."
            - "Open FraudCase F on H; assign; substantiate (F.state=SUBSTANTIATED)."
          trigger:
            - "POST /households/{H.id}/cards/{H.card.id}/resume"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_FRAUD_HOLD  # NOT ERR_INVALID_STATE — fraud hold checked at higher business priority than the resume's own state precondition"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: net_income_limit_inclusive_boundary
        grounds:
          - validations[priority=11]
          - calculations.calc_monthly_allotment.constants
          - endpoints["POST /households/{id}/applications/{appId}/approve"]
        distinguishing_aspect: |
          Numeric boundary on the net-income limit at /approve: <= passes, > fails. For
          household_size=3, the limit is 211800 cents. A household with net exactly equal
          to 211800 APPROVES; a household with net == 211801 fails with
          ERR_NET_INCOME_OVER_LIMIT.
        test_recipe:
          setup:
            - "Create Household H_at with size=3, members configured so net_monthly_income_cents == 211800 (e.g., earned/unearned/shelter tuned)."
            - "Create Household H_over with size=3, configured so net_monthly_income_cents == 211801."
            - "Take both through DRAFT->SUBMITTED->PENDING_INTERVIEW->INTERVIEW_DONE."
          trigger:
            - "POST /households/{H_at.id}/applications/{A_at.id}/approve"
            - "POST /households/{H_over.id}/applications/{A_over.id}/approve"
          assert:
            - "H_at approve returns 200 and A_at.state == APPROVED"
            - "H_over approve returns 422 with error_id == ERR_NET_INCOME_OVER_LIMIT"

      - name: zero_eligible_amount_beats_zero_balance
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - calculations.calc_eligible_amount
          - endpoints["POST /transactions"]
        distinguishing_aspect: |
          Empty/zero edge on a DIFFERENT metric (cart eligibility, not income) and via a
          DIFFERENT endpoint (POST /transactions, not /approve). When the cart contains
          ONLY ineligible categories so eligible_amount_cents == 0, the transaction is
          DECLINED with ERR_ALL_ITEMS_INELIGIBLE — NOT ERR_INSUFFICIENT_FUNDS — even if the
          balance is also zero. Priority 13 wins over 12 at the zero boundary.
        test_recipe:
          setup:
            - "Create Household H, approve application; balance_cents == monthly_allotment_cents."
            - "Authorize merchant M (not in pilot)."
          trigger:
            - "POST /transactions {card=H.card, merchant=M, requested_amount_cents=2000, line_items=[{ALCOHOL, 1000, 1}, {TOBACCO, 1000, 1}]}"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_ALL_ITEMS_INELIGIBLE  # NOT ERR_INSUFFICIENT_FUNDS even when both checks would fail in isolation"
            - "No BenefitLedger PURCHASE entry was created"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ebtcard_activate_requires_household_certified
        grounds:
          - state_machines.EbtCard.ISSUED_to_ACTIVE
          - entities.Household.fields.certification_status
        distinguishing_aspect: |
          Entity pair (EbtCard, Household): EbtCard ISSUED->ACTIVE is blocked unless
          Household.certification_status == APPROVED. The transition's validity depends on
          a field of a different aggregate.
        test_recipe:
          setup:
            - "Create Household H. Do NOT submit/approve an application."
            - "Caseworker manually creates an EbtCard for H (status=ISSUED)."
          trigger:
            - "POST /households/{H.id}/cards/{H.card.id}/activate"
          assert:
            - "Response status == 409 and error_id == ERR_INVALID_STATE"
            - "After approving Application, the same activate call returns 200 and card.status == ACTIVE"

      - name: card_resume_blocked_by_substantiated_fraudcase
        grounds:
          - state_machines.EbtCard.SUSPENDED_to_ACTIVE
          - state_machines.FraudCase
          - entities.FraudCase.fields.state
        distinguishing_aspect: |
          Entity pair (EbtCard, FraudCase) — DIFFERENT from instance #1's (EbtCard,
          Household) pair. EbtCard SUSPENDED->ACTIVE requires no FraudCase in
          SUBSTANTIATED state. The transition's validity depends on a sibling cross-aggregate
          entity's state.
        test_recipe:
          setup:
            - "Create Household H, approve app, activate card, suspend card."
            - "Open and substantiate FraudCase F on H."
          trigger:
            - "POST /households/{H.id}/cards/{H.card.id}/resume"
          assert:
            - "Response status == 422 and error_id == ERR_FRAUD_HOLD"
            - "After /fraud-cases/{F.id}/uphold-appeal (F.state -> UNFOUNDED), the same resume call returns 200"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: abawd_waiver_half_open_interval_overlap
        grounds:
          - validations[priority=19]
          - entities.AbawdWaiver.fields.effective_from
          - entities.AbawdWaiver.fields.effective_to
          - endpoints["POST /households/{id}/members/{memberId}/abawd-waivers"]
        distinguishing_aspect: |
          Continuous-time interval semantics with HALF-OPEN convention: adjacency
          (new.effective_from == existing.effective_to) is ALLOWED; any open-interval
          overlap on a same Member resource is REJECTED with ERR_WAIVER_OVERLAP.
          Different interval semantics than instance #2 (discrete-key conflict on
          (state_code, benefit_month) tuple), and different resource entity (Member vs
          EmergencyAllotment scope).
        test_recipe:
          setup:
            - "Create Household H, add Member M (age 30, not disabled, not pregnant)."
            - "Create AbawdWaiver W1 on M with effective_from=2026-01-01T00:00:00Z, effective_to=2026-04-01T00:00:00Z, kind=WORK_TRAINING_ENROLLED."
            - "Approve W1."
          trigger:
            - "POST /households/{H.id}/members/{M.id}/abawd-waivers {effective_from=2026-04-01T00:00:00Z, effective_to=2026-07-01T00:00:00Z, kind=WORK_TRAINING_ENROLLED}  # adjacency"
            - "POST /households/{H.id}/members/{M.id}/abawd-waivers {effective_from=2026-03-15T00:00:00Z, effective_to=2026-06-15T00:00:00Z, kind=WORK_TRAINING_ENROLLED}  # overlap"
          assert:
            - "First adjacent request returns 201 and W2 created in REQUESTED state"
            - "Second overlapping request returns 422 with error_id == ERR_WAIVER_OVERLAP"

      - name: emergency_allotment_state_month_uniqueness
        grounds:
          - validations[priority=20]
          - entities.EmergencyAllotment.fields.state_code
          - entities.EmergencyAllotment.fields.benefit_month
          - endpoints["POST /emergency-allotments"]
        distinguishing_aspect: |
          Discrete (state_code, benefit_month) keyed uniqueness — fundamentally different
          interval semantics from instance #1's continuous half-open time intervals. There
          is no concept of adjacency here: any second creation with the same tuple where
          existing is in {DRAFT, DECLARED, DISBURSED} is rejected. Resource entity differs
          from instance #1 (EmergencyAllotment vs Member).
        test_recipe:
          setup:
            - "Create EmergencyAllotment EA1 with state_code=CA, benefit_month=2026-05, max_allotment_table_version=1. State=DRAFT."
          trigger:
            - "POST /emergency-allotments {state_code=CA, benefit_month=2026-05, max_allotment_table_version=2}"
            - "POST /emergency-allotments {state_code=CA, benefit_month=2026-06, max_allotment_table_version=1}"
            - "POST /emergency-allotments {state_code=TX, benefit_month=2026-05, max_allotment_table_version=1}"
          assert:
            - "First request returns 409 with error_id == ERR_EA_DUPLICATE"
            - "Second request (different month, same state) returns 201"
            - "Third request (different state, same month) returns 201"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: purchase_then_reverse_leaves_card_balance_unchanged
        grounds:
          - state_machines.Transaction.APPROVED_to_REVERSED
          - state_machines.Transaction.PENDING_to_APPROVED
          - entities.BenefitLedger.fields.entry_type
          - entities.EbtCard.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: EbtCard.balance_cents. After a forward POST /transactions
          (eligible_amount X) followed by POST /transactions/{txId}/reverse within the
          24-hour window, the card balance MUST exactly equal its pre-purchase value. The
          PURCHASE -X and REFUND +X BenefitLedger entries are a forward/compensating pair.
          Pinned formula: card.balance_cents == sum(BenefitLedger.amount_cents for
          entries.card_id == card.id), unchanged across the pair.
        test_recipe:
          setup:
            - "Create Household H, approve application, activate card. balance_before = card.balance_cents."
            - "Authorize merchant M."
          trigger:
            - "POST /transactions {card=H.card, merchant=M, requested_amount_cents=1500, line_items=[{STAPLE,500,3}]} -> T (APPROVED)"
            - "Within 24h: POST /transactions/{T.id}/reverse"
          assert:
            - "After POST /transactions: card.balance_cents == balance_before - 1500"
            - "After reverse: card.balance_cents == balance_before  # EXACT equality, no drift"
            - "BenefitLedger contains exactly two entries linked to T: one PURCHASE amount=-1500 and one REFUND amount=+1500"
            - "Sum of all BenefitLedger.amount_cents for card == balance_before"

      - name: card_replace_preserves_household_total_benefits
        grounds:
          - state_machines.EbtCard.ACTIVE_to_REPLACED
          - entities.BenefitLedger.fields.entry_type
          - entities.EbtCard.fields.replaced_by_card_id
        distinguishing_aspect: |
          Conserved quantity is DIFFERENT from instance #1: not a single card's balance
          but the household-level total spendable benefit aggregated across all of the
          household's cards. POST /cards/{cardId}/replace creates a new card and emits
          an ADJUSTMENT pair (-X on old, +X on new). Pinned formula:
          sum(card.balance_cents for card in EbtCard where household_id == H.id) MUST be
          identical before and after the replace. Drift would be a Stage 9 violation.
        test_recipe:
          setup:
            - "Create Household H, approve application, activate card C1."
            - "Post some purchases so C1.balance_cents == 25000 (less than initial allotment)."
            - "Record household_total_before = sum of balance_cents over all cards of H (== 25000)."
          trigger:
            - "POST /households/{H.id}/cards/{C1.id}/replace -> C2 created"
          assert:
            - "C1.status == REPLACED, C1.replaced_by_card_id == C2.id"
            - "C2.status == ISSUED, C2.balance_cents == 25000"
            - "C1.balance_cents == 0"
            - "Sum over H's cards of balance_cents == 25000 == household_total_before  # invariant holds"
            - "BenefitLedger contains exactly one ADJUSTMENT entry of -25000 on C1 and one ADJUSTMENT entry of +25000 on C2"
