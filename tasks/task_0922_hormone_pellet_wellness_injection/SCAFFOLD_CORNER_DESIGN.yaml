              captures: { c40a: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Forty B", date_of_birth: "1980-01-02", email: "c40b@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c40b: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${c40a}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1000, symptom_score: 55, indication: "Hypogonadism" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs40: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["TESTOSTERONE"], scope_injection_types: ["B12"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so40: $.data.id }
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${c40a}", provider_id: "${dr1}", consult_id: "${cs40}", standing_order_id: "${so40}", procedure_type: "INITIAL", room_code: "RM62", scheduled_start: "2026-06-22T09:00:00Z" }
              as: FrontDesk
              captures: { pr40: $.data.id }
          trigger:
            - call: "GET /clinic/procedures/${pr40}"
              payload: {}
              as: Patient
              as_user_id: "${c40b}"
              captures: { own_err: $.data.error_id }
          assert:
            - "${own_err} == ERR_FORBIDDEN_OWNERSHIP with HTTP 403"
            - "Procedure.${pr40}.status == SCHEDULED"

      - name: physician_cannot_revoke_another_physicians_standing_order
        claim_type: "Ownership denial"
        grounds: ["validations[priority=8]", state_machines.StandingOrder.ACTIVE_to_REVOKED, "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Revoke and reinstate require the acting X-User-ID to equal StandingOrder.physician_id, so a second physician holding the same role is still refused at rung 8 and the order stays ACTIVE."
        test_recipe:
          setup: ["Two physicians; the first holds an ACTIVE standing order."]
          setup_api_calls:
