            - "${sp_status_after_reject} == OPEN with ${sp_ver_after_reject} == ${sp_ver_before_lock} and ${sp_eligible_after_reject} == 0"
            - "${rec_variant_after_reject} == PROVISIONAL and ${rec_retention_after_reject} == 0.00 — the rejected lock ran none of its recomputes"

      - name: publishing_a_report_citing_a_non_final_grade_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=24]
          - errors[ERR_CITED_GRADE_NOT_FINAL]
          - state_machines.PoolReport.DRAFT_to_PUBLISHED
          - entities.PlayGrade.fields.grade_status
        distinguishing_aspect: "A pool report may be drafted against a POSTED grade but not published: publication is gated on the cited grade being FINAL, and the same report publishes successfully once the game is finalized."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Game G1 is PLAYED (not yet FINALIZED) and Dan's grade Q3-P22 is POSTED."
            - "A POOL_REPORT draft cites that grade."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - *k_grade
            - *k_post_grade
            - call: "POST /pool-reports"
              payload: { game_id: "${g_id}", play_grade_id: "${pg_id}", report_type: "POOL_REPORT", body: "Explanation of the missed holding call in the third quarter." }
              as: CommunicationsOfficer
              captures: { pr_early_id: $.data.id, pr_early_status: $.data.status }
          trigger:
            - call: "POST /pool-reports/${pr_early_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { err_not_final: $.data.error_id }
            - call: "GET /pool-reports/${pr_early_id}"
              payload: {}
              as: CommunicationsOfficer
              captures: { pr_early_status_after: $.data.status, pr_early_published_after: $.data.published_at }
            - *k_finalize
            - call: "POST /pool-reports/${pr_early_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { pr_early_status_ok: $.data.status, pr_early_published_ok: $.data.published_at }
          assert:
            - "${pr_early_status} == DRAFT — drafting against a POSTED grade is allowed"
            - "publishing returns HTTP 409 with ${err_not_final} == ERR_CITED_GRADE_NOT_FINAL because the grade is POSTED, not FINAL"
            - "${pr_early_status_after} == DRAFT and ${pr_early_published_after} == null"
            - "after finalize the same publish succeeds: ${pr_early_status_ok} == PUBLISHED with ${pr_early_published_ok} == 2026-09-13T21:30:00Z"

      - name: occupancy_conflict_outranks_the_rotation_cap
