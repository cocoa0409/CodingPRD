      - name: reinstating_an_active_lessee_and_suspending_a_suspended_one_both_return_lessee_invalid_state
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_LESSEE_INVALID_STATE
          - validations[priority 39 ERR_LESSEE_INVALID_STATE]
          - state_machines.Lessee[ACTIVE -> SUSPENDED]
          - state_machines.Lessee[SUSPENDED -> ACTIVE]
        distinguishing_aspect: |
          ERR_LESSEE_INVALID_STATE is triggerable from BOTH directions of the credit-control cycle,
          and neither rejection is a silent no-op: the failed reinstate leaves the lessee ACTIVE and
          the failed second suspend leaves it SUSPENDED, after which the cycle still completes
          normally. This distinguishes a real source-state guard from an idempotent 200.
          
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One Lessee Meridian Charter Group in status ACTIVE with outstanding balance 0."
          setup_api_calls:
