# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3199_fare_prediction_price_freeze_booking_guarantee_products
#
# Fare Prediction, Price Freeze & Booking Guarantee Products (Hopper):
# historical and live fare data modeling to forecast price movement for a route
# and date, watch and notification workflow, a price freeze product where a
# deposit locks a fare for a period with the company absorbing increases up to a
# cap, cancellation and change protection products priced against predicted
# disruption probability, product exposure management with hedging and cap
# setting per itinerary, claim fulfillment when a frozen fare rises, refund and
# rebooking operations for protected itineraries, and disclosure and regulatory
# treatment of ancillary travel products.
# =============================================================================

scenario: |
  Fare Prediction, Price Freeze & Booking Guarantee Products (Hopper): historical and live fare data modeling to forecast price movement for a route and date, watch and notification workflow prompting users to book or wait, price freeze product where a deposit locks a fare for a period with the company absorbing increases up to a cap, cancellation and change protection products priced against predicted disruption probability, product exposure management with hedging and cap setting per itinerary, claim fulfillment when a frozen fare rises requiring purchase at market price, refund and rebooking operations for protected itineraries, disclosure and regulatory treatment of ancillary travel products

domain_name: fare-freeze-guarantee-products
api_prefix: /fare

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  # secondary archetype rationale: the disclosure / regulatory-treatment half of the scenario —
  # ancillary travel products are priced actuarially, held as restricted custodied funds, and
  # settled through a claim pipeline with an audit gate before payout.
  complexity_layers:
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - optimistic_concurrency
  entity_topology: flat            # peer entities linked by FK; no nesting in URL paths
  state_machine_shape: cyclic      # the freeze/posture/watch machines have sanctioned return arcs
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # quote, approve-claim and settle are held by different roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: origin_airport, type: string, source: input, description: "IATA origin code, 3 uppercase letters" }
      - { name: destination_airport, type: string, source: input, description: "IATA destination code, 3 uppercase letters" }
      - { name: flight_number, type: string, source: input, description: "Carrier flight number for the route" }
      - { name: travel_class, type: enum, source: input, default: "ECO", constraints: "ECO | PREMIUM | BUSINESS" }
      - { name: region, type: string, source: input, description: "Hedging pool region; market stress in one route keys off the regional pool" }
      - { name: base_fare_cents, type: integer, source: input, description: "The carrier's currently listed fare for the route; the live reference used by the overshoot rule, NOT the pinning basis of a freeze manifest" }
      - { name: fare_band_cents, type: array, source: input, description: "Five-point daily shock distribution for the route: [band_low, band_q1, band_mid, band_q3, band_high]" }
      - { name: peak_price_day_index, type: integer, source: input, default: 0, description: "Demand-curve day index (0-based) whose fare is the route's peak-day price" }
      - { name: seats_left, type: integer, source: input, default: 9, description: "Seats currently sellable on the route" }
      - { name: volatility_index, type: number, source: input, default: 0.20, description: "Scale applied to shock distances when a route enters a stressed posture" }
      - { name: hedge_ratio_pct, type: number, source: input, default: 0.60, description: "Share of the forecast peak exposure backed by the hedging book (0 < hedge_ratio_pct <= 0.90)" }
      - { name: max_guarantee_exposure_cents, type: integer, source: input, default: 50000, description: "Per-route ceiling on aggregate guarantee exposure that the risk desk will carry" }
      - { name: default_disruption_probability, type: number, source: input, default: 0.25, description: "Route-level baseline probability used when a protection quote does not supply its own" }
      - { name: disruption_severity_index, type: number, source: input, default: 0.1429, description: "Route severity factor; each disruption day costs this fraction of the itinerary fare" }
      - { name: protection_base_rate, type: number, source: input, default: 0.25, description: "Base premium rate applied to the probable-loss basis of protection products" }
      - { name: protection_floor_rate, type: number, source: input, default: 0.20, description: "Floor premium rate; the premium basis is never below floor_rate x probable loss" }
      - { name: cancel_minimum_disruption, type: number, source: input, default: 0.30, description: "Disruption probability a protection product must reach before protected cancellation may be exercised" }
      - { name: disclosure_version, type: integer, source: system, default: 1, description: "Bumped whenever disclosure_headline or the protection rate constants change; a purchase request must cite the current value (priority 18)" }
      - { name: peak_day_demand_multiplier, type: number, source: computed, default: 1.0, description: "Live demand uplift applied to base_fare_cents when the route is in SURGE; exactly 1.0 in every other posture" }
      - { name: disclosure_headline, type: string, source: input, description: "Mandatory pre-purchase disclosure headline surfaced by the quote endpoint" }
      - { name: war_chest_cents, type: integer, source: computed, default: 0, description: "Hedging book value; grows only through guarantee_hedge_rebalance and is the capacity pool for guarantee exposure" }
      - { name: reserved_exposure_cents, type: integer, source: computed, default: 0, description: "Sum over freezes not in EXPIRED/CANCELLED/CONVERTED of max(capped_impact_cents, the largest payout_cents among that freeze's claims not in REJECTED/SETTLED_WITH_PURCHASE), so a freeze and its own claim are never double-counted" }
      - { name: available_exposure_cents, type: integer, source: computed, default: 0, description: "war_chest_cents - reserved_exposure_cents; may be negative when a posture transition froze the desk after exposure was booked" }
      - { name: pooled_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of unhedged_exposure_cents over the region's routes with open freezes; a reporting value, not a posture trigger" }
      - { name: posture, type: enum, source: system, description: "ACTIVE -> SURGE -> RESTRICTED -> CLOSED with a sanctioned SURGE -> ACTIVE recovery arc; routinely derived, never client-supplied" }
      - { name: posture_reason_code, type: string, source: computed, default: "", description: "Machine-readable cause of the current posture" }
      - { name: open_freeze_count, type: integer, source: computed, default: 0, description: "Freezes on this route in HELD/FROZEN/CLAIM_PENDING" }
      - { name: curve_published, type: boolean, source: computed, default: false, description: "True once a demand curve has been published for the route; a false value lands risky quotes in QUOTED_FROZEN_ON_UNPUBLISHED_CURVE" }
      - { name: highest_curve_price_cents, type: integer, source: computed, default: 0, description: "Highest each_day price across all curves published for the route" }

  # ---------------------------------------------------------------------------
  - name: Itinerary
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; the route whose band, curve and hedging book govern this itinerary" }
      - { name: departure_date, type: datetime, source: input, description: "Departure date; the day-slice anchor for deposit attribution and pattern reconciliation" }
      - { name: traveler_user_id, type: string, source: input, description: "Opaque traveler identifier; the acting Traveler must present this value in X-User-ID to act on the itinerary" }
      - { name: booking_date, type: datetime, source: system, description: "Server-stamped creation date on the logical clock" }
      - { name: listed_fare_cents, type: integer, source: computed, default: 0, description: "Fare on file from the most recent live observation; 0 until the first observation" }
      - { name: last_observed_fare_cents, type: integer, source: computed, default: 0, description: "Alias of the most recent live observation used by the watch engine; 0 before any observation" }
      - { name: demand_curve_price_cents, type: integer, source: computed, default: 0, description: "Today's demand-curve price; 0 when the route has no curve published" }
      - { name: each_day_disruption_fare_cents, type: integer, source: computed, default: 0, description: "Itinerary fare x route disruption_severity_index; 0 when the curve is unpublished" }
      - { name: fare_tier_ceiling_cents, type: integer, source: computed, default: 0, description: "insurance_tier_ceiling of today's curve price; 0 when the curve is unpublished" }
      - { name: observed_fares_cents, type: array, source: computed, description: "Append-only ladder of every fare observed for the itinerary, in ascending observed_at order" }
      - { name: travel_status, type: enum, source: system, description: "PLANNED -> WATCHING -> BOOKED with WATCHING -> PLANNED revert, PLANNED -> CANCELLED" }
      - { name: watch_armed, type: boolean, source: computed, default: false, description: "True while an ARMED watch subscription exists for the itinerary" }
      - { name: guarantee_locked, type: boolean, source: computed, default: false, description: "True while a freeze on the itinerary is HELD or FROZEN" }
      - { name: booking_hold_expires_at, type: datetime, source: computed, description: "Set when a watch notification is confirmed as BUY_NOW: current_utc + 24 hours; null otherwise" }

  # ---------------------------------------------------------------------------
  - name: PriceObservation
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; the route the live fare feed belongs to" }
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the itinerary the observed fare applies to" }
      - { name: fare_cents, type: integer, source: input, description: "Observed live fare in cents; strictly positive" }
      - { name: seats_left, type: integer, source: input, description: "Seats remaining in the observed availability snapshot" }
      - { name: observed_at, type: datetime, source: system, description: "Server-stamped observation instant on the logical clock" }

  # ---------------------------------------------------------------------------
  - name: DemandCurve
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; the route the forecast belongs to" }
      - { name: price_date, type: datetime, source: input, description: "Calendar date the curve was published for" }
      - { name: each_day_prices_cents, type: array, source: input, description: "Five-element forecast price by demand-curve day index 0..4" }
      - { name: seats_left_at_each_day, type: array, source: input, description: "Five-element forecast availability by demand-curve day index 0..4" }
      - { name: published_at, type: datetime, source: system, description: "Server-stamped publication instant" }

  # ---------------------------------------------------------------------------
  - name: WatchSubscription
    parent: Itinerary
    common_fields: true
    fields:
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the itinerary being watched" }
      - { name: armed_at, type: datetime, source: system, description: "Server-stamped arming instant on the logical clock" }
      - { name: expires_at, type: datetime, source: system, description: "Equals the watched itinerary's departure_date; the watch must be resolved before departure" }
      - { name: notification_status, type: enum, source: system, description: "ARMED -> NOTIFIED -> WAIT -> NOTIFIED (cyclic) with exits to BUY_NOW / EXPIRED / CONFIRMED" }
      - { name: notification_attempt_count, type: integer, source: computed, default: 0, description: "Incremented on every notification evaluation that is not EXPIRED" }
      - { name: last_notified_fare_cents, type: integer, source: computed, default: 0, description: "Fare carried on the most recent BUY_NOW notification; 0 means the watch has never been notified" }
      - { name: last_notified_at, type: datetime, source: computed, description: "Logical-clock instant of the most recent notification; null before the first" }
      - { name: cooldown_until, type: datetime, source: computed, description: "Exclusively-available notification window: last_notified_at + 6 hours; a notification is suppressed at exactly this instant" }
      - { name: cooldown_suppressed, type: boolean, source: computed, default: false, description: "True when the notification was suppressed because the clock reads <= cooldown_until" }
      - { name: buy_now_warranty_applied, type: boolean, source: computed, default: false, description: "Set when BUY_NOW fires; the observed fare is recorded both at BUY_NOW and again at the end of the 24-hour holding window, and the lock value is the MINIMUM of the two" }
      - { name: locked_fare_cents, type: integer, source: computed, default: 0, description: "BUY_NOW warranty fare: minimum of the BUY_NOW observation and the end-of-window observation" }

  # ---------------------------------------------------------------------------
  - name: PriceFreeze
    parent: Itinerary
    common_fields: true
    fields:
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the itinerary whose fare is frozen" }
      - { name: manifest_fare_cents, type: integer, source: computed, description: "Fare pinned at freeze creation from the associated Route.base_fare_cents; never re-pinned on activation" }
      - { name: migrated_manifest, type: boolean, source: computed, default: false, description: "True only for pre-existing manifests whose fare was pinned before the re-pin rule was introduced; selects the legacy evaluation branch of guarantee_hedge_rebalance" }
      - { name: cap_cents, type: integer, source: computed, description: "round_half_up(1.4 x manifest_fare_cents); the company's per-freeze absorption ceiling" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit amount in cents; 100 <= deposit_cents <= 5000" }
      - { name: freeze_date, type: datetime, source: computed, description: "Logical-clock instant stamped on activation; null while DRAFT" }
      - { name: freeze_expires_at, type: datetime, source: computed, description: "freeze_date + 14 days; null while DRAFT" }
      - { name: firm_tier_ceiling_cents, type: integer, source: computed, default: 0, description: "insurance_tier_ceiling of the most recent observed fare at or before filing" }
      - { name: cap_tier_ceiling_cents, type: integer, source: computed, default: 0, description: "insurance_tier_ceiling of cap_cents" }
      - { name: guaranteed_ceiling_cents, type: integer, source: computed, default: 0, description: "max(firm_tier_ceiling_cents, cap_tier_ceiling_cents); the disclosed guarantee ceiling" }
      - { name: overshoot_cents, type: integer, source: computed, default: 0, description: "min(max(0, arrival_fare_cents - active_route_base_fare_cents), cap_cents) where active_route_base_fare_cents is the route base including the live surge/demand uplift" }
      - { name: capped_impact_cents, type: integer, source: computed, default: 0, description: "round_half_up(overshoot_cents x 1.2); the exposure the desk holds for this freeze" }
      - { name: exposure_cents, type: integer, source: computed, default: 0, description: "min(overshoot_cents, capped_impact_cents) evaluated with the FREEZE-TIME base fare" }
      - { name: guaranteed_ceiling_test_cents, type: integer, source: computed, default: 0, description: "Re-evaluation of the guarantee ceiling against the active route base fare, used only by the claim conformity test" }
      - { name: hedged_exposure_cents, type: integer, source: computed, default: 0, description: "min(exposure_cents, round_half_up(exposure_cents x route.hedge_ratio_pct))" }
      - { name: unhedged_exposure_cents, type: integer, source: computed, default: 0, description: "min(exposure_cents, guaranteed_ceiling_cents) - hedged_exposure_cents; the quantity aggregated into the regional pool" }
      - { name: deposit_attributed_cents, type: integer, source: computed, default: 0, description: "deposit_cents x membership_days_elapsed / 14, rounded to cents" }
      - { name: membership_days_elapsed, type: integer, source: computed, default: 0, description: "Whole days between freeze_date and the logical clock, TRUNCATED" }
      - { name: pattern_day_count, type: integer, source: computed, default: 0, description: "round_half_up(number of model days that are BOTH expired-freeze days and inside this freeze's 14-day window x freeze_share); the day count that reconciliation compares against deposit_attributed_cents" }
      - { name: custody_held_cents, type: integer, source: computed, default: 0, description: "Restricted custody balance: credited portions of frozen deposits and redeemed premium credits" }
      - { name: custody_return_pending_cents, type: integer, source: computed, default: 0, description: "Debited from custody on expiry, settlement or conversion; paid out remainder is custody_return_pending_cents + transaction_value_cents" }
      - { name: deposit_forfeited_cents, type: integer, source: computed, default: 0, description: "0 during and after expiry; becomes 2 x deposit_cents only on CANCELLED with a paying membership attached" }
      - { name: frozen_effective_at, type: datetime, source: computed, description: "Logical-clock instant the freeze last entered FROZEN; null while DRAFT or HELD" }
      - { name: deposit_integrity_flag, type: enum, source: computed, default: "INTEGRITY_CONSISTENT", constraints: "INTEGRITY_CONSISTENT | INTEGRITY_UNDER_RECOGNIZED | INTEGRITY_OVER_RECOGNIZED", description: "Verdict of deposit attribution reconciliation" }
      - { name: status, type: enum, source: system, description: "DRAFT -> HELD -> FROZEN -> CLAIM_PENDING -> CLAIMED -> CONVERTED with EXPIRED and CANCELLED exits, and a sanctioned CLAIM_PENDING -> FROZEN revert" }

  # ---------------------------------------------------------------------------
  - name: ProtectionProduct
    parent: Itinerary
    common_fields: true
    fields:
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the itinerary the protection covers" }
      - { name: freeze_id, type: string, source: system, description: "FK -> PriceFreeze.id; the freeze this protection is a member of, or null when purchased standalone" }
      - { name: product_type, type: enum, source: input, constraints: "CANCELLATION | CHANGE" }
      - { name: quoted_status, type: enum, source: system, description: "QUOTED_FROZEN -> QUOTED_ACTIVE -> QUOTED or QUOTED_FROZEN_ON_UNPUBLISHED_CURVE -> QUOTED; a pricing-status dimension running independently of lifecycle_status" }
      - { name: lifecycle_status, type: enum, source: system, description: "QUOTED -> ACTIVE -> CHANGE_IN_PROGRESS -> CANCELLED_PROTECTED / REBOOKED / TERMINATED / EXPIRED; a lifecycle dimension running independently of quoted_status" }
      - { name: cancellation_disruption_probability, type: number, source: input, description: "Client-declared disruption probability for the itinerary; clamped to at most 0.95 at quote time" }
      - { name: disruption_probability, type: number, source: computed, default: 0, description: "Effective probability: the freeze's hedged share rate when a covering freeze exists, else the clamped client value" }
      - { name: change_disruption_probability, type: number, source: computed, default: 0, description: "0.5 x disruption_probability, floored at 0.05" }
      - { name: change_minimum_applied, type: boolean, source: computed, default: false, description: "True when the computed change premium was below its own minimum and the minimum was substituted" }
      - { name: quote_probable_loss_cents, type: integer, source: computed, default: 0, description: "max(disruption_probability x each_day_disruption_fare_cents, floor_rate x each_day_disruption_fare_cents), rounded to cents" }
      - { name: minimum_disruption_met, type: boolean, source: computed, default: false, description: "True when disruption_probability >= route.cancel_minimum_disruption; unlocks protected cancellation" }
      - { name: bonus_days_total, type: integer, source: computed, default: 0, description: "0 for a member of a freeze that carries the guarantee; 1 or 2 from the effective disruption band for a standalone product" }
      - { name: bonus_days_remaining, type: integer, source: computed, default: 0, description: "bonus_days_total - redeemed_value_cents" }
      - { name: premium_cents, type: integer, source: computed, default: 0, description: "quote_probable_loss_cents x product rate: base_rate for CANCELLATION, 0.35 for CHANGE, neither below scale x each_day_disruption_fare_cents" }
      - { name: cancelled_by_member, type: boolean, source: computed, default: false, description: "True once protected cancellation has been exercised" }
      - { name: redeemed_value_cents, type: integer, source: computed, default: 0, description: "Bonus days consumed: cancellation forfeits ceil(premium / each_day_disruption_fare) days, capped at bonus_days_total" }
      - { name: duration_consumed_days, type: integer, source: computed, default: 0, description: "Days consumed through the duration metric (settled ChangeEvents only)" }
      - { name: terminated_hard, type: boolean, source: computed, default: false, description: "True when the product was terminated by the desk or by travel completion with zero remaining bonus days" }
      - { name: coverage_expires_at, type: datetime, source: computed, description: "Itinerary departure_date; coverage ends at the scheduled departure" }
      - { name: suspended_under_cap, type: boolean, source: computed, default: false, description: "True when a covering freeze exists and the member's hedged share rate is below 0.50" }

  # ---------------------------------------------------------------------------
  - name: GuaranteeClaim
    parent: PriceFreeze
    common_fields: true
    fields:
      - { name: freeze_id, type: string, source: system, description: "FK -> PriceFreeze.id; the freeze being claimed against" }
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the travel the claim settles" }
      - { name: market_price_cents, type: integer, source: input, description: "Observed market price of the ticket the traveler purchased" }
      - { name: claim_status, type: enum, source: system, description: "FILED -> UNDER_REVIEW -> APPROVED -> SETTLED_WITH_PURCHASE with REJECTED and WITHDRAWN exits and a genuine FILED -> APPROVED -> UNDER_REVIEW reconsideration arc" }
      - { name: overshoot_cents, type: integer, source: computed, default: 0, description: "min(max(0, market_price_cents - active_route_base_fare_cents), cap_cents); 0 means the frozen fare did not rise" }
      - { name: capped_impact_cents, type: integer, source: computed, default: 0, description: "round_half_up(overshoot_cents x 1.2)" }
      - { name: payout_cents, type: integer, source: computed, default: 0, description: "min(overshoot_cents, capped_impact_cents, guaranteed_ceiling_cents); expected to equal capped_impact_cents whenever the exposure chain was built inside one insurance tier" }
      - { name: transaction_value_cents, type: integer, source: computed, default: 0, description: "Transaction value in force: transaction_value_pre_cents while claim_status is not SETTLED_WITH_PURCHASE, transaction_value_final_cents afterwards" }
      - { name: transaction_value_pre_cents, type: integer, source: computed, default: 0, description: "2 x manifest_fare_cents - max(0, manifest_fare_cents - market_price_cents) x disruption_probability, with the rate product rounded to three decimals before scaling" }
      - { name: transaction_value_final_cents, type: integer, source: computed, default: 0, description: "2 x manifest_fare_cents - max(0, manifest_fare_cents - arrival_fare_cents) x disruption_probability; diverges from the pre value whenever the arrival fare differs from the market price" }
      - { name: audit_ready, type: boolean, source: computed, default: false, description: "True when approver_user_id is set, differs from filer_user_id, and differs from the identity attempting settlement; a payout that fails this gate is rejected with ERR_SOD_VIOLATION, and a claim with no approver fails the state check instead" }
      - { name: depth_ratio, type: number, source: computed, default: 0, description: "unhedged_exposure_cents / capped_impact_cents of the claimed freeze, rounded to four decimals" }
      - { name: continuum_absorbed_cents, type: integer, source: computed, default: 0, description: "Share of the overshoot that was borne continuously rather than through a bounded product, per the loss continuum model" }

  # ---------------------------------------------------------------------------
  - name: ChangeEvent
    parent: ProtectionProduct
    common_fields: true
    fields:
      - { name: protection_id, type: string, source: system, description: "FK -> ProtectionProduct.id; the change product that filed the event" }
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the itinerary being changed" }
      - { name: old_departure_date, type: datetime, source: computed, description: "Itinerary departure date captured at filing" }
      - { name: new_departure_date, type: datetime, source: input, description: "Requested replacement departure date; must differ from the old one" }
      - { name: day_shift, type: integer, source: computed, description: "Absolute day distance between old and new departure dates" }
      - { name: disruption_days, type: integer, source: computed, description: "change_disruption_days(day_shift): the CHANGE product's entitlement consumption, computed on the duration metric only" }
      - { name: unrecovered_travel_fare_cents, type: integer, source: computed, default: 0, description: "Old departure fare re-rated at the arrival observation, written only when the event is abandoned after its hold lapses" }
      - { name: remaining_days, type: integer, source: computed, description: "bonus_days_remaining - disruption_days, evaluated when the event is settled" }
      - { name: status, type: enum, source: system, description: "OPEN -> OPTION_SELECTED -> HELD -> SETTLED with HELD -> OPTION_SELECTED revert on hold lapse and OPEN/OPTION_SELECTED/HELD -> CANCELLED exits" }
      - { name: selected_option_id, type: string, source: computed, description: "The chosen RebookingOption id; null before a selection" }
      - { name: option_hold_expires_at, type: datetime, source: computed, description: "current_utc + 24 hours, stamped at option acceptance; null outside HELD" }
      - { name: gap_direction, type: enum, source: input, default: "ORIGIN_DIRECTION", constraints: "ORIGIN_DIRECTION | DESTINATION_DIRECTION" }

  # ---------------------------------------------------------------------------
  - name: RebookingOption
    parent: ChangeEvent
    common_fields: true
    fields:
      - { name: change_event_id, type: string, source: system, description: "FK -> ChangeEvent.id; the change event the option belongs to" }
      - { name: departure_date, type: datetime, source: input, description: "Departure date offered by this option" }
      - { name: option_fare_cents, type: integer, source: input, description: "Fare of the offered replacement itinerary" }
      - { name: sequence_index, type: integer, source: computed, description: "1-based deterministic order: ascending departure_date, ties broken by ascending created_at, then by ascending option_fare_cents; the only sanctioned tie-break chain" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "Logical-clock instant the option's hold lapses; null while OFFERED" }
      - { name: status, type: enum, source: system, description: "OFFERED -> SELECTED -> HELD -> ACCEPTED with OFFERED -> SUPERSEDED / EXPIRED exits and a HELD -> EXPIRED revert arc" }

  # ---------------------------------------------------------------------------
  - name: Payment
    parent: PriceFreeze
    common_fields: true
    fields:
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the travel the payment funds" }
      - { name: freeze_id, type: string, source: system, description: "FK -> PriceFreeze.id; the price freeze this payment settles, or null" }
      - { name: protection_id, type: string, source: system, description: "FK -> ProtectionProduct.id; the protection product this payment settles, or null" }
      - { name: claim_id, type: string, source: system, description: "FK -> GuaranteeClaim.id; the claim this payment disburses against, or null" }
      - { name: payment_kind, type: enum, source: input, constraints: "DEPOSIT | MEMBERSHIP_1 | MEMBERSHIP_2 | PREMIUM | CHANGE_FEE | HEDGE_TOPUP" }
      - { name: amount_cents, type: integer, source: input, description: "Amount in cents; strictly positive, at most 20000" }
      - { name: refundable_remaining_cents, type: integer, source: computed, description: "amount_cents minus allocations applied to it; never negative" }
      - { name: status, type: enum, source: system, description: "AUTHORIZED -> CAPTURED -> PARTIALLY_REFUNDED -> REFUNDED, with FORFEITED and RETIRED as terminal sinks" }
      - { name: retired_reason, type: string, source: computed, default: "", description: "Machine-readable sink reason; a RETIRED payment cannot be allocated or refunded (ERR_PAYMENT_RETIRED)" }
      - { name: allocations, type: array, source: computed, description: "Ordered audit log of {target, amount_cents, applied_at}; each allocation debits refundable_remaining_cents and credits its target" }

  # ---------------------------------------------------------------------------
  - name: HedgingPosition
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; the route the hedge protects" }
      - { name: coverage_date, type: datetime, source: input, description: "Calendar date the hedge covers; a route may hold at most one position per coverage date and per-fare" }
      - { name: hedge_price_cents, type: integer, source: input, description: "Fare the book locked in for the coverage date" }
      - { name: contract_quantity_cents, type: integer, source: input, description: "Notional quantity of the position" }
      - { name: status, type: enum, source: system, description: "OPEN -> HEDGED -> SETTLED with OPEN -> LAPSED exit and a sanctioned LAPSED -> OPEN recovery arc" }
      - { name: projected_day_cost_cents, type: integer, source: computed, default: 0, description: "Most recent projected cost for the coverage date" }
      - { name: pool_id, type: string, source: system, description: "FK -> RiskPool.id; the regional pool whose absorption can release this position's mark value" }
      - { name: mark_value_cents, type: integer, source: computed, default: 0, description: "max(0, projected_day_cost_cents - hedge_price_cents) stamped at each mark" }
      - { name: regression_reversed, type: boolean, source: computed, default: false, description: "True when the mark was reversed because the projected cost fell below the hedge price after the regional pool's war chest had already absorbed the regression" }
      - { name: absorption_released_cents, type: integer, source: computed, default: 0, description: "War-chest amount released when the position's status is SETTLED during a region-wide SURGE" }
      - { name: pool_binding_count, type: integer, source: computed, default: 0, description: "Number of coverage dates in the route's region already hedged; 4 is the region cap for newly opened positions" }
  # ---------------------------------------------------------------------------
  - name: RiskPool
    parent: null
    common_fields: true
    fields:
      - { name: region, type: string, source: input, description: "Region code this pool underwrites; at most one pool per region" }
      - { name: pool_code, type: string, source: input, description: "Human-readable pool code" }
      - { name: absorbed_regression_cents, type: integer, source: computed, default: 0, description: "Registered insurance slot: cents the pool has absorbed from hedge regressions; a positive value blocks the HEDGED -> OPEN reversal arc for its region" }
      - { name: available_capacity_cents, type: integer, source: computed, default: 0, description: "Sum of war_chest_cents over the region's routes, minus absorbed_regression_cents" }
      - { name: bound_position_count, type: integer, source: computed, default: 0, description: "Number of HedgingPosition rows in OPEN or HEDGED across the region's routes" }
      - { name: status, type: enum, source: system, description: "OPEN -> ABSORBING -> BOUND with an ABSORBING -> OPEN release arc" }

  # ---------------------------------------------------------------------------
  - name: DestinationOption
    parent: Itinerary
    common_fields: true
    fields:
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id; the itinerary whose recovered travel this option serves" }
      - { name: departure_date, type: datetime, source: input, description: "Departure date offered for the recovered travel" }
      - { name: option_fare_cents, type: integer, source: input, description: "Fare of the recovered-travel option" }
      - { name: direction, type: enum, source: input, default: "ORIGIN_DIRECTION", constraints: "ORIGIN_DIRECTION | DESTINATION_DIRECTION" }
      - { name: eligible, type: boolean, source: computed, default: false, description: "True when the option lies beyond the gap in the direction named by gap_direction and its departure_date is in the future" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> BOUND -> TAKEN with AVAILABLE -> BOUND -> AVAILABLE return for a released option" }


# =============================================================================
# §1.2 State Machine Table
#
# Replacement notation: a transition whose `trigger` contains `sets ... to X`
# REPLACES the target's current state with X. Every such arc is only reachable
# from the states named in its `from:` list, so it can never masquerade as an
# additional arc out of a state that does not list it. All 11 machines carry
# at least one sanctioned return arc — no machine in this scaffold is a
# one-way pipeline.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Route
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SURGE
        trigger: "POST /fare/routes/{route_id}/posture-transitions with to_posture=SURGE"
        actor: PlatformAdmin | system
        preconditions:
          - "route.posture == ACTIVE"
          - "request carries expected_route_version equal to route.version"
        side_effects:
          - "route.posture = SURGE; route.posture_reason_code = the requested reason code"
          - "Full regional postural re-derivation for every route sharing route.region, evaluated in ascending Route.created_at order; each re-derived route increments its own version; a route in the region is driven to RESTRICTED while its regional RiskPool has absorbed_regression_cents > 0"
          - "When any re-derived route leaves RESTRICTED its posture_reason_code is cleared and its version increments again"
          - "guarantee_hedge_rebalance recomputes hedged_exposure_cents, unhedged_exposure_cents, reserved_exposure_cents and available_exposure_cents for every freeze on the re-derived routes"
          - "increments Route.version by 1 for the directly mutated route (the OCC target of POST /fare/routes/{route_id}/posture-transitions)"

      - from: SURGE
        to: ACTIVE
        trigger: "POST /_clock/advance (full postural re-derivation) or POST /fare/routes/{route_id}/posture-transitions with to_posture=ACTIVE"
        actor: PlatformAdmin | system
        preconditions:
          - "The region's pooled exposure recomputes to 0: no route in route.region holds a PriceFreeze in HELD, FROZEN or CLAIM_PENDING"
        side_effects:
          - "route.posture = ACTIVE; route.posture_reason_code cleared"
          - "guarantee_hedge_rebalance re-derives reserved/available exposure for every freeze on the route"
          - "increments Route.version by 1 (OCC path only)"

      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /fare/routes/{route_id}/posture-transitions with to_posture=RESTRICTED, or POST /_clock/advance (re-derivation triggered by a freeze leaving HELD/FROZEN/CLAIM_PENDING)"
        actor: PlatformAdmin | system
        preconditions:
          - "request carries expected_route_version equal to route.version (admin path only)"
        side_effects:
          - "route.posture = RESTRICTED; posture_reason_code = the requested reason code or REGIONAL_POOL_BREACH"
          - "Every PriceFreeze on this route in DRAFT or HELD is frozen in place: deposit_attributed_cents and custody_held_cents receive no further increments and membership_days_elapsed stops advancing"
          - "Every PriceFreeze on this route in FROZEN or CLAIM_PENDING continues to be serviced"
          - "guarantee_hedge_rebalance recomputes available_exposure_cents for every freeze on the route; a negative value is retained, never clamped"
          - "increments Route.version by 1 (admin path)"

      - from: SURGE
        to: RESTRICTED
        trigger: "POST /_clock/advance (postural re-derivation triggered by a freeze expiry or conversion)"
        actor: PlatformAdmin | system
        preconditions:
          - "route.region's RiskPool has absorbed_regression_cents > 0"
        side_effects:
          - "route.posture = RESTRICTED; request.body.posture_reason_code = FROZEN_BY_POSTURE for this route"
          - "Every PriceFreeze on this route in DRAFT or HELD is frozen in place: status = HELD, deposit_attributed_cents and custody_held_cents receive no further increments, membership_days_elapsed stops advancing"
          - "Every PriceFreeze on this route in FROZEN or CLAIM_PENDING continues to be serviced (EXPIRED, CLAIMED and CONVERTED remain reachable)"
          - "guarantee_hedge_rebalance recomputes available_exposure_cents for every freeze on the route; a negative value is retained and reported, never clamped"

      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /_clock/advance (full postural re-derivation)"
        actor: system
        preconditions:
          - "The route's regional RiskPool has absorbed_regression_cents == 0"
        side_effects:
          - "route.posture = ACTIVE; frozen DRAFT/HELD freezes resume deposit attribution"
          - "guarantee_hedge_rebalance re-derives reserved/available exposure for every freeze on the route"

      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /fare/routes/{route_id}/posture-transitions with to_posture=CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "No PriceFreeze on this route is in FROZEN, CLAIM_PENDING or CLAIMED"
          - "request carries expected_route_version equal to route.version"
        side_effects:
          - "route.posture = CLOSED (terminal)"
          - "Every ProtectionProduct on the route's itineraries in QUOTED or ACTIVE transitions to TERMINATED; each open HoldIntent is returned through custodian_hold_release"
          - "increments Route.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fare/routes/{route_id}/posture-transitions with to_posture=CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "No PriceFreeze on this route is in FROZEN, CLAIM_PENDING or CLAIMED"
          - "request carries expected_route_version equal to route.version"
        side_effects:
          - "route.posture = CLOSED (terminal)"
          - "Every ProtectionProduct on the route's itineraries in QUOTED or ACTIVE transitions to TERMINATED"
          - "increments Route.version by 1"

      - from: SURGE
        to: CLOSED
        trigger: "POST /fare/routes/{route_id}/posture-transitions with to_posture=CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "No PriceFreeze on this route is in FROZEN, CLAIM_PENDING or CLAIMED"
          - "request carries expected_route_version equal to route.version"
        side_effects:
          - "route.posture = CLOSED (terminal)"
          - "Every ProtectionProduct on the route's itineraries in QUOTED or ACTIVE transitions to TERMINATED"
          - "increments Route.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Itinerary
    initial_state: PLANNED
    terminal_states: [BOOKED, CANCELLED]
    transitions:
      - from: PLANNED
        to: WATCHING
        trigger: "POST /fare/itineraries/{itinerary_id}/watch-subscription"
        actor: Traveler
        preconditions:
          - "itinerary.travel_status == PLANNED"
          - "The route has at least one DemandCurve published (ERR_CURVE_UNPUBLISHED otherwise)"
          - "The acting Traveler owns the itinerary"
        side_effects:
          - "A WatchSubscription is created in ARMED with armed_at = current_utc and expires_at = itinerary.departure_date"
          - "itinerary.travel_status = WATCHING; itinerary.watch_armed = true"
          - "increments Itinerary.version by 1"

      - from: WATCHING
        to: PLANNED
        trigger: "POST /fare/watch-subscriptions/{watch_id}/notifications evaluating to WAIT, or POST /_clock/advance lapsing an ARMED/NOTIFIED/WAIT watch past its expiration"
        actor: system | Traveler
        preconditions:
          - "itinerary.travel_status == WATCHING"
          - "WAIT branch: the applied recommendation for the watch evaluates to WAIT"
          - "Lapse branch: current_utc > watch.expires_at"
        side_effects:
          - "watch.notification_status = NOTIFIED when the receipt has no satisfying notification and WAIT when the applied recommendation is WAIT"
          - "watch.notification_attempt_count += 1; if a BUY_NOW fired, watch.last_notified_fare_cents = the applied fare and watch.last_notified_at = current_utc"
          - "On the lapse branch only: watch.notification_status = EXPIRED and itinerary.travel_status = PLANNED with itinerary.watch_armed = false"
          - "increments Itinerary.version by 1 on the lapse branch only"

      - from: PLANNED
        to: BOOKED
        trigger: "POST /fare/itineraries/{itinerary_id}/bookings"
        actor: Traveler | OpsAgent
        preconditions:
          - "itinerary.travel_status == PLANNED (an itinerary in WATCHING must be confirmed or lapsed first: ERR_ITINERARY_NOT_PLANNED)"
          - "The route has seats_left >= 1 (ERR_NO_SEATS_LEFT)"
        side_effects:
          - "itinerary.travel_status = BOOKED (terminal); itinerary.listed_fare_cents = route.base_fare_cents at booking instant"
          - "route.seats_left -= 1"
          - "Any ARMED/NOTIFIED/WAIT watch on the itinerary → CONFIRMED; itinerary.watch_armed = false"
          - "deposit_attribution_accrual runs for any PriceFreeze on the itinerary in FROZEN: status = CONVERTED, deposit_attributed_cents and custody_held_cents debited by their credited portions, and the freeze's reserved exposure is released"
          - "increments Itinerary.version by 1"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /fare/itineraries/{itinerary_id}/cancellations"
        actor: Traveler | OpsAgent
        preconditions:
          - "itinerary.travel_status == PLANNED"
        side_effects:
          - "itinerary.travel_status = CANCELLED (terminal)"
          - "Any ARMED/NOTIFIED/WAIT watch on the itinerary → EXPIRED; itinerary.watch_armed = false"
          - "Every PriceFreeze on the itinerary in DRAFT/HELD/FROZEN transitions to CANCELLED; for each, guarantee_hedge_rebalance deposit_forfeiture_rule sets deposit_forfeited_cents = 2 x deposit_cents when a Payment with payment_kind MEMBERSHIP_2 for the itinerary is CAPTURED or PARTIALLY_REFUNDED, else 0, and the credited custody portion is released"
          - "guarantee_hedge_rebalance releases the cancelled freezes' reserved exposure"
          - "increments Itinerary.version by 1"

      - from: WATCHING
        to: CANCELLED
        trigger: "POST /fare/itineraries/{itinerary_id}/cancellations"
        actor: Traveler | OpsAgent
        preconditions:
          - "itinerary.travel_status == WATCHING"
        side_effects:
          - "itinerary.travel_status = CANCELLED (terminal)"
          - "Watch → EXPIRED; every DRAFT/HELD/FROZEN PriceFreeze → CANCELLED with the same forfeiture and custody rules as the PLANNED branch"
          - "increments Itinerary.version by 1"

  # ---------------------------------------------------------------------------
  - entity: PriceObservation
    initial_state: OBSERVED
    terminal_states: [OBSERVED]
    transitions:
      - from: OBSERVED
        to: OBSERVED
        trigger: "POST /fare/price-observations (append-only feed; no update or delete endpoint exists)"
        actor: OpsAgent
        preconditions:
          - "fare_cents >= 1"
          - "The itinerary belongs to the named route (ERR_ROUTE_ITINERARY_MISMATCH)"
        side_effects:
          - "itinerary.listed_fare_cents = fare_cents; itinerary.last_observed_fare_cents = fare_cents"
          - "itinerary.demand_curve_price_cents, itinerary.each_day_disruption_fare_cents and itinerary.fare_tier_ceiling_cents re-derived from the most recently published DemandCurve for the route (each 0 when no curve is published)"
          - "Every PriceFreeze on the itinerary in FROZEN or CLAIM_PENDING recomputes overshoot_cents, capped_impact_cents, exposure_cents, hedged_exposure_cents and unhedged_exposure_cents against the active route base fare"
          - "increments Itinerary.version by 1"

      - from: OBSERVED
        to: OBSERVED
        trigger: "POST /_clock/advance (scheduled sweep re-evaluating every FROZEN freeze whose freeze_expires_at has been passed)"
        actor: system
        preconditions:
          - "current_utc > freeze.freeze_expires_at"
        side_effects:
          - "Each due PriceFreeze → EXPIRED: custody_return_pending_cents += custody_held_cents, custody_held_cents = 0, and reserved exposure released"
          - "route.pooled_exposure_cents and posture re-derived per the Route machine"

  # ---------------------------------------------------------------------------
  - entity: DemandCurve
    initial_state: PUBLISHED
    terminal_states: [PUBLISHED]
    transitions:
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /fare/demand-curves (an existing curve for the same route and price_date is superseded in place: price_date, each_day_prices_cents and seats_left_at_each_day are replaced and published_at re-stamped)"
        actor: OpsAgent
        preconditions:
          - "each_day_prices_cents has exactly 5 strictly positive entries"
          - "seats_left_at_each_day has exactly 5 entries with seats_left_at_each_day[0] >= seats_left_at_each_day[4]"
        side_effects:
          - "route.curve_published = true; route.highest_curve_price_cents = max over all curves of the route of max(each_day_prices_cents)"
          - "Every Itinerary on the route recomputes demand_curve_price_cents, each_day_disruption_fare_cents and fare_tier_ceiling_cents"
          - "Each recomputed itinerary increments its version by 1"

  # ---------------------------------------------------------------------------
  - entity: WatchSubscription
    initial_state: ARMED
    terminal_states: [CONFIRMED, EXPIRED]
    transitions:
      - from: ARMED
        to: NOTIFIED
        trigger: "POST /fare/watch-subscriptions/{watch_id}/notifications"
        actor: Traveler | OpsAgent
        preconditions:
          - "watch.notification_status ∈ {ARMED, NOTIFIED, WAIT}"
          - "current_utc <= watch.expires_at (ERR_WATCH_EXPIRED otherwise)"
          - "current_utc > watch.cooldown_until, or watch.cooldown_until is null (ERR_NOTIFICATION_SUPPRESSED otherwise)"
        side_effects:
          - "cost_of_waiting_evaluation recomputes recommendation; a BUY_NOW sets itinerary.booking_hold_expires_at = current_utc + 24 hours"
          - "A NOTIFIED receipt has no satisfying notification: watch.cooldown_suppressed = false, watch.buy_now_warranty_applied = false"
          - "increments WatchSubscription.version by 1"

      - from: NOTIFIED
        to: WAIT
        trigger: "POST /fare/watch-subscriptions/{watch_id}/notifications"
        actor: Traveler | OpsAgent
        preconditions:
          - "current_utc > watch.cooldown_until"
          - "The applied recommendation for the watch evaluates to WAIT"
        side_effects:
          - "watch.notification_status = WAIT; watch.notification_attempt_count += 1; watch.cooldown_suppressed = false"
          - "increments WatchSubscription.version by 1"

      - from: WAIT
        to: NOTIFIED
        trigger: "POST /fare/watch-subscriptions/{watch_id}/notifications"
        actor: Traveler | OpsAgent
        preconditions:
          - "current_utc > watch.cooldown_until"
          - "Any recommendation is delivered on this pass"
        side_effects:
          - "This is the cyclic return arc of the watch machine: WAIT → NOTIFIED"
          - "watch.notification_attempt_count += 1; for BUY_NOW, watch.buy_now_warranty_applied = true, watch.last_notified_fare_cents = applied fare, watch.last_notified_at = current_utc and itinerary.booking_hold_expires_at = current_utc + 24 hours"
          - "increments WatchSubscription.version by 1"

      - from: NOTIFIED
        to: NOTIFIED
        trigger: "POST /fare/watch-subscriptions/{watch_id}/notifications (cooldown-suppressed evaluation)"
        actor: Traveler | OpsAgent
        preconditions:
          - "current_utc <= watch.cooldown_until"
          - "watch.notification_status ∈ {NOTIFIED, WAIT}"
        side_effects:
          - "watch.cooldown_suppressed = true; the recommendation is computed but not delivered"
          - "increments WatchSubscription.version by 1"

      - from: ARMED
        to: BUY_NOW
        trigger: "POST /_clock/advance or POST /fare/watch-subscriptions/{watch_id}/notifications when the route has moved to RESTRICTED or CLOSED and the itinerary is still PLANNED/WATCHING"
        actor: system
        preconditions:
          - "The watch is within its window (current_utc <= watch.expires_at)"
        side_effects:
          - "watch.notification_status = BUY_NOW; watch.buy_now_warranty_applied = true; watch.last_notified_fare_cents = itinerary.last_observed_fare_cents"
          - "itinerary.booking_hold_expires_at = current_utc + 24 hours"
          - "increments WatchSubscription.version by 1"

      - from: BUY_NOW
        to: CONFIRMED
        trigger: "POST /fare/watch-subscriptions/{watch_id}/confirmations"
        actor: Traveler
        preconditions:
          - "current_utc <= watch.cooldown_until + 24 hours for a BUY_NOW fired by notification, or current_utc <= itinerary.booking_hold_expires_at for a system-fired BUY_NOW"
        side_effects:
          - "cost_of_waiting_evaluation runs the warranty closure: watch.locked_fare_cents = min(fare observed at BUY_NOW, fare observed at the end of the 24-hour holding window)"
          - "Any PriceFreeze on the itinerary in DRAFT/HELD/FROZEN → CONVERTED"
          - "itinerary.travel_status = BOOKED; itinerary.watch_armed = false; route.seats_left -= 1"
          - "increments WatchSubscription.version by 1"

      - from: NOTIFIED
        to: CONFIRMED
        trigger: "POST /fare/watch-subscriptions/{watch_id}/confirmations"
        actor: Traveler
        preconditions:
          - "A satisfying BUY_NOW notification was delivered (watch.last_notified_fare_cents > 0)"
        side_effects:
          - "Itinerary → BOOKED; any DRAFT/HELD/FROZEN freeze on it → CONVERTED; watch_armed = false"
          - "increments WatchSubscription.version by 1"

      - from: ARMED
        to: EXPIRED
        trigger: "POST /_clock/advance"
        actor: system
        preconditions:
          - "current_utc > watch.expires_at"
        side_effects:
          - "watch.notification_status = EXPIRED; itinerary.watch_armed = false"
          - "increments WatchSubscription.version by 1"

  # ---------------------------------------------------------------------------
  - entity: PriceFreeze
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED, CONVERTED]
    transitions:
      - from: DRAFT
        to: HELD
        trigger: "POST /fare/price-freezes/{freeze_id}/activations"
        actor: Traveler | OpsAgent
        preconditions:
          - "freeze.status == DRAFT"
          - "The itinerary's travel_status ∈ {PLANNED, WATCHING} (ERR_ITINERARY_NOT_PLANNABLE otherwise)"
          - "The route posture ∈ {ACTIVE, SURGE} (ERR_ROUTE_RESTRICTED otherwise)"
          - "request carries expected_freeze_version equal to freeze.version"
        side_effects:
          - "freeze.manifest_fare_cents = active route base fare at this instant (re-pinned from the DRAFT-time value when the live base fare has moved); freeze.cap_cents = round_half_up(1.4 x manifest_fare_cents)"
          - "The deposit is collected at activation: freeze.custody_held_cents = freeze.deposit_cents, and a DEPOSIT Payment is auto-recorded CAPTURED against the freeze with refundable_remaining_cents = deposit_cents"
          - "freeze.freeze_date = current_utc; freeze.freeze_expires_at = current_utc + 14 days"
          - "guarantee_hedge_rebalance sizes hedged_exposure_cents, unhedged_exposure_cents and reserved_exposure_cents; route.reserved_exposure_cents and route.available_exposure_cents are recomputed"
          - "itinerary.guarantee_locked = true; itinerary version incremented"
          - "increments PriceFreeze.version by 1"

      - from: HELD
        to: FROZEN
        trigger: "POST /fare/price-freezes/{freeze_id}/activations for the activation step, or POST /_clock/advance once freeze_expires_at has been passed"
        actor: system | Traveler
        preconditions:
          - "HELD → FROZEN via the activation endpoint: freeze.status == HELD and request carries expected_freeze_version equal to freeze.version"
          - "HELD → FROZEN via the sweep: current_utc > freeze.freeze_expires_at"
        side_effects:
          - "freeze.status = FROZEN; freeze.frozen_effective_at is the activating or sweep instant"
          - "guarantee_hedge_rebalance re-sizes the exposure chain against the active route base fare and the claimed hedge ratio"
          - "route.open_freeze_count += 1 in the sweep branch only"
          - "increments PriceFreeze.version by 1"

      - from: FROZEN
        to: EXPIRED
        trigger: "POST /_clock/advance once freeze_expires_at has been passed, or POST /fare/price-freezes/{freeze_id}/expirations"
        actor: system
        preconditions:
          - "current_utc > freeze.freeze_expires_at"
        side_effects:
          - "freeze.status = EXPIRED; custody_return_pending_cents += custody_held_cents; custody_held_cents = 0"
          - "itinerary.guarantee_locked = false; route.open_freeze_count -= 1"
          - "deposit_attribution_accrual settles the integrity verdict: deposit_integrity_flag = INTEGRITY_UNDER_RECOGNIZED when pattern_day_count > 0 and deposit_attributed_cents < pattern_day_count, INTEGRITY_OVER_RECOGNIZED when pattern_day_count == 0 and deposit_attributed_cents > 0, INTEGRITY_CONSISTENT otherwise"
          - "Any ProtectionProduct whose freeze_id is this freeze: suspended_under_cap = false, and the product moves QUOTED_ACTIVE → QUOTED with its bonus_days_total set from the effective disruption band"
          - "guarantee_hedge_rebalance releases the freeze's reserved exposure; route.pooled_exposure_cents re-derived and posture re-evaluated"

      - from: FROZEN
        to: CLAIM_PENDING
        trigger: "POST /fare/price-freezes/{freeze_id}/claims or POST /fare/claims"
        actor: Traveler
        preconditions:
          - "freeze.status == FROZEN"
          - "The freeze observation chain has arrived: overshoot_cents > 0 (ERR_NO_OVERSHOOT otherwise)"
        side_effects:
          - "freeze.status = CLAIM_PENDING; route.open_freeze_count unchanged"
          - "guarantee_claim_settlement computes the claim's overshoot, capped impact, payout and both transaction values"
          - "increments PriceFreeze.version by 1"

      - from: CLAIM_PENDING
        to: FROZEN
        trigger: "POST /fare/claims/{claim_id}/withdrawals or POST /fare/claims/{claim_id}/rejections"
        actor: Traveler | ClaimsAdjuster
        preconditions:
          - "The claim is in FILED, UNDER_REVIEW or REJECTED"
        side_effects:
          - "This is the sanctioned return arc of the freeze machine: a withdrawn or rejected claim returns its freeze to FROZEN so a corrected claim may be filed"
          - "freeze.status = FROZEN; the claim's payout_cents are released from reserved exposure and revert to the freeze's capped_impact_cents reservation"
          - "increments PriceFreeze.version by 1"

      - from: CLAIM_PENDING
        to: CLAIMED
        trigger: "POST /fare/claims/{claim_id}/settlements"
        actor: ClaimsAdjuster
        preconditions:
          - "No §1.4 row for this endpoint is violated, evaluated in priority order 1→33 (this deliberately includes the fixture behaviors: the audit gate at priority 7, the profile gate at priority 11 and the custody gate at priority 12)"
          - "request carries expected_claim_version equal to the claim's version (ERR_STALE_VERSION); the freeze itself carries no OCC check"
        side_effects:
          - "claim.claim_status = SETTLED_WITH_PURCHASE; claim.payout_cents is disbursed"
          - "freeze.status = CLAIMED; route.open_freeze_count -= 1"
          - "custodian_hold_release credits the freeze's custody balance with the disbursed payout and re-splits custody_return_pending_cents by the arrival fare's insurance tier"
          - "increments GuaranteeClaim.version by 1 (the OCC target of POST /fare/claims/{claim_id}/settlements)"

      - from: HELD
        to: CONVERTED
        trigger: "POST /fare/price-freezes/{freeze_id}/conversions (or a booking or watch confirmation that converts every DRAFT/HELD/FROZEN freeze on the itinerary)"
        actor: Traveler | OpsAgent
        preconditions:
          - "freeze.status ∈ {DRAFT, HELD, FROZEN}"
          - "request carries expected_freeze_version equal to freeze.version"
        side_effects:
          - "freeze.status = CONVERTED; itinerary.travel_status = BOOKED; itinerary.guarantee_locked = false; route.seats_left -= 1"
          - "deposit_attribution_accrual debits custody_held_cents by the credited portion, moves the remainder into custody_return_pending_cents and stamps deposit_integrity_flag"
          - "Any ProtectionProduct on the freeze: lifecycle_status QUOTED → ACTIVE with premium payable, or ACTIVE unchanged"
          - "guarantee_hedge_rebalance releases the freeze's reserved exposure"
          - "increments PriceFreeze.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fare/price-freezes/{freeze_id}/cancellations"
        actor: Traveler | OpsAgent
        preconditions:
          - "freeze.status == DRAFT"
        side_effects:
          - "freeze.status = CANCELLED; deposit_forfeited_cents = 0 (no deposit has been placed)"
          - "itinerary.guarantee_locked = false"
          - "increments PriceFreeze.version by 1"

      - from: HELD
        to: CANCELLED
        trigger: "POST /fare/price-freezes/{freeze_id}/cancellations"
        actor: Traveler | OpsAgent
        preconditions:
          - "freeze.status == HELD"
        side_effects:
          - "guarantee_hedge_rebalance deposit_forfeiture_rule sets deposit_forfeited_cents = 2 x deposit_cents when a Payment with payment_kind MEMBERSHIP_2 for the itinerary is CAPTURED or PARTIALLY_REFUNDED, else 0"
          - "freeze.status = CANCELLED; the credited custody portion is released to custody_return_pending_cents"
          - "increments PriceFreeze.version by 1"

      - from: FROZEN
        to: CANCELLED
        trigger: "POST /fare/price-freezes/{freeze_id}/cancellations"
        actor: Traveler | OpsAgent
        preconditions:
          - "freeze.status == FROZEN"
        side_effects:
          - "guarantee_hedge_rebalance deposit_forfeiture_rule sets deposit_forfeited_cents with the same membership rule as the HELD branch"
          - "freeze.status = CANCELLED; custody_return_pending_cents += custody_held_cents; custody_held_cents = 0"
          - "guarantee_hedge_rebalance releases the freeze's reserved exposure"
          - "increments PriceFreeze.version by 1"

      - from: CANCELLED
        to: DRAFT
        trigger: "POST /fare/price-freezes/{freeze_id}/reinstatements"
        actor: OpsAgent
        preconditions:
          - "freeze.status == CANCELLED"
          - "The itinerary's travel_status ∈ {PLANNED, WATCHING}"
          - "request carries expected_freeze_version equal to freeze.version"
        side_effects:
          - "This is the second sanctioned return arc of the freeze machine: CANCELLED → DRAFT"
          - "deposit_forfeited_cents, custody_held_cents, custody_return_pending_cents, overshoot_cents, capped_impact_cents and exposure_cents are all reset to 0; manifest_fare_cents and cap_cents cleared"
          - "increments PriceFreeze.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ProtectionProduct
    initial_state: QUOTED_FROZEN
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: QUOTED_FROZEN
        to: QUOTED_ACTIVE
        trigger: "POST /_clock/advance"
        actor: system
        preconditions:
          - "The covering freeze's status has become FROZEN or CLAIM_PENDING"
          - "The itinerary's travel_status ∈ {PLANNED, WATCHING}"
        side_effects:
          - "quoted_status = QUOTED_ACTIVE; disruption_probability = the freeze's hedged share rate (unhedged_exposure_cents / exposure_cents)"
          - "protection_pricing re-derives quote_probable_loss_cents and premium_cents; the premium delta is stated in the response"
          - "product_continuum_rating re-derives the continuum term; suspended_under_cap = true when the hedged share rate < 0.50"
          - "increments ProtectionProduct.version by 1"

      - from: QUOTED_FROZEN
        to: QUOTED
        trigger: "POST /_clock/advance or POST /fare/protections/{protection_id}/expirations once the freeze resolves without a claim"
        actor: system
        preconditions:
          - "The covering freeze's status ∈ {EXPIRED, CONVERTED}"
        side_effects:
          - "quoted_status = QUOTED; disruption_probability reverts to the clamped client declaration; bonus_days_total set from the effective disruption band"
          - "protection_pricing re-derives the premium"
          - "increments ProtectionProduct.version by 1"

      - from: QUOTED
        to: QUOTED_FROZEN
        trigger: "POST /_clock/advance, POST /fare/protections/{protection_id}/activations or POST /fare/itineraries/{itinerary_id}/watch-subscription when a covering freeze with an ACTIVE or RESTRICTED route posture exists"
        actor: system | Traveler
        preconditions:
          - "A PriceFreeze on the same itinerary has status DRAFT, HELD or FROZEN"
        side_effects:
          - "quoted_status = QUOTED_FROZEN; disruption_probability = the freeze's hedged share rate"
          - "This is the cyclic return arc of the pricing-status dimension: QUOTED → QUOTED_FROZEN"
          - "protection_pricing re-derives the probable loss and premium"
          - "increments ProtectionProduct.version by 1"

      - from: QUOTED_FROZEN
        to: QUOTED_FROZEN_ON_UNPUBLISHED_CURVE
        trigger: "POST /fare/protections or POST /fare/protections/{protection_id}/quotes"
        actor: Traveler | OpsAgent
        preconditions:
          - "route.curve_published == false"
          - "route.posture ∈ {ACTIVE, SURGE} (ERR_ROUTE_RESTRICTED otherwise)"
        side_effects:
          - "quoted_status = QUOTED_FROZEN_ON_UNPUBLISHED_CURVE; quote_probable_loss_cents = 0 and premium_cents = 0 (raised retroactively once a curve is published)"
          - "lifecycle_status stays QUOTED; the premium is never payable while quoted_status carries this value (ERR_PREMIUM_NOT_PAYABLE)"
          - "increments ProtectionProduct.version by 1"

      - from: QUOTED_FROZEN_ON_UNPUBLISHED_CURVE
        to: QUOTED
        trigger: "POST /fare/protections/{protection_id}/quotes (re-quote once a curve exists)"
        actor: Traveler | OpsAgent
        preconditions:
          - "route.curve_published == true"
          - "route.posture ∈ {ACTIVE, SURGE}"
        side_effects:
          - "quoted_status = QUOTED; quote_probable_loss_cents and premium_cents raised retroactively from the curve price"
          - "increments ProtectionProduct.version by 1"

      - from: QUOTED
        to: ACTIVE
        trigger: "POST /fare/protections/{protection_id}/activations"
        actor: Traveler | OpsAgent
        preconditions:
          - "lifecycle_status == QUOTED"
          - "quoted_status ∈ {QUOTED, QUOTED_ACTIVE}; a product quoted on an unpublished curve cannot be activated (ERR_PREMIUM_NOT_PAYABLE)"
          - "The route posture ∈ {ACTIVE, SURGE} (ERR_ROUTE_RESTRICTED otherwise)"
          - "request carries expected_protection_version equal to product.version"
        side_effects:
          - "lifecycle_status = ACTIVE; premium_cents becomes payable against a PREMIUM Payment"
          - "increments ProtectionProduct.version by 1"

      - from: ACTIVE
        to: CHANGE_IN_PROGRESS
        trigger: "POST /fare/protections/{protection_id}/change-events (calling POST /fare/change-events enforces the same preconditions)"
        actor: Traveler | OpsAgent
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "product_type == CHANGE (ERR_PRODUCT_TYPE_MISMATCH otherwise)"
          - "No other ChangeEvent for this protection is OPEN, OPTION_SELECTED or HELD (ERR_CHANGE_ALREADY_OPEN otherwise)"
        side_effects:
          - "lifecycle_status = CHANGE_IN_PROGRESS; a ChangeEvent is created in OPEN"
          - "increments ProtectionProduct.version by 1"

      - from: CHANGE_IN_PROGRESS
        to: ACTIVE
        trigger: "POST /fare/change-events/{change_event_id}/cancellations, or POST /_clock/advance lapsing a held option's 24-hour window"
        actor: Traveler | system
        preconditions:
          - "The change event is in OPEN, OPTION_SELECTED or HELD"
        side_effects:
          - "lifecycle_status = ACTIVE; the change event → CANCELLED"
          - "This is the sanctioned return arc of the lifecycle dimension: CHANGE_IN_PROGRESS → ACTIVE"
          - "bonus_days_remaining is unchanged; no premium is re-rated"
          - "increments ProtectionProduct.version by 1"

      - from: ACTIVE
        to: CANCELLED_PROTECTED
        trigger: "POST /fare/protections/{protection_id}/cancellations"
        actor: Traveler
        preconditions:
          - "lifecycle_status == ACTIVE; product_type == CANCELLATION (ERR_PRODUCT_TYPE_MISMATCH otherwise)"
          - "product.minimum_disruption_met == true (ERR_DISRUPTION_BELOW_MINIMUM otherwise)"
          - "itinerary.travel_status == PLANNED"
          - "product has not already exercised cancellation (ERR_CANCELLATION_ALREADY_EXERCISED otherwise)"
        side_effects:
          - "lifecycle_status = CANCELLED_PROTECTED; cancelled_by_member = true"
          - "protect_change_redemption sets redeemed_value_cents = min(bonus_days_total, ceil(premium_cents / itinerary.each_day_disruption_fare_cents))"
          - "bonus_days_remaining = bonus_days_total - redeemed_value_cents; custodian_hold_release credits custody_held_cents with the product's next scheduled release"
          - "itinerary.travel_status = CANCELLED; every PriceFreeze on it in DRAFT/HELD → CANCELLED with deposit_forfeited_cents = 0 (a protected cancellation is not a bare cancellation)"
          - "increments ProtectionProduct.version by 1"

      - from: CANCELLED_PROTECTED
        to: ACTIVE
        trigger: "POST /fare/protections/{protection_id}/reinstatements"
        actor: OpsAgent
        preconditions:
          - "lifecycle_status == CANCELLED_PROTECTED"
          - "itinerary.travel_status == CANCELLED"
          - "request carries expected_protection_version equal to product.version"
        side_effects:
          - "This is the sanctions-reversal arc: CANCELLED_PROTECTED → ACTIVE"
          - "cancelled_by_member = false; redeemed_value_cents and bonus_days_remaining revert to the pre-cancellation values; itinerary.travel_status = PLANNED; the freeze cancellations are reverted to DRAFT"
          - "increments ProtectionProduct.version by 1"

      - from: ACTIVE
        to: REBOOKED
        trigger: "POST /fare/change-events/{change_event_id}/settlements"
        actor: Traveler
        preconditions:
          - "lifecycle_status ∈ {ACTIVE, CHANGE_IN_PROGRESS}"
          - "The change event's selected option is in HELD and not lapsed (ERR_OPTION_HOLD_LAPSED otherwise)"
          - "change_event.remaining_days >= 0 (ERR_INSUFFICIENT_BONUS_DAYS otherwise)"
        side_effects:
          - "lifecycle_status = REBOOKED; change_event.status = SETTLED"
          - "protect_change_redemption records redeemed_value_cents += disruption_days from the active ChangeEvent (adding to any cancellation consumption)"
          - "bonus_days_remaining re-derived; itinerary.departure_date = the new departure date"
          - "increments ProtectionProduct.version by 1"

      - from: CHANGE_IN_PROGRESS
        to: REBOOKED
        trigger: "POST /fare/change-events/{change_event_id}/settlements"
        actor: Traveler
        preconditions:
          - "The change event's selected option is in HELD and not lapsed"
          - "change_event.remaining_days >= 0"
        side_effects:
          - "Same as the ACTIVE → REBOOKED branch"
          - "increments ProtectionProduct.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /fare/protections/{protection_id}/terminations (also fired by a Hard terminator: cancellation before departure)"
        actor: OpsAgent | system
        preconditions:
          - "lifecycle_status ∈ {QUOTED, ACTIVE, CHANGE_IN_PROGRESS}"
          - "A Hard terminator holds: itinerary.travel_status == CANCELLED, or the itinerary reached travel completion with zero bonus days remaining"
        side_effects:
          - "lifecycle_status = TERMINATED; terminated_hard = true; the product is removed from every bonus-day walk (hard-deleted from the entitlement walk: its existence is provably worth exactly zero)"
          - "increments ProtectionProduct.version by 1"

      - from: QUOTED
        to: TERMINATED
        trigger: "POST /fare/protections/{protection_id}/terminations or a Route → CLOSED cascade"
        actor: OpsAgent | system
        preconditions:
          - "lifecycle_status == QUOTED"
        side_effects:
          - "lifecycle_status = TERMINATED; terminated_hard = true; the quoted premium is never charged"
          - "increments ProtectionProduct.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance once coverage_expires_at has been passed with no terminator"
        actor: system
        preconditions:
          - "current_utc > product.coverage_expires_at"
          - "itinerary.travel_status ∈ {PLANNED, WATCHING} (a BOOKED itinerary is not expired; it is walked for termination)"
        side_effects:
          - "lifecycle_status = EXPIRED (soft terminator); terminated_hard = false; the product keeps its bonus_days_total and remains visible to entitlement walks"
          - "increments ProtectionProduct.version by 1"

  # ---------------------------------------------------------------------------
  - entity: GuaranteeClaim
    initial_state: FILED
    terminal_states: [SETTLED_WITH_PURCHASE, REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /fare/claims/{claim_id}/reviews"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.claim_status ∈ {FILED, APPROVED}"
          - "The acting X-User-ID differs from claim.filer_user_id (ERR_SOD_VIOLATION otherwise)"
        side_effects:
          - "claim_status = UNDER_REVIEW; approver_user_id = the acting X-User-ID"
          - "increments GuaranteeClaim.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /fare/claims/{claim_id}/reviews (review step) or POST /fare/claims/{claim_id}/approvals"
        actor: ClaimsAdjuster
        preconditions:
          - "claim_status == UNDER_REVIEW"
          - "The claim passed the conformity test: payout_cents == capped_impact_cents (ERR_CLAIM_NON_CONFORMANT otherwise)"
        side_effects:
          - "claim_status = APPROVED; the payout is fenced as reserved exposure"
          - "increments GuaranteeClaim.version by 1"

      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /fare/claims/{claim_id}/reconsiderations"
        actor: ClaimsAdjuster
        preconditions:
          - "claim_status == APPROVED"
          - "current_utc <= freeze.freeze_expires_at + 14 days"
        side_effects:
          - "This is the genuine reconsideration arc of the claim machine: APPROVED → UNDER_REVIEW"
          - "claim_status = UNDER_REVIEW; any prior fenced payout is released back to reserved exposure; the schema-existence check (priority 19) runs on the fully-formed data"
          - "increments GuaranteeClaim.version by 1"

      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /fare/claims/{claim_id}/reconsiderations"
        actor: ClaimsAdjuster
        preconditions:
          - "claim_status == REJECTED"
        side_effects:
          - "claim_status = UNDER_REVIEW; the freeze returns to FROZEN per the freeze machine"
          - "increments GuaranteeClaim.version by 1"

      - from: FILED
        to: APPROVED
        trigger: "POST /fare/claims/{claim_id}/approvals (fast path from FILED that records the approver identity directly)"
        actor: ClaimsAdjuster
        preconditions:
          - "The acting X-User-ID differs from claim.filer_user_id (ERR_SOD_VIOLATION otherwise)"
          - "The claim passed the conformity test: payout_cents == capped_impact_cents"
        side_effects:
          - "claim_status = APPROVED"
          - "increments GuaranteeClaim.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /fare/claims/{claim_id}/rejections"
        actor: ClaimsAdjuster
        preconditions:
          - "claim_status ∈ {FILED, UNDER_REVIEW}"
        side_effects:
          - "claim_status = REJECTED; the freeze returns to FROZEN"
          - "increments GuaranteeClaim.version by 1"

      - from: FILED
        to: REJECTED
        trigger: "POST /fare/claims/{claim_id}/rejections"
        actor: ClaimsAdjuster
        preconditions:
          - "claim_status == FILED"
        side_effects:
          - "claim_status = REJECTED; the freeze returns to FROZEN"
          - "increments GuaranteeClaim.version by 1"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /fare/claims/{claim_id}/withdrawals"
        actor: Traveler
        preconditions:
          - "claim_status ∈ {FILED, UNDER_REVIEW}"
          - "The acting Traveler owns the claim's itinerary"
        side_effects:
          - "claim_status = WITHDRAWN; the freeze returns to FROZEN"
          - "increments GuaranteeClaim.version by 1"

      - from: APPROVED
        to: SETTLED_WITH_PURCHASE
        trigger: "POST /fare/claims/{claim_id}/settlements"
        actor: ClaimsAdjuster
        preconditions:
          - "No §1.4 row for this endpoint is violated, evaluated in priority order 1→33"
          - "claim.approver_user_id is set and differs from both claim.filer_user_id and the acting X-User-ID (priority 7 gate: the settlement must be recorded by a different adjuster than the approval)"
          - "The freeze's capped_impact_cents <= route.available_exposure_cents (priority 11 profile gate)"
          - "insurance_tier_ceiling(claim.market_price_cents) == insurance_tier_ceiling(freeze.cap_cents), or freeze.custody_return_pending_cents >= claim.payout_cents (priority 12 custody gate)"
          - "request carries expected_claim_version equal to claim.version"
        side_effects:
          - "claim_status = SETTLED_WITH_PURCHASE; transaction_value_cents switches to transaction_value_final_cents"
          - "freeze.status = CLAIMED; the payout is disbursed and the freeze's reserved exposure released"
          - "custodian_hold_release credits custody_held_cents with payout_cents and re-splits custody_return_pending_cents by the arrival fare's insurance tier"
          - "increments GuaranteeClaim.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ChangeEvent
    initial_state: OPEN
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: OPEN
        to: OPTION_SELECTED
        trigger: "POST /fare/change-events/{change_event_id}/selections"
        actor: Traveler
        preconditions:
          - "change_event.status ∈ {OPEN, OPTION_SELECTED}"
          - "The named option belongs to this change event (ERR_OPTION_NOT_IN_EVENT otherwise)"
          - "The option's status == OFFERED (ERR_OPTION_NOT_OFFERED otherwise)"
        side_effects:
          - "change_event.status = OPTION_SELECTED; selected_option_id = the option id; the option → SELECTED"
          - "Every other option in the event → SUPERSEDED"
          - "increments ChangeEvent.version by 1"

      - from: OPTION_SELECTED
        to: HELD
        trigger: "POST /fare/rebooking-options/{option_id}/acceptances"
        actor: Traveler
        preconditions:
          - "change_event.status == OPTION_SELECTED"
          - "option.status == SELECTED"
          - "The option's departure_date is in the future: option.departure_date > current_utc (ERR_OPTION_HOLD_LAPSED otherwise)"
        side_effects:
          - "change_event.status = HELD; option_hold_expires_at = current_utc + 24 hours; the option → HELD with hold_expires_at stamped to the same instant"
          - "increments ChangeEvent.version by 1 and RebookingOption.version by 1"

      - from: HELD
        to: OPTION_SELECTED
        trigger: "POST /_clock/advance once the option's hold expires, or POST /fare/rebooking-options/{option_id}/hold-reversions"
        actor: system
        preconditions:
          - "current_utc > change_event.option_hold_expires_at"
        side_effects:
          - "This is the sanctioned return arc of the change-event machine: HELD → OPTION_SELECTED"
          - "change_event.status = OPTION_SELECTED; option_hold_expires_at = null; the option → EXPIRED"
          - "change_event.unrecovered_travel_fare_cents = itinerary departure fare re-rated at the arrival observation; a second recurrence instead fires the terminal override (HELD → SETTLED) per the escape clause"
          - "increments ChangeEvent.version by 1"

      - from: OPEN
        to: SETTLED
        trigger: "POST /_clock/advance (terminal override, approximately 2% of changes)"
        actor: system
        preconditions:
          - "The change event has been open longer than 45 days with no selection (a late traveler whose option is not in the offered set)"
        side_effects:
          - "Terminal override: change_event.status = SETTLED with no rebooking; disruption_days = 0; remaining_days = bonus_days_remaining"
          - "increments ChangeEvent.version by 1"

      - from: HELD
        to: SETTLED
        trigger: "POST /_clock/advance (terminal override) or POST /fare/change-events/{change_event_id}/settlements"
        actor: system | Traveler
        preconditions:
          - "Override branch: a second hold lapse has occurred for the same change event"
          - "Settlement branch: a rebooking option is held and not lapsed"
        side_effects:
          - "change_event.status = SETTLED; remaining_days = bonus_days_remaining - disruption_days"
          - "The owning ProtectionProduct → REBOOKED; itinerary.departure_date = the new departure date"
          - "increments ChangeEvent.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /fare/change-events/{change_event_id}/cancellations"
        actor: Traveler | OpsAgent
        preconditions:
          - "change_event.status ∈ {OPEN, OPTION_SELECTED, HELD}"
        side_effects:
          - "change_event.status = CANCELLED; the owning product → ACTIVE (CHANGE_IN_PROGRESS → ACTIVE)"
          - "increments ChangeEvent.version by 1"

      - from: OPTION_SELECTED
        to: CANCELLED
        trigger: "POST /fare/change-events/{change_event_id}/cancellations"
        actor: Traveler | OpsAgent
        preconditions:
          - "change_event.status ∈ {OPEN, OPTION_SELECTED, HELD}"
        side_effects:
          - "change_event.status = CANCELLED; every option in the event → SUPERSEDED"
          - "increments ChangeEvent.version by 1"

  # ---------------------------------------------------------------------------
  - entity: RebookingOption
    initial_state: OFFERED
    terminal_states: [ACCEPTED, EXPIRED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: SELECTED
        trigger: "POST /fare/change-events/{change_event_id}/selections"
        actor: Traveler
        preconditions:
          - "option.status == OFFERED"
          - "The option is the one named by selected_option_id in the same request"
        side_effects:
          - "option.status = SELECTED; every sibling option in the same change event → SUPERSEDED"
          - "change_event.status = OPTION_SELECTED"
          - "increments RebookingOption.version by 1"

      - from: SELECTED
        to: HELD
        trigger: "POST /fare/rebooking-options/{option_id}/acceptances"
        actor: Traveler
        preconditions:
          - "option.status == SELECTED"
          - "The option's departure_date is in the future: option.departure_date > current_utc"
        side_effects:
          - "option.status = HELD; hold_expires_at = current_utc + 24 hours; change_event.status = HELD"
          - "increments RebookingOption.version by 1"

      - from: HELD
        to: EXPIRED
        trigger: "POST /_clock/advance"
        actor: system
        preconditions:
          - "current_utc > option.hold_expires_at"
        side_effects:
          - "This is the revert arc of the option machine: HELD → EXPIRED, and the parent change event returns to OPTION_SELECTED"
          - "option.status = EXPIRED; change_event.unrecovered_travel_fare_cents stamped"
          - "increments RebookingOption.version by 1"

      - from: HELD
        to: ACCEPTED
        trigger: "POST /fare/change-events/{change_event_id}/settlements"
        actor: Traveler
        preconditions:
          - "option.status == HELD"
          - "current_utc <= option.hold_expires_at"
          - "change_event.remaining_days >= 0"
        side_effects:
          - "option.status = ACCEPTED (terminal); itinerary.departure_date = option.departure_date"
          - "increments RebookingOption.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Payment
    initial_state: AUTHORIZED
    terminal_states: [REFUNDED, FORFEITED, RETIRED]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /fare/payments/{payment_id}/refunds is not the capture path; capture happens through the endpoint that creates the payment (POST /fare/payments with capture=true) or POST /fare/payments/{payment_id}/captures"
        actor: OpsAgent | system
        preconditions:
          - "payment.status == AUTHORIZED"
          - "payment_kind ∈ {DEPOSIT, PREMIUM, CHANGE_FEE, HEDGE_TOPUP, MEMBERSHIP_1, MEMBERSHIP_2}"
        side_effects:
          - "payment.status = CAPTURED; amount_cents is allocated to the target named by payment_kind (custody for DEPOSIT and MEMBERSHIP_1, route.war_chest_cents for MEMBERSHIP_2, the protection's premium for PREMIUM, the change event's fee for CHANGE_FEE, and nothing for HEDGE_TOPUP which is held for the next marks)"
          - "Each allocation is appended to payment.allocations and debits refundable_remaining_cents"
          - "increments Payment.version by 1"

      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /fare/payments/{payment_id}/refunds"
        actor: OpsAgent | ClaimsAdjuster
        preconditions:
          - "payment.status ∈ {CAPTURED, PARTIALLY_REFUNDED}"
          - "refund_cents <= payment.refundable_remaining_cents (ERR_PAYMENT_OVER_ALLOCATED otherwise)"
          - "refund_cents >= 1 (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "refundable_remaining_cents -= refund_cents; an allocation {target: REFUND, amount_cents: refund_cents} is appended"
          - "payment.status = PARTIALLY_REFUNDED when refundable_remaining_cents > 0"
          - "increments Payment.version by 1"

      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /fare/payments/{payment_id}/refunds"
        actor: OpsAgent | ClaimsAdjuster
        preconditions:
          - "refund_cents == payment.refundable_remaining_cents"
        side_effects:
          - "refundable_remaining_cents = 0; payment.status = REFUNDED (terminal)"
          - "increments Payment.version by 1"

      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /fare/payments/{payment_id}/refunds"
        actor: OpsAgent | ClaimsAdjuster
        preconditions:
          - "refund_cents == payment.refundable_remaining_cents"
        side_effects:
          - "refundable_remaining_cents = 0; payment.status = REFUNDED (terminal)"
          - "increments Payment.version by 1"

      - from: CAPTURED
        to: FORFEITED
        trigger: "POST /fare/price-freezes/{freeze_id}/cancellations settling the membership payments attached to the itinerary"
        actor: system
        preconditions:
          - "The freeze being cancelled is in HELD or FROZEN"
          - "A Payment with payment_kind MEMBERSHIP_2 for the same itinerary is CAPTURED or PARTIALLY_REFUNDED"
        side_effects:
          - "This is the sink arc for a deposit that has been forfeited: the deposit payment's refundable_remaining_cents is written to 0 and status = FORFEITED (terminal)"
          - "guarantee_hedge_rebalance deposit_forfeiture_rule sets the freeze's deposit_forfeited_cents = 2 x deposit_cents"
          - "increments Payment.version by 1"

      - from: CAPTURED
        to: RETIRED
        trigger: "POST /_clock/advance settling a DEPOSIT payment whose freeze reached CONVERTED, or any settlement of a payment whose target is terminal"
        actor: system
        preconditions:
          - "The payment's target freeze is CONVERTED, or its target claim is SETTLED_WITH_PURCHASE"
        side_effects:
          - "This is the second sink arc: the payment is retired with retired_reason = DEPOSIT_CONVERTED or CLAIM_SETTLED; it can no longer be allocated or refunded (ERR_PAYMENT_RETIRED)"
          - "increments Payment.version by 1"

      - from: AUTHORIZED
        to: RETIRED
        trigger: "POST /_clock/advance (authorization aged past 7 days without capture)"
        actor: system
        preconditions:
          - "payment.status == AUTHORIZED and current_utc > payment.created_at + 7 days"
        side_effects:
          - "payment.status = RETIRED; retired_reason = AUTHORIZATION_AGED"
          - "increments Payment.version by 1"

  # ---------------------------------------------------------------------------
  - entity: HedgingPosition
    initial_state: OPEN
    terminal_states: [SETTLED, LAPSED]
    transitions:
      - from: OPEN
        to: HEDGED
        trigger: "POST /fare/hedging-positions/{position_id}/marks"
        actor: RiskAnalyst
        preconditions:
          - "position.status == OPEN"
          - "The route posture ∈ {ACTIVE, SURGE} (ERR_ROUTE_RESTRICTED otherwise)"
        side_effects:
          - "position.status = HEDGED; projected_day_cost_cents = the marked projected cost; mark_value_cents = max(0, projected_day_cost_cents - hedge_price_cents)"
          - "increments HedgingPosition.version by 1"

      - from: HEDGED
        to: OPEN
        trigger: "POST /fare/hedging-positions/{position_id}/marks when the new projected cost falls below the hedge price after the regional pool's war chest has already absorbed the regression"
        actor: RiskAnalyst
        preconditions:
          - "The projected cost for the coverage date < position.hedge_price_cents"
          - "The route's region contains at least one route in SURGE"
        side_effects:
          - "This is the sanctioned return arc of the hedge machine: HEDGED → OPEN with regression_reversed = true"
          - "mark_value_cents = 0; position.regression_reversed = true"
          - "increments HedgingPosition.version by 1"

      - from: HEDGED
        to: SETTLED
        trigger: "POST /fare/hedging-positions/{position_id}/settlements or POST /fare/hedge-regression-sweeps"
        actor: RiskAnalyst | system
        preconditions:
          - "position.status == HEDGED"
          - "The route posture == SURGE for a settlement that releases absorption"
        side_effects:
          - "position.status = SETTLED; absorption_released_cents = mark_value_cents when the route is in SURGE, else 0"
          - "Route.war_chest_cents += absorption_released_cents; route.available_exposure_cents re-derived"
          - "increments HedgingPosition.version by 1"

      - from: OPEN
        to: LAPSED
        trigger: "POST /_clock/advance once the coverage date has been passed unnoticed"
        actor: system
        preconditions:
          - "current_utc > position.coverage_date and position.status == OPEN"
        side_effects:
          - "position.status = LAPSED"
          - "increments HedgingPosition.version by 1"

      - from: LAPSED
        to: OPEN
        trigger: "POST /_clock/advance (the regional pool's cap re-opens when the resolved pool falls below the risk desk threshold)"
        actor: system
        preconditions:
          - "The region's resolved pool < 250000"
        side_effects:
          - "Un-lapse arc: position.status = OPEN and the position again counts toward pool_binding_count"
          - "increments HedgingPosition.version by 1"

  # ---------------------------------------------------------------------------
  - entity: RiskPool
    initial_state: OPEN
    terminal_states: [BOUND]
    transitions:
      - from: OPEN
        to: ABSORBING
        trigger: "POST /fare/hedge-regression-sweeps when a region's hedge marks regress and the pool's absorbed_regression_cents rises above 0"
        actor: system
        preconditions:
          - "At least one HedgingPosition in the pool's region has a projected cost below its hedge price"
        side_effects:
          - "pool.status = ABSORBING; absorbed_regression_cents += the pool's registered insurance slot for the region (fixed at 140 cents per route in the region)"
          - "guarantee_hedge_rebalance fires: Route.war_chest_cents += round_half_up(140 x mark_value_cents / 100) for the directly mutated route"
          - "the Route postural re-derivation: the route's version increments, pooled exposure is re-derived, and the region is re-evaluated for SURGE and RESTRICTED"
          - "Every HEDGED -> OPEN reversal arc in the region is blocked while absorbed_regression_cents > 0"

      - from: ABSORBING
        to: OPEN
        trigger: "POST /fare/hedge-regression-sweeps once every route in the region has left SURGE or RESTRICTED"
        actor: system
        preconditions:
          - "No route in the pool's region is in SURGE or RESTRICTED"
        side_effects:
          - "Release arc: pool.status = OPEN; absorbed_regression_cents = 0; the region's regressions may be reversed again"
          - "bound_position_count recomputed over the region's routes"

      - from: ABSORBING
        to: BOUND
        trigger: "POST /fare/hedging-positions once the region's bound_position_count reaches the region cap"
        actor: RiskAnalyst
        preconditions:
          - "The region's bound_position_count is already 4"
        side_effects:
          - "pool.status = BOUND (terminal); newly opened hedging positions in the region are refused at priority 16"
          - "bound_position_count += 1 for the position that fills the cap"

  # ---------------------------------------------------------------------------
  - entity: DestinationOption
    initial_state: AVAILABLE
    terminal_states: [TAKEN]
    transitions:
      - from: AVAILABLE
        to: BOUND
        trigger: "POST /fare/destination-options/{destination_option_id}/selections"
        actor: Traveler
        preconditions:
          - "destination_option.eligible == true"
          - "itinerary.travel_status ∈ {PLANNED, WATCHING}"
          - "A ChangeEvent on the itinerary is in OPTION_SELECTED state with an eligible option pending acceptance"
        side_effects:
          - "destination_option.status = BOUND; change_event.status unchanged (bind does not arm a hold)"
          - "the bound option's fare is fenced as recovered-travel exposure and guarantee_hedge_rebalance recomputes the itinerary's reserved exposure"
          - "increments DestinationOption.version by 1"

      - from: BOUND
        to: AVAILABLE
        trigger: "POST /_clock/advance once the associated change event's hold has lapsed"
        actor: system
        preconditions:
          - "The associated ChangeEvent status is OPTION_SELECTED after a hold lapse"
        side_effects:
          - "This is the sanctioned return arc of the destination-option machine: BOUND -> AVAILABLE"
          - "the fenced recovered-travel exposure is released"
          - "increments DestinationOption.version by 1"

      - from: BOUND
        to: TAKEN
        trigger: "POST /fare/change-events/{change_event_id}/settlements"
        actor: Traveler
        preconditions:
          - "The change event settles into the option this destination binding was made for"
        side_effects:
          - "destination_option.status = TAKEN (terminal); the recovered-travel fare is billed at option_fare_cents"
          - "increments DestinationOption.version by 1"


# =============================================================================
# §1.2.1 Concurrency Rules
#
# Route.version (used by three of these rules) advances only on the write
# endpoints named in this section; the derived recomputation of a route's
# reserved/available exposure by a freeze or hedge mutation does not advance it.
# Filter applied: a second STRICTLY SEQUENTIAL request that observes a state
# field the first request changed is a state precondition, not a race — those
# live in §1.2/§1.4 and are NOT repeated here. Only CREATE-with-supersede
# shapes survive, and each is resolved by OCC on the parent's `version`.
# =============================================================================
concurrency_rules:

  - rule_id: freeze-create-stale-itinerary
    parent_entity: Itinerary
    write_endpoint: "POST /fare/itineraries/{itinerary_id}/price-freezes"
    occ_field: "expected_itinerary_version"
    description: |
      Creating a PriceFreeze against an Itinerary whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a freeze manifest was just created (which legitimately supersedes
      the itinerary's remaining guarantee exposure) and the current writer's view
      of the itinerary is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: watch-create-stale-itinerary
    parent_entity: Itinerary
    write_endpoint: "POST /fare/itineraries/{itinerary_id}/watch-subscription"
    occ_field: "expected_itinerary_version"
    description: |
      Arming a WatchSubscription against an Itinerary whose version has
      advanced since the client last observed it is rejected. The itinerary's
      observation-derived fields are recomputed by every appended
      PriceObservation, so a watch armed on a stale itinerary view would
      evaluate its first notification against a superseded fare basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hedge-create-stale-route
    parent_entity: Route
    write_endpoint: "POST /fare/hedging-positions"
    occ_field: "expected_route_version"
    description: |
      Opening a HedgingPosition against a Route whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another position was just opened on the same route and coverage
      date (which legitimately supersedes the pool's headroom) and the current
      writer's view of the route's hedging book is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: route-posture-stale-read
    parent_entity: Route
    write_endpoint: "POST /fare/routes/{route_id}/posture-transitions"
    occ_field: "expected_route_version"
    description: |
      Requesting a postural transition on a Route whose version has advanced
      since the client last observed it is rejected. Postural state is
      re-derived by every freeze mutation that changes the regional pool, so a
      transition requested against a stale posture reading would be applied on
      top of a superseded aggregate.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Rounding convention (applies to every rule below unless a rule states its own
# precision): 2 decimal places, round_half_up. Rates named in `constants:` are
# treated as exact decimals; only values that are WRITTEN to an entity field are
# rounded. deposit_integrity_flag is NEVER rounded — it is a strict comparison
# of two money amounts.
# =============================================================================
calculations:

  # --- A ---------------------------------------------------------------------
  - name: guarantee_claim_settlement
    trigger: "POST /fare/claims (filing), POST /fare/price-freezes/{freeze_id}/claims, POST /fare/claims/{claim_id}/approvals, POST /fare/claims/{claim_id}/settlements, POST /fare/claims/{claim_id}/reconsiderations"
    algorithm: forward_looking
    formula: |
      active_route_base_fare_cents =
        round_half_up(route.base_fare_cents x route.peak_day_demand_multiplier)
        # peak_day_demand_multiplier is the SURGE posture multiplier read off the
        # route's demand curve state; it is 1.0 while posture == ACTIVE.

      overshoot_cents = min( max(0, market_price_cents - active_route_base_fare_cents),
                             freeze.cap_cents )

      capped_impact_cents = round_half_up(overshoot_cents x PRODUCT_UPLIFT)
                            # PRODUCT_UPLIFT = 1.2

      guaranteed_ceiling_test_cents =
        max( insurance_tier_ceiling(freeze.manifest_fare_cents),
             insurance_tier_ceiling(freeze.cap_cents) )

      payout_cents = min( capped_impact_cents,
                          guaranteed_ceiling_test_cents )
        # the product absorbs the uplifted cap; the traveler's own overshoot is not
        # re-paid, so payout tracks capped_impact until the guarantee ceiling binds

      discount_share = round_half_up_to_3dp(route.disruption_severity_index
                                            x route.default_disruption_probability)

      transaction_value_pre_cents =
        round_half_up( 2 x freeze.manifest_fare_cents
                       - max(0, market_price_cents - freeze.manifest_fare_cents)
                         x discount_share )

      transaction_value_final_cents =
        round_half_up( 2 x freeze.manifest_fare_cents
                       - max(0, arrival_fare_cents - freeze.manifest_fare_cents)
                         x discount_share )
        # both are left-continuous: the transaction value is exactly 2 x manifest
        # for every price at or below the manifest

      transaction_value_cents = (claim_status == SETTLED_WITH_PURCHASE)
                                ? transaction_value_final_cents
                                : transaction_value_pre_cents

      conformity test: payout_cents == capped_impact_cents
    input_set: >
      The single GuaranteeClaim under evaluation, its parent PriceFreeze, and the itinerary's most
      recent PriceObservation at or before the evaluation instant (arrival_fare_cents). Claims whose
      parent freeze is not in FROZEN or CLAIM_PENDING are excluded from evaluation.
    constants:
      PRODUCT_UPLIFT: 1.2
      RATE_PRECISION_DP: 3
    precision: "2 decimal places, round_half_up; the discount rate is rounded to 3 decimal places BEFORE it is scaled"
    variants:
      - name: filed_against_market_price
        when: "claim_status ∈ {FILED, UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN}"
        difference: >
          Uses market_price_cents, i.e. the price the traveler is currently able to purchase at, so the
          transaction value is a forward-looking quote of the claim's worth if settled today.
      - name: settled_against_arrival_fare
        when: "claim_status == SETTLED_WITH_PURCHASE"
        difference: >
          Uses the arrival observation's fare, i.e. the price actually transacted, so the show-up
          portion is dropped. For an identical itinerary these diverge whenever the arrival fare
          differs from the market price at filing: manifest 8900, discount_share 0.036,
          market_price_cents 16500 -> transaction_value_pre_cents = 17800 - round_half_up(7600 x 0.036)
          = 17526.40; arrival_fare_cents 14000 -> transaction_value_final_cents = 17800 -
          round_half_up(5100 x 0.036) = 17616.40.

  # --- B ---------------------------------------------------------------------
  - name: guarantee_hedge_rebalance
    trigger: "open_price_freeze, POST /fare/price-freezes/{freeze_id}/activations, POST /fare/price-observations, and every Route postural re-derivation"
    algorithm: threshold
    formula: |
      IF the freeze's manifest is MIGRATED (manifest_fare_cents was pinned before the
      re-pin was introduced):
        active_base = freeze.manifest_fare_cents
      ELSE:
        active_base = active route base fare at the evaluation instant

      # arrival_fare_cents is the itinerary's latest observation at or before the
      # evaluation instant; when the itinerary has no observation at all, the
      # arrival is undefined and the freeze's capped_impact_cents is 0.
      overshoot_cents = min( max(0, arrival_fare_cents - active_base),
                             freeze.cap_cents )
      capped_impact_cents = round_half_up(overshoot_cents x PRODUCT_UPLIFT)

      exposure_cents  = min( overshoot_cents, capped_impact_cents )
        # evaluated with the FREEZE-TIME base fare and the freeze-time arrival
        # observation, then NOT re-derived
      hedged_exposure_cents = min( exposure_cents,
                                   round_half_up(exposure_cents x route.hedge_ratio_pct) )

      hs = hedged share rate = hedged_exposure_cents / exposure_cents   (0 when exposure_cents == 0)
      suspended_under_cap = (covering freeze exists) AND (hs < HEDGE_SUSPEND_THRESHOLD)

      guaranteed_ceiling_cents = max( insurance_tier_ceiling(freeze.manifest_fare_cents),
                                      insurance_tier_ceiling(freeze.cap_cents) )
      unhedged_exposure_cents = min(exposure_cents, guaranteed_ceiling_cents)
                                - hedged_exposure_cents
    input_set: >
      Every PriceFreeze with status in {DRAFT, HELD, FROZEN, CLAIM_PENDING} on the rebalanced route,
      plus that route's HedgingPosition rows and the region's other routes. Freezes in
      EXPIRED/CANCELLED/CONVERTED and claims in REJECTED/SETTLED_WITH_PURCHASE release their
      reservation and are excluded.
    constants:
      PRODUCT_UPLIFT: 1.2
      HEDGE_SUSPEND_THRESHOLD: 0.50
      POOL_REGION_CAP_PCT: 0.004
    precision: "2 decimal places, round_half_up"
    variants:
      - name: pending_reservation
        when: "freeze.status ∈ {DRAFT, HELD}"
        difference: >
          Sizes hedged/unhedged exposure from the freeze's own capped_impact_cents, which is 0 for a
          DRAFT or HELD freeze on an itinerary with no observation, and is the freeze-time
          overshoot for one that already has an observation history. A pending freeze therefore
          reserves nothing until the itinerary's feed reaches it, and the reservation is then
          monotone upward as later observations arrive.
      - name: active_reservation
        when: "freeze.status ∈ {FROZEN, CLAIM_PENDING, CLAIMED}"
        difference: >
          Re-derives the whole chain against the live arrival observation, which can only move the
          reservation UP (re-derivation is monotone for the reserved amount, and an observation that
          pushes reserved exposure past the route ceiling is reported as a negative
          available_exposure_cents rather than clamped). For the same route and freeze this is the
          variant a claim's payout is checked against.

  # --- C ---------------------------------------------------------------------
  - name: protection_pricing
    trigger: "POST /fare/protections, POST /fare/protections/{protection_id}/quotes, POST /fare/protections/{protection_id}/activations"
    algorithm: tiered_pricing
    formula: |
      declared = min(max(cancellation_disruption_probability, PROB_FLOOR), PROB_CEIL)
                 # PROB_FLOOR = 0.01, PROB_CEIL = 0.95

      IF a covering freeze exists (freeze.status ∈ {DRAFT, HELD, FROZEN, CLAIM_PENDING}):
        disruption_probability = freeze hedged share rate        # the cap-transfer variant
      ELSE:
        disruption_probability = declared
      minimum_disruption_met = (disruption_probability >= route.cancel_minimum_disruption)

      bonus_days_total =
        member of a freeze carrying the guarantee ? 0
        : tier(band) where band = effective disruption band of declared
            band < 0.05  -> 0 ;  0.05 <= band < 0.10 -> 1 ;  band >= 0.10 -> 2

      disruption_fare_cents = itinerary.each_day_disruption_fare_cents

      quote_probable_loss_cents =
        round_half_up( max( disruption_probability x disruption_fare_cents,
                            route.protection_floor_rate x disruption_fare_cents ) )

      scale = (product_type == CANCELLATION) ? route.protection_base_rate : CHANGE_PRODUCT_RATE
              # CHANGE_PRODUCT_RATE = 0.35
      premium_cents = round_half_up( quote_probable_loss_cents x scale )
        # the floor lives in quote_probable_loss_cents, so a member with a low
        # hedged share rate pays strictly less than a standalone buyer
    input_set: >
      The ProtectionProduct under quote, its itinerary, the itinerary's route, and — for the
      cap-transfer variant — the covering PriceFreeze's hedged/unhedged exposure fields as of the
      quote instant.
    constants:
      PROB_FLOOR: 0.01
      PROB_CEIL: 0.95
      CHANGE_PRODUCT_RATE: 0.35
      BAND_SPLIT_PROBABILITY: 0.05
      BAND_STANDARD_PROBABILITY: 0.10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: member_guarantee_pricing
        when: "The itinerary carries a PriceFreeze in DRAFT/HELD/FROZEN/CLAIM_PENDING"
        difference: >
          The disruption probability is replaced by the freeze's hedged share rate, so a member whose
          hedge ratio is high pays a materially lower premium on the SAME itinerary and the SAME
          client-declared probability. Bonus days are zero for these members: the guarantee, not
          bonus days, is the entitlement.
      - name: standalone_protection_pricing
        when: "No covering freeze exists"
        difference: >
          The client-declared probability (clamped into [0.01, 0.95]) is used and the product carries
          0, 1 or 2 bonus days. For the identical itinerary the two variants produce different
          premium_cents whenever the hedged share rate differs from the clamped declared probability:
          on a route whose each_day_disruption_fare_cents is 1172, a declared 0.25 yields
          premium_cents = 73.25 while a covering freeze with a hedged share rate of 0.60 yields
          175.80, and a declared 0.70 inverts the ordering to 205.10.

  # --- D ---------------------------------------------------------------------
  - name: protect_change_redemption
    trigger: "POST /fare/protections/{protection_id}/cancellations, POST /fare/change-events/{change_event_id}/settlements, POST /fare/protections/{protection_id}/reinstatements"
    algorithm: chronological
    formula: |
      duration_metric(days) =
          days <= 0  -> 0
          days == 1  -> 1
          days == 2  -> 2
          days == 3  -> 3
          days  > 3  -> 3 + ceil((days - 3) / 2)     # LINEAR AFTER THREE, NOT LINEAR-DECAYING

      redemption_price = itinerary.each_day_disruption_fare_cents   # FROZEN at redemption

      CANCELLATION consumption (single lump, evaluated once):
        redemption_price = product.premium_cents
        redeemed_value_cents = min(product.bonus_days_total,
                                   ceil(redemption_price / disruption_fare_cents))
        bonus_days_remaining = product.bonus_days_total - redeemed_value_cents

      CHANGE consumption (per settled event, accumulated):
        change_event.disruption_days = duration_metric(change_event.day_shift)
        redeemed_value_cents += change_event.disruption_days
        bonus_days_remaining = bonus_days_total - redeemed_value_cents
    input_set: >
      All ChangeEvent rows whose status == SETTLED for the product (processed in ascending
      change_event.created_at order, ties broken by ascending ChangeEvent.id only as a last resort
      after created_at), plus the product's single cancellation consumption if any. Events in OPEN,
      OPTION_SELECTED, HELD, CANCELLED are excluded.
    constants:
      DURATION_FREE_DAYS: 3
      DURATION_LINEAR_DIVISOR: 2
    precision: "whole days, integer arithmetic; no rounding is applied to the interrupted travel fare"
    variants:
      - name: duration_metric_change
        when: "The redemption is a rebooking consumed by a ChangeEvent"
        difference: >
          Counts whole days of departure-date shift, is capped by the product's bonus_days_total, and
          is compared against a day count. The disruption calendar is the ONLY input.
      - name: rate_metric_cancel
        when: "The redemption is a protected cancellation"
        difference: >
          Counts ceil(premium / disruption fare) — a count of FLIGHTS-AT-FARE, not a calendar
          distance. For a product with bonus_days_total 2 and premium 825 whose disruption fare is
          114, the cancel variant consumes ceil(825/114) = 8 days and is capped to 2, while the change
          variant for the same itinerary consumes duration_metric(day_shift) days. The two variants
          are not comparable unit-for-unit; the scaffold forbids composing them.

  # --- E ---------------------------------------------------------------------
  - name: cost_of_waiting_evaluation
    trigger: "POST /fare/watch-subscriptions/{watch_id}/notifications, POST /_clock/advance, POST /fare/watch-subscriptions/{watch_id}/confirmations"
    algorithm: threshold
    formula: |
      latest_fare = itinerary.last_observed_fare_cents        # 0 when nothing has been observed
      expectation = itinerary.demand_curve_price_cents          # 0 when the curve is unpublished

      IF itinerary.travel_status == BOOKED:   return WATCH
      IF itinerary.travel_status == WATCHING: return NO_ACTION
      IF current_utc >= itinerary.booking_hold_expires_at (non-null):  return NOTIFIED

      risk_gap_cents = abs(latest_fare - expectation)
      primary_swap_fare_cents = itinerary.fare_tier_ceiling_cents   # NOT latest_fare

      IF primary_swap_fare_cents < latest_fare:      recommendation = BUY_NOW
      ELSE IF primary_swap_fare_cents > latest_fare: recommendation = WAIT
      ELSE IF latest_fare > expectation:             recommendation = BUY_NOW
      ELSE:                                          recommendation = HOLD

      cooldown rule:
        IF watch.notification_status ∈ {NOTIFIED, WAIT}:
          IF current_utc <= watch.cooldown_until:  cooldown_suppressed = true; nothing is delivered
          ELSE:                                     cooldown_suppressed = false; the recommendation is delivered
        ELSE:
          # ARMED, ARMED_BUY_NOW and BUY_NOW watches have NO cooldown; the first
          # notification of a fresh watch is never suppressed.
          cooldown_suppressed = false; the recommendation is delivered

      escape clause: a system-fired BUY_NOW is emitted only when the route posture moved to
      RESTRICTED or CLOSED and the itinerary is still PLANNED or WATCHING.
    input_set: >
      The single WatchSubscription under evaluation plus its itinerary's latest observation, latest
      published demand curve and the route's current posture. Notifications for CONFIRMED and EXPIRED
      watches are excluded.
    constants:
      COOLDOWN_HOURS: 6
      BUY_NOW_WINDOW_HOURS: 24
    precision: "2 decimal places, round_half_up; the cooldown window is HALF-OPEN — a clock reading exactly equal to cooldown_until is suppressed"
    variants:
      - name: primary_swap
        when: "The route has at least two live observations whose tiers differ (the swap surface)"
        difference: >
          The binary decision keys off the itinerary fare TIER CEILING rather than the current fare,
          so a fare that rose within its own tier still reads WAIT. For the same itinerary the
          secondary variant reads BUY_NOW.
      - name: secondary_swap
        when: "The primary swap leaves the two prices equal (tipped posture)"
        difference: >
          Falls through to a comparison of the latest fare against the demand-curve expectation, so
          an identical price pair yields HOLD there and BUY_NOW here depending on the curve gap.

  # --- F ---------------------------------------------------------------------
  - name: deposit_attribution_accrual
    trigger: "POST /_clock/advance (daily), POST /fare/price-freezes/{freeze_id}/expirations, POST /fare/price-freezes/{freeze_id}/conversions"
    algorithm: aggregation
    formula: |
      membership_days_elapsed = trunc( current_utc - freeze.freeze_date )   # TRUNCATE, not round
      deposit_attributed_cents = round_half_up( freeze.deposit_cents x membership_days_elapsed
                                                                  / FREEZE_WINDOW_DAYS )   # 14

      freeze_share =
        (( FREEZE_WINDOW_DAYS - NUMBER_OF_MIGRATED_MEMBERSHEADS )
          / NUMBER_OF_MIGRATED_MEMBERSHEADS ) / FREEZE_WINDOW_DAYS

      pattern_day_count =
        round_half_up( |{ d : d is an expired-freeze day for this freeze AND d within the freeze's
                           14-day window }| x freeze_share )   # days, 0..8

      each accrual moves the credited delta OUT of custody_held_cents and into
      deposit_attributed_cents, so custody_held_cents always holds the
      unattributed remainder of the deposit

      reconciliation verdict at expiry/conversion:
        pattern_day_count > 0 AND deposit_attributed_cents < pattern_day_count
          -> INTEGRITY_UNDER_RECOGNIZED
        pattern_day_count == 0 AND deposit_attributed_cents > 0
          -> INTEGRITY_OVER_RECOGNIZED
        else -> INTEGRITY_CONSISTENT
    input_set: >
      The PriceFreeze under attribution and the set of membership days already accounted for it. The
      frozen entitlement window is half-open [freeze_date, freeze_date + 14 days) and a day is
      attributed only while freeze.status acknowledges pricing; a postural freeze (route RESTRICTED)
      stops the accrual without rolling it back.
    constants:
      FREEZE_WINDOW_DAYS: 14
      PATTERN_WINDOW_DAYS: 14
    precision: "cents, round_half_up; membership_days_elapsed is TRUNCATED so a 10-day 23-hour elapsed span credits 10 days"
    variants:
      - name: cnt_consumer
        when: "The freeze's arrival observation chain exists and the entitlement day is consumed against the frozen manifest"
        difference: >
          Compared against a day count (pattern_day_count) because the consumer is a membership day.
          A 10-day elapsed span with an 8900-cent deposit credits 2543 cents and is compared against
          3 pattern days, not against money.
      - name: txn_consumer
        when: "The freeze converts into a purchase and the entitlement day is consumed against the realized transaction value"
        difference: >
          Compared against cents (custody_return_pending_cents) because the consumer is a dollar
          settlement. The SAME 8900-cent deposit yields a 2543-cent credit here too, but the verdict
          is now INTEGRITY_OVER_RECOGNIZED whenever the realized transaction value absorbs the
          credit without a matching day, which is the opposite sign to the cnt_consumer verdict for
          identical integers.

  # --- G ---------------------------------------------------------------------
  - name: product_continuum_rating
    trigger: "POST /fare/protections/{protection_id}/activations, POST /fare/price-freezes/{freeze_id}/activations, POST /fare/claims/{claim_id}/filings"
    algorithm: weighted_scoring
    formula: |
      depth_ratio = round_half_up_to_4dp( freeze.unhedged_exposure_cents
                                          / freeze.capped_impact_cents )   # 0 when denominator is 0
      continuum_absorbed_cents =
        round_half_up( round_half_up(overshoot_cents x 1.2) / 1.25 )
        # LOSSLESS for a product whose depth_ratio <= 1, i.e. whenever the guaranteed ceiling
        # covers the capped impact the continuum absorbs the same cents as the bounded product.
    input_set: >
      The ProtectionProduct or GuaranteeClaim under rating, its covering PriceFreeze, and the regional
      pool the freeze's route belongs to.
    constants:
      CONTINUUM_DIVISOR: 1.25
      DEPTH_RATIO_MIN: 0.0
      DEPTH_RATIO_MAX: 1.0
    precision: "4 decimal places, round_half_up for depth_ratio; 2 decimal places, round_half_up for continuum_absorbed_cents"
    variants:
      - name: bounded_product
        when: "depth_ratio <= 1 (the guarantee ceiling covers the capped impact)"
        difference: >
          The continuum term is bounded by the product ceiling and is lossless: for overshoot 12000
          the capped impact is 14400 and the continuum absorbs 11520 cents, exactly 14400 / 1.25.
      - name: unbounded_product
        when: "depth_ratio > 1 (hedged scale exceeds the safe cap)"
        difference: >
          The continuum term is floored at continuum_absorbed_cents >= capped_impact_cents / 1.25 and
          grows with the unhedged share, so an identical overshoot produces a strictly larger
          absorption than the bounded variant. The two variants therefore differ by a positive
          function of depth_ratio for identical overshoot_cents.

  # --- H ---------------------------------------------------------------------
  - name: protect_change_schedule
    trigger: "POST /fare/rebooking-options (option resequencing), POST /_clock/advance (hold lapse), POST /fare/change-events/{change_event_id}/settlements"
    algorithm: chronological
    formula: |
      # Step 1 — deterministic option sequence, computed BEFORE anything else:
      sort key = ( departure_date ASC, created_at ASC, option_fare_cents ASC )
      sequence_index = 1-based position in that sorted list.
      # The tie-break chain is TOTAL: a server-minted random id is NEVER consulted.

      # Step 2 — the display discount (this is the trap):
      displayed_discount_rate = round_half_up_to_3dp(disruption_probability
                                                    x itinerary.disruption_severity_index
                                                    x days_until_departure / LEAD_TIME_NORMALIZER)
      display_price_cents = round_half_up( option_fare_cents x displayed_discount_rate )
      display_sequence = sort by display_price_cents ASC, created_at ASC
      # the discount rate COLLAPSES as the departure date approaches, so a
      # near-term option displays an almost-zero price and sorts ahead of a
      # cheaper but far-off option

      # Step 3 — settled billing uses the undiscounted option fare:
      change_fee_cents = round_half_up( option.option_fare_cents x CHANGE_FEE_RATE )
      billed_option_price_cents = option.option_fare_cents        # NOT display_price_cents
    input_set: >
      Every RebookingOption belonging to the same ChangeEvent, excluding those whose status is
      EXPIRED or SUPERSEDED at sequencing time. Hold-lapse processing walks the option list in
      ascending sequence_index order.
    constants:
      CHANGE_FEE_RATE: 0.10
      DISCOUNT_ROUNDING_DP: 3
      LEAD_TIME_NORMALIZER: 30
    precision: "2 decimal places, round_half_up; the discount rate is rounded to 3 decimal places before it is applied"
    variants:
      - name: display_schedule
        when: "The option list is presented to the traveler"
        difference: >
          Ordering and the presented price both use the lead-time-scaled discounted figures. For a
          route with disruption_probability 0.70 and severity 0.1429 (rate 0.100 at full lead time),
          an option priced 12900 departing in 30 days displays 1290.00 while an option priced 13200
          departing in 3 days displays 132.00, so the display order is the opposite of the raw-fare
          order even though the raw fares differ by only 300 cents.
      - name: raw_schedule
        when: "The change is settled and billed"
        difference: >
          Ordering (for lapse processing) and the billed amount both use the raw option fare; the
          discount is NOT applied. For the option set above the lapse walk therefore visits the 12900
          option first while the traveler was shown the 13200 one first, and the billed fare for the
          option the traveler clicked is 13200 with change_fee_cents 1320.00, not the 132.00 the
          displayed schedule implied.

  # --- I ---------------------------------------------------------------------
  - name: insurance_tier_ceiling
    trigger: "DemandCurve publication, PriceObservation append, PriceFreeze activation, GuaranteeClaim filing and settlement"
    algorithm: tiered_pricing
    formula: |
      insurance_tier_ceiling(amount_cents) =
          amount_cents <  20000  -> 30000
          amount_cents <  50000  -> 50000
          amount_cents < 100000  -> 100000
          amount_cents < 200000  -> 200000
          else                   -> 300000
    input_set: "Any money amount; the function is order-independent and stateless."
    constants:
      TIER_1_BOUNDARY_CENTS: 20000
      TIER_2_BOUNDARY_CENTS: 50000
      TIER_3_BOUNDARY_CENTS: 100000
      TIER_4_BOUNDARY_CENTS: 200000
    precision: "integer cents; boundary comparisons are STRICT <, so an amount of exactly 200000 cents lands in the 200000..299999 tier's ceiling of 200000, not 300000"
    variants:
      - name: manifest_priced
        when: "The ceiling is being taken of a frozen manifest fare"
        difference: >
          Reads the fare at the freeze's pinning instant.
      - name: cap_priced
        when: "The ceiling is being taken of the freeze's absorption cap"
        difference: >
          Reads round_half_up(1.4 x manifest) instead. Because the cap is 1.4x the manifest, the two
          can land on either side of a tier boundary: manifest 14000 -> cap 19600, both in the 30000
          tier; manifest 15000 -> cap 21000, manifest in the 30000 tier but cap in the 50000 tier.
          The guaranteed ceiling is the MAXIMUM of the two.

  # --- J ---------------------------------------------------------------------
  - name: deposit_forfeiture_rule
    trigger: "POST /fare/price-freezes/{freeze_id}/cancellations, POST /fare/itineraries/{itinerary_id}/cancellations, POST /fare/protections/{protection_id}/cancellations"
    algorithm: threshold
    formula: |
      IF a Payment exists for the itinerary with payment_kind == MEMBERSHIP_2
         AND its status ∈ {CAPTURED, PARTIALLY_REFUNDED}:
           deposit_forfeited_cents = 2 x freeze.deposit_cents
           that payment's refundable_remaining_cents is written to 0 and its status = FORFEITED
      ELSE:
           deposit_forfeited_cents = 0

      An EXEMPT carrier cancellation (one triggered by the request's exempt flag) forfeits
      nothing even when the membership payment exists.
    input_set: >
      The freeze being cancelled, its itinerary, and that itinerary's payments filtered to
      payment_kind MEMBERSHIP_2 with status CAPTURED or PARTIALLY_REFUNDED. RETIRED, FORFEITED
      and REFUNDED membership payments are excluded.
    constants:
      FORFEITURE_MULTIPLIER: 2
    precision: "integer cents; the multiplier is applied to the whole deposit and then not rounded"
    variants:
      - name: bare_cancellation
        when: "The cancellation is requested by the traveler or the operations desk"
        difference: "Forfeiture is charged when the membership payment exists."
      - name: exempt_carrier_cancellation
        when: "The request carries the exempt flag for a carrier-driven cancellation"
        difference: >
          Forfeiture is zero and the membership payment is left untouched, so the same freeze cancelled
          two ways yields 500 and 0 respectively.

  # --- K ---------------------------------------------------------------------
  - name: frozen_fare_settlement
    trigger: "POST /fare/price-freezes/{freeze_id}/conversions, POST /fare/itineraries/{itinerary_id}/bookings"
    algorithm: chronological
    formula: |
      1. order the freeze's deposits by Payment.created_at ASC
      2. apply them against the freeze's attributed and custody buckets in that order:
           credited = deposit_attributed_cents
           custody  = deposit_cents - credited
      3. on conversion:
           custody_return_pending_cents += custody
           custody_held_cents = 0
           deposit_integrity_flag = the verdict of deposit_attribution_accrual
      4. the transaction value realised by the conversion is the claim transaction value
         computed with the arrival fare (calculations.guarantee_claim_settlement)
    input_set: >
      The freeze being converted and every Payment whose freeze_id is that freeze, restricted to
      status CAPTURED or PARTIALLY_REFUNDED and ordered by ascending created_at.
    constants:
      FREEZE_WINDOW_DAYS: 14
    precision: "2 decimal places, round_half_up"
    variants:
      - name: settled_in_cash
        when: "The freeze's custody chain is intact"
        difference: "The unattributed remainder moves to custody_return_pending_cents for payout."
      - name: settled_as_credit
        when: "A redemption credit is exercised against the same itinerary"
        difference: >
          The remainder is applied against the new booking instead of being returned, so the same
          500-cent remainder appears once as a payout liability and once as a fare credit depending on
          the variant, never as both.


# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
#
# Priority is a total order: when a single request violates several rows, the
# LOWEST-numbered row's error_id is the one returned. Priorities 3-6 are
# existence checks resolved left-to-right along the path; 7 is the segregation
# audit; 8-10 are state; 11-14 are fiscal (profile, custody, exposure cap) with
# 13 (regulatory posture) sitting between them by domain rule; 15-19 are
# referential, constraint, disclosure and schema-existence checks.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present, syntactically valid, and X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's roles and, for entity-backed roles, X-User-ID equals the id of the persisted entity it claims to be"
    error_id: ERR_FORBIDDEN_FOR_ACTOR
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "The Route named by route_id (in the path or in the request body) exists"
    error_id: ERR_ROUTE_NOT_FOUND
    http_status: 404
    applies_to: "all /routes/** endpoints; POST /fare/itineraries; POST /fare/price-observations; POST /fare/demand-curves; POST /fare/hedging-positions"

  - priority: 4
    category: existence
    check: "The Itinerary named by itinerary_id exists, and belongs to the route named in the same request"
    error_id: ERR_ITINERARY_NOT_FOUND
    http_status: 404
    applies_to: "all /itineraries/** endpoints; POST /fare/price-observations; POST /fare/protections; POST /fare/price-freezes"

  - priority: 5
    category: existence
    check: "The PriceFreeze named by freeze_id exists"
    error_id: ERR_FREEZE_NOT_FOUND
    http_status: 404
    applies_to: "all /price-freezes/** endpoints; POST /fare/protections/{id}/quotes when a freeze_id is supplied"

  - priority: 6
    category: existence
    check: >
      The named child resource exists: WatchSubscription, ProtectionProduct, GuaranteeClaim, ChangeEvent,
      RebookingOption, Payment, HedgingPosition, DestinationOption or RiskPool named in the path or body
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all action endpoints whose path carries one of those ids"

  - priority: 7
    category: business_safety
    check: >
      Segregation of duties: the acting identity must differ from the claim's filer_user_id, and must
      also differ from its approver_user_id whenever one is recorded; a claim carrying no recorded
      approver never trips this row and is caught by the state check at priority 8 instead
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /fare/claims/{claim_id}/approvals; POST /fare/claims/{claim_id}/settlements; POST /fare/claims/{claim_id}/reviews"

  - priority: 8
    category: state
    check: "The target resource is in a state the requested transition can leave (the `from:` set of the matching §1.2 transition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: state
    check: >
      The itinerary is in a state that admits the operation: travel_status ∈ {PLANNED, WATCHING} for
      activation or arming; travel_status == PLANNED for booking
    error_id: ERR_ITINERARY_NOT_PLANNED
    http_status: 409
    applies_to: "POST /fare/itineraries/{itinerary_id}/bookings; POST /fare/price-freezes/{freeze_id}/activations; POST /fare/protections/{protection_id}/activations"

  - priority: 10
    category: business_temporal
    check: >
      The notification or hold window admits the operation: the watch has not passed expires_at, the
      cooldown has elapsed, or the option hold has not lapsed
    error_id: ERR_NOTIFICATION_SUPPRESSED
    http_status: 409
    applies_to: "POST /fare/watch-subscriptions/{watch_id}/notifications; POST /fare/watch-subscriptions/{watch_id}/confirmations; POST /fare/rebooking-options/{option_id}/acceptances; POST /fare/change-events/{change_event_id}/settlements"

  - priority: 11
    category: business_fiscal
    check: >
      Route risk profile gate: the claim's freeze capped_impact_cents must not exceed the route's
      available_exposure_cents
    error_id: ERR_ROUTE_EXPOSURE_PROFILE
    http_status: 422
    applies_to: "POST /fare/claims/{claim_id}/settlements"

  - priority: 12
    category: business_fiscal
    check: >
      Custody backing gate: settlement requires either insurance_tier_ceiling(market_price_cents) ==
      insurance_tier_ceiling(freeze.cap_cents), or a custody_return_pending_cents balance of at least
      claim.payout_cents
    error_id: ERR_CUSTODY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /fare/claims/{claim_id}/settlements; POST /fare/price-freezes/{freeze_id}/expirations"

  - priority: 13
    category: business_safety
    check: >
      Regulatory posture gate: the route must be in ACTIVE or SURGE; a RESTRICTED or CLOSED route
      admits no new freeze activation, protection activation, hedge mark, or protected itineraries
    error_id: ERR_ROUTE_RESTRICTED
    http_status: 409
    applies_to: "POST /fare/price-freezes/{freeze_id}/activations; POST /fare/protections; POST /fare/protections/{protection_id}/activations; POST /fare/hedging-positions; POST /fare/hedging-positions/{position_id}/marks"

  - priority: 14
    category: business_fiscal
    check: >
      Route exposure cap: the requested freeze's CURRENT capped_impact_cents must not push the route's
      reserved_exposure_cents above route.max_guarantee_exposure_cents (a DRAFT freeze on an
      unobserved itinerary carries 0, so the cap binds on re-activation and filing, not on first
      creation)
    error_id: ERR_GUARANTEE_EXPOSURE_EXCEEDED
    http_status: 422
    applies_to: "POST /fare/itineraries/{itinerary_id}/price-freezes; POST /fare/price-freezes/{freeze_id}/activations"

  - priority: 15
    category: business_referential
    check: >
      Product-type, grouping and membership references cohere: the product type admits the operation,
      the itinerary belongs to the named route, and the option belongs to the named change event
    error_id: ERR_PRODUCT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /fare/protections/{protection_id}/change-events; POST /fare/protections/{protection_id}/cancellations; POST /fare/change-events/{change_event_id}/selections; POST /fare/price-observations"

  - priority: 16
    category: business_constraint
    check: "At most one HedgingPosition may exist per (route_id, coverage_date, hedge_price_cents)"
    error_id: ERR_HEDGE_DUPLICATE_COVERAGE
    http_status: 409
    applies_to: "POST /fare/hedging-positions"

  - priority: 17
    category: business_constraint
    check: "A RebookingOption's sequence_index must be unique within its ChangeEvent"
    error_id: ERR_DUPLICATE_SEQUENCE_INDEX
    http_status: 409
    applies_to: "POST /fare/rebooking-options"

  - priority: 18
    category: business_safety
    check: >
      Ancillary-product disclosure: the named disclosure_version must equal the route's current
      disclosure_version and the request must acknowledge the disclosure
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /fare/protections; POST /fare/price-freezes"

  - priority: 19
    category: business_constraint
    check: >
      Price-field completeness: every price-bearing field required by the request schema is present and
      non-null (a payload that omits a price the endpoint will bill fails here even when all earlier
      checks pass)
    error_id: ERR_PRICE_FIELD_MISSING
    http_status: 422
    applies_to: "POST /fare/claims/{claim_id}/settlements; POST /fare/change-events/{change_event_id}/settlements; POST /fare/protections/{protection_id}/cancellations"

  - priority: 20
    category: business_temporal
    check: "A watch notification must be evaluated before the watched itinerary departs; an itinerary past its departure date cannot be notified"
    error_id: ERR_WATCH_EXPIRED
    http_status: 409
    applies_to: "POST /fare/watch-subscriptions/{watch_id}/notifications"

  - priority: 21
    category: business_constraint
    check: "A watch may only be armed on a route that has at least one published demand curve"
    error_id: ERR_CURVE_UNPUBLISHED
    http_status: 409
    applies_to: "POST /fare/itineraries/{itinerary_id}/watch-subscription"

  - priority: 22
    category: existence
    check: "A booking must leave at least one seat on the route's availability snapshot"
    error_id: ERR_NO_SEATS_LEFT
    http_status: 409
    applies_to: "POST /fare/itineraries/{itinerary_id}/bookings; POST /fare/watch-subscriptions/{watch_id}/confirmations; POST /fare/price-freezes/{freeze_id}/conversions"

  - priority: 23
    category: business_constraint
    check: "A payment that has been retired or forfeited can neither be allocated nor refunded"
    error_id: ERR_PAYMENT_RETIRED
    http_status: 409
    applies_to: "POST /fare/payments/{payment_id}/refunds; POST /fare/payments/{payment_id}/captures"

  - priority: 24
    category: business_constraint
    check: >
      A destination-option bind is refused when the option's fare exceeds the itinerary's listed fare by
      more than the desk's odd-ratio tolerance
    error_id: ERR_DESK_ODD_RATIO
    http_status: 422
    applies_to: "POST /fare/destination-options/{destination_option_id}/selections"

  - priority: 25
    category: business_constraint
    check: >
      A freeze may not be converted or expired while its custody balance and deposit attribution disagree
      (its deposit_integrity_flag is not INTEGRITY_CONSISTENT)
    error_id: ERR_MANIFEST_UNSETTLED
    http_status: 409
    applies_to: "POST /fare/price-freezes/{freeze_id}/conversions; POST /fare/price-freezes/{freeze_id}/expirations"

  - priority: 26
    category: business_temporal
    check: "A claim or reconsideration must be filed within freeze_expires_at + 14 days"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /fare/claims; POST /fare/price-freezes/{freeze_id}/claims; POST /fare/claims/{claim_id}/reconsiderations"


  - priority: 27
    category: business_constraint
    check: "A guarantee claim requires the frozen fare to have risen above the route's live base fare"
    error_id: ERR_NO_OVERSHOOT
    http_status: 422
    applies_to: "POST /fare/claims; POST /fare/price-freezes/{freeze_id}/claims"

  - priority: 28
    category: business_fiscal
    check: "A refund may not take a payment's refundable_remaining_cents below zero"
    error_id: ERR_PAYMENT_OVER_ALLOCATED
    http_status: 422
    applies_to: "POST /fare/payments/{payment_id}/refunds"

  - priority: 29
    category: business_referential
    check: "A price observation's itinerary must belong to the route named in the same request"
    error_id: ERR_ROUTE_ITINERARY_MISMATCH
    http_status: 422
    applies_to: "POST /fare/price-observations"

  - priority: 30
    category: business_constraint
    check: "A change settlement may not consume more bonus days than the product has remaining"
    error_id: ERR_INSUFFICIENT_BONUS_DAYS
    http_status: 422
    applies_to: "POST /fare/change-events/{change_event_id}/settlements"

  - priority: 31
    category: business_temporal
    check: "A claim or reconsideration must be filed within freeze_expires_at + 14 days of the freeze's window closing"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /fare/claims; POST /fare/price-freezes/{freeze_id}/claims; POST /fare/claims/{claim_id}/reconsiderations"

  - priority: 32
    category: business_constraint
    check: "A payment that has been retired or forfeited can neither be allocated nor refunded"
    error_id: ERR_PAYMENT_RETIRED
    http_status: 409
    applies_to: "POST /fare/payments/{payment_id}/refunds; POST /fare/payments/{payment_id}/captures"

  - priority: 33
    category: business_constraint
    check: "A fare watch may only be armed on a route that has at least one published demand curve"
    error_id: ERR_CURVE_UNPUBLISHED
    http_status: 409
    applies_to: "POST /fare/itineraries/{itinerary_id}/watch-subscription"


  - priority: 34
    category: business_constraint
    check: >
      Malformed payload: a required field is absent, a field carries the wrong type or an invalid enum
      member, an amount is outside its declared range (deposit outside 100..5000 cents, fare below 1
      cent, payment amount above 20000 cents), or a timestamp is not parseable ISO 8601
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that take a body"


# =============================================================================
# Response Envelope (FIXED — emitted verbatim per §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
#
# Path placeholders use `{...}`. Bodies are flat; `input:` lists the exact
# accepted keys (`?` = optional). `output:` names the §1.1 entity carried in
# `data`; `[]` marks a list response.
# =============================================================================
endpoints:

  # ---------------------------- Routes ---------------------------------------
  - method: POST
    path: "/fare/routes"
    description: "Register a route: its band, demand-curve parameters, hedging ratio and exposure ceiling; posture starts ACTIVE"
    roles: [PlatformAdmin]
    code: 201
    input: [origin_airport, destination_airport, flight_number, "travel_class?", region, base_fare_cents, fare_band_cents, "peak_price_day_index?", "seats_left?", "volatility_index?", "hedge_ratio_pct?", "max_guarantee_exposure_cents?", "default_disruption_probability?", "disruption_severity_index?", "protection_base_rate?", "protection_floor_rate?", "cancel_minimum_disruption?", disclosure_headline]
    output: Route
    side_effects:
      - "Initializes war_chest_cents, reserved_exposure_cents and available_exposure_cents to 0, open_freeze_count to 0, curve_published to false and highest_curve_price_cents to 0"
      - "initial posture = ACTIVE, posture_reason_code = \"\", peak_day_demand_multiplier = 1.0"

  - method: GET
    path: "/fare/routes"
    description: "List routes with optional region, posture and origin_airport filters"
    roles: [Traveler, OpsAgent, RiskAnalyst, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["region?", "posture?", "origin_airport?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: GET
    path: "/fare/routes/{route_id}"
    description: "Retrieve a route, including its derived exposure fields and current posture"
    roles: [Traveler, OpsAgent, RiskAnalyst, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: PATCH
    path: "/fare/routes/{route_id}"
    description: "Update a route's live commercial parameters; base_fare_cents, fare_band_cents and hedge_ratio_pct are the permitted keys"
    roles: [PlatformAdmin]
    code: 200
    input: ["base_fare_cents?", "fare_band_cents?", "hedge_ratio_pct?", "max_guarantee_exposure_cents?", "disclosure_headline?"]
    output: Route
    side_effects:
      - "Bumping disclosure_headline increments disclosure_version by 1"
      - "guarantee_hedge_rebalance re-derives hedged/unhedged exposure for every open freeze on the route"
      - "increments Route.version by 1"

  - method: POST
    path: "/fare/routes/{route_id}/posture-transitions"
    description: "Move a route between the postures that an operator controls; the derived SURGE -> RESTRICTED auto-transition is not reachable here"
    roles: [PlatformAdmin]
    code: 200
    input: [to_posture, posture_reason_code, expected_route_version]
    output: Route
    side_effects:
      - "Applies the matching Route transition (ACTIVE->SURGE, ACTIVE->RESTRICTED, SURGE->RESTRICTED, SURGE->ACTIVE, ACTIVE/SURGE/RESTRICTED->CLOSED)"
      - "Re-derives the region's postural aggregate and regional postural aggregate in ascending Route.created_at order"
      - "increments Route.version by 1"

  # -------------------------- Itineraries ------------------------------------
  - method: POST
    path: "/fare/itineraries"
    description: "Create an itinerary on a route for a departure date"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [route_id, departure_date, traveler_user_id]
    output: Itinerary
    side_effects:
      - "travel_status = PLANNED; booking_date = current_utc; listed_fare_cents, last_observed_fare_cents, observed_fares_cents, demand_curve_price_cents, each_day_disruption_fare_cents and fare_tier_ceiling_cents all start empty/zero"
      - "if the route already has a published curve, the curve-derived fields are populated immediately from the latest curve"

  - method: GET
    path: "/fare/itineraries"
    description: "List itineraries filtered by route, traveler or travel status"
    roles: [Traveler, OpsAgent, RiskAnalyst, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["route_id?", "traveler_user_id?", "travel_status?", "limit?", "offset?"]
    output: Itinerary[]
    side_effects: []

  - method: GET
    path: "/fare/itineraries/{itinerary_id}"
    description: "Retrieve an itinerary with its observation-derived fields"
    roles: [Traveler, OpsAgent, RiskAnalyst, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: Itinerary
    side_effects: []

  - method: POST
    path: "/fare/itineraries/{itinerary_id}/watch-subscription"
    description: "Arm a fare watch on an itinerary; refuses on an unpublished curve"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [expected_itinerary_version]
    output: Itinerary
    side_effects:
      - "Creates a WatchSubscription in ARMED with armed_at = current_utc and expires_at = itinerary.departure_date"
      - "itinerary.travel_status = WATCHING; itinerary.watch_armed = true"
      - "increments Itinerary.version by 1"

  - method: POST
    path: "/fare/itineraries/{itinerary_id}/bookings"
    description: "Book the itinerary at the current listed fare"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["expected_itinerary_version?"]
    output: Itinerary
    side_effects:
      - "travel_status = BOOKED; listed_fare_cents = route.base_fare_cents; route.seats_left -= 1"
      - "Any ARMED/NOTIFIED/WAIT watch on the itinerary -> CONFIRMED"
      - "deposit_attribution_accrual converts every FROZEN freeze on the itinerary and releases their reserved exposure"
      - "increments Itinerary.version by 1"

  - method: POST
    path: "/fare/itineraries/{itinerary_id}/cancellations"
    description: "Cancel the itinerary and unwind its watches and freezes"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["cancel_reason?"]
    output: Itinerary
    side_effects:
      - "travel_status = CANCELLED; every watch -> EXPIRED; every DRAFT/HELD/FROZEN freeze -> CANCELLED with guarantee_hedge_rebalance deposit_forfeiture_rule setting deposit_forfeited_cents"
      - "guarantee_hedge_rebalance releases the cancelled freezes' reservation"
      - "increments Itinerary.version by 1"

  # ------------------------- Price observations ------------------------------
  - method: POST
    path: "/fare/price-observations"
    description: "Append a live fare observation to an itinerary; re-derives the itinerary's observation fields and every open freeze's exposure"
    roles: [OpsAgent]
    code: 201
    input: [route_id, itinerary_id, fare_cents, seats_left]
    output: PriceObservation
    side_effects:
      - "Appends fare_cents to itinerary.observed_fares_cents; sets listed_fare_cents and last_observed_fare_cents"
      - "guarantee_hedge_rebalance recomputes overshoot_cents, capped_impact_cents, exposure_cents, hedged_exposure_cents and unhedged_exposure_cents on every FROZEN/CLAIM_PENDING freeze of the itinerary"
      - "increments Itinerary.version by 1"

  - method: GET
    path: "/fare/price-observations"
    description: "List price observations by route or itinerary, ordered by observed_at"
    roles: [OpsAgent, RiskAnalyst, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["route_id?", "itinerary_id?", "limit?", "offset?"]
    output: PriceObservation[]
    side_effects: []

  - method: GET
    path: "/fare/price-observations/{observation_id}"
    description: "Retrieve one price observation"
    roles: [OpsAgent, RiskAnalyst, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: PriceObservation
    side_effects: []

  # --------------------------- Demand curves ---------------------------------
  - method: POST
    path: "/fare/demand-curves"
    description: "Publish (or supersede) the day-indexed fare and seat forecast for a route and date"
    roles: [OpsAgent]
    code: 201
    input: [route_id, price_date, each_day_prices_cents, seats_left_at_each_day]
    output: DemandCurve
    side_effects:
      - "Supersedes an existing curve for the same route and price_date in place"
      - "Sets route.curve_published = true and recomputes route.highest_curve_price_cents"
      - "Re-derives demand_curve_price_cents, each_day_disruption_fare_cents and fare_tier_ceiling_cents on every itinerary of the route"

  - method: GET
    path: "/fare/demand-curves"
    description: "List published demand curves for a route"
    roles: [OpsAgent, RiskAnalyst, PlatformAdmin]
    code: 200
    input: ["route_id?", "limit?", "offset?"]
    output: DemandCurve[]
    side_effects: []

  - method: GET
    path: "/fare/demand-curves/{curve_id}"
    description: "Retrieve one demand curve"
    roles: [OpsAgent, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: DemandCurve
    side_effects: []

  # ------------------------------ Watches ------------------------------------
  - method: GET
    path: "/fare/watch-subscriptions"
    description: "List watch subscriptions by itinerary or notification status"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["itinerary_id?", "notification_status?", "limit?", "offset?"]
    output: WatchSubscription[]
    side_effects: []

  - method: GET
    path: "/fare/watch-subscriptions/{watch_id}"
    description: "Retrieve a watch subscription with its cooldown and warranty state"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: WatchSubscription
    side_effects: []

  - method: POST
    path: "/fare/watch-subscriptions/{watch_id}/notifications"
    description: "Evaluate the watch and deliver, suppress or hold its recommendation"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["request_source?"]
    output: WatchSubscription
    side_effects:
      - "cost_of_waiting_evaluation runs; BUY_NOW sets itinerary.booking_hold_expires_at = current_utc + 24 hours"
      - "cooldown_suppressed is set when the clock reads at or before cooldown_until"
      - "increments WatchSubscription.version by 1"

  - method: POST
    path: "/fare/watch-subscriptions/{watch_id}/confirmations"
    description: "Confirm a BUY_NOW notification, exercising the 24-hour warranty and booking the itinerary"
    roles: [Traveler]
    code: 200
    input: ["acknowledge_warranty?"]
    output: WatchSubscription
    side_effects:
      - "cost_of_waiting_evaluation closes the warranty: locked_fare_cents = min(BUY_NOW fare, end-of-window fare)"
      - "Itinerary -> BOOKED; every DRAFT/HELD/FROZEN freeze on it -> CONVERTED"
      - "increments WatchSubscription.version by 1"

  # --------------------------- Test controls ---------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z; it never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical clock used by every deadline, expiry and window rule"]

  - method: POST
    path: "/_clock/advance"
    description: "Advance the logical clock, running the scheduled sweep: freeze expiries, watch expiries, hold lapses, hedge lapses and a full postural re-derivation"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Expires every FROZEN freeze past freeze_expires_at, every watch past expires_at, every held RebookingOption past its hold and every OPEN HedgingPosition past its coverage date"
      - "Re-derives the demand-curve day index, every route's postural aggregate, every itinerary's curve fields and every freeze's exposure chain"

  - method: POST
    path: "/fare/hedge-regression-sweeps"
    description: "Run the regional hedge-regression absorption sweep for a pool"
    roles: [PlatformAdmin, RiskAnalyst]
    code: 200
    input: [pool_id]
    output: RiskPool
    side_effects:
      - "guarantee_hedge_rebalance credits Route.war_chest_cents for regressed marks and advances the pool to ABSORBING"
      - "the Route postural re-derivation re-evaluates the region for SURGE and RESTRICTED"

  # --------------------------- Price freezes ---------------------------------
  - method: POST
    path: "/fare/itineraries/{itinerary_id}/price-freezes"
    description: "Open a freeze manifest against the route's live base fare, reserving its exposure for the itinerary"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [deposit_cents, disclosure_version, disclosure_acknowledged, expected_itinerary_version]
    output: PriceFreeze
    side_effects:
      - "Pins manifest_fare_cents from route.base_fare_cents and cap_cents = round_half_up(1.4 x manifest_fare_cents); fills firm/cap/guaranteed tier ceilings"
      - "guarantee_hedge_rebalance sizes hedged/unhedged/reserved exposure in the pending_reservation variant"
      - "itinerary.guarantee_locked = true; itinerary.version incremented"
      - "reserving the manifest's capped impact against route.max_guarantee_exposure_cents"

  - method: POST
    path: "/fare/price-freezes"
    description: "Open a freeze manifest by naming the itinerary in the body"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [itinerary_id, deposit_cents, disclosure_version, disclosure_acknowledged, expected_itinerary_version]
    output: PriceFreeze
    side_effects:
      - "Same as POST /fare/itineraries/{itinerary_id}/price-freezes"

  - method: GET
    path: "/fare/price-freezes"
    description: "List freezes by itinerary, route or status"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: ["itinerary_id?", "route_id?", "status?", "limit?", "offset?"]
    output: PriceFreeze[]
    side_effects: []

  - method: GET
    path: "/fare/price-freezes/{freeze_id}"
    description: "Retrieve a freeze with its exposure chain, custody balances and integrity flag"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: PriceFreeze
    side_effects: []

  - method: GET
    path: "/fare/itineraries/{itinerary_id}/price-freezes"
    description: "List the freezes attached to an itinerary"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: PriceFreeze[]
    side_effects: []

  - method: POST
    path: "/fare/price-freezes/{freeze_id}/activations"
    description: "Re-pin the manifest from the live base fare and place the freeze in flight"
    roles: [Traveler, OpsAgent]
    code: 200
    input: [expected_freeze_version]
    output: PriceFreeze
    side_effects:
      - "manifest_fare_cents and cap_cents re-pinned; freeze_date = current_utc and freeze_expires_at = current_utc + 14 days"
      - "Status DRAFT -> HELD; a second activation places the freeze in FROZEN once the deposit is fully in custody"
      - "guarantee_hedge_rebalance re-sizes the exposure chain; route.reserved_exposure_cents and available_exposure_cents recomputed"

  - method: POST
    path: "/fare/price-freezes/{freeze_id}/expirations"
    description: "Expire a freeze whose window has elapsed and release its custody"
    roles: [OpsAgent, SystemOperator]
    code: 200
    input: ["expected_freeze_version?"]
    output: PriceFreeze
    side_effects:
      - "Status -> EXPIRED; custody_return_pending_cents += custody_held_cents; custody_held_cents = 0"
      - "deposit_attribution_accrual stamps deposit_integrity_flag"
      - "guarantee_hedge_rebalance releases the freeze's reservation and re-derives route.pooled_exposure_cents"

  - method: POST
    path: "/fare/price-freezes/{freeze_id}/conversions"
    description: "Convert a frozen fare into a purchase, settling custody and activating any attached protection"
    roles: [Traveler, OpsAgent]
    code: 200
    input: [expected_freeze_version]
    output: PriceFreeze
    side_effects:
      - "Status -> CONVERTED; itinerary.travel_status = BOOKED; route.seats_left -= 1"
      - "deposit_attribution_accrual debits custody_held_cents by the credited portion and stamps deposit_integrity_flag"
      - "Any ProtectionProduct on the freeze moves QUOTED -> ACTIVE; guarantee_hedge_rebalance releases the reservation"

  - method: POST
    path: "/fare/price-freezes/{freeze_id}/cancellations"
    description: "Cancel a freeze and settle the deposit under the membership overrun rule"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["cancel_reason?"]
    output: PriceFreeze
    side_effects:
      - "guarantee_hedge_rebalance deposit_forfeiture_rule sets deposit_forfeited_cents = 2 x deposit_cents when a captured MEMBERSHIP_2 payment exists for the itinerary, else 0"
      - "Status -> CANCELLED; the credited custody portion is released to custody_return_pending_cents"
      - "guarantee_hedge_rebalance releases the reservation"

  - method: POST
    path: "/fare/price-freezes/{freeze_id}/reinstatements"
    description: "Reinstate a cancelled freeze as a fresh manifest"
    roles: [OpsAgent]
    code: 200
    input: [expected_freeze_version]
    output: PriceFreeze
    side_effects:
      - "CANCELLED -> DRAFT with every monetary and exposure field reset to 0"

  # --------------------------- Protections -----------------------------------
  - method: POST
    path: "/fare/protections"
    description: "Quote a cancellation or change protection product subject to the disclosure gate"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [itinerary_id, product_type, cancellation_disruption_probability, "freeze_id?", disclosure_version, disclosure_acknowledged]
    output: ProtectionProduct
    side_effects:
      - "protection_pricing runs, selecting the member_guarantee_pricing variant when a covering freeze exists"
      - "quoted_status = QUOTED_FROZEN (or QUOTED_FROZEN_ON_UNPUBLISHED_CURVE when the route has no curve); lifecycle_status = QUOTED"

  - method: POST
    path: "/fare/itineraries/{itinerary_id}/protections"
    description: "Quote a protection product by naming the itinerary in the path"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [product_type, cancellation_disruption_probability, "freeze_id?", disclosure_version, disclosure_acknowledged]
    output: ProtectionProduct
    side_effects: ["Same as POST /fare/protections"]

  - method: GET
    path: "/fare/protections"
    description: "List protection products by itinerary, freeze, product type or lifecycle status"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: ["itinerary_id?", "freeze_id?", "product_type?", "lifecycle_status?", "limit?", "offset?"]
    output: ProtectionProduct[]
    side_effects: []

  - method: GET
    path: "/fare/protections/{protection_id}"
    description: "Retrieve a protection product with both its pricing-status and lifecycle-status dimensions"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: ProtectionProduct
    side_effects: []

  - method: POST
    path: "/fare/protections/{protection_id}/quotes"
    description: "Re-quote a protection product, re-raising the premium if it was quoted on an unpublished curve"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["cancellation_disruption_probability?"]
    output: ProtectionProduct
    side_effects:
      - "protection_pricing re-derives probable loss and premium; a product quoted on an unpublished curve leaves that value behind"
      - "suspended_under_cap and the continuum term re-derived"

  - method: POST
    path: "/fare/protections/{protection_id}/activations"
    description: "Activate a protection product and make its premium payable"
    roles: [Traveler, OpsAgent]
    code: 200
    input: [expected_protection_version]
    output: ProtectionProduct
    side_effects:
      - "lifecycle_status QUOTED -> ACTIVE; the premium is due against a PREMIUM payment"
      - "product_continuum_rating runs; suspended_under_cap re-derived from the covering freeze's hedged share rate"

  - method: POST
    path: "/fare/protections/{protection_id}/cancellations"
    description: "Exercise protected cancellation of the itinerary"
    roles: [Traveler]
    code: 200
    input: [acknowledge_minimum_disruption]
    output: ProtectionProduct
    side_effects:
      - "protect_change_redemption consumes ceil(premium / disruption fare) days capped at bonus_days_total"
      - "lifecycle_status -> CANCELLED_PROTECTED; itinerary -> CANCELLED; DRAFT/HELD freezes on it -> CANCELLED with no forfeiture"

  - method: POST
    path: "/fare/protections/{protection_id}/reinstatements"
    description: "Reverse a protected cancellation and restore the itinerary and its freeze"
    roles: [OpsAgent]
    code: 200
    input: [expected_protection_version]
    output: ProtectionProduct
    side_effects:
      - "CANCELLED_PROTECTED -> ACTIVE; redeemed days and bonus day balance reverted; itinerary -> PLANNED; freeze cancellations reverted to DRAFT"

  - method: POST
    path: "/fare/protections/{protection_id}/change-events"
    description: "File a change event against a CHANGE protection product"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [new_departure_date, "gap_direction?"]
    output: ChangeEvent
    side_effects:
      - "Creates a ChangeEvent in OPEN; lifecycle_status ACTIVE -> CHANGE_IN_PROGRESS"
      - "new_departure_date must differ from the itinerary's current departure_date"

  - method: POST
    path: "/fare/protections/{protection_id}/terminations"
    description: "Terminate a protection product on a hard terminator"
    roles: [OpsAgent]
    code: 200
    input: [termination_reason]
    output: ProtectionProduct
    side_effects:
      - "lifecycle_status -> TERMINATED with terminated_hard = true and the product removed from every bonus-day walk; a product with remaining bonus days is a soft terminator and transitions to EXPIRED instead"

  - method: GET
    path: "/fare/itineraries/{itinerary_id}/protections"
    description: "List the protection products attached to an itinerary"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: ProtectionProduct[]
    side_effects: []

  # ---------------------------- Claims ---------------------------------------
  - method: POST
    path: "/fare/claims"
    description: "File a guarantee claim against a freeze by naming it in the body"
    roles: [Traveler]
    code: 201
    input: [freeze_id, market_price_cents]
    output: GuaranteeClaim
    side_effects:
      - "Creates a GuaranteeClaim in FILED with filer_user_id = X-User-ID, approver_user_id null and audit_ready false"
      - "freeze.status -> CLAIM_PENDING; guarantee_claim_settlement computes overshoot, capped impact, payout and both transaction values"

  - method: POST
    path: "/fare/price-freezes/{freeze_id}/claims"
    description: "File a guarantee claim against the freeze named in the path"
    roles: [Traveler]
    code: 201
    input: [market_price_cents]
    output: GuaranteeClaim
    side_effects: ["Same as POST /fare/claims"]

  - method: GET
    path: "/fare/claims"
    description: "List claims by freeze, itinerary, status or approver"
    roles: [Traveler, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: ["freeze_id?", "itinerary_id?", "claim_status?", "approver_user_id?", "limit?", "offset?"]
    output: GuaranteeClaim[]
    side_effects: []

  - method: GET
    path: "/fare/claims/{claim_id}"
    description: "Retrieve a claim with its payout, both transaction values and audit state"
    roles: [Traveler, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []

  - method: POST
    path: "/fare/claims/{claim_id}/reviews"
    description: "Move a claim into review, stamping the reviewing adjuster"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["review_note?"]
    output: GuaranteeClaim
    side_effects:
      - "claim_status -> UNDER_REVIEW; approver_user_id = X-User-ID"
      - "Rejected at priority 7 when the acting adjuster opened the claim"

  - method: POST
    path: "/fare/claims/{claim_id}/approvals"
    description: "Approve a claim once the conformity and segregation gates hold"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["approval_note?"]
    output: GuaranteeClaim
    side_effects:
      - "claim_status -> APPROVED; the payout is fenced as reserved exposure"
      - "Rejected at priority 7 when the approver opened the claim, and at the conformity gate when payout_cents != capped_impact_cents"

  - method: POST
    path: "/fare/claims/{claim_id}/rejections"
    description: "Reject a claim and return its freeze to service"
    roles: [ClaimsAdjuster]
    code: 200
    input: [rejection_reason]
    output: GuaranteeClaim
    side_effects:
      - "claim_status -> REJECTED; freeze.status -> FROZEN with its reservation restored"

  - method: POST
    path: "/fare/claims/{claim_id}/withdrawals"
    description: "Withdraw a claim before settlement"
    roles: [Traveler]
    code: 200
    input: ["withdrawal_reason?"]
    output: GuaranteeClaim
    side_effects:
      - "claim_status -> WITHDRAWN; freeze.status -> FROZEN"

  - method: POST
    path: "/fare/claims/{claim_id}/reconsiderations"
    description: "Reopen an approved or rejected claim for a second look"
    roles: [ClaimsAdjuster]
    code: 200
    input: [reconsideration_reason]
    output: GuaranteeClaim
    side_effects:
      - "APPROVED -> UNDER_REVIEW (the genuine reconsideration arc) or REJECTED -> UNDER_REVIEW; any fenced payout is released back to reserved exposure"

  - method: POST
    path: "/fare/claims/{claim_id}/settlements"
    description: "Settle an approved claim, disbursing the payout against custody"
    roles: [ClaimsAdjuster]
    code: 200
    input: [expected_claim_version]
    output: GuaranteeClaim
    side_effects:
      - "claim_status -> SETTLED_WITH_PURCHASE; transaction_value_cents switches to the final variant"
      - "freeze.status -> CLAIMED; custodian_hold_release credits custody and re-splits the payout by the arrival fare's insurance tier"
      - "Rejected in priority order by the audit gate (7), the route profile gate (11), the custody gate (12) and the price-field gate (19)"

  # --------------------------- Change events ---------------------------------
  - method: POST
    path: "/fare/change-events"
    description: "File a change event by naming its protection product in the body"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [protection_id, new_departure_date, "gap_direction?"]
    output: ChangeEvent
    side_effects:
      - "Creates a ChangeEvent in OPEN; the protection's lifecycle_status -> CHANGE_IN_PROGRESS"
      - "day_shift = abs(new_departure_date - old departure date) in whole days; disruption_days = protect_change_redemption's duration metric"

  - method: GET
    path: "/fare/change-events"
    description: "List change events by protection, itinerary or status"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["protection_id?", "itinerary_id?", "status?", "limit?", "offset?"]
    output: ChangeEvent[]
    side_effects: []

  - method: GET
    path: "/fare/change-events/{change_event_id}"
    description: "Retrieve one change event with its option sequence and hold window"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: ChangeEvent
    side_effects: []

  - method: POST
    path: "/fare/change-events/{change_event_id}/selections"
    description: "Select one of the offered rebooking options"
    roles: [Traveler]
    code: 200
    input: [option_id]
    output: ChangeEvent
    side_effects:
      - "The named option -> SELECTED and every sibling -> SUPERSEDED; status -> OPTION_SELECTED"
      - "optimum_switch_warning compares the change fee against the raw option price and reports the cheaper alternative when one exists"

  - method: POST
    path: "/fare/change-events/{change_event_id}/settlements"
    description: "Settle the change into its held option, consuming bonus days"
    roles: [Traveler]
    code: 200
    input: ["expected_change_event_version?"]
    output: ChangeEvent
    side_effects:
      - "protect_change_redemption consumes duration_metric(day_shift) days; the protection -> REBOOKED; itinerary.departure_date = the option's date"
      - "Rejected at priority 10 when the option hold has lapsed and at priority 19 when a billed price is missing"

  - method: POST
    path: "/fare/change-events/{change_event_id}/cancellations"
    description: "Cancel a change event and return the protection to ACTIVE"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["cancel_reason?"]
    output: ChangeEvent
    side_effects:
      - "status -> CANCELLED; the protection's lifecycle_status CHANGE_IN_PROGRESS -> ACTIVE with no day consumed"

  # --------------------------- Booking options -------------------------------
  - method: POST
    path: "/fare/rebooking-options"
    description: "Offer a rebooking option on a change event, sequenced deterministically"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [change_event_id, departure_date, option_fare_cents]
    output: RebookingOption
    side_effects:
      - "sequence_index assigned by protect_change_schedule's total sort key; a collision is refused at priority 17"
      - "Rejected at priority 15 when the departure date is not a legal replacement"

  - method: GET
    path: "/fare/rebooking-options"
    description: "List rebooking options by change event or status, in sequence order"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["change_event_id?", "status?", "limit?", "offset?"]
    output: RebookingOption[]
    side_effects: []

  - method: GET
    path: "/fare/rebooking-options/{option_id}"
    description: "Retrieve one rebooking option with its display and raw prices"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: RebookingOption
    side_effects: []

  - method: GET
    path: "/fare/change-events/{change_event_id}/rebooking-options"
    description: "List the rebooking options offered on a change event"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: RebookingOption[]
    side_effects: []

  - method: POST
    path: "/fare/rebooking-options/{option_id}/acceptances"
    description: "Accept an option, opening its 24-hour hold"
    roles: [Traveler]
    code: 200
    input: []
    output: RebookingOption
    side_effects:
      - "option -> HELD with hold_expires_at = current_utc + 24 hours; the change event -> HELD with the same instant"
      - "Rejected at priority 10 when the departure date is not in the future"

  - method: POST
    path: "/fare/rebooking-options/{option_id}/hold-reversions"
    description: "Return a held option to the selected pool before its hold lapses"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["reversion_reason?"]
    output: RebookingOption
    side_effects:
      - "option -> EXPIRED and the change event -> OPTION_SELECTED; the recurrence stamp on unrecovered_travel_fare_cents is applied"

  # ------------------------ Destination options ------------------------------
  - method: POST
    path: "/fare/destination-options"
    description: "Offer an origin- or destination-direction recovered-travel option on an itinerary"
    roles: [Traveler, OpsAgent]
    code: 201
    input: [itinerary_id, departure_date, option_fare_cents, "direction?"]
    output: DestinationOption
    side_effects:
      - "eligible is derived from gap_direction and the departure date; the option starts AVAILABLE"

  - method: GET
    path: "/fare/destination-options"
    description: "List destination options by itinerary or direction"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["itinerary_id?", "direction?", "limit?", "offset?"]
    output: DestinationOption[]
    side_effects: []

  - method: GET
    path: "/fare/destination-options/{destination_option_id}"
    description: "Retrieve one destination option"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: DestinationOption
    side_effects: []

  - method: GET
    path: "/fare/itineraries/{itinerary_id}/destination-options"
    description: "List the destination options offered on an itinerary"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: DestinationOption[]
    side_effects: []

  - method: POST
    path: "/fare/destination-options/{destination_option_id}/selections"
    description: "Bind a recovered-travel option for the pending change"
    roles: [Traveler]
    code: 200
    input: []
    output: DestinationOption
    side_effects:
      - "AVAILABLE -> BOUND; the option's fare is fenced as recovered-travel exposure"
      - "desk_odd_ratio_restriction refuses the bind when the option's fare exceeds the itinerary's listed fare by more than the odd ratio"

  - method: POST
    path: "/fare/destination-options/{destination_option_id}/releases"
    description: "Release a bound destination option back to the pool"
    roles: [Traveler, OpsAgent]
    code: 200
    input: ["release_reason?"]
    output: DestinationOption
    side_effects:
      - "BOUND -> AVAILABLE; the fenced recovered-travel exposure is released"

  # ------------------------------ Payments -----------------------------------
  - method: POST
    path: "/fare/payments"
    description: "Record a payment against an itinerary, freeze, protection or claim"
    roles: [OpsAgent]
    code: 201
    input: [itinerary_id, "freeze_id?", "protection_id?", "claim_id?", payment_kind, amount_cents, capture]
    output: Payment
    side_effects:
      - "Status AUTHORIZED, or CAPTURED immediately when capture is true; the capture allocates amount_cents to the target named by payment_kind"
      - "DEPOSIT allocations credit the freeze's custody_held_cents; MEMBERSHIP_2 allocations credit route.war_chest_cents"

  - method: GET
    path: "/fare/payments"
    description: "List payments by itinerary, freeze, protection, claim or status"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: ["itinerary_id?", "freeze_id?", "protection_id?", "claim_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/fare/payments/{payment_id}"
    description: "Retrieve a payment with its allocation log and refundable balance"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/fare/price-freezes/{freeze_id}/payments"
    description: "List the payments attached to a price freeze"
    roles: [Traveler, OpsAgent, ClaimsAdjuster, RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/fare/payments/{payment_id}/captures"
    description: "Capture an authorized payment and allocate it to its target"
    roles: [OpsAgent]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "AUTHORIZED -> CAPTURED; the allocation log gains one entry and refundable_remaining_cents is debited"

  - method: POST
    path: "/fare/payments/{payment_id}/refunds"
    description: "Refund a captured payment, partially or in full"
    roles: [OpsAgent, ClaimsAdjuster]
    code: 200
    input: [refund_cents]
    output: Payment
    side_effects:
      - "CAPTURED/PARTIALLY_REFUNDED -> PARTIALLY_REFUNDED or REFUNDED; refundable_remaining_cents is debited by refund_cents"
      - "Rejected at priority 8 on a RETIRED or FORFEITED payment; over-refund is refused"

  # --------------------------- Hedging positions -----------------------------
  - method: POST
    path: "/fare/hedging-positions"
    description: "Open a hedging position on a route and coverage date"
    roles: [RiskAnalyst]
    code: 201
    input: [route_id, coverage_date, hedge_price_cents, contract_quantity_cents, expected_route_version]
    output: HedgingPosition
    side_effects:
      - "Status OPEN; pool_id bound to the route's regional pool"
      - "Rejected at priority 13 on a RESTRICTED route and at priority 16 when the triple already exists"
      - "increments Route.version by 1"

  - method: GET
    path: "/fare/hedging-positions"
    description: "List hedging positions by route, pool or status"
    roles: [RiskAnalyst, PlatformAdmin]
    code: 200
    input: ["route_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: HedgingPosition[]
    side_effects: []

  - method: GET
    path: "/fare/hedging-positions/{position_id}"
    description: "Retrieve a hedging position with its mark history and release state"
    roles: [RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: HedgingPosition
    side_effects: []

  - method: GET
    path: "/fare/routes/{route_id}/hedging-positions"
    description: "List the hedging positions held on a route"
    roles: [RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: HedgingPosition[]
    side_effects: []

  - method: POST
    path: "/fare/hedging-positions/{position_id}/marks"
    description: "Remark a position against the projected cost for its coverage date"
    roles: [RiskAnalyst]
    code: 200
    input: [projected_day_cost_cents]
    output: HedgingPosition
    side_effects:
      - "OPEN -> HEDGED, or HEDGED -> OPEN with regression_reversed = true when the projected cost drops below the hedge price in a pool whose absorbed_regression_cents is 0"
      - "HEDGED -> OPEN is refused while the region's pool has absorbed_regression_cents > 0"

  - method: POST
    path: "/fare/hedging-positions/{position_id}/settlements"
    description: "Settle a hedged position, releasing its absorption into the route's war chest"
    roles: [RiskAnalyst]
    code: 200
    input: []
    output: HedgingPosition
    side_effects:
      - "HEDGED -> SETTLED; absorption_released_cents = mark_value_cents when the route is in SURGE, else 0"
      - "Route.war_chest_cents += absorption_released_cents and route.available_exposure_cents re-derived"

  # ------------------------------- Pools -------------------------------------
  - method: POST
    path: "/fare/risk-pools"
    description: "Open a regional risk pool that underwrites hedge regressions and caps bound positions"
    roles: [RiskAnalyst]
    code: 201
    input: [region, pool_code]
    output: RiskPool
    side_effects:
      - "Status OPEN; absorbed_regression_cents 0; at most one pool per region"

  - method: GET
    path: "/fare/risk-pools"
    description: "List risk pools by region or status"
    roles: [RiskAnalyst, PlatformAdmin]
    code: 200
    input: ["region?", "status?", "limit?", "offset?"]
    output: RiskPool[]
    side_effects: []

  - method: GET
    path: "/fare/risk-pools/{pool_id}"
    description: "Retrieve a risk pool with its absorbed regression and bound position counts"
    roles: [RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: RiskPool
    side_effects: []

  - method: GET
    path: "/fare/routes/{route_id}/risk-pools"
    description: "List the regional risk pool association for a route"
    roles: [RiskAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: RiskPool[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header absent, malformed, or naming an undeclared role (priority 1)" }
  - { id: ERR_FORBIDDEN_FOR_ACTOR, http: 403, condition: "The acting role is not listed on the endpoint, or an entity-backed role presents an X-User-ID that is not that entity's id, or the actor does not own the resource (priority 2)" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "No Route exists for the route_id named in the path or body (priority 3)" }
  - { id: ERR_ITINERARY_NOT_FOUND, http: 404, condition: "No Itinerary exists for the itinerary_id named in the path, or it does not belong to the route named in the same request (priority 4)" }
  - { id: ERR_FREEZE_NOT_FOUND, http: 404, condition: "No PriceFreeze exists for the freeze_id named in the path or body (priority 5)" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "The named child resource (watch, protection, claim, change event, option, payment, hedging position, destination option, risk pool) does not exist (priority 6)" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Segregation of duties: the claim approver is the same identity that filed the claim, so claim.audit_ready is false (priority 7)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in any state the requested transition can leave (priority 8)" }
  - { id: ERR_ITINERARY_NOT_PLANNED, http: 409, condition: "The itinerary is not PLANNED or WATCHING where the operation requires one of them, or is not PLANNED where booking requires it (priority 9)" }
  - { id: ERR_NOTIFICATION_SUPPRESSED, http: 409, condition: "A watch notification is inside its cooldown, a watch has passed expires_at, or a rebooking option's hold has lapsed (priority 10)" }
  - { id: ERR_ROUTE_EXPOSURE_PROFILE, http: 422, condition: "The claim's freeze capped_impact_cents exceeds the route's available_exposure_cents (priority 11)" }
  - { id: ERR_CUSTODY_INSUFFICIENT, http: 422, condition: "Settlement requires a matching insurance tier or a custody_return_pending_cents balance of at least the payout, and neither holds (priority 12)" }
  - { id: ERR_ROUTE_RESTRICTED, http: 409, condition: "The route posture is RESTRICTED or CLOSED where the operation requires ACTIVE or SURGE (priority 13)" }
  - { id: ERR_GUARANTEE_EXPOSURE_EXCEEDED, http: 422, condition: "The requested freeze's capped impact would push reserved_exposure_cents above route.max_guarantee_exposure_cents (priority 14)" }
  - { id: ERR_PRODUCT_TYPE_MISMATCH, http: 422, condition: "The product type does not admit the operation, the itinerary does not belong to the named route, or the option does not belong to the named change event (priority 15)" }
  - { id: ERR_HEDGE_DUPLICATE_COVERAGE, http: 409, condition: "A HedgingPosition already exists for the same (route_id, coverage_date, hedge_price_cents) triple, or the region's bound position cap is reached (priority 16)" }
  - { id: ERR_DUPLICATE_SEQUENCE_INDEX, http: 409, condition: "A RebookingOption's sequence_index collides with an option already in the same change event (priority 17)" }
  - { id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED, http: 422, condition: "The disclosed disclosure_version does not equal the route's current value, or the acknowledgment flag is absent (priority 18)" }
  - { id: ERR_PRICE_FIELD_MISSING, http: 422, condition: "A price-bearing field required by the request schema is absent or null where an earlier check would otherwise have passed (priority 19)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "A create-with-supersede request carries an expected_<parent>_version that no longer matches the parent's version" }
  - { id: ERR_NO_OVERSHOOT, http: 422, condition: "A claim is filed against a freeze whose overshoot_cents is zero, i.e. the frozen fare did not rise above the manifest" }
  - { id: ERR_PAYMENT_RETIRED, http: 409, condition: "An allocation or refund is attempted against a RETIRED or FORFEITED payment" }
  - { id: ERR_PAYMENT_OVER_ALLOCATED, http: 422, condition: "A refund would take refundable_remaining_cents below zero" }
  - { id: ERR_CLAIM_NON_CONFORMANT, http: 422, condition: "A claim's payout_cents does not equal its freeze's capped_impact_cents, so the approval conformity test fails" }
  - { id: ERR_CANCELLATION_ALREADY_EXERCISED, http: 409, condition: "Protected cancellation is requested on a product already in CANCELLED_PROTECTED" }
  - { id: ERR_DISRUPTION_BELOW_MINIMUM, http: 422, condition: "Protected cancellation is requested while the product's disruption probability is below the route's cancel_minimum_disruption" }
  - { id: ERR_PREMIUM_NOT_PAYABLE, http: 409, condition: "Activation or premium collection is attempted while quoted_status is QUOTED_FROZEN_ON_UNPUBLISHED_CURVE, or the route has no curve" }
  - { id: ERR_CHANGE_ALREADY_OPEN, http: 409, condition: "A change event is filed while another change event for the same protection is OPEN, OPTION_SELECTED or HELD" }
  - { id: ERR_INSUFFICIENT_BONUS_DAYS, http: 422, condition: "A change settlement would consume more days than the product's bonus_days_remaining" }
  - { id: ERR_OPTION_HOLD_LAPSED, http: 409, condition: "A rebooking option's hold has lapsed, or its departure date is no longer in the future" }
  - { id: ERR_OPTION_NOT_OFFERED, http: 409, condition: "A selection names an option that is not in OFFERED status" }
  - { id: ERR_OPTION_NOT_IN_EVENT, http: 422, condition: "A selection names an option that does not belong to the change event in the path" }
  - { id: ERR_NO_SEATS_LEFT, http: 409, condition: "A booking is attempted on a route whose seats_left is 0" }
  - { id: ERR_CURVE_UNPUBLISHED, http: 409, condition: "A watch is armed on a route with no published demand curve" }
  - { id: ERR_WATCH_EXPIRED, http: 409, condition: "A notification is requested on a watch past its expires_at, or the itinerary has already departed" }
  - { id: ERR_ROUTE_ITINERARY_MISMATCH, http: 422, condition: "A price observation names an itinerary that does not belong to the route named in the same request" }
  - { id: ERR_DESK_ODD_RATIO, http: 422, condition: "A destination option's fare exceeds the itineraries listed fare by more than the desk's odd-ratio tolerance" }
  - { id: ERR_MANIFEST_UNSETTLED, http: 409, condition: "A conversion or expiry is requested on a freeze whose custody balance and deposit attribution disagree and whose integrity flag is not INTEGRITY_CONSISTENT" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 422, condition: "A claim is filed after freeze_expires_at + 14 days, or a reconsideration is requested after that instant" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body: missing required field, wrong type, invalid enum member, out-of-range amount (deposit below 100 or above 5000, fare below 1, amount above 20000) or an unparseable ISO 8601 timestamp" }

# =============================================================================
# §1.7 RBAC Matrix
#
# Role model: segregation_of_duties. Traveler quotes and files; ClaimsAdjuster
# reviews, approves and settles; no identity may hold both sides of a claim.
# Every role is opaque (an operator identifier); Traveler ownership is enforced
# by itinerary.traveler_user_id == X-User-ID, never by an entity id.
# =============================================================================
roles:

  - name: Traveler
    description: "Itinerary-owning customer persona; quotes and buys ancillary products, arms watches, files claims"
    identity: opaque
    exclusive_operations:
      - "POST /fare/itineraries/{itinerary_id}/watch-subscription - arm a fare watch"
      - "POST /fare/watch-subscriptions/{watch_id}/confirmations - confirm a BUY_NOW notification"
      - "POST /fare/itineraries/{itinerary_id}/bookings - book the itinerary"
      - "POST /fare/claims - file a guarantee claim"
      - "POST /fare/price-freezes/{freeze_id}/claims - file a guarantee claim by freeze"
      - "POST /fare/claims/{claim_id}/withdrawals - withdraw a claim"
      - "POST /fare/protections/{protection_id}/cancellations - exercise protected cancellation"
      - "POST /fare/change-events/{change_event_id}/settlements - settle a change into its held option"
      - "POST /fare/rebooking-options/{option_id}/acceptances - accept a rebooking option"
      - "POST /fare/destination-options/{destination_option_id}/selections - bind a recovered-travel option"
    shared_operations:
      - "POST /fare/itineraries - create an itinerary (with OpsAgent)"
      - "POST /fare/itineraries/{itinerary_id}/cancellations - cancel an itinerary (with OpsAgent)"
      - "POST /fare/itineraries/{itinerary_id}/price-freezes - open a freeze (with OpsAgent)"
      - "POST /fare/price-freezes/{freeze_id}/activations - activate a freeze (with OpsAgent)"
      - "POST /fare/price-freezes/{freeze_id}/conversions - convert a freeze (with OpsAgent)"
      - "POST /fare/price-freezes/{freeze_id}/cancellations - cancel a freeze (with OpsAgent)"
      - "POST /fare/protections - quote a protection product (with OpsAgent)"
      - "POST /fare/change-events - file a change event (with OpsAgent)"
      - "POST /fare/watch-subscriptions/{watch_id}/notifications - evaluate a watch (with OpsAgent)"

  - name: OpsAgent
    description: "Travel operations desk; appends live fare observations, publishes demand curves, services freezes and payments"
    identity: opaque
    exclusive_operations:
      - "POST /fare/price-observations - append a live fare observation"
      - "POST /fare/demand-curves - publish or supersede a demand curve"
      - "POST /fare/payments - record a payment"
      - "POST /fare/payments/{payment_id}/captures - capture a payment"
      - "POST /fare/price-freezes/{freeze_id}/expirations - expire a due freeze"
      - "POST /fare/price-freezes/{freeze_id}/reinstatements - reinstate a cancelled freeze"
      - "POST /fare/protections/{protection_id}/reinstatements - reverse a protected cancellation"
      - "POST /fare/protections/{protection_id}/terminations - terminate a protection product"
      - "POST /fare/itineraries/{itinerary_id}/bookings - book on a traveler's behalf"

  - name: RiskAnalyst
    description: "Hedging desk; opens and marks positions, runs the regional regression sweep, owns the exposure books"
    identity: opaque
    exclusive_operations:
      - "POST /fare/hedging-positions - open a hedging position"
      - "POST /fare/hedging-positions/{position_id}/marks - remark a position"
      - "POST /fare/hedging-positions/{position_id}/settlements - settle a position"
      - "POST /fare/risk-pools - open a regional risk pool"
      - "POST /fare/hedge-regression-sweeps - run the regional regression absorption sweep"

  - name: ClaimsAdjuster
    description: "Claims desk; reviews, approves, reconsiders, rejects and settles guarantee claims; no role overlap with Traveler"
    identity: opaque
    exclusive_operations:
      - "POST /fare/claims/{claim_id}/reviews - move a claim into review"
      - "POST /fare/claims/{claim_id}/approvals - approve a claim"
      - "POST /fare/claims/{claim_id}/rejections - reject a claim"
      - "POST /fare/claims/{claim_id}/reconsiderations - reopen a claim"
      - "POST /fare/claims/{claim_id}/settlements - settle a claim"
    shared_operations:
      - "POST /fare/payments/{payment_id}/refunds - refund a payment (with OpsAgent)"

  - name: PlatformAdmin
    description: "Platform operator; owns route configuration, the logical clock and the batch runs, and never touches a claim's outcome"
    identity: opaque
    exclusive_operations:
      - "POST /fare/routes - register a route"
      - "PATCH /fare/routes/{route_id} - update route parameters"
      - "POST /fare/routes/{route_id}/posture-transitions - move a route between operator postures"
      - "POST /_clock/set_current_utc - set the logical clock"
      - "POST /_clock/advance - advance the logical clock and run the scheduled sweep"

  - name: SystemOperator
    description: "Batch operator that drives scheduled maintenance transitions without commercial authority"
    identity: opaque
    shared_operations:
      - "POST /fare/price-freezes/{freeze_id}/expirations - expire a due freeze (with OpsAgent)"
