# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Hotel Revenue Management (RMS) — Expert band
# Breadth probe across the claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_property_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /properties with name + total_rooms returns 201 with id, version==1, KPIs==0 (occupancy_pct/adr/revpar)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /properties"
              payload: { name: "Hotel One", total_rooms: 100 }
              as: RevenueManager
              captures: { pid: $.data.id, v: $.data.version }
          assert:
            - "Response code 201; Property.version == 1; occupancy_pct == 0; adr == 0; revpar == 0"

      - name: get_property_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Property
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /properties/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404; error_id == ERR_NOT_FOUND"

      - name: create_property_missing_required_total_rooms_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Property.fields.total_rooms
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /properties without total_rooms (required, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "NoRooms" }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 422; error_id == ERR_INVALID_REQUEST"

      - name: create_property_overbooking_default_zero
        claim_type: Defaults
        grounds: [entities.Property.fields.overbooking_limit_pct]
        distinguishing_aspect: "Omitting overbooking_limit_pct applies default 0.0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "DefaultOver", total_rooms: 50 }
              as: RevenueManager
              captures: { pid: $.data.id, ob: $.data.overbooking_limit_pct }
          assert:
            - "Property.overbooking_limit_pct == 0.0"

      - name: rate_plan_ceiling_below_floor_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.RatePlan.fields.ceiling_rate
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=4]"
        distinguishing_aspect: "Creating a RatePlan with ceiling_rate < floor_rate returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Property + RoomType exist"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "BadBand", total_rooms: 40 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt: $.data.id }
          trigger:
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", base_rate: 200, floor_rate: 300, ceiling_rate: 250 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 422; error_id == ERR_INVALID_REQUEST"

      - name: rate_plan_invalid_rate_class_enum_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.RatePlan.fields.rate_class
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "rate_class not in {BAR,CORPORATE,ADVANCE_PURCHASE,PACKAGE} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Property + RoomType exist"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "EnumP", total_rooms: 40 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt: $.data.id }
          trigger:
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "SUPER", base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 422; error_id == ERR_INVALID_REQUEST"

      - name: competitor_rate_immutable_no_update_endpoint
        claim_type: Immutability
        grounds: [entities.CompetitorRate]
        distinguishing_aspect: "CompetitorRate has common_fields:false (only id+created_at, no version) and no PATCH/PUT endpoint exists in §1.5."
        test_recipe:
          setup: ["Property exists; one competitor rate recorded"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Shop", total_rooms: 40 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /competitor-rates"
              payload: { property_id: "${pid}", competitor_name: "Rival", stay_date: "2026-06-05T00:00:00Z", shopped_rate: 199.0, shopped_at: "2026-06-01T08:00:00Z" }
              as: RevenueManager
              captures: { crid: $.data.id }
          trigger:
            - call: "GET /competitor-rates/${crid}"
              payload: {}
              as: Analyst
              captures: { sr: $.data.shopped_rate }
          assert:
            - "CompetitorRate.${crid}.shopped_rate == 199.0; record carries no version field (immutable)"

      - name: room_type_requires_existing_property_parent
        claim_type: Parent Relationships
        grounds:
          - entities.RoomType.fields.property_id
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Creating a RoomType under a non-existent property returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /room-types"
              payload: { code: "KING", name: "King", physical_rooms: 10 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404; error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_already_published_decision_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RateDecision.DRAFT_to_PUBLISHED
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=12]"
        distinguishing_aspect: "Publishing a RateDecision already PUBLISHED returns ERR_INVALID_STATE (409); not DRAFT."
        test_recipe:
          setup: ["Property/RoomType/master BAR plan; InventoryDay; one decision already PUBLISHED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "DblPub", total_rooms: 40 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id, rpv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-05T00:00:00Z", physical_capacity: 40, transient_sold_rooms: 5 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-05T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec: $.data.id }
            - call: "POST /rate-decisions/${dec}/publish"
              payload: { expected_rate_plan_version: "${rpv}" }
              as: RevenueManager
              captures: { rpv2: $.data.version }
          trigger:
            - call: "POST /rate-decisions/${dec}/publish"
              payload: { expected_rate_plan_version: "${rpv2}" }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_INVALID_STATE"

      - name: commit_group_block_in_negotiating_without_evaluation_returns_not_evaluated
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GroupBlock.NEGOTIATING_to_COMMITTED
          - "errors[ERR_NOT_EVALUATED]"
          - "validations[priority=17]"
        distinguishing_aspect: "Commit of a never-evaluated NEGOTIATING block returns ERR_NOT_EVALUATED (409)."
        test_recipe:
          setup: ["Property/RoomType; InventoryDay; a fresh NEGOTIATING block (never evaluated)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "NoEval", total_rooms: 30 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-05T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 2 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt}", group_name: "Mike", arrival_date: "2026-06-05T00:00:00Z", nights: 1, rooms_per_night: 2, offered_rate: 300 }
              as: GroupSalesManager
              captures: { gb: $.data.id }
          trigger:
            - call: "POST /group-blocks/${gb}/commit"
              payload: { expected_room_type_version: "${rtv}" }
              as: GroupSalesManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_NOT_EVALUATED"

      - name: new_rate_decision_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.RateDecision, entities.RateDecision.fields.status]
        distinguishing_aspect: "A newly created RateDecision starts in status DRAFT with yielded_rate null."
        test_recipe:
          setup: ["Property/RoomType/plan exist"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "InitS", total_rooms: 40 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id }
          trigger:
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-05T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec: $.data.id, st: $.data.status, yr: $.data.yielded_rate }
          assert:
            - "RateDecision.${dec}.status == DRAFT and yielded_rate == null"

      - name: cancel_already_cancelled_committed_block_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GroupBlock.COMMITTED_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a GroupBlock already CANCELLED (terminal) returns ERR_INVALID_STATE (409); no inventory change."
        test_recipe:
          setup: ["Property/RoomType; InventoryDay; block committed then cancelled (now CANCELLED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "TermLock", total_rooms: 20 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 20 }
              as: RevenueManager
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-05T00:00:00Z", physical_capacity: 20, transient_sold_rooms: 2 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt}", group_name: "November", arrival_date: "2026-06-05T00:00:00Z", nights: 1, rooms_per_night: 3, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb: $.data.id }
            - call: "POST /group-blocks/${gb}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
            - call: "POST /group-blocks/${gb}/commit"
              payload: { expected_room_type_version: "${rtv}" }
              as: GroupSalesManager
            - call: "POST /group-blocks/${gb}/cancel"
              payload: {}
              as: GroupSalesManager
          trigger:
            - call: "POST /group-blocks/${gb}/cancel"
              payload: {}
              as: GroupSalesManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_INVALID_STATE"

      - name: close_plan_rejects_draft_decisions_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.RatePlan.ACTIVE_to_CLOSED, state_machines.RateDecision.DRAFT_to_REJECTED]
        distinguishing_aspect: "Closing a RatePlan transitions its DRAFT decisions to REJECTED (cascade) and the plan to CLOSED."
        test_recipe:
          setup: ["Property/RoomType/master BAR plan ACTIVE with one DRAFT decision"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "CloseCasc", total_rooms: 40 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-05T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec: $.data.id }
          trigger:
            - call: "POST /rate-plans/${rp}/close"
              payload: {}
              as: RevenueManager
              captures: { st: $.data.status }
            - call: "GET /rate-decisions/${dec}"
              payload: {}
              as: RevenueManager
              captures: { dst: $.data.status }
          assert:
            - "RatePlan.${rp}.status == CLOSED"
            - "RateDecision.${dec}.status == REJECTED with reject_reason == 'plan closed'"

      - name: request_revision_on_accept_evaluated_block_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GroupBlock.NEGOTIATING_to_REVISION_REQUESTED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "request-revision requires recommendation==REJECT; on an ACCEPT-evaluated block it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Property/RoomType; InventoryDay with low demand so a block evaluates ACCEPT (spill 0)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "RevReq", total_rooms: 30 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-05T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 2 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt}", group_name: "Oscar", arrival_date: "2026-06-05T00:00:00Z", nights: 1, rooms_per_night: 3, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb: $.data.id }
            - call: "POST /group-blocks/${gb}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
              captures: { rec: $.data.recommendation }
          trigger:
            - call: "POST /group-blocks/${gb}/request-revision"
              payload: {}
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Evaluate recommendation == ACCEPT; request-revision returns 409 with error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: forecast_snapshot_pace_correct_result
        claim_type: Correct Result
        grounds: [calculations.pickup_forecast]
        distinguishing_aspect: "SNAPSHOT_PACE forecast on capacity 30, sold 8 -> forecast_final_sold 12, occupancy 0.4."
        test_recipe:
          setup: ["Property/RoomType; InventoryDay 2026-06-06 capacity 30 sold 8; clock 2026-06-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "FcastA", total_rooms: 30 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 8 }
              as: RevenueManager
              captures: { inv: $.data.id }
          trigger:
            - call: "GET /inventory-days/${inv}/forecast"
              payload: { method: "SNAPSHOT_PACE" }
              as: Analyst
              captures: { ffs: $.data.forecast_final_sold, occ: $.data.forecast_occupancy_pct }
          assert:
            - "forecast_final_sold == 12 and forecast_occupancy_pct == 0.4"

      - name: forecast_trailing_pickup_uses_days_to_arrival
        claim_type: Correct Result
        grounds: [calculations.pickup_forecast]
        distinguishing_aspect: "TRAILING_PICKUP on capacity 30, sold 8, clock 2026-06-01, stay 2026-06-06 (5 days) -> 8 + 2*5 = 18, occ 0.6."
        test_recipe:
          setup: ["Property/RoomType; InventoryDay 2026-06-06 capacity 30 sold 8; clock 2026-06-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "FcastB", total_rooms: 30 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 8 }
              as: RevenueManager
              captures: { inv: $.data.id }
          trigger:
            - call: "GET /inventory-days/${inv}/forecast"
              payload: { method: "TRAILING_PICKUP" }
              as: Analyst
              captures: { ffs: $.data.forecast_final_sold, occ: $.data.forecast_occupancy_pct }
          assert:
            - "forecast_final_sold == 18 and forecast_occupancy_pct == 0.6"

      - name: availability_oversell_ceiling_floor_applied
        claim_type: Constants Applied
        grounds: [calculations.availability, entities.Property.fields.overbooking_limit_pct]
        distinguishing_aspect: "overbooking_limit_pct 0.10 on capacity 10 -> oversell ceiling floor(11)=11; sold 9 -> rooms_available 2."
        test_recipe:
          setup: ["Property overbooking 0.10; RoomType physical_rooms 10; InventoryDay capacity 10 sold 9"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "OverFloor", total_rooms: 10, overbooking_limit_pct: 0.10 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 10 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 9 }
              as: RevenueManager
              captures: { inv: $.data.id }
          trigger:
            - call: "GET /inventory-days/${inv}"
              payload: {}
              as: RevenueManager
              captures: { ra: $.data.rooms_available, rs: $.data.rooms_sold }
          assert:
            - "InventoryDay.${inv}.rooms_sold == 9 and rooms_available == 2 (ceiling 11 - 9)"

      - name: yield_rule_tie_break_highest_threshold_then_priority
        claim_type: Correct Result
        grounds: [calculations.rate_yield, entities.YieldRule.fields.priority]
        distinguishing_aspect: "Two eligible rules at occ 0.80: rule with higher occupancy_threshold_pct wins (0.80 over 0.50), pinning the at-most-one selection."
        test_recipe:
          setup: ["Property/RoomType capacity 100; two enabled rules: T0.50/+0.05/prio1 and T0.80/+0.30/prio2; InventoryDay sold 53 -> occ round(round(53*1.5=80)/100,4)=0.80"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "TieRule", total_rooms: 100 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "STD", name: "Standard", physical_rooms: 100 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /yield-rules"
              payload: { property_id: "${pid}", name: "Low", occupancy_threshold_pct: 0.50, adjustment_pct: 0.05, priority: 1, enabled: true }
              as: RevenueManager
            - call: "POST /yield-rules"
              payload: { property_id: "${pid}", name: "High", occupancy_threshold_pct: 0.80, adjustment_pct: 0.30, priority: 2, enabled: true }
              as: RevenueManager
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id, rpv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 100, transient_sold_rooms: 53 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-06T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec}/publish"
              payload: { expected_rate_plan_version: "${rpv}" }
              as: RevenueManager
              captures: { yr: $.data.yielded_rate }
          assert:
