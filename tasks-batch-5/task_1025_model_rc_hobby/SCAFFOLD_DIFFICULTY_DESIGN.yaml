# =============================================================================
# task_1025 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids × 2 instances = 18 instances. All grounds resolve into SCAFFOLD.yaml.
# Default logical clock = 2026-07-01T00:00:00Z. Reservation/registration windows
# are set to include this default, so most chains need no explicit clock-set.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dv_order_loyalty_provisional_vs_final_on_tier_up
        grounds:
          - calculations.loyalty_points
          - calculations.loyalty_tier
          - entities.Order.fields.provisional_points
          - entities.Order.fields.final_points
          - state_machines.Order.PENDING_to_FULFILLED
        distinguishing_aspect: |
          Same order lines yield provisional_points=500 (tier BRONZE snapshot at PLACE)
          but final_points=750 (tier SILVER as of fulfill), a divergence on the
          Order/Customer loyalty domain — distinct from the ServiceJob quote/invoice variant.
        test_recipe:
          setup:
            - "Customer starts BRONZE (lifetime_spend 0)."
            - "Product P (KIT, price 50000, stock 10)."
            - "Order O1 placed while buyer is BRONZE (provisional captured), then a separate order O2 (total 50000) is fulfilled to push lifetime_spend to 50000 (SILVER), then O1 is paid and fulfilled so its final uses SILVER."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv1@x.com", full_name: "DV One" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-DV1", name: "Big Kit", product_type: "KIT", price_cents: 50000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 50000 } ] }
              as: StoreStaff
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
              captures: { o1_prov: $.data.provisional_points }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 50000 } ] }
              as: StoreStaff
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
            - call: "POST /orders/${o2}/pay"
              payload: { amount_cents: 50000 }
              as: StoreStaff
            - call: "POST /orders/${o2}/transition"
              payload: { action: "FULFILL" }
              as: StoreStaff
            - call: "POST /orders/${o1}/pay"
              payload: { amount_cents: 50000 }
              as: StoreStaff
          trigger:
            - call: "POST /orders/${o1}/transition"
              payload: { action: "FULFILL" }
              as: StoreStaff
              captures: { o1_final: $.data.final_points }
          assert:
            - "Order.${o1}.provisional_points == 500"
            - "Order.${o1}.final_points == 750"
            - "Customer.${cust}.loyalty_tier == SILVER after O2 fulfill"

      - name: dv_service_quote_vs_final_invoice
        grounds:
          - calculations.service_pricing
          - entities.ServiceJob.fields.provisional_quote_cents
          - entities.ServiceJob.fields.final_invoice_cents
          - state_machines.ServiceJob.READY_to_COMPLETED
        distinguishing_aspect: |
          On the ServiceJob domain the provisional_quote_cents=15000 (estimated 2h + 3000 parts)
          diverges from final_invoice_cents=24500 (actual 3h + 4000 parts + 1 rework surcharge) —
          a different entity domain than the Order loyalty variant.
        test_recipe:
          setup:
            - "Service job diagnosed with 2h estimate + 3000 parts, one QC rework loop, completed with 3h + 4000 actual parts."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv2@x.com", full_name: "DV Two" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust}", job_type: "REPAIR" }
              as: StoreStaff
              captures: { job: $.data.id }
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "DIAGNOSE", estimated_labor_hours: 2, estimated_parts_cents: 3000 }
              as: StoreStaff
              captures: { quote: $.data.provisional_quote_cents }
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "SCHEDULE", bench_code: "B1", slot_start: "2026-07-02T09:00:00Z", slot_end: "2026-07-02T10:00:00Z" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "START" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "QC" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "REWORK" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "QC" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "READY" }
              as: StoreStaff
          trigger:
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "COMPLETE", actual_labor_hours: 3, actual_parts_cents: 4000 }
              as: StoreStaff
              captures: { invoice: $.data.final_invoice_cents }
          assert:
            - "ServiceJob.${job}.provisional_quote_cents == 15000"
            - "ServiceJob.${job}.final_invoice_cents == 24500"
            - "ServiceJob.${job}.rework_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_order_total_tiered_discount_plus_hazmat_surcharge
        grounds:
          - calculations.order_totals
          - entities.Order.fields.total_cents
          - entities.Product.fields.is_hazmat
          - state_machines.Order.DRAFT_to_PLACED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — subtotal, tier-selected discount_pct,
          and a conditional hazmat surcharge combine as subtotal - floor(subtotal*pct/100) + surcharge,
          giving total_cents=25500 for the pinned inputs.
        test_recipe:
          setup:
            - "BRONZE buyer; order with a KIT line (2 x 10000) and a BATTERY line (1 x 5000) → hazmat surcharge applies; buyer has safety-ack."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf1@x.com", full_name: "CF One" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/safety-ack"
              payload: {}
              as: StoreStaff
            - call: "POST /products"
              payload: { sku: "KIT-CF1", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { kit: $.data.id }
            - call: "POST /products"
              payload: { sku: "BAT-CF1", name: "LiPo", product_type: "BATTERY", price_cents: 5000, stock_on_hand: 10 }
              as: StoreStaff
              captures: { bat: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${kit}", quantity: 2, unit_price_cents: 10000 }, { product_id: "${bat}", quantity: 1, unit_price_cents: 5000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
              captures: { total: $.data.total_cents }
          assert:
            - "Order.${ord}.subtotal_cents == 25000"
            - "Order.${ord}.discount_cents == 0"
            - "Order.${ord}.hazmat_surcharge_cents == 500"
            - "Order.${ord}.total_cents == 25500"

      - name: cf_loyalty_points_per_line_floor_then_sum
        grounds:
          - calculations.loyalty_points
          - entities.Order.fields.provisional_points
          - state_machines.Order.DRAFT_to_PLACED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — floor per line THEN sum gives
          provisional_points=2 for two lines of 150 cents each, whereas sum-then-floor would give 3.
          The scaffold pins per-line-floor-then-sum.
        test_recipe:
          setup:
            - "BRONZE buyer; order with two non-hazmat lines each 1 x 150 cents."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf2@x.com", full_name: "CF Two" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRT-CF2", name: "Small Part", product_type: "PART", price_cents: 150, stock_on_hand: 10 }
              as: StoreStaff
              captures: { part: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${part}", quantity: 1, unit_price_cents: 150 }, { product_id: "${part}", quantity: 1, unit_price_cents: 150 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
              captures: { prov: $.data.provisional_points }
          assert:
            - "Order.${ord}.subtotal_cents == 300"
            - "Order.${ord}.provisional_points == 2"
            - "provisional_points is NOT 3 (sum-then-floor is rejected)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_order_parallel_payment_and_fulfillment
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
          - state_machines.Order.PENDING_to_FULFILLED
        distinguishing_aspect: |
          Order carries two independent parallel dimensions: an order can be FULFILLED
          only after PAID, but the payment_status (UNPAID→PAID) and fulfillment_status
          (PENDING→FULFILLED) are distinct axes evolving on the same row.
        test_recipe:
          setup:
            - "Placed order paid first (payment_status PAID, fulfillment_status still PENDING), then fulfilled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nl1@x.com", full_name: "NL One" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-NL1", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
            - call: "POST /orders/${ord}/pay"
              payload: { amount_cents: 10000 }
              as: StoreStaff
              captures: { pay_ps: $.data.payment_status, pay_fs: $.data.fulfillment_status }
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "FULFILL" }
              as: StoreStaff
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "After pay: Order.${ord}.payment_status == PAID AND fulfillment_status == PENDING"
            - "After fulfill: Order.${ord}.fulfillment_status == FULFILLED AND payment_status == PAID"

      - name: nl_service_qc_rework_cycle
        grounds:
          - state_machines.ServiceJob.QC_to_IN_PROGRESS
          - state_machines.ServiceJob.IN_PROGRESS_to_QC
          - entities.ServiceJob.fields.rework_count
        distinguishing_aspect: |
          ServiceJob has a genuine cycle QC→IN_PROGRESS→QC (REWORK loop) on a different
          entity than Order; each loop increments rework_count (here to 2).
        test_recipe:
          setup:
            - "Job scheduled and started, cycled QC→IN_PROGRESS twice (rework_count reaches 2)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nl2@x.com", full_name: "NL Two" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust}", job_type: "BUILD" }
              as: StoreStaff
              captures: { job: $.data.id }
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "DIAGNOSE", estimated_labor_hours: 1, estimated_parts_cents: 0 }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "SCHEDULE", bench_code: "B9", slot_start: "2026-07-03T09:00:00Z", slot_end: "2026-07-03T10:00:00Z" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "START" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "QC" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "REWORK" }
              as: StoreStaff
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "QC" }
              as: StoreStaff
          trigger:
            - call: "POST /service-jobs/${job}/transition"
              payload: { action: "REWORK" }
              as: StoreStaff
              captures: { rc: $.data.rework_count, st: $.data.status }
          assert:
            - "ServiceJob.${job}.rework_count == 2"
            - "ServiceJob.${job}.status == IN_PROGRESS"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_campaign_cancel_depth3_reservation_order_customer
        grounds:
          - state_machines.PreOrderCampaign.OPEN_to_CANCELLED
          - state_machines.PreOrderReservation.CONVERTED_to_CANCELLED
          - state_machines.Order.PENDING_to_CANCELLED
          - entities.Product.fields.stock_on_hand
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Depth-3 chain from campaign cancel: Campaign→CANCELLED forces Reservation→CANCELLED,
          which itself forces the linked Order→CANCELLED, which itself restocks the Product (+5→100)
          and reverses the buyer's provisional loyalty (500→0). Each hop caused by the prior.
        test_recipe:
          setup:
            - "Product stock 100; campaign total 10, unit_price 10000, OPEN; reservation requested 5 allocated 5 then CONVERTED (order PLACED, stock 95, provisional 500)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tc1@x.com", full_name: "TC One" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-TC1", name: "RC Car", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 100 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "Launch", total_allocation_units: 10, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cust}", requested_units: 5, expected_campaign_version: "${cv}" }
              as: StoreStaff
              captures: { res: $.data.id }
            - call: "POST /campaigns/${camp}/allocate"
              payload: {}
              as: StoreStaff
            - call: "POST /pre-orders/${res}/transition"
              payload: { action: "CONVERT" }
              as: StoreStaff
              captures: { ord: $.data.order_id }
          trigger:
            - call: "POST /campaigns/${camp}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "PreOrderReservation.${res}.status == CANCELLED"
            - "Order.${ord}.fulfillment_status == CANCELLED"
            - "Product.${prod}.stock_on_hand == 100"
            - "Customer.${cust}.loyalty_points_balance == 0"

      - name: tc_event_cancel_depth2_entry_customer_points
        grounds:
          - state_machines.RaceEvent.OPEN_to_CANCELLED
          - state_machines.RaceEntry.REGISTERED_to_WITHDRAWN
          - calculations.entry_points
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (event cancel): Event→CANCELLED forces
          Entry→WITHDRAWN, which itself debits the racer's loyalty points (20→0). Different
          propagation origin than the campaign cascade.
        test_recipe:
          setup:
            - "Event entry_fee 2000 OPEN; entry registered (racer credited 20 points)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tc2@x.com", full_name: "TC Two" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Club Night", event_date: "2026-07-15T10:00:00Z", capacity: 8, lane_count: 4, entry_fee_cents: 2000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-10T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "STOCK", lane_no: 1, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
              captures: { entry: $.data.id }
          trigger:
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "CANCEL" }
              as: StoreStaff
          assert:
            - "RaceEntry.${entry}.status == WITHDRAWN"
            - "Customer.${cust}.loyalty_points_balance == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pc_state_beats_fiscal_on_pay_draft_order
        grounds:
          - validations[priority=4]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_PAYMENT]
        distinguishing_aspect: |
          A DRAFT (not PLACED) order paid with too-little money violates both the state
          precondition (priority 4) and the fiscal amount check (priority 12); the state
          error wins → ERR_INVALID_STATE. Pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "Order left in DRAFT (never placed); pay attempt with amount 1 while total would be 10000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pc1@x.com", full_name: "PC One" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-PC1", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { amount_cents: 1 }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (NOT ERR_INSUFFICIENT_PAYMENT)"
            - "http status == 409"

      - name: pc_safety_beats_temporal_on_checkin
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SAFETY_INSPECTION_REQUIRED]
          - errors[ERR_CHECKIN_WINDOW_CLOSED]
        distinguishing_aspect: |
          Check-in by a racer with no safety-ack while the clock is before the check-in
          window violates safety (priority 6) and temporal (priority 7); safety wins →
          ERR_SAFETY_INSPECTION_REQUIRED. Pair: business_safety vs business_temporal.
        test_recipe:
          setup:
            - "Event RUNNING; entry REGISTERED; racer has NO safety-ack; clock at default 2026-07-01 (far before heat window [09:30,10:10) on 2026-07-15)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pc2@x.com", full_name: "PC Two" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Sprint", event_date: "2026-07-15T10:00:00Z", capacity: 8, lane_count: 4, entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-10T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "PRO", lane_no: 2, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
              captures: { entry: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "RUN" }
              as: StoreStaff
          trigger:
            - call: "POST /race-entries/${entry}/transition"
              payload: { action: "CHECK_IN" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SAFETY_INSPECTION_REQUIRED (NOT ERR_CHECKIN_WINDOW_CLOSED)"
            - "http status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bp_allocation_units_inclusive_boundary
        grounds:
          - calculations.campaign_allocation
          - state_machines.PreOrderReservation.HELD_to_ALLOCATED
          - state_machines.PreOrderReservation.HELD_to_WAITLISTED
          - entities.PreOrderCampaign.fields.remaining_units
        distinguishing_aspect: |
          The allocation sweep uses inclusive `requested_units <= remaining`: a reservation
          requesting exactly the whole pool (10 <= 10) is ALLOCATED, exhausting remaining to 0,
          so the next reservation (1 <= 0 false) is WAITLISTED. Metric: allocation units, via POST allocate.
        test_recipe:
          setup:
            - "Campaign total 10 OPEN; R1 (created first) requests 10, R2 requests 1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "bp1a@x.com", full_name: "BP1A" }
              as: StoreStaff
              captures: { cA: $.data.id }
            - call: "POST /customers"
              payload: { email: "bp1b@x.com", full_name: "BP1B" }
              as: StoreStaff
              captures: { cB: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-BP1", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 50 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "Cap", total_allocation_units: 10, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv0: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cA}", requested_units: 10, expected_campaign_version: "${cv0}" }
              as: StoreStaff
              captures: { r1: $.data.id }
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: StoreStaff
              captures: { cv1: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cB}", requested_units: 1, expected_campaign_version: "${cv1}" }
              as: StoreStaff
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp}/allocate"
              payload: {}
              as: StoreStaff
              captures: { alloc: $.data.allocated_units, rem: $.data.remaining_units }
          assert:
            - "PreOrderReservation.${r1}.status == ALLOCATED"
            - "PreOrderReservation.${r1}.allocated_units == 10"
            - "PreOrderReservation.${r2}.status == WAITLISTED"
            - "PreOrderCampaign.${camp}.allocated_units == 10"
            - "PreOrderCampaign.${camp}.remaining_units == 0"

      - name: bp_loyalty_tier_inclusive_spend_threshold
        grounds:
          - calculations.loyalty_tier
          - calculations.customer_lifetime_spend
          - entities.Customer.fields.loyalty_tier
          - state_machines.Order.PENDING_to_FULFILLED
        distinguishing_aspect: |
          Tier flips at inclusive spend boundary: fulfilling an order whose total is exactly
          50000 makes lifetime_spend_cents==50000 → SILVER (>=). Metric: money threshold, via POST fulfill —
          a different metric and endpoint than the allocation-units boundary.
        test_recipe:
          setup:
            - "BRONZE buyer; order total exactly 50000 placed, paid, fulfilled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "bp2@x.com", full_name: "BP2" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-BP2", name: "Kit", product_type: "KIT", price_cents: 50000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 50000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
            - call: "POST /orders/${ord}/pay"
              payload: { amount_cents: 50000 }
              as: StoreStaff
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "FULFILL" }
              as: StoreStaff
            - call: "GET /customers/${cust}"
              payload: {}
              as: StoreStaff
              captures: { tier: $.data.loyalty_tier, spend: $.data.lifetime_spend_cents }
          assert:
            - "Customer.${cust}.lifetime_spend_cents == 50000"
            - "Customer.${cust}.loyalty_tier == SILVER"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_reservation_convert_requires_campaign_allocating
        grounds:
          - state_machines.PreOrderReservation.ALLOCATED_to_CONVERTED
          - entities.PreOrderCampaign.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          A reservation's CONVERT transition is gated on the *campaign's* state (must be
          ALLOCATING): converting a HELD reservation while the campaign is still OPEN is
          rejected (ERR_RESERVATION_NOT_ALLOCATED), and only succeeds once allocate moves
          the campaign to ALLOCATING and the reservation to ALLOCATED. Pair: Reservation→Campaign.
        test_recipe:
          setup:
            - "Campaign OPEN with a HELD reservation (convert attempted pre-allocate fails), then allocate, then convert succeeds."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ce1@x.com", full_name: "CE1" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-CE1", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 50 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "Camp", total_allocation_units: 10, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv0: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cust}", requested_units: 3, expected_campaign_version: "${cv0}" }
              as: StoreStaff
              captures: { res: $.data.id }
            - call: "POST /campaigns/${camp}/allocate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /pre-orders/${res}/transition"
              payload: { action: "CONVERT" }
              as: StoreStaff
              captures: { st: $.data.status, ord: $.data.order_id }
          assert:
            - "PreOrderReservation.${res}.status == CONVERTED"
            - "PreOrderReservation.${res}.order_id is a non-null Order id"

      - name: ce_checkin_requires_event_running
        grounds:
          - state_machines.RaceEntry.REGISTERED_to_CHECKED_IN
          - entities.RaceEvent.fields.status
          - validations[priority=4]
        distinguishing_aspect: |
          A race entry's CHECK_IN transition is gated on the *event's* status == RUNNING:
          checking in while the event is still OPEN (registration phase) is rejected with
          ERR_INVALID_STATE even when the racer is safety-acked. Pair: Entry→Event.
        test_recipe:
          setup:
            - "Event OPEN (not yet RUNNING); racer safety-acked; entry REGISTERED; clock inside heat window."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ce2@x.com", full_name: "CE2" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/safety-ack"
              payload: {}
              as: StoreStaff
            - call: "POST /race-events"
              payload: { name: "Heat", event_date: "2026-07-15T10:00:00Z", capacity: 8, lane_count: 4, entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-20T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cust}", race_class: "STOCK", lane_no: 1, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
              captures: { entry: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T10:00:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /race-entries/${entry}/transition"
              payload: { action: "CHECK_IN" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (event not RUNNING)"
            - "RaceEntry.${entry}.status == REGISTERED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rt_race_lane_halfopen_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_LANE_CONFLICT]
          - entities.RaceEntry.fields.lane_no
          - entities.RaceEntry.fields.heat_start
        distinguishing_aspect: |
          Lane resource uses half-open [heat_start, heat_end) geometry with adjacency allowed:
          a second entry on the same (event, lane_no) whose interval [10:05,10:15) overlaps
          the first [10:00,10:10) is rejected with ERR_LANE_CONFLICT.
        test_recipe:
          setup:
            - "Event OPEN; entry1 lane 1 [10:00,10:10) registered; entry2 (different racer) lane 1 [10:05,10:15) overlaps."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rt1a@x.com", full_name: "RT1A" }
              as: StoreStaff
              captures: { cA: $.data.id }
            - call: "POST /customers"
              payload: { email: "rt1b@x.com", full_name: "RT1B" }
              as: StoreStaff
              captures: { cB: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Lanes", event_date: "2026-07-15T10:00:00Z", capacity: 8, lane_count: 4, entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-07-20T00:00:00Z" }
              as: StoreStaff
              captures: { ev: $.data.id }
            - call: "POST /race-events/${ev}/transition"
              payload: { action: "OPEN" }
              as: StoreStaff
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cA}", race_class: "STOCK", lane_no: 1, heat_start: "2026-07-15T10:00:00Z", heat_end: "2026-07-15T10:10:00Z" }
              as: StoreStaff
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /race-events/${ev}/entries"
              payload: { customer_id: "${cB}", race_class: "STOCK", lane_no: 1, heat_start: "2026-07-15T10:05:00Z", heat_end: "2026-07-15T10:15:00Z" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LANE_CONFLICT"
            - "http status == 409"

      - name: rt_service_bench_buffer_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_BENCH_CONFLICT]
          - entities.ServiceJob.fields.bench_code
          - entities.ServiceJob.fields.slot_start
        distinguishing_aspect: |
          Bench resource uses a buffered geometry (>= SERVICE_BUFFER_MINUTES=30 gap required),
          a different interval semantics than the lane's adjacency-allowed half-open rule:
          a second job on bench B1 at [10:20,11:00) is only 20 min after [09:00,10:00) → ERR_BENCH_CONFLICT.
        test_recipe:
          setup:
            - "Job1 scheduled on bench B1 [09:00,10:00); Job2 scheduled on bench B1 [10:20,11:00) (gap 20 < 30)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rt2@x.com", full_name: "RT2" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust}", job_type: "REPAIR" }
              as: StoreStaff
              captures: { j1: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust}", job_type: "REPAIR" }
              as: StoreStaff
              captures: { j2: $.data.id }
            - call: "POST /service-jobs/${j1}/transition"
              payload: { action: "SCHEDULE", bench_code: "B1", slot_start: "2026-07-02T09:00:00Z", slot_end: "2026-07-02T10:00:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /service-jobs/${j2}/transition"
              payload: { action: "SCHEDULE", bench_code: "B1", slot_start: "2026-07-02T10:20:00Z", slot_end: "2026-07-02T11:00:00Z" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BENCH_CONFLICT"
            - "http status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_allocation_units_conserved_on_release
        grounds:
          - calculations.campaign_allocation
          - state_machines.PreOrderReservation.ALLOCATED_to_CANCELLED
          - entities.PreOrderCampaign.fields.allocated_units
        distinguishing_aspect: |
          Conserved quantity = allocation units. After allocate (R1=5, R2=3 → campaign.allocated_units=8)
          then cancelling R1, the invariant campaign.allocated_units == sum(allocated_units where
          status IN {ALLOCATED,CONVERTED}) holds at 3 with remaining_units 7.
        test_recipe:
          setup:
            - "Campaign total 10 OPEN; R1 requests 5 (first), R2 requests 3; allocate → both ALLOCATED; then cancel R1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ci1a@x.com", full_name: "CI1A" }
              as: StoreStaff
              captures: { cA: $.data.id }
            - call: "POST /customers"
              payload: { email: "ci1b@x.com", full_name: "CI1B" }
              as: StoreStaff
              captures: { cB: $.data.id }
            - call: "POST /products"
              payload: { sku: "RC-CI1", name: "RC", product_type: "RC_VEHICLE", price_cents: 10000, stock_on_hand: 50 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /campaigns"
              payload: { product_id: "${prod}", title: "Conserve", total_allocation_units: 10, unit_price_cents: 10000, reservation_open_at: "2026-07-01T00:00:00Z", reservation_close_at: "2026-12-31T00:00:00Z" }
              as: StoreStaff
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: StoreStaff
              captures: { cv0: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cA}", requested_units: 5, expected_campaign_version: "${cv0}" }
              as: StoreStaff
              captures: { r1: $.data.id }
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: StoreStaff
              captures: { cv1: $.data.version }
            - call: "POST /campaigns/${camp}/pre-orders"
              payload: { customer_id: "${cB}", requested_units: 3, expected_campaign_version: "${cv1}" }
              as: StoreStaff
              captures: { r2: $.data.id }
            - call: "POST /campaigns/${camp}/allocate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /pre-orders/${r1}/transition"
              payload: { action: "CANCEL" }
              as: StoreStaff
          assert:
            - "PreOrderCampaign.${camp}.allocated_units == 3"
            - "PreOrderCampaign.${camp}.remaining_units == 7"
            - "PreOrderReservation.${r2}.status == ALLOCATED AND allocated_units == 3"

      - name: ci_loyalty_points_conserved_on_order_cancel
        grounds:
          - calculations.loyalty_points
          - state_machines.Order.DRAFT_to_PLACED
          - state_machines.Order.PENDING_to_CANCELLED
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Conserved quantity = loyalty points (a different conserved quantity than allocation units).
          PLACE credits provisional_points=100; the compensating CANCEL debits exactly 100, leaving
          loyalty_points_balance unchanged at 0.
        test_recipe:
          setup:
            - "BRONZE buyer; order total 10000 placed (balance 100), then cancelled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ci2@x.com", full_name: "CI2" }
              as: StoreStaff
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-CI2", name: "Kit", product_type: "KIT", price_cents: 10000, stock_on_hand: 5 }
              as: StoreStaff
              captures: { prod: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", lines: [ { product_id: "${prod}", quantity: 1, unit_price_cents: 10000 } ] }
              as: StoreStaff
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/transition"
              payload: { action: "PLACE" }
              as: StoreStaff
              captures: { prov: $.data.provisional_points }
          trigger:
            - call: "POST /orders/${ord}/transition"
              payload: { action: "CANCEL" }
              as: StoreStaff
            - call: "GET /customers/${cust}"
              payload: {}
              as: StoreStaff
              captures: { bal: $.data.loyalty_points_balance }
          assert:
            - "Order.${ord}.provisional_points == 100"
            - "Customer.${cust}.loyalty_points_balance == 0 after PLACE then CANCEL"
            - "Product.${prod}.stock_on_hand == 5 (restocked)"
