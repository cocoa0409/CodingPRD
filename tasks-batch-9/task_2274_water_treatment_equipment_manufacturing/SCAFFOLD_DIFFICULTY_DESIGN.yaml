            - call: "POST /water-treatment/or-equal-submittals"
              payload: { project_id: "${proj_id}", spec_section: "11 21 13", named_basis_of_design: "Acme MF-6" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { sub_id: "$.data.id", sub_v0: "$.data.version" }
            - call: "POST /water-treatment/or-equal-submittals/${sub_id}/spec-deviations"
              payload: { spec_paragraph: "2.03.B", severity: "MODERATE", description: "Rack frame alloy differs from named basis", expected_or_equal_submittal_version: "${sub_v0}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/or-equal-submittals/${sub_id}/submit"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/or-equal-submittals/${sub_id}/engineer-decision"
              payload: { decision: "PRE_APPROVED" }
              as: EngineerOfRecord
              as_user_id: "eor-1"
