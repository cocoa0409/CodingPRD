            - { call: "POST /med-courier/routes/${rt1}/assign", payload: { driver_id: "${d1}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-06T09:00:00Z", scheduled_end: "2026-05-06T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt2: $.data.id } }
