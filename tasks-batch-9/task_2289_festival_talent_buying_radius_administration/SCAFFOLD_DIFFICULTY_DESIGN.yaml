              payload: { festival_id: "${fest_id}", artist_id: "${artist_pop}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 1, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-06T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 120, window_start_date: "2026-11-04", window_end_date: "2026-12-14", exclusivity_scope: "FULL" }
