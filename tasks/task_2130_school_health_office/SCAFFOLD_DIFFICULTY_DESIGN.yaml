            - "HealthVisit.${visit_a_id}.status == DISPOSITIONED"
            - "Visit B dispose: HTTP status == 409 and data.error_id == ERR_EMS_DISPOSITION_NOT_JUSTIFIED"
            - "HealthVisit.${visit_b_id}.status == IN_ASSESSMENT"
            - "HealthVisit.${visit_b_id}.disposition == null"
            - "School.${sch_id}.occupied_cot_count == 1"

      - name: stock_emergency_empty_candidate_pool_zero_eligible_lots
        grounds:
          - calculations.stock_lot_selection
          - validations[priority=48]
          - errors[ERR_NO_ELIGIBLE_LOT]
          - entities.MedicationStockLot.fields.is_stock_protocol
          - state_machines.AdministrationRecord.null_to_PREPARED
        distinguishing_aspect: |
          Metric = an EMPTY-SET edge on the stock_lot_selection candidate pool
          (zero candidates, not a short-by-N quantity), exercised through a
          DIFFERENT endpoint — POST
          /health-office/administration-records/stock-emergency. The building
          physically holds 5 EPINEPHRINE units, but the pool predicate
          `lot.is_stock_protocol == (protocol_mode == STOCK_EMERGENCY)` excludes
          the student-specific lot, so the pool has exactly zero members and the
          empty-pool fallback ERR_NO_ELIGIBLE_LOT fires rather than
          ERR_INSUFFICIENT_STOCK.
        test_recipe:
          setup:
            - "School IRV10 with emergency_protocol_enabled true, one RN on an ACTIVE Monday block and one ENROLLED student."
            - "Exactly one AVAILABLE EPINEPHRINE lot of 5 units at that building with is_stock_protocol FALSE, so the undesignated-stock pool is empty while the student-specific pool is not."
            - "Clock at 2026-08-03T09:00:00Z; the encounter has been created and assessed, so it sits at IN_ASSESSMENT."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Irving Elementary", building_code: "IRV10", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
