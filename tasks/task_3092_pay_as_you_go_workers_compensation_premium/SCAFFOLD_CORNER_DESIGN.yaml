            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_sch_pol}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "sch-run-2", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { cd_sch_late: $.data.id }
            - call: "GET /wc/policies/${cd_sch_pol}/class-codes"
              as: Underwriter
              captures: { cd_sch_pcc: "$.data[0].id" }
            - call: "POST /wc/disputes"
              payload: { policy_id: "${cd_sch_pol}", policy_class_code_id: "${cd_sch_pcc}", requested_class_code: "8812", effective_from: "2026-09-08T00:00:00Z" }
