            - "Both reviews carry selection_mode == RANDOM, selection_reason == SYSTEMATIC_DRAW, status == SELECTED, high_risk == false and protocol_version_id == ${pv_id}"
            - "GET /dispatchers/${d1_id}/call-records shows ${c1_id} and ${c3_id} in status SELECTED while ${c2_id} and ${c4_id} remain INGESTED"
            - "GET /audit-programs/${prog_id}/sampling-periods shows data[0].selected_review_count == 2 and finalized_review_count == 0"
            - "Re-running the identical draw with requested_count 2 selects ${c2_id} and ${c4_id} (pool is now 2, stride 1) and never re-selects an already-SELECTED call"

      - name: the_pinned_protocol_version_is_frozen_at_selection_time
