  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (3 instances, different pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_requires_formula_active
        grounds:
          - validations[priority=16]
          - state_machines.Formula.APPROVED_to_ACTIVE
          - errors[ERR_FORMULA_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair ProductionOrder -> Formula: an order for an APPROVED (but not yet
          ACTIVE) formula is rejected with ERR_FORMULA_NOT_ACTIVE; after activation
          the same request succeeds.
        test_recipe:
          setup:
            - "Customer; formula F whose INCI_LIST review is APPROVED (formula APPROVED, not ACTIVE)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
