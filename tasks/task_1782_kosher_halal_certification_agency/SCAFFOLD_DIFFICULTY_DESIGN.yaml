            - { call: "POST /api/equipment-lines/${eIV}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${fIV}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: AccountManager, captures: { vIV: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vIV}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vIV}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${fIV}/approve", as: CertificationReviewer }
            - { call: "POST /api/agreements", payload: { client_id: "${cIV}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cIV_v}" }, as: AccountManager, captures: { aIV: $.data.id } }
            - { call: "POST /api/agreements/${aIV}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${cIV}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${aIV}" }, as: AccountManager, captures: { invIV: $.data.id } }
            - { call: "POST /api/invoices/${invIV}/record-payment", as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /api/ingredients", payload: { client_id: "${cIV}", name: "IngIV", manufacturer: "M1", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cIV}", captures: { iIV: $.data.id } }
            - { call: "POST /api/ingredients/${iIV}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${iIV}/approve", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cIV}", brand: "BIV", name: "PIV1", ingredient_ids: ["${iIV}"] }, as: ClientContact, as_user_id: "${cIV}", captures: { pIV1: $.data.id } }
            - { call: "POST /api/products/${pIV1}/submit-review", as: ClientContact, as_user_id: "${cIV}" }
            - { call: "POST /api/products/${pIV1}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${cIV}", brand: "BIV", name: "PIV2", ingredient_ids: ["${iIV}"] }, as: ClientContact, as_user_id: "${cIV}", captures: { pIV2: $.data.id } }
            - { call: "POST /api/products/${pIV2}/submit-review", as: ClientContact, as_user_id: "${cIV}" }
            - { call: "POST /api/products/${pIV2}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${cIV}", scheme: "KOSHER", term_type: "ANNUAL", facility_ids: ["${fIV}"], product_ids: ["${pIV1}"] }, as: CertificateOfficer, captures: { certIV: $.data.id } }
            - { call: "POST /api/certificates/${certIV}/issue", as: CertificateOfficer, as_user_id: "co-1" }
