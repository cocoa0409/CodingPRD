          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FieldStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

