              as: FleetOpsController
              as_user_id: "ops-1"
            - call: "POST /sites/${s1}/secure-release-config"
              payload: { release_method: "PIN", probe_result: "PASS", network_vlan_tag: 2001 }
              as: CustomerAdmin
              as_user_id: "${s1}"
