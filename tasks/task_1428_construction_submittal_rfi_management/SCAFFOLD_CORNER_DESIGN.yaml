# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Construction Submittal & RFI Management. Enumerates the testable claims of
# §1.1–§1.7 NOT already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml; overlaps are
# emitted as excluded_because stubs. Sections/claim_types follow
# references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: project_creation_applies_documented_defaults
        claim_type: defaults
        grounds: [entities.Project]
        distinguishing_aspect: "Minimal create yields SETUP posture, version 1, and every documented default (rfi_response_days 10, ack_required_days 5, mobilization_buffer_days 2, long_lead_threshold_days 30, expedite_window_days 10, holiday_dates [], contingency ledger zeroed)."
        test_recipe:
          setup: ["empty DB; clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/projects"
              payload: { project_name: "Defaults" }
              as: PlatformAdmin
              captures: { posture: $.data.posture, v: $.data.version, resp: $.data.rfi_response_days, ack: $.data.ack_required_days, buf: $.data.mobilization_buffer_days, ll: $.data.long_lead_threshold_days, ew: $.data.expedite_window_days, hol: $.data.holiday_dates, avail: $.data.contingency_available_cents, scan: $.data.ops_scan_index }
          assert:
            - "posture == SETUP and v == 1 and scan == 0"
            - "resp == 10 and ack == 5 and buf == 2 and ll == 30 and ew == 10"
            - "hol == [] and avail == 0 (initial_contingency default 0)"

      - name: spec_section_missing_required_section_number_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.SpecSection, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "section_number is the only required input on create; omitting it returns 400 ERR_INVALID_REQUEST before any state/business check."
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { title: "no number" }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and http status == 400"

      - name: spec_section_invalid_enum_kind_rejected
        claim_type: type_constraints
        grounds: [entities.SpecSection.fields.required_submittal_kinds, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A kind outside PRODUCT_DATA|SHOP_DRAWINGS|SAMPLES|MOCKUP|CERTIFICATES|O_AND_M_MANUALS is rejected at shape validation."
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "099999", required_submittal_kinds: ["BOGUS_KIND"] }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: spec_section_duplicate_kinds_rejected
        claim_type: type_constraints
        grounds: [entities.SpecSection.fields.required_submittal_kinds, "validations[priority=5]"]
        distinguishing_aspect: "Duplicate members in required_submittal_kinds (['SAMPLES','SAMPLES']) are a shape violation (ERR_INVALID_REQUEST), not a business error."
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "033000", required_submittal_kinds: ["SAMPLES", "SAMPLES"] }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: spec_section_responsible_subcontractor_fk_must_exist
        claim_type: parent_relationships
        grounds: [entities.SpecSection.fields.responsible_subcontractor_id, "errors[ERR_SUBCONTRACTOR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a responsible_subcontractor_id that does not exist in the project is a 404 existence failure."
        test_recipe:
          setup: ["project exists"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "033000", responsible_subcontractor_id: "00000000-0000-0000-0000-000000000000" }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUBCONTRACTOR_NOT_FOUND and http status == 404"

      - name: rfi_create_computed_due_date_input_ignored
        claim_type: computed_fields
        grounds: [entities.RFI.fields.due_date, calculations.rfi_due_date]
        distinguishing_aspect: "A client-supplied due_date (a computed field) is ignored, not honored: with clock 2026-08-03 and rfi_response_days 10 the response due_date is 2026-08-17, never the supplied value."
        test_recipe:
          setup: ["project ACTIVE; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "S", question_text: "Q", due_date: "2020-01-01", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { due: $.data.due_date }
          assert:
            - "due == 2026-08-17 (computed), not the supplied 2020-01-01"

      - name: submittal_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SUBMITTAL_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent submittal UUID returns 404 ERR_SUBMITTAL_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/submittals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUBMITTAL_NOT_FOUND and http status == 404"

      - name: register_generation_assigns_item_numbers_and_initial_states
        claim_type: creation
        grounds: [entities.Submittal.fields.item_number, state_machines.Submittal.review_status]
        distinguishing_aspect: "Section activation with 3 kinds generates 3 REGISTERED submittals numbered 033000-01/-02/-03 in kind order, expediting NOT_REQUIRED for short lead."
        test_recipe:
          setup: ["project ACTIVE; section 033000 lead 5 with 3 kinds"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "033000", lead_time_days: 5, default_need_date: "2026-10-30", required_submittal_kinds: ["PRODUCT_DATA", "SHOP_DRAWINGS", "SAMPLES"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { n1: "$.data[0].item_number", n2: "$.data[1].item_number", n3: "$.data[2].item_number", st1: "$.data[0].review_status", ex1: "$.data[0].expediting_status", ll1: "$.data[0].is_long_lead" }
          assert:
            - "n1 == 033000-01 and n2 == 033000-02 and n3 == 033000-03"
            - "st1 == REGISTERED and ex1 == NOT_REQUIRED and ll1 == false (lead 5 < threshold 30)"

      - name: long_lead_item_created_only_at_or_above_threshold
        claim_type: computed_fields
        grounds: [entities.Submittal.fields.is_long_lead, entities.LongLeadItem]
        distinguishing_aspect: "Lead 30 (>= threshold 30) auto-creates a LongLeadItem and sets expediting MONITORING; lead 29 creates no LLI (empty array from the sub-resource GET)."
        test_recipe:
          setup: ["project ACTIVE; section A lead 30, section B lead 29; both activated"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", lead_time_days: 30, default_need_date: "2026-10-30" }
              as: ProjectEngineer
              captures: { sec_a: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "033000", lead_time_days: 29, default_need_date: "2026-10-30" }
              as: ProjectEngineer
              captures: { sec_b: $.data.id }
            - call: "POST /v1/spec-sections/${sec_a}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "POST /v1/spec-sections/${sec_b}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_a}" }
              as: ProjectEngineer
              captures: { sa: "$.data[0].id", sa_ll: "$.data[0].is_long_lead", sa_ex: "$.data[0].expediting_status" }
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_b}" }
              as: ProjectEngineer
              captures: { sb: "$.data[0].id", sb_ll: "$.data[0].is_long_lead" }
          trigger:
            - call: "GET /v1/submittals/${sa}/long-lead-item"
              payload: {}
              as: ProjectEngineer
              captures: { lli_a: "$.data[0].id" }
            - call: "GET /v1/submittals/${sb}/long-lead-item"
              payload: {}
              as: ProjectEngineer
          assert:
            - "sa_ll == true and sa_ex == MONITORING and lli_a is non-null"
            - "sb_ll == false and the second GET returns an empty array (no capture possible)"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: return_before_route_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SubmittalRevision.status, "errors[ERR_REVISION_NOT_UNDER_REVIEW]"]
        distinguishing_aspect: "return on a SUBMITTED (never routed) revision fails ERR_REVISION_NOT_UNDER_REVIEW; reviewer identity is irrelevant because state is checked."
        test_recipe:
          setup: ["project ACTIVE; sub C1; reviewer R1; section (responsible C1) activated; revision submitted on S"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "SteelFab", trade: "steel" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", responsible_subcontractor_id: "${c1_id}" }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { s: "$.data[0].id" }
            - call: "GET /v1/submittals/${s}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v: $.data.version }
            - call: "POST /v1/submittals/${s}/revisions"
              payload: { document_ref: "doc://r0", expected_submittal_version: "${s_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /v1/revisions/${rev}/return"
              payload: { action_code: "A" }
              as: Reviewer
              as_user_id: "${r1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REVISION_NOT_UNDER_REVIEW (return requires UNDER_REVIEW)"

      - name: route_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.SubmittalRevision.status.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_REVISION_NOT_SUBMITTED]"]
        distinguishing_aspect: "Re-routing an already UNDER_REVIEW revision fails ERR_REVISION_NOT_SUBMITTED; the first route's reviewer assignment and open_review_count are unchanged."
        test_recipe:
          setup: ["project ACTIVE; sub C1; reviewer R1; revision submitted and routed to R1"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "SteelFab", trade: "steel" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", responsible_subcontractor_id: "${c1_id}" }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { s: "$.data[0].id" }
            - call: "GET /v1/submittals/${s}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v: $.data.version }
            - call: "POST /v1/submittals/${s}/revisions"
              payload: { document_ref: "doc://r0", expected_submittal_version: "${s_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev: $.data.id }
            - call: "POST /v1/revisions/${rev}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
          trigger:
            - call: "POST /v1/revisions/${rev}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
            - call: "GET /v1/reviewers/${r1_id}"
              payload: {}
              as: ProjectEngineer
              captures: { cnt: $.data.open_review_count }
          assert:
            - "err == ERR_REVISION_NOT_SUBMITTED"
            - "cnt == 1 (no double increment)"

      - name: close_rfi_in_open_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RFI.status, "errors[ERR_RFI_INVALID_STATE]"]
        distinguishing_aspect: "close requires ANSWERED; an OPEN RFI rejects with ERR_RFI_INVALID_STATE."
        test_recipe:
          setup: ["project ACTIVE; one RFI created (OPEN), not routed"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "S", question_text: "Q", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi: $.data.id }
          trigger:
            - call: "POST /v1/rfis/${rfi}/close"
              payload: {}
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RFI_INVALID_STATE"

      - name: answer_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RFI.status.ROUTED_to_ANSWERED, "errors[ERR_RFI_INVALID_STATE]"]
        distinguishing_aspect: "A second answer on an already ANSWERED RFI (without reopen) fails ERR_RFI_INVALID_STATE."
        test_recipe:
          setup: ["project ACTIVE; reviewer R1; RFI routed and answered once"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "S", question_text: "Q", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi: $.data.id }
            - call: "POST /v1/rfis/${rfi}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi}/answer"
              payload: { answer_text: "a1", cost_impact_flag: false, schedule_impact_flag: false }
              as: Reviewer
              as_user_id: "${r1_id}"
          trigger:
            - call: "POST /v1/rfis/${rfi}/answer"
              payload: { answer_text: "a2", cost_impact_flag: false, schedule_impact_flag: false }
              as: Reviewer
              as_user_id: "${r1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RFI_INVALID_STATE (answer requires ROUTED)"

      - name: void_submittal_terminal_lockdown_and_compensation
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Submittal.review_status, "errors[ERR_SUBMITTAL_TERMINAL]"]
        distinguishing_aspect: "Voiding a submittal with an UNDER_REVIEW revision supersedes the revision, decrements the reviewer count (compensation), and any later revision submit fails ERR_SUBMITTAL_TERMINAL."
        test_recipe:
          setup: ["project ACTIVE; sub C1; reviewer R1; long-lead section (lead 35, need 2026-10-30) activated; revision submitted and routed to R1 (count 1)"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "SteelFab", trade: "steel" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", lead_time_days: 35, default_need_date: "2026-10-30", responsible_subcontractor_id: "${c1_id}" }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { s: "$.data[0].id" }
            - call: "GET /v1/submittals/${s}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v: $.data.version }
            - call: "POST /v1/submittals/${s}/revisions"
              payload: { document_ref: "doc://r0", expected_submittal_version: "${s_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev: $.data.id }
            - call: "POST /v1/revisions/${rev}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/submittals/${s}/void"
              payload: { reason: "scope cut" }
              as: ProjectManager
          trigger:
            - call: "GET /v1/revisions/${rev}"
              payload: {}
              as: ProjectEngineer
              captures: { rev_st: $.data.status }
            - call: "GET /v1/reviewers/${r1_id}"
              payload: {}
              as: ProjectEngineer
              captures: { cnt: $.data.open_review_count }
            - call: "GET /v1/submittals/${s}/long-lead-item"
              payload: {}
              as: ProjectEngineer
              captures: { lli_st: "$.data[0].status" }
            - call: "GET /v1/submittals/${s}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v2: $.data.version, s_st: $.data.review_status, s_ex: $.data.expediting_status }
            - call: "POST /v1/submittals/${s}/revisions"
              payload: { document_ref: "doc://r1", expected_submittal_version: "${s_v2}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rev_st == SUPERSEDED and cnt == 0 (void compensated the held review)"
            - "lli_st == CANCELLED and s_ex == NOT_REQUIRED"
            - "s_st == VOID and err == ERR_SUBMITTAL_TERMINAL on the late revision submit"

      - name: publish_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.OwnerReport.status, "errors[ERR_REPORT_NOT_DRAFT]"]
        distinguishing_aspect: "Publishing a PUBLISHED report fails ERR_REPORT_NOT_DRAFT; snapshot stays frozen from the first publish."
        test_recipe:
          setup: ["project ACTIVE; report created and published"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "P" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/owner-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_project_version: "${p_v}" }
              as: ProjectEngineer
