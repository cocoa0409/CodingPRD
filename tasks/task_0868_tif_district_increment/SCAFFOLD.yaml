scenario: "TIF District & Increment Accounting: district & base-value, increment calculation & capture, project-fund & developer note, pay-as-you-go vs bond, obligation & disbursement, annual TIF report & surplus, termination/decertification, overlapping-taxing-body split"
domain_name: "tif-increment-accounting"
api_prefix: ""

# NOTE: This scaffold has no logical clock. All temporal reasoning is expressed
# through explicit integer tax-year fields supplied in requests (base_tax_year,
# tax_year, issue_tax_year, final_maturity_tax_year, report_tax_year,
# termination_tax_year, start_tax_year, end_tax_year). `created_at`/`updated_at`
# are server wall-clock stamps used only for audit/tie-break, never asserted for
# an exact value by any test.

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Waterfall / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (district_id, developer_id, obligation_id,
  # taxing_body_id). Action endpoints are nested under their owning resource for
  # ergonomics, but there is no deep ownership tree — obligations, funds, increment
  # records, reports, distributions and agreements are all first-class rows keyed
  # by FK, not URL-nested aggregates.

  state_machine_shape: cyclic
  # Obligation has a revision loop (UNDER_REVIEW -> PROPOSED); IncrementRecord has
  # a finalize/reopen cycle (CERTIFIED <-> FINALIZED); AnnualReport has a return
  # loop (FILED -> DRAFT). TifDistrict is branching (two divergent decertification
  # side-effect sets).

  relationship_patterns:
    - one_to_many          # District -> {TaxingBody, Obligation, IncrementRecord, AnnualReport}
    - cross_aggregate      # Disbursement -> Obligation -> ProjectFund(district); SurplusDistribution -> TaxingBody
    - polymorphic          # SurplusDistribution.source: ANNUAL (report) vs DECERTIFICATION (sweep)

  role_model: segregation_of_duties
  # MunicipalAdmin registers an obligation and stores registered_by_user_id; a
  # DIFFERENT MunicipalAdmin identity must authorize disbursements against it
  # (four-eyes). Developer proposes; CountyClerk certifies EAV and files reports;
  # MunicipalAdmin accepts reports (filer != accepter role).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TifDistrict
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "District display name"
      - name: municipality_name
        type: string
        source: input
        description: "Municipality that created the district"
      - name: base_tax_year
        type: integer
        source: input
        description: "Tax year at which the base EAV is frozen"
      - name: base_eav_cents
        type: integer
        source: input
        description: "Base equalized assessed value (in cents); frozen/locked at certification. Overlapping taxing bodies keep receiving tax on this base."
        constraints: "> 0; immutable after status leaves DRAFT"
      - name: term_years
        type: integer
        source: input
        description: "District lifespan in tax years"
        constraints: "1..23"
      - name: surplus_policy
        type: enum
        source: input
        description: "Which surplus variant the annual report uses"
        default: "GROSS"
        constraints: "one of {GROSS, NET}"
      - name: certification_date
        type: datetime
        source: computed
        description: "Server wall-clock stamp set when district is certified; null while DRAFT"
      - name: expiration_tax_year
        type: integer
        source: computed
        description: "base_tax_year + term_years; set at certification"
      - name: aggregate_tax_rate
        type: number
        source: computed
        description: "Sum of all TaxingBody.tax_rate for this district; frozen at certification"
      - name: obligations_cleared
        type: boolean
        source: computed
        description: "True once every Obligation of this district is in a terminal state {SATISFIED, DEFEASED, DEFAULTED, REJECTED}"
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "DRAFT"
        constraints: "one of {DRAFT, CERTIFIED, DECERTIFIED}"

  - name: TaxingBody
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> TifDistrict.id; the overlapping district this body taxes"
      - name: name
        type: string
        source: input
        description: "Body name (e.g., 'Unit School District 200')"
      - name: body_type
        type: enum
        source: input
        description: "Category of taxing body"
        constraints: "one of {SCHOOL, COUNTY, MUNICIPAL, PARK, LIBRARY, OTHER}"
      - name: tax_rate
        type: number
        source: input
        description: "This body's levy rate as a decimal fraction of EAV"
        constraints: "> 0 and < 1"
      - name: total_surplus_received_cents
        type: integer
        source: computed
        description: "Running sum of surplus distributions paid to this body"
        default: 0

  - name: Developer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Developer legal entity name"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"

  - name: ProjectFund
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> TifDistrict.id; 1:1 fund created at certification"
      - name: balance_cents
        type: integer
        source: computed
        description: "Current cash held in the special TIF allocation fund"
        default: 0
      - name: lifetime_increment_cents
        type: integer
        source: computed
        description: "Cumulative captured increment credited to this fund (net of admin fee)"
        default: 0
      - name: lifetime_disbursed_cents
        type: integer
        source: computed
        description: "Cumulative net disbursed to obligations (PAID minus VOIDED)"
        default: 0
      - name: lifetime_surplus_cents
        type: integer
        source: computed
        description: "Cumulative surplus paid out to taxing bodies (annual + decertification sweep)"
        default: 0
      - name: lifetime_admin_fee_cents
        type: integer
        source: computed
        description: "Cumulative county admin fee withheld from gross increment"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN while district active; CLOSED at decertification"
        default: "OPEN"
        constraints: "one of {OPEN, CLOSED}"

  - name: Obligation
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> TifDistrict.id; the district whose increment backs this obligation"
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; required for DEVELOPER_NOTE, null for BOND"
        default: null
      - name: obligation_type
        type: enum
        source: input
        description: "DEVELOPER_NOTE = pay-as-you-go reimbursement (subordinate); BOND = municipal TIF bond (senior, scheduled)"
        constraints: "one of {DEVELOPER_NOTE, BOND}"
      - name: principal_cents
        type: integer
        source: input
        description: "Original principal of the note/bond"
        constraints: "> 0"
      - name: interest_rate_bps
        type: integer
        source: input
        description: "Annual interest in basis points (bps/10000 = fraction)"
        constraints: ">= 0"
      - name: issue_tax_year
        type: integer
        source: input
        description: "Tax year the obligation is issued"
      - name: final_maturity_tax_year
        type: integer
        source: input
        description: "Tax year the obligation must be fully paid by"
        constraints: ">= issue_tax_year"
      - name: annual_cap_cents
        type: integer
        source: input
        description: "Max total disbursed to this obligation within a single tax year; null = uncapped"
        default: null
      - name: seniority
        type: enum
        source: computed
        description: "Derived at registration from obligation_type: BOND->SENIOR, DEVELOPER_NOTE->SUBORDINATE"
        constraints: "one of {SENIOR, SUBORDINATE}"
      - name: priority_rank
        type: integer
        source: input
        description: "Tie-order within a seniority tier; supplied on the register call (lower rank paid first)"
      - name: principal_remaining_cents
        type: integer
        source: computed
        description: "Unpaid principal; initialized to principal_cents at registration"
        default: 0
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "Unpaid accrued interest"
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "principal_remaining_cents + accrued_interest_cents"
        default: 0
      - name: registered_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MunicipalAdmin who registered it; used for four-eyes SoD on disbursement"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "PROPOSED"
        constraints: "one of {PROPOSED, UNDER_REVIEW, REGISTERED, SATISFIED, DEFEASED, DEFAULTED, REJECTED}"

  - name: IncrementRecord
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> TifDistrict.id; the district this annual assessment belongs to"
      - name: tax_year
        type: integer
        source: input
        description: "Tax year of this increment assessment"
      - name: current_eav_cents
        type: integer
        source: input
        description: "Current equalized assessed value for this tax year"
        constraints: ">= 0"
      - name: incremental_eav_cents
        type: integer
        source: computed
        description: "max(0, current_eav_cents - district.base_eav_cents)"
      - name: gross_increment_cents
        type: integer
        source: computed
        description: "Increment tax revenue before admin fee; provisional vs final variant differ by collection_rate"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "County collection/admin fee withheld from gross_increment_cents"
      - name: captured_increment_cents
        type: integer
        source: computed
        description: "gross_increment_cents - admin_fee_cents; net amount credited to ProjectFund"
      - name: collection_rate
        type: number
        source: input
        description: "Actual collection fraction supplied at finalize; null while PROVISIONAL"
        default: null
        constraints: "> 0 and <= 1"
      - name: variant_state
        type: enum
        source: computed
        description: "PROVISIONAL (assumes full collection) or FINAL (uses collection_rate)"
        default: "PROVISIONAL"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "CERTIFIED"
        constraints: "one of {CERTIFIED, FINALIZED}"

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: obligation_id
        type: string
        source: input
        description: "FK -> Obligation.id; obligation being paid from the fund"
      - name: amount_cents
        type: integer
        source: input
        description: "Total paid (interest first, then principal)"
        constraints: "> 0"
      - name: interest_portion_cents
        type: integer
        source: computed
        description: "min(amount_cents, obligation.accrued_interest_cents at time of pay)"
      - name: principal_portion_cents
        type: integer
        source: computed
        description: "amount_cents - interest_portion_cents"
      - name: disbursement_tax_year
        type: integer
        source: input
        description: "Tax year the disbursement is charged to (for annual_cap accounting)"
      - name: status
        type: enum
        source: system
        description: "PAID on creation; VOIDED after a compensating void"
        default: "PAID"
        constraints: "one of {PAID, VOIDED}"

  - name: AnnualReport
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> TifDistrict.id"
      - name: report_tax_year
        type: integer
        source: input
        description: "Tax year the report covers"
      - name: total_increment_cents
        type: integer
        source: computed
        description: "Snapshot of fund.lifetime_increment_cents when filed"
      - name: total_disbursed_cents
        type: integer
        source: computed
        description: "Snapshot of fund.lifetime_disbursed_cents when filed"
      - name: ending_balance_cents
        type: integer
        source: computed
        description: "Snapshot of fund.balance_cents when accepted"
      - name: obligation_reserve_cents
        type: integer
        source: computed
        description: "Reserve withheld before surplus; GROSS = near-term senior debt service, NET = all senior outstanding"
      - name: surplus_declared_cents
        type: integer
        source: computed
        description: "max(0, ending_balance_cents - obligation_reserve_cents); computed at accept"
      - name: surplus_basis
        type: enum
        source: computed
        description: "Copied from district.surplus_policy at accept"
        constraints: "one of {GROSS, NET}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "DRAFT"
        constraints: "one of {DRAFT, FILED, ACCEPTED}"

  - name: SurplusDistribution
    parent: null
    common_fields: false
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> TifDistrict.id"
      - name: taxing_body_id
        type: string
        source: input
        description: "FK -> TaxingBody.id; body receiving this share"
      - name: source
        type: enum
        source: system
        description: "ANNUAL (from an accepted report) or DECERTIFICATION (final sweep)"
        constraints: "one of {ANNUAL, DECERTIFICATION}"
      - name: report_tax_year
        type: integer
        source: system
        description: "Tax year the distribution is attributed to"
      - name: amount_cents
        type: integer
        source: computed
        description: "This body's cents of the surplus after largest-remainder rounding"
      - name: share_ppm
        type: integer
        source: computed
        description: "Body weight in parts-per-million = round(1000000 * body.tax_rate / district.aggregate_tax_rate), unless a covering SurplusAgreement override applies"

  - name: SurplusAgreement
    parent: null
    common_fields: false
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> TifDistrict.id"
      - name: taxing_body_id
        type: string
        source: input
        description: "FK -> TaxingBody.id; body whose surplus share this agreement overrides"
      - name: start_tax_year
        type: integer
        source: input
        description: "Inclusive first tax year the override applies"
      - name: end_tax_year
        type: integer
        source: input
        description: "Exclusive last tax year; window is half-open [start_tax_year, end_tax_year)"
        constraints: "> start_tax_year"
      - name: surplus_share_ppm_override
        type: integer
        source: input
        description: "Fixed share in parts-per-million used instead of the proportional rate share while this window covers the report year"
        constraints: "0..1000000"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TifDistrict
    initial_state: DRAFT
    terminal_states: [DECERTIFIED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /tif-districts/{id}/certify"
        actor: MunicipalAdmin
        preconditions:
          - "district.status == DRAFT"
          - "at least one TaxingBody exists for the district (else ERR_NO_TAXING_BODIES)"
          - "base_eav_cents > 0"
        side_effects:
          - "run certify_district_setup: expiration_tax_year = base_tax_year + term_years; aggregate_tax_rate = sum(TaxingBody.tax_rate); certification_date = wall clock"
          - "base_eav_cents becomes immutable"
          - "create ProjectFund{district_id, balance_cents:0, status:OPEN}"
          - "increments TifDistrict.version by 1"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /tif-districts/{id}/decertify with termination_type=EXPIRATION"
        actor: MunicipalAdmin
        preconditions:
          - "district.status == CERTIFIED"
          - "termination_tax_year >= district.expiration_tax_year (else ERR_TERM_NOT_EXPIRED)"
          - "every SENIOR (BOND) Obligation is in {SATISFIED, DEFEASED} (else ERR_SENIOR_OBLIGATION_OUTSTANDING) [cross-entity: District depends on Obligation]"
        side_effects:
          - "each REGISTERED DEVELOPER_NOTE (subordinate/PAYG) Obligation -> DEFEASED (forgiven; principal_remaining and accrued_interest and outstanding_balance set to 0) [conditional cascade, branch = EXPIRATION]"
          - "run decertification_sweep: remaining ProjectFund.balance_cents distributed to taxing bodies via surplus_taxing_body_split, creating SurplusDistribution{source:DECERTIFICATION} rows [cascade depth-3: district -> fund -> distributions -> taxing bodies]"
          - "each created SurplusDistribution increments its TaxingBody.total_surplus_received_cents"
          - "ProjectFund.status -> CLOSED, balance_cents -> 0, lifetime_surplus_cents += swept amount"
          - "obligations_cleared -> true; increments TifDistrict.version by 1"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /tif-districts/{id}/decertify with termination_type=EARLY"
        actor: MunicipalAdmin
        preconditions:
          - "district.status == CERTIFIED"
          - "termination_tax_year < district.expiration_tax_year (else ERR_EARLY_TERM_NOT_ALLOWED)"
          - "every SENIOR (BOND) Obligation is in {SATISFIED, DEFEASED} (else ERR_SENIOR_OBLIGATION_OUTSTANDING)"
        side_effects:
          - "each REGISTERED DEVELOPER_NOTE Obligation -> DEFAULTED (NOT forgiven; outstanding_balance preserved as a defaulted claim) [conditional cascade, branch = EARLY; divergent side-effect set vs EXPIRATION]"
          - "run decertification_sweep identical to EXPIRATION branch (sweep remaining balance to taxing bodies)"
          - "ProjectFund.status -> CLOSED, balance_cents -> 0"
          - "obligations_cleared -> true; increments TifDistrict.version by 1"

  - entity: Obligation
    initial_state: PROPOSED
    terminal_states: [SATISFIED, DEFEASED, DEFAULTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /obligations/{id}/submit"
        actor: Developer | MunicipalAdmin
        preconditions:
          - "obligation.status == PROPOSED"
          - "when actor is Developer (DEVELOPER_NOTE): acting X-User-ID == obligation.developer_id (ownership); BOND submitted by MunicipalAdmin"
        side_effects: ["increments Obligation.version by 1"]
      - from: UNDER_REVIEW
        to: PROPOSED
        trigger: "POST /obligations/{id}/return"
        actor: MunicipalAdmin
        preconditions: ["obligation.status == UNDER_REVIEW"]
        side_effects: ["increments Obligation.version by 1"]
        note: "Revision loop (cyclic): reviewer bounces the proposal back to the developer."
      - from: UNDER_REVIEW
        to: REGISTERED
        trigger: "POST /obligations/{id}/register"
        actor: MunicipalAdmin
        preconditions:
          - "obligation.status == UNDER_REVIEW"
          - "district.status == CERTIFIED (else ERR_DISTRICT_NOT_CERTIFIED) [cross-entity: Obligation depends on District]"
          - "final_maturity_tax_year <= district.expiration_tax_year (else ERR_BOND_MATURITY_OUT_OF_TERM)"
          - "expected_district_version matches TifDistrict.version (else ERR_STALE_DISTRICT_VERSION)"
        side_effects:
          - "seniority = (BOND -> SENIOR, DEVELOPER_NOTE -> SUBORDINATE)"
          - "principal_remaining_cents = principal_cents; accrued_interest_cents = 0; outstanding_balance_cents = principal_cents"
          - "registered_by_user_id = acting X-User-ID"
          - "increments TifDistrict.version by 1 (registration changes the disbursement waterfall the client reasoned about) and Obligation.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /obligations/{id}/reject"
        actor: MunicipalAdmin
        preconditions: ["obligation.status == UNDER_REVIEW"]
        side_effects: ["recompute district.obligations_cleared; increments Obligation.version by 1"]
      - from: REGISTERED
        to: SATISFIED
        trigger: "system (auto) when outstanding_balance_cents reaches 0 after a disbursement pays it down"
        actor: system
        preconditions: ["obligation.status == REGISTERED", "outstanding_balance_cents == 0"]
        side_effects:
          - "recompute district.obligations_cleared; if now true, no further action [bubble-up]"
          - "increments Obligation.version by 1"
        note: "Cascade link caused by the disbursement reducing outstanding_balance_cents to exactly 0."
      - from: REGISTERED
        to: DEFEASED
        trigger: "system on district decertify (any branch) for DEVELOPER_NOTE, OR on EXPIRATION branch"
        actor: system
        preconditions: ["obligation.status == REGISTERED", "obligation.obligation_type == DEVELOPER_NOTE"]
        side_effects: ["principal_remaining_cents, accrued_interest_cents, outstanding_balance_cents -> 0; increments Obligation.version by 1"]
      - from: REGISTERED
        to: DEFAULTED
        trigger: "system on district decertify EARLY branch for DEVELOPER_NOTE"
        actor: system
        preconditions: ["obligation.status == REGISTERED", "obligation.obligation_type == DEVELOPER_NOTE"]
        side_effects: ["outstanding_balance_cents preserved; increments Obligation.version by 1"]

  - entity: IncrementRecord
    initial_state: CERTIFIED
    terminal_states: []
    transitions:
      - from: __create__
        to: CERTIFIED
        trigger: "POST /tif-districts/{id}/increment-records"
        actor: CountyClerk
        preconditions:
          - "district.status == CERTIFIED (else ERR_DISTRICT_NOT_CERTIFIED) [cross-entity: IncrementRecord depends on District]"
          - "no existing IncrementRecord for (district_id, tax_year) (else ERR_INCREMENT_YEAR_EXISTS) [temporal overlap: one record per tax-year slot]"
          - "tax_year > district.base_tax_year and tax_year <= district.expiration_tax_year"
        side_effects:
          - "run increment_capture provisional variant: incremental_eav, gross_increment, admin_fee, captured_increment"
          - "ProjectFund.balance_cents += captured_increment_cents; lifetime_increment_cents += captured_increment_cents; lifetime_admin_fee_cents += admin_fee_cents"
          - "increments ProjectFund.version by 1"
      - from: CERTIFIED
        to: FINALIZED
        trigger: "POST /increment-records/{id}/finalize"
        actor: CountyClerk
        preconditions: ["record.status == CERTIFIED", "0 < collection_rate <= 1"]
        side_effects:
          - "recompute with increment_capture final variant (uses collection_rate); compute delta = captured_final - captured_provisional"
          - "ProjectFund.balance_cents += delta; lifetime_increment_cents += delta; lifetime_admin_fee_cents += (admin_fee_final - admin_fee_provisional)"
          - "variant_state -> FINAL; increments ProjectFund.version by 1"
      - from: FINALIZED
        to: CERTIFIED
        trigger: "POST /increment-records/{id}/reopen"
        actor: CountyClerk
        preconditions: ["record.status == FINALIZED"]
        side_effects:
          - "compensation: reverse the finalize delta (ProjectFund.balance_cents -= delta; lifetime_increment_cents -= delta; lifetime_admin_fee restored)"
          - "collection_rate -> null; variant_state -> PROVISIONAL; captured_increment restored to provisional; increments ProjectFund.version by 1"
        note: "Finalize/reopen cycle. incremental_eav_cents and current_eav_cents are untouched -> EAV split invariant preserved."

  - entity: Disbursement
    initial_state: PAID
    terminal_states: [VOIDED]
    transitions:
      - from: __create__
        to: PAID
        trigger: "POST /obligations/{id}/disbursements"
        actor: MunicipalAdmin
        preconditions:
          - "obligation.status == REGISTERED (else ERR_OBLIGATION_NOT_REGISTERED) [cross-entity: Disbursement depends on Obligation]"
          - "district.status == CERTIFIED (else ERR_DISTRICT_NOT_CERTIFIED)"
          - "acting X-User-ID != obligation.registered_by_user_id (else ERR_SEGREGATION_OF_DUTIES) [four-eyes]"
          - "if obligation.seniority == SUBORDINATE: no SENIOR Obligation of this district has outstanding_balance_cents > 0 (else ERR_SENIORITY_ORDER_VIOLATION)"
          - "amount_cents > 0 (else ERR_AMOUNT_NOT_POSITIVE)"
          - "amount_cents <= disbursement_allocation cap = min(fund.balance_cents, outstanding_balance_cents, annual_cap_remaining); over balance -> ERR_INSUFFICIENT_FUND_BALANCE; over annual cap -> ERR_DISBURSEMENT_CAP_EXCEEDED"
          - "expected_fund_version matches ProjectFund.version (else ERR_STALE_FUND_VERSION)"
        side_effects:
          - "interest_portion_cents = min(amount_cents, obligation.accrued_interest_cents); principal_portion_cents = amount_cents - interest_portion_cents"
          - "obligation.accrued_interest_cents -= interest_portion_cents; obligation.principal_remaining_cents -= principal_portion_cents; obligation.outstanding_balance_cents -= amount_cents [cascade link 1]"
          - "if obligation.outstanding_balance_cents == 0 -> Obligation auto-transitions REGISTERED->SATISFIED [cascade link 2]"
          - "ProjectFund.balance_cents -= amount_cents; lifetime_disbursed_cents += amount_cents; increments ProjectFund.version by 1"
      - from: PAID
        to: VOIDED
        trigger: "POST /disbursements/{id}/void"
        actor: MunicipalAdmin
        preconditions: ["disbursement.status == PAID (else ERR_DISBURSEMENT_NOT_VOIDABLE)"]
        side_effects:
          - "compensation: obligation.accrued_interest_cents += interest_portion_cents; obligation.principal_remaining_cents += principal_portion_cents; obligation.outstanding_balance_cents += amount_cents"
          - "if the obligation had auto-transitioned to SATISFIED by this disbursement, revert it REGISTERED"
          - "ProjectFund.balance_cents += amount_cents; lifetime_disbursed_cents -= amount_cents; increments ProjectFund.version by 1"

  - entity: AnnualReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /annual-reports/{id}/file"
        actor: CountyClerk
        preconditions: ["report.status == DRAFT", "district.status == CERTIFIED"]
        side_effects: ["snapshot total_increment_cents, total_disbursed_cents from ProjectFund; increments AnnualReport.version by 1"]
      - from: FILED
        to: DRAFT
        trigger: "POST /annual-reports/{id}/return"
        actor: MunicipalAdmin
        preconditions: ["report.status == FILED"]
        side_effects: ["increments AnnualReport.version by 1"]
        note: "Return loop (cyclic)."
      - from: FILED
        to: ACCEPTED
        trigger: "POST /annual-reports/{id}/accept"
        actor: MunicipalAdmin
        preconditions:
          - "report.status == FILED"
          - "expected_fund_version matches ProjectFund.version (else ERR_STALE_FUND_VERSION)"
        side_effects:
          - "ending_balance_cents = ProjectFund.balance_cents; surplus_basis = district.surplus_policy"
          - "run annual_surplus_determination (GROSS or NET variant per surplus_basis) -> obligation_reserve_cents, surplus_declared_cents"
          - "if surplus_declared_cents > 0: run surplus_taxing_body_split, creating SurplusDistribution{source:ANNUAL} rows [cascade: report -> distributions -> fund]"
          - "each created SurplusDistribution increments TaxingBody.total_surplus_received_cents"
          - "ProjectFund.balance_cents -= surplus_declared_cents; lifetime_surplus_cents += surplus_declared_cents; increments ProjectFund.version by 1 and AnnualReport.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: disburse-stale-fund
    parent_entity: ProjectFund
    write_endpoint: "POST /obligations/{id}/disbursements"
    occ_field: "expected_fund_version"
    description: |
      Creating a Disbursement computes its allowable amount against the fund
      balance the client last observed. If the ProjectFund.version has advanced
      since that observation (another increment capture, disbursement, or surplus
      sweep changed the balance), the create is rejected as stale. With a fresh
      fund version the same create would legitimately succeed, so the rejection is
      purely a stale-version guard, not a state precondition.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
  - rule_id: register-stale-district
    parent_entity: TifDistrict
    write_endpoint: "POST /obligations/{id}/register"
    occ_field: "expected_district_version"
    description: |
      Registering an Obligation inserts it into the district's seniority/priority
      waterfall. If TifDistrict.version has advanced since the client observed it
      (another obligation was registered, or increment/taxing-body state changed
      the district), the registration is rejected as stale because the ordering
      the client reasoned about no longer holds. A registration carrying the
      current district version succeeds.
    error_id: ERR_STALE_DISTRICT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: certify_district_setup
    trigger: "POST /tif-districts/{id}/certify (DRAFT->CERTIFIED)"
    algorithm: aggregation
    formula: |
      require count(TaxingBody where district_id == district.id) >= 1  else ERR_NO_TAXING_BODIES
      aggregate_tax_rate = sum(tb.tax_rate for tb in district taxing bodies)   # full precision float sum
      expiration_tax_year = base_tax_year + term_years
      certification_date = wall_clock_now()
    input_set: "All TaxingBody rows with district_id == district.id (no status filter; all bodies added while DRAFT participate)."
    constants: {}
    precision: "aggregate_tax_rate kept as exact decimal sum; no rounding of the rate itself"

  - name: increment_capture
    trigger: "POST /tif-districts/{id}/increment-records (provisional) and POST /increment-records/{id}/finalize (final)"
    algorithm: threshold
    formula: |
      incremental_eav_cents = max(0, current_eav_cents - district.base_eav_cents)
      # provisional variant assumes full collection:
      gross_provisional = round_half_up(incremental_eav_cents * district.aggregate_tax_rate)
      # final variant uses actual collection_rate supplied at finalize:
      gross_final = round_half_up(incremental_eav_cents * district.aggregate_tax_rate * collection_rate)
      gross_increment_cents = gross_provisional (while PROVISIONAL) | gross_final (once FINAL)
      admin_fee_cents = round_half_up(ADMIN_FEE_RATE * gross_increment_cents)
      captured_increment_cents = gross_increment_cents - admin_fee_cents
    input_set: "Single IncrementRecord plus its district's base_eav_cents and aggregate_tax_rate."
    constants:
      ADMIN_FEE_RATE: 0.03
    precision: "integer cents, round_half_up at each round_half_up() call"
    variants:
      - name: provisional
        when: "record.variant_state == PROVISIONAL (at certification)"
        difference: "collection_rate implicitly 1.0; credits fund with the estimated full-collection increment"
      - name: final
        when: "record.variant_state == FINAL (after finalize supplies collection_rate)"
        difference: "multiplies gross by collection_rate (< 1 in practice), producing a smaller captured increment; the delta trues up the fund"

  - name: disbursement_allocation
    trigger: "POST /obligations/{id}/disbursements"
    algorithm: waterfall_allocation
    formula: |
      # annual cap remaining for this obligation in disbursement_tax_year:
      paid_this_year = sum(d.amount_cents for d in Disbursement
                           where d.obligation_id == obligation.id
                             and d.status == PAID
                             and d.disbursement_tax_year == disbursement_tax_year)
      annual_cap_remaining = (obligation.annual_cap_cents - paid_this_year)
                             if obligation.annual_cap_cents is not null else +infinity
      max_payable = min(fund.balance_cents, obligation.outstanding_balance_cents, annual_cap_remaining)
      require amount_cents <= max_payable
        (amount_cents > fund.balance_cents      -> ERR_INSUFFICIENT_FUND_BALANCE;
         amount_cents > annual_cap_remaining    -> ERR_DISBURSEMENT_CAP_EXCEEDED)
      interest_portion_cents = min(amount_cents, obligation.accrued_interest_cents)
      principal_portion_cents = amount_cents - interest_portion_cents
    input_set: "Target Obligation, its district ProjectFund, and PAID Disbursements of the same obligation+tax_year. Seniority ordering enforced separately in validations (subordinate blocked while any SENIOR outstanding)."
    constants: {}
    precision: "integer cents; interest paid before principal (fixed order)"

  - name: obligation_interest_accrual
    trigger: "POST /obligations/{id}/accrue-interest"
    algorithm: aggregation
    formula: |
      period_interest = round_half_up(obligation.principal_remaining_cents * obligation.interest_rate_bps / 10000)
      obligation.accrued_interest_cents += period_interest
      obligation.outstanding_balance_cents = obligation.principal_remaining_cents + obligation.accrued_interest_cents
    input_set: "Single REGISTERED Obligation; simple (non-compounding) interest on remaining principal per invocation (one invocation = one tax year)."
    constants: {}
    precision: "integer cents, round_half_up"

  - name: annual_surplus_determination
    trigger: "POST /annual-reports/{id}/accept (FILED->ACCEPTED)"
    algorithm: aggregation
    formula: |
      ending_balance_cents = fund.balance_cents
      SENIOR = Obligations where district_id == district.id and status == REGISTERED and seniority == SENIOR
      # GROSS reserve: only this-year debt service on senior obligations (near-term)
      gross_reserve = sum(o.accrued_interest_cents +
                          min(o.principal_remaining_cents,
                              round_half_up(o.principal_cents / (o.final_maturity_tax_year - o.issue_tax_year + 1)))
                          for o in SENIOR)
      # NET reserve: full remaining senior outstanding
      net_reserve = sum(o.outstanding_balance_cents for o in SENIOR)
      obligation_reserve_cents = gross_reserve (if surplus_basis == GROSS) | net_reserve (if surplus_basis == NET)
      surplus_declared_cents = max(0, ending_balance_cents - obligation_reserve_cents)
    input_set: "ProjectFund balance and REGISTERED SENIOR obligations of the district. surplus_basis = district.surplus_policy."
    constants: {}
    precision: "integer cents, round_half_up on per-year principal amortization"
    variants:
      - name: gross
        when: "district.surplus_policy == GROSS"
        difference: "reserves only near-term (single-year) senior debt service, so more cash is freed as surplus"
      - name: net
        when: "district.surplus_policy == NET"
        difference: "reserves the full remaining senior outstanding balance, so less (often zero) surplus is freed"

  - name: surplus_taxing_body_split
    trigger: "annual report accept (source=ANNUAL) and district decertify sweep (source=DECERTIFICATION)"
    algorithm: waterfall_allocation
    formula: |
      S = surplus amount to distribute (surplus_declared_cents, or full swept balance at decertification)
      bodies = TaxingBody where district_id == district.id, ordered by created_at ASC
      # override set O = bodies with an active SurplusAgreement covering report_tax_year
      #   (start_tax_year <= report_tax_year < end_tax_year, half-open)
      override_fraction = sum(b.surplus_share_ppm_override / 1000000 for b in O)   # <= 1
      residual = 1 - override_fraction
      rate_sum_nonoverride = sum(b.tax_rate for b in bodies not in O)
      for each body b:
        if b in O:
            weight_b = b.surplus_share_ppm_override / 1000000
        elif rate_sum_nonoverride > 0:
            weight_b = residual * (b.tax_rate / rate_sum_nonoverride)
        else:
            weight_b = 0
        share_ppm_b = round_half_up(weight_b * 1000000)
        exact_b = S * weight_b
        floor_b = floor(exact_b)
      remainder = S - sum(floor_b)                     # whole cents left after flooring
      distribute the `remainder` extra cents one at a time to bodies ranked by
      fractional part (exact_b - floor_b) DESC, tie-break created_at ASC
      amount_cents_b = floor_b + (1 if b receives a remainder cent else 0)
      # invariant: sum(amount_cents_b) == S exactly (weights sum to 1 by construction)
      # with no active override, O is empty -> weight_b = b.tax_rate / district.aggregate_tax_rate
    input_set: "All TaxingBody rows of the district; applicable SurplusAgreement overrides for report_tax_year."
    constants: {}
    precision: "integer cents; largest-remainder (Hamilton) apportionment; floor then distribute leftover by fractional part DESC, created_at ASC tie-break"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all with path ids"
  - priority: 4
    category: business_constraint
    check: "request body present, required fields present, types/enums valid, numeric constraints (>0, ranges) satisfied"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"
  - priority: 5
    category: business_referential
    check: "body FK ids resolve and belong where required (e.g. SurplusAgreement.taxing_body_id belongs to the path district; obligation.developer_id resolves)"
    error_id: ERR_TAXING_BODY_NOT_IN_DISTRICT
    http_status: 409
    applies_to: "POST /tif-districts/{id}/surplus-agreements; POST /obligations"
  - priority: 6
    category: state
    check: "target resource is in a state that permits the operation (district status, obligation status, report status, disbursement status, increment status)"
    error_id: "ERR_*_NOT_* / ERR_*_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "four-eyes: disbursement actor X-User-ID must differ from obligation.registered_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /obligations/{id}/disbursements"
  - priority: 8
    category: business_temporal
    check: "no IncrementRecord already covers (district_id, tax_year); no SurplusAgreement period overlaps an existing one for the same taxing body [half-open]; bond final_maturity within district term"
    error_id: "ERR_INCREMENT_YEAR_EXISTS / ERR_AGREEMENT_PERIOD_OVERLAP / ERR_BOND_MATURITY_OUT_OF_TERM"
    http_status: 409
    applies_to: "POST increment-records; POST surplus-agreements; POST register"
  - priority: 9
    category: business_constraint
    check: "seniority ordering: a SUBORDINATE obligation cannot be disbursed while any SENIOR obligation of the district has outstanding_balance_cents > 0; certify requires >=1 taxing body"
    error_id: "ERR_SENIORITY_ORDER_VIOLATION / ERR_NO_TAXING_BODIES"
    http_status: 409
    applies_to: "POST disbursements; POST certify"
  - priority: 10
    category: business_fiscal
    check: "disbursement amount within fund balance and annual cap; amount_cents > 0"
    error_id: "ERR_INSUFFICIENT_FUND_BALANCE / ERR_DISBURSEMENT_CAP_EXCEEDED / ERR_AMOUNT_NOT_POSITIVE"
    http_status: 402
    applies_to: "POST /obligations/{id}/disbursements"
  - priority: 11
    category: business_constraint
    check: "OCC: expected_fund_version / expected_district_version match the parent version"
    error_id: "ERR_STALE_FUND_VERSION / ERR_STALE_DISTRICT_VERSION"
    http_status: 412
    applies_to: "POST disbursements; POST register; POST annual-reports/{id}/accept"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- TifDistrict ---
  - method: POST
    path: "/tif-districts"
    description: "Create a district in DRAFT"
    roles: [MunicipalAdmin]
    code: 201
    input: [name, municipality_name, base_tax_year, base_eav_cents, term_years, "surplus_policy?"]
    output: TifDistrict
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/tif-districts"
    description: "List districts (paginated)"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: TifDistrict[]
    side_effects: []
  - method: GET
    path: "/tif-districts/{id}"
    description: "Read one district"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: TifDistrict
    side_effects: []
  - method: POST
    path: "/tif-districts/{id}/certify"
    description: "Certify: lock base value, compute aggregate rate & expiration, create ProjectFund"
    roles: [MunicipalAdmin]
    code: 200
    input: []
    output: TifDistrict
    side_effects: ["certify_district_setup", "create ProjectFund", "increments TifDistrict.version by 1"]
  - method: POST
    path: "/tif-districts/{id}/decertify"
    description: "Decertify (EXPIRATION or EARLY): resolve subordinate notes, sweep surplus, close fund"
    roles: [MunicipalAdmin]
    code: 200
    input: [termination_type, termination_tax_year]
    output: TifDistrict
    side_effects: ["conditional cascade DEFEASED/DEFAULTED", "decertification_sweep -> SurplusDistribution[]", "ProjectFund CLOSED", "increments TifDistrict.version by 1"]
  - method: GET
    path: "/tif-districts/{id}/project-fund"
    description: "Reverse lookup: the district's ProjectFund (array of 0..1)"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: ProjectFund[]
    side_effects: []
  - method: GET
    path: "/tif-districts/{id}/taxing-bodies"
    description: "Reverse lookup: taxing bodies of a district"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: TaxingBody[]
    side_effects: []
  - method: GET
    path: "/tif-districts/{id}/obligations"
    description: "Reverse lookup: obligations of a district"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: ["status?"]
    output: Obligation[]
    side_effects: []
  - method: GET
    path: "/tif-districts/{id}/increment-records"
    description: "Reverse lookup: increment records of a district"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: IncrementRecord[]
    side_effects: []
  - method: GET
    path: "/tif-districts/{id}/annual-reports"
    description: "Reverse lookup: annual reports of a district"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: AnnualReport[]
    side_effects: []
  - method: GET
    path: "/tif-districts/{id}/surplus-agreements"
    description: "Reverse lookup: surplus agreements of a district"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: SurplusAgreement[]
    side_effects: []
  - method: GET
    path: "/tif-districts/{id}/surplus-distributions"
    description: "Reverse lookup: surplus distributions of a district"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: ["source?"]
    output: SurplusDistribution[]
    side_effects: []

  # --- TaxingBody ---
  - method: POST
    path: "/tif-districts/{id}/taxing-bodies"
    description: "Add an overlapping taxing body (district must be DRAFT)"
    roles: [MunicipalAdmin]
    code: 201
    input: [name, body_type, tax_rate]
    output: TaxingBody
    side_effects: []
  - method: GET
    path: "/taxing-bodies/{id}"
    description: "Read one taxing body"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: TaxingBody
    side_effects: []
  - method: GET
    path: "/taxing-bodies/{id}/surplus-distributions"
    description: "Reverse lookup: distributions paid to a taxing body"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: SurplusDistribution[]
    side_effects: []
  - method: GET
    path: "/taxing-bodies/{id}/surplus-agreements"
    description: "Reverse lookup: surplus agreements for a taxing body"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: SurplusAgreement[]
    side_effects: []

  # --- Developer ---
  - method: POST
    path: "/developers"
    description: "Register a developer"
    roles: [MunicipalAdmin]
    code: 201
    input: [legal_name, contact_email]
    output: Developer
    side_effects: []
  - method: GET
    path: "/developers/{id}"
    description: "Read one developer"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: Developer
    side_effects: []
  - method: GET
    path: "/developers/{id}/obligations"
    description: "Reverse lookup: obligations of a developer"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: Obligation[]
    side_effects: []

  # --- Obligation ---
  - method: POST
    path: "/obligations"
    description: "Propose an obligation (DEVELOPER_NOTE by Developer for self; BOND by MunicipalAdmin)"
    roles: [Developer, MunicipalAdmin]
    code: 201
    input: [district_id, "developer_id?", obligation_type, principal_cents, interest_rate_bps, issue_tax_year, final_maturity_tax_year, "annual_cap_cents?"]
    output: Obligation
    side_effects: ["status=PROPOSED"]
  - method: GET
    path: "/obligations/{id}"
    description: "Read one obligation"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: Obligation
    side_effects: []
  - method: POST
    path: "/obligations/{id}/submit"
    description: "Submit proposal for review (Developer for own DEVELOPER_NOTE; MunicipalAdmin for BOND)"
    roles: [Developer, MunicipalAdmin]
    code: 200
    input: []
    output: Obligation
    side_effects: ["PROPOSED->UNDER_REVIEW"]
  - method: POST
    path: "/obligations/{id}/register"
    description: "Register obligation (sets seniority, priority; OCC on district)"
    roles: [MunicipalAdmin]
    code: 200
    input: [priority_rank, expected_district_version]
    output: Obligation
    side_effects: ["UNDER_REVIEW->REGISTERED", "seniority set", "principal_remaining set", "registered_by_user_id set", "increments TifDistrict.version by 1"]
  - method: POST
    path: "/obligations/{id}/return"
    description: "Reviewer returns obligation for revision (cyclic)"
    roles: [MunicipalAdmin]
    code: 200
    input: []
    output: Obligation
    side_effects: ["UNDER_REVIEW->PROPOSED"]
  - method: POST
    path: "/obligations/{id}/reject"
    description: "Reviewer rejects obligation (terminal)"
    roles: [MunicipalAdmin]
    code: 200
    input: []
    output: Obligation
    side_effects: ["UNDER_REVIEW->REJECTED", "recompute obligations_cleared"]
  - method: POST
    path: "/obligations/{id}/accrue-interest"
    description: "Accrue one tax year of interest on remaining principal"
    roles: [MunicipalAdmin]
    code: 200
    input: [accrual_tax_year]
    output: Obligation
    side_effects: ["obligation_interest_accrual"]
  - method: POST
    path: "/obligations/{id}/disbursements"
    description: "Disburse from the fund to this obligation (OCC on fund; four-eyes SoD)"
    roles: [MunicipalAdmin]
    code: 201
    input: [amount_cents, disbursement_tax_year, expected_fund_version]
    output: Disbursement
    side_effects: ["disbursement_allocation", "reduce obligation outstanding [cascade]", "maybe auto SATISFIED [cascade]", "fund debited", "increments ProjectFund.version by 1"]
  - method: GET
    path: "/obligations/{id}/disbursements"
    description: "Reverse lookup: disbursements against an obligation"
    roles: [MunicipalAdmin, CountyClerk, Developer, TaxingBodyRep]
    code: 200
    input: []
    output: Disbursement[]
    side_effects: []

  # --- Disbursement ---
  - method: POST
    path: "/disbursements/{id}/void"
    description: "Void a PAID disbursement (compensation)"
    roles: [MunicipalAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["PAID->VOIDED", "reverse fund & obligation effects", "increments ProjectFund.version by 1"]

  # --- IncrementRecord ---
  - method: POST
    path: "/tif-districts/{id}/increment-records"
    description: "County certifies current EAV for a tax year; captures provisional increment"
    roles: [CountyClerk]
    code: 201
    input: [tax_year, current_eav_cents]
    output: IncrementRecord
    side_effects: ["increment_capture provisional", "fund credited", "increments ProjectFund.version by 1"]
  - method: POST
    path: "/increment-records/{id}/finalize"
    description: "Finalize increment with actual collection_rate; trues up the fund"
    roles: [CountyClerk]
    code: 200
    input: [collection_rate]
    output: IncrementRecord
    side_effects: ["increment_capture final", "fund delta applied", "increments ProjectFund.version by 1"]
  - method: POST
    path: "/increment-records/{id}/reopen"
    description: "Reopen a finalized increment (compensation; reverts to provisional)"
    roles: [CountyClerk]
    code: 200
    input: []
    output: IncrementRecord
    side_effects: ["reverse finalize delta", "variant_state->PROVISIONAL", "increments ProjectFund.version by 1"]

  # --- AnnualReport ---
  - method: POST
    path: "/tif-districts/{id}/annual-reports"
    description: "Create an annual report in DRAFT"
    roles: [CountyClerk]
    code: 201
    input: [report_tax_year]
    output: AnnualReport
    side_effects: ["status=DRAFT"]
  - method: POST
    path: "/annual-reports/{id}/file"
    description: "File the report (snapshots increment/disbursed totals)"
    roles: [CountyClerk]
    code: 200
    input: []
    output: AnnualReport
    side_effects: ["DRAFT->FILED", "snapshot totals"]
  - method: POST
    path: "/annual-reports/{id}/accept"
    description: "Accept the report; declare & distribute surplus (OCC on fund; filer role != accepter role)"
    roles: [MunicipalAdmin]
    code: 200
    input: [expected_fund_version]
    output: AnnualReport
    side_effects: ["FILED->ACCEPTED", "annual_surplus_determination", "surplus_taxing_body_split -> SurplusDistribution[]", "fund debited", "increments ProjectFund.version by 1"]
  - method: POST
    path: "/annual-reports/{id}/return"
    description: "Return a filed report to DRAFT (cyclic)"
    roles: [MunicipalAdmin]
    code: 200
    input: []
    output: AnnualReport
    side_effects: ["FILED->DRAFT"]

  # --- SurplusAgreement ---
  - method: POST
    path: "/tif-districts/{id}/surplus-agreements"
    description: "Add a surplus-share override agreement for a taxing body over a half-open tax-year window"
    roles: [MunicipalAdmin]
    code: 201
    input: [taxing_body_id, start_tax_year, end_tax_year, surplus_share_ppm_override]
    output: SurplusAgreement
    side_effects: ["overlap check vs existing agreements for same body"]

