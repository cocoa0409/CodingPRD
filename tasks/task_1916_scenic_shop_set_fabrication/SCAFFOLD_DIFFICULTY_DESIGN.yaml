              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "PAINT_GAL", condition_grade: "A", quantity_on_hand: 30, replacement_cost_cents: 4000 }
              as: ShopAdmin
              captures: { si_id: $.data.id }
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 10 }
              as: Estimator
              captures: { to_id: $.data.id, to_v: $.data.version }
          trigger:
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_id}", expected_takeoff_version: "${to_v}", material_code: "PAINT_GAL", quantity: 30, source: "STOCK", stock_item_id: "${si_id}" }
              as: Estimator
              captures: { line_id: $.data.id }
          assert:
            - "line created (HTTP 201): quantity == on_hand exactly is allowed"
            - "StockItem.${si_id}.quantity_on_hand == 0 and status == DEPLETED"
            - "TakeoffLine.${line_id}.line_total_cents == 72000   # 30 x 2400"
            - "Shop.${shop_id}.inventory_value_cents == 0"

