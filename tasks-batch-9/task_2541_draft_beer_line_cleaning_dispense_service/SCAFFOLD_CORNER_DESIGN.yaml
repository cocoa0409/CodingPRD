  # ===========================================================================
  # SECTION 4 — validations
  # 55 priority-ordered rules. Table 4's Priority-conflict row is the whole
  # subject of §0.5 rule 5, so all three of its instances are stubbed here; what
  # this section adds is the aggregate, temporal, cross-entity, conditional and
  # cascading patterns plus paired violation/satisfaction coverage.
  # ===========================================================================
  - section: validations
    instances:
      - name: corner_third_line_breaches_the_contract_cap_although_each_line_is_valid
        claim_type: Aggregate validation
        grounds:
          - validations[42].ERR_CONTRACT_LINE_LIMIT_EXCEEDED
          - endpoints.POST_beer_lines
          - entities.ServiceContract.fields.contracted_line_count
        distinguishing_aspect: |
          Every individual payload is well formed and unique; only the running
          count breaches contracted_line_count 2 — lines #1 and #2 are created
          201, the third returns ERR_CONTRACT_LINE_LIMIT_EXCEEDED (422), and the
          account still lists exactly 2 lines afterwards.
        test_recipe:
          setup:
            - "ServiceAccount 'Two Tap Bar' ACTIVE."
            - "ServiceContract ACTIVE with contracted_line_count 2 (21 days, 4175, 7500)."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Two Tap Bar", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 2, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 2, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "LAGER", average_daily_throughput_liters: 10.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line2: $.data.id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 3, run_length_feet: 15, vertical_rise_feet: 3, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 8.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err: $.data.error_id }
            - call: "GET /draft-service/beer-lines?account_id=${acct}&limit=10&offset=0"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { total: $.total_count }
          assert:
            - "the first two POST /draft-service/beer-lines calls return HTTP 201"
            - "the third returns HTTP 422 and ${err} == ERR_CONTRACT_LINE_LIMIT_EXCEEDED"
            - "${total} == 2"
            - "BeerLine.${line1}.line_number == 1 and BeerLine.${line2}.line_number == 2"

