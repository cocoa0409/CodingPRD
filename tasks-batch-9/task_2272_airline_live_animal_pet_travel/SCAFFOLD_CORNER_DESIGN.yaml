  - section: state_machines
    instances:
      - name: flight_leg_delay_then_restore_returns_to_scheduled
        claim_type: cyclic
        grounds:
          - state_machines.FlightLeg.SCHEDULED_to_DELAYED
          - state_machines.FlightLeg.DELAYED_to_SCHEDULED
          - entities.FlightLeg.fields.block_minutes
        distinguishing_aspect: "The FlightLeg machine is the cyclic one: SCHEDULED -> DELAYED -> SCHEDULED is legal and the loop leaves no residue - block_minutes is recomputed on both hops and returns to 780, posture returns to OPEN, and only version records that the loop happened."
        test_recipe:
          setup:
            - "Stations HKG (HK) and LAX (US); AN101 HKG->LAX 2026-09-10T02:00Z-15:00Z, status SCHEDULED, block_minutes 780, no segments booked"
            - "The leg is delayed to 2026-09-10T04:00Z-17:00Z, so status is DELAYED and block_minutes is still 780"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /flight-legs/${leg1}/delay", payload: { new_departure_utc: "2026-09-10T04:00:00Z", new_arrival_utc: "2026-09-10T17:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "POST /flight-legs/${leg1}/restore-schedule", payload: { restored_departure_utc: "2026-09-10T02:00:00Z", restored_arrival_utc: "2026-09-10T15:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 200"
            - "FlightLeg.${leg1}.status == SCHEDULED"
            - "FlightLeg.${leg1}.scheduled_departure_utc == 2026-09-10T02:00:00Z"
            - "FlightLeg.${leg1}.block_minutes == 780"
            - "FlightLeg.${leg1}.posture == OPEN"
            - "FlightLeg.${leg1}.version == 3"

      - name: flight_leg_restore_schedule_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.FlightLeg.DELAYED_to_SCHEDULED
          - validations.priority_11
          - errors.ERR_FLIGHT_LEG_INVALID_STATE
        distinguishing_aspect: "restore-schedule exists only as DELAYED -> SCHEDULED, so calling it on a leg that is already SCHEDULED is an invalid-from rejection (409 ERR_FLIGHT_LEG_INVALID_STATE) and NOT a schedule-monotonicity rejection, even though the supplied instants are earlier than the current ones."
        test_recipe:
          setup:
            - "Stations HKG (HK) and LAX (US); AN101 HKG->LAX 2026-09-10T02:00Z-15:00Z in status SCHEDULED, never delayed"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
          trigger:
            - { call: "POST /flight-legs/${leg1}/restore-schedule", payload: { restored_departure_utc: "2026-09-10T01:00:00Z", restored_arrival_utc: "2026-09-10T14:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 409 with error_id ERR_FLIGHT_LEG_INVALID_STATE"
            - "the error_id is NOT ERR_SCHEDULE_NOT_MONOTONIC"
            - "FlightLeg.${leg1}.status == SCHEDULED and FlightLeg.${leg1}.scheduled_departure_utc == 2026-09-10T02:00:00Z"
            - "FlightLeg.${leg1}.version == 1"

