          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_ESR is a LEASED_OPERATOR on an escrow_required package with target 250000 and monthly 40000"
            - "load LOAD_ESR DELIVERED 2026-08-04T18:00Z paying 46080"
            - "settlement STL_ESR over [2026-08-03T00:00:00Z, 2026-08-10T00:00:00Z) prepared by clerk-01 and approved by approver-01, depositing 3686 of escrow"
            - "clock at 2026-08-15T12:00Z, the driver terminated and its escrow closed"
