            - "§1.7 scopes the Lessee role's balance read to its own id only, so the same role is permitted on this endpoint in general and denied for a foreign id in particular."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/lessees"
