      - name: pitch_cycle_accounting_net_zero_drift
        grounds:
          - state_machines.PitchSubmission.UNDER_REVIEW_to_ACCEPTED
          - state_machines.PitchSubmission.UNDER_REVIEW_to_REJECTED
          - state_machines.PitchSubmission.PITCHED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity — terminal-pitch accounting per playlist: for the
          set of pitches that ever left PITCHED on one playlist, (#ACCEPTED +
          #REJECTED + #WITHDRAWN) == (#claims that reached UNDER_REVIEW +
          #withdraws from PITCHED), and a full decide-and-withdraw cycle of 3
          pitches leaves exactly 3 terminal rows and 0 live rows — no pitch is
          lost or duplicated by the fork/withdraw compensating actions.
          Distinct conserved quantity from pool cents.
        test_recipe:
          setup:
            - "One artist, one release (2026-09-20), THREE focus-track-capable tracks? No — one focus track per release; use three releases R1/R2/R3 each with a focus track, all for the same artist."
            - "Playlist with slot_count 3. Pitch P1 on T1, P2 on T2, P3 on T3."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "Acct", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_ac: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ac}", title: "R1", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { rel_a1: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ac}", title: "R2", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { rel_a2: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ac}", title: "R3", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { rel_a3: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_a1}", title: "T1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { trk_a1: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_a2}", title: "T2", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { trk_a2: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_a3}", title: "T3", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { trk_a3: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Ledger List", genre_focus: "POP", mood_focus: "ANY", slot_count: 3, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_ac: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_a1}", pitch_text: "p1", target_playlist_id: "${pl_ac}" }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { pit_a1: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_a2}", pitch_text: "p2", target_playlist_id: "${pl_ac}" }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { pit_a2: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_a3}", pitch_text: "p3", target_playlist_id: "${pl_ac}" }
              as: RightsHolder
              as_user_id: "${art_ac}"
              captures: { pit_a3: $.data.id }
          trigger:
            - call: "POST /catalog/pitches/${pit_a1}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_a1}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
            - call: "POST /catalog/pitches/${pit_a2}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_a2}/decide"
              payload: { decision: "REJECT" }
              as: EditorialLead
            - call: "POST /catalog/pitches/${pit_a3}/withdraw"
              payload: {}
              as: RightsHolder
              as_user_id: "${art_ac}"
          assert:
            - "PitchSubmission.${pit_a1}.status == ACCEPTED, ${pit_a2} == REJECTED, ${pit_a3} == WITHDRAWN"
            - "GET /catalog/pitches?target_playlist_id=${pl_ac} returns exactly 3 rows, all terminal — the forward actions (2 claims, 1 direct withdraw) and compensating terminal actions account for every pitch with zero drift"
            - "GET /catalog/pitches?target_playlist_id=${pl_ac}&status=PITCHED returns 0 rows and status=UNDER_REVIEW returns 0 rows"
            - "exactly one PlaylistPlacement exists (from the single ACCEPT) with slot_index == 0"
