  # =========================================================================
  # Section 9 — Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_application_version_visible_after_write
        claim_type: immediate
        grounds: [entities.LoanApplication.fields.version]
        distinguishing_aspect: "After POST /prequalify, the immediate GET /loan-applications/{id} returns the bumped version — no eventual-consistency lag."
        test_recipe:
          setup: ["Empty DB. Applicant + LoanApplication DRAFT, version=1."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "I", email: "imm@test.com", ssn_last4: "1500", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "X", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v_after_prequal: $.data.version }
          trigger:
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 200"
            - "response.data.version == ${v_after_prequal}"
            - "response.data.status == 'PREQUALIFIED'"
