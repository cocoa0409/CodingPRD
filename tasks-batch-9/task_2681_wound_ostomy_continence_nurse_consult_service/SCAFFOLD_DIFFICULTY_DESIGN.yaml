# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Task 2681 — Wound Ostomy Continence Nurse Consult Service
#
# §1.8 Test Targeting Index. Nine §0.5 rule_ids x 2 differentiated instances
# = 18 instances. Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1–§1.6;
# every `setup_api_calls:` / `trigger:` entry is a §1.5 endpoint with a §1.7
# role; every ${var} is bound by an earlier `captures:`; every formula-derived
# assert literal below was produced by executing the §1.3 formula as code.
#
# The server's logical clock starts at 2026-08-01T00:00:00Z (SCAFFOLD.yaml
# global_constants.DEFAULT_LOGICAL_CLOCK), so recipes that do not call
# POST /_clock/set_current_utc are reading exactly that instant.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: consult_acuity_provisional_vs_final_diverges
        grounds:
          - calculations.consult_acuity_score
          - entities.ConsultRequest.fields.acuity_variant
          - entities.ConsultRequest.fields.priority_band
          - entities.ConsultRequest.fields.sla_due_at
          - state_machines.ConsultRequest.REQUESTED_to_TRIAGED
          - state_machines.ConsultRequest.ASSIGNED_to_ASSESSED
        distinguishing_aspect: |
          The two variants of consult_acuity_score run on the SAME ConsultRequest
          row and produce 34.5 / P3 / SLA 72h under intake_provisional and
          92.0 / P1 / SLA 4h under assessed_final, because assessed_final swaps
          reported_stage (STAGE_1) for the nurse's observed_stage (STAGE_3) and
          adds a non-zero area_points term that intake_provisional pins to 0.
        test_recipe:
          setup:
            - "Unit 7W exists with rental_budget_cap_cents 500000."
            - "WocNurse Nina is CERTIFIED with ce_credits 30, two competency signoffs, certification_eligibility_score 64.00, max_consult_load 8."
            - "Patient MRN-A01 is ADMITTED on 7W at 2026-07-31T12:00:00Z with comorbidity_count 2, device_related_risk false, ostomy_present true."
            - "An OSTOMY ConsultRequest for MRN-A01 exists in status REQUESTED with reported_stage STAGE_1."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "OSTOMY_CARE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-A01", unit_id: "${u1_id}", admitted_at: "2026-07-31T12:00:00Z", comorbidity_count: 2, device_related_risk: false, ostomy_present: true }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "OSTOMY", reported_stage: "STAGE_1", clinical_note: "Peristomal skin breakdown, unit reports superficial redness." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { p1_v: "$.data.version" }
          trigger:
            - call: "GET /consult-requests/${c1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { prov_score: "$.data.acuity_score", prov_band: "$.data.priority_band", prov_sla: "$.data.sla_due_at" }
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "OTHER", observed_stage: "STAGE_3", measured_area_cm2: 24, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}" }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
          assert:
            - "The intake_provisional read taken before staging has ${prov_score} == 34.5, ${prov_band} == P3 and ${prov_sla} == 2026-08-04T00:00:00Z ((20 + min(25, 5*2) + 0 + 0) * 1.15 = 34.5, below P2_THRESHOLD 40.0, so SLA_HOURS_BY_BAND[P3] = 72h from triaged_at 2026-08-01T00:00:00Z)."
            - "ConsultRequest.${c1_id}.acuity_score == 92.0 after POST /skin-assessments ((60 + min(25, 5*2) + 0 + min(15, floor(24/10)*5)) * 1.15 = 80 * 1.15 = 92.0)."
            - "ConsultRequest.${c1_id}.priority_band == P1"
            - "ConsultRequest.${c1_id}.acuity_variant == ASSESSED_FINAL"
            - "ConsultRequest.${c1_id}.sla_due_at == 2026-08-01T04:00:00Z (triaged_at 2026-08-01T00:00:00Z + SLA_HOURS_BY_BAND[P1] = 4h)"
            - "ConsultRequest.${c1_id}.status == ASSESSED"
            - "The provisional-to-final delta is exactly 57.5 acuity points and the SLA deadline moves 68 hours EARLIER, not later."
            - "SkinAssessment.${a1_id}.staged_by_nurse_id == ${n1_id} and SkinAssessment.${a1_id}.validation_status == PENDING_VALIDATION"

      - name: unit_prevalence_vs_incidence_diverges
        grounds:
          - calculations.unit_survey_metric
          - entities.Unit.fields.last_prevalence_rate
          - entities.Unit.fields.last_incidence_rate
          - entities.SurveyObservation.fields.at_risk
          - entities.SurveyObservation.fields.onset_at
          - state_machines.SurveyRound.LOCKED_to_PUBLISHED
        distinguishing_aspect: |
          One byte-identical set of five SurveyObservation rows on the same Unit
          yields prevalence 60.00 (3 injuries / 5 observations, POA included)
          and incidence 50.00 (2 in-window HAPI onsets / 4 at_risk patients, POA
          excluded), so the two variants differ in BOTH numerator filter and
          denominator filter rather than in a shared rate times a factor.
        test_recipe:
          setup:
            - "Unit 7W exists; WocNurse Nina is CERTIFIED and acts as the observer."
            - "Five ADMITTED patients MRN-S1..MRN-S5 sit on 7W."
            - "Two rounds cover the same closed window 2026-08-01T00:00:00Z..2026-08-05T00:00:00Z on 7W: one PREVALENCE, one INCIDENCE. Cross-type rounds do not collide under validations[priority=44]."
            - "Each round carries the SAME five observations, all observed_at 2026-08-02T00:00:00Z: S1 HAPI onset 2026-08-02 at_risk; S2 HAPI onset 2026-08-02 at_risk; S3 POA (no onset_at) at_risk; S4 no injury at_risk; S5 no injury not at_risk."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "SURVEY_METHOD" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-S1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-S2", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { s2_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-S3", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { s3_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-S4", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { s4_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-S5", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { s5_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "PREVALENCE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-05T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { rp_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "INCIDENCE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-05T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { ri_id: "$.data.id" }
            - call: "POST /survey-rounds/${rp_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-rounds/${ri_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${rp_id}", unit_id: "${u1_id}", patient_id: "${s1_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "HAPI", observed_stage: "STAGE_2", onset_at: "2026-08-02T00:00:00Z", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${rp_id}", unit_id: "${u1_id}", patient_id: "${s2_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "HAPI", observed_stage: "STAGE_3", onset_at: "2026-08-02T00:00:00Z", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${rp_id}", unit_id: "${u1_id}", patient_id: "${s3_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "POA", observed_stage: "STAGE_2", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${rp_id}", unit_id: "${u1_id}", patient_id: "${s4_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: false, classification: "NONE", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${rp_id}", unit_id: "${u1_id}", patient_id: "${s5_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: false, classification: "NONE", at_risk: false }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${ri_id}", unit_id: "${u1_id}", patient_id: "${s1_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "HAPI", observed_stage: "STAGE_2", onset_at: "2026-08-02T00:00:00Z", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${ri_id}", unit_id: "${u1_id}", patient_id: "${s2_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "HAPI", observed_stage: "STAGE_3", onset_at: "2026-08-02T00:00:00Z", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${ri_id}", unit_id: "${u1_id}", patient_id: "${s3_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "POA", observed_stage: "STAGE_2", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${ri_id}", unit_id: "${u1_id}", patient_id: "${s4_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: false, classification: "NONE", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${ri_id}", unit_id: "${u1_id}", patient_id: "${s5_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: false, classification: "NONE", at_risk: false }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-rounds/${rp_id}/lock"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-rounds/${ri_id}/lock"
              payload: {}
              as: WocProgramDirector
          trigger:
            - call: "POST /survey-rounds/${rp_id}/publish"
              payload: {}
              as: WocProgramDirector
            - call: "GET /units/${u1_id}"
              payload: {}
              as: WocProgramDirector
              captures: { prev_rate: "$.data.last_prevalence_rate" }
            - call: "POST /survey-rounds/${ri_id}/publish"
              payload: {}
              as: WocProgramDirector
          assert:
            - "${prev_rate} == 60.00 (prevalence numerator 3 = every injury_present row including the POA row, denominator 5 = every observation; round_half_up(100 * 3 / 5, 2))."
            - "Unit.${u1_id}.last_prevalence_rate == 60.00"
            - "Unit.${u1_id}.last_incidence_rate == 50.00 (incidence numerator 2 = HAPI rows with onset_at inside the closed window, denominator 4 = at_risk rows; round_half_up(100 * 2 / 4, 2))."
            - "60.00 != 50.00 on the identical five-row observation set — the divergence comes from the POA row being counted by prevalence and excluded by incidence, AND from patient MRN-S5 being counted in the prevalence denominator but not the incidence denominator."
            - "SurveyRound.${rp_id}.status == PUBLISHED and SurveyRound.${ri_id}.status == PUBLISHED"
            - "SurveyRound.${rp_id}.observation_count == 5 and SurveyRound.${ri_id}.observation_count == 5"

  - rule_id: combinatorial_formula
    instances:
      - name: rental_projection_per_day_rounding_then_sum
        grounds:
          - calculations.rental_cost_projection
          - entities.SupportSurfaceOrder.fields.billable_days
          - entities.SupportSurfaceOrder.fields.projected_cost_cents
          - entities.SupportSurface.fields.daily_rate_cents
        distinguishing_aspect: |
          Mode (b) — pinned ROUNDING ORDER. A 14-day rental at 12345 cents/day
          crosses the tier-1/tier-2 boundary so days 8..14 cost 11110.5 cents
          before rounding; rounding each day to 11111 and then summing gives
          164192, while summing the unrounded rates and rounding once gives
          164189. The scaffold pins per-day-then-sum, so 164189 is a failure.
        test_recipe:
          setup:
            - "Unit 7W exists with rental_budget_cap_cents 500000."
            - "SupportSurface BED-001 is an AVAILABLE LOW_AIR_LOSS bed at daily_rate_cents 12345."
            - "Patient MRN-R1 is ADMITTED on 7W."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-R1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-001", surface_class: "LOW_AIR_LOSS", daily_rate_cents: 12345, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-15T00:00:00Z", authorized_days: 14 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
          assert:
            - "SupportSurfaceOrder.${o1_id}.billable_days == 14 (336 interval hours / BILLABLE_DAY_HOURS 24, ceil)"
            - "SupportSurfaceOrder.${o1_id}.projected_cost_cents == 164192 (7 days at round_half_up(12345 * 1.00) = 12345 giving 86415, plus 7 days at round_half_up(12345 * 0.90) = round_half_up(11110.5) = 11111 giving 77777)"
            - "SupportSurfaceOrder.${o1_id}.projected_cost_cents != 164189 — 164189 is the forbidden sum-then-round answer (86415 + 77773.5 rounded once)"
            - "SupportSurfaceOrder.${o1_id}.vendor_service_fee_cents == 8210 (164192 falls in [50000, 200000) so FEE_PCT_TIER_2 0.05; round_half_up(8209.6) = 8210)"
            - "SupportSurfaceOrder.${o1_id}.authorized_cost_cents == 172402"
            - "SupportSurfaceOrder.${o1_id}.fulfillment_status == REQUESTED and SupportSurfaceOrder.${o1_id}.billing_status == UNBILLED"
            - "Unit.${u1_id}.rental_encumbered_cents == 0 and Unit.${u1_id}.rental_available_cents == 500000 — order CREATION never touches the ledger"

      - name: vendor_fee_tier_keyed_on_prefee_projected_cost
        grounds:
          - calculations.vendor_service_fee
          - calculations.rental_cost_projection
          - entities.SupportSurfaceOrder.fields.vendor_service_fee_cents
          - entities.SupportSurfaceOrder.fields.authorized_cost_cents
        distinguishing_aspect: |
          Mode (c) — pinned EVALUATION ORDER for a formula whose output feeds its
          own tier lookup. A projected_cost_cents of exactly 199000 sits in the
          5% band, giving fee 9950 and authorized 208950; had the tier been read
          off the post-fee authorized_cost_cents (208950 >= FEE_TIER_3_FLOOR
          200000) the fee would be 3% = 5970 and authorized 204970. Both answers
          are self-consistent, so only the pinned order distinguishes them.
        test_recipe:
          setup:
            - "Unit 7W exists with rental_budget_cap_cents 500000."
            - "SupportSurface BED-002 is an AVAILABLE BARIATRIC_BED surface at daily_rate_cents 39800."
            - "Patient MRN-R2 is ADMITTED on 7W."
            - "The requested interval is exactly 5 whole days, entirely inside tier 1, so projected_cost_cents is exactly 5 * 39800 = 199000 — one cent short of the 200000 tier-3 floor."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-R2", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p2_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-002", surface_class: "BARIATRIC_BED", daily_rate_cents: 39800, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s2_id: "$.data.id" }
          trigger:
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p2_id}", unit_id: "${u1_id}", support_surface_id: "${s2_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-06T00:00:00Z", authorized_days: 5 }
              as: MaterialsCoordinator
              captures: { o2_id: "$.data.id" }
          assert:
            - "SupportSurfaceOrder.${o2_id}.billable_days == 5"
            - "SupportSurfaceOrder.${o2_id}.projected_cost_cents == 199000"
            - "SupportSurfaceOrder.${o2_id}.vendor_service_fee_cents == 9950 (tier keyed on the PRE-fee 199000, which is < FEE_TIER_3_FLOOR 200000, so FEE_PCT_TIER_2 0.05)"
            - "SupportSurfaceOrder.${o2_id}.authorized_cost_cents == 208950"
            - "SupportSurfaceOrder.${o2_id}.vendor_service_fee_cents != 5970 and SupportSurfaceOrder.${o2_id}.authorized_cost_cents != 204970 — those are the forbidden post-fee-keyed answers"

  - rule_id: non_linear_state_machine
    instances:
      - name: consult_return_resubmit_cycle_increments_revision
        grounds:
          - state_machines.ConsultRequest.TRIAGED_to_RETURNED_FOR_INFO
          - state_machines.ConsultRequest.RETURNED_FOR_INFO_to_REQUESTED
          - state_machines.ConsultRequest.REQUESTED_to_TRIAGED
          - entities.ConsultRequest.fields.revision_count
          - validations[priority=50]
          - calculations.consult_acuity_score
        distinguishing_aspect: |
          ConsultRequest is genuinely cyclic: TRIAGED -> RETURNED_FOR_INFO ->
          REQUESTED -> TRIAGED is traversable twice, each resubmit NULLING
          acuity_score / priority_band / triaged_at / sla_due_at and bumping
          revision_count, and the third return is refused by validations[priority=50]
          once revision_count reaches MAX_REVISIONS 2 — so the loop terminates on
          a counter, not on a state.
        test_recipe:
          setup:
            - "Unit 7W exists; WocNurse Nina is CERTIFIED."
