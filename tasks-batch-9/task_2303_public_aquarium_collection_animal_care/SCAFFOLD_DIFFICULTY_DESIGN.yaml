        captures: {final_score: $.data.sustainability_score}
      trigger:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {expired: $.data.expired_permit_ids, rejected: $.data.rejected_acquisition_request_ids}
      assert:
      - 'before the trigger: AcquisitionRequest.status == CLEARED, sustainability_score == 70.00 with variant FINAL (min(100, 40 + 10 + 0.25*80.00 + 5) - 0 - 20*((0+1)/4)), quota_units_reserved == 1, Species.wild_take_quota_reserved == 1'
      - 'link 1: Permit.status == EXPIRED — valid_until == clock_now counts as expired (inclusive boundary)'
      - 'link 2: AcquisitionRequest.status == REJECTED with closure_reason == ''PERMIT_EXPIRED'''
      - 'link 3: AcquisitionRequest.quota_units_reserved == 0 and Species.wild_take_quota_reserved == 0'
      - the trigger response lists the permit id in expired_permit_ids and the request id in rejected_acquisition_request_ids
      - the request's sustainability_score is NOT recomputed by the rejection; it stays 70.00 with variant FINAL
      - 'advancing the clock a second time to 2026-09-02 is idempotent: expired_permit_ids and rejected_acquisition_request_ids both come back empty'
- rule_id: priority_pair_validation_conflict
  rationale: Three annotated §1.4 pairs. Each instance violates BOTH rules in one request, asserts the high-priority error, then repairs only the high-priority cause and asserts the low-priority error from the same endpoint.
  instances:
  - name: priority_pair_a_invalid_state_masks_bioload_capacity
    grounds:
    - §1.4 priority 10 ERR_INVALID_STATE (PAIR A high side)
    - §1.4 priority 45 ERR_BIOLOAD_CAPACITY_EXCEEDED (PAIR A low side)
    - §1.2 Specimen disposition_status QUARANTINE (no placement transition declared) and CLEARED -> ON_EXHIBIT
    - §1.3 exhibit_bioload_ledger
    - §1.5 POST /aquarium/specimens/{id}/exhibit-placements
    distinguishing_aspect: 'The same request violates both rules at once: the specimen is still in QUARANTINE AND the exhibit has capacity 10 against a 12-unit animal. Priority 10 must win. Clearing quarantine changes nothing about the capacity, so the identical payload then surfaces ERR_BIOLOAD_CAPACITY_EXCEEDED, proving the low-priority rule was masked rather than absent.'
    test_recipe:
      setup: An exhibit with bioload_capacity_units 10 and an APPROVED plan entry with planned_count 1 for a species whose bioload_units_per_specimen is 12, so every placement is over capacity. The specimen is freshly accessioned and therefore still in QUARANTINE.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
