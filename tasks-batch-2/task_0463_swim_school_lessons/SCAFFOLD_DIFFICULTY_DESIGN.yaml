              payload: { student_id: "${s2_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v_cur}" }
              as: Parent
              as_user_id: "${p2_id}"
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr1_id}/withdraw"
              payload: {}
              as: Parent
              as_user_id: "${p1_id}"
          assert:
            - "Enrollment.${enr1_id}.status == WITHDRAWN"
            - "Enrollment.${enr2_id}.status == ACTIVE"
            - "ClassSession.${sess_id}.enrolled_count == 1"
            - "ClassSession.${sess_id}.waitlist_count == 0"

      # --- Instance 2: makeup credit balance conservation across redeem+cancel ---
      - name: makeup_credit_balance_conserved_after_redeem_and_cancel
        grounds:
          - state_machines.MakeupCredit.ISSUED_to_REDEEMED
