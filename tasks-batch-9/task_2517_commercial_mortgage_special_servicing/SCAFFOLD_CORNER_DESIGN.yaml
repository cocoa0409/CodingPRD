# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  —  §1.9 Scaffold Corner Design (breadth probe)
#
# Domain: cmbs-special-servicing   API prefix: /special-servicing
# Companion of SCAFFOLD.yaml (§1.1-§1.7) and SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8).
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; nothing is invented here.
#
# Fixture identities used throughout (same convention as §1.8):
#   ms-001       MasterServicer
#   amgr-001     SpecialServicerAssetManager (author / orderer)
#   amgr-002     SpecialServicerAssetManager (second pair of eyes)
#   cmte-001     SpecialServicingCommitteeOfficer
#   trustee-001  Trustee
#   admin-001    PlatformAdmin
#   entity-backed roles present the owning row id:
#     ControllingClassRepresentative -> as_user_id: "${trust_id}"
#     Borrower                       -> as_user_id: "${loan_id}"
#
# The logical clock starts at 2026-08-01T00:00:00Z in every instance unless a
# POST /special-servicing/_clock/set_current_utc call says otherwise.
# 00000000-0000-4000-8000-0000000000NN is used as a well-formed but absent UUID.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: trust_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Trust
          - endpoints[POST /special-servicing/trusts]
        distinguishing_aspect: "A Trust created with only the three required inputs comes back as a complete row: the three echoed inputs, the four common fields, and every computed ledger already initialized."
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", trust_version: "$.data.version", notional: "$.data.controlling_class_notional_usd" }
          assert:
            - "HTTP 201 with response_type object and meta.api_request_id / meta.api_request_timestamp present"
            - "data.deal_name == CMBS 2026-E1, data.closing_date == 2026-01-15T00:00:00Z, data.original_controlling_class_balance_usd == 40000000.00"
            - "data.id is a bare UUID with no type prefix; data.created_at == data.updated_at == 2026-08-01T00:00:00.000Z; data.version == 1"
            - "data.controlling_class_notional_usd == 40000000.00 and data.control_status == CONTROLLING at creation"
            - "data.total_ara_usd == 0.00, realized_loss_usd == 0.00, total_advances_outstanding_usd == 0.00, excess_liquidation_proceeds_usd == 0.00, loans_in_special_servicing_count == 0"

      - name: loan_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Loan
          - endpoints[GET /special-servicing/loans/{id}]
        distinguishing_aspect: "GET /loans/{id} returns exactly what POST /loans stored, including the derived required_monthly_pi_advance_usd seeded from monthly_debt_service_usd, with version still 1 because a read is not a write."
        test_recipe:
          setup:
            - "One trust and one loan, nothing else."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E2", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-E01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
          trigger:
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { read_version: "$.data.version", read_pi: "$.data.required_monthly_pi_advance_usd" }
          assert:
            - "HTTP 200 with data.id == ${loan_id} and data.trust_id == ${trust_id}"
            - "data.loan_number == L-E01, current_principal_balance_usd == 10000000.00, note_rate_pct == 6.0, monthly_debt_service_usd == 65000.00, maturity_date == 2029-06-01T00:00:00Z"
            - "data.servicing_status == MASTER_SERVICING and data.payment_status == CURRENT"
            - "data.required_monthly_pi_advance_usd == 65000.00 (ara_amount_usd is 0.00, so the obligation equals monthly debt service)"
            - "data.version == 1 — the GET performed no write"

      - name: loans_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /special-servicing/loans]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three loans across two trusts prove that the trust_id filter narrows the population BEFORE pagination is applied: total_count reports the filtered count, not the table count, and has_more flips on the second page."
        test_recipe:
          setup:
            - "Trust X with loans L-X01, L-X02, L-X03 and trust Y with a single loan L-Y01."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-X1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_x_id: "$.data.id" }
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-Y1", closing_date: "2026-02-15T00:00:00Z", original_controlling_class_balance_usd: 20000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_y_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_x_id}", loan_number: "L-X01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_x1_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_x_id}", loan_number: "L-X02", original_balance_usd: 8000000, current_principal_balance_usd: 7000000, note_rate_pct: 5.5, monthly_debt_service_usd: 45000, maturity_date: "2030-06-01T00:00:00Z", securitization_value_usd: 11000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_x2_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_x_id}", loan_number: "L-X03", original_balance_usd: 6000000, current_principal_balance_usd: 5500000, note_rate_pct: 5.0, monthly_debt_service_usd: 32000, maturity_date: "2031-06-01T00:00:00Z", securitization_value_usd: 9000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_x3_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_y_id}", loan_number: "L-Y01", original_balance_usd: 4000000, current_principal_balance_usd: 3800000, note_rate_pct: 7.0, monthly_debt_service_usd: 28000, maturity_date: "2028-06-01T00:00:00Z", securitization_value_usd: 6000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_y1_id: "$.data.id" }
          trigger:
            - call: "GET /special-servicing/loans"
              payload: { trust_id: "${trust_x_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { page_1_first: "$.data[0].id", page_1_count: "$.data[0].version" }
            - call: "GET /special-servicing/loans"
              payload: { trust_id: "${trust_x_id}", limit: 2, offset: 2 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { page_2_first: "$.data[0].id" }
          assert:
            - "Page 1: HTTP 200, response_type array, exactly 2 rows, meta-level total_count == 3 and has_more == true"
            - "Page 2: exactly 1 row, total_count == 3, has_more == false"
            - "Loan L-Y01 appears on neither page — the trust_id filter is applied before limit/offset"
            - "Row order is created_at ASC, so page 1 holds L-X01 then L-X02 and page 2 holds L-X03; id never participates in ordering"

      - name: loan_get_with_absent_uuid_returns_loan_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_LOAN_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid UUID that matches no row yields the entity-specific 404 code, not a generic one, and the existence check at priority 3 runs before any business logic."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /special-servicing/loans/00000000-0000-4000-8000-000000000001"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { missing_loan_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_LOAN_NOT_FOUND"
            - "data.message is a non-empty human-readable string and no other data fields are present"

      - name: loan_create_missing_required_securitization_value_rejected
        claim_type: required_fields
        grounds:
          - entities.Loan.fields.securitization_value_usd
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Every Loan field with source input and no default is required; omitting securitization_value_usd alone is enough for a 400 even though all seven other required fields are present and valid."
        test_recipe:
          setup:
            - "One trust."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E3", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-E03", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { missing_field_error: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "No Loan row is created: GET /special-servicing/loans with trust_id ${trust_id} returns total_count 0"
            - "Trust.${trust_id}.version is still 1 — a rejected create writes nothing anywhere"

      - name: trust_create_applies_every_declared_default
        claim_type: defaults
        grounds:
          - entities.Trust.fields.special_servicing_fee_annual_pct
          - entities.Trust.fields.fee_basis_convention
          - entities.Trust.fields.consultation_response_business_days
        distinguishing_aspect: "Omitting all seven optional Trust inputs must yield the declared defaults exactly — 0.25 / 1.0 / 1.0 / 5.0 / STATED_PRINCIPAL / 10 — because every downstream fee, interest and deadline calculation reads them."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E4", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", convention: "$.data.fee_basis_convention", biz_days: "$.data.consultation_response_business_days" }
          assert:
            - "data.special_servicing_fee_annual_pct == 0.25"
            - "data.workout_fee_rate_pct == 1.0 and data.liquidation_fee_rate_pct == 1.0"
            - "data.advance_interest_rate_pct == 5.0"
            - "data.fee_basis_convention == STATED_PRINCIPAL"
            - "data.consultation_response_business_days == 10"

      - name: loan_create_computed_ledger_fields_start_at_zero
        claim_type: computed_fields
        grounds:
          - entities.Loan.fields.ara_amount_usd
          - entities.Loan.fields.advances_outstanding_usd
          - calculations.ara_adjusted_advance_obligation
        distinguishing_aspect: "Nine computed Loan fields must be initialized by the server at create time rather than left null, and required_monthly_pi_advance_usd must already reflect the zero-ARA branch of the obligation calculation."
        test_recipe:
          setup:
            - "One trust."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E5", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-E05", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id", pi: "$.data.required_monthly_pi_advance_usd" }
          assert:
            - "data.accrued_unpaid_interest_usd == 0.00, ara_amount_usd == 0.00, advances_outstanding_usd == 0.00, fees_payable_usd == 0.00, realized_loss_usd == 0.00"
            - "data.consecutive_timely_payments == 0 and data.appraisal_required == false and data.is_modified == false"
            - "data.required_monthly_pi_advance_usd == 65000.00"
            - "data.transferred_to_special_on, transfer_event_code, asset_business_plan_due_date, last_appraised_value_usd, active_workout_plan_id and correction_source_plan_id are all null"
            - "Trust.${trust_id}.loans_in_special_servicing_count is still 0 — a MASTER_SERVICING loan is not in special servicing"

      - name: trust_create_with_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Trust
          - validations[priority=5]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted; supplying them in the body must not be honoured. The server either ignores the extra keys or rejects the body, and in the accept case the minted id must not equal the client's."
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E6", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000, id: "00000000-0000-4000-8000-000000000002", version: 99, created_at: "2020-01-01T00:00:00.000Z", total_ara_usd: 5000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", version_after: "$.data.version" }
          assert:
            - "data.id != 00000000-0000-4000-8000-000000000002 — the server minted its own UUID"
            - "data.version == 1, not 99"
            - "data.created_at == 2026-08-01T00:00:00.000Z, not 2020-01-01T00:00:00.000Z — created_at comes from the logical clock"
            - "data.total_ara_usd == 0.00 — a computed field is never seeded from the request body"

      - name: transfer_event_create_with_invalid_enum_event_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.ServicingTransferEvent.fields.event_code
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "event_code is a closed six-value enum; a plausible-looking but undeclared value must be refused at priority 5, before the qualification calculation ever runs, so no event row and no triggers_transfer flag appear."
        test_recipe:
          setup:
            - "One trust and one loan in MASTER_SERVICING."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E7", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-E07", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "MONETARY_DEFAULT_30D", occurred_on: "2026-07-15T00:00:00Z", evidence_note: "one missed payment" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { bad_enum_error: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /special-servicing/loans/${loan_id}/transfer-events returns total_count 0"
            - "A subsequent POST /special-servicing/loans/${loan_id}/servicing-status with to_status SPECIAL_SERVICING returns HTTP 422 ERR_NO_QUALIFYING_TRANSFER_EVENT, confirming nothing was recorded"

      - name: transfer_event_is_immutable_with_no_version_and_no_status_endpoint
        claim_type: immutability
        grounds:
          - entities.ServicingTransferEvent
          - endpoints[GET /special-servicing/loans/{id}/transfer-events]
        distinguishing_aspect: "ServicingTransferEvent declares common_fields false, so it carries id and created_at but no updated_at and no version, and §1.5 exposes no POST that mutates an existing event — the only field that ever changes is consumed_by_transfer, written by the loan transfer cascade, not by a client."
        test_recipe:
          setup:
            - "One loan with one BANKRUPTCY event, then transferred to special servicing so the cascade consumes the event."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E8", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-E08", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { event_id: "$.data.id", event_created_at: "$.data.created_at" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "GET /special-servicing/loans/${loan_id}/transfer-events"
              payload: { event_code: "BANKRUPTCY" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { event_after_id: "$.data[0].id", consumed: "$.data[0].consumed_by_transfer" }
          assert:
            - "The event row exposes id, created_at, loan_id, event_code, occurred_on, evidence_note, triggers_transfer and consumed_by_transfer"
            - "The event row exposes NO version field and NO updated_at field"
            - "data[0].id == ${event_id} and data[0].created_at == ${event_created_at} — unchanged by the transfer"
            - "data[0].triggers_transfer == true and data[0].consumed_by_transfer == true, flipped by the transfer cascade rather than by any client write"
            - "§1.5 declares no POST /special-servicing/transfer-events/{id} of any shape, so a client cannot rewrite history"

      - name: loan_create_with_absent_trust_id_returns_trust_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Loan.fields.trust_id
          - validations[priority=6]
          - errors.ERR_TRUST_NOT_FOUND
        distinguishing_aspect: "A body foreign key is resolved at priority 6, so a well-formed Loan naming an absent trust fails with the parent's 404 code rather than with a 400 or a dangling row."
        test_recipe:
          setup:
            - "Empty database — deliberately no Trust at all."
          setup_api_calls: []
          trigger:
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "00000000-0000-4000-8000-000000000003", loan_number: "L-E09", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { fk_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == ERR_TRUST_NOT_FOUND"
            - "GET /special-servicing/loans returns total_count 0 — no orphan loan is persisted"

      - name: consultation_subject_belonging_to_another_trust_rejected
        claim_type: cross_reference_integrity
        grounds:
          - validations[priority=7]
          - errors.ERR_SUBJECT_REFERENCE_MISMATCH
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so integrity between two sibling aggregates is enforced by explicit cross-reference checks: a consultation may only be issued to the trust that actually owns the subject plan. Both foreign keys resolve individually, which is exactly why priority 6 cannot catch this and priority 7 must."
        test_recipe:
          setup:
            - "Trust P owning loan P1 with a RECOMMENDED workout plan, and an unrelated trust Q."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-P1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_p_id: "$.data.id" }
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-Q1", closing_date: "2026-03-15T00:00:00Z", original_controlling_class_balance_usd: 25000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_q_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_p_id}", loan_number: "L-P01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
