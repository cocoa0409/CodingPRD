# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Hospital Volunteer Services & Auxiliary
# (breadth probe: every testable §1.1–§1.7 claim not already covered by §1.8)
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: application_creation_defaults
        claim_type: creation
        grounds: [entities.VolunteerApplication]
        distinguishing_aspect: "POST with the four required fields returns 201 with system fields initialized: status SUBMITTED, volunteer_id null, version 1, created_at read from the logical clock (2026-08-01T00:00:00Z), omitted notes null."
        test_recipe:
          setup: ["Clock at default/2026-08-01T00:00:00Z; empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
          trigger:
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "New Applicant", date_of_birth: "1999-09-09", email: "new@x.org", phone: "555-9001" }, as: VolunteerCoordinator, captures: { a_id: $.data.id, a_status: $.data.status, a_created: $.data.created_at, a_version: $.data.version } }
          assert:
            - "201; status == SUBMITTED (initial state)"
            - "volunteer_id is null and notes is null (defaults)"
            - "version == 1; created_at == 2026-08-01T00:00:00Z (logical clock, not wall clock)"
            - "id is a server-minted UUID with no type prefix"

      - name: volunteer_computed_fields_initialized
        claim_type: computed_fields
        grounds: [entities.Volunteer.fields.total_service_hours, entities.Volunteer.fields.recognition_points, entities.Volunteer.fields.compliance_posture]
        distinguishing_aspect: "Freshly approved volunteer: all computed fields initialized — hours 0, points 0, tier NONE, and compliance_posture FROZEN because all three clearance types are missing (HARD_FAIL x3)."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; application approved"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Init Vera", date_of_birth: "1990-01-01", email: "iv@x.org", phone: "555-9101" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
          trigger:
            - { call: "GET /auxiliary/volunteers/${v_id}", as: VolunteerCoordinator, captures: { v_status: $.data.service_status, v_joined: $.data.joined_at } }
            - { call: "GET /auxiliary/volunteers/${v_id}/summary", as: VolunteerCoordinator, captures: { s_hours: $.data.total_service_hours, s_pts: $.data.recognition_points, s_tier: $.data.recognition_tier, s_posture: $.data.compliance_posture, s_pc: $.data.accepted_placement_count, s_badge: $.data.live_badge_status } }
          assert:
            - "service_status == ONBOARDING; joined_at == 2026-08-01T00:00:00Z"
            - "summary: total_service_hours == 0, recognition_points == 0, recognition_tier == NONE"
            - "summary.compliance_posture == FROZEN (no clearance records at all)"
            - "summary.accepted_placement_count == 0 and live_badge_status == PENDING"

      - name: volunteer_update_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Volunteer.fields.total_service_hours]
        distinguishing_aspect: "Client-supplied computed field in a PUT body is ignored: total_service_hours stays 0 after the update while email changes and version increments by exactly 1."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; volunteer approved (version 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Rogue Field", date_of_birth: "1990-01-01", email: "rf@x.org", phone: "555-9102" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "GET /auxiliary/volunteers/${v_id}", as: VolunteerCoordinator, captures: { v0: $.data.version } }
          trigger:
            - { call: "PUT /auxiliary/volunteers/${v_id}", payload: { email: "changed@x.org", total_service_hours: 999, expected_volunteer_version: "${v0}" }, as: VolunteerCoordinator, captures: { v_email: $.data.email, v_hours: $.data.total_service_hours, v_ver: $.data.version } }
          assert:
            - "email == changed@x.org (writable field applied)"
            - "total_service_hours == 0 (client-supplied 999 ignored — computed field is server-owned)"
            - "version == ${v0} + 1"

      - name: clearance_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Clearance.fields.clearance_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "clearance_type outside {BACKGROUND, HEALTH_TB, HEALTH_FLU} fails request-shape validation with ERR_INVALID_REQUEST (400); no row created."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; volunteer approved"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Enum Test", date_of_birth: "1990-01-01", email: "et@x.org", phone: "555-9103" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
          trigger:
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "DENTAL", document_ref: "doc-1" }, as: Screener, as_user_id: "screener-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
            - "GET /auxiliary/clearances?volunteer_id=${v_id} returns 0 rows"

      - name: volunteer_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but nonexistent volunteer UUID -> ERR_NOT_FOUND (404); the envelope keeps response_type error."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
          trigger:
            - { call: "GET /auxiliary/volunteers/11111111-2222-4333-8444-555555555555", as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: recognition_event_immutability
        claim_type: immutability
        grounds: [entities.RecognitionEvent]
        distinguishing_aspect: "RecognitionEvent is append-only (common_fields: false): the fetched row carries id and created_at but NO version and NO updated_at fields, and the scaffold declares no update/delete transition for it."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; adult volunteer fully ACTIVE"
            - "Seven GIFT_SHOP entries (6 x 960min + 1 x 240min) approved in order -> points 100.00 -> one TIER_INCREASED event"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Event Eva", date_of_birth: "1990-05-15", email: "eva@x.org", phone: "555-9201" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { vol_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { c2: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "GET /auxiliary/training-records", payload: {}, as: VolunteerCoordinator, captures: { tr: "$.data[0].id" } }
            - { call: "POST /auxiliary/training-records/${tr}/complete", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/departments", payload: { name: "Gift Shop", head_user_id: "dh-2" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "Gift Shop Clerk", category: "GIFT_SHOP", minimum_age: 16 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-2", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-2" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${vol_id}" }, as: VolunteerCoordinator, captures: { plc: $.data.id } }
            - { call: "POST /auxiliary/placements/${plc}/accept", as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /auxiliary/volunteers/${vol_id}/activate", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-03", minutes: 960, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e1: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-04", minutes: 960, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e2: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-05", minutes: 960, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e3: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-06", minutes: 960, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e4: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-07", minutes: 960, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e5: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-08", minutes: 960, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e6: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-09", minutes: 240, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e7: $.data.id } }
          trigger:
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e1}/approve", payload: { expected_volunteer_version: "${v1}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e2}/approve", payload: { expected_volunteer_version: "${v2}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v3: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e3}/approve", payload: { expected_volunteer_version: "${v3}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v4: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e4}/approve", payload: { expected_volunteer_version: "${v4}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v5: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e5}/approve", payload: { expected_volunteer_version: "${v5}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v6: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e6}/approve", payload: { expected_volunteer_version: "${v6}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v7: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e7}/approve", payload: { expected_volunteer_version: "${v7}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/recognition-events", payload: {}, as: VolunteerCoordinator, captures: { ev_id: "$.data[0].id" } }
            - { call: "GET /auxiliary/recognition-events/${ev_id}", as: VolunteerCoordinator, captures: { ev_tier: $.data.tier } }
          assert:
            - "event exists with tier == BRONZE, event_type == TIER_INCREASED, points_snapshot == 100.00"
            - "the event JSON contains id and created_at but has NO version key and NO updated_at key (common_fields: false)"
            - "the scaffold declares no PUT/PATCH/DELETE or action endpoint for recognition-events (append-only)"

      - name: clearance_fk_reverse_lookup_filtered_list
        claim_type: parent_relationships
        grounds: [entities.Clearance.fields.volunteer_id]
        distinguishing_aspect: "Flat-topology FK reverse reachability: GET /clearances?volunteer_id=X returns exactly X's rows (2 after two submissions); an unknown volunteer id yields 200 with an empty list (filter semantics, not 404)."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; volunteer approved; two clearances submitted (BACKGROUND, HEALTH_TB)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "FK Fred", date_of_birth: "1990-01-01", email: "ff@x.org", phone: "555-9301" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1" }
          trigger:
            - { call: "GET /auxiliary/clearances?volunteer_id=${v_id}", payload: {}, as: Screener, captures: { mine: $.data } }
            - { call: "GET /auxiliary/clearances?volunteer_id=11111111-2222-4333-8444-555555555555", payload: {}, as: Screener, captures: { none: $.data } }
          assert:
            - "filtered list for the real volunteer contains exactly 2 rows (both SUBMITTED)"
            - "filtered list for the unknown id returns 200 with an empty data array (not 404)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: decide_from_submitted_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.VolunteerApplication
          - errors[ERR_APPLICATION_NOT_ACTIONABLE]
        distinguishing_aspect: "decide is only valid from IN_REVIEW: calling it on a SUBMITTED application fails ERR_APPLICATION_NOT_ACTIONABLE and creates no volunteer."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; application created (SUBMITTED, review never started)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Skip Step", date_of_birth: "1990-01-01", email: "ss@x.org", phone: "555-9401" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
          trigger:
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_NOT_ACTIONABLE (http 409)"
            - "GET /auxiliary/volunteers returns 0 rows (no cascade fired)"

      - name: terminal_application_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.VolunteerApplication]
        distinguishing_aspect: "Terminal states lock: a REJECTED application rejects start-review AND withdraw; an APPROVED application rejects withdraw — all with ERR_APPLICATION_NOT_ACTIONABLE."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; app1 driven to REJECTED; app2 driven to APPROVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Rej Rita", date_of_birth: "1990-01-01", email: "rr@x.org", phone: "555-9402" }, as: VolunteerCoordinator, captures: { app1: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/decide", payload: { decision: "REJECT", rejection_reason: "failed interview" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "App Andy", date_of_birth: "1991-01-01", email: "aa@x.org", phone: "555-9403" }, as: VolunteerCoordinator, captures: { app2: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app2}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app2}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector }
          trigger:
            - { call: "POST /auxiliary/volunteer-applications/${app1}/start-review", as: VolunteerCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/withdraw", as: VolunteerCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /auxiliary/volunteer-applications/${app2}/withdraw", as: VolunteerCoordinator, captures: { err3: $.data.error_id } }
          assert:
            - "all three calls fail with ERR_APPLICATION_NOT_ACTIONABLE (http 409) — no transitions out of REJECTED or APPROVED"

      - name: placement_third_counter_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Placement.OFFERED_to_COUNTERED
          - errors[ERR_COUNTER_ROUND_EXHAUSTED]
        distinguishing_aspect: "The negotiation cycle is bounded: after two counters (counter_rounds == 2), a third counter fails ERR_COUNTER_ROUND_EXHAUSTED while the placement stays COUNTERED."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; cleared ONBOARDING volunteer; request OPEN; placement OFFERED; two counter/reoffer rounds completed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/departments", payload: { name: "Pediatrics", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "Playroom Aide", category: "PATIENT_FACING", minimum_age: 18 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-1", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "V Nego", date_of_birth: "1990-01-01", email: "vn@x.org", phone: "555-9404" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { c2: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v_id}" }, as: VolunteerCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /auxiliary/placements/${p1}/counter", payload: { counter_note: "c1" }, as: Volunteer, as_user_id: "${v_id}" }
