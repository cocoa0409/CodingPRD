            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "IN_PERSON" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep_id}/reports", payload: { report_type: "FINAL", findings_summary: "no data", no_significant_findings: false }, as: Physician, as_user_id: "${dr_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /v1/episodes/${ep_id}/reports", payload: { report_type: "FINAL", findings_summary: "no data, waived", no_significant_findings: true }, as: Physician, as_user_id: "${dr_id}", captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /v1/reports/${r1_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/reports/${r2_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}" }
          assert:
            - "First trigger returns http 422 ERR_EMPTY_MONITORING_DATA (transmission_count == 0 with no_significant_findings false)"
            - "DiagnosticReport.${r2_id}.status == FINALIZED (flag true admits the same zero-count episode)"
            - "DiagnosticReport.${r2_id}.turnaround_hours == 0.0 (finalized_at == completed_at == 2026-05-11T00:00:00Z)"
            - "DiagnosticReport.${r2_id}.sla_met == true (0.0 <= 72h)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: episode_complete_requires_no_open_compliance_events
        grounds:
          - state_machines.MonitoringEpisode (clinical_status).MONITORING_to_COMPLETED
          - validations[priority=8] (ERR_OPEN_COMPLIANCE_EVENTS)
        distinguishing_aspect: |
          Entity pair ComplianceEvent -> MonitoringEpisode: completion is gated on
          the child collection having zero OPEN rows; the sibling instance crosses
          a different pair (DiagnosticReport -> BillingPeriod).
        test_recipe:
          setup:
            - "EVENT episode MONITORING; one TRANSMISSION_GAP ComplianceEvent OPEN (sweep at +48h)"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Mona Gate", date_of_birth: "1954-02-14", mrn: "MRN-1014", phone: "555-0114", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Gate", npi: "1000000014", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1014", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 10 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /v1/compliance-events/${ev_id}/resolve", payload: { resolution_action: "CONTACTED_PATIENT" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
          assert:
            - "First trigger returns http 422 ERR_OPEN_COMPLIANCE_EVENTS (child OPEN row gates parent transition)"
            - "After resolve: third call returns 200 and MonitoringEpisode.${ep_id}.clinical_status == COMPLETED"

      - name: billing_submit_requires_finalized_report
        grounds:
          - state_machines.BillingPeriod.READY_to_SUBMITTED
          - validations[priority=8] (ERR_REPORT_NOT_FINALIZED)
        distinguishing_aspect: |
          Entity pair DiagnosticReport -> BillingPeriod: submit is gated on the
          episode holding at least one FINALIZED report; the sibling instance
          crosses ComplianceEvent -> MonitoringEpisode, a different pair.
        test_recipe:
          setup:
            - "EVENT episode 10 days COMPLETED; billing window READY via sweep; no report exists yet"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Nina Ref", date_of_birth: "1955-03-15", mrn: "MRN-1015", phone: "555-0115", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Ref", npi: "1000000015", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1015", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 10 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "PHONE" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bp_id: "$.data[0].id" } }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/billing-periods/${bp_id}/submit", payload: {}, as: BillingSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /v1/episodes/${ep_id}/reports", payload: { report_type: "INTERIM", findings_summary: "summary" }, as: Physician, as_user_id: "${dr_id}", captures: { r_id: $.data.id } }
            - { call: "POST /v1/reports/${r_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}" }
            - { call: "POST /v1/billing-periods/${bp_id}/submit", payload: {}, as: BillingSpecialist }
          assert:
            - "First trigger returns http 422 ERR_REPORT_NOT_FINALIZED (report entity state gates billing entity transition)"
            - "Final trigger returns 200 and BillingPeriod.${bp_id}.status == SUBMITTED with submitted_total_cents == 20040"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: device_refurbishment_buffer
        grounds:
          - validations[priority=7] (ERR_DEVICE_NOT_REFURBISHED)
          - state_machines.Device.RETURN_IN_TRANSIT_to_REFURBISHING
        distinguishing_aspect: |
          Buffer-gap interval semantics on Device: a 48h exclusion buffer
          [received_at, received_at+48h) blocks reservation even though no status
          lock persists; the sibling instance uses half-open adjacency-allowed
          semantics on BillingPeriod — different interval arithmetic, different
          resource.
        test_recipe:
          setup:
            - "Device EV-A returned at 2026-05-10T12:00:00Z -> REFURBISHING, refurbishment_due_at 2026-05-12T12:00:00Z; a second patient/order ready for enrollment"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Omar First", date_of_birth: "1956-04-16", mrn: "MRN-1016", phone: "555-0116", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p1_id: $.data.id } }
            - { call: "POST /v1/patients", payload: { full_name: "Otto Second", date_of_birth: "1957-05-17", mrn: "MRN-1017", phone: "555-0117", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p2_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Buff", npi: "1000000016", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1016", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p1_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o1_id: $.data.id, o1_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o1_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o1_v}" }, as: EnrollmentCoordinator, captures: { e1_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e1_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e1_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep1_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep1_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep1_id}/return-shipments", payload: {}, as: InventoryManager, captures: { rs_id: $.data.id } }
            - { call: "POST /v1/return-shipments/${rs_id}/mark-received", payload: {}, as: InventoryManager }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p2_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o2_id: $.data.id, o2_v: $.data.version } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T12:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o2_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o2_v}" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T13:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders/${o2_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o2_v}" }, as: EnrollmentCoordinator, captures: { e2_id: $.data.id } }
          assert:
            - "First trigger (24h into the 48h buffer) returns http 409 ERR_DEVICE_NOT_REFURBISHED"
            - "Device.${d_id}.refurbishment_due_at == 2026-05-12T12:00:00Z (received_at + 48h)"
            - "After sweep past the buffer: Device.${d_id}.status == IN_STOCK and enrollment ${e2_id} created with device RESERVED"

      - name: billing_window_half_open_adjacency
        grounds:
          - calculations.billing_period_windows
          - validations[priority=7] (ERR_BILLING_WINDOW_OVERLAP)
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on BillingPeriod: adjacent
          windows (end == next.start) coexist while any overlapping regeneration
          is rejected; different interval arithmetic and different resource from
          the sibling device-buffer instance.
        test_recipe:
          setup:
            - "EVENT episode prescribed 36 days starting 2026-05-01T00:00:00Z; billing generated once (two windows)"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Paul Half", date_of_birth: "1958-06-18", mrn: "MRN-1018", phone: "555-0118", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Half", npi: "1000000018", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1018", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 36 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
          trigger:
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bp0_id: "$.data[0].id", bp1_id: "$.data[1].id" } }
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "First generate returns 2 windows: BillingPeriod.${bp0_id} [2026-05-01T00:00:00Z, 2026-05-31T00:00:00Z) and BillingPeriod.${bp1_id} [2026-05-31T00:00:00Z, 2026-06-06T00:00:00Z)"
            - "bp0.end_date == bp1.start_date (adjacency at the half-open boundary is allowed, no overlap error on creation)"
            - "bp0.provisional_total_cents == 60120 (30 days) and bp1.provisional_total_cents == 12024 (6 days: TC 10983 + PC 1041)"
            - "Second generate returns http 409 ERR_BILLING_WINDOW_OVERLAP (existing ACCRUING windows overlap the range)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: device_pool_unit_conservation
        grounds:
          - calculations.inventory_availability
          - state_machines.Device.IN_STOCK_to_RESERVED
          - state_machines.Device.RESERVED_to_IN_STOCK
        distinguishing_aspect: |
          Conserved quantity is a unit count: reserve (forward) + abort
          (compensating) leaves the per-model pool partition invariant —
          IN_STOCK+RESERVED+DEPLOYED+RETURN_IN_TRANSIT+REFURBISHING+LOST == 1
          throughout; the sibling conserves a monetary quantity (cents).
        test_recipe:
          setup:
            - "Fleet: exactly one EVENT device EV-1019 registered; order ready"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Quinn Pool", date_of_birth: "1959-07-19", mrn: "MRN-1019", phone: "555-0119", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Pool", npi: "1000000019", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1019", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/abort", payload: {}, as: EnrollmentCoordinator }
          assert:
            - "After reserve: Device.${d_id}.status == RESERVED; pool: IN_STOCK 0 + RESERVED 1 == 1 total"
            - "After abort (compensating action): Device.${d_id}.status == IN_STOCK; pool: IN_STOCK 1 + all others 0 == 1 total"
            - "GET /v1/devices?model=EVENT total_count == 1 before, between, and after (no unit created or destroyed by the reserve/abort pair)"

      - name: billing_adjustment_monetary_conservation
        grounds:
          - state_machines.BillingPeriod.SUBMITTED_to_ADJUSTMENT_PROPOSED
          - state_machines.BillingPeriod.ADJUSTMENT_PROPOSED_to_ADJUSTED
          - entities.BillingPeriod.fields.recognized_total_cents
        distinguishing_aspect: |
          Conserved quantity is monetary cents: a +500 approved adjustment
          (forward) paired with a -500 approved adjustment (compensating) restores
          recognized_total_cents to exactly the submitted snapshot 20040,
          honoring recognized == submitted_total + sum(approved_deltas); the
          sibling conserves a unit count, not money.
        test_recipe:
          setup:
            - "EVENT episode 10 days COMPLETED, window READY, INTERIM report FINALIZED, period SUBMITTED with submitted_total_cents 20040"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Rita Cent", date_of_birth: "1961-08-20", mrn: "MRN-1020", phone: "555-0120", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Cent", npi: "1000000020", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1020", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 10 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bp_id: "$.data[0].id" } }
            - { call: "POST /v1/episodes/${ep_id}/reports", payload: { report_type: "INTERIM", findings_summary: "ok" }, as: Physician, as_user_id: "${dr_id}", captures: { r_id: $.data.id } }
            - { call: "POST /v1/reports/${r_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}" }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/billing-periods/${bp_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "billing-1" }
          trigger:
            - { call: "POST /v1/billing-periods/${bp_id}/propose-adjustment", payload: { delta_cents: 500, reason: "late documentation" }, as: BillingSpecialist, as_user_id: "billing-1" }
            - { call: "POST /v1/billing-periods/${bp_id}/approve-adjustment", payload: {}, as: BillingSpecialist, as_user_id: "billing-2" }
            - { call: "POST /v1/billing-periods/${bp_id}/propose-adjustment", payload: { delta_cents: -500, reason: "reversal of prior adjustment" }, as: BillingSpecialist, as_user_id: "billing-1" }
            - { call: "POST /v1/billing-periods/${bp_id}/approve-adjustment", payload: {}, as: BillingSpecialist, as_user_id: "billing-2" }
          assert:
            - "After first approve: BillingPeriod.${bp_id}.recognized_total_cents == 20540 (20040 + 500)"
            - "After compensating pair: BillingPeriod.${bp_id}.recognized_total_cents == 20040 == submitted_total_cents (invariant: recognized == submitted + sum(approved_deltas) = 20040 + 500 - 500)"
            - "BillingPeriod.${bp_id}.approved_adjustment_cents == 0 and status == ADJUSTED"
