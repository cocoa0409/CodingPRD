        distinguishing_aspect: "The certifier checks stack: the reviewer assignment must be ACTIVE (priority 17) before the identity and credential clauses of priority 28 are evaluated, so a still-PROPOSED reviewer assignment yields ERR_ASSIGNMENT_NOT_ACTIVE even when the reviewer is also the preparer and would fail segregation anyway. Priority 28 then covers TWO different defects under ONE id: naming the preparer's own assignment as reviewer, and naming an ACTIVE reviewer who is an accredited representative rather than an AUTHORIZED_ATTORNEY staff attorney."
        test_recipe:
