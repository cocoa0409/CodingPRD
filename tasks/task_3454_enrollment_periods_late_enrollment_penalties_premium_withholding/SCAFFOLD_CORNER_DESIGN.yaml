        excluded_because:
          difficulty_instance: irmaa_floor_inclusive_boundary
          rationale: "Lower-bound-inclusive tier floor asserted at floor and floor-1 in the difficulty instance."

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: enroll_part_c_via_enrollments_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_UNSUPPORTED_PART]"]
        distinguishing_aspect: "PART_C rows exist only via election effectivity; the public enrollments endpoint rejects PART_C even while a window is open."
        test_recipe:
          setup: ["beneficiary DOB 1961-12-14; clock 2026-10-10 (IEP open)"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Part Cee", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_C" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "http 422, error_id == ERR_UNSUPPORTED_PART"
      - name: appeal_against_provisional_determination_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", state_machines.PremiumDetermination.status]
        distinguishing_aspect: "Only FINAL determinations are appealable; a PROVISIONAL one (2025 data still missing) draws ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Rate schedule 2027; beneficiary DOB 1960-01-15; PART_B enrolled 2025-01-10; ONLY tax year 2024 present"
            - "determination 2027/PART_B created PROVISIONAL (basis 2024)"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2027, part_b_standard_cents: 19000, part_d_national_base_cents: 3600, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7600, part_d_surcharge_cents: 1400 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 19000, part_d_surcharge_cents: 3620 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 30400, part_d_surcharge_cents: 5830 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 41800, part_d_surcharge_cents: 8060 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 45600, part_d_surcharge_cents: 8810 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Prov Appeal", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2024, magi_cents: 9000000, filing_status: "SINGLE" }
              as: IrsDataAgent
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2027, part: "PART_B" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { det_id: "$.data.id", det_status: "$.data.status" }
          trigger:
            - call: "POST /medicare/appeals"
              payload: { premium_determination_id: "${det_id}", life_event_type: "WORK_REDUCTION", event_date: "2026-05-01", claimed_magi_cents: 8000000 }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "setup consequence: determination status == PROVISIONAL"
            - "http 409, error_id == ERR_INVALID_STATE"
      - name: oep_election_without_active_ma_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=33]", "errors[ERR_OEP_REQUIRES_MA]"]
        distinguishing_aspect: "OEP_MA is for current MA members only; an Original-coverage beneficiary in the OEP season is rejected (and this constraint fires before the target-unchanged check)."
        test_recipe:
          setup: ["beneficiary DOB 1960-01-15 with PART_B enrolled 2025-01-10; clock 2027-02-10 (OEP window)"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Oep No", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { b_v: "$.data.version" }
          trigger:
            - call: "POST /medicare/elections"
              payload: { beneficiary_id: "${b_id}", election_window: "OEP_MA", target_coverage: "ORIGINAL", expected_beneficiary_version: "${b_v}" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "http 422, error_id == ERR_OEP_REQUIRES_MA (no ACTIVE PART_C enrollment exists)"
      - name: oep_second_election_same_season_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=34]", "errors[ERR_OEP_ELECTION_ALREADY_USED]", calculations.calc_election_effectivity]
        distinguishing_aspect: "OEP_MA allows exactly ONE election per season (contrast AEP last-in-wins): the second attempt in the same season fails even though its target differs from the current coverage."
        test_recipe:
          setup:
            - "beneficiary DOB 1960-01-15; PART_B enrolled 2025-01-10"
            - "AEP-2026 election to MA at clock 2026-10-20; cycle at 2027-01-05 effectuates it -> PART_C ACTIVE (current_coverage now MA)"
            - "clock 2027-02-10 (OEP-2027): first OEP election target ORIGINAL succeeds (GOVERNING)"
          setup_api_calls:
