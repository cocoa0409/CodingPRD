# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Debt Settlement Program (EXPERT). 9 rule_ids x 2 instances = 18 instances.
# Flat topology: child resources are top-level collections with program_id in body.
# Every grounds[] ref resolves to SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: portfolio_estimated_vs_realized_savings_diverge
        grounds:
          - calculations.portfolio_savings
          - entities.Program.fields.estimated_total_savings
          - entities.Program.fields.realized_total_savings
        distinguishing_aspect: |
          Same Program data yields two different savings numbers: the ESTIMATE variant
          (forward-looking over open debts at target_settlement_pct) and the REALIZED
          variant (tally over SETTLED debts only) — this dual-variant subject is the
          Program-level portfolio projection.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; Client + Program (monthly 600, target 0.50, reserve_floor 0)."
            - "Two debts enrolled: 4000 and 5000 (total 9000 -> fee tier 0.25 frozen on both)."
            - "Program ACTIVE. Six CLEARED deposits of 600 in distinct month buckets (balance 3600)."
            - "An offer on the 5000 debt at 0.40 accepted, settlement funded then completed (debt SETTLED, settled 2000, fee 500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "Dana Debtor", email: "dana@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600, target_settlement_pct: 0.50, reserve_floor: 0 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred A", account_number: "AA-1", original_balance: 4000 }
              as: ProgramAdmin
              captures: { debt_a: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred B", account_number: "BB-2", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_b: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v_after_activate: $.data.version }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-01-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-02-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-03-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-04-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-06-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_b}", offer_pct: 0.40, due_date: "2026-09-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_b: $.data.id }
            - call: "POST /offers/${offer_b}/accept"
              payload: { expected_program_version: "${v_after_activate}" }
              as: NegotiationAgent
            - call: "POST /settlements"
              payload: { program_id: "${prog_id}", offer_id: "${offer_b}" }
              as: NegotiationAgent
              captures: { settle_b: $.data.id }
            - call: "POST /settlements/${settle_b}/complete"
              payload: {}
              as: NegotiationAgent
          trigger:
            - call: "GET /programs/${prog_id}"
              as: ProgramAdmin
              captures: { est: $.data.estimated_total_savings, real: $.data.realized_total_savings }
          assert:
            - "Program.${prog_id}.estimated_total_savings == 1500.00  (open debt 4000 only: 4000 - 2000 - 500)"
            - "Program.${prog_id}.realized_total_savings == 2500.00  (settled debt 5000: 5000 - 2000 - 500)"
            - "Program.${prog_id}.estimated_total_savings != Program.${prog_id}.realized_total_savings"

      - name: account_balance_instantaneous_vs_projected_diverge
        grounds:
          - calculations.account_reserve_state
          - entities.DedicatedAccount.fields.balance
          - validations[priority=13]
        distinguishing_aspect: |
          On a different entity domain (the DedicatedAccount cash ledger), the same
          deposit/settlement data yields two different reserve figures: the instantaneous
          balance (CLEARED deposits minus disbursed) versus the forward-looking projected
          balance at an offer's due_date (instantaneous plus scheduled future deposits).
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; Client+Program (monthly 600, deposit_day 15, reserve_floor 0)."
            - "One debt 5000 (tier 0.25). Program ACTIVE."
            - "Two CLEARED deposits of 600 in past months (Mar, Apr) -> balance 1200. An offer at 0.40 (settlement 2000, fee 500, need 2500) with due_date 2026-08-20 capturing 3 future deposit days (Jun15, Jul15, Aug15 = +1800; 1200 + 1800 = 3000 >= 2500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "Pat Proj", email: "pat@x.com", state_code: "TX" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600, deposit_day_of_month: 15, reserve_floor: 0 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "C-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-03-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-04-15T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.40, due_date: "2026-08-20T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_id: $.data.id }
          trigger:
            - call: "GET /accounts"
              payload: { program_id: "${prog_id}" }
              as: NegotiationAgent
              captures: { bal: "$.data[0].balance" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_program_version: "${v1}" }
              as: NegotiationAgent
              captures: { offer_status: $.data.status }
          assert:
            - "DedicatedAccount.balance == 1200.00 (instantaneous: two CLEARED deposits)"
            - "SettlementOffer.${offer_id}.status == ACCEPTED (projected balance 1200 + 3*600 = 3000 >= 2000 + 500 + 0)"
            - "The instantaneous balance 1200.00 is strictly less than the projected reserve requirement 2500.00, so only the forward-looking variant permits acceptance"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: offer_quote_conditional_surcharge_tier_min_cap
        grounds:
          - calculations.settlement_offer_quote
          - entities.SettlementOffer.fields.projected_fee
          - entities.Debt.fields.fee_rate_pct
        distinguishing_aspect: |
          MODE (a): a formula with >=3 inputs and non-linear interaction — projected_fee
          depends on current_balance, offer_pct, the snapshotted fee_rate_pct, a conditional
          branch on Debt.status==LAWSUIT, and a min(...) cap; the litigation branch selects
          a different tiered rate via min(base+0.03, 0.25).
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program. Two debts 6000 and 4000 (total 10000 -> tier 0.22 frozen on both)."
            - "Program ACTIVE. The 6000 debt referred to LAWSUIT so its offers carry the +0.03 surcharge capped at 0.25 -> effective 0.25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "Lee Litig", email: "lee@x.com", state_code: "NY" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 800 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Big Cred", account_number: "BIG-1", original_balance: 6000 }
              as: ProgramAdmin
              captures: { debt_big: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Small Cred", account_number: "SM-2", original_balance: 4000 }
              as: ProgramAdmin
              captures: { debt_small: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /lawsuits"
              payload: { program_id: "${prog_id}", debt_id: "${debt_big}", court_reference: "CASE-99", filed_at: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_big}", offer_pct: 0.50, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { sa: $.data.settlement_amount, pf: $.data.projected_fee }
          assert:
            - "SettlementOffer.settlement_amount == 3000.00 (6000 * 0.50)"
            - "SettlementOffer.projected_fee == 750.00 (3000 * min(0.22+0.03, 0.25) = 3000 * 0.25)"
            - "Debt.${debt_big}.fee_rate_pct == 0.22 (frozen tier; surcharge applies only to the offer's effective rate, not the snapshot)"

      - name: portfolio_savings_round_per_debt_then_sum
        grounds:
          - calculations.portfolio_savings
          - entities.Program.fields.estimated_total_savings
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters — estimated_total_savings rounds
          est_settlement and est_fee PER DEBT then sums; the scaffold pins per-debt rounding
          before summation, distinct from a sum-then-round reading.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program (target 0.50). Two debts 333 and 777 (total 1110 -> tier 0.25)."
            - "Program ACTIVE; both debts remain ENROLLED so both feed the estimate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "Rou Nd", email: "rnd@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 100, target_settlement_pct: 0.50 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "C1", account_number: "R-1", original_balance: 333 }
              as: ProgramAdmin
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "C2", account_number: "R-2", original_balance: 777 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /programs/${prog_id}"
              as: ProgramAdmin
              captures: { est: $.data.estimated_total_savings }
          assert:
            - "Program.estimated_total_savings == 416.24  (debt 333: s=166.50 f=41.63 sav=124.87; debt 777: s=388.50 f=97.13 sav=291.37; sum 124.87+291.37=416.24)"
            - "Per-debt rounding pinned: round each est_settlement and est_fee to cents BEFORE computing and summing per-debt savings"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: program_parallel_phase_and_standing_dimensions
        grounds:
          - state_machines.Program.field.program_phase
          - state_machines.Program.field.account_standing
          - entities.Program.fields.account_standing
        distinguishing_aspect: |
          Program carries two INDEPENDENT state dimensions that evolve separately:
          program_phase (ENROLLING->ACTIVE) advances via activate while account_standing
          (CURRENT->DELINQUENT) advances independently from a MISSED deposit — neither
          transition is a precondition of the other.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program. One debt 5000. Program ACTIVE (phase dimension advanced)."
            - "One MISSED deposit recorded so missed_deposit_count == 1 (standing dimension moves CURRENT->DELINQUENT) while phase stays ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "Para Llel", email: "para@x.com", state_code: "FL" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "P-1", original_balance: 5000 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-06-15T00:00:00Z", amount: 600, status: "MISSED" }
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}"
              as: ProgramAdmin
              captures: { phase: $.data.program_phase, standing: $.data.account_standing }
          assert:
            - "Program.${prog_id}.program_phase == ACTIVE"
            - "Program.${prog_id}.account_standing == DELINQUENT"
            - "Program.${prog_id}.missed_deposit_count == 1"

      - name: offer_branching_fork_accept_rejects_siblings
        grounds:
          - state_machines.SettlementOffer.field.status
          - state_machines.SettlementOffer.PENDING_to_ACCEPTED
          - state_machines.SettlementOffer.PENDING_to_REJECTED
        distinguishing_aspect: |
          On a DIFFERENT entity (SettlementOffer), the machine forks PENDING ->
          {ACCEPTED, REJECTED, EXPIRED} with divergent side effects: accepting one offer
          on a debt drives sibling PENDING offers on the same debt to REJECTED.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program. One debt 5000 (tier 0.25). Program ACTIVE."
            - "Five CLEARED deposits of 600 (balance 3000, need 2500)."
            - "Two PENDING offers on the SAME debt with due_dates >30 days apart: offer-1 at 0.40 due 2026-07-01, offer-2 at 0.45 due 2026-12-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "For Kk", email: "fork@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600, reserve_floor: 0 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "F-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-01-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-02-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-03-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-04-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.40, due_date: "2026-07-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_1: $.data.id }
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.45, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_2: $.data.id }
          trigger:
            - call: "POST /offers/${offer_1}/accept"
              payload: { expected_program_version: "${v1}" }
              as: NegotiationAgent
            - call: "GET /offers/${offer_2}"
              as: NegotiationAgent
              captures: { o2_status: $.data.status }
          assert:
            - "SettlementOffer.${offer_1}.status == ACCEPTED"
            - "SettlementOffer.${offer_2}.status == REJECTED (sibling auto-rejected on accept)"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settlement_complete_cascade_debt_taxevent_lawsuit
        grounds:
          - state_machines.Settlement.FUNDED_to_COMPLETED
          - state_machines.Debt.LAWSUIT_to_SETTLED
          - state_machines.Lawsuit.REFERRED_to_RESOLVED_SETTLED
          - state_machines.TaxEvent.field.status
        distinguishing_aspect: |
          Depth-3 chain from a single completion: completing the Settlement mutates the
          Debt to SETTLED; that Debt mutation ITSELF issues a TaxEvent (1099-C) AND
          resolves the linked Lawsuit to RESOLVED_SETTLED — each hop caused by the prior.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program. Two debts 6000 and 4000 (total 10000 -> tier 0.22). Program ACTIVE."
            - "The 6000 debt referred to LAWSUIT (effective fee rate 0.25 on its offer)."
            - "Five CLEARED deposits of 800 (balance 4000). Offer 0.50 accepted (settlement 3000, fee 750, need 3750 <= 4000). Settlement funded (FUNDED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "Cas Cade", email: "cas@x.com", state_code: "OH" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 800, reserve_floor: 0 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "CC-6", original_balance: 6000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Filler", account_number: "CC-4", original_balance: 4000 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /lawsuits"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", court_reference: "CASE-1", filed_at: "2026-05-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { lawsuit_id: $.data.id }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-01-05T00:00:00Z", amount: 800 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-02-05T00:00:00Z", amount: 800 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-03-05T00:00:00Z", amount: 800 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-04-05T00:00:00Z", amount: 800 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-05T00:00:00Z", amount: 800 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.50, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_program_version: "${v1}" }
              as: NegotiationAgent
            - call: "POST /settlements"
              payload: { program_id: "${prog_id}", offer_id: "${offer_id}" }
              as: NegotiationAgent
              captures: { settle_id: $.data.id }
          trigger:
            - call: "POST /settlements/${settle_id}/complete"
              payload: {}
              as: NegotiationAgent
            - call: "GET /debts/${debt_id}"
              as: ProgramAdmin
              captures: { debt_status: $.data.status }
            - call: "GET /lawsuits/${lawsuit_id}"
              as: ProgramAdmin
              captures: { lawsuit_status: $.data.status }
            - call: "GET /tax-events"
              payload: { source_settlement_id: "${settle_id}" }
              as: ProgramAdmin
              captures: { te_status: "$.data[0].status", te_forgiven: "$.data[0].forgiven_amount", te_report: "$.data[0].reportable" }
          assert:
            - "Debt.${debt_id}.status == SETTLED"
            - "Lawsuit.${lawsuit_id}.status == RESOLVED_SETTLED"
            - "TaxEvent forgiven_amount == 3000.00 (6000 - 3000) and reportable == true (>= 600) and status == ISSUED"

      - name: program_drop_cascade_debts_offers
        grounds:
          - state_machines.Program.ACTIVE_to_TERMINATED
          - state_machines.Debt.ENROLLED_to_WITHDRAWN
          - state_machines.SettlementOffer.field.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (Client drop): dropping the Program
          moves each open Debt to WITHDRAWN, and that Debt withdrawal ITSELF expires the
          debt's PENDING offers — a distinct propagation pattern from the completion cascade.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program. One debt 5000. Program ACTIVE."
            - "One PENDING offer 0.40 due 2026-12-01 on the debt (debt now IN_NEGOTIATION)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "Dro Pp", email: "drop@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "D-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.40, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/drop"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /debts/${debt_id}"
              as: ProgramAdmin
              captures: { debt_status: $.data.status }
            - call: "GET /offers/${offer_id}"
              as: ProgramAdmin
              captures: { offer_status: $.data.status }
          assert:
            - "Program.${prog_id}.program_phase == TERMINATED"
            - "Debt.${debt_id}.status == WITHDRAWN"
            - "SettlementOffer.${offer_id}.status == EXPIRED"

