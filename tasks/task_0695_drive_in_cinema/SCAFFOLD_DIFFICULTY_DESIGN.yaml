scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_weather_pro_rata_vs_voluntary_tier
        grounds:
          - calculations.refund_amount
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Showtime.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          The SAME paid reservation (amount_paid_cents=5300 on a double feature) refunds 2650 when cancelled by a
          WEATHER cancellation with 1 of 2 features remaining (pro-rata) but 5300 when the patron voluntarily
          cancels 48h ahead (policy tier) — two valid algorithms on the Reservation/RefundRecord domain produce
          different cents for identical paid amounts.
        test_recipe:
          setup:
            - "A venue, lot (stall_count=10), two films (90m each), a PER_CAR double-feature showtime starting far in the future, priced base=2000/included=2/per_extra=600/surcharge=1500."
            - "A paid PER_CAR reservation occ=5 -> amount_due=amount_paid=5300; logical clock well before start."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Stardust Drive-In", fm_channel_pool: ["87.9","88.1","88.3"], turnaround_buffer_minutes: 30, no_show_grace_minutes: 15 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "North Field", stall_count: 10, person_capacity: 200 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "Feature One", runtime_minutes: 90, rating: "PG" }
              as: VenueOperator
              captures: { film1_id: $.data.id }
            - call: "POST /films"
              payload: { title: "Feature Two", runtime_minutes: 90, rating: "PG13" }
              as: VenueOperator
              captures: { film2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${film1_id}", secondary_film_id: "${film2_id}", is_double_feature: true, start_utc: "2026-06-10T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000, included_occupants: 2, per_extra_person_cents: 600, double_feature_surcharge_cents: 1500 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-aaa", occupant_count: 5, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-aaa"
              captures: { resv_id: $.data.id, resv_v: $.data.version, due: $.data.amount_due_cents }
            - call: "POST /reservations/${resv_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "patron-aaa"
              captures: { resv_v2: $.data.version, paid: $.data.amount_paid_cents }
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: { expected_reservation_version: "${resv_v2}" }
              as: Patron
              as_user_id: "patron-aaa"
              captures: { resv_v3: $.data.version }
          assert:
            - "Reservation.${resv_id}.amount_due_cents == 5300"
            - "Reservation.${resv_id}.amount_paid_cents == 5300"
            - "Reservation.${resv_id}.payment_status == REFUNDED"
            - "Exactly one RefundRecord with reservation_id == ${resv_id}, reason == VOLUNTARY_CANCEL, amount_cents == 5300 (full refund at >=48h before start)"

      - name: rental_quote_vs_concession_total_distinct_domains
        grounds:
          - calculations.private_rental_quote
          - calculations.concession_order_total
        distinguishing_aspect: |
          Two calculations on structurally different domains and algorithms: private_rental_quote (ceil-hours on a
          PrivateRental) yields 230000 for a 3h01m window, while concession_order_total (per-line tax rounding on a
          ConcessionOrder) yields total 3000 — distinct conserved subjects (rental fee vs order total), distinct rounding shapes.
        test_recipe:
          setup:
            - "A venue, a lot, a 3h01m private rental request (flat=150000, per_hour=20000) -> quote 230000."
            - "A reservation on a single-feature showtime with a 3-line concession order -> total 3000."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Lawn Cinema", fm_channel_pool: ["89.1"], turnaround_buffer_minutes: 30, no_show_grace_minutes: 15 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "Main Lot", stall_count: 50, person_capacity: 300 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "Rental Lot", stall_count: 50, person_capacity: 300 }
              as: VenueOperator
              captures: { rlot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "Solo Feature", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { film_id: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Popcorn", unit_price_cents: 350, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { pop_id: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Combo", unit_price_cents: 1250, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { combo_id: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Water", unit_price_cents: 199, tax_rate: 0.0, available: true }
              as: VenueOperator
              captures: { water_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${film_id}", is_double_feature: false, start_utc: "2026-06-12T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000, included_occupants: 2, per_extra_person_cents: 0, double_feature_surcharge_cents: 0 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-bbb", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-bbb"
              captures: { resv_id: $.data.id }
            - call: "POST /private-rentals"
              payload: { venue_id: "${venue_id}", lot_id: "${rlot_id}", organizer_id: "org-1", start_utc: "2026-07-01T18:00:00Z", end_utc: "2026-07-01T21:01:00Z", flat_venue_fee_cents: 150000, per_hour_cents: 20000 }
              as: VenueOperator
              captures: { rental_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv_id}/concession-orders"
              payload: { lines: [ { concession_item_id: "${pop_id}", qty: 3 }, { concession_item_id: "${combo_id}", qty: 1 }, { concession_item_id: "${water_id}", qty: 2 } ] }
              as: Patron
              as_user_id: "patron-bbb"
              captures: { order_id: $.data.id }
          assert:
            - "PrivateRental.${rental_id}.quote_cents == 230000"
            - "ConcessionOrder.${order_id}.subtotal_cents == 2698"
            - "ConcessionOrder.${order_id}.tax_cents == 167"
            - "ConcessionOrder.${order_id}.service_fee_cents == 135"
            - "ConcessionOrder.${order_id}.total_cents == 3000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_car_tiered_extra_person_mode_a
        grounds:
          - calculations.reservation_pricing
          - entities.Showtime.fields.per_extra_person_cents
          - entities.Showtime.fields.included_occupants
        distinguishing_aspect: |
          Mode (a) non-linear interaction with >=3 inputs: amount_due = base + max(0, occ - included)*per_extra +
          (double ? surcharge : 0). occ=5, included=2, per_extra=600, base=2000, surcharge=1500, double=true -> 5300;
          the max(0,...) clamp means occ<=included does NOT reduce the base (occ=2 still 2000).
        test_recipe:
          setup:
            - "PER_CAR double-feature showtime base=2000/included=2/per_extra=600/surcharge=1500; clock before start."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V2", fm_channel_pool: ["90.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F1", runtime_minutes: 90, rating: "PG" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /films"
              payload: { title: "F2", runtime_minutes: 90, rating: "PG" }
              as: VenueOperator
              captures: { f2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", secondary_film_id: "${f2}", is_double_feature: true, start_utc: "2026-06-15T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000, included_occupants: 2, per_extra_person_cents: 600, double_feature_surcharge_cents: 1500 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-ccc", occupant_count: 5, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-ccc"
              captures: { resv_id: $.data.id }
          assert:
            - "Reservation.${resv_id}.amount_due_cents == 5300"
            - "Reservation.${resv_id}.stalls_used == 1"

      - name: concession_per_line_tax_rounding_mode_b
        grounds:
          - calculations.concession_order_total
          - entities.ConcessionItem.fields.tax_rate
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: three lines of 350c @ 7.25% tax round PER LINE to 25c each
          (sum 75), whereas summing line totals (1050) then rounding once yields 76. The scaffold pins per-line-then-sum,
          so tax_cents==75 and total_cents==1178, falsifying the sum-then-round implementation.
        test_recipe:
          setup:
            - "Venue with a 350c@7.25% concession item; a reservation; an order of three lines (qty 1 each on three identical-priced items)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V3", fm_channel_pool: ["90.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Nachos A", unit_price_cents: 350, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { a_id: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Nachos B", unit_price_cents: 350, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { b_id: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Nachos C", unit_price_cents: 350, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-16T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000, included_occupants: 2, per_extra_person_cents: 0, double_feature_surcharge_cents: 0 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-ddd", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-ddd"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv_id}/concession-orders"
              payload: { lines: [ { concession_item_id: "${a_id}", qty: 1 }, { concession_item_id: "${b_id}", qty: 1 }, { concession_item_id: "${c_id}", qty: 1 } ] }
              as: Patron
              as_user_id: "patron-ddd"
              captures: { order_id: $.data.id }
          assert:
            - "ConcessionOrder.${order_id}.subtotal_cents == 1050"
            - "ConcessionOrder.${order_id}.tax_cents == 75"
            - "ConcessionOrder.${order_id}.service_fee_cents == 53"
            - "ConcessionOrder.${order_id}.total_cents == 1178"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: showtime_cyclic_weather_hold_loop
        grounds:
          - state_machines.Showtime.SCHEDULED_to_WEATHER_HOLD
          - state_machines.Showtime.WEATHER_HOLD_to_SCHEDULED
        distinguishing_aspect: |
          Showtime is CYCLIC: SCHEDULED -> WEATHER_HOLD (ADVISORY) -> SCHEDULED (clear) -> WEATHER_HOLD again,
          a genuine A->B->A loop that a linear pipeline cannot express; status returns to SCHEDULED after each clear.
        test_recipe:
          setup:
            - "A SCHEDULED showtime."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V4", fm_channel_pool: ["91.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-18T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id }
            - call: "POST /showtimes/${st_id}/weather-events"
              payload: { severity: "ADVISORY" }
              as: VenueOperator
            - call: "POST /showtimes/${st_id}/clear-weather-hold"
              payload: {}
              as: VenueOperator
          trigger:
            - call: "POST /showtimes/${st_id}/weather-events"
              payload: { severity: "ADVISORY" }
              as: VenueOperator
              captures: { ev_id: $.data.showtime_id }
          assert:
            - "Showtime.${st_id}.status == WEATHER_HOLD (after the second ADVISORY following a clear, proving the cycle re-enters)"

      - name: reservation_parallel_occupancy_payment_dimensions
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - state_machines.Reservation.payment=UNPAID_to_payment=PAID
          - entities.Reservation.fields.occupancy_status
          - entities.Reservation.fields.payment_status
        distinguishing_aspect: |
          Reservation has PARALLEL state dimensions: payment_status advances UNPAID->PAID independently of
          occupancy_status advancing CONFIRMED->CHECKED_IN; after pay+check-in the row is simultaneously
          (occupancy=CHECKED_IN, payment=PAID), a combined state no single linear axis can represent.
        test_recipe:
          setup:
            - "A CONFIRMED/UNPAID reservation on a near-future showtime; clock set into the check-in window."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V5", fm_channel_pool: ["91.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-20T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-eee", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-eee"
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "patron-eee"
          trigger:
            - call: "POST /reservations/${resv_id}/check-in"
              payload: {}
              as: GateAttendant
              captures: { resv_v: $.data.version }
          assert:
            - "Reservation.${resv_id}.occupancy_status == CHECKED_IN"
            - "Reservation.${resv_id}.payment_status == PAID"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reservation_cancel_depth3_concession_refund
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.ConcessionOrder.PENDING_to_CANCELLED
          - calculations.refund_amount
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /reservations/{id}/cancel: cancel(Reservation) -> Reservation.payment_status
          becomes REFUNDED and a reservation RefundRecord is created -> that cancellation cascades to the attached PAID
          ConcessionOrder, flipping it to CANCELLED -> which itself creates a CONCESSION_ORDER RefundRecord (RESERVATION_CASCADE).
          Each link is caused by the prior link, not by the original action.
        test_recipe:
          setup:
            - "A paid PER_CAR reservation (amount_paid=2000, single feature, 48h+ before start) with a PAID concession order total=3000."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V6", fm_channel_pool: ["92.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Popcorn", unit_price_cents: 350, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { pop_id: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Combo", unit_price_cents: 1250, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { combo_id: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Water", unit_price_cents: 199, tax_rate: 0.0, available: true }
              as: VenueOperator
              captures: { water_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-20T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000, included_occupants: 2 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-fff", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-fff"
              captures: { resv_id: $.data.id, resv_v: $.data.version }
            - call: "POST /reservations/${resv_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "patron-fff"
              captures: { resv_v2: $.data.version }
            - call: "POST /reservations/${resv_id}/concession-orders"
              payload: { lines: [ { concession_item_id: "${pop_id}", qty: 3 }, { concession_item_id: "${combo_id}", qty: 1 }, { concession_item_id: "${water_id}", qty: 2 } ] }
              as: Patron
              as_user_id: "patron-fff"
              captures: { order_id: $.data.id }
            - call: "POST /concession-orders/${order_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "patron-fff"
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: { expected_reservation_version: "${resv_v2}" }
              as: Patron
              as_user_id: "patron-fff"
          assert:
            - "Reservation.${resv_id}.occupancy_status == CANCELLED"
            - "Reservation.${resv_id}.payment_status == REFUNDED"
            - "ConcessionOrder.${order_id}.status == CANCELLED"
            - "Exactly one RefundRecord with reservation_id == ${resv_id}, reason == VOLUNTARY_CANCEL, amount_cents == 2000"
            - "Exactly one RefundRecord with concession_order_id == ${order_id}, reason == RESERVATION_CASCADE, amount_cents == 3000"

      - name: showtime_weather_cancel_depth3_chain
        grounds:
          - state_machines.Showtime.SCHEDULED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.ConcessionOrder.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade originating from a CANCELLATION weather event (a DIFFERENT trigger than the patron cancel):
          cancel(Showtime) -> each active Reservation flips CANCELLED + WEATHER refund -> each such reservation's PAID
          ConcessionOrder flips CANCELLED + RESERVATION_CASCADE refund. Pro-rata weather refund (1 of 1 feature
          remaining -> full 2000) distinguishes it from the voluntary-tier chain above.
        test_recipe:
          setup:
            - "A paid PER_CAR reservation (amount_paid=2000) on a single-feature SCHEDULED showtime with a PAID concession order (total=3000)."
          setup_api_calls:
            - call: "POST /venues"
