# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Airport Center Operations & Volunteer Staffing
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: coverage_confirmed_vs_optimistic_variants
        grounds:
          - calculations.staffing_coverage
          - entities.Center.fields.coverage_ratio
          - entities.Event.fields.min_volunteers
        distinguishing_aspect: |
          Same staffing data, two variants on different entity domains: the
          confirmed_only variant drives Center.posture (1/4 = 0.25 -> RESTRICTED)
          while the optimistic variant drives the Event confirm gate
          (1 CONFIRMED + 0.5*1 ASSIGNED = 1.5 >= min_volunteers 1 -> CONFIRMED).
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; center with required_daily_confirmed_assignments=4 and an ACTIVE agreement"
            - "Volunteers v1 (CONFIRMED) and v2 (ASSIGNED) on today's 08:00-12:00 shift (capacity 3)"
            - "DEPLOYMENT event today 09:00-11:00 with min_volunteers=1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Alpha Center", airport_code: "LAX", occupancy_cap: 50, required_daily_confirmed_assignments: 4 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 1200, utilities_included: true, access_terms: "badge-24x7", security_level: 3, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /volunteers"
              payload: { full_name: "V One", email: "v1@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v1_id: $.data.id, v1_v: $.data.version }
            - call: "POST /volunteers/${v1_id}/screenings"
              payload: { expected_volunteer_version: "${v1_v}" }
              as: CenterManager
              captures: { s1_id: $.data.id }
            - call: "POST /screenings/${s1_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s1_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /volunteers"
              payload: { full_name: "V Two", email: "v2@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v2_id: $.data.id, v2_v: $.data.version }
            - call: "POST /volunteers/${v2_id}/screenings"
              payload: { expected_volunteer_version: "${v2_v}" }
              as: CenterManager
              captures: { s2_id: $.data.id }
            - call: "POST /screenings/${s2_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s2_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-01T08:00:00Z", end_at: "2026-09-01T12:00:00Z", role_required: "DESK", capacity: 3 }
              as: CenterManager
              captures: { sh_id: $.data.id }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v1_id}" }
              as: CenterManager
              captures: { as1_id: $.data.id }
            - call: "POST /shift-assignments/${as1_id}/confirm"
              as: Volunteer
              as_user_id: "${v1_id}"
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v2_id}" }
              as: CenterManager
              captures: { as2_id: $.data.id }
            - call: "POST /centers/${c_id}/events"
              payload: { kind: "DEPLOYMENT", name: "Unit 42 Departure", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T11:00:00Z", unit_name: "42nd", min_volunteers: 1 }
              as: CenterManager
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /centers/${c_id}"
              as: CenterManager
              captures: { posture_now: $.data.posture, ratio_now: $.data.coverage_ratio }
            - call: "POST /events/${ev_id}/confirm"
              as: CenterManager
              captures: { ev_status: $.data.status }
          assert:
            - "Center.${c_id}.coverage_ratio == 0.25 (1 confirmed / 4 required, confirmed_only variant)"
            - "Center.${c_id}.posture == RESTRICTED (0.25 < 0.75 under confirmed_only)"
            - "Event.${ev_id}.status == CONFIRMED (optimistic variant: 1 + 0.5*1 = 1.5 >= min_volunteers 1)"
            - "ShiftAssignment.${as2_id}.status == ASSIGNED (never confirmed, so invisible to confirmed_only but counted at 0.5 by optimistic)"

      - name: cost_per_visit_actual_vs_loaded
        grounds:
          - calculations.guest_visit_cost
          - entities.Center.fields.expense_ledger
          - entities.Event.fields.event_budget_cents
        distinguishing_aspect: |
          Fiscal domain (Center cost accountability), unlike the staffing domain
          of the sibling instance: identical September data (10000 cents expenses,
          4 visits, one CONFIRMED event with 3000 cents budget) yields
          actual = 2500 vs loaded = 3250.
        test_recipe:
          setup:
            - "Clock 2026-09-01; center (required_daily_confirmed_assignments=1, occupancy_cap 50) with ACTIVE agreement"
            - "Four eligible guests each checked in once (4 September visits)"
            - "Grant 20000 cents; expense 10000 cents posted; HOMECOMING event with event_budget_cents 3000 CONFIRMED (min_volunteers 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Beta Center", airport_code: "JFK", occupancy_cap: 50, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 900, utilities_included: true, access_terms: "badge", security_level: 2, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /guests"
              payload: { full_name: "G One", category: "ACTIVE_DUTY", verification_expires_on: "2027-01-01" }
              as: Anonymous
              captures: { g1_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G Two", category: "DEPENDENT", verification_expires_on: "2027-01-01" }
              as: Anonymous
              captures: { g2_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G Three", category: "RETIREE", verification_expires_on: "2027-01-01" }
              as: Anonymous
              captures: { g3_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G Four", category: "VETERAN", verification_expires_on: "2027-01-01" }
              as: Anonymous
              captures: { g4_id: $.data.id }
            - call: "POST /centers/${c_id}/check-ins"
              payload: { guest_id: "${g1_id}" }
              as: CenterManager
            - call: "POST /centers/${c_id}/check-ins"
              payload: { guest_id: "${g2_id}" }
              as: CenterManager
            - call: "POST /centers/${c_id}/check-ins"
              payload: { guest_id: "${g3_id}" }
              as: CenterManager
            - call: "POST /centers/${c_id}/check-ins"
              payload: { guest_id: "${g4_id}" }
              as: CenterManager
            - call: "POST /funding-grants"
              payload: { center_id: "${c_id}", donor_name: "Donor A", amount_cents: 20000, spend_by_date: "2026-12-31" }
              as: PlatformAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /centers/${c_id}"
              as: CenterManager
              captures: { c_v2: $.data.version }
            - call: "POST /centers/${c_id}/expenses"
              payload: { amount_cents: 10000, description: "September snacks", expected_center_version: "${c_v2}" }
              as: CenterManager
            - call: "POST /centers/${c_id}/events"
              payload: { kind: "HOMECOMING", name: "Welcome Home 7th", start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-05T12:00:00Z", min_volunteers: 0, event_budget_cents: 3000 }
              as: CenterManager
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/confirm"
              as: CenterManager
          trigger:
            - call: "GET /centers/${c_id}/cost-report"
              as: CenterManager
              captures: { rep: $.data }
          assert:
            - "cost-report.month_expenses_cents == 10000"
            - "cost-report.month_visits == 4"
            - "cost-report.cost_per_visit_actual_cents == 2500 (round_half_up(10000/4))"
            - "cost-report.cost_per_visit_loaded_cents == 3250 (round_half_up((10000+3000)/4); adds CONFIRMED event budget)"

  - rule_id: combinatorial_formula
    instances:
      - name: service_quota_three_way_min
        grounds:
          - calculations.service_quota
          - entities.ServiceBooking.fields.service_type
          - entities.Guest.fields.category
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — type maximum
          (FAMILY_ROOM 240), category-dependent daily cap (DEPENDENT 240), and
          accumulated daily usage (210) combine as min(); a 60-minute request
          passes the type max but fails the 30-minute remaining quota, while a
          30-minute SHOWER request passes exactly at the remaining quota.
        test_recipe:
          setup:
            - "Clock 2026-09-01; OPEN center (required_daily_confirmed_assignments=1, one volunteer cleared and confirmed on today's 06:00-10:00 shift -> coverage 1.0)"
            - "DEPENDENT guest with 210 of 240 daily minutes already used (CONNECTIVITY 120 + CONNECTIVITY 90)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Gamma Center", airport_code: "DFW", occupancy_cap: 50, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 800, utilities_included: false, access_terms: "badge", security_level: 2, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /volunteers"
              payload: { full_name: "V Q", email: "vq@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { s_id: $.data.id }
            - call: "POST /screenings/${s_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-01T06:00:00Z", end_at: "2026-09-01T10:00:00Z", role_required: "DESK", capacity: 1 }
              as: CenterManager
              captures: { sh_id: $.data.id }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v_id}" }
              as: CenterManager
              captures: { as_id: $.data.id }
            - call: "POST /shift-assignments/${as_id}/confirm"
              as: Volunteer
              as_user_id: "${v_id}"
            - call: "POST /guests"
              payload: { full_name: "Dep Guest", category: "DEPENDENT", verification_expires_on: "2027-01-01" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "CONNECTIVITY", start_at: "2026-09-01T08:00:00Z", end_at: "2026-09-01T10:00:00Z" }
              as: CenterManager
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "CONNECTIVITY", start_at: "2026-09-01T12:00:00Z", end_at: "2026-09-01T13:30:00Z" }
              as: CenterManager
          trigger:
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "FAMILY_ROOM", start_at: "2026-09-01T15:00:00Z", end_at: "2026-09-01T16:00:00Z" }
              as: CenterManager
              captures: { err_over: $.data.error_id }
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "SHOWER", start_at: "2026-09-01T16:00:00Z", end_at: "2026-09-01T16:30:00Z" }
              as: CenterManager
              captures: { b_ok: $.data.id, b_status: $.data.status }
          assert:
            - "first trigger rejected with error_id == ERR_QUOTA_EXCEEDED (60 <= type max 240, but 60 > 240 - 210 = 30 remaining)"
            - "second trigger succeeds: ServiceBooking.${b_ok}.status == BOOKED (30 <= type max 30 and 30 <= 30 remaining — exact boundary)"
      - name: partner_match_per_lot_rounding
        grounds:
          - calculations.partner_match_report
          - entities.DonationLot.fields.partner_match_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-lot round_half_up then sum.
          Three 3-cent partner lots yield match 3 (0.75 -> 1 per lot), whereas the
          forbidden sum-first order yields 2 (2.25 -> 2); the test separates them.
        test_recipe:
          setup:
            - "Clock 2026-09-01; center with ACTIVE agreement (posture irrelevant)"
            - "Three FOOD lots, declared_value_cents 3 each, partner_name Acme, expiry 2026-09-20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Delta Center", airport_code: "ATL", occupancy_cap: 40, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 600, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "granola bar", category: "FOOD", received_qty: 5, expiry_date: "2026-09-20", declared_value_cents: 3, partner_name: "Acme" }
              as: CenterManager
              captures: { lot1_match: $.data.partner_match_cents }
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "granola bar", category: "FOOD", received_qty: 5, expiry_date: "2026-09-20", declared_value_cents: 3, partner_name: "Acme" }
              as: CenterManager
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "granola bar", category: "FOOD", received_qty: 5, expiry_date: "2026-09-20", declared_value_cents: 3, partner_name: "Acme" }
              as: CenterManager
          trigger:
            - call: "GET /centers/${c_id}/cost-report"
              as: CenterManager
              captures: { rep: $.data }
          assert:
            - "DonationLot per-lot partner_match_cents == 1 (round_half_up(3 * 0.25) = round_half_up(0.75) = 1)"
            - "cost-report.donation_value_total_cents == 9"
            - "cost-report.partner_match_total_cents == 3 (per-lot-then-sum; sum-first would give round_half_up(2.25) == 2)"

  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_renewal_cycle
        grounds:
          - state_machines.SiteAgreement.ACTIVE_to_RENEWAL_DUE
          - state_machines.SiteAgreement.RENEWAL_DUE_to_ACTIVE
          - calculations.staffing_coverage
        distinguishing_aspect: |
          Cyclic machine on SiteAgreement: ACTIVE -> RENEWAL_DUE (run_ops inside
          the 60-day renewal window) -> ACTIVE again via renew with a later
          end_date; the entity returns to a prior state, unlike a linear pipeline.
        test_recipe:
          setup:
            - "Clock starts 2026-09-01; center; agreement with end_date 2026-10-15, ACTIVATED"
            - "Clock advanced to 2026-09-20 (25 days before end, inside RENEWAL_WINDOW_DAYS=60); run_ops flips agreement to RENEWAL_DUE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Epsilon Center", airport_code: "SEA", occupancy_cap: 30, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 700, utilities_included: true, access_terms: "badge", security_level: 2, start_date: "2026-09-01", end_date: "2026-10-15" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers/${c_id}/run_ops"
              as: CenterManager
            - call: "GET /centers/${c_id}/site-agreements"
              as: CenterManager
              captures: { a_status_due: "$.data[0].status" }
          trigger:
            - call: "POST /site-agreements/${a_id}/renew"
              payload: { new_end_date: "2027-10-15" }
              as: PlatformAdmin
              captures: { a_status: $.data.status, a_end: $.data.end_date }
          assert:
            - "after run_ops the agreement status == RENEWAL_DUE (captured ${a_status_due})"
            - "renew returns status == ACTIVE (cyclic return to a prior state)"
            - "renewed agreement end_date == 2027-10-15"
      - name: event_tour_branch_vs_deploy
        grounds:
          - state_machines.Event.SECURITY_REVIEW_to_SECURITY_APPROVED
          - state_machines.Event.PLANNED_to_CONFIRMED
          - state_machines.Event.SECURITY_APPROVED_to_CONFIRMED
        distinguishing_aspect: |
          Branching fork-join on Event (a different entity than the sibling's
          SiteAgreement): DEPLOYMENT forks to PLANNED and confirms directly, while
          ENTERTAINMENT_TOUR forks to SECURITY_REVIEW and must detour through
          SECURITY_APPROVED — confirming a tour from SECURITY_REVIEW is rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-01; center with ACTIVE agreement (security_level 3)"
            - "One DEPLOYMENT event and one ENTERTAINMENT_TOUR event (talent signed, min_volunteers 0), non-overlapping"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Zeta Center", airport_code: "ORD", occupancy_cap: 60, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 1500, utilities_included: true, access_terms: "escort-required", security_level: 3, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /centers/${c_id}/events"
              payload: { kind: "DEPLOYMENT", name: "Unit 9 Departure", start_at: "2026-09-10T08:00:00Z", end_at: "2026-09-10T10:00:00Z", min_volunteers: 0 }
              as: CenterManager
              captures: { ev_d_id: $.data.id, ev_d_status: $.data.status }
            - call: "POST /centers/${c_id}/events"
              payload: { kind: "ENTERTAINMENT_TOUR", name: "Fall Tour Stop", start_at: "2026-09-12T14:00:00Z", end_at: "2026-09-12T16:00:00Z", min_volunteers: 0, required_security_level: 3, talent_agreement_signed: true }
              as: CenterManager
              captures: { ev_t_id: $.data.id, ev_t_status: $.data.status }
          trigger:
            - call: "POST /events/${ev_t_id}/confirm"
              as: CenterManager
              captures: { err_early: $.data.error_id }
            - call: "POST /events/${ev_t_id}/approve-security"
              as: PlatformAdmin
              captures: { ev_t_mid: $.data.status }
            - call: "POST /events/${ev_t_id}/confirm"
              as: CenterManager
              captures: { ev_t_final: $.data.status }
          assert:
            - "DEPLOYMENT event created with status PLANNED (${ev_d_status}); tour created with status SECURITY_REVIEW (${ev_t_status})"
            - "tour confirm from SECURITY_REVIEW rejected with ERR_INVALID_STATE (branch state required)"
            - "after approve-security tour status == SECURITY_APPROVED; second confirm -> CONFIRMED (branches rejoin)"

  - rule_id: transitive_cascade
    instances:
      - name: screening_expiry_cascade
        grounds:
          - state_machines.BackgroundScreening.CLEARED_to_EXPIRED
          - state_machines.Volunteer.ACTIVE_to_INACTIVE
          - state_machines.Shift.FILLED_to_OPEN
          - calculations.staffing_coverage
        distinguishing_aspect: |
          Depth-4 cascade triggered by run_ops: screening EXPIRED -> volunteer
          INACTIVE -> future CONFIRMED assignment CANCELLED -> shift
          confirmed_count drops (FILLED -> OPEN) -> center coverage_ratio
          recomputed and posture flips OPEN -> RESTRICTED. Each hop is caused by
          the previous hop, not by run_ops directly.
        test_recipe:
          setup:
            - "Screening decided CLEARED at 2026-09-01T00:00:00Z (expires_at = +24 months = 2028-09-01T00:00:00Z)"
            - "Clock advanced to 2028-09-02T08:00:00Z; agreement end 2029-08-31 stays ACTIVE"
            - "Shift today 14:00-18:00 capacity 1; volunteer CONFIRMED (shift FILLED, coverage 1/1 = 1.0, posture OPEN)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
