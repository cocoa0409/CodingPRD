            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "LOT-PRIV", stock_type: "PRIVATE", quantity_on_hand: 8, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { lot_priv: $.data.id }
            - call: "POST /provider-sites/${site_s}/borrow-tickets"
              payload: { from_lot_id: "${lot_priv}", to_lot_id: "${lot_pub}", direction: "PUBLIC_FROM_PRIVATE", borrowed_quantity: 4, reason_code: "STOCK_OUT" }
              as: VaccineManager
              captures: { bt: $.data.id, bt_v: $.data.version }
          trigger:
            - call: "POST /provider-sites/${site_s}/borrow-tickets/${bt}/record-payback"
              payload: { payback_quantity: 4, paying_lot_id: "${lot_pub}", expected_borrow_ticket_version: "${bt_v}" }
              as: VaccineManager
              captures: { bt_status: $.data.status, bt_paid: $.data.paid_back_quantity }
            - call: "GET /borrow-tickets/${bt}"
              payload: {}
              as: VaccineManager
              captures: { bt_v2: $.data.version }
            - call: "POST /provider-sites/${site_s}/borrow-tickets/${bt}/record-payback"
              payload: { payback_quantity: 1, paying_lot_id: "${lot_pub}", expected_borrow_ticket_version: "${bt_v2}" }
              as: VaccineManager
              captures: { over_err: $.data.error_id }
          assert:
            - "payback_quantity == remaining (4 == 4): ALLOWED, ticket transitions to REPAID"
            - "${bt_status} == REPAID"
            - "${bt_paid} == 4"
            - "Subsequent payback on terminal ticket: rejected (ERR_INVALID_STATE) since ticket is REPAID; demonstrates exact-boundary semantics"
            - "${over_err} == ERR_INVALID_STATE"

  # -------------------------------------------------------------------------
