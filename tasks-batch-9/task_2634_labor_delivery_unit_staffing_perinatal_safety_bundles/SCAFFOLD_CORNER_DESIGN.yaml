      - name: a_drill_starts_on_the_exact_scheduled_instant_and_leaves_every_timing_field_null
        claim_type: Valid Transition
        grounds:
          - state_machines.CesareanReadinessDrill.SCHEDULED_to_IN_PROGRESS
          - entities.CesareanReadinessDrill.fields.status
          - entities.CesareanReadinessDrill.fields.decision_at
          - entities.CesareanReadinessDrill.fields.incision_at
          - entities.CesareanReadinessDrill.fields.measured_d2i_minutes
          - entities.CesareanReadinessDrill.fields.validated_at
          - entities.CesareanReadinessDrill.fields.expires_at
          - endpoints[POST /cesarean-readiness-drills/{drillId}/start]
          - validations[priority=14.2]
        distinguishing_aspect: |
          The 14.2 due test is clock_now >= scheduled_for_utc with the boundary INCLUSIVE, so the
          drill must start when the clock reads exactly 2026-08-01T07:00:00Z — an implementation
          using a strict > refuses here. Entering IN_PROGRESS must also change nothing else: the
          three timing fields stay null (they are written only by /document), validated_at and
          expires_at stay null (only /validate grants currency, which is why the unit's
          cesarean_readiness_state is still NOT_READY afterwards), revision_count stays 0, and the
          drill's version advances by exactly one write from 1 to 2.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed, so staffing_posture
            cannot be DIVERT and the 8.02 gate on /start is open. Three credentialled staff members:
            an OB_ATTENDING and an ANESTHESIOLOGIST (the roster the 11.4 document-time check will
            want) plus an RN_LABOR_DELIVERY whose id is used as the ChargeNurse X-User-ID. One drill
            of type DECISION_TO_INCISION scheduled for 07:00, an hour ahead of the creation clock so
            the creation-time "scheduled_for_utc >= clock_now" rule passes. The clock is then set to
            exactly 07:00.
