# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_3337 — Franchise Mobile Tool Truck Routes & Customer Credit Extension
# section: values follow references/claim-extraction-guide.md's nine sections;
# claim_type: values follow that guide's per-section rows.
# §1.8 already asserts the nine Difficulty Rules; corners it covers are emitted
# as excluded_because: stubs citing the §1.8 instance name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # section: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: entity_franchisee_creation_defaults_and_computed_zeroes
        claim_type: creation
        grounds: [entities.Franchisee.fields.training_status, entities.Franchisee.fields.can_resell_territory, entities.Franchisee.fields.active_route_count]
        distinguishing_aspect: "A freshly created Franchisee is NOT_ENROLLED with can_resell_territory false, active_route_count 0, credit_ceiling_cents 0 and certified_on null, and the POST returns 201 with that object."
        test_recipe:
          setup: ["Empty DB; logical clock at its 2026-09-01T00:00:00Z startup default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id", f_training: "$.data.training_status", f_resell: "$.data.can_resell_territory" } }
            - { call: "GET /retail/franchisees/${f_id}", payload: {}, as: PlatformAdmin, captures: { f_routes: "$.data.active_route_count", f_ceiling: "$.data.credit_ceiling_cents", f_certified_on: "$.data.certified_on" } }
          assert:
            - "Franchisee.${f_id}.training_status == NOT_ENROLLED"
            - "Franchisee.${f_id}.can_resell_territory == false"
            - "Franchisee.${f_id}.active_route_count == 0"
            - "Franchisee.${f_id}.credit_ceiling_cents == 0"
            - "Franchisee.${f_id}.certified_on == null"

      - name: entity_route_creation_missing_required_zip_codes_rejected
        claim_type: required_fields
        grounds: [entities.Route.fields.zip_codes, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /retail/franchisees/{id}/routes without zip_codes is refused with ERR_INVALID_REQUEST 400 and creates no Route row."
        test_recipe:
          setup: ["Franchisee F exists and is NOT_ENROLLED"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { create_error: "$.data.error_id" } }
            - { call: "GET /retail/routes", payload: { franchisee_id: "${f_id}" }, as: FranchiseOwner }
          assert:
            - "the create response captures ${create_error} == ERR_INVALID_REQUEST"
            - "the create response http status is 400"
            - "the franchisee's route list is empty, so no Route row was written"

      - name: entity_product_invalid_category_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Product.fields.category, entities.Product.fields.unit_cost_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /retail/products with category DIAGNOSTIC (not a member of DIAGNOSTICS | TOOL_STORAGE | POWER_TOOLS) is refused with ERR_INVALID_REQUEST and no Product exists afterwards."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: DIAGNOSTIC, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { cat_error: "$.data.error_id" } }
            - { call: "GET /retail/products", payload: {}, as: PlatformAdmin }
          assert:
            - "the create response captures ${cat_error} == ERR_INVALID_REQUEST"
            - "the create response http status is 400"
            - "the product list is empty"

      - name: entity_shop_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SHOP_NOT_FOUND]", entities.ShopLocation.fields.shop_name]
        distinguishing_aspect: "GET /retail/shop-locations/{id} with an id that matches no row returns ERR_SHOP_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty DB; no ShopLocation has ever been created"]
          setup_api_calls: []
          trigger:
            - { call: "GET /retail/shop-locations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { shop_error: "$.data.error_id" } }
          assert:
            - "the read captures ${shop_error} == ERR_SHOP_NOT_FOUND"
            - "the read http status is 404"

      - name: entity_route_listing_filters_by_status_and_paginates
        claim_type: listing
        grounds: [entities.Route.fields.route_status, "endpoints[GET /retail/routes]"]
        distinguishing_aspect: "GET /retail/routes?route_status=DRAFT&limit=1 returns only DRAFT routes and honours limit, while the unfiltered call returns both the DRAFT and the ACTIVE route."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; routes R1 and R2 both created DRAFT; R1 then activated to IN_SERVICE"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R2, route_tier: B, zip_codes: [75002], visit_weekday: 2, truck_label: T-02, inventory_invested_cents: 50000, mix_plan: TOOL_STORAGE, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r2_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
          trigger:
            - { call: "GET /retail/routes", payload: { route_status: DRAFT, limit: 1 }, as: FranchiseOwner, captures: { draft_first: "$.data[0].route_code", draft_status: "$.data[0].route_status" } }
            - { call: "GET /retail/routes", payload: { franchisee_id: "${f_id}" }, as: FranchiseOwner, captures: { all_first: "$.data[0].route_status", all_second: "$.data[1].route_status" } }
          assert:
            - "the DRAFT-filtered page's first row is Route ${r2_id} with route_status DRAFT"
            - "the filtered call returned exactly one row because limit was 1"
            - "the unfiltered call returned 2 rows, one IN_SERVICE and one DRAFT"

      - name: entity_technician_computed_home_route_derived_from_shop
        claim_type: computed_fields
        grounds: [entities.Technician.fields.home_route_id, entities.Technician.fields.revolving_available_cents, entities.Technician.fields.open_account_count, entities.ShopLocation.fields.active_technician_count]
        distinguishing_aspect: "A new Technician's home_route_id is derived from current_shop_location_id (the route owning that shop), revolving_available_cents equals credit_line_limit_cents while revolving_used_cents is 0, and the shop's active_technician_count increments to 1."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 DRAFT with shop S1 on it; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id", t_home_route: "$.data.home_route_id", t_avail: "$.data.revolving_available_cents", t_open: "$.data.open_account_count" } }
            - { call: "GET /retail/shop-locations/${s1_id}", payload: {}, as: FranchiseOwner, captures: { s1_count: "$.data.active_technician_count" } }
          assert:
            - "Technician.${t_id}.home_route_id == ${r1_id}, derived from the shop's owning route"
            - "Technician.${t_id}.revolving_available_cents == 100000, equal to credit_line_limit_cents with no usage"
            - "Technician.${t_id}.open_account_count == 0"
            - "Technician.${t_id}.technician_status == ACTIVE and credit_line_status == ACTIVE"
            - "ShopLocation.${s1_id}.active_technician_count == 1"

      - name: entity_sales_order_computed_line_count_and_gross_total
        claim_type: computed_fields
        grounds: [entities.SalesOrder.fields.line_count, entities.SalesOrder.fields.gross_total_cents, calculations.order_gross_total, entities.SalesOrder.fields.sale_iso_week]
        distinguishing_aspect: "A draft order's line_count equals the submitted array length and gross_total_cents equals the per-line-rounded sum (30226 for two 1 x 15000 DIAGNOSTIC_WEIGHTED lines); sale_iso_week is stamped to the logical clock's Monday."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 (mix_plan DIAGNOSTIC_WEIGHTED) IN_SERVICE; product P1 at 15000; technician T with an APPROVED account A1"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: DIAGNOSTIC_WEIGHTED, lines: [{ product_id: "${p1_id}", quantity: 1, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }, { product_id: "${p1_id}", quantity: 1, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_id: "$.data.id", o_lines: "$.data.line_count", o_gross: "$.data.gross_total_cents", o_week: "$.data.sale_iso_week" } }
          assert:
            - "SalesOrder.${o_id}.line_count == 2"
            - "SalesOrder.${o_id}.gross_total_cents == 30226"
            - "SalesOrder.${o_id}.sale_iso_week == 2026-09-07T00:00:00Z, the logical clock's Monday"
            - "SalesOrder.${o_id}.order_status == DRAFT"
            - "SalesOrder.${o_id}.financed_principal_cents == 30226 while DRAFT"

      - name: entity_credit_account_system_fields_frozen_from_application
        claim_type: system_fields
        grounds: [entities.CreditAccount.fields.credit_limit_cents, entities.CreditAccount.fields.account_kind, entities.CreditAccount.fields.account_status_changed_at, entities.CreditAccount.fields.payment_due_weekday]
        distinguishing_aspect: "The minted CreditAccount inherits credit_limit_cents and account_kind from the application's approved fields, stamps account_status_changed_at to the logical clock, and inherits payment_due_weekday from the opening route's visit_weekday rather than from any request field."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 (visit_weekday 3) IN_SERVICE; shop S1; technician T; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 3, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 45338, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap_id}/accounts", payload: { expected_application_version: "${ap_ver}" }, as: CreditOfficer, captures: { a_id: "$.data.id", a_kind: "$.data.account_kind", a_limit: "$.data.credit_limit_cents", a_dow: "$.data.payment_due_weekday", a_is_lease: "$.data.is_lease_program", a_is_rev: "$.data.is_revolving_program" } }
          assert:
            - "CreditAccount.${a_id}.credit_limit_cents == 45338, frozen from the application's approved_limit_cents"
            - "CreditAccount.${a_id}.account_kind == REVOLVING"
            - "CreditAccount.${a_id}.payment_due_weekday == 3, inherited from the opening route's visit_weekday"
            - "CreditAccount.${a_id}.account_status == ACTIVE and account_status_changed_at == 2026-09-07T00:00:00Z"
            - "CreditAccount.${a_id}.is_revolving_program == true and is_lease_program == false"
            - "CreditAccount.${a_id}.credit_available_cents == 45338"

  # ===========================================================================
  # section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: state_route_created_draft_with_territory_unassigned
        claim_type: initial_state
        grounds: [state_machines.Route.DRAFT_to_IN_SERVICE, state_machines.Route.UNASSIGNED_to_IN_DEVELOPMENT, entities.Route.fields.route_status, entities.Route.fields.territory_development_status]
        distinguishing_aspect: "A newly created Route starts in DRAFT on the lifecycle axis and UNASSIGNED on the territory axis with resale_status NONE — all three initial states of the parallel dimensions at once."
        test_recipe:
          setup: ["Franchisee F exists; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r_id: "$.data.id", r_status: "$.data.route_status", r_territory: "$.data.territory_development_status", r_resale: "$.data.resale_status", r_anchor: "$.data.schedule_anchor_utc" } }
          assert:
            - "Route.${r_id}.route_status == DRAFT"
            - "Route.${r_id}.territory_development_status == UNASSIGNED"
            - "Route.${r_id}.resale_status == NONE"
            - "Route.${r_id}.in_force_from_week == null and in_force_to_week == null"
            - "Route.${r_id}.schedule_anchor_utc == 2026-08-31T08:00:00Z, the latest Monday 08:00:00Z strictly before the clock"

      - name: state_franchisee_certify_below_threshold_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Franchisee.ENROLLED_to_CERTIFIED, "errors[ERR_CERTIFICATION_POINTS_SHORT]", entities.Franchisee.fields.certified_on]
        distinguishing_aspect: "RECERTIFY-style certification at 39 training points violates the ENROLLED_to_CERTIFIED precondition training_points >= 40 and is refused with ERR_CERTIFICATION_POINTS_SHORT, leaving training_status ENROLLED and certified_on null; 40 points would certify."
        test_recipe:
          setup: ["Franchisee F is ENROLLED"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 10 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { f_enrolled: "$.data.training_status" } }
          trigger:
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: CERTIFY, training_points: 39 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { certify_error: "$.data.error_id" } }
            - { call: "GET /retail/franchisees/${f_id}", payload: {}, as: FranchiseOwner, captures: { f_status_after: "$.data.training_status", f_certified_on: "$.data.certified_on", f_resell: "$.data.can_resell_territory" } }
          assert:
            - "Franchisee.${f_id}.training_status == ENROLLED before the attempt"
            - "the CERTIFY response captures ${certify_error} == ERR_CERTIFICATION_POINTS_SHORT"
            - "the CERTIFY response http status is 422"
            - "Franchisee.${f_id}.training_status == ENROLLED after the attempt"
            - "Franchisee.${f_id}.certified_on == null and can_resell_territory == false"

      - name: state_payment_collect_from_terminal_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Payment.BOOKED_to_CANCELLED, "errors[ERR_PAYMENT_NOT_BOOKED]", entities.Payment.fields.payment_status]
        distinguishing_aspect: "A Payment that was CANCELLED is terminal for the collect action: a following COLLECT has no declared transition and is refused with ERR_PAYMENT_NOT_BOOKED 409."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; approved account A1; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
