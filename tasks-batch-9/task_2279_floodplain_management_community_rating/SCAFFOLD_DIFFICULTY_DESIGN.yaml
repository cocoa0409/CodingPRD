  - rule_id: cross_entity_state_dependency
    instances:

      - name: permit_issue_blocked_by_probation_only_for_substantial_structure
        grounds:
          - validations[priority=57]
          - errors[ERR_COMMUNITY_ON_PROBATION]
          - entities.Community.fields.compliance_posture
          - entities.Structure.fields.substantial_status
        distinguishing_aspect: |
          Issuance depends on two other entities at once: the Community's posture
          (ON_PROBATION at 12 points) and the Structure's substantial_status
          (SUBSTANTIAL_IMPROVEMENT); either one alone would let the permit through, so the
          403 ERR_COMMUNITY_ON_PROBATION is a genuine cross-entity conjunction.
        test_recipe:
