  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: service_windows_half_open_adjacency_allowed
        grounds:
          - state_machines.ColdDrinkEquipment.PLACED_to_UNDER_SERVICE
          - errors[ERR_SERVICE_WINDOW_OVERLAP]
        distinguishing_aspect: "Interval semantics #1 (half-open [start,end) on technician_label schedules): a window starting exactly when another ends is NOT an overlap; a window starting one minute before that end IS."
        test_recipe:
          setup:
            - "Seeded ACTIVE agreement with budget 1000000; equipment placed at ACTIVE customer; existing window [10:00, 11:00) on T-7 cost 100."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
