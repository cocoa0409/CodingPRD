              payload: { determination_id: "${d_sx4}", requested_course_id: "${c_100}", grounds: "MULTIPLE_MEASURES", statement: "My transcript and my test score disagree; please review.", expected_determination_version: "${dv1}" }
              as: Student
              as_user_id: "${sx4}"
              captures: { e_stale1: $.data.error_id }
            - call: "GET /placement-determinations/${d_sx4}"
              payload: {}
              as: Student
              as_user_id: "${sx4}"
              captures: { dv2b: $.data.version, dstate: $.data.placement_state }
            - call: "POST /placement-appeals"
              payload: { determination_id: "${d_sx4}", requested_course_id: "${c_100}", grounds: "MULTIPLE_MEASURES", statement: "My transcript and my test score disagree; please review.", expected_determination_version: "${dv2b}" }
              as: Student
              as_user_id: "${sx4}"
              captures: { app: $.data.id, app_state: $.data.state }
            - call: "POST /placement-appeals"
              payload: { determination_id: "${d_sx4}", requested_course_id: "${c_100}", grounds: "MULTIPLE_MEASURES", statement: "Replay of the same filing with the version I already used.", expected_determination_version: "${dv2b}" }
              as: Student
              as_user_id: "${sx4}"
              captures: { e_stale2: $.data.error_id }
