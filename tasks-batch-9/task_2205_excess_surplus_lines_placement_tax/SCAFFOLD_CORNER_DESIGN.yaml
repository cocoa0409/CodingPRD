      - name: invalidating_a_declination_is_an_action_endpoint_with_a_narrow_effect
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/declinations/{id}/invalidate
          - state_machines.Declination.transitions
        distinguishing_aspect: "invalidate moves one Declination RECORDED → INVALIDATED and that is its entire effect: the parent Placement's status is untouched and declination_count stays 0, because that field is only pinned when the diligent search completes. Replaying invalidate on the same row is rejected because INVALIDATED is terminal."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a TX-home placement in SEARCH_IN_PROGRESS with three RECORDED declinations."
          setup_api_calls:
            - *k_clock
