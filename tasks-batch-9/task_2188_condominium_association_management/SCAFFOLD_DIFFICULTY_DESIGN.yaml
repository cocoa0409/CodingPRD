              as: CommunityManager
              captures: { u101: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${d2}", unit_label: "102", interest_bp: 3300, heated_sqft: 1300 }
              as: CommunityManager
              captures: { u102: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
