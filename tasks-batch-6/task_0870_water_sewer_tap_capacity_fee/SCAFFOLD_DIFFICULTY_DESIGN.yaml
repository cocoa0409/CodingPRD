  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_half_open_overlap
        grounds:
          - calculations.inspector_window_overlap
          - validations[priority=13]
          - state_machines.Inspection.REQUESTED_to_SCHEDULED
        distinguishing_aspect: >
          Inspector scheduling uses half-open [start,end): a second inspection 09:30-10:30 overlapping a
          SCHEDULED 09:00-10:00 on the same inspector is rejected ERR_INSPECTOR_UNAVAILABLE, while an
          exactly-adjacent 10:00-11:00 (start == prior end) is accepted — adjacency does NOT conflict.
        test_recipe:
          setup:
            - "Inspector with a SCHEDULED 09:00-10:00 inspection; two more REQUESTED inspections on the same inspector."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-N", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_n: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp N" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp_n: "$.data.id" }
            - call: "POST /inspections"
              payload: { application_id: "${app_n}", inspector_id: "${insp_n}", inspection_type: "TAP", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: FieldInspector
              as_user_id: "${insp_n}"
              captures: { n1: "$.data.id" }
            - call: "POST /inspections/${n1}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_n}"
            - call: "POST /inspections"
              payload: { application_id: "${app_n}", inspector_id: "${insp_n}", inspection_type: "TAP", scheduled_start: "2026-06-01T09:30:00Z", scheduled_end: "2026-06-01T10:30:00Z" }
              as: FieldInspector
              as_user_id: "${insp_n}"
              captures: { n2: "$.data.id" }
            - call: "POST /inspections"
              payload: { application_id: "${app_n}", inspector_id: "${insp_n}", inspection_type: "TAP", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: FieldInspector
              as_user_id: "${insp_n}"
              captures: { n3: "$.data.id" }
          trigger:
            - call: "POST /inspections/${n2}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_n}"
              captures: { err_n2: "$.data.error_id" }
            - call: "POST /inspections/${n3}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_n}"
              captures: { n3_status: "$.data.status" }
          assert:
            - "overlapping 09:30-10:30 schedule: response status == 409 and data.error_id == ERR_INSPECTOR_UNAVAILABLE"
            - "adjacent 10:00-11:00 schedule: Inspection.${n3}.status == SCHEDULED"

      - name: crew_closed_interval_buffer_overlap
        grounds:
          - calculations.crew_appointment_overlap
          - validations[priority=14]
          - state_machines.MeterSet.PENDING_to_SCHEDULED
        distinguishing_aspect: >
          Crew scheduling uses closed interval + APPOINTMENT_BUFFER_MINUTES(60) gap: a second appointment
          10:30-11:00 only 30min after a SCHEDULED 09:00-10:00 on the same crew is rejected
          ERR_CREW_UNAVAILABLE, while 11:00-12:00 (exactly 60min gap) is accepted — buffer semantics,
          distinct from the inspector's half-open adjacency, on a different resource entity (MeterCrew).
        test_recipe:
          setup:
            - "Crew with a SCHEDULED 09:00-10:00 meter-set; two more PENDING meter-sets on the same crew."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-O", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_o: "$.data.id" }
            - call: "POST /meter-crews"
              payload: { name: "Crew O" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { crew_o: "$.data.id" }
            - call: "POST /meter-sets"
              payload: { application_id: "${app_o}", crew_id: "${crew_o}", appointment_start: "2026-06-02T09:00:00Z", appointment_end: "2026-06-02T10:00:00Z" }
              as: FieldInspector
              as_user_id: "insp-o"
              captures: { o1: "$.data.id" }
            - call: "POST /meter-sets/${o1}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "insp-o"
            - call: "POST /meter-sets"
              payload: { application_id: "${app_o}", crew_id: "${crew_o}", appointment_start: "2026-06-02T10:30:00Z", appointment_end: "2026-06-02T11:00:00Z" }
              as: FieldInspector
              as_user_id: "insp-o"
              captures: { o2: "$.data.id" }
            - call: "POST /meter-sets"
              payload: { application_id: "${app_o}", crew_id: "${crew_o}", appointment_start: "2026-06-02T11:00:00Z", appointment_end: "2026-06-02T12:00:00Z" }
              as: FieldInspector
              as_user_id: "insp-o"
              captures: { o3: "$.data.id" }
          trigger:
            - call: "POST /meter-sets/${o2}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "insp-o"
              captures: { err_o2: "$.data.error_id" }
            - call: "POST /meter-sets/${o3}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "insp-o"
              captures: { o3_status: "$.data.status" }
          assert:
            - "30-min-gap 10:30-11:00 schedule: response status == 409 and data.error_id == ERR_CREW_UNAVAILABLE"
            - "60-min-gap 11:00-12:00 schedule: MeterSet.${o3}.status == SCHEDULED"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: escrow_dollar_conservation
        grounds:
          - calculations.escrow_balance
          - entities.DeveloperAgreement.fields.escrow_held_cents
          - state_machines.DeveloperAgreement.PENDING_ESCROW_to_TERMINATED
        distinguishing_aspect: >
          Escrow dollars are conserved: after DEPOSIT 4,000,000 + DRAWDOWN 1,000,000 + terminate REFUND of
          the held 3,000,000, deposited(4,000,000) == held(0) + drawn(1,000,000) + refunded(3,000,000) —
          the conserved quantity is escrow money.
        test_recipe:
          setup:
            - "Agreement offered (required 4,000,000), 4,000,000 deposited, 1,000,000 drawn down, held 3,000,000."
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-P", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_p: "$.data.id" }
            - call: "POST /main-extension-projects"
              payload: { application_id: "${app_p}", developer_user_id: "dev-1", length_ft: 400, estimated_cost_cents: 4000000, total_assessable_front_ft: 400, total_assessable_area_sqft: 80000, reimbursement_cap_cents: 5000000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { proj_p: "$.data.id" }
            - call: "POST /developer-agreements"
              payload: { main_extension_project_id: "${proj_p}", developer_user_id: "dev-1" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_p: "$.data.id" }
            - call: "POST /developer-agreements/${agr_p}/offer"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_p_v: "$.data.version" }
            - call: "POST /developer-agreements/${agr_p}/escrow-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 4000000, expected_developer_agreement_version: "${agr_p_v}" }
              as: Developer
              as_user_id: "dev-1"
            - call: "GET /developer-agreements/${agr_p}"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
              captures: { agr_p_v2: "$.data.version" }
            - call: "POST /developer-agreements/${agr_p}/escrow-transactions"
              payload: { txn_type: "DRAWDOWN", amount_cents: 1000000, expected_developer_agreement_version: "${agr_p_v2}" }
              as: Developer
              as_user_id: "dev-1"
          trigger:
            - call: "POST /developer-agreements/${agr_p}/terminate"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { held_p: "$.data.escrow_held_cents" }
          assert:
            - "DeveloperAgreement.${agr_p}.escrow_deposited_cents == 4000000"
            - "DeveloperAgreement.${agr_p}.escrow_drawn_cents == 1000000"
            - "DeveloperAgreement.${agr_p}.escrow_refunded_cents == 3000000"
            - "DeveloperAgreement.${agr_p}.escrow_held_cents == 0"
            - "escrow_deposited_cents == escrow_held_cents + escrow_drawn_cents + escrow_refunded_cents"

      - name: reimbursement_pool_conservation
        grounds:
          - calculations.reimbursement_pool
          - entities.MainExtensionProject.fields.outstanding_recoverable_cents
          - state_machines.LatecomerReimbursement.ASSESSED_to_COLLECTED
        distinguishing_aspect: >
          The reimbursement pool is conserved: on an ACCEPTED project (principal 5,000,000) a collected
          500,000 latecomer moves 500,000 from outstanding_recoverable to reimbursed_collected, keeping
          principal(5,000,000) == collected(500,000) + outstanding(4,500,000) — a different conserved
          quantity (recoverable principal) than escrow money.
        test_recipe:
          setup:
            - "MainExtensionProject ACCEPTED with principal 5,000,000; one ASSESSED latecomer of 500,000."
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-Q", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_q: "$.data.id" }
            - call: "POST /main-extension-projects"
              payload: { application_id: "${app_q}", developer_user_id: "dev-1", length_ft: 500, estimated_cost_cents: 4000000, total_assessable_front_ft: 500, total_assessable_area_sqft: 100000, reimbursement_cap_cents: 6000000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { proj_q: "$.data.id" }
            - call: "POST /developer-agreements"
              payload: { main_extension_project_id: "${proj_q}", developer_user_id: "dev-1" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_q: "$.data.id" }
            - call: "POST /developer-agreements/${agr_q}/offer"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_q_v: "$.data.version" }
            - call: "POST /developer-agreements/${agr_q}/escrow-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 4000000, expected_developer_agreement_version: "${agr_q_v}" }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /developer-agreements/${agr_q}/execute"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /main-extension-projects/${proj_q}/start-construction"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /inspectors"
              payload: { name: "Insp Q" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp_q: "$.data.id" }
            - call: "POST /main-extension-projects/${proj_q}/record-inspection"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_q}"
            - call: "POST /main-extension-projects/${proj_q}/accept"
              payload: { actual_construction_cost_cents: 5000000 }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { proj_q_v: "$.data.version" }
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-QB", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-2"
              captures: { ben_q: "$.data.id" }
            - call: "POST /latecomer-reimbursements"
              payload: { main_extension_project_id: "${proj_q}", benefiting_application_id: "${ben_q}", method: "FRONT_FOOTAGE", parcel_front_ft: 50, parcel_area_sqft: 8000, expected_main_extension_project_version: "${proj_q_v}" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { lc_q: "$.data.id" }
          trigger:
            - call: "POST /latecomer-reimbursements/${lc_q}/collect"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
          assert:
            - "MainExtensionProject.${proj_q}.reimbursable_principal_cents == 5000000"
            - "MainExtensionProject.${proj_q}.reimbursed_collected_cents == 500000"
            - "MainExtensionProject.${proj_q}.outstanding_recoverable_cents == 4500000"
            - "reimbursable_principal_cents == reimbursed_collected_cents + outstanding_recoverable_cents"
