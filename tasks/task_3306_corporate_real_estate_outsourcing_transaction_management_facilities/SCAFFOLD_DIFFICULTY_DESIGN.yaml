- rule_id: resource_temporal_overlap
  instances:
  - name: premises_cooldown_overlap_on_new_lease
    grounds:
    - validations[priority=26]
    - errors[ERR_LEASE_OVERLAP]
    - entities.Lease.fields.lease_start_date
    distinguishing_aspect: A new lease starting 31 days after a prior lease on the same address is accepted while a start 29 days after the same prior end is rejected, pinning the 30-day premises cooldown between adjacent intervals.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - prior Lease L1 on 1 Market St ending 2027-02-01T00:00:00Z, EXECUTED
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/accounts
        payload:
          account_name: Pinnacle
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-02-01T00:00:00Z'
          lease_end_date: '2027-02-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/leases/${L1}/expire
        payload: {}
        as: AccountExecutive
      trigger:
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2027-03-04T00:00:00Z'
          lease_end_date: '2028-03-04T00:00:00Z'
        as: TransactionManager
        captures:
          L2: $.data.id
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2027-03-02T00:00:00Z'
          lease_end_date: '2028-03-02T00:00:00Z'
        as: TransactionManager
        captures:
          e1: $.data.error_id
      assert:
      - Lease.${L2}.pipeline_state == PIPELINE
      - ${e1} == ERR_LEASE_OVERLAP
  - name: half_open_consolidation_windows_adjacency
    grounds:
    - validations[priority=30]
    - errors[ERR_SITE_OVERLAP]
    - entities.FacilitySite.fields.consolidation_window_start
    distinguishing_aspect: Under half-open interval semantics a window starting exactly at a committed window's end is accepted, while one starting 24 hours earlier is rejected, pinning the boundary treatment on the site resource.
    test_recipe:
