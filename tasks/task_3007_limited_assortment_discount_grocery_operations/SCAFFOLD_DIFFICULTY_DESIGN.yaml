              payload: { name: "Sup C", contact_email: "c@x.com" }
              as: ProcurementLead
              captures: { sup_c: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup D", contact_email: "d@x.com" }
              as: ProcurementLead
              captures: { sup_d: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod1: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod1}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend1: $.data.id }
            - call: "POST /v1/tenders/${tend1}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend1}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { b1a: $.data.id }
            - call: "POST /v1/tenders/${tend1}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { b1b: $.data.id }
            - call: "POST /v1/bids/${b1a}/panels"
              payload: { sample_code: "BLIND-1A" }
              as: QualityAssuranceLead
              captures: { p1a: $.data.id }
            - call: "POST /v1/panels/${p1a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${b1b}/panels"
              payload: { sample_code: "BLIND-1B" }
              as: QualityAssuranceLead
              captures: { p1b: $.data.id }
            - call: "POST /v1/panels/${p1b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend1}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend1}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend1}/award"
              payload: { primary_bid_id: "${b1a}", secondary_bid_id: "${b1b}" }
              as: ProcurementLead
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-2", name: "Prod Two", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod2: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod2}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend2: $.data.id }
            - call: "POST /v1/tenders/${tend2}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend2}/bids"
              payload: { supplier_id: "${sup_c}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_c}
              captures: { b2a: $.data.id }
            - call: "POST /v1/tenders/${tend2}/bids"
              payload: { supplier_id: "${sup_d}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_d}
              captures: { b2b: $.data.id }
            - call: "POST /v1/bids/${b2a}/panels"
              payload: { sample_code: "BLIND-2A" }
              as: QualityAssuranceLead
              captures: { p2a: $.data.id }
            - call: "POST /v1/panels/${p2a}/score"
              payload: { score: 80 }
