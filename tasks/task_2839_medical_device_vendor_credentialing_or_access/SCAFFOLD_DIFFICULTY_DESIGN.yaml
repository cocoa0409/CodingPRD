      - name: incident_substantiation_cascades_four_hops_to_blocked_case
        grounds:
          - state_machines.Incident.REPORTED_to_SUBSTANTIATED
          - state_machines.ApprovedProduct.ACTIVE_to_SUSPENDED
          - state_machines.LoanerSet.DELIVERED_ON_TIME_to_HELD
          - calculations.case_implant_readiness_status
          - entities.ApprovedProduct.fields.suspended_reason
          - entities.SurgicalCase.fields.implant_readiness_status
        distinguishing_aspect: |
          A four-hop chain rooted at an Incident rather than a Credential, and travelling through the
          product/instrument aggregate instead of the access aggregate: incident SUBSTANTIATED ->
          ApprovedProduct SUSPENDED (INCIDENT_SUBSTANTIATED) -> LoanerSet HELD -> SurgicalCase
          implant_readiness_status BLOCKED. The rep must NOT be suspended, because only a CRITICAL
          UNAPPROVED_PRODUCT_USE substantiation reaches the VendorRep machine and this one is MAJOR.
        test_recipe:
          setup:
            - "Facility HS-08 has spd_turnaround_hours 8 and spd_bay_count 2."
            - "Vendor ORTHOP has one approved implant product (endorsed by user_sponsor_1, approved by user_vac_1)."
            - "Rep Sam Okoye exists but is left PENDING_CREDENTIALING; an incident report does not require a credentialed rep."
            - "Case CASE-9601 is an implant case running 2026-09-20T10:00:00Z to 14:00:00Z."
            - "A 4-tray SIMPLE loaner set is registered: lead_hours = max(8 + 2 + 0, 24) = 24, so the deadline is 2026-09-19T10:00:00Z."
            - "The set is received at 2026-09-19T09:00:00Z, one hour early, so it is DELIVERED_ON_TIME with fee_status NONE and the case reads implant_readiness_status PENDING (no set is RELEASED_TO_OR yet)."
            - "An UNAPPROVED_PRODUCT_USE incident of severity MAJOR is reported against the rep, naming the approved product."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Hillside Orthopaedic Hospital", code: "HS-08", spd_turnaround_hours: 8, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
