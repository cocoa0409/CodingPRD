            - call: "POST /battery-warranty/warranty-claims/${claim_id}/adjudicate"
              payload: { approved_remedy: "PACK_REPLACEMENT", decision_note: "pool now holds a pack exactly at the floor" }
              as: WarrantyAdjudicator
              as_user_id: "adj-001"
          assert:
