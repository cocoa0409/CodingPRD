# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1947: Seed Library & Plant Swap Program
# 9 rules x 2 instances = 18 instances, all grounded in SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: SeedLot vs Member)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: germination_viability_provisional_vs_certified_final
        grounds:
          - "calculations.germination_viability"
          - "entities.SeedLot.fields.viable_seed_count"
          - "entities.SeedLot.fields.final_viability_pct"
          - "state_machines.GerminationTest.RECORDED_to_CERTIFIED"
        distinguishing_aspect: |
          Entity domain SeedLot: identical seeds_remaining (1000) yields
          viable_seed_count 800 under the PROVISIONAL variant (declared 80.00%)
          and 900 under CERTIFIED_FINAL (measured 90.00%) — two valid
          valuations of the same lot produce different packet-allocatable stock.
        test_recipe:
          setup:
            - "Site S ACTIVE with label_stock_count 100"
            - "SeedVariety V ACTIVE, non-invasive, approved_zones contains ZONE_5A"
            - "SeedLot L: variety V, site S, seeds_received 1000, provisional_viability_pct 80.00, moved DRAFT->QUARANTINE"
            - "Volunteer Vol ACTIVE; GerminationTest T on L: seeds_tested 100, sprouted_count 90 (result_pct 90.00), still RECORDED"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "Central", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 100 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "Brandywine", species: "Solanum lycopersicum", category: "VEGETABLE", approved_zones: ["ZONE_5A"], invasive_flag: false, rarity_flag: false }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "LOT-26-A", harvest_year: 2026, seeds_received: 1000, provisional_viability_pct: 80.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "vol@x.com", full_name: "Vol One" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { test_id: "$.data.id" }
            - call: "GET /api/seed-lots/${lot_id}"
              as: ProgramAdmin
              captures: { viable_before: "$.data.viable_seed_count" }
          trigger:
            - call: "POST /api/germination-tests/${test_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "GET /api/seed-lots/${lot_id}"
              as: ProgramAdmin
              captures: { viable_after: "$.data.viable_seed_count", lot_status: "$.data.status" }
          assert:
            - "viable_before == 800   # floor(1000 * 80.00 / 100), PROVISIONAL variant"
            - "viable_after == 900    # floor(1000 * 90.00 / 100), CERTIFIED_FINAL variant — same seeds_remaining, different result"
            - "lot_status == ACTIVE"

      - name: member_return_rate_simple_vs_decay_weighted
        grounds:
          - "calculations.member_return_rate"
          - "entities.Member.fields.simple_return_rate"
          - "entities.Member.fields.decay_weighted_return_score"
        distinguishing_aspect: |
          Entity domain Member (distinct from the SeedLot instance): the same
          terminal history {1 VERIFIED due 90 days ago, 1 WRITTEN_OFF due 180
          days ago} yields simple_return_rate 0.5000 but
          decay_weighted_return_score 0.6667 — recency weighting diverges from
          the flat ratio.
        test_recipe:
          setup:
            - "Clock starts 2026-01-01. Site S ACTIVE zone ZONE_5A label stock 100; variety V non-invasive approved ZONE_5A"
            - "Lot L ACTIVE with certified viability 90.00 and 1000 seeds; 4 packets packed at 20 seeds"
            - "Member M home site S; checkout C1 on packet 1 created 2026-01-01 (due 2026-01-22), returned 2026-01-10, VERIFIED"
            - "Checkout C2 on packet 2 created 2025-10-03 (due 2025-10-24), swept OVERDUE 2025-10-25, disputed, WRITE_OFF"
            - "Final clock 2026-04-22: C1 due-age 90d (w=0.5), C2 due-age 180d (w=0.25)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 100 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "FLOWER", approved_zones: ["ZONE_5A"], invasive_flag: false, rarity_flag: false }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "L1", harvest_year: 2025, seeds_received: 1000, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 4, seeds_per_packet: 20 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id", p2: "$.data[1].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            # C1: created 2026-01-01 (due 2026-01-22); returned and verified 2026-01-10
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/checkouts/${c1_id}/return"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts/${c1_id}/verify-return"
              payload: {}
              as: ProgramAdmin
            # C2: backdate to 2025-10-03 (due 2025-10-24); sweep overdue at 2025-10-25; dispute; write off
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p2}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c2_id: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-25T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/ops/run-daily-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/checkouts/${c2_id}/dispute"
              payload: { reason: "member claims loss" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts/${c2_id}/resolve-dispute"
              payload: { outcome: "WRITE_OFF" }
              as: ProgramAdmin
            # final read clock: 2026-04-22 -> C1 due age 90d, C2 due age 180d
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-22T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/members/${m_id}"
              as: ProgramAdmin
              captures: { simple: "$.data.simple_return_rate", decay: "$.data.decay_weighted_return_score", tier: "$.data.standing_tier" }
          assert:
            - "simple == 0.5        # 1 VERIFIED / 2 terminal"
            - "decay == 0.6667      # (0.5*1 + 0.25*0)/(0.5+0.25) = 0.6666... round_half_up 4dp"
            - "simple != decay      # the two variants diverge on identical history"
            - "tier == STANDARD     # terminal_checkout_count 2 < 3 -> unrated -> STANDARD"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes: a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pack_allocation_min_of_four_inputs_mode_a
        grounds:
          - "calculations.pack_allocation"
          - "entities.SeedLot.fields.viable_seed_count"
          - "entities.Site.fields.label_stock_count"
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: allocatable =
          min(floor(viable/seeds_per_packet), label_stock, 200 - packets_created)
          with viable itself branching on certification state. With viable 800,
          labels 100, cap headroom 200, the seed floor binds at 40: a request
          for 41 is rejected while 40 succeeds and debits exactly 800 seeds and
          40 labels.
        test_recipe:
          setup:
            - "Site S label_stock_count 100; variety V; lot L ACTIVE (certified 80.00 viability), seeds_received 1000, no packets yet"
            - "Volunteer Vol ACTIVE"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_6B", label_stock_count: 100 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_6B"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "P1", harvest_year: 2026, seeds_received: 1000, provisional_viability_pct: 80.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 80 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 41, seeds_per_packet: 20 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { pack_err: "$.data.error_id" }
          trigger:
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 40, seeds_per_packet: 20 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { created: "$.data.created_count" }
            - call: "GET /api/seed-lots/${lot_id}"
              as: ProgramAdmin
              captures: { remaining: "$.data.seeds_remaining", in_packets: "$.data.seeds_in_packets", created_total: "$.data.packets_created_total" }
            - call: "GET /api/sites/${s_id}"
              as: ProgramAdmin
              captures: { labels: "$.data.label_stock_count" }
          assert:
            - "pack_err == ERR_PACK_QUANTITY_EXCEEDS_ALLOCATABLE   # 41 > min(40, 100, 200)"
            - "created == 40"
            - "remaining == 200        # 1000 - 40*20"
            - "in_packets == 800"
            - "created_total == 40"
            - "labels == 60            # 100 - 40"

      - name: swap_credit_per_item_round_then_sum_mode_b
        grounds:
          - "calculations.swap_credit_valuation"
          - "entities.SwapIntakeItem.fields.credit_value"
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: two CUTTING items in
          EXCELLENT condition price at round_half_up(3 * 1.5) = 5 EACH and sum
          to 10, whereas the unpinned sum-then-round order would give
          round_half_up(9.0) = 9. The scaffold pins per-item rounding BEFORE
          summation; each stored credit_value is 5 and the member's earned
          total is 10.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A; non-rare non-invasive varieties V and V2 approved for ZONE_5A"
            - "SwapEvent E at site S, INTAKE_OPEN; Member M home site S"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "FLOWER", approved_zones: ["ZONE_5A"], rarity_flag: false, invasive_flag: false }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V2", species: "Sp2", category: "FLOWER", approved_zones: ["ZONE_5A"], rarity_flag: false, invasive_flag: false }
              as: ProgramAdmin
              captures: { v2_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-05T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v_id}", item_type: "CUTTING", condition: "EXCELLENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item1: "$.data.id", cv1: "$.data.credit_value" }
            - call: "POST /api/intake-items/${item1}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v2_id}", item_type: "CUTTING", condition: "EXCELLENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item2: "$.data.id", cv2: "$.data.credit_value" }
            - call: "POST /api/intake-items/${item2}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "GET /api/members/${m_id}/credit-summary"
              as: ProgramAdmin
              captures: { earned: "$.data.credits_earned_total", balance: "$.data.credits_balance" }
          assert:
            - "cv1 == 5     # round_half_up(3 * 1.5) = round_half_up(4.5) = 5 per item"
            - "cv2 == 5"
            - "earned == 10  # per-item rounding then sum; sum-then-round would give 9"
            - "balance == 10"

      - name: borrow_limit_derivation_order_mode_c
        grounds:
          - "calculations.member_effective_borrow_limit"
          - "entities.Member.fields.standing_tier"
          - "entities.Member.fields.effective_borrow_limit"
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          limit depends on tier, tier on rate, rate on checkout outcomes — but
          the in-flight attempt never participates. A member with 3 terminal
          checkouts (2 VERIFIED, 1 WRITTEN_OFF; rate 0.6667 >= 0.60) is
          STANDARD (limit 5); their 5 live checkouts do NOT demote them, and
          the 6th borrow is rejected with ERR_BORROW_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A label stock 100; variety V approved ZONE_5A"
            - "Lot L ACTIVE certified 90.00, 1000 seeds; 9 packets of 20 seeds packed"
            - "Member M with exactly 3 terminal checkouts (2 VERIFIED + 1 WRITTEN_OFF; rate 0.6667 -> STANDARD, limit 5)"
            - "M already holds 5 live checkouts (ACTIVE)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 100 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "B1", harvest_year: 2026, seeds_received: 1000, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 9, seeds_per_packet: 20 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id", p4: "$.data[3].id", p5: "$.data[4].id", p6: "$.data[5].id", p7: "$.data[6].id", p8: "$.data[7].id", p9: "$.data[8].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            # 3 terminal: p1 verified, p2 verified, p3 written off
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c1: "$.data.id" }
            - call: "POST /api/checkouts/${c1}/return"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts/${c1}/verify-return"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p2}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c2: "$.data.id" }
            - call: "POST /api/checkouts/${c2}/return"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts/${c2}/verify-return"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p3}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c3: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/ops/run-daily-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/checkouts/${c3}/dispute"
              payload: { reason: "lost" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts/${c3}/resolve-dispute"
              payload: { outcome: "WRITE_OFF" }
              as: ProgramAdmin
            # 5 live checkouts p4..p8
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p4}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p5}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p6}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p7}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p8}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /api/members/${m_id}"
              as: ProgramAdmin
              captures: { tier: "$.data.standing_tier", limit: "$.data.effective_borrow_limit", active: "$.data.active_checkout_count" }
          trigger:
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p9}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "tier == STANDARD       # rate 0.6667 >= 0.60 keeps STANDARD; live checkouts never enter the rate"
            - "limit == 5"
            - "active == 5"
            - "err == ERR_BORROW_LIMIT_EXCEEDED   # 6th borrow rejected at the cap"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities: SeedLot vs Checkout)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: seed_lot_active_quarantine_recheck_cycle
        grounds:
          - "state_machines.SeedLot.ACTIVE_to_QUARANTINE"
          - "state_machines.SeedLot.QUARANTINE_to_ACTIVE"
        distinguishing_aspect: |
          SeedLot machine is cyclic: ACTIVE -> QUARANTINE (recheck) -> ACTIVE
          (second PASS certification). The lot completes the full A->B->A loop
          and its final_viability_pct is rewritten by the SECOND certified test
          (85.00 replacing 90.00), proving the cycle rewrites derived state.
        test_recipe:
          setup:
            - "Site S; variety V; lot L with 500 seeds at provisional 90.00; first test 90/100 certified PASS -> ACTIVE"
            - "Volunteer Vol ACTIVE"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A", label_stock_count: 50 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "CYC1", harvest_year: 2026, seeds_received: 500, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t1: "$.data.id" }
            - call: "POST /api/germination-tests/${t1}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/seed-lots/${lot_id}/recheck"
              payload: {}
              as: ProgramAdmin
              captures: { st_mid: "$.data.status" }
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 85 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t2: "$.data.id" }
            - call: "POST /api/germination-tests/${t2}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "GET /api/seed-lots/${lot_id}"
              as: ProgramAdmin
              captures: { st_end: "$.data.status", final_pct: "$.data.final_viability_pct", viable: "$.data.viable_seed_count" }
          assert:
            - "st_mid == QUARANTINE     # ACTIVE -> QUARANTINE (loop back)"
            - "st_end == ACTIVE         # QUARANTINE -> ACTIVE again: full cycle A->B->A"
            - "final_pct == 85.00       # second certification overwrote the first (90.00)"
            - "viable == 425            # floor(500 * 85.00 / 100)"

      - name: checkout_return_dispute_loop_cycle
        grounds:
          - "state_machines.Checkout.RETURNED_to_DISPUTED"
          - "state_machines.Checkout.DISPUTED_to_RETURNED"
          - "state_machines.Checkout.DISPUTED_to_WRITTEN_OFF"
        distinguishing_aspect: |
          Checkout machine is cyclic on a different entity: RETURNED ->
          DISPUTED -> RETURNED -> DISPUTED -> WRITTEN_OFF. The loop iterates
          twice before the terminal write-off; member terminal counters update
          only at the final WRITE_OFF, not on loop iterations.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A labels 10; variety V approved; lot L ACTIVE certified 90.00; 1 packet packed"
            - "Member M; checkout C on the packet, returned (status RETURNED)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 10 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "D1", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 50, sprouted_count: 45 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: "$.data.id" }
            - call: "POST /api/checkouts/${c_id}/return"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/checkouts/${c_id}/dispute"
              payload: { reason: "packet damaged on return" }
              as: ProgramAdmin
              captures: { st1: "$.data.status" }
            - call: "POST /api/checkouts/${c_id}/resolve-dispute"
              payload: { outcome: "RETURN_ACCEPTED" }
              as: ProgramAdmin
              captures: { st2: "$.data.status" }
            - call: "POST /api/checkouts/${c_id}/dispute"
              payload: { reason: "second inspection fail" }
              as: ProgramAdmin
              captures: { st3: "$.data.status" }
            - call: "POST /api/checkouts/${c_id}/resolve-dispute"
              payload: { outcome: "WRITE_OFF" }
              as: ProgramAdmin
              captures: { st4: "$.data.status" }
            - call: "GET /api/members/${m_id}"
              as: ProgramAdmin
              captures: { terminal_cnt: "$.data.terminal_checkout_count", verified_cnt: "$.data.verified_return_count" }
          assert:
            - "st1 == DISPUTED"
            - "st2 == RETURNED      # loop edge DISPUTED -> RETURNED"
            - "st3 == DISPUTED      # second iteration of the cycle"
            - "st4 == WRITTEN_OFF   # terminal"
            - "terminal_cnt == 1"
            - "verified_cnt == 0"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth 3 and depth 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: certify_fail_recall_cascade_depth3
        grounds:
          - "state_machines.SeedLot.ACTIVE_to_QUARANTINE"
          - "state_machines.SeedPacket.CHECKED_OUT_to_RECALLED"
          - "entities.Checkout.fields.recall_required"
          - "calculations.seed_count_conservation"
        distinguishing_aspect: |
          Depth-3 chain from trigger 'certify FAIL': GerminationTest
          certification flips SeedLot ACTIVE->QUARANTINE (hop 1); the lot's
          transition flips its packets AVAILABLE/CHECKED_OUT/RETURNED ->
          RECALLED (hop 2, caused by hop 1); each CHECKED_OUT packet's recall
          sets recall_required=true on its hosting Checkout (hop 3, caused by
          hop 2). Trigger: POST /api/germination-tests/{id}/certify.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A labels 10; variety V approved; lot L ACTIVE (certified 90.00), 300 seeds"
            - "3 packets packed (10 seeds each): P1 AVAILABLE, P2 CHECKED_OUT to member M1 (checkout C2), P3 CHECKED_OUT to member M2 (checkout C3)"
            - "lot rechecked -> QUARANTINE; new test 40/100 = 40.00 RECORDED"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 10 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "RC1", harvest_year: 2026, seeds_received: 300, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t1: "$.data.id" }
            - call: "POST /api/germination-tests/${t1}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 3, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id" }
            - call: "POST /api/members"
              payload: { email: "m1@x.com", full_name: "M1", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /api/members"
              payload: { email: "m2@x.com", full_name: "M2", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m1}", packet_id: "${p2}" }
              as: Member
              as_user_id: "${m1}"
              captures: { c2: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m2}", packet_id: "${p3}" }
              as: Member
              as_user_id: "${m2}"
              captures: { c3: "$.data.id" }
            - call: "POST /api/seed-lots/${lot_id}/recheck"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 40 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t2: "$.data.id" }
          trigger:
            - call: "POST /api/germination-tests/${t2}/certify"
              payload: { outcome: "FAIL" }
              as: ProgramAdmin
            - call: "GET /api/seed-lots/${lot_id}"
              as: ProgramAdmin
              captures: { lot_st: "$.data.status" }
            - call: "GET /api/seed-packets/${p1}"
              as: ProgramAdmin
              captures: { p1_st: "$.data.status" }
            - call: "GET /api/seed-packets/${p2}"
              as: ProgramAdmin
              captures: { p2_st: "$.data.status" }
            - call: "GET /api/seed-packets/${p3}"
              as: ProgramAdmin
              captures: { p3_st: "$.data.status" }
            - call: "GET /api/checkouts/${c2}"
              as: ProgramAdmin
              captures: { c2_recall: "$.data.recall_required" }
            - call: "GET /api/checkouts/${c3}"
              as: ProgramAdmin
              captures: { c3_recall: "$.data.recall_required" }
          assert:
            - "lot_st == QUARANTINE        # hop 1"
            - "p1_st == RECALLED           # hop 2 (AVAILABLE -> RECALLED)"
            - "p2_st == RECALLED           # hop 2 (CHECKED_OUT -> RECALLED)"
            - "p3_st == RECALLED"
            - "c2_recall == true           # hop 3 (caused by packet recall, not by the certify directly)"
            - "c3_recall == true"

      - name: event_cancel_credit_revocation_cascade_depth2
        grounds:
          - "state_machines.SwapEvent.INTAKE_OPEN_to_CANCELLED"
          - "state_machines.SwapIntakeItem.ACCEPTED_to_RETURNED_TO_OWNER"
          - "calculations.credit_balance_reconciliation"
          - "entities.Member.fields.credits_revoked_total"
        distinguishing_aspect: |
          Depth-2 chain from a different trigger ('cancel event'): SwapEvent
          INTAKE_OPEN->CANCELLED flips each ACCEPTED SwapIntakeItem ->
          RETURNED_TO_OWNER (hop 1); each accepted item's return appends a
          REVOKED CreditEntry and recomputes the member's credit totals (hop 2,
          caused by hop 1). Member earned_total stays 10 while balance drops
          to 0 and revoked_total rises to 10.
        test_recipe:
          setup:
            - "Site S zone ZONE_5A; varieties V (rare) and V2 (non-rare), both approved non-invasive"
            - "SwapEvent E at S, INTAKE_OPEN; Member M home site S"
            - "M has two ACCEPTED items: PLANT_START/GOOD on rare V (credit 7) and SEED_PACKET/EXCELLENT on V2 (credit 3); earned_total 10, balance 10"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "NATIVE", approved_zones: ["ZONE_5A"], rarity_flag: true, invasive_flag: false }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V2", species: "Sp2", category: "FLOWER", approved_zones: ["ZONE_5A"], rarity_flag: false, invasive_flag: false }
              as: ProgramAdmin
              captures: { v2_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-09-12T10:00:00Z", end_at: "2026-09-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v_id}", item_type: "PLANT_START", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it1: "$.data.id" }
            - call: "POST /api/intake-items/${it1}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v2_id}", item_type: "SEED_PACKET", condition: "EXCELLENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it2: "$.data.id" }
            - call: "POST /api/intake-items/${it2}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/swap-events/${e_id}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { ev_st: "$.data.status" }
            - call: "GET /api/intake-items/${it1}"
              as: ProgramAdmin
              captures: { it1_st: "$.data.status" }
            - call: "GET /api/intake-items/${it2}"
              as: ProgramAdmin
              captures: { it2_st: "$.data.status" }
            - call: "GET /api/members/${m_id}/credit-summary"
              as: ProgramAdmin
              captures: { earned: "$.data.credits_earned_total", revoked: "$.data.credits_revoked_total", balance: "$.data.credits_balance" }
          assert:
            - "ev_st == CANCELLED"
            - "it1_st == RETURNED_TO_OWNER     # hop 1"
            - "it2_st == RETURNED_TO_OWNER"
            - "earned == 10                     # hop 2: earned history preserved"
            - "revoked == 10                    # hop 2: REVOKED entries appended (7 + 3)"
            - "balance == 0"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_checkout
        grounds:
          - "validations[priority=6.1]"
          - "validations[priority=7]"
          - "errors[ERR_MEMBER_SUSPENDED]"
          - "errors[ERR_INVASIVE_SPECIES_BLOCKED]"
        distinguishing_aspect: |
          Pair (state, business_safety) on POST /api/checkouts: the borrowing
          member is SUSPENDED (state failure, priority 6.1) AND the variety is
          invasive-flagged (safety failure, priority 7). The single returned
          error MUST be ERR_MEMBER_SUSPENDED — state outranks safety.
