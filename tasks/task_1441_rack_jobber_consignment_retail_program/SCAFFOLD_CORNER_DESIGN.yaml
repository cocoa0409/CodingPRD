          trigger:
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "DUP-1", name: "Second", jobber_cost_cents: 200, min_retail_cents: 300, units_per_facing: 5 }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SKU_EXISTS (http 409)"

      - name: route_program_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=25]", "errors[ERR_ROUTE_PROGRAM_MISMATCH]"]
        distinguishing_aspect: "A visit cannot join a route of program A to an agreement of program B."
        test_recipe:
          setup: ["programs A, B; route on A; ACTIVE agreement on B"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "RouteA" }, as: JobberAdmin, captures: { progA: "$.data.id" } }
            - { call: "POST /programs", payload: { name: "RouteB" }, as: JobberAdmin, captures: { progB: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "RMStore", store_code: "RM1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${progB}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agrB: "$.data.id" } }
            - { call: "POST /agreements/${agrB}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agrB}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /routes", payload: { program_id: "${progA}", name: "Route A", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
          trigger:
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agrB}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
