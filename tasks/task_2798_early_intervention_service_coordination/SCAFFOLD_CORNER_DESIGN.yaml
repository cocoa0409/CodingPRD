        excluded_because:
          difficulty_instance: zero_excluded_delay_days_empty_assessment_set
          rationale: >-
            GET /ei/referrals/{referralId}/timeline-compliance is already read at its most delicate
            point by that §1.8 instance: an empty family_unavailable_days set, where
            excluded_delay_days must be exactly 0 and net_elapsed_days must equal gross_elapsed_days
            rather than null or absent. A second §1.9 computed-read test of the same endpoint would
            assert the identical field set.

