              as: BrokerAdmin
              captures: { prin_v: $.data.version }
            - call: "POST /slotting-deals/${deal}/accept"
              payload: { expected_principal_version: "${prin_v}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { acc: $.data.accepted_fee_cents }
            - call: "GET /authorizations"
              payload: { item_id: "${i1}" }
              as: BrokerAccountManager
              captures: { a1: "$.data[0].id", a1v: "$.data[0].version" }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${a1}", expected_authorization_version: "${a1v}", period_index: 1, reported_store_count: 400, distributed_store_count: 400, reported_case_volume: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { snap: $.data.id, amt: $.data.amortized_amount_cents }
            - call: "GET /principals/${prin}/commission-statement"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS" }
              as: BrokerAccountManager
              captures: { l0: "$.data.lines[0].item_id", c0: "$.data.lines[0].line_commission_cents", l1: "$.data.lines[1].item_id", c1: "$.data.lines[1].line_commission_cents", tot: $.data.total_commission_cents }
          assert:
            - "Call 1: the deal is still PROPOSED so both authorizations are PENDING_SETUP → lines is an empty array, total_shipped_cents == 0 and ${t0} == 0; the agreement fields (agreement_id == the ACTIVE ${agr}, base_commission_bps 500) are still populated"
            - "Call 3: gross == 12500*400*2 == 10000000, net == 10000000 → tier 2 → admin == 150000 → ${acc} == 10150000; both authorizations become AUTHORIZED / SLOTTING_AMORTIZING with slotting_share_cents 5075000 each (remainder 0)"
            - "Call 5: ${amt} == floor(10150000/4) == 2537500 (FORECAST_STRAIGHT ignores reported_case_volume) and the void rate is 0 bps, so the authorization stays AUTHORIZED"
            - "Call 6: exactly two lines in Item.upc ASC order — ${l0} == ${i1} and ${l1} == ${i2}"
            - "${c0} == 100500 — line_shipped_cents == 1000 * 2010 == 2010000, entirely below tier_threshold_cents 3000000 → 2010000*500/10000"
            - "${c1} == 0 — I2 has an AUTHORIZED authorization but no POSTING snapshot, so its line is present with line_shipped_cents 0 rather than omitted"
            - "${tot} == 100500 and total_shipped_cents == 2010000"

      - name: void_rate_basis_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.void_rate.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / void_rate_store_count_basis_vs_reported_basis_divergence"
          rationale: "Both bases are driven off one identical snapshot there, with the AT_RISK flip happening under one basis and not the other — the full variant-divergence claim."

      - name: commission_statement_per_line_tier_walk
        claim_type: tiered_pricing
        grounds:
          - calculations.commission_statement.formula
        excluded_because:
          difficulty_instance: "combinatorial_formula / commission_lines_rounded_per_line_then_summed"
          rationale: "That instance walks the cumulative tier split across three straddling lines in upc order and asserts the per-line-then-sum rounding order, which is the whole tiered_pricing row."

  # ==========================================================================
  - section: validations
    instances:
      - name: retailer_scope_is_enforced_except_on_chain_agnostic_catalog_decisions
        claim_type: violation_to_error
        grounds:
          - validations.v-retailer-scope
          - errors.ERR_RETAILER_SCOPE_FORBIDDEN
          - endpoints.POST_/items/{itemId}/catalog-decision
        distinguishing_aspect: |
          A RetailerBuyer is entity-backed: X-User-ID IS a Retailer id, so acting
          on another chain's review or filing a deduction for another chain is a
          priority-5 403. The single documented exemption is
          POST /items/{itemId}/catalog-decision — items are chain-agnostic, so ANY
          RetailerBuyer may validate catalog data. An implementation that scopes
          catalog decisions by chain, or that forgets to scope reviews, fails.
        test_recipe:
          setup:
            - "Two retailers: BIGMART (${r1}) and MIDCO (${r2}); principal NWF with item I1 in catalog_state SUBMITTED; one SCHEDULED FROZEN_SNACKS review owned by BIGMART."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { r1: $.data.id }
            - call: "POST /retailers"
              payload: { name: "Midco Markets", chain_code: "MIDCO", total_store_count: 400 }
              as: BrokerAdmin
              captures: { r2: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { itm: $.data.id }
            - call: "POST /items/${itm}/catalog-submissions"
              payload: { gtin14: "00011111000001", dimensions_cm: "20x15x8", gross_weight_g: 900, nutrition_panel_url: "https://cdn.example/n1.pdf", shelf_life_days: 365 }
              as: BrokerAccountManager
            - call: "POST /category-reviews"
              payload: { retailer_id: "${r1}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${r1}"
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /category-reviews/${rev}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${r2}"
              captures: { e1: $.data.error_id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${r1}", category_code: "DAIRY", review_window_start: "2026-10-01", review_window_end: "2026-10-15", submission_deadline: "2026-09-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${r2}"
              captures: { e2: $.data.error_id }
            - call: "POST /deductions"
              payload: { retailer_id: "${r1}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 50000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${r2}"
              captures: { e3: $.data.error_id }
            - call: "POST /items/${itm}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${r2}"
              captures: { cs: $.data.catalog_state }
            - call: "POST /category-reviews/${rev}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${r1}"
              captures: { st: $.data.status }
          assert:
            - "Calls 1-3 each return 403 ERR_RETAILER_SCOPE_FORBIDDEN — MIDCO may not open BIGMART's review, schedule a review for BIGMART, or record a deduction against BIGMART"
            - "CategoryReview.${rev}.status is still SCHEDULED after call 1 and GET /category-reviews?retailer_id=${r1} still returns total_count 1 after call 2"
            - "Call 4 returns 200 with ${cs} == VALIDATED even though MIDCO owns no part of the item — catalog decisions are explicitly chain-agnostic"
            - "Call 5 returns 200 with ${st} == OPEN — the same request from the owning chain succeeds"

      - name: priority_ladder_runs_auth_then_role_then_shape_then_lookup_then_scope
        claim_type: priority_ordering
        grounds:
          - validations.v-auth-headers
          - validations.v-role-permitted
          - validations.v-request-shape
          - validations.v-upc-checksum
          - validations.v-path-existence
          - validations.v-retailer-scope
        distinguishing_aspect: |
          One request is made to violate five rungs at once and then repaired one
          rung at a time, so the response must walk 401 → 403 → 400 → 400
          (checksum) → 404 → 201. Any implementation that validates the body
          before the role, or resolves foreign keys before checking the UPC
          checksum, reports the wrong error on the very first call.
        test_recipe:
          setup:
            - "One principal NWF exists (for the final success); the unknown-id probe is 00000000-0000-4000-8000-000000000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { principal_id: "00000000-0000-4000-8000-000000000000", upc: "011111000002", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: NOT_A_ROLE
              as_user_id: "u_ghost"
              captures: { e1: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "00000000-0000-4000-8000-000000000000", upc: "011111000002", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "00000000-0000-4000-8000-000000000000", upc: "011111000002", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { e3: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "00000000-0000-4000-8000-000000000000", upc: "011111000002", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { e4: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "00000000-0000-4000-8000-000000000000", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { e5: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { itm: $.data.id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "00000000-0000-4000-8000-000000000000", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e6: $.data.error_id }
          assert:
            - "Call 1 (unknown X-User-Role header) returns 401 ERR_UNAUTHENTICATED even though the role would also be forbidden, the body is missing description, the upc checksum is wrong and the principal does not exist"
            - "Call 2 returns 403 ERR_ROLE_FORBIDDEN — BrokerAdmin is not in POST /items' roles; body and lookup problems are still invisible"
            - "Call 3 returns 400 ERR_INVALID_REQUEST — the missing required description outranks both the checksum and the unknown principal"
            - "Call 4 returns 400 ERR_UPC_CHECK_DIGIT_INVALID — same priority band as shape, but now the only shape-level defect; the unknown principal is still not reported"
            - "Call 5 returns 404 ERR_PRINCIPAL_NOT_FOUND — the last remaining defect"
            - "Call 6 returns 201 and Item.${itm}.catalog_state == INCOMPLETE"
            - "Call 7 returns 404 ERR_RETAILER_NOT_FOUND, not 403 ERR_RETAILER_SCOPE_FORBIDDEN — existence (priority 4) is checked before retailer scope (priority 5) even though the caller's X-User-ID can never match a non-existent retailer"

      - name: review_calendar_shape_and_blackout_buffer_reject_overlapping_windows
        claim_type: temporal_validation
        grounds:
          - validations.v-review-calendar-shape
          - validations.v-review-blackout
          - errors.ERR_REVIEW_CALENDAR_INVALID
          - errors.ERR_REVIEW_BLACKOUT_CONFLICT
        distinguishing_aspect: |
          The blackout test is an interval-overlap test with a 14-day buffer added
          on BOTH sides of the existing window, and it is scoped per
          (retailer, category_code): a DAIRY review may sit inside a
          FROZEN_SNACKS blackout, while a FROZEN_SNACKS review starting exactly on
          review_window_end + 14 days is legal because the comparison is strict.
          Shape violations (start >= end, deadline >= start) are a different error
          at the same priority.
        test_recipe:
          setup:
            - "Retailer BIGMART with the default review_blackout_days 14; clock 2026-08-01; one existing FROZEN_SNACKS review over [2026-09-01, 2026-09-15) with deadline 2026-08-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev1: $.data.id }
          trigger:
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "BEVERAGE", review_window_start: "2026-11-15", review_window_end: "2026-11-01", submission_deadline: "2026-10-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e1: $.data.error_id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "BEVERAGE", review_window_start: "2026-11-01", review_window_end: "2026-11-15", submission_deadline: "2026-11-05T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e2: $.data.error_id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-20", review_window_end: "2026-09-25", submission_deadline: "2026-09-10T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e3: $.data.error_id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "DAIRY", review_window_start: "2026-09-20", review_window_end: "2026-09-25", submission_deadline: "2026-09-10T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev2: $.data.id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-29", review_window_end: "2026-10-10", submission_deadline: "2026-09-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev3: $.data.id }
          assert:
            - "Call 1 returns 409 ERR_REVIEW_CALENDAR_INVALID — review_window_start 2026-11-15 is not before review_window_end 2026-11-01"
            - "Call 2 returns 409 ERR_REVIEW_CALENDAR_INVALID — submission_deadline 2026-11-05 is not before review_window_start 2026-11-01"
            - "Call 3 returns 409 ERR_REVIEW_BLACKOUT_CONFLICT — 2026-09-20 < 2026-09-15 + 14 days (2026-09-29) and 2026-09-01 - 14 days (2026-08-18) < 2026-09-25, so the buffered windows intersect"
            - "Call 4 returns 201 (${rev2}) with the identical window — the blackout is scoped per (retailer_id, category_code) and DAIRY is a different category"
            - "Call 5 returns 201 (${rev3}) — 2026-09-29 is exactly review_window_end + review_blackout_days, and the comparison new.review_window_start < other.review_window_end + blackout is strict, so exact adjacency is legal"
            - "GET /category-reviews?retailer_id=${ret}&category_code=FROZEN_SNACKS returns total_count 2 (${rev1} and ${rev3}) in created_at ASC order"

      - name: aggregate_bounds_on_award_snapshots_and_claims_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.v-review-slots
          - validations.v-negotiation-bounds
          - validations.v-snapshot-sequence
          - validations.v-uniqueness
          - errors.ERR_REVIEW_SLOTS_EXCEEDED
          - errors.ERR_STORE_COUNT_EXCEEDS_CHAIN
          - errors.ERR_CLAIM_EXCEEDS_DEDUCTION
          - errors.ERR_PERIOD_OUT_OF_SEQUENCE
          - errors.ERR_REPORTED_EXCEEDS_AUTHORIZED
          - errors.ERR_DISTRIBUTION_EXCEEDS_REPORTED
          - errors.ERR_PERIOD_ALREADY_POSTED
          - errors.ERR_SNAPSHOT_NOT_LATEST
        distinguishing_aspect: |
          Every bound here is an aggregate over other rows rather than a field
          range: the award count against slots_remaining, the store count against
          the chain size, the nested chain
          distributed <= reported <= authorized, period_index against
          periods_reported, and reversal only of the highest live period. Two of
          them collide at priority 11, and §1.4's table order decides: a re-post
          of a live period reports ERR_PERIOD_ALREADY_POSTED (v-uniqueness is
          listed before v-snapshot-sequence), never ERR_PERIOD_OUT_OF_SEQUENCE.
        test_recipe:
          setup:
            - "Retailer BIGMART with total_store_count 1200; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement; two VALIDATED items I1 and I2."
