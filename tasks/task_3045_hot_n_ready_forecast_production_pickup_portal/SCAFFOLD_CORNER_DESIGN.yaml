  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: daypart_window_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_DAYPART_WINDOW_OVERLAP]
        distinguishing_aspect: "Second daypart whose [start,end) intersects an existing daypart's window in the same store day is rejected; a back-to-back daypart (start == existing end) is accepted (half-open)."
        test_recipe:
          setup:
            - "StoreDay 2026-10-18 with LUNCH 600-840"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-10-18" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
