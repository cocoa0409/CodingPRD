    claim_type: violation_to_error
    grounds:
    - validations[priority=10]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: The request omits the X-User-ID header entirely, so it is refused with ERR_UNAUTHENTICATED (401) ahead of every authorization, existence and body check.
    test_recipe:
      setup:
      - 'Empty database. The request carries X-User-Role: Negotiator but no X-User-ID header.'
      setup_api_calls: []
      trigger:
      - call: POST /short-sale/cases
        payload:
