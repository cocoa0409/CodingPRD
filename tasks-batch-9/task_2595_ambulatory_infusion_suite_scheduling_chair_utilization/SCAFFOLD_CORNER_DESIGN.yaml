          - errors[ERR_TEMPLATE_NOT_FOUND]
          - errors[ERR_APPOINTMENT_NOT_FOUND]
          - errors[ERR_AUTHORIZATION_NOT_FOUND]
          - errors[ERR_PREPARATION_NOT_FOUND]
          - errors[ERR_ADVERSE_EVENT_NOT_FOUND]
          - errors[ERR_LAB_RESULT_NOT_FOUND]
          - errors[ERR_REMINDER_NOT_FOUND]
        distinguishing_aspect: |
          The catalog is per-collection, not a single generic 404: the identical unknown id
          returns a DIFFERENT error_id on each collection, chosen by the addressed path and
          never by the id's shape. All ten calls run against a completely empty database, so
          nothing but the path can select the code.
        test_recipe:
          setup:
            - "Empty database — no fixtures at all. The id 99999999-9999-4999-8999-999999999999 exists nowhere."
          setup_api_calls: []
          trigger:
            - call: "GET /chairs/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Scheduler
              captures: { e_chair: $.data.error_id }
            - call: "GET /nurses/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Scheduler
              captures: { e_nurse: $.data.error_id }
            - call: "GET /treatment-plans/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Scheduler
              captures: { e_plan: $.data.error_id }
            - call: "GET /appointment-templates/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Scheduler
              captures: { e_template: $.data.error_id }
            - call: "GET /appointments/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Scheduler
              captures: { e_appointment: $.data.error_id }
            - call: "GET /authorization-requests/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: AuthorizationSpecialist
              captures: { e_auth: $.data.error_id }
            - call: "GET /drug-preparations/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Pharmacist
              captures: { e_prep: $.data.error_id }
            - call: "GET /adverse-events/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: MedicalDirector
              captures: { e_event: $.data.error_id }
            - call: "GET /lab-results/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Pharmacist
              captures: { e_lab: $.data.error_id }
            - call: "GET /reminder-contacts/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: Scheduler
              captures: { e_reminder: $.data.error_id }
          assert:
            - "Every call returns HTTP 404 with the envelope's data carrying error_id and message"
            - "${e_chair} == 'ERR_CHAIR_NOT_FOUND' and ${e_nurse} == 'ERR_NURSE_NOT_FOUND'"
            - "${e_plan} == 'ERR_PLAN_NOT_FOUND' and ${e_template} == 'ERR_TEMPLATE_NOT_FOUND'"
            - "${e_appointment} == 'ERR_APPOINTMENT_NOT_FOUND' and ${e_auth} == 'ERR_AUTHORIZATION_NOT_FOUND'"
            - "${e_prep} == 'ERR_PREPARATION_NOT_FOUND' and ${e_event} == 'ERR_ADVERSE_EVENT_NOT_FOUND'"
            - "${e_lab} == 'ERR_LAB_RESULT_NOT_FOUND' and ${e_reminder} == 'ERR_REMINDER_NOT_FOUND'"
            - "No two of the ten error_id values are equal — there is no shared generic 404 code"

      - name: a_missing_or_undeclared_role_header_is_unauthenticated_before_any_row_lookup
        claim_type: triggerable
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: |
          Priority 1 runs ahead of the 404 catalog and ahead of every business rule: a
          request with no X-User-Role header, and a request naming a role outside the six
          declared ones, both return 401 even though the addressed appointment id does not
          exist and the body would fail required-field validation. An implementation that
          resolves the path first answers 404 here.
        test_recipe:
          setup:
            - "Empty database. The two triggers deliberately omit the X-User-Role / X-User-ID headers and name an undeclared role respectively."
          setup_api_calls: []
          trigger:
            - call: "GET /appointments/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: NO_HEADERS_SENT
              captures: { e_missing: $.data.error_id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Radiologist
              captures: { e_undeclared: $.data.error_id }
          assert:
            - "First trigger is issued with neither X-User-Role nor X-User-ID present; HTTP status == 401 and ${e_missing} == 'ERR_UNAUTHENTICATED'"
            - "${e_missing} is NOT 'ERR_APPOINTMENT_NOT_FOUND' — priority 1 precedes the priority-20 lookup"
            - "Second trigger sends X-User-Role: Radiologist, which is not one of the six declared roles; HTTP status == 401 and ${e_undeclared} == 'ERR_UNAUTHENTICATED'"
            - "${e_undeclared} is NOT 'ERR_UNAUTHORIZED' — an undeclared role fails authentication, not authorization"
            - "GET /patients as Scheduler afterwards returns 0 rows — the refused POST wrote nothing"

      - name: a_retired_template_is_rejected_ahead_of_its_own_stale_pinned_version
        claim_type: triggerable
        grounds:
          - validations[priority 48]
          - validations[priority 64]
          - errors[ERR_TEMPLATE_RETIRED]
          - errors[ERR_TEMPLATE_VERSION_STALE]
          - endpoints[PATCH /appointment-templates/{id}]
        distinguishing_aspect: |
          Both template errors return 409 and both are driven by the same PATCH endpoint, so
          the pair only separates on the error_id. A re-snapshot bumps version 1 -> 2 and
          stales an appointment pinning 1; retiring bumps it again to 3, and a booking that
          pins the STALE version 1 against the RETIRED template must report
          ERR_TEMPLATE_RETIRED because priority 48 precedes 64. Booking with the current
          version against an ACTIVE template is accepted, so neither rule is a blanket veto.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One center, one chair, one nurse with acuity_capacity_points 12, the standing drug, one 70 kg patient with an ACTIVE 6-cycle plan."
            - "One MID template created at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 12, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id, tp1_v1: $.data.version, tp1_status: $.data.status }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE", template_version: 1 }
              as: Scheduler
              captures: { ap1: $.data.id, ap1_pinned: $.data.template_version_pinned }
          trigger:
            - call: "PATCH /appointment-templates/${tp1}"
              payload: { resnapshot: true }
              as: Pharmacist
              captures: { tp1_v2: $.data.version, tp1_still_active: $.data.status }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-17", requested_start_minute: 540, cycle_number: 2, booking_class: "ROUTINE", template_version: 1 }
              as: Scheduler
              captures: { e_stale: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-17", requested_start_minute: 540, cycle_number: 2, booking_class: "ROUTINE", template_version: 2 }
              as: Scheduler
              captures: { ap2: $.data.id, ap2_pinned: $.data.template_version_pinned }
            - call: "PATCH /appointment-templates/${tp1}"
              payload: { status: "RETIRED" }
              as: Scheduler
              captures: { tp1_v3: $.data.version, tp1_retired: $.data.status }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-24", requested_start_minute: 540, cycle_number: 3, booking_class: "ROUTINE", template_version: 1 }
              as: Scheduler
              captures: { e_retired: $.data.error_id }
          assert:
            - "${tp1_v1} == 1 and ${tp1_status} == 'ACTIVE' and ${ap1_pinned} == 1"
            - "${tp1_v2} == 2 and ${tp1_still_active} == 'ACTIVE' — a re-snapshot bumps the version without retiring"
            - "${e_stale} == 'ERR_TEMPLATE_VERSION_STALE' with HTTP 409"
            - "${ap2_pinned} == 2 — the accepted booking pins the current version"
            - "${tp1_v3} == 3 and ${tp1_retired} == 'RETIRED'"
            - "${e_retired} == 'ERR_TEMPLATE_RETIRED' with HTTP 409 — the pinned version 1 is stale too, but priority 48 wins over 64"
            - "GET /appointments filtered by template_id == ${tp1} returns exactly 2 rows (${ap1} and ${ap2})"
            - "Appointment.${ap1}.template_version_pinned is still 1 — a template PATCH does not rewrite already-booked visits"
            - "Nurse.${nr1}.assigned_acuity_points == 6 — the two accepted bookings only"

      - name: an_adjustment_that_would_drive_units_available_below_zero_is_rejected
        claim_type: triggerable
        grounds:
          - validations[priority 117]
          - errors[ERR_INSUFFICIENT_DRUG_UNITS]
          - endpoints[POST /drug-lots/{id}/adjustments]
          - state_machines[DrugLot].transitions[AVAILABLE -> DEPLETED]
        distinguishing_aspect: |
          The guard is on the RESULT of the arithmetic, not on the magnitude of units_delta:
          -6 against a 5-unit lot is refused while -5 is accepted and drives the lot to
          DEPLETED, and a positive +4 afterwards brings it back to AVAILABLE. The refusal
          must leave both units_received and version untouched, so the next adjustment reuses
          the same expected_drug_lot_version.
        test_recipe:
          setup:
            - "One drug and one lot of 5 units expiring 2026-12-01, nothing committed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-DEC", units_received: 5, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id, lot1_v1: $.data.version, lot1_avail: $.data.units_available }
          trigger:
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: -6, reason: "Physical count shrinkage", expected_drug_lot_version: "${lot1_v1}" }
              as: Pharmacist
              captures: { e_units: $.data.error_id }
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: -5, reason: "Physical count shrinkage", expected_drug_lot_version: "${lot1_v1}" }
              as: Pharmacist
              captures: { after_neg: $.data.units_available, status_neg: $.data.status, lot1_v2: $.data.version }
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: 4, reason: "Receipt correction", expected_drug_lot_version: "${lot1_v2}" }
              as: Pharmacist
              captures: { after_pos: $.data.units_available, status_pos: $.data.status, lot1_v3: $.data.version }
          assert:
            - "${lot1_avail} == 5 and ${lot1_v1} == 1 at creation"
            - "${e_units} == 'ERR_INSUFFICIENT_DRUG_UNITS' with HTTP 422 — the result -1 is what fails, not the delta's size"
            - "DrugLot.${lot1}.units_received is still 5 and version is still ${lot1_v1} after the refusal"
            - "${after_neg} == 0 and ${status_neg} == 'DEPLETED' and ${lot1_v2} == 2 — the boundary value 0 is accepted"
            - "${after_pos} == 4 and ${status_pos} == 'AVAILABLE' and ${lot1_v3} == 3 — DEPLETED returns to AVAILABLE once units exist and the lot is unexpired"
            - "DrugLot.${lot1}.units_committed == 0 and units_administered == 0 and units_wasted == 0 throughout"

      - name: a_service_date_earlier_than_the_clocks_date_is_rejected
        claim_type: triggerable
        grounds:
          - validations[priority 90]
          - errors[ERR_SERVICE_DATE_IN_PAST]
        distinguishing_aspect: |
          The comparison is on the calendar DATE, not the instant: with the clock at
          2026-08-10T12:00:00Z a booking for 2026-08-09 is refused, while 2026-08-11 at
          minute 540 is accepted even though that minute-of-day has already passed today.
          Equality with the clock's own date is not what this rule refuses — that case
          belongs to the same-day add-on rules at priority 91.
