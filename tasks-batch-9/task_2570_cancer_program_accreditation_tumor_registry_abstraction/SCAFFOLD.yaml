scenario: |
  Generate task harder than expert level!

  2570. Cancer Program Accreditation & Tumor Registry Abstraction (Commission on Cancer accredited program):
  case identification through casefinding lists and reportable-case rules, abstraction of stage, treatment and
  outcome data within timeliness standards, follow-up requirement maintenance and lost-to-follow-up rates,
  standard compliance evidence for multidisciplinary conference frequency and attendance, quality measure
  performance reporting and improvement projects, state central registry submission with edit resolution,
  survey preparation, deficiency response and accreditation cycle, registry backlog and abstractor
  productivity/quality audits
domain_name: cancer-program-accreditation-tumor-registry
api_prefix: "/cancer-registry"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  entity_topology_note: |
    Peer entities linked by explicit foreign keys; URL paths are one-level collections
    (`/cancer-registry/<collection>/{id}`) with action sub-paths. Children are discovered
    through filtered list endpoints (`?<fk_field>=`) or sub-resource reads, never through
    deep nesting of two owner ids.
  state_machine_shape: cyclic
  state_machine_shape_note: |
    Cyclic is the dominant shape (Abstraction rework loop DRAFT -> SUBMITTED_FOR_QA ->
    REWORK_REQUIRED -> DRAFT with a hard loop cap; RegistrySubmission edit-resolution loop
    TRANSMITTED -> EDITS_RETURNED -> TRANSMITTED; Deficiency response loop; CancerProgram
    PROBATION -> ACCREDITED re-entry). TumorCase additionally carries two parallel state
    dimensions (`case_state` x `submission_state`) that advance independently, and QaAudit
    branches OPEN -> {CLOSED_PASS, CLOSED_FAIL} with divergent side-effect sets.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  relationship_patterns_note: |
    many_to_many: SubmissionItem is the junction between RegistrySubmission and TumorCase.
    self_referential: Abstraction.supersedes_abstraction_id -> Abstraction.id.
    cross_aggregate: QaAudit scores an Abstraction but mutates Abstractor ledgers and,
    by cascade, TumorCase and CancerProgram.
  role_model: segregation_of_duties
  role_model_note: |
    RegistryAbstractor and QaReviewer are both backed by the Abstractor entity: the QA
    decision on an abstraction, and the re-abstraction audit of it, may not be performed by
    the abstractor who produced it (ERR_SEGREGATION_OF_DUTIES_VIOLATION). Deficiency response
    (AccreditationCoordinator) and deficiency review (CoCSurveyor) are likewise split.
  consistency_model: immediate
  difficulty_level: expert_plus
  difficulty_note: |
    Density: 13 entities, 10 state machines (2 of them parallel dimensions on one row),
    24 calculations of which 3 carry divergent variants, 2 OCC races, 65 endpoints,
    79 validation rules, 77 error codes, 7 roles.
    The hard part is not the surface count but the coupling: registry_posture is derived from four
    different aggregates and gates writes on three other entities, and a single QA decision or
    deficiency review propagates four links deep.

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: CancerProgram
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Accredited cancer program name
      - name: coc_program_id
        type: string
        source: input
        description: Commission on Cancer program identifier
        constraints: unique across all CancerProgram rows
      - name: annual_analytic_caseload
        type: integer
        source: input
        description: Annual analytic caseload used to select the required conference frequency
        constraints: ">= 0"
      - name: reference_year
        type: integer
        source: input
        description: Earliest reportable diagnosis year; entries diagnosed before Jan 1 of this year are not reportable
      - name: timeliness_standard_days
        type: integer
        source: input
        description: Days after first_contact_date within which an abstract must be completed
        default: 180
        constraints: ">= 30"
      - name: accreditation_state
        type: enum
        source: system
        description: Accreditation cycle state (see §1.2 CancerProgram.accreditation_state)
        default: ACCREDITED
        constraints: "ACCREDITED | SURVEY_SCHEDULED | DEFICIENCY_RESPONSE | PROBATION | WITHDRAWN"
      - name: survey_date
        type: datetime
        source: system
        description: Scheduled on-site survey instant; null until a survey is scheduled
        default: null
      - name: survey_year
        type: integer
        source: system
        description: Calendar year of the most recently completed survey; null before the first survey
        default: null
      - name: next_survey_due_year
        type: integer
        source: system
        description: survey_year + 3, set when a survey completes
        default: null
      - name: registry_posture
        type: enum
        source: computed
        description: Derived operating posture that gates case assignment and submission transmit (calculations.registry_posture)
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: identified_case_count
        type: integer
        source: computed
        description: Count of TumorCase rows for this program whose case_state != VOIDED
        default: 0
      - name: open_backlog_count
        type: integer
        source: computed
        description: Count of TumorCase rows with case_state IN {IDENTIFIED, ASSIGNED, IN_ABSTRACTION, QA_PENDING, REWORK_PENDING}
        default: 0
      - name: overdue_backlog_count
        type: integer
        source: computed
        description: Subset of open_backlog_count whose timeliness_status == LATE
        default: 0
      - name: follow_up_rate_coc_pct
        type: number
        source: computed
        description: Commission-on-Cancer variant follow-up rate (calculations.follow_up_rate, variant coc_five_year)
        default: 100.0
      - name: follow_up_rate_state_pct
        type: number
        source: computed
        description: State-central-registry variant follow-up rate (calculations.follow_up_rate, variant state_central_all_years)
        default: 100.0
      - name: lost_to_follow_up_pct
        type: number
        source: computed
        description: Percent of the CoC denominator whose last_contact_date is older than LOST_CONTACT_DAYS
        default: 0.0
      - name: credited_sessions_12mo
        type: integer
        source: computed
        description: ConferenceSession rows with session_state == CREDITED inside the rolling 12-calendar-month window
        default: 0
      - name: required_sessions_12mo
        type: integer
        source: computed
        description: 12 * required_sessions_per_month (calculations.conference_compliance)
        default: 12
      - name: conference_frequency_compliant
        type: boolean
        source: computed
        description: credited_sessions_12mo >= required_sessions_12mo
        default: false
      - name: coordinator_attendance_compliant
        type: boolean
        source: computed
        description: Every required-coordinator attendee_ref attended >= COORDINATOR_MIN_ATTENDANCE_PCT of credited sessions in the window
        default: false
      - name: open_critical_deficiency_count
        type: integer
        source: computed
        description: Deficiency rows with severity == CRITICAL and deficiency_state IN {CITED, RESPONSE_SUBMITTED, RESPONSE_REJECTED}
        default: 0

  - name: Abstractor
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CancerProgram.id
      - name: name
        type: string
        source: input
        description: Registrar full name
      - name: credential
        type: enum
        source: input
        description: Registry credential; CTR is required for assignment while posture is RESTRICTED
        constraints: "CTR | NON_CTR | TRAINEE"
      - name: productivity_target_cases_per_day
        type: number
        source: input
        description: Contracted abstraction throughput target, cases per working day
        constraints: "> 0"
      - name: certification_expires_on
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) on which the registrar credential lapses
      - name: employment_status
        type: enum
        source: system
        description: Staffing status; only ACTIVE registrars may be assigned or abstract
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED_FROM_ABSTRACTING | LOA | TERMINATED"
      - name: assigned_open_case_count
        type: integer
        source: computed
        description: Count of TumorCase rows whose assigned_abstractor_id is this abstractor and case_state IN {ASSIGNED, IN_ABSTRACTION, QA_PENDING, REWORK_PENDING}
        default: 0
      - name: lifetime_discrepancy_points
        type: integer
        source: computed
        description: Running ledger of weighted_error_score over QaAudit rows with audit_state IN {CLOSED_PASS, CLOSED_FAIL}; a voided audit subtracts its own contribution
        default: 0
      - name: audit_fail_streak
        type: integer
        source: computed
        description: Consecutive non-PASS audit verdicts; reaching AUDIT_FAIL_STREAK_SUSPEND suspends the registrar
        default: 0
      - name: quality_score_rolling_90d
        type: number
        source: computed
        description: Weighted 90-day audit quality score (calculations.abstractor_quality_score, variant rolling_90d_weighted)
        default: 100.0
      - name: quality_score_cumulative
        type: number
        source: computed
        description: Unweighted all-time audit quality score (calculations.abstractor_quality_score, variant cumulative_unweighted)
        default: 100.0
      - name: completed_cases_30d
        type: integer
        source: computed
        description: Abstraction rows by this abstractor with abstraction_state == APPROVED and approved_at inside the trailing 30-day window
        default: 0
      - name: productivity_rate_per_day
        type: number
        source: computed
        description: completed_cases_30d / WORKING_DAYS_PER_30 (calculations.abstractor_productivity)
        default: 0.0
      - name: productivity_status
        type: enum
        source: computed
        description: MEETS when productivity_rate_per_day >= productivity_target_cases_per_day, else BELOW
        default: BELOW
        constraints: "MEETS | BELOW"

  - name: CasefindingSource
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CancerProgram.id
      - name: source_type
        type: enum
        source: input
        description: Casefinding list this source represents
        constraints: "PATHOLOGY | DISEASE_INDEX | RADIATION_ONCOLOGY | MEDICAL_ONCOLOGY | AUTOPSY"
      - name: expected_monthly_volume
        type: integer
        source: input
        description: Expected casefinding line items per calendar month; 0 means completeness is reported as 100.0
        constraints: ">= 0"
      - name: entries_this_month
        type: integer
        source: computed
        description: CasefindingEntry rows on this source whose accession_date falls in the logical clock's current calendar month
        default: 0
      - name: casefinding_completeness_pct
        type: number
        source: computed
        description: min(entries_this_month / expected_monthly_volume, 1.0) * 100 rounded to 1 decimal (calculations.casefinding_completeness)
        default: 0.0
      - name: last_reconciled_through
        type: string
        source: system
        description: ISO date of the last reconciliation sweep; set by the clock checkpoint
        default: null

  - name: CasefindingEntry
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: source_id
        type: string
        source: input
        description: FK -> CasefindingSource.id
      - name: program_id
        type: string
        source: system
        description: FK -> CancerProgram.id; copied from the source at creation
      - name: patient_mrn
        type: string
        source: input
        description: Medical record number of the candidate patient
      - name: accession_date
        type: string
        source: input
        description: ISO date the line item appeared on the casefinding list
      - name: primary_site_code
        type: string
        source: input
        description: "ICD-O-3 topography code, e.g. C50.9, C53.9, C71.9, C44.5"
      - name: histology_code
        type: string
        source: input
        description: "ICD-O-3 morphology code with behavior suffix, e.g. 8500/3"
      - name: behavior_code
        type: enum
        source: input
        description: ICD-O-3 behavior of the neoplasm
        constraints: "BENIGN_0 | BORDERLINE_1 | IN_SITU_2 | MALIGNANT_3"
      - name: diagnosis_date
        type: string
        source: input
        description: ISO date of diagnosis; must not be after the logical clock date
      - name: first_contact_date
        type: string
        source: input
        description: ISO date of first contact at this facility; must be >= diagnosis_date
      - name: diagnosed_at_facility
        type: boolean
        source: input
        description: True when the diagnosis was made at the accredited facility
      - name: first_treatment_at_facility
        type: boolean
        source: input
        description: True when all or part of the first course of treatment was given at the accredited facility
      - name: ambiguous_terminology_flag
        type: boolean
        source: input
        description: True when the pathology text uses ambiguous terminology and needs registrar judgement
        default: false
      - name: referral_lag_days
        type: integer
        source: computed
        description: first_contact_date - diagnosis_date in whole days
        default: 0
      - name: class_of_case_code
        type: enum
        source: computed
        description: Class of case assigned by calculations.class_of_case_determination
        constraints: "CLASS_00 | CLASS_10 | CLASS_20 | CLASS_31 | CLASS_40"
      - name: analytic_flag
        type: boolean
        source: computed
        description: True when class_of_case_code IN {CLASS_00, CLASS_10, CLASS_20}
      - name: suggested_reportability
        type: enum
        source: computed
        description: Rule-engine reportability suggestion (calculations.reportability_determination)
        constraints: "REPORTABLE | NON_REPORTABLE"
      - name: suggested_reason_code
        type: string
        source: computed
        description: "Machine reason for the suggestion, exactly one of BEFORE_REFERENCE_YEAR, SKIN_SQUAMOUS_BASAL_EXCLUDED, CERVIX_IN_SITU_EXCLUDED, SEER_REPORTABLE_BEHAVIOR, CNS_BENIGN_REPORTABLE, BENIGN_NON_CNS (calculations.reportability_determination)"
      - name: reportability_state
        type: enum
        source: system
        description: Registrar determination state (see §1.2 CasefindingEntry.reportability_state)
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | REPORTABLE | NON_REPORTABLE"
      - name: decision_reason_code
        type: string
        source: system
        description: reason_code supplied with the reportability decision; null while PENDING_REVIEW
        default: null
      - name: override_reason_code
        type: string
        source: system
        description: Required justification when the registrar decision contradicts suggested_reportability
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who recorded the last reportability decision
        default: null
      - name: created_case_id
        type: string
        source: computed
        description: FK -> TumorCase.id; set when the entry becomes REPORTABLE, cleared to null when the created case is VOIDED by a reopen
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times this entry has been reopened to PENDING_REVIEW
        default: 0

  - name: TumorCase
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: entry_id
        type: string
        source: system
        description: FK -> CasefindingEntry.id; the reportable entry this case was minted from
      - name: program_id
        type: string
        source: system
        description: FK -> CancerProgram.id
      - name: assigned_abstractor_id
        type: string
        source: system
        description: FK -> Abstractor.id; null while unassigned
        default: null
      - name: patient_mrn
        type: string
        source: system
        description: Copied from the casefinding entry
      - name: accession_number
        type: string
        source: system
        description: "Registry accession number minted as <diagnosis_year>-<zero-padded 5-digit sequence within program+year>, e.g. 2026-00001"
        constraints: unique per (program_id, diagnosis year)
      - name: sequence_number
        type: integer
        source: system
        description: Tumor sequence for this patient inside the program; 1 + count of non-VOIDED cases with the same patient_mrn
        default: 1
      - name: class_of_case_code
        type: enum
        source: system
        description: Copied from the entry at creation
        constraints: "CLASS_00 | CLASS_10 | CLASS_20 | CLASS_31 | CLASS_40"
      - name: analytic_flag
        type: boolean
        source: system
        description: Copied from the entry at creation
      - name: diagnosis_date
        type: string
        source: system
        description: Copied from the entry at creation
      - name: first_contact_date
        type: string
        source: system
        description: Copied from the entry at creation
      - name: abstract_due_date
        type: string
        source: computed
        description: first_contact_date + program.timeliness_standard_days days (calculations.abstract_timeliness)
      - name: completed_on
        type: string
        source: system
        description: Logical clock date on which the case reached COMPLETED; null otherwise
        default: null
      - name: case_state
        type: enum
        source: system
        description: Abstraction workflow dimension (see §1.2 TumorCase.case_state)
        default: IDENTIFIED
        constraints: "IDENTIFIED | ASSIGNED | IN_ABSTRACTION | QA_PENDING | REWORK_PENDING | COMPLETED | VOIDED"
      - name: submission_state
        type: enum
        source: system
        description: State-registry submission dimension, independent of case_state (see §1.2 TumorCase.submission_state)
        default: NOT_SUBMITTED
        constraints: "NOT_SUBMITTED | PENDING_SUBMISSION | SUBMITTED | EDIT_REJECTED | ACCEPTED"
      - name: timeliness_status
        type: enum
        source: computed
        description: Timeliness bucket from calculations.abstract_timeliness
        default: ON_TIME
        constraints: "ON_TIME | AT_RISK | LATE"
      - name: days_to_due
        type: integer
        source: computed
        description: abstract_due_date - logical clock date in whole days; negative once overdue
        default: 0
      - name: vital_status
        type: enum
        source: system
        description: Latest known vital status, advanced by follow-up contacts
        default: UNKNOWN
        constraints: "ALIVE | DEAD | UNKNOWN"
      - name: last_contact_date
        type: string
        source: system
        description: Date of the most recent qualifying follow-up contact; null until the first one
        default: null
      - name: follow_up_due_date
        type: string
        source: computed
        description: coalesce(last_contact_date, first_contact_date) + FOLLOW_UP_INTERVAL_DAYS
        default: null
      - name: follow_up_status
        type: enum
        source: computed
        description: Follow-up bucket from calculations.case_follow_up_status
        default: CURRENT
        constraints: "CURRENT | DELINQUENT | LOST | CLOSED_DECEASED | NOT_REQUIRED"

  - name: Abstraction
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> TumorCase.id
      - name: abstractor_id
        type: string
        source: system
        description: FK -> Abstractor.id; taken from the acting RegistryAbstractor's X-User-ID
      - name: supersedes_abstraction_id
        type: string
        source: input
        description: FK -> Abstraction.id; the abstraction this one replaces, required when the case is in REWORK_PENDING
        default: null
      - name: stage_source
        type: enum
        source: input
        description: Basis of the recorded stage
        constraints: "CLINICAL | PATHOLOGIC"
      - name: t_category
        type: string
        source: input
        description: "AJCC T category, e.g. T2; required when stage_source == PATHOLOGIC"
        default: null
      - name: n_category
        type: string
        source: input
        description: "AJCC N category, e.g. N0; required when stage_source == PATHOLOGIC"
        default: null
      - name: m_category
        type: string
        source: input
        description: "AJCC M category, e.g. M0; required when stage_source == PATHOLOGIC"
        default: null
      - name: stage_group
        type: enum
        source: input
        description: AJCC stage group; UNKNOWN costs completeness points
        constraints: "STAGE_0 | STAGE_I | STAGE_II | STAGE_III | STAGE_IV | OCCULT | UNKNOWN"
      - name: first_treatment_date
        type: string
        source: input
        description: ISO date first course of treatment started; null when no treatment was given
        default: null
      - name: treatment_modalities
        type: array
        source: input
        description: "First-course modalities; members of {SURGERY, RADIATION, CHEMOTHERAPY, HORMONE, IMMUNOTHERAPY, NO_TREATMENT}"
        default: []
      - name: radiation_start_date
        type: string
        source: input
        description: ISO date radiation began; required when treatment_modalities contains RADIATION
        default: null
      - name: diagnostic_confirmation_code
        type: string
        source: input
        description: Diagnostic confirmation code; required when the case class_of_case_code IN {CLASS_00, CLASS_10}
        default: null
      - name: outcome_status
        type: enum
        source: input
        description: Outcome at abstraction time; required for analytic cases
        default: null
        constraints: "ALIVE_NO_EVIDENCE | ALIVE_WITH_DISEASE | DEAD_OF_DISEASE | DEAD_OTHER_CAUSE | UNKNOWN"
      - name: last_contact_date
        type: string
        source: input
        description: Date of last patient contact recorded on the abstract; required for analytic cases
        default: null
      - name: missing_required_fields
        type: array
        source: computed
        description: Sorted list of required field names that are null or empty (calculations.abstraction_completeness)
        default: []
      - name: completeness_score
        type: integer
        source: computed
        description: 0-100 completeness score from calculations.abstraction_completeness; submit-qa requires >= COMPLETENESS_SUBMIT_MIN
        default: 0
      - name: abstraction_state
        type: enum
        source: system
        description: Abstraction QA state (see §1.2 Abstraction.abstraction_state)
        default: DRAFT
        constraints: "DRAFT | SUBMITTED_FOR_QA | REWORK_REQUIRED | APPROVED | REJECTED | SUPERSEDED"
      - name: rework_round
        type: integer
        source: computed
        description: Number of times this abstraction has re-entered DRAFT after a rework verdict; capped by REWORK_ROUND_MAX
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical clock instant of the most recent submit-qa
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: Logical clock instant the abstraction was approved
        default: null
      - name: qa_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the QaReviewer who recorded the last QA decision
        default: null

  - name: QaAudit
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: abstraction_id
        type: string
        source: input
        description: FK -> Abstraction.id; the abstraction being re-abstracted
      - name: auditor_id
        type: string
        source: input
        description: FK -> Abstractor.id; the registrar performing the re-abstraction audit
      - name: audit_type
        type: enum
        source: input
        description: Audit programme this audit belongs to
        constraints: "ROUTINE_10PCT | TARGETED | PRE_SURVEY"
      - name: window_start
        type: string
        source: input
        description: ISO date the auditor's re-abstraction window opens (inclusive)
      - name: window_end
        type: string
        source: input
        description: ISO date the auditor's re-abstraction window closes (inclusive); must be >= window_start
      - name: audited_field_count
        type: integer
        source: input
        description: Number of abstract fields re-abstracted; denominator of the quality score
        constraints: ">= 1"
      - name: minor_discrepancy_count
        type: integer
        source: system
        description: Minor discrepancies recorded at scoring
        default: 0
      - name: major_discrepancy_count
        type: integer
        source: system
        description: Major discrepancies recorded at scoring
        default: 0
      - name: critical_discrepancy_count
        type: integer
        source: system
        description: Critical discrepancies recorded at scoring
        default: 0
      - name: weighted_error_score
        type: integer
        source: computed
        description: CRITICAL_WEIGHT*critical + MAJOR_WEIGHT*major + MINOR_WEIGHT*minor (calculations.audit_weighted_error_score)
        default: 0
      - name: verdict
        type: enum
        source: computed
        description: Audit verdict derived at scoring time; null while OPEN
        default: null
        constraints: "PASS | MINOR_FAIL | CRITICAL_FAIL"
      - name: audit_state
        type: enum
        source: system
        description: Audit lifecycle state (see §1.2 QaAudit.audit_state)
        default: OPEN
        constraints: "OPEN | CLOSED_PASS | CLOSED_FAIL | VOIDED"
      - name: scored_at
        type: datetime
        source: system
        description: Logical clock instant the audit was scored
        default: null
      - name: cascade_applied
        type: boolean
        source: computed
        description: True when the CRITICAL_FAIL branch forced the audited abstraction back into REWORK_REQUIRED
        default: false

  - name: FollowUpContact
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> TumorCase.id
      - name: contact_date
        type: string
        source: input
        description: ISO date of the contact attempt; must not be after the logical clock date
      - name: contact_method
        type: enum
        source: input
        description: How follow-up was attempted
        constraints: "CLINIC_VISIT | LETTER | PHONE | DEATH_CERTIFICATE | STATE_LINKAGE"
      - name: outcome
        type: enum
        source: input
        description: Result of the attempt
        constraints: "CONTACT_MADE | NO_RESPONSE | DECEASED | MOVED_UNKNOWN"
      - name: vital_status_at_contact
        type: enum
        source: input
        description: Vital status observed at this contact
        constraints: "ALIVE | DEAD | UNKNOWN"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the registrar who recorded the contact (not a foreign key constraint)
      - name: counts_for_follow_up
        type: boolean
        source: computed
        description: True when outcome IN {CONTACT_MADE, DECEASED}; only such contacts advance TumorCase.last_contact_date
        default: false

  - name: ConferenceSession
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CancerProgram.id
      - name: start_at
        type: datetime
        source: input
        description: Session start instant (inclusive bound of the occupied interval)
      - name: end_at
        type: datetime
        source: input
        description: Session end instant (exclusive bound of the occupied interval); must be > start_at
      - name: required_disciplines
        type: array
        source: input
        description: "Disciplines that must be represented for quorum; members of {SURGERY, MEDICAL_ONCOLOGY, RADIATION_ONCOLOGY, PATHOLOGY, RADIOLOGY}"
      - name: attendances
        type: array
        source: input
        description: "Attendance records appended one per POST; each object is { attendee_ref, discipline, is_required_coordinator, attended_minutes }"
        default: []
      - name: cases_presented_count
        type: integer
        source: system
        description: Total cases presented, recorded when the session is held
        default: 0
      - name: prospective_case_count
        type: integer
        source: system
        description: Cases presented prospectively (before treatment), recorded when the session is held
        default: 0
      - name: prospective_case_ratio
        type: number
        source: computed
        description: prospective_case_count / cases_presented_count rounded to 3 decimals; 0.0 when cases_presented_count == 0
        default: 0.0
      - name: quorum_met
        type: boolean
        source: computed
        description: Quorum result from calculations.conference_quorum
        default: false
      - name: session_state
        type: enum
        source: system
        description: Session lifecycle state (see §1.2 ConferenceSession.session_state)
        default: SCHEDULED
        constraints: "SCHEDULED | HELD | CREDITED | NOT_CREDITED"
      - name: credited_on
        type: string
        source: system
        description: Logical clock date the session was credited toward the frequency standard
        default: null

  - name: RegistrySubmission
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CancerProgram.id
      - name: period_start
        type: string
        source: input
        description: ISO date, inclusive first day of the reporting period
      - name: period_end
        type: string
        source: input
        description: ISO date, inclusive last day of the reporting period; must be >= period_start
      - name: deadline_date
        type: string
        source: input
        description: ISO date by which the batch must be transmitted to the state central registry
      - name: submission_state
        type: enum
        source: system
        description: Submission lifecycle state (see §1.2 RegistrySubmission.submission_state)
        default: DRAFT
        constraints: "DRAFT | HOLD | TRANSMITTED | EDITS_RETURNED | ACCEPTED"
      - name: total_case_count
        type: integer
        source: computed
        description: Count of SubmissionItem rows on this submission
        default: 0
      - name: accepted_item_count
        type: integer
        source: computed
        description: Count of SubmissionItem rows with edit_status == ACCEPTED
        default: 0
      - name: failed_item_count
        type: integer
        source: computed
        description: Count of SubmissionItem rows with edit_status == EDIT_FAILED
        default: 0
      - name: edit_error_codes
        type: array
        source: computed
        description: Sorted distinct union of edit_codes across all items, recomputed on every edit-results call
        default: []
      - name: resubmission_round
        type: integer
        source: computed
        description: Number of retransmits; capped by RESUBMISSION_ROUND_MAX
        default: 0
      - name: transmitted_at
        type: datetime
        source: system
        description: Logical clock instant of the most recent transmit or retransmit
        default: null
      - name: late_case_count
        type: integer
        source: computed
        description: Items whose case completed_on is after the case abstract_due_date (calculations.submission_assessment)
        default: 0
      - name: relief_pct
        type: number
        source: computed
        description: Volume relief fraction selected from the pre-relief subtotal tier
        default: 0.0
      - name: assessment_due_cents
        type: integer
        source: computed
        description: Late-submission assessment in cents (calculations.submission_assessment)
        default: 0
      - name: assessment_paid_cents
        type: integer
        source: computed
        description: Cumulative assessment payments recorded against this submission
        default: 0
      - name: pre_hold_state
        type: enum
        source: system
        description: State to restore when a posture freeze is lifted; only set while submission_state == HOLD
        default: null
        constraints: "DRAFT"

  - name: SubmissionItem
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: submission_id
        type: string
        source: system
        description: FK -> RegistrySubmission.id
      - name: case_id
        type: string
        source: input
        description: FK -> TumorCase.id
      - name: edit_status
        type: enum
        source: system
        description: Per-record edit outcome returned by the state central registry
        default: PENDING
        constraints: "PENDING | ACCEPTED | EDIT_FAILED | RESOLVED"
      - name: edit_codes
        type: array
        source: system
        description: "State registry edit codes returned for this record, e.g. [\"IF25\", \"IF32\"]"
        default: []
      - name: resolution_note
        type: string
        source: system
        description: Registrar note recorded when an EDIT_FAILED item is resolved
        default: null

  - name: Deficiency
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CancerProgram.id
      - name: standard_code
        type: string
        source: input
        description: "Commission on Cancer standard cited, e.g. STD 6.1"
      - name: severity
        type: enum
        source: input
        description: Deficiency severity; drives the response window length
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: cited_on
        type: string
        source: input
        description: ISO date the deficiency was cited; must not be after the logical clock date
      - name: response_due_date
        type: string
        source: computed
        description: cited_on + response window days by severity (calculations.deficiency_response_window)
      - name: deficiency_state
        type: enum
        source: system
        description: Deficiency response state (see §1.2 Deficiency.deficiency_state)
        default: CITED
        constraints: "CITED | RESPONSE_SUBMITTED | RESPONSE_REJECTED | RESOLVED | ESCALATED"
      - name: escalation_count
        type: integer
        source: computed
        description: Number of rejected responses; reaching DEFICIENCY_ESCALATION_MAX escalates the deficiency
        default: 0
      - name: response_narrative
        type: string
        source: system
        description: Most recent corrective-action narrative
        default: null
      - name: evidence_reference
        type: string
        source: system
        description: Pointer to the compliance evidence supplied with the response
        default: null
      - name: reviewer_notes
        type: string
        source: system
        description: Surveyor notes recorded on the last response review
        default: null
      - name: source_measure_id
        type: string
        source: system
        description: FK -> QualityMeasure.id; set when the deficiency was auto-cited by a missed improvement project
        default: null

  - name: QualityMeasure
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CancerProgram.id
      - name: measure_code
        type: string
        source: input
        description: "Quality measure identifier, e.g. BCSRT, MASTRT, nBx"
      - name: measurement_year
        type: integer
        source: input
        description: Performance year the measure covers
      - name: threshold_pct
        type: number
        source: input
        description: Accountability threshold percent the stratified rate must reach
        constraints: "0.0 <= threshold_pct <= 100.0"
      - name: strata
        type: array
        source: input
        description: "Stage strata; each object is { stage_group, eligible_case_count, compliant_case_count }"
      - name: included_strata_count
        type: integer
        source: computed
        description: Number of strata with eligible_case_count > 0; strata with zero eligible cases are excluded from the mean
        default: 0
      - name: performance_rate_pct
        type: number
        source: computed
        description: Stratified performance rate (calculations.quality_measure_performance, round-per-stratum-then-average)
        default: 0.0
      - name: pooled_rate_pct
        type: number
        source: computed
        description: Pooled numerator/denominator rate, reported for contrast and never used for the threshold test
        default: 0.0
      - name: performance_state
        type: enum
        source: computed
        description: Threshold verdict from calculations.quality_measure_performance
        default: NOT_EVALUATED
        constraints: "NOT_EVALUATED | UNDER_THRESHOLD | MEETS | EXCEEDS"
      - name: measure_state
        type: enum
        source: system
        description: Measure and improvement-project state (see §1.2 QualityMeasure.measure_state)
        default: DRAFT
        constraints: "DRAFT | MEASURED | PROJECT_REQUIRED | PROJECT_ACTIVE | PROJECT_CLOSED_ACHIEVED | PROJECT_CLOSED_MISSED"
      - name: project_title
        type: string
        source: system
        description: Improvement project title, set when the project is opened
        default: null
      - name: target_rate_pct
        type: number
        source: system
        description: Improvement project target rate
        default: null
      - name: final_rate_pct
        type: number
        source: system
        description: Rate reported at project close; decides ACHIEVED vs MISSED
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: CasefindingEntry
    state_field: reportability_state
    shape: branching_with_cycle
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: REPORTABLE
        trigger: "POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision with decision=REPORTABLE"
        actor: RegistryManager
        preconditions:
          - "entry.reportability_state == PENDING_REVIEW else ERR_ENTRY_NOT_PENDING_REVIEW"
          - "entry.diagnosis_date >= January 1 of program.reference_year else ERR_DIAGNOSIS_BEFORE_REFERENCE_YEAR"
          - "if entry.suggested_reportability == NON_REPORTABLE then override_reason_code is present else ERR_REPORTABILITY_OVERRIDE_REASON_REQUIRED"
          - "program.accreditation_state != WITHDRAWN else ERR_PROGRAM_STATE_INVALID"
        side_effects:
          - "entry.decision_reason_code = reason_code; entry.decided_by_user_id = X-User-ID"
          - "creates TumorCase with case_state=IDENTIFIED, submission_state=NOT_SUBMITTED, entry_id=entry.id, program_id=entry.program_id, patient_mrn/class_of_case_code/analytic_flag/diagnosis_date/first_contact_date copied from the entry"
          - "TumorCase.sequence_number = 1 + count(TumorCase where program_id = entry.program_id and patient_mrn = entry.patient_mrn and case_state != VOIDED)"
          - "TumorCase.accession_number minted as <diagnosis year>-<5-digit zero-padded (1 + count of TumorCase in the same program with the same diagnosis year))>"
          - "TumorCase.abstract_due_date computed via calculations.abstract_timeliness; timeliness_status and days_to_due computed"
          - "entry.created_case_id = the new TumorCase.id"
          - "program.identified_case_count += 1; program.open_backlog_count and overdue_backlog_count recomputed"
          - "program.registry_posture recomputed via calculations.registry_posture; if it becomes FROZEN every RegistrySubmission of the program in DRAFT moves to HOLD with pre_hold_state=DRAFT"
        note: "Cascade origin: entry decision -> case creation -> program backlog aggregates -> posture -> submission HOLD."
      - from: PENDING_REVIEW
        to: NON_REPORTABLE
        trigger: "POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision with decision=NON_REPORTABLE"
        actor: RegistryManager
        preconditions:
          - "entry.reportability_state == PENDING_REVIEW else ERR_ENTRY_NOT_PENDING_REVIEW"
          - "if entry.suggested_reportability == REPORTABLE then override_reason_code is present else ERR_REPORTABILITY_OVERRIDE_REASON_REQUIRED"
        side_effects:
          - "entry.decision_reason_code = reason_code; entry.decided_by_user_id = X-User-ID"
          - "no TumorCase is created; entry.created_case_id stays null"
      - from: REPORTABLE
        to: PENDING_REVIEW
        trigger: "POST /cancer-registry/casefinding-entries/{entryId}/reopen"
        actor: RegistryManager
        preconditions:
          - "entry.reportability_state IN {REPORTABLE, NON_REPORTABLE} else ERR_ENTRY_NOT_REOPENABLE"
          - "the linked TumorCase (entry.created_case_id) has case_state IN {IDENTIFIED, ASSIGNED} else ERR_ENTRY_NOT_REOPENABLE"
        side_effects:
          - "linked TumorCase.case_state -> VOIDED (compensating void of the identification)"
          - "because the case was voided, if it had been ASSIGNED its abstractor.assigned_open_case_count -= 1 and assigned_abstractor_id -> null"
          - "because the case was voided, program.identified_case_count -= 1 and open_backlog_count / overdue_backlog_count are recomputed"
          - "because the program aggregates changed, program.registry_posture is recomputed; leaving FROZEN restores every RegistrySubmission in HOLD to its pre_hold_state"
          - "entry.created_case_id -> null; entry.reopen_count += 1; entry.decision_reason_code -> null; entry.override_reason_code -> null"
        note: "Depth-4 compensating cascade; the reportable-case parity invariant of calculations.reportable_case_parity must hold afterwards."
      - from: NON_REPORTABLE
        to: PENDING_REVIEW
        trigger: "POST /cancer-registry/casefinding-entries/{entryId}/reopen"
        actor: RegistryManager
        preconditions:
          - "entry.reportability_state == NON_REPORTABLE else ERR_ENTRY_NOT_REOPENABLE"
          - "entry.created_case_id is null (no case was ever minted)"
        side_effects:
          - "entry.reopen_count += 1; entry.decision_reason_code -> null; entry.override_reason_code -> null"
          - "no case, program or posture change"

  - entity: TumorCase
    state_field: case_state
    shape: cyclic_parallel_dimension_1
    initial_state: IDENTIFIED
    terminal_states: [VOIDED]
    note: "Dimension 1 of two independent dimensions on the same row; submission_state (dimension 2) advances without regard to case_state once the case has been COMPLETED once."
    transitions:
      - from: IDENTIFIED
        to: ASSIGNED
        trigger: "POST /cancer-registry/cases/{caseId}/assign"
        actor: RegistryManager
        preconditions:
          - "case.case_state == IDENTIFIED else ERR_CASE_NOT_ASSIGNABLE"
          - "program.registry_posture != FROZEN else ERR_REGISTRY_FROZEN"
          - "if program.registry_posture == RESTRICTED then abstractor.credential == CTR else ERR_RESTRICTED_REQUIRES_CTR"
          - "abstractor.employment_status == ACTIVE else ERR_ABSTRACTOR_NOT_ACTIVE"
          - "abstractor.program_id == case.program_id else ERR_ABSTRACTOR_PROGRAM_MISMATCH"
          - "abstractor.assigned_open_case_count < capacity_cap (calculations.abstractor_capacity_cap) else ERR_ABSTRACTOR_CAPACITY_EXCEEDED"
        side_effects:
          - "case.assigned_abstractor_id = abstractor_id; case.version += 1"
          - "abstractor.assigned_open_case_count += 1 (workload ledger, calculations.workload_conservation)"
      - from: ASSIGNED
        to: IDENTIFIED
        trigger: "POST /cancer-registry/cases/{caseId}/unassign"
        actor: RegistryManager
        preconditions:
          - "case.case_state == ASSIGNED else ERR_CASE_NOT_ASSIGNED"
        side_effects:
          - "abstractor.assigned_open_case_count -= 1 (compensating action of assign; calculations.workload_conservation must balance)"
          - "case.assigned_abstractor_id -> null; case.version += 1"
      - from: ASSIGNED
        to: IN_ABSTRACTION
        trigger: "POST /cancer-registry/abstractions"
        actor: RegistryAbstractor
        preconditions:
          - "case.case_state IN {ASSIGNED, REWORK_PENDING} else ERR_CASE_NOT_ABSTRACTABLE"
          - "payload expected_case_version == case.version else ERR_STALE_CASE_VERSION (§1.2.1 abstraction-create-stale-case)"
          - "X-User-ID == case.assigned_abstractor_id else ERR_NOT_ASSIGNED_ABSTRACTOR"
          - "abstractor.employment_status == ACTIVE else ERR_ABSTRACTOR_NOT_ACTIVE"
          - "abstractor.certification_expires_on >= logical clock date else ERR_ABSTRACTOR_CERTIFICATION_EXPIRED"
          - "if case.case_state == REWORK_PENDING then supersedes_abstraction_id is present else ERR_SUPERSEDE_TARGET_REQUIRED"
        side_effects:
          - "creates Abstraction in DRAFT with abstractor_id = X-User-ID; missing_required_fields and completeness_score computed via calculations.abstraction_completeness"
          - "case.version += 1 (advances the OCC parent version)"
      - from: REWORK_PENDING
        to: IN_ABSTRACTION
        trigger: "POST /cancer-registry/abstractions with supersedes_abstraction_id set"
        actor: RegistryAbstractor
        preconditions:
          - "case.case_state == REWORK_PENDING else ERR_CASE_NOT_ABSTRACTABLE"
          - "payload expected_case_version == case.version else ERR_STALE_CASE_VERSION"
          - "supersedes_abstraction_id references an Abstraction on this case with abstraction_state == REWORK_REQUIRED else ERR_SUPERSEDE_TARGET_INVALID"
        side_effects:
          - "creates the superseding Abstraction in DRAFT"
          - "because a superseding abstraction now exists, the superseded Abstraction.abstraction_state -> SUPERSEDED"
          - "case.version += 1"
      - from: IN_ABSTRACTION
        to: QA_PENDING
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/submit-qa"
        actor: RegistryAbstractor
        preconditions:
          - "abstraction.abstraction_state == DRAFT else ERR_ABSTRACTION_NOT_DRAFT"
          - "X-User-ID == abstraction.abstractor_id else ERR_NOT_ASSIGNED_ABSTRACTOR"
          - "abstraction.completeness_score >= COMPLETENESS_SUBMIT_MIN and abstraction.missing_required_fields is empty else ERR_ABSTRACTION_INCOMPLETE"
        side_effects:
          - "abstraction.abstraction_state -> SUBMITTED_FOR_QA; abstraction.submitted_at = logical clock"
          - "case.case_state -> QA_PENDING; case.version += 1"
      - from: QA_PENDING
        to: COMPLETED
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision with verdict=APPROVED"
        actor: QaReviewer
        preconditions:
          - "abstraction.abstraction_state == SUBMITTED_FOR_QA else ERR_ABSTRACTION_NOT_IN_QA"
          - "X-User-ID != abstraction.abstractor_id else ERR_SEGREGATION_OF_DUTIES_VIOLATION"
        side_effects:
          - "abstraction.abstraction_state -> APPROVED; approved_at = logical clock; qa_reviewer_user_id = X-User-ID"
          - "because the abstraction was approved, case.case_state -> COMPLETED and case.completed_on = logical clock date; timeliness_status finalised via calculations.abstract_timeliness"
          - "because the case left the open backlog, abstractor.assigned_open_case_count -= 1 and abstractor.completed_cases_30d / productivity_rate_per_day / productivity_status recomputed via calculations.abstractor_productivity"
          - "because the case left the open backlog, program.open_backlog_count and overdue_backlog_count are recomputed and program.registry_posture is recomputed"
          - "because the posture was recomputed, if it leaves FROZEN every RegistrySubmission in HOLD returns to pre_hold_state (DRAFT)"
        note: "Depth-4 transitive cascade A: qa-decision -> Abstraction.APPROVED -> TumorCase.COMPLETED -> program aggregates/posture -> RegistrySubmission HOLD->DRAFT."
      - from: QA_PENDING
        to: IN_ABSTRACTION
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision with verdict=REWORK_REQUIRED"
        actor: QaReviewer
        preconditions:
          - "abstraction.abstraction_state == SUBMITTED_FOR_QA else ERR_ABSTRACTION_NOT_IN_QA"
          - "X-User-ID != abstraction.abstractor_id else ERR_SEGREGATION_OF_DUTIES_VIOLATION"
        side_effects:
          - "abstraction.abstraction_state -> REWORK_REQUIRED; qa_reviewer_user_id = X-User-ID"
          - "case.case_state -> IN_ABSTRACTION; case.version += 1; assigned_abstractor_id unchanged"
      - from: QA_PENDING
        to: IDENTIFIED
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision with verdict=REJECTED"
        actor: QaReviewer
        preconditions:
          - "abstraction.abstraction_state == SUBMITTED_FOR_QA else ERR_ABSTRACTION_NOT_IN_QA"
          - "X-User-ID != abstraction.abstractor_id else ERR_SEGREGATION_OF_DUTIES_VIOLATION"
        side_effects:
          - "abstraction.abstraction_state -> REJECTED (terminal)"
          - "because the abstraction was rejected the case is returned to the pool: case.case_state -> IDENTIFIED, assigned_abstractor_id -> null, abstractor.assigned_open_case_count -= 1"
          - "case.version += 1"
      - from: COMPLETED
        to: REWORK_PENDING
        trigger: "POST /cancer-registry/qa-audits/{auditId}/score resolving to verdict CRITICAL_FAIL (system cascade)"
        actor: system
        preconditions:
          - "audited abstraction.abstraction_state == APPROVED"
          - "case.case_state == COMPLETED"
        side_effects:
          - "audit.cascade_applied = true; abstraction.abstraction_state -> REWORK_REQUIRED"
          - "because the abstraction returned to rework, case.case_state -> REWORK_PENDING, case.completed_on -> null, abstractor.assigned_open_case_count += 1"
          - "because the case re-entered the open backlog, program.open_backlog_count / overdue_backlog_count and registry_posture are recomputed; a posture that becomes FROZEN moves every DRAFT RegistrySubmission to HOLD"
          - "case.submission_state is NOT touched — the two dimensions are independent"
        note: "Depth-4 transitive cascade B origin (different trigger from cascade A)."
      - from: IDENTIFIED
        to: VOIDED
        trigger: "POST /cancer-registry/casefinding-entries/{entryId}/reopen (system cascade)"
        actor: system
        preconditions:
          - "case.case_state IN {IDENTIFIED, ASSIGNED}"
        side_effects:
          - "case.assigned_abstractor_id -> null; program aggregates and posture recomputed (see CasefindingEntry REPORTABLE -> PENDING_REVIEW)"
      - from: ASSIGNED
        to: VOIDED
        trigger: "POST /cancer-registry/casefinding-entries/{entryId}/reopen (system cascade)"
        actor: system
        preconditions:
          - "case.case_state == ASSIGNED"
        side_effects:
          - "abstractor.assigned_open_case_count -= 1; case.assigned_abstractor_id -> null; program aggregates and posture recomputed"
      - from: ASSIGNED
        to: IDENTIFIED
        trigger: "POST /cancer-registry/abstractors/{abstractorId}/employment-status with employment_status IN {TERMINATED, SUSPENDED_FROM_ABSTRACTING, LOA} (system cascade)"
        actor: system
        preconditions:
          - "case.assigned_abstractor_id == the abstractor whose status changed"
          - "case.case_state IN {ASSIGNED, IN_ABSTRACTION, QA_PENDING, REWORK_PENDING}"
        side_effects:
          - "case.assigned_abstractor_id -> null; case.case_state -> IDENTIFIED; case.version += 1"
          - "because every open case was released, abstractor.assigned_open_case_count -> 0"
          - "any Abstraction on the released case in DRAFT or REWORK_REQUIRED -> REJECTED"
          - "program.open_backlog_count and registry_posture recomputed"

  - entity: TumorCase
    state_field: submission_state
    shape: cyclic_parallel_dimension_2
    initial_state: NOT_SUBMITTED
    terminal_states: [ACCEPTED]
    note: |
      Dimension 2 on the same TumorCase row. It is driven exclusively by RegistrySubmission
      endpoints and never by abstraction QA; a case can be REWORK_PENDING (dimension 1) while
      still SUBMITTED or ACCEPTED (dimension 2), and vice versa.
    transitions:
      - from: NOT_SUBMITTED
        to: PENDING_SUBMISSION
        trigger: "POST /cancer-registry/submissions/{submissionId}/items"
        actor: RegistryManager
        preconditions:
          - "submission.submission_state == DRAFT else ERR_SUBMISSION_NOT_DRAFT"
          - "payload expected_submission_version == submission.version else ERR_STALE_SUBMISSION_VERSION (§1.2.1 submission-item-add-stale-submission)"
          - "case.case_state == COMPLETED else ERR_CASE_NOT_COMPLETED"
          - "case.submission_state == NOT_SUBMITTED else ERR_CASE_ALREADY_IN_SUBMISSION"
          - "case.program_id == submission.program_id else ERR_CASE_PROGRAM_MISMATCH"
        side_effects:
          - "creates SubmissionItem with edit_status=PENDING"
          - "submission.total_case_count recomputed; submission.version += 1"
          - "case.submission_state -> PENDING_SUBMISSION"
      - from: PENDING_SUBMISSION
        to: SUBMITTED
        trigger: "POST /cancer-registry/submissions/{submissionId}/transmit (system fan-out over items)"
        actor: system
        preconditions:
          - "submission.submission_state == DRAFT and passes every transmit validation"
        side_effects:
          - "every item's case.submission_state -> SUBMITTED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cancer-registry/submissions/{submissionId}/edit-results with this item's edit_status=ACCEPTED"
        actor: StateRegistryLiaison
        preconditions:
          - "submission.submission_state == TRANSMITTED else ERR_SUBMISSION_NOT_TRANSMITTED"
        side_effects:
          - "item.edit_status -> ACCEPTED; case.submission_state -> ACCEPTED (terminal for this dimension)"
      - from: SUBMITTED
        to: EDIT_REJECTED
        trigger: "POST /cancer-registry/submissions/{submissionId}/edit-results with this item's edit_status=EDIT_FAILED"
        actor: StateRegistryLiaison
        preconditions:
          - "submission.submission_state == TRANSMITTED else ERR_SUBMISSION_NOT_TRANSMITTED"
        side_effects:
          - "item.edit_status -> EDIT_FAILED with edit_codes recorded; case.submission_state -> EDIT_REJECTED"
      - from: EDIT_REJECTED
        to: SUBMITTED
        trigger: "POST /cancer-registry/submissions/{submissionId}/retransmit"
        actor: RegistryManager
        preconditions:
          - "submission.submission_state == EDITS_RETURNED else ERR_SUBMISSION_NOT_IN_EDIT_RESOLUTION"
          - "no SubmissionItem on the submission still has edit_status == EDIT_FAILED else ERR_UNRESOLVED_EDITS"
        side_effects:
          - "every item with edit_status == RESOLVED -> PENDING; the case.submission_state -> SUBMITTED"

  - entity: Abstraction
    state_field: abstraction_state
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED_FOR_QA
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/submit-qa"
        actor: RegistryAbstractor
        preconditions:
          - "abstraction.abstraction_state == DRAFT else ERR_ABSTRACTION_NOT_DRAFT"
          - "X-User-ID == abstraction.abstractor_id else ERR_NOT_ASSIGNED_ABSTRACTOR"
          - "abstraction.completeness_score >= COMPLETENESS_SUBMIT_MIN and abstraction.missing_required_fields is empty else ERR_ABSTRACTION_INCOMPLETE"
        side_effects:
          - "submitted_at = logical clock; case.case_state -> QA_PENDING; case.version += 1"
      - from: SUBMITTED_FOR_QA
        to: APPROVED
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision with verdict=APPROVED"
        actor: QaReviewer
        preconditions:
          - "abstraction.abstraction_state == SUBMITTED_FOR_QA else ERR_ABSTRACTION_NOT_IN_QA"
          - "X-User-ID != abstraction.abstractor_id else ERR_SEGREGATION_OF_DUTIES_VIOLATION"
        side_effects:
          - "see TumorCase.case_state QA_PENDING -> COMPLETED for the full four-link cascade"
      - from: SUBMITTED_FOR_QA
        to: REWORK_REQUIRED
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision with verdict=REWORK_REQUIRED"
        actor: QaReviewer
        preconditions:
          - "abstraction.abstraction_state == SUBMITTED_FOR_QA else ERR_ABSTRACTION_NOT_IN_QA"
          - "X-User-ID != abstraction.abstractor_id else ERR_SEGREGATION_OF_DUTIES_VIOLATION"
        side_effects:
          - "case.case_state -> IN_ABSTRACTION; case.version += 1"
      - from: REWORK_REQUIRED
        to: DRAFT
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/reopen-draft"
        actor: RegistryAbstractor
        preconditions:
          - "abstraction.abstraction_state == REWORK_REQUIRED else ERR_ABSTRACTION_NOT_REWORKABLE"
          - "X-User-ID == abstraction.abstractor_id else ERR_NOT_ASSIGNED_ABSTRACTOR"
          - "abstraction.rework_round < REWORK_ROUND_MAX else ERR_REWORK_LIMIT_EXCEEDED"
          - "the parent case.case_state IN {IN_ABSTRACTION, REWORK_PENDING} else ERR_CASE_NOT_ABSTRACTABLE"
        side_effects:
          - "rework_round += 1; missing_required_fields and completeness_score recomputed against the revised field values"
          - "case.case_state -> IN_ABSTRACTION; case.version += 1"
        note: "Closes the cycle DRAFT -> SUBMITTED_FOR_QA -> REWORK_REQUIRED -> DRAFT with a hard cap of REWORK_ROUND_MAX rounds."
      - from: SUBMITTED_FOR_QA
        to: REJECTED
        trigger: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision with verdict=REJECTED"
        actor: QaReviewer
        preconditions:
          - "abstraction.abstraction_state == SUBMITTED_FOR_QA else ERR_ABSTRACTION_NOT_IN_QA"
          - "X-User-ID != abstraction.abstractor_id else ERR_SEGREGATION_OF_DUTIES_VIOLATION"
        side_effects:
          - "case returned to the pool (see TumorCase.case_state QA_PENDING -> IDENTIFIED)"
      - from: APPROVED
        to: REWORK_REQUIRED
        trigger: "POST /cancer-registry/qa-audits/{auditId}/score resolving to verdict CRITICAL_FAIL (system cascade)"
        actor: system
        preconditions:
          - "abstraction.abstraction_state == APPROVED"
        side_effects:
          - "case.case_state -> REWORK_PENDING and the program aggregate/posture cascade fires (see TumorCase COMPLETED -> REWORK_PENDING)"
      - from: REWORK_REQUIRED
        to: SUPERSEDED
        trigger: "POST /cancer-registry/abstractions with supersedes_abstraction_id = this abstraction (system cascade)"
        actor: system
        preconditions:
          - "abstraction.abstraction_state == REWORK_REQUIRED"
        side_effects:
          - "terminal; the superseding abstraction carries the workflow forward"
      - from: REWORK_REQUIRED
        to: REJECTED
        trigger: "POST /cancer-registry/abstractors/{abstractorId}/employment-status releasing the case (system cascade)"
        actor: system
        preconditions:
          - "abstraction.abstraction_state IN {DRAFT, REWORK_REQUIRED} and its case is released by the staffing cascade"
        side_effects:
          - "terminal; the case returns to IDENTIFIED for reassignment"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /cancer-registry/abstractors/{abstractorId}/employment-status releasing the case (system cascade)"
        actor: system
        preconditions:
          - "abstraction.abstraction_state == DRAFT and its case is released by the staffing cascade"
        side_effects:
          - "terminal; the case returns to IDENTIFIED for reassignment"

  - entity: QaAudit
    state_field: audit_state
    shape: branching_fork_with_compensation
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED_PASS
        trigger: "POST /cancer-registry/qa-audits/{auditId}/score resolving to verdict PASS"
        actor: QaReviewer
        preconditions:
          - "audit.audit_state == OPEN else ERR_AUDIT_ALREADY_SCORED"
          - "X-User-ID == audit.auditor_id else ERR_NOT_ASSIGNED_ABSTRACTOR"
          - "weighted_error_score resolves to verdict PASS per calculations.audit_weighted_error_score"
        side_effects:
          - "audit.weighted_error_score, verdict, scored_at set"
          - "audited abstraction's abstractor.lifetime_discrepancy_points += audit.weighted_error_score"
          - "that abstractor.audit_fail_streak -> 0"
          - "that abstractor.quality_score_rolling_90d and quality_score_cumulative recomputed via calculations.abstractor_quality_score"
        note: "PASS branch: ledger and quality recompute only; no cross-entity rework."
      - from: OPEN
        to: CLOSED_FAIL
        trigger: "POST /cancer-registry/qa-audits/{auditId}/score resolving to verdict MINOR_FAIL or CRITICAL_FAIL"
        actor: QaReviewer
        preconditions:
          - "audit.audit_state == OPEN else ERR_AUDIT_ALREADY_SCORED"
          - "X-User-ID == audit.auditor_id else ERR_NOT_ASSIGNED_ABSTRACTOR"
        side_effects:
          - "audit.weighted_error_score, verdict, scored_at set"
          - "audited abstraction's abstractor.lifetime_discrepancy_points += audit.weighted_error_score; audit_fail_streak += 1"
          - "that abstractor.quality_score_rolling_90d and quality_score_cumulative recomputed"
          - "if verdict == CRITICAL_FAIL and abstraction.abstraction_state == APPROVED: abstraction -> REWORK_REQUIRED, audit.cascade_applied = true, and the TumorCase COMPLETED -> REWORK_PENDING cascade fires (program aggregates -> posture -> submission HOLD)"
          - "if audit_fail_streak >= AUDIT_FAIL_STREAK_SUSPEND: abstractor.employment_status -> SUSPENDED_FROM_ABSTRACTING and every open case assigned to that abstractor is released to IDENTIFIED with assigned_open_case_count -> 0"
        note: "FAIL branch carries a strictly larger side-effect set than the PASS branch: streak increment, optional rework cascade, optional staffing suspension."
      - from: OPEN
        to: VOIDED
        trigger: "POST /cancer-registry/qa-audits/{auditId}/void"
        actor: RegistryManager
        preconditions:
          - "audit.audit_state == OPEN"
        side_effects:
          - "no ledger change (an unscored audit contributed nothing)"
      - from: CLOSED_PASS
        to: VOIDED
        trigger: "POST /cancer-registry/qa-audits/{auditId}/void"
        actor: RegistryManager
        preconditions:
          - "audit.audit_state == CLOSED_PASS"
        side_effects:
          - "abstractor.lifetime_discrepancy_points -= audit.weighted_error_score (compensating action; calculations.discrepancy_points_conservation must balance)"
          - "abstractor.quality_score_rolling_90d and quality_score_cumulative recomputed excluding the voided audit"
      - from: CLOSED_FAIL
        to: VOIDED
        trigger: "POST /cancer-registry/qa-audits/{auditId}/void"
        actor: RegistryManager
        preconditions:
          - "audit.audit_state == CLOSED_FAIL"
        side_effects:
          - "abstractor.lifetime_discrepancy_points -= audit.weighted_error_score; audit_fail_streak -= 1 (floor 0)"
          - "abstractor.quality_score_rolling_90d and quality_score_cumulative recomputed excluding the voided audit"
          - "if audit.cascade_applied and the audited abstraction is still REWORK_REQUIRED with no superseding abstraction: abstraction -> APPROVED, case.case_state -> COMPLETED with completed_on restored to the value it held before the audit cascade, abstractor.assigned_open_case_count -= 1, program aggregates and posture recomputed"
        note: "Full compensation of the CRITICAL_FAIL cascade; both conserved quantities (discrepancy points and open-case workload) must return to their pre-audit values."

  - entity: ConferenceSession
    state_field: session_state
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [CREDITED, NOT_CREDITED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /cancer-registry/conference-sessions/{sessionId}/hold"
        actor: AccreditationCoordinator
        preconditions:
          - "session.session_state == SCHEDULED else ERR_SESSION_NOT_SCHEDULED"
          - "logical clock instant >= session.start_at else ERR_SESSION_NOT_YET_STARTED"
          - "prospective_case_count <= cases_presented_count else ERR_INVALID_REQUEST"
        side_effects:
          - "cases_presented_count and prospective_case_count recorded; prospective_case_ratio computed"
          - "quorum_met recomputed via calculations.conference_quorum"
      - from: HELD
        to: CREDITED
        trigger: "POST /cancer-registry/conference-sessions/{sessionId}/credit with disposition=CREDIT"
        actor: AccreditationCoordinator
        preconditions:
          - "session.session_state == HELD else ERR_SESSION_NOT_HELD"
          - "session.quorum_met == true else ERR_CONFERENCE_QUORUM_NOT_MET"
        side_effects:
          - "credited_on = logical clock date"
          - "program.credited_sessions_12mo, required_sessions_12mo, conference_frequency_compliant and coordinator_attendance_compliant recomputed via calculations.conference_compliance"
      - from: HELD
        to: NOT_CREDITED
        trigger: "POST /cancer-registry/conference-sessions/{sessionId}/credit with disposition=NO_CREDIT"
        actor: AccreditationCoordinator
        preconditions:
          - "session.session_state == HELD else ERR_SESSION_NOT_HELD"
        side_effects:
          - "credited_on stays null; the session never enters the frequency numerator"
          - "program.coordinator_attendance_compliant recomputed (its denominator excludes non-credited sessions)"

  - entity: RegistrySubmission
    state_field: submission_state
    shape: cyclic_with_posture_hold
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: TRANSMITTED
        trigger: "POST /cancer-registry/submissions/{submissionId}/transmit"
        actor: RegistryManager
        preconditions:
          - "submission.submission_state == DRAFT else ERR_SUBMISSION_NOT_DRAFT"
          - "program.registry_posture != FROZEN else ERR_REGISTRY_FROZEN"
          - "submission.total_case_count >= 1 else ERR_SUBMISSION_EMPTY"
          - "every item's case.case_state == COMPLETED else ERR_CASE_NOT_COMPLETED"
          - "submission.assessment_due_cents <= submission.assessment_paid_cents else ERR_ASSESSMENT_UNPAID"
        side_effects:
          - "transmitted_at = logical clock; every item's case.submission_state -> SUBMITTED"
      - from: TRANSMITTED
        to: EDITS_RETURNED
        trigger: "POST /cancer-registry/submissions/{submissionId}/edit-results with at least one item_results entry whose edit_status == EDIT_FAILED"
        actor: StateRegistryLiaison
        preconditions:
          - "submission.submission_state == TRANSMITTED else ERR_SUBMISSION_NOT_TRANSMITTED"
          - "every item_results entry's case_id names a SubmissionItem on this submission else ERR_SUBMISSION_ITEM_NOT_FOUND, and the batch covers every SubmissionItem on the submission else ERR_INVALID_REQUEST"
        side_effects:
          - "per-item edit_status and edit_codes recorded; accepted_item_count, failed_item_count and edit_error_codes recomputed"
          - "cases with ACCEPTED items -> submission_state ACCEPTED; cases with EDIT_FAILED items -> submission_state EDIT_REJECTED"
          - "late_case_count, relief_pct and assessment_due_cents computed via calculations.submission_assessment"
      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "POST /cancer-registry/submissions/{submissionId}/edit-results with every item_results entry edit_status == ACCEPTED"
        actor: StateRegistryLiaison
        preconditions:
          - "submission.submission_state == TRANSMITTED else ERR_SUBMISSION_NOT_TRANSMITTED"
          - "item_results covers every SubmissionItem on the submission else ERR_INVALID_REQUEST"
        side_effects:
          - "all items -> ACCEPTED; every item's case.submission_state -> ACCEPTED"
          - "late_case_count, relief_pct and assessment_due_cents computed via calculations.submission_assessment"
      - from: EDITS_RETURNED
        to: TRANSMITTED
        trigger: "POST /cancer-registry/submissions/{submissionId}/retransmit"
        actor: RegistryManager
        preconditions:
          - "submission.submission_state == EDITS_RETURNED else ERR_SUBMISSION_NOT_IN_EDIT_RESOLUTION"
          - "submission.failed_item_count == 0 else ERR_UNRESOLVED_EDITS"
          - "submission.resubmission_round < RESUBMISSION_ROUND_MAX else ERR_RESUBMISSION_LIMIT_EXCEEDED"
          - "submission.assessment_due_cents <= submission.assessment_paid_cents else ERR_ASSESSMENT_UNPAID"
          - "program.registry_posture != FROZEN else ERR_REGISTRY_FROZEN"
        side_effects:
          - "resubmission_round += 1; transmitted_at = logical clock"
          - "every RESOLVED item -> PENDING and its case.submission_state -> SUBMITTED"
        note: "Closes the edit-resolution cycle TRANSMITTED -> EDITS_RETURNED -> TRANSMITTED."
      - from: DRAFT
        to: HOLD
        trigger: "any transition that recomputes program.registry_posture to FROZEN (system cascade)"
        actor: system
        preconditions:
          - "submission.submission_state == DRAFT"
          - "program.registry_posture became FROZEN in this request"
        side_effects:
          - "pre_hold_state = DRAFT; the batch cannot be transmitted until the freeze lifts"
      - from: HOLD
        to: DRAFT
        trigger: "any transition that recomputes program.registry_posture out of FROZEN (system cascade)"
        actor: system
        preconditions:
          - "submission.submission_state == HOLD"
          - "program.registry_posture is no longer FROZEN after the recompute"
        side_effects:
          - "submission_state restored to pre_hold_state; pre_hold_state -> null"

  - entity: Deficiency
    state_field: deficiency_state
    shape: cyclic
    initial_state: CITED
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: CITED
        to: RESPONSE_SUBMITTED
        trigger: "POST /cancer-registry/deficiencies/{deficiencyId}/response"
        actor: AccreditationCoordinator
        preconditions:
          - "deficiency.deficiency_state IN {CITED, RESPONSE_REJECTED} else ERR_DEFICIENCY_NOT_RESPONDABLE"
          - "logical clock date <= deficiency.response_due_date else ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED"
        side_effects:
          - "response_narrative and evidence_reference recorded"
      - from: RESPONSE_REJECTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /cancer-registry/deficiencies/{deficiencyId}/response"
        actor: AccreditationCoordinator
        preconditions:
          - "deficiency.deficiency_state == RESPONSE_REJECTED else ERR_DEFICIENCY_NOT_RESPONDABLE"
          - "logical clock date <= deficiency.response_due_date (extended by DEFICIENCY_REJECT_EXTENSION_DAYS on each rejection) else ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED"
        side_effects:
          - "response_narrative and evidence_reference overwritten"
        note: "Closes the response cycle CITED -> RESPONSE_SUBMITTED -> RESPONSE_REJECTED -> RESPONSE_SUBMITTED."
      - from: RESPONSE_SUBMITTED
        to: RESOLVED
        trigger: "POST /cancer-registry/deficiencies/{deficiencyId}/response-review with outcome=ACCEPTED"
        actor: CoCSurveyor
        preconditions:
          - "deficiency.deficiency_state == RESPONSE_SUBMITTED else ERR_DEFICIENCY_NOT_UNDER_REVIEW"
        side_effects:
          - "reviewer_notes recorded"
          - "because a CRITICAL deficiency closed, program.open_critical_deficiency_count is recomputed and program.registry_posture is recomputed"
          - "because the posture was recomputed, a posture leaving FROZEN restores every RegistrySubmission in HOLD to pre_hold_state"
      - from: RESPONSE_SUBMITTED
        to: RESPONSE_REJECTED
        trigger: "POST /cancer-registry/deficiencies/{deficiencyId}/response-review with outcome=REJECTED and escalation_count + 1 < DEFICIENCY_ESCALATION_MAX"
        actor: CoCSurveyor
        preconditions:
          - "deficiency.deficiency_state == RESPONSE_SUBMITTED else ERR_DEFICIENCY_NOT_UNDER_REVIEW"
        side_effects:
          - "escalation_count += 1; response_due_date += DEFICIENCY_REJECT_EXTENSION_DAYS days; reviewer_notes recorded"
      - from: RESPONSE_SUBMITTED
        to: ESCALATED
        trigger: "POST /cancer-registry/deficiencies/{deficiencyId}/response-review with outcome=REJECTED and escalation_count + 1 >= DEFICIENCY_ESCALATION_MAX"
        actor: CoCSurveyor
        preconditions:
          - "deficiency.deficiency_state == RESPONSE_SUBMITTED else ERR_DEFICIENCY_NOT_UNDER_REVIEW"
        side_effects:
          - "escalation_count += 1 and the deficiency becomes terminal ESCALATED"
          - "because the deficiency escalated, program.accreditation_state -> PROBATION when it was IN {ACCREDITED, SURVEY_SCHEDULED, DEFICIENCY_RESPONSE}"
          - "because the program entered PROBATION, program.registry_posture is recomputed to FROZEN"
          - "because the posture became FROZEN, every RegistrySubmission of the program in DRAFT -> HOLD with pre_hold_state=DRAFT"
        note: "Depth-4 transitive cascade C (trigger differs from cascades A and B): review -> Deficiency.ESCALATED -> CancerProgram.PROBATION -> posture FROZEN -> submissions HOLD."
      - from: CITED
        to: ESCALATED
        trigger: "POST /_clock/set_current_utc advancing the clock past response_due_date (system checkpoint)"
        actor: system
        preconditions:
          - "deficiency.deficiency_state == CITED"
          - "new logical clock date > deficiency.response_due_date"
        side_effects:
          - "escalation_count += 1; deficiency -> ESCALATED"
          - "because the deficiency escalated, program.accreditation_state -> PROBATION when it was IN {ACCREDITED, SURVEY_SCHEDULED, DEFICIENCY_RESPONSE}, program.registry_posture recomputed to FROZEN, and DRAFT submissions -> HOLD"
        note: "Clock checkpoint sweep processes deficiencies in ascending (response_due_date, created_at) order."

  - entity: CancerProgram
    state_field: accreditation_state
    shape: branching_with_cycle
    initial_state: ACCREDITED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACCREDITED
        to: SURVEY_SCHEDULED
        trigger: "POST /cancer-registry/programs/{programId}/survey-schedule"
        actor: AccreditationCoordinator
        preconditions:
          - "program.accreditation_state IN {ACCREDITED, PROBATION} else ERR_PROGRAM_STATE_INVALID"
          - "survey_date >= logical clock date + SURVEY_LEAD_DAYS days else ERR_SURVEY_DATE_TOO_SOON"
        side_effects:
          - "survey_date recorded"
      - from: SURVEY_SCHEDULED
        to: ACCREDITED
        trigger: "POST /cancer-registry/programs/{programId}/survey-complete with zero open MAJOR/CRITICAL deficiencies"
        actor: CoCSurveyor
        preconditions:
          - "program.accreditation_state == SURVEY_SCHEDULED else ERR_PROGRAM_STATE_INVALID"
          - "count(Deficiency where program_id = program.id and severity IN {MAJOR, CRITICAL} and deficiency_state IN {CITED, RESPONSE_SUBMITTED, RESPONSE_REJECTED}) == 0"
        side_effects:
          - "survey_year = logical clock year; next_survey_due_year = survey_year + SURVEY_CYCLE_YEARS"
          - "program.registry_posture recomputed"
        note: "Fork branch 1 of survey-complete."
      - from: SURVEY_SCHEDULED
        to: DEFICIENCY_RESPONSE
        trigger: "POST /cancer-registry/programs/{programId}/survey-complete with at least one open MAJOR/CRITICAL deficiency"
        actor: CoCSurveyor
        preconditions:
          - "program.accreditation_state == SURVEY_SCHEDULED else ERR_PROGRAM_STATE_INVALID"
          - "count(Deficiency where program_id = program.id and severity IN {MAJOR, CRITICAL} and deficiency_state IN {CITED, RESPONSE_SUBMITTED, RESPONSE_REJECTED}) >= 1"
        side_effects:
          - "survey_year = logical clock year; next_survey_due_year = survey_year + SURVEY_CYCLE_YEARS"
          - "the program must clear its deficiencies before an accreditation decision can be recorded"
        note: "Fork branch 2 of survey-complete; the two branches carry different side-effect sets and different downstream legal transitions."
      - from: DEFICIENCY_RESPONSE
        to: ACCREDITED
        trigger: "POST /cancer-registry/programs/{programId}/accreditation-decision with decision=ACCREDIT"
        actor: CoCSurveyor
        preconditions:
          - "program.accreditation_state IN {DEFICIENCY_RESPONSE, PROBATION} else ERR_PROGRAM_STATE_INVALID"
          - "count(Deficiency where program_id = program.id and severity IN {MAJOR, CRITICAL} and deficiency_state IN {CITED, RESPONSE_SUBMITTED, RESPONSE_REJECTED}) == 0 else ERR_OPEN_DEFICIENCIES_BLOCK_ACCREDITATION"
          - "program.follow_up_rate_coc_pct >= FOLLOW_UP_ACCREDITATION_MIN_PCT else ERR_FOLLOW_UP_RATE_BELOW_THRESHOLD"
        side_effects:
          - "program.registry_posture recomputed; leaving FROZEN restores every RegistrySubmission in HOLD to pre_hold_state"
      - from: DEFICIENCY_RESPONSE
        to: PROBATION
        trigger: "POST /cancer-registry/programs/{programId}/accreditation-decision with decision=PROBATION"
        actor: CoCSurveyor
        preconditions:
          - "program.accreditation_state == DEFICIENCY_RESPONSE else ERR_PROGRAM_STATE_INVALID"
        side_effects:
          - "because the program entered PROBATION, program.registry_posture is recomputed to FROZEN and every DRAFT RegistrySubmission moves to HOLD"
      - from: DEFICIENCY_RESPONSE
        to: WITHDRAWN
        trigger: "POST /cancer-registry/programs/{programId}/accreditation-decision with decision=WITHDRAW"
        actor: CoCSurveyor
        preconditions:
          - "program.accreditation_state IN {DEFICIENCY_RESPONSE, PROBATION} else ERR_PROGRAM_STATE_INVALID"
        side_effects:
          - "terminal; registry_posture stays FROZEN and no further reportability decisions are accepted"
      - from: PROBATION
        to: ACCREDITED
        trigger: "POST /cancer-registry/programs/{programId}/accreditation-decision with decision=ACCREDIT"
        actor: CoCSurveyor
        preconditions:
          - "program.accreditation_state == PROBATION else ERR_PROGRAM_STATE_INVALID"
          - "no open MAJOR/CRITICAL deficiency else ERR_OPEN_DEFICIENCIES_BLOCK_ACCREDITATION"
          - "program.follow_up_rate_coc_pct >= FOLLOW_UP_ACCREDITATION_MIN_PCT else ERR_FOLLOW_UP_RATE_BELOW_THRESHOLD"
        side_effects:
          - "because the program left PROBATION, registry_posture is recomputed and a posture leaving FROZEN restores HOLD submissions to pre_hold_state"
        note: "Closes the accreditation cycle ACCREDITED -> ... -> PROBATION -> ACCREDITED."
      - from: ACCREDITED
        to: PROBATION
        trigger: "Deficiency escalation (system cascade from response-review REJECTED or the clock checkpoint)"
        actor: system
        preconditions:
          - "program.accreditation_state IN {ACCREDITED, SURVEY_SCHEDULED, DEFICIENCY_RESPONSE}"
          - "a Deficiency of this program reached ESCALATED in this request"
        side_effects:
          - "registry_posture -> FROZEN; DRAFT submissions -> HOLD"

  - entity: QualityMeasure
    state_field: measure_state
    shape: linear_with_reentry
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /cancer-registry/quality-measures/{measureId}/evaluate resolving performance_state IN {MEETS, EXCEEDS}"
        actor: AccreditationCoordinator
        preconditions:
          - "measure.measure_state IN {DRAFT, MEASURED, PROJECT_CLOSED_ACHIEVED, PROJECT_CLOSED_MISSED} else ERR_MEASURE_STATE_INVALID"
          - "included_strata_count >= 1 else ERR_MEASURE_STRATA_EMPTY"
        side_effects:
          - "performance_rate_pct, pooled_rate_pct, included_strata_count and performance_state computed via calculations.quality_measure_performance"
      - from: DRAFT
        to: PROJECT_REQUIRED
        trigger: "POST /cancer-registry/quality-measures/{measureId}/evaluate resolving performance_state == UNDER_THRESHOLD"
        actor: AccreditationCoordinator
        preconditions:
          - "measure.measure_state IN {DRAFT, MEASURED, PROJECT_CLOSED_ACHIEVED, PROJECT_CLOSED_MISSED} else ERR_MEASURE_STATE_INVALID"
          - "included_strata_count >= 1 else ERR_MEASURE_STRATA_EMPTY"
        side_effects:
          - "performance_rate_pct, pooled_rate_pct, included_strata_count and performance_state computed; the program owes an improvement project"
      - from: PROJECT_REQUIRED
        to: PROJECT_ACTIVE
        trigger: "POST /cancer-registry/quality-measures/{measureId}/improvement-project with action=OPEN"
        actor: AccreditationCoordinator
        preconditions:
          - "measure.measure_state == PROJECT_REQUIRED else ERR_PROJECT_NOT_REQUIRED"
          - "target_rate_pct > measure.performance_rate_pct else ERR_INVALID_REQUEST"
        side_effects:
          - "project_title and target_rate_pct recorded"
      - from: PROJECT_ACTIVE
        to: PROJECT_CLOSED_ACHIEVED
        trigger: "POST /cancer-registry/quality-measures/{measureId}/improvement-project with action=CLOSE and final_rate_pct >= threshold_pct"
        actor: AccreditationCoordinator
        preconditions:
          - "measure.measure_state == PROJECT_ACTIVE else ERR_MEASURE_STATE_INVALID"
        side_effects:
          - "final_rate_pct recorded; performance_state recomputed from final_rate_pct against threshold_pct"
      - from: PROJECT_ACTIVE
        to: PROJECT_CLOSED_MISSED
        trigger: "POST /cancer-registry/quality-measures/{measureId}/improvement-project with action=CLOSE and final_rate_pct < threshold_pct"
        actor: AccreditationCoordinator
        preconditions:
          - "measure.measure_state == PROJECT_ACTIVE else ERR_MEASURE_STATE_INVALID"
        side_effects:
          - "final_rate_pct recorded"
          - "because the project missed its threshold, a Deficiency is auto-cited for this program with standard_code='STD 7.3', severity=MAJOR, cited_on = logical clock date, source_measure_id = measure.id, deficiency_state = CITED"
          - "because a MAJOR deficiency is now open, program.registry_posture is recomputed (MAJOR alone does not freeze) and accreditation-decision ACCREDIT is blocked until it closes"
        note: "Depth-3 cross-aggregate cascade with a different trigger from cascades A and C."
      - from: MEASURED
        to: PROJECT_REQUIRED
        trigger: "POST /cancer-registry/quality-measures/{measureId}/evaluate with replacement strata resolving performance_state == UNDER_THRESHOLD"
        actor: AccreditationCoordinator
        preconditions:
          - "measure.measure_state IN {MEASURED, PROJECT_CLOSED_ACHIEVED, PROJECT_CLOSED_MISSED} else ERR_MEASURE_STATE_INVALID"
        side_effects:
          - "strata replaced when supplied; all rate fields recomputed"
        note: "Re-entry edge that lets a measure be re-evaluated after a project closes."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: abstraction-create-stale-case
    parent_entity: TumorCase
    write_endpoint: "POST /cancer-registry/abstractions"
    occ_field: "expected_case_version"
    description: |
      Creating an Abstraction against a TumorCase whose version has advanced since the client
      last observed it is rejected. Abstraction creation is legitimately repeatable on the same
      case — a rework round supersedes the prior abstraction under §1.2 Abstraction
      REWORK_REQUIRED -> SUPERSEDED — so a writer holding a stale view of the case would
      otherwise silently attach a second live abstraction to it. The version check turns that
      into a deterministic stale-version rejection.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: submission-item-add-stale-submission
    parent_entity: RegistrySubmission
    write_endpoint: "POST /cancer-registry/submissions/{submissionId}/items"
    occ_field: "expected_submission_version"
    description: |
      Adding a SubmissionItem to a RegistrySubmission whose version has advanced since the
      client last read the batch is rejected. Adding items is legitimately repeatable and each
      add changes total_case_count and, once results return, the assessment basis of the batch;
      a writer working from a stale batch view would compose a batch it never inspected. The
      version check reduces this to a stale-version rejection.
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: reportability_determination
    trigger: "On POST /cancer-registry/casefinding-sources/{sourceId}/entries (entry creation); recomputed never afterwards"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top-to-bottom; the FIRST matching rule wins and fixes suggested_reason_code.
      if diagnosis_date < date(program.reference_year, 1, 1):
          suggested_reportability = NON_REPORTABLE; suggested_reason_code = "BEFORE_REFERENCE_YEAR"
      elif behavior_code == MALIGNANT_3 and primary_site_code startswith "C44"
           and histology_code in SKIN_EXCLUDED_HISTOLOGIES:
          suggested_reportability = NON_REPORTABLE; suggested_reason_code = "SKIN_SQUAMOUS_BASAL_EXCLUDED"
      elif behavior_code == IN_SITU_2 and primary_site_code == "C53.9":
          suggested_reportability = NON_REPORTABLE; suggested_reason_code = "CERVIX_IN_SITU_EXCLUDED"
      elif behavior_code in {MALIGNANT_3, IN_SITU_2}:
          suggested_reportability = REPORTABLE; suggested_reason_code = "SEER_REPORTABLE_BEHAVIOR"
      elif behavior_code in {BENIGN_0, BORDERLINE_1} and primary_site_code in CNS_SITE_CODES:
          suggested_reportability = REPORTABLE; suggested_reason_code = "CNS_BENIGN_REPORTABLE"
      else:
          suggested_reportability = NON_REPORTABLE; suggested_reason_code = "BENIGN_NON_CNS"
    input_set: "The single CasefindingEntry being created, plus its source's program (for reference_year). No aggregation."
    constants:
      SKIN_EXCLUDED_HISTOLOGIES: ["8070/3", "8090/3", "8091/3"]
      CNS_SITE_CODES: ["C70.0", "C70.1", "C70.9", "C71.0", "C71.9", "C72.0", "C72.9"]
    precision: "Exact enum output; no numeric rounding"

  - name: class_of_case_determination
    trigger: "On POST /cancer-registry/casefinding-sources/{sourceId}/entries (entry creation)"
    algorithm: threshold
    formula: |
      referral_lag_days = (first_contact_date - diagnosis_date).days   # whole days, both dates inclusive-exclusive difference
      if diagnosed_at_facility and first_treatment_at_facility:
          class_of_case_code = CLASS_10
      elif diagnosed_at_facility and not first_treatment_at_facility:
          class_of_case_code = CLASS_00
      elif (not diagnosed_at_facility) and first_treatment_at_facility
           and referral_lag_days <= REFERRAL_ANALYTIC_MAX_DAYS:
          class_of_case_code = CLASS_20
      elif (not diagnosed_at_facility) and first_treatment_at_facility:
          class_of_case_code = CLASS_31
      else:
          class_of_case_code = CLASS_40
      analytic_flag = class_of_case_code in {CLASS_00, CLASS_10, CLASS_20}
    input_set: "The single CasefindingEntry being created"
    constants:
      REFERRAL_ANALYTIC_MAX_DAYS: 120
    precision: "Whole-day integer arithmetic; the comparison is <= (a lag of exactly 120 days is analytic CLASS_20, 121 days is non-analytic CLASS_31)"

  - name: abstract_timeliness
    trigger: "On TumorCase creation, on POST /_clock/set_current_utc, and on the QA_PENDING -> COMPLETED transition"
    algorithm: threshold
    formula: |
      abstract_due_date = first_contact_date + program.timeliness_standard_days days
      if case_state == COMPLETED:
          timeliness_status = ON_TIME if completed_on <= abstract_due_date else LATE
          days_to_due = (abstract_due_date - completed_on).days
      elif case_state == VOIDED:
          timeliness_status = ON_TIME; days_to_due = (abstract_due_date - clock_date).days
      else:
          days_to_due = (abstract_due_date - clock_date).days
          if days_to_due < 0:      timeliness_status = LATE
          elif days_to_due <= AT_RISK_WINDOW_DAYS: timeliness_status = AT_RISK
          else:                    timeliness_status = ON_TIME
    input_set: "One TumorCase plus its program's timeliness_standard_days and the logical clock date"
    constants:
      AT_RISK_WINDOW_DAYS: 30
    precision: "Whole-day integer arithmetic; days_to_due == 30 is AT_RISK and days_to_due == 31 is ON_TIME; days_to_due == 0 (due today) is AT_RISK, -1 is LATE"

  - name: abstraction_completeness
    trigger: "On POST /cancer-registry/abstractions, on POST /cancer-registry/abstractions/{abstractionId}/reopen-draft, and on the REWORK_REQUIRED -> DRAFT transition"
    algorithm: weighted_scoring
    formula: |
      # Step 1 — build the required-field set (conditional on THREE independent inputs:
      # stage_source, the case's class_of_case_code, and the treatment_modalities content).
      required = {"stage_group", "stage_source", "first_treatment_date",
                  "treatment_modalities", "outcome_status", "last_contact_date"}
      if stage_source == PATHOLOGIC:                     required |= {"t_category", "n_category", "m_category"}
      if case.class_of_case_code in {CLASS_00, CLASS_10}: required |= {"diagnostic_confirmation_code"}
      if "RADIATION" in treatment_modalities:            required |= {"radiation_start_date"}
      if case.analytic_flag is False:                    required -= {"outcome_status", "last_contact_date"}
      if "NO_TREATMENT" in treatment_modalities:         required -= {"first_treatment_date"}

      # Step 2 — missing set (null, empty string or empty array counts as missing)
      missing_required_fields = sorted(f for f in required if value_of(f) is null/empty)
      missing_count = len(missing_required_fields)

      # Step 3 — non-linear score with nested clamp
      raw = 100 - (MISSING_FIELD_PENALTY * missing_count) \
                - (UNKNOWN_STAGE_PENALTY if stage_group == UNKNOWN else 0) \
                - (CLINICAL_STAGE_ON_OWN_CASE_PENALTY
                   if (stage_source == CLINICAL and case.class_of_case_code == CLASS_10) else 0)
      completeness_score = max(0, min(100, raw))
    input_set: "The Abstraction being written plus its TumorCase (class_of_case_code, analytic_flag). No aggregation across abstractions."
    constants:
      MISSING_FIELD_PENALTY: 12
      UNKNOWN_STAGE_PENALTY: 8
      CLINICAL_STAGE_ON_OWN_CASE_PENALTY: 6
      COMPLETENESS_SUBMIT_MIN: 85
    precision: "Integer score clamped to [0, 100]; submit-qa requires completeness_score >= 85 (a score of exactly 85 passes, 84 fails)"

  - name: audit_weighted_error_score
    trigger: "On POST /cancer-registry/qa-audits/{auditId}/score"
    algorithm: weighted_scoring
    formula: |
      weighted_error_score = (CRITICAL_WEIGHT * critical_discrepancy_count)
                           + (MAJOR_WEIGHT * major_discrepancy_count)
                           + (MINOR_WEIGHT * minor_discrepancy_count)
      if critical_discrepancy_count >= 1:                 verdict = CRITICAL_FAIL
      elif weighted_error_score <= AUDIT_PASS_MAX_POINTS: verdict = PASS
      else:                                              verdict = MINOR_FAIL
    input_set: "The three discrepancy counts posted for one QaAudit"
    constants:
      CRITICAL_WEIGHT: 5
      MAJOR_WEIGHT: 3
      MINOR_WEIGHT: 1
      AUDIT_PASS_MAX_POINTS: 2
      AUDIT_FAIL_STREAK_SUSPEND: 3
    precision: "Integer points; the PASS boundary is <= 2 (score 2 is PASS, score 3 is MINOR_FAIL) and any critical discrepancy forces CRITICAL_FAIL regardless of the total"

  - name: abstractor_quality_score
    trigger: "On POST /cancer-registry/qa-audits/{auditId}/score, on POST /cancer-registry/qa-audits/{auditId}/void, and on POST /_clock/set_current_utc"
    algorithm: weighted_scoring
    formula: |
      # Cohort: audits of abstractions PRODUCED BY this abstractor
      # (QaAudit -> Abstraction.abstractor_id == abstractor.id), with
      # audit_state IN {CLOSED_PASS, CLOSED_FAIL}. VOIDED and OPEN audits are excluded.
      A_all = those audits
      A_90d = subset with scored_at >= clock_instant - QUALITY_WINDOW_DAYS days
      variant rolling_90d_weighted (stored in Abstractor.quality_score_rolling_90d):
          fields_90 = sum(audited_field_count for a in A_90d)
          if fields_90 == 0: score = 100.0
          else: score = max(0.0, min(100.0,
                    round(100 - (sum(a.weighted_error_score for a in A_90d) / fields_90 * 100), 1)))
      variant cumulative_unweighted (stored in Abstractor.quality_score_cumulative):
          fields_all = sum(audited_field_count for a in A_all)
          discrepancies = sum(a.minor_discrepancy_count + a.major_discrepancy_count
                              + a.critical_discrepancy_count for a in A_all)
          if fields_all == 0: score = 100.0
          else: score = max(0.0, min(100.0,
                    round(100 - (discrepancies / fields_all * 100), 1)))
    input_set: "QaAudit rows whose Abstraction.abstractor_id == this abstractor and audit_state IN {CLOSED_PASS, CLOSED_FAIL}; the rolling variant additionally filters scored_at >= clock - 90 days (inclusive lower bound). Order-insensitive (pure sums)."
    constants:
      QUALITY_WINDOW_DAYS: 90
    precision: "round_half_up to 1 decimal place after the division, then clamp to [0.0, 100.0]"
    variants:
      - name: rolling_90d_weighted
        when: "Surfaced as Abstractor.quality_score_rolling_90d and used by nothing else"
        difference: "Weights discrepancies 5/3/1 by severity and only counts audits scored inside the trailing 90 days"
      - name: cumulative_unweighted
        when: "Surfaced as Abstractor.quality_score_cumulative and reported to the accreditation file"
        difference: "Counts every closed audit ever, weighting all discrepancies equally, so an old critical-heavy audit still drags the score while a fresh minor-only audit barely moves it"

  - name: follow_up_rate
    trigger: "On POST /cancer-registry/cases/{caseId}/follow-up-contacts, on TumorCase creation/void, and on POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      base = TumorCase rows where program_id == program.id
                              and analytic_flag == true
                              and case_state == COMPLETED   # only abstracted cases are followed
      variant coc_five_year (stored in CancerProgram.follow_up_rate_coc_pct):
          D1 = [c in base if (clock_date - c.diagnosis_date).days <= COC_COHORT_DAYS
                          and c.vital_status != DEAD]
          N1 = [c in D1 if c.last_contact_date is not null
                        and (clock_date - c.last_contact_date).days <= LOST_CONTACT_DAYS]
          rate = 100.0 if len(D1) == 0 else round(len(N1) / len(D1) * 100, 1)
          lost_to_follow_up_pct = 0.0 if len(D1) == 0 else round((len(D1) - len(N1)) / len(D1) * 100, 1)
      variant state_central_all_years (stored in CancerProgram.follow_up_rate_state_pct):
          D2 = base                      # every analytic year, dead patients INCLUDED
          N2 = [c in D2 if c.vital_status == DEAD
                        or (c.last_contact_date is not null
                            and (clock_date - c.last_contact_date).days <= STATE_CONTACT_DAYS)]
          rate = 100.0 if len(D2) == 0 else round(len(N2) / len(D2) * 100, 1)
    input_set: "Analytic COMPLETED TumorCase rows of one program (a case still in the abstraction backlog is not yet in any follow-up denominator, so a fresh program reports 100.0). The CoC variant restricts the denominator to diagnoses within 1826 days of the clock date and drops DEAD patients entirely; the state variant keeps every year and counts DEAD patients as followed. Pure counts, order-insensitive."
    constants:
      COC_COHORT_DAYS: 1826
      LOST_CONTACT_DAYS: 456
      STATE_CONTACT_DAYS: 365
      FOLLOW_UP_ACCREDITATION_MIN_PCT: 80.0
    precision: "round_half_up to 1 decimal; an empty denominator reports 100.0 (and lost_to_follow_up_pct 0.0)"
    variants:
      - name: coc_five_year
        when: "Accreditation reporting and the PROBATION -> ACCREDITED precondition"
        difference: "5-year diagnosis cohort, 15-month (456-day) contact window, DEAD patients removed from the denominator"
      - name: state_central_all_years
        when: "State central registry reporting, selected explicitly by follow_up_variant=state_central_all_years on GET /cancer-registry/programs/{programId}/compliance-summary (which then reports lost_to_follow_up_pct as 100.0 - follow_up_rate_state_pct)"
        difference: "All diagnosis years, 12-month (365-day) contact window, DEAD patients counted as followed — so the same case set produces a different percentage"

  - name: case_follow_up_status
    trigger: "On POST /cancer-registry/cases/{caseId}/follow-up-contacts and on POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      if analytic_flag is False:            follow_up_status = NOT_REQUIRED; follow_up_due_date = null
      elif vital_status == DEAD:            follow_up_status = CLOSED_DECEASED
                                            follow_up_due_date = null
      else:
          anchor = last_contact_date if last_contact_date is not null else first_contact_date
          follow_up_due_date = anchor + FOLLOW_UP_INTERVAL_DAYS days
          age = (clock_date - anchor).days
          if age <= FOLLOW_UP_INTERVAL_DAYS:   follow_up_status = CURRENT
          elif age <= LOST_CONTACT_DAYS:       follow_up_status = DELINQUENT
          else:                                follow_up_status = LOST
    input_set: "One TumorCase and the logical clock date; anchor is last_contact_date when a qualifying contact exists, otherwise first_contact_date"
    constants:
      FOLLOW_UP_INTERVAL_DAYS: 365
      LOST_CONTACT_DAYS: 456
    precision: "Whole days; age == 365 is CURRENT, 366 is DELINQUENT, 456 is DELINQUENT, 457 is LOST"

  - name: abstractor_productivity
    trigger: "On the Abstraction SUBMITTED_FOR_QA -> APPROVED transition, on POST /cancer-registry/qa-audits/{auditId}/void, and on POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      completed_cases_30d = count(Abstraction where abstractor_id == abstractor.id
                                              and abstraction_state == APPROVED
                                              and (clock_date - date(approved_at)).days <= PRODUCTIVITY_WINDOW_DAYS - 1)
      productivity_rate_per_day = round(completed_cases_30d / WORKING_DAYS_PER_30, 2)
      productivity_status = MEETS if productivity_rate_per_day >= productivity_target_cases_per_day else BELOW
    input_set: "APPROVED Abstraction rows of one abstractor whose approved_at date falls in the 30-day window ending on the clock date (inclusive both ends)"
    constants:
      PRODUCTIVITY_WINDOW_DAYS: 30
      WORKING_DAYS_PER_30: 21
    precision: "round_half_up to 2 decimals; the comparison against the target is >= (a rate exactly equal to the target is MEETS)"

  - name: abstractor_capacity_cap
    trigger: "On POST /cancer-registry/cases/{caseId}/assign, before the assignment is applied"
    algorithm: threshold
    formula: |
      capacity_cap = round_half_up(productivity_target_cases_per_day * CAPACITY_CAP_MULTIPLIER)  # integer
      assignment allowed only while assigned_open_case_count < capacity_cap
    input_set: "One Abstractor's productivity target and its current assigned_open_case_count"
    constants:
      CAPACITY_CAP_MULTIPLIER: 10
    precision: "Integer cap; the check is strict < (holding exactly capacity_cap open cases blocks the next assignment with ERR_ABSTRACTOR_CAPACITY_EXCEEDED)"

  - name: registry_posture
    trigger: "Recomputed at the end of every request that changes a TumorCase state, a Deficiency state, program.accreditation_state, a follow-up contact, or the logical clock"
    algorithm: threshold
    formula: |
      open_backlog_count    = count(TumorCase where program_id == P and case_state IN
                                    {IDENTIFIED, ASSIGNED, IN_ABSTRACTION, QA_PENDING, REWORK_PENDING})
      overdue_backlog_count = count(that same set where timeliness_status == LATE)
      open_critical_deficiency_count = count(Deficiency where program_id == P
                                            and severity == CRITICAL
                                            and deficiency_state IN {CITED, RESPONSE_SUBMITTED, RESPONSE_REJECTED})
      # Evaluated in this exact order; the first matching clause wins.
      if accreditation_state IN {PROBATION, WITHDRAWN}:              registry_posture = FROZEN
      elif open_critical_deficiency_count >= 1:                      registry_posture = FROZEN
      elif overdue_backlog_count >= POSTURE_FROZEN_OVERDUE_MIN:       registry_posture = FROZEN
      elif open_backlog_count >= POSTURE_RESTRICTED_BACKLOG_MIN:      registry_posture = RESTRICTED
      else:                                                          registry_posture = OPEN
      # NOTE: follow-up performance deliberately does NOT feed the posture; it gates
      # accreditation only (ERR_FOLLOW_UP_RATE_BELOW_THRESHOLD), so posture stays a pure
      # function of accreditation state, critical deficiencies and backlog.
      # Posture transition side effects (see §1.2 RegistrySubmission DRAFT <-> HOLD):
      #   OPEN/RESTRICTED -> FROZEN : every DRAFT submission of P -> HOLD (pre_hold_state = DRAFT)
      #   FROZEN -> OPEN/RESTRICTED : every HOLD submission of P -> pre_hold_state
      # Submissions are swept in ascending (period_start, created_at) order.
    input_set: "All non-voided TumorCase rows and all Deficiency rows of one program, plus the program's own accreditation_state"
    constants:
      POSTURE_FROZEN_OVERDUE_MIN: 2
      POSTURE_RESTRICTED_BACKLOG_MIN: 4
    precision: "Integer counts; overdue_backlog_count == 2 freezes and 1 does not; open_backlog_count == 4 restricts and 3 does not; the first matching clause wins, so a FROZEN condition always masks a RESTRICTED one"

  - name: quality_measure_performance
    trigger: "On POST /cancer-registry/quality-measures/{measureId}/evaluate and on POST /cancer-registry/quality-measures/{measureId}/improvement-project with action=CLOSE"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: round each stratum rate to 1 decimal FIRST, then take the
      # unweighted mean of those rounded rates, then round the mean to 1 decimal.
      # Summing numerators and denominators first (the pooled rate) is explicitly NOT the
      # accountability rate; it is stored separately as pooled_rate_pct for contrast.
      included = [s for s in strata if s.eligible_case_count > 0]     # zero-eligible strata are excluded
      included_strata_count = len(included)
      if included_strata_count == 0:
          -> ERR_MEASURE_STRATA_EMPTY (no rates are written)
      stratum_rates = [round(s.compliant_case_count / s.eligible_case_count * 100, 1) for s in included]
      performance_rate_pct = round(sum(stratum_rates) / included_strata_count, 1)
      pooled_rate_pct = round(sum(s.compliant_case_count for s in included)
                              / sum(s.eligible_case_count for s in included) * 100, 1)
      basis = final_rate_pct if this call is improvement-project CLOSE else performance_rate_pct
      if basis >= threshold_pct + EXCEEDS_MARGIN_PCT: performance_state = EXCEEDS
      elif basis >= threshold_pct:                    performance_state = MEETS
      else:                                           performance_state = UNDER_THRESHOLD
    input_set: "The measure's strata array as posted; strata with eligible_case_count == 0 are dropped before any arithmetic, and each remaining stratum contributes equally regardless of its eligible_case_count"
    constants:
      EXCEEDS_MARGIN_PCT: 10.0
    precision: "round_half_up to 1 decimal at both levels (per stratum, then on the mean); the threshold test is >= (a rate exactly equal to threshold_pct is MEETS)"
    variants:
      - name: stratified_mean_of_rounded_rates
        when: "Always — this is the accountability rate stored in performance_rate_pct and tested against threshold_pct"
        difference: "Rounds per stratum before averaging and weights every stratum equally"
      - name: pooled_ratio
        when: "Reported in pooled_rate_pct for contrast only"
        difference: "Sums numerators and denominators across strata and rounds once, so a large low-performing stratum drags it below the stratified rate for identical inputs"

  - name: submission_assessment
    trigger: "On POST /cancer-registry/submissions/{submissionId}/edit-results (both the ACCEPTED and the EDITS_RETURNED branch)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The relief tier looks circular because the relief
      # depends on the assessment total while the total depends on the relief; the order
      # below resolves it: the tier is keyed on the PRE-RELIEF subtotal, never on the
      # post-relief amount.
      # 1. per-record component
      late_case_count = count(SubmissionItem i on this submission where
                              i.case.completed_on is not null
                              and i.case.completed_on > i.case.abstract_due_date)
      record_component_cents = LATE_CASE_FEE_CENTS * late_case_count
      # 2. batch component
      batch_component_cents = BATCH_LATE_FEE_CENTS if date(transmitted_at) > deadline_date else 0
      # 3. pre-relief subtotal
      pre_relief_total_cents = record_component_cents + batch_component_cents
      # 4. tier keyed on pre_relief_total_cents (descending thresholds, first match wins)
      if   pre_relief_total_cents >= RELIEF_TIER_3_MIN_CENTS: relief_pct = 0.30
      elif pre_relief_total_cents >= RELIEF_TIER_2_MIN_CENTS: relief_pct = 0.20
      elif pre_relief_total_cents >= RELIEF_TIER_1_MIN_CENTS: relief_pct = 0.10
      else:                                                  relief_pct = 0.00
      # 5. final assessment
      assessment_due_cents = round_half_up(pre_relief_total_cents * (1 - relief_pct))
      # assessment_paid_cents is untouched here; ERR_ASSESSMENT_UNPAID blocks transmit and
      # retransmit while assessment_due_cents > assessment_paid_cents.
    input_set: "Every SubmissionItem on the submission (regardless of its edit_status) joined to its TumorCase for completed_on and abstract_due_date, plus the submission's transmitted_at and deadline_date"
    constants:
      LATE_CASE_FEE_CENTS: 2500
      BATCH_LATE_FEE_CENTS: 15000
      RELIEF_TIER_1_MIN_CENTS: 20000
      RELIEF_TIER_2_MIN_CENTS: 50000
      RELIEF_TIER_3_MIN_CENTS: 100000
    precision: "Integer cents; round_half_up on the single multiplication at step 5. Tier boundaries are >= (a pre-relief subtotal of exactly 20000 earns 10% relief)"

  - name: conference_quorum
    trigger: "On POST /cancer-registry/conference-sessions/{sessionId}/attendances, on POST /cancer-registry/conference-sessions/{sessionId}/hold, and re-checked by POST /cancer-registry/conference-sessions/{sessionId}/credit"
    algorithm: aggregation
    formula: |
      qualifying = [a for a in attendances if a.attended_minutes >= QUORUM_MIN_MINUTES]
      disciplines_present = set(a.discipline for a in qualifying)
      prospective_case_ratio = 0.0 if cases_presented_count == 0 \
                               else round(prospective_case_count / cases_presented_count, 3)
      quorum_met = (cases_presented_count > 0)
                   and set(required_disciplines) is a subset of disciplines_present
                   and prospective_case_ratio >= PROSPECTIVE_MIN_RATIO
    input_set: "One ConferenceSession's attendances array and its recorded case counts. A session with an empty attendances array or cases_presented_count == 0 has quorum_met == false."
    constants:
      QUORUM_MIN_MINUTES: 30
      PROSPECTIVE_MIN_RATIO: 0.80
    precision: "Ratio rounded to 3 decimals before comparison; attended_minutes == 30 qualifies and 29 does not; a ratio of exactly 0.800 meets the standard"

  - name: conference_compliance
    trigger: "On POST /cancer-registry/conference-sessions/{sessionId}/credit (both dispositions) and on POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      window_start = first day of the calendar month 11 months before the clock month
      window_end   = last day of the clock month           # 12 calendar months, inclusive
      required_sessions_per_month = 2 if program.annual_analytic_caseload >= CONFERENCE_CASELOAD_THRESHOLD else 1
      required_sessions_12mo = required_sessions_per_month * 12
      credited = [s for s in ConferenceSession where s.program_id == P
                                             and s.session_state == CREDITED
                                             and window_start <= date(s.start_at) <= window_end]
      credited_sessions_12mo = len(credited)
      conference_frequency_compliant = credited_sessions_12mo >= required_sessions_12mo
      coordinator_refs = sorted distinct a.attendee_ref over all attendances of `credited`
                         where a.is_required_coordinator is true
      if credited_sessions_12mo == 0 or coordinator_refs is empty:
          coordinator_attendance_compliant = false
      else:
          for each ref: attended = count(s in credited where any a in s.attendances has
                                         a.attendee_ref == ref and a.attended_minutes >= QUORUM_MIN_MINUTES)
                        rate_ref = round(attended / credited_sessions_12mo * 100, 1)
          coordinator_attendance_compliant = all(rate_ref >= COORDINATOR_MIN_ATTENDANCE_PCT)
    input_set: "CREDITED ConferenceSession rows of one program whose start_at date falls in the trailing 12 calendar months (inclusive both ends); NOT_CREDITED, HELD and SCHEDULED sessions are excluded from both numerator and denominator"
    constants:
      CONFERENCE_CASELOAD_THRESHOLD: 500
      COORDINATOR_MIN_ATTENDANCE_PCT: 50.0
      QUORUM_MIN_MINUTES: 30
    precision: "Integer counts; a caseload of exactly 500 requires 2 sessions per month (24 in the window); a coordinator rate of exactly 50.0 is compliant"

  - name: casefinding_completeness
    trigger: "On POST /cancer-registry/casefinding-sources/{sourceId}/entries and on POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      entries_this_month = count(CasefindingEntry where source_id == S
                                 and accession_date is inside the clock's current calendar month)
      if expected_monthly_volume == 0: casefinding_completeness_pct = 100.0
      else: casefinding_completeness_pct = round(min(entries_this_month / expected_monthly_volume, 1.0) * 100, 1)
      last_reconciled_through = clock_date   # set only by the clock checkpoint
    input_set: "CasefindingEntry rows of one source whose accession_date falls in the clock's calendar month, regardless of reportability_state"
    constants: {}
    precision: "round_half_up to 1 decimal after clamping the ratio at 1.0; the value never exceeds 100.0"

  - name: deficiency_response_window
    trigger: "On POST /cancer-registry/deficiencies (creation) and extended on every REJECTED response review"
    algorithm: threshold
    formula: |
      window_days = {CRITICAL: 30, MAJOR: 45, MINOR: 60}[severity]
      response_due_date = cited_on + window_days days
      on each REJECTED review: response_due_date = response_due_date + DEFICIENCY_REJECT_EXTENSION_DAYS days
    input_set: "One Deficiency's severity and cited_on, plus its rejection history"
    constants:
      CRITICAL_RESPONSE_DAYS: 30
      MAJOR_RESPONSE_DAYS: 45
      MINOR_RESPONSE_DAYS: 60
      DEFICIENCY_REJECT_EXTENSION_DAYS: 15
      DEFICIENCY_ESCALATION_MAX: 2
    precision: "Whole days; a response recorded on exactly response_due_date is accepted, one day later is rejected with ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED"

  - name: workload_conservation
    trigger: "Invariant checked after every assign, unassign, abstraction create, QA decision, audit score, audit void, staffing change and entry reopen"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1: OPEN ABSTRACTION WORKLOAD (whole cases)
      sum(Abstractor.assigned_open_case_count for a in Abstractor where program_id == P)
        == count(TumorCase where program_id == P
                             and assigned_abstractor_id is not null
                             and case_state IN {ASSIGNED, IN_ABSTRACTION, QA_PENDING, REWORK_PENDING})
      # Every forward action that increments a counter has a compensating action that
      # decrements it by the same amount: assign/unassign, assign/entry-reopen-void,
      # qa-approve/audit-critical-fail, audit-critical-fail/audit-void.
    input_set: "All Abstractor rows and all TumorCase rows of one program"
    constants: {}
    precision: "Exact integer equality; no rounding"

  - name: discrepancy_points_conservation
    trigger: "Invariant checked after every POST /cancer-registry/qa-audits/{auditId}/score and POST /cancer-registry/qa-audits/{auditId}/void"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2: AUDIT DISCREPANCY POINTS (weighted score ledger)
      Abstractor.lifetime_discrepancy_points
        == sum(q.weighted_error_score for q in QaAudit
               where q.abstraction.abstractor_id == abstractor.id
                 and q.audit_state IN {CLOSED_PASS, CLOSED_FAIL})
      # Voiding a scored audit subtracts exactly the points it added, so score-then-void
      # returns the ledger to its pre-score value.
    input_set: "All QaAudit rows joined to Abstraction for one abstractor"
    constants: {}
    precision: "Exact integer equality; no rounding"

  - name: reportable_case_parity
    trigger: "Invariant checked after every reportability decision and every entry reopen"
    algorithm: aggregation
    formula: |
      count(TumorCase where program_id == P and case_state != VOIDED)
        == count(CasefindingEntry where program_id == P and reportability_state == REPORTABLE)
        == CancerProgram.identified_case_count
    input_set: "All CasefindingEntry and TumorCase rows of one program"
    constants: {}
    precision: "Exact integer equality; no rounding"

  - name: conference_slot_overlap
    trigger: "On POST /cancer-registry/conference-sessions (creation)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics with a mandatory changeover buffer.
      # A candidate session [new.start_at, new.end_at) conflicts with an existing
      # non-cancelled session S of the SAME program when:
      #   new.start_at < S.end_at + CONFERENCE_BUFFER_MINUTES
      #   and S.start_at < new.end_at + CONFERENCE_BUFFER_MINUTES
      # Consequences pinned by these semantics:
      #   - back-to-back sessions (new.start_at == S.end_at) CONFLICT, because the
      #     30-minute buffer has not elapsed;
      #   - a session starting exactly S.end_at + 30 minutes is ACCEPTED (touching the
      #     buffer edge is allowed);
      #   - sessions of a DIFFERENT program never conflict (the calendar is per program);
      #   - NOT_CREDITED and CREDITED sessions still occupy the calendar; only sessions
      #     of another program are ignored.
      # Violation -> ERR_CONFERENCE_SLOT_CONFLICT (409).
    input_set: "All ConferenceSession rows of the same program in any session_state; comparison is pairwise against the candidate only (no transitive merging)"
    constants:
      CONFERENCE_BUFFER_MINUTES: 30
    precision: "Minute resolution on UTC instants; the boundary comparison against the buffered edge is strict <"

  - name: auditor_window_capacity
    trigger: "On POST /cancer-registry/qa-audits (creation)"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics plus an AGGREGATE capacity - deliberately different
      # from conference_slot_overlap on both axes.
      # Two audit windows of the SAME auditor overlap when:
      #   new.window_start <= S.window_end and S.window_start <= new.window_end
      # so windows that merely TOUCH at a single date (new.window_start == S.window_end)
      # DO overlap. Overlap is not itself an error: up to AUDITOR_WINDOW_CAPACITY
      # windows may overlap any given date.
      overlapping = [S for S in QaAudit where S.auditor_id == new.auditor_id
                                          and S.audit_state != VOIDED
                                          and S.window_start <= new.window_end
                                          and new.window_start <= S.window_end]
      if len(overlapping) >= AUDITOR_WINDOW_CAPACITY:
          -> ERR_AUDITOR_WINDOW_CAPACITY_EXCEEDED (409)
      # VOIDED audits release their slot, so voiding one of two overlapping windows makes
      # room for a third.
    input_set: "Non-VOIDED QaAudit rows of the same auditor only; audits of other auditors and VOIDED audits are excluded from the count"
    constants:
      AUDITOR_WINDOW_CAPACITY: 2
    precision: "Whole dates; the overlap test is <= on both sides (inclusive touching counts), and the capacity test is >= (the third overlapping window is the one rejected)"

  - name: submission_period_overlap
    trigger: "On POST /cancer-registry/submissions (creation)"
    algorithm: interval_merge
    formula: |
      # CLOSED reporting periods, exclusive per program: a program may not have two
      # submissions whose [period_start, period_end] ranges intersect unless the earlier
      # one is terminal-abandoned.
      conflicting = [S for S in RegistrySubmission where S.program_id == new.program_id
                                                    and S.period_start <= new.period_end
                                                    and new.period_start <= S.period_end]
      if conflicting is non-empty: -> ERR_SUBMISSION_PERIOD_OVERLAP (409)
      # Adjacent periods (new.period_start == S.period_end + 1 day) are ACCEPTED.
      # ACCEPTED submissions still block their period - a closed period is not reusable.
    input_set: "All RegistrySubmission rows of the same program in any submission_state"
    constants: {}
    precision: "Whole dates; the overlap test is <= on both sides, so periods sharing a single day conflict"

  - name: workflow_limits
    trigger: "Evaluated by the state-machine preconditions that reference these caps"
    algorithm: threshold
    formula: |
      abstraction.rework_round        < REWORK_ROUND_MAX          else ERR_REWORK_LIMIT_EXCEEDED
      submission.resubmission_round   < RESUBMISSION_ROUND_MAX    else ERR_RESUBMISSION_LIMIT_EXCEEDED
      entry.reopen_count              < ENTRY_REOPEN_MAX          else ERR_ENTRY_NOT_REOPENABLE
      deficiency.escalation_count + 1 >= DEFICIENCY_ESCALATION_MAX -> escalate instead of re-cite
      survey_date >= clock_date + SURVEY_LEAD_DAYS days           else ERR_SURVEY_DATE_TOO_SOON
    input_set: "The single entity being transitioned; no aggregation"
    constants:
      REWORK_ROUND_MAX: 2
      RESUBMISSION_ROUND_MAX: 2
      ENTRY_REOPEN_MAX: 1
      DEFICIENCY_ESCALATION_MAX: 2
      SURVEY_LEAD_DAYS: 60
    precision: "Integer counters compared with strict <, so the round whose counter already equals the cap is the one rejected; survey_date exactly clock_date + 60 days is accepted"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# Priority bands: 1 authentication | 2 authorization | 3 request shape |
#   10-19 existence (path resources left-to-right, then body FKs) |
#   30 optimistic concurrency | 40-49 state preconditions |
#   50-53 safety/compliance | 55-57 temporal | 60-63 referential/constraint |
#   66-67 fiscal (last)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request shape: every field marked required in the endpoint's §1.5 input is present; enum fields carry a declared value; dates are ISO-8601 dates and timestamps ISO-8601 UTC instants; counts and cents are non-negative integers; percentages are numbers in [0, 100]; end bounds are strictly after start bounds (end_at > start_at, period_end >= period_start, window_end >= window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 10
    category: existence
    check: "{programId} in the path resolves to a CancerProgram"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/programs/{programId}/**"

  - priority: 10
    category: existence
    check: "{abstractorId} in the path resolves to an Abstractor"
    error_id: ERR_ABSTRACTOR_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/abstractors/{abstractorId}/**"

  - priority: 10
    category: existence
    check: "{sourceId} in the path resolves to a CasefindingSource"
    error_id: ERR_SOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/casefinding-sources/{sourceId}/**"

  - priority: 10
    category: existence
    check: "{entryId} in the path resolves to a CasefindingEntry"
    error_id: ERR_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/casefinding-entries/{entryId}/**"

  - priority: 10
    category: existence
    check: "{caseId} in the path resolves to a TumorCase"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/cases/{caseId}/**"

  - priority: 10
    category: existence
    check: "{contactId} in the path resolves to a FollowUpContact"
    error_id: ERR_CONTACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /cancer-registry/follow-up-contacts/{contactId}"

  - priority: 10
    category: existence
    check: "{abstractionId} in the path resolves to an Abstraction"
    error_id: ERR_ABSTRACTION_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/abstractions/{abstractionId}/**"

  - priority: 10
    category: existence
    check: "{auditId} in the path resolves to a QaAudit"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/qa-audits/{auditId}/**"

  - priority: 10
    category: existence
    check: "{sessionId} in the path resolves to a ConferenceSession"
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/conference-sessions/{sessionId}/**"

  - priority: 10
    category: existence
    check: "{submissionId} in the path resolves to a RegistrySubmission"
    error_id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/submissions/{submissionId}/**"

  - priority: 10
    category: existence
    check: "{deficiencyId} in the path resolves to a Deficiency"
    error_id: ERR_DEFICIENCY_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/deficiencies/{deficiencyId}/**"

  - priority: 10
    category: existence
    check: "{measureId} in the path resolves to a QualityMeasure"
    error_id: ERR_MEASURE_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /cancer-registry/quality-measures/{measureId}/**"

  - priority: 15
    category: existence
    check: "Body foreign keys resolve to live rows, checked in declaration order: program_id -> CancerProgram, source_id -> CasefindingSource, case_id -> TumorCase, abstractor_id -> Abstractor, entry_id -> CasefindingEntry, source_measure_id -> QualityMeasure. Each unresolved id raises that parent's NOT_FOUND"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /cancer-registry/abstractors, POST /cancer-registry/casefinding-sources, POST /cancer-registry/abstractions, POST /cancer-registry/qa-audits, POST /cancer-registry/conference-sessions, POST /cancer-registry/submissions, POST /cancer-registry/deficiencies, POST /cancer-registry/quality-measures, POST /cancer-registry/cases/{caseId}/assign, POST /cancer-registry/submissions/{submissionId}/items, POST /cancer-registry/cases/{caseId}/follow-up-contacts"

  - priority: 16
    category: existence
    check: "Every case_id inside a submission item_results batch names a SubmissionItem that belongs to {submissionId}; an id that is not on this submission raises ERR_SUBMISSION_ITEM_NOT_FOUND"
    error_id: ERR_SUBMISSION_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /cancer-registry/submissions/{submissionId}/edit-results"

  - priority: 30
    category: business_constraint
    check: "Optimistic concurrency (§1.2.1 abstraction-create-stale-case): expected_case_version equals TumorCase.version. Checked after existence and before any state precondition, so a stale version on a correctly-stated parent still conflicts"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /cancer-registry/abstractions"

  - priority: 30
    category: business_constraint
    check: "Optimistic concurrency (§1.2.1 submission-item-add-stale-submission): expected_submission_version equals RegistrySubmission.version. Checked after existence and before the DRAFT-state precondition, so a stale version on a DRAFT batch still conflicts"
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412
    applies_to: "POST /cancer-registry/submissions/{submissionId}/items"

  - priority: 40
    category: state
    check: "CasefindingEntry.reportability_state == PENDING_REVIEW"
    error_id: ERR_ENTRY_NOT_PENDING_REVIEW
    http_status: 409
    applies_to: "POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision"

  - priority: 40
    category: state
    check: "CasefindingEntry.reportability_state IN {REPORTABLE, NON_REPORTABLE} and reopen_count < ENTRY_REOPEN_MAX"
    error_id: ERR_ENTRY_NOT_REOPENABLE
    http_status: 409
    applies_to: "POST /cancer-registry/casefinding-entries/{entryId}/reopen"

  - priority: 40
    category: state
    check: "TumorCase.case_state == IDENTIFIED (an already-assigned or completed or voided case is not assignable; a reworked case must be re-assigned only after unassign)"
    error_id: ERR_CASE_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/assign"

  - priority: 40
    category: state
    check: "TumorCase.case_state == ASSIGNED and assigned_abstractor_id is not null"
    error_id: ERR_CASE_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/unassign"

  - priority: 40
    category: state
    check: "TumorCase.case_state IN {ASSIGNED, REWORK_PENDING}"
    error_id: ERR_CASE_NOT_ABSTRACTABLE
    http_status: 409
    applies_to: "POST /cancer-registry/abstractions"

  - priority: 40
    category: state
    check: "TumorCase.case_state == COMPLETED"
    error_id: ERR_CASE_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/follow-up-contacts, POST /cancer-registry/submissions/{submissionId}/items, POST /cancer-registry/submissions/{submissionId}/transmit"

  - priority: 40
    category: state
    check: "Abstraction.abstraction_state == DRAFT"
    error_id: ERR_ABSTRACTION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /cancer-registry/abstractions/{abstractionId}/submit-qa"

  - priority: 40
    category: state
    check: "Abstraction.abstraction_state == SUBMITTED_FOR_QA"
    error_id: ERR_ABSTRACTION_NOT_IN_QA
    http_status: 409
    applies_to: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision"

  - priority: 40
    category: state
    check: "Abstraction.abstraction_state == REWORK_REQUIRED"
    error_id: ERR_ABSTRACTION_NOT_REWORKABLE
    http_status: 409
    applies_to: "POST /cancer-registry/abstractions/{abstractionId}/reopen-draft"

  - priority: 40
    category: state
    check: "Abstraction.abstraction_state IN {SUBMITTED_FOR_QA, APPROVED} (a DRAFT, REWORK_REQUIRED, REJECTED or SUPERSEDED abstraction cannot be audited)"
    error_id: ERR_ABSTRACTION_NOT_AUDITABLE
    http_status: 409
    applies_to: "POST /cancer-registry/qa-audits"

  - priority: 40
    category: state
    check: "QaAudit.audit_state == OPEN"
    error_id: ERR_AUDIT_ALREADY_SCORED
    http_status: 409
    applies_to: "POST /cancer-registry/qa-audits/{auditId}/score"

  - priority: 39
    category: state
    check: "QaAudit.audit_state != VOIDED. Ordered ABOVE the OPEN check so scoring a voided audit reports the void, not ERR_AUDIT_ALREADY_SCORED"
    error_id: ERR_AUDIT_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /cancer-registry/qa-audits/{auditId}/score, POST /cancer-registry/qa-audits/{auditId}/void"

  - priority: 40
    category: state
    check: "ConferenceSession.session_state == SCHEDULED"
    error_id: ERR_SESSION_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /cancer-registry/conference-sessions/{sessionId}/attendances, POST /cancer-registry/conference-sessions/{sessionId}/hold"

  - priority: 40
    category: state
    check: "ConferenceSession.session_state == HELD"
    error_id: ERR_SESSION_NOT_HELD
    http_status: 409
    applies_to: "POST /cancer-registry/conference-sessions/{sessionId}/credit"

  - priority: 40
    category: state
    check: "RegistrySubmission.submission_state == DRAFT (a HOLD, TRANSMITTED, EDITS_RETURNED or ACCEPTED submission accepts no new items and cannot be transmitted)"
    error_id: ERR_SUBMISSION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/items, POST /cancer-registry/submissions/{submissionId}/transmit"

  - priority: 40
    category: state
    check: "RegistrySubmission.submission_state == TRANSMITTED"
    error_id: ERR_SUBMISSION_NOT_TRANSMITTED
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/edit-results"

  - priority: 40
    category: state
    check: "RegistrySubmission.submission_state == EDITS_RETURNED"
    error_id: ERR_SUBMISSION_NOT_IN_EDIT_RESOLUTION
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/retransmit, POST /cancer-registry/submissions/{submissionId}/items/{itemId}/resolve"

  - priority: 40
    category: state
    check: "Deficiency.deficiency_state IN {CITED, RESPONSE_REJECTED}"
    error_id: ERR_DEFICIENCY_NOT_RESPONDABLE
    http_status: 409
    applies_to: "POST /cancer-registry/deficiencies/{deficiencyId}/response"

  - priority: 40
    category: state
    check: "Deficiency.deficiency_state == RESPONSE_SUBMITTED"
    error_id: ERR_DEFICIENCY_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /cancer-registry/deficiencies/{deficiencyId}/response-review"

  - priority: 40
    category: state
    check: "CancerProgram.accreditation_state is one the operation declares in §1.2: {ACCREDITED, PROBATION} for survey-schedule, {SURVEY_SCHEDULED} for survey-complete, {DEFICIENCY_RESPONSE, PROBATION} for accreditation-decision. WITHDRAWN is terminal for all three"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /cancer-registry/programs/{programId}/survey-schedule, POST /cancer-registry/programs/{programId}/survey-complete, POST /cancer-registry/programs/{programId}/accreditation-decision"

  - priority: 40
    category: state
    check: "QualityMeasure.measure_state IN {DRAFT, MEASURED, PROJECT_CLOSED_ACHIEVED, PROJECT_CLOSED_MISSED} for evaluate, and == PROJECT_ACTIVE for improvement-project action=CLOSE"
    error_id: ERR_MEASURE_STATE_INVALID
    http_status: 409
    applies_to: "POST /cancer-registry/quality-measures/{measureId}/evaluate, POST /cancer-registry/quality-measures/{measureId}/improvement-project"

  - priority: 41
    category: state
    check: "improvement-project action=OPEN requires measure_state == PROJECT_REQUIRED and performance_state == UNDER_THRESHOLD; a measure that MEETS or EXCEEDS its threshold has no improvement project to open"
    error_id: ERR_PROJECT_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /cancer-registry/quality-measures/{measureId}/improvement-project"

  - priority: 42
    category: state
    check: "Terminal-state lockdown always resolves to the entity's OWN state error, never a generic one: a VOIDED TumorCase -> ERR_CASE_NOT_ASSIGNABLE (assign) or ERR_CASE_NOT_ABSTRACTABLE (abstraction create); a REJECTED or SUPERSEDED Abstraction -> ERR_ABSTRACTION_NOT_DRAFT (submit-qa), ERR_ABSTRACTION_NOT_IN_QA (qa-decision) or ERR_ABSTRACTION_NOT_REWORKABLE (reopen-draft); a VOIDED QaAudit -> ERR_AUDIT_ALREADY_VOIDED; a CREDITED or NOT_CREDITED ConferenceSession -> ERR_SESSION_NOT_HELD (credit) or ERR_SESSION_NOT_SCHEDULED (attendances/hold); an ACCEPTED RegistrySubmission -> ERR_SUBMISSION_NOT_DRAFT (items/transmit) or ERR_SUBMISSION_NOT_IN_EDIT_RESOLUTION (retransmit); a RESOLVED or ESCALATED Deficiency -> ERR_DEFICIENCY_NOT_RESPONDABLE (response) or ERR_DEFICIENCY_NOT_UNDER_REVIEW (response-review); a WITHDRAWN CancerProgram -> ERR_PROGRAM_STATE_INVALID on all three accreditation actions (the error_id below is the representative for that last case)"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "all action endpoints under /cancer-registry"

  - priority: 50
    category: business_safety
    check: "The owning program's registry_posture != FROZEN. A frozen registry accepts no new assignments, no new abstractions, no submission items, no transmits and no retransmits. Deliberately ordered ABOVE every capacity, referential and fiscal check on the same endpoints"
    error_id: ERR_REGISTRY_FROZEN
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/assign, POST /cancer-registry/abstractions, POST /cancer-registry/submissions/{submissionId}/items, POST /cancer-registry/submissions/{submissionId}/transmit, POST /cancer-registry/submissions/{submissionId}/retransmit"

  - priority: 51
    category: business_safety
    check: "When registry_posture == RESTRICTED, the abstractor being assigned must hold credential == CTR (a NON_CTR or TRAINEE abstractor may only receive work while the posture is OPEN)"
    error_id: ERR_RESTRICTED_REQUIRES_CTR
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/assign"

  - priority: 52
    category: business_safety
    check: "Abstractor.employment_status == ACTIVE for the abstractor receiving an assignment, authoring an abstraction, or acting as QA reviewer or auditor"
    error_id: ERR_ABSTRACTOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/assign, POST /cancer-registry/abstractions, POST /cancer-registry/abstractions/{abstractionId}/qa-decision, POST /cancer-registry/qa-audits"

  - priority: 52
    category: business_safety
    check: "Abstractor.certification_expires_on >= the logical clock date for the abstractor receiving an assignment or authoring an abstraction"
    error_id: ERR_ABSTRACTOR_CERTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/assign, POST /cancer-registry/abstractions"

  - priority: 53
    category: business_safety
    check: "Segregation of duties on X-User-ID: the QA reviewer of an abstraction must not be its abstractor_id; the auditor of a QaAudit must not be the abstraction's abstractor_id; the reviewer of a deficiency response must not be the user recorded in the response; the accreditation decision must not be made by the same user who completed the survey"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 409
    applies_to: "POST /cancer-registry/abstractions/{abstractionId}/qa-decision, POST /cancer-registry/qa-audits, POST /cancer-registry/deficiencies/{deficiencyId}/response-review, POST /cancer-registry/programs/{programId}/accreditation-decision"

  - priority: 53
    category: business_safety
    check: "Abstraction.completeness_score >= COMPLETENESS_SUBMIT_MIN (85) and missing_required_fields is empty at submit-qa time"
    error_id: ERR_ABSTRACTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /cancer-registry/abstractions/{abstractionId}/submit-qa"

  - priority: 54
    category: business_safety
    check: "Accreditation with decision=ACCREDIT requires zero open MAJOR/CRITICAL deficiencies for the program"
    error_id: ERR_OPEN_DEFICIENCIES_BLOCK_ACCREDITATION
    http_status: 409
    applies_to: "POST /cancer-registry/programs/{programId}/accreditation-decision"

  - priority: 54
    category: business_safety
    check: "Accreditation with decision=ACCREDIT requires follow_up_rate_coc_pct >= FOLLOW_UP_ACCREDITATION_MIN_PCT (80.0)"
    error_id: ERR_FOLLOW_UP_RATE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /cancer-registry/programs/{programId}/accreditation-decision"

  - priority: 55
    category: business_temporal
    check: "Conference calendar exclusivity per §1.3 conference_slot_overlap: half-open [start_at, end_at) plus a CONFERENCE_BUFFER_MINUTES (30) changeover buffer on both sides, evaluated against every other session of the same program"
    error_id: ERR_CONFERENCE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /cancer-registry/conference-sessions"

  - priority: 55
    category: business_temporal
    check: "Auditor window capacity per §1.3 auditor_window_capacity: closed [window_start, window_end] intervals of the same non-VOIDED auditor may overlap at most AUDITOR_WINDOW_CAPACITY (2) deep; the third overlapping window is rejected"
    error_id: ERR_AUDITOR_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cancer-registry/qa-audits"

  - priority: 56
    category: business_temporal
    check: "Reporting-period exclusivity per §1.3 submission_period_overlap: closed [period_start, period_end] ranges of one program may not intersect in any state"
    error_id: ERR_SUBMISSION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /cancer-registry/submissions"

  - priority: 56
    category: business_temporal
    check: "The logical clock instant is >= session.start_at when holding a session"
    error_id: ERR_SESSION_NOT_YET_STARTED
    http_status: 409
    applies_to: "POST /cancer-registry/conference-sessions/{sessionId}/hold"

  - priority: 56
    category: business_temporal
    check: "survey_date >= logical clock date + SURVEY_LEAD_DAYS (60) days"
    error_id: ERR_SURVEY_DATE_TOO_SOON
    http_status: 422
    applies_to: "POST /cancer-registry/programs/{programId}/survey-schedule"

  - priority: 57
    category: business_temporal
    check: "The logical clock date is <= deficiency.response_due_date when a response is filed"
    error_id: ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /cancer-registry/deficiencies/{deficiencyId}/response"

  - priority: 57
    category: business_temporal
    check: "A decision=REPORTABLE requires CasefindingEntry.diagnosis_date >= January 1 of the program's reference_year. An out-of-year entry is still RECORDED (casefinding lists legitimately surface pre-reference-year diagnoses, which §1.3 reportability_determination suggests NON_REPORTABLE with suggested_reason_code BEFORE_REFERENCE_YEAR); it may only be closed NON_REPORTABLE"
    error_id: ERR_DIAGNOSIS_BEFORE_REFERENCE_YEAR
    http_status: 422
    applies_to: "POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision"

  - priority: 57
    category: business_temporal
    check: "A follow-up contact_date is not in the future relative to the logical clock and is not earlier than the case's diagnosis_date"
    error_id: ERR_CONTACT_DATE_INVALID
    http_status: 422
    applies_to: "POST /cancer-registry/cases/{caseId}/follow-up-contacts"

  - priority: 57
    category: business_temporal
    check: "The requested clock instant is strictly greater than the current logical clock instant (time only moves forward; the startup default is 2026-08-01T00:00:00Z)"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 60
    category: business_referential
    check: "The Abstractor being assigned, authoring, reviewing or auditing belongs to the same program_id as the TumorCase or Abstraction in question"
    error_id: ERR_ABSTRACTOR_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/assign, POST /cancer-registry/abstractions, POST /cancer-registry/abstractions/{abstractionId}/qa-decision, POST /cancer-registry/qa-audits"

  - priority: 60
    category: business_referential
    check: "A case added to a submission belongs to the submission's program_id"
    error_id: ERR_CASE_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/items"

  - priority: 60
    category: business_referential
    check: "The abstractor_id on a new abstraction equals the case's assigned_abstractor_id, and X-User-ID equals that abstractor when the caller's role is RegistryAbstractor"
    error_id: ERR_NOT_ASSIGNED_ABSTRACTOR
    http_status: 403
    applies_to: "POST /cancer-registry/abstractions"

  - priority: 61
    category: business_referential
    check: "A second abstraction for a case whose prior abstraction is not terminal MUST carry supersedes_abstraction_id"
    error_id: ERR_SUPERSEDE_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /cancer-registry/abstractions"

  - priority: 61
    category: business_referential
    check: "supersedes_abstraction_id, when present, names an Abstraction on the same case_id whose abstraction_state IN {DRAFT, REWORK_REQUIRED}"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /cancer-registry/abstractions"

  - priority: 61
    category: business_constraint
    check: "CancerProgram.coc_program_id is unique across all CancerProgram rows"
    error_id: ERR_DUPLICATE_COC_PROGRAM_ID
    http_status: 409
    applies_to: "POST /cancer-registry/programs"

  - priority: 61
    category: business_constraint
    check: "Casefinding uniqueness: (source_id, patient_mrn, primary_site_code, diagnosis_date) is unique across CasefindingEntry rows"
    error_id: ERR_DUPLICATE_CASEFINDING_ENTRY
    http_status: 409
    applies_to: "POST /cancer-registry/casefinding-sources/{sourceId}/entries"

  - priority: 61
    category: business_constraint
    check: "TumorCase.submission_state == NOT_SUBMITTED (a case already carried by another submission cannot be added again)"
    error_id: ERR_CASE_ALREADY_IN_SUBMISSION
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/items"

  - priority: 61
    category: business_constraint
    check: "The submission carries at least one SubmissionItem (total_case_count >= 1) at transmit time"
    error_id: ERR_SUBMISSION_EMPTY
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/transmit"

  - priority: 61
    category: business_constraint
    check: "A quality measure evaluation supplies at least one stratum with eligible_case_count > 0"
    error_id: ERR_MEASURE_STRATA_EMPTY
    http_status: 422
    applies_to: "POST /cancer-registry/quality-measures/{measureId}/evaluate"

  - priority: 61
    category: business_constraint
    check: "attendee_ref is unique within a session's attendances array"
    error_id: ERR_DUPLICATE_ATTENDANCE
    http_status: 409
    applies_to: "POST /cancer-registry/conference-sessions/{sessionId}/attendances"

  - priority: 61
    category: business_constraint
    check: "A reportability decision that contradicts suggested_reportability requires a non-empty override_reason_code"
    error_id: ERR_REPORTABILITY_OVERRIDE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision"

  - priority: 61
    category: business_constraint
    check: "The session's quorum_met is true at credit time (required disciplines present for >= 30 minutes, at least one case presented, prospective ratio >= 0.80)"
    error_id: ERR_CONFERENCE_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /cancer-registry/conference-sessions/{sessionId}/credit"

  - priority: 62
    category: business_constraint
    check: "Abstractor.assigned_open_case_count < round_half_up(productivity_target_cases_per_day * CAPACITY_CAP_MULTIPLIER). Deliberately ordered BELOW ERR_REGISTRY_FROZEN (priority 50) so a frozen registry masks an over-capacity abstractor on the same assign call"
    error_id: ERR_ABSTRACTOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cancer-registry/cases/{caseId}/assign"

  - priority: 62
    category: business_constraint
    check: "Abstraction.rework_round < REWORK_ROUND_MAX (2) when re-entering DRAFT"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /cancer-registry/abstractions/{abstractionId}/reopen-draft"

  - priority: 62
    category: business_constraint
    check: "RegistrySubmission.resubmission_round < RESUBMISSION_ROUND_MAX (2)"
    error_id: ERR_RESUBMISSION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/retransmit"

  - priority: 63
    category: business_constraint
    check: "No SubmissionItem on the submission still has edit_status == EDIT_FAILED (failed_item_count == 0) at retransmit time"
    error_id: ERR_UNRESOLVED_EDITS
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/retransmit"

  - priority: 63
    category: business_constraint
    check: "The SubmissionItem being resolved has edit_status == EDIT_FAILED"
    error_id: ERR_ITEM_NOT_FAILED
    http_status: 409
    applies_to: "POST /cancer-registry/submissions/{submissionId}/items/{itemId}/resolve"

  - priority: 66
    category: business_fiscal
    check: "RegistrySubmission.assessment_due_cents <= assessment_paid_cents before a transmit or retransmit is accepted. Deliberately the LAST check on transmit, so a submission that is both out-of-state and unpaid reports ERR_SUBMISSION_NOT_DRAFT (priority 40), never the fiscal error"
    error_id: ERR_ASSESSMENT_UNPAID
    http_status: 402
    applies_to: "POST /cancer-registry/submissions/{submissionId}/transmit, POST /cancer-registry/submissions/{submissionId}/retransmit"

  - priority: 67
    category: business_fiscal
    check: "A payment amount is a positive integer and does not exceed the outstanding balance (assessment_due_cents - assessment_paid_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /cancer-registry/submissions/{submissionId}/assessment-payments"

# =============================================================================
# 1.5 API Endpoint Table
# All business collections sit exactly one level under the api_prefix
# (/cancer-registry/<collection>), each with a detail GET and a filtered list
# GET carrying every inbound FK as an optional filter (reverse reachability).
# =============================================================================
endpoints:
  # --- CancerProgram -------------------------------------------------------
  - method: POST
    path: "/cancer-registry/programs"
    description: "Register a Commission-on-Cancer accredited program. Starts in accreditation_state=ACCREDITED, registry_posture=OPEN, all aggregates zero"
    roles: [PlatformAdmin]
    code: 201
    input: [name, coc_program_id, annual_analytic_caseload, reference_year, "timeliness_standard_days?"]
    output: CancerProgram
    side_effects:
      - "sets accreditation_state=ACCREDITED, registry_posture=OPEN, next_survey_due_year = reference_year + 3"
      - "computes required_sessions_12mo from annual_analytic_caseload (§1.3 conference_compliance)"

  - method: GET
    path: "/cancer-registry/programs"
    description: "List programs"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["accreditation_state?", "registry_posture?", "limit?", "offset?"]
    output: CancerProgram[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/programs/{programId}"
    description: "Read one program including every derived compliance aggregate"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: CancerProgram
    side_effects: []

  - method: GET
    path: "/cancer-registry/programs/{programId}/compliance-summary"
    description: "Computed read: recomputes and returns the program's follow-up rates, conference compliance flags, backlog counts and registry_posture without mutating workflow state"
    roles: [PlatformAdmin, RegistryManager, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["follow_up_variant?"]
    output: CancerProgram
    side_effects:
      - "recomputes follow_up_rate_coc_pct / follow_up_rate_state_pct / lost_to_follow_up_pct (§1.3 follow_up_rate)"
      - "follow_up_variant selects which variant lost_to_follow_up_pct is reported from: coc_five_year (the default when the parameter is absent) reports the CoC complement per §1.3, state_central_all_years reports 100.0 - follow_up_rate_state_pct. Both rate fields are always returned regardless of the parameter; an unrecognised value is ERR_INVALID_REQUEST (priority 10)"
      - "recomputes credited_sessions_12mo, required_sessions_12mo, conference_frequency_compliant, coordinator_attendance_compliant"
      - "recomputes identified_case_count, open_backlog_count, overdue_backlog_count and registry_posture"

  - method: POST
    path: "/cancer-registry/programs/{programId}/survey-schedule"
    description: "Schedule the accreditation survey; ACCREDITED|PROBATION -> SURVEY_SCHEDULED"
    roles: [AccreditationCoordinator]
    code: 200
    input: [survey_date]
    output: CancerProgram
    side_effects:
      - "accreditation_state -> SURVEY_SCHEDULED, survey_date and survey_year stored"
      - "enforces survey_date >= clock_date + SURVEY_LEAD_DAYS (ERR_SURVEY_DATE_TOO_SOON)"

  - method: POST
    path: "/cancer-registry/programs/{programId}/survey-complete"
    description: "Record survey completion; branches back to ACCREDITED or into DEFICIENCY_RESPONSE depending on open MAJOR/CRITICAL deficiencies"
    roles: [CoCSurveyor]
    code: 200
    input: [completed_on, "surveyor_note?"]
    output: CancerProgram
    side_effects:
      - "accreditation_state -> ACCREDITED when zero open MAJOR/CRITICAL deficiencies, else DEFICIENCY_RESPONSE"
      - "records the acting X-User-ID as the surveyor for the segregation-of-duties check on accreditation-decision"

  - method: POST
    path: "/cancer-registry/programs/{programId}/accreditation-decision"
    description: "Render the accreditation decision (ACCREDIT | PROBATION | WITHDRAW)"
    roles: [CoCSurveyor]
    code: 200
    input: [decision, "decision_note?"]
    output: CancerProgram
    side_effects:
      - "ACCREDIT -> ACCREDITED and next_survey_due_year = survey_year + 3; PROBATION -> PROBATION; WITHDRAW -> WITHDRAWN (terminal)"
      - "recomputes registry_posture; entering PROBATION/WITHDRAWN forces posture FROZEN and moves every DRAFT submission of the program to HOLD"
      - "ACCREDIT is gated by ERR_OPEN_DEFICIENCIES_BLOCK_ACCREDITATION and ERR_FOLLOW_UP_RATE_BELOW_THRESHOLD"

  # --- Abstractor ----------------------------------------------------------
  - method: POST
    path: "/cancer-registry/abstractors"
    description: "Create a registrar/abstractor for a program"
    roles: [RegistryManager]
    code: 201
    input: [program_id, name, credential, productivity_target_cases_per_day, certification_expires_on]
    output: Abstractor
    side_effects:
      - "employment_status defaults to ACTIVE; assigned_open_case_count, lifetime_discrepancy_points, audit_fail_streak, completed_cases_30d default to 0"
      - "quality_score_rolling_90d and quality_score_cumulative default to 100.0; productivity_rate_per_day = 0.0 so productivity_status starts at BELOW"

  - method: GET
    path: "/cancer-registry/abstractors"
    description: "List abstractors, filterable by owning program, credential and employment status"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["program_id?", "credential?", "employment_status?", "limit?", "offset?"]
    output: Abstractor[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/abstractors/{abstractorId}"
    description: "Read one abstractor including both quality-score variants and productivity fields"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: Abstractor
    side_effects: []

  - method: POST
    path: "/cancer-registry/abstractors/{abstractorId}/employment-status"
    description: "Change employment status; leaving ACTIVE releases every open case back to IDENTIFIED and voids their in-flight abstractions"
    roles: [RegistryManager]
    code: 200
    input: [employment_status, "effective_on?", "reason?"]
    output: Abstractor
    side_effects:
      - "on TERMINATED | SUSPENDED_FROM_ABSTRACTING | LOA: every TumorCase assigned to this abstractor in {ASSIGNED, IN_ABSTRACTION, QA_PENDING, REWORK_PENDING} -> IDENTIFIED with assigned_abstractor_id=null (ascending created_at)"
      - "any Abstraction on a released case in DRAFT or REWORK_REQUIRED -> REJECTED; assigned_open_case_count -> 0"
      - "recomputes the program's backlog counts and registry_posture (workload_conservation invariant re-holds)"

  # --- CasefindingSource ---------------------------------------------------
  - method: POST
    path: "/cancer-registry/casefinding-sources"
    description: "Register a casefinding source (pathology log, disease index, radiation oncology log, HIM discharge list)"
    roles: [RegistryManager]
    code: 201
    input: [program_id, source_type, expected_monthly_volume]
    output: CasefindingSource
    side_effects:
      - "entries_this_month = 0 and casefinding_completeness_pct = 0.0 (or 100.0 when expected_monthly_volume is 0)"

  - method: GET
    path: "/cancer-registry/casefinding-sources"
    description: "List casefinding sources, filterable by owning program"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["program_id?", "source_type?", "limit?", "offset?"]
    output: CasefindingSource[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/casefinding-sources/{sourceId}"
    description: "Read one casefinding source with its reconciliation completeness"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: CasefindingSource
    side_effects: []

  - method: POST
    path: "/cancer-registry/casefinding-sources/{sourceId}/entries"
    description: "Add a casefinding-list entry; the system suggests reportability and class of case but does not decide"
    roles: [RegistryManager, RegistryAbstractor]
    code: 201
    input: [patient_mrn, accession_date, primary_site_code, histology_code, behavior_code, diagnosis_date, first_contact_date, diagnosed_at_facility, first_treatment_at_facility, "ambiguous_terminology_flag?", "referral_lag_days?"]
    output: CasefindingEntry
    side_effects:
      - "program_id copied from the source; reportability_state = PENDING_REVIEW"
      - "computes suggested_reportability / suggested_reason_code (§1.3 reportability_determination)"
      - "computes class_of_case_code and analytic_flag (§1.3 class_of_case_determination, REFERRAL_ANALYTIC_MAX_DAYS boundary)"
      - "recomputes the source's entries_this_month and casefinding_completeness_pct"

  # --- CasefindingEntry ----------------------------------------------------
  - method: GET
    path: "/cancer-registry/casefinding-entries"
    description: "List casefinding entries; reverse-reachability list for source_id, program_id and created_case_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["source_id?", "program_id?", "created_case_id?", "reportability_state?", "class_of_case_code?", "limit?", "offset?"]
    output: CasefindingEntry[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/casefinding-entries/{entryId}"
    description: "Read one casefinding entry with its suggested and decided reportability"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: CasefindingEntry
    side_effects: []

  - method: POST
    path: "/cancer-registry/casefinding-entries/{entryId}/reportability-decision"
    description: "Decide reportability. decision=REPORTABLE mints the TumorCase and returns the entry carrying created_case_id; decision=NON_REPORTABLE closes the entry"
    roles: [RegistryManager, RegistryAbstractor]
    code: 200
    input: [decision, decision_reason_code, "override_reason_code?"]
    output: CasefindingEntry
    side_effects:
      - "reportability_state -> REPORTABLE or NON_REPORTABLE; decided_by_user_id = X-User-ID"
      - "REPORTABLE: creates a TumorCase in case_state=IDENTIFIED / submission_state=NOT_SUBMITTED with abstract_due_date = first_contact_date + program.timeliness_standard_days, and stores its id in created_case_id"
      - "recomputes program.identified_case_count, open_backlog_count, overdue_backlog_count and registry_posture"
      - "a decision contradicting suggested_reportability requires override_reason_code (ERR_REPORTABILITY_OVERRIDE_REASON_REQUIRED)"

  - method: POST
    path: "/cancer-registry/casefinding-entries/{entryId}/reopen"
    description: "Compensating action: reopen a decided entry for re-review, voiding any case it created"
    roles: [RegistryManager]
    code: 200
    input: [reopen_reason]
    output: CasefindingEntry
    side_effects:
      - "reportability_state -> PENDING_REVIEW, reopen_count += 1, decision_reason_code / override_reason_code / decided_by_user_id cleared"
      - "any created TumorCase -> VOIDED (only reachable while it is still IDENTIFIED or ASSIGNED, so no abstraction exists yet), created_case_id -> null"
      - "the previously-assigned abstractor's assigned_open_case_count is decremented by 1 (workload_conservation invariant re-holds)"
      - "recomputes program.identified_case_count, backlog counts and registry_posture"

  # --- TumorCase -----------------------------------------------------------
  - method: GET
    path: "/cancer-registry/cases"
    description: "List tumor cases; reverse-reachability list for program_id, entry_id and assigned_abstractor_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["program_id?", "entry_id?", "assigned_abstractor_id?", "case_state?", "submission_state?", "timeliness_status?", "follow_up_status?", "limit?", "offset?"]
    output: TumorCase[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/cases/{caseId}"
    description: "Read one tumor case with both state dimensions, timeliness and follow-up status"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: TumorCase
    side_effects: []

  - method: POST
    path: "/cancer-registry/cases/{caseId}/assign"
    description: "Assign the case to an abstractor; IDENTIFIED -> ASSIGNED"
    roles: [RegistryManager]
    code: 200
    input: [abstractor_id]
    output: TumorCase
    side_effects:
      - "case_state -> ASSIGNED, assigned_abstractor_id set, version incremented by 1"
      - "abstractor.assigned_open_case_count += 1 (capacity cap enforced first, §1.3 abstractor_capacity_cap)"
      - "recomputes timeliness_status / days_to_due against the logical clock"

  - method: POST
    path: "/cancer-registry/cases/{caseId}/unassign"
    description: "Compensating action: release an assigned case back to the unassigned pool; ASSIGNED -> IDENTIFIED"
    roles: [RegistryManager]
    code: 200
    input: ["unassign_reason?"]
    output: TumorCase
    side_effects:
      - "case_state -> IDENTIFIED, assigned_abstractor_id -> null, version incremented by 1"
      - "abstractor.assigned_open_case_count -= 1 (workload_conservation invariant re-holds)"

  - method: POST
    path: "/cancer-registry/cases/{caseId}/follow-up-contacts"
    description: "Record an annual follow-up contact on a completed case"
    roles: [RegistryManager, RegistryAbstractor]
    code: 201
    input: [contact_date, contact_method, outcome, vital_status_at_contact]
    output: FollowUpContact
    side_effects:
      - "case.last_contact_date = max(existing, contact_date); case.vital_status = vital_status_at_contact"
      - "counts_for_follow_up = true when outcome IN {CONTACT_MADE, DECEASED}, else false"
      - "recomputes case.follow_up_due_date and follow_up_status (§1.3 case_follow_up_status)"
      - "recomputes program.follow_up_rate_coc_pct / follow_up_rate_state_pct / lost_to_follow_up_pct and registry_posture"

  - method: GET
    path: "/cancer-registry/follow-up-contacts/{contactId}"
    description: "Read one follow-up contact"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: FollowUpContact
    side_effects: []

  - method: GET
    path: "/cancer-registry/follow-up-contacts"
    description: "List follow-up contacts; reverse-reachability list for case_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["case_id?", "outcome?", "limit?", "offset?"]
    output: FollowUpContact[]
    side_effects: []

  # --- Abstraction ---------------------------------------------------------
  - method: POST
    path: "/cancer-registry/abstractions"
    description: "Create an abstraction for an assigned case (OCC on the case's version, §1.2.1). Conditionally-required stage/treatment/outcome fields are optional at the API boundary and drive completeness scoring"
    roles: [RegistryAbstractor]
    code: 201
    input: [case_id, abstractor_id, expected_case_version, stage_source, "t_category?", "n_category?", "m_category?", "stage_group?", "first_treatment_date?", "treatment_modalities?", "radiation_start_date?", "diagnostic_confirmation_code?", "outcome_status?", "last_contact_date?", "supersedes_abstraction_id?"]
    output: Abstraction
    side_effects:
      - "abstraction_state = DRAFT, rework_round inherited from the superseded abstraction (else 0)"
      - "computes missing_required_fields and completeness_score (§1.3 abstraction_completeness)"
      - "case_state ASSIGNED -> IN_ABSTRACTION, or REWORK_PENDING -> IN_ABSTRACTION when supersedes_abstraction_id is set"
      - "increments TumorCase.version by 1"
      - "supersedes_abstraction_id, when given, moves that abstraction to SUPERSEDED"

  - method: GET
    path: "/cancer-registry/abstractions"
    description: "List abstractions; reverse-reachability list for case_id, abstractor_id and supersedes_abstraction_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["case_id?", "abstractor_id?", "supersedes_abstraction_id?", "abstraction_state?", "limit?", "offset?"]
    output: Abstraction[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/abstractions/{abstractionId}"
    description: "Read one abstraction with its completeness score and missing-field list"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: Abstraction
    side_effects: []

  - method: POST
    path: "/cancer-registry/abstractions/{abstractionId}/submit-qa"
    description: "Submit a DRAFT abstraction for QA review; blocked while completeness is short"
    roles: [RegistryAbstractor]
    code: 200
    input: ["submit_note?"]
    output: Abstraction
    side_effects:
      - "abstraction_state -> SUBMITTED_FOR_QA, submitted_at = logical clock instant"
      - "case_state IN_ABSTRACTION -> QA_PENDING; TumorCase.version incremented by 1"
      - "requires completeness_score >= COMPLETENESS_SUBMIT_MIN and an empty missing_required_fields (ERR_ABSTRACTION_INCOMPLETE)"

  - method: POST
    path: "/cancer-registry/abstractions/{abstractionId}/qa-decision"
    description: "QA verdict on a submitted abstraction (APPROVED | REWORK_REQUIRED | REJECTED); segregation of duties applies"
    roles: [QaReviewer]
    code: 200
    input: [verdict, "reviewer_note?"]
    output: Abstraction
    side_effects:
      - "APPROVED: abstraction_state -> APPROVED, approved_at set, qa_reviewer_user_id = X-User-ID; case_state -> COMPLETED with completed_on and timeliness_status recomputed; abstractor.assigned_open_case_count -= 1 and completed_cases_30d/productivity_rate_per_day/productivity_status recomputed; program aggregates and registry_posture recomputed; a posture leaving FROZEN releases HOLD submissions back to DRAFT (cascade depth 4)"
      - "REWORK_REQUIRED: abstraction_state -> REWORK_REQUIRED, case_state QA_PENDING -> IN_ABSTRACTION, assigned_abstractor_id unchanged"
      - "REJECTED: abstraction_state -> REJECTED (terminal), case_state -> IDENTIFIED, assigned_abstractor_id -> null, assigned_open_case_count -= 1"
      - "TumorCase.version incremented by 1 on every verdict"

  - method: POST
    path: "/cancer-registry/abstractions/{abstractionId}/reopen-draft"
    description: "Re-enter DRAFT after a rework verdict, closing the abstraction cycle; capped by REWORK_ROUND_MAX"
    roles: [RegistryAbstractor]
    code: 200
    input: ["stage_source?", "t_category?", "n_category?", "m_category?", "stage_group?", "first_treatment_date?", "treatment_modalities?", "radiation_start_date?", "diagnostic_confirmation_code?", "outcome_status?", "last_contact_date?"]
    output: Abstraction
    side_effects:
      - "abstraction_state REWORK_REQUIRED -> DRAFT, rework_round += 1 (ERR_REWORK_LIMIT_EXCEEDED at the cap)"
      - "any supplied field is applied, then missing_required_fields and completeness_score are recomputed"
      - "case_state REWORK_PENDING -> IN_ABSTRACTION; TumorCase.version incremented by 1"

  # --- QaAudit -------------------------------------------------------------
  - method: POST
    path: "/cancer-registry/qa-audits"
    description: "Open a re-abstraction audit over an audit window; the auditor may not be the abstraction's own abstractor and may hold at most AUDITOR_WINDOW_CAPACITY overlapping windows"
    roles: [QaReviewer, RegistryManager]
    code: 201
    input: [abstraction_id, auditor_id, audit_type, window_start, window_end]
    output: QaAudit
    side_effects:
      - "audit_state = OPEN; discrepancy counts and weighted_error_score default to 0; verdict null; cascade_applied = false"
      - "enforces closed-interval overlap capacity per §1.3 auditor_window_capacity (ERR_AUDITOR_WINDOW_CAPACITY_EXCEEDED)"

  - method: GET
    path: "/cancer-registry/qa-audits"
    description: "List QA audits; reverse-reachability list for abstraction_id and auditor_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["abstraction_id?", "auditor_id?", "audit_state?", "verdict?", "limit?", "offset?"]
    output: QaAudit[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/qa-audits/{auditId}"
    description: "Read one audit with its weighted error score and verdict"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: QaAudit
    side_effects: []

  - method: POST
    path: "/cancer-registry/qa-audits/{auditId}/score"
    description: "Score an OPEN audit; the verdict branches the audit to CLOSED_PASS or CLOSED_FAIL and a CRITICAL_FAIL cascades the approved abstraction back into rework"
    roles: [QaReviewer]
    code: 200
    input: [audited_field_count, minor_discrepancy_count, major_discrepancy_count, critical_discrepancy_count]
    output: QaAudit
    side_effects:
      - "computes weighted_error_score and verdict (§1.3 audit_weighted_error_score); scored_at = logical clock instant"
      - "audit_state -> CLOSED_PASS on PASS, CLOSED_FAIL on MINOR_FAIL or CRITICAL_FAIL"
      - "abstractor.lifetime_discrepancy_points += weighted_error_score; quality_score_rolling_90d and quality_score_cumulative recomputed (§1.3 abstractor_quality_score)"
      - "non-PASS increments audit_fail_streak; PASS resets it to 0; reaching AUDIT_FAIL_STREAK_SUSPEND suspends the abstractor and releases their open cases"
      - "CRITICAL_FAIL only: cascade_applied = true, abstraction APPROVED -> REWORK_REQUIRED, case COMPLETED -> REWORK_PENDING with completed_on cleared, assigned_open_case_count += 1, program aggregates/posture recomputed, DRAFT submissions -> HOLD (cascade depth 4)"

  - method: POST
    path: "/cancer-registry/qa-audits/{auditId}/void"
    description: "Compensating action: void an audit, reversing its score contribution and any rework cascade it applied"
    roles: [RegistryManager]
    code: 200
    input: [void_reason]
    output: QaAudit
    side_effects:
      - "audit_state -> VOIDED (terminal); the window slot is released for auditor capacity purposes"
      - "if the audit had been scored: abstractor.lifetime_discrepancy_points -= weighted_error_score and both quality scores are recomputed (discrepancy_points_conservation invariant re-holds)"
      - "if cascade_applied was true: abstraction REWORK_REQUIRED -> APPROVED, case REWORK_PENDING -> COMPLETED with completed_on restored, assigned_open_case_count -= 1, program aggregates/posture recomputed"
      - "audit_fail_streak recomputed from the remaining non-VOIDED audits"

  # --- ConferenceSession ---------------------------------------------------
  - method: POST
    path: "/cancer-registry/conference-sessions"
    description: "Schedule a multidisciplinary cancer conference on the program calendar; half-open interval plus a 30-minute changeover buffer"
    roles: [AccreditationCoordinator, RegistryManager]
    code: 201
    input: [program_id, start_at, end_at, required_disciplines]
    output: ConferenceSession
    side_effects:
      - "session_state = SCHEDULED; attendances = [], cases_presented_count = 0, prospective_case_count = 0, prospective_case_ratio = 0.0, quorum_met = false"
      - "enforces calendar exclusivity per §1.3 conference_slot_overlap (ERR_CONFERENCE_SLOT_CONFLICT)"

  - method: GET
    path: "/cancer-registry/conference-sessions"
    description: "List conference sessions; reverse-reachability list for program_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["program_id?", "session_state?", "limit?", "offset?"]
    output: ConferenceSession[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/conference-sessions/{sessionId}"
    description: "Read one session with its attendances array and quorum flag"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: ConferenceSession
    side_effects: []

  - method: POST
    path: "/cancer-registry/conference-sessions/{sessionId}/attendances"
    description: "Record one attendance on a SCHEDULED session; attendee_ref is unique within the session"
    roles: [AccreditationCoordinator]
    code: 200
    input: [attendee_ref, discipline, attended_minutes, "is_required_coordinator?"]
    output: ConferenceSession
    side_effects:
      - "appends {attendee_ref, discipline, is_required_coordinator, attended_minutes} to attendances"
      - "recomputes quorum_met via §1.3 conference_quorum (still false while cases_presented_count is 0)"

  - method: POST
    path: "/cancer-registry/conference-sessions/{sessionId}/hold"
    description: "Hold the session and record what was presented; SCHEDULED -> HELD"
    roles: [AccreditationCoordinator]
    code: 200
    input: [cases_presented_count, prospective_case_count]
    output: ConferenceSession
    side_effects:
      - "session_state -> HELD; counts recorded; prospective_case_ratio and quorum_met recomputed"
      - "requires the logical clock to have reached start_at (ERR_SESSION_NOT_YET_STARTED)"

  - method: POST
    path: "/cancer-registry/conference-sessions/{sessionId}/credit"
    description: "Award or withhold standard credit for a held session (disposition = CREDIT | NO_CREDIT)"
    roles: [AccreditationCoordinator]
    code: 200
    input: [disposition, "credit_note?"]
    output: ConferenceSession
    side_effects:
      - "CREDIT: session_state -> CREDITED with credited_on = clock date; requires quorum_met (ERR_CONFERENCE_QUORUM_NOT_MET)"
      - "NO_CREDIT: session_state -> NOT_CREDITED, credited_on stays null"
      - "recomputes program.credited_sessions_12mo / required_sessions_12mo / conference_frequency_compliant / coordinator_attendance_compliant (§1.3 conference_compliance)"

  # --- RegistrySubmission / SubmissionItem ---------------------------------
  - method: POST
    path: "/cancer-registry/submissions"
    description: "Open a state central registry submission for a closed reporting period; periods may not overlap within a program"
    roles: [RegistryManager]
    code: 201
    input: [program_id, period_start, period_end, deadline_date]
    output: RegistrySubmission
    side_effects:
      - "submission_state = DRAFT (or HOLD immediately when the program's registry_posture is already FROZEN, with pre_hold_state=DRAFT)"
      - "counters zeroed: total_case_count, accepted_item_count, failed_item_count, resubmission_round, late_case_count, assessment_due_cents, assessment_paid_cents; relief_pct = 0.0"
      - "enforces closed-period exclusivity per §1.3 submission_period_overlap (ERR_SUBMISSION_PERIOD_OVERLAP)"

  - method: GET
    path: "/cancer-registry/submissions"
    description: "List submissions; reverse-reachability list for program_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["program_id?", "submission_state?", "limit?", "offset?"]
    output: RegistrySubmission[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/submissions/{submissionId}"
    description: "Read one submission with its edit-resolution counters and assessment ledger"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: RegistrySubmission
    side_effects: []

  - method: POST
    path: "/cancer-registry/submissions/{submissionId}/items"
    description: "Add a completed case to a DRAFT submission (OCC on the submission's version, §1.2.1)"
    roles: [RegistryManager, RegistryAbstractor]
    code: 201
    input: [case_id, expected_submission_version]
    output: SubmissionItem
    side_effects:
      - "creates a SubmissionItem with edit_status = PENDING and empty edit_codes"
      - "case.submission_state NOT_SUBMITTED -> PENDING_SUBMISSION"
      - "submission.total_case_count += 1 and increments RegistrySubmission.version by 1"

  - method: GET
    path: "/cancer-registry/submission-items"
    description: "List submission items; reverse-reachability list for submission_id and case_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["submission_id?", "case_id?", "edit_status?", "limit?", "offset?"]
    output: SubmissionItem[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/submission-items/{itemId}"
    description: "Read one submission item with its edit codes"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: SubmissionItem
    side_effects: []

  - method: POST
    path: "/cancer-registry/submissions/{submissionId}/transmit"
    description: "Transmit the submission to the state central registry; DRAFT -> TRANSMITTED"
    roles: [RegistryManager]
    code: 200
    input: ["transmit_note?"]
    output: RegistrySubmission
    side_effects:
      - "submission_state -> TRANSMITTED, transmitted_at = logical clock instant; version incremented by 1"
      - "every SubmissionItem stays edit_status = PENDING (no results returned yet) and each item's case.submission_state PENDING_SUBMISSION -> SUBMITTED"
      - "cross-entity gate: every item's case must be case_state COMPLETED (ERR_CASE_NOT_COMPLETED); a frozen registry blocks the call (ERR_REGISTRY_FROZEN) and an outstanding assessment blocks it last (ERR_ASSESSMENT_UNPAID)"

  - method: POST
    path: "/cancer-registry/submissions/{submissionId}/edit-results"
    description: "Record the state registry's edit results per item; all-accepted closes the submission, any failure returns it for edit resolution"
    roles: [StateRegistryLiaison]
    code: 200
    input: [item_results]
    output: RegistrySubmission
    side_effects:
      - "per item: edit_status -> ACCEPTED or EDIT_FAILED with edit_codes stored; the case's submission_state -> ACCEPTED or EDIT_REJECTED"
      - "accepted_item_count / failed_item_count / edit_error_codes recomputed"
      - "computes late_case_count, relief_pct and assessment_due_cents (§1.3 submission_assessment, tier keyed on the pre-relief subtotal)"
      - "submission_state -> ACCEPTED when every item accepted, else EDITS_RETURNED; version incremented by 1"

  - method: POST
    path: "/cancer-registry/submissions/{submissionId}/items/{itemId}/resolve"
    description: "Resolve one failed item's edits during edit resolution; EDIT_FAILED -> RESOLVED"
    roles: [RegistryAbstractor, RegistryManager]
    code: 200
    input: [resolution_note]
    output: SubmissionItem
    side_effects:
      - "item.edit_status -> RESOLVED, resolution_note stored, edit_codes retained for audit"
      - "submission.failed_item_count -= 1; the case dimension stays EDIT_REJECTED until the batch is retransmitted"

  - method: POST
    path: "/cancer-registry/submissions/{submissionId}/retransmit"
    description: "Retransmit after every failed item is resolved; EDITS_RETURNED -> TRANSMITTED, capped by RESUBMISSION_ROUND_MAX"
    roles: [RegistryManager]
    code: 200
    input: ["retransmit_note?"]
    output: RegistrySubmission
    side_effects:
      - "submission_state -> TRANSMITTED, resubmission_round += 1, transmitted_at updated; version incremented by 1"
      - "every RESOLVED item returns to PENDING and its case.submission_state EDIT_REJECTED -> SUBMITTED"
      - "blocked by ERR_UNRESOLVED_EDITS, ERR_RESUBMISSION_LIMIT_EXCEEDED, ERR_REGISTRY_FROZEN and finally ERR_ASSESSMENT_UNPAID"

  - method: POST
    path: "/cancer-registry/submissions/{submissionId}/assessment-payments"
    description: "Pay down the late-reporting assessment so a retransmit can proceed"
    roles: [RegistryManager, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: RegistrySubmission
    side_effects:
      - "assessment_paid_cents += amount_cents; rejected when it would exceed assessment_due_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
      - "does not change submission_state"

  # --- Deficiency ----------------------------------------------------------
  - method: POST
    path: "/cancer-registry/deficiencies"
    description: "Cite a standard deficiency against the program; the response window is derived from severity"
    roles: [CoCSurveyor]
    code: 201
    input: [program_id, standard_code, severity, cited_on, "evidence_reference?", "source_measure_id?"]
    output: Deficiency
    side_effects:
      - "deficiency_state = CITED, escalation_count = 0; response_due_date = cited_on + severity window (§1.3 deficiency_response_window)"
      - "a CRITICAL citation recomputes program.open_critical_deficiency_count and forces registry_posture FROZEN, moving DRAFT submissions to HOLD"

  - method: GET
    path: "/cancer-registry/deficiencies"
    description: "List deficiencies; reverse-reachability list for program_id and source_measure_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["program_id?", "source_measure_id?", "severity?", "deficiency_state?", "limit?", "offset?"]
    output: Deficiency[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/deficiencies/{deficiencyId}"
    description: "Read one deficiency with its response window and escalation count"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: Deficiency
    side_effects: []

  - method: POST
    path: "/cancer-registry/deficiencies/{deficiencyId}/response"
    description: "File the program's corrective-action response inside the response window"
    roles: [AccreditationCoordinator]
    code: 200
    input: [response_narrative, "evidence_reference?"]
    output: Deficiency
    side_effects:
      - "deficiency_state CITED|RESPONSE_REJECTED -> RESPONSE_SUBMITTED; narrative and evidence stored; the responding X-User-ID is retained for segregation of duties"
      - "blocked once the logical clock passes response_due_date (ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED)"

  - method: POST
    path: "/cancer-registry/deficiencies/{deficiencyId}/response-review"
    description: "Surveyor review of a filed response (ACCEPTED | REJECTED); repeated rejection escalates the deficiency and puts the program on probation"
    roles: [CoCSurveyor]
    code: 200
    input: [outcome, "reviewer_notes?"]
    output: Deficiency
    side_effects:
      - "ACCEPTED: deficiency_state -> RESOLVED (terminal); open_critical_deficiency_count recomputed; a posture leaving FROZEN restores HOLD submissions to pre_hold_state"
      - "REJECTED below the cap: deficiency_state -> RESPONSE_REJECTED, escalation_count += 1, response_due_date extended by DEFICIENCY_REJECT_EXTENSION_DAYS"
      - "REJECTED at the cap: deficiency_state -> ESCALATED (terminal), program.accreditation_state -> PROBATION, registry_posture -> FROZEN, every DRAFT submission -> HOLD (cascade C, depth 4)"

  # --- QualityMeasure ------------------------------------------------------
  - method: POST
    path: "/cancer-registry/quality-measures"
    description: "Register a CoC quality measure for a measurement year with its accountability threshold"
    roles: [RegistryManager, AccreditationCoordinator]
    code: 201
    input: [program_id, measure_code, measurement_year, threshold_pct]
    output: QualityMeasure
    side_effects:
      - "measure_state = DRAFT; strata = [], included_strata_count = 0, performance_rate_pct and pooled_rate_pct null, performance_state null"

  - method: GET
    path: "/cancer-registry/quality-measures"
    description: "List quality measures; reverse-reachability list for program_id"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: ["program_id?", "measure_code?", "measurement_year?", "measure_state?", "performance_state?", "limit?", "offset?"]
    output: QualityMeasure[]
    side_effects: []

  - method: GET
    path: "/cancer-registry/quality-measures/{measureId}"
    description: "Read one measure with both the stratified accountability rate and the pooled rate"
    roles: [PlatformAdmin, RegistryManager, RegistryAbstractor, QaReviewer, AccreditationCoordinator, StateRegistryLiaison, CoCSurveyor]
    code: 200
    input: []
    output: QualityMeasure
    side_effects: []

  - method: POST
    path: "/cancer-registry/quality-measures/{measureId}/evaluate"
    description: "Evaluate the measure from a stratified numerator/denominator set; stores both the stratified mean-of-rounded-rates and the pooled ratio"
    roles: [RegistryManager, AccreditationCoordinator]
    code: 200
    input: [strata]
    output: QualityMeasure
    side_effects:
      - "strata stored; zero-eligible strata excluded; included_strata_count set (ERR_MEASURE_STRATA_EMPTY when none remain)"
      - "performance_rate_pct, pooled_rate_pct and performance_state computed (§1.3 quality_measure_performance)"
      - "measure_state -> MEASURED when performance_state IN {MEETS, EXCEEDS}, or -> PROJECT_REQUIRED when performance_state == UNDER_THRESHOLD"

  - method: POST
    path: "/cancer-registry/quality-measures/{measureId}/improvement-project"
    description: "Open or close a performance-improvement project on an under-threshold measure (action = OPEN | CLOSE)"
    roles: [AccreditationCoordinator]
    code: 200
    input: [action, "project_title?", "target_rate_pct?", "final_rate_pct?"]
    output: QualityMeasure
    side_effects:
      - "OPEN: measure_state PROJECT_REQUIRED -> PROJECT_ACTIVE with project_title and target_rate_pct stored; requires performance_state == UNDER_THRESHOLD (ERR_PROJECT_NOT_REQUIRED)"
      - "CLOSE with final_rate_pct >= threshold_pct: measure_state -> PROJECT_CLOSED_ACHIEVED, performance_state recomputed from final_rate_pct"
      - "CLOSE with final_rate_pct < threshold_pct: measure_state -> PROJECT_CLOSED_MISSED and a MAJOR Deficiency is auto-cited against the program with source_measure_id set to this measure (cascade depth 3)"

  # --- test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default; it never falls back to wall-clock time). Time may only move forward (ERR_CLOCK_NOT_MONOTONIC)"
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "recomputes every TumorCase.timeliness_status / days_to_due and follow_up_status/follow_up_due_date"
      - "recomputes each CasefindingSource.entries_this_month / casefinding_completeness_pct / last_reconciled_through"
      - "recomputes program follow-up rates, conference compliance flags, backlog counts and registry_posture"
      - "escalates every Deficiency whose response_due_date has passed while still CITED (ESCALATED, program -> PROBATION, posture FROZEN, DRAFT submissions -> HOLD); a RESPONSE_REJECTED deficiency past its extended due date is NOT swept and instead fails its next response with ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / request shape ------------------------------------------------
  - id: ERR_UNAUTHORIZED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "The acting role is not listed for the called endpoint in §1.5"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, undeclared enum value, malformed date/timestamp, negative count or cents, percentage outside [0, 100], or an end bound not after its start bound (including prospective_case_count > cases_presented_count)"

  # --- existence -----------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "{programId} or a body program_id does not resolve to a CancerProgram"
  - id: ERR_ABSTRACTOR_NOT_FOUND
    http: 404
    condition: "{abstractorId} or a body abstractor_id / auditor_id does not resolve to an Abstractor"
  - id: ERR_SOURCE_NOT_FOUND
    http: 404
    condition: "{sourceId} or a body source_id does not resolve to a CasefindingSource"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "{entryId} or a body entry_id does not resolve to a CasefindingEntry"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "{caseId} or a body case_id does not resolve to a TumorCase"
  - id: ERR_CONTACT_NOT_FOUND
    http: 404
    condition: "{contactId} does not resolve to a FollowUpContact"
  - id: ERR_ABSTRACTION_NOT_FOUND
    http: 404
    condition: "{abstractionId} or a body abstraction_id does not resolve to an Abstraction"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "{auditId} does not resolve to a QaAudit"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "{sessionId} does not resolve to a ConferenceSession"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "{submissionId} does not resolve to a RegistrySubmission"
  - id: ERR_SUBMISSION_ITEM_NOT_FOUND
    http: 404
    condition: "{itemId}, or a case_id inside an item_results batch, does not name a SubmissionItem belonging to this submission"
  - id: ERR_DEFICIENCY_NOT_FOUND
    http: 404
    condition: "{deficiencyId} does not resolve to a Deficiency"
  - id: ERR_MEASURE_NOT_FOUND
    http: 404
    condition: "{measureId} or a body source_measure_id does not resolve to a QualityMeasure"

  # --- optimistic concurrency (§1.2.1) -------------------------------------
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version on POST /cancer-registry/abstractions does not equal the TumorCase's current version"
  - id: ERR_STALE_SUBMISSION_VERSION
    http: 412
    condition: "expected_submission_version on POST /cancer-registry/submissions/{submissionId}/items does not equal the RegistrySubmission's current version"

  # --- state preconditions -------------------------------------------------
  - id: ERR_ENTRY_NOT_PENDING_REVIEW
    http: 409
    condition: "A reportability decision was attempted on an entry that is not PENDING_REVIEW"
  - id: ERR_ENTRY_NOT_REOPENABLE
    http: 409
    condition: "Reopen attempted on a PENDING_REVIEW entry, on an entry whose created case has left {IDENTIFIED, ASSIGNED}, or on an entry whose reopen_count already equals ENTRY_REOPEN_MAX"
  - id: ERR_CASE_NOT_ASSIGNABLE
    http: 409
    condition: "Assign attempted on a case whose case_state is not IDENTIFIED (already assigned, in abstraction, completed or VOIDED)"
  - id: ERR_CASE_NOT_ASSIGNED
    http: 409
    condition: "Unassign attempted on a case whose case_state is not ASSIGNED"
  - id: ERR_CASE_NOT_ABSTRACTABLE
    http: 409
    condition: "Abstraction create attempted while the case is not in {ASSIGNED, REWORK_PENDING}, or reopen-draft attempted while the parent case is not in {IN_ABSTRACTION, REWORK_PENDING}"
  - id: ERR_CASE_NOT_COMPLETED
    http: 409
    condition: "A follow-up contact, a submission item, or a transmit referenced a case whose case_state is not COMPLETED"
  - id: ERR_ABSTRACTION_NOT_DRAFT
    http: 409
    condition: "submit-qa attempted on an abstraction that is not DRAFT"
  - id: ERR_ABSTRACTION_NOT_IN_QA
    http: 409
    condition: "qa-decision attempted on an abstraction that is not SUBMITTED_FOR_QA"
  - id: ERR_ABSTRACTION_NOT_REWORKABLE
    http: 409
    condition: "reopen-draft attempted on an abstraction that is not REWORK_REQUIRED"
  - id: ERR_ABSTRACTION_NOT_AUDITABLE
    http: 409
    condition: "A QA audit was opened against an abstraction that is not SUBMITTED_FOR_QA or APPROVED"
  - id: ERR_AUDIT_ALREADY_SCORED
    http: 409
    condition: "score attempted on an audit that is no longer OPEN"
  - id: ERR_AUDIT_ALREADY_VOIDED
    http: 409
    condition: "score or void attempted on an audit already in VOIDED"
  - id: ERR_SESSION_NOT_SCHEDULED
    http: 409
    condition: "attendances or hold attempted on a session that is not SCHEDULED"
  - id: ERR_SESSION_NOT_HELD
    http: 409
    condition: "credit attempted on a session that is not HELD"
  - id: ERR_SUBMISSION_NOT_DRAFT
    http: 409
    condition: "items or transmit attempted on a submission that is not DRAFT (HOLD, TRANSMITTED, EDITS_RETURNED or ACCEPTED)"
  - id: ERR_SUBMISSION_NOT_TRANSMITTED
    http: 409
    condition: "edit-results posted for a submission that is not TRANSMITTED"
  - id: ERR_SUBMISSION_NOT_IN_EDIT_RESOLUTION
    http: 409
    condition: "retransmit or item resolve attempted while the submission is not EDITS_RETURNED"
  - id: ERR_ITEM_NOT_FAILED
    http: 409
    condition: "resolve attempted on a SubmissionItem whose edit_status is not EDIT_FAILED"
  - id: ERR_DEFICIENCY_NOT_RESPONDABLE
    http: 409
    condition: "response filed on a deficiency that is not CITED or RESPONSE_REJECTED"
  - id: ERR_DEFICIENCY_NOT_UNDER_REVIEW
    http: 409
    condition: "response-review attempted on a deficiency that is not RESPONSE_SUBMITTED"
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "survey-schedule, survey-complete or accreditation-decision attempted from an accreditation_state the transition does not declare, including any action on a WITHDRAWN program"
  - id: ERR_MEASURE_STATE_INVALID
    http: 409
    condition: "evaluate attempted while the measure is PROJECT_REQUIRED or PROJECT_ACTIVE, or improvement-project CLOSE attempted while the measure is not PROJECT_ACTIVE"
  - id: ERR_PROJECT_NOT_REQUIRED
    http: 409
    condition: "improvement-project OPEN attempted on a measure that is not PROJECT_REQUIRED, or whose performance_state is MEETS or EXCEEDS"

  # --- business: safety / compliance ---------------------------------------
  - id: ERR_REGISTRY_FROZEN
    http: 409
    condition: "The program's registry_posture is FROZEN and a case assignment, abstraction create, submission item, transmit or retransmit was attempted"
  - id: ERR_RESTRICTED_REQUIRES_CTR
    http: 409
    condition: "registry_posture is RESTRICTED and the abstractor being assigned does not hold credential CTR"
  - id: ERR_ABSTRACTOR_NOT_ACTIVE
    http: 409
    condition: "The abstractor receiving an assignment, authoring an abstraction, reviewing QA or auditing has employment_status other than ACTIVE"
  - id: ERR_ABSTRACTOR_CERTIFICATION_EXPIRED
    http: 409
    condition: "certification_expires_on is earlier than the logical clock date on assign or abstraction create"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 409
    condition: "The same X-User-ID acts on both sides of a controlled pair: QA reviewer == abstractor, auditor == abstractor, deficiency responder == response reviewer, or surveyor == accreditation decider"
  - id: ERR_ABSTRACTION_INCOMPLETE
    http: 422
    condition: "submit-qa attempted while completeness_score < COMPLETENESS_SUBMIT_MIN (85) or missing_required_fields is non-empty"
  - id: ERR_OPEN_DEFICIENCIES_BLOCK_ACCREDITATION
    http: 409
    condition: "accreditation-decision ACCREDIT attempted while the program has at least one MAJOR or CRITICAL deficiency in CITED, RESPONSE_SUBMITTED or RESPONSE_REJECTED"
  - id: ERR_FOLLOW_UP_RATE_BELOW_THRESHOLD
    http: 409
    condition: "accreditation-decision ACCREDIT attempted while follow_up_rate_coc_pct < FOLLOW_UP_ACCREDITATION_MIN_PCT (80.0)"

  # --- business: temporal --------------------------------------------------
  - id: ERR_CONFERENCE_SLOT_CONFLICT
    http: 409
    condition: "A new session's half-open [start_at, end_at) window, widened by the 30-minute changeover buffer, intersects another session of the same program (back-to-back sessions conflict)"
  - id: ERR_AUDITOR_WINDOW_CAPACITY_EXCEEDED
    http: 409
    condition: "A third non-VOIDED audit window for the same auditor overlaps the requested closed [window_start, window_end] interval (inclusive touching counts as overlap)"
  - id: ERR_SUBMISSION_PERIOD_OVERLAP
    http: 409
    condition: "A new submission's closed [period_start, period_end] range intersects another submission of the same program in any state"
  - id: ERR_SESSION_NOT_YET_STARTED
    http: 409
    condition: "hold attempted before the logical clock reaches the session's start_at"
  - id: ERR_SURVEY_DATE_TOO_SOON
    http: 422
    condition: "survey_date is earlier than the logical clock date + SURVEY_LEAD_DAYS (60)"
  - id: ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED
    http: 409
    condition: "A response was filed after the logical clock passed response_due_date"
  - id: ERR_DIAGNOSIS_BEFORE_REFERENCE_YEAR
    http: 422
    condition: "A REPORTABLE reportability decision was made on an entry whose diagnosis_date precedes January 1 of the program's reference_year (recording such an entry is allowed; only promoting it to a reportable case is not)"
  - id: ERR_CONTACT_DATE_INVALID
    http: 422
    condition: "A follow-up contact_date is after the logical clock date or earlier than the case's diagnosis_date"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "POST /_clock/set_current_utc requested an instant not strictly after the current logical clock (default 2026-08-01T00:00:00Z)"

  # --- business: referential / constraint ----------------------------------
  - id: ERR_ABSTRACTOR_PROGRAM_MISMATCH
    http: 409
    condition: "The abstractor, QA reviewer or auditor belongs to a different program than the case or abstraction"
  - id: ERR_CASE_PROGRAM_MISMATCH
    http: 409
    condition: "A case added to a submission belongs to a different program than the submission"
  - id: ERR_NOT_ASSIGNED_ABSTRACTOR
    http: 403
    condition: "The acting RegistryAbstractor is not the case's assigned_abstractor_id, or not the abstraction's own abstractor on submit-qa / reopen-draft"
  - id: ERR_SUPERSEDE_TARGET_REQUIRED
    http: 422
    condition: "An abstraction was created for a REWORK_PENDING case without supersedes_abstraction_id"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_abstraction_id names an abstraction on another case, or one whose abstraction_state is not DRAFT or REWORK_REQUIRED"
  - id: ERR_DUPLICATE_COC_PROGRAM_ID
    http: 409
    condition: "A program is created with a coc_program_id that already exists"
  - id: ERR_DUPLICATE_CASEFINDING_ENTRY
    http: 409
    condition: "(source_id, patient_mrn, primary_site_code, diagnosis_date) already exists on another CasefindingEntry"
  - id: ERR_CASE_ALREADY_IN_SUBMISSION
    http: 409
    condition: "The case's submission_state is not NOT_SUBMITTED, so it is already carried by a submission"
  - id: ERR_SUBMISSION_EMPTY
    http: 409
    condition: "transmit attempted while total_case_count is 0"
  - id: ERR_MEASURE_STRATA_EMPTY
    http: 422
    condition: "evaluate supplied no stratum with eligible_case_count > 0"
  - id: ERR_DUPLICATE_ATTENDANCE
    http: 409
    condition: "attendee_ref already appears in the session's attendances array"
  - id: ERR_REPORTABILITY_OVERRIDE_REASON_REQUIRED
    http: 422
    condition: "A reportability decision contradicts suggested_reportability without an override_reason_code"
  - id: ERR_CONFERENCE_QUORUM_NOT_MET
    http: 409
    condition: "credit CREDIT attempted while quorum_met is false (a required discipline absent or under 30 minutes, zero cases presented, or a prospective ratio below 0.80)"
  - id: ERR_ABSTRACTOR_CAPACITY_EXCEEDED
    http: 409
    condition: "assigned_open_case_count already equals productivity_target_cases_per_day * CAPACITY_CAP_MULTIPLIER (10)"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "reopen-draft attempted while rework_round already equals REWORK_ROUND_MAX (2)"
  - id: ERR_RESUBMISSION_LIMIT_EXCEEDED
    http: 409
    condition: "retransmit attempted while resubmission_round already equals RESUBMISSION_ROUND_MAX (2)"
  - id: ERR_UNRESOLVED_EDITS
    http: 409
    condition: "retransmit attempted while at least one SubmissionItem is still EDIT_FAILED"

  # --- business: fiscal ----------------------------------------------------
  - id: ERR_ASSESSMENT_UNPAID
    http: 402
    condition: "transmit or retransmit attempted while assessment_due_cents exceeds assessment_paid_cents"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "An assessment payment is not a positive integer or exceeds assessment_due_cents - assessment_paid_cents"

# =============================================================================
# 1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the registry platform: onboards programs, moves the logical clock, records assessment payments. Holds no clinical or accreditation authority"
    identity: opaque
    exclusive_operations:
      - "POST /cancer-registry/programs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /cancer-registry/submissions/{submissionId}/assessment-payments"
      - "every GET under /cancer-registry"

  - name: RegistryManager
    description: "Cancer registry manager: staffs abstractors, owns casefinding sources, assigns and releases cases, opens and transmits state submissions, voids audits"
    identity: opaque
    exclusive_operations:
      - "POST /cancer-registry/abstractors"
      - "POST /cancer-registry/abstractors/{abstractorId}/employment-status"
      - "POST /cancer-registry/casefinding-sources"
      - "POST /cancer-registry/casefinding-entries/{entryId}/reopen"
      - "POST /cancer-registry/cases/{caseId}/assign"
      - "POST /cancer-registry/cases/{caseId}/unassign"
      - "POST /cancer-registry/qa-audits/{auditId}/void"
      - "POST /cancer-registry/submissions"
      - "POST /cancer-registry/submissions/{submissionId}/transmit"
      - "POST /cancer-registry/submissions/{submissionId}/retransmit"
    shared_operations:
      - "POST /cancer-registry/casefinding-sources/{sourceId}/entries"
      - "POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision"
      - "POST /cancer-registry/cases/{caseId}/follow-up-contacts"
      - "POST /cancer-registry/qa-audits"
      - "POST /cancer-registry/conference-sessions"
      - "POST /cancer-registry/submissions/{submissionId}/items"
      - "POST /cancer-registry/submissions/{submissionId}/items/{itemId}/resolve"
      - "POST /cancer-registry/submissions/{submissionId}/assessment-payments"
      - "POST /cancer-registry/quality-measures"
      - "POST /cancer-registry/quality-measures/{measureId}/evaluate"
      - "every GET under /cancer-registry"

  - name: RegistryAbstractor
    description: "Certified tumor registrar (CTR) or trainee who abstracts assigned cases; X-User-ID is the Abstractor's id, so ownership checks compare it to case.assigned_abstractor_id and abstraction.abstractor_id"
    identity: "entity_backed:Abstractor"
    exclusive_operations:
      - "POST /cancer-registry/abstractions"
      - "POST /cancer-registry/abstractions/{abstractionId}/submit-qa"
      - "POST /cancer-registry/abstractions/{abstractionId}/reopen-draft"
    shared_operations:
      - "POST /cancer-registry/casefinding-sources/{sourceId}/entries"
      - "POST /cancer-registry/casefinding-entries/{entryId}/reportability-decision"
      - "POST /cancer-registry/cases/{caseId}/follow-up-contacts"
      - "POST /cancer-registry/submissions/{submissionId}/items"
      - "POST /cancer-registry/submissions/{submissionId}/items/{itemId}/resolve"
      - "every GET under /cancer-registry"

  - name: QaReviewer
    description: "Senior registrar acting as QA reviewer and re-abstraction auditor; X-User-ID is that registrar's Abstractor id, which is exactly why it must differ from the abstraction's abstractor_id"
    identity: "entity_backed:Abstractor"
    exclusive_operations:
      - "POST /cancer-registry/abstractions/{abstractionId}/qa-decision"
      - "POST /cancer-registry/qa-audits/{auditId}/score"
    shared_operations:
      - "POST /cancer-registry/qa-audits"
      - "every GET under /cancer-registry"

  - name: AccreditationCoordinator
    description: "Cancer program accreditation coordinator: runs the multidisciplinary conference calendar, files deficiency responses, drives quality-measure improvement projects"
    identity: opaque
    exclusive_operations:
      - "POST /cancer-registry/programs/{programId}/survey-schedule"
      - "POST /cancer-registry/conference-sessions/{sessionId}/attendances"
      - "POST /cancer-registry/conference-sessions/{sessionId}/hold"
      - "POST /cancer-registry/conference-sessions/{sessionId}/credit"
      - "POST /cancer-registry/deficiencies/{deficiencyId}/response"
      - "POST /cancer-registry/quality-measures/{measureId}/improvement-project"
    shared_operations:
      - "POST /cancer-registry/conference-sessions"
      - "POST /cancer-registry/quality-measures"
      - "POST /cancer-registry/quality-measures/{measureId}/evaluate"
      - "every GET under /cancer-registry"

  - name: StateRegistryLiaison
    description: "State central registry counterpart who returns edit results for a transmitted submission; holds no authority over cases, abstractions or accreditation"
    identity: opaque
    exclusive_operations:
      - "POST /cancer-registry/submissions/{submissionId}/edit-results"
    shared_operations:
      - "every GET under /cancer-registry"

  - name: CoCSurveyor
    description: "Commission on Cancer surveyor: completes the survey, cites deficiencies, reviews responses and renders the accreditation decision. The decision must come from a different X-User-ID than the survey completion"
    identity: opaque
    exclusive_operations:
      - "POST /cancer-registry/programs/{programId}/survey-complete"
      - "POST /cancer-registry/programs/{programId}/accreditation-decision"
      - "POST /cancer-registry/deficiencies"
      - "POST /cancer-registry/deficiencies/{deficiencyId}/response-review"
    shared_operations:
      - "every GET under /cancer-registry"
