        distinguishing_aspect: "2 of 3 signs is stored as 0.6667 (round_half_up at the 4th place, not 0.6666 truncated), and a later over-count of 4 of 3 is clamped to exactly 1.0000 rather than 1.3333."
        test_recipe:
