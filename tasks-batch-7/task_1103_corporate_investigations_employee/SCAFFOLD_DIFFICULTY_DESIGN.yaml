              captures: { f_st: $.data.status }
            - call: "GET /api/disciplinary-recommendations/${rec_id}"
              as: HRBusinessPartner
              captures: { r_st: $.data.status }
            - call: "GET /api/reports/${report_id}"
              as: GeneralCounsel
              captures: { rep_st: $.data.status }
          assert:
            - "Case.${case_id}.status == FIELDWORK (reopened)"
            - "hop 1: Finding.${finding_id}.status == CHALLENGED"
            - "hop 2 (caused by hop 1): DisciplinaryRecommendation.${rec_id}.status == RECALLED"
            - "hop 3 (caused by hop 1): CaseReport.${report_id}.status == RECALLED"
            - "RemediationAction.${rem_id}.status remains VERIFIED (cascade does not touch terminal remediation)"

      - name: notice_release_depth2_cascade
        grounds:
          - state_machines.PreservationNotice.ISSUED_to_RELEASED
          - state_machines.CollectionScope.PROPOSED_to_WITHDRAWN
          - calculations.preservation_completeness_ratio
          - entities.Case.fields.preservation_completeness_ratio
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (notice release, not case reopen):
          hop 1 CollectionScope of the released custodian in {PROPOSED, APPROVED,
          IN_PROGRESS} -> WITHDRAWN; hop 2 (caused by hop 1's mutation set plus the
          RELEASED status) Case.preservation_completeness_ratio recomputes with
          RELEASED excluded from both terms: 1 ACK / (1 ACK + 1 ISSUED) = 0.50
          becomes 1/1 = 1.00 after the ISSUED notice is released.
        test_recipe:
          setup:
            - "Case in FIELDWORK; notice N1 (EMP-100, ALL_DATA) ACKNOWLEDGED with scope S1 IN_PROGRESS; notice N2 (EMP-200, ALL_DATA) still ISSUED with scope S2 PROPOSED; ratio == 0.50"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case TC-2", allegation_category: DATA_BREACH, severity: MEDIUM, department: "IT", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: MEDIUM, department: "IT" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/preservation-notices"
              payload: { custodian_ref: "EMP-100", scope: ALL_DATA, is_regulator_ordered: false }
              as: GeneralCounsel
              captures: { n1: $.data.id }
            - { call: "POST /api/preservation-notices/${n1}/transition", payload: { to_status: ACKNOWLEDGED }, as: GeneralCounsel }
            - call: "POST /api/cases/${case_id}/preservation-notices"
              payload: { custodian_ref: "EMP-200", scope: ALL_DATA, is_regulator_ordered: false }
              as: GeneralCounsel
              captures: { n2: $.data.id }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${n1}" }
              as: Investigator
              captures: { s1: $.data.id }
            - { call: "POST /api/collection-scopes/${s1}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/collection-scopes/${s1}/transition", payload: { to_status: IN_PROGRESS }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-200", data_source: FILES, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${n2}" }
              as: Investigator
              captures: { s2: $.data.id }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { ratio_pre: $.data.preservation_completeness_ratio }
          trigger:
            - call: "POST /api/preservation-notices/${n2}/transition"
              payload: { to_status: RELEASED }
              as: GeneralCounsel
            - call: "GET /api/collection-scopes/${s2}"
              as: Investigator
              captures: { s2_st: $.data.status }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { ratio_post: $.data.preservation_completeness_ratio }
          assert:
            - "pre-release Case.preservation_completeness_ratio == 0.50 (1 ACK of 2 outstanding)"
            - "hop 1: CollectionScope.${s2}.status == WITHDRAWN (cascade from notice release; S1 of custodian EMP-100 untouched and stays IN_PROGRESS)"
            - "hop 2: Case.preservation_completeness_ratio == 1.00 after release (RELEASED excluded from both terms)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_upjohn_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.WitnessInterview.UPJOHN_DELIVERED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_UPJOHN_REQUIRED]
        distinguishing_aspect: |
          Category pair {state vs business_safety}: completing a CANCELLED interview
          violates the state machine (priority 6) AND lacks an Upjohn warning
          (business_safety, priority 7); the single returned error must be
          ERR_INVALID_STATE because state (6) precedes business_safety (7).
        test_recipe:
          setup:
            - "Case in FIELDWORK; interview I created then CANCELLED while still SCHEDULED (no Upjohn ever delivered)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case PV-1", allegation_category: HARASSMENT, severity: MEDIUM, department: "Ops", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: MEDIUM, department: "Ops" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/interviews"
              payload: { witness_ref: "W-1", interviewer_id: "inv-9", scheduled_start: "2026-05-08T14:00:00Z", scheduled_end: "2026-05-08T15:00:00Z" }
              as: Investigator
              captures: { int_id: $.data.id }
            - { call: "POST /api/interviews/${int_id}/transition", payload: { to_status: CANCELLED }, as: Investigator }
          trigger:
            - call: "POST /api/interviews/${int_id}/transition"
              payload: { to_status: COMPLETED, completion_note: "memo" }
              as: Investigator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 beats the also-violated business_safety Upjohn rule at priority 7)"
            - "WitnessInterview.${int_id}.status remains CANCELLED; upjohn_delivered_at remains null"

      - name: constraint_beats_temporal_on_reschedule
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.WitnessInterview.NO_SHOW_to_SCHEDULED
          - errors[ERR_INTERVIEWER_OVERLAP]
          - errors[ERR_SCHEDULE_IN_PAST]
        distinguishing_aspect: |
          Category pair {business_constraint vs business_temporal} (different pair
          from the state/safety instance): a reschedule whose new window overlaps the
          same interviewer's existing booking (constraint, priority 8) AND starts in
          the past (temporal, priority 10) must return ERR_INTERVIEWER_OVERLAP
          because constraint precedes temporal.
        test_recipe:
          setup:
            - "Case in FIELDWORK; interviewer inv-9 holds I1 [2026-05-10T14:00-15:00Z] SCHEDULED; I2 [2026-05-11T14:00-15:00Z] went NO_SHOW after the clock moved to 2026-05-12"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case PV-2", allegation_category: HARASSMENT, severity: MEDIUM, department: "Ops", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: MEDIUM, department: "Ops" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/interviews"
              payload: { witness_ref: "W-1", interviewer_id: "inv-9", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: Investigator
              captures: { i1: $.data.id }
            - call: "POST /api/cases/${case_id}/interviews"
              payload: { witness_ref: "W-2", interviewer_id: "inv-9", scheduled_start: "2026-05-11T14:00:00Z", scheduled_end: "2026-05-11T15:00:00Z" }
              as: Investigator
              captures: { i2: $.data.id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/interviews/${i2}/transition", payload: { to_status: NO_SHOW }, as: Investigator }
          trigger:
            - call: "POST /api/interviews/${i2}/transition"
              payload: { to_status: SCHEDULED, new_start: "2026-05-10T14:30:00Z", new_end: "2026-05-10T15:30:00Z" }
              as: Investigator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INTERVIEWER_OVERLAP (business_constraint priority 8 beats business_temporal priority 10 even though new_start 2026-05-10 is in the past relative to clock 2026-05-12)"
            - "WitnessInterview.${i2}.status remains NO_SHOW"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: substantiation_threshold_exactly_070
        grounds:
          - calculations.substantiation_score
          - errors[ERR_THRESHOLD_NOT_MET]
          - state_machines.Finding.DRAFT_to_CALIBRATED
        distinguishing_aspect: |
          Boundary on the substantiation metric via the finding calibrate endpoint:
          final score exactly 0.70 (1 ADMITTED evidence 0.25 + 1 COMPLETED interview
          0.15 + HIGH consistency 0.30) SATISFIES the >= 0.70 gate, while 0.65
          (2 ADMITTED evidence 0.50 + 1 interview 0.15 + LOW consistency 0.00) is
          rejected with ERR_THRESHOLD_NOT_MET. >= is inclusive at the boundary.
        test_recipe:
          setup:
            - "Case in FINDINGS with allegation LINKED, subject EMP-100, TWO ADMITTED evidence items (e1, e2) on a COLLECTED scope, ONE COMPLETED witness interview, and two DRAFT findings f1 (links [e1]) and f2 (links [e1, e2])"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case BP-1", allegation_category: FRAUD, severity: HIGH, department: "Finance", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /api/cases/${case_id}/allegations"
              payload: { reporter_channel: HOTLINE, is_anonymous: false, reporter_ref: "rep-1", narrative: "n" }
              as: IntakeCoordinator
              captures: { alg_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: HIGH, department: "Finance" }, as: IntakeCoordinator }
            - { call: "POST /api/allegations/${alg_id}/transition", payload: { to_status: LINKED }, as: IntakeCoordinator }
            - call: "POST /api/cases/${case_id}/subjects"
              payload: { employee_ref: "EMP-100", role_in_case: PRIMARY }
              as: Investigator
              captures: { subj_id: $.data.id }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/preservation-notices"
