            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "SHARED-77", code_date: "2026-07-01T00:00:00Z", units_produced: 100000 }, captures: { lota: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln2}", batch_code: "SHARED-77", code_date: "2026-07-02T00:00:00Z", units_produced: 100000 }, captures: { lotb: "$.data.id" } }
