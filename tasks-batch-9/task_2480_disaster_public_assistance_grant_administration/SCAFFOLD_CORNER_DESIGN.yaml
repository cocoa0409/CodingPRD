        grounds:
          - state_machines.Deobligation.PROPOSED_to_FINAL
          - calculations.applicant_grant_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / obligation_ledger_conserved_by_full_final_deobligation
          rationale: "That §1.8 instance already reconciles Project.deobligated_cents, Applicant.total_obligated_cents and Disaster.total_obligated_cents before and after a full FINAL deobligation."

      - name: project_rfi_loop_termination_condition
        claim_type: cyclic
        grounds:
          - state_machines.Project.RFI_ISSUED_to_UNDER_REVIEW
          - validations[priority 27]
        excluded_because:
          difficulty_instance: non_linear_state_machine / project_rfi_cycle_bounded_at_two_rounds
          rationale: "That §1.8 instance drives the UNDER_REVIEW <-> RFI_ISSUED loop twice and asserts the third RFI is refused with ERR_RFI_ROUNDS_EXHAUSTED."

      - name: applicant_status_dimensions_change_independently
        claim_type: parallel
        grounds:
          - entities.Applicant.fields.monitoring_status
          - entities.Applicant.fields.drawdown_status
