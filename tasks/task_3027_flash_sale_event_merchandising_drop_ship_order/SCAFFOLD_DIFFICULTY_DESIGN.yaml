              as: Merchandiser
          trigger:
            - call: "POST /events/${event_b_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_c_id}/schedule"
              payload: {}
              as: Merchandiser
              captures: { err_adjacent_id: $.data.error_id }
            - call: "POST /events/${event_d_id}/schedule"
              payload: {}
              as: Merchandiser
              captures: { err_spanning_id: $.data.error_id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Second Brand Shop" }
              as: Merchandiser
              captures: { shop2_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop2_id}", event_title: "Sibling Shop Event", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-06T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_sib_id: $.data.id }
