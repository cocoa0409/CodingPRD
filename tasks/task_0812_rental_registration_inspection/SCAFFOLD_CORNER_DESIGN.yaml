  - section: endpoints
    instances:
      - name: list_properties_by_landlord_pagination
        claim_type: listing
        grounds: [endpoints, entities.Property.fields.landlord_id]
        distinguishing_aspect: "GET /properties?landlord_id=... returns only that landlord's properties in an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["A landlord with two registered properties."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C16", email: "c16@x.com", phone: "555", mailing_address: "16 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "16 A", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "16 B", unit_count: 4, year_built: 1990 }
              as: Landlord
              as_user_id: "${ll_id}"
          trigger:
            - call: "GET /properties?landlord_id=${ll_id}&limit=10&offset=0"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
          assert:
            - "response_type == array; data contains exactly 2 properties for landlord ${ll_id}"
            - "meta/pagination total_count == 2 and has_more == false"

  # -------------------------------------------------------------------------
  # Cross-Cutting Complexity Layers (OCC)
  # -------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_license_create_stale_property_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[license-create-stale-property]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first license issuance bumps Property.version, a second POST /rental-licenses still carrying the pre-issue expected_property_version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A property (version 1); one license already issued against it (which advanced Property.version to 2)."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C17", email: "c17@x.com", phone: "555", mailing_address: "17 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "17 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id", prop_v: "$.data.version" }
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_a: "$.data.id" }
          trigger:
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 412 with error_id ERR_STALE_VERSION (stale expected_property_version)"

