            - call: "POST /ppa/deals/${deal_h_id}/rounds"
              payload: { proposed_by: "DEVELOPER", proposed_fixed_price_usd_per_mwh: 42.50, proposed_escalation_pct_per_year: 2.0, proposed_shape_product: "AS_GENERATED", proposed_basis_responsibility: "SHARED", response_deadline: "2026-08-15T00:00:00Z" }
