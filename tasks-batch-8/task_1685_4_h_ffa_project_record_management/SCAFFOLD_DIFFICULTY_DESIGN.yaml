        distinguishing_aspect: |
          Depth-2 cascade triggered by RecordBook approve: approving the RecordBook (link 1) causes
          the member's eligibility_posture to be recomputed (link 2). With attendance satisfied and
          no livestock project, the posture flips CONDITIONAL/INELIGIBLE -> ELIGIBLE. Originates from
          a different trigger than the member-suspend cascade.
        test_recipe:
