              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "EXCLUSIVE", max_kettles: 3 }
              as: KettleCoordinator
              captures: { host_1: "$.data.id", host_1_v: "$.data.version" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "EXCLUSIVE", max_kettles: 3 }
              as: KettleCoordinator
              captures: { host_2: "$.data.id", host_2_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_1}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_1_v}" }
              as: KettleCoordinator
            - call: "POST /api/host-sites/${host_2}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_2_v}" }
              as: KettleCoordinator
            - call: "GET /api/campaigns/${campaign_id}"
              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_1}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-11-30T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_a: "$.data.id" }
