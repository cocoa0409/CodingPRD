  - section: complexity_layers
    instances:
      - name: occ_stale_program_version_pricing_update_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[pricing-update-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential pricing updates: the first advances program.version 1 -> 2; the second, still carrying expected_program_version 1, is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["program P created (version 1)"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C48", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c48: $.data.id, prog_c48_v: $.data.version }
            - call: "POST /metrology/programs/${prog_c48}/pricing-update"
              payload: { expected_program_version: "${prog_c48_v}", material_unit_price_cents: 1200 }
              as: ProgramAdmin
              captures: { prog_c48_v2: $.data.version, prog_c48_price: $.data.material_unit_price_cents }
          trigger:
            - call: "POST /metrology/programs/${prog_c48}/pricing-update"
              payload: { expected_program_version: "${prog_c48_v}", material_unit_price_cents: 1500 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "prog_c48_v2 == 2 and prog_c48_price == 1200"
            - "err == ERR_STALE_VERSION (stale expected_program_version 1 rejected with 412)"

