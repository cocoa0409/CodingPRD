  - rule_id: compensating_invariant
    instances:
      - name: portfolio_capital_conservation_across_reserve_then_terminate
        grounds:
          - calculations.portfolio_capital_ledger
          - state_machines.Deal.DILIGENCE_to_TERMINATED
          - state_machines.Deal.RESERVED_to_RELEASED
          - entities.Portfolio.fields.available_capital_cents
        distinguishing_aspect: |
          The invariant is the portfolio capital identity available + committed + deployed ==
          total_capital_cents, and the compensation is the deal termination: reserving 36540000 moves the
          money from available to committed without changing the total, and terminating the deal moves it
          back exactly, leaving utilization at 0 and posture OPEN with no drift.
        test_recipe:
          setup:
            - "A portfolio with 50000000 cents of capital and one deal in DILIGENCE holding a 36540000 cent RESERVED commitment."
            - "Available capital is 13460000, deployed is 0 and utilization is 7308 bps."
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
