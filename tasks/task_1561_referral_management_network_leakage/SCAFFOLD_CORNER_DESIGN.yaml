              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SPECIALTY_MISMATCH, HTTP 422; target_specialist_id remains null"

      - name: complete_too_early_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPLETE_TOO_EARLY]", state_machines.Appointment.CONFIRMED_to_COMPLETED]
        distinguishing_aspect: "A CONFIRMED appointment cannot be completed before scheduled_start: ERR_COMPLETE_TOO_EARLY (422) — temporal check distinct from ERR_NOT_CONFIRMED's state check."
        test_recipe:
          setup: ["full bootstrap; appointment booked 2026-08-02T10:00-11:00 and confirmed; clock still 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r_v: $.data.version } }
            - { call: "POST /referrals/${r}/appointments", payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ReferralCoordinator, captures: { a: $.data.id } }
            - { call: "POST /appointments/${a}/confirm", payload: { confirmation_channel: "PHONE" }, as: ReferralCoordinator }
          trigger:
            - call: "POST /appointments/${a}/complete"
              as: SpecialistProvider
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COMPLETE_TOO_EARLY, HTTP 422 (now 2026-08-01 < scheduled_start 2026-08-02T10:00)"

      - name: period_close_validation_matrix
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_PERIOD]", "errors[ERR_PERIOD_NOT_ENDED]", "errors[ERR_PERIOD_ALREADY_CLOSED]"]
        distinguishing_aspect: "Period close guards fire in order: end <= start -> ERR_INVALID_PERIOD (400); clock before period_end -> ERR_PERIOD_NOT_ENDED (409); a second close of the same window -> ERR_PERIOD_ALREADY_CLOSED (409)."
        test_recipe:
          setup: ["clock 2026-08-15; provider with one accepted referral created 2026-08-05 (so snapshot_count 1 on success)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - call: "POST /analytics/periods/close"
              payload: { period_start: "2026-09-01", period_end: "2026-08-01" }
              as: NetworkAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /analytics/periods/close"
              payload: { period_start: "2026-08-01", period_end: "2026-09-01" }
              as: NetworkAdmin
              captures: { e2: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /analytics/periods/close", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: NetworkAdmin, captures: { n: $.data.snapshot_count } }
            - call: "POST /analytics/periods/close"
              payload: { period_start: "2026-08-01", period_end: "2026-09-01" }
              as: NetworkAdmin
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_INVALID_PERIOD (400)"
            - "e2 == ERR_PERIOD_NOT_ENDED (409) — clock 2026-08-15 < period_end 2026-09-01"
            - "first valid close: snapshot_count == 1"
            - "e3 == ERR_PERIOD_ALREADY_CLOSED (409) — idempotent duplicate protection"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: pagination_defaults_and_envelope
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id/timestamp, response_type=array, and pagination fields; limit=2&offset=2 on a 3-row set yields 1 row with has_more=false and total_count=3."
        test_recipe:
          setup: ["plan; three patients created"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "P1", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin }
            - { call: "POST /patients", payload: { mrn: "M002", full_name: "P2", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin }
            - { call: "POST /patients", payload: { mrn: "M003", full_name: "P3", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin }
          trigger:
            - { call: "GET /patients?limit=2&offset=0", as: ReferralCoordinator }
            - { call: "GET /patients?limit=2&offset=2", as: ReferralCoordinator }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"
            - "both responses include meta.api_request_id and response_type == \"array\""

      - name: referral_list_filter_combination
        claim_type: standard_crud
        grounds: [endpoints]
        distinguishing_aspect: "Filters compose: GET /referrals?status=ACCEPTED returns only accepted; adding specialty=CARDIOLOGY narrows further; a non-matching filter pair returns an empty array with total_count 0."
        test_recipe:
          setup: ["plan; provider; patient; R1 CARDIOLOGY accepted; R2 ORTHOPEDICS left PENDING_TRIAGE"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r1: $.data.id } }
            - { call: "POST /referrals/${r1}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "ORTHOPEDICS", diagnosis_code: "M17", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r2: $.data.id } }
          trigger:
            - { call: "GET /referrals?status=ACCEPTED", as: ReferralCoordinator }
            - { call: "GET /referrals?status=ACCEPTED&specialty=ORTHOPEDICS", as: ReferralCoordinator }
          assert:
            - "status=ACCEPTED returns exactly 1 row (R1)"
            - "status=ACCEPTED&specialty=ORTHOPEDICS returns 0 rows, total_count == 0, has_more == false"

      - name: reverse_reachability_lists_return_arrays
        claim_type: standard_crud
        grounds: [entities.ConsultNote.fields.referral_id, entities.AuthorizationRecord.fields.referral_id]
        distinguishing_aspect: "FK reverse-reachability GETs return arrays including the empty case: a fresh referral's authorization-records and consult-notes lists are [] with total_count 0."
        test_recipe:
          setup: ["plan; provider; patient; one referral created"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
          trigger:
            - { call: "GET /referrals/${r}/authorization-records", as: ReferralCoordinator }
            - { call: "GET /referrals/${r}/consult-notes", as: ReferralCoordinator }
            - { call: "GET /referrals/${r}/loop-closures", as: ReferralCoordinator }
            - { call: "GET /referrals/${r}/leakage-records", as: ReferralCoordinator }
          assert:
            - "all four sub-resource lists return 200 with empty arrays and total_count == 0"

  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_matrix_across_resources
        claim_type: violation_to_error
        grounds: ["errors[ERR_PATIENT_NOT_FOUND]", "errors[ERR_PLAN_NOT_FOUND]", "errors[ERR_PARTICIPATION_NOT_FOUND]", "errors[ERR_AUTH_RULE_NOT_FOUND]", "errors[ERR_APPOINTMENT_NOT_FOUND]", "errors[ERR_PROVIDER_NOT_FOUND]", "errors[ERR_CONSULT_NOTE_NOT_FOUND]"]
        distinguishing_aspect: "Every path-parameter resource class returns its domain-specific 404: patient/plan/participation/auth-rule/appointment/provider/consult-note."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /patients/00000000-0000-0000-0000-000000000000", as: ReferralCoordinator, captures: { e1: $.data.error_id } }
            - { call: "GET /insurance-plans/00000000-0000-0000-0000-000000000000", as: ReferralCoordinator, captures: { e2: $.data.error_id } }
            - { call: "GET /network-participations/00000000-0000-0000-0000-000000000000", as: ReferralCoordinator, captures: { e3: $.data.error_id } }
            - { call: "GET /prior-auth-rules/00000000-0000-0000-0000-000000000000", as: ReferralCoordinator, captures: { e4: $.data.error_id } }
            - { call: "GET /appointments/00000000-0000-0000-0000-000000000000", as: ReferralCoordinator, captures: { e5: $.data.error_id } }
            - { call: "GET /referring-providers/00000000-0000-0000-0000-000000000000", as: ReferralCoordinator, captures: { e6: $.data.error_id } }
            - { call: "GET /consult-notes/00000000-0000-0000-0000-000000000000", as: ReferralCoordinator, captures: { e7: $.data.error_id } }
          assert:
            - "e1 == ERR_PATIENT_NOT_FOUND, e2 == ERR_PLAN_NOT_FOUND, e3 == ERR_PARTICIPATION_NOT_FOUND"
            - "e4 == ERR_AUTH_RULE_NOT_FOUND, e5 == ERR_APPOINTMENT_NOT_FOUND, e6 == ERR_PROVIDER_NOT_FOUND, e7 == ERR_CONSULT_NOTE_NOT_FOUND (all HTTP 404)"

      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role, or with an undeclared role string, fail with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (401) before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /referrals", as: "__NO_HEADERS__", captures: { e1: $.data.error_id } }
            - { call: "GET /referrals", as: "SuperUser", captures: { e2: $.data.error_id } }
          assert:
            - "no-headers request -> 401 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "undeclared role \"SuperUser\" -> 401 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: error_appointment_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPOINTMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: appointment_overlap_buffer_semantics
          rationale: "Asserted twice (10:45 and 11:00 rejections) inside the §1.8 overlap instance."

      - name: error_participation_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PARTICIPATION_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: participation_inclusive_date_overlap
          rationale: "Asserted as the 2026-06-30 rejection in the §1.8 participation overlap instance."

      - name: error_no_active_participation_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ACTIVE_PARTICIPATION]"]
        excluded_because:
          difficulty_instance: booking_requires_active_participation
          rationale: "Asserted as the first booking's rejection in the §1.8 cross-entity instance."

      - name: error_no_show_too_early_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_SHOW_TOO_EARLY]"]
        excluded_because:
          difficulty_instance: no_show_grace_inclusive_boundary
          rationale: "Asserted at start+14m59s in the §1.8 grace-boundary instance."

