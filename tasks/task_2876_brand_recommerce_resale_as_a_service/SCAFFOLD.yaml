scenario: |
  2876. Brand Recommerce & Resale-as-a-Service (brand-operated resale program): trade-in intake through mail-in and in-store channels with authentication and condition grading, credit issuance in brand currency with redemption restrictions and expiration policy, refurbishment operations including cleaning, repair and repackaging with cost thresholds for viability, resale pricing by condition tier and demand with markdown cadence on aged inventory, inventory ownership and accounting treatment distinct from new goods, channel policy preventing cannibalization of full-price sales with assortment separation, warranty and return policy for resale items, sustainability impact measurement and reporting with diversion metrics

domain_name: brand-recommerce-resale
api_prefix: /recommerce

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection sits directly
  # under /recommerce with no ownership nesting in the URL path. The two nested
  # GET paths that exist (store-locations/{id}/refurb-bays,
  # channels/{id}/markdown-campaigns, refurb-orders/{id}/tasks,
  # credit-grants/{id}/ledger-entries, resale-orders/{id}/ledger-entries) are
  # FK reverse-reachability reads, not ownership hierarchies.

  state_machine_shape: branching
  # TradeIn: branching fork (AUTHENTICATED -> ACCEPTED | REJECTED with disjoint
  # side-effect sets) plus a revision cycle (AUTHENTICATED -> APPEALED ->
  # AUTHENTICATED). RefurbOrder: rework cycle (QC_PENDING -> QC_FAILED ->
  # IN_PROGRESS). ResaleUnit: two independent state dimensions
  # (lifecycle_state x accounting_state). ResaleOrder: branching settlement with
  # a deny-cycle back to FULFILLED.

  relationship_patterns:
    - one_to_many
    - self_referential      # ResaleUnit.replacement_for_unit_id -> ResaleUnit.id
                            # DiversionReport.supersedes_report_id -> DiversionReport.id
    - cross_aggregate       # CreditLedgerEntry references both CreditGrant and ResaleOrder

  role_model: segregation_of_duties
  # The Authenticator who assigned a grade cannot re-grade the same TradeIn after
  # an appeal; the RefurbTechnician who performed the work cannot sign its QC.

  consistency_model: immediate
  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  PLUS_TIER_BONUS_BP: 500
  MAX_CREDIT_PER_TRADE_IN_MINOR: 60000
  MAIL_IN_INTAKE_WINDOW_DAYS: 21
  IN_STORE_INTAKE_WINDOW_DAYS: 2
  APPEAL_LIMIT: 1
  LABOR_RATE_MINOR_PER_MINUTE: 145
  BAY_TYPE_MULTIPLIER_BP: { CLEANING: 10000, REPAIR: 13500, REPACKAGING: 9000 }
  SANITATION_BUFFER_MINUTES: 60
  REWORK_LIMIT: 2
  MIN_MARGIN_BP: 11500
  CHANNEL_FEE_TIERS:
    - { up_to_minor: 20000, fee_bp: 900 }
    - { up_to_minor: 60000, fee_bp: 650 }
    - { up_to_minor: null, fee_bp: 450 }
  REMORSE_WINDOW_DAYS: 14
  MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL: 2
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MONEY_UNIT: "integer minor units (cents); no floating point anywhere"
  BP_UNIT: "basis points; 10000 bp == 100%"

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact address, unique across Customers
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: display name of the trade-in participant
        constraints: "non-empty"
      - name: loyalty_tier
        type: enum
        source: input
        description: brand loyalty tier; PLUS earns the tier bonus on final credit issuance
        default: STANDARD
        constraints: "one of {STANDARD, PLUS}"
      - name: status
        type: enum
        source: input
        description: account posture; SUSPENDED blocks resale purchases but not trade-in intake
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: credit_balance_minor
        type: integer
        source: computed
        description: >-
          derived brand-currency balance; recomputed as
          SUM(CreditGrant.remaining_minor) over this Customer's grants whose
          status IN {ISSUED, PARTIALLY_REDEEMED}
        default: 0
        constraints: ">= 0"
      - name: diverted_grams_total
        type: integer
        source: computed
        description: >-
          derived lifetime diversion mass; recomputed as SUM(ResaleUnit.mass_grams)
          over ResaleUnits whose trade_in_id belongs to this Customer's TradeIns with
          status == ACCEPTED and whose lifecycle_state != SALVAGED
        default: 0
        constraints: ">= 0"

  - name: GradePolicy
    parent: null
    common_fields: true
    fields:
      - name: product_category
        type: enum
        source: input
        description: category this policy row governs
        constraints: "one of {FOOTWEAR, OUTERWEAR, BAG}"
      - name: condition_grade
        type: enum
        source: input
        description: condition tier this policy row governs
        constraints: "one of {A, B, C, SALVAGE}"
      - name: base_credit_pct_bp
        type: integer
        source: input
        description: percent of TradeIn.msrp_minor paid as base trade-in credit, in basis points
        constraints: "0 <= value <= 10000"
      - name: resale_price_pct_bp
        type: integer
        source: input
        description: percent of reference MSRP used as the baseline resale price, in basis points
        constraints: "0 <= value <= 10000"
      - name: refurb_budget_cap_pct_bp
        type: integer
        source: input
        description: >-
          maximum refurbishment spend expressed as basis points of the baseline resale
          value; viability_ratio_bp strictly greater than this value is non-viable
        constraints: "0 <= value <= 10000"
      - name: restock_fee_pct_bp
        type: integer
        source: input
        description: buyer-remorse restocking fee as basis points of ResaleOrder.gross_price_minor
        constraints: "0 <= value <= 10000"
      - name: warranty_days
        type: integer
        source: input
        description: resale warranty length in whole days from ResaleOrder.fulfilled_at
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: >-
          ACTIVE on creation; flipped to RETIRED when a newer GradePolicy is created for
          the same (product_category, condition_grade) pair
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: CreditPolicy
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: human-readable policy code
        constraints: "non-empty"
      - name: expiry_days
        type: integer
        source: input
        description: whole days from CreditGrant.issued_at until CreditGrant.expires_at
        constraints: ">= 1"
      - name: mail_in_bonus_pct_bp
        type: integer
        source: input
        description: bonus on the base credit for channel == MAIL_IN, in basis points of base
        constraints: "0 <= value <= 10000"
      - name: max_redemption_pct_bp
        type: integer
        source: input
        description: maximum share of ResaleOrder.order_total_minor payable in brand currency
        constraints: "1 <= value <= 10000"
      - name: min_cash_remainder_minor
        type: integer
        source: input
        description: minimum cash that must remain due when any credit is applied
        constraints: ">= 0"
      - name: eligible_assortment
        type: enum
        source: input
        description: >-
          redemption restriction; RESALE_ONLY permits redemption only on channels whose
          channel_type IN {RESALE_MARKETPLACE, OUTLET}, NEW_ONLY only on FULL_PRICE_DTC,
          BOTH on any channel_type
        constraints: "one of {NEW_ONLY, RESALE_ONLY, BOTH}"
      - name: status
        type: enum
        source: system
        description: >-
          ACTIVE on creation; flipped to RETIRED when a newer CreditPolicy is created
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: StoreLocation
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: store code, unique across StoreLocations
        constraints: "unique; non-empty"
      - name: region_code
        type: string
        source: input
        description: region the store belongs to
        constraints: "non-empty"
      - name: status
        type: enum
        source: input
        description: CLOSED stores reject in-store trade-in intake
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED}"

  - name: RefurbBay
    parent: null
    common_fields: true
    fields:
      - name: store_location_id
        type: string
        source: system
        description: "FK -> StoreLocation.id; taken from the creation path segment"
      - name: code
        type: string
        source: input
        description: bay code, unique within its StoreLocation
        constraints: "unique per store_location_id; non-empty"
      - name: bay_type
        type: enum
        source: input
        description: work class of the bay; selects BAY_TYPE_MULTIPLIER_BP for labour costing
        constraints: "one of {CLEANING, REPAIR, REPACKAGING}"
      - name: status
        type: enum
        source: input
        description: OUT_OF_SERVICE bays cannot be booked by a RefurbOrder
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OUT_OF_SERVICE}"

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: channel code, unique across Channels
        constraints: "unique; non-empty"
      - name: channel_type
        type: enum
        source: input
        description: commercial identity of the channel
        constraints: "one of {FULL_PRICE_DTC, RESALE_MARKETPLACE, OUTLET}"
      - name: allowed_assortment
        type: enum
        source: input
        description: >-
          assortment separation rule; a ResaleUnit may only be listed when
          allowed_assortment IN {RESALE_ONLY, BOTH}
        constraints: "one of {NEW_ONLY, RESALE_ONLY, BOTH}"
      - name: max_resale_price_ratio_bp
        type: integer
        source: input
        description: >-
          cannibalization ceiling; a listed ResaleUnit's price may never exceed
          this share of reference_msrp_minor, in basis points
        constraints: "1 <= value <= 10000"
      - name: region_code
        type: string
        source: input
        description: region the channel serves
        constraints: "non-empty"
      - name: status
        type: enum
        source: input
        description: PAUSED channels reject new listings and new resale orders
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED}"

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the trade-in participant who receives the credit"
      - name: store_location_id
        type: string
        source: input
        description: "FK -> StoreLocation.id; required when channel == IN_STORE, must be null when channel == MAIL_IN"
        default: null
      - name: channel
        type: enum
        source: input
        description: intake channel; drives the intake window and the mail-in credit bonus
        constraints: "one of {MAIL_IN, IN_STORE}"
      - name: product_category
        type: enum
        source: input
        description: category of the surrendered item
        constraints: "one of {FOOTWEAR, OUTERWEAR, BAG}"
      - name: declared_grade
        type: enum
        source: input
        description: condition the participant claims; drives the provisional quote only
        constraints: "one of {A, B, C, SALVAGE}"
      - name: msrp_minor
        type: integer
        source: input
        description: reference MSRP of the equivalent new good, in minor units
        constraints: ">= 1"
      - name: item_mass_grams
        type: integer
        source: input
        description: weighed mass of the surrendered item; the conserved sustainability quantity
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: intake lifecycle position
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RECEIVED, AUTHENTICATED, APPEALED, ACCEPTED, REJECTED}"
      - name: authenticity_result
        type: enum
        source: system
        description: outcome of the authentication step; written by the authenticate endpoint
        default: PENDING
        constraints: "one of {PENDING, GENUINE, COUNTERFEIT, INCONCLUSIVE}"
      - name: assessed_grade
        type: enum
        source: system
        description: grade assigned by the Authenticator; null until first authentication
        default: null
        constraints: "one of {A, B, C, SALVAGE} or null"
      - name: graded_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the Authenticator who wrote assessed_grade most recently; opaque
          operator identifier, never an entity id; drives the appeal segregation-of-duties check
        default: null
      - name: appeal_count
        type: integer
        source: system
        description: number of appeals raised on this TradeIn; capped by APPEAL_LIMIT
        default: 0
        constraints: "0 <= value <= 1"
      - name: appraised_credit_minor
        type: integer
        source: computed
        description: >-
          trade_in_appraised_credit output; holds the quote_provisional variant from creation
          until acceptance, then is overwritten with the issuance_final variant
        default: 0
        constraints: ">= 0"
      - name: receive_deadline_at
        type: datetime
        source: computed
        description: >-
          created_at + MAIL_IN_INTAKE_WINDOW_DAYS days when channel == MAIL_IN, else
          created_at + IN_STORE_INTAKE_WINDOW_DAYS days; ISO 8601 UTC, millisecond precision
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant at which intake was recorded; null before receipt
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant of the ACCEPT disposition; null otherwise
        default: null
      - name: reject_reason
        type: string
        source: input
        description: free-text reason captured on the REJECT disposition
        default: null

  - name: CreditGrant
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: system
        description: "FK -> Customer.id; copied from the accepted TradeIn"
      - name: trade_in_id
        type: string
        source: system
        description: "FK -> TradeIn.id; the acceptance that produced this grant"
      - name: credit_policy_id
        type: string
        source: system
        description: "FK -> CreditPolicy.id; the ACTIVE CreditPolicy at acceptance time"
      - name: credit_policy_version
        type: integer
        source: system
        description: >-
          CreditPolicy.version pinned at issuance; later PATCHes to the policy do not
          change this grant's expiry or redemption terms
        constraints: ">= 1"
      - name: issued_amount_minor
        type: integer
        source: computed
        description: trade_in_appraised_credit issuance_final variant output
        constraints: ">= 0"
      - name: remaining_minor
        type: integer
        source: computed
        description: unredeemed balance; mutated only by ledger entries
        constraints: "0 <= value <= issued_amount_minor"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance; equals the TradeIn's accepted_at
      - name: expires_at
        type: datetime
        source: computed
        description: issued_at + CreditPolicy.expiry_days days, using the pinned policy version
      - name: status
        type: enum
        source: system
        description: redemption posture, derived from remaining_minor and the expiry sweep
        default: ISSUED
        constraints: "one of {ISSUED, PARTIALLY_REDEEMED, EXHAUSTED, EXPIRED}"

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: credit_grant_id
        type: string
        source: system
        description: "FK -> CreditGrant.id; the grant this entry moves"
      - name: resale_order_id
        type: string
        source: system
        description: "FK -> ResaleOrder.id; set for REDEEM and RELEASE entries, null for ISSUE and EXPIRE"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: movement class
        constraints: "one of {ISSUE, REDEEM, RELEASE, EXPIRE}"
      - name: amount_minor
        type: integer
        source: system
        description: >-
          signed movement in minor units; positive for ISSUE and RELEASE, negative for
          REDEEM and EXPIRE
      - name: balance_after_minor
        type: integer
        source: computed
        description: the parent CreditGrant.remaining_minor immediately after this entry
        constraints: ">= 0"
      - name: occurred_at
        type: datetime
        source: system
        description: logical-clock instant at which the movement was recorded

  - name: ResaleUnit
    parent: null
    common_fields: true
    fields:
      - name: trade_in_id
        type: string
        source: system
        description: "FK -> TradeIn.id; the acceptance that produced this unit"
      - name: replacement_for_unit_id
        type: string
        source: system
        description: "FK -> ResaleUnit.id; set when this unit was shipped as a warranty replacement for another unit"
        default: null
      - name: listed_channel_id
        type: string
        source: system
        description: "FK -> Channel.id; the channel this unit is currently listed on, null when not listed"
        default: null
      - name: product_category
        type: enum
        source: system
        description: copied from TradeIn.product_category at acceptance
        constraints: "one of {FOOTWEAR, OUTERWEAR, BAG}"
      - name: condition_grade
        type: enum
        source: system
        description: copied from TradeIn.assessed_grade at acceptance
        constraints: "one of {A, B, C, SALVAGE}"
      - name: reference_msrp_minor
        type: integer
        source: system
        description: copied from TradeIn.msrp_minor at acceptance; denormalized pricing input
        constraints: ">= 1"
      - name: mass_grams
        type: integer
        source: system
        description: copied from TradeIn.item_mass_grams at acceptance; conserved diversion mass
        constraints: ">= 1"
      - name: ownership_treatment
        type: enum
        source: system
        description: >-
          accounting treatment distinct from new goods; OWNED_INVENTORY units capitalize
          acquisition and refurbishment cost, CONSIGNED units never capitalize
        default: OWNED_INVENTORY
        constraints: "one of {OWNED_INVENTORY, CONSIGNED}"
      - name: lifecycle_state
        type: enum
        source: system
        description: physical/commercial dimension of the unit's state
        default: INTAKE
        constraints: "one of {INTAKE, IN_REFURB, READY, LISTED, RESERVED, SOLD, RETURNED, SALVAGED}"
      - name: accounting_state
        type: enum
        source: system
        description: >-
          independent accounting dimension; evolves on QC completion, markdown floor
          contact and salvage, not on listing or sale
        default: UNCAPITALIZED
        constraints: "one of {UNCAPITALIZED, CAPITALIZED, WRITTEN_DOWN, EXPENSED}"
      - name: capitalized_cost_minor
        type: integer
        source: computed
        description: >-
          resale_unit_capitalized_cost output; 0 while UNCAPITALIZED and for every
          CONSIGNED unit
        default: 0
        constraints: ">= 0"
      - name: list_price_minor
        type: integer
        source: computed
        description: resale_list_price output, frozen at each listing; null before first listing
        default: null
      - name: current_price_minor
        type: integer
        source: computed
        description: >-
          live price; equals list_price_minor at listing and is stepped down by the
          markdown cadence run
        default: null
      - name: markdown_step_count
        type: integer
        source: system
        description: number of markdown steps applied since the current listing began
        default: 0
        constraints: ">= 0"
      - name: listed_at
        type: datetime
        source: system
        description: logical-clock instant of the current listing; reset on every listing
        default: null
      - name: aged_days
        type: integer
        source: computed
        description: >-
          floor((clock_now - listed_at) / 86400 seconds) when listed_at is non-null,
          else 0; the markdown eligibility metric
        default: 0
        constraints: ">= 0"

  - name: RefurbOrder
    parent: null
    common_fields: true
    fields:
      - name: resale_unit_id
        type: string
        source: input
        description: "FK -> ResaleUnit.id; the unit being refurbished"
      - name: refurb_bay_id
        type: string
        source: input
        description: "FK -> RefurbBay.id; the booked bay, whose bay_type sets the labour multiplier"
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the booked bay window, ISO 8601 UTC
      - name: window_end_at
        type: datetime
        source: input
        description: inclusive end of the booked bay window, ISO 8601 UTC
        constraints: "must be strictly after window_start_at"
      - name: status
        type: enum
        source: system
        description: refurbishment workflow position, including the rework cycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, QC_PENDING, QC_FAILED, COMPLETED, SALVAGED, SUPERSEDED}"
      - name: rework_count
        type: integer
        source: system
        description: number of times this order re-entered IN_PROGRESS after a failed QC
        default: 0
        constraints: "0 <= value <= 2"
      - name: logged_cost_minor
        type: integer
        source: computed
        description: refurb_logged_cost output; sum of the individually rounded RefurbTask.cost_minor values
        default: 0
        constraints: ">= 0"
      - name: viability_ratio_bp
        type: integer
        source: computed
        description: refurb_viability_ratio output; logged cost as basis points of baseline resale value
        default: 0
        constraints: ">= 0"
      - name: performed_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the RefurbTechnician who most recently started the work; opaque
          operator identifier, never an entity id; drives the QC segregation-of-duties check
        default: null
      - name: qc_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who signed the QC decision; opaque operator identifier
        default: null
      - name: viability_override_reason
        type: string
        source: input
        description: >-
          MerchandisingManager justification recorded when a non-viable order is passed
          anyway; null when no override was used
        default: null

  - name: RefurbTask
    parent: null
    common_fields: false
    fields:
      - name: refurb_order_id
        type: string
        source: system
        description: "FK -> RefurbOrder.id; taken from the creation path segment"
      - name: task_type
        type: enum
        source: input
        description: work class performed
        constraints: "one of {CLEANING, REPAIR, REPACKAGING}"
      - name: labor_minutes
        type: integer
        source: input
        description: labour minutes booked to this task line
        constraints: ">= 0"
      - name: parts_cost_minor
        type: integer
        source: input
        description: parts spend on this task line, in minor units
        constraints: ">= 0"
      - name: cost_minor
        type: integer
        source: computed
        description: refurb_logged_cost per-line output; this line's rounded total cost
        constraints: ">= 0"
      - name: sequence_no
        type: integer
        source: system
        description: 1-based append order of this line within its RefurbOrder
        constraints: ">= 1"
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the RefurbTechnician who appended this line; opaque operator identifier

  - name: MarkdownCampaign
    parent: null
    common_fields: true
    fields:
      - name: channel_id
        type: string
        source: input
        description: "FK -> Channel.id; the channel whose aged inventory this campaign marks down"
      - name: product_category
        type: enum
        source: input
        description: category this campaign applies to
        constraints: "one of {FOOTWEAR, OUTERWEAR, BAG}"
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the half-open campaign window, ISO 8601 UTC
      - name: window_end_at
        type: datetime
        source: input
        description: exclusive end of the half-open campaign window, ISO 8601 UTC
        constraints: "must be strictly after window_start_at"
      - name: cadence_days
        type: integer
        source: input
        description: whole days of listing age required per markdown step
        constraints: ">= 1"
      - name: step_bp
        type: integer
        source: input
        description: per-step price reduction in basis points of the current price
        constraints: "1 <= value <= 9999"
      - name: floor_pct_bp
        type: integer
        source: input
        description: price floor as basis points of the unit's list_price_minor
        constraints: "1 <= value <= 10000"
      - name: status
        type: enum
        source: system
        description: >-
          SCHEDULED on creation; ACTIVE after a cadence run executed inside the window;
          CLOSED after a cadence run executed at or after window_end_at
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ACTIVE, CLOSED}"
      - name: run_count
        type: integer
        source: system
        description: number of cadence runs executed against this campaign, including empty runs
        default: 0
        constraints: ">= 0"
      - name: last_run_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent cadence run; null before the first run
        default: null

  - name: ResaleOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer"
      - name: channel_id
        type: string
        source: input
        description: "FK -> Channel.id; the selling channel, which must match the unit's listed_channel_id"
      - name: resale_unit_id
        type: string
        source: input
        description: "FK -> ResaleUnit.id; the purchased unit"
      - name: gross_price_minor
        type: integer
        source: computed
        description: snapshot of ResaleUnit.current_price_minor at order placement
        constraints: ">= 1"
      - name: channel_fee_minor
        type: integer
        source: computed
        description: resale_order_settlement channel fee output; keyed on gross_price_minor
        constraints: ">= 0"
      - name: order_total_minor
        type: integer
        source: computed
        description: gross_price_minor + channel_fee_minor
        constraints: ">= 1"
      - name: credit_applied_minor
        type: integer
        source: input
        description: >-
          brand currency applied to this order; supplied as requested_credit_minor and
          persisted verbatim once the redemption restrictions pass
        constraints: ">= 0"
      - name: cash_due_minor
        type: integer
        source: computed
        description: order_total_minor - credit_applied_minor
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: sale and after-sale position, including the deny cycle back to FULFILLED
        default: PLACED
        constraints: "one of {PLACED, FULFILLED, RETURN_REQUESTED, RETURNED, REPLACED}"
      - name: reason_type
        type: enum
        source: input
        description: after-sale request class; selects the return_refund_settlement variant
        default: NONE
        constraints: "one of {NONE, BUYER_REMORSE, WARRANTY_DEFECT}"
      - name: fulfilled_at
        type: datetime
        source: system
        description: logical-clock instant of fulfilment; null while PLACED
        default: null
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: >-
          fulfilled_at + GradePolicy.warranty_days days for the unit's
          (product_category, condition_grade) ACTIVE policy; null while PLACED
        default: null
      - name: return_requested_at
        type: datetime
        source: system
        description: logical-clock instant of the after-sale request; null when none was raised
        default: null
      - name: restock_fee_minor
        type: integer
        source: computed
        description: return_refund_settlement restocking fee output; 0 for warranty settlements
        default: 0
        constraints: ">= 0"
      - name: refund_cash_minor
        type: integer
        source: computed
        description: return_refund_settlement cash refund output
        default: 0
        constraints: ">= 0"
      - name: refund_credit_minor
        type: integer
        source: computed
        description: return_refund_settlement brand-currency release output
        default: 0
        constraints: ">= 0"

  - name: DiversionReport
    parent: null
    common_fields: true
    fields:
      - name: period_start_at
        type: datetime
        source: input
        description: inclusive start of the half-open reporting period, ISO 8601 UTC
      - name: period_end_at
        type: datetime
        source: input
        description: exclusive end of the half-open reporting period, ISO 8601 UTC
        constraints: "must be strictly after period_start_at"
      - name: supersedes_report_id
        type: string
        source: input
        description: "FK -> DiversionReport.id; the PUBLISHED report this restatement replaces, null for an original report"
        default: null
      - name: units_diverted_count
        type: integer
        source: computed
        description: diversion_metrics output; count of non-salvaged units from in-period acceptances
        constraints: ">= 0"
      - name: diverted_grams
        type: integer
        source: computed
        description: diversion_metrics output; mass of non-salvaged units from in-period acceptances
        constraints: ">= 0"
      - name: salvage_grams
        type: integer
        source: computed
        description: diversion_metrics output; mass of salvaged units from in-period acceptances
        constraints: ">= 0"
      - name: landfill_diversion_rate_bp
        type: integer
        source: computed
        description: diversion_metrics output; diverted share of total in-period accepted mass, in basis points
        constraints: "0 <= value <= 10000"
      - name: credit_liability_minor
        type: integer
        source: computed
        description: diversion_metrics output; unredeemed brand currency issued inside the period
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: publication posture
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant of publication; null while DRAFT
        default: null

state_machines:
  - entity: TradeIn
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    shape: "branching fork (ACCEPTED | REJECTED) with a revision cycle through APPEALED"
    transitions:
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /recommerce/trade-ins/{id}/receive"
        actor: IntakeAgent
        preconditions:
          - "trade_in.status == SUBMITTED"
          - "clock_now <= trade_in.receive_deadline_at (else ERR_INTAKE_WINDOW_EXPIRED; no state change)"
          - "when trade_in.channel == IN_STORE: the StoreLocation named by trade_in.store_location_id has status == ACTIVE (else ERR_STORE_LOCATION_CLOSED)"
        side_effects:
          - "trade_in.received_at := clock_now"
          - "trade_in.version += 1"
        note: >-
          The deadline differs by channel because receive_deadline_at is computed from
          MAIL_IN_INTAKE_WINDOW_DAYS (21) vs IN_STORE_INTAKE_WINDOW_DAYS (2).

      - from: RECEIVED
        to: AUTHENTICATED
        trigger: "POST /recommerce/trade-ins/{id}/authenticate"
        actor: Authenticator
        preconditions:
          - "trade_in.status == RECEIVED"
          - "a GradePolicy with status == ACTIVE exists for (trade_in.product_category, body.assessed_grade) (else ERR_GRADE_POLICY_MISSING)"
        side_effects:
          - "trade_in.authenticity_result := body.authenticity_result"
          - "trade_in.assessed_grade := body.assessed_grade"
          - "trade_in.graded_by_user_id := X-User-ID of the calling Authenticator"
          - "trade_in.appraised_credit_minor is NOT recomputed here; it still holds the quote_provisional value"
          - "trade_in.version += 1"

      - from: AUTHENTICATED
        to: APPEALED
        trigger: "POST /recommerce/trade-ins/{id}/appeal"
        actor: Customer
        preconditions:
          - "trade_in.status == AUTHENTICATED"
          - "trade_in.customer_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
          - "trade_in.appeal_count < APPEAL_LIMIT (1) (else ERR_APPEAL_LIMIT_EXCEEDED)"
        side_effects:
          - "trade_in.appeal_count += 1"
          - "trade_in.version += 1"

      - from: APPEALED
        to: AUTHENTICATED
        trigger: "POST /recommerce/trade-ins/{id}/authenticate (re-grade leg of the appeal cycle)"
        actor: Authenticator
        preconditions:
          - "trade_in.status == APPEALED"
          - "X-User-ID != trade_in.graded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "a GradePolicy with status == ACTIVE exists for (trade_in.product_category, body.assessed_grade) (else ERR_GRADE_POLICY_MISSING)"
        side_effects:
          - "trade_in.authenticity_result := body.authenticity_result (overwritten)"
          - "trade_in.assessed_grade := body.assessed_grade (overwritten)"
          - "trade_in.graded_by_user_id := X-User-ID of the second Authenticator"
          - "trade_in.version += 1"
        note: "Closes the cycle RECEIVED -> AUTHENTICATED -> APPEALED -> AUTHENTICATED; at most one appeal per TradeIn."

      - from: AUTHENTICATED
        to: ACCEPTED
        trigger: "POST /recommerce/trade-ins/{id}/disposition with decision == ACCEPT"
        actor: ProgramAdmin
        preconditions:
          - "trade_in.status == AUTHENTICATED"
          - "trade_in.authenticity_result IN {GENUINE, INCONCLUSIVE} (else ERR_COUNTERFEIT_NOT_ACCEPTABLE)"
          - "a GradePolicy with status == ACTIVE exists for (trade_in.product_category, trade_in.assessed_grade) (else ERR_GRADE_POLICY_MISSING)"
          - "a CreditPolicy with status == ACTIVE exists (else ERR_CREDIT_POLICY_MISSING)"
        side_effects:
          - "LINK 1: trade_in.status := ACCEPTED; trade_in.accepted_at := clock_now; trade_in.appraised_credit_minor := trade_in_appraised_credit/issuance_final; trade_in.version += 1"
          - "LINK 2 (caused by LINK 1): a CreditGrant row is created with status ISSUED, issued_amount_minor := trade_in.appraised_credit_minor, remaining_minor := issued_amount_minor, credit_policy_id := the ACTIVE CreditPolicy.id, credit_policy_version := that policy's current version, issued_at := trade_in.accepted_at, expires_at := issued_at + pinned_policy.expiry_days days"
          - "LINK 3 (caused by LINK 2): a CreditLedgerEntry is appended with entry_type ISSUE, amount_minor := +issued_amount_minor, balance_after_minor := issued_amount_minor, occurred_at := clock_now, resale_order_id := null"
          - "LINK 4 (caused by LINK 3): Customer.credit_balance_minor is recomputed as SUM(CreditGrant.remaining_minor) over that Customer's grants with status IN {ISSUED, PARTIALLY_REDEEMED}; Customer.version += 1"
          - "BRANCH (also caused by LINK 1): a ResaleUnit row is created with trade_in_id := trade_in.id, product_category / condition_grade / reference_msrp_minor / mass_grams copied from the TradeIn (condition_grade from assessed_grade), ownership_treatment := body.ownership_treatment (default OWNED_INVENTORY), lifecycle_state := INTAKE, accounting_state := UNCAPITALIZED, capitalized_cost_minor := 0"
          - "BRANCH tail (caused by the ResaleUnit creation): Customer.diverted_grams_total is recomputed"
        note: >-
          This is the transitive cascade of depth 4 (TradeIn -> CreditGrant -> CreditLedgerEntry
          -> Customer). When trade_in.assessed_grade == SALVAGE the created ResaleUnit is moved
          to lifecycle_state SALVAGED and accounting_state EXPENSED inside the same request, so
          the salvage mass never enters the diverted bucket.

      - from: AUTHENTICATED
        to: REJECTED
        trigger: "POST /recommerce/trade-ins/{id}/disposition with decision == REJECT"
        actor: ProgramAdmin
        preconditions:
          - "trade_in.status == AUTHENTICATED"
        side_effects:
          - "trade_in.status := REJECTED; trade_in.reject_reason := body.reject_reason; trade_in.appraised_credit_minor := 0; trade_in.version += 1"
          - "NO CreditGrant is created, NO CreditLedgerEntry is appended, NO ResaleUnit is created"
          - "Customer.credit_balance_minor, Customer.diverted_grams_total and Customer.version are unchanged"
        note: >-
          The REJECT branch's side-effect set is disjoint from the ACCEPT branch's: this is the
          fork of the branching shape. A COUNTERFEIT authenticity_result leaves REJECT as the
          only permitted disposition.

  - entity: ResaleUnit
    initial_state: INTAKE
    terminal_states: [SALVAGED]
    shape: >-
      parallel state dimensions on one row: lifecycle_state (physical/commercial) and
      accounting_state (inventory accounting) advance independently and are never derived
      from each other; each transition below declares which dimension it moves.
    transitions:
      - from: INTAKE
        to: IN_REFURB
        dimension: lifecycle_state
        trigger: "POST /recommerce/refurb-orders/{id}/start"
        actor: RefurbTechnician
        preconditions:
          - "unit.lifecycle_state == INTAKE"
          - "the RefurbOrder named in the path has status == SCHEDULED"
        side_effects:
          - "unit.lifecycle_state := IN_REFURB; unit.version += 1"
          - "unit.accounting_state is unchanged (still UNCAPITALIZED)"

      - from: INTAKE
        to: SALVAGED
        dimension: lifecycle_state
        trigger: "system: POST /recommerce/trade-ins/{id}/disposition with decision == ACCEPT and trade_in.assessed_grade == SALVAGE"
        actor: system
        preconditions:
          - "the unit was created in this same request with condition_grade == SALVAGE"
        side_effects:
          - "unit.lifecycle_state := SALVAGED; unit.accounting_state := EXPENSED"
          - "Customer.diverted_grams_total excludes this unit's mass_grams"

      - from: IN_REFURB
        to: READY
        dimension: lifecycle_state
        trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == PASS"
        actor: RefurbTechnician
        preconditions:
          - "unit.lifecycle_state == IN_REFURB"
        side_effects:
          - "unit.lifecycle_state := READY; unit.version += 1"

      - from: IN_REFURB
        to: SALVAGED
        dimension: lifecycle_state
        trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == SALVAGE"
        actor: RefurbTechnician
        preconditions:
          - "unit.lifecycle_state == IN_REFURB"
        side_effects:
          - "unit.lifecycle_state := SALVAGED; unit.version += 1"
          - "Customer.diverted_grams_total is recomputed and drops by unit.mass_grams"

      - from: READY
        to: LISTED
        dimension: lifecycle_state
        trigger: "POST /recommerce/resale-units/{id}/list"
        actor: MerchandisingManager
        preconditions:
          - "unit.lifecycle_state IN {READY, RETURNED} (else ERR_UNIT_NOT_READY_FOR_LISTING)"
          - "the Channel named by body.channel_id has status == ACTIVE (else ERR_CHANNEL_NOT_ACTIVE)"
          - "that Channel's allowed_assortment IN {RESALE_ONLY, BOTH} (else ERR_ASSORTMENT_NOT_PERMITTED)"
          - "resale_list_price's margin_floor_minor <= channel_cap_minor (else ERR_MARGIN_FLOOR_ABOVE_CHANNEL_CEILING)"
        side_effects:
          - "unit.listed_channel_id := body.channel_id; unit.list_price_minor := resale_list_price output; unit.current_price_minor := unit.list_price_minor"
          - "unit.markdown_step_count := 0; unit.listed_at := clock_now; unit.lifecycle_state := LISTED; unit.version += 1"
          - "unit.accounting_state is unchanged by listing"

      - from: RETURNED
        to: LISTED
        dimension: lifecycle_state
        trigger: "POST /recommerce/resale-units/{id}/list (re-listing a returned unit)"
        actor: MerchandisingManager
        preconditions:
          - "unit.lifecycle_state == RETURNED"
          - "same Channel and pricing preconditions as the READY -> LISTED transition"
        side_effects:
          - "identical to READY -> LISTED, including markdown_step_count := 0 and a fresh listed_at, so the markdown cadence restarts from step 0"
          - "a WRITTEN_DOWN accounting_state is NOT reversed by re-listing"

      - from: LISTED
        to: RESERVED
        dimension: lifecycle_state
        trigger: "POST /recommerce/resale-orders"
        actor: Customer
        preconditions:
          - "unit.lifecycle_state == LISTED (else ERR_UNIT_NOT_LISTED)"
          - "unit.listed_channel_id == body.channel_id (else ERR_UNIT_NOT_LISTED)"
        side_effects:
          - "unit.lifecycle_state := RESERVED; unit.version += 1"
          - "unit.current_price_minor is frozen into ResaleOrder.gross_price_minor and is no longer eligible for markdown steps"

      - from: RESERVED
        to: SOLD
        dimension: lifecycle_state
        trigger: "POST /recommerce/resale-orders/{id}/fulfill"
        actor: MerchandisingManager
        preconditions:
          - "unit.lifecycle_state == RESERVED"
        side_effects:
          - "unit.lifecycle_state := SOLD; unit.version += 1"

      - from: LISTED
        to: SOLD
        dimension: lifecycle_state
        trigger: "system: POST /recommerce/resale-orders/{id}/settle-return with resolution == REPLACE (this unit was selected as the replacement)"
        actor: system
        preconditions:
          - "unit.lifecycle_state == LISTED and unit was picked by the replacement_unit_selector"
        side_effects:
          - "unit.lifecycle_state := SOLD; unit.replacement_for_unit_id := the defective unit's id; unit.version += 1"

      - from: SOLD
        to: RETURNED
        dimension: lifecycle_state
        trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REFUND"
        actor: MerchandisingManager
        preconditions:
          - "unit.lifecycle_state == SOLD"
        side_effects:
          - "unit.lifecycle_state := RETURNED; unit.listed_channel_id := null; unit.version += 1"
          - "unit.current_price_minor and list_price_minor are retained until the unit is re-listed"

      - from: SOLD
        to: SALVAGED
        dimension: lifecycle_state
        trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REPLACE (the defective unit)"
        actor: MerchandisingManager
        preconditions:
          - "unit.lifecycle_state == SOLD"
        side_effects:
          - "unit.lifecycle_state := SALVAGED; unit.listed_channel_id := null; unit.version += 1"
          - "Customer.diverted_grams_total is recomputed and drops by unit.mass_grams"

      - from: UNCAPITALIZED
        to: CAPITALIZED
        dimension: accounting_state
        trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == PASS"
        actor: RefurbTechnician
        preconditions:
          - "unit.accounting_state == UNCAPITALIZED"
          - "unit.ownership_treatment == OWNED_INVENTORY (CONSIGNED units never capitalize and stay UNCAPITALIZED for life)"
        side_effects:
          - "unit.accounting_state := CAPITALIZED"
          - "unit.capitalized_cost_minor := resale_unit_capitalized_cost output"

      - from: UNCAPITALIZED
        to: EXPENSED
        dimension: accounting_state
        trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == SALVAGE, or acceptance with assessed_grade == SALVAGE"
        actor: RefurbTechnician
        preconditions:
          - "unit.accounting_state == UNCAPITALIZED"
          - "unit.ownership_treatment == OWNED_INVENTORY"
        side_effects:
          - "unit.accounting_state := EXPENSED; unit.capitalized_cost_minor stays 0"

      - from: CAPITALIZED
        to: WRITTEN_DOWN
        dimension: accounting_state
        trigger: "system: POST /recommerce/markdown-campaigns/{id}/cadence-runs where the stepped price lands exactly on the campaign floor"
        actor: system
        preconditions:
          - "unit.accounting_state == CAPITALIZED"
          - "the applied new price == the campaign floor price for this unit"
        side_effects:
          - "unit.accounting_state := WRITTEN_DOWN"
        note: "A UNCAPITALIZED (CONSIGNED) unit hitting the floor is NOT written down; the accounting dimension stays put while lifecycle_state remains LISTED."

      - from: CAPITALIZED
        to: EXPENSED
        dimension: accounting_state
        trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REPLACE (defective unit is scrapped)"
        actor: MerchandisingManager
        preconditions:
          - "unit.accounting_state == CAPITALIZED"
        side_effects:
          - "unit.accounting_state := EXPENSED"

      - from: WRITTEN_DOWN
        to: EXPENSED
        dimension: accounting_state
        trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REPLACE (defective unit is scrapped)"
        actor: MerchandisingManager
        preconditions:
          - "unit.accounting_state == WRITTEN_DOWN"
        side_effects:
          - "unit.accounting_state := EXPENSED"

  - entity: RefurbOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SALVAGED, SUPERSEDED]
    shape: "rework cycle IN_PROGRESS -> QC_PENDING -> QC_FAILED -> IN_PROGRESS, capped by REWORK_LIMIT"
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /recommerce/refurb-orders/{id}/start"
        actor: RefurbTechnician
        preconditions:
          - "order.status == SCHEDULED"
          - "the RefurbBay named by order.refurb_bay_id has status == AVAILABLE (else ERR_BAY_OUT_OF_SERVICE)"
          - "the ResaleUnit named by order.resale_unit_id has lifecycle_state == INTAKE"
        side_effects:
          - "order.performed_by_user_id := X-User-ID; order.version += 1"
          - "cross-entity: unit.lifecycle_state INTAKE -> IN_REFURB; unit.version += 1"

      - from: IN_PROGRESS
        to: QC_PENDING
        trigger: "POST /recommerce/refurb-orders/{id}/submit-qc"
        actor: RefurbTechnician
        preconditions:
          - "order.status == IN_PROGRESS"
        side_effects:
          - "order.logged_cost_minor := refurb_logged_cost output over all RefurbTask rows of this order (0 when no task was logged)"
          - "order.viability_ratio_bp := refurb_viability_ratio output"
          - "order.version += 1"

      - from: QC_PENDING
        to: COMPLETED
        trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == PASS"
        actor: RefurbTechnician
        preconditions:
          - "order.status == QC_PENDING"
          - "X-User-ID != order.performed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "order.viability_ratio_bp <= the ACTIVE GradePolicy.refurb_budget_cap_pct_bp for (unit.product_category, unit.condition_grade), OR body.viability_override_reason is present and the caller's role is ProgramAdmin (else ERR_REFURB_NOT_VIABLE; a non-ProgramAdmin supplying the reason is ERR_OVERRIDE_ROLE_REQUIRED)"
        side_effects:
          - "LINK 1: order.status := COMPLETED; order.qc_by_user_id := X-User-ID; order.viability_override_reason := body.viability_override_reason; order.version += 1; the bay window is released"
          - "LINK 2 (caused by LINK 1): unit.lifecycle_state IN_REFURB -> READY; unit.accounting_state UNCAPITALIZED -> CAPITALIZED when unit.ownership_treatment == OWNED_INVENTORY; unit.capitalized_cost_minor := resale_unit_capitalized_cost output; unit.version += 1"

      - from: QC_PENDING
        to: QC_FAILED
        trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == FAIL"
        actor: RefurbTechnician
        preconditions:
          - "order.status == QC_PENDING"
          - "X-User-ID != order.performed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "order.rework_count < REWORK_LIMIT (2) (else ERR_REWORK_LIMIT_EXCEEDED — the order must be PASSed or SALVAGEd instead)"
        side_effects:
          - "order.status := QC_FAILED; order.qc_by_user_id := X-User-ID; order.version += 1"
          - "unit.lifecycle_state stays IN_REFURB"

      - from: QC_FAILED
        to: IN_PROGRESS
        trigger: "POST /recommerce/refurb-orders/{id}/start (rework leg)"
        actor: RefurbTechnician
        preconditions:
          - "order.status == QC_FAILED"
          - "the RefurbBay named by order.refurb_bay_id has status == AVAILABLE"
          - "order.rework_count < REWORK_LIMIT (2)"
        side_effects:
          - "order.rework_count += 1; order.performed_by_user_id := X-User-ID (overwritten, so the SoD partner may change per round); order.version += 1"
          - "unit.lifecycle_state stays IN_REFURB (no cross-entity move on the rework leg)"
        note: "Closes the rework cycle; the third failure is impossible because FAIL is refused once rework_count == 2."

      - from: QC_PENDING
        to: SALVAGED
        trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == SALVAGE"
        actor: RefurbTechnician
        preconditions:
          - "order.status == QC_PENDING"
          - "X-User-ID != order.performed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "order.status := SALVAGED; order.qc_by_user_id := X-User-ID; order.version += 1; the bay window is released"
          - "cross-entity: unit.lifecycle_state IN_REFURB -> SALVAGED; unit.accounting_state UNCAPITALIZED -> EXPENSED for OWNED_INVENTORY units; unit.version += 1"
          - "Customer.diverted_grams_total is recomputed and drops by unit.mass_grams"

      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system: POST /recommerce/refurb-orders creating a newer order for the same resale_unit_id"
        actor: system
        preconditions:
          - "order.status == SCHEDULED"
          - "the incoming create request carries body.expected_resale_unit_version == unit.version"
        side_effects:
          - "order.status := SUPERSEDED; order.version += 1; the bay window booked by this order is released and no longer participates in overlap detection"
        note: >-
          This is the legitimate re-scheduling path that makes the OCC rule
          refurb-order-create-stale-unit necessary: a second create is not refused by any
          state precondition, it supersedes the earlier schedule.

  - entity: CreditGrant
    initial_state: ISSUED
    terminal_states: []
    shape: >-
      cyclic ledger posture: redemption walks ISSUED -> PARTIALLY_REDEEMED -> EXHAUSTED and
      compensating releases walk it back; EXPIRED is re-enterable because a release into an
      already expired grant is re-expired inside the same request.
    transitions:
      - from: ISSUED
        to: PARTIALLY_REDEEMED
        trigger: "system: POST /recommerce/resale-orders appends a REDEEM CreditLedgerEntry that leaves remaining_minor > 0"
        actor: system
        preconditions:
          - "grant.status == ISSUED"
          - "grant.expires_at > clock_now"
        side_effects:
          - "grant.remaining_minor -= the allocated amount; grant.status := PARTIALLY_REDEEMED; grant.version += 1"
          - "Customer.credit_balance_minor is recomputed"

      - from: ISSUED
        to: EXHAUSTED
        trigger: "system: POST /recommerce/resale-orders appends a REDEEM entry that leaves remaining_minor == 0"
        actor: system
        preconditions:
          - "grant.status == ISSUED"
          - "grant.expires_at > clock_now"
        side_effects:
          - "grant.remaining_minor := 0; grant.status := EXHAUSTED; grant.version += 1"
          - "Customer.credit_balance_minor is recomputed"

      - from: PARTIALLY_REDEEMED
        to: EXHAUSTED
        trigger: "system: POST /recommerce/resale-orders appends a REDEEM entry that leaves remaining_minor == 0"
        actor: system
        preconditions:
          - "grant.status == PARTIALLY_REDEEMED"
          - "grant.expires_at > clock_now"
        side_effects:
          - "grant.remaining_minor := 0; grant.status := EXHAUSTED; grant.version += 1"
          - "Customer.credit_balance_minor is recomputed"

      - from: EXHAUSTED
        to: PARTIALLY_REDEEMED
        trigger: "system: POST /recommerce/resale-orders/{id}/settle-return appends a RELEASE entry that leaves 0 < remaining_minor < issued_amount_minor"
        actor: system
        preconditions:
          - "grant.status == EXHAUSTED"
        side_effects:
          - "grant.remaining_minor += the released amount; grant.status := PARTIALLY_REDEEMED; grant.version += 1"
          - "Customer.credit_balance_minor is recomputed"

      - from: PARTIALLY_REDEEMED
        to: ISSUED
        trigger: "system: POST /recommerce/resale-orders/{id}/settle-return appends a RELEASE entry that restores remaining_minor == issued_amount_minor"
        actor: system
        preconditions:
          - "grant.status == PARTIALLY_REDEEMED"
        side_effects:
          - "grant.remaining_minor := grant.issued_amount_minor; grant.status := ISSUED; grant.version += 1"
          - "Customer.credit_balance_minor is recomputed"

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /recommerce/credit-grants/expiry-runs"
        actor: ProgramAdmin
        preconditions:
          - "grant.status == ISSUED"
          - "grant.expires_at <= clock_now (boundary is inclusive)"
        side_effects:
          - "a CreditLedgerEntry with entry_type EXPIRE, amount_minor := -grant.remaining_minor, balance_after_minor := 0 is appended"
          - "grant.remaining_minor := 0; grant.status := EXPIRED; grant.version += 1"
          - "Customer.credit_balance_minor is recomputed"

      - from: PARTIALLY_REDEEMED
        to: EXPIRED
        trigger: "POST /recommerce/credit-grants/expiry-runs"
        actor: ProgramAdmin
        preconditions:
          - "grant.status == PARTIALLY_REDEEMED"
          - "grant.expires_at <= clock_now"
        side_effects:
          - "same as the ISSUED -> EXPIRED leg; EXHAUSTED grants are skipped by the sweep because remaining_minor == 0"

      - from: EXPIRED
        to: PARTIALLY_REDEEMED
        trigger: "system: POST /recommerce/resale-orders/{id}/settle-return releases credit into an already expired grant"
        actor: system
        preconditions:
          - "grant.status == EXPIRED and the grant funded part of the returned order"
        side_effects:
          - "a RELEASE CreditLedgerEntry is appended; grant.remaining_minor += the released amount; grant.status := PARTIALLY_REDEEMED; grant.version += 1"
        note: "Immediately followed, inside the same request, by the PARTIALLY_REDEEMED -> EXPIRED re-expiry leg below."

      - from: PARTIALLY_REDEEMED
        to: EXPIRED
        trigger: "system: same settle-return request, immediately after the RELEASE leg, when grant.expires_at <= clock_now"
        actor: system
        preconditions:
          - "grant.expires_at <= clock_now"
        side_effects:
          - "an EXPIRE CreditLedgerEntry with amount_minor := -grant.remaining_minor and balance_after_minor := 0 is appended; grant.remaining_minor := 0; grant.status := EXPIRED; grant.version += 1"
          - "Customer.credit_balance_minor is recomputed and is identical to its value before the settle-return request"
        note: >-
          This is the third link of the settle-return cascade; the RELEASE/EXPIRE pair keeps the
          conserved credit quantity exact instead of silently resurrecting expired currency.

  - entity: ResaleOrder
    initial_state: PLACED
    terminal_states: [RETURNED, REPLACED]
    shape: "branching settlement (RETURNED | REPLACED) with a deny cycle RETURN_REQUESTED -> FULFILLED"
    transitions:
      - from: PLACED
        to: FULFILLED
        trigger: "POST /recommerce/resale-orders/{id}/fulfill"
        actor: MerchandisingManager
        preconditions:
          - "order.status == PLACED"
          - "the ResaleUnit named by order.resale_unit_id has lifecycle_state == RESERVED"
        side_effects:
          - "order.fulfilled_at := clock_now; order.warranty_expires_at := fulfilled_at + ACTIVE GradePolicy.warranty_days days for (unit.product_category, unit.condition_grade); order.version += 1"
          - "cross-entity: unit.lifecycle_state RESERVED -> SOLD; unit.version += 1"

      - from: FULFILLED
        to: RETURN_REQUESTED
        trigger: "POST /recommerce/resale-orders/{id}/return-request"
        actor: Customer
        preconditions:
          - "order.status == FULFILLED"
          - "order.customer_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
          - "when body.reason_type == BUYER_REMORSE: clock_now <= order.fulfilled_at + REMORSE_WINDOW_DAYS (14) days (else ERR_RETURN_WINDOW_CLOSED)"
          - "when body.reason_type == WARRANTY_DEFECT: clock_now <= order.warranty_expires_at (else ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "order.reason_type := body.reason_type; order.return_requested_at := clock_now; order.version += 1"
          - "the ResaleUnit is untouched while the request is pending"

      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REFUND"
        actor: MerchandisingManager
        preconditions:
          - "order.status == RETURN_REQUESTED"
        side_effects:
          - "LINK 1: order.restock_fee_minor / order.refund_cash_minor / order.refund_credit_minor := return_refund_settlement outputs for order.reason_type; order.status := RETURNED; order.version += 1; unit.lifecycle_state SOLD -> RETURNED"
          - "LINK 2 (caused by LINK 1): RELEASE CreditLedgerEntry rows totalling order.refund_credit_minor are appended to the grants that funded this order, walked in reverse redemption order (the order's REDEEM entries sorted by occurred_at DESC, tie-broken by created_at DESC); each touched grant's remaining_minor and status are recomputed"
          - "LINK 3 (caused by LINK 2): every touched grant whose expires_at <= clock_now is immediately re-expired — an EXPIRE CreditLedgerEntry is appended and remaining_minor returns to 0"
          - "LINK 4 (caused by LINK 2 and LINK 3): Customer.credit_balance_minor is recomputed; Customer.version += 1"

      - from: RETURN_REQUESTED
        to: REPLACED
        trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REPLACE"
        actor: MerchandisingManager
        preconditions:
          - "order.status == RETURN_REQUESTED"
          - "order.reason_type == WARRANTY_DEFECT (else ERR_ORDER_RETURN_NOT_SETTLEABLE at priority 50 — buyer remorse cannot be settled with a replacement)"
          - "replacement_unit_selector returns a unit (else ERR_NO_REPLACEMENT_UNIT)"
        side_effects:
          - "order.status := REPLACED; order.refund_cash_minor := 0; order.refund_credit_minor := 0; order.restock_fee_minor := 0; order.version += 1"
          - "the defective unit: lifecycle_state SOLD -> SALVAGED, accounting_state CAPITALIZED|WRITTEN_DOWN -> EXPENSED, listed_channel_id := null"
          - "the selected replacement unit: lifecycle_state LISTED -> SOLD, replacement_for_unit_id := the defective unit's id"
          - "no CreditLedgerEntry is appended: the conserved credit quantity is untouched by a replacement"
          - "Customer.diverted_grams_total is recomputed (the salvaged unit leaves the diverted bucket)"

      - from: RETURN_REQUESTED
        to: FULFILLED
        trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == DENY"
        actor: MerchandisingManager
        preconditions:
          - "order.status == RETURN_REQUESTED"
        side_effects:
          - "order.status := FULFILLED; order.reason_type := NONE; order.return_requested_at := null; order.version += 1"
          - "no refund, no ledger entry, no unit movement — the customer may raise a fresh request while the applicable window is still open"
        note: "Closes the deny cycle; a second request after a DENY is admissible only while its window is still open."

  - entity: MarkdownCampaign
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    shape: linear with clock-driven auto-transitions
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /recommerce/markdown-campaigns/{id}/cadence-runs executed while window_start_at <= clock_now < window_end_at"
        actor: MerchandisingManager
        preconditions:
          - "campaign.status == SCHEDULED"
          - "window_start_at <= clock_now < window_end_at"
        side_effects:
          - "campaign.status := ACTIVE; campaign.run_count += 1; campaign.last_run_at := clock_now; campaign.version += 1"
          - "markdown_cadence_step is applied to every eligible ResaleUnit"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /recommerce/markdown-campaigns/{id}/cadence-runs executed while still inside the window"
        actor: MerchandisingManager
        preconditions:
          - "campaign.status == ACTIVE"
          - "window_start_at <= clock_now < window_end_at"
        side_effects:
          - "campaign.run_count += 1; campaign.last_run_at := clock_now; campaign.version += 1"
          - "markdown_cadence_step is applied; an empty eligible set still increments run_count"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /recommerce/markdown-campaigns/{id}/cadence-runs executed at or after window_end_at"
        actor: MerchandisingManager
        preconditions:
          - "campaign.status == ACTIVE"
          - "clock_now >= campaign.window_end_at"
        side_effects:
          - "campaign.status := CLOSED; campaign.run_count += 1; campaign.last_run_at := clock_now; campaign.version += 1"
          - "NO price is stepped: the run closes the campaign and marks down nothing"

      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /recommerce/markdown-campaigns/{id}/cadence-runs executed at or after window_end_at without any prior run"
        actor: MerchandisingManager
        preconditions:
          - "campaign.status == SCHEDULED"
          - "clock_now >= campaign.window_end_at"
        side_effects:
          - "campaign.status := CLOSED; campaign.run_count += 1; campaign.last_run_at := clock_now; campaign.version += 1"
          - "NO price is stepped"

  - entity: DiversionReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear with a cross-entity supersede side effect
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /recommerce/diversion-reports/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "report.status == DRAFT (else ERR_REPORT_ALREADY_PUBLISHED)"
        side_effects:
          - "report.published_at := clock_now; report.status := PUBLISHED; report.version += 1"
          - "cross-entity: when report.supersedes_report_id is non-null, that report's status DRAFT|PUBLISHED -> SUPERSEDED and its version += 1"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: publication of another DiversionReport whose supersedes_report_id names this report"
        actor: system
        preconditions:
          - "report.status == PUBLISHED"
        side_effects:
          - "report.status := SUPERSEDED; report.version += 1"
          - "the report's computed metric fields are frozen and never recomputed"

concurrency_rules:
  - rule_id: refurb-order-create-stale-unit
    parent_entity: ResaleUnit
    write_endpoint: "POST /recommerce/refurb-orders"
    occ_field: "expected_resale_unit_version"
    description: |
      Creating a RefurbOrder against a ResaleUnit whose version has advanced since the
      client last observed it is rejected. Because a new order legitimately supersedes an
      existing SCHEDULED order for the same unit (see the RefurbOrder
      SCHEDULED -> SUPERSEDED transition), a create that arrives against a stale view of
      the unit would otherwise silently cancel a bay booking the caller never saw.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: resale-order-create-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /recommerce/resale-orders"
    occ_field: "expected_customer_version"
    description: |
      Placing a ResaleOrder that redeems brand currency against a Customer whose version
      has advanced since the client last read the balance is rejected. Partial redemption
      means a later order is perfectly legal on its own terms, so nothing in the state
      machine catches a caller that computed requested_credit_minor from a superseded
      credit_balance_minor; the stale-version check does.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

calculations:
  - name: trade_in_appraised_credit
    trigger: >-
      quote_provisional runs on POST /recommerce/trade-ins (creation) and writes
      TradeIn.appraised_credit_minor; issuance_final runs on
      POST /recommerce/trade-ins/{id}/disposition with decision == ACCEPT and overwrites
      TradeIn.appraised_credit_minor and populates CreditGrant.issued_amount_minor.
    algorithm: tiered_pricing
    formula: |
      # grade_row is the GradePolicy with status == ACTIVE for
      #   (trade_in.product_category, grade_input) — grade_input differs per variant.
      # credit_row is the CreditPolicy with status == ACTIVE at evaluation time.
      base_minor           = floor(trade_in.msrp_minor * grade_row.base_credit_pct_bp / 10000)
      channel_bonus_minor  = (trade_in.channel == MAIL_IN)
                               ? floor(base_minor * credit_row.mail_in_bonus_pct_bp / 10000)
                               : 0
      tier_bonus_minor     = INCLUDED ONLY BY issuance_final:
                               (customer.loyalty_tier == PLUS)
                                 ? floor(base_minor * PLUS_TIER_BONUS_BP / 10000)
                                 : 0
      raw_minor            = base_minor + channel_bonus_minor + tier_bonus_minor
      appraised_minor      = min(raw_minor, MAX_CREDIT_PER_TRADE_IN_MINOR)
      # Evaluation order is pinned: each bonus is floored against base_minor
      # independently; the bonuses are never compounded on one another.
    input_set: >-
      Exactly one ACTIVE GradePolicy row (status == ACTIVE) selected by
      (product_category, grade_input) and exactly one ACTIVE CreditPolicy row
      (status == ACTIVE); RETIRED policy rows are never consulted. The Customer row is
      read for loyalty_tier by issuance_final only.
    constants:
      PLUS_TIER_BONUS_BP: 500
      MAX_CREDIT_PER_TRADE_IN_MINOR: 60000
    precision: "integer minor units; every intermediate product is floored (round-down) before summation"
    variants:
      - name: quote_provisional
        when: "POST /recommerce/trade-ins creation response, before the item is ever inspected"
        difference: >-
          grade_input := trade_in.declared_grade and tier_bonus_minor is forced to 0, so a
          PLUS customer's quote is always strictly below the issued amount for the same grade.
      - name: issuance_final
        when: "POST /recommerce/trade-ins/{id}/disposition with decision == ACCEPT"
        difference: >-
          grade_input := trade_in.assessed_grade and tier_bonus_minor is included, then the
          MAX_CREDIT_PER_TRADE_IN_MINOR cap is applied to the summed raw value.
    worked_example: >-
      msrp_minor 120000, FOOTWEAR, declared_grade A == assessed_grade A
      (base_credit_pct_bp 3500), channel MAIL_IN (mail_in_bonus_pct_bp 1000),
      loyalty_tier PLUS: base 42000, channel bonus 4200, tier bonus 2100 ->
      quote_provisional 46200, issuance_final 48300.

  - name: refurb_logged_cost
    trigger: >-
      Per-line on POST /recommerce/refurb-orders/{id}/tasks (writes RefurbTask.cost_minor);
      the order-level sum is re-materialized into RefurbOrder.logged_cost_minor on that same
      call and again on POST /recommerce/refurb-orders/{id}/submit-qc.
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each task line to whole minor units FIRST, then sum
      # the rounded line values. Summing the unrounded labour products and rounding once
      # is WRONG and produces a different total.
      multiplier_bp   = BAY_TYPE_MULTIPLIER_BP[refurb_bay.bay_type]
      labour_raw      = task.labor_minutes * LABOR_RATE_MINOR_PER_MINUTE * multiplier_bp / 10000
      task.cost_minor = round_half_up(labour_raw) + task.parts_cost_minor
      order.logged_cost_minor = SUM(task.cost_minor) over every RefurbTask row whose
                                refurb_order_id == order.id, ordered by sequence_no ASC
      # RefurbTask rows are immutable and never voided, so the sum is over all rows.
      # An order with zero task rows has logged_cost_minor == 0.
    input_set: >-
      All RefurbTask rows of the order (there is no void/exclude status), including lines
      appended during rework rounds; the bay multiplier comes from the RefurbBay named by
      order.refurb_bay_id, not from task_type.
    constants:
      LABOR_RATE_MINOR_PER_MINUTE: 145
      BAY_TYPE_MULTIPLIER_BP: { CLEANING: 10000, REPAIR: 13500, REPACKAGING: 9000 }
    precision: "round_half_up to whole minor units PER LINE, then integer summation"
    worked_example: >-
      Two lines of labor_minutes 2, parts_cost_minor 0 in a REPAIR bay:
      2 * 145 * 13500 / 10000 = 391.5 -> 392 per line -> logged_cost_minor 784.
      Summing first (783.0 -> 783) would be off by one minor unit.

  - name: refurb_viability_ratio
    trigger: "POST /recommerce/refurb-orders/{id}/tasks and POST /recommerce/refurb-orders/{id}/submit-qc"
    algorithm: threshold
    formula: |
      grade_row = ACTIVE GradePolicy for (unit.product_category, unit.condition_grade)
      baseline_resale_value_minor = floor(unit.reference_msrp_minor
                                         * grade_row.resale_price_pct_bp / 10000)
      viability_ratio_bp = (baseline_resale_value_minor == 0)
                             ? 10001
                             : floor(order.logged_cost_minor * 10000
                                     / baseline_resale_value_minor)
      # Gate applied by POST /refurb-orders/{id}/qc-decision with decision == PASS:
      #   viable  <=> viability_ratio_bp <= grade_row.refurb_budget_cap_pct_bp
      # The comparison is INCLUSIVE: a ratio exactly equal to the cap is viable; only a
      # strictly greater ratio raises ERR_REFURB_NOT_VIABLE.
    input_set: >-
      order.logged_cost_minor as recomputed by refurb_logged_cost, and the single ACTIVE
      GradePolicy row for the unit's (product_category, condition_grade); a zero baseline
      (SALVAGE tier, resale_price_pct_bp == 0) is defined as never viable.
    constants: {}
    precision: "integer basis points, floored"
    worked_example: >-
      FOOTWEAR grade A, reference_msrp_minor 120000, resale_price_pct_bp 6500 ->
      baseline 78000. logged_cost_minor 19500 -> 2500 bp, exactly the
      refurb_budget_cap_pct_bp of 2500 -> viable. logged_cost_minor 19508 -> 2501 bp ->
      ERR_REFURB_NOT_VIABLE.

  - name: resale_unit_capitalized_cost
    trigger: "POST /recommerce/refurb-orders/{id}/qc-decision with decision == PASS"
    algorithm: aggregation
    formula: |
      acquisition_cost_minor = the issued_amount_minor of the single CreditGrant whose
                               trade_in_id == unit.trade_in_id (there is exactly one grant
                               per accepted TradeIn); 0 when no grant exists
      unit.capitalized_cost_minor = (unit.ownership_treatment == OWNED_INVENTORY)
                                      ? acquisition_cost_minor + order.logged_cost_minor
                                      : 0
    input_set: >-
      The one CreditGrant of the unit's TradeIn (any status, including EXPIRED — expiry of
      unredeemed currency does not reduce the acquisition cost already recognized) plus the
      completing RefurbOrder's logged_cost_minor.
    constants: {}
    precision: "integer minor units"
    note: >-
      This is the accounting treatment that distinguishes resale inventory from new goods:
      brand currency issued at intake is the acquisition cost, refurbishment is capitalized
      into the same carrying value, and CONSIGNED units carry no inventory value at all.

  - name: resale_list_price
    trigger: "POST /recommerce/resale-units/{id}/list"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned top to bottom; no step reads a later step's output.
      grade_row            = ACTIVE GradePolicy for (unit.product_category, unit.condition_grade)
      base_resale_minor    = floor(unit.reference_msrp_minor * grade_row.resale_price_pct_bp / 10000)
      margin_floor_minor   = ceil(unit.capitalized_cost_minor * MIN_MARGIN_BP / 10000)
      channel_cap_minor    = floor(unit.reference_msrp_minor
                                   * channel.max_resale_price_ratio_bp / 10000)
      if margin_floor_minor > channel_cap_minor: reject with
          ERR_MARGIN_FLOOR_ABOVE_CHANNEL_CEILING   # cannot be listed profitably here
      list_price_minor     = min(channel_cap_minor, max(base_resale_minor, margin_floor_minor))
      current_price_minor  = list_price_minor
    input_set: >-
      One ACTIVE GradePolicy row, the target Channel row (status == ACTIVE and
      allowed_assortment IN {RESALE_ONLY, BOTH}), and the unit's own
      capitalized_cost_minor — which is 0 for CONSIGNED units, making margin_floor_minor 0
      and the channel ceiling the only binding constraint.
    constants:
      MIN_MARGIN_BP: 11500
    precision: "base and channel cap floored; margin floor ceilinged (round-up, so the floor is never undershot)"
    worked_example: >-
      OUTERWEAR grade B, reference_msrp_minor 50000, resale_price_pct_bp 3900 -> base 19500;
      capitalized_cost_minor 10784 -> margin floor ceil(12401.6) = 12402; channel
      max_resale_price_ratio_bp 7000 -> cap 35000; list_price_minor = 19500.

  - name: resale_order_settlement
    trigger: "POST /recommerce/resale-orders"
    algorithm: tiered_pricing
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, ORDER PINNED:
      #   order_total_minor contains channel_fee_minor, and the fee is a tiered function —
      #   but the tier is selected from gross_price_minor ALONE, never from
      #   order_total_minor. Selecting the tier from the total is WRONG.
      gross_price_minor  = unit.current_price_minor                      # step 1
      fee_bp             = the fee_bp of the FIRST CHANNEL_FEE_TIERS row, in declared order,
                           whose up_to_minor is null OR up_to_minor >= gross_price_minor
                           # bands are UPPER-INCLUSIVE: gross 20000 selects the 900 bp row
      channel_fee_minor  = round_half_up(gross_price_minor * fee_bp / 10000)   # step 2
      order_total_minor  = gross_price_minor + channel_fee_minor              # step 3
      redemption_cap_minor = floor(order_total_minor
                                   * credit_row.max_redemption_pct_bp / 10000)  # step 4
      # Restrictions, evaluated in this order (see validations 72/74/76):
      #   requested_credit_minor > redemption_cap_minor      -> ERR_REDEMPTION_CAP_EXCEEDED
      #   requested_credit_minor > available_credit_minor    -> ERR_INSUFFICIENT_CREDIT
      credit_applied_minor = requested_credit_minor                            # step 5
      cash_due_minor       = order_total_minor - credit_applied_minor           # step 6
      #   credit_applied_minor > 0 AND cash_due_minor < credit_row.min_cash_remainder_minor
      #       -> ERR_MIN_CASH_REMAINDER
      # WATERFALL ALLOCATION of credit_applied_minor across eligible grants:
      #   eligible: CreditGrant rows with customer_id == order.customer_id,
      #             status IN {ISSUED, PARTIALLY_REDEEMED}, expires_at > clock_now, and
      #             whose pinned CreditPolicy.eligible_assortment permits
      #             channel.channel_type
      #   available_credit_minor = SUM(remaining_minor) over that eligible set
      #   order: expires_at ASC, then created_at ASC (never id); each grant is drained to
      #          0 before the next is touched; one REDEEM CreditLedgerEntry per touched
      #          grant with balance_after_minor := that grant's remaining_minor afterwards
    input_set: >-
      The listed ResaleUnit (lifecycle_state == LISTED, listed_channel_id == body.channel_id),
      the target Channel, the ACTIVE CreditPolicy for cap and min-cash terms, and the
      eligible CreditGrant set defined above. EXPIRED and EXHAUSTED grants are excluded, as
      are grants whose pinned policy forbids this channel_type.
    constants:
      CHANNEL_FEE_TIERS:
        - { up_to_minor: 20000, fee_bp: 900 }
        - { up_to_minor: 60000, fee_bp: 650 }
        - { up_to_minor: null, fee_bp: 450 }
    precision: "channel fee round_half_up; redemption cap floored; all values integer minor units"
    worked_example: >-
      gross_price_minor 19500 -> tier row 1 (19500 <= 20000) -> fee round_half_up(1755.0) =
      1755 -> order_total 21255 -> redemption cap floor(10627.5) = 10627. Requesting exactly
      10627 leaves cash_due 10628. Keying the tier on order_total (21255 -> 650 bp) would
      have produced fee 1268 and total 20768 — the pinned order is what makes the numbers
      well defined.

  - name: markdown_cadence_step
    trigger: "POST /recommerce/markdown-campaigns/{id}/cadence-runs, while window_start_at <= clock_now < window_end_at"
    algorithm: decay_function
    formula: |
      eligible units (all predicates required):
        unit.lifecycle_state == LISTED
        unit.listed_channel_id == campaign.channel_id
        unit.product_category == campaign.product_category
        unit.aged_days >= campaign.cadence_days * (unit.markdown_step_count + 1)
        where aged_days = floor((clock_now - unit.listed_at) / 86400 seconds)
      processing order: listed_at ASC, then created_at ASC (never id)
      per unit:
        floor_price_minor = ceil(unit.list_price_minor * campaign.floor_pct_bp / 10000)
        stepped_minor     = floor(unit.current_price_minor
                                  * (10000 - campaign.step_bp) / 10000)
        new_price_minor   = max(stepped_minor, floor_price_minor)
        if new_price_minor == unit.current_price_minor:
            skip — markdown_step_count, current_price_minor and version are all unchanged;
            the unit counts toward skipped_at_floor_count
        else:
            unit.current_price_minor := new_price_minor
            unit.markdown_step_count += 1
            unit.version += 1
            if new_price_minor == floor_price_minor and unit.accounting_state == CAPITALIZED:
                unit.accounting_state := WRITTEN_DOWN
      run bookkeeping (always, even for an empty eligible set):
        campaign.run_count += 1; campaign.last_run_at := clock_now; campaign.version += 1
    input_set: >-
      Only LISTED units on the campaign's own channel and category; RESERVED and SOLD units
      are frozen at their sale price, RETURNED units are not listed, and units whose
      aged_days is one day short of the next step boundary are excluded.
    constants: {}
    precision: "stepped price floored; floor price ceilinged; integer minor units"
    worked_example: >-
      list_price_minor 19500, floor_pct_bp 6000 -> floor 11700; step_bp 1500, cadence_days 7.
      Runs at listing age 7 / 14 / 21 / 28 days yield 16575, 14088, 11974, then 11700 (the
      floor, which also flips a CAPITALIZED unit to WRITTEN_DOWN). A fifth run at age 35
      changes nothing and only increments run_count.

  - name: return_refund_settlement
    trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REFUND"
    algorithm: waterfall_allocation
    formula: |
      grade_row = ACTIVE GradePolicy for (unit.product_category, unit.condition_grade)
      restock_fee_minor    = (order.reason_type == BUYER_REMORSE)
                               ? ceil(order.gross_price_minor
                                      * grade_row.restock_fee_pct_bp / 10000)
                               : 0
      non_refundable_minor = (order.reason_type == BUYER_REMORSE)
                               ? order.channel_fee_minor + restock_fee_minor
                               : 0
      refund_cash_minor    = max(0, order.cash_due_minor - non_refundable_minor)
      shortfall_minor      = max(0, non_refundable_minor - order.cash_due_minor)
      refund_credit_minor  = max(0, order.credit_applied_minor - shortfall_minor)
      # RELEASE waterfall: walk this order's REDEEM CreditLedgerEntry rows in reverse
      # redemption order (occurred_at DESC, then created_at DESC — never id) and append a
      # RELEASE entry per grant until refund_credit_minor is fully returned; the last grant
      # touched may be partially restored.
    input_set: >-
      The single ResaleOrder row and its own REDEEM ledger entries, plus the ACTIVE
      GradePolicy row for the unit's tier. No other order's entries participate.
    constants:
      REMORSE_WINDOW_DAYS: 14
    precision: "restocking fee ceilinged; all refunds integer minor units"
    variants:
      - name: remorse_return
        when: "order.reason_type == BUYER_REMORSE"
        difference: >-
          The channel fee is NOT refunded and a restocking fee of
          grade_row.restock_fee_pct_bp of gross_price_minor is retained; a cash shortfall is
          recovered from the credit refund.
      - name: warranty_defect_return
        when: "order.reason_type == WARRANTY_DEFECT"
        difference: >-
          restock_fee_minor is 0 and the channel fee IS refunded, so refund_cash_minor equals
          cash_due_minor exactly and refund_credit_minor equals credit_applied_minor exactly.
    worked_example: >-
      gross 19500, channel_fee 1755, order_total 21255, credit_applied 10627,
      cash_due 10628, restock_fee_pct_bp 1200: remorse -> restock 2340,
      refund_cash 6533, refund_credit 10627; warranty -> restock 0, refund_cash 10628,
      refund_credit 10627. Identical order, two legal settlements, different cash.

  - name: credit_expiry_sweep
    trigger: "POST /recommerce/credit-grants/expiry-runs"
    algorithm: chronological
    formula: |
      sweep set: CreditGrant rows with status IN {ISSUED, PARTIALLY_REDEEMED}
                 AND expires_at <= clock_now        # boundary INCLUSIVE
      order: expires_at ASC, then created_at ASC (never id)
      per grant:
        append CreditLedgerEntry(entry_type EXPIRE, amount_minor := -grant.remaining_minor,
                                 balance_after_minor := 0, resale_order_id := null,
                                 occurred_at := clock_now)
        grant.remaining_minor := 0; grant.status := EXPIRED; grant.version += 1
      then, per affected Customer:
        credit_balance_minor := SUM(remaining_minor) over that Customer's grants with
                                status IN {ISSUED, PARTIALLY_REDEEMED}; version += 1
      response: { expired_grant_count, expired_amount_minor, affected_customer_count }
    input_set: >-
      EXHAUSTED grants are skipped (remaining_minor is already 0) and EXPIRED grants are
      skipped (idempotent re-runs expire nothing and report zeros).
    constants: {}
    precision: "integer minor units"

  - name: diversion_metrics
    trigger: "POST /recommerce/diversion-reports"
    algorithm: aggregation
    formula: |
      period is HALF-OPEN: period_start_at <= t < period_end_at
      accepted_set = TradeIn rows with status == ACCEPTED
                     AND period_start_at <= accepted_at < period_end_at
      unit_set     = ResaleUnit rows whose trade_in_id IN accepted_set
      units_diverted_count = COUNT(unit_set where lifecycle_state != SALVAGED)
      diverted_grams       = SUM(mass_grams) over unit_set where lifecycle_state != SALVAGED
      salvage_grams        = SUM(mass_grams) over unit_set where lifecycle_state == SALVAGED
      landfill_diversion_rate_bp =
          (diverted_grams + salvage_grams == 0)
            ? 0
            : floor(diverted_grams * 10000 / (diverted_grams + salvage_grams))
      credit_liability_minor = SUM(remaining_minor) over CreditGrant rows with
          status IN {ISSUED, PARTIALLY_REDEEMED}
          AND period_start_at <= issued_at < period_end_at
    input_set: >-
      Membership is decided by TradeIn.accepted_at, not by unit creation time or listing
      time; a unit salvaged after the period still counts as salvage for the period in which
      its trade-in was accepted, because the metrics are evaluated at generation time and
      then frozen on publication.
    constants: {}
    precision: "integer grams and basis points, floored; an empty period yields all zeros including rate 0"
    worked_example: >-
      One diverted unit of 900 g and one salvaged unit of 1400 g accepted inside the period:
      units_diverted_count 1, diverted_grams 900, salvage_grams 1400,
      landfill_diversion_rate_bp floor(9000000/2300) = 3913.

  - name: replacement_unit_selector
    trigger: "POST /recommerce/resale-orders/{id}/settle-return with resolution == REPLACE"
    algorithm: weighted_scoring
    formula: |
      candidate set (eligibility filter, all predicates required):
        unit.lifecycle_state == LISTED
        unit.listed_channel_id == order.channel_id
        unit.product_category == defective_unit.product_category
        unit.condition_grade  == defective_unit.condition_grade
        unit.id != defective_unit.id
      ranking expression: current_price_minor ASC        # cheapest suitable substitute
      tie-break 1: listed_at ASC
      tie-break 2: created_at ASC                        # never id
      empty candidate set: reject the whole request with ERR_NO_REPLACEMENT_UNIT (409);
        the caller must settle with resolution REFUND or DENY instead
    input_set: "Only LISTED units on the same channel; RESERVED, SOLD, READY and RETURNED units are ineligible."
    constants: {}
    precision: "not applicable — selection only"

  - name: credit_conservation_invariant
    trigger: >-
      Audited after every request that appends a CreditLedgerEntry
      (disposition ACCEPT, resale-order creation, settle-return, expiry run).
    algorithm: aggregation
    formula: |
      for every Customer c:
        c.credit_balance_minor
          == SUM(g.remaining_minor for g in CreditGrant where g.customer_id == c.id
                 and g.status IN {ISSUED, PARTIALLY_REDEEMED})
          == SUM(e.amount_minor for e in CreditLedgerEntry where e.credit_grant_id IN
                 (the ids of c's grants with status IN {ISSUED, PARTIALLY_REDEEMED}))
      for every CreditGrant g:
        g.remaining_minor == SUM(e.amount_minor for e in g's CreditLedgerEntry rows)
        and the balance_after_minor of g's latest entry (occurred_at DESC, created_at DESC)
        == g.remaining_minor
    input_set: "All CreditLedgerEntry rows; none are ever deleted or mutated."
    constants: {}
    precision: "exact integer equality — the conserved quantity is brand currency in minor units"
    note: >-
      The compensating pair is REDEEM (POST /recommerce/resale-orders) and RELEASE
      (settle-return REFUND). A warranty settlement that releases into an already expired
      grant must append the RELEASE and the compensating EXPIRE, leaving every sum above
      byte-identical to its pre-order value.

  - name: tracked_mass_conservation_invariant
    trigger: >-
      Audited after every request that creates or salvages a ResaleUnit
      (disposition ACCEPT, qc-decision SALVAGE, settle-return REPLACE).
    algorithm: aggregation
    formula: |
      SUM(u.mass_grams for u in ResaleUnit)
        == SUM(t.item_mass_grams for t in TradeIn where t.status == ACCEPTED)
      and, per Customer c:
        c.diverted_grams_total
          == SUM(u.mass_grams for u in ResaleUnit where u.lifecycle_state != SALVAGED
                 and u.trade_in_id IN (c's TradeIn ids with status == ACCEPTED))
      and, for any DiversionReport r:
        r.diverted_grams + r.salvage_grams
          == SUM(t.item_mass_grams for t in TradeIn where t.status == ACCEPTED
                 and r.period_start_at <= t.accepted_at < r.period_end_at)
    input_set: >-
      Every ResaleUnit ever created, in any lifecycle_state including SALVAGED; units are
      never deleted, so mass only moves between the diverted and salvage buckets.
    constants: {}
    precision: "exact integer equality — the conserved quantity is physical mass in grams"
    note: >-
      The compensating pair is the warranty REPLACE settlement: the defective unit leaves
      the diverted bucket for salvage while the substitute unit moves LISTED -> SOLD, so the
      first sum is unchanged and the second drops by exactly the defective unit's mass_grams.

validations:
  - priority: 10
    rule: "Every endpoint except POST /recommerce/_clock/set_current_utc requires the X-User-ID header; a missing, empty-string or whitespace-only value is unauthenticated."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: authentication
    applies_to: "all endpoints except POST /recommerce/_clock/set_current_utc"
  - priority: 20
    rule: "The caller's role must be listed in the target endpoint's allowed_roles."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    category: authorization
    applies_to: "all endpoints except POST /recommerce/_clock/set_current_utc"
  - priority: 25
    rule: >-
      Request body must be well formed: every required field present, every enum value inside
      its declared set, every money/mass/basis-point field a non-negative integer, every
      timestamp a valid ISO-8601 UTC instant, and every *_at window satisfying
      window_start_at < window_end_at.
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    category: schema
    applies_to: "all POST and PATCH endpoints"
  - priority: 30
    rule: "The entity named by the {id} path parameter must exist."
    error_id: "per-entity ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "all endpoints with a path parameter"
  - priority: 35
    rule: >-
      Every foreign-key id supplied in the request body must reference an existing row of the
      declared entity (customer_id, store_location_id, channel_id, resale_unit_id,
      refurb_bay_id, credit_policy_id, supersedes_report_id).
    error_id: "per-entity ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "all POST endpoints carrying foreign keys in the body"
  - priority: 40
    rule: >-
      A caller with role Customer may only read or act on rows whose customer_id equals the
      Customer row bound to their X-User-ID; requesting another customer's trade-in, grant,
      order or list filter is a non-owner access.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    category: ownership
    applies_to: "all endpoints whose allowed_roles include Customer"
  - priority: 50
    rule: >-
      The target entity must be in a state from which the requested transition is declared in
      §1.2; the emitted error is the domain-specific state error for that entity
      (ERR_TRADE_IN_NOT_RECEIVABLE, ERR_TRADE_IN_NOT_AUTHENTICATABLE,
      ERR_TRADE_IN_NOT_APPEALABLE, ERR_TRADE_IN_NOT_DISPOSITIONABLE,
      ERR_UNIT_NOT_SCHEDULABLE, ERR_UNIT_NOT_READY_FOR_LISTING, ERR_UNIT_NOT_LISTED,
      ERR_REFURB_ORDER_NOT_STARTABLE, ERR_REFURB_ORDER_NOT_LOGGABLE,
      ERR_REFURB_ORDER_NOT_QC_SUBMITTABLE, ERR_REFURB_ORDER_NOT_QC_DECIDABLE,
      ERR_ORDER_NOT_FULFILLABLE, ERR_ORDER_NOT_RETURN_REQUESTABLE,
      ERR_ORDER_RETURN_NOT_SETTLEABLE, ERR_CAMPAIGN_NOT_RUNNABLE,
      ERR_REPORT_ALREADY_PUBLISHED).
    error_id: "per-transition state error"
    http_status: 409
    category: state
    applies_to: "all action endpoints"
  - priority: 52
    rule: >-
      When an endpoint declares an expected_<parent>_version input, the supplied value must
      equal the current version of that parent row.
    error_id: "the concurrency rule's error_id (ERR_STALE_UNIT_VERSION, ERR_STALE_CUSTOMER_VERSION)"
    http_status: 412
    category: concurrency
    applies_to: "POST /recommerce/refurb-orders, POST /recommerce/resale-orders"
  - priority: 55
    rule: >-
      Segregation of duties on X-User-ID: the appeal re-grader must differ from
      trade_in.graded_by_user_id, and the QC decider must differ from
      refurb_order.performed_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    category: segregation_of_duties
    applies_to: "POST /recommerce/trade-ins/{id}/authenticate (on an APPEALED trade-in), POST /recommerce/refurb-orders/{id}/qc-decision"
  - priority: 56
    rule: "A trade-in whose authenticity_result is COUNTERFEIT can never be dispositioned ACCEPT."
    error_id: ERR_COUNTERFEIT_NOT_ACCEPTABLE
    http_status: 409
    category: business_rule
    applies_to: "POST /recommerce/trade-ins/{id}/disposition"
  - priority: 58
    rule: "The referenced Customer must have status ACTIVE; a SUSPENDED customer can neither trade in nor purchase."
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    category: state
    applies_to: "POST /recommerce/trade-ins, POST /recommerce/resale-orders"
  - priority: 59
    rule: "The referenced StoreLocation must have status ACTIVE, the referenced RefurbBay must have status AVAILABLE, and the referenced Channel must have status ACTIVE."
    error_id: "ERR_STORE_LOCATION_CLOSED, ERR_BAY_OUT_OF_SERVICE, ERR_CHANNEL_NOT_ACTIVE"
    http_status: 409
    category: state
    applies_to: "POST /recommerce/trade-ins, POST /recommerce/refurb-orders, POST /recommerce/resale-units/{id}/list, POST /recommerce/resale-orders, POST /recommerce/markdown-campaigns"
  - priority: 60
    rule: "The RefurbBay named by refurb_bay_id must belong to the same StoreLocation that received the unit's trade-in."
    error_id: ERR_BAY_STORE_MISMATCH
    http_status: 409
    category: cross_entity
    applies_to: "POST /recommerce/refurb-orders"
  - priority: 62
    rule: >-
      An ACTIVE GradePolicy must exist for the (product_category, grade) pair being priced and
      an ACTIVE CreditPolicy must exist when brand currency is issued or redeemed.
    error_id: "ERR_GRADE_POLICY_MISSING, ERR_CREDIT_POLICY_MISSING"
    http_status: 409
    category: cross_entity
    applies_to: "POST /recommerce/trade-ins, POST /recommerce/trade-ins/{id}/disposition, POST /recommerce/resale-units/{id}/list, POST /recommerce/resale-orders, POST /recommerce/refurb-orders/{id}/qc-decision, POST /recommerce/resale-orders/{id}/settle-return"
  - priority: 64
    rule: >-
      Assortment separation: a resale unit may only be listed on a Channel whose
      allowed_assortment is RESALE_ONLY or BOTH, never on a FULL_PRICE_DTC channel restricted
      to NEW_ONLY — this is the anti-cannibalization gate.
    error_id: ERR_ASSORTMENT_NOT_PERMITTED
    http_status: 409
    category: business_rule
    applies_to: "POST /recommerce/resale-units/{id}/list"
  - priority: 65
    rule: >-
      The unit's margin floor must not exceed the channel's price ceiling; otherwise the unit
      cannot be listed on that channel at all.
    error_id: ERR_MARGIN_FLOOR_ABOVE_CHANNEL_CEILING
    http_status: 409
    category: business_rule
    applies_to: "POST /recommerce/resale-units/{id}/list"
  - priority: 66
    rule: >-
      A refurbishment window must not conflict with any other non-terminal RefurbOrder in the
      same bay; two windows conflict when they overlap on the closed interval or when the gap
      between them is under SANITATION_BUFFER_MINUTES.
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    category: temporal
    applies_to: "POST /recommerce/refurb-orders"
  - priority: 67
    rule: >-
      A markdown campaign must not overlap, on the half-open interval
      [window_start_at, window_end_at), another SCHEDULED or ACTIVE campaign covering the same
      (channel_id, product_category) pair.
    error_id: ERR_CAMPAIGN_CATEGORY_OVERLAP
    http_status: 409
    category: temporal
    applies_to: "POST /recommerce/markdown-campaigns"
  - priority: 68
    rule: >-
      Aggregate capacity: at most MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL non-terminal campaigns
      may overlap the requested window on the same channel, counting across all product
      categories.
    error_id: ERR_CAMPAIGN_CAPACITY_EXCEEDED
    http_status: 409
    category: aggregate
    applies_to: "POST /recommerce/markdown-campaigns"
  - priority: 69
    rule: >-
      Mail-in items must be received within MAIL_IN_INTAKE_WINDOW_DAYS and in-store items
      within IN_STORE_INTAKE_WINDOW_DAYS of submission; the deadline comparison is inclusive,
      so clock_now equal to receive_deadline_at is still on time.
    error_id: ERR_INTAKE_WINDOW_EXPIRED
    http_status: 409
    category: temporal
    applies_to: "POST /recommerce/trade-ins/{id}/receive"
  - priority: 70
    rule: >-
      A BUYER_REMORSE return must be requested within REMORSE_WINDOW_DAYS of fulfilment, and a
      WARRANTY_DEFECT return within the unit tier's warranty_days; both deadlines are
      inclusive.
    error_id: "ERR_RETURN_WINDOW_CLOSED, ERR_WARRANTY_EXPIRED"
    http_status: 409
    category: temporal
    applies_to: "POST /recommerce/resale-orders/{id}/return-request"
  - priority: 71
    rule: "A refurbishment order may fail QC at most REWORK_LIMIT times."
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    category: limit
    applies_to: "POST /recommerce/refurb-orders/{id}/qc-decision"
  - priority: 72
    rule: "A trade-in grading may be appealed at most APPEAL_LIMIT times."
    error_id: ERR_APPEAL_LIMIT_EXCEEDED
    http_status: 409
    category: limit
    applies_to: "POST /recommerce/trade-ins/{id}/appeal"
  - priority: 73
    rule: >-
      A refurbishment order may only pass QC when its viability_ratio_bp is at most the tier's
      refurb_budget_cap_pct_bp; a non-viable order must be salvaged instead, unless an
      explicit viability_override_reason is supplied by a permitted role.
    error_id: ERR_REFURB_NOT_VIABLE
    http_status: 409
    category: threshold
    applies_to: "POST /recommerce/refurb-orders/{id}/qc-decision"
  - priority: 74
    rule: >-
      Supplying viability_override_reason requires role ProgramAdmin; a RefurbTechnician or
      MerchandisingManager cannot override the viability gate.
    error_id: ERR_OVERRIDE_ROLE_REQUIRED
    http_status: 403
    category: authorization
    applies_to: "POST /recommerce/refurb-orders/{id}/qc-decision"
  - priority: 75
    rule: >-
      Every credit grant drawn upon must be redeemable in the purchase channel: its pinned
      CreditPolicy.eligible_assortment must admit the channel's channel_type.
    error_id: ERR_CREDIT_NOT_REDEEMABLE_HERE
    http_status: 409
    category: business_rule
    applies_to: "POST /recommerce/resale-orders"
  - priority: 76
    rule: >-
      Requested credit must not exceed floor(order_total_minor * max_redemption_pct_bp / 10000);
      the boundary is inclusive, so a request equal to the cap is accepted.
    error_id: ERR_REDEMPTION_CAP_EXCEEDED
    http_status: 422
    category: threshold
    applies_to: "POST /recommerce/resale-orders"
  - priority: 77
    rule: >-
      Requested credit must not exceed the sum of remaining_minor over the customer's eligible
      unexpired grants.
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 422
    category: threshold
    applies_to: "POST /recommerce/resale-orders"
  - priority: 78
    rule: >-
      When any credit is applied, the residual cash_due_minor must be at least
      credit_row.min_cash_remainder_minor.
    error_id: ERR_MIN_CASH_REMAINDER
    http_status: 422
    category: threshold
    applies_to: "POST /recommerce/resale-orders"
  - priority: 79
    rule: >-
      A REPLACE settlement requires at least one eligible substitute unit LISTED on the same
      channel in the same category and condition tier.
    error_id: ERR_NO_REPLACEMENT_UNIT
    http_status: 409
    category: cross_entity
    applies_to: "POST /recommerce/resale-orders/{id}/settle-return"
  - priority: 80
    rule: >-
      A diversion report period must not overlap the period of any DRAFT or PUBLISHED report
      that is not the row being superseded; overlap is judged on the half-open interval.
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    category: temporal
    applies_to: "POST /recommerce/diversion-reports"
  - priority: 82
    rule: >-
      A window's end must be strictly after its start and, for markdown campaigns and
      diversion reports, the window must be expressible in whole days.
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    category: schema
    applies_to: "POST /recommerce/refurb-orders, POST /recommerce/markdown-campaigns, POST /recommerce/diversion-reports"

endpoints:
  - method: POST
    path: "/recommerce/customers"
    description: "Enroll a customer in the recommerce program."
    roles: [ProgramAdmin]
    code: 201
    input: ["email", "full_name", "loyalty_tier?"]
    output: Customer
    side_effects:
      - "status defaults to ACTIVE and loyalty_tier defaults to STANDARD"
      - "credit_balance_minor and diverted_grams_total initialized to 0"
      - "version initialized to 1"
  - method: PATCH
    path: "/recommerce/customers/{id}"
    description: "Update a customer's programme standing (suspension, loyalty tier)."
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "loyalty_tier?"]
    output: Customer
    side_effects:
      - "increments Customer.version by 1"
  - method: GET
    path: "/recommerce/customers/{id}"
    description: "Read one customer, including the derived credit_balance_minor and diverted_grams_total."
    roles: [ProgramAdmin, IntakeAgent, MerchandisingManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/recommerce/grade-policies"
    description: "Publish the condition-tier policy for one (product_category, condition_grade) pair."
    roles: [ProgramAdmin]
    code: 201
    input: [product_category, condition_grade, base_credit_pct_bp, resale_price_pct_bp, refurb_budget_cap_pct_bp, restock_fee_pct_bp, warranty_days]
    output: GradePolicy
    side_effects:
      - "status set to ACTIVE"
      - "any existing ACTIVE GradePolicy for the same (product_category, condition_grade) pair is set to RETIRED"
  - method: GET
    path: "/recommerce/grade-policies/{id}"
    description: "Read one condition-tier policy."
    roles: [ProgramAdmin, MerchandisingManager, Authenticator]
    code: 200
    input: []
    output: GradePolicy
    side_effects: []
  - method: POST
    path: "/recommerce/credit-policies"
    description: "Publish the brand-currency policy governing issuance, expiry and redemption restrictions."
    roles: [ProgramAdmin]
    code: 201
    input: [code, expiry_days, mail_in_bonus_pct_bp, max_redemption_pct_bp, min_cash_remainder_minor, eligible_assortment]
    output: CreditPolicy
    side_effects:
      - "status set to ACTIVE"
      - "any existing ACTIVE CreditPolicy is set to RETIRED"
  - method: GET
    path: "/recommerce/credit-policies/{id}"
    description: "Read one brand-currency policy."
    roles: [ProgramAdmin, MerchandisingManager]
    code: 200
    input: []
    output: CreditPolicy
    side_effects: []
  - method: POST
    path: "/recommerce/store-locations"
    description: "Register a store that accepts in-store trade-ins and hosts refurbishment bays."
    roles: [ProgramAdmin]
    code: 201
    input: [code, region_code]
    output: StoreLocation
    side_effects:
      - "status set to ACTIVE"
  - method: PATCH
    path: "/recommerce/store-locations/{id}"
    description: "Open or close a store location."
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: StoreLocation
    side_effects:
      - "increments StoreLocation.version by 1"
  - method: GET
    path: "/recommerce/store-locations/{id}"
    description: "Read one store location."
    roles: [ProgramAdmin, IntakeAgent, RefurbTechnician]
    code: 200
    input: []
    output: StoreLocation
    side_effects: []
  - method: POST
    path: "/recommerce/store-locations/{id}/refurb-bays"
    description: "Add a refurbishment bay of a given type to a store location."
    roles: [ProgramAdmin]
    code: 201
    input: [code, bay_type]
    output: RefurbBay
    side_effects:
      - "status set to AVAILABLE"
      - "store_location_id set from the path"
  - method: GET
    path: "/recommerce/store-locations/{id}/refurb-bays"
    description: "List the refurbishment bays of one store location."
    roles: [ProgramAdmin, RefurbTechnician]
    code: 200
    input: ["bay_type?", "status?", "limit?", "offset?"]
    output: RefurbBay[]
    side_effects: []
  - method: PATCH
    path: "/recommerce/refurb-bays/{id}"
    description: "Take a refurbishment bay out of service or return it to service."
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: RefurbBay
    side_effects:
      - "increments RefurbBay.version by 1"
  - method: POST
    path: "/recommerce/channels"
    description: "Register a sales channel and its assortment policy — the anti-cannibalization boundary."
    roles: [ProgramAdmin]
    code: 201
    input: [code, channel_type, allowed_assortment, max_resale_price_ratio_bp, region_code]
    output: Channel
    side_effects:
      - "status set to ACTIVE"
  - method: PATCH
    path: "/recommerce/channels/{id}"
    description: "Pause or resume a sales channel."
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: Channel
    side_effects:
      - "increments Channel.version by 1"
  - method: GET
    path: "/recommerce/channels/{id}"
    description: "Read one sales channel."
    roles: [ProgramAdmin, MerchandisingManager, Customer]
    code: 200
    input: []
    output: Channel
    side_effects: []
  - method: GET
    path: "/recommerce/channels/{id}/markdown-campaigns"
    description: "List the markdown campaigns declared on one channel."
    roles: [ProgramAdmin, MerchandisingManager]
    code: 200
    input: ["product_category?", "status?", "limit?", "offset?"]
    output: MarkdownCampaign[]
    side_effects: []
  - method: POST
    path: "/recommerce/trade-ins"
    description: "Submit a trade-in through the MAIL_IN or IN_STORE channel and receive a provisional credit quote."
    roles: [Customer, IntakeAgent]
    code: 201
    input: [customer_id, store_location_id, channel, product_category, declared_grade, msrp_minor, item_mass_grams]
    output: TradeIn
    side_effects:
      - "status set to SUBMITTED and authenticity_result set to PENDING"
      - "runs trade_in_appraised_credit variant quote_provisional into appraised_credit_minor"
      - "computes receive_deadline_at as created_at + MAIL_IN_INTAKE_WINDOW_DAYS or IN_STORE_INTAKE_WINDOW_DAYS by channel"
      - "appeal_count initialized to 0"
  - method: GET
    path: "/recommerce/trade-ins/{id}"
    description: "Read one trade-in with its provisional or final appraised credit."
    roles: [ProgramAdmin, IntakeAgent, Authenticator, Customer]
    code: 200
    input: []
    output: TradeIn
    side_effects: []
  - method: GET
    path: "/recommerce/trade-ins"
    description: "List trade-ins, filterable by customer, intake store, status and intake channel."
    roles: [ProgramAdmin, IntakeAgent, Authenticator, Customer]
    code: 200
    input: ["customer_id?", "store_location_id?", "status?", "channel?", "limit?", "offset?"]
    output: TradeIn[]
    side_effects: []
  - method: POST
    path: "/recommerce/trade-ins/{id}/receive"
    description: "Record physical receipt of the traded item at the intake store, within the channel's intake window."
    roles: [IntakeAgent]
    code: 200
    input: []
    output: TradeIn
    side_effects:
      - "status SUBMITTED -> RECEIVED"
      - "received_at set to the logical clock"
      - "increments TradeIn.version by 1"
  - method: POST
    path: "/recommerce/trade-ins/{id}/authenticate"
    description: "Record the authentication verdict and the assessed condition grade; also serves as the re-grade of an appealed trade-in."
    roles: [Authenticator]
    code: 200
    input: ["authenticity_result", "assessed_grade?"]
    output: TradeIn
    side_effects:
      - "status RECEIVED -> AUTHENTICATED, or APPEALED -> AUTHENTICATED for a re-grade"
      - "authenticity_result and assessed_grade written from the request"
      - "graded_by_user_id set to the acting X-User-ID"
      - "increments TradeIn.version by 1"
  - method: POST
    path: "/recommerce/trade-ins/{id}/appeal"
    description: "Contest the assessed condition grade, sending the trade-in back for an independent re-grade."
    roles: [Customer, ProgramAdmin]
    code: 200
    input: [appeal_reason]
    output: TradeIn
    side_effects:
      - "status AUTHENTICATED -> APPEALED"
      - "increments appeal_count by 1, capped by APPEAL_LIMIT"
      - "increments TradeIn.version by 1"
  - method: POST
    path: "/recommerce/trade-ins/{id}/disposition"
    description: "Accept or reject an authenticated trade-in; acceptance issues brand currency and creates the resale unit."
    roles: [Authenticator, ProgramAdmin]
    code: 200
    input: ["decision", "reject_reason?", "ownership_treatment?"]
    output: TradeIn
    side_effects:
      - "status AUTHENTICATED -> ACCEPTED or AUTHENTICATED -> REJECTED"
      - "on ACCEPT: runs trade_in_appraised_credit variant issuance_final and overwrites appraised_credit_minor"
      - "on ACCEPT: creates one CreditGrant (status ISSUED, expires_at from the pinned CreditPolicy.expiry_days) and one ISSUE CreditLedgerEntry"
      - "on ACCEPT: increments Customer.credit_balance_minor and Customer.diverted_grams_total, and increments Customer.version by 1"
      - "on ACCEPT: creates one ResaleUnit in lifecycle_state INTAKE and accounting_state UNCAPITALIZED, carrying mass_grams from item_mass_grams and reference_msrp_minor from msrp_minor"
      - "sets accepted_at to the logical clock; increments TradeIn.version by 1"
  - method: GET
    path: "/recommerce/resale-units/{id}"
    description: "Read one resale unit with its lifecycle state, accounting state and current price."
    roles: [ProgramAdmin, MerchandisingManager, RefurbTechnician, Customer]
    code: 200
    input: []
    output: ResaleUnit
    side_effects: []
  - method: GET
    path: "/recommerce/resale-units"
    description: "List resale units, filterable by source trade-in, replacement lineage, listing channel and state."
    roles: [ProgramAdmin, MerchandisingManager, RefurbTechnician, Customer]
    code: 200
    input: ["trade_in_id?", "replacement_for_unit_id?", "listed_channel_id?", "lifecycle_state?", "accounting_state?", "product_category?", "limit?", "offset?"]
    output: ResaleUnit[]
    side_effects: []
  - method: POST
    path: "/recommerce/resale-units/{id}/list"
    description: "List a refurbished unit on a resale-eligible channel at its policy-derived price."
    roles: [MerchandisingManager]
    code: 200
    input: [channel_id]
    output: ResaleUnit
    side_effects:
      - "lifecycle_state READY -> LISTED, or RETURNED -> LISTED when re-listing a refunded unit"
      - "runs resale_list_price into list_price_minor and current_price_minor"
      - "listed_channel_id and listed_at set; markdown_step_count reset to 0"
      - "increments ResaleUnit.version by 1"
  - method: POST
    path: "/recommerce/refurb-orders"
    description: "Schedule a refurbishment order for an intake unit in a bay window."
    roles: [RefurbTechnician, ProgramAdmin]
    code: 201
    input: [resale_unit_id, refurb_bay_id, window_start_at, window_end_at, expected_resale_unit_version]
    output: RefurbOrder
    side_effects:
      - "status set to SCHEDULED; rework_count, logged_cost_minor and viability_ratio_bp initialized to 0"
      - "the unit's lifecycle_state must still be INTAKE; scheduling does not itself move the unit"
      - "increments ResaleUnit.version by 1"
      - "any other SCHEDULED RefurbOrder on the same resale unit is set to SUPERSEDED"
  - method: GET
    path: "/recommerce/refurb-orders/{id}"
    description: "Read one refurbishment order with its logged cost and viability ratio."
    roles: [ProgramAdmin, RefurbTechnician, MerchandisingManager]
    code: 200
    input: []
    output: RefurbOrder
    side_effects: []
  - method: GET
    path: "/recommerce/refurb-orders"
    description: "List refurbishment orders, filterable by unit, bay and status."
    roles: [ProgramAdmin, RefurbTechnician, MerchandisingManager]
    code: 200
    input: ["resale_unit_id?", "refurb_bay_id?", "status?", "limit?", "offset?"]
    output: RefurbOrder[]
    side_effects: []
  - method: POST
    path: "/recommerce/refurb-orders/{id}/tasks"
    description: "Log one immutable refurbishment task line (cleaning, repair or repackaging labour plus parts)."
    roles: [RefurbTechnician]
    code: 201
    input: [task_type, labor_minutes, parts_cost_minor]
    output: RefurbTask
    side_effects:
      - "runs refurb_logged_cost for the line into RefurbTask.cost_minor and assigns the next sequence_no"
      - "logged_by_user_id set to the acting X-User-ID"
      - "re-materializes RefurbOrder.logged_cost_minor and RefurbOrder.viability_ratio_bp"
      - "increments RefurbOrder.version by 1"
  - method: GET
    path: "/recommerce/refurb-orders/{id}/tasks"
    description: "List the task lines logged against one refurbishment order."
    roles: [ProgramAdmin, RefurbTechnician, MerchandisingManager]
    code: 200
    input: ["task_type?", "limit?", "offset?"]
    output: RefurbTask[]
    side_effects: []
  - method: POST
    path: "/recommerce/refurb-orders/{id}/start"
    description: "Begin work on a scheduled refurbishment order."
    roles: [RefurbTechnician]
    code: 200
    input: []
    output: RefurbOrder
    side_effects:
      - "status SCHEDULED -> IN_PROGRESS, or QC_FAILED -> IN_PROGRESS for a rework round"
      - "on the SCHEDULED -> IN_PROGRESS leg: ResaleUnit.lifecycle_state INTAKE -> IN_REFURB and increments ResaleUnit.version by 1"
      - "performed_by_user_id set to the acting X-User-ID"
      - "increments RefurbOrder.version by 1"
  - method: POST
    path: "/recommerce/refurb-orders/{id}/submit-qc"
    description: "Submit a refurbished unit for quality control."
    roles: [RefurbTechnician]
    code: 200
    input: []
    output: RefurbOrder
    side_effects:
      - "status IN_PROGRESS -> QC_PENDING"
      - "re-materializes logged_cost_minor and viability_ratio_bp"
      - "increments RefurbOrder.version by 1"
  - method: POST
    path: "/recommerce/refurb-orders/{id}/qc-decision"
    description: "Pass, fail or salvage a refurbishment order under QC; passing capitalizes the unit's carrying cost."
    roles: [RefurbTechnician, ProgramAdmin]
    code: 200
    input: [decision, "viability_override_reason?"]
    output: RefurbOrder
    side_effects:
      - "status QC_PENDING -> COMPLETED, QC_PENDING -> QC_FAILED or QC_PENDING -> SALVAGED"
      - "qc_by_user_id set to the acting X-User-ID, which must differ from performed_by_user_id"
      - "on PASS: enforces refurb_viability_ratio against the tier cap, runs resale_unit_capitalized_cost, moves ResaleUnit.lifecycle_state IN_REFURB -> READY and accounting_state UNCAPITALIZED -> CAPITALIZED"
      - "on FAIL: increments rework_count, capped by REWORK_LIMIT"
      - "on SALVAGE: moves ResaleUnit.lifecycle_state IN_REFURB -> SALVAGED and accounting_state UNCAPITALIZED -> EXPENSED"
      - "increments RefurbOrder.version and ResaleUnit.version by 1"
  - method: POST
    path: "/recommerce/markdown-campaigns"
    description: "Declare a markdown cadence for one channel and product category over a window."
    roles: [MerchandisingManager, ProgramAdmin]
    code: 201
    input: [channel_id, product_category, window_start_at, window_end_at, cadence_days, step_bp, floor_pct_bp]
    output: MarkdownCampaign
    side_effects:
      - "status set to SCHEDULED; run_count initialized to 0"
  - method: GET
    path: "/recommerce/markdown-campaigns/{id}"
    description: "Read one markdown campaign with its run counter."
    roles: [ProgramAdmin, MerchandisingManager]
    code: 200
    input: []
    output: MarkdownCampaign
    side_effects: []
  - method: POST
    path: "/recommerce/markdown-campaigns/{id}/cadence-runs"
    description: "Execute one markdown cadence run at the current logical clock across the campaign's eligible aged inventory."
    roles: [MerchandisingManager, ProgramAdmin]
    code: 200
    input: []
    output: { run_sequence_no: integer, evaluated_unit_count: integer, marked_down_unit_count: integer, skipped_at_floor_count: integer, written_down_unit_count: integer, total_markdown_minor: integer }
    side_effects:
      - "status SCHEDULED -> ACTIVE on the first run inside the window"
      - "runs markdown_cadence_step over every eligible LISTED unit in listed_at ASC order"
      - "increments MarkdownCampaign.run_count, sets last_run_at, increments MarkdownCampaign.version by 1 even when no unit is eligible"
      - "increments ResaleUnit.version by 1 for every unit whose price actually changed"
  - method: POST
    path: "/recommerce/resale-orders"
    description: "Purchase a listed resale unit, optionally redeeming brand currency subject to the redemption restrictions."
    roles: [Customer, MerchandisingManager]
    code: 201
    input: [customer_id, channel_id, resale_unit_id, requested_credit_minor, expected_customer_version]
    output: ResaleOrder
    side_effects:
      - "status set to PLACED and reason_type set to NONE"
      - "runs resale_order_settlement into gross_price_minor, channel_fee_minor, order_total_minor, credit_applied_minor and cash_due_minor"
      - "appends one REDEEM CreditLedgerEntry per drawn CreditGrant and moves each drained grant to PARTIALLY_REDEEMED or EXHAUSTED"
      - "decrements Customer.credit_balance_minor and increments Customer.version by 1"
      - "ResaleUnit.lifecycle_state LISTED -> RESERVED and increments ResaleUnit.version by 1"
  - method: GET
    path: "/recommerce/resale-orders/{id}"
    description: "Read one resale order with its settlement breakdown."
    roles: [ProgramAdmin, MerchandisingManager, Customer]
    code: 200
    input: []
    output: ResaleOrder
    side_effects: []
  - method: GET
    path: "/recommerce/resale-orders"
    description: "List resale orders, filterable by customer, channel and unit."
    roles: [ProgramAdmin, MerchandisingManager, Customer]
    code: 200
    input: ["customer_id?", "channel_id?", "resale_unit_id?", "status?", "limit?", "offset?"]
    output: ResaleOrder[]
    side_effects: []
  - method: GET
    path: "/recommerce/resale-orders/{id}/ledger-entries"
    description: "List the brand-currency ledger entries produced by one resale order."
    roles: [ProgramAdmin, MerchandisingManager, Customer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/recommerce/resale-orders/{id}/fulfill"
    description: "Ship a placed resale order, starting the resale warranty clock."
    roles: [MerchandisingManager, ProgramAdmin]
    code: 200
    input: []
    output: ResaleOrder
    side_effects:
      - "status PLACED -> FULFILLED; fulfilled_at set to the logical clock"
      - "warranty_expires_at set to fulfilled_at plus the unit tier's warranty_days"
      - "ResaleUnit.lifecycle_state RESERVED -> SOLD and increments ResaleUnit.version by 1"
      - "increments ResaleOrder.version by 1"
  - method: POST
    path: "/recommerce/resale-orders/{id}/return-request"
    description: "Open a return on a fulfilled resale order, as buyer remorse or as a warranty defect claim."
    roles: [Customer, ProgramAdmin]
    code: 200
    input: [reason_type]
    output: ResaleOrder
    side_effects:
      - "status FULFILLED -> RETURN_REQUESTED"
      - "reason_type and return_requested_at written"
      - "increments ResaleOrder.version by 1"
  - method: POST
    path: "/recommerce/resale-orders/{id}/settle-return"
    description: "Settle an open return by refunding, replacing with an equivalent unit, or denying the claim."
    roles: [MerchandisingManager, ProgramAdmin]
    code: 200
    input: [resolution]
    output: ResaleOrder
    side_effects:
      - "on REFUND: status RETURN_REQUESTED -> RETURNED, runs return_refund_settlement into restock_fee_minor, refund_cash_minor and refund_credit_minor, appends RELEASE CreditLedgerEntry rows, restores Customer.credit_balance_minor, and moves ResaleUnit.lifecycle_state SOLD -> RETURNED while leaving accounting_state exactly as it was"
      - "on REPLACE: status RETURN_REQUESTED -> REPLACED, runs replacement_unit_selector, moves the substitute unit LISTED -> SOLD with replacement_for_unit_id set to the defective unit, and moves the defective unit SOLD -> SALVAGED with accounting_state -> EXPENSED"
      - "on DENY: status RETURN_REQUESTED -> FULFILLED and reason_type reset to NONE"
      - "increments ResaleOrder.version, Customer.version and every touched ResaleUnit.version by 1"
  - method: GET
    path: "/recommerce/credit-grants/{id}"
    description: "Read one brand-currency grant with its remaining balance and expiry."
    roles: [ProgramAdmin, MerchandisingManager, Customer]
    code: 200
    input: []
    output: CreditGrant
    side_effects: []
  - method: GET
    path: "/recommerce/credit-grants"
    description: "List brand-currency grants, filterable by customer, source trade-in and governing policy."
    roles: [ProgramAdmin, MerchandisingManager, Customer]
    code: 200
    input: ["customer_id?", "trade_in_id?", "credit_policy_id?", "status?", "limit?", "offset?"]
    output: CreditGrant[]
    side_effects: []
  - method: GET
    path: "/recommerce/credit-grants/{id}/ledger-entries"
    description: "List the immutable ledger entries of one brand-currency grant."
    roles: [ProgramAdmin, MerchandisingManager, Customer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/recommerce/credit-grants/expiry-runs"
    description: "Sweep every grant whose expires_at has been reached at the current logical clock."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { expired_grant_count: integer, expired_amount_minor: integer, affected_customer_count: integer }
    side_effects:
      - "runs credit_expiry_sweep"
      - "appends one EXPIRE CreditLedgerEntry per swept grant and sets remaining_minor to 0 with status EXPIRED"
      - "recomputes Customer.credit_balance_minor and increments Customer.version by 1 for every affected customer"
  - method: POST
    path: "/recommerce/diversion-reports"
    description: "Generate a sustainability diversion report over a half-open period, optionally superseding an earlier report."
    roles: [ProgramAdmin]
    code: 201
    input: [period_start_at, period_end_at, "supersedes_report_id?"]
    output: DiversionReport
    side_effects:
      - "status set to DRAFT"
      - "runs diversion_metrics into units_diverted_count, diverted_grams, salvage_grams, landfill_diversion_rate_bp and credit_liability_minor"
  - method: GET
    path: "/recommerce/diversion-reports/{id}"
    description: "Read one diversion report with its frozen metrics."
    roles: [ProgramAdmin, MerchandisingManager]
    code: 200
    input: []
    output: DiversionReport
    side_effects: []
  - method: GET
    path: "/recommerce/diversion-reports"
    description: "List diversion reports, filterable by the report they supersede and by status."
    roles: [ProgramAdmin, MerchandisingManager]
    code: 200
    input: ["supersedes_report_id?", "status?", "limit?", "offset?"]
    output: DiversionReport[]
    side_effects: []
  - method: POST
    path: "/recommerce/diversion-reports/{id}/publish"
    description: "Publish a draft diversion report, freezing its metrics and superseding the report it replaces."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DiversionReport
    side_effects:
      - "status DRAFT -> PUBLISHED; published_at set to the logical clock"
      - "the report named by supersedes_report_id moves PUBLISHED -> SUPERSEDED and increments its version by 1"
      - "increments DiversionReport.version by 1"
  - method: POST
    path: "/recommerce/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to an arbitrary UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ProgramAdmin, IntakeAgent, Authenticator, RefurbTechnician, MerchandisingManager, Customer]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock used by every deadline, expiry, ageing and window comparison"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing, empty or whitespace-only on any endpoint other than the clock setter"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Customer-role caller addresses a trade-in, grant, order, unit or filter belonging to a different customer_id"
  - id: ERR_OVERRIDE_ROLE_REQUIRED
    http: 403
    condition: "viability_override_reason supplied on a QC decision by a role other than ProgramAdmin"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unknown enum value, negative money/mass/basis-point value, or malformed ISO-8601 instant"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "window_end_at is not strictly after window_start_at, or a campaign/report window is not a whole number of days"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "No Customer exists for the supplied path id or customer_id"
  - id: ERR_GRADE_POLICY_NOT_FOUND
    http: 404
    condition: "No GradePolicy exists for the supplied path id"
  - id: ERR_CREDIT_POLICY_NOT_FOUND
    http: 404
    condition: "No CreditPolicy exists for the supplied path id"
  - id: ERR_STORE_LOCATION_NOT_FOUND
    http: 404
    condition: "No StoreLocation exists for the supplied path id or store_location_id"
  - id: ERR_REFURB_BAY_NOT_FOUND
    http: 404
    condition: "No RefurbBay exists for the supplied path id or refurb_bay_id"
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "No Channel exists for the supplied path id or channel_id"
  - id: ERR_TRADE_IN_NOT_FOUND
    http: 404
    condition: "No TradeIn exists for the supplied path id or trade_in_id filter"
  - id: ERR_CREDIT_GRANT_NOT_FOUND
    http: 404
    condition: "No CreditGrant exists for the supplied path id"
  - id: ERR_RESALE_UNIT_NOT_FOUND
    http: 404
    condition: "No ResaleUnit exists for the supplied path id or resale_unit_id"
  - id: ERR_REFURB_ORDER_NOT_FOUND
    http: 404
    condition: "No RefurbOrder exists for the supplied path id"
  - id: ERR_MARKDOWN_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "No MarkdownCampaign exists for the supplied path id"
  - id: ERR_RESALE_ORDER_NOT_FOUND
    http: 404
    condition: "No ResaleOrder exists for the supplied path id"
  - id: ERR_DIVERSION_REPORT_NOT_FOUND
    http: 404
    condition: "No DiversionReport exists for the supplied path id or supersedes_report_id"
  - id: ERR_TRADE_IN_NOT_RECEIVABLE
    http: 409
    condition: "Receipt attempted on a trade-in whose status is not SUBMITTED"
  - id: ERR_TRADE_IN_NOT_AUTHENTICATABLE
    http: 409
    condition: "Authentication attempted on a trade-in whose status is neither RECEIVED nor APPEALED"
  - id: ERR_TRADE_IN_NOT_APPEALABLE
    http: 409
    condition: "Appeal attempted on a trade-in whose status is not AUTHENTICATED"
  - id: ERR_TRADE_IN_NOT_DISPOSITIONABLE
    http: 409
    condition: "Disposition attempted on a trade-in whose status is not AUTHENTICATED"
  - id: ERR_INTAKE_WINDOW_EXPIRED
    http: 409
    condition: "Receipt attempted after receive_deadline_at has strictly passed on the logical clock"
  - id: ERR_APPEAL_LIMIT_EXCEEDED
    http: 409
    condition: "Appeal attempted when appeal_count has already reached APPEAL_LIMIT"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID equals graded_by_user_id on an appeal re-grade, or equals performed_by_user_id on a QC decision"
  - id: ERR_COUNTERFEIT_NOT_ACCEPTABLE
    http: 409
    condition: "Disposition ACCEPT attempted on a trade-in whose authenticity_result is COUNTERFEIT"
  - id: ERR_CUSTOMER_SUSPENDED
    http: 409
    condition: "The referenced Customer has status SUSPENDED"
  - id: ERR_STORE_LOCATION_CLOSED
    http: 409
    condition: "The referenced StoreLocation has status CLOSED"
  - id: ERR_BAY_OUT_OF_SERVICE
    http: 409
    condition: "The referenced RefurbBay has status OUT_OF_SERVICE"
  - id: ERR_CHANNEL_NOT_ACTIVE
    http: 409
    condition: "The referenced Channel has status PAUSED"
  - id: ERR_GRADE_POLICY_MISSING
    http: 409
    condition: "No ACTIVE GradePolicy exists for the (product_category, grade) pair being priced"
  - id: ERR_CREDIT_POLICY_MISSING
    http: 409
    condition: "No ACTIVE CreditPolicy exists when brand currency must be issued or redeemed"
  - id: ERR_UNIT_NOT_SCHEDULABLE
    http: 409
    condition: "Refurbishment scheduling attempted on a unit whose lifecycle_state is not INTAKE"
  - id: ERR_BAY_STORE_MISMATCH
    http: 409
    condition: "The requested bay belongs to a different StoreLocation than the one that received the unit's trade-in"
  - id: ERR_BAY_WINDOW_CONFLICT
    http: 409
    condition: "The requested bay window overlaps, or falls within SANITATION_BUFFER_MINUTES of, another non-terminal order in the same bay"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_resale_unit_version does not equal the current ResaleUnit.version"
  - id: ERR_REFURB_ORDER_NOT_STARTABLE
    http: 409
    condition: "Start attempted on an order whose status is neither SCHEDULED nor QC_FAILED"
  - id: ERR_REFURB_ORDER_NOT_LOGGABLE
    http: 409
    condition: "Task logging attempted on an order whose status is not IN_PROGRESS"
  - id: ERR_REFURB_ORDER_NOT_QC_SUBMITTABLE
    http: 409
    condition: "QC submission attempted on an order whose status is not IN_PROGRESS"
  - id: ERR_REFURB_ORDER_NOT_QC_DECIDABLE
    http: 409
    condition: "QC decision attempted on an order whose status is not QC_PENDING"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "QC decision FAIL attempted when rework_count has already reached REWORK_LIMIT"
  - id: ERR_REFURB_NOT_VIABLE
    http: 409
    condition: "QC decision PASS attempted when viability_ratio_bp strictly exceeds the tier's refurb_budget_cap_pct_bp and no admin override reason is supplied"
  - id: ERR_UNIT_NOT_READY_FOR_LISTING
    http: 409
    condition: "Listing attempted on a unit whose lifecycle_state is neither READY (first listing) nor RETURNED (re-listing after a refund)"
  - id: ERR_ASSORTMENT_NOT_PERMITTED
    http: 409
    condition: "Listing attempted on a Channel whose allowed_assortment is NEW_ONLY — the assortment-separation gate that prevents cannibalization of full-price sales"
  - id: ERR_MARGIN_FLOOR_ABOVE_CHANNEL_CEILING
    http: 409
    condition: "The unit's margin floor exceeds the channel's price ceiling, so no compliant list price exists"
  - id: ERR_CAMPAIGN_CATEGORY_OVERLAP
    http: 409
    condition: "The requested campaign window overlaps another non-terminal campaign on the same channel and product category"
  - id: ERR_CAMPAIGN_CAPACITY_EXCEEDED
    http: 409
    condition: "The requested campaign window would make more than MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL campaigns overlap on the same channel across all categories"
  - id: ERR_CAMPAIGN_NOT_RUNNABLE
    http: 409
    condition: "A cadence run is requested on a CLOSED campaign, or at a logical clock strictly before window_start_at (a run at or after window_end_at is legal: it closes the campaign and steps nothing)"
  - id: ERR_UNIT_NOT_LISTED
    http: 409
    condition: "Purchase attempted on a unit whose lifecycle_state is not LISTED, or whose listed_channel_id differs from the order's channel_id"
  - id: ERR_STALE_CUSTOMER_VERSION
    http: 412
    condition: "expected_customer_version does not equal the current Customer.version"
  - id: ERR_CREDIT_NOT_REDEEMABLE_HERE
    http: 409
    condition: "The customer holds credit but its pinned CreditPolicy.eligible_assortment does not admit the purchase channel's channel_type"
  - id: ERR_REDEMPTION_CAP_EXCEEDED
    http: 422
    condition: "requested_credit_minor strictly exceeds floor(order_total_minor * max_redemption_pct_bp / 10000)"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 422
    condition: "requested_credit_minor strictly exceeds the sum of remaining_minor over the customer's eligible unexpired grants"
  - id: ERR_MIN_CASH_REMAINDER
    http: 422
    condition: "Credit is applied and the residual cash_due_minor falls below CreditPolicy.min_cash_remainder_minor"
  - id: ERR_ORDER_NOT_FULFILLABLE
    http: 409
    condition: "Fulfilment attempted on an order whose status is not PLACED"
  - id: ERR_ORDER_NOT_RETURN_REQUESTABLE
    http: 409
    condition: "Return request attempted on an order whose status is not FULFILLED"
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 409
    condition: "A BUYER_REMORSE return is requested more than REMORSE_WINDOW_DAYS after fulfilled_at"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "A WARRANTY_DEFECT return is requested after warranty_expires_at has strictly passed"
  - id: ERR_ORDER_RETURN_NOT_SETTLEABLE
    http: 409
    condition: "Return settlement attempted on an order whose status is not RETURN_REQUESTED"
  - id: ERR_NO_REPLACEMENT_UNIT
    http: 409
    condition: "REPLACE settlement requested when no eligible substitute unit is LISTED on the same channel in the same category and condition tier"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "The requested report period overlaps a DRAFT or PUBLISHED report that is not the one being superseded"
  - id: ERR_REPORT_ALREADY_PUBLISHED
    http: 409
    condition: "Publication attempted on a report whose status is not DRAFT"

roles:
  - name: ProgramAdmin
    description: "Owns the recommerce programme configuration: customers, policies, stores, bays, channels, credit expiry sweeps and sustainability reporting. Sole holder of the viability-override authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /recommerce/customers"
      - "PATCH /recommerce/customers/{id}"
      - "POST /recommerce/grade-policies"
      - "POST /recommerce/credit-policies"
      - "GET /recommerce/credit-policies/{id}"
      - "POST /recommerce/store-locations"
      - "PATCH /recommerce/store-locations/{id}"
      - "POST /recommerce/store-locations/{id}/refurb-bays"
      - "PATCH /recommerce/refurb-bays/{id}"
      - "POST /recommerce/channels"
      - "PATCH /recommerce/channels/{id}"
      - "POST /recommerce/credit-grants/expiry-runs"
      - "POST /recommerce/diversion-reports"
      - "POST /recommerce/diversion-reports/{id}/publish"
      - "supplying viability_override_reason on POST /recommerce/refurb-orders/{id}/qc-decision"
    shared_operations:
      - "GET /recommerce/customers/{id}"
      - "GET /recommerce/grade-policies/{id}"
      - "GET /recommerce/store-locations/{id}"
      - "GET /recommerce/store-locations/{id}/refurb-bays"
      - "GET /recommerce/channels/{id}"
      - "GET /recommerce/channels/{id}/markdown-campaigns"
      - "GET /recommerce/trade-ins/{id}"
      - "GET /recommerce/trade-ins"
      - "POST /recommerce/trade-ins/{id}/appeal"
      - "POST /recommerce/trade-ins/{id}/disposition"
      - "GET /recommerce/resale-units/{id}"
      - "GET /recommerce/resale-units"
      - "POST /recommerce/refurb-orders"
      - "GET /recommerce/refurb-orders/{id}"
      - "GET /recommerce/refurb-orders"
      - "GET /recommerce/refurb-orders/{id}/tasks"
      - "POST /recommerce/refurb-orders/{id}/qc-decision"
      - "POST /recommerce/markdown-campaigns"
      - "GET /recommerce/markdown-campaigns/{id}"
      - "POST /recommerce/markdown-campaigns/{id}/cadence-runs"
      - "GET /recommerce/resale-orders/{id}"
      - "GET /recommerce/resale-orders"
      - "GET /recommerce/resale-orders/{id}/ledger-entries"
      - "POST /recommerce/resale-orders/{id}/fulfill"
      - "POST /recommerce/resale-orders/{id}/return-request"
      - "POST /recommerce/resale-orders/{id}/settle-return"
      - "GET /recommerce/credit-grants/{id}"
      - "GET /recommerce/credit-grants"
      - "GET /recommerce/credit-grants/{id}/ledger-entries"
      - "GET /recommerce/diversion-reports/{id}"
      - "GET /recommerce/diversion-reports"
      - "POST /recommerce/_clock/set_current_utc"
  - name: IntakeAgent
    description: "Store-side operator who takes physical custody of traded goods and records receipt inside the channel's intake window."
    identity: "opaque"
    exclusive_operations:
      - "POST /recommerce/trade-ins/{id}/receive"
    shared_operations:
      - "POST /recommerce/trade-ins"
      - "GET /recommerce/customers/{id}"
      - "GET /recommerce/store-locations/{id}"
      - "GET /recommerce/trade-ins/{id}"
      - "GET /recommerce/trade-ins"
      - "POST /recommerce/_clock/set_current_utc"
  - name: Authenticator
    description: "Independent grader who rules on authenticity and condition and dispositions authenticated trade-ins. Barred by segregation of duties from re-grading its own appealed assessment."
    identity: "opaque"
    exclusive_operations:
      - "POST /recommerce/trade-ins/{id}/authenticate"
    shared_operations:
      - "GET /recommerce/grade-policies/{id}"
      - "GET /recommerce/trade-ins/{id}"
      - "GET /recommerce/trade-ins"
      - "POST /recommerce/trade-ins/{id}/disposition"
      - "POST /recommerce/_clock/set_current_utc"
  - name: RefurbTechnician
    description: "Refurbishment operator who schedules bay windows, logs cleaning, repair and repackaging effort, and submits work to QC. Barred by segregation of duties from passing its own work."
    identity: "opaque"
    exclusive_operations:
      - "POST /recommerce/refurb-orders/{id}/tasks"
      - "POST /recommerce/refurb-orders/{id}/start"
      - "POST /recommerce/refurb-orders/{id}/submit-qc"
    shared_operations:
      - "GET /recommerce/store-locations/{id}"
      - "GET /recommerce/store-locations/{id}/refurb-bays"
      - "POST /recommerce/refurb-orders"
      - "GET /recommerce/refurb-orders/{id}"
      - "GET /recommerce/refurb-orders"
      - "GET /recommerce/refurb-orders/{id}/tasks"
      - "POST /recommerce/refurb-orders/{id}/qc-decision"
      - "GET /recommerce/resale-units/{id}"
      - "GET /recommerce/resale-units"
      - "POST /recommerce/_clock/set_current_utc"
  - name: MerchandisingManager
    description: "Owns the resale assortment: lists refurbished units on resale-eligible channels, runs markdown cadences on aged inventory, and settles returns."
    identity: "opaque"
    exclusive_operations:
      - "POST /recommerce/resale-units/{id}/list"
    shared_operations:
      - "GET /recommerce/customers/{id}"
      - "GET /recommerce/grade-policies/{id}"
      - "GET /recommerce/credit-policies/{id}"
      - "GET /recommerce/channels/{id}"
      - "GET /recommerce/channels/{id}/markdown-campaigns"
      - "GET /recommerce/resale-units/{id}"
      - "GET /recommerce/resale-units"
      - "GET /recommerce/refurb-orders/{id}"
      - "GET /recommerce/refurb-orders"
      - "GET /recommerce/refurb-orders/{id}/tasks"
      - "POST /recommerce/markdown-campaigns"
      - "GET /recommerce/markdown-campaigns/{id}"
      - "POST /recommerce/markdown-campaigns/{id}/cadence-runs"
      - "POST /recommerce/resale-orders"
      - "GET /recommerce/resale-orders/{id}"
      - "GET /recommerce/resale-orders"
      - "GET /recommerce/resale-orders/{id}/ledger-entries"
      - "POST /recommerce/resale-orders/{id}/fulfill"
      - "POST /recommerce/resale-orders/{id}/settle-return"
      - "GET /recommerce/credit-grants/{id}"
      - "GET /recommerce/credit-grants"
      - "GET /recommerce/credit-grants/{id}/ledger-entries"
      - "GET /recommerce/diversion-reports/{id}"
      - "GET /recommerce/diversion-reports"
      - "POST /recommerce/_clock/set_current_utc"
  - name: Customer
    description: "The consumer participating in the programme: submits trade-ins, appeals grades, redeems brand currency on resale purchases and opens returns. X-User-ID is the Customer row's id, and every read or write is scoped to that id."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET /recommerce/customers/{id}"
      - "GET /recommerce/channels/{id}"
      - "POST /recommerce/trade-ins"
      - "GET /recommerce/trade-ins/{id}"
      - "GET /recommerce/trade-ins"
      - "POST /recommerce/trade-ins/{id}/appeal"
      - "GET /recommerce/resale-units/{id}"
      - "GET /recommerce/resale-units"
      - "POST /recommerce/resale-orders"
      - "GET /recommerce/resale-orders/{id}"
      - "GET /recommerce/resale-orders"
      - "GET /recommerce/resale-orders/{id}/ledger-entries"
      - "POST /recommerce/resale-orders/{id}/return-request"
      - "GET /recommerce/credit-grants/{id}"
      - "GET /recommerce/credit-grants"
      - "GET /recommerce/credit-grants/{id}/ledger-entries"
      - "POST /recommerce/_clock/set_current_utc"
