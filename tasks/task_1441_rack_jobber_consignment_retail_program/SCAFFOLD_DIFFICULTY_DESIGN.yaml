            - { call: "GET /inventory-balances", payload: { store_agreement_id: "${agr}", product_id: "${prod}" }, as: JobberAdmin }
            - { call: "GET /agreements/${agr}", payload: {}, as: JobberAdmin, captures: { agr_v2: "$.data.version" } }
            - { call: "GET /service-visits/${v2}", payload: {}, as: JobberAdmin }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 210, effective_from: "2026-08-01T12:00:00Z", expected_store_agreement_version: "${agr_v2}" }, as: JobberAdmin, captures: { blocked_err: "$.data.error_id" } }
          assert:
