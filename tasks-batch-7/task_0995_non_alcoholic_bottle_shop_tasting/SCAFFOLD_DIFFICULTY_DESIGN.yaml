              as: ShopStaff
              captures:
                ev11_v: "$.data.version"
            - call: "POST /nabs/tasting-events/${ev11_id}/seats"
              payload: { member_id: "${member11_id}", expected_event_version: "${ev11_v}" }
              as: Member
              as_user_id: "${member11_id}"
              captures:
                seat11_id: "$.data.id"
            - call: "POST /nabs/tasting-seats/${seat11_id}/confirm"
              as: Member
              as_user_id: "${member11_id}"
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T11:00:00Z" }
              as: PlatformAdmin
            # Note: event transitions PUBLISHED -> LOCKED -> IN_SESSION happen via clock;
            # LOCKED at starts_at-24h = 2026-05-01T10:00 (already past at initial clock);
            # IN_SESSION at starts_at. After setting clock to 2026-05-02T11:00 event is IN_SESSION.
          trigger:
            - call: "POST /nabs/tasting-seats/${seat11_id}/check-in"
              as: ShopStaff
            # After check-in, award = round_half_up(4999 * 1.0) = 4999 — member still BRONZE (4999 < 5000)
            - call: "GET /nabs/members/${member11_id}"
              as: ShopStaff
              captures:
                tier_4999: "$.data.loyalty_tier"
                lifetime_4999: "$.data.loyalty_points_lifetime"
            # Now award exactly 1 more point via a tiny seat (floor(100/100)=1) on a second event
            - call: "POST /nabs/tasting-events"
              payload: { title: "T11b", host_member_id: "${host11_id}", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T12:00:00Z", capacity: 5, flight_price_cents: 100, min_attendee_age_years: 0 }
              as: ShopStaff
