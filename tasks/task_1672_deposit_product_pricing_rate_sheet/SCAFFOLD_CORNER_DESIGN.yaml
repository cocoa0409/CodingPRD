      - name: margin_floor_boundary_equality_passes
        claim_type: boundary
        grounds: [calculations.sheet_margin_analysis, "validations[priority=24]", "errors[ERR_MARGIN_BELOW_FLOOR]"]
        distinguishing_aspect: "Submit gate uses >=: forward margin exactly equal to the floor passes; one bp below fails with ERR_MARGIN_BELOW_FLOOR. Sheet A: tier @230, funding 210, floor 20 -> margin 20 passes. Sheet B: tier @229, floor 20 -> margin 19 fails."
        test_recipe:
          setup:
            - "FundingCurve 2026-08-01 point (0,210); P-FL (SAVINGS, term 0, WHOLE_BALANCE, cap 500)"
            - "Sheet SA: single tier @230, margin_floor_bp 20; sheet SB (different market): single tier @229, margin_floor_bp 20"
          setup_api_calls:
            - { call: "POST /funding-curves", payload: { curve_date: "2026-08-01", points: [ { tenor_months: 0, cost_bp: 210 } ] }, as: TreasuryOfficer }
            - { call: "POST /deposit-products", payload: { product_code: "FL", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_fl: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_fl}", market_code: "US-WA", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 20, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 230, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_fla: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_fl}", market_code: "US-WB", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 20, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 229, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_flb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
          trigger:
            - { call: "POST /rate-sheets/${s_fla}/submit", payload: {}, as: PricingAnalyst, captures: { sa_st: $.data.status } }
            - { call: "POST /rate-sheets/${s_flb}/submit", payload: {}, as: PricingAnalyst, captures: { sb_err: $.data.error_id } }
          assert:
            - "SA: margin 230-210 == 20 == floor -> submit succeeds, status COMMITTEE_REVIEW (boundary is inclusive)"
            - "SB: margin 229-210 == 19 < 20 -> error_id == ERR_MARGIN_BELOW_FLOOR (422)"

      - name: margin_realized_book_empty_book_not_computable
        claim_type: input_set_filtering
        grounds: [calculations.sheet_margin_analysis, "errors[ERR_MARGIN_NOT_COMPUTABLE]"]
        distinguishing_aspect: "REALIZED_BOOK with zero qualifying OPEN accounts returns ERR_MARGIN_NOT_COMPUTABLE (empty input set), while FORWARD_LOOKING on the same sheet still computes from projected balances."
        test_recipe:
          setup:
            - "FundingCurve 2026-08-01 point (0,210); P-EM (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with a DRAFT sheet (no accounts exist), single tier @230, floor 0"
          setup_api_calls:
            - { call: "POST /funding-curves", payload: { curve_date: "2026-08-01", points: [ { tenor_months: 0, cost_bp: 210 } ] }, as: TreasuryOfficer }
            - { call: "POST /deposit-products", payload: { product_code: "EM", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_em: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_em}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 230, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_em: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
          trigger:
            - { call: "GET /rate-sheets/${s_em}/margin-analysis", payload: { variant: "REALIZED_BOOK" }, as: TreasuryOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /rate-sheets/${s_em}/margin-analysis", payload: { variant: "FORWARD_LOOKING" }, as: TreasuryOfficer, captures: { fwd: $.data.margin_bp } }
          assert:
            - "REALIZED_BOOK -> error_id == ERR_MARGIN_NOT_COMPUTABLE (422)"
            - "FORWARD_LOOKING on the same sheet -> margin_bp == 20 (computable with zero accounts)"

      - name: scan_analyze_empty_entries_null_benchmarks
        claim_type: correct_result
        grounds: [calculations.competitor_market_benchmark]
        distinguishing_aspect: "Analyzing a scan whose entries list is empty stores null for both benchmark fields (empty input set), not zero."
        test_recipe:
          setup: ["one SUBMITTED scan with entries []"]
          setup_api_calls:
            - { call: "POST /competitor-rate-scans", payload: { market_code: "US-WEST", scan_date: "2026-08-01", source_name: "RateWatch", entries: [] }, as: PricingAnalyst, captures: { sc_e: $.data.id } }
          trigger:
            - { call: "POST /competitor-rate-scans/${sc_e}/analyze", payload: {}, as: PricingAnalyst, captures: { bw: $.data.benchmark_weighted_bp, bs: $.data.benchmark_simple_bp, st: $.data.status } }
          assert:
            - "status == ANALYZED; benchmark_weighted_bp == null; benchmark_simple_bp == null"

      - name: interest_posting_same_day_noop
        claim_type: correct_result
        grounds: [calculations.interest_posting]
        distinguishing_aspect: "A second posting with no intervening clock advance posts a 0-cent delta (unposted already zeroed) — repeat invocation is a no-op, not an error."
        test_recipe:
          setup:
            - "P-NOP (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with EFFECTIVE single-tier sheet [0,unbounded)@400 in US-WEST; account AN 1,000,069 opened at 2026-08-15; clock at 2026-08-16 (one day accrued: 109,596 milli)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "NOP", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: false, allows_exceptions: false }, as: OperationsAdmin, captures: { p_nop: $.data.id } }
