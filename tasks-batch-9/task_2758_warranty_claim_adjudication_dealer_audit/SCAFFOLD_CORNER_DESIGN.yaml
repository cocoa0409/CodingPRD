      - name: repeated_terminal_action_calls_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPEAL_INVALID_STATE]
          - errors[ERR_LABOR_RATE_REQUEST_INVALID_STATE]
          - validations[priority 40]
          - state_machines.AuditAppeal
          - state_machines.LaborRateRequest
        distinguishing_aspect: |
          These action endpoints are not idempotent: the second identical decision is refused with the target
          entity's own invalid-state code, and the refusal is the appeal's or the request's state - not the
          audit's, which legitimately returned to FINDINGS_ISSUED and would accept a fresh appeal.
        test_recipe:
          setup:
            - "WORLD-AUDIT with findings issued and one appeal FILED against the single CHARGED_BACK finding."
            - "appeal-rev-1 is not the audit's lead_auditor_user_id, so segregation of duties passes."
            - "A separate SUBMITTED labor-rate request exists for dealer DA that has never been reviewed."
