          assert:
            - "ClaimCase.${claim_id}.status == APPROVED with approved_amount_cents == 55000 and review_round == 1"
            - "ClaimCase.${claim_id}.payable_cents == 40000 (capped), not 55000"
            - "ClaimCase.${claim_id}.invoice_offset_cents == 40000, deposit_offset_cents == 0, goodwill_credit_cents == 0 (the outstanding invoice of 57750 swallows the whole payable)"
            - "MaterialOrder.${ord_id}.final_total_cents == 57750 and credit_memo_cents stays 0 until the claim is settled"

      - name: dual_variant_results_diverge_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.inventory_net_sellable_volume.variants
        excluded_because:
          difficulty_instance: inventory_net_volume_intake_versus_settlement_basis
          rationale: "The §1.8 dual_variant_calc instance runs both variants over the same physical lot and asserts each result plus the +4.75 cubic-yard delta, which is exactly the Variant Divergence claim."

      - name: correct_variant_selected_for_the_context
        claim_type: variant_selection
        grounds:
          - calculations.order_charge_assembly.variants
        excluded_because:
          difficulty_instance: order_total_quoted_at_confirm_versus_final_at_delivery
          rationale: "The §1.8 dual_variant_calc instance asserts that confirm stores quoted_at_confirm and delivery stores final_at_delivery on the same order, covering Variant Selection."

      - name: ledger_delta_applied_when_the_variant_switches
        claim_type: reconciliation
        grounds:
          - calculations.order_charge_assembly.variants
          - calculations.account_credit_position
        excluded_because:
          difficulty_instance: delivery_repricing_cascades_to_credit_hold_and_cancels_queued_ticket
          rationale: "The §1.8 transitive_cascade instance asserts that credit_used_cents switches from the quoted figure to the final figure at delivery and that the delta pushes the account over its limit, which is the Reconciliation claim."

      - name: decay_applied_at_the_correct_interval
        claim_type: decay_function
        grounds:
          - calculations.container_deposit_refund
        excluded_because:
          difficulty_instance: container_deposit_refund_at_exact_grace_day_versus_one_second_later
          rationale: "The §1.8 boundary_precision_check instance pins the decay curve at exactly the grace boundary and one second past it (multiplier 1.00 versus 0.75), covering the decay-interval claim."

      - name: constraint_change_propagates_to_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.truck_load_fit
        excluded_because:
          difficulty_instance: truck_fit_three_input_minimum_binds_on_driveway_cap
          rationale: "The §1.8 combinatorial_formula instance asserts the three-way MIN and which input binds, including the rejection one hundredth above the ceiling, which is the constraint-propagation claim for this rule."

      - name: aggregation_total_correct_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.account_credit_position
        excluded_because:
          difficulty_instance: order_cancel_restores_reservation_prebuy_credit_and_purchase_order
          rationale: "The §1.8 compensating_invariant instance asserts the running credit total returns to its pre-confirm value after the reversal, covering the aggregation-after-reversal claim."

      - name: fee_constants_applied_at_the_threshold
        claim_type: constants_applied
        grounds:
          - calculations.order_charge_assembly.constants.MIN_LOAD_SUBTOTAL_CENTS
          - calculations.order_charge_assembly.constants.MIN_LOAD_FEE_CENTS
        excluded_because:
          difficulty_instance: min_load_fee_threshold_exact_versus_one_cent_short
          rationale: "The §1.8 boundary_precision_check instance asserts both minimum-load constants at the exact threshold and one cent short, covering the Constants Applied claim for order_charge_assembly."

