- section: consistency_model
  instances:
  - name: cascade_mutations_visible_in_same_response_chain
    claim_type: Immediate consistency
    grounds:
    - complexity_profile.consistency_model
    - state_machines.Contract.DRAFT_to_TERMINATED
    distinguishing_aspect: After POST /contracts/{id}/terminate returns 200, an immediate GET of a cascaded episode shows CANCELLED and its care items WAIVED — no eventual-consistency lag.
    test_recipe:
      setup:
      - Clock 2026-09-01. ACTIVE contract with an episode in SOR_PENDING carrying one waived-or-open care item is impossible pre-approval (care items require SCHEDULING); instead use an episode in SCREENING
        plus a second episode in SOR_PENDING.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
