        distinguishing_aspect: |
          MAX_SHUT_IN_PAYMENTS is 2 counted per lease, so the third SHUT_IN_PAYMENT obligation event
          returns ERR_SHUT_IN_LIMIT_EXCEEDED (422) with shut_in_payments_made frozen at 2 and the
          lease still SHUT_IN_HELD rather than EXPIRED.
        test_recipe:
          setup:
