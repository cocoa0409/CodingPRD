              payload: { action: "APPROVE" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              expect_error: { http: 409, error_id: ERR_QA_ITEM_UNCLEARED }
            - call: "POST /disclosure/qa-items/${q_high_id}/clear"
              payload: { clearance_note: "Counsel approved wording: refer to the disclosed inquiry and decline to quantify." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { q_high_status_2: $.data.status, q_high_note: $.data.clearance_note }
            - call: "GET /disclosure/documents/${script_id}"
