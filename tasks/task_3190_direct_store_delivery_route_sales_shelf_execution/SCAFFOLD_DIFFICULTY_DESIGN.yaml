# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_3190_direct_store_delivery_route_sales_shelf_execution
# Two instances per §0.5 rule (18 total). Every chain replays against §1.5.
# Shared fixture vocabulary:
#   - clock default 2026-09-01T00:00:00Z; set to 2026-09-01T09:00:00Z so the
#     minute-of-day (540) falls inside the standard store window [480, 720).
#   - 2026-09-01 is a TUE; 2026-09-02 is a WED.
#   - expiration 2026-09-06 => days_to_expiry 5 on a 2026-09-01 service date
#     (stale-eligible, undeliverable); 2026-09-07 => 6 (deliverable).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: stale_credit_pricing_variant_divergence
        grounds:
          - calculations.stale_credit_amount
          - entities.Store.fields.credit_policy
          - entities.StaleCredit.fields.credit_cents
        distinguishing_aspect: |
          Dual-variant on the StaleCredit domain: identical qty (10 cases) and
          price (250 cents) produce 2500 cents under FULL_RETAIL and 1000 cents
          under SALVAGE_RATE — the store's credit_policy, not the credit
          payload, selects the variant.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. One rep, one route (base 100, truck cap 200), product P at 250 cents."
            - "Store SA with credit_policy FULL_RETAIL and store SB with SALVAGE_RATE, both assigned to the route on TUE."
            - "Route day 2026-09-01 loaded with 40 cases of P expiring 2026-09-06 (days_to_expiry 5) and started."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_a_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SB", name: "Store B", format: "GROCERY", credit_policy: "SALVAGE_RATE", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_b_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 250, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_a_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_b_id}", service_weekdays: ["TUE"], stop_sequence: 2 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-ST", expiration_date: "2026-09-06", loaded_cases: 40 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /dsd/stale-credits"
              payload: { route_day_id: "${day_id}", store_id: "${store_a_id}", product_id: "${prod_id}", qty_cases: 10 }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { credit_a_id: $.data.id }
            - call: "POST /dsd/stale-credits"
              payload: { route_day_id: "${day_id}", store_id: "${store_b_id}", product_id: "${prod_id}", qty_cases: 10 }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { credit_b_id: $.data.id }
          assert:
            - "StaleCredit.${credit_a_id}.pricing_variant == FULL_RETAIL and credit_cents == 2500"
            - "StaleCredit.${credit_b_id}.pricing_variant == SALVAGE_RATE and credit_cents == 1000"
            - "credit_cents differ by exactly 1500 for identical qty_cases and case_price_cents"

      - name: settlement_forward_vs_chronological_divergence
        grounds:
          - calculations.settlement_reconciliation
          - calculations.order_line_pricing
          - entities.RouteSettlement.fields.recon_delta_cents
        distinguishing_aspect: |
          Dual-variant on the RouteSettlement domain: the forward-looking
          inventory-delta variant values sold cases at LIST price while the
          chronological event-replay variant uses per-line discounted prices,
          so a single 10%-discounted line makes the two variants diverge by
          exactly 1000 cents on identical data.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL (cap 100000), product P at 500 cents."
            - "Route day 2026-09-01 with lot A: 90 cases exp 2026-09-20, lot B: 10 cases exp 2026-09-06; day started."
            - "Order 1: 30 cases no discount (15000). Order 2: 20 cases at line_discount_pct 0.10 (9000). Both submitted and delivered in full (FEFO consumes freshness-eligible lot A only)."
            - "Stale credit of 5 cases (from stale-eligible lot B) approved: 2500 cents."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 120, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-A", expiration_date: "2026-09-20", loaded_cases: 90 }, { product_id: "${prod_id}", lot_code: "L-B", expiration_date: "2026-09-06", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_id}", qty_cases: 30 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order1_id: $.data.id }
            - call: "POST /dsd/orders/${order1_id}/submit"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders/${order1_id}/deliver"
              payload: { lines: [{ product_id: "${prod_id}", qty_cases: 30 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_id}", qty_cases: 20, line_discount_pct: 0.10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order2_id: $.data.id }
            - call: "POST /dsd/orders/${order2_id}/submit"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders/${order2_id}/deliver"
              payload: { lines: [{ product_id: "${prod_id}", qty_cases: 20 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/stale-credits"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", product_id: "${prod_id}", qty_cases: 5 }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { credit_id: $.data.id }
            - call: "POST /dsd/stale-credits/${credit_id}/approve"
              payload: {}
              as: RouteSupervisor
          trigger:
            - call: "POST /dsd/route-settlements"
              payload: { route_day_id: "${day_id}" }
              as: RouteSupervisor
              captures: { settlement_id: $.data.id }
          assert:
            - "RouteSettlement.${settlement_id}.gross_delivered_cents == 24000"
            - "RouteSettlement.${settlement_id}.credits_cents == 2500"
            - "RouteSettlement.${settlement_id}.chronological_expected_cents == 21500"
            - "RouteSettlement.${settlement_id}.forward_expected_cents == 22500"
            - "RouteSettlement.${settlement_id}.recon_delta_cents == 1000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: event_day_capacity_nested_min_with_surge_branch
        grounds:
          - calculations.route_day_capacity
          - entities.RouteDay.fields.capacity_cases
        distinguishing_aspect: |
          Mode (a): capacity = min(base + (is_event_day ? surge : 0), truck_cap)
          has 3 inputs with a conditional branch and a nested min; with base 100,
          surge 50 and truck_cap 120 the ceiling binds and capacity is exactly
          120, not 150 — and a load of exactly 120 cases is accepted.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Rep, store assigned TUE and WED, route base_capacity 100, truck_cap 120. Two products P1 (300 cents), P2 (400 cents)."
            - "Event route day on 2026-09-01 with event_surge_cases 50; non-event route day on 2026-09-02."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 300, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod1_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-2", name: "Dips", case_price_cents: 400, shelf_life_days: 45 }
              as: PlatformAdmin
              captures: { prod2_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 120 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE", "WED"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01", is_event_day: true, event_surge_cases: 50 }
              as: RouteSupervisor
              captures: { day_event_id: $.data.id }
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-02" }
              as: RouteSupervisor
              captures: { day_plain_id: $.data.id }
          trigger:
            - call: "POST /dsd/route-days/${day_event_id}/load"
              payload: { lots: [{ product_id: "${prod1_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 70 }, { product_id: "${prod2_id}", lot_code: "L-2", expiration_date: "2026-09-20", loaded_cases: 50 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          assert:
            - "RouteDay.${day_event_id}.capacity_cases == 120 (min(100 + 50, 120) — truck ceiling binds, not 150)"
            - "RouteDay.${day_plain_id}.capacity_cases == 100 (surge branch not taken)"
            - "the load of exactly 70 + 50 == 120 cases succeeds and RouteDay.${day_event_id}.status == LOADED"
            - "RouteDay.${day_event_id}.loaded_cases == 120"

      - name: per_line_rounding_then_sum_beats_sum_then_round
        grounds:
          - calculations.order_line_pricing
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum. Three lines of qty 1 at 335 cents with a 5%
          discount round to 318 each (sum 954); rounding the unrounded total
          would give 955. The pinned order yields exactly 954.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL. Product P at 335 cents; 10 cases exp 2026-09-20 loaded; day started."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 335, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_id}", qty_cases: 1, line_discount_pct: 0.05 }, { product_id: "${prod_id}", qty_cases: 1, line_discount_pct: 0.05 }, { product_id: "${prod_id}", qty_cases: 1, line_discount_pct: 0.05 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order_id: $.data.id }
          assert:
            - "StoreOrder.${order_id}.gross_total_cents == 954 (3 x round_half_up(335 x 0.95) = 3 x 318)"
            - "every OrderLine of ${order_id} has line_total_cents == 318"
            - "gross_total_cents != 955 (the sum-then-round outcome is forbidden)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_submit_unsubmit_revision_cycle
        grounds:
          - state_machines.StoreOrder.SUBMITTED_to_DRAFT
          - state_machines.StoreOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on StoreOrder: DRAFT -> SUBMITTED -> DRAFT (unsubmit)
          -> DRAFT revision via PUT -> SUBMITTED -> DELIVERED. The cycle is
          legal, each pass increments version, and delivery must reflect the
          REVISED lines, not the original ones.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL. Product P at 500 cents; 100 cases exp 2026-09-20 loaded; day started."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 100 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_id}", qty_cases: 30 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dsd/orders/${order_id}/submit"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders/${order_id}/unsubmit"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order_v3: $.data.version }
          trigger:
            - call: "PUT /dsd/orders/${order_id}"
              payload: { lines: [{ product_id: "${prod_id}", qty_cases: 12 }], expected_store_order_version: "${order_v3}" }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders/${order_id}/submit"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders/${order_id}/deliver"
              payload: { lines: [{ product_id: "${prod_id}", qty_cases: 12 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          assert:
            - "StoreOrder.${order_id}.status == DELIVERED"
            - "StoreOrder.${order_id}.version == 6 (create, submit, unsubmit, revise, submit, deliver)"
            - "StoreOrder.${order_id}.gross_total_cents == 6000 (revised line 12 x 500, not the original 30)"
            - "the order's single OrderLine has qty_ordered_cases == 12 and qty_delivered_cases == 12"

      - name: stale_credit_reject_resubmit_loop
        grounds:
          - state_machines.StaleCredit.REJECTED_to_PENDING_APPROVAL
          - state_machines.StaleCredit.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on StaleCredit (different entity from the order
          cycle): PENDING_APPROVAL -> REJECTED -> PENDING_APPROVAL -> APPROVED;
          the resubmit clears reject_reason and decided_by_user_id, and the lot
          mutation fires exactly once, at the final approval.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL cap 100000. Product P at 500 cents; lot of 20 cases exp 2026-09-06 (stale-eligible) loaded; day started."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-ST", expiration_date: "2026-09-06", loaded_cases: 20 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
