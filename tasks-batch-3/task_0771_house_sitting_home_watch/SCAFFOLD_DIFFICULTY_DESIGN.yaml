# =============================================================================
# §1.8 Scaffold Difficulty Design — House-Sitting & Home-Watch (Expert)
# Nine §0.5 rules × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billing_provisional_vs_final_per_visit_charge
        grounds:
          - calculations.per_visit_charge
          - state_machines.Visit.IN_PROGRESS_to_DONE
          - state_machines.Booking.ACTIVE_to_COMPLETED
          - entities.Visit.fields.provisional_charge_cents
          - entities.Visit.fields.final_charge_cents
        distinguishing_aspect: "On the Visit/billing domain the provisional charge (duration factor 1.0) is 6500 while the final charge (actual 45-min factor 1.5) is 9750, so the two variants of per_visit_charge diverge on the same visit."
        test_recipe:
          setup:
            - "Client, MEDIUM property with pets and checklist [MAIL,PLANTS], key_copies_total 2; sitter CLEARED with ACTIVE BOND."
            - "VACATION booking for 2026-06-01 (Mon, weekday) base rate 4000; assigned, active; one visit checked in at 09:00 and checked out at 09:45 (45 real minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada Client", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "MEDIUM", has_pets: true, checklist_config: ["MAIL","PLANTS"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 2 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam Sitter", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { bg_id: $.data.id }
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "CLEARED" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v}" }
              as: Coordinator
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
              as: Coordinator
            - call: "POST /home-watch/key-assignments"
              payload: { property_id: "${prop_id}", sitter_id: "${st_id}", booking_id: "${bk_id}" }
              as: Coordinator
              captures: { key_id: $.data.id }
            - call: "POST /home-watch/key-assignments/${key_id}/check-out"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/activate"
              payload: {}
              as: Coordinator
            - call: "GET /home-watch/visits?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
              captures: { vis_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/visits/${vis_id}/check-in"
              payload: { gps_lat: 40.0, gps_lng: -70.0 }
              as: Sitter
              as_user_id: "${st_id}"
            - call: "POST /home-watch/visit-logs"
              payload: { visit_id: "${vis_id}", entry_type: "PHOTO", photo_url: "http://x/1.jpg", gps_lat: 40.0, gps_lng: -70.0, captured_at: "2026-06-01T09:06:00Z" }
              as: Sitter
              as_user_id: "${st_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:45:00Z" }
              as: Coordinator
            - call: "POST /home-watch/visits/${vis_id}/check-out"
              payload: { completed_tasks: ["MAIL","PLANTS"] }
              as: Sitter
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /home-watch/bookings/${bk_id}/complete"
              payload: {}
              as: Coordinator
          assert:
            - "Visit.${vis_id}.provisional_charge_cents == 6500"
            - "Visit.${vis_id}.final_charge_cents == 9750"
            - "Visit.${vis_id}.final_charge_cents != Visit.${vis_id}.provisional_charge_cents"

      - name: exposure_estimated_vs_settled_liability
        grounds:
          - calculations.incident_liability_exposure
          - state_machines.Incident.OPEN_to_ESCALATED
          - state_machines.Incident.ESCALATED_to_RESOLVED
          - entities.Incident.fields.estimated_exposure_cents
          - entities.Incident.fields.settled_payout_cents
        distinguishing_aspect: "On the Incident/CoveragePolicy risk domain the escalation reserve is min(coverage 150000, MAJOR reserve 200000)=150000 while the settled payout is min(damage 90000, coverage 150000)=90000, so the two variants diverge on a different entity domain than billing."
        test_recipe:
          setup:
            - "Sitter CLEARED with ACTIVE BOND and ACTIVE LIABILITY (coverage 150000); active VACATION booking with an IN_PROGRESS visit."
            - "A MAJOR incident is filed on the visit and escalated (reserve 150000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada Client", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "MEDIUM", has_pets: true, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam Sitter", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { bg_id: $.data.id }
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "CLEARED" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v1: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v1}" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v2: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "LIABILITY", coverage_amount_cents: 150000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v2}" }
              as: Coordinator
              captures: { cov_liab_id: $.data.id }
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
              as: Coordinator
            - call: "POST /home-watch/key-assignments"
              payload: { property_id: "${prop_id}", sitter_id: "${st_id}", booking_id: "${bk_id}" }
              as: Coordinator
              captures: { key_id: $.data.id }
            - call: "POST /home-watch/key-assignments/${key_id}/check-out"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/activate"
              payload: {}
              as: Coordinator
            - call: "GET /home-watch/visits?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
              captures: { vis_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/visits/${vis_id}/check-in"
              payload: { gps_lat: 40.0, gps_lng: -70.0 }
              as: Sitter
              as_user_id: "${st_id}"
            - call: "POST /home-watch/incidents"
              payload: { visit_id: "${vis_id}", category: "WATER_LEAK", severity: "MAJOR" }
              as: Sitter
              as_user_id: "${st_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /home-watch/incidents/${inc_id}/escalate"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /home-watch/incidents/${inc_id}/resolve"
              payload: { assessed_damage_cents: 90000 }
              as: Coordinator
          assert:
            - "Incident.${inc_id}.estimated_exposure_cents == 150000"
            - "Incident.${inc_id}.settled_payout_cents == 90000"
            - "Incident.${inc_id}.settled_payout_cents != Incident.${inc_id}.estimated_exposure_cents"
            - "CoveragePolicy.${cov_liab_id}.paid_out_cents == 90000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_visit_charge_multiplicative_tiers_mode_a
        grounds:
          - calculations.per_visit_charge
          - entities.Property.fields.size_tier
          - entities.Property.fields.has_pets
          - entities.Visit.fields.is_weekend
        distinguishing_aspect: "Mode (a): per_visit_charge combines >=3 inputs non-linearly — additive base (4000+LARGE 3500+pet 1000=8500) times weekend multiplier 1.25 = 10625 on a Saturday, versus 8500 on a weekday; tiered size selection plus multiplier."
        test_recipe:
          setup:
            - "Sitter CLEARED + BOND; LARGE property with pets, checklist [MAIL]; VACATION booking on 2026-06-06 (Sat) base rate 4000, active; visit checked in and one photo logged."
