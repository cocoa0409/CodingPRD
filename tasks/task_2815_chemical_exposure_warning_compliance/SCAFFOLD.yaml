scenario: |
  Chemical Exposure Warning Compliance (consumer product regulatory affairs): listed chemical
  inventory across raw materials, packaging and manufacturing aids with supplier data collection,
  exposure assessment against safe harbor levels with laboratory testing and modeling, warning
  determination and label content selection with required symbol, chemical naming and website
  references, product-specific and occupancy-based warning formats including catalog and internet
  point-of-sale placement, supplier warranty and indemnity agreements with pass-through warning
  obligations, private-party notice of violation intake with sixty-day cure evaluation and
  settlement, reformulation projects to fall below threshold levels, recordkeeping to support
  defenses.
domain_name: chemical-exposure-warning-compliance
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 200, offset: 0 }

complexity_profile:
  difficulty_level: expert
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  # Bill-of-materials graph: Product --(ProductComponent)--> Material --(parent_material_id,
  # self-referential)--> Material --(MaterialChemical)--> ListedChemical. Chemical content is a
  # transitive roll-up over a depth-bounded material tree; assessments, determinations, notices and
  # reformulation projects all attach to the (Product, ListedChemical) pair rather than nesting.
  state_machine_shape: cyclic
  # Cycles: ExposureAssessment SUBMITTED->REJECTED->DRAFT->SUBMITTED, Settlement
  # PROPOSED<->COUNTERED, WarningPlacement VERIFIED->NON_COMPLIANT->IMPLEMENTED, ListedChemical
  # LISTED<->DELISTED, MaterialChemical TEST_REPORTED->DISPUTED->TEST_REQUESTED,
  # ReformulationProject VERIFICATION->IN_PROGRESS. Branching fork-join on NoticeOfViolation
  # (UNDER_EVALUATION forks to CURE_ELECTED or SETTLEMENT_NEGOTIATION, rejoining at
  # SETTLEMENT_NEGOTIATION). Parallel dimensions on Product (lifecycle_state x compliance_posture).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # Three enforced separations: the analyst who submitted an ExposureAssessment cannot peer-review
  # it; the specialist who prepared a WarningDetermination cannot approve it; the counsel who
  # proposed a Settlement cannot execute it.
  consistency_model: immediate

entities:
  - name: ListedChemical
    parent: null
    common_fields: true
    fields:
      - name: chemical_name
        type: string
        source: input
        description: canonical listed-chemical name used verbatim in warning label text
        constraints: "1-120 chars; unique across all ListedChemical rows (case-sensitive exact match)"
      - name: cas_number
        type: string
        source: input
        description: Chemical Abstracts Service registry number
        constraints: "1-20 chars"
      - name: endpoint_type
        type: enum
        source: input
        description: toxicological endpoint the listing is based on
        constraints: "one of {CANCER, REPRODUCTIVE_MALE, REPRODUCTIVE_FEMALE, DEVELOPMENTAL}"
      - name: harm_class
        type: enum
        source: computed
        description: |
          derived warning harm class: CANCER when endpoint_type == CANCER, otherwise REPRODUCTIVE.
          Drives named-chemical grouping and harm-clause text in warning content selection.
        constraints: "one of {CANCER, REPRODUCTIVE}"
      - name: safe_harbor_basis
        type: enum
        source: input
        description: statutory basis of the safe harbor level
        constraints: "one of {NSRL, MADL, NONE}; NONE means no safe harbor exists"
      - name: safe_harbor_level_ug_per_day
        type: number
        source: input
        description: |
          micrograms per day at or above which a warning is required; null when
          safe_harbor_basis == NONE
        constraints: "> 0 when safe_harbor_basis in {NSRL, MADL}; MUST be null when basis == NONE"
      - name: listing_effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the listing took effect; set by the LIST/RELIST action
        default: null
      - name: warning_required_from
        type: datetime
        source: computed
        description: |
          listing_effective_date + WARNING_GRACE_DAYS (365) days; null while
          listing_effective_date is null
      - name: status
        type: enum
        source: computed
        description: registry lifecycle state
        default: PROPOSED
        constraints: "one of {PROPOSED, LISTED, DELISTED, WITHDRAWN}"
      - name: revision_count
        type: integer
        source: computed
        description: number of REVISE_SAFE_HARBOR actions applied since first LIST
        default: 0

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: supplier legal entity name
        constraints: "1-160 chars"
      - name: contact_email
        type: string
        source: input
        description: supplier data-collection contact address
        constraints: "must contain '@'"
      - name: warranty_status
        type: enum
        source: computed
        description: state of the supplier warranty and indemnity agreement
        default: NONE
        constraints: "one of {NONE, ACTIVE, REVOKED}"
      - name: warranty_scope
        type: enum
        source: input
        description: material classes the executed warranty covers
        default: null
        constraints: "one of {ALL_MATERIALS, RAW_MATERIAL_ONLY, PACKAGING_ONLY}; null while warranty_status == NONE"
      - name: pass_through_warning_obligation
        type: boolean
        source: input
        description: |
          true when the warranty obliges the supplier to pass warning obligations to its own
          upstream suppliers; required for the supplier-warranty defense component of the
          defense-strength score
        default: false
      - name: indemnity_cap_cents
        type: integer
        source: input
        description: maximum indemnity the supplier owes, in cents
        default: 0
        constraints: ">= 0"
      - name: warranty_effective_from
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive start of warranty coverage; null while warranty_status == NONE
        default: null
      - name: warranty_effective_to
        type: datetime
        source: input
        description: |
          ISO 8601 UTC exclusive end of warranty coverage; null means open-ended. Coverage of an
          instant T is warranty_effective_from <= T < warranty_effective_to (half-open).
        default: null

  - name: Material
    parent: null
    common_fields: true
    fields:
      - name: material_code
        type: string
        source: input
        description: internal inventory code
        constraints: "1-40 chars; unique across all Material rows"
      - name: material_class
        type: enum
        source: input
        description: inventory bucket the material belongs to
        constraints: "one of {RAW_MATERIAL, PACKAGING, MANUFACTURING_AID}"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier that ships this material"
      - name: parent_material_id
        type: string
        source: input
        description: |
          FK -> Material.id; self-referential link to the compound material this material is a
          constituent of. null for top-level materials. The parent's chemical content rolls up
          its children's content weighted by parent_mass_fraction.
        default: null
      - name: parent_mass_fraction
        type: number
        source: input
        description: |
          mass fraction (0 < f <= 1) of this material within parent_material_id; MUST be present
          exactly when parent_material_id is non-null
        default: null
        constraints: "> 0 and <= 1"
      - name: disclosure_status
        type: enum
        source: computed
        description: supplier data-collection state for this material
        default: NOT_REQUESTED
        constraints: "one of {NOT_REQUESTED, REQUESTED, RECEIVED, INCOMPLETE, REFUSED, VERIFIED}"
      - name: data_request_sent_at
        type: datetime
        source: system
        description: logical-clock instant the REQUEST action fired; null before that
        default: null
      - name: data_received_at
        type: datetime
        source: system
        description: |
          logical-clock instant a RECORD_RESPONSE action last landed; null when no response has
          been recorded. Used by the AS_OF_SERVICE_DATE defense variant.
        default: null
      - name: naturally_occurring_claim
        type: boolean
        source: input
        description: supplier asserts the listed chemical content is naturally occurring
        default: false
      - name: bom_depth
        type: integer
        source: computed
        description: |
          0 for a material with parent_material_id == null, otherwise parent.bom_depth + 1;
          MAX_BOM_DEPTH (4) is the largest permitted value
        default: 0

  - name: MaterialChemical
    parent: null
    common_fields: true
    fields:
      - name: material_id
        type: string
        source: input
        description: "FK -> Material.id; the material this chemical link belongs to"
      - name: chemical_id
        type: string
        source: input
        description: "FK -> ListedChemical.id; the listed chemical present in the material"
      - name: declared_concentration_ppm
        type: number
        source: input
        description: |
          supplier-declared concentration in parts per million (equivalently micrograms of
          chemical per gram of material)
        constraints: ">= 0"
      - name: measurement_basis
        type: enum
        source: computed
        description: |
          which datum the exposure model may read: SUPPLIER_DECLARED until a lab result lands,
          then LAB_TESTED
        default: SUPPLIER_DECLARED
        constraints: "one of {SUPPLIER_DECLARED, LAB_TESTED}"
      - name: status
        type: enum
        source: computed
        description: laboratory-testing lifecycle state of this material/chemical link
        default: DECLARED
        constraints: "one of {DECLARED, TEST_REQUESTED, TEST_REPORTED, DISPUTED, VERIFIED}"
      - name: lab_name
        type: string
        source: input
        description: analytical laboratory that produced the reported result; null before REPORT_RESULT
        default: null
      - name: lab_result_ppm
        type: number
        source: input
        description: reported analytical concentration in ppm; null before REPORT_RESULT
        default: null
        constraints: ">= 0"
      - name: lab_loq_ppm
        type: number
        source: input
        description: |
          laboratory limit of quantitation in ppm; a lab_result_ppm strictly below this value is a
          non-detect and the two exposure variants treat it differently
        default: null
        constraints: "> 0"
      - name: lab_reported_at
        type: datetime
        source: system
        description: logical-clock instant REPORT_RESULT landed; null before that
        default: null
      - name: dispute_note
        type: string
        source: input
        description: reason the reported result was disputed; null unless status has been DISPUTED
        default: null

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: stock keeping unit
        constraints: "1-40 chars; unique across all Product rows"
      - name: product_name
        type: string
        source: input
        description: consumer-facing product name
        constraints: "1-160 chars"
      - name: product_category
        type: enum
        source: input
        description: category driving symbol and website-reference selection
        constraints: "one of {CONSUMER_GOOD, FOOD, DIETARY_SUPPLEMENT, FURNITURE, VEHICLE_PART}"
      - name: occupancy_type
        type: enum
        source: input
        description: |
          occupancy the product creates or is installed in; anything other than NONE forces the
          occupancy-based warning format and adds a POSTED_SIGN placement requirement
        default: NONE
        constraints: "one of {NONE, ENCLOSED_PARKING_FACILITY, AMUSEMENT_PARK, PETROLEUM_REFINERY}"
      - name: distribution_channels
        type: array
        source: input
        description: sales channels the product is offered through
        constraints: "non-empty subset of {RETAIL, CATALOG, INTERNET}; no duplicates"
      - name: label_area_sq_in
        type: number
        source: input
        description: |
          total available label area in square inches; below SHORT_FORM_MAX_AREA_SQ_IN (5.0) the
          abbreviated (short-form) warning may be selected
        constraints: "> 0"
      - name: annual_units
        type: integer
        source: input
        description: units sold into California per year; gates cure eligibility
        constraints: ">= 0"
      - name: lifecycle_state
        type: enum
        source: computed
        description: |
          commercial lifecycle dimension, independent of compliance_posture
        default: DEVELOPMENT
        constraints: "one of {DEVELOPMENT, MARKETED, DISCONTINUED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: |
          derived compliance dimension recomputed from children (components, materials,
          assessments, determinations, placements, notices) on every mutation that can affect it
        default: EXPOSURE_UNKNOWN
        constraints: "one of {EXPOSURE_UNKNOWN, CLEAR, WARNING_REQUIRED, WARNING_ACTIVE, ENFORCEMENT_HOLD}"
      - name: open_notice_count
        type: integer
        source: computed
        description: |
          count of NoticeOfViolation rows for this product whose status is in
          {RECEIVED, UNDER_EVALUATION, CURE_ELECTED, CURE_FAILED, SETTLEMENT_NEGOTIATION, LITIGATION}
        default: 0
      - name: accrued_penalty_cents
        type: integer
        source: computed
        description: |
          sum of adjusted_penalty_cents over Settlement rows whose status == EXECUTED and whose
          notice_id points at a NoticeOfViolation of this product
        default: 0
      - name: total_listed_chemical_load_ug
        type: number
        source: computed
        description: |
          conserved mass quantity: sum over ACTIVE ProductComponent rows and over LISTED
          ListedChemical rows of round_half_up(modeled effective_concentration_ppm x
          quantity_grams_per_unit, 3), the whole sum rounded half-up to 3 decimals
        default: 0

  - name: ProductComponent
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the finished product this component belongs to"
      - name: material_id
        type: string
        source: input
        description: "FK -> Material.id; the material used as this component"
      - name: quantity_grams_per_unit
        type: number
        source: input
        description: grams of the material present in one finished unit
        constraints: "> 0"
      - name: contact_factor
        type: number
        source: input
        description: |
          fraction of the component mass that is available for exposure through the assessed route
        constraints: "> 0 and <= 1"
      - name: status
        type: enum
        source: computed
        description: |
          ACTIVE components participate in exposure and load calculations; REMOVED and SUPERSEDED
          components do not
        default: ACTIVE
        constraints: "one of {ACTIVE, REMOVED, SUPERSEDED}"

  - name: ExposureAssessment
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product whose exposure is assessed"
      - name: chemical_id
        type: string
        source: input
        description: "FK -> ListedChemical.id; chemical the exposure is assessed for"
      - name: method
        type: enum
        source: input
        description: |
          which concentration datum the calculation reads; LAB_TESTED and MODELED are two valid
          approaches that produce different daily_exposure_ug for identical stored data
        constraints: "one of {LAB_TESTED, MODELED}"
      - name: route
        type: enum
        source: input
        description: exposure route selecting the absorption factor constant
        constraints: "one of {ORAL, DERMAL, INHALATION}"
      - name: uses_per_day
        type: number
        source: input
        description: reasonably anticipated uses of the product per day
        constraints: "> 0"
      - name: daily_exposure_ug
        type: number
        source: computed
        description: micrograms per day of the chemical, 3 decimal places (see calculations)
        default: 0
      - name: margin_ratio
        type: number
        source: computed
        description: |
          daily_exposure_ug / ListedChemical.safe_harbor_level_ug_per_day, 4 decimal places;
          null when safe_harbor_basis == NONE
        default: null
      - name: result
        type: enum
        source: computed
        description: threshold verdict against the safe harbor level
        default: BELOW_SAFE_HARBOR
        constraints: "one of {BELOW_SAFE_HARBOR, AT_OR_ABOVE_SAFE_HARBOR, NO_SAFE_HARBOR}"
      - name: contribution_count
        type: integer
        source: computed
        description: number of ACTIVE ProductComponent rows that contributed a non-zero amount
        default: 0
      - name: status
        type: enum
        source: computed
        description: peer-review lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, PEER_REVIEWED, REJECTED, FINAL, SUPERSEDED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that fired SUBMIT; null before that
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that fired PEER_REVIEW; null before that
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: logical-clock instant FINALIZE landed; null before that
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: number of times this assessment has entered REJECTED
        default: 0
      - name: review_note
        type: string
        source: input
        description: reviewer note recorded by PEER_REVIEW, REJECT or FINALIZE
        default: null

  - name: WarningDetermination
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product the determination governs"
      - name: assessment_id
        type: string
        source: input
        description: |
          FK -> ExposureAssessment.id; the primary basis assessment cited by the determination.
          MUST belong to product_id and MUST be FINAL at determination-create time.
      - name: decision
        type: enum
        source: input
        description: whether a warning is required for this product
        constraints: "one of {WARNING_REQUIRED, NO_WARNING_REQUIRED}"
      - name: warning_type
        type: enum
        source: computed
        description: warning format selected by the content-selection rules
        constraints: "one of {NONE, PRODUCT_SPECIFIC_LONG, PRODUCT_SPECIFIC_SHORT, OCCUPANCY}"
      - name: symbol_required
        type: boolean
        source: computed
        description: whether the black-triangle-in-yellow symbol must appear with the warning
        default: true
      - name: named_chemicals
        type: array
        source: computed
        description: |
          ordered chemical names that must be named in the warning: at most one per harm_class,
          CANCER entry first when present, then REPRODUCTIVE
        default: []
      - name: website_url
        type: string
        source: computed
        description: warning website reference selected from product_category and warning_type
        default: null
      - name: warning_text
        type: string
        source: computed
        description: assembled label content string for the selected warning_type
        default: null
      - name: required_channels
        type: array
        source: computed
        description: |
          placement channels the determination must cover, derived from
          Product.distribution_channels plus POSTED_SIGN when occupancy_type != NONE
        default: []
      - name: covered_channel_count
        type: integer
        source: computed
        description: |
          number of distinct required_channels having at least one WarningPlacement of this
          determination with status in {IMPLEMENTED, VERIFIED} whose effective window covers the
          logical clock now
        default: 0
      - name: status
        type: enum
        source: computed
        description: approval lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, APPROVED, REVOKED, SUPERSEDED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that created the determination
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that fired APPROVE; null before that
        default: null
      - name: review_note
        type: string
        source: input
        description: |
          note recorded by RETURN_FOR_REVISION; MUST be supplied on that action and is ignored on
          every other action
        default: null

  - name: WarningPlacement
    parent: null
    common_fields: true
    fields:
      - name: determination_id
        type: string
        source: input
        description: "FK -> WarningDetermination.id; determination whose warning this placement carries"
      - name: channel
        type: enum
        source: input
        description: |
          where the warning is displayed; MUST be a member of the determination's required_channels
        constraints: "one of {LABEL, CATALOG, INTERNET_POS, POSTED_SIGN}"
      - name: effective_from
        type: datetime
        source: input
        description: ISO 8601 UTC inclusive start of the placement window
      - name: effective_to
        type: datetime
        source: input
        description: |
          ISO 8601 UTC inclusive end of the placement window; null means open-ended (treated as
          +infinity). Windows for the same (determination_id, channel) are CLOSED intervals: two
          windows collide when new.effective_from <= existing.effective_to AND
          existing.effective_from <= new.effective_to, so touching endpoints DO collide.
        default: null
      - name: placement_detail
        type: string
        source: input
        description: free-text description of the physical or digital placement
        constraints: "1-200 chars"
      - name: catalog_page_ref
        type: string
        source: input
        description: catalog page or item reference; required when channel == CATALOG
        default: null
      - name: internet_display_position
        type: enum
        source: input
        description: |
          where the warning sits in the internet purchase flow; required when
          channel == INTERNET_POS
        default: null
        constraints: "one of {BEFORE_PURCHASE_LINK, ON_PRODUCT_PAGE, HYPERLINK_WARNING}"
      - name: status
        type: enum
        source: computed
        description: placement implementation state
        default: PLANNED
        constraints: "one of {PLANNED, IMPLEMENTED, VERIFIED, NON_COMPLIANT}"
      - name: implemented_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that fired IMPLEMENT; null before that
        default: null
      - name: remediation_count
        type: integer
        source: computed
        description: number of times this placement has returned to IMPLEMENTED from NON_COMPLIANT
        default: 0

  - name: NoticeOfViolation
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product the notice targets"
      - name: chemical_id
        type: string
        source: input
        description: "FK -> ListedChemical.id; chemical the notice alleges exposure to"
      - name: noticing_party_name
        type: string
        source: input
        description: name of the party that served the notice
        constraints: "1-160 chars"
      - name: noticing_party_type
        type: enum
        source: input
        description: who served the notice; only PRIVATE_PARTY notices can ever be cured
        constraints: "one of {PRIVATE_PARTY, ATTORNEY_GENERAL, DISTRICT_ATTORNEY}"
      - name: alleged_violation_type
        type: enum
        source: input
        description: theory of violation alleged
        constraints: "one of {FAILURE_TO_WARN, INADEQUATE_WARNING_CONTENT, EXPOSURE_LEVEL_DISPUTE}"
      - name: alleged_units
        type: integer
        source: input
        description: units the noticing party alleges were sold without a compliant warning
        constraints: ">= 0"
      - name: earliest_violation_date
        type: datetime
        source: input
        description: ISO 8601 UTC start of the alleged violation period; drives violation_days
      - name: served_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the notice was served
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: served_at + CURE_WINDOW_DAYS (60) days; the window is inclusive of this instant
      - name: cure_eligible
        type: boolean
        source: computed
        description: |
          computed by the EVALUATE action from the four cure-eligibility conditions; null until
          EVALUATE has run
        default: null
      - name: cure_completed_at
        type: datetime
        source: system
        description: logical-clock instant COMPLETE_CURE landed; null before that
        default: null
      - name: cure_attempted
        type: boolean
        source: computed
        description: |
          set true by ELECT_CURE and never cleared. This is the durable marker of the cure fork:
          once the cure branch fails and rejoins settlement negotiation through CURE_FAILED the
          status no longer records that a cure was attempted, so settlement_money reads this flag
          rather than the current status when deciding whether MITIGATION_CURE applies
        default: false
      - name: status
        type: enum
        source: computed
        description: notice lifecycle state
        default: RECEIVED
        constraints: |
          one of {RECEIVED, UNDER_EVALUATION, CURE_ELECTED, CURED_WITHIN_WINDOW, CURE_FAILED,
          SETTLEMENT_NEGOTIATION, SETTLED, LITIGATION, DISMISSED}
      - name: evaluation_note
        type: string
        source: input
        description: note recorded by EVALUATE, DISMISS or ESCALATE
        default: null

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: notice_id
        type: string
        source: input
        description: "FK -> NoticeOfViolation.id; notice this settlement resolves"
      - name: requested_attorney_fees_cents
        type: integer
        source: input
        description: attorney fees the noticing party demands, in cents
        constraints: ">= 0"
      - name: reformulation_commitment
        type: boolean
        source: input
        description: whether the settlement includes a binding reformulation commitment
        default: false
      - name: violation_days
        type: integer
        source: computed
        description: |
          floor((logical clock now at settlement create - notice.earliest_violation_date) /
          86400 seconds), frozen on this row at create time
        default: 0
      - name: base_penalty_cents
        type: integer
        source: computed
        description: |
          min(MAX_DAILY_PENALTY_CENTS x violation_days, PER_UNIT_PENALTY_CENTS x
          notice.alleged_units)
        default: 0
      - name: mitigation_factor
        type: number
        source: computed
        description: |
          product of the applicable mitigation factors, floored at MITIGATION_FLOOR (0.25),
          rounded half-up to 4 decimals
        default: 1
      - name: adjusted_penalty_cents
        type: integer
        source: computed
        description: round_half_up(base_penalty_cents x mitigation_factor) as whole cents
        default: 0
      - name: fee_cap_cents
        type: integer
        source: computed
        description: tiered statutory cap on attorney fees, keyed on adjusted_penalty_cents
        default: 0
      - name: allowed_fees_cents
        type: integer
        source: computed
        description: min(requested_attorney_fees_cents, fee_cap_cents)
        default: 0
      - name: state_share_cents
        type: integer
        source: computed
        description: floor(adjusted_penalty_cents x 0.75), the statutory state share
        default: 0
      - name: noticing_party_share_cents
        type: integer
        source: computed
        description: |
          adjusted_penalty_cents - state_share_cents; carries the rounding remainder so that
          state_share_cents + noticing_party_share_cents == adjusted_penalty_cents exactly
        default: 0
      - name: total_settlement_cents
        type: integer
        source: computed
        description: adjusted_penalty_cents + allowed_fees_cents
        default: 0
      - name: round_count
        type: integer
        source: computed
        description: |
          number of COUNTER/REVISE rounds applied; MAX_SETTLEMENT_ROUNDS (3) is the largest
          permitted value
        default: 0
      - name: status
        type: enum
        source: computed
        description: negotiation state
        default: PROPOSED
        constraints: "one of {PROPOSED, COUNTERED, EXECUTED, VOID}"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that created the settlement
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that fired ACCEPT_EXECUTE; null before that
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: logical-clock instant ACCEPT_EXECUTE landed; null before that
        default: null

  - name: ReformulationProject
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product being reformulated"
      - name: chemical_id
        type: string
        source: input
        description: "FK -> ListedChemical.id; chemical whose exposure must fall below threshold"
      - name: material_chemical_id
        type: string
        source: input
        description: |
          FK -> MaterialChemical.id; the concentration datum the project rewrites on
          SUBMIT_VERIFICATION. Its chemical_id MUST equal this project's chemical_id.
      - name: target_concentration_ppm
        type: number
        source: input
        description: concentration the reformulated material must reach, in ppm
        constraints: ">= 0"
      - name: planned_start_date
        type: datetime
        source: input
        description: |
          ISO 8601 UTC inclusive start of the project window. Windows for the same
          (product_id, chemical_id) are HALF-OPEN intervals [planned_start_date,
          planned_end_date): two windows collide when new.planned_start_date <
          existing.planned_end_date AND existing.planned_start_date < new.planned_end_date, so
          touching endpoints do NOT collide.
      - name: planned_end_date
        type: datetime
        source: input
        description: ISO 8601 UTC exclusive end of the project window; MUST be > planned_start_date
      - name: baseline_daily_exposure_ug
        type: number
        source: computed
        description: |
          daily_exposure_ug of the newest FINAL ExposureAssessment for (product_id, chemical_id)
          at project-create time, ranked by finalized_at DESC then created_at DESC; 0 when none
        default: 0
      - name: verified_daily_exposure_ug
        type: number
        source: computed
        description: |
          daily_exposure_ug recomputed with the target concentration in place, stamped by
          SUBMIT_VERIFICATION; null before that
        default: null
      - name: reduction_pct
        type: number
        source: computed
        description: |
          round_half_up(100 x (baseline_daily_exposure_ug - verified_daily_exposure_ug) /
          baseline_daily_exposure_ug, 2); null when baseline_daily_exposure_ug == 0
        default: null
      - name: status
        type: enum
        source: computed
        description: project lifecycle state
        default: PLANNED
        constraints: "one of {PLANNED, IN_PROGRESS, VERIFICATION, COMPLETED, ABANDONED}"

state_machines:
  # ---------------------------------------------------------------------------
  # SM1 - ListedChemical.status : cyclic (LISTED <-> DELISTED)
  # ---------------------------------------------------------------------------
  - entity: ListedChemical
    dimension: status
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: LISTED
        trigger: "POST /listed-chemicals/{chemical_id}/transitions {action: LIST}"
        actor: RegistryAdmin
        preconditions:
          - "chemical.status == PROPOSED"
          - "listing_effective_date supplied in the payload"
        side_effects:
          - "sets listing_effective_date from the payload"
          - "recomputes warning_required_from = listing_effective_date + 365 days"
          - "increments ListedChemical.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /listed-chemicals/{chemical_id}/transitions {action: WITHDRAW}"
        actor: RegistryAdmin
        preconditions:
          - "chemical.status == PROPOSED"
        side_effects:
          - "increments ListedChemical.version by 1"
        note: "terminal; a withdrawn proposal can never be listed"
      - from: LISTED
        to: LISTED
        trigger: "POST /listed-chemicals/{chemical_id}/transitions {action: REVISE_SAFE_HARBOR}"
        actor: RegistryAdmin
        preconditions:
          - "chemical.status == LISTED"
          - "safe_harbor_basis and safe_harbor_level_ug_per_day in the payload satisfy the basis/level coherence rule (validations priority 24)"
        side_effects:
          - "overwrites safe_harbor_basis and safe_harbor_level_ug_per_day; increments revision_count by 1"
          - "CASCADE L1: every ExposureAssessment with chemical_id == this chemical and status == FINAL has daily_exposure_ug left untouched but margin_ratio and result recomputed against the new level, and then transitions FINAL -> SUPERSEDED"
          - "CASCADE L2: because those assessments left FINAL, every WarningDetermination whose assessment_id points at one of them and whose status == APPROVED transitions APPROVED -> REVOKED"
          - "CASCADE L3: because those determinations left APPROVED, every WarningPlacement of each revoked determination whose status is in {IMPLEMENTED, VERIFIED} transitions to NON_COMPLIANT"
          - "CASCADE L4: because those placements left the covering set, covered_channel_count on each revoked determination is recomputed and Product.compliance_posture of each affected product is recomputed by the posture ladder"
          - "increments ListedChemical.version by 1"
        note: "self-loop on LISTED; the state does not change but the four-level cascade fires"
      - from: LISTED
        to: DELISTED
        trigger: "POST /listed-chemicals/{chemical_id}/transitions {action: DELIST}"
        actor: RegistryAdmin
        preconditions:
          - "chemical.status == LISTED"
        side_effects:
          - "every ExposureAssessment for this chemical with status == FINAL transitions FINAL -> SUPERSEDED"
          - "Product.compliance_posture is recomputed for every product that had such an assessment"
          - "increments ListedChemical.version by 1"
      - from: DELISTED
        to: LISTED
        trigger: "POST /listed-chemicals/{chemical_id}/transitions {action: RELIST}"
        actor: RegistryAdmin
        preconditions:
          - "chemical.status == DELISTED"
          - "listing_effective_date supplied in the payload"
        side_effects:
          - "overwrites listing_effective_date and recomputes warning_required_from"
          - "Product.compliance_posture is recomputed for every product holding a component material linked to this chemical"
          - "increments ListedChemical.version by 1"
        note: "closes the LISTED -> DELISTED -> LISTED cycle"

  # ---------------------------------------------------------------------------
  # SM2 - Material.disclosure_status : branching with a REFUSED -> REQUESTED revert
  # ---------------------------------------------------------------------------
  - entity: Material
    dimension: disclosure_status
    initial_state: NOT_REQUESTED
    terminal_states: []
    transitions:
      - from: NOT_REQUESTED
        to: REQUESTED
        trigger: "POST /materials/{material_id}/disclosure {action: REQUEST}"
        actor: ComplianceAnalyst
        preconditions:
          - "material.disclosure_status == NOT_REQUESTED"
        side_effects:
          - "stamps data_request_sent_at with the logical clock now"
          - "Product.compliance_posture is recomputed for every product holding this material (directly or through the material tree)"
          - "increments Material.version by 1"
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /materials/{material_id}/disclosure {action: RECORD_RESPONSE, response_completeness: COMPLETE}"
        actor: SupplierPortalUser | ComplianceAnalyst
        preconditions:
          - "material.disclosure_status == REQUESTED"
          - "when the actor is SupplierPortalUser, X-User-ID == material.supplier_id"
        side_effects:
          - "stamps data_received_at with the logical clock now"
          - "Product.compliance_posture is recomputed for every product holding this material"
          - "increments Material.version by 1"
      - from: REQUESTED
        to: INCOMPLETE
        trigger: "POST /materials/{material_id}/disclosure {action: RECORD_RESPONSE, response_completeness: INCOMPLETE}"
        actor: SupplierPortalUser | ComplianceAnalyst
        preconditions:
          - "material.disclosure_status == REQUESTED"
          - "when the actor is SupplierPortalUser, X-User-ID == material.supplier_id"
        side_effects:
          - "stamps data_received_at with the logical clock now"
          - "every MODELED ExposureAssessment recomputation for products holding this material now substitutes MODELED_DEFAULT_PPM for this material's own concentration"
          - "Product.compliance_posture is recomputed for every product holding this material"
          - "increments Material.version by 1"
      - from: REQUESTED
        to: REFUSED
        trigger: "POST /materials/{material_id}/disclosure {action: MARK_REFUSED}"
        actor: ComplianceAnalyst
        preconditions:
          - "material.disclosure_status == REQUESTED"
        side_effects:
          - "Product.compliance_posture is recomputed for every product holding this material"
          - "increments Material.version by 1"
      - from: REFUSED
        to: REQUESTED
        trigger: "POST /materials/{material_id}/disclosure {action: REQUEST}"
        actor: ComplianceAnalyst
        preconditions:
          - "material.disclosure_status == REFUSED"
        side_effects:
          - "re-stamps data_request_sent_at with the logical clock now"
          - "increments Material.version by 1"
        note: "closes the REQUESTED -> REFUSED -> REQUESTED revert loop"
      - from: INCOMPLETE
        to: REQUESTED
        trigger: "POST /materials/{material_id}/disclosure {action: REQUEST}"
        actor: ComplianceAnalyst
        preconditions:
          - "material.disclosure_status == INCOMPLETE"
        side_effects:
          - "re-stamps data_request_sent_at with the logical clock now"
          - "increments Material.version by 1"
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /materials/{material_id}/disclosure {action: VERIFY}"
        actor: ComplianceAnalyst
        preconditions:
          - "material.disclosure_status == RECEIVED"
        side_effects:
          - "Product.compliance_posture is recomputed for every product holding this material"
          - "increments Material.version by 1"

  # ---------------------------------------------------------------------------
  # SM3 - MaterialChemical.status : cyclic (TEST_REPORTED -> DISPUTED -> TEST_REQUESTED)
  # ---------------------------------------------------------------------------
  - entity: MaterialChemical
    dimension: status
    initial_state: DECLARED
    terminal_states: []
    transitions:
      - from: DECLARED
        to: TEST_REQUESTED
        trigger: "POST /material-chemicals/{material_chemical_id}/transitions {action: REQUEST_TEST}"
        actor: ComplianceAnalyst
        preconditions:
          - "link.status == DECLARED"
        side_effects:
          - "increments MaterialChemical.version by 1"
      - from: TEST_REQUESTED
        to: TEST_REPORTED
        trigger: "POST /material-chemicals/{material_chemical_id}/transitions {action: REPORT_RESULT}"
        actor: ComplianceAnalyst
        preconditions:
          - "link.status == TEST_REQUESTED"
          - "lab_name, lab_result_ppm and lab_loq_ppm all supplied in the payload"
        side_effects:
          - "stores lab_name, lab_result_ppm, lab_loq_ppm; stamps lab_reported_at with the logical clock now"
          - "sets measurement_basis = LAB_TESTED"
          - "recomputes Product.total_listed_chemical_load_ug and Product.compliance_posture for every product holding this material"
          - "increments MaterialChemical.version by 1"
      - from: TEST_REPORTED
        to: VERIFIED
        trigger: "POST /material-chemicals/{material_chemical_id}/transitions {action: VERIFY}"
        actor: ToxicologyReviewer
        preconditions:
          - "link.status == TEST_REPORTED"
          - "Material.disclosure_status of link.material_id is in {RECEIVED, VERIFIED}"
        side_effects:
          - "increments MaterialChemical.version by 1"
      - from: TEST_REPORTED
        to: DISPUTED
        trigger: "POST /material-chemicals/{material_chemical_id}/transitions {action: DISPUTE}"
        actor: ToxicologyReviewer
        preconditions:
          - "link.status == TEST_REPORTED"
          - "dispute_note supplied in the payload"
        side_effects:
          - "stores dispute_note"
          - "sets measurement_basis = SUPPLIER_DECLARED and clears lab_name, lab_result_ppm, lab_loq_ppm, lab_reported_at to null"
          - "recomputes Product.total_listed_chemical_load_ug and Product.compliance_posture for every product holding this material"
          - "increments MaterialChemical.version by 1"
      - from: DISPUTED
        to: TEST_REQUESTED
        trigger: "POST /material-chemicals/{material_chemical_id}/transitions {action: REQUEST_TEST}"
        actor: ComplianceAnalyst
        preconditions:
          - "link.status == DISPUTED"
        side_effects:
          - "increments MaterialChemical.version by 1"
        note: "closes the TEST_REQUESTED -> TEST_REPORTED -> DISPUTED -> TEST_REQUESTED cycle"
      - from: VERIFIED
        to: DECLARED
        trigger: "system: ReformulationProject SUBMIT_VERIFICATION rewrites this link's concentration"
        actor: system
        preconditions:
          - "a ReformulationProject whose material_chemical_id is this link fires SUBMIT_VERIFICATION"
        side_effects:
          - "declared_concentration_ppm := project.target_concentration_ppm"
          - "measurement_basis := SUPPLIER_DECLARED; lab_name, lab_result_ppm, lab_loq_ppm, lab_reported_at cleared to null"
          - "increments MaterialChemical.version by 1"
      - from: TEST_REPORTED
        to: DECLARED
        trigger: "system: ReformulationProject SUBMIT_VERIFICATION rewrites this link's concentration"
        actor: system
        preconditions:
          - "a ReformulationProject whose material_chemical_id is this link fires SUBMIT_VERIFICATION"
        side_effects:
          - "declared_concentration_ppm := project.target_concentration_ppm"
          - "measurement_basis := SUPPLIER_DECLARED; lab fields cleared to null"
          - "increments MaterialChemical.version by 1"
      - from: DECLARED
        to: DECLARED
        trigger: "system: ReformulationProject SUBMIT_VERIFICATION rewrites this link's concentration"
        actor: system
        preconditions:
          - "a ReformulationProject whose material_chemical_id is this link fires SUBMIT_VERIFICATION"
        side_effects:
          - "declared_concentration_ppm := project.target_concentration_ppm"
          - "increments MaterialChemical.version by 1"

  # ---------------------------------------------------------------------------
  # SM4 - Product.lifecycle_state : linear commercial dimension
  #       (runs independently of SM5's compliance_posture dimension on the same row)
  # ---------------------------------------------------------------------------
  - entity: Product
    dimension: lifecycle_state
    initial_state: DEVELOPMENT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DEVELOPMENT
        to: MARKETED
        trigger: "POST /products/{product_id}/transitions {action: MARKET}"
        actor: RegistryAdmin
        preconditions:
          - "product.lifecycle_state == DEVELOPMENT"
        side_effects:
          - "increments Product.version by 1"
        note: "compliance_posture is NOT changed by this transition; the two dimensions evolve independently"
      - from: MARKETED
        to: DISCONTINUED
        trigger: "POST /products/{product_id}/transitions {action: DISCONTINUE}"
        actor: RegistryAdmin
        preconditions:
          - "product.lifecycle_state == MARKETED"
        side_effects:
          - "increments Product.version by 1"
        note: |
          terminal on this dimension; blocks POST /products/{product_id}/exposure-assessments,
          POST /warning-determinations and POST /warning-determinations/{determination_id}/placements
          with ERR_PARENT_STATE_FORBIDS_WRITE, while compliance_posture keeps recomputing (an ENFORCEMENT_HOLD
          can still be entered and left on a discontinued product)
      - from: DEVELOPMENT
        to: DISCONTINUED
        trigger: "POST /products/{product_id}/transitions {action: DISCONTINUE}"
        actor: RegistryAdmin
        preconditions:
          - "product.lifecycle_state == DEVELOPMENT"
        side_effects:
          - "increments Product.version by 1"

  # ---------------------------------------------------------------------------
  # SM5 - Product.compliance_posture : derived aggregate dimension, recomputed by system
  #       The posture ladder is evaluated top-down; the FIRST matching clause wins.
  # ---------------------------------------------------------------------------
  - entity: Product
    dimension: compliance_posture
    initial_state: EXPOSURE_UNKNOWN
    terminal_states: []
    transitions:
      - from: "any"
        to: ENFORCEMENT_HOLD
        trigger: "system: posture recompute (ladder clause 1)"
        actor: system
        preconditions:
          - "open_notice_count >= 1, i.e. at least one NoticeOfViolation of this product has status in {RECEIVED, UNDER_EVALUATION, CURE_ELECTED, CURE_FAILED, SETTLEMENT_NEGOTIATION, LITIGATION}"
        side_effects:
          - "freezes the bill of materials: POST /products/{product_id}/components, PATCH /product-components/{component_id} and POST /product-components/{component_id}/transitions are all refused with ERR_ENFORCEMENT_HOLD_FREEZE while the hold lasts (validation v_enforcement_hold_freezes_bom). The reformulation route stays open, because POST /reformulation-projects/{reformulation_project_id}/transitions {action: SUBMIT_VERIFICATION} rewrites a concentration rather than the bill of materials."
          - "refreshes Product.updated_at"
      - from: "any"
        to: EXPOSURE_UNKNOWN
        trigger: "system: posture recompute (ladder clause 2)"
        actor: system
        preconditions:
          - "ladder clause 1 does not apply"
          - "count of ProductComponent rows with status == ACTIVE is 0, OR some ACTIVE component's material (or any material in its subtree) has disclosure_status in {NOT_REQUESTED, REQUESTED, INCOMPLETE, REFUSED}, OR some LISTED chemical reachable from the ACTIVE components has no ExposureAssessment for this product with status == FINAL"
        side_effects:
          - "refreshes Product.updated_at"
      - from: "any"
        to: WARNING_ACTIVE
        trigger: "system: posture recompute (ladder clause 3)"
        actor: system
        preconditions:
          - "ladder clauses 1-2 do not apply"
          - "there exists a WarningDetermination for this product with status == APPROVED and decision == WARNING_REQUIRED whose covered_channel_count equals the length of its required_channels"
        side_effects:
          - "refreshes Product.updated_at"
      - from: "any"
        to: WARNING_REQUIRED
        trigger: "system: posture recompute (ladder clause 4)"
        actor: system
        preconditions:
          - "ladder clauses 1-3 do not apply"
          - "some ExposureAssessment of this product with status == FINAL has result in {AT_OR_ABOVE_SAFE_HARBOR, NO_SAFE_HARBOR}"
        side_effects:
          - "refreshes Product.updated_at"
      - from: "any"
        to: CLEAR
        trigger: "system: posture recompute (ladder clause 5, fallback)"
        actor: system
        preconditions:
          - "ladder clauses 1-4 do not apply"
        side_effects:
          - "refreshes Product.updated_at"

  # ---------------------------------------------------------------------------
  # SM6 - ExposureAssessment.status : cyclic (SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED)
  # ---------------------------------------------------------------------------
  - entity: ExposureAssessment
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /exposure-assessments/{assessment_id}/transitions {action: SUBMIT}"
        actor: ComplianceAnalyst
        preconditions:
          - "assessment.status == DRAFT"
          - "when method == LAB_TESTED, every MaterialChemical link contributing to this assessment has status in {TEST_REPORTED, VERIFIED}"
        side_effects:
          - "recomputes daily_exposure_ug, margin_ratio, result and contribution_count"
          - "stamps submitted_by_user_id with the acting X-User-ID"
          - "increments ExposureAssessment.version by 1"
      - from: SUBMITTED
        to: PEER_REVIEWED
        trigger: "POST /exposure-assessments/{assessment_id}/transitions {action: PEER_REVIEW}"
        actor: ToxicologyReviewer
        preconditions:
          - "assessment.status == SUBMITTED"
          - "acting X-User-ID != assessment.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "stamps reviewed_by_user_id with the acting X-User-ID"
          - "increments ExposureAssessment.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /exposure-assessments/{assessment_id}/transitions {action: REJECT}"
        actor: ToxicologyReviewer
        preconditions:
          - "assessment.status == SUBMITTED"
          - "acting X-User-ID != assessment.submitted_by_user_id (segregation of duties)"
          - "review_note supplied in the payload"
        side_effects:
          - "increments rejection_count by 1; stores review_note"
          - "increments ExposureAssessment.version by 1"
      - from: PEER_REVIEWED
        to: REJECTED
        trigger: "POST /exposure-assessments/{assessment_id}/transitions {action: REJECT}"
        actor: ToxicologyReviewer
        preconditions:
          - "assessment.status == PEER_REVIEWED"
          - "review_note supplied in the payload"
        side_effects:
          - "increments rejection_count by 1; stores review_note"
          - "increments ExposureAssessment.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /exposure-assessments/{assessment_id}/transitions {action: REOPEN}"
        actor: ComplianceAnalyst
        preconditions:
          - "assessment.status == REJECTED"
        side_effects:
          - "clears submitted_by_user_id to null; reviewed_by_user_id is DELIBERATELY preserved, so an assessment that was peer-reviewed on an earlier turn of the cycle can be finalized directly from SUBMITTED"
          - "increments ExposureAssessment.version by 1"
        note: "closes the SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED revision cycle"
      - from: SUBMITTED
        to: FINAL
        trigger: "POST /exposure-assessments/{assessment_id}/transitions {action: FINALIZE}"
        actor: ToxicologyReviewer
        preconditions:
          - "assessment.status == SUBMITTED"
          - "assessment.reviewed_by_user_id is non-null - i.e. this assessment was peer-reviewed on an earlier turn of the REJECTED -> DRAFT -> SUBMITTED cycle; when it is null the request is refused by v_finalize_requires_peer_review with ERR_PEER_REVIEW_REQUIRED"
          - "ListedChemical.status of assessment.chemical_id == LISTED"
        side_effects:
          - "identical to the PEER_REVIEWED -> FINAL side-effect set: recomputes daily_exposure_ug, margin_ratio, result and contribution_count, stamps finalized_at, supersedes any earlier FINAL assessment of the same (product_id, chemical_id), recomputes Product.compliance_posture"
          - "increments ExposureAssessment.version by 1"
        note: |
          this is the arm that makes v_finalize_requires_peer_review (priority 55) reachable: the
          action IS legal out of SUBMITTED, so priority 40 passes and priority 55 decides. From
          DRAFT the same action is state-illegal, which is CONFLICT PAIR 1.
      - from: PEER_REVIEWED
        to: FINAL
        trigger: "POST /exposure-assessments/{assessment_id}/transitions {action: FINALIZE}"
        actor: ToxicologyReviewer
        preconditions:
          - "assessment.status == PEER_REVIEWED"
          - "ListedChemical.status of assessment.chemical_id == LISTED"
        side_effects:
          - "recomputes daily_exposure_ug, margin_ratio, result and contribution_count one final time"
          - "stamps finalized_at with the logical clock now"
          - "any other ExposureAssessment of the same (product_id, chemical_id) with status == FINAL transitions FINAL -> SUPERSEDED"
          - "Product.compliance_posture is recomputed"
          - "increments ExposureAssessment.version by 1"
      - from: FINAL
        to: SUPERSEDED
        trigger: "system: newer FINALIZE on the same (product_id, chemical_id), REVISE_SAFE_HARBOR, DELIST, or ReformulationProject SUBMIT_VERIFICATION touching a contributing material"
        actor: system
        preconditions:
          - "assessment.status == FINAL"
        side_effects:
          - "margin_ratio and result are recomputed against the current safe harbor level before the status flips"
          - "every WarningDetermination whose assessment_id is this assessment and whose status == APPROVED transitions APPROVED -> REVOKED"
          - "Product.compliance_posture is recomputed"
          - "increments ExposureAssessment.version by 1"

  # ---------------------------------------------------------------------------
  # SM7 - WarningDetermination.status : cyclic (PENDING_APPROVAL -> DRAFT)
  # ---------------------------------------------------------------------------
  - entity: WarningDetermination
    dimension: status
    initial_state: DRAFT
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /warning-determinations/{determination_id}/transitions {action: SUBMIT_FOR_APPROVAL}"
        actor: LabelingSpecialist
        preconditions:
          - "determination.status == DRAFT"
        side_effects:
          - "increments WarningDetermination.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /warning-determinations/{determination_id}/transitions {action: RETURN_FOR_REVISION}"
        actor: RegulatoryCounsel
        preconditions:
          - "determination.status == PENDING_APPROVAL"
          - "review_note supplied in the payload"
        side_effects:
          - "increments WarningDetermination.version by 1"
        note: "closes the DRAFT -> PENDING_APPROVAL -> DRAFT cycle"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /warning-determinations/{determination_id}/transitions {action: APPROVE}"
        actor: RegulatoryCounsel
        preconditions:
          - "determination.status == PENDING_APPROVAL"
          - "acting X-User-ID != determination.prepared_by_user_id (segregation of duties)"
          - "ExposureAssessment referenced by assessment_id still has status == FINAL"
        side_effects:
          - "stamps approved_by_user_id with the acting X-User-ID"
          - "any other WarningDetermination of the same product with status == APPROVED transitions APPROVED -> SUPERSEDED"
          - "recomputes covered_channel_count and Product.compliance_posture"
          - "increments WarningDetermination.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /warning-determinations/{determination_id}/transitions {action: REVOKE}; or system when the basis assessment leaves FINAL"
        actor: RegulatoryCounsel | system
        preconditions:
          - "determination.status == APPROVED"
        side_effects:
          - "every WarningPlacement of this determination with status in {IMPLEMENTED, VERIFIED} transitions to NON_COMPLIANT"
          - "recomputes covered_channel_count (to 0) and Product.compliance_posture"
          - "increments WarningDetermination.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a newer determination for the same product is APPROVED. A ReformulationProject SUBMIT_VERIFICATION does NOT come through here - it supersedes the basis assessment, and a determination whose basis assessment leaves FINAL goes to REVOKED"
        actor: system
        preconditions:
          - "determination.status == APPROVED"
        side_effects:
          - "every WarningPlacement of this determination whose effective_to is null has effective_to stamped with the logical clock now; placement statuses are left unchanged"
          - "recomputes covered_channel_count and Product.compliance_posture"
          - "increments WarningDetermination.version by 1"

  # ---------------------------------------------------------------------------
  # SM8 - WarningPlacement.status : cyclic (VERIFIED -> NON_COMPLIANT -> IMPLEMENTED)
  # ---------------------------------------------------------------------------
  - entity: WarningPlacement
    dimension: status
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: IMPLEMENTED
        trigger: "POST /warning-placements/{placement_id}/transitions {action: IMPLEMENT}"
        actor: LabelingSpecialist
        preconditions:
          - "placement.status == PLANNED"
          - "WarningDetermination.status of placement.determination_id == APPROVED"
        side_effects:
          - "stamps implemented_by_user_id with the acting X-User-ID"
          - "recomputes determination.covered_channel_count and Product.compliance_posture"
          - "increments WarningPlacement.version by 1"
      - from: IMPLEMENTED
        to: VERIFIED
        trigger: "POST /warning-placements/{placement_id}/transitions {action: VERIFY}"
        actor: RegulatoryCounsel
        preconditions:
          - "placement.status == IMPLEMENTED"
        side_effects:
          - "recomputes determination.covered_channel_count and Product.compliance_posture"
          - "increments WarningPlacement.version by 1"
      - from: VERIFIED
        to: NON_COMPLIANT
        trigger: "POST /warning-placements/{placement_id}/transitions {action: FLAG_NON_COMPLIANT}; or system on determination REVOKE"
        actor: RegulatoryCounsel | system
        preconditions:
          - "placement.status == VERIFIED"
        side_effects:
          - "recomputes determination.covered_channel_count and Product.compliance_posture"
          - "increments WarningPlacement.version by 1"
      - from: IMPLEMENTED
        to: NON_COMPLIANT
        trigger: "POST /warning-placements/{placement_id}/transitions {action: FLAG_NON_COMPLIANT}; or system on determination REVOKE"
        actor: RegulatoryCounsel | system
        preconditions:
          - "placement.status == IMPLEMENTED"
        side_effects:
          - "recomputes determination.covered_channel_count and Product.compliance_posture"
          - "increments WarningPlacement.version by 1"
      - from: NON_COMPLIANT
        to: IMPLEMENTED
        trigger: "POST /warning-placements/{placement_id}/transitions {action: REMEDIATE}"
        actor: LabelingSpecialist
        preconditions:
          - "placement.status == NON_COMPLIANT"
          - "WarningDetermination.status of placement.determination_id == APPROVED"
        side_effects:
          - "increments remediation_count by 1"
          - "recomputes determination.covered_channel_count and Product.compliance_posture"
          - "increments WarningPlacement.version by 1"
        note: |
          closes the IMPLEMENTED -> VERIFIED -> NON_COMPLIANT -> IMPLEMENTED cycle; the
          compensating invariant is that covered_channel_count returns to its pre-flag value

  # ---------------------------------------------------------------------------
  # SM9 - NoticeOfViolation.status : branching fork-join
  #       UNDER_EVALUATION forks to CURE_ELECTED or SETTLEMENT_NEGOTIATION with divergent
  #       side-effect sets, and the cure branch rejoins at SETTLEMENT_NEGOTIATION via CURE_FAILED.
  # ---------------------------------------------------------------------------
  - entity: NoticeOfViolation
    dimension: status
    initial_state: RECEIVED
    terminal_states: [CURED_WITHIN_WINDOW, SETTLED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: UNDER_EVALUATION
        trigger: "POST /notices/{notice_id}/transitions {action: EVALUATE}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == RECEIVED"
        side_effects:
          - "computes and stores cure_eligible from the four cure-eligibility conditions"
          - "increments NoticeOfViolation.version by 1"
      - from: UNDER_EVALUATION
        to: CURE_ELECTED
        trigger: "POST /notices/{notice_id}/transitions {action: ELECT_CURE}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == UNDER_EVALUATION"
          - "logical clock now <= notice.cure_deadline_at"
          - "notice.cure_eligible == true"
          - "no EXECUTED Settlement exists on another notice of the same (product_id, chemical_id) whose executed_at is within QUIET_PERIOD_DAYS (1095) days before notice.served_at"
        side_effects:
          - "sets cure_attempted to true; the flag is never cleared, so MITIGATION_CURE still applies to a settlement created after the cure branch fails and rejoins negotiation"
          - "increments NoticeOfViolation.version by 1"
        note: "fork branch A - cure; no penalty accrues on this branch unless it fails"
      - from: UNDER_EVALUATION
        to: SETTLEMENT_NEGOTIATION
        trigger: "POST /notices/{notice_id}/transitions {action: ESCALATE}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == UNDER_EVALUATION"
        side_effects:
          - "increments NoticeOfViolation.version by 1"
        note: "fork branch B - negotiate; opens the Settlement surface for this notice"
      - from: UNDER_EVALUATION
        to: DISMISSED
        trigger: "POST /notices/{notice_id}/transitions {action: DISMISS}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == UNDER_EVALUATION"
          - "evaluation_note supplied in the payload"
        side_effects:
          - "decrements Product.open_notice_count by 1"
          - "Product.compliance_posture is recomputed (leaves ENFORCEMENT_HOLD when open_notice_count reaches 0)"
          - "increments NoticeOfViolation.version by 1"
      - from: CURE_ELECTED
        to: CURED_WITHIN_WINDOW
        trigger: "POST /notices/{notice_id}/transitions {action: COMPLETE_CURE}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == CURE_ELECTED"
          - "logical clock now <= notice.cure_deadline_at (inclusive of the exact deadline instant)"
          - "the product has a WarningDetermination with status == APPROVED whose covered_channel_count equals the length of its required_channels"
        side_effects:
          - "stamps cure_completed_at with the logical clock now"
          - "CASCADE L1: decrements Product.open_notice_count by 1"
          - "CASCADE L2: because open_notice_count changed, Product.compliance_posture is recomputed and leaves ENFORCEMENT_HOLD when the count reaches 0"
          - "increments NoticeOfViolation.version by 1"
      - from: CURE_ELECTED
        to: CURE_FAILED
        trigger: "POST /notices/{notice_id}/transitions {action: ABANDON_CURE}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == CURE_ELECTED"
        side_effects:
          - "increments NoticeOfViolation.version by 1"
        note: "cure branch joins branch B from here"
      - from: CURE_FAILED
        to: SETTLEMENT_NEGOTIATION
        trigger: "POST /notices/{notice_id}/transitions {action: ESCALATE}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == CURE_FAILED"
        side_effects:
          - "increments NoticeOfViolation.version by 1"
        note: "join point - both fork branches converge on SETTLEMENT_NEGOTIATION"
      - from: SETTLEMENT_NEGOTIATION
        to: SETTLED
        trigger: "system: a Settlement of this notice reaches EXECUTED"
        actor: system
        preconditions:
          - "notice.status == SETTLEMENT_NEGOTIATION"
        side_effects:
          - "CASCADE L2 (of the settlement chain): decrements Product.open_notice_count by 1"
          - "CASCADE L3 (of the settlement chain): because open_notice_count changed, Product.compliance_posture is recomputed"
          - "increments NoticeOfViolation.version by 1"
      - from: SETTLEMENT_NEGOTIATION
        to: LITIGATION
        trigger: "POST /notices/{notice_id}/transitions {action: LITIGATE}"
        actor: RegulatoryCounsel
        preconditions:
          - "notice.status == SETTLEMENT_NEGOTIATION"
          - "some Settlement of this notice has round_count == MAX_SETTLEMENT_ROUNDS (3)"
        side_effects:
          - "every Settlement of this notice with status in {PROPOSED, COUNTERED} transitions to VOID"
          - "increments NoticeOfViolation.version by 1"
      - from: SETTLED
        to: SETTLEMENT_NEGOTIATION
        trigger: "system: the EXECUTED Settlement of this notice is voided via POST /settlements/{settlement_id}/transitions {action: VOID}"
        actor: system
        preconditions:
          - "notice.status == SETTLED"
        side_effects:
          - "increments Product.open_notice_count by 1"
          - "Product.compliance_posture is recomputed (re-enters ENFORCEMENT_HOLD)"
          - "increments NoticeOfViolation.version by 1"
        note: "compensating transition for the settlement-execution cascade"

  # ---------------------------------------------------------------------------
  # SM10 - Settlement.status : cyclic (PROPOSED <-> COUNTERED)
  # ---------------------------------------------------------------------------
  - entity: Settlement
    dimension: status
    initial_state: PROPOSED
    terminal_states: [VOID]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /settlements/{settlement_id}/transitions {action: COUNTER}"
        actor: RegulatoryCounsel
        preconditions:
          - "settlement.status == PROPOSED"
          - "settlement.round_count < MAX_SETTLEMENT_ROUNDS (3)"
        side_effects:
          - "increments round_count by 1"
          - "when requested_attorney_fees_cents or reformulation_commitment is supplied, overwrites it and recomputes mitigation_factor, adjusted_penalty_cents, fee_cap_cents, allowed_fees_cents, state_share_cents, noticing_party_share_cents and total_settlement_cents in the pinned order"
          - "increments Settlement.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /settlements/{settlement_id}/transitions {action: REVISE}"
        actor: RegulatoryCounsel
        preconditions:
          - "settlement.status == COUNTERED"
          - "settlement.round_count < MAX_SETTLEMENT_ROUNDS (3)"
        side_effects:
          - "increments round_count by 1"
          - "when requested_attorney_fees_cents or reformulation_commitment is supplied, overwrites it and recomputes the settlement money fields in the pinned order"
          - "increments Settlement.version by 1"
        note: "closes the PROPOSED -> COUNTERED -> PROPOSED negotiation cycle"
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /settlements/{settlement_id}/transitions {action: ACCEPT_EXECUTE}"
        actor: RegulatoryCounsel
        preconditions:
          - "settlement.status == PROPOSED"
          - "acting X-User-ID != settlement.proposed_by_user_id (segregation of duties)"
        side_effects:
          - "stamps executed_by_user_id and executed_at"
          - "CASCADE L1: increases Product.accrued_penalty_cents by adjusted_penalty_cents"
          - "CASCADE L2: because this settlement reached EXECUTED, its NoticeOfViolation transitions SETTLEMENT_NEGOTIATION -> SETTLED and Product.open_notice_count decrements by 1"
          - "CASCADE L3: because open_notice_count changed, Product.compliance_posture is recomputed and leaves ENFORCEMENT_HOLD when the count reaches 0"
          - "increments Settlement.version by 1"
      - from: COUNTERED
        to: EXECUTED
        trigger: "POST /settlements/{settlement_id}/transitions {action: ACCEPT_EXECUTE}"
        actor: RegulatoryCounsel
        preconditions:
          - "settlement.status == COUNTERED"
          - "acting X-User-ID != settlement.proposed_by_user_id (segregation of duties)"
        side_effects:
          - "identical three-level cascade as the PROPOSED -> EXECUTED transition"
          - "increments Settlement.version by 1"
      - from: EXECUTED
        to: VOID
        trigger: "POST /settlements/{settlement_id}/transitions {action: VOID}"
        actor: RegulatoryCounsel
        preconditions:
          - "settlement.status == EXECUTED"
        side_effects:
          - "decreases Product.accrued_penalty_cents by adjusted_penalty_cents, restoring the pre-execution value exactly"
          - "its NoticeOfViolation transitions SETTLED -> SETTLEMENT_NEGOTIATION and Product.open_notice_count increments by 1"
          - "Product.compliance_posture is recomputed"
          - "increments Settlement.version by 1"
        note: "compensating action for ACCEPT_EXECUTE; the penalty-conservation invariant must hold"
      - from: PROPOSED
        to: VOID
        trigger: "system: a newer Settlement is created for the same notice, or the notice enters LITIGATION"
        actor: system
        preconditions:
          - "settlement.status == PROPOSED"
        side_effects:
          - "increments Settlement.version by 1"
      - from: COUNTERED
        to: VOID
        trigger: "system: a newer Settlement is created for the same notice, or the notice enters LITIGATION"
        actor: system
        preconditions:
          - "settlement.status == COUNTERED"
        side_effects:
          - "increments Settlement.version by 1"

  # ---------------------------------------------------------------------------
  # SM11 - ReformulationProject.status : cyclic (VERIFICATION -> IN_PROGRESS)
  # ---------------------------------------------------------------------------
  - entity: ReformulationProject
    dimension: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /reformulation-projects/{reformulation_project_id}/transitions {action: START}"
        actor: ComplianceAnalyst
        preconditions:
          - "project.status == PLANNED"
        side_effects:
          - "increments ReformulationProject.version by 1"
      - from: IN_PROGRESS
        to: VERIFICATION
        trigger: "POST /reformulation-projects/{reformulation_project_id}/transitions {action: SUBMIT_VERIFICATION}"
        actor: ComplianceAnalyst
        preconditions:
          - "project.status == IN_PROGRESS"
        side_effects:
          - "CASCADE L1: MaterialChemical.declared_concentration_ppm of project.material_chemical_id := project.target_concentration_ppm, its status resets to DECLARED, measurement_basis resets to SUPPLIER_DECLARED and all lab fields are cleared"
          - "CASCADE L2: because that concentration changed, every ExposureAssessment with status == FINAL whose product holds the affected material has daily_exposure_ug, margin_ratio and result recomputed and then transitions FINAL -> SUPERSEDED; Product.total_listed_chemical_load_ug is recomputed"
          - "CASCADE L3: because those assessments left FINAL, every WarningDetermination citing one of them with status == APPROVED transitions APPROVED -> REVOKED (the basis-assessment-left-FINAL edge; SUPERSEDED is reserved for a newer APPROVED determination on the same product), so that determination's IMPLEMENTED/VERIFIED placements go NON_COMPLIANT, its covered_channel_count falls to 0 and Product.compliance_posture is recomputed"
          - "stamps verified_daily_exposure_ug with the recomputed MODELED exposure for (product_id, chemical_id) and computes reduction_pct"
          - "increments ReformulationProject.version by 1"
      - from: VERIFICATION
        to: IN_PROGRESS
        trigger: "POST /reformulation-projects/{reformulation_project_id}/transitions {action: REWORK}"
        actor: ComplianceAnalyst
        preconditions:
          - "project.status == VERIFICATION"
        side_effects:
          - "clears verified_daily_exposure_ug and reduction_pct to null"
          - "increments ReformulationProject.version by 1"
        note: "closes the IN_PROGRESS -> VERIFICATION -> IN_PROGRESS cycle"
      - from: VERIFICATION
        to: COMPLETED
        trigger: "POST /reformulation-projects/{reformulation_project_id}/transitions {action: COMPLETE}"
        actor: ComplianceAnalyst
        preconditions:
          - "project.status == VERIFICATION"
          - "verified_daily_exposure_ug < ListedChemical.safe_harbor_level_ug_per_day of project.chemical_id (strictly below; equality fails with ERR_TARGET_NOT_BELOW_THRESHOLD)"
        side_effects:
          - "Product.compliance_posture is recomputed"
          - "increments ReformulationProject.version by 1"
      - from: PLANNED
        to: ABANDONED
        trigger: "POST /reformulation-projects/{reformulation_project_id}/transitions {action: ABANDON}"
        actor: ComplianceAnalyst
        preconditions:
          - "project.status == PLANNED"
        side_effects:
          - "increments ReformulationProject.version by 1"
      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "POST /reformulation-projects/{reformulation_project_id}/transitions {action: ABANDON}"
        actor: ComplianceAnalyst
        preconditions:
          - "project.status == IN_PROGRESS"
        side_effects:
          - "increments ReformulationProject.version by 1"
      - from: VERIFICATION
        to: ABANDONED
        trigger: "POST /reformulation-projects/{reformulation_project_id}/transitions {action: ABANDON}"
        actor: ComplianceAnalyst
        preconditions:
          - "project.status == VERIFICATION"
        side_effects:
          - "increments ReformulationProject.version by 1"

  # ---------------------------------------------------------------------------
  # SM12 - Supplier.warranty_status : linear with a terminal revocation
  # ---------------------------------------------------------------------------
  - entity: Supplier
    dimension: warranty_status
    initial_state: NONE
    terminal_states: [REVOKED]
    transitions:
      - from: NONE
        to: ACTIVE
        trigger: "POST /suppliers/{supplier_id}/transitions {action: EXECUTE_WARRANTY}"
        actor: RegulatoryCounsel
        preconditions:
          - "supplier.warranty_status == NONE"
          - "warranty_scope is non-null"
          - "warranty_effective_from is non-null"
        side_effects:
          - "recomputes defense_strength_score for every product touched by this supplier's materials on the next compliance-summary read"
          - "increments Supplier.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /suppliers/{supplier_id}/transitions {action: REVOKE_WARRANTY}"
        actor: RegulatoryCounsel
        preconditions:
          - "supplier.warranty_status == ACTIVE"
          - "no NoticeOfViolation in status UNDER_EVALUATION or SETTLEMENT_NEGOTIATION has a served_at inside this supplier's warranty window (v_warranty_window_covers_service, ERR_WARRANTY_IN_USE)"
        side_effects:
          - "sets warranty_effective_to to the current logical clock when it was null"
          - "the warranty mitigation factor (0.60) no longer applies to settlements created after this instant"
          - "increments Supplier.version by 1"

  # ---------------------------------------------------------------------------
  # SM13 - ProductComponent.status : two terminal exits, one operator-driven and
  #        one produced as a side effect of a superseding create
  # ---------------------------------------------------------------------------
  - entity: ProductComponent
    dimension: status
    initial_state: ACTIVE
    terminal_states: [REMOVED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /product-components/{component_id}/transitions {action: REMOVE}"
        actor: ComplianceAnalyst
        preconditions:
          - "component.status == ACTIVE"
          - "the parent product's lifecycle_state != DISCONTINUED (ERR_PARENT_STATE_FORBIDS_WRITE)"
        side_effects:
          - "recomputes Product.total_listed_chemical_load_ug excluding this component"
          - "recomputes Product.compliance_posture (a product whose last ACTIVE component is removed returns to EXPOSURE_UNKNOWN via clause 2)"
          - "increments Product.version by 1"
          - "increments ProductComponent.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: POST /products/{product_id}/components carrying supersedes_component_id == this component's id"
        actor: system
        preconditions:
          - "component.status == ACTIVE"
          - "the superseding create names this component and targets the same product_id"
        side_effects:
          - "the replacement component is created ACTIVE in the same request, so the (product_id, material_id) uniqueness rule v_uniqueness sees only the replacement"
          - "recomputes Product.total_listed_chemical_load_ug from the replacement's quantity"
          - "recomputes Product.compliance_posture"
          - "increments Product.version by 1"
          - "increments ProductComponent.version by 1 on the superseded row"

concurrency_rules:
  - rule_id: determination-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /warning-determinations"
    occ_field: "expected_product_version"
    description: |
      Creating a WarningDetermination against a Product whose version has advanced since the
      client last observed it is rejected with a stale-version error. A determination create
      legitimately supersedes the product's prior PENDING_APPROVAL determination and, once
      approved, its prior APPROVED determination, so a second create observing the same product
      state would itself succeed under the product semantics; OCC on Product.version is what makes
      the outcome deterministic.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
  - rule_id: settlement-create-stale-notice
    parent_entity: NoticeOfViolation
    write_endpoint: "POST /notices/{notice_id}/settlements"
    occ_field: "expected_notice_version"
    description: |
      Creating a Settlement against a NoticeOfViolation whose version has advanced since the
      client last observed it is rejected with a stale-version error. A settlement create
      legitimately voids the notice's prior PROPOSED or COUNTERED settlement, so a second create
      against the same observed notice state would itself succeed; OCC on
      NoticeOfViolation.version reduces that to a deterministic stale-version check.
    error_id: ERR_STALE_NOTICE_VERSION
    http_status: 412

calculations:
  # ---------------------------------------------------------------------------
  # C1 - transitive chemical roll-up over the self-referential material tree
  # ---------------------------------------------------------------------------
  - name: effective_concentration_ppm
    trigger: |
      called by daily_exposure_ug and total_listed_chemical_load_ug; never surfaced on its own.
      Evaluated for a (Material, ListedChemical, variant) triple.
    algorithm: topological
    formula: |
      # depth-first post-order roll-up over Material.parent_material_id, bounded by MAX_BOM_DEPTH.
      # `variant` is MODELED or LAB_TESTED and is inherited from the calling assessment's `method`.
      def effective_concentration_ppm(material, chemical, variant):
          link = MaterialChemical row with material_id == material.id
                                    and chemical_id == chemical.id      # at most one (unique pair)
          if variant == 'MODELED':
              if material.disclosure_status in {'NOT_REQUESTED','REQUESTED','INCOMPLETE','REFUSED'}:
                  own = MODELED_DEFAULT_PPM                              # worst-case substitution
              elif link is None:
                  own = 0.0
              elif link.measurement_basis == 'LAB_TESTED' and link.lab_result_ppm < link.lab_loq_ppm:
                  own = link.lab_loq_ppm / 2.0                           # half-LOQ substitution
              elif link.measurement_basis == 'LAB_TESTED':
                  own = link.lab_result_ppm
              else:
                  own = link.declared_concentration_ppm
          else:  # variant == 'LAB_TESTED'
              if link is None:
                  own = 0.0
              elif link.measurement_basis != 'LAB_TESTED':
                  raise ERR_LAB_RESULT_MISSING                           # checked at SUBMIT time
              elif link.lab_result_ppm < link.lab_loq_ppm:
                  own = 0.0                                              # non-detect == zero
              else:
                  own = link.lab_result_ppm
              # disclosure_status is IGNORED by this variant: measured data supersedes supplier gaps
          children = Material rows with parent_material_id == material.id, ordered by created_at ASC
          rolled = own
          for c in children:
              rolled = rolled + c.parent_mass_fraction * effective_concentration_ppm(c, chemical, variant)
          return round_half_up(rolled, 4)
    input_set: |
      the material itself plus every descendant reachable through parent_material_id, ordered
      created_at ASC at each level; a material whose bom_depth would exceed MAX_BOM_DEPTH is
      rejected at write time so the recursion is always bounded
    constants:
      MODELED_DEFAULT_PPM: 250.0
      MAX_BOM_DEPTH: 4
    precision: "4 decimal places, round_half_up, applied once per tree level (post-order)"
    variants:
      - name: MODELED
        when: "the calling ExposureAssessment.method == MODELED"
        difference: |
          substitutes MODELED_DEFAULT_PPM for any material whose disclosure_status is in
          {NOT_REQUESTED, REQUESTED, INCOMPLETE, REFUSED} regardless of any declared or measured
          value, and substitutes lab_loq_ppm / 2 for a non-detect
      - name: LAB_TESTED
        when: "the calling ExposureAssessment.method == LAB_TESTED"
        difference: |
          ignores disclosure_status entirely, requires every contributing link to carry
          measurement_basis == LAB_TESTED, and substitutes 0.0 for a non-detect

  # ---------------------------------------------------------------------------
  # C2 - DUAL-VARIANT #1 : daily exposure on ExposureAssessment (mass/route domain)
  #      COMBINATORIAL MODE (b) : nested rounding where the order is pinned
  # ---------------------------------------------------------------------------
  - name: daily_exposure_ug
    trigger: |
      POST /products/{product_id}/exposure-assessments (at create), and again on
      POST /exposure-assessments/{assessment_id}/transitions with action in {SUBMIT, FINALIZE},
      and on every data-level system recompute (component create/PATCH/REMOVE, disclosure action,
      MaterialChemical action) - but a data-level recompute only touches assessments in status
      DRAFT, SUBMITTED or PEER_REVIEWED. A FINAL row is recomputed only by the explicit supersede
      cascades: REVISE_SAFE_HARBOR, DELIST, reformulation SUBMIT_VERIFICATION, and a newer FINALIZE
      on the same (product_id, chemical_id)
    algorithm: aggregation
    formula: |
      components = ProductComponent rows with product_id == assessment.product_id
                   and status == 'ACTIVE', ordered by created_at ASC
      contributions = []
      for c in components:
          eff = effective_concentration_ppm(Material(c.material_id), chemical, assessment.method)
          if eff == 0.0:
              continue                                   # does not count toward contribution_count
          raw = eff * c.quantity_grams_per_unit * c.contact_factor \
                    * ROUTE_ABSORPTION[assessment.route] * assessment.uses_per_day
          contributions.append(round_half_up(raw, 3))     # ROUND PER COMPONENT FIRST
      contribution_count = len(contributions)
      daily_exposure_ug  = round_half_up(sum(contributions), 3)   # THEN SUM, THEN ROUND TO 3
    input_set: |
      only ProductComponent rows with status == 'ACTIVE'; REMOVED and SUPERSEDED components are
      excluded. 1 ppm is 1 microgram of chemical per gram of material, so
      ppm x grams x dimensionless factors yields micrograms directly.
    constants:
      ROUTE_ABSORPTION: { ORAL: 1.00, DERMAL: 0.10, INHALATION: 0.25 }
    precision: |
      PINNED ORDER: round_half_up each per-component contribution to 3 decimals, then sum the
      rounded contributions, then round_half_up the sum to 3 decimals. The alternative order
      (sum the raw products, then round once to 3 decimals) is explicitly NOT used and produces a
      different value whenever two or more components each carry a non-zero 4th decimal - e.g. two
      contributions of 1.2345 give 2.470 under the pinned order and 2.469 under the forbidden one.
    variants:
      - name: MODELED
        when: "assessment.method == MODELED"
        difference: |
          reads effective_concentration_ppm's MODELED variant, so an INCOMPLETE or REFUSED
          disclosure contributes MODELED_DEFAULT_PPM and a non-detect contributes lab_loq_ppm / 2
      - name: LAB_TESTED
        when: "assessment.method == LAB_TESTED"
        difference: |
          reads effective_concentration_ppm's LAB_TESTED variant, so the same stored rows yield a
          strictly smaller exposure whenever any contributing link is a non-detect (0.0 instead of
          lab_loq_ppm / 2) or any contributing material has an INCOMPLETE/REFUSED disclosure
          (measured value instead of MODELED_DEFAULT_PPM)

  # ---------------------------------------------------------------------------
  # C3 - safe-harbor threshold verdict (>= is inclusive)
  # ---------------------------------------------------------------------------
  - name: safe_harbor_verdict
    trigger: |
      immediately after every daily_exposure_ug evaluation, and on
      POST /listed-chemicals/{chemical_id}/transitions {action: REVISE_SAFE_HARBOR} for every
      FINAL assessment of the revised chemical
    algorithm: threshold
    formula: |
      level = ListedChemical(assessment.chemical_id).safe_harbor_level_ug_per_day
      if ListedChemical(assessment.chemical_id).safe_harbor_basis == 'NONE':   # level is null
          margin_ratio = null
          result       = 'NO_SAFE_HARBOR'
      else:
          margin_ratio = round_half_up(daily_exposure_ug / level, 4)
          result = 'AT_OR_ABOVE_SAFE_HARBOR' if daily_exposure_ug >= level else 'BELOW_SAFE_HARBOR'
    input_set: "the assessment's own daily_exposure_ug and its chemical's current safe harbor level"
    constants: {}
    precision: |
      margin_ratio 4 decimal places, round_half_up. The comparison uses the UNROUNDED
      daily_exposure_ug value already rounded to 3 decimals by C2, compared with >= (inclusive):
      an exposure exactly equal to the safe harbor level is AT_OR_ABOVE_SAFE_HARBOR.

  # ---------------------------------------------------------------------------
  # C4 - COMBINATORIAL MODE (a) : warning content selection
  # ---------------------------------------------------------------------------
  - name: warning_content_selection
    trigger: |
      POST /warning-determinations (at create); recomputed on
      POST /warning-determinations/{determination_id}/transitions {action: APPROVE}
    algorithm: weighted_scoring
    formula: |
      # ---- step 1: candidate qualifying assessments (eligibility filter) -------------------
      qualifying = ExposureAssessment rows with product_id == determination.product_id
                   and status == 'FINAL'
                   and result in {'AT_OR_ABOVE_SAFE_HARBOR', 'NO_SAFE_HARBOR'}
      if determination.decision == 'WARNING_REQUIRED' and len(qualifying) == 0:
          raise ERR_NO_QUALIFYING_EXPOSURE
      if determination.decision == 'NO_WARNING_REQUIRED':
          warning_type='NONE'; symbol_required=False; named_chemicals=[]
          website_url=null; warning_text=null; required_channels=[]
          return
      # ---- step 2: warning_type (three-way conditional branch) ----------------------------
      if product.occupancy_type != 'NONE':
          warning_type = 'OCCUPANCY'
      elif product.label_area_sq_in < SHORT_FORM_MAX_AREA_SQ_IN:
          warning_type = 'PRODUCT_SPECIFIC_SHORT'
      else:
          warning_type = 'PRODUCT_SPECIFIC_LONG'
      # ---- step 3: named chemicals (one per harm_class; ranked selector) ------------------
      named_chemicals = []
      for hc in ['CANCER', 'REPRODUCTIVE']:                 # pinned group order
          group = [a for a in qualifying
                   if ListedChemical(a.chemical_id).harm_class == hc]
          if len(group) == 0:
              continue                                       # empty group is skipped, not an error
          # ranking: NO_SAFE_HARBOR outranks every finite margin_ratio; then margin_ratio DESC
          group.sort(key = (
              0 if a.result == 'NO_SAFE_HARBOR' else 1,                       # rank key 1 ASC
              -(a.margin_ratio or 0.0),                                       # rank key 2
              ListedChemical(a.chemical_id).safe_harbor_level_ug_per_day       # tie-break 1 ASC
                  if ListedChemical(a.chemical_id).safe_harbor_level_ug_per_day is not None else -1,
              ListedChemical(a.chemical_id).chemical_name                      # tie-break 2 ASC
          ))
          named_chemicals.append(ListedChemical(group[0].chemical_id).chemical_name)
      # ---- step 4: symbol ----------------------------------------------------------------
      symbol_required = False if (product.product_category == 'FOOD'
                                  and warning_type != 'OCCUPANCY') else True
      # ---- step 5: website reference (OCCUPANCY precedence beats FOOD) --------------------
      if warning_type == 'OCCUPANCY':
          website_url = 'https://www.P65Warnings.ca.gov/places'
      elif product.product_category == 'FOOD':
          website_url = 'https://www.P65Warnings.ca.gov/food'
      else:
          website_url = 'https://www.P65Warnings.ca.gov'
      # ---- step 6: harm clause and label text --------------------------------------------
      classes = set of ListedChemical(a.chemical_id).harm_class for a in qualifying
      if classes == {'CANCER'}:
          harm_clause = 'cancer'
          harm_label  = 'Cancer'
      elif classes == {'REPRODUCTIVE'}:
          harm_clause = 'birth defects or other reproductive harm'
          harm_label  = 'Reproductive Harm'
      else:
          harm_clause = 'cancer and birth defects or other reproductive harm'
          harm_label  = 'Cancer and Reproductive Harm'
      verb = 'is' if len(named_chemicals) == 1 else 'are'
      chem_list = ', '.join(named_chemicals)
      if warning_type == 'PRODUCT_SPECIFIC_LONG':
          warning_text = ('WARNING: This product can expose you to chemicals including '
                          + chem_list + ', which ' + verb + ' known to the State of California '
                          + 'to cause ' + harm_clause + '. For more information go to '
                          + website_url + '.')
      elif warning_type == 'PRODUCT_SPECIFIC_SHORT':
          warning_text = ('WARNING: ' + harm_label + ' risk from exposure to '
                          + named_chemicals[0] + ' - ' + website_url)
      else:  # OCCUPANCY
          warning_text = ('WARNING: Entering this area can expose you to chemicals including '
                          + chem_list + ', which ' + verb + ' known to the State of California '
                          + 'to cause ' + harm_clause + '. For more information go to '
                          + website_url + '.')
      # ---- step 7: required placement channels -------------------------------------------
      required_channels = []
      if 'RETAIL'   in product.distribution_channels: required_channels.append('LABEL')
      if 'CATALOG'  in product.distribution_channels: required_channels.append('CATALOG')
      if 'INTERNET' in product.distribution_channels: required_channels.append('INTERNET_POS')
      if product.occupancy_type != 'NONE':            required_channels.append('POSTED_SIGN')
      # pinned order: LABEL, CATALOG, INTERNET_POS, POSTED_SIGN
    input_set: |
      the product's own configuration fields (occupancy_type, label_area_sq_in, product_category,
      distribution_channels) plus every ExposureAssessment of the product with status == FINAL and
      result in {AT_OR_ABOVE_SAFE_HARBOR, NO_SAFE_HARBOR}. Assessments in any other status, and
      FINAL assessments with result == BELOW_SAFE_HARBOR, are excluded.
    constants:
      SHORT_FORM_MAX_AREA_SQ_IN: 5.0
      WARNING_WEBSITE_BASE: "https://www.P65Warnings.ca.gov"
    precision: "no numeric rounding; string assembly is byte-exact including the trailing period on long and occupancy formats"

  # ---------------------------------------------------------------------------
  # C5 - COMBINATORIAL MODE (c) : settlement money with a pinned evaluation order
  # ---------------------------------------------------------------------------
  - name: settlement_money
    trigger: |
      POST /notices/{notice_id}/settlements (at create) and again on
      POST /settlements/{settlement_id}/transitions with action in {COUNTER, REVISE}
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - exposure window (frozen on the row at create; NOT recomputed by COUNTER/REVISE)
      violation_days = floor((clock_now_at_create - notice.earliest_violation_date).total_seconds()
                             / 86400)
      # STEP 2 - statutory base penalty: the lesser of the day-based and unit-based measures
      base_penalty_cents = min(MAX_DAILY_PENALTY_CENTS * violation_days,
                               PER_UNIT_PENALTY_CENTS  * notice.alleged_units)
      # STEP 3 - mitigation: multiply the applicable factors, then apply the floor
      f = 1.0
      if warranty_defense_applies:      f = f * MITIGATION_WARRANTY      # 0.60
      if cure_branch_taken:             f = f * MITIGATION_CURE          # 0.50
      if settlement.reformulation_commitment: f = f * MITIGATION_REFORM  # 0.75
      mitigation_factor = round_half_up(max(f, MITIGATION_FLOOR), 4)
      # STEP 4 - adjusted penalty
      adjusted_penalty_cents = round_half_up(base_penalty_cents * mitigation_factor)   # whole cents
      # STEP 5 - tiered fee cap keyed on the ADJUSTED penalty (never on the base penalty)
      if   adjusted_penalty_cents <  FEE_TIER_1_CENTS:  fee_cap_cents = floor(adjusted_penalty_cents * 1.50)
      elif adjusted_penalty_cents <  FEE_TIER_2_CENTS:  fee_cap_cents = floor(adjusted_penalty_cents * 1.00)
      else:                                             fee_cap_cents = floor(adjusted_penalty_cents * 0.60)
      # STEP 6 - fees are capped; they NEVER feed back into the penalty or its tier
      allowed_fees_cents = min(settlement.requested_attorney_fees_cents, fee_cap_cents)
      # STEP 7 - statutory split, remainder to the noticing party (conserved quantity)
      state_share_cents          = floor(adjusted_penalty_cents * STATE_SHARE_PCT)      # 0.75
      noticing_party_share_cents = adjusted_penalty_cents - state_share_cents
      # STEP 8 - total
      total_settlement_cents = adjusted_penalty_cents + allowed_fees_cents
    input_set: |
      warranty_defense_applies is true when EVERY ACTIVE ProductComponent's material has a Supplier
      whose warranty_status == ACTIVE, whose pass_through_warning_obligation == true, whose
      warranty_scope covers that material's material_class (ALL_MATERIALS covers all;
      RAW_MATERIAL_ONLY covers RAW_MATERIAL; PACKAGING_ONLY covers PACKAGING), and whose half-open
      window satisfies warranty_effective_from <= notice.served_at < warranty_effective_to (a null
      warranty_effective_to is treated as +infinity). A product with zero ACTIVE components does
      NOT get the warranty defense (the empty product is explicitly excluded rather than
      vacuously true).
      cure_branch_taken is true when notice.cure_attempted is true (the durable flag ELECT_CURE
      stamps) or notice.cure_completed_at is non-null. It is deliberately NOT read off the current
      status: a settlement can only be created from SETTLEMENT_NEGOTIATION, which the cure branch
      reaches through CURE_FAILED -> ESCALATE, so a status-based test would make MITIGATION_CURE
      unreachable.
    constants:
      MAX_DAILY_PENALTY_CENTS: 250000
      PER_UNIT_PENALTY_CENTS: 500
      MITIGATION_WARRANTY: 0.60
      MITIGATION_CURE: 0.50
      MITIGATION_REFORM: 0.75
      MITIGATION_FLOOR: 0.25
      FEE_TIER_1_CENTS: 100000
      FEE_TIER_2_CENTS: 1000000
      STATE_SHARE_PCT: 0.75
    precision: |
      PINNED EVALUATION ORDER penalty -> cap -> fees. The dependency looks circular because the fee
      cap is a tier lookup on the penalty while a capped fee award is the very thing a higher
      penalty tier would enlarge; the order above resolves it - allowed_fees_cents never re-enters
      steps 2-5. mitigation_factor is rounded to 4 decimals BEFORE step 4 multiplies by it;
      adjusted_penalty_cents is round_half_up to whole cents; fee_cap_cents, state_share_cents use
      floor; noticing_party_share_cents absorbs the remainder so the split is exact.

  # ---------------------------------------------------------------------------
  # C6 - DUAL-VARIANT #2 : defence-strength scoring on Product (recordkeeping domain)
  # ---------------------------------------------------------------------------
  - name: defense_strength_score
    trigger: "GET /products/{product_id}/compliance-summary"
    algorithm: weighted_scoring
    formula: |
      # as_of == clock_now for the AS_OF_TODAY variant, notice.served_at for AS_OF_SERVICE_DATE
      determination = the WarningDetermination of this product with status == 'APPROVED'
                      (at most one exists; when none exists warning_evidence = 0.0)
      # --- warning evidence -------------------------------------------------------------
      if determination is None or len(determination.required_channels) == 0:
          warning_evidence = 0.0
      else:
          covered  = channels of determination.required_channels having a WarningPlacement of that
                     determination with status in {'IMPLEMENTED','VERIFIED'} and
                     effective_from <= as_of and (effective_to is null or as_of <= effective_to)
          verified = the same restricted to status == 'VERIFIED'
          if   len(verified) == len(determination.required_channels): warning_evidence = 1.0
          elif len(covered)  == len(determination.required_channels): warning_evidence = 0.5
          else:                                                       warning_evidence = 0.0
      # --- assessment evidence ----------------------------------------------------------
      finals = ExposureAssessment rows of this product with status == 'FINAL'
               and (variant == 'AS_OF_TODAY' or finalized_at <= as_of)
      reviewed = ExposureAssessment rows of this product with status == 'PEER_REVIEWED'
      if   len(finals)   >= 1: assessment_evidence = 1.0
      elif len(reviewed) >= 1: assessment_evidence = 0.5
      else:                    assessment_evidence = 0.0
      # --- warranty evidence ------------------------------------------------------------
      materials = materials of ACTIVE ProductComponent rows of this product
      if len(materials) == 0:
          warranty_evidence = 0.0
      elif every material's supplier has warranty_status == 'ACTIVE'
           and warranty_effective_from <= as_of < (warranty_effective_to or +inf)
           and warranty_scope covers material_class
           and pass_through_warning_obligation is true:
          warranty_evidence = 1.0
      elif every material's supplier has warranty_status == 'ACTIVE'
           and warranty_effective_from <= as_of < (warranty_effective_to or +inf)
           and warranty_scope covers material_class:
          warranty_evidence = 0.5
      else:
          warranty_evidence = 0.0
      # --- recordkeeping evidence -------------------------------------------------------
      if len(materials) == 0:
          recordkeeping_evidence = 0.0
      elif variant == 'AS_OF_TODAY':
          if   every material has disclosure_status == 'VERIFIED':                    recordkeeping_evidence = 1.0
          elif every material has disclosure_status in {'RECEIVED','VERIFIED'}:       recordkeeping_evidence = 0.5
          else:                                                                       recordkeeping_evidence = 0.0
      else:  # AS_OF_SERVICE_DATE - only responses that had landed by as_of count
          if   every material has disclosure_status == 'VERIFIED'
               and data_received_at is not null and data_received_at <= as_of:        recordkeeping_evidence = 1.0
          elif every material has disclosure_status in {'RECEIVED','VERIFIED'}
               and data_received_at is not null and data_received_at <= as_of:        recordkeeping_evidence = 0.5
          else:                                                                       recordkeeping_evidence = 0.0
      defense_strength_score = round_half_up(
            W_WARNING * warning_evidence + W_ASSESSMENT * assessment_evidence
          + W_WARRANTY * warranty_evidence + W_RECORDKEEPING * recordkeeping_evidence, 0)
    input_set: |
      the product's ACTIVE ProductComponent rows and their materials/suppliers, the product's
      ExposureAssessment rows, its single APPROVED WarningDetermination and that determination's
      WarningPlacement rows. Nothing in {REMOVED, SUPERSEDED} components, non-APPROVED
      determinations, or REVOKED/SUPERSEDED determinations enters either variant.
    constants:
      W_WARNING: 40
      W_ASSESSMENT: 25
      W_WARRANTY: 20
      W_RECORDKEEPING: 15
    precision: "each evidence component is exactly 0.0, 0.5 or 1.0; the weighted sum is round_half_up to 0 decimals, yielding an integer 0-100"
    variants:
      - name: AS_OF_TODAY
        when: "GET /products/{product_id}/compliance-summary is called without as_of_notice_id"
        difference: |
          as_of is the logical clock now; every FINAL assessment counts regardless of finalized_at,
          and recordkeeping evidence reads the current disclosure_status without any
          data_received_at cut-off
      - name: AS_OF_SERVICE_DATE
        when: "GET /products/{product_id}/compliance-summary?as_of_notice_id=<id> is supplied"
        difference: |
          as_of is that notice's served_at; placements must have been effective at served_at,
          FINAL assessments count only when finalized_at <= served_at, warranty coverage is tested
          against served_at, and disclosure responses count only when data_received_at <= served_at
          - so the same stored rows produce a strictly lower or equal score than AS_OF_TODAY

  # ---------------------------------------------------------------------------
  # C7 - cure eligibility and the sixty-day window
  # ---------------------------------------------------------------------------
  - name: cure_evaluation
    trigger: |
      cure_deadline_at is computed at POST /notices (create); cure_eligible is computed by
      POST /notices/{notice_id}/transitions {action: EVALUATE}
    algorithm: threshold
    formula: |
      cure_deadline_at = notice.served_at + CURE_WINDOW_DAYS days       # exactly 60 x 86400 s
      prior = Settlement rows with status == 'EXECUTED' whose notice_id points at any
              NoticeOfViolation (including this one) with the same (product_id, chemical_id) and
              whose executed_at satisfies
              notice.served_at - QUIET_PERIOD_DAYS days <= executed_at <= notice.served_at
      cure_eligible = (notice.alleged_violation_type == 'FAILURE_TO_WARN'
                       and notice.noticing_party_type == 'PRIVATE_PARTY'
                       and product.annual_units <= CURE_UNIT_CEILING
                       and len(prior) == 0)
    input_set: |
      the notice's own fields, its product's annual_units, and EXECUTED settlements on the same
      (product_id, chemical_id) pair inside the closed quiet-period interval ending at served_at
    constants:
      CURE_WINDOW_DAYS: 60
      CURE_UNIT_CEILING: 100000
      QUIET_PERIOD_DAYS: 1095
    precision: |
      annual_units uses <= (a product selling exactly CURE_UNIT_CEILING units is still eligible).
      The cure window is inclusive of cure_deadline_at: a COMPLETE_CURE at exactly
      cure_deadline_at succeeds, one microsecond later fails with ERR_CURE_WINDOW_CLOSED.

  # ---------------------------------------------------------------------------
  # C8 - conserved chemical mass load on Product
  # ---------------------------------------------------------------------------
  - name: total_listed_chemical_load_ug
    trigger: |
      every mutation that can change an ACTIVE component's material, quantity or concentration:
      POST /products/{product_id}/components, PATCH /product-components/{component_id},
      POST /product-components/{component_id}/transitions, POST /materials/{material_id}/chemicals,
      POST /material-chemicals/{material_chemical_id}/transitions, PATCH /materials/{material_id},
      POST /materials/{material_id}/disclosure (a disclosure gap raises every affected material to
      MODELED_DEFAULT_PPM, so the load moves too), POST /reformulation-projects/{reformulation_project_id}/transitions
      {action: SUBMIT_VERIFICATION}, and the ListedChemical LIST/DELIST/RELIST actions
    algorithm: aggregation
    formula: |
      chemicals = ListedChemical rows with status == 'LISTED', ordered by chemical_name ASC
      components = ProductComponent rows of this product with status == 'ACTIVE',
                   ordered by created_at ASC
      terms = []
      for chem in chemicals:
          for c in components:
              eff = effective_concentration_ppm(Material(c.material_id), chem, 'MODELED')
              terms.append(round_half_up(eff * c.quantity_grams_per_unit, 3))
      total_listed_chemical_load_ug = round_half_up(sum(terms), 3)
    input_set: |
      only status == 'ACTIVE' components and only status == 'LISTED' chemicals; PROPOSED, DELISTED
      and WITHDRAWN chemicals contribute nothing, and REMOVED/SUPERSEDED components contribute
      nothing
    constants: {}
    precision: |
      per-term round_half_up to 3 decimals, then sum, then round_half_up to 3 decimals - the same
      pinned order as daily_exposure_ug. This makes the quantity conserved: setting a component's
      quantity_grams_per_unit to X and then back to its original value restores the identical
      3-decimal total with no accumulated drift.

# Evaluated strictly in ascending `priority` order. The first rule whose condition holds
# short-circuits the request; no later rule is evaluated. Priorities are globally unique.
validations:
  # ---- layer 1: envelope, auth, shape (priority 1-19) ------------------------
  - rule_id: v_auth_role_header_present
    priority: 1
    category: auth
    condition: "X-User-Role header is absent or is not one of the roles declared in §1.7"
    error_id: ERR_UNAUTHORIZED
    applies_to: ["every endpoint, including POST /_clock/set_current_utc"]

  - rule_id: v_auth_role_permitted
    priority: 2
    category: auth
    condition: "the caller's X-User-Role is not listed in the endpoint's `roles`"
    error_id: ERR_UNAUTHORIZED
    applies_to: ["every endpoint"]

  - rule_id: v_request_body_shape
    priority: 3
    category: format
    condition: "a required input field is absent, null, of the wrong JSON type, or an unknown enum member is supplied"
    error_id: ERR_INVALID_REQUEST
    applies_to: ["every POST and PATCH"]

  - rule_id: v_pagination_bounds
    priority: 4
    category: format
    condition: "limit < 1, limit > 200, or offset < 0"
    error_id: ERR_INVALID_PAGINATION
    applies_to: ["every list endpoint"]

  - rule_id: v_numeric_domain
    priority: 5
    category: format
    condition: |
      any of these is negative, or zero where strictly positive is required:
      safe_harbor_level_ug_per_day <= 0 when safe_harbor_basis != NONE,
      declared_concentration_ppm < 0, lab_result_ppm < 0, lab_loq_ppm <= 0,
      quantity_grams_per_unit <= 0, uses_per_day <= 0, label_area_sq_in <= 0,
      annual_units < 0, alleged_units < 0, requested_attorney_fees_cents < 0,
      indemnity_cap_cents < 0, target_concentration_ppm < 0
    error_id: ERR_VALUE_OUT_OF_RANGE
    applies_to: ["POST /listed-chemicals", "POST /materials/{material_id}/chemicals", "POST /products", "POST /products/{product_id}/components", "POST /products/{product_id}/exposure-assessments", "POST /notices", "POST /notices/{notice_id}/settlements", "POST /suppliers", "POST /reformulation-projects", "PATCH /product-components/{component_id}", "PATCH /products/{product_id}"]

  - rule_id: v_fraction_domain
    priority: 6
    category: format
    condition: "contact_factor is outside [0.0, 1.0] or parent_mass_fraction is outside (0.0, 1.0]"
    error_id: ERR_VALUE_OUT_OF_RANGE
    applies_to: ["POST /products/{product_id}/components", "PATCH /product-components/{component_id}", "POST /materials"]

  - rule_id: v_cas_number_format
    priority: 7
    category: format
    condition: "cas_number does not match the pattern ^[0-9]{2,7}-[0-9]{2}-[0-9]$"
    error_id: ERR_INVALID_CAS_NUMBER
    applies_to: ["POST /listed-chemicals"]

  - rule_id: v_safe_harbor_basis_consistency
    priority: 8
    category: format
    condition: |
      safe_harbor_basis is NSRL or MADL but safe_harbor_level_ug_per_day is null, OR
      safe_harbor_basis is NONE but safe_harbor_level_ug_per_day is non-null
    error_id: ERR_SAFE_HARBOR_BASIS_MISMATCH
    applies_to: ["POST /listed-chemicals", "POST /listed-chemicals/{chemical_id}/transitions"]

  - rule_id: v_harm_class_basis_alignment
    priority: 9
    category: format
    condition: |
      endpoint_type is CANCER but safe_harbor_basis is MADL, or endpoint_type is one of
      {REPRODUCTIVE_FEMALE, REPRODUCTIVE_MALE, DEVELOPMENTAL} but safe_harbor_basis is NSRL
    error_id: ERR_SAFE_HARBOR_BASIS_MISMATCH
    applies_to: ["POST /listed-chemicals"]

  - rule_id: v_interval_ordering
    priority: 10
    category: format
    condition: |
      effective_to is non-null and effective_to <= effective_from (WarningPlacement, closed
      interval requires a strictly later end), warranty_effective_to is non-null and
      warranty_effective_to <= warranty_effective_from, or planned_end_date <= planned_start_date
    error_id: ERR_INVALID_INTERVAL
    applies_to: ["POST /warning-determinations/{determination_id}/placements", "POST /suppliers", "POST /reformulation-projects"]

  - rule_id: v_transition_action_known
    priority: 11
    category: format
    condition: "the `action` supplied to a /transitions endpoint (or to POST /materials/{material_id}/disclosure) is not a trigger of that entity's state machine"
    error_id: ERR_UNKNOWN_ACTION
    applies_to: ["every POST .../transitions", "POST /materials/{material_id}/disclosure"]

  - rule_id: v_distribution_channels_nonempty
    priority: 12
    category: format
    condition: "distribution_channels is an empty array or contains a value outside {RETAIL, CATALOG, INTERNET}"
    error_id: ERR_INVALID_REQUEST
    applies_to: ["POST /products", "PATCH /products/{product_id}"]

  # ---- layer 2: referential existence (priority 20-29) ----------------------
  - rule_id: v_path_entity_exists
    priority: 20
    category: referential
    condition: "an id appearing in the URL path does not resolve to a stored row of the expected entity"
    error_id: ERR_NOT_FOUND
    applies_to: ["every endpoint carrying a path id"]

  - rule_id: v_body_fk_exists
    priority: 21
    category: referential
    condition: |
      a foreign key supplied in the request body (supplier_id, parent_material_id, material_id,
      chemical_id, assessment_id, material_chemical_id, product_id, as_of_notice_id) does not
      resolve to a stored row
    error_id: ERR_NOT_FOUND
    applies_to: ["POST /materials", "POST /products/{product_id}/components", "POST /materials/{material_id}/chemicals", "POST /products/{product_id}/exposure-assessments", "POST /warning-determinations", "POST /notices", "POST /reformulation-projects", "GET /products/{product_id}/compliance-summary"]

  - rule_id: v_uniqueness
    priority: 22
    category: referential
    condition: |
      chemical_name already exists on another ListedChemical, sku already exists on another
      Product, legal_name already exists on another Supplier, the (material_id, chemical_id)
      pair already exists on another MaterialChemical, or the (product_id, material_id) pair
      already exists on another ProductComponent with status ACTIVE
    error_id: ERR_DUPLICATE_RESOURCE
    applies_to: ["POST /listed-chemicals", "POST /products", "POST /suppliers", "POST /materials/{material_id}/chemicals", "POST /products/{product_id}/components"]

  # ---- layer 3: optimistic concurrency (priority 30-31) --------------------
  - rule_id: v_occ_product_version
    priority: 30
    category: concurrency
    condition: "expected_product_version does not equal the current Product.version"
    error_id: ERR_STALE_PRODUCT_VERSION
    applies_to: ["POST /warning-determinations"]

  - rule_id: v_occ_notice_version
    priority: 31
    category: concurrency
    condition: "expected_notice_version does not equal the current NoticeOfViolation.version"
    error_id: ERR_STALE_NOTICE_VERSION
    applies_to: ["POST /notices/{notice_id}/settlements"]

  # ---- layer 4: state legality (priority 40-49) ---------------------------
  # CONFLICT PAIR 1 (higher half): a state-illegal transition is reported before the
  # business_safety rule v_finalize_requires_peer_review at priority 55.
  - rule_id: v_transition_legal_for_state
    priority: 40
    category: state
    condition: "the requested action is not defined as a transition out of the entity's current state (including every action attempted from a terminal state)"
    error_id: ERR_INVALID_STATE_TRANSITION
    applies_to: ["every POST .../transitions"]

  - rule_id: v_parent_state_allows_child_write
    priority: 41
    category: state
    condition: |
      creating a ProductComponent on a Product whose lifecycle_state is DISCONTINUED, creating an
      ExposureAssessment on a Product whose lifecycle_state is DISCONTINUED, or creating a
      MaterialChemical whose chemical status is WITHDRAWN. Placement creation is deliberately NOT
      covered here - the determination's own status is policed later, at priority 71, so that the
      temporal overlap rule at priority 60 can win the conflict pair.
    error_id: ERR_PARENT_STATE_FORBIDS_WRITE
    applies_to: ["POST /products/{product_id}/components", "POST /products/{product_id}/exposure-assessments", "POST /materials/{material_id}/chemicals"]

  - rule_id: v_immutable_after_terminal
    priority: 42
    category: state
    condition: |
      PATCH against a Product whose lifecycle_state is DISCONTINUED, a ProductComponent whose
      status is REMOVED or SUPERSEDED, or a Material reached only through SUPERSEDED components
    error_id: ERR_ENTITY_IMMUTABLE
    applies_to: ["PATCH /products/{product_id}", "PATCH /product-components/{component_id}"]

  - rule_id: v_computed_field_not_writable
    priority: 43
    category: state
    condition: "a request body supplies a field whose source is computed or system"
    error_id: ERR_FIELD_NOT_WRITABLE
    applies_to: ["every POST and PATCH"]

  - rule_id: v_enforcement_hold_freezes_bom
    priority: 44
    category: state
    condition: |
      any bill-of-materials write (component create, component PATCH, component REMOVE) is
      attempted on a Product whose compliance_posture is ENFORCEMENT_HOLD
    error_id: ERR_ENFORCEMENT_HOLD_FREEZE
    applies_to: ["POST /products/{product_id}/components", "PATCH /product-components/{component_id}", "POST /product-components/{component_id}/transitions"]

  # ---- layer 5: business_safety (priority 50-59) --------------------------
  - rule_id: v_assessment_requires_active_component
    priority: 50
    category: business_safety
    condition: "SUBMIT is requested on an ExposureAssessment whose product has zero ProductComponent rows with status ACTIVE"
    error_id: ERR_NO_ACTIVE_COMPONENTS
    applies_to: ["POST /exposure-assessments/{assessment_id}/transitions"]

  - rule_id: v_lab_variant_requires_lab_data
    priority: 51
    category: business_safety
    condition: |
      SUBMIT is requested on an ExposureAssessment whose method is LAB_TESTED while some
      contributing MaterialChemical link has measurement_basis != LAB_TESTED or has a null
      lab_result_ppm or a null lab_loq_ppm
    error_id: ERR_LAB_RESULT_MISSING
    applies_to: ["POST /exposure-assessments/{assessment_id}/transitions"]

  - rule_id: v_disclosure_gap_blocks_lab_claim
    priority: 52
    category: business_safety
    condition: |
      SUBMIT is requested on a LAB_TESTED assessment while some contributing Material has
      disclosure_status REFUSED and naturally_occurring_claim is false
    error_id: ERR_SUPPLIER_DATA_INCOMPLETE
    applies_to: ["POST /exposure-assessments/{assessment_id}/transitions"]

  - rule_id: v_no_warning_requires_clear_exposure
    priority: 53
    category: business_safety
    condition: |
      a WarningDetermination is created with decision NO_WARNING_REQUIRED while the product has at
      least one FINAL ExposureAssessment whose result is AT_OR_ABOVE_SAFE_HARBOR or NO_SAFE_HARBOR
    error_id: ERR_EXPOSURE_ABOVE_SAFE_HARBOR
    applies_to: ["POST /warning-determinations"]

  - rule_id: v_warning_requires_qualifying_exposure
    priority: 54
    category: business_safety
    condition: |
      a WarningDetermination is created with decision WARNING_REQUIRED while the product has no
      FINAL ExposureAssessment whose result is AT_OR_ABOVE_SAFE_HARBOR or NO_SAFE_HARBOR
    error_id: ERR_NO_QUALIFYING_EXPOSURE
    applies_to: ["POST /warning-determinations"]

  # CONFLICT PAIR 1 (lower half): loses to v_transition_legal_for_state at priority 40.
  - rule_id: v_finalize_requires_peer_review
    priority: 55
    category: business_safety
    condition: "FINALIZE is requested on an ExposureAssessment that has no reviewed_by_user_id recorded"
    error_id: ERR_PEER_REVIEW_REQUIRED
    applies_to: ["POST /exposure-assessments/{assessment_id}/transitions"]

  - rule_id: v_segregation_of_duties
    priority: 56
    category: business_safety
    condition: |
      the X-User-Id performing PEER_REVIEW equals the assessment's submitted_by_user_id, the
      X-User-Id performing APPROVE on a WarningDetermination equals its prepared_by_user_id, or
      the X-User-Id performing EXECUTE on a Settlement equals its proposed_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: ["POST /exposure-assessments/{assessment_id}/transitions", "POST /warning-determinations/{determination_id}/transitions", "POST /settlements/{settlement_id}/transitions"]

  - rule_id: v_placement_channel_required
    priority: 57
    category: business_safety
    condition: "the placement's channel is not a member of the determination's computed required_channels"
    error_id: ERR_CHANNEL_NOT_REQUIRED
    applies_to: ["POST /warning-determinations/{determination_id}/placements"]

  - rule_id: v_reformulation_target_below_threshold
    priority: 58
    category: business_safety
    condition: |
      SUBMIT_VERIFICATION is requested on a ReformulationProject whose verified_daily_exposure_ug
      is not strictly less than the chemical's safe_harbor_level_ug_per_day, or the project's
      target_concentration_ppm is not strictly less than the linked MaterialChemical's current
      effective concentration at create time
    error_id: ERR_TARGET_NOT_BELOW_THRESHOLD
    applies_to: ["POST /reformulation-projects", "POST /reformulation-projects/{reformulation_project_id}/transitions"]

  # ---- layer 6: business_temporal (priority 60-64) -----------------------
  # CONFLICT PAIR 2 (higher half): beats v_placement_needs_approved_determination at priority 71.
  - rule_id: v_placement_no_overlap
    priority: 60
    category: business_temporal
    condition: |
      the new WarningPlacement's CLOSED [effective_from, effective_to] interval intersects an
      existing placement of the same determination on the same channel whose status is not
      NON_COMPLIANT; touching endpoints (new.effective_from == existing.effective_to) DO collide
    error_id: ERR_PLACEMENT_OVERLAP
    applies_to: ["POST /warning-determinations/{determination_id}/placements"]

  - rule_id: v_reformulation_no_overlap
    priority: 61
    category: business_temporal
    condition: |
      the new ReformulationProject's HALF-OPEN [planned_start_date, planned_end_date) interval
      intersects an existing non-terminal project on the same (product_id, chemical_id) pair;
      touching endpoints (new.planned_start_date == existing.planned_end_date) do NOT collide
    error_id: ERR_REFORMULATION_OVERLAP
    applies_to: ["POST /reformulation-projects"]

  - rule_id: v_cure_window_open
    priority: 62
    category: business_temporal
    condition: "COMPLETE_CURE is requested after the notice's cure_deadline_at has passed (the instant equal to cure_deadline_at is still inside the window)"
    error_id: ERR_CURE_WINDOW_CLOSED
    applies_to: ["POST /notices/{notice_id}/transitions"]

  - rule_id: v_violation_date_not_after_service
    priority: 63
    category: business_temporal
    condition: "earliest_violation_date is later than served_at, or served_at is later than the current logical clock"
    error_id: ERR_INVALID_INTERVAL
    applies_to: ["POST /notices"]

  - rule_id: v_warranty_window_covers_service
    priority: 64
    category: business_temporal
    condition: |
      REVOKE_WARRANTY is requested on a Supplier whose warranty window is currently covering the
      served_at of at least one notice in status UNDER_EVALUATION or SETTLEMENT_NEGOTIATION
    error_id: ERR_WARRANTY_IN_USE
    applies_to: ["POST /suppliers/{supplier_id}/transitions"]

  # ---- layer 7: business_referential (priority 70-74) --------------------
  - rule_id: v_assessment_chemical_listed
    priority: 70
    category: business_referential
    condition: "the ExposureAssessment's chemical is not in status LISTED at create time"
    error_id: ERR_CHEMICAL_NOT_LISTED
    applies_to: ["POST /products/{product_id}/exposure-assessments"]

  # CONFLICT PAIR 2 (lower half): loses to v_placement_no_overlap at priority 60.
  - rule_id: v_placement_needs_approved_determination
    priority: 71
    category: business_referential
    condition: "the target WarningDetermination's status is not APPROVED (i.e. it is DRAFT, PENDING_APPROVAL, REVOKED or SUPERSEDED)"
    error_id: ERR_DETERMINATION_NOT_APPROVED
    applies_to: ["POST /warning-determinations/{determination_id}/placements"]

  - rule_id: v_settlement_notice_in_negotiation
    priority: 72
    category: business_referential
    condition: "a Settlement is created against a notice whose status is not SETTLEMENT_NEGOTIATION"
    error_id: ERR_NOTICE_NOT_NEGOTIABLE
    applies_to: ["POST /notices/{notice_id}/settlements"]

  - rule_id: v_material_cycle_and_depth
    priority: 73
    category: business_referential
    condition: |
      parent_material_id points at the material itself or at any of its own descendants (a cycle),
      or the resulting bom_depth would exceed MAX_BOM_DEPTH (4)
    error_id: ERR_MATERIAL_CYCLE
    applies_to: ["POST /materials", "PATCH /materials/{material_id}"]

  - rule_id: v_reformulation_link_consistent
    priority: 74
    category: business_referential
    condition: |
      the referenced MaterialChemical's chemical_id differs from the project's chemical_id, or its
      material is not the material of any ACTIVE ProductComponent of the project's product
    error_id: ERR_REFORMULATION_LINK_MISMATCH
    applies_to: ["POST /reformulation-projects"]

  - rule_id: v_determination_basis_final
    priority: 75
    category: business_referential
    condition: |
      the assessment named by assessment_id belongs to a different product than product_id, or its
      status is not FINAL at determination-create time
    error_id: ERR_BASIS_ASSESSMENT_NOT_FINAL
    applies_to: ["POST /warning-determinations"]

  # ---- layer 8: business_constraint (priority 80-84) --------------------
  # CONFLICT PAIR 3 (higher half): beats v_settlement_fees_exceed_cap at priority 90.
  - rule_id: v_single_open_determination
    priority: 80
    category: business_constraint
    condition: "a WarningDetermination is created for a product that already has one in status DRAFT or PENDING_APPROVAL (an in-flight determination). An APPROVED determination does NOT block a successor: the successor is created in DRAFT alongside it and supersedes it only when the successor itself is APPROVED"
    error_id: ERR_OPEN_DETERMINATION_EXISTS
    applies_to: ["POST /warning-determinations"]

  - rule_id: v_single_open_settlement
    priority: 81
    category: business_constraint
    condition: "a Settlement is created for a notice that already has one in status PROPOSED, COUNTERED or EXECUTED"
    error_id: ERR_OPEN_SETTLEMENT_EXISTS
    applies_to: ["POST /notices/{notice_id}/settlements"]

  - rule_id: v_settlement_round_ceiling
    priority: 82
    category: business_constraint
    condition: "COUNTER or REVISE is requested on a Settlement whose round_count already equals MAX_SETTLEMENT_ROUNDS (3) - both actions consume a round, so neither can push the counter past the ceiling"
    error_id: ERR_SETTLEMENT_ROUND_LIMIT
    applies_to: ["POST /settlements/{settlement_id}/transitions"]

  - rule_id: v_assessment_rejection_ceiling
    priority: 83
    category: business_constraint
    condition: "REJECT is requested on an ExposureAssessment whose rejection_count already equals MAX_ASSESSMENT_REJECTIONS (2)"
    error_id: ERR_REJECTION_LIMIT_REACHED
    applies_to: ["POST /exposure-assessments/{assessment_id}/transitions"]

  - rule_id: v_enforcement_hold_blocks_marketing
    priority: 84
    category: business_constraint
    condition: "MARKET is requested on a Product whose compliance_posture is ENFORCEMENT_HOLD or EXPOSURE_UNKNOWN"
    error_id: ERR_PRODUCT_ON_ENFORCEMENT_HOLD
    applies_to: ["POST /products/{product_id}/transitions"]

  # ---- layer 9: business_fiscal (priority 90-93) ------------------------
  # CONFLICT PAIR 3 (lower half): loses to v_single_open_settlement at priority 81 and to
  # v_single_open_determination at priority 80.
  - rule_id: v_settlement_fees_exceed_cap
    priority: 90
    category: business_fiscal
    condition: "requested_attorney_fees_cents exceeds ABSOLUTE_FEE_REQUEST_CEILING_CENTS (5000000)"
    error_id: ERR_FEE_REQUEST_EXCEEDS_CEILING
    applies_to: ["POST /notices/{notice_id}/settlements"]

  - rule_id: v_indemnity_cap_covers_penalty
    priority: 91
    category: business_fiscal
    condition: |
      EXECUTE is requested on a Settlement whose adjusted_penalty_cents exceeds the summed
      indemnity_cap_cents of every ACTIVE-warranty supplier behind the product's ACTIVE components,
      while that settlement's warranty defense was applied (mitigation_factor includes 0.60)
    error_id: ERR_INDEMNITY_CAP_EXCEEDED
    applies_to: ["POST /settlements/{settlement_id}/transitions"]

  - rule_id: v_penalty_requires_positive_window
    priority: 92
    category: business_fiscal
    condition: "the computed violation_days is zero or negative at Settlement create time"
    error_id: ERR_NO_VIOLATION_WINDOW
    applies_to: ["POST /notices/{notice_id}/settlements"]

  - rule_id: v_void_requires_undelivered_consideration
    priority: 93
    category: business_fiscal
    condition: |
      VOID is requested on a Settlement whose reformulation_commitment is true while the
      settlement's product already has a ReformulationProject in status COMPLETED naming the
      notice's chemical_id - the promised consideration has been delivered, so the money cannot be
      unwound
    error_id: ERR_SETTLEMENT_NOT_VOIDABLE
    applies_to: ["POST /settlements/{settlement_id}/transitions"]

endpoints:
  # =========================================================================
  # READS - single-resource GETs (each one fixes its entity's collection
  # segment) and filtered collection GETs (each FK declared in §1.1 is
  # reverse-reachable through the filtered-list form)
  # =========================================================================
  - method: GET
    path: "/listed-chemicals/{chemical_id}"
    description: "Read one listed chemical including harm_class, warning_required_from and revision_count."
    roles: [RegistryAdmin, ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist]
    code: 200
    input: []
    output: ListedChemical
    side_effects: []

  - method: GET
    path: "/listed-chemicals"
    description: "Paginated registry list, optionally filtered by lifecycle status or harm class."
    roles: [RegistryAdmin, ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist]
    code: 200
    input: ["status?", "harm_class?", "limit?", "offset?"]
    output: ListedChemical[]
    side_effects: []

  - method: GET
    path: "/suppliers/{supplier_id}"
    description: "Read one supplier including warranty_status, warranty_scope, indemnity_cap_cents and the warranty window."
    roles: [ComplianceAnalyst, RegulatoryCounsel, RegistryAdmin, SupplierPortalUser]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/materials/{material_id}"
    description: "Read one material including disclosure_status, bom_depth and the supplier-data timestamps."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin, SupplierPortalUser]
    code: 200
    input: []
    output: Material
    side_effects: []

  - method: GET
    path: "/materials"
    description: "Paginated material list. Reverse-reachability for Material.supplier_id and Material.parent_material_id (self-referential BOM children)."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin, SupplierPortalUser]
    code: 200
    input: ["supplier_id?", "parent_material_id?", "material_class?", "disclosure_status?", "limit?", "offset?"]
    output: Material[]
    side_effects: []

  - method: GET
    path: "/material-chemicals/{material_chemical_id}"
    description: "Read one material/chemical link including measurement_basis and the laboratory result fields."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin, SupplierPortalUser]
    code: 200
    input: []
    output: MaterialChemical
    side_effects: []

  - method: GET
    path: "/material-chemicals"
    description: "Paginated link list. Reverse-reachability for MaterialChemical.material_id and MaterialChemical.chemical_id."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin, SupplierPortalUser]
    code: 200
    input: ["material_id?", "chemical_id?", "status?", "measurement_basis?", "limit?", "offset?"]
    output: MaterialChemical[]
    side_effects: []

  - method: GET
    path: "/products/{product_id}"
    description: "Read one product including both state dimensions (lifecycle_state, compliance_posture) and the derived counters open_notice_count, accrued_penalty_cents and total_listed_chemical_load_ug."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "Paginated product list, optionally filtered on either state dimension independently."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: ["lifecycle_state?", "compliance_posture?", "product_category?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/product-components/{component_id}"
    description: "Read one bill-of-materials component including its ACTIVE/REMOVED/SUPERSEDED status."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: []
    output: ProductComponent
    side_effects: []

  - method: GET
    path: "/product-components"
    description: "Paginated component list. Reverse-reachability for ProductComponent.product_id and ProductComponent.material_id."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: ["product_id?", "material_id?", "status?", "limit?", "offset?"]
    output: ProductComponent[]
    side_effects: []

  - method: GET
    path: "/exposure-assessments/{assessment_id}"
    description: "Read one exposure assessment including daily_exposure_ug, margin_ratio, result, contribution_count and the peer-review audit fields."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: []
    output: ExposureAssessment
    side_effects: []

  - method: GET
    path: "/exposure-assessments"
    description: "Paginated assessment list. Reverse-reachability for ExposureAssessment.product_id and ExposureAssessment.chemical_id."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: ["product_id?", "chemical_id?", "status?", "method?", "result?", "limit?", "offset?"]
    output: ExposureAssessment[]
    side_effects: []

  - method: GET
    path: "/warning-determinations/{determination_id}"
    description: "Read one warning determination including warning_type, symbol_required, named_chemicals, website_url, warning_text, required_channels and covered_channel_count."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: []
    output: WarningDetermination
    side_effects: []

  - method: GET
    path: "/warning-determinations"
    description: "Paginated determination list. Reverse-reachability for WarningDetermination.product_id and WarningDetermination.assessment_id."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: ["product_id?", "assessment_id?", "status?", "warning_type?", "limit?", "offset?"]
    output: WarningDetermination[]
    side_effects: []

  - method: GET
    path: "/warning-placements/{placement_id}"
    description: "Read one placement including channel, the closed effective window and remediation_count."
    roles: [ComplianceAnalyst, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: []
    output: WarningPlacement
    side_effects: []

  - method: GET
    path: "/warning-placements"
    description: "Paginated placement list. Reverse-reachability for WarningPlacement.determination_id."
    roles: [ComplianceAnalyst, RegulatoryCounsel, LabelingSpecialist, RegistryAdmin]
    code: 200
    input: ["determination_id?", "channel?", "status?", "limit?", "offset?"]
    output: WarningPlacement[]
    side_effects: []

  - method: GET
    path: "/notices/{notice_id}"
    description: "Read one notice of violation including cure_deadline_at, cure_eligible and cure_completed_at."
    roles: [ComplianceAnalyst, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: []
    output: NoticeOfViolation
    side_effects: []

  - method: GET
    path: "/notices"
    description: "Paginated notice list. Reverse-reachability for NoticeOfViolation.product_id and NoticeOfViolation.chemical_id."
    roles: [ComplianceAnalyst, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: ["product_id?", "chemical_id?", "status?", "noticing_party_type?", "limit?", "offset?"]
    output: NoticeOfViolation[]
    side_effects: []

  - method: GET
    path: "/settlements/{settlement_id}"
    description: "Read one settlement including the full money waterfall (violation_days through total_settlement_cents) and round_count."
    roles: [ComplianceAnalyst, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "Paginated settlement list. Reverse-reachability for Settlement.notice_id."
    roles: [ComplianceAnalyst, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: ["notice_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/reformulation-projects/{reformulation_project_id}"
    description: "Read one reformulation project including baseline_daily_exposure_ug, verified_daily_exposure_ug and reduction_pct."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: []
    output: ReformulationProject
    side_effects: []

  - method: GET
    path: "/reformulation-projects"
    description: "Paginated project list. Reverse-reachability for ReformulationProject.product_id, ReformulationProject.chemical_id and ReformulationProject.material_chemical_id."
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: ["product_id?", "chemical_id?", "material_chemical_id?", "status?", "limit?", "offset?"]
    output: ReformulationProject[]
    side_effects: []

  - method: GET
    path: "/products/{product_id}/compliance-summary"
    description: |
      Computed defense-file read. Returns the defense_strength_score together with its four
      evidence components and the counts they were derived from. Without as_of_notice_id the
      AS_OF_TODAY variant is evaluated against the current logical clock; with as_of_notice_id the
      AS_OF_SERVICE_DATE variant is evaluated against that notice's served_at (the notice MUST
      belong to this product, otherwise ERR_NOT_FOUND).
    roles: [ComplianceAnalyst, ToxicologyReviewer, RegulatoryCounsel, RegistryAdmin]
    code: 200
    input: ["as_of_notice_id?"]
    output: "{ product_id: string, variant: string, as_of: datetime, defense_strength_score: integer, warning_evidence: number, assessment_evidence: number, warranty_evidence: number, recordkeeping_evidence: number, required_channel_count: integer, covered_channel_count: integer, verified_channel_count: integer, final_assessment_count: integer, verified_material_count: integer, active_component_count: integer }"
    side_effects: []

  # =========================================================================
  # WRITES - registry
  # =========================================================================
  - method: POST
    path: "/listed-chemicals"
    description: "Register a chemical in the PROPOSED state. harm_class is derived from endpoint_type; warning_required_from stays null until a LIST action supplies listing_effective_date."
    roles: [RegistryAdmin]
    code: 201
    input: [chemical_name, cas_number, endpoint_type, safe_harbor_basis, "safe_harbor_level_ug_per_day?"]
    output: ListedChemical
    side_effects:
      - "computes harm_class from endpoint_type (CANCER -> CANCER, everything else -> REPRODUCTIVE)"
      - "sets status to PROPOSED and revision_count to 0"

  - method: POST
    path: "/listed-chemicals/{chemical_id}/transitions"
    description: |
      Drive the registry lifecycle: LIST (requires listing_effective_date), WITHDRAW, DELIST,
      RELIST (requires listing_effective_date) and REVISE_SAFE_HARBOR (requires safe_harbor_basis
      and, unless the new basis is NONE, safe_harbor_level_ug_per_day). REVISE_SAFE_HARBOR is the
      four-level cascade trigger: chemical -> assessments -> determinations -> placements/posture.
    roles: [RegistryAdmin]
    code: 200
    input: [action, "listing_effective_date?", "safe_harbor_basis?", "safe_harbor_level_ug_per_day?"]
    output: ListedChemical
    side_effects:
      - "LIST/RELIST: sets listing_effective_date and recomputes warning_required_from = listing_effective_date + 365 days"
      - "REVISE_SAFE_HARBOR: increments revision_count, re-runs safe_harbor_verdict for every FINAL ExposureAssessment on this chemical, moves any assessment whose result changes to SUPERSEDED, REVOKEs the APPROVED WarningDetermination whose basis assessment left FINAL, FLAG_NON_COMPLIANTs that determination's IMPLEMENTED/VERIFIED placements, and recomputes each affected Product.compliance_posture"
      - "DELIST: recomputes Product.total_listed_chemical_load_ug for every product carrying this chemical (delisted chemicals contribute nothing) and supersedes its FINAL assessments"
      - "increments ListedChemical.version by 1"

  # =========================================================================
  # WRITES - suppliers, materials and supplier data collection
  # =========================================================================
  - method: POST
    path: "/suppliers"
    description: "Create a supplier. Warranty terms may be supplied at create time but stay dormant until EXECUTE_WARRANTY; warranty_status starts at NONE. legal_name is unique."
    roles: [ComplianceAnalyst]
    code: 201
    input: [legal_name, contact_email, "warranty_scope?", "pass_through_warning_obligation?", "indemnity_cap_cents?", "warranty_effective_from?", "warranty_effective_to?"]
    output: Supplier
    side_effects:
      - "sets warranty_status to NONE"

  - method: POST
    path: "/suppliers/{supplier_id}/transitions"
    description: "EXECUTE_WARRANTY moves warranty_status NONE -> ACTIVE (requires warranty_scope and warranty_effective_from already stored); REVOKE_WARRANTY moves ACTIVE -> REVOKED and closes an open-ended window at the current logical clock."
    roles: [RegulatoryCounsel]
    code: 200
    input: [action]
    output: Supplier
    side_effects:
      - "REVOKE_WARRANTY: sets warranty_effective_to to the current logical clock when it was null, so the warranty mitigation factor stops applying to settlements created afterwards"
      - "increments Supplier.version by 1"

  - method: POST
    path: "/materials"
    description: "Create a raw material, packaging item or manufacturing aid. Supplying parent_material_id makes this material a constituent of a compound material and requires parent_mass_fraction; bom_depth is derived as parent.bom_depth + 1 and may not exceed 4."
    roles: [ComplianceAnalyst]
    code: 201
    input: [material_code, material_class, supplier_id, "parent_material_id?", "parent_mass_fraction?", "naturally_occurring_claim?"]
    output: Material
    side_effects:
      - "computes bom_depth from the parent chain (ERR_MATERIAL_CYCLE when the limit is exceeded)"
      - "sets disclosure_status to NOT_REQUESTED"
      - "recomputes total_listed_chemical_load_ug for every product whose ACTIVE components reach this material through the parent chain"

  - method: PATCH
    path: "/materials/{material_id}"
    description: "Re-parent a material inside the bill of materials or update its naturally-occurring claim. Re-parenting is the only way to create a cycle attempt, and is rejected with ERR_MATERIAL_CYCLE."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["parent_material_id?", "parent_mass_fraction?", "naturally_occurring_claim?"]
    output: Material
    side_effects:
      - "recomputes bom_depth for this material and every descendant, rejecting the request when any descendant would exceed 4"
      - "recomputes total_listed_chemical_load_ug for every affected product"
      - "increments Material.version by 1"

  - method: POST
    path: "/materials/{material_id}/disclosure"
    description: |
      Supplier data-collection actions: REQUEST (also used to re-request after an INCOMPLETE or
      REFUSED response), RECORD_RESPONSE with response_completeness COMPLETE or INCOMPLETE,
      MARK_REFUSED, and VERIFY. RECORD_RESPONSE may be filed by the supplier itself
      (SupplierPortalUser) or transcribed by a ComplianceAnalyst.
    roles: [ComplianceAnalyst, SupplierPortalUser]
    code: 200
    input: [action, "response_completeness?", "naturally_occurring_claim?"]
    output: Material
    side_effects:
      - "REQUEST: stamps data_request_sent_at with the current logical clock"
      - "RECORD_RESPONSE: stamps data_received_at with the current logical clock"
      - "any change to disclosure_status recomputes every MODELED ExposureAssessment in status DRAFT, SUBMITTED or PEER_REVIEWED of every product reaching this material (a material in NOT_REQUESTED, REQUESTED, INCOMPLETE or REFUSED contributes MODELED_DEFAULT_PPM instead of its declared value). A FINAL assessment KEEPS the numbers it was finalized with - only the explicit supersede cascades (REVISE_SAFE_HARBOR, DELIST, reformulation SUBMIT_VERIFICATION, a newer FINALIZE) may touch a FINAL row"
      - "recomputes those products' total_listed_chemical_load_ug and their compliance_posture"
      - "increments Material.version by 1"

  - method: POST
    path: "/materials/{material_id}/chemicals"
    description: "Declare that a listed chemical is present in this material at a supplier-declared concentration. The (material_id, chemical_id) pair is unique; measurement_basis starts at SUPPLIER_DECLARED and status at DECLARED."
    roles: [ComplianceAnalyst, SupplierPortalUser]
    code: 201
    input: [chemical_id, declared_concentration_ppm]
    output: MaterialChemical
    side_effects:
      - "recomputes total_listed_chemical_load_ug for every product reaching this material"
      - "recomputes compliance_posture for those products"

  - method: POST
    path: "/material-chemicals/{material_chemical_id}/transitions"
    description: |
      Laboratory-testing lifecycle: REQUEST_TEST, REPORT_RESULT (requires lab_name, lab_result_ppm
      and lab_loq_ppm), VERIFY, and DISPUTE (requires dispute_note). A disputed result returns to
      TEST_REQUESTED so a re-test can be ordered.
    roles: [ComplianceAnalyst, ToxicologyReviewer]
    code: 200
    input: [action, "lab_name?", "lab_result_ppm?", "lab_loq_ppm?", "dispute_note?"]
    output: MaterialChemical
    side_effects:
      - "REPORT_RESULT: stamps lab_reported_at, flips measurement_basis to LAB_TESTED and makes LAB_TESTED assessments admissible for this link"
      - "REPORT_RESULT/VERIFY/DISPUTE: recomputes daily_exposure_ug for every ExposureAssessment in status DRAFT, SUBMITTED or PEER_REVIEWED of every product reaching this material, under each assessment's own method variant; FINAL rows are left alone"
      - "recomputes total_listed_chemical_load_ug and compliance_posture for those products"
      - "increments MaterialChemical.version by 1"

  # =========================================================================
  # WRITES - products and bill of materials
  # =========================================================================
  - method: POST
    path: "/products"
    description: "Create a consumer product. sku is unique. lifecycle_state starts at DEVELOPMENT and compliance_posture at EXPOSURE_UNKNOWN - the two dimensions evolve independently."
    roles: [RegistryAdmin]
    code: 201
    input: [sku, product_name, product_category, distribution_channels, label_area_sq_in, annual_units, "occupancy_type?"]
    output: Product
    side_effects:
      - "sets lifecycle_state to DEVELOPMENT, compliance_posture to EXPOSURE_UNKNOWN, and all derived counters to 0"

  - method: POST
    path: "/products/{product_id}/transitions"
    description: "Commercial lifecycle actions MARKET (DEVELOPMENT -> MARKETED) and DISCONTINUE (DEVELOPMENT or MARKETED -> DISCONTINUED). MARKET is refused while compliance_posture is ENFORCEMENT_HOLD or EXPOSURE_UNKNOWN."
    roles: [RegistryAdmin]
    code: 200
    input: [action]
    output: Product
    side_effects:
      - "compliance_posture is left untouched - the two dimensions are independent"
      - "DISCONTINUE: further exposure assessments, determinations and placements are refused with ERR_PARENT_STATE_FORBIDS_WRITE, while posture recomputation continues"
      - "increments Product.version by 1"

  - method: PATCH
    path: "/products/{product_id}"
    description: |
      Update the product configuration fields that drive warning content selection. Neither state
      dimension is writable here: supplying lifecycle_state or compliance_posture is rejected with
      ERR_FIELD_NOT_WRITABLE, and a DISCONTINUED product rejects the whole request with
      ERR_ENTITY_IMMUTABLE.
    roles: [RegistryAdmin]
    code: 200
    input: ["product_name?", "product_category?", "occupancy_type?", "distribution_channels?", "label_area_sq_in?", "annual_units?"]
    output: Product
    side_effects:
      - "changing distribution_channels or occupancy_type changes the required_channels that the NEXT determination computes; an already-APPROVED determination keeps the channels it was computed with"
      - "increments Product.version by 1"

  - method: POST
    path: "/products/{product_id}/components"
    description: "Add a bill-of-materials component. Supplying supersedes_component_id marks that ACTIVE component SUPERSEDED in the same request, which is how a component of the same material can be replaced without tripping the ACTIVE-pair uniqueness rule."
    roles: [ComplianceAnalyst]
    code: 201
    input: [material_id, quantity_grams_per_unit, contact_factor, "supersedes_component_id?"]
    output: ProductComponent
    side_effects:
      - "supersedes_component_id: moves the named component ACTIVE -> SUPERSEDED before the uniqueness check runs"
      - "recomputes Product.total_listed_chemical_load_ug"
      - "recomputes daily_exposure_ug for every ExposureAssessment of this product in status DRAFT, SUBMITTED or PEER_REVIEWED"
      - "recomputes Product.compliance_posture (a product that had zero ACTIVE components leaves EXPOSURE_UNKNOWN only once an assessment reaches FINAL)"
      - "increments Product.version by 1"

  - method: PATCH
    path: "/product-components/{component_id}"
    description: "Adjust the mass or contact fraction of an ACTIVE component. Used to verify that total_listed_chemical_load_ug is conserved: change a quantity and change it back, and the 3-decimal total returns to its original value with no drift."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["quantity_grams_per_unit?", "contact_factor?"]
    output: ProductComponent
    side_effects:
      - "recomputes Product.total_listed_chemical_load_ug"
      - "recomputes daily_exposure_ug for every ExposureAssessment of the parent product in status DRAFT, SUBMITTED or PEER_REVIEWED"
      - "increments Product.version by 1"
      - "increments ProductComponent.version by 1"

  - method: POST
    path: "/product-components/{component_id}/transitions"
    description: "REMOVE takes an ACTIVE component out of the bill of materials (status ACTIVE -> REMOVED), excluding it from every exposure and load calculation from that instant on."
    roles: [ComplianceAnalyst]
    code: 200
    input: [action]
    output: ProductComponent
    side_effects:
      - "recomputes Product.total_listed_chemical_load_ug without this component"
      - "recomputes Product.compliance_posture (removing the last ACTIVE component returns the product to EXPOSURE_UNKNOWN)"
      - "increments Product.version by 1"
      - "increments ProductComponent.version by 1"

  # =========================================================================
  # WRITES - exposure assessment and peer review
  # =========================================================================
  - method: POST
    path: "/products/{product_id}/exposure-assessments"
    description: "Open an exposure assessment for one (product, chemical) pair under a stated method (LAB_TESTED or MODELED) and route. daily_exposure_ug, margin_ratio, result and contribution_count are computed immediately from the product's ACTIVE components."
    roles: [ComplianceAnalyst]
    code: 201
    input: [chemical_id, method, route, uses_per_day]
    output: ExposureAssessment
    side_effects:
      - "runs daily_exposure_ug under the requested method variant and then safe_harbor_verdict"
      - "sets status to DRAFT"

  - method: POST
    path: "/exposure-assessments/{assessment_id}/transitions"
    description: |
      Peer-review lifecycle: SUBMIT, PEER_REVIEW, REJECT, REOPEN and FINALIZE. PEER_REVIEW and
      FINALIZE must be performed by a ToxicologyReviewer other than the submitter
      (ERR_SEGREGATION_OF_DUTIES); FINALIZE requires a recorded reviewer.
    roles: [ComplianceAnalyst, ToxicologyReviewer]
    code: 200
    input: [action, "review_note?"]
    output: ExposureAssessment
    side_effects:
      - "SUBMIT: recomputes daily_exposure_ug and safe_harbor_verdict from current data and stamps submitted_by_user_id"
      - "PEER_REVIEW: stamps reviewed_by_user_id"
      - "REJECT: increments rejection_count (ceiling 2)"
      - "REOPEN: clears submitted_by_user_id but PRESERVES reviewed_by_user_id, so the next SUBMIT can be followed by a direct FINALIZE"
      - "FINALIZE: stamps finalized_at, moves any earlier FINAL assessment for the same (product_id, chemical_id) to SUPERSEDED, and recomputes Product.compliance_posture"
      - "increments ExposureAssessment.version by 1"
      - "any status change that adds or removes a FINAL assessment increments Product.version by 1"

  # =========================================================================
  # WRITES - warning determination and placement
  # =========================================================================
  - method: POST
    path: "/warning-determinations"
    description: |
      Decide whether a product needs a warning and, when it does, select the warning content.
      warning_type, symbol_required, named_chemicals, website_url, warning_text and
      required_channels are all computed by warning_content_selection from the product's
      configuration and its FINAL assessments. Optimistic concurrency: expected_product_version
      must equal the Product's current version.
    roles: [LabelingSpecialist]
    code: 201
    input: [product_id, assessment_id, decision, expected_product_version]
    output: WarningDetermination
    side_effects:
      - "runs warning_content_selection and stores every computed content field"
      - "stamps prepared_by_user_id from X-User-ID and sets status to DRAFT; an existing APPROVED determination of the same product is left untouched until this one is APPROVED"
      - "increments Product.version by 1"

  - method: POST
    path: "/warning-determinations/{determination_id}/transitions"
    description: "Approval lifecycle: SUBMIT_FOR_APPROVAL (LabelingSpecialist), RETURN_FOR_REVISION, APPROVE and REVOKE (RegulatoryCounsel). APPROVE must be performed by someone other than the preparer."
    roles: [LabelingSpecialist, RegulatoryCounsel]
    code: 200
    input: [action, "review_note?"]
    output: WarningDetermination
    side_effects:
      - "APPROVE: re-runs warning_content_selection against current data, stamps approved_by_user_id, moves any previously APPROVED determination of the same product to SUPERSEDED, and recomputes Product.compliance_posture to WARNING_REQUIRED or WARNING_ACTIVE"
      - "REVOKE: FLAG_NON_COMPLIANTs every IMPLEMENTED or VERIFIED placement of this determination and recomputes Product.compliance_posture"
      - "recomputes covered_channel_count"
      - "increments WarningDetermination.version by 1 and Product.version by 1"

  - method: POST
    path: "/warning-determinations/{determination_id}/placements"
    description: |
      Place the approved warning on one channel. The channel must be a member of the
      determination's computed required_channels; CATALOG requires catalog_page_ref and
      INTERNET_POS requires internet_display_position. The effective window is CLOSED at both
      ends, so a new window starting exactly when an existing one ends is an overlap.
    roles: [LabelingSpecialist]
    code: 201
    input: [channel, effective_from, "effective_to?", placement_detail, "catalog_page_ref?", "internet_display_position?"]
    output: WarningPlacement
    side_effects:
      - "sets status to PLANNED"
      - "recomputes WarningDetermination.covered_channel_count"
      - "recomputes Product.compliance_posture (WARNING_REQUIRED -> WARNING_ACTIVE once every required channel is covered by an IMPLEMENTED or VERIFIED placement)"

  - method: POST
    path: "/warning-placements/{placement_id}/transitions"
    description: "Placement lifecycle: IMPLEMENT and REMEDIATE (LabelingSpecialist), VERIFY and FLAG_NON_COMPLIANT (RegulatoryCounsel). REMEDIATE returns a NON_COMPLIANT placement to IMPLEMENTED and counts the round."
    roles: [LabelingSpecialist, RegulatoryCounsel]
    code: 200
    input: [action]
    output: WarningPlacement
    side_effects:
      - "IMPLEMENT: stamps implemented_by_user_id"
      - "REMEDIATE: increments remediation_count"
      - "recomputes WarningDetermination.covered_channel_count and Product.compliance_posture"
      - "increments WarningPlacement.version by 1 and Product.version by 1"

  # =========================================================================
  # WRITES - notices of violation, settlements, reformulation
  # =========================================================================
  - method: POST
    path: "/notices"
    description: "Intake a private-party or public-prosecutor notice of violation. cure_deadline_at is computed as served_at + 60 days (inclusive); cure_eligible stays null until EVALUATE runs."
    roles: [RegulatoryCounsel]
    code: 201
    input: [product_id, chemical_id, noticing_party_name, noticing_party_type, alleged_violation_type, alleged_units, earliest_violation_date, served_at]
    output: NoticeOfViolation
    side_effects:
      - "computes cure_deadline_at = served_at + 60 days"
      - "sets status to RECEIVED and increments Product.open_notice_count"
      - "recomputes Product.compliance_posture to ENFORCEMENT_HOLD (posture ladder clause 1 outranks every other clause)"
      - "increments Product.version by 1"

  - method: POST
    path: "/notices/{notice_id}/transitions"
    description: |
      Notice lifecycle: EVALUATE (computes cure_eligible), ELECT_CURE, COMPLETE_CURE,
      ABANDON_CURE, ESCALATE, DISMISS and LITIGATE. The fork at UNDER_EVALUATION leads either to
      the cure branch or straight to settlement negotiation; CURE_FAILED rejoins the settlement
      branch through ESCALATE.
    roles: [RegulatoryCounsel]
    code: 200
    input: [action, "evaluation_note?"]
    output: NoticeOfViolation
    side_effects:
      - "EVALUATE: runs cure_evaluation and stores cure_eligible"
      - "ELECT_CURE: refused with ERR_CURE_NOT_AVAILABLE when cure_eligible is false or null; on success sets cure_attempted to true permanently, which is what keeps MITIGATION_CURE applicable to a settlement created after the branch rejoins negotiation"
      - "COMPLETE_CURE: stamps cure_completed_at, refused with ERR_CURE_WINDOW_CLOSED after cure_deadline_at"
      - "DISMISS/COMPLETE_CURE: decrements Product.open_notice_count and recomputes Product.compliance_posture"
      - "LITIGATE: VOIDs every PROPOSED or COUNTERED Settlement of this notice"
      - "increments NoticeOfViolation.version by 1 and Product.version by 1"

  - method: POST
    path: "/notices/{notice_id}/settlements"
    description: |
      Propose a settlement. The whole money waterfall (violation_days, base_penalty_cents,
      mitigation_factor, adjusted_penalty_cents, fee_cap_cents, allowed_fees_cents,
      state_share_cents, noticing_party_share_cents, total_settlement_cents) is computed in the
      pinned order penalty -> cap -> fees. Optimistic concurrency: expected_notice_version must
      equal the notice's current version.
    roles: [RegulatoryCounsel]
    code: 201
    input: [requested_attorney_fees_cents, "reformulation_commitment?", expected_notice_version]
    output: Settlement
    side_effects:
      - "runs settlement_money against the notice, its product's warranty posture and the cure branch actually taken"
      - "VOIDs any PROPOSED or COUNTERED Settlement of the same notice"
      - "stamps proposed_by_user_id from X-User-ID and sets status to PROPOSED with round_count 0"
      - "increments NoticeOfViolation.version by 1"

  - method: POST
    path: "/settlements/{settlement_id}/transitions"
    description: |
      Negotiation lifecycle: COUNTER (may restate requested_attorney_fees_cents and
      reformulation_commitment), REVISE, ACCEPT_EXECUTE and VOID. ACCEPT_EXECUTE must be performed
      by someone other than the proposer. VOID is the compensating action: it reverses every side
      effect ACCEPT_EXECUTE applied.
    roles: [RegulatoryCounsel]
    code: 200
    input: [action, "requested_attorney_fees_cents?", "reformulation_commitment?"]
    output: Settlement
    side_effects:
      - "COUNTER/REVISE: increments round_count (ceiling 3) and re-runs settlement_money from step 3 onward, keeping the frozen violation_days"
      - "ACCEPT_EXECUTE: stamps executed_by_user_id and executed_at, moves the notice to SETTLED, decrements Product.open_notice_count, adds adjusted_penalty_cents to Product.accrued_penalty_cents and recomputes Product.compliance_posture"
      - "VOID: returns the notice to SETTLEMENT_NEGOTIATION, restores Product.open_notice_count, subtracts the same adjusted_penalty_cents from Product.accrued_penalty_cents so no drift remains, and recomputes Product.compliance_posture"
      - "increments Settlement.version by 1, NoticeOfViolation.version by 1 and Product.version by 1"

  - method: POST
    path: "/reformulation-projects"
    description: |
      Open a project to bring one material/chemical concentration below the safe harbor level.
      The planned window is HALF-OPEN, so a project starting exactly when another ends is not an
      overlap - the deliberate counterpart to WarningPlacement's closed windows.
    roles: [ComplianceAnalyst]
    code: 201
    input: [product_id, chemical_id, material_chemical_id, target_concentration_ppm, planned_start_date, planned_end_date]
    output: ReformulationProject
    side_effects:
      - "captures baseline_daily_exposure_ug from the newest FINAL ExposureAssessment for (product_id, chemical_id)"
      - "sets status to PLANNED"

  - method: POST
    path: "/reformulation-projects/{reformulation_project_id}/transitions"
    description: |
      Project lifecycle: START, SUBMIT_VERIFICATION, REWORK, COMPLETE and ABANDON.
      SUBMIT_VERIFICATION rewrites the linked MaterialChemical's declared concentration to
      target_concentration_ppm, recomputes exposure and refuses with
      ERR_TARGET_NOT_BELOW_THRESHOLD unless the result is strictly below the safe harbor level.
    roles: [ComplianceAnalyst]
    code: 200
    input: [action]
    output: ReformulationProject
    side_effects:
      - "SUBMIT_VERIFICATION: sets the linked MaterialChemical's declared_concentration_ppm to target_concentration_ppm, resets that link's measurement_basis to SUPPLIER_DECLARED and its status to DECLARED, stamps verified_daily_exposure_ug and reduction_pct, supersedes the product's FINAL assessments for this chemical, REVOKEs an APPROVED WarningDetermination built on one of those assessments (flagging its IMPLEMENTED/VERIFIED placements NON_COMPLIANT), and recomputes Product.total_listed_chemical_load_ug and compliance_posture"
      - "COMPLETE: leaves the rewritten concentration in place permanently"
      - "increments ReformulationProject.version by 1, MaterialChemical.version by 1 and Product.version by 1"

  # =========================================================================
  # TEST-DRIVING ENDPOINT (outside the business surface, inside the contract)
  # =========================================================================
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the server's logical clock to any instant. Every deadline, window and stamped timestamp
      in this API reads this clock, never wall-clock time. Before the first call the clock reads
      exactly 2026-08-01T00:00:00Z, which sits at or before every default fixture date, so an
      unset clock is a fixed well-defined earliest instant rather than a drifting value.
    roles: [RegistryAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "no stored entity is modified; subsequent cure-window, warranty-window, placement-window and reformulation-window evaluations read the new instant"

errors:
  # ---- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is absent, unknown, or not listed in the target endpoint's roles"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or null, a field has the wrong JSON type, an enum value is not a declared member, or distribution_channels is empty"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is below 1 or above 200, or offset is negative"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "a numeric input is negative, or zero where the domain requires a strictly positive value (concentrations, quantities, uses_per_day, label_area_sq_in, cents amounts, safe harbor levels)"
  - id: ERR_INVALID_CAS_NUMBER
    http: 422
    condition: "cas_number does not match the CAS registry pattern ^[0-9]{2,7}-[0-9]{2}-[0-9]$"
  - id: ERR_SAFE_HARBOR_BASIS_MISMATCH
    http: 422
    condition: "safe_harbor_basis and safe_harbor_level_ug_per_day disagree (NSRL/MADL without a level, or NONE with a level), or the basis contradicts the endpoint_type (CANCER with MADL, a reproductive endpoint with NSRL)"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "an interval end is not strictly after its start, or a notice's earliest_violation_date is after served_at, or served_at is in the future relative to the logical clock"
  - id: ERR_UNKNOWN_ACTION
    http: 400
    condition: "the `action` supplied to a transitions endpoint is not a declared trigger for that entity"
  - id: ERR_FIELD_NOT_WRITABLE
    http: 422
    condition: "a request body supplies a field whose source is computed or system (for example lifecycle_state, compliance_posture, daily_exposure_ug, warning_text, cure_deadline_at, adjusted_penalty_cents)"

  # ---- referential --------------------------------------------------------
  - id: ERR_NOT_FOUND
    http: 404
    condition: "an id in the URL path or in the request body does not resolve to a stored row of the expected entity, including as_of_notice_id naming a notice that belongs to a different product"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "chemical_name, sku or legal_name is already taken, or the (material_id, chemical_id) link or the ACTIVE (product_id, material_id) component pair already exists"
  - id: ERR_MATERIAL_CYCLE
    http: 422
    condition: "parent_material_id names the material itself or one of its own descendants, or the resulting bom_depth would exceed 4"
  - id: ERR_REFORMULATION_LINK_MISMATCH
    http: 422
    condition: "the reformulation project's material_chemical_id points at a link for a different chemical, or at a material that is not behind any ACTIVE component of the project's product"

  # ---- concurrency --------------------------------------------------------
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not match the Product's current version on POST /warning-determinations"
  - id: ERR_STALE_NOTICE_VERSION
    http: 412
    condition: "expected_notice_version does not match the NoticeOfViolation's current version on POST /notices/{notice_id}/settlements"

  # ---- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not a declared transition out of the entity's current state, including any action attempted from a terminal state"
  - id: ERR_PARENT_STATE_FORBIDS_WRITE
    http: 409
    condition: "a child write is attempted under a parent in a blocking state: a DISCONTINUED product, a WITHDRAWN chemical, or a determination that is not APPROVED"
  - id: ERR_ENTITY_IMMUTABLE
    http: 409
    condition: "a PATCH targets a DISCONTINUED product or a REMOVED/SUPERSEDED component"
  - id: ERR_ENFORCEMENT_HOLD_FREEZE
    http: 409
    condition: "a bill-of-materials write is attempted while the product's compliance_posture is ENFORCEMENT_HOLD"
  - id: ERR_PRODUCT_ON_ENFORCEMENT_HOLD
    http: 409
    condition: "MARKET is requested while compliance_posture is ENFORCEMENT_HOLD or EXPOSURE_UNKNOWN"

  # ---- exposure assessment safety ----------------------------------------
  - id: ERR_NO_ACTIVE_COMPONENTS
    http: 409
    condition: "SUBMIT is requested on an assessment whose product has no ACTIVE components, so the exposure sum would be over the empty set"
  - id: ERR_LAB_RESULT_MISSING
    http: 409
    condition: "a LAB_TESTED assessment is submitted while some contributing link is not on a LAB_TESTED basis or lacks lab_result_ppm / lab_loq_ppm"
  - id: ERR_SUPPLIER_DATA_INCOMPLETE
    http: 409
    condition: "a LAB_TESTED assessment is submitted while a contributing material's disclosure_status is REFUSED and no naturally-occurring claim is on file"
  - id: ERR_PEER_REVIEW_REQUIRED
    http: 409
    condition: "FINALIZE is requested on an assessment with no reviewed_by_user_id"
  - id: ERR_REJECTION_LIMIT_REACHED
    http: 409
    condition: "REJECT is requested on an assessment whose rejection_count is already 2"
  - id: ERR_CHEMICAL_NOT_LISTED
    http: 409
    condition: "an exposure assessment is opened for a chemical whose status is not LISTED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-Id already performed the incompatible earlier step (submitter peer-reviewing, preparer approving, proposer executing)"

  # ---- warning determination and placement -------------------------------
  - id: ERR_NO_QUALIFYING_EXPOSURE
    http: 409
    condition: "a WARNING_REQUIRED determination is requested but no FINAL assessment of the product is AT_OR_ABOVE_SAFE_HARBOR or NO_SAFE_HARBOR, so the named-chemical selector would return the empty set"
  - id: ERR_EXPOSURE_ABOVE_SAFE_HARBOR
    http: 409
    condition: "a NO_WARNING_REQUIRED determination is requested while a FINAL assessment of the product is AT_OR_ABOVE_SAFE_HARBOR or NO_SAFE_HARBOR"
  - id: ERR_BASIS_ASSESSMENT_NOT_FINAL
    http: 409
    condition: "the determination's assessment_id names an assessment that is not FINAL or that belongs to a different product"
  - id: ERR_OPEN_DETERMINATION_EXISTS
    http: 409
    condition: "the product already has a determination in DRAFT or PENDING_APPROVAL"
  - id: ERR_DETERMINATION_NOT_APPROVED
    http: 409
    condition: "a placement is created against a determination whose status is not APPROVED (DRAFT, PENDING_APPROVAL, REVOKED or SUPERSEDED)"
  - id: ERR_CHANNEL_NOT_REQUIRED
    http: 422
    condition: "the placement's channel is not a member of the determination's computed required_channels"
  - id: ERR_PLACEMENT_OVERLAP
    http: 409
    condition: "the new placement's closed effective window intersects an existing non-NON_COMPLIANT placement of the same determination on the same channel, including the touching case new.effective_from == existing.effective_to"

  # ---- notices and cure --------------------------------------------------
  - id: ERR_CURE_NOT_AVAILABLE
    http: 409
    condition: "ELECT_CURE is requested while cure_eligible is false or has not been computed yet"
  - id: ERR_CURE_WINDOW_CLOSED
    http: 409
    condition: "COMPLETE_CURE is requested strictly after cure_deadline_at (the instant equal to the deadline is still inside the window)"
  - id: ERR_NOTICE_NOT_NEGOTIABLE
    http: 409
    condition: "a settlement is proposed against a notice whose status is not SETTLEMENT_NEGOTIATION"

  # ---- settlement money --------------------------------------------------
  - id: ERR_OPEN_SETTLEMENT_EXISTS
    http: 409
    condition: "the notice already has a settlement in PROPOSED, COUNTERED or EXECUTED"
  - id: ERR_SETTLEMENT_ROUND_LIMIT
    http: 409
    condition: "COUNTER or REVISE is requested on a settlement whose round_count is already 3"
  - id: ERR_FEE_REQUEST_EXCEEDS_CEILING
    http: 422
    condition: "requested_attorney_fees_cents exceeds the absolute request ceiling of 5000000 cents"
  - id: ERR_NO_VIOLATION_WINDOW
    http: 422
    condition: "the computed violation_days is zero or negative at settlement create time, so there is no penalty window to price"
  - id: ERR_INDEMNITY_CAP_EXCEEDED
    http: 409
    condition: "ACCEPT_EXECUTE is requested on a warranty-mitigated settlement whose adjusted_penalty_cents exceeds the summed indemnity_cap_cents of the suppliers behind the product's ACTIVE components"
  - id: ERR_SETTLEMENT_NOT_VOIDABLE
    http: 409
    condition: "VOID is requested on a reformulation-mitigated settlement whose product already has a COMPLETED ReformulationProject for the notice's chemical, so the promised consideration has already been delivered"

  # ---- warranty and reformulation ----------------------------------------
  - id: ERR_WARRANTY_IN_USE
    http: 409
    condition: "REVOKE_WARRANTY is requested while the warranty window still covers the served_at of a notice under evaluation or in settlement negotiation"
  - id: ERR_TARGET_NOT_BELOW_THRESHOLD
    http: 422
    condition: "the reformulation target is not strictly below the current concentration at create time, or the verified exposure is not strictly below the chemical's safe harbor level at SUBMIT_VERIFICATION"
  - id: ERR_REFORMULATION_OVERLAP
    http: 409
    condition: "the new project's half-open planned window intersects an existing non-terminal project on the same (product_id, chemical_id); the touching case new.planned_start_date == existing.planned_end_date is NOT an overlap"

roles:
  - name: RegistryAdmin
    description: "Maintains the listed-chemical registry, the product catalog and the logical clock. Owns both registry lifecycles but may not touch exposure science, labelling or enforcement."
    identity: "opaque"
    exclusive_operations:
      - "POST /listed-chemicals"
      - "POST /listed-chemicals/{chemical_id}/transitions (LIST, WITHDRAW, DELIST, RELIST, REVISE_SAFE_HARBOR)"
      - "POST /products"
      - "PATCH /products/{product_id}"
      - "POST /products/{product_id}/transitions (MARKET, DISCONTINUE)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET except GET /warning-placements* is shared with the analyst and counsel roles"
      - "GET /products/{product_id}/compliance-summary"

  - name: ComplianceAnalyst
    description: "Builds and maintains the chemical inventory: suppliers, materials, the bill of materials, supplier data collection, laboratory requests and reformulation projects. Prepares exposure assessments but can never review or finalize them."
    identity: "opaque"
    exclusive_operations:
      - "POST /suppliers"
      - "POST /materials"
      - "PATCH /materials/{material_id}"
      - "POST /products/{product_id}/components"
      - "PATCH /product-components/{component_id}"
      - "POST /product-components/{component_id}/transitions (REMOVE)"
      - "POST /products/{product_id}/exposure-assessments"
      - "POST /reformulation-projects"
      - "POST /reformulation-projects/{reformulation_project_id}/transitions (START, SUBMIT_VERIFICATION, REWORK, COMPLETE, ABANDON)"
    shared_operations:
      - "POST /materials/{material_id}/disclosure (with SupplierPortalUser)"
      - "POST /materials/{material_id}/chemicals (with SupplierPortalUser)"
      - "POST /material-chemicals/{material_chemical_id}/transitions - REQUEST_TEST and REPORT_RESULT only (with ToxicologyReviewer)"
      - "POST /exposure-assessments/{assessment_id}/transitions - SUBMIT and REOPEN only (with ToxicologyReviewer)"
      - "reads across chemicals, suppliers, materials, products, assessments, determinations, placements, notices, settlements and projects"
      - "GET /products/{product_id}/compliance-summary"

  - name: ToxicologyReviewer
    description: "Independent scientific reviewer. Peer-reviews, rejects and finalizes exposure assessments and adjudicates disputed laboratory results. Cannot create the assessments it reviews, and cannot review its own submission."
    identity: "opaque"
    exclusive_operations:
      - "POST /exposure-assessments/{assessment_id}/transitions - PEER_REVIEW, REJECT and FINALIZE"
      - "POST /material-chemicals/{material_chemical_id}/transitions - VERIFY and DISPUTE"
    shared_operations:
      - "POST /exposure-assessments/{assessment_id}/transitions endpoint access (with ComplianceAnalyst, action-scoped)"
      - "POST /material-chemicals/{material_chemical_id}/transitions endpoint access (with ComplianceAnalyst, action-scoped)"
      - "reads across chemicals, materials, links, products, components, assessments, determinations and projects"
      - "GET /products/{product_id}/compliance-summary"

  - name: LabelingSpecialist
    description: "Prepares warning determinations and implements the resulting placements across label, catalog, internet point-of-sale and posted-sign channels. Cannot approve its own determination and cannot verify its own placement."
    identity: "opaque"
    exclusive_operations:
      - "POST /warning-determinations"
      - "POST /warning-determinations/{determination_id}/transitions - SUBMIT_FOR_APPROVAL"
      - "POST /warning-determinations/{determination_id}/placements"
      - "POST /warning-placements/{placement_id}/transitions - IMPLEMENT and REMEDIATE"
    shared_operations:
      - "POST /warning-determinations/{determination_id}/transitions endpoint access (with RegulatoryCounsel, action-scoped)"
      - "POST /warning-placements/{placement_id}/transitions endpoint access (with RegulatoryCounsel, action-scoped)"
      - "reads across chemicals, products, assessments, determinations and placements"

  - name: RegulatoryCounsel
    description: "Owns approval, enforcement and money. Approves and revokes determinations, verifies placements, executes and revokes supplier warranties, intakes notices, runs the cure evaluation, and negotiates, executes and voids settlements. Never touches the inventory it is defending."
    identity: "opaque"
    exclusive_operations:
      - "POST /suppliers/{supplier_id}/transitions (EXECUTE_WARRANTY, REVOKE_WARRANTY)"
      - "POST /warning-determinations/{determination_id}/transitions - APPROVE, RETURN_FOR_REVISION and REVOKE"
      - "POST /warning-placements/{placement_id}/transitions - VERIFY and FLAG_NON_COMPLIANT"
      - "POST /notices"
      - "POST /notices/{notice_id}/transitions (EVALUATE, ELECT_CURE, COMPLETE_CURE, ABANDON_CURE, ESCALATE, DISMISS, LITIGATE)"
      - "POST /notices/{notice_id}/settlements"
      - "POST /settlements/{settlement_id}/transitions (COUNTER, REVISE, ACCEPT_EXECUTE, VOID)"
    shared_operations:
      - "POST /warning-determinations/{determination_id}/transitions endpoint access (with LabelingSpecialist, action-scoped)"
      - "POST /warning-placements/{placement_id}/transitions endpoint access (with LabelingSpecialist, action-scoped)"
      - "reads across every entity"
      - "GET /products/{product_id}/compliance-summary"

  - name: SupplierPortalUser
    description: |
      A supplier acting on its own behalf through the data-collection portal. X-User-ID is the id of
      the Supplier row. It may only file disclosure responses and declare chemical content for
      materials whose supplier_id equals its own X-User-ID, and may read only supplier-facing
      resources - it can see no product, assessment, determination, notice or settlement at all.
    identity: "entity_backed:Supplier"
    exclusive_operations: []
    shared_operations:
      - "POST /materials/{material_id}/disclosure - RECORD_RESPONSE only, and only for its own materials (with ComplianceAnalyst)"
      - "POST /materials/{material_id}/chemicals - only for its own materials (with ComplianceAnalyst)"
      - "GET /suppliers/{supplier_id}, GET /materials, GET /materials/{material_id}, GET /material-chemicals, GET /material-chemicals/{material_chemical_id}"
