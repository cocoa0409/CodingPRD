  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_proposal_create_stale_project_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[proposal-create-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one superseding proposal create bumps Project.version, a second create still carrying the old expected_project_version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A DRAFT project; one proposal created (project version advanced from v0 to v1)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C37", email: "c37@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 1.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
          trigger:
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 2.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

