        grounds:
          - validations.priority_6.ERR_ELECTION_POSTURE_FORBIDS
          - state_machines.Election.RECEIVING_to_CANVASS_LOCKED
          - endpoints.POST_/vote-by-mail/return-envelopes
        distinguishing_aspect: |
          Entity pair ReturnEnvelope x Election: whether an envelope may be logged at all depends on a
          state that lives on the grandparent election, not on any field of the envelope or its packet.
          The very same intake call succeeds in posture RECEIVING and is refused once the election reaches
          CANVASS_LOCKED, with nothing about the request changing.
