              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: false }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
              captures: { comp0: $.data.composite_score, st0: $.data.status }
          trigger:
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "ON_TIME_COMPLETION", occurred_at: "2026-08-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "LATE_COMPLETION", occurred_at: "2026-08-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_MINOR", occurred_at: "2026-08-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: ServiceManager
              captures: { comp3: $.data.composite_score, st3: $.data.status }
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_MAJOR", occurred_at: "2026-08-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: ServiceManager
              captures: { q4: $.data.quality_score, t4: $.data.timeliness_score, s4: $.data.satisfaction_score, comp4: $.data.composite_score, st4: $.data.status, ec4: $.data.rolling_event_count, elig4: $.data.removal_eligible }
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "ON_TIME_COMPLETION", occurred_at: "2026-08-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: ServiceManager
              captures: { q5: $.data.quality_score, t5: $.data.timeliness_score, s5: $.data.satisfaction_score, comp5: $.data.composite_score, st5: $.data.status }
          assert:
            - "${comp0} == 85.00 AND ${st0} == 'ACTIVE'"
            - "${comp3} == 83.20 AND ${st3} == 'ACTIVE' — three events give quality 84.00, timeliness 83.00, satisfaction 82.00 and 37.80 + 24.90 + 20.50 = 83.20, still above the ceiling"
            - "${q4} == 76.00 AND ${t4} == 81.00 AND ${s4} == 78.00 AND ${comp4} == 78.00 — 34.20 + 24.30 + 19.50, landing exactly on PROBATION_COMPOSITE_MAX"
            - "${st4} == 'PROBATION' AND ${ec4} == 4 — the ceiling is inclusive and the four events clear MIN_EVENTS_FOR_ACTION"
            - "${elig4} == false — 78.00 is still above REMOVAL_COMPOSITE_MAX 70.00, so probation is not removal"
            - "${q5} == 78.00 AND ${t5} == 87.00 AND ${s5} == 79.00 AND ${comp5} == 80.95 AND ${st5} == 'ACTIVE' — strictly above 78.00 resets the installer"

      - name: five_hop_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.PunchListItem.status
          - state_machines.Installer.status
        distinguishing_aspect: "A single escalation must ripple through punch item, project, scorecard event, installer score and installer status in one request, with every hop observable."
        excluded_because:
          difficulty_instance: "transitive_cascade / safety_punch_escalation_cascades_five_hops_to_installer_probation"
          rationale: "That instance walks all five hops of the escalation chain and asserts each one, including the ordering sensitivity that makes the last hop depend on the recomputed score; a second end-to-end cascade test would add no distinct claim."
        
      - name: both_calculation_variants_are_asserted_on_one_dataset
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.project_labor_charge
          - calculations.installer_scorecard
        distinguishing_aspect: "Each dual-variant calculation must produce two different, independently asserted numbers from the same stored rows, with the delta between them pinned."
        excluded_because:
          difficulty_instance: "dual_variant_calc / project_labor_charge_provisional_versus_final_diverge_on_same_project"
          rationale: "That instance (with its sibling installer_scorecard_rolling_window_versus_lifetime_decay_diverge) asserts both variants of both calculations on one dataset and pins the delta, which is exactly this layer's claim."

  # ==========================================================================
  # SECTION — consistency_model  (complexity_profile.consistency_model: immediate)
  # ==========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_final_in_the_writing_response_itself
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - endpoints[POST /projects]
          - endpoints[POST /installers/{id}/scorecard-events]
          - endpoints[GET /installers/{id}]
        distinguishing_aspect: "Nothing lags: the project-creation 201 already carries the computed quote, deposit and permit fields, and a scorecard event's recomputation is visible in the installer row on the very next read with no second write, no polling and no delay — the immediate model forbids any 'eventually correct' denormalised field."
        test_recipe:
          setup:
            - "One ACTIVE installer in METRO-01 (labor_complexity_multiplier 1.15, permit_unit_threshold 250.00, FLOORING a permit trade) plus a customer, so one create can be observed against one immediate read."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-QUICK", name: "Quick-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "22 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, w_quoted: $.data.quoted_labor_cents, w_dep: $.data.deposit_required_cents, w_units: $.data.effective_units, w_resp: $.data.permit_responsibility, w_ps: $.data.permit_status, w_total: $.data.total_due_cents }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectCoordinator
              captures: { r_quoted: $.data.quoted_labor_cents, r_dep: $.data.deposit_required_cents, r_units: $.data.effective_units, r_resp: $.data.permit_responsibility, r_ps: $.data.permit_status, r_total: $.data.total_due_cents }
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-08-01T00:00:00.000Z", csat_score: 1 }
              as: ServiceManager
              captures: { ev_q: $.data.quality_delta, ev_t: $.data.timeliness_delta, ev_s: $.data.satisfaction_delta }
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: ServiceManager
              captures: { i_sat: $.data.satisfaction_score, i_comp: $.data.composite_score, i_ec: $.data.rolling_event_count }
          assert:
            - "${w_quoted} == 196673 AND ${w_dep} == 59002 AND ${w_units} == 420.00 AND ${w_resp} == 'RETAILER' AND ${w_ps} == 'PENDING_APPLICATION' AND ${w_total} == 0"
            - "${r_quoted} == ${w_quoted} AND ${r_dep} == ${w_dep} AND ${r_units} == ${w_units} AND ${r_resp} == ${w_resp} AND ${r_ps} == ${w_ps} AND ${r_total} == ${w_total} — the write response and the immediate read are identical, field for field"
            - "${ev_q} == 0.00 AND ${ev_t} == 0.00 AND ${ev_s} == -10.00 — the event row froze its own deltas"
            - "${i_sat} == 75.00 AND ${i_comp} == 82.50 AND ${i_ec} == 1 — 85.00*0.45 + 85.00*0.30 + 75.00*0.25 = 38.25 + 25.50 + 18.75 = 82.50, already recomputed by the time the next request is served"
