      - name: po_cancel_cascades_lines_and_committed
        claim_type: cascade_down
        grounds: [state_machines.PurchaseOrder, state_machines.POLine.OPEN_to_CANCELLED, calculations.budget_line_variance]
        distinguishing_aspect: "Cancelling an ISSUED PO cascades to its lines (OPEN -> CANCELLED) and the committed ledger syncs back to zero on the category budget line."
        test_recipe:
          setup: ["Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec awarded; PO ISSUED with line 40 x 15000c (committed 600000c)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S12", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
