            - call: "GET /ria/accounts?household_id=${h_id}&account_status=OPEN"
              as: AdvisorOperationsLead
            - call: "GET /ria/accounts?household_id=${h_id}&account_status=PENDING"
              as: AdvisorOperationsLead
          assert:
            - "the first page returns 2 rows with total_count 4 and has_more true"
            - "the second page returns 2 rows with total_count 4 and has_more false"
            - "the OPEN filter returns exactly 3 rows and the PENDING filter returns exactly 1 row"
            - "HouseholdAccount.${a4_id}.account_status == PENDING and it appears only in the PENDING filter"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: corner_cascade_chain_covered_by_difficulty_index
        claim_type: pending
        grounds: [state_machines.AdvisorFirm.OPEN_to_LIMITED]
        excluded_because:
          difficulty_instance: custody_evidence_deficiency_four_hop_cascade
          rationale: "The depth-4 posture cascade is asserted hop by hop by the named §1.8 instance, so this corner is a stub."

      - name: immediate_consistency_cascade_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.advisory_fee_household_aggregation
          - calculations.household_fee_basis
        distinguishing_aspect: "The model is immediate: the response to the transfer credit already reflects the recomputed Household.household_fee_basis_cents, and a follow-up household read returns the identical value with no lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement, granted TRADING_AUTHORIZATION and BILLING, one household with one OPEN account."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
            - *z_ent_tr_grant
            - call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "BILLING", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_bil_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_bil_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_id: $.data.id }
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4000000000, sent_cost_basis_cents: 90000000, lot_inventory_date: "2019-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
              captures: { acct_basis_in_response: $.data.carryover_cents }
          trigger:
            - call: "GET /ria/households/${h_id}"
              as: AdvisorOperationsLead
          assert:
            - "the mark-received response already carries the credited carryover_cents 90000000"
            - "the immediately following household read returns household_fee_basis_cents 100000000 with no delay"
            - "Household.${h_id}.household_annual_fee_cents is already non-zero on the same read"
            - "a second identical household read returns the identical values, proving no asynchronous lag"

      - name: housekeeping_confirmation_that_no_compensation_path_is_required
        claim_type: saga
        grounds:
          - complexity_profile.consistency_model
          - state_machines.FeeBillingRun.SETTLED_to_INVOICE_MISMATCH
          - state_machines.FeeBillingRun.INVOICE_MISMATCH_to_REOPENED
        distinguishing_aspect: "The scaffold is explicitly immediate rather than saga: a failed invoice remittance is not compensated inline, it is recorded as INVOICE_MISMATCH and reversed by the explicit reopen transition, so no hidden rollback is expected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted BILLING, one household with 200000000 cents of basis and a settled run."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_bil
            - call: "POST /ria/firm-entitlements/${ent_bil_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_id: $.data.id }
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 8000000000, sent_cost_basis_cents: 100000000, lot_inventory_date: "2019-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/billing-runs"
              payload: { firm_id: "${f_id}", household_id: "${h_id}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z", fee_variant_used: "HOUSEHOLD_AGGREGATED", stated_invoice_cents: 588384 }
              as: AdvisorOperationsLead
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /ria/billing-runs/${br_id}/remit-invoice"
              payload: { stated_invoice_cents: 999999 }
              as: AdvisorOperationsLead
            - call: "POST /ria/billing-runs/${br_id}/reopen"
              payload: {}
              as: ComplianceReviewer
          assert:
            - "the mismatched remittance does not fail the request; it returns 200 with billing_run_status INVOICE_MISMATCH"
            - "Household.${h_id}.household_status == BILLING_HELD while the run is mismatched"
            - "no automatic compensation occurred: FeeBillingRun.${br_id}.gross_fee_cents is unchanged at 588384"
            - "the explicit reopen moves the run to REOPENED and household_status back to ACTIVE"
            - "FeeBillingRun.${br_id}.credit_applied_cents is 0 in both states because no credits exist"
