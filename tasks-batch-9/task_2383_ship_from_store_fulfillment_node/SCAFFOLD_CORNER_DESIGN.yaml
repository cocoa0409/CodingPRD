              payload: { package_type: "MEDIUM_BOX" }
              as: StoreAssociate
              as_user_id: "${s1}"
          assert:
            - "${e_zero} == ERR_ZERO_PICK_NOT_ALLOWED with HTTP 422: picked_units 0 satisfies the priority-3 shape rule (picked_units >= 0) and the priority-44 arithmetic (0 == sum(line_picks)), so the dedicated zero-pick rule is the one that must fire"
            - "${e_over} == ERR_PICK_UNITS_INVALID with HTTP 422 (picked_units 3 > assigned_units 2)"
            - "${e_sum} == ERR_PICK_UNITS_INVALID with HTTP 422 (sum(line_picks[].units_picked) == 1 != picked_units 2)"
            - "${e_missing_line} == ERR_ASSIGNMENT_LINE_NOT_FOUND with HTTP 404: the priority-5 body foreign-key rule outranks the priority-48 ownership rule, so an unresolvable assignment_line_id is a 404 and never a mismatch 409"
            - "${e_foreign_line} == ERR_ASSIGNMENT_LINE_MISMATCH with HTTP 409: ${al2} resolves but belongs to FulfillmentAssignment.${a2}, and the priority-44 arithmetic passes (1 <= 2 assigned and sum 1 == picked_units 1) so only the ownership rule can catch it"
            - "every one of the five refusals is inert: FulfillmentAssignment.${a1}.status == ACCEPTED, version == 2, picked_units == 0 and AssignmentLine.${al1}.units_picked == 0 immediately before the sixth call"
            - "the corrected pick returns HTTP 200 with FulfillmentAssignment.${a1}.status == PICKED, picked_units == 2, shortfall_units == 0 and version == 3, and AssignmentLine.${al1}.units_picked == 2"
            - "${e_small} == ERR_PACKAGE_TYPE_TOO_SMALL with HTTP 422: PACKAGE_RANK[SMALL_BOX] 2 < PACKAGE_RANK[MEDIUM_BOX] 3, where MEDIUM_BOX is FulfillmentAssignment.${a1}.derived_package_type from SKU-A's MEDIUM package_class"
            - "the too-small pack is refused on rank and not on depletion: PackagingSupply.${pk_s}.on_hand_units is still 3, lifetime_consumed_units == 0 and version == 1, so ERR_PACKAGING_DEPLETED (priority 42) could not have pre-empted priority 43"
            - "the MEDIUM_BOX pack returns HTTP 200 with FulfillmentAssignment.${a1}.status == PACKED, package_type == MEDIUM_BOX, version == 4 and labor_minutes_actual == 0 because the logical clock never advanced past accepted_at"
            - "exactly one unit is consumed by the successful pack: PackagingSupply.${pk_m}.on_hand_units == 3, lifetime_consumed_units == 1, reorder_flag == false (3 > reorder_point 1) and version == 2"

      - name: accept_is_refused_at_the_pick_deadline_instant_and_allowed_one_second_before
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PICK_DEADLINE_PASSED
          - validations.priority 31
          - calculations.assignment_pick_deadline
        distinguishing_aspect: "The deadline rule is strictly `now < pick_deadline_utc`, so accepting at 12:59:59Z succeeds while accepting the sibling assignment one second later at exactly 13:00:00Z is refused - and the refusal is the deadline code, not the cutoff code, because the node's 17:00Z cutoff is still hours away."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z."
            - "Node S1 (cutoff_utc_minutes 1020 = 17:00Z) holds two committed A x 2 assignments created at 09:00:00Z, so both carry pick_deadline_utc 2026-08-03T13:00:00Z = min(09:00 + PICK_SLA_MINUTES 240, the 17:00Z cutoff instant)."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
