          assert:
            - "DrawApplication.${da_id}.status == AWARDED"
            - "License.${da_id}.issued_license_id is an ISSUED License with issued_via == DRAW_AWARD"
            - "Applicant.${w_id}.preference_points == 0"

      - name: replacement_depth2_cascade_void_relink_harvest
        grounds:
          - state_machines.License.ISSUED_to_VOIDED
          - state_machines.HarvestReport.SUBMITTED_to_ACCEPTED
          - entities.HarvestReport.fields.license_id
          - entities.Replacement.fields.replacement_license_id
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /replacements): (1) the
          replacement voids the original License, (2) the void re-links the
          original's SUBMITTED HarvestReport to the replacement License — the
          re-link is caused by the void, not by the replacement call directly.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; ELK season SEAS OPEN, draw_required false, bag_limit 2."
            - "TAG product P_tag bound to SEAS, residency ANY, requires_education false."
            - "Resident A_res holds ISSUED TAG L_orig with one SUBMITTED HarvestReport HR (quantity 1, harvest within season window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 2, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_orig_id: $.data.id }
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_orig_id}", harvest_datetime: "2026-09-15T08:00:00Z", quantity: 1 }
              as: Applicant
              as_user_id: "${a_res_id}"
              captures: { hr_id: $.data.id }
          trigger:
            - call: "POST /replacements"
              payload: { original_license_id: "${l_orig_id}", reason: "LOST" }
              as: LicenseAgent
              captures: { repl_id: $.data.id, repl_lic_id: $.data.replacement_license_id }
          assert:
            - "License.${l_orig_id}.status == VOIDED"
            - "HarvestReport.${hr_id}.license_id == ${repl_lic_id}"
            - "HarvestReport.${hr_id}.status == SUBMITTED"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  #   (1) business_referential (DRAW_REQUIRED, prio6) beats business_safety (EDUCATION, prio7)
  #   (2) business_safety (EDUCATION, prio7) beats business_referential (RESIDENCY, prio9)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draw_required_beats_education_required
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_DRAW_REQUIRED]
          - errors[ERR_EDUCATION_REQUIRED]
        distinguishing_aspect: |
          Pair = business_referential(prio6 ERR_DRAW_REQUIRED) vs
          business_safety(prio7 ERR_EDUCATION_REQUIRED). A draw_required TAG that
          also requires_education, issued OTC to an un-educated applicant, must
          return ERR_DRAW_REQUIRED (the lower-priority-number check wins).
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z; ELK season SEAS OPEN, draw_required true, bag_limit 1."
            - "TAG product P_tag bound to SEAS, requires_education TRUE, residency ANY."
            - "Resident applicant A_res with NO education certificate (education_certified false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-EDU", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", requires_education: true, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_DRAW_REQUIRED"

      - name: education_required_beats_residency_restricted
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_EDUCATION_REQUIRED]
          - errors[ERR_RESIDENCY_RESTRICTED]
        distinguishing_aspect: |
          Pair = business_safety(prio7 ERR_EDUCATION_REQUIRED) vs
          business_referential(prio9 ERR_RESIDENCY_RESTRICTED). An OTC LICENSE that
          is RESIDENT_ONLY and requires_education, issued to a NONRESIDENT with no
          education cert, must return ERR_EDUCATION_REQUIRED (prio7 < prio9).
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z."
            - "LICENSE product P_lic (residency_restriction RESIDENT_ONLY, requires_education TRUE, base_fee_cents 4500, no bound season)."
            - "Nonresident applicant A_nr (residency APPROVED NONRESIDENT), no education cert."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "LIC-HUNT", product_kind: "LICENSE", base_fee_cents: 4500, requires_education: true, residency_restriction: "RESIDENT_ONLY" }
              as: DrawOfficer
              captures: { p_lic_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A NR", birth_date: "1980-01-01", declared_state_code: "CA" }
              as: DrawOfficer
              captures: { a_nr_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_nr_id}", proof_type: "UTILITY_BILL", proof_state_code: "OR", continuous_months: 1 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /licenses"
              payload: { applicant_id: "${a_nr_id}", license_product_id: "${p_lic_id}" }
              as: LicenseAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_EDUCATION_REQUIRED"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  #   (1) bag_limit threshold (counted+q <= limit) on POST /harvest-reports
  #   (2) minimum-age years boundary on POST /licenses
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bag_limit_exact_boundary_accept_then_reject
        grounds:
          - calculations.season_bag_budget_remaining
          - validations[priority=13]
          - entities.SpeciesSeason.fields.bag_limit
          - errors[ERR_BAG_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /harvest-reports: with bag_limit 2 and
          1 already counted, a quantity-1 report (counted+q == 2 == limit) succeeds,
          but a quantity-2 report (counted+q == 3 > limit) is rejected — the <= edge.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; ELK season SEAS OPEN, bag_limit 2, draw_required false."
            - "Resident A_res holds ISSUED TAG L (OTC) with one SUBMITTED HarvestReport of quantity 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 2, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_id: $.data.id }
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_id}", harvest_datetime: "2026-09-15T08:00:00Z", quantity: 1 }
              as: Applicant
              as_user_id: "${a_res_id}"
          trigger:
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_id}", harvest_datetime: "2026-09-16T08:00:00Z", quantity: 1 }
              as: Applicant
              as_user_id: "${a_res_id}"
              captures: { hr_ok_id: $.data.id }
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_id}", harvest_datetime: "2026-09-17T08:00:00Z", quantity: 2 }
              as: Applicant
              as_user_id: "${a_res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HarvestReport.${hr_ok_id}.status == SUBMITTED"
            - "second response status == 409"
            - "second response.data.error_id == ERR_BAG_LIMIT_EXCEEDED"

      - name: minimum_age_boundary_below_vs_at_threshold
        grounds:
          - validations[priority=8]
          - entities.LicenseProduct.fields.min_age_years
          - entities.Applicant.fields.birth_date
          - errors[ERR_MINIMUM_AGE]
        distinguishing_aspect: |
          Age boundary on POST /licenses (different metric, different endpoint than
          bag_limit): product min_age_years 12, clock 2026-02-01. An applicant born
          2014-02-01 (exactly 12) is issued; one born 2014-02-02 (11y364d, just
          under 12) is rejected with ERR_MINIMUM_AGE.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z."
            - "STAMP product P_min (min_age_years 12, residency ANY, base_fee_cents 4500)."
            - "Resident applicant A_at (born 2014-02-01, exactly 12) and A_under (born 2014-02-02, just under 12), both residency APPROVED RESIDENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "STAMP-YOUTH", product_kind: "STAMP", base_fee_cents: 4500, min_age_years: 12, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_min_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A At", birth_date: "2014-02-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_at_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_at_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_at_id: $.data.id }
            - call: "POST /residency-verifications/${rv_at_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /applicants"
              payload: { full_name: "A Under", birth_date: "2014-02-02", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_under_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_under_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_under_id: $.data.id }
            - call: "POST /residency-verifications/${rv_under_id}/approve"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /licenses"
              payload: { applicant_id: "${a_at_id}", license_product_id: "${p_min_id}" }
              as: LicenseAgent
              captures: { lic_at_id: $.data.id }
            - call: "POST /licenses"
              payload: { applicant_id: "${a_under_id}", license_product_id: "${p_min_id}" }
              as: LicenseAgent
              captures: { err: $.data.error_id }
          assert:
            - "License.${lic_at_id}.status == ISSUED"
            - "second response status == 409"
            - "second response.data.error_id == ERR_MINIMUM_AGE"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  #   (1) DrawPool execute-draw depends on SpeciesSeason.status == OPEN
  #   (2) HarvestReport create depends on SpeciesSeason OPEN + License ISSUED
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: execute_draw_blocked_when_season_not_open
        grounds:
          - state_machines.DrawPool.CLOSED_to_DRAWN
          - state_machines.SpeciesSeason.DRAFT_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair = DrawPool -> SpeciesSeason. execute-draw on a CLOSED pool is
          rejected with ERR_INVALID_STATE when the bound SpeciesSeason is still
          DRAFT (never opened); the pool's own state is valid but the season's is not.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z; ELK season SEAS in DRAFT (NOT opened), draw_required true, bag_limit 1."
            - "TAG product P_tag bound to SEAS; pool POOL quota 1 with one entrant, CLOSED past deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A1", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-10T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a1_id}" }
              as: DrawOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pool_v: $.data.version }
          trigger:
            - call: "POST /draw-pools/${pool_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pool_v}" }
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: harvest_report_blocked_when_season_not_open
        grounds:
          - validations[priority=12]
          - state_machines.SpeciesSeason.OPEN_to_CLOSED
          - entities.HarvestReport.fields.harvest_datetime
          - errors[ERR_SEASON_NOT_OPEN]
        distinguishing_aspect: |
          Pair = HarvestReport -> SpeciesSeason (different pair than DrawPool->Season).
          A harvest report against an ISSUED TAG whose bound season has been CLOSED
          is rejected with ERR_SEASON_NOT_OPEN even though the License is valid.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; ELK season SEAS, bag_limit 2, draw_required false."
            - "Resident A_res holds ISSUED TAG L while season was OPEN; then DrawOfficer CLOSES the season."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 2, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/close"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_id}", harvest_datetime: "2026-09-16T08:00:00Z", quantity: 1 }
              as: Applicant
              as_user_id: "${a_res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_SEASON_NOT_OPEN"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  #   (1) DrawPool entry window: half-open [now, entry_deadline) — strictly-before admission
  #   (2) SpeciesSeason harvest window: half-open [season_open, season_close) — inclusive open / exclusive close
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: draw_entry_deadline_exclusive_upper_bound
        grounds:
          - validations[priority=10]
          - entities.DrawPool.fields.entry_deadline
          - errors[ERR_ENTRY_CLOSED]
        distinguishing_aspect: |
          Interval semantics A = a point-vs-deadline half-open window on DrawPool:
          admission requires now < entry_deadline (strict). At now == entry_deadline
          the entry is rejected with ERR_ENTRY_CLOSED — the upper bound is exclusive.
        test_recipe:
          setup:
            - "Clock at 2026-05-10T00:00:00Z exactly equal to the pool entry_deadline."
            - "ELK season SEAS OPEN, draw_required true; pool POOL ACCEPTING with entry_deadline 2026-05-10T00:00:00Z; applicant A1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-05-10T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A1", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: DrawOfficer
          trigger:
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a1_id}" }
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_ENTRY_CLOSED"

      - name: harvest_season_close_exclusive_upper_bound
        grounds:
          - validations[priority=12]
          - entities.SpeciesSeason.fields.season_close
          - entities.HarvestReport.fields.harvest_datetime
          - errors[ERR_SEASON_NOT_OPEN]
        distinguishing_aspect: |
          Interval semantics B = a datetime-in-window check on SpeciesSeason
          (different resource, different arithmetic): harvest_datetime must lie in
          [season_open, season_close). A harvest exactly at season_close
          (2026-10-01T00:00:00Z) is rejected — the close bound is exclusive while
          the open bound (semantics A above is a single deadline, this is a span).
        test_recipe:
          setup:
            - "Clock at 2026-10-01T00:00:00Z; ELK season SEAS OPEN, window [2026-09-01, 2026-10-01), bag_limit 2, draw_required false."
            - "Resident A_res holds ISSUED TAG L."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 2, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DrawOfficer
          trigger:
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_id}", harvest_datetime: "2026-10-01T00:00:00Z", quantity: 1 }
              as: Applicant
              as_user_id: "${a_res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_SEASON_NOT_OPEN"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  #   (1) replacement preserves season bag-budget (counted quantity conserved)
  #   (2) draw conserves the tag pool: awarded_count + remaining_quota == quota
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: replacement_conserves_bag_budget_counted_quantity
        grounds:
          - calculations.season_bag_budget_remaining
          - state_machines.License.ISSUED_to_VOIDED
          - entities.HarvestReport.fields.license_id
        distinguishing_aspect: |
          Conserved quantity A = the season counted-harvest total. Forward action
          (void original License) paired with its compensating action (re-link
          SUBMITTED HarvestReport to the replacement) MUST leave
          sum(quantity over SUBMITTED+ACCEPTED reports for the applicant in the season)
          unchanged at 1 across the replacement.
        test_recipe:
          setup:
            - "Clock 2026-09-15T00:00:00Z; ELK season SEAS OPEN, bag_limit 2, draw_required false."
            - "Resident A_res holds ISSUED TAG L_orig with one SUBMITTED HarvestReport quantity 1 (counted total before = 1; remaining before = 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 2, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_orig_id: $.data.id }
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_orig_id}", harvest_datetime: "2026-09-15T08:00:00Z", quantity: 1 }
              as: Applicant
              as_user_id: "${a_res_id}"
              captures: { hr_id: $.data.id }
          trigger:
            - call: "POST /replacements"
              payload: { original_license_id: "${l_orig_id}", reason: "LOST" }
              as: LicenseAgent
              captures: { repl_lic_id: $.data.replacement_license_id }
          assert:
            - "GET /licenses/${repl_lic_id}/bag-budget -> counted == 1 (conserved; not double-counted, not zeroed)"
            - "GET /licenses/${repl_lic_id}/bag-budget -> remaining == 1"
            - "HarvestReport.${hr_id}.license_id == ${repl_lic_id}"

      - name: draw_conserves_tag_pool_awarded_plus_unawarded_equals_entrants_capped_by_quota
        grounds:
          - state_machines.DrawPool.CLOSED_to_DRAWN
          - entities.DrawPool.fields.awarded_count
          - entities.DrawPool.fields.quota
          - state_machines.DrawApplication.SUBMITTED_to_AWARDED
        distinguishing_aspect: |
          Conserved quantity B (different from bag-budget) = tag conservation:
          awarded_count == min(quota, number of SUBMITTED applications) and
          awarded_count + count(UNSUCCESSFUL) == total SUBMITTED entrants. With
          quota 1 and 3 entrants: awarded_count == 1, unsuccessful == 2, total 3.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; ELK season SEAS OPEN, draw_required true, bag_limit 1."
            - "TAG product P_tag bound to SEAS. Pool POOL quota=1, SQUARED, 3 fresh entrants A1/A2/A3 (all pp0/b0), CLOSED past deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-10T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A1", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A2", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A3", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a3_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a1_id}" }
              as: DrawOfficer
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a2_id}" }
              as: DrawOfficer
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a3_id}" }
              as: DrawOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pool_v: $.data.version }
          trigger:
            - call: "POST /draw-pools/${pool_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pool_v}" }
              as: DrawOfficer
              captures: { awarded: $.data.awarded_count }
          assert:
            - "DrawPool.${pool_id}.awarded_count == 1"
            - "GET /draw-applications?draw_pool_id=${pool_id}&status=AWARDED -> total_count == 1"
            - "GET /draw-applications?draw_pool_id=${pool_id}&status=UNSUCCESSFUL -> total_count == 2"
