          trigger:
            - call: "POST /note-assessments"
              payload: { branch_id: "00000000-0000-4000-8000-000000000000", inventory_position_id: "00000000-0000-4000-8000-000000000000", exchange_transaction_id: "00000000-0000-4000-8000-000000000000", denomination_minor_units: 10000, note_count: 1, defect_type: "DAMAGED" }
              as: BranchTeller
