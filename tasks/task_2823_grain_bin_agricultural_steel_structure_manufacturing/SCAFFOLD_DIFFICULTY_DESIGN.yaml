            - call: "POST /roll-forming-runs"
              payload: { roll_forming_line_id: "${line_a_id}", coil_lot_id: "${cl1_id}", dealer_order_id: "${o_base_id}", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T12:00:00Z", planned_kg: 6600 }
