scenario: |
  1163. Mastering Studio & Delivery Specification (mastering engineer studio): session booking & engineer assignment, source file intake & technical QC, loudness/format target by distribution platform, revision rounds & approval, DDP/stem/instrumental deliverable generation, metadata (ISRC/UPC) embedding & verification, archive & recall for later use, rush turnaround pricing

domain_name: mastering-studio
api_prefix: /studio

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered label / artist legal entity name; used on contracts and invoices"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact; uniqueness enforced studio-wide"
      - name: status
        type: enum
        source: system
        description: "Lifecycle: PROSPECT, ACTIVE, SUSPENDED, TERMINATED"
        constraints: "enum { PROSPECT, ACTIVE, SUSPENDED, TERMINATED }; initial PROSPECT"
      - name: account_credit_cents
        type: integer
        source: computed
        description: "Ledger balance in cents; debited on deliverable approval, credited on refund / rejection"
        default: 0
      - name: lifetime_revision_count
        type: integer
        source: computed
        description: "Aggregate count of RevisionRound rows ever opened across all projects; drives VIP tier at VIP_REVISION_THRESHOLD"
        default: 0

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Engineer full name"
      - name: tier
        type: enum
        source: input
        description: "Skill tier: JUNIOR, STAFF, SENIOR, MASTER"
        constraints: "enum { JUNIOR, STAFF, SENIOR, MASTER }"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Billable hourly rate in cents; must be > 0"
      - name: capacity_minutes_per_day
        type: integer
        source: input
        description: "Daily bookable minutes; must be >= 0"
      - name: availability_status
        type: enum
        source: system
        description: "Current bookability: AVAILABLE, ON_LEAVE, INACTIVE"
        constraints: "enum { AVAILABLE, ON_LEAVE, INACTIVE }; initial AVAILABLE"
      - name: active_project_count
        type: integer
        source: computed
        description: "Count of Project rows currently in BOOKED/INTAKE/MASTERING/REVISION states assigned to this engineer; bumps on assignment and decrements on terminal transition"
        default: 0

  - name: PlatformProfile
    parent: null
    common_fields: true
    fields:
      - name: platform_code
        type: enum
        source: input
        description: "Distribution platform identifier"
        constraints: "enum { SPOTIFY, APPLE_MUSIC, YOUTUBE_MUSIC, TIDAL, DEEZER, BANDCAMP, VINYL, CD, CLUB }; unique per profile row"
      - name: integrated_lufs
        type: number
        source: input
        description: "Target integrated loudness in LUFS (e.g., -14.0); must be in [-30.0, -5.0]"
      - name: true_peak_dbtp
        type: number
        source: input
        description: "True-peak ceiling in dBTP (e.g., -1.0); must be in [-6.0, 0.0]"
      - name: loudness_range_lu
        type: number
        source: input
        description: "Max loudness range in LU; must be > 0"
      - name: required_sample_rate_hz
        type: integer
        source: input
        description: "Required PCM sample rate (e.g., 44100, 48000, 96000)"
      - name: required_bit_depth
        type: integer
        source: input
        description: "Required bit depth (16, 24, 32)"
      - name: container_format
        type: enum
        source: input
        description: "Required deliverable container"
        constraints: "enum { WAV, AIFF, FLAC, MP3_320, AAC_256, DDP, VINYL_PREMASTER }"

  - name: Project
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; owning client"
      - name: title
        type: string
        source: input
        description: "Album / EP / single title"
      - name: upc
        type: string
        source: input
        description: "Universal Product Code; 12-digit numeric string; unique studio-wide when present"
        constraints: "regex ^[0-9]{12}$"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        constraints: "enum { DRAFT, BOOKED, INTAKE, QC_PASSED, MASTERING, REVISION, APPROVED, DELIVERING, DELIVERED, ARCHIVED, RECALLED, CANCELLED }; initial DRAFT"
      - name: assigned_engineer_id
        type: string
        source: system
        description: "FK -> Engineer.id; set on booking confirmation, cleared on CANCELLED"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Requested session start ISO-8601 UTC; must be on a 30-minute boundary"
      - name: scheduled_duration_minutes
        type: integer
        source: input
        description: "Booking length; must be a multiple of 30 in [60, 480]"
      - name: target_platform_profile_id
        type: string
        source: input
        description: "FK -> PlatformProfile.id; loudness target for master; drives delivery validation"
      - name: rush_tier
        type: enum
        source: input
        description: "Turnaround tier"
        constraints: "enum { STANDARD, EXPRESS, RUSH, EMERGENCY }; initial STANDARD"
        default: STANDARD
      - name: quoted_price_cents
        type: integer
        source: computed
        description: "Provisional quote at booking time via quote_provisional variant"
        default: 0
      - name: final_price_cents
        type: integer
        source: computed
        description: "Final charge at APPROVED via quote_final variant (replaces provisional)"
        default: 0
      - name: current_revision_round_id
        type: string
        source: system
        description: "FK -> RevisionRound.id of open round; null when none"
      - name: revision_round_count
        type: integer
        source: computed
        description: "Count of RevisionRound rows for this project; never decrements"
        default: 0
      - name: archive_bundle_id
        type: string
        source: system
        description: "FK -> ArchiveBundle.id when ARCHIVED; null otherwise"

  - name: SessionSlot
    parent: null
    common_fields: true
    fields:
      - name: engineer_id
        type: string
        source: input
        description: "FK -> Engineer.id; engineer occupying the slot"
      - name: project_id
        type: string
        source: system
        description: "FK -> Project.id; the booked project (nullable until booked)"
      - name: slot_start_at
        type: datetime
        source: input
        description: "Slot start UTC; must be on 30-minute boundary"
      - name: slot_end_at
        type: datetime
        source: input
        description: "Slot end UTC; must be after slot_start_at and on 30-minute boundary"
      - name: status
        type: enum
        source: system
        description: "HELD (soft hold during checkout), BOOKED, RELEASED, CONSUMED, CANCELLED"
        constraints: "enum { HELD, BOOKED, RELEASED, CONSUMED, CANCELLED }; initial HELD"
      - name: held_expires_at
        type: datetime
        source: system
        description: "Server-set expiry; HELD auto-releases after HELD_TTL_MINUTES if not confirmed"

  - name: SourceAsset
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: filename
        type: string
        source: input
        description: "Original filename"
      - name: sha256
        type: string
        source: input
        description: "SHA-256 hex of file content (64 lowercase hex chars); uniqueness enforced within project"
      - name: sample_rate_hz
        type: integer
        source: input
        description: "Source PCM rate"
      - name: bit_depth
        type: integer
        source: input
        description: "Source bit depth"
      - name: duration_seconds
        type: number
        source: input
        description: "Track duration; > 0"
      - name: channels
        type: integer
        source: input
        description: "1=mono, 2=stereo, 6=5.1, 8=7.1"
      - name: qc_status
        type: enum
        source: system
        description: "Technical QC outcome"
        constraints: "enum { PENDING, PASSED, FAILED, WAIVED }; initial PENDING"
      - name: qc_failure_reason
        type: string
        source: system
        description: "Populated when qc_status=FAILED"

  - name: RevisionRound
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: round_index
        type: integer
        source: computed
        description: "1-based monotonically increasing per project; never re-used"
      - name: status
        type: enum
        source: system
        description: "Round lifecycle"
        constraints: "enum { OPEN, SUBMITTED, APPROVED, REJECTED, EXPIRED }; initial OPEN"
      - name: opened_at
        type: datetime
        source: system
        description: "Round creation timestamp"
      - name: submitted_at
        type: datetime
        source: system
        description: "Timestamp when engineer uploads revised master"
      - name: resolved_at
        type: datetime
        source: system
        description: "Timestamp when client approves or rejects"
      - name: deadline_at
        type: datetime
        source: computed
        description: "opened_at + SLA hours for project's rush_tier; breach triggers EXPIRED + surcharge"
      - name: notes
        type: string
        source: input
        description: "Client feedback / engineer notes"

  - name: Deliverable
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: revision_round_id
        type: string
        source: input
        description: "FK -> RevisionRound.id; round that produced this master"
      - name: deliverable_kind
        type: enum
        source: input
        description: "Deliverable type"
        constraints: "enum { DDP, STEM_PACK, INSTRUMENTAL, MASTER_WAV, MASTER_FLAC, MASTER_AAC, VINYL_PREMASTER }"
      - name: integrated_lufs
        type: number
        source: input
        description: "Measured integrated loudness"
      - name: true_peak_dbtp
        type: number
        source: input
        description: "Measured true peak"
      - name: loudness_range_lu
        type: number
        source: input
        description: "Measured loudness range"
      - name: sample_rate_hz
        type: integer
        source: input
        description: "Encoded sample rate"
      - name: bit_depth
        type: integer
        source: input
        description: "Encoded bit depth"
      - name: status
        type: enum
        source: system
        description: "Build lifecycle"
        constraints: "enum { BUILDING, QC_PENDING, QC_FAILED, READY, EMBEDDED, VERIFIED, RETIRED }; initial BUILDING"
      - name: qc_report_id
        type: string
        source: system
        description: "FK -> QCReport.id of latest QC run"

  - name: QCReport
    parent: null
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id"
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; denormalized for query speed"
      - name: check_code
        type: enum
        source: input
        description: "QC check identifier"
        constraints: "enum { LOUDNESS_IN_TOL, TRUE_PEAK_IN_TOL, LRA_IN_TOL, FORMAT_MATCH, ISRC_PRESENT, UPC_MATCH, CLIP_FREE, DC_OFFSET_OK, PHASE_COHERENT }"
      - name: passed
        type: boolean
        source: input
        description: "Outcome of this check"
      - name: measured_value
        type: number
        source: input
        description: "Numeric reading when applicable"
      - name: tolerance
        type: number
        source: input
        description: "Allowed deviation applied"

  - name: MetadataTag
    parent: Deliverable
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id"
      - name: isrc
        type: string
        source: input
        description: "12-char ISRC (e.g., USRC17607839); unique per deliverable kind within project"
        constraints: "regex ^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$"
      - name: upc
        type: string
        source: input
        description: "12-digit UPC; MUST equal parent Project.upc when present"
        constraints: "regex ^[0-9]{12}$"
      - name: embedding_status
        type: enum
        source: system
        description: "Embedding lifecycle"
        constraints: "enum { DRAFT, EMBEDDED, VERIFIED, MISMATCH, REVOKED }; initial DRAFT"
      - name: embedded_at
        type: datetime
        source: system
        description: "Timestamp of embedding"
      - name: verified_at
        type: datetime
        source: system
        description: "Timestamp of last successful verification"

  - name: ArchiveBundle
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; unique (one archive per project)"
      - name: storage_class
        type: enum
        source: input
        description: "Archive storage class"
        constraints: "enum { HOT, WARM, COLD, GLACIER }"
      - name: archive_size_bytes
        type: integer
        source: input
        description: "Total bytes persisted; >= 0"
      - name: recall_status
        type: enum
        source: system
        description: "Recall lifecycle: NONE (never recalled), PENDING, RESTORING, RESTORED, FAILED"
        constraints: "enum { NONE, PENDING, RESTORING, RESTORED, FAILED }; initial NONE"
      - name: recalled_at
        type: datetime
        source: system
        description: "Timestamp recall was requested"
      - name: restored_at
        type: datetime
        source: system
        description: "Timestamp restoration completed"
      - name: recall_fee_cents
        type: integer
        source: computed
        description: "Fee charged per recall, depends on storage_class tier"
        default: 0

  - name: RushTierRule
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Rush tier this rule prices"
        constraints: "enum { STANDARD, EXPRESS, RUSH, EMERGENCY }; unique per row"
      - name: multiplier_bp
        type: integer
        source: input
        description: "Price multiplier in basis points (10000 = 1.0x, 15000 = 1.5x, 20000 = 2.0x, 30000 = 3.0x)"
      - name: sla_hours
        type: integer
        source: input
        description: "Turnaround SLA hours per revision round; > 0"
      - name: surcharge_breach_cents
        type: integer
        source: input
        description: "Flat surcharge when SLA breached, in cents"
      - name: included_revision_rounds
        type: integer
        source: input
        description: "Free revision rounds included; additional rounds billed per-round"
      - name: per_round_cents
        type: integer
        source: input
        description: "Price per revision round beyond included count"

state_machines:
  - entity: Client
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /studio/clients/{id}/activate"
        actor: StudioManager
        preconditions:
          - "Client.status == PROSPECT"
          - "At least one Project row exists for this client (any status)"
        side_effects:
          - "Increments Client.version"
          - "Refreshes Client.updated_at"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /studio/clients/{id}/suspend"
        actor: StudioManager
        preconditions:
          - "Client.status == ACTIVE"
        side_effects:
          - "Releases all SessionSlot rows for projects owned by this client whose status == HELD"
          - "Cancels all Project rows for this client whose status IN {DRAFT, BOOKED, INTAKE} → CANCELLED"
          - "Increments Client.version"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /studio/clients/{id}/activate"
        actor: StudioManager
        preconditions:
          - "Client.status == SUSPENDED"
        side_effects:
          - "Increments Client.version"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /studio/clients/{id}/terminate"
        actor: StudioManager
        preconditions:
          - "Client.status == ACTIVE"
          - "No Project owned by this client in {BOOKED, INTAKE, QC_PASSED, MASTERING, REVISION, APPROVED, DELIVERING}"
        side_effects:
          - "Increments Client.version"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /studio/clients/{id}/terminate"
        actor: StudioManager
        preconditions:
          - "Client.status == SUSPENDED"
          - "No Project owned by this client in {BOOKED, INTAKE, QC_PASSED, MASTERING, REVISION, APPROVED, DELIVERING}"
        side_effects:
          - "Increments Client.version"

  - entity: Project
    initial_state: DRAFT
    terminal_states: [CANCELLED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: BOOKED
        trigger: "POST /studio/projects/{id}/book"
        actor: Client
        preconditions:
          - "Project.status == DRAFT"
          - "Client.status == ACTIVE"
          - "target_platform_profile_id references a PlatformProfile row"
          - "Engineer selector finds an AVAILABLE Engineer whose remaining capacity in [scheduled_start_at, +duration] >= scheduled_duration_minutes"
        side_effects:
          - "Creates SessionSlot(status=BOOKED) covering [scheduled_start_at, +duration]"
          - "Assigns Project.assigned_engineer_id from selector"
          - "Increments Engineer.active_project_count"
          - "Runs quote_provisional → writes Project.quoted_price_cents"
          - "Increments Project.version"
      - from: BOOKED
        to: INTAKE
        trigger: "POST /studio/projects/{id}/source-assets with at least one asset OR POST /studio/projects/{id}/begin-intake"
        actor: Engineer
        preconditions:
          - "Project.status == BOOKED"
          - "Engineer.availability_status == AVAILABLE"
        side_effects:
          - "Increments Project.version"
      - from: INTAKE
        to: QC_PASSED
        trigger: "POST /studio/projects/{id}/qc/complete"
        actor: Engineer
        preconditions:
          - "Project.status == INTAKE"
          - "Every SourceAsset on the project has qc_status IN {PASSED, WAIVED}"
        side_effects:
          - "Increments Project.version"
      - from: QC_PASSED
        to: MASTERING
        trigger: "POST /studio/projects/{id}/start-mastering"
        actor: Engineer
        preconditions:
          - "Project.status == QC_PASSED"
        side_effects:
          - "Opens RevisionRound(round_index=1, status=OPEN)"
          - "Sets Project.current_revision_round_id to new round"
          - "Increments Project.revision_round_count to 1"
          - "Increments Client.lifetime_revision_count"
          - "Increments Project.version"
      - from: MASTERING
        to: REVISION
        trigger: "POST /studio/projects/{id}/rounds/{rid}/submit"
        actor: Engineer
        preconditions:
          - "Project.status == MASTERING"
          - "RevisionRound.status == OPEN"
        side_effects:
          - "RevisionRound.status → SUBMITTED, sets submitted_at"
          - "Increments Project.version"
      - from: REVISION
        to: MASTERING
        trigger: "POST /studio/projects/{id}/rounds/{rid}/reject"
        actor: Client
        preconditions:
          - "Project.status == REVISION"
          - "RevisionRound.status == SUBMITTED"
        side_effects:
          - "RevisionRound.status → REJECTED, sets resolved_at"
          - "Opens new RevisionRound(round_index=prev+1, status=OPEN)"
          - "Updates Project.current_revision_round_id"
          - "Increments Project.revision_round_count"
          - "Increments Client.lifetime_revision_count"
          - "Increments Project.version"
      - from: REVISION
        to: APPROVED
        trigger: "POST /studio/projects/{id}/rounds/{rid}/approve"
        actor: Client
        preconditions:
          - "Project.status == REVISION"
          - "RevisionRound.status == SUBMITTED"
        side_effects:
          - "RevisionRound.status → APPROVED, sets resolved_at"
          - "Runs quote_final → writes Project.final_price_cents"
          - "Debits Client.account_credit_cents by Project.final_price_cents"
          - "Increments Project.version"
      - from: APPROVED
        to: DELIVERING
        trigger: "POST /studio/projects/{id}/deliver"
        actor: Engineer
        preconditions:
          - "Project.status == APPROVED"
          - "At least one Deliverable for current_revision_round_id has status == VERIFIED"
        side_effects:
          - "Increments Project.version"
      - from: DELIVERING
        to: DELIVERED
        trigger: "POST /studio/projects/{id}/finalize-delivery"
        actor: Engineer
        preconditions:
          - "Project.status == DELIVERING"
          - "All Deliverables for current_revision_round_id have status IN {VERIFIED, RETIRED}"
        side_effects:
          - "Increments Project.version"
      - from: DELIVERED
        to: ARCHIVED
        trigger: "POST /studio/projects/{id}/archive"
        actor: StudioManager
        preconditions:
          - "Project.status == DELIVERED"
        side_effects:
          - "Creates ArchiveBundle(status=NONE) linked to project"
          - "Sets Project.archive_bundle_id"
          - "Decrements Engineer.active_project_count"
          - "Increments Project.version"
      - from: ARCHIVED
        to: RECALLED
        trigger: "POST /studio/projects/{id}/recall"
        actor: Client
        preconditions:
          - "Project.status == ARCHIVED"
          - "ArchiveBundle.recall_status == NONE"
        side_effects:
          - "ArchiveBundle.recall_status → PENDING, recalled_at set"
          - "Runs compute_recall_fee → debits Client.account_credit_cents by ArchiveBundle.recall_fee_cents"
          - "Increments Project.version"
      - from: RECALLED
        to: MASTERING
        trigger: "POST /studio/projects/{id}/resume-from-recall"
        actor: Engineer
        preconditions:
          - "Project.status == RECALLED"
          - "ArchiveBundle.recall_status == RESTORED"
        side_effects:
          - "Increments Engineer.active_project_count"
          - "Increments Project.version"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /studio/projects/{id}/cancel"
        actor: Client
        preconditions:
          - "Project.status IN {DRAFT, BOOKED, INTAKE}"
        side_effects:
          - "Releases SessionSlot rows for this project in status HELD or BOOKED → RELEASED"
          - "If assigned_engineer_id was set, decrements Engineer.active_project_count"
          - "Increments Project.version"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /studio/projects/{id}/cancel"
        actor: Client
        preconditions:
          - "Project.status IN {DRAFT, BOOKED, INTAKE}"
        side_effects:
          - "Releases SessionSlot rows for this project in status HELD or BOOKED → RELEASED"
          - "Decrements Engineer.active_project_count"
          - "Increments Project.version"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /studio/projects/{id}/cancel"
        actor: Client
        preconditions:
          - "Project.status IN {DRAFT, BOOKED, INTAKE}"
        side_effects:
          - "Releases SessionSlot rows for this project in status HELD or BOOKED → RELEASED"
          - "Decrements Engineer.active_project_count"
          - "Increments Project.version"

  - entity: SessionSlot
    initial_state: HELD
    terminal_states: [RELEASED, CONSUMED, CANCELLED]
    transitions:
      - from: HELD
        to: BOOKED
        trigger: "POST /studio/session-slots/{id}/confirm"
        actor: Client
        preconditions:
          - "SessionSlot.status == HELD"
          - "now < SessionSlot.held_expires_at"
        side_effects:
          - "Increments SessionSlot.version"
      - from: HELD
        to: RELEASED
        trigger: "system event: held_expires_at reached OR POST /studio/session-slots/{id}/release"
        actor: system
        preconditions:
          - "SessionSlot.status == HELD"
        side_effects:
          - "Frees engineer capacity window"
          - "Increments SessionSlot.version"
      - from: BOOKED
        to: CONSUMED
        trigger: "system event: Project transitions BOOKED→INTAKE on its booked slot"
        actor: system
        preconditions:
          - "SessionSlot.status == BOOKED"
        side_effects:
          - "Increments SessionSlot.version"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /studio/session-slots/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "SessionSlot.status == BOOKED"
        side_effects:
          - "Cascades Project.status to CANCELLED when project in {DRAFT, BOOKED, INTAKE}"
          - "Decrements Engineer.active_project_count"
          - "Increments SessionSlot.version"

  - entity: SourceAsset
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, WAIVED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /studio/source-assets/{id}/qc-pass"
        actor: Engineer
        preconditions:
          - "SourceAsset.qc_status == PENDING"
          - "sample_rate_hz >= parent Project's PlatformProfile.required_sample_rate_hz"
          - "bit_depth >= parent Project's PlatformProfile.required_bit_depth"
        side_effects:
          - "Increments SourceAsset.version"
      - from: PENDING
        to: FAILED
        trigger: "POST /studio/source-assets/{id}/qc-fail"
        actor: Engineer
        preconditions:
          - "SourceAsset.qc_status == PENDING"
        side_effects:
          - "Sets qc_failure_reason"
          - "Increments SourceAsset.version"
      - from: FAILED
        to: WAIVED
        trigger: "POST /studio/source-assets/{id}/qc-waive"
        actor: StudioManager
        preconditions:
          - "SourceAsset.qc_status == FAILED"
        side_effects:
          - "Increments SourceAsset.version"

  - entity: RevisionRound
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /studio/projects/{id}/rounds/{rid}/submit"
        actor: Engineer
        preconditions:
          - "RevisionRound.status == OPEN"
          - "now <= RevisionRound.deadline_at"
        side_effects:
          - "Sets submitted_at"
          - "Increments RevisionRound.version"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /studio/projects/{id}/rounds/{rid}/approve"
        actor: Client
        preconditions:
          - "RevisionRound.status == SUBMITTED"
        side_effects:
          - "Sets resolved_at"
          - "Increments RevisionRound.version"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /studio/projects/{id}/rounds/{rid}/reject"
        actor: Client
        preconditions:
          - "RevisionRound.status == SUBMITTED"
        side_effects:
          - "Sets resolved_at"
          - "Increments RevisionRound.version"
      - from: OPEN
        to: EXPIRED
        trigger: "system event: now > deadline_at AND status still OPEN"
        actor: system
        preconditions:
          - "RevisionRound.status == OPEN"
        side_effects:
          - "Applies surcharge_breach_cents to Project.final_price_cents via quote_final"
          - "Increments RevisionRound.version"

  - entity: Deliverable
    initial_state: BUILDING
    terminal_states: [VERIFIED, RETIRED]
    transitions:
      - from: BUILDING
        to: QC_PENDING
        trigger: "POST /studio/deliverables/{id}/submit-qc"
        actor: Engineer
        preconditions:
          - "Deliverable.status == BUILDING"
        side_effects:
          - "Increments Deliverable.version"
      - from: QC_PENDING
        to: READY
        trigger: "POST /studio/deliverables/{id}/qc-pass"
        actor: QAChecker
        preconditions:
          - "Deliverable.status == QC_PENDING"
          - "Every QCReport row for this deliverable has passed == true"
        side_effects:
          - "Increments Deliverable.version"
      - from: QC_PENDING
        to: QC_FAILED
        trigger: "POST /studio/deliverables/{id}/qc-fail"
        actor: QAChecker
        preconditions:
          - "Deliverable.status == QC_PENDING"
          - "At least one QCReport row has passed == false"
        side_effects:
          - "Increments Deliverable.version"
      - from: QC_FAILED
        to: BUILDING
        trigger: "POST /studio/deliverables/{id}/rebuild"
        actor: Engineer
        preconditions:
          - "Deliverable.status == QC_FAILED"
        side_effects:
          - "Increments Deliverable.version"
      - from: READY
        to: EMBEDDED
        trigger: "POST /studio/deliverables/{id}/metadata-tags"
        actor: Engineer
        preconditions:
          - "Deliverable.status == READY"
          - "MetadataTag.upc == parent Project.upc when Project.upc present"
        side_effects:
          - "Creates MetadataTag(status=EMBEDDED, embedded_at=now)"
          - "Increments Deliverable.version"
      - from: EMBEDDED
        to: VERIFIED
        trigger: "POST /studio/deliverables/{id}/verify-metadata"
        actor: QAChecker
        preconditions:
          - "Deliverable.status == EMBEDDED"
          - "MetadataTag.embedding_status == EMBEDDED"
        side_effects:
          - "Sets MetadataTag.embedding_status=VERIFIED, verified_at=now"
          - "Increments Deliverable.version"
      - from: VERIFIED
        to: RETIRED
        trigger: "POST /studio/deliverables/{id}/retire"
        actor: StudioManager
        preconditions:
          - "Deliverable.status == VERIFIED"
          - "A newer Deliverable exists for the same project AND revision_round"
        side_effects:
          - "Sets MetadataTag.embedding_status=REVOKED on any linked tags"
          - "Increments Deliverable.version"

  - entity: ArchiveBundle
    initial_state: NONE
    terminal_states: [RESTORED, FAILED]
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /studio/archive-bundles/{id}/recall"
        actor: Client
        preconditions:
          - "ArchiveBundle.recall_status == NONE"
        side_effects:
          - "Sets recalled_at=now"
          - "Runs compute_recall_fee → writes recall_fee_cents"
          - "Increments ArchiveBundle.version"
      - from: PENDING
        to: RESTORING
        trigger: "POST /studio/archive-bundles/{id}/begin-restore"
        actor: StudioManager
        preconditions:
          - "ArchiveBundle.recall_status == PENDING"
        side_effects:
          - "Increments ArchiveBundle.version"
      - from: RESTORING
        to: RESTORED
        trigger: "POST /studio/archive-bundles/{id}/complete-restore"
        actor: StudioManager
        preconditions:
          - "ArchiveBundle.recall_status == RESTORING"
        side_effects:
          - "Sets restored_at=now"
          - "Increments ArchiveBundle.version"
      - from: RESTORING
        to: FAILED
        trigger: "POST /studio/archive-bundles/{id}/fail-restore"
        actor: StudioManager
        preconditions:
          - "ArchiveBundle.recall_status == RESTORING"
        side_effects:
          - "Increments ArchiveBundle.version"

  - entity: MetadataTag
    initial_state: DRAFT
    terminal_states: [VERIFIED, REVOKED]
    transitions:
      - from: DRAFT
        to: EMBEDDED
        trigger: "POST /studio/deliverables/{id}/metadata-tags"
        actor: Engineer
        preconditions:
          - "MetadataTag.embedding_status == DRAFT"
        side_effects:
          - "Sets embedded_at=now"
          - "Increments MetadataTag.version"
      - from: EMBEDDED
        to: VERIFIED
        trigger: "POST /studio/metadata-tags/{id}/verify"
        actor: QAChecker
        preconditions:
          - "MetadataTag.embedding_status == EMBEDDED"
        side_effects:
          - "Sets verified_at=now"
          - "Increments MetadataTag.version"
      - from: EMBEDDED
        to: MISMATCH
        trigger: "POST /studio/metadata-tags/{id}/flag-mismatch"
        actor: QAChecker
        preconditions:
          - "MetadataTag.embedding_status == EMBEDDED"
          - "Detected ISRC/UPC differs from authoritative source"
        side_effects:
          - "Increments MetadataTag.version"
      - from: MISMATCH
        to: REVOKED
        trigger: "POST /studio/metadata-tags/{id}/revoke"
        actor: StudioManager
        preconditions:
          - "MetadataTag.embedding_status == MISMATCH"
        side_effects:
          - "Increments MetadataTag.version"

concurrency_rules:
  - rule_id: project-book-stale-client
    parent_entity: Client
    write_endpoint: "POST /studio/projects/{id}/book"
    occ_field: "expected_client_version"
    description: |
      Booking a Project against a Client whose version has advanced since the
      caller last observed it is rejected. This captures the case where another
      writer has just suspended the client (which legitimately cascades to
      release session slots) and the current booking's view of client.status
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: round-submit-stale-project
    parent_entity: Project
    write_endpoint: "POST /studio/projects/{id}/rounds/{rid}/submit"
    occ_field: "expected_project_version"
    description: |
      Submitting a revision round against a Project whose version has advanced
      since the engineer last observed it is rejected. Captures the case where
      the client has just rejected a prior round (bumping version + opening a
      new round) so the engineer's view of the active round is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: quote_provisional
    trigger: "Project BOOKED transition (POST /studio/projects/{id}/book)"
    algorithm: tiered_pricing
    formula: |
      base_hours = scheduled_duration_minutes / 60
      engineer_rate = Engineer.hourly_rate_cents  # for assigned engineer
      base_cents = base_hours * engineer_rate
      rush_multiplier = RushTierRule.multiplier_bp(project.rush_tier) / 10000
      provisional = round_half_up(base_cents * rush_multiplier, 0)
      # Round at the very END of the chain; do not round intermediate products
    input_set: "Project at BOOKED; uses assigned Engineer's hourly_rate_cents, RushTierRule for project's rush_tier"
    constants:
      ROUNDING: round_half_up
      SCALE_BASIS_POINTS: 10000
    precision: "integer cents, round_half_up at final step only"
    variants:
      - name: quote_provisional
        when: "Booking time"
        difference: "Excludes revision-round billing (uses included_revision_rounds only)"
      - name: quote_final
        when: "Approval time"
        difference: "Adds billable_revision_rounds * per_round_cents + any breach surcharges; uses engineer's CURRENT hourly_rate_cents at approval"

  - name: quote_final
    trigger: "RevisionRound APPROVED transition OR RevisionRound EXPIRED transition"
    algorithm: tiered_pricing
    formula: |
      base_hours = scheduled_duration_minutes / 60
      engineer_rate_now = Engineer.hourly_rate_cents  # current rate, not booking-time rate
      base_cents = base_hours * engineer_rate_now
      rush_multiplier = RushTierRule.multiplier_bp(project.rush_tier) / 10000
      rush_applied = base_cents * rush_multiplier
      extra_rounds = max(0, project.revision_round_count - RushTierRule.included_revision_rounds)
      extra_rounds_cents = extra_rounds * RushTierRule.per_round_cents
      breach_count = count of RevisionRound rows with status == EXPIRED for this project
      breach_cents = breach_count * RushTierRule.surcharge_breach_cents
      final = round_half_up(rush_applied + extra_rounds_cents + breach_cents, 0)
    input_set: "All RevisionRound rows on project (any status); Project; Engineer current rate; RushTierRule"
    constants:
      ROUNDING: round_half_up
      SCALE_BASIS_POINTS: 10000
    precision: "integer cents, round_half_up at final step"
    variants: []

  - name: compute_recall_fee
    trigger: "ArchiveBundle PENDING transition (POST /studio/archive-bundles/{id}/recall)"
    algorithm: tiered_pricing
    formula: |
      # Storage class tiered recall fee; size in GB (rounded up)
      size_gb = ceil(archive_size_bytes / (1024*1024*1024))
      if storage_class == HOT:     fee = size_gb * 500    # $5/GB
      elif storage_class == WARM:  fee = size_gb * 1000   # $10/GB
      elif storage_class == COLD:  fee = size_gb * 2000   # $20/GB
      elif storage_class == GLACIER: fee = size_gb * 4000 # $40/GB
      # Minimum fee $10 to prevent trivial recalls
      fee = max(fee, 1000)
    input_set: "ArchiveBundle.storage_class + archive_size_bytes"
    constants:
      MIN_FEE_CENTS: 1000
      HOT_PER_GB_CENTS: 500
      WARM_PER_GB_CENTS: 1000
      COLD_PER_GB_CENTS: 2000
      GLACIER_PER_GB_CENTS: 4000
    precision: "integer cents"
    variants: []

  - name: loudness_compliance_check
    trigger: "POST /studio/deliverables/{id}/qc-pass and POST /studio/deliverables/{id}/qc-fail evaluation"
    algorithm: threshold
    formula: |
      profile = PlatformProfile for project
      lufs_ok = abs(Deliverable.integrated_lufs - profile.integrated_lufs) <= LUFS_TOLERANCE
      tp_ok   = Deliverable.true_peak_dbtp <= profile.true_peak_dbtp
      lra_ok  = Deliverable.loudness_range_lu <= profile.loudness_range_lu
      fmt_ok  = (Deliverable.sample_rate_hz == profile.required_sample_rate_hz)
            AND (Deliverable.bit_depth == profile.required_bit_depth)
      passed = lufs_ok AND tp_ok AND lra_ok AND fmt_ok
    input_set: "Deliverable being judged; Project's PlatformProfile"
    constants:
      LUFS_TOLERANCE: 0.5
    precision: "1 decimal place for LUFS comparisons"
    variants: []

  - name: engineer_capacity_utilization
    trigger: "Engineer selector during POST /studio/projects/{id}/book"
    algorithm: forward_looking
    formula: |
      window_start = scheduled_start_at
      window_end   = scheduled_start_at + scheduled_duration_minutes
      booked_minutes_in_window = sum over SessionSlot rows for engineer
                                  where status IN {BOOKED, HELD}
                                  AND slot overlaps [window_start, window_end)
                                  of (min(slot_end_at, window_end) - max(slot_start_at, window_start)) in minutes
      days_covered = ceil((window_end - window_start) / 86400)
      capacity_minutes = Engineer.capacity_minutes_per_day * days_covered
      remaining_minutes = capacity_minutes - booked_minutes_in_window
      eligible = (remaining_minutes >= scheduled_duration_minutes)
            AND (Engineer.availability_status == AVAILABLE)
    input_set: "Engineer's SessionSlot rows in {BOOKED, HELD} intersecting the requested window (both boundaries inclusive-exclusive: [start, end))"
    constants:
      SLOT_OVERLAP_SEMANTICS: half-open [start, end)
    precision: "integer minutes"
    variants: []

  - name: revision_billing_rounds
    trigger: "quote_final"
    algorithm: aggregation
    formula: |
      included = RushTierRule.included_revision_rounds
      total = Project.revision_round_count  # OPEN + SUBMITTED + APPROVED + REJECTED + EXPIRED
      billable = max(0, total - included)
    input_set: "All RevisionRound rows for the project regardless of status (terminal or active)"
    constants: {}
    precision: "integer"
    variants:
      - name: optimistic_rounds
        when: "Provisional quote at booking"
        difference: "billable = 0 (assumes no extra rounds)"
      - name: final_rounds
        when: "Final quote at approval"
        difference: "billable = max(0, total - included) — actual count"

  - name: archive_recall_pricing_boundary
    trigger: "compute_recall_fee"
    algorithm: threshold
    formula: |
      # Boundary condition: size_bytes < 1 GB still rounds UP to 1 GB (ceil)
      # Boundary condition: fee < $10 minimum still charges $10
      pass  # see compute_recall_fee formula
    input_set: "Same as compute_recall_fee"
    constants:
      MIN_FEE_CENTS: 1000
    precision: "integer cents"
    variants: []

  - name: held_slot_ttl_expiry
    trigger: "System periodic check; on any read of SessionSlot in HELD"
    algorithm: chronological
    formula: |
      expired = now >= held_expires_at
      # held_expires_at = created_at + HELD_TTL_MINUTES at slot creation
    input_set: "SessionSlot rows in HELD status"
    constants:
      HELD_TTL_MINUTES: 15
    precision: "second"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.5 roles[]"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-resolved resources exist (project, deliverable, round, etc.), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Foreign-key bodies reference existing rows (client_id, target_platform_profile_id, project_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH"
  - priority: 5
    category: state
    check: "Resource's current state permits the requested transition (per §1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Cross-entity guard: engineer's availability_status == AVAILABLE before session confirmation; client.status == ACTIVE before project booking"
    error_id: ERR_ENTITY_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /studio/projects/{id}/book, POST /studio/session-slots/{id}/confirm"
  - priority: 7
    category: business_constraint
    check: "SessionSlot overlap: requested [start, end) does not overlap any existing BOOKED or HELD slot for the same engineer (half-open semantics)"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /studio/session-slots, POST /studio/projects/{id}/book"
  - priority: 8
    category: business_constraint
    check: "Engineer capacity: remaining_minutes in window >= scheduled_duration_minutes (per engineer_capacity_utilization)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /studio/projects/{id}/book"
  - priority: 9
    category: business_constraint
    check: "30-minute boundary: scheduled_start_at, slot_start_at, slot_end_at land on minute :00 or :30"
    error_id: ERR_INVALID_TIME_BOUNDARY
    http_status: 400
    applies_to: "POST /studio/projects, POST /studio/session-slots"
  - priority: 10
    category: business_constraint
    check: "SourceAsset uniqueness: sha256 not already present on same project"
    error_id: ERR_DUPLICATE_ASSET
    http_status: 409
    applies_to: "POST /studio/projects/{id}/source-assets"
  - priority: 11
    category: business_constraint
    check: "UPC uniqueness across all Project rows when present"
    error_id: ERR_DUPLICATE_UPC
    http_status: 409
    applies_to: "POST /studio/projects, PUT /studio/projects/{id}"
  - priority: 12
    category: business_constraint
    check: "ISRC format regex ^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$; UPC format regex ^[0-9]{12}$"
    error_id: ERR_INVALID_FORMAT
    http_status: 400
    applies_to: "POST /studio/deliverables/{id}/metadata-tags, POST /studio/projects"
  - priority: 13
    category: business_referential
    check: "MetadataTag.upc equals parent Project.upc when Project.upc is present"
    error_id: ERR_METADATA_MISMATCH
    http_status: 422
    applies_to: "POST /studio/deliverables/{id}/metadata-tags"
  - priority: 14
    category: business_fiscal
    check: "Client.account_credit_cents + Project.final_price_cents >= 0 after debit (no negative balance)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /studio/projects/{id}/rounds/{rid}/approve, POST /studio/archive-bundles/{id}/recall"
  - priority: 15
    category: business_temporal
    check: "RevisionRound submission occurs before deadline_at"
    error_id: ERR_SLA_BREACH
    http_status: 422
    applies_to: "POST /studio/projects/{id}/rounds/{rid}/submit"
  - priority: 16
    category: business_temporal
    check: "SessionSlot confirmation occurs before held_expires_at"
    error_id: ERR_HOLD_EXPIRED
    http_status: 410
    applies_to: "POST /studio/session-slots/{id}/confirm"
  - priority: 17
    category: business_referential
    check: "Deliverable.retire precondition: newer Deliverable exists for same (project, revision_round)"
    error_id: ERR_NO_SUPERSEDING_DELIVERABLE
    http_status: 409
    applies_to: "POST /studio/deliverables/{id}/retire"
  - priority: 18
    category: business_constraint
    check: "Loudness/format compliance: loudness_compliance_check returns passed=true before deliverable transitions to READY"
    error_id: ERR_QC_FAILED
    http_status: 422
    applies_to: "POST /studio/deliverables/{id}/qc-pass"
  - priority: 19
    category: business_constraint
    check: "SourceAsset sample_rate_hz and bit_depth >= PlatformProfile requirements"
    error_id: ERR_SOURCE_BELOW_SPEC
    http_status: 422
    applies_to: "POST /studio/source-assets/{id}/qc-pass"
  - priority: 20
    category: state
    check: "Stale version on OCC-guarded endpoints (expected_*_version matches current parent version)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /studio/projects/{id}/book, POST /studio/projects/{id}/rounds/{rid}/submit"

endpoints:
  # Clock (test-driving)
  - method: POST
    path: "/studio/_clock/set_current_utc"
    description: "Sets the logical clock to the given ISO-8601 UTC timestamp. Before any call, the clock reads the default 2026-05-01T00:00:00Z and MUST NOT fall back to real wall-clock."
    roles: [StudioManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Advances server logical clock"]

  # Clients
  - method: POST
    path: "/studio/clients"
    description: "Register a new client"
    roles: [StudioManager]
    code: 201
    input: [legal_name, contact_email]
    output: Client
    side_effects: ["Initializes Client.status=PROSPECT, account_credit_cents=0"]
  - method: GET
    path: "/studio/clients"
    description: "List clients; supports status filter, pagination"
    roles: [StudioManager, QAChecker, Engineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/studio/clients/{id}"
    description: "Get single client"
    roles: [StudioManager, Client, QAChecker]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/studio/clients/{id}/activate"
    description: "Activate a PROSPECT or SUSPENDED client"
    roles: [StudioManager]
    code: 200
    input: []
    output: Client
    side_effects: ["Client.status → ACTIVE", "increments Client.version"]
  - method: POST
    path: "/studio/clients/{id}/suspend"
    description: "Suspend an ACTIVE client (cascades to projects/slots)"
    roles: [StudioManager]
    code: 200
    input: []
    output: Client
    side_effects: ["Client.status → SUSPENDED", "Cascades project cancellations", "Releases HELD slots"]
  - method: POST
    path: "/studio/clients/{id}/terminate"
    description: "Terminate a client (only when no in-flight projects)"
    roles: [StudioManager]
    code: 200
    input: []
    output: Client
    side_effects: ["Client.status → TERMINATED"]
  - method: POST
    path: "/studio/clients/{id}/credit-adjustments"
    description: "Add or remove credit from a client's account (positive or negative amount)"
    roles: [StudioManager]
    code: 201
    input: [amount_cents, reason]
    output: Client
    side_effects: ["Adjusts account_credit_cents"]

  # Engineers
  - method: POST
    path: "/studio/engineers"
    description: "Onboard a new engineer"
    roles: [StudioManager]
    code: 201
    input: [display_name, tier, hourly_rate_cents, capacity_minutes_per_day]
    output: Engineer
    side_effects: ["Initializes availability_status=AVAILABLE, active_project_count=0"]
  - method: GET
    path: "/studio/engineers"
    description: "List engineers; supports tier, availability_status filters"
    roles: [StudioManager, Client, QAChecker]
    code: 200
    input: ["tier?", "availability_status?", "limit?", "offset?"]
    output: Engineer[]
    side_effects: []
  - method: GET
    path: "/studio/engineers/{id}"
    description: "Get single engineer"
    roles: [StudioManager, Engineer, QAChecker]
    code: 200
    input: []
    output: Engineer
    side_effects: []
  - method: POST
    path: "/studio/engineers/{id}/set-availability"
    description: "Set engineer availability (AVAILABLE, ON_LEAVE, INACTIVE)"
    roles: [StudioManager, Engineer]
    code: 200
    input: [availability_status]
    output: Engineer
    side_effects: ["Updates availability_status"]

  # PlatformProfiles
  - method: POST
    path: "/studio/platform-profiles"
    description: "Define a distribution platform target"
    roles: [StudioManager]
    code: 201
    input: [platform_code, integrated_lufs, true_peak_dbtp, loudness_range_lu, required_sample_rate_hz, required_bit_depth, container_format]
    output: PlatformProfile
    side_effects: []
  - method: GET
    path: "/studio/platform-profiles"
    description: "List platform profiles"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["platform_code?", "limit?", "offset?"]
    output: PlatformProfile[]
    side_effects: []
  - method: GET
    path: "/studio/platform-profiles/{id}"
    description: "Get single platform profile"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: []
    output: PlatformProfile
    side_effects: []

  # RushTierRules
  - method: POST
    path: "/studio/rush-tier-rules"
    description: "Define pricing/SLA rule for a rush tier"
    roles: [StudioManager]
    code: 201
    input: [tier, multiplier_bp, sla_hours, surcharge_breach_cents, included_revision_rounds, per_round_cents]
    output: RushTierRule
    side_effects: []
  - method: GET
    path: "/studio/rush-tier-rules"
    description: "List rush tier rules"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["tier?"]
    output: RushTierRule[]
    side_effects: []

  # Projects
  - method: POST
    path: "/studio/projects"
    description: "Create a new mastering project (DRAFT)"
    roles: [Client]
    code: 201
    input: [client_id, title, "upc?", target_platform_profile_id, scheduled_start_at, scheduled_duration_minutes, "rush_tier?"]
    output: Project
    side_effects: ["Initializes status=DRAFT, revision_round_count=0"]
  - method: GET
    path: "/studio/projects"
    description: "List projects; supports client_id, status, assigned_engineer_id, target_platform_profile_id, current_revision_round_id, archive_bundle_id filters"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["client_id?", "status?", "assigned_engineer_id?", "target_platform_profile_id?", "current_revision_round_id?", "archive_bundle_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/studio/projects/{id}"
    description: "Get single project"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/studio/projects/{id}/book"
    description: "Confirm booking, assign engineer, run provisional quote (OCC-guarded on Client)"
    roles: [Client]
    code: 200
    input: [expected_client_version]
    output: Project
    side_effects: ["Project.status → BOOKED", "Creates SessionSlot(BOOKED)", "Runs quote_provisional", "increments Project.version", "increments Client.version"]
  - method: POST
    path: "/studio/projects/{id}/cancel"
    description: "Cancel a DRAFT/BOOKED/INTAKE project"
    roles: [Client, StudioManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status → CANCELLED", "Releases session slots", "Decrements engineer active_project_count"]
  - method: POST
    path: "/studio/projects/{id}/begin-intake"
    description: "Engineer begins intake on a BOOKED project"
    roles: [Engineer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status → INTAKE"]
  - method: POST
    path: "/studio/projects/{id}/qc/complete"
    description: "Mark intake QC complete; requires all source assets passed/waived"
    roles: [Engineer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status → QC_PASSED"]
  - method: POST
    path: "/studio/projects/{id}/start-mastering"
    description: "Begin mastering; opens first revision round"
    roles: [Engineer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status → MASTERING", "Creates RevisionRound(round_index=1)"]
  - method: POST
    path: "/studio/projects/{id}/deliver"
    description: "Begin delivery phase"
    roles: [Engineer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status → DELIVERING"]
  - method: POST
    path: "/studio/projects/{id}/finalize-delivery"
    description: "Mark delivery complete"
    roles: [Engineer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status → DELIVERED"]
  - method: POST
    path: "/studio/projects/{id}/archive"
    description: "Archive a DELIVERED project"
    roles: [StudioManager]
    code: 200
    input: [storage_class, archive_size_bytes]
    output: ArchiveBundle
    side_effects: ["Creates ArchiveBundle", "Project.status → ARCHIVED"]
  - method: POST
    path: "/studio/projects/{id}/recall"
    description: "Recall an archived project"
    roles: [Client]
    code: 200
    input: []
    output: ArchiveBundle
    side_effects: ["ArchiveBundle.recall_status → PENDING", "Runs compute_recall_fee"]
  - method: POST
    path: "/studio/projects/{id}/resume-from-recall"
    description: "Resume a recalled project to MASTERING"
    roles: [Engineer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status → MASTERING"]

  # SessionSlots
  - method: POST
    path: "/studio/session-slots"
    description: "Create a HELD slot (30-min boundary required)"
    roles: [Client, StudioManager]
    code: 201
    input: ["engineer_id", "project_id?", "slot_start_at", "slot_end_at"]
    output: SessionSlot
    side_effects: ["Sets held_expires_at = now + HELD_TTL_MINUTES"]
  - method: GET
    path: "/studio/session-slots"
    description: "List session slots; supports engineer_id, project_id, status filters"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["engineer_id?", "project_id?", "status?", "limit?", "offset?"]
    output: SessionSlot[]
    side_effects: []
  - method: GET
    path: "/studio/session-slots/{id}"
    description: "Get single slot"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: []
    output: SessionSlot
    side_effects: []
  - method: POST
    path: "/studio/session-slots/{id}/confirm"
    description: "Confirm a HELD slot → BOOKED"
    roles: [Client]
    code: 200
    input: []
    output: SessionSlot
    side_effects: ["SessionSlot.status → BOOKED"]
  - method: POST
    path: "/studio/session-slots/{id}/release"
    description: "Release a HELD slot"
    roles: [Client, StudioManager]
    code: 200
    input: []
    output: SessionSlot
    side_effects: ["SessionSlot.status → RELEASED"]
  - method: POST
    path: "/studio/session-slots/{id}/cancel"
    description: "Cancel a BOOKED slot (cascades to project)"
    roles: [StudioManager]
    code: 200
    input: []
    output: SessionSlot
    side_effects: ["SessionSlot.status → CANCELLED", "Cascades project cancellation"]

  # SourceAssets
  - method: POST
    path: "/studio/projects/{id}/source-assets"
    description: "Upload a source audio asset to a project"
    roles: [Client, Engineer]
    code: 201
    input: [filename, sha256, sample_rate_hz, bit_depth, duration_seconds, channels]
    output: SourceAsset
    side_effects: ["Initializes qc_status=PENDING"]
  - method: GET
    path: "/studio/projects/{id}/source-assets"
    description: "List source assets for a project"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["qc_status?", "limit?", "offset?"]
    output: SourceAsset[]
    side_effects: []
  - method: GET
    path: "/studio/source-assets/{id}"
    description: "Get single source asset"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: []
    output: SourceAsset
    side_effects: []
  - method: POST
    path: "/studio/source-assets/{id}/qc-pass"
    description: "Mark source asset QC pass"
    roles: [Engineer, QAChecker]
    code: 200
    input: []
    output: SourceAsset
    side_effects: ["SourceAsset.qc_status → PASSED"]
  - method: POST
    path: "/studio/source-assets/{id}/qc-fail"
    description: "Mark source asset QC fail"
    roles: [Engineer, QAChecker]
    code: 200
    input: [qc_failure_reason]
    output: SourceAsset
    side_effects: ["SourceAsset.qc_status → FAILED"]
  - method: POST
    path: "/studio/source-assets/{id}/qc-waive"
    description: "Studio manager waives a failed QC"
    roles: [StudioManager]
    code: 200
    input: []
    output: SourceAsset
    side_effects: ["SourceAsset.qc_status → WAIVED"]

  # RevisionRounds
  - method: GET
    path: "/studio/projects/{id}/rounds"
    description: "List revision rounds for a project"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RevisionRound[]
    side_effects: []
  - method: GET
    path: "/studio/rounds/{id}"
    description: "Get single revision round"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: []
    output: RevisionRound
    side_effects: []
  - method: POST
    path: "/studio/projects/{id}/rounds/{rid}/submit"
    description: "Engineer submits revised master (OCC-guarded on Project)"
    roles: [Engineer]
    code: 200
    input: ["expected_project_version", "notes?"]
    output: RevisionRound
    side_effects: ["RevisionRound.status → SUBMITTED", "Project.status → REVISION", "increments Project.version"]
  - method: POST
    path: "/studio/projects/{id}/rounds/{rid}/approve"
    description: "Client approves round; triggers final quote + debit"
    roles: [Client]
    code: 200
    input: []
    output: RevisionRound
    side_effects: ["RevisionRound.status → APPROVED", "Project.status → APPROVED", "Runs quote_final", "Debits Client.account_credit_cents"]
  - method: POST
    path: "/studio/projects/{id}/rounds/{rid}/reject"
    description: "Client rejects round; opens next round"
    roles: [Client]
    code: 200
    input: ["notes?"]
    output: RevisionRound
    side_effects: ["RevisionRound.status → REJECTED", "Opens RevisionRound(round_index+1)", "Increments revision_round_count"]

  # Deliverables
  - method: POST
    path: "/studio/projects/{id}/deliverables"
    description: "Create a deliverable build"
    roles: [Engineer]
    code: 201
    input: [revision_round_id, deliverable_kind, integrated_lufs, true_peak_dbtp, loudness_range_lu, sample_rate_hz, bit_depth]
    output: Deliverable
    side_effects: ["Initializes status=BUILDING"]
  - method: GET
    path: "/studio/projects/{id}/deliverables"
    description: "List deliverables for a project; supports revision_round_id, qc_report_id filters"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["deliverable_kind?", "status?", "revision_round_id?", "qc_report_id?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: GET
    path: "/studio/deliverables"
    description: "List deliverables; supports project_id, revision_round_id, qc_report_id, deliverable_kind, status filters"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["project_id?", "revision_round_id?", "qc_report_id?", "deliverable_kind?", "status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: GET
    path: "/studio/deliverables/{id}"
    description: "Get single deliverable"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: POST
    path: "/studio/deliverables/{id}/submit-qc"
    description: "Submit deliverable for QC"
    roles: [Engineer]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Deliverable.status → QC_PENDING"]
  - method: POST
    path: "/studio/deliverables/{id}/qc-pass"
    description: "QA marks deliverable QC passed (requires all QCReports pass)"
    roles: [QAChecker]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Deliverable.status → READY"]
  - method: POST
    path: "/studio/deliverables/{id}/qc-fail"
    description: "QA marks deliverable QC failed"
    roles: [QAChecker]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Deliverable.status → QC_FAILED"]
  - method: POST
    path: "/studio/deliverables/{id}/rebuild"
    description: "Rebuild a QC_FAILED deliverable"
    roles: [Engineer]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Deliverable.status → BUILDING"]
  - method: POST
    path: "/studio/deliverables/{id}/metadata-tags"
    description: "Embed ISRC/UPC metadata into deliverable"
    roles: [Engineer]
    code: 201
    input: ["isrc", "upc?"]
    output: MetadataTag
    side_effects: ["Creates MetadataTag(EMBEDDED)", "Deliverable.status → EMBEDDED"]
  - method: POST
    path: "/studio/deliverables/{id}/verify-metadata"
    description: "QA verifies embedded metadata"
    roles: [QAChecker]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["MetadataTag.embedding_status → VERIFIED", "Deliverable.status → VERIFIED"]
  - method: POST
    path: "/studio/deliverables/{id}/retire"
    description: "Retire a superseded deliverable"
    roles: [StudioManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Deliverable.status → RETIRED", "Linked MetadataTag.embedding_status → REVOKED"]

  # MetadataTags
  - method: GET
    path: "/studio/deliverables/{id}/metadata-tags"
    description: "List metadata tags for a deliverable"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["limit?", "offset?"]
    output: MetadataTag[]
    side_effects: []
  - method: GET
    path: "/studio/metadata-tags/{id}"
    description: "Get single metadata tag"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: []
    output: MetadataTag
    side_effects: []
  - method: POST
    path: "/studio/metadata-tags/{id}/verify"
    description: "Verify a metadata tag independently"
    roles: [QAChecker]
    code: 200
    input: []
    output: MetadataTag
    side_effects: ["MetadataTag.embedding_status → VERIFIED"]
  - method: POST
    path: "/studio/metadata-tags/{id}/flag-mismatch"
    description: "Flag a metadata mismatch"
    roles: [QAChecker]
    code: 200
    input: []
    output: MetadataTag
    side_effects: ["MetadataTag.embedding_status → MISMATCH"]
  - method: POST
    path: "/studio/metadata-tags/{id}/revoke"
    description: "Revoke a mismatched tag"
    roles: [StudioManager]
    code: 200
    input: []
    output: MetadataTag
    side_effects: ["MetadataTag.embedding_status → REVOKED"]

  # QCReports
  - method: POST
    path: "/studio/deliverables/{id}/qc-reports"
    description: "Record a QC check result for a deliverable"
    roles: [QAChecker, Engineer]
    code: 201
    input: ["check_code", "passed", "measured_value?", "tolerance?"]
    output: QCReport
    side_effects: []
  - method: GET
    path: "/studio/projects/{id}/qc-reports"
    description: "List QC reports for a project (across its deliverables)"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["check_code?", "passed?", "limit?", "offset?"]
    output: QCReport[]
    side_effects: []
  - method: GET
    path: "/studio/qc-reports"
    description: "List QC reports across deliverables; supports project_id, deliverable_id, check_code, passed filters"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["project_id?", "deliverable_id?", "check_code?", "passed?", "limit?", "offset?"]
    output: QCReport[]
    side_effects: []
  - method: GET
    path: "/studio/deliverables/{id}/qc-reports"
    description: "List QC reports for a deliverable; supports project_id filter"
    roles: [StudioManager, Client, Engineer, QAChecker]
    code: 200
    input: ["check_code?", "passed?", "project_id?", "limit?", "offset?"]
    output: QCReport[]
    side_effects: []

  # ArchiveBundles
  - method: GET
    path: "/studio/archive-bundles"
    description: "List archive bundles; supports project_id, recall_status filters"
    roles: [StudioManager, Client, QAChecker]
    code: 200
    input: ["project_id?", "recall_status?", "limit?", "offset?"]
    output: ArchiveBundle[]
    side_effects: []
  - method: GET
    path: "/studio/archive-bundles/{id}"
    description: "Get single archive bundle"
    roles: [StudioManager, Client, QAChecker]
    code: 200
    input: []
    output: ArchiveBundle
    side_effects: []
  - method: POST
    path: "/studio/archive-bundles/{id}/recall"
    description: "Client initiates a recall (alternate entry point)"
    roles: [Client]
    code: 200
    input: []
    output: ArchiveBundle
    side_effects: ["ArchiveBundle.recall_status → PENDING", "Runs compute_recall_fee"]
  - method: POST
    path: "/studio/archive-bundles/{id}/begin-restore"
    description: "Begin restore"
    roles: [StudioManager]
    code: 200
    input: []
    output: ArchiveBundle
    side_effects: ["ArchiveBundle.recall_status → RESTORING"]
  - method: POST
    path: "/studio/archive-bundles/{id}/complete-restore"
    description: "Mark restore complete"
    roles: [StudioManager]
    code: 200
    input: []
    output: ArchiveBundle
    side_effects: ["ArchiveBundle.recall_status → RESTORED"]
  - method: POST
    path: "/studio/archive-bundles/{id}/fail-restore"
    description: "Mark restore failed"
    roles: [StudioManager]
    code: 200
    input: []
    output: ArchiveBundle
    side_effects: ["ArchiveBundle.recall_status → FAILED"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing or malformed"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role does not have permission for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, malformed, or wrong type"
  - id: ERR_INVALID_FORMAT
    http: 400
    condition: "ISRC/UPC or datetime format invalid"
  - id: ERR_INVALID_TIME_BOUNDARY
    http: 400
    condition: "Timestamp not on 30-minute boundary"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Current entity status does not allow requested transition"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Entity already in a terminal state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_*_version does not match current version"
  - id: ERR_ENTITY_NOT_ACTIVE
    http: 422
    condition: "Cross-entity guard: engineer not AVAILABLE or client not ACTIVE"
  - id: ERR_SLOT_CONFLICT
    http: 409
    condition: "Requested slot overlaps existing BOOKED or HELD slot for same engineer"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Engineer's remaining capacity in window < requested duration"
  - id: ERR_DUPLICATE_ASSET
    http: 409
    condition: "SourceAsset sha256 already exists on project"
  - id: ERR_DUPLICATE_UPC
    http: 409
    condition: "UPC already registered to another Project"
  - id: ERR_METADATA_MISMATCH
    http: 422
    condition: "MetadataTag.upc != parent Project.upc when Project.upc is present"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "Client account_credit_cents would go negative after debit"
  - id: ERR_SLA_BREACH
    http: 422
    condition: "RevisionRound submission after deadline_at"
  - id: ERR_HOLD_EXPIRED
    http: 410
    condition: "SessionSlot confirm after held_expires_at"
  - id: ERR_NO_SUPERSEDING_DELIVERABLE
    http: 409
    condition: "Retire precondition failed: no newer deliverable for same (project, revision_round)"
  - id: ERR_QC_FAILED
    http: 422
    condition: "Deliverable loudness/format QC checks did not pass"
  - id: ERR_SOURCE_BELOW_SPEC
    http: 422
    condition: "SourceAsset sample_rate_hz or bit_depth below PlatformProfile requirement"
  - id: ERR_NO_ACTIVE_ROUND
    http: 409
    condition: "Project has no current_revision_round_id in OPEN state for the requested operation"
  - id: ERR_ENGINEER_NOT_ASSIGNED
    http: 403
    condition: "Engineer attempting action on a project not assigned to them"
  - id: ERR_CLIENT_NOT_OWNER
    http: 403
    condition: "Client attempting action on a project they do not own"

roles:
  - name: Client
    description: "Label / artist acting on their own projects, source assets, rounds, recall"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /studio/projects (create project for self)"
      - "POST /studio/projects/{id}/book"
      - "POST /studio/projects/{id}/cancel (own project)"
      - "POST /studio/projects/{id}/rounds/{rid}/approve"
      - "POST /studio/projects/{id}/rounds/{rid}/reject"
      - "POST /studio/projects/{id}/recall"
      - "POST /studio/session-slots (hold own slot)"
      - "POST /studio/session-slots/{id}/confirm"
    shared_operations:
      - "GET /studio/projects (own only)"
      - "GET /studio/clients/{id} (self)"
      - "GET /studio/platform-profiles"
      - "GET /studio/rush-tier-rules"
      - "GET /studio/archive-bundles (own)"
  - name: Engineer
    description: "Mastering engineer running intake/QC/mastering/deliverable build"
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /studio/projects/{id}/begin-intake"
      - "POST /studio/projects/{id}/qc/complete"
      - "POST /studio/projects/{id}/start-mastering"
      - "POST /studio/projects/{id}/rounds/{rid}/submit"
      - "POST /studio/projects/{id}/deliver"
      - "POST /studio/projects/{id}/finalize-delivery"
      - "POST /studio/projects/{id}/resume-from-recall"
      - "POST /studio/projects/{id}/deliverables (create)"
      - "POST /studio/deliverables/{id}/submit-qc"
      - "POST /studio/deliverables/{id}/rebuild"
      - "POST /studio/deliverables/{id}/metadata-tags"
      - "POST /studio/source-assets/{id}/qc-pass"
      - "POST /studio/source-assets/{id}/qc-fail"
    shared_operations:
      - "GET endpoints across domain"
      - "POST /studio/engineers/{id}/set-availability (self)"
  - name: QAChecker
    description: "Independent QA role for deliverable + metadata verification (segregation of duties: cannot be the engineer who built it)"
    identity: "opaque"
    exclusive_operations:
      - "POST /studio/deliverables/{id}/qc-pass"
      - "POST /studio/deliverables/{id}/qc-fail"
      - "POST /studio/deliverables/{id}/verify-metadata"
      - "POST /studio/metadata-tags/{id}/verify"
      - "POST /studio/metadata-tags/{id}/flag-mismatch"
      - "POST /studio/deliverables/{id}/qc-reports (authoritative)"
    shared_operations:
      - "GET endpoints across domain"
  - name: StudioManager
    description: "Studio operator with override and admin powers"
    identity: "opaque"
    exclusive_operations:
      - "POST /studio/clients (create)"
      - "POST /studio/clients/{id}/activate"
      - "POST /studio/clients/{id}/suspend"
      - "POST /studio/clients/{id}/terminate"
      - "POST /studio/clients/{id}/credit-adjustments"
      - "POST /studio/engineers (create)"
      - "POST /studio/platform-profiles"
      - "POST /studio/rush-tier-rules"
      - "POST /studio/projects/{id}/archive"
      - "POST /studio/deliverables/{id}/retire"
      - "POST /studio/source-assets/{id}/qc-waive"
      - "POST /studio/metadata-tags/{id}/revoke"
      - "POST /studio/archive-bundles/{id}/begin-restore"
      - "POST /studio/archive-bundles/{id}/complete-restore"
