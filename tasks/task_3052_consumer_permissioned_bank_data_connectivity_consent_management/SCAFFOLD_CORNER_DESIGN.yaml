        distinguishing_aspect: "Priority-4 segregation-of-duties: the reviewing ComplianceReviewer's X-User-ID equal to the creating PlatformAdmin's id rejects with 422 ERR_SOD_VIOLATION before any state check."
        test_recipe:
          setup: ["Recipient created by PlatformAdmin with X-User-ID same_user"]
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "SodApp", declared_use_case: "sod test", minimization_policy: "BROAD" }
              as: PlatformAdmin
