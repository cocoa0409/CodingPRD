          assert:
            - "the confirm fails with status 422"
            - "the safety conflict wins — ${err2} == ERR_RIGHTS_EXPIRED"
            - "the constraint condition is genuinely violated too — the title's rights_end_utc 2026-11-15T00:00:00Z precedes the screening's ends_at 2026-12-01T02:00:00Z, so this is a true dual failure and not a single-condition test"
            - "Booking.${b_id}.status is unchanged at ON_SALE"

  # ===========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: presale_threshold_exact_equality_boundary
        grounds:
          - calculations.presale_threshold_assessment
          - entities.Booking.fields.pre_sale_threshold
          - validations[priority=29]
          - state_machines.Booking.ON_SALE_to_CANCELLED
        distinguishing_aspect: |
          The presale gate is a >= comparison over an integer ticket count reached
          through POST /bookings/{id}/presale-checkpoint: a booking that recorded
          exactly 5000 tickets against threshold 5000 survives, while one that
          recorded 4999 is cancelled. One ticket separates survival from
          cancellation and no rounding intervenes.
        test_recipe:
          setup:
            - "Standard CA fixture. Two bookings on the same circuit and theater, each with a 60-screen line, both driven to ON_SALE with threshold 5000."
            - "Clock moved to 2026-10-15T00:00:00Z, exactly on_sale_at (2026-10-01) plus the 14-day checkpoint offset."
            - "Booking A records 5000 presale tickets; booking B records 4999."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 5000 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { bA: $.data.id, bA_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${bA}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 60, expected_attendance: 100, expected_booking_version: "${bA_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { lineA: $.data.id, bA_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${bA}/submit"
              payload: { expected_booking_version: "${bA_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { bA_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${bA}/approve"
              payload: { line_id: "${lineA}", expected_booking_version: "${bA_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { bA_v4: $.data.version }
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1380, auditorium: "AUD-2" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 5000 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { bB: $.data.id, bB_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${bB}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 60, expected_attendance: 100, expected_booking_version: "${bB_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { lineB: $.data.id, bB_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${bB}/submit"
              payload: { expected_booking_version: "${bB_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { bB_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${bB}/approve"
              payload: { line_id: "${lineB}", expected_booking_version: "${bB_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { bB_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
              captures: { swept: $.data.advanced_count }
            - call: "POST /event-cinema/bookings/${bA}/presale-sales"
              payload: { quantity: 5000 }
              as: Theater
              as_user_id: "${th_id}"
            - call: "POST /event-cinema/bookings/${bB}/presale-sales"
              payload: { quantity: 4999 }
              as: Theater
              as_user_id: "${th_id}"
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /event-cinema/bookings/${bA}/presale-checkpoint"
              payload: { expected_booking_version: "${bA_v4}" }
              as: PlatformOps
              captures: { statusA: $.data.status, ticketsA: $.data.pre_sale_tickets }
            - call: "POST /event-cinema/bookings/${bB}/presale-checkpoint"
              payload: { expected_booking_version: "${bB_v4}" }
              as: PlatformOps
              captures: { statusB: $.data.status, ticketsB: $.data.pre_sale_tickets }
          assert:
            - "both bookings reached ON_SALE before the checkpoint — ${swept} == 2"
            - "the exact-equality booking survives — ${ticketsA} == 5000 and ${statusA} == ON_SALE"
            - "the one-ticket-short booking is cancelled — ${ticketsB} == 4999 and ${statusB} == CANCELLED"
            - "cancellation released the short booking's screens — GET /event-cinema/bookings/${bB} reports committed_screens_total == 0"

      - name: feed_outage_minimum_five_minutes_boundary
        grounds:
          - validations[priority=31]
          - errors[ERR_FEED_OUTAGE_TOO_SHORT]
          - state_machines.FeedEvent.DETECTED_to_CONFIRMED
          - calculations.makegood_credit_derivation
        distinguishing_aspect: |
          The outage gate is a >= comparison over whole minutes reached through
          POST /feed-events/{id}/confirm: outage_minutes 5 confirms the failure and
          unlocks the RATE_TIER_3 credit tier, while outage_minutes 4 is refused
          outright. The boundary sits on a duration metric, not on a ticket count.
        test_recipe:
          setup:
            - "Standard CA fixture. Booking APPROVED with one 120-minute screening at 19:00 UTC on 2026-12-01, then driven to ON_SALE."
            - "Two feed events detected at 2026-12-01T19:05:00Z: one with outage_minutes 5, one with outage_minutes 4."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/feed-events"
              payload: { booking_id: "${b_id}", failure_type: "FEED_LOSS", detected_at_utc: "2026-12-01T19:05:00Z", outage_minutes: 5 }
              as: PlatformOps
              captures: { fe_ok: $.data.id }
            - call: "POST /event-cinema/feed-events"
              payload: { booking_id: "${b_id}", failure_type: "SATELLITE_OUTAGE", detected_at_utc: "2026-12-01T19:05:00Z", outage_minutes: 4 }
              as: PlatformOps
              captures: { fe_short: $.data.id }
          trigger:
            - call: "POST /event-cinema/feed-events/${fe_ok}/confirm"
              payload: {}
              as: PlatformOps
              captures: { ok_state: $.data.state, ok_affected: $.data.affected_screening_count }
            - call: "POST /event-cinema/feed-events/${fe_short}/confirm"
              payload: {}
              as: PlatformOps
              captures: { short_err: "$.data.error_id", short_state: $.data.state }
          assert:
            - "exactly five minutes confirms the failure — ${ok_state} == CONFIRMED"
            - "four minutes is refused at 422 — ${short_err} == ERR_FEED_OUTAGE_TOO_SHORT"
            - "the refused event never changes state — ${short_state} == DETECTED"
            - "the confirmed event carries one affected screening, the one already running at detection — ${ok_affected} == 1"

  # ===========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: booking_submit_requires_accredited_circuit
        grounds:
          - state_machines.Booking.DRAFT_to_PENDING_APPROVAL
          - state_machines.Circuit.PENDING_to_ACCREDITED
          - entities.Circuit.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The Booking->Circuit pair: a booking that satisfies every one of its own
          preconditions still cannot submit while its circuit sits in PENDING,
          because the transition is gated on another entity's state.
        test_recipe:
          setup:
            - "Standard CA fixture, but the circuit is deliberately left PENDING and never accredited. Booking has a 60-screen line, guarantee 600000 below the ceiling, on_sale_at in the future, title BOOKABLE."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - *k_line_60
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { blocked_err: "$.data.error_id" }
            - call: "POST /event-cinema/circuits/${circ_id}/accredit"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { allowed_status: $.data.status }
          assert:
            - "the submit is refused while the circuit is not accredited — ${blocked_err} == ERR_INVALID_STATE"
            - "the booking's own preconditions are all satisfied — committed_screens_total 60 >= min_screens 1 and guarantee 600000 is inside [1000000-floor, ceiling], so the only blocker is the circuit's state"
            - "accrediting the circuit alone unblocks the same request — ${allowed_status} == PENDING_APPROVAL with no change to the booking payload"

      - name: key_issue_requires_verified_content_delivery
        grounds:
          - state_machines.EncryptionKey.PENDING_to_ISSUED
          - state_machines.Screening.SCHEDULED_to_SCREENED
          - state_machines.Booking.APPROVED_to_ON_SALE
          - errors[ERR_DELIVERY_NOT_VERIFIED]
        distinguishing_aspect: |
          The EncryptionKey->ContentDelivery pair: the screening is correctly
          scheduled and the booking is in a key-issuable status, yet issuance is
          refused because the delivery package has only reached DELIVERED and not
          VERIFIED. A different entity pair from the Booking->Circuit instance.
        test_recipe:
          setup:
            - "Standard CA fixture, booking APPROVED with one screening and a file delivery marked DELIVERED but left unverified."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:7788aabb", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_id: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:7788aabb" }
              as: PlatformOps
              captures: { cd_state: $.data.status }
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T00:00:00Z", not_valid_after_utc: "2026-12-01T03:00:00Z" }
              as: PlatformOps
              captures: { key_id: $.data.id }
          trigger:
            - call: "POST /event-cinema/keys/${key_id}/issue"
              payload: {}
              as: PlatformOps
              captures: { blocked2: "$.data.error_id" }
            - call: "POST /event-cinema/content-deliveries/${cd_id}/verify"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/keys/${key_id}/issue"
              payload: {}
              as: PlatformOps
              captures: { key_after: $.data.issuance_status, key_ref: $.data.key_ref }
          assert:
            - "the delivery reached DELIVERED but not VERIFIED — ${cd_state} == DELIVERED"
            - "issuance is refused on the delivery's state — ${blocked2} == ERR_DELIVERY_NOT_VERIFIED"
            - "verifying the package alone unblocks the same request — ${key_after} == ISSUED"
            - "a system-minted key reference appears only on issuance — ${key_ref} is a non-null opaque string"

  # ===========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: cross_booking_auditorium_overlap_half_open
        grounds:
          - validations[priority=16]
          - errors[ERR_SCREEN_OVERLAP_CONFLICT]
          - entities.Screening.fields.starts_at
          - state_machines.Booking.ON_SALE_to_CONFIRMED
        distinguishing_aspect: |
          The Screening resource uses raw HALF-OPEN interval arithmetic
          (candidate.starts_at < existing.ends_at AND candidate.ends_at > existing.starts_at)
          scoped to OTHER LIVE bookings only: a screening starting exactly when
          another booking's screening ends is accepted, while one starting a minute
          earlier collides. The buffer is not part of this interval.
        test_recipe:
          setup:
            - "Standard CA fixture with an A-rated circuit. Booking A APPROVED with a 120-minute screening 19:00-21:00 at auditorium AUD-1, then driven to ON_SALE and confirmed."
            - "Booking B APPROVED with a screening scheduled to start at exactly 21:00 in the same auditorium."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - &k_circ_a
              call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Granite Screen Group", circuit_code: "GRNT", credit_rating: "A", settlement_terms: "NET_30", screen_pool_total: 400, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - *k_acc_b
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Granite Fresno", city: "Fresno", state_code: "CA", timezone: "America/Los_Angeles", seats_total: 200, screen_count: 4, showtime_buffer_minutes: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { th_id: $.data.id }
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { bA: $.data.id, bA_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/bookings/${bA}/confirm"
              payload: { expected_booking_version: "${bA_v4}" }
              as: PlatformOps
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1260, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { bB: $.data.id, bB_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${bB}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 40, expected_attendance: 80, expected_booking_version: "${bB_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { lineB: $.data.id, bB_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${bB}/submit"
              payload: { expected_booking_version: "${bB_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { bB_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${bB}/approve"
              payload: { line_id: "${lineB}", expected_booking_version: "${bB_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { bB_v4: $.data.version }
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /event-cinema/bookings/${bB}/confirm"
              payload: { expected_booking_version: "${bB_v4}" }
              as: PlatformOps
              captures: { bB_final: $.data.status }
            - call: "POST /event-cinema/screenings"
              payload: { booking_id: "${bB}", theater_id: "${th_id}", auditorium: "AUD-1", starts_at: "2026-12-01T20:59:00Z", ends_at: "2026-12-01T22:59:00Z" }
              as: PlatformOps
              captures: { overlap_err: "$.data.error_id" }
          assert:
            - "bookings A and B landed on the same auditorium at adjacent hours — A runs 19:00-21:00 and B starts at 21:00"
            - "exact adjacency at a shared endpoint is accepted, so B confirmed — ${bB_final} == CONFIRMED"
            - "one minute of intersection is rejected — ${overlap_err} == ERR_SCREEN_OVERLAP_CONFLICT at 409"
            - "the rejection is by raw half-open arithmetic, not by the buffer: the candidate ends 2100Z while B's own screening starts 2100Z, so no buffer band is involved"

      - name: same_booking_key_window_overlap_on_screening
        grounds:
          - validations[priority=18]
          - errors[ERR_KEY_WINDOW_OVERLAP]
          - entities.EncryptionKey.fields.not_valid_before_utc
          - state_machines.EncryptionKey.PENDING_to_ISSUED
        distinguishing_aspect: |
          The EncryptionKey resource on a single Screening is governed by a
          different interval semantics again — a NON-AGGREGATE capacity rule over
          inclusive validity bounds: at most one live key may cover any instant, so
          a second key whose validity interval touches the first at a single shared
          endpoint is still rejected. It sits on a different resource from the
          Screening instance and uses inclusive rather than half-open bounds.
        test_recipe:
          setup:
            - "Standard CA fixture, booking APPROVED with one screening 19:00-21:00 on 2026-12-01 and a verified file delivery."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "SATELLITE", content_checksum: "sha256:99aabbcc", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_id: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:99aabbcc" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries/${cd_id}/verify"
              payload: {}
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T18:00:00Z", not_valid_after_utc: "2026-12-01T20:00:00Z" }
              as: PlatformOps
              captures: { key1_id: $.data.id }
          trigger:
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T20:00:00Z", not_valid_after_utc: "2026-12-01T22:00:00Z" }
              as: PlatformOps
              captures: { touch_err: "$.data.error_id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T20:01:00Z", not_valid_after_utc: "2026-12-01T22:00:00Z" }
              as: PlatformOps
              captures: { ok_key: $.data.id, ok_state: $.data.issuance_status }
            - call: "POST /event-cinema/keys/${key1_id}/revoke"
              payload: { revocation_reason: "CONTENT_FAILURE" }
              as: ContentOfficer
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T18:00:00Z", not_valid_after_utc: "2026-12-01T20:00:00Z" }
              as: PlatformOps
              captures: { reused_id: $.data.id }
          assert:
            - "a key whose window merely touches the live key at 20:00 is rejected — ${touch_err} == ERR_KEY_WINDOW_OVERLAP, because validity bounds are INCLUSIVE on both ends"
            - "moving the start one minute clear is accepted — ${ok_state} == PENDING for key ${ok_key}"
            - "the inclusive-bound rule is what makes the touching case a conflict; the raw half-open rule of the other instance would have allowed it"
            - "once the first key is REVOKED it no longer holds the instant — the same 18:00-20:00 window can be reissued as ${reused_id}"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: screen_commitment_conserved_across_release
        grounds:
          - endpoints.POST_/bookings/{id}/approve
          - endpoints.POST_/bookings/{id}/release-screens
          - entities.Circuit.fields.committed_screens_balance
          - state_machines.Booking.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          The conserved quantity is a screen COUNT: committing then releasing must
          return Circuit.committed_screens_balance to its prior value exactly, with
          no drift. The forward action is approve and the compensating action is
          release-screens.
        test_recipe:
          setup:
            - "Standard CA fixture with an A-rated circuit whose screen_pool_total is 400. Booking APPROVED committing one 40-screen line."
            - "Clock at 2026-09-15T00:00:00Z; the circuit's committed_screens_balance is 40 before the compensation."
          setup_api_calls:
            - *k_clock
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformOps
            - *k_dist
            - &k_circ_pool
              call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Pinnacle Screen Holdings", circuit_code: "PNCL", credit_rating: "A", settlement_terms: "NET_30", screen_pool_total: 400, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 40, expected_attendance: 100, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id, b_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "GET /event-cinema/circuits/${circ_id}"
              payload: {}
              as: PlatformOps
              captures: { bal_after_commit: $.data.committed_screens_balance }
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/release-screens"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v4}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { released_state: $.data.exhibit_state, b_v5: $.data.version }
            - call: "GET /event-cinema/circuits/${circ_id}"
              payload: {}
              as: PlatformOps
              captures: { bal_after_release: $.data.committed_screens_balance }
            - call: "GET /event-cinema/theaters/${th_id}"
              payload: {}
              as: PlatformOps
              captures: { rekey_after_release: $.data.pending_rekey_count }
          assert:
            - "the forward action committed 40 screens against the pool — ${bal_after_commit} == 40"
            - "the compensation released the line — ${released_state} == RELEASED"
            - "the conserved quantity returns to its pre-commitment value of 0 — ${bal_after_release} == 0, so the invariant CIRCUIT_COMMITTED_SCREENS_AFTER == CIRCUIT_COMMITTED_SCREENS_BEFORE holds exactly"
            - "its screenings were cancelled and their keys revoked as part of the same compensation — ${rekey_after_release} == 1"
            - "Booking.${b_id}.committed_screens_total == 0 after the release"

      - name: settlement_net_conserved_across_close_and_reopen
        grounds:
          - calculations.settlement_split
          - entities.Settlement.fields.distributor_net_cents
          - entities.Settlement.fields.exhibitor_net_cents
          - entities.Settlement.fields.invariant_drift_cents
        distinguishing_aspect: |
          The conserved quantity here is CENTS: distributor_net + exhibitor_net must
          equal gross + topup + adjustment at all times, including across a close
          and a reopen that returns the settlement to its exact prior net. Different
          conserved quantity type from the screen count of the other instance.
        test_recipe:
          setup:
            - "Standard CA fixture. NET_30 circuit, booking with guarantee 1000000 and share 0.40, one reported line, gross 3000000 by legacy reporting, top-up 0, adjustment 0."
            - "Clock at 2027-01-20T00:00:00Z, after the screening ran."
          setup_api_calls:
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - *k_dist
            - &k_circ_net
              call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Anchor Ledger Cinemas", circuit_code: "ANCH", credit_rating: "A", settlement_terms: "NET_30", screen_pool_total: 300, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 30, expected_attendance: 100, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id, b_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/bookings/${b_id}/confirm"
              payload: { expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { b_v5: $.data.version }
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T21:30:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/screenings/${scr_id}/report"
              payload: { reported_attendance: 175, reported_outcome: "SCREENED" }
              as: Theater
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /event-cinema/settlements"
              payload: { booking_id: "${b_id}", gross_box_office_cents: 3000000, reported_line_count: 1, topup_paid_cents: 0, adjustment_cents: 0 }
              as: FinanceOps
              captures: { settle_id: $.data.id, net_before: $.data.distributor_net_cents, exh_before: $.data.exhibitor_net_cents, drift_before: $.data.invariant_drift_cents }
            - call: "POST /event-cinema/settlements/${settle_id}/reopen"
              payload: {}
              as: FinanceOps
              captures: { reopened_status: $.data.status, net_reopened: $.data.distributor_net_cents }
            - call: "POST /event-cinema/settlements/${settle_id}/close"
              payload: {}
              as: FinanceOps
              captures: { closed_status: $.data.status, net_after: $.data.distributor_net_cents, exh_after: $.data.exhibitor_net_cents, drift_after: $.data.invariant_drift_cents }
          assert:
            - "the split conserves cents on creation — ${net_before} == 1800000, ${exh_before} == 1200000 and 1800000 + 1200000 == 3000000 + 0 + 0"
            - "the recorded residual is exactly zero — ${drift_before} == 0"
            - "reopening does not move the distributor net — ${net_reopened} == 1800000 and ${reopened_status} == REOPENED"
            - "closing again restores the same split — ${net_after} == 1800000 and ${exh_after} == 1200000, so SETTLEMENT_DISTRIBUTOR_NET + SETTLEMENT_EXHIBITOR_NET == GROSS + TOPUP + ADJUSTMENT holds across the full close-reopen-close cycle"
            - "no drift accumulated across the cycle — ${drift_after} == 0 and Settlement.${settle_id}.closed_at_utc is non-null"
