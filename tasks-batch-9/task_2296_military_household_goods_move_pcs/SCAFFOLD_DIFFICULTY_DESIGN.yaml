      - name: weight_allowance_table_lookup_with_move_type_floor_and_cap
        grounds:
          - calculations.entitlement_weight_allowance
          - state_machines.CounselingSession.SCHEDULED_to_COMPLETED
          - entities.EntitlementAuthorization.fields.base_weight_allowance_lbs
          - entities.PcsOrder.fields.dependents_count_at_issue
        distinguishing_aspect: >-
          Mode (a) — three independent inputs (rank tier, effective dependent status, move type)
          combine through a table lookup followed by a conditional branch that is a FLOOR for
          LOCAL moves and a MIN cap for separations: O4 without dependents on a LOCAL move yields
          floor(14000 x 0.50) = 7000 while E9 with dependents on a SEPARATION yields
          min(15000, 13000) = 13000, and neither number appears in the raw allowance table.
