  # ---------------------------------------------------------------------------
  # Section: validations — violation->error, satisfaction, priority ordering
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unauthenticated_unknown_entity_backed_user
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "An entity-backed role whose X-User-ID does not resolve to an existing InstitutionUser fails authentication with 401 ERR_UNAUTHENTICATED before any role or existence check runs."
        test_recipe:
          setup:
            - "One institution exists"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
          trigger:
            - { call: "GET /institutions/${inst_id}", payload: {}, as: RegistrarSubmitter, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_UNAUTHENTICATED"

      - name: role_gate_preempts_existence_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=11]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_FILE_NOT_FOUND]
        distinguishing_aspect: "Pair (auth vs existence): a Requester reading a NON-EXISTENT enrollment file gets ERR_UNAUTHORIZED (role not in the endpoint's roles, priority 2), not ERR_FILE_NOT_FOUND (priority 11)."
        test_recipe:
          setup:
            - "One requester account exists (identity resolves); no enrollment files exist"
          setup_api_calls:
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER" }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
          trigger:
            - { call: "GET /enrollment-files/00000000-0000-0000-0000-000000000000", payload: {}, as: Requester, as_user_id: "${rq_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_UNAUTHORIZED (role gate fires before the file's existence is consulted)"

      - name: cross_institution_preempts_period_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_CROSS_INSTITUTION_ACCESS]
          - errors[ERR_PERIOD_NOT_FOUND]
        distinguishing_aspect: "Pair (auth tenancy vs existence): institution B's submitter uploading against institution A gets ERR_CROSS_INSTITUTION_ACCESS (priority 4) even when the referenced period id is bogus (priority 9); the same error fires with a real period of A."
        test_recipe:
          setup:
            - "Institutions A and B, each with their own submitter; A has an ACTIVE agreement and an OPEN period (version captured)"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "University A", ope_id: "00123400", users: [ { email: "sub@a.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_a: "$.data.id", sub_a: "$.data.users[0].id" } }
            - { call: "POST /institutions", payload: { name: "University B", ope_id: "00999900", users: [ { email: "sub@b.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_b: "$.data.id", sub_b: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_a}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_a}/reporting-periods", payload: { term_label: "Early Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_a: "$.data.id" } }
            - { call: "GET /institutions/${inst_a}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { pa_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_a}", reporting_period_id: "00000000-0000-0000-0000-000000000000", expected_reporting_period_version: "${pa_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_b}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_a}", reporting_period_id: "${period_a}", expected_reporting_period_version: "${pa_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_b}", captures: { err2: "$.data.error_id" } }
          assert:
            - "captured err1 == ERR_CROSS_INSTITUTION_ACCESS (tenancy precedes period existence)"
            - "captured err2 == ERR_CROSS_INSTITUTION_ACCESS (base cross-institution trigger)"

