              as: ManufacturingPlanner
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-PG-09", product_id: "${np_id}", quantity: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
            - call: "POST /supply/manufacturing-lots"
