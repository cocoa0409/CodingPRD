              captures: { score_after: $.data.readiness_score }
          assert:
            - "score_before == 80 (40 + max(0,25-10) + 25 = 80; overdue gap is excluded from open_count so multiplier stays 1.0)"
            - "score_after == 90 (40 + 25 + 25) — the DRAFT read reconciles against live gap state"

