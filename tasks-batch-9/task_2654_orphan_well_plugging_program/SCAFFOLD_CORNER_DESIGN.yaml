              payload: { api_well_number: "49-001-02110", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_v: $.data.version }
