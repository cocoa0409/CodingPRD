            - "after that successful issue GET /carriage/distributors/${d4_id} returns receivable_balance_cents == 4784000 and GET /carriage/marketing-commitments/${coop1_id} returns billed_cents == 416000 and earned_unbilled_cents == 84000"

      - instance_id: CE-3
        name: window_clear_blocked_by_title_rights_status
        grounds:
          - validations[priority=42]
          - errors[ERR_TITLE_RIGHTS_NOT_CLEARED]
          - state_machines.RightsWindow.PLANNED_to_CLEARED
          - entities.ContentTitle.fields.rights_status
        title: "Window clearance depends on the content title's rights standing, two aggregates away from the window"
        dependency: "RightsWindow.status == PLANNED is admissible, but ContentTitle.rights_status must be OWNED_CLEARED"
        rationale: >-
          Clearing a window is a rights act, so it is gated on the title's rights
          standing — an entity the window merely references, and one whose state is
          changed by a different role on a different endpoint. Priority 42 sits
          above every interval and capacity rule, so a title that is not cleared
          fails BEFORE any overlap arithmetic runs; that ordering is observable
          because the same window would otherwise have been the very first
          occupant of an empty resource and could not possibly conflict.
        distinguishing_aspect: >-
          409 ERR_TITLE_RIGHTS_NOT_CLEARED for a title left at
          THIRD_PARTY_LICENSED, with the window still at PLANNED,
          concurrent_licensee_count still null and the title's
          cleared_window_count still 0. Moving the title to OWNED_CLEARED and
          replaying the identical call returns 200 with concurrent_licensee_count
          == 0 — proving the occupancy scan was never reached the first time.
        test_recipe:
          setup: >-
            Northgate's flagship agreement is executed. A title premiering on
            linear 2026-08-15 is registered and then explicitly marked
            THIRD_PARTY_LICENSED — the network holds a licence but not the clean
            rights the distribution grant requires. An EXCLUSIVE STREAMING window
            over US territory is planned for 2026-09-01..2026-09-30, which is 17
            days after premiere and therefore clears the 7-day streaming holdback,
            lies wholly inside the agreement term, and is the only window on its
            resource key.
