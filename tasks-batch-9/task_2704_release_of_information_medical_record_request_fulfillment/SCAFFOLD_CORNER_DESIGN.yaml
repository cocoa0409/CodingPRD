            - "the disposition response is a RecordSegment, yet the very next GET /roi/requests/${rq} already reports total_pages == 40 and billable_pages == 40: the parent aggregate is re-derived inside the child write, not later"
            - "GET /roi/facilities/${fac} taken after the DRAFT invoice exists still reports receivable_cents 0, collected_cents 0, written_off_cents 0 — a DRAFT is deliberately outside the money ledger, so 'immediate' does not mean 'eager'"
