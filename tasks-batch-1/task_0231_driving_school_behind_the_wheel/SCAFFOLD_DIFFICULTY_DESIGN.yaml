          assert:
            - "response error_id == ERR_GUARDIAN_CONSENT_REQUIRED"
            - "GuardianConsent.${gc_id}.status == PENDING"
            - "Enrollment.${enr_id}.status == DRAFT (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_overlap_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.Lesson.fields.start_at
          - errors[ERR_INSTRUCTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Instructor interval semantics = half-open [start,end) with NO buffer: a second
          lesson starting exactly at the first's end_at is ALLOWED (adjacency), but one
          overlapping by even a minute is rejected ERR_INSTRUCTOR_DOUBLE_BOOKED. Resource = Instructor.
        test_recipe:
          setup:
            - "Instructor with a SCHEDULED CLASSROOM lesson 09:00-10:00 for student A; a second student B exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "OV_PKG", name: "Ov Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 30, included_online_hours: 0, included_road_hours: 0, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Oz Over", email: "oz@x.com", certified_road: false, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", email: "stua@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${sa_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { ea_id: $.data.id }
            - call: "POST /enrollments/${ea_id}/activate"
              payload: {}
              as: SchoolAdmin
              captures: { sav: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${sa_id}", enrollment_id: "${ea_id}", lesson_type: "CLASSROOM", start_at: "2026-06-10T09:00:00.000Z", end_at: "2026-06-10T10:00:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sav}" }
              as: SchoolAdmin
            - call: "POST /students"
              payload: { full_name: "Stu B", email: "stub@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${sb_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { eb_id: $.data.id }
            - call: "POST /enrollments/${eb_id}/activate"
              payload: {}
              as: SchoolAdmin
              captures: { sbv: $.data.version }
          trigger:
            - call: "POST /lessons"
              payload: { student_id: "${sb_id}", enrollment_id: "${eb_id}", lesson_type: "CLASSROOM", start_at: "2026-06-10T09:30:00.000Z", end_at: "2026-06-10T10:30:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sbv}" }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSTRUCTOR_DOUBLE_BOOKED (09:30 overlaps [09:00,10:00))"
            - "A control lesson at 10:00-11:00 for student B (adjacency at end_at) is created successfully (201)"

      - name: vehicle_overlap_includes_prep_buffer_after
        grounds:
          - validations[priority=12]
          - entities.Vehicle.fields.prep_buffer_minutes
          - errors[ERR_VEHICLE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Vehicle interval semantics DIFFER: the booked interval is padded by
          prep_buffer_minutes AFTER end (15 min), so a new lesson starting at the
          first's end_at (which would be fine for the instructor) collides with the
          vehicle's post-lesson buffer and is rejected ERR_VEHICLE_DOUBLE_BOOKED. Resource = Vehicle.
        test_recipe:
          setup:
            - "Vehicle with prep_buffer_minutes 15 and a SCHEDULED ROAD lesson 09:00-10:00 (buffer extends occupancy to 10:15); two PERMITTED students with distinct certified instructors."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "VB_PKG", name: "Vb Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 0, included_online_hours: 0, included_road_hours: 6, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
