            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u3_id}", expected_unit_version: "${u3_v}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { t3_id: $.data.id } }
            - { call: "POST /iz-compliance/resale-transactions/${t3_id}/approve-price", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-31T12:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/resale-transactions/${t3_id}/rofr-decision", payload: { decision: "WAIVE" }, as: ProgramAdministrator, captures: { err_rofr: $.data.error_id } }
          assert:
            - "the over-ceiling submission returns 201: ResaleTransaction.${t1_id}.state is SUBMITTED with proposed_price_cents 33000000, max_resale_price_cents 32500000 and indexed_base_cents 32500000"
            - "approve-price on ${t1_id} returns 422 ERR_RESALE_PRICE_EXCEEDS_MAX; the transaction stays SUBMITTED with price_approved_at and price_approved_by_user_id both null"
            - "approve-price on ${t2_id} returns 200 with state PRICE_APPROVED, price_approved_by_user_id hco-1 and rofr_deadline 2026-08-31T00:00:00Z"
            - "the EXERCISE decision returns 422 ERR_INSUFFICIENT_FUND_BALANCE — GET /iz-compliance/trust-fund-summary reports unencumbered_balance_cents 0 against the 32000000 the city would have to commit — and ${t2_id} stays PRICE_APPROVED with rofr_auto_waived false"
            - "the WAIVE decision on the SAME transaction returns 200 and state ROFR_WAIVED: the fund check applies only to the exercising branch"
            - "certify-buyer with ${c2_id} returns 422 ERR_BUYER_CERTIFICATION_MISMATCH because that certification belongs to ${h2_id}, not to the named buyer ${h4_id}, even though it is CERTIFIED and for the right unit"
            - "the certify-buyer failure is priority 40, not 21: the acting officer hco-2 differs from the approver hco-1, so the segregation rule passes first"
            - "${t2_id} stays ROFR_WAIVED with buyer_household_id and buyer_certification_id still null"
            - "after the clock moves to 2026-08-31T12:00:00Z the WAIVE decision on ${t3_id} returns 409 ERR_ROFR_WINDOW_EXPIRED: now is past the 2026-08-31T00:00:00Z deadline"
            - "${t3_id} is still PRICE_APPROVED with rofr_auto_waived false — the sweep is calendar-date granular and 2026-08-31 is not yet strictly past, so the refusal comes from the instant-precise decision check alone"

      - name: trust_fund_draw_guards_over_the_admin_cap_the_balance_and_the_draw_state
        claim_type: violation_to_error
        grounds:
          - validations.priority_20
          - validations.priority_48
          - validations.priority_49
          - errors[ERR_ADMIN_USE_CAP_EXCEEDED]
          - errors[ERR_INSUFFICIENT_FUND_BALANCE]
          - errors[ERR_DISBURSEMENT_STATE_INVALID]
        distinguishing_aspect: |
          The fund-use restrictions are two nested caps over the same money and both are probed at
          their exact boundary. An ADMIN draw of exactly admin_cap_cents 18912000 is accepted and
          one further cent is refused, which pins the cap as inclusive; a production draw of
          exactly the remaining unencumbered_balance_cents would be accepted while one cent more
          is refused, which pins the balance check against the ENCUMBERED total rather than the
          gross inflow. The draw's own lifecycle then refuses a second disburse and a second void,
          and voiding a DISBURSED draw returns every cent, so the ledger ends exactly where it began.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (C-2, 40 units, approval 2026-01-15, dev-1) screened SUBJECT: 8 required units, fractional_obligation_bps 0, total_obligation_bps 80000; IN_LIEU_FEE elected."
            - "A FULL assessment prices all 80000 bps: base 192000000, surcharge 5000000 (the 350 bps raw 6720000 is clamped to the cap), pre-discount total 197000000, 400 bps tier, discount 7880000, assessed 189120000 — paid in a single payment, so the fund holds 189120000 with admin_cap_cents 18912000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Fund Filler", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-1", captures: { p_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${p_id}", basis: "FULL", expected_project_version: "${p_v}" }, as: ProgramAdministrator, captures: { f_id: $.data.id } }
            - { call: "POST /iz-compliance/in-lieu-fees/${f_id}/payments", payload: { amount_cents: 189120000 }, as: Developer, as_user_id: "dev-1" }
          trigger:
            - { call: "POST /iz-compliance/trust-fund-disbursements", payload: { source_fee_id: "${f_id}", eligible_use: "ADMIN", amount_cents: 18912000 }, as: ProgramAdministrator, captures: { d1_id: $.data.id } }
            - { call: "POST /iz-compliance/trust-fund-disbursements", payload: { source_fee_id: "${f_id}", eligible_use: "ADMIN", amount_cents: 1 }, as: ProgramAdministrator, captures: { err_admin: $.data.error_id } }
            - { call: "POST /iz-compliance/trust-fund-disbursements", payload: { source_fee_id: "${f_id}", eligible_use: "AFFORDABLE_HOUSING_PRODUCTION", amount_cents: 170208001 }, as: ProgramAdministrator, captures: { err_bal: $.data.error_id } }
            - { call: "POST /iz-compliance/trust-fund-disbursements/${d1_id}/disburse", payload: {}, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/trust-fund-disbursements/${d1_id}/disburse", payload: {}, as: ProgramAdministrator, captures: { err_dis: $.data.error_id } }
            - { call: "POST /iz-compliance/trust-fund-disbursements/${d1_id}/void", payload: { void_reason: "Administrative allocation rescinded" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/trust-fund-disbursements/${d1_id}/void", payload: { void_reason: "Second attempt at the same void" }, as: ProgramAdministrator, captures: { err_void: $.data.error_id } }
            - { call: "GET /iz-compliance/trust-fund-summary", payload: {}, as: FundAuditor, as_user_id: "aud-1" }
          assert:
            - "InLieuFee.${f_id}.surcharge_cents == 5000000 (clamped) and assessed_amount_cents == 189120000 with state PAID"
            - "the ADMIN draw of exactly 18912000 returns 201 with state REQUESTED — the cap is inclusive"
            - "one further ADMIN cent returns 422 ERR_ADMIN_USE_CAP_EXCEEDED: admin_committed_cents 18912000 plus 1 exceeds admin_cap_cents 18912000"
            - "the 170208001 production draw returns 422 ERR_INSUFFICIENT_FUND_BALANCE: unencumbered_balance_cents is 170208000 because the ADMIN request is encumbered, not because the fund never held 189120000"
            - "the first disburse returns 200 with state DISBURSED and disbursed_at 2026-08-01T00:00:00Z, and unencumbered_balance_cents is still 170208000 — the money moves between buckets, not out of the fund total"
            - "the second disburse returns 409 ERR_DISBURSEMENT_STATE_INVALID and disbursed_at is not overwritten"
            - "the void returns 200 with state VOIDED and void_reason recorded"
            - "the second void returns 409 ERR_DISBURSEMENT_STATE_INVALID with void_reason still holding the FIRST reason — a refused call writes nothing"
            - "the closing summary reports encumbered_cents 0, disbursed_cents 0, admin_committed_cents 0 and unencumbered_balance_cents 189120000, exactly the pre-request ledger"

      - name: the_fully_compliant_project_passes_every_guard_end_to_end
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_24
          - validations.priority_25
          - validations.priority_58
          - validations.priority_59
          - validations.priority_60
        distinguishing_aspect: |
          The mirror image of the four close-out refusals: one project walks the whole lifecycle
          and every guard that can refuse returns a 2xx instead. The comparability standard is
          satisfied at EXACTLY its floor (800 sqft against a 1000 sqft comparable is exactly 8000
          bps), the single unit is a two-bedroom so the family-unit floor holds, the obligation is
          met entirely onsite so no fee exists to be outstanding, and the annual review reports the
          rent at exactly the 143872 ceiling and an income inside the limit with occupancy verified,
          so it lands in COMPLIANT with no finding to block close-out.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 10 units, approval 2026-01-15, dev-1): the threshold is inclusive at 10, so screening yields SUBJECT with 1 required unit and total_obligation_bps 10000."
            - "Household H1 (size 3, income 6000000) registered, under the 6334900 limit."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: ProgramAdministrator, captures: { h1_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/projects", payload: { name: "Clean Close", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-CL-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "CL-101", bedrooms: 2, sqft: 800, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/marketing-plans", payload: { project_id: "${p_id}", lottery_open_at: "2026-08-05T00:00:00Z", lottery_close_at: "2026-08-20T00:00:00Z", preference_categories: ["LOCAL_WORKER"] }, as: Developer, as_user_id: "dev-1", captures: { mp_id: $.data.id } }
            - { call: "POST /iz-compliance/marketing-plans/${mp_id}/review", payload: { decision: "APPROVE" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/lottery-events", payload: { marketing_plan_id: "${mp_id}", units_offered: 1, eligibility_level_bps: 5000 }, as: ProgramAdministrator, captures: { le_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/households/${h1_id}/apply", payload: { lottery_event_id: "${le_id}", preference_claims: ["LOCAL_WORKER"] }, as: Resident, as_user_id: "${h1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/lottery-events/${le_id}/draw", payload: {}, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 143872, effective_date: "2026-08-20" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u_id}", review_year: 2027, reported_rent_cents: 143872, reported_income_cents: 6000000, occupancy_verified: true }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { mv_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/close-out", payload: {}, as: ProgramAdministrator }
          assert:
            - "every call in the trigger sequence returns 2xx — 201 for the creations and 200 for the actions — and no error envelope is produced anywhere"
            - "unit creation is accepted with sqft 800 against market_comparable_sqft 1000: that is exactly the 8000 bps comparability floor, so the standard is satisfied at its boundary rather than strictly above it"
            - "Household.${h1_id} scores 100 preference points for the LOCAL_WORKER claim the plan does list, is selected at rank_position 1, and AffordableUnit.${u_id} moves PLANNED -> MARKETING -> RESERVED -> OCCUPIED"
            - "IncomeCertification.${c_id}.max_rent_cents == 143872 and the unit's current_rent_cents equals it exactly"
            - "MonitoringReview.${mv_id}.state == COMPLIANT with finding_types [], cure_deadline null and penalty_at_base_cents 0 — a rent equal to the ceiling is not an overcharge"
            - "AffordableUnit.${u_id}.compliance_status stays COMPLIANT, so no unit-level finding exists"
            - "close-out returns 200 with Project.${p_id}.state CLOSED_OUT, closed_out_at 2027-03-01T00:00:00Z and compliance_posture COMPLIANT_ONSITE"
            - "the project carries no InLieuFee at all: GET /iz-compliance/in-lieu-fees filtered to this project returns total_count 0, so rung 59 passes vacuously"

      - name: excluded_priority_conflict_between_fee_state_and_the_overpayment_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_19
          - validations.priority_43
        excluded_because:
          difficulty_instance: superseded_fee_payment_state_beats_fiscal_overpayment
          rationale: |
            The one payment call that violates BOTH the state rule at 19 and the fiscal rule at 43
            is already constructed in §1.8 against a SUPERSEDED assessment with an over-balance
            amount, and it asserts ERR_FEE_NOT_PAYABLE rather than ERR_PAYMENT_EXCEEDS_BALANCE. A
            corner instance could only restate that pair.

      - name: excluded_priority_conflict_between_unit_safety_and_prior_transaction_linkage
        claim_type: priority_ordering
        grounds:
          - validations.priority_22
          - validations.priority_39
        excluded_because:
          difficulty_instance: out_of_compliance_safety_beats_prior_transaction_referential
          rationale: |
            §1.8 already submits a single resale that both names a prior_transaction_id belonging to
            another unit and targets an OUT_OF_COMPLIANCE unit, and pins the answer to
            ERR_UNIT_OUT_OF_COMPLIANCE at priority 22. The remaining priority pairs in this
            scaffold are asserted inline by the validations instances above, each of which states
            which lower rung would otherwise have fired.

  # ===========================================================================
  # SECTION 5 — Endpoints (Table 5 rows): one instance per endpoint shape that
  # the other sections do not already exercise as a side effect.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: patching_a_screened_project_reverts_it_to_draft_and_clears_the_outputs
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/iz-compliance/projects/{project_id}
          - state_machines.Project.SCREENED_SUBJECT_to_DRAFT
        distinguishing_aspect: |
          The partial update is not a field write: amending any entitlement fact re-opens screening,
          so the response must show state DRAFT, applicability PENDING, ordinance_id and
          compliance_path cleared and every obligation aggregate zeroed in the SAME response. A
          field the payload omits keeps its stored value, and screen_count is deliberately NOT
          reset, so the second screening reports 2 — which is how the re-screen is observable at all.
          The re-screen then recomputes from the amended total_units, turning a 20-unit obligation
          of 20000 bps into a 40-unit obligation of 40000 bps.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, approval 2026-01-15, dev-1) screened SUBJECT with 2 required units and total_obligation_bps 20000, then PATH_ELECTED with compliance_path ONSITE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Amend Alley", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
          trigger:
            - { call: "PATCH /iz-compliance/projects/${p_id}", payload: { total_units: 40 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
          assert:
            - "the PATCH returns 200 with total_units 40, state DRAFT, applicability PENDING, ordinance_id null, compliance_path null, required_affordable_units 0, fractional_obligation_bps 0, total_obligation_bps 0 and compliance_posture PENDING — every derived output is cleared in the same response"
            - "the omitted fields are untouched: name is still 'Amend Alley', zoning_district still R-2 and approval_date still 2026-01-15"
            - "Project.${p_id}.version incremented by exactly 1 across the PATCH"
            - "screen_count is NOT reset by the PATCH: the second screen returns screen_count 2"
            - "the second screen returns SCREENED_SUBJECT with required_affordable_units 4 and total_obligation_bps 40000 — recomputed from the amended 40 units at 1000 bps, not carried over from the first screening"
            - "ordinance_id is re-populated with ${ord_id} by the re-screen"

      - name: recording_a_restriction_freezes_the_ami_basis_against_later_schedules
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/iz-compliance/affordable-units/{unit_id}/record-restriction
          - calculations.ami_schedule_selection
        distinguishing_aspect: |
          The action endpoint's whole purpose is to FREEZE two values that every later resale and
          refinance reads: original_purchase_price_cents from the payload and
          ami_income_at_purchase_cents from the schedule in force at recording, indexed by
          bedrooms + 1. Publishing a later AmiSchedule afterwards must not disturb the frozen
          basis, which is what makes the indexed resale formula stable for decades; an
          implementation that re-derives the basis on read would drift the moment 2028 medians
          are published.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published — 2026 is the ONLY schedule at recording time."
            - "Project P (R-2, 20 units, dev-1) screened SUBJECT, ONSITE elected, agreement recorded, with an OWNERSHIP 2br unit FZ-101 at 5000 bps."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
