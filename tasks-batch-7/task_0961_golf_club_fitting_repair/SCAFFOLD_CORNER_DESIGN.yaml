              payload: { description: "loft drifted", build_spec_id: "${spec_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { cl_id: $.data.id }
          assert:
            - "WarrantyClaim.${cl_id}.coverage_pct == 50 (91..365 day band)"
            - "WarrantyClaim.${cl_id}.covered_estimate_cents == 1150 (round(2300*0.5))"

      - name: mark_ready_consumption_stub
        claim_type: side_effect_execution
        grounds: [state_machines.ClubBuildSpec.IN_BUILD_to_READY, state_machines.ComponentOrder.ALLOCATED_to_CLOSED]
        excluded_because:
          difficulty_instance: "compensating_invariant / inventory_quantity_conserved_across_reserve_release_consume"
          rationale: "that instance asserts reserved->consumed movement and order CLOSED via the (4,0,1) tuple after mark-ready."

      - name: credit_balance_reconciliation_stub
        claim_type: derived_field_reconciliation
        grounds: [calculations.customer_credit_balance]
        excluded_because:
          difficulty_instance: "compensating_invariant / store_credit_conserved_across_grant_redeem_refund"
          rationale: "that instance asserts balance == sum(ledger) after grant, redemption, and refund."

  # =====================================================================
  - section: validations
