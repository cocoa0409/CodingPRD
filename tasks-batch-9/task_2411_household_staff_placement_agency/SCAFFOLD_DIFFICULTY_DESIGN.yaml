  - name: milestone_becomes_overdue_only_after_the_due_date_has_passed
    grounds: state_machines.FeeMilestone.INVOICED -> OVERDUE (clock sweep, strict >); global_constants.NET_TERMS_DAYS;
      endpoints.POST /_clock/set_current_utc (milestones_marked_overdue counter)
    mechanism: Invoicing on 2026-09-01 stamps due_date 2026-09-15 (NET_TERMS_DAYS 14). A sweep to the due date itself
      leaves the row INVOICED and reports a zero counter; a sweep to the next day flips it to OVERDUE and reports
      1. The comparison is strictly greater-than on dates, not on timestamps.
