  # ---------------------------------------------------------------------------
  # Rule 3 - non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: opportunity_negotiation_evaluation_cycle
        grounds:
          - state_machines.Opportunity.NEGOTIATING_to_UNDER_EVALUATION
          - state_machines.Opportunity.NEGOTIATING_to_NEGOTIATING
          - calculations.opportunity_evaluation_score
        distinguishing_aspect: |
          Opportunity is cyclic: a counter-offer whose value delta exceeds 10%
          loops NEGOTIATING -> UNDER_EVALUATION (forcing re-evaluation), while a
          delta of exactly 10% stays NEGOTIATING; the cycle can repeat and
          terminates only at ACCEPTED/DECLINED/WITHDRAWN/EXPIRED.
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement; Agent and BM team members"
            - "Opportunity O: TOURING, proposed 10000000 (exactly AT the 10000000 artist-approval threshold -> requires_artist_approval == false since rule is strict >), offer_expiry 2026-12-31, window 2026-10-01T00:00:00Z..2026-10-02T00:00:00Z, fit_score 80"
            - "O evaluated (RECEIVED -> UNDER_EVALUATION), then negotiate -> NEGOTIATING"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Cycle Act", legal_name: "Cycle Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
