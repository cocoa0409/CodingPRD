              captures: { ps_assembled: $.data.production_status, ready_null: $.data.ready_at }
          trigger:
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: StoreManager
              captures: { err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T13:00:00Z" }
              as: ChainAdmin
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: StoreManager
              captures: { ps_ready: $.data.production_status, ready_at: $.data.ready_at }
          assert:
            - "${ps_assembled} == ASSEMBLED"
            - "${ready_null} == null"
            - "first trigger HTTP status == 409"
            - "${err_id} == ERR_PICKUP_WINDOW_NOT_OPEN"
            - "third trigger HTTP status == 200"
            - "${ps_ready} == READY"
            - "${ready_at} == 2026-08-01T13:00:00Z"
            - "Order.${order_id}.settlement_status == AUTHORIZED"
            - "KitchenTicket.${tk}.status == DONE"

  # =========================================================================
  # Coverage index for the 60 error ids of SS1.6. Every id is triggered by exactly one of:
  #   this section's instances (below), an earlier section of this file, the rbac section,
  #   the cross_cutting_complexity_layers section, or a named SS1.8 instance (see the stubs).
  #   404 family (11 ids) ............ every_not_found_error_id_is_reachable_with_an_unknown_id
  #   ERR_DUPLICATE_CODE ............. duplicate_codes_collide_across_every_coded_entity
  #   order/ticket state family ...... order_lifecycle_rejections_cover_the_state_error_ids
  #   production family .............. production_rejections_cover_the_batch_and_unit_error_ids
  #   window/catering family ......... order_intake_rejections_cover_the_window_and_catering_error_ids
  #   clock, points, daypart, lock ... platform_rejections_cover_the_clock_points_and_plan_error_ids
  #   corrective-action family ....... corrective_action_rejections_cover_the_unit_error_ids
  #   ERR_INVALID_REQUEST ............ entities / create_menu_item_missing_required_valid_dayparts_is_rejected
  #   auth family (5 ids) ............ rbac section
  #   ERR_STALE_STORE_VERSION ........ cross_cutting_complexity_layers
  #   ERR_STALE_BATCH_VERSION ........ cross_cutting_complexity_layers
  - section: errors
    instances:

      - name: every_not_found_error_id_is_reachable_with_an_unknown_id
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_STORE_NOT_FOUND]
          - errors[ERR_HOLDING_UNIT_NOT_FOUND]
          - errors[ERR_PROMOTION_RULE_NOT_FOUND]
          - errors[ERR_STAFFING_PLAN_NOT_FOUND]
          - errors[ERR_PRODUCTION_BATCH_NOT_FOUND]
          - errors[ERR_TEMPERATURE_LOG_NOT_FOUND]
          - errors[ERR_CORRECTIVE_ACTION_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_ORDER_LINE_NOT_FOUND]
          - errors[ERR_KITCHEN_TICKET_NOT_FOUND]
          - errors[ERR_MODIFIER_OPTION_NOT_FOUND]
        distinguishing_aspect: |
          Each entity must own its OWN 404 id rather than share a generic one, and the two body-FK ids
          (ERR_TEMPERATURE_LOG_NOT_FOUND from a corrective action, ERR_MODIFIER_OPTION_NOT_FOUND from a line
          build) must be reachable even though neither entity has an unknown-id path of its own. Every call
          here uses a well-formed UUID that no row was ever created with, so a 400 or a 500 is a failure.
        test_recipe:
          setup:
            - "store WAWA-0101 on the default clock 2026-08-01T00:00:00Z, current_daypart BREAKFAST"
            - "one hoagie menu item with no modifier options, and one DRAFT anonymous TOUCHSCREEN order"
            - "no holding units, batches, plans, promotion rules, temperature logs or tickets exist"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ChainAdmin
              captures: { e_store: $.data.error_id }
            - call: "GET /holding-units/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: StoreManager
              captures: { e_unit: $.data.error_id }
            - call: "POST /promotion-rules/00000000-0000-4000-8000-000000000003/suspend"
              payload: {}
              as: ChainAdmin
              captures: { e_promo: $.data.error_id }
            - call: "POST /staffing-plans/00000000-0000-4000-8000-000000000004/publish"
              payload: {}
              as: StoreManager
              captures: { e_plan: $.data.error_id }
            - call: "GET /production-batches/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: KitchenAssociate
              captures: { e_batch: $.data.error_id }
            - call: "GET /orders/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: StoreManager
              captures: { e_order: $.data.error_id }
            - call: "GET /order-lines/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: StoreTerminal
              captures: { e_line: $.data.error_id }
            - call: "GET /kitchen-tickets/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: KitchenAssociate
              captures: { e_ticket: $.data.error_id }
            - call: "GET /corrective-actions/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ShiftLead
              captures: { e_action: $.data.error_id }
            - call: "POST /corrective-actions"
              payload: { temperature_log_id: "00000000-0000-4000-8000-00000000000a", action_taken: "RESET_BREAKER" }
              as: ShiftLead
              captures: { e_templog: $.data.error_id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1, modifiers: [{ modifier_option_id: "00000000-0000-4000-8000-00000000000b", qty: 1 }] }
              as: StoreTerminal
              captures: { e_modopt: $.data.error_id }
          assert:
            - "every trigger call returns HTTP status 404"
            - "${e_store} == ERR_STORE_NOT_FOUND"
            - "${e_unit} == ERR_HOLDING_UNIT_NOT_FOUND"
            - "${e_promo} == ERR_PROMOTION_RULE_NOT_FOUND"
            - "${e_plan} == ERR_STAFFING_PLAN_NOT_FOUND"
            - "${e_batch} == ERR_PRODUCTION_BATCH_NOT_FOUND"
            - "${e_order} == ERR_ORDER_NOT_FOUND"
            - "${e_line} == ERR_ORDER_LINE_NOT_FOUND"
            - "${e_ticket} == ERR_KITCHEN_TICKET_NOT_FOUND"
            - "${e_action} == ERR_CORRECTIVE_ACTION_NOT_FOUND"
            - "${e_templog} == ERR_TEMPERATURE_LOG_NOT_FOUND"
            - "${e_modopt} == ERR_MODIFIER_OPTION_NOT_FOUND"
            - "Order.${order_id}.subtotal_gross_cents == 0"
            - "GET /order-lines?order_id=${order_id} -> total_count == 0"

      - name: duplicate_codes_collide_across_every_coded_entity
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: |
          One error id covers six different uniqueness scopes, and two of them are NARROWER than chain-wide:
          HoldingUnit.unit_code is unique per store and ModifierOption.code is unique per menu item. So
          re-using BC-1 in the same store collides (409) while re-using it in a second store must succeed,
          which is the check a naive global unique index gets wrong.
        test_recipe:
          setup:
            - "two stores WAWA-0101 and WAWA-0102, each with a BAKERY_CASE unit coded BC-1"
            - "one hoagie menu item with an EXTRA-PROV modifier option, one promotion rule BUNDLE100, one member M-1"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_a: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "WAWA-0102", name: "Wawa Route 9", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_b: $.data.id }
            - call: "POST /stores/${store_a}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_a: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items/${hoagie_id}/modifier-options"
              payload: { code: "EXTRA-PROV", modifier_class: "CHEESE", price_delta_cents: 60, is_premium: true, max_qty: 1 }
              as: ChainAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /promotion-rules"
              payload: { code: "BUNDLE100", kind: "DAYPART_BUNDLE", discount_kind: "CENTS_OFF", discount_cents: 100, max_discount_cents: 100, valid_dayparts: ["LUNCH"], stacking_rank: 9 }
              as: ChainAdmin
              captures: { rule_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { member_code: "M-1", email: "m1@example.com" }
              as: ChainAdmin
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1 Duplicate", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { e_store: $.data.error_id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie Clone", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 999, unit_food_cost_cents: 300, valid_dayparts: ["LUNCH"] }
              as: ChainAdmin
              captures: { e_item: $.data.error_id }
            - call: "POST /menu-items/${hoagie_id}/modifier-options"
              payload: { code: "EXTRA-PROV", modifier_class: "TOPPING", price_delta_cents: 10 }
              as: ChainAdmin
              captures: { e_mod: $.data.error_id }
            - call: "POST /promotion-rules"
              payload: { code: "BUNDLE100", kind: "DAYPART_BUNDLE", discount_kind: "CENTS_OFF", discount_cents: 400, max_discount_cents: 400, valid_dayparts: ["DINNER"], stacking_rank: 3 }
              as: ChainAdmin
              captures: { e_promo: $.data.error_id }
            - call: "POST /loyalty-accounts"
              payload: { member_code: "M-1", email: "other@example.com" }
              as: ChainAdmin
              captures: { e_member: $.data.error_id }
            - call: "POST /stores/${store_a}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "HOT_CASE", min_temp_f: 140, max_temp_f: 190, slot_count: 2 }
              as: StoreManager
              captures: { e_unit: $.data.error_id }
            - call: "POST /stores/${store_b}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_b: $.data.id, unit_b_code: $.data.unit_code }
          assert:
            - "${e_store} == ERR_DUPLICATE_CODE"
            - "${e_item} == ERR_DUPLICATE_CODE"
            - "${e_mod} == ERR_DUPLICATE_CODE"
            - "${e_promo} == ERR_DUPLICATE_CODE"
            - "${e_member} == ERR_DUPLICATE_CODE"
            - "${e_unit} == ERR_DUPLICATE_CODE"
            - "the first six trigger calls return HTTP status 409"
            - "last trigger HTTP status == 201"
            - "${unit_b_code} == BC-1"
            - "HoldingUnit.${unit_b}.store_id == ${store_b}"
            - "GET /stores/${store_a}/holding-units -> total_count == 1"
            - "GET /stores/${store_b}/holding-units -> total_count == 1"
            - "GET /menu-items/${hoagie_id}/modifier-options -> total_count == 1"

      - name: order_lifecycle_rejections_cover_the_state_error_ids
        claim_type: error_triggerable
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_ORDER_EMPTY]
          - errors[ERR_ORDER_SETTLEMENT_STATE_INVALID]
          - errors[ERR_ORDER_PRODUCTION_STATE_INVALID]
          - errors[ERR_TICKET_STATE_INVALID]
          - errors[ERR_ORDER_NOT_REWORKABLE]
        distinguishing_aspect: |
          Four distinct state ids come out of the same order, so a shared "wrong state" code would be
          detected: settle on an UNPAID order is a SETTLEMENT id, pickup on a PLACED order is a PRODUCTION
          id, complete on a QUEUED ticket is a TICKET id, and reopen once the order has reached READY is
          ERR_ORDER_NOT_REWORKABLE - the ticket itself is DONE and would otherwise be reopenable, so this
          last one proves the rework gate reads the ORDER, not the ticket.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH with a PUBLISHED LUNCH plan for 2026-08-01"
            - "coffee 249c valid in LUNCH"
            - "order X is an empty DRAFT; order Y is a DRAFT anonymous TOUCHSCREEN order with one coffee line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
