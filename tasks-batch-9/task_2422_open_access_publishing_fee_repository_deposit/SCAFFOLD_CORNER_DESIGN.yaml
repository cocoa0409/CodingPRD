            - "Publisher.${k1_p_id}.apc_transparency_score == 40"

      - name: corner_screening_retraction_cap_and_clamp_floor_are_applied
        claim_type: constants_applied
        grounds:
          - calculations.predatory_screening_score
          - calculations.predatory_screening_score.constants.W_RETRACTION_CAP
        distinguishing_aspect: |
          Publisher A supplies retraction_rate_per_1000 20.0, whose raw weighted component is
          100; W_RETRACTION_CAP 25 caps it, so with 25 + 15 + 20 + 25 + 15 - round_half_up(10.0)
          the score is exactly 90 (BLOCKED) rather than the 100 an uncapped-then-clamped
          implementation would report. Publisher B supplies all-clean signals with
          apc_transparency_score 100, so the raw score is -10 and the clamp floor pins it to 0
          (CLEARED) rather than a negative predatory_score.
        test_recipe:
          setup:
            - "two never-screened publishers"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Apex Rapid Publishing", publisher_code: "APEXR", country_code: "US" }
              as: AgreementAdmin
              captures: { k2_pa_id: $.data.id }
            - call: "POST /publishers"
