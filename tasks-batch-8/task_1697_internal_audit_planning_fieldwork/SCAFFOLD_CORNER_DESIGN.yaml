        distinguishing_aspect: "Aggregation input set: universe = ACTIVE entities with current score >= 70; coverage counts only this plan's non-CANCELLED engagements. Two high-risk entities, one covered -> 50.0; cancelling the engagement returns coverage to 0.0."
