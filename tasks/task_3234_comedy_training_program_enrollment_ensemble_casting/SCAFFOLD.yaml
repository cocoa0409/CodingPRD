    code: 200
    input: []
    output: TouringAssignment
    side_effects: ["ACCEPTED → ON_TOUR → RETURNED per clock"]
  - method: POST
    path: "/touring-assignments/{assignmentId}/replace"
    description: "ACCEPTED → REPLACED with new assignment created"
    roles: [CastingDirector]
    code: 200
    input: [new_principal_student_id, new_understudy_student_id]
