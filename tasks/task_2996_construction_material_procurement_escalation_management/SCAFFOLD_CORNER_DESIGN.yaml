        payload: {quote_id: '${q_id}', po_number: PO-2996-0001, expected_project_version: '${pv}', escalation_agreement_id: '${ea_id}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc_id: $.data.id}
      - call: POST /procurement/purchase-commitments/${pc_id}/commit
        payload: {}
        as: ProjectExecutive
      - call: POST /procurement/suppliers
        payload: {legal_name: Northline Steel Mills, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup2_id: $.data.id}
      trigger:
      - call: POST /procurement/substitution-requests
        payload: {material_package_id: '${pkg_id}', proposed_supplier_id: '${sup_id}', driver: VALUE_ENGINEERING, proposed_product: Alternate HSS section from mill B, cost_delta: '45000.00', schedule_delta_days: 12}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: POST /procurement/substitution-requests
        payload: {material_package_id: '${pkg_id}', proposed_supplier_id: '${sup2_id}', driver: VALUE_ENGINEERING, proposed_product: Alternate HSS section from mill B, cost_delta: '45000.00', schedule_delta_days: 12}
        as: BuyoutManager
        captures: {sr_ok_id: $.data.id}
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the first trigger call fails with error_id ERR_INVALID_REQUEST and HTTP 422
      - the second trigger call returns HTTP 201 with SubstitutionRequest.${sr_ok_id}.proposed_supplier_id == ${sup2_id}
      - SubstitutionRequest.${sr_ok_id}.status == SUBMITTED
      - MaterialPackage.${pkg_id}.estimated_cost == 1200000.00 and fabrication_duration_days == 70 (a submitted request applies nothing)
      - PurchaseCommitment.${pc_id}.commitment_status == COMMITTED
  - name: priority_conflict_state_check_at_fifty_five_beats_the_fiscal_check_at_ninety
    claim_type: priority_conflict
    grounds:
    - validations[priority=55]
    - validations[priority=90]
    - validations[priority=95]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / expired_quote_state_check_beats_buyout_overrun_fiscal_check
      rationale: The §1.8 instance constructs both violations on one request and asserts ERR_QUOTE_NOT_OPEN wins over ERR_BUYOUT_OVERRUN_EXCEEDED, which is documented pair (A) of validations priority 95.
  - name: priority_conflict_temporal_check_at_seventy_five_beats_the_conflict_check_at_eighty
    claim_type: priority_conflict
    grounds:
    - validations[priority=75]
    - validations[priority=80]
    - validations[priority=95]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / storage_window_temporal_check_beats_warehouse_conflict_constraint
      rationale: 'The §1.8 instance is documented pair (B): ERR_STORAGE_WINDOW_INVALID wins over ERR_WAREHOUSE_WINDOW_CONFLICT on a single create that violates both.'
  - name: priority_conflict_auth_check_at_forty_beats_the_overlap_check_at_eighty
    claim_type: priority_conflict
    grounds:
    - validations[priority=40]
    - validations[priority=80]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / supplier_scope_auth_check_beats_price_hold_overlap_constraint
      rationale: The §1.8 instance pairs an out-of-scope SupplierRep with an overlapping price hold and asserts ERR_SUPPLIER_SCOPE_VIOLATION wins.
  - name: cross_entity_validation_commit_requires_an_executed_clause
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=60]
    - errors[ERR_ESCALATION_NOT_EXECUTED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / commit_blocked_by_clause_not_executed
      rationale: The §1.8 instance holds the commitment row constant and flips only the clause's state, then completes the negotiation and commits successfully.
  - name: cross_entity_validation_commit_requires_an_active_supplier
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=60]
    - errors[ERR_SUPPLIER_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / commit_blocked_by_suspended_supplier
      rationale: The §1.8 instance suspends the supplier between create and commit, so the gate is proven to read the supplier's live status rather than a snapshot.
  - name: temporal_validation_touching_price_hold_windows_do_not_overlap
    claim_type: temporal_validation
    grounds:
    - validations[priority=80]
    - errors[ERR_PRICE_HOLD_OVERLAP]
    excluded_because:
      difficulty_instance: boundary_precision_check / price_hold_adjacent_window_allowed_and_one_day_overlap_rejected
      rationale: The §1.8 instance tests the half-open interval at exact adjacency and at one day of overlap, which is the whole content of this claim.
  - name: temporal_validation_the_warehouse_buffer_inflates_the_occupancy_interval
    claim_type: temporal_validation
    grounds:
    - validations[priority=80]
    - errors[ERR_WAREHOUSE_WINDOW_CONFLICT]
    - calculations.storage_carrying_cost.constants.HANDLING_BUFFER_DAYS
    excluded_because:
      difficulty_instance: resource_temporal_overlap / warehouse_occupancy_buffer_blocks_a_booking_three_days_after_release
      rationale: The §1.8 instance pins the 3-day buffer on both ends and shows the same booking succeeding in a different warehouse.
- section: endpoints
  instances:
  - name: standard_crud_patch_reshapes_the_schedule_and_rebaselines_the_package
    claim_type: standard_crud
    grounds:
    - endpoints[PATCH /procurement/material-packages/{id}]
    - calculations.release_for_fabrication_schedule
    - entities.MaterialPackage.fields.baseline_fabrication_duration_days
    distinguishing_aspect: 'PATCH is a partial update that re-runs the whole schedule calculation and rebaselines: raising fabrication_duration_days alone from 70 to 100 moves lead_time_days to 141 and pulls release_for_fabrication_date back to 2026-10-11, while the untouched estimate and transit days keep their values.'
    test_recipe:
      setup:
      - A steel package with fabrication 70 / transit 20 / submittal 21, estimate 1200000.00 and release_for_fabrication_date 2026-11-10
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      trigger:
      - call: PATCH /procurement/material-packages/${pkg_id}
        payload: {fabrication_duration_days: 100}
        as: BuyoutManager
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the trigger returns HTTP 200
      - MaterialPackage.${pkg_id}.fabrication_duration_days == 100 and delivery_transit_days == 20
      - MaterialPackage.${pkg_id}.lead_time_days == 141
      - MaterialPackage.${pkg_id}.release_for_fabrication_date == "2026-10-11T00:00:00.000Z"
      - MaterialPackage.${pkg_id}.float_days == 71 and rff_risk_band == ON_TRACK
      - MaterialPackage.${pkg_id}.is_long_lead == true
      - MaterialPackage.${pkg_id}.baseline_fabrication_duration_days == 100 (rebaselined)
      - MaterialPackage.${pkg_id}.baseline_estimated_cost == 1200000.00 and estimated_cost == 1200000.00
      - MaterialPackage.${pkg_id}.status == IDENTIFIED
      - Project.${proj_id}.estimated_total_cost == 1200000.00
  - name: computed_read_a_supplier_read_restates_its_own_exposure_snapshot
    claim_type: computed_read
    grounds:
    - endpoints[GET /procurement/suppliers/{id}]
    - calculations.supplier_exposure_score
    - entities.Supplier.fields.exposure_score_snapshot
    distinguishing_aspect: 'The snapshot fields are derived on read, not stored by the write that caused them: the same supplier reads 0.00 / LOW before its disruption events are filed and 40.00 / ELEVATED afterwards, with no write ever addressed to the supplier row itself.'
    test_recipe:
      setup:
      - One domestic supplier declaring 0.00 tariff and no events at first
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/suppliers
        payload: {legal_name: Northline Steel Mills, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_us_id: $.data.id}
      - call: GET /procurement/suppliers/${sup_us_id}
        payload: {}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/suppliers/${sup_us_id}/disruption-events
        payload: {event_type: PLANT_SHUTDOWN, effective_date: '2026-07-01T00:00:00.000Z', description: Rolling mill down for unplanned reline}
        as: BuyoutManager
        captures: {ev_a_id: $.data.id}
      - call: POST /procurement/suppliers/${sup_us_id}/disruption-events
        payload: {event_type: PORT_CONGESTION, effective_date: '2026-07-10T00:00:00.000Z', description: Inbound plate stuck at the terminal}
        as: BuyoutManager
        captures: {ev_b_id: $.data.id}
      - call: GET /procurement/suppliers/${sup_us_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the setup read reported exposure_score_snapshot == 0.00, exposure_band_snapshot == LOW and open_disruption_count == 0
      - both event creates return HTTP 201
      - the final read reports Supplier.${sup_us_id}.exposure_score_snapshot == 40.00
      - Supplier.${sup_us_id}.exposure_band_snapshot == ELEVATED
      - Supplier.${sup_us_id}.open_disruption_count == 2
      - Supplier.${sup_us_id}.status == ACTIVE and declared_tariff_rate_pct == 0.00 (the read wrote nothing back)
  - name: action_endpoint_revise_supersedes_its_own_quote_and_is_exempt_from_the_overlap_check
    claim_type: action_endpoint
    grounds:
    - endpoints[POST /procurement/quotes/{id}/revise]
    - state_machines.Quote.OPEN_to_SUPERSEDED
    - validations[priority=80]
    distinguishing_aspect: The revise action would collide with its own predecessor under the price-hold overlap rule — identical [received_at, expires_at) window, same package and supplier — and the declared exemption is what lets it through, leaving exactly one OPEN quote behind.
    test_recipe:
      setup:
      - A steel package with one OPEN quote at 1150000.00 received 2026-08-01 on a 45-day hold
      - The revision carries the identical received_at and price_hold_days, so its window is a perfect overlap
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      trigger:
      - call: POST /procurement/quotes/${q_id}/revise
        payload: {base_price: '1140000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_rev_id: $.data.id}
      - call: GET /procurement/quotes/${q_id}
        payload: {}
        as: BuyoutManager
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the trigger returns HTTP 201 with Quote.${q_rev_id}.status == OPEN
      - Quote.${q_rev_id}.supersedes_quote_id == ${q_id}
      - Quote.${q_rev_id}.base_price == 1140000.00 and expires_at == "2026-09-15T00:00:00.000Z"
      - Quote.${q_id}.status == SUPERSEDED
      - MaterialPackage.${pkg_id}.open_quote_count == 1
      - MaterialPackage.${pkg_id}.status == SOURCING
  - name: conditional_action_a_supplier_rep_may_file_documents_on_its_own_arrangement
