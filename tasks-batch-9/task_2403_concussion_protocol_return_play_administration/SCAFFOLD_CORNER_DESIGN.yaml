            - call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "${player_n2_id}", game_id: "${game_n_id}", trigger_source: "UNAFFILIATED_OBSERVER" }
              as: UnaffiliatedObserver
              as_user_id: "${obs_id}"
              captures: { eval_n2_id: $.data.id }
            - call: "POST /concussion-program/sideline-evaluations/${eval_n2_id}/screen"
              payload: { no_go_signs: ["ATAXIA"], symptom_score: 9 }
              as: ClubPhysician
              as_user_id: "${doc_n_id}"
            - call: "POST /concussion-program/sideline-evaluations/${eval_n2_id}/locker-room-exam"
              payload: { inc_clinician_id: "${inc_id}" }
              as: ClubPhysician
              as_user_id: "${doc_n_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T18:19:00Z" }
              as: LeagueAdmin
            - call: "POST /concussion-program/sideline-evaluations/${eval_n2_id}/diagnose-concussion"
              payload: { symptom_score: 9, composite_score: 70 }
              as: ClubPhysician
              as_user_id: "${doc_n_id}"
              captures: { case_n2_id: $.data.id }
          trigger:
            - call: "GET /concussion-program/concussion-cases?club_id=${club_n_id}&case_status=MANDATORY_REMOVAL&limit=1&offset=0"
              as: LeagueAdmin
            - call: "GET /concussion-program/concussion-cases?club_id=${club_n_id}&case_status=MANDATORY_REMOVAL&limit=1&offset=1"
              as: LeagueAdmin
            - call: "GET /concussion-program/concussion-cases?club_id=${club_r_id}&case_status=MANDATORY_REMOVAL"
              as: LeagueAdmin
            - call: "GET /concussion-program/concussion-cases?club_id=${club_n_id}"
              as: LeagueAdmin
          assert:
            - "trigger 1: one element, meta.total_count == 2, meta.limit == 1, meta.offset == 0, meta.has_more == true"
            - "trigger 2: one element, meta.has_more == false, and its id differs from trigger 1's element"
            - "the two pages together cover exactly {${case_n1_id}, ${case_n2_id}}"
            - "trigger 3: empty array with meta.total_count == 0"
            - "trigger 4: meta.limit == 10 and meta.offset == 0 (envelope defaults) with meta.total_count == 2"

      - name: sweep_cascade_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_breach_cascades_to_club_sanction_and_case_freeze
          rationale: "That §1.8 instance verifies the four-level chain and its ordering sensitivity end to end."

      - name: dual_variant_return_and_compliance_calculations
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / case_provisional_projection_diverges_from_accrued_return_date
          rationale: "Both variants and their delta are asserted there and in its sibling club-compliance instance."

  - section: consistency model
    instances:
      - name: diagnosis_response_reflects_every_immediate_effect
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.SidelineEvaluation.LOCKER_ROOM_EXAM_to_DIAGNOSED
        distinguishing_aspect: "The consistency model is immediate, so the diagnosis response body already carries the computed severity_index and projection, and reads issued straight afterwards - with no sweep, no second write and no delay - show the player OUT and the baseline flagged for retest."
        test_recipe:
          setup: ["The canonical evaluation in LOCKER_ROOM_EXAM since 2026-09-13T18:10:00Z, clock 2026-09-13T18:19:00Z"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
            - *k_doc_h
            - *k_obs
            - *k_inc
            - *k_player
            - *k_baseline
            - *k_game
            - *k_clock_kick
            - *k_game_live
            - *k_clock_1805
            - *k_eval
            - *k_screen
            - *k_clock_1810
            - *k_exam
            - *k_clock_1819
          trigger:
            - *k_diagnose
            - call: "GET /concussion-program/players/${player_id}"
              as: LeagueAdmin
            - call: "GET /concussion-program/baseline-tests/${baseline_id}"
              as: LeagueAdmin
            - call: "GET /concussion-program/sideline-evaluations/${eval_id}"
              as: LeagueAdmin
          assert:
            - "trigger 1's own response body already contains severity_index == 82, projected_return_at == 2026-09-23T18:19:00.000Z, case_status == MANDATORY_REMOVAL"
            - "trigger 2, issued immediately after with no intervening write: availability_status == PROTOCOL_RESTRICTED, public_injury_designation == OUT, baseline_status == RETEST_REQUIRED, diagnosed_case_count == 1"
            - "trigger 3: retest_required_reason == NEW_DIAGNOSIS on the pre-season row"
            - "trigger 4: status == DIAGNOSED, exam_completed_at == 2026-09-13T18:19:00.000Z, exam_duration_minutes == 9, diagnosis_outcome == CONCUSSION"
            - "no sweep is required for any of these values to be visible"
