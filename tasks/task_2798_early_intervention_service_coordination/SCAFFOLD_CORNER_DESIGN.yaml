      - name: notification_after_third_birthday_and_late_verdict_sweep
        claim_type: error_triggerability
        grounds:
          - errors[ERR_NOTIFICATION_AFTER_THIRD_BIRTHDAY]
          - calculations.transition_notification_timeliness
        distinguishing_aspect: |
          The sign of the lead decides between an error and a verdict: a notification five days AFTER
          the third birthday is a 422, while a notification exactly ON the third birthday is accepted
          with notification_lead_days == 0 and graded LATE. An implementation that used <= 0 as the
          error condition, or that clamped negative leads to 0, would fail one of the two calls.
        test_recipe:
          setup:
            - "Child born 2024-01-10 (third_birthday_date 2027-01-10) on an ACTIVE_SERVICES referral with an ACTIVE plan."
            - "A DRAFT TransitionPlan created at clock 2026-04-20T09:00:00Z with conference_held_date 2026-04-15 and transition_steps_count 4."
