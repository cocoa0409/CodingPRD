  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: driver_parallel_employment_x_duty_dimensions
        grounds:
          - state_machines.Driver
          - entities.Driver.fields.employment_status
          - entities.Driver.fields.duty_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: suspending the driver flips
          employment_status ACTIVE->SUSPENDED while duty_status stays DRIVING (the
          duty axis is an independent projection of the DutyEvent stream); reinstate
          flips employment back without touching duty_status.
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; driver created (employment ACTIVE, duty OFF_DUTY); one DRIVING duty event at 06:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-6", full_name: "D Six", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id, emp0: $.data.employment_status, duty0: $.data.duty_status } }
            - { call: "POST /drivers/${drv}/duty-events", payload: { event_type: "DRIVING", occurred_at: "2026-08-01T06:00:00Z" }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /drivers/${drv}/suspend", payload: {}, as: SafetyOfficer, captures: { emp1: $.data.employment_status, duty1: $.data.duty_status } }
            - { call: "POST /drivers/${drv}/reinstate", payload: {}, as: SafetyOfficer, captures: { emp2: $.data.employment_status, duty2: $.data.duty_status } }
          assert:
            - "at creation: ${emp0} == ACTIVE and ${duty0} == OFF_DUTY"
            - "after DRIVING event then suspend: ${emp1} == SUSPENDED and ${duty1} == DRIVING (axes independent)"
            - "after reinstate: ${emp2} == ACTIVE and ${duty2} == DRIVING (duty axis untouched by employment transitions)"

      - name: accessorial_dispute_resubmit_cycle
        grounds:
          - state_machines.AccessorialCharge.DISPUTED_to_SUBMITTED
          - state_machines.AccessorialCharge.SUBMITTED_to_DISPUTED
        distinguishing_aspect: |
          Cyclic machine on AccessorialCharge (different entity than Driver): SUBMITTED ->
          DISPUTED -> SUBMITTED -> APPROVED loops are legal and amount_cents survives the
          cycle unchanged (3013 LUMPER passthrough).
        test_recipe:
          setup:
            - "F1 reference data; load SCREENED (accessorials need only an existing load); manual LUMPER 3013 created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/accessorials", payload: { type: "LUMPER", quantity: 3013 }, as: Dispatcher, captures: { acc: $.data.id, st0: $.data.status, amt0: $.data.amount_cents } }
          trigger:
            - { call: "POST /accessorials/${acc}/submit", payload: {}, as: Dispatcher, captures: { st1: $.data.status } }
            - { call: "POST /accessorials/${acc}/dispute", payload: {}, as: LoadPlanner, captures: { st2: $.data.status } }
            - { call: "POST /accessorials/${acc}/submit", payload: {}, as: Dispatcher, captures: { st3: $.data.status } }
            - { call: "POST /accessorials/${acc}/approve", payload: {}, as: LoadPlanner, captures: { st4: $.data.status, amt4: $.data.amount_cents } }
          assert:
            - "cycle walked: ${st0} == PENDING, ${st1} == SUBMITTED, ${st2} == DISPUTED, ${st3} == SUBMITTED, ${st4} == APPROVED"
            - "amount stable across cycle: ${amt0} == 3013 and ${amt4} == 3013"

