              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order2_id: $.data.id }
            - call: "POST /vfd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: Inspector
          trigger:
            - call: "POST /vfd/feed-orders/${order2_id}/validate"
              payload: { expected_vfd_authorization_version: "${vfd_v}" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { err: $.data.error_id }
          assert:
