scenario: "2245. Foodservice National Account Contract & Deviated Pricing Administration (US Foods national accounts): contract construction with cost-plus markup tiers by product class, deviated (off-invoice) pricing setup with manufacturer bill-back recovery, product substitution rules when a contracted item is out of stock, distribution center coverage mapping and out-of-market service fees, compliance reporting on contracted item purchase percentage, rebate accrual and settlement to the operator and manufacturer, price change notice periods and market-based item indexing, dispute and audit of invoice pricing accuracy"

domain_name: "foodservice-national-account-contract-deviated-pricing"

api_prefix: "/nac"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - selector_policy

  entity_topology: flat
  # Every entity is a peer addressed at `/nac/<collection>/{id}`; relationships are
  # expressed only through FK body fields, never through nested URL paths.

  state_machine_shape: cyclic
  # Contract (ACTIVE->AMENDING->ACTIVE, ACTIVE->SUSPENDED->ACTIVE,
  # PENDING_SIGNATURE->DRAFT->PENDING_SIGNATURE), DeviationAgreement
  # (SUBMITTED->REVISION_REQUESTED->SUBMITTED plus a three-way manufacturer
  # branch), RebatePeriod (CLOSED->SETTLED->CLOSED), PricingDispute
  # (OPEN->UNDER_AUDIT->OPEN), BillBackClaim (SUBMITTED->DISPUTED->SUBMITTED),
  # PriceChangeNotice (PENDING->DISPUTED->PENDING). OrderLine additionally
  # carries two independent state dimensions (pricing_status x billback_status).

  relationship_patterns:
    - one_to_many          # Contract -> ContractTier / DcCoverage / RebatePeriod / OrderLine
    - many_to_many         # DcCoverage (Contract x DistributionCenter), SubstitutionRule (Product x Product per Contract)
    - self_referential     # Contract.amends_contract_id -> Contract.id
    - cross_aggregate      # OrderLine -> DeviationAgreement, BillBackClaim -> OrderLine set

  role_model: segregation_of_duties
  # The PricingAnalyst who submits a DeviationAgreement may not be the
  # NationalAccountManager who activates it (compared on X-User-ID); the
  # RebateAccountant who submits a BillBackClaim may not be the ContractAuditor
  # who writes it off. Layered on peer ownership: OperatorBuyer acts only on its
  # own Operator's contracts, ManufacturerRep only on its own Manufacturer's
  # deviations and claims.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the national account operator (restaurant chain).
      - name: operator_code
        type: string
        source: input
        description: Short trading code for the operator; unique across all Operators.
        constraints: "unique; 2-16 uppercase alphanumeric or hyphen characters"
      - name: status
        type: enum
        source: input
        description: Whether the operator may transact.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: rebate_remit_method
        type: enum
        source: input
        description: How settled operator rebates are paid out.
        default: CREDIT_MEMO
        constraints: "one of {CHECK, ACH, CREDIT_MEMO}"

  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Manufacturer legal name.
      - name: manufacturer_code
        type: string
        source: input
        description: Short trading code; unique across all Manufacturers.
        constraints: "unique; 2-16 uppercase alphanumeric or hyphen characters"
      - name: status
        type: enum
        source: input
        description: Whether bill-back claims may be submitted to this manufacturer.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: bill_back_terms_days
        type: integer
        source: input
        description: Contractual days the manufacturer has to remit against a submitted claim.
        default: 45
        constraints: ">= 1"
      - name: open_claim_exposure_cents
        type: integer
        source: computed
        description: >-
          Sum over this manufacturer's BillBackClaim rows with status IN
          {SUBMITTED, PARTIALLY_RECOVERED, DISPUTED} of
          (claimed_amount_cents - recovered_amount_cents). Recomputed on every
          claim create/submit/dispute/write-off and on every remittance apply or reverse.
        default: 0
      - name: unapplied_credit_cents
        type: integer
        source: computed
        description: >-
          Remitted cash this manufacturer sent that the waterfall could not apply to
          any open claim; carried forward rather than discarded.
        default: 0
      - name: total_remitted_cents
        type: integer
        source: computed
        description: >-
          Lifetime sum of remitted_amount_cents over this manufacturer's
          BillBackRemittance rows with status APPLIED.
        default: 0
      - name: rebate_funding_payable_cents
        type: integer
        source: computed
        description: >-
          Accrued-but-unsettled manufacturer-funded share of operator rebates on all
          contracts naming this manufacturer as rebate_funding_manufacturer_id.
        default: 0

  - name: DistributionCenter
    parent: null
    common_fields: true
    fields:
      - name: dc_code
        type: string
        source: input
        description: Distribution center code; unique across all DistributionCenters.
        constraints: "unique; 2-16 uppercase alphanumeric or hyphen characters"
      - name: name
        type: string
        source: input
        description: Distribution center display name.
      - name: in_market_state_codes
        type: array
        source: input
        description: Two-letter US state codes this DC treats as in-market territory.
        constraints: "non-empty array of 2-letter uppercase state codes"
      - name: out_of_market_fee_per_case_cents
        type: integer
        source: input
        description: Per-case service fee charged when this DC ships under OUT_OF_MARKET coverage.
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Whether the DC may be mapped to new coverage rows.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Distributor SKU; unique across all Products.
        constraints: "unique"
      - name: description
        type: string
        source: input
        description: Item description as printed on the invoice.
      - name: product_class_code
        type: enum
        source: input
        description: Product class used to select the contract's cost-plus markup tier.
        constraints: "one of {PROTEIN, PRODUCE, FROZEN, DRY_GROCERY, DISPOSABLES, BEVERAGE, SPECIALTY}"
      - name: manufacturer_id
        type: string
        source: input
        description: FK -> Manufacturer.id; the manufacturer that funds deviations on this item.
      - name: pack_size
        type: integer
        source: input
        description: Units per case.
        constraints: ">= 1"
      - name: last_cost_cents
        type: integer
        source: input
        description: Most recent landed cost per case, in cents.
        constraints: ">= 0"
      - name: avg_cost_cents
        type: integer
        source: input
        description: Weighted average landed cost per case, in cents.
        constraints: ">= 0"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: Replacement (next-buy) cost per case, in cents.
        constraints: ">= 0"
      - name: cost_effective_at
        type: datetime
        source: system
        description: Logical-clock instant at which the most recent PriceChangeNotice activation rewrote a cost field; null until the first activation.
      - name: stock_status
        type: enum
        source: input
        description: Availability flag consulted by the substitution selector.
        default: IN_STOCK
        constraints: "one of {IN_STOCK, OUT_OF_STOCK}"
      - name: substitution_group_code
        type: string
        source: input
        description: Interchangeability group; a substitute must share this code with the primary item. Null means the item is not substitutable.
      - name: is_market_indexed
        type: boolean
        source: input
        description: Whether cost changes for this item are driven by a published market index.
        default: false
      - name: index_baseline_value
        type: number
        source: input
        description: Published index value corresponding to index_baseline_cost_cents; required when is_market_indexed is true.
        constraints: "> 0 when present; 2 decimal places"
      - name: index_baseline_cost_cents
        type: integer
        source: input
        description: Cost per case that corresponds to index_baseline_value; required when is_market_indexed is true.
        constraints: "> 0 when present"
      - name: status
        type: enum
        source: input
        description: Whether the item may be ordered or selected as a substitute.
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCONTINUED}"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: FK -> Operator.id; the national account this contract serves.
      - name: contract_code
        type: string
        source: input
        description: Contract identifier printed on operator paperwork; unique across all Contracts.
        constraints: "unique"
      - name: amends_contract_id
        type: string
        source: input
        description: FK -> Contract.id; set only on amendment drafts created by POST /nac/contracts/{contract_id}/amendments, null on original contracts.
      - name: rebate_funding_manufacturer_id
        type: string
        source: input
        description: FK -> Manufacturer.id; the manufacturer that funds the manufacturer share of this contract's operator rebate.
      - name: status
        type: enum
        source: system
        description: Contract lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_SIGNATURE, ACTIVE, AMENDING, SUSPENDED, EXPIRED, TERMINATED}"
      - name: effective_from
        type: datetime
        source: input
        description: First instant of the contract term (inclusive).
      - name: effective_to
        type: datetime
        source: input
        description: Last instant of the contract term (inclusive).
        constraints: "must be strictly after effective_from"
      - name: notice_period_days
        type: integer
        source: input
        description: Days of advance notice the operator is owed for a major cost change (delta_pct magnitude >= MAJOR_CHANGE_PCT).
        default: 30
        constraints: ">= 1"
      - name: contracted_purchase_pct_target
        type: number
        source: input
        description: Contracted-item purchase percentage the operator commits to; drives WATCH posture when a closed period lands below it.
        default: 85.00
        constraints: "0.00 <= value <= 100.00; 2 decimal places"
      - name: compliance_basis
        type: enum
        source: input
        description: Which variant of contracted_purchase_compliance_pct this contract is measured on.
        default: DOLLAR_WEIGHTED
        constraints: "one of {DOLLAR_WEIGHTED, CASE_WEIGHTED}"
      - name: allow_out_of_market
        type: boolean
        source: input
        description: Whether OUT_OF_MARKET DcCoverage rows may be created for this contract.
        default: false
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gate computed by contract_compliance_posture; RESTRICTED blocks deviation activation and new amendments.
        default: OPEN
        constraints: "one of {OPEN, WATCH, RESTRICTED}"
      - name: deviation_breach_count
        type: integer
        source: computed
        description: Number of times a DeviationAgreement on this contract has transitioned ACTIVE -> PRICE_CEILING_BREACHED.
        default: 0
      - name: rebate_payable_cents
        type: integer
        source: computed
        description: Accrued-but-unsettled operator rebate across this contract's CLOSED RebatePeriod rows.
        default: 0
      - name: rebate_settled_total_cents
        type: integer
        source: computed
        description: Lifetime operator rebate already settled on this contract.
        default: 0
      - name: signed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the OperatorBuyer signed; null before signature.
      - name: signed_by_user_id
        type: string
        source: system
        description: X-User-ID of the OperatorBuyer that signed; null before signature.

  - name: ContractTier
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract this markup tier belongs to.
      - name: product_class_code
        type: enum
        source: input
        description: Product class this tier prices.
        constraints: "one of {PROTEIN, PRODUCE, FROZEN, DRY_GROCERY, DISPOSABLES, BEVERAGE, SPECIALTY}"
      - name: cost_basis
        type: enum
        source: input
        description: Which Product cost field the markup is applied to.
        constraints: "one of {LAST_COST, AVG_COST, REPLACEMENT_COST}"
      - name: markup_type
        type: enum
        source: input
        description: Whether markup_value is a percent of cost or a flat cents-per-case adder.
        constraints: "one of {PERCENT_OF_COST, DOLLARS_PER_CASE}"
      - name: markup_value
        type: number
        source: input
        description: Percent with 2 decimals when markup_type is PERCENT_OF_COST; integral cents per case when DOLLARS_PER_CASE.
        constraints: ">= 0"
      - name: min_case_volume
        type: integer
        source: input
        description: Inclusive lower bound of the contract-year case volume band for this class.
        constraints: ">= 0"
      - name: max_case_volume
        type: integer
        source: input
        description: Exclusive upper bound of the case volume band; null means unbounded.
        constraints: "null or > min_case_volume"
      - name: counts_as_contracted
        type: boolean
        source: input
        description: Whether lines priced from this tier count toward the contracted-item purchase percentage.
        default: true
      - name: status
        type: enum
        source: system
        description: Tier lifecycle; SUPERSEDED tiers are excluded from pricing.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"

  - name: DcCoverage
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract this coverage row serves.
      - name: distribution_center_id
        type: string
        source: input
        description: FK -> DistributionCenter.id; the DC authorized to ship for the contract.
      - name: coverage_type
        type: enum
        source: input
        description: IN_MARKET waives the per-case service fee; OUT_OF_MARKET makes it chargeable.
        constraints: "one of {IN_MARKET, OUT_OF_MARKET}"
      - name: coverage_from
        type: datetime
        source: input
        description: First instant of coverage (inclusive).
      - name: coverage_to
        type: datetime
        source: input
        description: Last instant of coverage (inclusive; closed interval).
        constraints: "must be strictly after coverage_from"
      - name: service_fee_waived
        type: boolean
        source: input
        description: Contractual waiver of the out-of-market service fee for this specific mapping.
        default: false
      - name: status
        type: enum
        source: system
        description: Coverage lifecycle.
        default: ACTIVE
        constraints: "one of {ACTIVE, ENDED}"

  - name: DeviationAgreement
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract the deviated price applies under.
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the item receiving an off-invoice deviated price.
      - name: manufacturer_id
        type: string
        source: input
        description: FK -> Manufacturer.id; the bill-back counterparty; must equal Product.manufacturer_id.
      - name: bill_back_basis
        type: enum
        source: input
        description: FIXED_NET_PRICE pins deviated_price_cents at creation; COST_PLUS_PROTECTED re-derives it from the item's current cost basis on every activated price change notice.
        constraints: "one of {FIXED_NET_PRICE, COST_PLUS_PROTECTED}"
      - name: protected_discount_cents
        type: integer
        source: input
        description: Cents subtracted from the item's current cost basis under COST_PLUS_PROTECTED; required for that basis, must be null for FIXED_NET_PRICE.
        constraints: "> 0 when present"
      - name: requested_net_price_cents
        type: integer
        source: input
        description: Off-invoice net price requested under FIXED_NET_PRICE; required for that basis, must be null for COST_PLUS_PROTECTED.
        constraints: "> 0 when present"
      - name: deviated_price_cents
        type: integer
        source: computed
        description: Effective off-invoice net price per case, produced by deviated_price_resolution.
      - name: max_operator_price_cents
        type: integer
        source: input
        description: Ceiling the operator negotiated; a recomputed deviated_price_cents above it breaches the agreement.
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: First instant the deviated price applies (inclusive).
      - name: effective_to
        type: datetime
        source: input
        description: Instant the deviated price stops applying (exclusive; half-open interval).
        constraints: "must be strictly after effective_from"
      - name: status
        type: enum
        source: system
        description: Deviation lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, MANUFACTURER_APPROVED, REVISION_REQUESTED, REJECTED, ACTIVE, PRICE_CEILING_BREACHED, EXPIRED, TERMINATED}"
      - name: revision_round
        type: integer
        source: computed
        description: Count of REVISION_REQUESTED -> SUBMITTED loops completed; capped by MAX_REVISION_ROUNDS.
        default: 0
      - name: price_revision_count
        type: integer
        source: computed
        description: Count of times an activated PriceChangeNotice re-derived deviated_price_cents on this agreement.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the PricingAnalyst that last submitted the agreement; null before first submit.
      - name: manufacturer_decision_note
        type: string
        source: system
        description: Free-text note captured from the manufacturer's most recent decision; null before first decision.

  - name: SubstitutionRule
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract this substitution rule applies under.
      - name: primary_product_id
        type: string
        source: input
        description: FK -> Product.id; the contracted item that may go out of stock.
      - name: substitute_product_id
        type: string
        source: input
        description: FK -> Product.id; the candidate replacement item.
      - name: rank
        type: integer
        source: input
        description: Preference order used by substitute_selection; 1 is considered first.
        constraints: ">= 1"
      - name: price_protection_mode
        type: enum
        source: input
        description: HOLD_CONTRACT_PRICE invoices the primary item's contract price and keeps the line contracted; SUBSTITUTE_OWN_PRICE invoices the substitute's own contract price and makes the line non-contracted.
        constraints: "one of {HOLD_CONTRACT_PRICE, SUBSTITUTE_OWN_PRICE}"
      - name: max_price_delta_pct
        type: number
        source: input
        description: Maximum tolerated absolute percentage difference between the substitute's and the primary's contract list price; above it the rule is ineligible.
        constraints: ">= 0.00; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: Rule lifecycle; only ACTIVE rules enter the candidate set.
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: PriceChangeNotice
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract whose notice_period_days governs the notice window.
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the item whose cost is changing.
      - name: cost_basis
        type: enum
        source: input
        description: Which Product cost field activation will overwrite.
        constraints: "one of {LAST_COST, AVG_COST, REPLACEMENT_COST}"
      - name: published_index_value
        type: number
        source: input
        description: Published market index value; required when Product.is_market_indexed is true, must be null otherwise.
        constraints: "> 0 when present; 2 decimal places"
      - name: proposed_cost_cents
        type: integer
        source: input
        description: Directly proposed new cost per case; required when Product.is_market_indexed is false, must be null otherwise.
        constraints: "> 0 when present"
      - name: new_cost_cents
        type: integer
        source: computed
        description: Resolved new cost per case produced by market_index_cost_reset.
      - name: delta_pct
        type: number
        source: computed
        description: Signed percentage change from the item's current cost on cost_basis to new_cost_cents.
      - name: notice_required_days
        type: integer
        source: computed
        description: Advance-notice days demanded by market_index_cost_reset for this delta_pct.
      - name: earliest_effective_at
        type: datetime
        source: computed
        description: submitted_at plus notice_required_days; effective_at may not precede it.
      - name: effective_at
        type: datetime
        source: input
        description: Instant the operator's new cost takes effect.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the notice was created or last revised.
      - name: status
        type: enum
        source: system
        description: Notice lifecycle.
        default: PENDING
        constraints: "one of {PENDING, ACKNOWLEDGED, DISPUTED, EFFECTIVE, WITHDRAWN}"
      - name: dispute_note
        type: string
        source: system
        description: Operator's objection text; null unless the notice has been disputed.

  - name: RebatePeriod
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract this measurement period belongs to.
      - name: period_start
        type: datetime
        source: input
        description: First instant of the period (inclusive).
      - name: period_end
        type: datetime
        source: input
        description: Instant the period ends (exclusive; half-open interval).
        constraints: "must be strictly after period_start"
      - name: status
        type: enum
        source: system
        description: Period lifecycle.
        default: OPEN
        constraints: "one of {OPEN, CLOSED, SETTLED}"
      - name: gross_purchases_cents
        type: integer
        source: computed
        description: Sum of extended_price_cents over qualifying lines; null while OPEN.
      - name: contracted_purchases_cents
        type: integer
        source: computed
        description: Sum of extended_price_cents over qualifying lines with is_contracted_item true; null while OPEN.
      - name: qualifying_cases
        type: integer
        source: computed
        description: Sum of quantity_cases over qualifying lines; null while OPEN.
      - name: contracted_cases
        type: integer
        source: computed
        description: Sum of quantity_cases over qualifying lines with is_contracted_item true; null while OPEN.
      - name: compliance_pct
        type: number
        source: computed
        description: Output of contracted_purchase_compliance_pct under the contract's compliance_basis; null while OPEN.
      - name: rebate_rate_pct
        type: number
        source: computed
        description: Rebate rate selected from REBATE_RATE_TIERS by compliance_pct; null while OPEN.
      - name: operator_rebate_cents
        type: integer
        source: computed
        description: Operator rebate produced by rebate_accrual_split; null while OPEN.
      - name: manufacturer_funded_cents
        type: integer
        source: computed
        description: Manufacturer-funded share of operator_rebate_cents; null while OPEN.
      - name: distributor_funded_cents
        type: integer
        source: computed
        description: operator_rebate_cents minus manufacturer_funded_cents; null while OPEN.
      - name: settled_amount_cents
        type: integer
        source: computed
        description: Operator rebate amount actually settled; 0 unless status is SETTLED.
        default: 0
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times a dispute credit forced this period from CLOSED back to OPEN.
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent close; null while never closed.
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant of settlement; null unless SETTLED.
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the RebateAccountant that settled; null unless SETTLED.

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract the line is priced under.
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the item actually shipped (rewritten on substitution).
      - name: distribution_center_id
        type: string
        source: input
        description: FK -> DistributionCenter.id; the shipping DC.
      - name: rebate_period_id
        type: string
        source: computed
        description: FK -> RebatePeriod.id; the OPEN period whose half-open window contains order_date, resolved at creation.
      - name: deviation_agreement_id
        type: string
        source: computed
        description: FK -> DeviationAgreement.id; the ACTIVE deviation applied to this line, or null when the line was priced from the tier alone.
      - name: substituted_from_product_id
        type: string
        source: computed
        description: FK -> Product.id; the originally ordered item when the line was substituted, else null.
      - name: substitution_rule_id
        type: string
        source: computed
        description: FK -> SubstitutionRule.id; the rule the selector chose, else null.
      - name: applied_tier_id
        type: string
        source: computed
        description: FK -> ContractTier.id; the tier whose markup produced list_unit_price_cents.
      - name: bill_back_claim_id
        type: string
        source: computed
        description: FK -> BillBackClaim.id; the claim that swept this line, else null.
      - name: quantity_cases
        type: integer
        source: input
        description: Cases ordered on this line.
        constraints: ">= 1"
      - name: order_date
        type: datetime
        source: system
        description: Logical-clock instant at creation; drives tier volume, deviation window, and period assignment.
      - name: cost_basis_snapshot_cents
        type: integer
        source: computed
        description: The Product cost field named by the applied tier's cost_basis, frozen at creation; audits reprice from this value.
      - name: list_unit_price_cents
        type: integer
        source: computed
        description: Cost-plus contract price per case before any deviation, produced by contract_line_price.
      - name: invoiced_unit_price_cents
        type: integer
        source: computed
        description: Price per case actually invoiced (deviated price, held primary price, or list price).
      - name: extended_price_cents
        type: integer
        source: computed
        description: invoiced_unit_price_cents multiplied by quantity_cases.
      - name: service_fee_cents
        type: integer
        source: computed
        description: Out-of-market per-case service fee charged on this line, produced by out_of_market_service_fee.
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: extended_price_cents plus service_fee_cents.
      - name: is_contracted_item
        type: boolean
        source: computed
        description: Whether this line counts toward the contracted-item purchase percentage.
      - name: pricing_status
        type: enum
        source: system
        description: Invoicing dimension of the line's parallel state machine.
        default: DRAFT_PRICED
        constraints: "one of {DRAFT_PRICED, INVOICED, REPRICED, CREDITED}"
      - name: billback_status
        type: enum
        source: system
        description: Manufacturer-recovery dimension of the line's parallel state machine; evolves independently of pricing_status.
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, ACCRUED, CLAIMED, RECOVERED, WRITTEN_OFF}"
      - name: credited_amount_cents
        type: integer
        source: computed
        description: Total credit issued against this line by upheld pricing disputes.
        default: 0

  - name: BillBackClaim
    parent: null
    common_fields: true
    fields:
      - name: deviation_agreement_id
        type: string
        source: input
        description: FK -> DeviationAgreement.id; the deviation being recovered.
      - name: manufacturer_id
        type: string
        source: computed
        description: FK -> Manufacturer.id; copied from the deviation at creation.
      - name: claim_period_start
        type: datetime
        source: input
        description: First order_date swept by the claim (inclusive).
      - name: claim_period_end
        type: datetime
        source: input
        description: Order_date bound the claim stops at (exclusive; half-open interval).
        constraints: "must be strictly after claim_period_start"
      - name: claimed_cases
        type: integer
        source: computed
        description: Sum of quantity_cases over swept lines.
      - name: claimed_amount_cents
        type: integer
        source: computed
        description: Recoverable amount produced by bill_back_claim_amount.
      - name: recovered_amount_cents
        type: integer
        source: computed
        description: Cash applied to this claim by the remittance waterfall.
        default: 0
      - name: status
        type: enum
        source: system
        description: Claim lifecycle.
        default: ACCRUED
        constraints: "one of {ACCRUED, SUBMITTED, PARTIALLY_RECOVERED, RECOVERED, DISPUTED, WRITTEN_OFF}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RebateAccountant that submitted the claim; null before first submit.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit; null before first submit.
      - name: write_off_reason
        type: string
        source: system
        description: Auditor's justification; null unless WRITTEN_OFF.

  - name: BillBackRemittance
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: FK -> Manufacturer.id; the remitting manufacturer.
      - name: remitted_amount_cents
        type: integer
        source: input
        description: Cash amount received, in cents.
        constraints: ">= 1"
      - name: remittance_reference
        type: string
        source: input
        description: Manufacturer's payment reference, unique per manufacturer.
        constraints: "unique per manufacturer_id"
      - name: applied_claim_ids
        type: array
        source: computed
        description: Ordered claim ids the waterfall applied cash to, in application order.
      - name: applied_amount_cents
        type: integer
        source: computed
        description: Portion of remitted_amount_cents applied to claims.
      - name: unapplied_amount_cents
        type: integer
        source: computed
        description: Portion parked on Manufacturer.unapplied_credit_cents.
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant of receipt.
      - name: status
        type: enum
        source: system
        description: Remittance lifecycle.
        default: APPLIED
        constraints: "one of {APPLIED, REVERSED}"

  - name: PricingDispute
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: FK -> OrderLine.id; the invoiced line whose price is contested.
      - name: contract_id
        type: string
        source: computed
        description: FK -> Contract.id; copied from the order line at creation.
      - name: claimed_correct_unit_price_cents
        type: integer
        source: input
        description: Unit price the operator asserts should have been invoiced.
        constraints: ">= 0"
      - name: dispute_reason
        type: enum
        source: input
        description: Category of the alleged pricing error.
        constraints: "one of {TIER_MISAPPLIED, DEVIATION_NOT_APPLIED, COST_BASIS_WRONG, SERVICE_FEE_WRONG}"
      - name: audited_correct_unit_price_cents
        type: integer
        source: computed
        description: Unit price the audit recomputes; null before the audit starts.
      - name: variance_cents_per_case
        type: integer
        source: computed
        description: invoiced_unit_price_cents minus audited_correct_unit_price_cents; null before the audit starts.
      - name: variance_pct
        type: number
        source: computed
        description: Absolute variance as a percentage of invoiced_unit_price_cents; null before the audit starts.
      - name: credit_amount_cents
        type: integer
        source: computed
        description: Credit issued to the operator; null until the credit is issued.
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle.
        default: OPEN
        constraints: "one of {OPEN, UNDER_AUDIT, UPHELD, REJECTED, CREDIT_ISSUED, WITHDRAWN}"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the OperatorBuyer that opened the dispute.
      - name: audited_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAuditor that most recently audited; null before the audit starts.
      - name: audit_note
        type: string
        source: system
        description: Auditor's note captured on request-info or resolve; null before the audit starts.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /nac/contracts/{contract_id}/submit-for-signature"
        actor: NationalAccountManager
        preconditions:
          - "Contract.status == DRAFT"
          - "at least one ContractTier with status ACTIVE exists for this contract"
          - "at least one DcCoverage with status ACTIVE exists for this contract"
        side_effects:
          - "Contract.updated_at refreshed; Contract.version incremented by 1"
      - from: PENDING_SIGNATURE
        to: DRAFT
        trigger: "POST /nac/contracts/{contract_id}/return-to-draft"
        actor: OperatorBuyer
        preconditions:
          - "Contract.status == PENDING_SIGNATURE"
          - "X-User-ID == Contract.operator_id"
        side_effects:
          - "Contract.updated_at refreshed; Contract.version incremented by 1"
        note: "Revision loop; the manager may resubmit, producing the PENDING_SIGNATURE -> DRAFT -> PENDING_SIGNATURE cycle."
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /nac/contracts/{contract_id}/sign"
        actor: OperatorBuyer
        preconditions:
          - "Contract.status == PENDING_SIGNATURE"
          - "X-User-ID == Contract.operator_id"
          - "Operator.status == ACTIVE"
          - "when Contract.amends_contract_id is not null, the parent Contract.status == AMENDING"
        side_effects:
          - "Contract.signed_at = logical clock; Contract.signed_by_user_id = X-User-ID"
          - "Contract.compliance_posture recomputed by contract_compliance_posture (OPEN with no closed periods)"
          - "when Contract.amends_contract_id is not null: parent Contract AMENDING -> EXPIRED, and because the parent expired, every ContractTier of the parent with status ACTIVE -> SUPERSEDED and every DcCoverage of the parent with status ACTIVE -> ENDED"
          - "Contract.version incremented by 1"
      - from: ACTIVE
        to: AMENDING
        trigger: "POST /nac/contracts/{contract_id}/amendments"
        actor: NationalAccountManager
        preconditions:
          - "Contract.status == ACTIVE"
          - "Contract.compliance_posture != RESTRICTED"
          - "no Contract row already exists with amends_contract_id == this contract and status IN {DRAFT, PENDING_SIGNATURE}"
        side_effects:
          - "a new Contract row is created with status DRAFT, amends_contract_id = this contract id, and the amendment payload's terms"
          - "Contract.version incremented by 1"
      - from: AMENDING
        to: ACTIVE
        trigger: "POST /nac/contracts/{contract_id}/terminate applied to the amendment draft"
        actor: NationalAccountManager
        preconditions:
          - "the amendment draft Contract.status IN {DRAFT, PENDING_SIGNATURE}"
          - "the parent Contract.status == AMENDING"
        side_effects:
          - "amendment draft Contract -> TERMINATED"
          - "because the draft terminated, the parent Contract AMENDING -> ACTIVE and parent Contract.version incremented by 1"
        note: "Abandoning an amendment returns the parent to ACTIVE, closing the ACTIVE -> AMENDING -> ACTIVE cycle."
      - from: AMENDING
        to: EXPIRED
        trigger: "POST /nac/contracts/{contract_id}/sign applied to the amendment draft (system cascade)"
        actor: system
        preconditions:
          - "the amendment draft Contract.status == PENDING_SIGNATURE"
          - "the parent Contract.status == AMENDING"
        side_effects:
          - "every ContractTier of the parent with status ACTIVE -> SUPERSEDED"
          - "every DcCoverage of the parent with status ACTIVE -> ENDED"
          - "parent Contract.version incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /nac/contracts/{contract_id}/suspend"
        actor: NationalAccountManager
        preconditions:
          - "Contract.status == ACTIVE"
        side_effects:
          - "Contract.version incremented by 1"
      - from: AMENDING
        to: SUSPENDED
        trigger: "POST /nac/contracts/{contract_id}/suspend"
        actor: NationalAccountManager
        preconditions:
          - "Contract.status == AMENDING"
        side_effects:
          - "Contract.version incremented by 1"
        note: "Suspending a parent mid-amendment strands the outstanding amendment draft: signing it now fails validation priority 7 because the parent is no longer AMENDING. Reinstate returns the parent to ACTIVE (still not AMENDING) and the draft may still be terminated, so no state is deadlocked."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /nac/contracts/{contract_id}/reinstate"
        actor: NationalAccountManager
        preconditions:
          - "Contract.status == SUSPENDED"
          - "logical clock <= Contract.effective_to"
        side_effects:
          - "Contract.compliance_posture recomputed by contract_compliance_posture"
          - "Contract.version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /nac/_clock/set_current_utc advancing the logical clock past Contract.effective_to (system sweep)"
        actor: system
        preconditions:
          - "Contract.status IN {ACTIVE, SUSPENDED}"
          - "new logical clock > Contract.effective_to"
        side_effects:
          - "every DeviationAgreement of the contract with status IN {DRAFT, SUBMITTED, MANUFACTURER_APPROVED, REVISION_REQUESTED, ACTIVE, PRICE_CEILING_BREACHED} -> TERMINATED"
          - "every DcCoverage of the contract with status ACTIVE -> ENDED"
          - "Contract.version incremented by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /nac/contracts/{contract_id}/terminate"
        actor: NationalAccountManager
        preconditions:
          - "Contract.status IN {DRAFT, PENDING_SIGNATURE, ACTIVE, SUSPENDED}"
          - "no RebatePeriod of this contract has status CLOSED with rebate_payable_cents contribution outstanding, i.e. Contract.rebate_payable_cents == 0"
        side_effects:
          - "every DeviationAgreement of the contract with status IN {DRAFT, SUBMITTED, MANUFACTURER_APPROVED, REVISION_REQUESTED, ACTIVE, PRICE_CEILING_BREACHED} -> TERMINATED"
          - "every ContractTier of the contract with status ACTIVE -> SUPERSEDED"
          - "every DcCoverage of the contract with status ACTIVE -> ENDED"
          - "when Contract.amends_contract_id is not null and the parent is AMENDING, the parent Contract AMENDING -> ACTIVE"
          - "Contract.version incremented by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /nac/contracts/{contract_id}/terminate"
        actor: NationalAccountManager
        preconditions:
          - "Contract.status == SUSPENDED"
          - "Contract.rebate_payable_cents == 0"
        side_effects:
          - "same cascade as the ACTIVE -> TERMINATED transition"
          - "Contract.version incremented by 1"

  - entity: ContractTier
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade from Contract AMENDING -> EXPIRED or Contract -> TERMINATED"
        actor: system
        preconditions:
          - "ContractTier.status == ACTIVE"
          - "the owning Contract left the ACTIVE or AMENDING state in the same request"
        side_effects:
          - "ContractTier.version incremented by 1"
          - "the tier is excluded from every subsequent contract_line_price tier lookup"

  - entity: DcCoverage
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "system cascade from Contract AMENDING -> EXPIRED, Contract ACTIVE -> EXPIRED, or Contract -> TERMINATED"
        actor: system
        preconditions:
          - "DcCoverage.status == ACTIVE"
          - "the owning Contract left the ACTIVE or AMENDING state in the same request"
        side_effects:
          - "DcCoverage.version incremented by 1"
          - "subsequent POST /nac/order-lines against the same DC fail ERR_DC_NOT_COVERED"

  - entity: DeviationAgreement
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nac/deviation-agreements/{deviation_agreement_id}/submit"
        actor: PricingAnalyst
        preconditions:
          - "DeviationAgreement.status IN {DRAFT, REVISION_REQUESTED}"
          - "Contract.status == ACTIVE"
          - "DeviationAgreement.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "DeviationAgreement.submitted_by_user_id = X-User-ID"
          - "DeviationAgreement.version incremented by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /nac/deviation-agreements/{deviation_agreement_id}/submit"
        actor: PricingAnalyst
        preconditions:
          - "DeviationAgreement.status == REVISION_REQUESTED"
          - "Contract.status == ACTIVE"
          - "DeviationAgreement.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "DeviationAgreement.revision_round incremented by 1"
          - "DeviationAgreement.submitted_by_user_id = X-User-ID"
          - "DeviationAgreement.version incremented by 1"
        note: "Negotiation loop: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED, bounded by MAX_REVISION_ROUNDS."
      - from: SUBMITTED
        to: MANUFACTURER_APPROVED
        trigger: "POST /nac/deviation-agreements/{deviation_agreement_id}/manufacturer-decision with decision APPROVE"
        actor: ManufacturerRep
        preconditions:
          - "DeviationAgreement.status == SUBMITTED"
          - "X-User-ID == DeviationAgreement.manufacturer_id"
          - "Manufacturer.status == ACTIVE"
        side_effects:
          - "DeviationAgreement.manufacturer_decision_note = decision_note"
          - "DeviationAgreement.version incremented by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /nac/deviation-agreements/{deviation_agreement_id}/manufacturer-decision with decision REQUEST_REVISION"
        actor: ManufacturerRep
        preconditions:
          - "DeviationAgreement.status == SUBMITTED"
          - "X-User-ID == DeviationAgreement.manufacturer_id"
        side_effects:
          - "DeviationAgreement.manufacturer_decision_note = decision_note"
          - "DeviationAgreement.version incremented by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /nac/deviation-agreements/{deviation_agreement_id}/manufacturer-decision with decision REJECT"
        actor: ManufacturerRep
        preconditions:
          - "DeviationAgreement.status == SUBMITTED"
          - "X-User-ID == DeviationAgreement.manufacturer_id"
        side_effects:
          - "DeviationAgreement.manufacturer_decision_note = decision_note"
          - "DeviationAgreement.version incremented by 1"
        note: "Three-way branch out of SUBMITTED with divergent side-effect sets per branch."
      - from: MANUFACTURER_APPROVED
        to: ACTIVE
        trigger: "POST /nac/deviation-agreements/{deviation_agreement_id}/activate"
        actor: NationalAccountManager
        preconditions:
          - "DeviationAgreement.status == MANUFACTURER_APPROVED"
          - "Contract.status == ACTIVE"
          - "Contract.compliance_posture != RESTRICTED"
          - "X-User-ID != DeviationAgreement.submitted_by_user_id"
          - "DeviationAgreement.deviated_price_cents <= DeviationAgreement.max_operator_price_cents"
        side_effects:
          - "subsequent POST /nac/order-lines on this contract and product within [effective_from, effective_to) price at deviated_price_cents"
          - "DeviationAgreement.version incremented by 1"
      - from: ACTIVE
        to: PRICE_CEILING_BREACHED
        trigger: "system cascade from PriceChangeNotice ACKNOWLEDGED -> EFFECTIVE"
        actor: system
        preconditions:
          - "DeviationAgreement.status == ACTIVE"
          - "DeviationAgreement.bill_back_basis == COST_PLUS_PROTECTED"
          - "the re-derived deviated_price_cents > DeviationAgreement.max_operator_price_cents"
        side_effects:
          - "because the ceiling was breached, Contract.deviation_breach_count incremented by 1 and Contract.version incremented by 1"
          - "because deviation_breach_count reached DEVIATION_BREACH_POSTURE_LIMIT, Contract.compliance_posture recomputed to RESTRICTED"
          - "DeviationAgreement.version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /nac/_clock/set_current_utc advancing the logical clock to or past effective_to (system sweep)"
        actor: system
        preconditions:
          - "DeviationAgreement.status IN {ACTIVE, PRICE_CEILING_BREACHED}"
          - "new logical clock >= DeviationAgreement.effective_to"
        side_effects:
          - "DeviationAgreement.version incremented by 1"
      - from: PRICE_CEILING_BREACHED
        to: TERMINATED
        trigger: "POST /nac/contracts/{contract_id}/terminate (system cascade)"
        actor: system
        preconditions:
          - "DeviationAgreement.status NOT IN {REJECTED, EXPIRED, TERMINATED}"
          - "the owning Contract transitioned to TERMINATED or EXPIRED in the same request"
        side_effects:
          - "DeviationAgreement.version incremented by 1"

  - entity: PriceChangeNotice
    initial_state: PENDING
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /nac/price-change-notices/{price_change_notice_id}/acknowledge"
        actor: OperatorBuyer
        preconditions:
          - "PriceChangeNotice.status IN {PENDING, DISPUTED}"
          - "X-User-ID == Contract.operator_id"
        side_effects:
          - "PriceChangeNotice.version incremented by 1"
      - from: PENDING
        to: DISPUTED
        trigger: "POST /nac/price-change-notices/{price_change_notice_id}/dispute"
        actor: OperatorBuyer
        preconditions:
          - "PriceChangeNotice.status == PENDING"
          - "X-User-ID == Contract.operator_id"
        side_effects:
          - "PriceChangeNotice.dispute_note = note"
          - "PriceChangeNotice.version incremented by 1"
      - from: DISPUTED
        to: PENDING
        trigger: "POST /nac/price-change-notices/{price_change_notice_id}/revise"
        actor: PricingAnalyst
        preconditions:
          - "PriceChangeNotice.status == DISPUTED"
          - "Contract.status == ACTIVE"
        side_effects:
          - "PriceChangeNotice.submitted_at reset to the logical clock; new_cost_cents, delta_pct, notice_required_days and earliest_effective_at recomputed by market_index_cost_reset from the revised inputs"
          - "PriceChangeNotice.dispute_note cleared to null"
          - "PriceChangeNotice.version incremented by 1"
        note: "Renegotiation loop PENDING -> DISPUTED -> PENDING; each revision restarts the notice clock."
      - from: DISPUTED
        to: ACKNOWLEDGED
        trigger: "POST /nac/price-change-notices/{price_change_notice_id}/acknowledge"
        actor: OperatorBuyer
        preconditions:
          - "PriceChangeNotice.status == DISPUTED"
          - "X-User-ID == Contract.operator_id"
        side_effects:
          - "PriceChangeNotice.version incremented by 1"
      - from: ACKNOWLEDGED
        to: EFFECTIVE
        trigger: "POST /nac/price-change-notices/{price_change_notice_id}/activate"
        actor: PricingAnalyst
        preconditions:
          - "PriceChangeNotice.status == ACKNOWLEDGED"
          - "logical clock >= PriceChangeNotice.effective_at"
          - "Contract.status == ACTIVE"
        side_effects:
          - "HOP 1: the Product cost field named by cost_basis is set to new_cost_cents and Product.cost_effective_at = logical clock; Product.version incremented by 1"
          - "HOP 2 (caused by HOP 1): every DeviationAgreement with product_id == this product, status ACTIVE and bill_back_basis COST_PLUS_PROTECTED re-derives deviated_price_cents via deviated_price_resolution, increments price_revision_count by 1 and increments its version by 1"
          - "HOP 3 (caused by HOP 2): each such agreement whose re-derived deviated_price_cents exceeds max_operator_price_cents transitions ACTIVE -> PRICE_CEILING_BREACHED and increments Contract.deviation_breach_count by 1"
          - "HOP 4 (caused by HOP 3): once Contract.deviation_breach_count >= DEVIATION_BREACH_POSTURE_LIMIT, Contract.compliance_posture is recomputed to RESTRICTED, which thereafter blocks POST /nac/deviation-agreements/{id}/activate and POST /nac/contracts/{id}/amendments"
          - "PriceChangeNotice.version incremented by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /nac/price-change-notices/{price_change_notice_id}/withdraw"
        actor: PricingAnalyst
        preconditions:
          - "PriceChangeNotice.status IN {PENDING, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "PriceChangeNotice.version incremented by 1"
          - "the notice no longer occupies the rolling NOTICE_WINDOW_DAYS slot for its product"

  - entity: OrderLine
    initial_state: DRAFT_PRICED
    terminal_states: [CREDITED]
    transitions:
      - from: DRAFT_PRICED
        to: DRAFT_PRICED
        trigger: "POST /nac/order-lines/{order_line_id}/substitute"
        actor: OperatorBuyer
        preconditions:
          - "OrderLine.pricing_status == DRAFT_PRICED"
          - "X-User-ID == Contract.operator_id"
          - "Product.stock_status == OUT_OF_STOCK for the currently referenced product"
          - "substitute_selection yields a non-empty candidate set"
        side_effects:
          - "OrderLine.substituted_from_product_id = previous product_id; product_id = selected substitute; substitution_rule_id = selected rule"
          - "applied_tier_id, cost_basis_snapshot_cents, list_unit_price_cents, invoiced_unit_price_cents, extended_price_cents, service_fee_cents, invoice_total_cents, is_contracted_item and deviation_agreement_id all recomputed for the substitute"
          - "OrderLine.version incremented by 1"
        note: "pricing_status dimension self-loop: repricing without leaving DRAFT_PRICED."
      - from: DRAFT_PRICED
        to: INVOICED
        trigger: "POST /nac/order-lines/{order_line_id}/invoice"
        actor: NationalAccountManager
        preconditions:
          - "OrderLine.pricing_status == DRAFT_PRICED"
          - "Contract.status == ACTIVE"
        side_effects:
          - "on the independent billback dimension: when OrderLine.deviation_agreement_id is not null, billback_status NOT_APPLICABLE -> ACCRUED; otherwise billback_status stays NOT_APPLICABLE"
          - "the line becomes eligible for RebatePeriod close aggregation and for BillBackClaim sweeps"
          - "OrderLine.version incremented by 1"
      - from: INVOICED
        to: REPRICED
        trigger: "POST /nac/order-lines/{order_line_id}/reprice"
        actor: NationalAccountManager
        preconditions:
          - "OrderLine.pricing_status == INVOICED"
          - "Contract.status == ACTIVE"
          - "the RebatePeriod referenced by OrderLine.rebate_period_id has status OPEN"
        side_effects:
          - "list_unit_price_cents, invoiced_unit_price_cents, extended_price_cents, service_fee_cents and invoice_total_cents recomputed from the current cost basis and the currently ACTIVE tier"
          - "OrderLine.version incremented by 1"
      - from: REPRICED
        to: INVOICED
        trigger: "POST /nac/order-lines/{order_line_id}/invoice"
        actor: NationalAccountManager
        preconditions:
          - "OrderLine.pricing_status == REPRICED"
          - "Contract.status == ACTIVE"
        side_effects:
          - "OrderLine.version incremented by 1"
        note: "INVOICED -> REPRICED -> INVOICED cycle inside the pricing dimension, independent of billback_status."
      - from: INVOICED
        to: CREDITED
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/issue-credit (system cascade)"
        actor: system
        preconditions:
          - "OrderLine.pricing_status IN {INVOICED, REPRICED}"
          - "the referencing PricingDispute.status == UPHELD"
        side_effects:
          - "invoiced_unit_price_cents = PricingDispute.audited_correct_unit_price_cents; extended_price_cents, invoice_total_cents recomputed; credited_amount_cents increased by PricingDispute.credit_amount_cents"
          - "when billback_status == CLAIMED, the referenced BillBackClaim SUBMITTED -> DISPUTED"
          - "OrderLine.version incremented by 1"

  - entity: OrderLine
    initial_state: NOT_APPLICABLE
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: NOT_APPLICABLE
        to: ACCRUED
        trigger: "POST /nac/order-lines/{order_line_id}/invoice on a line carrying a deviation"
        actor: NationalAccountManager
        preconditions:
          - "OrderLine.deviation_agreement_id is not null"
          - "OrderLine.pricing_status transitions DRAFT_PRICED -> INVOICED in the same request"
        side_effects:
          - "the line enters the qualifying set of bill_back_claim_amount"
      - from: ACCRUED
        to: CLAIMED
        trigger: "POST /nac/bill-back-claims"
        actor: RebateAccountant
        preconditions:
          - "OrderLine.billback_status == ACCRUED"
          - "OrderLine.order_date IN [claim_period_start, claim_period_end)"
        side_effects:
          - "OrderLine.bill_back_claim_id = the new claim id"
          - "OrderLine.version incremented by 1"
      - from: CLAIMED
        to: RECOVERED
        trigger: "POST /nac/bill-back-remittances (system cascade when the claim reaches RECOVERED)"
        actor: system
        preconditions:
          - "OrderLine.billback_status == CLAIMED"
          - "the referenced BillBackClaim.status transitions to RECOVERED in the same request"
        side_effects:
          - "OrderLine.version incremented by 1"
      - from: CLAIMED
        to: WRITTEN_OFF
        trigger: "POST /nac/bill-back-claims/{bill_back_claim_id}/write-off (system cascade)"
        actor: system
        preconditions:
          - "OrderLine.billback_status == CLAIMED"
          - "the referenced BillBackClaim.status transitions to WRITTEN_OFF in the same request"
        side_effects:
          - "OrderLine.version incremented by 1"
    note: >-
      Second, independent state dimension on the same OrderLine row. pricing_status
      and billback_status advance on different triggers and neither constrains the
      other: a CREDITED line may still be CLAIMED, and a RECOVERED line may still be
      REPRICED.

  - entity: BillBackClaim
    initial_state: ACCRUED
    terminal_states: [RECOVERED, WRITTEN_OFF]
    transitions:
      - from: ACCRUED
        to: SUBMITTED
        trigger: "POST /nac/bill-back-claims/{bill_back_claim_id}/submit"
        actor: RebateAccountant
        preconditions:
          - "BillBackClaim.status IN {ACCRUED, DISPUTED}"
          - "Manufacturer.status == ACTIVE"
          - "BillBackClaim.claimed_amount_cents >= 1"
        side_effects:
          - "BillBackClaim.submitted_by_user_id = X-User-ID; submitted_at = logical clock"
          - "Manufacturer.open_claim_exposure_cents recomputed; Manufacturer.version incremented by 1"
          - "BillBackClaim.version incremented by 1"
      - from: SUBMITTED
        to: PARTIALLY_RECOVERED
        trigger: "POST /nac/bill-back-remittances (system cascade, partial allocation)"
        actor: system
        preconditions:
          - "BillBackClaim.status IN {SUBMITTED, PARTIALLY_RECOVERED}"
          - "0 < recovered_amount_cents after allocation < claimed_amount_cents"
        side_effects:
          - "BillBackClaim.recovered_amount_cents increased by the allocated slice"
          - "Manufacturer.open_claim_exposure_cents recomputed"
          - "BillBackClaim.version incremented by 1"
      - from: SUBMITTED
        to: RECOVERED
        trigger: "POST /nac/bill-back-remittances (system cascade, full allocation)"
        actor: system
        preconditions:
          - "BillBackClaim.status IN {SUBMITTED, PARTIALLY_RECOVERED}"
          - "recovered_amount_cents after allocation == claimed_amount_cents"
        side_effects:
          - "every OrderLine with bill_back_claim_id == this claim and billback_status CLAIMED -> RECOVERED"
          - "Manufacturer.open_claim_exposure_cents recomputed"
          - "BillBackClaim.version incremented by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /nac/bill-back-claims/{bill_back_claim_id}/dispute, or system cascade from OrderLine INVOICED -> CREDITED"
        actor: ManufacturerRep
        preconditions:
          - "BillBackClaim.status IN {SUBMITTED, PARTIALLY_RECOVERED}"
          - "when actor is ManufacturerRep, X-User-ID == BillBackClaim.manufacturer_id"
        side_effects:
          - "BillBackClaim.claimed_amount_cents recomputed by bill_back_claim_amount over the currently swept lines"
          - "Manufacturer.open_claim_exposure_cents recomputed"
          - "BillBackClaim.version incremented by 1"
        note: "SUBMITTED -> DISPUTED -> SUBMITTED cycle; a re-submit re-opens recovery."
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /nac/bill-back-claims/{bill_back_claim_id}/write-off"
        actor: ContractAuditor
        preconditions:
          - "BillBackClaim.status IN {SUBMITTED, PARTIALLY_RECOVERED, DISPUTED}"
          - "X-User-ID != BillBackClaim.submitted_by_user_id"
        side_effects:
          - "every OrderLine with bill_back_claim_id == this claim and billback_status CLAIMED -> WRITTEN_OFF"
          - "Manufacturer.open_claim_exposure_cents recomputed; Manufacturer.version incremented by 1"
          - "BillBackClaim.version incremented by 1"

  - entity: BillBackRemittance
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /nac/bill-back-remittances/{bill_back_remittance_id}/reverse"
        actor: RebateAccountant
        preconditions:
          - "BillBackRemittance.status == APPLIED"
          - "every claim id in applied_claim_ids still has status IN {SUBMITTED, PARTIALLY_RECOVERED, RECOVERED, DISPUTED}"
        side_effects:
          - "each claim in applied_claim_ids has recovered_amount_cents reduced by the slice this remittance applied to it and its status recomputed (RECOVERED or PARTIALLY_RECOVERED -> SUBMITTED when recovered_amount_cents returns to 0, PARTIALLY_RECOVERED when still positive)"
          - "every OrderLine with billback_status RECOVERED under those claims reverts to CLAIMED"
          - "Manufacturer.unapplied_credit_cents reduced by unapplied_amount_cents; Manufacturer.total_remitted_cents reduced by remitted_amount_cents; Manufacturer.open_claim_exposure_cents recomputed; Manufacturer.version incremented by 1"
          - "the manufacturer_recovery_conservation invariant holds before and after"
          - "BillBackRemittance.version incremented by 1"

  - entity: RebatePeriod
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /nac/rebate-periods/{rebate_period_id}/close"
        actor: RebateAccountant
        preconditions:
          - "RebatePeriod.status == OPEN"
          - "Contract.status IN {ACTIVE, SUSPENDED, EXPIRED}"
          - "logical clock >= RebatePeriod.period_end"
        side_effects:
          - "gross_purchases_cents, contracted_purchases_cents, qualifying_cases, contracted_cases, compliance_pct, rebate_rate_pct, operator_rebate_cents, manufacturer_funded_cents, distributor_funded_cents computed by contracted_purchase_compliance_pct and rebate_accrual_split; closed_at = logical clock"
          - "Contract.rebate_payable_cents increased by operator_rebate_cents; Contract.version incremented by 1"
          - "Manufacturer(rebate_funding_manufacturer_id).rebate_funding_payable_cents increased by manufacturer_funded_cents; Manufacturer.version incremented by 1"
          - "Contract.compliance_posture recomputed by contract_compliance_posture from this newly closed period"
          - "RebatePeriod.version incremented by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/issue-credit (system cascade)"
        actor: system
        preconditions:
          - "RebatePeriod.status == CLOSED"
          - "the credited OrderLine.rebate_period_id == this period"
        side_effects:
          - "Contract.rebate_payable_cents decreased by this period's operator_rebate_cents; Manufacturer.rebate_funding_payable_cents decreased by this period's manufacturer_funded_cents"
          - "gross_purchases_cents, contracted_purchases_cents, qualifying_cases, contracted_cases, compliance_pct, rebate_rate_pct, operator_rebate_cents, manufacturer_funded_cents, distributor_funded_cents reset to null; closed_at reset to null; reopen_count incremented by 1"
          - "Contract.compliance_posture recomputed by contract_compliance_posture"
          - "RebatePeriod.version incremented by 1"
        note: "CLOSED -> OPEN -> CLOSED revision cycle driven by audit credits."
      - from: CLOSED
        to: SETTLED
        trigger: "POST /nac/rebate-periods/{rebate_period_id}/settle"
        actor: RebateAccountant
        preconditions:
          - "RebatePeriod.status == CLOSED"
          - "no PricingDispute with contract_id == this contract has status IN {OPEN, UNDER_AUDIT} whose order line's rebate_period_id == this period"
          - "Contract.compliance_posture != RESTRICTED"
        side_effects:
          - "settled_amount_cents = operator_rebate_cents; settled_at = logical clock; settled_by_user_id = X-User-ID"
          - "Contract.rebate_payable_cents decreased by operator_rebate_cents; Contract.rebate_settled_total_cents increased by the same amount; Contract.version incremented by 1"
          - "Manufacturer.rebate_funding_payable_cents decreased by manufacturer_funded_cents; Manufacturer.version incremented by 1"
          - "the rebate_liability_conservation invariant holds before and after"
          - "RebatePeriod.version incremented by 1"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /nac/rebate-periods/{rebate_period_id}/reverse-settlement"
        actor: ContractAuditor
        preconditions:
          - "RebatePeriod.status == SETTLED"
        side_effects:
          - "settled_amount_cents reset to 0; settled_at and settled_by_user_id reset to null"
          - "Contract.rebate_payable_cents increased by operator_rebate_cents; Contract.rebate_settled_total_cents decreased by the same amount; Contract.version incremented by 1"
          - "Manufacturer.rebate_funding_payable_cents increased by manufacturer_funded_cents; Manufacturer.version incremented by 1"
          - "the rebate_liability_conservation invariant holds before and after"
          - "RebatePeriod.version incremented by 1"
        note: "Compensating action closing the CLOSED -> SETTLED -> CLOSED cycle."

  - entity: PricingDispute
    initial_state: OPEN
    terminal_states: [REJECTED, CREDIT_ISSUED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_AUDIT
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/start-audit"
        actor: ContractAuditor
        preconditions:
          - "PricingDispute.status == OPEN"
          - "the RebatePeriod referenced by the disputed OrderLine.rebate_period_id has status IN {CLOSED, SETTLED}"
        side_effects:
          - "audited_correct_unit_price_cents computed by dispute_audit_repricing using the retroactive_tier variant of contract_line_price"
          - "variance_cents_per_case and variance_pct computed"
          - "audited_by_user_id = X-User-ID"
          - "PricingDispute.version incremented by 1"
      - from: UNDER_AUDIT
        to: OPEN
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/request-info"
        actor: ContractAuditor
        preconditions:
          - "PricingDispute.status == UNDER_AUDIT"
        side_effects:
          - "audit_note = note; audited_correct_unit_price_cents, variance_cents_per_case and variance_pct reset to null"
          - "PricingDispute.version incremented by 1"
        note: "OPEN -> UNDER_AUDIT -> OPEN loop; each restart re-derives the audited price from the then-current period volume."
      - from: UNDER_AUDIT
        to: UPHELD
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/resolve with resolution UPHELD"
        actor: ContractAuditor
        preconditions:
          - "PricingDispute.status == UNDER_AUDIT"
          - "PricingDispute.variance_pct >= AUDIT_TOLERANCE_PCT"
          - "PricingDispute.variance_cents_per_case > 0"
        side_effects:
          - "audit_note = note; audited_by_user_id = X-User-ID"
          - "PricingDispute.version incremented by 1"
      - from: UNDER_AUDIT
        to: REJECTED
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/resolve with resolution REJECTED"
        actor: ContractAuditor
        preconditions:
          - "PricingDispute.status == UNDER_AUDIT"
        side_effects:
          - "audit_note = note; audited_by_user_id = X-User-ID"
          - "PricingDispute.version incremented by 1"
      - from: UPHELD
        to: CREDIT_ISSUED
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/issue-credit"
        actor: ContractAuditor
        preconditions:
          - "PricingDispute.status == UPHELD"
          - "the RebatePeriod referenced by the disputed OrderLine.rebate_period_id has status != SETTLED"
        side_effects:
          - "HOP 1: credit_amount_cents = variance_cents_per_case * OrderLine.quantity_cases; PricingDispute.version incremented by 1"
          - "HOP 2 (caused by HOP 1): OrderLine pricing_status INVOICED or REPRICED -> CREDITED, invoiced_unit_price_cents rewritten to audited_correct_unit_price_cents, extended_price_cents and invoice_total_cents recomputed, credited_amount_cents increased by credit_amount_cents, OrderLine.version incremented by 1"
          - "HOP 3 (caused by HOP 2): the RebatePeriod referenced by that line, when CLOSED, transitions CLOSED -> OPEN, clears all computed metrics and increments reopen_count by 1"
          - "HOP 4 (caused by HOP 3): Contract.rebate_payable_cents decreased by that period's operator_rebate_cents, Manufacturer.rebate_funding_payable_cents decreased by that period's manufacturer_funded_cents, Contract.compliance_posture recomputed, Contract.version and Manufacturer.version each incremented by 1"
          - "SIDE BRANCH of HOP 2: when the credited line's billback_status == CLAIMED, its BillBackClaim SUBMITTED -> DISPUTED and claimed_amount_cents recomputed"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/withdraw"
        actor: OperatorBuyer
        preconditions:
          - "PricingDispute.status IN {OPEN, UNDER_AUDIT}"
          - "X-User-ID == Contract.operator_id"
        side_effects:
          - "PricingDispute.version incremented by 1"
          - "the period this dispute blocked becomes settleable again"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: deviation-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /nac/deviation-agreements"
    occ_field: "expected_contract_version"
    description: |
      Creating a DeviationAgreement against a Contract whose version has advanced
      since the client last read it is rejected as stale. This captures the case
      where the contract's tier table or posture has already moved on (a tier was
      added, an amendment was opened, a period was closed) so the deviated price
      the client computed from its stale view of the contract would legitimately
      supersede or contradict the current terms.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: claim-create-stale-deviation
    parent_entity: DeviationAgreement
    write_endpoint: "POST /nac/bill-back-claims"
    occ_field: "expected_deviation_agreement_version"
    description: |
      Creating a BillBackClaim against a DeviationAgreement whose version has
      advanced since the client last read it is rejected as stale. A new claim
      legitimately supersedes the accrual view the client held, and an activated
      price change notice may have re-derived deviated_price_cents in between,
      which would change the recoverable delta the claim is built from.
    error_id: ERR_STALE_DEVIATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: contract_line_price
    trigger: "POST /nac/order-lines, POST /nac/order-lines/{order_line_id}/substitute, POST /nac/order-lines/{order_line_id}/reprice, and (retroactive_tier variant only) POST /nac/pricing-disputes/{pricing_dispute_id}/start-audit"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - tier selection (volume band on the product class)
      class_cases = SUM(ol.quantity_cases) over OrderLine ol WHERE
                      ol.contract_id == line.contract_id
                      AND Product(ol.product_id).product_class_code == Product(line.product_id).product_class_code
                      AND ol.pricing_status IN {DRAFT_PRICED, INVOICED, REPRICED}
                      AND ol.order_date >= Contract.effective_from
                      AND ol.order_date <  line.order_date          # strictly earlier lines only
                      AND ol.id != line.id
                    ordered by ol.order_date ASC, ol.created_at ASC   # deterministic replay order
      # (variant retroactive_tier replaces the `ol.order_date < line.order_date`
      #  clause with `ol.order_date < RebatePeriod.period_end` and drops `ol.id != line.id`)

      tier = the single ContractTier t WHERE
                t.contract_id == line.contract_id
                AND t.product_class_code == Product(line.product_id).product_class_code
                AND t.status == ACTIVE
                AND t.min_case_volume <= class_cases
                AND (t.max_case_volume IS NULL OR class_cases < t.max_case_volume)
      if no such tier: raise ERR_NO_TIER_FOR_PRODUCT_CLASS

      # Step 2 - cost basis snapshot
      cost = Product.last_cost_cents        if tier.cost_basis == LAST_COST
             Product.avg_cost_cents         if tier.cost_basis == AVG_COST
             Product.replacement_cost_cents if tier.cost_basis == REPLACEMENT_COST

      # Step 3 - cost-plus markup
      if tier.markup_type == PERCENT_OF_COST:
          list_unit_price_cents = round_half_up(cost * (100 + tier.markup_value) / 100)   # to 0 dp (whole cents)
      else:  # DOLLARS_PER_CASE
          list_unit_price_cents = cost + round_half_up(tier.markup_value)                 # markup_value is integral cents

      # Step 4 - deviated (off-invoice) override, then substitution price protection
      dev = the single DeviationAgreement d WHERE
                d.contract_id == line.contract_id AND d.product_id == line.product_id
                AND d.status == ACTIVE
                AND d.effective_from <= line.order_date < d.effective_to
      if dev exists:
          invoiced_unit_price_cents = dev.deviated_price_cents
          line.deviation_agreement_id = dev.id
      elif line.substitution_rule_id IS NOT NULL
           AND SubstitutionRule.price_protection_mode == HOLD_CONTRACT_PRICE:
          invoiced_unit_price_cents = the list_unit_price_cents that Step 3 produces for
                                      the ORIGINAL product (substituted_from_product_id)
                                      using the tier selected in Step 1
      else:
          invoiced_unit_price_cents = list_unit_price_cents

      extended_price_cents = invoiced_unit_price_cents * quantity_cases

      # Step 5 - contracted-item flag
      if line.substitution_rule_id IS NULL:
          is_contracted_item = tier.counts_as_contracted
      else:
          is_contracted_item = (SubstitutionRule.price_protection_mode == HOLD_CONTRACT_PRICE)
    input_set: >-
      Tier lookup counts only OrderLine rows of the same contract and product class
      whose pricing_status IN {DRAFT_PRICED, INVOICED, REPRICED}; CREDITED lines are
      excluded. Deviation lookup considers only status ACTIVE agreements whose
      half-open [effective_from, effective_to) window contains order_date.
    constants:
      ROUNDING: round_half_up
    precision: "All money is integer cents; every intermediate money value is rounded to whole cents with round_half_up immediately after the multiplication that produces it. Percentages carry 2 decimal places."
    variants:
      - name: prospective_tier
        when: "Line pricing at POST /nac/order-lines, /substitute and /reprice"
        difference: "class_cases counts only lines with order_date strictly earlier than this line, so an early line keeps the low-volume tier's higher markup for the whole period."
      - name: retroactive_tier
        when: "Audit repricing at POST /nac/pricing-disputes/{pricing_dispute_id}/start-audit"
        difference: "class_cases counts every line of the class in the period (order_date < RebatePeriod.period_end, including the disputed line itself), so the final period volume selects the tier and the same inputs produce a lower unit price than prospective_tier once the band boundary is crossed."

  - name: out_of_market_service_fee
    trigger: "POST /nac/order-lines, POST /nac/order-lines/{order_line_id}/substitute, POST /nac/order-lines/{order_line_id}/reprice"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED. The waiver threshold is tested against
      # extended_price_cents (the pre-fee line value) and NEVER against
      # invoice_total_cents, even though invoice_total_cents is what the operator
      # ultimately pays and what the threshold is nominally "about". Evaluating in
      # the other order is self-referential (the fee would decide whether the fee
      # applies) and is forbidden.
      coverage = the single DcCoverage c WHERE
                   c.contract_id == line.contract_id
                   AND c.distribution_center_id == line.distribution_center_id
                   AND c.status == ACTIVE
                   AND c.coverage_from <= line.order_date <= c.coverage_to   # closed interval
      if no such coverage: raise ERR_DC_NOT_COVERED

      # 1. extended_price_cents already fixed by contract_line_price
      # 2. waiver test on the PRE-FEE value
      if coverage.coverage_type == IN_MARKET
         OR coverage.service_fee_waived == true
         OR extended_price_cents >= FEE_WAIVER_EXTENDED_THRESHOLD_CENTS:
          service_fee_cents = 0
      else:
          service_fee_cents = DistributionCenter.out_of_market_fee_per_case_cents * quantity_cases
      # 3. only now is the total formed
      invoice_total_cents = extended_price_cents + service_fee_cents
    input_set: "Exactly one ACTIVE DcCoverage row whose closed [coverage_from, coverage_to] interval contains order_date."
    constants:
      FEE_WAIVER_EXTENDED_THRESHOLD_CENTS: 500000
    precision: "Integer cents; no rounding is performed because both operands are integers."

  - name: deviated_price_resolution
    trigger: "POST /nac/deviation-agreements, and HOP 2 of the PriceChangeNotice ACKNOWLEDGED -> EFFECTIVE cascade"
    algorithm: constraint_propagation
    formula: |
      if bill_back_basis == FIXED_NET_PRICE:
          deviated_price_cents = requested_net_price_cents          # pinned once, never re-derived
      else:  # COST_PLUS_PROTECTED
          basis_cost = the Product cost field named by the ContractTier.cost_basis of the
                       single ACTIVE ContractTier of this contract covering the product's
                       class at case volume 0 (the entry-band tier)
          deviated_price_cents = basis_cost - protected_discount_cents
      if deviated_price_cents <= 0: raise ERR_INVALID_REQUEST
      # ceiling test, evaluated AFTER resolution
      if deviated_price_cents > max_operator_price_cents:
          at create  -> raise ERR_DEVIATED_PRICE_ABOVE_CEILING
          at cascade -> DeviationAgreement ACTIVE -> PRICE_CEILING_BREACHED
    input_set: "The entry-band ACTIVE ContractTier (min_case_volume == 0) of the deviation's contract for the product's class."
    constants: {}
    precision: "Integer cents."

  - name: substitute_selection
    trigger: "POST /nac/order-lines/{order_line_id}/substitute"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter - candidate set as an explicit predicate
      candidates = SubstitutionRule r WHERE
          r.contract_id == line.contract_id
          AND r.primary_product_id == line.product_id
          AND r.status == ACTIVE
          AND Product(r.substitute_product_id).status == ACTIVE
          AND Product(r.substitute_product_id).stock_status == IN_STOCK
          AND Product(r.substitute_product_id).substitution_group_code
              == Product(r.primary_product_id).substitution_group_code
          AND delta_pct(r) <= r.max_price_delta_pct
      where
          primary_list  = contract_line_price Step 3 for r.primary_product_id
          sub_list      = contract_line_price Step 3 for r.substitute_product_id
                          (same tier lookup, same order_date)
          delta_pct(r)  = round_half_up(abs(sub_list - primary_list) * 100 / primary_list, 2)

      # (b) ranking expression
      order candidates by r.rank ASC
      # (c) tie-break when ranks tie
      then by r.created_at ASC          # never by id
      # (d) empty-set fallback
      if candidates is empty: raise ERR_NO_ELIGIBLE_SUBSTITUTE

      selected = first candidate after ordering
    input_set: "ACTIVE SubstitutionRule rows of this contract for this primary product whose substitute Product is ACTIVE and IN_STOCK and in the same substitution_group_code."
    constants: {}
    precision: "delta_pct carries 2 decimal places, round_half_up; the comparison against max_price_delta_pct is inclusive (<=)."

  - name: contracted_purchase_compliance_pct
    trigger: "POST /nac/rebate-periods/{rebate_period_id}/close, and GET /nac/contracts/{contract_id}/compliance-report"
    algorithm: aggregation
    formula: |
      qualifying = OrderLine ol WHERE
          ol.contract_id == period.contract_id
          AND ol.pricing_status IN {INVOICED, REPRICED}      # DRAFT_PRICED and CREDITED excluded
          AND period.period_start <= ol.order_date < period.period_end   # half-open
      contracted = qualifying WHERE ol.is_contracted_item == true

      gross_purchases_cents      = SUM(qualifying.extended_price_cents)
      contracted_purchases_cents = SUM(contracted.extended_price_cents)
      qualifying_cases           = SUM(qualifying.quantity_cases)
      contracted_cases           = SUM(contracted.quantity_cases)

      if Contract.compliance_basis == DOLLAR_WEIGHTED:
          denominator = gross_purchases_cents
          numerator   = contracted_purchases_cents
      else:  # CASE_WEIGHTED
          denominator = qualifying_cases
          numerator   = contracted_cases

      if denominator == 0:
          compliance_pct = 0.00                      # empty qualifying set
      else:
          compliance_pct = round_half_up(numerator * 100 / denominator, 2)
    input_set: >-
      Only OrderLine rows of the period's contract with pricing_status IN
      {INVOICED, REPRICED} and order_date inside the half-open
      [period_start, period_end) window. Service fees are never part of either the
      numerator or the denominator - only extended_price_cents.
    constants: {}
    precision: "2 decimal places, round_half_up. A zero denominator yields exactly 0.00, never an error and never null."
    variants:
      - name: dollar_weighted
        when: "Contract.compliance_basis == DOLLAR_WEIGHTED"
        difference: "Weighs each line by extended_price_cents, so expensive non-contracted substitutions depress the percentage more than cheap ones."
      - name: case_weighted
        when: "Contract.compliance_basis == CASE_WEIGHTED"
        difference: "Weighs each line by quantity_cases, so the same line set yields a different percentage whenever contracted and non-contracted lines differ in price per case."

  - name: rebate_accrual_split
    trigger: "POST /nac/rebate-periods/{rebate_period_id}/close"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - rate selection from compliance_pct (inclusive lower bounds)
      rebate_rate_pct = 4.00 if compliance_pct >= 95.00
                        3.00 if compliance_pct >= 90.00
                        1.50 if compliance_pct >= 80.00
                        0.00 otherwise

      # Step 2 - ROUNDING ORDER IS PINNED: round PER CONTRACTED LINE, THEN SUM.
      # Summing first and rounding once is a different (forbidden) answer.
      operator_rebate_cents = SUM over each line l in `contracted` (the set defined by
          contracted_purchase_compliance_pct), iterated in order l.order_date ASC then
          l.created_at ASC, of:
              round_half_up(l.extended_price_cents * rebate_rate_pct / 100)

      # Step 3 - funding split, rounded once on the already-rounded total
      manufacturer_funded_cents = round_half_up(operator_rebate_cents * MANUFACTURER_FUNDING_SHARE_PCT / 100)
      distributor_funded_cents  = operator_rebate_cents - manufacturer_funded_cents
    input_set: "The `contracted` line set of contracted_purchase_compliance_pct for this period; an empty set yields operator_rebate_cents == 0."
    constants:
      MANUFACTURER_FUNDING_SHARE_PCT: 60
      REBATE_RATE_TIERS: "[[95.00, 4.00], [90.00, 3.00], [80.00, 1.50], [0.00, 0.00]]"
    precision: "Whole cents, round_half_up, applied once per contracted line and once more to the funding split. Total ordering for the per-line sweep is order_date ASC then created_at ASC."

  - name: bill_back_claim_amount
    trigger: "POST /nac/bill-back-claims, and BillBackClaim SUBMITTED -> DISPUTED recomputation"
    algorithm: aggregation
    formula: |
      swept = OrderLine ol WHERE
          ol.deviation_agreement_id == claim.deviation_agreement_id
          AND ol.billback_status IN {ACCRUED, CLAIMED}
          AND ol.pricing_status IN {INVOICED, REPRICED, CREDITED}
          AND claim.claim_period_start <= ol.order_date < claim.claim_period_end   # half-open
      claimed_cases        = SUM(swept.quantity_cases)
      claimed_amount_cents = SUM over swept, in order_date ASC then created_at ASC, of
                               max(0, (ol.list_unit_price_cents - ol.invoiced_unit_price_cents))
                               * ol.quantity_cases
      if claimed_cases == 0: raise ERR_NO_QUALIFYING_LINES
    input_set: >-
      Lines carrying this deviation with billback_status IN {ACCRUED, CLAIMED} and
      order_date inside the half-open claim window. A CREDITED line stays in the
      sweep but its rewritten invoiced_unit_price_cents shrinks (or zeroes) its
      contribution, which is why a credit forces the claim back to DISPUTED.
    constants: {}
    precision: "Integer cents; the per-line delta is clamped at zero so a held contract price above list never produces a negative claim."

  - name: bill_back_remittance_waterfall
    trigger: "POST /nac/bill-back-remittances"
    algorithm: waterfall_allocation
    formula: |
      buckets = BillBackClaim k WHERE
          k.manufacturer_id == remittance.manufacturer_id
          AND k.status IN {SUBMITTED, PARTIALLY_RECOVERED}
      order buckets by k.claim_period_start ASC, then k.created_at ASC   # never by id
      remaining = remitted_amount_cents
      applied_claim_ids = []
      for k in buckets:
          slice = min(remaining, k.claimed_amount_cents - k.recovered_amount_cents)
          if slice > 0:
              k.recovered_amount_cents += slice
              append k.id to applied_claim_ids
              remaining -= slice
              k.status = RECOVERED if k.recovered_amount_cents == k.claimed_amount_cents
                         else PARTIALLY_RECOVERED
          if remaining == 0: break
      applied_amount_cents   = remitted_amount_cents - remaining
      unapplied_amount_cents = remaining
      Manufacturer.unapplied_credit_cents += unapplied_amount_cents
      Manufacturer.total_remitted_cents   += remitted_amount_cents
      # invariant, checked before and after this endpoint and after its reversal:
      # manufacturer_recovery_conservation:
      #   Manufacturer.total_remitted_cents
      #     == SUM(BillBackClaim.recovered_amount_cents for all claims of this manufacturer)
      #        + Manufacturer.unapplied_credit_cents
    input_set: "Claims of the remitting manufacturer with status IN {SUBMITTED, PARTIALLY_RECOVERED}; ACCRUED, DISPUTED, RECOVERED and WRITTEN_OFF claims are skipped."
    constants: {}
    precision: "Integer cents; no rounding. Overflow beyond the last open claim is parked on unapplied_credit_cents, never discarded."

  - name: market_index_cost_reset
    trigger: "POST /nac/price-change-notices, POST /nac/price-change-notices/{price_change_notice_id}/revise"
    algorithm: threshold
    formula: |
      current_cost = the Product cost field named by notice.cost_basis
      # Step 1 - resolve the new cost
      if Product.is_market_indexed:
          new_cost_cents = round_half_up(Product.index_baseline_cost_cents
                                         * published_index_value
                                         / Product.index_baseline_value)      # 0 dp
      else:
          new_cost_cents = proposed_cost_cents
      # Step 2 - signed delta against the CURRENT cost (not the baseline cost)
      delta_pct = round_half_up((new_cost_cents - current_cost) * 100 / current_cost, 2)
      # Step 3 - the notice window is a function of the delta just computed
      notice_required_days = Contract.notice_period_days if abs(delta_pct) >= MAJOR_CHANGE_PCT
                             else MINOR_NOTICE_DAYS
      # Step 4 - the window is only now anchored on submitted_at
      submitted_at          = logical clock
      earliest_effective_at = submitted_at + notice_required_days days
      if effective_at < earliest_effective_at: raise ERR_NOTICE_PERIOD_TOO_SHORT
    input_set: "The single Product named by product_id and the single Contract named by contract_id; no other rows participate."
    constants:
      MAJOR_CHANGE_PCT: 10.00
      MINOR_NOTICE_DAYS: 7
    precision: "new_cost_cents is whole cents, round_half_up; delta_pct carries 2 decimal places, round_half_up; the magnitude comparison against MAJOR_CHANGE_PCT is inclusive (>=)."

  - name: dispute_audit_repricing
    trigger: "POST /nac/pricing-disputes/{pricing_dispute_id}/start-audit"
    algorithm: chronological
    formula: |
      audited_correct_unit_price_cents =
          contract_line_price under the retroactive_tier variant, evaluated with
          cost = OrderLine.cost_basis_snapshot_cents (the cost frozen at line creation,
          NOT the product's cost today) and with the deviation/substitution overrides
          of Step 4 re-applied exactly as they stood on the line
      variance_cents_per_case = OrderLine.invoiced_unit_price_cents
                                - audited_correct_unit_price_cents
      variance_pct = round_half_up(abs(variance_cents_per_case) * 100
                                   / OrderLine.invoiced_unit_price_cents, 2)
      # resolution gate
      UPHELD is permitted only when variance_pct >= AUDIT_TOLERANCE_PCT
             AND variance_cents_per_case > 0 (the operator was overcharged)
      credit_amount_cents = variance_cents_per_case * OrderLine.quantity_cases
    input_set: "The single disputed OrderLine plus every line of the same contract and product class with order_date < RebatePeriod.period_end (for the retroactive volume roll-up)."
    constants:
      AUDIT_TOLERANCE_PCT: 0.50
    precision: "Whole cents for prices and credits; variance_pct carries 2 decimal places, round_half_up; the tolerance comparison is inclusive (>=)."

  - name: contract_compliance_posture
    trigger: "POST /nac/rebate-periods/{rebate_period_id}/close, /settle, /reverse-settlement; POST /nac/contracts/{contract_id}/sign and /reinstate; HOP 3-4 of the PriceChangeNotice activation cascade; HOP 3-4 of the dispute credit cascade"
    algorithm: threshold
    formula: |
      latest = the single RebatePeriod p WHERE
                 p.contract_id == contract.id AND p.status IN {CLOSED, SETTLED}
               ordered by p.period_start DESC, then p.created_at DESC, take 1
      if contract.deviation_breach_count >= DEVIATION_BREACH_POSTURE_LIMIT:
          compliance_posture = RESTRICTED
      elif latest IS NULL:
          compliance_posture = OPEN
      elif latest.compliance_pct < CONTRACT_MINIMUM_COMPLIANCE_PCT:
          compliance_posture = RESTRICTED
      elif latest.compliance_pct < contract.contracted_purchase_pct_target:
          compliance_posture = WATCH
      else:
          compliance_posture = OPEN
    input_set: "RebatePeriod rows of this contract with status IN {CLOSED, SETTLED}; OPEN periods (including periods reopened by an audit credit) are ignored."
    constants:
      CONTRACT_MINIMUM_COMPLIANCE_PCT: 80.00
      DEVIATION_BREACH_POSTURE_LIMIT: 1
    precision: "Percentages compared at 2 decimal places; both threshold comparisons are strict (<), so a period at exactly 80.00 is not RESTRICTED and a period at exactly the target is not WATCH."

  - name: manufacturer_recovery_conservation
    trigger: "Asserted after POST /nac/bill-back-remittances and after POST /nac/bill-back-remittances/{bill_back_remittance_id}/reverse"
    algorithm: aggregation
    formula: |
      # Conserved quantity: REMITTED CASH held by the system for one manufacturer.
      Manufacturer.total_remitted_cents
        == SUM(k.recovered_amount_cents for BillBackClaim k WHERE k.manufacturer_id == m.id)
           + Manufacturer.unapplied_credit_cents
      # The forward action (apply a remittance) and its compensating action
      # (reverse that remittance) must each leave this equality true, and the
      # reversal must restore every term to its pre-apply value:
      #   total_remitted_cents, every claim's recovered_amount_cents, and
      #   unapplied_credit_cents.
    input_set: "All BillBackClaim rows of the manufacturer regardless of status, plus the manufacturer's two cash counters."
    constants: {}
    precision: "Exact integer-cent equality; no tolerance."

  - name: rebate_liability_conservation
    trigger: "Asserted after POST /nac/rebate-periods/{rebate_period_id}/settle and after /reverse-settlement"
    algorithm: aggregation
    formula: |
      # Conserved quantity: REBATE LIABILITY recognised on one contract.
      Contract.rebate_payable_cents + Contract.rebate_settled_total_cents
        == SUM(p.operator_rebate_cents for RebatePeriod p
               WHERE p.contract_id == c.id AND p.status IN {CLOSED, SETTLED})
      # Settlement moves cents from rebate_payable_cents to
      # rebate_settled_total_cents; reverse-settlement moves them back. Neither
      # may change the sum, and the manufacturer-side mirror
      # Manufacturer.rebate_funding_payable_cents must return to its pre-settle
      # value after a reversal.
    input_set: "RebatePeriod rows of the contract with status IN {CLOSED, SETTLED}; OPEN periods contribute nothing because their operator_rebate_cents is null."
    constants: {}
    precision: "Exact integer-cent equality; no tolerance."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list; for entity_backed roles the X-User-ID must additionally own the target resource (OperatorBuyer: X-User-ID == Contract.operator_id; ManufacturerRep: X-User-ID == DeviationAgreement.manufacturer_id or BillBackClaim.manufacturer_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id referenced by the request resolves, checked path parameters first (left to right) and then body foreign keys in the order they are declared in the endpoint's input list"
    error_id: "ERR_OPERATOR_NOT_FOUND | ERR_MANUFACTURER_NOT_FOUND | ERR_DISTRIBUTION_CENTER_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_CONTRACT_TIER_NOT_FOUND | ERR_DC_COVERAGE_NOT_FOUND | ERR_DEVIATION_NOT_FOUND | ERR_SUBSTITUTION_RULE_NOT_FOUND | ERR_PRICE_CHANGE_NOTICE_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_BILL_BACK_CLAIM_NOT_FOUND | ERR_BILL_BACK_REMITTANCE_NOT_FOUND | ERR_REBATE_PERIOD_NOT_FOUND | ERR_PRICING_DISPUTE_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "request body parses and every field satisfies its declared type, enum membership and range constraint; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "the target resource is in a state the requested transition declares as a from-state"
    error_id: "ERR_CONTRACT_INVALID_STATE | ERR_DEVIATION_INVALID_STATE | ERR_NOTICE_INVALID_STATE | ERR_ORDER_LINE_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_REMITTANCE_INVALID_STATE | ERR_REBATE_PERIOD_INVALID_STATE | ERR_DISPUTE_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 6
    category: state
    check: "the governing Contract.status == ACTIVE, except on the three contract-construction endpoints POST /nac/contract-tiers, POST /nac/dc-coverages and POST /nac/substitution-rules where Contract.status IN {DRAFT, ACTIVE} is accepted so the first tier and the first coverage can be built before signature (submit-for-signature requires them to already exist); on those three endpoints any other status still raises this error"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /nac/deviation-agreements, POST /nac/deviation-agreements/{id}/submit, POST /nac/deviation-agreements/{id}/activate, POST /nac/contract-tiers, POST /nac/dc-coverages, POST /nac/substitution-rules, POST /nac/price-change-notices, POST /nac/price-change-notices/{id}/revise, POST /nac/price-change-notices/{id}/activate, POST /nac/order-lines, POST /nac/order-lines/{id}/substitute, POST /nac/order-lines/{id}/invoice, POST /nac/order-lines/{id}/reprice, POST /nac/rebate-periods"

  - priority: 7
    category: state
    check: "when the contract being signed carries amends_contract_id, the parent Contract.status == AMENDING"
    error_id: ERR_PARENT_CONTRACT_NOT_AMENDING
    http_status: 409
    applies_to: "POST /nac/contracts/{contract_id}/sign"

  - priority: 8
    category: state
    check: "expected_contract_version equals the referenced Contract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /nac/deviation-agreements"

  - priority: 9
    category: state
    check: "expected_deviation_agreement_version equals the referenced DeviationAgreement.version"
    error_id: ERR_STALE_DEVIATION_VERSION
    http_status: 412
    applies_to: "POST /nac/bill-back-claims"

  - priority: 10
    category: business_referential
    check: "DeviationAgreement.manufacturer_id equals Product.manufacturer_id of the deviated item"
    error_id: ERR_DEVIATION_MANUFACTURER_MISMATCH
    http_status: 422
    applies_to: "POST /nac/deviation-agreements"

  - priority: 11
    category: business_referential
    check: "the substitute Product and the primary Product share a non-null substitution_group_code and the same product_class_code, and primary_product_id != substitute_product_id"
    error_id: ERR_SUBSTITUTE_GROUP_MISMATCH
    http_status: 422
    applies_to: "POST /nac/substitution-rules"

  - priority: 12
    category: business_referential
    check: "the notice's product has a non-null cost value on the requested cost_basis, and the contract has an ACTIVE tier covering that product's class"
    error_id: ERR_NO_TIER_FOR_PRODUCT_CLASS
    http_status: 422
    applies_to: "POST /nac/price-change-notices, POST /nac/order-lines, POST /nac/order-lines/{id}/substitute, POST /nac/order-lines/{id}/reprice, POST /nac/deviation-agreements"

  - priority: 13
    category: business_safety
    check: "the activating NationalAccountManager's X-User-ID differs from DeviationAgreement.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 409
    applies_to: "POST /nac/deviation-agreements/{deviation_agreement_id}/activate"

  - priority: 14
    category: business_safety
    check: "the writing-off ContractAuditor's X-User-ID differs from BillBackClaim.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 409
    applies_to: "POST /nac/bill-back-claims/{bill_back_claim_id}/write-off"

  - priority: 15
    category: business_safety
    check: "Contract.compliance_posture != RESTRICTED"
    error_id: ERR_CONTRACT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /nac/deviation-agreements/{deviation_agreement_id}/activate, POST /nac/contracts/{contract_id}/amendments, POST /nac/rebate-periods/{rebate_period_id}/settle"

  - priority: 16
    category: business_safety
    check: "Manufacturer.status == ACTIVE"
    error_id: ERR_MANUFACTURER_SUSPENDED
    http_status: 409
    applies_to: "POST /nac/bill-back-claims/{bill_back_claim_id}/submit, POST /nac/deviation-agreements/{deviation_agreement_id}/manufacturer-decision"

  - priority: 17
    category: business_safety
    check: "the RebatePeriod covering the credited line is not SETTLED (a settled period may not be reopened by a credit)"
    error_id: ERR_SETTLED_PERIOD_IMMUTABLE
    http_status: 409
    applies_to: "POST /nac/pricing-disputes/{pricing_dispute_id}/issue-credit"

  - priority: 18
    category: business_temporal
    check: "the new deviation's half-open [effective_from, effective_to) window does not intersect the window of any other DeviationAgreement on the same (contract_id, product_id) with status NOT IN {REJECTED, EXPIRED, TERMINATED}; touching endpoints (previous.effective_to == new.effective_from) are allowed"
    error_id: ERR_DEVIATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /nac/deviation-agreements"

  - priority: 19
    category: business_temporal
    check: "for every ACTIVE DcCoverage on the same (contract_id, distribution_center_id), the two closed [coverage_from, coverage_to] intervals must be disjoint AND the gap between them, measured as later.coverage_from - earlier.coverage_to, must be strictly greater than DC_COVERAGE_BUFFER_DAYS (14) days; unlike the deviation window rule, abutting and merely-adjacent intervals are rejected because a DC needs a changeover buffer"
    error_id: ERR_DC_COVERAGE_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /nac/dc-coverages"

  - priority: 20
    category: business_temporal
    check: "no other PriceChangeNotice on the same product_id with status IN {PENDING, ACKNOWLEDGED} has an effective_at whose absolute distance from the new notice's effective_at is strictly less than NOTICE_WINDOW_DAYS (30) days; this is an aggregate count over the rolling window rather than a pairwise interval intersection"
    error_id: ERR_NOTICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /nac/price-change-notices"

  - priority: 21
    category: business_temporal
    check: "effective_at >= earliest_effective_at computed by market_index_cost_reset"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /nac/price-change-notices, POST /nac/price-change-notices/{price_change_notice_id}/revise"

  - priority: 22
    category: business_temporal
    check: "the logical clock is at or after PriceChangeNotice.effective_at"
    error_id: ERR_NOTICE_NOT_YET_EFFECTIVE
    http_status: 409
    applies_to: "POST /nac/price-change-notices/{price_change_notice_id}/activate"

  - priority: 23
    category: business_temporal
    check: "the logical clock (which becomes OrderLine.order_date) lies inside the inclusive [Contract.effective_from, Contract.effective_to] term"
    error_id: ERR_ORDER_DATE_OUTSIDE_CONTRACT_TERM
    http_status: 422
    applies_to: "POST /nac/order-lines"

  - priority: 24
    category: business_temporal
    check: "the new RebatePeriod's half-open [period_start, period_end) window does not intersect any existing RebatePeriod of the same contract"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /nac/rebate-periods"

  - priority: 25
    category: business_temporal
    check: "the new claim's half-open [claim_period_start, claim_period_end) window does not intersect any BillBackClaim on the same deviation with status NOT IN {WRITTEN_OFF}"
    error_id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /nac/bill-back-claims"

  - priority: 26
    category: business_temporal
    check: "the logical clock is at or after RebatePeriod.period_end"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /nac/rebate-periods/{rebate_period_id}/close"

  - priority: 27
    category: business_constraint
    check: "the new tier's half-open [min_case_volume, max_case_volume) band does not intersect any ACTIVE ContractTier on the same (contract_id, product_class_code)"
    error_id: ERR_TIER_BAND_OVERLAP
    http_status: 409
    applies_to: "POST /nac/contract-tiers"

  - priority: 28
    category: business_constraint
    check: "an indexed product's notice supplies published_index_value and no proposed_cost_cents; a non-indexed product's notice supplies proposed_cost_cents and no published_index_value"
    error_id: ERR_INDEX_VALUE_REQUIRED
    http_status: 422
    applies_to: "POST /nac/price-change-notices, POST /nac/price-change-notices/{price_change_notice_id}/revise"

  - priority: 29
    category: business_constraint
    check: "DeviationAgreement.revision_round < MAX_REVISION_ROUNDS (3)"
    error_id: ERR_MAX_REVISION_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /nac/deviation-agreements/{deviation_agreement_id}/submit"

  - priority: 30
    category: business_constraint
    check: "an ACTIVE DcCoverage row exists for (contract_id, distribution_center_id) whose closed interval contains the logical clock"
    error_id: ERR_DC_NOT_COVERED
    http_status: 409
    applies_to: "POST /nac/order-lines, POST /nac/order-lines/{order_line_id}/substitute"

  - priority: 31
    category: business_constraint
    check: "coverage_type OUT_OF_MARKET requires Contract.allow_out_of_market == true"
    error_id: ERR_OUT_OF_MARKET_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /nac/dc-coverages"

  - priority: 32
    category: business_constraint
    check: "exactly one RebatePeriod of the contract with status OPEN has a half-open window containing the logical clock"
    error_id: ERR_NO_OPEN_REBATE_PERIOD
    http_status: 409
    applies_to: "POST /nac/order-lines"

  - priority: 33
    category: business_constraint
    check: "the currently referenced Product.stock_status == OUT_OF_STOCK"
    error_id: ERR_PRODUCT_IN_STOCK
    http_status: 409
    applies_to: "POST /nac/order-lines/{order_line_id}/substitute"

  - priority: 34
    category: business_constraint
    check: "substitute_selection's candidate set is non-empty after the eligibility filter"
    error_id: ERR_NO_ELIGIBLE_SUBSTITUTE
    http_status: 409
    applies_to: "POST /nac/order-lines/{order_line_id}/substitute"

  - priority: 35
    category: business_constraint
    check: "bill_back_claim_amount sweeps at least one line (claimed_cases >= 1)"
    error_id: ERR_NO_QUALIFYING_LINES
    http_status: 422
    applies_to: "POST /nac/bill-back-claims"

  - priority: 36
    category: business_constraint
    check: "no PricingDispute with status IN {OPEN, UNDER_AUDIT} exists on a line assigned to this period"
    error_id: ERR_OPEN_DISPUTES_BLOCK_SETTLEMENT
    http_status: 409
    applies_to: "POST /nac/rebate-periods/{rebate_period_id}/settle"

  - priority: 37
    category: business_constraint
    check: "the RebatePeriod referenced by the disputed line has status IN {CLOSED, SETTLED} so the retroactive volume is final"
    error_id: ERR_REBATE_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /nac/pricing-disputes/{pricing_dispute_id}/start-audit"

  - priority: 38
    category: business_constraint
    check: "no PricingDispute with status IN {OPEN, UNDER_AUDIT, UPHELD} already exists for the order line"
    error_id: ERR_DISPUTE_ALREADY_EXISTS_FOR_LINE
    http_status: 409
    applies_to: "POST /nac/pricing-disputes"

  - priority: 39
    category: business_constraint
    check: "the disputed OrderLine.pricing_status IN {INVOICED, REPRICED}"
    error_id: ERR_ORDER_LINE_INVALID_STATE
    http_status: 409
    applies_to: "POST /nac/pricing-disputes"

  - priority: 40
    category: business_fiscal
    check: "the resolved deviated_price_cents <= max_operator_price_cents"
    error_id: ERR_DEVIATED_PRICE_ABOVE_CEILING
    http_status: 422
    applies_to: "POST /nac/deviation-agreements, POST /nac/deviation-agreements/{deviation_agreement_id}/activate"

  - priority: 41
    category: business_fiscal
    check: "resolution UPHELD requires variance_pct >= AUDIT_TOLERANCE_PCT (0.50) and variance_cents_per_case > 0"
    error_id: ERR_VARIANCE_BELOW_AUDIT_TOLERANCE
    http_status: 422
    applies_to: "POST /nac/pricing-disputes/{pricing_dispute_id}/resolve"

  - priority: 42
    category: business_fiscal
    check: "Contract.rebate_payable_cents == 0 before a contract may be terminated"
    error_id: ERR_REBATE_PAYABLE_OUTSTANDING
    http_status: 409
    applies_to: "POST /nac/contracts/{contract_id}/terminate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- reference data -------------------------------------------------------
  - method: POST
