            - "the acknowledgement response carries version 3 with disclosure_state \"ACKNOWLEDGED\"; the GET that follows still reports version 3"
            - "the cancel response carries version 4 with booking_status \"CANCELLED\""
            - "no revenue entry was created by any of these writes: GET /bookings/${bk_id}/revenue-entries returns total_count == 0"

