scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: applicant_creation_returns_defaults
        claim_type: Creation
        grounds:
          - entities.Applicant.fields.residency_status
          - entities.Applicant.fields.preference_points
        distinguishing_aspect: "POST /applicants with required fields -> 201; residency_status UNVERIFIED, preference_points 0, education_certified false, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Jo", birth_date: "1990-05-05", declared_state_code: "MT" }
              as: Applicant
              as_user_id: "self"
              captures: { a_id: $.data.id }
          assert:
            - "response status == 201"
            - "Applicant.${a_id}.residency_status == UNVERIFIED"
            - "Applicant.${a_id}.preference_points == 0"
            - "Applicant.${a_id}.education_certified == false"
            - "Applicant.${a_id}.version == 1"

      - name: applicant_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Applicant
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /applicants/{random-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /applicants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: applicant_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Applicant.fields.full_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applicants missing full_name -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { birth_date: "1990-05-05", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: applicant_bonus_points_default_zero
        claim_type: Defaults
        grounds:
          - entities.Applicant.fields.bonus_points
        distinguishing_aspect: "POST /applicants omitting bonus_points -> stored bonus_points 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Jo", birth_date: "1990-05-05", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
          assert:
            - "Applicant.${a_id}.bonus_points == 0"

      - name: applicant_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Applicant
        distinguishing_aspect: "id/created_at/updated_at/version server-minted; client-supplied id is ignored (not present in input schema)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Jo", birth_date: "1990-05-05", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
          assert:
            - "Applicant.${a_id}.id is a UUID with no type prefix"
            - "Applicant.${a_id}.created_at is ISO 8601 UTC with 3 fractional digits"

      - name: license_product_duplicate_sku_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LicenseProduct.fields.sku
          - errors[ERR_DUPLICATE_SKU]
        distinguishing_aspect: "Two ACTIVE products with the same sku -> second create returns ERR_DUPLICATE_SKU 409."
        test_recipe:
          setup: ["One ACTIVE STAMP product with sku STAMP-DUP."]
          setup_api_calls:
            - call: "POST /license-products"
              payload: { sku: "STAMP-DUP", product_kind: "STAMP", base_fee_cents: 4500, residency_restriction: "ANY" }
              as: DrawOfficer
          trigger:
            - call: "POST /license-products"
              payload: { sku: "STAMP-DUP", product_kind: "STAMP", base_fee_cents: 5000, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_DUPLICATE_SKU"

      - name: license_product_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LicenseProduct.fields.product_kind
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /license-products with product_kind 'PERMIT' (not in enum) -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /license-products"
              payload: { sku: "X-1", product_kind: "PERMIT", base_fee_cents: 4500, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: applicant_residency_computed_field_correct
        claim_type: Computed Fields
        grounds:
          - entities.Applicant.fields.residency_status
          - entities.ResidencyVerification.fields.resulting_residency
        distinguishing_aspect: "Approving a residency verification with proof_state == declared_state and continuous_months >= RESIDENCY_MIN_MONTHS sets Applicant.residency_status RESIDENT."
        test_recipe:
          setup: ["Applicant declared MT, with a PENDING residency verification (proof MT, 24 months)."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
          trigger:
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
              captures: { res: $.data.resulting_residency }
          assert:
            - "ResidencyVerification.${rv_id}.resulting_residency == RESIDENT"
            - "Applicant.${a_id}.residency_status == RESIDENT"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: residency_verification_initial_state_pending
        claim_type: Initial State
        grounds:
          - state_machines.ResidencyVerification
          - entities.ResidencyVerification.fields.status
        distinguishing_aspect: "POST /residency-verifications -> status PENDING on creation."
        test_recipe:
          setup: ["One applicant exists."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
          assert:
            - "ResidencyVerification.${rv_id}.status == PENDING"

      - name: residency_verification_double_approve_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.ResidencyVerification.PENDING_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an already-APPROVED residency verification a second time -> ERR_INVALID_STATE 409; no further Applicant mutation."
        test_recipe:
          setup: ["An APPROVED residency verification."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: season_open_from_closed_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SpeciesSeason.DRAFT_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Opening a CLOSED season -> ERR_INVALID_STATE 409 (open is only defined from DRAFT)."
        test_recipe:
          setup: ["A season that has been opened then closed (status CLOSED)."]
          setup_api_calls:
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1 }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /species-seasons/${seas_id}/close"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: education_certificate_verify_sets_applicant_flag
        claim_type: Side Effect Execution
        grounds:
          - state_machines.EducationCertificate.PENDING_to_VERIFIED
          - entities.Applicant.fields.education_certified
        distinguishing_aspect: "Verifying a PENDING education certificate sets Applicant.education_certified true and bumps Applicant.version."
        test_recipe:
          setup: ["An applicant with a PENDING education certificate; education_certified false initially."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Edu", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
            - call: "POST /education-certificates"
              payload: { applicant_id: "${a_id}", course_code: "HE-101", completion_date: "2025-06-01" }
              as: DrawOfficer
              captures: { ec_id: $.data.id }
          trigger:
            - call: "POST /education-certificates/${ec_id}/verify"
              payload: {}
              as: DrawOfficer
          assert:
            - "EducationCertificate.${ec_id}.status == VERIFIED"
            - "Applicant.${a_id}.education_certified == true"

      - name: education_certificate_reject_leaves_flag_false
        claim_type: Side Effect Execution
        grounds:
          - state_machines.EducationCertificate.PENDING_to_REJECTED
          - entities.Applicant.fields.education_certified
        distinguishing_aspect: "Rejecting an education certificate leaves Applicant.education_certified false (no cross-entity write)."
        test_recipe:
          setup: ["An applicant with a PENDING education certificate."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Edu", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
            - call: "POST /education-certificates"
              payload: { applicant_id: "${a_id}", course_code: "HE-101", completion_date: "2025-06-01" }
              as: DrawOfficer
              captures: { ec_id: $.data.id }
          trigger:
            - call: "POST /education-certificates/${ec_id}/reject"
              payload: {}
              as: DrawOfficer
          assert:
            - "EducationCertificate.${ec_id}.status == REJECTED"
            - "Applicant.${a_id}.education_certified == false"

      - name: terminal_drawn_pool_close_entries_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DrawPool
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "close-entries on a DRAWN pool (terminal) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A DRAWN pool: ELK season OPEN, draw_required true; pool quota 1 with one entrant, closed and drawn."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-10T00:00:00Z" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A1", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a1_id}" }
              as: DrawOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pool_v: $.data.version }
            - call: "POST /draw-pools/${pool_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pool_v}" }
              as: DrawOfficer
          trigger:
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: close_entries_before_deadline_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DrawPool.ACCEPTING_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "close-entries while clock is strictly before entry_deadline -> ERR_INVALID_STATE 409 (deadline precondition unmet)."
        test_recipe:
          setup: ["ACCEPTING pool with entry_deadline 2026-05-10; clock at 2026-05-01 (before deadline)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-05-10T00:00:00Z" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: withdraw_after_entries_closed_invalid_state
        claim_type: guarded transitions
        grounds:
          - state_machines.DrawApplication.SUBMITTED_to_WITHDRAWN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Withdrawing a SUBMITTED application after its pool moved to CLOSED -> ERR_INVALID_STATE 409 (cross-entity guard: pool no longer ACCEPTING)."
        test_recipe:
          setup: ["A SUBMITTED application in a CLOSED pool."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-05-10T00:00:00Z" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A1", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a1_id}" }
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { da_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
          trigger:
            - call: "POST /draw-applications/${da_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: harvest_report_reject_releases_budget
        claim_type: Compensation
        grounds:
          - state_machines.HarvestReport.SUBMITTED_to_REJECTED
          - calculations.season_bag_budget_remaining
        distinguishing_aspect: "Rejecting a SUBMITTED report releases its quantity: bag-budget counted drops from 1 to 0, remaining returns to bag_limit."
        test_recipe:
          setup: ["Resident A_res holds ISSUED TAG L; one SUBMITTED report quantity 1; bag_limit 2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 2, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_id: $.data.id }
            - call: "POST /harvest-reports"
              payload: { license_id: "${l_id}", harvest_datetime: "2026-09-15T08:00:00Z", quantity: 1 }
              as: Applicant
              as_user_id: "${a_res_id}"
              captures: { hr_id: $.data.id }
          trigger:
            - call: "POST /harvest-reports/${hr_id}/reject"
              payload: {}
              as: GameWarden
          assert:
            - "HarvestReport.${hr_id}.status == REJECTED"
            - "GET /licenses/${l_id}/bag-budget -> counted == 0"
            - "GET /licenses/${l_id}/bag-budget -> remaining == 2"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: replacement_fee_stolen_waived_to_zero
        claim_type: Constants Applied
        grounds:
          - calculations.replacement_admin_fee
          - entities.Replacement.fields.reason
        distinguishing_aspect: "Replacement of a TAG with reason STOLEN -> admin_fee_cents 0 (STOLEN short-circuits base to 0, overriding the TAG surcharge)."
        test_recipe:
          setup: ["Resident A_res holds ISSUED TAG L (OTC) in an OPEN draw_required-false season."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: false }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK-OTC", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_res_id: $.data.id }
            - call: "POST /residency-verifications"
              payload: { applicant_id: "${a_res_id}", proof_type: "DRIVERS_LICENSE", proof_state_code: "MT", continuous_months: 24 }
              as: DrawOfficer
              captures: { rv_id: $.data.id }
            - call: "POST /residency-verifications/${rv_id}/approve"
              payload: {}
              as: DrawOfficer
            - call: "POST /licenses"
              payload: { applicant_id: "${a_res_id}", license_product_id: "${p_tag_id}" }
              as: LicenseAgent
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /replacements"
              payload: { original_license_id: "${l_id}", reason: "STOLEN" }
              as: LicenseAgent
              captures: { repl_id: $.data.id }
