              payload: { expected_plan_version: "${p_v_now}" }
              as: TeamLead
              captures: { err: $.data.error_id }
          assert:
            - "StudentPlan.status == 'EXIT_MOVED' (cascaded by the ratify)"
            - "Pause attempt on EXIT_MOVED plan returns error_id == 'ERR_INVALID_STATE'"
            - "Cross-entity pair is (StudentPlan → Student): the plan's valid transitions are conditioned on the student's tier state"

      - name: sped_referral_requires_plan_active_and_tier3
        grounds:
          - state_machines.SpedReferral.transitions
          - validations[priority=10]
        distinguishing_aspect: |
          SpedReferral creation precondition references BOTH Student.current_tier AND
          Student.weeks_at_tier3_unresponsive AND absence of open referrals (entity pair
          SpedReferral→Student, different from Plan→Student). A student at TIER_2 with
          sufficient weeks-at-TIER-3 counter is rejected.
        test_recipe:
          setup:
            - "Student C at TIER_2 (NOT TIER_3) but weeks_at_tier3_unresponsive somehow == 5 (legacy from a prior Tier3 plan that exited EXIT_MOVED — counter not reset because to_tier != TIER_1)"
            - "No open SpedReferral exists"
          setup_api_calls:
            # Build via: get to TIER_3, run 5 non-responsive probes (weeks=5), then
            # ratify movement TIER_3 → TIER_1? No — that resets counter. Use TIER_3 → TIER_2.
            # But TIER_3 → TIER_2 requires latest slope_decision == RESPONSIVE per eligibility.
            # Alternative: weeks_at_tier3_unresponsive is only incremented while at TIER_3.
            # So scenario: student reaches TIER_3 with 5 unresponsive weeks (NO referral auto-created
            # because min_weeks is set high, say 99), then movement to TIER_1 resets counter — bad.
            # Try: sped_referral_min_weeks=99 (never auto-trigger), student reaches weeks=5,
            # then we need student at TIER_2 — but tier3→tier2 requires RESPONSIVE slope.
            # So counter reset scenario isn't reachable cleanly. Instead, assert the TIER_2 branch:
            # a student at TIER_2 with weeks=0 (never was TIER_3) hits the precondition failure
            # because current_tier != TIER_3, regardless of counter.
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026", sped_referral_min_weeks: 4 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "C", grade_level: 3 }
              as: SchoolRegistrar
              captures: { c_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${c_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${c_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${c_id}"
              payload: {}
              as: TeamLead
              captures: { c_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${c_v}" }
              as: TeamLead
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${c_id}/sped-referrals"
              payload: {}
              as: SpEdDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_SPED_REFERRAL_PRECONDITION'"
            - "Student.current_tier == 'TIER_2' (not TIER_3) — precondition violated regardless of counter"
            - "Cross-entity pair is (SpedReferral → Student), distinct from (StudentPlan → Student)"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: screening_window_adjacent_boundaries
        grounds:
          - state_machines.ScreeningWindow.transitions
          - validations[priority=6]
        distinguishing_aspect: |
          Interval semantics — CLOSED date interval [opens_on, closes_on] (inclusive on BOTH
          ends) on ScreeningWindow. A score POSTed with clock exactly at closes_on is ACCEPTED;
          one second past closes_on (window auto-CLOSED) is REJECTED. Adjacent windows
          (W1 closes_on 2026-08-31, W2 opens_on 2026-09-01) do NOT overlap; semantics differ
          from session-level minute arithmetic.
        test_recipe:
          setup:
            - "Window W1 with opens_on=2026-08-01, closes_on=2026-08-31"
            - "Student D1 enrolled; cut point defined"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "D1", grade_level: 3 }
              as: SchoolRegistrar
              captures: { st_id: $.data.id }
          trigger:
            # Clock exactly at end of closes_on day → window still OPEN, score accepted
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${st_id}", subject: "READING", raw_score: 80 }
              as: Teacher
              captures: { accepted_id: $.data.id }
            # Move clock to next day; auto-close fires on next read or system tick — to be
            # deterministic, manually close and then attempt another score (different subject).
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${st_id}", subject: "MATH", raw_score: 75 }
              as: Teacher
              captures: { rejected_err: $.data.error_id }
          assert:
            - "Score at exactly closes_on (2026-08-31T23:59:59Z) was ACCEPTED — boundary is inclusive on the right edge"
            - "After close, second score POST → error_id == 'ERR_INVALID_STATE' (or 'ERR_WINDOW_NOT_OPEN' depending on priority replay)"
            - "Interval semantics here are closed-date boundaries — different from the interventionist capacity arithmetic"

      - name: interventionist_minutes_budget_overlap
        grounds:
          - calculations.interventionist_capacity_check
          - validations[priority=11]
        distinguishing_aspect: |
          Resource-interval semantics on a different resource (Interventionist) with
          different arithmetic: aggregate capacity (sum of weekly minute demands) rather than
          interval overlap. Two plans whose combined weekly_minute_cost exceeds capacity are
          rejected; the rule is additive-minutes, NOT date-range overlap.
        test_recipe:
          setup:
            - "Interventionist I with weekly_minute_capacity=120"
            - "Two students E1, E2 each at TIER_2 with same catalog (session=30, freq=3 → 90 weekly minutes)"
            - "E1 already has an ACTIVE plan consuming 90 minutes"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "E1", grade_level: 3 }
              as: SchoolRegistrar
              captures: { e1_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "E2", grade_level: 3 }
              as: SchoolRegistrar
              captures: { e2_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${e1_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${e2_id}", subject: "READING", raw_score: 82 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            # Ratify both movements
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${e1_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv1: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${e1_id}"
              payload: {}
              as: TeamLead
              captures: { e1_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv1}", expected_student_version: "${e1_v}" }
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${e2_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv2: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${e2_id}"
              payload: {}
              as: TeamLead
              captures: { e2_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv2}", expected_student_version: "${e2_v}" }
              as: TeamLead
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "X", subject: "READING", tier_target: "TIER_2", grade_min: 3, grade_max: 5, session_minutes: 30, sessions_per_week: 3, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 120, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            # E1's plan: succeeds (90 <= 120)
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${e1_id}"
              payload: {}
              as: TeamLead
              captures: { e1_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${e1_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${e1_v2}" }
              as: TeamLead
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${e2_id}"
              payload: {}
              as: TeamLead
              captures: { e2_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${e2_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${e2_v2}" }
              as: TeamLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_CAPACITY_EXCEEDED' (90 committed + 90 proposed = 180 > capacity 120)"
            - "Interval semantics are additive-minutes-over-capacity, not date-range overlap; distinct from window boundary arithmetic"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: interventionist_minutes_conservation
        grounds:
          - calculations.interventionist_capacity_check
          - state_machines.StudentPlan.transitions
        distinguishing_aspect: |
          Conserved quantity: Interventionist.committed_minutes_per_week.
          Invariant: after plan-create (forward) and plan-cancel (compensating), the
          committed minutes MUST return to the pre-create baseline; no drift.
        test_recipe:
          setup:
            - "Interventionist I capacity=600, initial committed=0"
            - "Student F at TIER_2, plan created (forward action: +90)"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "F", grade_level: 3 }
              as: SchoolRegistrar
              captures: { f_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${f_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${f_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${f_id}"
              payload: {}
              as: TeamLead
              captures: { f_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${f_v}" }
              as: TeamLead
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "X", subject: "READING", tier_target: "TIER_2", grade_min: 3, grade_max: 5, session_minutes: 30, sessions_per_week: 3, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 600, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/interventionists/${i_id}"
              payload: {}
              as: TeamLead
              captures: { committed_0: $.data.committed_minutes_per_week }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${f_id}"
              payload: {}
              as: TeamLead
              captures: { f_v2: $.data.version }
          trigger:
            # Forward: plan create (committed +90)
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${f_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${f_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "GET /districts/${d_id}/schools/${s_id}/interventionists/${i_id}"
              payload: {}
              as: TeamLead
              captures: { committed_1: $.data.committed_minutes_per_week }
            # Compensating: plan cancel (no probes yet, so CANCEL is legal)
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${f_id}/plans/${p_id}/cancel"
              payload: { expected_plan_version: "${p_v0}" }
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/interventionists/${i_id}"
              payload: {}
              as: TeamLead
              captures: { committed_2: $.data.committed_minutes_per_week }
          assert:
            - "Interventionist.committed_minutes_per_week before plan create == 0"
            - "After plan create == 90 (forward action debits)"
            - "After plan cancel == 0 (compensating action credits exactly the same amount)"
            - "Conserved quantity is committed-minutes; forward+cancel leaves it unchanged"

      - name: student_tier_conservation_via_supersede
        grounds:
          - state_machines.TierMovement.transitions
          - entities.Student.fields.current_tier
        distinguishing_aspect: |
          Conserved quantity: count of PROPOSED TierMovements per student.
          Invariant: propose (forward: +1 PROPOSED) paired with another propose
          (compensating via SUPERSEDED: -1 PROPOSED from old, +1 from new) leaves the
          total PROPOSED count unchanged at 1. Different conserved quantity from minutes.
        test_recipe:
          setup:
            - "Student G at TIER_2 (via screening + ratified movement)"
            - "WINTER window SCORED showing TIER_3 band (so proposal is legal)"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "WINTER", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { wf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "G", grade_level: 3 }
              as: SchoolRegistrar
              captures: { g_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${wf_id}/scores"
              payload: { student_id: "${g_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${wf_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${wf_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${g_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${g_id}"
              payload: {}
              as: TeamLead
              captures: { g_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${g_v}" }
              as: TeamLead
            # WINTER screen showing TIER_3 band
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "WINTER", opens_on: "2026-12-01", closes_on: "2026-12-15" }
              as: DistrictCoordinator
              captures: { ww_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${ww_id}/scores"
              payload: { student_id: "${g_id}", subject: "READING", raw_score: 60 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${ww_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${ww_id}/score"
              payload: {}
              as: DistrictCoordinator
          trigger:
            # Forward: propose movement #1 → PROPOSED count goes 0 → 1
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${g_id}"
              payload: {}
              as: TeamLead
              captures: { g_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${g_id}/tier-movements"
              payload: { to_tier: "TIER_3", rationale: "1st", expected_student_version: "${g_v2}" }
              as: TeamLead
              captures: { mv1_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${g_id}/tier-movements"
              payload: { status: "PROPOSED" }
              as: TeamLead
              captures: {}
            # Compensating: propose movement #2 → mv1 SUPERSEDED, mv2 PROPOSED. Count still 1.
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${g_id}"
              payload: {}
              as: TeamLead
              captures: { g_v3: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${g_id}/tier-movements"
              payload: { to_tier: "TIER_3", rationale: "2nd", expected_student_version: "${g_v3}" }
              as: TeamLead
              captures: { mv2_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${g_id}/tier-movements/${mv1_id}"
