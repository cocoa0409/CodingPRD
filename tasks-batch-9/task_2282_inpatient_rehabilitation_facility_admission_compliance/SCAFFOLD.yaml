# =============================================================================
# task_2282 — Inpatient Rehabilitation Facility Admission & Compliance Threshold
# Seed tables §1.0–§1.7 (single source of truth for PRD / tests / implementation)
# =============================================================================

scenario: |
  2282. Inpatient Rehabilitation Facility Admission & Compliance Threshold (inpatient rehabilitation facility): pre-admission screening within the required window with physician review, documentation of intensive therapy need and expected functional improvement, compliance percentage tracking of qualifying conditions across the cohort, three-hour therapy rule scheduling and documentation of therapy minutes, individualized overall plan of care and weekly team conference records, patient assessment instrument completion and transmission deadlines, interrupted stay rules and payment consolidation, discharge destination outcomes and quality reporting program penalties

domain_name: irf-admission-compliance
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - version_pinning_on_approval

  entity_topology: flat
  # Every resource is addressed at the top level (`/admissions/{id}`,
  # `/therapy-sessions/{id}`); parentage is expressed only through FK fields, and
  # two of those FKs are self-referential (Admission.predecessor_admission_id,
  # Admission.payment_consolidated_into_admission_id) forming interrupted-stay chains.

  state_machine_shape: parallel
  # PreadmissionScreening is cyclic (DRAFT→SUBMITTED→CHANGES_REQUESTED→DRAFT and
  # SUBMITTED→ON_HOLD→SUBMITTED), Admission carries three independent dimensions
  # (stay_status × payment_status × documentation_status), TherapyWeek is cyclic
  # (MET↔NOT_MET on re-evaluation), ComplianceReview is cyclic (COMPUTED↔STALE),
  # PatientAssessmentInstrument branches (TRANSMITTED | LATE_TRANSMITTED | MISSED).

  relationship_patterns:
    - one_to_many
    - self_referential      # Admission.predecessor_admission_id -> Admission.id
    - cross_aggregate       # TherapyWeek/TeamConference/PAI reach Facility through Admission
    - polymorphic: false

  role_model: segregation_of_duties
  # The clinician who conducted a preadmission screening may not be the clinician
  # who concurs with it; the coder who completed a patient assessment instrument
  # may not be the coder who transmits it; the compliance officer who opened a
  # compliance review may not be the officer who certifies it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility legal name", constraints: "1–120 chars" }
      - { name: cms_ccn, type: string, source: input, description: "CMS certification number; unique across facilities", constraints: "exactly 6 digits" }
      - { name: review_period_start, type: string, source: input, description: "Inclusive first calendar date (YYYY-MM-DD) of the compliance review period used by provisional tracking" }
      - { name: review_period_end, type: string, source: input, description: "Inclusive last calendar date (YYYY-MM-DD) of the compliance review period", constraints: "must be >= review_period_start" }
      - { name: compliance_threshold_pct, type: number, source: input, description: "Percentage of the discharged cohort that must qualify for the facility to pass compliance review", default: 60.00, constraints: "0.01–100.00, 2 decimals" }
      - { name: daily_therapy_cap_minutes, type: integer, source: input, description: "Maximum credited therapy minutes one admission may accumulate on a single calendar date", default: 300, constraints: "60–600" }
      - { name: cohort_total_count, type: integer, source: computed, description: "Count of Admissions in the provisional cohort (see calculations.provisional_compliance_tracking)" }
      - { name: cohort_qualifying_count, type: integer, source: computed, description: "Count of provisional-cohort Admissions whose compliance_class == QUALIFYING" }
      - { name: provisional_compliance_pct, type: number, source: computed, description: "MEDICAL_REVIEW-variant compliance percentage over the provisional cohort, 2 decimals; 0.00 when cohort_total_count == 0" }
      - { name: certified_compliance_pct, type: number, source: computed, description: "compliance_pct of the most recently CERTIFIED ComplianceReview; null when none exists or when that review was invalidated to STALE" }
      - { name: settled_payment_cents, type: integer, source: computed, description: "Sum of total_payment_cents over this facility's Admissions whose payment_status == PRICED; reopened, consolidated and unpriced stays contribute 0", default: 0 }
      - { name: posture, type: enum, source: computed, description: "OPEN | THRESHOLD_WATCH | ADMISSION_FREEZE — gates POST /admissions/{admissionId}/admit and cascades to SUBMITTED screenings", constraints: "OPEN | THRESHOLD_WATCH | ADMISSION_FREEZE" }
      - { name: active_qrp_penalty_pct, type: number, source: computed, description: "Quality Reporting Program payment reduction currently in force, set by QrpAssessment finalization", default: 0.00 }
      - { name: qrp_penalty_effective_at, type: datetime, source: computed, description: "Logical-clock instant at which active_qrp_penalty_pct took effect; null before the first finalization" }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; employing facility" }
      - { name: full_name, type: string, source: input, description: "Clinician display name" }
      - { name: credential, type: enum, source: input, description: "REHAB_PHYSICIAN | NURSE | THERAPIST_PT | THERAPIST_OT | THERAPIST_SLP | CODER", constraints: "REHAB_PHYSICIAN | NURSE | THERAPIST_PT | THERAPIST_OT | THERAPIST_SLP | CODER" }
      - { name: npi, type: string, source: input, description: "National provider identifier; unique across clinicians", constraints: "exactly 10 digits" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; INACTIVE after POST /clinicians/{clinicianId}/deactivate", constraints: "ACTIVE | INACTIVE" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility that owns the medical record" }
      - { name: mrn, type: string, source: input, description: "Medical record number; unique per facility_id" }
      - { name: full_name, type: string, source: input, description: "Patient display name" }
      - { name: birth_date, type: string, source: input, description: "Date of birth (YYYY-MM-DD)" }
      - { name: impairment_group_code, type: string, source: input, description: "IRF-PAI impairment group code driving presumptive compliance and CMG tier", constraints: "4 digits" }
      - { name: etiologic_diagnosis_code, type: string, source: input, description: "ICD-10 etiologic diagnosis code used by the presumptive-compliance secondary test" }
      - { name: comorbidity_tier, type: enum, source: input, description: "NONE | TIER_3 | TIER_2 | TIER_1 — payment uplift tier and presumptive secondary test input", constraints: "NONE | TIER_3 | TIER_2 | TIER_1" }

  - name: PreadmissionScreening
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; screened patient" }
      - { name: conducted_by_clinician_id, type: string, source: input, description: "FK -> Clinician.id; screener, credential must be NURSE or REHAB_PHYSICIAN" }
      - { name: reviewed_by_clinician_id, type: string, source: computed, description: "FK -> Clinician.id; rehab physician who reviewed; null until a review decision is recorded" }
      - { name: conducted_at, type: datetime, source: system, description: "Logical-clock instant at which the screening record was created; anchors the 48-hour preadmission window" }
      - { name: expected_admission_at, type: datetime, source: input, description: "Planned admission instant declared by the screener" }
      - { name: intensive_therapy_documented, type: boolean, source: input, description: "Whether the need for intensive multi-discipline therapy is documented" }
      - { name: expected_functional_improvement_documented, type: boolean, source: input, description: "Whether measurable expected functional improvement is documented" }
      - { name: prior_functional_level_documented, type: boolean, source: input, description: "Whether prior level of function is documented" }
      - { name: medical_supervision_documented, type: boolean, source: input, description: "Whether the need for close physician supervision is documented" }
      - { name: reviewed_at, type: datetime, source: computed, description: "Logical-clock instant of the physician review decision; null until reviewed" }
      - { name: reviewer_note, type: string, source: input, description: "Free-text note captured with the review decision; null when omitted" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times the screening returned to DRAFT from CHANGES_REQUESTED", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | PHYSICIAN_CONCURRED | ON_HOLD | EXPIRED", constraints: "DRAFT | SUBMITTED | CHANGES_REQUESTED | PHYSICIAN_CONCURRED | ON_HOLD | EXPIRED" }

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: computed, description: "FK -> Facility.id; copied from Patient.facility_id at creation and never changed" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; admitted patient" }
      - { name: screening_id, type: string, source: input, description: "FK -> PreadmissionScreening.id; screening that authorizes this admission" }
      - { name: predecessor_admission_id, type: string, source: input, description: "FK -> Admission.id; prior stay this admission continues under the interrupted-stay rule; null for a fresh stay" }
      - { name: payment_consolidated_into_admission_id, type: string, source: computed, description: "FK -> Admission.id; chain head that carries the single consolidated payment; null unless this admission is a continuation" }
      - { name: stay_status, type: enum, source: system, description: "PENDING | ADMITTED | DISCHARGED | ADMISSION_DENIED", constraints: "PENDING | ADMITTED | DISCHARGED | ADMISSION_DENIED" }
      - { name: payment_status, type: enum, source: system, description: "NOT_PRICED | PRICED | CONSOLIDATED | REOPENED", constraints: "NOT_PRICED | PRICED | CONSOLIDATED | REOPENED" }
      - { name: documentation_status, type: enum, source: system, description: "INCOMPLETE | POC_SIGNED | PAI_TRANSMITTED", constraints: "INCOMPLETE | POC_SIGNED | PAI_TRANSMITTED" }
      - { name: admitted_at, type: datetime, source: input, description: "Admission instant recorded by POST /admissions/{admissionId}/admit; null while PENDING" }
      - { name: discharged_at, type: datetime, source: input, description: "Discharge instant recorded by POST /admissions/{admissionId}/discharge; null until discharged" }
      - { name: discharge_destination, type: enum, source: input, description: "COMMUNITY | SNF | ACUTE_CARE | LTCH | ANOTHER_IRF | EXPIRED | AGAINST_MEDICAL_ADVICE; null until discharged", constraints: "COMMUNITY | SNF | ACUTE_CARE | LTCH | ANOTHER_IRF | EXPIRED | AGAINST_MEDICAL_ADVICE" }
      - { name: discharge_planned, type: boolean, source: input, description: "Whether the discharge was planned; null until discharged" }
      - { name: denial_reason, type: string, source: input, description: "Reason captured by POST /admissions/{admissionId}/deny; null otherwise" }
      - { name: interrupted_stay_flag, type: boolean, source: computed, description: "True when this admission was attached to a predecessor within the 3-day interruption window", default: false }
      - { name: interruption_gap_days, type: integer, source: computed, description: "Whole calendar days between predecessor.discharged_at date and this admitted_at date; null when not a continuation" }
      - { name: cmg_tier, type: enum, source: computed, description: "TIER_A | TIER_B | TIER_C — selected from Patient.impairment_group_code via CMG_TIER_BY_IGC", constraints: "TIER_A | TIER_B | TIER_C" }
      - { name: effective_los_days, type: integer, source: computed, description: "Consolidated length of stay in whole days used for pricing; null until priced" }
      - { name: total_payment_cents, type: integer, source: computed, description: "Payable cents for this admission; 0 while NOT_PRICED, REOPENED, or CONSOLIDATED", default: 0 }
      - { name: qrp_penalty_pct_snapshot, type: number, source: computed, description: "Facility.active_qrp_penalty_pct pinned at the instant of admit; the value used at pricing time regardless of later QRP finalizations", default: 0.00 }
      - { name: screening_window_hours, type: number, source: computed, description: "Hours between screening.conducted_at and admitted_at, 2 decimals; null while PENDING" }
      - { name: screening_compliant, type: boolean, source: computed, description: "True when screening_window_hours <= 48.00 and the screening was PHYSICIAN_CONCURRED at or before admitted_at", default: false }
      - { name: poc_signed_within_deadline, type: boolean, source: computed, description: "True when the earliest OverallPlanOfCare for this admission was signed no later than admitted_at + 96 hours", default: false }
      - { name: therapy_weeks_satisfied, type: boolean, source: computed, description: "True when the admission has >= 1 TherapyWeek and every one has status MET or EXCEPTION_GRANTED", default: false }
      - { name: conference_compliant, type: boolean, source: computed, description: "True when every TherapyWeek of this admission has >= 1 TeamConference with status RECORDED", default: false }
      - { name: total_credited_minutes, type: integer, source: computed, description: "Sum of TherapyWeek.delivered_credited_minutes across all weeks of this admission", default: 0 }
      - { name: compliance_class, type: enum, source: computed, description: "PENDING_EVALUATION | QUALIFYING | NON_QUALIFYING | EXCLUDED — MEDICAL_REVIEW qualification verdict, finalized at discharge", constraints: "PENDING_EVALUATION | QUALIFYING | NON_QUALIFYING | EXCLUDED" }

  - name: OverallPlanOfCare
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission this plan governs" }
      - { name: authored_by_clinician_id, type: string, source: computed, description: "FK -> Clinician.id; rehab physician taken from the X-User-ID of the creating request" }
      - { name: target_los_days, type: integer, source: input, description: "Target length of stay in days", constraints: "1–120" }
      - { name: weekly_minutes_target, type: integer, source: input, description: "Planned credited therapy minutes per 7-day week", constraints: "60–2400" }
      - { name: disciplines, type: array, source: input, description: "Non-empty set of therapy disciplines in the plan", constraints: "subset of [PT, OT, SLP], no duplicates" }
      - { name: three_hour_rule_mode, type: enum, source: input, description: "DAILY_3HR | WEEKLY_15HR — variant selector for three-hour-rule evaluation of weeks created while this plan is ACTIVE", default: DAILY_3HR, constraints: "DAILY_3HR | WEEKLY_15HR" }
      - { name: signed_at, type: datetime, source: computed, description: "Logical-clock instant at which the physician signed (creation instant)" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; SUPERSEDED when a later plan is created for the same admission", constraints: "ACTIVE | SUPERSEDED" }

  - name: TherapyWeek
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission whose therapy is being measured" }
      - { name: exception_granted_by_clinician_id, type: string, source: computed, description: "FK -> Clinician.id; rehab physician who granted the three-hour-rule exception; null unless EXCEPTION_GRANTED" }
      - { name: week_index, type: integer, source: input, description: "1-based ordinal of this 7-day window within the stay; unique per admission_id", constraints: "1–26" }
      - { name: week_start_date, type: string, source: input, description: "Inclusive first calendar date (YYYY-MM-DD) of the 7-day window" }
      - { name: week_end_date, type: string, source: computed, description: "Inclusive last calendar date of the window = week_start_date + 6 days" }
      - { name: evaluation_mode, type: enum, source: computed, description: "DAILY_3HR | WEEKLY_15HR pinned from the ACTIVE OverallPlanOfCare at week creation; later plans do not repin it", constraints: "DAILY_3HR | WEEKLY_15HR" }
      - { name: delivered_credited_minutes, type: integer, source: computed, description: "Sum of credited_minutes over TherapySessions of this week with status DELIVERED", default: 0 }
      - { name: qualifying_days_count, type: integer, source: computed, description: "Number of calendar dates in the window whose credited minutes total >= 180", default: 0 }
      - { name: exception_reason, type: string, source: input, description: "Physician justification recorded with an exception; null unless EXCEPTION_GRANTED" }
      - { name: status, type: enum, source: system, description: "OPEN | MET | NOT_MET | EXCEPTION_GRANTED", constraints: "OPEN | MET | NOT_MET | EXCEPTION_GRANTED" }

  - name: TherapySession
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission receiving therapy" }
      - { name: therapy_week_id, type: string, source: computed, description: "FK -> TherapyWeek.id; week whose window contains date(start_at), resolved at creation" }
      - { name: clinician_id, type: string, source: input, description: "FK -> Clinician.id; treating therapist" }
      - { name: discipline, type: enum, source: input, description: "PT | OT | SLP — must appear in the ACTIVE plan's disciplines", constraints: "PT | OT | SLP" }
      - { name: modality, type: enum, source: input, description: "INDIVIDUAL | CONCURRENT | GROUP — drives minute crediting", constraints: "INDIVIDUAL | CONCURRENT | GROUP" }
      - { name: group_size, type: integer, source: input, description: "Number of patients treated together; 1 for INDIVIDUAL, exactly 2 for CONCURRENT, 3–6 for GROUP", default: 1 }
      - { name: start_at, type: datetime, source: input, description: "Session start instant (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Session end instant (exclusive); must be strictly after start_at" }
      - { name: session_date, type: string, source: computed, description: "UTC calendar date of start_at (YYYY-MM-DD); the daily-cap and qualifying-day bucket" }
      - { name: raw_minutes, type: integer, source: computed, description: "floor((end_at - start_at) in seconds / 60)" }
      - { name: credited_minutes, type: integer, source: computed, description: "Minutes credited toward the three-hour rule after modality division (see calculations.credited_therapy_minutes)" }
      - { name: documented_at, type: datetime, source: computed, description: "Logical-clock instant at which the session was documented as delivered; null unless DELIVERED or VOIDED" }
      - { name: void_reason, type: string, source: input, description: "Reason captured when a delivered session is voided; null otherwise" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DELIVERED | VOIDED", constraints: "SCHEDULED | DELIVERED | VOIDED" }

  - name: TeamConference
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission discussed" }
      - { name: therapy_week_id, type: string, source: input, description: "FK -> TherapyWeek.id; week this conference documents" }
      - { name: led_by_clinician_id, type: string, source: input, description: "FK -> Clinician.id; must have credential REHAB_PHYSICIAN and status ACTIVE" }
      - { name: participant_clinician_ids, type: array, source: input, description: "Clinician ids present; discovered in reverse through GET /team-conferences filtered by led_by_clinician_id or admission_id", constraints: "1–12 ids, no duplicates, all in the same facility" }
      - { name: held_at, type: datetime, source: input, description: "Instant the conference was held; its UTC date must fall inside the week window" }
      - { name: status, type: enum, source: computed, description: "RECORDED when created no later than week_end_date; LATE_RECORDED when created after week_end_date — only RECORDED counts toward conference_compliant", constraints: "RECORDED | LATE_RECORDED" }

  - name: PatientAssessmentInstrument
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission being assessed" }
      - { name: coder_clinician_id, type: string, source: input, description: "FK -> Clinician.id; coder who completes the item set; credential must be CODER" }
      - { name: transmitted_by_clinician_id, type: string, source: computed, description: "FK -> Clinician.id; coder taken from X-User-ID of the transmitting request; null until transmitted" }
      - { name: assessment_type, type: enum, source: input, description: "ADMISSION | DISCHARGE — one of each per admission at most", constraints: "ADMISSION | DISCHARGE" }
      - { name: assessment_reference_date, type: string, source: computed, description: "ADMISSION: date(admitted_at) + 3 days. DISCHARGE: date(discharged_at)" }
      - { name: completion_deadline_at, type: datetime, source: computed, description: "assessment_reference_date + 4 days at 00:00:00.000Z (ADMISSION) or + 5 days at 00:00:00.000Z (DISCHARGE)" }
      - { name: transmission_deadline_at, type: datetime, source: computed, description: "completion_deadline_at + 17 days at 00:00:00.000Z" }
      - { name: item_set_complete, type: boolean, source: input, description: "Coder attestation supplied at completion" }
      - { name: completed_at, type: datetime, source: computed, description: "Logical-clock instant of completion; null while DRAFT" }
      - { name: completion_late, type: boolean, source: computed, description: "True when completed_at >= completion_deadline_at", default: false }
      - { name: transmitted_at, type: datetime, source: computed, description: "Logical-clock instant of transmission; null until transmitted" }
      - { name: late_days, type: integer, source: computed, description: "ceil((transmitted_at - transmission_deadline_at) / 24h) when late, else 0", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPLETED | TRANSMITTED | LATE_TRANSMITTED | MISSED", constraints: "DRAFT | COMPLETED | TRANSMITTED | LATE_TRANSMITTED | MISSED" }

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility under review" }
      - { name: method, type: enum, source: input, description: "PRESUMPTIVE | MEDICAL_REVIEW — selects the qualification algorithm variant", constraints: "PRESUMPTIVE | MEDICAL_REVIEW" }
      - { name: period_start, type: string, source: input, description: "Inclusive first discharge date (YYYY-MM-DD) of the reviewed cohort" }
      - { name: period_end, type: string, source: input, description: "Inclusive last discharge date (YYYY-MM-DD) of the reviewed cohort", constraints: "must be >= period_start" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who opened the review" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who certified the review; must differ from created_by_user_id; null until certified" }
      - { name: total_cases, type: integer, source: computed, description: "Cohort size at the last compute", default: 0 }
      - { name: qualifying_cases, type: integer, source: computed, description: "Cohort members qualifying under the selected method at the last compute", default: 0 }
      - { name: compliance_pct, type: number, source: computed, description: "round_half_up(qualifying_cases * 100 / total_cases, 2); null before the first compute" }
      - { name: outcome, type: enum, source: computed, description: "PASS when compliance_pct >= Facility.compliance_threshold_pct, else FAIL; null before the first compute", constraints: "PASS | FAIL" }
      - { name: computed_at, type: datetime, source: computed, description: "Logical-clock instant of the last compute; null before the first compute" }
      - { name: certified_at, type: datetime, source: computed, description: "Logical-clock instant of certification; null until CERTIFIED" }
      - { name: stale_reason, type: string, source: computed, description: "Why the computed result was invalidated; null unless STALE" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPUTED | STALE | CERTIFIED", constraints: "DRAFT | COMPUTED | STALE | CERTIFIED" }

  - name: QrpAssessment
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility being scored" }
      - { name: fiscal_year, type: integer, source: input, description: "Payment fiscal year the penalty would apply to", constraints: "2020–2100" }
      - { name: reporting_period_start, type: string, source: input, description: "Inclusive first discharge date (YYYY-MM-DD) of the reporting cohort" }
      - { name: reporting_period_end, type: string, source: input, description: "Inclusive last discharge date (YYYY-MM-DD) of the reporting cohort", constraints: "must be >= reporting_period_start" }
      - { name: cohort_count, type: integer, source: computed, description: "Discharged admissions of the facility whose discharge date falls in the reporting period", default: 0 }
      - { name: timely_count, type: integer, source: computed, description: "Cohort members holding a DISCHARGE assessment with status TRANSMITTED (LATE_TRANSMITTED and MISSED excluded)", default: 0 }
      - { name: data_completeness_pct, type: number, source: computed, description: "round_half_up(timely_count * 100 / cohort_count, 2); 0.00 when cohort_count == 0", default: 0.00 }
      - { name: penalty_pct, type: number, source: computed, description: "0.00 when data_completeness_pct >= 95.00, else 2.00", default: 0.00 }
      - { name: finalized_at, type: datetime, source: computed, description: "Logical-clock instant of finalization; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED", constraints: "DRAFT | FINALIZED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- cyclic ----
  - entity: PreadmissionScreening
    initial_state: DRAFT
    terminal_states: [PHYSICIAN_CONCURRED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /screenings/{screeningId}/submit"
        actor: NurseCaseManager
        preconditions:
          - "intensive_therapy_documented, expected_functional_improvement_documented, prior_functional_level_documented and medical_supervision_documented are all true (else ERR_SCREENING_DOCUMENTATION_INCOMPLETE)"
          - "Clinician(conducted_by_clinician_id).status == ACTIVE (else ERR_ACTING_CLINICIAN_INACTIVE)"
        side_effects: []

      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /screenings/{screeningId}/review with decision == REQUEST_CHANGES"
        actor: RehabPhysician
        preconditions:
          - "X-User-ID != conducted_by_clinician_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Clinician(X-User-ID).credential == REHAB_PHYSICIAN and status == ACTIVE"
        side_effects:
          - "reviewed_by_clinician_id = X-User-ID; reviewed_at = current logical clock; reviewer_note stored"

      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /screenings/{screeningId}"
        actor: NurseCaseManager
        preconditions: []
        side_effects:
          - "revision_count += 1; reviewed_by_clinician_id and reviewed_at reset to null"
        note: "Revision loop DRAFT→SUBMITTED→CHANGES_REQUESTED→DRAFT; a PATCH of a DRAFT screening edits fields without a state change."

      - from: SUBMITTED
        to: PHYSICIAN_CONCURRED
        trigger: "POST /screenings/{screeningId}/review with decision == CONCUR"
        actor: RehabPhysician
        preconditions:
          - "X-User-ID != conducted_by_clinician_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Clinician(X-User-ID).credential == REHAB_PHYSICIAN and status == ACTIVE"
        side_effects:
          - "reviewed_by_clinician_id = X-User-ID; reviewed_at = current logical clock"

      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system cascade — Facility.posture became ADMISSION_FREEZE (see calculations.facility_posture)"
        actor: system
        preconditions:
          - "Patient(patient_id).facility_id == the facility whose posture became ADMISSION_FREEZE"
        side_effects: []
        note: "Third hop of the discharge cascade; no screening may progress to concurrence while the facility is frozen."

      - from: ON_HOLD
        to: SUBMITTED
        trigger: "system cascade — Facility.posture left ADMISSION_FREEZE"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock past conducted_at + 48h"
        actor: system
        preconditions: ["new clock value >= conducted_at + 48 hours"]
        side_effects: []

      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock past conducted_at + 48h"
        actor: system
        preconditions: ["new clock value >= conducted_at + 48 hours"]
        side_effects: []

      - from: CHANGES_REQUESTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock past conducted_at + 48h"
        actor: system
        preconditions: ["new clock value >= conducted_at + 48 hours"]
        side_effects: []

      - from: ON_HOLD
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock past conducted_at + 48h"
        actor: system
        preconditions: ["new clock value >= conducted_at + 48 hours"]
        side_effects: []

  # ------------------------------------------- parallel dimensions (3 axes) ----
  - entity: Admission
    initial_state: PENDING          # dimension `stay_status`
    terminal_states: [DISCHARGED, ADMISSION_DENIED]
    transitions:
      - from: PENDING
        to: ADMITTED
        trigger: "POST /admissions/{admissionId}/admit"
        actor: NurseCaseManager
        preconditions:
          - "Facility(facility_id).posture IN {OPEN, THRESHOLD_WATCH} (else ERR_FACILITY_ADMISSION_FROZEN)"
          - "PreadmissionScreening(screening_id).status == PHYSICIAN_CONCURRED (else ERR_SCREENING_NOT_CONCURRED)"
          - "admitted_at <= current logical clock and admitted_at >= screening.conducted_at (else ERR_INVALID_REQUEST)"
          - "admitted_at - screening.conducted_at <= 48 hours (else ERR_SCREENING_WINDOW_EXPIRED)"
          - "screening.reviewed_at <= admitted_at (else ERR_SCREENING_NOT_CONCURRED)"
          - "If predecessor_admission_id is set: that admission has the same patient_id (else ERR_SCREENING_PATIENT_MISMATCH), has stay_status == DISCHARGED with 0 <= gap_days <= 3 (else ERR_INTERRUPTION_WINDOW_EXCEEDED), and is not already named by another admission (else ERR_PREDECESSOR_ALREADY_CONTINUED)"
          - "If predecessor_admission_id is null: no DISCHARGED admission of the same patient_id has a discharge date within 3 days before date(admitted_at) (else ERR_INTERRUPTED_STAY_LINK_REQUIRED)"
        side_effects:
          - "stay_status = ADMITTED; admitted_at stored; screening_window_hours and screening_compliant computed"
          - "qrp_penalty_pct_snapshot = Facility.active_qrp_penalty_pct (pinned; later QRP finalizations never repin it)"
          - "cmg_tier resolved from Patient.impairment_group_code"
          - "When predecessor_admission_id is set: interrupted_stay_flag = true, interruption_gap_days = gap_days, payment_consolidated_into_admission_id = chain head id, payment_status NOT_PRICED -> CONSOLIDATED, total_payment_cents = 0"
          - "Cascade hop 2 (continuation attach): chain head payment_status PRICED -> REOPENED and head.total_payment_cents = 0"
          - "Cascade hop 3 (caused by hop 2): Facility.settled_payment_cents recomputed over the facility's PRICED admissions; Facility.version += 1"
          - "Cascade hop 4 (caused by hop 2): every ComplianceReview of the facility with status COMPUTED whose cohort contains the head becomes STALE with stale_reason = 'INTERRUPTED_STAY_RECONSOLIDATION'"

      - from: PENDING
        to: ADMISSION_DENIED
        trigger: "POST /admissions/{admissionId}/deny"
        actor: RehabPhysician
        preconditions:
          - "Clinician(X-User-ID).credential == REHAB_PHYSICIAN and status == ACTIVE"
        side_effects:
          - "denial_reason stored; compliance_class = EXCLUDED"

      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /admissions/{admissionId}/discharge"
        actor: NurseCaseManager
        preconditions:
          - "admitted_at <= discharged_at <= current logical clock (else ERR_INVALID_REQUEST)"
        side_effects:
          - "discharged_at, discharge_destination, discharge_planned stored; documentation_status unchanged"
          - "Cascade hop 1: every TherapyWeek of this admission with status OPEN is evaluated per calculations.three_hour_rule_evaluation and becomes MET or NOT_MET"
          - "Cascade hop 2 (caused by hop 1): therapy_weeks_satisfied, conference_compliant and compliance_class are recomputed on this admission — compliance_class becomes EXCLUDED when discharge_destination == EXPIRED, otherwise QUALIFYING or NON_QUALIFYING"
          - "Cascade hop 3 (caused by hop 2): Facility.cohort_total_count, cohort_qualifying_count and provisional_compliance_pct are recomputed, then Facility.posture is re-derived per calculations.facility_posture"
          - "Cascade hop 4 (caused by hop 3): when posture becomes ADMISSION_FREEZE every PreadmissionScreening of that facility with status SUBMITTED becomes ON_HOLD; when posture leaves ADMISSION_FREEZE every ON_HOLD screening returns to SUBMITTED"
          - "payment_status NOT_PRICED -> PRICED with effective_los_days and total_payment_cents from calculations.stay_payment_cents (chain continuations stay CONSOLIDATED at 0 and instead push their chain head REOPENED -> PRICED)"
          - "Facility.settled_payment_cents recomputed; Facility.version += 1"

      - from: PRICED
        to: REOPENED
        trigger: "POST /admissions/{admissionId}/admit of a continuation naming this admission as predecessor_admission_id"
        actor: system
        preconditions: ["this admission is the chain head and payment_status == PRICED"]
        side_effects:
          - "total_payment_cents = 0 and effective_los_days = null pending reconsolidation"
        note: "Dimension `payment_status`; evolves independently of `stay_status`, which stays DISCHARGED."

      - from: REOPENED
        to: PRICED
        trigger: "POST /admissions/{admissionId}/discharge of the continuation admission"
        actor: system
        preconditions: ["every admission in the chain has stay_status == DISCHARGED"]
        side_effects:
          - "effective_los_days and total_payment_cents recomputed over the whole chain per calculations.stay_payment_cents"

      - from: CONSOLIDATED
        to: NOT_PRICED
        trigger: "POST /admissions/{admissionId}/rescind-interruption"
        actor: ComplianceOfficer
        preconditions:
          - "interrupted_stay_flag == true (else ERR_NOT_INTERRUPTED_STAY)"
          - "this admission's stay_status == ADMITTED (a discharged continuation may not be unlinked, else ERR_INVALID_STATE)"
        side_effects:
          - "interrupted_stay_flag = false; interruption_gap_days = null; payment_consolidated_into_admission_id = null; predecessor_admission_id = null"
          - "Chain head payment_status REOPENED -> PRICED with its standalone effective_los_days and total_payment_cents restored; Facility.settled_payment_cents recomputed to exactly its pre-attach value"

      - from: INCOMPLETE
        to: POC_SIGNED
        trigger: "POST /plans-of-care"
        actor: RehabPhysician
        preconditions: ["stay_status == ADMITTED"]
        side_effects:
          - "poc_signed_within_deadline recomputed; version += 1"
        note: "Dimension `documentation_status`; independent of stay_status and payment_status."

      - from: POC_SIGNED
        to: PAI_TRANSMITTED
        trigger: "POST /assessments/{assessmentId}/transmit for a DISCHARGE assessment"
        actor: HimCoder
        preconditions: ["the transmitted assessment reached TRANSMITTED or LATE_TRANSMITTED"]
        side_effects: []

  # --------------------------------------------- branching + cyclic re-eval ----
  - entity: TherapyWeek
    initial_state: OPEN
    terminal_states: [EXCEPTION_GRANTED]
    transitions:
      - from: OPEN
        to: MET
        trigger: "POST /therapy-weeks/{weekId}/evaluate, or the discharge cascade hop 1"
        actor: TherapyLead
        preconditions:
          - "An OverallPlanOfCare with status ACTIVE exists for admission_id (else ERR_PLAN_OF_CARE_MISSING)"
          - "calculations.three_hour_rule_evaluation returns MET for evaluation_mode"
        side_effects:
          - "delivered_credited_minutes and qualifying_days_count refreshed"
          - "Admission.therapy_weeks_satisfied and Admission.total_credited_minutes recomputed"

      - from: OPEN
        to: NOT_MET
        trigger: "POST /therapy-weeks/{weekId}/evaluate, or the discharge cascade hop 1"
        actor: TherapyLead
        preconditions:
          - "An OverallPlanOfCare with status ACTIVE exists for admission_id (else ERR_PLAN_OF_CARE_MISSING)"
          - "calculations.three_hour_rule_evaluation returns NOT_MET for evaluation_mode"
        side_effects:
          - "delivered_credited_minutes and qualifying_days_count refreshed"
          - "Admission.therapy_weeks_satisfied = false and, when the admission is DISCHARGED, Admission.compliance_class = NON_QUALIFYING"
        note: "Branch divergence: the MET branch leaves compliance_class recomputable as QUALIFYING, the NOT_MET branch forces NON_QUALIFYING and drags Facility.posture with it."

      - from: MET
        to: NOT_MET
        trigger: "system re-evaluation after POST /therapy-sessions/{sessionId}/void"
        actor: system
        preconditions: ["the voided session belonged to this week and the week is not EXCEPTION_GRANTED"]
        side_effects:
          - "delivered_credited_minutes reduced by the voided session's credited_minutes; qualifying_days_count refreshed"
          - "Admission.therapy_weeks_satisfied recomputed"

      - from: NOT_MET
        to: MET
        trigger: "system re-evaluation after POST /therapy-sessions/{sessionId}/deliver"
        actor: system
        preconditions: ["the delivered session belongs to this week and the week is not EXCEPTION_GRANTED"]
        side_effects:
          - "delivered_credited_minutes increased by the session's credited_minutes; qualifying_days_count refreshed"
          - "Admission.therapy_weeks_satisfied recomputed"
        note: "MET↔NOT_MET is a genuine cycle driven by session delivery and voiding."

      - from: NOT_MET
        to: EXCEPTION_GRANTED
        trigger: "POST /therapy-weeks/{weekId}/exception"
        actor: RehabPhysician
        preconditions:
          - "status == NOT_MET (else ERR_EXCEPTION_NOT_ALLOWED)"
          - "Clinician(X-User-ID).credential == REHAB_PHYSICIAN and status == ACTIVE"
        side_effects:
          - "exception_reason and exception_granted_by_clinician_id stored"
          - "Admission.therapy_weeks_satisfied recomputed (EXCEPTION_GRANTED counts as satisfied)"
          - "When the admission is DISCHARGED, Admission.compliance_class and Facility.provisional_compliance_pct / posture are recomputed"

  # ------------------------------------------------------------- branching ----
  - entity: PatientAssessmentInstrument
    initial_state: DRAFT
    terminal_states: [TRANSMITTED, LATE_TRANSMITTED, MISSED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /assessments/{assessmentId}/complete"
        actor: HimCoder
        preconditions:
          - "item_set_complete == true in the request body (else ERR_PAI_ITEM_SET_INCOMPLETE)"
          - "Clinician(X-User-ID).credential == CODER and status == ACTIVE"
        side_effects:
          - "completed_at = current logical clock; completion_late = (completed_at >= completion_deadline_at)"

      - from: COMPLETED
        to: TRANSMITTED
        trigger: "POST /assessments/{assessmentId}/transmit while current clock < transmission_deadline_at"
        actor: HimCoder
        preconditions:
          - "Admission(admission_id).stay_status == DISCHARGED (else ERR_ADMISSION_NOT_DISCHARGED)"
          - "X-User-ID != coder_clinician_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "transmitted_at = current clock; late_days = 0; transmitted_by_clinician_id = X-User-ID"
          - "When assessment_type == DISCHARGE: Admission.documentation_status POC_SIGNED -> PAI_TRANSMITTED"

      - from: COMPLETED
        to: LATE_TRANSMITTED
        trigger: "POST /assessments/{assessmentId}/transmit while transmission_deadline_at <= current clock < transmission_deadline_at + 30 days"
        actor: HimCoder
        preconditions:
          - "Admission(admission_id).stay_status == DISCHARGED (else ERR_ADMISSION_NOT_DISCHARGED)"
          - "X-User-ID != coder_clinician_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "transmitted_at = current clock; late_days = ceil((transmitted_at - transmission_deadline_at) / 24h); transmitted_by_clinician_id = X-User-ID"
          - "When assessment_type == DISCHARGE: Admission.documentation_status POC_SIGNED -> PAI_TRANSMITTED, and this admission stops counting as timely for QrpAssessment.timely_count"
        note: "Branch selector is purely the clock position relative to transmission_deadline_at; equality lands on LATE_TRANSMITTED."

      - from: DRAFT
        to: MISSED
        trigger: "POST /_clock/set_current_utc advancing the clock to transmission_deadline_at + 30 days or later"
        actor: system
        preconditions: []
        side_effects: []

      - from: COMPLETED
        to: MISSED
        trigger: "POST /_clock/set_current_utc advancing the clock to transmission_deadline_at + 30 days or later"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------- cyclic ----
  - entity: ComplianceReview
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /compliance-reviews/{reviewId}/compute"
        actor: ComplianceOfficer
        preconditions:
          - "cohort per calculations.compliance_percentage is non-empty (else ERR_EMPTY_COMPLIANCE_COHORT)"
        side_effects:
          - "total_cases, qualifying_cases, compliance_pct, outcome and computed_at set per the selected method variant"

      - from: COMPUTED
        to: STALE
        trigger: "system cascade — a cohort member was reconsolidated by an interrupted-stay attach"
        actor: system
        preconditions: []
        side_effects:
          - "stale_reason set; compliance_pct and outcome retained for audit but no longer certifiable"
          - "Facility.certified_compliance_pct = null when this review was its source"

      - from: STALE
        to: COMPUTED
        trigger: "POST /compliance-reviews/{reviewId}/compute"
        actor: ComplianceOfficer
        preconditions:
          - "cohort per calculations.compliance_percentage is non-empty (else ERR_EMPTY_COMPLIANCE_COHORT)"
        side_effects:
          - "stale_reason = null; totals and outcome recomputed against current cohort state"
        note: "COMPUTED↔STALE is a cycle: any later reconsolidation invalidates the fresh result again."

      - from: COMPUTED
        to: CERTIFIED
        trigger: "POST /compliance-reviews/{reviewId}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "No cohort member has payment_status == REOPENED (else ERR_COHORT_PAYMENT_UNSETTLED)"
        side_effects:
          - "certified_at and certified_by_user_id set; Facility.certified_compliance_pct = compliance_pct"
          - "Facility.posture re-derived (a CERTIFIED review with outcome FAIL forces ADMISSION_FREEZE) and, when it becomes ADMISSION_FREEZE, SUBMITTED screenings of the facility become ON_HOLD"
          - "Facility.version += 1"

  # ---------------------------------------------------------------- linear ----
  - entity: QrpAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /qrp-assessments/{qrpId}/finalize"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "cohort_count, timely_count, data_completeness_pct and penalty_pct recomputed, then finalized_at = current clock"
          - "Facility.active_qrp_penalty_pct = penalty_pct; Facility.qrp_penalty_effective_at = finalized_at; Facility.version += 1"
          - "Admissions already ADMITTED keep their qrp_penalty_pct_snapshot; only admissions admitted after finalized_at pin the new value"

  - entity: Clinician
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /clinicians/{clinicianId}/deactivate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: OverallPlanOfCare
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /plans-of-care for the same admission_id"
        actor: RehabPhysician
        preconditions: []
        side_effects:
          - "TherapyWeeks already created keep their pinned evaluation_mode; only weeks created after the new plan pin the new mode"

  - entity: TherapySession
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /therapy-sessions/{sessionId}/deliver"
        actor: TherapyLead
        preconditions:
          - "Admission(admission_id).stay_status == ADMITTED (else ERR_ADMISSION_NOT_ACTIVE)"
          - "Clinician(clinician_id).status == ACTIVE"
        side_effects:
          - "documented_at = current clock; TherapyWeek.delivered_credited_minutes += credited_minutes; qualifying_days_count refreshed"
          - "When the week is MET or NOT_MET it is re-evaluated (NOT_MET -> MET is possible); Admission.total_credited_minutes recomputed"

      - from: DELIVERED
        to: VOIDED
        trigger: "POST /therapy-sessions/{sessionId}/void"
        actor: TherapyLead
        preconditions:
          - "void_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "TherapyWeek.delivered_credited_minutes -= credited_minutes (exact compensation); qualifying_days_count refreshed"
          - "When the week is MET or NOT_MET it is re-evaluated (MET -> NOT_MET is possible); Admission.total_credited_minutes recomputed"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /therapy-sessions/{sessionId}/void"
        actor: TherapyLead
        preconditions:
          - "void_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "No minute adjustment (a SCHEDULED session never contributed minutes); the session stops occupying its clinician and rest-buffer intervals"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-of-care-create-stale-admission
    parent_entity: Admission
    write_endpoint: "POST /plans-of-care"
    occ_field: "expected_admission_version"
    description: |
      Creating an OverallPlanOfCare against an Admission whose version has
      advanced since the client last read it is rejected. A new plan legitimately
      supersedes the prior ACTIVE plan and repins the three-hour-rule mode for
      weeks created afterwards, so a writer holding a stale view of the admission
      would silently discard a plan it never saw.
    error_id: ERR_STALE_ADMISSION_VERSION
    http_status: 412

  - rule_id: compliance-review-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /compliance-reviews"
    occ_field: "expected_facility_version"
    description: |
      Opening a ComplianceReview against a Facility whose version has advanced
      since the client last read it is rejected. A new review legitimately
      supersedes an earlier one for the same period once certification moves
      Facility.certified_compliance_pct, so a stale-version writer would open a
      review against a compliance state that no longer exists.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: credited_therapy_minutes
    trigger: "POST /therapy-sessions (creation) — stored on the session and reused unchanged by delivery and voiding"
    algorithm: aggregation
    formula: |
      raw_minutes = floor((end_at - start_at) total_seconds / 60)
      if modality == INDIVIDUAL: credited_minutes = raw_minutes
      if modality == CONCURRENT: credited_minutes = floor(raw_minutes / 2)
      if modality == GROUP:      credited_minutes = floor(raw_minutes / group_size)

      # PINNED ROUNDING ORDER (mode (b)): the floor division is applied
      # per session and the floored results are summed afterwards. Summing raw
      # minutes first and dividing once produces a different total — e.g. three
      # 50-minute GROUP sessions with group_size 3 credit
      # floor(50/3)*3 = 16*3 = 48 minutes, NOT floor(150/3) = 50 minutes.
      TherapyWeek.delivered_credited_minutes = sum(credited_minutes
          for TherapySession s where s.therapy_week_id == week.id
                                 and s.status == DELIVERED)
      Admission.total_credited_minutes = sum(delivered_credited_minutes
          over TherapyWeek where admission_id == admission.id)
    input_set: "Only sessions with status DELIVERED contribute to week and admission totals; SCHEDULED and VOIDED sessions contribute 0. Ordering is irrelevant because every term is already an integer."
    constants:
      CONCURRENT_DIVISOR: 2
      GROUP_SIZE_MIN: 3
      GROUP_SIZE_MAX: 6
    precision: "integer minutes, floor per session (never round-half-up, never divide after summing)"

  - name: three_hour_rule_evaluation
    trigger: "POST /therapy-weeks/{weekId}/evaluate, the discharge cascade hop 1, and system re-evaluation after session deliver/void"
    algorithm: threshold
    formula: |
      window_dates = [week_start_date .. week_start_date + 6 days]      # 7 inclusive dates
      per_day[d] = sum(credited_minutes for DELIVERED sessions of this week
                       where session_date == d)                         # d in window_dates
      delivered_credited_minutes = sum(per_day[d] for d in window_dates)
      qualifying_days_count      = count(d in window_dates where per_day[d] >= DAILY_MIN_MINUTES)

      if evaluation_mode == DAILY_3HR:
          verdict = MET if qualifying_days_count >= REQUIRED_QUALIFYING_DAYS else NOT_MET
      if evaluation_mode == WEEKLY_15HR:
          verdict = MET if delivered_credited_minutes >= WEEKLY_MIN_MINUTES else NOT_MET
    input_set: "Sessions with therapy_week_id == week.id and status == DELIVERED. A week with zero such sessions yields delivered_credited_minutes = 0 and qualifying_days_count = 0 and therefore NOT_MET under either mode — no division is performed, so the empty set is not an error."
    constants:
      DAILY_MIN_MINUTES: 180
      REQUIRED_QUALIFYING_DAYS: 5
      WEEKLY_MIN_MINUTES: 900
    precision: "integer minutes; both comparisons are inclusive (>=), so exactly 180 minutes makes a qualifying day and exactly 900 minutes satisfies WEEKLY_15HR"
    variants:
      - name: DAILY_3HR
        when: "evaluation_mode pinned from OverallPlanOfCare.three_hour_rule_mode == DAILY_3HR at week creation"
        difference: "Requires 5 of the 7 window dates to each reach 180 credited minutes; total weekly volume is irrelevant."
      - name: WEEKLY_15HR
        when: "evaluation_mode pinned from OverallPlanOfCare.three_hour_rule_mode == WEEKLY_15HR at week creation"
        difference: "Requires 900 credited minutes anywhere in the window; distribution across dates is irrelevant. Three dates of 300 credited minutes (900 total) is MET here and NOT_MET under DAILY_3HR."

  - name: compliance_percentage
    trigger: "POST /compliance-reviews/{reviewId}/compute"
    algorithm: aggregation
    formula: |
      cohort = [ Admission a where a.facility_id == review.facility_id
                                and a.stay_status == DISCHARGED
                                and review.period_start <= date(a.discharged_at) <= review.period_end
                                and a.compliance_class != EXCLUDED ]
      total_cases = count(cohort)
      if total_cases == 0: reject with ERR_EMPTY_COMPLIANCE_COHORT

      if review.method == PRESUMPTIVE:
          qualifies(a) = (a.patient.impairment_group_code in PRESUMPTIVE_IGC_SET)
                      or (a.patient.etiologic_diagnosis_code in PRESUMPTIVE_DX_SET
                          and a.patient.comorbidity_tier in {TIER_1, TIER_2})
      if review.method == MEDICAL_REVIEW:
          qualifies(a) = (a.compliance_class == QUALIFYING)

      qualifying_cases = count(a in cohort where qualifies(a))
      compliance_pct   = round_half_up(qualifying_cases * 100 / total_cases, 2)
      outcome          = PASS if compliance_pct >= Facility.compliance_threshold_pct else FAIL
    input_set: "Discharged admissions of the facility whose discharge calendar date lies inside the review period (both bounds inclusive) and whose compliance_class is not EXCLUDED. Admissions still ADMITTED or PENDING, and admissions discharged to EXPIRED, never enter either variant's cohort."
    constants:
      PRESUMPTIVE_IGC_SET: ["0008", "0110", "0704", "1101"]
      PRESUMPTIVE_DX_SET: ["I63.9", "S72.001A"]
    precision: "compliance_pct 2 decimals, round_half_up; the PASS test is inclusive (>=), so exactly the threshold passes"
    variants:
      - name: PRESUMPTIVE
        when: "review.method == PRESUMPTIVE"
        difference: "Qualification is read off the patient's impairment group code / etiologic diagnosis and comorbidity tier alone; documentation completeness is ignored entirely."
      - name: MEDICAL_REVIEW
        when: "review.method == MEDICAL_REVIEW"
        difference: "Qualification requires the admission's documentation verdict (compliance_class == QUALIFYING), so the identical cohort can score materially lower than PRESUMPTIVE — a stroke patient with a presumptive impairment group code but no signed plan of care qualifies under PRESUMPTIVE and fails MEDICAL_REVIEW."

  - name: admission_compliance_class
    trigger: "POST /admissions/{admissionId}/discharge (cascade hop 2), POST /therapy-weeks/{weekId}/evaluate, POST /therapy-weeks/{weekId}/exception, POST /admissions/{admissionId}/deny"
    algorithm: constraint_propagation
    formula: |
      if stay_status == ADMISSION_DENIED: compliance_class = EXCLUDED
      elif stay_status != DISCHARGED:     compliance_class = PENDING_EVALUATION
      elif discharge_destination == EXPIRED: compliance_class = EXCLUDED
      elif screening_compliant and poc_signed_within_deadline
           and therapy_weeks_satisfied and conference_compliant:
                                          compliance_class = QUALIFYING
      else:                               compliance_class = NON_QUALIFYING

      screening_compliant          = (screening_window_hours <= 48.00)
                                     and screening.status == PHYSICIAN_CONCURRED
                                     and screening.reviewed_at <= admitted_at
      poc_signed_within_deadline   = exists OverallPlanOfCare p for this admission with
                                     min(p.created_at) and p.signed_at <= admitted_at + 96 hours
      therapy_weeks_satisfied      = count(TherapyWeek of admission) >= 1
                                     and every TherapyWeek.status in {MET, EXCEPTION_GRANTED}
      conference_compliant         = every TherapyWeek of admission has >= 1 TeamConference
                                     with status == RECORDED
    input_set: "All TherapyWeeks of the admission regardless of status; TeamConferences with status RECORDED only (LATE_RECORDED never counts). When several plans of care exist, the deadline test uses the earliest by created_at ASC."
    constants:
      SCREENING_WINDOW_HOURS: 48
      POC_SIGNATURE_DEADLINE_HOURS: 96
    precision: "screening_window_hours 2 decimals; the window test is inclusive (<= 48.00)"

  - name: provisional_compliance_tracking
    trigger: "Every cascade that changes an Admission.compliance_class (discharge, week evaluation, week exception, denial) and every ComplianceReview certification"
    algorithm: aggregation
    formula: |
      cohort = [ Admission a where a.facility_id == facility.id
                                and a.stay_status == DISCHARGED
                                and facility.review_period_start <= date(a.discharged_at)
                                                                 <= facility.review_period_end
                                and a.compliance_class != EXCLUDED ]
      cohort_total_count        = count(cohort)
      cohort_qualifying_count   = count(a in cohort where a.compliance_class == QUALIFYING)
      provisional_compliance_pct = 0.00 if cohort_total_count == 0
                                   else round_half_up(cohort_qualifying_count * 100
                                                      / cohort_total_count, 2)
    input_set: "Same filter as calculations.compliance_percentage but bounded by the facility's own review_period_start/review_period_end and always using the MEDICAL_REVIEW notion of qualification."
    constants: {}
    precision: "2 decimals, round_half_up; empty cohort yields exactly 0.00 and never a division"

  - name: facility_posture
    trigger: "Immediately after provisional_compliance_tracking recomputes, and after ComplianceReview certification"
    algorithm: threshold
    formula: |
      latest_certified = the ComplianceReview of this facility with status == CERTIFIED
                         and the greatest certified_at (tie-break: greatest created_at)
      if latest_certified exists and latest_certified.outcome == FAIL:
          posture = ADMISSION_FREEZE
      elif cohort_total_count >= POSTURE_MIN_COHORT
           and provisional_compliance_pct < (compliance_threshold_pct - FREEZE_MARGIN_PCT):
          posture = ADMISSION_FREEZE
      elif cohort_total_count >= POSTURE_MIN_COHORT
           and provisional_compliance_pct < compliance_threshold_pct:
          posture = THRESHOLD_WATCH
      else:
          posture = OPEN
    input_set: "cohort_total_count / provisional_compliance_pct as recomputed by provisional_compliance_tracking, plus the single latest CERTIFIED review (STALE and COMPUTED reviews never gate posture)."
    constants:
      POSTURE_MIN_COHORT: 2
      FREEZE_MARGIN_PCT: 20.00
    precision: "both comparisons are strict (<), so a provisional percentage exactly equal to the threshold leaves posture OPEN"

  - name: stay_payment_cents
    trigger: "POST /admissions/{admissionId}/discharge, and the REOPENED -> PRICED reconsolidation of a chain head"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: the chain and its effective length of stay -----------------
      chain = [head] + continuations ordered by admitted_at ASC
              (head = the admission whose predecessor_admission_id is null)
      span_days = calendar_days_inclusive(date(head.admitted_at),
                                         date(chain.last.discharged_at))
      interruption_days = sum over consecutive pairs (prev, next) in chain of
                          (date(next.admitted_at) - date(prev.discharged_at)) in whole days
      effective_los_days = span_days - interruption_days
      # single-stay chain: interruption_days == 0, so effective_los_days is just
      # calendar_days_inclusive(admit date, discharge date) — same-day stay == 1.

      # ---- step 2: base rate with comorbidity uplift, rounded FIRST ----------
      uplifted_base_cents = round_half_up(CMG_BASE_CENTS[cmg_tier]
                                          * (1 + COMORBIDITY_UPLIFT[patient.comorbidity_tier]))

      # ---- step 3: short-stay factor selected from effective_los_days --------
      los_factor          = 0.35 if effective_los_days <= SHORT_STAY_MAX_DAYS else 1.00
      adjusted_base_cents = round_half_up(uplifted_base_cents * los_factor)

      # ---- step 4: transfer per-diem, keyed on the tier's average LOS --------
      transfer_applies = (chain.last.discharge_destination in TRANSFER_DESTINATIONS)
                         and (effective_los_days < AVG_LOS_DAYS[cmg_tier])
      if transfer_applies:
          per_diem_cents = round_half_up(adjusted_base_cents / AVG_LOS_DAYS[cmg_tier])
          transfer_cents = round_half_up(per_diem_cents * (effective_los_days + 0.5))
          gross_cents    = min(adjusted_base_cents, transfer_cents)
      else:
          gross_cents    = adjusted_base_cents

      # ---- step 5: QRP reduction from the SNAPSHOT, applied LAST -------------
      total_payment_cents = round_half_up(gross_cents
                              * (1 - head.qrp_penalty_pct_snapshot / 100))

      # The head carries the whole amount; every continuation keeps
      # total_payment_cents == 0 while payment_status == CONSOLIDATED.
      # EVALUATION ORDER IS PINNED (mode (c)): the penalty percentage is read from
      # the head's admit-time snapshot, never from Facility.active_qrp_penalty_pct
      # at pricing time — otherwise finalizing a QrpAssessment (whose own inputs
      # are the transmitted assessments of already-priced discharges) would feed
      # back into payments that produced it.
    input_set: "The whole interrupted-stay chain reachable through predecessor_admission_id, every member of which must be DISCHARGED before the head prices. cmg_tier and comorbidity uplift come from the HEAD's patient; the transfer test uses the LAST discharge destination in the chain."
    constants:
      CMG_TIER_BY_IGC: { "0008": "TIER_B", "0110": "TIER_C", "0704": "TIER_A", "1101": "TIER_A" }
      CMG_TIER_DEFAULT: "TIER_A"
      CMG_BASE_CENTS: { TIER_A: 1800000, TIER_B: 2450000, TIER_C: 3120000 }
      AVG_LOS_DAYS: { TIER_A: 9, TIER_B: 12, TIER_C: 15 }
      COMORBIDITY_UPLIFT: { NONE: 0.00, TIER_3: 0.03, TIER_2: 0.06, TIER_1: 0.12 }
      SHORT_STAY_MAX_DAYS: 3
      TRANSFER_DESTINATIONS: ["SNF", "ACUTE_CARE", "LTCH", "ANOTHER_IRF"]
      INTERRUPTION_MAX_GAP_DAYS: 3
    precision: "integer cents; round_half_up is applied at step 2, step 3, both step-4 lines and step 5 — never once at the end"

  - name: qrp_completeness_and_penalty
    trigger: "POST /qrp-assessments (creation) and POST /qrp-assessments/{qrpId}/finalize"
    algorithm: threshold
    formula: |
      cohort = [ Admission a where a.facility_id == qrp.facility_id
                                and a.stay_status == DISCHARGED
                                and qrp.reporting_period_start <= date(a.discharged_at)
                                                              <= qrp.reporting_period_end ]
      cohort_count = count(cohort)
      timely_count = count(a in cohort where exists PatientAssessmentInstrument p
                           with p.admission_id == a.id
                            and p.assessment_type == DISCHARGE
                            and p.status == TRANSMITTED)
      data_completeness_pct = 0.00 if cohort_count == 0
                              else round_half_up(timely_count * 100 / cohort_count, 2)
      penalty_pct = 0.00 if data_completeness_pct >= COMPLETENESS_THRESHOLD_PCT
                    else PENALTY_PCT
      # On finalize only: Facility.active_qrp_penalty_pct = penalty_pct and
      # Facility.qrp_penalty_effective_at = current clock. Admissions admitted
      # before that instant keep their own qrp_penalty_pct_snapshot.
    input_set: "Every DISCHARGED admission of the facility with a discharge date in the reporting period, including admissions discharged to EXPIRED (unlike compliance cohorts). Only DISCHARGE assessments in status TRANSMITTED count as timely; LATE_TRANSMITTED, MISSED, COMPLETED and DRAFT do not."
    constants:
      COMPLETENESS_THRESHOLD_PCT: 95.00
      PENALTY_PCT: 2.00
    precision: "data_completeness_pct 2 decimals round_half_up; the pass test is inclusive (>= 95.00)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: "For entity_backed roles, X-User-ID resolves to a Clinician whose credential matches the role (RehabPhysician->REHAB_PHYSICIAN, NurseCaseManager->NURSE, TherapyLead->THERAPIST_PT|THERAPIST_OT|THERAPIST_SLP, HimCoder->CODER)"
    error_id: ERR_ROLE_CREDENTIAL_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include an entity_backed role"

  - priority: 28
    category: auth
    check: "For entity_backed roles, Clinician(X-User-ID).status == ACTIVE"
    error_id: ERR_ACTING_CLINICIAN_INACTIVE
    http_status: 403
    applies_to: "all endpoints whose roles include an entity_backed role"

  - priority: 30
    category: business_constraint
    check: "Request shape: required body fields present, types/enums valid, timestamps ISO 8601 UTC, dates YYYY-MM-DD, end_at > start_at, period_end >= period_start, pagination limit in 1..100 and offset >= 0, discharged_at not in the future relative to the logical clock"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 32
    category: business_constraint
    check: "Session interval sanity: end_at strictly after start_at and raw_minutes >= 1"
    error_id: ERR_INVALID_SESSION_INTERVAL
    http_status: 400
    applies_to: "POST /therapy-sessions"

  - priority: 34
    category: business_constraint
    check: "modality/group_size coherence: INDIVIDUAL requires group_size == 1, CONCURRENT requires group_size == 2, GROUP requires 3 <= group_size <= 6"
    error_id: ERR_GROUP_SIZE_INVALID
    http_status: 400
    applies_to: "POST /therapy-sessions"

  - priority: 36
    category: business_temporal
    check: "period_start <= period_end on compliance reviews and QRP assessments, and review_period_start <= review_period_end on facilities"
    error_id: ERR_INVALID_PERIOD
    http_status: 400
    applies_to: "POST /facilities, POST /compliance-reviews, POST /qrp-assessments"

  - priority: 40
    category: existence
    check: "Every id in the path exists, validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 45
    category: existence
    check: "Every id in the request body (facility_id, patient_id, screening_id, admission_id, clinician_id, therapy_week_id, coder_clinician_id, led_by_clinician_id, participant_clinician_ids, predecessor_admission_id) exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with body ids"

  - priority: 50
    category: business_referential
    check: "Cross-entity coherence of body ids: screening.patient_id == patient_id on admission creation; predecessor.patient_id == patient_id on admit. Conference/week coherence is owned by priority 51 alone."
    error_id: ERR_SCREENING_PATIENT_MISMATCH
    http_status: 409
    applies_to: "POST /admissions, POST /admissions/{admissionId}/admit"

  - priority: 51
    category: business_referential
    check: "therapy_week_id supplied on a conference belongs to the same admission_id"
    error_id: ERR_WEEK_ADMISSION_MISMATCH
    http_status: 409
    applies_to: "POST /team-conferences"

  - priority: 52
    category: business_referential
    check: "Every referenced Clinician and Patient belongs to the same Facility as the target resource"
    error_id: ERR_CROSS_FACILITY_MISMATCH
    http_status: 409
    applies_to: "POST /screenings, POST /therapy-sessions, POST /team-conferences, POST /assessments, POST /plans-of-care"

  - priority: 55
    category: business_constraint
    check: "Segregation of duties: screening reviewer != conducted_by_clinician_id; assessment transmitter != coder_clinician_id; review certifier != created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /screenings/{screeningId}/review, POST /assessments/{assessmentId}/transmit, POST /compliance-reviews/{reviewId}/certify"

  - priority: 60
    category: state
    check: "OCC: expected_admission_version == Admission.version / expected_facility_version == Facility.version"
    error_id: ERR_STALE_ADMISSION_VERSION
    http_status: 412
    applies_to: "POST /plans-of-care, POST /compliance-reviews"

  - priority: 70
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 71
    category: state
    check: "Operations that record therapy or plan documents require Admission.stay_status == ADMITTED"
    error_id: ERR_ADMISSION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /plans-of-care, POST /therapy-weeks, POST /therapy-sessions, POST /therapy-sessions/{sessionId}/deliver, POST /team-conferences"

  - priority: 72
    category: state
    check: "Transmitting an assessment, and creating a DISCHARGE assessment, require Admission.stay_status == DISCHARGED"
    error_id: ERR_ADMISSION_NOT_DISCHARGED
    http_status: 409
    applies_to: "POST /assessments, POST /assessments/{assessmentId}/transmit"

  - priority: 73
    category: state
    check: "Granting a three-hour-rule exception requires TherapyWeek.status == NOT_MET"
    error_id: ERR_EXCEPTION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /therapy-weeks/{weekId}/exception"

  - priority: 74
    category: state
    check: "Rescinding an interruption requires interrupted_stay_flag == true"
    error_id: ERR_NOT_INTERRUPTED_STAY
    http_status: 409
    applies_to: "POST /admissions/{admissionId}/rescind-interruption"

  - priority: 75
    category: business_safety
    check: "Facility.posture must be OPEN or THRESHOLD_WATCH to admit"
    error_id: ERR_FACILITY_ADMISSION_FROZEN
    http_status: 403
    applies_to: "POST /admissions/{admissionId}/admit"

  - priority: 80
    category: business_safety
    check: "Screening must be PHYSICIAN_CONCURRED with reviewed_at <= admitted_at before an admission may be created or admitted"
    error_id: ERR_SCREENING_NOT_CONCURRED
    http_status: 422
    applies_to: "POST /admissions, POST /admissions/{admissionId}/admit"

  - priority: 81
    category: business_safety
    check: "admitted_at - screening.conducted_at <= 48 hours"
    error_id: ERR_SCREENING_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /admissions/{admissionId}/admit"

  - priority: 82
    category: business_safety
    check: "All four screening documentation flags are true before submission"
    error_id: ERR_SCREENING_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /screenings/{screeningId}/submit"

  - priority: 83
    category: business_safety
    check: "conducted_by_clinician_id has credential NURSE or REHAB_PHYSICIAN"
    error_id: ERR_SCREENER_CREDENTIAL_INVALID
    http_status: 422
    applies_to: "POST /screenings"

  - priority: 84
    category: business_safety
    check: "An OverallPlanOfCare with status ACTIVE exists for the admission before therapy weeks, therapy sessions or week evaluation"
    error_id: ERR_PLAN_OF_CARE_MISSING
    http_status: 422
    applies_to: "POST /therapy-weeks, POST /therapy-sessions, POST /therapy-weeks/{weekId}/evaluate"

  - priority: 85
    category: business_safety
    check: "Session discipline appears in the ACTIVE plan's disciplines"
    error_id: ERR_DISCIPLINE_NOT_IN_PLAN
    http_status: 422
    applies_to: "POST /therapy-sessions"

  - priority: 86
    category: business_safety
    check: "Treating clinician's credential matches the session discipline (THERAPIST_PT->PT, THERAPIST_OT->OT, THERAPIST_SLP->SLP)"
    error_id: ERR_CLINICIAN_DISCIPLINE_MISMATCH
    http_status: 422
    applies_to: "POST /therapy-sessions"

  - priority: 87
    category: business_safety
    check: "Conference lead has credential REHAB_PHYSICIAN"
    error_id: ERR_CONFERENCE_LEAD_NOT_PHYSICIAN
    http_status: 422
    applies_to: "POST /team-conferences"

  - priority: 88
    category: business_safety
    check: "Conference participants include at least one NURSE and at least one therapist matching every discipline in the ACTIVE plan"
    error_id: ERR_CONFERENCE_PARTICIPANTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /team-conferences"

  - priority: 89
    category: business_safety
    check: "item_set_complete == true when completing an assessment"
    error_id: ERR_PAI_ITEM_SET_INCOMPLETE
    http_status: 422
    applies_to: "POST /assessments/{assessmentId}/complete"

  - priority: 90
    category: business_temporal
    check: "Clinician double-booking: the new session's half-open interval [start_at, end_at) must not intersect any interval of another SCHEDULED or DELIVERED session of the same clinician_id. Exact adjacency (previous end_at == new start_at) is allowed."
    error_id: ERR_CLINICIAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /therapy-sessions"

  - priority: 91
    category: business_temporal
    check: "Patient rest buffer: for the same admission_id, the new session is rejected when new.start_at < other.end_at + 10 minutes and other.start_at < new.end_at + 10 minutes over SCHEDULED or DELIVERED sessions. Exactly 10 minutes of separation is allowed."
    error_id: ERR_PATIENT_REST_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /therapy-sessions"

  - priority: 92
    category: business_temporal
    check: "The session's start_at date falls inside exactly one OPEN, MET, NOT_MET or EXCEPTION_GRANTED TherapyWeek window of the admission (candidate set: weeks of that admission whose week_start_date <= date(start_at) <= week_end_date; tie-break created_at ASC; empty candidate set is the error)"
    error_id: ERR_NO_OPEN_THERAPY_WEEK
    http_status: 422
    applies_to: "POST /therapy-sessions"

  - priority: 93
    category: business_temporal
    check: "A new TherapyWeek's inclusive 7-day window must not overlap any existing week window of the same admission; windows that merely touch (previous week_end_date + 1 day == new week_start_date) are allowed"
    error_id: ERR_THERAPY_WEEK_OVERLAP
    http_status: 409
    applies_to: "POST /therapy-weeks"

  - priority: 94
    category: business_temporal
    check: "week_start_date >= date(Admission.admitted_at)"
    error_id: ERR_WEEK_BEFORE_ADMISSION
    http_status: 422
    applies_to: "POST /therapy-weeks"

  - priority: 95
    category: business_temporal
    check: "date(held_at) lies inside [week_start_date, week_end_date]"
    error_id: ERR_CONFERENCE_OUTSIDE_WEEK
    http_status: 409
    applies_to: "POST /team-conferences"

  - priority: 96
    category: business_constraint
    check: "At most one TeamConference with status RECORDED per therapy_week_id"
    error_id: ERR_CONFERENCE_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /team-conferences"

  - priority: 97
    category: business_constraint
    check: "week_index is unique per admission_id"
    error_id: ERR_WEEK_INDEX_DUPLICATE
    http_status: 409
    applies_to: "POST /therapy-weeks"

  - priority: 98
    category: business_constraint
    check: "cms_ccn unique across facilities; npi unique across clinicians; mrn unique per facility_id"
    error_id: ERR_MRN_DUPLICATE
    http_status: 409
    applies_to: "POST /patients, POST /clinicians"

  - priority: 99
    category: business_constraint
    check: "cms_ccn unique across facilities"
    error_id: ERR_CCN_DUPLICATE
    http_status: 409
    applies_to: "POST /facilities"

  - priority: 100
    category: business_constraint
    check: "At most one PatientAssessmentInstrument per (admission_id, assessment_type) that is not MISSED"
    error_id: ERR_ASSESSMENT_TYPE_DUPLICATE
    http_status: 409
    applies_to: "POST /assessments"

  - priority: 110
    category: business_fiscal
    check: "Interrupted-stay linkage: the named predecessor must be DISCHARGED and 0 <= gap_days <= 3, where gap_days = date(admitted_at) - date(predecessor.discharged_at). Duplicate continuations are owned by priority 111 alone."
    error_id: ERR_INTERRUPTION_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /admissions/{admissionId}/admit"

  - priority: 111
    category: business_fiscal
    check: "predecessor_admission_id must not already be named by another admission"
    error_id: ERR_PREDECESSOR_ALREADY_CONTINUED
    http_status: 409
    applies_to: "POST /admissions/{admissionId}/admit"

  - priority: 112
    category: business_fiscal
    check: "When predecessor_admission_id is omitted, no DISCHARGED admission of the same patient may have a discharge date within 3 calendar days before date(admitted_at)"
    error_id: ERR_INTERRUPTED_STAY_LINK_REQUIRED
    http_status: 422
    applies_to: "POST /admissions/{admissionId}/admit"

  - priority: 120
    category: business_fiscal
    check: "Daily therapy cap: credited minutes already booked for the admission on session_date (SCHEDULED plus DELIVERED) plus the new session's credited_minutes must not exceed Facility.daily_therapy_cap_minutes"
    error_id: ERR_DAILY_THERAPY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /therapy-sessions"

  - priority: 130
    category: business_fiscal
    check: "Compliance cohort must be non-empty before compute"
    error_id: ERR_EMPTY_COMPLIANCE_COHORT
    http_status: 422
    applies_to: "POST /compliance-reviews/{reviewId}/compute"

  - priority: 131
    category: business_fiscal
    check: "No cohort member may have payment_status == REOPENED at certification"
    error_id: ERR_COHORT_PAYMENT_UNSETTLED
    http_status: 422
    applies_to: "POST /compliance-reviews/{reviewId}/certify"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Facility ----
  - method: POST
    path: "/facilities"
    description: "Register an inpatient rehabilitation facility with its compliance review period and thresholds"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, cms_ccn, review_period_start, review_period_end, "compliance_threshold_pct?", "daily_therapy_cap_minutes?"]
    output: Facility
    side_effects:
      - "posture = OPEN; cohort counts 0; provisional_compliance_pct = 0.00; certified_compliance_pct = null; settled_payment_cents = 0; active_qrp_penalty_pct = 0.00; version = 1"

  - method: GET
    path: "/facilities/{facilityId}"
    description: "Read a facility with its derived compliance posture and percentages"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ------------------------------------------------------------ Clinician ----
  - method: POST
    path: "/clinicians"
    description: "Register a clinician at a facility"
    roles: [ComplianceOfficer]
    code: 201
    input: [facility_id, full_name, credential, npi]
    output: Clinician
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/clinicians/{clinicianId}"
    description: "Read one clinician"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: GET
    path: "/clinicians"
    description: "List clinicians, filterable by employing facility, credential and status"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["facility_id?", "credential?", "status?", "limit?", "offset?"]
    output: Clinician[]
    side_effects: []

  - method: POST
    path: "/clinicians/{clinicianId}/deactivate"
