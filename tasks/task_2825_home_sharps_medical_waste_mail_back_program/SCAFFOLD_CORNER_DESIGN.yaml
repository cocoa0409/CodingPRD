      - name: destruction_stage_refusals_cover_ordering_duties_reconciliation_and_replay
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DELIVERY_REQUIRED_BEFORE_DESTRUCTION]
          - errors[ERR_SHIPMENT_ALREADY_SCREENED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
