        distinguishing_aspect: |
          Metric under test is cars_per_hour_effective landing EXACTLY on a band edge: two cars in
          the 600-second trailing window give exactly 12.0, which must select TIER_3 (floor 12
          inclusive) and not TIER_2 (ceiling 12 exclusive). Endpoint is POST .../depart.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands (TIER_2 = [6, 12), TIER_3 = [12, 18)); one SINGLE-lane Restaurant with labor_minutes_budget 300; one StaffMember; one ACTIVE LUNCH DaypartProfile (25/95/40/75)."
