      - name: background_limit_ignores_draft_out_of_window_and_other_parameter_rows
        claim_type: input_set_filtering
        grounds:
          - calculations.background_statistical_limit
          - calculations.statistical_verdict
          - entities.StatisticalEvaluation.fields.background_n
          - entities.SamplingEvent.fields.status
        distinguishing_aspect: |
          Three decoy sulfate results of 9.9000 mg/L sit in the database: one on an event that was never
          validated, one on a VALIDATED event sampled outside the closed background window, and one
          recorded under a different parameter_code. All three must be filtered out, so background_n stays
          4 and the INTERWELL limit stays 0.6961. Any single leaked decoy pushes background_n to 5 and the
