      - name: error_bsa_referral_required_on_case_close
        claim_type: Violation to Error
        grounds: ["errors[ERR_BSA_REFERRAL_REQUIRED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / case_close_preservation_hold_outranks_bsa_referral_requirement
          rationale: "Asserted as the second close attempt's error once the preservation hold is lifted."
      - name: error_account_not_active_on_deposit
        claim_type: Violation to Error
        grounds: ["errors[ERR_ACCOUNT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / deposit_item_creation_gated_by_deposit_account_lifecycle_status
