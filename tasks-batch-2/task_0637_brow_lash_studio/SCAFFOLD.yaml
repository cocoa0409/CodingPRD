    output: "MembershipPlan[]"
    side_effects: []

  - method: GET
    path: "/membership-plans/{id}"
    description: "Get a MembershipPlan"
    roles: [StudioManager, FrontDesk, LashTech, Member]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []

  # ---- LashTech (FK studio_id) ----
  - method: POST
    path: "/lash-techs"
    description: "Create a LashTech"
    roles: [StudioManager]
    code: 201
    input: [studio_id, full_name, skill_level, station_number]
    output: LashTech
    side_effects: ["status=AVAILABLE; station_sanitized_through_utc=null"]

  - method: GET
    path: "/lash-techs"
