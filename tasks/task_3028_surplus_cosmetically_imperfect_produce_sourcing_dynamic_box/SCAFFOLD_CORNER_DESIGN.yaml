        as: PlatformAdmin
        captures:
          lg_lv2: $.data.version
      - call: POST /produce/supply-lots/${lg_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${lg_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: lg@example.com
          full_name: Sub Lg
          service_region: SO
        as: Anonymous
        captures:
          lg_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${lg_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          lg_sub: $.data.id
          lg_subv: $.data.version
      - call: POST /produce/fulfillment-centers
        payload:
          code: LGF-NE
          name: Ne Center
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: lh@example.com
          full_name: Sub Lh
          service_region: NE
        as: Anonymous
        captures:
          lh_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${lh_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          lh_sub: $.data.id
          lh_subv: $.data.version
      trigger:
      - call: GET /produce/customers?service_region=SO
        as: PlatformAdmin
      assert:
      - the read returns 200 and response_type array
      - GET /produce/customers?service_region=SO returns exactly 1 row, the lg customer
      - GET /produce/customers?home_fulfillment_center_id=${lg_c} returns exactly 1 row
      - GET /produce/customers?service_region=WE returns exactly 0 rows with total_count 0 and has_more false
  - name: sourcing_bid_list_filters_by_status_and_lot
    claim_type: Listing
    grounds:
    - endpoints.GET_/produce/sourcing-bids
    - entities.SourcingBid.fields.status
    distinguishing_aspect: The bid collection filters on both status and supply_lot_id, and a lot with a withdrawn bid returns one row under status WITHDRAWN and none under status PENDING.
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. One center, one supplier, one lot with two bids, one of which is withdrawn.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          bl_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co BL
          region: NE
        as: PlatformAdmin
        captures:
          bl_s: $.data.id
      - call: POST /produce/suppliers/${bl_s}/lots
        payload:
          fulfillment_center_id: ${bl_c}
          product_name: BL1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          bl_l: $.data.id
          bl_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${bl_l}
          supplier_id: ${bl_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${bl_s}
      - call: POST /produce/supply-lots/${bl_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${bl_lv}
        as: PlatformAdmin
        captures:
          bl_lv2: $.data.version
      - call: POST /produce/supply-lots/${bl_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${bl_lv2}
        as: PlatformAdmin
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${bl_l}
          supplier_id: ${bl_s}
          bid_unit_cost_cents: 150
          quantity_offered: 100
        as: Supplier
        as_user_id: ${bl_s}
        captures:
          bl_b2: $.data.id
      - call: POST /produce/sourcing-bids/${bl_b2}/withdraw
        payload: {}
        as: Supplier
        as_user_id: ${bl_s}
      trigger:
      - call: GET /produce/sourcing-bids?supply_lot_id=${bl_l}&status=WITHDRAWN
        as: PlatformAdmin
      assert:
      - the read returns 200 and response_type array
      - GET /produce/sourcing-bids?supply_lot_id=${bl_l}&status=WITHDRAWN returns exactly 1 row
      - GET /produce/sourcing-bids?supply_lot_id=${bl_l}&status=SELECTED returns exactly 0 rows
      - GET /produce/sourcing-bids?supplier_id=${bl_s} returns exactly 2 rows
  - name: box_order_items_list_filters_by_line_status
    claim_type: Listing
    grounds:
    - endpoints.GET_/produce/box-orders/{id}/items
    excluded_because:
      difficulty_instance: line_plan_exactly_at_the_target_keeps_the_last_line_included
      rationale: That instance asserts both the INCLUDED and the REMOVED item filters on the same endpoint.
  - name: box_order_read_returns_the_billing_weight_computed_fields
    claim_type: Computed Fields
    grounds:
    - entities.BoxOrder.fields.weight_total_grams
    - entities.BoxOrder.fields.lines_total_cents
    excluded_because:
      difficulty_instance: billing_weight_rounding_order_reversal
      rationale: That instance asserts weight_total_grams, billed_unit_weight_grams and lines_total_cents on the same read.
  - name: cold_chain_pack_read_returns_the_selected_cooling
    claim_type: Retrieval
    grounds:
    - entities.ColdChainPack
    - endpoints.GET_/produce/box-orders/{id}/cold-chain-packs
    excluded_because:
      difficulty_instance: cold_chain_selection_transit_mandated_heavy_grade
      rationale: That instance reads the created ColdChainPack and asserts its grade, coolant, transit and cold weight.
  - name: active_center_filter_excludes_inactive_centers
    claim_type: Listing
    grounds:
    - endpoints.GET_/produce/fulfillment-centers
    - entities.FulfillmentCenter.fields.is_active
    excluded_because:
      difficulty_instance: box_pricing_provisional_line_major_vs_final_box_major
      rationale: The region candidate set in that instance is produced by the is_active filter, and the region listing is read there.
  - name: supply_lot_status_transitions_are_linear_and_terminal_at_the_end
    claim_type: Immutability
    grounds:
    - state_machines.SupplyLot.status
    - entities.SupplyLot.fields.status
    excluded_because:
      difficulty_instance: quality_investigation_cascade_lot_expiry_to_supplier_score
      rationale: That instance asserts the EXPIRED terminal on two sibling lots and the AWARDED-to-READY progression on the cited lot.
- section: state_machines
  instances:
  - name: center_forward_posture_never_loops_back_from_constrained_without_a_cycle_close
    claim_type: cyclic
    grounds:
    - state_machines.FulfillmentCenter.CONSTRAINED_to_OPEN
    - state_machines.FulfillmentCenter.DEGRADED_to_CONSTRAINED
    excluded_because:
      difficulty_instance: maintenance_interval_blocks_the_center_between_two_helped_windows
      rationale: That instance asserts the OPEN to CONSTRAINED edge, the lock it produces, and the CONSTRAINED to OPEN return via advance-cycle.
  - name: box_order_pricing_axis_moves_independently_of_the_fulfillment_axis
    claim_type: parallel
    grounds:
    - state_machines.BoxOrder
    - state_machines.BoxOrder.UNPRICED_to_PRICED
    - state_machines.BoxOrder.PRICED_to_REVISED
    excluded_because:
      difficulty_instance: box_pricing_provisional_line_major_vs_final_box_major
      rationale: That instance asserts pricing_status PRICED and REVISED while BoxOrder.status separately reaches BUILDING on the same rows.
  - name: rerouted_order_stays_buildable_once_the_center_recovers
    claim_type: guarded transitions
    grounds:
    - state_machines.BoxOrder.REROUTED_to_READY_TO_BUILD
    - state_machines.BoxOrder.READY_TO_BUILD_to_REROUTED
    excluded_because:
      difficulty_instance: box_order_rerouted_revert_cycle_carries_no_build_work_finished
      rationale: That instance asserts the REROUTED to DRAFT edge of the same cycle and the empty build state that guards it.
  - name: sourcing_bid_withdraw_from_selected_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.SourcingBid
    - errors.ERR_INVALID_STATE
    - validations[priority=5]
    distinguishing_aspect: SourcingBid is terminal at SELECTED, so a withdraw from that state is a 409 ERR_INVALID_STATE and the row keeps its status and version.
    test_recipe:
      setup:
      - One center, one supplier and one lot with a single bid, awarded so the bid joins to SELECTED.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          sw_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co SW
          region: NE
        as: PlatformAdmin
        captures:
          sw_s: $.data.id
      - call: POST /produce/suppliers/${sw_s}/lots
        payload:
          fulfillment_center_id: ${sw_c}
          product_name: SW1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          sw_l: $.data.id
          sw_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${sw_l}
          supplier_id: ${sw_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${sw_s}
      - call: POST /produce/supply-lots/${sw_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${sw_lv}
        as: PlatformAdmin
        captures:
          sw_lv2: $.data.version
      - call: POST /produce/supply-lots/${sw_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${sw_lv2}
        as: PlatformAdmin
      trigger:
      - call: POST /produce/sourcing-bids/${sw_l}/withdraw
        payload: {}
        as: Supplier
        as_user_id: ${sw_s}
        captures:
          sw_err: $.data.error_id
      assert:
      - the withdraw returns 409 and sw_err == ERR_INVALID_STATE
      - GET /produce/sourcing-bids?supply_lot_id=${sw_l}&status=SELECTED returns exactly 1 row
      - GET /produce/sourcing-bids?supply_lot_id=${sw_l}&status=WITHDRAWN returns exactly 0 rows
