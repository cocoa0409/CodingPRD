        distinguishing_aspect: "4500 points violates both min_transfer_points 5000 and transfer_increment_points 1000, and priority 65 wins with ERR_BELOW_MIN_TRANSFER; 5500 clears the minimum but not the increment and returns ERR_TRANSFER_INCREMENT_INVALID; exactly 5000 is admitted, and the rejected attempts left Account.version untouched so the same expected_account_version still works."
        test_recipe:
          setup:
            - "One CORE account holding 10000 points and one ACTIVE agreement with min_transfer_points 5000 and transfer_increment_points 1000."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
