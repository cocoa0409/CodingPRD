              payload: { plan_code: "VSP-BASIC", frame_allowance_cents: 5000, lens_base_allowance_cents: 9000, coating_allowance_cents: 8000, progressive_copay_cents: 3000, coinsurance_pct: 0.00, annual_benefit_cap_cents: 100000, expedite_covered: false, specialty_requires_prior_auth: false }
