              as: QueueAdministrator
              captures: { p3_share: "$.data[0].allocated_cents" }
          assert:
            - "Before withdrawal the shares summed to 1200000 (300000 + 400000 + 500000)"
            - "${p1_share} == 500000 and ${p2_share} == 700000 (FINAL recompute over {10, 20} MW)"
            - "${p3_share} == 0 (withdrawn member zeroed)"
            - "${p1_share} + ${p2_share} + ${p3_share} == 1200000 — total cents conserved across the withdrawal + reallocation pair"
