              payload: { complainant_ref: "CU-E4", channel_code: "WEB", product_code: "P-E4", category_code: "C.E4", narrative: "default clock" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          assert:
            - "Complaint.${cid}.received_at == 2026-08-01T00:00:00Z"

