        claim_type: correct_result
        grounds:
          - calculations.duty_hour_violation_detection
        distinguishing_aspect: "REST_8H threshold precision: an exactly 8.00h gap (08:00 end -> 16:00 start) is compliant; a 7h59m gap (measured 7.98) violates. Boundary sits between two attests of the same resident."
        test_recipe:
          setup: ["Program, ACTIVE year, APPROVED complement, ACTIVE resident"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1022" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
