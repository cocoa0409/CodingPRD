# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Historic House Museum Docent & Tour Program
# =============================================================================
# All chains assume an empty DB and the logical clock at its startup default
# 2026-08-01T00:00:00Z unless a call explicitly sets it.

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: slot_revenue_projection_variants
        grounds:
          - calculations.slot_revenue_projection
          - entities.TourSlot.fields.revenue_committed_cents
          - entities.TourSlot.fields.revenue_projected_cents
        distinguishing_aspect: |
          On the TourSlot/Booking domain, the committed_only variant counts only
          CONFIRMED booking totals (2000) while the forward_looking variant adds
          RESERVED totals discounted by 0.8 (4400) — identical data, two numbers.
        test_recipe:
          setup:
            - "OPEN slot ${slot1} on a STANDARD route (base 1000, capacity 18) with one CONFIRMED booking of party 2 (total 2000) and one RESERVED booking of party 3 (total 3000)"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Welcome to the house", curriculum_standards: ["HIST-5"] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90, reviewer_notes: "accurate" }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 2 }, as: FrontDeskStaff, captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/confirm", payload: { paid_cents: 2000 }, as: FrontDeskStaff }
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Bob", party_size: 3 }, as: FrontDeskStaff }
          trigger:
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { committed: $.data.revenue_committed_cents, projected: $.data.revenue_projected_cents } }
          assert:
            - "TourSlot.${slot1}.revenue_committed_cents == 2000"
            - "TourSlot.${slot1}.revenue_projected_cents == 4400  (2000 + round_half_up(3000 * 0.8))"
            - "revenue_committed_cents != revenue_projected_cents for the same slot data"

      - name: docent_readiness_track_variants
        grounds:
          - calculations.docent_readiness_score
          - entities.Docent.fields.readiness_standard_score
          - entities.Docent.fields.readiness_apprentice_score
        distinguishing_aspect: |
          On the Docent domain, the same training record scored under
          standard-track weights (0.3/0.3/0.4) yields 81 while apprentice-track
          weights (0.5/0.4/0.1) yield 76 — identical inputs, two numbers; a
          different entity domain than slot_revenue_projection_variants.
        test_recipe:
          setup:
            - "Docent ${d1} in TRAINEE status with training_hours=21, shadow_tours_completed=4, quiz_score=90"
          setup_api_calls:
            - { call: "POST /docents", payload: { full_name: "Sam Guide", email: "sam@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 21 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
          trigger:
            - { call: "GET /docents/${d1}", payload: {}, as: DocentCoordinator, captures: { std: $.data.readiness_standard_score, app: $.data.readiness_apprentice_score } }
          assert:
            - "Docent.${d1}.readiness_standard_score == 81   (0.3*21/30 + 0.3*4/5 + 0.4*90/100 = 0.81)"
            - "Docent.${d1}.readiness_apprentice_score == 76 (0.5*21/30 + 0.4*4/5 + 0.1*90/100 = 0.76)"
            - "readiness_standard_score != readiness_apprentice_score for identical training fields"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: slot_capacity_min_rooms_kind_buffer
        grounds:
          - calculations.slot_capacity
          - entities.TourSlot.fields.capacity
        distinguishing_aspect: |
          Mode (a): capacity = max(1, min over 3 room capacities (20,12,30) minus
          a kind-conditional buffer) — >=3 inputs with nested min/max and a
          conditional branch on route.kind; CANDLELIGHT buffer 4 yields 8 where
          STANDARD buffer 2 would yield 10 and the raw min is 12.
        test_recipe:
          setup:
            - "Rooms ${ra} cap 20 STANDARD, ${rb} cap 12 HIGH_VALUE, ${rc} cap 30 STANDARD; CANDLELIGHT route over all three rooms, ACTIVE"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Hall", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { ra: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Silver Closet", floor: 1, capacity_max: 12, safety_max_party: 10, collection_tier: "HIGH_VALUE" }, as: MuseumAdmin, captures: { rb: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Ballroom", floor: 2, capacity_max: 30, safety_max_party: 20, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { rc: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Candlelight Full House", kind: "CANDLELIGHT", room_ids: ["${ra}", "${rb}", "${rc}"], duration_minutes: 90, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
          trigger:
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T19:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id, cap: $.data.capacity } }
          assert:
            - "TourSlot.${slot1}.capacity == 8   (min(20,12,30) - CANDLELIGHT buffer 4)"
            - "capacity != 12 (raw min) and != 10 (STANDARD buffer 2 would give) — kind branch matters"

      - name: candlelight_price_round_per_person_then_multiply
        grounds:
          - calculations.booking_total_price_cents
          - entities.Booking.fields.unit_price_cents
          - entities.Booking.fields.total_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round_half_up per-person
          unit FIRST (round_half_up(1055*1.5)=1583), then multiply by headcount
          (4749); 'multiply then round' would give 4748. Different mode than
          slot_capacity_min_rooms_kind_buffer (a).
        test_recipe:
          setup:
            - "OPEN CANDLELIGHT slot ${slot1} on route base_price_cents=1055 (capacity 16), staffed by certified docent ${d1}"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Candlelight", kind: "CANDLELIGHT", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1055 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "By candlelight", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 88 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T19:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
          trigger:
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Kai", party_size: 3 }, as: FrontDeskStaff, captures: { bk1: $.data.id, unit: $.data.unit_price_cents, total: $.data.total_price_cents } }
          assert:
            - "Booking.${bk1}.unit_price_cents == 1583   (round_half_up(1055 * 1.5) per person, FIRST)"
            - "Booking.${bk1}.total_price_cents == 4749  (1583 * 3, multiply SECOND)"
            - "total != 4748 which the multiply-then-round order would produce (round_half_up(3165 * 1.5))"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: script_version_revision_cycle
        grounds:
          - state_machines.ScriptVersion.DRAFT_to_IN_REVIEW
          - state_machines.ScriptVersion.IN_REVIEW_to_DRAFT
          - state_machines.ScriptVersion.IN_REVIEW_to_APPROVED
          - state_machines.ScriptVersion.APPROVED_to_PUBLISHED
        distinguishing_aspect: |
          Cyclic machine on ScriptVersion: IN_REVIEW -> DRAFT revision loop is
          traversed and the entity re-enters DRAFT before proceeding to
          APPROVED -> PUBLISHED; version_no stays 1 across the loop.
        test_recipe:
          setup:
            - "Room ${r1} and DRAFT route ${route1}; no script yet"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
          trigger:
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Draft one", curriculum_standards: ["HIST-5"] }, as: Curator, captures: { s1: $.data.id, st0: $.data.status, vno0: $.data.version_no } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator, captures: { st1: $.data.status } }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "REQUEST_REVISION", reviewer_notes: "verify dates" }, as: Curator, captures: { st2: $.data.status, vno2: $.data.version_no } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator, captures: { st3: $.data.status } }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 92, reviewer_notes: "accurate" }, as: Curator, captures: { st4: $.data.status } }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin, captures: { st5: $.data.status } }
          assert:
            - "st0 == DRAFT (initial state)"
            - "st2 == DRAFT after REQUEST_REVISION — the machine re-entered DRAFT (cycle)"
            - "vno2 == 1 — revision loop does not mint a new version_no"
            - "st5 == PUBLISHED and TourRoute.${route1}.published_script_id == ${s1}"

      - name: slot_full_open_cycle
        grounds:
          - state_machines.TourSlot.OPEN_to_FULL
          - state_machines.TourSlot.FULL_to_OPEN
        distinguishing_aspect: |
          Cyclic machine on TourSlot (different entity than ScriptVersion):
          OPEN -> FULL when the last seat is reserved, then FULL -> OPEN again
          when the reservation is cancelled.
        test_recipe:
          setup:
            - "OPEN slot ${slot1} with capacity 3 (room cap 5 minus STANDARD buffer 2), staffed"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Nursery", floor: 2, capacity_max: 5, safety_max_party: 4, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Upstairs", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Upstairs script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id, cap: $.data.capacity } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
          trigger:
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Trio", party_size: 3 }, as: FrontDeskStaff, captures: { bk1: $.data.id } }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { st_full: $.data.status, avail_full: $.data.seats_available } }
            - { call: "POST /bookings/${bk1}/cancel", payload: {}, as: FrontDeskStaff }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { st_open: $.data.status, avail_open: $.data.seats_available } }
          assert:
            - "cap == 3"
            - "st_full == FULL and avail_full == 0 after the last-seat reservation"
            - "st_open == OPEN and avail_open == 3 after cancellation — slot cycled FULL -> OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: critical_incident_cascade
        grounds:
          - state_machines.Room.OPEN_to_CLOSED_RESTORATION
          - state_machines.TourSlot.OPEN_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.ShiftAssignment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by incident creation: CRITICAL SafetyIncident
          closes the Room (hop 1); room closure cancels every future
          SCHEDULED/OPEN/FULL TourSlot whose route contains it (hop 2); each
          slot cancellation cancels its bookings with a 100% refund that
          bypasses the time tiers (hop 3) and its shift assignments.
        test_recipe:
          setup:
            - "OPEN slot ${slot1} starting 2026-08-02T10:00:00Z (34h after the default clock) with CONFIRMED booking ${bk1} (paid 2000) and CONFIRMED LEAD shift ${sh1}"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-08-02T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 2 }, as: FrontDeskStaff, captures: { bk1: $.data.id } }
            - { call: "POST /bookings/${bk1}/confirm", payload: { paid_cents: 2000 }, as: FrontDeskStaff }
          trigger:
            - { call: "POST /safety-incidents", payload: { room_id: "${r1}", severity: "CRITICAL", description: "Water leak over the parquet" }, as: Curator, captures: { inc1: $.data.id } }
            - { call: "GET /rooms/${r1}", payload: {}, as: MuseumAdmin, captures: { room_st: $.data.status } }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { slot_st: $.data.status } }
            - { call: "GET /bookings/${bk1}", payload: {}, as: FrontDeskStaff, captures: { bk_st: $.data.status, bk_refund: $.data.refund_cents } }
            - { call: "GET /docents/${d1}/shifts", payload: {}, as: DocentCoordinator, captures: { sh_st: "$.data[0].status" } }
          assert:
            - "Room.${r1}.status == CLOSED_RESTORATION (hop 1)"
            - "TourSlot.${slot1}.status == CANCELLED (hop 2)"
