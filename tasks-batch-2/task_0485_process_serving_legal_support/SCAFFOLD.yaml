  - method: POST
    path: "/skip-traces/{id}/state"
    description: "Transition a SkipTrace (IN_PROGRESS/LOCATED/NOT_LOCATED)"
    roles: [Server]
    code: 200
    input: [to_status, "located_address?"]
    output: SkipTrace
    side_effects: ["On LOCATED: set located_address; update ServiceRequest.service_address"]

  # ---- Affidavit ----
  - method: GET
    path: "/affidavits/{id}"
    description: "Get an Affidavit"
    roles: [Admin, Dispatcher, Client, Server, Notary]
    code: 200
    input: []
    output: Affidavit
    side_effects: []

  - method: GET
    path: "/service-requests/{id}/affidavits"
    description: "List Affidavits for a request (reverse-reachability for Affidavit.service_request_id and Affidavit.service_id)"
    roles: [Admin, Dispatcher, Client, Server, Notary]
    code: 200
    input: ["service_id?"]
    output: Affidavit[]
    side_effects: []

  - method: GET
    path: "/affidavits"
    description: "List Affidavits; filter by declarant_server_id or service_id (reverse-reachability for Affidavit.declarant_server_id and Affidavit.service_id)"
    roles: [Admin, Dispatcher, Notary, Server]
    code: 200
    input: ["declarant_server_id?", "service_id?", "limit?", "offset?"]
    output: Affidavit[]
    side_effects: []

  - method: POST
    path: "/affidavits/{id}/sign"
    description: "Declarant Server signs the affidavit (DRAFT->SIGNED)"
    roles: [Server]
    code: 200
    input: []
    output: Affidavit
    side_effects: []

  - method: POST
    path: "/affidavits/{id}/notarize"
    description: "Notary notarizes the affidavit (SIGNED->NOTARIZED); declarant cannot notarize own affidavit"
    roles: [Notary]
    code: 200
    input: []
    output: Affidavit
    side_effects: ["Set notary_user_id"]

  # ---- Filing ----
  - method: POST
    path: "/service-requests/{id}/filings"
    description: "Create a Filing (PENDING) for a SERVED request's affidavit"
    roles: [Dispatcher]
    code: 201
    input: [affidavit_id, window_start_utc, window_end_utc]
    output: Filing
    side_effects: ["status=PENDING; county_id copied from request"]

  - method: GET
    path: "/service-requests/{id}/filings"
    description: "List Filings for a request (reverse-reachability for Filing.service_request_id and Filing.affidavit_id)"
    roles: [Admin, Dispatcher, Client]
    code: 200
    input: ["affidavit_id?"]
    output: Filing[]
    side_effects: []

  - method: GET
    path: "/filings"
    description: "List Filings; filter by county_id or affidavit_id (reverse-reachability for Filing.county_id and Filing.affidavit_id)"
    roles: [Admin, Dispatcher]
    code: 200
    input: ["county_id?", "affidavit_id?", "status?", "limit?", "offset?"]
    output: Filing[]
    side_effects: []

  - method: GET
    path: "/filings/{id}"
    description: "Get a Filing"
    roles: [Admin, Dispatcher]
    code: 200
    input: []
    output: Filing
    side_effects: []

  - method: POST
    path: "/filings/{id}/state"
    description: "Transition a Filing (SUBMITTED/ACCEPTED/REJECTED/resubmit). Enforces affidavit-notarized, e-file enabled, window capacity."
    roles: [Dispatcher]
    code: 200
    input: [to_status]
    output: Filing
    side_effects: ["On SUBMITTED: FILING line; on ACCEPTED: request SERVED->FILED, affidavit->FILED; on REJECTED: void FILING line"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation, or ownership mismatch (server acting on another server's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist or wrong scope" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, page_count<1, non-numeric lat/lng" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_service_request_version != current ServiceRequest.version on assignment offer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "Suspended client cannot submit a request" }
  - { id: ERR_NO_DOCUMENT, http: 409, condition: "Submit attempted with no Document attached" }
  - { id: ERR_SERVER_SUSPENDED, http: 409, condition: "Suspended server cannot accept an offer or log attempts" }
  - { id: ERR_SERVER_AT_CAPACITY, http: 409, condition: "Server already at max_active_assignments" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "Attempt/service logged against a non-ACTIVE assignment" }
  - { id: ERR_ASSIGNMENT_SUPERSEDED, http: 409, condition: "Accept attempted on a superseded assignment offer" }
  - { id: ERR_OUTSIDE_TERRITORY, http: 409, condition: "Offered server does not cover the request's county" }
  - { id: ERR_NO_CONTACT_ATTEMPT, http: 409, condition: "PERSONAL service recorded without a latest CONTACT_MADE attempt" }
  - { id: ERR_DILIGENCE_NOT_MET, http: 409, condition: "Substitute/posting service or non-est before distinct_attempt_days >= county.min_diligent_attempts" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Rush request served after deadline_utc" }
  - { id: ERR_STAKEOUT_OVERLAP, http: 409, condition: "Stakeout window overlaps another non-CANCELLED stakeout for the same server" }
  - { id: ERR_AFFIDAVIT_NOT_NOTARIZED, http: 409, condition: "Filing submitted/resubmitted before its affidavit is NOTARIZED" }
  - { id: ERR_SEGREGATION_VIOLATION, http: 409, condition: "Declarant server attempted to notarize own affidavit" }
  - { id: ERR_EFILE_NOT_ENABLED, http: 409, condition: "Filing submitted to a county with e_file_enabled=false" }
  - { id: ERR_FILING_WINDOW_FULL, http: 409, condition: "Filing window overlaps >= max_concurrent_filings other SUBMITTED windows in the county" }
  - { id: ERR_NO_CANDIDATE_ADDRESS, http: 409, condition: "Skip-trace LOCATED with empty candidate_addresses" }
  - { id: ERR_ADDRESS_NOT_CANDIDATE, http: 409, condition: "Skip-trace located_address not a member of candidate_addresses" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "Client prepaid_balance_cents < final_fee_cents at completion" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Platform operator: configures counties, servers, clients, clock; superset of operational reads."
    identity: opaque
    exclusive_operations:
      - "POST /counties — create county config"
      - "POST /servers/{id}/state — suspend/reactivate server"
      - "POST /clients/{id}/state — suspend/reactivate client"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /clients, POST /clients/{id}/deposits, POST /servers, POST /servers/{id}/territories"
      - "All GET reads"

  - name: Dispatcher
    description: "Agency dispatcher: creates requests on behalf of clients, offers assignments, orders skip-traces, manages filings, finalizes."
    identity: opaque
    exclusive_operations:
      - "POST /service-requests/{id}/assignments — offer to a server (OCC)"
      - "POST /service-requests/{id}/reassign — pull assignment"
      - "POST /service-requests/{id}/skip-traces — order skip-trace"
      - "POST /service-requests/{id}/cancel — cancel request"
      - "POST /service-requests/{id}/complete — finalize & bill"
      - "POST /service-requests/{id}/filings, POST /filings/{id}/state — manage filings"
    shared_operations:
      - "POST /clients, POST /servers, POST /servers/{id}/territories, POST /clients/{id}/deposits"
      - "POST /service-requests, POST /service-requests/{id}/documents, POST /service-requests/{id}/submit"
      - "All GET reads"

  - name: Client
    description: "Requesting law firm; owns its ServiceRequests (X-User-ID == Client.id)."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /service-requests — create own request"
      - "POST /service-requests/{id}/documents — attach document to own request"
      - "POST /service-requests/{id}/submit — submit own request"
      - "GET own clients/{id}, service-requests, documents, assignments, services, affidavits, filings, invoice-lines"

  - name: Server
    description: "Process server; owns Assignments where server_id == X-User-ID; logs attempts, records service, runs skip-traces, schedules stakeouts, signs affidavits."
    identity: "entity_backed:Server"
    exclusive_operations:
      - "POST /assignments/{id}/accept — accept own offer"
      - "POST /assignments/{id}/state — decline own offer"
      - "POST /assignments/{id}/attempts — log attempt on own assignment"
      - "POST /assignments/{id}/stakeouts, POST /stakeouts/{id}/state — own stakeouts"
      - "POST /service-requests/{id}/services — record service on own assignment"
      - "POST /service-requests/{id}/non-est — declare non-est on own assignment"
      - "POST /skip-traces/{id}/state — progress a skip-trace"
      - "POST /affidavits/{id}/sign — sign own affidavit (declarant)"
    shared_operations:
      - "GET servers, counties, assignments, attempts, services, skip-traces, stakeouts, affidavits"

  - name: Notary
    description: "Independent notary; notarizes affidavits. Cannot be the declarant server (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /affidavits/{id}/notarize — notarize a SIGNED affidavit"
    shared_operations:
      - "GET affidavits"
