            - "Watercraft MT-7001 already carries ONE strike from an earlier REFUSED record, so compliance_strikes is 1, watchlist_status CLEAR and mandatory_decon_flag false."
            - "A second InspectionRecord screened at risk_score 80 (EXTREME, quarantine_warranted true), dispositioned DECON, with a QuarantineOrder that has already had ONE release rejected: rejected_release_count 1, hold_hours_required 144, hold_until 2026-08-11T09:00:00Z, status SEALED."
