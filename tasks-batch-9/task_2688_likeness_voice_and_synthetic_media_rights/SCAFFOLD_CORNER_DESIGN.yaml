          assert:
            - "trigger call 1 -> 409 with data.error_id == \"ERR_INVALID_LICENSE_STATE\": confirm-removal is only legal from REMOVAL_PENDING, and distribution_status is ISSUED"
            - "trigger call 2 -> 409 with data.error_id == \"ERR_DISCLOSURE_NOT_VERIFIED\", not a license-state error: the distribution rung is satisfied (ISSUED) and it is the cross-dimension read that fails"
            - "trigger call 3 -> 200 with compliance_status \"LABELED\", disclosure_placement \"PRE_ROLL\" and disclosure_verified_by_user_id null"
            - "trigger call 4 -> 200 with compliance_status \"VERIFIED\" and disclosure_verified_by_user_id == \"co-001\""
            - "trigger call 5 -> 409 with data.error_id == \"ERR_INVALID_DISCLOSURE_STATE\": re-attestation is legal only from PENDING_LABEL or NON_COMPLIANT, never from VERIFIED; disclosure_placement is still \"PRE_ROLL\""
            - "trigger call 6 -> 409 with data.error_id == \"ERR_INVALID_PERFORMANCE_STATE\": review is only legal from SUBMITTED and the performance is APPROVED; review_status stays \"APPROVED\" and rejection_reason stays null"
            - "trigger call 7 -> 409 with the same ERR_INVALID_PERFORMANCE_STATE: resubmit needs REVISION_REQUESTED, and an APPROVED performance carries no REVISION_LIMIT_REACHED rejection_reason so the priority-84 carve-out does not apply"
            - "after all seven triggers GET /usage-licenses/${l_id} shows distribution_status \"ISSUED\", compliance_status \"VERIFIED\" and a version that advanced exactly twice (calls 3 and 4) — the five refusals wrote nothing"

      - name: resubmit_after_the_cap_driven_rejection_reports_the_revision_limit
        claim_type: error_triggerable
        grounds: [validations.priority_84, errors.ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: >-
          ERR_REVISION_LIMIT_REACHED is reachable only through the priority-38 carve-out: the fourth
          REQUEST_REVISION rejects instead of looping, so no performance is ever left in
          REVISION_REQUESTED at revision_round 3. The resubmit that follows the cap-driven rejection
