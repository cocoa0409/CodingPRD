            - "One Customer with four Projects, so Customer.project_count == 4 and T4 GOODWILL would match."
            - "The fourth Project holds a paid deposit of 59002 (deposit_held_cents 59002, financial_status DEPOSIT_HELD) and a MaterialDelivery IN_TRANSIT with material_cost_cents 250000."
            - "Clock advanced to 2026-08-03T00:00:00.000Z — exactly 48 hours after project creation, inside COOLING_OFF_HOURS 72."
