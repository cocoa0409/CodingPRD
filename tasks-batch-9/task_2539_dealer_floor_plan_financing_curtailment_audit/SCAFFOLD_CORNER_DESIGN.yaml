      - name: parallel_dimensions_on_the_inventory_unit_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: unit_title_dimension_cycles_lost_and_back_while_funding_dimension_holds
          rationale: "The parallel-shape claim is that the title dimension can travel LENDER_HELD -> LOST -> LENDER_HELD while the funding dimension holds FLOORED, and that the combined state is correct at each step. That difficulty instance asserts exactly that pair of dimensions across three writes on the same row."

      - name: cascade_down_from_the_reconcile_transition_reaches_only_live_children
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: audit_reconcile_cascades_five_hops_from_observation_to_voided_advance
          rationale: "That instance drives one reconcile and asserts the whole downstream fan-out - incident, unit funding_status and eligibility, dealer counters, line suspension, and the REQUESTED advance voided back to REGISTERED - which is the cascade-down claim in its strongest available form."

      - name: cross_entity_side_effect_from_the_curtailment_run_to_the_dealer
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: curtailment_run_cascades_four_hops_from_obligation_to_next_audit_due_at
          rationale: "The cross-entity claim needs entity A's change to adjust entity B with B's own fields verified; that instance walks obligation -> unit -> dealer counters -> risk rating -> audit_frequency_days -> next_audit_due_at and asserts every field on the far side."

      - name: ledger_sync_between_the_unit_and_the_credit_line_money_fields
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: credit_limit_capacity_identity_survives_a_funding_reversal_without_drift
          rationale: "Ledger sync is the claim that a child state change updates the ancestor's derived money fields and reconciles before and after. That instance reads the line's capacity identity before the fund, after the fund and after the reversal, which covers the sync in both directions."

      - name: compensation_of_the_fund_transition_reverses_every_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: credit_limit_capacity_identity_survives_a_funding_reversal_without_drift
          rationale: "The compensation claim - undo transition reverses all original side effects with no drift - is the stated purpose of that instance, which also asserts the SCHEDULED obligations moving to CANCELLED and the unit money fields returning to zero."

      - name: conditional_cascade_touches_only_units_in_the_qualifying_state
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: audit_scope_count_identity_survives_an_abort_that_rolls_the_counters_back
          rationale: "The conditional-cascade claim is that a side effect is applied only when the child sits in a specific state; the abort instance asserts the negative half exactly - no unit changes status and no incident is created - while the reconcile half of the same fixture asserts the positive half."

