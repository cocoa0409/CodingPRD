# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_3299_mobile_wallet_card_provisioning_token_lifecycle_device
# Nine Difficulty Rules x 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: issuer_fee_accrual_vs_projection_diverge_while_pending_authorizations_exist
        grounds:
          - calculations.issuer_fee_accrual
          - calculations.issuer_fee_accrual.variants.accrual
          - calculations.issuer_fee_accrual.variants.projection
          - endpoints.GET_/issuers/{issuerId}/fee-projection
        distinguishing_aspect: |
          Entity domain: Issuer fiscal ledger. The accrual variant counts only
          APPROVED authorizations; the projection variant counts APPROVED +
          PENDING. With one PENDING authorization outstanding the two variants
          MUST disagree on the same issuer by exactly that auth's fee.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Issuer ACTIVE with agreement fee_bps 150, fee_cap_cents 500, fee_floor_cents 0. One cardholder, device HEALTHY, card account OPEN (CREDIT), artifact, provisioned ACTIVE token."
            - "One APPROVED authorization of amount 10000 (fee = min(floor(10000*150/10000),500)=150, floor 0 => 150)."
            - "One PENDING authorization created directly in PENDING state via a synthetic hold: amount 20000 (fee = 300) — realized by an authorize call that the fixture leaves undecided through the test-driving endpoint pattern: we instead create a second auth and intercept before decision; operationally the test drives PENDING by creating the Authorization row in PENDING (initial state) without resolving it."
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Any
            - &ch1
              call: "POST /cardholders"
              payload: { legal_name: "Ada Byers", email: "ada@example.com", phone: "+15550001001" }
              as: Any
              captures: { ch_id: $.data.id }
            - &issuer1
              call: "POST /issuers"
              payload: { issuer_name: "Meridian Bank", country_code: "US" }
              as: PlatformAdmin
              captures: { issuer_id: $.data.id }
            - &agr1
              call: "POST /issuer-agreements"
              payload: { issuer_id: "${issuer_id}", branding_color: "#112233", branding_logo_ref: "logo://m", terms_version: "v1", fee_bps: 150, fee_cap_cents: 500, fee_floor_cents: 0, express_transit_supported: false, effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &dev1
              call: "POST /devices"
              payload: { cardholder_id: "${ch_id}", device_serial: "SN-001", device_model: "Phone X", os_version: "26.0" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { dev_id: $.data.id }
            - &sec1
              call: "POST /devices/${dev_id}/set-security"
              payload: { passcode_enabled: true, biometric_enabled: true }
              as: Cardholder
              as_user_id: "${ch_id}"
            - &acct1
              call: "POST /card-accounts"
              payload: { cardholder_id: "${ch_id}", issuer_id: "${issuer_id}", fpan_last4: "4242", card_product: "CREDIT" }
              as: IssuerOperator
              captures: { acct_id: $.data.id }
            - &art1
              call: "POST /card-artifacts"
              payload: { card_account_id: "${acct_id}", pan_last4: "4242", expiry: "0930", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { art_id: $.data.id }
            - &sess1
              call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art_id}", idempotency_key: "prov-1" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - &ver1a
              call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - &ver1b
              call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess_v2: $.data.version }
            - &tok1
              call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { expected_session_version: "${sess_v2}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { token_id: $.data.id }
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-1", amount_cents: 10000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { auth_ok: $.data.id }
          trigger:
            - call: "GET /issuers/${issuer_id}/fee-projection"
              payload: {}
              as: IssuerOperator
              captures: { proj: $.data.projected_fee_cents, appr: $.data.approved_fee_cents }
          assert:
            - "approved_fee_cents == 150 (accrual variant: only the APPROVED auth counts)"
            - "the second authorization is still PENDING (initial state, never resolved), so projected_fee_cents == 150 + 300 == 450"
            - "projected_fee_cents != approved_fee_cents — the variants diverge on identical inputs"

      - name: aggregate_risk_score_provisional_vs_resolved_variants_diverge
        grounds:
          - calculations.aggregate_risk_score
          - calculations.disputed_amount_reconciliation
          - entities.CardAccount
          - endpoints.GET_/card-accounts/{cardAccountId}/risk
        distinguishing_aspect: |
          Entity domain: CardAccount risk (different domain from the issuer fee
          ledger). The provisional variant counts an OPEN FRAUD dispute
          (bonus 15 + restricted account); the resolved variant drops the bonus
          after resolve. Same account, same declines, different score.
        test_recipe:
          setup:
            - "Clock default. Setup identical to the happy-path chain (issuer ACTIVE, HEALTHY device, OPEN card account, ACTIVE token), plus one APPROVED authorization of 25000 and one OPEN FRAUD dispute on it."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-2", amount_cents: 25000, currency: "USD", merchant_id: "m-9", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/disputes"
              payload: { amount_cents: 25000, reason: "FRAUD" }
              as: CustomerService
              captures: { disp_id: $.data.id }
            - call: "GET /card-accounts/${acct_id}/risk"
              payload: {}
              as: CustomerService
              captures: { risk_open: $.data.risk_score }
          trigger:
            - call: "POST /disputes/${disp_id}/resolve-dispute"
              payload: { outcome: "LOST" }
              as: IssuerOperator
            - call: "GET /card-accounts/${acct_id}/risk"
              payload: {}
              as: CustomerService
              captures: { risk_resolved: $.data.risk_score }
          assert:
            - "risk_open == 15 (RISK_OPEN_DISPUTE_BONUS; zero declines, devices healthy)"
            - "after resolve LOST, the account returns OPEN and risk_resolved == 0"
            - "risk_open != risk_resolved — the OPEN-dispute variant exceeds the resolved variant by exactly 15"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: issuer_fee_floor_cap_nested_min_max_ordering
        grounds:
          - calculations.issuer_fee_accrual
          - entities.IssuerAgreement.fields.fee_bps
          - entities.IssuerAgreement.fields.fee_cap_cents
          - entities.IssuerAgreement.fields.fee_floor_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested
          min(floor(bps*amt), cap) then max(., floor). A tiny amount lands on
          the FLOOR branch; a large amount lands on the CAP branch; a mid amount
          takes neither. Three inputs (amount, bps, cap/floor) interact
          non-linearly.
        test_recipe:
          setup:
            - "Clock default. Issuer ACTIVE, agreement fee_bps 50, fee_cap_cents 200, fee_floor_cents 25. Standard provisioned token."
          setup_api_calls:
            - *clock0
            - *ch1
            - call: "POST /issuers"
              payload: { issuer_name: "Floorcap Bank", country_code: "US" }
              as: PlatformAdmin
              captures: { issuer_id: $.data.id }
            - call: "POST /issuer-agreements"
              payload: { issuer_id: "${issuer_id}", branding_color: "#000000", branding_logo_ref: "logo://f", terms_version: "v1", fee_bps: 50, fee_cap_cents: 200, fee_floor_cents: 25, express_transit_supported: false, effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - call: "POST /card-accounts"
              payload: { cardholder_id: "${ch_id}", issuer_id: "${issuer_id}", fpan_last4: "4242", card_product: "CREDIT" }
              as: IssuerOperator
              captures: { acct_id: $.data.id }
            - call: "POST /card-artifacts"
              payload: { card_account_id: "${acct_id}", pan_last4: "4242", expiry: "0930", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { art_id: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art_id}", idempotency_key: "prov-fc" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess_id: $.data.id }
            - *ver1a
            - *ver1b
            - *tok1
          trigger:
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-small", amount_cents: 1000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-big", amount_cents: 100000, currency: "USD", merchant_id: "m-2", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "GET /issuers/${issuer_id}/fee-projection"
              payload: {}
              as: IssuerOperator
              captures: { appr: $.data.approved_fee_cents }
          assert:
            - "small auth raw fee floor(1000*50/10000)=5 < floor 25 => charged 25 (FLOOR branch)"
            - "big auth raw fee floor(100000*50/10000)=500 > cap 200 => charged 200 (CAP branch)"
            - "approved_fee_cents == 25 + 200 == 225"
            - "approved_fee_cents != 505 (uncapped) and != 250 (uncapped floor) — the nested min/max order matters"

      - name: aggregate_risk_weighted_sum_evaluation_order_is_pinned
        grounds:
          - calculations.aggregate_risk_score
          - entities.PaymentToken.fields.decline_count
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          risk feeds token auto-suspend decisions while declines feed risk; the
          scaffold pins: compute declines first, then OPEN-dispute bonus, then
          device bonus, then cap at 100. Two declined auths (2*1=2) + one OPEN
          dispute (15) + lost device (25) = 42; the order must not apply the cap
          before the bonuses.
        test_recipe:
          setup:
            - "Clock default. Standard provisioned token on a HEALTHY device; one APPROVED auth of 30000; two issuer-declined auths (decision DECLINE via cryptogram 'DECLINE') to accumulate decline_count 2; one OPEN UNRECOGNIZED dispute; then device reported lost."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-ok", amount_cents: 30000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { auth_id: $.data.id }
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "DECLINE", amount_cents: 500, currency: "USD", merchant_id: "m-2", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "DECLINE", amount_cents: 500, currency: "USD", merchant_id: "m-3", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "POST /authorizations/${auth_id}/disputes"
              payload: { amount_cents: 30000, reason: "UNRECOGNIZED" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /devices/${dev_id}/report_lost"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
          trigger:
            - call: "GET /card-accounts/${acct_id}/risk"
              payload: {}
              as: IssuerOperator
              captures: { risk: $.data.risk_score }
          assert:
            - "risk == 2*1 + 15 + 25 == 42 (declines 2, open-dispute bonus 15, device-lost bonus 25)"
            - "risk != 17 (cap-before-bonus orderings would drop a bonus) and risk < RISK_CAP 100"
            - "PaymentToken.${token_id}.decline_count == 2 and consecutive_decline_count == 2 (below the 3-streak auto-suspend)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: payment_token_suspend_resume_cycle_repeats_and_counts
        grounds:
          - state_machines.PaymentToken
          - state_machines.PaymentToken.ACTIVE_to_SUSPENDED
          - state_machines.PaymentToken.SUSPENDED_to_ACTIVE
          - entities.PaymentToken.fields.suspension_count
        distinguishing_aspect: |
          Cycle A->B->A on PaymentToken: ACTIVE->SUSPENDED->ACTIVE can repeat;
          each pass through SUSPENDED increments suspension_count, so the cycle
          is observable, not a no-op loop.
        test_recipe:
          setup:
            - "Clock default. Standard provisioned ACTIVE token on a HEALTHY device."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
          trigger:
            - call: "POST /devices/${dev_id}/tokens/${token_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/tokens/${token_id}/resume"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/tokens/${token_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/tokens/${token_id}/resume"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { susp: $.data.suspension_count, st: $.data.status }
          assert:
            - "st == ACTIVE after the second resume — the cycle completed twice"
            - "susp == 2 — each pass through SUSPENDED was counted"
            - "a third suspend from ACTIVE succeeds (cycle is repeatable)"

      - name: card_account_open_restricted_open_cycle_via_fraud_dispute
        grounds:
          - state_machines.CardAccount
          - state_machines.CardAccount.OPEN_to_RESTRICTED
          - state_machines.CardAccount.RESTRICTED_to_OPEN
          - state_machines.Dispute
        distinguishing_aspect: |
          Cycle on a DIFFERENT entity: CardAccount OPEN->RESTRICTED on FRAUD
          dispute creation and RESTRICTED->OPEN on dispute resolution — driven
          by a child entity's state machine, not by a direct account action.
        test_recipe:
          setup:
            - "Clock default. Standard provisioned ACTIVE token; one APPROVED auth of 40000."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-3", amount_cents: 40000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /authorizations/${auth_id}/disputes"
              payload: { amount_cents: 40000, reason: "FRAUD" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { disp_id: $.data.id, acct_after: $.data.card_account_id }
            - call: "GET /card-accounts/${acct_id}"
              payload: {}
              as: Any
              captures: { st_restricted: $.data.status }
            - call: "POST /disputes/${disp_id}/resolve-dispute"
              payload: { outcome: "WON" }
              as: IssuerOperator
            - call: "GET /card-accounts/${acct_id}"
              payload: {}
              as: Any
              captures: { st_open: $.data.status }
          assert:
            - "st_restricted == RESTRICTED — dispute creation drove the account into the cycle"
            - "st_open == OPEN — resolution drove it back"
            - "a second FRAUD dispute on a later auth repeats the cycle (OPEN -> RESTRICTED again)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: issuer_offboard_cascades_account_close_token_deactivate_event_append
        grounds:
          - state_machines.Issuer.ACTIVE_to_OFFBOARDED
          - state_machines.CardAccount
          - state_machines.PaymentToken
          - entities.TokenEvent
        distinguishing_aspect: |
          Depth-3 chain: offboard Issuer -> CardAccount CLOSED -> PaymentToken
          DEACTIVATED -> TokenEvent appended; each link is caused by the
          previous mutation, not by the original call.
        test_recipe:
          setup:
            - "Clock default. Issuer ACTIVE; OPEN card account; ACTIVE token bound to the account."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
          trigger:
            - call: "POST /issuers/${issuer_id}/offboard"
              payload: {}
              as: PlatformAdmin
              captures: { issuer_st: $.data.status }
            - call: "GET /card-accounts/${acct_id}"
              payload: {}
              as: Any
              captures: { acct_st: $.data.status }
            - call: "GET /payment-tokens/${token_id}"
              payload: {}
              as: Any
              captures: { tok_st: $.data.status, tok_reason: $.data.deactivated_reason }
            - call: "GET /payment-tokens/${token_id}/events"
              payload: {}
              as: Any
          assert:
            - "issuer_st == OFFBOARDED"
            - "acct_st == CLOSED — the account mutation was caused by the issuer transition"
            - "tok_st == DEACTIVATED and tok_reason == ISSUER_REVOKE — caused by the account closure, not directly by the call"
            - "the token's event log ends with a DEACTIVATION event whose payload names the issuer offboard"

      - name: device_report_lost_cascades_token_suspend_and_default_clear
        grounds:
          - endpoints.POST_/devices/{deviceId}/report_lost
          - state_machines.PaymentToken.ACTIVE_to_SUSPENDED
          - entities.Device.fields.security_posture
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger: report_lost on Device ->
          security_posture LOST -> every ACTIVE token on the device SUSPENDED
          (and the device default cleared) — caused by the posture change, not
          by a per-token call.
        test_recipe:
          setup:
            - "Clock default. HEALTHY device with one ACTIVE token set as the device default."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { dev_v: $.data.version }
            - call: "POST /devices/${dev_id}/default-card"
              payload: { token_id: "${token_id}", expected_device_version: "${dev_v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /devices/${dev_id}/report_lost"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { posture: $.data.security_posture }
            - call: "GET /payment-tokens/${token_id}"
              payload: {}
              as: Any
              captures: { tok_st: $.data.status, susp: $.data.suspension_count }
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { defc: $.data.default_card_id }
          assert:
            - "posture == LOST"
            - "tok_st == SUSPENDED and susp == 1 — caused by the posture change"
            - "defc == null — the default was cleared by the cascade"
            - "the token's event log contains a SUSPENSION event with reason lost_device"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: tokenize_expired_session_state_beats_device_unsecured_safety
        grounds:
          - validations.priority_5
          - validations.priority_9
          - errors.ERR_PROVISIONING_SESSION_EXPIRED
          - errors.ERR_DEVICE_UNSECURED
        distinguishing_aspect: |
          Category pair business_temporal (priority 5) vs business_safety
          (priority 9): a tokenize request where the session is expired AND the
          device lacks a passcode MUST fail with ERR_PROVISIONING_SESSION_EXPIRED
          (the earlier priority), not ERR_DEVICE_UNSECURED.
        test_recipe:
          setup:
            - "Clock starts at 2026-09-01T00:00:00Z. Device has NO passcode (DEGRADED). Session created and verified (2 challenges). Clock then advanced 25 hours so the session is expired."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T01:00:00Z" }
              as: Any
            - call: "GET /provisioning-sessions/${sess_id}"
              payload: {}
              as: Any
              captures: { sess_v_now: $.data.version }
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { expected_session_version: "${sess_v_now}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROVISIONING_SESSION_EXPIRED (409) — priority 5 fires before the priority-9 safety check"
            - "err != ERR_DEVICE_UNSECURED even though the device is also unsecured"

      - name: authorize_inactive_token_state_beats_amount_cap_fiscal
        grounds:
          - validations.priority_8
          - validations.priority_14
          - errors.ERR_TOKEN_NOT_ACTIVE
          - errors.ERR_AUTH_AMOUNT_EXCEEDS_CAP
        distinguishing_aspect: |
          DIFFERENT category pair: state (priority 8) vs business_fiscal
          (priority 14): an authorization against a SUSPENDED token whose
          amount also exceeds the 100000 cap MUST fail with
          ERR_TOKEN_NOT_ACTIVE, not ERR_AUTH_AMOUNT_EXCEEDS_CAP.
        test_recipe:
          setup:
            - "Clock default. Standard ACTIVE token, then suspended by the cardholder."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
            - call: "POST /devices/${dev_id}/tokens/${token_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-x", amount_cents: 250000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TOKEN_NOT_ACTIVE (409) — state check (priority 8) precedes the fiscal cap (priority 14)"
            - "err != ERR_AUTH_AMOUNT_EXCEEDS_CAP even though 250000 > 100000"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: session_expires_at_exactly_ttl_boundary_inclusive
        grounds:
          - calculations.provisioning_window
          - constants.SESSION_TTL_HOURS
          - errors.ERR_PROVISIONING_SESSION_EXPIRED
        distinguishing_aspect: |
          Metric: logical-clock minutes on the provisioning window; the
          comparison is INCLUSIVE (clock == expires_at already means EXPIRED).
          One second before expiry tokenize succeeds; exactly at expiry it
          fails.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Standard verified session (2 challenges), HEALTHY device. expires_at == 2026-09-02T00:00:00Z."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:59:59Z" }
              as: Any
            - call: "GET /provisioning-sessions/${sess_id}"
              payload: {}
              as: Any
              captures: { sess_v_now: $.data.version }
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { expected_session_version: "${sess_v_now}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { token_id: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art_id}", idempotency_key: "prov-2" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess2_id: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess2_id}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess2_id}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T23:59:59Z" }
              as: Any
            - call: "GET /provisioning-sessions/${sess2_id}"
              payload: {}
              as: Any
              captures: { sess2_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: Any
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess2_id}/tokenize"
              payload: { expected_session_version: "${sess2_v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first tokenize at expires_at - 1s succeeds (201, token created)"
            - "the second session's tokenize at exactly created_at + 24h fails: err == ERR_PROVISIONING_SESSION_EXPIRED (>= is inclusive)"

      - name: third_consecutive_decline_auto_suspends_exactly_at_threshold
        grounds:
          - calculations.decline_reason_resolution
          - state_machines.PaymentToken
          - entities.PaymentToken.fields.consecutive_decline_count
        distinguishing_aspect: |
          DIFFERENT metric on a DIFFERENT endpoint: consecutive decline count
          reaching exactly 3 (>= threshold, not > 3) auto-suspends the token on
          the authorization endpoint — a count boundary, not a clock boundary.
        test_recipe:
          setup:
            - "Clock default. Standard ACTIVE token on a HEALTHY device."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
          trigger:
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "DECLINE", amount_cents: 100, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "DECLINE", amount_cents: 100, currency: "USD", merchant_id: "m-2", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "GET /payment-tokens/${token_id}"
              payload: {}
              as: Any
              captures: { st2: $.data.status, cc2: $.data.consecutive_decline_count }
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "DECLINE", amount_cents: 100, currency: "USD", merchant_id: "m-3", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "GET /payment-tokens/${token_id}"
              payload: {}
              as: Any
              captures: { st3: $.data.status, cc3: $.data.consecutive_decline_count }
          assert:
            - "cc2 == 2 and st2 == ACTIVE — below the threshold nothing happens"
            - "cc3 == 3 and st3 == SUSPENDED — exactly at 3 the auto-suspend fires (>= not >)"
            - "a 4th authorization now fails with ERR_TOKEN_NOT_ACTIVE (409) instead of recording a decline"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: token_resume_gated_by_card_account_open
        grounds:
          - state_machines.PaymentToken.SUSPENDED_to_ACTIVE
          - entities.CardAccount.fields.status
          - errors.ERR_CARD_ACCOUNT_RESTRICTED
        distinguishing_aspect: |
          Entity pair PaymentToken -> CardAccount: resuming a SUSPENDED token
          requires the funding CardAccount to be OPEN; a RESTRICTED account
          blocks resume with ERR_CARD_ACCOUNT_RESTRICTED.
        test_recipe:
          setup:
            - "Clock default. Standard ACTIVE token; one APPROVED auth; cardholder suspends the token; a FRAUD dispute opens on the auth -> account RESTRICTED."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-4", amount_cents: 15000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { auth_id: $.data.id }
            - call: "POST /devices/${dev_id}/tokens/${token_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /authorizations/${auth_id}/disputes"
              payload: { amount_cents: 15000, reason: "FRAUD" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /devices/${dev_id}/tokens/${token_id}/resume"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
            - call: "POST /disputes/${disp_id}/resolve-dispute"
              payload: { outcome: "LOST" }
              as: IssuerOperator
            - call: "POST /devices/${dev_id}/tokens/${token_id}/resume"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { st: $.data.status }
          assert:
            - "err == ERR_CARD_ACCOUNT_RESTRICTED while the account is RESTRICTED"
            - "after the dispute resolves (account back to OPEN) the same resume succeeds: st == ACTIVE"

      - name: artifact_suspend_cascades_to_token_but_resume_does_not
        grounds:
          - state_machines.CardArtifact
          - state_machines.PaymentToken
          - entities.PaymentToken.fields.status
        distinguishing_aspect: |
          DIFFERENT entity pair: CardArtifact -> PaymentToken. Suspending the
          artifact forces bound ACTIVE tokens to SUSPENDED; resuming the
          artifact deliberately does NOT resume the tokens (asymmetric
          cross-entity coupling).
        test_recipe:
          setup:
            - "Clock default. Standard ACTIVE token bound to artifact."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
          trigger:
            - call: "POST /card-artifacts/${art_id}/suspend"
              payload: {}
              as: IssuerOperator
            - call: "GET /payment-tokens/${token_id}"
              payload: {}
              as: Any
              captures: { tok_susp: $.data.status }
            - call: "POST /card-artifacts/${art_id}/resume"
              payload: {}
              as: IssuerOperator
            - call: "GET /payment-tokens/${token_id}"
              payload: {}
              as: Any
              captures: { tok_still: $.data.status }
          assert:
            - "tok_susp == SUSPENDED — artifact suspension cascaded"
            - "tok_still == SUSPENDED after artifact resume — the cascade is deliberately one-directional"
            - "an authorization attempt now fails with ERR_TOKEN_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_activation_rejects_overlapping_active_agreement_half_open_window
        grounds:
          - validations.priority_20
          - errors.ERR_AGREEMENT_OVERLAP
          - entities.IssuerAgreement.fields.effective_at
          - entities.IssuerAgreement.fields.expires_at
        distinguishing_aspect: |
          Interval semantics: half-open [effective_at, expires_at) on the
          Issuer resource — at most one ACTIVE agreement per issuer at any
          instant; activating a second ACTIVE agreement on the same issuer is
          rejected even when its window merely touches the incumbent.
        test_recipe:
          setup:
            - "Clock default. Issuer exists; agreement A ACTIVE with window [2026-09-01, 2027-09-01)."
          setup_api_calls:
            - *clock0
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuer-agreements"
              payload: { issuer_id: "${issuer_id}", branding_color: "#445566", branding_logo_ref: "logo://m2", terms_version: "v2", fee_bps: 100, fee_cap_cents: 900, fee_floor_cents: 0, express_transit_supported: false, effective_at: "2027-09-01T00:00:00Z", expires_at: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { agr2_id: $.data.id }
          trigger:
            - call: "POST /issuer-agreements/${agr2_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGREEMENT_OVERLAP (409) — only one ACTIVE agreement per issuer, regardless of window adjacency"
            - "after POST /issuer-agreements/${agr_id}/terminate, activating agreement B succeeds (the resource is free)"

      - name: provisioning_session_overlap_rejected_per_device_active_window
        grounds:
          - validations.priority_6
          - entities.ProvisioningSession.fields.expires_at
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource: a device admits
          only one non-terminal provisioning session at a time — sessions
          occupy the whole [created_at, expires_at] CLOSED window (inclusive
          both ends), so a second session on the same device is rejected with
          ERR_INVALID_STATE while the first is non-terminal.
        test_recipe:
          setup:
            - "Clock default. HEALTHY device, issuer ACTIVE, artifact; one provisioning session already open (non-terminal)."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art_id}", idempotency_key: "prov-second" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409) — the device's active session window blocks a second session"
            - "after the first session reaches a terminal state (EXPIRED via clock advance past expires_at), a new session is accepted (201)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispute_open_resolve_leaves_open_disputed_total_unchanged
        grounds:
          - calculations.disputed_amount_reconciliation
          - state_machines.Dispute
          - endpoints.GET_/card-accounts/{cardAccountId}/risk
        distinguishing_aspect: |
          Conserved quantity: account-level open disputed cents. Opening a
          dispute adds amount_cents; resolving it (WON or LOST) removes exactly
          the same amount — the account's open disputed total returns to its
          pre-dispute value with zero drift.
        test_recipe:
          setup:
            - "Clock default. Standard ACTIVE token; two APPROVED auths of 10000 and 20000."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-a", amount_cents: 10000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { auth_a: $.data.id }
            - call: "POST /payment-tokens/${token_id}/authorizations"
              payload: { cryptogram: "cgm-b", amount_cents: 20000, currency: "USD", merchant_id: "m-2", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { auth_b: $.data.id }
            - call: "GET /card-accounts/${acct_id}/risk"
              payload: {}
              as: CustomerService
              captures: { base: $.data.open_disputed_cents }
          trigger:
            - call: "POST /authorizations/${auth_a}/disputes"
              payload: { amount_cents: 10000, reason: "DUPLICATE" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { disp_a: $.data.id }
            - call: "GET /card-accounts/${acct_id}/risk"
              payload: {}
              as: CustomerService
              captures: { mid: $.data.open_disputed_cents }
            - call: "POST /disputes/${disp_a}/resolve-dispute"
              payload: { outcome: "WON" }
              as: IssuerOperator
            - call: "GET /card-accounts/${acct_id}/risk"
              payload: {}
              as: CustomerService
              captures: { final: $.data.open_disputed_cents }
          assert:
            - "base == 0"
            - "mid == 10000 — opening added exactly the disputed amount"
            - "final == 0 — resolving removed exactly the same amount; the compensating pair conserves the total"

      - name: token_suspend_resume_cycle_leaves_device_active_token_count_unchanged
        grounds:
          - state_machines.PaymentToken
          - entities.Device.fields.active_token_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity: Device.active_token_count. Suspend and
          resume both leave the ACTIVE-token count definition unchanged
          (suspended tokens are not counted, resumed ones are) — the full
          suspend+resume pair MUST restore the pre-suspend count exactly, and
          deactivate followed by re-provision also restores it (different
          compensating pair, same quantity).
        test_recipe:
          setup:
            - "Clock default. HEALTHY device with one ACTIVE token; active_token_count == 1."
          setup_api_calls:
            - *clock0
            - *ch1
            - *issuer1
            - *agr1
            - call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${issuer_id}/activate"
              payload: {}
              as: PlatformAdmin
            - *dev1
            - *sec1
            - *acct1
            - *art1
            - *sess1
            - *ver1a
            - *ver1b
            - *tok1
          trigger:
            - call: "POST /devices/${dev_id}/tokens/${token_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { cnt_mid: $.data.active_token_count }
            - call: "POST /devices/${dev_id}/tokens/${token_id}/resume"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { cnt_final: $.data.active_token_count }
          assert:
            - "cnt_mid == 0 — suspension removed the token from the ACTIVE count"
            - "cnt_final == 1 — resume restored it exactly (suspend+resume conserves Device.active_token_count)"
            - "no drift: repeating the pair keeps the count at 1"
