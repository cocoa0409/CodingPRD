  - rule_id: compensating_invariant
    instances:
      - name: ci_award_ledger_conserved_through_release_clawback_and_reinstatement
        grounds:
          - state_machines.GrantProposal.AWARDED_to_AWARDED
          - state_machines.GrantProposal.AWARDED_to_SUSPENDED
          - state_machines.GrantProposal.SUSPENDED_to_AWARDED
          - calculations.restricted_release_waterfall
          - entities.GrantProposal.fields.returned_cents
          - validations[priority=52]
        distinguishing_aspect: |
          awarded_amount_cents == released_cents + unreleased_cents + returned_cents holds at all four
          observation points - 0/350000/0 after the award, 210000/140000/0 after the release,
          0/140000/210000 after the delinquency clawback and 0/350000/0 after reinstatement - and the
          reinstatement is a true compensation rather than a second release: it also resets the report's
          consumed_release_cents from 210000 back to 0 while FiscalPeriod.reserve_balance_cents returns
          to its pre-release 500000 and is not credited twice.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z; OPEN FiscalPeriod FY2027, monthly_expense_base_cents 200000, reserve_balance_cents 500000."
            - "CoverageArea HOUSING (gate OPEN); CLEARED FOUNDATION funder with an ACTIVE disclosure for (funder, HOUSING)."
            - "PROGRAM_RESTRICTED proposal on HOUSING (2026-09-01..2027-02-28, SEMIANNUAL) AWARDED at 350000 with one GrantReport (allocated_release_cents 350000, due_date 2027-04-14)."
            - "210000 is released under the WATCH cap, so reserve_balance_cents is 710000 and the report's consumed_release_cents is 210000."
            - "The clock then moves to 2027-04-15T00:00:00Z and POST /ops/daily-sweep suspends the proposal for report delinquency, clawing the 210000 back."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
