              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /certificate-holders"
              payload: { insurer_id: "${ins_id}", holder_name: "Landlord LLC", address: "1 Main St" }
              as: Underwriter
              captures: { holder_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0015", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /endorsements"
              payload: { policy_id: "${pol_id}", certificate_holder_id: "${holder_id}", form_number: "CG2010", ai_effective_date: "2027-01-01T00:00:00.000Z" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 422, data.error_id == ERR_AI_DATE_OUTSIDE_PERIOD (upper bound exclusive)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deny_claim_restores_general_aggregate_room
        grounds:
          - state_machines.Claim.RESERVED_to_DENIED
          - calculations.aggregate_erosion
          - entities.Policy.fields.general_aggregate_remaining_cents
        distinguishing_aspect: |
          Conserved quantity = general aggregate room: general_aggregate_remaining_cents +
          sum(recognized_incurred_cents over GENERAL claims) == general_aggregate_limit_cents
          (200000000) always. A RESERVE_SET erodes it; denying the claim is the compensating action
          that releases exactly that erosion, returning general_aggregate_remaining_cents to 200000000.
        test_recipe:
          setup:
            - "IN_FORCE OCCURRENCE policy (gen_agg $2M); clock 2026-06-01; a GENERAL claim with RESERVE_SET $1.8M (no payment) eroding 180000000."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0016", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "Disputed H", loss_type: "PROPERTY_DAMAGE", occurrence_date: "2026-03-01T00:00:00.000Z", reported_date: "2026-03-02T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 90000000 }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/deny"
              payload: {}
              as: ClaimsAdjuster
              captures: { st: $.data.status }
          assert:
            - "Before deny Policy.${pol_id}.general_aggregate_remaining_cents == 110000000 (200000000 - 90000000)"
            - "Claim.${claim_id}.status == DENIED"
            - "After deny Policy.${pol_id}.general_aggregate_remaining_cents == 200000000 (room fully restored; invariant remaining + recognized == 200000000 holds)"
            - "Claim.${claim_id}.recognized_incurred_cents == 0"

      - name: reserve_set_then_release_conserves_claim_incurred
        grounds:
          - calculations.claim_incurred
          - entities.ClaimTransaction.fields.txn_type
          - entities.Claim.fields.incurred_cents
          - concurrency_rules[claim-txn-stale-policy]
        distinguishing_aspect: |
          Conserved quantity = the open-reserve component of incurred_cents (a different quantity
          than aggregate room): a RESERVE_SET of X followed by a RESERVE_RELEASE of X leaves
          Claim.incurred_cents at its pre-pair baseline. With a $40M RESERVE_SET and a $40M PAYMENT
          already booked (baseline incurred 80000000 = open reserve 40000000 + payments 40000000),
          a +$30M RESERVE_SET then a -$30M RESERVE_RELEASE returns incurred_cents to 80000000.
        test_recipe:
          setup:
            - "IN_FORCE OCCURRENCE policy; clock 2026-06-01; a GENERAL claim with RESERVE_SET $40M then PAYMENT $40M (baseline incurred 80000000, open reserve 40000000)."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0017", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "Settled I", loss_type: "BODILY_INJURY", occurrence_date: "2026-02-01T00:00:00.000Z", reported_date: "2026-02-02T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 40000000 }
              as: ClaimsAdjuster
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { pv1: $.data.version }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: 40000000, expected_policy_version: "${pv1}" }
              as: ClaimsAdjuster
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { pv2: $.data.version }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 30000000, expected_policy_version: "${pv2}" }
              as: ClaimsAdjuster
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { pv3: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_RELEASE", amount_cents: 30000000, expected_policy_version: "${pv3}" }
              as: ClaimsAdjuster
          assert:
            - "After the +$30M RESERVE_SET Claim.${claim_id}.incurred_cents == 110000000 (open reserve 70000000 + payments 40000000)"
            - "After the compensating -$30M RESERVE_RELEASE Claim.${claim_id}.incurred_cents == 80000000 (baseline restored, open reserve back to 40000000)"
