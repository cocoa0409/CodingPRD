      - name: host_capacity_counts_inclusive_calendar_days_not_instants
        grounds:
          - validations[priority=23]
          - entities.AcademicProgram.fields.host_capacity_per_day
          - entities.ReviewerVisit.fields.span_start_date
          - entities.ReviewerVisit.fields.span_end_date
          - state_machines.ReviewCycle.VISIT_SCHEDULED_to_VISIT_SCHEDULED
        distinguishing_aspect: |
          The capacity rule aggregates over inclusive UTC calendar days, a
          different geometry from the half-open instant window used by the
          reviewer-overlap rule at priority 22. Four distinct reviewers are booked
          onto one program with host_capacity_per_day 2, so the per-reviewer
          overlap rule can never fire. The fourth request is refused because its
          window straddles midnight and therefore occupies both 2026-08-20 and
          2026-08-21, each of which already carries two visits — even though its
          instant window (22:00 to 06:00) does not intersect the first visit's
          instant window (09:00 to 17:00) at all.
        test_recipe:
          setup:
            - "Program HIST-BA registered with host_capacity_per_day 2, and its cycle carried to SELF_STUDY_ACCEPTED."
            - "Four distinct external reviewers R1..R4, so the priority 22 per-reviewer overlap rule is never engaged."
            - "Three visits already SCHEDULED on the cycle, which stays in VISIT_SCHEDULED as team members are added: R1 over [2026-08-20T09:00:00Z, 2026-08-20T17:00:00Z) spanning day 20 only; R2 over [2026-08-20T13:00:00Z, 2026-08-21T01:00:00Z) spanning days 20 and 21; R3 over [2026-08-21T09:00:00Z, 2026-08-21T17:00:00Z) spanning day 21 only."
