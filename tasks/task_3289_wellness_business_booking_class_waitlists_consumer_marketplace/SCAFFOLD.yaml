# =============================================================================
# PRD Benchmark Scaffold — §1.0–§1.7
# Task: task_3289_wellness_business_booking_class_waitlists_consumer_marketplace
# Domain: Wellness Business Booking, Class Waitlists & Consumer Marketplace
# =============================================================================

scenario: |
  Wellness Business Booking, Class Waitlists & Consumer Marketplace (Mindbody): business subscription for scheduling, point of sale, memberships and staff payroll with tier-based feature access, class scheduling with capacity, waitlist promotion rules and late cancellation fee enforcement, membership and class pack management with expiration, freeze and auto-renewal handling, consumer marketplace listing where the same inventory is sold to app users with different commission economics, dynamic pricing and promotional inventory for off-peak classes, staff commission, payroll and instructor substitution workflows, business data ownership and client list portability disputes on cancellation, integration with wellness benefit networks that pay per visit

domain_name: wellness-booking-marketplace
api_prefix: /wellness

complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - multi_tenancy_isolation
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_band: Expert
  entity_count: 14
  state_machine_count: 10
  calculation_count: 16
  endpoint_count: 93
  error_code_count: 55
  role_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  # ---------------------------------------------------------------------------
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered business name of the wellness business (tenant root)."
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter US state code of the business's home jurisdiction."
        constraints: "must be a member of the five-value state vocabulary {CA, NY, TX, WA, CO}"
      - name: subscription_id
        type: string
        source: system
        description: "FK -> BusinessSubscription.id; the tenant's single subscription row, stamped by POST /wellness/studios."
      - name: subscription_tier
        type: enum
        source: computed
        description: "Tier mirrored from BusinessSubscription.tier for gating reads."
        constraints: "one of {STARTER, GROWTH, ENTERPRISE}"
      - name: feature_gates
        type: object
        source: computed
        description: "Derived map {marketplace_listing, staff_payroll, instructor_substitution, waitlist_auto_promotion, benefit_network_billing, client_portability_export} → boolean, derived from subscription_tier per the TIER_FEATURE_MATRIX constant."
      - name: client_roster_count
        type: integer
        source: computed
        description: "Count of Client rows whose status IN {ACTIVE, FROZEN, PORTABILITY_HOLD}."
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Aggregate money owed to the studio = sum of Membership.open_balance_cents over non-terminal memberships + sum of outstanding booking_fee_cents over Booking rows in {NO_SHOW, LATE_CANCELLED} + sum of class-package overage_cents. Never below 0."
      - name: payroll_cap_mode
        type: enum
        source: input
        description: "Which commission evaluation order this studio's payroll uses; selects the variant of commission_accrual applied to every entry."
        constraints: "one of {BONUS_OUTSIDE_CAP, BONUS_INSIDE_CAP}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle posture of the tenant."
        constraints: "one of {TRIAL, ACTIVE, SUSPENDED, CANCELLED}"
      - name: suspension_reason
        type: string
        source: system
        description: "Populated only when status == SUSPENDED by the subscription-lapse cascade."
      - name: data_ownership_state
        type: enum
        source: computed
        description: "Client-list portability posture."
        constraints: "one of {OWNED, PORTABILITY_PENDING, PORTABILITY_GRANTED, EXPORT_CLOSED}"

  # ---------------------------------------------------------------------------
  - name: SubscriptionTier
    parent: null
    common_fields: false
    fields:
      - name: tier
        type: enum
        source: input
        description: "Tier identifier."
        constraints: "one of {STARTER, GROWTH, ENTERPRISE}"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Monthly recurring platform fee, in integer cents, billed on each renewal_epoch."
        constraints: "value >= 0 and value % 100 == 0 (whole dollars)"
      - name: tier_rank
        type: integer
        source: input
        description: "Monotonic rank used as the tier-upgrade path key; 1 = lowest."
        constraints: "integer >= 1, unique across rows"
      - name: included_staff_seats
        type: integer
        source: input
        description: "Number of staff memberships included before the per-seat overage fee applies."
      - name: seat_overage_fee_cents
        type: integer
        source: input
        description: "Per-seat monthly surcharge charged for each active StaffMember beyond included_staff_seats."
      - name: marketplace_listing_enabled
        type: boolean
        source: input
        description: "Whether studios on this tier may publish marketplace listings at all."
      - name: staff_payroll_enabled
        type: boolean
        source: input
        description: "Whether payroll runs and instructor commission accrual are available on this tier."
      - name: instructor_substitution_enabled
        type: boolean
        source: input
        description: "Whether substitution request workflows are available on this tier."
      - name: waitlist_auto_promotion_enabled
        type: boolean
        source: input
        description: "Whether automatic waitlist promotion is available on this tier."
      - name: crm_client_export_enabled
        type: boolean
        source: input
        description: "Whether a client-portability CSV export may be issued on this tier."
      - name: marketplace_commission_bps
        type: integer
        source: input
        description: "Platform commission on consumer-marketplace bookings, in basis points (500 = 5.00%)."
        constraints: "integer in [0, 10000]"

  # ---------------------------------------------------------------------------
  - name: BusinessSubscription
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; the tenant this subscription belongs to."
      - name: tier
        type: enum
        source: input
        description: "Currently effective tier."
        constraints: "one of {STARTER, GROWTH, ENTERPRISE}"
      - name: billing_period
        type: enum
        source: input
        description: "Billing cadence fixed for the life of the row."
        constraints: "one of {MONTHLY, ANNUAL}; immutable after create"
      - name: monthly_fee_cents_snapshot
        type: integer
        source: computed
        description: "SubscriptionTier.monthly_fee_cents captured at the moment the current tier became effective."
      - name: renewal_epoch
        type: integer
        source: computed
        description: "Integer renewal counter since signup; starts at 0 and increments by exactly 1 on each POST /wellness/subscriptions/{id}/advance-renewal."
      - name: renewal_due_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the next renewal charge falls due; advanced by exactly 30 days per renewal when advance_clock is true, or left unchanged when advance_clock is false."
      - name: grace_until
        type: datetime
        source: computed
        description: "End of the GRACE_PERIOD_DAYS payment window; set to renewal_due_at on every renewal, and to the current logical clock when the subscription is RESUMEd."
      - name: dunning_stage
        type: enum
        source: computed
        description: "Collections progression for this subscription."
        constraints: "one of {CURRENT, RETRY_SCHEDULED, SUSPENDED, CANCELLED}"
      - name: status
        type: enum
        source: system
        description: "Subscription life-cycle state."
        constraints: "one of {TRIAL, ACTIVE, PAST_DUE, GRACE, SUSPENDED, CANCELLED}"
      - name: staff_seat_count
        type: integer
        source: computed
        description: "Count of StaffMember rows for this studio whose status IN {ACTIVE, SUBSTITUTE_ONLY}."
      - name: seat_overage_count
        type: integer
        source: computed
        description: "max(0, staff_seat_count − SubscriptionTier.included_staff_seats for the currently effective tier)."
      - name: payroll_hold
        type: boolean
        source: computed
        description: "True while dunning_stage IN {SUSPENDED, CANCELLED}; payroll runs and commission accrual are blocked."
  # ---------------------------------------------------------------------------
  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; the studio that employs this staff member."
      - name: full_name
        type: string
        source: input
        description: "Display name of the instructor or front-desk staff member."
      - name: staff_role
        type: enum
        source: input
        description: "Functional role inside the studio."
        constraints: "one of {INSTRUCTOR, FRONT_DESK, MANAGER}"
      - name: primary_class_template_id
        type: string
        source: input
        description: "FK -> ClassTemplate.id; the class format this instructor is primarily assigned to teach."
      - name: substitute_class_template_ids
        type: array
        source: input
        description: "Array of ClassTemplate.id values this instructor may cover as a substitute."
      - name: commission_rate_bps
        type: integer
        source: input
        description: "Commission rate applied to taught-session and product revenue, in basis points."
        constraints: "integer in [0, 5000]"
      - name: status
        type: enum
        source: system
        description: "Staff roster state."
        constraints: "one of {ACTIVE, SUBSTITUTE_ONLY, INACTIVE}"
      - name: accrued_commission_cents
        type: integer
        source: computed
        description: "Commission accrued in the current open payroll period, summed across CommissionEntry rows whose status == ACCRUED."

  # ---------------------------------------------------------------------------
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: home_studio_id
        type: string
        source: input
        description: "FK -> Studio.id; the studio that owns this client relationship."
      - name: display_name
        type: string
        source: input
        description: "Consumer-facing name shown in the marketplace."
      - name: email
        type: string
        source: input
        description: "Contact email; unique within a single studio, re-usable across studios."
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter US state code of the consumer."
        constraints: "must be a member of the five-value state vocabulary {CA, NY, TX, WA, CO}"
      - name: status
        type: enum
        source: system
        description: "Client life-cycle state; PORTABILITY_HOLD is entered by the portability request workflow."
        constraints: "one of {ACTIVE, FROZEN, PORTABILITY_HOLD, PORTED, ANONYMIZED}"
      - name: no_show_strike_count
        type: integer
        source: computed
        description: "Count of Booking rows for this client that reached NO_SHOW; reset to 0 only by a compensating ACTION_RESTORE transition."
      - name: late_cancel_count
        type: integer
        source: computed
        description: "Count of Booking rows for this client that reached LATE_CANCELLED; never reset."
      - name: outstanding_fee_cents
        type: integer
        source: computed
        description: "Late-cancellation and no-show fees currently owed; sum of Booking.booking_fee_cents over this client's bookings whose fee_status IN {CHARGED, PAYROLL_DEDUCTED}."

  # ---------------------------------------------------------------------------
  - name: ClassTemplate
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio."
      - name: name
        type: string
        source: input
        description: "Class format name, e.g. 'Reformer Flow 50'."
      - name: duration_minutes
        type: integer
        source: input
        description: "Scheduled length of one session of this format."
        constraints: "integer >= 15"
      - name: base_price_cents
        type: integer
        source: input
        description: "Undiscounted drop-in list price for one seat of this format, before the off-peak and tier adjustments of session_list_price."
        constraints: "integer >= 0"
      - name: default_capacity
        type: integer
        source: input
        description: "Capacity used when a ClassSession does not override capacity."
        constraints: "integer >= 1"
      - name: credit_cost
        type: integer
        source: input
        description: "Class-pack credits consumed per seat."
        constraints: "integer >= 1"
      - name: is_off_peak
        type: boolean
        source: input
        description: "Whether sessions of this format are designated off-peak, which makes them eligible for promotional inventory."
      - name: buffer_minutes
        type: integer
        source: input
        description: "Required changeover buffer between this format and any other session in the same room."
        constraints: "integer >= 0"

  # ---------------------------------------------------------------------------
  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio."
      - name: class_template_id
        type: string
        source: input
        description: "FK -> ClassTemplate.id; the format being scheduled."
      - name: instructor_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the instructor assigned to teach this session."
      - name: room_code
        type: string
        source: input
        description: "Physical room identifier; overlap and buffer rules are scoped to (room_code, start_at)."
      - name: start_at
        type: datetime
        source: input
        description: "Session start instant (ISO 8601 UTC)."
      - name: end_at
        type: datetime
        source: input
        description: "Session end instant; derived on create as start_at + ClassTemplate.duration_minutes."
      - name: capacity
        type: integer
        source: input
        description: "Seat capacity for this session; defaults to ClassTemplate.default_capacity when omitted."
        constraints: "integer >= 1"
      - name: seats_taken
        type: integer
        source: computed
        description: "Count of Booking rows for this session whose status IN {RESERVED, CHECKED_IN, NO_SHOW}."
      - name: seats_held
        type: integer
        source: computed
        description: "Count of active WaitlistEntry holds plus instructor-substitution holds reserving a seat for this session."
      - name: fullness_posture
        type: enum
        source: computed
        description: "Derived aggregate posture that gates booking and waitlist operations."
        constraints: "one of {OPEN, WAITLIST_ONLY, FULL, CANCELLED}"
      - name: list_price_cents
        type: integer
        source: computed
        description: "Price cents for a single drop-in seat in the studio channel for this session."
      - name: marketplace_price_cents
        type: integer
        source: computed
        description: "Price cents for the same seat sold through the consumer marketplace; diverges from list_price_cents because it grosses up the platform commission."
      - name: price_version
        type: integer
        source: computed
        description: "Monotonic counter incremented by every repricing of this session; used to key price snapshots."
      - name: promo_seats_allocated
        type: integer
        source: input
        description: "Seats of this session released to the off-peak promotional channel; 0 when no promotion is attached."
        constraints: "integer >= 0"
      - name: promo_seats_used
        type: integer
        source: computed
        description: "Promotional seats consumed by promotional bookings or lost when the promotion lapsed in place."
      - name: promo_discount_bps
        type: integer
        source: input
        description: "Discount off list price for seats drawn from this session's promotional allocation."
        constraints: "integer in [0, 5000]; 0 when no promotion is attached"
      - name: promo_valid_from
        type: datetime
        source: input
        description: "Inclusive start of this session's promotional window; null when no promotion is attached."
      - name: promo_valid_to
        type: datetime
        source: input
        description: "Exclusive end of this session's promotional window; null when no promotion is attached."
      - name: promo_offer_state
        type: enum
        source: system
        description: "Promotional inventory state for this session."
        constraints: "one of {NONE, SCHEDULED, ACTIVE, EXHAUSTED, EXPIRED, WITHDRAWN}"
      - name: promo_cascade_class_session_id
        type: string
        source: system
        description: "FK -> ClassSession.id; the session that absorbed the promotional seats this session could not hold when the waterfall step-2 bucket was used; null otherwise."
      - name: payroll_period_id
        type: string
        source: input
        description: "FK -> PayrollPeriod.id; the payroll period whose inclusive date range contains start_at."
      - name: status
        type: enum
        source: system
        description: "Session life-cycle state."
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED_BY_STUDIO}"

  # ---------------------------------------------------------------------------
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio (multi-tenancy partition key)."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the consumer holding the seat."
      - name: class_session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the session being booked."
      - name: channel
        type: enum
        source: input
        description: "Sales channel the seat was sold through."
        constraints: "one of {STUDIO, MARKETPLACE}"
      - name: payment_source
        type: enum
        source: input
        description: "How the seat is paid for."
        constraints: "one of {DROP_IN, MEMBERSHIP, CLASS_PACK, BENEFIT_NETWORK}"
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership charged or credited, present only when payment_source == MEMBERSHIP."
      - name: class_pack_id
        type: string
        source: input
        description: "FK -> ClassPack.id; the pack debited, present only when payment_source == CLASS_PACK."
      - name: benefit_network_code
        type: string
        source: input
        description: "Network code of the wellness benefit network billed, present only when payment_source == BENEFIT_NETWORK; resolved against BenefitNetwork.network_code, not by id."
      - name: booking_fee_cents
        type: integer
        source: computed
        description: "Fee assessed for a late cancellation or no-show; 0 until one of those transitions fires."
      - name: fee_status
        type: enum
        source: computed
        description: "Disposition of booking_fee_cents."
        constraints: "one of {NONE, CHARGED, PAYROLL_DEDUCTED, WAIVED}"
      - name: commission_base_cents
        type: integer
        source: computed
        description: "Channel gross written onto CommissionEntry when the attended session reaches COMPLETED."
      - name: benefit_claim_amount_cents
        type: integer
        source: computed
        description: "Amount the wellness benefit network is billed for this visit; 0 when payment_source != BENEFIT_NETWORK."
      - name: benefit_claim_status
        type: enum
        source: computed
        description: "Benefit-network claim disposition."
        constraints: "one of {NOT_APPLICABLE, SUBMITTED, PAID, DENIED}"
      - name: is_promotional_seat
        type: boolean
        source: computed
        description: "True when this marketplace seat was drawn from the session's off-peak promotional pool rather than the open pool."
      - name: creation_seq
        type: integer
        source: computed
        description: "Monotonic per-studio creation counter, max(creation_seq) + 1 at create time; the pinned tie-break for every order-sensitive walk over this studio's bookings."
      - name: reminders_sent
        type: integer
        source: computed
        description: "Number of reminder notifications emitted for this booking; incremented by each reminder run."
      - name: status
        type: enum
        source: system
        description: "Booking life-cycle state; LATE_CANCELLED is distinguished from CANCELLED by the cancellation-window rule."
        constraints: "one of {RESERVED, CHECKED_IN, NO_SHOW, ATTENDED, CANCELLED, LATE_CANCELLED, WAITLISTED}"

  # ---------------------------------------------------------------------------
  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio."
      - name: class_session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the session this hold is for."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the consumer holding the waitlist position."
      - name: joined_at
        type: datetime
        source: computed
        description: "Server-stamped logical-clock instant at which the entry was created."
      - name: offer_expires_at
        type: datetime
        source: computed
        description: "Logical-clock instant after which an OFFERED hold lapses; set to current_utc + OFFER_WINDOW_MINUTES when the offer is made."
      - name: status
        type: enum
        source: system
        description: "Waitlist hold state."
        constraints: "one of {ACTIVE, STANDBY, OFFERED, CLAIMED, EXPIRED, CANCELLED}"
      - name: position_mode
        type: enum
        source: input
        description: "How this hold's raw_sequence_no participates in the effective ordering."
        constraints: "one of {QUEUED, STANDBY_ANY}; STANDBY_ANY is the slotless mode"
      - name: raw_sequence_no
        type: integer
        source: computed
        description: "The stay-in-line counter as assigned at join time, retained even when position_mode is STANDBY_ANY so the client can be restored to a numbered slot."
      - name: effective_sequence
        type: integer
        source: computed
        description: "min(raw_sequence_no, 0) when position_mode == STANDBY_ANY, and raw_sequence_no otherwise; this is the value the offer ordering ranks on."
      - name: promoted_booking_id
        type: string
        source: computed
        description: "FK -> Booking.id; set when the hold is reclaimed by the client or auto-claimed by the expiry sweep."

  # ---------------------------------------------------------------------------
  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the member."
      - name: plan_name
        type: string
        source: input
        description: "Display name of the membership plan this row instantiates; plan terms are folded onto the row so a plan revision never mutates a live membership."
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring charge per monthly cycle, in integer cents."
        constraints: "integer >= 0"
      - name: included_credits_per_cycle
        type: integer
        source: input
        description: "Class credits granted at the start of each monthly cycle."
        constraints: "integer >= 0"
      - name: minimum_term_months
        type: integer
        source: input
        description: "Number of charged cycles that must elapse before an early-termination fee is waived."
      - name: freeze_allowed
        type: boolean
        source: input
        description: "Whether this membership may be frozen at all."
      - name: freeze_max_days_per_cycle
        type: integer
        source: input
        description: "Maximum frozen calendar days within a single monthly cycle."
        constraints: "integer >= 0"
      - name: billing_anchor_day
        type: integer
        source: input
        description: "Day-of-month anchor the monthly billing cycle is pinned to."
        constraints: "integer in [1, 28]"
      - name: current_period_index
        type: integer
        source: computed
        description: "Elapsed monthly cycles since activation; starts at 0."
      - name: next_billing_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the next recurring charge; advanced by exactly one calendar month per charged renewal."
      - name: auto_renew
        type: boolean
        source: input
        default: true
        description: "Whether the membership renews at next_billing_at."
      - name: freeze_start_at
        type: datetime
        source: computed
        description: "Start of the current freeze window; null while not frozen."
      - name: freeze_resume_at
        type: datetime
        source: computed
        description: "Instant the current freeze ends; null while not frozen."
      - name: freeze_days_used
        type: integer
        source: computed
        description: "Contract-year running total of frozen calendar days, capped at FREEZE_ANNUAL_CAP_DAYS."
      - name: prorated_fee_cents
        type: integer
        source: computed
        description: "The monthly fee as adjusted by the most recently posted freeze window, per the membership_freeze_proration calculation."
      - name: open_balance_cents
        type: integer
        source: computed
        description: "Unpaid recurring charges; increases by the plan's monthly fee on each expired unfrozen renewal and increases further when the dunning late fee applies."
      - name: status
        type: enum
        source: system
        description: "Membership life-cycle state."
        constraints: "one of {PENDING, ACTIVE, FROZEN, PAST_DUE, LAPSED, CANCELLED, EXPIRED}"


  # ---------------------------------------------------------------------------
  - name: ClassPack
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the pack holder."
      - name: pack_size
        type: integer
        source: input
        description: "Number of sessions the pack originally contained."
        constraints: "integer >= 1"
      - name: credits_remaining
        type: integer
        source: computed
        description: "Session credits left; decremented by each ClassPack booking and restored by its compensating cancellation."
      - name: purchased_at
        type: datetime
        source: input
        description: "Purchase instant, supplied by the studio."
      - name: expires_at
        type: datetime
        source: computed
        description: "purchased_at + PACK_VALIDITY_DAYS at creation; extended by the pack-extension workflow."
      - name: extension_days_used
        type: integer
        source: computed
        description: "Contract-lifetime total of granted extension days; further extensions are rejected once the total would exceed PACK_MAX_EXTENSION_DAYS."
      - name: status
        type: enum
        source: system
        description: "Pack life-cycle state."
        constraints: "one of {ACTIVE, EXPIRED, DEPLETED, FROZEN}"
      - name: pending_expiry_grace_until
        type: datetime
        source: computed
        description: "End of the fixed expiry grace window during which remaining credits may still be spent; null outside that window."


  # ---------------------------------------------------------------------------
  - name: BenefitNetwork
    parent: null
    common_fields: false
    fields:
      - name: network_code
        type: string
        source: input
        description: "Short network identifier, e.g. 'WELLPASS'."
      - name: name
        type: string
        source: input
        description: "Full display name of the wellness benefit network."
      - name: per_visit_allowance_cents
        type: integer
        source: input
        description: "Amount the network pays the studio per qualifying visit."
        constraints: "integer >= 0"
      - name: reimburse_full_list_price
        type: boolean
        source: input
        description: "When true the network's remittance equals the booking's list price; when false the remittance is capped at per_visit_allowance_cents."
      - name: remit_days_after_visit
        type: integer
        source: input
        description: "Calendar days after the attended visit on which the network remits and the studio's receivable is recognised."
        constraints: "integer >= 0"
      - name: claim_denial_window_hours
        type: integer
        source: input
        description: "Hours after claim submission during which a DENIED claim may be resubmitted."
        constraints: "integer >= 0"

  # ---------------------------------------------------------------------------
  - name: CommissionEntry
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio."
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the instructor the commission is owed to."
      - name: payroll_period_id
        type: string
        source: input
        description: "FK -> PayrollPeriod.id; the run this entry will be paid in."
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the attended booking that produced this entry."
      - name: booking_channel
        type: enum
        source: computed
        description: "Channel of the producing booking; selects the commission base rate."
        constraints: "one of {STUDIO, MARKETPLACE}"
      - name: base_amount_cents
        type: integer
        source: computed
        description: "Channel-adjusted revenue the commission is computed on: Booking.commission_base_cents for STUDIO, and commission_base_cents − marketplace commission for MARKETPLACE."
      - name: rate_bps
        type: integer
        source: computed
        description: "Effective commission rate applied to base_amount_cents, taken from the staff member's template-specific rate."
      - name: commission_cents
        type: integer
        source: computed
        description: "Commission owed by the studio to the instructor for this entry after all variant adjustments."
      - name: status
        type: enum
        source: system
        description: "Commission accrual state."
        constraints: "one of {ACCRUED, PAID, REVERSED}"
      - name: reversal_reason
        type: string
        source: computed
        description: "Reason stamped when the entry is REVERSED by the booking reversal cascade; null while ACCRUED or PAID."

  # ---------------------------------------------------------------------------
  - name: PayrollPeriod
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; owning studio."
      - name: period_index
        type: integer
        source: input
        description: "Sequential period number within the studio; periods are disjoint inclusive date ranges."
        constraints: "integer >= 1"
      - name: start_date
        type: datetime
        source: input
        description: "Inclusive start of the payroll period."
      - name: end_date
        type: datetime
        source: input
        description: "Inclusive end of the payroll period; every payroll period spans at least MIN_PAYROLL_PERIOD_DAYS calendar days including both endpoints."
      - name: accrued_commission_cents
        type: integer
        source: computed
        description: "Sum of CommissionEntry.commission_cents for entries in this period whose status == ACCRUED."
      - name: paid_commission_cents
        type: integer
        source: computed
        description: "Sum of CommissionEntry.commission_cents for entries in this period whose status == PAID."
      - name: reversal_correction_cents
        type: integer
        source: computed
        description: "Signed correction posted when a PAID entry is reversed; subtracts the original commission from the next open period."
      - name: status
        type: enum
        source: system
        description: "Payroll run state; OPEN and LOCKED are non-terminal, CLOSED is terminal."
        constraints: "one of {OPEN, LOCKED, CLOSED}"

  # ---------------------------------------------------------------------------
  - name: ClientPortabilityRequest
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; the studio being asked to release the client roster."
      - name: requesting_client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose data portability is being asserted."
      - name: dispute_reason
        type: string
        source: input
        description: "Free-text reason recorded for the portability dispute."
      - name: requested_at
        type: datetime
        source: computed
        description: "Server-stamped logical-clock instant the request was accepted."
      - name: decided_at
        type: datetime
        source: computed
        description: "Server-stamped logical-clock instant the request reached a terminal state."
      - name: export_grant_id
        type: string
        source: computed
        description: "Opaque identifier of the granted export, presented by the client when downloading."
      - name: export_manifest
        type: object
        source: computed
        description: "Frozen record of the granted roster: {record_count, record_digest, source_studio_ids[], generated_at_utc, booking_history_included, financial_history_included}."
      - name: export_download_count
        type: integer
        source: computed
        description: "Number of times the export has been downloaded; capped by EXPORT_MAX_DOWNLOADS."
      - name: status
        type: enum
        source: system
        description: "Portability dispute life-cycle state."
        constraints: "one of {PENDING, OBJECTED, RESOLVED_RELEASE, RESOLVED_DENIED, EXPORT_ISSUED, EXPIRED, WITHDRAWN}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  # --- Compound / posture-driven: the tenant posture gates every child op. ----
  - entity: Studio
    field: status
    initial_state: TRIAL
    terminal_states: [CANCELLED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /wellness/subscriptions/{id}/advance-renewal  (renewal_epoch advances and the charge settles)"
        actor: StudioOwner
        preconditions:
          - "Subscription.status IN {TRIAL, ACTIVE, GRACE}"
          - "now_utc < Subscription.grace_until"
        side_effects:
          - "Subscription.renewal_epoch increments by 1; Studio posture is re-derived to ACTIVE because Subscription.status == ACTIVE"
          - "Studio.data_ownership_state is re-derived to OWNED — not persisted independently"
          - "recruitment of staff, sessions, memberships and bookings becomes permitted again"

      - from: [TRIAL, ACTIVE, SUSPENDED]
        to: SUSPENDED
        trigger: "POST /wellness/subscriptions/{id}/suspend"
        actor: StudioOwner
        preconditions:
          - "Subscription.dunning_stage == SUSPENDED"
        side_effects:
          - "Subscription.status → SUSPENDED; Studio.suspension_reason is stamped from the caller's reason"
          - "every ClassSession of this studio with status SCHEDULED is re-derived by the cascade below (depth 3)"
          - "StaffMember.status for every ACTIVE instructor → INACTIVE; each of those staff's ACCRUED CommissionEntry rows are not paid this period but remain payable once the studio is reinstated"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wellness/subscriptions/{id}/resume"
        actor: StudioOwner
        preconditions:
          - "now_utc <= Subscription.grace_until"
        side_effects:
          - "Subscription.dunning_stage → CURRENT; Subscription.grace_until is set to now_utc"
          - "Studio.suspension_reason is cleared"
          - "StaffMember rows previously demoted to INACTIVE are NOT re-automated — the studio must re-activate them explicitly"

      - from: [TRIAL, ACTIVE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /wellness/studios/{id}/cancel"
        actor: StudioOwner
        preconditions:
          - "Studio has no PayrollPeriod in status OPEN with accrued_commission_cents > 0"
        side_effects:
          - "all ClassSession rows still in SCHEDULED are re-derived to CANCELLED_BY_STUDIO; each of those sessions' RESERVED bookings and ACTIVE/OFFERED waitlist holds are released (this is the depth-3 leg of the suspension cascade)"
          - "every Membership of this studio → CANCELLED"
          - "every ClassSession with promo_offer_state IN {SCHEDULED, ACTIVE} → promo_offer_state WITHDRAWN"
          - "ClientPortabilityRequest rows in {PENDING, OBJECTED} remain actionable, which is what keeps the portability workflow reachable after the studio is terminal"

  # --- Branching with a cyclic re-try edge (dunning falls back to ACTIVE) ------
  - entity: BusinessSubscription
    field: status
    initial_state: TRIAL
    terminal_states: [CANCELLED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /wellness/subscriptions/{id}/advance-renewal with outcome SUCCEEDED"
        actor: StudioOwner
        preconditions:
          - "now_utc >= Subscription.renewal_due_at"
        side_effects:
          - "renewal_epoch increments by 1; renewal_due_at advances by exactly 30 days; grace_until is set to the new renewal_due_at"
          - "dunning_stage → CURRENT"
          - "Studio.status is re-derived to ACTIVE"

      - from: [TRIAL, ACTIVE, GRACE]
        to: PAST_DUE
        trigger: "POST /wellness/subscriptions/{id}/advance-renewal with outcome FAILED"
        actor: StudioOwner
        preconditions:
          - "now_utc >= Subscription.renewal_due_at"
        side_effects:
          - "dunning_stage → RETRY_SCHEDULED"
          - "raw_sequence_no of every non-terminal WaitlistEntry in a ClassSession whose start_at < now_utc + OFFER_WINDOW_MINUTES increments by 1 and effective_sequence is recomputed — an instructor substitution hold outranks the oldest consumer hold for the duration of the retry window"

      - from: PAST_DUE
        to: GRACE
        trigger: "system (the logical clock advances past Subscription.renewal_due_at with no successful charge)"
        actor: system
        preconditions:
          - "now_utc > Subscription.renewal_due_at"
        side_effects:
          - "grace_until is set to now_utc + GRACE_PERIOD_DAYS"
          - "Studio.status remains ACTIVE during GRACE — booking and POS stay permitted"

      - from: GRACE
        to: SUSPENDED
        trigger: "system (the logical clock advances past Subscription.grace_until)"
        actor: system
        preconditions:
          - "now_utc > Subscription.grace_until"
        side_effects:
          - "dunning_stage → SUSPENDED; payroll_hold → true"
          - "Studio.status is re-derived to SUSPENDED"
          - "Studio.status → SUSPENDED cascades onto every SCHEDULED ClassSession of the studio: each such session → CANCELLED_BY_STUDIO, and each of its ACTIVE/OFFERED WaitlistEntry rows → EXPIRED  (depth 3: the subscription lapse causes the session closure, and the session closure causes the waitlist purge)"

      - from: SUSPENDED
        to: GRACE
        trigger: "POST /wellness/subscriptions/{id}/resume"
        actor: StudioOwner
        preconditions:
          - "now_utc <= Subscription.grace_until"
        side_effects:
          - "dunning_stage → CURRENT; status → GRACE; grace_until is reset to now_utc"
          - "Studio.status is re-derived to ACTIVE"

      - from: [PAST_DUE, GRACE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /wellness/subscriptions/{id}/cancel"
        actor: StudioOwner
        preconditions: []
        side_effects:
          - "every PAID CommissionEntry of this studio's most recently LOCKED PayrollPeriod receives a reversal_correction_cents equal to the negation of commission_cents, posted to the studio's next OPEN period"
          - "payroll_hold → true permanently; Studio.status is re-derived to CANCELLED"

  # --- Compound with parallel dimensions (execution × payroll lifecycle) ------
  - entity: ClassSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_BY_STUDIO]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (logical clock reaches start_at)"
        actor: system
        preconditions: []
        side_effects:
          - "no new Booking may be created against this session once it is IN_PROGRESS"
          - "Booking.status remains an independent dimension: an IN_PROGRESS session may still hold RESERVED bookings"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (logical clock reaches end_at)"
        actor: system
        preconditions: []
        side_effects:
          - "every Booking of this session still in RESERVED → NO_SHOW; Client.no_show_strike_count increments by 1 for each such client; Booking.booking_fee_cents is set by the no_show_fee calculation and fee_status → CHARGED"
          - "every Booking already in CHECKED_IN → ATTENDED and a CommissionEntry is accrued for the instructor of this session (commission_accrual calculation)"
          - "ClassSession.seats_taken is recomputed from the post-transition booking set"
          - "the CHECKED_IN → ATTENDED leg is the first link of the payroll cascade described under CommissionEntry"

      - from: [SCHEDULED, IN_PROGRESS]
        to: CANCELLED_BY_STUDIO
        trigger: "POST /wellness/class-sessions/{id}/cancel"
        actor: StudioOwner
        preconditions:
          - "ClassSession.status == SCHEDULED or IN_PROGRESS"
        side_effects:
          - "every Booking of this session in {RESERVED, CHECKED_IN} → CANCELLED with fee_status NONE (studio-side cancellation never fees the client)"
          - "every WaitlistEntry of this session in {ACTIVE, STANDBY, OFFERED} → EXPIRED; raw_sequence_no is preserved for audit but the hold no longer consumes ClassSession.seats_held"
          - "fullness_posture is re-derived to CANCELLED, which is what blocks any further booking attempt on this session"
          - "class-pack credits and membership credits charged for the cancelled bookings are restored by the pack_refund_restoration calculation"

  # --- Cyclic: a claimed seat can be revoked back to the waitlist -------------
  - entity: WaitlistEntry
    field: status
    initial_state: ACTIVE
    terminal_states: [CLAIMED, EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: OFFERED
        trigger: "system (a seat opens on the session: a Booking leaves RESERVED or ClassSession.capacity increases)"
        actor: system
        preconditions:
          - "ClassSession.seats_taken + ClassSession.seats_held < ClassSession.capacity for the target session"
          - "this entry ranks first in the session's offer ordering under the waitlist_offer_order calculation"
        side_effects:
          - "offer_expires_at is set to now_utc + OFFER_WINDOW_MINUTES"
          - "ClassSession.seats_held increments by 1 and fullness_posture is re-derived (OPEN → WAITLIST_ONLY when the last free seat is consumed by a hold)"

      - from: OFFERED
        to: CLAIMED
        trigger: "POST /wellness/waitlist-entries/{id}/claim"
        actor: Client
        preconditions:
          - "now_utc <= offer_expires_at"
          - "the owning Client's status is ACTIVE or FROZEN"
        side_effects:
          - "a Booking is created for this client on the session with channel STUDIO and payment_source inherited from the client's active entitlement; the new Booking.status is RESERVED and its id is written to WaitlistEntry.promoted_booking_id"
          - "ClassSession.seats_held decrements by 1 and seats_taken increments by 1"
          - "dunning_stage is unchanged for the studio; the claim does not itself bill the client"

      - from: OFFERED
        to: EXPIRED
        trigger: "system (the logical clock advances past offer_expires_at)"
        actor: system
        preconditions:
          - "now_utc > offer_expires_at"
        side_effects:
          - "the seat is offered onward: this session's next-lowest-sequence ACTIVE entry becomes OFFERED with a fresh offer_expires_at (depth 2 — the expiry causes a re-offer)"
          - "if no ACTIVE entry remains, ClassSession.seats_held decrements by 1 and fullness_posture is re-derived toward OPEN"

      - from: CLAIMED
        to: ACTIVE
        trigger: "POST /wellness/bookings/{id}/reverse-claim"
        actor: StudioOwner
        preconditions:
          - "the promoted Booking of this entry is in status RESERVED"
          - "the owning Client's no_show_strike_count < STRIKE_REVOCATION_THRESHOLD"
        side_effects:
          - "the promoted Booking → CANCELLED and its class-pack or membership credit is restored by pack_refund_restoration"
          - "this entry's position_mode is reset to QUEUED and raw_sequence_no is reassigned to max(raw_sequence_no) + 1 for the session — never to 0 — so the client rejoins at the back of the line without losing the hold"

      - from: STANDBY
        to: ACTIVE
        trigger: "POST /wellness/waitlist-entries/{id}/confirm-position"
        actor: Client
        preconditions:
          - "now_utc <= joined_at + STANDBY_CONFIRM_WINDOW_MINUTES"
        side_effects:
          - "position_mode → QUEUED and effective_sequence is recomputed to raw_sequence_no, which may place the hold behind consumers who joined later"

      - from: [ACTIVE, STANDBY]
        to: CANCELLED
        trigger: "POST /wellness/waitlist-entries/{id}/cancel"
        actor: Client
        preconditions: []
        side_effects:
          - "ClassSession.seats_held is untouched because neither an ACTIVE nor a STANDBY entry holds a seat; fullness_posture is unchanged"

      - from: OFFERED
        to: CANCELLED
        trigger: "POST /wellness/waitlist-entries/{id}/cancel"
        actor: Client
        preconditions: []
        side_effects:
          - "the seat is offered onward to the lowest-sequence remaining ACTIVE entry (depth 2), identically to the expiry path"
          - "ClassSession.seats_held decrements by 1"

  # --- Self-referential: a substitute instructor may themselves be substituted -
  - entity: StaffMember
    field: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUBSTITUTE_ONLY
        trigger: "POST /wellness/staff-members/{id}/restrict-to-substitute"
        actor: StudioOwner
        preconditions: []
        side_effects:
          - "no new ClassSession may name this staff member as instructor_staff_id"
          - "existing SCHEDULED sessions naming this staff member remain valid and are not re-derived"

      - from: SUBSTITUTE_ONLY
        to: ACTIVE
        trigger: "POST /wellness/staff-members/{id}/reinstate"
        actor: StudioOwner
        preconditions: []
        side_effects:
          - "the staff member may again be named as a primary instructor"

      - from: [ACTIVE, SUBSTITUTE_ONLY]
        to: INACTIVE
        trigger: "POST /wellness/staff-members/{id}/deactivate"
        actor: StudioOwner
        preconditions:
          - "no ClassSession of this studio names this staff member as instructor_staff_id with status IN {SCHEDULED, IN_PROGRESS} unless a substitute is already named via a substitution request in status ACCEPTED"
        side_effects:
          - "BusinessSubscription.staff_seat_count decrements by 1 and seat_overage_count is recomputed"
          - "an ACCEPTED substitution for this staff member's open sessions is re-checked; if the substitute is itself INACTIVE the substitution is voided and the affected ClassSession rows revert to naming the original instructor"
          - "every ACCRUED CommissionEntry of this staff member remains payable — deactivation does not forfeit accrued commission"

  # --- Compound payroll machine with a reopening edge -------------------------
  - entity: PayrollPeriod
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /wellness/payroll-periods/{id}/close"
        actor: StudioOwner
        preconditions:
          - "BusinessSubscription.payroll_hold == false"
          - "no ClassSession whose payroll_period_id == this period is still in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "every ACCRUED CommissionEntry of this period → PAID; payroll_period.paid_commission_cents is recomputed"
          - "no further CommissionEntry may be accrued into this period"

      - from: LOCKED
        to: OPEN
        trigger: "POST /wellness/payroll-periods/{id}/reopen"
        actor: StudioOwner
        preconditions:
          - "now_utc < end_date + PAYROLL_REOPEN_WINDOW_DAYS"
        side_effects:
          - "every PAID CommissionEntry of this period → ACCRUED again and payroll_period.paid_commission_cents is recomputed"
          - "the accrual block is lifted"

      - from: LOCKED
        to: CLOSED
        trigger: "system (the logical clock passes end_date + PAYROLL_REOPEN_WINDOW_DAYS)"
        actor: system
        preconditions: []
        side_effects:
          - "the period is frozen permanently; reversal_correction_cents for any subsequent reversal of its entries are posted to the next open period instead"

  # --- Cyclic: a grant can lapse and be re-issued on the same row ------------
  - entity: ClientPortabilityRequest
    field: status
    initial_state: PENDING
    terminal_states: [RESOLVED_DENIED, EXPIRED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: OBJECTED
        trigger: "POST /wellness/portability-requests/{id}/object"
        actor: StudioOwner
        preconditions:
          - "now_utc < requested_at + PORTABILITY_RESPONSE_WINDOW_HOURS"
        side_effects:
          - "Studio.data_ownership_state → PORTABILITY_PENDING"

      - from: PENDING
        to: RESOLVED_RELEASE
        trigger: "POST /wellness/portability-requests/{id}/resolve-release"
        actor: StudioOwner
        preconditions:
          - "requesting Client.outstanding_fee_cents == 0"
          - "Studio.data_ownership_state IN {OWNED, PORTABILITY_PENDING}"
        side_effects:
          - "Studio.data_ownership_state → PORTABILITY_GRANTED"
          - "the requesting Client.status → PORTABILITY_HOLD, which removes that client's rows from Studio.client_roster_count until the export is issued"
          - "export_grant_id is minted; export_manifest is frozen from the roster captured at this instant"

      - from: PENDING
        to: RESOLVED_RELEASE
        trigger: "system (the response window lapses with no studio objection)"
        actor: system
        preconditions:
          - "now_utc >= requested_at + PORTABILITY_RESPONSE_WINDOW_HOURS"
        side_effects:
          - "identical grant effects to the explicit release; the studio's silence is treated as a release"
          - "Studio is stamped with a PORTABILITY_NONRESPONSE marker on its suspension_reason field without changing Studio.status"

      - from: PENDING
        to: RESOLVED_DENIED
        trigger: "POST /wellness/portability-requests/{id}/resolve-deny"
        actor: StudioOwner
        preconditions:
          - "dispute_reason is non-empty"
        side_effects:
          - "Studio.data_ownership_state returns to OWNED"

      - from: OBJECTED
        to: RESOLVED_RELEASE
        trigger: "POST /wellness/portability-requests/{id}/adjudicate with decision RELEASE"
        actor: PlatformAdmin
        preconditions:
          - "now_utc < decided_at is null and now_utc <= requested_at + PORTABILITY_ADJUDICATION_WINDOW_HOURS"
        side_effects:
          - "the grant effects above apply; the studio objection is recorded as unfounded"

      - from: OBJECTED
        to: RESOLVED_DENIED
        trigger: "system (the adjudication window lapses unresolved)"
        actor: system
        preconditions:
          - "now_utc > requested_at + PORTABILITY_ADJUDICATION_WINDOW_HOURS"
        side_effects:
          - "Studio.data_ownership_state returns to OWNED; the client may file a fresh request after the cooldown"

      - from: RESOLVED_RELEASE
        to: EXPORT_ISSUED
        trigger: "POST /wellness/portability-requests/{id}/issue-export"
        actor: PlatformAdmin
        preconditions:
          - "export_download_count < EXPORT_MAX_DOWNLOADS"
          - "now_utc <= decided_at + EXPORT_WINDOW_HOURS"
        side_effects:
          - "export_manifest.generated_at_utc is stamped and record_digest is frozen"
          - "the requesting Client.status moves from PORTABILITY_HOLD to PORTED only after EXPORT_MAX_DOWNLOADS downloads have been consumed"

      - from: EXPORT_ISSUED
        to: RESOLVED_RELEASE
        trigger: "system (the export window lapses on an export that was never downloaded)"
        actor: system
        preconditions:
          - "now_utc > decided_at + EXPORT_WINDOW_HOURS"
          - "export_download_count == 0"
        side_effects:
          - "export_grant_id and export_manifest are cleared, returning the row to the granted state so the export can be re-issued — this is the cycle"

      - from: RESOLVED_RELEASE
        to: EXPIRED
        trigger: "system (the export window lapses with no generated export)"
        actor: system
        preconditions:
          - "now_utc > decided_at + EXPORT_WINDOW_HOURS"
          - "export_manifest is null"
        side_effects:
          - "Studio.data_ownership_state returns to OWNED; the client must file a new request"

      - from: [PENDING, OBJECTED]
        to: WITHDRAWN
        trigger: "POST /wellness/portability-requests/{id}/withdraw"
        actor: Client
        preconditions:
          - "requesting Client.id == the acting client"
        side_effects:
          - "Studio.data_ownership_state returns to OWNED"

  # --- Cyclic: a no-show can be restored by a compensating action -------------
  - entity: Booking
    field: status
    initial_state: RESERVED
    terminal_states: [ATTENDED, CANCELLED, LATE_CANCELLED, WAITLISTED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /wellness/bookings/{id}/check-in"
        actor: Client
        preconditions:
          - "now_utc >= ClassSession.start_at - CHECKIN_OPEN_MINUTES"
          - "now_utc <= ClassSession.end_at"
          - "ClassSession.status == IN_PROGRESS"
        side_effects:
          - "ClassSession.seats_taken is unchanged (CHECKED_IN still occupies a seat) but fullness_posture is recomputed"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /wellness/bookings/{id}/cancel with now_utc <= start_at - LATE_CANCEL_WINDOW_MINUTES"
        actor: Client
        preconditions:
          - "now_utc <= ClassSession.start_at - LATE_CANCEL_WINDOW_MINUTES"
        side_effects:
          - "Booking.booking_fee_cents remains 0 and fee_status stays NONE"
          - "the class-pack credit or membership credit consumed by this booking is restored by pack_refund_restoration"
          - "ClassSession.seats_taken decrements by 1; the freed seat triggers the lowest-sequence ACTIVE WaitlistEntry of the session to become OFFERED, which itself re-derives fullness_posture (depth 2)"

      - from: RESERVED
        to: LATE_CANCELLED
        trigger: "POST /wellness/bookings/{id}/cancel with start_at - LATE_CANCEL_WINDOW_MINUTES < now_utc <= start_at"
        actor: Client
        preconditions:
          - "now_utc > ClassSession.start_at - LATE_CANCEL_WINDOW_MINUTES"
          - "now_utc <= ClassSession.start_at"
        side_effects:
          - "Booking.booking_fee_cents is set by the cancellation_fee calculation and fee_status → CHARGED"
          - "Client.late_cancel_count increments by 1; Client.outstanding_fee_cents increases by the fee"
          - "ClassSession.seats_taken decrements by 1 and the freed seat is offered to the waitlist exactly as in the in-window path"

      - from: RESERVED
        to: NO_SHOW
        trigger: "system (ClassSession reaches COMPLETED with this booking never checked in)"
        actor: system
        preconditions:
          - "now_utc >= ClassSession.end_at"
          - "Booking.status == RESERVED at the moment the session completes"
        side_effects:
          - "Booking.booking_fee_cents is set by the no_show_fee calculation; fee_status → CHARGED when the computed fee is above 0, and remains NONE when the first-offence waiver drives it to exactly 0"
          - "Client.no_show_strike_count increments by 1; Client.outstanding_fee_cents increases by the fee"

      - from: CHECKED_IN
        to: ATTENDED
        trigger: "system (ClassSession reaches COMPLETED)"
        actor: system
        preconditions:
          - "now_utc >= ClassSession.end_at"
        side_effects:
          - "channel_total_cents is computed and written to Booking.commission_base_cents"
          - "a CommissionEntry is accrued for ClassSession.instructor_staff_id with status ACCRUED, which is the first link of the depth-3 payroll cascade"

      - from: NO_SHOW
        to: RESERVED
        trigger: "POST /wellness/bookings/{id}/restore-no-show"
        actor: StudioOwner
        preconditions:
          - "the producing ClassSession completed within STRIKE_RESTORE_WINDOW_HOURS of now_utc"
          - "Client.no_show_strike_count >= 1"
        side_effects:
          - "Client.no_show_strike_count decrements by 1 and Client.outstanding_fee_cents decreases by Booking.booking_fee_cents; Booking.fee_status → WAIVED"
          - "Booking.booking_fee_cents is retained for audit but no longer counts toward Studio.outstanding_balance_cents"

      - from: RESERVED
        to: WAITLISTED
        trigger: "system (a seat is lost to a higher-priority substitution hold before start_at)"
        actor: system
        preconditions:
          - "ClassSession.seats_taken + ClassSession.seats_held > ClassSession.capacity"
          - "this booking has the highest sequence_no among RESERVED bookings of the session"
        side_effects:
          - "an ACTIVE WaitlistEntry is created for the same client and session with position_mode QUEUED and raw_sequence_no = max(raw_sequence_no) + 1"
          - "the class-pack credit consumed by the booking is restored by pack_refund_restoration"

  # --- Membership: a billing-cycle machine with freeze and lapse branches ----
  - entity: Membership
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /wellness/memberships/{id}/advance-cycle with the first charge settled"
        actor: StudioOwner
        preconditions:
          - "now_utc >= Membership.next_billing_at OR the caller supplies outcome CHARGED"
        side_effects:
          - "current_period_index becomes 1 and open_balance_cents takes the first cycle fee; included_credits_per_cycle credits are granted"

      - from: [ACTIVE, PAST_DUE]
        to: FROZEN
        trigger: "POST /wellness/memberships/{id}/freeze"
        actor: StudioOwner
        preconditions:
          - "Membership.freeze_allowed == true"
          - "Membership.freeze_days_used + requested days <= FREEZE_ANNUAL_CAP_DAYS (ERR_FREEZE_CAP_EXCEEDED otherwise)"
        side_effects:
          - "freeze_start_at = now_utc and freeze_resume_at = now_utc + freeze_days"
          - "prorated_fee_cents is posted by membership_freeze_proration against the days that actually elapse"
          - "the next cycle is skipped: a FROZEN membership advances by exactly one month with no charge"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /wellness/memberships/{id}/unfreeze"
        actor: StudioOwner
        preconditions:
          - "now_utc >= freeze_start_at"
        side_effects:
          - "freeze_days_used grows by the elapsed frozen days and the over-freeze penalty is applied when more days elapsed than were planned"
          - "the proration is recomputed against the elapsed window, not the requested one"

      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (a cycle charge falls due with the clock at or past the new next_billing_at)"
        actor: system
        preconditions:
          - "now_utc >= Membership.next_billing_at"
        side_effects:
          - "open_balance_cents grows by the cycle fee plus the dunning late fee; the membership may still be used while PAST_DUE"

      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /wellness/memberships/{id}/advance-cycle with the arrears settled"
        actor: StudioOwner
        preconditions: []
        side_effects:
          - "open_balance_cents is cleared back to 0 and current_period_index increments by 1"

      - from: [ACTIVE, PAST_DUE]
        to: LAPSED
        trigger: "system (the cycle falls due on a membership whose auto_renew is false)"
        actor: system
        preconditions:
          - "Membership.auto_renew == false"
        side_effects:
          - "next_billing_at is left unchanged and no further cycle is charged; the open balance is preserved for collection"

      - from: [ACTIVE, FROZEN, PAST_DUE, LAPSED]
        to: CANCELLED
        trigger: "POST /wellness/memberships/{id}/cancel"
        actor: StudioOwner
        preconditions:
          - "an early-termination fee is paid when current_period_index < minimum_term_months (ERR_EARLY_TERMINATION_FEE_REQUIRED otherwise)"
        side_effects:
          - "open_balance_cents is preserved for collection and no further cycle is charged"

      - from: [CANCELLED, LAPSED]
        to: EXPIRED
        trigger: "system (any read or sweep past the contract end)"
        actor: system
        preconditions:
          - "now_utc > next_billing_at + MEMBERSHIP_EXPIRY_GRACE_DAYS"
        side_effects:
          - "the membership is terminal; it remains queryable but admits no transition"

  # --- ClassPack: a credit-decay machine with a restore edge -----------------
  - entity: ClassPack
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /wellness/memberships/{id}/freeze on a client's concurrent membership"
        actor: StudioOwner
        preconditions: []
        side_effects:
          - "the pack's expiry clock is held: expires_at does not advance while the pack is FROZEN and the grace window is not entered"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /wellness/memberships/{id}/unfreeze on the same client's membership"
        actor: StudioOwner
        preconditions: []
        side_effects:
          - "the expiry clock resumes; expires_at is unchanged and the pack remains fully spendable"

      - from: ACTIVE
        to: DEPLETED
        trigger: "system (the last credit is consumed by a booking)"
        actor: system
        preconditions:
          - "ClassPack.credits_remaining == 0 after the booking debits it"
        side_effects:
          - "further bookings against this pack are refused with ERR_NO_ACTIVE_PACK"

      - from: DEPLETED
        to: ACTIVE
        trigger: "POST /wellness/bookings/{id}/cancel on the booking that emptied the pack"
        actor: Client
        preconditions: []
        side_effects:
          - "pack_refund_restoration returns the credit and credits_remaining becomes 1, so the depletion is reversible and no credit is destroyed"

      - from: [ACTIVE, FROZEN, DEPLETED]
        to: EXPIRED
        trigger: "POST /wellness/class-packs/{id}/sweep-expiry"
        actor: StudioOwner
        preconditions:
          - "now_utc >= ClassPack.expires_at"
        side_effects:
          - "pending_expiry_grace_until = expires_at + PACK_EXPIRY_GRACE_DAYS; unused credits return to the studio at one quarter of the remainder by pack_credit_expiry"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================

concurrency_rules:

  - rule_id: pack-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /wellness/class-packs"
    occ_field: "expected_client_version"
    description: |
      Creating a ClassPack against a Client whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created a pack or a membership for the same client (which
      legitimately supersedes the client's prior entitlement snapshot) and the
      current writer's view of the client is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: session-create-stale-subscription
    parent_entity: BusinessSubscription
    write_endpoint: "POST /wellness/class-sessions"
    occ_field: "expected_subscription_version"
    description: |
      Scheduling a ClassSession against a BusinessSubscription whose version has
      advanced since the studio last observed it is rejected. The tier and its
      feature gates are read from the subscription when the session is created, so a
      stale read may admit a session the subscription no longer authorises.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: seat_availability_posture
    trigger: "booking create/cancel, waitlist join/offer/expire, class-session create/cancel, capacity update"
    algorithm: constraint_propagation
    formula: |
      occupied       = ClassSession.seats_taken + ClassSession.seats_held
      open_seats     = ClassSession.capacity - occupied
      promo_reserved = ClassSession.promo_seats_allocated - ClassSession.promo_seats_used
                           when ClassSession.promo_offer_state == ACTIVE, else 0
      studio_seats   = max(0, open_seats - promo_reserved)
      if ClassSession.status == CANCELLED_BY_STUDIO:
        posture = CANCELLED
      elif open_seats <= 0:                     # <= not <: zero free seats is FULL
        posture = FULL
      elif studio_seats <= 0:                   # free seats exist, but none for the studio channel
        posture = WAITLIST_ONLY
      else:
        posture = OPEN
      Over-release floor: occupied may never be recomputed below the number of
      Booking rows in {RESERVED, CHECKED_IN, NO_SHOW} plus the number of
      WaitlistEntry rows in {OFFERED}. seats_held counts only OFFERED holds; an
      ACTIVE or STANDBY hold reserves nothing.
    input_set: "ClassSession rows whose status IN {SCHEDULED, IN_PROGRESS}, with their non-terminal Booking children and OFFERED WaitlistEntry children"
    constants:
      OVER_RELEASE_FLOOR: "seats_taken + count(OFFERED holds)"
    precision: "integer"
    variants:
      - name: studio_capacity_basis
        when: "the session is read through any studio-channel endpoint"
        difference: "posture is derived against the full capacity, so promo_reserved seats only ever push the studio toward WAITLIST_ONLY and never toward FULL"
      - name: marketplace_capacity_basis
        when: "the session is read through GET /wellness/marketplace/classes/{id}"
        difference: "capacity is reduced by promo_reserved before the comparison, so a session the studio reports as OPEN can be reported FULL through the marketplace read of the same row"

  - name: channel_total_cents
    trigger: "Booking creation, booking reversal, session repricing"
    algorithm: tiered_pricing
    formula: |
      if Booking.payment_source == BENEFIT_NETWORK:
        gross = list_price_cents of the producing ClassSession
      elif the booking consumed a ClassPack credit:
        gross = 0            # the revenue was recognised at pack purchase
      elif the booking consumed a Membership credit:
        gross = 0            # the revenue was recognised at the monthly cycle charge
      else:
        gross = effective seat price for the booking's channel

      Rounding order is pinned: compute each component in integer cents and
      round half up ONCE, at the end of the channel-price selection, never
      per component. Rounding each component then subtracting produces
      different cents when commission_bps is not a multiple of 100.
      effective seat price =
        STUDIO channel:      floor(list_price_cents * (10000 - promo_discount_bps) / 10000)
        MARKETPLACE channel: ceil(list_price_cents * 10000 / (10000 - commission_bps))

      channel_total_cents = gross
      Studio gross revenue for the booking is channel_total_cents minus
      marketplace_commission_cents when the channel is MARKETPLACE, and
      channel_total_cents otherwise.
    input_set: "the booking's attended or fee-bearing row, with its ClassSession and the studio's SubscriptionTier"
    constants:
      COMMISSION_BPS_GROWTH: 1500
      COMMISSION_BPS_ENTERPRISE: 1200
      COMMISSION_BPS_STARTER: 2000
    precision: "integer cents, round_half_up applied once at the end of price selection"
    variants:
      - name: booked_variant
        when: "evaluated at Booking creation"
        difference: "uses the class-pack credit value for pack and membership bookings, which is 0 for pack-covered seats"
      - name: attended_variant
        when: "re-evaluated when the session completes and the booking becomes ATTENDED"
        difference: "uses the drop-in list price for pack and membership bookings as well, so the two variants disagree on the same booking: a pack-covered attended seat reports channel_total_cents > 0 under attended_variant and exactly 0 under booked_variant"

  - name: cancellation_fee
    trigger: "Booking RESERVED → LATE_CANCELLED"
    algorithm: threshold
    formula: |
      late = (now_utc > ClassSession.start_at - LATE_CANCEL_WINDOW_MINUTES)
      fee_pct = 1.00 if late else 0.00
      cancellation_fee_cents = 0 if Booking.payment_source == BENEFIT_NETWORK
      cancellation_fee_cents = 0 if the booking consumed a ClassPack credit
      cancellation_fee_cents = 0 if the booking consumed a Membership credit and
                                Client.late_cancel_count < MEMBER_FEE_STRIKE_THRESHOLD
      otherwise cancellation_fee_cents = floor(ClassSession.list_price_cents * fee_pct)
    input_set: "Booking rows entering LATE_CANCELLED from RESERVED, excluding bookings already in a fee-bearing state"
    constants:
      LATE_CANCEL_WINDOW_MINUTES: 720
      MEMBER_FEE_STRIKE_THRESHOLD: 3
    precision: "integer cents, floor truncation"

  - name: no_show_fee
    trigger: "Booking RESERVED → NO_SHOW at ClassSession completion"
    algorithm: threshold
    formula: |
      no_show_fee_cents = 0 if Client.no_show_strike_count < 2   # this count is the value BEFORE this no-show is recorded
      no_show_fee_cents = 0 if Booking.payment_source == BENEFIT_NETWORK
      no_show_fee_cents = floor(ClassSession.list_price_cents * (1 + 0.5 * min(2, Client.no_show_strike_count - 1)))
      The strike multiplier is capped at 2.0x; a client already at or above the cap
      never pays more than twice the list price.
    input_set: "Booking rows entering NO_SHOW from RESERVED"
    constants:
      FIRST_OFFENCE_FREE_STRIKES: 1
      STRIKE_MULTIPLIER_CAP: 2
    precision: "integer cents, floor truncation"

  - name: membership_billing_cycle
    trigger: "POST /wellness/memberships/{id}/advance-cycle, and the system path when the logical clock passes Membership.next_billing_at"
    algorithm: chronological
    formula: |
      if Membership.status == FROZEN:
        skip: the cycle does not advance and next_billing_at moves by exactly
        one calendar month without a charge — a FROZEN membership pays nothing
      elif Membership.auto_renew == false:
        Membership.status → LAPSED; next_billing_at is left unchanged
      else:
        current_period_index += 1
        next_billing_at advances by exactly one calendar month
        Membership.included_credits_per_cycle credits are granted
        open_balance_cents += Membership.monthly_fee_cents
        if now_utc >= next_billing_at:       # >= not >: the instant equal to the due date is inside the fee window
          open_balance_cents += floor(Membership.monthly_fee_cents * 0.10)
          Membership.status → PAST_DUE
    input_set: "Membership rows whose status IN {ACTIVE, PAST_DUE} (FROZEN rows are explicitly excluded from charging)"
    constants:
      DUNNING_LATE_FEE_PCT: 0.10
    precision: "integer cents, floor truncation"
    variants:
      - name: billing_day_chronological
        when: "the cycle is advanced in billing-anchor order"
        difference: "the late fee tests now_utc against the NEW next_billing_at, which is one month in the future, so the late fee fires only when the caller has advanced the clock past the new due date"
      - name: forward_looking
        when: "the cycle is advanced early, before next_billing_at"
        difference: "the late fee tests now_utc against the OLD next_billing_at, which the clock has not yet reached, so the same membership advances without any late fee"

  - name: pack_credit_expiry
    trigger: "POST /wellness/class-packs/{id}/sweep-expiry, and any read of a ClassPack"
    algorithm: decay_function
    formula: |
      expiry_moment = ClassPack.expires_at
      grace_moment   = ClassPack.expires_at + PACK_EXPIRY_GRACE_DAYS
      credits_returned_to_studio =
        credits_remaining_at_expiry + floor(credits_remaining_at_expiry / 4)
      Decrement order is pinned: credits are consumed one at a time in booking
      order, and the first credit consumed AFTER expiry_moment is billed at
      zero value (grace) while the second and later credits consumed after
      expiry_moment are billed at full list price.
    input_set: "ClassPack rows with credits_remaining > 0 whose expires_at <= now_utc"
    constants:
      PACK_EXPIRY_GRACE_DAYS: 14
      PACK_VALIDITY_DAYS: 180
      PACK_MAX_EXTENSION_DAYS: 90
      UNUSED_CREDIT_RETURN_DENOMINATOR: 4
    precision: "integer credits"

  - name: membership_freeze_proration
    trigger: "POST /wellness/memberships/{id}/freeze and POST /wellness/memberships/{id}/unfreeze"
    algorithm: proportional
    formula: |
      freeze_days = number of calendar days in [freeze_start_at, freeze_resume_at]
      if freeze_days > planned_freeze_days:
        freeze_days = max(0, planned_freeze_days - OVER_FREEZE_PENALTY_DAYS)
      proration_factor = 1 - min(freeze_days, Membership.freeze_max_days_per_cycle)
                              / DAYS_PER_CYCLE
      prorated_monthly_fee_cents = floor(Membership.monthly_fee_cents * proration_factor)
      freeze_days_used += freeze_days
      if freeze_days_used > FREEZE_ANNUAL_CAP_DAYS:
        the freeze extension is rejected (ERR_FREEZE_CAP_EXCEEDED) and no proration is posted
    input_set: "Membership rows transitioning into or out of FROZEN"
    constants:
      DAYS_PER_CYCLE: 30
      OVER_FREEZE_PENALTY_DAYS: 5
      FREEZE_ANNUAL_CAP_DAYS: 60
    precision: "integer cents, floor truncation"

  - name: commission_accrual
    trigger: "Booking CHECKED_IN → ATTENDED"
    algorithm: tiered_pricing
    formula: |
      tier      = Studio.subscription_tier
      base      = Booking.commission_base_cents
      teach_bps = StaffMember.commission_rate_bps if > 0 else INSTRUCTOR_TEACH_COMMISSION_BPS[tier]
      this booking is the FIRST attended booking of its session in ascending
      Booking.creation_seq order, and every later attended booking of the same
      session is a deputy seat:
        first attended booking → rate is teach_bps
        every deputy seat      → rate is INSTRUCTOR_DEPUTY_COMMISSION_BPS[tier]
      commission = floor(base * rate_bps / 10000)
      ceiling    = floor(PAYROLL_ACCRUAL_CEILING_CENTS * PAYROLL_TIER_MULTIPLIER[tier])
      bonus      = floor(base * MARKETPLACE_CHANNEL_BONUS_BPS / 10000)
      pay it out under the studio's configured order, and pin that order:
        Studio.payroll_cap_mode == BONUS_OUTSIDE_CAP:
            commission = min(commission, ceiling)
            if bonus >= CHANNEL_BONUS_THRESHOLD_CENTS: commission = commission + bonus
              # the ceiling is applied FIRST, so the channel bonus escapes the cap
        Studio.payroll_cap_mode == BONUS_INSIDE_CAP:
            if bonus >= CHANNEL_BONUS_THRESHOLD_CENTS: commission = commission + bonus
            commission = min(commission, ceiling)
              # the bonus is INSIDE the cap, so it is clipped away when the cap binds
      The two orders therefore disagree on identical booking data whenever the
      pre-bonus commission already exceeds the ceiling and the bonus clears
      CHANNEL_BONUS_THRESHOLD_CENTS.
    input_set: "CommissionEntry rows created by an attended booking, one entry per attended booking, first-in-session determined by ascending Booking.creation_seq"
    constants:
      INSTRUCTOR_TEACH_COMMISSION_BPS:
        STARTER: 2000
        GROWTH: 2500
        ENTERPRISE: 3000
      INSTRUCTOR_DEPUTY_COMMISSION_BPS:
        STARTER: 500
        GROWTH: 700
        ENTERPRISE: 900
      PAYROLL_ACCRUAL_CEILING_CENTS: 1200
      PAYROLL_TIER_MULTIPLIER:
        STARTER: 1.0
        GROWTH: 1.0
        ENTERPRISE: 1.25
      MARKETPLACE_CHANNEL_BONUS_BPS: 1000
      CHANNEL_BONUS_THRESHOLD_CENTS: 150
    precision: "integer cents, floor truncation per term then summed"
    variants:
      - name: bonus_outside_cap
        when: "Studio.payroll_cap_mode == BONUS_OUTSIDE_CAP"
        difference: "the ceiling is applied to the teaching commission first and the channel bonus is added afterwards, so the final commission strictly exceeds the ceiling whenever the bonus clears its threshold"
      - name: bonus_inside_cap
        when: "Studio.payroll_cap_mode == BONUS_INSIDE_CAP"
        difference: "the channel bonus is folded into the commission before the ceiling is applied, so the shipping-identical booking yields exactly the ceiling and the bonus is clipped away"

  - name: marketplace_commission
    trigger: "Booking creation on the MARKETPLACE channel, and the marketplace settlement read walk"
    algorithm: tiered_pricing
    formula: |
      commission_bps = SubscriptionTier.marketplace_commission_bps of the studio's tier
      booking_commission_cents = floor(Booking.commission_base_cents * commission_bps / 10000)
      Walk the non-terminal Booking rows of the studio in ascending created_at
      order, tie-broken by ascending Booking.creation_seq (the UUID id is NEVER
      used), accumulating a running floor:
        running_raw += commission_base_cents * commission_bps / 10000
        running_commission += floor(remaining_step) where remaining_step is the
        un-rounded accumulation, NOT the freshly floored per-booking value
      marketplace_commission_cents = running_commission
      The walking form and the per-booking form differ by at most 1 cent per
      row, and the difference is exactly the sum of the discarded fractional
      cents.
    input_set: "Booking rows of one studio whose channel == MARKETPLACE, in ascending (created_at, creation_seq) order"
    constants:
      MARKETPLACE_MIN_COMMISSION_CENTS: 50
      MARKETPLACE_PROMO_COMMISSION_BPS: 800
    precision: "integer cents, floor truncation of the running accumulator"

  - name: promotional_inventory_release
    trigger: "POST /wellness/promotional-allocations, the logical-clock expiry sweep, and session repricing"
    algorithm: waterfall_allocation
    formula: |
      eligible = ClassTemplate.is_off_peak AND ClassSession.status == SCHEDULED
      promo_price_cents = floor(ClassSession.list_price_cents * (10000 - ClassSession.promo_discount_bps) / 10000)
      released_seats = min(allocated_seats - seats_used - open_holds,
                           ClassSession.capacity - ClassSession.seats_taken)
      overflow = max(0, released_seats - free_seats_remaining)
      leftover seats cascade in this exact order, stopping at the FIRST bucket
      that can absorb them — every bucket after the first absorber receives 0:
        1. the next ClassSession of the SAME class_template_id whose promo_offer_state IN {SCHEDULED, ACTIVE} and whose promo_valid_to has not yet passed
        2. the next ClassSession of the SAME class_template_id, in ascending start_at order
        3. the studio's marketplace inventory, where the seats are offered at full marketplace price
      Rounding remainder: because released_seats is capped by the free seats of
      the target session, the allocation may close with seats_used < allocated_seats,
      in which case the request must report the shortfall rather than silently
      rounding it away.
    input_set: "ClassSession rows whose promo_offer_state IN {SCHEDULED, ACTIVE} and whose ClassTemplate is flagged is_off_peak"
    constants:
      PROMO_MIN_DISCOUNT_BPS: 500
      PROMO_MAX_DISCOUNT_BPS: 5000
      PROMO_DEFAULT_VALIDITY_DAYS: 21
    precision: "integer cents, floor truncation"

  - name: benefit_network_settlement
    trigger: "Booking CHECKED_IN → ATTENDED on a BENEFIT_NETWORK booking, and the remittance read walk"
    algorithm: forward_looking
    formula: |
      claim_amount_cents =
        if BenefitNetwork.reimburse_full_list_price: ClassSession.list_price_cents
        else: min(BenefitNetwork.per_visit_allowance_cents, ClassSession.list_price_cents)
      benefit_claim_status is SUBMITTED when the claim is written
      forward-looking receivable recognised at once:
        receivable = claim_amount_cents
        remit_at = ClassSession.end_at + BenefitNetwork.remit_days_after_visit days
      Denial handling: a claim denied within BenefitNetwork.claim_denial_window_hours
      may be resubmitted exactly once; the resubmission recomputes claim_amount_cents
      from the CURRENT list price, so a repricing between the two submissions changes
      the amount. A claim denied after that window is terminal and contributes 0 to
      the studio's forward-looking receivable.
    input_set: "Booking rows whose payment_source == BENEFIT_NETWORK and whose status == ATTENDED"
    constants:
      CLAIM_RESUBMIT_MAX: 1
      DEFAULT_REMIT_DAYS: 30
    precision: "integer cents, round_half_up"

  - name: pack_refund_restoration
    trigger: "Booking → CANCELLED, WaitlistEntry CLAIMED → ACTIVE, ClassSession → CANCELLED_BY_STUDIO"
    algorithm: conservation_law
    formula: |
      conservation invariants, pinned over named quantities:
        (1) CREDIT CONSERVATION
            sum(ClassPack.credits_remaining) + sum(credits consumed by bookings in {RESERVED, CHECKED_IN, ATTENDED})
            == sum(ClassPack.pack_size) - sum(credits voided by the expiry sweep)
            For every forward action (booking create) paired with its compensating
            action (booking cancel), the left-hand side is identical before and after.
        (2) STUDIO REVENUE CONSERVATION
            Sum over the studio of Booking.commission_base_cents for bookings in, or
            having passed through, status ATTENDED is invariant under every reversal
            and substitution event; the correction is posted as a CommissionEntry
            with status REVERSED (for ACCRUED entries) or as
            PayrollPeriod.reversal_correction_cents (for PAID entries), never by
            mutating commission_base_cents.
        (3) SEAT OCCUPANCY CONSERVATION
            ClassSession.seats_taken + ClassSession.seats_held + free seats
            == ClassSession.capacity at every quiescent instant; a released seat is
            either re-taken or held for exactly one OFFERED entry.
    input_set: "every reversal, cancellation, expiry and substitution event of the studio"
    constants:
      RESTORATION_WINDOW_HOURS: 48
    precision: "integer credits and integer cents"

  - name: waitlist_offer_order
    trigger: "seat release, capacity increase, offer expiry, offer cancellation"
    algorithm: topological
    formula: |
      candidate set (explicit): WaitlistEntry rows of the target session whose
        status IN {ACTIVE, STANDBY}
        AND joined_at <= now_utc
        AND NOT (Client.status IN {PORTABILITY_HOLD, PORTED, ANONYMIZED})
        AND NOT (Client.no_show_strike_count >= STRIKE_OFFER_BLOCK_THRESHOLD)
        AND ClassSession.status IN {SCHEDULED, IN_PROGRESS}
      ranking expression: ascending (effective_sequence, created_at, joined_at)
      tie-break: ascending created_at; if created_at is also equal, ascending joined_at.
        The entry's UUID id is NEVER used as a tie-break.
      empty-pool fallback: if the candidate set is empty the released seat is held
        for exactly OFFER_HOLD_HOLD_MINUTES and then released back to
        fullness_posture OPEN; no error is raised and no synthetic entry is created.
      eligibility for a specific hold type:
        - an instructor substitution hold requires StaffMember.staff_role == INSTRUCTOR
          and substitute_class_template_ids containing the session's class_template_id
    input_set: "WaitlistEntry rows of one ClassSession in status ACTIVE or STANDBY"
    constants:
      OFFER_WINDOW_MINUTES: 120
      OFFER_HOLD_HOLD_MINUTES: 30
      STRIKE_OFFER_BLOCK_THRESHOLD: 3
      STANDBY_CONFIRM_WINDOW_MINUTES: 90
    precision: "integer sequence numbers"
    variants:
      - name: raw_sequence_order
        when: "every non-terminal entry of the session has position_mode == QUEUED"
        difference: "ordering reduces to ascending raw_sequence_no"
      - name: effective_sequence_order
        when: "a hold with position_mode == STANDBY_ANY is present in the candidate pool"
        difference: "effective_sequence is min(raw_sequence, 0) with equal effective_sequence broken by ascending created_at; a STANDBY hold at effective_sequence 0 therefore always drains before any consumer hold, and two STANDBY holds are ordered by created_at"

  - name: instructor_substitution_priority
    trigger: "POST /wellness/substitution-requests and its resolution, and any staffing read"
    algorithm: weighted_scoring
    formula: |
      ladder: substitution_priority_score(instructor, session) =
          30 * class_template_match
        + 20 * level_fit
        + 15 * overlap_penalty_capped
        + 10 * substitution_history_score
        +  5 * early_acceptance_bonus
        +  3 * distance_bonus
        +  2 * rating_bonus
      class_template_match = 1 if session.class_template_id in instructor.substitute_class_template_ids else 0
      level_fit            = 1 if instructor.status == ACTIVE else 0.5   # SUBSTITUTE_ONLY scores half
      overlap_penalty_capped = 1 - min(1, overlapping_taught_minutes / 60)   # the penalty CAPS at 1.0, it does not go negative
      instructor.overlapping_taught_minutes is the total minutes this instructor
      is already scheduled to teach in any ClassSession whose [start_at, end_at)
      overlaps the target session's interval.
      Evaluation order is pinned: the overlap term is computed BEFORE the level
      term is applied, so a SUBSTITUTE_ONLY instructor with a full-hour overlap
      scores 0 on both and cannot outrank a partially-overlapping ACTIVE
      instructor.
      ranking: descending substitution_priority_score
      tie-break: ascending created_at of the instructor; the UUID id is NEVER used.
      empty-pool fallback: ERR_NO_ELIGIBLE_SUBSTITUTE.
    input_set: "StaffMember rows of the studio with staff_role == INSTRUCTOR, excluding the instructor of record for the session under consideration"
    constants:
      TEMPLATE_WEIGHT: 30
      LEVEL_WEIGHT: 20
      OVERLAP_WEIGHT: 15
      HISTORY_WEIGHT: 10
      EARLY_WEIGHT: 5
      DISTANCE_WEIGHT: 3
      RATING_WEIGHT: 2
      STANDBY_HISTORY_BONUS: 1
      MAX_OVERLAP_HOURS: 1
    precision: "score as one decimal place, round_half_up; bonuses summed as integers before ranking"
    variants:
      - name: legacy_flat_weights
        when: "the studio's tier is STARTER"
        difference: "the template match and the overlap penalty are fused into one 30-point term (30 * class_template_match * overlap_penalty_capped) instead of 30 and 15 separately, so a template match with a full-hour overlap loses the whole 30 while the level term still applies"
      - name: ladder_weights
        when: "the studio's tier is GROWTH or ENTERPRISE"
        difference: "the two terms are scored apart (30 * class_template_match + 15 * overlap_penalty_capped), so the same two instructors can invert rank relative to the legacy variant"

  - name: session_list_price
    trigger: "class-session creation, class-session update, and any repricing"
    algorithm: tiered_pricing
    formula: |
      base          = ClassTemplate.base_price_cents
      off_peak_bps  = 8000 if ClassTemplate.is_off_peak else 10000
      tier_bps      = TIER_PRICE_BPS[Studio.subscription_tier]
      raw           = floor(base * off_peak_bps * tier_bps / 100000000)
      list_price_cents = max(raw, TIER_PRICE_FLOOR_CENTS[Studio.subscription_tier])
      marketplace_price_cents = ceil(list_price_cents * 10000 / (10000 - commission_bps))
      where commission_bps = SubscriptionTier.marketplace_commission_bps of the studio's tier.
      Evaluation order is pinned: the off-peak factor is applied BEFORE the tier
      factor, and the tier floor is applied AFTER the product — so the floor never
      rescales a discounted price.
    input_set: "ClassSession rows in {SCHEDULED, IN_PROGRESS} together with their ClassTemplate and the studio's effective tier"
    constants:
      TIER_PRICE_BPS:
        STARTER: 10000
        GROWTH: 10500
        ENTERPRISE: 11000
      TIER_PRICE_FLOOR_CENTS:
        STARTER: 1500
        GROWTH: 1800
        ENTERPRISE: 2000
    precision: "integer cents; floor for the discount path, ceil for the marketplace gross-up"
    variants:
      - name: base_floor_binding
        when: "the tier floor exceeds the discounted product"
        difference: "list_price_cents is the floor, so two sessions with different base prices collapse to the same price at the same tier and off-peak flag"
      - name: product_binding
        when: "the discounted product exceeds the tier floor"
        difference: "list_price_cents is the product, so the off-peak factor and the tier factor both move the price"

  - name: payroll_period_coverage
    trigger: "class-session create/update, payroll-period create, payroll close"
    algorithm: threshold
    formula: |
      a session belongs to the payroll period P whose inclusive range satisfies
        P.start_date <= ClassSession.start_at <= P.end_date
      if exactly one P qualifies, payroll_period_id = P.id
      if zero qualify, the operation is rejected with ERR_PAYROLL_PERIOD_GAP
      a new payroll period is admissible only when its inclusive range is disjoint
        from every existing period of the studio AND spans at least
        MIN_PAYROLL_PERIOD_DAYS calendar days including both endpoints
      boundary precision: a period ending at 2026-09-30T00:00:00Z and a period
        starting at 2026-09-30T00:00:00Z are NOT disjoint, because both ranges
        include that instant.
    input_set: "ClassSession.start_at values against the studio's PayrollPeriod ranges"
    constants:
      MIN_PAYROLL_PERIOD_DAYS: 7
    precision: "integer day counts; timestamps compared as instants, not as dates"

  - name: operational_windows
    trigger: "check-in, waitlist join and claim, no-show restore, portability object/resolve/adjudicate/issue/download, benefit-claim resubmission"
    algorithm: threshold
    formula: |
      admitted = (now_utc >= ClassSession.start_at - CHECKIN_OPEN_MINUTES)
              and (now_utc <= ClassSession.end_at)
      portable = (now_utc < ClientPortabilityRequest.requested_at + PORTABILITY_RESPONSE_WINDOW_HOURS)
      adjudicable = (now_utc <= requested_at + PORTABILITY_ADJUDICATION_WINDOW_HOURS)
      exportable = (now_utc <= decided_at + EXPORT_WINDOW_HOURS)
                       and (export_download_count < EXPORT_MAX_DOWNLOADS)
      restorable = (now_utc <= ClassSession.end_at + STRIKE_RESTORE_WINDOW_HOURS)
      every comparison is strict-or-equal exactly as written above; the instant
      equal to the window edge is INSIDE the window.
    input_set: "every time-gated operational check in §1.4 priority 6 and priority 9"
    constants:
      CHECKIN_OPEN_MINUTES: 60
      STRIKE_RESTORE_WINDOW_HOURS: 72
      STRIKE_REVOCATION_THRESHOLD: 5
      PORTABILITY_RESPONSE_WINDOW_HOURS: 168
      PORTABILITY_ADJUDICATION_WINDOW_HOURS: 336
      EXPORT_WINDOW_HOURS: 72
      EXPORT_MAX_DOWNLOADS: 3
      PORTABILITY_COOLDOWN_DAYS: 30

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared §1.7 role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints except GET /wellness/subscription-tiers and GET /wellness/subscription-tiers/{id} and the two POST /_clock and /_inject endpoints, which are OperatorOnly"

  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "path resources exist, checked left to right in path order; then body foreign keys in the order the endpoint's §1.5 input list declares them"
    error_id: "ERR_STUDIO_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_CLIENT_NOT_FOUND / ERR_CLASS_SESSION_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_WAITLIST_ENTRY_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND / ERR_CLASS_PACK_NOT_FOUND / ERR_STAFF_MEMBER_NOT_FOUND / ERR_PAYROLL_PERIOD_NOT_FOUND / ERR_PORTABILITY_REQUEST_NOT_FOUND / ERR_BENEFIT_NETWORK_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with a path id or a body foreign key

  - priority: 4
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL / ERR_BOOKING_NOT_RESERVED / ERR_ENTRY_NOT_OFFERED / ERR_WAITLIST_TERMINAL / ERR_SESSION_NOT_SCHEDULED / ERR_PAYROLL_PERIOD_NOT_OPEN / ERR_PORTABILITY_ALREADY_DECIDED"
    http_status: 409
    applies_to: all state-changing endpoints

  - priority: 5
    category: business_safety
    check: "tenant posture and tier entitlement — the studio must not be SUSPENDED or CANCELLED, the subscription must not be SUSPENDED or CANCELLED, payroll must not be on hold, and the operation's feature gate must be enabled on the effective SubscriptionTier"
    error_id: "ERR_STUDIO_NOT_OPERATING / ERR_SUBSCRIPTION_INACTIVE / ERR_PAYROLL_HOLD / ERR_FEATURE_NOT_IN_TIER"
    http_status: "403 for ERR_FEATURE_NOT_IN_TIER, 409 for the posture errors"
    applies_to: "class-session create/update, instructor reassignment, staff-member create, membership create/advance-cycle, class-pack create, payroll close, portability resolve-release, marketplace listing read, waitlist join"
    note: "This band sits ABOVE the temporal and constraint bands so a suspended studio always reports the posture error rather than a capacity or overlap error."

  - priority: 6
    category: business_temporal
    check: "interval rules — client scheduling overlap, room overlap with buffer, payroll period coverage, and the late-cancellation window comparison"
    error_id: "ERR_CLIENT_SCHEDULE_OVERLAP / ERR_ROOM_OVERLAP / ERR_BUFFER_INSUFFICIENT / ERR_PAYROLL_PERIOD_GAP / ERR_CANCEL_WINDOW_CLOSED"
    http_status: 409
    applies_to: "booking create, check-in, booking cancel, class-session create, payroll-period create"

  - priority: 7
    category: business_constraint
    check: "capacity, quota and uniqueness — seat availability, allocation counter upkeep, credit availability, period disjointness, email uniqueness within a studio"
    error_id: "ERR_STUDIO_CAPACITY_EXCEEDED / ERR_ALLOCATION_EXHAUSTED / ERR_NO_ACTIVE_PACK / ERR_MEMBERSHIP_INACTIVE / ERR_PAYROLL_PERIOD_OVERLAP / ERR_CLIENT_EMAIL_CONFLICT"
    http_status: 409
    applies_to: "booking create, class-session create, class-pack create, client create, payroll-period create"

  - priority: 8
    category: business_referential
    check: "cross-entity state dependencies — the client must be admissible, the instructor admissible for the session's template, and the benefit network active for the claim"
    error_id: "ERR_CLIENT_NOT_ADMISSIBLE / ERR_INSTRUCTOR_NOT_ELIGIBLE / ERR_NETWORK_NOT_ACTIVE"
    http_status: 409
    applies_to: "booking create, class-session create, waitlist claim, substitute assignment, benefit-network settlement read"

  - priority: 9
    category: business_fiscal
    check: "money rules — tier-change fee, early-termination fee, freeze cap, pack extension cap, export download cap, stale-version precondition"
    error_id: "ERR_TIER_CHANGE_FEE_REQUIRED / ERR_EARLY_TERMINATION_FEE_REQUIRED / ERR_FREEZE_CAP_EXCEEDED / ERR_PACK_EXTENSION_CAP_EXCEEDED / ERR_EXPORT_DOWNLOAD_CAP / ERR_STALE_VERSION"
    http_status: "402 for the fee errors, 409 for the cap errors, 412 for ERR_STALE_VERSION"
    applies_to: "subscription change-tier, membership cancel, freeze, class-pack extend, issue-export, and every OCC-guarded write"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================

endpoints:

  # --- Platform configuration + tenant root ---------------------------------
  - method: GET
    path: "/wellness/subscription-tiers"
    description: "List the subscription tiers and their feature gates; unauthenticated."
    roles: [Anonymous, PlatformAdmin, StudioOwner, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "SubscriptionTier[]"
    side_effects: []

  - method: POST
    path: "/wellness/subscription-tiers"
    description: "Define or replace a subscription tier's pricing and feature gates. Platform configuration, so a fixture can pin exact tier economics."
    roles: [PlatformAdmin]
    code: 201
    input: [tier, monthly_fee_cents, tier_rank, included_staff_seats, seat_overage_fee_cents, marketplace_listing_enabled, staff_payroll_enabled, instructor_substitution_enabled, waitlist_auto_promotion_enabled, crm_client_export_enabled, marketplace_commission_bps]
    output: SubscriptionTier
    side_effects: ["a tier with the same tier value is replaced; existing studios keep the tier they were created with until a tier change is requested"]

  - method: POST
    path: "/wellness/studios"
    description: "Sign up a wellness business: creates the Studio and its single BusinessSubscription in one transaction. Requires a tier whose marketplace_listing_enabled gate is what the caller asked for; the studio starts in TRIAL and the subscription starts in TRIAL with renewal_epoch 0."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [legal_name, home_state_code, owner_full_name, tier, billing_period, payroll_cap_mode]
    output: Studio
    side_effects:
      - "creates a BusinessSubscription row with status TRIAL, dunning_stage CURRENT, renewal_epoch 0, renewal_due_at = now_utc + 30 days, grace_until = renewal_due_at, and monthly_fee_cents_snapshot from the requested tier"
      - "Studio.subscription_id is stamped with the new subscription id; Studio.feature_gates is derived from SubscriptionTier per TIER_FEATURE_MATRIX"
      - "registers the owner as a StudioOwner identity"

  - method: GET
    path: "/wellness/studios"
    description: "List studios, filterable by the subscription each studio is bound to."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: ["subscription_id?", "status?", "limit?", "offset?"]
    output: "Studio[]"
    side_effects: []

  - method: GET
    path: "/wellness/studios/{id}"
    description: "Get one studio with its derived feature gates and balances."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 200
    input: []
    output: Studio
    side_effects: []

  - method: POST
    path: "/wellness/studios/{id}/cancel"
    description: "Close the business. Cascades to sessions, memberships and promotional inventory."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: ["reason?"]
    output: Studio
    side_effects:
      - "refused with ERR_STUDIO_NOT_OWNED when a StudioOwner acts on a studio other than the one bound to their X-User-ID; PlatformAdmin is exempt"
      - "Studio.status → CANCELLED; the owning BusinessSubscription.status → CANCELLED and payroll_hold → true"
      - "every ClassSession of the studio in {SCHEDULED, IN_PROGRESS} → CANCELLED_BY_STUDIO, releasing its RESERVED bookings and expiring its ACTIVE/STANDBY/OFFERED waitlist holds (cascade depth 3)"
      - "every Membership of the studio in {ACTIVE, FROZEN, PAST_DUE, LAPSED} → CANCELLED; every ClassSession with promo_offer_state IN {SCHEDULED, ACTIVE} → WITHDRAWN"
      - "increments Studio.version by 1"

  # --- Subscription ----------------------------------------------------------
  - method: GET
    path: "/wellness/subscriptions/{id}"
    description: "Get one subscription with its dunning stage, seat counts and payroll hold."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: []
    output: BusinessSubscription
    side_effects: []

  - method: GET
    path: "/wellness/subscriptions/{id}"
    description: "Get one subscription, including its version for OCC-guarded writes."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: []
    output: BusinessSubscription
    side_effects: []

  - method: POST
    path: "/wellness/subscriptions/{id}/advance-renewal"
    description: "Advance the renewal clock by advance_days and settle the charge with the caller's outcome. When advance_clock is false the due date is left where it is, which is how an early billing cycle is exercised."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [advance_clock, "advance_days?", outcome, "reason?", expected_subscription_version]
    output: BusinessSubscription
    side_effects:
      - "when advance_clock is true the logical clock moves forward by advance_days (default 30) before the outcome is settled"
      - "outcome SUCCEEDED: status → ACTIVE, renewal_epoch += 1, renewal_due_at advances by exactly 30 days, grace_until = the new renewal_due_at, dunning_stage → CURRENT"
      - "outcome FAILED: status → PAST_DUE, dunning_stage → RETRY_SCHEDULED"
      - "increments BusinessSubscription.version by 1"

  - method: POST
    path: "/wellness/subscriptions/{id}/change-tier"
    description: "Move the studio to a different tier. Effective immediately; the prorated remainder of the current period is charged as a tier-change fee."
    roles: [PlatformAdmin]
    code: 200
    input: [new_tier, fee_payment_ref, expected_subscription_version]
    output: BusinessSubscription
    side_effects:
      - "tier → new_tier; monthly_fee_cents_snapshot is refreshed from the target SubscriptionTier; Studio.subscription_tier and Studio.feature_gates are re-derived"
      - "the prorated tier-change fee is charged before the change is applied, so an unknown fee_payment_ref fails at priority 9 without mutating the tier"
      - "increments BusinessSubscription.version by 1"

  - method: POST
    path: "/wellness/subscriptions/{id}/suspend"
    description: "Suspend the subscription. Permitted from TRIAL, ACTIVE, PAST_DUE or GRACE; the studio posture and its staff roster follow."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [reason, expected_subscription_version]
    output: BusinessSubscription
    side_effects:
      - "status → SUSPENDED, dunning_stage → SUSPENDED, payroll_hold → true"
      - "Studio.status → SUSPENDED with suspension_reason stamped; StaffMember rows of the studio with status ACTIVE → INACTIVE"
      - "increments BusinessSubscription.version by 1"

  - method: POST
    path: "/wellness/subscriptions/{id}/resume"
    description: "Resume a suspended subscription while its grace window has not yet closed."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [expected_subscription_version]
    output: BusinessSubscription
    side_effects:
      - "status → GRACE, dunning_stage → CURRENT, grace_until = now_utc"
      - "Studio.status is re-derived to ACTIVE"
      - "staff members previously demoted are NOT automatically re-activated"
      - "increments BusinessSubscription.version by 1"

  - method: POST
    path: "/wellness/subscriptions/{id}/cancel"
    description: "Cancel the subscription and claw back commissions paid in the open payroll period."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [expected_subscription_version]
    output: BusinessSubscription
    side_effects:
      - "status → CANCELLED, dunning_stage → CANCELLED, payroll_hold → true permanently"
      - "every PAID CommissionEntry of the studio's most recently LOCKED PayrollPeriod receives a reversal_correction_cents equal to the negation of commission_cents, posted to the studio's next OPEN period (cascade depth 3)"
      - "increments BusinessSubscription.version by 1"

  # --- Staff -----------------------------------------------------------------
  - method: POST
    path: "/wellness/staff-members"
    description: "Add a staff member to a studio roster."
    roles: [PlatformAdmin, StudioOwner]
    code: 201
    input: [studio_id, full_name, staff_role, "primary_class_template_id?", "substitute_class_template_ids?", commission_rate_bps]
    output: StaffMember
    side_effects:
      - "status starts ACTIVE; BusinessSubscription.staff_seat_count increments by 1 and seat_overage_count is recomputed"
      - "rejected with ERR_FEATURE_NOT_IN_TIER when staff_role == INSTRUCTOR and the subscription's payroll entitlement is not enabled"

  - method: GET
    path: "/wellness/staff-members/{id}"
    description: "Get one staff member with accrued commission."
    roles: [PlatformAdmin, StudioOwner, StaffMember]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/wellness/staff-members"
    description: "List staff members, optionally scoped by studio or by the template they primarily teach."
    roles: [PlatformAdmin, StudioOwner, StaffMember]
    code: 200
    input: ["studio_id?", "primary_class_template_id?", "status?", "limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []

  - method: POST
    path: "/wellness/staff-members/{id}/restrict-to-substitute"
    description: "Demote an instructor to substitute-only."
    roles: [StudioOwner]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["status → SUBSTITUTE_ONLY; the staff member may no longer be named as a primary instructor on a new ClassSession"]
  - method: POST
    path: "/wellness/staff-members/{id}/reinstate"
    description: "Return a substitute-only staff member to the active roster."
    roles: [StudioOwner]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/wellness/staff-members/{id}/deactivate"
    description: "Remove a staff member from the roster."
    roles: [StudioOwner]
    code: 200
    input: ["reason?"]
    output: StaffMember
    side_effects:
      - "status → INACTIVE; BusinessSubscription.staff_seat_count decrements by 1 and seat_overage_count is recomputed"
      - "an ACCEPTED substitution for this staff member's open sessions is re-checked and voided when the substitute is itself INACTIVE"

  # --- Clients ---------------------------------------------------------------
  - method: POST
    path: "/wellness/clients"
    description: "Register a consumer against a studio roster."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 201
    input: [home_studio_id, display_name, email, home_state_code]
    output: Client
    side_effects:
      - "status starts ACTIVE; Studio.client_roster_count increments by 1"
      - "email is unique within the home studio only"

  - method: GET
    path: "/wellness/clients"
    description: "List clients, optionally scoped to a studio roster."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 200
    input: ["home_studio_id?", "status?", "limit?", "offset?"]
    output: "Client[]"
    side_effects: []

  - method: GET
    path: "/wellness/clients/{id}"
    description: "Get one client."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- Class templates -------------------------------------------------------
  - method: POST
    path: "/wellness/class-templates"
    description: "Define a class format for a studio."
    roles: [StudioOwner]
    code: 201
    input: [studio_id, name, duration_minutes, base_price_cents, default_capacity, credit_cost, is_off_peak, buffer_minutes]
    output: ClassTemplate
    side_effects: []

  - method: GET
    path: "/wellness/class-templates"
    description: "List class templates."
    roles: [PlatformAdmin, StudioOwner, StaffMember, Client]
    code: 200
    input: ["studio_id?", "is_off_peak?", "limit?", "offset?"]
    output: "ClassTemplate[]"
    side_effects: []

  - method: POST
    path: "/wellness/class-sessions"
    description: "Schedule one session of a class template. The overlap, buffer and payroll-coverage rules all bind here."
    roles: [StudioOwner]
    code: 201
    input: [studio_id, class_template_id, instructor_staff_id, room_code, start_at, "capacity?", "promo_seats_allocated?", "promo_discount_bps?", "promo_valid_from?", "promo_valid_to?", expected_subscription_version]
    output: ClassSession
    side_effects:
      - "status starts SCHEDULED; end_at is derived as start_at + ClassTemplate.duration_minutes; capacity defaults to ClassTemplate.default_capacity"
      - "list_price_cents and marketplace_price_cents are computed from the studio's tier and the class template; price_version starts at 1"
      - "payroll_period_id is resolved to the studio's PayrollPeriod whose inclusive [start_date, end_date] range contains start_at"
      - "promo_offer_state is NONE when promo_seats_allocated is absent, and ACTIVE when it is present and the template is off-peak"
      - "fullness_posture is derived"
      - "increments BusinessSubscription.version by 1"

  - method: GET
    path: "/wellness/class-sessions"
    description: "List class sessions, filterable by studio, template, room, payroll period or instructor."
    roles: [PlatformAdmin, StudioOwner, StaffMember, Client]
    code: 200
    input: ["studio_id?", "class_template_id?", "room_code?", "payroll_period_id?", "instructor_staff_id?", "status?", "start_after?", "start_before?", "limit?", "offset?"]
    output: "ClassSession[]"
    side_effects: []

  - method: GET
    path: "/wellness/class-sessions/{id}"
    description: "Get one class session with its derived posture and both channel prices."
    roles: [PlatformAdmin, StudioOwner, StaffMember, Client]
    code: 200
    input: []
    output: ClassSession
    side_effects: []

  - method: PUT
    path: "/wellness/class-sessions/{id}"
    description: "Update a scheduled session: capacity, instructor, room or promotional inventory."
    roles: [StudioOwner]
    code: 200
    input: ["capacity?", "instructor_staff_id?", "room_code?", "promo_seats_allocated?", "promo_discount_bps?", "promo_valid_from?", "promo_valid_to?", expected_class_session_version]
    output: ClassSession
    side_effects:
      - "increasing capacity releases seats to the waitlist ordering; decreasing capacity below seats_taken + seats_held is rejected"
      - "any price-affecting field bumps price_version and recomputes both channel prices through promotional_inventory_release and channel_total_cents"
      - "increments ClassSession.version by 1"

  - method: POST
    path: "/wellness/class-sessions/{id}/cancel"
    description: "Cancel a session on the studio's side. Clients are never fee-charged and credits are restored."
    roles: [StudioOwner]
    code: 200
    input: ["reason?"]
    output: ClassSession
    side_effects:
      - "status → CANCELLED_BY_STUDIO; fullness_posture → CANCELLED"
      - "every Booking in {RESERVED, CHECKED_IN} → CANCELLED with fee_status NONE; class-pack and membership credits are restored by pack_refund_restoration"
      - "every WaitlistEntry in {ACTIVE, STANDBY, OFFERED} → EXPIRED"
      - "increments ClassSession.version by 1"

  - method: POST
    path: "/wellness/class-sessions/{id}/complete"
    description: "Advance the logical clock to the session end and let the system transitions fire, so the no-show, attended and commission cascades are observable."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: []
    output: ClassSession
    side_effects:
      - "the logical clock is set to max(now_utc, end_at)"
      - "status → IN_PROGRESS then COMPLETED; RESERVED bookings → NO_SHOW, CHECKED_IN bookings → ATTENDED with a CommissionEntry accrued for each"
      - "increments ClassSession.version by 1"

  # --- Bookings --------------------------------------------------------------
  - method: POST
    path: "/wellness/bookings"
    description: "Create a booking on a session through the studio channel. Payment source selects which entitlement is debited."
    roles: [StudioOwner, Client]
    code: 201
    input: [client_id, class_session_id, channel, payment_source, "membership_id?", "class_pack_id?", "benefit_network_code?"]
    output: Booking
    side_effects:
      - "status starts RESERVED; ClassSession.seats_taken increments by 1 and fullness_posture is re-derived"
      - "payment_source MEMBERSHIP debits an included credit from the membership; CLASS_PACK debits ClassPack.credits_remaining; BENEFIT_NETWORK requires benefit_network_code"
      - "the marketplace channel is rejected here; use POST /wellness/marketplace/bookings"

  - method: GET
    path: "/wellness/bookings"
    description: "List bookings, filterable by client or session — the reverse-reachability read for both foreign keys."
    roles: [PlatformAdmin, StudioOwner, StaffMember, Client]
    code: 200
    input: ["client_id?", "class_session_id?", "status?", "channel?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/wellness/bookings/{id}/check-in"
    description: "Check in a booked client on the day of the session."
    roles: [StudioOwner, Client]
    code: 200
    input: []
    output: Booking
    side_effects: ["status RESERVED → CHECKED_IN; ClassSession.fullness_posture is recomputed"]

  - method: POST
    path: "/wellness/bookings/{id}/cancel"
    description: "Cancel a booking. Which of CANCELLED and LATE_CANCELLED results is decided purely by where the logical clock sits relative to the session start."
    roles: [StudioOwner, Client]
    code: 200
    input: ["reason?"]
    output: Booking
    side_effects:
      - "status → CANCELLED and fee_status NONE when now_utc <= start_at − LATE_CANCEL_WINDOW_MINUTES"
      - "status → LATE_CANCELLED with booking_fee_cents from cancellation_fee and fee_status CHARGED otherwise"
      - "the freed seat triggers an offer to the session's next waitlist hold (cascade depth 2); class-pack credit is restored by pack_refund_restoration"

  - method: POST
    path: "/wellness/bookings/{id}/restore-no-show"
    description: "Reverse a no-show fee and strike as a compensating action."
    roles: [StudioOwner]
    code: 200
    input: [reason]
    output: Booking
    side_effects:
      - "status NO_SHOW → RESERVED; fee_status → WAIVED; Client.no_show_strike_count decrements by 1 and Client.outstanding_fee_cents decreases by booking_fee_cents"
      - "refused with ERR_RESTORE_WINDOW_CLOSED once the session completed more than STRIKE_RESTORE_WINDOW_HOURS ago"

  - method: POST
    path: "/wellness/bookings/{id}/reverse-claim"
    description: "Revoke a claimed waitlist seat, sending the client back to the back of the line."
    roles: [StudioOwner]
    code: 200
    input: [reason]
    output: Booking
    side_effects:
      - "status → CANCELLED; the promoted WaitlistEntry reverts CLAIMED → ACTIVE with position_mode QUEUED and raw_sequence_no = max(raw_sequence_no) + 1 (cascade depth 2)"
      - "the class-pack or membership credit consumed is restored by pack_refund_restoration"

  # --- Waitlist --------------------------------------------------------------
  - method: POST
    path: "/wellness/waitlist-entries"
    description: "Join the waitlist for a session. A hold joined while the session is already full is the ordinary path; the position_mode chooses between a numbered slot and a slotless standby."
    roles: [StudioOwner, Client]
    code: 201
    input: [class_session_id, client_id, position_mode]
    output: WaitlistEntry
    side_effects:
      - "status starts ACTIVE for position_mode QUEUED and STANDBY for position_mode STANDBY_ANY, so both enumeration values are reachable at creation; raw_sequence_no is assigned as max(raw_sequence_no) + 1 for the session and effective_sequence is min(raw_sequence_no, 0) in standby mode"
      - "if the session is not yet full the entry is still created ACTIVE but no seat is reserved, so ClassSession.seats_held is unchanged"

  - method: GET
    path: "/wellness/waitlist-entries"
    description: "List waitlist holds in offer order, filterable by session, client, studio or the booking a hold was promoted into."
    roles: [PlatformAdmin, StudioOwner, StaffMember, Client]
    code: 200
    input: ["studio_id?", "class_session_id?", "client_id?", "promoted_booking_id?", "status?", "limit?", "offset?"]
    output: "WaitlistEntry[]"
    side_effects: []

  - method: POST
    path: "/wellness/waitlist-entries/{id}/claim"
    description: "Reclaim an offered seat."
    roles: [StudioOwner, Client]
    code: 200
    input: [payment_source, "membership_id?", "class_pack_id?"]
    output: Booking
    side_effects:
      - "status OFFERED → CLAIMED; a Booking is created RESERVED on the session and its id is written to promoted_booking_id"
      - "ClassSession.seats_held decrements by 1 and seats_taken increments by 1; fullness_posture is re-derived"

  - method: POST
    path: "/wellness/waitlist-entries/{id}/cancel"
    description: "Withdraw a waitlist hold, whether it holds a seat or not."
    roles: [StudioOwner, Client]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects:
      - "status → CANCELLED; when the hold was OFFERED the seat is offered onward to the session's next hold (cascade depth 2) and ClassSession.seats_held decrements by 1"

  - method: POST
    path: "/wellness/waitlist-entries/{id}/confirm-position"
    description: "Rejoin the numbered queue from standby."
    roles: [StudioOwner, Client]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status → ACTIVE with position_mode QUEUED and effective_sequence recomputed to raw_sequence_no"]

  - method: POST
    path: "/wellness/waitlist-entries/sweep-offers"
    description: "System sweep: expire every offer whose window has lapsed and offer the seats onward in ranking order."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [studio_id, "expected_class_session_version?"]
    output: "{ swept_count: integer, offered_entry_ids: string[], expired_entry_ids: string[] }"
    side_effects:
      - "every entry with status OFFERED whose offer_expires_at < now_utc → EXPIRED and the next-ranked hold of its session → OFFERED with a fresh offer_expires_at"
      - "the swept seat count is reported in swept_count"

  # --- Class packs -----------------------------------------------------------
  - method: POST
    path: "/wellness/class-packs"
    description: "Sell a class pack to a client."
    roles: [StudioOwner, Client]
    code: 201
    input: [studio_id, client_id, pack_size, purchased_at, expiry_scheme, expected_client_version]
    output: ClassPack
    side_effects:
      - "credits_remaining starts at pack_size and status starts ACTIVE"
      - "expires_at is derived from purchased_at and expiry_scheme: NONE means purchased_at + PACK_VALIDITY_DAYS, SEASONAL means purchased_at + 90 days, PROMOTIONAL means purchased_at + 30 days and caps pack_size at 12"
      - "increments Client.version by 1"

  - method: GET
    path: "/wellness/class-packs"
    description: "List class packs, filterable by client or studio."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 200
    input: ["studio_id?", "client_id?", "status?", "limit?", "offset?"]
    output: "ClassPack[]"
    side_effects: []

  - method: POST
    path: "/wellness/class-packs/{id}/extend"
    description: "Extend a pack's expiry, subject to the contract-lifetime extension cap."
    roles: [StudioOwner]
    code: 200
    input: [extend_days, reason]
    output: ClassPack
    side_effects: ["expires_at advances by extend_days and extension_days_used grows by the same amount; refused with ERR_PACK_EXTENSION_CAP_EXCEEDED once the lifetime total would pass PACK_MAX_EXTENSION_DAYS"]

  - method: POST
    path: "/wellness/class-packs/{id}/sweep-expiry"
    description: "System sweep: move packs past their expiry into EXPIRED and count the credits the studio keeps."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: ["advance_clock_days?"]
    output: "{ expired_count: integer, credits_voided: integer, credits_returned_to_studio: integer }"
    side_effects:
      - "the logical clock moves forward by advance_clock_days (default 0) before the sweep"
      - "every ACTIVE pack whose expires_at <= now_utc → EXPIRED with pending_expiry_grace_until = expires_at + PACK_EXPIRY_GRACE_DAYS"
      - "the credits the studio keeps are reported as credits_returned_to_studio per pack_credit_expiry"

  - method: POST
    path: "/wellness/memberships"
    description: "Enrol a client on a monthly membership, folding the plan terms onto the row."
    roles: [StudioOwner, Client]
    code: 201
    input: [studio_id, client_id, plan_name, monthly_fee_cents, included_credits_per_cycle, minimum_term_months, freeze_allowed, freeze_max_days_per_cycle, billing_anchor_day, "auto_renew?"]
    output: Membership
    side_effects:
      - "status starts ACTIVE, current_period_index 0, next_billing_at derived from billing_anchor_day, open_balance_cents 0"
      - "included_credits_per_cycle credits are granted immediately for cycle 0"

  - method: GET
    path: "/wellness/memberships"
    description: "List memberships, filterable by studio or client."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 200
    input: ["studio_id?", "client_id?", "status?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  - method: POST
    path: "/wellness/memberships/{id}/advance-cycle"
    description: "Advance the membership billing cycle by advance_days, with the outcome chosen by when the clock lands."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [advance_days, outcome, expected_membership_version]
    output: Membership
    side_effects:
      - "the logical clock moves forward by advance_days before the cycle is advanced"
      - "outcome CHARGED advances the cycle through membership_billing_cycle with the billing_day_chronological variant; outcome EARLY_CHARGED advances it through the forward_looking variant"
      - "FROZEN memberships are skipped and advance by exactly one month with no charge"
      - "increments Membership.version by 1"

  - method: POST
    path: "/wellness/memberships/{id}/freeze"
    description: "Freeze a membership for a fixed number of days and post the prorated fee adjustment."
    roles: [StudioOwner, Client]
    code: 200
    input: [freeze_days, expected_membership_version]
    output: Membership
    side_effects:
      - "status → FROZEN; freeze_start_at = now_utc and freeze_resume_at = now_utc + freeze_days"
      - "the prorated adjustment is posted through membership_freeze_proration against the freeze window that actually elapses, not the requested one"
      - "increments Membership.version by 1"

  - method: POST
    path: "/wellness/memberships/{id}/unfreeze"
    description: "End a freeze early. The proration is recomputed against the days that actually elapsed."
    roles: [StudioOwner, Client]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects:
      - "status → ACTIVE; freeze_days_used increases by the elapsed frozen days, and the over-freeze penalty is applied when more days elapsed than were planned"
      - "increments Membership.version by 1"

  - method: POST
    path: "/wellness/memberships/{id}/cancel"
    description: "Cancel a membership, charging the early-termination fee when the minimum term has not been served."
    roles: [StudioOwner, Client]
    code: 200
    input: ["fee_payment_ref?", expected_membership_version]
    output: Membership
    side_effects:
      - "status → CANCELLED; open_balance_cents is preserved for collection"
      - "an early-termination fee of one month's fee is required when current_period_index < minimum_term_months; without a valid fee_payment_ref the request fails at priority 9 and nothing is cancelled"
      - "increments Membership.version by 1"

  # --- Commission and payroll ------------------------------------------------
  - method: POST
    path: "/wellness/payroll-periods"
    description: "Define a payroll period for a studio."
    roles: [StudioOwner]
    code: 201
    input: [studio_id, period_index, start_date, end_date]
    output: PayrollPeriod
    side_effects: ["status starts OPEN; the inclusive [start_date, end_date] range must be disjoint from every other period of the same studio and must span at least MIN_PAYROLL_PERIOD_DAYS"]

  - method: GET
    path: "/wellness/payroll-periods"
    description: "List payroll periods, filterable by studio."
    roles: [PlatformAdmin, StudioOwner, StaffMember]
    code: 200
    input: ["studio_id?", "status?", "limit?", "offset?"]
    output: "PayrollPeriod[]"
    side_effects: []

  - method: GET
    path: "/wellness/payroll-periods/{id}"
    description: "Get one payroll period, including its version for OCC-guarded writes."
    roles: [PlatformAdmin, StudioOwner, StaffMember]
    code: 200
    input: []
    output: PayrollPeriod
    side_effects: []

  - method: POST
    path: "/wellness/payroll-periods/{id}/close"
    description: "Run payroll: lock the period and pay every accrued commission entry."
    roles: [StudioOwner]
    code: 200
    input: [expected_payroll_period_version]
    output: PayrollPeriod
    side_effects:
      - "status → LOCKED; every ACCRUED CommissionEntry of the period → PAID and paid_commission_cents is recomputed"
      - "refused with ERR_PAYROLL_HOLD while BusinessSubscription.payroll_hold is true"
      - "increments PayrollPeriod.version by 1"

  - method: POST
    path: "/wellness/payroll-periods/{id}/reopen"
    description: "Reopen a locked period inside the reopen window, returning its entries to accrual."
    roles: [StudioOwner]
    code: 200
    input: [expected_payroll_period_version]
    output: PayrollPeriod
    side_effects: ["status → OPEN; every PAID CommissionEntry of the period → ACCRUED and paid_commission_cents is recomputed"]
  - method: GET
    path: "/wellness/commission-entries/{id}"
    description: "Get one commission entry with its variant-adjusted amount."
    roles: [PlatformAdmin, StudioOwner, StaffMember]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: []

  - method: GET
    path: "/wellness/commission-entries"
    description: "List commission entries, filterable by staff member, payroll period, studio or the booking that produced them."
    roles: [PlatformAdmin, StudioOwner, StaffMember]
    code: 200
    input: ["studio_id?", "staff_member_id?", "payroll_period_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: "CommissionEntry[]"
    side_effects: []

  - method: GET
    path: "/wellness/class-sessions/{id}/eligible-instructors"
    description: "Rank the studio's instructors who may cover this session, using the substitution priority ladder."
    roles: [PlatformAdmin, StudioOwner, StaffMember]
    code: 200
    input: ["exclude_staff_id?", "limit?"]
    output: "{ eligible: object[], total_count: integer, has_more: boolean }"
    side_effects:
      - "the candidate set is the studio's StaffMember rows with staff_role INSTRUCTOR whose status IN {ACTIVE, SUBSTITUTE_ONLY}, excluding the instructor of record, in descending substitution_priority_score order"
      - "the ranking tie-break is ascending created_at; empty candidate set returns an empty list, never an error"

  - method: POST
    path: "/wellness/class-sessions/{id}/reassign-instructor"
    description: "Name a substitute instructor for a scheduled session. The nominated instructor must outrank or match the best eligible candidate, so the ranking rules are load-bearing."
    roles: [StudioOwner]
    code: 200
    input: [selected_staff_id, "override_reason?", expected_class_session_version]
    output: ClassSession
    side_effects:
      - "instructor_staff_id → selected_staff_id; the previous instructor's ACCRUED CommissionEntry rows for this session are REVERSED with reversal_reason INSTRUCTOR_SUBSTITUTED"
      - "refused with ERR_INSTRUCTOR_NOT_ELIGIBLE when selected_staff_id is not in the candidate set of substitution_priority_score"
      - "refused with ERR_NO_ELIGIBLE_SUBSTITUTE when the candidate set is empty and override_reason is absent"
      - "increments ClassSession.version by 1"

  # --- Consumer marketplace --------------------------------------------------
  - method: GET
    path: "/wellness/marketplace/classes"
    description: "Browse marketplace-visible sessions. Only sessions whose studio is ACTIVE and whose tier has marketplace_listing_enabled appear."
    roles: [Anonymous, Client, StudioOwner, PlatformAdmin]
    code: 200
    input: ["studio_id?", "home_state_code?", "is_off_peak?", "start_after?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []

  - method: GET
    path: "/wellness/marketplace/classes/{id}"
    description: "Read one session as the marketplace sees it, with the marketplace seat pool and marketplace price."
    roles: [Anonymous, Client, StudioOwner, PlatformAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: []

  - method: POST
    path: "/wellness/marketplace/bookings"
    description: "Book a seat through the consumer marketplace. The marketplace sells the same inventory as the studio channel but prices it gross of platform commission and never debits a studio entitlement."
    roles: [Client]
    code: 201
    input: [client_id, class_session_id, payment_ref, promo_redeem]
    output: Booking
    side_effects:
      - "channel is MARKETPLACE and payment_source is DROP_IN; commission_base_cents is set from marketplace_price_cents, or from the session's promotional price when promo_redeem is true"
      - "when promo_redeem is true the seat must come from the session's promotional pool: is_promotional_seat is set, ClassSession.promo_seats_used increments by 1, and ERR_ALLOCATION_EXHAUSTED is raised when promo_seats_used has already reached promo_seats_allocated or promo_offer_state is not ACTIVE"
      - "the studio is credited channel_total_cents − marketplace_commission_cents, so the same seat yields strictly less studio revenue than a studio-channel drop-in"
      - "class-pack and membership credits are refused for marketplace bookings (ERR_PAYMENT_SOURCE_NOT_PERMITTED)"

  # --- Wellness benefit networks --------------------------------------------
  - method: POST
    path: "/wellness/benefit-networks"
    description: "Register a wellness benefit network and its per-visit economics."
    roles: [PlatformAdmin]
    code: 201
    input: [network_code, name, per_visit_allowance_cents, reimburse_full_list_price, remit_days_after_visit, claim_denial_window_hours]
    output: BenefitNetwork
    side_effects: []

  - method: GET
    path: "/wellness/benefit-networks"
    description: "List benefit networks, optionally by code."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: ["network_code?", "limit?", "offset?"]
    output: "BenefitNetwork[]"
    side_effects: []

  - method: GET
    path: "/wellness/benefit-network-claims"
    description: "Walk the benefit-network claims of a studio with the forward-looking receivable attached to each."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [studio_id, "status?", "limit?", "offset?"]
    output: "{ claims: object[], receivable_total_cents: integer, total_count: integer, has_more: boolean }"
    side_effects:
      - "each claim is reported with its claim_amount_cents recomputed by benefit_network_settlement at read time, so a repricing since submission changes the reported amount"
      - "receivable_total_cents is the forward-looking sum over claims in {SUBMITTED, PAID} plus the resubmission-eligible portion of DENIED claims inside their denial window"

  - method: POST
    path: "/wellness/benefit-network-claims/{id}/resubmit"
    description: "Resubmit a denied benefit-network claim while it is still inside its denial window."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [reason]
    output: Booking
    side_effects:
      - "benefit_claim_status DENIED → SUBMITTED with claim_amount_cents recomputed from the current list price"
      - "refused with ERR_CLAIM_WINDOW_CLOSED after CLAIM_RESUBMIT_MAX resubmissions or once the denial window has lapsed"

  # --- Client-list portability ----------------------------------------------
  - method: POST
    path: "/wellness/portability-requests"
    description: "Assert a client's right to take their record away from a studio."
    roles: [Client]
    code: 201
    input: [studio_id, requesting_client_id, dispute_reason]
    output: ClientPortabilityRequest
    side_effects:
      - "status starts PENDING and requested_at is stamped from the logical clock; Studio.data_ownership_state → PORTABILITY_PENDING"
      - "refused with ERR_PORTABILITY_COOLDOWN_ACTIVE while a previous terminal request for the same client and studio sits inside the cooldown"

  - method: GET
    path: "/wellness/portability-requests"
    description: "List portability requests, filterable by studio or by the requesting client."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 200
    input: ["studio_id?", "requesting_client_id?", "status?", "limit?", "offset?"]
    output: "ClientPortabilityRequest[]"
    side_effects: []

  - method: GET
    path: "/wellness/portability-requests/{id}"
    description: "Get one portability request, including its version for OCC-guarded writes."
    roles: [PlatformAdmin, StudioOwner, Client]
    code: 200
    input: []
    output: ClientPortabilityRequest
    side_effects: []

  - method: POST
    path: "/wellness/portability-requests/{id}/object"
    description: "Studio objects to the release inside the response window."
    roles: [StudioOwner]
    code: 200
    input: [objection_basis]
    output: ClientPortabilityRequest
    side_effects: ["status PENDING → OBJECTED; Studio.data_ownership_state stays PORTABILITY_PENDING pending adjudication"]

  - method: POST
    path: "/wellness/portability-requests/{id}/resolve-release"
    description: "Studio releases the client record, freezing the export manifest at this instant."
    roles: [StudioOwner]
    code: 200
    input: [include_booking_history, include_financial_history]
    output: ClientPortabilityRequest
    side_effects:
      - "status → RESOLVED_RELEASE; decided_at is stamped; Studio.data_ownership_state → PORTABILITY_GRANTED"
      - "the requesting Client.status → PORTABILITY_HOLD, removing that client from Studio.client_roster_count"
      - "export_grant_id is minted and export_manifest is frozen with record_count, record_digest and the two history flags"
      - "refused with ERR_CLIENT_BALANCE_OUTSTANDING while the requesting client's outstanding_fee_cents is above 0"

  - method: POST
    path: "/wellness/portability-requests/{id}/resolve-deny"
    description: "Studio refuses the release with a recorded basis."
    roles: [StudioOwner]
    code: 200
    input: [dispute_reason]
    output: ClientPortabilityRequest
    side_effects: ["status → RESOLVED_DENIED; Studio.data_ownership_state returns to OWNED"]

  - method: POST
    path: "/wellness/portability-requests/{id}/adjudicate"
    description: "Platform adjudicates an objected request."
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "include_booking_history?", "include_financial_history?"]
    output: ClientPortabilityRequest
    side_effects:
      - "decision RELEASE → RESOLVED_RELEASE with the export manifest frozen; decision DENY → RESOLVED_DENIED"
      - "refused with ERR_PORTABILITY_WINDOW_CLOSED once the adjudication window has lapsed"

  - method: POST
    path: "/wellness/portability-requests/{id}/issue-export"
    description: "Generate the portable export and hand the client a grant id."
    roles: [PlatformAdmin]
    code: 200
    input: [expected_portability_request_version]
    output: ClientPortabilityRequest
    side_effects:
      - "status RESOLVED_RELEASE → EXPORT_ISSUED; export_manifest.generated_at_utc is stamped and record_digest is frozen"
      - "refused with ERR_EXPORT_NOT_GRANTED while the request is not in RESOLVED_RELEASE (an EXPORT_ISSUED row whose export window lapsed must be re-issued from RESOLVED_RELEASE, which is the cycle)"
      - "refused with ERR_EXPORT_DOWNLOAD_CAP once export_download_count has reached EXPORT_MAX_DOWNLOADS"
      - "increments ClientPortabilityRequest.version by 1"

  - method: POST
    path: "/wellness/portability-requests/{id}/withdraw"
    description: "Client withdraws the request."
    roles: [Client]
    code: 200
    input: []
    output: ClientPortabilityRequest
    side_effects: ["status → WITHDRAWN from PENDING or OBJECTED only; Studio.data_ownership_state returns to OWNED"]

  - method: GET
    path: "/wellness/marketplace/settlement"
    description: "Computed read: walk the studio's marketplace bookings in ranking order and report the accumulating platform commission."
    roles: [PlatformAdmin, StudioOwner]
    code: 200
    input: [studio_id]
    output: "{ marketplace_commission_cents: integer, per_booking_commission_cents: integer, booking_count: integer }"
    side_effects:
      - "marketplace_commission_cents is the running-accumulator result of marketplace_commission; per_booking_commission_cents is the same walk with each booking floored in isolation, so the two differ by the discarded fractional cents"

  - method: GET
    path: "/wellness/portability-requests/{id}/export"
    description: "Download the granted portable export; each download consumes one of the capped download slots."
    roles: [PlatformAdmin, Client]
    code: 200
    input: []
    output: ClientPortabilityRequest
    side_effects:
      - "export_download_count increments by 1; refused with ERR_EXPORT_DOWNLOAD_CAP once it has reached EXPORT_MAX_DOWNLOADS and with ERR_EXPORT_NOT_GRANTED while the request is not EXPORT_ISSUED"
      - "increments ClientPortabilityRequest.version by 1"

