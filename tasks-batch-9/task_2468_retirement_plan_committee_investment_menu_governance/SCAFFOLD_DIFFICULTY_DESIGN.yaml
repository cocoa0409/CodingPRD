              as: InvestmentConsultant
              captures: { ips1_id: $.data.id }
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-03", quarter_index: 0 }
              as: PlanSponsorAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /governance/committee-meetings/${m1_id}/convene"
