              as: AttractionHost
              captures: { s3_id: $.data.id }
          assert:
            - "AttractionSession.${s1_id}.no_show_strikes == 1 after the first checkpoint and still exactly 1 after a second checkpoint, so the checkpoint is idempotent and does not double the strike"
            - "AttractionSession.${s1_id}.status == NO_SHOW after both checkpoints, so the terminal no-show row is not re-processed"
            - "AttractionSession.${s2_id}.status == COMPLETED, which moved the member's strike epoch to 2026-09-02"
            - "the third request is admitted: AttractionSession.${s3_id}.status == CONFIRMED, because the effective strike count is 0 rather than 1"
            - "the admission is not ERR_NO_SHOW_STRIKE_LIMIT, so the completion reset is what carried it"

      - name: waiver_supersede_and_expiry_are_system_driven
        claim_type: invalid_transition
        grounds:
          - state_machines.LiabilityWaiver.transitions.SIGNED_to_SUPERSEDED
