            - "reinstating returns affiliation_status == AFFILIATED but leaves pathway_steering_status == SUSPENDED, so ${s3} != ${s1}"
            - "re-adopting from SUSPENDED returns pathway_steering_status == ACTIVE with affiliation_status untouched"
