            - { call: "POST /api/customers", payload: { name: "Tier2", customer_code: "CUST-T2", credit_limit_cents: 100000000, allocation_tier: "TIER_2" }, as: DeskAdmin, captures: { t2_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Tier3", customer_code: "CUST-T3", credit_limit_cents: 100000000, allocation_tier: "TIER_3" }, as: DeskAdmin, captures: { t3_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 400, weekly_supply_lbs: 3000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/allocations", payload: { customer_id: "${t3_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${t3_id}", captures: { a3_id: "$.data.id" } }
            - { call: "POST /api/allocations", payload: { customer_id: "${t2_id}", price_sheet_line_id: "${line_id}", requested_lbs: 1500 }, as: CustomerRep, as_user_id: "${t2_id}", captures: { a2_id: "$.data.id" } }
            - { call: "POST /api/allocations", payload: { customer_id: "${t1_id}", price_sheet_line_id: "${line_id}", requested_lbs: 2000 }, as: CustomerRep, as_user_id: "${t1_id}", captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "GET /api/price-sheet-lines/${line_id}", payload: {}, as: DeskAdmin, captures: { line_alloc: "$.data.allocated_lbs" } }
          assert:
            - "Allocation.${a1_id}.allocated_lbs == 2000 and status == CONFIRMED (tier priority beats creation order — T3 was created first)"
            - "Allocation.${a2_id}.allocated_lbs == 1000 and status == CONFIRMED (partial grant)"
            - "Allocation.${a3_id}.allocated_lbs == 0 and status == SHORTFALL"
            - "${line_alloc} == 3000 (cap fully consumed)"

      - name: forward_earmarked_allocation_pricing
        claim_type: variant_selection
        grounds: [calculations.allocation_waterfall, entities.Allocation.fields.forward_contract_id]
        distinguishing_aspect: "An earmarked allocation prices at the contract's fixed 650c (not the sheet's 700c), consumes contract earmarked_lbs instead of the line's weekly supply, and still lands CONFIRMED."
        test_recipe:
          setup: ["Sheet week 2026-08-03 line RIBEYE-FE 700c supply 5000 PUBLISHED; OPEN contract FC-FE: 1000 lbs at 650c, delivery week 2026-08-03, same customer/product"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-FE", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer FE", customer_code: "CUST-FE", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 5000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/forward-contracts", payload: { contract_number: "FC-FE", customer_id: "${cust_id}", product_id: "${rib_id}", committed_lbs: 1000, fixed_price_per_lb_cents: 650, delivery_week_start: "2026-08-03" }, as: Trader, captures: { fc_id: "$.data.id" } }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 400, forward_contract_id: "${fc_id}" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
          assert:
            - "Allocation.${alloc_id}.status == CONFIRMED and allocated_lbs == 400 and unit_price_cents == 650 (contract price, not 700)"
            - "ForwardContract.${fc_id}.earmarked_lbs == 400"
            - "PriceSheetLine.${line_id}.allocated_lbs == 0 (sheet supply untouched by earmarked grant)"
            - "Customer.${cust_id}.outstanding_exposure_cents == 260000 (400 x 650)"

      - name: claim_freight_allowance_only_when_breached
        claim_type: constants_applied
        grounds: [calculations.claim_final_settlement]
        distinguishing_aspect: "The 15000-cent freight allowance applies iff claim_type == TEMPERATURE_ABUSE and temp_compliance == BREACHED: final = min(90000, 280000) + 15000 = 105000 on a breached shipment."
        test_recipe:
          setup: ["500 lbs RIBEYE-FA at 700c DELIVERED; readings include 41.5F so temp_compliance == BREACHED; claim TEMPERATURE_ABUSE for 100000"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-FA", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-FA", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer FA", customer_code: "CUST-FA", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-FA", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-FA", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 500 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 38.0, recorded_at: "2026-08-03T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 41.5, recorded_at: "2026-08-04T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /api/claims", payload: { shipment_id: "${ship_id}", claim_type: "TEMPERATURE_ABUSE", claimed_amount_cents: 100000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { claim_id: "$.data.id", claim_v: "$.data.version", prov: "$.data.provisional_credit_cents" } }
          trigger:
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 90000, expected_claim_version: "${claim_v}" }, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${claim_id}/accept", payload: {}, as: CustomerRep, as_user_id: "${cust_id}", captures: { fin: "$.data.final_settlement_cents" } }
          assert:
            - "${prov} == 100000 (min(100000, 350000 x 0.60 = 210000))"
            - "${fin} == 105000 (min(90000, 280000) + 15000 freight allowance for BREACHED temp abuse)"

  # ===========================================================================
  - section: validations
    instances:
      - name: invalid_role_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "An undeclared X-User-Role value fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/customers", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: trader_create_customer_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role check (priority 2) fires for a well-formed payload: Trader creating a customer gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "Nope", customer_code: "CUST-NOPE", credit_limit_cents: 1000, allocation_tier: "TIER_1" }, as: Trader, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE (http 403); no customer persisted"

      - name: customer_rep_acting_for_other_customer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Entity-backed ownership: CustomerRep with X-User-ID of customer B requesting an allocation for customer A gets ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Customers CUST-OWN-A and CUST-OWN-B; PUBLISHED sheet with line"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-OWN", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "A", customer_code: "CUST-OWN-A", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { ca_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "B", customer_code: "CUST-OWN-B", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cb_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 10000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
          trigger:
            - { call: "POST /api/allocations", payload: { customer_id: "${ca_id}", price_sheet_line_id: "${line_id}", requested_lbs: 10 }, as: CustomerRep, as_user_id: "${cb_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NOT_RESOURCE_OWNER (http 403); no allocation persisted"

      - name: body_fk_reference_not_found_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced FK that does not exist yields ERR_REFERENCE_NOT_FOUND (422), distinct from path-id 404s."
        test_recipe:
          setup: ["Product exists; supplier id is a well-formed but unknown UUID"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-RF", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-RF", supplier_id: "00000000-0000-0000-0000-000000000000", product_id: "${rib_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_REFERENCE_NOT_FOUND (http 422)"

      - name: auth_priority_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=5]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]", "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "Dual failure on unknown customer id with invalid role: the 400 auth error wins over the 404 because priority 1 precedes priority 4."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/customers/00000000-0000-0000-0000-000000000000", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not ERR_CUSTOMER_NOT_FOUND)"

      - name: sheet_week_must_be_monday
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_WEEK_START]"]
        distinguishing_aspect: "2026-08-04 is a Tuesday: sheet creation fails ERR_INVALID_WEEK_START (422); the Monday 2026-08-10 succeeds."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-04" }, as: Trader, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-10" }, as: Trader, captures: { ok_id: "$.data.id" } }
          assert:
            - "${err} == ERR_INVALID_WEEK_START (http 422)"
            - "Monday create succeeds: PriceSheet.${ok_id}.status == DRAFT"

      - name: forward_week_in_past_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_FORWARD_WEEK_PASSED]"]
        distinguishing_aspect: "With the default clock at 2026-08-01 (current week Monday 2026-07-27), a delivery_week_start of 2026-07-20 is a past week -> ERR_FORWARD_WEEK_PASSED."
        test_recipe:
          setup: ["Customer and product exist; clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-FW", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer FW", customer_code: "CUST-FW", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/forward-contracts", payload: { contract_number: "FC-FW", customer_id: "${cust_id}", product_id: "${rib_id}", committed_lbs: 100, fixed_price_per_lb_cents: 650, delivery_week_start: "2026-07-20" }, as: Trader, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_FORWARD_WEEK_PASSED (http 422)"

      - name: production_date_in_future_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_PRODUCTION_DATE_INVALID]"]
        distinguishing_aspect: "Receiving with production_date after the logical clock date (2026-08-20 > 2026-08-01 default) fails ERR_PRODUCTION_DATE_INVALID (422)."
        test_recipe:
          setup: ["BOOKED PO-PD; warehouse; clock unset (2026-08-01)"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-PD", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-PD", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-PD", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 100, warehouse_id: "${wh_id}", lot_code: "LOT-PD", production_date: "2026-08-20" }, as: WarehouseOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_PRODUCTION_DATE_INVALID (http 422); PO stays BOOKED and no lot is created"

      - name: duplicate_customer_code_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "customer_code uniqueness: the second create with the same code fails ERR_DUPLICATE_CODE (409)."
        test_recipe:
          setup: ["Customer CUST-DUP exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "First", customer_code: "CUST-DUP", credit_limit_cents: 1000, allocation_tier: "TIER_1" }, as: DeskAdmin }
          trigger:
            - { call: "POST /api/customers", payload: { name: "Second", customer_code: "CUST-DUP", credit_limit_cents: 2000, allocation_tier: "TIER_2" }, as: DeskAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DUPLICATE_CODE (http 409)"

      - name: fabrication_mass_balance_violation
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_MASS_BALANCE_VIOLATION]"]
        distinguishing_aspect: "Post requires outputs + loss == input weight exactly: 900 + 50 = 950 != 1000 fails ERR_MASS_BALANCE_VIOLATION (422) and the batch stays DRAFT."
        test_recipe:
          setup: ["CARC-MB AVAILABLE lot LOT-MB 1000 lbs; YieldSpec CARC-MB -> RIBEYE-MB 20% band 15-25"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CARC-MB", kind: "CARCASS", species: "BEEF", shelf_life_days: 30, required_temp_max_f: 40 }, as: DeskAdmin, captures: { carc_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-MB", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${rib_id}", expected_yield_pct: 20.0, min_yield_pct: 15.0, max_yield_pct: 25.0 }, as: DeskAdmin }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-MB", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-MB", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 25000, required_delivery_date: "2026-08-03" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-MB", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 30.0 }, as: QualityGrader }
            - { call: "POST /api/fabrication-batches", payload: { input_lot_id: "${lot_id}", loss_lbs: 50, outputs: [ { product_id: "${rib_id}", weight_lbs: 900 } ] }, as: WarehouseOperator, captures: { batch_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/fabrication-batches/${batch_id}/post", payload: {}, as: WarehouseOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_MASS_BALANCE_VIOLATION (http 422): 900 + 50 != 1000"
            - "FabricationBatch.${batch_id}.status == DRAFT; input lot stays AVAILABLE with 1000 lbs"

      - name: temperature_claim_requires_breach
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CLAIM_TYPE_NOT_SUPPORTED]"]
        distinguishing_aspect: "TEMPERATURE_ABUSE on a COMPLIANT shipment fails ERR_CLAIM_TYPE_NOT_SUPPORTED (422); a QUALITY_DEFECT claim on the same shipment succeeds."
        test_recipe:
