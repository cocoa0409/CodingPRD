            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_id_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /committee-panels/${pnl_id}/open-session"
              payload: {}
