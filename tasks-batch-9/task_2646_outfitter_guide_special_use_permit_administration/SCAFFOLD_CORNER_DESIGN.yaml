              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r_2: "$.data.id" }
          trigger:
            - call: "POST /osup/trip-use-reports/${r_1}/accept"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
              captures: { p_ver: "$.data.version" }
            - call: "POST /osup/trip-use-reports/${r_2}/amend"
              payload: { expected_permit_version: "${p_ver}", service_days_used: 12, client_count: 8, gross_revenue_cents: 1200000 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/trip-use-reports/${r_1}/amend"
              payload: { expected_permit_version: "${p_ver}", service_days_used: 20, client_count: 8, gross_revenue_cents: 3000000, allowable_deductions_cents: 0 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r_1b: "$.data.id" }
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
              captures: { p_ver2: "$.data.version" }
            - call: "POST /osup/trip-use-reports/${r_1}/amend"
              payload: { expected_permit_version: "${p_ver2}", service_days_used: 20, client_count: 8, gross_revenue_cents: 4000000, allowable_deductions_cents: 0 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/trip-use-reports/${r_2}/accept"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}/fee-assessments"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/trip-use-reports"
              payload: { permit_id: "${p_id}", status: "SUPERSEDED" }
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
          assert:
            - "re-accepting the ACCEPTED ${r_1} returns HTTP 409 ERR_USE_REPORT_STATE_INVALID and leaves the assessment untouched — acceptance is not idempotent, because a second acceptance would double-count service days and fee basis"
            - "amending the SUBMITTED ${r_2} returns HTTP 409 ERR_USE_REPORT_STATE_INVALID even though the supplied expected_permit_version is current: the state gate is evaluated, not skipped, when the OCC token matches"
            - "amending the ACCEPTED ${r_1} succeeds with HTTP 201: ${r_1} becomes SUPERSEDED and the new row ${r_1b} is ACCEPTED with supersedes_report_id ${r_1} and adjusted_gross_revenue_cents 3000000"
            - "amending the now-SUPERSEDED ${r_1} again returns HTTP 409 ERR_USE_REPORT_STATE_INVALID with a fresh, correct expected_permit_version — the third distinct state to hit the same error id"
            - "accepting ${r_2} then yields assessed_fee_cents 130000 under PROVISIONAL_PER_REPORT: ordered by period_start_date ASC, ${r_1b} takes bracket_rate_bp(0) = 300 bp on 3000000 = 90000 and ${r_2} takes bracket_rate_bp(3000000) = 400 bp on 1000000 = 40000"
            - "the SUPERSEDED listing returns exactly one row, ${r_1}, which is excluded from the fee basis while remaining readable as the audit record"
            - "the permit reports service_days_used_ytd 30 = 20 (${r_1b}) + 10 (${r_2}), recalculated from the ACCEPTED set rather than accumulated across the superseded row"

  # ===========================================================================
  # §1.7 RBAC  (four roles, role_model segregation_of_duties)
  # ===========================================================================
  - section: rbac
    instances:

      - name: role_exclusive_operations_are_unauthorized_for_every_other_role
        claim_type: segregation_of_duties
        grounds:
          - roles.PermitSpecialist.exclusive_operations
          - roles.AuthorizedOfficer.exclusive_operations
          - roles.ProgramAdministrator.exclusive_operations
          - roles.OutfitterRepresentative.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          ProgramAdministrator is the trap: its description says it "can stand in for the specialist's
          and officer's decision operations", which tempts a superuser implementation, but the §1.7
          shared_operations lists enumerate exactly which stand-ins exist — screening, close-submissions,
          report acceptance, performance evaluations and noncompliance actions are NOT among them, so
          the administrator is refused there while a role listed on the same line succeeds with a
          byte-identical request. The instance closes the loop by running the refused screen as the one
          role that owns it.
        test_recipe:
          setup:
            - "an ISSUED Alpine permit, a second application left SUBMITTED for the screen probes, an OPEN prospectus and two PENDING_QUALIFICATION guides"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Alpine float program." }
              as: PermitSpecialist
              captures: { app_a: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_a}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_a}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_a}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 100, proposed_activity_type: "FISHING", narrative: "Second program." }
              as: PermitSpecialist
              captures: { app_b: "$.data.id" }
