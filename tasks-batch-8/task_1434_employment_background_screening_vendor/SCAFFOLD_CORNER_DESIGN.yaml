  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_package_update_stale_and_fresh
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[package-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT with the observed version succeeds and bumps version 1 -> 2; replaying the same stale expected_package_version is a 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT package; version captured at creation"]
          setup_api_calls:
            - { call: "POST /screening-packages", payload: { name: "P-XC1", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "PUT /screening-packages/${p_id}", payload: { fee_cents: 1200, expected_package_version: "${pv}" }, as: HRAdmin, captures: { pv2: $.data.version } }
            - { call: "PUT /screening-packages/${p_id}", payload: { fee_cents: 1500, expected_package_version: "${pv}" }, as: HRAdmin, captures: { err: $.data.error_id } }
            - { call: "PUT /screening-packages/${p_id}", payload: { fee_cents: 1300, expected_package_version: "${pv2}" }, as: HRAdmin, captures: { pv3: $.data.version } }
          assert:
            - "first PUT: 200, version == 2, fee_cents == 1200"
            - "second PUT with the stale captured version: 412 ERR_STALE_VERSION; fee unchanged 1200"
            - "third PUT with the fresh version: 200, version == 3"

      - name: occ_jurisdiction_rule_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[jurisdiction-rule-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second OCC surface on a different parent entity: PATCH /jurisdiction-rules/{id} with expected_jurisdiction_rule_version one behind current is rejected 412."
        test_recipe:
          setup: ["DRAFT jurisdiction rule; version captured"]
          setup_api_calls:
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-WA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id, jv: $.data.version } }
          trigger:
            - { call: "PATCH /jurisdiction-rules/${j_id}", payload: { pre_adverse_wait_business_days: 6, expected_jurisdiction_rule_version: "${jv}" }, as: ComplianceOfficer }
            - { call: "PATCH /jurisdiction-rules/${j_id}", payload: { pre_adverse_wait_business_days: 8, expected_jurisdiction_rule_version: "${jv}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH: 200, pre_adverse_wait_business_days == 6, version == 2"
            - "second PATCH with stale version: 412 ERR_STALE_VERSION; value stays 6"

