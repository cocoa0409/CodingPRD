    output: Recommendation
    side_effects: ["status OPEN or OVERDUE -> SUBMITTED with evidence_note and completed_date stored", "the policy's compliance_status does not move until every recommendation is resolved", "increments Recommendation.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RECOMMENDATION_NOT_FOUND, ERR_NOT_ACCOUNT_AGENT, ERR_RECOMMENDATION_STATE_INVALID, ERR_POLICY_TERMINAL]

  - method: POST
    path: /recommendations/{id}/review
    description: "Compliance review of submitted evidence: ACCEPT, REJECT or WAIVE."
    roles: [ComplianceOfficer]
    input: ["decision", "review_note?"]
    output: Recommendation
    side_effects: ["ACCEPT -> VERIFIED, REJECT -> back to OPEN, WAIVE -> WAIVED (allowed from OPEN, OVERDUE or SUBMITTED)", "sets reviewed_by_user_id", "when no Recommendation of the policy is left in OPEN / OVERDUE / SUBMITTED, the policy's compliance_status becomes COMPLIANT, every SUSPENDED Endorsement returns to APPROVED and one ENDORSEMENT_ADD PremiumTransaction with reason_code COMPLIANCE_REINSTATEMENT is appended per reinstated endorsement", "increments Recommendation.version by 1 and, when the policy moves, FarmPolicy.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RECOMMENDATION_NOT_FOUND, ERR_RECOMMENDATION_STATE_INVALID, ERR_POLICY_TERMINAL]

  # ------------------------------------------------------------ system drivers
  - method: POST
    path: /compliance-sweeps
    description: "Run the compliance checkpoint: age open recommendations past their due date, escalate critical overdue findings and lapse expired workers-compensation proofs."
    roles: [ComplianceOfficer, PlatformAdmin]
    input: ["policy_id?"]
    output: "{ policies_scanned: integer, recommendations_marked_overdue: integer, policies_marked_recs_overdue: integer, policies_suspended: integer, labor_profiles_lapsed: integer }"
    side_effects: ["every OPEN Recommendation whose due_date < the current logical clock date becomes OVERDUE", "each affected policy moves RECS_OPEN -> RECS_OVERDUE", "a RATED or BOUND policy with a CRITICAL OVERDUE recommendation moves RECS_OVERDUE -> SUSPENDED in the same sweep pass that aged the recommendation and its APPROVED inspection-dependent endorsements are suspended with the matching ENDORSEMENT_REMOVE ledger entries", "every VERIFIED LaborProfile whose wc_expiry_date < the current clock date becomes LAPSED", "rows are processed policy by policy in FarmPolicy.created_at ASC order, and within a policy by Recommendation.sequence_no ASC", "the sweep is idempotent: running it twice at the same clock value changes nothing on the second run"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FARM_POLICY_NOT_FOUND]

  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: set the logical clock used by every temporal rule."
    roles: [PlatformAdmin, Agent, Underwriter, SeniorUnderwriter, LossControlSpecialist, ComplianceOfficer]
    input: ["current_utc"]
    output: "{ current_utc: string }"
    side_effects: ["sets the server's logical clock; if never called the clock reads 2026-08-01T00:00:00Z", "no business row is touched — the clock only changes how later calls evaluate temporal rules"]
    errors: [ERR_INVALID_REQUEST]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================

errors:

  # ---- authentication / authorization
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or blank X-User-ID header."
    triggered_by: "any endpoint except POST /_clock/set_current_utc called without X-User-ID"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    message: "Your role may not perform this operation."
    triggered_by: "caller's role is not in the endpoint's §1.5 roles list"
  - error_id: ERR_NOT_ACCOUNT_AGENT
    http_status: 403
    message: "This account belongs to another producer."
    triggered_by: "an Agent-role caller touching a FarmAccount (or any of its descendants) whose agent_id is not the caller"
  - error_id: ERR_NOT_ASSIGNED_INSPECTOR
    http_status: 403
    message: "Only the assigned inspector may complete this inspection."
    triggered_by: "POST /inspections/{id}/complete where X-User-ID != Inspection.inspector_id"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The underwriter who referred this policy may not decide the referral."
    triggered_by: "POST /farm-policies/{id}/referral-decisions where X-User-ID == FarmPolicy.referred_by_user_id"

  # ---- schema
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body or query parameters are invalid."
    triggered_by: "missing required field, wrong type, unknown field, out-of-range number, invalid enum value, bad pagination"
  - error_id: ERR_INVALID_TERM_DATES
    http_status: 400
    message: "term_end_date must be after term_start_date and the term must span at least 90 days."
    triggered_by: "POST /farm-policies with a reversed, empty or too-short term"

  # ---- existence
  - error_id: ERR_AGENT_NOT_FOUND
    http_status: 404
    message: "Agent not found."
    triggered_by: "unknown {id} on the /agents routes"
  - error_id: ERR_INSPECTOR_NOT_FOUND
    http_status: 404
    message: "Inspector not found."
    triggered_by: "unknown {id} on the /inspectors routes, or an unknown inspector_id on POST /inspections"
  - error_id: ERR_CAT_POOL_NOT_FOUND
    http_status: 404
    message: "Catastrophe capacity pool not found."
    triggered_by: "unknown {id} on the /cat-capacity-pools routes"
  - error_id: ERR_FARM_ACCOUNT_NOT_FOUND
    http_status: 404
    message: "Farm account not found."
    triggered_by: "unknown {id} on /farm-accounts/{id}, or an unknown account_id on POST /farm-policies"
  - error_id: ERR_FARM_POLICY_NOT_FOUND
    http_status: 404
    message: "Farm policy not found."
    triggered_by: "unknown policy {id} on any policy route, or an unknown policy_id on POST /inspections or POST /compliance-sweeps"
  - error_id: ERR_SCHEDULED_ITEM_NOT_FOUND
    http_status: 404
    message: "Scheduled item not found."
    triggered_by: "unknown {id} on the /scheduled-items routes"
  - error_id: ERR_LABOR_PROFILE_NOT_FOUND
    http_status: 404
    message: "Labor profile not found."
    triggered_by: "unknown {id} on the /labor-profiles routes"
  - error_id: ERR_ENDORSEMENT_NOT_FOUND
    http_status: 404
    message: "Endorsement not found."
    triggered_by: "unknown {id} on the /endorsements routes"
  - error_id: ERR_CAT_RESERVATION_NOT_FOUND
    http_status: 404
    message: "Catastrophe reservation not found."
    triggered_by: "unknown {id} on GET /cat-reservations/{id}"
  - error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    message: "Inspection not found."
    triggered_by: "unknown {id} on the /inspections routes"
  - error_id: ERR_RECOMMENDATION_NOT_FOUND
    http_status: 404
    message: "Recommendation not found."
    triggered_by: "unknown {id} on the /recommendations routes"

  # ---- optimistic concurrency
  - error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    message: "The policy has changed since you last read it; re-read and retry."
    triggered_by: "expected_policy_version != FarmPolicy.version on rate, bind, cancel or endorsement creation"
  - error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    message: "The capacity pool has changed since you last read it; re-read and retry."
    triggered_by: "expected_pool_version != CatCapacityPool.version on PATCH /cat-capacity-pools/{id}"

  # ---- state
  - error_id: ERR_POLICY_NOT_IN_DRAFT
    http_status: 409
    message: "The policy must be in DRAFT for this operation."
    triggered_by: "POST /farm-policies/{id}/rate on a policy that is REFERRED, BOUND or already RATED"
  - error_id: ERR_POLICY_NOT_RATED
    http_status: 409
    message: "The policy must be RATED for this operation."
    triggered_by: "bind on a DRAFT / REFERRED policy; endorsement create or decision on a policy that is neither RATED nor BOUND"
  - error_id: ERR_POLICY_NOT_REFERRED
    http_status: 409
    message: "The policy is not awaiting a referral decision."
    triggered_by: "POST /farm-policies/{id}/referral-decisions on a policy whose uw_status != REFERRED"
  - error_id: ERR_POLICY_NOT_BOUND
    http_status: 409
    message: "The policy must be BOUND for this operation."
    triggered_by: "cancel on a policy that is not BOUND; decline on a policy that is already BOUND"
  - error_id: ERR_POLICY_TERMINAL
    http_status: 409
    message: "The policy is closed and can no longer be modified."
    triggered_by: "any mutating call on a DECLINED or CANCELLED policy or on any of its children"
  - error_id: ERR_ENDORSEMENT_NOT_REQUESTED
    http_status: 409
    message: "Only a REQUESTED endorsement can be decided."
    triggered_by: "POST /endorsements/{id}/decision on an endorsement that is already APPROVED, REJECTED, SUSPENDED or RESCINDED"
  - error_id: ERR_ENDORSEMENT_NOT_APPROVED
    http_status: 409
    message: "Only an approved or suspended endorsement can be rescinded."
    triggered_by: "POST /endorsements/{id}/rescind on a REQUESTED, REJECTED or already RESCINDED endorsement"
  - error_id: ERR_INSPECTION_STATE_INVALID
    http_status: 409
    message: "The inspection is not in a state that allows this operation."
    triggered_by: "complete on a COMPLETED or CANCELLED inspection; reinspection on a SCHEDULED or CANCELLED inspection"
  - error_id: ERR_RECOMMENDATION_STATE_INVALID
    http_status: 409
    message: "The recommendation is not in a state that allows this operation."
    triggered_by: "evidence on a SUBMITTED / VERIFIED / WAIVED recommendation; ACCEPT or REJECT review on a recommendation that is not SUBMITTED; any review of a VERIFIED or WAIVED recommendation"
  - error_id: ERR_WC_STATE_INVALID
    http_status: 409
    message: "The labor profile is not awaiting workers-compensation verification."
    triggered_by: "POST /labor-profiles/{id}/wc-verification when coordination_status != PENDING_PROOF"

  # ---- conditional fields
  - error_id: ERR_BLANKET_LIMIT_REQUIRED
    http_status: 422
    message: "blanket_limit_cents is required for a BLANKET limit basis and forbidden for PER_HEAD."
    triggered_by: "POST /farm-policies/{id}/livestock-groups with a mismatched limit_basis / blanket_limit_cents pair"
  - error_id: ERR_PEAK_SEASON_FIELDS_REQUIRED
    http_status: 422
    message: "Seasonal value fields are required for stored crops, hay and inputs and forbidden for other item classes."
    triggered_by: "POST /farm-policies/{id}/scheduled-items or PATCH /scheduled-items/{id} with a partial or misplaced peak-season triple, or peak_season_value_cents < stated_value_cents"
  - error_id: ERR_VISITOR_COUNT_REQUIRED
    http_status: 422
    message: "annual_visitor_count is required for an agritourism exposure and forbidden for other exposure types."
    triggered_by: "POST /farm-policies/{id}/liability-exposures with a mismatched exposure_type / annual_visitor_count pair"

  # ---- business safety
  - error_id: ERR_COMPLIANCE_SUSPENDED
    http_status: 409
    message: "The policy is suspended for outstanding loss-control findings."
    triggered_by: "bind, endorsement creation or endorsement approval while compliance_status == SUSPENDED"
  - error_id: ERR_CRITICAL_REC_OVERDUE
    http_status: 422
    message: "A critical loss-control recommendation is overdue."
    triggered_by: "POST /farm-policies/{id}/bind while a CRITICAL Recommendation of the policy is OVERDUE"
  - error_id: ERR_BUYBACK_INSPECTION_REQUIRED
    http_status: 422
    message: "This endorsement requires a completed loss-control inspection."
    triggered_by: "approving a POLLUTION_BUYBACK or CHEMICAL_APPLICATION_BUYBACK endorsement on a policy with no COMPLETED inspection"
  - error_id: ERR_BUYBACK_HAZARD_TOO_HIGH
    http_status: 422
    message: "The latest inspection hazard score is too high for this buy-back."
    triggered_by: "approving an inspection-dependent endorsement when the latest COMPLETED inspection has hazard_score > 35"

  # ---- business constraints
  - error_id: ERR_DUPLICATE_POOL
    http_status: 409
    message: "A capacity pool already exists for this zone and peril."
    triggered_by: "POST /cat-capacity-pools with an existing (zone_code, peril) pair"
  - error_id: ERR_INSPECTOR_WINDOW_CONFLICT
    http_status: 409
    message: "The inspector already holds an inspection overlapping this window."
    triggered_by: "POST /inspections or POST /inspections/{id}/reinspection whose buffered window overlaps another SCHEDULED inspection of the same inspector"
  - error_id: ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED
    http_status: 409
    message: "The inspector's daily capacity would be exceeded."
    triggered_by: "booked SCHEDULED minutes on the requested UTC date plus duration_minutes > Inspector.daily_capacity_minutes"
  - error_id: ERR_OVERLAPPING_POLICY_TERM
    http_status: 409
    message: "Another live policy on this account already covers part of this term."
    triggered_by: "POST /farm-policies/{id}/rate when a RATED / REFERRED / BOUND sibling policy's closed-closed term overlaps"
  - error_id: ERR_INSPECTOR_INACTIVE
    http_status: 422
    message: "The inspector is not active."
    triggered_by: "scheduling or re-scheduling against an Inspector whose status == INACTIVE"
  - error_id: ERR_ENDORSEMENT_EXPOSURE_MISSING
    http_status: 422
    message: "The policy lacks the liability exposure this endorsement modifies."
    triggered_by: "approving CHEMICAL_APPLICATION_BUYBACK without a CUSTOM_FARMING exposure, or AGRITOURISM_LIABILITY without an AGRITOURISM exposure"

  # ---- business referential
  - error_id: ERR_AGENT_NOT_ACTIVE
    http_status: 422
    message: "The producer's appointment is suspended."
    triggered_by: "POST /farm-policies/{id}/bind while Agent.appointment_status == SUSPENDED"
  - error_id: ERR_WC_COORDINATION_UNVERIFIED
    http_status: 422
    message: "Workers-compensation coordination is not verified."
    triggered_by: "POST /farm-policies/{id}/bind while the LaborProfile coordination_status is PENDING_PROOF or LAPSED"
  - error_id: ERR_WC_PROOF_MISSING
    http_status: 422
    message: "Workers-compensation proof details are missing."
    triggered_by: "bind with no LaborProfile at all, or wc-verification with a blank carrier / policy number / expiry date"

  # ---- business temporal
  - error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    message: "The quote has expired; re-rate the policy."
    triggered_by: "POST /farm-policies/{id}/bind after quote_expires_at"
  - error_id: ERR_WC_PROOF_EXPIRED
    http_status: 422
    message: "The workers-compensation proof on file has expired."
    triggered_by: "bind or wc-verification when wc_expiry_date < the current logical clock date"

  # ---- business fiscal
  - error_id: ERR_CAT_POOL_NOT_CONFIGURED
    http_status: 422
    message: "No catastrophe capacity pool is configured for this zone and peril."
    triggered_by: "rating a policy whose account zone lacks a pool for HAIL, WIND or WILDFIRE"
  - error_id: ERR_NO_RATEABLE_EXPOSURE
    http_status: 422
    message: "The policy has no rateable property or livestock exposure."
    triggered_by: "rating a policy with no ACTIVE ScheduledItem and no LivestockGroup"
  - error_id: ERR_POOL_FROZEN
    http_status: 409
    message: "The catastrophe capacity pool is frozen."
    triggered_by: "rating or binding against a pool whose status == FROZEN"
  - error_id: ERR_CAT_CAPACITY_EXCEEDED
    http_status: 409
    message: "The catastrophe capacity pool cannot absorb this exposure."
    triggered_by: "rating or binding whose prospective utilization on any peril exceeds 1.00"
  - error_id: ERR_AGENT_AUTHORITY_EXCEEDED
    http_status: 422
    message: "The premium exceeds the producer's binding authority."
    triggered_by: "POST /farm-policies/{id}/bind with total_premium_cents > Agent.authority_limit_cents"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================

roles:

  - role: Agent
    identity: "entity_backed:Agent"
    description: "Producer of record. Owns the account, builds the exposure schedule, submits the labor profile and answers loss-control recommendations. Scoped to accounts whose agent_id equals its X-User-ID."
    exclusive_operations:
      - "POST /farm-accounts"
      - "POST /farm-policies"
      - "POST /farm-policies/{id}/scheduled-items"
      - "PATCH /scheduled-items/{id}"
      - "POST /farm-policies/{id}/livestock-groups"
      - "POST /farm-policies/{id}/liability-exposures"
      - "PUT /farm-policies/{id}/labor-profile"
      - "POST /recommendations/{id}/evidence"
    shared_operations:
      - "POST /farm-policies/{id}/endorsements (shared with Underwriter)"
      - "every GET route, restricted to its own accounts"
      - "POST /_clock/set_current_utc"
    forbidden:
      - "rating, referral decisions, binding, declining and cancelling"
      - "endorsement decisions and rescissions"
      - "completing inspections or reviewing its own recommendations"
      - "creating agents, inspectors or capacity pools"

  - role: Underwriter
    identity: opaque
    description: "Line underwriter. Rates, binds, declines and cancels policies, schedules inspections and decides endorsements."
    exclusive_operations:
      - "POST /farm-policies/{id}/bind"
      - "POST /farm-policies/{id}/cancel"
      - "POST /endorsements/{id}/rescind"
    shared_operations:
      - "POST /farm-policies/{id}/rate (shared with SeniorUnderwriter)"
      - "POST /farm-policies/{id}/decline (shared with SeniorUnderwriter)"
      - "POST /endorsements/{id}/decision (shared with SeniorUnderwriter)"
      - "POST /farm-policies/{id}/endorsements (shared with Agent)"
      - "POST /inspections and POST /inspections/{id}/reinspection (shared with ComplianceOfficer)"
      - "every GET route"
      - "POST /_clock/set_current_utc"
    forbidden:
      - "POST /farm-policies/{id}/referral-decisions — a referral can only be decided by a SeniorUnderwriter"
      - "completing inspections, reviewing recommendations, verifying workers-compensation proof"
      - "creating or editing accounts and exposures"

  - role: SeniorUnderwriter
    identity: opaque
    description: "Referral authority. Decides referred policies and can rate, decline and decide endorsements."
    exclusive_operations:
      - "POST /farm-policies/{id}/referral-decisions"
    shared_operations:
      - "POST /farm-policies/{id}/rate (shared with Underwriter)"
      - "POST /farm-policies/{id}/decline (shared with Underwriter)"
      - "POST /endorsements/{id}/decision (shared with Underwriter)"
      - "every GET route"
      - "POST /_clock/set_current_utc"
    forbidden:
      - "binding and cancelling — reserved to the line Underwriter"
      - "deciding a referral it created itself (ERR_SEGREGATION_OF_DUTIES)"
      - "completing inspections and reviewing recommendations"

  - role: LossControlSpecialist
    identity: "entity_backed:Inspector"
    description: "Field inspector. Completes its own scheduled inspections and raises loss-control recommendations."
    exclusive_operations:
      - "POST /inspections/{id}/complete"
    shared_operations:
      - "every GET route"
      - "POST /_clock/set_current_utc"
    forbidden:
      - "scheduling or re-scheduling inspections"
      - "completing an inspection assigned to another inspector (ERR_NOT_ASSIGNED_INSPECTOR)"
      - "reviewing recommendations it raised"
      - "any underwriting or endorsement action"

  - role: ComplianceOfficer
    identity: opaque
    description: "Compliance follow-up. Reviews remediation evidence, verifies workers-compensation coordination and runs the compliance sweep."
    exclusive_operations:
      - "POST /recommendations/{id}/review"
      - "POST /labor-profiles/{id}/wc-verification"
    shared_operations:
      - "POST /compliance-sweeps (shared with PlatformAdmin)"
      - "POST /inspections and POST /inspections/{id}/reinspection (shared with Underwriter)"
      - "every GET route"
      - "POST /_clock/set_current_utc"
    forbidden:
      - "rating, binding, declining, cancelling, referral decisions"
      - "endorsement decisions and rescissions"
      - "completing inspections"

  - role: PlatformAdmin
    identity: opaque
    description: "Reference-data administrator. Registers producers and inspectors, opens and resizes catastrophe capacity pools and can run the compliance sweep."
    exclusive_operations:
      - "POST /agents"
      - "PATCH /agents/{id}"
      - "POST /inspectors"
      - "PATCH /inspectors/{id}"
      - "POST /cat-capacity-pools"
      - "PATCH /cat-capacity-pools/{id}"
    shared_operations:
      - "POST /compliance-sweeps (shared with ComplianceOfficer)"
      - "every GET route"
      - "POST /_clock/set_current_utc"
    forbidden:
      - "every policy-lifecycle action: creating accounts and policies, rating, referral decisions, binding, declining, cancelling"
      - "endorsement requests and decisions"
      - "completing inspections, submitting evidence, reviewing recommendations, verifying workers-compensation proof"
