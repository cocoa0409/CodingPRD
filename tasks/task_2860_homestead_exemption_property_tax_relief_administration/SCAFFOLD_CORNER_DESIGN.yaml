      - name: veteran_benefit_multiplies_relief_by_the_disability_rating
        claim_type: correct_result
        grounds:
          - calculations.exemption_benefit_amount
          - entities.TaxpayerAccount.fields.disability_rating_pct_bps
          - entities.ExemptionGrant.fields.benefit_amount_cents
          - validations[priority=15]
        distinguishing_aspect: "STEP 3 of exemption_benefit_amount applies disability_rating_pct_bps only for program_code VETERAN_DISABILITY: on assessed 33600000 with relief 5000 bps and a 7000 bps rating the benefit is 11760000, not the 16800000 an implementation that ignores the rating would produce."
        test_recipe:
          setup:
            - "VETERAN_DISABILITY program: relief 5000 bps, ceiling 20000000 (non-binding), rank 30."
            - "TaxpayerAccount V has disability_rating_pct_bps 7000, which satisfies the rating > 0 eligibility gate."
            - "Arithmetic: 33600000 * 5000/10000 = 16800000; * 10000/10000 (no income tier) = 16800000; * 7000/10000 = 11760000; min(20000000, 11760000) = 11760000; * 10000/10000 ownership = 11760000."
