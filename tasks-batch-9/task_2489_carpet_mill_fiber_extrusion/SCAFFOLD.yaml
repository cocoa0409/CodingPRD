scenario: |
  Generate task harder than expert level!

  2489. Carpet Mill & Fiber Extrusion (carpet manufacturing plant): fiber extrusion with polymer
  selection, denier and solution dyeing versus piece dyeing decisions, tufting machine setup with
  gauge, pile height and pattern loading, dye lot management with color matching, shade banding and
  re-dye decisions, backing application, latex formulation and curing with delamination testing,
  product testing for wear, stain resistance and flammability with certification requirements, style
  discontinuation, running line versus custom orders and dye lot exhaustion, roll goods inventory
  with cut order processing and remnant management, recycling program for post-consumer carpet
  reclamation

domain_name: carpet-mill-fiber-extrusion
api_prefix: "/mill"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # PolymerLot -> FiberBatch -> ProductionRun -> {DyeLot, RollGood} -> CutAllocation <- CutOrder is a
  # DAG with two self-referential edges (DyeLot.parent_dye_lot_id for re-dye chains,
  # RollGood.parent_roll_id for remnants) and a closing back-edge through the recycling program
  # (RollGood -> ReclamationBatch -> PolymerLot), so the material graph is cyclic at the type level
  # while every instance chain stays acyclic.

  state_machine_shape: cyclic
  # DyeLot MEASURED -> REDYE_QUEUED -> DYEING -> MEASURED is a true revision loop bounded by
  # MAX_REDYE_COUNT; CarpetStyle ACTIVE <-> SUSPENDED and ProductionRun SCHEDULED <-> HELD are
  # certification-driven loops; RollGood carries two independent state dimensions
  # (qa_status x inventory_status); CutOrder ALLOCATED -> BACKORDERED -> ALLOCATED is an
  # allocation retry loop.

  relationship_patterns:
    - one_to_many
    - many_to_many        # CutOrder <-> RollGood through CutAllocation
    - self_referential    # DyeLot.parent_dye_lot_id, RollGood.parent_roll_id
    - cross_aggregate     # Certification (compliance aggregate) gates CutOrder allocation

  role_model: segregation_of_duties
  # The QALabTechnician who runs a ProductTest may never be the CertificationOfficer who issues the
  # Certification that cites it; DealerBuyer is scoped to its own Account.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: account_code
        type: string
        source: input
        description: unique dealer/builder account code
        constraints: "unique across Account; 3-32 chars"
      - name: account_type
        type: enum
        source: input
        description: commercial channel of the account
        constraints: "one of {DEALER, BUILDER, COMMERCIAL}"
      - name: credit_limit_cents
        type: integer
        source: input
        description: maximum outstanding credit in cents
        constraints: ">= 0"
      - name: credit_used_cents
        type: integer
        source: computed
        description: "sum of CutOrder.reserved_credit_cents over CutOrder.status IN {SUBMITTED, ALLOCATED, BACKORDERED, CUT} plus sum of CutOrder.net_invoice_cents over CutOrder.status == SHIPPED, for CutOrder.account_id == this Account"
        default: 0
        constraints: ">= 0; maintained by account_credit_ledger"
      - name: status
        type: enum
        source: computed
        description: credit posture derived from credit_used_cents vs credit_limit_cents, or CLOSED when closed by an operator
        default: ACTIVE
        constraints: "one of {ACTIVE, CREDIT_HOLD, CLOSED}"

  - name: PolymerLot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: unique polymer lot code
        constraints: "unique across PolymerLot"
      - name: polymer_type
        type: enum
        source: input
        description: base polymer selected for extrusion
        constraints: "one of {NYLON_6, NYLON_66, PET, POLYPROPYLENE}"
      - name: received_kg
        type: number
        source: input
        description: dry mass received into the lot, in kg
        constraints: "> 0; 3 decimal places"
      - name: available_kg
        type: number
        source: computed
        description: mass not yet reserved, consumed or scrapped (polymer_mass_conservation)
        constraints: ">= 0; 3 decimal places"
      - name: reserved_kg
        type: number
        source: computed
        description: mass held by FiberBatch rows in status QUEUED
        default: 0
        constraints: ">= 0; 3 decimal places"
      - name: consumed_kg
        type: number
        source: computed
        description: mass drawn by FiberBatch rows that reached SPUN or later
        default: 0
        constraints: ">= 0; 3 decimal places"
      - name: scrapped_kg
        type: number
        source: computed
        description: mass charged off by FiberBatch rows in status SCRAPPED
        default: 0
        constraints: ">= 0; 3 decimal places"
      - name: recycled_content_pct
        type: number
        source: input
        description: declared post-consumer plus post-industrial recycled fraction of this lot, 0-100
        default: 0
        constraints: "0 <= v <= 100; 2 decimal places"
      - name: segregated
        type: boolean
        source: input
        description: true when the lot is physically segregated single-origin reclaim (required for PHYSICAL_SEGREGATION accounting)
        default: false
      - name: reclaim_source
        type: enum
        source: input
        description: provenance of the polymer
        default: VIRGIN
        constraints: "one of {VIRGIN, POST_CONSUMER, POST_INDUSTRIAL}"
      - name: melt_flow_index
        type: number
        source: input
        description: melt flow index (g/10min) used for extrudability screening
        constraints: "> 0; 1 decimal place"
      - name: status
        type: enum
        source: computed
        description: lot posture derived from available_kg
        default: AVAILABLE
        constraints: "one of {AVAILABLE, DEPLETED}"

  - name: ReclamationBatch
    parent: null
    common_fields: true
    fields:
      - name: batch_code
        type: string
        source: input
        description: unique reclamation intake code
        constraints: "unique across ReclamationBatch"
      - name: source_roll_good_id
        type: string
        source: input
        description: "FK -> RollGood.id; nullable — set when the intake is a mill remnant or returned roll rather than third-party post-consumer carpet"
        default: null
      - name: intake_lbs
        type: number
        source: input
        description: gross weight of reclaimed carpet received, in pounds
        constraints: "> 0; 1 decimal place"
      - name: face_fiber_type
        type: enum
        source: input
        description: identified face fiber of the reclaimed carpet
        constraints: "one of {NYLON_6, NYLON_66, PET, POLYPROPYLENE}"
      - name: contamination_pct
        type: number
        source: input
        description: measured non-fiber contamination fraction of the intake, 0-100
        constraints: "0 <= v <= 100; 1 decimal place"
      - name: depolymerized_kg
        type: number
        source: computed
        description: reclaimed polymer mass yielded by depolymerization (reclamation_yield)
        default: 0
        constraints: ">= 0; 3 decimal places"
      - name: output_polymer_lot_id
        type: string
        source: computed
        description: "FK -> PolymerLot.id; nullable until depolymerization mints the reclaimed lot"
        default: null
      - name: status
        type: enum
        source: system
        description: reclamation lifecycle state
        default: RECEIVED
        constraints: "one of {RECEIVED, DEPOLYMERIZED}"

  - name: FiberBatch
    parent: null
    common_fields: true
    fields:
      - name: batch_code
        type: string
        source: input
        description: unique extrusion batch code
        constraints: "unique across FiberBatch"
      - name: polymer_lot_id
        type: string
        source: input
        description: "FK -> PolymerLot.id; primary polymer stream for this extrusion"
      - name: input_kg
        type: number
        source: input
        description: mass drawn from polymer_lot_id, in kg
        constraints: "> 0; 3 decimal places"
      - name: blend_polymer_lot_id
        type: string
        source: input
        description: "FK -> PolymerLot.id; nullable — second polymer stream metered into the same extruder for blended recycled content"
        default: null
      - name: blend_input_kg
        type: number
        source: input
        description: mass drawn from blend_polymer_lot_id, in kg
        default: 0
        constraints: ">= 0; 3 decimal places; must be > 0 exactly when blend_polymer_lot_id is present"
      - name: denier_target
        type: number
        source: input
        description: specified total denier of the spun yarn bundle
        constraints: "> 0; 1 decimal place"
      - name: filament_count
        type: integer
        source: input
        description: filaments per yarn bundle leaving the spinneret
        constraints: ">= 1"
      - name: dye_method
        type: enum
        source: input
        description: whether pigment is metered into the melt or the yarn is left greige for piece dyeing
        constraints: "one of {SOLUTION_DYED, PIECE_DYED_READY}"
      - name: solution_color_code
        type: string
        source: input
        description: pigment color code metered into the melt
        default: null
        constraints: "required exactly when dye_method == SOLUTION_DYED; must be null otherwise"
      - name: throughput_g_per_min
        type: number
        source: input
        description: extruder mass throughput recorded at spin start, g/min
        default: null
        constraints: "> 0; supplied by the extrude call"
      - name: spin_speed_m_per_min
        type: number
        source: input
        description: take-up speed recorded at spin start, m/min
        default: null
        constraints: "> 0; supplied by the extrude call"
      - name: denier_actual
        type: number
        source: computed
        description: denier back-calculated from throughput and take-up speed (denier_actual_from_throughput)
        default: null
        constraints: "1 decimal place"
      - name: extruded_kg
        type: number
        source: computed
        description: spun yarn mass yielded from the total input mass
        default: null
        constraints: ">= 0; 3 decimal places"
      - name: status
        type: enum
        source: system
        description: extrusion lifecycle state
        default: QUEUED
        constraints: "one of {QUEUED, SPUN, RELEASED, ALLOCATED, CONSUMED, SCRAPPED}"

  - name: CarpetStyle
    parent: null
    common_fields: true
    fields:
      - name: style_code
        type: string
        source: input
        description: unique style code
        constraints: "unique across CarpetStyle"
      - name: line_type
        type: enum
        source: input
        description: whether the style is a stocked running line or a made-to-order custom style
        constraints: "one of {RUNNING_LINE, CUSTOM}"
      - name: gauge_code
        type: enum
        source: input
        description: needle spacing the style must be tufted at
        constraints: "one of {G_1_8, G_1_10, G_5_64}"
      - name: pile_construction
        type: enum
        source: input
        description: cut pile or loop pile
        constraints: "one of {CUT, LOOP}"
      - name: pile_height_mm
        type: number
        source: input
        description: specified finished pile height in mm
        constraints: "> 0; 1 decimal place"
      - name: pattern_repeat_mm
        type: number
        source: input
        description: specified pattern repeat length in mm that must be loaded on the tufter
        constraints: "> 0; 1 decimal place"
      - name: plies
        type: integer
        source: input
        description: yarn plies twisted per tuft
        constraints: ">= 1"
      - name: target_face_weight_oz
        type: number
        source: input
        description: specified face weight in oz per square yard
        constraints: "> 0; 2 decimal places"
      - name: dye_method
        type: enum
        source: input
        description: whether the style is built from solution-dyed yarn or piece-dyed greige goods
        constraints: "one of {SOLUTION_DYED, PIECE_DYED}"
      - name: solution_color_code
        type: string
        source: input
        description: required pigment color code when dye_method == SOLUTION_DYED
        default: null
        constraints: "required exactly when dye_method == SOLUTION_DYED; must be null otherwise"
      - name: list_price_cents_per_yard
        type: integer
        source: input
        description: list price per linear yard in cents
        constraints: "> 0"
      - name: open_backorder_yards
        type: number
        source: computed
        description: "sum of (CutOrder.requested_yards - CutOrder.allocated_yards) over CutOrder.status == BACKORDERED for CutOrder.style_id == this style"
        default: 0
        constraints: ">= 0; 1 decimal place"
      - name: replenishment_flag
        type: enum
        source: computed
        description: set to REPLENISH_REQUIRED once open_backorder_yards crosses STYLE_BACKORDER_ALERT_YARDS
        default: NONE
        constraints: "one of {NONE, REPLENISH_REQUIRED}"
      - name: status
        type: enum
        source: system
        description: style lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, RUNOUT, DISCONTINUED}"

  - name: TuftingMachine
    parent: null
    common_fields: true
    fields:
      - name: machine_code
        type: string
        source: input
        description: unique tufter identifier
        constraints: "unique across TuftingMachine"
      - name: native_gauge_code
        type: enum
        source: input
        description: needle bar gauge physically installed on the tufter
        constraints: "one of {G_1_8, G_1_10, G_5_64}"
      - name: min_pile_height_mm
        type: number
        source: input
        description: lowest pile height the needle stroke can produce
        constraints: "> 0; 1 decimal place"
      - name: max_pile_height_mm
        type: number
        source: input
        description: highest pile height the needle stroke can produce
        constraints: "> min_pile_height_mm; 1 decimal place"
      - name: changeover_minutes
        type: integer
        source: input
        description: setup buffer that must precede every run on this tufter
        constraints: ">= 0"
      - name: needle_bar_width_in
        type: number
        source: input
        description: usable needle bar width in inches
        constraints: "> 0; 1 decimal place"
      - name: status
        type: enum
        source: input
        description: machine availability posture
        default: IDLE
        constraints: "one of {IDLE, MAINTENANCE}"

  - name: DyeVessel
    parent: null
    common_fields: true
    fields:
      - name: vessel_code
        type: string
        source: input
        description: unique beck/jet identifier
        constraints: "unique across DyeVessel"
      - name: vessel_type
        type: enum
        source: input
        description: dye machine family
        constraints: "one of {BECK, JET}"
      - name: capacity_kg
        type: number
        source: input
        description: maximum simultaneous goods mass the vessel can hold, in kg
        constraints: "> 0; 1 decimal place"
      - name: status
        type: enum
        source: input
        description: vessel availability posture
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE}"

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: run_code
        type: string
        source: input
        description: unique tufting run code
        constraints: "unique across ProductionRun"
      - name: style_id
        type: string
        source: input
        description: "FK -> CarpetStyle.id; style being tufted"
      - name: machine_id
        type: string
        source: input
        description: "FK -> TuftingMachine.id; tufter reserved for the run"
      - name: fiber_batch_id
        type: string
        source: input
        description: "FK -> FiberBatch.id; yarn creeled for the run"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: nominal run start, ISO 8601 UTC
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: nominal run end, ISO 8601 UTC
        constraints: "> scheduled_start_utc"
      - name: gauge_loaded_code
        type: enum
        source: input
        description: gauge actually loaded at setup, recorded by the load-setup call
        default: null
        constraints: "one of {G_1_8, G_1_10, G_5_64}"
      - name: pile_height_set_mm
        type: number
        source: input
        description: pile height dialled in at setup, mm
        default: null
        constraints: "> 0; 1 decimal place"
      - name: pattern_repeat_loaded_mm
        type: number
        source: input
        description: pattern repeat length loaded into the pattern controller, mm
        default: null
        constraints: "> 0; 1 decimal place"
      - name: stitch_rate_per_inch
        type: number
        source: input
        description: stitches per inch dialled in at setup
        default: null
        constraints: "> 0; 1 decimal place"
      - name: greige_yards
        type: number
        source: input
        description: linear yards of greige goods produced, recorded at complete-greige
        default: null
        constraints: "> 0; 1 decimal place"
      - name: face_weight_oz_per_sy
        type: number
        source: computed
        description: face weight computed at complete-greige (face_weight_per_square_yard)
        default: null
        constraints: "2 decimal places"
      - name: sbr_pct
        type: number
        source: input
        description: styrene-butadiene latex solids share of the backing compound, recorded at apply-backing
        default: null
        constraints: "30 <= v <= 70; 1 decimal place"
      - name: filler_load_pct
        type: number
        source: input
        description: calcium carbonate filler load of the backing compound, recorded at apply-backing
        default: null
        constraints: "0 <= v <= 60; 1 decimal place"
      - name: cure_temp_c
        type: integer
        source: input
        description: oven cure temperature in Celsius, recorded at apply-backing
        default: null
        constraints: "100 <= v <= 200"
      - name: cure_seconds
        type: integer
        source: input
        description: oven dwell time in seconds, recorded at apply-backing
        default: null
        constraints: ">= 1"
      - name: secondary_backing_type
        type: enum
        source: input
        description: secondary backing laminated onto the primary
        default: null
        constraints: "one of {ACTION_BAC, WOVEN_POLYPROPYLENE, CUSHION}"
      - name: delamination_strength_lbf
        type: number
        source: computed
        description: peel strength predicted from the latex formulation and cure (delamination_strength)
        default: null
        constraints: "2 decimal places"
      - name: recoat_count
        type: integer
        source: computed
        description: number of times the run has returned from BACKING_FAILED to GREIGE
        default: 0
        constraints: "0 <= v <= RECOAT_LIMIT"
      - name: status
        type: enum
        source: system
        description: run lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD, TUFTING, GREIGE, BACKED, BACKING_FAILED, RELEASED, ABORTED}"

  - name: DyeLot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: unique dye lot code
        constraints: "unique across DyeLot"
      - name: production_run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; greige goods being piece dyed"
      - name: vessel_id
        type: string
        source: input
        description: "FK -> DyeVessel.id; vessel booked for the dye window"
      - name: parent_dye_lot_id
        type: string
        source: system
        description: "FK -> DyeLot.id; nullable — set on a re-dye child lot to the lot it re-dyes"
        default: null
      - name: color_code
        type: string
        source: input
        description: target color code being dyed
      - name: target_lab_l
        type: number
        source: input
        description: CIELAB L* of the color standard
        constraints: "2 decimal places"
      - name: target_lab_a
        type: number
        source: input
        description: CIELAB a* of the color standard
        constraints: "2 decimal places"
      - name: target_lab_b
        type: number
        source: input
        description: CIELAB b* of the color standard
        constraints: "2 decimal places"
      - name: measured_lab_l
        type: number
        source: input
        description: CIELAB L* measured on the dyed goods, recorded by the measurements call
        default: null
        constraints: "2 decimal places"
      - name: measured_lab_a
        type: number
        source: input
        description: CIELAB a* measured on the dyed goods
        default: null
        constraints: "2 decimal places"
      - name: measured_lab_b
        type: number
        source: input
        description: CIELAB b* measured on the dyed goods
        default: null
        constraints: "2 decimal places"
      - name: delta_e
        type: number
        source: computed
        description: CIE76 color difference between measured and target (color_delta_e)
        default: null
        constraints: ">= 0; 2 decimal places"
      - name: shade_band
        type: enum
        source: computed
        description: shade band assigned from delta_e (shade_band_assignment)
        default: null
        constraints: "one of {A, B, C, OUT}"
      - name: lot_kg
        type: number
        source: input
        description: goods mass loaded into the vessel for this lot, kg
        constraints: "> 0; 1 decimal place"
      - name: dye_start_utc
        type: datetime
        source: input
        description: start of the booked vessel window, ISO 8601 UTC
      - name: dye_end_utc
        type: datetime
        source: input
        description: end of the booked vessel window, ISO 8601 UTC
        constraints: "> dye_start_utc"
      - name: dyed_yards
        type: number
        source: input
        description: linear yards of greige goods entering this lot
        constraints: "> 0; 1 decimal place"
      - name: scrapped_yards
        type: number
        source: computed
        description: yards written off from this lot by roll-good scrapping
        default: 0
        constraints: ">= 0; 1 decimal place"
      - name: uncommitted_yards
        type: number
        source: computed
        description: yards still sellable under the COMMITMENT_AWARE variant of dye_lot_uncommitted_yards
        constraints: ">= 0; 1 decimal place"
      - name: shipped_basis_uncommitted_yards
        type: number
        source: computed
        description: yards still sellable under the SHIPPED_ONLY variant of dye_lot_uncommitted_yards
        constraints: ">= 0; 1 decimal place"
      - name: redye_count
        type: integer
        source: computed
        description: number of completed re-dye cycles on this lot
        default: 0
        constraints: "0 <= v <= MAX_REDYE_COUNT"
      - name: status
        type: enum
        source: system
        description: dye lot lifecycle state
        default: FORMULATED
        constraints: "one of {FORMULATED, DYEING, MEASURED, APPROVED, REDYE_QUEUED, EXHAUSTED, REJECTED}"

  - name: RollGood
    parent: null
    common_fields: true
    fields:
      - name: roll_number
        type: string
        source: input
        description: unique roll number
        constraints: "unique across RollGood"
      - name: production_run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; run that produced the roll"
      - name: dye_lot_id
        type: string
        source: input
        description: "FK -> DyeLot.id; nullable — null exactly for solution-dyed styles"
        default: null
      - name: parent_roll_id
        type: string
        source: system
        description: "FK -> RollGood.id; nullable — set on a remnant split off from a parent roll during cutting"
        default: null
      - name: width_ft
        type: number
        source: input
        description: roll width in feet
        constraints: "> 0; 1 decimal place"
      - name: initial_yards
        type: number
        source: input
        description: linear yards on the roll at creation
        constraints: "> 0; 1 decimal place"
      - name: available_yards
        type: number
        source: computed
        description: "initial_yards minus sum of CutAllocation.yards over CutAllocation.status IN {RESERVED, CUT, SHIPPED} for this roll, forced to 0 when inventory_status == SCRAPPED (roll_good_yardage_ledger)"
        constraints: ">= 0; 1 decimal place"
      - name: shade_band
        type: enum
        source: computed
        description: shade band snapshot copied from the dye lot at creation, or SOLUTION for solution-dyed rolls
        constraints: "one of {A, B, C, SOLUTION} — OUT is impossible because a roll may only be doffed against an APPROVED lot"
      - name: is_remnant
        type: boolean
        source: computed
        description: true exactly when parent_roll_id is not null
        default: false
      - name: qa_status
        type: enum
        source: system
        description: quality dimension of the roll, independent of inventory_status
        default: PENDING
        constraints: "one of {PENDING, PASSED, HELD, FAILED}"
      - name: inventory_status
        type: enum
        source: system
        description: inventory dimension of the roll, independent of qa_status
        default: IN_PROCESS
        constraints: "one of {IN_PROCESS, AVAILABLE, COMMITTED, DEPLETED, SCRAPPED}"

  - name: ProductTest
    parent: null
    common_fields: false
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> CarpetStyle.id; style under test"
      - name: roll_good_id
        type: string
        source: input
        description: "FK -> RollGood.id; physical roll the specimen was cut from"
      - name: test_type
        type: enum
        source: input
        description: standardized test performed
        constraints: "one of {WEAR_TARR, STAIN_AATCC175, FLAMMABILITY_PILL}"
      - name: result_value
        type: number
        source: input
        description: "raw instrument reading — TARR rating 1.0-5.0 for WEAR_TARR, AATCC red-dye scale 1.0-10.0 for STAIN_AATCC175, char radius in mm for FLAMMABILITY_PILL"
        constraints: "> 0; 1 decimal place"
      - name: verdict
        type: enum
        source: computed
        description: pass/fail derived per test_type (product_test_verdict)
        constraints: "one of {PASS, FAIL}"
      - name: tested_by_user_id
        type: string
        source: system
        description: X-User-ID of the QALabTechnician who recorded the test
      - name: tested_at_utc
        type: datetime
        source: system
        description: logical-clock instant the test was recorded

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> CarpetStyle.id; style being certified"
      - name: cert_type
        type: enum
        source: input
        description: certificate being issued
        constraints: "one of {DOC_FF_1_70, NSF_140, GREEN_LABEL_PLUS}"
      - name: accounting_basis
        type: enum
        source: input
        description: recycled-content accounting basis the certificate is issued under
        default: NOT_APPLICABLE
        constraints: "one of {MASS_BALANCE, PHYSICAL_SEGREGATION, NOT_APPLICABLE}; must be MASS_BALANCE or PHYSICAL_SEGREGATION exactly when cert_type == NSF_140"
      - name: source_test_ids
        type: array
        source: input
        description: ProductTest ids cited as evidence for this certificate
        constraints: "non-empty for DOC_FF_1_70 and GREEN_LABEL_PLUS; may be empty for NSF_140"
      - name: recorded_recycled_content_pct
        type: number
        source: computed
        description: recycled content computed under accounting_basis at issuance (style_recycled_content_pct)
        default: null
        constraints: "2 decimal places"
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationOfficer who issued the certificate
      - name: issued_at_utc
        type: datetime
        source: system
        description: logical-clock instant of issuance
      - name: expires_at_utc
        type: datetime
        source: input
        description: expiry instant of the certificate, ISO 8601 UTC
        constraints: "> issued_at_utc"
      - name: status
        type: enum
        source: system
        description: certificate lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, LAPSED, REVOKED, SUPERSEDED}"

  - name: CutOrder
    parent: null
    common_fields: true
    fields:
      - name: order_code
        type: string
        source: input
        description: unique cut order code
        constraints: "unique across CutOrder"
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; buying account"
      - name: style_id
        type: string
        source: input
        description: "FK -> CarpetStyle.id; style ordered"
      - name: order_type
        type: enum
        source: input
        description: whether the order draws from running-line stock or is a custom make
        constraints: "one of {RUNNING_LINE, CUSTOM}"
      - name: requested_yards
        type: number
        source: input
        description: linear yards requested
        constraints: "> 0; 1 decimal place"
      - name: shade_tolerance
        type: enum
        source: input
        description: shade continuity the buyer requires across the allocated rolls
        constraints: "one of {SINGLE_LOT, BAND_MATCH, ANY}"
      - name: allocated_yards
        type: number
        source: computed
        description: "sum of CutAllocation.yards over CutAllocation.status IN {RESERVED, CUT, SHIPPED} for this order"
        default: 0
        constraints: ">= 0; 1 decimal place"
      - name: reserved_credit_cents
        type: integer
        source: computed
        description: credit held against the account for this order (cut_order_credit_reservation)
        default: 0
        constraints: ">= 0"
      - name: gross_cents
        type: integer
        source: computed
        description: sum of per-line rounded allocation charges (cut_order_line_charges)
        default: 0
        constraints: ">= 0"
      - name: freight_cents
        type: integer
        source: computed
        description: freight tier charge keyed on gross_cents (cut_order_settlement)
        default: 0
        constraints: ">= 0"
      - name: remnant_credit_cents
        type: integer
        source: computed
        description: remnant-utilisation credit keyed on gross_cents (cut_order_settlement)
        default: 0
        constraints: ">= 0"
      - name: net_invoice_cents
        type: integer
        source: computed
        description: gross_cents + freight_cents - remnant_credit_cents (cut_order_settlement)
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: cut order lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ALLOCATED, BACKORDERED, CUT, SHIPPED, CANCELLED}"

  - name: CutAllocation
    parent: null
    common_fields: true
    fields:
      - name: cut_order_id
        type: string
        source: input
        description: "FK -> CutOrder.id; order the yards are committed to"
      - name: roll_good_id
        type: string
        source: input
        description: "FK -> RollGood.id; roll the yards are drawn from"
      - name: yards
        type: number
        source: input
        description: linear yards committed on this line
        constraints: "> 0; 1 decimal place"
      - name: shade_band
        type: enum
        source: computed
        description: shade band snapshot copied from the roll at reservation
        constraints: "one of {A, B, C, SOLUTION}"
      - name: from_remnant
        type: boolean
        source: computed
        description: true exactly when the sourced roll had is_remnant == true at reservation
        default: false
      - name: line_cents
        type: integer
        source: computed
        description: per-line rounded charge for this allocation (cut_order_line_charges)
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: allocation lifecycle state
        default: RESERVED
        constraints: "one of {RESERVED, CUT, SHIPPED, RELEASED, VOIDED}"

state_machines:
  - entity: PolymerLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system — recomputation of polymer_mass_conservation after any FiberBatch create/extrude/disposition that drives available_kg to exactly 0"
        actor: system
        preconditions:
          - "available_kg == 0 after the recomputation"
        side_effects:
          - "sets PolymerLot.status = DEPLETED"
          - "increments PolymerLot.version by 1 and refreshes updated_at"
        note: "status is a pure function of available_kg; no operator endpoint sets it."
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system — recomputation of polymer_mass_conservation after a FiberBatch in QUEUED is scrapped, returning reserved_kg to available_kg"
        actor: system
        preconditions:
          - "available_kg > 0 after the recomputation"
        side_effects:
          - "sets PolymerLot.status = AVAILABLE"
          - "increments PolymerLot.version by 1 and refreshes updated_at"

  - entity: ReclamationBatch
    initial_state: RECEIVED
    terminal_states: [DEPOLYMERIZED]
    transitions:
      - from: RECEIVED
        to: DEPOLYMERIZED
        trigger: "POST /mill/reclamation-batches/{reclamation_batch_id}/depolymerize"
        actor: ExtrusionOperator
        preconditions:
          - "ReclamationBatch.contamination_pct <= MAX_RECLAIM_CONTAMINATION_PCT (else ERR_RECLAIM_CONTAMINATION_EXCEEDED)"
          - "when source_roll_good_id is not null, that RollGood.inventory_status IN {DEPLETED, SCRAPPED} (else ERR_ROLL_NOT_RECLAIMABLE)"
        side_effects:
          - "computes ReclamationBatch.depolymerized_kg via reclamation_yield"
          - "mints a new PolymerLot with polymer_type = ReclamationBatch.face_fiber_type, received_kg = depolymerized_kg, recycled_content_pct = 100.00, segregated = true, reclaim_source = POST_CONSUMER, status = AVAILABLE, and sets ReclamationBatch.output_polymer_lot_id to its id"
          - "sets ReclamationBatch.status = DEPOLYMERIZED"

  - entity: FiberBatch
    initial_state: QUEUED
    terminal_states: [CONSUMED, SCRAPPED]
    transitions:
      - from: QUEUED
        to: SPUN
        trigger: "POST /mill/fiber-batches/{fiber_batch_id}/extrude"
        actor: ExtrusionOperator
        preconditions:
          - "FiberBatch.status == QUEUED"
          - "PolymerLot(polymer_lot_id).melt_flow_index >= MIN_MELT_FLOW_INDEX (else ERR_MELT_FLOW_OUT_OF_RANGE)"
          - "when blend_polymer_lot_id is not null, PolymerLot(blend_polymer_lot_id).polymer_type == PolymerLot(polymer_lot_id).polymer_type (else ERR_POLYMER_BLEND_INCOMPATIBLE)"
        side_effects:
          - "computes FiberBatch.denier_actual via denier_actual_from_throughput"
          - "computes FiberBatch.extruded_kg = round_half_up((input_kg + blend_input_kg) * SPIN_YIELD, 3)"
          - "moves input_kg from PolymerLot(polymer_lot_id).reserved_kg to consumed_kg, and blend_input_kg from PolymerLot(blend_polymer_lot_id).reserved_kg to consumed_kg"
          - "recomputes both PolymerLot rows' available_kg and status per polymer_mass_conservation"
      - from: SPUN
        to: RELEASED
        trigger: "POST /mill/fiber-batches/{fiber_batch_id}/disposition with disposition = RELEASE"
        actor: ExtrusionOperator
        preconditions:
          - "FiberBatch.status == SPUN"
          - "abs(denier_actual - denier_target) / denier_target <= DENIER_TOLERANCE_FRACTION, evaluated on denier_actual rounded to 1 decimal (else ERR_DENIER_OUT_OF_TOLERANCE)"
        side_effects:
          - "sets FiberBatch.status = RELEASED, making the batch creelable by a ProductionRun"
      - from: SPUN
        to: SCRAPPED
        trigger: "POST /mill/fiber-batches/{fiber_batch_id}/disposition with disposition = SCRAP"
        actor: ExtrusionOperator
        preconditions:
          - "FiberBatch.status == SPUN"
        side_effects:
          - "moves input_kg (and blend_input_kg) from the source PolymerLot rows' consumed_kg to scrapped_kg"
          - "recomputes each source PolymerLot.available_kg and status per polymer_mass_conservation (available_kg is unchanged; the mass is charged off, not returned)"
      - from: QUEUED
        to: SCRAPPED
        trigger: "POST /mill/fiber-batches/{fiber_batch_id}/disposition with disposition = SCRAP"
        actor: ExtrusionOperator
        preconditions:
          - "FiberBatch.status == QUEUED"
        side_effects:
          - "returns input_kg (and blend_input_kg) from the source PolymerLot rows' reserved_kg to available_kg — the compensating leg of polymer_mass_conservation"
          - "recomputes each source PolymerLot.status; a DEPLETED lot whose available_kg becomes > 0 returns to AVAILABLE"
      - from: RELEASED
        to: ALLOCATED
        trigger: "POST /mill/production-runs (creation reserves the creel)"
        actor: MillPlanner
        preconditions:
          - "FiberBatch.status == RELEASED (else ERR_FIBER_BATCH_NOT_RELEASED)"
        side_effects:
          - "sets FiberBatch.status = ALLOCATED"
      - from: ALLOCATED
        to: RELEASED
        trigger: "system — ProductionRun leaves SCHEDULED or HELD for ABORTED"
        actor: system
        preconditions:
          - "the owning ProductionRun transitions to ABORTED"
        side_effects:
          - "sets FiberBatch.status = RELEASED, returning the creel to the pool — the compensating leg of the run-abort cascade"
      - from: ALLOCATED
        to: CONSUMED
        trigger: "system — ProductionRun TUFTING -> GREIGE"
        actor: system
        preconditions:
          - "the owning ProductionRun reaches GREIGE"
        side_effects:
          - "sets FiberBatch.status = CONSUMED"

  - entity: CarpetStyle
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mill/styles/{style_id}/activate"
        actor: MillPlanner
        preconditions:
          - "CarpetStyle.status == DRAFT"
          - "solution_color_code is not null exactly when dye_method == SOLUTION_DYED (else ERR_DYE_METHOD_COLOR_MISMATCH)"
        side_effects:
          - "sets CarpetStyle.status = ACTIVE, making the style schedulable and orderable"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — the style's last EFFECTIVE DOC_FF_1_70 Certification becomes REVOKED (POST /mill/certifications/{certification_id}/revoke) or LAPSED (POST /mill/_clock/set_current_utc advancing past expires_at_utc)"
        actor: system
        preconditions:
          - "CarpetStyle.status == ACTIVE"
          - "no Certification with style_id == this style, cert_type == DOC_FF_1_70 and status == ACTIVE and expires_at_utc > logical clock remains"
        side_effects:
          - "sets CarpetStyle.status = SUSPENDED"
          - "cascade hop: every ProductionRun with style_id == this style and status == SCHEDULED transitions SCHEDULED -> HELD"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — a fresh DOC_FF_1_70 Certification is issued for the style (POST /mill/certifications)"
        actor: system
        preconditions:
          - "CarpetStyle.status == SUSPENDED"
          - "a Certification with cert_type == DOC_FF_1_70, status == ACTIVE and expires_at_utc > logical clock now exists for the style"
        side_effects:
          - "sets CarpetStyle.status = ACTIVE"
          - "cascade hop: every ProductionRun with style_id == this style and status == HELD transitions HELD -> SCHEDULED"
        note: "closes the ACTIVE <-> SUSPENDED revision loop; the loop is unbounded because certificates may be revoked and re-issued repeatedly."
      - from: ACTIVE
        to: RUNOUT
        trigger: "POST /mill/styles/{style_id}/discontinue"
        actor: MillPlanner
        preconditions:
          - "CarpetStyle.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "sets CarpetStyle.status = RUNOUT — no new ProductionRun may be created and no CUSTOM CutOrder may be submitted"
          - "cascade hop 1: every CutOrder with style_id == this style, order_type == CUSTOM and status == SUBMITTED transitions SUBMITTED -> CANCELLED"
          - "cascade hop 2 (caused by hop 1): each such CutOrder cancellation drives account_credit_ledger, decrementing Account.credit_used_cents by that order's reserved_credit_cents and setting the order's reserved_credit_cents to 0"
          - "cascade hop 3 (caused by hop 2): each Account whose credit_used_cents now satisfies credit_used_cents < credit_limit_cents and whose status == CREDIT_HOLD transitions CREDIT_HOLD -> ACTIVE"
          - "fan-out (not part of the transitive chain): every ProductionRun with style_id == this style and status IN {SCHEDULED, HELD} transitions to ABORTED"
      - from: SUSPENDED
        to: RUNOUT
        trigger: "POST /mill/styles/{style_id}/discontinue"
        actor: MillPlanner
        preconditions:
          - "CarpetStyle.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "identical to the ACTIVE -> RUNOUT side-effect chain"
      - from: RUNOUT
        to: DISCONTINUED
        trigger: "system — evaluated after every CutOrder ship or cancel"
        actor: system
        preconditions:
          - "CarpetStyle.status == RUNOUT"
          - "no RollGood produced by a run of this style has inventory_status IN {AVAILABLE, COMMITTED}"
          - "no CutOrder with style_id == this style has status IN {SUBMITTED, ALLOCATED, BACKORDERED, CUT}"
        side_effects:
          - "sets CarpetStyle.status = DISCONTINUED (terminal)"

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [RELEASED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: TUFTING
        trigger: "POST /mill/production-runs/{production_run_id}/load-setup"
        actor: MillPlanner
        preconditions:
          - "ProductionRun.status == SCHEDULED"
          - "CarpetStyle(style_id).status == ACTIVE (cross-entity gate; else ERR_STYLE_NOT_ACTIVE)"
          - "TuftingMachine(machine_id).status == IDLE (else ERR_MACHINE_UNAVAILABLE)"
          - "FiberBatch(fiber_batch_id).status == ALLOCATED"
          - "gauge_loaded_code == CarpetStyle.gauge_code (else ERR_GAUGE_MISMATCH)"
          - "gauge_loaded_code == TuftingMachine.native_gauge_code (else ERR_MACHINE_GAUGE_INCOMPATIBLE)"
          - "TuftingMachine.min_pile_height_mm <= pile_height_set_mm <= TuftingMachine.max_pile_height_mm (else ERR_PILE_HEIGHT_OUT_OF_RANGE)"
          - "abs(pile_height_set_mm - CarpetStyle.pile_height_mm) <= PILE_HEIGHT_SPEC_TOLERANCE_MM (else ERR_PILE_HEIGHT_SPEC_DEVIATION)"
          - "pattern_repeat_loaded_mm == CarpetStyle.pattern_repeat_mm (else ERR_PATTERN_REPEAT_MISMATCH)"
          - "logical clock >= ProductionRun.scheduled_start_utc (else ERR_RUN_WINDOW_NOT_OPEN)"
        side_effects:
          - "persists gauge_loaded_code, pile_height_set_mm, pattern_repeat_loaded_mm, stitch_rate_per_inch"
          - "sets ProductionRun.status = TUFTING"
      - from: SCHEDULED
        to: HELD
        trigger: "system — CarpetStyle ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "ProductionRun.status == SCHEDULED"
        side_effects:
          - "sets ProductionRun.status = HELD; the machine window stays booked so no other run may take the slot"
      - from: HELD
        to: SCHEDULED
        trigger: "system — CarpetStyle SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "ProductionRun.status == HELD"
        side_effects:
          - "sets ProductionRun.status = SCHEDULED"
        note: "closes the SCHEDULED <-> HELD loop driven by certificate revoke/re-issue."
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /mill/production-runs/{production_run_id}/abort, or system cascade from CarpetStyle -> RUNOUT"
        actor: MillPlanner | system
        preconditions:
          - "ProductionRun.status IN {SCHEDULED, HELD}"
        side_effects:
          - "sets ProductionRun.status = ABORTED and frees the machine window for overlap checks"
          - "cascade: FiberBatch(fiber_batch_id) transitions ALLOCATED -> RELEASED"
      - from: HELD
        to: ABORTED
        trigger: "POST /mill/production-runs/{production_run_id}/abort, or system cascade from CarpetStyle -> RUNOUT"
        actor: MillPlanner | system
        preconditions:
          - "ProductionRun.status IN {SCHEDULED, HELD}"
        side_effects:
          - "identical to the SCHEDULED -> ABORTED side-effect set"
      - from: TUFTING
        to: GREIGE
        trigger: "POST /mill/production-runs/{production_run_id}/complete-greige"
        actor: MillPlanner
        preconditions:
          - "ProductionRun.status == TUFTING"
          - "greige_yards > 0"
          - "abs(face_weight_oz_per_sy - CarpetStyle.target_face_weight_oz) <= FACE_WEIGHT_TOLERANCE_OZ, evaluated on the rounded face_weight_oz_per_sy (else ERR_FACE_WEIGHT_OUT_OF_TOLERANCE)"
        side_effects:
          - "computes ProductionRun.face_weight_oz_per_sy via face_weight_per_square_yard"
          - "sets ProductionRun.status = GREIGE"
          - "cascade: FiberBatch(fiber_batch_id) transitions ALLOCATED -> CONSUMED"
      - from: GREIGE
        to: BACKED
        trigger: "POST /mill/production-runs/{production_run_id}/apply-backing"
        actor: MillPlanner
        preconditions:
          - "ProductionRun.status == GREIGE"
          - "delamination_strength_lbf >= MIN_DELAMINATION_LBF"
        side_effects:
          - "persists sbr_pct, filler_load_pct, cure_temp_c, cure_seconds, secondary_backing_type"
          - "computes ProductionRun.delamination_strength_lbf via delamination_strength"
          - "sets ProductionRun.status = BACKED, making the run eligible for roll-good creation"
      - from: GREIGE
        to: BACKING_FAILED
        trigger: "POST /mill/production-runs/{production_run_id}/apply-backing"
        actor: MillPlanner
        preconditions:
          - "ProductionRun.status == GREIGE"
          - "delamination_strength_lbf < MIN_DELAMINATION_LBF"
        side_effects:
          - "persists the latex formulation inputs and the computed delamination_strength_lbf"
          - "sets ProductionRun.status = BACKING_FAILED"
      - from: BACKING_FAILED
        to: GREIGE
        trigger: "POST /mill/production-runs/{production_run_id}/recoat"
        actor: MillPlanner
        preconditions:
          - "ProductionRun.status == BACKING_FAILED"
          - "ProductionRun.recoat_count < RECOAT_LIMIT (else ERR_RECOAT_LIMIT_REACHED)"
        side_effects:
          - "increments ProductionRun.recoat_count by 1"
          - "clears sbr_pct, filler_load_pct, cure_temp_c, cure_seconds, secondary_backing_type and delamination_strength_lbf to null"
          - "sets ProductionRun.status = GREIGE"
        note: "GREIGE -> BACKING_FAILED -> GREIGE is the backing revision loop, bounded by RECOAT_LIMIT."
      - from: BACKED
        to: RELEASED
        trigger: "system — first RollGood of the run reaches qa_status == PASSED"
        actor: system
        preconditions:
          - "ProductionRun.status == BACKED"
          - "at least one RollGood with production_run_id == this run has qa_status == PASSED"
        side_effects:
          - "sets ProductionRun.status = RELEASED (terminal); further RollGood rows may still be created against a RELEASED run"

  - entity: DyeLot
    initial_state: FORMULATED
    terminal_states: [EXHAUSTED, REJECTED]
    transitions:
      - from: FORMULATED
        to: DYEING
        trigger: "POST /mill/dye-lots/{dye_lot_id}/start-dyeing"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status IN {FORMULATED, REDYE_QUEUED}"
          - "DyeVessel(vessel_id).status == AVAILABLE (else ERR_VESSEL_UNAVAILABLE)"
          - "logical clock >= DyeLot.dye_start_utc (else ERR_DYE_WINDOW_NOT_OPEN)"
        side_effects:
          - "sets DyeLot.status = DYEING"
      - from: REDYE_QUEUED
        to: DYEING
        trigger: "POST /mill/dye-lots/{dye_lot_id}/start-dyeing"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status IN {FORMULATED, REDYE_QUEUED}"
          - "DyeVessel(vessel_id).status == AVAILABLE"
          - "logical clock >= DyeLot.dye_start_utc"
        side_effects:
          - "increments DyeLot.redye_count by 1"
          - "clears measured_lab_l, measured_lab_a, measured_lab_b, delta_e and shade_band to null"
          - "sets DyeLot.status = DYEING"
        note: "the re-dye leg of the MEASURED -> REDYE_QUEUED -> DYEING -> MEASURED revision loop."
      - from: DYEING
        to: MEASURED
        trigger: "POST /mill/dye-lots/{dye_lot_id}/measurements"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status == DYEING"
          - "expected_dye_lot_version == DyeLot.version (else ERR_STALE_DYE_LOT_VERSION)"
        side_effects:
          - "persists measured_lab_l, measured_lab_a, measured_lab_b"
          - "computes DyeLot.delta_e via color_delta_e and DyeLot.shade_band via shade_band_assignment"
          - "sets DyeLot.status = MEASURED"
          - "increments DyeLot.version by 1"
      - from: MEASURED
        to: APPROVED
        trigger: "POST /mill/dye-lots/{dye_lot_id}/disposition with disposition = APPROVE"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status == MEASURED"
          - "DyeLot.shade_band IN {A, B, C} (else ERR_SHADE_BAND_NOT_APPROVABLE)"
        side_effects:
          - "sets DyeLot.status = APPROVED, permitting RollGood creation against this lot"
          - "recomputes uncommitted_yards and shipped_basis_uncommitted_yards via dye_lot_uncommitted_yards"
      - from: MEASURED
        to: REDYE_QUEUED
        trigger: "POST /mill/dye-lots/{dye_lot_id}/disposition with disposition = REDYE"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status == MEASURED"
          - "DyeLot.shade_band IN {C, OUT} (else ERR_SHADE_BAND_NOT_REDYEABLE)"
          - "DyeLot.redye_count < MAX_REDYE_COUNT (else ERR_REDYE_LIMIT_REACHED)"
        side_effects:
          - "sets DyeLot.status = REDYE_QUEUED"
          - "sets DyeLot.parent_dye_lot_id to DyeLot.id when it is still null, recording the head of the re-dye chain"
      - from: MEASURED
        to: REJECTED
        trigger: "POST /mill/dye-lots/{dye_lot_id}/disposition with disposition = REJECT"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status IN {MEASURED, APPROVED}"
        side_effects:
          - "sets DyeLot.status = REJECTED (terminal)"
          - "runs the dye-lot rejection cascade described on APPROVED -> REJECTED"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /mill/dye-lots/{dye_lot_id}/disposition with disposition = REJECT"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status IN {MEASURED, APPROVED}"
        side_effects:
          - "sets DyeLot.status = REJECTED (terminal)"
          - "cascade hop 1: every RollGood with dye_lot_id == this lot and inventory_status != SCRAPPED gets qa_status = FAILED, inventory_status = SCRAPPED and available_yards = 0; DyeLot.scrapped_yards increases by each roll's scrap_charge, where scrap_charge = roll.initial_yards - (yards already SHIPPED off that roll), so the physical yardage leaves the lot exactly once"
          - "cascade hop 2 (caused by hop 1): every CutAllocation whose roll_good_id is one of those newly SCRAPPED rolls and whose status == RESERVED transitions RESERVED -> VOIDED"
          - "cascade hop 3 (caused by hop 2): every CutOrder referenced by a VOIDED allocation recomputes allocated_yards; each such order with status == ALLOCATED and allocated_yards < requested_yards transitions ALLOCATED -> BACKORDERED"
          - "cascade hop 4 (caused by hop 3): every CarpetStyle referenced by a newly BACKORDERED order recomputes open_backorder_yards"
          - "cascade hop 5 (caused by hop 4): each such CarpetStyle whose open_backorder_yards >= STYLE_BACKORDER_ALERT_YARDS sets replenishment_flag = REPLENISH_REQUIRED"
          - "recomputes uncommitted_yards and shipped_basis_uncommitted_yards via dye_lot_uncommitted_yards"
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system — recomputation of dye_lot_uncommitted_yards after any allocation, cut, ship or scrap touching this lot"
        actor: system
        preconditions:
          - "DyeLot.status == APPROVED"
          - "uncommitted_yards <= 0 under the COMMITMENT_AWARE variant"
        side_effects:
          - "sets DyeLot.status = EXHAUSTED (terminal); the lot can no longer back a SINGLE_LOT allocation"

  - entity: RollGood
    initial_state: "qa_status = PENDING x inventory_status = IN_PROCESS"
    terminal_states: ["qa_status = FAILED", "inventory_status IN {DEPLETED, SCRAPPED}"]
    transitions:
      - from: "qa_status = PENDING"
        to: "qa_status = PASSED"
        trigger: "POST /mill/roll-goods/{roll_good_id}/qa-disposition with disposition = RELEASE"
        actor: QALabTechnician
        preconditions:
          - "RollGood.qa_status IN {PENDING, HELD}"
          - "ProductionRun(production_run_id).status IN {BACKED, RELEASED} (else ERR_RUN_NOT_BACKED)"
          - "when CarpetStyle.dye_method == PIECE_DYED: DyeLot(dye_lot_id).status == APPROVED (else ERR_DYE_LOT_NOT_APPROVED)"
        side_effects:
          - "sets RollGood.qa_status = PASSED"
          - "independent dimension: sets RollGood.inventory_status = AVAILABLE (IN_PROCESS -> AVAILABLE)"
          - "cascade: ProductionRun BACKED -> RELEASED when this is the run's first PASSED roll"
      - from: "qa_status = PENDING"
        to: "qa_status = HELD"
        trigger: "POST /mill/roll-goods/{roll_good_id}/qa-disposition with disposition = HOLD"
        actor: QALabTechnician
        preconditions:
          - "RollGood.qa_status == PENDING"
        side_effects:
          - "sets RollGood.qa_status = HELD; inventory_status is untouched and stays IN_PROCESS"
        note: "demonstrates the two dimensions are independent — a HELD roll never becomes AVAILABLE."
      - from: "qa_status = HELD"
        to: "qa_status = PASSED"
        trigger: "POST /mill/roll-goods/{roll_good_id}/qa-disposition with disposition = RELEASE"
        actor: QALabTechnician
        preconditions:
          - "RollGood.qa_status IN {PENDING, HELD}"
          - "the same run/dye-lot/shade preconditions as PENDING -> PASSED"
        side_effects:
          - "sets RollGood.qa_status = PASSED and inventory_status = AVAILABLE"
      - from: "qa_status IN {PENDING, HELD, PASSED}"
        to: "qa_status = FAILED"
        trigger: "POST /mill/roll-goods/{roll_good_id}/qa-disposition with disposition = SCRAP, or system cascade from DyeLot -> REJECTED"
        actor: QALabTechnician | system
        preconditions:
          - "RollGood.inventory_status != DEPLETED (else ERR_ROLL_ALREADY_DEPLETED)"
        side_effects:
          - "sets RollGood.qa_status = FAILED and inventory_status = SCRAPPED, and forces available_yards = 0"
          - "increases DyeLot.scrapped_yards by scrap_charge = roll.initial_yards - (yards already SHIPPED off that roll) when dye_lot_id is not null; available_yards alone would under-charge a roll whose yardage is merely RESERVED"
          - "cascade: every CutAllocation on this roll with status == RESERVED transitions RESERVED -> VOIDED"
      - from: "inventory_status = AVAILABLE"
        to: "inventory_status = COMMITTED"
        trigger: "system — recomputation of roll_good_yardage_ledger after an allocation drives available_yards to exactly 0"
        actor: system
        preconditions:
          - "RollGood.qa_status == PASSED"
          - "available_yards == 0 after the recomputation and at least one CutAllocation on the roll has status == RESERVED"
        side_effects:
          - "sets RollGood.inventory_status = COMMITTED; the roll is no longer a candidate for further allocation"
      - from: "inventory_status = COMMITTED"
        to: "inventory_status = AVAILABLE"
        trigger: "system — recomputation of roll_good_yardage_ledger after allocations on the roll are RELEASED or VOIDED"
        actor: system
        preconditions:
          - "RollGood.qa_status == PASSED"
          - "available_yards > 0 after the recomputation"
        side_effects:
          - "sets RollGood.inventory_status = AVAILABLE, returning the roll to the candidate pool"
        note: "the compensating leg of the AVAILABLE -> COMMITTED reservation, and the reason roll_good_yardage_conservation holds across cancel."
      - from: "inventory_status IN {AVAILABLE, COMMITTED}"
        to: "inventory_status = DEPLETED"
        trigger: "system — POST /mill/cut-orders/{cut_order_id}/cut consumes the roll's remaining yards"
        actor: system
        preconditions:
          - "every CutAllocation on the roll has status IN {CUT, SHIPPED, RELEASED, VOIDED}"
          - "available_yards == 0 after the cut, counting any residual split off as a remnant child roll"
        side_effects:
          - "sets RollGood.inventory_status = DEPLETED (terminal)"
          - "when the residual after cutting is > 0 and < REMNANT_THRESHOLD_YARDS, mints a child RollGood with parent_roll_id = this roll, initial_yards = residual, qa_status = PASSED, inventory_status = AVAILABLE and the parent's shade_band"

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [LAPSED, REVOKED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /mill/_clock/set_current_utc advancing the logical clock to >= expires_at_utc"
        actor: system
        preconditions:
          - "Certification.status == ACTIVE"
          - "new logical clock >= Certification.expires_at_utc"
        side_effects:
          - "sets Certification.status = LAPSED (terminal)"
          - "cascade: when no EFFECTIVE DOC_FF_1_70 certificate remains for the style, CarpetStyle ACTIVE -> SUSPENDED (which in turn holds the style's SCHEDULED runs)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mill/certifications/{certification_id}/revoke"
        actor: CertificationOfficer
        preconditions:
          - "Certification.status == ACTIVE"
        side_effects:
          - "sets Certification.status = REVOKED (terminal)"
          - "cascade: when no EFFECTIVE DOC_FF_1_70 certificate remains for the style, CarpetStyle ACTIVE -> SUSPENDED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — POST /mill/certifications issues a newer certificate of the same cert_type for the same style"
        actor: system
        preconditions:
          - "Certification.status == ACTIVE"
          - "a new Certification with the same style_id and cert_type is created"
        side_effects:
          - "sets the older Certification.status = SUPERSEDED (terminal)"

  - entity: CutOrder
    initial_state: SUBMITTED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "POST /mill/cut-orders/{cut_order_id}/allocate, or POST /mill/cut-orders/{cut_order_id}/allocations reaching full coverage"
        actor: MillPlanner
        preconditions:
          - "CutOrder.status IN {SUBMITTED, BACKORDERED}"
          - "CarpetStyle(style_id).status IN {ACTIVE, RUNOUT} (else ERR_STYLE_NOT_ORDERABLE)"
          - "a Certification with cert_type == DOC_FF_1_70, status == ACTIVE and expires_at_utc > logical clock exists for the style (else ERR_FLAMMABILITY_CERT_REQUIRED)"
          - "the roll_good_selector candidate set is non-empty (else ERR_NO_ELIGIBLE_ROLL_GOODS)"
          - "allocated_yards reaches requested_yards exactly"
        side_effects:
          - "creates CutAllocation rows in status RESERVED per roll_good_selector"
          - "recomputes each touched RollGood.available_yards via roll_good_yardage_ledger and flips AVAILABLE -> COMMITTED at exactly 0"
          - "recomputes CutOrder.allocated_yards, gross_cents, freight_cents, remnant_credit_cents and net_invoice_cents via cut_order_line_charges then cut_order_settlement"
          - "recomputes each touched DyeLot's uncommitted_yards; a lot reaching <= 0 transitions APPROVED -> EXHAUSTED"
          - "sets CutOrder.status = ALLOCATED"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "POST /mill/cut-orders/{cut_order_id}/allocate"
        actor: MillPlanner
        preconditions:
          - "identical to SUBMITTED -> ALLOCATED"
        side_effects:
          - "identical to SUBMITTED -> ALLOCATED, plus: recomputes CarpetStyle.open_backorder_yards and clears replenishment_flag to NONE when it falls below STYLE_BACKORDER_ALERT_YARDS"
        note: "closes the ALLOCATED -> BACKORDERED -> ALLOCATED allocation retry loop."
      - from: SUBMITTED
        to: BACKORDERED
        trigger: "POST /mill/cut-orders/{cut_order_id}/allocate with insufficient candidate yardage"
        actor: MillPlanner
        preconditions:
          - "CutOrder.status IN {SUBMITTED, BACKORDERED}"
          - "CutOrder.order_type == RUNNING_LINE (a CUSTOM order fails with ERR_INSUFFICIENT_YARDAGE instead)"
          - "the candidate set is non-empty but its total eligible yardage < requested_yards"
        side_effects:
          - "creates CutAllocation rows in status RESERVED for all candidate yardage available"
          - "sets CutOrder.status = BACKORDERED"
          - "recomputes CarpetStyle.open_backorder_yards and sets replenishment_flag = REPLENISH_REQUIRED at or above STYLE_BACKORDER_ALERT_YARDS"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "system — cascade from DyeLot -> REJECTED voiding this order's allocations"
        actor: system
        preconditions:
          - "CutOrder.status == ALLOCATED"
          - "allocated_yards < requested_yards after the VOID cascade"
        side_effects:
          - "sets CutOrder.status = BACKORDERED"
          - "recomputes allocated_yards, then gross_cents via cut_order_line_charges and freight_cents / remnant_credit_cents / net_invoice_cents via cut_order_settlement; with every line VOIDED the zero-line guard drives all four to 0"
          - "leaves CutOrder.reserved_credit_cents and Account.credit_used_cents untouched - the credit hold follows requested_yards, not allocated_yards"
          - "recomputes CarpetStyle.open_backorder_yards and replenishment_flag via style_backorder_posture"
      - from: ALLOCATED
        to: CUT
        trigger: "POST /mill/cut-orders/{cut_order_id}/cut"
        actor: MillPlanner
        preconditions:
          - "CutOrder.status == ALLOCATED"
          - "every CutAllocation of the order has status == RESERVED"
        side_effects:
          - "transitions every CutAllocation RESERVED -> CUT"
          - "for each sourced roll, mints a remnant child RollGood when the post-cut residual is > 0 and < REMNANT_THRESHOLD_YARDS, and drives the parent roll to inventory_status = DEPLETED"
          - "the remnant child copies production_run_id, dye_lot_id, width_ft and shade_band from its parent, sets parent_roll_id to the parent, is_remnant = true, qa_status = PASSED, inventory_status = AVAILABLE, initial_yards = available_yards = the residual, and roll_number = <parent roll_number>-R<n> with n counting from 1 per parent"
          - "a post-cut residual >= REMNANT_THRESHOLD_YARDS mints no child; the parent keeps that residual and stays AVAILABLE"
          - "sets CutOrder.status = CUT"
      - from: CUT
        to: SHIPPED
        trigger: "POST /mill/cut-orders/{cut_order_id}/ship"
        actor: MillPlanner
        preconditions:
          - "CutOrder.status == CUT"
        side_effects:
          - "transitions every CutAllocation CUT -> SHIPPED"
          - "drives account_credit_ledger: replaces the order's reserved_credit_cents hold with net_invoice_cents on Account.credit_used_cents"
          - "sets CutOrder.status = SHIPPED (terminal)"
          - "re-evaluates CarpetStyle RUNOUT -> DISCONTINUED"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /mill/cut-orders/{cut_order_id}/cancel, or system cascade from CarpetStyle -> RUNOUT for CUSTOM orders"
        actor: DealerBuyer | MillPlanner | system
        preconditions:
          - "CutOrder.status IN {SUBMITTED, ALLOCATED, BACKORDERED}"
          - "when the actor is DealerBuyer, X-User-ID == CutOrder.account_id (else ERR_ACCOUNT_SCOPE_VIOLATION)"
        side_effects:
          - "transitions every CutAllocation of the order RESERVED -> RELEASED"
          - "recomputes each affected RollGood.available_yards, flipping COMMITTED -> AVAILABLE where yardage returns — the compensating leg of roll_good_yardage_conservation"
          - "drives account_credit_ledger: decrements Account.credit_used_cents by reserved_credit_cents and zeroes the order's reserved_credit_cents — the compensating leg of account_credit_conservation"
          - "an Account in CREDIT_HOLD whose credit_used_cents falls below credit_limit_cents transitions CREDIT_HOLD -> ACTIVE"
          - "sets CutOrder.status = CANCELLED (terminal)"
          - "re-evaluates CarpetStyle RUNOUT -> DISCONTINUED"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /mill/cut-orders/{cut_order_id}/cancel"
        actor: DealerBuyer | MillPlanner
        preconditions:
          - "CutOrder.status IN {SUBMITTED, ALLOCATED, BACKORDERED}"
          - "when the actor is DealerBuyer, X-User-ID == CutOrder.account_id"
        side_effects:
          - "identical to SUBMITTED -> CANCELLED"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /mill/cut-orders/{cut_order_id}/cancel"
        actor: DealerBuyer | MillPlanner
        preconditions:
          - "CutOrder.status IN {SUBMITTED, ALLOCATED, BACKORDERED}"
          - "when the actor is DealerBuyer, X-User-ID == CutOrder.account_id"
        side_effects:
          - "identical to SUBMITTED -> CANCELLED, plus recomputation of CarpetStyle.open_backorder_yards and replenishment_flag"

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system — recomputation of account_credit_ledger after CutOrder create/ship, or after PATCH /mill/accounts/{account_id} lowers credit_limit_cents"
        actor: system
        preconditions:
          - "Account.status == ACTIVE"
          - "credit_used_cents >= credit_limit_cents after the recomputation"
        side_effects:
          - "sets Account.status = CREDIT_HOLD; no further CutOrder may be submitted for the account"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system — recomputation of account_credit_ledger after CutOrder cancel (including the CarpetStyle -> RUNOUT cascade), or after PATCH /mill/accounts/{account_id} raises credit_limit_cents"
        actor: system
        preconditions:
          - "Account.status == CREDIT_HOLD"
          - "credit_used_cents < credit_limit_cents after the recomputation"
        side_effects:
          - "sets Account.status = ACTIVE"
        note: "closes the ACTIVE <-> CREDIT_HOLD loop and is cascade hop 3 of the style-discontinuation chain."
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /mill/accounts/{account_id} with status = CLOSED"
        actor: MillPlanner
        preconditions:
          - "Account.status IN {ACTIVE, CREDIT_HOLD}"
          - "no CutOrder for the account has status IN {SUBMITTED, ALLOCATED, BACKORDERED, CUT} (else ERR_ACCOUNT_HAS_OPEN_ORDERS)"
        side_effects:
          - "sets Account.status = CLOSED (terminal)"
      - from: CREDIT_HOLD
        to: CLOSED
        trigger: "PATCH /mill/accounts/{account_id} with status = CLOSED"
        actor: MillPlanner
        preconditions:
          - "identical to ACTIVE -> CLOSED"
        side_effects:
          - "sets Account.status = CLOSED (terminal)"

concurrency_rules:
  - rule_id: manual-allocation-stale-roll
    parent_entity: RollGood
    write_endpoint: "POST /mill/cut-orders/{cut_order_id}/allocations"
    occ_field: "expected_roll_good_version"
    description: |
      Creating a manual CutAllocation against a RollGood whose version has advanced since the
      planner last read it is rejected. A manual allocation legitimately supersedes the planner's
      view of the roll's remaining yardage: another allocation (or a remnant split, or a
      qa-disposition) may have already drawn against the same roll while leaving enough yardage
      for this request to still succeed on its own merits, so the stale-version check is the only
      thing that distinguishes a fresh decision from one made against an outdated yardage figure.
    error_id: ERR_STALE_ROLL_GOOD_VERSION
    http_status: 412

  - rule_id: dye-measurement-stale-lot
    parent_entity: DyeLot
    write_endpoint: "POST /mill/dye-lots/{dye_lot_id}/measurements"
    occ_field: "expected_dye_lot_version"
    description: |
      Recording a spectrophotometer reading against a DyeLot whose version has advanced since the
      operator last read it is rejected. Re-measurement of a lot in DYEING is legitimate on its own
      terms — a second reading supersedes the first and overwrites delta_e and shade_band — so a
      reading submitted against an outdated version would silently overwrite a colleague's newer
      reading and re-band the lot. The stale-version check turns that into a deterministic 412.
    error_id: ERR_STALE_DYE_LOT_VERSION
    http_status: 412

calculations:
  - name: reclamation_yield
    trigger: "POST /mill/reclamation-batches/{reclamation_batch_id}/depolymerize (ReclamationBatch RECEIVED -> DEPOLYMERIZED)"
    algorithm: aggregation
    formula: |
      depolymerized_kg = round_half_up(
          intake_lbs
          * LB_TO_KG
          * FACE_FIBER_FRACTION[face_fiber_type]
          * DEPOLYMERIZATION_YIELD,
          3)
      # the minted PolymerLot takes received_kg = depolymerized_kg, recycled_content_pct = 100.00,
      # segregated = true, reclaim_source = POST_CONSUMER.
    input_set: "the single ReclamationBatch being depolymerized; contamination_pct is a gate (<= MAX_RECLAIM_CONTAMINATION_PCT), not a multiplier"
    constants:
      LB_TO_KG: 0.45359237
      DEPOLYMERIZATION_YIELD: 0.82
      MAX_RECLAIM_CONTAMINATION_PCT: 12.0
      FACE_FIBER_FRACTION: { NYLON_66: 0.42, NYLON_6: 0.40, PET: 0.38, POLYPROPYLENE: 0.35 }
    precision: "3 decimal places, round_half_up; multiply in the written order, round only once at the end"

  - name: polymer_mass_conservation
    trigger: "every FiberBatch create, extrude and disposition; asserted as an invariant on PolymerLot after each"
    algorithm: aggregation
    formula: |
      # ledger identity that MUST hold for every PolymerLot at all times
      received_kg == available_kg + reserved_kg + consumed_kg + scrapped_kg

      # movements, in the order the owning transition applies them
      POST /mill/fiber-batches            : available_kg -= draw ; reserved_kg += draw
      POST .../extrude                    : reserved_kg  -= draw ; consumed_kg += draw
      disposition SCRAP from QUEUED       : reserved_kg  -= draw ; available_kg += draw   # compensating leg
      disposition SCRAP from SPUN         : consumed_kg  -= draw ; scrapped_kg  += draw
      # draw = FiberBatch.input_kg for polymer_lot_id, FiberBatch.blend_input_kg for blend_polymer_lot_id
      status = DEPLETED when available_kg == 0 else AVAILABLE
    input_set: "all FiberBatch rows referencing the lot through polymer_lot_id or blend_polymer_lot_id, in any status"
    constants: {}
    precision: "3 decimal places on every bucket, round_half_up; no bucket may go negative"

  - name: denier_actual_from_throughput
    trigger: "POST /mill/fiber-batches/{fiber_batch_id}/extrude (FiberBatch QUEUED -> SPUN)"
    algorithm: aggregation
    formula: |
      denier_actual = round_half_up(
          throughput_g_per_min * 9000.0 / (spin_speed_m_per_min * filament_count),
          1)
      # release gate, evaluated on the ROUNDED denier_actual:
      in_tolerance = abs(denier_actual - denier_target) / denier_target <= DENIER_TOLERANCE_FRACTION
    input_set: "the single FiberBatch being extruded; filament_count comes from creation, throughput and speed from the extrude payload"
    constants:
      DENIER_TOLERANCE_FRACTION: 0.03
      MIN_MELT_FLOW_INDEX: 12.0
      SPIN_YIELD: 0.965
    precision: "1 decimal place, round_half_up; the tolerance comparison uses the rounded value, never the raw quotient"

  - name: face_weight_per_square_yard
    trigger: "POST /mill/production-runs/{production_run_id}/complete-greige (ProductionRun TUFTING -> GREIGE)"
    algorithm: aggregation
    formula: |
      # 6 inputs with a lookup, a conditional branch and a product chain — evaluate in this order
      npi          = GAUGE_NEEDLES_PER_INCH[CarpetStyle.gauge_code]
      tufts_per_sy = npi * ProductionRun.stitch_rate_per_inch * SQ_IN_PER_SQ_YD
      allowance_in = CUT_PILE_ALLOWANCE_IN if CarpetStyle.pile_construction == CUT
                     else LOOP_PILE_ALLOWANCE_IN
      yarn_in_per_tuft = 2.0 * (ProductionRun.pile_height_set_mm / MM_PER_INCH) + allowance_in
      yarn_yd_per_sy   = tufts_per_sy * yarn_in_per_tuft / 36.0
      grams_per_sy     = yarn_yd_per_sy
                         * FiberBatch.denier_actual
                         * CarpetStyle.plies
                         * GRAMS_PER_YARD_PER_DENIER
      face_weight_oz_per_sy = round_half_up(grams_per_sy / GRAMS_PER_OZ, 2)

      # tolerance gate, evaluated on the ROUNDED face weight:
      in_tolerance = abs(face_weight_oz_per_sy - CarpetStyle.target_face_weight_oz)
                     <= FACE_WEIGHT_TOLERANCE_OZ
    input_set: "the run's own setup values (stitch_rate_per_inch, pile_height_set_mm), its CarpetStyle (gauge_code, pile_construction, plies, target_face_weight_oz) and its FiberBatch (denier_actual). greige_yards does NOT enter the formula — face weight is per square yard."
    constants:
      GAUGE_NEEDLES_PER_INCH: { G_1_8: 8.0, G_1_10: 10.0, G_5_64: 12.8 }
      SQ_IN_PER_SQ_YD: 1296
      MM_PER_INCH: 25.4
      CUT_PILE_ALLOWANCE_IN: 0.0600
      LOOP_PILE_ALLOWANCE_IN: 0.1200
      GRAMS_PER_YARD_PER_DENIER: 0.00010160
      GRAMS_PER_OZ: 28.349523
      FACE_WEIGHT_TOLERANCE_OZ: 1.60
      PILE_HEIGHT_SPEC_TOLERANCE_MM: 0.5
    precision: "carry full float precision through the chain; round_half_up to 2 decimals exactly once, at face_weight_oz_per_sy. Rounding any intermediate (tufts, yarn yards, grams) is forbidden."

  - name: delamination_strength
    trigger: "POST /mill/production-runs/{production_run_id}/apply-backing (ProductionRun GREIGE -> BACKED | BACKING_FAILED)"
    algorithm: threshold
    formula: |
      base_lbf   = SBR_COEFF_PER_PCT * sbr_pct - FILLER_PENALTY_PER_PCT * filler_load_pct
      cure_index = min(1.00, cure_seconds / REFERENCE_CURE_SECONDS)
      temp_factor = 1.00 if cure_temp_c >= 150
                    else 0.88 if cure_temp_c >= 135
                    else 0.70
      delamination_strength_lbf = round_half_up(
          base_lbf * cure_index * temp_factor
          * SECONDARY_BACKING_FACTOR[secondary_backing_type], 2)

      verdict = BACKED if delamination_strength_lbf >= MIN_DELAMINATION_LBF else BACKING_FAILED
    input_set: "the apply-backing payload only (sbr_pct, filler_load_pct, cure_temp_c, cure_seconds, secondary_backing_type); no cross-entity inputs"
    constants:
      SBR_COEFF_PER_PCT: 0.0500
      FILLER_PENALTY_PER_PCT: 0.0200
      REFERENCE_CURE_SECONDS: 120.0
      SECONDARY_BACKING_FACTOR: { ACTION_BAC: 1.00, WOVEN_POLYPROPYLENE: 0.95, CUSHION: 1.10 }
      MIN_DELAMINATION_LBF: 2.50
      RECOAT_LIMIT: 1
    precision: "2 decimal places, round_half_up, applied once to the final product; the >= comparison against MIN_DELAMINATION_LBF uses the rounded value"

  - name: color_delta_e
    trigger: "POST /mill/dye-lots/{dye_lot_id}/measurements (DyeLot DYEING -> MEASURED)"
    algorithm: aggregation
    formula: |
      delta_e = round_half_up(
          sqrt( (measured_lab_l - target_lab_l)^2
              + (measured_lab_a - target_lab_a)^2
              + (measured_lab_b - target_lab_b)^2 ),
          2)                                   # CIE76 (dE*ab), unweighted
    input_set: "the single DyeLot's stored target_lab_* triple and the measured_lab_* triple from the measurements payload"
    constants: {}
    precision: "2 decimal places, round_half_up, applied once after the square root"

  - name: shade_band_assignment
    trigger: "POST /mill/dye-lots/{dye_lot_id}/measurements, immediately after color_delta_e"
    algorithm: threshold
    formula: |
      # evaluated on the ROUNDED delta_e, first matching branch wins
      shade_band = A   if delta_e <= SHADE_BAND_A_MAX
                 = B   if delta_e <= SHADE_BAND_B_MAX
                 = C   if delta_e <= SHADE_BAND_C_MAX
                 = OUT otherwise
      # disposition gates keyed on the band:
      #   APPROVE allowed iff shade_band IN {A, B, C}
      #   REDYE   allowed iff shade_band IN {C, OUT} and redye_count < MAX_REDYE_COUNT
      #   REJECT  always allowed from MEASURED or APPROVED
    input_set: "the DyeLot's delta_e as rounded by color_delta_e; the raw square root is never re-used here"
    constants:
      SHADE_BAND_A_MAX: 0.80
      SHADE_BAND_B_MAX: 1.50
      SHADE_BAND_C_MAX: 2.50
      MAX_REDYE_COUNT: 2
    precision: "all three comparisons are inclusive (<=); delta_e exactly 0.80 is band A, exactly 1.50 is band B, exactly 2.50 is band C"

  - name: product_test_verdict
    trigger: "POST /mill/product-tests (ProductTest creation)"
    algorithm: threshold
    formula: |
      # the comparison DIRECTION depends on test_type — higher is better for two of the three
      verdict = PASS if (test_type == WEAR_TARR         and result_value >= WEAR_TARR_MIN)
                     or (test_type == STAIN_AATCC175    and result_value >= STAIN_AATCC175_MIN)
                     or (test_type == FLAMMABILITY_PILL and result_value <= FLAMMABILITY_CHAR_MAX_MM)
                else FAIL
    input_set: "the single ProductTest payload; the roll's shade band and the style's status do not affect the verdict"
    constants:
      WEAR_TARR_MIN: 3.0
      STAIN_AATCC175_MIN: 8.0
      FLAMMABILITY_CHAR_MAX_MM: 25.4
    precision: "1 decimal place on result_value as supplied; all three comparisons are inclusive"

  - name: dye_lot_uncommitted_yards
    trigger: "every allocation, cut, ship, cancel or roll-good scrap touching a RollGood whose dye_lot_id is set; also on DyeLot MEASURED -> APPROVED"
    algorithm: forward_looking
    formula: |
      committed_yards(statuses) = sum(CutAllocation.yards)
        over CutAllocation rows whose status IN statuses
        and whose roll_good_id references a RollGood with dye_lot_id == this DyeLot.id
        (RollGood rows in inventory_status == SCRAPPED are excluded from the sum, because their
         yardage has already been charged to DyeLot.scrapped_yards)

      base_yards = dyed_yards - scrapped_yards

      uncommitted_yards               = round_half_up(base_yards - committed_yards({RESERVED, CUT, SHIPPED}), 1)
      shipped_basis_uncommitted_yards = round_half_up(base_yards - committed_yards({SHIPPED}), 1)

      # exhaustion is decided by the COMMITMENT_AWARE variant only
      status = EXHAUSTED when DyeLot.status == APPROVED and uncommitted_yards <= 0
    input_set: "CutAllocation rows reachable from the lot through RollGood.dye_lot_id, filtered by the variant's status set; the lot's own dyed_yards and scrapped_yards"
    constants: {}
    precision: "1 decimal place, round_half_up; both variants are persisted side by side so the divergence is directly observable"
    variants:
      - name: COMMITMENT_AWARE
        when: "the authoritative variant — used by roll_good_selector eligibility, by the SINGLE_LOT shade rule, and by the APPROVED -> EXHAUSTED transition; surfaced as DyeLot.uncommitted_yards"
        difference: "subtracts allocations in RESERVED, CUT and SHIPPED, so a merely reserved commitment already removes the yardage from the sellable pool"
      - name: SHIPPED_ONLY
        when: "the settlement view used for dye-lot exhaustion reporting; surfaced as DyeLot.shipped_basis_uncommitted_yards"
        difference: "subtracts only allocations in SHIPPED, so reserved and cut-but-unshipped yardage still counts as sellable — for identical data this is strictly >= the COMMITMENT_AWARE figure, and the gap equals the RESERVED+CUT yardage"

  - name: style_recycled_content_pct
    trigger: "POST /mill/certifications when cert_type == NSF_140; also exposed by GET /mill/styles/{style_id}/recycled-content"
    algorithm: weighted_scoring
    formula: |
      # qualifying mass set Q: for every ProductionRun with style_id == this style and
      # status IN {GREIGE, BACKED, RELEASED}, take its FiberBatch (deduplicated by FiberBatch.id) and
      # emit two contributions:
      #     (PolymerLot(polymer_lot_id),        FiberBatch.input_kg)
      #     (PolymerLot(blend_polymer_lot_id),  FiberBatch.blend_input_kg)   # only when the FK is set
      total_kg = sum(kg for (lot, kg) in Q)

      MASS_BALANCE:
        recycled_kg = sum(kg * lot.recycled_content_pct / 100.0 for (lot, kg) in Q)

      PHYSICAL_SEGREGATION:
        recycled_kg = sum(kg for (lot, kg) in Q
                          if lot.segregated == true and lot.recycled_content_pct == 100.00)

      recycled_content_pct = round_half_up(recycled_kg * 100.0 / total_kg, 2)   # 0.00 when total_kg == 0

      # certification gate
      nsf_140_eligible = recycled_content_pct >= NSF_140_MIN_RECYCLED_PCT
    input_set: "PolymerLot rows reachable from the style's runs in status GREIGE, BACKED or RELEASED through FiberBatch; runs in SCHEDULED, HELD, TUFTING or ABORTED contribute nothing"
    constants:
      NSF_140_MIN_RECYCLED_PCT: 25.00
    precision: "2 decimal places, round_half_up, applied once to the final percentage; the gate comparison uses the rounded percentage"
    variants:
      - name: MASS_BALANCE
        when: "Certification.accounting_basis == MASS_BALANCE — the chain-of-custody model that lets a blended lot contribute its declared recycled fraction"
        difference: "credits kg * lot.recycled_content_pct / 100 for every lot, so a 2000 kg lot declared at 60.00 pct recycled contributes 1200 kg of recycled mass"
      - name: PHYSICAL_SEGREGATION
        when: "Certification.accounting_basis == PHYSICAL_SEGREGATION — the stricter model that only credits physically segregated 100 pct reclaim"
        difference: "credits a lot's full kg only when segregated == true AND recycled_content_pct == 100.00, so the same 2000 kg blended lot contributes 0 kg — identical inputs, materially different percentage, and the NSF_140 gate can pass under one basis and fail under the other"

  - name: style_backorder_posture
    trigger: "every CutOrder create, allocate, cut, ship and cancel, and the DyeLot rejection cascade (hops 4 and 5)"
    algorithm: threshold
    formula: |
      open_backorder_yards = round_half_up(
          sum(CutOrder.requested_yards - CutOrder.allocated_yards
              for orders of this style with status IN {SUBMITTED, BACKORDERED}), 1)

      replenishment_flag = REPLENISH_REQUIRED if open_backorder_yards >= STYLE_BACKORDER_ALERT_YARDS
                           else NONE
    input_set: "every CutOrder of the style in status SUBMITTED or BACKORDERED; ALLOCATED, CUT, SHIPPED and CANCELLED orders contribute nothing"
    constants:
      STYLE_BACKORDER_ALERT_YARDS: 250
    precision: "1 decimal place on open_backorder_yards, round_half_up; the flag comparison is >= so exactly 250 yards raises REPLENISH_REQUIRED"

  - name: roll_good_yardage_ledger
    trigger: "every CutAllocation create, cut, ship, release or void; every roll-good scrap; every remnant split"
    algorithm: aggregation
    formula: |
      committed = sum(CutAllocation.yards)
                  over allocations on this roll with status IN {RESERVED, CUT, SHIPPED}
      available_yards = 0.0 if inventory_status == SCRAPPED
                        else round_half_up(initial_yards - committed, 1)

      # inventory dimension, recomputed after every change:
      inventory_status = SCRAPPED   (sticky, set only by scrap/cascade)
                       | DEPLETED   (sticky, set only by the cut that zeroes the roll)
                       | COMMITTED  when qa_status == PASSED and available_yards == 0
                                    and at least one allocation is RESERVED
                       | AVAILABLE  when qa_status == PASSED and available_yards > 0
                       | IN_PROCESS when qa_status IN {PENDING, HELD}
    input_set: "all CutAllocation rows on the roll; RELEASED and VOIDED allocations are excluded, which is exactly why cancellation returns yardage"
    constants:
      REMNANT_THRESHOLD_YARDS: 30.0
    precision: "1 decimal place, round_half_up; available_yards is clamped at 0 and may never be negative"

  - name: roll_good_yardage_conservation
    trigger: "asserted after every allocate / cut / cancel / scrap on any RollGood"
    algorithm: aggregation
    formula: |
      # named conserved quantity: LINEAR YARDS of a production run's goods
      run_yardage(run) =
            sum(RollGood.available_yards      for rolls of the run with inventory_status != SCRAPPED)
          + sum(CutAllocation.yards           for allocations on those rolls with status IN {RESERVED, CUT, SHIPPED})
          + sum(RollGood.initial_yards        for rolls of the run with inventory_status == SCRAPPED)

      INVARIANT: run_yardage(run) == sum(RollGood.initial_yards for every non-remnant roll of the run)
                                     + sum(RollGood.initial_yards for every remnant roll of the run)
                                     - sum(parent residual transferred into each remnant roll)
      # Because a remnant split moves residual yardage from parent to child one-for-one, the
      # right-hand side reduces to sum(initial_yards of non-remnant rolls). Allocating debits
      # available_yards and credits CutAllocation.yards by the same figure; cancelling RELEASES the
      # allocation and credits available_yards back by exactly that figure. Forward action
      # (POST /cut-orders/{id}/allocate) paired with its compensating action
      # (POST /cut-orders/{id}/cancel) MUST leave run_yardage(run) bit-identical.
    input_set: "every RollGood of the run (including remnant children) and every CutAllocation on those rolls"
    constants: {}
    precision: "1 decimal place, round_half_up; the invariant is an exact equality on the rounded figures"

  - name: cut_order_credit_reservation
    trigger: "POST /mill/cut-orders (CutOrder creation)"
    algorithm: aggregation
    formula: |
      reserved_credit_cents = round_half_up(
          requested_yards * CarpetStyle.list_price_cents_per_yard, 0)
      # admission gate, evaluated BEFORE the reservation is written:
      admissible = Account.credit_used_cents + reserved_credit_cents <= Account.credit_limit_cents
    input_set: "the new order's requested_yards, its style's list price and the buying account's current credit_used_cents"
    constants: {}
    precision: "integer cents, round_half_up; the gate is inclusive, so landing exactly on credit_limit_cents is admissible"

  - name: account_credit_ledger
    trigger: "CutOrder create, ship and cancel (including the CarpetStyle -> RUNOUT cancellation cascade)"
    algorithm: aggregation
    formula: |
      credit_used_cents =
            sum(CutOrder.reserved_credit_cents for orders of the account with status IN {SUBMITTED, ALLOCATED, BACKORDERED, CUT})
          + sum(CutOrder.net_invoice_cents     for orders of the account with status == SHIPPED)
      # CANCELLED orders contribute nothing and carry reserved_credit_cents == 0 after cancellation.
      status = CREDIT_HOLD when credit_used_cents >= credit_limit_cents else ACTIVE   # unless CLOSED
    input_set: "every CutOrder of the account, filtered by the status sets above; CANCELLED orders excluded"
    constants: {}
    precision: "integer cents; the CREDIT_HOLD comparison is >= so landing exactly on the limit holds the account"

  - name: account_credit_conservation
    trigger: "asserted after every CutOrder create / ship / cancel"
    algorithm: aggregation
    formula: |
      # named conserved quantity: CENTS OF CREDIT EXPOSURE on an Account
      exposure(account) = Account.credit_used_cents
                        - sum(CutOrder.reserved_credit_cents for orders with status IN {SUBMITTED, ALLOCATED, BACKORDERED, CUT})
                        - sum(CutOrder.net_invoice_cents     for orders with status == SHIPPED)

      INVARIANT: exposure(account) == 0 at all times.
      # Forward action POST /mill/cut-orders debits credit (used += reserved) and the compensating
      # action POST /mill/cut-orders/{id}/cancel credits it back (used -= reserved, reserved := 0),
      # so a create/cancel pair MUST return credit_used_cents to its pre-create value and MUST
      # return Account.status to its pre-create value. This is a monetary quantity, structurally
      # unlike roll_good_yardage_conservation's linear-yard quantity.
    input_set: "every CutOrder of the account in any status"
    constants: {}
    precision: "integer cents; exact equality"

  - name: cut_order_line_charges
    trigger: "POST /mill/cut-orders/{cut_order_id}/allocate and POST /mill/cut-orders/{cut_order_id}/allocations"
    algorithm: tiered_pricing
    formula: |
      # PER-LINE ROUNDING, THEN SUM — this order is pinned and is observable
      for each CutAllocation of the order, processed in created_at ASC order:
          band_factor = SHADE_BAND_PRICE_FACTOR[allocation.shade_band]
          raw = allocation.yards
                * CarpetStyle.list_price_cents_per_yard
                * band_factor
                * (1.00 - REMNANT_LINE_DISCOUNT_PCT if allocation.from_remnant else 1.00)
          allocation.line_cents = round_half_up(raw, 0)

      gross_cents = sum(allocation.line_cents for allocations with status IN {RESERVED, CUT, SHIPPED})

      # FORBIDDEN alternative that yields different cents:
      #   gross_cents = round_half_up(sum(raw), 0)
      # e.g. lines 12.5 yd band A, 7.5 yd band B, 3.5 yd band C remnant at 4275 cents/yd give
      # 53438 + 31101 + 11446 = 95985 under the pinned order, but 95984 under sum-then-round.
    input_set: "the order's CutAllocation rows with status IN {RESERVED, CUT, SHIPPED}, ordered by created_at ASC; RELEASED and VOIDED lines are excluded and their line_cents are frozen at their last computed value"
    constants:
      SHADE_BAND_PRICE_FACTOR: { A: 1.00, B: 0.97, C: 0.90, OUT: 0.00, SOLUTION: 1.00 }
      REMNANT_LINE_DISCOUNT_PCT: 0.15
    precision: "integer cents per line, round_half_up, applied once per line BEFORE summation; the sum itself is exact integer arithmetic"

  - name: cut_order_settlement
    trigger: "immediately after cut_order_line_charges on every allocate / allocations / cancel that changes the order's lines"
    algorithm: waterfall_allocation
    formula: |
      # The freight tier LOOKS circular — freight is part of what a buyer owes, and the remnant
      # credit reduces what a buyer owes — so evaluation order is pinned explicitly:
      #   step 1: gross_cents            (from cut_order_line_charges)
      #   step 2: freight_cents          keyed on gross_cents          <-- NOT on net_invoice_cents
      #   step 3: remnant_credit_cents   keyed on gross_cents          <-- NOT on gross + freight
      #   step 4: net_invoice_cents      = gross_cents + freight_cents - remnant_credit_cents
      freight_cents = 0     if gross_cents >= FREIGHT_ALLOWED_MIN_CENTS
                      4500  if gross_cents >= FREIGHT_MID_MIN_CENTS
                      8900  otherwise

      remnant_credit_cents = round_half_up(gross_cents * REMNANT_ORDER_CREDIT_PCT, 0)
                             if any allocation of the order with status IN {RESERVED, CUT, SHIPPED}
                                has from_remnant == true
                             else 0

      net_invoice_cents = gross_cents + freight_cents - remnant_credit_cents

      # zero-line guard: when gross_cents == 0 because no RESERVED/CUT/SHIPPED line remains
      # (every line RELEASED or VOIDED), all three of freight_cents, remnant_credit_cents and
      # net_invoice_cents are 0 - the freight tier is never applied to a line-less order.

      # Worked divergence: gross_cents = 100591 with one remnant line gives
      #   freight_cents = 0, remnant_credit_cents = 3018, net_invoice_cents = 97573.
      # Keying freight on net_invoice_cents instead would yield freight 4500 and net 102073.
    input_set: "the order's gross_cents from cut_order_line_charges and the from_remnant flags of its RESERVED/CUT/SHIPPED allocations"
    constants:
      FREIGHT_ALLOWED_MIN_CENTS: 100000
      FREIGHT_MID_MIN_CENTS: 50000
      REMNANT_ORDER_CREDIT_PCT: 0.03
    precision: "integer cents; both tier comparisons are >= so gross_cents exactly 100000 ships freight-free and exactly 50000 pays 4500"

  - name: roll_good_selector
    trigger: "POST /mill/cut-orders/{cut_order_id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      # (a) ELIGIBILITY FILTER — the candidate set, as an explicit predicate
      candidates = RollGood rows where
            ProductionRun(roll.production_run_id).style_id == CutOrder.style_id
        and roll.qa_status == PASSED
        and roll.inventory_status == AVAILABLE
        and roll.available_yards > 0
        and roll.shade_band != OUT
        and (roll.dye_lot_id is null
             or DyeLot(roll.dye_lot_id).status IN {APPROVED, EXHAUSTED})
        and shade_ok(roll)

      shade_ok(roll) =
            true                                                    if shade_tolerance == ANY
            roll.shade_band == chosen_band                           if shade_tolerance == BAND_MATCH
            roll.dye_lot_id == chosen_lot_id                         if shade_tolerance == SINGLE_LOT

      chosen_lot_id  = the DyeLot among the pre-shade candidate rolls with the greatest
                       uncommitted_yards (COMMITMENT_AWARE variant); tie-break DyeLot.created_at ASC
      chosen_band    = the shade_band among the pre-shade candidate rolls with the greatest total
                       available_yards; tie-break band ordinal A < B < C

      # (b) RANKING EXPRESSION — remnants are burned down first, then the smallest roll
      order candidates by:
            1. roll.is_remnant DESC        (true before false)
            2. roll.available_yards ASC
            3. roll.created_at ASC         (tie-break; RollGood.id is never consulted)

      # (c) WATERFALL — draw from each candidate in rank order
      remaining = CutOrder.requested_yards
      for roll in ranked_candidates while remaining > 0:
            take = round_half_up(min(remaining, roll.available_yards), 1)
            create CutAllocation(cut_order_id, roll.id, yards = take,
                                 shade_band = roll.shade_band, from_remnant = roll.is_remnant,
                                 status = RESERVED)
            remaining -= take

      # (d) FALLBACK when the waterfall cannot close
      candidates empty                       -> ERR_NO_ELIGIBLE_ROLL_GOODS (409), nothing created
      remaining > 0 and order_type == CUSTOM  -> ERR_INSUFFICIENT_YARDAGE (422), nothing created
      remaining > 0 and order_type == RUNNING_LINE
                                             -> keep the partial allocations, order -> BACKORDERED
    input_set: "RollGood rows of the order's style only; rolls whose inventory_status is IN_PROCESS, COMMITTED, DEPLETED or SCRAPPED, or whose qa_status is not PASSED, are never candidates"
    constants: {}
    precision: "1 decimal place on every take, round_half_up; the ranking never consults RollGood.id or any random value"

  - name: machine_window_overlap
    trigger: "POST /mill/production-runs (creation)"
    algorithm: interval_merge
    formula: |
      # EXCLUSIVE OCCUPANCY WITH A LEADING CHANGEOVER BUFFER, HALF-OPEN AT THE END
      occupied(run) = [ run.scheduled_start_utc - TuftingMachine.changeover_minutes ,
                        run.scheduled_end_utc )            # start inclusive, end EXCLUSIVE

      conflict = any existing ProductionRun r on the same machine_id with
                 r.status IN {SCHEDULED, HELD, TUFTING, GREIGE, BACKED, BACKING_FAILED}
                 and occupied(new) intersects occupied(r)
      # -> ERR_MACHINE_WINDOW_CONFLICT (409)

      # Boundary: a new run whose scheduled_start_utc is exactly
      # r.scheduled_end_utc + changeover_minutes has effective start == r.scheduled_end_utc, which
      # is EXCLUDED from r's half-open window -> admissible. One minute earlier -> rejected.
    input_set: "ProductionRun rows on the same machine_id whose status is not ABORTED and not RELEASED; ABORTED and RELEASED runs free their window"
    constants: {}
    precision: "minute resolution on ISO 8601 UTC instants; the buffer is applied to the NEW run and to every existing run alike"

  - name: vessel_capacity_overlap
    trigger: "POST /mill/dye-lots (creation)"
    algorithm: interval_merge
    formula: |
      # AGGREGATE CAPACITY OVER CLOSED INTERVALS — several lots may share a vessel window as long
      # as the mass loaded at every instant fits. Touching endpoints DO overlap.
      occupied(lot) = [ lot.dye_start_utc , lot.dye_end_utc ]      # BOTH ends INCLUSIVE

      probe_instants = { new.dye_start_utc }
                     union { r.dye_start_utc for existing r if r.dye_start_utc in occupied(new) }
                     union { r.dye_end_utc   for existing r if r.dye_end_utc   in occupied(new) }

      for t in probe_instants:
          load(t) = new.lot_kg
                  + sum(r.lot_kg for existing r on the same vessel_id
                        with r.status IN {FORMULATED, DYEING}
                        and t in occupied(r))
          if load(t) > DyeVessel.capacity_kg -> ERR_VESSEL_CAPACITY_EXCEEDED (409)

      # Boundary: load(t) exactly equal to capacity_kg is admissible (<=). A lot whose
      # dye_start_utc equals another lot's dye_end_utc DOES contend, because both ends are closed —
      # the opposite adjacency rule from machine_window_overlap.
    input_set: "DyeLot rows on the same vessel_id with status IN {FORMULATED, DYEING}; MEASURED, APPROVED, REDYE_QUEUED, EXHAUSTED and REJECTED lots have left the vessel and never contend"
    constants: {}
    precision: "minute resolution on ISO 8601 UTC instants; lot_kg summed at 1 decimal place, compared with <="

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when X-User-Role == DealerBuyer, X-User-ID equals the Account.id targeted by the request — CutOrder.account_id for cut-order paths, the path account_id for GET /mill/accounts/{account_id}"
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /mill/accounts/{account_id}, POST /mill/cut-orders, GET /mill/cut-orders/{cut_order_id}, POST /mill/cut-orders/{cut_order_id}/cancel"

  - priority: 4
    category: business_constraint
    check: "request body/query shape is valid — every required field present, every enum value in its declared set, every numeric within its declared range, datetimes ISO 8601 UTC, pagination limit in [1,100] and offset >= 0, scheduled_end_utc > scheduled_start_utc, dye_end_utc > dye_start_utc, blend_input_kg > 0 exactly when blend_polymer_lot_id is present, accounting_basis in {MASS_BALANCE, PHYSICAL_SEGREGATION} exactly when cert_type == NSF_140. The solution_color_code presence rule is NOT checked here — it belongs to priority 16 so that ERR_DYE_METHOD_COLOR_MISMATCH stays reachable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_POLYMER_LOT_NOT_FOUND | ERR_RECLAMATION_BATCH_NOT_FOUND | ERR_FIBER_BATCH_NOT_FOUND | ERR_STYLE_NOT_FOUND | ERR_MACHINE_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_PRODUCTION_RUN_NOT_FOUND | ERR_DYE_LOT_NOT_FOUND | ERR_ROLL_GOOD_NOT_FOUND | ERR_PRODUCT_TEST_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_CUT_ORDER_NOT_FOUND | ERR_CUT_ALLOCATION_NOT_FOUND"
    http_status: 404
    applies_to: "all paths with an id segment"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body references an existing row (account_id, style_id, machine_id, fiber_batch_id, polymer_lot_id, blend_polymer_lot_id, production_run_id, vessel_id, dye_lot_id, roll_good_id, source_roll_good_id, every element of source_test_ids)"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_STYLE_NOT_FOUND | ERR_MACHINE_NOT_FOUND | ERR_FIBER_BATCH_NOT_FOUND | ERR_POLYMER_LOT_NOT_FOUND | ERR_PRODUCTION_RUN_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_DYE_LOT_NOT_FOUND | ERR_ROLL_GOOD_NOT_FOUND | ERR_PRODUCT_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys in the body"

  - priority: 7
    category: business_constraint
    check: "the supplied natural key is unique — account_code, lot_code (PolymerLot), batch_code (ReclamationBatch and FiberBatch), style_code, machine_code, vessel_code, run_code, lot_code (DyeLot), roll_number, order_code"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "all creation endpoints"

  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2 (FiberBatch, ProductionRun, DyeLot, RollGood, Certification, CutOrder, CarpetStyle, ReclamationBatch)"
    error_id: "ERR_INVALID_STATE | ERR_FIBER_BATCH_NOT_RELEASED | ERR_RUN_NOT_BACKED | ERR_DYE_LOT_NOT_APPROVED | ERR_ROLL_ALREADY_DEPLETED | ERR_STYLE_NOT_ACTIVE | ERR_STYLE_NOT_ORDERABLE | ERR_MACHINE_UNAVAILABLE | ERR_VESSEL_UNAVAILABLE | ERR_REDYE_LIMIT_REACHED | ERR_RECOAT_LIMIT_REACHED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "the buying Account is in status ACTIVE — a CREDIT_HOLD or CLOSED account may not submit a new CutOrder"
    error_id: "ERR_ACCOUNT_CREDIT_HOLD | ERR_ACCOUNT_CLOSED"
    http_status: 409
    applies_to: "POST /mill/cut-orders"

  - priority: 10
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (OCC per §1.2.1)"
    error_id: "ERR_STALE_DYE_LOT_VERSION | ERR_STALE_ROLL_GOOD_VERSION"
    http_status: 412
    applies_to: "POST /mill/dye-lots/{dye_lot_id}/measurements, POST /mill/cut-orders/{cut_order_id}/allocations"

  - priority: 11
    category: business_safety
    check: "the ordered style holds a Certification with cert_type == DOC_FF_1_70, status == ACTIVE and expires_at_utc > logical clock — carpet may not be committed to a buyer without an effective flammability certificate"
    error_id: ERR_FLAMMABILITY_CERT_REQUIRED
    http_status: 422
    applies_to: "POST /mill/cut-orders/{cut_order_id}/allocate, POST /mill/cut-orders/{cut_order_id}/allocations"

  - priority: 12
    category: business_safety
    check: "the issuing CertificationOfficer's X-User-ID differs from ProductTest.tested_by_user_id on every test cited in source_test_ids (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /mill/certifications"

  - priority: 13
    category: business_safety
    check: "the cited evidence supports the certificate — DOC_FF_1_70 requires at least one FLAMMABILITY_PILL test with verdict PASS on the style; GREEN_LABEL_PLUS requires one PASS STAIN_AATCC175 and one PASS WEAR_TARR on the style; every cited ProductTest.style_id equals the certificate's style_id"
    error_id: ERR_CERT_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /mill/certifications"

  - priority: 14
    category: business_safety
    check: "for cert_type == NSF_140, style_recycled_content_pct evaluated under the certificate's accounting_basis is >= NSF_140_MIN_RECYCLED_PCT"
    error_id: ERR_RECYCLED_CONTENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mill/certifications"

  - priority: 15
    category: business_constraint
    check: "tufter setup matches the style and the machine — gauge_loaded_code == CarpetStyle.gauge_code; gauge_loaded_code == TuftingMachine.native_gauge_code; TuftingMachine.min_pile_height_mm <= pile_height_set_mm <= max_pile_height_mm; abs(pile_height_set_mm - CarpetStyle.pile_height_mm) <= PILE_HEIGHT_SPEC_TOLERANCE_MM; pattern_repeat_loaded_mm == CarpetStyle.pattern_repeat_mm. Checked in this order."
    error_id: "ERR_GAUGE_MISMATCH | ERR_MACHINE_GAUGE_INCOMPATIBLE | ERR_PILE_HEIGHT_OUT_OF_RANGE | ERR_PILE_HEIGHT_SPEC_DEVIATION | ERR_PATTERN_REPEAT_MISMATCH"
    http_status: 422
    applies_to: "POST /mill/production-runs/{production_run_id}/load-setup"

  - priority: 16
    category: business_constraint
    check: "dyeing route is coherent — solution_color_code is non-null exactly when dye_method == SOLUTION_DYED on a CarpetStyle or a FiberBatch; a SOLUTION_DYED style requires FiberBatch.dye_method == SOLUTION_DYED with FiberBatch.solution_color_code == CarpetStyle.solution_color_code, and a PIECE_DYED style requires FiberBatch.dye_method == PIECE_DYED_READY; a DyeLot may only be created against a run whose style is PIECE_DYED; a RollGood on a PIECE_DYED run requires dye_lot_id, and a RollGood on a SOLUTION_DYED run must omit it"
    error_id: "ERR_DYE_METHOD_COLOR_MISMATCH | ERR_DYE_METHOD_MISMATCH | ERR_SOLUTION_DYED_NO_DYE_LOT | ERR_DYE_LOT_REQUIRED"
    http_status: 422
    applies_to: "POST /mill/styles, POST /mill/fiber-batches, POST /mill/production-runs, POST /mill/dye-lots, POST /mill/production-runs/{production_run_id}/roll-goods"

  - priority: 17
    category: business_constraint
    check: "extrusion feedstock and yield are in spec — PolymerLot.melt_flow_index >= MIN_MELT_FLOW_INDEX; a blend lot shares the primary lot's polymer_type; the drawn mass does not exceed PolymerLot.available_kg; on RELEASE, denier_actual is within DENIER_TOLERANCE_FRACTION of denier_target"
    error_id: "ERR_MELT_FLOW_OUT_OF_RANGE | ERR_POLYMER_BLEND_INCOMPATIBLE | ERR_POLYMER_MASS_UNAVAILABLE | ERR_DENIER_OUT_OF_TOLERANCE"
    http_status: 422
    applies_to: "POST /mill/fiber-batches, POST /mill/fiber-batches/{fiber_batch_id}/extrude, POST /mill/fiber-batches/{fiber_batch_id}/disposition"

  - priority: 18
    category: business_constraint
    check: "the rounded face_weight_oz_per_sy is within FACE_WEIGHT_TOLERANCE_OZ of CarpetStyle.target_face_weight_oz"
    error_id: ERR_FACE_WEIGHT_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /mill/production-runs/{production_run_id}/complete-greige"

  - priority: 19
    category: business_constraint
    check: "the requested dye-lot disposition is legal for the assigned shade band — APPROVE requires shade_band IN {A,B,C}; REDYE requires shade_band IN {C,OUT}"
    error_id: "ERR_SHADE_BAND_NOT_APPROVABLE | ERR_SHADE_BAND_NOT_REDYEABLE"
    http_status: 422
    applies_to: "POST /mill/dye-lots/{dye_lot_id}/disposition"

  - priority: 20
    category: business_constraint
    check: "a manual allocation line honours the order's shade_tolerance against the lines already on the order — for shade_tolerance == SINGLE_LOT the roll's dye_lot_id equals the dye_lot_id of the order's earliest-created line in status IN {RESERVED, CUT, SHIPPED}; for BAND_MATCH the roll's shade_band equals that line's shade_band; for ANY no constraint applies. The first line on an order always passes."
    error_id: ERR_SHADE_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /mill/cut-orders/{cut_order_id}/allocations"

  - priority: 21
    category: business_constraint
    check: "reclaimed intake is processable — contamination_pct <= MAX_RECLAIM_CONTAMINATION_PCT, and any source_roll_good_id points at a roll whose inventory_status IN {DEPLETED, SCRAPPED}"
    error_id: "ERR_RECLAIM_CONTAMINATION_EXCEEDED | ERR_ROLL_NOT_RECLAIMABLE"
    http_status: 422
    applies_to: "POST /mill/reclamation-batches/{reclamation_batch_id}/depolymerize"

  - priority: 22
    category: business_temporal
    check: "the new run's occupancy window (scheduled_start_utc minus the machine's changeover_minutes, half-open at scheduled_end_utc) does not intersect any live run's window on the same machine — machine_window_overlap"
    error_id: ERR_MACHINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /mill/production-runs"

  - priority: 23
    category: business_temporal
    check: "at every probe instant of the new lot's closed dye window, the summed lot_kg of contending lots plus the new lot_kg is <= DyeVessel.capacity_kg — vessel_capacity_overlap"
    error_id: ERR_VESSEL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /mill/dye-lots"

  - priority: 24
    category: business_temporal
    check: "the logical clock has reached the booked window — clock >= ProductionRun.scheduled_start_utc for load-setup, clock >= DyeLot.dye_start_utc for start-dyeing"
    error_id: "ERR_RUN_WINDOW_NOT_OPEN | ERR_DYE_WINDOW_NOT_OPEN"
    http_status: 409
    applies_to: "POST /mill/production-runs/{production_run_id}/load-setup, POST /mill/dye-lots/{dye_lot_id}/start-dyeing"

  - priority: 25
    category: business_referential
    check: "the style accepts the order — CarpetStyle.status IN {ACTIVE, RUNOUT} for order creation and allocation, and a RUNOUT style refuses order_type == CUSTOM; a ProductionRun may only be created against a style in ACTIVE"
    error_id: "ERR_STYLE_NOT_ORDERABLE | ERR_STYLE_RUNOUT_NO_CUSTOM | ERR_STYLE_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /mill/cut-orders, POST /mill/cut-orders/{cut_order_id}/allocate, POST /mill/production-runs"

  - priority: 26
    category: business_referential
    check: "a SINGLE_LOT order may not be closed out of a DyeLot in status EXHAUSTED, and no allocation may draw from a roll whose dye lot is REJECTED"
    error_id: ERR_DYE_LOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /mill/cut-orders/{cut_order_id}/allocate, POST /mill/cut-orders/{cut_order_id}/allocations"

  - priority: 27
    category: business_referential
    check: "a manual allocation's yards is <= RollGood.available_yards and the roll is qa_status == PASSED with inventory_status == AVAILABLE"
    error_id: "ERR_ROLL_YARDAGE_INSUFFICIENT | ERR_ROLL_NOT_ALLOCATABLE"
    http_status: 422
    applies_to: "POST /mill/cut-orders/{cut_order_id}/allocations"

  - priority: 28
    category: business_referential
    check: "the roll_good_selector candidate set for the order is non-empty"
    error_id: ERR_NO_ELIGIBLE_ROLL_GOODS
    http_status: 409
    applies_to: "POST /mill/cut-orders/{cut_order_id}/allocate"

  - priority: 29
    category: business_referential
    check: "for order_type == CUSTOM, the candidate yardage fully covers requested_yards — a CUSTOM order is never partially allocated or backordered"
    error_id: ERR_INSUFFICIENT_YARDAGE
    http_status: 422
    applies_to: "POST /mill/cut-orders/{cut_order_id}/allocate"

  - priority: 30
    category: business_fiscal
    check: "Account.credit_used_cents + reserved_credit_cents <= Account.credit_limit_cents at order creation (inclusive)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /mill/cut-orders"

endpoints:
  # ---- Account -------------------------------------------------------------
  - method: POST
    path: "/mill/accounts"
    description: "Open a dealer/builder account with a credit line."
    roles: [MillPlanner, PlantAdmin]
    code: 201
    input: [account_code, account_type, credit_limit_cents]
    output: Account
    side_effects: ["initializes credit_used_cents = 0 and status = ACTIVE"]

  - method: PATCH
    path: "/mill/accounts/{account_id}"
    description: "Adjust an account's credit line or close it."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: ["credit_limit_cents?", "status?"]
    output: Account
    side_effects:
      - "re-evaluates account_credit_ledger posture, so raising the limit can flip CREDIT_HOLD -> ACTIVE and lowering it can flip ACTIVE -> CREDIT_HOLD"
      - "status = CLOSED requires no CutOrder in {SUBMITTED, ALLOCATED, BACKORDERED, CUT} (ERR_ACCOUNT_HAS_OPEN_ORDERS)"
      - "increments Account.version by 1"

  - method: GET
    path: "/mill/accounts/{account_id}"
    description: "Read one account, including its live credit exposure."
    roles: [MillPlanner, PlantAdmin, DealerBuyer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/mill/accounts"
    description: "List accounts."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: ["account_type?", "status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  # ---- PolymerLot ----------------------------------------------------------
  - method: POST
    path: "/mill/polymer-lots"
    description: "Receive a polymer lot into the extrusion feedstock inventory."
    roles: [ExtrusionOperator, PlantAdmin]
    code: 201
    input: [lot_code, polymer_type, received_kg, melt_flow_index, "recycled_content_pct?", "segregated?", "reclaim_source?"]
    output: PolymerLot
    side_effects: ["sets available_kg = received_kg, reserved_kg = consumed_kg = scrapped_kg = 0, status = AVAILABLE"]

  - method: GET
    path: "/mill/polymer-lots/{polymer_lot_id}"
    description: "Read one polymer lot with its four mass buckets."
    roles: [ExtrusionOperator, MillPlanner, CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: PolymerLot
    side_effects: []

  - method: GET
    path: "/mill/polymer-lots"
    description: "List polymer lots."
    roles: [ExtrusionOperator, MillPlanner, CertificationOfficer, PlantAdmin]
    code: 200
    input: ["polymer_type?", "status?", "reclaim_source?", "limit?", "offset?"]
    output: PolymerLot[]
    side_effects: []

  # ---- ReclamationBatch ----------------------------------------------------
  - method: POST
    path: "/mill/reclamation-batches"
    description: "Log a post-consumer carpet reclamation intake, optionally sourced from a mill remnant or returned roll."
    roles: [ExtrusionOperator, PlantAdmin]
    code: 201
    input: [batch_code, intake_lbs, face_fiber_type, contamination_pct, "source_roll_good_id?"]
    output: ReclamationBatch
    side_effects: ["sets status = RECEIVED, depolymerized_kg = 0, output_polymer_lot_id = null"]

  - method: POST
    path: "/mill/reclamation-batches/{reclamation_batch_id}/depolymerize"
    description: "Depolymerize a reclamation intake into a segregated 100 pct recycled polymer lot."
    roles: [ExtrusionOperator, PlantAdmin]
    code: 200
    input: []
    output: ReclamationBatch
    side_effects:
      - "computes depolymerized_kg via reclamation_yield"
      - "mints a PolymerLot (recycled_content_pct = 100.00, segregated = true, reclaim_source = POST_CONSUMER) and stores its id in output_polymer_lot_id"
      - "transitions ReclamationBatch RECEIVED -> DEPOLYMERIZED"

  - method: GET
    path: "/mill/reclamation-batches/{reclamation_batch_id}"
    description: "Read one reclamation batch."
    roles: [ExtrusionOperator, MillPlanner, CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: ReclamationBatch
    side_effects: []

  - method: GET
    path: "/mill/reclamation-batches"
    description: "List reclamation batches; filterable by the roll they reclaimed and by the polymer lot they produced."
    roles: [ExtrusionOperator, MillPlanner, CertificationOfficer, PlantAdmin]
    code: 200
    input: ["status?", "face_fiber_type?", "source_roll_good_id?", "output_polymer_lot_id?", "limit?", "offset?"]
    output: ReclamationBatch[]
    side_effects: []

  # ---- FiberBatch ----------------------------------------------------------
  - method: POST
    path: "/mill/fiber-batches"
    description: "Queue an extrusion batch, reserving polymer mass from one or two lots."
    roles: [ExtrusionOperator, PlantAdmin]
    code: 201
    input: [batch_code, polymer_lot_id, input_kg, denier_target, filament_count, dye_method, "blend_polymer_lot_id?", "blend_input_kg?", "solution_color_code?"]
    output: FiberBatch
    side_effects:
      - "moves input_kg (and blend_input_kg) from available_kg to reserved_kg on the source PolymerLot rows per polymer_mass_conservation"
      - "a PolymerLot whose available_kg reaches 0 transitions AVAILABLE -> DEPLETED"
      - "sets FiberBatch.status = QUEUED"

  - method: POST
    path: "/mill/fiber-batches/{fiber_batch_id}/extrude"
    description: "Spin the queued batch, recording extruder throughput and take-up speed."
    roles: [ExtrusionOperator, PlantAdmin]
    code: 200
    input: [throughput_g_per_min, spin_speed_m_per_min]
    output: FiberBatch
    side_effects:
      - "computes denier_actual via denier_actual_from_throughput and extruded_kg via SPIN_YIELD"
      - "moves the drawn mass from reserved_kg to consumed_kg on the source PolymerLot rows"
      - "transitions FiberBatch QUEUED -> SPUN"

  - method: POST
    path: "/mill/fiber-batches/{fiber_batch_id}/disposition"
    description: "Release a spun batch to the creel pool, or scrap it."
    roles: [ExtrusionOperator, PlantAdmin]
    code: 200
    input: [disposition]
    output: FiberBatch
    side_effects:
      - "disposition = RELEASE gates on DENIER_TOLERANCE_FRACTION and transitions SPUN -> RELEASED"
      - "disposition = SCRAP from SPUN moves the drawn mass consumed_kg -> scrapped_kg"
      - "disposition = SCRAP from QUEUED returns the drawn mass reserved_kg -> available_kg and may flip a PolymerLot DEPLETED -> AVAILABLE"

  - method: GET
    path: "/mill/fiber-batches/{fiber_batch_id}"
    description: "Read one fiber batch."
    roles: [ExtrusionOperator, MillPlanner, CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: FiberBatch
    side_effects: []

  - method: GET
    path: "/mill/fiber-batches"
    description: "List fiber batches; filterable by either source polymer lot."
    roles: [ExtrusionOperator, MillPlanner, CertificationOfficer, PlantAdmin]
    code: 200
    input: ["polymer_lot_id?", "blend_polymer_lot_id?", "status?", "dye_method?", "limit?", "offset?"]
    output: FiberBatch[]
    side_effects: []

  # ---- CarpetStyle ---------------------------------------------------------
  - method: POST
    path: "/mill/styles"
    description: "Draft a carpet style with its gauge, pile and pricing specification."
    roles: [MillPlanner, PlantAdmin]
    code: 201
    input: [style_code, line_type, gauge_code, pile_construction, pile_height_mm, pattern_repeat_mm, plies, target_face_weight_oz, dye_method, list_price_cents_per_yard, "solution_color_code?"]
    output: CarpetStyle
    side_effects: ["sets status = DRAFT, open_backorder_yards = 0, replenishment_flag = NONE"]

  - method: POST
    path: "/mill/styles/{style_id}/activate"
    description: "Activate a drafted style, making it schedulable and orderable."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: []
    output: CarpetStyle
    side_effects: ["transitions CarpetStyle DRAFT -> ACTIVE"]

  - method: POST
    path: "/mill/styles/{style_id}/discontinue"
    description: "Announce style runout: no new runs, no new CUSTOM orders, existing stock sells through."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: ["reason?"]
    output: CarpetStyle
    side_effects:
      - "transitions CarpetStyle ACTIVE|SUSPENDED -> RUNOUT"
      - "cascade hop 1: SUBMITTED CUSTOM CutOrders of the style -> CANCELLED"
      - "cascade hop 2: each cancellation releases that order's reserved_credit_cents from Account.credit_used_cents"
      - "cascade hop 3: an Account whose credit_used_cents drops below credit_limit_cents flips CREDIT_HOLD -> ACTIVE"
      - "fan-out: SCHEDULED and HELD ProductionRuns of the style -> ABORTED, each returning its FiberBatch ALLOCATED -> RELEASED"

  - method: GET
    path: "/mill/styles/{style_id}"
    description: "Read one style with its backorder posture."
    roles: [MillPlanner, CertificationOfficer, DyeHouseOperator, QALabTechnician, DealerBuyer, PlantAdmin]
    code: 200
    input: []
    output: CarpetStyle
    side_effects: []

  - method: GET
    path: "/mill/styles"
    description: "List styles."
    roles: [MillPlanner, CertificationOfficer, DyeHouseOperator, QALabTechnician, DealerBuyer, PlantAdmin]
    code: 200
    input: ["status?", "line_type?", "dye_method?", "limit?", "offset?"]
    output: CarpetStyle[]
    side_effects: []

  - method: GET
    path: "/mill/styles/{style_id}/recycled-content"
    description: "Computed read: recycled content of the style under both accounting bases, plus the qualifying mass."
    roles: [MillPlanner, CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: { mass_balance_pct: number, physical_segregation_pct: number, qualifying_kg: number, qualifying_fiber_batch_ids: array }
    side_effects: []

  # ---- TuftingMachine ------------------------------------------------------
  - method: POST
    path: "/mill/tufting-machines"
    description: "Register a tufter with its installed gauge, pile-height envelope and changeover buffer."
    roles: [MillPlanner, PlantAdmin]
    code: 201
    input: [machine_code, native_gauge_code, min_pile_height_mm, max_pile_height_mm, changeover_minutes, needle_bar_width_in, "status?"]
    output: TuftingMachine
    side_effects: []

  - method: GET
    path: "/mill/tufting-machines/{machine_id}"
    description: "Read one tufter."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: []
    output: TuftingMachine
    side_effects: []

  - method: GET
    path: "/mill/tufting-machines"
    description: "List tufters."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: ["status?", "native_gauge_code?", "limit?", "offset?"]
    output: TuftingMachine[]
    side_effects: []

  # ---- DyeVessel -----------------------------------------------------------
  - method: POST
    path: "/mill/dye-vessels"
    description: "Register a dye beck or jet with its mass capacity."
    roles: [MillPlanner, DyeHouseOperator, PlantAdmin]
    code: 201
    input: [vessel_code, vessel_type, capacity_kg, "status?"]
    output: DyeVessel
    side_effects: []

  - method: GET
    path: "/mill/dye-vessels/{vessel_id}"
    description: "Read one dye vessel."
    roles: [MillPlanner, DyeHouseOperator, PlantAdmin]
    code: 200
    input: []
    output: DyeVessel
    side_effects: []

  - method: GET
    path: "/mill/dye-vessels"
    description: "List dye vessels."
    roles: [MillPlanner, DyeHouseOperator, PlantAdmin]
    code: 200
    input: ["status?", "vessel_type?", "limit?", "offset?"]
    output: DyeVessel[]
    side_effects: []

  # ---- ProductionRun -------------------------------------------------------
  - method: POST
    path: "/mill/production-runs"
    description: "Schedule a tufting run, booking the machine window and reserving the creel."
    roles: [MillPlanner, PlantAdmin]
    code: 201
    input: [run_code, style_id, machine_id, fiber_batch_id, scheduled_start_utc, scheduled_end_utc]
    output: ProductionRun
    side_effects:
      - "enforces machine_window_overlap against live runs on the same machine"
      - "enforces the dye-method coupling between CarpetStyle and FiberBatch"
      - "transitions FiberBatch RELEASED -> ALLOCATED"
      - "sets ProductionRun.status = SCHEDULED, recoat_count = 0"

  - method: POST
    path: "/mill/production-runs/{production_run_id}/load-setup"
    description: "Record the tufter setup — gauge, pile height, pattern repeat and stitch rate — and start tufting."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: [gauge_loaded_code, pile_height_set_mm, pattern_repeat_loaded_mm, stitch_rate_per_inch]
    output: ProductionRun
    side_effects:
      - "runs the priority-15 setup checks and the priority-24 window check"
      - "requires CarpetStyle.status == ACTIVE"
      - "transitions ProductionRun SCHEDULED -> TUFTING"

  - method: POST
    path: "/mill/production-runs/{production_run_id}/complete-greige"
    description: "Close out tufting, recording greige yardage and computing face weight."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: [greige_yards]
    output: ProductionRun
    side_effects:
      - "computes face_weight_oz_per_sy via face_weight_per_square_yard and enforces FACE_WEIGHT_TOLERANCE_OZ"
      - "transitions ProductionRun TUFTING -> GREIGE"
      - "cascade: FiberBatch ALLOCATED -> CONSUMED"

  - method: POST
    path: "/mill/production-runs/{production_run_id}/apply-backing"
    description: "Apply and cure the latex backing compound; the computed peel strength decides BACKED vs BACKING_FAILED."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: [sbr_pct, filler_load_pct, cure_temp_c, cure_seconds, secondary_backing_type]
    output: ProductionRun
    side_effects:
      - "computes delamination_strength_lbf via delamination_strength"
      - "transitions ProductionRun GREIGE -> BACKED when >= MIN_DELAMINATION_LBF, else GREIGE -> BACKING_FAILED"

  - method: POST
    path: "/mill/production-runs/{production_run_id}/recoat"
    description: "Strip a failed backing and return the run to greige for one more attempt."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "increments recoat_count, clears the latex formulation fields and delamination_strength_lbf"
      - "transitions ProductionRun BACKING_FAILED -> GREIGE, bounded by RECOAT_LIMIT"

  - method: POST
    path: "/mill/production-runs/{production_run_id}/abort"
    description: "Abort a run that has not started tufting, freeing its machine window and creel."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: ["reason?"]
    output: ProductionRun
    side_effects:
      - "transitions ProductionRun SCHEDULED|HELD -> ABORTED"
      - "cascade: FiberBatch ALLOCATED -> RELEASED"

  - method: POST
    path: "/mill/production-runs/{production_run_id}/roll-goods"
    description: "Doff a finished roll off a backed run."
    roles: [MillPlanner, PlantAdmin]
    code: 201
    input: [roll_number, width_ft, initial_yards, "dye_lot_id?"]
    output: RollGood
    side_effects:
      - "requires ProductionRun.status IN {BACKED, RELEASED}"
      - "requires dye_lot_id exactly when the style is PIECE_DYED, and forbids it when SOLUTION_DYED"
      - "snapshots shade_band from the dye lot, or SOLUTION for solution-dyed rolls"
      - "sets qa_status = PENDING, inventory_status = IN_PROCESS, available_yards = initial_yards"

  - method: GET
    path: "/mill/production-runs/{production_run_id}"
    description: "Read one production run."
    roles: [MillPlanner, DyeHouseOperator, QALabTechnician, CertificationOfficer, PlantAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/mill/production-runs"
    description: "List production runs; filterable by style, machine and creel."
    roles: [MillPlanner, DyeHouseOperator, QALabTechnician, CertificationOfficer, PlantAdmin]
    code: 200
    input: ["style_id?", "machine_id?", "fiber_batch_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  # ---- DyeLot --------------------------------------------------------------
  - method: POST
    path: "/mill/dye-lots"
    description: "Formulate a piece-dye lot against greige goods and book a vessel window."
    roles: [DyeHouseOperator, PlantAdmin]
    code: 201
    input: [lot_code, production_run_id, vessel_id, color_code, target_lab_l, target_lab_a, target_lab_b, lot_kg, dye_start_utc, dye_end_utc, dyed_yards]
    output: DyeLot
    side_effects:
      - "enforces vessel_capacity_overlap on the closed dye window"
      - "requires the run's style to be PIECE_DYED and the run to be in status IN {GREIGE, BACKED, BACKING_FAILED, RELEASED}"
      - "sets status = FORMULATED, redye_count = 0, scrapped_yards = 0, uncommitted_yards = dyed_yards, shipped_basis_uncommitted_yards = dyed_yards"

  - method: POST
    path: "/mill/dye-lots/{dye_lot_id}/start-dyeing"
    description: "Charge the lot into its booked vessel."
    roles: [DyeHouseOperator, PlantAdmin]
    code: 200
    input: []
    output: DyeLot
    side_effects:
      - "transitions DyeLot FORMULATED -> DYEING, or REDYE_QUEUED -> DYEING while incrementing redye_count and clearing the previous measurement"

  - method: POST
    path: "/mill/dye-lots/{dye_lot_id}/measurements"
    description: "Record a spectrophotometer reading, computing delta_e and the shade band. Guarded by OCC on the dye lot's version."
    roles: [DyeHouseOperator, PlantAdmin]
    code: 200
    input: [measured_lab_l, measured_lab_a, measured_lab_b, expected_dye_lot_version]
    output: DyeLot
    side_effects:
      - "computes delta_e via color_delta_e and shade_band via shade_band_assignment"
      - "transitions DyeLot DYEING -> MEASURED"
      - "increments DyeLot.version by 1"

  - method: POST
    path: "/mill/dye-lots/{dye_lot_id}/disposition"
    description: "Approve, re-dye or reject a measured lot."
    roles: [DyeHouseOperator, PlantAdmin]
    code: 200
    input: [disposition]
    output: DyeLot
    side_effects:
      - "APPROVE: MEASURED -> APPROVED, recomputes both dye_lot_uncommitted_yards variants"
      - "REDYE: MEASURED -> REDYE_QUEUED, records parent_dye_lot_id"
      - "REJECT: MEASURED|APPROVED -> REJECTED and runs the five-hop rejection cascade (rolls scrapped, allocations voided, orders backordered, style backorder yards, replenishment flag)"

  - method: GET
    path: "/mill/dye-lots/{dye_lot_id}"
    description: "Read one dye lot with both uncommitted-yardage variants."
    roles: [DyeHouseOperator, MillPlanner, QALabTechnician, PlantAdmin]
    code: 200
    input: []
    output: DyeLot
    side_effects: []

  - method: GET
    path: "/mill/dye-lots"
    description: "List dye lots; filterable by run, vessel and re-dye parent."
    roles: [DyeHouseOperator, MillPlanner, QALabTechnician, PlantAdmin]
    code: 200
    input: ["production_run_id?", "vessel_id?", "parent_dye_lot_id?", "status?", "shade_band?", "limit?", "offset?"]
    output: DyeLot[]
    side_effects: []

  # ---- RollGood ------------------------------------------------------------
  - method: POST
    path: "/mill/roll-goods/{roll_good_id}/qa-disposition"
    description: "Release, hold or scrap a roll after inspection."
    roles: [QALabTechnician, PlantAdmin]
    code: 200
    input: [disposition]
    output: RollGood
    side_effects:
      - "RELEASE: qa_status -> PASSED and inventory_status IN_PROCESS -> AVAILABLE; cascades ProductionRun BACKED -> RELEASED on the run's first passed roll"
      - "HOLD: qa_status -> HELD with inventory_status untouched"
      - "SCRAP: qa_status -> FAILED, inventory_status -> SCRAPPED, available_yards -> 0, DyeLot.scrapped_yards increased by initial_yards minus already-SHIPPED yards, RESERVED allocations -> VOIDED"
      - "increments RollGood.version by 1"

  - method: GET
    path: "/mill/roll-goods/{roll_good_id}"
    description: "Read one roll, including its version for optimistic allocation."
    roles: [QALabTechnician, MillPlanner, DyeHouseOperator, ExtrusionOperator, PlantAdmin]
    code: 200
    input: []
    output: RollGood
    side_effects: []

  - method: GET
    path: "/mill/roll-goods"
    description: "List rolls; filterable by run, dye lot and remnant parent."
    roles: [QALabTechnician, MillPlanner, DyeHouseOperator, ExtrusionOperator, PlantAdmin]
    code: 200
    input: ["production_run_id?", "dye_lot_id?", "parent_roll_id?", "qa_status?", "inventory_status?", "shade_band?", "limit?", "offset?"]
    output: RollGood[]
    side_effects: []

  # ---- ProductTest ---------------------------------------------------------
  - method: POST
    path: "/mill/product-tests"
    description: "Record an immutable wear, stain or flammability test result against a roll."
    roles: [QALabTechnician, PlantAdmin]
    code: 201
    input: [style_id, roll_good_id, test_type, result_value]
    output: ProductTest
    side_effects:
      - "computes verdict via product_test_verdict"
      - "stamps tested_by_user_id from X-User-ID and tested_at_utc from the logical clock"

  - method: GET
    path: "/mill/product-tests/{product_test_id}"
    description: "Read one product test."
    roles: [QALabTechnician, CertificationOfficer, MillPlanner, PlantAdmin]
    code: 200
    input: []
    output: ProductTest
    side_effects: []

  - method: GET
    path: "/mill/product-tests"
    description: "List product tests; filterable by style and roll."
    roles: [QALabTechnician, CertificationOfficer, MillPlanner, PlantAdmin]
    code: 200
    input: ["style_id?", "roll_good_id?", "test_type?", "verdict?", "limit?", "offset?"]
    output: ProductTest[]
    side_effects: []

  # ---- Certification -------------------------------------------------------
  - method: POST
    path: "/mill/certifications"
    description: "Issue a certificate for a style, citing product tests as evidence. Segregation of duties applies."
    roles: [CertificationOfficer, PlantAdmin]
    code: 201
    input: [style_id, cert_type, source_test_ids, expires_at_utc, "accounting_basis?"]
    output: Certification
    side_effects:
      - "runs the priority-12 SoD check, the priority-13 evidence check and, for NSF_140, the priority-14 recycled-content check"
      - "records recorded_recycled_content_pct via style_recycled_content_pct for NSF_140"
      - "supersedes any prior ACTIVE certificate of the same cert_type for the style (ACTIVE -> SUPERSEDED)"
      - "cascade: a SUSPENDED style regaining an effective DOC_FF_1_70 certificate flips SUSPENDED -> ACTIVE, releasing its HELD runs back to SCHEDULED"

  - method: POST
    path: "/mill/certifications/{certification_id}/revoke"
    description: "Revoke an active certificate."
    roles: [CertificationOfficer, PlantAdmin]
    code: 200
    input: ["reason?"]
    output: Certification
    side_effects:
      - "transitions Certification ACTIVE -> REVOKED"
      - "cascade: a style left without an effective DOC_FF_1_70 certificate flips ACTIVE -> SUSPENDED, holding its SCHEDULED runs"

  - method: GET
    path: "/mill/certifications/{certification_id}"
    description: "Read one certificate."
    roles: [CertificationOfficer, MillPlanner, QALabTechnician, PlantAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/mill/certifications"
    description: "List certificates; filterable by style."
    roles: [CertificationOfficer, MillPlanner, QALabTechnician, PlantAdmin]
    code: 200
    input: ["style_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  # ---- CutOrder / CutAllocation -------------------------------------------
  - method: POST
    path: "/mill/cut-orders"
    description: "Submit a cut order against a style, reserving account credit."
    roles: [DealerBuyer, MillPlanner, PlantAdmin]
    code: 201
    input: [order_code, account_id, style_id, order_type, requested_yards, shade_tolerance]
    output: CutOrder
    side_effects:
      - "computes reserved_credit_cents via cut_order_credit_reservation and enforces the credit gate"
      - "drives account_credit_ledger; an account reaching its limit flips ACTIVE -> CREDIT_HOLD"
      - "sets status = SUBMITTED, allocated_yards = 0"

  - method: POST
    path: "/mill/cut-orders/{cut_order_id}/allocate"
    description: "Auto-allocate roll goods to the order using roll_good_selector (remnants first, then smallest roll)."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: []
    output: CutOrder
    side_effects:
      - "creates RESERVED CutAllocation rows per roll_good_selector"
      - "recomputes roll_good_yardage_ledger, flipping rolls AVAILABLE -> COMMITTED at exactly 0 yards"
      - "recomputes cut_order_line_charges then cut_order_settlement"
      - "recomputes dye_lot_uncommitted_yards; a lot at <= 0 flips APPROVED -> EXHAUSTED"
      - "transitions CutOrder SUBMITTED|BACKORDERED -> ALLOCATED, or -> BACKORDERED for a short RUNNING_LINE order"

  - method: POST
    path: "/mill/cut-orders/{cut_order_id}/allocations"
    description: "Manually commit yards from one named roll to the order. Guarded by OCC on the roll's version."
    roles: [MillPlanner, PlantAdmin]
    code: 201
    input: [roll_good_id, yards, expected_roll_good_version]
    output: CutAllocation
    side_effects:
      - "creates one RESERVED CutAllocation and increments RollGood.version by 1"
      - "recomputes roll_good_yardage_ledger, cut_order_line_charges and cut_order_settlement"
      - "transitions CutOrder SUBMITTED|BACKORDERED -> ALLOCATED once allocated_yards == requested_yards"

  - method: POST
    path: "/mill/cut-orders/{cut_order_id}/cut"
    description: "Cut the reserved yardage, splitting sub-threshold residuals off as remnant rolls."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: []
    output: CutOrder
    side_effects:
      - "transitions every allocation RESERVED -> CUT"
      - "mints a remnant child RollGood for each residual in (0, REMNANT_THRESHOLD_YARDS) — copying production_run_id, dye_lot_id, width_ft and shade_band from the parent, with parent_roll_id set, is_remnant = true, qa_status = PASSED, inventory_status = AVAILABLE and roll_number = <parent roll_number>-R1 — and drives the parent roll to DEPLETED"
      - "a residual >= REMNANT_THRESHOLD_YARDS mints no child and leaves the parent AVAILABLE with that residual"
      - "transitions CutOrder ALLOCATED -> CUT"

  - method: POST
    path: "/mill/cut-orders/{cut_order_id}/ship"
    description: "Ship the cut order and convert the credit hold into an invoice."
    roles: [MillPlanner, PlantAdmin]
    code: 200
    input: []
    output: CutOrder
    side_effects:
      - "transitions every allocation CUT -> SHIPPED"
      - "replaces the reserved_credit_cents hold with net_invoice_cents on Account.credit_used_cents"
      - "recomputes both dye_lot_uncommitted_yards variants for every touched lot"
      - "transitions CutOrder CUT -> SHIPPED and re-evaluates CarpetStyle RUNOUT -> DISCONTINUED"

  - method: POST
    path: "/mill/cut-orders/{cut_order_id}/cancel"
    description: "Cancel an unshipped order, releasing its allocations and its credit hold."
    roles: [DealerBuyer, MillPlanner, PlantAdmin]
    code: 200
    input: ["reason?"]
    output: CutOrder
    side_effects:
      - "transitions every RESERVED allocation -> RELEASED"
      - "returns yardage to each roll, flipping COMMITTED -> AVAILABLE (roll_good_yardage_conservation)"
      - "decrements Account.credit_used_cents by reserved_credit_cents and zeroes it (account_credit_conservation); a CREDIT_HOLD account may flip back to ACTIVE"
      - "transitions CutOrder -> CANCELLED and re-evaluates CarpetStyle RUNOUT -> DISCONTINUED"

  - method: GET
    path: "/mill/cut-orders/{cut_order_id}"
    description: "Read one cut order with its invoice breakdown."
    roles: [MillPlanner, DealerBuyer, PlantAdmin]
    code: 200
    input: []
    output: CutOrder
    side_effects: []

  - method: GET
    path: "/mill/cut-orders"
    description: "List cut orders; filterable by account and style."
    roles: [MillPlanner, DealerBuyer, PlantAdmin]
    code: 200
    input: ["account_id?", "style_id?", "status?", "order_type?", "limit?", "offset?"]
    output: CutOrder[]
    side_effects: []

  - method: GET
    path: "/mill/cut-allocations/{cut_allocation_id}"
    description: "Read one allocation line."
    roles: [MillPlanner, DealerBuyer, PlantAdmin]
    code: 200
    input: []
    output: CutAllocation
    side_effects: []

  - method: GET
    path: "/mill/cut-allocations"
    description: "List allocation lines; filterable by order and by roll."
    roles: [MillPlanner, DealerBuyer, QALabTechnician, PlantAdmin]
    code: 200
    input: ["cut_order_id?", "roll_good_id?", "status?", "limit?", "offset?"]
    output: CutAllocation[]
    side_effects: []

  # ---- Test-driving surface ------------------------------------------------
  - method: POST
    path: "/mill/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Advancing the clock lapses every ACTIVE Certification whose expires_at_utc <= the new instant and cascades the resulting style suspensions."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, lapsed_certification_ids: array, suspended_style_ids: array, held_production_run_ids: array }
    side_effects:
      - "sets the logical clock to to_iso8601"
      - "transitions every ACTIVE Certification with expires_at_utc <= the new clock to LAPSED"
      - "cascade: each style left without an effective DOC_FF_1_70 certificate flips ACTIVE -> SUSPENDED"
      - "cascade: each newly SUSPENDED style's SCHEDULED runs flip to HELD"

errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "a DealerBuyer acts on an Account, CutOrder or cut-order sub-resource whose account_id is not the caller's X-User-ID"

  # --- existence ----------------------------------------------------------
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id in the path or body matches no Account"
  - id: ERR_POLYMER_LOT_NOT_FOUND
    http: 404
    condition: "polymer_lot_id or blend_polymer_lot_id matches no PolymerLot"
  - id: ERR_RECLAMATION_BATCH_NOT_FOUND
    http: 404
    condition: "reclamation_batch_id matches no ReclamationBatch"
  - id: ERR_FIBER_BATCH_NOT_FOUND
    http: 404
    condition: "fiber_batch_id matches no FiberBatch"
  - id: ERR_STYLE_NOT_FOUND
    http: 404
    condition: "style_id matches no CarpetStyle"
  - id: ERR_MACHINE_NOT_FOUND
    http: 404
    condition: "machine_id matches no TuftingMachine"
  - id: ERR_VESSEL_NOT_FOUND
    http: 404
    condition: "vessel_id matches no DyeVessel"
  - id: ERR_PRODUCTION_RUN_NOT_FOUND
    http: 404
    condition: "production_run_id matches no ProductionRun"
  - id: ERR_DYE_LOT_NOT_FOUND
    http: 404
    condition: "dye_lot_id matches no DyeLot"
  - id: ERR_ROLL_GOOD_NOT_FOUND
    http: 404
    condition: "roll_good_id or source_roll_good_id matches no RollGood"
  - id: ERR_PRODUCT_TEST_NOT_FOUND
    http: 404
    condition: "product_test_id, or any element of source_test_ids, matches no ProductTest"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification_id matches no Certification"
  - id: ERR_CUT_ORDER_NOT_FOUND
    http: 404
    condition: "cut_order_id matches no CutOrder"
  - id: ERR_CUT_ALLOCATION_NOT_FOUND
    http: 404
    condition: "cut_allocation_id matches no CutAllocation"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum value outside its declared set, numeric outside its declared range, malformed ISO 8601 datetime, non-positive yardage/mass, scheduled_end_utc <= scheduled_start_utc, dye_end_utc <= dye_start_utc, blend_input_kg present without blend_polymer_lot_id (or vice versa), accounting_basis supplied for a non-NSF_140 certificate or omitted for NSF_140, limit outside [1,100], or offset < 0"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "account_code, PolymerLot.lot_code, ReclamationBatch.batch_code, FiberBatch.batch_code, style_code, machine_code, vessel_code, run_code, DyeLot.lot_code, roll_number or order_code already exists"

  # --- generic state ------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared in §1.2 for the target's current status, and no more specific state error applies"
  - id: ERR_FIBER_BATCH_NOT_RELEASED
    http: 409
    condition: "POST /mill/production-runs names a FiberBatch whose status is not RELEASED"
  - id: ERR_RUN_NOT_BACKED
    http: 409
    condition: "POST /mill/production-runs/{production_run_id}/roll-goods on a run whose status is not in {BACKED, RELEASED}"
  - id: ERR_DYE_LOT_NOT_APPROVED
    http: 409
    condition: "an allocation would draw from a roll whose DyeLot is not in {APPROVED, EXHAUSTED}"
  - id: ERR_ROLL_ALREADY_DEPLETED
    http: 409
    condition: "an allocation or QA disposition targets a roll whose inventory_status is DEPLETED or SCRAPPED"
  - id: ERR_STYLE_NOT_ACTIVE
    http: 409
    condition: "a ProductionRun is scheduled against, or a tufter is loaded for, a CarpetStyle not in status ACTIVE"
  - id: ERR_STYLE_NOT_ORDERABLE
    http: 409
    condition: "a CutOrder or allocation targets a CarpetStyle in status DRAFT, SUSPENDED or DISCONTINUED"
  - id: ERR_STYLE_RUNOUT_NO_CUSTOM
    http: 409
    condition: "order_type == CUSTOM against a CarpetStyle in status RUNOUT"
  - id: ERR_MACHINE_UNAVAILABLE
    http: 409
    condition: "the named TuftingMachine is in status MAINTENANCE"
  - id: ERR_VESSEL_UNAVAILABLE
    http: 409
    condition: "the named DyeVessel is in status MAINTENANCE"
  - id: ERR_REDYE_LIMIT_REACHED
    http: 409
    condition: "disposition = REDYE on a DyeLot whose redye_count already equals MAX_REDYE_COUNT"
  - id: ERR_RECOAT_LIMIT_REACHED
    http: 409
    condition: "POST recoat on a ProductionRun whose recoat_count already equals RECOAT_LIMIT"
  - id: ERR_ACCOUNT_CREDIT_HOLD
    http: 409
    condition: "POST /mill/cut-orders for an Account in status CREDIT_HOLD"
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "POST /mill/cut-orders for an Account in status CLOSED"
  - id: ERR_ACCOUNT_HAS_OPEN_ORDERS
    http: 409
    condition: "PATCH an Account to status CLOSED while it holds a CutOrder in {SUBMITTED, ALLOCATED, BACKORDERED, CUT}"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_DYE_LOT_VERSION
    http: 412
    condition: "expected_dye_lot_version does not equal the DyeLot's current version"
  - id: ERR_STALE_ROLL_GOOD_VERSION
    http: 412
    condition: "expected_roll_good_version does not equal the RollGood's current version"

  # --- compliance / safety -------------------------------------------------
  - id: ERR_FLAMMABILITY_CERT_REQUIRED
    http: 422
    condition: "yardage is committed to a buyer for a style with no ACTIVE DOC_FF_1_70 certificate whose expires_at_utc is strictly after the logical clock"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the issuing CertificationOfficer's X-User-ID equals ProductTest.tested_by_user_id on any test cited in source_test_ids"
  - id: ERR_CERT_EVIDENCE_MISSING
    http: 422
    condition: "source_test_ids lacks the PASS verdicts the cert_type requires, or cites a test belonging to another style"
  - id: ERR_RECYCLED_CONTENT_INSUFFICIENT
    http: 422
    condition: "cert_type == NSF_140 and style_recycled_content_pct under the requested accounting_basis is strictly below NSF_140_MIN_RECYCLED_PCT"

  # --- extrusion / setup constraints ---------------------------------------
  - id: ERR_MELT_FLOW_OUT_OF_RANGE
    http: 422
    condition: "a source PolymerLot's melt_flow_index is strictly below MIN_MELT_FLOW_INDEX"
  - id: ERR_POLYMER_BLEND_INCOMPATIBLE
    http: 422
    condition: "blend_polymer_lot_id names a lot whose polymer_type differs from the primary lot's polymer_type"
  - id: ERR_POLYMER_MASS_UNAVAILABLE
    http: 422
    condition: "input_kg or blend_input_kg exceeds the corresponding PolymerLot.available_kg"
  - id: ERR_DENIER_OUT_OF_TOLERANCE
    http: 422
    condition: "disposition = RELEASE while abs(denier_actual - denier_target) / denier_target exceeds DENIER_TOLERANCE_FRACTION"
  - id: ERR_GAUGE_MISMATCH
    http: 422
    condition: "gauge_loaded_code differs from CarpetStyle.gauge_code"
  - id: ERR_MACHINE_GAUGE_INCOMPATIBLE
    http: 422
    condition: "gauge_loaded_code differs from TuftingMachine.native_gauge_code"
  - id: ERR_PILE_HEIGHT_OUT_OF_RANGE
    http: 422
    condition: "pile_height_set_mm falls outside the tufter's inclusive [min_pile_height_mm, max_pile_height_mm] envelope"
  - id: ERR_PILE_HEIGHT_SPEC_DEVIATION
    http: 422
    condition: "abs(pile_height_set_mm - CarpetStyle.pile_height_mm) exceeds PILE_HEIGHT_SPEC_TOLERANCE_MM"
  - id: ERR_PATTERN_REPEAT_MISMATCH
    http: 422
    condition: "pattern_repeat_loaded_mm differs from CarpetStyle.pattern_repeat_mm"
  - id: ERR_FACE_WEIGHT_OUT_OF_TOLERANCE
    http: 422
    condition: "abs(face_weight_oz_per_sy - CarpetStyle.target_face_weight_oz) exceeds FACE_WEIGHT_TOLERANCE_OZ at greige completion"

  # --- dyeing constraints ---------------------------------------------------
  - id: ERR_DYE_METHOD_COLOR_MISMATCH
    http: 422
    condition: "solution_color_code is supplied without dye_method == SOLUTION_DYED, or omitted when dye_method == SOLUTION_DYED, on a CarpetStyle or FiberBatch"
  - id: ERR_DYE_METHOD_MISMATCH
    http: 422
    condition: "the FiberBatch's dye_method (or solution_color_code) does not match the CarpetStyle's, or a DyeLot is created against a run whose style is SOLUTION_DYED"
  - id: ERR_SOLUTION_DYED_NO_DYE_LOT
    http: 422
    condition: "dye_lot_id is supplied when doffing a roll from a SOLUTION_DYED run"
  - id: ERR_DYE_LOT_REQUIRED
    http: 422
    condition: "dye_lot_id is omitted when doffing a roll from a PIECE_DYED run"
  - id: ERR_SHADE_BAND_NOT_APPROVABLE
    http: 422
    condition: "disposition = APPROVE on a measured DyeLot whose shade_band is OUT"
  - id: ERR_SHADE_BAND_NOT_REDYEABLE
    http: 422
    condition: "disposition = REDYE on a measured DyeLot whose shade_band is A or B"
  - id: ERR_SHADE_BAND_MISMATCH
    http: 422
    condition: "a manual allocation line breaks the order's shade_tolerance — a different dye lot under SINGLE_LOT, or a different shade band under BAND_MATCH, than the order's earliest live line"

  # --- temporal -------------------------------------------------------------
  - id: ERR_MACHINE_WINDOW_CONFLICT
    http: 409
    condition: "the requested run window, extended backwards by the tufter's changeover_minutes and half-open at its end, intersects a live run on the same machine"
  - id: ERR_VESSEL_CAPACITY_EXCEEDED
    http: 409
    condition: "the summed lot_kg of lots contending for the vessel at any instant of the requested closed dye window would exceed DyeVessel.capacity_kg"
  - id: ERR_RUN_WINDOW_NOT_OPEN
    http: 409
    condition: "the logical clock has not reached ProductionRun.scheduled_start_utc"
  - id: ERR_DYE_WINDOW_NOT_OPEN
    http: 409
    condition: "the logical clock has not reached DyeLot.dye_start_utc"

  # --- recycling ------------------------------------------------------------
  - id: ERR_RECLAIM_CONTAMINATION_EXCEEDED
    http: 422
    condition: "ReclamationBatch.contamination_pct exceeds MAX_RECLAIM_CONTAMINATION_PCT at depolymerization"
  - id: ERR_ROLL_NOT_RECLAIMABLE
    http: 422
    condition: "source_roll_good_id names a roll whose inventory_status is not DEPLETED or SCRAPPED"

  # --- inventory / allocation ----------------------------------------------
  - id: ERR_DYE_LOT_EXHAUSTED
    http: 409
    condition: "a SINGLE_LOT order is allocated against a DyeLot in status EXHAUSTED, or any allocation draws from a roll whose DyeLot is REJECTED"
  - id: ERR_ROLL_NOT_ALLOCATABLE
    http: 422
    condition: "a manual allocation targets a roll whose qa_status is not PASSED or whose inventory_status is not AVAILABLE"
  - id: ERR_ROLL_YARDAGE_INSUFFICIENT
    http: 422
    condition: "a manual allocation's yards exceeds RollGood.available_yards"
  - id: ERR_NO_ELIGIBLE_ROLL_GOODS
    http: 409
    condition: "roll_good_selector finds no candidate roll for the order's style, shade_tolerance and width"
  - id: ERR_INSUFFICIENT_YARDAGE
    http: 422
    condition: "order_type == CUSTOM and the eligible candidate yardage is strictly less than requested_yards"

  # --- fiscal ---------------------------------------------------------------
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Account.credit_used_cents + reserved_credit_cents would strictly exceed Account.credit_limit_cents"

roles:
  - name: MillPlanner
    description: "Schedules tufting runs, curates the style catalogue and drives cut-order fulfilment from roll-good inventory."
    identity: "opaque"
    exclusive_operations:
      - "create, activate and discontinue CarpetStyle"
      - "register TuftingMachine"
      - "schedule, load, complete-greige, back, recoat and abort ProductionRun"
      - "doff RollGood off a backed run"
      - "auto-allocate and manually allocate cut orders"
      - "cut and ship cut orders"
    shared_operations:
      - "open and amend Account (with PlantAdmin)"
      - "register DyeVessel (with DyeHouseOperator, PlantAdmin)"
      - "submit and cancel CutOrder (with DealerBuyer, PlantAdmin)"
      - "read styles, runs, dye lots, roll goods, product tests, certifications, cut orders and allocations"

  - name: ExtrusionOperator
    description: "Runs the polymer receiving dock, the reclamation line and the spinning extruders."
    identity: "opaque"
    exclusive_operations:
      - "receive PolymerLot"
      - "log ReclamationBatch and depolymerize it into a recycled PolymerLot"
      - "queue, extrude and dispose FiberBatch"
    shared_operations:
      - "read polymer lots, reclamation batches, fiber batches and roll goods"

  - name: DyeHouseOperator
    description: "Formulates piece-dye lots, charges vessels, records spectrophotometer readings and decides approve / re-dye / reject."
    identity: "opaque"
    exclusive_operations:
      - "create DyeLot and book its vessel window"
      - "start dyeing"
      - "record DyeLot measurements under optimistic concurrency"
      - "dispose a measured DyeLot (APPROVE / REDYE / REJECT)"
    shared_operations:
      - "register DyeVessel (with MillPlanner, PlantAdmin)"
      - "read styles, runs, dye lots and roll goods"

  - name: QALabTechnician
    description: "Inspects and dispositions rolls and performs wear, stain and flammability testing. Cannot issue the certificates its own tests support."
    identity: "opaque"
    exclusive_operations:
      - "release, hold or scrap a RollGood after inspection"
      - "record ProductTest results"
    shared_operations:
      - "read styles, runs, dye lots, roll goods, product tests, certifications and allocations"

  - name: CertificationOfficer
    description: "Issues and revokes DOC FF 1-70, NSF 140 and Green Label Plus certificates from lab evidence. Segregated from the technician who produced that evidence."
    identity: "opaque"
    exclusive_operations:
      - "issue Certification citing ProductTest evidence"
      - "revoke Certification"
    shared_operations:
      - "read styles, the style recycled-content computed read, polymer lots, fiber batches, product tests and certifications"

  - name: DealerBuyer
    description: "A dealer or builder account placing cut orders against its own credit line. Scoped strictly to its own account."
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "submit CutOrder (with MillPlanner, PlantAdmin)"
      - "cancel its own CutOrder (with MillPlanner, PlantAdmin)"
      - "read its own Account, its own cut orders and allocations, and the style catalogue"

  - name: PlantAdmin
    description: "Plant superuser and test harness operator; may perform any operation and is the only role that may move the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "set the logical clock via POST /mill/_clock/set_current_utc"
    shared_operations:
      - "every operation available to MillPlanner, ExtrusionOperator, DyeHouseOperator, QALabTechnician, CertificationOfficer and DealerBuyer — subject to the same segregation-of-duties and state rules"
