  # ===========================================================================
  # RULE 4 / 9 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: exemption_revocation_cascades_four_levels_to_enforcement_referral
        grounds:
          - state_machines.ExemptionCertification.APPROVED_to_REVOKED
          - state_machines.Employer.registration_status.EXEMPT_CERTIFIED_to_PENDING_REGISTRATION
          - state_machines.Employer.compliance_status.PENALIZED_to_REFERRED
          - entities.PenaltyAssessment.fields.origin
          - entities.EnforcementReferral.fields.agency
          - entities.EnforcementReferral.fields.employer_ein_snapshot
          - calculations.employer_penalty_amount
        distinguishing_aspect: |
          A four-hop chain from ONE write, crossing three entity types:
          ExemptionCertification -> REVOKED (hop 1) forces Employer.registration_status back to
          PENDING_REGISTRATION (hop 2) because the wave deadline of 2026-06-30 has already
          elapsed, which mints a SYSTEM_CASCADE FAILURE_TO_REGISTER assessment (hop 3), which
          in turn drives compliance_status to REFERRED and opens an EnforcementReferral against
          the employer's pre-existing AFFIRMED assessment (hop 4). A one-level implementation
          stops at REVOKED or at PENDING_REGISTRATION and leaves the referral table empty.
        test_recipe:
          setup:
            - "Program year 2026; Ridge Composites has 120 eligible employees, so its wave tier is WAVE_1 with registration_deadline 2026-06-30, and it has NOT registered"
            - "At clock 2026-02-01 a FAILURE_TO_ENROLL assessment is raised by officer-a with notice_date 2025-10-01 (123 days of notice, past the 90-day tier), producing statutory_amount_cents 3000000 and cure_deadline 2025-10-31, and is then AFFIRMED by a different officer (officer-b) so the employer sits at compliance_status PENALIZED with an affirmed, uncured assessment"
            - "The employer then files a qualified-plan exemption certification (401K, plan_effective_date 2026-01-01) which the program administrator APPROVES, moving registration_status to EXEMPT_CERTIFIED"
            - "Clock advanced to 2026-07-01, one day past the WAVE_1 registration deadline of 2026-06-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "77-8889990", legal_name: "Ridge Composites Corp", worksite_state: "CA", employee_count: 120 }
              as: ProgramAdministrator
              captures: { emp3_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp3_id}/penalty-assessments"
              payload: { violation_type: "FAILURE_TO_ENROLL", notice_date: "2025-10-01", cure_days: 30 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pen0_id: "$.data.id" }
            - call: "POST /penalty-assessments/${pen0_id}/disposition"
              payload: { disposition: "AFFIRM", disposition_note: "Employer did not respond to notice" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /employers/${emp3_id}/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "77-8889990", plan_effective_date: "2026-01-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp3_id}"
              captures: { cert_id: "$.data.id" }
            - call: "POST /exemption-certifications/${cert_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Plan documents verified" }
              as: ProgramAdministrator
              as_user_id: "admin-reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /exemption-certifications/${cert_id}/revoke"
              payload: { revocation_reason: "Qualified plan terminated retroactively to 2026-01-01" }
              as: ComplianceOfficer
              as_user_id: "officer-c"
          assert:
            - "ExemptionCertification.${cert_id}.status == REVOKED"
            - "Employer.${emp3_id}.registration_status == PENDING_REGISTRATION"
            - "Employer.${emp3_id}.compliance_status == REFERRED"
            - "GET /employers/${emp3_id}/penalty-assessments returns total_count == 2"
            - "exactly one returned PenaltyAssessment has origin == SYSTEM_CASCADE"
            - "the SYSTEM_CASCADE PenaltyAssessment has violation_type == FAILURE_TO_REGISTER"
            - "the SYSTEM_CASCADE PenaltyAssessment has notice_date == 2026-06-30"
            - "the SYSTEM_CASCADE PenaltyAssessment has assessed_by_user_id == SYSTEM"
            - "the SYSTEM_CASCADE PenaltyAssessment has statutory_amount_cents == 0"
            - "the SYSTEM_CASCADE PenaltyAssessment has assessed_cents == 0"
            - "the SYSTEM_CASCADE PenaltyAssessment has status == ASSESSED"
            - "PenaltyAssessment.${pen0_id}.origin == MANUAL"
            - "PenaltyAssessment.${pen0_id}.status == AFFIRMED"
            - "PenaltyAssessment.${pen0_id}.statutory_amount_cents == 3000000"
            - "PenaltyAssessment.${pen0_id}.assessed_cents == 3000000"
            - "PenaltyAssessment.${pen0_id}.cure_deadline == 2025-10-31"
            - "GET /penalty-assessments/${pen0_id}/enforcement-referrals returns total_count == 1"
            - "the returned EnforcementReferral has status == OPEN"
            - "the returned EnforcementReferral has agency == STATE_LABOR_COMMISSIONER"
            - "the returned EnforcementReferral has referred_by_user_id == SYSTEM"
            - "the returned EnforcementReferral has employer_ein_snapshot == 77-8889990"

      - name: remittance_posting_cascades_to_excess_case_and_restricted_posture
        grounds:
          - state_machines.PayrollRemittance.SUBMITTED_to_POSTED
          - entities.RemittanceLine.fields.allocated_cents
          - entities.RemittanceLine.fields.excess_cents
          - entities.ParticipantAccount.fields.ytd_contribution_cents
          - entities.ParticipantAccount.fields.posture
          - entities.ExcessContributionCase.fields.detected_excess_cents
          - calculations.participant_contribution_headroom
          - calculations.account_posture_derivation
          - calculations.employer_compliance_status_and_unremitted
        distinguishing_aspect: |
          The cascade fans out ACROSS aggregates instead of walking a single lineage: posting one
          remittance simultaneously drives its own lines to POSTED, credits the
          ParticipantAccount, exhausts headroom, materialises a brand-new
          ExcessContributionCase entity that did not exist before the write, flips the account's
          derived posture to RESTRICTED, and zeroes the Employer's unremitted_deduction_cents.
