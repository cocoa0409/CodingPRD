          - errors.ERR_CYCLE_LINE_NOT_FOUND
          - errors.ERR_ADHERENCE_EVENT_NOT_FOUND
        distinguishing_aspect: "Twelve distinct 404 ids, one per entity, are proven distinguishable in a single sweep — an implementation with one generic NOT_FOUND cannot pass, and neither can one that maps two entities to the same id."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; an empty store — no row of any entity carries the probed ids"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /pharmacy/insurance-plans/aaaaaaaa-0000-4000-8000-000000000001"
              payload: {}
              as: PharmacyOperations
              captures: { e_plan: $.data.error_id }
            - call: "GET /pharmacy/patients/aaaaaaaa-0000-4000-8000-000000000002"
              payload: {}
              as: PharmacyOperations
              captures: { e_patient: $.data.error_id }
