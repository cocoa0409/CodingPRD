            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_id}", department: "ROOMS", headcount_target: 4, wave_start_date: "2026-09-10" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { plan_rooms: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "B. Exact", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-10" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_exact: "$.data.id" }
