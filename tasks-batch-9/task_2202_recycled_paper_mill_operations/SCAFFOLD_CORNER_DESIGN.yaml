              payload: { expected_purchase_order_version: "${po_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 200"
            - "response.data.fuel_surcharge_per_ton == 3.15"
            - "response.data.quoted_unit_price_per_ton == 120.15"
            - "response.data.extended_contract_value == 1201.50"

      - name: net_tons_rounds_each_sublot_before_summing_which_moves_the_cent
        claim_type: precision
        grounds:
          - calculations.receipt_net_tons
          - calculations.receipt_net_tons.variants.per_sublot_then_sum
          - entities.FiberReceipt.fields.net_tons
          - entities.FiberReceipt.fields.moisture_deduction_tons
        distinguishing_aspect: "Three sublots each have a raw moisture deduction whose fourth decimal rounds down (0.3063, 0.2163, 0.12211), so the pinned per-sublot order gives dry tons 9.904 + 6.994 + 6.777 = 23.675 and net_tons 23.68 after the single 2dp round. Summing raw deductions first gives 23.6742877 and net_tons 23.67. One cent of separation, and moisture_deduction_tons must be the sum of the ROUNDED deductions, 0.644, not 0.645."
        test_recipe:
          setup: ["A CONFIRMED 400.00-ton OCC_11 purchase order (max_moisture_pct 12.00) receiving one truck with three sublots."]
