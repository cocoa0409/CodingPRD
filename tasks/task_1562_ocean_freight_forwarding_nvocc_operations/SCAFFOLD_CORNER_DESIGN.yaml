            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${sa}", captures: { b: $.data.id } }
