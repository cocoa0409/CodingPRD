          - state_machines.FeeStudy.ADOPTED_to_EFFECTIVE
        excluded_because:
          difficulty_instance: activation_exactly_on_the_effective_date_is_permitted
          rationale: "That instance drives the activate action at its precondition boundary in both directions (one second early rejected, exactly on effective_at accepted) and asserts the resulting side effects, which is the action-endpoint claim for the study lifecycle."

      - name: issue_co_is_allowed_only_under_its_declared_conditions
        claim_type: conditional_action
        grounds:
          - endpoints[POST /development-applications/{id}/issue-co]
          - validations[priority=32]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: certificate_of_occupancy_is_blocked_by_an_open_deferral_agreement
