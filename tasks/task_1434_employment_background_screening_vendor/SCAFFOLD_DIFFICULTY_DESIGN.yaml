            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-reports", payload: { order_id: "${o3_id}", findings: [ { check_type: CRIMINAL_COUNTY, offense_category: VIOLENT_FELONY, severity: HIGH, offense_date: "2024-06-01T00:00:00Z", disposition: CONVICTION } ] }, as: VendorAgent, as_user_id: "${v_id}", captures: { r3_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T23:59:59Z", sample_size: 10, mismatches_found: 1 }, as: Auditor, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-accuracy-audits/${a_id}/finalize", payload: {}, as: Auditor }
            - { call: "GET /screening-orders", payload: { rescreen_of_order_id: "${o1_id}" }, as: Auditor, captures: { rs1_id: "$.data[0].id" } }
            - { call: "GET /screening-orders", payload: { rescreen_of_order_id: "${o2_id}" }, as: Auditor, captures: { rs2_id: "$.data[0].id" } }
          assert:
            - "GET /vendor-accuracy-audits/${a_id}: rescreen_order_ids == [${rs1_id}, ${rs2_id}] in delivered_at ASC order (boundary-inclusive on both ends)"
            - "GET /screening-orders?rescreen_of_order_id=${o3_id} == [] (2026-08-01T00:00:00Z is outside the CLOSED window)"
            - "rescreen orders: order_type == RESCREEN, fulfillment_status == CONSENT_CAPTURED, candidate_id/position_id copied from the original"
            - "GET /vendors/${v_id}.status == PROBATION (first failed audit)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vendor_capacity_conserved_under_dispatch_cancel
        grounds:
          - calculations.active_order_count
          - state_machines.ScreeningOrder.transitions.CONSENT_CAPTURED_to_DISPATCHED
          - state_machines.ScreeningOrder.transitions.cancel
        distinguishing_aspect: |
          Conserved quantity = vendor CAPACITY SLOTS: dispatch then cancel leaves
          active_order_count identical to its pre-dispatch value
          (count(DISPATCHED orders) == active_order_count at all times).
        test_recipe:
          setup:
            - "Vendor (max_concurrent_orders 5), order CONSENT_CAPTURED at 2026-08-05T10:00:00Z"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-CI1", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-CI1", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 10000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "Analyst", department: "Ops", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Ci One", email: "ci1@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-04T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager }
            - { call: "POST /screening-orders/${o_id}/cancel", payload: {}, as: HiringManager }
          assert:
            - "GET /vendors/${v_id}.active_order_count: 0 before dispatch, 1 after dispatch, 0 after cancel (forward + compensating actions cancel out)"
            - "order ${o_id}: fulfillment_status == CANCELLED, adjudication_status == VOIDED"

      - name: vendor_receivable_conserved_under_fee_void
        grounds:
          - calculations.order_fee_cents
          - entities.ScreeningOrder.fields.provisional_fee_cents
          - entities.ScreeningOrder.fields.final_fee_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (cents), a different conserved-quantity type:
          the provisional debit of 26500 cents created at dispatch is VOIDED by the
          compensating cancel, so the vendor's aggregate receivable over non-cancelled
          orders is unchanged (0 contribution) — no fee drift.
        test_recipe:
          setup:
            - "Vendor with surcharge_cents 1500; package fee_cents 25000; order CONSENT_CAPTURED"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-CI2", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 1500 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-CI2", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 25000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "Analyst", department: "Ops", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Ci Two", email: "ci2@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-04T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager, captures: { prov: $.data.provisional_fee_cents } }
            - { call: "POST /screening-orders/${o_id}/cancel", payload: {}, as: HiringManager }
          assert:
            - "captured provisional_fee_cents at dispatch == 26500 (25000 + 1500)"
            - "GET /screening-orders/${o_id} after cancel: provisional_fee_cents == null AND final_fee_cents == null (fee fully voided)"
            - "sum of (final_fee_cents ?? provisional_fee_cents) over GET /screening-orders?vendor_id=${v_id} == 0 — receivable invariant restored"

