      - name: sweep_lapse_cascade_cancels_entries_and_obligations
        claim_type: cascading_side_effects
        grounds: ["\"endpoints.\"POST /docket-sweeps\"\"\"", "state_machines.Application.PENDING_to_LAPSED", "state_machines.AnnuityObligation.PENDING_AUTHORIZATION_to_LAPSED"]
        distinguishing_aspect: "One sweep fires the full lapse cascade end-to-end in pinned order (current_due_date ASC, created_at ASC): the overdue STATUTORY entry (due 2026-08-03) lapses first, its parent application (PENDING) lapses, and the sibling RECORDATION entry (due 2026-12-01, later in sweep order) is CANCELLED by the cascade before its turn — counted as cancelled, not lapsed; separately a PENDING_AUTHORIZATION obligation past its surcharge window lapses (superseding its REQUESTED authorization) and lapses its GRANTED application."
        test_recipe:
          setup:
            - "Clock 2026-08-01; US rule with surcharge_window_months 6; client+contact; family"
            - "App A1 PENDING with STATUTORY entry due 2026-08-03 and RECORDATION entry due 2026-12-01"
            - "App A2 GRANTED (grant 2026-03-01) whose y3 obligation (due 2028-09-01, window end 2029-03-01) has a REQUESTED authorization"
            - "Clock advanced to 2029-03-02 before the sweep"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "CasCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/contacts"
              payload: { full_name: "C A", email: "ca@x.com" }
              as: PlatformAdmin
              captures: { ct_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "CF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-C1", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { a1: $.data.id }

            - call: "POST /applications/${a1}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${a1}/docket-entries"
              payload: { entry_type: "STATUTORY", title: "bar", base_due_date: "2026-08-03" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { en_stat: $.data.id }

            - call: "POST /applications/${a1}/docket-entries"
              payload: { entry_type: "RECORDATION", title: "rec", base_due_date: "2026-12-01" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { en_rec: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-C2", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { a2: $.data.id }

            - call: "POST /applications/${a2}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${a2}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${a2}/annuity-obligations"
              as: Any
              captures: { ob_id: "$.data[0].id" }

            - call: "GET /annuity-obligations/${ob_id}"
              as: Any
              captures: { ob_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_id}/authorizations"
              payload: { amount_cents: 10000, expected_annuity_obligation_version: "${ob_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_id: $.data.id }

            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-03-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /docket-sweeps"
              payload: {}
              as: PlatformAdmin
              captures: { sw_entries: $.data.entries_lapsed, sw_obs: $.data.obligations_lapsed, sw_apps: $.data.applications_lapsed, sw_sup: $.data.obligations_superseded_authorizations }

            - call: "GET /docket-entries/${en_stat}"
              as: Any
              captures: { stat_st: $.data.status }

            - call: "GET /docket-entries/${en_rec}"
              as: Any
              captures: { rec_st: $.data.status }

            - call: "GET /annuity-obligations/${ob_id}"
              as: Any
              captures: { ob_st: $.data.status }

            - call: "GET /authorizations/${au_id}"
              as: Any
              captures: { au_st: $.data.status }

            - call: "GET /applications/${a2}"
              as: Any
              captures: { a2_st: $.data.status }

          assert:
            - "sw_entries == 1 (only the STATUTORY entry lapses; the RECORDATION entry, later in sweep order, is cancelled by the application-lapse cascade before its turn)"
            - "sw_obs == 1 (y3 obligation past surcharge_window_end 2029-03-01)"
            - "sw_apps == 2 (A1 lapses via its statutory entry; A2 lapses via its obligation)"
            - "sw_sup == 1 (the REQUESTED authorization on the lapsed obligation is superseded)"
            - "stat_st == LAPSED"
            - "rec_st == CANCELLED"
            - "ob_st == LAPSED"
            - "au_st == SUPERSEDED"
            - "a2_st == LAPSED"

