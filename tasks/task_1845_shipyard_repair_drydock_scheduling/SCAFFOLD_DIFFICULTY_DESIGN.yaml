              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_HOT_WORK_PERMIT_REQUIRED (priority-7 safety gate beats the priority-10 ERR_DEPENDENCY_NOT_MET that the incomplete dependency on ${w_a} would also produce)"

  # ===================================================================
  # Rule 6 — boundary precision on different metrics/endpoints
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: vessel_length_exactly_equal_dock_limit_fits
        grounds:
          - validations[priority=8]
          - entities.Vessel.fields.length_m
          - entities.DockBerth.fields.max_length_m
        distinguishing_aspect: |
          Metric: metres on POST /v1/dock-reservations. The fit check is inclusive
          (<=): a vessel whose length, beam, and draft each EXACTLY equal the dock's
          limits (230.0 / 40.0 / 12.0) is accepted; only a strict exceedance is
          rejected.
        test_recipe:
          setup:
            - "Dock limited to 230.0m x 40.0m x 12.0m; vessel at exactly 230.0 / 40.0 / 12.0"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MT Exact Fit", imo_number: "IMO9000002", length_m: 230.0, beam_m: 40.0, draft_m: 12.0, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-10T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_status: $.data.status }
          assert:
            - "captured r_status == BOOKED (boundary is inclusive: 230.0 <= 230.0, 40.0 <= 40.0, 12.0 <= 12.0 all pass)"
      - name: delivery_exactly_at_grace_boundary_zero_ld
        grounds:
          - calculations.calc_liquidated_damages
