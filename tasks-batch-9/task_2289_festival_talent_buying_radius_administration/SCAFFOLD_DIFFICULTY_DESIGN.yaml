            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_p3}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 500000, production_fee_cents: 0, billing_position: 4, set_length_minutes: 90, slot_start_utc: "2026-12-05T14:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 75, window_start_date: "2026-11-04", window_end_date: "2026-12-14", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { probe_far_gap: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_p4}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 500000, production_fee_cents: 0, billing_position: 5, set_length_minutes: 90, slot_start_utc: "2026-12-05T16:30:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 75, window_start_date: "2026-11-04", window_end_date: "2026-12-14", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { probe_draft_only_collision: $.data.id }
          trigger:
            - call: "POST /festival-ops/offers/${probe_gap_equals_buffer}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${probe_exact_abutment}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${probe_far_gap}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${probe_draft_only_collision}/issue"
              payload: {}
              as: TalentBuyer
          assert:
            - "${probe_gap_equals_buffer} (21:00-22:30) is accepted: 21:00 is not earlier than 20:30 + 30, so a gap of exactly the buffer clears the booking that ends at 20:30"
            - "${probe_exact_abutment} (17:30-19:00) is rejected with ERR_STAGE_SLOT_CONFLICT (409): its end abuts the booking's 19:00 start exactly, and 19:00 < 19:00 + 30 makes that a collision because the buffer is positive"
            - "the rejected ${probe_exact_abutment} stays DRAFT — it is not auto-cancelled, and DRAFT offers remain occupants of the stage line"
            - "${probe_far_gap} (14:00-15:30) is accepted: it clears the DRAFT probe at 17:30 (17:30 is not earlier than 15:30 + 30) and the booking at 19:00"
            - "${probe_draft_only_collision} (16:30-18:00) is rejected with ERR_STAGE_SLOT_CONFLICT even though it clears the booking (19:00 is not earlier than 18:00 + 30) and clears ${probe_far_gap} — its only collision is with the still-DRAFT ${probe_exact_abutment}"
            - "Stage.${stage_main_id}.booked_minutes stays 90 throughout: issuing an offer never books stage minutes, only accepting does"

      - name: radius_window_closed_interval_boundary_conflict
        grounds:
          - calculations.radius_conflict_detection
          - entities.RadiusClause.fields.window_start_date
          - entities.CompetingPerformance.fields.conflict_assessment
          - endpoints["POST /festival-ops/competing-performances"]
        distinguishing_aspect: |
          A different resource (a RadiusClause's exclusivity window around a market) with different
          interval semantics: a CLOSED date interval at day granularity, where both endpoints are
          restricted, combined with an inclusive distance predicate. Four probes pin both ends of
          the window from inside and outside, and a fifth probe inside the window but outside the
          radius shows the two predicates are conjunctive.
