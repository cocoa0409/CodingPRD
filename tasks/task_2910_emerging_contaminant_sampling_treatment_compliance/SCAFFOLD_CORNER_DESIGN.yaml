              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-16T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A2" }
              as: SamplingTechnician
              captures: { s2_id: "$.data.id" }
            - call: "POST /samples/${s2_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
