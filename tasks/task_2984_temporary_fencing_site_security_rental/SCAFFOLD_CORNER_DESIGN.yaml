          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, product PANEL-CL-10, account A and jobsite J1 all exist, so the refusals cannot be blamed on missing reference data and the OCC field carries a genuine server-issued version."
            - "The probed jobsite id 00000000-0000-4000-8000-0000000000a1 belongs to nothing: J1 has a different id."
            - "Each trigger is issued twice by the harness: once with the X-User-ID header omitted entirely and once with it present but set to the empty string \"\" (never a whitespace-only value)."
