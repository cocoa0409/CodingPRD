      - name: loaner_windows_allow_adjacency_but_reject_overlap
        grounds:
          - validations.v-loaner-overlap
          - entities.LoanerAssignment.fields.window_start
          - entities.LoanerAssignment.fields.window_end
          - entities.LoanerUnit.fields.assignment_count
          - errors.ERR_LOANER_DOUBLE_BOOKED
        distinguishing_aspect: |
          The same overlap question on a different resource with the opposite
          interval convention: LoanerAssignment windows are HALF-OPEN, so
          [08-05, 08-12) and [08-12, 08-19) on the same loaner are legal
          back-to-back bookings, while [08-11, 08-18) overlaps the first by one
          day and must fail with ERR_LOANER_DOUBLE_BOOKED. Reusing the bench's
          closed-plus-cooldown logic here would reject the legal adjacency.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one CustomerAccount with liability_waiver_status ON_FILE and status ACTIVE"
            - "one AVAILABLE LoanerUnit of ModelSpec SF-2026, grade A, certification_valid_until 2026-12-31"
            - "one existing RESERVED LoanerAssignment on that loaner for [2026-08-05, 2026-08-12)"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /loaner-units"
              payload: { model_spec_id: "${model_id}", asset_tag: "LN-001", condition_grade: "A", certification_valid_until: "2026-12-31T00:00:00Z" }
              as: PlantManager
              captures: { loaner_id: $.data.id }
            - call: "POST /loaner-assignments"
              payload: { customer_account_id: "${acct_id}", requested_model_spec_id: "${model_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-12T00:00:00Z", loaner_unit_id: "${loaner_id}" }
              as: IntakeClerk
              captures: { asg_a_id: $.data.id }
          trigger:
            - call: "POST /loaner-assignments"
              payload: { customer_account_id: "${acct_id}", requested_model_spec_id: "${model_id}", window_start: "2026-08-12T00:00:00Z", window_end: "2026-08-19T00:00:00Z", loaner_unit_id: "${loaner_id}" }
              as: IntakeClerk
              captures: { asg_b_id: $.data.id }
            - call: "POST /loaner-assignments"
              payload: { customer_account_id: "${acct_id}", requested_model_spec_id: "${model_id}", window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-18T00:00:00Z", loaner_unit_id: "${loaner_id}" }
              as: IntakeClerk
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the adjacent [2026-08-12, 2026-08-19) booking returns HTTP 201"
            - "LoanerAssignment.${asg_b_id}.status == RESERVED"
            - "LoanerAssignment.${asg_b_id}.selected_by == EXPLICIT"
            - "LoanerAssignment.${asg_b_id}.loaner_unit_id == ${loaner_id}"
            - "the overlapping [2026-08-11, 2026-08-18) booking returns HTTP 409 with error_id ERR_LOANER_DOUBLE_BOOKED"
            - "GET /loaner-assignments?loaner_unit_id=${loaner_id} returns exactly 2 records"
            - "LoanerUnit.${loaner_id}.assignment_count == 2"
            - "LoanerUnit.${loaner_id}.status == RESERVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: part_stock_buckets_sum_to_received_across_reserve_install_cancel
        grounds:
          - calculations.part_stock_ledger
          - entities.ApprovedPart.fields.on_hand_qty
          - entities.ApprovedPart.fields.reserved_qty
          - entities.ApprovedPart.fields.consumed_qty
          - state_machines.RepairOrder.status.PARTS_PENDING_to_CANCELLED
        distinguishing_aspect: |
          Invariant: on_hand_qty + reserved_qty + consumed_qty == received_qty
          (10) after every single write. The path 10/0/0 -> submit 4 -> 6/4/0 ->
          install -> 6/0/4 -> submit 6 -> 0/6/4 -> cancel -> 6/0/4 forces the
          cancel to return reserved stock to the shelf WITHOUT touching the 4
          already consumed by the installed order; implementations that reset
          reserved to zero without crediting on_hand, or that credit the
          consumed quantity back, break the sum at the final step.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one ApprovedPart for SHELL with received_qty 10, unit_price_cents 4500"
            - "one unit in REPAIR_PENDING after a REPAIR determination"
            - "RepairOrder A submitted (4 reserved) and then installed (4 consumed), leaving 6/0/4"
            - "RepairOrder B submitted on the same unit reserving the remaining 6, leaving 0/6/4"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /approved-parts"
              payload: { model_spec_id: "${model_id}", part_number: "PN-SHELL-1", component_code: "SHELL", oem_approved: true, unit_price_cents: 4500, received_qty: 10 }
              as: PlantManager
              captures: { part_id: $.data.id }
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
            - *c_bench
            - *c_cal
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
            - call: "POST /shell-tests/${t1_id}/record-impacts"
              payload: { peak_g_front: 300, peak_g_side: 340, peak_g_crown: 290 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /shell-tests/${t1_id}/determine"
              payload: { determination: "REPAIR" }
              as: CertifyingInspector
              as_user_id: "insp-1"
            - call: "GET /equipment-units/${u1_id}"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
              captures: { u1_v: $.data.version }
            - call: "POST /repair-orders"
              payload: { equipment_unit_id: "${u1_id}", expected_equipment_unit_version: "${u1_v}" }
              as: Technician
              as_user_id: "tech-1"
              captures: { ro_a_id: $.data.id }
            - call: "POST /repair-orders/${ro_a_id}/part-lines"
              payload: { approved_part_id: "${part_id}", quantity: 4, lot_code: "LOT-A", oem_cert_ref: "OEM-A-1" }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /repair-orders/${ro_a_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /repair-orders/${ro_a_id}/install"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "GET /equipment-units/${u1_id}"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
              captures: { u1_v2: $.data.version }
            - call: "POST /repair-orders"
              payload: { equipment_unit_id: "${u1_id}", expected_equipment_unit_version: "${u1_v2}" }
              as: Technician
              as_user_id: "tech-1"
              captures: { ro_b_id: $.data.id }
            - call: "POST /repair-orders/${ro_b_id}/part-lines"
              payload: { approved_part_id: "${part_id}", quantity: 6, lot_code: "LOT-B", oem_cert_ref: "OEM-B-1" }
              as: Technician
              as_user_id: "tech-1"
