scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: capital_need_planning_vs_filing_diverge
        grounds:
          - calculations.capital_need_estimate
          - entities.ConditionAssessment.fields.planning_estimate_cents
          - entities.ConditionAssessment.fields.filing_estimate_cents
        distinguishing_aspect: |
          Two variants of capital_need_estimate on the SAME assessment data produce
          different totals: planning sums raw cost_low_cents with a 10% contingency
          (165000 cents for the pinned items) while filing sums per-item rounded
          midpoints with a 15% contingency (172502 cents) — a different entity
          domain (ConditionAssessment) than the rate_base_admission instance.
        test_recipe:
          setup:
            - "Target T in SCREENING; assessment A in SUBMITTED with two capital items: item1 (low=100000, high=100001), item2 (low=50000, high=50002)"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T1", municipality_name: "M1", state_code: "PA", system_type: "WATER", customer_count: 100, permitted_valuation_methods: ["FMV_INDEPENDENT", "REPLACEMENT_COST"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "survey" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "DISTRIBUTION", horizon: "IMMEDIATE", description: "main replacement", cost_low_cents: 100000, cost_high_cents: 100001, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "TREATMENT", horizon: "SHORT_TERM", description: "plant rehab", cost_low_cents: 50000, cost_high_cents: 50002, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { plan_c: $.data.planning_estimate_cents, file_c: $.data.filing_estimate_cents }
          trigger:
            - call: "GET /acquisitions/assessments/${a_id}"
              payload: {}
              as: AcquisitionAnalyst
          assert:
            - "ConditionAssessment.${a_id}.planning_estimate_cents == 165000 (sum of lows 150000 * 1.10)"
            - "ConditionAssessment.${a_id}.filing_estimate_cents == 172502 (per-item midpoints 100001+50001=150002 * 1.15 = 172502.3 -> 172502)"
            - "ConditionAssessment.${a_id}.planning_estimate_cents != ConditionAssessment.${a_id}.filing_estimate_cents"

      - name: rate_base_as_paid_vs_depreciated_diverge
        grounds:
          - calculations.rate_base_admission
          - entities.RegulatoryApplication.fields.admitted_rate_base_cents
        distinguishing_aspect: |
          Two identical applications (same purchase price, same selected value) admitted
          under AS_PAID vs DEPRECIATED_ORIGINAL_COST produce different admitted rate base:
          AS_PAID caps at selected_value + 10% premium (105000000 admitted, 0 disallowed)
          while DEPRECIATED caps at the seller's net book cost (90000000 admitted,
          15000000 disallowed) — a different entity domain (RegulatoryApplication) than
          the capital_need_estimate instance.
        test_recipe:
          setup:
            - "Target T in REGULATORY_REVIEW with selected_value_cents=100000000, filing_estimate_cents=172502, council_approved=true; two applications A1 (AS_PAID) and A2 (DEPRECIATED_ORIGINAL_COST, OCLD=90000000), both purchase_price=105000000; A1 decided APPROVED then a second target T2 is driven to the same state for A2 (one FILED application per target at a time)"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T1", municipality_name: "M1", state_code: "PA", system_type: "WATER", customer_count: 100, permitted_valuation_methods: ["FMV_INDEPENDENT", "REPLACEMENT_COST"] }
              as: AcquisitionAnalyst
              captures: { t1: $.data.id }
            - call: "POST /acquisitions/targets/${t1}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a1: $.data.id }
            - call: "POST /acquisitions/assessments/${a1}/capital-items"
              payload: { category: "DISTRIBUTION", horizon: "IMMEDIATE", description: "d", cost_low_cents: 100000, cost_high_cents: 100001, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a1}/capital-items"
              payload: { category: "TREATMENT", horizon: "SHORT_TERM", description: "d", cost_low_cents: 50000, cost_high_cents: 50002, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a1}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a1}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t1}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t1_v: $.data.version }
            - call: "POST /acquisitions/targets/${t1}/valuation-cases"
              payload: { expected_target_version: "${t1_v}" }
              as: AcquisitionAnalyst
              captures: { c1: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c1}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 100000000, law_citation: "66 Pa.C.S. 1329" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e1: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c1}/finalize"
              payload: { select_entry_id: "${e1}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t1}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h1: $.data.id }
            - call: "POST /acquisitions/council-events/${h1}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t1}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-10T03:00:00Z", scheduled_end: "2026-09-10T04:00:00Z" }
              as: MunicipalClerk
              captures: { v1: $.data.id }
            - call: "POST /acquisitions/council-events/${v1}/record-outcome"
              payload: { yes_votes: 3, no_votes: 2 }
              as: MunicipalClerk
            - call: "POST /acquisitions/targets/${t1}/regulatory-applications"
              payload: { purchase_price_cents: 105000000, rate_base_method: "AS_PAID" }
              as: RegulatoryOfficer
              captures: { r1: $.data.id }
            - call: "POST /acquisitions/regulatory-applications/${r1}/decide"
              payload: { outcome: "APPROVED" }
              as: Commissioner
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T2", municipality_name: "M2", state_code: "PA", system_type: "WATER", customer_count: 100, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t2: $.data.id }
            - call: "POST /acquisitions/targets/${t2}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a2: $.data.id }
            - call: "POST /acquisitions/assessments/${a2}/capital-items"
              payload: { category: "DISTRIBUTION", horizon: "IMMEDIATE", description: "d", cost_low_cents: 100000, cost_high_cents: 100001, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a2}/capital-items"
              payload: { category: "TREATMENT", horizon: "SHORT_TERM", description: "d", cost_low_cents: 50000, cost_high_cents: 50002, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a2}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a2}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t2}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t2_v: $.data.version }
            - call: "POST /acquisitions/targets/${t2}/valuation-cases"
              payload: { expected_target_version: "${t2_v}" }
              as: AcquisitionAnalyst
              captures: { c2: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c2}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 100000000, law_citation: "66 Pa.C.S. 1329" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e2: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c2}/finalize"
              payload: { select_entry_id: "${e2}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t2}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-11T00:00:00Z", scheduled_end: "2026-09-11T02:00:00Z" }
              as: MunicipalClerk
              captures: { h2: $.data.id }
            - call: "POST /acquisitions/council-events/${h2}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-19T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t2}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-19T03:00:00Z", scheduled_end: "2026-09-19T04:00:00Z" }
              as: MunicipalClerk
              captures: { v2: $.data.id }
            - call: "POST /acquisitions/council-events/${v2}/record-outcome"
              payload: { yes_votes: 3, no_votes: 2 }
              as: MunicipalClerk
          trigger:
            - call: "POST /acquisitions/targets/${t2}/regulatory-applications"
              payload: { purchase_price_cents: 105000000, rate_base_method: "DEPRECIATED_ORIGINAL_COST", original_cost_less_depreciation_cents: 90000000 }
              as: RegulatoryOfficer
              captures: { r2: $.data.id }
            - call: "POST /acquisitions/regulatory-applications/${r2}/decide"
              payload: { outcome: "APPROVED" }
              as: Commissioner
          assert:
            - "RegulatoryApplication.${r1}.admitted_rate_base_cents == 105000000 (AS_PAID: min(105000000, 100000000+10000000, 172502+110000000))"
            - "RegulatoryApplication.${r1}.disallowed_premium_cents == 0"
            - "RegulatoryApplication.${r2}.admitted_rate_base_cents == 90000000 (DEPRECIATED: min(105000000, 90000000))"
            - "RegulatoryApplication.${r2}.disallowed_premium_cents == 15000000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: capital_need_per_line_rounding_order
        grounds:
          - calculations.capital_need_estimate
        distinguishing_aspect: |
          Mode (b) nested rounding: two items each with (low+high) odd halves — per-line
          round_half_up of each midpoint (100001 + 100001 = 200002) then contingency gives
          filing 230002, whereas summing raw halves first (200001.0) would give a different
          midpoint total; the scaffold pins per-line rounding THEN summation.
        test_recipe:
          setup:
            - "Target T in SCREENING; assessment A in SUBMITTED with two identical items (low=100000, high=100001)"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WASTEWATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "COLLECTION", horizon: "IMMEDIATE", description: "d1", cost_low_cents: 100000, cost_high_cents: 100001, crews_required: 1 }
              as: AcquisitionAnalyst
              captures: { i1: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "COLLECTION", horizon: "IMMEDIATE", description: "d2", cost_low_cents: 100000, cost_high_cents: 100001, crews_required: 1 }
              as: AcquisitionAnalyst
              captures: { i2: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "GET /acquisitions/assessments/${a_id}"
              payload: {}
              as: AcquisitionAnalyst
          assert:
            - "CapitalNeedItem.${i1}.midpoint_estimate_cents == 100001 (round_half_up(200001/2) per line)"
            - "CapitalNeedItem.${i2}.midpoint_estimate_cents == 100001"
            - "ConditionAssessment.${a_id}.filing_estimate_cents == 230002 (200002 * 1.15 = 230002.30 -> 230002)"
            - "ConditionAssessment.${a_id}.planning_estimate_cents == 220000 (200000 * 1.10)"

      - name: rate_base_nested_min_branch_selection
        grounds:
          - calculations.rate_base_admission
        distinguishing_aspect: |
          Mode (a) combinatorial formula: admission result depends on >=3 inputs
          (purchase_price, selected_value, filing_estimate) through nested min() with a
          conditional branch on rate_base_method; pinning price ABOVE the premium cap makes
          the cap bind (admitted = selected_value + 10% cap = 110000000, disallowed
          = 5000000) — a distinct input region from the diverge instance where the price
          itself binds.
        test_recipe:
          setup:
            - "Target T in REGULATORY_REVIEW with selected_value_cents=100000000, filing_estimate_cents=172502, council_approved=true; application purchase_price=115000000, rate_base_method=AS_PAID"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 100, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "DISTRIBUTION", horizon: "IMMEDIATE", description: "d", cost_low_cents: 100000, cost_high_cents: 100001, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "TREATMENT", horizon: "SHORT_TERM", description: "d", cost_low_cents: 50000, cost_high_cents: 50002, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 100000000, law_citation: "66 Pa.C.S. 1329" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h_id: $.data.id }
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-10T03:00:00Z", scheduled_end: "2026-09-10T04:00:00Z" }
              as: MunicipalClerk
              captures: { v_id: $.data.id }
            - call: "POST /acquisitions/council-events/${v_id}/record-outcome"
              payload: { yes_votes: 3, no_votes: 2 }
              as: MunicipalClerk
            - call: "POST /acquisitions/targets/${t_id}/regulatory-applications"
              payload: { purchase_price_cents: 115000000, rate_base_method: "AS_PAID" }
              as: RegulatoryOfficer
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/regulatory-applications/${r_id}/decide"
              payload: { outcome: "APPROVED" }
              as: Commissioner
          assert:
            - "RegulatoryApplication.${r_id}.admitted_rate_base_cents == 110000000 (premium cap binds: min(115000000, 100000000+10000000, 172502+110000000))"
            - "RegulatoryApplication.${r_id}.disallowed_premium_cents == 5000000"
            - "RegulatoryApplication.${r_id}.status == APPROVED"
            - "AcquisitionTarget.${t_id}.status == CLOSING"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_revision_loop
        grounds:
          - state_machines.ConditionAssessment.SUBMITTED_to_DRAFT
          - state_machines.ConditionAssessment.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          ConditionAssessment runs a cyclic revision loop DRAFT -> SUBMITTED -> DRAFT ->
          SUBMITTED with revision_count tracking the cycles — a cyclic machine on a
          different entity than the RegulatoryApplication remand cycle.
        test_recipe:
          setup:
            - "Target T in SCREENING; assessment A with one capital item, submitted then rejected once (revision_count=1, status DRAFT)"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "STORAGE", horizon: "LONG_TERM", description: "tank", cost_low_cents: 7000, cost_high_cents: 9000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/reject"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
          trigger:
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
          assert:
            - "ConditionAssessment.${a_id}.status == SUBMITTED after the second submit"
            - "ConditionAssessment.${a_id}.revision_count == 1"
            - "AcquisitionTarget.${t_id}.status == SCREENING (reject loop never advanced the target)"

      - name: regulatory_application_remand_refile_cycle
        grounds:
          - state_machines.RegulatoryApplication.FILED_to_REMANDED
          - state_machines.RegulatoryApplication.REMANDED_to_FILED
          - concurrency_rules[regulatory-refile-stale-target]
        distinguishing_aspect: |
          RegulatoryApplication cycles FILED -> REMANDED -> FILED with filing_round
          incrementing and the refile guarded by OCC on the target version — a cyclic
          machine on a different entity than ConditionAssessment.
        test_recipe:
          setup:
            - "Target T in REGULATORY_REVIEW with council_approved=true and one FILED application R (purchase 105000000, AS_PAID); R then REMANDED by the commissioner"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 100, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "SOURCE", horizon: "IMMEDIATE", description: "well", cost_low_cents: 40000, cost_high_cents: 60000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 100000000, law_citation: "66 Pa.C.S. 1329" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h_id: $.data.id }
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-10T03:00:00Z", scheduled_end: "2026-09-10T04:00:00Z" }
              as: MunicipalClerk
              captures: { v_id: $.data.id }
            - call: "POST /acquisitions/council-events/${v_id}/record-outcome"
              payload: { yes_votes: 3, no_votes: 2 }
              as: MunicipalClerk
            - call: "POST /acquisitions/targets/${t_id}/regulatory-applications"
              payload: { purchase_price_cents: 105000000, rate_base_method: "AS_PAID" }
              as: RegulatoryOfficer
              captures: { r_id: $.data.id }
            - call: "POST /acquisitions/regulatory-applications/${r_id}/decide"
              payload: { outcome: "REMANDED" }
              as: Commissioner
          trigger:
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: RegulatoryOfficer
              captures: { t_v2: $.data.version }
            - call: "POST /acquisitions/regulatory-applications/${r_id}/refile"
              payload: { expected_target_version: "${t_v2}", purchase_price_cents: 100000000, rate_base_method: "AS_PAID" }
              as: RegulatoryOfficer
          assert:
            - "RegulatoryApplication.${r_id}.status == FILED"
            - "RegulatoryApplication.${r_id}.filing_round == 2"
            - "RegulatoryApplication.${r_id}.purchase_price_cents == 100000000"
            - "AcquisitionTarget.${t_id}.status == REGULATORY_REVIEW"

  # ===========================================================================
  # Rule 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: council_hard_fail_full_rejection_cascade
        grounds:
          - state_machines.AcquisitionTarget.MUNICIPAL_REVIEW_to_REJECTED
          - state_machines.ValuationCase.OPEN_to_SUPERSEDED
          - state_machines.TransitionItem.PENDING_to_BLOCKED
          - state_machines.EmployeeTransition.PENDING_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 cascade: recording a hard-fail COUNCIL_VOTE mutates CouncilEvent
          (hop 1), which flips the AcquisitionTarget to REJECTED (hop 2), which
          SUPERSEDES the valuation case AND BLOCKS transition items (hop 3a), and the
          target rejection in turn WITHDRAWS pending employee offers (hop 3b) — a
          different trigger than the assessment-acceptance cascade.
        test_recipe:
          setup:
            - "Target T in MUNICIPAL_REVIEW with FINALIZED valuation case (entry SELECTED), 4 PENDING transition items, 1 PENDING employee, a HELD hearing satisfying notice, and a SCHEDULED council vote"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "COMBINED", customer_count: 500, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 2000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "66 Pa.C.S. 1329" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/employee-transitions"
              payload: { employee_ref: "E1", years_of_service: 3, weekly_salary_cents: 100000, union_covered: false }
              as: HRDirector
              captures: { emp_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h_id: $.data.id }
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-10T03:00:00Z", scheduled_end: "2026-09-10T04:00:00Z" }
              as: MunicipalClerk
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/council-events/${v_id}/record-outcome"
              payload: { yes_votes: 2, no_votes: 5 }
              as: MunicipalClerk
          assert:
            - "CouncilEvent.${v_id}.status == FAILED (yes_share 28.57 < 50.00 hard fail)"
            - "AcquisitionTarget.${t_id}.status == REJECTED"
            - "ValuationCase.${c_id}.status == SUPERSEDED"
            - "ValuationEntry.${e_id}.status == NOT_SELECTED"
            - "All four TransitionItem of ${t_id} have status == BLOCKED"
            - "EmployeeTransition.${emp_id}.status == WITHDRAWN"
            - "EmployeeTransition.${emp_id}.severance_cents == 0"

      - name: assessment_acceptance_supersede_and_advance_cascade
        grounds:
          - state_machines.ConditionAssessment.SUBMITTED_to_ACCEPTED
          - state_machines.AcquisitionTarget.SCREENING_to_VALUATION
        distinguishing_aspect: |
          Depth-2 cascade: accepting assessment A2 (hop 1, assessment mutation) triggers
          both the target advancing SCREENING -> VALUATION and the previously ACCEPTED
          assessment A1 flipping to SUPERSEDED (hop 2 consequences of the acceptance) —
          a different originating trigger (assessment accept) than the council-failure
          cascade.
        test_recipe:
          setup:
            - "Target T in VALUATION with assessment A1 ACCEPTED; second assessment A2 in SUBMITTED"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "first" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a1: $.data.id }
            - call: "POST /acquisitions/assessments/${a1}/capital-items"
              payload: { category: "STORAGE", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a1}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a1}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "second" }
              as: AcquisitionAnalyst
              as_user_id: analyst-2
              captures: { a2: $.data.id }
            - call: "POST /acquisitions/assessments/${a2}/capital-items"
              payload: { category: "STORAGE", horizon: "SHORT_TERM", description: "d", cost_low_cents: 3000, cost_high_cents: 3000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a2}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-2
          trigger:
            - call: "POST /acquisitions/assessments/${a2}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
          assert:
            - "ConditionAssessment.${a2}.status == ACCEPTED"
            - "ConditionAssessment.${a1}.status == SUPERSEDED"
            - "AcquisitionTarget.${t_id}.status == VALUATION"
            - "AcquisitionTarget.${t_id}.filing_estimate_cents == 3450 (3000 * 1.15)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: split_invalid_state_beats_invalid_split
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: |
          Category pair state (p5) vs business_fiscal (p13): a split request on an item
          whose assessment is SUBMITTED (not DRAFT) with out-of-range split amounts
          violates both rules in one request; priority 5 wins and the response must be
          ERR_INVALID_STATE, not ERR_INVALID_SPLIT.
        test_recipe:
          setup:
            - "Target T; assessment A in SUBMITTED with item I (low=1000, high=2000)"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 2000, crews_required: 1 }
              as: AcquisitionAnalyst
              captures: { i_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "POST /acquisitions/capital-items/${i_id}/split"
              payload: { split_low_cents: 5000, split_high_cents: 9000 }
              as: AcquisitionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (assessment not DRAFT; p5 state beats p13 fiscal range check)"
            - "CapitalNeedItem.${i_id}.status == PLANNED (unchanged)"

      - name: event_overlap_beats_referendum_availability
        grounds:
          - validations[priority=7]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair business_temporal (p7) vs business_referential (p11): creating a
          REFERENDUM whose window overlaps an existing event AND with no qualifying failed
          council vote violates both; priority 7 wins and the response must be
          ERR_EVENT_OVERLAP, not ERR_REFERENDUM_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "Target T in MUNICIPAL_REVIEW with one existing CouncilEvent window 2026-09-02T00:00:00Z..2026-09-02T02:00:00Z and no recorded council vote"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
          trigger:
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "REFERENDUM", scheduled_start: "2026-09-02T01:00:00Z", scheduled_end: "2026-09-02T03:00:00Z" }
              as: MunicipalClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EVENT_OVERLAP (p7 temporal beats p11 referendum-availability)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: council_vote_exactly_60_passes
        grounds:
          - calculations.vote_outcome
          - state_machines.CouncilEvent.SCHEDULED_to_PASSED
        distinguishing_aspect: |
          Boundary metric: council yes_share_pct. COUNCIL_PASS_PCT uses >= : a vote of
          3/5 = exactly 60.00 passes, while 59.99 would fail into the referendum band.
          Reached via the record-outcome endpoint — a different metric (vote share) and
          endpoint than the severance instance.
        test_recipe:
          setup:
            - "Target T in MUNICIPAL_REVIEW with HELD hearing satisfying the 7-day notice and a SCHEDULED council vote"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h_id: $.data.id }
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-10T03:00:00Z", scheduled_end: "2026-09-10T04:00:00Z" }
              as: MunicipalClerk
              captures: { v_id: $.data.id }
          trigger:
