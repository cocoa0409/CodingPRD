            - "Zone Z1. Pod P1 slot_capacity 5; SKU1 with 10 units. PickStation ST1 max_queue=2. Three orders O1,O2,O3 each with line qty 1. PT1 sequenced OK (queue=1). PT2 sequenced OK (queue=2 == max_queue)."
