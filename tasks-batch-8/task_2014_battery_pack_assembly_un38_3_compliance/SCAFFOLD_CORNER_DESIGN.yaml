# =============================================================================
# §1.9 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerates every testable claim the scaffold's §1.1–§1.7 surface declares
# that §1.8 does not already cover. Organized per claim-extraction-guide.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: integration_program_creation_defaults_applied
        claim_type: creation_with_defaults
        grounds: [entities.IntegrationProgram]
        distinguishing_aspect: |
          Creating a program with only the required inputs must initialize
          compliance_risk_index=100, wh_committed=0, recall_count=0, status=OPEN,
          version=1, and a server-minted UUID id with no type prefix.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-Z1", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id, risk: $.data.compliance_risk_index, committed: $.data.wh_committed, rc: $.data.recall_count, st: $.data.status, v: $.data.version }
          trigger: []
          assert:
            - "IntegrationProgram.${prog_id}.compliance_risk_index == 100"
            - "IntegrationProgram.${prog_id}.wh_committed == 0"
            - "IntegrationProgram.${prog_id}.wh_available == 5000"
            - "IntegrationProgram.${prog_id}.recall_count == 0"
            - "IntegrationProgram.${prog_id}.status == OPEN"
            - "IntegrationProgram.${prog_id}.version == 1"

      - name: integration_program_get_by_id_returns_persisted
        claim_type: retrieval
        grounds: [entities.IntegrationProgram, endpoints]
        distinguishing_aspect: "GET /integration-programs/{id} returns the created program with matching program_code."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-Z2", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /api/integration-programs/${prog_id}"
              payload: {}
              as: Any
          assert:
            - "GET returns program_code == PRG-Z2"

      - name: integration_program_get_missing_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_PROGRAM_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/integration-programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_FOUND"

      - name: integration_program_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: |
          GET /integration-programs with limit/offset returns the standard
          envelope: meta.api_request_id, response_type=array, data as list, and
          pagination fields limit/offset/total_count/has_more.
        test_recipe:
          setup: ["three programs created"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-P1", storage_capacity_wh: 5000 }
              as: SafetyOfficer
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-P2", storage_capacity_wh: 5000 }
              as: SafetyOfficer
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-P3", storage_capacity_wh: 5000 }
              as: SafetyOfficer
          trigger:
            - call: "GET /api/integration-programs?limit=2&offset=1"
              payload: {}
              as: Any
          assert:
            - "response envelope has meta.api_request_id"
            - "response_type == array"
            - "data is array of length 2"
            - "pagination: limit=2, offset=1, total_count=3, has_more=false"

      - name: cell_lot_required_fields_enforced
        claim_type: required_fields
        grounds: [entities.CellLot]
        distinguishing_aspect: "POST /cell-lots missing cell_count returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-Z3", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-X", rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: pack_bom_nominal_energy_computed
        claim_type: computed_fields
        grounds: [entities.PackBOM.fields.nominal_energy_wh]
        distinguishing_aspect: |
          nominal_energy_wh = cells_required * rated_capacity_mah * 3.6 / 1000
          (2 decimals). With cells_required=4 and rated=3000 mAh → 43.20 Wh.
        test_recipe:
          setup: ["program + ACCEPTED lot"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-Z4", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-Z4", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-Z4", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, energy: $.data.nominal_energy_wh }
          assert:
            - "PackBOM.${bom_id}.nominal_energy_wh == 43.20"

      - name: cell_inspection_record_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.CellInspectionRecord]
        distinguishing_aspect: "CellInspectionRecord has common_fields=false and no PUT/PATCH endpoint in §1.5 — confirming immutability."
        excluded_because:
          difficulty_instance: cell_lot_cyclic_retest_loop_bounded
          rationale: "Covered indirectly — the cyclic test exercises 3 immutable inspection records; no PUT/PATCH on inspections is declared in §1.5, so immutability is structurally asserted by endpoint absence."

      - name: battery_pack_serial_number_format
        claim_type: system_fields
        grounds: [entities.BatteryPack.fields.serial_number]
        distinguishing_aspect: "serial_number matches SN-<program_code>-<6-digit zero-padded> format and is system-minted."
        test_recipe:
          setup: ["program + ACCEPTED lot + BOM"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-Z5", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-Z5", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-Z5", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { sn: $.data.serial_number }
          assert:
            - "BatteryPack.serial_number matches regex ^SN-PRG-Z5-[0-9]{6}$"

      - name: enum_field_rejects_invalid_value
        claim_type: type_constraints
        grounds:
          - entities.PackBOM.fields.welding_profile
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "POST /pack-boms with welding_profile=WELD_PROFILE_XYZ returns ERR_INVALID_ENUM."
        test_recipe:
          setup: ["program + ACCEPTED lot"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-Z6", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-Z6", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-Z6", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_XYZ" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ENUM"

      - name: cell_lot_parent_relationship_enforced_via_program_404
        claim_type: parent_relationships
        grounds: [entities.CellLot.parent]
        distinguishing_aspect: "POST /integration-programs/{badId}/cell-lots returns ERR_PROGRAM_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/integration-programs/00000000-0000-0000-0000-000000000000/cell-lots"
              payload: { lot_code: "L", cell_count: 10, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: program_initial_state_open
        claim_type: initial_state
        grounds: [state_machines.IntegrationProgram]
        distinguishing_aspect: "A newly created program has status=OPEN."
        excluded_because:
          difficulty_instance: storage_wh_invariant_stage_then_release_returns_to_zero
          rationale: "That instance's first assert chain creates a program and proceeds assuming OPEN; the invariant assert confirms OPEN by virtue of subsequent operations succeeding."

      - name: program_close_blocked_with_unresolved_packs
        claim_type: precondition_enforcement
        grounds:
          - state_machines.IntegrationProgram.OPEN_to_CLOSED
          - errors[ERR_UNRESOLVED_PACKS_REMAIN]
        distinguishing_aspect: "POST /close on a program with a pack in BUILT assembly_status returns ERR_UNRESOLVED_PACKS_REMAIN."
        test_recipe:
          setup: ["program + ACCEPTED lot + BOM + pack at BUILT"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-SM1", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-SM1", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-SM1", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/close"
              payload: {}
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNRESOLVED_PACKS_REMAIN"

      - name: program_suspend_gates_child_creation
        claim_type: precondition_enforcement
        grounds:
          - state_machines.IntegrationProgram.OPEN_to_SUSPENDED
          - errors[ERR_PROGRAM_NOT_OPEN]
        distinguishing_aspect: "After POST /suspend, POST /cell-lots returns ERR_PROGRAM_NOT_OPEN."
        test_recipe:
          setup: ["program created then suspended"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-SM2", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/suspend"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "L", cell_count: 10, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_OPEN"

      - name: cell_lot_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CellLot]
        distinguishing_aspect: "A DEPLETED CellLot rejects any further inspection or quarantine call with ERR_LOT_NOT_IN_QUARANTINE / ERR_LOT_NOT_RECEIVED respectively."
        test_recipe:
          setup: ["Program; lot ACCEPTED with cell_count=4; BOM consumes 4 cells → lot auto-DEPLETED"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-SM3", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-SM3", cell_count: 4, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-SM3", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
          trigger:
            # After consuming all 4 cells (cells_required=4, lot had 4), lot should be DEPLETED
            # Try to quarantine — should fail because lot is DEPLETED, not RECEIVED
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOT_NOT_RECEIVED"
            - "CellLot.${lot_id}.status == DEPLETED"

      - name: battery_pack_invalid_from_state_on_weld_record
        claim_type: invalid_transition
        grounds:
          - state_machines.BatteryPack.BUILT_to_WELD_RECORDED
          - errors[ERR_PACK_NOT_BUILT]
        distinguishing_aspect: "POST welding-records against a pack already at WELD_RECORDED returns ERR_PACK_NOT_BUILT."
        test_recipe:
          setup: ["pack PK at WELD_RECORDED (one weld already recorded)"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-SM4", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-SM4", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-SM4", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 4, current_amps: 50.0, pulse_ms: 10, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PACK_NOT_BUILT"

      - name: firmware_deprecate_blocked_when_pack_in_use
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BMSFirmware.APPROVED_to_DEPRECATED
          - errors[ERR_FIRMWARE_IN_USE]
        distinguishing_aspect: "Deprecate on a firmware referenced by a pack in TEST_QUEUED returns ERR_FIRMWARE_IN_USE."
        test_recipe:
          setup: ["Program; lot; BOM; pack PK driven to TEST_QUEUED with firmware FW"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-SM5", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-SM5", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-SM5", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records/${wr_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
