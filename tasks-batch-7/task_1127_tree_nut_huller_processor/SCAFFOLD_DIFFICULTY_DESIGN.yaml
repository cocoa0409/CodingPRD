              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 3500, shell_out_lbs: 1500, hull_out_lbs: 900 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.80, size_spec: "SPEC_23_25" }
              as: LabTechnician
            - call: "POST /bins"
              payload: { bin_code: "B-1", capacity_lbs: 8000, allowed_product_forms: ["KERNEL"] }
              as: PlantAdmin
              captures: { bin1: $.data.id }
            - call: "POST /placements"
              payload: { bin_id: "${bin1}", lot_id: "${lot1}", product_form: "KERNEL", quantity_lbs: 3000 }
              as: PlantOperator
            - call: "POST /buyers"
              payload: { name: "Acme Snacks", buyer_code: "AC-1" }
              as: PlantAdmin
              captures: { by1: $.data.id }
            - call: "POST /contracts"
              payload: { buyer_id: "${by1}", product_form: "KERNEL", size_spec: "SPEC_25_27", max_defects_pct: 0.05, price_cents_per_lb: 300, required_qty_lbs: 2000 }
