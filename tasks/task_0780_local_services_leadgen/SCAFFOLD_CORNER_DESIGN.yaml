scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_customer_success_returns_201_and_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with email+full_name returns 201 and a Customer whose id/created_at/version are server-minted and email echoes input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { email: "new@x.com", full_name: "New Cust", phone: "555-1000" }, as: PlatformAdmin, captures: { cid: "$.data.id" } }
          assert:
            - "response code == 201"
            - "Customer.${cid}.email == new@x.com"
            - "Customer.${cid}.version == 1"

      - name: create_customer_missing_required_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Customer.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers without the required email field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { full_name: "No Email" }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_pro_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Pro, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /pros/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pros/00000000-0000-4000-8000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: new_pro_rating_fields_default_zero
        claim_type: Defaults
        grounds: [entities.Pro.fields.rating_avg, entities.Pro.fields.provisional_rating, entities.Pro.fields.credit_balance_cents]
        distinguishing_aspect: "A freshly created Pro has rating_avg==0.0, rating_count==0, provisional_rating==0.0, credit_balance_cents==0, verification_status==UNVERIFIED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pros", payload: { email: "fresh@x.com", business_name: "Fresh" }, as: PlatformAdmin, captures: { pid: "$.data.id" } }
          assert:
            - "Pro.${pid}.rating_avg == 0.0"
            - "Pro.${pid}.rating_count == 0"
            - "Pro.${pid}.provisional_rating == 0.0"
            - "Pro.${pid}.credit_balance_cents == 0"
            - "Pro.${pid}.verification_status == UNVERIFIED"

      - name: create_request_unknown_category_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.ServiceRequest.fields.category_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /service-requests referencing a non-existent category_id returns ERR_NOT_FOUND (404) — FK existence enforced."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cx@x.com", full_name: "CX" }, as: PlatformAdmin, captures: { cx: "$.data.id" } }
          trigger:
            - { call: "POST /service-requests", payload: { customer_id: "${cx}", category_id: "00000000-0000-4000-8000-0000000000ff", zip_code: "94016", description: "d", budget_cents: 10000 }, as: Customer, as_user_id: "${cx}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND"

  # =================================================================
  - section: state_machines
    instances:
      - name: verify_approve_from_verified_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Pro.PENDING_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /pros/{id}/verify decision=APPROVE on an already VERIFIED pro (no APPROVE transition from VERIFIED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a VERIFIED pro"]
          setup_api_calls:
            - { call: "POST /pros", payload: { email: "pv@x.com", business_name: "PV" }, as: PlatformAdmin, captures: { pv: "$.data.id" } }
            - { call: "POST /pros/${pv}/submit-verification", payload: {}, as: Pro, as_user_id: "${pv}" }
            - { call: "POST /pros/${pv}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /pros/${pv}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: quote_send_from_sent_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.REVISION_REQUESTED_to_SENT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /quotes/{id}/send on a quote already in SENT (send only leaves REVISION_REQUESTED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a SENT quote"]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cw@x.com", full_name: "CW" }, as: PlatformAdmin, captures: { cw: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Cat1", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pw@x.com", business_name: "PW", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pw: "$.data.id" } }
            - { call: "POST /pros/${pw}/submit-verification", payload: {}, as: Pro, as_user_id: "${pw}" }
            - { call: "POST /pros/${pw}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pw}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cw}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${cw}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${pw}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
            - { call: "POST /leads/${lead}/contact", payload: {}, as: Pro, as_user_id: "${pw}" }
            - { call: "POST /quotes", payload: { lead_id: "${lead}", amount_cents: 10000, message: "q" }, as: Pro, as_user_id: "${pw}", captures: { q: "$.data.id" } }
          trigger:
            - { call: "POST /quotes/${q}/send", payload: { amount_cents: 9000 }, as: Pro, as_user_id: "${pw}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: resolve_dispute_before_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_REFUNDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /disputes/{id}/resolve on an OPEN (not UNDER_REVIEW) dispute returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["an OPEN dispute on a CHARGED lead"]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cy@x.com", full_name: "CY" }, as: PlatformAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Cat2", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "py@x.com", business_name: "PY", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { py: "$.data.id" } }
            - { call: "POST /pros/${py}/submit-verification", payload: {}, as: Pro, as_user_id: "${py}" }
            - { call: "POST /pros/${py}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${py}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cy}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${cy}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${py}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
            - { call: "POST /disputes", payload: { lead_id: "${lead}", reason: "DUPLICATE" }, as: Pro, as_user_id: "${py}", captures: { disp: "$.data.id" } }
          trigger:
            - { call: "POST /disputes/${disp}/resolve", payload: { decision: "REFUND" }, as: CustomerService, as_user_id: "cs-9", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_booking_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /bookings/{id}/cancel on an already CANCELLED booking returns ERR_INVALID_STATE and does not re-toggle the slot."
        test_recipe:
          setup: ["a CANCELLED booking"]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cz@x.com", full_name: "CZ" }, as: PlatformAdmin, captures: { cz: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "Cat3", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pz@x.com", business_name: "PZ", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pz: "$.data.id" } }
            - { call: "POST /pros/${pz}/submit-verification", payload: {}, as: Pro, as_user_id: "${pz}" }
            - { call: "POST /pros/${pz}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pz}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /availability-slots", payload: { pro_id: "${pz}", start_utc: "2026-03-05T08:00:00Z", end_utc: "2026-03-05T20:00:00Z" }, as: Pro, as_user_id: "${pz}", captures: { slot: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cz}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${cz}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${pz}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
            - { call: "POST /leads/${lead}/contact", payload: {}, as: Pro, as_user_id: "${pz}" }
            - { call: "POST /quotes", payload: { lead_id: "${lead}", amount_cents: 10000, message: "q" }, as: Pro, as_user_id: "${pz}", captures: { q: "$.data.id" } }
            - { call: "POST /bookings", payload: { quote_id: "${q}", availability_slot_id: "${slot}", scheduled_start: "2026-03-05T10:00:00Z", scheduled_end: "2026-03-05T11:00:00Z" }, as: Customer, as_user_id: "${cz}", captures: { bk: "$.data.id" } }
            - { call: "POST /bookings/${bk}/cancel", payload: { cancellation_reason: "x" }, as: Customer, as_user_id: "${cz}" }
          trigger:
            - { call: "POST /bookings/${bk}/cancel", payload: { cancellation_reason: "again" }, as: Customer, as_user_id: "${cz}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: booking_cascade_visible_same_request_immediate_consistency
        claim_type: Side Effect Execution
        grounds: [state_machines.Lead.QUOTED_to_CONVERTED]
        excluded_because:
          difficulty_instance: transitive_cascade / booking_cascade_quote_lead_sibling_request_slot_depth3
          rationale: "The full book->quote->lead->sibling->request->slot cascade and its immediate visibility is asserted by the named §1.8 depth-3 instance."

  # =================================================================
  - section: calculations
    instances:
      - name: subscription_overage_charges_wallet_flat_fee
        claim_type: Variant Selection
        grounds: [calculations.lead_charge, entities.SubscriptionPlan.fields.overage_price_cents, entities.Lead.fields.charge_cents]
        distinguishing_aspect: "A SUBSCRIPTION pro with 0 remaining_lead_credits (plan included 0) is charged the flat overage_price_cents 4000 to the wallet with credits_consumed==0; wallet 5000->1000."
        test_recipe:
          setup: ["subscription pro on a plan with included_lead_credits 0, overage 4000, wallet 5000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "cov@x.com", full_name: "COV" }, as: PlatformAdmin, captures: { cov: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "CatOv", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /subscription-plans", payload: { tier: "BASIC0", monthly_fee_cents: 5000, included_lead_credits: 0, overage_price_cents: 4000 }, as: PlatformAdmin, captures: { plan: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pov@x.com", business_name: "POV", billing_mode: "SUBSCRIPTION", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pov: "$.data.id" } }
            - { call: "POST /pros/${pov}/submit-verification", payload: {}, as: Pro, as_user_id: "${pov}" }
            - { call: "POST /pros/${pov}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pov}/credit-topup", payload: { amount_cents: 5000 }, as: PlatformAdmin }
            - { call: "POST /pros/${pov}/subscribe", payload: { subscription_plan_id: "${plan}" }, as: Pro, as_user_id: "${pov}" }
            - { call: "POST /service-requests", payload: { customer_id: "${cov}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${cov}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
          trigger:
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${pov}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
          assert:
            - "Lead.${lead}.charge_cents == 4000"
            - "Lead.${lead}.credits_consumed == 0"
            - "Pro.${pov}.remaining_lead_credits == 0"
            - "Pro.${pov}.credit_balance_cents == 1000"

      - name: lead_charge_billing_mode_divergence_stub
        claim_type: Variant Divergence
        grounds: [calculations.lead_charge]
        excluded_because:
          difficulty_instance: dual_variant_calc / lead_charge_pay_per_lead_vs_subscription_divergence
          rationale: "Pay-per-lead vs subscription divergence on identical gross is the named §1.8 instance."

      - name: booking_payout_rounding_stub
        claim_type: Correct Result
        grounds: [calculations.booking_payout]
        excluded_because:
          difficulty_instance: combinatorial_formula / booking_payout_independent_fee_rounding_mode_b
          rationale: "Payout fee rounding order is the named §1.8 instance."

  # =================================================================
  - section: validations
    instances:
      - name: distribute_insufficient_credit_returns_402
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "errors[ERR_INSUFFICIENT_CREDIT]"]
        distinguishing_aspect: "The only eligible pay-per-lead pro has wallet 1000 < gross 5000; distribute returns ERR_INSUFFICIENT_CREDIT (402)."
        test_recipe:
          setup: ["one eligible pay-per-lead pro with wallet 1000 (below gross 5000)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cic@x.com", full_name: "CIC" }, as: PlatformAdmin, captures: { cic: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "CatIC", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pic@x.com", business_name: "PIC", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pic: "$.data.id" } }
            - { call: "POST /pros/${pic}/submit-verification", payload: {}, as: Pro, as_user_id: "${pic}" }
            - { call: "POST /pros/${pic}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pic}/credit-topup", payload: { amount_cents: 1000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cic}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${cic}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
          trigger:
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INSUFFICIENT_CREDIT"

      - name: distribute_no_matching_zip_returns_no_eligible_pros
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_NO_ELIGIBLE_PROS]"]
        distinguishing_aspect: "A VERIFIED pro whose service_zip_codes do not include the request zip is not a candidate; distribute returns ERR_NO_ELIGIBLE_PROS."
        test_recipe:
          setup: ["a VERIFIED funded pro serving zip 99999, request zip 94016"]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cne@x.com", full_name: "CNE" }, as: PlatformAdmin, captures: { cne: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "CatNE", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pne@x.com", business_name: "PNE", service_zip_codes: ["99999"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pne: "$.data.id" } }
            - { call: "POST /pros/${pne}/submit-verification", payload: {}, as: Pro, as_user_id: "${pne}" }
            - { call: "POST /pros/${pne}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${pne}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /service-requests", payload: { customer_id: "${cne}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${cne}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
          trigger:
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NO_ELIGIBLE_PROS"

      - name: review_rating_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Review.fields.rating, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /reviews with rating 6 (outside 1..5) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["a COMPLETED booking ready to review"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "crr@x.com", full_name: "CRR" }, as: PlatformAdmin, captures: { crr: "$.data.id" } }
            - { call: "POST /service-categories", payload: { name: "CatRR", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "prr@x.com", business_name: "PRR", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { prr: "$.data.id" } }
            - { call: "POST /pros/${prr}/submit-verification", payload: {}, as: Pro, as_user_id: "${prr}" }
            - { call: "POST /pros/${prr}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /pros/${prr}/credit-topup", payload: { amount_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /availability-slots", payload: { pro_id: "${prr}", start_utc: "2026-03-05T08:00:00Z", end_utc: "2026-03-05T20:00:00Z" }, as: Pro, as_user_id: "${prr}", captures: { slot: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${crr}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${crr}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${prr}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
            - { call: "POST /leads/${lead}/contact", payload: {}, as: Pro, as_user_id: "${prr}" }
            - { call: "POST /quotes", payload: { lead_id: "${lead}", amount_cents: 10000, message: "q" }, as: Pro, as_user_id: "${prr}", captures: { q: "$.data.id" } }
            - { call: "POST /bookings", payload: { quote_id: "${q}", availability_slot_id: "${slot}", scheduled_start: "2026-03-05T10:00:00Z", scheduled_end: "2026-03-05T11:00:00Z" }, as: Customer, as_user_id: "${crr}", captures: { bk: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${bk}/complete", payload: {}, as: Pro, as_user_id: "${prr}" }
          trigger:
            - { call: "POST /reviews", payload: { booking_id: "${bk}", rating: 6 }, as: Customer, as_user_id: "${crr}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: duplicate_review_returns_conflict
        claim_type: Aggregate validation
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_REVIEW]"]
