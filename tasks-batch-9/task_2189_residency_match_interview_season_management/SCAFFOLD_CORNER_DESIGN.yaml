      - name: pathology_packet_drops_the_mandatory_dea_and_a_j1_applicant_adds_a_visa_item
        claim_type: constants_applied
        grounds:
          - calculations.credential_packet_composition
          - entities.CredentialItem.is_mandatory
          - entities.Contract.mandatory_credential_count
        distinguishing_aspect: >
          Both conditional arms of the packet fire at once and they pull in opposite directions. DEA is
          always created but is_mandatory is false for specialty_code PATH, and a NEEDS_J1 applicant adds a
          mandatory VISA item. The packet therefore holds 4 items of which 3 are mandatory - the same
          mandatory_credential_count an internal-medicine US-citizen packet reaches with only 3 items, so a
