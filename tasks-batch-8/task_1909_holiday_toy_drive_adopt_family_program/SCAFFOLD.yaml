  # --- Test-driving clock ---
  - method: POST
    path: "/toy-drive/_clock/set_current_utc"
    description: Test-driving endpoint. Sets the server's logical clock to an arbitrary ISO8601 UTC instant. Server default on startup is exactly 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time; every deadline/grace/window rule reads from this logical clock.
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["re-evaluates time-based transitions (adoption pledge expiry, slot no-show) lazily on next read"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint per §1.5 roles list"
  - id: ERR_PRIVACY_VIOLATION
    http: 403
    condition: "Donor-scoped request attempts to read or filter on PII fields (caregiver name/dob/address/phone)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same user attempts both halves of a SoD-gated pair (begin-review/verify, create/mark-purchased)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "URL-path id or body FK references a non-existent row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match current row version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, or enum value outside declared set"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "event.end_at <= event.start_at, or slot window lies outside parent event window"
  - id: ERR_INTAKE_CLOSED
    http: 409
    condition: "Family referral attempted before intake_open_at, after intake_close_at, or while campaign not in INTAKE_OPEN"
  - id: ERR_AGENCY_SUSPENDED
    http: 409
    condition: "Agency in SUSPENDED status attempted to refer a family"
  - id: ERR_AGENCY_QUOTA_EXCEEDED
    http: 409
    condition: "Agency referral quota reached (count of non-terminal families >= referral_quota)"
  - id: ERR_FAMILY_CHILD_CAP
    http: 409
    condition: "Adding a child would exceed campaign.max_children_per_family"
  - id: ERR_CHILD_TOO_OLD
    http: 422
    condition: "Child's computed age at distribution_date >= 19 years"
  - id: ERR_WISH_VALUE_EXCEEDED
    http: 422
    condition: "Sum of child's active wish items would exceed campaign.max_gift_value_cents"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation on season_year / agency_code / donor email / per-child priority_rank"
  - id: ERR_DUPLICATE_FLAG_OPEN
    http: 409
    condition: "Family has an OPEN DuplicateFlag and the requested transition requires zero open flags"
  - id: ERR_PLEDGE_EXPIRED
    http: 409
    condition: "Adoption confirm attempted more than 72 hours after pledged_at"
  - id: ERR_ADOPTION_CAP_EXCEEDED
    http: 409
    condition: "Donor's concurrent non-terminal adoption count reached max_adoptions_per_season"
  - id: ERR_ADOPTION_COVERAGE_INVALID
    http: 422
    condition: "child_ids reference children of a different family, children not in WISH_LOCKED, or WHOLE_FAMILY with zero eligible children"
  - id: ERR_COMMITMENT_TOO_LOW
    http: 422
    condition: "commitment_cents < campaign.min_gift_value_cents * covered_child_count at confirm time"
  - id: ERR_RETURN_DEADLINE_PASSED
    http: 409
    condition: "Gift receive attempted after return_deadline + grace hours (or after deadline with no override_note)"
  - id: ERR_GIFT_WISH_MISMATCH
    http: 422
    condition: "gift.wish_item_id belongs to a different child or is not in APPROVED/COMMITTED status"
  - id: ERR_GIFT_VALUE_EXCEEDED
    http: 422
    condition: "gift.declared_value_cents > campaign.max_gift_value_cents"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "Two slots for the same family have overlapping half-open windows"
  - id: ERR_LANE_CAPACITY_EXCEEDED
    http: 409
    condition: "Lane-level 30-minute bucket would exceed LANE_BUCKET_CAPACITY slots"
  - id: ERR_SLOT_FAMILY_MISMATCH
    http: 422
    condition: "Slot family not in an eligible status or belongs to a different campaign than the event"
  - id: ERR_STAGE_SLOT_MISMATCH
    http: 422
    condition: "Gift staged into a slot for a different family, or event not in SORTING"
  - id: ERR_OUTSIDE_SLOT_WINDOW
    http: 409
    condition: "Check-in attempted before window_start or after window_end"
  - id: ERR_BACKFILL_BUDGET_EXCEEDED
    http: 422
    condition: "mark-purchased would push campaign.backfill_spent_cents above backfill_budget_cents"
  - id: ERR_CAMPAIGN_NOT_CLOSED
    http: 409
    condition: "Thank-you generation or send attempted while campaign is not in RECONCILIATION or CLOSED"
  - id: ERR_DONOR_OPTED_OUT
    http: 409
    condition: "Thank-you send attempted for donor with thank_you_opt_in == false"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: Program operator with full configuration power; cannot perform caseworker verification or donor pledges
    identity: opaque
    exclusive_operations:
      - "create/patch/advance/close campaigns"
      - "create/suspend agencies"
      - "create donors"
      - "create/manage distribution events"
      - "run backfill selector and mark purchases"
      - "admin-cancel adoptions"
      - "generate/send thank-you notes"
      - "update SeasonSettings singleton"
      - "drive the test clock"
    shared_operations:
      - "read any entity"
      - "book distribution slots"

  - name: AgencyCoordinator
    description: Partner-agency staff member; identity bound to a PartnerAgency row; may refer families and register children/wish items for own agency only
    identity: "entity_backed:PartnerAgency"
    exclusive_operations:
      - "submit family referrals under own agency"
      - "register children and wish items for own agency's families"
    shared_operations:
      - "read own agency's families, children, wish items"
      - "read campaign public fields"

  - name: CaseWorker
    description: Program staff who verify family eligibility and resolve duplicate flags; segregation of duties prevents verifying a family they themselves began reviewing
    identity: opaque
    exclusive_operations:
      - "begin-review / verify / reject / return-to-referral / withdraw families"
      - "approve / reject wish items"
      - "raise, confirm, dismiss duplicate flags"
    shared_operations:
      - "read families, children, wish items, audit events"

  - name: Donor
    description: Gift-giver; identity bound to a Donor row; sees PII-scrubbed family/child views
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "pledge / confirm / cancel own adoptions"
      - "declare and ship gifts under own adoptions"
    shared_operations:
      - "read PII-scrubbed family/child/wish-item views"
      - "read own adoptions and gifts"

  - name: DistributionVolunteer
    description: Event-day volunteer at the distribution site
    identity: opaque
    exclusive_operations:
      - "receive / sort / stage gifts"
      - "check-in / complete distribution slots"
      - "sort backfill purchases"
    shared_operations:
      - "read events, slots, gifts, backfill purchases"
