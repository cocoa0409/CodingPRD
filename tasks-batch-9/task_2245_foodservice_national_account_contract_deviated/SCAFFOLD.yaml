    input: [sku, description, product_class_code, manufacturer_id, pack_size, last_cost_cents, avg_cost_cents, replacement_cost_cents, "stock_status?", "substitution_group_code?", "is_market_indexed?", "index_baseline_value?", "index_baseline_cost_cents?", "status?"]
