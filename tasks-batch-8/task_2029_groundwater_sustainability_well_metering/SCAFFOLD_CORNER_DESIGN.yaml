              payload: { holder_name: "Pumper WD-2", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_wd2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_wd2}", well_type: "PRODUCTION", location_description: "Parcel WD-2" }
