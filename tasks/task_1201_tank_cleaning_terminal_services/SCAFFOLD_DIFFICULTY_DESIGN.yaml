        grounds:
          - state_machines.CleaningJob.INSPECTION_ACCEPTED_to_REWORK_CLEANING
          - state_machines.CleaningJob.REWORK_CLEANING_to_SLUDGE_REMOVED
          - state_machines.GasFreeCertificate.VALID_to_SUPERSEDED
