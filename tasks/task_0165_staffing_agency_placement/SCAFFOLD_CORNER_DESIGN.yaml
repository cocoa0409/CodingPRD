# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Staffing Agency Placement — breadth probe across the claim-extraction-guide.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7. Setup chains use
# only §1.5 endpoints; all ${var} are bound by an earlier captures: block.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Client", "endpoints"]
        distinguishing_aspect: "POST /staffing/clients with name+credit_limit -> 201; status=ACTIVE, outstanding_balance_cents=0, open_exposure_cents=0, conversion_fee_pct default 0.20, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 5000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
          assert:
            - "HTTP 201; Client.${cl_id}.status == ACTIVE"
            - "Client.${cl_id}.outstanding_balance_cents == 0 and open_exposure_cents == 0"
            - "Client.${cl_id}.conversion_fee_pct == 0.20 and version == 1"

      - name: create_candidate_missing_skill_codes_returns_422
        claim_type: Required Fields
        grounds: ["entities.Candidate.fields.skill_codes", "validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /staffing/candidates omitting required skill_codes -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /staffing/candidates"
              payload: { full_name: "No Skills", base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_VALIDATION"

      - name: candidate_skill_code_unknown_returns_skill_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Candidate.fields.skill_codes", "errors[ERR_SKILL_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "POST /staffing/candidates with a skill_code not in the catalog -> ERR_SKILL_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; no skills created."]
          setup_api_calls: []
          trigger:
            - call: "POST /staffing/candidates"
              payload: { full_name: "Ghost Skill", skill_codes: ["NOPE"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_SKILL_NOT_FOUND"

      - name: get_client_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Client", "errors[ERR_CLIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /staffing/clients/{id} with an unknown UUID -> ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /staffing/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_CLIENT_NOT_FOUND"

      - name: skill_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.Skill"]
        distinguishing_aspect: "Skill has common_fields:false -> response carries id + created_at only, no version/updated_at; code uppercased on store."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /staffing/skills"
              payload: { code: "java", category: "TECH" }
              as: Recruiter
              captures: { sk_id: $.data.id }
          assert:
            - "HTTP 201; Skill.${sk_id}.code == JAVA (uppercased)"
            - "Skill.${sk_id} response has no version and no updated_at field"

      - name: skill_duplicate_code_returns_conflict
        claim_type: Type Constraints
        grounds: ["entities.Skill.fields.code", "errors[ERR_SKILL_CODE_DUPLICATE]"]
        distinguishing_aspect: "Creating a Skill whose code already exists (case-insensitively, since codes uppercase) -> ERR_SKILL_CODE_DUPLICATE (409)."
        test_recipe:
          setup: ["One skill JAVA exists."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
          trigger:
            - call: "POST /staffing/skills"
              payload: { code: "java", category: "TECH" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_SKILL_CODE_DUPLICATE"

      - name: job_order_filled_count_computed_starts_zero
        claim_type: Computed Fields
        grounds: ["entities.JobOrder.fields.filled_count"]
        distinguishing_aspect: "filled_count is computed: a freshly created JobOrder reports filled_count == 0 regardless of any input value."
        test_recipe:
          setup: ["A client and a skill exist."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 3, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
          assert:
            - "HTTP 201; JobOrder.${jo_id}.filled_count == 0 and status == DRAFT"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: job_order_open_from_filled_returns_invalid
        claim_type: Invalid Transitions
        grounds: ["state_machines.JobOrder.OPEN_to_OPEN", "errors[ERR_JOB_ORDER_NOT_DRAFT]"]
        distinguishing_aspect: "PATCH a non-DRAFT job order to OPEN (it is already OPEN) -> ERR_JOB_ORDER_NOT_DRAFT (409); no state change."
        test_recipe:
          setup: ["A job order already OPEN."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
          trigger:
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_JOB_ORDER_NOT_DRAFT"
            - "JobOrder.${jo_id}.status == OPEN (unchanged)"

      - name: job_order_resume_from_open_returns_not_on_hold
        claim_type: Invalid Transitions
        grounds: ["state_machines.JobOrder.ON_HOLD_to_OPEN", "errors[ERR_JOB_ORDER_NOT_ON_HOLD]"]
        distinguishing_aspect: "Resuming (target OPEN) a job order that is OPEN, not ON_HOLD, must be rejected. Since target OPEN from OPEN is not a defined transition, the resume path requires ON_HOLD -> ERR_JOB_ORDER_NOT_ON_HOLD (409)."
        test_recipe:
          setup: ["A job order OPEN (not ON_HOLD)."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
          trigger:
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "ON_HOLD" }
              as: AccountManager
              captures: { ok: $.data.status }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "ON_HOLD" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH ON_HOLD succeeds (OPEN->ON_HOLD); second PATCH ON_HOLD -> HTTP 409 data.error_id == ERR_JOB_ORDER_NOT_OPEN (already ON_HOLD)"

      - name: cancel_job_order_after_open_returns_not_draft
        claim_type: Invalid Transitions
        grounds: ["state_machines.JobOrder.DRAFT_to_CANCELLED", "errors[ERR_JOB_ORDER_NOT_DRAFT]"]
        distinguishing_aspect: "Cancelling (target CANCELLED) a job order that has left DRAFT -> ERR_JOB_ORDER_NOT_DRAFT (409)."
        test_recipe:
          setup: ["A job order OPEN."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
          trigger:
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "CANCELLED" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_JOB_ORDER_NOT_DRAFT"

      - name: timesheet_approve_from_draft_returns_bad_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Timesheet.SUBMITTED_to_APPROVED", "errors[ERR_TIMESHEET_BAD_STATE]"]
        distinguishing_aspect: "Approving (target APPROVED) a DRAFT timesheet (never submitted) -> ERR_TIMESHEET_BAD_STATE (409)."
        test_recipe:
          setup: ["ACTIVE TEMP placement with one DRAFT timesheet."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
            - call: "PATCH /staffing/interviews/${iv_id}"
              payload: { outcome: "PASSED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
            - call: "POST /staffing/timesheets"
              payload: { placement_id: "${pl_id}", week_start: "2026-06-15T00:00:00Z", week_end: "2026-06-22T00:00:00Z", hours: 40 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { ts_id: $.data.id }
          trigger:
            - call: "PATCH /staffing/timesheets/${ts_id}"
              payload: { target_status: "APPROVED" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_TIMESHEET_BAD_STATE"

      - name: invoice_pay_from_draft_returns_bad_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Invoice.ISSUED_to_PAID", "errors[ERR_INVOICE_BAD_STATE]"]
        distinguishing_aspect: "Paying (target PAID) a DRAFT invoice (never issued) -> ERR_INVOICE_BAD_STATE (409)."
        test_recipe:
          setup: ["A DRAFT invoice for a client."]
          setup_api_calls:
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/invoices"
              payload: { client_id: "${cl_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "PATCH /staffing/invoices/${inv_id}"
              payload: { target_status: "PAID" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_INVOICE_BAD_STATE"

      - name: issue_empty_invoice_returns_invoice_empty
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Invoice.DRAFT_to_ISSUED", "errors[ERR_INVOICE_EMPTY]"]
        distinguishing_aspect: "Issuing a DRAFT invoice with zero line items -> ERR_INVOICE_EMPTY (409); empty-collection boundary on issue."
        test_recipe:
          setup: ["A DRAFT invoice with no line items."]
          setup_api_calls:
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/invoices"
              payload: { client_id: "${cl_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "PATCH /staffing/invoices/${inv_id}"
              payload: { target_status: "ISSUED" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_INVOICE_EMPTY"

      - name: extend_offer_without_passed_interview_returns_no_passed_interview
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Submission.INTERVIEWING_to_OFFER_EXTENDED", "errors[ERR_NO_PASSED_INTERVIEW]"]
        distinguishing_aspect: "extend-offer (target OFFER_EXTENDED) on an INTERVIEWING submission whose only interview is still PENDING -> ERR_NO_PASSED_INTERVIEW (409)."
        test_recipe:
          setup: ["Submission at INTERVIEWING with one PENDING interview (never recorded PASSED)."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
          trigger:
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_NO_PASSED_INTERVIEW"

      - name: convert_temp_placement_returns_not_convertible
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Placement.NONE_to_CONVERTED", "errors[ERR_PLACEMENT_NOT_CONVERTIBLE]"]
        distinguishing_aspect: "convert on a TEMP (not TEMP_TO_PERM) placement -> ERR_PLACEMENT_NOT_CONVERTIBLE (409)."
        test_recipe:
          setup: ["ACTIVE TEMP placement."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
            - call: "PATCH /staffing/job-orders/${jo_id}"
              payload: { target_status: "OPEN" }
              as: AccountManager
              captures: { jo_v: $.data.version }
            - call: "POST /staffing/candidates"
              payload: { full_name: "Cara Dev", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${cand_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { sub_id: $.data.id }
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${sub_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { iv_id: $.data.id }
            - call: "PATCH /staffing/interviews/${iv_id}"
              payload: { outcome: "PASSED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "PATCH /staffing/submissions/${sub_id}"
              payload: { target_status: "OFFER_EXTENDED" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /staffing/placements"
              payload: { submission_id: "${sub_id}", start_date: "2026-06-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", expected_job_order_version: "${jo_v}", standard_weekly_hours: 40 }
              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
          trigger:
            - call: "POST /staffing/placements/${pl_id}/convert"
              payload: { annual_salary_cents: 10000000 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_PLACEMENT_NOT_CONVERTIBLE"

      - name: deactivated_candidate_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Candidate.AVAILABLE_to_INACTIVE", "errors[ERR_CANDIDATE_NOT_AVAILABLE]"]
        distinguishing_aspect: "INACTIVE is terminal: a second PATCH to INACTIVE on an already-INACTIVE candidate -> ERR_CANDIDATE_NOT_AVAILABLE (409)."
        test_recipe:
          setup: ["A candidate already deactivated (INACTIVE)."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/candidates"
              payload: { full_name: "Gone", skill_codes: ["JAVA"], base_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { cand_id: $.data.id }
            - call: "PATCH /staffing/candidates/${cand_id}"
              payload: { target_status: "INACTIVE" }
              as: Recruiter
          trigger:
            - call: "PATCH /staffing/candidates/${cand_id}"
              payload: { target_status: "INACTIVE" }
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_CANDIDATE_NOT_AVAILABLE"

      - name: place_inactive_candidate_returns_candidate_inactive
        claim_type: guarded transitions
        grounds: ["validations[priority=8]", "errors[ERR_CANDIDATE_INACTIVE]", "state_machines.Submission.OFFER_EXTENDED_to_PLACED"]
        distinguishing_aspect: "Placing from an OFFER_EXTENDED submission whose candidate was deactivated to INACTIVE after the offer -> ERR_CANDIDATE_INACTIVE (409)."
        test_recipe:
          setup: ["Submission at OFFER_EXTENDED, then its candidate is deactivated to INACTIVE."]
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
