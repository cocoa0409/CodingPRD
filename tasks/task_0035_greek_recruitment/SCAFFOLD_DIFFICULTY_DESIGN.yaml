  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: ci_dues_balance_conserved_accept_then_rescind
        grounds:
          - state_machines.BidMatch.PROPOSED_to_ACCEPTED
          - state_machines.BidMatch.ACCEPTED_to_DECLINED
          - calculations.chapter_dues_balance
          - entities.DuesLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Forward action (POST /bid-matches/{id}/accept) posts CHARGE
          +dues_charged_cents to the chapter dues ledger; compensating
          action (POST /bid-matches/{id}/rescind) posts REFUND
          -dues_charged_cents. Conserved quantity: chapter dues balance
          (USD cents). Invariant:
            after_balance(chapter) - before_balance(chapter) == 0
            <=> SUM(amount_cents WHERE chapter_id=C AND bid_match_id=B) == 0.
