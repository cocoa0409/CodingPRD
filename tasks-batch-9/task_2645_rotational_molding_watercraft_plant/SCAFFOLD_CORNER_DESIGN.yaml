              as: Customer
              as_user_id: "${cust}"
            - call: "GET /warranty-claims/${claim}"
              payload: {}
              as: Customer
              as_user_id: "${cust9}"
            - call: "GET /warranty-claims"
              payload: {}
              as: Customer
              as_user_id: "${cust9}"
            - call: "POST /warranty-claims/${claim}/withdraw"
