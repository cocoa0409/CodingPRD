  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: orders_list_pagination_envelope
        claim_type: listing
        grounds: [endpoints.GET_/mro/orders, response_envelope]
        distinguishing_aspect: "GET /mro/orders with limit 2 over 3 orders returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns the final row with has_more false."
        test_recipe:
          setup: ["Customer with three SUBMITTED WILL_CALL orders; stocked branch"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "PG-1", display_name: "Page Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "PG-1", description: "Nut", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-PG", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 3 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
          trigger:
            - call: "GET /mro/orders"
              payload: { customer_id: "${cust_id}", limit: 2 }
              as: DistributionAdmin
            - call: "GET /mro/orders"
              payload: { customer_id: "${cust_id}", limit: 2, offset: 2 }
              as: DistributionAdmin
          assert:
            - "First page: response_type == array, data has exactly 2 orders, total_count == 3, has_more == true"
            - "Second page (offset 2): data has exactly 1 order, total_count == 3, has_more == false"
            - "Both responses carry meta.api_request_id and meta.api_request_timestamp"

      - name: error_envelope_and_not_found_for_all_resources
        claim_type: not_found
        grounds: [response_envelope, errors]
        distinguishing_aspect: "Every single-resource GET with a random UUID returns the resource-specific 404 error_id inside the fixed error envelope (response_type error, data.error_id)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /mro/customers/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /mro/items/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /mro/price-rules/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /mro/rebate-agreements/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /mro/locations/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /mro/carts/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /mro/orders/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /mro/returns/11111111-2222-3333-4444-555555555555"
              as: DistributionAdmin
              captures: { e8: $.data.error_id }
          assert:
            - "e1 == ERR_CUSTOMER_NOT_FOUND and e2 == ERR_ITEM_NOT_FOUND and e3 == ERR_PRICE_RULE_NOT_FOUND and e4 == ERR_REBATE_AGREEMENT_NOT_FOUND"
            - "e5 == ERR_LOCATION_NOT_FOUND and e6 == ERR_CART_NOT_FOUND and e7 == ERR_ORDER_NOT_FOUND and e8 == ERR_RETURN_NOT_FOUND"
            - "Each response uses response_type error with data.error_id and data.message, HTTP 404"

      - name: orders_filtered_by_customer_id
        claim_type: listing
        grounds: [endpoints.GET_/mro/orders]
        distinguishing_aspect: "The customer_id filter scopes the list: with orders for two customers, filtering by customer A returns only A's orders (FK reverse-reachability via filtered list)."
        test_recipe:
          setup: ["Customers A and B, each with one WILL_CALL order"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "FA-1", display_name: "Filter A", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { custA: $.data.id }
            - call: "POST /mro/customers"
              payload: { account_number: "FB-1", display_name: "Filter B", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { custB: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "FLT-1", description: "Washer", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-FL", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 2 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${custA}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${custB}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
          trigger:
            - call: "GET /mro/orders"
              payload: { customer_id: "${custA}" }
              as: DistributionAdmin
              captures: { first_cust: "$.data[0].customer_id" }
          assert:
            - "total_count == 1 and every returned order has customer_id == ${custA}"
            - "first_cust == ${custA}"

      - name: order_lines_returned_in_creation_order
        claim_type: listing
        grounds: ["endpoints.GET_/mro/orders/{id}/lines"]
        distinguishing_aspect: "The lines sub-resource returns lines in request order: data[0] is the first payload line, data[1] the second."
        test_recipe:
          setup: ["Customer, items X and Y stocked, order with lines [X, Y]"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "LO-1", display_name: "LineOrder Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "LO-X", description: "X part", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
              captures: { itX: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "LO-Y", description: "Y part", item_class: "STOCKED", list_price_cents: 200 }
              as: DistributionAdmin
              captures: { itY: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-LO", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itX}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itY}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itX}", qty: 1 }, { item_id: "${itY}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
          trigger:
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { first_item: "$.data[0].item_id", second_item: "$.data[1].item_id" }
          assert:
            - "first_item == ${itX} and second_item == ${itY} (creation order preserved)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: credit_limit_exceeded_pure_fiscal
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDIT_LIMIT_EXCEEDED]", "validations[priority=11]"]
        distinguishing_aspect: "With no safety/state violations present, an ACTIVE customer confirming a 5,000-cent order against a 1,000 limit fails with ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["ACTIVE customer credit limit 1,000; STOCKED item list 5,000 stocked 1; WILL_CALL order (no hazmat, method OK)"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "CL-1", display_name: "CreditLimit Co", credit_limit_cents: 1000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
