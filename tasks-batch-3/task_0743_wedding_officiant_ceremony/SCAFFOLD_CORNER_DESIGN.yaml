# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Wedding-Officiant & Ceremony Service — EXPERT
# Breadth probe over §1.1–§1.7; every §1.6 error triggered here or in §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_officiant_returns_201_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Officiant.fields.status
          - entities.Officiant.fields.active_hold_count
          - entities.Officiant.fields.displayed_rating
        distinguishing_aspect: "POST /officiants returns 201; status PENDING_REVIEW, active_hold_count 0, escrow_balance_cents 0, displayed_rating/internal_rating null, published_review_count 0, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /officiants"
              payload: { full_name: "Ada Noe", email: "ada@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Officiant.${off_id}.status == PENDING_REVIEW"
            - "Officiant.${off_id}.active_hold_count == 0"
            - "Officiant.${off_id}.escrow_balance_cents == 0"
            - "Officiant.${off_id}.displayed_rating == null"
            - "Officiant.${off_id}.version == 1"

      - name: create_booking_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Booking.fields.required_style
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /bookings omitting required_style is rejected with ERR_VALIDATION (400); no booking is created."
        test_recipe:
          setup: ["Officiant ACTIVE, Couple, CLASSIC package, CA venue exist"]
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Bo Rue", email: "bor@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
            - call: "POST /couples"
              payload: { partner_one_name: "Al", partner_two_name: "Bea", email: "ab@x.com", phone: "555-0200" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Oak Hall", jurisdiction: "CA", address: "20 Oak" }
              as: Coordinator
              captures: { ven_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10 }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_review_rating_out_of_range_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.Review.fields.rating
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /reviews with rating 6 (outside 1..5) is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A COMPLETED booking exists so only the rating range is at fault"]
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Cy Doe", email: "cyd@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Cara", partner_two_name: "Dan", email: "cd2@x.com", phone: "555-0201" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Elm Hall", jurisdiction: "CA", address: "21 Elm" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-04-01T15:00:00Z", ceremony_end: "2026-04-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${bk_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { deposit_amount_cents: 70800 }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: Officiant
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /reviews"
              payload: { booking_id: "${bk_id}", rating: 6, text: "Too high" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

