            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Services Only", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
