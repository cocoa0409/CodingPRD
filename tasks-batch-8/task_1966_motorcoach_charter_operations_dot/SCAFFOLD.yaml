        type: string
        source: input
        description: "FK -> CharterOrder.id; the order this log belongs to"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; the driver on duty for this log segment"
      - name: log_type
        type: enum
        source: input
        description: "Type of log entry"
        constraints: "DRIVING | ON_DUTY_NOT_DRIVING | OFF_DUTY | SLEEPER_BERTH"
      - name: start_time
        type: datetime
        source: input
        description: "Start of this log segment"
      - name: end_time
        type: datetime
        source: input
        description: "End of this log segment"
      - name: start_location
        type: string
        source: input
        description: "Location at start of segment"
      - name: end_location
        type: string
        source: input
        description: "Location at end of segment"
      - name: miles_driven
        type: integer
        source: input
        description: "Miles driven during this segment (0 for non-driving)"
        default: 0
      - name: hos_violation
        type: boolean
        source: computed
        description: "Whether this segment caused or contributed to an HOS violation"
        default: false
      - name: violation_details
        type: string
        source: computed
        description: "Description of HOS violation if any"
        default: ""

  - name: IncidentReport
    parent: CharterOrder
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CharterOrder.id; the order during which incident occurred"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver involved"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; vehicle involved"
      - name: incident_type
        type: enum
        source: input
        description: "Category of incident"
        constraints: "ACCIDENT | BREAKDOWN | TRAFFIC_VIOLATION | CUSTOMER_COMPLAINT | HOS_VIOLATION | CARGO_DAMAGE | OTHER"
      - name: severity
        type: enum
        source: input
        description: "Severity classification"
        constraints: "MINOR | MODERATE | MAJOR | CRITICAL"
      - name: description
        type: string
        source: input
        description: "Detailed description of incident"
      - name: occurred_at
        type: datetime
        source: input
        description: "When the incident occurred"
      - name: reported_by
        type: string
        source: input
        description: "Name of person filing the report"
      - name: dot_recordable
        type: boolean
        source: computed
        description: "Whether incident meets DOT recordable criteria (MAJOR or CRITICAL severity with ACCIDENT type)"
      - name: resolution_status
        type: enum
        source: system
        description: "Incident resolution status"
        constraints: "OPEN | UNDER_INVESTIGATION | RESOLVED | CLOSED"
        default: OPEN
      - name: resolution_notes
        type: string
        source: system
        description: "Notes on resolution"
      - name: safety_score_impact
        type: number
        source: computed
        description: "Points deducted from driver safety score based on severity and type"
        default: 0.0

  - name: MaintenanceRecord
    parent: Vehicle
    common_fields: false
    fields:
