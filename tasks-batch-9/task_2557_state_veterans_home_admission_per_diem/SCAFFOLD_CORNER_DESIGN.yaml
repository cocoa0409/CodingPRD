            - "res_level == NURSING"
            - "res_occ == ADMITTED"
            - "u1_e_total == 1"
            - "u1_e_status == CANCELLED"
            - "u1_e_pos == 0"
            - "u2_e_total == 1"
            - "u2_e_status == ADMITTED"
            - "u2_e_pos == 0"
            - "u2_occ == 1"
            - "u2_avail1 == 1"
            - "u2_active == 0"
            - "u1_occ == 0"
            - "u1_active == 0"

      - name: err_census_day_already_claimed_on_paid_month
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CENSUS_DAY_ALREADY_CLAIMED
          - validations[priority=82,ERR_CENSUS_DAY_ALREADY_CLAIMED]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / census_day_single_attribution_across_transferred_units"
          rationale: |
            The §1.8 instance already pins the only path to this error: once a month's CensusDay rows point
            at a PAID claim, a plain creation for that (care_unit_id, claim_month) is rejected with
            ERR_CENSUS_DAY_ALREADY_CLAIMED and the correction endpoint is the only legal revision route,
            which that instance drives end to end across a unit transfer.

  - section: rbac
    instances:
      - name: rbac_state_program_admin_exclusive_ops_others_cannot_invoke
        claim_type: exclusive_operation
        grounds:
          - rbac.StateProgramAdmin
          - validations[priority=20,ERR_ROLE_NOT_PERMITTED]
          - endpoints.POST_svh__ops_census_run
        distinguishing_aspect: |
          Five operations are exclusive to StateProgramAdmin - register a home, create a care unit, change
          recognition posture, set the logical clock and run the census/ops checkpoint - and no other role
          may invoke any of them, not even the FederalPerDiemAuditor whose whole job depends on the census.
          The same roles that are refused these writes still hold the shared read on homes and care units,
          so the refusal is operation-scoped and not a blanket denial.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit, both created by StateProgramAdmin."
            - "No residents exist, so a successful checkpoint reports all-zero counters."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Oakvale State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
          trigger:
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-08-01" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { bom_ops_err: "$.data.error_id" }
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-08-01" }
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { auditor_ops_err: "$.data.error_id" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { assessor_clock_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/${home_id}/recognition"
              payload: { action: "SUSPEND", effective_date: "2026-08-01", note: "coordinator overreach" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { coord_recog_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Domiciliary A", care_level: "DOMICILIARY", licensed_bed_count: 4, out_of_service_bed_count: 0 }
              as: SurveyAgency
              as_user_id: "survey-1"
              captures: { survey_unit_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes"
              payload: { name: "Pinehill State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { bom_home_err: "$.data.error_id" }
            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { auditor_read_status: "$.data.recognition_status" }
            - call: "GET /svh/veterans-homes/${home_id}/care-units"
              payload: { limit: 10 }
              as: SurveyAgency
              as_user_id: "survey-1"
              captures: { survey_read_total: "$.meta.total_count" }
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-08-01" }
              as: StateProgramAdmin
              captures: { admin_gen: "$.data.generated_census_day_count", admin_pna: "$.data.pna_credited_resident_count", admin_clock: "$.data.current_utc" }
            - call: "GET /svh/veterans-homes"
              payload: { limit: 10 }
              as: StateProgramAdmin
              captures: { home_total: "$.meta.total_count" }
          assert:
            - "every one of the six non-admin writes above returns HTTP 403"
            - "bom_ops_err == ERR_ROLE_NOT_PERMITTED"
            - "auditor_ops_err == ERR_ROLE_NOT_PERMITTED"
            - "assessor_clock_err == ERR_ROLE_NOT_PERMITTED"
            - "coord_recog_err == ERR_ROLE_NOT_PERMITTED"
            - "survey_unit_err == ERR_ROLE_NOT_PERMITTED"
            - "bom_home_err == ERR_ROLE_NOT_PERMITTED"
            - "auditor_read_status == RECOGNIZED"
            - "survey_read_total == 1"
            - "admin_gen == 0"
            - "admin_pna == 0"
            - "admin_clock == 2026-08-01T00:00:00Z"
            - "home_total == 1"

      - name: rbac_survey_agency_exclusive_survey_result_and_cannot_read_residents
        claim_type: exclusive_operation
        grounds:
          - rbac.SurveyAgency
          - endpoints.POST_svh_care_units_id_survey_result
          - calculations.survey_compliance_score
        distinguishing_aspect: |
          Recording a survey result is exclusive to SurveyAgency - even StateProgramAdmin, who created the
          unit, is refused - and SurveyAgency's shared reads stop at homes and care units, so the resident
          roster is refused to it with ERR_ROLE_NOT_PERMITTED. An empty deficiencies array is a legal
          survey that scores exactly 0 and leaves a CERTIFIED unit CERTIFIED while still stamping both
          last_survey_date fields.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit whose last_survey_compliance_score is 0 and last_survey_date is null."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Quarry Hill State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id", home_survey0: "$.data.last_survey_date" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
