      - name: pi_advance_at_exact_ara_adjusted_obligation_ceiling
        grounds:
          - calculations.ara_adjusted_advance_obligation
          - validations[priority=27]
          - entities.Loan.fields.required_monthly_pi_advance_usd
          - endpoints[POST /special-servicing/advances]
          - errors.ERR_ADVANCE_EXCEEDS_ARA_ADJUSTED_OBLIGATION
        distinguishing_aspect: |
          Metric: amount_usd against required_monthly_pi_advance_usd, on POST /advances. The
          obligation ceiling is round(118000 * (19500000 - 6000000.90) / 19500000, 2) = 81,692.30 and
          the comparison is inclusive, so 81,692.30 is accepted with 201 while 81,692.31 — one cent
          more — is refused with ERR_ADVANCE_EXCEEDS_ARA_ADJUSTED_OBLIGATION (422). Truncating
          instead of rounding half up would move the ceiling and flip both outcomes.
        test_recipe:
          setup:
            - "One trust with a 40,000,000.00 controlling class balance so the ARA does not terminate control and perturb the scenario."
            - "One loan with current_principal_balance_usd 19,500,000.00, accrued_unpaid_interest_usd 0.00 and monthly_debt_service_usd 118,000.00, transferred to special servicing."
            - "An ACCEPTED UPDATE appraisal at 14,999,999 whose 6,000,000.90 reduction has been made EFFECTIVE, so required_monthly_pi_advance_usd is exactly 81,692.30."
            - "No advance exists yet, so the deficiency base used for the reduction was exactly the 19,500,000.00 principal."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-A1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-A01", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, accrued_unpaid_interest_usd: 0, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "MONETARY_DEFAULT_60D", occurred_on: "2026-07-15T00:00:00Z", evidence_note: "60 days delinquent", days_delinquent_at_event: 60 }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 14999999, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_id}", status: "PROVISIONAL" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_id: "$.data[0].id" }
            - call: "POST /special-servicing/appraisal-reductions/${ara_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { pi_ceiling: "$.data.required_monthly_pi_advance_usd", ara_on_loan: "$.data.ara_amount_usd" }
          trigger:
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PI_ADVANCE", amount_usd: 81692.30, advanced_on: "2026-08-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { accepted_advance_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PI_ADVANCE", amount_usd: 81692.31, advanced_on: "2026-08-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { over_ceiling_error: "$.data.error_id" }
          assert:
            - "Loan.${loan_id}.ara_amount_usd == 6000000.90 and Loan.${loan_id}.required_monthly_pi_advance_usd == 81692.30"
            - "The 81,692.30 advance returns HTTP 201 with status OUTSTANDING, amount_usd 81692.30 and accrued_interest_usd 0.00"
            - "The 81,692.31 advance returns HTTP 422 with error_id ERR_ADVANCE_EXCEEDS_ARA_ADJUSTED_OBLIGATION"
            - "Loan.${loan_id}.advances_outstanding_usd == 81692.30 — the refused advance left no trace"
            - "Trust.${trust_id}.total_advances_outstanding_usd == 81692.30"
            - "The ceiling was NOT recomputed after the accepted advance: it still reads 81692.30, because the obligation depends on principal and appraisal reduction only"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_execution_gated_by_another_entitys_appraisal_coverage_window
        grounds:
          - validations[priority=16]
          - state_machines.WorkoutPlan.APPROVED_to_EXECUTED
          - entities.Appraisal.fields.coverage_end_date
          - errors.ERR_STALE_APPRAISAL
        distinguishing_aspect: |
          Entity pair (WorkoutPlan, Appraisal). Two plans that are byte-for-byte identical in their
          own state — both APPROVED, both with the same selected MODIFICATION alternative — diverge at
          the same logical clock purely because of a THIRD entity's derived field: at
          2027-08-01T00:00:00Z plan G's appraisal coverage window [2026-08-01, 2027-08-01) has just
          expired (the window is half-open, so the end instant is already outside) and EXECUTED is
          refused with ERR_STALE_APPRAISAL, while plan H's window [2027-01-01, 2028-01-01) still
          contains the instant and EXECUTED succeeds.
        test_recipe:
          setup:
            - "Clock set to 2027-01-01T00:00:00Z for the whole build-out."
            - "One trust with a 40,000,000.00 controlling class balance so both consultations carry CONSENT_RIGHT and both are consented to."
            - "Loan G with an ACCEPTED UPDATE appraisal as of 2026-08-01 (valuation_valid_months 12, coverage ends 2027-08-01); loan H with an ACCEPTED UPDATE appraisal as of 2027-01-01 (coverage ends 2028-01-01)."
            - "One MODIFICATION plan per loan, each SCORED, RECOMMENDED, consented, and APPROVED by the committee officer."
            - "The clock is then moved to 2027-08-01T00:00:00Z — exactly loan G's coverage_end_date."
