  - rule_id: non_linear_state_machine
    instances:

      - name: filing_parallel_axes_move_independently
        grounds:
          - state_machines.StateFiling.UNPAID_to_PARTIALLY_PAID
          - state_machines.StateFiling.PARTIALLY_PAID_to_UNPAID
          - entities.StateFiling.fields.preparation_status
          - entities.StateFiling.fields.payment_status
          - state_machines.EstimatedPayment.RECEIVED_to_APPLIED
          - state_machines.EstimatedPayment.APPLIED_to_UNAPPLIED
        distinguishing_aspect: |
          PARALLEL dimensions on the StateFiling entity: applying and then unapplying a remittance
          drives payment_status UNPAID -> PARTIALLY_PAID -> UNPAID while preparation_status stays
          pinned at FILED throughout, proving the two axes on the same row evolve independently.
