            - "response error_id == ERR_ASSESSMENT_CLIENT_MISMATCH (business_referential, priority 8) — NOT ERR_THERAPEUTIC_DIET_MISMATCH (business_safety, priority 11)"
            - "HTTP status == 422"

  # ========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: nutrition_high_risk_threshold_exact_six
        grounds:
          - calculations.nutrition_risk_category
          - entities.Assessment.nutrition_determine_points
          - entities.Assessment.nutrition_risk_category
        distinguishing_aspect: |
          The HIGH band begins at exactly HIGH_MIN=6 (>=): points 5 -> MODERATE,
          points 6 -> HIGH. Metric: nutrition score threshold, reached via POST
          /clients/{id}/assessments.
        test_recipe:
          setup:
            - "One INTAKE client; two DRAFT assessments created with nutrition_determine_points 5 and 6."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 5, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { cat5: $.data.nutrition_risk_category }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 6, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { cat6: $.data.nutrition_risk_category }
          assert:
            - "assessment with points 5 has nutrition_risk_category == MODERATE"
            - "assessment with points 6 has nutrition_risk_category == HIGH"

      - name: route_capacity_boundary_at_max
        grounds:
          - "validations[priority=13]"
          - entities.Route.max_meals_per_run
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Capacity is an aggregate meal_count per route per date: with
          max_meals_per_run 2 and meal_count 1 per delivery, the 2nd delivery
          (sum 2 == cap) succeeds and the 3rd (sum 3 > cap) is rejected. A
          different metric (aggregate collection size) than the numeric nutrition
          threshold, reached through a different endpoint (POST /deliveries).
        test_recipe:
          setup:
            - "ACTIVE client with ACTIVE HOT plan (meals_per_day 1 -> meal_count 1) on a route with max_meals_per_run 2; two deliveries already SCHEDULED on 2026-03-02 (aggregate 2 == capacity)."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 2 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 1 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 1, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "the 2nd delivery (aggregate meal_count 2 == max_meals_per_run) was created with status 201"
            - "the 3rd delivery (aggregate would be 3 > 2) response error_id == ERR_ROUTE_CAPACITY_EXCEEDED"
            - "HTTP status == 409"

  # ========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: delivery_scheduling_requires_active_client
        grounds:
          - "validations[priority=9]"
          - state_machines.Client.ASSESSED_to_ACTIVE
          - errors[ERR_CLIENT_NOT_ACTIVE]
        distinguishing_aspect: |
          A Delivery may be scheduled only when its Client (a different entity)
          is ACTIVE: with the client merely ASSESSED, POST /deliveries fails
          ERR_CLIENT_NOT_ACTIVE; after the client is activated the identical call
          succeeds. Entity pair: Delivery -> Client.
        test_recipe:
          setup:
            - "Client ASSESSED with an ACTIVE HOT plan on an ACTIVE route (not yet activated as a client)."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
          trigger:
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { err: $.data.error_id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del_ok: $.data.id }
          assert:
            - "first POST /deliveries (client ASSESSED) error_id == ERR_CLIENT_NOT_ACTIVE (409)"
            - "after activate, second POST /deliveries succeeds (201) with status SCHEDULED"

      - name: route_activation_requires_active_driver
        grounds:
          - "validations[priority=10]"
          - state_machines.Route.DRAFT_to_ACTIVE
          - state_machines.VolunteerDriver.PENDING_to_ACTIVE
          - errors[ERR_DRIVER_NOT_ACTIVE]
        distinguishing_aspect: |
          A Route may be activated only when its assigned VolunteerDriver (a
          different entity) is ACTIVE: with a PENDING driver assigned, POST
          /routes/{id}/activate fails ERR_DRIVER_NOT_ACTIVE; after the driver is
          activated the identical call succeeds. Entity pair: Route ->
          VolunteerDriver (distinct from Delivery -> Client above).
        test_recipe:
          setup:
            - "A DRAFT route with a PENDING driver assigned (driver never activated)."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
          trigger:
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
              captures: { err: $.data.error_id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
          assert:
            - "first POST /routes/{id}/activate (driver PENDING) error_id == ERR_DRIVER_NOT_ACTIVE (409)"
            - "after driver activate, second POST /routes/{id}/activate succeeds and Route.status == ACTIVE"

  # ========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vacation_hold_inclusive_touching_overlap
        grounds:
          - "validations[priority=12]"
          - entities.VacationHold.start_date
          - entities.VacationHold.end_date
          - errors[ERR_HOLD_OVERLAP]
        distinguishing_aspect: |
          Vacation holds occupy a continuous inclusive date interval on a Client;
          adjacency counts as overlap. A completed hold [2026-06-01,2026-06-10]
          conflicts with a new hold [2026-06-10,2026-06-15] because the shared
          endpoint 2026-06-10 makes start_new <= end_existing AND start_existing
          <= end_new. Continuous inclusive interval arithmetic on the Client
          resource.
        test_recipe:
          setup:
            - "ACTIVE client. A first hold [2026-06-01,2026-06-10] created then ended (status COMPLETED), leaving the client ACTIVE."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clients/${cli_id}/vacation-holds"
              payload: { start_date: "2026-06-01", end_date: "2026-06-10" }
              as: IntakeCoordinator
              captures: { hold1: $.data.id }
            - call: "POST /vacation-holds/${hold1}/end"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /clients/${cli_id}/vacation-holds"
              payload: { start_date: "2026-06-10", end_date: "2026-06-15" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_HOLD_OVERLAP (409) because the inclusive intervals share endpoint 2026-06-10"

      - name: driver_day_discrete_weekday_conflict
        grounds:
          - "validations[priority=12]"
          - entities.Route.service_days
          - entities.Route.driver_id
          - errors[ERR_DRIVER_DAY_CONFLICT]
        distinguishing_aspect: |
          Driver-day conflict is a discrete weekday-set intersection (not a
          continuous range) on the Route/VolunteerDriver resource: a driver
          already on route1 with service_days [MON,WED] cannot be assigned to
          route2 with service_days [WED,FRI] because WED is shared. Different
          interval semantics (set intersection) and different resource entity
          than the continuous vacation-hold interval.
        test_recipe:
          setup:
            - "One ACTIVE driver already assigned to route1 (service_days [MON,WED]); a second DRAFT route2 (service_days [WED,FRI]) exists with no driver."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt1: $.data.id }
            - call: "POST /routes/${rt1}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes"
              payload: { name: "R2", zone: "Z1", service_days: [WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt2: $.data.id }
          trigger:
            - call: "POST /routes/${rt2}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DRIVER_DAY_CONFLICT (409) because service_days [MON,WED] and [WED,FRI] share WED"

  # ========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: oaa_units_conserved_on_deliver_then_void
        grounds:
          - state_machines.Delivery.SCHEDULED_to_DELIVERED
          - state_machines.Delivery.DELIVERED_to_VOIDED
          - entities.Client.lifetime_oaa_units
        distinguishing_aspect: |
          Conserved quantity = OAA meal units. Invariant pinned as
          Client.lifetime_oaa_units == sum(d.meal_count for d where d.status ==
          DELIVERED). DELIVERED accrues meal_count (2) and VOID subtracts exactly
          meal_count (2); after deliver+void lifetime_oaa_units returns to 0 with
          no drift.
        test_recipe:
          setup:
            - "ACTIVE client with ACTIVE HOT plan (meal_count 2) and one SCHEDULED delivery on 2026-03-02."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
            - call: "POST /deliveries/${del1}/complete"
              payload: { outcome: "DELIVERED" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /deliveries/${del1}/void"
              payload: {}
              as: RouteManager
          assert:
            - "after DELIVERED: Client.lifetime_oaa_units == 2"
            - "after VOID: Client.lifetime_oaa_units == 0 and Delivery.${del1}.oaa_units_accrued == 0"
            - "invariant holds: lifetime_oaa_units == sum(meal_count where status == DELIVERED) == 0"

      - name: donation_balance_conserved_on_record_then_void
        grounds:
          - state_machines.Contribution.RECORDED_to_VOIDED
          - entities.Client.donation_balance_cents
          - calculations.donation_balance_reconciliation
        distinguishing_aspect: |
          Conserved quantity = donation money (cents), a different quantity than
          OAA units. Invariant pinned as Client.donation_balance_cents ==
          sum(c.amount_cents for c where c.status == RECORDED). Recording 5000
          then voiding subtracts exactly 5000; balance returns to 0 with no drift.
        test_recipe:
          setup:
            - "An INTAKE client with donation_balance_cents 0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/contributions"
              payload: { amount_cents: 5000, period_month: "2026-03" }
              as: ContributionClerk
              captures: { contrib_id: $.data.id }
          trigger:
            - call: "POST /contributions/${contrib_id}/void"
              payload: {}
              as: ContributionClerk
          assert:
            - "after record: Client.donation_balance_cents == 5000"
            - "after void: Client.donation_balance_cents == 0 and Contribution.${contrib_id}.status == VOIDED"
            - "invariant holds: donation_balance_cents == sum(amount_cents where status == RECORDED) == 0"
