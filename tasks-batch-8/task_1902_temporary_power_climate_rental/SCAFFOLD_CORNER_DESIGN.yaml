              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_ca}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_ca: $.data.id, con_ca_v: $.data.version }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_ca}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_ca_v}" }
              as: SalesEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EMISSIONS_TIER_NONCOMPLIANT (422); no line created; unit remains AVAILABLE"

      - name: kit_undersized_then_adequate
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=7]", "errors[ERR_KIT_UNDERSIZED]", calculations.accessory_ampacity_requirement]
        distinguishing_aspect: "Sized 275 kW requires 331 A: one 200 A kit (200 < 331) fails with ERR_KIT_UNDERSIZED; quantity 2 (400 >= 331) succeeds."
        test_recipe:
          setup: ["Customer C1, Site S1 (TX-TCEQ), Kit K200 (200 A); contract K1 DRAFT with load_profile [(CONTINUOUS, 220)] -> sized 275"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/accessory-kits"
              payload: { kit_code: "CABLE-200A", description: "200A cable kit", max_ampacity_a: 200, day_rate_cents: 2000, week_rate_cents: 10000, month_rate_cents: 32000 }
              as: DepotManager
              captures: { kit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 220 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version, sized: $.data.sized_kw }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "ACCESSORY_KIT", accessory_kit_id: "${kit_id}", quantity: 1, expected_rental_contract_version: "${con_v}" }
