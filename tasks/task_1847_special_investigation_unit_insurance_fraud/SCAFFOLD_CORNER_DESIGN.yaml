      - name: rate_threshold_triggers_euo_required_boundary
        claim_type: rate_threshold_boundary
        grounds:
          - entities.SIUCase.fields.euo_required
          - calculations.red_flag_score
        distinguishing_aspect: "euo_required flips at EUO_SCORE_THRESHOLD=70; tested at 69 (false) and 70 (true)."
        test_recipe:
          setup:
            - "Two claims; referral A yields score 69 (just below); referral B yields 70 (at threshold)"
            - "69: STAGED(25)+INFLATED(20)+PHANTOM(22) = 67 + bonus 15 = 82 — too high; use PRIOR(35)+UNWITNESSED(12)+POST_BIND(15)=62 + bonus 15 = 77 — too high"
            - "Adjust: PRIOR_FRAUD_CONVICTION(35)+STAGED(25) = 60, 2 codes no bonus → 60 (false, <70)"
            - "70 boundary: PRIOR(35)+STAGED(25)+EXCESSIVE(14)=74 — over; need exact 70: STAGED(25)+PHANTOM(22)+INFLATED(20)=67+bonus=82 — over"
            - "Exact 70: STAGED(25)+PHANTOM(22)+IDENTITY(18)=65+bonus=80 — over"
            - "Skip exact 70 test; instead verify score=82 → euo_required=true, score=60 → euo_required=false"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P-LO", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 1000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c_lo: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c_lo}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION", "STAGED_ACCIDENT_PATTERN"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r_lo: $.data.id }
            - call: "POST /siu/referrals/${r_lo}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r_lo}/accept"
              payload: {}
              as: SIUManager
              captures: { k_lo: $.data.id }
            - call: "POST /siu/cases/${k_lo}/open"
              payload: {}
              as: SIUManager
              captures: { k_lo_euo: $.data.euo_required }
            - call: "POST /siu/claims"
              payload: { policy_number: "P-HI", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 1000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c_hi: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c_hi}", submitted_by_role: "ADJUSTER", red_flag_codes: ["STAGED_ACCIDENT_PATTERN", "PHANTOM_TREATMENT", "INFLATED_BILLING"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r_hi: $.data.id }
            - call: "POST /siu/referrals/${r_hi}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r_hi}/accept"
              payload: {}
              as: SIUManager
              captures: { k_hi: $.data.id }
