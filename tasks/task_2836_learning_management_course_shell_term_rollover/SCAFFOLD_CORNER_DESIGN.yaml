              as: Registrar
              captures: { s2: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6113", full_name: "Learner 3", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s3: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6114", full_name: "Learner 4", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s4: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6115", full_name: "Learner 5", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s5: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6116", full_name: "Learner 6", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s6: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6117", full_name: "Learner 7", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s7: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1}", role: "STUDENT" }
              as: Registrar
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s2}", role: "STUDENT" }
              as: Registrar
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s3}", role: "STUDENT" }
              as: Registrar
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s4}", role: "STUDENT" }
              as: Registrar
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s5}", role: "STUDENT" }
              as: Registrar
              captures: { active5: $.data.enrollment_state }
          trigger:
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s6}", role: "STUDENT" }
              as: Registrar
              captures: { err_normal: $.data.error_id }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "storm watch" }
              as: LmsAdmin
