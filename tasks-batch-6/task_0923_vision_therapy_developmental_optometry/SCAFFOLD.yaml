scenario: "923. Vision Therapy & Developmental Optometry: evaluation & binocular assessment, therapy plan & in-office/home sessions, progress & reassessment, medical vs vision billing, activity/equipment kit, scheduling & therapist, discharge, referral"
domain_name: "vision-therapy-developmental-optometry"
api_prefix: "/vision-therapy"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

  design_notes: |
    The quota is the prior-authorization visit pool: an Authorization grants N in-office visits
    inside a date window, sessions consume units, cancellations return units, and the four
    counters must satisfy a conservation identity at every observable instant.

    The ledger layer is the medical-vs-vision billing fork: the identical encounter produces a
    completely different money breakdown depending on the payer_type of the Coverage the claim
    is filed against (deductible-then-coinsurance against an allowed amount, vs a materials/
    service allowance with a frequency limit).

    A GLOBAL CLINICAL WRITE GATE (validation rung 12, ERR_PATIENT_DISCHARGED) freezes the
    clinical write family once a Patient reaches DISCHARGED. It deliberately does NOT cover the
    whole surface: `POST /vision-therapy/claims*` (all five claim endpoints),
    `POST /vision-therapy/kit-loans/{id}/return`, `POST /vision-therapy/referrals/{id}/respond`,
    `POST /vision-therapy/authorizations/{id}/close`, `POST /vision-therapy/coverages`,
    `POST /vision-therapy/patients/{id}/discharge` itself, every GET, every configuration POST
    (payers / therapists / rooms / kit-items) and the logical-clock endpoint all sit OUTSIDE the
    gated family. That exclusion list is what keeps rungs 13-36 reachable at all: if the gate
    covered everything, rungs below it could never be observed on a discharged patient, and the
    lower business rungs would only ever be reachable through the non-gated endpoints. Both
    facts are load-bearing and are asserted by tests.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD). Drives every age-derived reference band."
      - name: diagnosis_category
        type: enum
        source: input
        description: "Diagnosis family; selects the composite-progress-score weight set and variant."
        constraints: "one of CONVERGENCE_INSUFFICIENCY, ACCOMMODATIVE_DYSFUNCTION, OCULOMOTOR_DYSFUNCTION, AMBLYOPIA"
      - name: guardian_name
        type: string
        source: input
        description: "Responsible adult for a minor; optional."
        default: null
      - name: clinical_status
        type: enum
        source: computed
        description: "Lifecycle axis. INTAKE at creation; ACTIVE once the first EVALUATION assessment is SIGNED; DISCHARGED closes the clinical write family."
        default: "INTAKE"
        constraints: "one of INTAKE, ACTIVE, DISCHARGED"
      - name: discharge_reason
        type: enum
        source: input
        description: "Set only by POST /vision-therapy/patients/{id}/discharge."
        default: null
        constraints: "one of GOALS_MET, PLATEAU, NON_COMPLIANCE, TRANSFERRED, LOST_TO_FOLLOW_UP"
      - name: discharged_at
        type: datetime
        source: system
        description: "Logical-clock instant at which discharge committed."
        default: null
      - name: discharged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Optometrist who performed the discharge."
        default: null

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Payer trade name."
      - name: payer_type
        type: enum
        source: input
        description: "Selects the claim adjudication variant: MEDICAL uses deductible-then-coinsurance, VISION uses allowance-and-frequency."
        constraints: "one of MEDICAL, VISION"
      - name: allowed_amount_timed_unit
        type: number
        source: input
        description: "MEDICAL contracted allowed amount per timed therapeutic-activity unit, 2 dp."
      - name: allowed_amount_flat_session
        type: number
        source: input
        description: "MEDICAL contracted allowed amount for one flat orthoptic-training session, 2 dp."
      - name: allowed_amount_evaluation
        type: number
        source: input
        description: "MEDICAL contracted allowed amount for one evaluation/reassessment encounter, 2 dp."
      - name: coinsurance_rate
        type: number
        source: input
        description: "MEDICAL patient coinsurance fraction applied after the deductible, 0.00-1.00."
      - name: frequency_limit_months
        type: integer
        source: input
        description: "VISION minimum whole months between two paid services of the same service_class."

  - name: Coverage
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the covered patient."
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; supplies payer_type and the adjudication variant."
      - name: member_number
        type: string
        source: input
        description: "Subscriber id on the card."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at creation; TERMINATED once the logical clock passes effective_end_date."
        default: "ACTIVE"
        constraints: "one of ACTIVE, TERMINATED"
      - name: effective_start_date
        type: string
        source: input
        description: "ISO 8601 date, inclusive."
      - name: effective_end_date
        type: string
        source: input
        description: "ISO 8601 date, inclusive."
      - name: deductible_total
        type: number
        source: input
        description: "MEDICAL annual deductible, 2 dp."
        default: 0.00
      - name: deductible_met
        type: number
        source: input
        description: "MEDICAL deductible dollars already satisfied; incremented by every PAID medical claim."
        default: 0.00
      - name: vision_allowance_total
        type: number
        source: input
        description: "VISION per-period service/materials allowance in dollars, 2 dp."
        default: 0.00
      - name: vision_allowance_used
        type: number
        source: computed
        description: "Sum of plan_paid_amount over PAID claims filed against this VISION coverage."
        default: 0.00
      - name: vision_allowance_remaining
        type: number
        source: computed
        description: "vision_allowance_total - vision_allowance_used; conserved quantity."
        default: 0.00
      - name: last_paid_service_date_therapy
        type: string
        source: input
        description: "ISO 8601 date of the last PAID claim with service_class THERAPY_SESSION; null when none."
        default: null
      - name: last_paid_service_date_evaluation
        type: string
        source: input
        description: "ISO 8601 date of the last PAID claim with service_class EVALUATION; null when none."
        default: null

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id."
      - name: coverage_id
        type: string
        source: input
        description: "FK -> Coverage.id; the coverage the visit pool is granted under."
      - name: auth_number
        type: string
        source: input
        description: "Payer-issued authorization number."
      - name: visits_authorized
        type: integer
        source: input
        description: "Cumulative in-office visit units granted; increased by reauthorize."
      - name: visits_consumed
        type: integer
        source: computed
        description: "Cumulative units taken by in-office sessions; never decremented."
        default: 0
      - name: visits_released
        type: integer
        source: computed
        description: "Cumulative units returned to the pool by session cancellation; never decremented."
        default: 0
      - name: visits_remaining
        type: integer
        source: computed
        description: "visits_authorized - visits_consumed + visits_released."
        default: 0
      - name: window_start_date
        type: string
        source: input
        description: "ISO 8601 date; first date a session may be scheduled, inclusive."
      - name: window_end_date
        type: string
        source: input
        description: "ISO 8601 date; last date a session may be scheduled, inclusive."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while visits_remaining > 0; EXHAUSTED at 0; CLOSED terminal; EXPIRED once the clock passes window_end_date."
        default: "ACTIVE"
        constraints: "one of ACTIVE, EXHAUSTED, EXPIRED, CLOSED"
      - name: reauthorization_count
        type: integer
        source: computed
        description: "Number of successful reauthorize calls."
        default: 0
      - name: last_reauthorized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the last successful reauthorize."
        default: null
      - name: close_reason
        type: enum
        source: input
        description: "Recorded by close, or PATIENT_DISCHARGED when set by the discharge cascade."
        default: null
        constraints: "one of PAYER_TERMINATED, EPISODE_COMPLETE, PATIENT_DISCHARGED"

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Clinician name."
      - name: credential
        type: enum
        source: input
        description: "OPTOMETRIST may sign assessments and supervise; VISION_THERAPY_ASSISTANT sessions require documented supervision."
        constraints: "one of OPTOMETRIST, CERTIFIED_VISION_THERAPIST, VISION_THERAPY_ASSISTANT"
      - name: credential_expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant; a session whose scheduled_start_at or performed_at is at or after this instant is refused."
      - name: npi
        type: string
        source: input
        description: "National provider identifier; optional."
        default: null

  - name: TherapyRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Room label."
      - name: equipment_class
        type: enum
        source: input
        description: "Fixed-equipment class of the room."
        constraints: "one of STANDARD, VECTOGRAM_SUITE, COMPUTER_ORTHOPTICS"
  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id."
      - name: plan_id
        type: string
        source: input
        description: "FK -> TherapyPlan.id; null for the initial EVALUATION, required for a REASSESSMENT."
        default: null
      - name: performed_by_therapist_id
        type: string
        source: input
        description: "FK -> Therapist.id; who performed the battery."
      - name: signed_by_therapist_id
        type: string
        source: computed
        description: "FK -> Therapist.id; set from X-User-ID on sign. For assessment_type REASSESSMENT it MUST differ from performed_by_therapist_id."
        default: null
      - name: assessment_type
        type: enum
        source: input
        description: "EVALUATION is the intake battery; REASSESSMENT is a progress battery on an existing plan."
        constraints: "one of EVALUATION, REASSESSMENT"
      - name: purpose
        type: enum
        source: input
        description: "Data-driven fork selecting the accommodative-amplitude reference variant: DIAGNOSTIC and PROGRESS use the STANDARD band, DISCHARGE_READINESS uses the narrower FUNCTIONAL band."
        constraints: "one of DIAGNOSTIC, PROGRESS, DISCHARGE_READINESS"
      - name: encounter_date
        type: string
        source: input
        description: "ISO 8601 date of the battery; the age used by every reference band is the patient's age on this date."
      - name: patient_age_years
        type: integer
        source: computed
        description: "Whole calendar years from Patient.date_of_birth to encounter_date; computed at assessment creation."
      - name: status
        type: enum
        source: computed
        description: "DRAFT at creation; FINALIZED after finalize; SIGNED after sign; amend returns a SIGNED row to DRAFT."
        default: "DRAFT"
        constraints: "one of DRAFT, FINALIZED, SIGNED"
      - name: amendment_count
        type: integer
        source: computed
        description: "Number of successful amend calls; capped at MAX_ASSESSMENT_AMENDMENTS = 2."
        default: 0
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent successful sign."
        default: null
      - name: therapy_indicated
        type: boolean
        source: computed
        description: "Set at finalize: true when the NPC measurement breaches a diagnostic threshold or the amplitude falls below the STANDARD expected minimum."
        default: false
      - name: discharge_metric_met
        type: boolean
        source: computed
        description: "Set at finalize: true when every discharge threshold is satisfied (see calculation npc_threshold_evaluation and the FUNCTIONAL amplitude band)."
        default: false
      - name: composite_progress_score
        type: number
        source: computed
        description: "0.00-100.00, set at finalize for assessment_type REASSESSMENT only; null on EVALUATION."
        default: null
      - name: symptom_improvement_pct
        type: number
        source: computed
        description: "0.00-100.00 CISS improvement versus the plan baseline; null on EVALUATION."
        default: null
      - name: improvement_delta_points
        type: number
        source: computed
        description: "composite_progress_score minus the score of the previous SIGNED REASSESSMENT on the same plan; null when there is no previous one."
        default: null
      - name: plateau_flag
        type: boolean
        source: computed
        description: "True when this reassessment is the PLATEAU_CONSECUTIVE_COUNT-th consecutive one whose improvement_delta_points is below PLATEAU_DELTA_POINTS."
        default: false
      - name: red_flag_present
        type: boolean
        source: computed
        description: "True when any child BinocularMeasurement carries red_flag = true; drives the urgent outbound-referral cascade at finalize."
        default: false

  - name: BinocularMeasurement
    parent: Assessment
    common_fields: false
    fields:
      - name: assessment_id
        type: string
        source: system
        description: "FK -> Assessment.id; taken from the path, never from the body."
      - name: metric_code
        type: enum
        source: input
        description: "Which instrument reading this row carries."
        constraints: "one of NPC, ACCOMMODATIVE_AMPLITUDE, VERGENCE_BASE_OUT, VISUAL_ACUITY, SYMPTOM_SURVEY"
      - name: eye
        type: enum
        source: input
        description: "Laterality of the reading."
        constraints: "one of OD, OS, OU"
      - name: npc_break_cm
        type: number
        source: input
        description: "Near point of convergence BREAK distance in cm; required when metric_code = NPC."
        default: null
      - name: npc_recovery_cm
        type: number
        source: input
        description: "Near point of convergence RECOVERY distance in cm; required when metric_code = NPC. Second threshold on the same instrument reading."
        default: null
      - name: amplitude_d
        type: number
        source: input
        description: "Accommodative amplitude in dioptres; required when metric_code = ACCOMMODATIVE_AMPLITUDE."
        default: null
      - name: vergence_bo_break_pd
        type: number
        source: input
        description: "Base-out vergence break in prism dioptres; required when metric_code = VERGENCE_BASE_OUT."
        default: null
      - name: acuity_logmar
        type: number
        source: input
        description: "Best-corrected acuity in logMAR; required when metric_code = VISUAL_ACUITY."
        default: null
      - name: ciss_score
        type: integer
        source: input
        description: "Convergence Insufficiency Symptom Survey raw score 0-60; required when metric_code = SYMPTOM_SURVEY."
        default: null
      - name: red_flag
        type: boolean
        source: input
        description: "Clinician-marked red flag (for example acute-onset diplopia or suspected papilloedema)."
        default: false
      - name: reference_variant
        type: enum
        source: computed
        description: "STANDARD when the parent assessment purpose is DIAGNOSTIC or PROGRESS, FUNCTIONAL when it is DISCHARGE_READINESS. Only meaningful for metric_code ACCOMMODATIVE_AMPLITUDE."
        default: null
        constraints: "one of STANDARD, FUNCTIONAL"
      - name: expected_min_value
        type: number
        source: computed
        description: "Age-derived lower edge of the reference band for metric_code ACCOMMODATIVE_AMPLITUDE; null for every other metric_code."
        default: null
      - name: expected_band_high
        type: number
        source: computed
        description: "expected_min_value plus the variant band width; null for every other metric_code."
        default: null
      - name: within_reference_band
        type: boolean
        source: computed
        description: "True when expected_min_value <= amplitude_d <= expected_band_high; null-safe false when the band does not apply."
        default: false
      - name: diagnostic_flag
        type: boolean
        source: computed
        description: "True when this row on its own breaches a diagnostic threshold (see calculation npc_threshold_evaluation and accommodative_amplitude_reference_band)."
        default: false

  - name: TherapyPlan
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id."
      - name: source_assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the SIGNED EVALUATION whose measurements become the plan baselines."
      - name: authorization_id
        type: string
        source: computed
        description: "FK -> Authorization.id; bound at activate, null while DRAFT."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle axis."
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, UNDER_REVISION, COMPLETED, DISCHARGED"
      - name: progress_state
        type: enum
        source: computed
        description: "Second, independent axis on the same row; recomputed at every REASSESSMENT finalize."
        default: "ON_TRACK"
        constraints: "one of ON_TRACK, PLATEAU, REVISION_PENDING, DISCHARGE_PENDING"
      - name: discharge_criteria_mode
        type: enum
        source: input
        description: "Data-driven fork selecting the discharge-readiness variant: METRIC uses the binocular thresholds, GOAL uses the composite score plus symptom improvement."
        constraints: "one of METRIC, GOAL"
      - name: current_phase_index
        type: integer
        source: computed
        description: "1-based index of the PlanPhase currently IN_PROGRESS."
        default: 1
      - name: prescribed_home_sessions_per_week
        type: integer
        source: input
        description: "Home-practice prescription in effect now; denominator source for home_compliance_pct."
      - name: previous_prescribed_home_sessions_per_week
        type: integer
        source: computed
        description: "Value in effect before the most recent revise; null when never revised."
        default: null
      - name: prescription_changed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent prescription change; pins which denominator the compliance window uses."
        default: null
      - name: cumulative_therapy_minutes
        type: number
        source: computed
        description: "Weighted therapy minutes across all COMPLETED in-office and ATTESTED home sessions on this plan."
        default: 0.0
      - name: home_compliance_pct
        type: number
        source: computed
        description: "0.00-100.00 attested home-session compliance over the trailing COMPLIANCE_WINDOW_DAYS window."
        default: 0.00
      - name: revision_count
        type: integer
        source: computed
        description: "Number of successful revise calls."
        default: 0
      - name: consecutive_low_delta_count
        type: integer
        source: computed
        description: "Running count of consecutive SIGNED REASSESSMENTs whose improvement_delta_points is below PLATEAU_DELTA_POINTS; reset to 0 by any reassessment at or above it."
        default: 0
      - name: suspension_reason
        type: enum
        source: computed
        description: "Why the plan is SUSPENDED; null otherwise."
        default: null
        constraints: "one of RED_FLAG_REFERRAL, CLINICIAN_HOLD"
      - name: discharge_ready
        type: boolean
        source: computed
        description: "Output of the dual-variant discharge_readiness_determination calculation; recomputed at every assessment finalize."
        default: false
      - name: baseline_npc_break_cm
        type: number
        source: computed
        description: "NPC break from the source assessment; null when the source assessment has no NPC row."
        default: null
      - name: baseline_amplitude_d
        type: number
        source: computed
        description: "Accommodative amplitude from the source assessment; null when absent."
        default: null
      - name: baseline_vergence_bo_break_pd
        type: number
        source: computed
        description: "Base-out vergence break from the source assessment; null when absent."
        default: null
      - name: baseline_acuity_logmar
        type: number
        source: computed
        description: "Acuity from the source assessment; null when absent."
        default: null
      - name: baseline_ciss_score
        type: integer
        source: computed
        description: "CISS score from the source assessment; null when absent."
        default: null

  - name: PlanPhase
    parent: TherapyPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> TherapyPlan.id; taken from the path, never from the body."
      - name: sequence_index
        type: integer
        source: input
        description: "1-based ordinal; unique per plan; phases advance strictly in ascending sequence_index."
      - name: name
        type: string
        source: input
        description: "Phase label."
      - name: required_mastery_count
        type: integer
        source: input
        description: "Number of activities that must be mastered before the plan may advance out of this phase."
      - name: activities_mastered_count
        type: integer
        source: computed
        description: "Running mastery tally; incremented by POST /vision-therapy/phases/{id}/mastery and by session completion."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "LOCKED until reached; IN_PROGRESS while current; MASTERED once advanced past. Regression returns a MASTERED phase to IN_PROGRESS."
        default: "LOCKED"
        constraints: "one of LOCKED, IN_PROGRESS, MASTERED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the phase most recently became IN_PROGRESS."
        default: null
      - name: mastered_at
        type: datetime
        source: system
        description: "Logical-clock instant the phase most recently became MASTERED; cleared on regression."
        default: null
  - name: TherapySession
    parent: TherapyPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> TherapyPlan.id; taken from the path, never from the body."
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; copied from the plan at creation."
      - name: therapist_id
        type: string
        source: input
        description: "FK -> Therapist.id; the clinician running the session. Null on HOME sessions."
        default: null
      - name: room_id
        type: string
        source: input
        description: "FK -> TherapyRoom.id; the booked room. Null on HOME sessions."
        default: null
      - name: authorization_id
        type: string
        source: system
        description: "FK -> Authorization.id; copied from the plan at creation for IN_OFFICE sessions. Null on HOME sessions."
        default: null
      - name: supervising_optometrist_id
        type: string
        source: input
        description: "FK -> Therapist.id; the on-site supervising optometrist documented at completion. Required when the running therapist's credential is VISION_THERAPY_ASSISTANT."
        default: null
      - name: modality
        type: enum
        source: computed
        description: "IN_OFFICE for sessions created under /sessions, HOME for sessions created under /home-sessions."
        constraints: "one of IN_OFFICE, HOME"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start instant; null on HOME sessions."
        default: null
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end instant, exclusive; null on HOME sessions."
        default: null
      - name: performed_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the work actually happened; supplied at completion (IN_OFFICE) or at logging (HOME)."
        default: null
      - name: timed_minutes
        type: integer
        source: input
        description: "Direct therapeutic-activity minutes delivered; drives the stepped timed-unit table."
        default: null
      - name: procedure_code
        type: enum
        source: input
        description: "Billing code. TIMED_THERAPEUTIC_ACTIVITY uses the stepped minutes-to-units table; FLAT_ORTHOPTIC_TRAINING always bills FLAT_UNIT_COUNT units; HOME_PRACTICE is never billable."
        constraints: "one of TIMED_THERAPEUTIC_ACTIVITY, FLAT_ORTHOPTIC_TRAINING, HOME_PRACTICE"
      - name: billable_units
        type: integer
        source: computed
        description: "Output of the dual-variant session_billable_units calculation; 0 until the session completes."
        default: 0
      - name: charge_amount
        type: number
        source: computed
        description: "billable_units multiplied by the code's clinic rate, 2 dp."
        default: 0.00
      - name: weighted_minutes
        type: number
        source: computed
        description: "timed_minutes for IN_OFFICE, timed_minutes * HOME_MINUTE_WEIGHT for HOME; summed into TherapyPlan.cumulative_therapy_minutes."
        default: 0.0
      - name: schedule_status
        type: enum
        source: computed
        description: "Scheduling axis. IN_OFFICE starts at SCHEDULED; HOME starts at LOGGED."
        constraints: "one of SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW, LOGGED, ATTESTED"
      - name: billing_status
        type: enum
        source: computed
        description: "Independent billing axis on the same row, evolving separately from schedule_status."
        default: "PENDING"
        constraints: "one of PENDING, BILLABLE, NON_BILLABLE, CLAIMED, SETTLED"
      - name: activities_mastered_delta
        type: integer
        source: input
        description: "Activities mastered during this session; added to the current PlanPhase tally at completion."
        default: 0
      - name: cancel_reason
        type: enum
        source: input
        description: "Why the session was cancelled; PLAN_SUSPENDED and PLAN_DISCHARGED are written by cascades."
        default: null
        constraints: "one of PATIENT_REQUEST, CLINIC_REQUEST, PLAN_SUSPENDED, PLAN_DISCHARGED"
      - name: attested_at
        type: datetime
        source: system
        description: "Logical-clock instant the patient attested a HOME session."
        default: null
      - name: attestation_statement
        type: string
        source: input
        description: "Free-text attestation supplied by the patient."
        default: null
      - name: activity_notes
        type: string
        source: input
        description: "Patient-supplied notes on the home activities performed."
        default: null

  - name: KitItem
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Catalogue name of the activity/equipment item."
      - name: item_class
        type: enum
        source: input
        description: "LOANABLE_SERIALIZED items are checked out and returned with a condition grade; CONSUMABLE_STOCK items are dispensed and never come back."
        constraints: "one of LOANABLE_SERIALIZED, CONSUMABLE_STOCK"
      - name: replacement_cost
        type: number
        source: input
        description: "New-replacement cost in dollars, 2 dp; base of the depreciation formula."
      - name: useful_life_months
        type: integer
        source: input
        description: "Straight-line depreciation life in whole months; must be >= 1."
      - name: in_service_date
        type: string
        source: input
        description: "ISO 8601 date the item entered service; months_in_service is measured from here."
      - name: initial_qty
        type: integer
        source: input
        description: "Quantity received; the conserved total for this item."
      - name: on_hand_qty
        type: integer
        source: computed
        description: "Units physically on the shelf."
        default: 0
      - name: on_loan_qty
        type: integer
        source: computed
        description: "Units currently CHECKED_OUT or RECALLED."
        default: 0
      - name: dispensed_qty
        type: integer
        source: computed
        description: "Units handed out as consumables and never expected back."
        default: 0
      - name: retired_qty
        type: integer
        source: computed
        description: "Units written off after a LOST return."
        default: 0

  - name: KitLoan
    parent: null
    common_fields: true
    fields:
      - name: kit_item_id
        type: string
        source: input
        description: "FK -> KitItem.id."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id."
      - name: plan_id
        type: string
        source: input
        description: "FK -> TherapyPlan.id; the plan the kit supports."
      - name: quantity
        type: integer
        source: input
        description: "Units requested; must be exactly 1 for LOANABLE_SERIALIZED items."
      - name: status
        type: enum
        source: computed
        description: "REQUESTED at creation; fulfil forks on item_class to CHECKED_OUT or DISPENSED; RECALLED is written by the red-flag cascade."
        default: "REQUESTED"
        constraints: "one of REQUESTED, CHECKED_OUT, DISPENSED, RECALLED, RETURNED, CANCELLED"
      - name: checked_out_at
        type: datetime
        source: system
        description: "Logical-clock instant of fulfilment."
        default: null
      - name: due_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the item is due back; only meaningful for LOANABLE_SERIALIZED."
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant of return."
        default: null
      - name: returned_condition
        type: enum
        source: input
        description: "Condition grade recorded at return; selects the damage-fee multiplier."
        default: null
        constraints: "one of GOOD, FAIR, DAMAGED, LOST"
      - name: damage_fee_amount
        type: number
        source: computed
        description: "Output of the kit_damage_fee calculation, 2 dp."
        default: 0.00
      - name: recall_due_at
        type: datetime
        source: system
        description: "Logical-clock instant plus KIT_RECALL_DUE_DAYS, stamped by the recall cascade."
        default: null
      - name: recalled_at
        type: datetime
        source: system
        description: "Logical-clock instant the recall notice fired."
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID that fulfilled the loan."
        default: null

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id."
      - name: coverage_id
        type: string
        source: input
        description: "FK -> Coverage.id; its payer's payer_type selects the adjudication variant."
      - name: session_id
        type: string
        source: input
        description: "FK -> TherapySession.id; set when service_class is THERAPY_SESSION, otherwise null."
        default: null
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; set when service_class is EVALUATION, otherwise null."
        default: null
      - name: service_class
        type: enum
        source: input
        description: "Which frequency bucket and which rate the claim draws on."
        constraints: "one of THERAPY_SESSION, EVALUATION"
      - name: service_date
        type: string
        source: input
        description: "ISO 8601 date of service; drives the VISION frequency test."
      - name: procedure_code
        type: enum
        source: computed
        description: "Copied from the session (THERAPY_SESSION) or fixed to EVALUATION_ENCOUNTER (EVALUATION)."
        constraints: "one of TIMED_THERAPEUTIC_ACTIVITY, FLAT_ORTHOPTIC_TRAINING, EVALUATION_ENCOUNTER"
      - name: units
        type: integer
        source: computed
        description: "Copied from TherapySession.billable_units, or 1 for an EVALUATION claim; overwritten by correct."
        default: 0
      - name: billed_amount
        type: number
        source: computed
        description: "units multiplied by the clinic rate for procedure_code, 2 dp."
        default: 0.00
      - name: allowed_amount
        type: number
        source: computed
        description: "Variant-specific allowed amount, set at adjudication."
        default: 0.00
      - name: contractual_adjustment_amount
        type: number
        source: computed
        description: "billed_amount minus allowed_amount, floored at 0.00."
        default: 0.00
      - name: deductible_applied_amount
        type: number
        source: computed
        description: "MEDICAL only; 0.00 under the VISION variant."
        default: 0.00
      - name: coinsurance_amount
        type: number
        source: computed
        description: "MEDICAL only; 0.00 under the VISION variant."
        default: 0.00
      - name: plan_paid_amount
        type: number
        source: computed
        description: "Payer share, 2 dp."
        default: 0.00
      - name: patient_responsibility_amount
        type: number
        source: computed
        description: "Patient share, 2 dp."
        default: 0.00
      - name: denied_amount
        type: number
        source: computed
        description: "Allowed dollars withheld on a DENIED adjudication, 2 dp."
        default: 0.00
      - name: adjudication_variant
        type: enum
        source: computed
        description: "Which arm of claim_adjudication_amounts ran; stamped at adjudication."
        default: null
        constraints: "one of MEDICAL, VISION"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle with a capped appeal loop."
        default: "DRAFT"
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED, REJECTED, PAID, DENIED"
      - name: appeal_count
        type: integer
        source: computed
        description: "Successful appeals; capped at MAX_APPEAL_ATTEMPTS = 2."
        default: 0
      - name: appeal_attempt_log_count
        type: integer
        source: computed
        description: "Every appeal call increments this BEFORE the cap is enforced, so a refused appeal still leaves a durable trace."
        default: 0
      - name: last_appeal_attempt_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent appeal call, successful or refused."
        default: null
      - name: correction_count
        type: integer
        source: computed
        description: "Number of successful correct calls."
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID that submitted the claim; a correction MUST come from a different X-User-ID."
        default: null
      - name: denial_reason
        type: string
        source: input
        description: "Payer denial narrative recorded at adjudication."
        default: null

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id."
      - name: plan_id
        type: string
        source: input
        description: "FK -> TherapyPlan.id; the plan suspended by an URGENT outbound referral, null otherwise."
        default: null
      - name: triggering_assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the finalized assessment whose red flag produced this referral, null for a manually created one."
        default: null
      - name: direction
        type: enum
        source: input
        description: "INBOUND is a referral received by the clinic; OUTBOUND is one the clinic sends."
        constraints: "one of INBOUND, OUTBOUND"
      - name: urgency
        type: enum
        source: input
        description: "Selects the response-due SLA: URGENT uses URGENT_REFERRAL_SLA_HOURS, ROUTINE uses ROUTINE_REFERRAL_SLA_HOURS."
        constraints: "one of ROUTINE, URGENT"
      - name: referring_provider_name
        type: string
        source: input
        description: "Name of the sending provider."
      - name: target_provider_name
        type: string
        source: input
        description: "Name of the receiving provider; rewritten by each re-refer."
      - name: reason
        type: string
        source: input
        description: "Clinical reason for the referral."
      - name: status
        type: enum
        source: computed
        description: "SENT at creation; a DECLINED referral may be re-sent up to MAX_REFERRAL_ATTEMPTS times, after which it is ABANDONED."
        default: "SENT"
        constraints: "one of SENT, ACCEPTED, DECLINED, ABANDONED"
      - name: sla_due_at
        type: datetime
        source: computed
        description: "Creation instant plus the urgency's SLA hours; recomputed on every re-refer."
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent respond call."
        default: null
      - name: response_outcome
        type: enum
        source: input
        description: "Outcome recorded by respond."
        default: null
        constraints: "one of ACCEPTED, DECLINED"
      - name: decline_reason
        type: string
        source: input
        description: "Narrative recorded when response_outcome is DECLINED."
        default: null
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of times this referral has been sent; starts at 1 and is capped at MAX_REFERRAL_ATTEMPTS = 3."
        default: 1
      - name: sla_breached
        type: boolean
        source: computed
        description: "True when responded_at is strictly after sla_due_at, or when the logical clock has passed sla_due_at while status is still SENT."
        default: false

  - name: OcclusionPrescription
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id."
      - name: source_assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the SIGNED assessment that justified patching."
      - name: severity
        type: enum
        source: input
        description: "Amblyopia severity; second axis of the stepped dose ladder."
        constraints: "one of MILD, MODERATE, SEVERE"
      - name: age_band
        type: enum
        source: computed
        description: "YOUNG when age < 4, SCHOOL when 4 <= age <= 7, OLDER when age >= 8; computed from the source assessment's patient_age_years."
        constraints: "one of YOUNG, SCHOOL, OLDER"
      - name: prescribed_daily_hours
        type: integer
        source: computed
        description: "Initial dose from the age-band x severity ladder, capped at OCCLUSION_MAX_DAILY_HOURS."
        default: 0
      - name: current_daily_hours
        type: integer
        source: computed
        description: "Dose in effect now; reduced by TAPER_STEP_HOURS on each accepted taper."
        default: 0
      - name: taper_step_count
        type: integer
        source: computed
        description: "Number of accepted taper steps."
        default: 0
      - name: logged_days
        type: integer
        source: computed
        description: "Total patching days logged."
        default: 0
      - name: adherent_days
        type: integer
        source: computed
        description: "Logged days on which the full dose was worn."
        default: 0
      - name: adherence_pct
        type: number
        source: computed
        description: "0.00-100.00; adherent_days over logged_days, 0.00 when logged_days is 0."
        default: 0.00
      - name: baseline_acuity_logmar
        type: number
        source: input
        description: "Acuity of the amblyopic eye at prescription; the taper gate measures improvement from here."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at creation; TAPERED after each accepted step; COMPLETED when the dose reaches 0; DISCONTINUED by the discharge cascade."
        default: "ACTIVE"
        constraints: "one of ACTIVE, TAPERED, COMPLETED, DISCONTINUED"

# =============================================================================
# §1.2 State Machine Table
#   12 axes over 11 entities. Only Patient.clinical_status is a linear pipeline;
#   the other 11 axes are cyclic, branching, capped-retry, or a second
#   independent axis living on a row that already carries one.
# =============================================================================
state_machines:

  # ---- axis 1: Patient.clinical_status (linear) ----------------------------
  - entity: Patient
    axis: clinical_status
    shape: linear
    initial_state: INTAKE
    terminal_states: [DISCHARGED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /vision-therapy/assessments/{id}/sign on an assessment whose assessment_type is EVALUATION"
        actor: Optometrist
        preconditions:
          - "assessment.assessment_type == EVALUATION"
          - "assessment.status == FINALIZED"
          - "patient.clinical_status == INTAKE"
        side_effects:
          - "Patient.clinical_status := ACTIVE"
          - "increments Patient.version by 1"
        note: "A second signed EVALUATION on an already ACTIVE patient leaves clinical_status unchanged."

      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /vision-therapy/patients/{id}/discharge"
        actor: Optometrist
        preconditions:
          - "patient.clinical_status == ACTIVE"
          - "no KitLoan for this patient has status IN {CHECKED_OUT, RECALLED} (rung 27)"
          - "the discharge_reason's own precondition holds (rung 35, see calculation discharge_readiness_determination and §1.4 rung 35)"
        side_effects:
          - "Patient.clinical_status := DISCHARGED; discharge_reason, discharged_at, discharged_by_user_id stamped"
          - "CASCADE-B hop 1: every TherapyPlan of this patient whose status IN {DRAFT, ACTIVE, SUSPENDED, UNDER_REVISION} -> DISCHARGED"
          - "every OcclusionPrescription of this patient whose status IN {ACTIVE, TAPERED} -> DISCONTINUED (direct fan-out, not part of CASCADE-B)"
          - "increments Patient.version by 1"
        note: "This endpoint is deliberately OUTSIDE the clinical write gate so a second discharge is refused by rung 14 (ERR_INVALID_STATE), not by rung 12."

  # ---- axis 2: Assessment.status (cyclic, capped) --------------------------
  - entity: Assessment
    axis: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /vision-therapy/assessments/{id}/finalize"
        actor: Optometrist | VisionTherapist
        preconditions:
          - "assessment.status == DRAFT"
          - "at least one child BinocularMeasurement with metric_code == NPC exists"
          - "patient.clinical_status != DISCHARGED (rung 12)"
        side_effects:
          - "computes BinocularMeasurement.diagnostic_flag / within_reference_band for every child row"
          - "Assessment.therapy_indicated, discharge_metric_met, red_flag_present recomputed"
          - "for assessment_type == REASSESSMENT: composite_progress_score, symptom_improvement_pct, improvement_delta_points, plateau_flag recomputed"
          - "for assessment_type == REASSESSMENT: TherapyPlan.progress_state and TherapyPlan.consecutive_low_delta_count recomputed (axis 4)"
          - "for assessment_type == REASSESSMENT with composite_progress_score < REGRESSION_SCORE_THRESHOLD and plan.current_phase_index > 1: plan regresses one phase (axis 5 MASTERED -> IN_PROGRESS)"
          - "TherapyPlan.discharge_ready recomputed via discharge_readiness_determination"
          - "CASCADE-A hop 1: when red_flag_present is true, a Referral is created with direction OUTBOUND, urgency URGENT, status SENT, triggering_assessment_id = this assessment, plan_id = assessment.plan_id"
          - "increments Assessment.version by 1"

      - from: FINALIZED
        to: SIGNED
        trigger: "POST /vision-therapy/assessments/{id}/sign"
        actor: Optometrist
        preconditions:
          - "assessment.status == FINALIZED"
          - "for assessment_type == REASSESSMENT: X-User-ID != assessment.performed_by_therapist_id (rung 17)"
        side_effects:
          - "Assessment.signed_by_therapist_id := X-User-ID; signed_at := clock"
          - "when assessment_type == EVALUATION and patient.clinical_status == INTAKE: Patient.clinical_status -> ACTIVE (axis 1)"
          - "increments Assessment.version by 1"

      - from: SIGNED
        to: DRAFT
        trigger: "POST /vision-therapy/assessments/{id}/amend"
        actor: Optometrist
        preconditions:
          - "assessment.status == SIGNED"
          - "assessment.amendment_count < MAX_ASSESSMENT_AMENDMENTS (2)"
        side_effects:
          - "Assessment.amendment_count += 1; signed_by_therapist_id := null; signed_at := null"
          - "increments Assessment.version by 1"
        note: "Capped revision loop DRAFT -> FINALIZED -> SIGNED -> DRAFT. A third amend is refused with ERR_INVALID_STATE (rung 14)."

  # ---- axis 3: TherapyPlan.status (cyclic + branching) ---------------------
  - entity: TherapyPlan
    axis: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [COMPLETED, DISCHARGED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /vision-therapy/therapy-plans/{id}/activate"
        actor: Optometrist
        preconditions:
          - "plan.status == DRAFT"
          - "at least one PlanPhase with sequence_index == 1 exists on this plan"
          - "the supplied Authorization has status IN {ACTIVE, EXHAUSTED} and belongs to the same patient_id"
        side_effects:
          - "TherapyPlan.status := ACTIVE; authorization_id := the supplied authorization; current_phase_index := 1"
          - "the PlanPhase with sequence_index 1 -> IN_PROGRESS (axis 5), started_at := clock"
          - "increments TherapyPlan.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vision-therapy/therapy-plans/{id}/suspend, or CASCADE-A hop 2 from an URGENT OUTBOUND Referral creation"
        actor: Optometrist | system
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "TherapyPlan.status := SUSPENDED; suspension_reason := the supplied reason, or RED_FLAG_REFERRAL when written by CASCADE-A hop 2"
          - "CASCADE-A hop 3: every TherapySession on this plan whose schedule_status IN {SCHEDULED, CHECKED_IN} and whose scheduled_start_at is at or after the logical clock -> CANCELLED with cancel_reason PLAN_SUSPENDED"
          - "increments TherapyPlan.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vision-therapy/therapy-plans/{id}/resume"
        actor: Optometrist
        preconditions:
          - "plan.status == SUSPENDED"
          - "when suspension_reason == RED_FLAG_REFERRAL: every Referral on this plan with direction OUTBOUND and urgency URGENT has status IN {ACCEPTED, ABANDONED}"
        side_effects:
          - "TherapyPlan.status := ACTIVE; suspension_reason := null"
          - "increments TherapyPlan.version by 1"
        note: "Closes the SUSPENDED -> ACTIVE arm of the cycle."

      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /vision-therapy/therapy-plans/{id}/revise"
        actor: Optometrist
        preconditions:
          - "plan.status IN {ACTIVE, SUSPENDED}"
          - "expected_plan_version equals TherapyPlan.version (OCC, rung 13)"
        side_effects:
          - "TherapyPlan.status := UNDER_REVISION; revision_count += 1"
          - "when prescribed_home_sessions_per_week is supplied: previous_prescribed_home_sessions_per_week := the old value, prescribed_home_sessions_per_week := the new value, prescription_changed_at := clock"
          - "increments TherapyPlan.version by 1"

      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /vision-therapy/therapy-plans/{id}/activate"
        actor: Optometrist
        preconditions:
          - "plan.status == UNDER_REVISION"
          - "the supplied Authorization has status IN {ACTIVE, EXHAUSTED} and belongs to the same patient_id"
        side_effects:
          - "TherapyPlan.status := ACTIVE; authorization_id := the supplied authorization"
          - "TherapyPlan.progress_state := ON_TRACK when it was REVISION_PENDING"
          - "increments TherapyPlan.version by 1"
        note: "Second arm of the revision cycle ACTIVE -> UNDER_REVISION -> ACTIVE."

      - from: ACTIVE
        to: DISCHARGED
        trigger: "CASCADE-B hop 1 from POST /vision-therapy/patients/{id}/discharge"
        actor: system
        preconditions:
          - "plan.status IN {DRAFT, ACTIVE, SUSPENDED, UNDER_REVISION}"
        side_effects:
          - "TherapyPlan.status := DISCHARGED"
          - "CASCADE-B hop 2: every TherapySession on this plan whose schedule_status IN {SCHEDULED, CHECKED_IN} -> CANCELLED with cancel_reason PLAN_DISCHARGED"
          - "increments TherapyPlan.version by 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /vision-therapy/therapy-plans/{id}/advance-phase on the highest sequence_index phase"
        actor: Optometrist | VisionTherapist
        preconditions:
          - "plan.status == ACTIVE"
          - "the current PlanPhase has the highest sequence_index on the plan"
          - "every gate in §1.4 rungs 24, 25 and 26 passes"
        side_effects:
          - "the current PlanPhase -> MASTERED (axis 5)"
          - "TherapyPlan.status := COMPLETED; progress_state := DISCHARGE_PENDING"
          - "increments TherapyPlan.version by 1"

  # ---- axis 4: TherapyPlan.progress_state (independent second axis) --------
  - entity: TherapyPlan
    axis: progress_state
    shape: branching
    initial_state: ON_TRACK
    terminal_states: []
    transitions:
      - from: ON_TRACK
        to: PLATEAU
        trigger: "POST /vision-therapy/assessments/{id}/finalize on a REASSESSMENT"
        actor: system
        preconditions:
          - "assessment.plateau_flag == true (consecutive_low_delta_count reaches PLATEAU_CONSECUTIVE_COUNT)"
        side_effects:
          - "TherapyPlan.progress_state := PLATEAU"
          - "increments TherapyPlan.version by 1"

      - from: PLATEAU
        to: REVISION_PENDING
        trigger: "POST /vision-therapy/assessments/{id}/finalize on a REASSESSMENT"
        actor: system
        preconditions:
          - "plan.progress_state == PLATEAU"
          - "plan.discharge_ready == false after this finalize"
        side_effects:
          - "TherapyPlan.progress_state := REVISION_PENDING"
          - "increments TherapyPlan.version by 1"

      - from: PLATEAU
        to: DISCHARGE_PENDING
        trigger: "POST /vision-therapy/assessments/{id}/finalize on a REASSESSMENT"
        actor: system
        preconditions:
          - "plan.progress_state == PLATEAU"
          - "plan.discharge_ready == true after this finalize"
        side_effects:
          - "TherapyPlan.progress_state := DISCHARGE_PENDING"
          - "increments TherapyPlan.version by 1"
        note: "The plateau fork: the same trigger sends the plan to revision or to discharge depending on discharge_readiness_determination."

      - from: PLATEAU
        to: ON_TRACK
        trigger: "POST /vision-therapy/assessments/{id}/finalize on a REASSESSMENT"
        actor: system
        preconditions:
          - "plan.progress_state == PLATEAU"
          - "assessment.improvement_delta_points >= PLATEAU_DELTA_POINTS"
        side_effects:
          - "TherapyPlan.progress_state := ON_TRACK; consecutive_low_delta_count := 0"
          - "increments TherapyPlan.version by 1"
        note: "Recovery arm closes the cycle ON_TRACK -> PLATEAU -> ON_TRACK. Evaluated before the two forks above; a reassessment that clears the delta never routes to REVISION_PENDING or DISCHARGE_PENDING."

      - from: ON_TRACK
        to: DISCHARGE_PENDING
        trigger: "POST /vision-therapy/therapy-plans/{id}/advance-phase completing the final phase"
        actor: Optometrist | VisionTherapist
        preconditions:
          - "plan.status transitions ACTIVE -> COMPLETED on this same call"
        side_effects:
          - "TherapyPlan.progress_state := DISCHARGE_PENDING"
          - "increments TherapyPlan.version by 1"

  # ---- axis 5: PlanPhase.status (cyclic, regression edge) ------------------
  - entity: PlanPhase
    axis: status
    shape: cyclic
    initial_state: LOCKED
    terminal_states: []
    transitions:
      - from: LOCKED
        to: IN_PROGRESS
        trigger: "POST /vision-therapy/therapy-plans/{id}/activate (phase 1) or POST /vision-therapy/therapy-plans/{id}/advance-phase (phase n+1)"
        actor: Optometrist | VisionTherapist
        preconditions:
          - "phase.status == LOCKED"
          - "phase.sequence_index == plan.current_phase_index + 1, or phase.sequence_index == 1 at activation"
        side_effects:
          - "PlanPhase.status := IN_PROGRESS; started_at := clock"
          - "TherapyPlan.current_phase_index := phase.sequence_index"
          - "increments PlanPhase.version by 1"

      - from: IN_PROGRESS
        to: MASTERED
        trigger: "POST /vision-therapy/therapy-plans/{id}/advance-phase"
        actor: Optometrist | VisionTherapist
        preconditions:
          - "phase.status == IN_PROGRESS"
          - "every gate in §1.4 rungs 24, 25 and 26 passes"
        side_effects:
          - "PlanPhase.status := MASTERED; mastered_at := clock"
          - "increments PlanPhase.version by 1"

      - from: MASTERED
        to: IN_PROGRESS
        trigger: "POST /vision-therapy/assessments/{id}/finalize on a REASSESSMENT whose composite_progress_score < REGRESSION_SCORE_THRESHOLD"
        actor: system
        preconditions:
          - "plan.current_phase_index > 1"
          - "the phase with sequence_index == plan.current_phase_index - 1 has status MASTERED"
        side_effects:
          - "the phase with sequence_index == plan.current_phase_index -> LOCKED, started_at := null"
          - "the phase with sequence_index == plan.current_phase_index - 1 -> IN_PROGRESS, mastered_at := null, started_at := clock"
          - "TherapyPlan.current_phase_index -= 1"
          - "increments PlanPhase.version by 1 on both affected rows"
        note: "Regression edge. Closes the cycle IN_PROGRESS -> MASTERED -> IN_PROGRESS."

  # ---- axis 6: TherapySession.schedule_status (branching, two entries) -----
  - entity: TherapySession
    axis: schedule_status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, ATTESTED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /vision-therapy/sessions/{id}/check-in"
        actor: FrontDesk | Optometrist | VisionTherapist | TherapyAssistant
        preconditions:
          - "session.modality == IN_OFFICE"
          - "session.schedule_status == SCHEDULED"
          - "plan.status == ACTIVE (rung 15)"
        side_effects:
          - "TherapySession.schedule_status := CHECKED_IN"
          - "increments TherapySession.version by 1"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /vision-therapy/sessions/{id}/complete"
        actor: Optometrist | VisionTherapist | TherapyAssistant
        preconditions:
          - "session.schedule_status == CHECKED_IN"
          - "the running Therapist's credential_expires_at is strictly after performed_at (rung 16)"
          - "when the running Therapist's credential == VISION_THERAPY_ASSISTANT: supervising_optometrist_id is supplied and names a Therapist whose credential == OPTOMETRIST and whose credential_expires_at is strictly after performed_at (rung 18)"
        side_effects:
          - "TherapySession.schedule_status := COMPLETED; performed_at, timed_minutes recorded"
          - "billable_units and charge_amount computed (session_billable_units)"
          - "TherapySession.billing_status -> BILLABLE when billable_units >= 1, else NON_BILLABLE (axis 7)"
          - "TherapyPlan.cumulative_therapy_minutes += weighted_minutes"
          - "the IN_PROGRESS PlanPhase's activities_mastered_count += activities_mastered_delta"
          - "increments TherapySession.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vision-therapy/sessions/{id}/cancel, or CASCADE-A hop 3, or CASCADE-B hop 2"
        actor: FrontDesk | Optometrist | VisionTherapist | system
        preconditions:
          - "session.schedule_status IN {SCHEDULED, CHECKED_IN}"
        side_effects:
          - "TherapySession.schedule_status := CANCELLED; cancel_reason recorded"
          - "TherapySession.billing_status := NON_BILLABLE"
          - "CASCADE-A hop 4 / CASCADE-B hop 3: when modality == IN_OFFICE the session's Authorization releases one unit - visits_released += 1, visits_remaining += 1"
          - "when the Authorization was EXHAUSTED it returns to ACTIVE (axis 8)"
          - "increments TherapySession.version by 1 and Authorization.version by 1"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /vision-therapy/sessions/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "session.modality == IN_OFFICE"
          - "session.schedule_status == SCHEDULED"
          - "the logical clock is at or after session.scheduled_start_at"
        side_effects:
          - "TherapySession.schedule_status := NO_SHOW; billing_status := NON_BILLABLE"
          - "the consumed authorization unit is NOT released - visits_consumed and visits_remaining are untouched"
          - "increments TherapySession.version by 1"
        note: "Deliberate asymmetry against CANCELLED: a no-show burns the visit unit."

      - from: LOGGED
        to: ATTESTED
        trigger: "POST /vision-therapy/sessions/{id}/attest"
        actor: PatientUser
        preconditions:
          - "session.modality == HOME"
          - "session.schedule_status == LOGGED"
          - "X-User-ID == session.patient_id"
        side_effects:
          - "TherapySession.schedule_status := ATTESTED; attested_at := clock"
          - "TherapyPlan.cumulative_therapy_minutes += weighted_minutes (timed_minutes * HOME_MINUTE_WEIGHT)"
          - "TherapyPlan.home_compliance_pct recomputed"
          - "increments TherapySession.version by 1"
        note: "HOME sessions enter the axis at LOGGED, never at SCHEDULED, and never consume an authorization unit."

  # ---- axis 7: TherapySession.billing_status (independent second axis) -----
  - entity: TherapySession
    axis: billing_status
    shape: branching
    initial_state: PENDING
    terminal_states: [NON_BILLABLE, SETTLED]
    transitions:
      - from: PENDING
        to: BILLABLE
        trigger: "POST /vision-therapy/sessions/{id}/complete"
        actor: Optometrist | VisionTherapist | TherapyAssistant
        preconditions:
          - "session.modality == IN_OFFICE"
          - "session.billable_units >= 1"
        side_effects:
          - "TherapySession.billing_status := BILLABLE"

      - from: PENDING
        to: NON_BILLABLE
        trigger: "POST /vision-therapy/sessions/{id}/complete with billable_units == 0, or /cancel, or /no-show, or POST /vision-therapy/therapy-plans/{id}/home-sessions"
        actor: Optometrist | VisionTherapist | TherapyAssistant | FrontDesk | PatientUser | system
        preconditions:
          - "session.modality == HOME, or billable_units == 0, or schedule_status becomes CANCELLED or NO_SHOW"
        side_effects:
          - "TherapySession.billing_status := NON_BILLABLE"
        note: "Zero-quantity edge: a completed IN_OFFICE session with timed_minutes <= 7 yields 0 units and lands here, which later fails rung 30 on claim creation."

      - from: BILLABLE
        to: CLAIMED
        trigger: "POST /vision-therapy/claims with service_class THERAPY_SESSION"
        actor: BillingSpecialist
        preconditions:
          - "session.billing_status == BILLABLE"
        side_effects:
          - "TherapySession.billing_status := CLAIMED"
          - "increments TherapySession.version by 1"

      - from: CLAIMED
        to: SETTLED
        trigger: "POST /vision-therapy/claims/{id}/adjudicate with outcome PAID"
        actor: BillingSpecialist
        preconditions:
          - "the claim's session_id names this session"
        side_effects:
          - "TherapySession.billing_status := SETTLED"
          - "increments TherapySession.version by 1"
  # ---- axis 8: Authorization.status (cyclic) -------------------------------
  - entity: Authorization
    axis: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /vision-therapy/therapy-plans/{id}/sessions (consume) or a session cancellation (release)"
        actor: FrontDesk | Optometrist | VisionTherapist | system
        preconditions:
          - "authorization.status == ACTIVE"
        side_effects:
          - "on consume: visits_consumed += 1, visits_remaining -= 1"
          - "on release: visits_released += 1, visits_remaining += 1"
          - "CASCADE-A hop 5 / CASCADE-B hop 4: when the release arrives from a session whose plan.status == SUSPENDED with suspension_reason RED_FLAG_REFERRAL, every KitLoan on that plan whose status == CHECKED_OUT -> RECALLED, recalled_at := clock, recall_due_at := clock + KIT_RECALL_DUE_DAYS"
          - "increments Authorization.version by 1"
        note: "Self-loop carrying the unit ledger. INVARIANT-1 (visits_authorized + visits_released == visits_consumed + visits_remaining) holds after every arm."

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "POST /vision-therapy/therapy-plans/{id}/sessions consuming the last unit"
        actor: FrontDesk | Optometrist | VisionTherapist
        preconditions:
          - "authorization.status == ACTIVE"
          - "visits_remaining == 1 before the consume"
        side_effects:
          - "visits_consumed += 1, visits_remaining := 0"
          - "Authorization.status := EXHAUSTED"
          - "increments Authorization.version by 1"

      - from: EXHAUSTED
        to: ACTIVE
        trigger: "a session cancellation releasing a unit"
        actor: FrontDesk | Optometrist | VisionTherapist | system
        preconditions:
          - "authorization.status == EXHAUSTED"
        side_effects:
          - "visits_released += 1, visits_remaining += 1"
          - "Authorization.status := ACTIVE"
          - "CASCADE-A hop 5 fires here too under the same condition as the ACTIVE self-loop"
          - "increments Authorization.version by 1"
        note: "Closes the cycle ACTIVE -> EXHAUSTED -> ACTIVE. EXHAUSTED is deliberately NOT rejected by rung 14 - it is an open state - so rung 23 (ERR_AUTH_VISITS_EXHAUSTED) stays reachable."

      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /vision-therapy/authorizations/{id}/reauthorize"
        actor: BillingSpecialist
        preconditions:
          - "authorization.status IN {ACTIVE, EXHAUSTED}"
          - "the supplied reassessment is a SIGNED Assessment with assessment_type REASSESSMENT for the same patient whose signed_at is within REAUTH_LOOKBACK_DAYS before the logical clock (rung 32)"
        side_effects:
          - "visits_authorized += additional_visits; visits_remaining += additional_visits"
          - "window_end_date := new_window_end_date; reauthorization_count += 1; last_reauthorized_at := clock"
          - "Authorization.status := ACTIVE"
          - "increments Authorization.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /vision-therapy/_clock/set_current_utc moving the clock strictly past window_end_date"
        actor: system
        preconditions:
          - "authorization.status IN {ACTIVE, EXHAUSTED}"
          - "the new clock date is strictly after window_end_date"
        side_effects:
          - "Authorization.status := EXPIRED"
          - "increments Authorization.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /vision-therapy/authorizations/{id}/close, or CASCADE-B hop 5"
        actor: BillingSpecialist | system
        preconditions:
          - "authorization.status IN {ACTIVE, EXHAUSTED, EXPIRED}"
        side_effects:
          - "Authorization.status := CLOSED; close_reason recorded (PATIENT_DISCHARGED when written by CASCADE-B)"
          - "counters are left untouched, so INVARIANT-1 continues to hold on a closed pool"
          - "increments Authorization.version by 1"

  # ---- axis 9: Claim.status (cyclic, capped appeal loop) -------------------
  - entity: Claim
    axis: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vision-therapy/claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DRAFT"
          - "coverage.status == ACTIVE"
        side_effects:
          - "Claim.status := SUBMITTED; submitted_by_user_id := X-User-ID"
          - "increments Claim.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /vision-therapy/claims/{id}/adjudicate with outcome ACCEPTED"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "Claim.status := ACCEPTED"
          - "increments Claim.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vision-therapy/claims/{id}/adjudicate with outcome REJECTED"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "Claim.status := REJECTED; denial_reason recorded"
          - "increments Claim.version by 1"

      - from: ACCEPTED
        to: PAID
        trigger: "POST /vision-therapy/claims/{id}/adjudicate with outcome PAID"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == ACCEPTED"
        side_effects:
          - "claim_adjudication_amounts runs and writes allowed_amount, contractual_adjustment_amount, deductible_applied_amount, coinsurance_amount, plan_paid_amount, patient_responsibility_amount, denied_amount, adjudication_variant"
          - "MEDICAL arm: Coverage.deductible_met += deductible_applied_amount"
          - "VISION arm: Coverage.vision_allowance_used += plan_paid_amount; vision_allowance_remaining -= plan_paid_amount; the matching Coverage.last_paid_service_date_* := claim.service_date"
          - "when claim.session_id is not null: TherapySession.billing_status -> SETTLED (axis 7)"
          - "increments Claim.version by 1 and Coverage.version by 1"

      - from: ACCEPTED
        to: DENIED
        trigger: "POST /vision-therapy/claims/{id}/adjudicate with outcome DENIED"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == ACCEPTED"
        side_effects:
          - "claim_adjudication_amounts runs in denial mode: plan_paid_amount := 0.00, denied_amount := allowed_amount, patient_responsibility_amount := 0.00"
          - "Claim.status := DENIED; denial_reason recorded"
          - "increments Claim.version by 1"

      - from: DENIED
        to: SUBMITTED
        trigger: "POST /vision-therapy/claims/{id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DENIED"
          - "claim.appeal_count < MAX_APPEAL_ATTEMPTS (2)"
        side_effects:
          - "appeal_attempt_log_count += 1 and last_appeal_attempt_at := clock are committed BEFORE the cap is evaluated"
          - "Claim.appeal_count += 1; Claim.status := SUBMITTED"
          - "increments Claim.version by 1"
        note: "MUTATE-THEN-REJECT: when appeal_count has already reached the cap the two bookkeeping writes above still commit and the call then raises ERR_APPEAL_LIMIT_REACHED (rung 36). Precedence subtlety - once any later call has moved the row out of DENIED, rung 14 pre-empts rung 36 and the bookkeeping write does NOT happen."

      - from: REJECTED
        to: DRAFT
        trigger: "POST /vision-therapy/claims/{id}/correct"
        actor: BillingSpecialist
        preconditions:
          - "claim.status IN {REJECTED, DENIED}"
          - "X-User-ID != claim.submitted_by_user_id (rung 17)"
        side_effects:
          - "Claim.status := DRAFT; correction_count += 1"
          - "when corrected_units is supplied: units := corrected_units and billed_amount recomputed"
          - "increments Claim.version by 1"
        note: "Closes the cycle DRAFT -> SUBMITTED -> REJECTED -> DRAFT. This endpoint sits OUTSIDE the clinical write gate."

  # ---- axis 10: Referral.status (capped retry cycle) -----------------------
  - entity: Referral
    axis: status
    shape: cyclic
    initial_state: SENT
    terminal_states: [ACCEPTED, ABANDONED]
    transitions:
      - from: SENT
        to: ACCEPTED
        trigger: "POST /vision-therapy/referrals/{id}/respond with response_outcome ACCEPTED"
        actor: FrontDesk | Optometrist
        preconditions:
          - "referral.status == SENT"
        side_effects:
          - "Referral.status := ACCEPTED; responded_at := clock; sla_breached recomputed"
          - "increments Referral.version by 1"
        note: "This endpoint sits OUTSIDE the clinical write gate, so an outbound referral can still be answered after discharge."

      - from: SENT
        to: DECLINED
        trigger: "POST /vision-therapy/referrals/{id}/respond with response_outcome DECLINED"
        actor: FrontDesk | Optometrist
        preconditions:
          - "referral.status == SENT"
        side_effects:
          - "Referral.status := DECLINED; decline_reason recorded; responded_at := clock; sla_breached recomputed"
          - "increments Referral.version by 1"

      - from: DECLINED
        to: SENT
        trigger: "POST /vision-therapy/referrals/{id}/re-refer"
        actor: FrontDesk | Optometrist
        preconditions:
          - "referral.status == DECLINED"
          - "referral.attempt_count < MAX_REFERRAL_ATTEMPTS (3)"
        side_effects:
          - "Referral.attempt_count += 1; target_provider_name := the new target; responded_at := null; response_outcome := null; decline_reason := null"
          - "sla_due_at := clock + the urgency's SLA hours"
          - "Referral.status := SENT"
          - "increments Referral.version by 1"
        note: "Capped retry loop SENT -> DECLINED -> SENT."

      - from: DECLINED
        to: ABANDONED
        trigger: "POST /vision-therapy/referrals/{id}/re-refer once attempt_count has reached MAX_REFERRAL_ATTEMPTS"
        actor: FrontDesk | Optometrist
        preconditions:
          - "referral.status == DECLINED"
          - "referral.attempt_count == MAX_REFERRAL_ATTEMPTS (3)"
        side_effects:
          - "Referral.status := ABANDONED"
          - "the call then raises ERR_REFERRAL_ATTEMPT_LIMIT (rung 33) - the ABANDONED write is committed first"
          - "increments Referral.version by 1"
        note: "Second MUTATE-THEN-REJECT rung: the status flip to ABANDONED persists even though the response is a 409."

  # ---- axis 11: KitLoan.status (branching fork on item_class) --------------
  - entity: KitLoan
    axis: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [DISPENSED, RETURNED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CHECKED_OUT
        trigger: "POST /vision-therapy/kit-loans/{id}/fulfill on a LOANABLE_SERIALIZED item"
        actor: FrontDesk | VisionTherapist
        preconditions:
          - "loan.status == REQUESTED"
          - "kit_item.item_class == LOANABLE_SERIALIZED"
          - "kit_item.on_hand_qty >= loan.quantity (rung 28)"
        side_effects:
          - "KitLoan.status := CHECKED_OUT; checked_out_at := clock; issued_by_user_id := X-User-ID"
          - "KitItem.on_hand_qty -= quantity; KitItem.on_loan_qty += quantity"
          - "increments KitLoan.version by 1 and KitItem.version by 1"

      - from: REQUESTED
        to: DISPENSED
        trigger: "POST /vision-therapy/kit-loans/{id}/fulfill on a CONSUMABLE_STOCK item"
        actor: FrontDesk | VisionTherapist
        preconditions:
          - "loan.status == REQUESTED"
          - "kit_item.item_class == CONSUMABLE_STOCK"
          - "kit_item.on_hand_qty >= loan.quantity (rung 28)"
        side_effects:
          - "KitLoan.status := DISPENSED (terminal); checked_out_at := clock; issued_by_user_id := X-User-ID"
          - "KitItem.on_hand_qty -= quantity; KitItem.dispensed_qty += quantity"
          - "increments KitLoan.version by 1 and KitItem.version by 1"
        note: "Fork with divergent side-effect sets - the serialized arm moves stock to on_loan_qty and stays open, the consumable arm moves it to dispensed_qty and terminates."

      - from: CHECKED_OUT
        to: RECALLED
        trigger: "CASCADE-A hop 5 (authorization unit release on a RED_FLAG_REFERRAL-suspended plan)"
        actor: system
        preconditions:
          - "loan.status == CHECKED_OUT"
        side_effects:
          - "KitLoan.status := RECALLED; recalled_at := clock; recall_due_at := clock + KIT_RECALL_DUE_DAYS"
          - "KitItem counters unchanged - the unit is still on_loan_qty"
          - "increments KitLoan.version by 1"

      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /vision-therapy/kit-loans/{id}/return"
        actor: FrontDesk | VisionTherapist
        preconditions:
          - "loan.status IN {CHECKED_OUT, RECALLED}"
        side_effects:
          - "KitLoan.status := RETURNED; returned_at := clock; returned_condition recorded"
          - "damage_fee_amount computed by kit_damage_fee"
          - "returned_condition IN {GOOD, FAIR, DAMAGED}: KitItem.on_loan_qty -= quantity, KitItem.on_hand_qty += quantity"
          - "returned_condition == LOST: KitItem.on_loan_qty -= quantity, KitItem.retired_qty += quantity"
          - "increments KitLoan.version by 1 and KitItem.version by 1"
        note: "This endpoint sits OUTSIDE the clinical write gate so equipment can still be recovered after discharge. INVARIANT-2 holds after both arms."

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /vision-therapy/kit-loans/{id}/return on a still-unfulfilled request"
        actor: FrontDesk | VisionTherapist
        preconditions:
          - "loan.status == REQUESTED"
        side_effects:
          - "KitLoan.status := CANCELLED; returned_at := clock"
          - "KitItem counters unchanged"
          - "increments KitLoan.version by 1"

  # ---- axis 12: OcclusionPrescription.status (self-loop taper ladder) ------
  - entity: OcclusionPrescription
    axis: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: TAPERED
        trigger: "POST /vision-therapy/occlusion-prescriptions/{id}/taper"
        actor: Optometrist
        preconditions:
          - "prescription.status IN {ACTIVE, TAPERED}"
          - "adherence_pct >= ADHERENCE_MIN_PCT_FOR_TAPER and (baseline_acuity_logmar - current_acuity_logmar) >= TAPER_ACUITY_GATE_LOGMAR (rung 34)"
          - "current_daily_hours - TAPER_STEP_HOURS > 0"
        side_effects:
          - "current_daily_hours := current_daily_hours - TAPER_STEP_HOURS; taper_step_count += 1"
          - "OcclusionPrescription.status := TAPERED"
          - "increments OcclusionPrescription.version by 1"

      - from: TAPERED
        to: TAPERED
        trigger: "POST /vision-therapy/occlusion-prescriptions/{id}/taper"
        actor: Optometrist
        preconditions:
          - "prescription.status == TAPERED"
          - "the same gate as above passes (rung 34)"
          - "current_daily_hours - TAPER_STEP_HOURS > 0"
        side_effects:
          - "current_daily_hours := current_daily_hours - TAPER_STEP_HOURS; taper_step_count += 1"
          - "increments OcclusionPrescription.version by 1"
        note: "Self-loop: the ladder can be walked down repeatedly while the gate keeps passing."

      - from: TAPERED
        to: COMPLETED
        trigger: "POST /vision-therapy/occlusion-prescriptions/{id}/taper reducing the dose to zero or below"
        actor: Optometrist
        preconditions:
          - "prescription.status IN {ACTIVE, TAPERED}"
          - "the same gate as above passes (rung 34)"
          - "current_daily_hours - TAPER_STEP_HOURS <= 0"
        side_effects:
          - "current_daily_hours := 0; taper_step_count += 1"
          - "OcclusionPrescription.status := COMPLETED (terminal)"
          - "increments OcclusionPrescription.version by 1"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /vision-therapy/patients/{id}/discharge"
        actor: system
        preconditions:
          - "prescription.status IN {ACTIVE, TAPERED}"
        side_effects:
          - "OcclusionPrescription.status := DISCONTINUED"
          - "increments OcclusionPrescription.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` - the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: session-create-stale-authorization
    parent_entity: Authorization
    write_endpoint: "POST /vision-therapy/therapy-plans/{id}/sessions"
    occ_field: "expected_authorization_version"
    description: |
      Scheduling an in-office session draws one unit out of the plan's authorization pool.
      A caller whose expected_authorization_version no longer matches Authorization.version
      is working from a stale view of the pool - another writer has already drawn, released
      or reauthorized units since the caller last read it - and the draw is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-revise-stale-plan
    parent_entity: TherapyPlan
    write_endpoint: "POST /vision-therapy/therapy-plans/{id}/revise"
    occ_field: "expected_plan_version"
    description: |
      A revision legitimately supersedes the plan's prior prescription, so a second revision
      against the same observed version is a perfectly valid product operation rather than an
      illegal state change. It is refused only because expected_plan_version is stale relative
      to TherapyPlan.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-create-stale-coverage
    parent_entity: Coverage
    write_endpoint: "POST /vision-therapy/claims"
    occ_field: "expected_coverage_version"
    description: |
      A claim is filed against the coverage's accumulator snapshot (deductible_met for MEDICAL,
      vision_allowance_remaining and last_paid_service_date_* for VISION). If Coverage.version
      has advanced since the biller read it, the accumulators the biller reasoned about are no
      longer the ones the adjudication will use, and the create is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#   18 calculations; 5 of them are dual-variant (the same quantity produced by
#   two different formulas chosen by a data-driven fork).
#   Global rounding convention: every money and percentage value is rounded
#   half-up to 2 decimal places at the step the formula names, never earlier
#   and never later.
# =============================================================================
calculations:

  - name: patient_age_years
    trigger: "POST /vision-therapy/assessments (assessment creation) and POST /vision-therapy/occlusion-prescriptions"
    algorithm: projection
    formula: |
      # whole calendar years, NOT a 365.25 division
      y = year(encounter_date) - year(patient.date_of_birth)
      if (month(encounter_date), day(encounter_date)) < (month(dob), day(dob)):
          y = y - 1
      patient_age_years = y
    input_set: "Patient.date_of_birth and Assessment.encounter_date of the row being created."
    constants: {}
    precision: "integer years, no rounding"

  - name: accommodative_amplitude_reference_band
    trigger: "POST /vision-therapy/assessments/{id}/measurements with metric_code ACCOMMODATIVE_AMPLITUDE, and re-evaluated at POST /vision-therapy/assessments/{id}/finalize"
    algorithm: threshold
    formula: |
      age = assessment.patient_age_years
      if assessment.purpose IN {DIAGNOSTIC, PROGRESS}:
          reference_variant   = STANDARD
          expected_min_value  = round(HOFSTETTER_STANDARD_INTERCEPT_D
                                      - HOFSTETTER_STANDARD_SLOPE_D_PER_YEAR * age, 2)
          expected_band_high  = round(expected_min_value + STANDARD_BAND_WIDTH_D, 2)
      else:                                   # purpose == DISCHARGE_READINESS
          reference_variant   = FUNCTIONAL
          expected_min_value  = round(FUNCTIONAL_MIN_INTERCEPT_D
                                      - FUNCTIONAL_MIN_SLOPE_D_PER_YEAR * age, 2)
          expected_band_high  = round(expected_min_value + FUNCTIONAL_BAND_WIDTH_D, 2)
      within_reference_band = (expected_min_value <= amplitude_d <= expected_band_high)
      # downstream actions differ per variant:
      #   STANDARD   -> diagnostic_flag = (amplitude_d < expected_min_value); feeds therapy_indicated
      #   FUNCTIONAL -> diagnostic_flag = (amplitude_d < expected_min_value); feeds discharge_metric_met
    input_set: "The single BinocularMeasurement row with metric_code ACCOMMODATIVE_AMPLITUDE being written, plus its parent Assessment's purpose and patient_age_years."
    constants:
      HOFSTETTER_STANDARD_INTERCEPT_D: 15.0
      HOFSTETTER_STANDARD_SLOPE_D_PER_YEAR: 0.25
      STANDARD_BAND_WIDTH_D: 2.00
      FUNCTIONAL_MIN_INTERCEPT_D: 16.0
      FUNCTIONAL_MIN_SLOPE_D_PER_YEAR: 0.28
      FUNCTIONAL_BAND_WIDTH_D: 1.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_reference_band
        when: "assessment.purpose IN {DIAGNOSTIC, PROGRESS}"
        difference: "Hofstetter minimum 15.0 - 0.25*age with a 2.00 D wide band; a breach sets Assessment.therapy_indicated."
      - name: functional_reference_band
        when: "assessment.purpose == DISCHARGE_READINESS"
        difference: "Practice-specific functional minimum 16.0 - 0.28*age with a narrower 1.00 D band; a breach blocks Assessment.discharge_metric_met. At age 10 the two minima are 12.50 D and 13.20 D, so an amplitude of 13.00 D passes the standard band and fails the functional one."

  - name: npc_threshold_evaluation
    trigger: "POST /vision-therapy/assessments/{id}/finalize"
    algorithm: threshold
    formula: |
      # one instrument reading, two independent thresholds, two different consumers
      npc = the BinocularMeasurement with metric_code NPC on this assessment
            having the greatest created_at (tie-break: the last one created)
      diagnostic_breach = (npc.npc_break_cm  > NPC_BREAK_DIAGNOSTIC_CM)
                       or (npc.npc_recovery_cm > NPC_RECOVERY_DIAGNOSTIC_CM)
      discharge_pass    = (npc.npc_break_cm  <= NPC_BREAK_DISCHARGE_CM)
                      and (npc.npc_recovery_cm <= NPC_RECOVERY_DISCHARGE_CM)
      npc.diagnostic_flag = diagnostic_breach
      assessment.therapy_indicated =
          diagnostic_breach
          or (the ACCOMMODATIVE_AMPLITUDE row exists and its diagnostic_flag is true)
      assessment.discharge_metric_met =
          discharge_pass
          and (no ACCOMMODATIVE_AMPLITUDE row exists
               or that row's amplitude_d >= its expected_min_value)
    input_set: "BinocularMeasurement rows on the assessment being finalized; NPC row selected by greatest created_at."
    constants:
      NPC_BREAK_DIAGNOSTIC_CM: 6.0
      NPC_RECOVERY_DIAGNOSTIC_CM: 9.0
      NPC_BREAK_DISCHARGE_CM: 5.0
      NPC_RECOVERY_DISCHARGE_CM: 7.0
    precision: "cm compared at 1 decimal place as supplied; no rounding applied"

  - name: session_billable_units
    trigger: "POST /vision-therapy/sessions/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      if session.procedure_code == HOME_PRACTICE:
          billable_units = 0
      elif session.procedure_code == FLAT_ORTHOPTIC_TRAINING:
          billable_units = FLAT_UNIT_COUNT              # always 1, minutes ignored
      else:                                              # TIMED_THERAPEUTIC_ACTIVITY
          m = session.timed_minutes                      # integer, >= 0
          if   m <=  7: billable_units = 0
          elif m <= 22: billable_units = 1
          elif m <= 37: billable_units = 2
          elif m <= 52: billable_units = 3
          elif m <= 67: billable_units = 4
          elif m <= 82: billable_units = 5
          else:         billable_units = UNITS_CAP_PER_SESSION   # 6
    input_set: "The single TherapySession being completed."
    constants:
      FLAT_UNIT_COUNT: 1
      UNITS_CAP_PER_SESSION: 6
      TIMED_STEP_0_UPPER_MINUTES: 7
      TIMED_STEP_1_UPPER_MINUTES: 22
      TIMED_STEP_2_UPPER_MINUTES: 37
      TIMED_STEP_3_UPPER_MINUTES: 52
      TIMED_STEP_4_UPPER_MINUTES: 67
      TIMED_STEP_5_UPPER_MINUTES: 82
    precision: "integer units"
    variants:
      - name: timed_stepped_units
        when: "session.procedure_code == TIMED_THERAPEUTIC_ACTIVITY"
        difference: "Minutes are mapped through the stepped table above, so 22 minutes bills 1 unit and 23 minutes bills 2."
      - name: flat_session_unit
        when: "session.procedure_code == FLAT_ORTHOPTIC_TRAINING"
        difference: "Exactly 1 unit no matter how many minutes were delivered; 45 minutes bills 1 unit here and 3 units under the timed variant."

  - name: session_charge_amount
    trigger: "POST /vision-therapy/sessions/{id}/complete, and re-run by POST /vision-therapy/claims/{id}/correct when corrected_units is supplied"
    algorithm: tiered_pricing
    formula: |
      rate = RATE_TIMED_THERAPEUTIC_ACTIVITY if procedure_code == TIMED_THERAPEUTIC_ACTIVITY
             else RATE_FLAT_ORTHOPTIC_TRAINING if procedure_code == FLAT_ORTHOPTIC_TRAINING
             else RATE_EVALUATION_ENCOUNTER   if procedure_code == EVALUATION_ENCOUNTER
             else 0.00
      charge_amount = round(billable_units * rate, 2)
    input_set: "billable_units and procedure_code of the row being priced (a TherapySession, or a Claim after correction)."
    constants:
      RATE_TIMED_THERAPEUTIC_ACTIVITY: 42.00
      RATE_FLAT_ORTHOPTIC_TRAINING: 155.00
      RATE_EVALUATION_ENCOUNTER: 210.00
    precision: "2 decimal places, round_half_up"

  - name: claim_adjudication_amounts
    trigger: "POST /vision-therapy/claims/{id}/adjudicate with outcome PAID or DENIED"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. Each named step rounds half-up to 2 dp
      # BEFORE the next step consumes it - the total is NOT rounded once at
      # the end, and rounding per step is what makes the identity below exact.
      variant = coverage.payer.payer_type            # MEDICAL or VISION

      if variant == MEDICAL:
          per_unit = payer.allowed_amount_timed_unit    if claim.procedure_code == TIMED_THERAPEUTIC_ACTIVITY
                     else payer.allowed_amount_flat_session if claim.procedure_code == FLAT_ORTHOPTIC_TRAINING
                     else payer.allowed_amount_evaluation
          step1 allowed        = round(claim.units * per_unit, 2)
          step2 contractual    = max(round(claim.billed_amount - allowed, 2), 0.00)
          step3 deductible     = max(min(allowed,
                                    round(coverage.deductible_total - coverage.deductible_met, 2)), 0.00)
          step4 post_deductible= round(allowed - deductible, 2)
          step5 coinsurance    = round(post_deductible * payer.coinsurance_rate, 2)
          step6 plan_paid      = round(post_deductible - coinsurance, 2)
          step7 patient_resp   = round(deductible + coinsurance, 2)
      else:                                            # VISION
          step1 allowed        = min(round(claim.billed_amount, 2),
                                     round(coverage.vision_allowance_remaining, 2))
          step2 contractual    = 0.00
          step3 deductible     = 0.00
          step4 post_deductible= allowed
          step5 coinsurance    = 0.00
          step6 plan_paid      = allowed
          step7 patient_resp   = round(claim.billed_amount - allowed, 2)

      if outcome == PAID:
          denied_amount = 0.00
      else:                                            # DENIED
          denied_amount               = allowed
          plan_paid                   = 0.00
          patient_responsibility      = 0.00
          contractual_adjustment      = round(claim.billed_amount - allowed, 2)
      # INVARIANT-3 must hold on every adjudicated row.
    input_set: "The Claim being adjudicated, its Coverage accumulators as of this call, and that Coverage's Payer configuration."
    constants:
      MEDICAL_DENIED_PLAN_PAID: 0.00
      VISION_CONTRACTUAL_ADJUSTMENT: 0.00
    precision: "2 decimal places, round_half_up, applied at each numbered step"
    variants:
      - name: medical_deductible_then_coinsurance
        when: "coverage.payer.payer_type == MEDICAL"
        difference: "Allowed amount comes from the payer's contracted per-unit rate; the remaining deductible is consumed first, then coinsurance is taken on what is left. 3 timed units billed at 126.00 against a 34.00 per-unit allowed, 50.00 of deductible left and a 0.20 coinsurance rate yields plan_paid 41.60 and patient_responsibility 60.40."
      - name: vision_allowance_with_frequency_limit
        when: "coverage.payer.payer_type == VISION"
        difference: "No deductible and no coinsurance; the allowance is a hard cap and any excess is pure patient responsibility. The same 126.00 encounter against a 250.00 remaining allowance yields plan_paid 126.00 and patient_responsibility 0.00."

  - name: weighted_cumulative_therapy_minutes
    trigger: "POST /vision-therapy/sessions/{id}/complete and POST /vision-therapy/sessions/{id}/attest"
    algorithm: aggregation
    formula: |
      weighted_minutes(session) =
          session.timed_minutes                        if modality == IN_OFFICE
          else round(session.timed_minutes * HOME_MINUTE_WEIGHT, 1)
      TherapyPlan.cumulative_therapy_minutes =
          sum of weighted_minutes over all TherapySession rows on this plan
          whose schedule_status IN {COMPLETED, ATTESTED}
    input_set: "TherapySession rows on the plan with schedule_status IN {COMPLETED, ATTESTED}; CANCELLED, NO_SHOW, SCHEDULED, CHECKED_IN and LOGGED rows are excluded."
    constants:
      HOME_MINUTE_WEIGHT: 0.5
    precision: "1 decimal place, round_half_up"

  - name: home_compliance_pct
    trigger: "POST /vision-therapy/sessions/{id}/attest, and re-evaluated at POST /vision-therapy/therapy-plans/{id}/advance-phase"
    algorithm: aggregation
    formula: |
      window_end   = logical clock now
      window_start = now - COMPLIANCE_WINDOW_DAYS days
      # CIRCULAR-LOOKING DEPENDENCY, ORDER PINNED:
      # advancing a phase may change prescribed_home_sessions_per_week, which is
      # the denominator of the very metric that gates the advance. The denominator
      # is ALWAYS the prescription in force at window_start, never the current one:
      if plan.prescription_changed_at is not null
         and plan.prescription_changed_at > window_start:
          per_week = plan.previous_prescribed_home_sessions_per_week
      else:
          per_week = plan.prescribed_home_sessions_per_week
      denominator = per_week * COMPLIANCE_WINDOW_DAYS / 7          # exact rational, unrounded
      numerator   = count of TherapySession rows on this plan with
                    modality == HOME, schedule_status == ATTESTED and
                    window_start < performed_at <= window_end      # half-open, left-exclusive
      home_compliance_pct = 0.00 if denominator == 0
                            else round(min(numerator / denominator * 100, 100), 2)
    input_set: "HOME sessions on the plan with schedule_status ATTESTED whose performed_at lies in the half-open trailing window."
    constants:
      COMPLIANCE_WINDOW_DAYS: 28
    precision: "2 decimal places, round_half_up, capped at 100.00"

  - name: symptom_improvement_pct
    trigger: "POST /vision-therapy/assessments/{id}/finalize on assessment_type REASSESSMENT"
    algorithm: aggregation
    formula: |
      baseline = plan.baseline_ciss_score
      current  = the SYMPTOM_SURVEY measurement on this assessment with the greatest created_at
      if baseline is null or baseline == 0 or current is null:
          symptom_improvement_pct = 0.00
      else:
          symptom_improvement_pct = round(
              clamp((baseline - current.ciss_score) / baseline * 100, 0, 100), 2)
    input_set: "TherapyPlan.baseline_ciss_score and the latest SYMPTOM_SURVEY row on the reassessment."
    constants:
      CISS_MAX_SCORE: 60
    precision: "2 decimal places, round_half_up"

  - name: composite_progress_score
    trigger: "POST /vision-therapy/assessments/{id}/finalize on assessment_type REASSESSMENT"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 - normalise each metric to percent-of-goal, each ROUNDED to 2 dp
      #          BEFORE it is weighted. A metric with no row on this reassessment,
      #          or with a null plan baseline, contributes exactly 0.00.
      npc_pct  = round(clamp((plan.baseline_npc_break_cm - cur_npc_break_cm)
                             / max(plan.baseline_npc_break_cm - NPC_BREAK_DISCHARGE_CM, 0.1)
                             * 100, 0, 100), 2)
      amp_pct  = round(clamp((cur_amplitude_d - plan.baseline_amplitude_d)
                             / max(expected_min_value_for_this_assessment
                                   - plan.baseline_amplitude_d, 0.1)
                             * 100, 0, 100), 2)
      verg_pct = round(clamp((cur_vergence_bo_break_pd - plan.baseline_vergence_bo_break_pd)
                             / max(VERGENCE_GOAL_PD - plan.baseline_vergence_bo_break_pd, 0.1)
                             * 100, 0, 100), 2)
      acu_pct  = round(clamp((plan.baseline_acuity_logmar - cur_acuity_logmar)
                             / max(plan.baseline_acuity_logmar - ACUITY_GOAL_LOGMAR, 0.01)
                             * 100, 0, 100), 2)
      sym_pct  = symptom_improvement_pct                       # already 2 dp

      # STEP 2 - weight set is chosen by patient.diagnosis_category
      if patient.diagnosis_category == AMBLYOPIA:
          score = ACUITY_VARIANT_W_ACUITY * acu_pct
                + ACUITY_VARIANT_W_NPC    * npc_pct
                + ACUITY_VARIANT_W_SYMPTOM* sym_pct
      elif patient.diagnosis_category == CONVERGENCE_INSUFFICIENCY:
          score = CI_W_NPC*npc_pct + CI_W_AMP*amp_pct + CI_W_VERG*verg_pct + CI_W_SYMPTOM*sym_pct
      elif patient.diagnosis_category == ACCOMMODATIVE_DYSFUNCTION:
          score = AD_W_NPC*npc_pct + AD_W_AMP*amp_pct + AD_W_VERG*verg_pct + AD_W_SYMPTOM*sym_pct
      else:                                    # OCULOMOTOR_DYSFUNCTION
          score = OM_W_NPC*npc_pct + OM_W_AMP*amp_pct + OM_W_VERG*verg_pct + OM_W_SYMPTOM*sym_pct

      # STEP 3 - the weighted terms are summed UNROUNDED, the sum is rounded once.
      composite_progress_score = round(score, 2)
    input_set: "The plan's five baseline_* fields and the latest measurement row per metric_code on the reassessment being finalized (tie-break: greatest created_at)."
    constants:
      VERGENCE_GOAL_PD: 20.0
      ACUITY_GOAL_LOGMAR: 0.10
      NPC_BREAK_DISCHARGE_CM: 5.0
      CI_W_NPC: 0.40
      CI_W_AMP: 0.15
      CI_W_VERG: 0.25
      CI_W_SYMPTOM: 0.20
      AD_W_NPC: 0.20
      AD_W_AMP: 0.45
      AD_W_VERG: 0.15
      AD_W_SYMPTOM: 0.20
      OM_W_NPC: 0.25
      OM_W_AMP: 0.25
      OM_W_VERG: 0.30
      OM_W_SYMPTOM: 0.20
      ACUITY_VARIANT_W_ACUITY: 0.55
      ACUITY_VARIANT_W_NPC: 0.25
      ACUITY_VARIANT_W_SYMPTOM: 0.20
    precision: "components 2 dp round_half_up, final sum 2 dp round_half_up"
    variants:
      - name: binocular_weighted_score
        when: "patient.diagnosis_category IN {CONVERGENCE_INSUFFICIENCY, ACCOMMODATIVE_DYSFUNCTION, OCULOMOTOR_DYSFUNCTION}"
        difference: "Four terms - NPC, amplitude, vergence and symptoms - with a weight set per diagnosis family. The reference battery (npc 12.0->7.0, amp 8.0->11.0, verg 8.0->14.0, ciss 34->20, age 10) scores 59.31 under CONVERGENCE_INSUFFICIENCY and 60.02 under ACCOMMODATIVE_DYSFUNCTION."
      - name: acuity_weighted_score
        when: "patient.diagnosis_category == AMBLYOPIA"
        difference: "A three-term formula over a different input set - acuity replaces amplitude and vergence entirely. The same battery with acuity 0.30->0.18 scores 59.09, a different number from the 59.31 the binocular variant produces on identical rows."

  - name: plateau_detection
    trigger: "POST /vision-therapy/assessments/{id}/finalize on assessment_type REASSESSMENT"
    algorithm: chronological
    formula: |
      prior = the SIGNED REASSESSMENT on this plan with the greatest signed_at,
              tie-break greatest created_at; null when none exists
      improvement_delta_points = null if prior is null
                                 else round(this.composite_progress_score
                                            - prior.composite_progress_score, 2)
      if improvement_delta_points is not null
         and improvement_delta_points < PLATEAU_DELTA_POINTS:
          plan.consecutive_low_delta_count += 1
      else:
          plan.consecutive_low_delta_count = 0
      plateau_flag = (plan.consecutive_low_delta_count >= PLATEAU_CONSECUTIVE_COUNT)
    input_set: "SIGNED REASSESSMENT rows on the same plan, ordered by signed_at ascending with created_at ascending as the tie-break."
    constants:
      PLATEAU_DELTA_POINTS: 5.0
      PLATEAU_CONSECUTIVE_COUNT: 2
    precision: "2 decimal places, round_half_up"

  - name: authorization_unit_ledger
    trigger: "POST /vision-therapy/therapy-plans/{id}/sessions, any session cancellation, and POST /vision-therapy/authorizations/{id}/reauthorize"
    algorithm: aggregation
    formula: |
      visits_remaining = visits_authorized - visits_consumed + visits_released
      # INVARIANT-1 (conserved quantity: authorization visit units)
      #   visits_authorized + visits_released == visits_consumed + visits_remaining
      # holds after every consume, every release, every reauthorize and after close.
    input_set: "The single Authorization row."
    constants:
      SESSION_UNIT_COST: 1
    precision: "integer units"

  - name: discharge_readiness_determination
    trigger: "POST /vision-therapy/assessments/{id}/finalize; read by POST /vision-therapy/patients/{id}/discharge"
    algorithm: threshold
    formula: |
      if plan.discharge_criteria_mode == METRIC:
          a = the Assessment on this plan with purpose DISCHARGE_READINESS and status SIGNED
              having the greatest signed_at (tie-break greatest created_at)
          discharge_ready = (a is not null) and (a.discharge_metric_met == true)
      else:                                    # GOAL
          r = the Assessment on this plan with assessment_type REASSESSMENT and status SIGNED
              having the greatest signed_at (tie-break greatest created_at)
          discharge_ready = (r is not null)
                            and (r.composite_progress_score >= DISCHARGE_SCORE_THRESHOLD)
                            and (r.symptom_improvement_pct >= DISCHARGE_SYMPTOM_IMPROVEMENT_PCT)
    input_set: "SIGNED assessments on the plan; METRIC mode looks only at purpose DISCHARGE_READINESS rows, GOAL mode only at assessment_type REASSESSMENT rows."
    constants:
      DISCHARGE_SCORE_THRESHOLD: 80.0
      DISCHARGE_SYMPTOM_IMPROVEMENT_PCT: 50.0
    precision: "boolean"
    variants:
      - name: metric_based_discharge_readiness
        when: "plan.discharge_criteria_mode == METRIC"
        difference: "Purely instrument-driven: NPC break <= 5.0 cm and recovery <= 7.0 cm and amplitude at or above the FUNCTIONAL minimum. A plan can be METRIC-ready while its composite score is far under 80.00."
      - name: goal_based_discharge_readiness
        when: "plan.discharge_criteria_mode == GOAL"
        difference: "Purely goal-driven: composite_progress_score >= 80.00 AND symptom_improvement_pct >= 50.00, ignoring the raw instrument thresholds entirely. The same signed battery therefore produces discharge_ready = true under one mode and false under the other."

  - name: kit_damage_fee
    trigger: "POST /vision-therapy/kit-loans/{id}/return"
    algorithm: decay_function
    formula: |
      months_in_service = whole months from kit_item.in_service_date to the return date
                          (calendar months elapsed, floored; same day-of-month counts as complete)
      capped_months     = min(months_in_service, kit_item.useful_life_months)
      straight_line     = kit_item.replacement_cost
                          * (1 - capped_months / kit_item.useful_life_months)   # unrounded
      salvage_floor     = kit_item.replacement_cost * KIT_SALVAGE_FLOOR_RATE    # unrounded
      depreciated_value = max(straight_line, salvage_floor)                     # unrounded
      multiplier        = CONDITION_MULTIPLIER_GOOD     if returned_condition == GOOD
                          else CONDITION_MULTIPLIER_FAIR     if returned_condition == FAIR
                          else CONDITION_MULTIPLIER_DAMAGED  if returned_condition == DAMAGED
                          else CONDITION_MULTIPLIER_LOST
      damage_fee_amount = round(depreciated_value * multiplier, 2)   # single, final rounding
    input_set: "The KitLoan being returned and its KitItem; quantity is always 1 for serialized items."
    constants:
      KIT_SALVAGE_FLOOR_RATE: 0.20
      CONDITION_MULTIPLIER_GOOD: 0.00
      CONDITION_MULTIPLIER_FAIR: 0.25
      CONDITION_MULTIPLIER_DAMAGED: 0.60
      CONDITION_MULTIPLIER_LOST: 1.00
    precision: "2 decimal places, round_half_up, applied once at the end"

  - name: occlusion_daily_dose
    trigger: "POST /vision-therapy/occlusion-prescriptions"
    algorithm: tiered_pricing
    formula: |
      age = source_assessment.patient_age_years
      age_band = YOUNG  if age < OCCLUSION_YOUNG_UPPER_AGE            # age < 4
                 else SCHOOL if age <= OCCLUSION_SCHOOL_UPPER_AGE      # 4 <= age <= 7
                 else OLDER
      raw = OCCLUSION_YOUNG_MILD_HOURS      if (YOUNG,  MILD)
            OCCLUSION_YOUNG_MODERATE_HOURS  if (YOUNG,  MODERATE)
            OCCLUSION_YOUNG_SEVERE_HOURS    if (YOUNG,  SEVERE)
            OCCLUSION_SCHOOL_MILD_HOURS     if (SCHOOL, MILD)
            OCCLUSION_SCHOOL_MODERATE_HOURS if (SCHOOL, MODERATE)
            OCCLUSION_SCHOOL_SEVERE_HOURS   if (SCHOOL, SEVERE)
            OCCLUSION_OLDER_MILD_HOURS      if (OLDER,  MILD)
            OCCLUSION_OLDER_MODERATE_HOURS  if (OLDER,  MODERATE)
            OCCLUSION_OLDER_SEVERE_HOURS    if (OLDER,  SEVERE)
      prescribed_daily_hours = min(raw, OCCLUSION_MAX_DAILY_HOURS)
      current_daily_hours    = prescribed_daily_hours
    input_set: "The source Assessment's patient_age_years and the supplied severity."
    constants:
      OCCLUSION_YOUNG_UPPER_AGE: 4
      OCCLUSION_SCHOOL_UPPER_AGE: 7
      OCCLUSION_YOUNG_MILD_HOURS: 2
      OCCLUSION_YOUNG_MODERATE_HOURS: 3
      OCCLUSION_YOUNG_SEVERE_HOURS: 4
      OCCLUSION_SCHOOL_MILD_HOURS: 2
      OCCLUSION_SCHOOL_MODERATE_HOURS: 4
      OCCLUSION_SCHOOL_SEVERE_HOURS: 6
      OCCLUSION_OLDER_MILD_HOURS: 3
      OCCLUSION_OLDER_MODERATE_HOURS: 5
      OCCLUSION_OLDER_SEVERE_HOURS: 8
      OCCLUSION_MAX_DAILY_HOURS: 7
    precision: "integer hours"

  - name: occlusion_taper_step
    trigger: "POST /vision-therapy/occlusion-prescriptions/{id}/taper"
    algorithm: threshold
    formula: |
      acuity_gain = round(prescription.baseline_acuity_logmar - current_acuity_logmar, 2)
      gate_passes = (prescription.adherence_pct >= ADHERENCE_MIN_PCT_FOR_TAPER)
                    and (acuity_gain >= TAPER_ACUITY_GATE_LOGMAR)
      if not gate_passes: raise ERR_TAPER_GATE_NOT_MET
      new_hours = max(prescription.current_daily_hours - TAPER_STEP_HOURS, 0)
      current_daily_hours = new_hours
      status = COMPLETED if new_hours == 0 else TAPERED
    input_set: "The single OcclusionPrescription plus the current_acuity_logmar supplied on the call."
    constants:
      TAPER_ACUITY_GATE_LOGMAR: 0.20
      TAPER_STEP_HOURS: 2
      ADHERENCE_MIN_PCT_FOR_TAPER: 70.0
    precision: "acuity 2 decimal places round_half_up; hours integer"

  - name: occlusion_adherence_pct
    trigger: "POST /vision-therapy/occlusion-prescriptions/{id}/adherence"
    algorithm: aggregation
    formula: |
      logged_days   = logged_days   + logged_days_delta
      adherent_days = adherent_days + adherent_days_delta
      adherence_pct = 0.00 if logged_days == 0
                      else round(adherent_days / logged_days * 100, 2)
    input_set: "The single OcclusionPrescription row and the two non-negative deltas on the call."
    constants:
      ADHERENCE_ZERO_DENOMINATOR_RESULT: 0.00
    precision: "2 decimal places, round_half_up"

  - name: therapist_daily_scheduled_minutes
    trigger: "POST /vision-therapy/therapy-plans/{id}/sessions"
    algorithm: aggregation
    formula: |
      day = the UTC calendar date of the requested scheduled_start_at
      existing = sum over TherapySession rows where
                 therapist_id == requested therapist
                 and modality == IN_OFFICE
                 and schedule_status IN {SCHEDULED, CHECKED_IN, COMPLETED, NO_SHOW}
                 and UTC date of scheduled_start_at == day
                 of (scheduled_end_at - scheduled_start_at) in whole minutes
      requested_minutes = (scheduled_end_at - scheduled_start_at) in whole minutes
      if existing + requested_minutes > THERAPIST_MAX_DAILY_MINUTES:
          raise ERR_THERAPIST_DAILY_CAP_EXCEEDED
    input_set: "IN_OFFICE sessions for that therapist on that UTC date with schedule_status IN {SCHEDULED, CHECKED_IN, COMPLETED, NO_SHOW}; CANCELLED rows are excluded."
    constants:
      THERAPIST_MAX_DAILY_MINUTES: 180
    precision: "whole minutes; the comparison is strictly greater-than, so a total of exactly 180 is accepted"

# =============================================================================
# Conservation invariants (named identities that MUST hold across a row set)
# =============================================================================
conservation_invariants:
  - id: INVARIANT-1
    conserved_quantity: "authorization visit units"
    scope: "each Authorization row"
    identity: "Authorization.visits_authorized + Authorization.visits_released == Authorization.visits_consumed + Authorization.visits_remaining"
    holds_after:
      - "POST /vision-therapy/therapy-plans/{id}/sessions (consume)"
      - "POST /vision-therapy/sessions/{id}/cancel and both cascade cancellations (release)"
      - "POST /vision-therapy/sessions/{id}/no-show (no change: the unit stays consumed)"
      - "POST /vision-therapy/authorizations/{id}/reauthorize (authorized and remaining both rise by additional_visits)"
      - "POST /vision-therapy/authorizations/{id}/close (counters untouched)"

  - id: INVARIANT-2
    conserved_quantity: "physical kit units"
    scope: "each KitItem row"
    identity: "KitItem.initial_qty == KitItem.on_hand_qty + KitItem.on_loan_qty + KitItem.dispensed_qty + KitItem.retired_qty"
    holds_after:
      - "POST /vision-therapy/kit-items (on_hand_qty := initial_qty, the other three are 0)"
      - "POST /vision-therapy/kit-loans/{id}/fulfill on both arms of the fork"
      - "POST /vision-therapy/kit-loans/{id}/return on both the recovered and the LOST arm"

  - id: INVARIANT-3
    conserved_quantity: "claim dollars"
    scope: "each adjudicated Claim row"
    identity: "Claim.billed_amount == Claim.plan_paid_amount + Claim.patient_responsibility_amount + Claim.contractual_adjustment_amount + Claim.denied_amount"
    holds_after:
      - "POST /vision-therapy/claims/{id}/adjudicate with outcome PAID under either adjudication variant"
      - "POST /vision-therapy/claims/{id}/adjudicate with outcome DENIED under either adjudication variant"

  - id: INVARIANT-4
    conserved_quantity: "vision benefit allowance dollars"
    scope: "each Coverage row whose payer_type is VISION"
    identity: "Coverage.vision_allowance_total == Coverage.vision_allowance_used + Coverage.vision_allowance_remaining"
    holds_after:
      - "POST /vision-therapy/coverages (used := 0.00, remaining := total)"
      - "POST /vision-therapy/claims/{id}/adjudicate with outcome PAID under the VISION variant"

# =============================================================================
# Policy constants referenced outside a calculations[].constants block.
# Every constant named anywhere in this scaffold has an explicit value either
# here or in the owning calculation's `constants:` map - nothing is left for a
# downstream generator to invent.
# =============================================================================
policy_constants:
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-05-01T00:00:00Z"
  MAX_ASSESSMENT_AMENDMENTS: 2
  MAX_APPEAL_ATTEMPTS: 2
  MAX_REFERRAL_ATTEMPTS: 3
  URGENT_REFERRAL_SLA_HOURS: 24
  ROUTINE_REFERRAL_SLA_HOURS: 120
  KIT_RECALL_DUE_DAYS: 7
  LOST_TO_FOLLOWUP_DAYS: 60
  PHASE_ADVANCE_COMPLIANCE_PCT: 75.0
  PHASE_REASSESS_FROM_INDEX: 3
  REASSESS_WINDOW_DAYS: 21
  REAUTH_LOOKBACK_DAYS: 30
  REGRESSION_SCORE_THRESHOLD: 40.0
  ROOM_TURNOVER_BUFFER_MINUTES: 15
  THERAPIST_TURNOVER_BUFFER_MINUTES: 0
  SESSION_UNIT_COST: 1

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
#   36 rungs. Rung 12 is a GLOBAL CLINICAL WRITE GATE that pre-empts rungs
#   13-36 for every endpoint in the clinical write family. The gate's
#   exclusion list (see complexity_profile.design_notes) is what keeps the
#   lower rungs reachable on a discharged patient's non-clinical surface.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The supplied role appears in the endpoint's roles list in §1.5. For entity_backed roles, X-User-ID must name an existing row of the backing entity, and PatientUser may only act on rows whose patient_id equals X-User-ID."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Required body fields are present and well typed; numbers that must be non-negative are non-negative (timed_minutes, quantity, visits_authorized, additional_visits, logged_days_delta, adherent_days_delta, corrected_units, mastered_delta); scheduled_end_at is strictly after scheduled_start_at; effective_end_date is on or after effective_start_date; window_end_date is on or after window_start_date; useful_life_months >= 1; a POST /vision-therapy/assessments/{id}/finalize requires at least one child BinocularMeasurement with metric_code NPC; a measurement supplies the value field its metric_code requires; pagination limit is 1-100 and offset >= 0."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes and all list endpoints"

  - priority: 4
    category: business_constraint
    check: "Enum membership. This is the EXHAUSTIVE list of fields that route to ERR_INVALID_ENUM - diagnosis_category, discharge_reason, payer_type, assessment_type, purpose, metric_code, eye, discharge_criteria_mode, procedure_code, cancel_reason, item_class, returned_condition, service_class, direction, urgency, response_outcome, severity, close_reason, suspension_reason, equipment_class, credential, outcome (on adjudicate) and every *_status / status filter on a list endpoint. NO OTHER field routes here; any other bad value is ERR_VALIDATION."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all writes carrying an enum field and all list endpoints carrying an enum filter"

  - priority: 5
    category: existence
    check: "The Patient named in the path or in patient_id exists."
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path or body names a patient"

  - priority: 6
    category: existence
    check: "The Coverage named in the path or in coverage_id exists."
    error_id: ERR_COVERAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /vision-therapy/coverages/{id}, POST /vision-therapy/authorizations, POST /vision-therapy/claims"

  - priority: 7
    category: existence
    check: "The Assessment named in the path or in source_assessment_id / assessment_id / triggering_assessment_id / reassessment_id exists."
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "every assessment endpoint, POST /vision-therapy/therapy-plans, POST /vision-therapy/claims, POST /vision-therapy/referrals, POST /vision-therapy/occlusion-prescriptions, POST /vision-therapy/authorizations/{id}/reauthorize"

  - priority: 8
    category: existence
    check: "The TherapyPlan named in the path or in plan_id exists."
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "every therapy-plan endpoint, POST /vision-therapy/kit-loans, POST /vision-therapy/referrals"

  - priority: 9
    category: existence
    check: "The TherapySession named in the path or in session_id exists."
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "every session endpoint and POST /vision-therapy/claims"

  - priority: 10
    category: existence
    check: "The Claim named in the path exists."
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "every claim endpoint other than POST /vision-therapy/claims"

  - priority: 11
    category: existence
    check: "Every other referenced row exists - Payer, Therapist (therapist_id, performed_by_therapist_id, supervising_optometrist_id), TherapyRoom, Authorization, PlanPhase, KitItem, KitLoan, Referral, OcclusionPrescription."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint that names one of those rows"

  - priority: 12
    category: state
    check: "GLOBAL CLINICAL WRITE GATE. When the patient the request touches has clinical_status == DISCHARGED and the endpoint belongs to the clinical write family, the request is refused. Clinical write family: POST /vision-therapy/assessments, /assessments/{id}/measurements, /assessments/{id}/finalize, /assessments/{id}/sign, /assessments/{id}/amend, /therapy-plans, /therapy-plans/{id}/activate, /therapy-plans/{id}/advance-phase, /therapy-plans/{id}/revise, /therapy-plans/{id}/suspend, /therapy-plans/{id}/resume, /therapy-plans/{id}/phases, /phases/{id}/mastery, /therapy-plans/{id}/sessions, /therapy-plans/{id}/home-sessions, /sessions/{id}/check-in, /sessions/{id}/complete, /sessions/{id}/cancel, /sessions/{id}/no-show, /sessions/{id}/attest, /occlusion-prescriptions, /occlusion-prescriptions/{id}/adherence, /occlusion-prescriptions/{id}/taper, /kit-loans, /kit-loans/{id}/fulfill, /authorizations, /authorizations/{id}/reauthorize, /referrals, /referrals/{id}/re-refer. Everything else - all five claim endpoints, /kit-loans/{id}/return, /referrals/{id}/respond, /authorizations/{id}/close, /coverages, /patients/{id}/discharge, every GET, every configuration POST and the clock endpoint - is OUTSIDE the gate."
    error_id: ERR_PATIENT_DISCHARGED
    http_status: 409
    applies_to: "the clinical write family enumerated above"

  - priority: 13
    category: state
    check: "Optimistic concurrency. expected_authorization_version must equal Authorization.version, expected_plan_version must equal TherapyPlan.version, expected_coverage_version must equal Coverage.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions, POST /vision-therapy/therapy-plans/{id}/revise, POST /vision-therapy/claims"

  - priority: 14
    category: state
    check: "The target row is in a state that permits this transition per §1.2, and every state precondition on a directly referenced row holds - the source Assessment for a plan must be SIGNED with assessment_type EVALUATION; the Coverage on a claim submit must have status ACTIVE; the Authorization named at activation or carried by a session must have status IN {ACTIVE, EXHAUSTED} (EXHAUSTED is an OPEN state here, deliberately, so that rung 23 stays reachable); a KitLoan fulfil requires status REQUESTED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 15
    category: state
    check: "Cross-entity plan gate. The TherapyPlan the request depends on must have status == ACTIVE."
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions, /therapy-plans/{id}/home-sessions, /therapy-plans/{id}/advance-phase, /sessions/{id}/check-in, /phases/{id}/mastery, /kit-loans"

  - priority: 16
    category: business_safety
    check: "Therapist credentialing. The Therapist named in therapist_id must have credential_expires_at strictly after scheduled_start_at at scheduling, and strictly after performed_at at completion."
    error_id: ERR_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions, POST /vision-therapy/sessions/{id}/complete"

  - priority: 17
    category: business_safety
    check: "Segregation of duties. (a) Signing a REASSESSMENT requires X-User-ID != assessment.performed_by_therapist_id. (b) Correcting a claim requires X-User-ID != claim.submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /vision-therapy/assessments/{id}/sign, POST /vision-therapy/claims/{id}/correct"

  - priority: 18
    category: business_safety
    check: "Supervision. When the session's therapist_id names a Therapist whose credential is VISION_THERAPY_ASSISTANT, completion requires supervising_optometrist_id to be supplied and to name a Therapist whose credential is OPTOMETRIST and whose credential_expires_at is strictly after performed_at."
    error_id: ERR_SUPERVISION_REQUIRED
    http_status: 422
    applies_to: "POST /vision-therapy/sessions/{id}/complete"

  - priority: 19
    category: business_temporal
    check: "The UTC calendar date of scheduled_start_at lies inside the plan's Authorization window, inclusive of window_start_date and window_end_date."
    error_id: ERR_SESSION_OUTSIDE_AUTH_WINDOW
    http_status: 422
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions"

  - priority: 20
    category: business_constraint
    check: "Room occupancy with a turnover buffer. The request is refused when, for the same room_id, there exists a TherapySession with schedule_status IN {SCHEDULED, CHECKED_IN, COMPLETED} such that new.scheduled_start_at < existing.scheduled_end_at + ROOM_TURNOVER_BUFFER_MINUTES AND existing.scheduled_start_at < new.scheduled_end_at + ROOM_TURNOVER_BUFFER_MINUTES. ROOM_TURNOVER_BUFFER_MINUTES = 15. A gap of exactly 15 minutes is therefore accepted; 14 is refused."
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions"

  - priority: 21
    category: business_constraint
    check: "Therapist occupancy with NO buffer and half-open intervals. The request is refused when, for the same therapist_id, there exists a TherapySession with schedule_status IN {SCHEDULED, CHECKED_IN, COMPLETED} such that new.scheduled_start_at < existing.scheduled_end_at AND existing.scheduled_start_at < new.scheduled_end_at. Exact adjacency (new starts at the instant the previous one ends) is accepted - deliberately different interval arithmetic from rung 20."
    error_id: ERR_THERAPIST_CONFLICT
    http_status: 409
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions"

  - priority: 22
    category: business_constraint
    check: "Aggregate therapist capacity. See calculation therapist_daily_scheduled_minutes; the sum of existing plus requested scheduled minutes for that therapist on that UTC date must not exceed THERAPIST_MAX_DAILY_MINUTES = 180. A total of exactly 180 is accepted."
    error_id: ERR_THERAPIST_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions"

  - priority: 23
    category: business_fiscal
    check: "The plan's Authorization must have visits_remaining >= 1."
    error_id: ERR_AUTH_VISITS_EXHAUSTED
    http_status: 409
    applies_to: "POST /vision-therapy/therapy-plans/{id}/sessions"

  - priority: 24
    category: business_temporal
    check: "Reassessment currency for phase progression. When the phase being entered has sequence_index >= PHASE_REASSESS_FROM_INDEX = 3, the plan must have a SIGNED Assessment with assessment_type REASSESSMENT whose signed_at is at or after (clock now - REASSESS_WINDOW_DAYS = 21 days)."
    error_id: ERR_REASSESSMENT_REQUIRED
    http_status: 422
    applies_to: "POST /vision-therapy/therapy-plans/{id}/advance-phase"

  - priority: 25
    category: business_constraint
    check: "Activity mastery. The IN_PROGRESS PlanPhase must have activities_mastered_count >= required_mastery_count."
    error_id: ERR_MASTERY_NOT_MET
    http_status: 422
    applies_to: "POST /vision-therapy/therapy-plans/{id}/advance-phase"

  - priority: 26
    category: business_constraint
    check: "Home compliance. TherapyPlan.home_compliance_pct, recomputed at the moment of the call, must be >= PHASE_ADVANCE_COMPLIANCE_PCT = 75.0. Exactly 75.00 passes."
    error_id: ERR_COMPLIANCE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /vision-therapy/therapy-plans/{id}/advance-phase"

  - priority: 27
    category: business_referential
    check: "Equipment recovery before discharge. No KitLoan for this patient may have status IN {CHECKED_OUT, RECALLED}."
    error_id: ERR_LOAN_OUTSTANDING
    http_status: 409
    applies_to: "POST /vision-therapy/patients/{id}/discharge"

  - priority: 28
    category: business_fiscal
    check: "Stock availability. KitItem.on_hand_qty must be >= KitLoan.quantity at fulfilment; additionally a LOANABLE_SERIALIZED item requires quantity == 1."
    error_id: ERR_KIT_STOCK_DEPLETED
    http_status: 409
    applies_to: "POST /vision-therapy/kit-loans/{id}/fulfill"

  - priority: 29
    category: business_referential
    check: "Claim uniqueness. At most one Claim may exist per session_id, and at most one per assessment_id, regardless of claim status."
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /vision-therapy/claims"

  - priority: 30
    category: business_fiscal
    check: "Billability. A claim with service_class THERAPY_SESSION requires the named session to have billing_status == BILLABLE; a claim with service_class EVALUATION requires the named assessment to have status SIGNED."
    error_id: ERR_SESSION_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /vision-therapy/claims"

  - priority: 31
    category: business_fiscal
    check: "Vision frequency limit. When the coverage's payer_type is VISION and the matching last_paid_service_date_* for this service_class is not null, the whole months from that date to claim.service_date must be >= payer.frequency_limit_months."
    error_id: ERR_VISION_FREQUENCY_LIMIT
    http_status: 422
    applies_to: "POST /vision-therapy/claims"

  - priority: 32
    category: business_temporal
    check: "Reauthorization look-back. The reassessment_id supplied must name a SIGNED Assessment with assessment_type REASSESSMENT for the same patient whose signed_at is at or after (clock now - REAUTH_LOOKBACK_DAYS = 30 days)."
    error_id: ERR_REAUTH_REASSESSMENT_STALE
    http_status: 422
    applies_to: "POST /vision-therapy/authorizations/{id}/reauthorize"

  - priority: 33
    category: business_constraint
    check: "Referral retry cap. MUTATE-THEN-REJECT: when referral.attempt_count has already reached MAX_REFERRAL_ATTEMPTS = 3, the referral is first written to status ABANDONED and the call then fails."
    error_id: ERR_REFERRAL_ATTEMPT_LIMIT
    http_status: 409
    applies_to: "POST /vision-therapy/referrals/{id}/re-refer"

  - priority: 34
    category: business_safety
    check: "Taper gate. adherence_pct must be >= ADHERENCE_MIN_PCT_FOR_TAPER = 70.0 AND (baseline_acuity_logmar - current_acuity_logmar) must be >= TAPER_ACUITY_GATE_LOGMAR = 0.20."
    error_id: ERR_TAPER_GATE_NOT_MET
    http_status: 422
    applies_to: "POST /vision-therapy/occlusion-prescriptions/{id}/taper"

  - priority: 35
    category: business_constraint
    check: "Discharge reason preconditions, one per reason. GOALS_MET requires the patient's most recently created TherapyPlan to have discharge_ready == true. PLATEAU requires that plan's progress_state == PLATEAU. NON_COMPLIANCE requires that plan's home_compliance_pct < PHASE_ADVANCE_COMPLIANCE_PCT (75.0). TRANSFERRED requires at least one Referral for this patient with direction OUTBOUND and status ACCEPTED. LOST_TO_FOLLOW_UP requires at least one TherapySession for this patient with schedule_status NO_SHOW and no TherapySession with schedule_status IN {COMPLETED, ATTESTED} whose performed_at is at or after (clock now - LOST_TO_FOLLOWUP_DAYS = 60 days)."
    error_id: ERR_DISCHARGE_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /vision-therapy/patients/{id}/discharge"

  - priority: 36
    category: business_constraint
    check: "Appeal cap. MUTATE-THEN-REJECT: when claim.appeal_count has already reached MAX_APPEAL_ATTEMPTS = 2, appeal_attempt_log_count is incremented and last_appeal_attempt_at is stamped, Claim.version is bumped, and the call then fails. PRECEDENCE NOTE - this rung is only reached while the claim is still DENIED; any earlier call that moved the row out of DENIED makes rung 14 fire first and the bookkeeping write never happens."
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /vision-therapy/claims/{id}/appeal"

# =============================================================================
# §1.5 API Endpoint Table  (69 endpoints, all under /vision-therapy)
#   Path parameters are uniformly named {id}.
# =============================================================================
endpoints:

  # ---- Patient ----
  - method: POST
    path: "/vision-therapy/patients"
    description: "Register a patient. Starts in clinical_status INTAKE."
    roles: [FrontDesk, ClinicAdmin]
    code: 201
    input: [full_name, date_of_birth, diagnosis_category, "guardian_name?"]
    output: Patient
    side_effects: ["Patient created with clinical_status INTAKE and version 1"]

  - method: GET
    path: "/vision-therapy/patients/{id}"
    description: "Read one patient."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk, PatientUser]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/vision-therapy/patients/{id}/discharge"
    description: "Discharge the patient with a reason fork; each reason carries its own precondition (rung 35). OUTSIDE the clinical write gate."
    roles: [Optometrist]
    code: 200
    input: [discharge_reason]
    output: Patient
    side_effects:
      - "Patient.clinical_status -> DISCHARGED"
      - "CASCADE-B: plans -> DISCHARGED -> future sessions CANCELLED -> authorization units released -> authorization CLOSED"
      - "OcclusionPrescriptions with status IN {ACTIVE, TAPERED} -> DISCONTINUED"
      - "increments Patient.version by 1"

  # ---- Payer ----
  - method: POST
    path: "/vision-therapy/payers"
    description: "Create a payer configuration. payer_type selects the claim adjudication variant."
    roles: [ClinicAdmin]
    code: 201
    input: [name, payer_type, allowed_amount_timed_unit, allowed_amount_flat_session, allowed_amount_evaluation, coinsurance_rate, frequency_limit_months]
    output: Payer
    side_effects: []

  - method: GET
    path: "/vision-therapy/payers/{id}"
    description: "Read one payer."
    roles: [ClinicAdmin, BillingSpecialist, Optometrist, VisionTherapist, TherapyAssistant, FrontDesk]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # ---- Coverage ----
  - method: POST
    path: "/vision-therapy/coverages"
    description: "Attach a payer coverage to a patient, seeding its accumulators. OUTSIDE the clinical write gate."
    roles: [BillingSpecialist, ClinicAdmin]
    code: 201
    input: [patient_id, payer_id, member_number, effective_start_date, effective_end_date, "deductible_total?", "deductible_met?", "vision_allowance_total?", "last_paid_service_date_therapy?", "last_paid_service_date_evaluation?"]
    output: Coverage
    side_effects: ["vision_allowance_used := 0.00; vision_allowance_remaining := vision_allowance_total (INVARIANT-4)"]

  - method: GET
    path: "/vision-therapy/coverages/{id}"
    description: "Read one coverage with its live accumulators."
    roles: [ClinicAdmin, BillingSpecialist, Optometrist, VisionTherapist, TherapyAssistant, FrontDesk]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  - method: GET
    path: "/vision-therapy/coverages"
    description: "List coverages, filterable by patient or payer."
    roles: [ClinicAdmin, BillingSpecialist, Optometrist, VisionTherapist, TherapyAssistant, FrontDesk]
    code: 200
    input: ["patient_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: Coverage[]
    side_effects: []

  # ---- Authorization ----
  - method: POST
    path: "/vision-therapy/authorizations"
    description: "Grant a prior-authorization visit pool inside a date window."
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, coverage_id, auth_number, visits_authorized, window_start_date, window_end_date]
    output: Authorization
    side_effects: ["visits_consumed := 0, visits_released := 0, visits_remaining := visits_authorized (INVARIANT-1)"]

  - method: GET
    path: "/vision-therapy/authorizations/{id}"
    description: "Read one authorization and its four unit counters."
    roles: [ClinicAdmin, BillingSpecialist, Optometrist, VisionTherapist, TherapyAssistant, FrontDesk]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: "/vision-therapy/authorizations"
    description: "List authorizations, filterable by patient or coverage."
    roles: [ClinicAdmin, BillingSpecialist, Optometrist, VisionTherapist, TherapyAssistant, FrontDesk]
    code: 200
    input: ["patient_id?", "coverage_id?", "status?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/authorizations/{id}/reauthorize"
    description: "Add visits and extend the window; requires a signed reassessment inside the REAUTH_LOOKBACK_DAYS look-back (rung 32)."
    roles: [BillingSpecialist]
    code: 200
    input: [additional_visits, new_window_end_date, reassessment_id]
    output: Authorization
    side_effects:
      - "visits_authorized += additional_visits; visits_remaining += additional_visits"
      - "status -> ACTIVE; reauthorization_count += 1; last_reauthorized_at := clock"
      - "increments Authorization.version by 1"

  - method: POST
    path: "/vision-therapy/authorizations/{id}/close"
    description: "Close a visit pool. OUTSIDE the clinical write gate."
    roles: [BillingSpecialist]
    code: 200
    input: [close_reason]
    output: Authorization
    side_effects: ["status -> CLOSED; counters untouched so INVARIANT-1 still holds", "increments Authorization.version by 1"]

  # ---- Therapist / Room ----
  - method: POST
    path: "/vision-therapy/therapists"
    description: "Create a clinician record with a credential and an expiry instant."
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, credential, credential_expires_at, "npi?"]
    output: Therapist
    side_effects: []

  - method: GET
    path: "/vision-therapy/therapists/{id}"
    description: "Read one clinician."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: []
    output: Therapist
    side_effects: []

  - method: POST
    path: "/vision-therapy/rooms"
    description: "Create a therapy room. Rooms are contended for with a turnover buffer (rung 20)."
    roles: [ClinicAdmin]
    code: 201
    input: [name, equipment_class]
    output: TherapyRoom
    side_effects: []

  # ---- Assessment ----
  - method: POST
    path: "/vision-therapy/assessments"
    description: "Open a binocular battery in DRAFT. patient_age_years is computed here from encounter_date."
    roles: [Optometrist, VisionTherapist]
    code: 201
    input: [patient_id, assessment_type, purpose, encounter_date, performed_by_therapist_id, "plan_id?"]
    output: Assessment
    side_effects: ["patient_age_years computed (calculation patient_age_years)"]

  - method: GET
    path: "/vision-therapy/assessments/{id}"
    description: "Read one assessment with all computed clinical outputs."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: GET
    path: "/vision-therapy/assessments"
    description: "List assessments, filterable by patient, plan, performer or signer."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: ["patient_id?", "plan_id?", "performed_by_therapist_id?", "signed_by_therapist_id?", "assessment_type?", "purpose?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/assessments/{id}/measurements"
    description: "Append one instrument reading. For ACCOMMODATIVE_AMPLITUDE the age-derived reference band is computed here and its variant is chosen by the parent assessment's purpose."
    roles: [Optometrist, VisionTherapist, TherapyAssistant]
    code: 201
    input: [metric_code, eye, "npc_break_cm?", "npc_recovery_cm?", "amplitude_d?", "vergence_bo_break_pd?", "acuity_logmar?", "ciss_score?", "red_flag?"]
    output: BinocularMeasurement
    side_effects: ["reference_variant, expected_min_value, expected_band_high and within_reference_band computed (calculation accommodative_amplitude_reference_band)"]

  - method: GET
    path: "/vision-therapy/assessments/{id}/measurements"
    description: "List the measurement rows of one assessment."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: ["metric_code?", "limit?", "offset?"]
    output: BinocularMeasurement[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/assessments/{id}/finalize"
    description: "Close the battery and run every derived clinical output. Origin of CASCADE-A when a red flag is present."
    roles: [Optometrist, VisionTherapist]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "therapy_indicated, discharge_metric_met, red_flag_present computed"
      - "REASSESSMENT only: composite_progress_score, symptom_improvement_pct, improvement_delta_points, plateau_flag computed; TherapyPlan.progress_state and consecutive_low_delta_count updated; phase regression may fire"
      - "TherapyPlan.discharge_ready recomputed"
      - "CASCADE-A hop 1: an URGENT OUTBOUND Referral is created when red_flag_present is true"
      - "increments Assessment.version by 1"

  - method: POST
    path: "/vision-therapy/assessments/{id}/sign"
    description: "Optometrist attestation. A REASSESSMENT may not be signed by the clinician who performed it (rung 17)."
    roles: [Optometrist]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "signed_by_therapist_id := X-User-ID; signed_at := clock"
      - "an EVALUATION signature moves an INTAKE patient to ACTIVE"
      - "increments Assessment.version by 1"

  - method: POST
    path: "/vision-therapy/assessments/{id}/amend"
    description: "Re-open a SIGNED battery for correction; capped at MAX_ASSESSMENT_AMENDMENTS."
    roles: [Optometrist]
    code: 200
    input: ["amendment_reason?"]
    output: Assessment
    side_effects: ["status -> DRAFT; amendment_count += 1; signature cleared", "increments Assessment.version by 1"]

  # ---- TherapyPlan ----
  - method: POST
    path: "/vision-therapy/therapy-plans"
    description: "Create a therapy plan in DRAFT from a SIGNED EVALUATION; the plan's five baseline_* fields are snapshotted from that assessment's measurements."
    roles: [Optometrist]
    code: 201
    input: [patient_id, source_assessment_id, discharge_criteria_mode, prescribed_home_sessions_per_week]
    output: TherapyPlan
    side_effects: ["baseline_npc_break_cm, baseline_amplitude_d, baseline_vergence_bo_break_pd, baseline_acuity_logmar, baseline_ciss_score copied from the source assessment"]

  - method: GET
    path: "/vision-therapy/therapy-plans/{id}"
    description: "Read one plan with both of its state axes and every derived field."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: []
    output: TherapyPlan
    side_effects: []

  - method: GET
    path: "/vision-therapy/therapy-plans"
    description: "List plans, filterable by patient, source assessment or authorization."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: ["patient_id?", "source_assessment_id?", "authorization_id?", "status?", "progress_state?", "limit?", "offset?"]
    output: TherapyPlan[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/activate"
    description: "Bind an authorization and start phase 1. Also the return arm of the revision cycle."
    roles: [Optometrist]
    code: 200
    input: [authorization_id]
    output: TherapyPlan
    side_effects: ["status -> ACTIVE; authorization_id bound; phase 1 -> IN_PROGRESS", "increments TherapyPlan.version by 1"]

  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/advance-phase"
    description: "Advance to the next phase. Gated by rungs 24, 25 and 26 in that order."
    roles: [Optometrist, VisionTherapist]
    code: 200
    input: []
    output: TherapyPlan
    side_effects:
      - "current phase -> MASTERED; next phase -> IN_PROGRESS; current_phase_index += 1"
      - "when the current phase was the last one: plan -> COMPLETED and progress_state -> DISCHARGE_PENDING"
      - "increments TherapyPlan.version by 1"

  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/revise"
    description: "Open a revision that supersedes the plan's prior prescription. OCC-guarded on TherapyPlan.version."
    roles: [Optometrist]
    code: 200
    input: [expected_plan_version, "revision_reason?", "prescribed_home_sessions_per_week?"]
    output: TherapyPlan
    side_effects:
      - "status -> UNDER_REVISION; revision_count += 1"
      - "prescription change records previous_prescribed_home_sessions_per_week and prescription_changed_at"
      - "increments TherapyPlan.version by 1"

  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/suspend"
    description: "Suspend an active plan; cancels its future sessions."
    roles: [Optometrist]
    code: 200
    input: [suspension_reason]
    output: TherapyPlan
    side_effects: ["status -> SUSPENDED; future SCHEDULED and CHECKED_IN sessions -> CANCELLED; their authorization units are released", "increments TherapyPlan.version by 1"]

  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/resume"
    description: "Return a suspended plan to ACTIVE. A RED_FLAG_REFERRAL suspension requires every urgent outbound referral on the plan to be ACCEPTED or ABANDONED first."
    roles: [Optometrist]
    code: 200
    input: []
    output: TherapyPlan
    side_effects: ["status -> ACTIVE; suspension_reason cleared", "increments TherapyPlan.version by 1"]

  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/phases"
    description: "Append an ordered phase to a plan."
    roles: [Optometrist]
    code: 201
    input: [sequence_index, name, required_mastery_count]
    output: PlanPhase
    side_effects: ["PlanPhase created in LOCKED"]

  - method: GET
    path: "/vision-therapy/therapy-plans/{id}/phases"
    description: "List the phases of one plan in ascending sequence_index."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlanPhase[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/phases/{id}/mastery"
    description: "Record activity mastery against the phase that is IN_PROGRESS."
    roles: [Optometrist, VisionTherapist, TherapyAssistant]
    code: 200
    input: [mastered_delta]
    output: PlanPhase
    side_effects: ["activities_mastered_count += mastered_delta", "increments PlanPhase.version by 1"]

  # ---- TherapySession ----
  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/sessions"
    description: "Schedule an in-office session. Draws one unit from the plan's authorization pool; OCC-guarded on Authorization.version."
    roles: [FrontDesk, Optometrist, VisionTherapist]
    code: 201
    input: [therapist_id, room_id, scheduled_start_at, scheduled_end_at, procedure_code, expected_authorization_version]
    output: TherapySession
    side_effects:
      - "TherapySession created with modality IN_OFFICE, schedule_status SCHEDULED, billing_status PENDING"
      - "Authorization.visits_consumed += 1; visits_remaining -= 1; status -> EXHAUSTED when remaining reaches 0"
      - "increments Authorization.version by 1"

  - method: POST
    path: "/vision-therapy/therapy-plans/{id}/home-sessions"
    description: "Patient self-logs a home practice session. Never consumes an authorization unit and is never billable."
    roles: [PatientUser]
    code: 201
    input: [performed_at, timed_minutes, "activity_notes?"]
    output: TherapySession
    side_effects: ["TherapySession created with modality HOME, procedure_code HOME_PRACTICE, schedule_status LOGGED, billing_status NON_BILLABLE"]

  - method: GET
    path: "/vision-therapy/sessions/{id}"
    description: "Read one session with both of its state axes."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk, PatientUser]
    code: 200
    input: []
    output: TherapySession
    side_effects: []

  - method: GET
    path: "/vision-therapy/sessions"
    description: "List sessions, filterable by plan, patient, therapist, room, authorization or supervising optometrist."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk, PatientUser]
    code: 200
    input: ["plan_id?", "patient_id?", "therapist_id?", "room_id?", "authorization_id?", "supervising_optometrist_id?", "modality?", "schedule_status?", "billing_status?", "limit?", "offset?"]
    output: TherapySession[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/sessions/{id}/check-in"
    description: "Mark an in-office session as arrived."
    roles: [FrontDesk, Optometrist, VisionTherapist, TherapyAssistant]
    code: 200
    input: []
    output: TherapySession
    side_effects: ["schedule_status -> CHECKED_IN", "increments TherapySession.version by 1"]

  - method: POST
    path: "/vision-therapy/sessions/{id}/complete"
    description: "Record delivered minutes and price the session. Assistant-run sessions require documented supervision (rung 18)."
    roles: [Optometrist, VisionTherapist, TherapyAssistant]
    code: 200
    input: [performed_at, timed_minutes, "supervising_optometrist_id?", "activities_mastered_delta?"]
    output: TherapySession
    side_effects:
      - "schedule_status -> COMPLETED; billable_units and charge_amount computed"
      - "billing_status -> BILLABLE when billable_units >= 1, else NON_BILLABLE"
      - "TherapyPlan.cumulative_therapy_minutes += weighted_minutes; the IN_PROGRESS phase's activities_mastered_count += activities_mastered_delta"
      - "increments TherapySession.version by 1"

  - method: POST
    path: "/vision-therapy/sessions/{id}/cancel"
    description: "Cancel a scheduled or checked-in session and return its authorization unit to the pool."
    roles: [FrontDesk, Optometrist, VisionTherapist]
    code: 200
    input: [cancel_reason]
    output: TherapySession
    side_effects:
      - "schedule_status -> CANCELLED; billing_status -> NON_BILLABLE"
      - "Authorization.visits_released += 1; visits_remaining += 1; an EXHAUSTED pool returns to ACTIVE"
      - "increments TherapySession.version by 1 and Authorization.version by 1"

  - method: POST
    path: "/vision-therapy/sessions/{id}/no-show"
    description: "Mark a missed in-office session. Deliberately does NOT return the authorization unit."
    roles: [FrontDesk]
    code: 200
    input: []
    output: TherapySession
    side_effects: ["schedule_status -> NO_SHOW; billing_status -> NON_BILLABLE; authorization counters untouched", "increments TherapySession.version by 1"]

  - method: POST
    path: "/vision-therapy/sessions/{id}/attest"
    description: "Patient attests a logged home session; only attested home minutes count toward compliance and cumulative minutes."
    roles: [PatientUser]
    code: 200
    input: [attestation_statement]
    output: TherapySession
    side_effects:
      - "schedule_status -> ATTESTED; attested_at := clock"
      - "TherapyPlan.cumulative_therapy_minutes += weighted_minutes; TherapyPlan.home_compliance_pct recomputed"
      - "increments TherapySession.version by 1"

  # ---- Kit ----
  - method: POST
    path: "/vision-therapy/kit-items"
    description: "Create an activity/equipment catalogue item, serialized or consumable."
    roles: [ClinicAdmin]
    code: 201
    input: [name, item_class, replacement_cost, useful_life_months, in_service_date, initial_qty]
    output: KitItem
    side_effects: ["on_hand_qty := initial_qty; on_loan_qty, dispensed_qty and retired_qty := 0 (INVARIANT-2)"]

  - method: GET
    path: "/vision-therapy/kit-items/{id}"
    description: "Read one catalogue item and its four stock counters."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: []
    output: KitItem
    side_effects: []

  - method: POST
    path: "/vision-therapy/kit-loans"
    description: "Request a kit item for a patient on a plan."
    roles: [FrontDesk, VisionTherapist]
    code: 201
    input: [kit_item_id, patient_id, plan_id, quantity]
    output: KitLoan
    side_effects: ["KitLoan created in REQUESTED; no stock moves yet"]

  - method: GET
    path: "/vision-therapy/kit-loans/{id}"
    description: "Read one loan."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: []
    output: KitLoan
    side_effects: []

  - method: GET
    path: "/vision-therapy/kit-loans"
    description: "List loans, filterable by item, patient or plan."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: ["kit_item_id?", "patient_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: KitLoan[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/kit-loans/{id}/fulfill"
    description: "Hand the item over. Forks on item_class: serialized items are checked out, consumables are dispensed."
    roles: [FrontDesk, VisionTherapist]
    code: 200
    input: ["due_at?"]
    output: KitLoan
    side_effects:
      - "LOANABLE_SERIALIZED: status -> CHECKED_OUT; KitItem.on_hand_qty -= quantity; on_loan_qty += quantity"
      - "CONSUMABLE_STOCK: status -> DISPENSED; KitItem.on_hand_qty -= quantity; dispensed_qty += quantity"
      - "increments KitLoan.version by 1 and KitItem.version by 1"

  - method: POST
    path: "/vision-therapy/kit-loans/{id}/return"
    description: "Take the item back with a condition grade and price any damage. OUTSIDE the clinical write gate."
    roles: [FrontDesk, VisionTherapist]
    code: 200
    input: [returned_condition]
    output: KitLoan
    side_effects:
      - "status -> RETURNED; damage_fee_amount computed by kit_damage_fee"
      - "GOOD, FAIR or DAMAGED returns stock to on_hand_qty; LOST moves it to retired_qty (INVARIANT-2)"
      - "increments KitLoan.version by 1 and KitItem.version by 1"

  # ---- Claim ----
  - method: POST
    path: "/vision-therapy/claims"
    description: "Open a claim against a coverage for one billable session or one signed assessment. OCC-guarded on Coverage.version. OUTSIDE the clinical write gate."
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, coverage_id, service_class, service_date, expected_coverage_version, "session_id?", "assessment_id?"]
    output: Claim
    side_effects:
      - "procedure_code, units and billed_amount snapshotted from the session or fixed to EVALUATION_ENCOUNTER"
      - "the named session's billing_status -> CLAIMED"
      - "increments Coverage.version by 1"

  - method: GET
    path: "/vision-therapy/claims/{id}"
    description: "Read one claim with its full money breakdown."
    roles: [ClinicAdmin, BillingSpecialist, Optometrist, VisionTherapist, TherapyAssistant, FrontDesk]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/vision-therapy/claims"
    description: "List claims, filterable by patient, coverage, session or assessment."
    roles: [ClinicAdmin, BillingSpecialist, Optometrist, VisionTherapist, TherapyAssistant, FrontDesk]
    code: 200
    input: ["patient_id?", "coverage_id?", "session_id?", "assessment_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/claims/{id}/submit"
    description: "Send the claim to the payer. Records submitted_by_user_id for the segregation-of-duties check on correction."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> SUBMITTED; submitted_by_user_id := X-User-ID", "increments Claim.version by 1"]

  - method: POST
    path: "/vision-therapy/claims/{id}/adjudicate"
    description: "Record the payer response. PAID and DENIED run claim_adjudication_amounts on the variant selected by the coverage's payer_type."
    roles: [BillingSpecialist]
    code: 200
    input: [outcome, "denial_reason?"]
    output: Claim
    side_effects:
      - "money fields written per the selected variant (INVARIANT-3)"
      - "MEDICAL PAID: Coverage.deductible_met += deductible_applied_amount"
      - "VISION PAID: Coverage.vision_allowance_used and vision_allowance_remaining updated (INVARIANT-4); last_paid_service_date_* stamped"
      - "a PAID session claim moves TherapySession.billing_status -> SETTLED"
      - "increments Claim.version by 1 and, on PAID, Coverage.version by 1"

  - method: POST
    path: "/vision-therapy/claims/{id}/appeal"
    description: "Appeal a denial, capped at MAX_APPEAL_ATTEMPTS. MUTATE-THEN-REJECT at the cap (rung 36)."
    roles: [BillingSpecialist]
    code: 200
    input: ["appeal_reason?"]
    output: Claim
    side_effects:
      - "appeal_attempt_log_count += 1 and last_appeal_attempt_at := clock are committed before the cap is evaluated"
      - "under the cap: appeal_count += 1 and status -> SUBMITTED"
      - "increments Claim.version by 1 in both the accepted and the refused case"

  - method: POST
    path: "/vision-therapy/claims/{id}/correct"
    description: "Correct a rejected or denied claim back to DRAFT. Requires a different X-User-ID from the submitter (rung 17). OUTSIDE the clinical write gate."
    roles: [BillingSpecialist]
    code: 200
    input: ["correction_reason?", "corrected_units?"]
    output: Claim
    side_effects: ["status -> DRAFT; correction_count += 1; units and billed_amount recomputed when corrected_units is supplied", "increments Claim.version by 1"]

  # ---- Referral ----
  - method: POST
    path: "/vision-therapy/referrals"
    description: "Record an inbound or outbound referral with a response-due SLA."
    roles: [FrontDesk, Optometrist]
    code: 201
    input: [patient_id, direction, urgency, referring_provider_name, target_provider_name, reason, "plan_id?", "triggering_assessment_id?"]
    output: Referral
    side_effects: ["status SENT; attempt_count 1; sla_due_at := clock + the urgency's SLA hours"]

  - method: GET
    path: "/vision-therapy/referrals/{id}"
    description: "Read one referral."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/vision-therapy/referrals"
    description: "List referrals, filterable by patient, plan or triggering assessment."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk]
    code: 200
    input: ["patient_id?", "plan_id?", "triggering_assessment_id?", "direction?", "urgency?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/referrals/{id}/respond"
    description: "Record the receiving provider's answer and evaluate the SLA. OUTSIDE the clinical write gate."
    roles: [FrontDesk, Optometrist]
    code: 200
    input: [response_outcome, "decline_reason?"]
    output: Referral
    side_effects: ["status -> ACCEPTED or DECLINED; responded_at := clock; sla_breached recomputed", "increments Referral.version by 1"]

  - method: POST
    path: "/vision-therapy/referrals/{id}/re-refer"
    description: "Send a declined referral to a new target, capped at MAX_REFERRAL_ATTEMPTS. MUTATE-THEN-REJECT at the cap (rung 33)."
    roles: [FrontDesk, Optometrist]
    code: 200
    input: [target_provider_name]
    output: Referral
    side_effects:
      - "under the cap: attempt_count += 1; status -> SENT; sla_due_at re-stamped; responded_at, response_outcome and decline_reason cleared"
      - "at the cap: status -> ABANDONED is written and the call then fails"
      - "increments Referral.version by 1"

  # ---- Occlusion ----
  - method: POST
    path: "/vision-therapy/occlusion-prescriptions"
    description: "Prescribe patching. The daily dose comes from the age-band x severity ladder, capped at OCCLUSION_MAX_DAILY_HOURS."
    roles: [Optometrist]
    code: 201
    input: [patient_id, source_assessment_id, severity, baseline_acuity_logmar]
    output: OcclusionPrescription
    side_effects: ["age_band, prescribed_daily_hours and current_daily_hours computed (calculation occlusion_daily_dose)"]

  - method: GET
    path: "/vision-therapy/occlusion-prescriptions/{id}"
    description: "Read one patching prescription."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk, PatientUser]
    code: 200
    input: []
    output: OcclusionPrescription
    side_effects: []

  - method: GET
    path: "/vision-therapy/occlusion-prescriptions"
    description: "List patching prescriptions, filterable by patient or source assessment."
    roles: [ClinicAdmin, Optometrist, VisionTherapist, TherapyAssistant, BillingSpecialist, FrontDesk, PatientUser]
    code: 200
    input: ["patient_id?", "source_assessment_id?", "severity?", "status?", "limit?", "offset?"]
    output: OcclusionPrescription[]
    side_effects: []

  - method: POST
    path: "/vision-therapy/occlusion-prescriptions/{id}/adherence"
    description: "Log patching days; recomputes adherence_pct, which is one half of the taper gate."
    roles: [PatientUser]
    code: 200
    input: [logged_days_delta, adherent_days_delta]
    output: OcclusionPrescription
    side_effects: ["logged_days and adherent_days incremented; adherence_pct recomputed", "increments OcclusionPrescription.version by 1"]

  - method: POST
    path: "/vision-therapy/occlusion-prescriptions/{id}/taper"
    description: "Step the dose down by TAPER_STEP_HOURS. Gated on adherence and on acuity improvement (rung 34)."
    roles: [Optometrist]
    code: 200
    input: [current_acuity_logmar]
    output: OcclusionPrescription
    side_effects: ["current_daily_hours reduced; taper_step_count += 1; status -> TAPERED, or COMPLETED at zero hours", "increments OcclusionPrescription.version by 1"]

  # ---- test-driving endpoint ----
  - method: POST
    path: "/vision-therapy/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Moving the clock past an Authorization's window_end_date transitions that pool to EXPIRED, and past a Coverage's effective_end_date transitions it to TERMINATED."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Authorization rows whose window_end_date is now strictly in the past and whose status IN {ACTIVE, EXHAUSTED} -> EXPIRED"
      - "Coverage rows whose effective_end_date is now strictly in the past and whose status == ACTIVE -> TERMINATED"

# =============================================================================
# §1.6 Error Code Catalog (36 codes, one per validation rung)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The role is not listed for this endpoint, or a PatientUser acts on a row whose patient_id is not their own X-User-ID."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required field is missing or badly typed, a non-negative number is negative, an interval ends before it starts, a measurement omits the value its metric_code requires, a finalize is attempted with no NPC measurement, or a pagination parameter is out of range."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "A value supplied for one of the enum fields exhaustively listed at rung 4 is outside that field's declared value set."
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "No Patient exists with the id named in the path or in patient_id."
  - id: ERR_COVERAGE_NOT_FOUND
    http: 404
    condition: "No Coverage exists with the id named in the path or in coverage_id."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No Assessment exists with the id named in the path, source_assessment_id, assessment_id, triggering_assessment_id or reassessment_id."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No TherapyPlan exists with the id named in the path or in plan_id."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "No TherapySession exists with the id named in the path or in session_id."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No Claim exists with the id named in the path."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A referenced Payer, Therapist, TherapyRoom, Authorization, PlanPhase, KitItem, KitLoan, Referral or OcclusionPrescription does not exist."
  - id: ERR_PATIENT_DISCHARGED
    http: 409
    condition: "GLOBAL CLINICAL WRITE GATE - the patient is DISCHARGED and the endpoint belongs to the clinical write family enumerated at rung 12."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_authorization_version, expected_plan_version or expected_coverage_version does not match the parent row's current version."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The transition is not declared from the row's current state, or a directly referenced row is in a state the operation forbids."
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "The TherapyPlan the request depends on is not in status ACTIVE."
  - id: ERR_CREDENTIAL_EXPIRED
    http: 422
    condition: "The therapist's credential_expires_at is at or before the session's scheduled_start_at (scheduling) or performed_at (completion)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "A REASSESSMENT is signed by the clinician who performed it, or a claim is corrected by the same X-User-ID that submitted it."
  - id: ERR_SUPERVISION_REQUIRED
    http: 422
    condition: "An assistant-run session is completed without a valid, unexpired supervising optometrist documented on it."
  - id: ERR_SESSION_OUTSIDE_AUTH_WINDOW
    http: 422
    condition: "The requested scheduled_start_at date falls outside the authorization's inclusive date window."
  - id: ERR_ROOM_CONFLICT
    http: 409
    condition: "The requested room interval collides with an existing booking once ROOM_TURNOVER_BUFFER_MINUTES is applied on both sides."
  - id: ERR_THERAPIST_CONFLICT
    http: 409
    condition: "The requested therapist interval overlaps an existing booking under unbuffered half-open interval arithmetic."
  - id: ERR_THERAPIST_DAILY_CAP_EXCEEDED
    http: 409
    condition: "Existing plus requested scheduled minutes for that therapist on that UTC date would exceed THERAPIST_MAX_DAILY_MINUTES."
  - id: ERR_AUTH_VISITS_EXHAUSTED
    http: 409
    condition: "The plan's authorization has visits_remaining == 0."
  - id: ERR_REASSESSMENT_REQUIRED
    http: 422
    condition: "Advancing into a phase at or beyond PHASE_REASSESS_FROM_INDEX without a SIGNED reassessment inside the REASSESS_WINDOW_DAYS window."
  - id: ERR_MASTERY_NOT_MET
    http: 422
    condition: "The IN_PROGRESS phase has activities_mastered_count below its required_mastery_count."
  - id: ERR_COMPLIANCE_BELOW_THRESHOLD
    http: 422
    condition: "Recomputed home_compliance_pct is below PHASE_ADVANCE_COMPLIANCE_PCT."
  - id: ERR_LOAN_OUTSTANDING
    http: 409
    condition: "Discharge attempted while the patient still holds a KitLoan in status CHECKED_OUT or RECALLED."
  - id: ERR_KIT_STOCK_DEPLETED
    http: 409
    condition: "Fulfilment requested for more units than KitItem.on_hand_qty, or quantity != 1 on a LOANABLE_SERIALIZED item."
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "A Claim already exists for this session_id, or for this assessment_id."
  - id: ERR_SESSION_NOT_BILLABLE
    http: 422
    condition: "The named session is not in billing_status BILLABLE, or the named assessment is not SIGNED."
  - id: ERR_VISION_FREQUENCY_LIMIT
    http: 422
    condition: "A VISION claim's service_date is fewer than frequency_limit_months whole months after the last paid service of the same service_class."
  - id: ERR_REAUTH_REASSESSMENT_STALE
    http: 422
    condition: "The reassessment cited on a reauthorization was signed more than REAUTH_LOOKBACK_DAYS before the logical clock, or is not a SIGNED REASSESSMENT for that patient."
  - id: ERR_REFERRAL_ATTEMPT_LIMIT
    http: 409
    condition: "A re-refer is attempted once attempt_count has reached MAX_REFERRAL_ATTEMPTS; the referral is written to ABANDONED first."
  - id: ERR_TAPER_GATE_NOT_MET
    http: 422
    condition: "Adherence is below ADHERENCE_MIN_PCT_FOR_TAPER, or the acuity gain from baseline is below TAPER_ACUITY_GATE_LOGMAR."
  - id: ERR_DISCHARGE_CRITERIA_NOT_MET
    http: 422
    condition: "The precondition attached to the supplied discharge_reason does not hold."
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "An appeal is attempted once appeal_count has reached MAX_APPEAL_ATTEMPTS; the attempt counter and timestamp are committed first."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Operations administrator. Owns configuration - payers, therapists, rooms, kit catalogue - and the logical clock. Holds no clinical authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /vision-therapy/payers"
      - "POST /vision-therapy/therapists"
      - "POST /vision-therapy/rooms"
      - "POST /vision-therapy/kit-items"
      - "POST /vision-therapy/_clock/set_current_utc"
    shared_operations:
      - "POST /vision-therapy/patients (with FrontDesk)"
      - "POST /vision-therapy/coverages (with BillingSpecialist)"
      - "every GET endpoint"

  - name: Optometrist
    description: "Licensed optometrist. The only role that may sign an assessment, author or revise a plan, prescribe or taper occlusion, and discharge a patient."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /vision-therapy/assessments/{id}/sign"
      - "POST /vision-therapy/assessments/{id}/amend"
      - "POST /vision-therapy/therapy-plans"
      - "POST /vision-therapy/therapy-plans/{id}/activate"
      - "POST /vision-therapy/therapy-plans/{id}/revise"
      - "POST /vision-therapy/therapy-plans/{id}/suspend"
      - "POST /vision-therapy/therapy-plans/{id}/resume"
      - "POST /vision-therapy/therapy-plans/{id}/phases"
      - "POST /vision-therapy/patients/{id}/discharge"
      - "POST /vision-therapy/occlusion-prescriptions"
      - "POST /vision-therapy/occlusion-prescriptions/{id}/taper"
    shared_operations:
      - "POST /vision-therapy/assessments and /assessments/{id}/finalize (with VisionTherapist)"
      - "POST /vision-therapy/assessments/{id}/measurements and /phases/{id}/mastery (with VisionTherapist, TherapyAssistant)"
      - "POST /vision-therapy/therapy-plans/{id}/advance-phase (with VisionTherapist)"
      - "session scheduling, check-in, completion and cancellation"
      - "referral creation, response and re-referral (with FrontDesk)"
      - "every GET endpoint"
    identity_note: "X-User-ID must be the id of a Therapist whose credential is OPTOMETRIST. Segregation of duties compares this id against Assessment.performed_by_therapist_id."

  - name: VisionTherapist
    description: "Certified vision therapist. Runs sessions unsupervised and records the battery, but may not sign it."
    identity: "entity_backed:Therapist"
    exclusive_operations: []
    shared_operations:
      - "POST /vision-therapy/assessments, /assessments/{id}/measurements, /assessments/{id}/finalize"
      - "POST /vision-therapy/therapy-plans/{id}/advance-phase and /phases/{id}/mastery"
      - "POST /vision-therapy/therapy-plans/{id}/sessions, /sessions/{id}/check-in, /sessions/{id}/complete, /sessions/{id}/cancel"
      - "POST /vision-therapy/kit-loans, /kit-loans/{id}/fulfill, /kit-loans/{id}/return"
      - "every GET endpoint"
    identity_note: "X-User-ID must be the id of a Therapist whose credential is CERTIFIED_VISION_THERAPIST."

  - name: TherapyAssistant
    description: "Vision-therapy assistant. May deliver and complete sessions, but a session they run is only completable with a documented on-site supervising optometrist."
    identity: "entity_backed:Therapist"
    exclusive_operations: []
    shared_operations:
      - "POST /vision-therapy/assessments/{id}/measurements"
      - "POST /vision-therapy/phases/{id}/mastery"
      - "POST /vision-therapy/sessions/{id}/check-in and /sessions/{id}/complete"
      - "every GET endpoint"
    identity_note: "X-User-ID must be the id of a Therapist whose credential is VISION_THERAPY_ASSISTANT."

  - name: BillingSpecialist
    description: "Revenue-cycle operator. Owns coverages, authorizations and the whole claim lifecycle. Correcting a claim requires a different operator id from the one that submitted it."
    identity: "opaque"
    exclusive_operations:
      - "POST /vision-therapy/authorizations"
      - "POST /vision-therapy/authorizations/{id}/reauthorize"
      - "POST /vision-therapy/authorizations/{id}/close"
      - "POST /vision-therapy/claims"
      - "POST /vision-therapy/claims/{id}/submit"
      - "POST /vision-therapy/claims/{id}/adjudicate"
      - "POST /vision-therapy/claims/{id}/appeal"
      - "POST /vision-therapy/claims/{id}/correct"
    shared_operations:
      - "POST /vision-therapy/coverages (with ClinicAdmin)"
      - "every GET endpoint"

  - name: FrontDesk
    description: "Reception and scheduling. Registers patients, books rooms and therapists, handles kit hand-over and referral traffic."
    identity: "opaque"
    exclusive_operations:
      - "POST /vision-therapy/sessions/{id}/no-show"
    shared_operations:
      - "POST /vision-therapy/patients (with ClinicAdmin)"
      - "POST /vision-therapy/therapy-plans/{id}/sessions, /sessions/{id}/check-in, /sessions/{id}/cancel"
      - "POST /vision-therapy/kit-loans, /kit-loans/{id}/fulfill, /kit-loans/{id}/return"
      - "POST /vision-therapy/referrals, /referrals/{id}/respond, /referrals/{id}/re-refer"
      - "every GET endpoint"

  - name: PatientUser
    description: "The patient or their guardian acting through the portal. Self-logs home practice, attests it, and logs patching adherence."
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /vision-therapy/therapy-plans/{id}/home-sessions"
      - "POST /vision-therapy/sessions/{id}/attest"
      - "POST /vision-therapy/occlusion-prescriptions/{id}/adherence"
    shared_operations:
      - "GET /vision-therapy/patients/{id}, GET /vision-therapy/sessions, GET /vision-therapy/sessions/{id}, GET /vision-therapy/occlusion-prescriptions, GET /vision-therapy/occlusion-prescriptions/{id}"
    identity_note: "X-User-ID must equal the id of the Patient the row belongs to; acting on another patient's row is ERR_UNAUTHORIZED."

