              as: DOLAnalyst
              captures: { st: $.data.status }
          assert:
            - "LCA.${lca_id}.status == CERTIFIED (>= boundary is inclusive at equality)"
            - "LCA.${lca_id}.required_wage_cents == 10000000"

      - name: lottery_empty_candidate_set
        grounds:
          - calculations.lottery_selection
          - entities.CapProgram.fields.available_seats
          - state_machines.H1BRegistration.SUBMITTED_to_SELECTED
        distinguishing_aspect: |
          Running the lottery with zero SUBMITTED registrations selects nothing:
          selected_count stays 0 and available_seats stays 5 (== selection_quota); no error.
          Metric = registration/seat count; endpoint = run-lottery (distinct from the wage boundary).
        test_recipe:
          setup:
            - "A CapProgram for fiscal_year 2029 with selection_quota 5 and no registrations."
          setup_api_calls:
            - call: "POST /cap-programs"
              payload: { fiscal_year: 2029, selection_quota: 5 }
              as: USCISOfficer
              captures: { cap_id: $.data.id }
          trigger:
            - call: "POST /cap-programs/${cap_id}/run-lottery"
              as: USCISOfficer
              captures: { sel: $.data.selected_count, avail: $.data.available_seats, ran: $.data.lottery_run }
          assert:
            - "CapProgram.${cap_id}.selected_count == 0"
            - "CapProgram.${cap_id}.available_seats == 5"
            - "CapProgram.${cap_id}.lottery_run == true"

