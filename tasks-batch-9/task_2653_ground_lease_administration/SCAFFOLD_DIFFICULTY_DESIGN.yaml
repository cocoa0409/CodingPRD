            - call: "GET /portfolio/reversion-assessments"
              payload: { lease_id: "${lease_f_id}" }
              as: AssetManager
              captures: { assess_f_id: "$.data[0].id" }
          trigger:
            - call: "POST /portfolio/reversion-assessments/${assess_e_id}/inspection"
