              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id, mode: $.data.entry_mode }
          trigger:
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
              captures: { st: $.data.status, charge: $.data.member_charge_cents }
          assert:
            - "Visit.${v_id}.entry_mode == OVERAGE; check-in response status == CHECKED_IN, member_charge_cents == 5000 (overage 5000, no discount, no guests)"
