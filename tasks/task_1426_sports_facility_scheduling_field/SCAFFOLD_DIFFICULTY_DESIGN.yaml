          trigger:
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /invoices/${i_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /invoices/${i_id}/payments", payload: { amount_cents: 4000, method: "CHECK" }, as: FinanceClerk }
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}", captures: { p_st: $.data.status } }
