      - name: quorum_headcount_is_checked_before_employer_parity_and_vote_arithmetic
        claim_type: cascading_validation
        grounds:
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=19]
          - calculations.committee_quorum_evaluation
          - errors[ERR_QUORUM_NOT_MET]
          - errors[ERR_VOTE_COUNT_EXCEEDS_ATTENDANCE]
        distinguishing_aspect: |
          Priorities 17, 18 and 19 all read eligible_attendee_count, which only the quorum aggregate can produce, so the
          three checks are strictly ordered rather than independent. The first minutes attempt lists two attendees and
          five yes-votes, violating both 17 and 19 at once, and must report ERR_QUORUM_NOT_MET. The second attempt fixes
          attendance so 17 and 18 pass and only the vote arithmetic is wrong, revealing ERR_VOTE_COUNT_EXCEEDS_ATTENDANCE
          underneath. The third attempt passes all three and finalises. Because the meeting is still SCHEDULED after each
          refusal, the retries also prove the failed attempts wrote nothing.
