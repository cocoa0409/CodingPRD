              payload: { expected_lease_version: "${m12_l_v}", appraiser_firm: "Harbor Valuation LLC", appraisal_date: "2026-07-15", opinion_low_psf: 38.00, opinion_high_psf: 42.00, independence_attested: true }
              as: ComplianceOfficer
              captures: { m12_ap_id: $.data.id }
            - call: "POST /appraisals/${m12_ap_id}/decision"
              payload: { action: "QUALIFY", decision_reason: "Independent MAI opinion accepted" }
