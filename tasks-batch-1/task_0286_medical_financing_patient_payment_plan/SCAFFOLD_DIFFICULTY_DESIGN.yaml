  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_promotion_half_open_window_overlap_rejected
        grounds:
          - "validations[priority=9]"
          - 'endpoints["POST /provider-promotions"]'
          - entities.ProviderPromotion.fields.effective_start
        distinguishing_aspect: |
          Two ProviderPromotions for the same (provider, plan_category) use HALF-OPEN windows
          [start,end): a new [2026-06-01,2026-12-01) overlapping an existing [2026-01-01,2026-07-01)
          is rejected, but an adjacent [2026-07-01,2027-01-01) (touching the exclusive end) is accepted.
          Half-open adjacency semantics on the Provider resource.
        test_recipe:
          setup:
            - "Provider ENROLLED with an ACTIVE DEFERRED_INTEREST promotion over [2026-01-01,2026-07-01)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Ovl Clinic", specialty: "DERMATOLOGY", tax_id: "TX-DR-14", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { provo_id: $.data.id }
            - call: "POST /providers/${provo_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Ovl plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.2, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { plano_id: $.data.id }
            - call: "POST /promotional-plans/${plano_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provo_id}", promotional_plan_id: "${plano_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppo1_id: $.data.id }
          trigger:
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provo_id}", promotional_plan_id: "${plano_id}", effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err5: $.data.error_id }
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provo_id}", promotional_plan_id: "${plano_id}", effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppo3_id: $.data.id }
          assert:
            - "the overlapping [2026-06-01,2026-12-01) create returns 409 ERR_TEMPORAL_CONFLICT"
            - "the adjacent [2026-07-01,2027-01-01) create succeeds (201), proving half-open exclusivity at the shared boundary"

      - name: billing_statement_closed_adjacency_overlap_rejected
        grounds:
          - "validations[priority=9]"
          - 'endpoints["POST /_cycle/open_statement"]'
          - entities.BillingStatement.fields.period_start
        distinguishing_aspect: |
          BillingStatement periods use CLOSED intervals [period_start,period_end] with mandated
          adjacency: the next period must start exactly prior.period_end + 1 day. Opening a second
          statement at [2026-01-15,2026-02-15] while [2026-01-01,2026-01-31] is open is rejected for
          overlap — closed-interval, +1-day-adjacency semantics on the PatientAccount resource,
          geometrically distinct from the provider-promotion half-open windows.
        test_recipe:
          setup:
            - "Account ACTIVE with an OPEN statement [2026-01-01,2026-01-31]."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Stmt Pat", applicant_ssn_last4: "1014", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { appst_id: $.data.id }
            - call: "POST /credit-applications/${appst_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acctst_id: $.data.patient_account_id }
            - call: "POST /_cycle/open_statement"
              payload: { patient_account_id: "${acctst_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { stmt1_id: $.data.id }
          trigger:
            - call: "POST /_cycle/open_statement"
              payload: { patient_account_id: "${acctst_id}", period_start: "2026-01-15T00:00:00Z", period_end: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err6: $.data.error_id }
          assert:
            - "the overlapping [2026-01-15,2026-02-15] open returns 409 ERR_TEMPORAL_CONFLICT (closed-interval overlap)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_account_available_credit
        grounds:
          - state_machines.FinancedPurchase.settlement_status_SETTLED_to_REFUNDED
          - entities.PatientAccount.fields.available_credit_cents
          - entities.PatientAccount.fields.credit_limit_cents
        distinguishing_aspect: |
          Conserved quantity = account credit: at all times available_credit_cents +
          sum(open FinancedPurchase principal_cents) == credit_limit_cents. A REFUND restores exactly
          the refunded principal, returning available_credit to the pre-purchase value (500000).
        test_recipe:
          setup:
            - "Account ACTIVE limit 500,000; one SETTLED purchase principal 200,000 (available_credit 300,000)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Inv Clinic", specialty: "DENTAL", tax_id: "TX-DV-15", base_merchant_discount_rate: 0.10 }
              as: PlatformAdmin
              captures: { provi_id: $.data.id }
            - call: "POST /providers/${provi_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Inv plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.2, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { plani_id: $.data.id }
            - call: "POST /promotional-plans/${plani_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provi_id}", promotional_plan_id: "${plani_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppi_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Inv Pat", applicant_ssn_last4: "1015", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { appi_id: $.data.id }
            - call: "POST /credit-applications/${appi_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { accti_id: $.data.patient_account_id }
            - call: "GET /accounts/${accti_id}"
              payload: {}
              as: PlatformAdmin
              captures: { accti_v0: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${provi_id}", patient_account_id: "${accti_id}", provider_promotion_id: "${ppi_id}", principal_cents: 200000, expected_patient_account_version: "${accti_v0}" }
              as: Provider
              as_user_id: "${provi_id}"
              captures: { fpi_id: $.data.id, fpi_v: $.data.version }
            - call: "POST /financed-purchases/${fpi_id}/settle"
              payload: { expected_financed_purchase_version: "${fpi_v}" }
              as: PlatformAdmin
              captures: { seti_id: $.data.id }
          trigger:
            - call: "POST /refunds"
              payload: { financed_purchase_id: "${fpi_id}", refund_kind: "REFUND", amount_cents: 200000 }
              as: Provider
              as_user_id: "${provi_id}"
          assert:
            - "PatientAccount.${accti_id}.available_credit_cents == 500000 after refund"
            - "available_credit_cents (500000) + sum(open purchase principal == 0) == credit_limit_cents (500000)"

      - name: settlement_clawback_conserves_provider_net_cash
        grounds:
          - state_machines.Settlement.PAID_to_CLAWED_BACK
          - entities.Provider.fields.settled_net_cents
          - calculations.settlement_fee
        distinguishing_aspect: |
          Conserved quantity = provider net cash: settled_net_cents ==
          sum(net WHERE PAID) - sum(net WHERE CLAWED_BACK). Pay one settlement (net 180000), then a
          REFUND claws it back, returning settled_net_cents to 0 — a different conserved quantity than
          account credit.
        test_recipe:
          setup:
