# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_1291_cost_basis_reporting_wash_sale_tracking
# Breadth probe: enumerates every testable claim in SCAFFOLD.yaml §1.1–§1.7
# that §1.8 does not already cover. Claims already exercised as the failure
# path of a §1.8 instance are emitted as excluded_because: stubs.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: firm_creation_applies_system_defaults
        claim_type: defaults
        grounds: [entities.BrokerageFirm.fields.tax_year_open, entities.BrokerageFirm.fields.wash_sale_window_days, entities.BrokerageFirm.fields.correction_deadline_days]
        distinguishing_aspect: "POST /firms with only legal_name yields system defaults tax_year_open=2025, wash_sale_window_days=30, correction_deadline_days=1095."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Default Firm" }
              as: FirmAdmin
              captures: { firm_id: $.data.id, tyo: $.data.tax_year_open, wsw: $.data.wash_sale_window_days, cdd: $.data.correction_deadline_days }
          trigger: []
          assert:
            - "tyo == 2025"
            - "wsw == 30"
            - "cdd == 1095"

      - name: account_creation_defaults_disposal_method_fifo
        claim_type: defaults
        grounds: [entities.Account.fields.default_disposal_method]
        distinguishing_aspect: "Omitting default_disposal_method on account creation yields FIFO; status starts OPEN."
        test_recipe:
          setup: ["firm + customer exist"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm D1" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-ENT-1", display_name: "Defaults" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE" }
              as: TaxOps
              captures: { dm: $.data.default_disposal_method, st: $.data.status }
          assert:
            - "dm == FIFO"
            - "st == OPEN"

      - name: tax_lot_computed_fields_initialized_on_create
        claim_type: computed_fields
        grounds: [entities.TaxLot.fields.quantity_remaining, entities.TaxLot.fields.adjusted_cost_basis_cents, entities.TaxLot.fields.covered_status, entities.TaxLot.fields.lot_status, calculations.covered_status_classification]
        distinguishing_aspect: "A PURCHASE lot created after the covered effective date initializes quantity_remaining=quantity, adjusted=original basis, covered_status=COVERED, lot_status=OPEN; client-sent values for computed fields are ignored."
        test_recipe:
          setup: ["firm, customer, account, security exist"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm D2" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-ENT-2", display_name: "Computed" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "121212121", ticker: "CMP", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 25, original_cost_basis_cents: 25000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { qr: $.data.quantity_remaining, ab: $.data.adjusted_cost_basis_cents, cs: $.data.covered_status, ls: $.data.lot_status }
          assert:
            - "qr == 25"
            - "ab == 25000"
            - "cs == COVERED"
            - "ls == OPEN"

      - name: get_nonexistent_lot_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["firm exists"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm D3" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
          trigger:
            - call: "GET /firms/${firm_id}/tax_lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: customer_wash_sale_scope_key_equals_tin
        claim_type: computed_fields
        grounds: [entities.Customer.fields.wash_sale_scope_key]
        distinguishing_aspect: "wash_sale_scope_key is computed as taxpayer_tin on customer creation; two customers with different TINs have different scope keys."
        test_recipe:
          setup: ["firm exists"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm D4" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SCOPE-9", display_name: "Scope" }
              as: FirmAdmin
              captures: { scope: $.data.wash_sale_scope_key }
          assert:
            - "scope == TIN-SCOPE-9"

      - name: gift_lot_missing_basis_detail_rejected
        claim_type: required_fields
        grounds: ["validations[priority=11]", "errors[ERR_INCOMPLETE_LOT_BASIS_DETAIL]"]
        distinguishing_aspect: "Creating a GIFT lot without gift_donor_basis_cents and gift_fmv_cents_at_gift fails with ERR_INCOMPLETE_LOT_BASIS_DETAIL."
        test_recipe:
          setup: ["firm, customer, account, security exist"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm D5" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-ENT-5", display_name: "Gift" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "131313131", ticker: "GFT", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "GIFT" }
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INCOMPLETE_LOT_BASIS_DETAIL"

      - name: inheritance_lot_missing_fmv_rejected
        claim_type: required_fields
        grounds: ["validations[priority=11]", "errors[ERR_INCOMPLETE_LOT_BASIS_DETAIL]"]
        distinguishing_aspect: "Creating an INHERITANCE lot without inherited_fmv_cents_at_death fails with ERR_INCOMPLETE_LOT_BASIS_DETAIL."
        test_recipe:
          setup: ["firm, customer, account, security exist"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm D6" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-ENT-6", display_name: "Inherit" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "141414141", ticker: "INH", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "INHERITANCE" }
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INCOMPLETE_LOT_BASIS_DETAIL"

      - name: list_pagination_envelope_fields_present
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET list endpoints return the fixed envelope with limit/offset/total_count/has_more pagination fields."
        test_recipe:
          setup: ["firm with one customer"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm D7" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-ENT-7", display_name: "Page" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /firms/${firm_id}/customers?limit=10&offset=0"
              payload: {}
              as: TaxOps
          assert:
            - "response envelope contains meta.api_request_id, response_type == array, and pagination fields limit, offset, total_count, has_more"
            - "total_count == 1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: invalid_settle_on_settled_disposition
        claim_type: invalid_transition
        grounds: [state_machines.Disposition, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Second settle on an already-SETTLED disposition fails with ERR_INVALID_STATE_TRANSITION; no further lot mutation occurs."
        test_recipe:
          setup: ["customer, account, lot 10 sh basis 10000, disposition settled once"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm SM1" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SM-1", display_name: "SM One" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "151515151", ticker: "SM1", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "TaxLot.${lot_id}.quantity_remaining == 0 (no double-consumption)"

      - name: void_pending_disposition_and_settle_after_void_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Disposition.PENDING_to_VOIDED, state_machines.Disposition]
        distinguishing_aspect: "VOIDED is terminal: settle on a VOIDED disposition fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["customer, account, lot, PENDING disposition"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm SM2" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SM-2", display_name: "SM Two" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "161616161", ticker: "SM2", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/void"
              payload: {}
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: corporate_action_cancel_then_apply_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CorporateAction.ANNOUNCED_to_CANCELLED, state_machines.CorporateAction.ANNOUNCED_to_EFFECTIVE]
        distinguishing_aspect: "CANCELLED is terminal: apply on a CANCELLED corporate action fails with ERR_INVALID_STATE_TRANSITION and no lots are superseded."
        test_recipe:
          setup: ["customer, account, lot, ANNOUNCED split action that is then cancelled"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm SM3" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SM-3", display_name: "SM Three" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "171717171", ticker: "SM3", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities/${sec_id}/corporate_actions"
              payload: { action_type: "SPLIT", effective_date: "2025-03-01T00:00:00Z", split_ratio_numerator: 2, split_ratio_denominator: 1 }
              as: TaxOps
              captures: { ca_id: $.data.id }
            - call: "POST /firms/${firm_id}/corporate_actions/${ca_id}/cancel"
              payload: {}
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/corporate_actions/${ca_id}/apply"
              payload: {}
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "TaxLot.${lot_id}.lot_status == OPEN (not superseded)"

      - name: account_close_blocked_with_open_lots
        claim_type: precondition_enforcement
        grounds: [state_machines.Account.OPEN_to_CLOSED, "errors[ERR_ACCOUNT_HAS_OPEN_LOTS]", "validations[priority=21]"]
        distinguishing_aspect: "Closing an account whose lot still has quantity_remaining > 0 fails with ERR_ACCOUNT_HAS_OPEN_LOTS."
        test_recipe:
          setup: ["customer, account with one open lot of 10 sh"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm SM4" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SM-4", display_name: "SM Four" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "181818181", ticker: "SM4", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/close"
              payload: {}
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_HAS_OPEN_LOTS"

      - name: customer_close_blocked_with_open_account
        claim_type: precondition_enforcement
        grounds: [state_machines.Customer.ACTIVE_to_CLOSED, "errors[ERR_CUSTOMER_HAS_OPEN_ACCOUNTS]", "validations[priority=22]"]
        distinguishing_aspect: "Closing a customer whose account is still OPEN fails with ERR_CUSTOMER_HAS_OPEN_ACCOUNTS."
        test_recipe:
          setup: ["customer with one OPEN account"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm SM5" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SM-5", display_name: "SM Five" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/customers/${cust_id}/close"
              payload: {}
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CUSTOMER_HAS_OPEN_ACCOUNTS"

      - name: suspended_customer_blocks_new_disposition
        claim_type: precondition_enforcement
        grounds: [state_machines.Customer.ACTIVE_to_SUSPENDED, "validations[priority=5]", "errors[ERR_CUSTOMER_SUSPENDED]"]
        distinguishing_aspect: "After Customer ACTIVE → SUSPENDED, creating a disposition on any of the customer's accounts fails with ERR_CUSTOMER_SUSPENDED."
        test_recipe:
          setup: ["customer with account, security; customer then suspended"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm SM6" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SM-6", display_name: "SM Six" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "191919191", ticker: "SM6", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/suspend"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 5, proceeds_cents: 7000, method: "FIFO" }
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CUSTOMER_SUSPENDED"

      - name: restricted_account_blocks_new_disposition
        claim_type: precondition_enforcement
        grounds: [state_machines.Account.OPEN_to_RESTRICTED, "validations[priority=6]", "errors[ERR_ACCOUNT_RESTRICTED]"]
        distinguishing_aspect: "After Account OPEN → RESTRICTED, creating a disposition on that account fails with ERR_ACCOUNT_RESTRICTED."
        test_recipe:
          setup: ["customer, account, security; account then restricted"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm SM7" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SM-7", display_name: "SM Seven" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
