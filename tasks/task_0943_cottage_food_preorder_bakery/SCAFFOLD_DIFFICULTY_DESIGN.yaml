  - rule_id: transitive_cascade
    instances:
      - name: recall_lot_depth_six_cascade_with_status_guarded_dead_leg
        grounds:
          - state_machines.IngredientLot.CONSUMED_to_RECALLED
          - state_machines.Recipe.PUBLISHED_to_REVISING
          - state_machines.Batch.MIXED_to_SCRAPPED_RECALL
          - state_machines.OrderLine.PENDING_to_RECALL_VOID
          - state_machines.Order.IN_PRODUCTION_to_VOIDED_RECALL
          - state_machines.Label.ISSUED_to_VOID
          - calculations.refund_waterfall
          - entities.RecipeComponent.fields.recalled_component
        distinguishing_aspect: |
          Six chained hops, each caused by the previous one: lot -> component ->
          recipe -> batch -> order line -> order -> label plus refund. Hop 3 is
          guarded by batch_status, so the sibling batch already in ALLOCATED is NOT
          scrapped and its order stays IN_PRODUCTION with its line still ALLOCATED -
          a cascade leg that provably does not fire. Trigger is a lot recall, which
          is a different triggering transition from the under-yield cascade.
        test_recipe:
          setup:
            - "An ACTIVE baker whose single released flour lot backs one PUBLISHED recipe used by TWO listed menu items: a STANDARD cookie and a LONG_BAKE loaf."
            - "Two CONFIRMED PICKUP_COUNTER orders on one window: order A with 13 cookies (4600, tax 0) and order B with 4 loaves (3600, tax 0)."
            - "Order A has a CAPTURED payment of 5100 cents (subtotal 4600 plus fixed tip 500)."
            - "The window is LOCKED, PLANNED and IN_PRODUCTION; the loaf batch has been baked and yield-confirmed so it is ALLOCATED, while the cookie batch is only MIXED."
            - "Order A's cookie line carries an ISSUED label; the flour lot is CONSUMED because the loaf batch was baked."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
