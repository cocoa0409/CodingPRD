      - name: cycle_freeze_unfreeze_restores_prior_posture
        grounds:
          - state_machines.AssessmentCycle.ACTIVE_to_FROZEN
          - state_machines.AssessmentCycle.FROZEN_to_ACTIVE
          - state_machines.AssessmentCycle.SCORING_to_FROZEN
          - state_machines.AssessmentCycle.FROZEN_to_SCORING
        distinguishing_aspect: |
          Branching revert-loop on AssessmentCycle (distinct entity from the instrument cycle):
          FROZEN is a fork state that must restore the exact pre-freeze posture — ACTIVE->FROZEN->ACTIVE
          and SCORING->FROZEN->SCORING round-trips, with frozen_from_posture/frozen_reason proving
          the restore target rather than a fixed state.
        test_recipe:
          setup: ["Cycle cy in ACTIVE (window 2026-08-10..2026-08-20); no sessions scheduled"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
