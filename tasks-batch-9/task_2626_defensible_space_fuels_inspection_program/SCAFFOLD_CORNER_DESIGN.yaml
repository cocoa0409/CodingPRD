            - "After the trigger ComplianceCertificate.${certA}.status == \"REVOKED\" with revoked_at_utc == \"2026-09-10T00:00:00Z\""
            - "ComplianceCertificate.${certA}.snapshot_risk_class == \"MODERATE\" and snapshot_compliance_status == \"COMPLIANT\": revocation preserves the issuance snapshot"
            - "ComplianceCertificate.${certB}.status == \"DENIED\" and revoked_at_utc == null: a DENIED row is outside the ISSUED-only cascade"
            - "Parcel.${p1}.risk_score == 70.49, risk_class == \"HIGH\", compliance_status == \"NON_COMPLIANT\" and open_violation_count == 1"
            - "The new ViolationNotice on ${p1} has severity MAJOR, delivered_at_utc \"2026-09-15T00:00:00Z\", compliance_days 30 and deadline_utc \"2026-10-15T23:59:59Z\""

  # ==========================================================================
  - section: calculations
    instances:

      - name: certified_mail_major_notice_deadline_correct_result
        claim_type: Correct Result
        grounds:
          - calculations.notice_compliance_deadline
          - calculations.zone_deficiency_assessment
          - entities.ViolationNotice.fields.deadline_utc
        distinguishing_aspect: |
          The whole four-step deadline chain lands on one pinned instant: issued 2026-08-22, CERTIFIED_MAIL
          adds MAIL_SERVICE_DAYS 5 to give delivered 2026-08-27, severity MAJOR gives 30 compliance days
          (no compression because hazard_zone is HIGH), and the deadline is the end of the 30th day,
          2026-09-26T23:59:59Z — not 2026-09-21 (which would ignore constructive service) and not a
          midnight boundary.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel (slope 30); a NOTICED inspection graded 5.0 / 15.0 / 118.0 ft at clock 2026-08-22."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-3001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
