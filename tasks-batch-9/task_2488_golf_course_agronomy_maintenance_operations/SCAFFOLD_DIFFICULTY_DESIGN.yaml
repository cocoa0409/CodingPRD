              as_user_id: "super-1"
              captures: { rain1_id: $.data.id }
            - call: "GET /courses/${course_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_v2: $.data.version }
            - call: "POST /maintenance-windows/${win_id}/reschedule"
              payload: { window_start: "2026-08-02T05:00:00Z", window_end: "2026-08-02T06:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "HEAVY_RAIN", expected_clear_at: "2026-08-02T06:00:00Z", expected_course_version: "${course_v2}" }
              as: Superintendent
