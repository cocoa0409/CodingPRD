              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESIDENCY_NOT_RESERVED (state pri 7 wins over frozen pri 8)"
            - "Community.is_admissions_frozen == true (so the frozen check would also fire if reached)"

      - name: care_apply_invalid_step_beats_no_bed_occupied
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INVALID_CARE_STEP]
          - errors[ERR_NO_BED_OCCUPIED]
        distinguishing_aspect: |
          Pair business_constraint (ERR_INVALID_CARE_STEP, pri 9) vs business_referential
          (ERR_NO_BED_OCCUPIED, pri 10): an INDEPENDENT residency proposing a direct jump to SKILLED
          (a skip) with no occupied bed fails BOTH, and pri 9 wins → ERR_INVALID_CARE_STEP, a
          different category pair than instance 1's safety/state pairing.
        test_recipe:
          setup:
            - "Community c; residency ACTIVE at INDEPENDENT, with no bed reservation at all; a SKILLED transition proposed directly from INDEPENDENT (skip)."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Sage", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Sg Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
