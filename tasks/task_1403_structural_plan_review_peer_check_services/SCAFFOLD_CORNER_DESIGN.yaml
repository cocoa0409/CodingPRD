            - "${asg1_status} == COMPLETED"
            - "Reviewer.${rev_id}.active_assignment_count == 0"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: sqft_fee_minimum_floor_applied
        claim_type: correct_result
        grounds: [calculations.estimated_fee]
        distinguishing_aspect: "500 sqft RESIDENTIAL x 40 = 20000 cents < MIN_BASE_FEE_CENTS, so the 50000-cent floor binds."
        test_recipe:
          setup: ["SQUARE_FOOTAGE jurisdiction"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "SQUARE_FOOTAGE", turnaround_days: 10, sla_mode: "CALENDAR" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Min Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE11", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Tiny", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "RESIDENTIAL", risk_category: "I", scope: "FULL_REVIEW", declared_valuation_cents: 100000, floor_area_sqft: 500 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
          assert:
            - "Engagement.${eng_id}.estimated_fee_cents == 50000 (minimum base fee floor)"

      - name: expedite_halves_business_sla_with_ceil
        claim_type: correct_result
        grounds: [calculations.turnaround_sla]
        distinguishing_aspect: "Expedite halves 15 days with ceil -> 8 business days; received Monday 2026-08-03 -> due 2026-08-13T23:59:59.999Z (halving pinned BEFORE business-day counting)."
        test_recipe:
          setup: ["BUSINESS 15d jurisdiction; engagement requested_expedite=true; cycle created at Monday 2026-08-03T10:00:00Z"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Exp Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE12", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Expedite", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000, requested_expedite: true }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://exp-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id }
          assert:
            - "ReviewCycle.${cyc}.due_at == 2026-08-13T23:59:59.999Z (ceil(15/2)=8 business days after Mon 2026-08-03)"

      - name: late_completion_sets_is_on_time_false
        claim_type: correct_result
        grounds: [calculations.on_time_evaluation]
        distinguishing_aspect: "Completing one second after due_at (2026-08-18T10:00:01Z vs due 2026-08-18T10:00:00Z CALENDAR) yields is_on_time == false."
        test_recipe:
          setup: ["CALENDAR 15d jurisdiction; cycle received 2026-08-03T10:00:00Z; comment raised; clock at due+1s"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Late Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE13", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Late", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://late-v1" }
              as: ReviewCoordinator
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc}", code_section_ref: "1607.1", reference_edition: "IBC_2021", severity: "MINOR", category: "CALCULATION", comment_text: "Roof live load not shown" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T10:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plan-review/cycles/${cyc}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          assert:
            - "ReviewCycle.${cyc}.due_at == 2026-08-18T10:00:00Z"
            - "ReviewCycle.${cyc}.is_on_time == false (completed one second past due)"

      - name: addressed_comment_still_blocks_approval
        claim_type: input_set_filtering
        grounds: [calculations.unresolved_comment_count, "errors[ERR_UNRESOLVED_COMMENTS_REMAIN]"]
        distinguishing_aspect: "The unresolved input set includes ADDRESSED: a comment with a response but no verification still blocks approval."
        test_recipe:
          setup: ["cycle 1 COMMENTS_ISSUED; comment ADDRESSED (responded, not yet verified); cycle 2 IN_REVIEW"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Addr Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE14", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Addressed Blocks", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://addr-v1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1}", code_section_ref: "1609.1", reference_edition: "IBC_2021", severity: "MAJOR", category: "LATERAL_SYSTEM", comment_text: "Wind pressures missing for parapet" }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { com: $.data.id }
            - call: "POST /plan-review/cycles/${cyc1}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/comments/${com}/responses"
              payload: { response_text: "Parapet pressures added" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://addr-v2" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /plan-review/cycles/${cyc2}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNRESOLVED_COMMENTS_REMAIN (ADDRESSED counts as unresolved)"
            - "Engagement.${eng_id}.unresolved_comment_count == 1"
            - "ReviewCycle.${cyc2}.status == IN_REVIEW"

      - name: cycle_numbers_monotonic_across_resubmittals
        claim_type: correct_result
        grounds: [calculations.cycle_numbering]
        distinguishing_aspect: "cycle_number is 1-based and strictly increasing per engagement (1, 2); engagement.cycle_count tracks the total."
        test_recipe:
          setup: ["engagement whose cycle 1 reached COMMENTS_ISSUED"]
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "CA", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "BUSINESS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "Num Reviewer", licenses: [{ state_code: "CA", license_type: "PE", license_number: "PE15", expires_on: "2030-01-01" }] }
