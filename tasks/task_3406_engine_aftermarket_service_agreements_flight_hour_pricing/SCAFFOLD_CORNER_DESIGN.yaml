scaffold_corner_design:
  - section: entities
    instances:
      - name: engine_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Engine]
        distinguishing_aspect: "Creating an engine with the five required inputs returns 201 with system defaults: cumulative_flight_hours 0, cumulative_cycles 0, status IN_SERVICE, agreement_id null, version 1, and a server-minted UUID id."
        test_recipe:
          setup: ["operator exists"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Arc Air", iata_code: "A1", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc1: $.data.id }
          trigger:
            - call: "POST /api/engines"
              payload: { operator_id: "${opc1}", esn: "ESN-C001", engine_model: "CFM56-7B", base_severity_tier: "MODERATE", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { ec1: $.data.id, ec1_status: $.data.status, ec1_hours: $.data.cumulative_flight_hours, ec1_ver: $.data.version }
          assert:
            - "captured ec1_status == IN_SERVICE and ec1_hours == 0 and ec1_ver == 1"
            - "captured ec1 is a UUID-shaped server id; agreement_id is null in the response"
      - name: directive_creation_has_no_version_field
        claim_type: immutability
        grounds: [entities.Directive]
        distinguishing_aspect: "Directive is common_fields:false (append-only): the creation response carries id and created_at but no version or updated_at key."
        test_recipe:
          setup: ["nothing required beyond empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/directives"
              payload: { directive_ref: "SB-2026-0007", directive_type: "SB", applicability_model: "CFM56-7B", mandatory: false, estimated_cost_usd: 25000, compliance_date: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { dc1: $.data.id }
          assert:
            - "response data has id and created_at and does NOT contain keys version or updated_at"
      - name: get_engine_returns_404_for_unknown_id
        claim_type: not_found
        grounds: ["errors[ERR_ENGINE_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random UUID under /api/engines yields the engine-specific 404, not a generic one."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/engines/11111111-2222-3333-4444-555555555555"
              as: PlatformAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "captured nf_err == ERR_ENGINE_NOT_FOUND with http 404"
      - name: engine_list_pagination_and_filters
        claim_type: listing
        grounds: [endpoints.GET /api/engines, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and exposes total_count and has_more; operator_id filter scopes the list."
        test_recipe:
          setup: ["one operator with three engines"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Bay Air", iata_code: "B1", credit_rating: "C" }
              as: PlatformAdmin
              captures: { opc2: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc2}", esn: "ESN-C101", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 5000 }
              as: PlatformAdmin
            - call: "POST /api/engines"
              payload: { operator_id: "${opc2}", esn: "ESN-C102", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 5000 }
              as: PlatformAdmin
            - call: "POST /api/engines"
              payload: { operator_id: "${opc2}", esn: "ESN-C103", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 5000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/engines"
              payload: { operator_id: "${opc2}", limit: 2, offset: 0 }
              as: FinanceController
              captures: { page1: $.data }
            - call: "GET /api/engines"
              payload: { operator_id: "${opc2}", limit: 2, offset: 2 }
              as: FinanceController
              captures: { page2: $.data }
          assert:
            - "page1 returns 2 items with total_count 3 and has_more true"
            - "page2 returns 1 item with total_count 3 and has_more false"
      - name: not_found_battery_for_remaining_resources
        claim_type: not_found
        grounds: ["errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_SHOP_VISIT_NOT_FOUND]", "errors[ERR_WORKSCOPE_NOT_FOUND]", "errors[ERR_REQUISITION_NOT_FOUND]", "errors[ERR_SPARE_ENGINE_NOT_FOUND]", "errors[ERR_LEASE_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_STATEMENT_NOT_FOUND]", "errors[ERR_OPERATOR_NOT_FOUND]"]
        distinguishing_aspect: "Every resource-specific 404 in the catalog is triggerable: unknown path ids and unknown body foreign keys."
        test_recipe:
          setup: ["empty DB; one operator for the body-FK check"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Cave Air", iata_code: "C9", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc3: $.data.id }
          trigger:
            - call: "GET /api/agreements/11111111-2222-3333-4444-555555555555"
              as: ContractManager
              captures: { e_agr: $.data.error_id }
            - call: "GET /api/shop-visits/11111111-2222-3333-4444-555555555555"
              as: ShopPlanner
              captures: { e_sv: $.data.error_id }
            - call: "GET /api/workscopes/11111111-2222-3333-4444-555555555555"
              as: ShopPlanner
              captures: { e_ws: $.data.error_id }
            - call: "POST /api/part-requisitions/11111111-2222-3333-4444-555555555555/source"
              as: ShopPlanner
              captures: { e_req: $.data.error_id }
            - call: "GET /api/spare-engines/11111111-2222-3333-4444-555555555555"
              as: PlatformAdmin
              captures: { e_sp: $.data.error_id }
            - call: "POST /api/spare-engine-leases/11111111-2222-3333-4444-555555555555/activate"
              as: Operator
              as_user_id: "${opc3}"
              captures: { e_le: $.data.error_id }
            - call: "POST /api/flight-hour-reports/11111111-2222-3333-4444-555555555555/verify"
              as: FinanceController
              captures: { e_rep: $.data.error_id }
            - call: "POST /api/billing-statements/11111111-2222-3333-4444-555555555555/settle"
              as: FinanceController
              captures: { e_st: $.data.error_id }
            - call: "POST /api/engines"
              payload: { operator_id: "11111111-2222-3333-4444-555555555555", esn: "ESN-C999", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 1000 }
              as: PlatformAdmin
              captures: { e_op: $.data.error_id }
          assert:
            - "e_agr == ERR_AGREEMENT_NOT_FOUND, e_sv == ERR_SHOP_VISIT_NOT_FOUND, e_ws == ERR_WORKSCOPE_NOT_FOUND"
            - "e_req == ERR_REQUISITION_NOT_FOUND, e_sp == ERR_SPARE_ENGINE_NOT_FOUND, e_le == ERR_LEASE_NOT_FOUND"
            - "e_rep == ERR_REPORT_NOT_FOUND, e_st == ERR_STATEMENT_NOT_FOUND, e_op == ERR_OPERATOR_NOT_FOUND"
  - section: state_machines
    instances:
      - name: report_initial_state_and_double_verify
        claim_type: invalid_transition
        grounds: [state_machines.FlightHourReport]
        distinguishing_aspect: "A report is born SUBMITTED; verify moves it to VERIFIED (terminal), and a second verify is rejected with ERR_INVALID_STATE (terminal lockdown / idempotency)."
        test_recipe:
          setup: ["enrolled engine ESN-S101 in an ACTIVE agreement"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Stone Air", iata_code: "S1", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc4: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc4}", esn: "ESN-S101", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { ec4: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-C401", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { ac4: $.data.id }
            - call: "POST /api/agreements/${ac4}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${ac4}/enroll"
              payload: { engine_id: "${ec4}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${ec4}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 150, cycles: 60, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${opc4}"
              captures: { rc4: $.data.id, rc4_status: $.data.status }
          trigger:
            - call: "POST /api/flight-hour-reports/${rc4}/verify"
              as: FinanceController
              captures: { rc4_status2: $.data.status }
            - call: "POST /api/flight-hour-reports/${rc4}/verify"
              as: FinanceController
              captures: { rc4_err: $.data.error_id }
          assert:
            - "captured rc4_status == SUBMITTED (initial state)"
            - "captured rc4_status2 == VERIFIED (valid transition)"
            - "captured rc4_err == ERR_INVALID_STATE (second verify from terminal VERIFIED)"
      - name: statement_settle_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BillingStatement]
        distinguishing_aspect: "SETTLED is terminal for statements: the second settle is rejected with ERR_INVALID_STATE and recomputation does not run twice."
        test_recipe:
          setup: ["enrolled engine ESN-S201 with a VERIFIED 100 h report; statement for 2026-09 issued and settled once"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Tarn Air", iata_code: "T1", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc5: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc5}", esn: "ESN-S201", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { ec5: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-C501", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { ac5: $.data.id }
            - call: "POST /api/agreements/${ac5}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${ac5}/enroll"
              payload: { engine_id: "${ec5}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${ec5}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 100, cycles: 40, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${opc5}"
              captures: { rc5: $.data.id }
            - call: "POST /api/flight-hour-reports/${rc5}/verify"
              as: FinanceController
            - call: "POST /api/agreements/${ac5}/billing-statements"
              payload: { period: "2026-09" }
              as: FinanceController
              captures: { bc5: $.data.id }
            - call: "POST /api/billing-statements/${bc5}/settle"
              as: FinanceController
              captures: { bc5_status: $.data.status, bc5_final: $.data.final_total_usd }
          trigger:
            - call: "POST /api/billing-statements/${bc5}/settle"
              as: FinanceController
              captures: { bc5_err: $.data.error_id }
          assert:
            - "captured bc5_status == SETTLED and bc5_final == 10000.00 (100 h * 100.0000)"
            - "captured bc5_err == ERR_INVALID_STATE (second settle from terminal SETTLED)"
      - name: visit_complete_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShopVisit]
        distinguishing_aspect: "COMPLETED is terminal for visits: a second completion is rejected and the engine is not double-restored."
        test_recipe:
          setup: ["visit fully driven to COMPLETED with an APPROVED workscope (restores 8000); engine llp started at 3000"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Umber Air", iata_code: "U1", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc6: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc6}", esn: "ESN-S301", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 3000 }
              as: PlatformAdmin
              captures: { ec6: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-C601", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { ac6: $.data.id }
            - call: "POST /api/agreements/${ac6}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${ac6}/enroll"
              payload: { engine_id: "${ec6}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${ec6}/shop-visits"
              payload: { planned_induction_date: "2026-09-01T00:00:00Z" }
              as: Operator
              as_user_id: "${opc6}"
              captures: { vc6: $.data.id }
            - call: "POST /api/shop-visits/${vc6}/induct"
              as: ShopPlanner
              captures: { vc6_ver: $.data.version }
            - call: "POST /api/shop-visits/${vc6}/workscopes"
              payload:
                expected_shop_visit_version: "${vc6_ver}"
                items:
                  - { item_code: "LLP-1", item_type: "LLP_REPLACEMENT", estimated_cost_usd: 400000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { wc6: $.data.id }
            - call: "POST /api/workscopes/${wc6}/approve"
              as: Operator
              as_user_id: "${opc6}"
            - call: "POST /api/shop-visits/${vc6}/complete"
              as: ShopPlanner
              captures: { vc6_status: $.data.status }
            - call: "GET /api/engines/${ec6}"
              as: ShopPlanner
              captures: { ec6_status: $.data.status, ec6_llp: $.data.llp_remaining_cycles }
          trigger:
            - call: "POST /api/shop-visits/${vc6}/complete"
              as: ShopPlanner
              captures: { vc6_err: $.data.error_id }
          assert:
            - "captured vc6_status == COMPLETED; ec6_status == IN_SERVICE; ec6_llp == 8000 (restored from 3000 by the approved LLP item)"
            - "captured vc6_err == ERR_INVALID_STATE (second completion from terminal COMPLETED)"
      - name: workscope_create_blocked_while_latest_submitted
        claim_type: precondition_enforcement
        grounds: [state_machines.Workscope, "errors[ERR_ACTIVE_WORKSCOPE_EXISTS]"]
        distinguishing_aspect: "A new workscope version cannot be created while the latest version is still SUBMITTED (undecided); the version fork only opens after a decision."
        test_recipe:
          setup: ["visit INDUCTED with one SUBMITTED workscope"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Vale Air", iata_code: "V1", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc7: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc7}", esn: "ESN-S401", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { ec7: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-C701", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { ac7: $.data.id }
            - call: "POST /api/agreements/${ac7}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${ac7}/enroll"
              payload: { engine_id: "${ec7}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${ec7}/shop-visits"
              payload: { planned_induction_date: "2026-09-01T00:00:00Z" }
              as: Operator
              as_user_id: "${opc7}"
              captures: { vc7: $.data.id }
            - call: "POST /api/shop-visits/${vc7}/induct"
              as: ShopPlanner
              captures: { vc7_ver: $.data.version }
            - call: "POST /api/shop-visits/${vc7}/workscopes"
              payload:
                expected_shop_visit_version: "${vc7_ver}"
                items:
                  - { item_code: "MO-1", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 100000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
            - call: "GET /api/shop-visits/${vc7}"
              as: ShopPlanner
              captures: { vc7_ver2: $.data.version }
          trigger:
            - call: "POST /api/shop-visits/${vc7}/workscopes"
              payload:
                expected_shop_visit_version: "${vc7_ver2}"
                items:
                  - { item_code: "MO-2", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 110000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { wc7_err: $.data.error_id }
          assert:
            - "captured wc7_err == ERR_ACTIVE_WORKSCOPE_EXISTS (OCC version is current; only the undecided-version gate fails)"
      - name: verify_cascade_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.FlightHourReport.SUBMITTED_to_VERIFIED]
        excluded_because:
          difficulty_instance: verify_report_to_lease_cancel_chain
          rationale: "The verify cascade (cumulative update -> forecast recompute -> lease cancel) is asserted end-to-end by the named rule-4 instance."
  - section: calculations
    instances:
      - name: forecast_calendar_variant_when_cycles_far
        claim_type: variant_selection
        grounds: [calculations.shop_visit_forecast_calculation]
        distinguishing_aspect: "With 100000 llp cycles at 100 cyc/mo the cycle-based forecast is 30000 days out, so min() selects the CALENDAR_BASED variant: engine created 2026-09-01 + 72 months = 2032-09-01, method CALENDAR_BASED."
        test_recipe:
          setup: ["enrolled engine ESN-F101 with llp 100000, cpm 100; no COMPLETED visits (calendar base = engine.created_at)"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Falcon Air", iata_code: "F1", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc8: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc8}", esn: "ESN-F101", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 100000 }
              as: PlatformAdmin
              captures: { ec8: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-C801", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { ac8: $.data.id }
            - call: "POST /api/agreements/${ac8}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${ac8}/enroll"
              payload: { engine_id: "${ec8}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
          trigger:
            - call: "POST /api/engines/${ec8}/shop-visits"
              payload: { planned_induction_date: "2027-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${opc8}"
              captures: { vc8_fc: $.data.forecast_induction_date, vc8_m: $.data.forecast_method }
          assert:
            - "captured vc8_m == CALENDAR_BASED"
            - "captured vc8_fc has date part 2032-09-01 (engine created at the default clock 2026-09-01, plus 72 months)"
      - name: lease_deposit_applied_for_credit_b
        claim_type: constants_applied
        grounds: [calculations.lease_cost_calculation]
        distinguishing_aspect: "The 50000 deposit constant applies to a credit-B operator (only A is waived), and the cost is whole half-open days times the daily rate."
        test_recipe:
          setup: ["operator credit B; enrolled engine ESN-F201; SCHEDULED visit; spare SP-F2 at 3000.00/day"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Fjord Air", iata_code: "F2", credit_rating: "B" }
              as: PlatformAdmin
              captures: { opc9: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${opc9}", esn: "ESN-F201", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { ec9: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-C901", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { ac9: $.data.id }
            - call: "POST /api/agreements/${ac9}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${ac9}/enroll"
              payload: { engine_id: "${ec9}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${ec9}/shop-visits"
              payload: { planned_induction_date: "2026-09-05T00:00:00Z" }
              as: Operator
              as_user_id: "${opc9}"
              captures: { vc9: $.data.id }
            - call: "POST /api/spare-engines"
              payload: { spare_serial: "SP-F2", engine_model: "CFM56-7B", daily_lease_rate_usd: 3000 }
              as: PlatformAdmin
              captures: { sc9: $.data.id }
          trigger:
            - call: "POST /api/spare-engine-leases"
              payload: { spare_engine_id: "${sc9}", shop_visit_id: "${vc9}", start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-07T00:00:00Z" }
              as: Operator
              as_user_id: "${opc9}"
              captures: { lc9_cost: $.data.lease_cost_usd, lc9_dep: $.data.deposit_usd }
          assert:
            - "captured lc9_cost == 6000.00 (2 days * 3000.00)"
            - "captured lc9_dep == 50000.00 (LEASE_DEPOSIT_USD applies; credit B is not waived)"
      - name: agreement_billed_to_date_reconciles_across_settle
        claim_type: reconciliation
