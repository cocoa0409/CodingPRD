        grounds:
          - state_machines.Abstract.EMBARGOED_to_BREACHED
          - state_machines.Author.NONE_to_WARNED
          - entities.Author.fields.embargo_breach_count
          - endpoints.POST./abstracts/{abstractId}/press-actions
        distinguishing_aspect: |
          A RELEASE posted before embargo_until_utc is a legal transition with a
          punitive landing: embargo_status BREACHED (not RELEASED),
          press_outlet_name recorded, and CASCADE-E raises the author's
