              payload: { description: "Van", scheduled_value_cents: 200000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_o}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_o}"
              captures: { claim_id: $.data.id }
            - call: "POST /trustee/claims/${claim_id}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_id}/objections"
              payload: { grounds: "AMOUNT_DISPUTED", proposed_allowed_amount_cents: 50000, proposed_priority_class: "GENERAL_UNSECURED" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { obj_1: $.data.id }
          trigger:
            - call: "POST /trustee/claims/${claim_id}/objections"
              payload: { grounds: "DUPLICATE", proposed_allowed_amount_cents: 0, proposed_priority_class: "GENERAL_UNSECURED" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { second_err: $.data.error_id }
            - call: "POST /trustee/objections/${obj_1}/sustain"
              payload: {}
              as: Court
            - call: "POST /trustee/claims/${claim_id}/objections"
              payload: { grounds: "DUPLICATE", proposed_allowed_amount_cents: 0, proposed_priority_class: "GENERAL_UNSECURED" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { third_err: $.data.error_id }
          assert:
            - "second_err == ERR_OBJECTION_ALREADY_PENDING   # slot occupied"
            - "third_err == ERR_INVALID_STATE   # after sustain the claim is DISALLOWED (terminal), not UNDER_REVIEW — exclusion released but claim state now blocks"

  # =====================================================================
  # Rule 9 — compensating_invariant: two invariants over DIFFERENT
  # conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: judgment_rescind_preserves_estate_cash_identity
        grounds:
          - calculations.estate_cash_reconciliation
          - state_machines.AvoidanceAction.JUDGMENT_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity = estate cash ledger identity: cash == POSTED
          receipts - POSTED disbursements. Forward action (enter_judgment)
          plus its compensating action (rescind) must leave
          estate_cash_on_hand_cents exactly equal to its pre-judgment value
          (0) — zero drift, not merely 'status reverted'.
        test_recipe:
          setup:
            - "Case in CLAIMS_ADMINISTRATION, estate cash 0; avoidance action DEMANDED at 250,000"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor P", creditor_ref: "CR-P-1", insider: true, contact_email: "p@x.com" }
