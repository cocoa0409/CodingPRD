  - section: state_machines
    instances:
      - name: new_screening_starts_pending_with_zero_info_requests
        claim_type: initial_state
        grounds:
          - state_machines.EligibilityScreening.initial_state
          - endpoints[POST /opo/death-referrals/{id}/screenings]
        distinguishing_aspect: "A screening opened on a RECEIVED referral starts in PENDING with info_request_count 0, risk_score null, risk_tier null and absolute_contraindication false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T08:00:00Z with one referral in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: OpoAdmin
