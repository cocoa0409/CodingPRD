  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_blocked_by_suspended_inspector
        grounds:
          - state_machines.InspectionOrder.schedule_status.REQUESTED_to_SCHEDULED
          - entities.Inspector.fields.status
          - validations[priority=65]
          - errors[ERR_INSPECTOR_UNAVAILABLE]
        distinguishing_aspect: |
          Entity pair InspectionOrder -> Inspector: the order's REQUESTED -> SCHEDULED transition is
          legal on its own but is refused while the referenced Inspector.status is SUSPENDED, and the
          identical request succeeds the moment that inspector is returned to ACTIVE.
        test_recipe:
          setup:
            - "District T-SUSP with one inspector whose commission has been set to SUSPENDED."
            - "One REQUESTED InspectionOrder in that district with a requested window of 2026-08-10T08:00:00Z to 2026-08-10T17:00:00Z."
            - "Owner standing is GOOD and no other order occupies the inspector."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Big Hole Cattle", mailing_state: "MT", contact_email: "bighole@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-SUSP", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_s: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "B-861", home_territory_id: "${terr_s}", certification_expires_on: "2027-12-31T00:00:00Z", max_daily_assignments: 3 }
              as: BoardAdmin
              captures: { insp_1: "$.data.id" }
            - call: "POST /brand-inspection/inspectors/${insp_1}/status"
              payload: { status: "SUSPENDED" }
              as: BoardAdmin
              captures: { insp_v_susp: "$.data.version", insp_state_susp: "$.data.status" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_s}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_v_susp}" }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
            - call: "POST /brand-inspection/inspectors/${insp_1}/status"
              payload: { status: "ACTIVE" }
              as: BoardAdmin
              captures: { insp_v_active: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_v_active}" }
              as: BoardAdmin
              captures: { sched_status: "$.data.schedule_status", sched_inspector: "$.data.inspector_id" }
          assert:
            - "${insp_state_susp} == SUSPENDED and ${insp_v_susp} == 2"
            - "the first trigger call responds HTTP 409 and ${err_id} == ERR_INSPECTOR_UNAVAILABLE"
            - "${insp_v_active} == 3"
            - "${sched_status} == SCHEDULED and ${sched_inspector} == ${insp_1}"
            - "Inspector.${insp_1}.version == 4"
            - "Inspector.${insp_1}.active_assignment_count == 1"

      - name: record_blocked_by_revoked_prior_registration
        grounds:
          - state_machines.BrandApplication.UNDER_EXAMINATION_to_RECORDED
          - state_machines.BrandRegistration.ACTIVE_to_REVOKED
          - validations[priority=74]
          - errors[ERR_PRIOR_REGISTRATION_NOT_RENEWABLE]
        distinguishing_aspect: |
          Entity pair BrandApplication -> BrandRegistration, a different pair from the order-inspector
          dependency: the renewal filing sits in a perfectly legal UNDER_EXAMINATION state but cannot
          be recorded because the record it renews was revoked by a sustained conflict claim, so the
          response is 422 ERR_PRIOR_REGISTRATION_NOT_RENEWABLE and no registration is created.
        test_recipe:
          setup:
            - "Owner A holds recorded brand 'ROCK-A' RIGHT_RIB CATTLE MT."
            - "Owner A filed a RENEWAL on that record and a recorder has taken it up, so the filing is UNDER_EXAMINATION."
            - "Owner B's conflict claim against that record has been sustained, so the record's status is REVOKED."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Rocker A Cattle", mailing_state: "MT", contact_email: "rockera@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Yellowstone Stock", mailing_state: "MT", contact_email: "yellow@example.test" }
              as: BoardAdmin
              captures: { own_b: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "ROCK-A", position_code: "RIGHT_RIB", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id", reg_a_v: "$.data.version" }
