  # =================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: delineation_evaluation_gated_by_application_state
        grounds:
          - state_machines.PrivilegeDelineation.REQUESTED_to_CRITERIA_MET
          - state_machines.AppointmentApplication
          - errors[ERR_APPLICATION_NOT_IN_REVIEW]
        distinguishing_aspect: |
          Entity pair PrivilegeDelineation -> AppointmentApplication: evaluate is legal only
          while the parent application is in {SUBMITTED, PSV_IN_PROGRESS, PSV_COMPLETE};
          the same call against an application still in DRAFT fails with
          ERR_APPLICATION_NOT_IN_REVIEW even though the delineation itself is REQUESTED.
        test_recipe:
          setup:
            - "Member G1 with application APPG in DRAFT; delineation DG attached (REQUESTED)"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
