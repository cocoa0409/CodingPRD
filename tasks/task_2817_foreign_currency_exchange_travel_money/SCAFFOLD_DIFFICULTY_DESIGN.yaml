              captures: { pos_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Farid Haddad", nationality_code: "LB", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 2 }] }
              as: BranchTeller
              captures: { txn_id: "$.data.id" }
            - call: "POST /exchange-transactions/${txn_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
            - call: "POST /exchange-transactions/${txn_id}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
          trigger:
            - call: "POST /exchange-transactions/${txn_id}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == ERR_TRANSACTION_NOT_AUTHORIZED"
            - "${err} != ERR_INSUFFICIENT_INVENTORY even though the 10000 line now has 0 available notes"
            - "ExchangeTransaction.${txn_id}.settlement_status is still SETTLED and settled_usd_gross_cents is unchanged at 22763"
            - "InventoryPosition.${pos_id}.total_minor_units is still 0 (the rejected replay drew nothing)"

      - name: authorize_customer_id_expired_beats_export_limit_exceeded
        grounds:
          - validations (priority 8, business_safety, ERR_CUSTOMER_ID_EXPIRED)
          - validations (priority 11, business_constraint, ERR_EXPORT_LIMIT_EXCEEDED)
          - endpoints."POST /exchange-transactions/{id}/authorize"
          - entities.CurrencyProfile.fields.export_limit_minor_units
        distinguishing_aspect: |
          A different category pair, business_safety (8) vs business_constraint
          (11), on a different endpoint, POST
          /exchange-transactions/{id}/authorize. One request breaches both: the
          customer's passport expired on 2026-07-01 while the clock reads
          2026-08-01, and the 300000 MAD requested is above the 200000-minor-unit
          export limit. The identification error outranks the export error.
        test_recipe:
          setup:
            - "BR-LHR with a 20,000,000-cent vault limit and no positions, so posture stays OPEN at 0 bps."
            - "MAD profile: RESTRICTED, export_limit_minor_units 200000, denominations 2000/10000, wholesale mid 10000000 micros, PUBLISHED rate card with sell_spread_bps 400 (sell_rate_micros 9600000)."
            - "One customer carrying a PASSPORT that expired 2026-07-01 and a travel_document_reference, so the RESTRICTED-currency document rule is satisfied."
            - "A quote for 30 x 10000 MAD: 300000 minor units, gross 31250 cents, which is below ID_REQUIRED_CENTS so the ERR_CUSTOMER_ID_REQUIRED rule is not in play."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "MAD", display_name: "Moroccan Dirham", minor_unit_digits: 2, currency_class: "RESTRICTED", standard_denominations: [2000, 10000], export_limit_minor_units: 200000, buyback_eligible: false }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "MAD", mid_rate_micros: 10000000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "MAD", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 400, board_display_label: "MAD Dirham", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: "$.data.id" }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /customers"
              payload: { full_name: "Gita Rao", nationality_code: "IN", home_branch_id: "${br_id}", id_document_type: "PASSPORT", id_document_number: "IN-99120", id_document_expiry: "2026-07-01T00:00:00Z", travel_document_reference: "BP-77413" }
              as: BranchTeller
              captures: { cust_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "MAD", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 30 }] }
              as: BranchTeller
              captures: { txn_id: "$.data.id" }
          trigger:
            - call: "POST /exchange-transactions/${txn_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == ERR_CUSTOMER_ID_EXPIRED"
            - "${err} != ERR_EXPORT_LIMIT_EXCEEDED even though 300000 > 200000 MAD minor units"
            - "ExchangeTransaction.${txn_id}.settlement_status is still QUOTED and authorized_by_user_id == null"
            - "ExchangeTransaction.${txn_id}.quoted_usd_gross_cents == 31250"
            - "after PATCH-free repair - creating a second customer with an id_document_expiry of 2027-01-01 and re-quoting the same 30 x 10000 MAD - authorize returns ERR_EXPORT_LIMIT_EXCEEDED, proving the lower-priority rule is live"

      - name: schedule_route_window_conflict_beats_route_capacity_exceeded
        grounds:
          - validations (priority 10, business_temporal, ERR_ROUTE_WINDOW_CONFLICT)
          - validations (priority 13, business_fiscal, ERR_ROUTE_CAPACITY_EXCEEDED)
          - endpoints."POST /cash-shipments/{id}/schedule"
          - calculations.route_day_capacity_check
        distinguishing_aspect: |
          A third distinct category pair, business_temporal (10) vs
          business_fiscal (13), on a third endpoint, POST
          /cash-shipments/{id}/schedule. The requested 10:00-11:00 window both
          fails the 45-minute route gap against the incumbent 09:00-10:00 booking
          and would push the route's booked day total to 86956 cents against a
          80000-cent daily capacity, so the temporal error must win.
        test_recipe:
          setup:
            - "BR-CDG in region SOUTH with a 20,000,000-cent vault limit; EUR with a 920000-micro wholesale mid."
            - "Armored route RT-SOUTH-1 in region SOUTH with a deliberately small daily_capacity_usd_cents of 80000."
            - "Shipment A of 4 x 10000 EUR notes (43478 cents) already SCHEDULED on RT-SOUTH-1 for 2026-08-05T09:00Z-10:00Z."
            - "Shipment B of another 4 x 10000 EUR notes (43478 cents) still REQUESTED."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-CDG", name: "Paris CDG", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /armored-routes"
              payload: { code: "RT-SOUTH-1", carrier_name: "SecurCash", region_code: "SOUTH", daily_capacity_usd_cents: 80000 }
              as: PlatformAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 4 }] }
              as: TreasuryOfficer
              captures: { shipa_id: "$.data.id" }
            - call: "POST /cash-shipments/${shipa_id}/schedule"
              payload: { armored_route_id: "${route_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T10:00:00Z" }
              as: TreasuryOfficer
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 4 }] }
              as: TreasuryOfficer
              captures: { shipb_id: "$.data.id" }
          trigger:
            - call: "POST /cash-shipments/${shipb_id}/schedule"
              payload: { armored_route_id: "${route_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T11:00:00Z" }
              as: TreasuryOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${err} == ERR_ROUTE_WINDOW_CONFLICT"
            - "${err} != ERR_ROUTE_CAPACITY_EXCEEDED even though 43478 + 43478 == 86956 exceeds the 80000-cent daily capacity"
            - "CashShipment.${shipb_id}.status is still REQUESTED and armored_route_id == null and window_start == null"
            - "CashShipment.${shipa_id}.status is still SCHEDULED"

  - rule_id: boundary_precision_check
    instances:
      - name: threshold_report_fires_at_exactly_one_million_cents_and_not_one_step_below
        grounds:
          - calculations.transaction_usd_conversion
          - validations (compliance reporting, REPORT_THRESHOLD_CENTS)
          - entities.ComplianceReport.fields.aggregate_usd_cents
          - state_machines.ExchangeTransaction.AUTHORIZED_to_SETTLED
        distinguishing_aspect: |
          Boundary on the settled_usd_gross_cents metric at the
          REPORT_THRESHOLD_CENTS edge, probed on POST
          /exchange-transactions/{id}/settle: a CHF sell of 45 x 20000 plus
          5 x 500 converts to exactly 1000000 cents (997230 + 2770) and fires a
          THRESHOLD_REPORT because the rule is >=, while 45 x 20000 alone lands on
          997230 and fires nothing. The exact-hit case is only representable
          because the 500-note line contributes the missing 2770 cents.
        test_recipe:
          setup:
            - "BR-ZRH with a 20,000,000-cent vault limit."
            - "CHF profile (MAJOR, denominations 500/1000/5000/10000/20000, buyback_eligible false), wholesale mid 950000 micros effective 2026-07-01, PUBLISHED rate card with sell_spread_bps 500 so sell_rate_micros is 902500."
            - "A CHF position of 100 x 20000 plus 20 x 500 notes (2010000 minor units, 1058 bps, posture OPEN)."
            - "Two customers, each with a PASSPORT expiring 2027-01-01, so the identification rules pass at these amounts."
            - "Both deals are authorized by u-teller-1 and settled by u-mgr-1 to satisfy the DUAL_CONTROL_THRESHOLD_CENTS segregation rule."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-ZRH", name: "Zurich Bahnhofstrasse", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "CHF", display_name: "Swiss Franc", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 5000, 10000, 20000], buyback_eligible: false }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "CHF", mid_rate_micros: 950000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "CHF", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 500, board_display_label: "CHF Franc", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: "$.data.id" }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /inventory-positions"
              payload: { branch_id: "${br_id}", currency_code: "CHF", opening_denomination_mix: [{ denomination_minor_units: 500, note_count: 20 }, { denomination_minor_units: 20000, note_count: 100 }] }
              as: BranchManager
              captures: { pos_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Hana Sato", nationality_code: "JP", home_branch_id: "${br_id}", id_document_type: "PASSPORT", id_document_number: "JP-30012", id_document_expiry: "2027-01-01T00:00:00Z" }
              as: BranchTeller
              captures: { cust1_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Ivan Petrov", nationality_code: "BG", home_branch_id: "${br_id}", id_document_type: "PASSPORT", id_document_number: "BG-77120", id_document_expiry: "2027-01-01T00:00:00Z" }
              as: BranchTeller
              captures: { cust2_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust1_id}", rate_card_id: "${card_id}", currency_code: "CHF", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 20000, note_count: 45 }, { denomination_minor_units: 500, note_count: 5 }] }
              as: BranchTeller
              captures: { txn1_id: "$.data.id" }
            - call: "POST /exchange-transactions/${txn1_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust2_id}", rate_card_id: "${card_id}", currency_code: "CHF", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 20000, note_count: 45 }] }
              as: BranchTeller
              captures: { txn2_id: "$.data.id" }
            - call: "POST /exchange-transactions/${txn2_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
          trigger:
            - call: "POST /exchange-transactions/${txn1_id}/settle"
              payload: {}
              as: BranchManager
              as_user_id: "u-mgr-1"
            - call: "POST /exchange-transactions/${txn2_id}/settle"
              payload: {}
              as: BranchManager
              as_user_id: "u-mgr-1"
            - call: "GET /compliance-reports"
              payload: { customer_id: "${cust1_id}", report_type: "THRESHOLD_REPORT" }
              as: ComplianceOfficer
              captures: { rep_id: "$.data[0].id" }
          assert:
            - "ExchangeTransaction.${txn1_id}.fx_gross_minor_units == 902500 and settled_usd_gross_cents == 1000000 (997230 + 2770)"
            - "ExchangeTransaction.${txn2_id}.fx_gross_minor_units == 900000 and settled_usd_gross_cents == 997230"
            - "GET /compliance-reports?customer_id=${cust1_id}&report_type=THRESHOLD_REPORT returns total_count == 1"
            - "ComplianceReport.${rep_id}.aggregate_usd_cents == 1000000 and transaction_count == 1 and status == DRAFT and triggering_transaction_id == ${txn1_id}"
            - "GET /compliance-reports?customer_id=${cust2_id}&report_type=THRESHOLD_REPORT returns total_count == 0 because 997230 is 2770 cents short of the >= edge"
            - "Customer.${cust2_id}.near_threshold_txn_count == 1 (997230 clears NEAR_THRESHOLD_FLOOR_CENTS) while Customer.${cust1_id}.near_threshold_txn_count == 0 (a reported transaction is not a near-threshold one)"

      - name: submit_plan_with_zero_target_lines_rejected
        grounds:
          - validations (request shape, ERR_PLAN_NO_TARGET_LINES)
          - endpoints."POST /inventory-plans/{id}/submit"
          - entities.InventoryPlan.fields.target_lines
          - entities.InventoryPlan.fields.computed_targets
        distinguishing_aspect: |
          A different metric and a different endpoint from the threshold instance:
          the boundary here is the empty-collection edge of target_lines on POST
          /inventory-plans/{id}/submit, where a cardinality of 0 must be rejected
          rather than silently producing an empty computed_targets and a
          zero-valued plan.
        test_recipe:
          setup:
            - "BR-LHR with a 5,000,000-cent vault limit; EUR with a 920000-micro wholesale mid."
            - "One SUMMER corridor LHR-CMN 2026-06-01 to 2026-09-01 with demand_index_bps 13500."
            - "A DRAFT plan created with season_days 92 and target_lines omitted, so it defaults to the empty list."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 5000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /travel-corridors"
              payload: { code: "LHR-CMN-SUMMER", origin_country_code: "GB", destination_country_code: "MA", destination_currency_code: "EUR", season: "SUMMER", season_start_date: "2026-06-01", season_end_date: "2026-09-01", demand_index_bps: 13500 }
              as: TreasuryOfficer
              captures: { corr_id: "$.data.id" }
            - call: "POST /inventory-plans"
              payload: { branch_id: "${br_id}", travel_corridor_id: "${corr_id}", season_days: 92 }
              as: BranchManager
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /inventory-plans/${plan_id}/submit"
              payload: {}
              as: BranchManager
              as_user_id: "u-mgr-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err} == ERR_PLAN_NO_TARGET_LINES"
            - "InventoryPlan.${plan_id}.status is still DRAFT and submitted_by_user_id == null"
            - "InventoryPlan.${plan_id}.target_lines == [] and computed_targets == [] and total_target_usd_equivalent_cents == 0"
            - "re-submitting the same plan with exactly one EUR line of 2000 baseline daily minor units succeeds and yields computed_targets[0].target_minor_units == 250000, so cardinality 1 is the first accepted value"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: authorize_blocked_by_frozen_branch_posture
        grounds:
          - validations (priority 7, state, ERR_BRANCH_POSTURE_FROZEN)
          - calculations.branch_vault_utilization_and_posture
          - entities.Branch.fields.posture
          - state_machines.ExchangeTransaction.QUOTED_to_AUTHORIZED
        distinguishing_aspect: |
          Entity pair ExchangeTransaction -> Branch: whether a QUOTED transaction
          may advance depends on a field of the Branch that the transaction itself
          never writes. The transaction is perfectly well formed - inventory is
          ample, the card is effective, the customer is clean - and the only reason
          authorize fails is that the branch's derived posture sits at FROZEN
          because 300000 EUR minor units value at 326087 cents against a
          320000-cent vault limit, i.e. 10190 bps.
        test_recipe:
          setup:
            - "BR-LHR with a deliberately small vault_limit_usd_cents of 320000 and status ACTIVE."
            - "EUR profile with a 920000-micro wholesale mid and a PUBLISHED open-ended rate card (sell 878600)."
            - "An EUR position of 30 x 10000 notes, which alone drives the branch to 10190 bps and posture FROZEN (an auto_generated REPATRIATION shipment is raised as a side effect)."
            - "One customer and a small quote for a single 10000 note."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 320000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: "$.data.id" }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /inventory-positions"
              payload: { branch_id: "${br_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 10000, note_count: 30 }] }
              as: BranchManager
              captures: { pos_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Jonas Weber", nationality_code: "DE", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 1 }] }
              as: BranchTeller
              captures: { txn_id: "$.data.id" }
          trigger:
            - call: "POST /exchange-transactions/${txn_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "Branch.${br_id}.vault_usd_equivalent_cents == 326087 and vault_utilization_bps == 10190 and posture == FROZEN"
            - "HTTP 409 with ${err} == ERR_BRANCH_POSTURE_FROZEN"
            - "ExchangeTransaction.${txn_id}.settlement_status is still QUOTED"
            - "InventoryPosition.${pos_id}.total_minor_units is still 300000 (nothing was reserved)"
            - "the same quote authorizes successfully once the same branch is re-created with a 20,000,000-cent vault limit, so nothing about the transaction row is at fault"

      - name: plan_activation_blocked_by_corridor_season_window
        grounds:
          - validations (priority 10, business_temporal, ERR_PLAN_OUTSIDE_SEASON)
          - entities.TravelCorridor.fields.season_start_date
          - entities.TravelCorridor.fields.season_end_date
          - state_machines.InventoryPlan.APPROVED_to_ACTIVE
        distinguishing_aspect: |
          A different entity pair, InventoryPlan -> TravelCorridor, and a different
          kind of dependency: the blocking field is an immutable date range on the
          corridor rather than a derived posture on a branch, and the plan itself
          is fully APPROVED. The same activate call flips from 409 to 200 purely by
          moving the logical clock into the corridor's WINTER season, with no change
          to either row.
        test_recipe:
          setup:
            - "BR-LHR with a 5,000,000-cent vault limit; EUR with a 920000-micro wholesale mid."
            - "A WINTER corridor LHR-DXB running 2026-12-01 to 2027-03-01 with demand_index_bps 13500."
