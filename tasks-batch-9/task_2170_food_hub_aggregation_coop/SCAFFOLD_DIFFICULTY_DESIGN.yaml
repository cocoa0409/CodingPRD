scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: order_valuation_provisional_versus_final_at_invoice
    grounds:
    - calculations.order_pricing_rollup
    - calculations.hub_margin_tier_selection
    - entities.BuyerOrder.fields.invoiced_total_cents
    - entities.BuyerOrder.fields.margin_tier_bp
    - state_machines.BuyerOrder.UNBILLED_to_INVOICED
    distinguishing_aspect: 'This dual variant lives on BuyerOrder money: provisional_at_aggregation values the order from Allocation.quantity (60 units -> producer_subtotal 108000, tier 1500 bp, order_total
      124200) while final_at_invoice values the identical allocation row from Allocation.delivered_quantity (27 units -> producer_subtotal 48600, tier 1800 bp, order_total 57348); the basis-point tier itself
      flips because the delivered subtotal falls below TIER_1_UPPER_EXCLUSIVE_CENTS, so the final figure is not a proportional scaling of the provisional one.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Producer P1 ACTIVE, compliance_ok true, food_safety_tier TIER_BASIC.
      - Product PR1 LISTED at 1800 cents/CASE, quantity_offered 100, units_per_pallet 40, CHILL, window 2026-09-01..2026-12-01.
      - Buyer B1 with payment_terms_days 30 and credit_limit_cents 5000000.
      - 'Order O1 aggregated with a single Allocation A1 of 60 units: producer_subtotal_cents 108000, margin_tier_bp 1500, order_total_cents 124200.'
      - O1 scheduled on route R1, staged from dock slot DS1, dispatched, and delivery-recorded with delivered_quantity 27 on A1 (fulfillment_status DELIVERED, settlement_status UNBILLED).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
        payload:
          legal_name: Green Acres Farm
          region_code: NEV
          contact_email: ga@example.org
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          p1_id: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: GAP_AUDIT
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_gap: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: LIABILITY_INSURANCE
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_ins: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: HACCP_PLAN
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_hac: $.data.id
      - call: POST /producers/${p1_id}/application
        payload: {}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /producer-documents/${p1_gap}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_ins}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_hac}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producers/${p1_id}/review
        payload:
          decision: APPROVE
        as: ComplianceOfficer
        as_user_id: co-approve-9
      - call: POST /products
        payload:
          producer_id: ${p1_id}
          commodity_code: CARROT_LOOSE
          unit_of_measure: CASE
          storage_class: CHILL
          pack_weight_lb: 25
          units_per_pallet: 40
          producer_unit_price_cents: 1800
        as: Producer
        as_user_id: ${p1_id}
        captures:
          pr1_id: $.data.id
          pr1_v: $.data.version
      - call: POST /products/${pr1_id}/offers
        payload:
          quantity_offered: 100
          offer_window_start: '2026-09-01T00:00:00Z'
          offer_window_end: '2026-12-01T00:00:00Z'
          expected_product_version: ${pr1_v}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /buyers
        payload:
          legal_name: Metro School District
          buyer_type: SCHOOL_DISTRICT
          dock_zone_code: Z1
          payment_terms_days: 30
          credit_limit_cents: 5000000
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          b1_id: $.data.id
      - call: POST /buyer-orders
        payload:
          buyer_id: ${b1_id}
          requested_delivery_date: '2026-09-15T00:00:00Z'
        as: Buyer
        as_user_id: ${b1_id}
        captures:
          o1_id: $.data.id
      - call: POST /buyer-orders/${o1_id}/lines
        payload:
          commodity_code: CARROT_LOOSE
          storage_class: CHILL
          unit_of_measure: CASE
          quantity_requested: 60
          max_unit_price_cents: 2500
        as: Buyer
        as_user_id: ${b1_id}
        captures:
          l1_id: $.data.id
      - call: POST /buyer-orders/${o1_id}/aggregation
        payload: {}
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          prov_total: $.data.order_total_cents
          prov_bp: $.data.margin_tier_bp
      - call: GET /allocations
        payload:
          order_line_id: ${l1_id}
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          a1_id: $.data[0].id
      - call: POST /delivery-routes
        payload:
          route_date: '2026-09-15T00:00:00Z'
          vehicle_code: REEF-1
          storage_class: CHILL
          pallet_capacity: 20
          depot_departure_at: '2026-09-15T06:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          r1_id: $.data.id
          r1_v: $.data.version
      - call: POST /delivery-routes/${r1_id}/stops
        payload:
          order_id: ${o1_id}
          sequence_no: 1
          planned_arrival_at: '2026-09-15T10:00:00Z'
          service_minutes: 60
          expected_route_version: ${r1_v}
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /dock-slots
        payload:
          door_code: D1
          storage_class: CHILL
          window_start: '2026-09-14T06:00:00Z'
          window_end: '2026-09-14T18:00:00Z'
          pallet_capacity: 12
          temp_setpoint_c: 2.0
          sanitation_buffer_minutes: 45
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          ds1_id: $.data.id
          ds1_v: $.data.version
      - call: POST /dock-appointments
        payload:
          dock_slot_id: ${ds1_id}
          producer_id: ${p1_id}
          arrival_start: '2026-09-14T08:00:00Z'
          arrival_end: '2026-09-14T09:00:00Z'
          pallets: 2
          risk_class: PRODUCE
          expected_dock_slot_version: ${ds1_v}
        as: Producer
        as_user_id: ${p1_id}
        captures:
          ap1_id: $.data.id
      - call: POST /dock-appointments/${ap1_id}/receipt
        payload:
          outcome: RECEIVED
          received_pallets: 2
          recorded_temp_c: 1.5
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /delivery-routes/${r1_id}/dispatch
        payload: {}
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /buyer-orders/${o1_id}/delivery-record
        payload:
          line_receipts:
          - allocation_id: ${a1_id}
            delivered_quantity: 27
        as: HubAdmin
        as_user_id: hub-admin-1
      trigger:
      - call: POST /buyer-orders/${o1_id}/invoice
        payload: {}
        as: HubAdmin
        as_user_id: hub-admin-1
      assert:
      - the value captured at aggregation was ${prov_total} == 124200 and ${prov_bp} == 1500
      - BuyerOrder.${o1_id}.margin_tier_bp == 1800
      - BuyerOrder.${o1_id}.producer_subtotal_cents == 48600
      - BuyerOrder.${o1_id}.hub_margin_cents == 8748
      - BuyerOrder.${o1_id}.order_total_cents == 57348
      - BuyerOrder.${o1_id}.invoiced_total_cents == 57348
      - BuyerOrder.${o1_id}.invoice_due_date == 2026-10-01T00:00:00.000Z
      - BuyerOrder.${o1_id}.settlement_status == INVOICED
      - BuyerOrder.${o1_id}.fulfillment_status == DELIVERED
      - Allocation.${a1_id}.producer_amount_cents == 48600
      - Allocation.${a1_id}.hub_margin_cents == 8748
      - Allocation.${a1_id}.buyer_amount_cents == 57348
      - Buyer.${b1_id}.outstanding_balance_cents == 57348
  - name: patronage_basis_gross_volume_versus_net_ratification_snapshot
