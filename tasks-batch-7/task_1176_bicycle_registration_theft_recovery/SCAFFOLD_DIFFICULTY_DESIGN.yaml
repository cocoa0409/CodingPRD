  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_blocked_when_bicycle_stolen
        grounds:
          - state_machines.OwnershipTransfer.transitions
          - state_machines.Bicycle.registry_status
          - errors[ERR_BICYCLE_NOT_TRANSFERABLE]
        distinguishing_aspect: |
          Entity pair OwnershipTransfer -> Bicycle: transfer creation is valid only while the
          Bicycle's registry_status == REGISTERED; after the flag cascade flips the bicycle to
          STOLEN, creation fails ERR_BICYCLE_NOT_TRANSFERABLE. Sibling instance crosses the
          Bid -> Auction pair (different entity pair).
        test_recipe:
          setup:
            - "Owner o1 with Bicycle b1 (serial XDP100); Owner o2; TheftReport r1 on b1 FLAGGED (b1 now STOLEN)"
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o2@x.com", password: "pw", full_name: "O Two" }, as: Anonymous, captures: { o2_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "XDP100", manufacturer: "Trek", model: "FX", primary_color: "Black", declared_value_cents: 70000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/transfers", payload: { bicycle_id: "${b1_id}", to_owner_email: "o2@x.com", sale_price_cents: 40000 }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BICYCLE_NOT_TRANSFERABLE (observed ${err}) — transfer creation gated on Bicycle.registry_status"

      - name: bid_blocked_when_auction_not_open
        grounds:
          - state_machines.Bid.transitions
          - state_machines.Auction.SCHEDULED_to_OPEN
          - errors[ERR_AUCTION_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Bid -> Auction: bid placement requires Auction.status == OPEN; bidding
          against a SCHEDULED auction fails ERR_AUCTION_NOT_OPEN even inside the time window.
          Different entity pair from the transfer/bicycle instance.
        test_recipe:
          setup:
            - "ACTIVE PartnerOrg org; RecoveryIntake i1 created 2026-05-01 appraised 100000; UNCLAIMED 2026-06-01"
            - "Auction a1 created SCHEDULED (starts 2026-06-05, ends 2026-06-10); clock at 2026-06-05 (inside window) but open never called; Owner o1"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "XDP200", primary_color: "Blue", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id, a1_ver: $.data.version } }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 25000, expected_auction_version: "${a1_ver}" }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AUCTION_NOT_OPEN (observed ${err}) — bid placement gated on Auction.status, not just the time window"

  - rule_id: resource_temporal_overlap
    instances:
      - name: event_window_half_open_adjacency
        grounds:
          - state_machines.RegistryEvent.DRAFT_to_PUBLISHED
          - errors[ERR_EVENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [starts_at, ends_at) on the RegistryEvent resource per
          host org — a second event whose starts_at exactly equals the first event's ends_at is
          ADJACENT and publishes fine, while a one-hour-overlapping event fails
          ERR_EVENT_WINDOW_OVERLAP. Sibling instance uses buffer-inflated intervals on Auctions.
        test_recipe:
          setup:
            - "ACTIVE CAMPUS PartnerOrg org; event e1 PUBLISHED with window [2026-06-01T09:00, 2026-06-01T12:00)"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "State Univ", org_type: "CAMPUS", jurisdiction_code: "SU-1", contact_email: "su@x.edu" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/events", payload: { host_org_id: "${org_id}", title: "E1", venue: "Quad", starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-01T12:00:00Z", capacity: 10 }, as: Admin, captures: { e1_id: $.data.id } }
            - { call: "POST /registry/events/${e1_id}/publish", payload: {}, as: Admin }
          trigger:
            - { call: "POST /registry/events", payload: { host_org_id: "${org_id}", title: "E2", venue: "Quad", starts_at: "2026-06-01T12:00:00Z", ends_at: "2026-06-01T15:00:00Z", capacity: 10 }, as: Admin, captures: { e2_id: $.data.id } }
            - { call: "POST /registry/events/${e2_id}/publish", payload: {}, as: Admin, captures: { e2_status: $.data.status } }
            - { call: "POST /registry/events", payload: { host_org_id: "${org_id}", title: "E3", venue: "Hall", starts_at: "2026-06-01T11:00:00Z", ends_at: "2026-06-01T14:00:00Z", capacity: 10 }, as: Admin, captures: { e3_id: $.data.id } }
            - { call: "POST /registry/events/${e3_id}/publish", payload: {}, as: Admin, captures: { err: $.data.error_id } }
          assert:
            - "E2 publish succeeds: status == PUBLISHED (observed ${e2_status}) — starts_at == e1.ends_at is adjacent, half-open semantics permit it"
            - "E3 publish fails with ERR_EVENT_WINDOW_OVERLAP (observed ${err}) — [11:00,14:00) overlaps both e1 and e2"

      - name: auction_window_buffer_inflated_overlap
        grounds:
          - errors[ERR_AUCTION_WINDOW_CONFLICT]
          - state_machines.Auction.transitions
        distinguishing_aspect: |
          Interval semantics: buffer-INFLATED windows [starts_at - 12h, ends_at + 12h] on the
          partner org's auction schedule — a new auction starting exactly 24h after the previous
          one ends has touching inflated intervals (half-open, no conflict), while 23h conflicts.
          Different geometric treatment (inflation buffer) and different resource (Auction vs
          RegistryEvent) from the sibling instance.
        test_recipe:
          setup:
            - "ACTIVE LAW_ENFORCEMENT PartnerOrg org; intakes i1/i2/i3 created 2026-05-01, each marked UNCLAIMED at 2026-06-01"
            - "Auction a1 for i1: [2026-06-10T00:00, 2026-06-12T00:00]"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "BUF001", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 50000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "BUF002", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 50000 }, as: Partner, as_user_id: "${org_id}", captures: { i2_id: $.data.id } }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "BUF003", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 50000 }, as: Partner, as_user_id: "${org_id}", captures: { i3_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/recovery-intakes/${i2_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/recovery-intakes/${i3_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-12T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i2_id}", starts_at: "2026-06-13T00:00:00Z", ends_at: "2026-06-14T00:00:00Z" }, as: Registrar, captures: { a2_id: $.data.id, a2_status: $.data.status } }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i3_id}", starts_at: "2026-06-12T23:00:00Z", ends_at: "2026-06-13T01:00:00Z" }, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "a2 created (status SCHEDULED, observed ${a2_status}): starts exactly 24h after a1.ends_at -> inflated intervals [a1.s-12h, a1.e+12h] and [a2.s-12h, a2.e+12h] touch at 2026-06-13T00:00 but half-open semantics permit it"
            - "a3 rejected ERR_AUCTION_WINDOW_CONFLICT (observed ${err}): 23h gap after a1 ends inflates into overlap"

  - rule_id: compensating_invariant
    instances:
      - name: settle_then_void_double_entry_balance
        grounds:
          - calculations.ledger_double_entry_invariant
          - state_machines.Auction.CLOSED_to_SETTLED
          - state_machines.Auction.transitions
        distinguishing_aspect: |
          Conserved quantity: money — SUM(CREDIT amounts) - SUM(DEBIT amounts) over the whole
          LedgerEntry table == 0. Forward action (settle, posting a 60000-cent balanced set on
          top of a 2060-cent registration pair) and compensating action (void-settlement posting
          mirrored REVERSAL entries) both preserve the invariant; totals 62060 after settle and
          122060 after void. Sibling instance conserves event seats (different quantity type).
        test_recipe:
          setup:
            - "Owner o1 registered a bicycle with declared_value 150000 (registration fee pair 2060 cents each side)"
            - "ACTIVE PartnerOrg org; RecoveryIntake i1 created 2026-05-01 appraised 100000; UNCLAIMED 2026-06-01"
            - "Auction a1 reserve 20000, [2026-06-05, 2026-06-10], OPENed; o1 bid 30000; closed 2026-06-13 (storage 5700, commission 2430, payout 21870)"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "LED100", manufacturer: "Trek", model: "FX", primary_color: "Black", declared_value_cents: 150000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id, b1_fee: $.data.registration_fee_cents } }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "LED200", primary_color: "Blue", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { a1_ver: $.data.version } }
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 30000, expected_auction_version: "${a1_ver}" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/close", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/settle", payload: {}, as: Registrar, captures: { a_status: $.data.status } }
            - { call: "GET /registry/ledger-entries?limit=100", as: Registrar, captures: { post_settle_count: $.meta } }
            - { call: "POST /registry/auctions/${a1_id}/void-settlement", payload: {}, as: Registrar }
            - { call: "GET /registry/ledger-entries?limit=100&entry_type=REVERSAL", as: Registrar }
          assert:
            - "Registration fee == 2060 (observed ${b1_fee}); after settle: SUM(CREDIT) == SUM(DEBIT) == 62060 over all entries (2060 + 30000 + 5700 + 2430 + 21870 each side)"
            - "After void-settlement: SUM(CREDIT) == SUM(DEBIT) == 122060; exactly 8 REVERSAL entries exist with directions swapped vs the 8 settle entries"
            - "Invariant SUM(CREDIT) - SUM(DEBIT) == 0 holds before settle, after settle, and after the compensating void"
            - "Auction reached SETTLED (observed ${a_status}) then VOIDED"

      - name: event_register_then_cancel_seat_conservation
        grounds:
          - calculations.event_seat_invariant
          - state_machines.EventRegistration.transitions
          - entities.RegistryEvent.fields.registered_count
        distinguishing_aspect: |
          Conserved quantity: event seats — RegistryEvent.registered_count == COUNT(BOOKED
          registrations) and registered_count + available == capacity. Forward action (book:
          count 0->1) paired with its compensating action (cancel: count 1->0) leaves the seat
          account unchanged. Different conserved quantity from the ledger instance.
        test_recipe:
          setup:
            - "ACTIVE CAMPUS PartnerOrg org; event e1 PUBLISHED, capacity 2, window [2026-06-01T09:00, 2026-06-01T12:00); clock at 2026-05-15 (before event); Owner o1"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "State Univ", org_type: "CAMPUS", jurisdiction_code: "SU-1", contact_email: "su@x.edu" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/events", payload: { host_org_id: "${org_id}", title: "E1", venue: "Quad", starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-01T12:00:00Z", capacity: 2 }, as: Admin, captures: { e1_id: $.data.id } }
            - { call: "POST /registry/events/${e1_id}/publish", payload: {}, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/events/${e1_id}/registrations", payload: {}, as: Owner, as_user_id: "${o1_id}", captures: { er1_id: $.data.id, er1_status: $.data.status } }
            - { call: "GET /registry/events/${e1_id}", as: Registrar, captures: { cnt_after_book: $.data.registered_count } }
            - { call: "POST /registry/event-registrations/${er1_id}/cancel", payload: {}, as: Owner, as_user_id: "${o1_id}" }
            - { call: "GET /registry/events/${e1_id}", as: Registrar, captures: { cnt_after_cancel: $.data.registered_count, e_capacity: $.data.capacity } }
            - { call: "GET /registry/event-registrations?event_id=${e1_id}&status=BOOKED", as: Registrar, captures: { booked_total: $.data } }
          assert:
            - "After booking: registered_count == 1 (observed ${cnt_after_book}), registration status BOOKED (observed ${er1_status})"
            - "After compensating cancel: registered_count == 0 (observed ${cnt_after_cancel}) == COUNT(BOOKED registrations) == 0"
            - "capacity unchanged == 2 (observed ${e_capacity}); registered_count + available == capacity restored (0 + 2 == 2)"
