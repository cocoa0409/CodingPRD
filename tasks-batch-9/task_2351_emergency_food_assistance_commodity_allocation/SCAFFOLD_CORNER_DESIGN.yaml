      - name: cross_entity_training_dependency_is_covered_by_the_difficulty_index
        claim_type: cross-entity validation
        excluded_because:
          difficulty_instance: order_submit_depends_on_agency_training_axis
          rationale: "Cross-entity validation on this scaffold always reads 'the operation on X depends on the state of Agency', and §1.8 tests the strongest instance: an unchanged order becomes unsubmittable purely because a compliance sweep lapsed the agency's training axis (ERR_AGENCY_INELIGIBLE), then submittable again after retraining. A §1.9 variant would only swap the endpoint."

      - name: state_before_fiscal_priority_ordering_is_covered_by_the_difficulty_index
        claim_type: priority ordering
        excluded_because:
          difficulty_instance: resubmit_over_entitlement_order_returns_state_error_not_fiscal_error
          rationale: "The interesting priority conflicts are state (priority 8) beating fiscal (priority 32) and safety (15/16) beating referential (17/18); §1.8 pins both with fixtures that violate two rules in a single call and assert the higher-priority error id. Any §1.9 instance would re-create the same double violation."

  # ===========================================================================
  # Section 5 — Endpoints (§1.5). 73 endpoints; this pass covers the patterns
