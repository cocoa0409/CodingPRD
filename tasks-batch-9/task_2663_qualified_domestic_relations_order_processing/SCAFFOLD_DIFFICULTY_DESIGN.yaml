# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   task 2663 - Qualified Domestic Relations Order Processing
#   Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
#   All monetary literals below are pre-computed from those declarations.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: separate_interest_versus_shared_payment_projection_divergence
        grounds:
          - calculations.benefit_assignment_projection
          - calculations.gross_assigned_amount
          - calculations.earnings_growth_bps
          - entities.QdroCase.fields.approach
          - entities.AlternatePayeeAccount.fields.payment_mode
          - entities.AlternatePayeeAccount.fields.per_period_amount_cents
          - state_machines.SegregationHold.HELD_to_RELEASED
        distinguishing_aspect: |
          One and the same QdroCase, with one and the same assignable base of 1000000 cents and one
          and the same assigned_percentage_bps of 4000, produces two structurally different money
          shapes: the SEPARATE_INTEREST variant of calculations.benefit_assignment_projection reports
          separate_interest_balance_cents 412000 (400000 principal plus 12000 of interval earnings)
          with shared_payment_per_period_cents 0, while the SHARED_PAYMENT variant reports
          separate_interest_balance_cents 0 with shared_payment_per_period_cents 128000 and
          earnings_growth_bps 0. The divergence is not a different rounding of the same number — the
          two variants populate disjoint output fields and drive the SegregationHold to different
          terminal states (CONVERTED vs RELEASED).
        test_recipe:
          setup:
            - "A PUBLISHED plan permitting both approaches, earnings_adjustment_method PERIOD_END, max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000."
            - "A participant already in pay status (benefit_commenced true) whose plan account carries monthly_payment_cents 320000 and a single assignable PRE_TAX_DEFERRAL source of 1000000 cents with 0 basis, so assignable_base_cents == vested_balance_cents == 1000000."
            - "Two valuation snapshots on that account: 2026-06-30 at 1000000 cents and 2026-12-31 at 1030000 cents."
            - "A QDRO case with valuation_date 2026-06-30 carrying a received SHARED_PAYMENT draft order at 4000 bps with shared payment ending 2031-12-31, so the case's operative approach is SHARED_PAYMENT and a HELD hold of 400000 cents exists."
            - "The logical clock sits at 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Meridian 401(k) Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT", "FLAT_DOLLAR", "COVERTURE_FRACTION"], allowed_approaches: ["SEPARATE_INTEREST", "SHARED_PAYMENT"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Iris Vandermeer", ssn_last4: "2210", date_of_birth: "1962-05-09", participation_start_date: "2010-01-01", employment_status: "RETIRED", benefit_commenced: true }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 320000 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-12-31", balance_cents: 1030000, source: "RECORDKEEPER_FEED" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Rowan Vandermeer", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1964-11-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-A1", uses_model_language: true, proposed_approach: "SHARED_PAYMENT", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, proposed_shared_payment_end_date: "2031-12-31", provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /qdro-cases/${case_id}/benefit-projection"
              payload: { approach: "SEPARATE_INTEREST" }
              as: QdroAnalyst
              captures: { si_balance: $.data.separate_interest_balance_cents, si_growth: $.data.earnings_growth_bps }
            - call: "GET /qdro-cases/${case_id}/benefit-projection"
              payload: { approach: "SHARED_PAYMENT" }
              as: QdroAnalyst
              captures: { sp_per_period: $.data.shared_payment_per_period_cents, sp_growth: $.data.earnings_growth_bps }
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "The SEPARATE_INTEREST projection reports gross_assigned_amount_cents == 400000, earnings_growth_bps == 300, earnings_adjustment_cents == 12000, separate_interest_balance_cents == 412000 and shared_payment_per_period_cents == 0."
            - "The SHARED_PAYMENT projection reports gross_assigned_amount_cents == 400000, earnings_growth_bps == 0, earnings_adjustment_cents == 0, separate_interest_balance_cents == 0 and shared_payment_per_period_cents == 128000."
            - "${si_balance} == 412000 and ${sp_per_period} == 128000 and ${si_growth} == 300 and ${sp_growth} == 0 — identical case data, two disjoint money shapes."
            - "After qualification GET /qdro-cases/${case_id}/alternate-payee-accounts returns exactly 1 row with payment_mode == \"SHARED_PAYMENT\", balance_cents == 0, after_tax_basis_cents == 0, per_period_amount_cents == 128000, shared_payment_end_date == \"2031-12-31\", status == \"ESTABLISHED\"."
            - "GET /segregation-holds with qdro_case_id=${case_id} returns exactly 1 row with status == \"RELEASED\", earnings_growth_bps == 0, earnings_adjustment_cents == 0 and segregation_date == null — the SHARED_PAYMENT variant releases the hold instead of converting it."
            - "GET /qdro-cases/${case_id} reports review_status == \"QUALIFIED\" and segregation_status == \"RELEASED_TO_PARTICIPANT\"."
            - "GET /plan-accounts/${acct_id} reports vested_balance_cents == 1000000, held_amount_cents == 0 and available_balance_cents == 1000000 — no principal was carved out."

      - name: cash_versus_direct_rollover_settlement_divergence
        grounds:
          - calculations.distribution_settlement
          - calculations.ap_account_derived_totals
          - calculations.tax_report_net_position
          - entities.Distribution.fields.federal_withheld_cents
          - entities.Distribution.fields.admin_fee_cents
          - entities.Distribution.fields.distribution_code
          - validations[priority=65]
          - concurrency_rules[distribution-stale-ap-account]
        distinguishing_aspect: |
          The identical gross_amount_cents of 1050000 against the identical AlternatePayeeAccount
          (balance 1648001, after_tax_basis 24000) settles to net_amount_cents 1042500 under
          DIRECT_ROLLOVER and to 838058 under CASH. The divergence is not a single withholding line:
          because admin_fee_cents is tiered on net_before_fee_cents rather than on gross, the CASH
          election also lands in a cheaper fee tier (5000 vs 7500), and distribution_code flips from
          CODE_G to CODE_2. Same account, same gross, three fields differ in opposite directions.
        test_recipe:
          setup:
            - "A PUBLISHED plan with earnings_adjustment_method PERIOD_END, max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000, requires_model_language true."
            - "A participant not yet in pay status whose plan account carries four money sources: AFTER_TAX 100000 with 60000 basis, EMPLOYER_MATCH 1490125, PRE_TAX_DEFERRAL 2409875, all assignable, plus a non-assignable LOAN_RECEIVABLE 300000 — vested_balance_cents 4300000, assignable_base_cents 4000000, after_tax_basis_cents 60000."
            - "Valuation snapshots 2026-06-30 at 4000000 and 2026-12-31 at 4120000."
            - "A case qualified at clock 2026-09-15T00:00:00Z on a SEPARATE_INTEREST 4000 bps order, producing an AlternatePayeeAccount with balance_cents 1648001 and after_tax_basis_cents 24000, version 1."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Meridian 401(k) Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT", "FLAT_DOLLAR", "COVERTURE_FRACTION"], allowed_approaches: ["SEPARATE_INTEREST", "SHARED_PAYMENT"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1979-04-12", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "AFTER_TAX", balance_cents: 100000, basis_cents: 60000, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "EMPLOYER_MATCH", balance_cents: 1490125, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 2409875, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "LOAN_RECEIVABLE", balance_cents: 300000, basis_cents: 0, is_assignable: false }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 4000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-12-31", balance_cents: 4120000, source: "RECORDKEEPER_FEED" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Morgan Reyes", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1981-07-05", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-A2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "GET /qdro-cases/${case_id}/alternate-payee-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { ap_id: "$.data[0].id", ap_v1: "$.data[0].version" }
          trigger:
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v1}", election: "DIRECT_ROLLOVER", gross_amount_cents: 1050000, rollover_institution: "Fidelity IRA 8831" }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { roll_dist_id: $.data.id, roll_net: $.data.net_amount_cents, roll_fee: $.data.admin_fee_cents, roll_code: $.data.distribution_code }
            - call: "POST /distributions/${roll_dist_id}/void"
              payload: {}
              as: PlanAdministrator
            - call: "GET /alternate-payee-accounts/${ap_id}"
              payload: {}
              as: PlanAdministrator
              captures: { ap_v3: $.data.version, ap_bal_restored: $.data.balance_cents }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v3}", election: "CASH", gross_amount_cents: 1050000 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { cash_dist_id: $.data.id, cash_net: $.data.net_amount_cents, cash_fee: $.data.admin_fee_cents, cash_code: $.data.distribution_code }
          assert:
            - "The DIRECT_ROLLOVER row has basis_recovery_cents == 15291, taxable_amount_cents == 1034709, federal_withheld_cents == 0, net_before_fee_cents == 1050000, admin_fee_cents == 7500, net_amount_cents == 1042500, distribution_code == \"CODE_G\", tax_year == 2026."
            - "${ap_bal_restored} == 1648001 — the void restored the funding pool exactly, so the second election prices off identical data."
            - "The CASH row has basis_recovery_cents == 15291, taxable_amount_cents == 1034709, federal_withheld_cents == 206942, net_before_fee_cents == 843058, admin_fee_cents == 5000, net_amount_cents == 838058, distribution_code == \"CODE_2\", tax_year == 2026."
            - "${roll_net} == 1042500 and ${cash_net} == 838058; ${roll_fee} == 7500 and ${cash_fee} == 5000; ${roll_code} == \"CODE_G\" and ${cash_code} == \"CODE_2\"."
            - "The fee moved DOWN (7500 -> 5000) while the withholding moved UP (0 -> 206942), proving admin_fee_cents is keyed on net_before_fee_cents and not on gross_amount_cents."
            - "GET /alternate-payee-accounts/${ap_id} now reports balance_cents == 598001, after_tax_basis_cents == 8709, total_distributed_gross_cents == 1050000 and status == \"ESTABLISHED\"."
            - "GET /tax-reports with alternate_payee_account_id=${ap_id} returns exactly 3 rows: +1050000/+1034709/+0, -1050000/-1034709/-0, +1050000/+1034709/+206942, all with tax_year 2026."

      - name: period_end_versus_pro_rata_daily_earnings_divergence
        grounds:
          - calculations.earnings_growth_bps
          - calculations.earnings_adjustment
          - entities.Plan.fields.earnings_adjustment_method
          - entities.SegregationHold.fields.earnings_growth_bps
          - entities.SegregationHold.fields.segregation_date
        distinguishing_aspect: |
          Two plans that differ in exactly one field — earnings_adjustment_method — observe the same
          two valuation snapshots (4000000 on 2026-06-30, 4120000 on 2026-12-31) and the same
          segregation date 2026-09-15, yet PERIOD_END credits the whole 300 bps interval move
          (earnings_adjustment_cents 48000 on a 1600000 principal) while PRO_RATA_DAILY credits only
          the 77/184 elapsed fraction (126 bps, 20160 cents). The variant is selected from plan
          configuration, not from the request, so identical requests yield different segregated
          balances.
        test_recipe:
          setup:
            - "Plan P1 with earnings_adjustment_method PERIOD_END and plan P2 identical except earnings_adjustment_method PRO_RATA_DAILY; both PUBLISHED, max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000."
            - "Under each plan, a participant not in pay status with one assignable PRE_TAX_DEFERRAL source of 4000000 cents and 0 basis."
            - "Under each account, snapshots 2026-06-30 at 4000000 and 2026-12-31 at 4120000."
            - "Under each plan a case with valuation_date 2026-06-30 and a received SEPARATE_INTEREST 4000 bps draft order placed at clock 2026-09-01T00:00:00Z, so each hold is 1600000 cents."
            - "The clock is advanced to 2026-09-15T00:00:00Z before both qualifications, making elapsed_days 77 against a span of 184."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Northwind Savings Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan1_id: $.data.id }
            - call: "POST /plans/${plan1_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { plan_name: "Southwind Savings Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, earnings_adjustment_method: "PRO_RATA_DAILY", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan2_id: $.data.id }
            - call: "POST /plans/${plan2_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan1_id}", full_name: "Nadia Okonkwo", ssn_last4: "1101", date_of_birth: "1980-02-02", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part1_id: $.data.id }
            - call: "POST /participants/${part1_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct1_id: $.data.id }
            - call: "POST /plan-accounts/${acct1_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 4000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct1_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 4000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct1_id}/valuation-snapshots"
              payload: { as_of_date: "2026-12-31", balance_cents: 4120000, source: "RECORDKEEPER_FEED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan2_id}", full_name: "Nils Okonkwo", ssn_last4: "1102", date_of_birth: "1980-02-02", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part2_id: $.data.id }
            - call: "POST /participants/${part2_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct2_id: $.data.id }
            - call: "POST /plan-accounts/${acct2_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 4000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct2_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 4000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct2_id}/valuation-snapshots"
              payload: { as_of_date: "2026-12-31", balance_cents: 4120000, source: "RECORDKEEPER_FEED" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part1_id}", alternate_payee_name: "Ada Okonkwo", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1982-03-03", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case1_id: $.data.id, case1_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case1_id}", expected_case_version: "${case1_v}", document_reference: "DRO-2663-P1", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft1_id: $.data.id }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part2_id}", alternate_payee_name: "Bo Okonkwo", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1982-03-03", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case2_id: $.data.id, case2_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case2_id}", expected_case_version: "${case2_v}", document_reference: "DRO-2663-P2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /draft-orders/${draft1_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /draft-orders/${draft2_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case1_id}" }
              as: PlanAdministrator
              captures: { h1_growth: "$.data[0].earnings_growth_bps", h1_earn: "$.data[0].earnings_adjustment_cents" }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case2_id}" }
              as: PlanAdministrator
              captures: { h2_growth: "$.data[0].earnings_growth_bps", h2_earn: "$.data[0].earnings_adjustment_cents" }
          assert:
            - "${h1_growth} == 300 and ${h1_earn} == 48000 — PERIOD_END credits the entire valuation-to-valuation move."
            - "${h2_growth} == 126 and ${h2_earn} == 20160 — PRO_RATA_DAILY credits round_half_up(300 * 77 / 184) == 126 bps only."
            - "Both holds report hold_amount_cents == 1600000, valuation_date == \"2026-06-30\", segregation_date == \"2026-09-15\" and status == \"CONVERTED\"."
