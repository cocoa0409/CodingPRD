scenario: |
  Chemical Blending & Toll Manufacturing (toll blender): recipe & customer-owned
  raw material accounting, tank/vessel assignment & cleaning validation, batch
  yield & density conversion, SDS authoring & hazard classification, DOT packaging
  & placarding, waste/heel disposition, tolling fee vs formulated pricing,
  incompatible-storage segregation.

domain_name: chemical-blending-toll
api_prefix: /toll-operations

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal entity name" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true, new BatchJob intake is blocked for this customer" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: PricingAgreement
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: pricing_mode, type: enum, source: input, description: "TOLLING_FEE | FORMULATED_PRICE — picks the calculation variant on every BatchJob" }
      - { name: tolling_base_fee_cents, type: integer, source: input, description: "Flat per-BatchJob fee (TOLLING_FEE mode); >= 0" }
      - { name: tolling_per_kg_cents, type: integer, source: input, description: "Per-kg rate applied to theoretical_output_kg (TOLLING_FEE mode); >= 0" }
      - { name: formulated_price_per_kg_cents, type: integer, source: input, description: "Per-kg rate applied to actual_output_kg (FORMULATED_PRICE mode); >= 0" }
      - { name: over_yield_split_pct, type: integer, source: input, default: 50, description: "Customer share of over-yield credit in percent 0..100; blender retains the remainder. Only consulted when actual_output_kg > theoretical_output_kg" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 UTC; agreement not usable before this instant" }
      - { name: effective_to, type: datetime, source: input, description: "ISO8601 UTC; agreement not usable at or after this instant (half-open interval [from, to))" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> SUPERSEDED | TERMINATED" }

  - name: RawMaterialLot
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer (consignment ownership)" }
      - { name: material_code, type: string, source: input, description: "Customer-supplied material identifier (e.g. 'MEK-55')" }
      - { name: ghS_class, type: enum, source: input, description: "GHS hazard class of the raw material: FLAMMABLE | OXIDIZER | ACID | BASE | TOXIN | NON_HAZ" }
      - { name: quantity_kg_received, type: number, source: input, description: "Total mass received at dock, kg, >= 0" }
      - { name: quantity_kg_on_hand, type: number, source: computed, description: "= quantity_kg_received - sum(charged_qty_kg on SETTLED/CLOSED BatchCharge rows) - sum(heel_disposed_kg + heel_returned_kg on HeelDisposalRecord rows pointing at this lot)" }
      - { name: quantity_kg_committed, type: number, source: computed, description: "Sum of charged_qty_kg across this lot's BatchCharge rows whose parent BatchJob is in a non-terminal state and whose own status is COMMITTED" }
      - { name: quantity_kg_available, type: number, source: computed, description: "= quantity_kg_on_hand - quantity_kg_committed" }
      - { name: storage_zone, type: enum, source: input, description: "Zone the lot is physically shelved in: Z_FLAM | Z_OXID | Z_ACID | Z_BASE | Z_TOXIC | Z_GENERAL" }
      - { name: received_at, type: datetime, source: input, description: "ISO8601 UTC receipt timestamp" }

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Recipe display name" }
      - { name: revision, type: integer, source: input, description: "Monotonic revision counter scoped to (customer_id, name); must be >= 1" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; recipes are customer-proprietary" }
      - { name: target_density_kg_per_l, type: number, source: input, description: "Density at 20 degC used to convert between kg and L; > 0" }
      - { name: theoretical_yield_pct, type: number, source: input, description: "Expected mass yield fraction in percent, 0 < x <= 100" }
      - { name: components, type: array, source: input, description: "List of {material_code, mass_fraction_pct, charge_order}. Sum of mass_fraction_pct MUST equal exactly 100.000. charge_order is a positive integer; distinct per component" }
      - { name: highest_component_ghs, type: enum, source: computed, description: "Computed at Recipe create: GHS class of the highest-hazard component per hazard severity order FLAMMABLE > OXIDIZER > TOXIN > ACID > BASE > NON_HAZ" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> APPROVED -> RETIRED" }

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - { name: tank_code, type: string, source: input, description: "Unique human code (e.g. 'TK-201')" }
      - { name: capacity_l, type: integer, source: input, description: "Geometric capacity in litres, > 0" }
      - { name: working_capacity_l, type: integer, source: input, description: "Max usable batch size in litres; must satisfy 0 < working_capacity_l <= capacity_l" }
      - { name: current_zone, type: enum, source: input, description: "Physical storage zone the tank sits in: Z_FLAM | Z_OXID | Z_ACID | Z_BASE | Z_TOXIC | Z_GENERAL" }
      - { name: occupied_by_batch_id, type: string, source: computed, default: null, description: "FK -> BatchJob.id; non-null while a BatchJob holds this tank" }
      - { name: last_product_ghs, type: enum, source: computed, default: null, description: "GHS class of the most recently drained product; null when tank has never been used or has been fully cleaned and validated since last use" }
      - { name: cleaning_state, type: enum, source: system, default: DIRTY, description: "DIRTY -> CLEANING_IN_PROGRESS -> CLEAN_PENDING_VALIDATION -> CLEAN_VALIDATED; also DIRTY <- any state via contamination event" }
      - { name: operational_state, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | IN_USE | OUT_OF_SERVICE" }

  - name: CleaningRecord
    parent: Tank
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: system, description: "FK -> Tank.id" }
      - { name: method, type: enum, source: input, description: "SOLVENT_FLUSH | CAUSTIC_CIP | STEAM | DRY_PURGE" }
      - { name: started_at, type: datetime, source: input, description: "ISO8601 UTC" }
      - { name: completed_at, type: datetime, source: input, description: "ISO8601 UTC; must be > started_at" }
      - { name: residue_ppm, type: integer, source: input, description: "Measured residual contaminant in parts-per-million, >= 0" }
      - { name: validated_by, type: string, source: system, default: null, description: "X-User-ID of QAValidator who approved; null until validation decision" }
      - { name: validation_outcome, type: enum, source: system, default: PENDING, description: "PENDING -> PASSED | FAILED" }

  - name: BatchJob
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id" }
      - { name: pricing_agreement_id, type: string, source: input, description: "FK -> PricingAgreement.id; pinned at create, frozen thereafter" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; assigned vessel" }
      - { name: batch_size_l, type: integer, source: input, description: "Ordered batch size in litres, > 0" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC; must be > scheduled_start; half-open [start, end) for overlap" }
      - { name: theoretical_output_kg, type: number, source: computed, description: "= batch_size_l * target_density_kg_per_l * (theoretical_yield_pct / 100)" }
      - { name: actual_output_kg, type: number, source: input, default: null, description: "Measured drain mass; populated on /complete; >= 0" }
      - { name: density_corrected_output_l, type: number, source: computed, default: null, description: "= actual_output_kg / target_density_kg_per_l (recomputed at /complete)" }
      - { name: yield_variance_pct, type: number, source: computed, default: null, description: "= 100 * (actual_output_kg - theoretical_output_kg) / theoretical_output_kg; computed at /complete" }
      - { name: quoted_price_cents, type: integer, source: computed, default: null, description: "Provisional price snapshot at create, computed by price_batch_job (variant per PricingAgreement.pricing_mode)" }
      - { name: invoiced_price_cents, type: integer, source: computed, default: null, description: "Final price at /complete; also by price_batch_job (variant per PricingAgreement.pricing_mode)" }
      - { name: highest_component_ghs_snapshot, type: enum, source: computed, description: "Snapshot of Recipe.highest_component_ghs at create; never refreshed" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE -> RELEASED -> CHARGING -> MIXING -> HOLD_QA -> COMPLETED | CANCELLED | REJECTED_QA" }

  - name: BatchCharge
    parent: BatchJob
    common_fields: true
    fields:
      - { name: batch_job_id, type: string, source: system, description: "FK -> BatchJob.id" }
      - { name: raw_material_lot_id, type: string, source: input, description: "FK -> RawMaterialLot.id; lot being drawn" }
      - { name: charge_order, type: integer, source: input, description: "Integer matching one of the Recipe.components[].charge_order values" }
      - { name: charged_qty_kg, type: number, source: input, description: "Mass drawn from the lot; > 0" }
      - { name: status, type: enum, source: system, default: COMMITTED, description: "COMMITTED -> CONSUMED | RELEASED" }

  - name: SDSDocument
    parent: BatchJob
    common_fields: true
    fields:
      - { name: batch_job_id, type: string, source: system, description: "FK -> BatchJob.id; one SDS per BatchJob (1:1)" }
      - { name: authoring_revision, type: integer, source: computed, description: "Monotonic integer per batch_job_id starting at 1; bumps on each re-author" }
      - { name: ghs_classification, type: enum, source: input, description: "Author-declared final classification: FLAMMABLE | OXIDIZER | ACID | BASE | TOXIN | NON_HAZ" }
      - { name: signal_word, type: enum, source: input, description: "DANGER | WARNING | NONE" }
      - { name: hazard_statements, type: array, source: input, description: "List of H-codes e.g. ['H225','H314']; may be empty only when ghs_classification == NON_HAZ" }
      - { name: authoring_consistency_flag, type: boolean, source: computed, description: "true iff ghs_classification == BatchJob.highest_component_ghs_snapshot AND (signal_word == DANGER when ghs_classification in {FLAMMABLE, OXIDIZER, TOXIN} else signal_word in {WARNING, NONE}) AND (hazard_statements non-empty OR ghs_classification == NON_HAZ)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ISSUED -> SUPERSEDED" }

  - name: PackageConfig
    parent: BatchJob
    common_fields: true
    fields:
      - { name: batch_job_id, type: string, source: system, description: "FK -> BatchJob.id; 1:1 with BatchJob" }
      - { name: package_type, type: enum, source: input, description: "DRUM_205L | IBC_1000L | TOTE_500L | PAIL_20L" }
      - { name: un_rated, type: boolean, source: input, description: "True iff packaging carries a UN rating mark; mandatory when ghs_classification != NON_HAZ" }
      - { name: package_count, type: integer, source: input, description: "Number of packages, > 0" }
      - { name: total_volume_l, type: integer, source: computed, description: "= package_count * PACKAGE_CAPACITY_L[package_type]" }
      - { name: placard_required, type: boolean, source: computed, description: "true iff ghs_classification != NON_HAZ AND total_volume_l >= PLACARD_VOLUME_THRESHOLD_L" }
      - { name: placard_class, type: enum, source: computed, default: null, description: "DOT placard class when placard_required: CLASS_3_FLAMMABLE | CLASS_5_1_OXIDIZER | CLASS_8_CORROSIVE | CLASS_6_1_TOXIC; null when placard_required is false" }

  - name: Shipment
    parent: BatchJob
    common_fields: true
    fields:
      - { name: batch_job_id, type: string, source: system, description: "FK -> BatchJob.id; 1:1 with BatchJob" }
      - { name: carrier_name, type: string, source: input, description: "Carrier legal name" }
      - { name: vehicle_placards, type: array, source: input, description: "List of DOT placard classes actually mounted on the vehicle" }
      - { name: departure_at, type: datetime, source: input, description: "ISO8601 UTC scheduled departure" }
      - { name: shipped_volume_l, type: integer, source: computed, default: null, description: "= PackageConfig.total_volume_l at dispatch time" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED -> LOADING -> DISPATCHED | CANCELLED" }

  - name: HeelDisposalRecord
    parent: BatchJob
    common_fields: true
    fields:
      - { name: batch_job_id, type: string, source: system, description: "FK -> BatchJob.id" }
      - { name: raw_material_lot_id, type: string, source: input, description: "FK -> RawMaterialLot.id; lot whose residual is being dispositioned (must be a lot already charged into this batch)" }
      - { name: heel_returned_kg, type: number, source: input, description: "Mass returned to customer consignment; >= 0" }
      - { name: heel_disposed_kg, type: number, source: input, description: "Mass sent to waste; >= 0; at least one of heel_returned_kg / heel_disposed_kg must be > 0" }
      - { name: disposal_method, type: enum, source: input, default: null, description: "INCINERATION | FUEL_BLENDING | HAZARDOUS_LANDFILL; required iff heel_disposed_kg > 0" }
      - { name: waste_manifest_number, type: string, source: input, default: null, description: "RCRA manifest; required iff heel_disposed_kg > 0" }
      - { name: disposed_at, type: datetime, source: input, description: "ISO8601 UTC" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> POSTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /toll-operations/customers/{id}/suspend"
        actor: QualityManager
        preconditions:
          - "Customer.status == ACTIVE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Customer.updated_at refreshed; Customer.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /toll-operations/customers/{id}/reinstate"
        actor: QualityManager
        preconditions:
          - "Customer.status == SUSPENDED"
        side_effects:
          - "Customer.updated_at refreshed; Customer.version += 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /toll-operations/customers/{id}/terminate"
        actor: QualityManager
        preconditions:
          - "No BatchJob rows with customer_id == Customer.id in {INTAKE, RELEASED, CHARGING, MIXING, HOLD_QA} (ERR_OPEN_BATCH_JOBS otherwise)"
        side_effects:
          - "Customer.updated_at refreshed; Customer.version += 1"

  - entity: PricingAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /toll-operations/customers/{id}/pricing-agreements/{agreementId}/activate"
        actor: QualityManager
        preconditions:
          - "PricingAgreement.status == DRAFT"
          - "effective_from < effective_to (ERR_INVALID_REQUEST otherwise)"
          - "No other PricingAgreement for same customer_id with status == ACTIVE whose [effective_from, effective_to) overlaps this one (ERR_AGREEMENT_WINDOW_OVERLAP otherwise)"
        side_effects:
          - "PricingAgreement.version += 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade from a sibling PricingAgreement transitioning DRAFT -> ACTIVE with an overlapping window"
        actor: system
        preconditions:
          - "this agreement is ACTIVE"
          - "incoming agreement's window fully covers this agreement's window"
        side_effects:
          - "Existing ACTIVE agreement flips to SUPERSEDED; version += 1; updated_at refreshed"
          - "Already-created BatchJob rows keep their pinned pricing_agreement_id (no retroactive change)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /toll-operations/customers/{id}/pricing-agreements/{agreementId}/terminate"
        actor: QualityManager
        preconditions:
          - "PricingAgreement.status == ACTIVE"
        side_effects:
          - "PricingAgreement.version += 1"

  - entity: Recipe
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /toll-operations/recipes/{recipeId}/approve"
        actor: QualityManager
        preconditions:
          - "Recipe.status == DRAFT"
          - "sum of components[].mass_fraction_pct == 100.000 within 1e-6 (ERR_RECIPE_FRACTION_SUM_INVALID otherwise)"
          - "components[].charge_order values are distinct positive integers (ERR_RECIPE_CHARGE_ORDER_INVALID otherwise)"
        side_effects:
          - "Recipe.highest_component_ghs is frozen at approve time"
          - "Recipe.version += 1"
      - from: APPROVED
        to: RETIRED
        trigger: "POST /toll-operations/recipes/{recipeId}/retire"
        actor: QualityManager
        preconditions:
          - "Recipe.status == APPROVED"
          - "No BatchJob rows with recipe_id == Recipe.id in {INTAKE, RELEASED, CHARGING, MIXING, HOLD_QA} (ERR_RECIPE_IN_USE otherwise)"
        side_effects:
          - "Recipe.version += 1"

  - entity: Tank
    initial_state: "operational_state=AVAILABLE, cleaning_state=DIRTY"
    terminal_states: []
    transitions:
      - from: "operational_state=AVAILABLE"
        to: "operational_state=RESERVED"
        trigger: "cascade from BatchJob INTAKE -> RELEASED with tank_id == Tank.id"
        actor: system
        preconditions:
          - "Tank.operational_state == AVAILABLE"
          - "Tank.cleaning_state == CLEAN_VALIDATED (ERR_TANK_NOT_CLEAN_VALIDATED otherwise)"
          - "Tank.compatible-with batch GHS per segregation matrix (ERR_INCOMPATIBLE_SEGREGATION otherwise)"
          - "batch_size_l <= Tank.working_capacity_l (ERR_BATCH_SIZE_EXCEEDS_CAPACITY otherwise)"
          - "No other non-terminal BatchJob whose [scheduled_start, scheduled_end) overlaps this batch's window AND whose tank_id == Tank.id (ERR_TANK_SCHEDULE_OVERLAP otherwise)"
        side_effects:
          - "Tank.occupied_by_batch_id := BatchJob.id"
          - "Tank.version += 1"
      - from: "operational_state=RESERVED"
        to: "operational_state=IN_USE"
        trigger: "cascade from BatchJob RELEASED -> CHARGING"
        actor: system
        preconditions:
          - "Tank.occupied_by_batch_id == triggering BatchJob.id"
        side_effects:
          - "Tank.version += 1"
      - from: "operational_state=IN_USE"
        to: "operational_state=AVAILABLE"
        trigger: "cascade from BatchJob MIXING -> HOLD_QA -> COMPLETED or any state -> CANCELLED / REJECTED_QA"
        actor: system
        preconditions:
          - "Tank.occupied_by_batch_id == triggering BatchJob.id"
        side_effects:
          - "Tank.occupied_by_batch_id := null"
          - "Tank.last_product_ghs := BatchJob.highest_component_ghs_snapshot"
          - "Tank.cleaning_state := DIRTY"
          - "Tank.version += 1"
      - from: "cleaning_state=DIRTY"
        to: "cleaning_state=CLEANING_IN_PROGRESS"
        trigger: "POST /toll-operations/tanks/{id}/cleaning-records"
        actor: TankOperator
        preconditions:
          - "Tank.operational_state == AVAILABLE"
          - "Tank.cleaning_state == DIRTY (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "CleaningRecord created with validation_outcome=PENDING"
          - "Tank.cleaning_state := CLEANING_IN_PROGRESS; Tank.version += 1"
      - from: "cleaning_state=CLEANING_IN_PROGRESS"
        to: "cleaning_state=CLEAN_PENDING_VALIDATION"
        trigger: "POST /toll-operations/tanks/{id}/cleaning-records/{recordId}/submit"
        actor: TankOperator
        preconditions:
          - "CleaningRecord.validation_outcome == PENDING"
          - "Tank.cleaning_state == CLEANING_IN_PROGRESS"
        side_effects:
          - "Tank.cleaning_state := CLEAN_PENDING_VALIDATION; Tank.version += 1"
      - from: "cleaning_state=CLEAN_PENDING_VALIDATION"
        to: "cleaning_state=CLEAN_VALIDATED"
        trigger: "POST /toll-operations/tanks/{id}/cleaning-records/{recordId}/validate (decision=PASS)"
        actor: QAValidator
        preconditions:
          - "CleaningRecord.validation_outcome == PENDING"
          - "CleaningRecord.residue_ppm <= RESIDUE_LIMIT_PPM (50) when last_product_ghs != null; otherwise always passes"
          - "Segregation-of-duties: X-User-ID != CleaningRecord creator (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "CleaningRecord.validation_outcome := PASSED; validated_by := X-User-ID"
          - "Tank.cleaning_state := CLEAN_VALIDATED; Tank.last_product_ghs := null"
          - "Tank.version += 1"
      - from: "cleaning_state=CLEAN_PENDING_VALIDATION"
        to: "cleaning_state=DIRTY"
        trigger: "POST /toll-operations/tanks/{id}/cleaning-records/{recordId}/validate (decision=FAIL)"
        actor: QAValidator
        preconditions:
          - "CleaningRecord.validation_outcome == PENDING"
          - "Segregation-of-duties: X-User-ID != CleaningRecord creator"
        side_effects:
          - "CleaningRecord.validation_outcome := FAILED"
          - "Tank.cleaning_state := DIRTY; Tank.version += 1"

  - entity: BatchJob
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED, REJECTED_QA]
    transitions:
      - from: INTAKE
        to: RELEASED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/release"
        actor: BatchScheduler
        preconditions:
          - "BatchJob.status == INTAKE (ERR_INVALID_STATE otherwise)"
          - "Customer.status == ACTIVE AND Customer.credit_hold == false (ERR_CUSTOMER_CREDIT_HOLD otherwise)"
          - "PricingAgreement pinned at create has status == ACTIVE at release time (ERR_AGREEMENT_NOT_ACTIVE otherwise)"
          - "current_utc within PricingAgreement [effective_from, effective_to) (ERR_AGREEMENT_NOT_ACTIVE otherwise)"
          - "Tank.preconditions per Tank AVAILABLE -> RESERVED cascade (see Tank machine)"
          - "Expected BatchJob.version matches request's expected_batch_job_version (ERR_STALE_VERSION otherwise)"
        side_effects:
          - "Tank cascade AVAILABLE -> RESERVED (see Tank machine)"
          - "Tank.version += 1 (cascade)"
          - "BatchJob.version += 1"
      - from: RELEASED
        to: CHARGING
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/start-charging"
        actor: TankOperator
        preconditions:
          - "BatchJob.status == RELEASED"
          - "Every BatchCharge row required by Recipe.components has been POSTed (one per component, ERR_INCOMPLETE_CHARGES otherwise)"
        side_effects:
          - "Tank RESERVED -> IN_USE cascade"
          - "Each BatchCharge.status COMMITTED -> CONSUMED"
          - "Each consumed BatchCharge: RawMaterialLot.quantity_kg_on_hand -= charged_qty_kg; RawMaterialLot.quantity_kg_committed -= charged_qty_kg (lot version += 1)"
          - "BatchJob.version += 1"
      - from: CHARGING
        to: MIXING
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/start-mixing"
        actor: TankOperator
        preconditions:
          - "BatchJob.status == CHARGING"
          - "All BatchCharge rows have status == CONSUMED"
        side_effects:
          - "BatchJob.version += 1"
      - from: MIXING
        to: HOLD_QA
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/hold-for-qa"
        actor: TankOperator
        preconditions:
          - "BatchJob.status == MIXING"
        side_effects:
          - "BatchJob.version += 1"
      - from: HOLD_QA
        to: COMPLETED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/complete"
        actor: QAValidator
        preconditions:
          - "BatchJob.status == HOLD_QA"
          - "actual_output_kg provided in body, >= 0"
          - "SDSDocument for this batch_job_id exists with status == ISSUED (ERR_SDS_NOT_ISSUED otherwise)"
          - "PackageConfig for this batch_job_id exists; total_volume_l >= density_corrected_output_l rounded up to next integer (ERR_PACKAGE_VOLUME_INSUFFICIENT otherwise)"
          - "If PackageConfig.placard_required then PackageConfig.placard_class is non-null AND Shipment.vehicle_placards contains placard_class (ERR_PLACARD_MISSING otherwise)"
          - "If PackageConfig.un_rated == false AND ghs_classification != NON_HAZ (ERR_UN_RATED_PACKAGE_REQUIRED)"
          - "For every component lot: at least one HeelDisposalRecord row exists for (batch_job_id, raw_material_lot_id) with status == POSTED (ERR_HEEL_NOT_DISPOSITIONED otherwise)"
        side_effects:
          - "BatchJob.actual_output_kg := payload.actual_output_kg"
          - "BatchJob.density_corrected_output_l := actual_output_kg / Recipe.target_density_kg_per_l (precision 3 dp)"
          - "BatchJob.yield_variance_pct := 100 * (actual_output_kg - theoretical_output_kg) / theoretical_output_kg"
          - "BatchJob.invoiced_price_cents := price_batch_job(batch, variant=FINAL)"
          - "Tank IN_USE -> AVAILABLE cascade; Tank.last_product_ghs := BatchJob.highest_component_ghs_snapshot; Tank.cleaning_state := DIRTY"
          - "BatchJob.version += 1"
      - from: HOLD_QA
        to: REJECTED_QA
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/reject-qa"
        actor: QAValidator
        preconditions:
          - "BatchJob.status == HOLD_QA"
        side_effects:
          - "Tank IN_USE -> AVAILABLE cascade (last_product_ghs set, cleaning_state := DIRTY)"
          - "All COMMITTED BatchCharge rows for this batch flip to RELEASED and add charged_qty_kg back to RawMaterialLot.quantity_kg_on_hand (lot version += 1); CONSUMED rows are NOT auto-released (material already in tank)"
          - "BatchJob.version += 1"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/cancel"
        actor: BatchScheduler
        preconditions:
          - "BatchJob.status in {INTAKE, RELEASED}"
        side_effects:
          - "If status was RELEASED: Tank RESERVED -> AVAILABLE cascade (occupied_by_batch_id cleared; cleaning_state and last_product_ghs unchanged because no material was drawn)"
          - "All COMMITTED BatchCharge rows flip to RELEASED; lot quantities reconciled"
          - "BatchJob.version += 1"
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/cancel"
        actor: BatchScheduler
        preconditions:
          - "BatchJob.status in {INTAKE, RELEASED}"
        side_effects:
          - "Tank RESERVED -> AVAILABLE cascade"
          - "All COMMITTED BatchCharge rows flip to RELEASED; lot quantities reconciled"
          - "BatchJob.version += 1"

  - entity: BatchCharge
    initial_state: COMMITTED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: COMMITTED
        to: CONSUMED
        trigger: "cascade from BatchJob RELEASED -> CHARGING"
        actor: system
        preconditions: []
        side_effects:
          - "RawMaterialLot.quantity_kg_on_hand -= charged_qty_kg"
          - "RawMaterialLot.quantity_kg_committed -= charged_qty_kg"
          - "RawMaterialLot.version += 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "cascade from BatchJob -> CANCELLED or BatchJob -> REJECTED_QA"
        actor: system
        preconditions: []
        side_effects:
          - "RawMaterialLot.quantity_kg_committed -= charged_qty_kg (lot.version += 1)"

  - entity: CleaningRecord
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /toll-operations/tanks/{id}/cleaning-records/{recordId}/validate (decision=PASS)"
        actor: QAValidator
        preconditions:
          - "See Tank machine CLEAN_PENDING_VALIDATION -> CLEAN_VALIDATED"
        side_effects:
          - "CleaningRecord.validated_by := X-User-ID; version += 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /toll-operations/tanks/{id}/cleaning-records/{recordId}/validate (decision=FAIL)"
        actor: QAValidator
        preconditions:
          - "See Tank machine"
        side_effects:
          - "CleaningRecord.version += 1"

  - entity: SDSDocument
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/sds/issue"
        actor: SDSAuthor
        preconditions:
          - "SDSDocument.status == DRAFT"
          - "authoring_consistency_flag == true (ERR_SDS_INCONSISTENT otherwise)"
        side_effects:
          - "SDSDocument.version += 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "cascade from POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/sds (re-author)"
        actor: system
        preconditions: []
        side_effects:
          - "New SDSDocument row created in DRAFT with authoring_revision incremented by 1"
          - "Old SDSDocument.version += 1"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment/start-loading"
        actor: ShippingClerk
        preconditions:
          - "Shipment.status == PLANNED"
          - "BatchJob.status == COMPLETED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Shipment.version += 1"
      - from: LOADING
        to: DISPATCHED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment/dispatch"
        actor: ShippingClerk
        preconditions:
          - "Shipment.status == LOADING"
          - "PackageConfig.placard_required == false OR PackageConfig.placard_class in Shipment.vehicle_placards (ERR_PLACARD_MISSING otherwise)"
          - "If PackageConfig.placard_required == true AND PackageConfig.total_volume_l >= PLACARD_VOLUME_THRESHOLD_L then carrier_name is non-empty"
        side_effects:
          - "Shipment.shipped_volume_l := PackageConfig.total_volume_l"
          - "Shipment.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment/cancel"
        actor: ShippingClerk
        preconditions:
          - "Shipment.status in {PLANNED, LOADING}"
        side_effects:
          - "Shipment.version += 1"
      - from: LOADING
        to: CANCELLED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment/cancel"
        actor: ShippingClerk
        preconditions:
          - "Shipment.status in {PLANNED, LOADING}"
        side_effects:
          - "Shipment.version += 1"

  - entity: HeelDisposalRecord
    initial_state: PENDING
    terminal_states: [POSTED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/heel-disposals/{recordId}/post"
        actor: TankOperator
        preconditions:
          - "HeelDisposalRecord.status == PENDING"
          - "If heel_disposed_kg > 0 then disposal_method non-null AND waste_manifest_number non-empty (ERR_WASTE_MANIFEST_REQUIRED)"
          - "If heel_returned_kg > 0: lot.storage_zone compatible with the lot's ghS_class per segregation matrix (ERR_INCOMPATIBLE_SEGREGATION)"
        side_effects:
          - "If heel_returned_kg > 0: RawMaterialLot.quantity_kg_on_hand -= 0 (no change; returned stock stays on_hand) — but storage_zone validated"
          - "If heel_disposed_kg > 0: RawMaterialLot.quantity_kg_on_hand -= heel_disposed_kg (lot.version += 1)"
          - "HeelDisposalRecord.version += 1"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: batch-release-stale-batchjob
    parent_entity: BatchJob
    write_endpoint: "POST /toll-operations/customers/{id}/batch-jobs/{batchJobId}/release"
    occ_field: "expected_batch_job_version"
    description: |
      Releasing a BatchJob whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has
      just mutated the BatchJob (e.g., a cancellation, or a charge-post
      cascade that bumped version) between the client's read and the
      release request, so the client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pricing-agreement-activate-stale
    parent_entity: PricingAgreement
    write_endpoint: "POST /toll-operations/customers/{id}/pricing-agreements/{agreementId}/activate"
    occ_field: "expected_pricing_agreement_version"
    description: |
      Activating a PricingAgreement whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just terminated the agreement or modified the window.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: price_batch_job
    description: "Price a BatchJob. Variant selected by PricingAgreement.pricing_mode pinned at BatchJob create time."
    trigger: "At BatchJob create (produces quoted_price_cents using PROVISIONAL variant) and at BatchJob HOLD_QA -> COMPLETED (produces invoiced_price_cents using FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      let pa = PricingAgreement[batch.pricing_agreement_id]
      let theo_kg = batch.theoretical_output_kg      # always = batch_size_l * density * (yield_pct/100)
      if pa.pricing_mode == TOLLING_FEE:
          base = pa.tolling_base_fee_cents + pa.tolling_per_kg_cents * theo_kg
          if variant == PROVISIONAL:
              return round_half_up(base)
          # FINAL variant in TOLLING_FEE mode: same as PROVISIONAL (fee does not depend on actual)
          return round_half_up(base)
      elif pa.pricing_mode == FORMULATED_PRICE:
          # FINAL only; PROVISIONAL still uses theo_kg as best-estimate
          if variant == PROVISIONAL:
              ref_kg = theo_kg
          else:  # FINAL
              ref_kg = batch.actual_output_kg
          base = pa.formulated_price_per_kg_cents * ref_kg
          # Over-yield credit: customer absorbs over-yield, credited back per over_yield_split_pct
          if variant == FINAL and batch.actual_output_kg > theo_kg:
              over_kg = batch.actual_output_kg - theo_kg
              credit_cents = over_kg * pa.formulated_price_per_kg_cents * (pa.over_yield_split_pct / 100)
              base = base - credit_cents
          return round_half_up(base)
    input_set: "The pinned PricingAgreement, the BatchJob's theoretical_output_kg and (FINAL only) actual_output_kg"
    constants:
      ROUNDING: "round_half_up to integer cents"
    precision: "integer cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Called at BatchJob create; result persisted on BatchJob.quoted_price_cents"
        difference: "FORMULATED_PRICE mode uses theoretical_output_kg; TOLLING_FEE mode identical to FINAL"
      - name: FINAL
        when: "Called at /complete; result persisted on BatchJob.invoiced_price_cents"
        difference: "FORMULATED_PRICE mode uses actual_output_kg and applies over-yield credit when actual > theoretical"

  - name: theoretical_output_kg
    description: "Theoretical mass output for a batch."
    trigger: "At BatchJob create; frozen thereafter"
    algorithm: forward_looking
    formula: |
      theoretical_output_kg = batch_size_l * Recipe.target_density_kg_per_l * (Recipe.theoretical_yield_pct / 100)
    input_set: "BatchJob.batch_size_l, Recipe.target_density_kg_per_l, Recipe.theoretical_yield_pct"
    constants: {}
    precision: "3 decimal places kg, round_half_up"

  - name: density_corrected_output_l
    description: "Convert actual drained mass back to volume using recipe density."
    trigger: "At BatchJob HOLD_QA -> COMPLETED"
    algorithm: constraint_propagation
    formula: |
      density_corrected_output_l = actual_output_kg / Recipe.target_density_kg_per_l
    input_set: "BatchJob.actual_output_kg, Recipe.target_density_kg_per_l"
    constants: {}
    precision: "3 decimal places L, round_half_up"

  - name: highest_component_ghs
    description: "Pick the highest-severity GHS class across recipe components."
    trigger: "At Recipe approve"
    algorithm: aggregation
    formula: |
      severity(FLAMMABLE)=5; severity(OXIDIZER)=4; severity(TOXIN)=3; severity(ACID)=2; severity(BASE)=1; severity(NON_HAZ)=0
      highest_component_ghs = argmax over components of severity(component.ghs_class)
      Tie-break (multiple components with same max severity): pick the component with the smallest charge_order; if still tied (cannot happen — charge_order unique), fall back to created_at ASC.
    input_set: "Recipe.components joined with the customer's RawMaterialLot ghS_class for the matching material_code (any lot of that material_code from this customer; they MUST all share the same ghS_class for a given material_code)"
    constants:
      SEVERITY_ORDER: "FLAMMABLE > OXIDIZER > TOXIN > ACID > BASE > NON_HAZ"
    precision: "enum, deterministic"

  - name: placard_determination
    description: "Compute placard_required and placard_class on PackageConfig."
    trigger: "At PackageConfig create/update"
    algorithm: threshold
    formula: |
      PACKAGE_CAPACITY_L = { DRUM_205L: 205, IBC_1000L: 1000, TOTE_500L: 500, PAIL_20L: 20 }
      PLACARD_VOLUME_THRESHOLD_L = 454   # ~ 1 bulk-packaging threshold per DOT
      total_volume_l = package_count * PACKAGE_CAPACITY_L[package_type]
      # threshold crossing uses >= so 454 L exactly requires a placard
      placard_required = (ghs_classification != NON_HAZ) AND (total_volume_l >= PLACARD_VOLUME_THRESHOLD_L)
      if placard_required:
          placard_class = map ghs_classification -> {
              FLAMMABLE: CLASS_3_FLAMMABLE,
              OXIDIZER: CLASS_5_1_OXIDIZER,
              TOXIN: CLASS_6_1_TOXIC,
              ACID: CLASS_8_CORROSIVE,
              BASE: CLASS_8_CORROSIVE
          }
      else:
          placard_class = null
    input_set: "PackageConfig.package_type, package_count; SDSDocument.ghs_classification (latest non-SUPERSEDED)"
    constants:
      PLACARD_VOLUME_THRESHOLD_L: 454
    precision: "integer litres"

  - name: lot_available_kg
    description: "Compute the available mass on a RawMaterialLot."
    trigger: "Continuously derived; re-evaluated on any BatchCharge or HeelDisposalRecord mutation touching this lot"
    algorithm: aggregation
    formula: |
      lot.quantity_kg_committed = sum(charged_qty_kg for BatchCharge where lot_id == lot.id and status == COMMITTED)
      disposed_kg = sum(heel_disposed_kg for HeelDisposalRecord where lot_id == lot.id and status == POSTED)
      consumed_kg = sum(charged_qty_kg for BatchCharge where lot_id == lot.id and status == CONSUMED)
      lot.quantity_kg_on_hand = lot.quantity_kg_received - consumed_kg - disposed_kg
      lot.quantity_kg_available = lot.quantity_kg_on_hand - lot.quantity_kg_committed
    input_set: "All BatchCharge rows for lot; all POSTED HeelDisposalRecord rows for lot"
    constants: {}
    precision: "3 decimal places kg"

  - name: segregation_compatible
    description: "Two GHS classes are compatible for co-location in the same storage zone / same tank."
    trigger: "Consulted by Tank reservation, by heel-return, and by RawMaterialLot PUT"
    algorithm: constraint_propagation
    formula: |
      # Incompatibility matrix (symmetric). Pairs listed are FORBIDDEN to share zone or follow in same tank without validated cleaning.
      INCOMPATIBLE_PAIRS = {
          (FLAMMABLE, OXIDIZER),
          (ACID, BASE),
          (TOXIN, FLAMMABLE),
          (TOXIN, OXIDIZER),
      }
      # Zone -> allowed GHS classes:
      ZONE_ALLOWED = {
          Z_FLAM:    {FLAMMABLE},
          Z_OXID:    {OXIDIZER},
          Z_ACID:    {ACID},
          Z_BASE:    {BASE},
          Z_TOXIC:   {TOXIN},
          Z_GENERAL: {NON_HAZ},
      }
      segregation_compatible(new_ghs, prior_ghs_or_zone):
          if prior is a zone: return new_ghs in ZONE_ALLOWED[zone]
          if prior is a ghs class: return (new_ghs, prior) not in INCOMPATIBLE_PAIRS and (prior, new_ghs) not in INCOMPATIBLE_PAIRS
    input_set: "Lot/Tank zone; prior tank last_product_ghs"
    constants:
      RESIDUE_LIMIT_PPM: 50
    precision: "boolean"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resources exist (left-to-right: customer, then batch-job/agreement, then charge/sds/shipment/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Foreign-key references in request body exist (recipe_id, pricing_agreement_id, tank_id, raw_material_lot_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST/PUT/PATCH endpoints with FK fields"

  - priority: 5
    category: state
    check: "Target resource in a valid source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Customer not on credit_hold AND Customer.status == ACTIVE before batch release"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 403
    applies_to: "POST /customers/{id}/batch-jobs/{id}/release, POST /customers/{id}/batch-jobs (create)"

  - priority: 7
    category: business_safety
    check: "Tank.cleaning_state == CLEAN_VALIDATED before reservation"
    error_id: ERR_TANK_NOT_CLEAN_VALIDATED
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs/{id}/release"

  - priority: 8
    category: business_safety
    check: "Tank GHS compatibility: batch.highest_component_ghs_snapshot vs Tank.current_zone per ZONE_ALLOWED AND (if last_product_ghs non-null AND cleaning_state != CLEAN_VALIDATED) vs last_product_ghs per INCOMPATIBLE_PAIRS"
    error_id: ERR_INCOMPATIBLE_SEGREGATION
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs/{id}/release, POST /customers/{id}/batch-jobs/{id}/heel-disposals/{id}/post (when heel_returned_kg > 0), POST /customers/{id}/raw-material-lots (lot's ghS_class must be allowed by storage_zone)"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: cleaning validator X-User-ID != cleaning record creator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /tanks/{id}/cleaning-records/{id}/validate"

  - priority: 10
    category: business_temporal
    check: "PricingAgreement pinned is ACTIVE AND current_utc within [effective_from, effective_to) at release"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs/{id}/release"

  - priority: 11
    category: business_temporal
    check: "No other non-terminal BatchJob with overlapping [scheduled_start, scheduled_end) on the same tank"
    error_id: ERR_TANK_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs/{id}/release"

  - priority: 12
    category: business_temporal
    check: "PricingAgreement window does not overlap any other ACTIVE agreement for the same customer"
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /pricing-agreements/{id}/activate"

  - priority: 13
    category: business_constraint
    check: "Tank capacity: batch_size_l <= Tank.working_capacity_l"
    error_id: ERR_BATCH_SIZE_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /customers/{id}/batch-jobs/{id}/release"

  - priority: 14
    category: business_constraint
    check: "Each Recipe component has exactly one BatchCharge posted before start-charging; charged lot material_code matches the component's material_code; charged lot.customer_id == batch.customer_id"
    error_id: ERR_INCOMPLETE_CHARGES
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs/{id}/start-charging"

  - priority: 15
    category: business_constraint
    check: "charged_qty_kg <= RawMaterialLot.quantity_kg_available at POST /batch-charges time"
    error_id: ERR_INSUFFICIENT_LOT_QUANTITY
    http_status: 422
    applies_to: "POST /customers/{id}/batch-jobs/{id}/batch-charges"

  - priority: 16
    category: business_fiscal
    check: "Recipe status == APPROVED when referenced by POST /batch-jobs"
    error_id: ERR_RECIPE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs"

  - priority: 17
    category: business_fiscal
    check: "Recipe fraction sum equals 100.000 and charge_order values distinct positive integers"
    error_id: ERR_RECIPE_FRACTION_SUM_INVALID
    http_status: 422
    applies_to: "POST /recipes, POST /recipes/{id}/approve"

  - priority: 18
    category: business_constraint
    check: "SDS consistency rules for issue"
    error_id: ERR_SDS_INCONSISTENT
    http_status: 422
    applies_to: "POST /customers/{id}/batch-jobs/{id}/sds/issue"

  - priority: 19
    category: business_safety
    check: "SDS ISSUED for batch before complete"
    error_id: ERR_SDS_NOT_ISSUED
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs/{id}/complete"

  - priority: 20
    category: business_safety
    check: "UN-rated packaging required when ghs_classification != NON_HAZ"
    error_id: ERR_UN_RATED_PACKAGE_REQUIRED
    http_status: 422
    applies_to: "POST /customers/{id}/batch-jobs/{id}/package-config, POST /customers/{id}/batch-jobs/{id}/complete"

  - priority: 21
    category: business_safety
    check: "PackageConfig.total_volume_l >= ceil(density_corrected_output_l) at complete"
    error_id: ERR_PACKAGE_VOLUME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /customers/{id}/batch-jobs/{id}/complete"

  - priority: 22
    category: business_safety
    check: "Placard required => placard_class mounted on vehicle (shipment) at complete and at dispatch"
    error_id: ERR_PLACARD_MISSING
    http_status: 422
    applies_to: "POST /customers/{id}/batch-jobs/{id}/complete, POST /customers/{id}/batch-jobs/{id}/shipment/dispatch"

  - priority: 23
    category: business_safety
    check: "Waste manifest and disposal method present when heel_disposed_kg > 0"
    error_id: ERR_WASTE_MANIFEST_REQUIRED
    http_status: 422
    applies_to: "POST /customers/{id}/batch-jobs/{id}/heel-disposals/{id}/post"

  - priority: 24
    category: business_safety
    check: "Every component lot has at least one POSTED HeelDisposalRecord before complete"
    error_id: ERR_HEEL_NOT_DISPOSITIONED
    http_status: 409
    applies_to: "POST /customers/{id}/batch-jobs/{id}/complete"

  - priority: 25
    category: business_referential
    check: "Optimistic concurrency: expected_<parent>_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "OCC-guarded endpoints per §1.2.1"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default. Never falls back to wall-clock."
    roles: [QualityManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

  # --- Customers ---
  - method: POST
    path: "/toll-operations/customers"
    description: "Create a customer"
    roles: [QualityManager]
    code: 201
    input: [legal_name, "credit_hold?"]
    output: Customer
    side_effects: ["status initialized ACTIVE; version = 1"]

  - method: GET
    path: "/toll-operations/customers"
    description: "List customers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/customers/{id}"
    description: "Fetch one customer"
    roles: [Any]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/toll-operations/customers/{id}/suspend"
    description: "Suspend a customer"
    roles: [QualityManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> SUSPENDED; version += 1"]

  - method: POST
    path: "/toll-operations/customers/{id}/reinstate"
    description: "Reinstate a suspended customer"
    roles: [QualityManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> ACTIVE; version += 1"]

  - method: POST
    path: "/toll-operations/customers/{id}/terminate"
    description: "Terminate a suspended customer with no open batch jobs"
    roles: [QualityManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> TERMINATED; version += 1"]

  # --- Pricing agreements ---
  - method: POST
    path: "/toll-operations/customers/{id}/pricing-agreements"
    description: "Create a pricing agreement in DRAFT"
    roles: [QualityManager]
    code: 201
    input: [pricing_mode, tolling_base_fee_cents, tolling_per_kg_cents, formulated_price_per_kg_cents, "over_yield_split_pct?", effective_from, effective_to]
    output: PricingAgreement
    side_effects: ["status = DRAFT; version = 1"]

  - method: GET
    path: "/toll-operations/customers/{id}/pricing-agreements"
    description: "List a customer's pricing agreements"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PricingAgreement[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/customers/{id}/pricing-agreements/{agreementId}"
    description: "Fetch one pricing agreement"
    roles: [Any]
    code: 200
    input: []
    output: PricingAgreement
    side_effects: []

  - method: POST
    path: "/toll-operations/customers/{id}/pricing-agreements/{agreementId}/activate"
    description: "Activate a DRAFT pricing agreement (OCC on PricingAgreement.version). Cascades any overlapping ACTIVE agreement to SUPERSEDED."
    roles: [QualityManager]
    code: 200
    input: [expected_pricing_agreement_version]
    output: PricingAgreement
    side_effects:
      - "status -> ACTIVE; version += 1"
      - "for each other PricingAgreement pa where pa.customer_id == customer_id AND pa.status == ACTIVE AND pa.window overlaps this.window: pa.status := SUPERSEDED; pa.version += 1"

  - method: POST
    path: "/toll-operations/customers/{id}/pricing-agreements/{agreementId}/terminate"
    description: "Terminate an ACTIVE pricing agreement"
    roles: [QualityManager]
    code: 200
    input: []
    output: PricingAgreement
    side_effects: ["status -> TERMINATED; version += 1"]

  # --- Raw material lots ---
  - method: POST
    path: "/toll-operations/customers/{id}/raw-material-lots"
    description: "Receive a customer-owned raw material lot (consignment)"
    roles: [BatchScheduler]
    code: 201
    input: [material_code, ghS_class, quantity_kg_received, storage_zone, received_at]
    output: RawMaterialLot
    side_effects:
      - "quantity_kg_on_hand := quantity_kg_received"
      - "quantity_kg_committed := 0"
      - "Segregation validated: ghS_class must be in ZONE_ALLOWED[storage_zone] else ERR_INCOMPATIBLE_SEGREGATION"

  - method: GET
    path: "/toll-operations/customers/{id}/raw-material-lots"
    description: "List a customer's lots"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RawMaterialLot[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/customers/{id}/raw-material-lots/{lotId}"
    description: "Fetch one lot"
    roles: [Any]
    code: 200
    input: []
    output: RawMaterialLot
    side_effects: []

  # --- Recipes ---
  - method: POST
    path: "/toll-operations/recipes"
    description: "Create a recipe (DRAFT)"
    roles: [QualityManager]
    code: 201
    input: [name, revision, customer_id, target_density_kg_per_l, theoretical_yield_pct, components]
    output: Recipe
    side_effects: ["status = DRAFT; highest_component_ghs computed"]

  - method: GET
    path: "/toll-operations/recipes"
    description: "List recipes (filter by customer_id supported)"
    roles: [Any]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: "Recipe[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/recipes/{recipeId}"
    description: "Fetch one recipe"
    roles: [Any]
    code: 200
    input: []
    output: Recipe
    side_effects: []

  - method: POST
    path: "/toll-operations/recipes/{recipeId}/approve"
    description: "Approve a DRAFT recipe"
    roles: [QualityManager]
    code: 200
    input: []
    output: Recipe
    side_effects: ["status -> APPROVED; version += 1"]

  - method: POST
    path: "/toll-operations/recipes/{recipeId}/retire"
    description: "Retire an APPROVED recipe (no in-flight batches)"
    roles: [QualityManager]
    code: 200
    input: []
    output: Recipe
    side_effects: ["status -> RETIRED; version += 1"]

  # --- Tanks ---
  - method: POST
    path: "/toll-operations/tanks"
    description: "Register a tank"
    roles: [QualityManager]
    code: 201
    input: [tank_code, capacity_l, working_capacity_l, current_zone]
    output: Tank
    side_effects: ["operational_state = AVAILABLE; cleaning_state = DIRTY; last_product_ghs = null"]

  - method: GET
    path: "/toll-operations/tanks"
    description: "List tanks; filter by occupied_by_batch_id"
    roles: [Any]
    code: 200
    input: ["occupied_by_batch_id?", "limit?", "offset?"]
    output: "Tank[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/tanks/{id}"
    description: "Fetch one tank"
    roles: [Any]
    code: 200
    input: []
    output: Tank
    side_effects: []

  # --- Cleaning records ---
  - method: POST
    path: "/toll-operations/tanks/{id}/cleaning-records"
    description: "Open a cleaning record on a DIRTY, AVAILABLE tank"
    roles: [TankOperator]
    code: 201
    input: [method, started_at, completed_at, residue_ppm]
    output: CleaningRecord
    side_effects:
      - "Tank.cleaning_state DIRTY -> CLEANING_IN_PROGRESS"
      - "CleaningRecord.validation_outcome = PENDING; validated_by = null"

  - method: GET
    path: "/toll-operations/tanks/{id}/cleaning-records"
    description: "List a tank's cleaning records"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CleaningRecord[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/tanks/{id}/cleaning-records/{recordId}"
    description: "Fetch one cleaning record"
    roles: [Any]
    code: 200
    input: []
    output: CleaningRecord
    side_effects: []

  - method: POST
    path: "/toll-operations/tanks/{id}/cleaning-records/{recordId}/submit"
    description: "Submit a cleaning record (operator marks ready for QA)"
    roles: [TankOperator]
    code: 200
    input: []
    output: CleaningRecord
    side_effects: ["Tank.cleaning_state -> CLEAN_PENDING_VALIDATION"]

  - method: POST
    path: "/toll-operations/tanks/{id}/cleaning-records/{recordId}/validate"
    description: "QA validates a cleaning record"
    roles: [QAValidator]
    code: 200
    input: [decision]
    output: CleaningRecord
    side_effects:
      - "decision=PASS: CleaningRecord.validation_outcome=PASSED, validated_by=X-User-ID, Tank.cleaning_state=CLEAN_VALIDATED, Tank.last_product_ghs=null"
      - "decision=FAIL: CleaningRecord.validation_outcome=FAILED, Tank.cleaning_state=DIRTY"

  # --- Batch jobs ---
  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs"
    description: "Create a batch job (INTAKE). Pins pricing_agreement_id, snapshots recipe hazard class, computes quoted_price_cents (PROVISIONAL variant), computes theoretical_output_kg."
    roles: [BatchScheduler]
    code: 201
    input: [recipe_id, pricing_agreement_id, tank_id, batch_size_l, scheduled_start, scheduled_end]
    output: BatchJob
    side_effects:
      - "status = INTAKE; version = 1"
      - "theoretical_output_kg computed"
      - "quoted_price_cents computed via price_batch_job PROVISIONAL variant"
      - "highest_component_ghs_snapshot := Recipe.highest_component_ghs"

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs"
    description: "List a customer's batch jobs"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BatchJob[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}"
    description: "Fetch one batch job"
    roles: [Any]
    code: 200
    input: []
    output: BatchJob
    side_effects: []

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/release"
    description: "Release an INTAKE batch job (OCC on BatchJob.version). Drives Tank reservation cascade."
    roles: [BatchScheduler]
    code: 200
    input: [expected_batch_job_version]
    output: BatchJob
    side_effects:
      - "status INTAKE -> RELEASED; version += 1"
      - "Tank AVAILABLE -> RESERVED cascade; Tank.occupied_by_batch_id := BatchJob.id"

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/start-charging"
    description: "Move RELEASED -> CHARGING; cascades all COMMITTED BatchCharge rows to CONSUMED and decrements lot quantities"
    roles: [TankOperator]
    code: 200
    input: []
    output: BatchJob
    side_effects:
      - "Tank RESERVED -> IN_USE cascade"
      - "Every BatchCharge COMMITTED -> CONSUMED"
      - "Each lot: quantity_kg_on_hand -= charged_qty_kg; quantity_kg_committed -= charged_qty_kg"

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/start-mixing"
    description: "Move CHARGING -> MIXING"
    roles: [TankOperator]
    code: 200
    input: []
    output: BatchJob
    side_effects: ["status -> MIXING; version += 1"]

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/hold-for-qa"
    description: "Move MIXING -> HOLD_QA"
    roles: [TankOperator]
    code: 200
    input: []
    output: BatchJob
    side_effects: ["status -> HOLD_QA; version += 1"]

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/complete"
    description: "Move HOLD_QA -> COMPLETED; computes actual_output_kg-derived fields and invoiced_price_cents (FINAL variant)"
    roles: [QAValidator]
    code: 200
    input: [actual_output_kg]
    output: BatchJob
    side_effects:
      - "actual_output_kg, density_corrected_output_l, yield_variance_pct, invoiced_price_cents computed"
      - "Tank IN_USE -> AVAILABLE cascade; last_product_ghs set; cleaning_state := DIRTY"

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/reject-qa"
    description: "Move HOLD_QA -> REJECTED_QA; releases tank and reconciles COMMITTED charges"
    roles: [QAValidator]
    code: 200
    input: []
    output: BatchJob
    side_effects:
      - "Tank IN_USE -> AVAILABLE cascade"
      - "COMMITTED BatchCharge rows -> RELEASED"

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/cancel"
    description: "Cancel an INTAKE or RELEASED batch job"
    roles: [BatchScheduler]
    code: 200
    input: []
    output: BatchJob
    side_effects:
      - "If was RELEASED: Tank RESERVED -> AVAILABLE cascade"
      - "COMMITTED BatchCharge rows -> RELEASED"

  # --- Batch charges ---
  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/batch-charges"
    description: "Commit a raw material draw against a batch job"
    roles: [TankOperator]
    code: 201
    input: [raw_material_lot_id, charge_order, charged_qty_kg]
    output: BatchCharge
    side_effects:
      - "BatchCharge.status = COMMITTED"
      - "Lot.quantity_kg_committed += charged_qty_kg; lot.version += 1"
      - "BatchJob.version += 1"

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/batch-charges"
    description: "List a batch's charges"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BatchCharge[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/batch-charges/{chargeId}"
    description: "Fetch one charge"
    roles: [Any]
    code: 200
    input: []
    output: BatchCharge
    side_effects: []

  # --- SDS ---
  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/sds"
    description: "Author (or re-author) the SDS for a batch. If an ISSUED SDS already exists, it is SUPERSEDED and a new DRAFT is created with authoring_revision incremented."
    roles: [SDSAuthor]
    code: 201
    input: [ghs_classification, signal_word, hazard_statements]
    output: SDSDocument
    side_effects:
      - "If existing SDSDocument.status == ISSUED: old -> SUPERSEDED; new.authoring_revision := old.authoring_revision + 1"
      - "Else: authoring_revision := 1"
      - "authoring_consistency_flag computed"

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/sds"
    description: "List SDS documents for a batch (0..1 DRAFT or ISSUED, plus SUPERSEDED history)"
    roles: [Any]
    code: 200
    input: []
    output: "SDSDocument[]"
    side_effects: []

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/sds/{sdsId}/issue"
    description: "Issue a DRAFT SDS (requires authoring_consistency_flag == true)"
    roles: [SDSAuthor]
    code: 200
    input: []
    output: SDSDocument
    side_effects: ["status DRAFT -> ISSUED; version += 1"]

  # --- Package config ---
  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/package-config"
    description: "Create the 1:1 package configuration for a batch. Computes total_volume_l, placard_required, placard_class."
    roles: [ShippingClerk]
    code: 201
    input: [package_type, un_rated, package_count]
    output: PackageConfig
    side_effects:
      - "total_volume_l computed"
      - "placard_required, placard_class computed per placard_determination"

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/package-config"
    description: "Fetch a batch's package config (0..1)"
    roles: [Any]
    code: 200
    input: []
    output: "PackageConfig[]"
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment"
    description: "Create the 1:1 shipment for a batch"
    roles: [ShippingClerk]
    code: 201
    input: [carrier_name, vehicle_placards, departure_at]
    output: Shipment
    side_effects: ["status = PLANNED"]

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment"
    description: "Fetch a batch's shipment (0..1)"
    roles: [Any]
    code: 200
    input: []
    output: "Shipment[]"
    side_effects: []

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment/start-loading"
    description: "Move shipment PLANNED -> LOADING"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> LOADING; version += 1"]

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment/dispatch"
    description: "Move LOADING -> DISPATCHED; placard check enforced"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DISPATCHED; shipped_volume_l := PackageConfig.total_volume_l; version += 1"]

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/shipment/cancel"
    description: "Cancel a PLANNED or LOADING shipment"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> CANCELLED; version += 1"]

  # --- Heel disposals ---
  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/heel-disposals"
    description: "Record heel disposition for one charged lot"
    roles: [TankOperator]
    code: 201
    input: [raw_material_lot_id, heel_returned_kg, heel_disposed_kg, "disposal_method?", "waste_manifest_number?", disposed_at]
    output: HeelDisposalRecord
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/heel-disposals"
    description: "List heel disposal records for a batch"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "HeelDisposalRecord[]"
    side_effects: []

  - method: POST
    path: "/toll-operations/customers/{id}/batch-jobs/{batchJobId}/heel-disposals/{recordId}/post"
    description: "Post a heel disposal; validates manifest/method, applies lot adjustments"
    roles: [TankOperator]
    code: 200
    input: []
    output: HeelDisposalRecord
    side_effects:
      - "status PENDING -> POSTED"
      - "If heel_disposed_kg > 0: lot.quantity_kg_on_hand -= heel_disposed_kg; lot.version += 1"

  # --- Top-level collection GETs (FK reverse-reachability per §1.5) ---
  - method: GET
    path: "/toll-operations/batch-jobs/{batchJobId}"
    description: "Fetch a batch job by id (top-level, for FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: BatchJob
    side_effects: []

  - method: GET
    path: "/toll-operations/batch-charges/{chargeId}"
    description: "Fetch a batch charge by id"
    roles: [Any]
    code: 200
    input: []
    output: BatchCharge
    side_effects: []

  - method: GET
    path: "/toll-operations/batch-charges"
    description: "List batch charges; supports filtering by batch_job_id and raw_material_lot_id"
    roles: [Any]
    code: 200
    input: ["batch_job_id?", "raw_material_lot_id?", "limit?", "offset?"]
    output: "BatchCharge[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/sds-documents/{sdsId}"
    description: "Fetch an SDS document by id"
    roles: [Any]
    code: 200
    input: []
    output: SDSDocument
    side_effects: []

  - method: GET
    path: "/toll-operations/sds-documents"
    description: "List SDS documents; filter by batch_job_id"
    roles: [Any]
    code: 200
    input: ["batch_job_id?", "limit?", "offset?"]
    output: "SDSDocument[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/package-configs/{packageConfigId}"
    description: "Fetch a package config by id"
    roles: [Any]
    code: 200
    input: []
    output: PackageConfig
    side_effects: []

  - method: GET
    path: "/toll-operations/package-configs"
    description: "List package configs; filter by batch_job_id"
    roles: [Any]
    code: 200
    input: ["batch_job_id?", "limit?", "offset?"]
    output: "PackageConfig[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/shipments/{shipmentId}"
    description: "Fetch a shipment by id"
    roles: [Any]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/toll-operations/shipments"
    description: "List shipments; filter by batch_job_id"
    roles: [Any]
    code: 200
    input: ["batch_job_id?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/heel-disposals/{recordId}"
    description: "Fetch a heel disposal record by id"
    roles: [Any]
    code: 200
    input: []
    output: HeelDisposalRecord
    side_effects: []

  - method: GET
    path: "/toll-operations/heel-disposals"
    description: "List heel disposal records; filter by batch_job_id and raw_material_lot_id"
    roles: [Any]
    code: 200
    input: ["batch_job_id?", "raw_material_lot_id?", "limit?", "offset?"]
    output: "HeelDisposalRecord[]"
    side_effects: []

  - method: GET
    path: "/toll-operations/batch-jobs"
    description: "List batch jobs (top-level); filter by customer_id, recipe_id, pricing_agreement_id, tank_id"
    roles: [Any]
    code: 200
    input: ["customer_id?", "recipe_id?", "pricing_agreement_id?", "tank_id?", "status?", "limit?", "offset?"]
    output: "BatchJob[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource not found"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, type mismatch, or range violation (e.g. quantity_kg_received < 0, effective_from >= effective_to)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource in a state incompatible with the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the entity's current version"
  - id: ERR_CUSTOMER_CREDIT_HOLD
    http: 403
    condition: "Customer.credit_hold == true or Customer.status != ACTIVE"
  - id: ERR_TANK_NOT_CLEAN_VALIDATED
    http: 409
    condition: "Tank.cleaning_state != CLEAN_VALIDATED at batch release"
  - id: ERR_INCOMPATIBLE_SEGREGATION
    http: 409
    condition: "GHS class pairing or zone placement forbidden by the segregation matrix"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same user attempts to both create and validate a CleaningRecord"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "Pinned PricingAgreement not ACTIVE or current_utc outside [effective_from, effective_to) at release"
  - id: ERR_AGREEMENT_WINDOW_OVERLAP
    http: 409
    condition: "Another ACTIVE PricingAgreement for the same customer has an overlapping [from, to) window (and is not fully covered by the incoming window — full coverage supersedes instead)"
  - id: ERR_TANK_SCHEDULE_OVERLAP
    http: 409
    condition: "Another non-terminal BatchJob on the same tank has an overlapping [scheduled_start, scheduled_end) window"
  - id: ERR_BATCH_SIZE_EXCEEDS_CAPACITY
    http: 422
    condition: "batch_size_l > Tank.working_capacity_l"
  - id: ERR_INCOMPLETE_CHARGES
    http: 409
    condition: "Not every Recipe component has a BatchCharge posted"
  - id: ERR_INSUFFICIENT_LOT_QUANTITY
    http: 422
    condition: "charged_qty_kg > RawMaterialLot.quantity_kg_available"
  - id: ERR_RECIPE_NOT_APPROVED
    http: 409
    condition: "Recipe referenced by BatchJob create has status != APPROVED"
  - id: ERR_RECIPE_FRACTION_SUM_INVALID
    http: 422
    condition: "components[].mass_fraction_pct does not sum to 100.000 (within 1e-6), or charge_order values not distinct positive integers"
  - id: ERR_RECIPE_IN_USE
    http: 409
    condition: "Recipe has in-flight BatchJob rows; cannot retire"
  - id: ERR_OPEN_BATCH_JOBS
    http: 409
    condition: "Customer has in-flight BatchJob rows; cannot terminate"
  - id: ERR_SDS_NOT_ISSUED
    http: 409
    condition: "No ISSUED SDSDocument exists for this BatchJob at /complete"
  - id: ERR_SDS_INCONSISTENT
    http: 422
    condition: "authoring_consistency_flag is false at /issue (ghs mismatch, signal word mismatch, or hazard_statements empty for non-NON_HAZ)"
  - id: ERR_UN_RATED_PACKAGE_REQUIRED
    http: 422
    condition: "un_rated == false AND ghs_classification != NON_HAZ"
  - id: ERR_PACKAGE_VOLUME_INSUFFICIENT
    http: 422
    condition: "PackageConfig.total_volume_l < ceil(density_corrected_output_l)"
  - id: ERR_PLACARD_MISSING
    http: 422
    condition: "placard_required == true but placard_class not mounted on vehicle at dispatch (or not set on PackageConfig at complete)"
  - id: ERR_WASTE_MANIFEST_REQUIRED
    http: 422
    condition: "heel_disposed_kg > 0 but disposal_method null or waste_manifest_number empty"
  - id: ERR_HEEL_NOT_DISPOSITIONED
    http: 409
    condition: "Some component lot lacks a POSTED HeelDisposalRecord at /complete"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: QualityManager
    description: "Owns customers, pricing agreements, recipes, tanks, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /toll-operations/customers"
      - "POST /toll-operations/customers/{id}/suspend"
      - "POST /toll-operations/customers/{id}/reinstate"
      - "POST /toll-operations/customers/{id}/terminate"
      - "POST /toll-operations/customers/{id}/pricing-agreements"
      - "POST /toll-operations/customers/{id}/pricing-agreements/{id}/activate"
      - "POST /toll-operations/customers/{id}/pricing-agreements/{id}/terminate"
      - "POST /toll-operations/recipes"
      - "POST /toll-operations/recipes/{id}/approve"
      - "POST /toll-operations/recipes/{id}/retire"
      - "POST /toll-operations/tanks"
    shared_operations: []

  - name: BatchScheduler
    description: "Owns lot intake and batch job intake/release/cancel"
    identity: opaque
    exclusive_operations:
      - "POST /toll-operations/customers/{id}/raw-material-lots"
      - "POST /toll-operations/customers/{id}/batch-jobs"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/release"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/cancel"
    shared_operations: []

  - name: TankOperator
    description: "Operates tanks and executes charging/mixing/cleaning/heel-disposal"
    identity: opaque
    exclusive_operations:
      - "POST /toll-operations/tanks/{id}/cleaning-records"
      - "POST /toll-operations/tanks/{id}/cleaning-records/{id}/submit"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/batch-charges"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/start-charging"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/start-mixing"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/hold-for-qa"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/heel-disposals"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/heel-disposals/{id}/post"
    shared_operations: []

  - name: QAValidator
    description: "Validates cleaning records and completes/rejects batches (segregated from TankOperator)"
    identity: opaque
    exclusive_operations:
      - "POST /toll-operations/tanks/{id}/cleaning-records/{id}/validate"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/complete"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/reject-qa"
    shared_operations: []

  - name: SDSAuthor
    description: "Authors and issues SDS documents"
    identity: opaque
    exclusive_operations:
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/sds"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/sds/{id}/issue"
    shared_operations: []

  - name: ShippingClerk
    description: "Owns package configuration and shipment"
    identity: opaque
    exclusive_operations:
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/package-config"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/shipment"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/shipment/start-loading"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/shipment/dispatch"
      - "POST /toll-operations/customers/{id}/batch-jobs/{id}/shipment/cancel"
    shared_operations: []

  - name: Any
    description: "Read-only operations shared by all authenticated roles"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /toll-operations/customers"
      - "GET /toll-operations/customers/{id}"
      - "GET /toll-operations/customers/{id}/pricing-agreements"
      - "GET /toll-operations/customers/{id}/pricing-agreements/{id}"
      - "GET /toll-operations/customers/{id}/raw-material-lots"
      - "GET /toll-operations/customers/{id}/raw-material-lots/{id}"
      - "GET /toll-operations/recipes"
      - "GET /toll-operations/recipes/{id}"
      - "GET /toll-operations/tanks"
      - "GET /toll-operations/tanks/{id}"
      - "GET /toll-operations/tanks/{id}/cleaning-records"
      - "GET /toll-operations/tanks/{id}/cleaning-records/{id}"
      - "GET /toll-operations/customers/{id}/batch-jobs"
      - "GET /toll-operations/customers/{id}/batch-jobs/{id}"
      - "GET /toll-operations/customers/{id}/batch-jobs/{id}/batch-charges"
      - "GET /toll-operations/customers/{id}/batch-jobs/{id}/batch-charges/{id}"
      - "GET /toll-operations/customers/{id}/batch-jobs/{id}/sds"
      - "GET /toll-operations/customers/{id}/batch-jobs/{id}/package-config"
      - "GET /toll-operations/customers/{id}/batch-jobs/{id}/shipment"
      - "GET /toll-operations/customers/{id}/batch-jobs/{id}/heel-disposals"
