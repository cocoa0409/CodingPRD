              payload: { assignment_type: "VENDOR", vendor_id: "${ven_id}", scheduled_start_at: "2026-08-11T10:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VENDOR_INSURANCE_EXPIRED, HTTP 409"
            - "WorkOrder.${wo_id}.status remains TRIAGED"

      - name: resident_consent_not_confirmed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ENTRY_RULE_VIOLATION]"]
        distinguishing_aspect: "Starting a RESIDENT_CONSENT order without resident_consent_confirmed == true fails with ERR_ENTRY_RULE_VIOLATION."
        test_recipe:
          setup: ["work order ASSIGNED with entry_authorization RESIDENT_CONSENT"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Consent Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "405", full_name: "R Consent", email: "rconsent@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak" }
              as: Resident
