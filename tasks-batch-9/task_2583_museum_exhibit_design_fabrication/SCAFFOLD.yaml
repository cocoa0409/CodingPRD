  # ---- ArtifactCase -------------------------------------------------------
  - method: POST
    path: "/exhibit-projects/{id}/artifact-cases"
    description: "Design an artifact case in a zone, fixing its environmental set points, geometry and security tier. The case starts empty, in status DRAFT and mount_status NOT_STARTED."
    roles: [ProjectManager, Curator]
    code: 201
    input: [zone_id, case_code, objective_code, security_tier, target_rh_pct, rh_tolerance_pct, target_lux, uv_microwatt_per_lumen, interior_l_cm, interior_w_cm, interior_h_cm, air_exchanges_per_day]
    output: ArtifactCase
    side_effects:
      - "runs calculations.case_environmental_envelope on the empty case, so case_volume_m3 and silica_gel_kg are populated while required_rh_min_pct, required_rh_max_pct and allowed_lux are null and env_feasible / security_ok are true"
      - "sets status = DRAFT, mount_status = NOT_STARTED, placed_artifact_count = 0"
      - "does not touch GalleryZone slot counters - a slot is only reserved at approval"

  - method: GET
    path: "/exhibit-projects/{id}/artifact-cases"
    description: "List the project's cases, oldest first by created_at ASC."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["status?", "mount_status?", "zone_id?"]
    output: ArtifactCase[]
    side_effects: []

  - method: GET
    path: "/artifact-cases/{id}"
    description: "Read one case with both state dimensions and the full derived environmental envelope."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: ArtifactCase
    side_effects: []

  - method: POST
    path: "/artifact-cases/{id}/placements"
    description: "Reserve an artifact into this case. Security tier is checked before the environmental envelope. OCC-guarded per §1.2.1 rule placement-create-stale-case."
    roles: [Curator, Conservator]
    code: 201
    input: [expected_case_version, artifact_id]
    output: Artifact
    side_effects:
      - "sets Artifact.assigned_case_id = case.id and transitions placement_status UNPLACED -> RESERVED"
      - "increments ArtifactCase.placed_artifact_count"
      - "recomputes calculations.case_environmental_envelope over the new RESERVED / PLACED set, rewriting required_rh_min_pct, required_rh_max_pct, allowed_lux, env_feasible and security_ok"
      - "increments Artifact.version by 1 and increments ArtifactCase.version by 1"

  - method: GET
    path: "/artifact-cases/{id}/placements"
    description: "List the artifacts currently assigned to this case (any placement_status), oldest first by created_at ASC. Reverse-reachability channel for Artifact.assigned_case_id."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["placement_status?"]
    output: Artifact[]
    side_effects: []

  - method: DELETE
    path: "/artifact-cases/{id}/placements/{artifact_id}"
    description: "Withdraw an artifact from this case. A RESERVED artifact returns to UNPLACED; a PLACED artifact becomes DEINSTALLED and never returns to the pool."
    roles: [Curator, Conservator]
    code: 200
    input: []
    output: Artifact
    side_effects:
      - "transitions placement_status RESERVED -> UNPLACED and clears assigned_case_id, or PLACED -> DEINSTALLED keeping assigned_case_id for the record"
      - "decrements ArtifactCase.placed_artifact_count"
      - "recomputes calculations.case_environmental_envelope, which relaxes back to null bounds when the case empties"
      - "increments Artifact.version by 1 and increments ArtifactCase.version by 1"

  - method: POST
    path: "/artifact-cases/{id}/submit-for-conservation"
    description: "Send a loaded case to the conservators for environmental, security and mount review."
    roles: [ProjectManager, Curator]
    code: 200
    input: []
    output: ArtifactCase
    side_effects:
      - "recomputes calculations.case_environmental_envelope before the transition"
      - "transitions status DRAFT or REJECTED -> CONSERVATOR_REVIEW"
      - "increments ArtifactCase.version by 1"

  - method: POST
    path: "/artifact-cases/{id}/conservator-decision"
    description: "Conservator ruling on a case. APPROVE and APPROVE_WITH_CONDITIONS both reserve a zone case slot; REJECT frees every reserved artifact and freezes the project."
    roles: [Conservator]
    code: 200
    input: [decision, "conditions?"]
    output: ArtifactCase
    side_effects:
      - "APPROVE -> status APPROVED; APPROVE_WITH_CONDITIONS -> status CONDITIONALLY_APPROVED with conditions stored; REJECT -> status REJECTED"
      - "on APPROVE or APPROVE_WITH_CONDITIONS: increments GalleryZone.reserved_case_slots and decrements GalleryZone.available_case_slots by 1 each, preserving case_slot_capacity == reserved_case_slots + available_case_slots"
      - "on REJECT: every Artifact of this case with placement_status == RESERVED returns to UNPLACED with assigned_case_id cleared, placed_artifact_count is zeroed, and the envelope is recomputed to null bounds"
      - "sets decided_at to the logical clock instant"
      - "recomputes ExhibitProject.conditional_case_count, conservation_block_count and calculations.project_readiness_posture"
      - "increments ArtifactCase.version, GalleryZone.version (when a slot moved) and ExhibitProject.version by 1 each"

  - method: POST
    path: "/artifact-cases/{id}/mount-advance"
    description: "Advance the mount-making dimension of a case one step. Independent of the status dimension except that fabrication and installation require an approved case."
    roles: [Conservator]
    code: 200
    input: [to_mount_status]
    output: ArtifactCase
    side_effects:
      - "applies the §1.2 ArtifactCase mount_status transition for (current mount_status -> to_mount_status)"
      - "increments ArtifactCase.version by 1"

