  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: bid_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=22]
          - errors[ERR_AUCTION_NOT_LIVE]
          - errors[ERR_BID_TOO_LOW]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: a bid on a CLOSED auction that is also
          below min_next_bid violates both the state rule (pri 7, ERR_AUCTION_NOT_LIVE)
          and the fiscal rule (pri 22, ERR_BID_TOO_LOW); the state error wins.
        test_recipe:
          setup:
            - "An auction is opened then closed with no bids (branch B); a funded buyer exists."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
          trigger:
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 40000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409 with data.error_id == ERR_AUCTION_NOT_LIVE (state pri 7 beats fiscal pri 22)"

      - name: schedule_referential_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_UNIT_NOT_MATURED]
          - errors[ERR_INVALID_AUCTION_WINDOW]
        distinguishing_aspect: |
          Category pair {business_referential, business_temporal}: scheduling an auction
          for a RENTED (not matured) unit with an invalid window (end_at <= start_at)
          violates both the referential rule (pri 9, ERR_UNIT_NOT_MATURED) and the temporal
          rule (pri 12, ERR_INVALID_AUCTION_WINDOW); the referential error wins.
        test_recipe:
          setup:
            - "A unit exists in RENTED (no lien notice)."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
          trigger:
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-04-02T00:00:00Z", end_at: "2026-04-01T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409 with data.error_id == ERR_UNIT_NOT_MATURED (referential pri 9 beats temporal pri 12)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: first_bid_at_reserve_boundary
        grounds:
          - calculations.high_bid_selection
          - entities.Auction.fields.min_next_bid_cents
          - validations[priority=22]
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /auctions/{id}/bids: with no ACTIVE bids
          min_next_bid_cents == reserve (50000); a bid of exactly 50000 is accepted (>=,
          not >), whereas 49999 would be ERR_BID_TOO_LOW.
        test_recipe:
          setup:
            - "A LIVE auction (reserve 50000, no bids); a funded buyer."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
