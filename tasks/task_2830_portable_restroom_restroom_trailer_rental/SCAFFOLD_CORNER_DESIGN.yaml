            - "${m1_state} == SEALED and ${m1_gallons} == 380"
            - "${route_v_mid} == ${route_v_before} + 1 — the successful seal bumped Route.version"
            - "${e_stale_route} == ERR_STALE_ROUTE_VERSION with HTTP 412 — the token predates the first seal, although the facility, class, serviced visit and cap all still check out"
            - "${route_v_after_412} == ${route_v_mid} — the refused seal did not bump the version"
            - "${m2_state_mid} == OPEN, ${m2_gallons_mid} == 380 (still live, not frozen) and ${committed_mid} == 380"
            - "${m2_state} == SEALED and ${m2_gallons} == 380 — the retry with the current token succeeds"
            - "${committed_final} == 760 — both sealed manifests count, so the second seal really did commit"

