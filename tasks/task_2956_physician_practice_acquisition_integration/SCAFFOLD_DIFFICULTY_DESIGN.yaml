      - name: payer_denial_withdraws_packages_fails_credentialing_task_and_blocks_posture
        grounds:
          - state_machines.PayerContract.novation_status.NOTICE_SENT_to_DENIED
          - state_machines.CredentialingPackage.status.SUBMITTED_to_WITHDRAWN
          - state_machines.ReadinessTask.status.IN_PROGRESS_to_FAILED
          - calculations.acquisition_readiness_posture
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT transition than the
          performance-report cascade: the PayerContract NOTICE_SENT -> DENIED
          action fails the PAYER_CREDENTIALING ReadinessTask (link 1), and that
          task transition — not the DENY request — recomputes
          Acquisition.readiness_posture from AT_RISK to BLOCKED (link 2). The
          in-flight CredentialingPackage is withdrawn by the same action and frees
          its committee seat.
