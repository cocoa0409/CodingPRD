  # ==========================================================================
  - section: endpoints
    instances:
      - name: reconcile_checkpoint_sweeps_all_clock_gates
        claim_type: conditional_action
        grounds: [state_machines.SupportiveMeasure.ACTIVE_to_EXPIRED, state_machines.NoContactDirective.ACTIVE_to_EXPIRED, state_machines.EvidencePacket.RELEASED_FOR_REVIEW_to_REVIEW_CLOSED]
        distinguishing_aspect: "One ops-run endpoint applies every clock-gated transition for the case atomically and reports the swept ids: measure expiry (effective_to reached), directive expiry, and packet review close all land in one reconcile call at 2026-08-11T00:00:00Z."
        test_recipe:
          setup:
            - "case EVIDENCE_REVIEW: packet released 2026-08-01 (closes 2026-08-11T00:00:00Z); measure expiring 2026-08-05; directive expiring 2026-08-06"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
