            - "After void: TruckStockItem.${stock_id}.quantity_on_hand == 10 (restored to pre-usage value)"
            - "After void: TruckStockItem.${stock_id}.low_stock == false"   # 10 > reorder_threshold 2

      # ---- Voided usage excluded from invoice money total (conserved = billed material_subtotal)
      - name: invariant_void_excludes_line_from_invoice_money
        grounds:
          - calculations.invoice_total
          - calculations.truck_stock_balance
          - entities.Invoice.fields.material_subtotal_cents
          - entities.MaterialUsage.fields.voided
        distinguishing_aspect: |
          Conserved quantity = Invoice.material_subtotal_cents (a money total, different from the
          unit-count stock total in instance 1): a usage that is recorded then voided contributes
          ZERO to the invoice's material_subtotal_cents, so the billed material equals exactly the
          sum of the surviving non-voided lines (one 2000-cent line), not the gross of all lines.
        test_recipe:
          setup:
            - "MASTER tech zone '910' with truck-stock quantity_on_hand=10 for a SKU unit_price_cents=1000 taxable."
            - "An IN_PROGRESS OUTLET job (nonmember, STANDARD), tech on site."
