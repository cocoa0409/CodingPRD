- section: rbac
  instances:
  - name: rbac_customer_cannot_create_press_line_forbidden
    claim_type: rbac_denial
    grounds:
    - roles
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: Customer role (entity-backed) is denied POST /press-lines with 403 ERR_UNAUTHORIZED_ROLE.
    test_recipe:
      setup:
      - a customer exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: RB1
          contact_email: rb1@x.com
          credit_limit_cents: 1000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      trigger:
      - call: POST /press-lines
        payload:
          line_code: LX
          tonnage_class: STANDARD
          hours_per_day: 16
          daily_unit_capacity: 5000
        as: Customer
        as_user_id: ${cust}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED_ROLE (403); no line created
  - name: rbac_qa_role_cannot_decide_forbidden
    claim_type: rbac_denial
    grounds:
    - roles
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: 'Role check (priority 2) precedes existence (priority 3): QaInspector calling the decision endpoint gets 403 ERR_UNAUTHORIZED_ROLE
      even for a non-existent report id.'
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /qc-reports/00000000-0000-0000-0000-000000000000/decision
        payload:
          decision: ACCEPT
          fault: NONE
        as: QaInspector
        as_user_id: qa-9
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED_ROLE (403), NOT 404 — role check outranks existence
  - name: rbac_planner_cannot_invoice_forbidden
    claim_type: rbac_denial
    grounds:
    - roles
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: ProductionPlanner is denied POST /press-orders/{id}/invoices with 403.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /press-orders/00000000-0000-0000-0000-000000000000/invoices
        payload: {}
        as: ProductionPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED_ROLE (403)
  - name: rbac_customer_ownership_enforced_forbidden
    claim_type: rbac_denial
    grounds:
    - validations[priority=2]
    - roles
    distinguishing_aspect: Customer B (X-User-ID = customer B) confirming customer A's QUOTED order fails 403 ERR_UNAUTHORIZED_ROLE — entity-backed
      ownership check.
    test_recipe:
      setup:
      - customers A and B; A's order QUOTED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: RB4 A
          contact_email: a@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          custA: $.data.id
      - call: POST /customers
        payload:
          name: RB4 B
          contact_email: b@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          custB: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${custA}
          catalog_number: RB4-001
          title: T
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      trigger:
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${custB}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED_ROLE (403); order stays QUOTED
  - name: rbac_shared_reads_any_role
    claim_type: rbac_shared
    grounds:
    - roles
    distinguishing_aspect: 'All GET endpoints accept any authenticated role (Any): e.g., a QaInspector can read customers and orders.'
    test_recipe:
      setup:
      - one customer exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: RB5
          contact_email: rb5@x.com
          credit_limit_cents: 1000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      trigger:
      - call: GET /customers/${cust}
        as: Any
        captures:
          got: $.data.id
      - call: GET /customers
        as: Any
      assert:
      - GET /customers/{id} with a non-owning role returns 200 with the record
      - GET /customers returns 200 array
- section: cross_cutting_layers
  instances:
  - name: occ_requote_stale_version
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[order-requote-stale-version]
    distinguishing_aspect: 'Re-quote supersedes legitimately within QUOTED: first re-quote with the current version succeeds (version advances);
      a second re-quote carrying the now-stale captured version is rejected 412 ERR_STALE_VERSION.'
    test_recipe:
      setup:
      - order QUOTED at version 2
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: OC1
          contact_email: oc1@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: OC1-001
          title: T
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      trigger:
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v2}
        as: CustomerServiceRep
        captures:
          ord_v3: $.data.version
          st: $.data.production_status
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v2}
        as: CustomerServiceRep
        captures:
          err: $.data.error_id
      assert:
      - 'first re-quote: 200, production_status stays QUOTED, version == 3 (supersede bumped it)'
      - second re-quote with stale version 2 -> error_id == ERR_STALE_VERSION (412)
  - name: occ_release_date_revision_stale
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[release-date-revision-stale-version]
    - calculations.release_risk_eval
    distinguishing_aspect: 'Release version advances on the confirm cascade (SETUP -> IN_PRODUCTION), so the revision must use a freshly-read
      version: first revision succeeds (risk recomputed LATE + DATE_REVISION notice), a replay of the same version is 412.'
    test_recipe:
      setup:
      - release 2026-12-01 with an order approved into QUEUED; release version read fresh
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: OC2
          contact_email: oc2@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: OC2-001
          title: T
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /plating-baths
        payload:
          bath_code: B1
          rinse_gap_minutes: 2
        as: ProductionPlanner
        captures:
          bath: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 100
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 100
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${cust}
      - call: POST /press-orders/${ord}/start-tooling
        payload: {}
        as: ProductionPlanner
      - call: GET /press-orders/${ord}/tooling-jobs
        as: Any
        captures:
          tool: $.data[0].id
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_CUT
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: CUT_DONE
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_PLATING
          plating_bath_id: ${bath}
          plating_start: 2
          plating_end: 6
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: PLATING_DONE
        as: PressOperator
      - call: POST /press-orders/${ord}/test-pressings
        payload:
          quantity: 5
        as: PressOperator
        captures:
          tp: $.data.id
      - call: POST /test-pressings/${tp}/ship
        payload: {}
        as: ProductionPlanner
      - call: POST /test-pressings/${tp}/review
        payload:
          decision: APPROVE
        as: Customer
        as_user_id: ${cust}
      - call: GET /releases/${rel}
        as: Any
        captures:
          rel_v: $.data.version
      trigger:
      - call: POST /releases/${rel}/date-revisions
        payload:
          new_release_date: '2026-08-20'
          reason: moved up
          expected_release_version: ${rel_v}
        as: CustomerServiceRep
        captures:
          new_date: $.data.release_date
          risk: $.data.risk_level
      - call: POST /releases/${rel}/date-revisions
        payload:
          new_release_date: '2026-09-01'
          reason: stale replay
          expected_release_version: ${rel_v}
        as: CustomerServiceRep
        captures:
          err: $.data.error_id
      - call: GET /releases/${rel}/delay-notices
        as: Any
        captures:
          ncause: $.data[0].cause
      assert:
      - 'first revision: release_date == 2026-08-20; risk_level == LATE (QUEUED projection 2026-08-22 vs 2026-08-20, slack -2)'
      - DelayNotice appended with cause == DATE_REVISION
      - replay with the pre-revision version -> error_id == ERR_STALE_VERSION (412)
  - name: occ_credit_revision_stale
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[customer-credit-revision-stale-version]
    distinguishing_aspect: 'Credit-limit revisions are superseding writes: revision with the creation version succeeds (version 2); replaying
      the same version fails 412; a suspend in between also advances the version (revision against a pre-suspend read fails).'
    test_recipe:
      setup:
      - customer at version 1
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: OC3
          contact_email: oc3@x.com
          credit_limit_cents: 1000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
          cust_v: $.data.version
      trigger:
      - call: POST /customers/${cust}/credit-limit-revisions
        payload:
          new_credit_limit_cents: 2000000
          expected_customer_version: ${cust_v}
        as: CustomerServiceRep
        captures:
          v2: $.data.version
          lim: $.data.credit_limit_cents
      - call: POST /customers/${cust}/credit-limit-revisions
        payload:
          new_credit_limit_cents: 3000000
          expected_customer_version: ${cust_v}
        as: CustomerServiceRep
        captures:
          err: $.data.error_id
      - call: POST /customers/${cust}/credit-status
        payload:
          action: SUSPEND
        as: BillingClerk
      - call: POST /customers/${cust}/credit-limit-revisions
        payload:
          new_credit_limit_cents: 3000000
          expected_customer_version: ${v2}
        as: CustomerServiceRep
        captures:
          err2: $.data.error_id
      assert:
      - 'first revision OK: credit_limit_cents == 2000000, version == 2'
      - replay of version 1 -> error_id == ERR_STALE_VERSION (412)
      - after SUSPEND bumped the version to 3, a revision carrying version 2 -> error_id == ERR_STALE_VERSION (cascade bumps count)
  - name: layer_cascading_side_effects_covered
    claim_type: cascade_coverage
    grounds:
    - state_machines.PressOrder
    excluded_because:
      difficulty_instance: cancel_frees_slots_waitlist_promotion_cascade
      rationale: Cancel cascade (fee + slot free + promotion) asserted there; TP/repress cascades covered by their own instances.
  - name: layer_dual_variant_covered
    claim_type: variant_coverage
    grounds:
    - calculations.press_quote_price
    - calculations.backlog_projection
    - calculations.storage_fee
    excluded_because:
      difficulty_instance: quote_vs_final_invoice_divergence
      rationale: All three dual-variant pairs have dedicated difficulty instances.
  - name: layer_rate_threshold_covered
    claim_type: threshold_coverage
    grounds:
    - calculations.reject_rate_eval
    - calculations.cancellation_fee
    excluded_because:
      difficulty_instance: reject_rate_strictly_greater_boundary
      rationale: Strict-greater threshold asserted there; fee tiers in cancellation_fee_tier_zero_and_ten_pct (this file).
- section: consistency_model
  instances:
  - name: immediate_visibility_after_mutation
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: the credit-status response body already shows SUSPENDED, and a subsequent GET returns the same
      state with no reconciliation delay.'
    test_recipe:
      setup:
      - customer ACTIVE
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: CM1
          contact_email: cm1@x.com
          credit_limit_cents: 1000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      trigger:
      - call: POST /customers/${cust}/credit-status
        payload:
          action: SUSPEND
        as: BillingClerk
        captures:
          st1: $.data.status
          v1: $.data.version
      - call: GET /customers/${cust}
        as: Any
        captures:
          st2: $.data.status
      assert:
      - 'mutation response: status == SUSPENDED, version == 2 (visible in the same request)'
      - GET confirms status == SUSPENDED (no eventual-consistency lag)
