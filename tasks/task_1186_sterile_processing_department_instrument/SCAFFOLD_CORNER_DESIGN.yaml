            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "UD" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { ud: "$.data.id" } }
            - { call: "POST /spd/trays/${ud}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ud}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-G", surgeon: "Dr G", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { cg: "$.data.id" } }
