              payload: {measured_households: 640}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {guard_err: $.data.error_id}
            - call: "POST /crew-assignments/${ca_id}/confirm"
              payload: {}
              as: Producer
              as_user_id: "${v_id}"
              captures: {confirmed_status: $.data.status}
            - call: "POST /playback-slots/${slot_id}/air"
              payload: {measured_households: 640}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {aired_status: $.data.status}
          assert:
            - "${staffing_at_create} == UNDERSTAFFED and ${ca_status} == OFFERED — an OFFERED assignment does not count as coverage"
