      - name: audit_create_constraint_beats_referential_rejected
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_FACILITY_SCHEDULE_OVERLAP]
          - errors[ERR_AUDIT_SCOPE_INCONSISTENT]
        distinguishing_aspect: |
          Error-category pair {business_constraint, business_referential} — disjoint from the
          {state, business_safety} pair above: audit creation with BOTH a facility buffer
          conflict (constraint, priority 6) AND a label_version_id belonging to a different
          product (referential, priority 8) MUST return ERR_FACILITY_SCHEDULE_OVERLAP.
