        captures:
          v23: $.data.id
      - call: POST /va-loans/veterans/${v23}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2021-01-09'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          sp23a: $.data.id
      trigger:
      - call: POST /va-loans/veterans/${v23}/service-periods
        payload:
          branch: NAVY
          start_date: '2021-01-09'
          end_date: '2022-01-08'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          err23: $.data.error_id
      - call: POST /va-loans/veterans/${v23}/service-periods
        payload:
          branch: NAVY
          start_date: '2021-01-10'
          end_date: '2022-01-08'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          sp23b: $.data.id
      assert:
      - 'touching create: status 409, error_id == ERR_SERVICE_PERIOD_OVERLAP'
      - 'adjacent-day create: status 201'
      - Veteran.${v23}.total_qualifying_service_days == 732 (366 from period 1 spanning leap day 2020-02-29 + 366 from period 2)
  - name: deployment_window_half_open_adjacency_allowed
    grounds:
    - validations[priority=20]
    - errors[ERR_DEPLOYMENT_WINDOW_OVERLAP]
    - entities.DeploymentException.fields.deployment_end
    distinguishing_aspect: 'Resource = Veteran deployment calendar, HALF-OPEN semantics on a

      DIFFERENT entity than ServicePeriod: window [2026-03-01, 2026-06-01)

      permits a second window starting exactly 2026-06-01 (end == start is

      NOT overlap), but [2026-05-31, 2026-08-01) collides.

      '
