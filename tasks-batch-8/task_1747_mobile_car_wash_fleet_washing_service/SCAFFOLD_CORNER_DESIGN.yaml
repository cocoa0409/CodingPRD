          assert:
            - "held_status == WEATHER_HELD with held_at 2026-08-10"
            - "err == ERR_RESCHEDULE_WINDOW_EXPIRED (held 2026-08-10 + 14 days = 2026-08-24 < clock 2026-08-25)"

      - name: third_pause_in_year_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "calculations.pause_accounting", "errors[ERR_PAUSE_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Count check precedes day-budget check: with two pauses already in the trailing 365 days (31 + 44 = 75 days), a third 7-day PAUSE fails with ERR_PAUSE_LIMIT_EXCEEDED even though the day budget (75 + 7 = 82 <= 90) would pass."
        test_recipe:
          setup: ["subscription created 2026-01-15; closed pause 2026-03-01 to 2026-04-01 (31 days); closed pause 2026-06-01 to 2026-07-15 (44 days); clock at 2026-07-15"]
