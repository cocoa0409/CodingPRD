              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Who signed the demolition order", defamation_claim_count: 3, privacy_subject_count: 1, unverified_document_count: 0 }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "SUBJECT", submitter_email: "legal@sunsetblock.test", claim_text: "The story names our client as the signatory; she never signed the order.", claimed_error_category: "IDENTIFICATION", reader_reported_reach: 150000, subject_named: true }
              as: PublicEditor
              as_user_id: "public-editor-1"
              captures: { cr: $.data.id }
            - call: "POST /standards-desk/correction-requests/${cr}/start-investigation"
              payload: { assigned_note: "Requesting the signed order from the records office." }
              as: StandardsEditor
              as_user_id: "${sed}"
          trigger:
            - call: "POST /standards-desk/correction-requests/${cr}/adjudicate"
              payload: { outcome_type: "CORRECTION", adjudicated_error_category: "IDENTIFICATION", verified_reach: 150000, notice_text: "An earlier version named the wrong signatory on the demolition order." }
              as: StandardsEditor
