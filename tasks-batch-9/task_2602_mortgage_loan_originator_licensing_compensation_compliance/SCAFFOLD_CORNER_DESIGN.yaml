      - name: license_expiration_before_issue_date_rejected
        claim_type: type_constraints
        grounds:
          - entities.LicenseRegistration.fields.expiration_date
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=7]
        distinguishing_aspect: |
          expiration_date carries the constraint `must be strictly after issue_date`, so
          issue_date 2026-01-02 with expiration_date 2025-12-01 returns 400
          ERR_INVALID_REQUEST rather than creating an already-lapsed licence.
        test_recipe:
          setup:
            - "One Originator (NMLS 2200001) exists; no licence has been filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
