      - name: start_rejects_a_booking_whose_access_the_conversion_cascade_retired
        grounds:
          - validations.priority_13_ERR_ACCESS_ABANDONED
          - state_machines.VascularAccess.IN_USE_to_ABANDONED
          - state_machines.AccessConversionPlan.ACTIVE_to_CONVERTED
