            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${dv_file_id}", account_ref: "ACC7002", sequence_no: 2, statement_amount_cents: 100000, address_line1: "2 Deervale Loop", city: "Boise", region_code: "ID", postal_code: "83702", postal_code_plus4: "6602" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${dv_file_id}", account_ref: "ACC7003", sequence_no: 3, statement_amount_cents: 100500, address_line1: "3 Deervale Loop", city: "Boise", region_code: "ID", postal_code: "83702", postal_code_plus4: "6603" }
