              as: Merchandiser
              captures: { c_id: $.data.id, cv1: $.data.version }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${cv1}", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 18.0 }
              as: ScaleOperator
              captures: { l_id: $.data.id }
            - call: "POST /mill/lots/${l_id}/grade"
              payload: { moisture_pct_official: 18.5, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
