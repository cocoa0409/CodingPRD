            - "the closure returns 200 with PlanPeriod.${pp_id}.status RECONCILING, Carrier.${c1_id}.non_renewal_count_current_period 0, breach_count_current_period 0 and performance_score 100 (min of 100 and 100 plus 10)"
            - "the repeated notice now returns 200 with Policy.${pol4_id}.policy_status NON_RENEWAL_PENDING and non_renewal_effective_date 2027-09-15T00:00:00Z"
            - "Carrier.${c1_id}.non_renewal_count_current_period == 1 and assigned_risk_count is still 4 (a notice does not release the headcount before expiration)"
            - "the three earlier policies are still NON_RENEWAL_PENDING - the closure reset the counter, not the notices"
      - name: a_request_with_no_recognised_role_header_is_unauthenticated_before_anything_else
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1][error_id=ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: |
          Priority 1 sits above existence, so a request that is missing X-Role, missing X-API-Key or
          carrying a role string outside the four declared names must be answered 401 even when the
          path points at a row that does not exist and even when the body is perfectly formed. A
          misspelt role is authentication, not authorisation: it never reaches the priority-2 check
          because there is no role to compare against the endpoint's list.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Atlas Mutual exists and is ACTIVE. No other row exists."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/carriers"
              payload: { name: "Atlas Mutual", naic_code: "11111", voluntary_market_share_bps: 6000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /plan/carriers/${c1_id}"
              as: OMITTED_NO_X_ROLE_HEADER
              captures: { e1: $.data.error_id }
            - call: "GET /plan/carriers/${c1_id}"
              as: OMITTED_NO_X_API_KEY_HEADER
              captures: { e2: $.data.error_id }
            - call: "POST /plan/carriers"
              payload: { name: "Ghost Indemnity", naic_code: "33333", voluntary_market_share_bps: 500, licensed_territories: ["T02"] }
              as: PlanAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /plan/applications/00000000-0000-4000-8000-000000000000"
              as: PlanAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /plan/carriers/${c1_id}"
              as: ComplianceExaminer
          assert:
            - "the call with no X-Role header returns 401 with error_id ERR_UNAUTHENTICATED"
            - "the call with no X-API-Key header returns 401 with error_id ERR_UNAUTHENTICATED"
            - "the well-formed carrier enrolment sent as role PlanAdmin returns 401 with error_id ERR_UNAUTHENTICATED, not 403 ERR_UNAUTHORIZED, and no Carrier row is created (GET /plan/carriers still totals 1)"
            - "the unknown application id read as role PlanAdmin returns 401 with error_id ERR_UNAUTHENTICATED, not 404 ERR_APPLICATION_NOT_FOUND"
            - "the same read as ComplianceExaminer returns 200, proving the target and the path were valid throughout"
            - "every 401 body carries meta.api_request_id and data.error_id per the declared error envelope"
  - section: rbac
    instances:
      - name: each_of_the_four_roles_carries_its_own_half_of_the_workflow
        claim_type: exclusive_operations
        grounds:
          - roles[PlanAdministrator]
          - roles[ComplianceExaminer]
          - roles[ServicingCarrier]
          - roles[ProducerAgent]
          - endpoints[POST /plan/policies/{id}/cancellation]
          - calculations.earned_premium_at_cancellation
        distinguishing_aspect: |
          No single role can drive a risk from intake to policy: the producer files, the examiner
          verifies and certifies, the administrator enrols and runs the cycle, the carrier accepts and
          issues. The setup only completes if all four role bindings work. The shared operations then
          have to work for every role that shares them - and because the cancellation endpoint derives
          the initiating party from the caller's role, the ProducerAgent's cancellation is settled on
          the short-rate basis rather than pro rata.
        test_recipe:
          setup:
            - "Clock at 2026-12-15. The full chain has run: PlanAdministrator enrolled Atlas and Beacon, created period 2026-P3 and cycle 1 and ran it; ProducerAgent filed the applicant, vehicle, application, two declinations and the 38939-cent deposit; ComplianceExaminer verified the MVR and certified; ServicingCarrier accepted and issued."
            - "Policy AR-100014 runs 2026-09-15..2027-09-15 with total_annual_charge_cents 155754 and premium_credited_cents 38939, and Atlas holds assigned_risk_count 1 with quota_target_units 1."
