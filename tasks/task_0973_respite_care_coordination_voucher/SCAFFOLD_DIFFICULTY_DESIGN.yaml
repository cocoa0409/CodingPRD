  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: caregiver_state_beats_insufficient_budget
        grounds:
          - "validations[priority=8]"
          - "validations[priority=24]"
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: one voucher creation
          violates caregiver-active state (SUSPENDED, priority 8) AND budget
          fiscal (provisional 6000 > unencumbered 1000, priority 24); the
          state-category error ERR_CAREGIVER_NOT_ACTIVE wins.
        test_recipe:
          setup:
            - "Program with total_budget_cents 1000 (budget nearly exhausted); caregiver approved (ACTIVE) with 80.00h OPEN allocation; caregiver then SUSPENDED (allocation cascades to FROZEN)"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Tiny Budget", fiscal_year_start: "2026-01-01", total_budget_cents: 1000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
