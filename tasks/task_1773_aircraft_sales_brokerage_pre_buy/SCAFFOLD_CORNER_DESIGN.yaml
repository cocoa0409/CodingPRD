              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2012, sale_price_usd: 100.00, sale_date: "2026-01-05", total_time_hours: 9000, comp_status: "UNVERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Cessna", model: "Citation X", year: 2015, sale_price_usd: 9000000.00, sale_date: "2026-02-01", total_time_hours: 2500, comp_status: "VERIFIED" }
              as: ListingAgent
          trigger:
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "PROVISIONAL" }
              as: ListingAgent
          assert:
            - "trigger[0] response data.market_value_estimate_usd == 4151152.20 (identical to the unpolluted comp set)"

      - name: budget_exactly_equal_to_offer_passes
        claim_type: satisfaction_passes
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "offer_price_usd == qualified_budget_usd (3000000.00) passes the budget gate (<=, not <); only exceeding it fails."
        test_recipe:
          setup: ["ACTIVE listing; buyer QUALIFIED with budget 3000000.00"]
          setup_api_calls:
            - call: "POST /api/comparable-sales"
