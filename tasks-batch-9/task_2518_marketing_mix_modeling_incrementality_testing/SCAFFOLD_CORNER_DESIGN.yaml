      - name: holdout_share_aggregate_across_two_experiments
        claim_type: aggregate_validation
        grounds:
          - "validations priority 60 (business_constraint) - (Market.held_out_population + the population this call would add) * 100 <= MAX_HOLDOUT_POPULATION_PCT * Market.total_population, compared as EXACT INTEGERS"
          - "global_constants.MAX_HOLDOUT_POPULATION_PCT 20"
          - "state_machines Experiment lock-design precondition for GEO_HOLDOUT - the planned populations are counted against the same ceiling"
          - "validations priority 65 note - a DRAFT design reserves nothing"
        distinguishing_aspect: |
          Each experiment is individually admissible (1400000 and 800000 are both under the 2000000
          ceiling) but the SECOND one is refused because the first has already consumed 1000000 of
          assigned cell population: the rule reads the market-level running total, not the request, and the
          refused DRAFT experiment then reserves nothing, so a smaller third design on the very same
          channel and dates still locks.
          
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000, so the holdout ceiling is exactly 2000000 people. Channels A_SEARCH and B_SOCIAL, geo cells GC01 and GC02 with population 500000 each."
            - "Experiment E1 on A_SEARCH is GEO_HOLDOUT with planned arms 500000/500000 (power_index 3.5714 -> computed_power 0.9500, so priority 52 passes). It locks, then assigns GC01 as treatment and GC02 as control, which raises Market.held_out_population to 1000000."
            - "Experiment E2 on B_SOCIAL is GEO_HOLDOUT with planned arms 700000/700000 (power_index 4.2258 -> 0.9500). Its lock-design would need (1000000 + 1400000) * 100 = 240000000 against the ceiling 20 * 10000000 = 200000000."
            - "Experiment E3 is also on B_SOCIAL with the identical dates and planned arms 400000/400000 (power_index 3.1944 -> 0.9000). Its lock-design needs (1000000 + 800000) * 100 = 180000000, which fits."
