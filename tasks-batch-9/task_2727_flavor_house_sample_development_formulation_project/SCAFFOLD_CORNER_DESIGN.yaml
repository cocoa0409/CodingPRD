  - section: complexity_layers
    instances:
      - name: stale_expected_formula_version_blocks_the_revision_then_the_current_one_supersedes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.formula-revision-stale-parent
          - endpoints[POST /formulas/{formula_id}/revisions]
          - errors.ERR_STALE_FORMULA_VERSION
          - state_machines.Formula.APPROVED_to_SUPERSEDED
        distinguishing_aspect: "The version captured at COSTED is two writes behind by the time the formula is APPROVED, so pinning it returns ERR_STALE_FORMULA_VERSION (412) and creates nothing; replaying the same request with the version read from the approval response succeeds, supersedes the parent and carries its single component into the DRAFT successor as iteration_no 2."
        test_recipe:
          setup:
            - "Brief BRF-0001 accepted; formula F1 holds GUM-BASE at 100.0000 %."
            - "F1's version is captured at the costing step (v_cost) and again at the approval step (v_appr); submit and decision each bump the row, so v_cost is strictly less than v_appr."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id", f1_iter: "$.data.iteration_no" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
              captures: { v_cost: "$.data.version" }
            - call: "POST /formulas/${f1}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f1}/decision"
              payload: { decision: "APPROVED" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
              captures: { v_appr: "$.data.version" }
          trigger:
            - call: "POST /formulas/${f1}/revisions"
              payload: { name: "Vanilla Cream F1 rev A", expected_formula_version: "${v_cost}", carry_components: true }
              as: Flavorist
              captures: { err: "$.data.error_id" }
            - call: "POST /formulas/${f1}/revisions"
              payload: { name: "Vanilla Cream F1 rev A", expected_formula_version: "${v_appr}", carry_components: true }
              as: Flavorist
              captures: { f2: "$.data.id", f2_parent: "$.data.parent_formula_id", f2_status: "$.data.status", f2_iter: "$.data.iteration_no" }
          assert:
            - "f1_iter == 1 and v_cost < v_appr"
            - "first trigger call returns HTTP status == 412 with data.error_id == ERR_STALE_FORMULA_VERSION"
            - "after the first trigger Formula.${f1}.status == APPROVED, Formula.${f1}.version == ${v_appr} and Formula.${f1}.superseded_by_formula_id is null"
            - "after the first trigger GET /formulas returns total_count == 1"
            - "second trigger call returns HTTP status == 201"
            - "f2_status == DRAFT and ${f2_parent} == ${f1} and f2_iter == 2"
            - "Formula.${f2}.component_count == 1 and Formula.${f2}.total_weight_pct == 100.0000 and Formula.${f2}.bench_cost_per_kg_cents is null"
            - "Formula.${f1}.status == SUPERSEDED and Formula.${f1}.superseded_by_formula_id == ${f2} and Formula.${f1}.version == ${v_appr} + 1"

      - name: stale_expected_brief_version_blocks_the_forecast_then_the_current_one_creates_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.forecast-create-stale-brief
          - endpoints[POST /commercialization-forecasts]
          - errors.ERR_STALE_BRIEF_VERSION
          - calculations.forecast_value
        distinguishing_aspect: "The forecast pins the parent brief instead of its own row: the version read right after submit is stale once the director accepts, so the create returns ERR_STALE_BRIEF_VERSION (412), and the accepted-version retry lands an ACTIVE forecast at 1237500 cents (5000000 x 0.45 x 0.55) without bumping the brief."
        test_recipe:
          setup:
            - "Brief BRF-0001 exists and has been submitted and accepted; the version is captured after submit (v_sub) and after the decision (v_acc)."
            - "No formula of this brief is APPROVED yet, so the technology factor is TECH_FACTOR_EARLY 0.55 and the stage probability is STAGE_PROB_ACCEPTED 0.45."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id", v_create: "$.data.version" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
              captures: { v_sub: "$.data.version" }
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED", decision_note: "brief is workable" }
              as: TechnicalDirector
              captures: { v_acc: "$.data.version" }
          trigger:
            - call: "POST /commercialization-forecasts"
              payload: { brief_id: "${b1}", annual_volume_kg: 500, unit_price_cents_per_kg: 10000, expected_brief_version: "${v_sub}" }
              as: AccountManager
              captures: { err: "$.data.error_id" }
            - call: "POST /commercialization-forecasts"
              payload: { brief_id: "${b1}", annual_volume_kg: 500, unit_price_cents_per_kg: 10000, expected_brief_version: "${v_acc}" }
              as: AccountManager
              captures: { fc: "$.data.id", fc_value: "$.data.weighted_annual_value_cents", fc_status: "$.data.status" }
          assert:
            - "v_create == 1 and v_sub == 2 and v_acc == 3"
            - "first trigger call returns HTTP status == 412 with data.error_id == ERR_STALE_BRIEF_VERSION"
            - "after the first trigger GET /commercialization-forecasts returns total_count == 0"
            - "second trigger call returns HTTP status == 201"
            - "fc_status == ACTIVE and fc_value == 1237500"
            - "CommercializationForecast.${fc}.base_annual_value_cents == 5000000"
            - "CustomerBrief.${b1}.version == 3: creating the forecast does not bump the pinned parent"

      - name: brief_version_increments_once_per_write_and_child_creates_leave_it_alone
        claim_type: version_increment
        grounds:
          - entities.CustomerBrief.fields.version
          - state_machines.CustomerBrief
          - endpoints[POST /commercialization-forecasts]
          - endpoints[POST /formulas]
        distinguishing_aspect: "Five successive writes on one brief - create, submit, clarification-request, re-submit, decision - leave version at exactly 5 with no double-bump on the cyclic re-entry, while creating a child Formula and a child CommercializationForecast against that brief leaves version at 5."
        test_recipe:
          setup:
            - "Brief BRF-0001 is created, submitted, sent back for clarification once, re-submitted and accepted; the version is captured after each write."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id", w1: "$.data.version" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
              captures: { w2: "$.data.version" }
            - call: "POST /customer-briefs/${b1}/clarification-request"
              payload: { clarification_note: "confirm the dairy matrix pH" }
              as: TechnicalDirector
              captures: { w3: "$.data.version", w3_rounds: "$.data.clarification_round_count" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
              captures: { w4: "$.data.version", w4_status: "$.data.status" }
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
              captures: { w5: "$.data.version" }
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id" }
            - call: "POST /commercialization-forecasts"
              payload: { brief_id: "${b1}", annual_volume_kg: 500, unit_price_cents_per_kg: 10000, expected_brief_version: "${w5}" }
              as: AccountManager
              captures: { fc: "$.data.id" }
          assert:
            - "w1 == 1 and w2 == 2 and w3 == 3 and w4 == 4 and w5 == 5"
            - "w3_rounds == 1 and w4_status == SUBMITTED"
            - "CustomerBrief.${b1}.status == ACCEPTED and CustomerBrief.${b1}.version == 5"
            - "Formula.${f1}.version == 1: the child starts its own counter"
            - "CommercializationForecast.${fc}.version == 1"
            - "GET /customer-briefs/${b1} reports version == 5 after both child creates"

      - name: repricing_the_material_stales_the_pin_and_only_a_fresh_batch_can_be_toleranced
        claim_type: version_pinning_on_approval
        grounds:
          - endpoints[PATCH /raw-materials/{material_id}]
          - state_machines.ScaleUpBatch.REQUESTED_to_TOLERANCE_SET
          - errors.ERR_PINNED_FORMULA_STALE
          - calculations.production_cost
        distinguishing_aspect: "The batch pins the formula version it was raised against; a reprice re-costs the APPROVED formula in place and bumps that version, so tolerance on the old batch returns ERR_PINNED_FORMULA_STALE (409) at priority 48 - the formula is still APPROVED so the 42 gate passes - while a batch raised after the reprice tolerances at the new 2500 cents/kg bench cost."
        test_recipe:
          setup:
            - "Brief BRF-0001 accepted; formula F1 holds GUM-BASE at 100.0000 % at 2000 cents/kg and is APPROVED with bench_cost_per_kg_cents 2000."
            - "Batch B1 for 150 kg was raised before the reprice, so its pinned_formula_version equals the approved version and its status is REQUESTED."
            - "GUM-BASE is then repriced to 2500 cents/kg, which re-costs F1 in place: bench_cost_per_kg_cents 2500, cost_stale true, status still APPROVED, version incremented."
          setup_api_calls:
            - call: "POST /raw-materials"
