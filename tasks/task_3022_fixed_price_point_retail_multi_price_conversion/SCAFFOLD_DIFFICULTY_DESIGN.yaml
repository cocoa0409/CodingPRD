              captures: { cov_delta: $.data.coverage_delta_pct }
          assert:
            - "ExclusivePackProgram.${pack_under_id}.target_landed_cost_cents == 123 and pack_under_status == ACTIVE — 123 cents is inclusive, the ceiling passes at equality"
            - "the program quoting 124 cents returns 422 and err_ceiling == ERR_PACK_COST_TARGET_MISSED — 124 is the FIRST rejecting value"
            - "ExclusivePackProgram.${pack_over_id}.status == DRAFT — the failed advance left the program where it was"
            - "PriceIntegrityAudit.${audit_exact_id}.mismatch_ratio == 0.052 and result == WITHIN_TOLERANCE — 5/96 rounds to exactly the 0.052 tolerance and the comparison is strict"
            - "PriceIntegrityAudit.${audit_over_id}.mismatch_ratio == 0.063 and result == VIOLATION"
            - "the coverage read reports completed_aisle_count == 0, projected_convertible_aisle_count == 3, adjusted_baseline == 3 and coverage_delta_pct == -1.000 with shortfall true — zero of three executed is the failing side of the -0.500 floor"

      - name: empty_and_zero_collection_edges_on_second_endpoints
        grounds:
          - calculations.conversion_coverage_shortfall
          - calculations.price_integrity_result
          - entities.ConversionProject.fields.coverage_delta_pct
          - entities.PriceIntegrityAudit.fields.mismatch_ratio
          - state_machines.AisleReset.PLANNED_to_ABANDONED
        distinguishing_aspect: "Empty-collection and zero-count edges on different metrics and different endpoints from the scalar instance: a project with zero AisleReset rows at all reads adjusted_baseline 1 and coverage_delta_pct -1.000 because the floor guard substituted the baseline, an audit with observed_item_count 0 reads mismatch_ratio 0 rather than raising a division error, and abandoning the only planned reset flips executed_count from 1 to 0 so the delta moves from 0.000 to -1.000 with no new rows."
