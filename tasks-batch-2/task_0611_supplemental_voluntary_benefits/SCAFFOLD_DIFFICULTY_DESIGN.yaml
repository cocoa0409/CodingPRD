# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Supplemental & Voluntary Benefits — EXPERT band
# 9 rules x >= 2 instances = 18 difficulty instances
#
# Canonical fixtures referenced by recipes below:
#   - Default logical clock startup = 2026-01-01T00:00:00Z
#   - GI window (period OE-2026): [2026-03-01T00:00:00Z, 2026-04-01T00:00:00Z)
#   - benefit_year_start = 2026-01-01T00:00:00Z
#   - Product A (ACCIDENT): weekly_premium_cents=1200, eoi_surcharge_bps=1500,
#       annual_benefit_cap_cents=500000, portability_loadup_bps=1000
#   - Schedule on A: FRACTURE flat=200000 lifetime_max=2; HEART flat=300000;
#       WELLNESS flat=5000 is_wellness=true lifetime_max=1
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: premium_gi_vs_eoi_diverge_on_enrollment
        grounds:
          - calculations.premium_assessment
          - entities.Enrollment.fields.weekly_premium_cents
          - entities.Enrollment.fields.gi_status
          - entities.PlanProduct.fields.eoi_surcharge_bps
        distinguishing_aspect: |
          Same Product A base premium (1200c) produces weekly_premium_cents=1200
          when enrolled_at is inside the GI window (gi_status=GUARANTEED_ISSUE)
          but 1380 when enrolled_at is at/after gi_window_end
          (gi_status=EVIDENCE_REQUIRED); the variant divergence lives on the
          Enrollment entity domain (premium), distinct from the Claim-domain
          adjudication variant below.
        test_recipe:
          setup:
            - "Employer (ppy=52, section_125_plan_active=true), Product A OPEN with FRACTURE/HEART/WELLNESS schedule, period OE-2026 OPEN with GI window [2026-03-01,2026-04-01)."
            - "Two employees: one enrolled at 2026-03-15 (in-window), one enrolled at 2026-05-01 (post-window)."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Acme Co", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "AccidentPlus", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000, eoi_surcharge_bps: 1500, portability_loadup_bps: 1000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000, lifetime_max_occurrences: 2 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Gi Member", email: "gi@acme.test" }
              as: BenefitsAdmin
              captures: { emp_gi_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Eoi Member", email: "eoi@acme.test" }
              as: BenefitsAdmin
              captures: { emp_eoi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_gi_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_gi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: System
          trigger:
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_eoi_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_eoi_id: $.data.id }
          assert:
            - "Enrollment.${enr_gi_id}.gi_status == GUARANTEED_ISSUE"
            - "Enrollment.${enr_gi_id}.weekly_premium_cents == 1200"
            - "Enrollment.${enr_eoi_id}.gi_status == EVIDENCE_REQUIRED"
            - "Enrollment.${enr_eoi_id}.weekly_premium_cents == 1380"

      - name: claim_provisional_vs_adjudicated_diverge_on_claim
        grounds:
          - calculations.claim_adjudication
          - entities.Claim.fields.claimed_cents
          - entities.Claim.fields.approved_cents
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          For a HEART claim (schedule flat=300000) on an enrollment whose annual
          cap remaining is only 100000 (benefit_paid_cents=400000), claimed_cents
          is recorded at the raw schedule amount 300000 at filing, but
          approved_cents resolves to min(300000,100000)=100000 at approval; the
          divergence lives on the Claim entity domain, distinct from the
          Enrollment-domain premium variant above.
        test_recipe:
          setup:
            - "Employer/Product A/period as above; employee enrolled in-window, ACTIVE and funded."
            - "Enrollment benefit_paid_cents pre-loaded to 400000 via one approved+paid FRACTURE (200000) then a second approved+paid FRACTURE (200000)."
            - "A new HEART claim is then filed and approved; cap remaining at approval is 100000."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Acme Co", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "AccidentPlus", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000, eoi_surcharge_bps: 1500, portability_loadup_bps: 1000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000, lifetime_max_occurrences: 2 }
              as: BenefitsAdmin
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "HEART", flat_benefit_cents: 300000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Claimant", email: "claim@acme.test" }
              as: BenefitsAdmin
              captures: { emp_c_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts"
              payload: { employee_id: "${emp_c_id}", routing_number: "123456789", account_last4: "4321" }
              as: BenefitsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts/${acct_id}/verify"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_c_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 0, outcome: "POSTED" }
              as: Payroll
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "FRACTURE", event_date: "2026-03-20T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_f1_id: $.data.id }
            - call: "POST /benefits/claims/${claim_f1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_f1_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_f1_id}/disburse"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "FRACTURE", event_date: "2026-03-21T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_f2_id: $.data.id }
            - call: "POST /benefits/claims/${claim_f2_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_f2_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_f2_id}/disburse"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "HEART", event_date: "2026-03-22T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_h_id: $.data.id }
          trigger:
            - call: "POST /benefits/claims/${claim_h_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_h_id}/approve"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim_h_id}.claimed_cents == 300000"
            - "Claim.${claim_h_id}.approved_cents == 100000"
            - "Enrollment.${enr_id}.benefit_paid_cents == 500000"
            - "Enrollment.${enr_id}.benefit_remaining_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deduction_tier_selection_by_pay_frequency
        grounds:
          - calculations.deduction_conversion
          - entities.Employer.fields.pay_periods_per_year
          - entities.Enrollment.fields.weekly_deduction_cents
        distinguishing_aspect: |
          MODE (a): weekly_deduction_cents = floor(weekly_premium_cents*52/ppy)
          has 3 inputs (premium, 52, ppy) with tier selection on ppy in {52,26,24,12}
          producing 1200 at ppy=52 but 5200 at ppy=12 for the same 1200c premium;
          this is non-linear tiered selection, a different combinatorial mode from
          the circular-dependency ledger formula below.
        test_recipe:
          setup:
            - "Two employers identical except pay_periods_per_year: one 52 (weekly), one 12 (monthly)."
            - "Both enroll an employee in an equivalent OPEN ACCIDENT product (base 1200) in-window."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Weekly Co", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_w_id: $.data.id }
            - call: "POST /benefits/employers"
              payload: { legal_name: "Monthly Co", section_125_plan_active: true, pay_periods_per_year: 12 }
              as: BenefitsAdmin
              captures: { emp_m_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_w_id}", policy_type: "ACCIDENT", product_name: "W-Plan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_w_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_w_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_w_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_m_id}", policy_type: "ACCIDENT", product_name: "M-Plan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_m_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_m_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_m_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_w_id}", label: "OE-W", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_w_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_w_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_m_id}", label: "OE-M", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_m_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_m_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_w_id}", full_name: "W Emp", email: "w@x.test" }
              as: BenefitsAdmin
              captures: { emp_we_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_m_id}", full_name: "M Emp", email: "m@x.test" }
              as: BenefitsAdmin
              captures: { emp_me_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_we_id}", plan_product_id: "${prod_w_id}", enrollment_period_id: "${period_w_id}" }
              as: BenefitsAdmin
              captures: { enr_w_id: $.data.id }
          trigger:
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_me_id}", plan_product_id: "${prod_m_id}", enrollment_period_id: "${period_m_id}" }
              as: BenefitsAdmin
              captures: { enr_m_id: $.data.id }
          assert:
            - "Enrollment.${enr_w_id}.weekly_deduction_cents == 1200"
            - "Enrollment.${enr_m_id}.weekly_deduction_cents == 5200"

      - name: benefit_ledger_eval_order_circular_cap
        grounds:
          - calculations.claim_adjudication
          - entities.Enrollment.fields.benefit_paid_cents
          - entities.Enrollment.fields.benefit_remaining_cents
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          MODE (c): each approval's approved_cents = min(claimed, cap - benefit_paid),
          but benefit_paid is itself the running sum of prior approved amounts — a
          circular-looking dependency whose evaluation order is pinned to approval
          chronology. Approving FRACTURE(200000) then HEART(300000) yields
          benefit_paid 200000 then 500000; reversing the approval order would yield
          a different second-claim approved value, so order is observable. This is a
          different combinatorial mode from the tier-selection formula above.
        test_recipe:
          setup:
            - "Employer/Product A (cap 500000)/period; one ACTIVE funded enrollment, verified account."
            - "FRACTURE(200000) approved first, then HEART(300000) approved second."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Order Co", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "OrderPlan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "HEART", flat_benefit_cents: 300000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Ord Emp", email: "ord@x.test" }
              as: BenefitsAdmin
              captures: { emp_o_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts"
              payload: { employee_id: "${emp_o_id}", routing_number: "123456789", account_last4: "9999" }
              as: BenefitsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts/${acct_id}/verify"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_o_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 0, outcome: "POSTED" }
              as: Payroll
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "FRACTURE", event_date: "2026-03-20T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_f_id: $.data.id }
            - call: "POST /benefits/claims/${claim_f_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_f_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "HEART", event_date: "2026-03-21T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_h_id: $.data.id }
            - call: "POST /benefits/claims/${claim_h_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /benefits/claims/${claim_h_id}/approve"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim_f_id}.approved_cents == 200000"
            - "Claim.${claim_h_id}.approved_cents == 300000"
            - "Enrollment.${enr_id}.benefit_paid_cents == 500000"
            - "Enrollment.${enr_id}.benefit_remaining_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_funding_cycle_current_lapsed_current
        grounds:
          - state_machines.Enrollment.CURRENT_to_LAPSED
          - state_machines.Enrollment.LAPSED_to_CURRENT
          - calculations.lapse_evaluation
          - entities.Enrollment.fields.funding_status
        distinguishing_aspect: |
          The Enrollment funding dimension is cyclic: CURRENT -> LAPSED (3 consecutive
          FAILED) -> CURRENT (a POSTED reinstatement). The same enrollment loops back
          to CURRENT, proving a true cycle; this non-linear shape sits on the
          Enrollment entity, distinct from the Claim branching machine below.
        test_recipe:
          setup:
            - "One ACTIVE enrollment, funding_status CURRENT after an initial POSTED deduction."
            - "Three consecutive FAILED deductions lapse it; a fourth POSTED reinstates it."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Cycle Co", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "CyclePlan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Cyc Emp", email: "cyc@x.test" }
              as: BenefitsAdmin
              captures: { emp_c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_c_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 0, outcome: "POSTED" }
              as: Payroll
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 1, outcome: "FAILED" }
              as: Payroll
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 2, outcome: "FAILED" }
              as: Payroll
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 3, outcome: "FAILED" }
              as: Payroll
          trigger:
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
