                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q1_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles/${cycle_id}/complete"
