# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >= 2 instances = 21 instances.
# Every literal in `assert:` was produced by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_straight_rate_vs_final_spa_allocation
        grounds:
          - calculations.coupon_revenue_allocation
          - calculations.prorate_factor_selection
          - entities.Coupon.fields.allocated_amount_minor
          - entities.Coupon.fields.allocation_basis
          - state_machines.Ticket.UNPRORATED_to_PROVISIONAL
          - state_machines.Ticket.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          This dual variant lives in the ticket/coupon revenue-allocation domain: the identical
          three-coupon ticket yields 72260/4523/23217 under PROVISIONAL (special prorate
          agreements deliberately ignored, straight-rate weights only) and 66601/12000/21399
          under FINAL (the LHR-CDG coupon takes a 12000 SPA_FLAT amount off the top and the
          remaining two coupons share a smaller 88000 pool).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T00:00:00Z."
            - "Three ACTIVE carriers AA, BB, CC, each with credit_limit_minor 100000000."
            - "An ACTIVE SPA_FLAT agreement AA->BB in USD covering 2026-08-01..2026-08-31 with one factor LHR/CDG/ECONOMY flat_amount_minor 12000."
            - "Ticket 0011234567890 validated by AA, USD, total_fare_minor 100000, with coupons 1=JFK-LHR/AA/ECONOMY/3451tpm, 2=LHR-CDG/BB/ECONOMY/216tpm, 3=CDG-FCO/CC/BUSINESS/693tpm."
            - "A PROVISIONAL run has already allocated the ticket; all three coupons are then flown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "CC", name: "Cirrus Continental", base_currency: "EUR", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { cc: $.data.id }
            - call: "POST /interline/prorate-agreements"
              payload: { issuing_carrier_id: "${aa}", partner_carrier_id: "${bb}", agreement_type: "SPA_FLAT", settlement_currency: "USD", effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { ag: $.data.id }
            - call: "POST /interline/prorate-agreements/${ag}/factors"
              payload: { origin: "LHR", destination: "CDG", class_of_service: "ECONOMY", flat_amount_minor: 12000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/prorate-agreements/${ag}/activate"
              payload: {}
              as: ClearinghouseOperator
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0011234567890", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-02T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${aa}", class_of_service: "ECONOMY", tpm_miles: 3451 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 2, origin: "LHR", destination: "CDG", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 216 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c2: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 3, origin: "CDG", destination: "FCO", operating_carrier_id: "${cc}", class_of_service: "BUSINESS", tpm_miles: 693 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c3: $.data.id }
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv1: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "PROVISIONAL", expected_ticket_version: "${tv1}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/coupons/${c2}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/coupons/${c3}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv2: $.data.version }
          trigger:
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv2}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { run2: $.data.id }
          assert:
            - "After the PROVISIONAL run: Coupon.${c1}.allocated_amount_minor == 72260, Coupon.${c2}.allocated_amount_minor == 4523, Coupon.${c3}.allocated_amount_minor == 23217, all three with allocation_basis == STRAIGHT_RATE"
            - "After the FINAL run: Coupon.${c2}.allocated_amount_minor == 12000 and Coupon.${c2}.allocation_basis == SPA_FLAT"
            - "After the FINAL run: Coupon.${c1}.allocated_amount_minor == 66601 and Coupon.${c3}.allocated_amount_minor == 21399, both allocation_basis == STRAIGHT_RATE"
            - "ProrationRun.${run2}.spa_total_minor == 12000 and ProrationRun.${run2}.straight_rate_pool_minor == 88000 and ProrationRun.${run2}.total_weight_units == 45598000"
            - "Ticket.${t1}.proration_status == FINAL and Ticket.${t1}.unallocated_residual_minor == 0"
            - "The two runs disagree on every coupon: 72260 != 66601, 4523 != 12000, 23217 != 21399"

      - name: ffp_estimate_tier_vs_period_true_up_tier
        grounds:
          - calculations.ffp_mileage_cost
          - entities.Coupon.fields.ffp_accrual_cost_minor
          - entities.Coupon.fields.ffp_tier
          - entities.Carrier.fields.period_ffp_cost_trued_up_minor
          - entities.Carrier.fields.ffp_true_up_delta_minor
          - state_machines.SettlementPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          This dual variant lives in the carrier frequent-flyer-cost domain, not the ticket
          revenue domain: two 10000-mile coupons are costed chronologically at TIER_A then
          TIER_B for an estimate sum of 25500, while the period close re-costs all 20000 miles
          at the single TIER_B rate for 23000, leaving ffp_true_up_delta_minor == -2500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T00:00:00Z; carriers AA and BB ACTIVE; BB has never accrued miles (period_accrued_miles 0)."
            - "Settlement period 2026-08-P1 spanning [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) in USD."
            - "Ticket validated by AA with two FIRST-class 5000-tpm coupons, both operated by BB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0012000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-02T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "FIRST", tpm_miles: 5000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { cx: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 2, origin: "LHR", destination: "JFK", operating_carrier_id: "${bb}", class_of_service: "FIRST", tpm_miles: 5000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { cy: $.data.id }
            - call: "POST /interline/coupons/${cx}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/coupons/${cy}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ClearinghouseOperator
          trigger:
            - call: "POST /interline/settlement-periods/${p1}/close"
              payload: {}
              as: ClearinghouseOperator
          assert:
            - "Coupon.${cx}.ffp_miles_awarded == 10000, Coupon.${cx}.ffp_tier == TIER_A, Coupon.${cx}.ffp_accrual_cost_minor == 14000"
            - "Coupon.${cy}.ffp_miles_awarded == 10000, Coupon.${cy}.ffp_tier == TIER_B, Coupon.${cy}.ffp_accrual_cost_minor == 11500"
            - "Before the close, Carrier.${bb}.period_accrued_miles == 20000 and Carrier.${bb}.period_ffp_cost_estimate_minor == 25500"
            - "After the close, Carrier.${bb}.period_ffp_cost_trued_up_minor == 23000"
            - "After the close, Carrier.${bb}.ffp_true_up_delta_minor == -2500"
            - "Carrier.${aa}.period_ffp_cost_trued_up_minor == 0 — the accrual is owed to the operating partner, never to the validating carrier"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: round_per_coupon_then_grant_residual_to_heaviest
        grounds:
          - calculations.coupon_revenue_allocation
          - entities.ProrationRun.fields.rounding_residual_minor
          - entities.Ticket.fields.unallocated_residual_minor
          - state_machines.Ticket.UNPRORATED_to_PROVISIONAL
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER decides the cents. Rounding each of the three
          shares first gives 13646 + 13646 + 72707 = 99999, one minor unit short of the 100000
          pool; the pinned order then grants the single-unit residual to the heaviest coupon,
          producing 72708. Summing the exact rational shares and rounding once would leave
          72707 and a lost cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T00:00:00Z; carriers AA, BB, CC ACTIVE; no prorate agreements at all, so every coupon settles on the straight-rate default factor_bp 10000."
            - "Ticket validated by AA, USD, total_fare_minor 100000, coupons 1=JFK-BOS/AA/ECONOMY/100tpm, 2=BOS-YUL/BB/ECONOMY/100tpm, 3=YUL-CDG/CC/BUSINESS/333tpm."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "CC", name: "Cirrus Continental", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { cc: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0013000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-02T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "BOS", operating_carrier_id: "${aa}", class_of_service: "ECONOMY", tpm_miles: 100 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 2, origin: "BOS", destination: "YUL", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 100 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c2: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 3, origin: "YUL", destination: "CDG", operating_carrier_id: "${cc}", class_of_service: "BUSINESS", tpm_miles: 333 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c3: $.data.id }
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "PROVISIONAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { run: $.data.id }
          assert:
            - "Coupon.${c1}.weight_units == 1000000 and Coupon.${c2}.weight_units == 1000000 and Coupon.${c3}.weight_units == 5328000"
            - "ProrationRun.${run}.total_weight_units == 7328000 and ProrationRun.${run}.rounding_residual_minor == 1"
            - "Coupon.${c1}.allocated_amount_minor == 13646 and Coupon.${c2}.allocated_amount_minor == 13646"
            - "Coupon.${c3}.allocated_amount_minor == 72708 — the pre-residual value 72707 plus the whole one-unit residual"
            - "Coupon.${c1}.allocated_amount_minor + Coupon.${c2}.allocated_amount_minor + Coupon.${c3}.allocated_amount_minor == 100000"
            - "Ticket.${t1}.unallocated_residual_minor == 0"

      - name: ich_fee_tier_keyed_on_pre_fee_gross_not_on_claim
        grounds:
          - calculations.invoice_claim_build
          - entities.BillingInvoice.fields.ich_fee_bp
          - entities.BillingInvoice.fields.ich_handling_fee_minor
          - entities.BillingInvoice.fields.total_claim_minor
          - state_machines.BillingInvoice.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned to one evaluation order. The invoice
          grosses exactly 500000, which sits on the second fee tier (50 bp, fee 2500, claim
          497500). Keying the tier on the post-fee claim instead would drop it back under
          500000 and select 75 bp, so an implementation that evaluates in the wrong order
          writes ich_fee_bp 75 and a different total_claim_minor.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z; carriers AA (billed, credit_limit_minor 100000000) and BB (billing) ACTIVE."
            - "Settlement period 2026-08-P1 OPEN, USD, submission_deadline 2026-09-05T00:00:00Z."
            - "Ticket validated by AA, USD, total_fare_minor 500000, one coupon operated by BB, flown and FINAL-prorated so the coupon carries the whole 500000."
            - "A DRAFT invoice from BB to AA in USD holding that single coupon."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0014000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 500000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
          assert:
            - "BillingInvoice.${inv}.gross_billed_minor == 500000"
            - "BillingInvoice.${inv}.ich_fee_bp == 50 (not 75)"
            - "BillingInvoice.${inv}.ich_handling_fee_minor == 2500 (not 3750)"
            - "BillingInvoice.${inv}.late_submission_penalty_minor == 0"
            - "BillingInvoice.${inv}.total_claim_minor == 497500"
            - "BillingInvoice.${inv}.provisional_rate_scaled == 1000000 and BillingInvoice.${inv}.provisional_settlement_minor == 497500"

      - name: audit_claim_cap_before_haircut_composition
        grounds:
          - calculations.undercharge_extrapolation
          - calculations.audit_population_derivation
          - entities.AuditSample.fields.coverage_bp
          - entities.AuditSample.fields.haircut_bp
          - entities.AuditSample.fields.claim_amount_minor
          - state_machines.AuditSample.IN_REVIEW_to_CLAIM_RAISED
        distinguishing_aspect: |
          Mode (a) — a four-input non-linear composition: coverage 833 bp selects the 1500 bp
          haircut tier, the 6000 ratio extrapolation is compared against the 12500 cap
          (25 x 500) and the smaller survives, then the haircut is applied to the capped
          figure to give exactly 5100. Applying the haircut before the cap, or reading the
          coverage tier off the coupon count instead of the allocated value, gives a
          different number.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T00:00:00Z; carriers AA (validating), CC (operating/audited) ACTIVE."
            - "Settlement period 2026-08-P1 spanning [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) in USD."
            - "Ticket A: USD 100000 fare, two identical 1000-tpm ECONOMY coupons operated by CC, each allocated 50000."
            - "Ticket B: USD 20000 fare, two identical 1000-tpm ECONOMY coupons operated by CC, each allocated 10000."
            - "All four coupons flown, both tickets FINAL-prorated, all four attached to one submitted invoice CC->AA, and the period closed at 2026-09-06T00:00:00Z, so the audit population is 4 coupons worth 120000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "CC", name: "Cirrus Continental", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { cc: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0015000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-02T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { ta: $.data.id }
            - call: "POST /interline/tickets/${ta}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${cc}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { ca1: $.data.id }
            - call: "POST /interline/tickets/${ta}/coupons"
              payload: { coupon_number: 2, origin: "LHR", destination: "JFK", operating_carrier_id: "${cc}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { ca2: $.data.id }
            - call: "POST /interline/coupons/${ca1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/coupons/${ca2}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${ta}"
              payload: {}
