            - "${err} == ERR_AID_ALLOCATION_EXHAUSTED"
            - "${err} != ERR_AID_BUDGET_EXHAUSTED"
            - "Tournament.${tc_id}.entry_count == 0"
            - "AidApplication.${a1_id}.consumed_cents == 60000"
            - "Season.${season_id}.assistance_committed_cents == 60000"
            - "Season.${season_id}.assistance_available_cents == 440000"

      - name: season_budget_too_small_to_fund_the_award_whole
        claim_type: violation_to_error
        grounds:
          - validations.priority_82
          - errors.ERR_AID_BUDGET_EXHAUSTED
          - calculations.assistance_award_amount
        distinguishing_aspect: "The award is 30000 and the season holds only 20000 available, and because the association never part-funds an entry the request fails with ERR_AID_BUDGET_EXHAUSTED instead of granting 20000 — available stays 20000, committed stays 0, and consumed_cents stays 0."
        test_recipe:
          setup:
            - "One season whose assistance_budget_cents is only 20000, and one VERIFIED U17 member m1."
            - "m1's application (household_income_cents 1000000, dependents 1 -> covered_pct 1.00) is APPROVED."
            - "One ENTRY_OPEN U17 LOCAL tournament with entry_fee_cents 30000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 20000 }, as: TourAdmin, captures: { season_id: $.data.id, avail0: $.data.assistance_available_cents } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 1000000, dependents: 1, expected_member_version: "${v1}" }, as: Member, as_user_id: "${m1_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /aid-applications/${a1_id}/decide", payload: { decision: "APPROVED" }, as: TourAdmin, captures: { pct: $.data.covered_pct } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Autumn Local A", division: "U17", tier: "LOCAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 30000, round_count: 2, course_rating: 70.0, slope_rating: 120 }, as: TourAdmin, captures: { ta_id: $.data.id } }
            - { call: "POST /tournaments/${ta_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${ta_id}", aid_application_id: "${a1_id}", request_assistance: true }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "${avail0} == 20000"
            - "${pct} == 1.00"
            - "http_status == 409"
            - "${err} == ERR_AID_BUDGET_EXHAUSTED"
            - "${err} != ERR_AID_ALLOCATION_EXHAUSTED"
            - "Season.${season_id}.assistance_available_cents == 20000"
            - "Season.${season_id}.assistance_committed_cents == 0"
            - "AidApplication.${a1_id}.consumed_cents == 0"
            - "Tournament.${ta_id}.entry_count == 0"

      - name: start_with_an_empty_field_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_72
          - errors.ERR_EMPTY_FIELD
        distinguishing_aspect: "A tournament that reached FIELD_SET with zero candidates has accepted_count 0, so start returns ERR_EMPTY_FIELD (not ERR_INVALID_TOURNAMENT_STATE, since FIELD_SET is the admissible from-state) and the status stays FIELD_SET."
        test_recipe:
          setup:
            - "One season and one REGIONAL U17 tournament that nobody entered, driven through open-entries, close-entries and set-field."
            - "The clock is 2026-09-10T12:00:00Z, so the start date has arrived."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t1_id}/close-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${t1_id}/set-field", payload: {}, as: TourAdmin, captures: { st: $.data.status, acc: $.data.accepted_count } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-10T12:00:00Z" }, as: Anonymous }
          trigger:
            - { call: "POST /tournaments/${t1_id}/start", payload: {}, as: TourAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${st} == FIELD_SET"
            - "${acc} == 0"
            - "http_status == 409"
            - "${err} == ERR_EMPTY_FIELD"
            - "${err} != ERR_INVALID_TOURNAMENT_STATE"
            - "Tournament.${t1_id}.status == FIELD_SET"

      - name: coach_access_request_without_publication_consent_is_refused
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_74
          - errors.ERR_PUBLICATION_NOT_CONSENTED
          - endpoints.POST_coach_access_grants
        distinguishing_aspect: "m2 has publication_opt_in false, so a coach's access request is refused with ERR_PUBLICATION_NOT_CONSENTED and no CoachAccessGrant row is created; the same request against m1, who consented, succeeds — consent is read from the target member, not from the coach."
        test_recipe:
          setup:
            - "One season, VERIFIED member m1 with publication_opt_in true and VERIFIED member m2 with publication_opt_in false."
            - "Both members' current versions are read immediately before each optimistic write."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m2_id: $.data.id, op2: $.data.publication_opt_in } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m2_id}", payload: {}, as: TourAdmin, captures: { v2: $.data.version } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /coach-access-grants", payload: { member_id: "${m2_id}", coach_school: "State University", scope: "RESULTS_ONLY", expected_member_version: "${v2}" }, as: Coach, as_user_id: "coach-recruit-1", captures: { err: $.data.error_id } }
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "State University", scope: "RESULTS_ONLY", expected_member_version: "${v1}" }, as: Coach, as_user_id: "coach-recruit-1", captures: { g_id: $.data.id, gst: $.data.status } }
          assert:
            - "${op2} == false"
            - "trigger 1: http_status == 409"
            - "${err} == ERR_PUBLICATION_NOT_CONSENTED"
            - "trigger 2: http_status == 201"
            - "${gst} == REQUESTED"
            - "CoachAccessGrant.${g_id}.member_id == ${m1_id}"
            - "CoachAccessGrant.${g_id}.coach_user_id == coach-recruit-1"

      - name: entry_state_gate_before_handicap_ceiling
        claim_type: priority_conflict
        grounds:
          - validations.priority_31
          - validations.priority_51
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / entry_state_gate_outranks_handicap_ceiling
          rationale: "That §1.8 instance violates both rules at once and asserts the lower-priority error is not returned."

      - name: suspension_before_budget_exhaustion
        claim_type: priority_conflict
        grounds:
          - validations.priority_40
          - validations.priority_82
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / member_suspension_safety_outranks_budget_exhaustion
          rationale: "That §1.8 instance violates both rules at once and pins ERR_MEMBER_SUSPENDED as the answer."

      - name: marker_validity_before_tee_slot_capacity
        claim_type: priority_conflict
        grounds:
          - validations.priority_42
          - validations.priority_71
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / round_marker_safety_outranks_tee_slot_capacity
          rationale: "That §1.8 instance violates both rules at once and pins ERR_INVALID_MARKER as the answer."

      - name: overlapping_travel_windows_block_the_second_entry
        claim_type: temporal_validation
        grounds:
          - validations.priority_70
          - errors.ERR_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / member_travel_window_blocks_back_to_back_but_not_gapped_entry
          rationale: "That §1.8 instance tests both the blocking overlap and the adjacent-but-gapped case that must be allowed."

      - name: tee_slot_group_capacity_over_a_half_open_window
        claim_type: violation_to_error
        grounds:
          - validations.priority_71
          - errors.ERR_TEE_SLOT_FULL
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tee_slot_half_open_upper_bound_and_group_capacity
          rationale: "That §1.8 instance pins the half-open upper bound and the group-capacity count for the same round_number."

      - name: coach_without_a_granted_unexpired_grant_is_denied
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_75
          - errors.ERR_COACH_ACCESS_DENIED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / published_results_visibility_flips_with_grant_state
          rationale: "That §1.8 instance reads the same results endpoint before and after the grant state changes and asserts ERR_COACH_ACCESS_DENIED on the closed side."

  # =========================================================================
  # §1.9.5  From Table 5 (Endpoints)
  # =========================================================================
  - section: endpoints
    instances:

      - name: ranking_read_of_a_member_with_no_results_is_all_zeros
        claim_type: computed_read
        grounds:
          - endpoints.GET_members_memberId_ranking
          - calculations.member_ranking_points
          - entities.Member.certified_rank_position
        distinguishing_aspect: "With zero entries the computed read returns 0.00 for both variants and 0 for both counts, and certified_rank_position stays null rather than 0 or 1 — an unranked member is absent from the ladder, not last on it."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1 who has entered nothing."
            - "No ranking run has been executed, so Season.ranking_epoch is still 0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
          trigger:
            - { call: "GET /members/${m1_id}/ranking", payload: {}, as: TourAdmin, captures: { div: $.data.age_division, pp: $.data.provisional_ranking_points, pc: $.data.provisional_counted_events, cp: $.data.certified_ranking_points, cc: $.data.certified_counted_events, pos: $.data.certified_rank_position, lre: $.data.last_ranking_epoch, re: $.data.ranking_epoch } }
          assert:
            - "http_status == 200"
            - "${div} == U17"
            - "${pp} == 0.00"
            - "${pc} == 0"
            - "${cp} == 0.00"
            - "${cc} == 0"
            - "${pos} == null"
            - "${lre} == 0"
            - "${re} == 0"

      - name: ranking_run_with_no_finished_entries_bumps_only_the_epoch
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_seasons_seasonId_ranking_runs
          - entities.Season.ranking_epoch
          - entities.Member.last_ranking_epoch
        distinguishing_aspect: "A run over a season with no qualifying entries still increments Season.ranking_epoch to 1 and records last_ranking_as_of_date, but ranked_member_count stays 0 and the member's last_ranking_epoch stays 0 — the epoch is stamped only onto members the run actually ranked."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1 with no entries at all."
            - "The clock is 2026-08-10T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id, e0: $.data.ranking_epoch, r0: $.data.ranked_member_count } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
          trigger:
            - { call: "POST /seasons/${season_id}/ranking-runs", payload: { as_of_date: "2026-08-10" }, as: TourAdmin, captures: { e1: $.data.ranking_epoch, r1: $.data.ranked_member_count, asof: $.data.last_ranking_as_of_date, runat: $.data.last_ranking_run_at } }
            - { call: "GET /members/${m1_id}/ranking", payload: {}, as: TourAdmin, captures: { lre: $.data.last_ranking_epoch, pos: $.data.certified_rank_position, re: $.data.ranking_epoch } }
          assert:
            - "${e0} == 0"
            - "${r0} == 0"
            - "trigger 1: http_status == 200"
            - "${e1} == 1"
            - "${r1} == 0"
            - "${asof} == 2026-08-10"
            - "${runat} == 2026-08-10T00:00:00Z"
            - "${lre} == 0"
            - "${pos} == null"
            - "${re} == 1"
            - "Season.${season_id}.ranking_epoch == 1"

      - name: clock_set_reports_the_instant_it_replaced
        claim_type: action_endpoint
        grounds:
          - endpoints.POST__clock_set_current_utc
        distinguishing_aspect: "The first clock write of the process returns previous_utc equal to the documented process-start default 2026-08-01T00:00:00Z, and the second returns the value the first installed — the endpoint reports the instant it displaced, not the one it installed."
        test_recipe:
          setup:
            - "A freshly started process whose logical clock still holds its default 2026-08-01T00:00:00Z."
            - "No domain rows exist, so nothing can be recomputed as a side effect."
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous, captures: { cur1: $.data.current_utc, prev1: $.data.previous_utc } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-06T12:30:00Z" }, as: Anonymous, captures: { cur2: $.data.current_utc, prev2: $.data.previous_utc } }
          assert:
            - "trigger 1: http_status == 200"
            - "${prev1} == 2026-08-01T00:00:00Z"
            - "${cur1} == 2026-08-10T00:00:00Z"
            - "trigger 2: http_status == 200"
            - "${prev2} == 2026-08-10T00:00:00Z"
            - "${cur2} == 2026-09-06T12:30:00Z"

      - name: second_access_request_supersedes_only_the_same_coachs_grant
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_coach_access_grants
          - state_machines.CoachAccessGrant.REQUESTED_to_SUPERSEDED
          - concurrency_rules.coach_access_grant_on_member
        distinguishing_aspect: "coach-recruit-1's second request moves its own earlier grant to SUPERSEDED while coach-recruit-2's REQUESTED grant on the same member is untouched, and each successful request bumps Member.version by exactly 1, so the third read shows version v1 + 3."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1 with publication_opt_in true."
            - "Member.version is re-read immediately before every optimistic write because each grant request bumps it."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "State University", scope: "RESULTS_ONLY", expected_member_version: "${v1}" }, as: Coach, as_user_id: "coach-recruit-1", captures: { g1_id: $.data.id, g1st: $.data.status } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v2: $.data.version } }
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "Coastal College", scope: "RESULTS_ONLY", expected_member_version: "${v2}" }, as: Coach, as_user_id: "coach-recruit-2", captures: { g2_id: $.data.id } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v3: $.data.version } }
          trigger:
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "State University", scope: "FULL_PROFILE", expected_member_version: "${v3}" }, as: Coach, as_user_id: "coach-recruit-1", captures: { g3_id: $.data.id, g3st: $.data.status } }
            - { call: "GET /coach-access-grants/${g1_id}", payload: {}, as: TourAdmin, captures: { g1after: $.data.status } }
            - { call: "GET /coach-access-grants/${g2_id}", payload: {}, as: TourAdmin, captures: { g2after: $.data.status } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v4: $.data.version } }
          assert:
            - "${g1st} == REQUESTED"
            - "trigger 1: http_status == 201"
            - "${g3st} == REQUESTED"
            - "${g1after} == SUPERSEDED"
            - "${g2after} == REQUESTED"
            - "${v4} == ${v1} + 3"
            - "CoachAccessGrant.${g3_id}.coach_user_id == coach-recruit-1"
            - "CoachAccessGrant.${g3_id}.scope == FULL_PROFILE"
            - "CoachAccessGrant.${g3_id}.expires_at == null"

      - name: withdraw_after_the_deadline_forfeits_and_charges_a_late_withdrawal
        claim_type: conditional_action
        grounds:
          - endpoints.POST_entries_entryId_withdraw
          - state_machines.Entry.ACCEPTED_to_FORFEITED
          - entities.Member.late_withdrawal_count
        distinguishing_aspect: "Past withdrawal_deadline_at the very same endpoint yields FORFEITED with fee_status FORFEITED_FEE, refunded_cents 0 and Member.late_withdrawal_count 1 — the paid 25000 is kept and the entry is never WITHDRAWN, which is the pre-deadline outcome."
        test_recipe:
          setup:
            - "One season, one VERIFIED U17 member m1, one REGIONAL U17 tournament t1 with entry_fee_cents 25000 and withdrawal_deadline_at 2026-09-05T00:00:00Z."
            - "m1's entry is ACCEPTED by set-field and then paid in full, so fee_status is PAID and amount_paid_cents is 25000."
            - "The clock is advanced to 2026-09-06T00:00:00Z, one day past the withdrawal deadline."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
