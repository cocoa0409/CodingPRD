  - rule_id: resource_temporal_overlap
    instances:
      - name: closing_batch_half_open_window_adjacency_allowed
        grounds:
          - validations[priority=38]
          - entities.ClosingBatch.fields.window_start_at
          - entities.ClosingBatch.fields.window_end_at
          - entities.ClosingBatch.fields.batch_sequence_no
        distinguishing_aspect: |
          The interval semantics under test are HALF-OPEN [start, end) with NO buffer and an
          aggregate capacity of one batch per instant: a new batch whose window_start_at equals a
          sibling's window_end_at must be ACCEPTED (the shared instant belongs only to the later
          batch), while a window that reaches one second back into the sibling must be rejected.
          The shared resource is the ConversionProject and the reserved quantity is calendar time,
          contrasted with the CLOSED-interval, cooldown-buffered, depth-capped remediation geometry
          of the sibling instance.
        test_recipe:
          setup:
            - "A single ConversionProject; no units, agreements or statement are needed because the
               overlap rule reads only sibling ClosingBatch windows on the project."
            - "One existing ClosingBatch A with batch_sequence_no 1 and half-open window
               [2026-08-16T00:00:00Z, 2026-09-16T00:00:00Z) in status DRAFT, which is one of the
               statuses the overlap rule considers occupied."
            - "Logical clock rests at the startup default 2026-08-01T00:00:00Z; the rule is pure
               interval geometry and does not consult the clock."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "60 Ionic Place, Lynn MA", year_built: 1961, total_unit_count: 4, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              captures: { proj_id: $.data.id }
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 1, window_start_at: "2026-08-16T00:00:00Z", window_end_at: "2026-09-16T00:00:00Z", min_presale_threshold_pct: "50.00", min_absolute_unit_count: 1 }
              as: ConverterSponsor
              captures: { cb_a_id: $.data.id }
          trigger:
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 2, window_start_at: "2026-09-16T00:00:00Z", window_end_at: "2026-10-16T00:00:00Z", min_presale_threshold_pct: "50.00", min_absolute_unit_count: 1 }
              as: ConverterSponsor
              captures: { cb_b_id: $.data.id }
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 3, window_start_at: "2026-09-15T23:59:59Z", window_end_at: "2026-09-16T00:00:00Z", min_presale_threshold_pct: "50.00", min_absolute_unit_count: 1 }
              as: ConverterSponsor
              captures: { err_overlap: $.data.error_id }
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 4, window_start_at: "2026-07-16T00:00:00Z", window_end_at: "2026-08-16T00:00:00Z", min_presale_threshold_pct: "50.00", min_absolute_unit_count: 1 }
              as: ConverterSponsor
              captures: { cb_c_id: $.data.id }
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 5, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-02T00:00:00Z", min_presale_threshold_pct: "50.00", min_absolute_unit_count: 1 }
              as: ConverterSponsor
              captures: { err_nested: $.data.error_id }
            - call: "POST /conversion-projects/${proj_id}/closing-batches"
              payload: { batch_sequence_no: 6, window_start_at: "2026-11-16T00:00:00Z", window_end_at: "2026-11-16T00:00:00Z", min_presale_threshold_pct: "50.00", min_absolute_unit_count: 1 }
              as: ConverterSponsor
              captures: { err_zero: $.data.error_id }
            - call: "GET /conversion-projects/${proj_id}/closing-batches"
              payload: {}
              as: ConverterSponsor
          assert:
            - "probe 1 (ADJACENT AFTER, new_start == other_end - the discriminating probe): HTTP 201, because the overlap test new_start < other_end AND other_start < new_end evaluates 2026-09-16T00:00:00Z < 2026-09-16T00:00:00Z == false; a closed-interval or buffered implementation wrongly returns 409 here"
            - "probe 1: ClosingBatch.${cb_b_id}.status == DRAFT and ClosingBatch.${cb_b_id}.batch_sequence_no == 2 and ClosingBatch.${cb_b_id}.window_start_at == 2026-09-16T00:00:00Z"
            - "probe 1: ClosingBatch.${cb_b_id}.presale_pct == 0.00 and ClosingBatch.${cb_b_id}.assigned_agreement_count == 0 and ClosingBatch.${cb_b_id}.version == 1"
            - "probe 2 (ONE SECOND OF OVERLAP): HTTP 409 and ${err_overlap} == ERR_BATCH_WINDOW_OVERLAP  # priority 38; 2026-09-15T23:59:59Z < 2026-09-16T00:00:00Z AND 2026-08-16T00:00:00Z < 2026-09-16T00:00:00Z, so one shared second is enough and there is no tolerance"
            - "probe 3 (ADJACENT BEFORE, new_end == other_start): HTTP 201 with ClosingBatch.${cb_c_id}.batch_sequence_no == 4 - symmetric to probe 1, since other_start < new_end is false, so adjacency is allowed at BOTH ends and no trailing buffer exists in either direction"
            - "probe 4 (FULLY CONTAINED): HTTP 409 and ${err_nested} == ERR_BATCH_WINDOW_OVERLAP - containment is overlap, and with an aggregate capacity of one batch per instant a nested window can never be admitted"
            - "probe 5 (ZERO-LENGTH at a free instant): HTTP 409 and ${err_zero} == ERR_BATCH_WINDOW_OVERLAP - the same rule requires window_end_at > window_start_at, so an empty half-open interval is rejected on geometry alone even though it collides with nothing"
            - "end state: GET /conversion-projects/${proj_id}/closing-batches returns exactly THREE batches, with batch_sequence_no 1, 2 and 4"
            - "end state: the three windows are [2026-07-16T00:00:00Z, 2026-08-16T00:00:00Z), [2026-08-16T00:00:00Z, 2026-09-16T00:00:00Z) and [2026-09-16T00:00:00Z, 2026-10-16T00:00:00Z) - a gapless, non-overlapping chain of three adjacent windows, each in status DRAFT"
            - "end state: no ClosingBatch with batch_sequence_no 3, 5 or 6 exists, so the rejected probes left no partial rows behind"

      - name: remediation_closed_interval_cooldown_and_depth_cap
        grounds:
          - validations[priority=39]
          - validations[priority=40]
          - calculations.warranty_charge_and_window
          - entities.ConversionProject.fields.max_overlapping_remediations
          - state_machines.WarrantyClaim.TRIAGED_ADMISSIBLE_to_REMEDIATION_SCHEDULED
        distinguishing_aspect: |
          The interval semantics under test are CLOSED [start, end] windows with a trailing
          259200-second cooldown on the SAME MajorComponent, plus a project-wide aggregate depth cap
          of max_overlapping_remediations 1 that counts an instant shared by one window's end and
          another's start in BOTH windows - so a gap of exactly the cooldown still collides and a
          non-colliding window on a DIFFERENT component can still be refused for depth. Both
          differences (closed vs half-open, buffered and depth-capped vs neither) separate this from
          the ClosingBatch window instance.
        test_recipe:
          setup:
            - "ConversionProject created with max_overlapping_remediations 1 and a RECORDED
               DeclarationPackage, so warranty_start_at is 2026-08-01T00:00:00Z."
