          setup:
            - "CareManager Dana (hourly_rate_cents 22500), supervisor Iris, billing admin, Client Wilma (billing_increment_min 15)."
            - "Two APPROVED CARE_COORDINATION entries: T1 on 2026-08-10 10:00:00Z..11:00:00Z and T2 on 2026-08-20 10:00:00Z..11:00:00Z."
            - "Invoice A over 2026-08-01..2026-08-15, left in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Wilma Achebe", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, retainer_floor_cents: 0 }
