  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: care_level_tier_boundary_exactly_30_points
        grounds:
          - calculations.care_level_assignment
          - entities.Assessment.fields.care_level
        distinguishing_aspect: |
          Numeric threshold metric on the assessments endpoint: care_points_total exactly 30 lands
          in LEVEL_2 (>=, not >), while 29 lands in LEVEL_1. Tests the >= boundary precisely.
        test_recipe:
          setup:
            - "A facility and two residents."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Boundary", state_code: "CA", license_number: "CA-040", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Exactly Thirty", date_of_birth: "1940-01-01" }
              as: Registrar
              captures: { res30_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Twenty Nine", date_of_birth: "1940-02-02" }
              as: Registrar
              captures: { res29_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { resident_id: "${res30_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { a30_id: $.data.id }
            - call: "POST /assessments"
              payload: { resident_id: "${res29_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 1, adl_transferring: 2, adl_eating: 2, cognition_score: 1, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { a29_id: $.data.id }
          assert:
            - "Assessment.${a30_id}.care_points_total == 30 AND Assessment.${a30_id}.care_level == LEVEL_2"
            - "Assessment.${a29_id}.care_points_total == 29 AND Assessment.${a29_id}.care_level == LEVEL_1"

      - name: occupancy_rate_empty_bed_set_returns_zero
        grounds:
          - calculations.facility_occupancy
          - entities.Facility.fields.occupancy_rate_bps
          - entities.Facility.fields.bed_count
        distinguishing_aspect: |
          A different metric (empty-collection edge) reached through a different endpoint
          (GET /facilities/{id}): a facility with zero non-RETIRED units has bed_count 0 and
          occupancy_rate_bps 0 (no divide-by-zero), distinct from the numeric tier boundary above.
        test_recipe:
          setup:
            - "A facility with one unit, then that unit retired so bed_count returns to 0."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Empty", state_code: "CA", license_number: "CA-041", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "501", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units/${unit_id}/retire"
              payload: {}
              as: Registrar
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Staff
          assert:
            - "Facility.${fac_id}.bed_count == 0"
            - "Facility.${fac_id}.occupied_bed_count == 0"
            - "Facility.${fac_id}.occupancy_rate_bps == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: admit_depends_on_unit_reserved_and_facility_active
        grounds:
          - state_machines.Resident.ASSESSED_to_ADMITTED
          - entities.Unit.fields.status
          - entities.Facility.fields.license_status
        distinguishing_aspect: |
          Entity pair Resident<-Unit/Facility: Resident ASSESSED -> ADMITTED is only valid when the
          bound Unit.status == RESERVED and Facility.license_status != SUSPENDED. Tests the positive
          path where both dependencies are satisfied.
        test_recipe:
          setup:
            - "ACTIVE facility, AVAILABLE unit, ASSESSED resident with an ACTIVE agreement reserving that unit."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "CrossA", state_code: "CA", license_number: "CA-050", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "601", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Cross Resident", date_of_birth: "1938-03-03" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 1, adl_dressing: 1, adl_toileting: 1, adl_transferring: 1, adl_eating: 1, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-06-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
          trigger:
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
          assert:
            - "Resident.${res_id}.status == ADMITTED AND assigned_unit_id == ${unit_id}"
            - "Unit.${unit_id}.status == OCCUPIED AND current_resident_id == ${res_id}"
            - "Facility.${fac_id}.occupied_bed_count == 1 AND occupancy_rate_bps == 10000"

      - name: care_plan_activate_depends_on_assessment_finalized_and_resident_state
        grounds:
          - state_machines.CarePlan.DRAFT_to_ACTIVE
          - entities.Assessment.fields.status
          - entities.Resident.fields.status
        distinguishing_aspect: |
          A different entity pair CarePlan<-Assessment/Resident: CarePlan DRAFT -> ACTIVE is only
          valid when source_assessment.status == FINALIZED and Resident.status IN {ASSESSED, ADMITTED}.
          Tests the positive path where both are satisfied.
        test_recipe:
          setup:
            - "A resident with a FINALIZED assessment (so status ASSESSED) and a DRAFT care plan built from it."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Crossb", state_code: "CA", license_number: "CA-051", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Plan Patient", date_of_birth: "1939-04-04" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /care-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", adl_support_items: [{ task: "bathing", frequency_per_day: 1 }] }
              as: ClinicalDirector
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /care-plans/${cp_id}/activate"
              payload: {}
              as: ClinicalDirector
          assert:
            - "CarePlan.${cp_id}.status == ACTIVE"
            - "Resident.${res_id}.status == ASSESSED AND Assessment.${asmt_id}.status == FINALIZED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bed_single_occupancy_overlap_capacity_one
        grounds:
          - concurrency_rules[agreement-activate-stale-unit]
          - validations[priority=11]
          - errors[ERR_BED_NOT_AVAILABLE]
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Interval semantics: a Unit is a capacity-1 continuous resource hold — once RESERVED/OCCUPIED
          it overlaps any further reservation, so a second agreement's activate against the same unit is
          rejected with ERR_BED_NOT_AVAILABLE. This is a single-occupancy collision on the Unit entity.
        test_recipe:
          setup:
            - "Facility with one unit already RESERVED by an activated agreement for resident A; a DRAFT agreement for resident B on the same unit."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "OverlapBed", state_code: "CA", license_number: "CA-060", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "701", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Bed A", date_of_birth: "1936-05-05" }
              as: Registrar
              captures: { resa_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Bed B", date_of_birth: "1937-06-06" }
              as: Registrar
              captures: { resb_id: $.data.id }
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${resa_id}", unit_id: "${unit_id}", move_in_date: "2026-07-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agra_id: $.data.id }
            - call: "POST /move-in-agreements/${agra_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${resb_id}", unit_id: "${unit_id}", move_in_date: "2026-07-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agrb_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: Staff
              captures: { unit_v1: $.data.version }
          trigger:
            - call: "POST /move-in-agreements/${agrb_id}/activate"
              payload: { expected_unit_version: "${unit_v1}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response.data.error_id == ERR_BED_NOT_AVAILABLE"
            - "Unit.${unit_id}.status == RESERVED AND current_resident_id == ${resa_id}"

      - name: billing_period_month_bucket_overlap
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_STATEMENT_PERIOD]
          - entities.BillingStatement.fields.period_month
        distinguishing_aspect: |
          Different interval semantics from the bed hold: BillingStatement collision is a discrete
          whole-calendar-month bucket — at most one non-VOID statement per (resident, year, month).
          A second statement for the same month is rejected with ERR_DUPLICATE_STATEMENT_PERIOD, on a
          different entity (BillingStatement) than the Unit.
        test_recipe:
          setup:
            - "An ADMITTED resident with one DRAFT statement for 2026-08; a second create for the same period attempted."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "OverlapBill", state_code: "CA", license_number: "CA-061", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Bill Month", date_of_birth: "1938-07-07" }
              as: Registrar
              captures: { res_id: $.data.id }
            - call: "POST /billing-statements"
              payload: { resident_id: "${res_id}", period_year: 2026, period_month: 8, is_first_statement: false }
              as: BillingClerk
              captures: { stmt1_id: $.data.id }
          trigger:
            - call: "POST /billing-statements"
              payload: { resident_id: "${res_id}", period_year: 2026, period_month: 8, is_first_statement: false }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response.data.error_id == ERR_DUPLICATE_STATEMENT_PERIOD"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bed_count_conserved_activate_then_cancel
        grounds:
          - state_machines.MoveInAgreement.DRAFT_to_ACTIVE
          - state_machines.MoveInAgreement.DRAFT_to_CANCELLED
          - calculations.facility_occupancy
          - entities.Facility.fields.occupied_bed_count
        distinguishing_aspect: |
          Conserved quantity = bed availability. Activating an agreement reserves the bed
          (Unit AVAILABLE -> RESERVED) and cancelling it releases the bed (RESERVED -> AVAILABLE);
          after the forward+compensating pair, Unit.status == AVAILABLE, current_resident_id == null,
          and Facility.occupied_bed_count == 0 / occupancy_rate_bps == 0 — unchanged from the start.
        test_recipe:
          setup:
            - "Facility with one AVAILABLE unit; a resident with a DRAFT agreement on it."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "ConserveBed", state_code: "CA", license_number: "CA-070", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "801", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 400000 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Conserve Carl", date_of_birth: "1939-08-08" }
              as: Registrar
              captures: { res_id: $.data.id }
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-09-01", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
          trigger:
            - call: "POST /move-in-agreements/${agr_id}/cancel"
              payload: {}
              as: Registrar
          assert:
            - "MoveInAgreement.${agr_id}.status == CANCELLED"
            - "Unit.${unit_id}.status == AVAILABLE AND current_resident_id == null"
            - "Facility.${fac_id}.occupied_bed_count == 0 AND occupancy_rate_bps == 0 AND bed_count == 1"

      - name: open_balance_conserved_issue_then_void
        grounds:
          - state_machines.BillingStatement.DRAFT_to_ISSUED
          - state_machines.BillingStatement.ISSUED_to_VOID
          - entities.Resident.fields.open_balance_cents
          - entities.BillingStatement.fields.total_charge_cents
        distinguishing_aspect: |
          A different conserved quantity = money (Resident.open_balance_cents). Issuing a statement
          raises open_balance_cents by total_charge_cents (446500) and voiding it lowers it back;
          after the forward+compensating pair Resident.open_balance_cents == 0 — unchanged from start.
        test_recipe:
          setup:
            - "ADMITTED resident LEVEL_2 cp 30, ACTIVE agreement base 401500, full-month statement 2026-10 (total 446500) issued."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "ConserveBal", state_code: "CA", license_number: "CA-071", care_point_rate_cents: 1500 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { unit_number: "901", wing: "ASSISTED_LIVING", monthly_base_rent_cents: 401500 }
              as: Registrar
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Balance Bea", date_of_birth: "1937-09-09" }
              as: Registrar
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 2, adl_dressing: 2, adl_toileting: 2, adl_transferring: 2, adl_eating: 2, cognition_score: 0, behavior_flags: 0 }
              as: ClinicalDirector
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: { expected_resident_version: "${res_v0}" }
              as: ClinicalDirector
            - call: "POST /move-in-agreements"
              payload: { resident_id: "${res_id}", unit_id: "${unit_id}", move_in_date: "2026-09-15", community_fee_cents: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /move-in-agreements/${agr_id}/activate"
              payload: { expected_unit_version: "${unit_v0}" }
              as: Registrar
            - call: "POST /residents/${res_id}/admit"
              payload: {}
              as: Registrar
            - call: "POST /billing-statements"
              payload: { resident_id: "${res_id}", period_year: 2026, period_month: 10, is_first_statement: false }
              as: BillingClerk
              captures: { stmt_id: $.data.id }
            - call: "POST /billing-statements/${stmt_id}/issue"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "GET /residents/${res_id}"
              payload: {}
              as: Staff
            - call: "POST /billing-statements/${stmt_id}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "After issue (before void): BillingStatement.${stmt_id}.total_charge_cents == 446500 AND Resident.${res_id}.open_balance_cents == 446500"
            - "After void: BillingStatement.${stmt_id}.status == VOID AND Resident.${res_id}.open_balance_cents == 0"
