# =============================================================================
# Task 1572: §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: enumerates the testable claims of SCAFFOLD.yaml §1.1–§1.7 that
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already cover. Zero stubs —
# every instance carries a full test_recipe replayable from empty-DB using only
# §1.5 endpoints. Sections/claim_types follow references/claim-extraction-guide.md.
#
# Common fixture constants (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   CleanStandard rows: ROUTINE (base 45, mult 15000, atp 250)
#                       ISOLATION (base 60, mult 15000, atp 150)
#                       TERMINAL (base 90, mult 20000, atp 100)
#   SupplyItem rows:    DISINFECTANT (on_hand 100, threshold 10)
#                       PPE_PACK (50, 8), CLOTH (200, 20), SEALANT (20, 2)
#   Logical clock default 2026-08-01T00:00:00Z; instances set 08:00 first.
#   BOGUS = 00000000-0000-0000-0000-000000000000 (never created).
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities (Table 1 claims: creation, defaults, required fields,
  # computed/system fields, type constraints, immutability, not-found, FK
  # integrity for the flat topology)
  # ===========================================================================
  - section: entities
    instances:
      - name: not_found_family_covers_all_twelve_resources
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_BED_NOT_FOUND]
          - errors[ERR_CLEAN_REQUEST_NOT_FOUND]
          - errors[ERR_PLACEMENT_DEMAND_NOT_FOUND]
          - errors[ERR_STAFF_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
          - errors[ERR_SUPPLY_ITEM_NOT_FOUND]
          - errors[ERR_OUTBREAK_NOT_FOUND]
          - errors[ERR_NOTIFICATION_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_SNAPSHOT_NOT_FOUND]
          - errors[ERR_STANDARD_NOT_FOUND]
        distinguishing_aspect: |
          Every §1.6 404 error_id is reachable on an empty database by reading
          a never-created id (or, for CleanStandard, an uncreated clean_type
          path value) — twelve resources, twelve distinct error ids.
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned at 08:00 for determinism"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
          trigger:
            - { call: "GET /evs/units/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_unit: $.data.error_id } }
            - { call: "GET /evs/beds/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_bed: $.data.error_id } }
            - { call: "GET /evs/clean-requests/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_req: $.data.error_id } }
            - { call: "GET /evs/placement-demands/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_dem: $.data.error_id } }
            - { call: "GET /evs/staff/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_staff: $.data.error_id } }
            - { call: "GET /evs/quality-audits/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_aud: $.data.error_id } }
            - { call: "GET /evs/supply-items/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_sup: $.data.error_id } }
            - { call: "GET /evs/outbreak-events/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_out: $.data.error_id } }
            - { call: "GET /evs/bed-ready-notifications/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_not: $.data.error_id } }
            - { call: "GET /evs/maintenance-windows/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_win: $.data.error_id } }
            - { call: "GET /evs/turnaround-snapshots/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_snap: $.data.error_id } }
            - { call: "GET /evs/clean-standards/ROUTINE", payload: {}, as: Any, captures: { e_std: $.data.error_id } }
          assert:
            - "e_unit == ERR_UNIT_NOT_FOUND (404)"
            - "e_bed == ERR_BED_NOT_FOUND (404)"
            - "e_req == ERR_CLEAN_REQUEST_NOT_FOUND (404)"
            - "e_dem == ERR_PLACEMENT_DEMAND_NOT_FOUND (404)"
            - "e_staff == ERR_STAFF_NOT_FOUND (404)"
            - "e_aud == ERR_AUDIT_NOT_FOUND (404)"
            - "e_sup == ERR_SUPPLY_ITEM_NOT_FOUND (404)"
            - "e_out == ERR_OUTBREAK_NOT_FOUND (404)"
            - "e_not == ERR_NOTIFICATION_NOT_FOUND (404)"
            - "e_win == ERR_WINDOW_NOT_FOUND (404)"
            - "e_snap == ERR_SNAPSHOT_NOT_FOUND (404)"
            - "e_std == ERR_STANDARD_NOT_FOUND (404; clean_type path value has no row)"

      - name: create_with_unknown_body_fk_returns_parent_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - entities.Bed.fields.unit_id
          - entities.CleanRequest.fields.bed_id
          - entities.PlacementDemand.fields.unit_id
          - entities.MaintenanceWindow.fields.bed_id
          - entities.OutbreakEvent.fields.unit_id
          - entities.QualityAudit.fields.clean_request_id
        distinguishing_aspect: |
          Flat-topology FK integrity: body-supplied foreign keys are validated
          at priority 4 — each creation naming a non-existent parent id fails
          with the parent's 404 error, never a 500 or an orphaned row.
        test_recipe:
          setup:
            - "Clock 08:00; ROUTINE standard exists (so only the bed FK fails on clean-request creation); auditor A1 (AUDIT capability) exists for the audit call"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
          trigger:
            - { call: "POST /evs/beds", payload: { unit_id: "00000000-0000-0000-0000-000000000000", bed_code: "B1", bed_kind: "STANDARD" }, as: EVSAdministrator, captures: { e1: $.data.error_id } }
            - { call: "POST /evs/clean-requests", payload: { bed_id: "00000000-0000-0000-0000-000000000000", clean_type: "ROUTINE" }, as: EVSDispatcher, captures: { e2: $.data.error_id } }
            - { call: "POST /evs/placement-demands", payload: { unit_id: "00000000-0000-0000-0000-000000000000", required_bed_kind: "STANDARD", urgency_tier: "URGENT", needed_by: "2026-08-01T18:00:00Z" }, as: BedPlacementCoordinator, captures: { e3: $.data.error_id } }
            - { call: "POST /evs/maintenance-windows", payload: { bed_id: "00000000-0000-0000-0000-000000000000", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z" }, as: EVSAdministrator, captures: { e4: $.data.error_id } }
            - { call: "POST /evs/outbreak-events", payload: { unit_id: "00000000-0000-0000-0000-000000000000", pathogen_class: "MRSA" }, as: InfectionPreventionist, captures: { e5: $.data.error_id } }
            - { call: "POST /evs/quality-audits", payload: { clean_request_id: "00000000-0000-0000-0000-000000000000", audit_method: "ATP_SWAB", rlu_reading: 100 }, as: QualityAuditor, as_user_id: "${a1}", captures: { e6: $.data.error_id } }
          assert:
            - "e1 == ERR_UNIT_NOT_FOUND (404)"
            - "e2 == ERR_BED_NOT_FOUND (404)"
            - "e3 == ERR_UNIT_NOT_FOUND (404)"
            - "e4 == ERR_BED_NOT_FOUND (404)"
            - "e5 == ERR_UNIT_NOT_FOUND (404)"
            - "e6 == ERR_CLEAN_REQUEST_NOT_FOUND (404)"
            - "GET /evs/beds and GET /evs/clean-requests remain empty (no partial writes)"

      - name: unit_create_applies_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Unit.fields.outbreak_posture
          - entities.Unit.fields.ops_run_index
        distinguishing_aspect: |
          A freshly created Unit carries the declared defaults — outbreak_posture
          NORMAL, ops_run_index 0 — plus system minted id, version 1, and
          created_at/updated_at stamped from the logical clock (08:00), not wall time.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
          trigger:
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id, u_post: $.data.outbreak_posture, u_idx: $.data.ops_run_index, u_ver: $.data.version, u_created: $.data.created_at }
          assert:
            - "u_post == NORMAL (declared default)"
            - "u_idx == 0 AND u_ver == 1"
            - "u_created == 2026-08-01T08:00:00Z (logical clock, not wall time)"
            - "GET /evs/units/${u1} returns identical field values (updated_at == created_at before any mutation)"

      - name: staff_create_required_fields_and_enum_membership
        claim_type: required_fields
        grounds:
          - entities.StaffMember.fields.capabilities
          - entities.StaffMember.fields.certifications
          - entities.StaffMember.fields.shift_status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          capabilities is a required input (missing -> 400) constrained to the
          [CLEAN, AUDIT] enum set (unknown member -> 400); certifications
          defaults to [] and shift_status initializes OFF_SHIFT with zeroed counters.
        test_recipe:
          setup:
            - "Clock 08:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
          trigger:
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One" }
              as: EVSAdministrator
              captures: { e_missing: $.data.error_id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T2", display_name: "Tech Two", capabilities: ["CLEAN", "SCRUB"] }
              as: EVSAdministrator
              captures: { e_enum: $.data.error_id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T3", display_name: "Tech Three", capabilities: ["CLEAN"] }
              as: EVSAdministrator
              captures: { t3: $.data.id }
          assert:
            - "e_missing == ERR_INVALID_REQUEST (400): capabilities omitted"
            - "e_enum == ERR_INVALID_REQUEST (400): SCRUB is not a capability enum member"
            - "StaffMember.${t3}.certifications == [] (declared default) AND shift_status == OFF_SHIFT (initial state)"
            - "StaffMember.${t3}.active_clean_count == 0 AND completed_clean_count == 0 AND qa_fail_count == 0 AND verified_credit_total == 0 AND shift_seconds_today == 0 (counters zeroed)"
            - "StaffMember.${t3}.stat_eligible == true (completed_clean_count == 0 clause)"
            - "GET /evs/staff lists exactly 1 row (only the valid create persisted)"

      - name: supply_item_create_enum_range_and_opening_ledger
        claim_type: type_constraints
        grounds:
          - entities.SupplyItem.fields.item_code
          - entities.SupplyItem.fields.reorder_threshold
          - entities.SupplyItem.fields.on_hand_quantity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          item_code is a closed enum (BLEACH -> 400), reorder_threshold must be
          >= 0 (-1 -> 400); a valid create writes exactly one RESTOCK ledger
          entry and derives on_hand from it, with stock_status STOCKED when
          on_hand (50) exceeds threshold (10).
        test_recipe:
          setup:
            - "Clock 08:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
          trigger:
            - call: "POST /evs/supply-items"
              payload: { item_code: "BLEACH", display_name: "Bleach", initial_on_hand: 10, reorder_threshold: 2 }
              as: EVSAdministrator
              captures: { e_enum: $.data.error_id }
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 10, reorder_threshold: -1 }
              as: EVSAdministrator
              captures: { e_range: $.data.error_id }
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 50, reorder_threshold: 10 }
              as: EVSAdministrator
              captures: { si: $.data.id }
            - call: "GET /evs/supply-ledger-entries"
              payload: { supply_item_id: "${si}" }
              as: Any
              captures: { le_type: "$.data[0].entry_type", le_delta: "$.data[0].quantity_delta" }
          assert:
            - "e_enum == ERR_INVALID_REQUEST (400): unknown item_code enum member"
            - "e_range == ERR_INVALID_REQUEST (400): reorder_threshold < 0"
            - "SupplyItem.${si}.on_hand_quantity == 50 (ledger-derived, equals opening RESTOCK)"
            - "SupplyItem.${si}.reserved_quantity == 0 AND stock_status == STOCKED (50 > 10)"
            - "le_type == RESTOCK AND le_delta == 50 AND the entry's clean_request_id == null"
            - "GET /evs/supply-items returns exactly 1 row (rejected creates persisted nothing)"

      - name: outbreak_create_defaults_declared_state
        claim_type: defaults
        grounds:
          - entities.OutbreakEvent.fields.status
          - entities.OutbreakEvent.fields.declared_reason
          - entities.OutbreakEvent.fields.activated_at
        distinguishing_aspect: |
          A declared outbreak starts in DECLARED with declared_reason null when
          omitted, activated_at/lifted_at null, and the unit posture untouched
          (NORMAL) until the separate activate transition runs.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /evs/outbreak-events"
              payload: { unit_id: "${u1}", pathogen_class: "C_DIFF" }
              as: InfectionPreventionist
              captures: { ob: $.data.id }
          assert:
            - "OutbreakEvent.${ob}.status == DECLARED (initial state)"
            - "OutbreakEvent.${ob}.declared_reason == null (default) AND activated_at == null AND lifted_at == null"
            - "OutbreakEvent.${ob}.version == 1"
            - "Unit.${u1}.outbreak_posture == NORMAL (declaration alone does not escalate posture)"

      - name: supply_ledger_entry_append_only_immutable
        claim_type: immutability
        grounds:
          - entities.SupplyLedgerEntry
          - entities.SupplyLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          SupplyLedgerEntry is common_fields:false — the GET response carries
          id and created_at but NO version or updated_at keys, and §1.5 declares
          no update/delete endpoint for it (append-only audit trail).
        test_recipe:
          setup:
            - "Clock 08:00; one supply item with opening stock 25"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/supply-items"
              payload: { item_code: "PPE_PACK", display_name: "PPE packs", initial_on_hand: 25, reorder_threshold: 8 }
              as: EVSAdministrator
              captures: { si: $.data.id }
          trigger:
            - call: "GET /evs/supply-ledger-entries"
              payload: { supply_item_id: "${si}" }
              as: Any
              captures: { le: "$.data[0].id" }
            - call: "GET /evs/supply-ledger-entries/${le}"
              payload: {}
              as: Any
          assert:
            - "SupplyLedgerEntry.${le}.entry_type == RESTOCK AND quantity_delta == 25 AND clean_request_id == null"
            - "SupplyLedgerEntry.${le} response contains NO version key and NO updated_at key (common_fields: false)"
            - "SupplyLedgerEntry.${le}.created_at == 2026-08-01T08:00:00Z"
            - "No PUT/PATCH/DELETE /evs/supply-ledger-entries endpoint exists in §1.5 (append-only by construction)"

  # ===========================================================================
  # Section: state_machines (Table 2 claims: valid/invalid transitions,
  # precondition enforcement, side effects, initial state, terminal lockdown,
  # idempotency)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: bed_discharge_requires_occupied_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Bed.OCCUPIED_to_VACANT_DIRTY
          - errors[ERR_BED_NOT_OCCUPIED]
        distinguishing_aspect: |
          discharge is defined only from OCCUPIED; calling it on a fresh
          VACANT_DIRTY bed fails with ERR_BED_NOT_OCCUPIED and auto-creates
          no CleanRequest.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; bed B1 freshly created (bed_status VACANT_DIRTY, never occupied)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /evs/beds/${b1}/discharge"
              payload: {}
              as: BedPlacementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BED_NOT_OCCUPIED (409)"
            - "Bed.${b1}.bed_status == VACANT_DIRTY (unchanged)"
            - "GET /evs/clean-requests?bed_id=${b1} returns 0 rows (no auto-create on rejected discharge)"

      - name: bed_admit_and_mark_soiled_require_ready_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Bed.READY_to_OCCUPIED
          - state_machines.Bed.READY_to_VACANT_DIRTY
          - errors[ERR_BED_NOT_READY]
        distinguishing_aspect: |
          Both READY-gated triggers (admit, mark-soiled) reject a VACANT_DIRTY
          bed with ERR_BED_NOT_READY; neither produces a notification,
          a demand mutation, or a new CleanRequest.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; bed B1 VACANT_DIRTY"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /evs/beds/${b1}/admit"
              payload: {}
              as: BedPlacementCoordinator
              captures: { err_admit: $.data.error_id }
            - call: "POST /evs/beds/${b1}/mark-soiled"
              payload: {}
              as: BedPlacementCoordinator
              captures: { err_soil: $.data.error_id }
          assert:
            - "err_admit == ERR_BED_NOT_READY (409)"
            - "err_soil == ERR_BED_NOT_READY (409)"
            - "Bed.${b1}.bed_status == VACANT_DIRTY after both rejections"
            - "GET /evs/bed-ready-notifications?bed_id=${b1} returns 0 rows"
            - "GET /evs/clean-requests?bed_id=${b1} returns 0 rows"

      - name: bed_out_of_service_blocks_admit_and_discharge
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Bed.VACANT_DIRTY_to_OUT_OF_SERVICE (list form [VACANT_DIRTY, READY])
          - errors[ERR_BED_NOT_READY]
          - errors[ERR_BED_NOT_OCCUPIED]
        distinguishing_aspect: |
          An OUT_OF_SERVICE bed is closed to both patient-flow triggers:
          admit fails ERR_BED_NOT_READY and discharge fails
          ERR_BED_NOT_OCCUPIED — maintenance state, not cleanliness state,
          gates the bed.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1 (1 bed -> maintenance cap max(1, floor(0.20*1)) == 1); bed B1 VACANT_DIRTY with no open requests; window W [10:00, 11:00) activated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/maintenance-windows"
              payload: { bed_id: "${b1}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z", reason: "hvac" }
              as: EVSAdministrator
              captures: { w1: $.data.id }
            - call: "POST /evs/maintenance-windows/${w1}/activate"
              payload: {}
              as: EVSAdministrator
          trigger:
            - call: "POST /evs/beds/${b1}/admit"
              payload: {}
              as: BedPlacementCoordinator
              captures: { err_admit: $.data.error_id }
            - call: "POST /evs/beds/${b1}/discharge"
              payload: {}
              as: BedPlacementCoordinator
              captures: { err_dis: $.data.error_id }
          assert:
            - "Bed.${b1}.bed_status == OUT_OF_SERVICE (activation side effect)"
            - "err_admit == ERR_BED_NOT_READY (409)"
            - "err_dis == ERR_BED_NOT_OCCUPIED (409)"
            - "MaintenanceWindow.${w1}.status == ACTIVE (unchanged by the rejected bed calls)"

      - name: clean_request_terminal_states_reject_all_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CleanRequest.terminal_states
          - errors[ERR_REQUEST_ALREADY_TERMINAL]
        distinguishing_aspect: |
          VERIFIED and CANCELLED are terminal: assign and cancel on a VERIFIED
          request, and assign and a second cancel on a CANCELLED request, all
          fail with ERR_REQUEST_ALREADY_TERMINAL — the terminal-family error
          that takes precedence over every wrong-state error.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1, ROUTINE standard, DISINFECTANT 100 / CLOTH 200"
            - "Tech T1 (CLEAN) ON_SHIFT; auditor A1; beds B1, B2"
            - "R1 on B1 run assign -> start -> complete (08:45) -> PASS audit => VERIFIED"
            - "R2 on B2 created then cancelled from QUEUED => CANCELLED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
