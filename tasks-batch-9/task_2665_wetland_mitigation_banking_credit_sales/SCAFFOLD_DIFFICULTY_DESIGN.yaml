          setup:
            - "Sponsor with a DRAFT bank, a DRAFT prospectus and a SUBMITTED work plan (the approval branch requires a work plan in SUBMITTED or APPROVED)."
            - "Three seated IRT members: USACE (veto authority), EPA and STATE_DEQ (no veto)."
            - "Round 1 votes: CONCUR from EPA, OBJECT from STATE_DEQ (NOT a veto, because only USACE holds veto authority), ABSTAIN from USACE."
