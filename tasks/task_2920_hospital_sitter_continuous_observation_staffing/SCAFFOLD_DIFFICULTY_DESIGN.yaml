            - call: "POST /observation/video-feeds/${f_n}/release"
              payload: {}
              as: RemoteObserver
              as_user_id: "${s_n}"
            - call: "POST /observation/sitter-assignments/${a15}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${s_n}"
          assert:
            - "BLOCKED: the first start-watch returns HTTP 409 with error.code == ERR_STAFF_NOT_AVAILABLE because Staff.${s_n}.status == ON_ASSIGNMENT"
            - "After the blocked call SitterAssignment.${a15}.watch_status is still SCHEDULED, watch_started_at == null, documentation_status == PENDING"
            - "The release call leaves MonitoringStation.${st_n}.status == IDLE with active_feed_count 0 and Staff.${s_n}.status == AVAILABLE"
            - "VideoFeed.${f_n}.status == RELEASED with release_reason == OBSERVER_RELEASE and released_at == 2026-08-01T08:00:00Z"
            - "ALLOWED: the second start-watch returns HTTP 200 with SitterAssignment.${a15}.watch_status == ON_WATCH and watch_started_at == 2026-08-01T08:00:00Z"
            - "Staff.${s_n}.status == ON_ASSIGNMENT again, now because of the watch rather than the console"
            - "Unit.${unit_n}.observed_cost_to_date_cents == 16000 (the single PROVISIONAL for ${a15}; feeds never post ledger rows)"

      - name: station_offline_depends_on_whether_any_feed_is_still_active
        entity_pair: "MonitoringStation -> VideoFeed"
        grounds:
          - validations.priority_23
          - state_machines.MonitoringStation.status.IDLE_to_OFFLINE
          - state_machines.MonitoringStation.status.ACTIVE_MONITORING_to_IDLE
          - errors.ERR_INVALID_STATION_STATE
        distinguishing_aspect: |
          A different entity pair from instance 1 (console vs feed rather than watch vs staff) and the
          dependency runs the other way round: the MonitoringStation's own IDLE -> OFFLINE transition
          is gated on the collection state of its child VideoFeed rows, not on a single referenced row.
