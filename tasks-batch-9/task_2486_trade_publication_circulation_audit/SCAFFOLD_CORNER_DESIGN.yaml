              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/qualification-requests/${req_j_id}/verify"
              payload: { decision_reason: "qualified" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/advertiser-contracts"
              payload: { publication_id: "${pub_id}", advertiser_name: "Overreach Media", insertion_count: 12, gross_rate_cents_per_insertion: 850000, guaranteed_rate_base: 1750, shortfall_tolerance_pct: 2.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { ac_id: $.data.id, pool: $.data.makegood_credit_pool_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id, total: $.data.total_qualified_copies }
            - call: "POST /circulation/statements/${st_id}/certify"
              payload: { certification_note: "filed" }
              as: PublisherExecutive
              as_user_id: "exec-01"
          trigger:
            - call: "POST /circulation/statements/${st_id}/settle-guarantees"
              payload: { settlement_note: "catastrophic shortfall settlement" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "${total} == 300 and ${pool} == 10200000"
            - "the shortfall is 1450 copies == 82.86 percent, tier factor 1.50, per-insertion credit 1056465 cents and total credit 12677580 cents"
            - "HTTP 422 with ${err} == ERR_MAKEGOOD_POOL_EXCEEDED"
            - "no MakeGoodObligation row exists and AdvertiserContract.${ac_id}.makegood_credit_committed_cents == 0 with makegood_credit_available_cents == 10200000"
            - "AdvertiserContract.${ac_id}.guarantee_status is still ACTIVE and CirculationStatement.${st_id}.guarantees_settled_at is null"

      - name: recompute_statement_action_refreshes_the_breakdown
        claim_type: action_endpoint
        grounds: ["endpoints[POST /circulation/statements/{id}/recompute]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / breakdown_basis_variant_divergence_on_recompute
          rationale: "The named §1.8 instance drives recompute with a switched basis and asserts every refreshed breakdown field."

  # =====================================================================
  # Section 6 — Errors (§1.6): every catalog entry must be triggerable.
  # The remaining not-found codes are swept in one instance; the rest of
  # the catalog is claimed by the sections above and below.
  # =====================================================================
  - section: errors
    instances:
      - name: unknown_ids_across_resources_return_scoped_not_found_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=16]
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=19]
        distinguishing_aspect: "Each resource family returns its OWN 404 code rather than a shared generic one, and the existence ladder (priorities 12-19) is reached before any state or business rule on these endpoints, even when the payload would also violate one."
        test_recipe:
          setup:
            - "empty database, clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /circulation/source-documents/11111111-1111-4111-8111-111111111111/purge"
              payload: { purge_reason: "no such document" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { e_doc: $.data.error_id }
            - call: "POST /circulation/qualification-requests/22222222-2222-4222-8222-222222222222/review"
              payload: { review_note: "no such request" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { e_req: $.data.error_id }
            - call: "POST /circulation/statements/33333333-3333-4333-8333-333333333333/certify"
              payload: { certification_note: "no such statement" }
              as: PublisherExecutive
              as_user_id: "exec-01"
              captures: { e_st: $.data.error_id }
            - call: "POST /circulation/audit-engagements/44444444-4444-4444-8444-444444444444/issue-report"
              payload: { report_note: "no such engagement" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { e_eng: $.data.error_id }
            - call: "POST /circulation/audit-findings/55555555-5555-4555-8555-555555555555/respond"
              payload: { response_note: "no such finding" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { e_find: $.data.error_id }
            - call: "GET /circulation/advertiser-contracts/66666666-6666-4666-8666-666666666666"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { e_ac: $.data.error_id }
            - call: "GET /circulation/make-goods/77777777-7777-4777-8777-777777777777"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { e_mg: $.data.error_id }
            - call: "POST /circulation/digital-snapshots/88888888-8888-4888-8888-888888888888/validate"
              payload: { decision: "VALIDATE" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { e_snap: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with the error envelope"
            - "${e_doc} == ERR_SOURCE_DOCUMENT_NOT_FOUND and ${e_req} == ERR_QUALIFICATION_REQUEST_NOT_FOUND"
            - "${e_st} == ERR_STATEMENT_NOT_FOUND and ${e_eng} == ERR_ENGAGEMENT_NOT_FOUND"
            - "${e_find} == ERR_FINDING_NOT_FOUND and ${e_ac} == ERR_CONTRACT_NOT_FOUND"
            - "${e_mg} == ERR_MAKEGOOD_NOT_FOUND and ${e_snap} == ERR_SNAPSHOT_NOT_FOUND"
            - "no rows of any kind are created by these calls"

      - name: validate_uncertified_digital_snapshot_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
          - errors[ERR_DIGITAL_SOURCE_UNCERTIFIED]
          - state_machines.DigitalAudienceSnapshot.RECORDED_to_VALIDATED
        distinguishing_aspect: "Uncertified analytics may be RECORDED (the snapshot exists with both reach figures computed) but never promoted: only the VALIDATE decision is guarded on source == THIRD_PARTY_CERTIFIED, and a certified snapshot over the same window validates cleanly."
        test_recipe:
          setup:
            - "publication with two RECORDED snapshots over [2026-06-01, 2026-07-01): one INTERNAL_ANALYTICS and one THIRD_PARTY_CERTIFIED"
            - "clock at the default 2026-08-01T00:00:00Z, so the measurement window has closed"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Audience Certification Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/digital-snapshots"
              payload: { window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", website_unique_visitors: 48000, newsletter_sends: 40000, newsletter_unique_opens: 12500, overlap_pct: 15.00, source: "INTERNAL_ANALYTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { snap_internal: $.data.id, internal_source: $.data.source }
            - call: "POST /circulation/publications/${pub_id}/digital-snapshots"
              payload: { window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", website_unique_visitors: 48000, newsletter_sends: 40000, newsletter_unique_opens: 12500, overlap_pct: 15.00, source: "THIRD_PARTY_CERTIFIED" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { snap_certified: $.data.id }
          trigger:
            - call: "POST /circulation/digital-snapshots/${snap_internal}/validate"
              payload: { decision: "VALIDATE" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
            - call: "POST /circulation/digital-snapshots/${snap_certified}/validate"
              payload: { decision: "VALIDATE" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { ok_status: $.data.status, dedup: $.data.combined_reach_deduplicated }
          assert:
            - "${internal_source} == INTERNAL_ANALYTICS and both snapshots were accepted at creation with status RECORDED"
            - "the first validate returns HTTP 422 with ${err} == ERR_DIGITAL_SOURCE_UNCERTIFIED"
            - "DigitalAudienceSnapshot.${snap_internal}.status is still RECORDED and validated_by_user_id is null"
            - "${ok_status} == VALIDATED with ${dedup} == 58625 on the certified snapshot"
            - "two snapshots may share a window — there is no overlap rule on measurement windows"

      - name: request_without_identity_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked at priority 1, ahead of the existence ladder: the same call with no identity headers returns 401 even though the target id does not exist, so a 404 would prove the ladder is inverted."
        test_recipe:
          setup:
            - "empty database"
            - "the transcribed test omits the identity headers entirely; the `as:` value below records only the role the endpoint nominally expects"
          setup_api_calls: []
          trigger:
            - call: "POST /circulation/statements/99999999-9999-4999-8999-999999999999/certify"
              payload: { certification_note: "anonymous certification attempt" }
              as: PublisherExecutive
              as_user_id: "<omitted>"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with ${err} == ERR_UNAUTHENTICATED, NOT ERR_STATEMENT_NOT_FOUND"
            - "the same headerless call against GET /circulation/publications/{id} also returns ERR_UNAUTHENTICATED"

  # =====================================================================
  # Section 7 — RBAC (§1.7). role_model is segregation_of_duties over four
  # opaque roles plus one entity_backed role; the row-level advertiser
  # link is asserted in the endpoints section.
  # =====================================================================
  - section: rbac
    instances:
      - name: qualification_specialist_cannot_create_publication_unauthorized
        claim_type: exclusive_operations
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.CirculationManager
        distinguishing_aspect: "Publication creation is exclusive to CirculationManager; the specialist role that owns request review is refused at priority 2, before the payload is validated at all."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /circulation/publications"
              payload: { name: "Unauthorized Launch", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with ${err} == ERR_UNAUTHORIZED and no Publication row created"
            - "the identical payload as CirculationManager returns 201"

      - name: circulation_auditor_cannot_purge_source_document_unauthorized
        claim_type: peer_roles
        grounds:
          - validations[priority=2]
          - roles.CirculationAuditor
          - roles.CirculationManager
        distinguishing_aspect: "The auditor can READ every evidence document (it is in the roles list of the source-document list endpoint) but cannot destroy one — a peer-role boundary that read access must not leak into."
        test_recipe:
          setup:
            - "publication with source_doc_retention_months 1, one recipient and one document captured 2026-07-15, clock at 2026-08-20 so retention has elapsed"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Peer Boundary Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING", source_doc_retention_months: 1 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Kilo Castings", contact_email: "kc@kilo.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 55 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_k_id: $.data.id }
            - call: "POST /circulation/subscribers/${sub_k_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/k-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_k_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
          trigger:
            - call: "GET /circulation/subscribers/${sub_k_id}/source-documents?limit=10&offset=0"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { read_id: "$.data[0].id" }
            - call: "POST /circulation/source-documents/${doc_k_id}/purge"
              payload: { purge_reason: "auditor housekeeping" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "the read succeeds with ${read_id} == ${doc_k_id}"
            - "the purge returns HTTP 403 with ${err} == ERR_UNAUTHORIZED even though retention has elapsed"
            - "SourceDocument.${doc_k_id}.purge_status is still RETAINED"
            - "the same purge as CirculationManager succeeds and sets purge_status PURGED with purged_at 2026-08-20T00:00:00Z"

      - name: advertiser_contact_cannot_list_advertiser_contracts_unauthorized
        claim_type: exclusive_operations
        grounds:
          - validations[priority=2]
          - roles.AdvertiserContact
          - endpoints[GET /circulation/advertiser-contracts]
        distinguishing_aspect: "The entity-backed advertiser role is scoped to its own make-good obligations: it is absent from the contract list endpoint's roles, so it cannot enumerate the publisher's advertiser book even though it can read the obligation addressed to it."
        test_recipe:
          setup:
            - "one publication with one ACTIVE advertiser contract"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Advertiser Scope Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/advertiser-contracts"
              payload: { publication_id: "${pub_id}", advertiser_name: "Hydraulics International", insertion_count: 12, gross_rate_cents_per_insertion: 850000, guaranteed_rate_base: 1750 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { ac_id: $.data.id, tolerance: $.data.shortfall_tolerance_pct }
          trigger:
            - call: "GET /circulation/advertiser-contracts?publication_id=${pub_id}&limit=10&offset=0"
              as: AdvertiserContact
              as_user_id: "${ac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${tolerance} == 2.00 — the declared default shortfall tolerance"
            - "HTTP 403 with ${err} == ERR_UNAUTHORIZED"
            - "the same list call as CirculationAuditor or PublisherExecutive returns the contract"

      - name: certify_own_prepared_statement_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=40]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
        distinguishing_aspect: "Certification is a shared operation for CirculationManager and PublisherExecutive, so the block is not the ROLE but the X-User-ID: the preparer mgr-01 is refused while a second manager mgr-02 with the identical role succeeds on the same DRAFT statement."
        test_recipe:
          setup:
            - "one publication and one DRAFT statement for [2026-05-01, 2026-08-01) prepared by mgr-01"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Duty Split Monthly", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, pub_ver: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id, preparer: $.data.prepared_by_user_id }
          trigger:
            - call: "POST /circulation/statements/${st_id}/certify"
              payload: { certification_note: "self-certifying" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
            - call: "POST /circulation/statements/${st_id}/certify"
              payload: { certification_note: "independent certification" }
              as: CirculationManager
              as_user_id: "mgr-02"
              captures: { status: $.data.status, certifier: $.data.certified_by_user_id, filed: $.data.filed_at }
          assert:
            - "${preparer} == mgr-01"
            - "the first certify returns HTTP 409 with ${err} == ERR_SEGREGATION_OF_DUTIES and the statement stays DRAFT"
            - "the second certify returns HTTP 200 with ${status} == FILED, ${certifier} == mgr-02 and ${filed} == 2026-08-01T00:00:00Z"

      - name: accept_finding_resolution_by_raising_auditor_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=40]
          - state_machines.AuditFinding.RESPONSE_SUBMITTED_to_ACCEPTED_RESOLVED
        distinguishing_aspect: "The same duty split applies on the audit side of the workflow with a different identity pair: the auditor who RAISED the finding cannot accept its resolution, while any other CirculationAuditor can — proving the check reads raised_by_user_id, not the role."
        test_recipe:
          setup:
            - "publication with one 500-copy CONTROLLED recipient and a FILED statement for [2026-05-01, 2026-08-01)"
            - "an engagement with sample_size 2 and a MATERIAL finding raised by aud-01, already responded to by mgr-01"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Audit Duty Split Monthly", frequency: "MONTHLY", industry_code: "UTILITIES" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Lima Power", contact_email: "lp@lima.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 500 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_l_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id }
            - call: "POST /circulation/statements/${st_id}/certify"
              payload: { certification_note: "filed" }
              as: PublisherExecutive
              as_user_id: "exec-01"
            - call: "POST /circulation/audit-engagements"
              payload: { statement_id: "${st_id}", auditor_org: "Verified Audit Bureau", fieldwork_start: "2026-08-05T00:00:00Z", fieldwork_end: "2026-08-09T00:00:00Z", sample_size: 2 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { eng_id: $.data.id }
            - call: "POST /circulation/audit-findings"
              payload: { engagement_id: "${eng_id}", subscriber_id: "${sub_l_id}", finding_type: "MISSING_SOURCE_DOCUMENT", severity: "MATERIAL", affected_copies: 120 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { find_id: $.data.id, raiser: $.data.raised_by_user_id }
            - call: "POST /circulation/audit-findings/${find_id}/respond"
              payload: { response_note: "documentation attached" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { responded: $.data.status }
          trigger:
            - call: "POST /circulation/audit-findings/${find_id}/accept-resolution"
              payload: { resolution_note: "self-accepting my own finding" }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
            - call: "POST /circulation/audit-findings/${find_id}/accept-resolution"
              payload: { resolution_note: "independent review of the response" }
              as: CirculationAuditor
              as_user_id: "aud-02"
              captures: { final: $.data.status }
          assert:
            - "${raiser} == aud-01 and ${responded} == RESPONSE_SUBMITTED"
            - "the first accept-resolution returns HTTP 409 with ${err} == ERR_SEGREGATION_OF_DUTIES and the finding stays RESPONSE_SUBMITTED"
            - "the second accept-resolution returns HTTP 200 with ${final} == ACCEPTED_RESOLVED"
            - "Publication.${pub_id}.open_material_findings_count == 0 and CirculationStatement.${st_id}.status == UNDER_AUDIT afterwards"

      - name: publisher_executive_and_manager_share_certification
        claim_type: shared_operations
        grounds:
          - roles.PublisherExecutive
          - roles.CirculationManager
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certify_filed_statement_by_preparer_rejects_not_draft_over_sod
          rationale: "That §1.8 instance certifies as PublisherExecutive on the happy path before probing the conflict, and the certify_own_prepared_statement_rejected corner above certifies as a second CirculationManager — the shared operation is asserted from both roles across the two."

  # =====================================================================
  # Section 8 — Cross-Cutting Complexity Layers. Active layers are
  # cascading_side_effects, derived_field_reconciliation,
  # optimistic_concurrency and rate_threshold_triggers; the OCC layer maps
  # one instance per §1.2.1 concurrency rule, plus the pagination layer
  # implied by the paginated list endpoints.
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_publication_version_on_statement_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[statement-create-stale-publication]
          - validations[priority=25]
          - errors[ERR_STALE_PUBLICATION_VERSION]
        distinguishing_aspect: "The publication version that a successful statement create CONSUMES is invalidated by that same create (the endpoint increments Publication.version), so a client holding one read can open exactly one statement; the second create for a disjoint period is refused on version, not on overlap, and succeeds after a re-read."
        test_recipe:
          setup:
            - "one publication with a single 400-copy CONTROLLED recipient; clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "OCC Statement Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Mike Fabrication", contact_email: "mf@mike.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 400 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_m_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_read: $.data.version }
          trigger:
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_read}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_q1: $.data.id, q1_status: $.data.status }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_read}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_fresh: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_fresh}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_q2: $.data.id, q2_status: $.data.status }
          assert:
            - "${pub_ver_read} == 1 (publication created, subscriber add does not bump the publication row's version)"
            - "the first create returns 201 with ${q1_status} == DRAFT"
            - "the replayed version returns HTTP 412 with ${err} == ERR_STALE_PUBLICATION_VERSION and NO second statement row is created"
            - "${pub_ver_fresh} == 2 — the successful create incremented Publication.version by exactly 1"
            - "the retry with the fresh version returns 201 with ${q2_status} == DRAFT and ${st_q2} != ${st_q1}"
            - "a third read of the publication now returns version 3"

      - name: stale_subscriber_version_on_request_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[qualification-request-create-stale-subscriber]
          - validations[priority=26]
          - errors[ERR_STALE_SUBSCRIBER_VERSION]
        distinguishing_aspect: "The second OCC rule guards a DIFFERENT parent (Subscriber) and is invalidated by a write on a different endpoint entirely: an undeliverable event that changes no status at all still bumps the version and therefore invalidates a pending attestation."
        test_recipe:
          setup:
            - "one publication with one 60-copy PAID recipient and one retained request card"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "OCC Request Monthly", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "November Freight", contact_email: "nf@november.test", job_function_code: "OPERATIONS_MGMT", industry_code: "LOGISTICS", purchasing_authority_level: "APPROVES", subscription_class: "PAID", copies: 60, paid_amount_cents: 19900 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_n_id: $.data.id, sub_ver_create: $.data.version }
            - call: "POST /circulation/subscribers/${sub_n_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-20T00:00:00Z", storage_ref: "s3://circ/n-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_n_id: $.data.id }
          trigger:
            - call: "POST /circulation/subscribers/${sub_n_id}/undeliverable-events"
              payload: { reason_code: "MOVED_NO_FORWARDING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { bumped_ver: $.data.version, dstatus: $.data.delivery_status, ucount: $.data.undeliverable_count }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_n_id}", source_document_id: "${doc_n_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-20T00:00:00Z", attested_job_function_code: "OPERATIONS_MGMT", attested_industry_code: "LOGISTICS", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_ver_create}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { err: $.data.error_id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_n_id}", source_document_id: "${doc_n_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-20T00:00:00Z", attested_job_function_code: "OPERATIONS_MGMT", attested_industry_code: "LOGISTICS", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${bumped_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_status: $.data.status, req_id: $.data.id }
            - call: "GET /circulation/subscribers/${sub_n_id}"
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { after_ver: $.data.version, after_qstatus: $.data.qualification_status }
          assert:
            - "${sub_ver_create} == 1 and ${bumped_ver} == 2"
            - "${dstatus} == DELIVERABLE and ${ucount} == 1 — the event alone moves no status dimension"
            - "the stale create returns HTTP 412 with ${err} == ERR_STALE_SUBSCRIBER_VERSION and no request row exists"
            - "the retry returns 201 with ${req_status} == SUBMITTED"
            - "${after_ver} == 3 and ${after_qstatus} == PENDING_QUALIFICATION — the accepted create bumped the subscriber again"

      - name: statement_list_filter_and_offset_paging_stay_consistent
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /circulation/statements]
          - complexity_profile.pagination
        distinguishing_aspect: "Filtering and paging compose: the status filter is applied BEFORE the window, so certifying one of three statements shrinks total_count rather than leaving a hole in page one, and the two pages of the DRAFT filter partition the DRAFT set with no repeated id."
        test_recipe:
          setup:
            - "one publication with a single 300-copy CONTROLLED recipient and three DRAFT statements over adjacent closed quarters"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Paging Quarterly", frequency: "QUARTERLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Oscar Tooling", contact_email: "ot@oscar.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 300 }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { v1: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2025-10-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${v1}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_a: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { v2: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${v2}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_b: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { v3: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${v3}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_c: $.data.id }
          trigger:
            - call: "GET /circulation/statements?publication_id=${pub_id}&status=DRAFT&limit=2&offset=0"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { p1_first: "$.data[0].id", p1_second: "$.data[1].id" }
            - call: "GET /circulation/statements?publication_id=${pub_id}&status=DRAFT&limit=2&offset=2"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { p2_first: "$.data[0].id" }
            - call: "POST /circulation/statements/${st_a}/certify"
              payload: { certification_note: "filing the oldest quarter" }
              as: PublisherExecutive
              as_user_id: "exec-01"
              captures: { a_status: $.data.status }
            - call: "GET /circulation/statements?publication_id=${pub_id}&status=DRAFT&limit=2&offset=0"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { after_first: "$.data[0].id", after_second: "$.data[1].id" }
            - call: "GET /circulation/statements?publication_id=${pub_id}&status=FILED&limit=10&offset=0"
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { filed_first: "$.data[0].id" }
          assert:
            - "${v1} == 1, ${v2} == 2 and ${v3} == 3 — each statement create bumps the publication once"
            - "page one of the DRAFT filter returns 2 rows with total_count 3 and has_more true"
            - "page two returns exactly 1 row with total_count 3 and has_more false; ${p2_first} is neither ${p1_first} nor ${p1_second}"
            - "the union of the two pages is exactly {${st_a}, ${st_b}, ${st_c}}"
            - "${a_status} == FILED"
            - "after certification the DRAFT page one returns 2 rows with total_count 2 and has_more false, and neither ${after_first} nor ${after_second} equals ${st_a}"
            - "the FILED filter returns exactly one row with ${filed_first} == ${st_a}"
            - "omitting limit and offset on the same filter returns all rows up to the default limit of 10"

      - name: five_hop_restatement_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / issue_report_five_hop_restatement_cascade
          rationale: "That §1.8 instance walks the full engagement -> findings -> statement -> publication -> make-good chain and asserts each hop's fields, which is exactly the N-level end-to-end claim for this layer."
      - name: ordering_sensitive_posture_staleness_cascade
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / hygiene_sweep_three_hop_posture_staleness_cascade
          rationale: "That §1.8 instance asserts the sweep's ordering sensitivity (posture_before captured ahead of the sweep, statements_invalidated_count only when the posture actually moves), covering the ordering and partial-effect claims."
      - name: both_breakdown_variants_and_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / breakdown_basis_variant_divergence_on_recompute
          rationale: "That §1.8 instance computes the same population under AS_OF_PERIOD_END and AUDIT_VERIFIED and asserts the delta plus the derived statement_type on the switch."
      - name: undeliverable_rate_threshold_at_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: boundary_precision_check / undeliverable_pct_exactly_at_restrict_boundary
          rationale: "That §1.8 instance sits the hygiene ratio one hundredth below, exactly on and one hundredth above undeliverable_restrict_pct and asserts the posture at each point, plus the reinstatement reset."
      - name: copy_ledger_derived_fields_reconcile_after_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / subscriber_reclassification_round_trip_preserves_copy_conservation
          rationale: "That §1.8 instance asserts every class counter and copies_on_file_total after create, after reclassification and after the inverse reclassification, which is the create/update/reverse triple for this layer."

  # =====================================================================
  # Section 9 — Consistency Model (§1.0 consistency_model: immediate).
  # =====================================================================
  - section: consistency_model
    instances:
      - name: reclassify_response_and_publication_ledger_are_immediately_consistent
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.publication_copies_ledger
        distinguishing_aspect: "No read-after-write lag anywhere: the reclassify response itself already carries the new class, and a publication read taken immediately afterwards in the same test already shows both class counters moved and every DRAFT statement flagged stale — there is no settle step, retry or re-read delay."
        test_recipe:
          setup:
            - "one publication with a single 250-copy CONTROLLED recipient and one DRAFT statement over a closed quarter"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Immediate Consistency Monthly", frequency: "MONTHLY", industry_code: "HEALTHCARE" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Papa Clinical", contact_email: "pc@papa.test", job_function_code: "CLINICAL_MGMT", industry_code: "HEALTHCARE", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 250 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_p_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pre_total: $.data.copies_on_file_total, pre_controlled: $.data.controlled_copies_on_file, pre_paid: $.data.paid_copies_on_file, pub_ver: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id, stale_at_create: $.data.breakdown_stale }
          trigger:
            - call: "POST /circulation/subscribers/${sub_p_id}/reclassify"
              payload: { subscription_class: "PAID", paid_amount_cents: 24900 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { new_class: $.data.subscription_class, new_paid: $.data.paid_amount_cents }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { post_total: $.data.copies_on_file_total, post_controlled: $.data.controlled_copies_on_file, post_paid: $.data.paid_copies_on_file }
            - call: "GET /circulation/statements/${st_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { stale_now: $.data.breakdown_stale }
          assert:
            - "${pre_total} == 250, ${pre_controlled} == 250 and ${pre_paid} == 0"
            - "${stale_at_create} == false — the statement was current at creation"
            - "the reclassify response itself already reports ${new_class} == PAID and ${new_paid} == 24900"
            - "${post_total} == 250, ${post_controlled} == 0 and ${post_paid} == 250 on the very next read"
            - "${stale_now} == true — the cascade to the DRAFT statement is visible immediately, not after any settle step"
