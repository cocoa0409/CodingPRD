              as_user_id: "${qa_a_id}"
              payload: { verification_type: INSULATION_RESISTANCE, measured_ir_megaohm: 2.50, test_voltage_v: 500 }
            - call: POST /capacity-tests
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { assembly_id: "${asm_id}", chamber_id: "${chamber_id}", test_type: CAPACITY, scheduled_start_at: "2026-09-03T10:00:00Z", scheduled_end_at: "2026-09-03T10:00:00Z", draw_kw: 3.00 }
              captures: { err_window: "$.data.error_id" }
          assert:
            - "APPROVE on the DRAFT design answers 409 with error_id \"ERR_DESIGN_STATE_INVALID\" - only UNDER_REVIEW admits a verdict."
            - "Opening a lot against the DRAFT design answers 409 with error_id \"ERR_DESIGN_NOT_APPROVED\", a different code from the transition refusal above."
            - "Advancing the LOT_TESTING lot back to FORMATION answers 409 with error_id \"ERR_LOT_STATE_INVALID\" - the pipeline never moves backwards."
            - "Reworking the PENDING assembly answers 409 with error_id \"ERR_ASSEMBLY_STATE_INVALID\" - only REJECTED or REVOKED assemblies may be reworked."
            - "Scheduling a test against the PENDING assembly answers 409 with error_id \"ERR_ASSEMBLY_NOT_CERTIFIED\", NOT ERR_ASSEMBLY_STATE_INVALID - and the lot is in LOT_TESTING, so the priority-11 lot-state gate does not preempt the priority-14 certification gate."
            - "connection_count 10 against module_count 6 answers 422 with error_id \"ERR_CONNECTION_COUNT_MISMATCH\" (2 * 6 == 12 is required) and leaves torque_status PENDING."
            - "The second TORQUE verdict on the same rework generation answers 409 with error_id \"ERR_ASSEMBLY_AXIS_ALREADY_RECORDED\" and does NOT overwrite measured_torque_nm, which stays 20.0."
            - "A zero-length window (scheduled_end_at == scheduled_start_at) answers 422 with error_id \"ERR_WINDOW_INVALID\", checked before the chamber capacity rule."
            - "GET /production-lots answers total_count == 1 and GET /capacity-tests answers total_count == 0."

