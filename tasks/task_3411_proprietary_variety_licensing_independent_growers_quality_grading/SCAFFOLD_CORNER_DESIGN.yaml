            - "GET /licensing/settlement-statements/${s_c1} shows status ISSUED, paid_at null, net_cents == 562120"

      - name: quota_boundary_exactly_max_then_over
        claim_type: Violation -> Error
        grounds:
          - validations[priority=11]
          - errors.ERR_PLANTING_QUOTA_EXCEEDED
        distinguishing_aspect: "The agreement quota is inclusive: confirming 100 plants against max_planting_units 100 succeeds (units_planted == max exactly); the next plant over the cap fails 409 ERR_PLANTING_QUOTA_EXCEEDED."
        test_recipe:
          setup: ["V1 RELEASED; G1 with ACTIVE A_Q (max 100); lot L_Q 200 plants; window W1; P_Q1 planned 100 confirmed; P_Q2 planned 1."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 100, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { aq_id: $.data.id }
            - call: "POST /licensing/agreements/${aq_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { aq_v: $.data.version }
            - call: "POST /licensing/plant-lots"
              payload: { nursery_code: "NUR-CA-01", agreement_id: "${aq_id}", variety_id: "${v1_id}", quantity_plants: 200 }
              as: NurseryManager
              captures: { lq_id: $.data.id }
            - *c_w1
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${aq_id}", plant_lot_id: "${lq_id}", planned_plants: 100, expected_agreement_version: "${aq_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { pq1_id: $.data.id }
            - call: "GET /licensing/agreements/${aq_id}"
              payload: {}
              as: PlatformAdmin
              captures: { aq_v2: $.data.version }
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${aq_id}", plant_lot_id: "${lq_id}", planned_plants: 1, expected_agreement_version: "${aq_v2}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { pq2_id: $.data.id }
            - *c_clock_aug
            - call: "POST /licensing/plantings/${pq1_id}/confirm"
              payload: { plants_planted_actual: 100, planted_on: "2026-08-01T00:00:00Z" }
