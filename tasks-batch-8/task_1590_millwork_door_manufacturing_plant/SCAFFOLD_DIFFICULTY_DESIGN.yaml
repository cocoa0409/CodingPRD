  # ==================================================================
  # Rule 6 — boundary_precision_check (serial count on label issue; leaf count on trip assign)
  # ==================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: label_serial_exact_availability_boundary
        grounds:
          - calculations.label_serial_accounting
          - errors[ERR_INSUFFICIENT_LABEL_SERIALS]
        distinguishing_aspect: |
          Metric = integer serial count, endpoint = POST /millwork/label-allocations.
          Request count == serials_available succeeds (boundary inclusive);
          request count == serials_available + 1 fails with
          ERR_INSUFFICIENT_LABEL_SERIALS. Different metric and endpoint than
          the truck-capacity boundary below.
        test_recipe:
          setup:
            - "Rated MIN_20 order with three openings L1 (2 leaves), L2 (1 leaf), L3 (1 leaf), all FINISHED via one passed batch; UL_20MIN roll capacity 3."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Label Proj", site_address: "4 Tag St", contract_code: "C-7001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-L1", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
