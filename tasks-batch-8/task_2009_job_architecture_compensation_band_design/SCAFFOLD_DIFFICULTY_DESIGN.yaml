  - rule_id: non_linear_state_machine
    instances:
      - name: job_profile_revision_cycle
        grounds:
          - state_machines.JobProfile.transitions
          - entities.JobProfile.fields.flsa_classification
        distinguishing_aspect: |
          JobProfile is cyclic: DRAFT->IN_REVIEW->DRAFT (return) and
          APPROVED->IN_REVIEW (revise, which resets FLSA to PENDING),
          reaching APPROVED twice on one row with version incrementing on
          every hop — not a linear pipeline.
        test_recipe:
          setup:
            - "ENG family and levels P1/P2 exist; one profile created (weekly 200000, duties true)"
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof: $.data.id } }
          trigger:
            - { call: "POST /comp/job-profiles/${prof}/determine-flsa", payload: {}, as: CompAnalyst, captures: { v2: $.data.version, c2: $.data.flsa_classification } }
            - { call: "POST /comp/job-profiles/${prof}/submit", payload: {}, as: CompAnalyst, captures: { v3: $.data.version } }
            - { call: "POST /comp/job-profiles/${prof}/return", payload: { reason: "jd gaps" }, as: CompManager }
            - { call: "POST /comp/job-profiles/${prof}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof}/approve", payload: {}, as: CompManager, captures: { v6: $.data.version } }
            - { call: "POST /comp/job-profiles/${prof}/revise", payload: { reason: "scope update" }, as: CompAnalyst, captures: { v7: $.data.version, c7: $.data.flsa_classification } }
            - { call: "POST /comp/job-profiles/${prof}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof}/approve", payload: {}, as: CompManager, captures: { v9: $.data.version, s9: $.data.status } }
          assert:
            - "after determine-flsa: flsa_classification == EXEMPT and version == 2"
            - "cycle path IN_REVIEW->DRAFT->IN_REVIEW->APPROVED reached (versions 3,4,5,6)"
            - "after revise: version == 7 and flsa_classification reset to PENDING"
            - "final approve: status == APPROVED and version == 9 (every mutation incremented version exactly once)"

      - name: exception_request_finance_branch_divergence
        grounds:
          - state_machines.ExceptionRequest.transitions
          - entities.ExceptionRequest.fields.finance_required
        distinguishing_aspect: |
          ExceptionRequest is a branching fork-join: at comp-pass, type
          ABOVE_MAX_HIRE routes to FINANCE_REVIEW (salary applied only after
          finance-pass) while BELOW_MIN_RETENTION routes straight to
          APPROVED with immediate salary application — divergent side-effect
          sets per branch, on a different entity than JobProfile.
        test_recipe:
          setup:
            - "ENG P2 band PUBLISHED (mid 13000000, max 14950000); program PUBLISHED"
            - "department DA pool 5000000; employee E1 salary 14000000 (cap tier MID -> cap 15697500); employee E2 salary 11200000 (compa 0.8615 -> tier LOW -> cap 16445000)"
