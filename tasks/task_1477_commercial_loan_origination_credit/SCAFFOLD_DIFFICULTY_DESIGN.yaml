# =============================================================================
# §1.8 Scaffold Difficulty Design — Commercial Loan Origination & Credit Memo
# Test Targeting Index: 9 rules x >=2 instances, grounded in SCAFFOLD.yaml.
# All money is integer cents; ratios 4dp round_half_up; default logical clock
# is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dscr_standard_vs_stress_same_statement_diverge
        grounds:
          - calculations.dscr_computation
          - entities.LoanApplication.fields.dscr_standard
          - entities.LoanApplication.fields.dscr_stress
          - entities.PolicyException.fields.rule_code
        distinguishing_aspect: |
          Entity domain = borrower financial statements. The SAME finalized
          statement yields dscr_standard 1.2982 (passes the 1.2500 policy floor)
          but dscr_stress 0.7010 (fails the 1.0000 stress floor): the addback
          cap (min(3,000,000, floor(0.25*11,000,000)) = 2,750,000) and the 15%
          revenue haircut (3,000,000) are applied by exactly one variant each,
          so only the stress variant raises an exception.
        test_recipe:
          setup:
            - "Borrower (relationship_since 2018-01-01) with one CRE_TERM application: requested 30,000,000 cents, term 60"
            - "One FINAL statement: revenue 20,000,000; ebitda 11,000,000; addbacks 3,000,000; distributions 800,000; maintenance capex 450,000; existing annual debt service 2,500,000; assets 80,000,000; liabilities 40,000,000"
            - "Underwriting annuity at 700 bps over 60 months: payment 594,036/mo => annual debt service 9,628,432"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          trigger:
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { dscr_std: $.data.dscr_standard, dscr_str: $.data.dscr_stress, rating: $.data.risk_rating } }
          assert:
            - "LoanApplication.${app}.dscr_standard == 1.2982  (cf 12,500,000 / 9,628,432, BANK_STANDARD includes capped addbacks)"
            - "LoanApplication.${app}.dscr_stress == 0.7010    (cf 6,750,000 / 9,628,432, REGULATORY_STRESS excludes addbacks and haircuts revenue 15%)"
            - "dscr_standard - dscr_stress == 0.5972 (identical inputs, divergent variants)"
            - "exactly one OPEN PolicyException exists: rule_code == STRESS_DSCR_MINIMUM, severity == LOW"
            - "no PolicyException with rule_code == DSCR_MINIMUM exists (1.2982 >= 1.2500)"
            - "LoanApplication.${app}.risk_rating == 3 and rating_basis == PROVISIONAL (score 76.88 = (0.4*60+0.3*100+0.1*75)/0.80)"
            - "LoanApplication.${app}.status == EXCEPTION_REVIEW (branch taken because the LOW stress exception is OPEN)"

      - name: collateral_lending_vs_liquidation_basis_insider
        grounds:
          - calculations.eligible_collateral_value
          - entities.Appraisal.fields.eligible_value_cents
          - entities.Appraisal.fields.liquidation_basis_value_cents
          - entities.Borrower.fields.is_reg_o_insider
        distinguishing_aspect: |
          Entity domain = collateral appraisal (distinct from instance 1's
          borrower-statement domain). One accepted appraisal (appraised
          40,000,000 / OLV 34,000,000, REAL_ESTATE advance 0.75) yields
          eligible_value_cents 30,000,000 under LENDING_BASIS but
          liquidation_basis_value_cents 21,675,000 under LIQUIDATION_BASIS;
          the Reg O insider deal passes the lending-basis LTV test (0.7500 <=
          0.8000) yet fails the liquidation-basis floor (1.3841 > 0.8000),
          producing a HIGH COLLATERAL_COVERAGE_MIN exception only on the
          liquidation variant.
        test_recipe:
          setup:
            - "Reg O insider borrower; application requested 30,000,000 CRE_TERM 60 months; statement identical in shape to instance 1 (dscr_standard 1.2982, dscr_stress 0.7010)"
            - "finalize-spreads leaves two OPEN LOW exceptions (STRESS_DSCR_MINIMUM, REG_O_INSIDER); both waived by policy officer; application reaches APPRAISAL_REVIEW"
            - "One appraisal ACCEPTED: appraised 40,000,000, orderly liquidation 34,000,000, class REAL_ESTATE"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Polly Policy" }, as: BankAdmin, captures: { po: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "April Appraisals" }, as: BankAdmin, captures: { apm: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Insider Trading Post Inc", naics_code: "441110", relationship_since: "2018-01-01", is_reg_o_insider: true }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "GET /credit/loan-applications/${app}/policy-exceptions?rule_code=STRESS_DSCR_MINIMUM&status=OPEN", as: CreditPolicyOfficer, as_user_id: "${po}", captures: { exc1: "$.data[0].id" } }
            - { call: "POST /credit/policy-exceptions/${exc1}/waive", payload: { waiver_rationale: "Stress shortfall accepted by credit policy desk" }, as: CreditPolicyOfficer, as_user_id: "${po}" }
            - { call: "GET /credit/loan-applications/${app}/policy-exceptions?rule_code=REG_O_INSIDER&status=OPEN", as: CreditPolicyOfficer, as_user_id: "${po}", captures: { exc2: "$.data[0].id" } }
            - { call: "POST /credit/policy-exceptions/${exc2}/waive", payload: { waiver_rationale: "Insider relationship documented per Reg O file" }, as: CreditPolicyOfficer, as_user_id: "${po}" }
            - { call: "POST /credit/loan-applications/${app}/clear-exceptions", payload: {}, as: CreditPolicyOfficer, as_user_id: "${po}" }
            - { call: "POST /credit/appraisers", payload: { name: "AppraisalCo", license_number: "LIC-100" }, as: AppraisalManager, as_user_id: "${apm}", captures: { apr: $.data.id } }
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: REAL_ESTATE, engagement_start_date: "2026-08-03", engagement_end_date: "2026-08-07" }, as: AppraisalManager, as_user_id: "${apm}", captures: { aprl: $.data.id } }
            - { call: "POST /credit/appraisals/${aprl}/receive-report", payload: { appraised_value_cents: 40000000, orderly_liquidation_value_cents: 34000000 }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/appraisals/${aprl}/review", payload: { outcome: ACCEPTED }, as: AppraisalManager, as_user_id: "${apm}", captures: { elig: $.data.eligible_value_cents, liq: $.data.liquidation_basis_value_cents } }
          trigger:
            - { call: "POST /credit/loan-applications/${app}/submit-to-committee", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          assert:
            - "Appraisal.${aprl}.eligible_value_cents == 30000000 (LENDING_BASIS: 40,000,000 x 0.75)"
            - "Appraisal.${aprl}.liquidation_basis_value_cents == 21675000 (LIQUIDATION_BASIS: 34,000,000 x 0.85 x 0.75)"
            - "the two bases diverge by exactly 8,325,000 cents on identical appraised inputs"
            - "no LTV_MAXIMUM exception exists (requested/appraised == 0.7500 <= 0.8000 on the lending basis)"
            - "exactly one OPEN exception with rule_code == COLLATERAL_COVERAGE_MIN and severity == HIGH exists, created by the liquidation-basis Reg O test (requested/liquidation == 1.3841 > 0.8000)"
            - "LoanApplication.${app}.proposed_amount_cents == 30000000 (sizing unconstrained: dscr cap 31,563,745; ltv cap 32,000,000)"
            - "LoanApplication.${app}.status == COMMITTEE_REVIEW"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: risk_rating_tiered_weight_renormalization
        grounds:
          - calculations.risk_rating_model
          - entities.LoanApplication.fields.risk_rating
          - entities.LoanApplication.fields.rating_basis
        distinguishing_aspect: |
          Mode (a): four tiered factor lookups combined non-linearly with fixed
          weights, and the PROVISIONAL basis renormalizes by /0.80 when the
          coverage factor is unknowable. Two applications identical except a
          0.5000 vs 0.5001 leverage ratio (inclusive tier boundary) land in
          bands 3 and 4: scores 76.88 vs 69.38 under the renormalized
          provisional formula — without the /0.80 divisor they would be 61.50
          (band 4) and 55.50 (band 5), so the asserted bands pin both the
          tiered lookup and the renormalization.
        test_recipe:
          setup:
            - "Two borrowers, two CRE_TERM applications (requested 30,000,000, 60 months), identical statements except liabilities: app1 40,000,000 (leverage 0.5000 exactly), app2 40,008,000 (0.5001)"
            - "Shared statement shape: revenue 20,000,000; ebitda 11,000,000; addbacks 3,000,000; distributions 800,000; capex 450,000; existing ds 2,500,000; assets 80,000,000; relationship 2018-01-01 (8 years at default clock -> 75 tenure points)"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Leverage Exact LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor1: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Leverage Over LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor2: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor1}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app1: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app1}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app1}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt1}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt1}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor2}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app2: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app2}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40008000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt2: $.data.id } }
            - { call: "POST /credit/loan-applications/${app2}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt2}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt2}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          trigger:
            - { call: "POST /credit/loan-applications/${app1}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app2}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          assert:
            - "LoanApplication.${app1}.dscr_standard == 1.2982 and LoanApplication.${app2}.dscr_standard == 1.2982 (leverage does not feed DSCR)"
            - "app1 leverage ratio == 0.5000 -> 100 points (inclusive boundary); app2 ratio == 0.5001 -> 80 points"
            - "LoanApplication.${app1}.risk_rating == 3 (provisional score 76.88 = (0.4*60 + 0.3*100 + 0.1*75)/0.80)"
            - "LoanApplication.${app2}.risk_rating == 4 (provisional score 69.38 = (0.4*60 + 0.3*80 + 0.1*75)/0.80)"
            - "both applications have rating_basis == PROVISIONAL"

      - name: participation_fee_rounding_order_remainder
        grounds:
          - calculations.participation_fee_allocation
          - calculations.origination_fee
          - entities.Participation.fields.fee_share_cents
          - entities.LoanApplication.fields.bank_hold_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order (distinct from the tiered
          mode (a) instance): each participation's fee share is rounded
          half-up individually in created_at order and the bank absorbs the
          remainder. On a 1,750,000-cent fee with two 66,666,667-cent shares,
          per-share rounding yields 583,333 + 583,333 and a bank remainder of
          583,334 — one cent MORE than the naive round of the bank's own
          pro-rata share (583,333), which is the observable fingerprint of the
          pinned rounding order.
        test_recipe:
          setup:
            - "Application fully approved at proposed == 200,000,000 (STANDARD level), term sheet amount 200,000,000 (fee = 1,000,000 + 750,000 = 1,750,000), commitment letter ISSUED then ACCEPTED (app DOCUMENTATION)"
            - "Clean statement: revenue 200,000,000; ebitda 100,000,000; no addbacks/distributions/capex/existing ds; assets 500,000,000; liabilities 200,000,000; relationship 2010-01-01 => dscr_standard 2.1042, dscr_stress 1.4730, zero exceptions"
            - "Appraisal ACCEPTED: appraised 400,000,000 RE => eligible 300,000,000; LTV 0.5000; coverage 1.5000"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "April Appraisals" }, as: BankAdmin, captures: { apm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Cheryl Chair" }, as: BankAdmin, captures: { ch: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Member One" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Member Two" }, as: BankAdmin, captures: { m2: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Adam Admin" }, as: BankAdmin, captures: { adm: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Meridian Industrial Parks", naics_code: "531120", relationship_since: "2010-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 200000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 200000000, ebitda_cents: 100000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 0, total_assets_cents: 500000000, total_liabilities_cents: 200000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/appraisers", payload: { name: "AppraisalCo", license_number: "LIC-100" }, as: AppraisalManager, as_user_id: "${apm}", captures: { apr: $.data.id } }
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: REAL_ESTATE, engagement_start_date: "2026-08-03", engagement_end_date: "2026-08-07" }, as: AppraisalManager, as_user_id: "${apm}", captures: { aprl: $.data.id } }
            - { call: "POST /credit/appraisals/${aprl}/receive-report", payload: { appraised_value_cents: 400000000, orderly_liquidation_value_cents: 380000000 }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/appraisals/${aprl}/review", payload: { outcome: ACCEPTED }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/loan-applications/${app}/submit-to-committee", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { app_v: $.data.version } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T15:30:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { sess: $.data.id } }
            - { call: "POST /credit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:30:00Z" }, as: BankAdmin }
            - { call: "POST /credit/committee-decisions", payload: { loan_application_id: "${app}", committee_session_id: "${sess}", expected_loan_application_version: "${app_v}" }, as: CommitteeChair, as_user_id: "${ch}", captures: { dec: $.data.id } }
            - { call: "POST /credit/committee-decisions/${dec}/votes", payload: { vote: APPROVE }, as: CommitteeMember, as_user_id: "${m1}" }
            - { call: "POST /credit/committee-decisions/${dec}/votes", payload: { vote: APPROVE }, as: CommitteeMember, as_user_id: "${m2}", captures: { dec_status: $.data.status } }
            - { call: "GET /credit/loan-applications/${app}", as: RelationshipManager, as_user_id: "${rm}", captures: { app_v2: $.data.version } }
            - { call: "POST /credit/term-sheets", payload: { loan_application_id: "${app}", amount_cents: 200000000, rate_bps: 650, term_months: 60, expires_at: "2026-08-20T00:00:00Z", expected_loan_application_version: "${app_v2}" }, as: RelationshipManager, as_user_id: "${rm}", captures: { sheet: $.data.id, fee: $.data.origination_fee_cents } }
            - { call: "POST /credit/term-sheets/${sheet}/respond", payload: { outcome: ACCEPTED }, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "GET /credit/commitment-letters?loan_application_id=${app}", as: CreditAdministrator, as_user_id: "${adm}", captures: { letter: "$.data[0].id" } }
            - { call: "POST /credit/commitment-letters/${letter}/issue", payload: { expiry_date: "2026-09-01", rate_lock_expires_at: "2026-08-31T23:59:59Z" }, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/commitment-letters/${letter}/accept", payload: {}, as: CreditAdministrator, as_user_id: "${adm}" }
          trigger:
            - { call: "POST /credit/participations", payload: { loan_application_id: "${app}", participant_bank_name: "Bank North", allocated_amount_cents: 66666667 }, as: RelationshipManager, as_user_id: "${rm}", captures: { p1: $.data.id } }
            - { call: "POST /credit/participations/${p1}/commit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { share1: $.data.fee_share_cents } }
            - { call: "POST /credit/participations", payload: { loan_application_id: "${app}", participant_bank_name: "Bank South", allocated_amount_cents: 66666667 }, as: RelationshipManager, as_user_id: "${rm}", captures: { p2: $.data.id } }
            - { call: "POST /credit/participations/${p2}/commit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { share2: $.data.fee_share_cents } }
          assert:
            - "TermSheet.${sheet}.origination_fee_cents == 1750000 (tier1 100,000,000 x 0.0100 + tier2 100,000,000 x 0.0075)"
            - "Participation.${p1}.fee_share_cents == 583333 (round_half_up(1,750,000 x 66,666,667 / 200,000,000))"
            - "Participation.${p2}.fee_share_cents == 583333"
            - "LoanApplication.${app}.bank_hold_fee_cents == 583334 (remainder absorber: 1,750,000 - 583,333 - 583,333)"
            - "583333 + 583333 + 583334 == 1750000 (allocation conserves the fee exactly)"
            - "naive round_half_up(1,750,000 x 66,666,666 / 200,000,000) == 583333 != bank_hold_fee_cents — the pinned per-share-then-remainder order is the only consistent reading"
            - "LoanApplication.${app}.bank_hold_amount_cents == 66666666 (200,000,000 - 2 x 66,666,667)"

      - name: sizing_circular_dependency_pinned_order
        grounds:
          - calculations.maximum_sizing
          - entities.LoanApplication.fields.proposed_amount_cents
          - validations[priority=35]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order
          (distinct from modes (a) and (b) above): DSCR is computed on the
          REQUESTED amount at finalize-spreads, then the DSCR constraint is
          algebraically inverted to a principal cap without recomputing DSCR.
          Requested 50,000,000 fails policy (dscr_standard 0.6734 < 1.2500),
          yet submit-to-committee still succeeds with proposed_amount_cents
