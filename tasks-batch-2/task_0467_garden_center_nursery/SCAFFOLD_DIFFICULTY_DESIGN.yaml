            - "InventoryLot.${lot}.status == AVAILABLE (not DEPLETED — units restored)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: charge_account_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - state_machines.Order.UNPAID_to_ON_ACCOUNT
        distinguishing_aspect: |
          A charge-account call on a B2B order that is still DRAFT (never confirmed)
          AND would exceed credit fails the STATE check (ERR_ORDER_NOT_CONFIRMED,
          priority 7) before the business_fiscal credit check (priority 15) — pair
          {state, business_fiscal}.
        test_recipe:
          setup:
            - "B2B account with credit_limit_cents=100; a DRAFT order with one line whose net would be 5000 (over the limit). Order is never confirmed."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "LANDSCAPER_B2B", display_name: "Acme Land", ship_to_hardiness_zone: 6, credit_limit_cents: 100 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-5", name: "Mulch Bag", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 5000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
          trigger:
            - call: "POST /orders/${oid}/charge-account"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_ORDER_NOT_CONFIRMED (state, priority 7), NOT ERR_CREDIT_LIMIT_EXCEEDED (fiscal, priority 15)"
            - "HTTP status == 409"

      - name: add_line_referential_beats_safety
        grounds:
          - validations[priority=4]
          - validations[priority=9]
        distinguishing_aspect: |
          Adding a line with a non-existent product_id to an order whose account zone
          would also fail the hardiness gate returns ERR_PRODUCT_NOT_FOUND
          (business_referential, priority 4) before ERR_HARDINESS_ZONE_MISMATCH
          (business_safety, priority 9) — pair {business_referential, business_safety}.
        test_recipe:
          setup:
            - "RETAIL account ship_to_hardiness_zone=12; a DRAFT order. The body references a bogus product_id."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 12 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "00000000-0000-4000-8000-000000000000", qty: 1, acknowledge_hardiness_risk: false }
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PRODUCT_NOT_FOUND (business_referential, priority 4), NOT ERR_HARDINESS_ZONE_MISMATCH (priority 9)"
            - "HTTP status == 404"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_exact_boundary_on_charge_account
        grounds:
          - validations[priority=15]
          - state_machines.Order.UNPAID_to_ON_ACCOUNT
          - entities.Account.fields.credit_limit_cents
        distinguishing_aspect: |
          On POST /orders/{id}/charge-account, an order whose net_total exactly equals
          remaining credit (outstanding 0 + net 10000 <= limit 10000) succeeds, while
          net 10001 is rejected — the boundary is `<=` on the credit metric.
        test_recipe:
          setup:
            - "B2B account credit_limit_cents=10000, outstanding 0; order confirmed with net_total exactly 10000 (single line qty=1 @ 10000, no promo, no redeem)."
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "LANDSCAPER_B2B", display_name: "Acme Land", ship_to_hardiness_zone: 6, credit_limit_cents: 10000 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-6", name: "Pallet", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 10000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
