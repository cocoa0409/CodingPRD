            - "Facilitator.${f_probation_id}.cert_status == PROBATION"

      - name: retire_rejected_when_no_retirement_criterion_is_met
        claim_type: conditional_action
        grounds:
          - validations[priority=36]
          - errors.ERR_RETIREMENT_CRITERIA_NOT_MET
        distinguishing_aspect: "Retirement is conditional, not discretionary: a 2024-installed low element with forecast 2039-08-10, zero conditional inspections and outcome NONE answers ERR_RETIREMENT_CRITERIA_NOT_MET at 409 and stays SERVICEABLE."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; one healthy LOW_ELEMENT installed 2024-08-10 with no inspection history."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
