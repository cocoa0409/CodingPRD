      - name: second_submission_by_the_same_body_and_filing_on_a_closed_round_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 13 ERR_ROUND_NOT_OPEN]
          - validations[priority 14 ERR_BODY_ALREADY_SUBMITTED]
          - state_machines.ConsensusRound.PENDING_to_SUBMITTED
        distinguishing_aspect: |
          Each body submits once, and filing stops when the round leaves OPEN: the executive's second
          submit while the round is still OPEN returns ERR_BODY_ALREADY_SUBMITTED 409, and once the
          legislative submit has driven the round to COMPARED a fresh estimate returns
          ERR_ROUND_NOT_OPEN 409 — priority 13 now masks priority 14, so even a third executive
          submit reports ERR_ROUND_NOT_OPEN.
        test_recipe:
          setup:
            - "SHORT chain with an OPEN round and both bodies' PIT estimates filed; the executive has already submitted, so exec_submission_status is SUBMITTED and the round is still OPEN."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
