  # ===========================================================================
  - section: endpoints
    instances:

      - name: logical_clock_defaults_to_2026_08_01_and_then_follows_the_setter
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.SeasonProgram.fields.created_at
        distinguishing_aspect: "Before any clock call the server reads 2026-08-01T00:00:00Z, so created_at on the first write is that instant; after POST /_clock/set_current_utc every later timestamp is stamped from the new value, and the setter itself returns no entity body."
        test_recipe:
          setup:
            - "Empty database. POST /_clock/set_current_utc has not been called yet in this test."
          setup_api_calls:
            - call: "GET /officials"
              payload: {}
              as: OfficiatingDirector
          trigger:
            - call: "POST /season-programs"
              payload: { season_year: 2026 }
              as: OfficiatingDirector
              captures: { clk_sp_id: $.data.id, clk_sp_created: $.data.created_at }
            - call: "POST /season-programs/${clk_sp_id}/open"
              payload: {}
              as: OfficiatingDirector
              captures: { clk_sp_status: $.data.status, clk_sp_updated: $.data.updated_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T09:30:00Z" }
              as: TrainingCoordinator
            - call: "POST /officials"
              payload: { season_program_id: "${clk_sp_id}", full_name: "Clock Witness", position: "UMPIRE", seasons_experience: 4, home_market_code: "PHI" }
              as: OfficiatingDirector
              captures: { clk_off_id: $.data.id, clk_off_created: $.data.created_at }
          assert:
            - "the officials list in setup is empty, confirming a clean database"
            - "${clk_sp_created} == 2026-08-01T00:00:00Z — the declared default logical clock, not wall-clock time"
            - "${clk_sp_status} == OPEN and ${clk_sp_updated} == 2026-08-01T00:00:00Z"
            - "${clk_off_created} == 2026-08-15T09:30:00Z — every subsequent stamp comes from the setter"
            - "the setter is a shared operation: any declared role may call it, and its response carries no entity payload"

      - name: season_record_read_matches_the_posted_grade_arithmetic
        claim_type: computed_read
        grounds:
          - endpoints[GET /season-records]
          - endpoints[GET /season-records/{id}]
          - calculations.accuracy_index
        distinguishing_aspect: "The filtered list and the single read of the same OfficialSeasonRecord return identical computed values, and those values match the formula by hand: one posted MISSED_CALL/LOW play gives 100.00 - (0.75/1)*20 = 85.00 with accuracy_eligible false on the play-count floor."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, threshold 95.00 and min_graded_plays_for_eligibility 3."
            - "Game G1 is PLAYED and Dan's single MISSED_CALL/LOW grade is POSTED."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - *k_grade
            - *k_post_grade
          trigger:
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}", season_program_id: "${sp_id}" }
              as: Official
              as_user_id: "${dan_id}"
              captures:
                lst_rec_id: "$.data[0].id"
                lst_index: "$.data[0].accuracy_index"
                lst_wep: "$.data[0].weighted_error_points"
                lst_n: "$.data[0].graded_play_count"
                lst_variant: "$.data[0].accuracy_variant"
                lst_elig: "$.data[0].accuracy_eligible"
            - call: "GET /season-records/${lst_rec_id}"
              payload: {}
              as: GradingSupervisor
              captures:
                one_index: $.data.accuracy_index
                one_wep: $.data.weighted_error_points
                one_n: $.data.graded_play_count
                one_official: $.data.official_id
                one_program: $.data.season_program_id
            - call: "GET /season-records"
              payload: { accuracy_eligible: true }
              as: OfficiatingDirector
          assert:
            - "${lst_wep} == 0.75, ${lst_n} == 1 and ${lst_index} == 85.00 — 100.00 - (0.75 / 1) * 20.0"
            - "${lst_variant} == PROVISIONAL and ${lst_elig} == false (85.00 < 95.00 and 1 < 3, both legs fail)"
            - "${one_index} == ${lst_index}, ${one_wep} == ${lst_wep} and ${one_n} == ${lst_n} — the single read is the same row, not a re-derivation"
            - "${one_official} == ${dan_id} and ${one_program} == ${sp_id}"
            - "GET /season-records?accuracy_eligible=true returns an empty data array with total_count 0"

      - name: crew_assignment_filters_are_the_flat_reverse_lookups
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /crew-assignments]
          - complexity_profile.entity_topology
          - entities.CrewAssignment.fields.game_id
          - entities.CrewAssignment.fields.official_id
        distinguishing_aspect: "In a flat topology the game-to-crew and official-to-schedule relationships are discovered only through query filters on GET /crew-assignments, and game_id, official_id, status and position compose so each filter narrows the same underlying set."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 2."
            - "G1 (MIA vs BUF, 2026-09-13T17:00:00Z) has Dan CONFIRMED as UMPIRE and Rita PROPOSED as REFEREE."
            - "G2 (BUF vs DEN, 2026-09-18T21:00:00Z) has Dan PROPOSED as UMPIRE — his G1 window ends exactly where the G2 window opens."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_off_rita
            - *k_rita_exam
            - *k_rita_phys
            - *k_game
            - *k_game2
            - *k_assign_dan
            - *k_confirm_dan
            - *k_read_game_v
            - *k_assign_rita_ref
            - call: "POST /crew-assignments"
              payload: { game_id: "${g2_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g2_v0}" }
              as: CrewScheduler
              captures: { dan_g2_id: $.data.id }
          trigger:
            - call: "GET /crew-assignments"
              payload: { game_id: "${g_id}" }
              as: OfficiatingDirector
              captures: { g1_row0_id: "$.data[0].id", g1_row0_pos: "$.data[0].position", g1_row1_id: "$.data[1].id", g1_row1_pos: "$.data[1].position" }
            - call: "GET /crew-assignments"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures: { dan_row0_game: "$.data[0].game_id", dan_row1_game: "$.data[1].game_id" }
            - call: "GET /crew-assignments"
              payload: { game_id: "${g_id}", status: "CONFIRMED" }
              as: OfficiatingDirector
              captures: { conf_row0_id: "$.data[0].id", conf_row0_official: "$.data[0].official_id" }
            - call: "GET /crew-assignments"
              payload: { game_id: "${g_id}", position: "REFEREE" }
              as: OfficiatingDirector
              captures: { ref_row0_id: "$.data[0].id", ref_row0_status: "$.data[0].status" }
          assert:
            - "the game_id filter returns exactly two rows in created_at order: ${g1_row0_id} == ${ad_id} with ${g1_row0_pos} == UMPIRE and ${g1_row1_id} == ${ar_ref_id} with ${g1_row1_pos} == REFEREE"
            - "the official_id filter returns exactly two rows: ${dan_row0_game} == ${g_id} and ${dan_row1_game} == ${g2_id} — the same rows reached from the other side"
            - "game_id + status returns one row: ${conf_row0_id} == ${ad_id} with ${conf_row0_official} == ${dan_id}"
            - "game_id + position returns one row: ${ref_row0_id} == ${ar_ref_id} with ${ref_row0_status} == PROPOSED"
            - "no nested route such as /games/{id}/crew-assignments exists — the flat filtered list is the only reverse lookup"

      - name: training_records_subresource_is_scoped_to_its_parent_official
        claim_type: standard_crud
        grounds:
          - endpoints[POST /officials/{id}/training-records]
          - endpoints[GET /officials/{id}/training-records]
          - entities.TrainingRecord.fields.official_id
        distinguishing_aspect: "TrainingRecord is one of only two sub-resources: the list under one official never leaks another official's records, the record_type and passed filters compose, and official_id is taken from the path rather than the body."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN."
            - "Dan holds a RULES_EXAM (84.00, passed) and a PHYSICAL_TEST (79.00, passed)."
            - "Tom Wells holds only a RULES_EXAM (90.00, passed)."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_off_tom
            - *k_tom_exam
          trigger:
            - call: "GET /officials/${dan_id}/training-records"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_tr0_type: "$.data[0].record_type", dan_tr0_official: "$.data[0].official_id", dan_tr1_type: "$.data[1].record_type", dan_tr1_score: "$.data[1].score" }
            - call: "GET /officials/${dan_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST" }
              as: OfficiatingDirector
              captures: { dan_phys0_id: "$.data[0].id", dan_phys0_passed: "$.data[0].passed" }
            - call: "GET /officials/${tom_id}/training-records"
              payload: {}
              as: OfficiatingDirector
              captures: { tom_tr0_id: "$.data[0].id", tom_tr0_official: "$.data[0].official_id", tom_tr0_type: "$.data[0].record_type" }
            - call: "GET /officials/${tom_id}/training-records"
              payload: { record_type: "RULES_CLINIC" }
              as: OfficiatingDirector
          assert:
            - "Dan's list holds exactly two rows in created_at order: ${dan_tr0_type} == RULES_EXAM and ${dan_tr1_type} == PHYSICAL_TEST with ${dan_tr1_score} == 79.00"
            - "${dan_tr0_official} == ${dan_id} — official_id came from the path, and the payload never carried it"
            - "the record_type filter returns one row: ${dan_phys0_id} == ${tr_phys_id} with ${dan_phys0_passed} == true"
            - "Tom's list holds exactly one row with ${tom_tr0_official} == ${tom_id} and ${tom_tr0_type} == RULES_EXAM; ${tom_tr0_id} differs from ${tr_exam_id}, so Dan's records did not leak into the parent-scoped list"
            - "Tom's RULES_CLINIC filter returns an empty data array with total_count 0"

  # ===========================================================================
  - section: errors
    instances:

      - name: every_not_found_error_is_triggerable_with_an_unknown_id
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_SEASON_PROGRAM_NOT_FOUND]
          - errors[ERR_OFFICIAL_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_GAME_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_PLAY_GRADE_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - errors[ERR_REPLAY_STATION_NOT_FOUND]
          - errors[ERR_REPLAY_REVIEW_NOT_FOUND]
          - errors[ERR_POOL_REPORT_NOT_FOUND]
          - errors[ERR_DISCIPLINE_ACTION_NOT_FOUND]
        distinguishing_aspect: "All eleven not-found codes are reachable: each entity's single read with the fixed unknown id ffffffff-ffff-ffff-ffff-ffffffffffff returns its own 404 code, and an unresolvable FK in a body reaches the same code as an unresolvable path id."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN so that body FK checks are not short-circuited by the program gate."
            - "The literal ffffffff-ffff-ffff-ffff-ffffffffffff is never minted by the server."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
          trigger:
            - call: "GET /season-programs/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: OfficiatingDirector
              captures: { nf_program: $.data.error_id }
            - call: "GET /officials/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: OfficiatingDirector
              captures: { nf_official: $.data.error_id }
            - call: "GET /advancement-applications/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: FieldEvaluator
