      - name: a_ballot_may_only_name_an_entry_from_the_currently_accepted_list
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_BALLOT_VOTER_NOT_ON_ACCEPTED_LIST
          - validations[priority=10]
          - entities.VoterList.fields.status
