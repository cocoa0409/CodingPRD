      - name: corner_typed_404s_across_the_remaining_collections
        claim_type: triggerable
        grounds:
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_CREDENTIAL_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_SETTLEMENT_RUN_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
          - errors[ERR_CLIENT_NOT_FOUND]
        distinguishing_aspect: "The six not-found ids that the entities section did not reach are each triggered from their own GET route with the same never-minted UUID, so no collection falls back to another collection's error id."
        test_recipe:
          setup:
            - "Empty database. MISSING_ID is the literal 00000000-0000-4000-8000-000000000000."
          setup_api_calls: []
          trigger:
            - call: "GET /host-agency/advisor-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostOperations
              captures: { err_agreement: $.data.error_id }
            - call: "GET /host-agency/compliance-credentials/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_credential: $.data.error_id }
            - call: "GET /host-agency/commission-claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostOperations
              captures: { err_claim: $.data.error_id }
            - call: "GET /host-agency/settlement-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { err_run: $.data.error_id }
            - call: "GET /host-agency/advisor-statements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { err_statement: $.data.error_id }
            - call: "GET /host-agency/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostOperations
              captures: { err_client: $.data.error_id }
          assert:
            - "all six calls return HTTP 404"
            - "err_agreement == ERR_AGREEMENT_NOT_FOUND"
            - "err_credential == ERR_CREDENTIAL_NOT_FOUND"
            - "err_claim == ERR_CLAIM_NOT_FOUND"
            - "err_run == ERR_SETTLEMENT_RUN_NOT_FOUND"
            - "err_statement == ERR_STATEMENT_NOT_FOUND"
            - "err_client == ERR_CLIENT_NOT_FOUND"
            - "every response still carries the error envelope with meta.api_request_id"

