          - state_machines.TitleCurativeItem.OPEN_to_WAIVED_WITH_ENDORSEMENT
          - state_machines.TitleCurativeItem.OPEN_to_RESERVED_AS_EASEMENT
        distinguishing_aspect: "Three resolved TitleCurativeItem rows exist on the parcel but only the CURED one contributes to cure_deduction_cents, and it contributes its ACTUAL 250000 rather than its 400000 estimate: minimum_price_cents == 99750000. An implementation that summed every resolved row's estimate would produce 85600000, one that summed every resolved row's estimate except the cured actual would produce 85750000, and one that used the cured row's estimate would produce 99600000."
