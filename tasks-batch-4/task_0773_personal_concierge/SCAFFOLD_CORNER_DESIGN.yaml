            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "weekly groceries", is_standing: true, cadence: "WEEKLY" }, as: Member, as_user_id: "${m_id}", captures: { tpl_id: "$.data.id" } }
          trigger:
