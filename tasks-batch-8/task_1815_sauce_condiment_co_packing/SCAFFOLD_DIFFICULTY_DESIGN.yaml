            - { call: "POST /copack/production-runs", payload: { formula_id: "${f1}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", packaging_requirements: [] }, as: OpsAdmin, captures: { r1: "$.data.id"} }
            - { call: "POST /copack/production-runs/${r1}/confirm", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /copack/production-runs/${r1}/complete", payload: { actual_units_produced: 2000, measured_ph: 4.2, measured_water_activity: 0.88 }, as: OpsAdmin }
            - { call: "GET /copack/production-runs/${r1}", payload: {}, as: OpsAdmin, captures: { r_st: "$.data.status", r_fin: "$.data.final_charge_cents"} }
            - { call: "GET /copack/quality-holds", payload: { production_run_id: "${r1}" }, as: QAReviewer }
          assert:
