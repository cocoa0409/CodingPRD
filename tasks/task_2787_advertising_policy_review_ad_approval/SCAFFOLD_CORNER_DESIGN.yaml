      - name: error_catalog_a_restricted_account_cannot_open_restricted_or_political_creatives
        claim_type: Error triggerability
        grounds:
          - validations[priority=82].ERR_ADVERTISER_RESTRICTED_CATEGORY
          - state_machines.Advertiser.account_status.ACTIVE_to_RESTRICTED
          - endpoints.POST_/ad-policy/advertisers/{id}/enforcement-actions
        distinguishing_aspect: |
          A RESTRICTED account is not frozen: the priority 82 check is category-scoped, so the
          same advertiser is refused a RESTRICTED-class creative and a political creative in
          the same second that a plain REGULATED creative is accepted. Confusing RESTRICTED
          with SUSPENDED (priority 52) would reject all three.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00) and rule FIN_CREDIT (REGULATED, weight 4.00)."
            - "One advertiser verified on identity and business standing (version 3), then given a manual RESTRICTION enforcement action at the logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Northline Spirits LLC", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
              captures: { adv_v: "$.data.version" }
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "RESTRICTION", trigger_reason: "Repeated late responses to policy correspondence", expected_advertiser_version: "${adv_v}" }
              as: PolicyAdmin
              captures: { enf_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Cask finish", body_text: "A restricted category creative attempted while the account is restricted.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.northline.example/cask", display_url: "https://www.northline.example/cask" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_restricted: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Vote yes", body_text: "A political creative attempted while the account is restricted.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.northline.example/vote", display_url: "https://www.northline.example/vote", political_flag: true, disclaimer_text: "Paid for by Northline Spirits LLC" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_political: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Tasting room financing", body_text: "A plain regulated creative that the restriction does not touch.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.northline.example/finance", display_url: "https://www.northline.example/finance" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_ok: "$.data.id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions/${enf_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "Both refused creates return HTTP 409 with error_id ERR_ADVERTISER_RESTRICTED_CATEGORY"
            - "The third create returns HTTP 201: AdCreative.${cr_ok}.review_status == DRAFT with serving_eligible false and blocking_reason_codes [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED]"
            - "Advertiser.${adv_id}.account_status == RESTRICTED and version == 4 (the manual action re-derived the status once)"
            - "EnforcementAction.${enf_id} has origin MANUAL, status ACTIVE, severity_index_at_issue 0.00 (no violations on file), effective_from 2026-08-01T00:00:00Z and effective_until 2026-09-30T00:00:00Z from ENFORCEMENT_DURATION_DAYS.RESTRICTION of 60"
            - "GET /ad-policy/ad-creatives?advertiser_id=${adv_id} reports total_count == 1 — the two refusals wrote nothing"

      - name: error_catalog_limited_country_list_must_be_a_non_empty_duplicate_free_subset
        claim_type: Error triggerability
        grounds:
          - validations[priority=71].ERR_INVALID_LIMITED_COUNTRIES
          - state_machines.AdCreative.review_status.PENDING_MANUAL_REVIEW_to_APPROVED_LIMITED
        distinguishing_aspect: |
          All three malformed lists are 422 ERR_INVALID_LIMITED_COUNTRIES rather than 400
          ERR_INVALID_REQUEST: the emptiness, duplicate and subset tests are business rules at
          priority 71, deliberately placed after the request-shape ladder. The successful
          retry pins approved_under_certification_id to null, because no retained country
          demands a license for this rule.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, requires_certification false, requires_disclaimer false, auto 0.90, manual 0.20, default_queue STANDARD) with no country override."
            - "One verified advertiser; one creative targeting [CA, US] submitted and screened at confidence 0.50; one reviewer on STANDARD authorised for CA and US who claims the task."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, requires_certification: false, requires_disclaimer: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R. Alvarez", queue_specialties: ["STANDARD"], country_authorizations: ["CA", "US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Cross border offer", body_text: "One credit offer aimed at both Canada and the United States.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["CA", "US"], landing_page_url: "https://www.beaconlending.example/na", display_url: "https://www.beaconlending.example/na" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.50, matched_snippet: "credit offer" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: [], note: "Empty retained list" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { err_empty: "$.data.error_id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: ["US", "US"], note: "Duplicated retained country" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { err_dup: "$.data.error_id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: ["MX", "US"], note: "Retained country outside the creative's targets" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { err_subset: "$.data.error_id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: ["US"], note: "Approved for the United States only" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "All three malformed decisions return HTTP 422 with error_id ERR_INVALID_LIMITED_COUNTRIES"
            - "After the three refusals ReviewTask.${task_id}.status is still CLAIMED with resolution PENDING and Reviewer.${rev_id}.claimed_task_count is still 1"
            - "The fourth decision returns HTTP 200: AdCreative.${cr_id}.review_status == APPROVED_LIMITED with limited_country_codes [US] and approved_under_certification_id null (FIN_CREDIT demands no license, so certification_coverage pins nothing)"
            - "Reviewer.${rev_id}.claimed_task_count drops to 0 and ReviewTask.${task_id}.resolution == APPROVE_WITH_LIMITS"

      - name: error_catalog_evidence_certification_must_belong_to_the_appealing_advertiser
        claim_type: Error triggerability
        grounds:
          - validations[priority=88].ERR_CERTIFICATION_OWNER_MISMATCH
          - endpoints.POST_/ad-policy/appeals
        distinguishing_aspect: |
          The certification id resolves, the appeal window is open and no appeal exists, so the
          only defect left is ownership: attaching another advertiser's ACTIVE licence is 422
          ERR_CERTIFICATION_OWNER_MISMATCH rather than 404, and the same appeal succeeds once
          the foreign evidence is dropped.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer false, auto 0.90, manual 0.20, default_queue REGULATED_CERT)."
            - "Advertiser A (verified) owns the disapproved creative; advertiser B (verified) holds an ACTIVE ALC_SPIRITS certification for US over [2026-07-01, 2026-12-31)."
            - "Advertiser A's creative is disapproved with reason_codes [CERT_MISSING], leaving an ISSUED notice with appeal_deadline_at 2026-08-04T00:00:00Z; the clock stays at 2026-08-01T00:00:00Z so the window is open."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Northline Spirits LLC", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_a: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_a}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_a}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Harbour Cellars Ltd", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_b: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_b}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_b}", policy_rule_id: "${alc_id}", license_number: "TTB-HC-2026-04", issuing_country_code: "US", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_b}"
              captures: { cert_b: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "C. Mbeki", queue_specialties: ["REGULATED_CERT"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_a}", headline: "Cask finish", body_text: "A spirit campaign disapproved for missing licence evidence.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.northline.example/cask", display_url: "https://www.northline.example/cask" }
              as: Advertiser
              as_user_id: "${adv_a}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_a}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.50, matched_snippet: "cask finish spirit" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["CERT_MISSING"], note: "No licence on file for this advertiser" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
          trigger:
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice_id}", justification: "Attaching a licence that belongs to a different advertiser.", evidence_certification_id: "${cert_b}" }
              as: Advertiser
              as_user_id: "${adv_a}"
              captures: { err_owner: "$.data.error_id" }
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice_id}", justification: "Our own licence application was pending at review time; please re-review." }
              as: Advertiser
              as_user_id: "${adv_a}"
              captures: { appeal_id: "$.data.id" }
            - call: "GET /ad-policy/disapproval-notices/${notice_id}"
