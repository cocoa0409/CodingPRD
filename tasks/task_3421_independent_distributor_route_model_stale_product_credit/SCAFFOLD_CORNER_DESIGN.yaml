  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_plan_create_stale_then_fresh_supersedes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[financing-create-stale-agreement]
          - errors.ERR_STALE_VERSION
          - state_machines.FinancingPlan.DRAFT_to_SUPERSEDED
        distinguishing_aspect: "OCC on RouteAgreement.version: a second plan create carrying the pre-first-create version is 412 ERR_STALE_VERSION; re-reading the agreement and resubmitting with the fresh version succeeds and supersedes the first DRAFT plan."
        test_recipe:
          setup: ["Financed agreement DRAFT (version 1 after creation); one plan already created with expected_agreement_version 1 (agreement now version 2)."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr_fin
            - *c_plan
          trigger:
            - call: "POST /agreements/${agrf_id}/financing-plans"
              payload: { financier_type: "COMPANY", principal_cents: 52000, annual_interest_rate: 0.10, term_weeks: 10, expected_agreement_version: "${agrf_v0}" }
              as: CreditAnalyst
              captures: { occ_err: $.data.error_id }
            - call: "GET /agreements/${agrf_id}"
              payload: {}
              as: CreditAnalyst
              captures: { agrf_vnow: $.data.version }
            - call: "POST /agreements/${agrf_id}/financing-plans"
              payload: { financier_type: "EXTERNAL_LENDER", lender_name: "RouteCapital Finance", principal_cents: 52000, annual_interest_rate: 0.10, term_weeks: 10, expected_agreement_version: "${agrf_vnow}" }
              as: CreditAnalyst
              captures: { plan2_id: $.data.id }
          assert:
            - "the stale create returns 412 and occ_err == ERR_STALE_VERSION"
            - "the fresh create succeeds (201) and FinancingPlan.${plan2_id}.financier_type == EXTERNAL_LENDER with lender_name RouteCapital Finance"
            - "FinancingPlan.${plan_id}.status == SUPERSEDED"
            - "RouteAgreement.${agrf_id}.version == 3 (create 1, plan1 create 2, plan2 create 3; the 412 attempt bumped nothing)"

      - name: occ_confirm_stale_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-confirm-stale-production-day]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on ProductionDay.version: after order A's confirm advances the day version 1 -> 2, order B's confirm carrying version 1 fails with 412 ERR_STALE_VERSION while order B remains SUBMITTED and allocated_units stays 25."
        test_recipe:
          setup: ["Production day 2026-09-04 (version 1); two SUBMITTED orders A (25 units) and B (10 units) for 2026-09-04."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
            - *c_day0904
            - &c_order_wht25
              call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "WHT-24", qty: 25 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_25_id: $.data.id }
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "BUN-12", qty: 10 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_10_id: $.data.id }
            - call: "POST /orders/${ord_25_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_10_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /orders/${ord_25_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
            - call: "POST /orders/${ord_10_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
              captures: { occ_err2: $.data.error_id }
          assert:
            - "order A confirm succeeds; ProductionDay.${day0904_id}.allocated_units == 25 and version == 2"
            - "order B confirm with the stale version returns 412 and occ_err2 == ERR_STALE_VERSION"
            - "DailyOrder.${ord_10_id}.status == SUBMITTED and allocated_units stays 25"

      - name: orders_list_pagination_filter_interaction
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/distributors/{id}/orders
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three orders (two DRAFT, one SUBMITTED), limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status=DRAFT filter narrows total_count to 2 — total_count always counts the filtered set, not the page."
        test_recipe:
          setup: ["Active cash agreement; three orders for 2026-09-04/05/08, the third submitted."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr
            - *c_activate
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "WHT-24", qty: 1 }] }
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-05", lines: [{ sku: "WHT-24", qty: 2 }] }
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-08", lines: [{ sku: "WHT-24", qty: 3 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_p3: $.data.id }
            - call: "POST /orders/${ord_p3}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "GET /distributors/${dist_id}/orders"
              payload: { limit: 2, offset: 0 }
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "status=DRAFT returns exactly 2 rows with total_count == 2 and has_more == false"
            - "no params: returns 3 rows with limit defaulting to 10 and offset to 0"

