              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c15_cl: "$.data.id", c15_clstat: "$.data.status" }
            - call: "POST /floorplan/credit-lines/${c15_cl}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${c15_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${c15_d}", credit_line_id: "${c15_cl}", vin: "1CRNINITIALUNIT01", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${c15_d}"
              captures: { c15_u: "$.data.id", c15_ustat: "$.data.funding_status", c15_tstat: "$.data.title_custody_status" }
            - call: "POST /floorplan/units/${c15_u}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-C15" }
