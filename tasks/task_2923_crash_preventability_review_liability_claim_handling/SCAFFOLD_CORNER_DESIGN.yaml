          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: "One request violating authentication, body shape, path resolution and body-FK resolution at once reports ERR_UNAUTHENTICATED, and peeling the violations off one at a time walks the ladder 1 -> 5 -> 10 -> 11 in that order."
        test_recipe:
