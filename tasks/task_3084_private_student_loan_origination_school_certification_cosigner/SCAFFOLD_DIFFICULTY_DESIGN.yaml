# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3084_private_student_loan_origination_school_certification_cosigner
#
# One block per §0.5 Difficulty Rule; >= 2 instances per rule (>= 18 total).
# Every instance is a test prototype: setup_api_calls + trigger are transcribed
# verbatim into pytest fixtures by the downstream unit-test-generator.
#
# SHARED PREAMBLE CONVENTION (used by the instances below)
#   The origination preamble always follows the same shape, because the
#   underwriting decision returns the APPLICATION, not the Loan:
#     1. POST /borrowers                                   -> brw
#     2. POST /schools                                     -> sch
#     3. POST /loan-policies                               -> pol
#     4. POST /borrowers/{brw}/cosigners                   -> cos
#     5. POST /cosigners/{cos}/reunderwrite
#     6. POST /loan-applications                           -> app
#     7. POST /loan-applications/{app}/decision {APPROVE}
#     8. GET  /loan-applications/{app}/loans               -> loan = $.data[0].id
#   A GET /loans/{loan} immediately before EVERY OCC write re-reads the live
#   version, because §1.3 recomputes and §1.7 cascades bump Loan.version
#   between calls. No expected_loan_version literal is ever written.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: combined_credit_provisional_vs_final_tier_divergence
        grounds:
          - calculations.combined_credit_underwriting.variants.provisional
          - calculations.combined_credit_underwriting.variants.final
          - state_machines.LoanApplication.SUBMITTED_to_UNDER_REVIEW
          - state_machines.LoanApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "The SAME borrower/cosigner score pair prices the file at tier A provisionally (max of the two scores, 780) but at tier B finally (0.55/0.45 blend, 717), so margin_rate_pct and the derived plan payment differ purely by which of the two valid evaluation orders the request runs under."
        test_recipe:
          setup:
            - "Fresh database; logical clock at its fixed server default 2026-09-01T00:00:00Z."
            - "GRADUATE policy; borrower score 640, cosigner score 780 and ELIGIBLE."
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Dana Borrower", email: "dana@example.com", state_code: "CA", program_level: "GRADUATE", credit_score: 640, dti_ratio: 0.31 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Bay State University", school_code: "003001", state_code: "CA", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-GR-2026", program_level: "GRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Carla Cosigner", email: "carla@example.com", state_code: "CA", relationship: "PARENT", credit_score: 780, credit_history_months: 168, dti_ratio: 0.22 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 780, dti_ratio: 0.22 }
              as: Cosigner
              as_user_id: "${cos}"
          trigger:
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 1205000, cost_of_attendance_cents: 1500000, other_aid_cents: 290000, interest_accrual_option: "IMMEDIATE", repayment_term_months: 180 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id, app_tier_provisional: $.data.tier, app_score_provisional: $.data.combined_credit_score }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
              captures: { app_tier_final: $.data.tier, app_score_final: $.data.combined_credit_score, app_margin_final: $.data.margin_rate_pct }
          assert:
            - "${app_score_provisional} == 780 and ${app_tier_provisional} == A"
            - "${app_score_final} == 717 and ${app_tier_final} == B"
            - "${app_margin_final} == 3.75"
            - "LoanApplication.${app}.approved_amount_cents == 1205000 and certified_limit_cents == 1210000"

      - name: in_school_accrual_per_period_vs_consolidated_divergence
        grounds:
          - calculations.in_school_interest_accrual_dual.variants.accrued_per_period
          - calculations.in_school_interest_accrual_dual.variants.accrued_consolidated
          - endpoints.POST_/private-student-loans/loans/{id}/accrual-entries
          - endpoints.POST_/private-student-loans/loans/{id}/deferment-projection
        distinguishing_aspect: "For the identical principal 805000 and the identical 6-month window the per-period rounding order books 15096 cents while the consolidated rounding order projects 15094 cents, so the loan's booked unpaid_interest_cents exceeds its own deferment projection by exactly 2 cents."
        test_recipe:
          setup:
            - "An IN_SCHOOL loan disbursed at 805000 cents with effective_rate_pct 3.75 and no capitalization yet."
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Erin Borrower", email: "erin@example.com", state_code: "TX", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.24 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Lone Star A&M", school_code: "003002", state_code: "TX", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-UG-2026", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Frank Cosigner", email: "frank@example.com", state_code: "TX", relationship: "PARENT", credit_score: 780, credit_history_months: 200, dti_ratio: 0.18 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 780, dti_ratio: 0.18 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 805000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "IMMEDIATE", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "GET /private-student-loans/loan-applications/${app}/loans"
              payload: {}
              as: Underwriter
              captures: { loan: "$.data[0].id" }
            - call: "POST /private-student-loans/loan-applications/${app}/school-certifications"
              payload: { academic_period_label: "2026-FALL", certified_amount_cents: 805000, certified_enrollment_status: "IN_SCHOOL", period_end_date: "2026-12-20T00:00:00Z" }
              as: School
              as_user_id: "${sch}"
              captures: { cert: $.data.id }
            - call: "POST /private-student-loans/school-certifications/${cert}/certify"
              payload: { certified_amount_cents: 805000, certified_enrollment_status: "IN_SCHOOL" }
              as: School
              as_user_id: "${sch}"
            - call: "GET /private-student-loans/loans/${loan}"
              payload: {}
              as: Servicer
              captures: { v_dsb: $.data.version }
            - call: "POST /private-student-loans/loans/${loan}/disbursements"
              payload: { academic_period_label: "2026-FALL", period_start_date: "2026-09-02T00:00:00Z", period_end_date: "2026-12-20T00:00:00Z", scheduled_date: "2026-09-15T00:00:00Z", amount_cents: 805000, expected_loan_version: "${v_dsb}" }
              as: Servicer
              captures: { dsb: $.data.id }
            - call: "POST /private-student-loans/disbursements/${dsb}/release"
              payload: {}
              as: Servicer
          trigger:
            - call: "POST /private-student-loans/loans/${loan}/accrual-entries"
              payload: { entry_date: "2026-09-30T00:00:00Z", window_months: 6 }
              as: Servicer
            - call: "POST /private-student-loans/loans/${loan}/deferment-projection"
              payload: { window_months: 6 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { proj_val: $.data.projected_unpaid_interest_cents }
          assert:
            - "Loan.${loan}.principal_cents == 805000 and Loan.${loan}.loan_status == IN_SCHOOL"
            - "Loan.${loan}.unpaid_interest_cents == 15096 (six monthly roundings of 2516 each, summed)"
            - "${proj_val} == 15094 (one rounding of 805000 * 0.0375 * 0.5)"
            - "Loan.${loan}.unpaid_interest_cents - ${proj_val} == 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: capitalized_interest_gate_at_the_exact_cap_boundary
        grounds:
          - calculations.capitalized_interest_cap
          - calculations.capitalized_interest_cap.variants.capped
          - calculations.capitalized_interest_cap.variants.uncapped_fits
          - state_machines.Loan.GRACE_to_REPAYMENT
        distinguishing_aspect: "Mode (a) with a nested min at an exact boundary: when unpaid_interest_cents equals 80500 and the cap is exactly 80500 the inclusive min capitalizes the whole 80500 (variant uncapped_fits), whereas one extra cent of accrued interest would flip the variant to capped and strand that cent."
        test_recipe:
          setup:
            - "A loan in GRACE, principal 805000, unpaid_interest_cents exactly 80500, cap exactly 80500, one ACTIVE STANDARD plan."
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Gina Borrower", email: "gina@example.com", state_code: "NY", program_level: "UNDERGRADUATE", credit_score: 690, dti_ratio: 0.25 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Hudson Polytechnic", school_code: "003003", state_code: "NY", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-UG-CAP", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Hank Cosigner", email: "hank@example.com", state_code: "NY", relationship: "PARENT", credit_score: 770, credit_history_months: 180, dti_ratio: 0.19 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 770, dti_ratio: 0.19 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 805000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "IMMEDIATE", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "GET /private-student-loans/loan-applications/${app}/loans"
              payload: {}
              as: Underwriter
              captures: { loan: "$.data[0].id" }
            - call: "POST /private-student-loans/loan-applications/${app}/school-certifications"
              payload: { academic_period_label: "2026-FALL", certified_amount_cents: 805000, certified_enrollment_status: "IN_SCHOOL", period_end_date: "2026-12-20T00:00:00Z" }
              as: School
              as_user_id: "${sch}"
              captures: { cert: $.data.id }
            - call: "POST /private-student-loans/school-certifications/${cert}/certify"
              payload: { certified_amount_cents: 805000, certified_enrollment_status: "IN_SCHOOL" }
              as: School
              as_user_id: "${sch}"
            - call: "GET /private-student-loans/loans/${loan}"
              payload: {}
              as: Servicer
              captures: { v_dsb: $.data.version }
            - call: "POST /private-student-loans/loans/${loan}/disbursements"
              payload: { academic_period_label: "2026-FALL", period_start_date: "2026-09-02T00:00:00Z", period_end_date: "2026-12-20T00:00:00Z", scheduled_date: "2026-09-15T00:00:00Z", amount_cents: 805000, expected_loan_version: "${v_dsb}" }
              as: Servicer
              captures: { dsb: $.data.id }
            - call: "POST /private-student-loans/disbursements/${dsb}/release"
              payload: {}
              as: Servicer
            - call: "POST /private-student-loans/loans/${loan}/enrollment-status"
              payload: { enrollment_status: "GRADUATED" }
              as: School
              as_user_id: "${sch}"
            - call: "POST /private-student-loans/loans/${loan}/accrual-entries"
              payload: { entry_date: "2026-12-31T00:00:00Z", window_months: 6 }
              as: Servicer
            - call: "GET /private-student-loans/loans/${loan}"
              payload: {}
              as: Servicer
              captures: { v_plan: $.data.version, pre_interest: $.data.unpaid_interest_cents, pre_cap: $.data.max_allowed_capitalization_cents }
            - call: "POST /private-student-loans/loans/${loan}/repayment-plans"
              payload: { plan_type: "STANDARD", term_months: 120, expected_loan_version: "${v_plan}" }
              as: Borrower
              as_user_id: "${brw}"
              captures: { plan: $.data.id }
            - call: "POST /private-student-loans/repayment-plans/${plan}/approve"
              payload: {}
              as: Servicer
          trigger:
            - call: "POST /private-student-loans/loans/${loan}/enter-repayment"
              payload: {}
              as: Servicer
          assert:
            - "${pre_interest} == 80500 and ${pre_cap} == 80500 — the boundary case is exactly on the cap"
            - "Loan.${loan}.lifetime_capitalized_interest_cents == 80500"
            - "Loan.${loan}.unpaid_interest_cents == 0 — the inclusive min leaves nothing stranded"
            - "Loan.${loan}.principal_cents == 885500 and Loan.${loan}.current_balance_cents == 885500"
            - "Loan.${loan}.loan_status == REPAYMENT"

      - name: certified_limit_waterfall_allocation_order_pins_the_partial_period
        grounds:
          - calculations.certification_limit_waterfall
          - calculations.certification_limit_waterfall.variants.ceiling_binds
          - endpoints.POST_/private-student-loans/school-certifications/{id}/certify
          - state_machines.SchoolCertification.REQUESTED_to_PARTIAL_CERTIFIED
        distinguishing_aspect: "Mode (c) mutually-referential ordering: the ceiling 920000 is consulted while the certified total is still being built, so two requests of 500000 each resolve 500000/420000 in (certified_date, created_at) order; reversing the arrival order would produce 420000/500000 instead."
        test_recipe:
          setup:
            - "An approved application with cost_of_attendance_cents 1000000 and other_aid_cents 80000, so certified_limit_cents is 920000."
            - "Two certification requests for 500000 each, filed FALL then SPRING."
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Iris Borrower", email: "iris@example.com", state_code: "IL", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.23 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Prairie State College", school_code: "003004", state_code: "IL", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-UG-WF", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Jane Cosigner", email: "jane@example.com", state_code: "IL", relationship: "GRANDPARENT", credit_score: 795, credit_history_months: 220, dti_ratio: 0.17 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 795, dti_ratio: 0.17 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 1000000, cost_of_attendance_cents: 1000000, other_aid_cents: 80000, interest_accrual_option: "INTEREST_ONLY", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "GET /private-student-loans/loan-applications/${app}/loans"
              payload: {}
              as: Underwriter
              captures: { loan: "$.data[0].id" }
            - call: "POST /private-student-loans/loan-applications/${app}/school-certifications"
              payload: { academic_period_label: "2026-FALL", certified_amount_cents: 500000, certified_enrollment_status: "IN_SCHOOL", period_end_date: "2026-12-20T00:00:00Z" }
              as: School
              as_user_id: "${sch}"
              captures: { cert1: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/school-certifications"
              payload: { academic_period_label: "2027-SPRING", certified_amount_cents: 500000, certified_enrollment_status: "IN_SCHOOL", period_end_date: "2027-05-15T00:00:00Z" }
              as: School
              as_user_id: "${sch}"
              captures: { cert2: $.data.id }
          trigger:
            - call: "POST /private-student-loans/school-certifications/${cert1}/certify"
              payload: { certified_amount_cents: 500000, certified_enrollment_status: "IN_SCHOOL" }
              as: School
              as_user_id: "${sch}"
            - call: "POST /private-student-loans/school-certifications/${cert2}/certify"
              payload: { certified_amount_cents: 500000, certified_enrollment_status: "IN_SCHOOL" }
              as: School
              as_user_id: "${sch}"
              captures: { c2_amount: $.data.certified_amount_cents, c2_status: $.data.certification_status }
          assert:
            - "SchoolCertification.${cert1}.certified_amount_cents == 500000 and certification_status == CERTIFIED"
            - "${c2_amount} == 420000 and ${c2_status} == PARTIAL_CERTIFIED"
            - "Loan.${loan}.certified_amount_cents == 920000"
            - "LoanApplication.${app}.certified_limit_cents == 920000 and was never exceeded, so ERR_CERTIFICATION_LIMIT_EXCEEDED was never raised"
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: repayment_plan_supersede_chain_on_one_loan
        grounds:
          - state_machines.RepaymentPlan.ACTIVE_to_SUPERSEDED
          - state_machines.RepaymentPlan.PENDING_APPROVAL_to_ACTIVE
          - state_machines.Loan.REPAYMENT_to_PAID_IN_FULL
          - concurrency_rules[plan-create-stale-loan]
        distinguishing_aspect: "Two non-linear machines on DIFFERENT entities: the RepaymentPlan column is branching — its ACTIVE member is legitimately re-entered by a later approval while the superseded row is pinned — and the Loan column reaches PAID_IN_FULL only through REPAYMENT, so neither is an A-to-B-to-C pipeline."
        test_recipe:
          setup:
            - "A loan in REPAYMENT holding one ACTIVE STANDARD plan; a second EXTENDED plan submitted but still PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Ada Borrower", email: "ada@example.com", state_code: "VT", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.24 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Green Mountain College", school_code: "003010", state_code: "VT", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-UG-DEF", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5, allows_standalone_borrower: false }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Cara Cosigner", email: "cara@example.com", state_code: "VT", relationship: "PARENT", credit_score: 760, credit_history_months: 170, dti_ratio: 0.2 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 760, dti_ratio: 0.2 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 805000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "DEFERRED", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "GET /private-student-loans/loan-applications/${app}/loans"
              payload: {}
              as: Underwriter
