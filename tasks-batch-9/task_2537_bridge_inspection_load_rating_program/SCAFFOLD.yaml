    roles: [ProgramAdmin, BridgeInspector, QaReviewer, RatingEngineer, DistrictEngineer, PermitOfficer, FhwaReviewer]
    code: 200
    input: ["bridge_id?", "source_inspection_id?", "element_condition_id?", "restriction_authorized_by_id?", "severity?", "finding_status?", "notification_status?", "restriction_action?", "notification_late?", "limit?", "offset?"]
