# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1383: Peanut Buying Point & Shelling.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Stubs (excluded_because) cite §1.8 instances that already cover the corner.
# =============================================================================

scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: buying_point_without_warehouses_starts_suspended
        claim_type: computed_fields
        grounds: ["entities.BuyingPoint.fields.intake_posture", "calculations.buying_point_posture"]
        distinguishing_aspect: "A buying point with zero warehouses has free_total == 0, so computed posture is SUSPENDED at creation (not OPEN) — creation-time computed-field correctness."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
          trigger:
            - { call: "GET /buying-points/${bp}", payload: {}, as: BuyingPointAdmin }
          assert:
            - "BuyingPoint.${bp}.intake_posture == SUSPENDED (no warehouses => free_total == 0)"
            - "BuyingPoint.${bp}.ops_run_index == 0 and version == 1"

      - name: grower_created_with_system_defaults
        claim_type: defaults
        grounds: ["entities.Grower.fields.status", "entities.Grower.fields.no_show_strikes"]
        distinguishing_aspect: "Server defaults apply on create: status ACTIVE, no_show_strikes 0, version 1; client cannot inject them."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
          trigger:
            - { call: "GET /buying-points/growers/${g1}", payload: {}, as: BuyingPointAdmin }
          assert:
            - "Grower.${g1}.status == ACTIVE and no_show_strikes == 0"
            - "Grower.${g1}.version == 1; id is a bare UUID (no type prefix); created_at has 3 fractional digits"

      - name: load_create_missing_required_grower_id
        claim_type: required_fields
        grounds: ["entities.FarmerStockLoad.fields.grower_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field grower_id is a schema error (priority 2) — fires before any existence or posture check, even with no warehouses at all."
        test_recipe:
          setup: ["Empty DB (no buying point needed: schema validation precedes existence/state)"]
          setup_api_calls:
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
          trigger:
            - call: "POST /buying-points/loads"
              payload: { crop_year: 2026 }
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: load_create_extra_field_rejected
        claim_type: system_fields
        grounds: ["entities.FarmerStockLoad.fields.status", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied system/computed keys (status) in a create body are rejected as unknown fields — clients cannot smuggle state."
        test_recipe:
          setup: ["BP + WH-G 2000 (posture OPEN); grower G1"]
          setup_api_calls:
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026, status: "STORED" }
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400 (unknown field status)"

      - name: load_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but non-existent UUID yields ERR_NOT_FOUND 404 with the error envelope."
        test_recipe:
          setup: ["BP exists"]
          setup_api_calls:
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
          trigger:
            - call: "GET /buying-points/loads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: grade_sheet_pct_over_100_rejected
        claim_type: type_constraints
        grounds: ["entities.GradeSheet.fields.moisture_pct", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Percent fields are range-constrained to [0,100]; 100.01 is a schema error."
        test_recipe:
          setup: ["BP + FALL-2026 schedule ACTIVE; WH-G 2000; grower G1; load A WEIGHED 25.0t"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
          trigger:
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 100.01, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
            - "FarmerStockLoad.${loadA}.status remains WEIGHED"

      - name: quota_history_duplicate_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_QUOTA_HISTORY]", "entities.QuotaHistory"]
        distinguishing_aspect: "Uniqueness is on the (grower_id, crop_year) pair: a second record for the same pair conflicts, a different crop_year succeeds."
        test_recipe:
          setup: ["BP; grower G1; quota history (G1, 2026) exists"]
          setup_api_calls:
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
          trigger:
            - call: "POST /buying-points/quota-histories"
              payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 50 }
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
            - call: "POST /buying-points/quota-histories"
              payload: { grower_id: "${g1}", crop_year: 2027, quota_tons: 80 }
              as: BuyingPointAdmin
              captures: { qh2: $.data.id }
          assert:
            - "Duplicate (G1, 2026): error_id == ERR_DUPLICATE_QUOTA_HISTORY, http 409"
            - "Different year (G1, 2027): created, QuotaHistory.${qh2}.used_quota_tons == 0"

      - name: certificate_second_sample_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_CERTIFICATE_EXISTS]", "entities.AflatoxinCertificate"]
        distinguishing_aspect: "At most one aflatoxin certificate per load EVER (retests loop in place via order-retest); a second create conflicts."
        test_recipe:
          setup: ["BP; WH-G 2000; grower G1; load A WEIGHED 25.0t; certificate certA SAMPLED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - { call: "POST /buying-points/loads/${loadA}/weigh", payload: { gross_tons: 25.0 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A1" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { certA: $.data.id }
          trigger:
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A2" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CERTIFICATE_EXISTS, http 409"
            - "GET /buying-points/aflatoxin-certificates?load_id=${loadA} total_count == 1"

      - name: schedule_window_overlap_rejected_adjacency_allowed
        claim_type: type_constraints
        grounds: ["errors[ERR_SCHEDULE_WINDOW_OVERLAP]", "entities.DiscountSchedule.fields.effective_from"]
        distinguishing_aspect: "Schedule windows are half-open [from, to): an overlapping activation conflicts, but a schedule starting exactly at the ACTIVE schedule's effective_to is legal adjacency."
        test_recipe:
          setup: ["BP; schedule S1 [2026-08-01, 2026-10-01) ACTIVE; S2 [2026-09-15, 2026-11-01) DRAFT; S3 [2026-10-01, 2027-01-01) DRAFT"]
          setup_api_calls:
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "S1", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", moisture_tiers: [ { up_to_pct: null, discount_cents_per_ton: 0 } ], foreign_material_tiers: [ { up_to_pct: null, discount_cents_per_ton: 0 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { s1: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${s1}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "S2", effective_from: "2026-09-15T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", moisture_tiers: [ { up_to_pct: null, discount_cents_per_ton: 0 } ], foreign_material_tiers: [ { up_to_pct: null, discount_cents_per_ton: 0 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { s2: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "S3", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: null, discount_cents_per_ton: 0 } ], foreign_material_tiers: [ { up_to_pct: null, discount_cents_per_ton: 0 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /buying-points/discount-schedules/${s2}/activate"
              payload: {}
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
            - { call: "POST /buying-points/discount-schedules/${s3}/activate", payload: {}, as: BuyingPointAdmin }
          assert:
            - "S2 activate: error_id == ERR_SCHEDULE_WINDOW_OVERLAP, http 409"
            - "S3 activate succeeds (S3.effective_from == S1.effective_to — half-open adjacency is not overlap); DiscountSchedule.${s3}.status == ACTIVE"
            - "S1 remains ACTIVE (adjacent windows coexist)"

      - name: allocation_line_has_no_version_field
        claim_type: immutability
        grounds: ["entities.AllocationLine"]
        distinguishing_aspect: "AllocationLine is common_fields:false — its JSON carries id and created_at but NO version or updated_at; lines are created/deleted by allocate, never updated."
        test_recipe:
          setup: ["Foundation: schedule ACTIVE; WH-G 2000; grower G1 quota 100; load A 25.0t GRADED/PASS/STORED (rcptA); contract 20t ACTIVE; call 20t ISSUED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }
              as: BuyingPointAdmin
              captures: { whg: $.data.id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsA: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsA}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A1" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { certA: $.data.id }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/record-result", payload: { result_ppb: 8.0 }, as: LabTechnician, as_user_id: lab-1 }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/confirm", payload: {}, as: LabTechnician, as_user_id: lab-2 }
            - { call: "POST /buying-points/storage-receipts", payload: { load_id: "${loadA}", warehouse_id: "${whg}" }, as: BuyingPointAdmin }
            - call: "POST /buying-points/sheller-contracts"
              payload: { buying_point_id: "${bp}", sheller_ref: "sheller-acme", total_units_tons: 20.0, price_per_ton_cents: 61000, accepts_segregated: false, window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: BuyingPointAdmin
              captures: { ct: $.data.id }
            - { call: "POST /buying-points/sheller-contracts/${ct}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 20.0, dock_window_start: "2026-09-10T08:00:00Z", dock_window_end: "2026-09-10T12:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dc: $.data.id, dc_v: $.data.version }
            - { call: "POST /buying-points/delivery-calls/${dc}/allocate", payload: { expected_delivery_call_version: "${dc_v}" }, as: BuyingPointAdmin }
          trigger:
            - call: "GET /buying-points/allocation-lines"
              payload: { delivery_call_id: "${dc}" }
              as: BuyingPointAdmin
              captures: { ln: "$.data[0].id" }
          assert:
            - "AllocationLine.${ln} JSON contains id and created_at"
            - "AllocationLine.${ln} JSON does NOT contain version or updated_at (common_fields: false)"
            - "AllocationLine.${ln}.allocated_tons == 20.0 and shipped_tons == 0 and shelled_tons == 0"
  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: weigh_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.FarmerStockLoad", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "weigh is only valid from REPORTED; a second weigh on a WEIGHED load is rejected and gross_tons is unchanged."
        test_recipe:
          setup: ["BP + WH-G 2000; grower G1; load A WEIGHED 25.0t"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - { call: "POST /buying-points/loads/${loadA}/weigh", payload: { gross_tons: 25.0 }, as: BuyingPointAdmin }
          trigger:
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 30.0 }
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "FarmerStockLoad.${loadA}.gross_tons == 25.0 (unchanged) and status == WEIGHED"

