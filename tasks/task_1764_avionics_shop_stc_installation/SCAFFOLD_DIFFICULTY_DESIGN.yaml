        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Category pair state(5) vs business_safety(6): complete on an INSTALLATION work
          order with no APPROVED regulatory package violates both — ERR_INVALID_STATE wins
          because priority 5 precedes priority 6.
        test_recipe:
