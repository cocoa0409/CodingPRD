              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Hanne Vos", ssn_last4: "4545", date_of_birth: "1974-04-04", participation_start_date: "2005-06-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Joris Vos", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1976-06-06", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-READ", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 3000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id" }
          trigger:
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              captures: { r_plan: $.data.id, r_plan_name: $.data.plan_name }
            - call: "GET /participants/${part_id}"
              payload: {}
              as: PlanAdministrator
              captures: { r_part: $.data.id, r_plan_fk: $.data.plan_id, r_start: $.data.participation_start_date }
            - call: "GET /plan-accounts/${acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { r_acct: $.data.id, r_part_fk: $.data.participant_id, r_vested: $.data.vested_balance_cents }
            - call: "GET /qdro-cases/${case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { r_case: $.data.id, r_review: $.data.review_status, r_seg: $.data.segregation_status }
            - call: "GET /draft-orders/${draft_id}"
              payload: {}
              as: QdroAnalyst
              captures: { r_draft: $.data.id, r_case_fk: $.data.qdro_case_id, r_bps: $.data.proposed_percentage_bps }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { r_hold: $.data.id, r_hold_case: $.data.qdro_case_id, r_hold_acct: $.data.plan_account_id, r_hold_amt: $.data.hold_amount_cents, r_hold_status: $.data.status }
          assert:
            - "${r_plan} == \"${plan_id}\", ${r_part} == \"${part_id}\", ${r_acct} == \"${acct_id}\", ${r_case} == \"${case_id}\", ${r_draft} == \"${draft_id}\", ${r_hold} == \"${hold_id}\" — every by-id read returns the requested row."
            - "${r_plan_name} == \"Readback Plan\", ${r_start} == \"2005-06-01\", ${r_bps} == 3000 — stored inputs are echoed unmodified."
            - "${r_plan_fk} == \"${plan_id}\", ${r_part_fk} == \"${part_id}\", ${r_case_fk} == \"${case_id}\" — the parent chain is navigable upward from every child."
            - "${r_vested} == 1000000, ${r_review} == \"UNDER_REVIEW\", ${r_seg} == \"HELD\" — derived and state fields are read back as persisted, and the case's two state dimensions moved together on receipt."
            - "${r_hold_case} == \"${case_id}\", ${r_hold_acct} == \"${acct_id}\", ${r_hold_amt} == 300000, ${r_hold_status} == \"HELD\" — the side-effect-created hold is a first-class readable row bound to both branches, with 3000 bps of the 1000000 assignable base."
            - "Every one of the six reads carries response_type \"object\" with the entity under $.data and a fresh meta.api_request_id."

      - name: list_endpoints_paginate_and_filter_with_declared_bounds
        claim_type: listing
        grounds:
          - response_envelope.pagination
          - endpoints[GET /plans/{id}/participants]
          - endpoints[GET /draft-orders]
          - validations[priority=25]
        distinguishing_aspect: |
          Paginated lists return the four pagination fields alongside the rows and honour the declared
          bounds: default limit 10, minimum 1, maximum 100, offset default 0. has_more is computed from
          offset + returned_count < total_count, so it must be false on the last page even when that page
          is full, and total_count must count the FILTERED set, not the whole table — a filter that
          matches one of three rows reports total_count 1, not 3. limit 0 and limit 101 are outside the
          declared range and are ERR_INVALID_REQUEST, not silently clamped.
        test_recipe:
          setup:
            - "One PUBLISHED plan with exactly three participants: two ACTIVE and one TERMINATED."
            - "Two of them have cases with received draft orders so /draft-orders has more than one row."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Paging Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "P One", ssn_last4: "0001", date_of_birth: "1970-01-01", participation_start_date: "2001-01-01" }
              as: PlanAdministrator
              captures: { p1: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "P Two", ssn_last4: "0002", date_of_birth: "1971-01-01", participation_start_date: "2002-01-01" }
              as: PlanAdministrator
              captures: { p2: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "P Three", ssn_last4: "0003", date_of_birth: "1972-01-01", participation_start_date: "2003-01-01", employment_status: "TERMINATED" }
              as: PlanAdministrator
              captures: { p3: $.data.id }
            - call: "POST /participants/${p1}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct1: $.data.id }
            - call: "POST /plan-accounts/${acct1}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /participants/${p2}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct2: $.data.id }
            - call: "POST /plan-accounts/${acct2}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 500000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${p1}", alternate_payee_name: "AP One", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1975-05-05", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${p2}", alternate_payee_name: "AP Two", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1976-06-06", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case2: $.data.id, case2_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case1}", expected_case_version: "${case1_v}", document_reference: "DRO-2663-P1", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 3000 }
              as: QdroAnalyst
              captures: { d1: $.data.id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case2}", expected_case_version: "${case2_v}", document_reference: "DRO-2663-P2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 2000 }
              as: QdroAnalyst
              captures: { d2: $.data.id }
          trigger:
            - call: "GET /plans/${plan_id}/participants"
              payload: {}
              as: PlanAdministrator
              captures: { t_all: $.meta.total_count, more_all: $.meta.has_more, lim_all: $.meta.limit, off_all: $.meta.offset }
            - call: "GET /plans/${plan_id}/participants"
              payload: { limit: 2 }
              as: PlanAdministrator
              captures: { t_p1: $.meta.total_count, more_p1: $.meta.has_more }
            - call: "GET /plans/${plan_id}/participants"
              payload: { limit: 2, offset: 2 }
              as: PlanAdministrator
              captures: { t_p2: $.meta.total_count, more_p2: $.meta.has_more, off_p2: $.meta.offset }
            - call: "GET /plans/${plan_id}/participants"
              payload: { limit: 2, offset: 3 }
              as: PlanAdministrator
              captures: { t_p3: $.meta.total_count, more_p3: $.meta.has_more }
            - call: "GET /plans/${plan_id}/participants"
              payload: { employment_status: "TERMINATED" }
              as: PlanAdministrator
              captures: { t_filtered: $.meta.total_count, more_filtered: $.meta.has_more, f_first: "$.data[0].id" }
            - call: "GET /draft-orders"
              payload: { status: "UNDER_REVIEW", limit: 1 }
              as: PlanAdministrator
              captures: { t_draft: $.meta.total_count, more_draft: $.meta.has_more, draft_first: "$.data[0].id" }
            - call: "GET /plans/${plan_id}/participants"
              payload: { limit: 101 }
              as: PlanAdministrator
              captures: { e_over: $.data.error_id }
            - call: "GET /plans/${plan_id}/participants"
              payload: { limit: 0 }
              as: PlanAdministrator
              captures: { e_zero: $.data.error_id }
          assert:
            - "${lim_all} == 10 and ${off_all} == 0 — the declared defaults appear in meta even when the client sends neither; ${t_all} == 3 with ${more_all} == false and 3 rows returned."
            - "${t_p1} == 3 with ${more_p1} == true and exactly 2 rows; ${t_p2} == 3 with ${more_p2} == false, ${off_p2} == 2 and exactly 1 row — has_more is false on a final partial page."
            - "${t_p3} == 3 with ${more_p3} == false and 0 rows — an offset at or beyond total_count is an empty page, not a 404."
            - "${t_filtered} == 1 with ${more_filtered} == false and exactly 1 row, ${f_first} == \"${p3}\" — total_count counts the FILTERED set, not the table."
            - "${t_draft} == 2 with ${more_draft} == true and exactly 1 row, and ${draft_first} is one of ${d1} / ${d2} — /draft-orders paginates independently of the participant listing."
            - "${e_over} == \"ERR_INVALID_REQUEST\" (HTTP 400) and ${e_zero} == \"ERR_INVALID_REQUEST\" (HTTP 400) — limit above the declared maximum of 100 or below the minimum of 1 is refused, never clamped."
            - "Every successful list carries response_type \"array\" with the rows in $.data as an array and limit/offset/total_count/has_more in the meta block beside api_request_id."

  - section: state_machines
    instances:
      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines[Plan.procedures_status].initial_state
          - state_machines[QdroCase.review_status].initial_state
          - state_machines[QdroCase.segregation_status].initial_state
          - state_machines[DraftOrder].initial_state
          - state_machines[DeficiencyNotice].initial_state
          - state_machines[SegregationHold].initial_state
          - state_machines[AttorneyAuthorization].initial_state
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Six machines and seven dimensions each have a declared entry point, and QdroCase carries TWO
          independent ones that must both start at their own initial values (review_status INTAKE and
          segregation_status NONE) rather than one combined status. This chain also pins the logical
          clock's startup default: no /_clock call is made, so every stamped deadline must be derived
          from exactly 2026-08-01T00:00:00Z — a wall-clock implementation produces different windows and
          fails here before any state assertion is reached.
        test_recipe:
          setup:
            - "Empty database and NO call to POST /_clock/set_current_utc, so the logical clock is at its startup default 2026-08-01T00:00:00Z."
            - "The plan requires model language; the draft is submitted without it so a deficiency notice can be issued."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Initial Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id, plan_state0: $.data.procedures_status, plan_v0: $.data.version }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Nadia Farouk", ssn_last4: "6767", date_of_birth: "1973-06-06", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
          trigger:
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Samir Farouk", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1975-05-05", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, review0: $.data.review_status, seg0: $.data.segregation_status, case_v: $.data.version }
            - call: "POST /qdro-cases/${case_id}/attorney-authorizations"
              payload: { represents: "PARTICIPANT", attorney_name: "Counsel Initial", attorney_bar_number: "BAR-9", attorney_email: "ci@bar.example", disclosure_scope: "FULL", effective_from: "2026-07-01", expires_at: "2027-07-01T00:00:00Z" }
              as: QdroAnalyst
              captures: { auth_id: $.data.id, auth0: $.data.status }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-INIT", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id, draft0: $.data.status, rev0: $.data.revision_number, deadline0: $.data.review_deadline_at }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", hold0: "$.data[0].status", hold_exp: "$.data[0].expires_at", hold_segdate: "$.data[0].segregation_date", hold_growth: "$.data[0].earnings_growth_bps", hold_earn: "$.data[0].earnings_adjustment_cents" }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "no model language" }
              as: QdroAnalyst
              as_user_id: "analyst-7"
              captures: { notice0: $.data.status, notice_seq: $.data.notice_sequence, notice_deadline: $.data.resubmission_deadline_at }
          assert:
            - "${plan_state0} == \"DRAFT\" and ${plan_v0} == 1 — a plan is never born PUBLISHED."
            - "${review0} == \"INTAKE\" and ${seg0} == \"NONE\" — the two QdroCase dimensions have separate initial values and neither is derived from the other."
            - "${auth0} == \"ACTIVE\", ${draft0} == \"UNDER_REVIEW\", ${hold0} == \"HELD\", ${notice0} == \"ISSUED\", ${notice_seq} == 1, ${rev0} == 1."
            - "${hold_segdate} == null, ${hold_growth} == 0 and ${hold_earn} == 0 — a freshly placed hold carries no segregation date and no earnings until it converts."
            - "${deadline0} == \"2026-09-15T00:00:00Z\" (2026-08-01 + 45 days), ${hold_exp} == \"2028-01-31T00:00:00Z\" (2026-08-01 + 548 days) and ${notice_deadline} == \"2026-09-30T00:00:00Z\" (2026-08-01 + 60 days) — all three windows are measured from the startup default clock, never from real time."
            - "GET /qdro-cases/${case_id} now reports review_status \"DEFICIENT\" with segregation_status still \"HELD\" — the first receipt moved both dimensions, and the notice moved only the review dimension."

      - name: plan_procedure_status_traverses_its_declared_cycle
        claim_type: valid_transition
        grounds:
          - state_machines[Plan.procedures_status].transitions
          - endpoints[POST /plans/{id}/procedure-status]
        distinguishing_aspect: |
          The plan machine is cyclic between PUBLISHED and AMENDMENT_PENDING with a one-way entry from
          DRAFT, and every hop increments Plan.version — so a plan that has been amended and re-published
          twice sits at version 5, which is the only way to tell a real transition from a no-op write. The
          cycle is not merely decorative: the AMENDMENT_PENDING leg suspends qualification while leaving
          receipt and review open.
        test_recipe:
          setup:
            - "One DRAFT plan with non-empty acceptable_formula_codes and allowed_approaches."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Cycle Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT", "FLAT_DOLLAR"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
              captures: { s2: $.data.procedures_status, v2: $.data.version }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "AMENDMENT_PENDING" }
              as: PlanAdministrator
              captures: { s3: $.data.procedures_status, v3: $.data.version }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
              captures: { s4: $.data.procedures_status, v4: $.data.version }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "AMENDMENT_PENDING" }
              as: PlanAdministrator
              captures: { s5: $.data.procedures_status, v5: $.data.version }
          assert:
            - "${v1} == 1, ${v2} == 2, ${v3} == 3, ${v4} == 4, ${v5} == 5 — every declared hop increments the version exactly once."
            - "${s2} == \"PUBLISHED\", ${s3} == \"AMENDMENT_PENDING\", ${s4} == \"PUBLISHED\", ${s5} == \"AMENDMENT_PENDING\" — the PUBLISHED <-> AMENDMENT_PENDING cycle is re-traversable without limit."
            - "GET /plans/${plan_id} reports procedures_status \"AMENDMENT_PENDING\" and version 5, and its plan_name / acceptable_formula_codes / allowed_approaches are unchanged by the traversal."
            - "The machine has no terminal state: the plan is still able to accept another PUBLISHED transition after the fourth hop."

      - name: undeclared_procedure_status_edges_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines[Plan.procedures_status]
          - errors.ERR_PROCEDURE_STATUS_TRANSITION_INVALID
          - validations[priority=40]
        distinguishing_aspect: |
          Only three edges are declared. DRAFT -> AMENDMENT_PENDING is the trap: it is a legal-looking
          destination that no transition permits, so an implementation that merely validates the
          to_status enum accepts it. Self-edges are likewise undeclared, so re-publishing an already
          PUBLISHED plan is a 409 and NOT an idempotent success — the version must not move on any refusal.
        test_recipe:
          setup:
            - "Two plans: one left in DRAFT and one advanced to PUBLISHED then AMENDMENT_PENDING."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Draft Only", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { draft_plan: $.data.id }
            - call: "POST /plans"
              payload: { plan_name: "Amending", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { pub_plan: $.data.id }
            - call: "POST /plans/${pub_plan}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /plans/${pub_plan}/procedure-status"
              payload: { to_status: "AMENDMENT_PENDING" }
              as: PlanAdministrator
              captures: { pub_v: $.data.version }
          trigger:
            - call: "POST /plans/${draft_plan}/procedure-status"
              payload: { to_status: "AMENDMENT_PENDING" }
              as: PlanAdministrator
              captures: { e_skip: $.data.error_id }
            - call: "POST /plans/${draft_plan}/procedure-status"
              payload: { to_status: "DRAFT" }
              as: PlanAdministrator
              captures: { e_self_draft: $.data.error_id }
            - call: "POST /plans/${pub_plan}/procedure-status"
              payload: { to_status: "AMENDMENT_PENDING" }
              as: PlanAdministrator
              captures: { e_self_amend: $.data.error_id }
            - call: "POST /plans/${pub_plan}/procedure-status"
              payload: { to_status: "DRAFT" }
              as: PlanAdministrator
              captures: { e_back_to_draft: $.data.error_id }
            - call: "POST /plans/${draft_plan}/procedure-status"
              payload: { to_status: "RETIRED" }
              as: PlanAdministrator
              captures: { e_unknown: $.data.error_id }
          assert:
            - "${e_skip} == \"ERR_PROCEDURE_STATUS_TRANSITION_INVALID\" with HTTP 409 — DRAFT cannot jump to AMENDMENT_PENDING even though AMENDMENT_PENDING is a valid enum literal."
            - "${e_self_draft}, ${e_self_amend} and ${e_back_to_draft} are all \"ERR_PROCEDURE_STATUS_TRANSITION_INVALID\" with HTTP 409 — self-edges and any return to DRAFT are undeclared, so none of them is a silent success."
            - "${e_unknown} == \"ERR_INVALID_REQUEST\" with HTTP 400 — an undeclared enum literal is refused one rung earlier (priority 25) than the state check (priority 40)."
            - "GET /plans/${draft_plan} still reports procedures_status \"DRAFT\" with version 1, and GET /plans/${pub_plan} still reports \"AMENDMENT_PENDING\" with version ${pub_v} — no refusal moved a state or a version."

      - name: a_clean_draft_order_blocks_both_notice_issuance_and_denial
        claim_type: precondition_enforcement
        grounds:
          - state_machines[DraftOrder].transitions[UNDER_REVIEW->DEFICIENT].preconditions
          - state_machines[DraftOrder].transitions[UNDER_REVIEW->DENIED].preconditions
          - state_machines[DraftOrder].transitions[DEFICIENT->DENIED].preconditions
          - errors.ERR_NO_DEFICIENCIES_TO_REPORT
          - errors.ERR_DENIAL_NOT_PERMITTED
          - calculations.deficiency_evaluation
        distinguishing_aspect: |
          Both the deficiency path and the denial path are gated on the RECOMPUTED deficiency set rather
          than a stored flag, so a fully compliant draft can be neither noticed nor denied: the analyst
          gets ERR_NO_DEFICIENCIES_TO_REPORT and the administrator gets ERR_DENIAL_NOT_PERMITTED. The
          DEFICIENT -> DENIED edge adds reason-specific preconditions, so naming MAX_REVISIONS_EXCEEDED
          while revision_number is still below the plan's cap is also ERR_DENIAL_NOT_PERMITTED — the
          reason must be true, not merely well-formed.
        test_recipe:
          setup:
            - "A PUBLISHED plan with max_revisions 3, requires_model_language true, acceptable_formula_codes [PERCENTAGE_OF_ACCOUNT], clock 2026-09-01."
            - "One participant with an assignable PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30."
            - "Case CLEAN carries a fully compliant draft (model language, acceptable formula, dob and address on file, no prohibited provisions)."
            - "Case DEFCT carries a draft missing model language, which is noticed once so it sits at DEFICIENT with revision_number 1."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Precondition Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, max_revisions: 3, earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Clean Claimant", ssn_last4: "1010", date_of_birth: "1972-10-10", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { partA: $.data.id }
            - call: "POST /participants/${partA}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acctA: $.data.id }
            - call: "POST /plan-accounts/${acctA}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Deficient Claimant", ssn_last4: "1111", date_of_birth: "1972-11-11", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { partB: $.data.id }
            - call: "POST /participants/${partB}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acctB: $.data.id }
            - call: "POST /plan-accounts/${acctB}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partA}", alternate_payee_name: "Clean AP", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1974-04-04", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseA: $.data.id, caseA_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseA}", expected_case_version: "${caseA_v}", document_reference: "DRO-2663-CLEAN", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", provisions: ["LUMP_SUM_ELECTION"], proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draftA: $.data.id, codesA: $.data.deficiency_codes }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partB}", alternate_payee_name: "Deficient AP", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1974-04-04", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { caseB: $.data.id, caseB_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseB}", expected_case_version: "${caseB_v}", document_reference: "DRO-2663-DEFCT", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draftB: $.data.id }
            - call: "POST /draft-orders/${draftB}/deficiency-notices"
              payload: { reviewer_notes: "missing model language" }
              as: QdroAnalyst
              as_user_id: "analyst-2"
              captures: { seqB: $.data.notice_sequence }
          trigger:
            - call: "POST /draft-orders/${draftA}/deficiency-notices"
              payload: { reviewer_notes: "nothing wrong, but try anyway" }
              as: QdroAnalyst
              as_user_id: "analyst-2"
              captures: { e_no_def: $.data.error_id }
            - call: "POST /draft-orders/${draftA}/deny"
              payload: { denial_reason: "ORDER_NOT_QUALIFIABLE" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { e_deny_clean: $.data.error_id }
            - call: "POST /draft-orders/${draftB}/deny"
              payload: { denial_reason: "MAX_REVISIONS_EXCEEDED" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { e_deny_reason: $.data.error_id }
            - call: "POST /draft-orders/${draftB}/deny"
              payload: { denial_reason: "ORDER_NOT_QUALIFIABLE" }
