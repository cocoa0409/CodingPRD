            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_cc}", member_id: "${m7}", vehicle_id: "${v7}", arrival_date: "2026-06-20", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
