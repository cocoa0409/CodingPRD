      - name: corner_coe_correction_loop_returns_to_draft
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.CertificateOfEligibility.RETURNED_FOR_CORRECTION_to_DRAFT
          - entities.CertificateOfEligibility.fields.correction_round_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / coe_cycles_back_to_draft_after_failed_qc_and_can_be_resubmitted
          rationale: "That instance drives the whole DRAFT -> SUBMITTED -> QC_SELECTED -> RETURNED_FOR_CORRECTION -> DRAFT -> SUBMITTED loop and asserts correction_round_count == 1, which is exactly this cyclic-shape claim."

      - name: corner_assignment_activate_is_guarded_on_two_sibling_entities
        claim_type: guarded transitions
        grounds:
          - state_machines.RecruiterAssignment.PLANNED_to_ACTIVE
          - validations[priority 22 ERR_RECRUITER_NOT_ACTIVE]
          - validations[priority 23 ERR_AREA_NOT_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_activation_rechecks_live_recruiter_and_area_status
          rationale: "That instance invalidates each guard entity in turn after creation and asserts the guarded transition is refused until both parents are valid again."

      - name: corner_coe_invalidation_cascades_down_to_terms_and_plans
        claim_type: Cascade down
        grounds:
          - state_machines.CertificateOfEligibility.APPROVED_to_INVALIDATED
          - state_machines.EligibilityTerm.ACTIVE_to_TERMINATED
          - state_machines.ServicePlan.ACTIVE_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_coe_invalidation_walks_three_hops_and_preserves_earned_hours
          rationale: "That instance asserts the certificate, term, student and every non-terminal plan after one invalidate call, including closure_reason ELIGIBILITY_LOST."

      - name: corner_coe_approval_adjusts_pfs_and_plan_hours_on_another_entity
        claim_type: Cross-entity
        grounds:
          - state_machines.CertificateOfEligibility.SUBMITTED_to_APPROVED
          - calculations.pfs_priority_score
          - calculations.service_hours_allocation
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_coe_approval_walks_four_hops_to_reallocated_plan_hours
          rationale: "That instance asserts the Student PFS fields and the ServicePlan hour fields after one approve call on a different entity."

      - name: corner_delivery_reversal_undoes_every_original_side_effect
        claim_type: Compensation
        grounds:
          - endpoints[POST /mep/service-deliveries/{delivery_id}/reverse]
          - calculations.student_service_hours_ledger
          - entities.ServiceDelivery.fields.is_reversed
        excluded_because:
          difficulty_instance: compensating_invariant / student_hours_and_credits_ledger_returns_to_its_exact_pre_create_decimals_after_reversal
          rationale: "That instance asserts both derived aggregates return to their exact pre-create decimals with no drift and that only the targeted delivery is flagged."

