            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-LOSS", rows: [ { check_number: "401", amount_cents: 20000, payee_name: "ZETA CORP", issue_date: "2026-08-01" }, { check_number: "402", amount_cents: 15000, payee_name: "ETA LLC", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "401", amount_cents: 20000, payee_name_raw: "ZETA CORP", channel: "TELLER", presented_at: "2026-08-03T09:00:00Z" }, as: BankOps, captures: { it1: $.data.id } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "402", amount_cents: 15000, payee_name_raw: "ETA LLC", channel: "TELLER", presented_at: "2026-08-03T09:05:00Z" }, as: BankOps, captures: { it2: $.data.id } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "999", amount_cents: 500, payee_name_raw: "GHOST", channel: "TELLER", presented_at: "2026-08-03T09:10:00Z" }, as: BankOps, captures: { ex3: $.data.exception_id } }
            - { call: "POST /treasury/liability-cases", payload: { presented_item_id: "${it1}", claim_reason: "FORGED_SIGNATURE" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { case1: $.data.id } }
            - { call: "POST /treasury/liability-cases/${case1}/start-review", payload: {}, as: BankOps, as_user_id: "bank-ops-1" }
            - { call: "POST /treasury/liability-cases", payload: { presented_item_id: "${it2}", claim_reason: "COUNTERFEIT" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { case2: $.data.id } }
            - { call: "POST /treasury/liability-cases/${case2}/start-review", payload: {}, as: BankOps, as_user_id: "bank-ops-1" }
          trigger:
