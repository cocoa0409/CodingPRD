            - "Fund.${fund_td_ots_id}.glidepath_fit_score was 92.50 at creation — exactly 7.50 below the CUSTOM twin"
            - "Fund.${fund_td_tor_id}.glidepath_fit_score == 47.50 — the same equity and landing data read against the TO_RETIREMENT reference"
            - "Fund.${fund_td_otr_id}.glidepath_fit_score == 40.00 — both penalties stack additively, 47.50 - 7.50"
            - "Fund.${fund_td_flr_id}.glidepath_fit_score == 0.00, never a negative number and never -97.50"
            - "after the PATCH, Fund.${fund_td_ots_id}.glidepath_fit_score == 100.00 and net_expense_ratio_bps == 30 — the score is re-derived on update, not frozen at creation"
            - "the PATCH left Fund.${fund_td_ots_id}.menu_status == CANDIDATE and watch_status == CLEAR untouched"
            - "Plan.${plan_id}.total_plan_assets_cents is still 1200000000 — none of the five suites carries assets"

