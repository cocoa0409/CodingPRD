# =============================================================================
# task_2793 — International Film Sales & Pre-Sale Financing
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  2793. International Film Sales & Pre-Sale Financing (film sales agency): market
  attendance planning with buyer meetings, screening slots and promotional materials,
  territory-by-territory value estimation with comparable title performance and cast
  value analysis, pre-sale negotiation with minimum guarantees, deliverables and
  payment milestones used as financing collateral, sales agency agreement with
  commission structure, expense caps and term of representation, banking arrangements
  with lenders discounting pre-sale contracts and completion bond requirements,
  delivery of technical and legal materials to each buyer with rejection risk,
  collection account management with waterfall distribution to financiers and
  participants, residual rights, holdbacks and reversion after the license term

domain_name: film-sales-presale
api_prefix: /film-sales

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Sixteen peer entities linked purely by foreign keys. Every resource lives at
  # a flat collection under /film-sales/<collection>; nesting appears ONLY for
  # reverse-reachability reads and creation-in-parent-context, never as an
  # ownership chain that a client must reconstruct.

  state_machine_shape: parallel
  # PreSaleContract carries three INDEPENDENT state axes on one row
  # (negotiation_status × delivery_status × collection_status). Film adds a
  # compound + cyclic axis (IN_MARKET <-> SOLD_OUT derived from valuation
  # counts). DeliverablePackage adds a branching fork with divergent
  # side-effect sets per branch.

  relationship_patterns:
    - one_to_many        # Film -> TerritoryValuation / PreSaleContract / BankingFacility
    - many_to_many       # Film <-> Territory realised through TerritoryValuation and PreSaleContract
    - cross_aggregate    # WaterfallTier caps are driven by SalesAgencyAgreement and BankingFacility

  role_model: segregation_of_duties
  # The HeadOfSales user who published the TerritoryValuation that sets a
  # territory's floor price MUST NOT be the HeadOfSales user who executes the
  # PreSaleContract priced against it; the Lender user who approved a facility
  # MUST NOT be the Lender user who draws it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  entity_count: 16
  endpoint_count: 63
  error_code_count: 50
  state_machine_count: 11

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Film
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Feature title being sold internationally" }
      - { name: genre, type: enum, source: input, description: "Genre used to select comparable titles", constraints: "ACTION | DRAMA | COMEDY | THRILLER | DOCUMENTARY" }
      - { name: production_budget_usd, type: number, source: input, description: "All-in negative cost in USD, 2 decimal places" }
      - { name: principal_cast_score, type: integer, source: input, description: "Cast value index 0-100 driving cast_multiplier tiers", constraints: "0 <= x <= 100" }
      - { name: completion_status, type: enum, source: input, description: "Physical production progress of the picture", default: "SCRIPT", constraints: "SCRIPT | IN_PRODUCTION | POST | DELIVERED" }
      - { name: estimated_delivery_date, type: datetime, source: input, description: "Contractual date technical materials become available (ISO 8601 UTC)" }
      - { name: theatrical_release_date, type: datetime, source: input, description: "Domestic theatrical release date; baseline for every buyer holdback window" }
      - { name: sales_status, type: enum, source: system, description: "Sales lifecycle state; see §1.2 Film machine", default: "DEVELOPMENT", constraints: "DEVELOPMENT | PACKAGING | IN_MARKET | SOLD_OUT | WRAPPED" }
      - { name: total_mg_committed_usd, type: number, source: computed, description: "= sum(PreSaleContract.minimum_guarantee_usd) over this film where negotiation_status IN {ACCEPTED, EXECUTED}" }
      - { name: total_mg_collected_usd, type: number, source: computed, description: "= sum(PaymentMilestone.received_amount_usd) over milestones of this film's contracts where PaymentMilestone.status == RECEIVED" }
      - { name: financing_gap_usd, type: number, source: computed, description: "= max(0, round(production_budget_usd - total_mg_committed_usd, 2))" }
      - { name: published_territory_count, type: integer, source: computed, description: "= count(TerritoryValuation where film_id == this.id AND status IN {PUBLISHED, LICENSED})" }
      - { name: licensed_territory_count, type: integer, source: computed, description: "= count(TerritoryValuation where film_id == this.id AND status == LICENSED)" }

  - name: SalesAgencyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: film_id, type: string, source: system, description: "FK -> Film.id; the represented title, taken from the creation path" }
      - { name: commission_pct, type: number, source: input, description: "Base sales commission rate applied to gross receipts before tier reduction", constraints: "0 < x <= 0.25" }
      - { name: expense_cap_usd, type: number, source: input, description: "Hard ceiling on recoupable sales expenses in USD" }
      - { name: term_months, type: integer, source: input, description: "Length of the term of representation in whole months", constraints: "x >= 6" }
      - { name: term_start_date, type: datetime, source: input, description: "First instant of the representation term (ISO 8601 UTC)" }
      - { name: term_end_date, type: datetime, source: computed, description: "= term_start_date + term_months calendar months" }
      - { name: status, type: enum, source: system, description: "Agreement lifecycle; see §1.2 SalesAgencyAgreement machine", default: "DRAFT", constraints: "DRAFT | EXECUTED | TERMINATED | EXPIRED" }
      - { name: expenses_incurred_usd, type: number, source: computed, description: "Running total of expenses logged through POST /film-sales/agency-agreements/{id}/expenses", default: 0 }
      - { name: expenses_recouped_usd, type: number, source: computed, description: "= WaterfallTier.recouped_usd of this film's SALES_EXPENSES tier", default: 0 }
      - { name: commission_earned_usd, type: number, source: computed, description: "Accrued commission per §1.3 sales_commission_accrual", default: 0 }
      - { name: gross_collected_usd, type: number, source: computed, description: "Cumulative gross receipts booked against this agreement; the tier-selection basis for sales_commission_accrual", default: 0 }
      - { name: executed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the HeadOfSales who moved the agreement to EXECUTED; null while DRAFT" }

  - name: Territory
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "ISO-like territory code, unique across all Territory rows", constraints: "2-3 uppercase letters, unique" }
      - { name: name, type: string, source: input, description: "Human-readable territory name" }
      - { name: region, type: enum, source: input, description: "Sales region grouping", constraints: "EMEA | APAC | LATAM | NORTH_AMERICA" }
      - { name: market_tier, type: integer, source: input, description: "Commercial tier of the territory, 1 = major", constraints: "1 <= x <= 3" }
      - { name: currency_code, type: string, source: input, description: "Local settlement currency (informational only; all money fields are USD)" }
      - { name: base_value_index, type: number, source: input, description: "Multiplier applied to the comparable median when valuing this territory", constraints: "0.10 <= x <= 2.00" }

  - name: ComparableTitle
    parent: null
    common_fields: false
    fields:
      - { name: territory_id, type: string, source: system, description: "FK -> Territory.id; territory this comparable datapoint was licensed in, taken from the creation path" }
      - { name: name, type: string, source: input, description: "Comparable film title" }
      - { name: genre, type: enum, source: input, description: "Genre of the comparable, matched against Film.genre", constraints: "ACTION | DRAMA | COMEDY | THRILLER | DOCUMENTARY" }
      - { name: cast_score, type: integer, source: input, description: "Cast value index of the comparable, 0-100", constraints: "0 <= x <= 100" }
      - { name: gross_license_fee_usd, type: number, source: input, description: "Licence fee actually paid for the comparable in this territory, USD" }
      - { name: release_year, type: integer, source: input, description: "Calendar year the comparable was released; gates the lookback window" }
      - { name: verified, type: boolean, source: input, description: "True when the datapoint was confirmed against a signed contract; only verified comps enter a valuation", default: false }

  - name: TerritoryValuation
    parent: null
    common_fields: true
    fields:
      - { name: film_id, type: string, source: input, description: "FK -> Film.id; the title being valued" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the territory being valued" }
      - { name: method, type: enum, source: input, description: "Which §1.3 territory_value_estimate variant produced the numbers on this row", constraints: "COMPARABLE_WEIGHTED | CAST_ADJUSTED" }
      - { name: comp_sample_size, type: integer, source: computed, description: "Count of eligible ComparableTitle rows that entered comp_median_usd" }
      - { name: comp_median_usd, type: number, source: computed, description: "Median gross_license_fee_usd of the eligible comparable set, per §1.3 territory_value_estimate" }
      - { name: cast_multiplier, type: number, source: computed, description: "Cast tier multiplier applied by the CAST_ADJUSTED variant; exactly 1.00 on COMPARABLE_WEIGHTED rows" }
      - { name: estimate_usd, type: number, source: computed, description: "Variant-specific fair value of the territory in USD" }
      - { name: ask_price_usd, type: number, source: computed, description: "= round(estimate_usd * ASK_PREMIUM, 2); the opening ask carried into negotiation" }
      - { name: floor_price_usd, type: number, source: computed, description: "= round(estimate_usd * FLOOR_DISCOUNT, 2); the minimum guarantee floor enforced at contract execution" }
      - { name: status, type: enum, source: system, description: "Valuation lifecycle; see §1.2 TerritoryValuation machine", default: "DRAFT", constraints: "DRAFT | PUBLISHED | LICENSED | STALE" }
      - { name: published_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the HeadOfSales who published this valuation; null while DRAFT" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of publication; null while DRAFT" }

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Film market name, e.g. AFM 2026" }
      - { name: city, type: string, source: input, description: "Host city" }
      - { name: start_date, type: datetime, source: input, description: "First instant of the market window (ISO 8601 UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Last instant of the market window (ISO 8601 UTC); must be strictly after start_date" }
      - { name: screening_room_count, type: integer, source: input, description: "Number of bookable screening rooms, numbered 1..screening_room_count", constraints: "x >= 1" }
      - { name: meeting_table_count, type: integer, source: input, description: "Number of bookable meeting tables, numbered 1..meeting_table_count", constraints: "x >= 1" }
      - { name: status, type: enum, source: system, description: "Market lifecycle; see §1.2 Market machine", default: "PLANNED", constraints: "PLANNED | OPEN | CLOSED" }

  - name: ScreeningSlot
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; the market hosting this screening" }
      - { name: film_id, type: string, source: input, description: "FK -> Film.id; the title being screened" }
      - { name: room_number, type: integer, source: input, description: "Screening room index within the market; the occupied resource is the pair (market_id, room_number)", constraints: "1 <= x <= Market.screening_room_count" }
      - { name: start_at, type: datetime, source: input, description: "Slot start instant, inclusive (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Slot end instant, exclusive (ISO 8601 UTC); must be strictly after start_at" }
      - { name: slot_type, type: enum, source: input, description: "Purpose of the screening", constraints: "BUYER_SCREENING | PRESS | MARKET_PREMIERE" }
      - { name: capacity, type: integer, source: input, description: "Seats available in the room for this slot", constraints: "x >= 1" }
      - { name: status, type: enum, source: system, description: "Slot lifecycle; see §1.2 ScreeningSlot machine", default: "HELD", constraints: "HELD | CONFIRMED | CANCELLED" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: system, description: "FK -> Territory.id; the single territory this distributor licenses for, taken from the creation path" }
      - { name: company_name, type: string, source: input, description: "Distributor company name" }
      - { name: credit_rating, type: enum, source: input, description: "Lender-facing credit grade; gates pre-sale discountability", constraints: "AAA | AA | A | BBB | SPECULATIVE" }
      - { name: exposure_limit_usd, type: number, source: input, description: "Maximum gross minimum-guarantee exposure the agency will carry for this buyer, USD" }
      - { name: status, type: enum, source: input, description: "Trading status of the buyer", default: "ACTIVE", constraints: "ACTIVE | WATCHLIST | BLOCKED" }
      - { name: outstanding_exposure_usd, type: number, source: computed, description: "GROSS_PIPELINE variant of §1.3 buyer_exposure; denormalised onto the buyer row", default: 0 }
      - { name: net_unpaid_exposure_usd, type: number, source: computed, description: "NET_UNPAID variant of §1.3 buyer_exposure; denormalised onto the buyer row", default: 0 }

  - name: BuyerMeeting
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market at which the meeting takes place" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the distributor being met" }
      - { name: film_id, type: string, source: input, description: "FK -> Film.id; the title being pitched" }
      - { name: table_number, type: integer, source: input, description: "Meeting table index within the market; the occupied resource is the pair (market_id, table_number)", constraints: "1 <= x <= Market.meeting_table_count" }
      - { name: start_at, type: datetime, source: input, description: "Meeting start instant, inclusive (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Meeting end instant, exclusive (ISO 8601 UTC); must be strictly after start_at" }
      - { name: duration_minutes, type: integer, source: computed, description: "= whole minutes between start_at and end_at; the quantity capped by MEETING_MINUTES_CAP" }
      - { name: status, type: enum, source: system, description: "Meeting lifecycle; see §1.2 BuyerMeeting machine", default: "SCHEDULED", constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: outcome, type: enum, source: system, description: "Recorded result, set only on the SCHEDULED -> COMPLETED transition; null otherwise", constraints: "PASS | INTERESTED | OFFER_REQUESTED" }

  - name: PreSaleContract
    parent: null
    common_fields: true
    fields:
      - { name: film_id, type: string, source: input, description: "FK -> Film.id; the licensed title" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the licensee" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the licensed territory" }
      - { name: minimum_guarantee_usd, type: number, source: input, description: "Current minimum guarantee on the table, USD; overwritten by every revise-offer" }
      - { name: license_term_months, type: integer, source: input, description: "Length of the licence in whole months from license_start_date", constraints: "x >= 12" }
      - { name: holdback_days, type: integer, source: input, description: "Days after Film.theatrical_release_date before the buyer may exploit the licence", constraints: "0 <= x <= 720" }
      - { name: negotiation_round, type: integer, source: system, description: "Round counter; starts at 1 on OFFERED and increments on every counter and revise-offer", default: 1 }
      - { name: negotiation_status, type: enum, source: system, description: "Commercial axis; see §1.2 PreSaleContract negotiation dimension", default: "OFFERED", constraints: "OFFERED | COUNTERED | ACCEPTED | EXECUTED | LAPSED | REVERTED" }
      - { name: delivery_status, type: enum, source: system, description: "Materials axis, independent of negotiation_status; see §1.2 PreSaleContract delivery dimension", default: "PENDING", constraints: "PENDING | SUBMITTED | ACCEPTED | REJECTED | CURED" }
      - { name: collection_status, type: enum, source: system, description: "Cash axis, independent of the other two; see §1.2 PreSaleContract collection dimension", default: "UNPAID", constraints: "UNPAID | PARTIALLY_PAID | PAID | WRITTEN_OFF" }
      - { name: counter_minimum_guarantee_usd, type: number, source: system, description: "Last MG the buyer countered with; null until the first counter" }
      - { name: license_start_date, type: datetime, source: system, description: "Logical-clock instant of execution; null until EXECUTED" }
      - { name: license_end_date, type: datetime, source: computed, description: "= license_start_date + license_term_months calendar months; null until EXECUTED" }
      - { name: holdback_release_date, type: datetime, source: computed, description: "= Film.theatrical_release_date + holdback_days days; null until EXECUTED" }
      - { name: offered_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the SalesAgent who created the offer" }
      - { name: executed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the HeadOfSales who executed the contract; null until EXECUTED" }
      - { name: milestone_pct_total, type: number, source: computed, description: "= sum(PaymentMilestone.pct_of_mg) over milestones of this contract, rounded to 4 decimals", default: 0 }
      - { name: unpaid_amount_usd, type: number, source: computed, description: "= sum(PaymentMilestone.amount_usd) over milestones of this contract where status IN {SCHEDULED, INVOICED}" }
      - { name: received_amount_usd, type: number, source: computed, description: "= sum(PaymentMilestone.received_amount_usd) over milestones of this contract where status == RECEIVED" }

  - name: PaymentMilestone
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PreSaleContract.id; the contract this milestone belongs to, taken from the creation path" }
      - { name: label, type: enum, source: input, description: "Milestone trigger; unique per contract", constraints: "ON_SIGNATURE | ON_DELIVERY | ON_RELEASE | ON_TERM_END" }
      - { name: pct_of_mg, type: number, source: input, description: "Share of the contract minimum guarantee payable at this milestone", constraints: "0 < x <= 1" }
      - { name: amount_usd, type: number, source: computed, description: "= round(pct_of_mg * PreSaleContract.minimum_guarantee_usd, 2), refreshed whenever the contract MG changes while negotiation_status IN {OFFERED, COUNTERED, ACCEPTED}" }
      - { name: due_date, type: datetime, source: input, description: "Contractual payment date (ISO 8601 UTC); drives the discount tenor in presale_discounted_advance" }
      - { name: status, type: enum, source: system, description: "Milestone lifecycle; see §1.2 PaymentMilestone machine", default: "SCHEDULED", constraints: "SCHEDULED | INVOICED | RECEIVED | WRITTEN_OFF" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant the funds were booked; null unless RECEIVED" }
      - { name: received_amount_usd, type: number, source: system, description: "Cash actually booked against this milestone; 0 unless RECEIVED", default: 0 }
      - { name: received_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the CollectionAgent who booked the receipt; null unless RECEIVED" }
      - { name: accrued_commission_usd, type: number, source: computed, description: "Commission that THIS receipt accrued under §1.3 sales_commission_accrual, stored so a reverse-receipt can subtract exactly the same figure; 0 unless RECEIVED", default: 0 }

  - name: DeliverablePackage
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PreSaleContract.id; the contract these materials are delivered against, taken from the creation path" }
      - { name: technical_items_count, type: integer, source: input, description: "Count of technical deliverables supplied (masters, M&E, subtitles, QC report, ...)", constraints: "x >= 0" }
      - { name: legal_items_count, type: integer, source: input, description: "Count of legal deliverables supplied (chain of title, E&O, music cue sheet, ...)", constraints: "x >= 0" }
      - { name: revision_round, type: integer, source: system, description: "1 for the first submission on a contract, incremented on each resubmission after a rejection", default: 1 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission" }
      - { name: status, type: enum, source: system, description: "Package lifecycle; see §1.2 DeliverablePackage machine", default: "SUBMITTED", constraints: "SUBMITTED | ACCEPTED | REJECTED | REJECTED_FINAL" }
      - { name: qc_result, type: enum, source: system, description: "Buyer technical acceptance verdict", default: "PENDING", constraints: "PENDING | PASS | FAIL" }
      - { name: rejection_reason, type: enum, source: system, description: "Why the buyer rejected; null unless status IN {REJECTED, REJECTED_FINAL}", constraints: "TECHNICAL_INCOMPLETE | LEGAL_INCOMPLETE | QC_FAIL | LATE_DELIVERY" }
      - { name: cure_deadline, type: datetime, source: computed, description: "= submitted_at + CURE_WINDOW_DAYS days, stamped on rejection; null otherwise" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the DeliveryManager who submitted the package" }

  - name: BankingFacility
    parent: null
    common_fields: true
    fields:
      - { name: film_id, type: string, source: system, description: "FK -> Film.id; the picture whose pre-sales collateralise this facility, taken from the creation path" }
      - { name: lender_name, type: string, source: input, description: "Discounting bank name" }
      - { name: discount_rate_pct, type: number, source: input, description: "Annual discount rate applied to the tenor of each pre-sale contract", constraints: "0 < x <= 0.30" }
      - { name: advance_rate_pct, type: number, source: input, description: "Share of each eligible unpaid milestone the lender will advance", constraints: "0 < x <= 1" }
      - { name: facility_cap_usd, type: number, source: input, description: "Hard ceiling on advance_amount_usd, USD" }
      - { name: completion_bond_required, type: boolean, source: input, description: "True when the lender demands a completion bond before full advance", default: true }
      - { name: completion_bond_posted, type: boolean, source: system, description: "True once a bond has been recorded through POST /film-sales/banking-facilities/{id}/completion-bond", default: false }
      - { name: bond_provider, type: string, source: system, description: "Completion guarantor name; null until a bond is posted" }
      - { name: bond_amount_usd, type: number, source: system, description: "Face amount of the posted bond; null until a bond is posted" }
      - { name: eligible_collateral_usd, type: number, source: computed, description: "Discounted value of eligible pre-sale contracts per §1.3 presale_discounted_advance", default: 0 }
      - { name: advance_amount_usd, type: number, source: computed, description: "Amount the lender will advance after cap and unbonded haircut, per §1.3 presale_discounted_advance", default: 0 }
      - { name: drawn_amount_usd, type: number, source: system, description: "Cash actually drawn; set to advance_amount_usd on the APPROVED -> DRAWN transition", default: 0 }
      - { name: outstanding_debt_usd, type: number, source: computed, description: "= max(0, round(drawn_amount_usd - WaterfallTier.recouped_usd of this film's BANK_DEBT tier, 2))", default: 0 }
      - { name: status, type: enum, source: system, description: "Facility lifecycle; see §1.2 BankingFacility machine", default: "PROPOSED", constraints: "PROPOSED | APPROVED | DRAWN | MARGIN_CALL | REPAID | DEFAULTED" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Lender who approved the facility; null while PROPOSED" }

  - name: CollectionAccount
    parent: null
    common_fields: true
    fields:
      - { name: film_id, type: string, source: system, description: "FK -> Film.id; the picture whose receipts flow through this account, taken from the creation path" }
      - { name: bank_name, type: string, source: input, description: "Collection account manager / bank name" }
      - { name: account_reference, type: string, source: input, description: "External account reference string" }
      - { name: balance_usd, type: number, source: computed, description: "= round(total_receipts_usd - total_distributed_usd, 2); undistributed cash sitting in the account", default: 0 }
      - { name: total_receipts_usd, type: number, source: computed, description: "Cumulative gross cash booked in through payment-milestone receipts, net of reversals", default: 0 }
      - { name: total_distributed_usd, type: number, source: computed, description: "Cumulative cash paid out through waterfall distribution runs", default: 0 }
      - { name: run_count, type: integer, source: system, description: "Number of DistributionRun rows created against this account; supplies run_index", default: 0 }
      - { name: status, type: enum, source: system, description: "Account lifecycle; see §1.2 CollectionAccount machine", default: "OPEN", constraints: "OPEN | LOCKED | CLOSED" }

  - name: WaterfallTier
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CollectionAccount.id; the account this tier belongs to, taken from the creation path" }
      - { name: tier_order, type: integer, source: input, description: "Position in the waterfall, ascending; unique per account", constraints: "x >= 1, unique per account_id" }
      - { name: tier_type, type: enum, source: input, description: "Economic bucket this tier represents", constraints: "COLLECTION_FEE | SALES_COMMISSION | SALES_EXPENSES | BANK_DEBT | EQUITY_RECOUPMENT | DEFERMENT | PARTICIPATION" }
      - { name: recipient_name, type: string, source: input, description: "Payee label for reporting" }
      - { name: pct_of_available, type: number, source: input, description: "Share of the cash still unallocated when this tier is reached", constraints: "0 < x <= 1" }
      - { name: cap_usd, type: number, source: input, description: "Lifetime ceiling on recouped_usd; null means uncapped. SALES_COMMISSION and SALES_EXPENSES caps are overwritten by cross-entity sync, see §1.3 sales_commission_accrual" }
      - { name: recouped_usd, type: number, source: computed, description: "Cumulative cash allocated to this tier across all distribution runs", default: 0 }
      - { name: status, type: enum, source: computed, description: "SATISFIED when cap_usd is not null and recouped_usd >= cap_usd; SUSPENDED when tier_type == BANK_DEBT and no BankingFacility of the account's film has status IN {APPROVED, DRAWN, MARGIN_CALL}; ACTIVE otherwise", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED | SATISFIED" }

  - name: DistributionRun
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CollectionAccount.id; the account distributed from, taken from the creation path" }
      - { name: run_index, type: integer, source: system, description: "= CollectionAccount.run_count + 1 at creation time; 1-based, monotonic per account" }
      - { name: amount_in_usd, type: number, source: input, description: "Cash offered to the waterfall on this run, USD" }
      - { name: amount_allocated_usd, type: number, source: computed, description: "= sum(allocations[*].amount_usd); cash that actually left the account" }
      - { name: residual_usd, type: number, source: computed, description: "= round(amount_in_usd - amount_allocated_usd, 2); cash that stayed in the account because no uncapped ACTIVE tier could absorb it" }
      - { name: allocations, type: array, source: computed, description: "Ordered array of { tier_id, tier_type, recipient_name, amount_usd } in ascending tier_order; tiers allocated 0.00 are present with amount_usd 0.00" }
      - { name: run_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the CollectionAgent who ran the distribution" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Film — compound + cyclic. IN_MARKET <-> SOLD_OUT is derived from valuation
  # counts, so the same picture oscillates as territories are licensed and
  # released.
  # ---------------------------------------------------------------------------
  - entity: Film
    initial_state: DEVELOPMENT
    terminal_states: [WRAPPED]
    transitions:
      - from: DEVELOPMENT
        to: PACKAGING
        trigger: "POST /film-sales/films/{id}/state with to_status=PACKAGING"
        actor: PlatformAdmin
        preconditions:
          - "at least one SalesAgencyAgreement with film_id == this.id has status == EXECUTED"
        side_effects:
          - "Film.version += 1"
        note: "Cross-entity guard: the agency must be formally engaged before the picture can be packaged."

      - from: PACKAGING
        to: IN_MARKET
        trigger: "POST /film-sales/films/{id}/state with to_status=IN_MARKET"
        actor: HeadOfSales
        preconditions:
          - "Film.published_territory_count >= 1"
          - "the film's SalesAgencyAgreement with status == EXECUTED satisfies term_start_date <= current_utc < term_end_date"
        side_effects:
          - "Film.version += 1"

      - from: IN_MARKET
        to: SOLD_OUT
        trigger: "system — evaluated at the end of POST /film-sales/pre-sale-contracts/{id}/execute"
        actor: system
        preconditions:
          - "Film.published_territory_count >= 1"
          - "Film.licensed_territory_count == Film.published_territory_count"
        side_effects:
          - "Film.sales_status = SOLD_OUT"
          - "Film.version += 1"

      - from: SOLD_OUT
        to: IN_MARKET
        trigger: "system — evaluated at the end of POST /film-sales/pre-sale-contracts/{id}/revert, POST /film-sales/pre-sale-contracts/{id}/lapse, and the REJECTED_FINAL cascade of POST /film-sales/deliverable-packages/{id}/qc-result"
        actor: system
        preconditions:
          - "Film.licensed_territory_count < Film.published_territory_count"
        side_effects:
          - "Film.sales_status = IN_MARKET"
          - "Film.version += 1"
        note: "The cyclic edge. A reverted or lapsed territory re-opens the picture for sale without any operator action."

      - from: IN_MARKET
        to: WRAPPED
        trigger: "POST /film-sales/films/{id}/state with to_status=WRAPPED"
        actor: HeadOfSales
        preconditions:
          - "no PreSaleContract with film_id == this.id has negotiation_status IN {OFFERED, COUNTERED, ACCEPTED}"
          - "every CollectionAccount with film_id == this.id has balance_usd == 0"
        side_effects:
          - "every CollectionAccount with film_id == this.id and status == OPEN moves to CLOSED"
          - "the film's SalesAgencyAgreement with status == EXECUTED moves to EXPIRED"
          - "Film.version += 1"

      - from: SOLD_OUT
        to: WRAPPED
        trigger: "POST /film-sales/films/{id}/state with to_status=WRAPPED"
        actor: HeadOfSales
        preconditions:
          - "no PreSaleContract with film_id == this.id has negotiation_status IN {OFFERED, COUNTERED, ACCEPTED}"
          - "every CollectionAccount with film_id == this.id has balance_usd == 0"
        side_effects:
          - "every CollectionAccount with film_id == this.id and status == OPEN moves to CLOSED"
          - "the film's SalesAgencyAgreement with status == EXECUTED moves to EXPIRED"
          - "Film.version += 1"

  # ---------------------------------------------------------------------------
  # SalesAgencyAgreement — linear with a revert-free terminal fork.
  # ---------------------------------------------------------------------------
  - entity: SalesAgencyAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /film-sales/agency-agreements/{id}/state with to_status=EXECUTED"
        actor: HeadOfSales
        preconditions:
          - "no other SalesAgencyAgreement with the same film_id has status == EXECUTED"
        side_effects:
          - "SalesAgencyAgreement.executed_by_user_id = X-User-ID"
          - "SalesAgencyAgreement.term_end_date = term_start_date + term_months calendar months"

      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /film-sales/agency-agreements/{id}/state with to_status=TERMINATED"
        actor: HeadOfSales
        preconditions:
          - "no PreSaleContract with the same film_id has negotiation_status IN {OFFERED, COUNTERED, ACCEPTED}"
        side_effects:
          - "Film.sales_status moves to WRAPPED when it was IN_MARKET or SOLD_OUT"

      - from: EXECUTED
        to: EXPIRED
        trigger: "system — cascaded from the Film IN_MARKET|SOLD_OUT -> WRAPPED transition"
        actor: system
        preconditions:
          - "the film reached sales_status == WRAPPED"
        side_effects:
          - "SalesAgencyAgreement.status = EXPIRED"

  # ---------------------------------------------------------------------------
  # TerritoryValuation — supersede-on-publish, with a LICENSED <-> PUBLISHED
  # cycle driven from PreSaleContract.
  # ---------------------------------------------------------------------------
  - entity: TerritoryValuation
    initial_state: DRAFT
    terminal_states: [STALE]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /film-sales/territory-valuations/{id}/publish"
        actor: HeadOfSales
        preconditions:
          - "TerritoryValuation.comp_sample_size >= MIN_COMP_SAMPLE"
          - "payload expected_film_version equals the current Film.version (OCC, see §1.2.1 valuation-publish-stale-film)"
        side_effects:
          - "any other TerritoryValuation with the same (film_id, territory_id) and status == PUBLISHED moves to STALE"
          - "TerritoryValuation.published_by_user_id = X-User-ID, published_at = current_utc"
          - "Film.published_territory_count recomputed; Film.version += 1"

      - from: PUBLISHED
        to: LICENSED
        trigger: "system — cascaded from POST /film-sales/pre-sale-contracts/{id}/execute"
        actor: system
        preconditions:
          - "a PreSaleContract with the same (film_id, territory_id) reached negotiation_status == EXECUTED"
        side_effects:
          - "Film.licensed_territory_count recomputed"

      - from: LICENSED
        to: PUBLISHED
        trigger: "system — cascaded from POST /film-sales/pre-sale-contracts/{id}/revert, POST /film-sales/pre-sale-contracts/{id}/lapse, and the REJECTED_FINAL cascade of POST /film-sales/deliverable-packages/{id}/qc-result"
        actor: system
        preconditions:
          - "the PreSaleContract with the same (film_id, territory_id) left negotiation_status == EXECUTED"
        side_effects:
          - "Film.licensed_territory_count recomputed"
        note: "Rights-conservation edge: the territory returns to the sellable pool, so published_territory_count is unchanged while licensed_territory_count drops by exactly one."

      - from: PUBLISHED
        to: STALE
        trigger: "system — cascaded from either (a) a later POST /film-sales/territory-valuations/{id}/publish on the same (film_id, territory_id), or (b) PATCH /film-sales/films/{id} changing principal_cast_score"
        actor: system
        preconditions:
          - "cause (a): a newer TerritoryValuation for the same (film_id, territory_id) reached PUBLISHED"
          - "cause (b): the film's principal_cast_score value in the PATCH body differs from the stored value, which invalidates every cast_multiplier already baked into a published estimate"
        side_effects:
          - "Film.published_territory_count recomputed"
        note: "STALE is terminal: a stale valuation is never revived. A fresh POST /film-sales/territory-valuations for the same (film_id, territory_id) re-samples the comparable set and must be published again."

  # ---------------------------------------------------------------------------
  # Market — linear.
  # ---------------------------------------------------------------------------
  - entity: Market
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /film-sales/markets/{id}/state with to_status=OPEN"
        actor: PlatformAdmin
        preconditions:
          - "Market.end_date > Market.start_date"
        side_effects:
          - "Market.version += 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /film-sales/markets/{id}/state with to_status=CLOSED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "every ScreeningSlot with market_id == this.id and status == HELD moves to CANCELLED"
          - "every BuyerMeeting with market_id == this.id and status == SCHEDULED moves to NO_SHOW"
          - "Market.version += 1"
        note: "Conditional cascade: only non-terminal children are touched; CONFIRMED slots and COMPLETED meetings are left alone."

  # ---------------------------------------------------------------------------
  # ScreeningSlot — forward + revert.
  # ---------------------------------------------------------------------------
  - entity: ScreeningSlot
    initial_state: HELD
    terminal_states: [CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /film-sales/screening-slots/{id}/state with to_status=CONFIRMED"
        actor: SalesAgent
        preconditions:
          - "Market.status == OPEN for the slot's market_id"
        side_effects:
          - "ScreeningSlot.version += 1"

      - from: HELD
        to: CANCELLED
        trigger: "POST /film-sales/screening-slots/{id}/state with to_status=CANCELLED, or system cascade from Market OPEN -> CLOSED"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "the (market_id, room_number) interval is released, so a later slot may occupy it"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /film-sales/screening-slots/{id}/state with to_status=CANCELLED"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "the (market_id, room_number) interval is released, so a later slot may occupy it"

  # ---------------------------------------------------------------------------
  # BuyerMeeting — branching terminal fork.
  # ---------------------------------------------------------------------------
  - entity: BuyerMeeting
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /film-sales/buyer-meetings/{id}/state with to_status=COMPLETED"
        actor: SalesAgent
        preconditions:
          - "payload outcome is present and is one of PASS, INTERESTED, OFFER_REQUESTED"
        side_effects:
          - "BuyerMeeting.outcome = payload outcome"
          - "duration_minutes continues to count against MEETING_MINUTES_CAP for the buyer"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /film-sales/buyer-meetings/{id}/state with to_status=NO_SHOW, or system cascade from Market OPEN -> CLOSED"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "duration_minutes continues to count against MEETING_MINUTES_CAP for the buyer"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /film-sales/buyer-meetings/{id}/state with to_status=CANCELLED"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "the (market_id, table_number) interval is released"
          - "duration_minutes stops counting against MEETING_MINUTES_CAP for the buyer"
        note: "Only CANCELLED releases the aggregate minutes budget; NO_SHOW keeps consuming it."

  # ---------------------------------------------------------------------------
  # PreSaleContract — THREE independent state axes on one row.
  # ---------------------------------------------------------------------------
  - entity: PreSaleContract
    initial_state: "negotiation_status=OFFERED, delivery_status=PENDING, collection_status=UNPAID"
    terminal_states: [LAPSED, REVERTED]
    transitions:

      # ---- negotiation dimension ----
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/counter"
        actor: Buyer
        preconditions:
          - "PreSaleContract.negotiation_status == OFFERED"
          - "X-User-ID == PreSaleContract.buyer_id"
          - "PreSaleContract.negotiation_round < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "PreSaleContract.counter_minimum_guarantee_usd = payload counter_minimum_guarantee_usd"
          - "PreSaleContract.negotiation_round += 1"

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/revise-offer"
        actor: SalesAgent
        preconditions:
          - "PreSaleContract.negotiation_status == COUNTERED"
          - "PreSaleContract.negotiation_round < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "PreSaleContract.minimum_guarantee_usd = payload minimum_guarantee_usd"
          - "every PaymentMilestone of this contract has amount_usd recomputed as round(pct_of_mg * new minimum_guarantee_usd, 2)"
          - "PreSaleContract.unpaid_amount_usd recomputed"
          - "Buyer.outstanding_exposure_usd recomputed (GROSS_PIPELINE variant); Buyer.version += 1"
          - "PreSaleContract.negotiation_round += 1"
        note: "The cyclic edge. OFFERED -> COUNTERED -> OFFERED may repeat until negotiation_round reaches MAX_NEGOTIATION_ROUNDS."

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/accept"
        actor: Buyer
        preconditions:
          - "PreSaleContract.negotiation_status == OFFERED"
          - "X-User-ID == PreSaleContract.buyer_id"
          - "Buyer.status IN {ACTIVE, WATCHLIST}"
        side_effects:
          - "Film.total_mg_committed_usd recomputed; Film.financing_gap_usd recomputed; Film.version += 1"
          - "Buyer.outstanding_exposure_usd recomputed (GROSS_PIPELINE variant); Buyer.version += 1"

      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/execute"
        actor: HeadOfSales
        preconditions:
          - "PreSaleContract.negotiation_status == ACCEPTED"
          - "X-User-ID != the published_by_user_id of the PUBLISHED TerritoryValuation with the same (film_id, territory_id) — segregation of duties"
          - "a TerritoryValuation with the same (film_id, territory_id) has status == PUBLISHED"
          - "PreSaleContract.minimum_guarantee_usd >= that valuation's floor_price_usd"
          - "PreSaleContract.milestone_pct_total == 1.0000"
          - "Buyer.net_unpaid_exposure_usd + PreSaleContract.unpaid_amount_usd <= round(Buyer.exposure_limit_usd * NET_EXECUTION_HEADROOM, 2)"
        side_effects:
          - "PreSaleContract.license_start_date = current_utc; license_end_date = license_start_date + license_term_months calendar months"
          - "PreSaleContract.holdback_release_date = Film.theatrical_release_date + holdback_days days"
          - "PreSaleContract.executed_by_user_id = X-User-ID"
          - "the PaymentMilestone with label == ON_SIGNATURE moves SCHEDULED -> INVOICED"
          - "the PUBLISHED TerritoryValuation with the same (film_id, territory_id) moves PUBLISHED -> LICENSED"
          - "because that valuation became LICENSED, Film.licensed_territory_count is recomputed and Film may auto-transition IN_MARKET -> SOLD_OUT"
          - "Buyer.net_unpaid_exposure_usd recomputed (NET_UNPAID variant); Buyer.version += 1"
          - "every BankingFacility of this film with status IN {PROPOSED, APPROVED, DRAWN, MARGIN_CALL} has eligible_collateral_usd and advance_amount_usd recomputed"

      - from: OFFERED
        to: LAPSED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/lapse, or system supersede cascade from a later POST /film-sales/pre-sale-contracts on the same (film_id, buyer_id, territory_id)"
        actor: HeadOfSales
        preconditions: []
        side_effects:
          - "Buyer.outstanding_exposure_usd recomputed (GROSS_PIPELINE variant); Buyer.version += 1"

      - from: COUNTERED
        to: LAPSED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/lapse, or system supersede cascade from a later POST /film-sales/pre-sale-contracts on the same (film_id, buyer_id, territory_id)"
        actor: HeadOfSales
        preconditions: []
        side_effects:
          - "Buyer.outstanding_exposure_usd recomputed (GROSS_PIPELINE variant); Buyer.version += 1"

      - from: ACCEPTED
        to: LAPSED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/lapse"
        actor: HeadOfSales
        preconditions: []
        side_effects:
          - "Film.total_mg_committed_usd recomputed; Film.financing_gap_usd recomputed; Film.version += 1"
          - "Buyer.outstanding_exposure_usd recomputed (GROSS_PIPELINE variant); Buyer.version += 1"

      - from: EXECUTED
        to: LAPSED
        trigger: "system — cascaded from the REJECTED_FINAL branch of POST /film-sales/deliverable-packages/{id}/qc-result"
        actor: system
        preconditions:
          - "PreSaleContract.delivery_status became REJECTED with the package at status == REJECTED_FINAL"
        side_effects:
          - "every PaymentMilestone of this contract with status IN {SCHEDULED, INVOICED} moves to WRITTEN_OFF"
          - "PreSaleContract.collection_status = WRITTEN_OFF"
          - "the LICENSED TerritoryValuation with the same (film_id, territory_id) moves LICENSED -> PUBLISHED"
          - "because milestones were written off, every BankingFacility of this film has eligible_collateral_usd and advance_amount_usd recomputed"
          - "Film.total_mg_committed_usd, Film.licensed_territory_count and Film.financing_gap_usd recomputed; Film.version += 1"

      - from: EXECUTED
        to: REVERTED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/revert"
        actor: HeadOfSales
        preconditions:
          - "PreSaleContract.negotiation_status == EXECUTED"
          - "current_utc >= PreSaleContract.license_end_date"
          - "PreSaleContract.collection_status == PAID"
        side_effects:
          - "the LICENSED TerritoryValuation with the same (film_id, territory_id) moves LICENSED -> PUBLISHED"
          - "because that valuation left LICENSED, Film.licensed_territory_count is recomputed and Film may auto-transition SOLD_OUT -> IN_MARKET"
          - "Film.version += 1"
        note: "Reversion after the licence term. Residual rights return to the agency; collected cash is NOT clawed back."

      # ---- delivery dimension (independent of negotiation_status) ----
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/deliverable-packages"
        actor: DeliveryManager
        preconditions:
          - "PreSaleContract.negotiation_status == EXECUTED"
          - "current_utc >= PreSaleContract.holdback_release_date"
          - "payload technical_items_count >= REQUIRED_TECHNICAL_ITEMS AND payload legal_items_count >= REQUIRED_LEGAL_ITEMS"
        side_effects:
          - "a DeliverablePackage is created with status == SUBMITTED, qc_result == PENDING, revision_round == 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /film-sales/deliverable-packages/{id}/qc-result with result=PASS on a package whose revision_round == 1"
        actor: Buyer
        preconditions:
          - "DeliverablePackage.status == SUBMITTED"
        side_effects:
          - "the PaymentMilestone with label == ON_DELIVERY moves SCHEDULED -> INVOICED"

      - from: SUBMITTED
        to: CURED
        trigger: "POST /film-sales/deliverable-packages/{id}/qc-result with result=PASS on a package whose revision_round >= 2"
        actor: Buyer
        preconditions:
          - "DeliverablePackage.status == SUBMITTED"
        side_effects:
          - "the PaymentMilestone with label == ON_DELIVERY moves SCHEDULED -> INVOICED"
          - "the PaymentMilestone with label == ON_RELEASE has due_date pushed out by CURE_WINDOW_DAYS days"
        note: "Divergent branch: a cured delivery costs the buyer a later ON_RELEASE due date, which shortens the discount tenor a lender can claim."

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /film-sales/deliverable-packages/{id}/qc-result with result=FAIL"
        actor: Buyer
        preconditions:
          - "DeliverablePackage.status == SUBMITTED"
        side_effects:
          - "DeliverablePackage.cure_deadline = submitted_at + CURE_WINDOW_DAYS days"
          - "when the package's revision_round == MAX_REVISION_ROUNDS the package moves to REJECTED_FINAL instead of REJECTED and the EXECUTED -> LAPSED negotiation cascade fires"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /film-sales/pre-sale-contracts/{id}/deliverable-packages (resubmission)"
        actor: DeliveryManager
        preconditions:
          - "the latest DeliverablePackage of this contract has status == REJECTED"
          - "current_utc <= that package's cure_deadline"
        side_effects:
          - "a new DeliverablePackage is created with revision_round = previous revision_round + 1"

      # ---- collection dimension (independent of the other two) ----
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /film-sales/payment-milestones/{id}/receipt"
        actor: CollectionAgent
        preconditions:
          - "PreSaleContract.received_amount_usd > 0 after the receipt"
          - "PreSaleContract.unpaid_amount_usd > 0 after the receipt"
        side_effects:
          - "PreSaleContract.received_amount_usd and unpaid_amount_usd recomputed"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /film-sales/payment-milestones/{id}/receipt"
        actor: CollectionAgent
        preconditions:
          - "PreSaleContract.unpaid_amount_usd == 0 after the receipt"
        side_effects:
          - "PreSaleContract.received_amount_usd and unpaid_amount_usd recomputed"

      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "POST /film-sales/payment-milestones/{id}/reverse-receipt"
        actor: CollectionAgent
        preconditions:
          - "PreSaleContract.received_amount_usd == 0 after the reversal"
        side_effects:
          - "PreSaleContract.received_amount_usd and unpaid_amount_usd recomputed"
        note: "Compensating edge for the money-conservation invariant."

  # ---------------------------------------------------------------------------
  # PaymentMilestone
  # ---------------------------------------------------------------------------
  - entity: PaymentMilestone
    initial_state: SCHEDULED
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: SCHEDULED
        to: INVOICED
        trigger: "system — cascaded from PreSaleContract ACCEPTED -> EXECUTED (ON_SIGNATURE) or from DeliverablePackage SUBMITTED -> ACCEPTED|CURED (ON_DELIVERY)"
        actor: system
        preconditions:
          - "PaymentMilestone.status == SCHEDULED"
        side_effects:
          - "PaymentMilestone.amount_usd is frozen against the executing contract's minimum_guarantee_usd"

      - from: SCHEDULED
        to: RECEIVED
        trigger: "POST /film-sales/payment-milestones/{id}/receipt"
        actor: CollectionAgent
        preconditions:
          - "PaymentMilestone.status IN {SCHEDULED, INVOICED}"
          - "PreSaleContract.negotiation_status == EXECUTED"
          - "payload amount_usd == PaymentMilestone.amount_usd"
          - "a CollectionAccount with film_id == the contract's film_id has status == OPEN"
        side_effects:
          - "PaymentMilestone.received_amount_usd = payload amount_usd; received_at = payload received_at; received_by_user_id = X-User-ID"
          - "CollectionAccount.total_receipts_usd += amount_usd; balance_usd recomputed"
          - "because the account took cash in, SalesAgencyAgreement.gross_collected_usd and commission_earned_usd are updated per §1.3 sales_commission_accrual"
          - "because commission_earned_usd changed, the SALES_COMMISSION WaterfallTier.cap_usd is resynced to it and the SALES_EXPENSES WaterfallTier.cap_usd is resynced to min(expenses_incurred_usd, expense_cap_usd)"
          - "Film.total_mg_collected_usd recomputed; PreSaleContract.collection_status advanced"

      - from: INVOICED
        to: RECEIVED
        trigger: "POST /film-sales/payment-milestones/{id}/receipt"
        actor: CollectionAgent
        preconditions:
          - "PaymentMilestone.status IN {SCHEDULED, INVOICED}"
          - "PreSaleContract.negotiation_status == EXECUTED"
          - "payload amount_usd == PaymentMilestone.amount_usd"
          - "a CollectionAccount with film_id == the contract's film_id has status == OPEN"
        side_effects:
          - "identical to the SCHEDULED -> RECEIVED side-effect chain"

      - from: RECEIVED
        to: INVOICED
        trigger: "POST /film-sales/payment-milestones/{id}/reverse-receipt"
        actor: CollectionAgent
        preconditions:
          - "PaymentMilestone.status == RECEIVED"
          - "CollectionAccount.balance_usd >= PaymentMilestone.received_amount_usd"
        side_effects:
          - "PaymentMilestone.received_amount_usd = 0; received_at = null; received_by_user_id = null"
          - "CollectionAccount.total_receipts_usd -= the reversed amount; balance_usd recomputed"
          - "SalesAgencyAgreement.gross_collected_usd -= the reversed amount and commission_earned_usd -= the exact commission that the original receipt accrued (stored on the milestone's accrual record)"
          - "the SALES_COMMISSION WaterfallTier.cap_usd is resynced to the reduced commission_earned_usd"
          - "Film.total_mg_collected_usd recomputed; PreSaleContract.collection_status recomputed"
        note: "Compensating action. Every quantity touched by the forward receipt is restored exactly, so total_receipts_usd - total_distributed_usd - balance_usd stays 0 and commission_earned_usd returns to its pre-receipt value."

      - from: SCHEDULED
        to: WRITTEN_OFF
        trigger: "system — cascaded from PreSaleContract EXECUTED -> LAPSED (final delivery rejection)"
        actor: system
        preconditions:
          - "the parent contract left negotiation_status == EXECUTED via the REJECTED_FINAL cascade"
        side_effects:
          - "PreSaleContract.unpaid_amount_usd recomputed"

      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "system — cascaded from PreSaleContract EXECUTED -> LAPSED (final delivery rejection)"
        actor: system
        preconditions:
          - "the parent contract left negotiation_status == EXECUTED via the REJECTED_FINAL cascade"
        side_effects:
          - "PreSaleContract.unpaid_amount_usd recomputed"

  # ---------------------------------------------------------------------------
  # DeliverablePackage — branching fork with divergent side-effect sets.
  # ---------------------------------------------------------------------------
  - entity: DeliverablePackage
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED_FINAL]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /film-sales/deliverable-packages/{id}/qc-result with result=PASS"
        actor: Buyer
        preconditions:
          - "DeliverablePackage.status == SUBMITTED"
          - "X-User-ID == the buyer_id of the package's contract"
        side_effects:
          - "DeliverablePackage.qc_result = PASS"
          - "PreSaleContract.delivery_status = ACCEPTED when revision_round == 1, CURED when revision_round >= 2"
          - "the ON_DELIVERY PaymentMilestone moves SCHEDULED -> INVOICED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /film-sales/deliverable-packages/{id}/qc-result with result=FAIL on a package whose revision_round < MAX_REVISION_ROUNDS"
        actor: Buyer
        preconditions:
          - "DeliverablePackage.status == SUBMITTED"
          - "X-User-ID == the buyer_id of the package's contract"
          - "payload rejection_reason is present"
        side_effects:
          - "DeliverablePackage.qc_result = FAIL; rejection_reason = payload rejection_reason; cure_deadline = submitted_at + CURE_WINDOW_DAYS days"
          - "PreSaleContract.delivery_status = REJECTED"

      - from: REJECTED
        to: REJECTED_FINAL
        trigger: "system — a package at revision_round == MAX_REVISION_ROUNDS receiving result=FAIL is created directly in REJECTED_FINAL rather than REJECTED"
        actor: system
        preconditions:
          - "DeliverablePackage.revision_round == MAX_REVISION_ROUNDS AND qc_result == FAIL"
        side_effects:
          - "PreSaleContract.delivery_status = REJECTED and the contract's EXECUTED -> LAPSED cascade fires"
          - "because the contract lapsed, its SCHEDULED and INVOICED PaymentMilestones move to WRITTEN_OFF"
          - "because milestones were written off, every BankingFacility of the film recomputes eligible_collateral_usd and advance_amount_usd; a DRAWN facility whose drawn_amount_usd now exceeds advance_amount_usd moves DRAWN -> MARGIN_CALL"
          - "because the facility entered MARGIN_CALL the BANK_DEBT WaterfallTier stays ACTIVE and Film.sales_status may auto-transition SOLD_OUT -> IN_MARKET"
        note: "Deepest cascade in the scaffold: package -> contract -> milestones -> facility -> film."

  # ---------------------------------------------------------------------------
  # BankingFacility — guarded, with a collateral-driven revert.
  # ---------------------------------------------------------------------------
  - entity: BankingFacility
    initial_state: PROPOSED
    terminal_states: [REPAID, DEFAULTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /film-sales/banking-facilities/{id}/state with to_status=APPROVED"
        actor: Lender
        preconditions:
          - "at least one PreSaleContract with film_id == this.film_id has negotiation_status == EXECUTED and a Buyer whose credit_rating IN {AAA, AA, A} and status == ACTIVE"
          - "BankingFacility.eligible_collateral_usd > 0"
        side_effects:
          - "BankingFacility.approved_by_user_id = X-User-ID"
          - "eligible_collateral_usd and advance_amount_usd recomputed per §1.3 presale_discounted_advance"
          - "the film's BANK_DEBT WaterfallTier.status is recomputed from SUSPENDED to ACTIVE"

      - from: APPROVED
        to: DRAWN
        trigger: "POST /film-sales/banking-facilities/{id}/state with to_status=DRAWN"
        actor: Lender
        preconditions:
          - "X-User-ID != BankingFacility.approved_by_user_id — segregation of duties"
          - "BankingFacility.completion_bond_required == false OR BankingFacility.completion_bond_posted == true"
          - "BankingFacility.advance_amount_usd > 0"
        side_effects:
          - "BankingFacility.drawn_amount_usd = advance_amount_usd; outstanding_debt_usd recomputed"
          - "the film's BANK_DEBT WaterfallTier.cap_usd is set to drawn_amount_usd"
          - "Film.financing_gap_usd recomputed"

      - from: DRAWN
        to: MARGIN_CALL
        trigger: "system — cascaded from the DeliverablePackage REJECTED_FINAL chain or from PreSaleContract EXECUTED -> LAPSED, whenever recomputed advance_amount_usd < drawn_amount_usd"
        actor: system
        preconditions:
          - "BankingFacility.drawn_amount_usd > the recomputed BankingFacility.advance_amount_usd"
        side_effects:
          - "Film.financing_gap_usd recomputed"
          - "Film.sales_status may auto-transition SOLD_OUT -> IN_MARKET"

      - from: MARGIN_CALL
        to: DRAWN
        trigger: "system — cascaded from POST /film-sales/pre-sale-contracts/{id}/execute or POST /film-sales/banking-facilities/{id}/completion-bond, whenever recomputed advance_amount_usd >= drawn_amount_usd"
        actor: system
        preconditions:
          - "BankingFacility.advance_amount_usd >= BankingFacility.drawn_amount_usd"
        side_effects:
          - "Film.financing_gap_usd recomputed"

      - from: DRAWN
        to: REPAID
        trigger: "system — cascaded from POST /film-sales/collection-accounts/{id}/distribute when the BANK_DEBT tier becomes SATISFIED"
        actor: system
        preconditions:
          - "the BANK_DEBT WaterfallTier of the film's collection account has recouped_usd >= cap_usd"
        side_effects:
          - "BankingFacility.outstanding_debt_usd = 0"
          - "Film.financing_gap_usd recomputed"

      - from: MARGIN_CALL
        to: DEFAULTED
        trigger: "POST /film-sales/banking-facilities/{id}/state with to_status=DEFAULTED"
        actor: Lender
        preconditions:
          - "BankingFacility.status == MARGIN_CALL"
        side_effects:
          - "the film's BANK_DEBT WaterfallTier.pct_of_available is left untouched; the tier keeps recouping against the defaulted balance"

  # ---------------------------------------------------------------------------
  # CollectionAccount
  # ---------------------------------------------------------------------------
  - entity: CollectionAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /film-sales/collection-accounts/{id}/state with to_status=LOCKED"
        actor: CollectionAgent
        preconditions: []
        side_effects:
          - "no further receipts may be booked against this film while LOCKED"

      - from: LOCKED
        to: OPEN
        trigger: "POST /film-sales/collection-accounts/{id}/state with to_status=OPEN"
        actor: CollectionAgent
        preconditions: []
        side_effects:
          - "receipts may be booked again"

      - from: OPEN
        to: CLOSED
        trigger: "system — cascaded from the Film IN_MARKET|SOLD_OUT -> WRAPPED transition"
        actor: system
        preconditions:
          - "CollectionAccount.balance_usd == 0"
        side_effects:
          - "every WaterfallTier of this account keeps its recouped_usd for reporting"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: valuation-publish-stale-film
    parent_entity: Film
    write_endpoint: "POST /film-sales/territory-valuations/{id}/publish"
    occ_field: "expected_film_version"
    description: |
      Publishing a TerritoryValuation whose parent Film has a version higher
      than the one the client last observed is rejected. Publication
      legitimately supersedes the prior PUBLISHED valuation for the same
      (film_id, territory_id) and rewrites Film.published_territory_count, so
      a client working from a stale Film view would silently retire a
      valuation it never saw. The check is a pure stale-version comparison
      against Film.version.
    error_id: ERR_STALE_FILM_VERSION
    http_status: 412

  - rule_id: contract-offer-stale-buyer
    parent_entity: Buyer
    write_endpoint: "POST /film-sales/pre-sale-contracts"
    occ_field: "expected_buyer_version"
    description: |
      Creating a PreSaleContract against a Buyer whose version has advanced
      since the client last read it is rejected. A new offer for the same
      (film_id, buyer_id, territory_id) legitimately supersedes any prior
      OFFERED or COUNTERED contract (moving it to LAPSED) and rewrites
      Buyer.outstanding_exposure_usd, so pricing an offer against a stale
      exposure figure would breach the buyer's limit. The check is a pure
      stale-version comparison against Buyer.version.
    error_id: ERR_STALE_BUYER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Global money precision: every USD field is a number rounded to 2 decimal
# places using round_half_up unless a formula pins a different width.
# Logical clock: `current_utc` is the server clock, default
# 2026-08-01T00:00:00Z, moved only by POST /film-sales/_clock/set_current_utc.
# No calculation, selector, tie-break or ordering rule in this scaffold reads
# `id`; `created_at ASC` is the only common-field fallback ordering used.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  # DUAL VARIANT #1 — territory value (TerritoryValuation / Territory domain)
  # ---------------------------------------------------------------------------
  - name: territory_value_estimate
    trigger: "POST /film-sales/territory-valuations (runs once at creation and freezes the numbers onto the row)"
    algorithm: weighted_scoring
    formula: |
      film      = Film[valuation.film_id]
      territory = Territory[valuation.territory_id]

      # (a) eligible comparable set — explicit status/window filter
      eligible = [ c for c in ComparableTitle
                   if c.territory_id == territory.id
                   and c.genre       == film.genre
                   and c.verified    == true
                   and c.release_year >= year_of(current_utc) - COMP_LOOKBACK_YEARS ]
      comp_sample_size = count(eligible)
      if comp_sample_size == 0:            -> ERR_NO_COMPARABLE_TITLES
      if comp_sample_size < MIN_COMP_SAMPLE: -> ERR_INSUFFICIENT_COMP_SAMPLE

      # (b) median — sort key and tie-break pinned
      s = sort(eligible, key = (gross_license_fee_usd ASC, created_at ASC))
      n = comp_sample_size
      if n is odd:  comp_median_usd = s[(n - 1) // 2].gross_license_fee_usd
      else:         comp_median_usd = round((s[n//2 - 1].gross_license_fee_usd
                                          + s[n//2].gross_license_fee_usd) / 2, 2)

      # (c) cast tier — boundaries are inclusive on the lower bound
      cast_multiplier_of(score) =
          1.40 if score >= 85
          1.20 if 70 <= score < 85
          1.00 if 50 <= score < 70
          0.80 if score < 50

      # (d) VARIANT SELECTION — the two variants diverge here
      if valuation.method == COMPARABLE_WEIGHTED:
          cast_multiplier = 1.00
          estimate_usd    = round(comp_median_usd * territory.base_value_index, 2)
      if valuation.method == CAST_ADJUSTED:
          cast_multiplier = cast_multiplier_of(film.principal_cast_score)
          estimate_usd    = round(comp_median_usd * territory.base_value_index
                                                  * cast_multiplier, 2)

      ask_price_usd   = round(estimate_usd * ASK_PREMIUM, 2)
      floor_price_usd = round(estimate_usd * FLOOR_DISCOUNT, 2)
    input_set: |
      ComparableTitle rows for the valuation's territory whose genre equals the
      film's genre, whose `verified` flag is true, and whose release_year is at
      or after (calendar year of current_utc) - COMP_LOOKBACK_YEARS.
      Unverified comps and comps from other genres/territories are excluded
      even when they are the only datapoints available.
    constants:
      COMP_LOOKBACK_YEARS: 7
      MIN_COMP_SAMPLE: 3
      ASK_PREMIUM: 1.25
      FLOOR_DISCOUNT: 0.70
    precision: "comp_median_usd, estimate_usd, ask_price_usd, floor_price_usd: 2 decimal places, round_half_up. cast_multiplier: exact 2-decimal constant."
    variants:
      - name: COMPARABLE_WEIGHTED
        when: "valuation.method == COMPARABLE_WEIGHTED — pure market-comparable view used to argue the territory's floor to financiers"
        difference: "cast_multiplier is forced to 1.00, so principal_cast_score is ignored entirely; estimate_usd = comp_median_usd * base_value_index"
      - name: CAST_ADJUSTED
        when: "valuation.method == CAST_ADJUSTED — packaging view used to argue the ask to buyers"
        difference: "estimate_usd is additionally multiplied by the cast tier multiplier, so for principal_cast_score >= 85 it is exactly 1.40x the COMPARABLE_WEIGHTED figure on identical comps"

  # ---------------------------------------------------------------------------
  # DUAL VARIANT #2 — buyer exposure (Buyer / credit domain)
  # ---------------------------------------------------------------------------
  - name: buyer_exposure
    trigger: "recomputed on POST /film-sales/pre-sale-contracts, .../revise-offer, .../accept, .../execute, .../lapse, .../revert, POST /film-sales/payment-milestones/{id}/receipt and .../reverse-receipt; both variants are stored on the Buyer row"
    algorithm: aggregation
    formula: |
      # VARIANT GROSS_PIPELINE — forward-looking, headline MG basis
      gross_pipeline_usd =
        round(sum(c.minimum_guarantee_usd
                  for c in PreSaleContract
                  if c.buyer_id == buyer.id
                  and c.negotiation_status IN {OFFERED, COUNTERED, ACCEPTED, EXECUTED}), 2)

      # VARIANT NET_UNPAID — realised-cash basis, executed contracts only
      net_unpaid_usd =
        round(sum(m.amount_usd
                  for m in PaymentMilestone
                  if PreSaleContract[m.contract_id].buyer_id == buyer.id
                  and PreSaleContract[m.contract_id].negotiation_status == EXECUTED
                  and m.status IN {SCHEDULED, INVOICED}), 2)

      buyer.outstanding_exposure_usd = gross_pipeline_usd
      buyer.net_unpaid_exposure_usd  = net_unpaid_usd
    input_set: |
      GROSS_PIPELINE counts the FULL minimum guarantee of every live contract
      including offers the buyer has not accepted, and ignores cash already
      received. NET_UNPAID counts only unbilled/unpaid milestone amounts of
      EXECUTED contracts, so received milestones and every non-executed
      contract drop out. On identical data the two figures differ whenever the
      buyer holds a live offer or has paid any milestone.
    constants:
      NET_EXECUTION_HEADROOM: 1.50
    precision: "2 decimal places, round_half_up; the sum is rounded once at the end, not per contract"
    variants:
      - name: GROSS_PIPELINE
        when: "gate on POST /film-sales/pre-sale-contracts — `gross_pipeline_usd + payload minimum_guarantee_usd > buyer.exposure_limit_usd` -> ERR_BUYER_EXPOSURE_EXCEEDED (equality passes)"
        difference: "includes OFFERED and COUNTERED contracts and uses whole MGs; a buyer sitting on a live offer is already consuming limit"
      - name: NET_UNPAID
        when: "gate on POST /film-sales/pre-sale-contracts/{id}/execute — `net_unpaid_usd + contract.unpaid_amount_usd > round(buyer.exposure_limit_usd * NET_EXECUTION_HEADROOM, 2)` -> ERR_BUYER_NET_EXPOSURE_EXCEEDED (equality passes)"
        difference: "EXECUTED contracts only, milestone-level, and cash already received is removed from the base; measured against a 1.50x headroom rather than the raw limit"

  # ---------------------------------------------------------------------------
  # COMBINATORIAL (c) — circular-looking dependency, evaluation order pinned
  # ---------------------------------------------------------------------------
  - name: sales_commission_accrual
    trigger: "POST /film-sales/payment-milestones/{id}/receipt (accrual) and POST /film-sales/payment-milestones/{id}/reverse-receipt (exact reversal); listed in the side_effects of both PaymentMilestone RECEIVED transitions"
    algorithm: threshold
    formula: |
      agreement = the SalesAgencyAgreement with film_id == contract.film_id
                  and status == EXECUTED   (exactly one by construction)
      R = payload amount_usd

      # ---- EVALUATION ORDER IS PINNED. The rate depends on the running total,
      # ---- and the running total depends on this receipt, which looks
      # ---- circular. The scaffold resolves it as follows and NO other way:
      #  step 1: read `before` = agreement.gross_collected_usd, EXCLUDING R
      before = agreement.gross_collected_usd
      #  step 2: pick ONE rate from `before` and charge the WHOLE receipt at it
      rate = agreement.commission_pct              if before <  TIER1_BREAK
             round(agreement.commission_pct * TIER2_FACTOR, 6)
                                                   if TIER1_BREAK <= before < TIER2_BREAK
             round(agreement.commission_pct * TIER3_FACTOR, 6)
                                                   if before >= TIER2_BREAK
      #  step 3: accrue
      commission = round(R * rate, 2)
      #  step 4: only now advance the running total
      agreement.gross_collected_usd  = round(before + R, 2)
      agreement.commission_earned_usd = round(agreement.commission_earned_usd + commission, 2)
      milestone.accrued_commission_usd = commission

      # ---- FORBIDDEN alternative, stated so the ambiguity is closed: a receipt
      # ---- that straddles a breakpoint is NOT split across two rates. A
      # ---- receipt of 400000 on before=900000 with TIER1_BREAK=1000000 is
      # ---- charged entirely at the tier-1 rate, not 100000 @ tier1 +
      # ---- 300000 @ tier2.

      # ---- cross-entity cap resync (cascade link, same request)
      tier(SALES_COMMISSION).cap_usd = agreement.commission_earned_usd
      tier(SALES_EXPENSES).cap_usd   = round(min(agreement.expenses_incurred_usd,
                                                 agreement.expense_cap_usd), 2)

      # ---- reversal (compensating action)
      on reverse-receipt of milestone m:
        agreement.gross_collected_usd   = round(agreement.gross_collected_usd  - m.received_amount_usd, 2)
        agreement.commission_earned_usd = round(agreement.commission_earned_usd - m.accrued_commission_usd, 2)
        m.accrued_commission_usd = 0
        tier(SALES_COMMISSION).cap_usd = agreement.commission_earned_usd
    input_set: |
      `before` is the agreement's gross_collected_usd immediately prior to this
      receipt, i.e. the sum of every previously RECEIVED milestone amount across
      ALL contracts of the film, net of any reversals. Receipts are applied in
      request arrival order; there is no batch re-sort, so the tier a receipt
      lands in is a function of the request sequence, not of due_date.
    constants:
      TIER1_BREAK: 1000000.00
      TIER2_BREAK: 3000000.00
      TIER2_FACTOR: 0.75
      TIER3_FACTOR: 0.50
      EXPENSE_LOG_TOLERANCE: 2.00
    precision: "rate: 6 decimal places, round_half_up. commission, gross_collected_usd, commission_earned_usd, cap_usd: 2 decimal places, round_half_up."

  # ---------------------------------------------------------------------------
  # COMBINATORIAL (b) — nested rounding where the order changes the cents
  # ---------------------------------------------------------------------------
  - name: waterfall_distribution
    trigger: "POST /film-sales/collection-accounts/{id}/distribute"
    algorithm: waterfall_allocation
    formula: |
      remaining = payload amount_in_usd          # already validated <= account.balance_usd
      allocations = []

      # tier order is pinned: tier_order ASC, tie-break created_at ASC
      for tier in sort(WaterfallTier where account_id == account.id,
                       key = (tier_order ASC, created_at ASC)):

          if tier.status != ACTIVE:              # SUSPENDED or SATISFIED
              allocations.append({tier, 0.00}); continue

          # ---- ROUNDING ORDER IS PINNED: round the tier's share to cents
          # ---- FIRST, then subtract the rounded figure from `remaining`.
          # ---- The forbidden alternative is to keep full precision through
          # ---- the loop and round only the final allocations, which shifts
          # ---- cents to later tiers.
          target = round(remaining * tier.pct_of_available, 2)

          if tier.cap_usd is not null:
              room   = round(tier.cap_usd - tier.recouped_usd, 2)
              target = min(target, room)
          target = min(target, remaining)

          tier.recouped_usd = round(tier.recouped_usd + target, 2)
          remaining         = round(remaining - target, 2)
          allocations.append({tier, target})

      # ---- residual sweep, fully pinned selector
      if remaining > 0:
          sweep_candidates = [ t for t in this account's tiers
                               if t.status == ACTIVE and t.cap_usd is null ]
          if sweep_candidates is non-empty:
              sweep = max(sweep_candidates, key = (tier_order ASC, created_at ASC))
                      # i.e. highest tier_order; on a tie the LATEST created_at loses,
                      # so the tie-break is created_at ASC
              sweep.recouped_usd = round(sweep.recouped_usd + remaining, 2)
              allocations[sweep] += remaining
              remaining = 0.00
          # else: no uncapped ACTIVE tier exists, the cash stays in the account

      run.amount_in_usd        = payload amount_in_usd
      run.amount_allocated_usd = round(sum(a.amount_usd for a in allocations), 2)
      run.residual_usd         = round(run.amount_in_usd - run.amount_allocated_usd, 2)
      run.allocations          = allocations              # tier_order ASC
      run.run_index            = account.run_count + 1

      account.total_distributed_usd = round(account.total_distributed_usd + run.amount_allocated_usd, 2)
      account.balance_usd           = round(account.total_receipts_usd - account.total_distributed_usd, 2)
      account.run_count            += 1

      # INVARIANT (checked by §1.8 compensating_invariant / money_conservation):
      #   run.amount_allocated_usd == sum(run.allocations[*].amount_usd)
      #   account.total_receipts_usd - account.total_distributed_usd - account.balance_usd == 0
    input_set: |
      Every WaterfallTier of the account participates in tier_order ASC order,
      including tiers whose computed status is SUSPENDED or SATISFIED — those
      appear in `allocations` with amount_usd 0.00 rather than being omitted, so
      the array length always equals the account's tier count.
    constants: {}
    precision: "every tier allocation, recouped_usd, remaining, amount_allocated_usd, residual_usd, total_distributed_usd and balance_usd: 2 decimal places, round_half_up, applied per tier inside the loop"

  # ---------------------------------------------------------------------------
  # COMBINATORIAL (a) — >=3 inputs with nested min/max and state branches
  # ---------------------------------------------------------------------------
  - name: presale_discounted_advance
    trigger: "recomputed on POST /film-sales/banking-facilities (creation), POST /film-sales/banking-facilities/{id}/state, POST /film-sales/banking-facilities/{id}/completion-bond, POST /film-sales/pre-sale-contracts/{id}/execute, POST /film-sales/pre-sale-contracts/{id}/lapse, and the DeliverablePackage REJECTED_FINAL cascade"
    algorithm: decay_function
    formula: |
      eligible = [ c for c in PreSaleContract
                   if c.film_id == facility.film_id
                   and c.negotiation_status == EXECUTED
                   and c.delivery_status != REJECTED
                   and Buyer[c.buyer_id].credit_rating IN {AAA, AA, A}
                   and Buyer[c.buyer_id].status == ACTIVE ]

      per contract c in sort(eligible, key = created_at ASC):
          unpaid_ms = [ m for m in PaymentMilestone
                        if m.contract_id == c.id and m.status IN {SCHEDULED, INVOICED} ]
          if unpaid_ms is empty: contract_value = 0.00; continue
          unpaid = round(sum(m.amount_usd for m in unpaid_ms), 2)
          # tenor = the LATEST due_date among unpaid milestones (pinned; not the
          # earliest, not a weighted average)
          tenor_date      = max(m.due_date for m in unpaid_ms)
          days_to_payment = max(0, whole_days_between(current_utc, tenor_date))
          discount_factor = round(1 - facility.discount_rate_pct
                                      * (days_to_payment / DAYS_PER_YEAR), 6)
          contract_value  = round(unpaid * facility.advance_rate_pct * discount_factor, 2)

      # rounding order pinned: discount_factor to 6dp, contract_value to 2dp,
      # THEN sum. Summing at full precision and rounding once is forbidden.
      eligible_collateral_usd = round(sum(contract_value), 2)

      advance = min(facility.facility_cap_usd, eligible_collateral_usd)
      if facility.completion_bond_required and not facility.completion_bond_posted:
          advance = round(advance * UNBONDED_HAIRCUT, 2)
      advance_amount_usd = advance

      outstanding_debt_usd = max(0, round(facility.drawn_amount_usd
                                          - tier(BANK_DEBT).recouped_usd, 2))
    input_set: |
      Only EXECUTED contracts of the facility's film whose delivery_status is
      not REJECTED and whose buyer is ACTIVE with an investment-grade rating
      (AAA, AA or A) are discountable. BBB and SPECULATIVE buyers contribute
      0.00 even when their milestones are fully current. Within an eligible
      contract only SCHEDULED and INVOICED milestones count; RECEIVED and
      WRITTEN_OFF milestones drop out.
    constants:
      DAYS_PER_YEAR: 365
      UNBONDED_HAIRCUT: 0.50
    precision: "discount_factor: 6 decimal places, round_half_up. contract_value, eligible_collateral_usd, advance_amount_usd, outstanding_debt_usd: 2 decimal places, round_half_up."

  # ---------------------------------------------------------------------------
  # Temporal occupancy geometry — TWO DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - name: screening_room_occupancy
    trigger: "POST /film-sales/screening-slots"
    algorithm: interval_merge
    formula: |
      # resource = the pair (market_id, room_number)
      # semantics = HALF-OPEN [start_at, end_at) PLUS a mandatory turnaround
      #             buffer applied to BOTH sides of every existing occupation.
      occupied = [ s for s in ScreeningSlot
                   if s.market_id   == payload market_id
                   and s.room_number == payload room_number
                   and s.status IN {HELD, CONFIRMED} ]        # CANCELLED releases the room

      conflict(new, e) =
            new.start_at <  e.end_at   + TURNAROUND_MINUTES minutes
        and e.start_at   <  new.end_at + TURNAROUND_MINUTES minutes

      if any(conflict(new, e) for e in occupied): -> ERR_SCREENING_ROOM_CONFLICT

      # Consequences of the strict `<`: a gap of EXACTLY TURNAROUND_MINUTES is
      # accepted; a gap of TURNAROUND_MINUTES - 1 minute is rejected;
      # back-to-back (gap 0) is REJECTED.
    input_set: "ScreeningSlot rows of the same market and room whose status is HELD or CONFIRMED. CANCELLED slots are ignored, so a cancelled slot's window is immediately re-bookable."
    constants:
      TURNAROUND_MINUTES: 30
    precision: "instant comparison at whole-second resolution; buffers are added in whole minutes"

  - name: meeting_table_occupancy
    trigger: "POST /film-sales/buyer-meetings"
    algorithm: interval_merge
    formula: |
      # resource #1 = the pair (market_id, table_number)
      # resource #2 = the pair (market_id, buyer_id)
      # semantics = HALF-OPEN [start_at, end_at) with NO buffer at all, so
      #             touching intervals are legal.
      live = [ m for m in BuyerMeeting
               if m.market_id == payload market_id
               and m.status IN {SCHEDULED, COMPLETED, NO_SHOW} ]   # CANCELLED releases

      overlaps(new, e) = new.start_at < e.end_at and e.start_at < new.end_at

      if any(overlaps(new, e) for e in live
             if e.table_number == payload table_number): -> ERR_MEETING_SLOT_CONFLICT
      if any(overlaps(new, e) for e in live
             if e.buyer_id     == payload buyer_id):     -> ERR_MEETING_SLOT_CONFLICT

      # AGGREGATE CAPACITY on the union of one buyer's booked minutes at this
      # market — a second, non-geometric dimension the room rule has no analogue for.
      new_duration = whole_minutes_between(payload start_at, payload end_at)
      booked = sum(m.duration_minutes for m in BuyerMeeting
                   if m.market_id == payload market_id
                   and m.buyer_id  == payload buyer_id
                   and m.status IN {SCHEDULED, COMPLETED, NO_SHOW})
      if booked + new_duration > MEETING_MINUTES_CAP: -> ERR_MEETING_MINUTES_CAP_EXCEEDED
      # equality passes: booked + new_duration == MEETING_MINUTES_CAP is accepted
    input_set: "BuyerMeeting rows of the same market with status IN {SCHEDULED, COMPLETED, NO_SHOW}. CANCELLED meetings release both the table interval and their minutes; NO_SHOW meetings release neither."
    constants:
      MEETING_MINUTES_CAP: 240
    precision: "instant comparison at whole-second resolution; duration_minutes is whole minutes, floor"

  # ---------------------------------------------------------------------------
  # Derived date arithmetic
  # ---------------------------------------------------------------------------
  - name: license_and_holdback_dates
    trigger: "POST /film-sales/pre-sale-contracts/{id}/execute; listed in that transition's side_effects"
    algorithm: projection
    formula: |
      license_start_date    = current_utc
      license_end_date      = license_start_date + license_term_months calendar months
                              # calendar-month addition: same day-of-month; if the
                              # target month is shorter, clamp to its last day
      holdback_release_date = Film.theatrical_release_date + holdback_days days
      # Reversion gate (POST .../revert): current_utc >= license_end_date, i.e.
      # the exact instant license_end_date IS reversible.
      # Delivery gate  (POST .../deliverable-packages):
      #   current_utc >= holdback_release_date, i.e. the exact instant IS deliverable.
    input_set: "the executing contract's own license_term_months and holdback_days, plus the parent Film's theatrical_release_date as it stands at execution time"
    constants:
      CURE_WINDOW_DAYS: 30
      MAX_NEGOTIATION_ROUNDS: 4
    precision: "whole days and whole calendar months; all instants ISO 8601 UTC with three fractional digits"

  # ---------------------------------------------------------------------------
  # Deliverables completeness
  # ---------------------------------------------------------------------------
  - name: deliverable_completeness
    trigger: "POST /film-sales/pre-sale-contracts/{id}/deliverable-packages"
    algorithm: threshold
    formula: |
      complete =     payload technical_items_count >= REQUIRED_TECHNICAL_ITEMS
                 and payload legal_items_count     >= REQUIRED_LEGAL_ITEMS
      if not complete: -> ERR_DELIVERABLES_INCOMPLETE
      # boundary: exactly REQUIRED_TECHNICAL_ITEMS technical and exactly
      # REQUIRED_LEGAL_ITEMS legal items is COMPLETE; one fewer of either is not.
      revision_round = 1 if no prior DeliverablePackage exists for this contract
                       else (latest package by created_at ASC).revision_round + 1
      cure_deadline  = submitted_at + CURE_WINDOW_DAYS days   (stamped on rejection only)
    input_set: "the payload counts only; previously submitted packages of the same contract determine revision_round, selected as the latest by created_at ASC"
    constants:
      REQUIRED_TECHNICAL_ITEMS: 14
      REQUIRED_LEGAL_ITEMS: 6
      MAX_REVISION_ROUNDS: 2
      CURE_WINDOW_DAYS: 30
    precision: "integer counts; dates in whole days"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending `priority`; the FIRST
#      failing row decides the response, all later rows are skipped)
# =============================================================================
validations:

  # ---- authentication / authorization -------------------------------------
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven §1.7 roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the X-User-Role is listed in the target endpoint's §1.5 `roles`"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # ---- existence, left-to-right along the path then body FKs ---------------
  - priority: 30
    category: existence
    check: "the {id} in a /films/{id}... path resolves to a Film, and a body film_id resolves to a Film"
    error_id: ERR_FILM_NOT_FOUND
    http_status: 404
    applies_to: "all /films/{id}* endpoints, POST /film-sales/territory-valuations, POST /film-sales/screening-slots, POST /film-sales/buyer-meetings, POST /film-sales/pre-sale-contracts"

  - priority: 31
    category: existence
    check: "the {id} in a /territories/{id}... path resolves to a Territory, and a body territory_id resolves to a Territory"
    error_id: ERR_TERRITORY_NOT_FOUND
    http_status: 404
    applies_to: "all /territories/{id}* endpoints, POST /film-sales/territory-valuations, POST /film-sales/pre-sale-contracts"

  - priority: 32
    category: existence
    check: "the {id} in a /markets/{id}... path resolves to a Market, and a body market_id resolves to a Market"
    error_id: ERR_MARKET_NOT_FOUND
    http_status: 404
    applies_to: "all /markets/{id}* endpoints, POST /film-sales/screening-slots, POST /film-sales/buyer-meetings"

  - priority: 33
    category: existence
    check: "the {id} in a /buyers/{id} path resolves to a Buyer, and a body buyer_id resolves to a Buyer"
    error_id: ERR_BUYER_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /film-sales/buyers/{id}, POST /film-sales/buyer-meetings, POST /film-sales/pre-sale-contracts"

  - priority: 34
    category: existence
    check: "the {id} in a /pre-sale-contracts/{id}... path resolves to a PreSaleContract"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "all /pre-sale-contracts/{id}* endpoints"

  - priority: 35
    category: existence
    check: "the {id} in a /territory-valuations/{id}... path resolves to a TerritoryValuation"
    error_id: ERR_VALUATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /film-sales/territory-valuations/{id}, POST /film-sales/territory-valuations/{id}/publish"

  - priority: 36
    category: existence
    check: "the {id} in an /agency-agreements/{id}... path resolves to a SalesAgencyAgreement"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /agency-agreements/{id}* endpoints"

  - priority: 37
    category: existence
    check: "the {id} in a /payment-milestones/{id}... path resolves to a PaymentMilestone"
    error_id: ERR_MILESTONE_NOT_FOUND
    http_status: 404
    applies_to: "all /payment-milestones/{id}* endpoints"

  - priority: 38
    category: existence
    check: "the {id} in a /deliverable-packages/{id}... path resolves to a DeliverablePackage"
    error_id: ERR_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "all /deliverable-packages/{id}* endpoints"

  - priority: 39
    category: existence
    check: "the {id} in a /banking-facilities/{id}... path resolves to a BankingFacility"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "all /banking-facilities/{id}* endpoints"

  - priority: 40
    category: existence
    check: "the {id} in a /collection-accounts/{id}... path resolves to a CollectionAccount"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all /collection-accounts/{id}* endpoints"

  - priority: 41
    category: existence
    check: "the {id} in a /screening-slots/{id}... path resolves to a ScreeningSlot, and the {id} in a /buyer-meetings/{id}... path resolves to a BuyerMeeting"
    error_id: ERR_MARKET_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all /screening-slots/{id}* and /buyer-meetings/{id}* endpoints"

  # ---- request shape ------------------------------------------------------
  - priority: 42
    category: business_constraint
    check: "every required body field of the §1.5 endpoint is present, enum values are members of the declared constraint set, numbers respect their declared ranges, and end/close instants are strictly after their start counterparts"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- ownership for entity_backed roles ----------------------------------
  - priority: 45
    category: auth
    check: "when X-User-Role == Buyer, X-User-ID equals the buyer_id of the targeted PreSaleContract, or of the PreSaleContract owning the targeted DeliverablePackage"
    error_id: ERR_NOT_CONTRACT_BUYER
    http_status: 403
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/counter, POST /film-sales/pre-sale-contracts/{id}/accept, POST /film-sales/deliverable-packages/{id}/qc-result"

  # ---- optimistic concurrency --------------------------------------------
  - priority: 48
    category: state
    check: "payload expected_film_version == Film.version for the valuation's film (§1.2.1 valuation-publish-stale-film)"
    error_id: ERR_STALE_FILM_VERSION
    http_status: 412
    applies_to: "POST /film-sales/territory-valuations/{id}/publish"

  - priority: 49
    category: state
    check: "payload expected_buyer_version == Buyer.version for the body buyer_id (§1.2.1 contract-offer-stale-buyer)"
    error_id: ERR_STALE_BUYER_VERSION
    http_status: 412
    applies_to: "POST /film-sales/pre-sale-contracts"

  # ---- state preconditions on the target row -------------------------------
  - priority: 50
    category: state
    check: "the target row's own status permits the requested transition per §1.2 (includes a repeated trigger on a row already in the destination or a terminal state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST /film-sales/**/state, .../counter, .../revise-offer, .../accept, .../execute, .../lapse, .../revert, .../publish, .../qc-result, .../receipt, .../reverse-receipt, .../completion-bond endpoints"

  # ---- state preconditions on a related row --------------------------------
  - priority: 52
    category: state
    check: "Film.sales_status IN {PACKAGING, IN_MARKET} when creating a ScreeningSlot or BuyerMeeting; Film.sales_status IN {IN_MARKET, SOLD_OUT} when creating a PreSaleContract"
    error_id: ERR_FILM_NOT_IN_MARKET
    http_status: 409
    applies_to: "POST /film-sales/screening-slots, POST /film-sales/buyer-meetings, POST /film-sales/pre-sale-contracts"

  - priority: 53
    category: state
    check: "Market.status == OPEN for the referenced market_id"
    error_id: ERR_MARKET_NOT_OPEN
    http_status: 409
    applies_to: "POST /film-sales/screening-slots, POST /film-sales/buyer-meetings, POST /film-sales/screening-slots/{id}/state with to_status=CONFIRMED"

  - priority: 54
    category: state
    check: "a CollectionAccount with film_id == the contract's film_id exists and has status == OPEN"
    error_id: ERR_COLLECTION_ACCOUNT_NOT_OPEN
    http_status: 409
    applies_to: "POST /film-sales/payment-milestones/{id}/receipt, POST /film-sales/payment-milestones/{id}/reverse-receipt, POST /film-sales/collection-accounts/{id}/distribute"

  # ---- business_safety: compliance and segregation of duties ---------------
  - priority: 60
    category: business_safety
    check: "on contract execution, X-User-ID != the published_by_user_id of the PUBLISHED TerritoryValuation with the same (film_id, territory_id); on facility draw, X-User-ID != BankingFacility.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/execute, POST /film-sales/banking-facilities/{id}/state with to_status=DRAWN"

  - priority: 62
    category: business_safety
    check: "Buyer.status != BLOCKED for the referenced buyer_id"
    error_id: ERR_BUYER_BLOCKED
    http_status: 422
    applies_to: "POST /film-sales/buyer-meetings, POST /film-sales/pre-sale-contracts, POST /film-sales/pre-sale-contracts/{id}/accept"

  - priority: 64
    category: business_safety
    check: "BankingFacility.completion_bond_required == false OR BankingFacility.completion_bond_posted == true"
    error_id: ERR_COMPLETION_BOND_REQUIRED
    http_status: 422
    applies_to: "POST /film-sales/banking-facilities/{id}/state with to_status=DRAWN"

  # ---- business_referential ------------------------------------------------
  - priority: 70
    category: business_referential
    check: "a SalesAgencyAgreement with film_id == the target film_id has status == EXECUTED and term_start_date <= current_utc < term_end_date"
    error_id: ERR_AGENCY_AGREEMENT_NOT_IN_FORCE
    http_status: 422
    applies_to: "POST /film-sales/territory-valuations/{id}/publish, POST /film-sales/pre-sale-contracts, POST /film-sales/pre-sale-contracts/{id}/execute, POST /film-sales/agency-agreements/{id}/expenses"

  - priority: 72
    category: business_referential
    check: "a TerritoryValuation with the same (film_id, territory_id) as the contract has status == PUBLISHED"
    error_id: ERR_NO_PUBLISHED_VALUATION
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/execute"

  - priority: 74
    category: business_referential
    check: "at least one PreSaleContract of the facility's film has negotiation_status == EXECUTED with a Buyer whose credit_rating IN {AAA, AA, A} and status == ACTIVE, and BankingFacility.eligible_collateral_usd > 0"
    error_id: ERR_NO_ELIGIBLE_COLLATERAL
    http_status: 422
    applies_to: "POST /film-sales/banking-facilities/{id}/state with to_status=APPROVED"

  # ---- business_temporal ---------------------------------------------------
  - priority: 80
    category: business_temporal
    check: "the requested (market_id, room_number) window clears every HELD/CONFIRMED slot by at least TURNAROUND_MINUTES on both sides (§1.3 screening_room_occupancy)"
    error_id: ERR_SCREENING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /film-sales/screening-slots"

  - priority: 81
    category: business_temporal
    check: "the requested window does not overlap any live BuyerMeeting on the same table_number or on the same buyer_id in this market (§1.3 meeting_table_occupancy)"
    error_id: ERR_MEETING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /film-sales/buyer-meetings"

  - priority: 82
    category: business_temporal
    check: "Market.start_date <= start_at AND end_at <= Market.end_date"
    error_id: ERR_OUTSIDE_MARKET_WINDOW
    http_status: 422
    applies_to: "POST /film-sales/screening-slots, POST /film-sales/buyer-meetings"

  - priority: 83
    category: business_temporal
    check: "current_utc >= PreSaleContract.holdback_release_date"
    error_id: ERR_HOLDBACK_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/deliverable-packages"

  - priority: 84
    category: business_temporal
    check: "current_utc >= PreSaleContract.license_end_date"
    error_id: ERR_LICENSE_TERM_NOT_EXPIRED
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/revert"

  - priority: 85
    category: business_temporal
    check: "current_utc <= the cure_deadline of the latest REJECTED DeliverablePackage of this contract"
    error_id: ERR_CURE_WINDOW_ELAPSED
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/deliverable-packages (resubmission only)"

  # ---- business_constraint -------------------------------------------------
  - priority: 90
    category: business_constraint
    check: "no PreSaleContract for the same (film_id, territory_id) has negotiation_status IN {ACCEPTED, EXECUTED}, and none with negotiation_status IN {OFFERED, COUNTERED} belongs to a DIFFERENT buyer_id"
    error_id: ERR_DUPLICATE_TERRITORY_OFFER
    http_status: 409
    applies_to: "POST /film-sales/pre-sale-contracts"

  - priority: 91
    category: business_constraint
    check: "the eligible ComparableTitle set for the (film, territory) pair is non-empty"
    error_id: ERR_NO_COMPARABLE_TITLES
    http_status: 422
    applies_to: "POST /film-sales/territory-valuations"

  - priority: 92
    category: business_constraint
    check: "comp_sample_size >= MIN_COMP_SAMPLE (3) for the eligible ComparableTitle set"
    error_id: ERR_INSUFFICIENT_COMP_SAMPLE
    http_status: 422
    applies_to: "POST /film-sales/territory-valuations"

  - priority: 93
    category: business_constraint
    check: "on POST .../payment-milestones: PreSaleContract.milestone_pct_total + payload pct_of_mg <= 1.0000 (a partial schedule is accepted while it is being built up) and no two milestones of a contract may share the same label; on POST .../execute: the stored milestone_pct_total must equal exactly 1.0000"
    error_id: ERR_MILESTONE_SCHEDULE_INVALID
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/payment-milestones, POST /film-sales/pre-sale-contracts/{id}/execute"

  - priority: 94
    category: business_constraint
    check: "PreSaleContract.negotiation_round < MAX_NEGOTIATION_ROUNDS (4)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/counter, POST /film-sales/pre-sale-contracts/{id}/revise-offer"

  - priority: 95
    category: business_constraint
    check: "booked minutes for this buyer at this market plus the new duration <= MEETING_MINUTES_CAP (240)"
    error_id: ERR_MEETING_MINUTES_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /film-sales/buyer-meetings"

  - priority: 96
    category: business_constraint
    check: "technical_items_count >= REQUIRED_TECHNICAL_ITEMS (14) AND legal_items_count >= REQUIRED_LEGAL_ITEMS (6)"
    error_id: ERR_DELIVERABLES_INCOMPLETE
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/deliverable-packages"

  - priority: 97
    category: business_constraint
    check: "tier_order is unique per account_id, and at most one WaterfallTier per account has cap_usd == null"
    error_id: ERR_TIER_ORDER_TAKEN
    http_status: 409
    applies_to: "POST /film-sales/collection-accounts/{id}/waterfall-tiers"

  - priority: 98
    category: business_constraint
    check: "Territory.code is unique across all Territory rows"
    error_id: ERR_TERRITORY_CODE_TAKEN
    http_status: 409
    applies_to: "POST /film-sales/territories"

  # ---- business_fiscal (last) ---------------------------------------------
  - priority: 100
    category: business_fiscal
    check: "Buyer.outstanding_exposure_usd (GROSS_PIPELINE) + payload minimum_guarantee_usd <= Buyer.exposure_limit_usd — equality passes"
    error_id: ERR_BUYER_EXPOSURE_EXCEEDED
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts, POST /film-sales/pre-sale-contracts/{id}/revise-offer"

  - priority: 101
    category: business_fiscal
    check: "Buyer.net_unpaid_exposure_usd (NET_UNPAID) + PreSaleContract.unpaid_amount_usd <= round(Buyer.exposure_limit_usd * NET_EXECUTION_HEADROOM, 2) — equality passes"
    error_id: ERR_BUYER_NET_EXPOSURE_EXCEEDED
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/execute"

  - priority: 102
    category: business_fiscal
    check: "PreSaleContract.minimum_guarantee_usd >= floor_price_usd of the PUBLISHED TerritoryValuation for the same (film_id, territory_id) — equality passes"
    error_id: ERR_MG_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /film-sales/pre-sale-contracts/{id}/execute"

  - priority: 103
    category: business_fiscal
    check: "payload amount_usd == PaymentMilestone.amount_usd exactly (no partial or over-payment)"
    error_id: ERR_RECEIPT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /film-sales/payment-milestones/{id}/receipt"

  - priority: 104
    category: business_fiscal
    check: "payload amount_in_usd <= CollectionAccount.balance_usd — equality passes"
    error_id: ERR_INSUFFICIENT_ACCOUNT_BALANCE
    http_status: 422
    applies_to: "POST /film-sales/collection-accounts/{id}/distribute"

  - priority: 105
    category: business_fiscal
    check: "CollectionAccount.balance_usd >= PaymentMilestone.received_amount_usd (the cash has not already been distributed away)"
    error_id: ERR_RECEIPT_ALREADY_DISTRIBUTED
    http_status: 422
    applies_to: "POST /film-sales/payment-milestones/{id}/reverse-receipt"

  - priority: 106
    category: business_fiscal
    check: "payload amount_usd > 0 and SalesAgencyAgreement.expenses_incurred_usd + payload amount_usd <= expense_cap_usd * EXPENSE_LOG_TOLERANCE (2.00) — expenses may be logged above the cap up to twice it, but only the cap is ever recoupable"
    error_id: ERR_EXPENSE_LOG_LIMIT
    http_status: 422
    applies_to: "POST /film-sales/agency-agreements/{id}/expenses"

# =============================================================================
# §1.5 API Endpoint Table
#   * every path placeholder is the literal `{id}`
#   * api_prefix /film-sales is included in every `path:`
# =============================================================================
endpoints:

  # ---------------------------- Film ---------------------------------------
  - method: POST
    path: "/film-sales/films"
    description: "Register a film into the sales slate. sales_status starts at DEVELOPMENT."
    roles: [PlatformAdmin]
    code: 201
    input: [title, genre, production_budget_usd, principal_cast_score, estimated_delivery_date, theatrical_release_date, "completion_status?"]
    output: Film
    side_effects:
      - "sets sales_status = DEVELOPMENT, total_mg_committed_usd = 0.00, total_mg_collected_usd = 0.00, published_territory_count = 0, licensed_territory_count = 0"
      - "sets financing_gap_usd = production_budget_usd"

  - method: GET
    path: "/film-sales/films"
    description: "List films, newest first by created_at DESC then id ASC, with optional sales_status filter."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: ["sales_status?", "genre?", "limit?", "offset?"]
    output: Film[]
    side_effects: []

  - method: GET
    path: "/film-sales/films/{id}"
    description: "Fetch one film with all derived slate counters."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: Film
    side_effects: []

  - method: PATCH
    path: "/film-sales/films/{id}"
    description: "Amend production facts on a film. Only the listed fields are mutable; sales_status is not settable here."
    roles: [PlatformAdmin]
    code: 200
    input: ["completion_status?", "principal_cast_score?", "theatrical_release_date?", "estimated_delivery_date?"]
    output: Film
    side_effects:
      - "increments Film.version by 1"
      - "marks every PUBLISHED TerritoryValuation of this film STALE when principal_cast_score changes (§1.2 TerritoryValuation)"

  - method: POST
    path: "/film-sales/films/{id}/state"
    description: "Drive the film's sales_status through the §1.2 Film machine (PACKAGING, IN_MARKET, SOLD_OUT, WRAPPED)."
    roles: [HeadOfSales, PlatformAdmin]
    code: 200
    input: [to_status]
    output: Film
    side_effects:
      - "increments Film.version by 1"
      - "on WRAPPED: cascades every OFFERED/COUNTERED PreSaleContract of the film to LAPSED"

  - method: POST
    path: "/film-sales/films/{id}/agency-agreements"
    description: "Draft a sales agency agreement for the film."
    roles: [HeadOfSales]
    code: 201
    input: [commission_pct, expense_cap_usd, term_months, term_start_date]
    output: SalesAgencyAgreement
    side_effects:
      - "computes term_end_date = term_start_date + term_months calendar months (§1.3 license_and_holdback_dates month arithmetic)"
      - "sets status = DRAFT and all money counters to 0.00"

  - method: GET
    path: "/film-sales/films/{id}/agency-agreements"
    description: "Reverse lookup: every SalesAgencyAgreement whose film_id is this film, ordered by created_at ASC."
    roles: [SalesAgent, HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: SalesAgencyAgreement[]
    side_effects: []

  - method: POST
    path: "/film-sales/films/{id}/banking-facilities"
    description: "Propose a lender facility that will discount the film's pre-sale contracts."
    roles: [Lender]
    code: 201
    input: [lender_name, discount_rate_pct, advance_rate_pct, facility_cap_usd, "completion_bond_required?"]
    output: BankingFacility
    side_effects:
      - "sets status = PROPOSED, completion_bond_posted = false, and every money counter to 0.00"

  - method: GET
    path: "/film-sales/films/{id}/banking-facilities"
    description: "Reverse lookup: every BankingFacility whose film_id is this film, ordered by created_at ASC."
    roles: [HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: BankingFacility[]
    side_effects: []

  - method: POST
    path: "/film-sales/films/{id}/collection-accounts"
    description: "Open the collection account that receives every buyer payment for this film."
    roles: [CollectionAgent]
    code: 201
    input: [bank_name, account_reference]
    output: CollectionAccount
    side_effects:
      - "sets status = OPEN, balance_usd = 0.00, total_receipts_usd = 0.00, total_distributed_usd = 0.00, run_count = 0"

  - method: GET
    path: "/film-sales/films/{id}/collection-accounts"
    description: "Reverse lookup: every CollectionAccount whose film_id is this film, ordered by created_at ASC."
    roles: [HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: CollectionAccount[]
    side_effects: []

  # ------------------------- SalesAgencyAgreement --------------------------
  - method: POST
    path: "/film-sales/agency-agreements/{id}/state"
    description: "Execute, terminate or expire the agency agreement per the §1.2 SalesAgencyAgreement machine."
    roles: [HeadOfSales]
    code: 200
    input: [to_status]
    output: SalesAgencyAgreement
    side_effects:
      - "on EXECUTED: records executed_by_user_id = X-User-ID"
      - "on TERMINATED: no money counter is reset — expenses_recouped_usd and commission_earned_usd keep their values so the waterfall stays reconcilable"

  - method: POST
    path: "/film-sales/agency-agreements/{id}/expenses"
    description: "Log a recoupable sales expense against the agreement's expense cap."
    roles: [SalesAgent, HeadOfSales]
    code: 200
    input: [amount_usd, memo]
    output: SalesAgencyAgreement
    side_effects:
      - "adds amount_usd to expenses_incurred_usd"
      - "resyncs the SALES_EXPENSES WaterfallTier cap_usd to min(expenses_incurred_usd, expense_cap_usd) on every OPEN CollectionAccount of the film (§1.3 sales_commission_accrual tier resync)"

  # ---------------------------- Territory ----------------------------------
  - method: POST
    path: "/film-sales/territories"
    description: "Create a licensing territory. code is globally unique."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, region, market_tier, currency_code, base_value_index]
    output: Territory
    side_effects: []

  - method: GET
    path: "/film-sales/territories"
    description: "List territories ordered by code ASC."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: ["region?", "market_tier?", "limit?", "offset?"]
    output: Territory[]
    side_effects: []

  - method: GET
    path: "/film-sales/territories/{id}"
    description: "Fetch one territory."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: Territory
    side_effects: []

  - method: POST
    path: "/film-sales/territories/{id}/comparable-titles"
    description: "Record a comparable title's historical license fee in this territory."
    roles: [PlatformAdmin, SalesAgent]
    code: 201
    input: [name, genre, cast_score, gross_license_fee_usd, release_year, "verified?"]
    output: ComparableTitle
    side_effects: []

  - method: GET
    path: "/film-sales/territories/{id}/comparable-titles"
    description: "Reverse lookup: every ComparableTitle whose territory_id is this territory, ordered by created_at ASC."
    roles: [SalesAgent, HeadOfSales, PlatformAdmin]
    code: 200
    input: []
    output: ComparableTitle[]
    side_effects: []

  - method: POST
    path: "/film-sales/territories/{id}/buyers"
    description: "Onboard a distributor buying rights in this territory."
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, credit_rating, exposure_limit_usd, "status?"]
    output: Buyer
    side_effects:
      - "sets outstanding_exposure_usd = 0.00 and net_unpaid_exposure_usd = 0.00"

  - method: GET
    path: "/film-sales/territories/{id}/buyers"
    description: "Reverse lookup: every Buyer whose territory_id is this territory, ordered by created_at ASC."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: Buyer[]
    side_effects: []

  # ------------------------------ Buyer ------------------------------------
  - method: GET
    path: "/film-sales/buyers/{id}"
    description: "Fetch one buyer with both exposure variants (§1.3 buyer_exposure)."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  - method: PATCH
    path: "/film-sales/buyers/{id}"
    description: "Update a buyer's credit standing or exposure limit. Every successful call advances Buyer.version, which is what §1.2.1 contract-offer-stale-buyer observes."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "credit_rating?", "exposure_limit_usd?"]
    output: Buyer
    side_effects:
      - "increments Buyer.version by 1"
      - "recomputes BankingFacility.eligible_collateral_usd and advance_amount_usd on every APPROVED or DRAWN facility whose film has an EXECUTED contract with this buyer (§1.3 presale_discounted_advance)"

  # ------------------------ TerritoryValuation ------------------------------
  - method: POST
    path: "/film-sales/territory-valuations"
    description: "Value one territory for one film. The chosen method selects the §1.3 territory_value_estimate variant; the comparable set is sampled at creation time."
    roles: [SalesAgent, HeadOfSales]
    code: 201
    input: [film_id, territory_id, method]
    output: TerritoryValuation
    side_effects:
      - "computes comp_sample_size, comp_median_usd, cast_multiplier, estimate_usd, ask_price_usd and floor_price_usd per §1.3 territory_value_estimate"
      - "sets status = DRAFT"

  - method: GET
    path: "/film-sales/territory-valuations"
    description: "Reverse lookup and filtered list of valuations, ordered by created_at ASC."
    roles: [SalesAgent, HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: ["film_id?", "territory_id?", "status?", "method?", "limit?", "offset?"]
    output: TerritoryValuation[]
    side_effects: []

  - method: GET
    path: "/film-sales/territory-valuations/{id}"
    description: "Fetch one valuation."
    roles: [SalesAgent, HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: TerritoryValuation
    side_effects: []

  - method: POST
    path: "/film-sales/territory-valuations/{id}/publish"
    description: "Publish the valuation so contracts may be executed against its floor price. Carries the §1.2.1 valuation-publish-stale-film OCC guard on the parent film."
    roles: [HeadOfSales]
    code: 200
    input: [expected_film_version]
    output: TerritoryValuation
    side_effects:
      - "sets status = PUBLISHED, published_by_user_id = X-User-ID, published_at = current_utc"
      - "increments Film.version by 1"
      - "increments Film.published_territory_count by 1"
      - "moves any other PUBLISHED TerritoryValuation with the same (film_id, territory_id) to STALE"

  # ------------------------------ Market -----------------------------------
  - method: POST
    path: "/film-sales/markets"
    description: "Create a film market (AFM, EFM, Cannes) with its screening-room and meeting-table inventory."
    roles: [PlatformAdmin]
    code: 201
    input: [name, city, start_date, end_date, screening_room_count, meeting_table_count]
    output: Market
    side_effects:
      - "sets status = PLANNED"

  - method: GET
    path: "/film-sales/markets"
    description: "List markets ordered by start_date ASC then created_at ASC."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  - method: GET
    path: "/film-sales/markets/{id}"
    description: "Fetch one market."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, PlatformAdmin]
    code: 200
    input: []
    output: Market
    side_effects: []

  - method: POST
    path: "/film-sales/markets/{id}/state"
    description: "Open or close the market per the §1.2 Market machine."
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: Market
    side_effects:
      - "on CLOSED: cancels every HELD ScreeningSlot of this market (CONFIRMED slots are left untouched — conditional cascade)"
      - "on CLOSED: marks every still-SCHEDULED BuyerMeeting of this market NO_SHOW"

  # --------------------------- ScreeningSlot -------------------------------
  - method: POST
    path: "/film-sales/screening-slots"
    description: "Hold a screening room. Enforces the §1.3 screening_room_occupancy 30-minute turnaround buffer."
    roles: [SalesAgent, HeadOfSales]
    code: 201
    input: [market_id, film_id, room_number, start_at, end_at, slot_type, capacity]
    output: ScreeningSlot
    side_effects:
      - "sets status = HELD"

  - method: GET
    path: "/film-sales/screening-slots"
    description: "Reverse lookup and filtered list of screening slots, ordered by start_at ASC then created_at ASC."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, PlatformAdmin]
    code: 200
    input: ["market_id?", "film_id?", "status?", "room_number?", "limit?", "offset?"]
    output: ScreeningSlot[]
    side_effects: []

  - method: GET
    path: "/film-sales/screening-slots/{id}"
    description: "Fetch one screening slot."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, PlatformAdmin]
    code: 200
    input: []
    output: ScreeningSlot
    side_effects: []

  - method: POST
    path: "/film-sales/screening-slots/{id}/state"
    description: "Confirm or cancel a screening slot per the §1.2 ScreeningSlot machine."
    roles: [SalesAgent, HeadOfSales]
    code: 200
    input: [to_status]
    output: ScreeningSlot
    side_effects:
      - "on CANCELLED: releases the (market_id, room_number) interval so a later slot may occupy it"

  # ---------------------------- BuyerMeeting -------------------------------
  - method: POST
    path: "/film-sales/buyer-meetings"
    description: "Book a buyer meeting at a market table. Enforces the §1.3 meeting_table_occupancy table and buyer interval rules plus the 240-minute per-buyer aggregate cap."
    roles: [SalesAgent, HeadOfSales]
    code: 201
    input: [market_id, buyer_id, film_id, table_number, start_at, end_at]
    output: BuyerMeeting
    side_effects:
      - "computes duration_minutes = (end_at - start_at) in whole minutes"
      - "sets status = SCHEDULED and outcome = null"

  - method: GET
    path: "/film-sales/buyer-meetings"
    description: "Reverse lookup and filtered list of buyer meetings, ordered by start_at ASC then created_at ASC."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, PlatformAdmin, Buyer]
    code: 200
    input: ["market_id?", "buyer_id?", "film_id?", "status?", "table_number?", "limit?", "offset?"]
    output: BuyerMeeting[]
    side_effects: []

  - method: GET
    path: "/film-sales/buyer-meetings/{id}"
    description: "Fetch one buyer meeting."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: BuyerMeeting
    side_effects: []

  - method: POST
    path: "/film-sales/buyer-meetings/{id}/state"
    description: "Complete, cancel or mark no-show a buyer meeting per the §1.2 BuyerMeeting machine. outcome is required when to_status is COMPLETED."
    roles: [SalesAgent, HeadOfSales]
    code: 200
    input: [to_status, "outcome?"]
    output: BuyerMeeting
    side_effects:
      - "on CANCELLED: releases both the table interval and the buyer's booked minutes"
      - "on NO_SHOW: releases neither the interval nor the booked minutes (§1.3 meeting_table_occupancy)"

  # --------------------------- PreSaleContract -----------------------------
  - method: POST
    path: "/film-sales/pre-sale-contracts"
    description: "Open a pre-sale offer to a buyer for one territory. Carries the §1.2.1 contract-offer-stale-buyer OCC guard on the buyer."
    roles: [SalesAgent, HeadOfSales]
    code: 201
    input: [film_id, buyer_id, territory_id, minimum_guarantee_usd, license_term_months, holdback_days, expected_buyer_version]
    output: PreSaleContract
    side_effects:
      - "sets negotiation_status = OFFERED, delivery_status = PENDING, collection_status = UNPAID, negotiation_round = 1, milestone_pct_total = 0.0000, offered_by_user_id = X-User-ID"
      - "leaves license_start_date, license_end_date and holdback_release_date null — §1.3 license_and_holdback_dates stamps them at execution"
      - "increments Buyer.version by 1"
      - "recomputes Buyer.outstanding_exposure_usd per §1.3 buyer_exposure GROSS_PIPELINE"
      - "lapses any earlier OFFERED or COUNTERED contract with the same (film_id, buyer_id, territory_id) — supersede cascade"

  - method: GET
    path: "/film-sales/pre-sale-contracts"
    description: "Reverse lookup and filtered list of contracts, ordered by created_at ASC."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin, Buyer]
    code: 200
    input: ["film_id?", "buyer_id?", "territory_id?", "negotiation_status?", "delivery_status?", "collection_status?", "limit?", "offset?"]
    output: PreSaleContract[]
    side_effects: []

  - method: GET
    path: "/film-sales/pre-sale-contracts/{id}"
    description: "Fetch one contract with all three status axes and its money counters."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, CollectionAgent, Lender, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: PreSaleContract
    side_effects: []

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/counter"
    description: "Buyer counters the standing offer. Advances negotiation_round."
    roles: [Buyer]
    code: 200
    input: [counter_minimum_guarantee_usd, "counter_license_term_months?", "counter_holdback_days?"]
    output: PreSaleContract
    side_effects:
      - "sets negotiation_status = COUNTERED and negotiation_round += 1"
      - "stores counter_minimum_guarantee_usd without changing minimum_guarantee_usd"

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/revise-offer"
    description: "Sales agent answers a counter with a revised offer. Advances negotiation_round."
    roles: [SalesAgent, HeadOfSales]
    code: 200
    input: [minimum_guarantee_usd, "license_term_months?", "holdback_days?"]
    output: PreSaleContract
    side_effects:
      - "sets negotiation_status = OFFERED and negotiation_round += 1"
      - "clears counter_minimum_guarantee_usd to null"
      - "overwrites minimum_guarantee_usd, and license_term_months / holdback_days when supplied"
      - "recomputes Buyer.outstanding_exposure_usd per §1.3 buyer_exposure GROSS_PIPELINE"

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/accept"
    description: "Buyer accepts the standing offer."
    roles: [Buyer]
    code: 200
    input: []
    output: PreSaleContract
    side_effects:
      - "sets negotiation_status = ACCEPTED"

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/execute"
    description: "Countersign an accepted contract. Requires a complete milestone schedule, a PUBLISHED valuation whose floor the MG clears, and a different user from the one who published that valuation."
    roles: [HeadOfSales]
    code: 200
    input: []
    output: PreSaleContract
    side_effects:
      - "sets negotiation_status = EXECUTED, executed_by_user_id = X-User-ID"
      - "stamps license_start_date = current_utc and computes license_end_date and holdback_release_date per §1.3 license_and_holdback_dates"
      - "computes unpaid_amount_usd = sum of the SCHEDULED and INVOICED PaymentMilestone amount_usd values"
      - "moves the ON_SIGNATURE PaymentMilestone SCHEDULED -> INVOICED"
      - "moves the matching PUBLISHED TerritoryValuation to LICENSED and recomputes Film.licensed_territory_count"
      - "adds minimum_guarantee_usd to Film.total_mg_committed_usd and reduces Film.financing_gap_usd by the same amount"
      - "recomputes Buyer.net_unpaid_exposure_usd per §1.3 buyer_exposure NET_UNPAID"
      - "recomputes eligible_collateral_usd and advance_amount_usd on every APPROVED, DRAWN or MARGIN_CALL BankingFacility of the film per §1.3 presale_discounted_advance"
      - "moves the film IN_MARKET -> SOLD_OUT when licensed_territory_count == published_territory_count and published_territory_count > 0"

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/lapse"
    description: "Abandon a contract that has not yet been executed."
    roles: [HeadOfSales]
    code: 200
    input: [reason]
    output: PreSaleContract
    side_effects:
      - "sets negotiation_status = LAPSED"
      - "recomputes Buyer.outstanding_exposure_usd and Buyer.net_unpaid_exposure_usd"
      - "returns the matching LICENSED TerritoryValuation to PUBLISHED when this contract had been executed"

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/revert"
    description: "Revert rights to the sales agent after the license term has run. Only legal once current_utc has passed license_end_date."
    roles: [HeadOfSales]
    code: 200
    input: []
    output: PreSaleContract
    side_effects:
      - "sets negotiation_status = REVERTED"
      - "returns the matching LICENSED TerritoryValuation to PUBLISHED and recomputes Film.licensed_territory_count"
      - "moves the film SOLD_OUT -> IN_MARKET when licensed_territory_count < published_territory_count"
      - "recomputes Buyer.net_unpaid_exposure_usd and every affected BankingFacility's advance_amount_usd"

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/payment-milestones"
    description: "Add one payment milestone to the contract's schedule. The schedule must total exactly 1.0000 before the contract can be executed."
    roles: [SalesAgent, HeadOfSales]
    code: 201
    input: [label, pct_of_mg, due_date]
    output: PaymentMilestone
    side_effects:
      - "computes amount_usd = round(PreSaleContract.minimum_guarantee_usd * pct_of_mg, 2)"
      - "sets status = SCHEDULED, received_amount_usd = 0.00, accrued_commission_usd = 0.00"
      - "adds pct_of_mg to PreSaleContract.milestone_pct_total"

  - method: GET
    path: "/film-sales/pre-sale-contracts/{id}/payment-milestones"
    description: "Reverse lookup: every PaymentMilestone of this contract, ordered by due_date ASC then created_at ASC."
    roles: [SalesAgent, HeadOfSales, CollectionAgent, Lender, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: PaymentMilestone[]
    side_effects: []

  - method: POST
    path: "/film-sales/pre-sale-contracts/{id}/deliverable-packages"
    description: "Submit (or resubmit) the technical and legal deliverables for buyer QC. Gated on the holdback having elapsed."
    roles: [DeliveryManager]
    code: 201
    input: [technical_items_count, legal_items_count]
    output: DeliverablePackage
    side_effects:
      - "sets revision_round = 1 for a first submission, or previous revision_round + 1 for a resubmission"
      - "sets status = SUBMITTED, qc_result = PENDING, submitted_at = current_utc, submitted_by_user_id = X-User-ID"
      - "moves PreSaleContract.delivery_status to SUBMITTED"

  - method: GET
    path: "/film-sales/pre-sale-contracts/{id}/deliverable-packages"
    description: "Reverse lookup: every DeliverablePackage of this contract, ordered by revision_round ASC then created_at ASC."
    roles: [SalesAgent, HeadOfSales, DeliveryManager, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: DeliverablePackage[]
    side_effects: []

  # ------------------------- DeliverablePackage ----------------------------
  - method: POST
    path: "/film-sales/deliverable-packages/{id}/qc-result"
    description: "Buyer records the QC verdict on a submitted package. A FAIL at the revision limit is final and unwinds the whole deal (deepest §1.2 cascade)."
    roles: [Buyer]
    code: 200
    input: [result, "rejection_reason?"]
    output: DeliverablePackage
    side_effects:
      - "on PASS: status = ACCEPTED, qc_result = PASS; PreSaleContract.delivery_status becomes ACCEPTED at revision_round 1 or CURED at revision_round >= 2; the ON_DELIVERY PaymentMilestone moves SCHEDULED -> INVOICED"
      - "on FAIL below the revision limit: status = REJECTED, qc_result = FAIL, cure_deadline = current_utc + CURE_WINDOW_DAYS; PreSaleContract.delivery_status becomes REJECTED"
      - "on FAIL at the revision limit: status = REJECTED_FINAL; PreSaleContract negotiation_status EXECUTED -> LAPSED; every SCHEDULED or INVOICED PaymentMilestone becomes WRITTEN_OFF; the LICENSED TerritoryValuation returns to PUBLISHED; the film SOLD_OUT -> IN_MARKET; every DRAWN BankingFacility whose recomputed advance_amount_usd falls below drawn_amount_usd moves to MARGIN_CALL"

  # --------------------------- PaymentMilestone ----------------------------
  - method: POST
    path: "/film-sales/payment-milestones/{id}/receipt"
    description: "Record buyer cash against a milestone. Drives the §1.3 sales_commission_accrual tiering and the collection account balance."
    roles: [CollectionAgent]
    code: 200
    input: [amount_usd, received_at]
    output: PaymentMilestone
    side_effects:
      - "sets status = RECEIVED, received_at, received_amount_usd = amount_usd, received_by_user_id = X-User-ID"
      - "sets accrued_commission_usd per §1.3 sales_commission_accrual using the agreement's gross_collected_usd BEFORE this receipt to pick the rate"
      - "adds amount_usd to CollectionAccount.total_receipts_usd and balance_usd"
      - "adds amount_usd to SalesAgencyAgreement.gross_collected_usd and accrued_commission_usd to commission_earned_usd"
      - "resyncs the SALES_COMMISSION WaterfallTier cap_usd to the new commission_earned_usd"
      - "adds amount_usd to Film.total_mg_collected_usd"
      - "advances PreSaleContract.collection_status to PARTIALLY_PAID, or to PAID once every milestone of the contract is RECEIVED; recomputes received_amount_usd and unpaid_amount_usd"

  - method: POST
    path: "/film-sales/payment-milestones/{id}/reverse-receipt"
    description: "Reverse a mis-posted receipt. Every side effect of the original receipt is undone exactly, including the tiered commission actually accrued at the time."
    roles: [CollectionAgent]
    code: 200
    input: [reason]
    output: PaymentMilestone
    side_effects:
      - "sets status = INVOICED, clears received_at to null and received_amount_usd to 0.00"
      - "subtracts the milestone's received_amount_usd from CollectionAccount.total_receipts_usd and balance_usd"
      - "subtracts the milestone's accrued_commission_usd from SalesAgencyAgreement.commission_earned_usd and the receipt amount from gross_collected_usd, then clears accrued_commission_usd to 0.00"
      - "resyncs the SALES_COMMISSION WaterfallTier cap_usd to the restored commission_earned_usd"
      - "subtracts the receipt amount from Film.total_mg_collected_usd"
      - "moves PreSaleContract.collection_status PARTIALLY_PAID -> UNPAID when no milestone of the contract remains RECEIVED"

  # --------------------------- BankingFacility -----------------------------
  - method: POST
    path: "/film-sales/banking-facilities/{id}/state"
    description: "Approve, draw or default the lender facility per the §1.2 BankingFacility machine. Drawing requires a posted completion bond and a different user from the approver."
    roles: [Lender]
    code: 200
    input: [to_status]
    output: BankingFacility
    side_effects:
      - "on APPROVED: records approved_by_user_id = X-User-ID and computes eligible_collateral_usd plus advance_amount_usd per §1.3 presale_discounted_advance"
      - "on DRAWN: sets drawn_amount_usd = advance_amount_usd and outstanding_debt_usd = advance_amount_usd, and resyncs the BANK_DEBT WaterfallTier cap_usd to outstanding_debt_usd"
      - "on DEFAULTED: freezes outstanding_debt_usd at its current value"

  - method: POST
    path: "/film-sales/banking-facilities/{id}/completion-bond"
    description: "Post the completion bond that the lender requires before any draw. Removes the unbonded haircut from the advance."
    roles: [Lender]
    code: 200
    input: [bond_provider, bond_amount_usd]
    output: BankingFacility
    side_effects:
      - "sets completion_bond_posted = true, bond_provider, bond_amount_usd"
      - "recomputes advance_amount_usd without the UNBONDED_HAIRCUT factor per §1.3 presale_discounted_advance"
      - "moves the facility MARGIN_CALL -> DRAWN when the recomputed advance_amount_usd is at least drawn_amount_usd"

  # -------------------------- CollectionAccount ----------------------------
  - method: GET
    path: "/film-sales/collection-accounts/{id}"
    description: "Fetch one collection account with its running balance and reconciliation counters."
    roles: [HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: CollectionAccount
    side_effects: []

  - method: POST
    path: "/film-sales/collection-accounts/{id}/state"
    description: "Lock or unlock the collection account per the §1.2 CollectionAccount machine."
    roles: [CollectionAgent]
    code: 200
    input: [to_status]
    output: CollectionAccount
    side_effects:
      - "while LOCKED no receipt, reversal or distribution may touch this account"

  - method: POST
    path: "/film-sales/collection-accounts/{id}/waterfall-tiers"
    description: "Define one tier of the account's distribution waterfall. tier_order is unique per account and at most one tier may be uncapped."
    roles: [CollectionAgent]
    code: 201
    input: [tier_order, tier_type, recipient_name, pct_of_available, "cap_usd?"]
    output: WaterfallTier
    side_effects:
      - "sets recouped_usd = 0.00 and derives status = ACTIVE"

  - method: GET
    path: "/film-sales/collection-accounts/{id}/waterfall-tiers"
    description: "Reverse lookup: every WaterfallTier of this account, ordered by tier_order ASC."
    roles: [HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: WaterfallTier[]
    side_effects: []

  - method: POST
    path: "/film-sales/collection-accounts/{id}/distribute"
    description: "Run the waterfall over a stated amount of collected cash per §1.3 waterfall_distribution, returning the immutable allocation record."
    roles: [CollectionAgent]
    code: 201
    input: [amount_in_usd]
    output: DistributionRun
    side_effects:
      - "allocates amount_in_usd across the ACTIVE tiers in tier_order ASC, writing one allocations entry per tier including 0.00 entries for SUSPENDED and SATISFIED tiers"
      - "adds each allocation to the corresponding WaterfallTier.recouped_usd and re-derives its status"
      - "subtracts amount_in_usd from CollectionAccount.balance_usd, adds it to total_distributed_usd and increments run_count"
      - "adds the SALES_EXPENSES allocation to SalesAgencyAgreement.expenses_recouped_usd"
      - "subtracts the BANK_DEBT allocation from BankingFacility.outstanding_debt_usd and moves the facility DRAWN -> REPAID once outstanding_debt_usd reaches 0.00"

  - method: GET
    path: "/film-sales/collection-accounts/{id}/distribution-runs"
    description: "Reverse lookup: every DistributionRun of this account, ordered by run_index ASC."
    roles: [HeadOfSales, CollectionAgent, Lender, PlatformAdmin]
    code: 200
    input: []
    output: DistributionRun[]
    side_effects: []

  # ------------------------- test-driving endpoint --------------------------
  - method: POST
    path: "/film-sales/_clock/set_current_utc"
    description: "Set the server's logical current_utc. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — the fixed startup default — and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "every subsequent current_utc comparison (holdback release, license expiry, cure deadline, agreement term window, discount tenor) uses the new value"

# =============================================================================
# §1.6 Error Code Catalog — every id below is raised by at least one §1.4 row
# =============================================================================
errors:

  # ---- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven §1.7 roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's §1.5 roles"
  - id: ERR_NOT_CONTRACT_BUYER
    http: 403
    condition: "role Buyer acts on a PreSaleContract, or on a DeliverablePackage of a contract, whose buyer_id is not the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the caller executing a contract is the same user who published its TerritoryValuation, or the caller drawing a facility is the same user who approved it"

  # ---- not found ----------------------------------------------------------
  - id: ERR_FILM_NOT_FOUND
    http: 404
    condition: "no Film matches the path {id} or the body film_id"
  - id: ERR_TERRITORY_NOT_FOUND
    http: 404
    condition: "no Territory matches the path {id} or the body territory_id"
  - id: ERR_MARKET_NOT_FOUND
    http: 404
    condition: "no Market matches the path {id} or the body market_id"
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "no Buyer matches the path {id} or the body buyer_id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no PreSaleContract matches the path {id}"
  - id: ERR_VALUATION_NOT_FOUND
    http: 404
    condition: "no TerritoryValuation matches the path {id}"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no SalesAgencyAgreement matches the path {id}"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "no PaymentMilestone matches the path {id}"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "no DeliverablePackage matches the path {id}"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "no BankingFacility matches the path {id}"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no CollectionAccount matches the path {id}"
  - id: ERR_MARKET_ITEM_NOT_FOUND
    http: 404
    condition: "no ScreeningSlot matches a /screening-slots/{id} path, or no BuyerMeeting matches a /buyer-meetings/{id} path"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is absent, an enum value is outside the declared constraint set, a number falls outside its declared range, or an end instant is not strictly after its start instant"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_FILM_VERSION
    http: 412
    condition: "payload expected_film_version differs from the current Film.version on POST /film-sales/territory-valuations/{id}/publish"
  - id: ERR_STALE_BUYER_VERSION
    http: 412
    condition: "payload expected_buyer_version differs from the current Buyer.version on POST /film-sales/pre-sale-contracts"

  # ---- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current status does not permit the requested transition per §1.2, including a repeated trigger on a row already in the destination or a terminal state"
  - id: ERR_FILM_NOT_IN_MARKET
    http: 409
    condition: "Film.sales_status is outside the window the operation needs — {PACKAGING, IN_MARKET} for market bookings, {IN_MARKET, SOLD_OUT} for a new pre-sale offer"
  - id: ERR_MARKET_NOT_OPEN
    http: 409
    condition: "the referenced Market.status is not OPEN"
  - id: ERR_COLLECTION_ACCOUNT_NOT_OPEN
    http: 409
    condition: "the film's CollectionAccount is missing, LOCKED or CLOSED when cash is posted, reversed or distributed"

  # ---- business safety ----------------------------------------------------
  - id: ERR_BUYER_BLOCKED
    http: 422
    condition: "the referenced Buyer.status is BLOCKED"
  - id: ERR_COMPLETION_BOND_REQUIRED
    http: 422
    condition: "a facility with completion_bond_required = true and completion_bond_posted = false is asked to move APPROVED -> DRAWN"

  # ---- business referential ----------------------------------------------
  - id: ERR_AGENCY_AGREEMENT_NOT_IN_FORCE
    http: 422
    condition: "the film has no SalesAgencyAgreement in status EXECUTED whose term window contains current_utc"
  - id: ERR_NO_PUBLISHED_VALUATION
    http: 422
    condition: "no TerritoryValuation with status PUBLISHED exists for the contract's (film_id, territory_id)"
  - id: ERR_NO_ELIGIBLE_COLLATERAL
    http: 422
    condition: "the facility's film has no EXECUTED contract with an ACTIVE investment-grade buyer, so eligible_collateral_usd computes to 0.00"

  # ---- business temporal --------------------------------------------------
  - id: ERR_SCREENING_ROOM_CONFLICT
    http: 409
    condition: "the requested screening window comes within TURNAROUND_MINUTES of a live slot in the same (market_id, room_number)"
  - id: ERR_MEETING_SLOT_CONFLICT
    http: 409
    condition: "the requested meeting window overlaps a live meeting on the same table_number, or another live meeting of the same buyer at this market"
  - id: ERR_OUTSIDE_MARKET_WINDOW
    http: 422
    condition: "the requested window is not fully contained in [Market.start_date, Market.end_date]"
  - id: ERR_HOLDBACK_NOT_ELAPSED
    http: 422
    condition: "deliverables are submitted before current_utc reaches PreSaleContract.holdback_release_date"
  - id: ERR_LICENSE_TERM_NOT_EXPIRED
    http: 422
    condition: "reversion is requested before current_utc reaches PreSaleContract.license_end_date"
  - id: ERR_CURE_WINDOW_ELAPSED
    http: 422
    condition: "a resubmission arrives after the cure_deadline of the contract's latest REJECTED DeliverablePackage"

  # ---- business constraint ------------------------------------------------
  - id: ERR_DUPLICATE_TERRITORY_OFFER
    http: 409
    condition: "the (film_id, territory_id) pair already has an ACCEPTED or EXECUTED contract, or a live OFFERED/COUNTERED contract with a different buyer"
  - id: ERR_NO_COMPARABLE_TITLES
    http: 422
    condition: "the eligible ComparableTitle set for the (film, territory) pair is empty"
  - id: ERR_INSUFFICIENT_COMP_SAMPLE
    http: 422
    condition: "the eligible ComparableTitle set is non-empty but smaller than MIN_COMP_SAMPLE"
  - id: ERR_MILESTONE_SCHEDULE_INVALID
    http: 422
    condition: "the milestone schedule would exceed or, at execution time, fall short of exactly 1.0000 of the minimum guarantee, or two milestones of one contract share a label"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "a counter or revised offer would push negotiation_round past MAX_NEGOTIATION_ROUNDS"
  - id: ERR_MEETING_MINUTES_CAP_EXCEEDED
    http: 422
    condition: "the buyer's booked minutes at this market plus the new meeting's duration would exceed MEETING_MINUTES_CAP"
  - id: ERR_DELIVERABLES_INCOMPLETE
    http: 422
    condition: "technical_items_count is below REQUIRED_TECHNICAL_ITEMS or legal_items_count is below REQUIRED_LEGAL_ITEMS"
  - id: ERR_TIER_ORDER_TAKEN
    http: 409
    condition: "the account already has a WaterfallTier at this tier_order, or already has an uncapped tier and a second uncapped tier is requested"
  - id: ERR_TERRITORY_CODE_TAKEN
    http: 409
    condition: "another Territory already uses this code"

  # ---- business fiscal ----------------------------------------------------
  - id: ERR_BUYER_EXPOSURE_EXCEEDED
    http: 422
    condition: "the buyer's GROSS_PIPELINE exposure plus the new minimum guarantee would exceed Buyer.exposure_limit_usd (equality is allowed)"
  - id: ERR_BUYER_NET_EXPOSURE_EXCEEDED
    http: 422
    condition: "the buyer's NET_UNPAID exposure plus this contract's unpaid amount would exceed exposure_limit_usd * NET_EXECUTION_HEADROOM (equality is allowed)"
  - id: ERR_MG_BELOW_FLOOR
    http: 422
    condition: "minimum_guarantee_usd is strictly below the PUBLISHED valuation's floor_price_usd for the same (film_id, territory_id)"
  - id: ERR_RECEIPT_AMOUNT_MISMATCH
    http: 422
    condition: "the posted amount_usd does not equal the milestone's amount_usd exactly"
  - id: ERR_INSUFFICIENT_ACCOUNT_BALANCE
    http: 422
    condition: "amount_in_usd exceeds CollectionAccount.balance_usd (equality is allowed)"
  - id: ERR_RECEIPT_ALREADY_DISTRIBUTED
    http: 422
    condition: "the account balance has already fallen below the receipt being reversed, so the reversal would drive balance_usd negative"
  - id: ERR_EXPENSE_LOG_LIMIT
    http: 422
    condition: "amount_usd is not positive, or the logged expenses would exceed expense_cap_usd * EXPENSE_LOG_TOLERANCE"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:
  - name: SalesAgent
    description: "Front-line seller: values territories, books market inventory, opens and revises offers, logs sales expenses."
    identity: "opaque"
    exclusive_operations:
      - "POST /film-sales/pre-sale-contracts/{id}/revise-offer"
      - "POST /film-sales/pre-sale-contracts/{id}/payment-milestones"
    shared_operations:
      - "POST /film-sales/territory-valuations (with HeadOfSales)"
      - "POST /film-sales/screening-slots and POST /film-sales/screening-slots/{id}/state (with HeadOfSales)"
      - "POST /film-sales/buyer-meetings and POST /film-sales/buyer-meetings/{id}/state (with HeadOfSales)"
      - "POST /film-sales/pre-sale-contracts (with HeadOfSales)"
      - "POST /film-sales/agency-agreements/{id}/expenses (with HeadOfSales)"
      - "POST /film-sales/territories/{id}/comparable-titles (with PlatformAdmin)"
      - "read endpoints across films, territories, valuations, markets, slots, meetings, contracts and milestones"

  - name: HeadOfSales
    description: "Signs the agency agreement, publishes valuations, countersigns, lapses and reverts contracts. Cannot both publish a valuation and execute the contract priced off it."
    identity: "opaque"
    exclusive_operations:
      - "POST /film-sales/films/{id}/agency-agreements"
      - "POST /film-sales/agency-agreements/{id}/state"
      - "POST /film-sales/territory-valuations/{id}/publish"
      - "POST /film-sales/pre-sale-contracts/{id}/execute"
      - "POST /film-sales/pre-sale-contracts/{id}/lapse"
      - "POST /film-sales/pre-sale-contracts/{id}/revert"
    shared_operations:
      - "POST /film-sales/films/{id}/state (with PlatformAdmin)"
      - "every SalesAgent operation except revise-offer and milestone creation, which it also holds"
      - "read endpoints across the whole surface except distribution runs it does not own"

  - name: Buyer
    description: "Territory distributor. Counters and accepts its own offers and records QC verdicts on its own deliverable packages."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /film-sales/pre-sale-contracts/{id}/counter"
      - "POST /film-sales/pre-sale-contracts/{id}/accept"
      - "POST /film-sales/deliverable-packages/{id}/qc-result"
    shared_operations:
      - "GET /film-sales/buyers/{id}, GET /film-sales/buyer-meetings, GET /film-sales/buyer-meetings/{id}"
      - "GET /film-sales/pre-sale-contracts, GET /film-sales/pre-sale-contracts/{id} and its milestone and package sub-resources"

  - name: DeliveryManager
    description: "Assembles and submits technical and legal deliverables to each buyer."
    identity: "opaque"
    exclusive_operations:
      - "POST /film-sales/pre-sale-contracts/{id}/deliverable-packages"
    shared_operations:
      - "read endpoints across films, territories, markets, slots, meetings, contracts and deliverable packages"

  - name: CollectionAgent
    description: "Runs the collection account: opens it, defines the waterfall, posts and reverses receipts, executes distribution runs."
    identity: "opaque"
    exclusive_operations:
      - "POST /film-sales/films/{id}/collection-accounts"
      - "POST /film-sales/collection-accounts/{id}/state"
      - "POST /film-sales/collection-accounts/{id}/waterfall-tiers"
      - "POST /film-sales/collection-accounts/{id}/distribute"
      - "POST /film-sales/payment-milestones/{id}/receipt"
      - "POST /film-sales/payment-milestones/{id}/reverse-receipt"
    shared_operations:
      - "read endpoints across films, agreements, valuations, contracts, milestones, facilities and accounts"

  - name: Lender
    description: "Discounts the pre-sale contracts. Proposes, approves, bonds, draws and defaults the banking facility. Cannot approve and draw the same facility."
    identity: "opaque"
    exclusive_operations:
      - "POST /film-sales/films/{id}/banking-facilities"
      - "POST /film-sales/banking-facilities/{id}/state"
      - "POST /film-sales/banking-facilities/{id}/completion-bond"
    shared_operations:
      - "read endpoints across films, territories, valuations, contracts, milestones, facilities, accounts, waterfall tiers and distribution runs"

  - name: PlatformAdmin
    description: "Operational superuser for reference data (films, territories, comparables, buyers, markets) and the logical clock. Holds no deal-making authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /film-sales/films"
      - "PATCH /film-sales/films/{id}"
      - "POST /film-sales/territories"
      - "POST /film-sales/territories/{id}/buyers"
      - "PATCH /film-sales/buyers/{id}"
      - "POST /film-sales/markets"
      - "POST /film-sales/markets/{id}/state"
      - "POST /film-sales/_clock/set_current_utc"
    shared_operations:
      - "POST /film-sales/films/{id}/state (with HeadOfSales)"
      - "POST /film-sales/territories/{id}/comparable-titles (with SalesAgent)"
      - "read endpoints across the whole surface"

  # --- segregation-of-duties rules enforced on top of the role grid ---------
  # 1. POST /film-sales/pre-sale-contracts/{id}/execute requires
  #    X-User-ID != the published_by_user_id of the PUBLISHED TerritoryValuation
  #    for the contract's (film_id, territory_id)  -> ERR_SEGREGATION_OF_DUTIES.
  # 2. POST /film-sales/banking-facilities/{id}/state with to_status=DRAWN requires
  #    X-User-ID != BankingFacility.approved_by_user_id -> ERR_SEGREGATION_OF_DUTIES.
