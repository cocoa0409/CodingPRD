            - "InjectionEncounter.${k_enc_np_id}.attested_by_clinician_id == ${k_cl2_id} (unchanged)"

      - name: corner_cyclic_authorization_shape_reenters_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.PriorAuthorization.INFO_REQUESTED_to_SUBMITTED
          - state_machines.PriorAuthorization.DENIED_to_APPEALED
        excluded_because:
          difficulty_instance: non_linear_state_machine / authorization_cycles_info_requested_denial_appeal_to_approved
          rationale: "That §1.8 instance walks the full cycle INFO_REQUESTED -> SUBMITTED -> DENIED -> APPEALED -> APPROVED and asserts submission_count 2."

      - name: corner_parallel_claim_line_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.SUBMITTED_to_PAID
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_drug_and_admin_line_dimensions_advance_independently
          rationale: "That §1.8 instance denies the admin line while the drug line stays SUBMITTED and asserts realized_margin_cents stays null until both axes are terminal."

      - name: corner_lot_recall_cascade_down_to_vials_and_notifications
        claim_type: side_effect_execution
        grounds:
          - state_machines.DrugLot.AVAILABLE_to_RECALLED
          - state_machines.Vial.RESERVED_to_QUARANTINED
        excluded_because:
          difficulty_instance: transitive_cascade / lot_recall_quarantines_vials_voids_drafts_and_generates_notifications
          rationale: "That §1.8 instance asserts the full three-hop recall cascade including the DRAFT void with void_reason LOT_RECALLED and the one-notification plan."

      - name: corner_compensating_void_of_a_documented_encounter
        claim_type: side_effect_execution
        grounds:
          - state_machines.InjectionEncounter.DOCUMENTED_to_VOIDED
          - state_machines.Vial.ADMINISTERED_to_QUARANTINED
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_a_documented_encounter_conserves_the_lot_vial_count_without_resurrecting_stock
          rationale: "That §1.8 instance asserts every reversed field and the vials_received conservation identity after the compensating void."

  - section: calculations
    instances:

      - name: corner_any_fluid_flag_forces_active_below_the_thickness_threshold
        claim_type: correct_result
        grounds:
          - calculations.disease_activity_classification
          - entities.ImagingStudy.disease_activity
        distinguishing_aspect: "The classifier is an OR over four predicates, not a thickness test: at 180 um (far below CST_ACTIVE_THRESHOLD_UM) a study with every flag false is QUIESCENT, while the same thickness with subretinal_fluid true is ACTIVE, and new_hemorrhage alone is equally sufficient."
        test_recipe:
          setup:
            - "the corner prologue with patient P-NP and clinician CL1"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
          trigger:
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 180, intraretinal_fluid: false, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 80 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_act_dry: $.data.disease_activity }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T01:00:00Z", central_subfield_thickness_um: 180, intraretinal_fluid: false, subretinal_fluid: true, new_hemorrhage: false, va_letter_score: 80 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_act_srf: $.data.disease_activity }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T02:00:00Z", central_subfield_thickness_um: 180, intraretinal_fluid: false, subretinal_fluid: false, new_hemorrhage: true, va_letter_score: 80 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_act_hem: $.data.disease_activity }
          assert:
            - "${k_act_dry} == QUIESCENT"
            - "${k_act_srf} == ACTIVE"
            - "${k_act_hem} == ACTIVE"

      - name: corner_disease_activity_threshold_is_inclusive_on_the_constant
        claim_type: precision
        grounds:
          - calculations.disease_activity_classification.constants.CST_ACTIVE_THRESHOLD_UM
        excluded_because:
          difficulty_instance: boundary_precision_check / disease_activity_cst_threshold_inclusive_at_300_um
          rationale: "That §1.8 instance probes 299 / 300 / 301 um with every fluid flag false and pins the inclusive comparison."

      - name: corner_interval_extends_on_a_quiescent_visit_then_reduces_on_an_active_one
        claim_type: variant_selection
        grounds:
          - calculations.treat_and_extend_interval.variants.extension
          - calculations.treat_and_extend_interval.variants.reduction
          - state_machines.TreatmentPlan.MAINTENANCE_to_INTENSIFIED
        distinguishing_aspect: "On a one-dose loading course the first QUIESCENT visit takes the extension variant (28 + 14 = 42 days, quiescent run 1) and the next ACTIVE visit takes the reduction variant (42 - 14 = 28 days, run reset to 0, plan INTENSIFIED); next_due_date tracks each encounter_datetime, not the clock."
        test_recipe:
          setup:
            - "the corner prologue plus patient P-Q whose plan needs only one loading dose"
            - "an ACTIVE baseline study on 2026-08-01 and a QUIESCENT study (CST 250, no fluid, no hemorrhage) at 08:00 the same day"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_cl1
            - *k_cl2
            - *k_lot
            - &k_pt_q
              call: "POST /patients"
              payload: { mrn: "MRN-2009", full_name: "Quentin Alder", payer_id: "${k_pay_np_id}", member_id: "FOA-90009", contact_point: "quentin.alder@example.test", notification_channel: "EMAIL" }
              as: PracticeAdmin
