      - name: credit_application_blocked_by_customer_financing_lock
        grounds:
          - validations.priority_72_ERR_CUSTOMER_FINANCING_LOCKED
          - state_machines.Customer.status
          - state_machines.InstallmentLoan.delinquency_state.DEFAULT_to_CURRENT
          - entities.Customer.fields.financing_lock_reason
          - endpoints.POST_/credit-applications
        distinguishing_aspect: |
          Entity pair (CreditApplication, Customer) — a third, disjoint pair: the ability to
          submit a brand-new application depends on the applicant Customer's own status, which
          is itself only ever written by cascades from a loan. The dependency is proved in both
          directions inside one test: while the customer is FINANCING_LOCKED by a defaulted
          loan the submission is refused with 409, and after a cure payment of exactly 15735
          releases the lock (default_strike_count deliberately staying at 1, because a cure
          never decrements the strike counter) the identical submission is accepted with 201.
          Note the error is observable on POST /credit-applications and not on POST /loans,
          where priority 51 ERR_APPLICATION_NOT_APPROVED would mask it because the lock cascade
          has already voided every open application.
        test_recipe:
          setup:
            - "PRIME customer with an ACTIVE Handset B loan originated 2026-08-01 and nothing paid."
            - "Two sweeps: at 2026-09-12 (dpd 11) the loan becomes DELINQUENT with one 500 fee; at 2026-11-30 (dpd 90) it is declared DEFAULT, fees on installments 2 and 3 bring outstanding_late_fee_cents to 1500, and the Customer becomes FINANCING_LOCKED."
