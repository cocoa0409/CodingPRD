            - "CreditClaim.${cl2}.status stays UNDER_REVIEW and final_credit_cents remains null"
            - "Customer.${cu1}.credit_used_ytd_cents == 40000 (unchanged by the failed approval)"

  # ==================================================================
  - section: endpoints
    instances:
      - name: containers_list_pagination_defaults
        claim_type: pagination
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Default pagination: limit 10 / offset 0 on a 12-row result set returns 10 rows with total_count 12 and has_more true; offset 10 returns the final 2 with has_more false."
        test_recipe:
          setup: ["F1 ACTIVE; M1; 12-gal batch in FILLING/FILLED with 12 GALLON cans (12 x 4.6 kg = 55.2 kg drawdown, waste 0)"]
          setup_api_calls:
