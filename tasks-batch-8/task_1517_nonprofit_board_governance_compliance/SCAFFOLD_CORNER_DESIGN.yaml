    distinguishing_aspect: 'Two sequential PATCHes carrying the SAME observed version: the first succeeds (version 1 -> 2), the second with the now-stale expected_nonprofit_version
      1 fails 412 ERR_STALE_VERSION — deterministic without any parallelism.'
    test_recipe:
      setup:
