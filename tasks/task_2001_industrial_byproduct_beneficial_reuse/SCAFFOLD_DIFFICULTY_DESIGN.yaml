          assert:
            - "ReuseEligibility.${d_id} moves DENIED -> DRAFT -> SUBMITTED -> APPROVED -> SUSPENDED -> APPROVED in that order"
            - "ReuseEligibility.${d_id}.decision_reason == null after revise"
            - "ReuseEligibility.${d_id}.approved_by_user_id == co_appr after approve"
            - "ByproductStream.${s_id}.status == ACTIVE after approve"

  # =========================================================================
  # Rule 4 - transitive_cascade (accept chain depth 3, reject chain depth 3)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_cascade_shipment_to_credit_entry_to_generator_tier
        grounds:
          - state_machines.Shipment.DELIVERED_to_ACCEPTED
          - calculations.sustainability_credit_accrual
          - calculations.credit_tier_assignment
        distinguishing_aspect: |
          Depth-3 cascade originating from DELIVERED -> ACCEPTED: the accept creates an ACCRUAL
          SustainabilityCreditEntry (link 1); that entry creation recomputes
          Generator.total_credits (link 2); that recompute re-derives Generator.credit_tier
          across the >= 100 SILVER threshold (link 3). 60 t accepted first keeps the tier
          STANDARD; the 45 t accept pushes total_credits to exactly 105.0 -> SILVER.
        test_recipe:
          setup:
            - "Dispatch-ready PA chain; agreement and commitment committed 500; index 300 effective 2026-01-01; one 60 t shipment already ACCEPTED (total_credits 60.0, tier STANDARD); a second 45 t shipment BOOKED, DISPATCHED and DELIVERED in-spec; clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA", "WV"] }, as: BrokerOps, captures: { o_id: $.data.id } }
