# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TalentAssessmentAdmin
    description: "Talent assessment operations administrator; configures vendors, instruments, evidence, guides, cycles' lifecycle machinery; drives the logical clock. Deliberately excluded from scoring and decision duties (SoD)."
    identity: opaque
    exclusive_operations: [vendor create/suspend/reinstate/terminate, content DISTRIBUTE, instrument create/lifecycle, guide create/pilot/retract/approve/retire, interviewer create, calibration create/certify, clock set]
    shared_operations: [read any resource, content DESTROY]
  - name: HiringManager
    description: "Owns requisitions (hiring_manager_id == X-User-ID) and runs their cycles: create/activate/score/close cycles, invite candidates, schedule/complete sessions, complete assessments, send feedback."
    identity: opaque
    exclusive_operations: [requisition create/close, cycle create/patch/activate/begin-scoring/close, invitations, assessment schedule/start/complete/mark-no-show/reschedule, session create/complete/cancel, feedback send]
    shared_operations: [assessment cancel (with Candidate), candidate withdraw, read cycles/instruments/guides/sessions/scorecards/decisions]
  - name: Interviewer
    description: "Entity-backed interviewer; authors scorecards only for own sessions on guides they are CALIBRATED for."
    identity: "entity_backed:Interviewer"
    exclusive_operations: [scorecard create/submit on own sessions]
    shared_operations: [read own sessions/scorecards/calibrations, read guides]
  - name: Candidate
    description: "Entity-backed candidate; views own assessments/decisions, files and withdraws own accommodation requests."
    identity: "entity_backed:Candidate"
    exclusive_operations: [accommodation request create/withdraw on own assessments]
    shared_operations: [read own candidate/assessments/sessions/decisions, assessment cancel (own), withdraw self]
  - name: DecisionOfficer
    description: "Documents hiring decisions; SoD-forbidden from scoring the same candidate (X-User-ID must not equal a quorum scorecard's interviewer_id)."
    identity: opaque
    exclusive_operations: [hiring decision create]
    shared_operations: [read requisitions/cycles/assessments/scorecards/decisions]
  - name: ComplianceOfficer
    description: "Runs adverse-impact snapshots, freezes/unfreezes cycles, adjudicates accommodation requests, voids scorecards, executes retention sweeps. Cannot author guides or scorecards (SoD)."
    identity: opaque
    exclusive_operations: [snapshot create, cycle freeze/unfreeze, accommodation approve/deny, scorecard void, retention sweep]
    shared_operations: [read any resource]
  - name: VendorRepresentative
    description: "Entity-backed vendor user; files validation evidence for own vendor's instruments and records certified content destructions (chain-of-custody SoD: admin distributes, vendor confirms destruction)."
    identity: "entity_backed:AssessmentVendor"
    exclusive_operations: [evidence filing for own vendor's instruments, content DESTROY events for own vendor]
    shared_operations: [read own vendor/instruments/evidence/ledger]
