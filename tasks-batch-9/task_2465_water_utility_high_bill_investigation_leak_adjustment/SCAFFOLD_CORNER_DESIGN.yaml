      - name: corner_state_conditional_cascade_suspect_field_result_escalates_without_firing_closure_effects
        claim_type: conditional_cascade
        grounds:
          - state_machines.MeterTestRequest
          - state_machines.HighBillInvestigation
          - endpoints[POST /meter-test-requests/{id}/record-field-result]
        distinguishing_aspect: |
          The closure side effects of a meter test are conditional on the request reaching a
          CLOSED_* state. A SUSPECT field result merely routes FIELD_TEST_SCHEDULED ->
          BENCH_TEST_PENDING, so none of them fire: the meter stays UNTESTED with a null
          last_test_completed_at, the deposit is neither forfeited nor refunded, no CORRECTED
