        distinguishing_aspect: "The IssuerRepresentative's X-User-ID is a CoBrandIssuer id, so issuer-2's representative countering issuer-1's agreement is refused with ERR_ISSUER_SCOPE_VIOLATION (403) while issuer-1's own representative counters successfully, stamping both countered_* fields and advancing negotiation_round only later at revise (it stays 0 at counter)."
