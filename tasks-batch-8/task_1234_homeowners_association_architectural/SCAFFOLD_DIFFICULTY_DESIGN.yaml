            - { call: "POST /arc/applications/${app3}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://o/d3" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app3}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "stone", uri: "s3://o/m3" }, as: Homeowner, as_user_id: "${owner_a}" }
