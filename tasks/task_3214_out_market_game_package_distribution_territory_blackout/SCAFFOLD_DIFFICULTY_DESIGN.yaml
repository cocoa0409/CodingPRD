  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: market_zip_prefix_exclusion_no_gap_semantics
        grounds:
          - validations[priority=13]
          - errors[ERR_MARKET_PREFIX_OVERLAP]
          - entities.Market.fields.zip_prefixes
        distinguishing_aspect: |
          Interval semantics = half-open prefix partition with NO tolerated
          gap/adjacency: a second Market claiming the already-assigned prefix
          "100" is rejected outright, and there is no notion of adjacency
          allowance — prefix "101" is a distinct interval and is admitted
          even though it is numerically adjacent to "100".
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; Market NYC already owns prefixes [100]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { code: "NYC", name: "New York", zip_prefixes: ["100"], home_team_codes: ["NYC"] }
              as: LeagueOps
              captures: { m_nyc: $.data.id }
          trigger:
            - call: "POST /markets"
              payload: { code: "NYC2", name: "New York Duplicate", zip_prefixes: ["100"], home_team_codes: [] }
              as: LeagueOps
              captures: { err: $.data.error_id }
            - call: "POST /markets"
              payload: { code: "ALB", name: "Albany", zip_prefixes: ["101"], home_team_codes: [] }
              as: LeagueOps
              captures: { m_alb: $.data.id }
          assert:
            - "second market claiming prefix \"100\" returns 409 with error_id == ERR_MARKET_PREFIX_OVERLAP"
            - "market claiming the numerically adjacent prefix \"101\" succeeds 201 (no adjacency buffer in prefix-partition semantics)"
            - "Market.${m_alb}.code == ALB"

      - name: offer_window_half_open_bracket_semantics
        grounds:
          - entities.Offer.fields.valid_from
          - entities.Offer.fields.valid_until
          - validations[priority=7]
          - errors[ERR_OFFER_NOT_AVAILABLE]
        distinguishing_aspect: |
          Different resource (Offer) with different interval semantics —
          half-open [valid_from, valid_until): a purchase at exactly
          valid_from succeeds while a purchase at exactly valid_until fails;
          adjacency between two back-to-back offers (first's valid_until ==
          second's valid_from) hands off cleanly with no gap and no overlap.
        test_recipe:
