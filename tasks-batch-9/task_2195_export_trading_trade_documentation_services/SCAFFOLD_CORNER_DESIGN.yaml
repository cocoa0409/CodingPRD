  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_lc_review_stale_credit_after_an_in_place_amendment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.lc-review-stale-credit
          - errors[ERR_STALE_LC_VERSION]
          - state_machines.LetterOfCredit.transitions.AMENDMENT_REQUESTED_to_RECEIVED
          - endpoints.POST /letters-of-credit/{lc_id}/reviews
        distinguishing_aspect: "This is the §1.2.1 rule lc-review-stale-credit exercised the way the description demands: the credit is genuinely amended in place first, so the client's cached version is stale for a substantive reason, and the credit is back in RECEIVED so the priority-11 state table cannot mask the priority-13 comparison. Every LetterOfCredit write in the chain — review open, review submit, amendment — bumps version by exactly 1, so the stale value is three writes behind."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z, credit expiry 2026-12-31 so the temporal preconditions always pass"
            - "the amendment raises amount_usd from 25000.00 to 30000.00, which also recomputes the drawing bounds"
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Genoa Marble Import Srl", country_code: "IT", credit_rating: "A", sanctions_tier: "NONE", restricted_party_flag: false }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
