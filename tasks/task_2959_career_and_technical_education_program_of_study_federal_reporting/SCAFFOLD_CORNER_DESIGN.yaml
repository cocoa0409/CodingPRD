      - name: a_change_propagates_through_the_dependent_chain_to_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.grant_obligation_rollup
          - entities.GrantAward.fields.remaining_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / indirect_rate_tier_keyed_on_direct_total_not_on_obligated_total
          rationale: "That instance walks the pinned STEP 1 to STEP 6 propagation and shows the tier keyed on the direct total, which is the only fixed point the chain admits."

      - name: the_two_declared_variants_diverge_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.program_alignment_index.variants
          - entities.ProgramOfStudy.fields.alignment_index_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / alignment_index_provisional_local_vs_federal_certified
          rationale: "That instance holds the curriculum fixed and pins both variant outputs plus their delta."

      - name: the_context_selects_the_correct_variant
        claim_type: variant_selection
        grounds:
          - calculations.performance_indicator_actual.variants
          - entities.PerformanceIndicator.fields.preliminary_actual_pct
          - entities.PerformanceIndicator.fields.actual_pct
        excluded_because:
          difficulty_instance: dual_variant_calc / indicator_actual_preliminary_unadjusted_vs_final_small_cohort_adjusted
          rationale: "That instance shows the preliminary variant answering on every credit posting while the final variant only runs at close-reporting-year."

      - name: submit_stores_the_provisional_variant_and_approval_overwrites_it_with_the_certified_one
        claim_type: reconciliation
        grounds:
          - calculations.program_alignment_index.variants
          - endpoints[POST /cte/programs-of-study/{id}/submit]
          - endpoints[POST /cte/programs-of-study/{id}/state-approve]
          - validations[priority=29]
          - entities.ProgramOfStudy.fields.alignment_index_variant
        distinguishing_aspect: |
          The persisted alignment_index changes meaning as the program moves through approval: submit writes the
          PROVISIONAL_LOCAL value, and state-approve is required to re-run the calculation under FEDERAL_CERTIFIED and
          overwrite it. The program is built so the two variants disagree twice over — first 1.0000 against 0.4500, which
          is refused at the floor and must leave the stored provisional value untouched, then 1.0000 against 0.8500 after
          the articulation is verified, which is accepted and must overwrite. An implementation that reuses the stored
          provisional number at approval time approves the first attempt; one that recomputes but forgets to persist
          leaves 1.0000 behind after the second.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy whose comprehensive local needs assessment is CERTIFIED, one NATIONAL Credential, one ELIGIBLE Educator and an ACTIVE advisory committee with two FINALIZED quorate CLNA_STAKEHOLDER meetings."
            - "Three sequence courses: an ACTIVE SECONDARY course of 3.00 credit hours at position 1, a DRAFT SECONDARY course of 1.00 credit hours at position 2, and an ACTIVE POSTSECONDARY course of 3.00 credit hours at position 3 carrying 3.00 articulated hours with articulation_verified false."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
