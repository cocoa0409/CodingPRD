            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.100A>G", classification: "VUS" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "GET /counseling-cases/${case_id}", payload: {}, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_v: $.data.version } }
            - { call: "POST /surveillance-plans", payload: { counseling_case_id: "${case_id}", modalities: [ "BREAST_MRI" ], expected_counseling_case_version: "${case_v}" }, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /surveillance-plans", payload: { counseling_case_id: "${case_id}", modalities: [ "COLONOSCOPY" ], expected_counseling_case_version: "${case_v}" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
