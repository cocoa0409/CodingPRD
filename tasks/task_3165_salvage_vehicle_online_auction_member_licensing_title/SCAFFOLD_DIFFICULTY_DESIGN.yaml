  - rule_id: transitive_cascade
    instances:

      - name: close_lot_five_hop_cascade
        grounds:
          - state_machines.Vehicle.LIVE_to_SOLD
          - state_machines.Vehicle.RELEASED_to_LOADED_OUT
          - state_machines.Settlement.DRAFT_to_FINALIZED
          - state_machines.Settlement.FINALIZED_to_PAID
