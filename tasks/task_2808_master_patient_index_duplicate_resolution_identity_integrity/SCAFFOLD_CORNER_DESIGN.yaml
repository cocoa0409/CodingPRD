      - name: sending_a_task_after_its_propagation_deadline_returns_propagation_window_expired
        claim_type: temporal_validation
        grounds:
          - validations[priority=43]
          - global_constants.PROPAGATION_DEADLINE_HOURS_SYNCHRONOUS
          - errors[ERR_PROPAGATION_WINDOW_EXPIRED]
        distinguishing_aspect: "propagation_deadline_at is created_at + 24 hours for a SYNCHRONOUS system and the check is inclusive, so of two sibling tasks minted in the same overlay apply the one dispatched exactly at 2026-08-02T00:00:00Z is SENT and the one dispatched one second later is 409 ERR_PROPAGATION_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-VJ and one PatientRecord VJ-1000."
            - "Two ACTIVE DownstreamSystem rows VJ-SYS-A and VJ-SYS-B, both SYNCHRONOUS with ack_required true and max_concurrent_dispatch 2, so each holds exactly one QUEUED task and neither can be limited by the other's capacity."
            - "One OverlayCorrection with affected_clinical_element_count 3 (below CONTAMINATION_REVIEW_ELEMENT_THRESHOLD, so no remediation is opened) is applied, minting one QUEUED PropagationTask per system with propagation_deadline_at 2026-08-02T00:00:00Z."
            - "The clock is then advanced to exactly 2026-08-02T00:00:00Z, the last instant the rule admits."
