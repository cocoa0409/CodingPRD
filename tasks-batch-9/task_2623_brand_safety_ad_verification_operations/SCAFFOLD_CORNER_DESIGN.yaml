      - name: ivt_family_maximum_dedups_overlapping_detectors_and_families_add
        claim_type: input_set_filtering
        grounds:
          - calculations.ivt_dedup_rate
          - state_machines.IvtFinding.PROPOSED_to_CONFIRMED
          - state_machines.IvtFinding.CONFIRMED_to_RETRACTED
        distinguishing_aspect: |
          Four things must all hold at once: two CONFIRMED GIVT detectors
          collapse to their MAXIMUM (500, not 800) because they observe
          overlapping traffic, the SIVT family is ADDED on top (700 total), a
          PROPOSED 9000-impression finding contributes nothing, and a
          CONFIRMED-then-RETRACTED 4000-impression finding contributes nothing
          either - so the family maximum falls back from 4000 to 500 rather
          than staying at its high-water mark.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one INGESTED batch with measured 10000, measurable 9000, in_view 9000, avg 1.2s / 0.6px."
            - "Findings on that batch: GENERAL_BOT 300 (GIVT, confirmed), DATACENTER 500 (GIVT, confirmed), SIVT_AD_FARM 200 (SIVT, confirmed), SIVT_HIJACKED_DEVICE 9000 (left PROPOSED), DATACENTER 4000 (confirmed then retracted). All confidences 0.90, above the 0.75 confirm floor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
