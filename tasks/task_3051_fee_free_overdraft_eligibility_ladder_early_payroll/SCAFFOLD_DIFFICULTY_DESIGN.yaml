              as: SponsorBankOps
              captures: { m10d2: $.data.id }
            - call: "POST /banking/deposits/${m10d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m10d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m10}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m10_v0}" }
              as: ProgramOps
              captures: { m10_v1: $.data.version }
            - call: "POST /banking/members/${m10}/abuse-events"
              payload: { event_type: "DEPOSIT_REROUTE", expected_member_version: "${m10_v1}" }
              as: ProgramOps
            - call: "POST /banking/accounts/${a10}/deposits"
              payload: { originator_id: "EMP10", originator_type: "PAYROLL", amount_cents: 15000, settlement_date: "2026-08-31T00:00:00Z", trace_id: "m10-t3" }
              as: SponsorBankOps
              captures: { m10d3: $.data.id }
          trigger:
            - call: "POST /banking/deposits/${m10d3}/post-early"
              payload: {}
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "Member.${m10}.status == RESTRICTED and deposit_reroute_flag == true (setup)"
            - "post-early rejected with error_id == ERR_ABUSE_LOCK (safety priority 9 beats temporal priority 10)"
            - "http status == 422"
            - "DirectDeposit.${m10d3}.status remains RECEIVED_FILE; no EarlyPosting created"

  # ===========================================================================
  # Rule 6 — boundary_precision_check on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: qualifying_amount_inclusive_boundary
        grounds:
          - entities.DirectDeposit.fields.qualifying
          - calculations.calc_eligibility_score
        distinguishing_aspect: |
          Boundary on deposit amount (>= 10000 inclusive): a PAYROLL deposit of
          exactly 10000 counts toward the scoring bucket while 9999 does not;
          observed via BATCH evaluation regularity_points through
          POST /banking/members/{id}/eligibility-evaluations.
