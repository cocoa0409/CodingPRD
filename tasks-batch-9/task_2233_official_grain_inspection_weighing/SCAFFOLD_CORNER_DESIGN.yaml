            - "The identical body with sample_id ${smp_b} -> 201, proving both ids were individually valid"
            - "GET /grain-inspection/inspection-requests/${req_b} -> grading_status == GRADED after the accepted call"

      - name: weighing_record_computed_fields_derive_from_the_draft_list
