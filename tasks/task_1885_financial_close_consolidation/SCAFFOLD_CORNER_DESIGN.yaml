      - name: stale_period_version_on_soft_lock
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[period-soft-lock-stale-version]", "errors[ERR_STALE_PERIOD_VERSION]"]
        distinguishing_aspect: "soft-lock carrying an expected_close_period_version one behind the current ClosePeriod.version is rejected 412 ERR_STALE_PERIOD_VERSION (OCC)."
        test_recipe:
          setup: ["Period opened; entity-period fully READY_FOR_CONSOL; caller holds a stale version captured before the last mutation"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
