              captures: { billing_written_off: $.data.billing_status, collected_after_write_off: $.data.premium_collected_cents, refunded_after_write_off: $.data.premium_refunded_cents }
            - call: "GET /ledger-entries?enrollment_id=${enrollment_one}&entry_type=WRITE_OFF"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
