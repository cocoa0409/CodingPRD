          setup:
            - "Season in AUDITIONS_OPEN. Slot R1 10:00-11:00 has capacity 1, quorum_required 3"
            - "and panelist_ids [Panel One, Panel Two, Panel Three, Conflicted Carla (VIOLIN,"
            - "conflict_member_ids = [Ada]), Cello Cora (CELLO)]; Outside Otto (VIOLIN) is not"
