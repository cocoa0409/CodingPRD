            - "tot_est == 10000000 and tot_awarded == 9500000 and tot_savings == 500000"

      - name: list_packages_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.\"GET /projects/{projectId}/trade-packages"
        distinguishing_aspect: "Pagination envelope honored: two packages, limit=1 -> data length 1, total_count == 2, has_more == true; offset=1 returns the second page with has_more == false."
        test_recipe:
          setup: ["project with two trade packages"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-P2", project_number: "P2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "P2-A", title: "Pkg A", estimated_budget_cents: 5000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_a: $.data.id }
            - call: "GET /projects/${proj_id}"
              as: BuyoutLead
              captures: { proj_v2: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
