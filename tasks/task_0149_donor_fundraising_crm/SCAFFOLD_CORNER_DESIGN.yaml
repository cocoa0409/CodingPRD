        distinguishing_aspect: "GET /gifts returns a paginated array envelope with total_count and has_more; filtering by donor_id narrows the set."
        test_recipe:
          setup: ["OPEN campaign; donor; two RECORDED gifts"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Lg", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
