    input: []
    output: ContractVehicle
    side_effects: ["increments ContractVehicle.version"]
  - method: POST
    path: "/vehicles/{id}/expire"
    description: "Force AUTHORIZED -> EXPIRED"
    roles: [ComplianceOfficer]
    code: 200
