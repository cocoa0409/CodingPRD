  # ===========================================================================
  # SECTION: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: cycle_count_correct_version_succeeds_and_increments_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cycle-count-stale-lot]
          - calculations.cycle_count_variance
          - entities.InventoryLot.fields.version
        distinguishing_aspect: |
          OCC happy path: a cycle count carrying the CURRENT lot version succeeds,
          sets on_hand_qty to counted_qty(6) with variance_qty==-2, and increments
          InventoryLot.version from 1 to 2 (the success counterpart to §1.8's stale
          rejection).
        test_recipe:
          setup:
            - "Lot with on_hand 8 (version 1 after putaway); cycle count counted_qty=6 with correct expected_lot_version"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "OccOk", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-CC-01", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 8 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 8 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "GET /inventory-lots"
              payload: { sku_id: "${sku}", bin_id: "${bin}" }
              as: ReceivingClerk
              captures: { lot: "$.data[0].id", lotv: "$.data[0].version" }
          trigger:
            - call: "POST /clients/${cli}/cycle-counts"
              payload: { lot_id: "${lot}", expected_lot_version: "${lotv}", counted_qty: 6 }
              as: ReceivingClerk
              captures: { var: $.data.variance_qty }
          assert:
            - "response status code == 201"
            - "CycleCount.variance_qty == -2"
            - "InventoryLot.${lot}.on_hand_qty == 6"
            - "InventoryLot.${lot}.available_qty == 6"
            - "InventoryLot.${lot}.version == 2"

      - name: fefo_selector_picks_earliest_created_lot_first
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.Wave.BUILDING_to_RELEASED
          - entities.PickTask.fields.lot_id
          - entities.InventoryLot.fields.reserved_qty
        distinguishing_aspect: |
          Selector determinism (FEFO by InventoryLot.created_at ASC, never id): with
          two lots of the same SKU in different bins, wave release reserves against
          the EARLIER-created lot first, so its reserved_qty becomes 3 and the later
          lot's reserved_qty stays 0.
        test_recipe:
          setup:
            - "Two lots of the same SKU: lot1 (created first, 5 units) in bin1, lot2 (created later, 5 units) in bin2; order for 3 units released"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Fefo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-FEFO-01", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin1: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-FEFO-02", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin2: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin1}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt1: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt1}/receive"
              payload: { received_qty: 5 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt1}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin2}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt2: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt2}/receive"
              payload: { received_qty: 5 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt2}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "GET /inventory-lots"
              payload: { sku_id: "${sku}", bin_id: "${bin1}" }
              as: ReceivingClerk
              captures: { lot1: "$.data[0].id" }
            - call: "GET /inventory-lots"
              payload: { sku_id: "${sku}", bin_id: "${bin2}" }
              as: ReceivingClerk
              captures: { lot2: "$.data[0].id" }
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 3 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
          trigger:
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
              captures: { st: $.data.status }
          assert:
            - "Wave.${wv}.status == RELEASED"
            - "InventoryLot.${lot1}.reserved_qty == 3"
            - "InventoryLot.${lot1}.available_qty == 2"
            - "InventoryLot.${lot2}.reserved_qty == 0"
            - "InventoryLot.${lot2}.available_qty == 5"

      - name: hazmat_force_carrier_ground_economy_forbidden
        claim_type: conditional_feature_flags
        grounds:
          - validations[priority=8]
          - entities.Sku.fields.hazmat
          - endpoints[POST /clients/{clientId}/shipments]
          - errors[ERR_HAZMAT_CARRIER_FORBIDDEN]
        distinguishing_aspect: |
          The hazmat flag conditionally forbids a carrier: an explicit
          force_carrier=GROUND_ECONOMY on an order with a hazmat line SKU is rejected
          with ERR_HAZMAT_CARRIER_FORBIDDEN (no Shipment created).
        test_recipe:
          setup:
            - "Hazmat SKU; order packed; force_carrier=GROUND_ECONOMY on shipment create"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "HazForce", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, carrier_discount_bps: 0 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "HAZ1", unit_volume_cc: 400, hazmat: true }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-HAZ-01", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 2 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 2 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id" }
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 1 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 1 } ] }
              as: PackStation
          trigger:
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}", force_carrier: "GROUND_ECONOMY" }
              as: ShipStation
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_HAZMAT_CARRIER_FORBIDDEN"

      - name: stale_lot_version_cycle_count_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cycle-count-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
        excluded_because:
          difficulty_instance: cycle_count_to_zero_floors_available_and_on_hand
          rationale: |
            The stale-version OCC rejection is exercised by §1.8 boundary_precision_check;
            that instance counts to zero using the captured live version, and the
            concurrency rule's negative path (stale version -> ERR_STALE_LOT_VERSION,
            412) is the direct complement asserted there. A dedicated stale test is
            redundant with the §1.8 cycle-count OCC coverage.

  # ===========================================================================
  # SECTION: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: ship_cascade_visible_in_same_response_immediate
        claim_type: immediate
        grounds:
          - state_machines.Order.PACKED_to_SHIPPED
          - entities.Order.fields.billed_handling_cents
          - entities.Order.fields.status
        excluded_because:
          difficulty_instance: ship_cascades_lot_consumption_bin_recompute_and_handling_ledger
          rationale: |
            consistency_model is immediate: all ship-time cascades (inventory
            consumption, bin recompute, handling charge, balance credit) are atomic
            within the ship request. The §1.8 transitive_cascade instance already
            asserts those mutations are observable immediately after the ship call,
            covering the immediate-consistency claim end-to-end.
