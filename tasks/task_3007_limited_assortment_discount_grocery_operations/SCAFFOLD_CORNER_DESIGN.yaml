  - section: validations
    instances:
      - name: duplicate_sku_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Second product with an existing sku_code -> 409 ERR_DUPLICATE_SKU (uniqueness across all categories)."
        test_recipe:
          setup: ["two categories, product SKU-1 exists in C1"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat1: $.data.id }
            - call: "POST /v1/categories"
              payload: { code: "C2", name: "Cat Two", sku_cap: 2 }
              as: CategoryManager
              captures: { cat2: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat1}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
          trigger:
            - call: "POST /v1/products"
              payload: { category_id: "${cat2}", sku_code: "SKU-1", name: "Prod Dup", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_SKU, HTTP 409 (uniqueness is global, not per-category)"
      - name: shelf_ready_requires_two_barcodes
        claim_type: violation_to_error
        grounds: ["errors[ERR_BARCODE_COUNT_INVALID]", entities.Product.fields.barcode_count]
        distinguishing_aspect: "shelf_ready_packaging true with barcode_count 1 violates the multi-barcode scan-rate design -> 422 ERR_BARCODE_COUNT_INVALID."
        test_recipe:
          setup: ["category exists"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
          trigger:
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 1, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { err: $.data.error_id }
