        distinguishing_aspect: "CustomerRep is entity_backed:Customer, so X-User-ID must equal Quote.customer_id; BETA's rep deciding ACME's quote returns 403 ERR_CUSTOMER_SCOPE_VIOLATION, and the scope check fires before the state and fiscal rules."
