              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sso: $.data.id }
          trigger:
            - call: "GET /soc/engagements/${eng}"
              payload: {}
              as: SubserviceContact
              as_user_id: "${sso}"
              captures: { err_carve: $.data.error_id }
            - call: "GET /soc/engagements/${eng}"
