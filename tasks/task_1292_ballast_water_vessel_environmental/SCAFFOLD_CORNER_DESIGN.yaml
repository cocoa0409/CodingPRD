      - name: critical_record_escalates_after_24h_boundary
        claim_type: rate_threshold_trigger
        grounds: [state_machines.NoncomplianceRecord.OPEN_to_ESCALATED, calculations.noncompliance_severity_derivation]
        distinguishing_aspect: "CRITICAL records escalate on the accelerated 24h rule (detected_at + 24h < current UTC, strict): at exactly +24h the record is still OPEN; one second later it flips ESCALATED and attaches to the EXISTING ACTIVE case (linked_noncompliance_ids grows to 2, no second case). Score path: 40 (SAMPLING_EXCEEDANCE) + 25 (prior ESCALATED on same voyage) + 15 (posture RESTRICTED) = 80 >= CRITICAL_THRESHOLD 70."
