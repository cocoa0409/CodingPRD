      - name: certification_approval_requires_a_claim_eligible_species
        claim_type: conditional_validation
        grounds:
          - validations[priority=43]
          - errors.ERR_SPECIES_NOT_CLAIM_ELIGIBLE
          - entities.Species.fields.sustainability_program_eligible
          - state_machines.SustainabilityCertification.PENDING_REVIEW_to_ACTIVE
        distinguishing_aspect: |
          The eligibility gate lives on the species flag, not on the certificate: a perfectly
          valid certificate whose species carries sustainability_program_eligible == false
          cannot be approved (422), while REJECT on the same row is always available -- so the
          rule must be evaluated only on the APPROVE branch of the review endpoint.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Farmed Tilapia registered with sustainability_program_eligible == false"
            - "two PENDING_REVIEW certifications for that species from the same supplier"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
