      - name: clear_high_dollar_after_rejection_returns_escalation_required
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_ESCALATION_REQUIRED]"]
        distinguishing_aspect: "A high-dollar case whose auto-opened escalation was REJECTED (none OPEN, none APPROVED) blocks clear with ERR_ESCALATION_REQUIRED — distinct from the OPEN-pending sibling error."
        test_recipe:
