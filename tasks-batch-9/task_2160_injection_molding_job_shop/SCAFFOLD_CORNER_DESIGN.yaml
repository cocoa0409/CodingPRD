  # ==========================================================================
  - section: errors
    instances:

      - name: unknown_ids_return_resource_specific_not_found_codes
        claim_type: Violation to Error
        grounds: ["errors[ERR_PRESS_NOT_FOUND]", "errors[ERR_QUOTE_NOT_FOUND]", "errors[ERR_PPAP_SUBMISSION_NOT_FOUND]", "errors[ERR_RESIN_LOT_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_QUALIFICATION_NOT_FOUND]", "errors[ERR_MAINTENANCE_ORDER_NOT_FOUND]", "errors[ERR_TOOL_TRANSFER_NOT_FOUND]", "errors[ERR_CAPACITY_COMMIT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Every resource family owns a distinct 404 code, and priority 3 fires before body validation, so even a well-formed body against an unknown path id yields the family's own NOT_FOUND rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database apart from the logical clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "GET /presses/00000000-0000-4000-8000-00000000000a", payload: {}, as: PlantAdmin, captures: { e_press: $.data.error_id } }
            - { call: "GET /quotes/00000000-0000-4000-8000-00000000000b", payload: {}, as: SalesEngineer, captures: { e_quote: $.data.error_id } }
            - { call: "GET /ppap-submissions/00000000-0000-4000-8000-00000000000c", payload: {}, as: QualityEngineer, captures: { e_ppap: $.data.error_id } }
            - { call: "GET /resin-lots/00000000-0000-4000-8000-00000000000d", payload: {}, as: QualityEngineer, captures: { e_lot: $.data.error_id } }
            - { call: "GET /production-reports/00000000-0000-4000-8000-00000000000e", payload: {}, as: QualityEngineer, captures: { e_rep: $.data.error_id } }
            - { call: "GET /press-qualifications/00000000-0000-4000-8000-00000000000f", payload: {}, as: ProcessEngineer, captures: { e_pq: $.data.error_id } }
            - { call: "GET /maintenance-orders/00000000-0000-4000-8000-000000000010", payload: {}, as: ToolroomTech, captures: { e_mo: $.data.error_id } }
            - { call: "GET /tool-transfers/00000000-0000-4000-8000-000000000011", payload: {}, as: PlantAdmin, captures: { e_tt: $.data.error_id } }
            - { call: "GET /capacity-commits/00000000-0000-4000-8000-000000000012", payload: {}, as: PlantAdmin, captures: { e_cc: $.data.error_id } }
          assert:
            - "every call returns status 404"
            - "${e_press} == ERR_PRESS_NOT_FOUND and ${e_quote} == ERR_QUOTE_NOT_FOUND and ${e_ppap} == ERR_PPAP_SUBMISSION_NOT_FOUND"
            - "${e_lot} == ERR_RESIN_LOT_NOT_FOUND and ${e_rep} == ERR_REPORT_NOT_FOUND and ${e_pq} == ERR_QUALIFICATION_NOT_FOUND"
            - "${e_mo} == ERR_MAINTENANCE_ORDER_NOT_FOUND and ${e_tt} == ERR_TOOL_TRANSFER_NOT_FOUND and ${e_cc} == ERR_CAPACITY_COMMIT_NOT_FOUND"

