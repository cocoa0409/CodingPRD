  # ===========================================================================
  - section: calculations
    instances:

      - name:
          promo_subsidy_at_risk_is_netted_by_the_agreement_subsidy_rate
        claim_type: Correct Result
        grounds:
          - calculations.promo_subsidy_at_risk
          - entities.PromoPlan.fields.subsidy_at_risk_cents
          - entities.PromoPlan.fields.subsidy_at_application_cents
        distinguishing_aspect: "A 120000-cent 12-month plan exposes the PARTNER's share only: round_half_up(120000 * 0.1599 * 12/12) == 19188 gross, times promo_subsidy_rate 0.30 gives subsidy_at_risk_cents 5756, while subsidy_at_application_cents stays at the projected 19188."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program under an agreement with promo_subsidy_rate 0.30."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Galley", amount_cents: 120000, transaction_channel: "DIGITAL", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { tx_id: "$.data.id" }
          trigger:
            - call: "GET /servicing/promo-plans?transaction_id=${tx_id}"
