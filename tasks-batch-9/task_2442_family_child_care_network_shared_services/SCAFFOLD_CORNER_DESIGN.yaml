  - section: Cross-Cutting Complexity Layers
    instances:
      - name: stale_expected_provider_version_on_agreement_create_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-create-stale-provider]
          - errors[ERR_STALE_PROVIDER_VERSION]
          - validations[priority=8]
        distinguishing_aspect: "The provider version observed before the first agreement create is stale for the second create (the first create bumped Provider.version), so re-sending it returns ERR_STALE_PROVIDER_VERSION at HTTP 412 and does NOT supersede the live SENT agreement; re-reading the version and retrying succeeds."
        test_recipe:
          setup:
            - "Provider P1 at PENDING_AGREEMENT."
            - "Agreement AG1 created with the freshly observed provider version, which bumps Provider.version."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id, agst1: $.data.status }
          trigger:
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 5.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
            - call: "GET /fccn/providers/${p1}"
              as: NetworkAdmin
              captures: { pv2: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 5.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv2}" }
              as: NetworkAdmin
              captures: { ag2: $.data.id, agst2: $.data.status }
          assert:
            - "${agst1} == SENT and ${pv2} > ${pv1} (the first create bumped Provider.version)"
            - "${err} == ERR_STALE_PROVIDER_VERSION with HTTP 412"
            - "MembershipAgreement.${ag1}.status was still SENT after the rejected call — no supersede side effect fired"
            - "the retry with the re-read version returns 201, ${agst2} == SENT and MembershipAgreement.${ag1}.status == WITHDRAWN (supersede now applied)"
            - "Provider.${p1}.version increments again on the successful retry"

      - name: stale_expected_contract_version_on_claim_create_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-create-stale-contract]
          - errors[ERR_STALE_CONTRACT_VERSION]
          - validations[priority=8]
        distinguishing_aspect: "The contract version observed at contract creation is stale once a subsidy-certified enrollment consumes a slot, so a claim create carrying it returns ERR_STALE_CONTRACT_VERSION at HTTP 412 and no DRAFT claim is stored; the re-read version then succeeds."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with an ACTIVE SubsidyContract (version observed at creation)."
            - "One subsidy-certified enrollment created afterwards, which bumps the contract's committed_slots and version."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id, sc1: $.data.slot_committed }
          trigger:
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: Provider
              as_user_id: "${p1}"
              captures: { cv2: $.data.version, slots: $.data.committed_slots }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv2}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id, clst: $.data.status }
          assert:
            - "${sc1} == true and ${slots} == 1 and ${cv2} > ${cv1}"
            - "${err} == ERR_STALE_CONTRACT_VERSION with HTTP 412"
            - "GET /fccn/subsidy-contracts/${c1}/claims returned total_count == 0 immediately after the rejected call"
            - "the retry with the re-read version returns 201 with ${clst} == DRAFT"
            - "SubsidyContract.${c1}.version increments again on the successful claim create"

      - name: cascading_side_effects_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / quality_escalation_cascade_depth_four_review_provider_contract_claim_revenue
          rationale: "The named §1.8 instance walks all four cascade hops and asserts each level, including the ordering-sensitive claim hold."

      - name: dual_variant_calculation_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / subsidy_claim_provisional_advance_vs_final_reconciled_divergence
          rationale: "The named §1.8 instance asserts both variant results and the delta applied on the switch."

      - name: derived_field_reconciliation_after_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / enrollment_withdraw_cascade_depth_three_status_slot_release_revenue
          rationale: "The named §1.8 instance asserts the derived revenue and slot fields before and after the source enrollment is withdrawn."

  - section: Consistency Model
    instances:
      - name: enrollment_create_makes_every_derived_field_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.SubsidyContract.fields.committed_slots
          - entities.Provider.fields.projected_monthly_revenue_cents
        distinguishing_aspect: "The enrollment create response itself already carries slot_committed true, and reads issued immediately afterwards show SubsidyContract.committed_slots 1, available_slots 3 and Provider.projected_monthly_revenue_cents 60000 with no intervening call — nothing lags behind the write."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with capacity_slots 6, one private enrollment CH-0 at 60000, and an ACTIVE SubsidyContract with contracted_slots 4 and committed_slots 0."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { c1: $.data.id, slots0: $.data.committed_slots }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-0", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 60000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e0: $.data.id }
          trigger:
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id, sc1: $.data.slot_committed }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: Provider
              as_user_id: "${p1}"
              captures: { slots1: $.data.committed_slots, avail1: $.data.available_slots }
            - call: "GET /fccn/providers/${p1}"
              as: Provider
              as_user_id: "${p1}"
              captures: { rev1: $.data.projected_monthly_revenue_cents }
          assert:
            - "${slots0} == 0 before the subsidy-certified enrollment"
            - "${sc1} == true in the create response itself — the derived flag is not deferred"
            - "${slots1} == 1 and ${avail1} == 3 on the very next read"
            - "${rev1} == 60000 (only the private enrollment contributes tuition; the subsidy child contributes 0 private tuition)"
            - "no re-read is needed for any of these values to be correct"
