      - name: corner_imaging_validity_window_rejects_a_stale_or_future_study
        claim_type: temporal_validation
        grounds:
          - validations.priority_16
          - errors[ERR_IMAGING_STUDY_STALE]
        distinguishing_aspect: "The window is the closed interval 0..14 days measured as encounter_datetime minus study_datetime: a 15-day-old study is rejected, a study dated AFTER the encounter is rejected by the same rule (a negative gap fails the lower bound), and exactly 14 days is accepted."
        test_recipe:
          setup:
            - "the corner prologue with an activated plan for P-NP and its baseline study dated 2026-08-01T00:00:00Z"
          setup_api_calls:
