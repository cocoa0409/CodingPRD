      - name: derived_occupied_unit_count_reconciles_after_close
        claim_type: derived_field_reconciliation
        grounds: [calculations.facility_occupied_unit_count, entities.Facility.fields.occupied_unit_count, state_machines.Lease.ACTIVE_to_CLOSED]
        distinguishing_aspect: "occupied_unit_count is 1 after activation and 0 after the lease is closed (derived field recomputed on the source Unit status change)."
        test_recipe:
          setup: ["Lease activated (count 1) then paid to zero and closed."]
          setup_api_calls:
            - call: "POST /facilities"
