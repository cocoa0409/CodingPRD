          PremiumFinanceAgreement carries three sibling FKs and no parent, which is what
          entity_topology: flat means here — integrity is enforced by explicit reference checks
          rather than by URL nesting. Each of the three dangling references produces its OWN 404
          code, so an implementation that collapses them into one generic ERR_INVALID_REQUEST or
          resolves them in a different order than the §1.4 ladder (insured at priority 4 first) is
          caught.
