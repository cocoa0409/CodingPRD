  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A GET request with the X-User-Role/X-User-ID headers omitted entirely returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
          setup: ["Agency exists; the trigger call is sent with NO X-User-* headers."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "GET /agencies/agencies/${ag}"
              payload: {}
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Trigger is sent with both X-User-Role and X-User-ID headers omitted"
            - "Response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "HTTP status == 400"

