  - rule_id: non_linear_state_machine
    instances:

      - name: official_statement_revision_cycle_bounded
        grounds:
          - state_machines.OfficialStatement.DRAFTING_to_IN_REVIEW
          - state_machines.OfficialStatement.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.OfficialStatement.REVISION_REQUESTED_to_DRAFTING
          - entities.OfficialStatement.fields.draft_round
          - validations[priority=13]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Entity is OfficialStatement and the non-linearity is a true cycle: DRAFTING ->
          IN_REVIEW -> REVISION_REQUESTED -> DRAFTING traversed three times, with draft_round
          acting as the loop counter (1 -> 2 -> 3 -> 4) and the fourth revision request rejected
          with ERR_REVISION_LIMIT_EXCEEDED while the statement stays in IN_REVIEW.
        test_recipe:
          setup:
            - "One municipal advisor firm and one issuer exist; a DRAFT deal authorizes 5,000,000."
            - "An official statement POS-1 exists in DRAFTING with one approved material RISK_FACTOR section."
            - "Logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
