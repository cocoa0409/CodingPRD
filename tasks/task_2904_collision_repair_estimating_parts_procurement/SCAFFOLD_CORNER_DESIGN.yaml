      - name: parts_rebate_applies_the_average_rate_to_the_whole_gross
        claim_type: tiered_pricing_rate_selection
        grounds:
          - calculations.estimate_totals
          - entities.RepairOrder.fields.parts_discount_cents
        distinguishing_aspect: >-
          At a gross of 600000 the top tier applies to every cent, not just the excess: the discount is
          5% of 600000 = 30000. A marginal reading (3% of the 400000 between the floors plus 5% of the
          last 100000 = 17000) is the natural wrong answer and is 13000 out, which shifts pre_tax_total
          and insurer_authorized_cents with it.
        test_recipe:
          setup:
            - "An order with deductible 25000 and initial_authorized_cents 900000, one BODY 4.5 h line (labor 27000, supplies 1080)."
            - "One OEM PartsLine, list 700000, qty 1, quoted at 600000 with a zero-discount vendor - the insurer ceiling is the default 1.1, so 600000 <= round_half_up(770000) passes."
          setup_api_calls:
