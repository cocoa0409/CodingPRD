# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of every other testable claim)
# Pool Construction & Remodel. Walks claim-extraction-guide row-by-row against
# §1.1–§1.7. Reusable permit chain drives a project to design_status=PERMITTED.
# owner_user_id "owner-1" (Owner acts as as_user_id "owner-1").
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: project_create_returns_initialized_fields
        claim_type: creation
        grounds:
          - endpoints.POST./pool-build/pool-projects
          - entities.PoolProject.fields.construction_status
          - entities.PoolProject.fields.posture
          - entities.PoolProject.fields.contract_amount_cents
        distinguishing_aspect: "POST project with all required fields → 201; construction_status=NOT_STARTED, posture=OPEN, design_status=NO_DESIGN, contract_amount_cents==contract_price_cents (500000), amount_remaining_cents==500000, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
          assert:
            - "PoolProject.${pp_id}.construction_status == NOT_STARTED"
            - "PoolProject.${pp_id}.posture == OPEN"
            - "PoolProject.${pp_id}.design_status == NO_DESIGN"
            - "PoolProject.${pp_id}.contract_amount_cents == 500000"
            - "PoolProject.${pp_id}.amount_remaining_cents == 500000"
            - "PoolProject.${pp_id}.version == 1"

      - name: project_get_not_found
        claim_type: not_found
        grounds:
          - "endpoints.GET./pool-build/pool-projects/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET a non-existent PoolProject id → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /pool-build/pool-projects/00000000-0000-0000-0000-000000000000", as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 404"
            - "trigger response data.error_id == ERR_NOT_FOUND"

      - name: project_create_missing_contract_price_returns_invalid
        claim_type: required_fields
        grounds:
          - "endpoints.POST./pool-build/pool-projects"
          - "errors[ERR_VALIDATION]"
          - "validations[priority=4]"
        distinguishing_aspect: "POST project omitting the required contract_price_cents → ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", pool_gallons: 20000 }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 422"
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: subcontractor_invalid_trade_enum_returns_invalid
        claim_type: type_constraints
        grounds:
          - "endpoints.POST./pool-build/subcontractors"
          - "entities.Subcontractor.fields.trade"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST subcontractor with trade='WELDER' (not in the enum) → ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "S", trade: "WELDER" }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 422"
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: design_create_unknown_project_fk_returns_not_found
        claim_type: parent_relationship
        grounds:
          - "entities.DesignPlan.fields.pool_project_id"
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "POST design-plan whose pool_project_id references no project → ERR_NOT_FOUND (404); flat-topology FK integrity."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "00000000-0000-0000-0000-000000000000", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 404"
            - "trigger response data.error_id == ERR_NOT_FOUND"

      - name: design_status_reconciled_to_permitted_after_issue
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.design_status_rollup"
          - "entities.PoolProject.fields.design_status"
        distinguishing_aspect: "After RENDER→APPROVE→SUBMIT_PERMIT→ISSUE_PERMIT, GET project shows the computed design_status reconciled to PERMITTED."
        test_recipe:
          setup: ["A project whose design is rendered, owner-approved, permit submitted and issued."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
          trigger:
            - { call: "GET /pool-build/pool-projects/${pp_id}", as: BuilderPM, captures: { ds: $.data.design_status } }
          assert:
            - "PoolProject.${pp_id}.design_status == PERMITTED"

  # ==========================================================================
  - section: state_machines
    instances:
      - name: phase_gate_created_in_pending_state
        claim_type: initial_state
        grounds:
          - "state_machines.PhaseGate"
          - "entities.PhaseGate.fields.status"
          - "entities.PhaseGate.fields.sequence_index"
        distinguishing_aspect: "A freshly created PhaseGate has status=PENDING and sequence_index derived from its phase (STEEL→2)."
        test_recipe:
          setup: ["A permitted project."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
          trigger:
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "STEEL", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
          assert:
            - "PhaseGate.${pg_id}.status == PENDING"
            - "PhaseGate.${pg_id}.sequence_index == 2"

      - name: submit_permit_before_owner_approved_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.DesignPlan.NONE_to_SUBMITTED"
          - "errors[ERR_DESIGN_NOT_APPROVED]"
        distinguishing_aspect: "SUBMIT_PERMIT while DesignPlan.status=DRAFT (not OWNER_APPROVED) → ERR_DESIGN_NOT_APPROVED (409)."
        test_recipe:
          setup: ["A project with a DRAFT design plan (not rendered/approved)."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_DESIGN_NOT_APPROVED"

      - name: phase_gate_create_requires_issued_permit
        claim_type: precondition_enforcement
        grounds:
          - "endpoints.POST./pool-build/phase-gates"
          - "errors[ERR_PERMIT_NOT_ISSUED]"
          - "validations[priority=12]"
        distinguishing_aspect: "Creating a PhaseGate while the design is only OWNER_APPROVED with permit SUBMITTED (design_status != PERMITTED) → ERR_PERMIT_NOT_ISSUED (409)."
        test_recipe:
          setup: ["A project whose design is OWNER_APPROVED and permit SUBMITTED but not yet ISSUED."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
          trigger:
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_PERMIT_NOT_ISSUED"

      - name: phase_start_out_of_sequence_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.PhaseGate.PENDING_to_IN_PROGRESS"
          - "errors[ERR_PHASE_SEQUENCE]"
          - "validations[priority=13]"
        distinguishing_aspect: "Starting STEEL (sequence 2) while EXCAVATION (sequence 1) is not PASSED → ERR_PHASE_SEQUENCE (409)."
        test_recipe:
          setup: ["Permitted project with EXCAVATION (PENDING) and STEEL (PENDING) gates."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pgE: $.data.id } }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "STEEL", budget_cents: 100000 }, as: BuilderPM, captures: { pgS: $.data.id } }
          trigger:
            - { call: "POST /pool-build/phase-gates/${pgS}/start", payload: {}, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_PHASE_SEQUENCE"

      - name: inspection_before_gate_in_progress_rejected
        claim_type: precondition_enforcement
        grounds:
          - "endpoints.POST./pool-build/inspections"
          - "errors[ERR_PHASE_NOT_IN_PROGRESS]"
        distinguishing_aspect: "Scheduling an inspection for a PENDING (not started) gate → ERR_PHASE_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["Permitted project with an EXCAVATION gate still PENDING."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/inspections", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg_id}", inspector_name: "Insp", scheduled_at: "2026-06-01T10:00:00Z" }, as: Inspector, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_PHASE_NOT_IN_PROGRESS"

      - name: crew_complete_gate_not_active_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.CrewAssignment.SCHEDULED_to_COMPLETED"
          - "errors[ERR_PHASE_NOT_ACTIVE]"
        distinguishing_aspect: "Completing a crew assignment whose gate is still PENDING (not IN_PROGRESS/INSPECTION_PENDING) → ERR_PHASE_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Permitted project; EXCAVATION gate PENDING; sub S; crew A1 SCHEDULED on the gate."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "S", trade: "EXCAVATOR" }, as: BuilderPM, captures: { sub_id: $.data.id } }
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${pp_id}", subcontractor_id: "${sub_id}", phase_gate_id: "${pg_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T16:00:00Z" }, as: BuilderPM, captures: { a1_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/crew-assignments/${a1_id}/transition", payload: { action: "COMPLETE" }, as: Subcontractor, as_user_id: "${sub_id}", captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_PHASE_NOT_ACTIVE"

      - name: change_order_apply_before_approved_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ChangeOrder.APPROVED_to_APPLIED"
          - "errors[ERR_CHANGE_ORDER_NOT_APPROVED]"
        distinguishing_aspect: "APPLY on a PROPOSED (not APPROVED) ChangeOrder → ERR_CHANGE_ORDER_NOT_APPROVED (409)."
        test_recipe:
          setup: ["Project with a PROPOSED ChangeOrder."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 1000000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/change-orders", payload: { pool_project_id: "${pp_id}", category: "PUMP", description: "vs pump", price_delta_cents: 50000 }, as: BuilderPM, captures: { co_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/change-orders/${co_id}/transition", payload: { action: "APPLY" }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_CHANGE_ORDER_NOT_APPROVED"

      - name: orient_before_startup_ready_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PoolProject.STARTUP_READY_to_ORIENTED"
          - "errors[ERR_NOT_STARTUP_READY]"
        distinguishing_aspect: "ORIENT on a NOT_STARTED project (construction_status != STARTUP_READY) → ERR_NOT_STARTUP_READY (409)."
        test_recipe:
          setup: ["A freshly created project (NOT_STARTED)."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/pool-projects/${pp_id}/transition", payload: { action: "ORIENT" }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_NOT_STARTUP_READY"

      - name: duplicate_design_plan_rejected
        claim_type: violation_to_error
        grounds:
          - "endpoints.POST./pool-build/design-plans"
          - "errors[ERR_DESIGN_ALREADY_EXISTS]"
          - "validations[priority=14]"
        distinguishing_aspect: "Creating a second DesignPlan for a project that already has one → ERR_DESIGN_ALREADY_EXISTS (409)."
        test_recipe:
          setup: ["A project that already has a DesignPlan."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 20, width_ft: 10, avg_depth_ft: 4 }, as: Designer, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_DESIGN_ALREADY_EXISTS"

      - name: duplicate_phase_gate_rejected
        claim_type: violation_to_error
        grounds:
          - "endpoints.POST./pool-build/phase-gates"
          - "errors[ERR_PHASE_ALREADY_EXISTS]"
          - "validations[priority=14]"
        distinguishing_aspect: "Creating a second EXCAVATION PhaseGate for a project that already has one → ERR_PHASE_ALREADY_EXISTS (409)."
        test_recipe:
          setup: ["Permitted project with an EXCAVATION gate."]
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 90000 }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_PHASE_ALREADY_EXISTS"

      - name: record_already_passed_inspection_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Inspection.SCHEDULED_to_PASSED"
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=5]"
        distinguishing_aspect: "Recording an outcome on an Inspection already in terminal PASSED → ERR_INVALID_STATE (409); no side effects re-fire."
        test_recipe:
          setup: ["Permitted project; EXCAVATION started; inspection scheduled and recorded PASS (terminal)."]
          setup_api_calls:
