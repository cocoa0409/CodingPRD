  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_plan_modify_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-modify-stale-version]
          - errors[ERR_STALE_PLAN_VERSION]
        distinguishing_aspect: "PATCH with the version last observed succeeds and bumps version 2 -> 3; replaying the same expected_plan_version is then rejected with ERR_STALE_PLAN_VERSION (412) — a stale-view conflict resolved purely by OCC."
        test_recipe:
          setup: ["Plan created (version 1) and published (version 2); client observed version 2 at publish time"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Occ Corp", ticker: "OCC", name: "OCC DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_oc: $.data.id } }
            - { call: "POST /drip/plans/${plan_oc}/publish", as: PlanAdmin, captures: { plan_oc_v: $.data.version } }
          trigger:
            - { call: "PATCH /drip/plans/${plan_oc}", payload: { expected_plan_version: "${plan_oc_v}", discount_pct: 0.03 }, as: PlanAdmin }
            - { call: "PATCH /drip/plans/${plan_oc}", payload: { expected_plan_version: "${plan_oc_v}", discount_pct: 0.04 }, as: PlanAdmin, captures: { err_id: $.data.error_id } }
            - { call: "GET /drip/plans/${plan_oc}/notices", as: PlanAdmin }
          assert:
            - "First PATCH succeeds: Plan.${plan_oc}.discount_pct == 0.03 and version == 3"
            - "Second PATCH (replaying the stale version) fails with error_id == ERR_STALE_PLAN_VERSION (http 412)"
            - "A DRAFT MODIFICATION PlanNotice was auto-created by the successful PATCH on the ACTIVE plan"

      - name: occ_enrollment_election_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enrollment-election-stale-version]
          - errors[ERR_STALE_ENROLLMENT_VERSION]
        distinguishing_aspect: "Election PATCH carries expected_enrollment_version from a prior read; the first change succeeds (FULL_REINVEST -> CASH_ONLY, version 2 -> 3) and the replay of the same version is rejected with ERR_STALE_ENROLLMENT_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE plan with one ACTIVE enrollment (version 2 after activation); client observed version 2 via GET"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Occ2 Corp", ticker: "OC2", name: "OC2 DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_o2: $.data.id } }
            - { call: "POST /drip/plans/${plan_o2}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat O2", email: "po2b@x.com" }, as: PlanAdmin, captures: { p_o2b: $.data.id } }
            - { call: "POST /drip/plans/${plan_o2}/enrollments", payload: { participant_id: "${p_o2b}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_o2b}", captures: { e_o2: $.data.id } }
            - { call: "POST /drip/enrollments/${e_o2}/activate", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_o2}", as: PlanAdmin, captures: { e_o2_v: $.data.version } }
          trigger:
            - { call: "PATCH /drip/enrollments/${e_o2}/election", payload: { expected_enrollment_version: "${e_o2_v}", election: "CASH_ONLY" }, as: Participant, as_user_id: "${p_o2b}" }
            - { call: "PATCH /drip/enrollments/${e_o2}/election", payload: { expected_enrollment_version: "${e_o2_v}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_o2b}", captures: { err_id: $.data.error_id } }
          assert:
            - "First PATCH succeeds: election == CASH_ONLY and version == 3"
            - "Second PATCH fails with error_id == ERR_STALE_ENROLLMENT_VERSION (http 412)"

      - name: window_open_before_opens_at_rejected
        claim_type: scheduled_actions
        grounds:
          - validations[priority=6]
          - errors[ERR_WINDOW_OPEN_TOO_EARLY]
        distinguishing_aspect: "The fixed startup clock (2026-08-01T00:00:00Z) gates scheduled actions: opening a window whose opens_at is 2026-09-01 fails with ERR_WINDOW_OPEN_TOO_EARLY until the logical clock is advanced."
        test_recipe:
          setup: ["ACTIVE plan with SCHEDULED window [2026-09-01, 2026-09-15); clock untouched at the 2026-08-01 default"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Clk Corp", ticker: "CLK", name: "CLK DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_ck: $.data.id } }
            - { call: "POST /drip/plans/${plan_ck}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_ck}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_ck: $.data.id } }
          trigger:
            - { call: "POST /drip/purchase-windows/${w_ck}/open", as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_OPEN_TOO_EARLY (http 422)"
            - "PurchaseWindow.${w_ck}.status remains SCHEDULED"

      - name: fee_waiver_flag_conditional_behavior
        claim_type: conditional_feature_flags
        grounds: [entities.Participant.fields.fee_waiver_eligible, calculations.ocp_fee_assessment]
        excluded_because:
          difficulty_instance: ocp_fee_max_min_with_conditional_inputs
          rationale: "The waiver branch (computed 600, charged 0, waived true, AUTO_ELIGIBLE) is asserted there alongside the non-waived branches."

      - name: cascade_layer_coverage
        claim_type: cascading_side_effects
        grounds: [state_machines.Plan.ACTIVE_to_SUSPENDED, state_machines.Enrollment.ACTIVE_to_TERMINATED]
        excluded_because:
          difficulty_instance: plan_suspend_cascades_enrollment_order_window
          rationale: "Both N-level cascades are exercised end-to-end by §1.8 instances plan_suspend_cascades_enrollment_order_window and enrollment_terminate_cascades_sale_lots_fee."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: deposit_immediately_visible_in_enrollment
        claim_type: immediate
        grounds: [entities.Enrollment.fields.share_balance, entities.Enrollment.fields.total_cost_basis_cents]
        distinguishing_aspect: "Immediate consistency: after the deposit call returns, a plain GET shows share_balance 20.0000 and total_cost_basis_cents 20000 with no lag or reconciliation step."
        test_recipe:
          setup: ["ACTIVE plan with one ACTIVE enrollment"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Imm Corp", ticker: "IMM", name: "IMM DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_im: $.data.id } }
            - { call: "POST /drip/plans/${plan_im}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Im", email: "pim@x.com" }, as: PlanAdmin, captures: { p_im: $.data.id } }
            - { call: "POST /drip/plans/${plan_im}/enrollments", payload: { participant_id: "${p_im}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_im}", captures: { e_im: $.data.id } }
            - { call: "POST /drip/enrollments/${e_im}/activate", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/enrollments/${e_im}/deposits", payload: { quantity: 20.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_im}", as: PlanAdmin }
          assert:
            - "Enrollment.${e_im}.share_balance == 20.0000 and total_cost_basis_cents == 20000 in the read immediately following the write"

