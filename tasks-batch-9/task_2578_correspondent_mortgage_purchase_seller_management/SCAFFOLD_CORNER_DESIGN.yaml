              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 1500000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 760, reference_ltv_pct: 75.0 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c1: $.data.id }
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 1500000000, delivery_window_start: "2026-08-31", delivery_expiry_date: "2026-09-30", reference_fico: 760, reference_ltv_pct: 75.0 }
              as: LockDeskTrader
