# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0920_employer_onsite_nearsite_clinic
# 9 rule_ids, 24 instances. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: hra_score_clinic_measured_vs_self_attested_flips_outcome_standard
        grounds:
          - calculations.health_risk_score
          - entities.HealthAssessment.fields.source_type
          - entities.HealthAssessment.fields.risk_points_total
          - entities.HealthAssessment.fields.outcome_standard_met
          - entities.HealthAssessment.fields.outcome_credit_status
        distinguishing_aspect: |
          This dual variant lives on the HealthAssessment domain (clinical risk scoring): the identical
          six measurements score 5 points as CLINIC_MEASURED and 6 points as SELF_ATTESTED because the
          unverified multiplier 1.25 is applied only on the self-attested branch, flipping
          outcome_standard_met from true to false.
        test_recipe:
          setup:
            - "Clock at 2026-06-08T09:30:00Z; employer Northwind with a staffed on-site clinic."
            - "Participant Ana enrolled and ACTIVE, with one CHECKED_IN visit created from her booked appointment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "Northwind Manufacturing", employer_code: "NWM", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 500000, tobacco_program_enabled: false }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /sites"
              payload: { site_name: "Northwind On-Site Clinic", site_type: "ON_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 8, host_employer_id: "${emp_id}" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { site_id: "${site_id}", employer_id: "${emp_id}", vendor_name: "CareOnSite LLC", fee_model: "PER_VISIT", per_visit_fee_cents: 9500, fte_hourly_rate_cents: 14000, minimum_guarantee_cents: 100000, quota_visits_total: 50 }
              as: ProgramAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /providers"
              payload: { site_id: "${site_id}", full_name: "Dr Rivera", provider_function: "CLINICIAN", license_expiry_date: "2027-12-31" }
              as: ClinicManager
              captures: { clin_id: $.data.id }
            - call: "POST /staffing-shifts"
              payload: { site_id: "${site_id}", provider_id: "${clin_id}", shift_start: "2026-06-08T08:00:00Z", shift_end: "2026-06-08T17:00:00Z", coverage_role: "PRIMARY_CARE" }
              as: ClinicManager
            - call: "POST /eligibility-records"
              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-1001", member_external_id: "M-1001", tier: "EMPLOYEE", effective_date: "2026-01-01" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { elig_id: $.data.id }
            - call: "POST /participants"
              payload: { employer_id: "${emp_id}", eligibility_record_id: "${elig_id}", display_name: "Ana Silva" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { site_v: $.data.version }
            - call: "POST /appointments"
              payload: { participant_id: "${p_id}", site_id: "${site_id}", provider_id: "${clin_id}", visit_type: "PRIMARY_CARE", scheduled_start: "2026-06-08T09:00:00Z", expected_site_version: "${site_v}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { apt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /appointments/${apt_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /health-assessments"
              payload: { participant_id: "${p_id}", source_type: "CLINIC_MEASURED", measurement_date: "2026-06-08", visit_id: "${visit_id}", systolic_mmhg: 132, diastolic_mmhg: 78, bmi: 27.4, a1c_pct: 5.7, ldl_mg_dl: 118, cotinine_ng_ml: 2.0 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { clinic_hra_id: $.data.id }
            - call: "POST /health-assessments"
              payload: { participant_id: "${p_id}", source_type: "SELF_ATTESTED", measurement_date: "2026-06-08", systolic_mmhg: 132, diastolic_mmhg: 78, bmi: 27.4, a1c_pct: 5.7, ldl_mg_dl: 118, self_reported_tobacco: false }
              as: Participant
              as_user_id: "${p_id}"
              captures: { self_hra_id: $.data.id }
          assert:
            - "HealthAssessment.${clinic_hra_id}.risk_points_raw == 5"
            - "HealthAssessment.${clinic_hra_id}.risk_points_total == 5"
            - "HealthAssessment.${clinic_hra_id}.risk_band == MODERATE"
            - "HealthAssessment.${clinic_hra_id}.outcome_standard_met == true"
            - "HealthAssessment.${clinic_hra_id}.outcome_credit_status == MET_DIRECT"
            - "HealthAssessment.${self_hra_id}.risk_points_raw == 5"
            - "HealthAssessment.${self_hra_id}.risk_points_total == 6"
            - "HealthAssessment.${self_hra_id}.risk_band == MODERATE"
            - "HealthAssessment.${self_hra_id}.outcome_standard_met == false"
            - "HealthAssessment.${self_hra_id}.outcome_credit_status == PENDING_ALTERNATIVE"

      - name: incentive_cap_standard_tier_rejects_what_tobacco_tier_accepts
        grounds:
          - calculations.incentive_program_cap
          - entities.Employer.fields.tobacco_program_enabled
          - entities.Employer.fields.annual_total_cost_of_coverage_cents
          - validations[priority=24]
          - errors[ERR_INCENTIVE_CAP_EXCEEDED]
        distinguishing_aspect: |
          This dual variant lives on the Employer money domain, not on the clinical domain: with
          annual_total_cost_of_coverage_cents 200000 the standard cap is 60000 cents and the tobacco cap
          is 100000 cents, so the identical award pair (60000 OUTCOME_BASED then 15000 PARTICIPATORY) is
          rejected under the standard tier and accepted unchanged under the tobacco tier.
        test_recipe:
          setup:
            - "Two employers with identical annual_total_cost_of_coverage_cents 200000 and identical wellness budgets, differing only in tobacco_program_enabled."
            - "One ACTIVE participant per employer, each with a MET_DIRECT clinic assessment, and one OPEN June reporting period per employer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "Standard Cap Co", employer_code: "STD", annual_total_cost_of_coverage_cents: 200000, wellness_budget_cents: 500000, tobacco_program_enabled: false }
              as: ProgramAdmin
              captures: { emp_std: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "Tobacco Cap Co", employer_code: "TOB", annual_total_cost_of_coverage_cents: 200000, wellness_budget_cents: 500000, tobacco_program_enabled: true }
              as: ProgramAdmin
              captures: { emp_tob: $.data.id }
            - call: "POST /reporting-periods"
              payload: { employer_id: "${emp_std}", period_start: "2026-06-01", period_end: "2026-06-30" }
              as: ProgramAdmin
              captures: { per_std: $.data.id }
            - call: "POST /reporting-periods"
              payload: { employer_id: "${emp_tob}", period_start: "2026-06-01", period_end: "2026-06-30" }
              as: ProgramAdmin
              captures: { per_tob: $.data.id }
            - call: "POST /sites"
