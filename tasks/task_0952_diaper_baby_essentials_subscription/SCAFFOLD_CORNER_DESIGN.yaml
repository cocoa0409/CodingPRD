              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ALLERGEN_BLOCKED"
            - "HTTP status is 422"
            - "Cycle.${c1}.status == PLANNED"
            - "no CycleLine row exists with cycle_id == ${c1}"
