    grounds:
    - §1.0 role_model segregation_of_duties
    - §1.4 priority 14 ERR_SEGREGATION_OF_DUTIES
    - §1.2 SupplierContract PROPOSED -> EXECUTED preconditions on X-User-ID
    - §1.1 SupplierContract.last_proposed_by_user_id, last_countered_by_user_id, executed_by_user_id
    distinguishing_aspect: |
      The role model declared in §1.0 is segregation_of_duties, and this is the instance that proves the separation is enforced on the acting user rather than on the role label — the sharp case being a caller who legitimately holds the ContractApprover role but whose X-User-ID is the one recorded as last_proposed_by_user_id. Both provenance fields are populated here because the contract went PROPOSE, COUNTER, PROPOSE, so the check has two independent ways to fail and a correct implementation must test both. The tax half of the same role model has its own instance.
