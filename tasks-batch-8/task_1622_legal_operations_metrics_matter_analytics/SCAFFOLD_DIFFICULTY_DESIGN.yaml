  # ==========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers, depth ≥3 and ≥2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: invoice_pay_cascades_through_spendline_to_budget_posture
        grounds:
          - state_machines.Invoice.transitions.APPROVED_to_PAID
          - calculations.budget_posture_derivation
          - entities.Budget.fields.posture
        distinguishing_aspect: |
          Depth-3 cascade: POST invoice.pay mutates Invoice (payment_status ->
          PAID); that mutation triggers SpendLine insert; SpendLine insert
          triggers Budget.consumed_cents recompute; that recompute triggers
          Budget.posture re-derivation. Original trigger is invoice pay; each
          link caused by the prior link, not direct fan-out from invoice.pay.
        test_recipe:
          setup:
            - "Department with warning=0.80 critical=0.95"
            - "FP OPEN; PA; MT; firm F; counsel C"
            - "Budget B (FP,PA,MT) allocated 1000000"
            - "Matter M ACTIVE"
