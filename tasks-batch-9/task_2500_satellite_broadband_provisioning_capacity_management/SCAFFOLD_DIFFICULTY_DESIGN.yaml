            - "hop 2: Subscription.${sn1_id}.deauthorized_by_license_id == ${lic_id}"
            - "hop 2: Subscription.${sn1_id}.service_state == ACTIVE (the provisioning dimension is untouched)"
            - "hop 3: RoamingAuthorization.${ra1_id}.auth_state == REVOKED"
            - "hop 3: RoamingAuthorization.${ra1_id}.revoked_reason == 'LICENSE_SUSPENDED'"
            - "hop 4: ServiceCell.${cell_id}.availability_state == CLOSED"
            - "ServiceCell.${cell_id}.committed_terminal_count == 1"

      - name: warranty_replacement_install_replaces_terminal_resumes_service_and_reprices_beam
        grounds:
          - state_machines.Terminal.DELIVERED_to_INSTALLED
          - state_machines.Terminal.RMA_PENDING_to_REPLACED
          - state_machines.Subscription.SUSPENDED_to_ACTIVE
          - entities.Terminal.fields.replaces_terminal_id
          - calculations.beam_weighted_oversubscription
        distinguishing_aspect: |
          Cascade B, depth 4, triggered by a different transition (the replacement terminal's install,
          not a licence write): install marks the faulty terminal REPLACED (hop 1); that REPLACED
          marking resumes the RMA-suspended subscription and re-points its terminal_id (hop 2, caused
          by hop 1); the resumption re-adds the subscription to weighted_sold_mbps (hop 3, caused by
          hop 2); the new ratio recomputes the cell's availability_state (hop 4, caused by hop 3).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; base licence/beam/cell/plan fixture; cell max_active_terminals 1."
            - "Subscription SN1 was ACTIVE and AUTHORIZED_FIXED on terminal TRM-0001, so weighted_sold_mbps was 200.0."
            - "A warranty RMA has been raised: TRM-0001 is RMA_PENDING, replacement TRM-0001R exists in SHIPPED with replaces_terminal_id == TRM-0001, SN1 is SUSPENDED with suspension_reason 'RMA_IN_FLIGHT', and weighted_sold_mbps has dropped to 0."
            - "TRM-0001R has been delivered and has a fresh PASS obstruction scan (1 of 200 samples, 0.50 percent)."
          setup_api_calls:
            - call: "POST /satellite-broadband/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
