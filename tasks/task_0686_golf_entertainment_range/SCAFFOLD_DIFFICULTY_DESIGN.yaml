# =============================================================================
# task_0686_golf_entertainment_range — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 rule_ids x 2 instances = 18 instances.
# Every grounds: ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every formula-derived assert is a pre-computed literal (see calc scripts).
# Clock default 2026-04-01T00:00:00Z (per /golf/_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: event_pricing_provisional_vs_settled_diverges_on_event_package
        grounds:
          - calculations.EVENT_PRICING
          - entities.EventPackage.fields.estimated_total_cents
          - entities.EventPackage.fields.final_total_cents
          - state_machines.EventPackage.CONFIRMED_to_SETTLED
        distinguishing_aspect: |
          EVENT_PRICING runs on the EventPackage entity domain: provisional uses
          headcount_estimate (20 -> 145000) while settled uses actual_attendee_count
          plus F&B overage (17 -> 133700); the two variants yield different totals.
        test_recipe:
          setup:
            - "Venue + organizer Member(PLATINUM) with wallet topped to 200000."
            - "EventPackage QUOTED with headcount_estimate=20, per_head_package_cents=6500, bay_block_cents=15000, deposit_cents=140000; estimated_total_cents=145000."
            - "Package CONFIRMED (deposit 140000 debited). One CLOSED event FBTab total 8200. Then SETTLED with actual_attendee_count=17."
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "Range A", bay_count: 4 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "org@x.com", full_name: "Org", tier: "PLATINUM" }
              as: RangeManager
              captures: { org_id: $.data.id }
            - call: "POST /golf/members/${org_id}/wallet/topup"
              payload: { amount_cents: 200000 }
              as: RangeManager
            - call: "POST /golf/event-packages"
              payload: { venue_id: "${venue_id}", organizer_member_id: "${org_id}", headcount_estimate: 20, per_head_package_cents: 6500, bay_block_cents: 15000, deposit_cents: 140000 }
              as: RangeManager
              captures: { ep_id: $.data.id, est_total: $.data.estimated_total_cents }
            - call: "POST /golf/event-packages/${ep_id}/confirm"
              payload: {}
              as: RangeManager
            - call: "POST /golf/fb-tabs"
              payload: { event_package_id: "${ep_id}" }
              as: FrontDesk
              captures: { tab_id: $.data.id }
            - call: "POST /golf/fb-tabs/${tab_id}/items"
              payload: { name: "Catering", unit_price_cents: 8200, qty: 1 }
              as: FrontDesk
            - call: "POST /golf/fb-tabs/${tab_id}/close"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /golf/event-packages/${ep_id}/settle"
              payload: { actual_attendee_count: 17 }
              as: RangeManager
              captures: { final_total: $.data.final_total_cents }
          assert:
            - "EventPackage.${ep_id}.estimated_total_cents == 145000"
            - "EventPackage.${ep_id}.final_total_cents == 133700"
            - "EventPackage.${ep_id}.estimated_total_cents != EventPackage.${ep_id}.final_total_cents"

      - name: loyalty_earn_provisional_vs_final_diverges_on_member
        grounds:
          - calculations.LOYALTY_EARN
          - entities.Member.fields.pending_loyalty_points
          - entities.Member.fields.loyalty_points
          - state_machines.GameSession.OPEN_to_ENDED
        distinguishing_aspect: |
          LOYALTY_EARN runs on the Member entity domain (different domain from
          EVENT_PRICING): provisional is tier-agnostic floor(net/100)=68 accrued
          to pending_loyalty_points at confirm; final applies PLATINUM x1.5 ->
          floor(68*1.5)=102 confirmed into loyalty_points at session end.
        test_recipe:
          setup:
            - "Venue, Bay, Member(PLATINUM) with wallet 50000."
            - "PEAK 60-min weekday HOLD reservation, net quote 6800; CONFIRMED via WALLET -> pending_loyalty_points=68."
            - "GameSession started on the reservation, then ENDED -> loyalty_points=102, pending cleared."
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "Range B", bay_count: 2, base_rate_cents_per_half_hour: 2500 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "plat@x.com", full_name: "Plat", tier: "PLATINUM" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/members/${m_id}/wallet/topup"
              payload: { amount_cents: 50000 }
              as: RangeManager
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", time_band: "PEAK", day_type: "WEEKDAY", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id, quote: $.data.quoted_price_cents }
            - call: "POST /golf/reservations/${res_id}/confirm"
              payload: { expected_bay_version: "${bay_v}" }
              as: Guest
              as_user_id: "${m_id}"
            - call: "POST /golf/sessions"
              payload: { bay_id: "${bay_id}", member_id: "${m_id}", reservation_id: "${res_id}" }
              as: FrontDesk
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /golf/sessions/${sess_id}/end"
              payload: {}
              as: FrontDesk
          assert:
            - "Reservation.${res_id}.quoted_price_cents == 6800"
            - "Member.${m_id}.pending_loyalty_points == 0"
            - "Member.${m_id}.loyalty_points == 102"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dynamic_bay_price_nonlinear_three_input_with_clamp
        grounds:
          - calculations.DYNAMIC_BAY_PRICE
          - entities.Reservation.fields.quoted_price_cents
          - entities.Venue.fields.peak_demand_factor
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — band_mult * day_factor *
          peak_demand_factor clamped by max(0.80, min(2.00, raw)). With PEAK*WEEKEND*1.0
          raw=2.00 (exactly at ceiling), gross=2500*2*2.00=10000, STANDARD disc 0 -> 10000.
        test_recipe:
          setup:
            - "Venue with peak_demand_factor=1.0, base 2500; one Bay; STANDARD Member."
            - "PEAK + WEEKEND 60-min HOLD reservation -> eff_mult clamped to 2.00, quote 10000."
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "Range C", bay_count: 2, base_rate_cents_per_half_hour: 2500, peak_demand_factor: 1.0 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "std@x.com", full_name: "Std", tier: "STANDARD" }
              as: RangeManager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-06T18:00:00Z", end_utc: "2026-06-06T19:00:00Z", time_band: "PEAK", day_type: "WEEKEND" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id, quote: $.data.quoted_price_cents }
          assert:
            - "Reservation.${res_id}.quoted_price_cents == 10000"

      - name: fb_tab_total_nested_rounding_order_gratuity_before_tax
        grounds:
          - calculations.FB_TAB_TOTAL
          - entities.FBTab.fields.gratuity_cents
          - entities.FBTab.fields.tax_cents
          - entities.FBTab.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — gratuity is rounded on the
          full subtotal (4099 -> 738) BEFORE tax is computed on (subtotal+gratuity)
          and rounded (4837 -> 399); total 5236. Tax-on-subtotal-then-add-gratuity
          would differ, so the order is pinned.
        test_recipe:
          setup:
            - "A walk-in GameSession exists; an OPEN FBTab attached to it."
            - "Three line items appended: 1299, 1850, 950 (qty 1 each)."
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "Range D", bay_count: 1 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "fb@x.com", full_name: "FB" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/sessions"
              payload: { bay_id: "${bay_id}", member_id: "${m_id}" }
              as: FrontDesk
              captures: { sess_id: $.data.id }
            - call: "POST /golf/fb-tabs"
              payload: { session_id: "${sess_id}" }
              as: FrontDesk
              captures: { tab_id: $.data.id }
            - call: "POST /golf/fb-tabs/${tab_id}/items"
              payload: { name: "Burger", unit_price_cents: 1299, qty: 1 }
              as: FrontDesk
            - call: "POST /golf/fb-tabs/${tab_id}/items"
              payload: { name: "Bottle", unit_price_cents: 1850, qty: 1 }
              as: FrontDesk
          trigger:
            - call: "POST /golf/fb-tabs/${tab_id}/items"
              payload: { name: "Fries", unit_price_cents: 950, qty: 1 }
              as: FrontDesk
              captures: { total: $.data.total_cents }
          assert:
            - "FBTab.${tab_id}.subtotal_cents == 4099"
            - "FBTab.${tab_id}.gratuity_cents == 738"
            - "FBTab.${tab_id}.tax_cents == 399"
            - "FBTab.${tab_id}.total_cents == 5236"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_branches_hold_to_three_terminals
        grounds:
          - state_machines.Reservation.HOLD_to_CONFIRMED
          - state_machines.Reservation.HOLD_to_EXPIRED
          - state_machines.Reservation.HOLD_to_CANCELLED
        distinguishing_aspect: |
          Branching on the Reservation entity: a single HOLD state forks to three
          divergent terminals (CONFIRMED via confirm, EXPIRED via sweep, CANCELLED
          via cancel), each with a different side-effect set. Confirming creates a
          charge; expiry/cancel create none.
        test_recipe:
          setup:
            - "Venue+Bay+Member(wallet 50000). Two HOLD reservations A and B on the same bay, non-overlapping windows."
            - "Reservation A is CONFIRMED (charge created). Clock advanced past B's hold_expires_utc."
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "Range E", bay_count: 1 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "br@x.com", full_name: "Br" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/members/${m_id}/wallet/topup"
              payload: { amount_cents: 50000 }
              as: RangeManager
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", time_band: "OFFPEAK", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_a: $.data.id }
            - call: "POST /golf/reservations/${res_a}/confirm"
              payload: { expected_bay_version: "${bay_v}" }
              as: Guest
              as_user_id: "${m_id}"
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-02T20:00:00Z", end_utc: "2026-06-02T21:00:00Z", time_band: "OFFPEAK", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_b: $.data.id }
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T13:00:00Z" }
              as: RangeManager
          trigger:
            - call: "POST /golf/venues/${venue_id}/sweep_holds"
              payload: {}
              as: RangeManager
          assert:
            - "Reservation.${res_a}.status == CONFIRMED"
            - "Reservation.${res_a}.charge_id is not null"
            - "Reservation.${res_b}.status == EXPIRED"
            - "Reservation.${res_b}.charge_id is null"

      - name: event_package_cycles_quoted_negotiating_quoted
        grounds:
          - state_machines.EventPackage.QUOTED_to_NEGOTIATING
          - state_machines.EventPackage.NEGOTIATING_to_QUOTED
          - entities.EventPackage.fields.estimated_total_cents
        distinguishing_aspect: |
          Cyclic loop on the EventPackage entity (different entity from Reservation):
          QUOTED -> NEGOTIATING -> QUOTED via negotiate then PATCH; the PATCH revision
          recomputes estimated_total_cents (from 145000 with est=20 to 130000 with est=20
          per_head=5750: 20*5750+15000=130000) proving the loop re-runs pricing.
        test_recipe:
          setup:
            - "Venue + organizer Member. EventPackage QUOTED est=20 per_head=6500 -> estimated 145000."
            - "Package moved to NEGOTIATING."
          setup_api_calls:
            - call: "POST /golf/venues"
              payload: { name: "Range F", bay_count: 4 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "org2@x.com", full_name: "Org2" }
              as: RangeManager
              captures: { org_id: $.data.id }
            - call: "POST /golf/event-packages"
              payload: { venue_id: "${venue_id}", organizer_member_id: "${org_id}", headcount_estimate: 20, per_head_package_cents: 6500, bay_block_cents: 15000 }
              as: RangeManager
              captures: { ep_id: $.data.id }
            - call: "POST /golf/event-packages/${ep_id}/negotiate"
              payload: {}
              as: RangeManager
          trigger:
            - call: "PATCH /golf/event-packages/${ep_id}"
              payload: { per_head_package_cents: 5750 }
              as: RangeManager
              captures: { est2: $.data.estimated_total_cents }
          assert:
            - "EventPackage.${ep_id}.status == QUOTED"
            - "EventPackage.${ep_id}.estimated_total_cents == 130000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: seat_next_cascade_ticket_seated_card_decrement_card_depleted
        grounds:
          - state_machines.QueueTicket.WAITING_to_SEATED
          - entities.GameCard.fields.credits_remaining
          - entities.GameCard.fields.status
          - entities.Bay.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by seat_next: QueueTicket WAITING->SEATED (link1)
          decrements GameCard.credits_remaining 1->0 (link2 caused by the seating);
          that decrement reaching 0 flips GameCard.status ACTIVE->DEPLETED (link3 caused
          by the decrement). Each link is caused by the previous, not by seat_next directly.
        test_recipe:
          setup:
            - "Venue with 1 AVAILABLE bay. Member with a 1-credit ACTIVE GameCard."
            - "One WAITING QueueTicket (position 1) for that member carrying the game_card_id."
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "Range G", bay_count: 1 }
              as: RangeManager
              captures: { venue_id: $.data.id, venue_v: $.data.version }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "wi@x.com", full_name: "WalkIn" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/game-cards"
              payload: { member_id: "${m_id}", credits_total: 1 }
              as: RangeManager
              captures: { card_id: $.data.id }
            - call: "POST /golf/queue-tickets"
              payload: { venue_id: "${venue_id}", member_id: "${m_id}", game_card_id: "${card_id}", party_size: 2 }
              as: Guest
              as_user_id: "${m_id}"
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /golf/venues/${venue_id}/seat_next"
              payload: { expected_venue_version: "${venue_v}" }
              as: FrontDesk
          assert:
            - "QueueTicket.${tk_id}.status == SEATED"
            - "GameCard.${card_id}.credits_remaining == 0"
            - "GameCard.${card_id}.status == DEPLETED"
            - "Bay.${bay_id}.status == OCCUPIED"

      - name: session_end_cascade_bay_freed_then_loyalty_confirmed
        grounds:
          - state_machines.GameSession.OPEN_to_ENDED
          - entities.Bay.fields.status
          - entities.Member.fields.loyalty_points
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (session end, not seat_next):
          GameSession OPEN->ENDED (link1) frees the occupied Bay OCCUPIED->AVAILABLE
          (link2 caused by ending) and the same end transition confirms loyalty
          EARN_FINAL into Member.loyalty_points. Distinct propagation pattern from the
          seat_next cascade.
        test_recipe:
          setup:
            - "Venue+Bay+Member(PLATINUM, wallet 50000). PEAK 60-min reservation confirmed via WALLET (pending 68)."
            - "GameSession started on the reservation (Bay OCCUPIED)."
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "Range H", bay_count: 1 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "se@x.com", full_name: "SE", tier: "PLATINUM" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/members/${m_id}/wallet/topup"
              payload: { amount_cents: 50000 }
              as: RangeManager
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", time_band: "PEAK", day_type: "WEEKDAY", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /golf/reservations/${res_id}/confirm"
              payload: { expected_bay_version: "${bay_v}" }
              as: Guest
              as_user_id: "${m_id}"
            - call: "POST /golf/sessions"
              payload: { bay_id: "${bay_id}", member_id: "${m_id}", reservation_id: "${res_id}" }
              as: FrontDesk
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /golf/sessions/${sess_id}/end"
              payload: {}
              as: FrontDesk
          assert:
            - "GameSession.${sess_id}.play_status == ENDED"
            - "Bay.${bay_id}.status == AVAILABLE"
            - "Member.${m_id}.loyalty_points == 102"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_confirm_terminal_reservation
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair state (priority 6, ERR_INVALID_STATE) vs business_temporal
          (priority 7, ERR_BAY_WINDOW_CONFLICT): confirming an already-CANCELLED
          reservation whose window also collides with a CONFIRMED reservation returns
          ERR_INVALID_STATE (the higher-priority state check), not the overlap error.
        test_recipe:
          setup:
            - "Venue+Bay+Member(wallet 50000). Reservation X CONFIRMED for window W. Reservation Y created on same bay overlapping W, then Y CANCELLED while HOLD."
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "Range I", bay_count: 1 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "pc@x.com", full_name: "PC" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/members/${m_id}/wallet/topup"
              payload: { amount_cents: 50000 }
              as: RangeManager
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", time_band: "OFFPEAK", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_x: $.data.id }
            - call: "POST /golf/reservations/${res_x}/confirm"
              payload: { expected_bay_version: "${bay_v}" }
              as: Guest
              as_user_id: "${m_id}"
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-02T18:30:00Z", end_utc: "2026-06-02T19:30:00Z", time_band: "OFFPEAK", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_y: $.data.id }
            - call: "POST /golf/reservations/${res_y}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /golf/reservations/${res_y}/confirm"
