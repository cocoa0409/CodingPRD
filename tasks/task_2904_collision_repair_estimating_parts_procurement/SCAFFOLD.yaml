scenario: |
  2904. Collision Repair Estimating & Parts Procurement (collision repair facility): damage analysis
  with teardown, blueprinting and supplement identification before repair begins, estimate construction
  using labor time guides, refinish formulas and not-included operations, parts type selection across
  original equipment, aftermarket, recycled and reconditioned with insurer policy and customer consent,
  parts ordering, pricing negotiation and return of unused or incorrect parts, repair procedure research
  and adherence documentation including calibration requirements for driver assistance systems, cycle
  time management across repair stages with parts delay tracking, insurer supplement approval and
  customer pay portions, post-repair quality control, scan verification and warranty
domain_name: collision-repair-estimating
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: hybrid
  # RepairOrder is the aggregate root of a shallow tree (DamageLine, EstimateLine, Supplement,
  # ProcedureRecord, StageAssignment, QcInspection, PartsDelayEvent) while PartsVendor, Stall,
  # CalibrationBay, Insurer and Customer are cross-cutting peers referenced from inside the tree.
  # Children are addressed flat at the URL root (`/estimate-lines/{id}`, `/parts-lines/{id}`) and
  # created under their parent, so the shape is a tree plus cross-aggregate references.

  state_machine_shape: parallel
  # RepairOrder carries two independent dimensions (stage x authorization_posture) and PartsLine
  # carries two (procurement_status x authorization_status). Both dimensions on RepairOrder.stage
  # include a rework cycle (QC_FAILED -> REPAIR) and a divergent branch (BLUEPRINTED -> TOTAL_LOSS);
  # Supplement.status is cyclic (SUBMITTED -> INFO_REQUESTED -> SUBMITTED) and PartsLine's
  # procurement dimension is cyclic (QUOTED -> COUNTERED -> QUOTED).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The Estimator who stamps the blueprint may never be the QcInspector who signs the post-repair
  # inspection on the same RepairOrder (compared on X-User-ID). Insurer and Customer are
  # entity-backed outside actors; ShopAdmin / Estimator / PartsManager / Technician / QcInspector
  # are opaque shop operators with non-overlapping exclusive operations.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Expert band per SKILL.md 0.4 with additional density: 14 entities, 56 endpoints, 9 calculations
  # (4 carrying divergent variants), 8 state dimensions across 7 entities, and 2 optimistic
  # concurrency rules guarding the RepairOrder aggregate root.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Customer
    parent: null
    common_fields: false
    # Immutable vehicle-owner registry row: no update endpoint, no version field.
    fields:
      - name: full_name
        type: string
        source: input
        description: vehicle owner legal name
      - name: phone
        type: string
        source: input
        description: contact phone
      - name: email
        type: string
        source: input
        description: contact email
      - name: preferred_alternate_parts_ok
        type: boolean
        source: input
        default: false
        description: >-
          standing written preference authorising non-OEM parts; when true a PartsLine that would
          otherwise land in PENDING_CONSENT is created already CUSTOMER_CONSENTED
        constraints: "true | false"

  - name: Insurer
    parent: null
    common_fields: true
    # Configuration entity: the insurer program whose policy gates part types, labor rates,
    # parts price ceilings and supplement negotiation rounds.
    fields:
      - name: insurer_code
        type: string
        source: input
        description: short program code, unique across Insurer
        constraints: "unique; 3-16 chars"
      - name: name
        type: string
        source: input
        description: insurer display name
      - name: aftermarket_allowed
        type: boolean
        source: input
        default: true
        description: policy permits AFTERMARKET parts at all
      - name: recycled_allowed
        type: boolean
        source: input
        default: true
        description: policy permits RECYCLED parts at all
      - name: reconditioned_allowed
        type: boolean
        source: input
        default: false
        description: policy permits RECONDITIONED parts at all
      - name: alternate_parts_min_vehicle_age_years
        type: integer
        source: input
        default: 3
        description: >-
          minimum vehicle age in whole years (logical-clock calendar year minus
          RepairOrder.vehicle_model_year) at which a policy-permitted alternate part becomes
          INSURER_ALLOWED without customer consent
        constraints: ">= 0"
      - name: rate_ceiling_cents
        type: object
        source: input
        description: >-
          per-labor_type hourly ceiling in cents, keys BODY / FRAME / REFINISH / MECHANICAL /
          ALUMINUM_BODY; every key required
      - name: parts_price_ceiling_pct
        type: number
        source: input
        default: 1.1
        description: max multiple of PartsLine.list_price_cents the insurer will pay per unit
        constraints: ">= 1.0"
      - name: supplement_round_limit
        type: integer
        source: input
        default: 3
        description: maximum Supplement.round_count reachable by resubmission
        constraints: ">= 1"

  - name: RepairOrder
    parent: null
    common_fields: true
    # Aggregate root. Two parallel state dimensions: `stage` (repair workflow) and
    # `authorization_posture` (derived money/consent gate). OCC parent for both concurrency rules.
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the vehicle owner, and the Customer role's ownership key"
      - name: insurer_id
        type: string
        source: input
        description: "FK -> Insurer.id; the paying program, and the InsurerAdjuster role's ownership key"
      - name: claim_number
        type: string
        source: input
        description: insurer claim number; used verbatim inside the warranty certificate number
      - name: vehicle_vin
        type: string
        source: input
        description: 17-character VIN
      - name: vehicle_model_year
        type: integer
        source: input
        description: model year, drives vehicle age for the insurer alternate-parts policy
        constraints: "1980 <= value <= 2100"
      - name: vehicle_make_model
        type: string
        source: input
        description: make and model text
      - name: initial_authorized_cents
        type: integer
        source: input
        description: insurer authorisation granted at first notice of loss
        constraints: ">= 0"
      - name: deductible_cents
        type: integer
        source: input
        default: 50000
        description: customer deductible, always part of customer_pay_cents
        constraints: ">= 0"
      - name: checkin_at
        type: datetime
        source: system
        description: logical clock at creation; start of the cycle-time window
      - name: delivered_at
        type: datetime
        source: system
        description: logical clock when stage became DELIVERED; null before that
      - name: stage
        type: enum
        source: system
        default: INTAKE
        description: repair workflow dimension
        constraints: "INTAKE | TEARDOWN | BLUEPRINTED | ESTIMATE_LOCKED | PARTS_STAGED | REPAIR | REFINISH_CALIBRATION | READY_FOR_QC | QC_FAILED | DELIVERED | TOTAL_LOSS"
      - name: authorization_posture
        type: enum
        source: computed
        default: OPEN
        description: derived money/consent gate recomputed by calculations.authorization_posture_derivation
        constraints: "OPEN | SUPPLEMENT_PENDING | CONSENT_REQUIRED"
      - name: blueprint_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the Estimator who ran blueprint; segregation-of-duties key
      - name: total_loss_note
        type: string
        source: system
        description: note captured when the order branched to TOTAL_LOSS; null otherwise
      - name: teardown_finding_count
        type: integer
        source: computed
        default: 0
        description: count of DamageLine rows on this order
      - name: refinish_hours_provisional
        type: number
        source: computed
        default: 0
        description: PROVISIONAL variant of calculations.refinish_labor_allocation, 1 decimal
      - name: refinish_hours_final
        type: number
        source: computed
        default: 0
        description: FINAL variant of calculations.refinish_labor_allocation, 1 decimal
      - name: approved_labor_hours
        type: number
        source: computed
        default: 0
        description: sum of EstimateLine.allocated_hours over APPROVED lines, 1 decimal
      - name: labor_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: step 1 of calculations.estimate_totals
      - name: parts_gross_cents
        type: integer
        source: computed
        default: 0
        description: step 2 of calculations.estimate_totals
      - name: parts_discount_cents
        type: integer
        source: computed
        default: 0
        description: step 3 of calculations.estimate_totals
      - name: parts_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: step 3 of calculations.estimate_totals, parts_gross_cents minus parts_discount_cents
      - name: betterment_cents
        type: integer
        source: computed
        default: 0
        description: step 4 of calculations.estimate_totals, customer-pay OEM upgrade share
      - name: supplies_fee_cents
        type: integer
        source: computed
        default: 0
        description: step 5 of calculations.estimate_totals, capped shop-supplies fee
      - name: pre_tax_total_cents
        type: integer
        source: computed
        default: 0
        description: step 6 of calculations.estimate_totals
      - name: insurer_authorized_cents
        type: integer
        source: computed
        default: 0
        description: step 7 of calculations.estimate_totals, initial authorisation plus approved supplements
      - name: customer_pay_cents
        type: integer
        source: computed
        default: 0
        description: step 8 of calculations.estimate_totals, the customer's portion
      - name: consent_state
        type: enum
        source: system
        default: NONE
        description: latest customer consent decision recorded against consent_basis_cents
        constraints: "NONE | CONSENTED | DECLINED"
      - name: consent_basis_cents
        type: integer
        source: system
        description: customer_pay_cents at the instant consent was recorded; null while consent_state is NONE
      - name: consent_alternate_parts
        type: boolean
        source: system
        default: false
        description: whether the recorded consent authorised non-OEM parts
      - name: parts_ordered_gross_cents
        type: integer
        source: system
        default: 0
        description: >-
          cumulative unit_extended_cents * qty added at every successful parts order; never
          decremented, so it is the conserved quantity of calculations.parts_commitment_ledger
      - name: parts_committed_cents
        type: integer
        source: computed
        default: 0
        description: sum of PartsLine.extended_price_cents over ORDERED / RECEIVED / INSTALLED lines
      - name: parts_return_credit_cents
        type: integer
        source: computed
        default: 0
        description: cumulative credit expected back from vendors for returned units, net of restocking
      - name: parts_restocking_loss_cents
        type: integer
        source: computed
        default: 0
        description: cumulative restocking fees absorbed on returns
      - name: open_parts_delay_count
        type: integer
        source: computed
        default: 0
        description: count of PartsDelayEvent rows on this order with closed_at null
      - name: qc_inspection_count
        type: integer
        source: computed
        default: 0
        description: count of QcInspection rows on this order; feeds the warranty certificate number

  - name: DamageLine
    parent: RepairOrder
    common_fields: false
    # Append-only teardown finding. Immutable: no update endpoint, no version field.
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the order the finding belongs to (from the path)"
      - name: panel_code
        type: string
        source: input
        description: panel or component code, e.g. L_FRONT_DOOR
      - name: severity
        type: enum
        source: input
        description: teardown severity assessment
        constraints: "LIGHT | MODERATE | SEVERE"
      - name: requires_blend
        type: boolean
        source: input
        default: false
        description: adjacent panel will need a refinish blend
      - name: adas_component_touched
        type: boolean
        source: input
        default: false
        description: >-
          finding disturbs a driver-assistance sensor/bracket; blueprint is blocked until an ADAS
          ProcedureRecord requiring calibration exists on the order
      - name: structural
        type: boolean
        source: input
        default: false
        description: finding is on a structural member
      - name: discovered_at_stage
        type: enum
        source: system
        description: >-
          RepairOrder.stage at the instant the finding was recorded; findings discovered after
          BLUEPRINTED are hidden damage and force supplement-backed estimate lines
        constraints: "TEARDOWN | BLUEPRINTED | ESTIMATE_LOCKED | PARTS_STAGED | REPAIR | REFINISH_CALIBRATION | READY_FOR_QC | QC_FAILED"

  - name: EstimateLine
    parent: RepairOrder
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the order being estimated (from the path)"
      - name: damage_line_id
        type: string
        source: input
        description: "FK -> DamageLine.id; the teardown finding this operation answers; null for lines with no finding"
      - name: supplement_id
        type: string
        source: input
        description: "FK -> Supplement.id; required for lines created after ESTIMATE_LOCKED, null otherwise"
      - name: operation_code
        type: string
        source: input
        description: labor time guide operation code; final tie-break key of the refinish ordering
      - name: labor_type
        type: enum
        source: input
        description: rate family for this operation
        constraints: "BODY | FRAME | REFINISH | MECHANICAL | ALUMINUM_BODY"
      - name: guide_hours
        type: number
        source: input
        description: labor time guide hours before refinish overlap/blend adjustment
        constraints: "> 0; at most 1 decimal"
      - name: not_included_operation
        type: boolean
        source: input
        default: false
        description: operation is not included in the guide time and must carry justification_note
      - name: justification_note
        type: string
        source: input
        description: written justification, mandatory when not_included_operation is true
      - name: is_blend
        type: boolean
        source: input
        default: false
        description: refinish line is a blend into an adjacent panel rather than a full refinish
      - name: is_adjacent_panel
        type: boolean
        source: input
        default: false
        description: refinish line is on a panel adjacent to the major panel and takes the overlap deduction
      - name: two_stage
        type: boolean
        source: input
        default: false
        description: colour needs a two-stage / clearcoat application
      - name: pay_type
        type: enum
        source: input
        default: INSURER
        description: >-
          who pays this line; INSURER lines are rate-capped by Insurer.rate_ceiling_cents, CUSTOMER
          lines bill the shop posted rate
        constraints: "INSURER | CUSTOMER"
      - name: allocated_hours
        type: number
        source: computed
        description: >-
          billable hours after calculations.refinish_labor_allocation FINAL allocation for REFINISH
          lines (including the clearcoat adder on the major line); equals guide_hours otherwise
      - name: effective_rate_cents
        type: integer
        source: computed
        description: hourly rate actually applied, per step 1 of calculations.estimate_totals
      - name: line_amount_cents
        type: integer
        source: computed
        description: round_half_up(allocated_hours * effective_rate_cents), the per-line rounded amount
      - name: line_status
        type: enum
        source: system
        default: DRAFT
        description: >-
          DRAFT before estimate lock, PENDING_SUPPLEMENT for post-lock lines awaiting an insurer
          decision, APPROVED once counted in the totals, REJECTED when its supplement was denied,
          VOID when the order branched to TOTAL_LOSS
        constraints: "DRAFT | PENDING_SUPPLEMENT | APPROVED | REJECTED | VOID"

  - name: Supplement
    parent: RepairOrder
    common_fields: true
    # Cyclic negotiation entity: SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded by
    # Insurer.supplement_round_limit.
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the order the supplement amends (from the path)"
      - name: reason_code
        type: enum
        source: input
        description: why the supplement is needed
        constraints: "HIDDEN_DAMAGE | PROCEDURE_REQUIREMENT | PARTS_PRICE_VARIANCE | CALIBRATION_REQUIRED"
      - name: requested_amount_cents
        type: integer
        source: input
        description: additional authorisation requested from the insurer
        constraints: "> 0"
      - name: approved_amount_cents
        type: integer
        source: system
        description: authorisation actually granted; null until decided, 0 when DENIED
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: negotiation state
        constraints: "SUBMITTED | INFO_REQUESTED | APPROVED | PARTIAL | DENIED"
      - name: round_count
        type: integer
        source: system
        default: 1
        description: negotiation round; incremented by every resubmission
      - name: submitted_at
        type: datetime
        source: system
        description: logical clock of the latest submission; start of the supplement wait interval
      - name: decided_at
        type: datetime
        source: system
        description: logical clock of the terminal decision; null while pending
      - name: info_request_note
        type: string
        source: system
        description: adjuster note captured with a REQUEST_INFO decision
      - name: adjuster_note
        type: string
        source: system
        description: adjuster note captured with an APPROVE / PARTIAL / DENY decision

  - name: PartsVendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: supplier name
      - name: vendor_type
        type: enum
        source: input
        description: supplier channel
        constraints: "OEM_DEALER | AFTERMARKET_DISTRIBUTOR | RECYCLER | RECONDITIONER"
      - name: part_types_offered
        type: array
        source: input
        description: part types this supplier can quote; array of OEM / AFTERMARKET / RECYCLED / RECONDITIONED
        constraints: "non-empty; members unique"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: >-
          supply-agreement standing; quotes may be recorded against a SUSPENDED vendor but orders
          may not be placed with one
        constraints: "ACTIVE | SUSPENDED"
      - name: discount_pct
        type: number
        source: input
        default: 0
        description: fractional discount off the quoted unit price, applied per unit before rounding
        constraints: "0 <= value < 1"
      - name: core_charge_cents
        type: integer
        source: input
        default: 0
        description: per-unit core charge added after the discount rounding (recycled/reconditioned cores)
        constraints: ">= 0"
      - name: restocking_fee_pct
        type: number
        source: input
        default: 0.2
        description: fractional restocking fee charged on returned units
        constraints: "0 <= value <= 1"
      - name: max_qty_per_line
        type: integer
        source: input
        default: 4
        description: maximum qty this supplier accepts on a single parts line order
        constraints: ">= 1"
      - name: order_seq_counter
        type: integer
        source: system
        default: 0
        description: >-
          monotonic per-vendor counter incremented on every successful order; stamped onto
          PartsLine.vendor_order_seq so the fulfilment-score window is deterministic without clocks
      - name: fulfillment_score_rolling
        type: number
        source: computed
        default: 50
        description: ROLLING variant of calculations.vendor_fulfillment_score, integer-valued 0-100
      - name: fulfillment_score_lifetime
        type: number
        source: computed
        default: 50
        description: LIFETIME variant of calculations.vendor_fulfillment_score, integer-valued 0-100

  - name: PartsLine
    parent: EstimateLine
    common_fields: true
    # Two parallel dimensions: procurement_status (cyclic through price negotiation) and
    # authorization_status (insurer policy x customer consent).
    fields:
      - name: estimate_line_id
        type: string
        source: input
        description: "FK -> EstimateLine.id; the operation this part belongs to (from the path)"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> PartsVendor.id; set from the accepted quote, null before that"
      - name: part_number
        type: string
        source: input
        description: supplier part number
      - name: part_description
        type: string
        source: input
        description: part description text
      - name: part_type
        type: enum
        source: input
        description: sourcing category chosen during parts selection
        constraints: "OEM | AFTERMARKET | RECYCLED | RECONDITIONED"
      - name: list_price_cents
        type: integer
        source: input
        description: OEM list price per unit; basis of the insurer parts price ceiling
        constraints: "> 0"
      - name: qty
        type: integer
        source: input
        description: units required
        constraints: ">= 1"
      - name: oem_upgrade
        type: boolean
        source: input
        default: false
        description: >-
          OEM part chosen after the customer declined a policy-permitted alternate; the customer pays
          BETTERMENT_PCT of the line. Only valid when part_type is OEM
      - name: quoted_unit_price_cents
        type: integer
        source: system
        description: current vendor quote per unit; null until the first quote is recorded
      - name: counter_unit_price_cents
        type: integer
        source: system
        description: shop counter-offer per unit; null unless a counter is outstanding
      - name: unit_price_cents
        type: integer
        source: system
        description: agreed unit price, frozen when the quote is accepted; null before that
      - name: quote_round
        type: integer
        source: system
        default: 0
        description: number of vendor quotes recorded on this line; 1 means accepted first round
      - name: unit_extended_cents
        type: integer
        source: computed
        description: round_half_up(unit_price_cents * (1 - vendor.discount_pct)) + vendor.core_charge_cents
      - name: extended_price_cents
        type: integer
        source: computed
        default: 0
        description: unit_extended_cents * (qty - returned_qty)
      - name: restocking_fee_cents
        type: integer
        source: computed
        default: 0
        description: round_half_up(unit_extended_cents * returned_qty * vendor.restocking_fee_pct)
      - name: procurement_status
        type: enum
        source: system
        default: PLANNED
        description: procurement dimension, cyclic between QUOTED and COUNTERED during negotiation
        constraints: "PLANNED | QUOTED | COUNTERED | PRICE_LOCKED | ORDERED | RECEIVED | INSTALLED | RETURNED | VOID"
      - name: authorization_status
        type: enum
        source: computed
        description: >-
          money-authorisation dimension decided at creation from insurer policy, vehicle age and the
          customer's standing preference, then moved by the customer's consent decision
        constraints: "INSURER_ALLOWED | PENDING_CONSENT | CUSTOMER_CONSENTED | CUSTOMER_DECLINED"
      - name: vendor_order_seq
        type: integer
        source: system
        description: PartsVendor.order_seq_counter value stamped at order time; null before ordering
      - name: promised_eta
        type: datetime
        source: system
        description: supplier promised arrival recorded at order time
      - name: received_at
        type: datetime
        source: system
        description: logical clock when the part was received; null before that
      - name: received_qty
        type: integer
        source: system
        default: 0
        description: units received
      - name: returned_qty
        type: integer
        source: system
        default: 0
        description: units returned to the supplier
      - name: return_reason
        type: enum
        source: system
        description: why units went back; null when nothing was returned
        constraints: "UNUSED | INCORRECT | DAMAGED"
      - name: on_time
        type: boolean
        source: computed
        description: received_at <= promised_eta; null until received

  - name: ProcedureRecord
    parent: RepairOrder
    common_fields: true
    # Repair procedure research plus, when the procedure demands it, the ADAS calibration booking
    # that occupies a CalibrationBay window.
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the order the procedure applies to (from the path)"
      - name: bay_id
        type: string
        source: input
        description: "FK -> CalibrationBay.id; occupied bay, set when calibration is scheduled, null otherwise"
      - name: procedure_code
        type: string
        source: input
        description: OEM procedure document code
      - name: source
        type: enum
        source: input
        description: where the procedure was researched
        constraints: "OEM_PORTAL | ALLDATA | IREPAIR"
      - name: operation_scope
        type: enum
        source: input
        description: which repair area the procedure governs
        constraints: "STRUCTURAL | REFINISH | ADAS | MECHANICAL"
      - name: requires_calibration
        type: boolean
        source: input
        default: false
        description: procedure mandates a driver-assistance calibration
      - name: calibration_type
        type: enum
        source: input
        default: NONE
        description: calibration modality demanded by the procedure
        constraints: "NONE | STATIC | DYNAMIC | BOTH"
      - name: adherence_documented
        type: boolean
        source: system
        default: false
        description: technician recorded that the procedure was followed
      - name: adherence_doc_ref
        type: string
        source: system
        description: reference of the adherence documentation; null until documented
      - name: calibration_status
        type: enum
        source: computed
        description: >-
          NOT_REQUIRED when requires_calibration is false at creation, otherwise REQUIRED and then
          moved by scheduling and result recording; FAILED may be rescheduled
        constraints: "NOT_REQUIRED | REQUIRED | SCHEDULED | PASSED | FAILED"
      - name: window_start
        type: datetime
        source: system
        description: start of the booked bay window, half-open with window_end; null until scheduled
      - name: window_end
        type: datetime
        source: system
        description: exclusive end of the booked bay window; null until scheduled
      - name: post_scan_dtc_count
        type: integer
        source: system
        description: diagnostic trouble codes still active on the calibration scan; null until a result exists
      - name: scan_report_ref
        type: string
        source: system
        description: calibration scan report reference; null until a result exists

  - name: CalibrationBay
    parent: null
    common_fields: true
    # Aggregate-capacity resource: several static targets can be set up at once, so overlap is only
    # rejected once concurrent_capacity concurrent windows already exist. No buffer, adjacency allowed.
    fields:
      - name: name
        type: string
        source: input
        description: bay label
      - name: concurrent_capacity
        type: integer
        source: input
        default: 2
        description: number of calibrations that may overlap in this bay at any instant
        constraints: ">= 1"
      - name: supported_types
        type: array
        source: input
        description: calibration modalities this bay can host; array of STATIC / DYNAMIC / BOTH
        constraints: "non-empty; members unique"
      - name: scheduled_window_count
        type: integer
        source: computed
        default: 0
        description: count of ProcedureRecord rows on this bay with calibration_status SCHEDULED

  - name: Stall
    parent: null
    common_fields: true
    # Single-capacity resource with a mandatory cleanup buffer: an occupancy blocks its own window
    # plus cleanup_buffer_minutes on each side, so back-to-back bookings are rejected.
    fields:
      - name: name
        type: string
        source: input
        description: stall label
      - name: stall_type
        type: enum
        source: input
        description: >-
          work the stall supports; REPAIR assignments need BODY or FRAME, REFINISH_CALIBRATION
          assignments need PAINT
        constraints: "BODY | FRAME | PAINT"
      - name: cleanup_buffer_minutes
        type: integer
        source: input
        default: 30
        description: dead time reserved on both sides of every occupancy for masking/cleanup
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        default: AVAILABLE
        description: stall standing; MAINTENANCE stalls reject new assignments
        constraints: "AVAILABLE | MAINTENANCE"
      - name: booked_minutes
        type: integer
        source: computed
        default: 0
        description: >-
          conserved quantity of calculations.stall_occupancy_rollup - sum of
          StageAssignment.occupied_minutes over SCHEDULED and ACTIVE assignments on this stall

  - name: StageAssignment
    parent: RepairOrder
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the order occupying the stall (from the path)"
      - name: stall_id
        type: string
        source: input
        description: "FK -> Stall.id; the occupied stall"
      - name: stage
        type: enum
        source: input
        description: which repair stage this occupancy serves
        constraints: "REPAIR | REFINISH_CALIBRATION"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the occupancy
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the occupancy
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: >-
          SCHEDULED at creation, ACTIVE when the order enters the matching stage, COMPLETED when the
          order leaves it, CANCELLED when released
        constraints: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED"
      - name: occupied_minutes
        type: integer
        source: computed
        description: >-
          floor of the whole minutes between window_start and window_end, fixed at creation.
          Stall.cleanup_buffer_minutes is deliberately NOT included: the buffer only widens the
          conflict window checked at priority 67, it never inflates Stall.booked_minutes.

  - name: PartsDelayEvent
    parent: RepairOrder
    common_fields: false
    # Append-only cycle-time interruption log. Immutable apart from the system closing it.
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the delayed order"
      - name: parts_line_id
        type: string
        source: input
        description: "FK -> PartsLine.id; the line whose supply slipped"
      - name: reason
        type: enum
        source: system
        description: why the delay opened
        constraints: "ETA_BREACH | INCORRECT_PART"
      - name: opened_at
        type: datetime
        source: system
        description: logical clock when the delay was detected; start of the non-touch interval
      - name: closed_at
        type: datetime
        source: system
        description: logical clock when the part landed; null while the delay is open
      - name: delay_minutes
        type: integer
        source: computed
        description: whole minutes (floored) between opened_at and closed_at; null while open

  - name: QcInspection
    parent: RepairOrder
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the inspected order (from the path)"
      - name: inspector_user_id
        type: string
        source: system
        description: >-
          opaque X-User-ID of the QcInspector; must differ from RepairOrder.blueprint_by_user_id
      - name: sequence_number
        type: integer
        source: system
        description: 1-based inspection number on this order; part of the warranty certificate number
      - name: checklist_passed
        type: boolean
        source: input
        description: visual/mechanical checklist verdict
      - name: post_scan_dtc_count
        type: integer
        source: input
        description: diagnostic trouble codes still active on the post-repair scan
        constraints: ">= 0"
      - name: scan_report_ref
        type: string
        source: input
        description: post-repair scan report reference
      - name: result
        type: enum
        source: computed
        description: PASS only when checklist_passed is true and post_scan_dtc_count is 0
        constraints: "PASS | FAIL"
      - name: failure_reason
        type: enum
        source: system
        description: >-
          why the inspection failed, CHECKLIST taking precedence over DTC_PRESENT; null on PASS
        constraints: "CHECKLIST | DTC_PRESENT"
      - name: warranty_certificate_number
        type: string
        source: computed
        description: >-
          issued on PASS as "WC-" + RepairOrder.claim_number + "-" + sequence_number; null on FAIL
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: "logical clock of the PASS plus exactly 365 days (WARRANTY_DAYS = 365, no calendar or leap adjustment); null on FAIL"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: RepairOrder
    dimension: stage
    initial_state: INTAKE
    terminal_states: [DELIVERED, TOTAL_LOSS]
    note: >-
      Workflow dimension. Non-linear on three counts - the rework cycle QC_FAILED -> REPAIR, the
      divergent branch BLUEPRINTED -> {ESTIMATE_LOCKED, TOTAL_LOSS} with disjoint side-effect sets,
      and the involuntary rollback REFINISH_CALIBRATION/READY_FOR_QC -> REPAIR driven by a parts
      return. It evolves independently of the authorization_posture dimension on the same row.
    transitions:
      - from: INTAKE
        to: TEARDOWN
        trigger: "POST /repair-orders/{id}/teardown-findings (first finding on the order)"
        actor: Estimator
        preconditions:
          - "RepairOrder.stage == INTAKE"
        side_effects:
          - "creates DamageLine with discovered_at_stage = TEARDOWN"
          - "recomputes RepairOrder.teardown_finding_count"
          - "increments RepairOrder.version by 1"
        note: "Subsequent findings do not change stage; they only bump teardown_finding_count."
      - from: TEARDOWN
        to: BLUEPRINTED
        trigger: "POST /repair-orders/{id}/blueprint"
        actor: Estimator
        preconditions:
          - "RepairOrder.stage IN {INTAKE, TEARDOWN} (else ERR_STAGE_PRECONDITION) - an INTAKE order is admitted this far only so that the finding-count check below is the error the caller sees; it can never actually blueprint, because an order leaves INTAKE the moment its first finding is recorded"
          - "RepairOrder.teardown_finding_count >= 1 (else ERR_NO_TEARDOWN_FINDINGS) - the only refusal an INTAKE order can receive here"
          - "if any DamageLine on this order has adas_component_touched == true, at least one ProcedureRecord on this order has operation_scope == ADAS AND requires_calibration == true (else ERR_ADAS_PROCEDURE_RESEARCH_MISSING)"
        side_effects:
          - "stamps RepairOrder.blueprint_by_user_id = acting X-User-ID (segregation-of-duties key consumed at QC)"
          - "runs calculations.refinish_labor_allocation variant PROVISIONAL over EstimateLine rows with line_status == DRAFT and labor_type == REFINISH, writing RepairOrder.refinish_hours_provisional"
          - "runs calculations.authorization_posture_derivation"
          - "increments RepairOrder.version by 1"
      - from: BLUEPRINTED
        to: ESTIMATE_LOCKED
        trigger: "POST /repair-orders/{id}/estimate/lock"
        actor: Estimator
        preconditions:
          - "RepairOrder.stage == BLUEPRINTED"
          - "at least one EstimateLine with line_status == DRAFT (else ERR_NO_ESTIMATE_LINES)"
          - "every EstimateLine with line_status == DRAFT and not_included_operation == true has a non-null justification_note (else ERR_NOT_INCLUDED_JUSTIFICATION_MISSING)"
        side_effects:
          - "every EstimateLine with line_status == DRAFT becomes APPROVED"
          - "runs calculations.refinish_labor_allocation variant FINAL, writing EstimateLine.allocated_hours on every APPROVED refinish line and RepairOrder.refinish_hours_final"
          - "runs calculations.approved_labor_hours_rollup then calculations.estimate_totals in the pinned step order"
          - "runs calculations.authorization_posture_derivation"
          - "increments RepairOrder.version by 1 and each touched EstimateLine.version by 1"
      - from: BLUEPRINTED
        to: TOTAL_LOSS
        trigger: "POST /repair-orders/{id}/total-loss"
        actor: Estimator
        preconditions:
          - "RepairOrder.stage == BLUEPRINTED"
        side_effects:
          - "sets RepairOrder.total_loss_note"
          - "CASCADE hop 1: every EstimateLine with line_status IN {DRAFT, PENDING_SUPPLEMENT} becomes VOID and every PartsLine with procurement_status IN {PLANNED, QUOTED, COUNTERED, PRICE_LOCKED} becomes VOID"
          - "CASCADE hop 2 (caused by hop 1): calculations.approved_labor_hours_rollup and calculations.estimate_totals rerun over the shrunken line sets, so RepairOrder.approved_labor_hours, parts_gross_cents, pre_tax_total_cents and customer_pay_cents all change"
          - "CASCADE hop 3 (caused by hop 2): calculations.authorization_posture_derivation reruns on the new customer_pay_cents and returns authorization_posture to OPEN"
          - "every StageAssignment with status IN {SCHEDULED, ACTIVE} becomes CANCELLED, and each cancellation decrements its Stall.booked_minutes by that assignment's occupied_minutes"
          - "increments RepairOrder.version by 1"
        note: "Divergent branch: the ESTIMATE_LOCKED branch approves lines, this branch voids them."
      - from: ESTIMATE_LOCKED
        to: PARTS_STAGED
        trigger: "POST /repair-orders/{id}/stage-advance with to_stage = PARTS_STAGED"
        actor: Technician
        preconditions:
          - "RepairOrder.stage == ESTIMATE_LOCKED"
          - "RepairOrder.authorization_posture == OPEN (else ERR_AUTHORIZATION_POSTURE_BLOCKED)"
          - "no PartsLine on this order has procurement_status IN {PLANNED, QUOTED, COUNTERED, PRICE_LOCKED} (else ERR_PARTS_NOT_PROCURED)"
        side_effects:
          - "increments RepairOrder.version by 1"
      - from: PARTS_STAGED
        to: REPAIR
        trigger: "POST /repair-orders/{id}/stage-advance with to_stage = REPAIR"
        actor: Technician
        preconditions:
          - "RepairOrder.stage == PARTS_STAGED"
          - "RepairOrder.authorization_posture == OPEN (else ERR_AUTHORIZATION_POSTURE_BLOCKED)"
          - "at least one StageAssignment on this order with stage == REPAIR and status == SCHEDULED (else ERR_NO_STAGE_ASSIGNMENT)"
        side_effects:
          - "every StageAssignment on this order with stage == REPAIR and status == SCHEDULED becomes ACTIVE"
          - "increments RepairOrder.version by 1"
      - from: REPAIR
        to: REFINISH_CALIBRATION
        trigger: "POST /repair-orders/{id}/stage-advance with to_stage = REFINISH_CALIBRATION"
        actor: Technician
        preconditions:
          - "RepairOrder.stage == REPAIR"
          - "RepairOrder.authorization_posture == OPEN (else ERR_AUTHORIZATION_POSTURE_BLOCKED)"
          - "no PartsLine on this order has procurement_status IN {ORDERED, RECEIVED} (else ERR_PARTS_NOT_INSTALLED)"
          - "every ProcedureRecord on this order with operation_scope == STRUCTURAL has adherence_documented == true (else ERR_PROCEDURE_ADHERENCE_MISSING)"
          - "at least one StageAssignment on this order with stage == REFINISH_CALIBRATION and status == SCHEDULED (else ERR_NO_STAGE_ASSIGNMENT)"
        side_effects:
          - "every StageAssignment on this order with stage == REPAIR and status == ACTIVE becomes COMPLETED and its Stall.booked_minutes drops by that assignment's occupied_minutes"
          - "every StageAssignment on this order with stage == REFINISH_CALIBRATION and status == SCHEDULED becomes ACTIVE"
          - "increments RepairOrder.version by 1"
      - from: REFINISH_CALIBRATION
        to: READY_FOR_QC
        trigger: "POST /repair-orders/{id}/stage-advance with to_stage = READY_FOR_QC"
        actor: Technician
        preconditions:
          - "RepairOrder.stage == REFINISH_CALIBRATION"
          - "RepairOrder.authorization_posture == OPEN (else ERR_AUTHORIZATION_POSTURE_BLOCKED)"
          - "every ProcedureRecord on this order with calibration_status IN {REQUIRED, SCHEDULED, FAILED} is absent - i.e. every record that needs calibration is PASSED (else ERR_CALIBRATION_NOT_VERIFIED)"
          - "every ProcedureRecord on this order has adherence_documented == true (else ERR_PROCEDURE_ADHERENCE_MISSING)"
        side_effects:
          - "every StageAssignment on this order with status == ACTIVE becomes COMPLETED and its Stall.booked_minutes drops by that assignment's occupied_minutes"
          - "increments RepairOrder.version by 1"
      - from: READY_FOR_QC
        to: QC_FAILED
        trigger: "POST /repair-orders/{id}/qc-inspections resulting in QcInspection.result == FAIL (system transition)"
        actor: system
        preconditions:
          - "RepairOrder.stage == READY_FOR_QC"
          - "the created QcInspection has checklist_passed == false OR post_scan_dtc_count > 0"
        side_effects:
          - "sets QcInspection.result = FAIL and failure_reason (CHECKLIST takes precedence over DTC_PRESENT)"
          - "recomputes RepairOrder.qc_inspection_count"
          - "increments RepairOrder.version by 1"
      - from: QC_FAILED
        to: REPAIR
        trigger: "POST /repair-orders/{id}/stage-advance with to_stage = REPAIR"
        actor: Technician
        preconditions:
          - "RepairOrder.stage == QC_FAILED"
          - "RepairOrder.authorization_posture == OPEN (else ERR_AUTHORIZATION_POSTURE_BLOCKED)"
          - "at least one StageAssignment on this order with stage == REPAIR and status == SCHEDULED (else ERR_NO_STAGE_ASSIGNMENT)"
        side_effects:
          - "every StageAssignment on this order with stage == REPAIR and status == SCHEDULED becomes ACTIVE"
          - "increments RepairOrder.version by 1"
        note: "Rework cycle - the order re-enters REPAIR and must traverse the stages again."
      - from: READY_FOR_QC
        to: DELIVERED
        trigger: "POST /repair-orders/{id}/deliver"
        actor: ShopAdmin
        preconditions:
          - "RepairOrder.stage == READY_FOR_QC"
          - "RepairOrder.authorization_posture == OPEN (else ERR_AUTHORIZATION_POSTURE_BLOCKED)"
          - "the QcInspection on this order with the highest sequence_number has result == PASS (else ERR_QC_NOT_PASSED)"
          - "RepairOrder.open_parts_delay_count == 0 (else ERR_OPEN_PARTS_DELAY)"
        side_effects:
          - "sets RepairOrder.delivered_at = logical clock, freezing the cycle-time window"
          - "every StageAssignment with status IN {SCHEDULED, ACTIVE} becomes COMPLETED and its Stall.booked_minutes drops by that assignment's occupied_minutes"
          - "increments RepairOrder.version by 1"
      - from: REFINISH_CALIBRATION
        to: REPAIR
        trigger: "POST /parts-lines/{id}/return on a line of this order (system rollback)"
        actor: system
        preconditions:
          - "RepairOrder.stage IN {REFINISH_CALIBRATION, READY_FOR_QC}"
          - "the returned line's procurement_status was RECEIVED or INSTALLED before the return"
        side_effects:
          - "CASCADE hop 1 (caused by the return removing a staged part): RepairOrder.stage rolls back to REPAIR"
          - "CASCADE hop 2 (caused by hop 1): every StageAssignment on this order with stage == REFINISH_CALIBRATION and status == ACTIVE becomes CANCELLED"
          - "CASCADE hop 3 (caused by hop 2): each cancelled assignment's Stall.booked_minutes drops by that assignment's occupied_minutes, re-running calculations.stall_occupancy_rollup"
          - "increments RepairOrder.version by 1"
        note: >-
          Same rollback applies from READY_FOR_QC; the from-state set is {REFINISH_CALIBRATION,
          READY_FOR_QC} and the to-state is REPAIR in both cases.

  - entity: RepairOrder
    dimension: authorization_posture
    initial_state: OPEN
    terminal_states: []
    note: >-
      Money/consent dimension living on the same row as stage and evolving independently of it. Every
      transition is a system consequence of calculations.authorization_posture_derivation, which runs
      after any mutation that touches Supplement rows, EstimateLine statuses, PartsLine authorisation
      or prices, or the recorded consent. Precedence is pinned: CONSENT_REQUIRED beats
      SUPPLEMENT_PENDING beats OPEN.
    transitions:
      - from: OPEN
        to: SUPPLEMENT_PENDING
        trigger: "POST /repair-orders/{id}/supplements (system recompute)"
        actor: system
        preconditions:
          - "at least one Supplement on this order has status IN {SUBMITTED, INFO_REQUESTED}"
          - "the CONSENT_REQUIRED predicate is false"
        side_effects:
          - "blocks every POST /repair-orders/{id}/stage-advance and POST /repair-orders/{id}/deliver with ERR_AUTHORIZATION_POSTURE_BLOCKED while it holds"
      - from: SUPPLEMENT_PENDING
        to: OPEN
        trigger: "POST /supplements/{id}/decision with decision IN {APPROVE, PARTIAL, DENY} (system recompute)"
        actor: system
        preconditions:
          - "no Supplement on this order has status IN {SUBMITTED, INFO_REQUESTED}"
          - "the CONSENT_REQUIRED predicate is false"
        side_effects:
          - "re-enables stage advancement"
      - from: SUPPLEMENT_PENDING
        to: CONSENT_REQUIRED
        trigger: "POST /supplements/{id}/decision with decision IN {APPROVE, PARTIAL, DENY} (system recompute)"
        actor: system
        preconditions:
          - "no Supplement on this order has status IN {SUBMITTED, INFO_REQUESTED}"
          - "RepairOrder.customer_pay_cents >= CONSENT_THRESHOLD_CENTS and (consent_state != CONSENTED or consent_basis_cents < customer_pay_cents), OR at least one PartsLine on this order has authorization_status == PENDING_CONSENT"
        side_effects:
          - "if consent_state == CONSENTED and consent_basis_cents < customer_pay_cents, the stale consent is invalidated: consent_state -> NONE, consent_basis_cents -> null, consent_alternate_parts -> false"
          - "blocks stage advancement with ERR_AUTHORIZATION_POSTURE_BLOCKED"
      - from: OPEN
        to: CONSENT_REQUIRED
        trigger: "POST /estimate-lines/{id}/parts-lines creating a PENDING_CONSENT line, or POST /parts-lines/{id}/accept-price / POST /parts-lines/{id}/return re-running the totals (system recompute)"
        actor: system
        preconditions:
          - "RepairOrder.customer_pay_cents >= CONSENT_THRESHOLD_CENTS and (consent_state != CONSENTED or consent_basis_cents < customer_pay_cents), OR at least one PartsLine on this order has authorization_status == PENDING_CONSENT"
        side_effects:
          - "if consent_state == CONSENTED and consent_basis_cents < customer_pay_cents, the stale consent is invalidated: consent_state -> NONE, consent_basis_cents -> null"
          - "blocks stage advancement with ERR_AUTHORIZATION_POSTURE_BLOCKED"
      - from: CONSENT_REQUIRED
        to: OPEN
        trigger: "POST /repair-orders/{id}/consent-decisions with decision = CONSENT (system recompute)"
        actor: system
        preconditions:
          - "consent_state == CONSENTED and consent_basis_cents >= customer_pay_cents"
          - "no PartsLine on this order has authorization_status == PENDING_CONSENT"
          - "no Supplement on this order has status IN {SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "re-enables stage advancement"
      - from: CONSENT_REQUIRED
        to: SUPPLEMENT_PENDING
        trigger: "POST /repair-orders/{id}/consent-decisions with decision = CONSENT while a supplement is still open (system recompute)"
        actor: system
        preconditions:
          - "the CONSENT_REQUIRED predicate is false after the consent"
          - "at least one Supplement on this order has status IN {SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "stage advancement stays blocked, now for the supplement reason"
        note: >-
          A DECLINE decision does not leave CONSENT_REQUIRED: declining flips the pending parts lines
          to CUSTOMER_DECLINED but leaves customer_pay_cents at or above the threshold, so the order
          stays blocked until the estimate is reduced.

  - entity: Supplement
    initial_state: SUBMITTED
    terminal_states: [APPROVED, PARTIAL, DENIED]
    note: >-
      Cyclic negotiation between the shop and the adjuster: SUBMITTED -> INFO_REQUESTED -> SUBMITTED
      may repeat until round_count reaches Insurer.supplement_round_limit.
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /supplements/{id}/decision with decision = APPROVE"
        actor: InsurerAdjuster
        preconditions:
          - "Supplement.status == SUBMITTED (else ERR_SUPPLEMENT_NOT_OPEN)"
          - "acting X-User-ID == RepairOrder.insurer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "sets approved_amount_cents = requested_amount_cents, decided_at = logical clock, adjuster_note"
          - "CASCADE hop 1: every EstimateLine with supplement_id == this supplement and line_status == PENDING_SUPPLEMENT becomes APPROVED"
          - "CASCADE hop 2 (caused by hop 1): calculations.refinish_labor_allocation FINAL, calculations.approved_labor_hours_rollup and calculations.estimate_totals rerun, so RepairOrder.approved_labor_hours, labor_subtotal_cents, insurer_authorized_cents, pre_tax_total_cents and customer_pay_cents all move"
          - "CASCADE hop 3 (caused by hop 2): calculations.authorization_posture_derivation reruns on the new customer_pay_cents and may set authorization_posture = CONSENT_REQUIRED"
          - "CASCADE hop 4 (caused by hop 3): a previously recorded consent whose consent_basis_cents is now below customer_pay_cents is invalidated - consent_state -> NONE, consent_basis_cents -> null, consent_alternate_parts -> false"
          - "increments Supplement.version, each touched EstimateLine.version and RepairOrder.version by 1"
      - from: SUBMITTED
        to: PARTIAL
        trigger: "POST /supplements/{id}/decision with decision = PARTIAL"
        actor: InsurerAdjuster
        preconditions:
          - "Supplement.status == SUBMITTED (else ERR_SUPPLEMENT_NOT_OPEN)"
          - "acting X-User-ID == RepairOrder.insurer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "0 < approved_amount_cents < requested_amount_cents (else ERR_INVALID_PARTIAL_AMOUNT)"
        side_effects:
          - "sets approved_amount_cents to the adjuster's figure, decided_at = logical clock"
          - "every EstimateLine with supplement_id == this supplement and line_status == PENDING_SUPPLEMENT becomes APPROVED (the work is authorised, the money only partly)"
          - "calculations.approved_labor_hours_rollup, calculations.estimate_totals and calculations.authorization_posture_derivation rerun in that order; the shortfall lands in customer_pay_cents"
          - "increments Supplement.version, each touched EstimateLine.version and RepairOrder.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /supplements/{id}/decision with decision = DENY"
        actor: InsurerAdjuster
        preconditions:
          - "Supplement.status == SUBMITTED (else ERR_SUPPLEMENT_NOT_OPEN)"
          - "acting X-User-ID == RepairOrder.insurer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "sets approved_amount_cents = 0, decided_at = logical clock"
          - "COMPENSATION: every EstimateLine with supplement_id == this supplement and line_status == PENDING_SUPPLEMENT becomes REJECTED, so its allocated_hours leave the APPROVED input set"
          - "calculations.refinish_labor_allocation FINAL, calculations.approved_labor_hours_rollup and calculations.estimate_totals rerun, restoring RepairOrder.approved_labor_hours to the value it held before those lines were written"
          - "calculations.authorization_posture_derivation reruns"
          - "increments Supplement.version, each touched EstimateLine.version and RepairOrder.version by 1"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /supplements/{id}/decision with decision = REQUEST_INFO"
        actor: InsurerAdjuster
        preconditions:
          - "Supplement.status == SUBMITTED (else ERR_SUPPLEMENT_NOT_OPEN)"
          - "acting X-User-ID == RepairOrder.insurer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "note is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets info_request_note; decided_at stays null so the supplement wait interval keeps running for calculations.cycle_time_metrics"
          - "linked EstimateLine rows stay PENDING_SUPPLEMENT and RepairOrder.authorization_posture stays SUPPLEMENT_PENDING"
          - "increments Supplement.version and RepairOrder.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /supplements/{id}/resubmit"
        actor: Estimator
        preconditions:
          - "Supplement.status == INFO_REQUESTED (else ERR_SUPPLEMENT_NOT_OPEN)"
          - "Supplement.round_count < Insurer.supplement_round_limit of the order's insurer (else ERR_SUPPLEMENT_ROUND_LIMIT)"
        side_effects:
          - "increments round_count by 1, overwrites requested_amount_cents, resets submitted_at to the logical clock so the supplement wait interval restarts from this instant"
          - "clears info_request_note"
          - "increments Supplement.version and RepairOrder.version by 1"
        note: "Negotiation cycle back to SUBMITTED; the wait interval used by cycle_time_metrics always uses the latest submitted_at."

  - entity: PartsLine
    dimension: procurement_status
    initial_state: PLANNED
    terminal_states: [RETURNED, VOID]
    note: >-
      Procurement dimension. Cyclic through price negotiation (QUOTED -> COUNTERED -> QUOTED, one
      round per recorded vendor quote) and independent of the authorization_status dimension on the
      same row.
    transitions:
      - from: PLANNED
        to: QUOTED
        trigger: "POST /parts-lines/{id}/quote"
        actor: PartsManager
        preconditions:
          - "PartsLine.procurement_status == PLANNED (else ERR_PARTS_LINE_STATE)"
          - "part_type IN PartsVendor.part_types_offered (else ERR_PART_TYPE_NOT_OFFERED)"
        side_effects:
          - "sets vendor_id, quoted_unit_price_cents, quote_round = 1"
          - "increments PartsLine.version by 1"
      - from: QUOTED
        to: COUNTERED
        trigger: "POST /parts-lines/{id}/counter-offer"
        actor: PartsManager
        preconditions:
          - "PartsLine.procurement_status == QUOTED (else ERR_PARTS_LINE_STATE)"
          - "counter_unit_price_cents < quoted_unit_price_cents (else ERR_COUNTER_NOT_LOWER)"
        side_effects:
          - "sets counter_unit_price_cents"
          - "increments PartsLine.version by 1"
      - from: COUNTERED
        to: QUOTED
        trigger: "POST /parts-lines/{id}/quote (vendor answers the counter with a revised price)"
        actor: PartsManager
        preconditions:
          - "PartsLine.procurement_status == COUNTERED (else ERR_PARTS_LINE_STATE)"
          - "the quote names the same vendor_id already on the line (else ERR_VENDOR_MISMATCH)"
        side_effects:
          - "overwrites quoted_unit_price_cents, clears counter_unit_price_cents, increments quote_round by 1"
          - "increments PartsLine.version by 1"
        note: "Negotiation cycle. quote_round feeds the FIRST_ROUND weight of calculations.vendor_fulfillment_score."
      - from: QUOTED
        to: PRICE_LOCKED
        trigger: "POST /parts-lines/{id}/accept-price"
        actor: PartsManager
        preconditions:
          - "PartsLine.procurement_status == QUOTED (else ERR_PARTS_LINE_STATE)"
          - "quoted_unit_price_cents <= round_half_up(list_price_cents * Insurer.parts_price_ceiling_pct) (else ERR_PARTS_PRICE_CEILING_EXCEEDED)"
        side_effects:
          - "freezes unit_price_cents = quoted_unit_price_cents and runs calculations.parts_line_extended_price, writing unit_extended_cents and extended_price_cents"
          - "reruns calculations.estimate_totals on the order (the line now enters the parts_gross_cents input set) and then calculations.authorization_posture_derivation"
          - "increments PartsLine.version and RepairOrder.version by 1"
      - from: PRICE_LOCKED
        to: ORDERED
        trigger: "POST /parts-lines/{id}/order"
        actor: PartsManager
        preconditions:
          - "PartsLine.procurement_status == PRICE_LOCKED (else ERR_PARTS_LINE_STATE)"
          - "RepairOrder.stage IN {ESTIMATE_LOCKED, PARTS_STAGED, REPAIR, REFINISH_CALIBRATION, READY_FOR_QC} (else ERR_STAGE_PRECONDITION)"
          - "RepairOrder.authorization_posture == OPEN (else ERR_AUTHORIZATION_POSTURE_BLOCKED)"
          - "PartsVendor.status == ACTIVE (else ERR_VENDOR_SUSPENDED)"
          - "PartsLine.authorization_status IN {INSURER_ALLOWED, CUSTOMER_CONSENTED} (else ERR_CUSTOMER_CONSENT_REQUIRED)"
          - "qty <= PartsVendor.max_qty_per_line (else ERR_VENDOR_QTY_CAP_EXCEEDED)"
          - "PartsVendor.fulfillment_score_rolling >= VENDOR_SCORE_FLOOR (else ERR_VENDOR_SCORE_BELOW_FLOOR)"
          - "RepairOrder.customer_pay_cents <= RepairOrder.deductible_cents + RepairOrder.betterment_cents (else ERR_AUTHORIZED_AMOUNT_EXCEEDED)"
        side_effects:
          - "sets promised_eta from the request and stamps vendor_order_seq = ++PartsVendor.order_seq_counter"
          - "adds unit_extended_cents * qty to RepairOrder.parts_ordered_gross_cents and re-runs calculations.parts_commitment_ledger so parts_committed_cents rises by extended_price_cents"
          - "increments PartsLine.version, PartsVendor.version and RepairOrder.version by 1"
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /parts-lines/{id}/receive"
        actor: PartsManager
        preconditions:
          - "PartsLine.procurement_status == ORDERED (else ERR_PARTS_LINE_STATE)"
          - "0 < received_qty <= qty (else ERR_INVALID_RECEIVE_QUANTITY)"
        side_effects:
          - "sets received_at = logical clock, received_qty, and computes on_time = received_at <= promised_eta"
          - "closes every open PartsDelayEvent on this line: closed_at = logical clock, delay_minutes = floor((closed_at - opened_at) in minutes), and recomputes RepairOrder.open_parts_delay_count"
          - "when condition != CORRECT, opens a PartsDelayEvent with reason INCORRECT_PART instead of closing anything, leaving open_parts_delay_count raised"
          - "reruns calculations.vendor_fulfillment_score for the vendor (both variants)"
          - "increments PartsLine.version, PartsVendor.version and RepairOrder.version by 1"
      - from: RECEIVED
        to: INSTALLED
        trigger: "POST /parts-lines/{id}/install"
        actor: Technician
        preconditions:
          - "PartsLine.procurement_status == RECEIVED (else ERR_PARTS_LINE_STATE)"
          - "RepairOrder.stage IN {REPAIR, REFINISH_CALIBRATION} (else ERR_STAGE_PRECONDITION)"
          - "received_qty - returned_qty >= 1 (else ERR_INVALID_RECEIVE_QUANTITY)"
        side_effects:
          - "increments PartsLine.version by 1; the line stays inside the parts_committed_cents input set"
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /parts-lines/{id}/return with return_qty == qty - returned_qty (full return)"
        actor: PartsManager
        preconditions:
          - "PartsLine.procurement_status IN {RECEIVED, INSTALLED} (else ERR_PARTS_LINE_STATE)"
          - "0 < return_qty <= received_qty - returned_qty (else ERR_INVALID_RETURN_QUANTITY)"
        side_effects:
          - "sets returned_qty, return_reason, recomputes restocking_fee_cents and extended_price_cents (now 0)"
          - "CASCADE hop 1 (caused by the line leaving the committed input set): calculations.parts_commitment_ledger reruns - parts_committed_cents falls by the returned value, parts_return_credit_cents rises by unit_extended_cents * return_qty - restocking_fee_cents, parts_restocking_loss_cents rises by restocking_fee_cents; then calculations.estimate_totals reruns so parts_gross_cents, parts_subtotal_cents, pre_tax_total_cents and customer_pay_cents move"
          - "CASCADE hop 2 (caused by hop 1's new customer_pay_cents): calculations.authorization_posture_derivation reruns and may set authorization_posture = CONSENT_REQUIRED"
          - "when return_reason == INCORRECT, opens a PartsDelayEvent with reason INCORRECT_PART"
          - "reruns calculations.vendor_fulfillment_score for the vendor (both variants)"
          - "increments PartsLine.version, PartsVendor.version and RepairOrder.version by 1"
        note: >-
          A partial return (return_qty < qty - returned_qty) keeps procurement_status at RECEIVED and
          fires the identical ledger cascade on the returned units only. The same transition applies
          from INSTALLED - a part already fitted to the car can be pulled back off when it turns out to
          be the wrong one - and that is the only path by which a return can reach an order that has
          left REPAIR, which is what makes the stage rollback below reachable.
      - from: PLANNED
        to: VOID
        trigger: "POST /repair-orders/{id}/total-loss (system cascade)"
        actor: system
        preconditions:
          - "PartsLine.procurement_status IN {PLANNED, QUOTED, COUNTERED, PRICE_LOCKED}"
        side_effects:
          - "sets extended_price_cents = 0 and removes the line from every totals input set"
          - "increments PartsLine.version by 1"
        note: "Same VOID transition applies from QUOTED, COUNTERED and PRICE_LOCKED; ORDERED and later lines are untouched by total loss."

  - entity: PartsLine
    dimension: authorization_status
    initial_state: INSURER_ALLOWED
    terminal_states: [CUSTOMER_DECLINED]
    note: >-
      Money-authorisation dimension, decided at creation and independent of procurement_status. The
      creation-time value is INSURER_ALLOWED for OEM parts and for policy-permitted alternates on a
      vehicle at least Insurer.alternate_parts_min_vehicle_age_years old, CUSTOMER_CONSENTED when
      Customer.preferred_alternate_parts_ok is true, and PENDING_CONSENT otherwise.
    transitions:
      - from: PENDING_CONSENT
        to: CUSTOMER_CONSENTED
        trigger: "POST /repair-orders/{id}/consent-decisions with decision = CONSENT and alternate_parts_ok = true"
        actor: Customer
        preconditions:
          - "PartsLine.authorization_status == PENDING_CONSENT"
          - "the acting X-User-ID == RepairOrder.customer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "the line becomes eligible for ordering and enters the parts_gross_cents input set once priced"
          - "increments PartsLine.version by 1"
      - from: PENDING_CONSENT
        to: CUSTOMER_DECLINED
        trigger: "POST /repair-orders/{id}/consent-decisions with decision = DECLINE, or decision = CONSENT with alternate_parts_ok = false"
        actor: Customer
        preconditions:
          - "PartsLine.authorization_status == PENDING_CONSENT"
          - "the acting X-User-ID == RepairOrder.customer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "the line is permanently excluded from parts_gross_cents and can never be ordered (ERR_CUSTOMER_CONSENT_REQUIRED)"
          - "increments PartsLine.version by 1"

  - entity: ProcedureRecord
    dimension: calibration_status
    initial_state: REQUIRED
    terminal_states: [NOT_REQUIRED, PASSED]
    note: >-
      Records created with requires_calibration == false start and stay at NOT_REQUIRED; records that
      demand calibration start at REQUIRED. FAILED is re-schedulable, which makes the machine cyclic.
    transitions:
      - from: REQUIRED
        to: SCHEDULED
        trigger: "POST /procedure-records/{id}/calibration-schedule"
        actor: Technician
        preconditions:
          - "ProcedureRecord.calibration_status IN {REQUIRED, FAILED} (else ERR_CALIBRATION_STATE)"
          - "window_end > window_start (else ERR_INVALID_WINDOW)"
          - "ProcedureRecord.calibration_type IN CalibrationBay.supported_types, treating BOTH as satisfied only by a bay listing BOTH (else ERR_BAY_TYPE_UNSUPPORTED)"
          - "fewer than CalibrationBay.concurrent_capacity ProcedureRecord rows with calibration_status == SCHEDULED on that bay strictly overlap the requested window (else ERR_CALIBRATION_BAY_CAPACITY_EXCEEDED)"
        side_effects:
          - "sets bay_id, window_start, window_end and recomputes CalibrationBay.scheduled_window_count"
          - "increments ProcedureRecord.version and CalibrationBay.version by 1"
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /procedure-records/{id}/calibration-result with result = PASS"
        actor: Technician
        preconditions:
          - "ProcedureRecord.calibration_status == SCHEDULED (else ERR_CALIBRATION_STATE)"
          - "post_scan_dtc_count == 0 (else the result is recorded as FAIL)"
        side_effects:
          - "sets post_scan_dtc_count, scan_report_ref and recomputes CalibrationBay.scheduled_window_count (the window is released)"
          - "increments ProcedureRecord.version and CalibrationBay.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /procedure-records/{id}/calibration-result with result = FAIL or post_scan_dtc_count > 0"
        actor: Technician
        preconditions:
          - "ProcedureRecord.calibration_status == SCHEDULED (else ERR_CALIBRATION_STATE)"
        side_effects:
          - "sets post_scan_dtc_count, scan_report_ref, clears bay_id, window_start and window_end so the bay window is freed, and recomputes CalibrationBay.scheduled_window_count"
          - "blocks REFINISH_CALIBRATION -> READY_FOR_QC with ERR_CALIBRATION_NOT_VERIFIED until a re-calibration passes"
          - "increments ProcedureRecord.version and CalibrationBay.version by 1"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /procedure-records/{id}/calibration-schedule (re-calibration)"
        actor: Technician
        preconditions:
          - "ProcedureRecord.calibration_status == FAILED"
          - "the same window and capacity rules as the REQUIRED -> SCHEDULED transition"
        side_effects:
          - "sets a new bay_id and window, clears post_scan_dtc_count and scan_report_ref"
          - "increments ProcedureRecord.version and CalibrationBay.version by 1"
        note: "Re-calibration cycle."

  - entity: StageAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /repair-orders/{id}/stage-advance entering the assignment's stage (system)"
        actor: system
        preconditions:
          - "StageAssignment.status == SCHEDULED"
          - "StageAssignment.stage == the stage the order just entered"
        side_effects:
          - "Stall.booked_minutes is unchanged - SCHEDULED and ACTIVE both occupy the stall"
          - "increments StageAssignment.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /repair-orders/{id}/stage-advance leaving the assignment's stage, or POST /repair-orders/{id}/deliver (system)"
        actor: system
        preconditions:
          - "StageAssignment.status == ACTIVE"
        side_effects:
          - "decrements Stall.booked_minutes by occupied_minutes via calculations.stall_occupancy_rollup"
          - "increments StageAssignment.version and Stall.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stage-assignments/{id}/cancel"
        actor: Technician
        preconditions:
          - "StageAssignment.status == SCHEDULED (else ERR_ASSIGNMENT_NOT_SCHEDULED)"
        side_effects:
          - "decrements Stall.booked_minutes by occupied_minutes, restoring the exact value the stall held before the assignment was created (calculations.stall_occupancy_rollup)"
          - "increments StageAssignment.version and Stall.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /parts-lines/{id}/return forcing a stage rollback (system cascade)"
        actor: system
        preconditions:
          - "StageAssignment.status == ACTIVE"
          - "StageAssignment.stage == REFINISH_CALIBRATION and its RepairOrder rolled back to REPAIR"
        side_effects:
          - "decrements Stall.booked_minutes by occupied_minutes"
          - "increments StageAssignment.version and Stall.version by 1"

  - entity: QcInspection
    initial_state: PASS
    terminal_states: [PASS, FAIL]
    note: >-
      Append-only verdict row; `result` is computed at creation and never changes. PASS is issued only
      when checklist_passed is true and post_scan_dtc_count is 0.
    transitions:
      - from: PASS
        to: PASS
        trigger: "POST /repair-orders/{id}/qc-inspections with checklist_passed = true and post_scan_dtc_count = 0"
        actor: QcInspector
        preconditions:
          - "RepairOrder.stage == READY_FOR_QC (else ERR_STAGE_PRECONDITION)"
          - "acting X-User-ID != RepairOrder.blueprint_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "every ProcedureRecord on this order with requires_calibration == true has calibration_status == PASSED (else ERR_CALIBRATION_NOT_VERIFIED)"
          - "every ProcedureRecord on this order has adherence_documented == true (else ERR_PROCEDURE_ADHERENCE_MISSING)"
          - "no PartsLine on this order has procurement_status IN {ORDERED, RECEIVED} (else ERR_PARTS_NOT_INSTALLED)"
        side_effects:
          - "sets sequence_number = RepairOrder.qc_inspection_count + 1 and inspector_user_id = acting X-User-ID"
          - "issues warranty_certificate_number = \"WC-\" + RepairOrder.claim_number + \"-\" + sequence_number and warranty_expires_at = logical clock + 365 days (WARRANTY_DAYS = 365)"
          - "recomputes RepairOrder.qc_inspection_count; RepairOrder.stage stays READY_FOR_QC awaiting delivery"
          - "increments RepairOrder.version by 1"
        note: "Row is created directly in its final state; the trigger is a creation, not a transition between two persisted values."
      - from: PASS
        to: FAIL
        trigger: "POST /repair-orders/{id}/qc-inspections with checklist_passed = false or post_scan_dtc_count > 0"
        actor: QcInspector
        preconditions:
          - "the same five preconditions as the PASS creation"
        side_effects:
          - "sets failure_reason = CHECKLIST when checklist_passed == false, else DTC_PRESENT; leaves warranty_certificate_number and warranty_expires_at null"
          - "drives RepairOrder.stage READY_FOR_QC -> QC_FAILED"
          - "recomputes RepairOrder.qc_inspection_count and increments RepairOrder.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: supplement-create-stale-order
    parent_entity: RepairOrder
    write_endpoint: "POST /repair-orders/{id}/supplements"
    occ_field: "expected_repair_order_version"
    description: |
      A shop may legitimately raise several supplements against one order, and each new supplement is
      priced against the totals the estimator last observed. Submitting a supplement whose
      expected_repair_order_version is behind RepairOrder.version is rejected: the order's money
      picture (approved lines, parts prices, insurer authorisation) has moved since that read, so the
      requested_amount_cents was computed from a superseded basis.
    error_id: ERR_STALE_REPAIR_ORDER_VERSION
    http_status: 412
  - rule_id: consent-decision-stale-order
    parent_entity: RepairOrder
    write_endpoint: "POST /repair-orders/{id}/consent-decisions"
    occ_field: "expected_repair_order_version"
    description: |
      A customer may record consent repeatedly, and each new decision legitimately supersedes the
      previous one, so a later decision is not blocked by an earlier one. What must be rejected is a
      decision carrying an expected_repair_order_version behind RepairOrder.version: the customer
      would be consenting to a customer_pay_cents figure the order no longer holds.
    error_id: ERR_STALE_REPAIR_ORDER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: refinish_labor_allocation
    trigger: >-
      PROVISIONAL runs on POST /repair-orders/{id}/blueprint over the order's DRAFT refinish lines.
      FINAL runs on POST /repair-orders/{id}/estimate/lock and again on every POST
      /supplements/{id}/decision that moves refinish lines into or out of APPROVED.
    algorithm: waterfall_allocation
    input_set: >-
      EstimateLine rows of the order with labor_type == REFINISH. PROVISIONAL reads rows with
      line_status == DRAFT; FINAL reads rows with line_status == APPROVED. Rows with line_status IN
      {PENDING_SUPPLEMENT, REJECTED, VOID} are excluded from both.
    formula: |
      # Rank the refinish lines. The highest guide_hours line is the "major" panel and keeps its
      # full time; every other refinish panel is discounted because the gun is already loaded.
      R = input_set sorted by (guide_hours DESC, created_at ASC, operation_code ASC)
      major = R[0]                       # empty input_set -> refinish hours 0.0, no lines written

      for L in R:
          if L is major:
              h = L.guide_hours + (CLEARCOAT_ADDER_HOURS if L.two_stage else 0.0)
          elif L.is_blend:
              h = L.guide_hours * BLEND_FACTOR
          elif L.is_adjacent_panel:
              h = L.guide_hours - OVERLAP_DEDUCTION_HOURS
          else:
              h = L.guide_hours
          L.allocated_hours = max(round_half_up(h, 1), 0.0)      # per-line rounding, then

      refinish_hours = sum(L.allocated_hours for L in R)          # sum of ALREADY-ROUNDED values

      # Non-refinish APPROVED lines get allocated_hours = guide_hours verbatim (no deduction).
      #
      # Worked example (fixture F1, three refinish lines, CLEARCOAT/BLEND/OVERLAP constants below):
      #   L1 guide 2.8 two_stage=true   -> major -> 2.8 + 0.3 = 3.1
      #   L2 guide 2.2 is_adjacent=true ->          2.2 - 0.4 = 1.8
      #   L3 guide 1.6 is_blend=true    ->          1.6 * 0.5  = 0.8
      #   FINAL       refinish_hours_final       = 3.1 + 1.8 + 0.8 = 5.7
      #   PROVISIONAL refinish_hours_provisional = 2.8 + 2.2 + 1.6 = 6.6
      # The 0.9 h gap between the two variants over identical rows is the reconciliation delta.
    constants:
      OVERLAP_DEDUCTION_HOURS: 0.4
      BLEND_FACTOR: 0.5
      CLEARCOAT_ADDER_HOURS: 0.3
    precision: "allocated_hours and refinish hours: 1 decimal place, round_half_up; per-line rounding happens BEFORE the sum, never after"
    variants:
      - name: PROVISIONAL
        when: "blueprinting, before the estimate is locked - written to RepairOrder.refinish_hours_provisional"
        difference: >-
          Raw guide time only: no overlap deduction, no blend factor, no clearcoat adder, and no
          major-panel ranking. It is deliberately the higher figure so the shop quotes conservatively
          before the estimate is committed. EstimateLine.allocated_hours is NOT written.
      - name: FINAL
        when: "estimate lock and every later supplement decision - written to RepairOrder.refinish_hours_final"
        difference: >-
          Applies the ranking, the overlap deduction, the blend factor and the clearcoat adder, and
          persists EstimateLine.allocated_hours on every APPROVED refinish line. Because the major
          panel is chosen by guide_hours DESC, adding one larger refinish line later re-ranks the set
          and changes the allocation of lines that were not themselves touched.

  - name: estimate_totals
    trigger: >-
      POST /repair-orders/{id}/estimate/lock, POST /supplements/{id}/decision, POST
      /parts-lines/{id}/accept-price, POST /parts-lines/{id}/order, POST /parts-lines/{id}/return,
      POST /repair-orders/{id}/consent-decisions and POST /repair-orders/{id}/total-loss.
    algorithm: aggregation
    input_set: >-
      Labor: EstimateLine rows with line_status == APPROVED. Parts: PartsLine rows whose
      authorization_status IN {INSURER_ALLOWED, CUSTOMER_CONSENTED} AND procurement_status IN
      {PRICE_LOCKED, ORDERED, RECEIVED, INSTALLED}. Lines that are PLANNED, QUOTED, COUNTERED,
      RETURNED or VOID, and lines whose authorization_status is PENDING_CONSENT or CUSTOMER_DECLINED,
      contribute nothing.
    formula: |
      # The eight steps run in exactly this order; each step reads the outputs of the ones above it.
      # (1) labor
      for L in approved_labor_lines:
          L.effective_rate_cents = min(SHOP_RATE_CENTS[L.labor_type],
                                       Insurer.rate_ceiling_cents[L.labor_type])
          L.line_amount_cents = round_half_up(L.allocated_hours * L.effective_rate_cents)
      labor_subtotal_cents = sum(L.line_amount_cents)

      # (2) paint and materials, capped
      supplies_fee_cents = min(round_half_up(labor_subtotal_cents * SUPPLIES_RATE),
                               SUPPLIES_CAP_CENTS)

      # (3) parts at the frozen per-unit price
      parts_gross_cents = sum(P.extended_price_cents for P in parts_input_set)

      # (4) volume rebate - AVERAGE rate on the whole gross, not marginal per tier
      pct = 0.00 if parts_gross_cents < PARTS_TIER_1_FLOOR_CENTS
            else 0.03 if parts_gross_cents < PARTS_TIER_2_FLOOR_CENTS
            else 0.05
      parts_discount_cents = round_half_up(parts_gross_cents * pct)

      # (5)
      parts_subtotal_cents = parts_gross_cents - parts_discount_cents

      # (6) betterment: the customer funds the upgrade share of a voluntary OEM part
      betterment_cents = sum(round_half_up(P.unit_extended_cents * P.qty * BETTERMENT_PCT)
                             for P in parts_input_set if P.oem_upgrade)

      # (7)
      pre_tax_total_cents = labor_subtotal_cents + supplies_fee_cents + parts_subtotal_cents

      # (8) split the bill; the insurer never funds the deductible or the betterment
      authorization_ceiling_cents = RepairOrder.initial_authorized_cents
                                  + sum(S.approved_amount_cents for S in supplements
                                        if S.status IN {APPROVED, PARTIAL})
      insurer_authorized_cents = max(0, min(pre_tax_total_cents
                                            - RepairOrder.deductible_cents
                                            - betterment_cents,
                                            authorization_ceiling_cents))
      customer_pay_cents = pre_tax_total_cents - insurer_authorized_cents

      # Worked example (fixture F1: rate_ceiling_cents {BODY:6000, FRAME:8000, REFINISH:5800,
      # MECHANICAL:11000, ALUMINUM_BODY:8800}, deductible 25000, initial_authorized 400000,
      # FINAL allocation 3.1/1.8/0.8 refinish + 4.5 BODY + 3.0 FRAME, two priced parts lines):
      #   (1) 3.1*5800=17980, 1.8*5800=10440, 0.8*5800=4640, 4.5*6000=27000, 3.0*8000=24000
      #       labor_subtotal_cents = 84060
      #   (2) round_half_up(84060*0.04) = 3362  (below the 25000 cap)
      #   (3) 78163 + 29241 = 107404
      #   (4) 107404 >= 100000 and < 500000 -> 3% -> round_half_up(3222.12) = 3222
      #   (5) 104182   (6) 0   (7) 84060+3362+104182 = 191604
      #   (8) ceiling 400000; min(191604-25000-0, 400000) = 166604
      #       insurer_authorized_cents = 166604, customer_pay_cents = 25000
    constants:
      SHOP_RATE_CENTS: { BODY: 6500, FRAME: 8500, REFINISH: 6000, MECHANICAL: 12500, ALUMINUM_BODY: 9500 }
      SUPPLIES_RATE: 0.04
      SUPPLIES_CAP_CENTS: 25000
      PARTS_TIER_1_FLOOR_CENTS: 100000
      PARTS_TIER_2_FLOOR_CENTS: 500000
      BETTERMENT_PCT: 0.2
    precision: "all money fields are integer cents, round_half_up at each step; hours carry 1 decimal place"

  - name: parts_line_extended_price
    trigger: "POST /parts-lines/{id}/accept-price, POST /parts-lines/{id}/return (recompute on the surviving quantity)"
    algorithm: tiered_pricing
    input_set: "the single PartsLine being priced, plus its PartsVendor.discount_pct and PartsVendor.core_charge_cents"
    formula: |
      # The vendor discount lands on ONE unit, and the rounded unit price is what multiplies out.
      unit_extended_cents = round_half_up(unit_price_cents * (1 - PartsVendor.discount_pct))
                          + (PartsVendor.core_charge_cents if part_type == RECONDITIONED else 0)
      extended_price_cents = unit_extended_cents * (qty - returned_qty)

      # restocking is charged only when the shop over-ordered; vendor errors are free to send back
      restocking_fee_cents = round_half_up(unit_extended_cents * return_qty
                                          * PartsVendor.restocking_fee_pct)
                             if return_reason == UNUSED else 0

      # Worked example (fixture F1):
      #   P1 OEM       unit_price 84500, discount 0.075, qty 1
      #      round_half_up(84500*0.925) = round_half_up(78162.5) = 78163 -> extended 78163
      #   P2 AFTERMARKET unit_price 10101, discount 0.035, qty 3
      #      round_half_up(10101*0.965) = round_half_up(9747.465) = 9747 -> extended 29241
      #   The forbidden sum-then-round path gives round_half_up(30303*0.965) = 29242 for P2 - one
      #   cent high - and propagates into parts_gross_cents, the discount tier and customer_pay_cents.
    constants: {}
    precision: "round_half_up to whole cents on the UNIT price first, then multiply by quantity; never round after multiplying"

  - name: vendor_fulfillment_score
    trigger: "POST /parts-lines/{id}/receive and POST /parts-lines/{id}/return, for the line's vendor"
    algorithm: weighted_scoring
    input_set: >-
      PartsLine rows with this vendor_id whose received_at is non-null - that is procurement_status IN
      {RECEIVED, INSTALLED, RETURNED}. Lines still PLANNED, QUOTED, COUNTERED, PRICE_LOCKED, ORDERED
      or VOID have no outcome yet and are excluded from both variants.
    formula: |
      closed = input_set ordered by (vendor_order_seq DESC)     # deterministic, never by id
      window = closed                    for the LIFETIME variant
      window = closed[0 : ROLLING_WINDOW_SIZE] for the ROLLING variant

      if window is empty:
          score = NEW_VENDOR_DEFAULT_SCORE
      else:
          on_time_ratio    = count(L.on_time == true)     / len(window)
          no_return_ratio  = count(L.returned_qty == 0)   / len(window)
          first_round_ratio= count(L.quote_round <= 1)    / len(window)
          score = round_half_up(100 * (WEIGHT_ON_TIME     * on_time_ratio
                                     + WEIGHT_NO_RETURN   * no_return_ratio
                                     + WEIGHT_FIRST_ROUND * first_round_ratio))

      # Worked example: four closed lines, vendor_order_seq 1..4; only seq 1 arrived on time,
      # none returned, all agreed at the first quote round.
      #   LIFETIME: 100*(0.60*0.25 + 0.25*1 + 0.15*1) = 100*0.55 = 55
      #   ROLLING(3) over seq {4,3,2}: 100*(0.60*0 + 0.25*1 + 0.15*1) = 40
      # Identical rows, 15-point divergence. VENDOR_SCORE_FLOOR is tested against ROLLING only.
    constants:
      ROLLING_WINDOW_SIZE: 3
      WEIGHT_ON_TIME: 0.6
      WEIGHT_NO_RETURN: 0.25
      WEIGHT_FIRST_ROUND: 0.15
      NEW_VENDOR_DEFAULT_SCORE: 50
      VENDOR_SCORE_FLOOR: 40
    precision: "score is a number rounded to 0 decimal places, round_half_up; ratios are exact rationals inside the weighted sum and are never rounded individually"
    variants:
      - name: ROLLING
        when: "written to PartsVendor.fulfillment_score_rolling and enforced by the ordering gate"
        difference: >-
          Only the ROLLING_WINDOW_SIZE most recent closed lines by vendor_order_seq DESC count, so an
          old good record decays out of the window and a vendor can fall below VENDOR_SCORE_FLOOR
          while its lifetime score is still comfortable.
      - name: LIFETIME
        when: "written to PartsVendor.fulfillment_score_lifetime and shown on GET /parts-vendors/{id}"
        difference: >-
          Every closed line counts with equal weight and the window never shrinks, so the score moves
          more slowly and is never used as an ordering gate.

  - name: cycle_time_metrics
    trigger: "GET /repair-orders/{id}/cycle-time (computed per request, not persisted)"
    algorithm: interval_merge
    input_set: >-
      All Supplement rows of the order (wait interval [submitted_at, decided_at), open ones run to the
      window end) and all PartsDelayEvent rows of the order (delay interval [opened_at, closed_at),
      open ones run to the window end). Supplement rows resubmitted after INFO_REQUESTED contribute
      one interval starting at the LATEST submitted_at.
    formula: |
      window_start = RepairOrder.checkin_at
      window_end   = RepairOrder.delivered_at if delivered_at else logical_clock_now
      gross_minutes = floor((window_end - window_start) / 60 seconds)

      raw = []
      for S in supplements: raw.append([S.submitted_at, S.decided_at or window_end])
      for D in delay_events: raw.append([D.opened_at,   D.closed_at or window_end])
      raw = [iv for iv in raw if iv[1] > iv[0]]                 # zero-length intervals dropped

      # clamp into the window, then merge overlapping AND exactly-adjacent intervals
      clamped = [[max(iv[0], window_start), min(iv[1], window_end)] for iv in raw]
      merged  = []
      for iv in sorted(clamped, key=lambda x: (x[0], x[1])):
          if merged and iv[0] <= merged[-1][1]:                 # gap == 0 merges too
              merged[-1][1] = max(merged[-1][1], iv[1])
          else:
              merged.append(iv)
      excluded_minutes = sum(floor((b - a) / 60 seconds) for a, b in merged)

      net_touch_minutes = max(0, gross_minutes - excluded_minutes)

      # Reported alongside, and deliberately NOT merged with each other:
      supplement_wait_minutes = sum of the per-supplement clamped durations
      parts_delay_minutes     = sum of the per-event clamped durations
      open_interval_count     = count of raw intervals whose end came from window_end
      # When a supplement wait and a parts delay overlap, supplement_wait_minutes +
      # parts_delay_minutes > excluded_minutes, and only excluded_minutes may be subtracted.
    constants: {}
    precision: "every duration floors to whole minutes AFTER merging; never floor the pieces and then add"
    variants:
      - name: GROSS
        when: "field gross_minutes - the keys-to-keys number quoted to the insurer"
        difference: "Pure wall time from checkin_at to delivery; no interval is excluded, so it is always >= the NET figure."
      - name: NET
        when: "field net_touch_minutes - the shop's own touch-time number"
        difference: >-
          Subtracts the merged union of supplement waits and parts delays. Because the union is
          merged, two concurrent hold-ups are charged once, so NET is strictly greater than
          gross - (supplement_wait_minutes + parts_delay_minutes) whenever two holds overlap.

  - name: approved_labor_hours_rollup
    trigger: "POST /repair-orders/{id}/estimate/lock, POST /supplements/{id}/decision, POST /repair-orders/{id}/total-loss"
    algorithm: aggregation
    input_set: "EstimateLine rows of the order with line_status == APPROVED (every labor_type, refinish and non-refinish alike)"
    formula: |
      approved_labor_hours = round_half_up(sum(L.allocated_hours for L in input_set), 1)
      # Worked example (fixture F1): 3.1 + 1.8 + 0.8 + 4.5 + 3.0 = 13.2
      # A DENIED supplement flips its lines APPROVED -> REJECTED, which removes their hours and
      # restores the exact pre-supplement figure. That reversal is the compensating invariant:
      #   approved_labor_hours == sum(allocated_hours where line_status == APPROVED)   [always]
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: parts_commitment_ledger
    trigger: "POST /parts-lines/{id}/order, POST /parts-lines/{id}/receive, POST /parts-lines/{id}/return, POST /repair-orders/{id}/total-loss"
    algorithm: aggregation
    input_set: >-
      All PartsLine rows of the order that have ever been ORDERED. parts_committed_cents reads only
      rows with procurement_status IN {ORDERED, RECEIVED, INSTALLED}; the credit and loss buckets read
      the return history.
    formula: |
      # append-only: incremented on every order event, NEVER decremented
      parts_ordered_gross_cents += unit_extended_cents * qty        # at order time

      parts_committed_cents = sum(P.unit_extended_cents * (P.qty - P.returned_qty)
                                  for P in lines if P.procurement_status IN
                                     {ORDERED, RECEIVED, INSTALLED})
      parts_return_credit_cents    = sum(P.unit_extended_cents * P.returned_qty
                                         - P.restocking_fee_cents for P in returned_lines)
      parts_restocking_loss_cents  = sum(P.restocking_fee_cents for P in returned_lines)

      # COMPENSATING INVARIANT (must hold after every one of the trigger endpoints):
      #   parts_ordered_gross_cents == parts_committed_cents
      #                              + parts_return_credit_cents
      #                              + parts_restocking_loss_cents
      #
      # Worked example: one OEM line ordered at unit_extended 78163 x qty 1 (ordered_gross 78163,
      # committed 78163, credit 0, loss 0). Full UNUSED return at restocking_fee_pct 0.2:
      #   restocking_fee_cents = round_half_up(78163*0.2) = 15633
      #   committed 0, credit 78163-15633 = 62530, loss 15633
      #   0 + 62530 + 15633 = 78163  == ordered_gross    (the fee is a loss, not a leak)
      # A VOID from total loss can only touch lines never ordered, so it cannot break the identity.
    constants: {}
    precision: "integer cents throughout; restocking_fee_cents rounds half-up once, at return time, and is then treated as a fixed literal"

  - name: stall_occupancy_rollup
    trigger: "POST /repair-orders/{id}/stage-assignments, POST /stage-assignments/{id}/cancel, POST /repair-orders/{id}/stage-advance, POST /repair-orders/{id}/deliver, POST /repair-orders/{id}/total-loss, POST /parts-lines/{id}/return (rollback cascade)"
    algorithm: aggregation
    input_set: "StageAssignment rows on the stall with status IN {SCHEDULED, ACTIVE}; COMPLETED and CANCELLED rows are excluded"
    formula: |
      occupied_minutes = floor((window_end - window_start) / 60 seconds)   # per assignment, fixed
      Stall.booked_minutes = sum(A.occupied_minutes for A in input_set)

      # DERIVED-FIELD RECONCILIATION (must hold after every trigger above):
      #   Stall.booked_minutes == sum(occupied_minutes where status IN {SCHEDULED, ACTIVE})
      # SCHEDULED -> ACTIVE leaves booked_minutes untouched; every exit path (COMPLETED, CANCELLED)
      # releases exactly occupied_minutes, so a create-then-cancel round trip returns the stall to
      # the byte-identical value it held before, with no drift from repeated cascades.
      # cleanup_buffer_minutes is NOT part of booked_minutes - it only widens the conflict window.
    constants: {}
    precision: "integer minutes, floor on each assignment duration"

  - name: authorization_posture_derivation
    trigger: >-
      Runs as the LAST step of POST /repair-orders/{id}/blueprint, /estimate/lock, /total-loss,
      /supplements (create), /supplements/{id}/decision, /supplements/{id}/resubmit,
      /consent-decisions, /estimate-lines/{id}/parts-lines, /parts-lines/{id}/accept-price,
      /parts-lines/{id}/order and /parts-lines/{id}/return - i.e. after every mutation that can move
      customer_pay_cents, a Supplement status or a PartsLine authorization_status.
    algorithm: constraint_propagation
    input_set: >-
      RepairOrder.customer_pay_cents and consent fields as recomputed by estimate_totals in the same
      request, all Supplement rows of the order, and all PartsLine rows of the order with
      procurement_status not in {VOID}.
    formula: |
      consent_gap = (customer_pay_cents >= CONSENT_THRESHOLD_CENTS
                     and (consent_state != CONSENTED
                          or consent_basis_cents is null
                          or consent_basis_cents < customer_pay_cents))
      pending_alternate = any(P.authorization_status == PENDING_CONSENT for P in parts_lines)
      supplement_open   = any(S.status IN {SUBMITTED, INFO_REQUESTED} for S in supplements)

      # stale-consent compensation, applied BEFORE the posture is chosen
      if consent_state == CONSENTED and consent_basis_cents < customer_pay_cents:
          consent_state = NONE; consent_basis_cents = null; consent_alternate_parts = false

      # pinned precedence - money first, paperwork second
      if consent_gap or pending_alternate:   authorization_posture = CONSENT_REQUIRED
      elif supplement_open:                  authorization_posture = SUPPLEMENT_PENDING
      else:                                  authorization_posture = OPEN

      # Worked example at the boundary (single BODY 4.5h line at 6000 + FRAME 3.0h line at 8000:
      # labor 51000, supplies 2040, pre_tax 53040, no parts):
      #   deductible 49999 -> insurer_authorized 3041 -> customer_pay 49999 -> OPEN
      #   deductible 50000 -> insurer_authorized 3040 -> customer_pay 50000 -> CONSENT_REQUIRED
      # The threshold is inclusive: exactly CONSENT_THRESHOLD_CENTS already requires consent.
      # A consent recorded at consent_basis_cents 50000 survives a later customer_pay of 50000 but
      # is invalidated by 50001 - the shop must go back to the customer.
    constants:
      CONSENT_THRESHOLD_CENTS: 50000
    precision: "integer cents; the comparison is >= and is evaluated on the value estimate_totals wrote in the same request, never on a stale read"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (evaluated in ascending priority; the FIRST violated rule
#     decides the response, so a request that breaks several rules returns the
#     lowest-numbered error_id and no side effect is applied)
# ---------------------------------------------------------------------------
validations:
  # --- 1-9 authentication and request shape -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles and that role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: >-
      For entity-backed roles the actor owns the addressed RepairOrder: an InsurerAdjuster's X-User-ID
      equals RepairOrder.insurer_id and a Customer's X-User-ID equals RepairOrder.customer_id
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints reachable by InsurerAdjuster or Customer"
  - priority: 4
    category: auth
    check: "the acting X-User-ID differs from RepairOrder.blueprint_by_user_id (the estimator who blueprinted may not sign off the repair)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /repair-orders/{id}/qc-inspections"
  - priority: 5
    category: validation
    check: "every required input field is present, non-null and of the declared JSON type; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 6
    category: validation
    check: "every enum-typed input holds one of that enum's declared members"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "all POST and PATCH endpoints, and enum filter query parameters on list endpoints"
  - priority: 7
    category: validation
    check: "1 <= limit <= 100 and offset >= 0, both integers"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 8
    category: validation
    check: "window_end is strictly after window_start and both parse as ISO-8601 instants"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /repair-orders/{id}/stage-assignments, POST /procedure-records/{id}/calibration-schedule"
  - priority: 9
    category: validation
    check: "numeric bounds on the field itself: guide_hours > 0 with at most one decimal, qty >= 1, list_price_cents > 0, requested_amount_cents > 0, post_scan_dtc_count >= 0, discount_pct in [0,1), parts_price_ceiling_pct >= 1.0, Insurer.rate_ceiling_cents carries all five labor_type keys"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  # --- 20-31 existence, resolved left to right along the path then across the body ----------
  - priority: 20
    category: existence
    check: "the {id} in /repair-orders/{id} resolves to a RepairOrder"
    error_id: ERR_REPAIR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /repair-orders/{id}... endpoints"
  - priority: 21
    category: existence
    check: "customer_id resolves to a Customer"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "POST /repair-orders, GET /repair-orders?customer_id="
  - priority: 22
    category: existence
    check: "insurer_id resolves to an Insurer"
    error_id: ERR_INSURER_NOT_FOUND
    http_status: 404
    applies_to: "POST /repair-orders, GET /repair-orders?insurer_id="
  - priority: 23
    category: existence
    check: "the {id} in /estimate-lines/{id} resolves to an EstimateLine, and estimate_line_id filters resolve"
    error_id: ERR_ESTIMATE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /estimate-lines/{id}, POST /estimate-lines/{id}/parts-lines, GET /parts-lines?estimate_line_id="
  - priority: 24
    category: existence
    check: "damage_line_id resolves to a DamageLine belonging to the same RepairOrder"
    error_id: ERR_DAMAGE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /repair-orders/{id}/estimate-lines, GET /estimate-lines?damage_line_id="
  - priority: 25
    category: existence
    check: "the {id} in /supplements/{id} resolves to a Supplement, and supplement_id references resolve to a Supplement on the same RepairOrder"
    error_id: ERR_SUPPLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /supplements/{id}/decision, POST /supplements/{id}/resubmit, POST /repair-orders/{id}/estimate-lines, GET /estimate-lines?supplement_id="
  - priority: 26
    category: existence
    check: "vendor_id resolves to a PartsVendor"
    error_id: ERR_PARTS_VENDOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /parts-vendors/{id}, POST /parts-lines/{id}/quote, GET /parts-lines?vendor_id="
  - priority: 27
    category: existence
    check: "the {id} in /parts-lines/{id} resolves to a PartsLine"
    error_id: ERR_PARTS_LINE_NOT_FOUND
    http_status: 404
    applies_to: "all /parts-lines/{id}... endpoints"
  - priority: 28
    category: existence
    check: "the {id} in /procedure-records/{id} resolves to a ProcedureRecord"
    error_id: ERR_PROCEDURE_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "all /procedure-records/{id}... endpoints"
  - priority: 29
    category: existence
    check: "bay_id resolves to a CalibrationBay"
    error_id: ERR_CALIBRATION_BAY_NOT_FOUND
    http_status: 404
    applies_to: "POST /procedure-records/{id}/calibration-schedule, GET /procedure-records?bay_id="
  - priority: 30
    category: existence
    check: "stall_id resolves to a Stall"
    error_id: ERR_STALL_NOT_FOUND
    http_status: 404
    applies_to: "GET /stalls/{id}, POST /repair-orders/{id}/stage-assignments, GET /stage-assignments?stall_id="
  - priority: 31
    category: existence
    check: "the {id} in /stage-assignments/{id} resolves to a StageAssignment"
    error_id: ERR_STAGE_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /stage-assignments/{id}, POST /stage-assignments/{id}/cancel"

  # --- 33 optimistic concurrency, after existence and before any state precondition --------
  - priority: 33
    category: state
    check: >-
      expected_repair_order_version equals the current RepairOrder.version. Checked before every state
      precondition on the two guarded endpoints so a caller working from a superseded read is told to
      re-read rather than being handed a domain error computed against data it never saw.
    error_id: ERR_STALE_REPAIR_ORDER_VERSION
    http_status: 412
    applies_to: "POST /repair-orders/{id}/supplements, POST /repair-orders/{id}/consent-decisions"

  # --- 35-43 state preconditions -----------------------------------------------------------
  - priority: 35
    category: state
    check: "RepairOrder.stage is neither DELIVERED nor TOTAL_LOSS"
    error_id: ERR_ORDER_TERMINAL
    http_status: 409
    applies_to: "every mutation that touches a RepairOrder or any of its children"
  - priority: 37
    category: state
    check: >-
      RepairOrder.stage is in the from-state set the operation declares: {INTAKE, TEARDOWN} for blueprint,
      BLUEPRINTED for estimate lock and total loss, READY_FOR_QC for qc-inspections and deliver,
      {ESTIMATE_LOCKED, PARTS_STAGED, REPAIR, REFINISH_CALIBRATION, READY_FOR_QC} for parts ordering,
      {REPAIR, REFINISH_CALIBRATION} for parts installation
    error_id: ERR_STAGE_PRECONDITION
    http_status: 409
    applies_to: "POST /repair-orders/{id}/blueprint, /estimate/lock, /total-loss, /qc-inspections, /deliver, POST /parts-lines/{id}/order, POST /parts-lines/{id}/install"
  - priority: 38
    category: state
    check: "to_stage is the declared successor of the current stage - PARTS_STAGED after ESTIMATE_LOCKED, REPAIR after PARTS_STAGED or QC_FAILED, REFINISH_CALIBRATION after REPAIR, READY_FOR_QC after REFINISH_CALIBRATION; any other pair, including a repeat of the current stage, is refused"
    error_id: ERR_STAGE_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /repair-orders/{id}/stage-advance"
  - priority: 39
    category: state
    check: "PartsLine.procurement_status is in the operation's from-state set (PLANNED or COUNTERED for quote, QUOTED for counter-offer and accept-price, PRICE_LOCKED for order, ORDERED for receive, RECEIVED for install, RECEIVED or INSTALLED for return)"
    error_id: ERR_PARTS_LINE_STATE
    http_status: 409
    applies_to: "all POST /parts-lines/{id}/... endpoints"
  - priority: 40
    category: state
    check: >-
      RepairOrder.authorization_posture == OPEN. A SUPPLEMENT_PENDING or CONSENT_REQUIRED order is
      frozen: the money picture is unsettled, so no stage may advance, no part may be ordered and the
      vehicle may not be delivered.
    error_id: ERR_AUTHORIZATION_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/stage-advance, POST /repair-orders/{id}/deliver, POST /parts-lines/{id}/order"
  - priority: 41
    category: state
    check: "Supplement.status == SUBMITTED for a decision, and == INFO_REQUESTED for a resubmit"
    error_id: ERR_SUPPLEMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /supplements/{id}/decision, POST /supplements/{id}/resubmit"
  - priority: 42
    category: state
    check: "ProcedureRecord.calibration_status is in {REQUIRED, FAILED} to schedule and == SCHEDULED to record a result"
    error_id: ERR_CALIBRATION_STATE
    http_status: 409
    applies_to: "POST /procedure-records/{id}/calibration-schedule, POST /procedure-records/{id}/calibration-result"
  - priority: 43
    category: state
    check: "StageAssignment.status == SCHEDULED"
    error_id: ERR_ASSIGNMENT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /stage-assignments/{id}/cancel"

  # --- 50-56 safety and compliance: nobody ships an uncalibrated car -----------------------
  - priority: 50
    category: business_safety
    check: >-
      Every ProcedureRecord on the order with requires_calibration == true has calibration_status ==
      PASSED. Ranked above every constraint and fiscal check: an ADAS system that has not been proven
      to see the road is a safety defect, and the answer must name that defect even when the request
      is also short of parts or over budget.
    error_id: ERR_CALIBRATION_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /repair-orders/{id}/stage-advance with to_stage = READY_FOR_QC, POST /repair-orders/{id}/qc-inspections"
  - priority: 52
    category: business_safety
    check: "every ProcedureRecord in scope has adherence_documented == true - STRUCTURAL records when leaving REPAIR, all records at QC"
    error_id: ERR_PROCEDURE_ADHERENCE_MISSING
    http_status: 422
    applies_to: "POST /repair-orders/{id}/stage-advance with to_stage IN {REFINISH_CALIBRATION, READY_FOR_QC}, POST /repair-orders/{id}/qc-inspections"
  - priority: 54
    category: business_safety
    check: "if any DamageLine on the order has adas_component_touched == true, at least one ProcedureRecord on the order has operation_scope == ADAS and requires_calibration == true"
    error_id: ERR_ADAS_PROCEDURE_RESEARCH_MISSING
    http_status: 422
    applies_to: "POST /repair-orders/{id}/blueprint"
  - priority: 56
    category: business_safety
    check: "every EstimateLine being approved that has not_included_operation == true carries a non-empty justification_note"
    error_id: ERR_NOT_INCLUDED_JUSTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /repair-orders/{id}/estimate/lock"

  # --- 60-65 referential policy: is this counterparty allowed to play at all? --------------
  - priority: 60
    category: business_referential
    check: >-
      PartsVendor.status == ACTIVE. Ranked above the vendor's own quantity cap because a suspended
      vendor is not a counterparty at all - its cap is irrelevant.
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 422
    applies_to: "POST /parts-lines/{id}/order"
  - priority: 61
    category: business_referential
    check: "PartsLine.part_type appears in PartsVendor.part_types_offered"
    error_id: ERR_PART_TYPE_NOT_OFFERED
    http_status: 422
    applies_to: "POST /parts-lines/{id}/quote"
  - priority: 62
    category: business_referential
    check: "the insurer program permits this part_type at all: AFTERMARKET needs aftermarket_allowed, RECYCLED needs recycled_allowed, RECONDITIONED needs reconditioned_allowed; OEM is always permitted"
    error_id: ERR_PART_TYPE_NOT_ALLOWED_BY_INSURER
    http_status: 422
    applies_to: "POST /estimate-lines/{id}/parts-lines"
  - priority: 63
    category: business_referential
    check: "Stall.stall_type fits the assignment stage: REPAIR needs BODY or FRAME, REFINISH_CALIBRATION needs PAINT"
    error_id: ERR_STALL_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /repair-orders/{id}/stage-assignments"
  - priority: 64
    category: business_referential
    check: "ProcedureRecord.calibration_type is supported by the bay; a record of type BOTH is only satisfied by a bay whose supported_types contains BOTH"
    error_id: ERR_BAY_TYPE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /procedure-records/{id}/calibration-schedule"
  - priority: 65
    category: business_referential
    check: "Stall.status == AVAILABLE"
    error_id: ERR_STALL_UNAVAILABLE
    http_status: 422
    applies_to: "POST /repair-orders/{id}/stage-assignments"

  # --- 66-84 constraint satisfaction: quantities, windows, workflow completeness -----------
  - priority: 66
    category: business_constraint
    check: "PartsLine.qty <= PartsVendor.max_qty_per_line"
    error_id: ERR_VENDOR_QTY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /parts-lines/{id}/order"
  - priority: 67
    category: business_constraint
    check: >-
      No other StageAssignment on the same stall with status IN {SCHEDULED, ACTIVE} comes within
      Stall.cleanup_buffer_minutes of the requested window on either side. The buffer is symmetric and
      the exclusion zone is closed, so a window that starts exactly cleanup_buffer_minutes after an
      existing window ends is still refused; one further minute is accepted.
    error_id: ERR_STALL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /repair-orders/{id}/stage-assignments"
  - priority: 68
    category: business_constraint
    check: >-
      Fewer than CalibrationBay.concurrent_capacity ProcedureRecord rows with calibration_status ==
      SCHEDULED on that bay strictly overlap the requested window. Overlap is half-open [start, end),
      there is no buffer, and back-to-back windows that merely touch at an instant do not overlap - so
      each individual booking can be legal while the aggregate count is what refuses the next one.
    error_id: ERR_CALIBRATION_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /procedure-records/{id}/calibration-schedule"
  - priority: 69
    category: business_constraint
    check: "Supplement.round_count < Insurer.supplement_round_limit of the order's insurer"
    error_id: ERR_SUPPLEMENT_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /supplements/{id}/resubmit"
  - priority: 70
    category: business_constraint
    check: "RepairOrder.teardown_finding_count >= 1"
    error_id: ERR_NO_TEARDOWN_FINDINGS
    http_status: 422
    applies_to: "POST /repair-orders/{id}/blueprint"
  - priority: 71
    category: business_constraint
    check: "at least one EstimateLine on the order has line_status == DRAFT"
    error_id: ERR_NO_ESTIMATE_LINES
    http_status: 422
    applies_to: "POST /repair-orders/{id}/estimate/lock"
  - priority: 72
    category: business_constraint
    check: "no PartsLine on the order has procurement_status IN {PLANNED, QUOTED, COUNTERED, PRICE_LOCKED} - every part is either ordered or off the estimate"
    error_id: ERR_PARTS_NOT_PROCURED
    http_status: 422
    applies_to: "POST /repair-orders/{id}/stage-advance with to_stage = PARTS_STAGED"
  - priority: 73
    category: business_constraint
    check: "no PartsLine on the order has procurement_status IN {ORDERED, RECEIVED} - everything bought is on the car or sent back"
    error_id: ERR_PARTS_NOT_INSTALLED
    http_status: 422
    applies_to: "POST /repair-orders/{id}/stage-advance with to_stage = REFINISH_CALIBRATION, POST /repair-orders/{id}/qc-inspections"
  - priority: 74
    category: business_constraint
    check: "at least one StageAssignment on the order with status == SCHEDULED matches the stage being entered"
    error_id: ERR_NO_STAGE_ASSIGNMENT
    http_status: 422
    applies_to: "POST /repair-orders/{id}/stage-advance with to_stage IN {REPAIR, REFINISH_CALIBRATION}"
  - priority: 75
    category: business_constraint
    check: "0 < return_qty <= received_qty - returned_qty"
    error_id: ERR_INVALID_RETURN_QUANTITY
    http_status: 422
    applies_to: "POST /parts-lines/{id}/return"
  - priority: 76
    category: business_constraint
    check: "0 < received_qty <= qty on receipt, and received_qty - returned_qty >= 1 on installation"
    error_id: ERR_INVALID_RECEIVE_QUANTITY
    http_status: 422
    applies_to: "POST /parts-lines/{id}/receive, POST /parts-lines/{id}/install"
  - priority: 77
    category: business_constraint
    check: "counter_unit_price_cents < quoted_unit_price_cents"
    error_id: ERR_COUNTER_NOT_LOWER
    http_status: 422
    applies_to: "POST /parts-lines/{id}/counter-offer"
  - priority: 78
    category: business_constraint
    check: "a revised quote on a COUNTERED line names the vendor_id already on the line"
    error_id: ERR_VENDOR_MISMATCH
    http_status: 422
    applies_to: "POST /parts-lines/{id}/quote"
  - priority: 79
    category: business_constraint
    check: "PartsLine.authorization_status IN {INSURER_ALLOWED, CUSTOMER_CONSENTED} - a PENDING_CONSENT or CUSTOMER_DECLINED line may never be ordered"
    error_id: ERR_CUSTOMER_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /parts-lines/{id}/order"
  - priority: 80
    category: business_constraint
    check: >-
      oem_upgrade may only be true on a part_type == OEM line whose insurer permits at least one
      alternate type and whose vehicle is at least alternate_parts_min_vehicle_age_years old - there is
      no upgrade to fund when OEM was the only lawful choice anyway
    error_id: ERR_OEM_UPGRADE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /estimate-lines/{id}/parts-lines"
  - priority: 81
    category: business_constraint
    check: "the QcInspection on the order with the highest sequence_number has result == PASS"
    error_id: ERR_QC_NOT_PASSED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/deliver"
  - priority: 82
    category: business_constraint
    check: "RepairOrder.open_parts_delay_count == 0"
    error_id: ERR_OPEN_PARTS_DELAY
    http_status: 409
    applies_to: "POST /repair-orders/{id}/deliver"
  - priority: 83
    category: business_constraint
    check: "a PARTIAL decision carries 0 < approved_amount_cents < Supplement.requested_amount_cents; APPROVE and DENY carry no amount"
    error_id: ERR_INVALID_PARTIAL_AMOUNT
    http_status: 422
    applies_to: "POST /supplements/{id}/decision"
  - priority: 84
    category: business_constraint
    check: >-
      once RepairOrder.stage is past BLUEPRINTED, a new EstimateLine must carry a supplement_id naming
      a Supplement of this order with status IN {SUBMITTED, INFO_REQUESTED}; unsupplemented lines may
      only be added while the estimate is still open
    error_id: ERR_SUPPLEMENT_REQUIRED
    http_status: 422
    applies_to: "POST /repair-orders/{id}/estimate-lines"

  # --- 85-90 fiscal: money checks run last --------------------------------------------------
  - priority: 85
    category: business_fiscal
    check: "quoted_unit_price_cents <= round_half_up(list_price_cents * Insurer.parts_price_ceiling_pct)"
    error_id: ERR_PARTS_PRICE_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /parts-lines/{id}/accept-price"
  - priority: 88
    category: business_fiscal
    check: "PartsVendor.fulfillment_score_rolling >= VENDOR_SCORE_FLOOR (40) - the ROLLING variant only; a healthy lifetime score does not rescue a vendor whose recent window has collapsed"
    error_id: ERR_VENDOR_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /parts-lines/{id}/order"
  - priority: 90
    category: business_fiscal
    check: >-
      after this order the customer's exposure stays within what was agreed:
      RepairOrder.customer_pay_cents <= deductible_cents + betterment_cents. Ranked last, below the
      posture freeze at 40 and below the vendor checks at 60/66, so a request that is both frozen and
      over budget reports the freeze.
    error_id: ERR_AUTHORIZED_AMOUNT_EXCEEDED
    http_status: 402
    applies_to: "POST /parts-lines/{id}/order"

# ---------------------------------------------------------------------------
# 1.5 API Endpoints
# ---------------------------------------------------------------------------
endpoints:
  # --- static registries: everything a test needs before the first repair order -----------
  - method: POST
    path: "/customers"
    description: "Register a vehicle owner. preferred_alternate_parts_ok is the standing written consent that decides whether alternate parts land in PENDING_CONSENT or CUSTOMER_CONSENTED."
    roles: [ShopAdmin]
    code: 201
    input: [full_name, phone, email, "preferred_alternate_parts_ok?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Read one customer. Immutable row - no version field and no update endpoint."
    roles: [ShopAdmin, Estimator]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/insurers"
    description: "Register an insurer program. rate_ceiling_cents must carry all five labor_type keys; it is the ceiling half of the effective_rate_cents min() in estimate_totals."
    roles: [ShopAdmin]
    code: 201
    input: [insurer_code, name, rate_ceiling_cents, "aftermarket_allowed?", "recycled_allowed?", "reconditioned_allowed?", "alternate_parts_min_vehicle_age_years?", "parts_price_ceiling_pct?", "supplement_round_limit?"]
    output: Insurer
    side_effects: []
  - method: GET
    path: "/insurers/{id}"
    description: "Read one insurer program including its policy flags and rate ceilings."
    roles: [ShopAdmin, Estimator]
    code: 200
    input: []
    output: Insurer
    side_effects: []
  - method: POST
    path: "/parts-vendors"
    description: "Register a parts supplier. status is an input so a suspended vendor can be created directly; fulfillment scores start at NEW_VENDOR_DEFAULT_SCORE (50) until the vendor has a closed line."
    roles: [ShopAdmin, PartsManager]
    code: 201
    input: [name, vendor_type, part_types_offered, "status?", "discount_pct?", "core_charge_cents?", "restocking_fee_pct?", "max_qty_per_line?"]
    output: PartsVendor
    side_effects: ["initialises fulfillment_score_rolling and fulfillment_score_lifetime to 50 and order_seq_counter to 0"]
  - method: GET
    path: "/parts-vendors/{id}"
    description: "Read a vendor with both variants of calculations.vendor_fulfillment_score side by side."
    roles: [ShopAdmin, PartsManager]
    code: 200
    input: []
    output: PartsVendor
    side_effects: []
  - method: POST
    path: "/stalls"
    description: "Register a production stall. status is an input so a MAINTENANCE stall can be created directly; cleanup_buffer_minutes widens the booking exclusion zone symmetrically."
    roles: [ShopAdmin]
    code: 201
    input: [name, stall_type, "cleanup_buffer_minutes?", "status?"]
    output: Stall
    side_effects: []
  - method: GET
    path: "/stalls/{id}"
    description: "Read a stall including the derived booked_minutes maintained by calculations.stall_occupancy_rollup."
    roles: [ShopAdmin, Technician]
    code: 200
    input: []
    output: Stall
    side_effects: []
  - method: POST
    path: "/calibration-bays"
    description: "Register an ADAS calibration bay. concurrent_capacity is an aggregate limit over strictly overlapping windows, not a per-window flag."
    roles: [ShopAdmin]
    code: 201
    input: [name, supported_types, "concurrent_capacity?"]
    output: CalibrationBay
    side_effects: []
  - method: GET
    path: "/calibration-bays/{id}"
    description: "Read a bay including the derived scheduled_window_count."
    roles: [ShopAdmin, Technician]
    code: 200
    input: []
    output: CalibrationBay
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Test-driving endpoint. Sets the logical clock that stamps checkin_at, submitted_at, decided_at,
      received_at, opened_at, closed_at, delivered_at and warranty_expires_at, and that decides parts
      ETA breaches and vehicle age. Before the first call the clock reads exactly
      2026-08-01T00:00:00Z; it never falls back to wall-clock time.
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["moves the logical clock; already-stamped timestamps are untouched"]

  # --- repair order intake, teardown, blueprinting ----------------------------------------
  - method: POST
    path: "/repair-orders"
    description: "Open a repair order at stage INTAKE and authorization_posture OPEN, stamping checkin_at from the logical clock."
    roles: [ShopAdmin]
    code: 201
    input: [customer_id, insurer_id, claim_number, vehicle_vin, vehicle_model_year, vehicle_make_model, initial_authorized_cents, "deductible_cents?"]
    output: RepairOrder
    side_effects: ["stamps checkin_at, opening the cycle-time window", "sets stage = INTAKE, authorization_posture = OPEN, consent_state = NONE, version = 1"]
  - method: GET
    path: "/repair-orders/{id}"
    description: "Read the aggregate root: both state dimensions, every money field, the parts ledger, the consent basis and version (the value the OCC endpoints expect)."
    roles: [ShopAdmin, Estimator, PartsManager, Technician, QcInspector, InsurerAdjuster, Customer]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/repair-orders"
    description: "List repair orders, filterable by owner, insurer and stage. Reverse lookup from Customer.id and Insurer.id."
    roles: [ShopAdmin, Estimator, PartsManager]
    code: 200
    input: ["customer_id?", "insurer_id?", "stage?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/teardown-findings"
    description: "Record one damage finding discovered during teardown. The first finding moves the order INTAKE -> TEARDOWN; later findings only raise teardown_finding_count."
    roles: [Estimator]
    code: 201
    input: [panel_code, severity, "requires_blend?", "adas_component_touched?", "structural?"]
    output: DamageLine
    side_effects: ["stamps discovered_at_stage from the order's stage at the moment of the call", "first finding drives stage INTAKE -> TEARDOWN", "recomputes RepairOrder.teardown_finding_count and increments RepairOrder.version"]
  - method: GET
    path: "/repair-orders/{id}/damage-lines"
    description: "All damage findings on the order, in creation order. Reverse lookup from RepairOrder.id to DamageLine."
    roles: [ShopAdmin, Estimator, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: DamageLine[]
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/blueprint"
    description: "Close teardown and publish the blueprint. Runs the PROVISIONAL refinish variant and stamps the estimator's user id for the later segregation-of-duties check at QC."
    roles: [Estimator]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["stage TEARDOWN -> BLUEPRINTED", "stamps blueprint_by_user_id = X-User-ID", "runs calculations.refinish_labor_allocation variant PROVISIONAL -> refinish_hours_provisional", "runs calculations.authorization_posture_derivation", "increments version"]

  # --- estimate construction ---------------------------------------------------------------
  - method: POST
    path: "/repair-orders/{id}/estimate-lines"
    description: >-
      Add a labor line. While the estimate is open (stage BLUEPRINTED) the line is created DRAFT; once
      the estimate is locked a supplement_id naming an open Supplement is mandatory and the line is
      created PENDING_SUPPLEMENT, invisible to every total until the adjuster decides.
    roles: [Estimator]
    code: 201
    input: [damage_line_id, operation_code, labor_type, guide_hours, "supplement_id?", "not_included_operation?", "justification_note?", "is_blend?", "is_adjacent_panel?", "two_stage?", "pay_type?"]
    output: EstimateLine
    side_effects: ["line_status = DRAFT when the estimate is open, PENDING_SUPPLEMENT when created under a supplement", "runs calculations.authorization_posture_derivation", "increments RepairOrder.version"]
  - method: GET
    path: "/estimate-lines/{id}"
    description: "Read one labor line with its allocated_hours, effective_rate_cents and line_amount_cents."
    roles: [Estimator, PartsManager, InsurerAdjuster]
    code: 200
    input: []
    output: EstimateLine
    side_effects: []
  - method: GET
    path: "/estimate-lines"
    description: "List labor lines. Reverse lookup from RepairOrder.id, DamageLine.id and Supplement.id to EstimateLine."
    roles: [Estimator, PartsManager, InsurerAdjuster]
    code: 200
    input: ["repair_order_id?", "damage_line_id?", "supplement_id?", "line_status?", "limit?", "offset?"]
    output: EstimateLine[]
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/estimate/lock"
    description: "Commit the estimate. Approves every DRAFT line, switches the refinish allocation from PROVISIONAL to FINAL and runs the eight-step totals."
    roles: [Estimator]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["stage BLUEPRINTED -> ESTIMATE_LOCKED", "every DRAFT EstimateLine -> APPROVED", "runs calculations.refinish_labor_allocation variant FINAL, writing EstimateLine.allocated_hours and refinish_hours_final", "runs calculations.approved_labor_hours_rollup then calculations.estimate_totals then calculations.authorization_posture_derivation", "increments RepairOrder.version and each touched EstimateLine.version"]
  - method: POST
    path: "/repair-orders/{id}/total-loss"
    description: "Declare the vehicle a total loss from BLUEPRINTED. The divergent twin of estimate lock: it voids the open lines instead of approving them."
    roles: [Estimator]
    code: 200
    input: [total_loss_note]
    output: RepairOrder
    side_effects: ["stage BLUEPRINTED -> TOTAL_LOSS (terminal)", "every EstimateLine IN {DRAFT, PENDING_SUPPLEMENT} -> VOID and every PartsLine IN {PLANNED, QUOTED, COUNTERED, PRICE_LOCKED} -> VOID", "reruns calculations.approved_labor_hours_rollup, calculations.parts_commitment_ledger, calculations.estimate_totals and calculations.authorization_posture_derivation", "every StageAssignment IN {SCHEDULED, ACTIVE} -> CANCELLED, releasing Stall.booked_minutes", "increments RepairOrder.version"]

  # --- supplements and consent (the two OCC-guarded writes) --------------------------------
  - method: POST
    path: "/repair-orders/{id}/supplements"
    description: >-
      Raise a supplement against the locked estimate. expected_repair_order_version must equal the
      order's current version: the requested amount is priced off the totals the estimator read, and a
      superseded read must be refused with 412 rather than silently repriced.
    roles: [Estimator]
    code: 201
    input: [reason_code, requested_amount_cents, expected_repair_order_version]
    output: Supplement
    side_effects: ["status = SUBMITTED, round_count = 1, submitted_at = logical clock (opens a cycle-time exclusion interval)", "runs calculations.authorization_posture_derivation -> authorization_posture = SUPPLEMENT_PENDING", "increments RepairOrder.version by 1"]
  - method: GET
    path: "/repair-orders/{id}/supplements"
    description: "All supplements on the order. Reverse lookup from RepairOrder.id to Supplement."
    roles: [ShopAdmin, Estimator, InsurerAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: Supplement[]
    side_effects: []
  - method: GET
    path: "/supplements/{id}"
    description: "Read one supplement with its round_count, requested and approved amounts and decision notes."
    roles: [ShopAdmin, Estimator, InsurerAdjuster]
    code: 200
    input: []
    output: Supplement
    side_effects: []
  - method: POST
    path: "/supplements/{id}/decision"
    description: "The adjuster answers: APPROVE, PARTIAL (with an amount strictly between 0 and the request), DENY, or REQUEST_INFO (with a note). Only the insurer that owns the order may answer."
    roles: [InsurerAdjuster]
    code: 200
    input: [decision, "approved_amount_cents?", "note?"]
    output: Supplement
    side_effects: ["APPROVE/PARTIAL: linked PENDING_SUPPLEMENT lines -> APPROVED; DENY: -> REJECTED; REQUEST_INFO: unchanged", "APPROVE/PARTIAL/DENY stamp decided_at, closing the cycle-time exclusion interval", "reruns calculations.refinish_labor_allocation FINAL, calculations.approved_labor_hours_rollup, calculations.estimate_totals and calculations.authorization_posture_derivation, which may invalidate a stale consent", "increments Supplement.version, each touched EstimateLine.version and RepairOrder.version"]
  - method: POST
    path: "/supplements/{id}/resubmit"
    description: "Answer an information request with a revised amount. Raises round_count and restarts submitted_at, capped by Insurer.supplement_round_limit."
    roles: [Estimator]
    code: 200
    input: [requested_amount_cents]
    output: Supplement
    side_effects: ["status INFO_REQUESTED -> SUBMITTED, round_count += 1, submitted_at reset to the logical clock", "clears info_request_note", "increments Supplement.version and RepairOrder.version"]
  - method: POST
    path: "/repair-orders/{id}/consent-decisions"
    description: >-
      The customer accepts or refuses their share. consent_basis_cents is frozen at the
      customer_pay_cents the customer was shown, and expected_repair_order_version must match so a
      customer can never consent to a figure the order no longer holds. A later decision supersedes an
      earlier one; only a stale version is refused (412).
    roles: [Customer]
    code: 200
    input: [decision, alternate_parts_ok, expected_repair_order_version]
    output: RepairOrder
    side_effects: ["CONSENT: consent_state = CONSENTED, consent_basis_cents = current customer_pay_cents, consent_alternate_parts = alternate_parts_ok; DECLINE: consent_state = DECLINED", "every PENDING_CONSENT PartsLine -> CUSTOMER_CONSENTED when consent_alternate_parts is true, else CUSTOMER_DECLINED", "reruns calculations.estimate_totals then calculations.authorization_posture_derivation", "increments RepairOrder.version by 1 and each touched PartsLine.version"]

  # --- parts: selection, negotiation, ordering, receipt, return ----------------------------
  - method: POST
    path: "/estimate-lines/{id}/parts-lines"
    description: >-
      Attach a part to a labor line and choose its type. authorization_status is derived at creation:
      OEM is always INSURER_ALLOWED; a policy-permitted alternate on a vehicle at least
      alternate_parts_min_vehicle_age_years old is INSURER_ALLOWED; otherwise the customer's standing
      preference decides CUSTOMER_CONSENTED, and absent that the line lands PENDING_CONSENT.
    roles: [PartsManager]
    code: 201
    input: [part_number, part_description, part_type, list_price_cents, qty, "vendor_id?", "oem_upgrade?"]
    output: PartsLine
    side_effects: ["procurement_status = PLANNED, quote_round = 0, derives authorization_status", "a PENDING_CONSENT line drives calculations.authorization_posture_derivation -> CONSENT_REQUIRED", "increments RepairOrder.version"]
  - method: GET
    path: "/parts-lines/{id}"
    description: "Read one parts line: both state dimensions, the negotiation prices, the frozen unit_extended_cents and the return bookkeeping."
    roles: [Estimator, PartsManager, Technician]
    code: 200
    input: []
    output: PartsLine
    side_effects: []
  - method: GET
    path: "/parts-lines"
    description: "List parts lines. Reverse lookup from EstimateLine.id and PartsVendor.id to PartsLine."
    roles: [Estimator, PartsManager, Technician]
    code: 200
    input: ["estimate_line_id?", "vendor_id?", "procurement_status?", "limit?", "offset?"]
    output: PartsLine[]
    side_effects: []
  - method: POST
    path: "/parts-lines/{id}/quote"
    description: "Record a vendor quote. From PLANNED it opens the negotiation at quote_round 1; from COUNTERED it is the vendor's answer to the counter and raises quote_round, which is what the FIRST_ROUND score weight measures."
    roles: [PartsManager]
    code: 200
    input: [vendor_id, quoted_unit_price_cents]
    output: PartsLine
    side_effects: ["procurement_status PLANNED -> QUOTED (quote_round = 1) or COUNTERED -> QUOTED (quote_round += 1, counter_unit_price_cents cleared)", "increments PartsLine.version"]
  - method: POST
    path: "/parts-lines/{id}/counter-offer"
    description: "Counter the vendor's price. Must be strictly lower than the standing quote."
    roles: [PartsManager]
    code: 200
    input: [counter_unit_price_cents]
    output: PartsLine
    side_effects: ["procurement_status QUOTED -> COUNTERED", "increments PartsLine.version"]
  - method: POST
    path: "/parts-lines/{id}/accept-price"
    description: "Freeze the standing quote as the line price, subject to the insurer's per-unit ceiling. Runs the unit-then-quantity extension and pulls the line into the parts totals."
    roles: [PartsManager]
    code: 200
    input: []
    output: PartsLine
    side_effects: ["procurement_status QUOTED -> PRICE_LOCKED and unit_price_cents = quoted_unit_price_cents", "runs calculations.parts_line_extended_price -> unit_extended_cents, extended_price_cents", "reruns calculations.estimate_totals then calculations.authorization_posture_derivation on the order", "increments PartsLine.version and RepairOrder.version"]
  - method: POST
    path: "/parts-lines/{id}/order"
    description: >-
      Place the order with the vendor. The most heavily guarded write in the API: posture freeze (40),
      vendor suspension (60), quantity cap (66), consent (79), vendor rolling score (88) and the
      customer-exposure ceiling (90) are all evaluated, in that order.
    roles: [PartsManager]
    code: 200
    input: [promised_eta]
    output: PartsLine
    side_effects: ["procurement_status PRICE_LOCKED -> ORDERED, stamps promised_eta and vendor_order_seq = ++PartsVendor.order_seq_counter", "adds unit_extended_cents * qty to RepairOrder.parts_ordered_gross_cents and reruns calculations.parts_commitment_ledger", "reruns calculations.estimate_totals and calculations.authorization_posture_derivation", "increments PartsLine.version, PartsVendor.version and RepairOrder.version"]
  - method: POST
    path: "/parts-lines/{id}/receive"
    description: "Book the part in. Sets on_time against promised_eta, closes any open delay event on the line, or opens an INCORRECT_PART delay event when the wrong part arrived, and re-scores the vendor on both variants. condition is an enum with exactly three members, CORRECT | INCORRECT | DAMAGED."
    roles: [PartsManager]
    code: 200
    input: [received_qty, condition]
    output: PartsLine
    side_effects: ["procurement_status ORDERED -> RECEIVED, stamps received_at and on_time", "condition == CORRECT closes every open PartsDelayEvent on the line (setting closed_at and delay_minutes); otherwise opens an INCORRECT_PART event", "recomputes RepairOrder.open_parts_delay_count", "reruns calculations.vendor_fulfillment_score (ROLLING and LIFETIME)", "increments PartsLine.version, PartsVendor.version and RepairOrder.version"]
  - method: POST
    path: "/parts-lines/{id}/return"
    description: >-
      Send a part back, from RECEIVED or from INSTALLED (a fitted part that turns out to be wrong comes
      back off). A full return moves the line to RETURNED; a partial return leaves it where it was.
      UNUSED returns carry the vendor's restocking fee, INCORRECT and DAMAGED do not. If the order had
      already moved past REPAIR, the return drags it back.
    roles: [PartsManager]
    code: 200
    input: [return_qty, return_reason]
    output: PartsLine
    side_effects: ["sets returned_qty and return_reason, recomputes restocking_fee_cents and extended_price_cents; full return -> RETURNED", "reruns calculations.parts_commitment_ledger (committed down, credit and restocking loss up, ordered gross untouched) then calculations.estimate_totals then calculations.authorization_posture_derivation", "an order at REFINISH_CALIBRATION or READY_FOR_QC rolls back to REPAIR, cancelling ACTIVE REFINISH_CALIBRATION assignments and releasing their stall minutes", "return_reason == INCORRECT opens an INCORRECT_PART PartsDelayEvent and raises open_parts_delay_count", "reruns calculations.vendor_fulfillment_score (ROLLING and LIFETIME)", "increments PartsLine.version, PartsVendor.version, RepairOrder.version and any touched StageAssignment.version and Stall.version"]
  - method: POST
    path: "/parts-lines/{id}/install"
    description: "Fit the part to the vehicle. Only from RECEIVED, only while the order is in REPAIR or REFINISH_CALIBRATION, and only if at least one unit survives the returns."
    roles: [Technician]
    code: 200
    input: []
    output: PartsLine
    side_effects: ["procurement_status RECEIVED -> INSTALLED", "increments PartsLine.version"]
  - method: POST
    path: "/repair-orders/{id}/parts-delay-sweep"
    description: >-
      Run the late-parts report. Opens an ETA_BREACH PartsDelayEvent, stamped at the logical clock, for
      every ORDERED line on the order whose promised_eta has passed and that has no open event. Idempotent
      within a clock instant: a repeat sweep before the clock moves opens nothing.
    roles: [PartsManager]
    code: 200
    input: []
    output: { opened_count: integer, open_parts_delay_count: integer }
    side_effects: ["creates PartsDelayEvent rows with reason = ETA_BREACH and opened_at = logical clock", "recomputes RepairOrder.open_parts_delay_count, which blocks delivery", "increments RepairOrder.version when at least one event was opened"]
  - method: GET
    path: "/repair-orders/{id}/parts-delay-events"
    description: "Every parts delay on the order, open and closed. Reverse lookup from RepairOrder.id to PartsDelayEvent."
    roles: [ShopAdmin, PartsManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PartsDelayEvent[]
    side_effects: []
  - method: GET
    path: "/parts-lines/{id}/parts-delay-events"
    description: "The delay events of one parts line, in creation order. Reverse lookup from PartsLine.id to PartsDelayEvent."
    roles: [ShopAdmin, PartsManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PartsDelayEvent[]
    side_effects: []

  # --- procedure research, adherence and ADAS calibration ---------------------------------
  - method: POST
    path: "/repair-orders/{id}/procedure-records"
    description: "Record a researched OEM repair procedure. requires_calibration true starts the record at REQUIRED, false at NOT_REQUIRED."
    roles: [Estimator, Technician]
    code: 201
    input: [procedure_code, source, operation_scope, "requires_calibration?", "calibration_type?"]
    output: ProcedureRecord
    side_effects: ["calibration_status = REQUIRED when requires_calibration is true, else NOT_REQUIRED", "adherence_documented = false"]
  - method: GET
    path: "/procedure-records/{id}"
    description: "Read one procedure record with its adherence flag, calibration state, booked window and post-scan result."
    roles: [Estimator, Technician, QcInspector]
    code: 200
    input: []
    output: ProcedureRecord
    side_effects: []
  - method: GET
    path: "/procedure-records"
    description: "List procedure records. Reverse lookup from RepairOrder.id and CalibrationBay.id to ProcedureRecord."
    roles: [Estimator, Technician, QcInspector]
    code: 200
    input: ["repair_order_id?", "bay_id?", "calibration_status?", "limit?", "offset?"]
    output: ProcedureRecord[]
    side_effects: []
  - method: PATCH
    path: "/procedure-records/{id}"
    description: "Attach the adherence documentation the safety gates at priorities 50 and 52 demand."
    roles: [Technician]
    code: 200
    input: [adherence_documented, "adherence_doc_ref?"]
    output: ProcedureRecord
    side_effects: ["sets adherence_documented and adherence_doc_ref", "increments ProcedureRecord.version"]
  - method: POST
    path: "/procedure-records/{id}/calibration-schedule"
    description: "Book the record into a calibration bay for a window. Bay type support is checked first, then the aggregate concurrent_capacity over strictly overlapping SCHEDULED windows."
    roles: [Technician]
    code: 200
    input: [bay_id, window_start, window_end]
    output: ProcedureRecord
    side_effects: ["calibration_status REQUIRED or FAILED -> SCHEDULED, sets bay_id and the window", "recomputes CalibrationBay.scheduled_window_count", "increments ProcedureRecord.version and CalibrationBay.version"]
  - method: POST
    path: "/procedure-records/{id}/calibration-result"
    description: "Record the calibration outcome and post-scan. Any DTC present forces FAIL regardless of the submitted result, and a FAIL frees the bay window for a re-book."
    roles: [Technician]
    code: 200
    input: [result, post_scan_dtc_count, "scan_report_ref?"]
    output: ProcedureRecord
    side_effects: ["calibration_status SCHEDULED -> PASSED when result is PASS and post_scan_dtc_count is 0, else -> FAILED", "a FAILED result clears bay_id, window_start and window_end and recomputes CalibrationBay.scheduled_window_count", "increments ProcedureRecord.version and CalibrationBay.version"]

  # --- stall scheduling, stage progression, QC, delivery, cycle time ----------------------
  - method: POST
    path: "/repair-orders/{id}/stage-assignments"
    description: >-
      Book a stall for a repair stage. The stall type must fit the stage, the stall must be AVAILABLE,
      and the requested window must clear every SCHEDULED or ACTIVE booking on that stall by more than
      Stall.cleanup_buffer_minutes on both sides.
    roles: [Technician]
    code: 201
    input: [stall_id, stage, window_start, window_end]
    output: StageAssignment
    side_effects: ["status = SCHEDULED, occupied_minutes = floor(window length in minutes)", "raises Stall.booked_minutes by occupied_minutes via calculations.stall_occupancy_rollup", "increments Stall.version"]
  - method: GET
    path: "/stage-assignments/{id}"
    description: "Read one stall booking with its status and occupied_minutes."
    roles: [ShopAdmin, Technician]
    code: 200
    input: []
    output: StageAssignment
    side_effects: []
  - method: GET
    path: "/stage-assignments"
    description: "List stall bookings. Reverse lookup from RepairOrder.id and Stall.id to StageAssignment."
    roles: [ShopAdmin, Technician]
    code: 200
    input: ["repair_order_id?", "stall_id?", "status?", "limit?", "offset?"]
    output: StageAssignment[]
    side_effects: []
  - method: POST
    path: "/stage-assignments/{id}/cancel"
    description: "Release a booking that has not started. Returns Stall.booked_minutes to exactly the value it held before the booking."
    roles: [Technician]
    code: 200
    input: []
    output: StageAssignment
    side_effects: ["status SCHEDULED -> CANCELLED", "lowers Stall.booked_minutes by occupied_minutes via calculations.stall_occupancy_rollup", "increments StageAssignment.version and Stall.version"]
  - method: POST
    path: "/repair-orders/{id}/stage-advance"
    description: >-
      Move the order one stage forward along the declared successor map, including the rework hop
      QC_FAILED -> REPAIR. Every hop requires authorization_posture == OPEN; the hop into
      REFINISH_CALIBRATION additionally requires all parts on the car and all structural procedures
      documented, and the hop into READY_FOR_QC requires every calibration PASSED.
    roles: [Technician]
    code: 200
    input: [to_stage]
    output: RepairOrder
    side_effects: ["stage moves to to_stage", "SCHEDULED assignments for the entered stage -> ACTIVE; ACTIVE assignments for the left stage -> COMPLETED, releasing their stall minutes", "increments RepairOrder.version and each touched StageAssignment.version and Stall.version"]
  - method: POST
    path: "/repair-orders/{id}/qc-inspections"
    description: >-
      Post-repair quality control with a post-repair scan. PASS needs a clean checklist and zero DTCs
      and issues the warranty certificate; any failure sends the order to QC_FAILED. The inspector may
      not be the user who blueprinted the order.
    roles: [QcInspector]
    code: 201
    input: [checklist_passed, post_scan_dtc_count, "scan_report_ref?"]
    output: QcInspection
    side_effects: ["result = PASS only when checklist_passed is true and post_scan_dtc_count is 0, else FAIL with failure_reason CHECKLIST (which outranks DTC_PRESENT)", "sequence_number = qc_inspection_count + 1; PASS issues warranty_certificate_number \"WC-<claim_number>-<sequence_number>\" and warranty_expires_at = logical clock + 1095 days", "FAIL drives stage READY_FOR_QC -> QC_FAILED", "recomputes RepairOrder.qc_inspection_count and increments RepairOrder.version"]
  - method: GET
    path: "/repair-orders/{id}/qc-inspections"
    description: "Every inspection on the order, ordered by sequence_number. Reverse lookup from RepairOrder.id to QcInspection."
    roles: [ShopAdmin, QcInspector, InsurerAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: QcInspection[]
    side_effects: []
  - method: GET
    path: "/repair-orders/{id}/cycle-time"
    description: >-
      Computed read of calculations.cycle_time_metrics. gross_minutes is keys-to-keys wall time;
      net_touch_minutes subtracts the MERGED union of supplement waits and parts delays, so two
      overlapping hold-ups are charged once. supplement_wait_minutes and parts_delay_minutes are the
      un-merged per-source sums and may add up to more than excluded_minutes.
    roles: [ShopAdmin, Estimator]
    code: 200
    input: []
    output: { gross_minutes: integer, net_touch_minutes: integer, excluded_minutes: integer, supplement_wait_minutes: integer, parts_delay_minutes: integer, open_interval_count: integer }
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/deliver"
    description: "Release the vehicle. Requires a passing latest inspection, no open parts delay and an OPEN posture; stamps delivered_at, which freezes the cycle-time window."
    roles: [ShopAdmin]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["stage READY_FOR_QC -> DELIVERED (terminal)", "stamps delivered_at", "every StageAssignment IN {SCHEDULED, ACTIVE} -> COMPLETED, releasing stall minutes", "increments RepairOrder.version and each touched StageAssignment.version and Stall.version"]

# ---------------------------------------------------------------------------
# 1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty or blank"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is unknown, or is a declared role that the endpoint's roles list does not include"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an InsurerAdjuster acting on an order whose insurer_id is not their X-User-ID, or a Customer acting on an order whose customer_id is not their X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the QcInspector's X-User-ID equals RepairOrder.blueprint_by_user_id"
  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or null, a field has the wrong JSON type, an unknown field is supplied, or a numeric bound on the field itself is violated (guide_hours <= 0, qty < 1, list_price_cents <= 0, requested_amount_cents <= 0, negative dtc count, discount_pct outside [0,1), rate_ceiling_cents missing a labor_type key)"
  - id: ERR_INVALID_ENUM_VALUE
    http: 400
    condition: "an enum-typed input or enum filter parameter holds a value outside that enum's declared members"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit < 1, limit > 100, offset < 0, or either not an integer"
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "window_end is not strictly after window_start, or either timestamp is not a valid ISO-8601 instant"
  # existence
  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http: 404
    condition: "no RepairOrder with the given id"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "no Customer with the given customer_id"
  - id: ERR_INSURER_NOT_FOUND
    http: 404
    condition: "no Insurer with the given insurer_id"
  - id: ERR_ESTIMATE_LINE_NOT_FOUND
    http: 404
    condition: "no EstimateLine with the given id"
  - id: ERR_DAMAGE_LINE_NOT_FOUND
    http: 404
    condition: "no DamageLine with the given damage_line_id, or it belongs to a different RepairOrder"
  - id: ERR_SUPPLEMENT_NOT_FOUND
    http: 404
    condition: "no Supplement with the given id, or the supplement_id belongs to a different RepairOrder"
  - id: ERR_PARTS_VENDOR_NOT_FOUND
    http: 404
    condition: "no PartsVendor with the given vendor_id"
  - id: ERR_PARTS_LINE_NOT_FOUND
    http: 404
    condition: "no PartsLine with the given id"
  - id: ERR_PROCEDURE_RECORD_NOT_FOUND
    http: 404
    condition: "no ProcedureRecord with the given id"
  - id: ERR_CALIBRATION_BAY_NOT_FOUND
    http: 404
    condition: "no CalibrationBay with the given bay_id"
  - id: ERR_STALL_NOT_FOUND
    http: 404
    condition: "no Stall with the given stall_id"
  - id: ERR_STAGE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no StageAssignment with the given id"
  # optimistic concurrency
  - id: ERR_STALE_REPAIR_ORDER_VERSION
    http: 412
    condition: "expected_repair_order_version does not equal the current RepairOrder.version on POST /repair-orders/{id}/supplements or POST /repair-orders/{id}/consent-decisions"
  # state
  - id: ERR_ORDER_TERMINAL
    http: 409
    condition: "the RepairOrder is DELIVERED or TOTAL_LOSS and any further mutation is attempted on it or on one of its children"
  - id: ERR_STAGE_PRECONDITION
    http: 409
    condition: "RepairOrder.stage is outside the operation's declared from-state set"
  - id: ERR_STAGE_SEQUENCE_INVALID
    http: 409
    condition: "to_stage is not the declared successor of the current stage, including an attempt to re-enter the current stage or to skip a stage"
  - id: ERR_PARTS_LINE_STATE
    http: 409
    condition: "PartsLine.procurement_status is outside the operation's declared from-state set (e.g. accepting a price on a COUNTERED line, installing an ORDERED line, returning a PRICE_LOCKED line)"
  - id: ERR_AUTHORIZATION_POSTURE_BLOCKED
    http: 409
    condition: "RepairOrder.authorization_posture is SUPPLEMENT_PENDING or CONSENT_REQUIRED when a stage advance, delivery or parts order is attempted"
  - id: ERR_SUPPLEMENT_NOT_OPEN
    http: 409
    condition: "a decision is attempted on a Supplement that is not SUBMITTED, or a resubmit on one that is not INFO_REQUESTED"
  - id: ERR_CALIBRATION_STATE
    http: 409
    condition: "scheduling a ProcedureRecord that is not REQUIRED or FAILED, or recording a result on one that is not SCHEDULED"
  - id: ERR_ASSIGNMENT_NOT_SCHEDULED
    http: 409
    condition: "cancelling a StageAssignment whose status is not SCHEDULED"
  # safety and compliance
  - id: ERR_CALIBRATION_NOT_VERIFIED
    http: 422
    condition: "a ProcedureRecord on the order has requires_calibration true and calibration_status other than PASSED when READY_FOR_QC is entered or an inspection is filed"
  - id: ERR_PROCEDURE_ADHERENCE_MISSING
    http: 422
    condition: "a ProcedureRecord in scope has adherence_documented false - STRUCTURAL records when leaving REPAIR, every record at QC"
  - id: ERR_ADAS_PROCEDURE_RESEARCH_MISSING
    http: 422
    condition: "blueprinting an order that has a DamageLine with adas_component_touched true but no ProcedureRecord with operation_scope ADAS and requires_calibration true"
  - id: ERR_NOT_INCLUDED_JUSTIFICATION_MISSING
    http: 422
    condition: "locking an estimate that contains a not_included_operation line with no justification_note"
  # referential policy
  - id: ERR_VENDOR_SUSPENDED
    http: 422
    condition: "ordering from a PartsVendor whose status is SUSPENDED"
  - id: ERR_PART_TYPE_NOT_OFFERED
    http: 422
    condition: "quoting a part_type that is not in the vendor's part_types_offered"
  - id: ERR_PART_TYPE_NOT_ALLOWED_BY_INSURER
    http: 422
    condition: "creating a PartsLine whose part_type the insurer program forbids outright (aftermarket_allowed, recycled_allowed or reconditioned_allowed false)"
  - id: ERR_STALL_TYPE_MISMATCH
    http: 422
    condition: "booking a REPAIR stage into a PAINT stall, or a REFINISH_CALIBRATION stage into a BODY or FRAME stall"
  - id: ERR_BAY_TYPE_UNSUPPORTED
    http: 422
    condition: "the ProcedureRecord's calibration_type is not in the bay's supported_types; a record of type BOTH requires a bay listing BOTH"
  - id: ERR_STALL_UNAVAILABLE
    http: 422
    condition: "booking a Stall whose status is MAINTENANCE"
  # constraint satisfaction
  - id: ERR_VENDOR_QTY_CAP_EXCEEDED
    http: 422
    condition: "PartsLine.qty exceeds PartsVendor.max_qty_per_line at order time"
  - id: ERR_STALL_WINDOW_CONFLICT
    http: 409
    condition: "the requested stall window comes within Stall.cleanup_buffer_minutes (inclusive on both sides) of an existing SCHEDULED or ACTIVE booking on that stall"
  - id: ERR_CALIBRATION_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of SCHEDULED ProcedureRecord windows on the bay that strictly overlap the requested half-open window already equals concurrent_capacity"
  - id: ERR_SUPPLEMENT_ROUND_LIMIT
    http: 422
    condition: "resubmitting a Supplement whose round_count already equals Insurer.supplement_round_limit"
  - id: ERR_NO_TEARDOWN_FINDINGS
    http: 422
    condition: "blueprinting an order with teardown_finding_count 0"
  - id: ERR_NO_ESTIMATE_LINES
    http: 422
    condition: "locking an estimate with no DRAFT EstimateLine on the order"
  - id: ERR_PARTS_NOT_PROCURED
    http: 422
    condition: "advancing to PARTS_STAGED while a PartsLine is still PLANNED, QUOTED, COUNTERED or PRICE_LOCKED"
  - id: ERR_PARTS_NOT_INSTALLED
    http: 422
    condition: "advancing to REFINISH_CALIBRATION, or filing an inspection, while a PartsLine is still ORDERED or RECEIVED"
  - id: ERR_NO_STAGE_ASSIGNMENT
    http: 422
    condition: "advancing into REPAIR or REFINISH_CALIBRATION with no SCHEDULED StageAssignment for that stage on the order"
  - id: ERR_INVALID_RETURN_QUANTITY
    http: 422
    condition: "return_qty is not in 1..(received_qty - returned_qty)"
  - id: ERR_INVALID_RECEIVE_QUANTITY
    http: 422
    condition: "received_qty is not in 1..qty on receipt, or no un-returned unit remains at installation"
  - id: ERR_COUNTER_NOT_LOWER
    http: 422
    condition: "counter_unit_price_cents is greater than or equal to the standing quoted_unit_price_cents"
  - id: ERR_VENDOR_MISMATCH
    http: 422
    condition: "a revised quote on a COUNTERED line names a vendor_id other than the one already on the line"
  - id: ERR_CUSTOMER_CONSENT_REQUIRED
    http: 422
    condition: "ordering a PartsLine whose authorization_status is PENDING_CONSENT or CUSTOMER_DECLINED"
  - id: ERR_OEM_UPGRADE_NOT_APPLICABLE
    http: 422
    condition: "oem_upgrade true on a non-OEM line, or on an OEM line whose insurer allows no alternate type, or whose vehicle is younger than alternate_parts_min_vehicle_age_years"
  - id: ERR_QC_NOT_PASSED
    http: 409
    condition: "delivering an order whose highest-sequence_number QcInspection has result FAIL, or that has no inspection at all"
  - id: ERR_OPEN_PARTS_DELAY
    http: 409
    condition: "delivering an order whose open_parts_delay_count is greater than 0"
  - id: ERR_INVALID_PARTIAL_AMOUNT
    http: 422
    condition: "a PARTIAL decision whose approved_amount_cents is 0, negative, or greater than or equal to requested_amount_cents; or an APPROVE/DENY decision carrying an amount"
  - id: ERR_SUPPLEMENT_REQUIRED
    http: 422
    condition: "adding an EstimateLine with no supplement_id once RepairOrder.stage is past BLUEPRINTED"
  # fiscal
  - id: ERR_PARTS_PRICE_CEILING_EXCEEDED
    http: 422
    condition: "quoted_unit_price_cents exceeds round_half_up(list_price_cents * Insurer.parts_price_ceiling_pct) at price acceptance"
  - id: ERR_VENDOR_SCORE_BELOW_FLOOR
    http: 422
    condition: "PartsVendor.fulfillment_score_rolling is below 40 at order time"
  - id: ERR_AUTHORIZED_AMOUNT_EXCEEDED
    http: 402
    condition: "the order would leave RepairOrder.customer_pay_cents above deductible_cents + betterment_cents, i.e. beyond what the insurer authorised and the customer agreed"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ShopAdmin
    description: "Front-office operator: builds the static registries, opens repair orders, watches cycle time and releases the finished vehicle."
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /insurers"
      - "POST /stalls"
      - "POST /calibration-bays"
      - "POST /_clock/set_current_utc"
      - "POST /repair-orders"
      - "POST /repair-orders/{id}/deliver"
    shared_operations:
      - "POST /parts-vendors (with PartsManager)"
      - "GET /repair-orders, GET /repair-orders/{id}, GET /repair-orders/{id}/cycle-time"
      - "GET /customers/{id}, GET /insurers/{id}, GET /stalls/{id}, GET /calibration-bays/{id}, GET /parts-vendors/{id}"
      - "GET /repair-orders/{id}/damage-lines, /supplements, /qc-inspections, /parts-delay-events"
      - "GET /supplements/{id}, GET /stage-assignments, GET /stage-assignments/{id}, GET /parts-lines/{id}/parts-delay-events"
  - name: Estimator
    description: "Damage analyst: records teardown findings, publishes the blueprint, builds and locks the estimate, declares total loss and raises supplements."
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders/{id}/teardown-findings"
      - "POST /repair-orders/{id}/blueprint"
      - "POST /repair-orders/{id}/estimate-lines"
      - "POST /repair-orders/{id}/estimate/lock"
      - "POST /repair-orders/{id}/total-loss"
      - "POST /repair-orders/{id}/supplements"
      - "POST /supplements/{id}/resubmit"
    shared_operations:
      - "POST /repair-orders/{id}/procedure-records (with Technician)"
      - "GET /repair-orders, GET /repair-orders/{id}, GET /repair-orders/{id}/cycle-time"
      - "GET /estimate-lines, GET /estimate-lines/{id}, GET /parts-lines, GET /parts-lines/{id}"
      - "GET /procedure-records, GET /procedure-records/{id}, GET /supplements/{id}"
      - "GET /repair-orders/{id}/damage-lines, /supplements"
      - "GET /customers/{id}, GET /insurers/{id}"
    note: >-
      Segregation of duties: the X-User-ID that blueprints an order is stamped into
      blueprint_by_user_id and is refused at POST /repair-orders/{id}/qc-inspections even if that
      person also holds the QcInspector role.
  - name: PartsManager
    description: "Procurement operator: chooses part types, negotiates prices, orders, receives, returns and runs the late-parts sweep."
    identity: opaque
    exclusive_operations:
      - "POST /estimate-lines/{id}/parts-lines"
      - "POST /parts-lines/{id}/quote"
      - "POST /parts-lines/{id}/counter-offer"
      - "POST /parts-lines/{id}/accept-price"
      - "POST /parts-lines/{id}/order"
      - "POST /parts-lines/{id}/receive"
      - "POST /parts-lines/{id}/return"
      - "POST /repair-orders/{id}/parts-delay-sweep"
    shared_operations:
      - "POST /parts-vendors (with ShopAdmin)"
      - "GET /parts-vendors/{id}, GET /parts-lines, GET /parts-lines/{id}"
      - "GET /estimate-lines, GET /estimate-lines/{id}"
      - "GET /repair-orders, GET /repair-orders/{id}"
      - "GET /repair-orders/{id}/parts-delay-events, GET /parts-lines/{id}/parts-delay-events"
  - name: Technician
    description: "Production operator: books stalls, drives the stage progression, installs parts, documents procedure adherence and runs ADAS calibration."
    identity: opaque
    exclusive_operations:
      - "POST /parts-lines/{id}/install"
      - "POST /repair-orders/{id}/stage-assignments"
      - "POST /stage-assignments/{id}/cancel"
      - "POST /repair-orders/{id}/stage-advance"
      - "PATCH /procedure-records/{id}"
      - "POST /procedure-records/{id}/calibration-schedule"
      - "POST /procedure-records/{id}/calibration-result"
    shared_operations:
      - "POST /repair-orders/{id}/procedure-records (with Estimator)"
      - "GET /repair-orders/{id}, GET /repair-orders/{id}/damage-lines"
      - "GET /parts-lines, GET /parts-lines/{id}"
      - "GET /procedure-records, GET /procedure-records/{id}"
      - "GET /stalls/{id}, GET /calibration-bays/{id}, GET /stage-assignments, GET /stage-assignments/{id}"
  - name: QcInspector
    description: "Quality gate: files the post-repair inspection and post-repair scan that issues or withholds the warranty."
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders/{id}/qc-inspections"
    shared_operations:
      - "GET /repair-orders/{id}, GET /repair-orders/{id}/qc-inspections"
      - "GET /procedure-records, GET /procedure-records/{id}"
  - name: InsurerAdjuster
    description: "Outside payer: answers supplements on the orders that belong to their own program and reads the estimate they are funding."
    identity: "entity_backed:Insurer"
    exclusive_operations:
      - "POST /supplements/{id}/decision"
    shared_operations:
      - "GET /repair-orders/{id} (own orders only)"
      - "GET /repair-orders/{id}/supplements, GET /supplements/{id}, GET /repair-orders/{id}/qc-inspections"
      - "GET /estimate-lines, GET /estimate-lines/{id}"
    note: "X-User-ID is an Insurer.id; every read and write is refused with ERR_NOT_RESOURCE_OWNER unless it equals RepairOrder.insurer_id."
  - name: Customer
    description: "Vehicle owner: records or refuses consent for their own share of the bill and for alternate parts."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /repair-orders/{id}/consent-decisions"
    shared_operations:
      - "GET /repair-orders/{id} (own order only)"
    note: "X-User-ID is a Customer.id; every call is refused with ERR_NOT_RESOURCE_OWNER unless it equals RepairOrder.customer_id."
