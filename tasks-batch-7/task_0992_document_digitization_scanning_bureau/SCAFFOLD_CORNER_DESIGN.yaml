            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${b1}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
