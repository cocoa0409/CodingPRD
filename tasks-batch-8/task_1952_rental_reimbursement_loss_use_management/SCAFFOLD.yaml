# =============================================================================
# Task 1952: Rental Reimbursement & Loss-of-Use Management — scaffold seed tables
# Insurer rental management desk. Flat topology, segregation-of-duties role model,
# parallel claim state dimensions, OCC on Claim/RentalReservation/Invoice.
# =============================================================================

scenario: |
  1952. Rental Reimbursement & Loss-of-Use Management (insurer rental management desk): coverage verification & daily limit/duration cap, reservation with rental partner & direct billing, extension approval tied to repair milestones, downgrade/upgrade cost responsibility, loss-of-use claim for non-owned vehicles, unnecessary rental day recovery, invoice audit against authorized period, customer communication & expectation setting

domain_name: rental-reimbursement-loss-use
api_prefix: ""

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel   # Claim rental_track_status x loss_of_use_track_status; plus cyclic Reservation loop and branching Invoice
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (14 entities)
# All date fields are ISO 8601 calendar dates (YYYY-MM-DD); all intervals over
# dates are HALF-OPEN [start, end) unless a validation explicitly pins CLOSED
# semantics (see validations priority 12 for the loss-of-use conflict rule).
# =============================================================================
entities:
  - name: PolicyHolder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Policy holder full legal name" }
      - { name: policy_number, type: string, source: input, description: "Policy number; unique across all policy holders", constraints: "unique; duplicate -> ERR_DUPLICATE_POLICY_NUMBER" }
      - { name: contact_email, type: string, source: input, description: "Customer contact email" }

  - name: RepairShop
    parent: null
    common_fields: true
    fields:
      - { name: shop_name, type: string, source: input, description: "Repair facility name" }
      - { name: shop_code, type: string, source: input, description: "Shop code; unique across all repair shops", constraints: "unique; duplicate -> ERR_DUPLICATE_SHOP_CODE" }

  - name: RentalPartner
    parent: null
    common_fields: true
    fields:
      - { name: partner_name, type: string, source: input, description: "Rental partner company name" }
      - { name: partner_code, type: string, source: input, description: "Partner code; unique across all rental partners", constraints: "unique; duplicate -> ERR_DUPLICATE_PARTNER_CODE" }
      - { name: economy_rate_cents, type: integer, source: input, description: "Direct-bill daily rate for ECONOMY class, cents; must be > 0" }
      - { name: standard_rate_cents, type: integer, source: input, description: "Direct-bill daily rate for STANDARD class, cents; must be > 0" }
      - { name: premium_rate_cents, type: integer, source: input, description: "Direct-bill daily rate for PREMIUM class, cents; must be > 0" }
      - { name: economy_capacity, type: integer, source: input, description: "Fleet capacity in ECONOMY class (vehicles rentable per calendar day); must be >= 0" }
      - { name: standard_capacity, type: integer, source: input, description: "Fleet capacity in STANDARD class; must be >= 0" }
      - { name: premium_capacity, type: integer, source: input, description: "Fleet capacity in PREMIUM class; must be >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; starts ACTIVE", constraints: "ACTIVE | SUSPENDED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: input, description: "FK -> PolicyHolder.id; claimant" }
      - { name: incident_date, type: string, source: input, description: "ISO date of the covered loss" }
      - { name: coverage_daily_limit_cents, type: integer, source: input, description: "Rental coverage daily limit, cents; insurer pays at most this per authorized day" }
      - { name: coverage_duration_cap_days, type: integer, source: input, description: "Rental coverage duration cap in days; total authorized days across the claim may not exceed this" }
      - { name: loss_of_use_per_diem_cents, type: integer, source: input, description: "Loss-of-use standard per-diem, cents" }
      - { name: rental_reserve_cents, type: integer, source: computed, description: "Derived open rental exposure; initialized to coverage_daily_limit_cents x coverage_duration_cap_days; maintained by rental_reserve_reconciliation" }
      - { name: authorized_days_total, type: integer, source: computed, description: "Sum of authorized_days over reservations in {AUTHORIZED, ACTIVE, EXTENSION_REVIEW, RETURNED}" }
      - { name: recovery_balance_cents, type: integer, source: computed, description: "Sum of outstanding_amount_cents over recovery cases in {OPEN, PARTIAL_RECOVERY}" }
      - { name: rental_track_status, type: enum, source: system, description: "Rental benefit track, independent dimension", constraints: "OPEN | COVERAGE_VERIFIED | COVERAGE_DENIED | RENTAL_ACTIVE | RENTAL_CLOSED" }
      - { name: loss_of_use_track_status, type: enum, source: system, description: "Loss-of-use track, independent dimension", constraints: "NONE | LOU_SUBMITTED | LOU_DOCUMENTED | LOU_APPROVED | LOU_PAID | LOU_DENIED" }
      - { name: overall_status, type: enum, source: system, description: "Claim lifecycle gate", constraints: "OPEN | SETTLED | CLOSED" }

  - name: CoverageVerification
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: status, type: enum, source: system, description: "PENDING at create; VERIFIED/DENIED after decide; SUPERSEDED when a newer PENDING verification is created", constraints: "PENDING | VERIFIED | DENIED | SUPERSEDED" }
      - { name: rental_eligible, type: boolean, source: input, description: "Set at decide: rental reimbursement benefit eligible" }
      - { name: loss_of_use_eligible, type: boolean, source: input, description: "Set at decide: loss-of-use benefit eligible" }
      - { name: denial_reason, type: string, source: input, description: "Required when decision=DENIED", default: null }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: shop_id, type: string, source: system, description: "FK -> RepairShop.id; set from X-User-ID of the RepairShop caller" }
      - { name: estimated_completion_date, type: string, source: input, description: "ISO date; current estimated completion; updated by DELAY_REPORTED milestones" }
      - { name: actual_completion_date, type: string, source: system, description: "ISO date; set from logical clock on complete; null until COMPLETED", default: null }
      - { name: labor_hours_estimate, type: integer, source: input, description: "Estimated labor hours; must be > 0" }
      - { name: status, type: enum, source: system, description: "ESTIMATE_SUBMITTED -> APPROVED -> IN_PROGRESS -> COMPLETED", constraints: "ESTIMATE_SUBMITTED | APPROVED | IN_PROGRESS | COMPLETED" }

  - name: RepairMilestone
    parent: null
    common_fields: false
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id" }
      - { name: milestone_type, type: enum, source: input, description: "Milestone kind", constraints: "REPAIR_STARTED | PARTS_DELAYED | DELAY_REPORTED | REPAIR_COMPLETED" }
      - { name: reported_at, type: datetime, source: system, description: "Set from logical clock at creation" }
      - { name: new_estimated_completion_date, type: string, source: input, description: "Required iff milestone_type=DELAY_REPORTED; must be strictly later than the order's current estimated_completion_date", default: null }
      - { name: note, type: string, source: input, description: "Free-text note", default: null }

  - name: RentalReservation
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: rental_partner_id, type: string, source: input, description: "FK -> RentalPartner.id" }
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; the repair this rental substitutes for" }
      - { name: vehicle_class, type: enum, source: input, description: "Booked class", constraints: "ECONOMY | STANDARD | PREMIUM" }
      - { name: pickup_date, type: string, source: input, description: "ISO date; half-open interval start; must be >= current logical clock date" }
      - { name: authorized_return_date, type: string, source: input, description: "ISO date; half-open interval end; must be > pickup_date; extended by approved extensions" }
      - { name: actual_pickup_date, type: string, source: system, description: "ISO date from logical clock at activate; null until ACTIVE", default: null }
      - { name: actual_return_date, type: string, source: system, description: "ISO date from logical clock at return; null until RETURNED", default: null }
      - { name: rate_card_snapshot, type: object, source: computed, description: "{ECONOMY, STANDARD, PREMIUM} rates copied from the partner at creation; immutable thereafter" }
      - { name: daily_rate_cents, type: integer, source: computed, description: "Currently applicable daily rate = rate_card_snapshot[vehicle_class]; updated by class changes" }
      - { name: authorized_days, type: integer, source: computed, description: "(authorized_return_date - pickup_date).days, half-open" }
      - { name: consumed_days, type: integer, source: computed, description: "(actual_return_date - actual_pickup_date).days; null until RETURNED", default: null }
      - { name: unnecessary_days, type: integer, source: computed, description: "Days kept beyond repair completion + RETURN_GRACE_DAYS; 0 when repair not COMPLETED", default: 0 }
      - { name: estimated_charge_cents, type: integer, source: computed, description: "Provisional forward-looking estimate (see rental_charge_provisional)" }
      - { name: audited_charge_cents, type: integer, source: computed, description: "Sum of audited_payable_cents over SETTLED invoices for this reservation", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> AUTHORIZED -> ACTIVE -> EXTENSION_REVIEW <-> ACTIVE loop -> RETURNED -> CLOSED; AUTHORIZED/DRAFT -> CANCELLED", constraints: "DRAFT | AUTHORIZED | ACTIVE | EXTENSION_REVIEW | RETURNED | CLOSED | CANCELLED" }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> RentalReservation.id" }
      - { name: milestone_id, type: string, source: input, description: "FK -> RepairMilestone.id; must reference a DELAY_REPORTED milestone on the reservation's repair order" }
      - { name: requested_additional_days, type: integer, source: input, description: "Requested extra days; must be >= 1" }
      - { name: granted_days, type: integer, source: computed, description: "Set by extension_day_grant on approve; null until APPROVED", default: null }
      - { name: decision_reason, type: string, source: input, description: "Optional reason recorded at deny", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED | DENIED | SUPERSEDED (superseded when a newer request is created on the same reservation)", constraints: "SUBMITTED | APPROVED | DENIED | SUPERSEDED" }

  - name: ClassChangeRecord
    parent: null
    common_fields: false
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> RentalReservation.id" }
      - { name: from_class, type: enum, source: computed, description: "Class before the change", constraints: "ECONOMY | STANDARD | PREMIUM" }
      - { name: to_class, type: enum, source: input, description: "Class after the change; must differ from current class", constraints: "ECONOMY | STANDARD | PREMIUM" }
      - { name: effective_date, type: string, source: input, description: "ISO date the new rate applies from (inclusive); must satisfy pickup_date <= effective_date < authorized_return_date" }
      - { name: upgrade_waiver, type: boolean, source: input, description: "Insurer waives the customer-paid upgrade differential (e.g., no comparable vehicle available)", default: false }
      - { name: per_day_customer_cents, type: integer, source: computed, description: "Per-day customer responsibility (0 for downgrades and waived upgrades)" }
      - { name: customer_responsibility_cents, type: integer, source: computed, description: "per_day_customer_cents x remaining_days (see class_change_cost_responsibility)" }
      - { name: insurer_delta_cents, type: integer, source: computed, description: "Signed insurer cost delta applied to estimated_charge_cents and rental_reserve_cents" }

  - name: LossOfUseClaim
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: vehicle_description, type: string, source: input, description: "Description of the non-owned vehicle used" }
      - { name: period_start, type: string, source: input, description: "ISO date; CLOSED-interval start" }
      - { name: period_end, type: string, source: input, description: "ISO date; CLOSED-interval end; must be >= period_start" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Documented actual cost claimed; must be > 0" }
      - { name: payout_method, type: enum, source: input, description: "Payout variant selector", constraints: "STANDARD_PER_DIEM | COMPARABLE_VEHICLE" }
      - { name: documentation_provided, type: boolean, source: system, description: "false until attach-documentation", default: false }
      - { name: payout_cents, type: integer, source: computed, description: "Set by loss_of_use_payout on approve; null until APPROVED", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> DOCUMENTED -> APPROVED -> PAID; SUBMITTED/DOCUMENTED -> DENIED", constraints: "SUBMITTED | DOCUMENTED | APPROVED | PAID | DENIED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> RentalReservation.id" }
      - { name: rental_partner_id, type: string, source: system, description: "FK -> RentalPartner.id; set from X-User-ID of the RentalPartner caller; must own the reservation" }
      - { name: invoice_number, type: string, source: input, description: "Partner invoice number; unique per rental partner", constraints: "unique per partner; duplicate -> ERR_DUPLICATE_INVOICE_NUMBER" }
      - { name: period_start, type: string, source: input, description: "ISO date; half-open billing period start" }
      - { name: period_end, type: string, source: input, description: "ISO date; half-open billing period end; must be > period_start" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Billed daily rate, cents; must be > 0" }
      - { name: tax_cents, type: integer, source: input, description: "Billed tax total, cents; must be >= 0" }
      - { name: fees_cents, type: integer, source: input, description: "Billed fees total, cents; must be >= 0; only up to DOCUMENTATION_FEE_CAP_CENTS is payable" }
      - { name: total_cents, type: integer, source: computed, description: "days x daily_rate_cents + tax_cents + fees_cents (submitted total)" }
      - { name: audited_payable_cents, type: integer, source: computed, description: "Result of audited_charge_final; set at ingestion for AUTO_APPROVED, at audit-decision otherwise; null until computed", default: null }
      - { name: unauthorized_days, type: integer, source: computed, description: "Invoice days outside the reservation's authorized window [pickup_date, authorized_return_date)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> AUTO_APPROVED | MANUAL_REVIEW (system fork at ingestion); MANUAL_REVIEW -> AUTO_APPROVED (audit approve/adjust) | DISPUTED (audit dispute); AUTO_APPROVED/DISPUTED -> SETTLED", constraints: "SUBMITTED | AUTO_APPROVED | MANUAL_REVIEW | DISPUTED | SETTLED" }

  - name: RecoveryCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: computed, description: "FK -> Claim.id; copied from the reservation at creation" }
      - { name: reservation_id, type: string, source: computed, description: "FK -> RentalReservation.id; the reservation whose days are recovered" }
      - { name: source, type: enum, source: system, description: "RETURN_OVERSTAY (created at return) | INVOICE_DISPUTE (created at audit-decision dispute)", constraints: "RETURN_OVERSTAY | INVOICE_DISPUTE" }
      - { name: unnecessary_days, type: integer, source: computed, description: "Days being recovered" }
      - { name: assessed_amount_cents, type: integer, source: computed, description: "unnecessary_days x min(daily_rate basis, coverage_daily_limit_cents); see unnecessary_rental_days_assessment" }
      - { name: recovered_amount_cents, type: integer, source: computed, description: "Sum of recorded payments", default: 0 }
      - { name: waived_amount_cents, type: integer, source: computed, description: "Amount waived at waive (waive sets this to the then-outstanding amount)", default: 0 }
      - { name: outstanding_amount_cents, type: integer, source: computed, description: "assessed_amount_cents - recovered_amount_cents - waived_amount_cents" }
      - { name: status, type: enum, source: system, description: "OPEN -> PARTIAL_RECOVERY (0 < recovered < outstanding) -> CLOSED (outstanding hits 0 via payments); OPEN/PARTIAL_RECOVERY -> WAIVED", constraints: "OPEN | PARTIAL_RECOVERY | CLOSED | WAIVED" }

  - name: CommunicationLog
    parent: null
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: channel, type: enum, source: input, description: "Delivery channel", constraints: "EMAIL | SMS | PHONE" }
      - { name: template, type: enum, source: input, description: "Message template", constraints: "COVERAGE_EXPLAINED | EXPECTATION_SET | EXTENSION_UPDATE | RETURN_REMINDER | RECOVERY_NOTICE" }
      - { name: body_summary, type: string, source: input, description: "Summary of the message body" }
      - { name: sent_at, type: datetime, source: system, description: "Set from logical clock at creation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: "overall_status=OPEN, rental_track_status=OPEN, loss_of_use_track_status=NONE (three independent dimensions)"
    terminal_states: ["overall_status=CLOSED"]
    transitions:
      - from: "rental_track_status=OPEN"
        to: "rental_track_status=COVERAGE_VERIFIED"
        trigger: POST /coverage-verifications/{id}/decide with decision=VERIFIED and rental_eligible=true
        actor: ClaimsAdjuster
        preconditions: ["verification status == PENDING (else ERR_VERIFICATION_ALREADY_DECIDED)"]
        side_effects: ["Claim.version += 1", "Claim.updated_at refreshed"]
      - from: "rental_track_status=OPEN"
        to: "rental_track_status=COVERAGE_DENIED"
        trigger: POST /coverage-verifications/{id}/decide with decision=DENIED (or VERIFIED with rental_eligible=false)
        actor: ClaimsAdjuster
        preconditions: ["verification status == PENDING"]
        side_effects: ["Claim.version += 1"]
      - from: "rental_track_status=COVERAGE_VERIFIED"
        to: "rental_track_status=RENTAL_ACTIVE"
        trigger: "system (automatic when the claim's first reservation reaches ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["Claim.version += 1"]
      - from: "rental_track_status=RENTAL_ACTIVE"
        to: "rental_track_status=RENTAL_CLOSED"
        trigger: "system (automatic when every reservation on the claim is terminal (CLOSED or CANCELLED) and at least one reservation exists)"
        actor: system
        preconditions: []
        side_effects: ["Claim.version += 1"]
      - from: "loss_of_use_track_status=NONE"
        to: "loss_of_use_track_status=LOU_SUBMITTED"
        trigger: POST /loss-of-use-claims (creation)
        actor: Customer
        preconditions: ["latest non-SUPERSEDED verification is VERIFIED with loss_of_use_eligible=true (else ERR_LOU_NOT_ELIGIBLE)"]
        side_effects: ["Claim.version += 1"]
      - from: "loss_of_use_track_status=LOU_SUBMITTED"
        to: "loss_of_use_track_status=LOU_DOCUMENTED"
        trigger: POST /loss-of-use-claims/{id}/attach-documentation
        actor: Customer
        preconditions: []
        side_effects: ["Claim.version += 1"]
      - from: "loss_of_use_track_status IN {LOU_SUBMITTED, LOU_DOCUMENTED}"
        to: "loss_of_use_track_status=LOU_APPROVED"
        trigger: POST /loss-of-use-claims/{id}/approve
        actor: ClaimsAdjuster
        preconditions: ["payout_method == COMPARABLE_VEHICLE requires documentation_provided == true (else ERR_DOCUMENTATION_REQUIRED)"]
        side_effects: ["loss_of_use_payout computed -> payout_cents", "Claim.version += 1"]
      - from: "loss_of_use_track_status=LOU_APPROVED"
        to: "loss_of_use_track_status=LOU_PAID"
        trigger: POST /loss-of-use-claims/{id}/pay
        actor: SettlementApprover
        preconditions: ["Claim.overall_status == OPEN (else ERR_CLAIM_NOT_OPEN)"]
        side_effects: ["Claim.version += 1"]
      - from: "loss_of_use_track_status IN {LOU_SUBMITTED, LOU_DOCUMENTED}"
        to: "loss_of_use_track_status=LOU_DENIED"
        trigger: POST /loss-of-use-claims/{id}/deny
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["Claim.version += 1"]
      - from: "overall_status=OPEN"
        to: "overall_status=SETTLED"
        trigger: POST /claims/{id}/settle
        actor: SettlementApprover
        preconditions:
          - "All reservations terminal (CLOSED or CANCELLED) or none exist"
          - "All loss-of-use claims terminal (PAID or DENIED) or none exist"
          - "recovery_balance_cents == 0 (else ERR_CLAIM_SETTLE_BLOCKED)"
        side_effects: ["Claim.version += 1"]
      - from: "overall_status=SETTLED"
        to: "overall_status=CLOSED"
        trigger: POST /claims/{id}/close
        actor: SettlementApprover
        preconditions: ["overall_status == SETTLED (else ERR_CLAIM_NOT_SETTLED)"]
        side_effects: ["Claim.version += 1"]
    note: "Parallel dimensions: rental_track_status and loss_of_use_track_status evolve independently under the overall_status gate."

  - entity: CoverageVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, DENIED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: POST /coverage-verifications/{id}/decide with decision=VERIFIED
        actor: ClaimsAdjuster
        preconditions: ["decision=VERIFIED requires rental_eligible OR loss_of_use_eligible true (else ERR_INVALID_REQUEST)"]
        side_effects: ["Claim rental_track_status updated per eligibility", "Claim.version += 1"]
      - from: PENDING
        to: DENIED
        trigger: POST /coverage-verifications/{id}/decide with decision=DENIED
        actor: ClaimsAdjuster
        preconditions: ["denial_reason must be present (else ERR_INVALID_REQUEST)"]
        side_effects: ["Claim.rental_track_status -> COVERAGE_DENIED", "Claim.version += 1"]
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (automatic when a new CoverageVerification is created for the same claim)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RepairOrder
    initial_state: ESTIMATE_SUBMITTED
    terminal_states: [COMPLETED]
    transitions:
      - from: ESTIMATE_SUBMITTED
        to: APPROVED
        trigger: POST /repair-orders/{id}/approve
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: POST /repair-orders/{id}/start
        actor: RepairShop
        preconditions: ["Caller shop must own the order (shop_id == X-User-ID, else ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /repair-orders/{id}/complete
        actor: RepairShop
        preconditions: ["Caller shop must own the order"]
        side_effects:
          - "actual_completion_date := logical clock date"
          - "For every reservation on this order in {ACTIVE, EXTENSION_REVIEW}: recompute unnecessary_days projection (no RecoveryCase until actual return)"

  - entity: RepairMilestone
    initial_state: "append-only; no status field"
    terminal_states: []
    transitions:
      - from: "(creation)"
        to: "(persisted)"
        trigger: POST /repair-orders/{id}/milestones
        actor: RepairShop
        preconditions:
          - "RepairOrder.status == IN_PROGRESS (else ERR_REPAIR_ORDER_INVALID_STATE)"
          - "Caller shop must own the order"
          - "milestone_type == DELAY_REPORTED requires new_estimated_completion_date strictly later than current estimated_completion_date (else ERR_INVALID_DELAY)"
        side_effects:
          - "If DELAY_REPORTED: RepairOrder.estimated_completion_date := new_estimated_completion_date; RepairOrder.version += 1"
          - "Then, for the reservation whose repair_order_id == this order and status == ACTIVE: status -> EXTENSION_REVIEW; version += 1"
          - "Then: create CommunicationLog(claim_id=reservation.claim_id, template=EXPECTATION_SET, channel=EMAIL, body_summary auto-generated); this is the third hop of the delay cascade"
          - "Claim.version += 1"

  - entity: RentalReservation
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: POST /rental-reservations/{id}/authorize
        actor: RentalDeskAgent
        preconditions:
          - "estimated_charge_cents <= Claim.rental_reserve_cents (else ERR_INSUFFICIENT_RESERVE)"
          - "authorized_days_total (including this reservation) <= coverage_duration_cap_days (else ERR_DURATION_CAP_EXHAUSTED)"
          - "Fleet capacity: for every day d in [pickup_date, authorized_return_date), count of partner reservations in {AUTHORIZED, ACTIVE, EXTENSION_REVIEW} with same vehicle_class occupying d must be < class capacity (else ERR_FLEET_CAPACITY_EXCEEDED)"
        side_effects:
          - "Claim.rental_reserve_cents -= estimated_charge_cents (via rental_reserve_reconciliation)"
          - "Claim.version += 1"
      - from: AUTHORIZED
        to: ACTIVE
        trigger: POST /rental-reservations/{id}/activate
        actor: RentalPartner
        preconditions:
          - "Caller partner must own the reservation (else ERR_NOT_RESOURCE_OWNER)"
          - "Logical clock date >= pickup_date (else ERR_ACTIVATION_BEFORE_PICKUP_DATE)"
        side_effects:
          - "actual_pickup_date := clock date"
          - "If claim's first ACTIVE reservation: Claim.rental_track_status -> RENTAL_ACTIVE"
      - from: ACTIVE
        to: EXTENSION_REVIEW
        trigger: "POST /extension-requests (creation) OR system on DELAY_REPORTED milestone"
        actor: "RentalDeskAgent | system"
        preconditions: []
        side_effects: ["RentalReservation.version += 1"]
      - from: EXTENSION_REVIEW
        to: ACTIVE
        trigger: POST /extension-requests/{id}/approve or POST /extension-requests/{id}/deny
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["On approve: extension_day_grant applied (authorized_return_date, authorized_days, estimated_charge_cents, reserve)", "RentalReservation.version += 1"]
      - from: "ACTIVE or EXTENSION_REVIEW"
        to: RETURNED
        trigger: POST /rental-reservations/{id}/return
        actor: RentalPartner
        preconditions:
          - "Caller partner must own the reservation"
          - "No SUBMITTED extension request on this reservation (else ERR_PENDING_EXTENSION_EXISTS)"
        side_effects:
          - "actual_return_date := clock date; consumed_days computed"
          - "unnecessary_rental_days_assessment runs; if unnecessary_days > 0: create RecoveryCase(source=RETURN_OVERSTAY, assessed_amount_cents = unnecessary_days x daily_rate_cents)"
          - "RecoveryCase creation bumps Claim.recovery_balance_cents by assessed_amount_cents and Claim.version += 1"
          - "estimated_charge_cents released from reserve term (status leaves {AUTHORIZED, ACTIVE, EXTENSION_REVIEW})"
      - from: RETURNED
        to: CLOSED
        trigger: POST /rental-reservations/{id}/close
        actor: RentalDeskAgent
        preconditions:
          - "Every invoice for this reservation is SETTLED (else ERR_RESERVATION_CLOSE_BLOCKED)"
          - "Every recovery case for this reservation is CLOSED or WAIVED, or none exist (else ERR_RESERVATION_CLOSE_BLOCKED)"
        side_effects:
          - "If all claim reservations now terminal: Claim.rental_track_status -> RENTAL_CLOSED"
      - from: "DRAFT or AUTHORIZED"
        to: CANCELLED
        trigger: POST /rental-reservations/{id}/cancel
        actor: RentalDeskAgent
        preconditions: []
        side_effects:
          - "If was AUTHORIZED: Claim.rental_reserve_cents += estimated_charge_cents (full compensating release)"
          - "Claim.version += 1"

  - entity: ExtensionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /extension-requests/{id}/approve
        actor: ClaimsAdjuster
        preconditions:
          - "Reservation status == EXTENSION_REVIEW (else ERR_RESERVATION_INVALID_STATE)"
          - "RepairOrder of the reservation status == IN_PROGRESS (else ERR_REPAIR_ORDER_INVALID_STATE)"
          - "granted_days > 0 per extension_day_grant (days_needed == 0 -> ERR_EXTENSION_NOT_JUSTIFIED; cap_remaining == 0 -> ERR_DURATION_CAP_EXHAUSTED)"
          - "grant cost (granted_days x daily_rate_cents) <= Claim.rental_reserve_cents (else ERR_INSUFFICIENT_RESERVE)"
          - "Fleet capacity re-checked for the added days (else ERR_FLEET_CAPACITY_EXCEEDED)"
        side_effects:
          - "RentalReservation.authorized_return_date += granted_days; authorized_days += granted_days; estimated_charge_cents += granted_days x daily_rate_cents"
          - "Claim.rental_reserve_cents -= granted_days x daily_rate_cents; Claim.version += 1"
          - "RentalReservation -> ACTIVE; version += 1"
          - "Create CommunicationLog(template=EXTENSION_UPDATE) on the claim"
      - from: SUBMITTED
        to: DENIED
        trigger: POST /extension-requests/{id}/deny
        actor: ClaimsAdjuster
        preconditions: ["Reservation status == EXTENSION_REVIEW"]
        side_effects: ["RentalReservation -> ACTIVE; version += 1", "Create CommunicationLog(template=EXTENSION_UPDATE) on the claim"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (automatic when a newer ExtensionRequest is created on the same reservation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClassChangeRecord
    initial_state: "append-only; no status field"
    terminal_states: []
    transitions:
      - from: "(creation)"
        to: "(persisted)"
        trigger: POST /class-changes
        actor: RentalDeskAgent
        preconditions:
          - "Reservation status IN {AUTHORIZED, ACTIVE, EXTENSION_REVIEW} (else ERR_RESERVATION_INVALID_STATE)"
          - "to_class != current vehicle_class (else ERR_INVALID_REQUEST)"
          - "pickup_date <= effective_date < authorized_return_date (else ERR_INVALID_PERIOD)"
        side_effects:
          - "class_change_cost_responsibility computed"
          - "RentalReservation.vehicle_class := to_class; daily_rate_cents := rate_card_snapshot[to_class]; estimated_charge_cents += insurer_delta_cents; version += 1"
          - "Claim.rental_reserve_cents -= insurer_delta_cents (negative delta credits the reserve); Claim.version += 1"

  - entity: LossOfUseClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: DOCUMENTED
        trigger: POST /loss-of-use-claims/{id}/attach-documentation
        actor: Customer
        preconditions: ["Caller policyholder must own the parent claim (else ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["documentation_provided := true", "Claim.loss_of_use_track_status -> LOU_DOCUMENTED"]
      - from: "SUBMITTED or DOCUMENTED"
        to: APPROVED
        trigger: POST /loss-of-use-claims/{id}/approve
        actor: ClaimsAdjuster
        preconditions: ["payout_method == COMPARABLE_VEHICLE requires documentation_provided == true (else ERR_DOCUMENTATION_REQUIRED)"]
        side_effects: ["loss_of_use_payout -> payout_cents", "Claim.loss_of_use_track_status -> LOU_APPROVED"]
      - from: APPROVED
        to: PAID
        trigger: POST /loss-of-use-claims/{id}/pay
        actor: SettlementApprover
        preconditions: ["Claim.overall_status == OPEN (else ERR_CLAIM_NOT_OPEN)"]
        side_effects: ["Claim.loss_of_use_track_status -> LOU_PAID"]
      - from: "SUBMITTED or DOCUMENTED"
        to: DENIED
        trigger: POST /loss-of-use-claims/{id}/deny
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["Claim.loss_of_use_track_status -> LOU_DENIED"]

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [SETTLED]
    transitions:
      - from: SUBMITTED
        to: AUTO_APPROVED
        trigger: "system (automatic at ingestion when the invoice matches the authorized window exactly; see invoice_auto_adjudication)"
        actor: system
        preconditions: []
        side_effects: ["audited_payable_cents := audited_charge_final (equals submitted total when auto-approved)"]
      - from: SUBMITTED
        to: MANUAL_REVIEW
        trigger: "system (automatic at ingestion when any auto-adjudication criterion fails)"
        actor: system
        preconditions: []
        side_effects: ["unauthorized_days computed"]
      - from: MANUAL_REVIEW
        to: AUTO_APPROVED
        trigger: POST /invoices/{id}/audit-decision with decision IN {APPROVE_AS_SUBMITTED, ADJUST_TO_AUTHORIZED}
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "APPROVE_AS_SUBMITTED: audited_payable_cents := total_cents"
          - "ADJUST_TO_AUTHORIZED: audited_payable_cents := audited_charge_final"
          - "Invoice.version += 1"
      - from: MANUAL_REVIEW
        to: DISPUTED
        trigger: POST /invoices/{id}/audit-decision with decision=DISPUTE_UNNECESSARY_DAYS
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "Invoice.version += 1"
          - "Create RecoveryCase(source=INVOICE_DISPUTE, unnecessary_days = invoice.unauthorized_days, assessed_amount_cents = unauthorized_days x min(daily_rate_cents, claim.coverage_daily_limit_cents))"
          - "Claim.recovery_balance_cents += assessed_amount_cents; Claim.version += 1"
          - "Create CommunicationLog(template=RECOVERY_NOTICE) on the claim"
      - from: AUTO_APPROVED
        to: SETTLED
        trigger: POST /invoices/{id}/settle
        actor: SettlementApprover
        preconditions: ["Claim.overall_status == OPEN (else ERR_CLAIM_NOT_OPEN)"]
        side_effects:
          - "Claim.rental_reserve_cents -= audited_payable_cents (reserve term moves from estimate to settled actuals)"
          - "Reservation.audited_charge_cents += audited_payable_cents; Reservation.version += 1"
          - "Claim.version += 1"
      - from: DISPUTED
        to: SETTLED
        trigger: POST /invoices/{id}/settle
        actor: SettlementApprover
        preconditions:
          - "Claim.overall_status == OPEN"
          - "The RecoveryCase created by the dispute is CLOSED or WAIVED (else ERR_INVOICE_INVALID_STATE)"
        side_effects: ["Same reserve reconciliation as AUTO_APPROVED -> SETTLED"]
    note: "Branching fork-join: SUBMITTED forks to AUTO_APPROVED or MANUAL_REVIEW at ingestion; branches converge at SETTLED with divergent side-effect sets (DISPUTED branch spawns a RecoveryCase)."

  - entity: RecoveryCase
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: PARTIAL_RECOVERY
        trigger: POST /recovery-cases/{id}/record-payment with amount_cents < outstanding_amount_cents
        actor: RecoverySpecialist
        preconditions: ["amount_cents >= 1 and <= outstanding_amount_cents (else ERR_INVALID_REQUEST)"]
        side_effects: ["recovered_amount_cents += amount_cents; outstanding recomputed; Claim.recovery_balance_cents -= amount_cents; Claim.version += 1"]
      - from: "OPEN or PARTIAL_RECOVERY"
        to: CLOSED
        trigger: POST /recovery-cases/{id}/record-payment with amount_cents == outstanding_amount_cents
        actor: RecoverySpecialist
        preconditions: []
        side_effects: ["recovered_amount_cents += amount_cents; outstanding := 0; Claim.recovery_balance_cents -= amount_cents; Claim.version += 1"]
      - from: "OPEN or PARTIAL_RECOVERY"
        to: WAIVED
        trigger: POST /recovery-cases/{id}/waive
        actor: RecoverySpecialist
        preconditions: []
        side_effects: ["waived_amount_cents := outstanding_amount_cents; outstanding := 0; Claim.recovery_balance_cents -= waived amount; Claim.version += 1"]

# =============================================================================
# Concurrency Rules (OCC only — true create-with-supersede / stale-view races)
# =============================================================================
concurrency_rules:
  - rule_id: verification-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /coverage-verifications"
    occ_field: "expected_claim_version"
    description: |
      Creating a CoverageVerification supersedes any PENDING verification on the
      claim. When the client's expected_claim_version no longer matches the
      claim's current version (e.g., another writer has just created or decided a
      verification, advancing Claim.version), the create is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: extension-request-stale-reservation
    parent_entity: RentalReservation
    write_endpoint: "POST /extension-requests"
    occ_field: "expected_reservation_version"
    description: |
      Creating an ExtensionRequest supersedes any SUBMITTED request on the
      reservation and flips the reservation into EXTENSION_REVIEW. When the
      client's expected_reservation_version no longer matches the reservation's
      current version, the create is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_day_count
    trigger: "reservation create/authorize/return; extension grant; invoice audit"
    algorithm: interval_merge
    formula: |
      All rental day counts use HALF-OPEN calendar-day intervals [start, end):
      days = (end_date - start_date).days
      pickup day counts, return day does not. start == end -> 0 days.
      Consumed days use [actual_pickup_date, actual_return_date).
    constants: {}
    precision: "integer days"

  - name: rental_charge_provisional
    trigger: "reservation create; re-anchored on authorize, extension approve, and class change"
    algorithm: forward_looking
    formula: |
      estimated_charge_cents = authorized_days x daily_rate_cents
      Variant note: the provisional estimate is deliberately UNCAPSED by the
      coverage daily limit and EXCLUDES tax — it is the desk's forward-looking
      authorization exposure, not the audit figure.
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_uncapped_pretax
        when: "from create until all invoices settle"
        difference: "ignores coverage_daily_limit_cents cap and tax; diverges from audited_charge_final whenever rate > limit or tax > 0"

  - name: audited_charge_final
    trigger: "invoice ingestion (for AUTO_APPROVED) and audit-decision ADJUST_TO_AUTHORIZED"
    algorithm: chronological
    formula: |
      Inputs: invoice (period_start, period_end, daily_rate_cents, tax_cents, fees_cents),
              reservation (pickup_date, authorized_return_date, rate_card_snapshot, ClassChangeRecords),
              claim.coverage_daily_limit_cents.
      1. payable window W = [max(period_start, pickup_date), min(period_end, authorized_return_date))
      2. unauthorized_days = (period_end - period_start).days - (W end - W start).days  (>= 0)
      3. for each calendar day d in W, in chronological order:
           rate_d = rate_card_snapshot[class(d)] where class(d) follows ClassChangeRecords:
                    a change with effective_date e applies to all days d >= e until the next change
           day_charge_d = min(rate_d, coverage_daily_limit_cents)
           day_tax_d = round_half_up(day_charge_d x TAX_RATE)      # ROUNDING ORDER PINNED: per-day first
      4. allowed_fees = min(fees_cents, DOCUMENTATION_FEE_CAP_CENTS)
      5. audited_payable_cents = sum(day_charge_d + day_tax_d) + allowed_fees
      Summing all charges first and rounding the tax once produces different cents
      and is explicitly NOT the algorithm (per-day rounding wins).
    constants:
      TAX_RATE: 0.08
      DOCUMENTATION_FEE_CAP_CENTS: 2500
    precision: "integer cents, round_half_up applied per day before summation"
    variants:
      - name: final_capped_chronological
        when: "invoice audit"
        difference: "per-day cap + per-day tax rounding + fee cap; diverges from rental_charge_provisional"

  - name: invoice_auto_adjudication
    trigger: "invoice ingestion (POST /invoices), after existence/state checks pass"
    algorithm: threshold
    formula: |
      AUTO_APPROVED iff ALL of:
        (a) [period_start, period_end) is a subset of [pickup_date, authorized_return_date)
        (b) daily_rate_cents == reservation.daily_rate_cents (the current applicable rate)
        (c) no ClassChangeRecord exists on the reservation
        (d) fees_cents <= DOCUMENTATION_FEE_CAP_CENTS
        (e) tax_cents == sum over days of round_half_up(min(daily_rate_cents, limit) x TAX_RATE)
      Otherwise MANUAL_REVIEW.
    constants:
      TAX_RATE: 0.08
      DOCUMENTATION_FEE_CAP_CENTS: 2500
    precision: "boolean fork"

  - name: extension_day_grant
    trigger: "POST /extension-requests/{id}/approve"
    algorithm: constraint_propagation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY — evaluation order is PINNED (pre-grant values only):
        1. authorized_days_total_pre = sum of authorized_days over the claim's reservations
           with status IN {AUTHORIZED, ACTIVE, EXTENSION_REVIEW, RETURNED}   (pre-grant values)
        2. cap_remaining = claim.coverage_duration_cap_days - authorized_days_total_pre
           (cap_remaining == 0 -> ERR_DURATION_CAP_EXHAUSTED)
        3. days_needed = max(0, (milestone.new_estimated_completion_date + COMPLETION_GRACE_DAYS
             - reservation.authorized_return_date).days)
           (uses PRE-grant authorized_return_date; the grant itself moves that date — do not re-evaluate)
           (days_needed == 0 -> ERR_EXTENSION_NOT_JUSTIFIED; reachable when the milestone's new
            estimate plus grace does not extend beyond the current authorized window)
        4. granted_days = min(requested_additional_days, cap_remaining, days_needed)
        5. Apply exactly once: authorized_return_date += granted_days; authorized_days += granted_days;
           estimated_charge_cents += granted_days x daily_rate_cents;
           claim.rental_reserve_cents -= granted_days x daily_rate_cents.
    constants:
      COMPLETION_GRACE_DAYS: 1
    precision: "integer days/cents"

  - name: class_change_cost_responsibility
    trigger: "POST /class-changes"
    algorithm: tiered_pricing
    formula: |
      Inputs (>= 3, non-linear interaction): rate_card_snapshot R, from_class, to_class,
      effective_date e, claim.coverage_daily_limit_cents L, upgrade_waiver w.
      remaining_days = (authorized_return_date - e).days          (half-open; e counts at the new rate)
      from_rate = R[from_class]; to_rate = R[to_class]
      if to_rate <= from_rate:            # downgrade — insurer always benefits, customer owes nothing
          per_day_customer_cents = 0
          customer_responsibility_cents = 0
          insurer_delta_cents = -(from_rate - to_rate) x remaining_days
      else:                               # upgrade
          insurer_per_day = max(0, min(to_rate, L) - min(from_rate, L))
          if w: per_day_customer_cents = 0
          else: per_day_customer_cents = max(0, to_rate - max(L, from_rate))
          customer_responsibility_cents = per_day_customer_cents x remaining_days
          insurer_delta_cents = insurer_per_day x remaining_days
      Apply: reservation.daily_rate_cents := to_rate; vehicle_class := to_class;
             estimated_charge_cents += insurer_delta_cents; claim.rental_reserve_cents -= insurer_delta_cents.
    constants: {}
    precision: "integer cents"

  - name: loss_of_use_payout
    trigger: "POST /loss-of-use-claims/{id}/approve"
    algorithm: threshold
    formula: |
      reasonable_days = (period_end - period_start).days + 1      # CLOSED interval: both endpoint days count
      billable_days = min(reasonable_days, claim.coverage_duration_cap_days)
      variant STANDARD_PER_DIEM:
          payout_cents = claim.loss_of_use_per_diem_cents x billable_days
      variant COMPARABLE_VEHICLE:
          requires documentation_provided == true (else ERR_DOCUMENTATION_REQUIRED)
          payout_cents = min(claimed_amount_cents, claim.coverage_daily_limit_cents x billable_days)
    constants: {}
    precision: "integer cents"
    variants:
      - name: standard_per_diem
        when: "payout_method == STANDARD_PER_DIEM"
        difference: "flat per-diem; ignores claimed_amount_cents"
      - name: comparable_vehicle
        when: "payout_method == COMPARABLE_VEHICLE"
        difference: "actual documented cost capped by daily limit; diverges from standard whenever per_diem != limit and claimed amount differs"

  - name: unnecessary_rental_days_assessment
    trigger: "POST /rental-reservations/{id}/return"
    algorithm: chronological
    formula: |
      if reservation.repair_order.status != COMPLETED: unnecessary_days = 0
      else:
        grace_end = repair_order.actual_completion_date + RETURN_GRACE_DAYS days
        unnecessary_days = max(0, (actual_return_date - grace_end).days)
      if unnecessary_days > 0:
        create RecoveryCase(source=RETURN_OVERSTAY,
                            unnecessary_days,
                            assessed_amount_cents = unnecessary_days x reservation.daily_rate_cents)
      unnecessary_days == 0 -> NO RecoveryCase is created (empty-set boundary).
    constants:
      RETURN_GRACE_DAYS: 1
    precision: "integer days/cents"

  - name: rental_reserve_reconciliation
    trigger: "authorize, cancel, class change, extension approve, return, invoice settle, recovery mutations"
    algorithm: aggregation
    formula: |
      claim.rental_reserve_cents =
          coverage_daily_limit_cents x coverage_duration_cap_days
          - SUM(r.estimated_charge_cents) over reservations r of the claim
              with r.status IN {AUTHORIZED, ACTIVE, EXTENSION_REVIEW}
          - SUM(inv.audited_payable_cents) over invoices inv of the claim's reservations
              with inv.status == SETTLED
      claim.authorized_days_total =
          SUM(r.authorized_days) over r.status IN {AUTHORIZED, ACTIVE, EXTENSION_REVIEW, RETURNED}
      claim.recovery_balance_cents =
          SUM(rc.outstanding_amount_cents) over RecoveryCases rc with rc.status IN {OPEN, PARTIAL_RECOVERY}
      INVARIANT (reserve conservation): authorize followed by cancel leaves rental_reserve_cents
      unchanged; return moves a reservation out of the estimate term; settle moves the same
      exposure into the settled term.
      INVARIANT (recovery conservation): for every RecoveryCase,
      assessed_amount_cents == recovered_amount_cents + waived_amount_cents + outstanding_amount_cents.
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right; first miss returns"
    error_id: "ERR_POLICYHOLDER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_COVERAGE_VERIFICATION_NOT_FOUND | ERR_REPAIR_SHOP_NOT_FOUND | ERR_RENTAL_PARTNER_NOT_FOUND | ERR_REPAIR_ORDER_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_EXTENSION_REQUEST_NOT_FOUND | ERR_LOSS_OF_USE_CLAIM_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_RECOVERY_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Body-referenced ids (claim_id, rental_partner_id, repair_order_id, reservation_id, milestone_id, policyholder_id) must exist"
    error_id: "ERR_CLAIM_NOT_FOUND | ERR_RENTAL_PARTNER_NOT_FOUND | ERR_REPAIR_ORDER_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_POLICYHOLDER_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints with body FKs"

  - priority: 5
    category: auth
    check: "Entity-backed ownership: RepairShop must own the repair order; RentalPartner must own the reservation; Customer must own the claim"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /repair-orders/{id}/start, /complete, /milestones; POST /rental-reservations/{id}/activate, /return; POST /invoices; POST /loss-of-use-claims/{id}/attach-documentation; POST /loss-of-use-claims"

  - priority: 6
    category: state
    check: "Claim.overall_status must be OPEN for any mutation under the claim"
    error_id: ERR_CLAIM_NOT_OPEN
    http_status: 409
    applies_to: "all mutating endpoints that resolve to a claim, EXCEPT POST /claims/{id}/close (which requires SETTLED per priority 8 and returns ERR_CLAIM_NOT_SETTLED)"

  - priority: 7
    category: state
    check: "Claim.rental_track_status must be COVERAGE_VERIFIED to create a reservation"
    error_id: ERR_COVERAGE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /rental-reservations"

  - priority: 8
    category: state
    check: "Target entity must be in the operation's required state (per state machine); invoice creation additionally requires reservation status IN {ACTIVE, EXTENSION_REVIEW, RETURNED}"
    error_id: "ERR_VERIFICATION_ALREADY_DECIDED | ERR_RESERVATION_INVALID_STATE | ERR_REPAIR_ORDER_INVALID_STATE | ERR_EXTENSION_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_LOU_INVALID_STATE | ERR_RECOVERY_INVALID_STATE | ERR_PENDING_EXTENSION_EXISTS | ERR_RESERVATION_CLOSE_BLOCKED | ERR_CLAIM_SETTLE_BLOCKED | ERR_CLAIM_NOT_SETTLED"
    http_status: 409
    applies_to: "state transition endpoints and POST /invoices"

  - priority: 9
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coverage-verifications; POST /extension-requests"

  - priority: 10
    category: business_temporal
    check: "pickup_date >= logical clock date; period end > start (LOU: end >= start); effective_date inside authorized window; activation not before pickup_date; DELAY_REPORTED moves the estimate strictly later"
    error_id: "ERR_PICKUP_DATE_IN_PAST | ERR_INVALID_PERIOD | ERR_ACTIVATION_BEFORE_PICKUP_DATE | ERR_INVALID_DELAY"
    http_status: 400
    applies_to: "POST /rental-reservations, POST /class-changes, POST /invoices, POST /loss-of-use-claims, POST /rental-reservations/{id}/activate, POST /repair-orders/{id}/milestones"

  - priority: 11
    category: business_referential
    check: "RentalPartner.status == ACTIVE; repair_order.claim_id == reservation's claim (ERR_REPAIR_ORDER_MISMATCH) and repair order status IN {APPROVED, IN_PROGRESS} at reservation create (ERR_REPAIR_ORDER_INVALID_STATE); milestone belongs to the reservation's repair order and is DELAY_REPORTED; latest non-SUPERSEDED verification VERIFIED with loss_of_use_eligible for LOU creation"
    error_id: "ERR_PARTNER_SUSPENDED | ERR_REPAIR_ORDER_MISMATCH | ERR_REPAIR_ORDER_INVALID_STATE | ERR_EXTENSION_INVALID_STATE | ERR_LOU_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "POST /rental-reservations, POST /extension-requests, POST /loss-of-use-claims"

  - priority: 12
    category: business_constraint
    check: "Uniqueness (policy_number, shop_code, partner_code, invoice_number per partner); reservation half-open overlap on the claim; LOU CLOSED-interval conflict with any reservation period; fleet capacity per day; extension justification; documentation requirement"
    error_id: "ERR_DUPLICATE_POLICY_NUMBER | ERR_DUPLICATE_SHOP_CODE | ERR_DUPLICATE_PARTNER_CODE | ERR_DUPLICATE_INVOICE_NUMBER | ERR_RESERVATION_PERIOD_OVERLAP | ERR_LOU_PERIOD_CONFLICT | ERR_FLEET_CAPACITY_EXCEEDED | ERR_EXTENSION_NOT_JUSTIFIED | ERR_DOCUMENTATION_REQUIRED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "creation and decision endpoints"
    note: "ERR_INVALID_REQUEST (missing/typo/enum fields) is http 400 and checked before all business categories, immediately after existence."

  - priority: 13
    category: business_fiscal
    check: "Capacity of coverage: duration cap headroom (cap_remaining > 0 at extension create; authorized_days_total <= cap at authorize); estimated charge / grant cost <= rental_reserve_cents"
    error_id: "ERR_DURATION_CAP_EXHAUSTED | ERR_INSUFFICIENT_RESERVE"
    http_status: 409
    applies_to: "POST /rental-reservations/{id}/authorize, POST /extension-requests, POST /extension-requests/{id}/approve"
    note: "ERR_INSUFFICIENT_RESERVE returns http 402; ERR_DURATION_CAP_EXHAUSTED returns http 409. Priority pair pinning: state (8) beats fiscal (13); temporal (10) beats referential (11)."

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- bootstrap / admin ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All date-stamping (reported_at, actual_pickup_date, actual_return_date, actual_completion_date, sent_at) and all 'current date' comparisons read this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; no entity mutation"]

  - method: POST
    path: "/policyholders"
    description: "Register a policy holder"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, policy_number, contact_email]
    output: PolicyHolder
    side_effects: []

  - method: GET
    path: "/policyholders/{id}"
    description: "Get a policy holder"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: PolicyHolder
    side_effects: []

  - method: GET
    path: "/policyholders/{id}/claims"
    description: "List claims of a policy holder (FK reverse reachability for Claim.policyholder_id)"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/repair-shops"
    description: "Register a repair shop"
    roles: [SystemAdmin]
    code: 201
    input: [shop_name, shop_code]
    output: RepairShop
    side_effects: []

  - method: GET
    path: "/repair-shops/{id}"
    description: "Get a repair shop"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: RepairShop
    side_effects: []

  - method: POST
    path: "/rental-partners"
    description: "Register a rental partner with rate card and fleet capacities"
    roles: [SystemAdmin]
    code: 201
    input: [partner_name, partner_code, economy_rate_cents, standard_rate_cents, premium_rate_cents, economy_capacity, standard_capacity, premium_capacity]
    output: RentalPartner
    side_effects: ["status initialized ACTIVE"]

  - method: GET
    path: "/rental-partners/{id}"
    description: "Get a rental partner"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: RentalPartner
    side_effects: []

  - method: POST
    path: "/rental-partners/{id}/suspend"
    description: "Suspend a partner (blocks new reservations; existing reservations unaffected)"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: RentalPartner
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/rental-partners/{id}/reactivate"
    description: "Reactivate a suspended partner"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: RentalPartner
    side_effects: ["status -> ACTIVE"]

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "Open a claim"
    roles: [ClaimsAdjuster]
    code: 201
    input: [policyholder_id, incident_date, coverage_daily_limit_cents, coverage_duration_cap_days, loss_of_use_per_diem_cents]
    output: Claim
    side_effects: ["rental_reserve_cents := daily_limit x duration_cap; authorized_days_total := 0; recovery_balance_cents := 0; tracks := OPEN/NONE"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a claim (derived fields included)"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{id}/settle"
    description: "Settle a claim (all children terminal, recovery balance zero)"
    roles: [SettlementApprover]
    code: 200
    input: []
    output: Claim
    side_effects: ["overall_status -> SETTLED"]

  - method: POST
    path: "/claims/{id}/close"
    description: "Close a settled claim"
    roles: [SettlementApprover]
    code: 200
    input: []
    output: Claim
    side_effects: ["overall_status -> CLOSED"]

  - method: GET
    path: "/claims/{id}/coverage-verifications"
    description: "List coverage verifications of a claim"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CoverageVerification[]"
    side_effects: []

  - method: GET
    path: "/claims/{id}/repair-orders"
    description: "List repair orders of a claim"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RepairOrder[]"
    side_effects: []

  - method: GET
    path: "/claims/{id}/rental-reservations"
    description: "List reservations of a claim"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RentalReservation[]"
    side_effects: []

  - method: GET
    path: "/claims/{id}/loss-of-use-claims"
    description: "List loss-of-use claims of a claim"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "LossOfUseClaim[]"
    side_effects: []

  - method: GET
    path: "/claims/{id}/recovery-cases"
    description: "List recovery cases of a claim"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecoveryCase[]"
    side_effects: []

  - method: GET
    path: "/claims/{id}/communication-logs"
    description: "List communication log entries of a claim"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CommunicationLog[]"
    side_effects: []

  # --- CoverageVerification ---
  - method: POST
    path: "/coverage-verifications"
    description: "Create a PENDING verification; supersedes any existing PENDING verification on the claim (OCC on Claim.version)"
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_id, expected_claim_version]
    output: CoverageVerification
    side_effects: ["existing PENDING verification -> SUPERSEDED", "increments Claim.version by 1"]

  - method: POST
    path: "/coverage-verifications/{id}/decide"
    description: "Decide a pending verification"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, rental_eligible, loss_of_use_eligible, "denial_reason?"]
    output: CoverageVerification
    side_effects: ["status -> VERIFIED|DENIED", "Claim.rental_track_status updated", "increments Claim.version by 1"]

  # --- RepairOrder / milestones ---
  - method: POST
    path: "/repair-orders"
    description: "Create a repair order; shop_id := X-User-ID"
    roles: [RepairShop]
    code: 201
    input: [claim_id, estimated_completion_date, labor_hours_estimate]
    output: RepairOrder
    side_effects: []

  - method: GET
    path: "/repair-orders"
    description: "List repair orders; shop_id? filter (FK reverse reachability for RepairOrder.shop_id)"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "RepairOrder[]"
    side_effects: []

  - method: GET
    path: "/repair-orders/{id}"
    description: "Get a repair order"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: POST
    path: "/repair-orders/{id}/approve"
    description: "Approve the estimate"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/repair-orders/{id}/start"
    description: "Start repairs (owning shop only)"
    roles: [RepairShop]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/repair-orders/{id}/complete"
    description: "Complete repairs; stamps actual_completion_date from the logical clock"
    roles: [RepairShop]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> COMPLETED", "actual_completion_date := clock date"]

  - method: POST
    path: "/repair-orders/{id}/milestones"
    description: "Report a milestone (DELAY_REPORTED triggers the 3-hop delay cascade)"
    roles: [RepairShop]
    code: 201
    input: [milestone_type, "new_estimated_completion_date?", "note?"]
    output: RepairMilestone
    side_effects: ["DELAY_REPORTED -> RepairOrder.estimated_completion_date updated", "reservation -> EXTENSION_REVIEW", "CommunicationLog EXPECTATION_SET created", "Claim.version += 1"]

  - method: GET
    path: "/repair-orders/{id}/milestones"
    description: "List milestones of a repair order"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RepairMilestone[]"
    side_effects: []

  # --- RentalReservation ---
  - method: POST
    path: "/rental-reservations"
    description: "Book a reservation (DRAFT) with a rental partner, direct-billed; OCC on Claim.version"
    roles: [RentalDeskAgent]
    code: 201
    input: [claim_id, rental_partner_id, repair_order_id, vehicle_class, pickup_date, authorized_return_date, expected_claim_version]
    output: RentalReservation
    side_effects: ["rate_card_snapshot copied from partner", "daily_rate_cents := snapshot[vehicle_class]", "authorized_days, estimated_charge_cents computed (provisional)", "increments Claim.version by 1"]

  - method: GET
    path: "/rental-reservations"
    description: "List reservations; rental_partner_id? / repair_order_id? filters (FK reverse reachability)"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["rental_partner_id?", "repair_order_id?", "limit?", "offset?"]
    output: "RentalReservation[]"
    side_effects: []

  - method: GET
    path: "/rental-reservations/{id}"
    description: "Get a reservation"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: RentalReservation
    side_effects: []

  - method: POST
    path: "/rental-reservations/{id}/authorize"
    description: "Authorize a DRAFT reservation: debits the claim reserve, enforces cap + fleet capacity"
    roles: [RentalDeskAgent]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> AUTHORIZED", "Claim.rental_reserve_cents -= estimated_charge_cents", "increments Claim.version by 1"]

  - method: POST
    path: "/rental-reservations/{id}/activate"
    description: "Record pickup (owning partner only); clock date must be >= pickup_date"
    roles: [RentalPartner]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> ACTIVE", "actual_pickup_date := clock date", "first activation flips Claim.rental_track_status -> RENTAL_ACTIVE"]

  - method: POST
    path: "/rental-reservations/{id}/return"
    description: "Record vehicle return (owning partner only); runs unnecessary-day assessment and may open a RecoveryCase"
    roles: [RentalPartner]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> RETURNED", "actual_return_date := clock date", "consumed_days, unnecessary_days computed", "RecoveryCase(RETURN_OVERSTAY) created iff unnecessary_days > 0", "reserve estimate released"]

  - method: POST
    path: "/rental-reservations/{id}/close"
    description: "Close a RETURNED reservation once invoices are settled and recovery cases resolved"
    roles: [RentalDeskAgent]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> CLOSED", "rental_track_status may flip to RENTAL_CLOSED"]

  - method: POST
    path: "/rental-reservations/{id}/cancel"
    description: "Cancel a DRAFT or AUTHORIZED reservation; AUTHORIZED cancellation credits the reserve in full"
    roles: [RentalDeskAgent]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> CANCELLED", "reserve compensated if AUTHORIZED", "increments Claim.version by 1"]

  - method: GET
    path: "/rental-reservations/{id}/extension-requests"
    description: "List extension requests of a reservation"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ExtensionRequest[]"
    side_effects: []

  - method: GET
    path: "/rental-reservations/{id}/class-changes"
    description: "List class change records of a reservation"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClassChangeRecord[]"
    side_effects: []

  - method: GET
    path: "/rental-reservations/{id}/invoices"
    description: "List invoices of a reservation"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # --- ExtensionRequest ---
  - method: POST
    path: "/extension-requests"
    description: "Request additional days tied to a DELAY_REPORTED milestone; supersedes any SUBMITTED request on the reservation (OCC on RentalReservation.version)"
    roles: [RentalDeskAgent]
    code: 201
    input: [reservation_id, milestone_id, requested_additional_days, expected_reservation_version]
    output: ExtensionRequest
    side_effects: ["reservation ACTIVE -> EXTENSION_REVIEW (or stays)", "prior SUBMITTED request -> SUPERSEDED", "increments RentalReservation.version by 1"]

  - method: GET
    path: "/extension-requests"
    description: "List extension requests; milestone_id? filter (FK reverse reachability for ExtensionRequest.milestone_id)"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["milestone_id?", "limit?", "offset?"]
    output: "ExtensionRequest[]"
    side_effects: []

  - method: GET
    path: "/extension-requests/{id}"
    description: "Get an extension request"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: []

  - method: POST
    path: "/extension-requests/{id}/approve"
    description: "Approve an extension: extension_day_grant runs, reservation returns to ACTIVE"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: ["status -> APPROVED", "granted_days applied to reservation", "reserve debited", "CommunicationLog EXTENSION_UPDATE created"]

  - method: POST
    path: "/extension-requests/{id}/deny"
    description: "Deny an extension; reservation returns to ACTIVE unchanged"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["decision_reason?"]
    output: ExtensionRequest
    side_effects: ["status -> DENIED", "reservation -> ACTIVE", "CommunicationLog EXTENSION_UPDATE created"]

  # --- ClassChangeRecord ---
  - method: POST
    path: "/class-changes"
    description: "Record a downgrade/upgrade; computes customer vs insurer cost responsibility"
    roles: [RentalDeskAgent]
    code: 201
    input: [reservation_id, to_class, effective_date, "upgrade_waiver?"]
    output: ClassChangeRecord
    side_effects: ["reservation rate/class updated", "estimated_charge_cents += insurer_delta_cents", "reserve adjusted", "increments RentalReservation.version and Claim.version by 1"]

  # --- LossOfUseClaim ---
  - method: POST
    path: "/loss-of-use-claims"
    description: "Submit a loss-of-use claim for a non-owned vehicle (claimant only)"
    roles: [Customer]
    code: 201
    input: [claim_id, vehicle_description, period_start, period_end, claimed_amount_cents, payout_method]
    output: LossOfUseClaim
    side_effects: ["Claim.loss_of_use_track_status -> LOU_SUBMITTED", "increments Claim.version by 1"]

  - method: GET
    path: "/loss-of-use-claims/{id}"
    description: "Get a loss-of-use claim"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: LossOfUseClaim
    side_effects: []

  - method: POST
    path: "/loss-of-use-claims/{id}/attach-documentation"
    description: "Attach cost documentation (claimant only)"
    roles: [Customer]
    code: 200
    input: []
    output: LossOfUseClaim
    side_effects: ["status -> DOCUMENTED", "documentation_provided := true"]

  - method: POST
    path: "/loss-of-use-claims/{id}/approve"
    description: "Approve and compute payout per payout_method variant"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: LossOfUseClaim
    side_effects: ["status -> APPROVED", "payout_cents computed"]

  - method: POST
    path: "/loss-of-use-claims/{id}/deny"
    description: "Deny a loss-of-use claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["decision_reason?"]
    output: LossOfUseClaim
    side_effects: ["status -> DENIED"]

  - method: POST
    path: "/loss-of-use-claims/{id}/pay"
    description: "Pay an approved loss-of-use claim (settlement role only — segregation of duties)"
    roles: [SettlementApprover]
    code: 200
    input: []
    output: LossOfUseClaim
    side_effects: ["status -> PAID"]

  # --- Invoice ---
  - method: POST
    path: "/invoices"
    description: "Submit a direct-bill invoice (owning partner only); system forks to AUTO_APPROVED or MANUAL_REVIEW per invoice_auto_adjudication"
    roles: [RentalPartner]
    code: 201
    input: [reservation_id, invoice_number, period_start, period_end, daily_rate_cents, tax_cents, fees_cents]
    output: Invoice
    side_effects: ["total_cents computed", "unauthorized_days computed", "status := AUTO_APPROVED | MANUAL_REVIEW", "audited_payable_cents set when AUTO_APPROVED"]

  - method: GET
    path: "/invoices"
    description: "List invoices; rental_partner_id? filter (FK reverse reachability for Invoice.rental_partner_id)"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["rental_partner_id?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/audit-decision"
    description: "Audit a MANUAL_REVIEW invoice; dispute opens a RecoveryCase. Second sequential decision is rejected by the state precondition (invoice no longer MANUAL_REVIEW) — no OCC here."
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision]
    output: Invoice
    side_effects: ["APPROVE_AS_SUBMITTED|ADJUST_TO_AUTHORIZED -> AUTO_APPROVED with audited_payable_cents", "DISPUTE_UNNECESSARY_DAYS -> DISPUTED + RecoveryCase(INVOICE_DISPUTE) + CommunicationLog RECOVERY_NOTICE", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/settle"
    description: "Settle an approved invoice (settlement role only); DISPUTED requires its RecoveryCase resolved"
    roles: [SettlementApprover]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> SETTLED", "reserve reconciled to audited actuals", "Reservation.audited_charge_cents += audited_payable_cents"]

  # --- RecoveryCase ---
  - method: GET
    path: "/recovery-cases"
    description: "List recovery cases; reservation_id? filter (FK reverse reachability for RecoveryCase.reservation_id)"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: ["reservation_id?", "limit?", "offset?"]
    output: "RecoveryCase[]"
    side_effects: []

  - method: GET
    path: "/recovery-cases/{id}"
    description: "Get a recovery case"
    roles: [Customer, RentalDeskAgent, ClaimsAdjuster, SettlementApprover, RepairShop, RentalPartner, RecoverySpecialist, SystemAdmin]
    code: 200
    input: []
    output: RecoveryCase
    side_effects: []

  - method: POST
    path: "/recovery-cases/{id}/record-payment"
    description: "Record a customer recovery payment"
    roles: [RecoverySpecialist]
    code: 200
    input: [amount_cents]
    output: RecoveryCase
    side_effects: ["recovered_amount_cents += amount", "outstanding recomputed", "Claim.recovery_balance_cents -= amount"]

  - method: POST
    path: "/recovery-cases/{id}/waive"
    description: "Waive the outstanding balance"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: RecoveryCase
    side_effects: ["waived_amount_cents := outstanding", "outstanding := 0", "Claim.recovery_balance_cents -= waived amount"]

  # --- CommunicationLog ---
  - method: POST
    path: "/communication-logs"
    description: "Log a customer communication (expectation setting)"
    roles: [RentalDeskAgent]
    code: 201
    input: [claim_id, channel, template, body_summary]
    output: CommunicationLog
    side_effects: ["sent_at := logical clock"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (shop/partner/policyholder mismatch)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, or decision-specific required field absent (denial_reason on DENIED, new_estimated_completion_date on DELAY_REPORTED), amount out of range" }
  - { id: ERR_POLICYHOLDER_NOT_FOUND, http: 404, condition: "policyholder id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id does not exist" }
  - { id: ERR_COVERAGE_VERIFICATION_NOT_FOUND, http: 404, condition: "coverage verification id does not exist" }
  - { id: ERR_REPAIR_SHOP_NOT_FOUND, http: 404, condition: "repair shop id does not exist" }
  - { id: ERR_RENTAL_PARTNER_NOT_FOUND, http: 404, condition: "rental partner id does not exist" }
  - { id: ERR_REPAIR_ORDER_NOT_FOUND, http: 404, condition: "repair order id does not exist" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "milestone id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation id does not exist" }
  - { id: ERR_EXTENSION_REQUEST_NOT_FOUND, http: 404, condition: "extension request id does not exist" }
  - { id: ERR_LOSS_OF_USE_CLAIM_NOT_FOUND, http: 404, condition: "loss-of-use claim id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_RECOVERY_CASE_NOT_FOUND, http: 404, condition: "recovery case id does not exist" }
  - { id: ERR_CLAIM_NOT_OPEN, http: 409, condition: "Mutation requires Claim.overall_status == OPEN" }
  - { id: ERR_COVERAGE_NOT_VERIFIED, http: 409, condition: "Reservation creation requires Claim.rental_track_status == COVERAGE_VERIFIED" }
  - { id: ERR_VERIFICATION_ALREADY_DECIDED, http: 409, condition: "decide on a verification not in PENDING" }
  - { id: ERR_RESERVATION_INVALID_STATE, http: 409, condition: "Reservation not in the required state for the operation (e.g., authorize non-DRAFT, cancel non-DRAFT/AUTHORIZED, extension on terminal reservation, return from DRAFT/AUTHORIZED, close non-RETURNED, invoice creation when reservation not in {ACTIVE, EXTENSION_REVIEW, RETURNED})" }
  - { id: ERR_REPAIR_ORDER_INVALID_STATE, http: 409, condition: "Repair order not in the required state (approve non-ESTIMATE_SUBMITTED, start non-APPROVED, complete non-IN_PROGRESS, milestone on non-IN_PROGRESS, extension approve when order not IN_PROGRESS)" }
  - { id: ERR_EXTENSION_INVALID_STATE, http: 409, condition: "Extension request not SUBMITTED, or milestone not a DELAY_REPORTED milestone of the reservation's repair order" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "audit-decision on non-MANUAL_REVIEW invoice; settle on SUBMITTED/MANUAL_REVIEW invoice; settle on DISPUTED invoice whose RecoveryCase is not resolved" }
  - { id: ERR_LOU_INVALID_STATE, http: 409, condition: "Loss-of-use operation on wrong state (approve APPROVED/PAID, pay non-APPROVED, attach on non-SUBMITTED, deny terminal)" }
  - { id: ERR_RECOVERY_INVALID_STATE, http: 409, condition: "record-payment or waive on CLOSED/WAIVED recovery case" }
  - { id: ERR_PICKUP_DATE_IN_PAST, http: 400, condition: "pickup_date is strictly before the logical clock date" }
  - { id: ERR_INVALID_PERIOD, http: 400, condition: "period/window bounds invalid (end <= start for half-open, end < start for LOU closed, effective_date outside authorized window)" }
  - { id: ERR_ACTIVATION_BEFORE_PICKUP_DATE, http: 400, condition: "activate when logical clock date is before pickup_date" }
  - { id: ERR_INVALID_DELAY, http: 400, condition: "DELAY_REPORTED without a strictly-later new_estimated_completion_date" }
  - { id: ERR_PARTNER_SUSPENDED, http: 409, condition: "Reservation creation on a SUSPENDED partner" }
  - { id: ERR_REPAIR_ORDER_MISMATCH, http: 409, condition: "repair_order_id does not belong to the reservation's claim" }
  - { id: ERR_LOU_NOT_ELIGIBLE, http: 409, condition: "Loss-of-use creation when latest verification is not VERIFIED with loss_of_use_eligible=true" }
  - { id: ERR_DOCUMENTATION_REQUIRED, http: 409, condition: "COMPARABLE_VEHICLE approve without documentation" }
  - { id: ERR_RESERVATION_PERIOD_OVERLAP, http: 409, condition: "New reservation's half-open interval [pickup_date, authorized_return_date) overlaps an existing reservation in {DRAFT, AUTHORIZED, ACTIVE, EXTENSION_REVIEW} on the same claim; back-to-back (pickup == prior authorized_return_date) is allowed" }
  - { id: ERR_LOU_PERIOD_CONFLICT, http: 409, condition: "Loss-of-use CLOSED interval [period_start, period_end] shares at least one calendar day with any reservation [pickup_date, authorized_return_date] (closed both ends) in {DRAFT, AUTHORIZED, ACTIVE, EXTENSION_REVIEW, RETURNED} on the same claim; checked on whichever of the two is created later" }
  - { id: ERR_FLEET_CAPACITY_EXCEEDED, http: 409, condition: "On some day in the window, the partner's same-class reservations in {AUTHORIZED, ACTIVE, EXTENSION_REVIEW} already equal the class capacity (aggregate per-day capacity semantics; checked at authorize and at extension approve for added days)" }
  - { id: ERR_EXTENSION_NOT_JUSTIFIED, http: 409, condition: "days_needed == 0 (milestone's new estimate does not extend beyond the authorized window + grace)" }
  - { id: ERR_DURATION_CAP_EXHAUSTED, http: 409, condition: "cap_remaining == 0 at extension create/approve, or authorize would push authorized_days_total over coverage_duration_cap_days" }
  - { id: ERR_INSUFFICIENT_RESERVE, http: 402, condition: "estimated_charge_cents (authorize) or grant cost (extension approve) exceeds Claim.rental_reserve_cents" }
  - { id: ERR_PENDING_EXTENSION_EXISTS, http: 409, condition: "return while a SUBMITTED extension request exists on the reservation" }
  - { id: ERR_RESERVATION_CLOSE_BLOCKED, http: 409, condition: "close while any invoice is non-SETTLED or any recovery case is OPEN/PARTIAL_RECOVERY" }
  - { id: ERR_CLAIM_SETTLE_BLOCKED, http: 409, condition: "settle with non-terminal reservations/LOU claims or recovery_balance_cents != 0" }
  - { id: ERR_CLAIM_NOT_SETTLED, http: 409, condition: "close requires Claim.overall_status == SETTLED" }
  - { id: ERR_DUPLICATE_POLICY_NUMBER, http: 409, condition: "policy_number already registered" }
  - { id: ERR_DUPLICATE_SHOP_CODE, http: 409, condition: "shop_code already registered" }
  - { id: ERR_DUPLICATE_PARTNER_CODE, http: 409, condition: "partner_code already registered" }
  - { id: ERR_DUPLICATE_INVOICE_NUMBER, http: 409, condition: "invoice_number already used by this rental partner" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Policy holder; files and documents loss-of-use claims"
    identity: "entity_backed:PolicyHolder"
    exclusive_operations:
      - "POST /loss-of-use-claims"
      - "POST /loss-of-use-claims/{id}/attach-documentation"
    shared_operations: ["GET endpoints"]

  - name: RentalDeskAgent
    description: "Insurer rental desk agent; books reservations, manages extensions pipeline, class changes, and customer communications"
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-reservations"
      - "POST /rental-reservations/{id}/authorize"
      - "POST /rental-reservations/{id}/close"
      - "POST /rental-reservations/{id}/cancel"
      - "POST /extension-requests"
      - "POST /class-changes"
      - "POST /communication-logs"
    shared_operations: ["GET endpoints"]

  - name: ClaimsAdjuster
    description: "Adjuster; opens claims, verifies coverage, approves repair estimates, decides extensions and LOU claims, audits invoices. Segregated from settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims"
      - "POST /coverage-verifications"
      - "POST /coverage-verifications/{id}/decide"
      - "POST /repair-orders/{id}/approve"
      - "POST /extension-requests/{id}/approve"
      - "POST /extension-requests/{id}/deny"
      - "POST /loss-of-use-claims/{id}/approve"
      - "POST /loss-of-use-claims/{id}/deny"
      - "POST /invoices/{id}/audit-decision"
    shared_operations: ["GET endpoints"]

  - name: SettlementApprover
    description: "Settlement authority; settles invoices, pays LOU claims, settles/closes claims. Cannot verify coverage or audit (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/settle"
      - "POST /claims/{id}/close"
      - "POST /invoices/{id}/settle"
      - "POST /loss-of-use-claims/{id}/pay"
    shared_operations: ["GET endpoints"]

  - name: RepairShop
    description: "Repair facility; owns its repair orders and reports milestones"
    identity: "entity_backed:RepairShop"
    exclusive_operations:
      - "POST /repair-orders"
      - "POST /repair-orders/{id}/start"
      - "POST /repair-orders/{id}/complete"
      - "POST /repair-orders/{id}/milestones"
    shared_operations: ["GET endpoints"]

  - name: RentalPartner
    description: "Rental car partner; activates/returns its reservations and submits direct-bill invoices"
    identity: "entity_backed:RentalPartner"
    exclusive_operations:
      - "POST /rental-reservations/{id}/activate"
      - "POST /rental-reservations/{id}/return"
      - "POST /invoices"
    shared_operations: ["GET endpoints"]

  - name: RecoverySpecialist
    description: "Recovery desk; collects or waives recovery cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /recovery-cases/{id}/record-payment"
      - "POST /recovery-cases/{id}/waive"
    shared_operations: ["GET endpoints"]

  - name: SystemAdmin
    description: "Platform administrator; registers policy holders, shops, partners; drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /policyholders"
      - "POST /repair-shops"
      - "POST /rental-partners"
      - "POST /rental-partners/{id}/suspend"
      - "POST /rental-partners/{id}/reactivate"
    shared_operations: ["GET endpoints"]
