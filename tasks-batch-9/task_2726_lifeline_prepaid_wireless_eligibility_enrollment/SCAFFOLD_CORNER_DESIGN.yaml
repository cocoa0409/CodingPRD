  # =========================================================================
  # SECTION 5 - endpoints  (claim-extraction-guide Table 5)
  # =========================================================================
  - section: endpoints
    instances:

      - name: device_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /lifeline/providers/{id}/devices]
          - endpoints[GET /lifeline/devices/{id}]
          - endpoints[GET /lifeline/devices]
        distinguishing_aspect: |
          The handset catalogue is the only entity with a create, a single read and a
          multi-filter list and NO mutation endpoint of its own, so the CRUD surface is
          exactly create/read/list: a device created under carrier A must be invisible to a
          provider_id filter for carrier B, the status and model_tier filters must compose
          with provider_id, and paging a two-row filtered set with limit 1 must report the
          FILTERED total (2), not the global one (3).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; two ACTIVE carriers P1 and P2."
            - "P1 owns D1 (BASIC, 2100) and D2 (SMART, 5900); P2 owns D3 (SMART, 6100). All three are IN_STOCK."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143150", study_area_code: "489150", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /lifeline/providers"
              payload: { name: "Assurance Mobile", spin_id: "143151", study_area_code: "489151", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /lifeline/providers/${p1_id}/devices"
              payload: { imei: "350000000000081", model_tier: "BASIC", unit_cost_cents: 2100 }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { d1_id: $.data.id, d1_status: $.data.status, d1_enr: $.data.issued_enrollment_id, d1_issued_at: $.data.issued_at }
            - call: "POST /lifeline/providers/${p1_id}/devices"
              payload: { imei: "350000000000082", model_tier: "SMART", unit_cost_cents: 5900 }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /lifeline/providers/${p2_id}/devices"
              payload: { imei: "350000000000083", model_tier: "SMART", unit_cost_cents: 6100 }
              as: ProviderAgent
              as_user_id: "${p2_id}"
              captures: { d3_id: $.data.id }
          trigger:
            - call: "GET /lifeline/devices/${d2_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { r_imei: $.data.imei, r_tier: $.data.model_tier, r_cost: $.data.unit_cost_cents, r_prov: $.data.provider_id }
            - call: "GET /lifeline/devices?provider_id=${p1_id}&limit=1&offset=0"
              payload: { provider_id: "${p1_id}", limit: 1, offset: 0 }
              as: ProgramAdministrator
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /lifeline/devices?provider_id=${p1_id}&limit=1&offset=1"
              payload: { provider_id: "${p1_id}", limit: 1, offset: 1 }
              as: ProgramAdministrator
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /lifeline/devices?provider_id=${p1_id}&model_tier=SMART"
              payload: { provider_id: "${p1_id}", model_tier: "SMART" }
              as: ProgramAdministrator
              captures: { smart_first: "$.data[0].id" }
            - call: "GET /lifeline/devices?status=IN_STOCK"
              payload: { status: "IN_STOCK" }
              as: ProgramAdministrator
          assert:
            - "each device creation returns HTTP 201 with ${d1_status} == IN_STOCK, ${d1_enr} == null and ${d1_issued_at} == null"
            - "the first trigger returns HTTP 200 with ${r_imei} == 350000000000082, ${r_tier} == SMART, ${r_cost} == 5900 and ${r_prov} == ${p1_id}"
            - "the second trigger envelope reports limit 1, offset 0, total_count 2 and has_more true"
            - "the third trigger envelope reports limit 1, offset 1, total_count 2 and has_more false"
            - "${page1_first} and ${page2_first} are distinct and the union of the two pages is exactly {${d1_id}, ${d2_id}} - ${d3_id} never appears under the provider_id filter"
            - "the fourth trigger returns total_count 1 and ${smart_first} == ${d2_id}, proving provider_id and model_tier compose"
            - "the fifth trigger returns total_count 3 - the unfiltered catalogue across both carriers"
            - "Provider.${p1_id}.devices_total_count == 2 and Provider.${p2_id}.devices_total_count == 1"

      - name: usage_endpoint_cures_the_flag_never_rewinds_and_needs_an_active_benefit
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /lifeline/enrollments/{id}/usage]
          - state_machines.Enrollment.usage_status.NON_USAGE_FLAGGED_to_USING
          - validations[priority=47]
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          All three declared side effects of the action are separated: the cure arm clears
          non_usage_flagged_at AND cure_deadline_at and drops audit_risk_score from 30 back
          to 0; a follow-up call carrying an EARLIER usage_at must not rewind last_usage_at;
          and the action's precondition is checked against benefit_status, so the same call
          on a de-enrolled benefit is refused with ERR_ENROLLMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier, one clean address, one VOICE enrollment starting 2026-08-01 with no usage and no device."
            - "A compliance sweep at 2026-08-31T00:00:00Z drives idle_days to exactly 30 and flags the enrollment with cure_deadline_at 2026-09-15T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143152", study_area_code: "489152", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-R1" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_id: $.data.id, usage0: $.data.usage_status, last0: $.data.last_usage_at, risk0: $.data.audit_risk_score }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers/${prov_id}/compliance-sweep"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "PA-1"
              captures: { sweep_at: $.data.swept_at }
          trigger:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T23:59:59.999Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/enrollments/${enr_id}/usage"
              payload: { usage_kind: "VOICE_CALL" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { usage1: $.data.usage_status, last1: $.data.last_usage_at, flagged1: $.data.non_usage_flagged_at, cure1: $.data.cure_deadline_at, risk1: $.data.audit_risk_score }
            - call: "POST /lifeline/enrollments/${enr_id}/usage"
              payload: { usage_at: "2026-09-01T00:00:00Z", usage_kind: "DATA_SESSION" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { usage2: $.data.usage_status, last2: $.data.last_usage_at }
            - call: "POST /lifeline/enrollments/${enr_id}/de-enroll"
              payload: { de_enrollment_reason: "SUBSCRIBER_REQUEST", note: "subscriber cancelled" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { benefit3: $.data.benefit_status }
            - call: "POST /lifeline/enrollments/${enr_id}/usage"
              payload: { usage_kind: "VOICE_CALL" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${usage0} == PENDING_FIRST_USE, ${last0} == null and ${risk0} == 0"
            - "${sweep_at} == 2026-08-31T00:00:00.000Z"
            - "the sweep response non_usage_flagged_enrollment_ids == [${enr_id}]"
            - "Enrollment.${enr_id}.usage_status == NON_USAGE_FLAGGED after the sweep"
            - "Enrollment.${enr_id}.non_usage_flagged_at == 2026-08-31T00:00:00.000Z"
            - "Enrollment.${enr_id}.cure_deadline_at == 2026-09-15T23:59:59.999Z"
            - "Enrollment.${enr_id}.audit_risk_score == 30 after the sweep"
            - "${usage1} == USING, ${last1} == 2026-09-15T23:59:59.999Z, ${flagged1} == null, ${cure1} == null and ${risk1} == 0"
            - "${usage2} == USING and ${last2} == 2026-09-15T23:59:59.999Z - the earlier usage_at is accepted but never rewinds the anchor"
            - "${benefit3} == DE_ENROLLED"
            - "the last trigger returns HTTP 409 and ${err} == ERR_ENROLLMENT_NOT_ACTIVE"
            - "Enrollment.${enr_id}.last_usage_at == 2026-09-15T23:59:59.999Z after the refused call"

      - name: compliance_sweep_bulk_semantics_covered_by_difficulty_rule_4
        claim_type: bulk_action
        grounds:
          - endpoints[POST /lifeline/providers/{id}/compliance-sweep]
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_recert_non_response_cascades_to_address_release_and_duplicate_hold_lift
          rationale: "The sweep is the only bulk action in §1.5 and the named §1.8 instance already drives it over a multi-enrollment population, asserting the four per-arm id arrays and the skip-rather-than-rollback semantics for enrollments that no arm applies to."

      - name: transfer_link_requires_both_the_enrollment_and_the_gaining_carrier
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /lifeline/service-transfers]
          - validations[priority=26]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - state_machines.ServiceTransfer.status.REQUESTED_to_SUPERSEDED
        distinguishing_aspect: |
          ServiceTransfer is a three-way junction and the link is only formed when BOTH body
          foreign keys resolve: an unknown enrollment_id yields ERR_ENROLLMENT_NOT_FOUND and
          an unknown target_provider_id yields ERR_PROVIDER_NOT_FOUND, both at priority 26
          and both before any state or freeze reasoning. The successful link then derives
          source_provider_id from the enrollment rather than from the request, snapshots the
          freeze it tested, and a second link for the same enrollment supersedes the first.
        test_recipe:
