              as: ProgramAdmin
              captures: { pat_r: $.data.id }
            - call: "POST /sharps/patients/${pat_r}/eligibility-review"
              payload: { decision: "DENY" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/patients/${pat_r}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
              captures: { e_review: $.data.error_id }
            - call: "POST /sharps/patients/${pat_r}/status-actions"
              payload: { action: "WITHDRAW", reason: "cleanup" }
