# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >= 2 instances each = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_total_long_haul_vs_local_diverge
        grounds:
          - calculations.estimate_total
          - calculations.estimate_total.variants.long_haul
          - calculations.estimate_total.variants.local_hourly
          - entities.MoveJob.fields.service_type
          - entities.Estimate.fields.estimate_total_cents
        distinguishing_aspect: "Two LONG_HAUL and LOCAL jobs with the SAME 370-cf survey produce different estimate_total_cents (666864 vs 70200) because the variant operates on MoveJob.service_type, a cost calculation on the Estimate domain."
        test_recipe:
          setup:
            - "Customer registered; one LONG_HAUL job (distance 900mi, 2 stairs, 1 long-carry) and one LOCAL job (distance 0, no accessorials), each with an identical survey: sofa 2@35cf, bed 3@60cf, box 40@3cf (total 370cf, weight 2590lb)."
            - "LONG_HAUL has a packing order (dish_pack 4@1850, mirror 2@1200, 3 crates) and FULL_VALUE valuation declared 1600000 cents, deductible 50000."
            - "LOCAL has a packing order (dish_pack 2@1850) and RELEASED valuation."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv1@x.com", full_name: "DV One", origin_state_code: "CA", phone: "555-0100" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LONG_HAUL", origin_zip: "90001", destination_zip: "10001", distance_miles: 900, requested_move_date: "2026-07-01T09:00:00Z", stair_flights: 2, long_carry_units: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lh_job_id: $.data.id, lh_job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${lh_job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { lh_survey_id: $.data.id }
            - call: "POST /surveys/${lh_survey_id}/items"
              payload: { label: "sofa", quantity: 2, cubic_feet_each: 35 }
              as: Estimator
            - call: "POST /surveys/${lh_survey_id}/items"
              payload: { label: "bed", quantity: 3, cubic_feet_each: 60 }
              as: Estimator
            - call: "POST /surveys/${lh_survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /packing-orders"
              payload: { move_job_id: "${lh_job_id}", crate_count: 3, packing_lines: [ { material_code: "dish_pack", quantity: 4, unit_price_cents: 1850 }, { material_code: "mirror", quantity: 2, unit_price_cents: 1200 } ] }
              as: Estimator
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { loc_job_id: $.data.id, loc_job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${loc_job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { loc_survey_id: $.data.id }
            - call: "POST /surveys/${loc_survey_id}/items"
              payload: { label: "sofa", quantity: 2, cubic_feet_each: 35 }
              as: Estimator
            - call: "POST /surveys/${loc_survey_id}/items"
              payload: { label: "bed", quantity: 3, cubic_feet_each: 60 }
              as: Estimator
            - call: "POST /surveys/${loc_survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /packing-orders"
              payload: { move_job_id: "${loc_job_id}", crate_count: 0, packing_lines: [ { material_code: "dish_pack", quantity: 2, unit_price_cents: 1850 } ] }
              as: Estimator
          trigger:
            - call: "POST /estimates"
              payload: { move_job_id: "${lh_job_id}", survey_id: "${lh_survey_id}", binding_type: "BINDING", valuation_coverage: "FULL_VALUE", declared_value_cents: 1600000, deductible_cents: 50000, expected_move_job_version: "${lh_job_v}" }
              as: Estimator
              captures: { lh_est_id: $.data.id, lh_total: $.data.estimate_total_cents }
            - call: "POST /estimates"
              payload: { move_job_id: "${loc_job_id}", survey_id: "${loc_survey_id}", binding_type: "NON_BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${loc_job_v}" }
              as: Estimator
              captures: { loc_est_id: $.data.id, loc_total: $.data.estimate_total_cents }
          assert:
            - "Estimate.${lh_est_id}.estimate_total_cents == 666864"
            - "Estimate.${lh_est_id}.linehaul_cents == 543900"
            - "Estimate.${lh_est_id}.labor_cents == 0"
            - "Estimate.${loc_est_id}.estimate_total_cents == 70200"
            - "Estimate.${loc_est_id}.labor_cents == 57000"
            - "Estimate.${loc_est_id}.linehaul_cents == 0"

      - name: claim_settlement_released_vs_full_value_diverge
        grounds:
          - calculations.claim_settlement
          - calculations.claim_settlement.variants.released
          - calculations.claim_settlement.variants.full_value
          - entities.DamageClaim.fields.coverage_snapshot
          - entities.DamageClaim.fields.settlement_cents
        distinguishing_aspect: "Identical damaged item (40lb, repair 90000, replacement 150000) settles at 2400 cents under RELEASED but 40000 cents under FULL_VALUE; this is a payout calculation on the DamageClaim domain, structurally distinct from the estimate-cost dual-variant."
        test_recipe:
          setup:
            - "Two delivered jobs: one whose accepted estimate was RELEASED, one FULL_VALUE (deductible 50000). Each has a damage claim under review with the SAME single item (40lb, repair 90000, replacement 150000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv2@x.com", full_name: "DV Two", origin_state_code: "CA", phone: "555-0200" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            # ---- RELEASED job, taken to DELIVERED ----
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rj_id: $.data.id, rj_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${rj_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { rj_survey_id: $.data.id }
            - call: "POST /surveys/${rj_survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${rj_id}", survey_id: "${rj_survey_id}", binding_type: "NON_BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${rj_v}" }
              as: Estimator
              as_user_id: "estimator-1"
              captures: { rj_est_id: $.data.id }
            - call: "POST /estimates/${rj_est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /move-jobs/${rj_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 10000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trucks"
              payload: { plate: "RJ-TRK", capacity_cubic_feet: 2000, home_state_code: "CA" }
              as: Dispatcher
              captures: { rj_truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "RJ Crew", head_count: 3, home_state_code: "CA" }
              as: Dispatcher
              captures: { rj_crew_id: $.data.id }
            - call: "POST /dispatches"
              payload: { move_job_id: "${rj_id}", truck_id: "${rj_truck_id}", crew_id: "${rj_crew_id}", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T12:00:00Z", required_crew_size: 3 }
              as: Dispatcher
              captures: { rj_disp_id: $.data.id }
            - call: "POST /dispatches/${rj_disp_id}/depart"
              payload: {}
              as: Dispatcher
            - call: "POST /dispatches/${rj_disp_id}/complete"
              payload: { actual_weight_lbs: 840 }
              as: Dispatcher
            - call: "POST /damage-claims"
              payload: { move_job_id: "${rj_id}" }
              as: ClaimsAdjuster
              as_user_id: "adj-filer"
              captures: { rj_claim_id: $.data.id }
            - call: "POST /damage-claims/${rj_claim_id}/items"
              payload: { label: "mirror", item_weight_lbs: 40, repair_cost_cents: 90000, replacement_value_cents: 150000 }
              as: ClaimsAdjuster
              as_user_id: "adj-filer"
            # ---- FULL_VALUE job, taken to DELIVERED ----
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-03T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fj_id: $.data.id, fj_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${fj_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { fj_survey_id: $.data.id }
            - call: "POST /surveys/${fj_survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${fj_id}", survey_id: "${fj_survey_id}", binding_type: "NON_BINDING", valuation_coverage: "FULL_VALUE", declared_value_cents: 600000, deductible_cents: 50000, expected_move_job_version: "${fj_v}" }
              as: Estimator
              as_user_id: "estimator-1"
              captures: { fj_est_id: $.data.id }
            - call: "POST /estimates/${fj_est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /move-jobs/${fj_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 10000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /dispatches"
              payload: { move_job_id: "${fj_id}", truck_id: "${rj_truck_id}", crew_id: "${rj_crew_id}", window_start: "2026-07-03T09:00:00Z", window_end: "2026-07-03T12:00:00Z", required_crew_size: 3 }
              as: Dispatcher
              captures: { fj_disp_id: $.data.id }
            - call: "POST /dispatches/${fj_disp_id}/depart"
              payload: {}
              as: Dispatcher
            - call: "POST /dispatches/${fj_disp_id}/complete"
              payload: { actual_weight_lbs: 840 }
              as: Dispatcher
            - call: "POST /damage-claims"
              payload: { move_job_id: "${fj_id}" }
              as: ClaimsAdjuster
              as_user_id: "adj-filer"
              captures: { fj_claim_id: $.data.id }
            - call: "POST /damage-claims/${fj_claim_id}/items"
              payload: { label: "mirror", item_weight_lbs: 40, repair_cost_cents: 90000, replacement_value_cents: 150000 }
              as: ClaimsAdjuster
              as_user_id: "adj-filer"
          trigger:
            - call: "POST /damage-claims/${rj_claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-approver"
              captures: { rj_settle: $.data.settlement_cents }
            - call: "POST /damage-claims/${fj_claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-approver"
              captures: { fj_settle: $.data.settlement_cents }
          assert:
            - "DamageClaim.${rj_claim_id}.settlement_cents == 2400"
            - "DamageClaim.${fj_claim_id}.settlement_cents == 40000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: long_haul_tiered_cwt_with_fuel_and_addons
        grounds:
          - calculations.estimate_total
          - calculations.estimate_total.variants.long_haul
          - calculations.valuation_premium
          - entities.MoveJob.fields.distance_miles
        distinguishing_aspect: "Mode (a): estimate_total composes >=3 interacting inputs — banded cwt rate selected by distance (tier 751_1500=21000), fuel = 8.5% of linehaul, plus packing+valuation+accessorial — yielding 666864; no other instance exercises this conditional tier-selection axis."
        test_recipe:
          setup:
            - "LONG_HAUL job distance 900mi (tier 751_1500), survey 370cf/2590lb, packing order (dish 4@1850, mirror 2@1200, 3 crates), FULL_VALUE declared 1600000 deductible 50000, 2 stairs + 1 long-carry."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf1@x.com", full_name: "CF One", origin_state_code: "CA", phone: "555-0300" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LONG_HAUL", origin_zip: "90001", destination_zip: "10001", distance_miles: 900, requested_move_date: "2026-07-01T09:00:00Z", stair_flights: 2, long_carry_units: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "sofa", quantity: 2, cubic_feet_each: 35 }
              as: Estimator
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "bed", quantity: 3, cubic_feet_each: 60 }
              as: Estimator
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /packing-orders"
              payload: { move_job_id: "${job_id}", crate_count: 3, packing_lines: [ { material_code: "dish_pack", quantity: 4, unit_price_cents: 1850 }, { material_code: "mirror", quantity: 2, unit_price_cents: 1200 } ] }
              as: Estimator
          trigger:
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "BINDING", valuation_coverage: "FULL_VALUE", declared_value_cents: 1600000, deductible_cents: 50000, expected_move_job_version: "${job_v}" }
              as: Estimator
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.linehaul_cents == 543900"
            - "Estimate.${est_id}.fuel_surcharge_cents == 46232"
            - "Estimate.${est_id}.valuation_premium_cents == 14432"
            - "Estimate.${est_id}.accessorial_cents == 24000"
            - "Estimate.${est_id}.packing_cents == 38300"
            - "Estimate.${est_id}.estimate_total_cents == 666864"

      - name: final_charge_round_per_component_then_sum
        grounds:
          - calculations.final_charge_reconciliation
          - calculations.final_charge_reconciliation.variants.non_binding_actual
          - state_machines.Dispatch.EN_ROUTE_to_COMPLETED
          - entities.MoveJob.fields.final_charge_cents
        distinguishing_aspect: "Mode (b): NON_BINDING reconciliation rounds linehaul (651000) and fuel (55335) independently to integer cents BEFORE summing with carried-over packing/valuation/accessorial, giving 783067; the pinned round-per-component order is the structurally distinct rounding axis (vs mode (a)'s tier selection)."
        test_recipe:
          setup:
            - "NON_BINDING LONG_HAUL job booked from a 370cf estimate (estimate_total 666864), deposit paid, dispatched, EN_ROUTE; completed with actual_weight_lbs 3100 (re-rate)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf2@x.com", full_name: "CF Two", origin_state_code: "CA", phone: "555-0400" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LONG_HAUL", origin_zip: "90001", destination_zip: "10001", distance_miles: 900, requested_move_date: "2026-07-01T09:00:00Z", stair_flights: 2, long_carry_units: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "sofa", quantity: 2, cubic_feet_each: 35 }
              as: Estimator
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "bed", quantity: 3, cubic_feet_each: 60 }
              as: Estimator
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /packing-orders"
              payload: { move_job_id: "${job_id}", crate_count: 3, packing_lines: [ { material_code: "dish_pack", quantity: 4, unit_price_cents: 1850 }, { material_code: "mirror", quantity: 2, unit_price_cents: 1200 } ] }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "NON_BINDING", valuation_coverage: "FULL_VALUE", declared_value_cents: 1600000, deductible_cents: 50000, expected_move_job_version: "${job_v}" }
              as: Estimator
              as_user_id: "estimator-7"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /move-jobs/${job_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 100000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trucks"
              payload: { plate: "CF-TRK", capacity_cubic_feet: 2000, home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "CF Crew", head_count: 3, home_state_code: "CA" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /dispatches"
              payload: { move_job_id: "${job_id}", truck_id: "${truck_id}", crew_id: "${crew_id}", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T12:00:00Z", required_crew_size: 3 }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/depart"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /dispatches/${disp_id}/complete"
              payload: { actual_weight_lbs: 3100 }
              as: Dispatcher
          assert:
            - "MoveJob.${job_id}.final_charge_cents == 783067"
            - "MoveJob.${job_id}.job_status == DELIVERED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: estimate_revision_cycle_draft_revised_revised
        grounds:
          - state_machines.Estimate.DRAFT_to_REVISED
          - state_machines.Estimate.REVISED_to_REVISED
          - entities.Estimate.fields.status
        distinguishing_aspect: "Estimate cycles DRAFT->REVISED->REVISED (A->B->B self-loop), a non-linear shape on the Estimate entity; version increments each revise and status stays REVISED."
        test_recipe:
          setup:
            - "QUOTING LONG_HAUL job with a 370cf survey and a DRAFT estimate."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nl1@x.com", full_name: "NL One", origin_state_code: "CA", phone: "555-0500" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LONG_HAUL", origin_zip: "90001", destination_zip: "10001", distance_miles: 900, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/revise"
              payload: { binding_type: "NON_BINDING" }
              as: Estimator
              captures: { v_after_1: $.data.version }
            - call: "POST /estimates/${est_id}/revise"
              payload: { valuation_coverage: "RELEASED" }
              as: Estimator
              captures: { v_after_2: $.data.version }
          assert:
            - "Estimate.${est_id}.status == REVISED"
            - "Estimate.${est_id}.version == 3"

      - name: damage_claim_approve_then_reopen_cycle
        grounds:
          - state_machines.DamageClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.DamageClaim.APPROVED_to_UNDER_REVIEW
          - entities.DamageClaim.fields.status
        distinguishing_aspect: "DamageClaim cycles UNDER_REVIEW->APPROVED->UNDER_REVIEW (branch-with-revert), a non-linear shape on a DIFFERENT entity than Estimate; the revert zeroes settlement_cents."
        test_recipe:
          setup:
            - "Delivered RELEASED job with an APPROVED claim (single 40lb item, settlement 2400)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nl2@x.com", full_name: "NL Two", origin_state_code: "CA", phone: "555-0600" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
