            - "trigger[0] responds 201 with CEUActivity.${early_id}.credits_awarded == 12.00, status SUBMITTED and counted == false — a pre-cycle date is accepted under this variant"
            - "after trigger[1] CEUActivity.${early_id}.credits_counted == 12.00 and RecertificationCycle.${cycle_id}.credits_applied == 12.00 with status SATISFIED"
            - "trigger[2] responds 422 with ${err_window} == ERR_ACTIVITY_OUTSIDE_CYCLE (2026-05-11 is 91 days before starts_on) and no CEUActivity row is created"
            - "after trigger[2] RecertificationCycle.${cycle_id}.credits_applied stays 12.00 and status stays SATISFIED"
            - "Certificant.${cert_id}.ceu_credits_applied == 12.00 and status == ACTIVE"
      - name: audit_sampling_counts_verification_completions_in_order_and_skips_denied_applications
        claim_type: chronological
        grounds:
          - calculations.audit_sampling_selection
          - entities.CertificationProgram.computed_fields.verified_application_counter
          - entities.EligibilityApplication.fields.audit_sequence_number
          - state_machines.EligibilityApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.EligibilityApplication.UNDER_REVIEW_to_AUDIT_SELECTED
          - state_machines.EligibilityApplication.UNDER_REVIEW_to_DENIED
          - calculations.eligibility_dimension_evaluation
        distinguishing_aspect: |
          The sequence number is stamped in the order applications COMPLETE verification, not
          the order they were created, and a denial must not consume a number: with
          audit_every_nth 2 the first completion takes 1 (APPROVED), the second takes 2
          (AUDIT_SELECTED), the third application is DENIED and leaves the counter at 2, so the
          fourth takes 3 and is APPROVED. An implementation that counted rows, or that
          incremented on denial, would sample the fourth application instead.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX with audit_every_nth 2, min_experience_months 24, education_recency_years 10 and eligibility_valid_days 365. No items, forms or sessions are needed."
            - "Four SUBMITTED applications created in the order A, B, C, D, each for its own candidate, all with education_credential BACHELOR and education_completion_year 2020. A, B and D declare 36 experience_months; C declares only 6, which is below min_experience_months 24."
            - "The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 2, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /candidates"
              payload: {"email": "cand.a@example.com", "full_name": "Cand A"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { candA_id: "$.data.id" }
            - call: "POST /applications"
              payload: {"candidate_id": "${candA_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 36, "attestation_signed": true}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { appA_id: "$.data.id" }
            - call: "POST /candidates"
              payload: {"email": "cand.b@example.com", "full_name": "Cand B"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { candB_id: "$.data.id" }
            - call: "POST /applications"
              payload: {"candidate_id": "${candB_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 36, "attestation_signed": true}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { appB_id: "$.data.id" }
            - call: "POST /candidates"
              payload: {"email": "cand.c@example.com", "full_name": "Cand C"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { candC_id: "$.data.id" }
            - call: "POST /applications"
              payload: {"candidate_id": "${candC_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 6, "attestation_signed": true}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { appC_id: "$.data.id" }
            - call: "POST /candidates"
              payload: {"email": "cand.d@example.com", "full_name": "Cand D"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { candD_id: "$.data.id" }
            - call: "POST /applications"
              payload: {"candidate_id": "${candD_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 36, "attestation_signed": true}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { appD_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${appA_id}/verify"
              payload: {"dimension": "EDUCATION", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-1"
            - call: "POST /applications/${appA_id}/verify"
              payload: {"dimension": "EXPERIENCE", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-2"
            - call: "POST /applications/${appB_id}/verify"
              payload: {"dimension": "EDUCATION", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-1"
            - call: "POST /applications/${appB_id}/verify"
              payload: {"dimension": "EXPERIENCE", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-2"
            - call: "POST /applications/${appC_id}/verify"
              payload: {"dimension": "EDUCATION", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-1"
            - call: "POST /applications/${appC_id}/verify"
              payload: {"dimension": "EXPERIENCE", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-2"
            - call: "POST /applications/${appD_id}/verify"
              payload: {"dimension": "EDUCATION", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-1"
            - call: "POST /applications/${appD_id}/verify"
              payload: {"dimension": "EXPERIENCE", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-2"
          assert:
            - "after trigger[0] EligibilityApplication.${appA_id}.status == UNDER_REVIEW, education_status == VERIFIED and audit_sequence_number == null (the counter moves only on the completing call)"
            - "after trigger[1] EligibilityApplication.${appA_id}.status == APPROVED, audit_sequence_number == 1 (1 % 2 != 0) and eligibility_expires_on == 2027-08-01"
            - "after trigger[3] EligibilityApplication.${appB_id}.status == AUDIT_SELECTED, audit_sequence_number == 2 (2 % 2 == 0) and eligibility_expires_on == null"
            - "after trigger[5] EligibilityApplication.${appC_id}.status == DENIED with experience_status == FAILED and denial_reason == EXPERIENCE_FAILED, even though the reviewer submitted outcome PASS (6 < 24)"
            - "after trigger[5] EligibilityApplication.${appC_id}.audit_sequence_number == null and CertificationProgram.${prog_id}.verified_application_counter == 2 — the denial consumed no sequence number"
            - "after trigger[7] EligibilityApplication.${appD_id}.status == APPROVED with audit_sequence_number == 3 and eligibility_expires_on == 2027-08-01"
            - "CertificationProgram.${prog_id}.verified_application_counter == 3 at the end, not 4"
            - "EligibilityApplication.${appD_id}.status is not AUDIT_SELECTED — a counter that had advanced on the denial would have sampled it"
      - name: item_statistics_round_p_value_to_four_decimals_with_half_up
        claim_type: precision
        grounds:
