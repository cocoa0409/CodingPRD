      - name: wrong_role_on_a_missing_allocation_is_rejected_on_role_before_existence
        grounds:
          - validations[priority=20]
          - validations[priority=50]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - rbac.HfaComplianceOfficer
        distinguishing_aspect: |
          A THIRD category pair - AUTH (priority 20) versus EXISTENCE (priority
          50): the compliance officer aims a decision at an allocation id that
          was never created, so both rules are violated, and the answer is
          ERR_FORBIDDEN_ROLE (403). The 404 is never reached, so the response
          leaks nothing about which allocation ids exist.
        test_recipe:
          setup:
            - "Only a cap pool exists; no VolumeCapAllocation is ever created in this scenario."
            - "The cap pool is read once so the optimistic-concurrency field on the decision call carries a real version value rather than a guess."
          setup_api_calls:
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              captures: { pool_id: $.data.id }
