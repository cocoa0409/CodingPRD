  # ===========================================================================
  - section: Consistency Model
    instances:

      - name: plan_approval_response_already_shows_every_cascaded_change
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[Recall].transitions[SUBMITTED -> APPROVED]
          - response_envelope.success
        distinguishing_aspect: |
          The declared model is `immediate`, and the approve-plan cascade is the widest
          write in the scaffold: it touches four rows across three entities plus two
          state dimensions of the recall itself. The approve-plan response body must
          therefore already carry the new plan_status, the new notification axis and
          the freshly stamped stop_sale_effective_at with no re-read, and reads issued
          immediately after must show the notification and BOTH retailers' counters
          already settled. Any deferred or read-repair implementation shows
          NOT_STARTED in the response body and only converges on a later GET.
        test_recipe:
          setup:
            - "fixture chain F1 to a SUBMITTED recall plan at clock 2026-03-13T00:00:00Z with two retailers, each holding one PENDING notification"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Burn requiring hospitalisation." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Overheating unit scorched a counter." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Minor thumb burn." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id }
            - call: "POST /product-safety/hazard-patterns/${hp_id}/adjudicate"
              payload: { decision: "CONFIRMED" }
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations"
              payload: { hazard_pattern_id: "${hp_id}", standard_basis: "DEFECT" }
              as: ComplianceOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/determine"
              payload: { determination: "REPORTABLE", defect_score: 8, risk_score: 7, determination_note: "Weld defect confirmed on three verified burn incidents." }
              as: ComplianceOfficer
            - call: "POST /product-safety/section-reports"
              payload: { reportability_evaluation_id: "${ev_id}", corrective_action_type: "REFUND", corrective_action_summary: "Full refund with prepaid return." }
              as: ComplianceOfficer
              captures: { sr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/section-reports/${sr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              captures: { days_late: $.data.days_late }
            - call: "POST /product-safety/section-reports/${sr_id}/review"
              payload: { decision: "ACCEPTED" }
              as: SafetyDirector
              as_user_id: "dir-1"
            - call: "POST /product-safety/recalls"
              payload: { section_report_id: "${sr_id}", remedy_options: ["REFUND", "REPAIR"], units_in_commerce: 100, participation_goal_pct: 30.00, correction_deadline_at: "2026-09-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rc_id: $.data.id, rc_v_pre: $.data.version, axis_pre: $.data.notification_status }
            - call: "POST /product-safety/consumer-notices"
              payload: { recall_id: "${rc_id}", channel: "DIRECT_NOTICE", scheduled_for: "2026-03-14T00:00:00Z", reach_count: 60 }
              as: ComplianceOfficer
              captures: { cn_id: $.data.id }
            - call: "POST /product-safety/retailers"
              payload: { name: "MegaMart", channel_type: "BIG_BOX", store_count: 120 }
              as: ProgramAdmin
              captures: { ret1_id: $.data.id }
            - call: "POST /product-safety/retailers"
              payload: { name: "CornerHome", channel_type: "INDEPENDENT", store_count: 4 }
              as: ProgramAdmin
              captures: { ret2_id: $.data.id }
            - call: "POST /product-safety/retailer-notifications"
              payload: { recall_id: "${rc_id}", retailer_id: "${ret1_id}" }
              as: ComplianceOfficer
              captures: { rn1_id: $.data.id }
            - call: "POST /product-safety/retailer-notifications"
              payload: { recall_id: "${rc_id}", retailer_id: "${ret2_id}" }
              as: ComplianceOfficer
              captures: { rn2_id: $.data.id }
            - call: "POST /product-safety/recalls/${rc_id}/submit-plan"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /product-safety/recalls/${rc_id}/approve-plan"
              payload: {}
              as: SafetyDirector
              as_user_id: "dir-1"
              captures: { plan: $.data.plan_status, axis: $.data.notification_status, stop_sale_at: $.data.stop_sale_effective_at, rc_v_post: $.data.version }
            - call: "GET /product-safety/retailer-notifications/${rn1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { n1_status: $.data.status, n1_issued: $.data.issued_at, n1_due: $.data.ack_due_at, n1_flag: $.data.stop_sale_required }
            - call: "GET /product-safety/retailers/${ret2_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { r2_posture: $.data.compliance_posture, r2_open: $.data.open_stop_sale_count }
          assert:
            - "${axis_pre} == NOT_STARTED at creation and ${rc_v_pre} == 1"
            - "the single approve-plan response body already carries ${plan} == APPROVED, ${axis} == IN_PROGRESS and ${stop_sale_at} == 2026-03-13T00:00:00Z"
            - "${rc_v_post} == 3 — submit-plan and approve-plan each advanced the row exactly once"
            - "${n1_status} == ISSUED, ${n1_flag} == true, ${n1_issued} == 2026-03-13T00:00:00Z and ${n1_due} == 2026-03-16T00:00:00Z on the first read after the write"
            - "${r2_posture} == STOP_SALE_ACTIVE and ${r2_open} == 1 for the SECOND retailer too — the whole batch settled inside the one request"
            - "no additional call, sweep or delay was needed between the write and the reads"
