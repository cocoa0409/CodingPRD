            - "the response is not ERR_PHASE_NOT_PERMITTED"
            - "Engagement.${eng}.status == ON_HOLD and phase == ASSESSMENT"
            - "GET /move-day-plans filtered by engagement_id returns total_count == 0"

      - name: party_engagement_mismatch_precedes_the_active_authority_check
        claim_type: violation_to_error
        grounds: ['validations[priority=26]', 'validations[priority=27]', 'errors[ERR_PARTY_ENGAGEMENT_MISMATCH]', 'errors[ERR_NO_ACTIVE_AUTHORITY]', 'gate_precedence[4]']
        distinguishing_aspect: "Both rungs sit inside gate 4, so their order alone decides: a POA acting on engagement B with no AuthorityRecord at all, but supplying an approved_by_party_id belonging to engagement A, receives 422 ERR_PARTY_ENGAGEMENT_MISMATCH at rung 26 rather than 403 ERR_NO_ACTIVE_AUTHORITY at rung 27."
        test_recipe:
          setup: ["Engagement A with one portal party, and engagement B with a POA party holding no authority record and a SUBMITTED sort plan."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
