            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "d1", display_name: "Depth one", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${d0}" }
              as: DataSteward
