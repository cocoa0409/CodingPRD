        distinguishing_aspect: |
          DIFFERENT interval semantics: the raw intervals [09:00,12:00) and
          [12:30,14:00) do NOT intersect, but shift B carries
          setup_buffer_minutes 45, extending its guard interval back to 11:45,
          which overlaps shift A's 11:45-12:00 -> rejected. The collision exists
          ONLY because of the buffer extension, not raw adjacency.
        test_recipe:
