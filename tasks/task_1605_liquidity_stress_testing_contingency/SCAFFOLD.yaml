  - method: GET
    path: "/liquidity/intraday-snapshots"
    description: "List intraday snapshots"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["business_date?", "limit?", "offset?"]
    output: IntradaySnapshot[]
    side_effects: []

# =============================================================================
# Section 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation (incl. state-specific role rules: ESCALATED-breach remediation and posture de-escalation require LiquidityCommittee)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, enum violation, range violation, or cross-field rule broken (kind-required FKs, prerequisite same-playbook/smaller-sequence, ewi_metric_id iff EWI_METRIC, capacity-test with zero actions)" }
  - { id: ERR_THRESHOLD_CONFIG_INVALID, http: 422, condition: "EWI metric thresholds inconsistent with direction (ABOVE needs red > amber; BELOW needs red < amber)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: approver == playbook creator, or remediator == breach acknowledger" }
  - { id: ERR_POSTURE_INSUFFICIENT, http: 409, condition: "Current posture ordinal below playbook min_activation_posture ordinal at activation" }
  - { id: ERR_LINE_SUSPENDED, http: 409, condition: "Operation references a BorrowingLine with status SUSPENDED" }
  - { id: ERR_ASSET_NOT_PLEDGEABLE, http: 409, condition: "Pledge references an asset whose encumbrance_status != UNENCUMBERED" }
  - { id: ERR_ASSET_NOT_AVAILABLE, http: 409, condition: "ASSET_SALE execution references an asset whose encumbrance_status != UNENCUMBERED" }
  - { id: ERR_SCENARIO_RETIRED, http: 409, condition: "Run creation or finalize against a RETIRED StressScenario" }
  - { id: ERR_DEESCALATION_BLOCKED, http: 409, condition: "Posture de-escalation attempted while red_count > 0 or open_breach_count > 0" }
  - { id: ERR_SETTLEMENT_NOT_DUE, http: 409, condition: "Settle before logical clock reaches executed_at + settlement_lag_days" }
  - { id: ERR_READING_TOO_FREQUENT, http: 409, condition: "observed_at earlier than last_reading_at + min_reading_interval_hours (== boundary allowed)" }
  - { id: ERR_SNAPSHOT_OUT_OF_ORDER, http: 409, condition: "snapshot_at not strictly greater than existing snapshots for the same business_date" }
  - { id: ERR_DUPLICATE_ACTIVE_SCENARIO, http: 409, condition: "An ACTIVE StressScenario already exists for the requested tier" }
  - { id: ERR_LAST_BASELINE_SCENARIO, http: 409, condition: "Attempt to retire the last ACTIVE BASELINE scenario" }
  - { id: ERR_SCENARIO_IN_USE, http: 409, condition: "Attempt to retire a scenario that has a DRAFT ProjectionRun" }
  - { id: ERR_PLAYBOOK_ALREADY_ACTIVE, http: 409, condition: "Another playbook already holds status ACTIVATED or EXECUTING" }
  - { id: ERR_PREREQUISITE_ACTION_INCOMPLETE, http: 409, condition: "Execute attempted while prerequisite action is not SETTLED" }
  - { id: ERR_ACTIONS_NOT_ALL_TERMINAL, http: 409, condition: "Complete attempted while some action is not in {SETTLED, FAILED, SKIPPED}" }
  - { id: ERR_LIMIT_STILL_BREACHED, http: 409, condition: "Remediate attempted while the current subject value still violates the limit" }
  - { id: ERR_INSUFFICIENT_BORROWING_POWER, http: 409, condition: "Draw or LINE_DRAWDOWN execution exceeds borrowing_power_cents" }
  - { id: ERR_REPAY_EXCEEDS_DRAWN, http: 409, condition: "Repayment amount exceeds drawn_cents" }

# =============================================================================
# Section 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: TreasuryAnalyst
    description: "Liquidity desk analyst: projections, funding data, playbook drafting, EWI readings"
    identity: opaque
    exclusive_operations:
      - "POST /liquidity/stress-scenarios/{id}/projection-runs"
      - "POST /liquidity/projection-runs/{id}/finalize"
      - "POST /liquidity/funding-sources"
      - "POST /liquidity/ewi-metrics/{id}/readings"
      - "POST /liquidity/contingency-playbooks"
      - "PATCH /liquidity/contingency-playbooks/{id}"
      - "POST /liquidity/contingency-playbooks/{id}/actions"
      - "POST /liquidity/contingency-playbooks/{id}/revise"
    shared_operations: ["all GET endpoints"]
  - name: RiskOfficer
    description: "Liquidity risk officer: scenarios, EWI/limit configuration, capacity tests, approvals, breach acknowledgment, line suspension, posture evaluation (escalation path only)"
    identity: opaque
    exclusive_operations:
      - "POST /liquidity/stress-scenarios"
      - "POST /liquidity/stress-scenarios/{id}/retire"
      - "POST /liquidity/funding-evaluations"
      - "POST /liquidity/ewi-metrics"
      - "POST /liquidity/contingency-playbooks/{id}/capacity-test"
      - "POST /liquidity/contingency-playbooks/{id}/approve"
      - "POST /liquidity/borrowing-lines/{id}/suspend"
      - "POST /liquidity/borrowing-lines/{id}/reinstate"
      - "POST /liquidity/board-limits"
      - "POST /liquidity/breaches/{id}/acknowledge"
    shared_operations: ["all GET endpoints", "POST /liquidity/posture-evaluations (escalation or unchanged level only)", "POST /liquidity/breaches/{id}/remediate (ACKNOWLEDGED branch only)"]
  - name: TreasuryOps
    description: "Treasury operations: HQLA inventory, borrowing lines, collateral pledges, draws/repayments, action execution, intraday snapshots"
    identity: opaque
    exclusive_operations:
      - "POST /liquidity/liquid-assets"
      - "PATCH /liquidity/liquid-assets/{id}"
      - "POST /liquidity/borrowing-lines"
      - "POST /liquidity/borrowing-lines/{id}/draw"
      - "POST /liquidity/borrowing-lines/{id}/repay"
      - "POST /liquidity/collateral-pledges"
      - "POST /liquidity/collateral-pledges/{id}/release"
      - "POST /liquidity/playbook-actions/{id}/execute"
      - "POST /liquidity/playbook-actions/{id}/settle"
      - "POST /liquidity/playbook-actions/{id}/fail"
      - "POST /liquidity/intraday-snapshots"
    shared_operations: ["all GET endpoints"]
  - name: LiquidityCommittee
    description: "ALCO/committee authority: playbook activation and completion, breach escalation, escalated remediation, posture de-escalation"
    identity: opaque
    exclusive_operations:
      - "POST /liquidity/contingency-playbooks/{id}/activate"
      - "POST /liquidity/contingency-playbooks/{id}/stand-down"
      - "POST /liquidity/contingency-playbooks/{id}/complete"
      - "POST /liquidity/breaches/{id}/escalate"
    shared_operations: ["all GET endpoints", "POST /liquidity/posture-evaluations (including de-escalation)", "POST /liquidity/breaches/{id}/remediate (both branches)"]
  - name: PlatformAdmin
    description: "Test-driving operator for the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /liquidity/_clock/set_current_utc"
    shared_operations: []
