        mode: c
        distinguishing_aspect: |
          Mode c - interdependent parameters. Owner shares depend on overhead, overhead depends on the
          direct pools, and the pools are exactly what non-consent reallocation moves between owners.
          The pinned cut is that overhead_cents 134000 is computed once from the PRE-reallocation
          gross pools (capital 2500000, operating 300000) while its ALLOCATION uses POST-reallocation
          weights, so the operator absorbs 78964 of overhead rather than the 67000 a pre-reallocation
          split would give. OB keeps its non-AFE capital share of 100000 but is withheld 400000 of AFE
          capital, which reappears as 250000 to OP and 150000 to OA, and its penalty accrues at 3.0x.
