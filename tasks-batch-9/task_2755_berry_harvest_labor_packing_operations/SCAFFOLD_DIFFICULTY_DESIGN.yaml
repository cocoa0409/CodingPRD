            - "after the refused ship: BuyerCommitment.${com}.shipped_lbs == 0.00 and BuyerCommitment.${com}.committed_lbs == 80.00"
            - "after complete-cooling: FruitLot.${lot}.cold_chain_status == COOLED and FruitLot.${lot}.verified_shelf_life_days == 7"
