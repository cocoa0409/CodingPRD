        distinguishing_aspect: |
          Two different refusals of the same endpoint: executing an APPROVED request after
          valid_until (2026-01-11T10:00:00.000Z, five days after the decision) is
          ERR_PRECLEARANCE_EXPIRED, while executing a request that is still SUBMITTED is
          ERR_PRECLEARANCE_INVALID_STATE - expiry is a temporal rule, not a state rule.
        test_recipe:
          setup:
            - "Logical clock 2026-01-06T10:00:00Z; ACTIVE plan; two DESIGNATED_INSIDER participants; OPEN window over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z)."
            - "Request A from participant 1 is APPROVED at 2026-01-06T10:00:00Z (valid_until 2026-01-11T10:00:00.000Z); request B from participant 2 is left SUBMITTED."
            - "The clock is then advanced to 2026-01-12T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-06T10:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
