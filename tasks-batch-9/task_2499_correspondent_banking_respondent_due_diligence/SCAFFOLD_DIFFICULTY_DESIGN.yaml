  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_blocked_state_error_outranks_the_wind_down_cap_fiscal_error_on_the_same_release
        grounds:
          - validations[priority=14]
          - validations[priority=41]
          - calculations.notice_period_days
          - calculations.wind_down_cap
          - state_machines.PaymentInstruction.SCREENED_CLEAR_to_HELD_FOR_REVIEW
          - state_machines.RespondentBank.payment_posture.WIND_DOWN_ONLY_to_BLOCKED
        distinguishing_aspect: |
          PRECEDENCE PAIR P1 across two different validation categories - state at priority 14
          (403) against business_fiscal at priority 41 (422). The identical release request is
          replayed twice on the same payment: while the posture is WIND_DOWN_ONLY only the fiscal
          breach holds and the answer is 422 ERR_WIND_DOWN_CAP_EXCEEDED, but once the home
          jurisdiction is comprehensively sanctioned both conditions hold at once and the answer
          must flip to 403 ERR_RESPONDENT_PAYMENT_POSTURE_BLOCKED - never the fiscal error, and
          never with any part of the release booked against the cap.
        test_recipe:
          setup: >
            Logical clock stays at 2026-08-01T00:00:00Z. JurisdictionProfile DE (basel 4.0 ->
            jurisdiction_risk_points 8.00, PERMITTED, corridor_risk_weight 1.00,
            max_permitted_risk_rating HIGH). One respondent home DE,
            expected_monthly_volume_usd 5000000.00, expected_monthly_count 200,
            nested_activity_permitted false, licensed ACTIVE/GOOD_STANDING, one VERIFIED non-PEP
            natural-person owner at 80.00% in DE, eight self_rating=4 rows -> control_score 80.00,
            control_credit 0.3375, inherent_risk_score 14.00, residual_risk_score 9.28, rating LOW.
            After committee approval the posture is PATCHed to OPEN and a monitoring profile over
            the CLOSED interval [2026-07-01, 2026-12-31] with one DE corridor at 5000000.00 / 200
            and tolerance_pct 0.10 is CALIBRATED: usd_threshold 7150000.00, count_threshold
            ceil(286.0) = 286, aggregate 7865000.00, hold_threshold_usd 786500.00. A single DE->DE
            instruction of 500000.00 is submitted while the posture is OPEN, so it screens
            SCREENED_CLEAR. The relationship manager then drafts a ClosurePlan with
            termination_reason SANCTIONS_EXPOSURE, cap_basis FORWARD_PROJECTED and
            original_obligation_cents 0, submits it, and the committee approves it: notice_period_days
            is base 0 with no obligation extension and no PROHIBITED reduction = 0, so
            wind_down_cap_usd is round(5000000.00 * (0 / 30.0) * 0.60, 2) = 0.00, the respondent is
            EXITING and the posture is WIND_DOWN_ONLY with the instruction held.
          setup_api_calls:
