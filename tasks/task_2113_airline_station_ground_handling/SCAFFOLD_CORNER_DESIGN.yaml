        distinguishing_aspect: "Rolling ZRH from SUMMER to WINTER archives the SUMMER bank, cancels its SCHEDULED turn and cancels that turn's agent occupation with cancel_reason SEASON_ROLLOVER, while the station itself stays OPEN."
        test_recipe:
          setup:
