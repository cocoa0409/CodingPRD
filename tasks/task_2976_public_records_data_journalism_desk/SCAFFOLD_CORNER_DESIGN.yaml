            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "ds-clean", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "PUBLIC" }
              as: DataReporter
              captures: { ds_clean_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_clean_id}/delivery"
              payload: { delivered_format: "CSV", record_count: 500 }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_clean_id}/field-definitions"
              payload: { field_name: "case_number", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 1, is_source_identifying: false }
              as: DataReporter
          trigger:
