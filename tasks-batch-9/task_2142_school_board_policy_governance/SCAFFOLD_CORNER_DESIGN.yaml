              as: PolicyAnalyst
              captures: { pv1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "LegalMandate.${man}.status == IN_PROGRESS"
            - "Policy.${pol}.open_mandate_count == 1"
            - "Policy.${pol}.overdue_mandate_count == 0"
            - "Policy.${pol}.compliance_state == ACTION_REQUIRED"
            - "PolicyVersion.${pv1}.status == DRAFT"

