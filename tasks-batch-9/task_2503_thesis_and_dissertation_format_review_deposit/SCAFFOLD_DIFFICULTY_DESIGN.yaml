        grounds:
          - calculations.faculty_active_chair_load
          - calculations.committee_composition_counts
          - state_machines.CommitteeMember.CONFIRMED_to_WITHDRAWN
          - entities.CommitteeMember.fields.withdrawal_reason
          - entities.Committee.fields.member_count
        distinguishing_aspect: |
          The conserved quantity is a counted role load: seating a CO_CHAIR on a SUBMITTED
          committee raises that faculty member's active_chair_load from 0 to 1 and member_count from
          3 to 4, and withdrawing the same seat must return both to exactly 0 and 3 with the CHAIR's
          own load untouched at 1 — no residual drift, and because the committee is SUBMITTED rather
          than APPROVED the revert cascade never fires, so the Thesis stays COMMITTEE_PENDING.
        test_recipe:
          setup:
            - "Term 2026FA is OPEN; a MASTERS candidate's THESIS of 101 pages has a SUBMITTED committee with 3 CONFIRMED seats (CHAIR + 2 MEMBER), so Committee.member_count is 3 and the CHAIR's active_chair_load is 1."
