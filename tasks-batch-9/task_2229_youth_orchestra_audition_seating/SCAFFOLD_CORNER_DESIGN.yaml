      - name: attendance_index_counts_only_in_window_recorded_rehearsals
        claim_type: input_set_filtering
        grounds:
          - calculations.attendance_eligibility_index
          - endpoints[POST /event-participations/{participationId}/eligibility-review]
        distinguishing_aspect: |
          The index reads a filtered row set three ways: kind == REHEARSAL, start_at
          inside the half-open window [eligibility_window_start, concert.start_at), and
          attendance_status != NOT_RECORDED (excluded from numerator AND denominator). Of
          eight rehearsals only the four PRESENT ones qualify, so the index is 100.00 and
          the member is ELIGIBLE. An implementation that ignored the filters would average
          all eight recorded-or-not rows - 2 UNEXCUSED_ABSENT before the window (0.0), 4
          PRESENT (1.0), one NOT_RECORDED inside the window and one TARDY after the concert
          (0.5) - and report 100 * 4.5 / 7 = 64.29 with INELIGIBLE.
        test_recipe:
          setup:
            - "Season in IN_SEASON; Ada Strings is seated in the Philharmonic VIOLIN section."
            - "Nine events on that ensemble: eight REHEARSALs and one CONCERT on 2026-11-15"
            - "19:00-21:00 whose eligibility_window_start is 2026-10-01T00:00:00Z."
            - "Ada is rostered on all nine. Attendance was recorded by moving the logical clock"
            - "past each rehearsal's start: 09-20 and 09-27 UNEXCUSED_ABSENT (both BEFORE the"
            - "window), 10-05, 10-12, 10-19 and 10-26 PRESENT (inside), 11-02 left NOT_RECORDED"
            - "(inside the window), 11-16 TARDY (after the concert's start_at)."
            - "Only 2 unexcused absences accrued, so effective_unexcused_count is 2 - below the"
            - "probation threshold of 3, and standing_status is still CLEAR."
            - "The clock now reads 2026-11-16T18:05:00Z, still before tuition_due_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
