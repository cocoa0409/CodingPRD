      - name: copy_fee_free_page_allowance_boundary
        grounds:
          - calculations.copy_fee
          - entities.ResponsiveDocument.fields.billable_pages
        distinguishing_aspect: "A single 50-page released document sits exactly at FREE_PAGE_ALLOWANCE=50, so billable = max(0, 50-50) = 0 and assessed copy fee is 0. Metric = page count; endpoint = determination (distinct from the hours boundary at convene)."
        test_recipe:
