          setup:
            - "One HSM partition and one ACTIVE profile with max_crl_validity_hours 24 and no published CRL yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/hsm-partitions"
              payload: { label: "Window Probe Signer", serial: "HSM-2047" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/certificate-profiles"
              payload: { name: "err-window-shapes", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${profile_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "GET /ca/certificate-profiles/${profile_id}"
              payload: {}
              as: REVOCATION_OFFICER
              captures: { profile_version: $.data.version }
          trigger:
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T00:00:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { err_ceremony_window: $.data.error_id }
            - call: "POST /ca/certificate-profiles/${profile_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-01T00:00:00Z", expected_profile_version: "${profile_version}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err_crl_window: $.data.error_id }
            - call: "POST /ca/certificate-profiles/${profile_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-02T01:00:00Z", expected_profile_version: "${profile_version}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err_crl_too_long: $.data.error_id }
            - call: "POST /ca/certificate-profiles/${profile_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-02T00:00:00Z", expected_profile_version: "${profile_version}" }
              as: REVOCATION_OFFICER
