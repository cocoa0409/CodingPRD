  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_standing_put_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[standing-ride-put-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT with the creation version succeeds and bumps version to 2; replaying the same expected version is rejected with 412 — the second writer's template view is stale after the first edit regenerated occurrences."
        test_recipe:
          setup: ["ACTIVE STANDARD card; client; series created at clock 2026-05-20 (version 1, one occurrence 2026-06-01)"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /standing-rides", payload: { client_id: "${cli}", weekday: "MON", pickup_time_of_day_minutes: 540, kind: "GROCERY", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north", starts_on: "2026-06-01", ends_on: "2026-07-31" }, as: Coordinator, captures: { sr: $.data.id, sv: $.data.version } }
          trigger:
            - { call: "PUT /standing-rides/${sr}", payload: { pickup_time_of_day_minutes: 600, expected_standing_ride_version: "${sv}" }, as: Coordinator, captures: { sv2: $.data.version } }
            - { call: "PUT /standing-rides/${sr}", payload: { pickup_time_of_day_minutes: 660, expected_standing_ride_version: "${sv}" }, as: Coordinator, captures: { err: $.data.error_id } }
            - { call: "GET /standing-rides/${sr}", as: Coordinator, captures: { cur_time: $.data.pickup_time_of_day_minutes, cur_v: $.data.version } }
          assert:
            - "First PUT: 200, version == 2 (sv + 1), pickup_time_of_day_minutes == 600, occurrence set regenerated"
            - "Second PUT with stale ${sv}: error_id == ERR_STALE_VERSION, http 412"
            - "Template after conflict: pickup_time_of_day_minutes == 600 and version == 2 (loser's edit not applied)"

      - name: occ_client_patch_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[client-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the observed version succeeds and increments Client.version; replaying the same expected_client_version fails with 412."
        test_recipe:
          setup: ["client exists (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id, cv: $.data.version } }
          trigger:
            - { call: "PATCH /clients/${cli}", payload: { home_zone: "south", expected_client_version: "${cv}" }, as: Coordinator, captures: { cv2: $.data.version } }
            - { call: "PATCH /clients/${cli}", payload: { home_zone: "east", expected_client_version: "${cv}" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "First PATCH: version == 2 and home_zone == south"
            - "Second PATCH with stale ${cv}: error_id == ERR_STALE_VERSION, http 412; home_zone stays south"

