      - name: withdrawal_vote_lifecycle_guards_reject_out_of_phase_ballots
        claim_type: error_triggerable
        grounds:
          - validations[priority 19 ERR_REQUEST_NOT_DRAFT]
          - validations[priority 20 ERR_VOTE_NOT_OPEN]
          - validations[priority 37 ERR_DUPLICATE_VOTE]
          - state_machines.WithdrawalRequest.DRAFT_to_VOTE_OPEN
        distinguishing_aspect: |
          The ballot box opens exactly once and each seat votes exactly once: a ballot cast while the
          request is still DRAFT returns ERR_VOTE_NOT_OPEN 409, a second open-vote returns
          ERR_REQUEST_NOT_DRAFT 409, and voter-01's second ballot returns ERR_DUPLICATE_VOTE 409
          with the tally frozen at yes_votes 1 — uniqueness is on voter_user_id, so voter-02's
          ballot is still accepted.
