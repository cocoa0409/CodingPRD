  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: truckstock_units_conserved_consume_then_callback_restore
        grounds:
          - state_machines.ServiceJob.IN_PROGRESS_to_COMPLETED
          - state_machines.ServiceJob.COMPLETED_to_REOPENED
          - entities.TruckStock.fields.quantity
        distinguishing_aspect: |
          Conserved quantity = physical part units. total_units = TruckStock.quantity + units_consumed_on_open_invoices.
          Start qty 10; completion consumes 2 (qty 8, 2 consumed, total 10); accepting a callback voids the
          invoice and restocks +2 (qty 10, 0 consumed, total 10). The named total is unchanged across the
          forward (consume) and compensating (restore) actions.
        test_recipe:
          setup:
            - "Technician TruckStock of a part qty 10; a job approved for 2 units, completed (qty drops to 8); a within-warranty callback filed."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-02-01T09:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/parts"
              payload: { sku: "INV-1", name: "Gasket", list_price_cents: 300 }
              as: OfficeManager
              captures: { part_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "INV-FR", category: "LEAK", base_price_cents: 15000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust INV", service_address: "17 Lake St", credit_limit_cents: 1000000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech INV", skill_level: 2 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/truck-stock"
              payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity: 10, reorder_point: 1 }
              as: OfficeManager
              captures: { ts_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-02-01T10:00:00.000Z", window_end: "2026-02-01T12:00:00.000Z", eta: "2026-02-01T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "PART", part_id: "${part_id}", quantity: 2 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /plumbing/service-jobs/${job_id}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/service-jobs/${job_id}/complete"
              payload: { consumed_parts: [ { part_id: "${part_id}", units: 2 } ] }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/truck-stock/${ts_id}"
              payload: {}
              as: OfficeManager
              captures: { qty_after_consume: $.data.quantity }
            - call: "POST /plumbing/callbacks"
              payload: { original_job_id: "${job_id}", reason: "Leak returned" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /plumbing/callbacks/${cb_id}/accept"
              payload: {}
              as: OfficeManager
            - call: "GET /plumbing/truck-stock/${ts_id}"
              payload: {}
              as: OfficeManager
              captures: { qty_after_restore: $.data.quantity }
          assert:
            - "After complete, TruckStock.${ts_id}.quantity == 8"
            - "After callback accept, TruckStock.${ts_id}.quantity == 10"
            - "TruckStock.${ts_id}.quantity equals the original 10 after the void compensates the consume"

      - name: customer_credit_conserved_commit_then_cancel_release
