              captures: {pd3_id: "$.data.id"}
          trigger:
            - call: "GET /presence-determinations"
              payload: {presence_status: "PRESENT"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_present: "$.data[0].id"}
            - call: "GET /presence-determinations"
              payload: {project_action_id: "${action2_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_action2: "$.data[0].id"}
            - call: "GET /presence-determinations"
              payload: {critical_habitat_unit_id: "${chu1_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_chu: "$.data[0].id"}
            - call: "GET /presence-determinations"
              payload: {species_id: "${species_t_id}", presence_status: "PRESUMED_ABSENT"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_absent: "$.data[0].id"}
            - call: "GET /presence-determinations"
              payload: {requires_reevaluation: true}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_reeval: "$.data[0].id"}
            - call: "GET /project-actions"
              payload: {status: "SCREENING"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_screening: "$.data[0].id"}
            - call: "GET /project-actions"
              payload: {effect_determination: "LAA"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_laa: "$.data[0].id"}
            - call: "GET /project-actions"
              payload: {proponent_id: "${proponent_id}", limit: 10}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_prop_first: "$.data[0].id", f_prop_second: "$.data[1].id"}
            - call: "GET /project-actions"
              payload: {active_consultation_id: "${consultation_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {f_by_consultation: "$.data[0].id"}
          assert:
            - "presence_status PRESENT returns exactly PD1 with total_count == 1, even though three determinations exist"
            - "${f_action2} == ${pd3_id} and ${f_chu} == the PD1 id: the critical-habitat filter matches only the row that names the unit, not the other row of the same action"
            - "${f_absent} == ${pd3_id}: two filters combine conjunctively"
            - "requires_reevaluation true returns an EMPTY array with total_count == 0 — no listing change has fired yet, so the flag is false on every row"
            - "${f_screening} == ${action2_id} and ${f_laa} == ${action_id}: the status filter reads the fork's landing state and the effect filter reads its verdict"
            - "${f_prop_first} == ${action_id} and ${f_prop_second} == ${action2_id} with total_count == 2, in created_at ASC order"
            - "${f_by_consultation} == ${action_id}: this is the reverse-reachability path for ProjectAction.active_consultation_id"
            - "an unfiltered GET /presence-determinations reports total_count == 3, so each filtered total_count is genuinely recomputed"

      - name: the_bank_commitment_link_is_agency_only_and_spans_every_plan
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /conservation-banks/{id}/mitigation-commitments]
          - validations[priority=3]
          - entities.MitigationCommitment.fields.conservation_bank_id
