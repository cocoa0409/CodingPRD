            - "${e1} == ERR_OPEN_INTEGRITY_FINDINGS with HTTP 422 and RegulatoryReport.${r2}.status still PREPARED"
            - "both reports carry book_inventory_dth == 250000.000, variance_dth == 0.000 and variance_pct == 0.0000"
            - "after the program closes the same submission returns HTTP 200: RegulatoryReport.${r2}.status == SUBMITTED with open_finding_count == 0"
            - "RemediationProgram.${p1}.status == COMPLETED and Well.${w1}.integrity_state == REMEDIATED"
            - "the report listing returns total_count == 2, both in status SUBMITTED"

      - name: nomination_create_peels_off_term_then_season_then_rights_in_priority_order
        claim_type: priority_ordering
        grounds:
          - validations.priority_17_ERR_GAS_DAY_OUTSIDE_TERM
          - validations.priority_19_ERR_SEASON_DIRECTION_MISMATCH
          - validations.priority_33_ERR_CONTRACT_RIGHTS_EXCEEDED
          - errors.ERR_CONTRACT_RIGHTS_EXCEEDED
        distinguishing_aspect: |
          One payload violates three rules at once and is then repaired one field at a time, so the
          reported error must walk 17 -> 19 -> 33 in that exact order: a 2026-09-15 WITHDRAWAL of
          200000 Dth on an INTERRUPTIBLE contract whose term ends 2026-08-31 and whose daily right is
          100000 reports ERR_GAS_DAY_OUTSIDE_TERM; moving the gas day into the term reports
          ERR_SEASON_DIRECTION_MISMATCH; flipping the direction reports ERR_CONTRACT_RIGHTS_EXCEEDED;
          halving the volume finally creates the row. A greedy implementation that checks the volume
          first, or that reports all three, fails at the first call.
        test_recipe:
          setup:
            - "Field F_MINI (season INJECTION) with one well MINI-1; shipper NORTHLINE with ACTIVE INTERRUPTIBLE contract CN-2 whose term is 2026-08-01..2026-08-31 and whose daily rights are 100000 in both directions."
