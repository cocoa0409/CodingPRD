      - name: matured_deadlines_only_fire_when_the_cycle_actually_runs
        claim_type: scheduled_actions
        grounds:
          - complexity_profile.complexity_layers.scheduled_actions
          - endpoints[POST /public-art/ops/run-cycle]
          - state_machines.ArtistConsultation
          - state_machines.MoralRightsNotice
        distinguishing_aspect: "There is no background worker: a matured consultation stays PENDING and a matured notice stays SENT until run-cycle is invoked, and both maturity tests are inclusive (due_at <= clock, earliest_action_at <= clock), so the checkpoint fires exactly at the deadline instant and never twice for the same row."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; a living artist with the default 30-day response window and 90-day notice wait, one artwork, one PENDING consultation due 2026-08-31T00:00:00Z and one SENT relocation notice maturing 2026-10-30T00:00:00Z"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
