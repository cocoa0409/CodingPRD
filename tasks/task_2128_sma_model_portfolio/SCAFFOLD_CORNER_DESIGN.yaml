            - "Account.${a1}.implementation_status == SYNCED and drift_bps == null and drift_evaluated_at == null"
            - "GET /sma/trade-orders?account_id=${a1} returns exactly 0 rows"

      - name: opening_an_account_on_an_unpublished_model_returns_model_not_published
        claim_type: violation_to_error
        grounds: ["errors[ERR_MODEL_NOT_PUBLISHED]", "validations[priority=11]", "entities.Model.fields.published_model_version_id"]
        distinguishing_aspect: "An account may only be opened once its model carries a published version: with only a DRAFT v1 in existence, POST /sma/accounts returns HTTP 409 ERR_MODEL_NOT_PUBLISHED and Sponsor.account_count stays 0."
        test_recipe:
          setup: ["Model CORE has exactly one ModelVersion, still DRAFT, so published_model_version_id is null"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
