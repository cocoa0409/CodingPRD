          - errors[ERR_CLEANER_NOT_ACTIVE]
          - state_machines.Cleaner.ACTIVE_to_SUSPENDED
          - state_machines.Cleaner.SUSPENDED_to_ACTIVE
          - endpoints["POST /turnovers/{id}/assign"]
        distinguishing_aspect: |
          Entity pair Assignment <- Cleaner: an EXPLICIT offer naming a SUSPENDED cleaner is refused
          with ERR_CLEANER_NOT_ACTIVE (409) instead of silently filtering the cleaner out of the
          pool, and the identical call succeeds with match_score 0.9100 once the cleaner is
          reactivated - the Turnover's version is untouched by the refusal.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' (ZONE_A, TWO_BR, min_skill_level 2), no supply lines."
            - "Cleaner CS: home ZONE_A, skill_level 4, quality_score 92.00, then SUSPENDED via POST /cleaners/{id}/status."
            - "Turnover T1 sits in PENDING_ASSIGNMENT at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
