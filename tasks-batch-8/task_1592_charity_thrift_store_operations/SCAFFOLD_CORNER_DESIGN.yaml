      - name: vendor_rate_missing_standalone
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_VENDOR_RATE_MISSING]"]
        distinguishing_aspect: "With the weight constraint satisfied (100.0 lbs), the referential check surfaces: sealing with a vendor lacking the bale's category rates fails ERR_VENDOR_RATE_MISSING."
        test_recipe:
