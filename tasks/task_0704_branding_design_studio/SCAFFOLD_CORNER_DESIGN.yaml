# =============================================================================
# 1.9 Scaffold Corner Design — BREADTH probe (queue B). Branding & Design Studio
# (task_0704). Single top-level key. Sections / claim_types taken verbatim from
# references/claim-extraction-guide.md. Grounds resolve into SCAFFOLD.yaml
# §1.1–§1.7. excluded_because stubs cite real SCAFFOLD_DIFFICULTY_DESIGN names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_studio_returns_201_with_common_fields
        claim_type: Creation
        grounds:
          - entities.Studio
          - 'endpoints."POST /studios"'
        distinguishing_aspect: "POST /studios with name returns 201 and a Studio with server-minted id, created_at, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "S", tax_rate: 0.05, license_markup_pct: 0.1 }
              as: StudioOps
              captures: { sid: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Studio.${sid}.name == 'S' and Studio.${sid}.version == 1"
            - "response data carries id, created_at, updated_at, version"

      - name: get_project_returns_computed_ledger_fields
        claim_type: Retrieval
        grounds:
          - entities.Project
          - 'endpoints."GET /studios/{studioId}/projects/{projectId}"'
        distinguishing_aspect: "GET on an activated project returns computed base_scope_cents, contract_value_cents, provisional_deposit_cents, final_deposit_cents."
        test_recipe:
          setup: ["Project with one 10000 milestone, deposit_pct=0.30, activated."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
          trigger:
            - call: "GET /studios/${sid}/projects/${pid}"
              payload: {}
              as: StudioOps
              captures: { base: $.data.base_scope_cents }
          assert:
            - "Project.${pid}.base_scope_cents == 10000"
            - "Project.${pid}.contract_value_cents == 10000"
            - "Project.${pid}.provisional_deposit_cents == 3000"
            - "Project.${pid}.final_deposit_cents == 3000"

      - name: list_clients_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Client
          - 'endpoints."GET /studios/{studioId}/clients"'
        distinguishing_aspect: "GET /studios/{id}/clients returns a paginated array with total_count and has_more in meta/pagination."
        test_recipe:
          setup: ["A studio with two clients."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C1", contact_email: "c1@c.com" }
              as: StudioOps
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C2", contact_email: "c2@c.com" }
              as: StudioOps
          trigger:
            - call: "GET /studios/${sid}/clients"
              payload: { limit: 1, offset: 0 }
              as: StudioOps
              captures: { tc: $.meta.total_count }
          assert:
            - "response_type == 'array'; total_count == 2; has_more == true with limit=1"
            - "returned data array length == 1"

      - name: get_nonexistent_project_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Project
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET a project with a random non-existent UUID under a real studio returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A studio exists; no project with the queried id."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /studios/${sid}/projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioOps
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: create_project_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Project.fields.service_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST project omitting required service_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A studio and an ACTIVE client."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", deposit_pct: 0.30 }
              as: StudioOps
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: create_concept_default_revision_limit_applied
        claim_type: Defaults
        grounds:
          - entities.Concept.fields.revision_limit
        distinguishing_aspect: "POST concept omitting revision_limit applies the default 3 and rounds_used default 0."
        test_recipe:
          setup: ["A DRAFT project under a studio."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A" }
              as: Designer
              captures: { con: $.data.id, rl: $.data.revision_limit }
          assert:
            - "Concept.${con}.revision_limit == 3"
            - "Concept.${con}.rounds_used == 0 and Concept.${con}.status == DRAFT"

      - name: license_billable_computed_input_billable_ignored
        claim_type: Computed Fields
        grounds:
          - entities.License.fields.billable_cents
          - entities.Studio.fields.license_markup_pct
        distinguishing_aspect: "billable_cents is computed (cost_cents=2000, markup 0.10 -> 2200); a client-supplied billable_cents in the body is ignored."
        test_recipe:
          setup: ["Studio license_markup_pct=0.10, activated project."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S", license_markup_pct: 0.10 }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "WEB", deposit_pct: 0.20 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 50000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
          trigger:
            - call: "POST /studios/${sid}/licenses"
              payload: { project_id: "${pid}", kind: "STOCK", cost_cents: 2000, valid_from: "2026-03-01T00:00:00Z", valid_until: "2026-03-10T00:00:00Z" }
              as: StudioOps
              captures: { lic: $.data.id, b: $.data.billable_cents }
          assert:
            - "License.${lic}.billable_cents == 2200 (computed; any client-supplied value ignored)"
            - "License.${lic}.status == RESERVED"

      - name: project_status_system_assigned_draft_on_create
        claim_type: System Fields
        grounds:
          - entities.Project.fields.status
        distinguishing_aspect: "Project.status is system-assigned DRAFT on create regardless of any status value sent in the body."
        test_recipe:
          setup: ["A studio and ACTIVE client."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id, st: $.data.status }
          assert:
            - "Project.${pid}.status == DRAFT"
            - "Project.${pid}.base_scope_cents == 0 and Project.${pid}.deposit_collected_cents == 0"

      - name: create_project_invalid_service_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Project.fields.service_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST project with service_type='POSTER' (not in {LOGO,IDENTITY,WEB}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A studio and ACTIVE client."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "POSTER", deposit_pct: 0.30 }
              as: StudioOps
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: license_invalid_interval_from_after_until_rejected
        claim_type: Type Constraints
        grounds:
          - entities.License.fields.valid_from
          - entities.License.fields.valid_until
          - errors[ERR_INVALID_INTERVAL]
        distinguishing_aspect: "POST license with valid_from >= valid_until returns ERR_INVALID_INTERVAL (400) before any overlap check."
        test_recipe:
          setup: ["Activated project."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "WEB", deposit_pct: 0.20 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 20000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
          trigger:
            - call: "POST /studios/${sid}/licenses"
              payload: { project_id: "${pid}", kind: "STOCK", cost_cents: 1000, valid_from: "2026-03-10T00:00:00Z", valid_until: "2026-03-01T00:00:00Z" }
              as: StudioOps
          assert:
            - "error_id == ERR_INVALID_INTERVAL and HTTP status == 400"

      - name: project_create_with_wrong_parent_studio_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Project.parent
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST project under a non-existent studioId returns ERR_NOT_FOUND (404); child requires valid parent."
        test_recipe:
          setup: ["No studio with the queried id; a real client cannot exist without a studio, so a literal non-existent studio path is used."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios/00000000-0000-4000-8000-000000000000/projects"
              payload: { client_id: "00000000-0000-4000-8000-000000000001", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: hybrid_cross_aggregate_invoice_references_milestone
        claim_type: hybrid
        grounds:
          - entities.Invoice.fields.milestone_id
          - entities.Invoice.fields.project_id
        distinguishing_aspect: "Cross-aggregate association: an Invoice issued for a milestone carries milestone_id and project_id matching that milestone's project (hybrid topology integrity)."
        test_recipe:
          setup: ["Project in DELIVERY with a 40000 milestone; deposit 12000 collected."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S", tax_rate: 0.0 }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 40000, sequence_index: 1 }
              as: StudioOps
              captures: { mid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/deposits"
              payload: { amount_cents: 12000 }
              as: BillingOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A" }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
          trigger:
            - call: "POST /studios/${sid}/invoices"
              payload: { milestone_id: "${mid}", due_date: "2026-04-01T00:00:00Z" }
              as: BillingOps
              captures: { inv: $.data.id }
          assert:
            - "Invoice.${inv}.milestone_id == ${mid}"
            - "Invoice.${inv}.project_id == ${pid}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: moodboard_approve_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Moodboard.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a Moodboard still in DRAFT (not SUBMITTED) returns ERR_INVALID_STATE (409); no transition defined from DRAFT to APPROVED."
        test_recipe:
          setup: ["Project in DISCOVERY with a DRAFT moodboard."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP status == 409"

      - name: moodboard_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.Moodboard
          - entities.Moodboard.fields.status
        distinguishing_aspect: "A newly created Moodboard starts in initial_state DRAFT."
        test_recipe:
          setup: ["Project in DISCOVERY."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id, st: $.data.status }
          assert:
            - "Moodboard.${mb}.status == DRAFT"

      - name: project_terminal_completed_locked_no_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Project
          - state_machines.Project.HANDOFF_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED project rejects advance/cancel with ERR_INVALID_STATE (409); COMPLETED is terminal."
        test_recipe:
          setup: ["A COMPLETED project (full happy path through handoff and complete)."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S", tax_rate: 0.0 }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.0 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A" }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/deliverables"
              payload: { asset_type: "BRAND_GUIDE", is_required_for_handoff: true }
              as: Designer
              captures: { del: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/deliverables/${del}/deliver"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/deliverables/${del}/accept"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/complete"
              payload: {}
              as: StudioOps
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/cancel"
              payload: {}
              as: StudioOps
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP status == 409 (COMPLETED is terminal)"

      - name: moodboard_double_approve_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Moodboard.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an already-APPROVED moodboard a second time returns ERR_INVALID_STATE (409); APPROVED is terminal for Moodboard."
        test_recipe:
          setup: ["Project in DISCOVERY with a moodboard already APPROVED."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          trigger:
