  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: referenced_employee_missing_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_REFERENCED_NOT_FOUND]
        distinguishing_aspect: "POST /er/cases with a body-referenced subject_employee_id that does not exist returns 422 ERR_REFERENCED_NOT_FOUND (distinct from path-based 404 ERR_NOT_FOUND)."
        test_recipe:
          setup:
            - "One intake channel exists; no employees exist."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hot V", default_category: "HARASSMENT", default_severity: "MEDIUM", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
          trigger:
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", subject_employee_id: "00000000-0000-4000-8000-000000000000", category: "HARASSMENT", severity: "MEDIUM" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCED_NOT_FOUND"
            - "http status == 422"

      - name: interview_documentation_below_minimum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_DOCUMENTATION_STANDARD]
        distinguishing_aspect: "Completing an interview with documentation_text of 49 characters returns 422 ERR_DOCUMENTATION_STANDARD; the interview remains SCHEDULED."
        test_recipe:
          setup:
            - "A case in INVESTIGATING with one SCHEDULED interview whose scheduled_start is in the past relative to the logical clock."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hot Doc", default_category: "HARASSMENT", default_severity: "MEDIUM", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-9901", full_name: "Rep Doc", email: "r9901@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9901", full_name: "Sub Doc", email: "s9901@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9901", full_name: "Inv Doc", email: "i9901@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "MEDIUM" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${sub}", scheduled_start: "2026-07-27T09:00:00Z", scheduled_end: "2026-07-27T10:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv1: $.data.id }
          trigger:
            - call: "POST /er/interviews/${iv1}/complete"
              payload: { documentation_text: "Too short to satisfy the fifty char rule." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DOCUMENTATION_STANDARD (49 characters < 50)"
            - "http status == 422"
            - "Interview.${iv1}.status remains SCHEDULED"

      - name: capacity_boundary_assign_at_max_minus_one_then_at_max
        claim_type: boundary_condition
        grounds:
          - validations[priority=14]
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.Investigator.fields.active_case_count
        distinguishing_aspect: "With max_active_cases == 1, the first assignment succeeds (active_case_count 0 < 1); a second assignment to the same investigator is rejected with ERR_CAPACITY_EXCEEDED because active_case_count == 1 is NOT < 1 (>= boundary)."
        test_recipe:
          setup:
            - "Investigator INV1 with max_active_cases == 1; two TRIAGE cases C1 and C2."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "WEB_PORTAL", display_name: "Portal Cap", default_category: "COMPENSATION", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
