          trigger:
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pg_id}", customer_account_id: "${gca_id}", receiver_routing_number: "021000089", amount_cents: 900000000, expected_position_account_version: "${gacct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-gamma-01"
          assert:
            - "Four rules are violated at once: priority 65 (RECEIVE_ONLY may not send), priority 92 (900000000 > 250000000), priority 94 (900000000 > rolling_window_amount_limit_cents 400000000) and priority 95 (900000000 > daily_aggregate_limit_cents 500000000)"
            - "The response is HTTP 422 with error_id == ERR_SEND_NOT_PERMITTED_FOR_MODEL"
            - "The response is NOT ERR_PER_TRANSACTION_LIMIT_EXCEEDED, ERR_VELOCITY_LIMIT_EXCEEDED or ERR_DAILY_LIMIT_EXCEEDED"
            - "No CreditTransfer row exists for participant ${pg_id} and PrefundedPositionAccount.${gacct_id}.reserved_cents == 0"
            - "Participant.${pg_id}.operational_posture == NORMAL and enrollment_status == LIVE, so no state-category rule could have produced the error"

  - rule_id: boundary_precision_check
    instances:
      - name: balance_exactly_at_critical_threshold_is_red
        grounds:
          - calculations.liquidity_alert_tier
          - calculations.operational_posture_derivation
          - entities.PrefundedPositionAccount.fields.alert_tier
          - entities.LiquidityLedgerEntry.fields.balance_after_cents
        distinguishing_aspect: |
          The tier boundary is inclusive on the lower band: a balance of exactly
          critical_threshold_cents is RED, not AMBER, and one cent more is AMBER - and the two
          answers cascade to different postures (SEND_FROZEN vs THROTTLED) and different alert
          threshold_cents (critical vs warning), so an off-by-one comparison is visible in four
          places rather than one.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account opened at 1,200,000,000 cents, warning_threshold_cents 1,100,000,000, critical_threshold_cents 1,000,000,000 and floor_cents 200,000,000; alert_tier is GREEN and the posture is NORMAL."
            - "No transfers exist, so reserved_cents is 0 and the tier is driven purely by the ledger."
            - "The clock stays at 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /position-accounts/${acct_id}/ledger-adjustments"
              payload: { entry_type: "WITHDRAWAL_DEBIT", magnitude_cents: 200000000, reference: "Return of surplus prefunding" }
              as: LiquidityOfficer
              as_user_id: "liq-01"
          assert:
            - "The ledger entry has entry_type WITHDRAWAL_DEBIT, amount_cents == -200000000, balance_after_cents == 1000000000 and sequence_no == 1"
            - "PrefundedPositionAccount.${acct_id}.current_balance_cents == 1000000000, which equals critical_threshold_cents exactly"
            - "PrefundedPositionAccount.${acct_id}.alert_tier == RED (the comparison is <=, so equality is RED, not AMBER)"
            - "Exactly 1 LiquidityAlert exists with tier RED, status OPEN, threshold_cents == 1000000000 and observed_balance_cents == 1000000000"
            - "Participant.${pa_id}.operational_posture == SEND_FROZEN"
            - "One cent above the boundary flips all four answers: repeating the identical setup with magnitude_cents 199999999 leaves current_balance_cents 1000000001, alert_tier AMBER, a single AMBER alert with threshold_cents 1100000000, and operational_posture THROTTLED"
            - "The floor boundary is inclusive the other way: a balance of exactly floor_cents is RED and not BREACH, so a further withdrawal of 800000000 from the RED position leaves current_balance_cents 200000000 with alert_tier RED"

      - name: empty_input_reconciliation_variance_at_tolerance_edge
        grounds:
          - calculations.reconciliation_variance
          - state_machines.SettlementCycle.CUTOFF_to_RECONCILING
          - entities.ReconciliationRun.fields.revision
          - global_constants.VARIANCE_TOLERANCE_CENTS
        distinguishing_aspect: |
          Two edges at once: an empty input set (a cycle with zero settled transfers, so
          rail_net_position_cents is 0 and included_transfer_count is 0 rather than an error) and
          the variance tolerance boundary, where abs(variance) == 100 is BALANCED and 101 is
          OUT_OF_BALANCE. The empty cutoff also assesses a zero fee and must post NO FEE_DEBIT
          entry, which distinguishes "no fee" from "a fee of zero".
          - Also proves revision starts at 1 for the first run of the triple.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account of 1,200,000,000 cents and no transfers of any kind."
            - "Settlement cycle 2026-08-03 is created OPEN and then taken to CUTOFF at 2026-08-03T23:00:00Z; because no transfers settled, the assessed intraday liquidity access fee is zero."
            - "The clock is 2026-08-03T23:30:00Z when the core banking system files its FINAL run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { cyc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T23:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /settlement-cycles/${cyc_id}/cutoff"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T23:30:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /reconciliation-runs"
              payload: { settlement_cycle_id: "${cyc_id}", participant_id: "${pa_id}", variant: "FINAL", core_deposit_total_cents: 100 }
              as: CoreBankingSystem
              as_user_id: "core-alpha-01"
          assert:
            - "The empty cutoff left SettlementCycle.${cyc_id}.assessed_fee_total_cents == 0 and posted no ledger entry: GET /position-accounts/${acct_id}/ledger-entries returns 0 entries"
            - "PrefundedPositionAccount.${acct_id}.current_balance_cents == 1200000000 and alert_tier == GREEN after the cutoff"
            - "The run persists with rail_net_position_cents == 0, included_transfer_count == 0 and fee_component_cents == 0 (an empty input set is legal, not an error)"
            - "ReconciliationRun variance_cents == 100 and outcome == BALANCED (abs(variance) <= VARIANCE_TOLERANCE_CENTS uses <=, so exactly 100 balances)"
            - "ReconciliationRun revision == 1 and variant == FINAL"
            - "SettlementCycle.${cyc_id}.status == RECONCILING"
            - "One cent past the edge inverts the outcome: the identical setup with core_deposit_total_cents 101 yields variance_cents == 101, outcome == OUT_OF_BALANCE and SettlementCycle.${cyc_id}.status == OUT_OF_BALANCE"

      - name: fraud_score_exactly_at_hold_threshold_holds
        grounds:
          - calculations.fraud_score
          - global_constants.FRAUD_HOLD_THRESHOLD
          - state_machines.CreditTransfer.INITIATED_to_FRAUD_HOLD
          - entities.CreditTransfer.fields.fraud_reason_codes
        distinguishing_aspect: |
          The hold band is closed at its lower end: a score of exactly FRAUD_HOLD_THRESHOLD (60)
          holds, 59 clears straight through, and the boundary is reached only through the summed
          terms 28 + 20 + 0 + 12 against a CONSUMER multiplier of 1.00 - so the test also pins that
          the multiplier is applied (1.00 is not "skip the multiplication") and that the
