  # ===========================================================================
  - section: errors
    instances:
      - name: error_scanner_over_capacity_at_commit
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCANNER_OVER_CAPACITY]"]
        distinguishing_aspect: "Scanner capacity is enforced at COMMIT (page_count 60 > capacity 50), not at page-log time — the logs themselves are accepted."
        test_recipe:
          setup: ["client + agreement; SCANNING batch with one 60-page document; scanner capacity 50; OPEN session with 60 pages logged"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Cap Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 60, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-SM", capacity_pages_per_session: 50 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 60 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SCANNER_OVER_CAPACITY (60 > 50)"
            - "ScanSession.${ss}.status remains OPEN; Document.${d1}.status remains REGISTERED"

      - name: error_empty_scan_session_commit
        claim_type: violation_to_error
        grounds: ["errors[ERR_EMPTY_SCAN_SESSION]"]
        distinguishing_aspect: "Committing a session with zero page logs is a dedicated 409, distinct from the capacity error."
