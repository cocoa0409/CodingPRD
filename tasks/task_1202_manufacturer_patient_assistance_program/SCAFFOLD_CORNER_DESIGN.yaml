- section: state_machines
  instances:
  - name: screening_verify_from_draft_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.EligibilityScreening
    - errors[ERR_SCREENING_NOT_SUBMITTED]
    distinguishing_aspect: Verification decision on a DRAFT screening (never submitted) is rejected.
    test_recipe:
      setup:
      - program + patient + DRAFT screening
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
      - call: POST /pap/patients
        payload:
          full_name: Cal Cott
          date_of_birth: '1986-03-03'
          state_code: OH
        as: CaseWorker
        captures:
          pat_id: $.data.id
      - call: POST /pap/screenings
        payload:
          patient_id: ${pat_id}
          program_id: ${prog_id}
          household_size: 1
          income_basis: PRIOR_YEAR
          prior_year_income_cents: 3000000
          insurance_status: UNINSURED
        as: Patient
        as_user_id: ${pat_id}
        captures:
          scr_id: $.data.id
      trigger:
      - call: POST /pap/screenings/${scr_id}/decision
        payload:
          decision: VERIFIED
        as: CaseWorker
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_SCREENING_NOT_SUBMITTED; screening remains DRAFT
  - name: screening_submit_incomplete_docs_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.EligibilityScreening.DRAFT_to_SUBMITTED
    - errors[ERR_DOCUMENTS_INCOMPLETE]
    distinguishing_aspect: Only PROOF_OF_INCOME uploaded; IDENTITY missing -> submit rejected.
    test_recipe:
      setup:
      - program + patient + DRAFT screening with exactly one document (PROOF_OF_INCOME)
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
      - call: POST /pap/patients
        payload:
          full_name: Dot Dodd
          date_of_birth: '1978-06-06'
          state_code: OH
        as: CaseWorker
        captures:
          pat_id: $.data.id
      - call: POST /pap/screenings
        payload:
          patient_id: ${pat_id}
          program_id: ${prog_id}
          household_size: 1
          income_basis: PRIOR_YEAR
          prior_year_income_cents: 3000000
          insurance_status: UNINSURED
        as: Patient
        as_user_id: ${pat_id}
        captures:
          scr_id: $.data.id
      - call: POST /pap/screenings/${scr_id}/documents
        payload:
          doc_type: PROOF_OF_INCOME
          file_reference: s3://docs/poi-only.pdf
        as: Patient
        as_user_id: ${pat_id}
      trigger:
      - call: POST /pap/screenings/${scr_id}/submit
        payload: {}
        as: Patient
        as_user_id: ${pat_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DOCUMENTS_INCOMPLETE; screening remains DRAFT
  - name: screening_verify_with_pending_doc_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.EligibilityScreening.SUBMITTED_to_VERIFIED
    - errors[ERR_DOCUMENTS_NOT_ACCEPTED]
    distinguishing_aspect: Both required docs uploaded but IDENTITY still PENDING -> VERIFIED decision rejected.
    test_recipe:
      setup:
      - SUBMITTED screening; POI accepted, IDENTITY pending
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
      - call: POST /pap/patients
        payload:
          full_name: Edo Edd
          date_of_birth: '1973-09-09'
          state_code: OH
        as: CaseWorker
        captures:
          pat_id: $.data.id
      - call: POST /pap/screenings
        payload:
          patient_id: ${pat_id}
          program_id: ${prog_id}
          household_size: 1
          income_basis: PRIOR_YEAR
          prior_year_income_cents: 3000000
          insurance_status: UNINSURED
        as: Patient
        as_user_id: ${pat_id}
        captures:
          scr_id: $.data.id
      - call: POST /pap/screenings/${scr_id}/documents
        payload:
          doc_type: PROOF_OF_INCOME
          file_reference: s3://docs/poi-e2.pdf
        as: Patient
        as_user_id: ${pat_id}
        captures:
          dp1: $.data.id
      - call: POST /pap/screenings/${scr_id}/documents
        payload:
          doc_type: IDENTITY
          file_reference: s3://docs/id-e2.pdf
        as: Patient
        as_user_id: ${pat_id}
      - call: POST /pap/documents/${dp1}/review
        payload:
          decision: ACCEPTED
        as: CaseWorker
      - call: POST /pap/screenings/${scr_id}/submit
        payload: {}
        as: Patient
        as_user_id: ${pat_id}
      trigger:
      - call: POST /pap/screenings/${scr_id}/decision
        payload:
          decision: VERIFIED
        as: CaseWorker
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DOCUMENTS_NOT_ACCEPTED; screening remains SUBMITTED
  - name: application_claim_twice_rejected
    claim_type: idempotency
    grounds:
    - state_machines.Application.SUBMITTED_to_UNDER_REVIEW
    - errors[ERR_APPLICATION_NOT_SUBMITTED]
    distinguishing_aspect: Second claim on an already-claimed application fails; the first claim's reviewer is unchanged.
    test_recipe:
      setup:
      - golden path through application claim by cw_1 (UNDER_REVIEW)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
      - call: POST /pap/budget-periods
        payload:
          program_id: ${prog_id}
          period_start: '2026-01-01'
          period_end: '2026-12-31'
          allocated_cents: 1000000
        as: ProgramAdministrator
      - call: POST /pap/patients
        payload:
          full_name: Fox Fry
          date_of_birth: '1984-04-04'
          state_code: OH
        as: CaseWorker
        captures:
          pat_id: $.data.id
      - call: POST /pap/screenings
        payload:
          patient_id: ${pat_id}
          program_id: ${prog_id}
          household_size: 1
          income_basis: PRIOR_YEAR
          prior_year_income_cents: 3000000
          insurance_status: UNINSURED
        as: Patient
        as_user_id: ${pat_id}
        captures:
          scr_id: $.data.id
      - call: POST /pap/screenings/${scr_id}/documents
        payload:
          doc_type: PROOF_OF_INCOME
          file_reference: s3://docs/poi-f2.pdf
        as: Patient
        as_user_id: ${pat_id}
        captures:
          df1: $.data.id
      - call: POST /pap/screenings/${scr_id}/documents
        payload:
          doc_type: IDENTITY
          file_reference: s3://docs/id-f2.pdf
        as: Patient
        as_user_id: ${pat_id}
        captures:
          df2: $.data.id
      - call: POST /pap/documents/${df1}/review
        payload:
          decision: ACCEPTED
        as: CaseWorker
      - call: POST /pap/documents/${df2}/review
        payload:
          decision: ACCEPTED
        as: CaseWorker
      - call: POST /pap/screenings/${scr_id}/submit
        payload: {}
        as: Patient
        as_user_id: ${pat_id}
      - call: POST /pap/screenings/${scr_id}/decision
        payload:
          decision: VERIFIED
        as: CaseWorker
      - call: POST /pap/applications
        payload:
          patient_id: ${pat_id}
          program_id: ${prog_id}
          screening_id: ${scr_id}
        as: Patient
        as_user_id: ${pat_id}
        captures:
          app_id: $.data.id
      - call: POST /pap/applications/${app_id}/claim
        payload: {}
        as: CaseWorker
        as_user_id: cw_1
      trigger:
      - call: POST /pap/applications/${app_id}/claim
        payload: {}
        as: CaseWorker
        as_user_id: cw_2
        captures:
          err: $.data.error_id
      - call: GET /pap/applications/${app_id}
        payload: {}
        as: CaseWorker
