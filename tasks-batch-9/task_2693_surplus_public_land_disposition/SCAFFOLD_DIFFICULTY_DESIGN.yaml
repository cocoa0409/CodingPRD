  - rule_id: cross_entity_state_dependency
    instances:
      - name: offering_create_depends_on_accepted_appraisal_validity_window
        grounds:
          - validations[priority=43]
          - state_machines.Appraisal.ACCEPTED_to_EXPIRED
          - state_machines.DispositionOffering.null_to_DRAFT
          - entities.Appraisal.fields.expires_on
          - entities.Parcel.fields.valuation_status
          - errors[ERR_APPRAISAL_EXPIRED]
        distinguishing_aspect: |
          The dependency pair is DispositionOffering <- Appraisal, and it is a
          FOREIGN entity's temporal state that gates the write: the declaration
          is already OFFERING_AUTHORIZED and every field of the POST /offerings
          payload is valid, yet the create is refused with ERR_APPRAISAL_EXPIRED
          (409) because the ACCEPTED Appraisal on the parcel reached its
          expires_on instant (2027-08-01T00:00:00Z, exactly effective_date
          2026-08-01T00:00:00Z + 365 days). The refused call is not inert - it
          drives the Appraisal ACCEPTED -> EXPIRED and flips
          Parcel.valuation_status to STALE - and the identical offering payload
          succeeds only after a NEW appraisal is ordered, reported and accepted.
        test_recipe:
          setup:
            - "One custodian Agency, one TRANSIT Agency that DECLINES its notice, one Parcel, one CURED TitleCurativeItem at 250000."
            - "One Appraiser licensed through 2028-01-01T00:00:00Z."
            - "An Appraisal reported with effective_date 2026-08-01T00:00:00Z and ACCEPTED, so expires_on is exactly 2027-08-01T00:00:00Z and Parcel.valuation_status is CURRENT."
            - "The declaration adopted, EXEMPT environmental review certified, notice declined, preference window closed and COMPETITIVE_SALE disposition authorized - all at the default clock 2026-08-01T00:00:00Z."
            - "The logical clock then advanced to exactly 2027-08-01T00:00:00Z, the appraisal's expires_on instant."
