          Cycle-with-exhaustion shape: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED loops on the same
          row, and the identical REQUEST_REVISION trigger branches to a different target once
          revision_round reaches max_revision_rounds — the second decision does not repeat the first
          outcome but rewrites all four budgeted amounts from the prior fiscal year at 1.03.
