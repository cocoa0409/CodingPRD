# ===========================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - SKILL.md §1.9 breadth index for
# task_2189 Residency Match & Interview Season Management
#
# One `- section:` block per claim-extraction-guide table, walked against
# SCAFFOLD.yaml §1.0-§1.7. Every instance either carries a full test_recipe
# or is an `excluded_because:` stub naming the §1.8 instance that already
# owns its corner - names are unique across the union of §1.8 and §1.9.
#
# Fixture conventions used throughout:
#   - the logical clock is pinned explicitly before every chain
#   - `Metro Internal Medicine` (IM, code 1140140M0) is the default program
#   - applicants E-9001..E-9004 score 251 / 240 / 232 / 228 on Step 2, and
#     E-9001 alone is a pipeline_program_alum, so two (30, 20, 20) reviews
#     give final_screen_score 33.50 / 28.50 / 26.50 / 26.50
#   - faculty: Iris Kwon is the program director, Alan Reyes the committee
#     member and panel LEAD, Bea Osei the panel MEMBER
# ===========================================================================
scaffold_corner_design:

  # ===========================================================================
  # Entities - Table 1 of the claim-extraction guide walked against §1.1.
  # The `Immutability` row yields no instance: every entity here declares
  # `common_fields: true`, so no immutable-entity claim exists to extract.
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_with_every_declared_field_returns_201_and_echoes_them
        claim_type: creation
        grounds:
          - entities.Program
          - endpoints.POST /programs
        distinguishing_aspect: >
          A create that supplies all eight declared input fields returns 201 with every one of them echoed
          unchanged AND with the four computed counters plus season_phase already initialised in the same
          response body - not left absent for a later GET to fill in.
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 3, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
          assert:
            - "the trigger returns HTTP 201"
            - "data.name == 'Metro Internal Medicine' and data.nrmp_program_code == '1140140M0'"
            - "data.specialty_code == 'IM' and data.quota_positions == 3"
            - "data.visa_sponsorship_allowed == true and data.soap_participating == true"
            - "data.min_step2_score == 220 and data.img_accepted == true"
            - "data.season_phase == 'PRE_SEASON'"
            - "data.matched_count == 0 and data.invited_count == 0 and data.soap_offer_budget == 0"
            - "data.rank_list_certified_at == null"
            - "data.id is a non-empty string the client never supplied"

      - name: program_get_by_id_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - entities.Program
          - endpoints.GET /programs/{id}
        distinguishing_aspect: >
          The read-back of a created Program returns the same id and the same field values the create
          returned, so the row is persisted rather than synthesised per request.
        test_recipe:
          setup:
            - "one Program created with quota_positions 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 3, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 200"
            - "data.id == ${prog_id}"
            - "data.nrmp_program_code == '1140140M0' and data.quota_positions == 3"
            - "data.season_phase == 'PRE_SEASON'"

      - name: applicant_list_with_limit_one_reports_total_count_two_and_has_more_true
        claim_type: listing
        grounds:
          - entities.Applicant
          - endpoints.GET /applicants
          - response_envelope.pagination
        distinguishing_aspect: >
          With two Applicant rows and limit 1 the envelope reports limit 1, offset 0, total_count 2 and
          has_more true: total_count counts the whole matching set rather than the page, and has_more is
          derived from offset + returned < total_count, so page two flips it to false.
        test_recipe:
          setup:
            - "two Applicant rows and no other entities"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { eras_id: "E-9002", full_name: "Omar Diaz", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 240, pipeline_program_alum: false, self_identified_group: "GROUP_B" }
              as: NrmpAdmin
              captures: { cand2_id: "$.data.id" }
          trigger:
            - call: "GET /applicants"
              payload: { limit: 1, offset: 0 }
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 200 and the data array holds exactly 1 row"
            - "the list envelope reports limit == 1 and offset == 0"
            - "the list envelope reports total_count == 2 and has_more == true"
            - "a second call with limit 1 and offset 1 reports has_more == false and total_count == 2"

      - name: program_get_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_RESOURCE_NOT_FOUND
          - endpoints.GET /programs/{id}
          - validations.priority 3
        distinguishing_aspect: >
          A syntactically valid but unknown path id is 404 ERR_RESOURCE_NOT_FOUND, not 422: the existence
          check at priority 3 runs ahead of every body-shape check at priority 4.
        test_recipe:
          setup:
            - "one unrelated Program exists, so the store is not empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "GET /programs/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 404 with data.error_id == 'ERR_RESOURCE_NOT_FOUND'"
            - "the pre-existing Program ${prog_id} is unaffected and still readable"

      - name: applicant_create_missing_the_required_step2_score_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Applicant.step2_score
          - validations.priority 4
          - errors.ERR_VALIDATION
        distinguishing_aspect: >
          step2_score is `source: input` with no declared default, so omitting it is a body-shape violation
          at priority 4 - HTTP 422 ERR_VALIDATION - and no partial Applicant row is written.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN" }
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 422 with data.error_id == 'ERR_VALIDATION'"
            - "GET /applicants reports total_count == 0, so no partial row was written"

      - name: program_create_omitting_the_optional_inputs_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Program.min_step2_score
          - entities.Program.img_accepted
          - entities.Program.visa_sponsorship_allowed
          - entities.Program.soap_participating
        distinguishing_aspect: >
          Supplying only the four required inputs yields min_step2_score 220 and false for all three boolean
          flags - the declared defaults - rather than null or an omitted key.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "County Pathology", nrmp_program_code: "1140300P0", specialty_code: "PATH", quota_positions: 1 }
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 201"
            - "data.min_step2_score == 220"
            - "data.visa_sponsorship_allowed == false and data.soap_participating == false"
            - "data.img_accepted == false"
            - "data.season_phase == 'PRE_SEASON' and data.matched_count == 0"

      - name: application_review_count_and_provisional_score_are_computed_from_the_reviews
        claim_type: computed_fields
        grounds:
          - entities.Application.review_count
          - entities.Application.provisional_screen_score
          - calculations.screen_composite_score
        distinguishing_aspect: >
          review_count and provisional_screen_score are `source: computed` - the client never sends them.
          After a second (30, 20, 20) review they read exactly 2 and 24.50 (0.45*30 + 0.30*20 + 0.25*20),
          screening_status is already UNDER_REVIEW, and final_screen_score is still null because no
          screening decision has been recorded.
        test_recipe:
          setup:
            - "one Program in REVIEW_OPEN, two reviewers, and one Application holding one review"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Iris Kwon", is_program_director: true, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { pd_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand1_id}" }
              as: ProgramCoordinator
              captures: { app1_id: "$.data.id" }
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f1_id}"
          trigger:
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f2_id}"
          assert:
            - "the trigger returns HTTP 201"
            - "Application.${app1_id}.review_count == 2"
            - "Application.${app1_id}.provisional_screen_score == 24.50"
            - "Application.${app1_id}.screening_status == 'UNDER_REVIEW'"
            - "Application.${app1_id}.final_screen_score == null"

      - name: applicant_create_mints_the_system_fields_the_client_cannot_supply
        claim_type: system_fields
        grounds:
          - entities.Applicant
          - endpoints.POST /applicants
        distinguishing_aspect: >
          id, created_at, updated_at and version are minted server-side: two creates of the same shape
          produce two different ids, and all four fields are present and non-null on each response.
        test_recipe:
          setup:
            - "one Applicant already exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: "$.data.id" }
          trigger:
            - call: "POST /applicants"
              payload: { eras_id: "E-9002", full_name: "Omar Diaz", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 240, pipeline_program_alum: false, self_identified_group: "GROUP_B" }
              as: NrmpAdmin
              captures: { cand2_id: "$.data.id" }
          assert:
            - "the trigger returns HTTP 201"
            - "data.id, data.created_at, data.updated_at and data.version are all present and non-null"
            - "${cand2_id} != ${cand1_id}"
            - "data.version is an integer"

      - name: applicant_create_with_an_undeclared_enum_member_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Applicant.medical_school_type
          - validations.priority 4
          - errors.ERR_VALIDATION
        distinguishing_aspect: >
          medical_school_type is constrained to US_MD, US_DO, IMG, so 'CARIBBEAN_MD' is an
          enum-membership violation caught at priority 4 with 422 ERR_VALIDATION.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "CARIBBEAN_MD", visa_status: "US_CITIZEN", step2_score: 251 }
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 422 with data.error_id == 'ERR_VALIDATION'"
            - "GET /applicants reports total_count == 0"

      - name: applicant_create_above_the_declared_step2_range_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Applicant.step2_score
          - validations.priority 4
          - errors.ERR_VALIDATION
        distinguishing_aspect: >
          step2_score is constrained to 1..300, so 301 is a numeric-range violation - a different failure
          mode from enum membership, and one that must be caught even though the field is present and of
          the right type.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 301 }
              as: NrmpAdmin
          assert:
            - "the trigger returns HTTP 422 with data.error_id == 'ERR_VALIDATION'"
            - "GET /applicants reports total_count == 0"

      - name: application_create_with_an_unknown_applicant_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Application.applicant_id
          - validations.priority 3
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: >
          Priority 3 validates body foreign keys as well as path ids: an unknown applicant_id is 404
          ERR_RESOURCE_NOT_FOUND even though the program_id in the very same body resolves.
        test_recipe:
          setup:
            - "one Program in REVIEW_OPEN and no Applicant rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Iris Kwon", is_program_director: true, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { pd_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "11111111-1111-4111-8111-111111111111" }
              as: ProgramCoordinator
          assert:
            - "the trigger returns HTTP 404 with data.error_id == 'ERR_RESOURCE_NOT_FOUND'"
            - "GET /applications with program_id ${prog_id} reports total_count == 0"

      - name: two_faculty_members_on_one_slot_form_a_traversable_junction_pair
        claim_type: graph
        grounds:
          - entities.InterviewAssignment
          - endpoints.GET /interview-assignments
          - complexity_profile.entity_topology
        distinguishing_aspect: >
          InterviewAssignment is the many-to-many junction of InterviewSlot and FacultyMember, and it is
          traversable from both ends: filtered by slot_id it returns the 2 panel rows, filtered by
          faculty_member_id it returns the 1 seat that member holds.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN with two faculty members and one unstaffed slot"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Iris Kwon", is_program_director: true, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { pd_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand1_id}" }
              as: ProgramCoordinator
              captures: { app1_id: "$.data.id" }
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f1_id}"
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f2_id}"
            - call: "POST /applications/${app1_id}/screen"
              payload: { decision: "ADVANCE" }
              as: ProgramCoordinator
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "INTERVIEWS_OPEN" }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 1, invite_release_at: "2026-10-01T12:00:00Z", response_deadline_at: "2026-10-08T12:00:00Z", seat_capacity: 1 }
              as: ProgramCoordinator
              captures: { wave1_id: "$.data.id" }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-05T13:00:00Z", end_at: "2026-10-05T16:00:00Z", room_label: "A-1", applicant_capacity: 1 }
              as: ProgramCoordinator
              captures: { slot1_id: "$.data.id" }
          trigger:
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot1_id}", faculty_member_id: "${f1_id}", panel_role: "LEAD" }
              as: ProgramCoordinator
              captures: { asg1_id: "$.data.id" }
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot1_id}", faculty_member_id: "${f2_id}", panel_role: "MEMBER" }
              as: ProgramCoordinator
              captures: { asg2_id: "$.data.id" }
          assert:
            - "both trigger calls return HTTP 201 with status 'ASSIGNED'"
            - "GET /interview-assignments with slot_id ${slot1_id} reports total_count == 2"
            - "the two rows carry faculty_member_id ${f1_id} and ${f2_id} with panel_role 'LEAD' and 'MEMBER'"
            - "GET /interview-assignments with faculty_member_id ${f1_id} reports total_count == 1"


  # ===========================================================================
  # State machines - Table 2 rows across the 12 machines of §1.2, plus the
  # `branching` shape row and the side-effect pattern rows. The deep
  # fork/join, parallel-dimension and compensation corners are already
  # owned by §1.8 and are stubbed here.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: rank_list_create_starts_in_draft_with_no_entries_and_round_zero
        claim_type: initial_state
        grounds:
          - state_machines.RankList.initial_state
          - entities.RankList.review_round
          - endpoints.POST /rank-lists
        distinguishing_aspect: >
          A freshly created RankList is DRAFT with entry_count 0 AND review_round 0 - the round counter
          starts at zero and is first incremented by the submit-to-committee transition, so a brand new
          list is not already in round 1.
        test_recipe:
          setup:
            - "one Program in RANKING that owns no rank list yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
