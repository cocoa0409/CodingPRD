            - call: "POST /nature-center/program-offerings/${off2_id}/materials"
              payload: { phase: "PRE_VISIT", url_slug: "forest-pre" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off2_pre: $.data.id }
            - call: "POST /nature-center/program-offerings/${off2_id}/materials"
              payload: { phase: "POST_VISIT", url_slug: "forest-post" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off2_post: $.data.id }
            - call: "POST /nature-center/curriculum-materials/${off2_pre}/publish"
              payload: {}
