            - "Youth.${pri_youth_id}.risk_posture == FROZEN"
            - "SafetyScreening.${pri_scr_id}.status == ESCALATED"
            - "ShelterProgram.${pri_program_id}.occupied_beds == 0"

      - name: logical_clock_refuses_to_move_backwards
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors.ERR_CLOCK_MONOTONIC_VIOLATION
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The clock is strictly increasing: after being set to 2026-08-05T00:00:00Z, a request for 2026-08-04T00:00:00Z returns 422 ERR_CLOCK_MONOTONIC_VIOLATION and the clock is unmoved - the following legal set reports previous_utc 2026-08-05T00:00:00Z, which it could not do if the rejected value had landed."
        test_recipe:
          setup:
            - "one program exists so the database is not empty, and the clock has been advanced once from its default to 2026-08-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { clk_program_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { clk_err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:01Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the backwards request returns HTTP 422 with error_id ERR_CLOCK_MONOTONIC_VIOLATION"
            - "the following legal set returns HTTP 200 with previous_utc 2026-08-05T00:00:00Z and current_utc 2026-08-05T00:00:01Z"
            - "a request for exactly the current clock value is equally rejected, since the comparison is strictly greater"

  - section: endpoints
    instances:
      - name: education_enrollment_is_immediate_then_verified_even_for_a_frozen_youth
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /ryhs/youths/{id}/education-enrollments]
          - endpoints[POST /ryhs/education-enrollments/{id}/verify-records]
          - entities.EducationEnrollment.fields.records_waived
          - calculations.youth_risk_posture
        distinguishing_aspect: "The school-enrollment right of an unaccompanied youth is unconditional: the enrollment succeeds with status IMMEDIATE_ENROLLMENT and records_waived true even while risk_posture is FROZEN by an ESCALATED screening, and verify-records then moves it to VERIFIED with verified_at stamped at the advanced clock."
        test_recipe:
          setup:
            - "youth Amal Traore, unaccompanied true, whose only SafetyScreening was dispositioned ESCALATED with specialized_response_code EMERGENCY_RELOCATION, so risk_posture is FROZEN"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Amal", legal_last_name: "Traore", date_of_birth: "2010-03-15", unaccompanied: true }
