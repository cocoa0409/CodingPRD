              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 40.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v3: "$.data.version", total_90: "$.data.component_share_total_pct" }
          trigger:
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_short: "$.data.error_id" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_c}", share_pct: 20.00, expected_formulation_version: "${f1v3}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_over: "$.data.error_id" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 10.00, expected_formulation_version: "${f1v3}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_dup: "$.data.error_id" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_c}", share_pct: 10.00, expected_formulation_version: "${f1v3}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { total_100: "$.data.component_share_total_pct", f1v4: "$.data.version" }
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { status: "$.data.status", qualified_at: "$.data.qualified_at", shale: "$.data.shale_share_pct", fe: "$.data.blend_iron_oxide_pct" }
          assert:
            - "${total_90} == 90.00 after the two setup appends"
            - "${e_short} == ERR_COMPONENT_SHARE_TOTAL_INVALID with HTTP 422 - qualify demands exactly 100.00, and 90.00 is not enough"
            - "${e_over} == ERR_COMPONENT_SHARE_TOTAL_INVALID with HTTP 422 - 90.00 + 20.00 would be 110.00"
            - "${e_dup} == ERR_COMPONENT_SHARE_TOTAL_INVALID with HTTP 422 - pit ${pit_a} is already a component, and a share of 10.00 would otherwise fit"
            - "${total_100} == 100.00 with ${f1v4} == ${f1v3} + 1 - only the third append is accepted, so the rejected pair never touched the total or the version"
            - "${status} == QUALIFIED with ${qualified_at} == 2026-08-01T00:00:00Z"
            - "${shale} == 40.00 and ${fe} == 6.000 - the chemistry rolls up the three accepted shares only"

  # =======================================================================
  # SECTION 6 - Errors
  # =======================================================================
  # Table 6 of the extraction guide supplies no rows of its own: the rule is that
  # every code in section 1.6 must be triggerable somewhere. The instances below
  # close the gaps left by the other sections of this file and by the difficulty
  # design. Codes already asserted elsewhere in THIS file and therefore not
  # repeated here: ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE,
  # ERR_ROLE_NOT_PERMITTED, ERR_PLANT_NOT_FOUND, ERR_CLAY_PIT_NOT_FOUND,
  # ERR_FORMULATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PLANT_IDLED,
  # ERR_FORMULATION_NOT_DRAFT, ERR_PRODUCTION_RUN_STATE_INVALID,
  # ERR_KILN_CAR_NOT_IDLE, ERR_LOT_QUARANTINED, ERR_ORDER_STATE_INVALID,
  # ERR_PANEL_STATE_INVALID, ERR_PANEL_NOT_APPROVED, ERR_DYE_LOT_MISMATCH,
  # ERR_DURABILITY_GRADE_NOT_MET, ERR_UNLOADING_EQUIPMENT_UNAVAILABLE,
  # ERR_UNLOADING_EQUIPMENT_MISMATCH, ERR_PIT_PLANT_MISMATCH,
  # ERR_COMPONENT_SHARE_TOTAL_INVALID, ERR_BLEND_OVER_ALLOCATION,
  # ERR_CLAY_RESERVE_INSUFFICIENT, ERR_INSUFFICIENT_BLEND_INVENTORY.
  # ERR_PLANT_SCOPE_VIOLATION and ERR_SEGREGATION_OF_DUTIES are covered by the
  # rbac section, ERR_STALE_VERSION by the complexity_layers section.
  - section: errors
    instances:
      - name: every_remaining_entity_not_found_code_is_reachable_from_a_dead_id
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PRODUCTION_RUN_NOT_FOUND]
          - errors[ERR_KILN_RUN_NOT_FOUND]
          - errors[ERR_FIRED_LOT_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_BLEND_NOT_FOUND]
          - errors[ERR_SAMPLE_PANEL_NOT_FOUND]
          - errors[ERR_KILN_CAR_NOT_FOUND]
          - errors[ERR_KILN_NOT_FOUND]
        distinguishing_aspect: "Kiln and KilnCar have no single-resource GET, so their 404s can only be reached through body foreign keys, which also pins down that an unresolvable kiln_id yields the 404 rather than a plant-scope 403."
        test_recipe:
          setup:
            - "One ACTIVE plant with a QUALIFIED formulation, so the two body-foreign-key probes get past every earlier rule in the ladder"
            - "No production runs, kiln runs, fired lots, orders, blends or sample panels exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
          trigger:
            - call: "GET /production-runs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { e_run: "$.data.error_id" }
            - call: "GET /kiln-runs/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { e_kr: "$.data.error_id" }
            - call: "GET /fired-lots/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { e_lot: "$.data.error_id" }
            - call: "GET /orders/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { e_order: "$.data.error_id" }
            - call: "GET /blends/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { e_blend: "$.data.error_id" }
            - call: "GET /sample-panels/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ArchitectReviewer
              as_user_id: "arch-001"
              captures: { e_panel: "$.data.error_id" }
            - call: "GET /fired-lots/00000000-0000-4000-8000-000000000003/blend-components"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { e_lot_nested: "$.data.error_id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "00000000-0000-4000-8000-000000000007", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { e_car: "$.data.error_id" }
            - call: "POST /kiln-runs"
              payload: { kiln_id: "00000000-0000-4000-8000-000000000008", formulation_id: "${f1}", run_code: "KR1", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-07T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { e_kiln: "$.data.error_id" }
          assert:
            - "${e_run} == ERR_PRODUCTION_RUN_NOT_FOUND, ${e_kr} == ERR_KILN_RUN_NOT_FOUND, ${e_lot} == ERR_FIRED_LOT_NOT_FOUND, all HTTP 404"
            - "${e_order} == ERR_ORDER_NOT_FOUND, ${e_blend} == ERR_BLEND_NOT_FOUND, ${e_panel} == ERR_SAMPLE_PANEL_NOT_FOUND, all HTTP 404"
            - "${e_lot_nested} == ERR_FIRED_LOT_NOT_FOUND - the outermost path segment is resolved first, so the nested collection reports the parent's 404 rather than an empty array"
            - "${e_car} == ERR_KILN_CAR_NOT_FOUND with HTTP 404 - the plant_id and formulation_id in the same body both resolve, so only the car is at fault"
            - "${e_kiln} == ERR_KILN_NOT_FOUND with HTTP 404, not ERR_PLANT_SCOPE_VIOLATION: the owning plant cannot be derived from an unresolvable kiln_id, so the priority 5 scope check is skipped"
            - "Every one of these responses carries response_type error with a non-empty data.message"

      - name: duplicate_code_scope_is_global_for_plants_and_per_plant_for_pit_names
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_CODE]
          - validations[priority=34]
        distinguishing_aspect: "The same code is replayed twice in two different scopes, so an implementation that puts every uniqueness index on the same scope fails one half of the instance whichever scope it picks."
        test_recipe:
          setup:
